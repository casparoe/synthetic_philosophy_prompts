answer: |-
  The Oak Creek School Board, facing a state-mandated budget cut, unanimously votes to adopt a "Program Enhancement Policy" allowing parents to purchase supplemental technology packages for their child's specific classroom. The policy is codified in the public handbook, applies uniformly to any parent who submits payment, and all revenue flows directly into the district's general fund to preserve teacher salaries, with no administrator receiving commissions or bonuses. Within a year, classrooms in wealthy neighborhoods are equipped with new laptops and coding kits funded by parents, while classrooms in low-income zones rely on decade-old textbooks, creating a visible two-tier system within the same public district despite every transaction following the written procedure.

  **Analysis of the Conceptions**
  Under the **office-and-rules conception**, this scenario is **not corrupt**. The officials followed every written rule, the vote was unanimous and public, and crucially, no official gained a private advantage (no bribes, no kickbacks, no personal enrichment). The revenue even served a public purpose (saving teacher jobs). Because the *process* was impartial and the *intent* was fiscal stability rather than private gain, the office-and-rules view sees this as hard choices in governance, not corruption.

  Under the **outcome-and-inequality conception**, this scenario **is corrupt**. The policy converts a public good (equal education) into a commodity available only to those with private wealth. The "exchange" here is between the district and wealthy parents: the district sells differential access to public resources, and the parents buy advantage for their children. This structurally entrenches inequality by ensuring wealthy students get better tools than poor students within the same system, effectively "cheating the public" promise of universal education even though no law was broken.

  **The Single Feature**
  The feature driving the disagreement is the **monetization of differential access within a universal system**. The policy legally allows money to determine the quality of public service received. The office-and-rules view sees this as a legitimate revenue stream; the outcome-and-inequality view sees it as the sale of public duty.

  **Removing the Feature**
  If you remove the ability to pay for specific classroom enhancements (banning the monetization), the case collapses into ordinary politics. The board would simply have to choose between raising taxes, cutting programs equally for everyone, or lobbying the state for more funds. These are standard distributive conflicts, not corruption, because the link between private wealth and public service quality is severed.

  **The Office-and-Rules Defense**
  A defender of the office-and-rules conception would attack this case by arguing against **concept creep**. They would claim that labeling this "corruption" dilutes the word until it means nothing. Their argument would be: "Corruption requires a *deviation* from the rules for *private gain by the official*. If we call every unfair policy 'corruption,' we lose the ability to distinguish between a bad law and a stolen election." They would reframe this as unfortunate but legitimate governance, insisting that inequality is a problem for voting and policy reform, not for anti-corruption enforcement. They would bite the bullet and say that a pattern of individually clean acts cannot compose into corruption, because corruption is an attribute of the *actor's integrity*, not the *system's output*.

  **Constraint Note**
  Your constraint requiring "no personal enrichment" makes this case significantly harder, but also much more valuable. Most easy examples of corruption involve a official taking a bribe (which violates both definitions). By removing the bribe, you force the distinction to rely entirely on whether corruption is about *individual morality* (Office) or *systemic justice* (Outcome). This is the exact friction point in modern comparative government debates about institutional design versus cultural norms.
