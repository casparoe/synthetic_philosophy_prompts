          *   *Office-and-Rules:* Clean. Legal donations, legal bid, transparent vote.
          *   *Outcome-and-Inequality:* The lot could have been used for public park space or low-income housing. The sale benefits the corporation (profit) and the council members (reelection via war chest), while the public loses the asset. The "exchange" is policy for political support.
