      *   **Task:** Construct a thought experiment where the two definitions give *opposite* verdicts.
      *   **Specific Direction:**
          *   Office-and-Rules verdict: **Not Corrupt** (fully disclosed, no personal enrichment, no rules broken).
          *   Outcome-and-Inequality verdict: **Corrupt** (cheats the public, entrenches inequality).
      *   **Constraints:**
          *   Realistic and local (city council, school district, etc.).
          *   No cartoon villains, no dramatic crimes.
          *   Confine the scenario to **one paragraph**.
          *   Do not cheat by stipulation (show, don't just tell, the unequal/entrenching character).
          *   After the scenario: Explain each conception's verdict, identify the single feature causing disagreement, explain what happens if that feature is removed, and explain how a defender of the Office-and-Rules conception would attack the case.
          *   Level: AP Government (accessible but rigorous).
          *   Meta-commentary: Point out if constraints make it harder.

  2.  **Deconstruct the Definitions:**
      *   **Office-and-Rules (Public Office Conception):** Focuses on *process* and *intent*. Corruption = deviation from public duty for private gain. Key markers: secrecy, bribery, rule-breaking, self-enrichment. If it's legal, transparent, and for "public good" (as defined by policy), it's not corruption.
      *   **Outcome-and-Inequality (Public Interest/Structural Conception):** Focuses on *impact* and *distribution*. Corruption = systemic bias that favors specific groups over the general public, entrenching power or inequality. Key markers: disproportionate benefit to elites, exclusion of marginalized groups, even if legal.

