      *   *Step 4: Proportionality.* Is the good grave enough?
      *   *Calibration:* Need cases that distinguish "diverting threat" (Trolley Switch) from "using obstacle" (Fat Man/Transplant).

  4.  **Drafting the Calibration Cases:**

      *   *Case A (Permissible):* The Switch. Diverting a train. Death is foreseen side effect of saving five.
      *   *Case B (Impermissible):* The Push. Pushing a fat man. Death is the *means* to stop the train.
