      *   *Case 1: Opioids.* Act: Medicate. Means: Relief via sedation, not death. Intention: Relief (if respiratory suppression didn't happen, would we still give it? Yes, if relief achieved). Proportionality: High (suffering). *Verdict: Permissible.*
