      *   *Reasoning:* The committee is already using DDE. The goal is to tighten its application, not replace the framework. However, since self-reported intention is unreliable, I need a robust operational test. I will adopt the classical formulation but enforce the "intention" criterion through a *counterfactual planning test* (Would you still do this if the bad effect didn't occur? / Is the bad effect part of the plan's success?). This aligns closely with the "means" condition anyway.
      *   *Defense:* It preserves the deontological constraint against using persons as means (crucial for the conjoined twin and craniotomy cases) while allowing necessary palliative care. It provides a stable normative anchor in a high-stakes environment where pure consequentialism can justify too much.

