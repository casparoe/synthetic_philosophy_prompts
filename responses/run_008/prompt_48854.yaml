answer: |-
  This is a classic setup for a personal identity debate, and Elena's profile is fascinating. She is effectively a **Non-Reductionist Physical Continuer with a Gradualism Constraint.** She rejects Parfit's Reductionist conclusion (that identity doesn't matter or is just psychological continuity) but accepts his analysis of fission (branching destroys identity).

  Here is the breakdown of the rules she is likely running, the predictions for your cases, and the strategy for Friday.

  ### Part 1: Candidate Rules Consistent with Elena's Track Record

  To predict her verdicts, we must reverse-engineer the principles that generate her specific pattern of "Survival" and "Death" judgments. Here are the three viable candidate rules that fit all her past verdicts.

  **Rule A: Non-Branching Spatiotemporal Continuity of the Physical Realizer**
  *   **The Principle:** You survive if and only if there is an unbroken spatiotemporal path of the physical object realizing your mental states, provided that path does not branch (fission).
  *   **Fit with Track Record:**
      *   *Teletransporter:* Break in path (Earth destroyed, Mars created) → Death. (Fits)
      *   *Gradual Silicon:* Continuous path (chips swap in place) → Survival. (Fits)
      *   *Cardiac Arrest/Anesthesia:* Path exists, activity pauses → Survival. (Fits)
      *   *Fission:* Path splits → Death. (Fits)
      *   *Amnesia:* Path exists → Survival. (Fits)
  *   **Prediction Case 1 (Cryo):** **Survival.** The brain is physically preserved (vitrified) in situ. The path is unbroken, merely paused.
  *   **Prediction Case 2 (Wireless):** **Death.** The physical realizer (the silicon chips) migrates away from the original spatiotemporal path of the skull/brain. The causal link is wireless, not physical continuity of the substrate.

  **Rule B: The "Same Head" Constraint (Localism)**
  *   **The Principle:** You survive if and only if the processing substrate remains within the original biological locus (the skull) or is integrated into it without relocation.
  *   **Fit with Track Record:**
      *   *Teletransporter:* Processing moves to Mars → Death. (Fits)
      *   *Gradual Silicon:* Processing stays in skull → Survival. (Fits)
      *   *Cardiac Arrest/Amnesia:* Processing stays in skull → Survival. (Fits)
      *   *Fission:* Two heads → Death. (Fits)
  *   **Prediction Case 1 (Cryo):** **Survival.** The brain stays in the head (eventually rewarmed in situ or the head is preserved).
  *   **Prediction Case 2 (Wireless):** **Death.** The processing moves to a server across the country. The skull becomes a mere peripheral (antenna), not the seat of identity.

  **Rule C: Gradual Functional Isomorphism (The "Ship of Theseus" Rule)**
  *   **The Principle:** You survive if and only if your functional organization is preserved through gradual replacement, regardless of the substrate or location, provided no branching occurs.
  *   **Fit with Track Record:**
      *   *Teletransporter:* Instant replacement → Death. (Fits)
      *   *Gradual Silicon:* Gradual replacement → Survival. (Fits)
      *   *Cardiac Arrest:* Function pauses but resumes → Survival. (Fits)
      *   *Fission:* Branching → Death. (Fits)
      *   *Amnesia:* Function wiped but hardware same → Survival. (Fits)
  *   **Prediction Case 1 (Cryo):** **Survival.** Function is preserved (via structure) and rebooted.
  *   **Prediction Case 2 (Wireless):** **Survival.** Function is preserved, replacement is gradual, no branching.

  #### Excluded Rules (What she is definitely NOT using)
  *   **Psychological Continuity Alone:** Excluded by the Teletransporter verdict. If psychology were enough, the Mars replica would be her friend.
  *   **Continuity of Consciousness:** Excluded by Anesthesia and Cardiac Arrest verdicts.
  *   **Memory Continuity:** Excluded by the Amnesia verdict.
  *   **Strict Biological Continuity:** Excluded by the Gradual Silicon verdict. She accepts non-biological matter *if* it replaces neurons locally.

  ---

  ### Part 2: Predictions for Your New Cases

  Based on the candidate rules above, here is how Elena will likely react.

  **Case 1: Cryonics (Vitrified 80 years, rewarmed, repaired)**
  *   **Verdict:** **Survival.**
  *   **Reasoning:** This case passes Rule A (Spatiotemporal Continuity) and Rule B (Same Head). The only friction is the 80-year gap. However, she already granted that a 45-minute flatline (Cardiac Arrest) is survival. Metaphysically, a pause in activity does not break identity for her; only the destruction of the vehicle does. Since you are granting the tech works (no ice crystal damage, successful repair), the physical brain that wakes up is the *same object* that went to sleep.
  *   **Risk Factor:** She might conflate *legal* death with *metaphysical* death. Since cryonics requires you to be legally dead before vitrification, she might stubbornly say, "You signed the death certificate, so you're dead." You must press her on whether the *paperwork* changes the atoms.

  **Case 2: Wireless Neuron Replacement (Silicon in remote server)**
  *   **Verdict:** **Death.**
  *   **Reasoning:** This is the trap. While Rule C (Gradual Functional Isomorphism) suggests survival, Rules A and B suggest death. Given her hard "No" on the Teletransporter (which is also functional isomorphism but in a new location), she prioritizes **Location/Physical Continuity** over pure Function.
  *   To Elena, the "You" is anchored to the biological skull. In the Gradual Silicon case she approved, the skull remained the container of the mind. In the Wireless case, the skull becomes a hollow shell, and the mind migrates to a server farm. To her, this is indistinguishable from the Teletransporter: the original locus is abandoned, and a copy runs elsewhere. The fact that it happens gradually is irrelevant if the *destination* is a different physical object in a different location.

  ---

  ### Part 3: My Best Guess & Rationale

  **Elena's Verdict:**
  1.  **Cryonics:** **Survival.**
  2.  **Wireless:** **Death.**

  **The Philosophical Rationale:**
  Elena is holding a view close to **Animalism with a Prosthetic Exception.** She believes you are your biological organism (specifically your brain), but she allows for the *Ship of Theseus* replacement of parts *in situ*.

  She rejects the Teletransporter not because the copy lacks your memories, but because the *causal chain of the physical object* was broken. She accepts the Gradual Silicon case because the causal chain of the *structure* remains unbroken within the skull.

  In the Wireless case, you are proposing **Gradual Teletransportation.** You are moving the seat of consciousness from Object A (Brain) to Object B (Server). Even if done gradually, she will view the Server as a distinct object. Once the last biological neuron is removed, the link to the original "You" (the animal) is severed. The thing in the server is a new entity that *thinks* it is you, just like the Mars replica.

  In the Cryonics case, the "Animal" (the brain) is preserved. The gap in time is metaphysically irrelevant to her, as proven by the Cardiac Arrest verdict. The 80 years is just a very long anesthesia.

  ---

  ### Part 4: The Tie-Breaker Case

  To truly test whether she follows **Rule A/B (Physical/Local Continuity)** or **Rule C (Gradual Functional Continuity)**, you need a case that separates *Location* from *Gradualism*.

  **Spring this on her if she hedges on the Wireless case:**

  > "Okay, imagine we do the Wireless Neuron Replacement, but with one change. As we replace each neuron with a silicon chip, we don't put the chip in a server across the country. We put the chip on a wafer that is physically attached to the outside of my skull by a microscopic wire.
  >
  > We do this one by one. By the end, my skull is empty, and there is a large box of chips wired directly to my neck, sitting on a table next to me. I am thinking entirely in the box on the table, but I am connected to my head by a physical cable.
  >
  > **Then**, over the next year, we slowly roll the box on wheels to Mars.
  >
  > Am I still me when the box is on the table? Am I still me when the box arrives on Mars?"

  **Why this splits the rules:**
  *   **If she says "Yes, still you" (even on Mars):** She is a **Gradual Functionalist (Rule C).** She accepts that identity can migrate as long as the connection is never broken. This undermines her Teletransporter objection (she should have accepted the Teletransporter if it were gradual).
  *   **If she says "No, you died when the box moved" (or when it left the room):** She is a **Localist (Rule B).** She believes identity is tied to the *original location* of the brain. This confirms her Wireless verdict will be Death.
  *   **If she says "You died when the skull went empty":** She is a **Strict Biological Continuer.** She only tolerated the silicon earlier because she thought it was integrated *into* the brain, not replacing the brain's locus. This confirms Cryonics is Survival (biological brain preserved) and Wireless is Death.

  **Strategic Advice:**
  Walk in confident on the Cryonics. Her own precedent on Cardiac Arrest is your shield. For the Wireless case, do not argue Function; argue **Location.** Remind her that the Teletransporter failed because the *place* changed. The Wireless case changes the *place* of the mind. If she accepts Wireless, she must admit the Teletransporter is survival *if done gradually*. Trap her there.

  Good luck. You'll need it—both with Elena and with the vitrification team.
