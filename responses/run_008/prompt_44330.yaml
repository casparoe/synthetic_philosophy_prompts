answer: |-
  The rotten apple is **Step (2)**.

  Your flatmate is a good troll because he has anchored the entire argument to Step (1), which is intuitively true and hard to dislodge. Because Step (1) is correct, Step (2) *feels* like a harmless translation of it into algebra. But Step (2) is where the sleight of hand happens.

  Here is the breakdown of the con, why it looks legitimate, and the price you have to pay to fix it.

  ### 1. The Con: The Two Faces of X
  Step (2) states: *"The other envelope contains 2X with probability ½ and X/2 with probability ½."*

  This looks correct because it relies on Step (1): *"Your envelope is exactly as likely to be the bigger one as the smaller one."*

  The error is that **$X$ is not a fixed number** in that equation. It is a random variable that changes its meaning depending on which half of the probability you are in.
  *   In the term $½(2X)$, $X$ represents the **smaller** amount.
  *   In the term $½(X/2)$, $X$ represents the **larger** amount.

  You cannot add these together as if $X$ is the same value. It's like saying: "I have a bag with a red ball and a blue ball. Let $W$ be the weight of the ball I pick. The expected weight is $½(W_{\text{red}}) + ½(W_{\text{blue}})$." That's fine. But your flatmate is saying: "Let $W$ be the weight of the ball I pick. The other ball weighs $2W$ or $W/2$." This implies that if you picked the red ball (say, 10g), the blue one might be 20g. But if you picked the blue ball (20g), the red one might be 10g.

  The calculation $½(2X) + ½(X/2)$ assumes that for *any* value $X$ you hold, it is equally likely that the other is double or half. This requires a probability distribution of money that is uniform across all positive numbers (from 1 cent to infinity). Such a distribution is mathematically impossible (it cannot be normalized). In any real-world scenario with a finite amount of money, there must be some maximum value. If you open your envelope and find €1 billion, you know with certainty you have the larger one, so the probability is no longer ½.

  ### 2. Why It Looked Fine
  It looked fine because Step (1) is actually true **before you look**.
  *   $P(\text{I picked the smaller envelope}) = 0.5$.
  *   $P(\text{I picked the larger envelope}) = 0.5$.

  Your flatmate smuggles in the assumption that this 50/50 probability holds **conditional on the value $X$**. He assumes $P(\text{smaller} | \text{value}=X) = 0.5$.
  While the *unconditional* probability is 0.5, the *conditional* probability depends on the prior distribution of money in the envelopes. By ignoring the prior distribution, he treats $X$ as a constant anchor when it is actually part of the random fluctuation.

  ### 3. The Cost of Rejecting It
  You asked what it costs to escape the paradox. To reject Step (2), you must give up the idea that **you can calculate the expected value of switching based solely on the amount in your hand without knowing the possible range of money.**

  You have to accept one of two things:
  1.  **There is a Prior Distribution:** You must acknowledge that there is some probability distribution for how the money was put in the envelopes (e.g., the host picks a number between €1 and €1000). Once you admit this, Step (2) falls apart for high values of $X$ (where you know you likely have the max), and the expected gain averages out to zero.
  2.  **$X$ is Not a Constant:** You must accept that you cannot factor $X$ out of the expectation. The correct calculation uses the fixed amounts in the envelopes, say $A$ and $2A$.
      *   Your envelope $E[Y] = 0.5(A) + 0.5(2A) = 1.5A$.
      *   Other envelope $E[Z] = 0.5(2A) + 0.5(A) = 1.5A$.
      *   Difference = 0.

  To fix the math, you have to stop treating the content of your envelope as a reference point for the universe and start treating the *pair* of envelopes as the system.

  ### 4. Handling Your Flatmate's Specific Claims

  *   **Against Step (1):** Concede it. It is true. "Yes, before I look, I have a 50% chance of holding the smaller one. But that doesn't mean for any specific value $X$ I find, the odds remain 50/50 that the other is double or half."
  *   **Against Step (6) (The Ratio $r$):** The same logic applies. The formula $(r + 1/r)/2$ is algebraically greater than 1 for $r \neq 1$, but it is probabilistically nonsense because it assumes you can be holding the larger amount $X$ and still have a chance the other is $rX$. If $X$ is the larger amount, the other is $X/r$, not $rX$.
  *   **Against Step (7) (The Fee):** Since the true expected gain is 0, the rational fee to pay for the option to switch is **€0**. If casinos offered this, they would not be delighted; they would be indifferent, because over the long run, no money changes hands. If they charged a fee, they would make money simply because you are paying for a privilege that has zero expected value, not because switching is beneficial.

  ### Summary for the Flatmate
  Tell him this:
  "Step (2) is false. You are treating $X$ as a constant in your expectation formula, but $X$ is a random variable that correlates with the state of the world. In the branch where the other envelope is $2X$, $X$ is the smaller amount. In the branch where the other is $X/2$, $X$ is the larger amount. You are averaging two different values of money and calling them both $X$. To make Step (2) true, you need an impossible prior distribution of money that extends to infinity. In any real setup, the expected gain is zero, and I'm not paying a cent to switch."
