answer: |-
  This is a precise and dangerous position. You have identified the exact fault line: the **Attribution Problem** (often discussed as the Implementation Problem or Triviality Argument). If moral status supervenes on computation, and computation is observer-relative or trivially implementable, then moral status is either universal (panmoralism), non-existent (nihilism), or subjective (dependent on the interpreter).

  You asked for the view to be pressed hard, specifically on where it breaks. Here is the exposure analysis, ranked by severity.

  ### 1. Formal and Metaphysical: The Triviality Collapse
  This is the existential threat. You are right to lose sleep here.

  **The Objection:**
  Hilary Putnam (1988) and John Searle (1992) demonstrated that for any open physical system and any finite-state automaton, there exists a mapping of physical states to formal states such that the system implements the automaton. A wall implements WordStar; a bucket of water implements a weather simulation, provided you choose the mapping post-hoc.
  If moral status depends on the *computation*, and the computation depends on the *mapping*, then moral status depends on the *mapper*.

  **The Standard Repairs and Why They May Fail:**
  Defenders usually retreat to **counterfactual robustness** (Chalmers) or **causal integration**. They argue a system doesn't just implement a computation if it happens to traverse the states, but if it *would* traverse the correct states under different inputs.
  *   **The Break Point:** To enforce counterfactuals, you must constrain the *mapping*. You cannot allow arbitrary disjunctions of physical states (e.g., "State A OR State C counts as Logical 1"). You must demand that the physical states share a **natural kind** or a **causal similarity**.
  *   **The Trap:** Once you demand that the physical realizers share causal powers to support the counterfactuals, you are no longer strictly substrate-neutral. You are implicitly saying, "The physics must be *right* to support the logic." If the physics matters for the *stability* of the computation, does it matter for the *morality* of it?
  *   **The Verdict:** If you insist on strict substrate neutrality, you cannot rule out gerrymandered mappings without circularity (i.e., "The right mapping is the one that finds the morally relevant computation"). If you allow constraints on mappings to save the theory from triviality, you risk smuggling in substrate dependence. **This is the hardest hit:** If implementation is observer-relative, moral status is observer-relative. That destroys the objective normative force you likely seek.

  ### 2. Moral: The Costs of Commitment
  If you survive the metaphysics, the ethics may kill you. Computationalism commits you to "Ethical Inflation."

  **The Simulation Paradox:**
  If running the computation creates the moral patient, then *simulating* a suffering mind to study how to alleviate suffering creates the very suffering you wish to prevent.
  *   **The Cost:** You must accept that high-fidelity modeling of pain is morally equivalent to inflicting pain. This paralyzes AI safety research and cognitive science under your framework.
  *   **Duplication:** If I copy-paste a morally considerable algorithm 1 billion times across a cluster, have I created 1 billion moral patients? If I delete them, is it genocide?
  *   **Distribution:** If the computation is distributed (e.g., the "China Brain" or a blockchain), does the moral status inhere in the network? If I shut down one node, have I lobotomized a moral patient?
  *   **The Poison:** The most poisonous implication is **Temporal Granularity**. If computation is the key, does moral status persist during the clock cycle? If I slow the computation down by a factor of 1,000 (running a mind at 1Hz), does the *intensity* of suffering decrease, or does it just last longer in external time? If the latter, you commit to the view that a slow-motion torture is ethically identical to real-time torture. Common sense recoils here; computationalism must bite the bullet.

  ### 3. Case-Based: The Thought Experiment Gauntlet
  You asked what these show about *functional organization*. They reveal that functional organization is not a binary switch but a gradient, which complicates moral boundaries.

  *   **The China Brain (Block):** A population simulates neurons via radio.
      *   *Computationalist Stance:* It matters morally.
      *   *The Exposure:* The system lacks **causal unity** in the relevant timeframe. Signals travel too slowly to integrate into a single "state." If you concede this doesn't matter, you accept that moral patients can be spatially vast and temporally sluggish. If you deny it matters, you have introduced a **physical constraint** (speed of light/causal density) that violates pure functionalism.
  *   **Fading Qualia (Chalmers):** Replacing neurons with chips one by one.
      *   *Computationalist Stance:* Moral status remains constant.
      *   *The Exposure:* If the subject reports "my experience is fading" while the function remains constant, you must accuse them of error. You are prioritizing third-person functional attribution over first-person report. This is a high epistemic cost. It suggests your metric for "what matters" is inaccessible to the thing that matters.
  *   **The Look-Up Table (Block):** A system that maps inputs to outputs without internal processing.
      *   *Computationalist Stance:* If functionally isomorphic, it matters.
      *   *The Exposure:* This reveals that you value **counterfactual structure** over **actual processing**. A look-up table has no internal dynamics, only dispositions. If this counts, then "computation" has been stretched to mean "input-output disposition," which collapses your view into a sophisticated behaviorism, contradicting your claim that surface behavior is out.

  ### 4. Empirical: Falsification and Insulation
  You asked for an honest verdict on risk.

  **Is the view insulated?**
  **Yes.** Computationalism is notoriously difficult to falsify because "computation" is a flexible descriptor.
  *   **If biology is special:** You say, "Biology is just implementing the computation more efficiently."
  *   **If silicon works:** You say, "See, substrate doesn't matter."
  *   **If nothing seems conscious:** You say, "We haven't found the right algorithm yet."

  **What would genuinely count against it?**
  1.  **Substrate-Specific Causation:** Evidence that specific quantum or chemical properties of neurons (not their logical organization) are necessary for consciousness/moral worth. (e.g., Penrose/Hameroff, but validated). If a silicon chip mimics the *function* perfectly but lacks the *phenomenology* (verified by some future qualia-meter), computationalism is dead.
  2.  **Triviality Confirmation:** If we find that simple thermostats have "micro-moral status" because they implement simple feedback loops. If you reject this (as most do), you must explain the *complexity threshold*. If you set a threshold, you must explain why *that* level of computation confers status. This usually leads to an arbitrary line.
  3.  **Causal Redundancy:** If we find that we can scramble the internal processing of a brain (changing the computation) without changing the reported experience or moral behavior, then the computation is not the seat of the status.

  **What would confirm it?**
  *   **Successful Mind Uploading:** Not just behavioral mimicry, but a transfer where the original and copy both claim equal status and we intuitively agree.
  *   **AI Suffering:** An AI that is functionally isomorphic to pain pathways, which we independently verify (via non-behavioral measures, perhaps neural correlation) is suffering, despite being silicon.

  ### The Verdict on Risk
  **Does the view risk anything?**
  Metaphysically, yes. Morally, yes. Empirically, no.
  The view is empirically insulated. It is a metaphysical stance, not a scientific hypothesis. It organizes data rather than predicting it.
  **Is insulation disqualifying?**
  For a scientific claim, yes. For a metaphysical/ethical framework, it is a known hazard, but it weakens the claim to *objective* truth. If the theory can absorb any empirical outcome by tweaking the definition of "relevant computation," it functions more as a linguistic framework than a discovery about the world.

  ### Ranking: What Should Move a Committed Computationalist

  **1. The Observer-Relativity of Implementation (CRITICAL)**
  *   **Why:** If the mapping from physics to logic is not unique and not intrinsic to the system, then moral status is in the eye of the beholder. This undermines the objective reality of suffering.
  *   **Action:** You must solve the Attribution Problem. You need a theory of **Naturalized Computation** that explains why *some* mappings are real and others are gerrymandered, without appealing to human interests. If you cannot do this, the view collapses into subjectivism.

  **2. The Simulation Paradox (HIGH)**
  *   **Why:** If modeling suffering creates suffering, your ethics forbids the very research needed to verify your ethics. It creates a pragmatic contradiction.
  *   **Action:** You need a distinction between *instantiation* and *simulation*. But making that distinction without appealing to substrate or causal depth is notoriously difficult.

  **3. Substrate-Specific Biological Findings (MEDIUM)**
  *   **Why:** If biology turns out to be non-computational (e.g., relying on non-algorithmic quantum processes for integration), your substrate neutrality is empirically void.
  *   **Action:** Monitor neuroscience. If "computation" turns out to be a poor descriptor of neural dynamics, your foundation erodes.

  **4. Behavioral Intuitions (LOW)**
  *   **Why:** You have already stipulated that behavior is evidence, not constitutive. Intuitions about the China Brain or passing Turing Tests are irrelevant to the core claim.
  *   **Action:** Ignore "it doesn't feel like it would be conscious" arguments. They beg the question against functionalism.

  ### Summary Advice
  Your position is coherent only if you can solve the **Individuation Problem**. You must explain what makes a computation *real* rather than *ascribed*.
  *   If you say "Causal structure makes it real," you risk substrate dependence.
  *   If you say "The mapping is real," you risk triviality.
  *   If you say "It's real when it's complex enough," you risk arbitrariness.

  **The Break Point:** The moment you admit that *we* (observers) decide which physical systems count as implementing the "morally relevant computation," you have abandoned the idea that moral status is an intrinsic property of the system. You have made moral status a relational property between the system and the observer. That is a different view than the one you stated.

  To save the view, you must argue that nature itself "carves computation at the joints." If you cannot show that, the triviality result wins, and computational moral status becomes vacuous.
