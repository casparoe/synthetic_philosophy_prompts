              *   *Computationalist:* If the table is functionally isomorphic, it counts.
              *   *Problem:* This strips "processing" of causal depth. It highlights the difference between *simulation* and *replication*.

      *   **4. Moral (The Costs):**
          *   *Duplication:* If I copy the computation 1 million times, is there 1 million units of moral worth? (Summing problem).
          *   *Simulation:* If I run a simulation of a suffering mind on my laptop, am I morally culpable? (The "Simulated Suffering" problem).
          *   *Pause/Replay:* If I pause the computation, does moral status pause? If I run it backwards?
          *   *Distributed:* If the computation is spread across the internet, do I owe moral consideration to the network?
          *   *Poison:* The "Simulation Problem." If running a code creates moral patients, then *predicting* suffering (simulating it to avoid it) might *create* the suffering you are trying to avoid. This is a pragmatic paradox.

      *   **5. Verdict on Risk & Insulation:**
          *   *Is it insulated?* Yes, largely. By adjusting the "grain" of computation, one can fit almost any result.
          *   *Is that disqualifying?* In science, yes. In metaphysics, it's a known hazard but weakens the claim to objective truth.
          *   *The Real Risk:* The *Attribution Problem* makes moral status observer-relative. If *I* decide which mapping is the "real" computation, then *I* decide who matters. This undermines the objective moral realism the user likely wants.

      *   **6. Ranking (What should move you):**
          *   *Top Priority:* The Observer-Relativity of Implementation. (If implementation is in the eye of the beholder, moral status is too).
          *   *Secondary:* The Simulation Paradox (Creating suffering by modeling it).
          *   *Tertiary:* Substrate specificity discoveries (Biological naturalism evidence).
          *   *Ignore:* Behavioral tests (Turing test results) - consistent with the view that behavior is evidence, not constitutive.

  4.  **Refining and Polishing:**
      *   *Tone Check:* Ensure I'm not just summarizing but *pressing* the points as requested.
      *   *Triviality:* Focus on Putnam/Searle but also the modern "mapping" response. Emphasize that restricting mappings often requires appealing to *causal powers* of the substrate, which betrays substrate neutrality.
      *   *Moral Costs:* Highlight the "Ethical Inflation" risk. If computation is cheap, moral patients are cheap.
