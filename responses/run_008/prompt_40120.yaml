  3.  **Drafting Section by Section:**

      *   **Introduction:** Acknowledge the sophistication of the query. Validate the "triviality" worry as the central metaphysical threat.

      *   **1. Formal & Metaphysical (The Triviality Hammer):**
          *   *The Threat:* Putnam (1988), Searle (1992). Every open physical system implements every finite state automaton. If moral status depends on computation, and everything computes everything, everything has moral status (panpsychism/panmoralism) or nothing does (nihilism).
          *   *Standard Repairs:*
              *   *Counterfactuals:* It's not just what states occur, but what *would* occur. (Chalmers).
              *   *Causal Integration:* The states must causally interact appropriately.
              *   *Semantic/Intentional Constraints:* The states must represent something.
          *   *The Critique:* Do these repairs smuggle in the answer? To say "the right causal structure matters" is to say "the physical dynamics matter," which edges back toward substrate dependence. To say "the right mapping matters" requires a constraint on mappings. If the constraint is "non-gerrymandered," who defines that?
          *   *Verdict:* This is the biggest risk. If the individuation of the computation relies on *interpretive* acts by an observer, moral status becomes observer-relative (disaster for ethics). If it relies on intrinsic physical properties, it risks collapsing into physicalism (substrate dependence).
          *   *Key Insight:* The "Mapping Problem." You need a *non-arbitrary* mapping from physics to logic. If nature doesn't provide the joints, you do, and then *you* are conferring the status, not the system.

