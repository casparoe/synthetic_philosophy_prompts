          *   *Artificial Minds:* Do they have relevant properties? If they achieve sentience/agency, distinction (Carbon vs. Silicon) is arbitrary. **Fund (contingent on evidence).**

      *   **Part 3: The Trade-offs (Which verdicts must be given up?).**
          *   This is the critical philosophical pressure point.
