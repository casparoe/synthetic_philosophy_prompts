      *   The user's intuition suggests a shift from *Extensionalism* (adding new members to the club) to *Universalism/Equality* (correcting the rules of the club).
      *   Let's refine the "Removal of Morally Arbitrary Distinctions" idea. This sounds like a Rawlsian or Singer-esque principle.
      *   *Better Formulation:* **Moral Progress as the Alignment of Moral Status with Morally Relevant Properties.**
