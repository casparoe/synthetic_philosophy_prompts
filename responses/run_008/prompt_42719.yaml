          *   Animals: Sentience is the relevant property; law ignored it. Alignment = Progress + Widening (because the boundary of "sentient beings" is wider than "humans").
          *   Dueling: Violence is the relevant property (harm); privilege allowed it. Alignment = Progress (Contraction of privilege).
          *   Corporate Personhood: Corporations lack sentience/agency (in the moral sense); law grants standing. Misalignment = Not Progress.
      *   *Alternative Principle:* **The Principle of Equal Consideration of Interests.** (Peter Singer).
      *   *Alternative Principle:* **The Principle of Status Correction.** (Distinguishing between *expanding the circle* vs. *fixing the lens*).

      *   *Decision:* The user's specific intuition about Suffrage (Progress but not Widening) vs. Slavery (Progress and Widening) is the key. Both involve arbitrary distinctions (Sex vs. Race/Property). Why the difference?
          *   Slavery: Treated humans as *things*. Moved from Outside to Inside.
          *   Suffrage: Treated women as *inferior members*. Moved from Inside-Low to Inside-Equal.
          *   *Refined Principle:* **Moral Progress consists in correcting mismatches between moral reality and social/legal recognition.**
          *   *Sub-type A (Widening):* Recognizing a previously excluded class of *moral patients* (Slaves, Animals).
          *   *Sub-type B (Deepening/Equalizing):* Recognizing full *moral agency/status* within an already acknowledged class (Women, Minorities).
          *   *Sub-type C (Constraining):* Removing privileges that violate the status of others (Duelling).
