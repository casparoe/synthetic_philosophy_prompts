      *   *Self-Correction on "Widening":* The user's charter *requires* "widening." If I tell them "Widening is the wrong concept," they might violate the charter. I need to show how "Alignment" *interprets* "Widening."
      *   *Interpretation:* "Widening" isn't spatial; it's the scope of *consistency*.
      *   *Wait, one nuance:* The user says Suffrage is not widening because opponents acknowledged women had interests. This implies the "Circle of Moral Patients" already included women. The "Circle of Political Agents" did not. So, is the Foundation about *Patients* (receivers of care) or *Agents* (participants)?
