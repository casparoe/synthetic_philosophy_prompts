  The brass rim spins, a blur without a sound,
  While water sleeps and keeps its level face.
  The wall slides past, turning all around,
  Yet no concave rise betrays the place.
  But friction drags the fluid to the pace,
  Till relative motion stands strictly bound.
  Now matched in spin, no motion to embrace,
  The surface climbs, though rest defines the space.

  Now strip the stars, those fixed and distant lights,
  Two globes float suspended in the void,
  Connected by a cord through endless nights,
  Where no external mark is employed.
  The cord pulls tight, a tension pure and bare,
  Proves motion relative to nothing there.
