      *   The crux is the word "Actor." In philosophy/social science, an "actor" usually implies *intent* or *choice*. A volcano has impact, but does it have agency?
      *   The User suspects the BIL is right about *constraints* but wrong about *agency*.
      *   The User needs help articulating *why* calling a volcano an "actor" is misleading, even if the volcano was the *trigger*.

  3.  **Brainstorming the "Volcano-as-Actor" Framework (as requested):**
