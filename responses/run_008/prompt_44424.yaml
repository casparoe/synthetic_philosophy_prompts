          *   *Correction:* It's often attributed to Feynman, but no solid written source exists in his major works. It might be from a documentary or interview transcript that's hard to pin down. Actually, it's frequently attributed to *Richard Feynman* but some sources suggest it might be *Murray Gell-Mann* or just folklore. Wait, let me double-check my internal knowledge base. The quote is commonly cited as Feynman, but scholars (like Tim Maudlin) note the lack of a primary source. It's safer to call it "apocryphal."
      *   *Weinberg:* "Against Philosophy" in *Dreams of a Final Theory*.
