      *   *Strongest Objection:* The "Apprenticeship" argument actually *supports* philosophy (specifically Kuhn/polanyi). The user says "You learn the method the way you learn baking: apprenticeship." A philosopher will pounce on this. That *is* a philosophical claim (tacit knowledge, paradigmatic training). By asserting science is learned this way, he is *doing* philosophy of science, not rejecting it. He's describing the *sociology* and *epistemology* of practice without realizing it.
      *   *Weakness:* The leap from "philosophy didn't tell me what pipette to use" to "philosophy has nothing to do with science." It conflates *methodological instruction* with *conceptual framework*.

