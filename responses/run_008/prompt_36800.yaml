answer: |-
  This is a sharp observation, and you've correctly identified a tension that sits right at the boundary of cultural evolution, social psychology, and economics. You aren't imagining it, but you are also running into a terminology gap. The anthropologists and cultural evolutionists have the *pieces* of this puzzle, but they don't have a single label for the specific dynamic where *efficiency is fatal to transmission*.

  Here is the breakdown of the landscape, followed by the term you're looking for.

  ### The Prose Verdict

  **(a) Does it have a name?**
  Not a single, canonical one. You have correctly identified why the usual suspects don't quite land.
  *   **Costly Signaling Theory (CST):** You're right to be unsatisfied. CST explains why the *signal* is honest (because it's costly), but it is often framed as an equilibrium state between individuals, not necessarily a mechanism for *cultural transmission* across generations. It explains stability, not necessarily the *propagation advantage* of cost over efficiency.
  *   **CREDs (Credibility Enhancing Displays):** This is the closest established concept (Henrich et al.). It argues that when models (priests, professors) pay costs, observers (parishioners, students) are more likely to adopt the underlying belief. However, CREDs focuses on the *model's* cost influencing the *learner's* belief. Your examples (hazing, difficult seminars) often involve the *learner* paying the cost to generate their own commitment (which is closer to **Effort Justification** in social psychology). CREDs explains why the Latin Mass priest gets converts; it explains less why the student who *suffered* through the seminar evangelizes it.
  *   **Ritual Opacity / Causal Opacity:** This explains why we copy rituals precisely (because we don't understand the causal links), but it doesn't explicitly name the *benefit of the cost* itself in transmission dynamics.

  **(b) The Coined Term: "Propagative Friction"**
  Since the existing terms split the difference between signaling, psychology, and stability, I propose we coin **Propagative Friction**.

  **Definition:** A cultural trait exhibits Propagative Friction when the cost, difficulty, or inefficiency of the practice is a functional requirement for its high-fidelity transmission or valuation, such that reducing the friction reduces the rate of adoption or retention.

  **The Edges (What's In, What's Out):**
  *   **In:** The Latin Mass (cost signals commitment to community), Hazing (cost creates sunk-cost bonding), Hard Seminars (effort justification creates value). In all these, "streamlining" breaks the mechanism.
  *   **Out (Veblen Goods):** If the cost is purely to signal wealth to *outsiders* without affecting group cohesion or transmission fidelity, it's Veblen. Propagative Friction is about internal transmission, not external status.
  *   **Out (Pure Inefficiency):** If a practice is costly and dies *because* it is costly (e.g., a ritual that takes 12 hours and no one can sustain), that is just maladaptive cost. Propagative Friction requires the cost to be the *engine* of survival.
  *   **Out (Viral Memes):** Low-cost, high-fidelity transmission (like a catchy tune) is the opposite. Propagative Friction applies specifically to practices where *low cost leads to low value perception*.

  **Why this distinction matters:**
  Standard cultural evolution often treats "cost" as a hurdle to be overcome by "benefit." Your insight flips this: the cost *is* part of the benefit function because it gates commitment. Calling it **Propagative Friction** captures the counter-intuitive mechanic: friction is not a bug in the transmission system; it is a feature that prevents the signal from degrading or being undervalued.

