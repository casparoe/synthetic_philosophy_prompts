  *(Self-Correction during drafting)*: Wait, I need to check the publication dates carefully. *Foundation* short stories ran 1942-1944. Book form 1951. Popper's *Poverty of Historicism* papers were 1944-45, book 1957. *Open Society* 1945. So they are contemporaneous, but Asimov definitely wasn't reading Popper manuscripts. The parallel is independent. I must emphasize this so the user doesn't claim Asimov was "responding" to Popper directly.

  *(Another thought)*: The user asks if the Mule is the point. In the original stories, the Mule arc (*Dead Hand* etc.) was a later addition to bridge the gap. Asimov admitted he wrote himself into a corner. So the "Secret Argument" theory is weak on authorial intent but strong on textual reception. I need to balance this.

