      *   *Refining the Authorial Intent:* Don't claim Asimov read Popper (timeline check: *Foundation* stories started 1942, Popper's *Open Society* 1945, *Poverty of Historicism* 1957). Asimov couldn't have been responding to Popper directly. But they were reacting to the same intellectual climate (Marxism, Fascism, determinism). This is a crucial distinction for the user's column.

  6.  **Final Review against Constraints:**
