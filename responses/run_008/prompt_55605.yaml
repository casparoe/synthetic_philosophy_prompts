  Session arc
  Begin by solidifying the Hard Problem (0–10 mins). Use a standard intuition pump, like the Zombie argument, to ensure everyone feels the explanatory gap. Do not attempt to resolve it. The group must sit with the frustration that mechanism seems to leave something out. If you skip this, the Meta-Problem looks like dismissal. Engineers respect bug reports; treat the Hard Problem as a valid ticket before opening the logs. The pivot occurs at minute 10: "Granting this gap feels real, why does our architecture generate the claim that it exists?" This shifts the object of study from consciousness itself to the cognitive mechanisms producing consciousness judgments.

  On the left of the pivot, establish that the Hard Problem is intuitively insoluble. On the right, establish that the Meta-Problem is tractable because it treats judgments as behavioral data. The dependency is crucial: the Meta-Problem relies on the Hard Problem's intuitive force to justify its existence. If the Hard Problem weren't compelling, we wouldn't need a Meta-Problem. You must validate their intuition before analyzing its source.

  Spend minutes 15–25 detailing potential mechanisms: attention schemas, self-modeling bottlenecks, or information integration limits. Show how these generate the *report* of ineffability without confirming ineffability itself. End (25–30 mins) by clarifying neutrality. Solving the Meta-Problem constrains theories of mind but does not solve the Hard Problem. It explains the persistence of the debate, not the winner. The pivot must frame this as adding a tool, not removing the mystery. Ensure they see that explaining the judgment is compatible with the judgment being true. This prevents the session from devolving into illusionism debates. The arc moves from ontology to epistemology, then to cognitive architecture. Write the distinction on the whiteboard: "Explaining X" vs "Explaining claims about X." Keep the pivot visible throughout the second half to prevent conceptual drift back into the Hard Problem. This visual anchor prevents the group from sliding back into ontological debates during the mechanism phase. It forces them to treat their own bafflement as data rather than evidence. Timing is critical; pivot only after the Hard Problem's weight is fully felt.

  The carrying example
  Your example is strong but dangerous. It risks implying the reports are false (illusionism) before the meta-argument is established. Engineers will spot the rig: no access implies hallucination. Repair it by decoupling access from truth. The system should have accurate state monitoring but lack the *conceptual bridge* to explain why those states feel like something. It must produce the report "I am experiencing" sincerely, based on internal data, without that data entailing qualia. Avoid implying the system is "blind" in a defective sense; frame it as architecturally constrained. The goal is to show how a mechanism generates the *judgment* of ineffability, not to prove the judgment is wrong. Keep the ontology open. Make the architecture mirror human cognitive bottlenecks. This prevents dismissal as a broken system. It must be a working system that simply cannot introspect its own substrate.

  Misconception map
  1. "You're defining feelings away." (Surfaces during Hard Problem setup). Engineers prefer concrete definitions. Absorb this by insisting the Hard Problem is real for now. Validate their intuition before analyzing it. Tell them: "We are not solving it yet, we are honoring it." Address this immediately to build trust. If they feel dismissed, they will disengage.
  2. "This is just behaviorism." (Surfaces at the Pivot). Engineers know behaviorism fails on internal state. Absorb this by clarifying that meta-explanations concern cognitive mechanisms, not just input-output mappings. Internal processing matters. The whiteboard must show internal modules, not just black boxes.
  3. "If you explain the report, you explain the feeling." (Surfaces at conclusion). This is the collapse error. Absorb this by reiterating Chalmers's distinction: explaining the judgment is compatible with the judgment being false or true. Use the analogy: explaining why someone believes in ghosts doesn't prove ghosts exist or don't exist. Address this repeatedly; it is the natural default for engineers seeking efficiency.
  4. "This solves the Hard Problem." (Surfaces at Q&A). Engineers want closure. Absorb by stating clearly that the Meta-Problem leaves the Hard Problem untouched. It explains the persistence of the debate, not the winner.
  5. "Consciousness is just an illusion." (Surfaces throughout). Absorb by maintaining neutrality. The meta-problem works for dualists too. This keeps the room unified.

  What to leave out
  Omit Illusionism (Frankish) vs. Realism debates. This distracts from the structural point that the Meta-Problem is neutral. Omit specific neural correlates (NCC); this is architecture, not biology. Omit historical lineage (Kant, Wittgenstein); keep it computational. Why? Because your audience wants leverage, not lineage. Introducing stance-dependent theories fractures the group into camps before they grasp the meta-structure. Keep the focus on the mechanism of judgment, not the truth value of the judgment.

  The closing check
  "If we fully explain the cognitive algorithm that causes you to claim 'I have qualia,' have we explained the qualia themselves?" The correct answer is "No." This confirms they understand the Meta-Problem explains the report, not the phenomenon. If they answer "Yes," they have collapsed the distinction and missed the point of Chalmers's move. It tests the structural separation. Ask this verbally to ensure immediate engagement.
