      *   If the District assigns students randomly to programs in the future (as per part c), they care about the overall rate.
      *   In Part (b) (Observational), if the District assigns students *as they come* (self-selection continues), the Overall Rate (B > A) is actually the relevant metric for *budget planning*, even if A is more effective.
      *   However, standard pedagogy says "Control for confounders to find the truth." The student did that. I won't penalize for not discussing the decision-theory nuance of "predictive vs causal" unless the course emphasized it. I'll stick to the "Always Condition" error as the main deduction.

      *   *Wait, checking the "Ecological Fallacy" claim again.*
      *   Simpson's Paradox is *not* the Ecological Fallacy.
      *   Ecological Fallacy: Inferring individual correlation from group correlation.
      *   Simpson's: Reversal of association upon aggregation.
      *   They often co-occur, but they aren't "just" the same thing.
      *   Given the user's background (LessWrong), they will likely care about this distinction. I should mention it. It's a terminology error. I'll deduct 0.5 for that in Part (a).
      *   So:
          *   (a) 2.5/3
          *   (b) 3/4
