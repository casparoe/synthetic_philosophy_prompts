      *   Wait, is "Ecological Fallacy" wrong enough to deduct in CC Intro Stats? Probably not. But the user asked for an "outside read" acknowledging their strong priors. I should be precise. I'll note it as a "terminology imprecision" rather than a hard deduction, or a very small one. Let's keep (a) at 3/3 for *conceptual* understanding, but flag the term in comments. The "Always Condition" in (b) is the bigger sin.

      *   Okay, Plan:
