answer: |-
  Right, pull up a chair. It is good to see you engaging with the material at this level. Your tutor is quite right: asking "So, you think suffering matters more?" is the philosophical equivalent of asking a chef "So, you cook food?" It is technically accurate but utterly unilluminating. The interesting work in suffering-focused ethics (SFE) happens in the nuances of *how* much more it matters, *why* it matters more, and what happens when the theory rubs up against the texture of actual human life.

  Since you need to distinguish between settled ground and contested terrain for your marking, I have structured this to help you navigate that. Below is a brief brainstorm on the pressure points, followed by the interview script, and finally, that crucial note on the state of the literature.

  ### Brainstorm: Where Negative Utilitarianism (NU) is Under Pressure

  *   **The Strength of the Negativity:** Is it *lexical* (no amount of happiness outweighs a certain amount of suffering) or *weighted* (suffering counts for 10x or 100x more than happiness)? Strong NU faces the 'World-Exploder' objection; Weak NU risks collapsing back into Classical Utilitarianism.
  *   **The Source of Normativity:** Is the priority of suffering metaphysical (suffering is objectively 'worse' in kind) or epistemic/pragmatic (we are biased towards happiness, so we need a corrective)?
  *   **The Scope of Agency:** Does the obligation to reduce suffering swallow all personal projects? If I buy my child a toy instead of donating to an analgesic fund, am I acting immorally?
  *   **The Phenomenology:** Is 'suffering' a unified natural kind? Does chronic boredom count the same as acute physical pain? NU relies on a clear distinction between suffering and non-suffering states which psychology sometimes blurs.

  ***

  ### Interview Draft: Questions and Follow-ups

  **Q1. The 'Benevolent World-Exploder' Objection**
  "Let us address the elephant in the room immediately. A classic objection to strong Negative Utilitarianism is that if the cessation of suffering is the sole or primary good, a consistent adherent should support painlessly extinguishing all sentient life if that were the only way to guarantee no future suffering. Are you committed to this conclusion?"

  *   **Follow-up:** "I anticipate you might say that such a scenario is technologically impossible or practically inert, so the objection is theoretical only. But if your moral theory yields a catastrophic verdict in a conceivable hypothetical, does that not suggest the *principle* itself is flawed, regardless of our current technological limitations? Are you modifying the theory to fit our current physics?"

  **Q2. The Asymmetry Intuition**
  "Many people share the intuition that we have a duty not to create a child who will suffer terribly, but no corresponding duty to create a child who will be wonderfully happy. Is your position simply this common asymmetry intuition taken to its logical limit, or is it grounded in something stronger?"

  *   **Follow-up:** "If it is just the asymmetry intuition radicalised, at what point does it break? If the potential happy life contained an *infinite* amount of wellbeing, would you still say there is no duty to create it? I am trying to pin down whether you view happiness as having *zero* intrinsic value, or merely *diminishing* marginal value compared to suffering."

  **Q3. Criterion of Rightness vs. Practical Heuristic**
  "Is Negative Utilitarianism intended as the fundamental criterion of rightness—the actual truth about what makes actions good—or is it better understood as a practical orientation? In other words, is the world objectively structured this way, or should we act *as if* it is because humans are naturally biased towards prioritising pleasure?"

  *   **Follow-up:** "If it is merely a practical heuristic to correct human bias, what is the 'true' underlying theory you are approximating? Classical Utilitarianism? If so, are you not just advocating for a temporary rule of thumb rather than a genuine ethical system?"

  **Q4. Moral Psychology and Personal Relationships**
  "If happiness has no independent moral weight, how do you navigate personal relationships? When you celebrate a friend's promotion or enjoy a meal with your family, are you participating in something morally neutral, or are you implicitly acknowledging a value your theory denies?"

  *   **Follow-up:** "You might reply that personal relationships are permissible as long as they do not increase net suffering. But does this not create a fragmented moral psychology? How do you sincerely celebrate a 'good' moment with a loved one if, fundamentally, you believe that moment carries no positive moral currency compared to the prevention of pain elsewhere?"

  **Q5. Lexical Thresholds**
  "Many modern suffering-focused ethicists opt for a 'lexical' view, where intense suffering cannot be outweighed by any amount of mild pleasure. Do you hold this lexical view, or do you allow for trade-offs where enough happiness could theoretically outweigh a specific instance of pain?"

  *   **Follow-up:** "If you hold the lexical view, where is the threshold drawn? Is there a specific intensity of pain that triggers this absolute priority? If the line is vague, does that not make the theory unstable in real-world policy decisions where we must balance minor pains against major pleasures?"

  **Q6. The 'Happy Slave' Scenario**
  "Consider a scenario where a marginalised group is oppressed but reports high levels of subjective happiness due to adaptive preferences (they have lowered their expectations to cope). Does a Negative Utilitarian intervene to remove the oppression, even if it risks causing the frustration and suffering of unfulfilled desires?"

  *   **Follow-up:** "If you say yes, you seem to be appealing to a value of 'autonomy' or 'truth' independent of suffering. If you say no, you seem to condone slavery provided the slaves are happy. How do you escape this dilemma without importing non-utilitarian values?"

  **Q7. Comparison with Weighted Utilitarianism**
  "Why prefer Negative Utilitarianism over a 'Weighted' Utilitarianism where suffering counts, say, ten times more than happiness? Does the binary distinction of NU offer a genuine advantage, or does a weighting system avoid the counter-intuitive implications of NU while keeping the focus on suffering?"

  *   **Follow-up:** "A defender of weighting might argue that in extreme cases, their view converges with yours, but in mundane cases, it allows for normal life. What specific case does your view handle correctly that a 10:1 weighting view handles incorrectly? I need to know what work the 'Negative' part is doing that 'Weighting' cannot do."

  **Q8. Epistemic Access**
  "Is part of your motivation for this view epistemic? Is it that suffering is simply easier to identify and measure than happiness? We know pain when we feel it, but 'happiness' is conceptually messy."

  *   **Follow-up:** "If we developed perfect neuroscientific measures for happiness that were as objective as our measures for physical pain, would that weaken your commitment to Negative Utilitarianism? If the view depends on our current ignorance about happiness, is it robust enough to be a fundamental ethical truth?"

  **Q9. The Scope of 'Suffering'**
  "How broadly do you define suffering? Does it include mere dissatisfaction, boredom, and frustration, or is it restricted to acute physical and psychological agony?"

  *   **Follow-up:** "If you define it broadly to include frustration, almost all human activity involves some suffering, which makes your view incredibly demanding. If you define it narrowly, you risk ignoring the chronic, low-level misery that shapes most lives. How do you set the boundary without it looking arbitrary?"

  **Q10. Motivation and Burnout**
  "Finally, a question on sustainability. If a moral agent sincerely believes that every moment of happiness is morally negligible compared to the prevention of pain, does this not lead to moral burnout or a form of depressive nihilism?"

  *   **Follow-up:** "You might argue that reducing suffering is a positive, active goal. But without the ability to value the *positive* outcomes of your labour (the happiness created), how do you sustain the motivation to continue? Is the view psychologically self-defeating for the agents trying to implement it?"

  ***

  ### Note on Settled vs. Contested Points (For your Seminar)

  Your tutor wants to see that you know the lay of the land. Here is how you should frame the above questions in your seminar to show you understand the literature:

  1.  **Settled (mostly):** It is largely settled among contemporary defenders (e.g., Clark, Fricke, various SFE proponents) that **Strong NU** (happiness has *zero* value) is untenable because of the World-Exploder objection. Most modern defenders advocate for **Weak NU** or **Lexical NU** (suffering is lexically prior or heavily weighted). If you present the World-Exploder objection as if it destroys *all* versions of the view, you will be marked down. The follow-up in Q1 is designed to acknowledge this distinction.
  2.  **Contested:**
      *   **The Asymmetry:** Whether the asymmetry intuition (Q2) actually entails NU is highly contested. Classical Utilitarians argue the asymmetry is about *contingent facts* (it is easier to make miserable lives than happy ones), not moral value.
      *   **Moral Psychology:** The claims in Q4 and Q10 about whether an NU can have happy relationships or avoid burnout are empirical and contested. Some argue NU leads to 'moral schizophrenia' (living one way, believing another); others argue it is liberating. Present this as an open question.
      *   **Lexical Thresholds:** Where to draw the line (Q5) is a major point of contention. There is no consensus on what intensity of suffering triggers lexical priority.
      *   **Epistemic vs. Ontological:** Whether NU is true because suffering is *objectively worse* (ontological) or just *harder to fix/measure* (epistemic/pragmatic - Q3 & Q8) is a live debate between 'hard' negative utilitarians and 'pragmatic' suffering-focusers.

  Good luck with the seminar. If you ask Q3 and Q5 with the follow-ups provided, you will demonstrate that you understand the structural weaknesses of the theory, not just the surface-level slogans.

  Cheers.
