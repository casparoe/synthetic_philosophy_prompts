          *   *Defender Concession:* Defenders (like Christiano) explicitly worry about *approximations* (e.g., predictive coding in LLMs), not just ideal SI.
          *   *Ranking:* Fatal to the *idealized* claim's relevance, but defenders have already migrated the claim to bounded settings.

