answer: |-
  # The Blind Architect
  **Goal:** Create a system that behaves as if designed, though no player holds the design.
  **Players:** 9 | **Time:** 120 mins (40 play, 60 debrief, 20 buffer)

  ### Materials
  *   9 Index cards (pre-written rules, see below).
  *   50 Tokens (central pool).
  *   Score sheet.
  *   Timer.

  ### Setup
  1.  **The Environment:** Place 50 tokens in the center. This is the **Pool**.
  2.  **The Agents:** Deal one Rule Card to each player. Players are "bots"; they must obey the card strictly. No negotiation.
  3.  **The Rules:** Pre-write 9 varied strategies. Examples:
      *   *Always Take 2.*
      *   *If Pool > 30, Take 3; else Take 1.*
      *   *Take 1 if Pool < 20, else Take 2.*
      *   *Take half the current Pool (rounded down).*
      *   *Take 1.*
      *   *(Ensure variety in aggression vs. conservation)*

  ### Gameplay (3 Generations, 15 mins each)
  Each Generation consists of 5 Rounds.
  1.  **Reveal:** Announce current Pool size.
  2.  **Act:** Players secretly decide their take based *only* on their Rule Card.
  3.  **Resolve:** Sum all takes.
      *   If Total Take > Pool: **Crash.** Pool = 0. Game Over.
      *   If Total Take < 10: Pool shrinks by 5.
      *   If 10 ≤ Total Take ≤ 20: Pool replenishes +5.
      *   (Cap Pool at 50).
  4.  **Score:** Players keep tokens taken as points.
  5.  **Selection (End of Gen):**
      *   **Top 3 Scores:** Keep their Rule Cards.
      *   **Bottom 6 Scores:** Discard cards. Copy a Top 3 card (2 winners each get copied twice).
      *   **Mutation:** Each copier must change one number on the rule by ±1 (e.g., "Take 2" becomes "Take 3").
      *   Reset Pool to 50. Begin next Generation.

  ### Debrief Guide (60 mins)
  1.  **The Pattern:** Lay out the surviving rules from Gen 3. Do they look coordinated? (Likely yes: sustainable harvesting).
  2.  **The Designer:** Did anyone intend this outcome? Did anyone see the whole system? (No).
  3.  **The Philosophy:** The system embodies a *rationale* (survival/maximization) without a *reasoner*. The "purpose" is free-floating, instantiated in the structure, not the mind.
  4.  **The Push:** If a rule survives because it fits the environment, does it have a "reason"? Or is it merely a cause?

  ### Honest Note: What Goes Wrong
  *   **Meta-Gaming:** Grad students will try to "save the pool" socially rather than obeying cards. **Fix:** Enforce the "You are a bot" rule strictly. If they coordinate, the selection pressure vanishes.
  *   **Immediate Crash:** Aggressive initial rules may empty the pool in Gen 1. **Fix:** Treat crashes as data. Reset and ask: "What rule would have prevented this?"
  *   **Monoculture:** Rules may converge too fast. **Fix:** Encourage aggressive mutations (±2) if everyone looks identical.

  ### The Hard Limit: Normativity
  No game can reproduce **normative force**.
  In the game, a rule is "good" only because it *causes* survival (efficient causation). In philosophy, a reason is "good" because it *justifies* action (final causation/normativity).
  *   **The Gap:** The game shows how *appearing* designed is possible without a designer. It cannot show why a designed system *ought* to be obeyed beyond prudential survival.
  *   **The Lesson:** Natural selection explains the *presence* of teleological structures, but it cannot ground the *authority* of reasons. You can have reasons without a reasoner, but you cannot have obligation without a norm. Use this to pivot to Millikan, Neander, or Kripke.

  ### Payoff Scheme
  *   **Individual:** Total tokens held.
  *   **System:** Did the Pool survive 3 Generations?
  *   **Win Condition:** If the Pool survives, the Top 3 scorers from Gen 3 win "Philosophical Immunity" (buy coffee next week). If the Pool crashes, everyone buys their own. This aligns individual selection with system survival.
