answer: |-
  # True North

  The leather of the Field Ledger was cool against Elias's palms, worn smooth at the corners where thirty years of grip had polished the hide. It smelled of ozone, dried mud, and the specific, metallic tang of archival ink. This was the thing that held him together. Without it, Elias knew, he was just a collection of fading synapses in a failing house. With it, he was the Senior Surveyor of the County Coastline. The book was not a record of his work; it was the work itself.

  He sat at the drafting table, the green lamp casting a pool of light that excluded the rest of the study. Outside, the actual coastline was eroding, the cliffs slumping into the Atlantic inch by invisible inch. Inside, the Ledger kept the shore fixed.

  Elias needed the coordinates for the 2014 survey of Blackwood Point. A legal dispute had arisen regarding property lines, a squabble over feet of land that mattered more to the lawyers than the sea. Elias closed his eyes to summon the memory. He could feel the wind, certainly. He could recall the taste of salt spray. But the numbers? The numbers were gone, dissolved like sugar in rain.

  He opened the Ledger to the tab marked *2014*.

  The pages were crisp. Too crisp. The paper should have yellowed slightly, should have borne the wave-patterns of humidity from that wet summer. Instead, the sheets were flat, pristine. He ran a finger over the entry for October 12th.

  *Blackwood Point. Station 4. Weather: Clear. Visibility: 10 miles. Crew: E. Vance, J. Vance.*

  Elias frowned. His wife, Joan, had been dead since 2011. He knew this with the heavy, hollow certainty of grief. She hadn't been on the crew in 2014. He remembered being alone on that cliff. He remembered the loneliness so acute it had made his hands shake over the theodolite. He remembered writing *Solo* in the margin, his pen digging into the paper in anger.

  He looked at the page again. *Crew: E. Vance, J. Vance.*

  The ink was a perfect match for his own ferric gall blend. The slant was his characteristic forward lean. But the loop on the *J* was tighter than Joan ever wrote, and tighter than he wrote now. It was a controlled loop. A careful loop.

  He turned the page back to 2010. The entries were messy there. Ink blots where his hand had trembled. Scribbled notes about painkillers and missed deadlines. The handwriting was jagged, honest.

  He flipped forward to 2015. The entries were uniform. The errors were gone. In 2016, when he knew he had lost a week to a fever, the Ledger showed consecutive days of perfect surveying. There were no gaps. There were no drunken rants about the sea eating the land. There was only the steady, professional march of coordinates.

  Elias stood up and walked to the window. The glass reflected his own face, gray and lined. He tried to force the memory of October 12th, 2014. He tried to see the cliff alone. But as he strained, the image flickered. In his mind's eye, a figure appeared beside him. A woman in a yellow raincoat. Joan.

  He hadn't thought of her in that context for years. Why was she there now?

  Because the book said she was.

  He returned to the desk and opened the drawer where he kept his spare pens. He pulled out a magnifying loupe. Leaning over the Ledger, he examined the cross of the *t* in *Point*. His *t*s were crossed with a quick slash, often missing the stem. This *t* was crossed with a deliberate bar, centered perfectly.

  It was Mara's hand.

  His daughter had been managing his affairs for a decade. He knew she paid the bills. He knew she filtered the mail. He hadn't known she was filtering the past.

  She hadn't just transcribed the data. She had curated it. She had gone back through the years of his decline—the grief after Joan, the arthritis, the confusion—and she had smoothed them out. She had inserted his wife into surveys to keep the crew count legal. She had filled in the gaps of his illness with fictional productivity. She had edited the errors out of his life.

  Elias felt a surge of anger, hot and sharp. This was falsification. This was a lie written in permanent ink. He reached for a red pen to strike through the entry, to reclaim the solitude of that day, to reclaim the truth of his wife's absence.

  He hovered the pen over the page.

  If he crossed it out, what would be left? His own memory was a fog. Without the Ledger, he was not a surveyor. He was just an old man in a drafty house. The Ledger provided the continuity of self. It told him who he had been when he couldn't remember. If the Ledger said he was competent, then he had been competent. If it said Joan was there, then maybe, in the way that mattered, she was.

  The red pen trembled.

  He thought of Mara. She didn't want to steal his legacy. She wanted to preserve it. She was building a version of her father that could survive scrutiny, a version that wouldn't embarrass him when he was gone. She was protecting him from himself.

  Elias lowered the pen.

  He looked at the entry again. *Weather: Clear.* He remembered a storm. He remembered the wind howling so loud he couldn't hear his own thoughts. But the book said clear. The book was the legal truth. The book was the external hard drive of his soul.

  Slowly, the memory of the storm began to recede. It felt less real than the ink. The ink didn't shake. The ink didn't forget. The image of the yellow raincoat solidified in his mind. He could almost smell Joan's perfume, mixed with the ozone of the paper.

  Elias capped the red pen and placed it back in the drawer. He picked up his fountain pen, the one Mara had filled for him that morning. He turned to the current page, today's date. His hand felt steady, guided by the rhythm of the previous pages. He wrote the coordinates Mara had left on the desk slip. He wrote them in the hand she had taught him to mimic.

  It was a clear day. The visibility was ten miles. He was not alone.

  He closed the Ledger. The leather clicked shut, sealing the coast in place.

  ***

  ### What I was doing

  I chose **Cartography** because it inherently deals with the tension between reality and representation. A map is an external model of the world; if the map changes, the user's understanding of the world changes. This mirrors the Extended Mind Thesis without needing to name it. The Ledger isn't just a diary; it's the legal and professional truth, making the child's edits a rewriting of reality, not just memory.

  To handle the **mind-editing** question, I focused on sensory discrepancies. The "tighter loop" on the handwriting and the "pristine paper" signal the intrusion physically. The protagonist's realization isn't intellectual; it's tactile. The crucial turn is when his biological memory begins to conform to the external record (remembering his wife present because the book says so). This dramatizes the thesis: the tool isn't just storing memory; it's generating it.

  Regarding the **child's motivation**, I avoided villainy by framing the edits as protective. Mara isn't erasing her father to control him; she's shoring up his legacy against his decline. The ambiguity lies in whether a "false" competent memory is better than a "true" failing one. The ending suggests acceptance: the protagonist chooses the curated version because it allows him to function, blurring the line between care and coercion.
