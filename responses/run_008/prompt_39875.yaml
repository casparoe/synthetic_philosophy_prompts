answer: |-
  You are absolutely right to feel that the round ended too easily. Your intuition is spot-on: your classmate used a **caricature** of pragmatism to shut down a complex metaphysical debate. It's a "conversation stopper" that sounds deep but collapses under scrutiny.

  You also dug up the correct historical drama: C.S. Peirce (the founder of pragmatism) was indeed horrified by William James's popularization of it. Peirce eventually renamed his own doctrine **"Pragmaticism"** (which he called "ugly enough to be safe from kidnappers") specifically to distance himself from James's version.

  Here is the "Menu of Meanings" for the slogan **"Truth is what works,"** ranked from trivial to extreme. You can bring this list to your next round to show that *which* pragmatism you use changes the outcome entirely.

  ---

  ### The Menu: What "Truth is What Works" Could Mean

  #### 1. The Trivial Correlation (The "Duh" Reading)
  *   **The Claim:** True beliefs tend to be useful. If you believe accurately that fire burns, you won't stick your hand in it. Truth and utility correlate, but utility doesn't *define* truth.
  *   **Plausibility:** **High.** Almost everyone accepts this. True beliefs generally help us navigate reality.
  *   **Does it help your classmate?** **No.** This doesn't make religious belief true just because it provides comfort. It just means comfort is a *benefit* of the belief, not proof of its truth. Science and religion can still contradict on facts (e.g., the age of the earth).
  *   **Who holds this:** Common sense; most realists.

  #### 2. The Peircean "Final Opinion" (The Scientific Reading)
  *   **The Claim:** Truth is the opinion fated to be ultimately agreed to by all who investigate. "What works" means "what withstands all testing by a community of inquirers over the long run."
  *   **Plausibility:** **Medium-High.** It accounts for scientific progress, but assumes an ideal end-point of history we can't verify.
  *   **Does it help your classmate?** **No. It destroys his argument.** For Peirce, truth is **public and objective**, not private. If science and religion make contradictory claims about reality, they can't both be true. One will fail the test of the community in the long run.
  *   **Who holds this:** **C.S. Peirce.** (This is why he hated James's version).

  #### 3. The Jamesian "Cash Value" (The Humanistic Reading)
  *   **The Claim:** Truth *happens* to an idea. An idea is true if it leads to satisfactory experiences and connects well with our existing web of beliefs. "What works" includes emotional and moral satisfaction, not just physical prediction.
  *   **Plausibility:** **Medium.** It captures how humans actually live, but risks blurring the line between "feeling good" and "being real."
  *   **Does it help your classmate?** **Partially, but with traps.** James argued that if a religious hypothesis (like "God exists") gives you vital benefits *and* isn't disproven by science, you have a "right to believe." **However**, James did not say contradictory facts can both be true. If religion claims "The universe is 6,000 years old" and science says "4.5 billion," James would say science wins on that fact. Religion is only "true" in the moral/experiential sphere.
  *   **Who holds this:** **William James.**

  #### 4. The Rortyan "Social Justification" (The Postmodern Reading)
  *   **The Claim:** There is no "Truth" with a capital T waiting out there in the universe. Truth is just "what our peers let us get away with saying." Science and Religion are just different "vocabularies" for different purposes.
  *   **Plausibility:** **Medium-Low.** Very influential in humanities, but scientists and realists hate it because it seems to deny objective reality.
  *   **Does it help your classmate?** **Yes.** This is the strongest philosophical backup for your classmate. If truth is just social utility, then science works for predicting earthquakes, and religion works for comfort. They don't contradict because they aren't trying to describe the same "Reality."
  *   **Who holds this:** **Richard Rorty** (Neo-pragmatist, 20th century).

  #### 5. The Vulgar Subjectivism (The "True For You" Reading)
  *   **The Claim:** If believing X makes me happy, X is true *for me*. No external check required. Contradictory beliefs can coexist because truth is private.
  *   **Plausibility:** **Very Low.** Philosophically incoherent. If "truth" is private, the word loses its meaning. It leads to solipsism.
  *   **Does it help your classmate?** **Yes.** This is exactly what he argued.
  *   **Who holds this:** **No serious philosopher.** This is a pop-culture distortion of James and Rorty.

  ---

  ### The Peirce vs. James Feud: Why it Matters
  You mentioned the fight between Peirce and James. Here is the precise disagreement you can cite:

  *   **Peirce** was a logician and scientist. He wanted pragmatism to be a method for making concepts clear so we could settle disputes. For him, "what works" meant **what predicts future experience correctly for anyone.** He believed in a real world independent of our minds.
  *   **James** was a psychologist and humanist. He wanted pragmatism to open the door for faith, morality, and free will, which strict scienticism closed. For him, "what works" included **personal vitality and moral stamina.**

  **The Split:** Peirce accused James of making truth too subjective. Peirce wrote: *"James's pragmatism is a pro-humanitarian movement, but it is not logic."* Peirce changed his philosophy's name to **Pragmaticism** to say, "I am not responsible for what James is selling."

  ### Is "True For You" Real Pragmatism?
  **Verdict: It is a Strawman.**

  Even William James, the most subjective of the classic pragmatists, did **not** believe truth was purely individual.
  1.  **Consistency:** James said a new belief must be consistent with sensory experience and previous truths. You can't just believe you can fly because it "works" until you jump off a roof.
  2.  **Public Verification:** James acknowledged that for empirical facts (like science), the "working" must be verifiable by others.

  The "True For You" argument is a **relativistic distortion** usually taught in introductory classes because it's easy to digest, but it fails under philosophical pressure.

  ### How to Use This in the Next Round
  Don't just say "he's wrong." Use the menu to force him to pick a lane. Here is a script strategy:

  **1. The Fork:**
  > "My opponent is using a Pragmatist argument. But there are two types. There is **Peirce's Pragmatism**, where truth is what the scientific community agrees on after infinite testing. And there is **Vulgar Pragmatism**, where truth is whatever feels good individually. Which one are you using?"

  **2. The Trap (If he picks Peirce):**
  > "If you mean Peirce, then truth is objective and public. Science and Religion make conflicting claims about the nature of reality (e.g., miracles vs. laws of physics). Peirce would say they can't both be true. So the contradiction remains."

  **3. The Trap (If he picks James/Subjective):**
  > "If you mean that truth is just individual satisfaction, you aren't talking about *truth* anymore, you're talking about *therapy*. If I say 'The earth is flat' and it makes me happy, is that true for me? If you say no, then you admit there are objective facts. If you say yes, you've made debate impossible because we can't disagree on anything."

  **4. The Kill Shot:**
  > "Pragmatism was designed to settle disputes, not dissolve them. Saying 'it's true for you' doesn't solve the contradiction between science and religion; it just ignores it. A real Pragmatist would ask: 'What practical difference does it make?' And if the difference is about whether the universe is designed or random, that is a real conflict that comfort cannot solve."

  ### Summary for your notes:
  *   **Peirce:** Truth = Objective, Community, Long-term. (Kills the "True for You" argument).
  *   **James:** Truth = Experiential, Moral + Empirical. (Allows religion, but not contradictory facts).
  *   **Classmate's Version:** Truth = Private Satisfaction. (Philosophical strawman).
  *   **Debate Move:** Force them to define "works." Does it work for *predicting earthquakes* (Science) or *feeling loved* (Religion)? If the latter, they aren't making truth claims, they are making emotional claims.
