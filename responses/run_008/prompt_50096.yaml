prompt: |-
  I'm taking a seminar on confirmation theory, and for next week each of us has to submit a short "position profile" on the ravens paradox that the rest of the class will then attack. Rather than a paper, it's supposed to be a candid list of what we actually believe. Here is mine, in no particular order: (1) confirmation is probability raising — evidence E confirms hypothesis H relative to background K just in case H is more probable given E and K than given K alone; (2) the equivalence condition: if E confirms H, then E confirms anything logically equivalent to H, so "all ravens are black" and "all non-black things are non-ravens" are confirmed by exactly the same observations; (3) the standard resolution of the paradox is correct: the white shoes, green leaves, and other non-black non-ravens we run across every day really do confirm the raven hypothesis, just to a vanishingly small degree; (4) nonetheless, a randomly observed black raven is substantial evidence for the raven hypothesis — nothing like the negligible support the shoe provides — so Nicod's idea that instances confirm their generalizations is basically right when we sample the right population; (5) an intuition I can't quite shake: how much something confirms a hypothesis about ravens shouldn't depend on how many non-ravens happen to exist in the world — the evidential facts should concern ravens and their color, not the universe's census of shoes and leaves; (6) "all ravens are black" is lawlike in a way that "all non-black things are non-ravens" is not, and I suspect this asymmetry matters to confirmation even though the two sentences are logically equivalent.

  Before I hand this in, I'd like an audit rather than a lecture on the paradox itself; we have all been through the textbook moves many times. What I want to know is which pairs of my six commitments are genuinely in tension, which only look to be, and what the cheapest repair would be in each case. Please rank the tensions by severity instead of presenting them as an unordered list, and be specific about which single commitment is doing the most damage to the package. I have a feeling something has to give, but I honestly can't tell whether it's (3), (5), or (6), and I would much rather find out from you now than from my classmates in the seminar. Two final constraints on the audit: I am not asking you to re-litigate whether the standard resolution is true — that's fixed, since I accept it — I'm asking whether the rest of my package coheres given that I do; and if it turns out that (5) and (6) are pulling in a different direction from the rest of the list, say so plainly rather than splitting the difference to spare me.
