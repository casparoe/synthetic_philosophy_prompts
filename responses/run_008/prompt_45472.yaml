answer: |-
  This is a classic debate that mirrors arguments found in academic circles (specifically the reception of Steven Pinker's *The Better Angels of Our Nature*). You couldn't referee it because they aren't arguing about the same thing; they are arguing past each other using different ethical frameworks and definitions.

  Here is the move-by-move breakdown, followed by the specific answers to your questions about the metrics and the "no fact of the matter" claim, and finally, an overall verdict.

  ### Move-by-Move Breakdown

  **1. The Metric: Per Capita (Ravi) vs. Absolute Numbers (Jess)**
  *   **Ravi's Claim:** Per capita is the only fair way to measure safety/risk (analogy: road deaths per mile).
  *   **Jess's Claim:** Absolute numbers matter morally (100 million dead is worse than 2 million dead, regardless of population).
  *   **Who is right?** **Both.**
      *   Ravi is right if the question is: *"Is it safer to be a human being today than in the past?"* Per capita measures individual risk. If you are a random soul being born, your odds of violent death are lower now.
      *   Jess is right if the question is: *"Is there less total suffering in the world?"* Moral utilitarianism usually counts every pain equally. If 100 million people suffer, that is a larger universe of pain than 2 million, even if the percentage is lower.
      *   **Verdict:** Ravi wins on *sociological risk*; Jess wins on *aggregate harm*.

  **2. The "Progress Trap" Argument**
  *   **Ravi's Claim:** By Jess's metric (absolute numbers), progress is impossible if the population grows, so the metric is broken.
  *   **Jess's Claim:** That's the problem with per capita; it allows absolute suffering to rise while claiming "progress."
  *   **Who is right?** **Ravi is logically right; Jess is morally right.**
      *   Ravi correctly identifies a mathematical constraint: If population doubles and violence rates stay the same, absolute deaths double. If Jess defines "less violent" as "fewer total deaths," then a growing world can never be "less violent" unless violence is eradicated faster than population growth. Ravi is correct that this makes the metric useless for tracking *safety*.
      *   However, Jess is correct that this mathematical constraint doesn't solve the moral problem. A world where 100 million die is a greater tragedy than one where 1 million die, even if the former is "safer" per person.
      *   **Verdict:** Ravi wins the logical point; Jess wins the ethical point.

  **3. The Definition of Violence (Humans vs. Animals/Structural)**
  *   **Jess's Claim:** Excluding factory farming (tens of billions of animals) is question-begging. Structural violence (poverty/sanctions) should count.
  *   **Ravi's Claim:** Violence means human-on-human killing. Counting animals is a category error ("adding shrimp").
  *   **Who is right?** **Jess.**
      *   Ravi is relying on a colloquial definition of violence to protect a statistical conclusion. There is no logical reason why "violence" must be restricted to *Homo sapiens*. If violence is "the infliction of physical harm," factory farming is the largest spike in violence in history.
      *   Ravi's "adding shrimp" comment is a rhetorical dismissal, not an argument. To exclude animals, he needs an ethical justification (e.g., "only moral agents can be victims of violence"), which he didn't provide.
      *   Regarding structural violence (sanctions/poverty): This is debated in political science, but Jess is right that excluding it privileges "direct physical force" over "systemic harm," which is a value judgment, not a neutral fact.
      *   **Verdict:** Jess wins this move decisively. Ravi is assuming the conclusion by narrowing the definition.

  **4. The "No Fact of the Matter" Move (Timescales and Framing)**
  *   **Jess's Claim:** The answer changes depending on where you start the clock (World Wars vs. Post-1945) and what you count.
  *   **Who is right?** **Jess.**
      *   This is a valid epistemological point. Trend lines are highly sensitive to "start dates." If you start in 1939, the 20th century is the most violent ever. If you start in 1946, it's the most peaceful. This isn't "giving up"; it's acknowledging that data interpretation requires framing choices that determine the outcome.
      *   **Verdict:** Jess wins. This is a real insight into how statistics work.

  ---

  ### Is the Per-Capita vs. Absolute Debate a Substantive Moral Disagreement?

  **Yes, it is genuinely substantive.** It is not just people picking the measure that flatters their conclusion (though they are doing that too); it reflects two incompatible ethical frameworks.

  1.  **Ravi represents a Contractualist/Individualist view:** He cares about the *social contract* and individual security. For him, "violence" is a breach of the safety society owes the individual. If the *probability* of that breach drops, society is improving. This is the metric of the *citizen*.
  2.  **Jess represents a Utilitarian/Aggregate view:** She cares about the *sum total of suffering*. For her, a death is a unit of badness. It doesn't matter if the *risk* was low; the *reality* of the death is what counts. This is the metric of the *witness* or the *moral accountant*.

  **Why it matters:** If you are planning policy to keep yourself safe, Ravi's metric is more useful. If you are trying to allocate aid to reduce global suffering, Jess's metric is more useful. Neither is "neutral math." Ravi's per-capita choice implicitly values the *living* (their safety) over the *dead* (their memory). Jess's absolute choice implicitly values the *dead* equally regardless of how many others are alive.

  ### Is Jess's "No Fact of the Matter" Move an Insight or Giving Up?

  **It is a real insight.**

  In philosophy, this touches on the concept of **"thick concepts."** Words like "violence," "cruelty," or "progress" are not just descriptive (like "weight" or "height"); they are also evaluative. To say the world is "less violent" is not just to count bodies; it is to make a claim about the *quality* of human civilization.

  Jess is pointing out the **Reference Class Problem**. You cannot calculate a trend without choosing a reference class (e.g., "years since 1945" vs. "years since 1900"). Since there is no objective, God's-eye view on which start date is the "correct" one, the "fact" of the matter is dependent on the frame.

  If she had stopped there, it would be giving up. But she used it to show that Ravi's "fact" is actually a *narrative choice* (choosing the "Long Peace" narrative over the "Total War" narrative). That is a sophisticated critique, not a surrender.

  ---

  ### Overall Verdict: Who is More Right?

  **Jess is more right overall.**

  Here is why: Ravi is making a claim about the *world* ("The world is getting less violent"), but he is actually making a claim about *statistics regarding interstate war and homicide rates among humans*.

  Jess wins because she successfully challenges the **boundary conditions** of the argument.
  1.  **Definition:** She correctly identifies that Ravi's definition of violence is arbitrarily narrow (excluding animals and structural harm). If you include factory farming, Ravi's thesis collapses immediately, as animal slaughter has skyrocketed in absolute and per capita terms alongside human population growth.
  2.  **Moral Weight:** She correctly identifies that per-capita rates can mask increasing total suffering. A "safer" world that produces more total corpses is not obviously "better" in a moral sense.
  3.  **Framing:** She correctly identifies that the "decline of violence" is dependent on cherry-picked start dates (the "Long Peace" only looks impressive if you start counting right after the bloodiest war in history ends).

  Ravi is right about a specific, narrow slice of reality (your individual odds of being murdered by another human are lower). But Jess is right that this slice does not justify the broader conclusion that "the world is getting less violent." Ravi is measuring the temperature of the room while Jess is pointing out the house is on fire.

  ### What Are They Both Missing?

  To truly settle this, they would need to address three things neither of them mentioned:

  1.  **Distribution:** Violence is not evenly spread. The world average might be down, but that often means violence has been concentrated into specific regions (e.g., the Global South or conflict zones). The "peace" Ravi enjoys might be subsidized by violence exported elsewhere.
  2.  **Capacity vs. Actuality:** We may be killing fewer people, but our *capacity* to kill is higher than ever (nuclear weapons, biotech, AI). A world with a 0.1% chance of total annihilation is arguably "more violent" in potential than a world with a 1% chance of localized skirmishes. They are measuring *realized* violence, not *latent* violence.
  3.  **The Monopoly on Violence:** Ravi's data often relies on state stability. Much of the decline in homicide comes from states having a monopoly on force. Jess might argue that "state violence" (police, prisons, borders) is being undercounted by Ravi as "order" rather than "violence."

  **Advice for Dinner:** Tell them they are both right about different things. Ravi is right about **risk**; Jess is right about **harm**. But tell Ravi he loses on the definition of violence (animals count), and tell Jess she loses on the utility of per-capita stats for policy. The truth is: It is safer to be a human, but there is more total suffering, and we are ignoring the animals entirely.
