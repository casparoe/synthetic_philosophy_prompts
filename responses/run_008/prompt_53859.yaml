answer: |-
  Here is a sequence of ten questions designed to be asked conversationally. They are ordered to start with her core argument, move through the specific case studies you requested, and end by cornering the methodological deflection.

  Each question includes a "Likely Answer" (based on her profile) and a "Follow-Up" designed to make the "I'm just a historian" dodge difficult to sustain.

  ### 1. The Normative Hook
  **Question:** "I was really struck by your pushback against the 'debunking' tone most modernists take. You argue that knowing a tradition was invented shouldn't undermine its authority. But isn't calling the debunking tone a 'mistake' itself a normative claim? How do you square that with the idea that we should stick to the historical record?"

  *   **Likely Answer:** "I'm not saying the tradition *should* have authority, just that the historical fact of invention doesn't *remove* it. I'm describing how legitimacy functions, not prescribing it."
  *   **Follow-Up:** "I see, but if the modernist's error is assuming age equals authority, aren't you still making a claim about how we *ought* to value age versus function? If it's purely descriptive, what work is the word 'mistake' doing in your argument?"

  ### 2. The Deception Problem (Tartan/Kilt)
  **Question:** "I want to press on the examples of deliberate invention, like the tartan kilt or certain royal ceremonies. In those cases, the promoters weren't just creating something new; they were actively passing it off as ancient when they knew it wasn't. Even if age doesn't matter, doesn't the *deception* matter for how we treat the tradition now?"

  *   **Likely Answer:** "The deception might be morally questionable, but historically, the tradition succeeded. People believe it now, so it functions as a tradition regardless of the original lie."
  *   **Follow-Up:** "So is the historian's job just to note that it succeeded? If we uncover the lie today, does that change the historical status of the tradition, or are we locked into the success of the original deception?"

  ### 3. The "Invention" Category
  **Question:** "You draw a distinction between 'invented' traditions and organic ones, but every tradition had a first performance somewhere. At what point does 'inventing' a tradition become different from just gradually reshaping an old one? Is 'invention' even a coherent category, or is it just a label we slap on changes we can document?"

  *   **Likely Answer:** "It's about conscious intent. Invented traditions are engineered for a specific political purpose in a short timeframe, unlike slow cultural drift."
  *   **Follow-Up:** "But if the slow drift is also responding to political pressures, just less visibly, isn't the difference just one of archival luck? If we found the memos for the 'organic' traditions, would they look the same?"

  ### 4. The Ethno-Symbolist Objection (Anthony Smith)
  **Question:** "Anthony Smith argued that these 'invented' national traditions only caught on because they latched onto pre-existing ethnic myths and memories. If that's true, doesn't it make the modernist story parasitic on something much older? Are we really talking about invention, or reactivation?"

  *   **Likely Answer:** "Smith tends to essentialize those pre-existing myths. I'm arguing the *national* form is new, even if the symbols are old. The container is invented, even if the water is old."
  *   **Follow-Up:** "But if the water is what gives it value, doesn't focusing on the container mislead us about why the tradition has authority? If the old myths didn't resonate, the new container would have broken, right?"

  ### 5. The "National Dish" Scenario
  **Question:** "Let's test the generalizability of your argument. Imagine a government commission launches a 'national dish' next year and promotes it as something people have always eaten. If the public rejects it and says, 'This isn't us,' is that a failed invention, or does your framework say we just have to wait for it to stick?"

  *   **Likely Answer:** "If it doesn't stick, it wasn't a successful tradition. History is full of failed inventions. I'm analyzing the ones that became constitutive of the nation."
  *   **Follow-Up:** "So the difference between a 'manipulative lie' and a 'functioning institution' is just whether people bought it? That seems to make the historian's judgment entirely dependent on the success of the propaganda."

  ### 6. Evidence Against the Modernist Story
  **Question:** "Stepping back to the historical claim itself: you agree with the modernist picture that these things are recent. But what kind of evidence would count *against* that origin story? Is the 'recent invention' thesis falsifiable for you, or is it the baseline assumption?"

  *   **Likely Answer:** "If we found documentation showing continuous practice back to the medieval period without a break. But for most national symbols, that evidence just doesn't exist."
  *   **Follow-Up:** "But if we find discontinuities in *every* tradition over centuries, does 'continuous practice' become an impossible standard? Are we defining 'modern' by a standard of purity that nothing can meet?"

  ### 7. The "Organic" Strawman
  **Question:** "You suggest modernists smuggle in a romantic assumption that only unplanned, organic practices are 'real.' Do you think historians like Hobsbawm would admit to that, or is that a charitable reading of their subtext?"

  *   **Likely Answer:** "I don't think they'd admit it, but it structures their language. They use words like 'genuine' versus 'fabricated,' which implies the organic is superior."
  *   **Follow-Up:** "If we strip out that language, though, does their historical data still stand? Or are you saying their *findings* are compromised by their *tone*?"

  ### 8. The Central Bank Analogy
  **Question:** "You likened invented traditions to young institutions like central banks or labor unions. We judge those on performance metrics—inflation rates, wage gains. What's the equivalent audit for a national tradition? How do we know if it's 'functioning' well?"

  *   **Likely Answer:** "Social cohesion, political stability, a sense of shared identity. It's harder to measure, but it's observable."
  *   **Follow-Up:** "But those are often the *goals* of the inventors, not necessarily the outcome for the marginalized. If a tradition creates cohesion for one group by excluding another, is it still 'functioning' in your historical sense?"

  ### 9. The Historian's Role (The Deflection Trap)
  **Question:** "You've mentioned a few times that the normative weight isn't your lane. But if the modernist's 'debunking' is a mistake, and you're the one identifying that mistake, aren't you effectively doing the philosophy for us? What is the historian's job left to do if the meaning of the invention is off-limits?"

  *   **Likely Answer:** "My job is to show *that* it was invented and *how*. What people do with that fact is up to them."
  *   **Follow-Up:** "But by framing the 'debunking' as a mistake, you're already telling us what to do with the fact. If you just showed the invention, we might debunk it. By telling us not to, aren't you crossing the line you've drawn?"

  ### 10. The "So What?" (Closing)
  **Question:** "If we accept your argument—that we should treat invented traditions like young institutions—how does that change how we teach nationalism? Do we stop telling students that these traditions are 'made up' because it implies they're fake?"

  *   **Likely Answer:** "We teach them that 'made up' doesn't mean 'false' in terms of social impact. All institutions are made up."
  *   **Follow-Up:** "So the takeaway is that everything is constructed? If that's the case, does the category of 'nationalism' lose its specificity? If the central bank and the flag are both just 'young institutions,' what makes the nation distinct?"

  ### Advice on Delivery
  *   **The Pivot:** If she tries to dodge Q1 or Q9 by saying "I'm not a philosopher," lean into the follow-up. "I'm not asking for a moral theory, I'm asking how you justify using the word 'mistake' in a historical analysis without a normative framework."
  *   **Tone:** Keep it curious. Use phrases like "Help me understand," or "I'm struggling to see where the line is." It makes it harder for her to paint you as hostile.
  *   **The Goal:** You aren't trying to destroy her argument; you are trying to show that *historical description* and *normative implication* are inseparable in her work, forcing her to either own the philosophy or admit her historical argument is thinner than it looks.
