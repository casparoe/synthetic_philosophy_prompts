          *   *Follow-up:* If she says "Provide data," ask if data without interpretation is useful.

      *   *Question 10: The "So What?"* Closing the trap.
          *   *Draft:* So what should we do differently?
          *   *Refinement:* "If we accept your view... how does that change how we teach or write about nationalism?"
          *   *Follow-up:* If she says "No change," ask why the talk mattered.

  4.  **Review and Refine:**
      *   *Tone Check:* Are these too aggressive? Need to ensure they sound like collegial inquiry but with teeth. Use phrases like "I'm curious," "Help me understand," "Pushing on that a bit."
      *   *Deflection Proofing:* Ensure the follow-ups specifically address the "I'm just a historian" dodge. The key is to point out that *choosing* to frame the argument as "the debunking tone is a mistake" is itself a normative move.
