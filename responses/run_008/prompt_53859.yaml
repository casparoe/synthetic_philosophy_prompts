  5.  **Final Polish:** Organize logically. Start with the core argument, move to specific examples, then to broader theoretical implications, end with the disciplinary defense. (Self-Correction: Make sure the follow-ups are distinct and actionable for the user). *Wait, I need to make sure the "Deflection" is specifically targeted.* I will add a specific note to the user about *how* to deploy these if she tries to dodge.

