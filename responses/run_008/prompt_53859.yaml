          4.  Generalization to disliked inventions (e.g., state-mandated "national dish").
          5.  Evidence against the modernist origin story itself.
      *   **Tone:** Conversational, suitable for oral delivery (not reading a journal article).

  2.  **Deconstruct the Speaker's Position & Weak Points:**
      *   *Position:* History = Invented. Normativity = Invention doesn't invalidate function/authority.
      *   *Weak Point 1 (The Deflection):* She claims to do *only* history, but her argument is explicitly *normative* ("the debunking tone... is a mistake," "authority doesn't depend on being ancient"). This is the lever to pry open.
      *   *Weak Point 2 (Deception):* If the invention involved lying about age (Hobsbawm's "invented traditions" often did this), does the *lie* matter, even if the *age* doesn't?
      *   *Weak Point 3 (Categorization):* Where is the line between "inventing" and "evolving"? If everything has a start date, is "invention" a useful category?
      *   *Weak Point 4 (Ethno-symbolism):* If the new symbols only work because of old myths, isn't the "invention" actually a "reactivation"?
      *   *Weak Point 5 (Success Conditions):* Why do some invented traditions stick (kilt) and others fail (forced national dish)? If it depends on popular reception, isn't that a normative/social fact, not just a historical one?

  3.  **Drafting the Questions (Iterative Process):**

      *   *Constraint Check:* Need to sound like a PhD student, not an undergrad. Polite but sharp. Needs to corner the "I'm just a historian" defense.

      *   *Question 1: The Normative Hook.* Start by acknowledging her historical claim but pressing the normative implication she introduced.
          *   *Draft:* You say modernists are wrong to debunk traditions just because they are invented. But isn't that a philosophical claim?
          *   *Refinement:* Make it conversational. "I'm struck by your pushback against the 'debunking' tone..."
          *   *Follow-up:* If she says "I'm just describing," point out she used words like "authority" and "mistake."

      *   *Question 2: The Deception (Tartan/Kilt).* Focus on the *intent* to deceive.
