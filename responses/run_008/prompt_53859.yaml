      *   **Speaker's Tactic:** Deflects normative questions ("I'm a historian, ask a philosopher").
      *   **Goal:** Draft ~10 questions with follow-ups to make that deflection harder.
      *   **Required Content:**
          1.  Tartan-kilt/royal-ceremony examples (deception vs. age).
          2.  Coherence of "invention" vs. gradual reshaping (categorical problem).
