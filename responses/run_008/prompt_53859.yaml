          *   *Refinement:* "Every tradition had a first time... where do you draw the line between 'inventing' a tradition and just tweaking an old one?"
          *   *Follow-up:* If she says "Conscious intent," ask about unconscious biases in historians.

      *   *Question 4: Anthony Smith/Ethno-symbolism.* The parasitic argument.
          *   *Draft:* Anthony Smith says you need old myths. Are you just agreeing with him?
          *   *Refinement:* "Anthony Smith argued these new symbols only stuck because they latched onto older ethnic memories..."
          *   *Follow-up:* If she says "Smith is too essentialist," ask if that makes the 'invention' less potent.

      *   *Question 5: The "National Dish" (Disliked Inventions).* The success condition.
          *   *Draft:* What if the government makes a food up and we hate it? Is that the same?
          *   *Refinement:* "Imagine a commission launches a 'national dish' next year... and promotes it as timeless. If people reject it..."
          *   *Follow-up:* If she says "Then it's not a tradition," ask what historical factor predicts success vs. failure.

      *   *Question 6: Evidence against Modernism.* Falsifiability.
          *   *Draft:* What would prove you wrong about the origins?
          *   *Refinement:* "Stepping back to the historical claim itself... what kind of evidence would make you doubt the modernist origin story?"
          *   *Follow-up:* If she says "None, it's settled," challenge the historical rigor.

      *   *Question 7: The "Organic" Strawman.* Addressing her claim about modernists.
          *   *Draft:* Do modernists really think only organic things are real?
          *   *Refinement:* "You mention modernists smuggle in a romantic assumption... do you think they'd admit that, or is that a charitable reading?"
          *   *Follow-up:* If she says "It's implicit," ask if she's fighting a ghost.

      *   *Question 8: Functional Equivalence (Central Banks).* Her analogy.
          *   *Draft:* You compared traditions to central banks. But banks have audits. Do traditions?
