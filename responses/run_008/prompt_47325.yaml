      *   *Strategy:* I will advise the user to target **Step 1** (for being too strong) and **Step 4** (for ignoring prediction/falsification). But primarily, I need to show how modifying Step 1 saves the day without losing the cool linguistics.
      *   *Actually, the most philosophically robust move:* Attack the move from 1 to 3. Even if language shapes thought, it doesn't mean we can't compare maps to territory.
