      *   *Refinement:* The user explicitly said they want to keep a watered-down Step 1. So I shouldn't tell them to reject it entirely. I should tell them to reject the *inference* from Step 1 to Step 3/4.
      *   *Better Target:* **Step 4** is the real "cheat." It assumes that because observation is categorized, it can't falsify categories. But reality pushes back.
