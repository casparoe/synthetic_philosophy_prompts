answer: |-
  # The Special Composition Question: A Decision Tree

  **Start Here:** Consider all the basic particles (simples) in the universe. **Do *any* of them ever add up to make a new, single object?**
  *   **NO** $\rightarrow$ **NIHILISM** (Only simples exist; there are no tables, bikes, or trees.)
  *   **YES** $\rightarrow$ Go to **Question 1**.

  ***

  **Question 1:** Take two unrelated objects, like **a left glove in a drawer and a grain of sand on Mars**. Do they add up to a single object?
  *   **YES** $\rightarrow$ **UNIVERSALISM** (Any collection of things composes something. "Glove-sand" exists.)
  *   **NO** $\rightarrow$ Go to **Question 2**. *(You believe composition is restricted.)*

  ***

  **Question 2:** Take the parts of a **disassembled bike in a box**. Do they add up to a bike?
  *   **NO** $\rightarrow$ Go to **Question 3**. *(You reject artifacts.)*
  *   **YES** $\rightarrow$ Go to **Question 4**. *(You accept artifacts.)*

  ***

  **Question 3:** Take a **living tree**. Do its parts add up to a tree?
  *   **YES** $\rightarrow$ **ORGANICISM** (Composition occurs *only* when the activity of simples constitutes a life.)
  *   **NO** $\rightarrow$ **NIHILISM (ERROR)** (You said "Yes" at Start, but "No" here and at Q2. You likely hold that *nothing* composes. Return to Start.)
      *   *Note: This branch is effectively unoccupied. No one argues that lives don't compose but random particles do.*

  ***

  **Question 4:** Consider grains of sand added one by one. Is there a **specific, precise number** of grains where a 'pile' definitely pops into existence?
  *   **YES** $\rightarrow$ **BRUTALISM** (There is a sharp fact of the matter about when composition occurs, but no principled story explains *why* it happens there.)
  *   **NO** $\rightarrow$ **COMMON-SENSE RESTRICTED VIEW** (Composition depends on functional unity or human interest; boundaries can be vague.)

  ***

  ### Instructor's Notes: Limitations & Empty Branches

  **1. Which views does this tree fail to separate?**
  *   **Brutalism vs. Common-Sense:** These two often give the *same* Yes/No answers to the cases above (Yes to bikes, No to gloves). They differ on the *metaphysical explanation* of the boundary (sharp brute fact vs. vague/functional), not the verdicts themselves. A student could answer "Yes" to Q4 for either view depending on how they interpret "precise number."
  *   **Organicism vs. Common-Sense:** On **Gloves** (Both No) and **Trees** (Both Yes), these views agree. They are only separated by **Question 2 (The Bike)**. If a student defines "Common-Sense" as rejecting artifacts (e.g., "a broken bike isn't a bike"), they will collapse into Organicism.

  **2. Which branch combinations are unoccupied?**
  *   **Yes to Gloves (Universalism) + No to Bike:** **Incoherent.** If *any* two things compose an object, bike parts definitely do. No one holds this view.
  *   **Yes to Bike (Artifacts) + No to Tree (Organisms):** **Undefended.** While logically possible, no major metaphysician argues that human-made composites exist but natural living organisms do not. (Most argue the reverse: Organisms exist, artifacts do not).

  ***
  *Handout designed for Intro Metaphysics. Cases based on Van Inwagen, Sider, and Merricks.*
