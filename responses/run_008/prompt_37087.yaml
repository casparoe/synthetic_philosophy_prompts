          4.  If none do, state that plainly and suggest what an honest proponent should concede.
          5.  **Style:** British English.
          6.  **Tone:** Academic, analytical, supportive of the student's critical thinking, suitable for a seminar handout or prep notes.

  2.  **Deconstruct the Proverb ("Revolutions devour their children"):**
      *   *Origin:* Often attributed to Danton (supposedly before his execution) or Vergniaud, though likely apocryphal. It's a metaphorical observation, not a sociological law.
      *   *Meaning:* Revolutionary leaders often end up executed by the very movement they led.
      *   *Implication in Seminar:* Inevitability. Structural necessity. Contingency is noise.

  3.  **Develop the "Menu" of Readings:**
      *   *Reading 1: The Universal Law.* All revolutions *must* kill their leaders. (Strong determinism).
      *   *Reading 2: The Statistical Tendency.* It happens often enough to be a pattern, but not always. (Probabilistic).
      *   *Reading 3: The Mechanism of Radicalisation.* The logic of purity/virtue demands escalation. (Ideological/Structural).
      *   *Reading 4: The Normative/Warning.* A comment on the moral cost of overthrowing order. (Philosophical).
      *   *Reading 5: The Ex Post Facto Description.* It's just a witty way of describing what happened, not why. (Descriptive).

  4.  **Evaluate Each Reading:**
      *   *Universal Law:* False. (Glorious Revolution, American Revolution, Velvet Revolution didn't "devour" leaders in the same way).
      *   *Statistical Tendency:* Substantive/Defensible, but weak. It doesn't explain *why* or *when*.
      *   *Mechanism (Logic of Ideology):* Substantive (Furet's argument), but contested (Soboul, Cobban). Doesn't rule out contingency entirely, just weights ideology heavily.
      *   *Normative:* True as commentary, irrelevant to causation.
      *   *Descriptive:* Trivial. It just restates the outcome.

  5.  **Address the Core Inference (Contingency is Irrelevant):**
      *   Does the proverb prove inevitability? No.
      *   Even if there is a tendency, *timing*, *intensity*, and *specific victims* are often contingent.
      *   The proverb conflates *outcome* with *causation*.
      *   *Verdict:* None of the readings license the dismissal of contingency.

  6.  **Drafting the Response (incorporating British English and Academic Tone):**
