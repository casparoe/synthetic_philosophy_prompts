answer: |-
  Where I think it breaks
  The error lies in step (3), the chaining assumption. It presumes that the accessibility relation between possible worlds is transitive across a sorites series of material origins. While standard modal logic often treats possibility as transitive, applying this to identity across gradual changes leads to contradiction. You can maintain that a table could originate from a slightly different hunk without conceding it could originate from a wholly different one, provided you accept that 'possibility' relative to a non-actual world doesn't always chain back to actuality for the same object.

  Why the step looked fine
  This step exploits a robust intuition about negligence: if a change is too small to matter once, repeating it shouldn't suddenly matter. Furthermore, system S4 modal logic validates the transitivity of possibility ($\Diamond \Diamond P \to \Diamond P$), so your flatmate's move looks formally valid. It forces you into a corner where either you accept absurdity or admit a boundary you cannot locate, making the denial of tolerance appear merely dogmatic rather than principled.

  The prices
  First, you can deny transitivity. This saves the intuition that you could have been slightly different, but it requires tweaking standard modal logic. You must accept that what is possible from the perspective of a nearby possible world isn't always possible from here. It's a technical cost, but it preserves the flexibility of identity without making your existence fragile.

  Second, you can deny tolerance (accept your flatmate's view). This keeps logic standard but demands a sharp, metaphysical cutoff. You must believe there is a specific molecule swap where you cease to exist, even if unknowable. This makes existence terrifyingly fragile and implies arbitrary facts about identity that seem devoid of physical grounding, which is the heavy price of denying (2).

  Third, you can accept vague identity. This allows the boundary itself to be fuzzy, but Gareth Evans famously argued this leads to logical contradiction. If it is indeterminate whether object $A$ is identical to $B$, then $A$ has a property (being indeterminately identical to $B$) that $B$ determinately lacks, proving they are distinct. This is generally considered the highest logical price to pay.

  My verdict
  Tell your flatmate he's pushed a useful thought experiment too far. The most defensible position is to deny the chaining step; it avoids the horror of hyper-essentialism without breaking logic too severely. You can breathe easy knowing you'd still exist even if your parents had been interrupted by a minute or two.
