answer: |-
  This is a high-stakes role. You are effectively a fiduciary for people who don't know they have one. The "don't look bad in a screenshot" rule is a reputation shield, not an ethical compass. It protects the company, not the participant.

  Below is a decision procedure grounded in behavioral ethics (specifically Thaler & Sunstein's *Nudge*, Conly's *Against Autonomy*, and standard fiduciary principles), translated into a 15-minute audit for your weekly call.

  ### The Fiduciary Nudge Audit

  **Instructions:** Run these five questions in order. If any question triggers a **STOP**, the proposal is rejected or sent back for redesign unless a specific "Human Override" condition is met.

  #### 1. The Interest Alignment Check
  *Philosophy Grounding:* Principal-Agent problems. Soft paternalism is only permissible if the nudger's interests align with the nudgee's.
  *   **The Question:** "If this default works exactly as intended, who captures the most value: the participant or the company/vendor?"
  *   **Good Answer:** "The participant captures the value (e.g., tax savings, higher match). The company gets no direct fee increase or cost reduction."
  *   **Weak Answer:** "The company saves on admin costs," or "The vendor gets a fee share," or "It helps the employer client look better."
  *   **Decision Rule:**
      *   If **Company/Vendor** captures more value: **STOP.** Reject immediately.
      *   If **Participant** captures value but Company benefits incidentally: Proceed.
      *   **Human Override:** If there is a *mixed* benefit (e.g., participant saves money, company reduces support tickets), you must explicitly weigh whether the company's gain creates an incentive to keep the default even if it stops helping participants.

  #### 2. The Friction Check
  *Philosophy Grounding:* Hard vs. Soft Paternalism. A nudge must preserve freedom of choice. High friction turns a nudge into a mandate.
  *   **The Question:** "To choose the alternative, does the user need to click a button, or do they need to make a call/write a letter/wait on hold?"
  *   **Good Answer:** "One click or one unchecked box on the same screen."
  *   **Weak Answer:** "They have to call a number," "They have to mail a form," or "They have to log into a different portal."
  *   **Decision Rule:**
      *   If **Call/Letter/Wait**: **STOP.** Send back for redesign. Opt-out friction must match opt-in friction.
      *   If **Click/Box**: Proceed.

  #### 3. The Transparency (Sunshine) Test
  *Philosophy Grounding:* Publicity condition. If you can't defend the nudge publicly, it's likely manipulative.
  *   **The Question:** "If we put a tooltip on this default that explains *why* we chose it (e.g., 'We selected this to help you save'), would a reasonable person feel helped or tricked?"
  *   **Good Answer:** "They would feel helped. The reason is clearly for their welfare."
  *   **Weak Answer:** "They might be annoyed," "We'd rather not highlight it," or "It's complicated to explain."
  *   **Decision Rule:**
      *   If **Tricked/Annoyed**: **STOP.** Send back for redesign.
      *   If **Helped**: Proceed.
      *   **Human Override:** If the team disagrees on how a "reasonable person" would feel, you must pause. This is a value judgment about your specific demographic that a checklist cannot settle.

  #### 4. The Deliberation Check
  *Philosophy Grounding:* Bypassing vs. Engaging System 2 thinking. Nudges should aid decision-making, not replace it for high-stakes choices.
  *   **The Question:** "Does this default allow the user to ignore the decision entirely, or does it prompt them to confirm they've seen it?"
  *   **Good Answer:** "It's a default, but the screen requires them to acknowledge the section before submitting," or "It's a low-stakes choice where inertia is the main enemy."
  *   **Weak Answer:** "It happens in the background," or "It's buried in terms they don't read."
  *   **Decision Rule:**
      *   If **Background/Buried** on a **High-Stakes** item (retirement, health coverage): **STOP.**
      *   If **Acknowledged** or **Low-Stakes**: Proceed.

  #### 5. The "Thank Us Later" Test (Ex-Post Validation)
  *Philosophy Grounding:* Ex-post welfare assessment. Would the agent endorse the intervention after experiencing the outcome?
  *   **The Question:** "Imagine the participant finds out a year from now exactly how we steered them. Do they say, 'I'm glad I didn't have to worry about that,' or 'I wish I'd known I had a choice'?"
  *   **Good Answer:** "They are glad. The default solved a problem they admitted they had (e.g., procrastination on saving)."
  *   **Weak Answer:** "They probably won't notice," or "They'll be glad because they got money they wouldn't have otherwise."
  *   **Decision Rule:**
      *   If **Won't Notice**: **STOP.** Stealth is not a feature; it's a bug.
      *   If **Wish I'd Known**: **STOP.** You have violated their agency.
      *   **Human Override (Crucial):** This test misfires when people have *adapted preferences*. If someone has been poor for 20 years, they might thank you for a high-fee loan because it's the only credit they could get, even if it harms them long-term. If the "Thank Us" relies on the user *not understanding the costs*, the test fails. You must verify the user understands the trade-off, not just the outcome.

  ---

  ### Running the Audit on Your Backlog

  #### Case 1: Auto-enroll 401k at 6% with one-click opt-out.
  1.  **Interest Alignment:** Participant gets tax advantage + match. Company gets admin efficiency. *Verdict: Pass (Incidental company benefit).*
  2.  **Friction:** One-click opt-out. *Verdict: Pass.*
  3.  **Transparency:** "We enrolled you at 6% to help you start saving." Most participants feel relieved. *Verdict: Pass.*
  4.  **Deliberation:** High stakes, but inertia is the known enemy. Usually requires acknowledgment of enrollment. *Verdict: Pass.*
  5.  **Thank Us Later:** "I'm glad I didn't have to figure out the percentage myself." *Verdict: Pass.*
  *   **Final Decision:** **APPROVE.** This is the canonical "good nudge." It overcomes procrastination without removing choice.

  #### Case 2: Pre-checked box for paid legal-services perk. Opt-out requires calling a phone number.
  1.  **Interest Alignment:** Vendor gets paid subscription fee. Participant gets a service they may not use. *Verdict: WEAK.* (Vendor benefit is direct; participant benefit is speculative).
  2.  **Friction:** Opt-in is a check; Opt-out is a phone call. *Verdict: **STOP**.*
      *   *Reasoning:* This violates the Friction Check. Making opt-out harder than opt-in is "dark pattern" territory, not nudging. It transforms a soft nudge into a hard barrier.
  *   **Final Decision:** **REJECT.** Send back to design. Opt-out must be a click. Re-evaluate Interest Alignment (is this perk actually valuable?).

  #### Case 3: Default contributions to Employer Fund (higher fees, employer gets fee share). Performance is slightly better (3-year).
  1.  **Interest Alignment:** Participant gets slightly better returns (recently). **Employer gets fee share.** *Verdict: **STOP**.*
      *   *Reasoning:* Even if performance is better, the *structure* creates a conflict of interest. If performance dips next year, the incentive remains to keep the default. The company is monetizing the default status.
  2.  **Friction:** (Assuming one-click). *Verdict: Pass.*
  3.  **Transparency:** "We put you in this fund because our company gets a cut of the fees, but it performed well recently." *Verdict: **STOP**.*
      *   *Reasoning:* No reasonable participant feels "helped" by knowing their administrator is profiting from their asset allocation choice. This fails the Sunshine Test immediately.
  4.  **Deliberation:** High stakes investment choice. *Verdict: Risky.*
  5.  **Thank Us Later:** "I'm glad you put me in the fund that paid you a kickback?" *Verdict: **STOP**.*
  *   **Final Decision:** **REJECT.**
      *   *Note on the "Better Performance" Wrinkle:* You wavered here because the *outcome* was good. But the procedure correctly identifies that the *incentive* is rotten. If you approve this, you are betting on the fund's performance to justify the conflict. If the fund underperforms next year, you have harmed everyone *and* taken a cut. The procedure saves you from betting participant welfare on market timing.

  ---

  ### What This Procedure Can't Do (Limitations)

  **1. It Launders Values as "Best Interests"**
  The procedure assumes you can objectively determine "Participant Value." In Case 1, we assume saving 6% is better than taking home cash to pay off credit card debt. It isn't always. The checklist treats "retirement saving" as an inherent good. If a user is financially distressed, auto-enrollment might cause overdraft fees. The checklist doesn't catch *contextual* harm, only *structural* harm.
  *   *Where it fails:* When the "good outcome" is subjective (e.g., liquidity vs. longevity).

  **2. It Relies on Honest Self-Reporting**
  In the "Interest Alignment" step, your sales team will argue that the Employer Fund *is* in the participant's interest because of performance. The procedure relies on your team answering honestly. If they lie about the friction or the fees, the checklist passes a bad proposal. It is a tool for honest people, not a detector of bad faith.

  **3. It Cannot Resolve Conflicting Fiduciary Duties**
  You serve the employer (who pays you) and the employee (whose money you manage). Sometimes these conflict. Case 3 is exactly this. The procedure says "No," but your contract might say "Yes." The checklist identifies the ethical breach, but it cannot resolve the commercial pressure. That requires a human with the authority to say "No" to revenue.

  **4. The "Thank Us Later" Test is Hindsight Bias**
  People thank you for things that were bad for them (e.g., "Thanks for approving my credit card limit increase" right before they default). The test assumes people know what's good for them ex-post. They often don't. You must pair this test with data, not just imagination.

  ---

  ### Confidence Assessment

  *   **The Decision Procedure Structure:** **High Confidence.** The steps map directly to established behavioral ethics frameworks (Thaler, Sunstein, Halpern) but are operationalized for business speed. The "Stop" rules are clear.
  *   **The Application to Cases 1 & 2:** **High Confidence.** These are standard examples in the literature. Case 2 is a textbook "dark pattern."
  *   **The Application to Case 3:** **Medium-High Confidence.** The procedure correctly flags the conflict of interest. However, I am less confident that your sales team will accept the "No." The logic holds, but the commercial pressure is the variable I can't model.
  *   **The "Thank Us Later" Test:** **Lowest Confidence.** This is the most subjective part of the audit. It relies on the empathy and imagination of the three people on the call. It is the most likely step to be glossed over ("Yeah, they'd be fine with it").
      *   *Recommendation:* To bolster this, require that the "Thank Us" answer be backed by *one* piece of evidence (e.g., "We have support ticket data showing users complain about having to choose this" or "Focus group data shows users want this handled"). Don't let it remain a guess.

  **Final Advice:** The procedure is only as strong as the person willing to invoke the **STOP**. If you are the only one who cares, the checklist becomes a box-ticking exercise. You need the lawyer or the designer to own at least one of the "Stop" conditions so the burden isn't solely on you.
