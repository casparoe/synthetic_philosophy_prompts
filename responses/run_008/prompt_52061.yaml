prompt: |-
  I run the defaults review at a mid-sized company that administers benefits and retirement plans for other employers — so I sign off on things like enrollment defaults, pre-checked boxes, the order options appear in, the wording of prompts. We ship changes maybe six times a quarter and each one touches a few hundred thousand peoples' money, so the stakes are real, but the actual decision happens in a one-hour call with me, a lawyer, and a designer, and none of us has any philosophy training. Right now the defacto rule is "don't do anything that would look bad in a screenshot," which I hate.

  I want an actual decision procedure the team can run on a proposal during that call. Ground it in what the paternalism/nudging literature actually cares about — the difference between steering people toward their own ends vs. toward ends we picked for them, hard vs. soft paternalism, whether a nudge works through the person's deliberation or around it, transparency, how costly the opt-out is — but translated into plain questions a non-philosopher can answer in a few minutes each. For every question, say what counts as a good enough answer, where a weak answer means "no" or "send it back for redesign," and, crucially, where the procedure has to stop and hand it back to a human because the question is one of values that a checklist can't settle. It should also include a step I've been muddling through on my own: a "would they thank us later" test, where you imagine the person finding out a year later exactly how they were steered — and be honest about where that test misfires, since people thank you for stuff that was bad for them all the time.

  Then run the procedure on three real-ish cases from our backlog: (1) auto-enrolling new employees into the 401k at 6% with a one-click opt-out; (2) pre-checking a box that adds a paid legal-services perk onto the enrollment form, where unchecking it requires calling a phone number; (3) defaulting everyone's cafeteria-plan contributions into the employer's own fund option instead of a broad index fund, because the employer gets a share of the fees — the wrinkle being that the employer's fund has actually performed slightly better over the last three years. I expect the procedure to come back with a no on that last one and I want to see whether it does, because that's the case where our sales team will push back hardest, and also the case where I genuinely waver.

  Finally, tell me what the procedure can't do: the kinds of cases it will get wrong, and where it just launders our value judgments into official-sounding steps. When you're done, say how confident you are in each part of what you built, and single out the piece you're least sure of.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **User Role:** Runs defaults review at a mid-sized benefits/retirement plan administrator.
      *   **Context:** High stakes (hundreds of thousands of people's money), low frequency of deep review (1-hour call, 3 people, no philosophy training), current heuristic is "don't look bad in a screenshot" (reputation risk vs. ethical risk).
      *   **Goal:** Create a concrete decision procedure (checklist/questions) grounded in paternalism/nudging literature (Thaler/Sunstein, etc.) but translated into plain language.
      *   **Requirements:**
          *   Questions must be answerable in minutes.
          *   Define "good enough" answers vs. "stop/send back."
          *   Identify where human judgment is unavoidable (value conflicts).
          *   Include a "would they thank us later" test (with caveats on its failure modes).
          *   Apply the procedure to three specific cases (Auto-enroll 401k, Pre-checked legal services with hard opt-out, Employer fund default).
          *   Critique the procedure itself (limitations, value laundering).
          *   Self-assessment of confidence.

  2.  **Deconstruct the Philosophy (Nudging/Paternalism):**
      *   *Libertarian Paternalism (Thaler/Sunstein):* Steer people to improve their lives *as they judge them*, while preserving freedom of choice.
      *   *Hard vs. Soft Paternalism:* Hard restricts choice; soft influences choice.
      *   *Transparency:* Can the nudge be publicized without backlash?
      *   *Opt-out Cost:* How hard is it to choose otherwise?
      *   *Alignment of Interests:* Does the nudger benefit at the expense of the nudgee? (Principal-Agent problem).
      *   *Deliberation:* Does the nudge bypass reasoning or aid it?
      *   *The "Thank Us Later" Test:* Ex-post rationalization vs. genuine welfare improvement.

  3.  **Drafting the Decision Procedure (The "Nudge Audit"):**
      *   *Structure:* Needs to be linear, fast, and decisive.
      *   *Tone:* Professional, direct, actionable.
      *   *Step 1: The Interest Alignment Check.* (Who benefits?) This is the biggest red flag in benefits admin.
      *   *Step 2: The Friction Check.* (Opt-out cost.) Hard vs. Soft.
      *   *Step 3: The Transparency Test.* (Sunshine rule.)
      *   *Step 4: The Deliberation Check.* (Bypassing vs. aiding.)
      *   *Step 5: The "Thank Us Later" Test.* (Ex-post validation.)
      *   *Stop Rules:* Clear criteria for "No" or "Escalate."

  4.  **Refining the Questions (Plain Language Translation):**
      *   Instead of "Is this asymmetric paternalism?" ask "Does this hurt the attentive to help the inattentive?"
      *   Instead of "Transaction costs," ask "How many clicks/calls to change this?"
      *   Instead of "Ex-post welfare," ask "If we put this on the front page of the WSJ, would participants feel helped or tricked?"

  5.  **Addressing the "Thank Us Later" Test Caveats:**
      *   People adapt to bad defaults (status quo bias).
      *   People thank you for restricting freedom they didn't want to use anyway.
      *   Need to distinguish between "glad I didn't have to think" vs. "glad you made the decision for me."

  6.  **Applying to the Three Cases:**
      *   *Case 1 (Auto-enroll 401k @ 6%):* Generally accepted best practice. High alignment, low friction opt-out, aids deliberation (overcomes inertia). *Verdict: Pass.*
      *   *Case 2 (Legal Services, pre-checked, call to opt-out):* High friction (call vs. click). Vendor benefit vs. user benefit. Opaque. *Verdict: Fail (Redesign).*
      *   *Case 3 (Employer Fund Default):* Conflict of interest (employer gets fees). Even if performance is better, the *incentive* is misaligned. Transparency risk is huge. *Verdict: Fail (Escalate/No).* This matches the user's expectation.

  7.  **Critiquing the Procedure (Limitations):**
      *   It can't solve value conflicts (e.g., saving for retirement vs. paying off debt).
      *   It relies on the honesty of the team (value laundering risk).
      *   It assumes "welfare" is objective (it's not).
      *   It might stifle innovation if too rigid.

  8.  **Self-Assessment/Confidence:**
      *   High confidence on the structure and the application to Case 2 & 3.
      *   Lower confidence on the "Thank Us Later" operationalization because it's inherently subjective.

  9.  **Drafting the Content (Iterative refinement):**
      *   *Intro:* Acknowledge the weight of the role.
      *   *The Procedure:* Name it something practical like "The Fiduciary Nudge Audit."
      *   *The Cases:* Walk through step-by-step.
      *   *The Critique:* Be honest about the "value laundering."
      *   *Confidence:* Be specific.

      *(Self-Correction during drafting)*: Make sure I explicitly mention where the procedure *stops* and hands off to human judgment. The prompt asks for "where the procedure has to stop and hand it back to a human." I need to mark those points clearly.
      *(Refining Case 3)*: The prompt says the employer fund performed *better*. This makes it tricky. A pure utilitarian might say "take the money." A fiduciary/deontological view says "conflict of interest." I need to ensure the procedure catches the *conflict* even if the *outcome* is currently positive. The "Interest Alignment" step is key here.

  10. **Final Review against Prompt:**
      *   Grounded in literature? Yes (Thaler/Sunstein concepts).
      *   Plain questions? Yes.
      *   Good/Weak answers defined? Yes.
      *   Stop rules? Yes.
      *   "Thank us later" test included + caveats? Yes.
      *   Three cases run? Yes.
      *   Limitations discussed? Yes.
      *   Confidence levels? Yes.

  11. **Final Polish:** Ensure tone is empathetic to the pressure they are under but firm on the ethics. (Proceed to generate output).

  *(Self-Correction on "Thank Us Later"):* I need to make sure I don't just say "ask them." I need to explain *how* to simulate that answer in the room. It's a thought experiment, not a survey.

  *(Self-Correction on Case 3):* The prompt says "I expect the procedure to come back with a no." I must ensure the logic holds up even with the "better performance" wrinkle. The key is the *fee share*. That creates a structural conflict that overrides temporary performance.

  *(Final check on Confidence)*: Be humble. I am an AI, not an ethicist or a lawyer. I need to state that this is a tool, not a verdict.

