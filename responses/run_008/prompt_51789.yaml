answer: |-
  Dear colleague,

  Your hypothesis strikes me as not only plausible but likely the most accurate diagnosis of why this specific debate has proven so resistant to resolution. You have identified the structural engine of the stalemate rather than merely describing its symptoms. The enduring friction between the normative-concept camp, the performance-error camp, and the deep-self camp arises precisely because they are often answering different questions while believing they are answering the same one. When Knobe argues that the ordinary concept of intentional action is constitutively normative, he is making a claim about the semantic conditions or the functional role of the concept within our practices of holding responsible. He is asserting that normativity is part of the competence model, the very rules that determine whether the word applies. In contrast, when Adams and Steadman argue for a performance effect, they are making a claim about the cognitive mechanisms and processing constraints that lead to reported judgments. They grant that there is a underlying descriptive concept but argue that emotional or moral pressure distorts the output of the system. Meanwhile, when Sripada argues for deep-self concordance, he is offering a theory about the metaphysical or psychological property that the concept is designed to track, suggesting that morality is merely a reliable heuristic for identifying whether an outcome aligns with an agent's deeper attitudes. Because experimental vignettes typically measure only the final binary judgment of whether an action was intentional, they cannot distinguish between a judgment driven by a normative semantic rule, a judgment driven by a descriptive tracking mechanism that uses morality as evidence, or a judgment driven by a descriptive mechanism that is biased by moral emotion.

  This conflation of levels explains why every new manipulation gets absorbed without concession. If you introduce a case where the agent is indifferent, the normative camp says the concept still applies because the harm was foreseen and the agent didn't care, which shows the concept cares about moral standing. The deep-self camp says the indifference reveals a lack of deep-self commitment, explaining the lower intentionality ratings. The performance camp says the ambiguity reduces the emotional charge, reducing the bias. The data underdetermines the theory because the data is just a judgment, and the theories are about different things that produce judgments. Your suggestion that the debate is partly verbal or question-disambiguating is supported by the fact that the parties often agree on the folk judgments but disagree on what those judgments signify about the mind. Knobe treats the judgment as transparent evidence of the concept's structure. The performance theorists treat the judgment as opaque evidence that requires decoding to separate competence from noise. Until the participants explicitly distinguish whether they are arguing about the definition of the word, the architecture of the cognitive process, or the metaphysical conditions of agency, they will continue to talk past one another.

  However, I do not think the diagnosis is entirely a matter of verbal confusion. There is a genuine substantive disagreement hidden inside, as you noted, concerning whether the asymmetry would survive in agents about whom we suspend all blame-relevant attitudes. This is the crux of the bug versus feature debate. If the normative element is constitutive, as Knobe claims, then removing the possibility of blame should remove the asymmetry or fundamentally alter the concept's application. If the normative element is merely a cue for deep-self attitudes, then providing direct access to the deep-self attitudes without moral valence should preserve the asymmetry based on attitude alignment alone. If it is a performance error, then removing the moral pressure should eliminate the asymmetry entirely, revealing a purely descriptive underlying concept. The reason this substantive disagreement remains unresolved is that we cannot fully suspend blame-relevant attitudes in human agents without making them so alien that the concept of intentional action no longer applies. We cannot easily disentangle the moral valence of an outcome from the evidence it provides about the agent's character in a way that satisfies all three camps. Consequently, the empirical question you posed is theoretically sound but practically difficult to isolate, which reinforces the stalemate.

  Given this diagnosis, progress would not come from another vignette study that tweaks the surface features of the chairman case. Instead, progress would require a methodological shift that targets the level of explanation directly. For the performance camp to win, they would need process-tracing data, such as reaction times or neural imaging, showing that moral evaluation occurs after the initial intentionality computation, thereby proving it is a downstream bias. For the normative camp to win, they would need to show that even when processing speed is controlled and deep-self attitudes are held constant, moral valence still dictates the judgment, implying it is a primary input rather than a heuristic. For the deep-self camp to win, they would need cases where moral valence and deep-self concordance dissociate completely, showing that intentionality tracks the concordance regardless of the moral value. Some work has attempted this, such as cases involving non-human agents or agents with inverted moral values, but these are often dismissed by the opposing camps as changing the subject or introducing new confounds. A more promising avenue for progress might be a conceptual distinction that accepts pluralism. If we accept that the word intentional serves multiple functions—sometimes descriptive, sometimes normative, sometimes tracking—then the debate shifts from which theory is true to which function is being activated in which context. This would dissolve the stalemate by acknowledging that all three camps are capturing a real facet of a complex, polysemous concept.

  Ultimately, I believe the impasse should be accepted as the price of asking a question that conflates semantics with psychology. The question what does the asymmetry show is too broad because the asymmetry shows something about semantics, something about psychology, and something about metaphysics simultaneously. The folk concept of intentional action is not a natural kind waiting to be discovered by experiment; it is a tool used in social negotiation, cognitive prediction, and moral assessment. Trying to find a single unified theory that explains all uses of the concept is likely a category error. The most productive path forward is to stop treating the debate as a zero-sum game where one camp must be declared the winner and instead treat the competing accounts as complementary descriptions of different levels of a complex social-cognitive system. If the literature moves toward this kind of integration, acknowledging that the concept is semantically sensitive to normativity, psychologically implemented via heuristics that track attitudes, and functionally used for blame, then the stalemate will end not because one side conceded, but because the question itself was refined enough to make the disagreement vanish. Until then, you are correct that further experimental manipulations will likely be absorbed into the existing frameworks without resolving the core interpretive dispute.
