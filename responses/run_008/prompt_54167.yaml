prompt: |-
  I'm a backend engineer with no formal philosophy training, but I've been in a standing argument with my brother-in-law about housing for over a year. He's active in his neighborhood association and fought a rezoning that would have allowed mid-rise apartments near our transit station; I keep insisting the shortage is a supply problem and that opposing new homes is free-riding on scarcity. We've recently realized we mostly argue past each other: he's talking about who has standing to decide what happens to a place people have invested decades in, and I'm talking about what happens to prices when supply is choked off. Rather than keep circling, we want to try an adversarial collaboration, and I'd like you to draft the joint statement for us to work from.

  Please write the document a committed YIMBY (broad claims of newcomers and renters to live where opportunity is, skepticism of incumbent veto) and a committed NIMBY (neighborhood self-determination, the moral weight of residents' long-term investment in a place, preservation of community character) could both put their names to after a good-faith exchange. It should contain: (1) a numbered section of claims both sides accept — about the facts of the housing market, about what zoning actually does, and about whose interests are at stake; (2) a disagreements table in which each disagreement is stated in wording its own side would sign off on — I suspect one genuine dispute is whether longtime residents have a moral claim on the character of their neighborhood, and another whether opposing development can be justified even if it does worsen affordability, but tell me honestly if some of our fight is really about what the word "community" means rather than a substantive question; (3) the cruxes — the sub-questions such that settling one would move at least one of us; and (4) for each crux, a concrete case, argument, or policy experiment we'd both agree bears on it, with each side's prediction recorded in advance. Throughout, please keep separate what is genuinely settled among people who study housing from what is still contested, and flag rather than paper over any point where the draft risks presenting one side's contested empirical assumption as agreed fact.
reasoning: |-
  Here's a thinking process that leads to the suggested joint statement:

  1.  **Analyze the Request:**
      *   **User:** Backend engineer, no philosophy training, in a year-long argument with brother-in-law (BIL) about housing/zoning.
      *   **BIL:** Active in neighborhood association, fought rezoning (NIMBY perspective: standing, investment, character).
      *   **User:** YIMBY perspective (supply shortage, free-riding on scarcity, affordability).
      *   **Goal:** Draft a "Joint Statement" for adversarial collaboration.
      *   **Requirements:**
          1.  Numbered section of *agreed claims* (facts, zoning, interests).
          2.  *Disagreements Table* (worded so each side can sign their row).
          3.  *Cruxes* (sub-questions that, if settled, would move a needle).
          4.  *Tests/Evidence* for each crux (concrete cases, predictions).
          5.  **Constraint:** Distinguish settled science from contested assumptions. Flag where one side's assumption might be masquerading as fact.
      *   **Tone:** Collaborative, precise, philosophical but accessible, fair to both sides.

  2.  **Deconstruct the Positions:**
      *   **YIMBY (User):** Housing is a regional/national good. Supply constraints drive up prices. Exclusionary zoning is morally problematic (opportunity hoarding). Incumbents shouldn't have veto power over regional needs.
      *   **NIMBY (BIL):** Neighborhoods are social contracts. Long-term residents have invested sweat equity and social capital. "Community character" has moral weight. Local democracy/standing matters. Change should be consensual, not imposed.

  3.  **Drafting - Section 1: Agreed Claims (Common Ground):**
      *   *Need:* What can both actually agree on without lying?
      *   *Fact:* Housing costs have risen faster than incomes.
      *   *Fact:* Zoning restricts supply. (This is technically true, though the *magnitude* of the effect is debated. Need to be careful here).
      *   *Fact:* Both sides care about community well-being, just define it differently.
      *   *Fact:* Displacement is bad.
      *   *Constraint Check:* The prompt asks to flag where empirical assumptions are contested. I need to make sure I don't state "Zoning causes high prices" as an absolute fact if the NIMBY side disputes the *causal link's strength*. Better to say "Zoning limits the *type* and *density* of housing, which influences market dynamics."
      *   *Refinement:* Let's focus on the *mechanism* both accept. Zoning restricts what can be built. Scarcity exists. Both want stable neighborhoods.

  4.  **Drafting - Section 2: Disagreements Table:**
      *   *Need:* Contrasting statements that capture the core philosophical clash.
      *   *Topic 1: Moral Standing.* YIMBY: Renters/Newcomers have a right to opportunity. NIMBY: Existing residents have a right to stewardship.
      *   *Topic 2: The Nature of "Community".* YIMBY: Community is fluid/network-based. NIMBY: Community is place-based/history-based.
      *   *Topic 3: Justification of Opposition.* YIMBY: Opposing supply is harmful externalization. NIMBY: Opposing specific projects is legitimate risk management.
      *   *Constraint Check:* The prompt asks to identify if the fight is about the *word* "community". I should explicitly note this in the analysis or the table. Let's put it in the table as a definitional divergence.

  5.  **Drafting - Section 3: Cruxes:**
      *   *Need:* What specific belief, if changed, changes the conclusion?
      *   *Crux 1: The Elasticity Question.* If we build, do prices go down (or rise slower)? YIMBY says yes. NIMBY says "induced demand" or "luxury building doesn't help poor people."
      *   *Crux 2: The Moral Weight of Investment.* Does buying a home grant political veto power?
      *   *Crux 3: The Scale of Governance.* Who decides? The neighborhood or the region?

  6.  **Drafting - Section 4: Tests/Predictions:**
      *   *Need:* How do we test the cruxes?
      *   *Test 1 (Supply):* Look at a specific upzoning case (e.g., Minneapolis, Auckland, or a specific local corridor). Prediction: YIMBY says rents stabilize relative to control. NIMBY says no change or displacement increases.
      *   *Test 2 (Character):* Define "character." Is it physical or social?
      *   *Test 3 (Process):* Try a participatory design process. Does it reduce opposition?

  7.  **Review and Refine (Self-Correction/Philosophy Check):**
      *   *Critique:* Is this too YIMBY-leaning?
      *   *Correction:* Ensure the NIMBY arguments aren't strawmanned as "racist" or "selfish." Frame them as "local stewardship" and "democratic legitimacy."
      *   *Critique:* Is the empirical distinction clear?
      *   *Correction:* Add explicit "Epistemic Flags" where economists agree but laypeople dispute, or where philosophy dominates economics.
      *   *Specific Prompt Requirement:* "Flag rather than paper over any point where the draft risks presenting one side's contested empirical assumption as agreed fact." -> I need to add a preamble or footnotes that explicitly state where the "Agreed Claims" are actually just "Agreed to for the sake of argument" or where consensus is shaky.
      *   *Specific Prompt Requirement:* "Tell me honestly if some of our fight is really about what the word 'community' means." -> I need to address this in the Disagreements or Cruxes section.

  8.  **Final Polish:**
      *   Structure the document clearly.
      *   Use neutral language.
      *   Ensure the "Adversarial Collaboration" spirit is present (i.e., we are trying to find truth, not win).
      *   *Crucial:* The prompt asks me to write the *document* they will work from. It should look like a draft they can edit together.

  9.  **Mental Sandbox - The "Community" Definition:**
      *   YIMBY: Community = People + Opportunity.
      *   NIMBY: Community = Place + History + Relationships.
      *   This is a semantic/ontological disagreement, not just empirical. I must highlight this.

  10. **Mental Sandbox - The Empirical Flag:**
