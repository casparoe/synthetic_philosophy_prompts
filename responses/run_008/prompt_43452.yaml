prompt: |-
  In my ethics elective last week, two classmates got into a prolonged argument about whether it is legitimate to settle a moral question on someone else's say-so, and our teacher refused to referee it, so I am asking you to do it instead.

  The occasion: Priya recently became a vegetarian, but only after her older sister, who had spent a semester seriously researching factory farming, told her that eating factory-farmed meat is wrong. Priya never worked through the arguments herself; she trusted her sister's judgment and changed her diet on that basis.

  (1) Theo said Priya's position is defective: she is borrowing her sister's conscience rather than forming her own judgment, and a moral belief you cannot defend is not one you really hold.

  (2) Priya replied that nearly all her beliefs are secondhand. She believes germs cause disease and that Antarctica is covered in ice purely on the testimony of people who checked, and no one calls those beliefs defective; demanding firsthand verification of everything would be absurd.

  (3) Theo drew a line between factual and moral testimony: with germs, the testifier's judgment bottoms out in observations anyone could in principle make, whereas with morality there is nothing behind the judgment except more judgment. Deferring to her sister doesn't answer Priya's question; it just relocates it into her sister's head.

  (4) Priya countered with expertise: her sister spent months on the question and is more reflective than she is, and we happily defer to doctors and lawyers, who also exercise judgment rather than mere observation. Refusing to defer to a more careful thinker on a moral question is not conscientiousness but arrogance.

  (5) Theo conceded part of this but refined his claim: perhaps testimony can hand you knowledge that something is so while failing to hand you understanding of why — the way a student might know a theorem is true because a trusted teacher certified the proof, yet be unable to reconstruct it. And perhaps in morality, unlike geometry, acting well requires the understanding-why, because the point of moral judgment is to respond directly to the reasons themselves, not merely to register a verdict. Someone who acts on borrowed conclusions is like someone reciting an apology she does not understand.

  (6) Priya answered that this relocates the complaint from testimony to understanding, and that if moral testimony transmits knowledge but not understanding, it is in the same boat as almost everything else we believe; moreover, if Theo's demand for first-hand moral reasoning were right, we could hardly hold any moral belief, since parents and teachers shape nearly all of them.

  Theo's last word was that parents and teachers transmit reasons and methods, not bare verdicts — moral education is instruction, not testimony — so the cases differ in kind, not degree.

  Please adjudicate this exchange move by move: for each numbered step, say whether the speaker is right, partly right, or mistaken, and justify each rating. Then say who comes out more right overall, and identify anything important that both of them missed. I have gone back and forth on this and honestly cannot settle it myself.
reasoning: |-
  Here's a thinking process that leads to the adjudication:

  1.  **Analyze the Request:**
      *   **Task:** Adjudicate a philosophical debate between two students (Theo and Priya) regarding the legitimacy of relying on moral testimony (settling a moral question on someone else's say-so).
      *   **Context:** Priya became a vegetarian based on her sister's testimony. Theo argues this is defective; Priya argues it's normal/legitimate.
      *   **Structure:** There are 6 numbered moves in the debate. I need to evaluate each move (Right/Partly Right/Mistaken + Justification).
      *   **Conclusion:** Determine who is "more right" overall.
      *   **Addition:** Identify important points *both* missed.
      *   **Tone:** Philosophical, balanced, analytical, helpful (acting as the referee the teacher refused to be).

  2.  **Deconstruct the Debate Moves:**

      *   **(1) Theo's Opening:** Moral beliefs require personal defense/judgment. Borrowing conscience is defective.
          *   *Analysis:* This is the "Autonomy Constraint" or "Kantian" view. Moral agency requires understanding *why*. However, it seems too strict (what about children?).
          *   *Verdict:* Partly Right. Captures an ideal of moral agency but ignores the necessity of trust in development.

      *   **(2) Priya's Analogy:** Factual testimony (germs, Antarctica) is accepted; why not moral? Demanding firsthand verification is absurd.
          *   *Analysis:* This is the "Argument from Analogy" with factual testimony. Strong point about epistemic division of labor. Weak point: Morality might be different from facts (is/ought problem).
          *   *Verdict:* Partly Right. Good point about epistemic reliance, but ignores potential disanalogies between fact and value.

      *   **(3) Theo's Distinction:** Factual testimony bottoms out in observation; moral testimony bottoms out in judgment. Deferring just relocates the question.
          *   *Analysis:* This touches on the "Non-Naturalist" or "Sentimentalist" worry. If morality isn't observable, what is the sister seeing? However, moral realists would argue there are moral facts/reasons accessible to reason.
          *   *Verdict:* Partly Right. Highlights a potential disanalogy, but assumes morality lacks a "fact-like" grounding that reason can access.

      *   **(4) Priya's Expertise Argument:** We defer to experts (doctors/lawyers) who use judgment. Refusing to defer is arrogance.
          *   *Analysis:* Strong point. Moral expertise is a contested concept, but *reflective expertise* exists. Arrogance is a real risk in rejecting testimony.
          *   *Verdict:* Right (mostly). The analogy to professional expertise holds water, provided moral expertise is possible.

      *   **(5) Theo's Knowledge vs. Understanding:** Testimony gives knowledge-that, not understanding-why. Moral action requires understanding-why (responding to reasons).
          *   *Analysis:* This is the strongest philosophical point (Hills, "Moral Understanding"). Acting for the right reason matters. Blind obedience isn't virtue.
          *   *Verdict:* Right. This distinguishes moral agency from mere correct behavior.

      *   **(6) Priya's Rebuttal & Theo's Final Word:** Priya: Everyone lacks full understanding. Theo: Education transmits *reasons*, not just verdicts.
          *   *Analysis:* Priya is right that we all lack full understanding. Theo is right that *ideal* education teaches reasoning, but in practice, it often involves verdicts ("Don't hit").
          *   *Verdict:* Both Partly Right. Theo draws a distinction that is often blurred in reality.

  3.  **Evaluate "Who is More Right?":**
      *   Theo focuses on the *ideal* of moral agency (autonomy, understanding reasons).
      *   Priya focuses on the *reality* of epistemic life (division of labor, trust, expertise).
      *   *Synthesis:* Priya is right that it is *permissible* to start with testimony. Theo is right that it is *defective* to stop there. Priya wins on the legitimacy of the *belief*; Theo wins on the quality of the *agency*.
      *   *Overall:* It's a draw, but Theo's final distinction about education is crucial. However, Priya's practical point about the impossibility of verifying everything is more robust for daily life. Actually, looking at the specific case (Priya changing diet), Priya is more right that the action is legitimate, even if Theo is right that her moral *maturity* is incomplete.
      *   *Decision:* Priya is more right about the *legitimacy* of the belief formation. Theo is more right about the *ideal* of moral character. I need to weigh which question was asked: "Is it legitimate to settle a moral question on someone else's say-so?" Priya says yes, Theo says no. Philosophical consensus generally leans toward: It's legitimate to *acquire* the belief, but defective to *act* without eventually grasping the reasons. So, it's a nuanced split. I will lean slightly toward Priya on the specific question of *legitimacy of belief*, but acknowledge Theo's point on *moral worth*.

  4.  **Identify Missing Points:**
      *   **Moral Testimony Pessimism vs. Optimism:** This is a live debate in meta-ethics (Hopkins, Hills, etc.).
      *   **The Role of Emotion/Sentiment:** Morality isn't just cognitive; it involves caring. Testimony might transfer the fact but not the care.
      *   **The Stakes:** Factory farming involves complicity. Acting on testimony reduces personal complicity less than acting on conviction?
      *   **Developmental Trajectory:** Testimony is a scaffold, not a permanent crutch.
      *   **The Nature of the Sister's Claim:** Was it "Meat is wrong" (verdict) or "Here is the suffering involved" (reason)?

  5.  **Drafting the Response:**
      *   *Introduction:* Acknowledge the complexity. This is a classic debate in meta-ethics (Moral Testimony).
      *   *Step-by-Step Adjudication:* Go through 1-6. Use "Partly Right" often because philosophy is rarely binary.
      *   *Overall Verdict:* Weigh the arguments.
      *   *Missing Elements:* Add the meta-ethical context and the developmental aspect.

      *(Self-Correction during drafting)*: Be careful not to just say "Philosophers disagree." I need to make a judgment call as the referee.
      *   Move 1: Theo is too rigid. Moral beliefs can be held on testimony initially. -> Partly Right.
      *   Move 2: Priya's analogy is strong but morality might be special. -> Partly Right.
      *   Move 3: Theo's observation point is weak (moral realism exists). -> Partly Right/Mistaken.
      *   Move 4: Priya's expertise argument is strong. -> Right.
      *   Move 5: Theo's "Understanding" point is the strongest philosophical move. -> Right.
      *   Move 6: Theo's distinction on education is idealized. -> Partly Right.

      *Overall:* Theo wins on the *nature of virtue*, Priya wins on *epistemic practice*. The prompt asks if it is *legitimate to settle* a moral question. If "settle" means "decide how to act," Priya is right. If "settle" means "resolve the normative status for oneself," Theo is right. I will argue Priya is more right about the *permissibility*, Theo about the *aspiration*.

      *Missing:* The distinction between *acting rightly* and *acting virtuously*. The role of moral emotions. The temporary vs. permanent nature of the deference.

  6.  **Refining the Tone:**
      *   Ensure I don't sound condescending.
      *   Keep it structured clearly.
      *   Make sure the "Missing" section adds value beyond just summarizing.

  7.  **Final Polish:** Check against the prompt requirements.
      *   Adjudicate move by move? Yes.
      *   Right/Partly Right/Mistaken? Yes.
      *   Justify each? Yes.
      *   Who is more right overall? Yes.
      *   What did both miss? Yes.

      *(Final thought on Move 3)*: Theo says "with morality there is nothing behind the judgment except more judgment." This assumes non-naturalism or expressivism. If moral naturalism is true, there *are* facts (suffering). So Theo is making a meta-ethical assumption he hasn't defended. I should note that.

      *(Final thought on Move 5)*: This is the core of the "Moral Understanding" debate (Alison Hills). Theo is channeling Hills. This is a very strong point.

      *(Final thought on Move 6)*: Theo says parents transmit reasons. Often they say "Because I said so." So Theo is idealizing education.

      *Overall Winner:* I'll give the edge to Priya on the specific question of *legitimacy*, because Theo's standard makes moral life impossible for most people most of the time. But Theo identifies a crucial deficit.

      *Let's write it.*
answer: |-
  This is a classic debate in contemporary meta-ethics, often framed as the problem of **moral testimony**. Philosophers like Alison Hills, Sarah McGrath, and David Enoch have wrestled with exactly these moves. As your referee, I will adjudicate each step based on the strength of the philosophical reasoning, then offer a final verdict and identify the blind spots.

  ### Step-by-Step Adjudication

  **(1) Theo: "Borrowing conscience is defective... a moral belief you cannot defend is not one you really hold."**
  *   **Verdict: Partly Right.**
  *   **Justification:** Theo captures an important ideal of moral agency: autonomy. There is a significant difference between *doing the right thing* and *acting virtuously*. If Priya avoids meat only because she was told to, she lacks the moral understanding that gives the action its full ethical worth. However, his claim that she does not "really hold" the belief is mistaken. She genuinely believes meat-eating is wrong; she just lacks the *justification* for it. Belief and justification are distinct.

  **(2) Priya: "Nearly all beliefs are secondhand... demanding firsthand verification of everything would be absurd."**
  *   **Verdict: Right.**
  *   **Justification:** Priya correctly identifies the "epistemic division of labor." We rely on testimony for almost everything (history, science, geography). To demand firsthand verification for all moral beliefs would lead to skepticism or paralysis. If testimony is legitimate for complex factual claims (like climate change), there is a strong prima facie case that it should be legitimate for moral claims, which are often equally complex.

  **(3) Theo: "Factual testimony bottoms out in observations... with morality there is nothing behind the judgment except more judgment."**
  *   **Verdict: Partly Right / Mistaken.**
  *   **Justification:** Theo identifies a potential disanalogy: moral claims aren't verified by telescopes or microscopes. However, his claim that there is "nothing behind the judgment except more judgment" assumes a specific meta-ethical view (non-naturalism or expressivism) that is contested. Many moral realists argue moral judgments bottom out in facts about suffering, well-being, or rationality, which are accessible to reason even if not "observable" in the scientific sense. He is right that morality is reason-based, but wrong to imply it lacks objective grounding.

  **(4) Priya: "We happily defer to doctors and lawyers... Refusing to defer... is arrogance."**
  *   **Verdict: Right.**
  *   **Justification:** This is Priya's strongest move. We accept "expertise" in fields requiring judgment (law, medicine, engineering). If moral reasoning is a skill that can be developed (as her sister did), then deferring to a more reflective, informed agent is rational, not arrogant. To insist on working out every ethical implication oneself is a form of epistemic egoism that ignores the reality of cognitive limitations.

  **(5) Theo: "Testimony can hand you knowledge... while failing to hand you understanding... acting well requires the understanding-why."**
  *   **Verdict: Right.**
  *   **Justification:** This is the most philosophically sophisticated point in the exchange (echoing the work of philosopher Alison Hills). There is a distinction between *moral knowledge* (knowing X is wrong) and *moral understanding* (grasping *why* X is wrong). Theo is correct that moral worth typically requires responding to the *reasons* for an action, not just the verdict. If Priya stops eating meat merely to obey her sister, she isn't responding to the suffering of animals; she is responding to her sister's authority. That limits the moral value of her action.

  **(6) Priya & Theo: "If Theo's demand... were right, we could hardly hold any moral belief" vs. "Parents and teachers transmit reasons... not bare verdicts."**
  *   **Verdict: Both Partly Right.**
  *   **Justification:** Priya is right that in practice, most adult moral beliefs are inherited without full reconstruction. Theo is right about the *ideal* of moral education, but mistaken about the *reality*. Parents often transmit verdicts ("Don't hit") before children can understand the reasons. Theo draws a clean line between "instruction" and "testimony" that is often blurred in real life. However, he is correct that the *goal* of education is to move from verdict to reason.

  ---

  ### Overall Verdict

  **Who comes out more right?**
  **Priya** is more right about the **legitimacy of the belief**, but **Theo** is more right about the **quality of the agency**.

  If the question is "Is Priya allowed to believe eating meat is wrong based on her sister's say-so?" Priya wins. It is epistemically permissible to rely on trusted testimony for moral beliefs, just as it is for scientific ones. To deny this makes moral life impossible for non-experts.

  However, if the question is "Is Priya's moral stance fully mature or virtuous?" Theo wins. Relying permanently on testimony creates a deficit in moral understanding. Priya is doing the right thing, but she is not yet fully exercising her moral agency.

  **Final Ruling:** **Priya** takes the round on the specific question of *legitimacy*. Theo sets a bar for moral *perfection* that is not required for moral *legitimacy*. Priya is permitted to act on testimony, provided she remains open to learning the reasons later.

  ---

  ### What Both of Them Missed

  While both students argued well, they missed three crucial nuances that would resolve the tension between them:

  **1. The Distinction Between Acting Rightly and Acting Virtuously**
  Neither explicitly separated the *rightness of the act* from the *virtue of the agent*.
  *   **The Act:** Stopping eating factory-farmed meat is the right thing to do, regardless of Priya's reasons. The animals benefit either way.
  *   **The Virtue:** Priya's character is not yet fully developed if she cannot articulate *why* it is wrong.
  *   **Resolution:** Priya is right that she should change her diet now (the act). Theo is right that she should not stop there (the virtue). Testimony is a valid scaffold for action, but a poor foundation for lifelong character.

  **2. The Role of Moral Emotions and "Caring"**
  Moral belief isn't just cognitive (like believing in germs); it is conative (involving care and motivation).
  *   **The Miss:** When a doctor tells you "you have a virus," you believe the fact. When a sister says "eating meat is wrong," she is inviting you to *care* about animal suffering.
  *   **Resolution:** Testimony can transfer the *proposition* ("meat is wrong"), but it often fails to transfer the *sentiment* (compassion for the animal). Priya might be defectively motivated if she feels no disgust at the suffering herself, only a desire to obey her sister. This supports Theo's worry without validating his claim that her belief is illegitimate.

  **3. The Temporary vs. Permanent Nature of Deference**
  The debate treats Priya's deference as a static state, but it should be viewed dynamically.
  *   **The Miss:** Moral testimony is legitimate as a *starting point*, but defective as a *stopping point*.
  *   **Resolution:** It is legitimate for Priya to settle the question *for now* on her sister's say-so (Priya's point). However, she incurs a moral obligation to eventually seek out the reasons herself (Theo's point). If she treats the testimony as a permanent substitute for reasoning, she becomes morally infantilized. If she treats it as an entry point into moral reasoning, she is acting responsibly.

  **Summary for your class:**
  Priya is right that we must trust others to function in the world. Theo is right that we must think for ourselves to be moral agents. The solution is to accept Priya's permission to act, but adopt Theo's obligation to learn.
