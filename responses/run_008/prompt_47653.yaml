answer: |-
  # JOINT STATEMENT ON THE CAUSAL STATUS OF PHENOMENAL PROPERTIES

  **Date:** October 24, 2023
  **Parties:** Member D (Dualist/Epiphenomenalist) and Member P (Physicalist/Causalist)
  **Context:** Concluding document of the Consciousness Reading Group (Year 2)

  ## I. AREAS OF AGREEMENT

  After twelve months of dialectical exchange, we affirm the following propositions as common ground for all future theorizing:

  1.  **Neural Necessity:** The production of verbal reports regarding conscious experience (e.g., "I am in pain") is invariably accompanied by specific, identifiable neural activity. There is no evidence of such reports occurring in the absence of corresponding physical brain states.
  2.  **Dissociation Phenomena:** We acknowledge the reality of dissociation cases, such as blindsight, where motor behavior and discriminatory capacity persist in the absence of reported phenomenal experience. This establishes that functional output and phenomenal character are conceptually and empirically distinguishable.
  3.  **The Explanatory Obligation:** Any adequate theory of consciousness must account for the *appearance* of causal efficacy. It is a datum of experience that our sensations seem to drive our actions and our reports. A theory that renders this appearance illusory must explain why the illusion is so structurally pervasive and stable.
  4.  **Nomological Correlation:** We agree that, in the actual world, specific phenomenal states (e.g., the feeling of pain) are lawfully correlated with specific neural states. There is no "random" association; the supervenience base is stable.

  ## II. RESIDUAL DISAGREEMENTS

  While we agree on the data, we diverge on the metaphysical interpretation of the relationship between neural states, phenomenal states, and reports. We record the following contentions, phrased to ensure accurate representation of each position.

  ### Contention 1: The Basis of Reliable Reporting
  *The Issue:* What condition must be met for a physical report (e.g., saying "I see red") to count as knowledge of a phenomenal state?

  *   **Position D:** Reliability requires only **Lawful Covariation**. A report is knowledge if the physical state producing the report is nomologically linked to the phenomenal state, even if the phenomenal state plays no causal role in producing the report. (Analogy: A barometer reliably indicates a storm without causing it.)
  *   **Position P:** Reliability requires **Causal Counterfactual Dependence**. A report counts as knowledge of a phenomenon only if the phenomenon is part of the causal chain producing the report. If the phenomenon were absent, the report should not occur (ceteris paribus).

  ### Contention 2: The Zombie Judgment
  *The Issue:* Does a philosophical zombie (a being physically identical to a human but lacking experience) make the *same* judgment when it says "I am in pain"?

  *   **Position D:** The zombie produces the same **utterance and functional profile**, but it does not make the same **judgment**. A judgment about experience requires the presence of the experience to serve as the object of the judgment. The zombie's utterance is empty; it refers to nothing.
  *   **Position P:** The zombie makes the **identical judgment**. The judgment is a cognitive/neural event fully constituted by the physical machinery. If the physical machinery is identical, the judgment is identical. This proves the judgment does not require non-physical experience.

  ### Classification of the Dispute
  **Joint Determination:** We classify these disagreements as **Substantive**, not merely verbal.
  *Reasoning:* The dispute does not hinge solely on the definition of "knowledge" or "judgment." It hinges on the metaphysical possibility of *acquaintance* without *interaction*. If Position D is correct, the world contains causal gaps where information is transferred without energy or force. If Position P is correct, such gaps are impossible, and Position D describes an incoherent state of affairs. This is a disagreement about the structure of reality, not language.

  ## III. ADJUDICATING THOUGHT EXPERIMENTS

  To test these contentions, we propose the following concrete case. Both sides agree this case is conceptually coherent enough to yield predictive commitments.

  **Case: The Temporal Decoupling Protocol**
  A subject is administered a pharmacological agent (Drug $\Phi$) that systematically inserts a 500-millisecond delay between the neural firing associated with a stimulus (Event $N$) and the onset of the correlated phenomenal experience (Event $Q$).
  *   $t_0$: Stimulus applied.
  *   $t_1$: Neural event $N$ occurs (sufficient for normal report generation).
  *   $t_2$: Phenomenal event $Q$ occurs ($t_2 = t_1 + 500ms$).
  *   Task: The subject is instructed to press a button the moment they *experience* the sensation.

  **Predicted Outcomes:**

  | Feature | Position D (Dualist) Prediction | Position P (Physicalist) Prediction |
  | :--- | :--- | :--- |
  | **Button Press Timing** | The button will be pressed at **$t_1$**. | The button will be pressed at **$t_2$**. |
  | **Causal Explanation** | The report is caused by $N$. $N$ is lawfully linked to $Q$. The subject reports based on the neural state which *indicates* the coming qualia. | The report is caused by $Q$. If the report happens at $t_1$, it is not a report of $Q$. If $Q$ is delayed, the *awareness* of $Q$ must be delayed. |
  | **Epistemic Status** | The report at $t_1$ is **reliable evidence** of $Q$ (via covariation), even though $Q$ did not cause it. | A report at $t_1$ is **false or misattributed**. It reports $N$, not $Q$. True reporting requires causal contact. |

  **Signatories:**

  _________________________ (Member D)

  _________________________ (Member P)

  ***

  ## IV. DRAFTER'S ASSESSMENT AND COMMITMENT

  *Note: The following section is authored by the drafter of this document, not the signatories.*

  Having reviewed the arguments, the joint statement, and the predicted outcomes of the Temporal Decoupling Protocol, I commit to the position that **Member P (The Physicalist) has the better of the argument.**

  **Reasoning:**
  The Epiphenomenalist position (Member D) ultimately collapses under the weight of the **Paradox of Phenomenal Judgment**. Member D relies on the Barometer Analogy to explain how we can know about qualia without qualia causing our knowledge. This analogy fails upon structural inspection. A barometer's reading is caused by atmospheric pressure; the pressure causes the reading. In Epiphenomenalism, the qualia do *not* cause the report; the neural state causes the report, and the qualia merely ride along.

  If the qualia play no causal role, then the physical world is causally closed. In a causally closed world, the presence or absence of qualia makes no difference to the physical configuration of the brain that produces the sentence "I have qualia." Therefore, a zombie would produce the exact same sentence for the exact same physical reasons. If the zombie's sentence is not "about" qualia (because it has none), then the human's sentence—which is physically identical—cannot be "about" qualia either, unless one posits a magical reference that transcends physical structure.

  Member D's claim that "covariation suffices for knowledge" is insufficient because it severs the link between *truth-makers* and *belief-forming mechanisms*. If my belief that "I am in pain" is caused entirely by neural firing $N$, and the pain $Q$ is a causally inert byproduct, then my belief is not sensitive to $Q$. If $Q$ were to vanish while $N$ remained (as in the zombie case), I would still hold the belief. A belief that remains fixed even if the truth-maker vanishes is not knowledge; it is coincidence.

  Regarding the **Temporal Decoupling Protocol**: Member P's prediction is the only one that preserves the intuition that we report *what we experience*. If the button is pressed at $t_1$ (before the experience exists), the subject is clearly not reporting the experience. They are reporting the neural state. Member D must bite the bullet that we are systematically mistaken about *what* we are reporting (we think we report qualia, but we report neurons). Member P's view is more parsimonious: we report what causes the report.

  Therefore, the Epiphenomenalist position is self-undermining. It posits the existence of entities (qualia) that are, by definition, undetectable and explanatorily redundant, even to the subjects who supposedly possess them. The Physicalist account, which identifies the judgment with the neural state, preserves the causal efficacy of consciousness and explains the reliability of our reports without invoking brute, non-causal correlations.

  **Verdict:** The Physicalist position is metaphysically robust; the Epiphenomenalist position is explanatorily bankrupt.
