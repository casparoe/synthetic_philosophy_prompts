      *   **Recommendation/Allocation:**
          *   Technical Portfolio (Interpretability, Elicitation, Oversight, Deception): $7.2M (60%).
          *   Foundational/Unified Research: $3M (25%).
          *   Governance/Principal: $1.8M (15%).
          *   Review: 18 months.
      *   **Review Criteria:** Actionable items for the 12 proposals.
