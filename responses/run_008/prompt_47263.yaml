  10. **Finalizing the Output Structure:**
      *   Phase 1: Pre-conditions (Setting the stage).
      *   Phase 2: The Core Case (The "Stranger's Arbitrary Request").
      *   Phase 3: Misconception Management (Order & Cutoff).
      *   Phase 4: The Gunpoint Twist (Using the instructor's uncertainty).
      *   Phase 5: The Parking Lot (What to refuse).
      *   Phase 6: Diagnostic Question.
      *   Phase 7: Failure Analysis.

      *(Self-Correction on "Parking Lot")*: Instructor specifically mentioned "promises to yourself" and "promisee's death." I must include these as the things to table.

      *(Self-Correction on "Diagnostic Question")*: Needs to distinguish between "got it" vs "got talked at." Needs to force a choice between Will and Practice.

      *(Refining the "Single Example")*: **The "Stranger on the Train"**.
      *   You are on a train. Stranger says: "Promise me you will get off at the next stop and walk clockwise around the station."
      *   You promise.
