      *   **Task:** Teach an intro ethics discussion section (50 mins, 22 students).
      *   **Topic:** Why promises bind.
      *   **Student Mindset:** Think it's obvious ("you said you would"). Schedule-fillers, not necessarily deeply invested.
      *   **Instructor's View:** Practice-based (institutional), but wants to teach the issue, not proselytize.
      *   **Specific Problem:** The "gunpoint promise" (binds/doesn't bind intuition clash).
      *   **Constraints:**
          *   Don't explain the philosophy *to* me (the AI), plan the class *for* me.
          *   Need a specific case: No harm, no reliance, still feels wrong to break. (Standard loan examples fail).
          *   Identify misconceptions, their order, and when to cut them off.
          *   Identify what *not* to settle (promises to self, death of promisee) and how to say so.
          *   End with a diagnostic question.
          *   Include a "failure analysis" (where will this go wrong?).

  2.  **Deconstruct the Pedagogical Challenge:**
      *   *The "Obviousness" Barrier:* Students think promising is self-explanatory. The goal is to make the familiar strange.
      *   *The "Harm/Reliance" Trap:* Students usually justify promise-keeping via consequences (hurt feelings, reliance). To get at the *normative force* of the promise itself, we need to isolate it from consequences.
      *   *The "Gunpoint" Puzzle:* This is the instructor's sticking point. It needs to be used, but carefully, so it doesn't derail the "why bind?" question into "what counts as a promise?"
      *   *Time Management:* 50 minutes is tight for 22 students. Discussion can easily bog down.

  3.  **Develop the Core Case (The "No-Harm" Promise):**
      *   *Requirement:* Breaking it hurts no one, nobody relies on it, still feels wrong.
      *   *Idea 1:* Meeting for coffee, but texting 5 mins before to cancel. (Too trivial, maybe reliance).
      *   *Idea 2:* Promise to a stranger on a train you'll never see again. (Good, but why make it?)
      *   *Idea 3:* The "Dead Secret" promise. "Promise me you won't tell X I said Y." X dies. You tell no one. You break it by telling... wait, if you tell, does it hurt?
      *   *Idea 4:* The "Arbitrary Preference" promise. "Promise me you'll wear red socks on Tuesday."
          *   *Why this works:* It's trivial. No reliance (who cares about socks?). No harm (if you wear blue, who gets hurt?). But if you *promised*, wearing blue feels like a violation.
          *   *Refinement:* Let's make it slightly more personal but still consequence-free. "Promise me you'll listen to this specific song tomorrow."
          *   *Best Candidate:* **The "Stranger on the Train" + "Arbitrary Act" combo.** You promise a stranger you'll mail a postcard to *them* (so reliance is minimal/abstract) or better: **The "Deathbed Promise to a Stranger"**? No, too much emotion.
          *   *Selected Case:* **The "Useless Favor."** You promise a friend to send them a specific, worthless rock. They don't want it, they won't look at it, mailing it costs you little, not mailing it hurts them not at all. They will never know if you did it or not (secret promise).
          *   *Wait, constraint:* "Nobody relies on it." If they never know, reliance is impossible.
          *   *Revised Case:* **The "Sealed Letter."** You promise to burn a letter unopened. If you burn it, no harm. If you read it, no harm (assume content is trivial). But you promised to burn it.
          *   *Actually, the strongest philosophical case for "no harm/no reliance" is:* **The Promise to the Dead.** (But instructor wants to table death).
          *   *Let's go with:* **The "Arbitrary Rule" Promise.** "Promise me you will put your left shoe on before your right shoe tomorrow."
          *   *Why:* It costs nothing to do. It harms no one if you don't. They won't know. But if you *know* you promised, doing the reverse feels like a breach.
          *   *Wait, better:* **The "Secret Promise."** You promise your roommate you'll wash your mug tonight. They go to sleep. They won't know if you did. The mug will be there tomorrow either way (they won't use it tonight). No reliance, no harm. Just the word.

      *   *Decision:* **The "Sleeping Roommate" Case.**
          *   Scenario: Roommate is stressed. You say, "I promise I will wash my coffee mug tonight."
          *   Twist: Roommate falls asleep immediately. They won't see the mug until morning. You can wash it or not. If you don't, they never know (you wash it first thing morning).
          *   Why it binds: It isolates the *act of promising* from *expectation management*.

  4.  **Sequence the Misconceptions:**
      1.  *Harm/Consequences:* "It hurts them." -> Cut off by the "they won't know" twist.
      2.  *Trust/Character:* "It makes you a liar." -> This is the real target. Is it wrong because of the lie or the promise?
      3.  *Social Practice:* "Promises are just rules." -> Leads to the Practice View.
      4.  *Will/Intent:* "You meant it at the time." -> Leads to Will Theory.

  5.  **Address the "Gunpoint" Issue:**
      *   Don't start with it. It confuses "validity" with "bindingness."
      *   Use it at the end as a stress test for the theory they just built.
      *   Instructor's intuition (binds/doesn't) is actually a feature, not a bug. It shows the tension between *coercion invalidates consent* vs. *a promise is a promise*.
      *   *Strategy:* Frame it as "Conditions of Validity" vs. "Source of Bindingness."

  6.  **Drafting the Plan (Iterative Process):**
      *   *Intro (5 mins):* Hook them. Challenge the "obvious."
      *   *The Case (15 mins):* The Sleeping Roommate. Drill down on "Why wrong if no harm?"
      *   *Theory Building (15 mins):* Will vs. Practice. Use their answers to draw this out.
      *   *The Gunpoint Twist (10 mins):* Apply the theories.
      *   *Wrap/Exit Ticket (5 mins):* The diagnostic question.
      *   *Parking Lot:* Promises to self, death of promisee.

  7.  **Refining the "Parking Lot" (What not to settle):**
      *   Promises to self: Too metaphysical/psychological.
      *   Death of promisee: Too legalistic/edge-casey.
      *   *How to say it:* "That's a question about the *limits* of promising, but today we are asking about the *engine* of promising. We need to know how the car moves before we map the roads it can't drive on."

  8.  **Failure Analysis:**
      *   *Risk:* Students get stuck on "But why would you promise that?" (Pragmatics vs. Ethics).
      *   *Risk:* The "Sleeping Roommate" case feels too trivial, they say "Who cares?"
      *   *Risk:* Gunpoint discussion eats all the time.
      *   *Mitigation:* Be authoritarian about the hypothetical. "Stipulate the facts."

  9.  **Final Polish:**
      *   Tone: Supportive, practical, specific.
      *   Check constraints: 50 mins, 22 students, specific case requirements, specific "don't settle" items, diagnostic question, failure analysis.

      *(Self-Correction during drafting)*: The "Sleeping Roommate" case might still invite reliance arguments ("They'll expect it tomorrow"). I need a case where *even tomorrow* it doesn't matter.
      *   *Better Case:* **The "Dead Drop."** You promise a stranger to leave a stone under a bench at noon. They will never check. You will never see them again. No one is harmed. No one relies.
      *   *Actually, let's stick closer to the prompt's request for "single example should carry the whole hour."*
      *   *The "Arbitrary Ritual" Case:* Two strangers meet. One says, "I'm superstitious. Promise me you will clap your hands three times before you leave this room." You promise. You leave. You don't clap. No one sees. No harm.
      *   *Wait, the prompt asks for a case where breaking it hurts no one, nobody relies, still feels wrong.*
      *   *Let's go with the "Promise to the Dead" but modified to avoid the "death" parking lot.*
      *   *Okay, the "Secret Self-Constraint" is best.* "I promise you I will not check my phone for the rest of this class." (If I check it, you don't know, no harm done).
      *   *Let's use the "Locked Box" scenario.* "Hold this box. Promise me you won't open it." You open it. Content is blank. No harm. No reliance (I didn't need you to hold it, I just needed you to promise).
      *   *Okay, I will select the **"Arbitrary Favor"** case.* It's the cleanest. "Promise me you'll wear a green tie tomorrow." (Stranger, never meet again).

      *(Re-evaluating the "Gunpoint" constraint)*: The instructor says "a case I genuinely can't decide: a promise extracted at gunpoint." I need to make sure the plan uses this effectively without letting it dominate.
      *   *Placement:* Use it as the "Stress Test" in the last 10 minutes.

      *(Re-evaluating the "Single Example")*: The prompt says "which single example should carry the whole hour."
      *   I need one scenario that can be tweaked.
      *   *Base Scenario:* **The "Useless Promise."**
      *   *Setup:* You promise a friend to water their plant while they are gone.
      *   *Twist 1 (Reliance):* They rely on it. (Standard view).
      *   *Twist 2 (No Reliance):* They have a backup sprinkler. They won't know if you did it.
      *   *Twist 3 (Coercion):* They held a gun to your head to make you promise.
      *   *This allows one narrative thread.*

      *(Wait, prompt says "obvious candidates (paying back a friend's loan) fail because harm or friendship could explain those".)*
