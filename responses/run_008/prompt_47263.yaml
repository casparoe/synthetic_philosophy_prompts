answer: |-
  Here is a 50-minute discussion plan designed to move students from "obviousness" to "philosophical problem" without lecturing.

  ### 1. Pre-Conditions: Making the Question Look Open (Minutes 0–5)
  **The Trap:** Students think promising is just "telling the truth about the future."
  **The Fix:** You must separate *predicting* from *binding*.

  *   **Do not start with definitions.** Start with a prediction.
  *   **Action:** Write on the board: *"I will be in my office at 3 PM tomorrow."*
  *   **Ask:** "Did I just promise you anything?"
  *   **Expected Answer:** "No, you just stated a fact/intention."
  *   **Follow-up:** "What word or action would I have needed to add to turn that statement into a promise?"
  *   **Goal:** Get them to admit that promising requires a specific *speech act* or *ritual* (saying "I promise," shaking hands, etc.).
  *   **The Pivot:** "If it's just a ritual, why does breaking it feel different than just being wrong about my schedule? That's our question: **Where does the 'bind' come from?**"

  ### 2. The Single Case: "The Sealed Envelope" (Minutes 5–35)
  **Why this case:** It isolates the promise from harm, reliance, and relationship.
  **The Setup:**
  > You are waiting for a bus. A stranger approaches. They hand you a sealed envelope. They say, "I have a phobia. Please promise me you will burn this envelope without opening it." You say, "I promise." They leave. You go home. You open the envelope. It contains a blank piece of paper. You burn it later. The stranger never knows. No one is harmed. No one relied on you.

  **Phase A: The Intuition Pump (Minutes 5–15)**
  *   **Ask:** "Did you do something wrong by opening the envelope?"
  *   **Expected Consensus:** "Yes, it feels wrong."
  *   **Ask:** "Why? Who was hurt?"
  *   **Manage Misconception 1 (Harm/Consequences):** Students will say, "The stranger might feel betrayed if they found out."
      *   **Cutoff:** "Stipulate: They will *never* find out. They move to another country today. Zero psychological harm."
  *   **Manage Misconception 2 (Trust/Character):** Students will say, "It makes *you* a liar/untrustworthy person."
      *   **Cutoff:** "Okay, but *why* does it make you untrustworthy? Is it because you harmed someone, or because you violated a rule? If it's just about your character, could you secretly decide to be a person who breaks promises, and then it would be okay?" (Push them to see that the wrongness seems *external* to the agent).

  **Phase B: The Theory Clash (Minutes 15–25)**
  *   **Goal:** Elicit the two competing accounts without naming them yet.
  *   **Ask:** "If no one got hurt, what did you violate?"
  *   **Track A (The Will Theory):** Students will say, "You gave your word." "You created an obligation."
      *   *Instructor Note:* This is the "private act of will" view. The bindingness comes from your choice.
  *   **Track B (The Practice Theory):** Students will say, "Promises are a social thing." "You can't just make up rules."
      *   *Instructor Note:* This is the "institution" view. The bindingness comes from the social practice existing *before* you spoke.
  *   **Action:** Draw a T-Chart on the board. Left: "My Choice." Right: "The Social Rule." Put their quotes under each. Do not label them "Will Theory" or "Practice View" yet. Keep it in their language.

  **Phase C: The Gunpoint Stress Test (Minutes 25–35)**
  *   **Goal:** Use your own uncertainty to test the theories they just generated.
  *   **The Twist:** "Change one fact. The stranger pulled a gun. 'Promise me you'll burn this or I shoot.' You promise. They leave. You open the envelope."
  *   **Ask:** "Does the obligation vanish? Or did you still promise?"
  *   **The Trap:** Students will say, "That's not a real promise."
  *   **Your Move:** "Okay, assume for a second it *is* a promise. You used the words. You intended to get them to leave. Does it bind?"
  *   **Why this matters:**
      *   If they say **"No, coercion voids it,"** they lean toward **Will Theory** (your will wasn't free).
      *   If they say **"Yes, a promise is a promise, but we excuse you,"** they lean toward **Practice Theory** (the institution exists regardless of your internal state, though the institution has exception clauses).
  *   **Instructor Role:** Here is where you admit your own uncertainty. "I struggle with this. If the bindingness comes from *my will*, the gun breaks it. If it comes from the *social practice*, the practice might say 'gunpoint doesn't count,' but that's a rule *of* the practice, not a lack of will. I don't have the answer, but notice how your answer depends on which column on the board you trust more."

  ### 3. The Parking Lot: What to Refuse (Minutes 35–40)
  You must explicitly table two questions to keep the hour focused. Students *will* raise them.

  *   **Topic 1: Promises to Yourself.**
      *   **Student Challenge:** "What if I promise myself to study?"
      *   **Your Response:** "That's a question about whether one person can be two parties. It's a fascinating metaphysical puzzle, but today we are asking about the *engine* of promising between people. We need to know how the car moves before we ask if it can drive in a vacuum. Let's park that."
  *   **Topic 2: Death of the Promisee.**
      *   **Student Challenge:** "What if the stranger dies before you burn it?"
      *   **Your Response:** "That's a question about the *limits* of the obligation, not the *source*. Whether the duty survives death depends on whether the duty was owed to the *person* or the *practice*. We can't answer that until we agree on where the duty comes from. Park it."

  **How to say it without dodging:** Write "Parking Lot" on a corner of the board. Write these two topics there. Tell them: "I am not dismissing these. I am saying they are Level 2 questions. We are still on Level 1. If we solve Level 1, Level 2 answers itself."

  ### 4. The Diagnostic Exit Question (Minutes 40–50)
  Do not ask "What did we learn?" Ask them to apply the distinction to a new case.

  **The Question:**
  > "Imagine a society where people say 'I promise' all the time, but everyone knows that if it becomes inconvenient, you just don't do it. No one gets mad. No one loses trust. They treat 'I promise' like 'I hope.'
  >
  > In that society, **can** you make a promise?
  >
  > A) Yes, because I can still intend to do it.
  > B) No, because the social tool is broken.
  >
  > **Write down A or B, and one sentence explaining why.**"

  **Why this works:**
  *   **A (Will Theory):** They think the bindingness is internal.
  *   **B (Practice Theory):** They think the bindingness requires the institution.
  *   **Assessment:** If they choose B and reference the "social tool" or "rules," they grasped the practice account. If they choose A and reference "intent," they grasped the Will account. If they write "It depends on harm," they missed the point entirely (which you tried to isolate).

  ---

  ### Failure Analysis: Where This Plan Breaks

  **1. The "Who Cares?" Problem (High Risk)**
  *   **Where:** Minutes 10–15 (The Envelope Case).
  *   **Failure:** Students decide the case is too trivial. "If no one gets hurt, it's not wrong. End of story." They refuse to engage with the intuition that it *is* wrong.
  *   **Backup:** Have a "High Stakes, No Harm" variant ready.
      *   *Scenario:* "You promise a dying spy to deliver codes. You burn them instead. The war ends anyway. No harm done."
      *   *Use:* If they won't bite on the Envelope, switch to the Spy. The gravity forces them to feel the weight of the *word* even without consequences.

  **2. The Gunpoint Black Hole (Medium Risk)**
  *   **Where:** Minutes 25–35.
  *   **Failure:** Students love coercion cases. They will spend 20 minutes debating whether a gunpoint promise is "valid." You will lose the room on the source of bindingness.
  *   **Backup:** Be the timekeeper. "We have 5 minutes on the gun. I want three answers: Does it bind? Why? Which column on the board does that support?" If they drift, cut them off: "We are using this to test the theory, not to solve coercion."

  **3. The "Practice" Confusion (Medium Risk)**
  *   **Where:** Minutes 15–25.
  *   **Failure:** Students conflate "Social Practice" with "Social Pressure." They think the Practice View just means "You'll get in trouble."
  *   **Backup:** Distinguish *normativity* from *sanction*.
      *   *Script:* "If I speed, I might get a ticket (sanction). But is speeding wrong even if I don't get caught? The Practice View says promising is like the rules of a game. You can't score a goal by carrying the ball in soccer, even if the ref doesn't see it. It's not about getting caught; it's about what counts as 'promising.'"

  ### My Least Sure Part
  **The Transition from Will to Practice.**
  First-years often struggle to see the Practice View as anything other than "peer pressure." They have a hard time grasping that the *institution itself* creates the obligation rather than their *intent* to be bound.
  *   **Mitigation:** When they say "But I *meant* it," ask: "If you meant it, but you said 'I might do it,' did you promise?" (Forces them to admit the words/ritual matter more than the feeling). This primes them for the Practice View without you having to lecture it.

  ### Final Note on the Gunpoint Intuition
  You mentioned your intuition is that it "both binds and obviously doesn't." **Teach that tension.**
  Don't resolve it for them. Say: "I feel both. That means my moral intuitions are pulling from two different sources. One source says 'Consent is key' (Will). The other says 'A word is a word' (Practice). Your job today isn't to fix my intuition, but to tell me which theory explains why I'm confused." This models philosophical honesty and keeps you from recruiting them to your view.
