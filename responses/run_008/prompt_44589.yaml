answer: |-
  The practice you have independently derived is a recognized method in formal epistemology and probability theory, though your specific heuristic formulation highlights boundary conditions that standard textbooks often gloss over.

  Here is the carving you requested: the name, the formalism, the assumptions (and where they break), and the explanation for the order-dependence you observed.

  ### 1. The Name and Formulation

  The established name for updating beliefs on the basis of evidence that is itself uncertain is **Jeffrey Conditioning** (also known as **Probability Kinematics**). It was formalized by Richard Jeffrey in 1965.

  Your specific heuristic—"move confidence toward what it says... taking a smaller step the more dubious the instrument"—is a linear approximation of Jeffrey Conditioning often referred to as **Linear Pooling** of the prior and the certain-posterior.

  **The Formulation:**
  Let $H$ be the hypothesis (e.g., "the material holds"), and $E$ be the evidence event (e.g., "the instrument reads 'hold'").
  In standard Bayesian updating, we assume $E$ is observed with certainty ($P(E)=1$). In your practice, you assign a "trust" value, $\alpha$, to the evidence.

  In Jeffrey Conditioning, you do not set $P(E)=1$. Instead, you set a new probability for the evidence, $P_{new}(E) = \alpha$. The update rule for any hypothesis $H$ is:

  $$P_{new}(H) = P(H|E) \cdot P_{new}(E) + P(H|\neg E) \cdot P_{new}(\neg E)$$

  Substituting your trust parameter $\alpha$:

  $$P_{new}(H) = P(H|E) \cdot \alpha + P(H|\neg E) \cdot (1 - \alpha)$$

  **Mapping your heuristic:**
  Your description implies that if the instrument is trusted ($\alpha=1$), you accept the reading ($P(H|E) \approx 1$). If the instrument is distrusted ($\alpha=0$), you stay with your prior ($P(H|\neg E) \approx P_{old}(H)$).
  Under these conditions, Jeffrey's formula collapses exactly into your linear shift rule:

  $$P_{new}(H) = P_{old}(H) + \alpha \cdot [P(H|E) - P_{old}(H)]$$

  You are effectively treating your "trust" $\alpha$ as the exogenous probability that the evidence is true.

  ### 2. The Entangled Reliability (The Rigidity Condition)

  You noted that your trust varies depending on whether the reading confirms your prior suspicion. You suspected this was more than a bad habit; formally, it is a violation of the **Rigidity Condition** (also called the **Invariance Condition**).

  **The Assumption:**
  Jeffrey Conditioning assumes that the shift in probability for the evidence ($P_{old}(E) \to P_{new}(E)$) is **exogenous**. It assumes that the conditional probabilities $P(H|E)$ and $P(H|\neg E)$ remain rigid (unchanged) during the update. This requires that the *reason* for your uncertainty about the instrument is independent of the truth of $H$.

  **Where it Fails:**
  When you say, "I credit the machine more when it confirms what I already suspected," you are making $P_{new}(E)$ dependent on $H$.
  *   Formally: You are acting as if $P(Trust | H) \neq P(Trust | \neg H)$.
  *   The Consequence: The Jeffrey update formula is no longer valid because the "trust" parameter is no longer a simple scalar weight; it is now a likelihood ratio in disguise.

  **The Proper Treatment:**
  In cases of **Endogenous Reliability**, you cannot treat "trust" as a probability weight on the evidence. You must model the reliability as a separate node in a Bayesian Network.
  *   Let $R$ be the reliability of the instrument.
  *   Let $S$ be the state of the material.
  *   Let $M$ be the machine reading.
  *   The dependency is $S \to M$ and $R \to M$.
  *   If your assessment of $R$ depends on $S$ (your suspicion), you have a cognitive feedback loop that violates the causal structure. To correct this, you must decouple the assessment of $R$ from $S$. You must estimate the instrument's false-positive/false-negative rates *before* seeing the reading, or treat the "confirmation" as a separate piece of evidence rather than a modifier of the instrument's trust.

  ### 3. The Order Dependence (Non-Commutativity)

  Your second observation—that sequential updates yield different results depending on order—is a famous, proven feature of Jeffrey Conditioning. It is not your sloppiness; it is a structural property of the rule.

  **The Phenomenon:**
  This is known as the **Non-commutativity of Jeffrey Conditioning**.
  Unlike standard Bayesian updating (which is commutative: $P(H|E_1, E_2) = P(H|E_2, E_1)$), Jeffrey updates do not commute. If you update on uncertain evidence $A$ (trust $\alpha$) and then uncertain evidence $B$ (trust $\beta$), the result differs from updating $B$ then $A$.

  **Why it Happens:**
  Jeffrey Conditioning updates **probabilities** directly.
  *   Step 1: You shift the baseline probability $P(H)$.
  *   Step 2: You apply the second trust factor to the *new* baseline.
  Because the "distance" to the target belief changes after the first update, the "fractional step" of the second update lands in a different place.

  **The Carving (When it disappears):**
  This order dependence disappears only under very strict conditions, specifically **Field's Condition** (1978), which essentially requires that the two pieces of uncertain evidence be probabilistically independent conditional on the hypothesis partitions. In practical lab settings, this rarely holds.

  **The Solution (Virtual Evidence):**
  If you require order independence (which is usually desirable for coherent reasoning), you must switch from **Probability Kinematics** (Jeffrey) to **Likelihood Kinematics** (Pearl).
  Judea Pearl termed this **Virtual Evidence**.
  *   Instead of setting a trust *probability* ($\alpha$), you define a trust *likelihood ratio* ($\lambda$).
  *   $\lambda = \frac{P(Reading|H)}{P(Reading|\neg H)}$.
  *   If you trust the instrument 80%, you are effectively saying the reading is 4 times more likely to occur if $H$ is true than if $H$ is false (roughly).
  *   Likelihood ratios **multiply**. $Posterior \propto Prior \times \lambda_1 \times \lambda_2$.
  *   Multiplication is commutative. The order of evidence no longer matters.

  ### Summary of the Carving

  1.  **Name:** Your practice is **Jeffrey Conditioning** (Probability Kinematics), implemented via a **Linear Pooling** heuristic.
  2.  **Assumptions:** It assumes the **Rigidity Condition**: your assessment of the evidence's reliability must be independent of the hypothesis being tested. Your habit of trusting confirming evidence violates this, rendering the update formally incoherent (though perhaps psychologically robust).
  3.  **Order Dependence:** This is the **Non-commutativity of Jeffrey Conditioning**. It is an inherent feature of updating on uncertain probabilities. To eliminate it, you must reformulate your "trust" not as a probability weight, but as a **Likelihood Ratio** (Pearl's Virtual Evidence).

  You have rediscovered the central tension in the theory of uncertain evidence: the trade-off between the intuitive ease of probability weighting (Jeffrey) and the structural coherence of likelihood updating (Bayes/Pearl). Your "trouble" spots are precisely the fault lines where the theory itself cracks.
