  **Title:** The Architecture of Competence: A Dennettian Autopsy of AlphaGo
  **Course:** Philosophy of Mind
  **Subject:** Dennett's Taxonomy and the AlphaGo-Lee Sedol Match

  ### Introduction

  Daniel Dennett's taxonomy of minds offers a phylogenetic ladder of cognitive sophistication: Darwinian creatures (pre-designed by selection), Skinnerian creatures (shaped by overt trial and error), Popperian creatures (capable of internal simulation), and Gregorian creatures (restructured by cultural tools). This framework was designed to explain the evolution of biological cognition. However, the 2016 match between AlphaGo and Lee Sedol presents a unique stress test. AlphaGo is not an organism; it is a distributed system of neural networks and search algorithms. By analyzing Move 37 (AlphaGo's creative "shoulder hit" in Game 2) and Move 78 (Lee Sedol's "divine wedge" in Game 4), we can determine whether Dennett's taxonomy describes *functional capabilities* or *historical provenance*. This analysis proceeds in two movements: first, applying the taxonomy to illuminate AlphaGo's architecture; second, using the match to test the limits of the taxonomy, specifically regarding the definitions of behavior, selection environments, and the status of cultural learning.

  ### Part I: Theory Illuminating Case — Mapping AlphaGo to the Taxonomy

  To apply Dennett's categories rigorously, we must avoid anthropomorphizing the software. We must identify what counts as "behavior" and what constitutes the "selection environment" at distinct stages of AlphaGo's existence.

  **1. The Darwinian Base: Architecture and Hyperparameters**
  At the foundational level, AlphaGo functions as a Darwinian creature. Its "genes" are the architecture choices made by DeepMind engineers (e.g., the decision to use convolutional neural networks, the number of layers, the learning rate). These traits were not learned by the system itself but were fixed prior to operation, selected via the "environmental pressure" of research funding, computational constraints, and the engineers' own trial-and-error in designing the system. During the live match, AlphaGo's core architecture was frozen; it could not evolve its own structure. In this sense, its basic competence was pre-designed.

  **2. The Skinnerian Phase: Reinforcement Learning and Self-Play**
  Before the match, AlphaGo underwent Reinforcement Learning (RL) through self-play. Here, the taxonomy requires precision. In Dennett's terms, a Skinnerian creature learns from *overt* trial and error in the real world. For AlphaGo, the "world" was the Go board simulation.
  *   **Behavior:** The selection of moves during self-play games.
  *   **Selection Environment:** The binary outcome of the game (win/loss) serving as the reward signal.
  *   **Mechanism:** Weight adjustments in the Value Network based on the outcome.
  This phase is Skinnerian because the system modified its internal dispositions (weights) based on actual outcomes in an environment. It did not "imagine" the outcome before updating its weights; it played, lost or won, and was conditioned. This explains AlphaGo's general proficiency: it was conditioned by millions of games to avoid losing patterns.

  **3. The Popperian Moment: Monte Carlo Tree Search (MCTS)**
  The true test of Popperian status occurs during *inference* (live play). Dennett defines the Popperian creature as one that "lets its hypotheses die in its stead."
  *   **Behavior:** The final move placed on the board.
  *   **Selection Environment:** The internal search tree generated during the thinking time.
  *   **Mechanism:** MCTS simulates thousands of potential futures. Branches that lead to poor evaluations are pruned (die) internally; only the most robust branch is enacted overtly.
  Move 37 in Game 2 is the vindication of this classification. Human commentators initially dismissed the move as a mistake because it violated human heuristics. However, AlphaGo's MCTS had simulated the consequences of this move internally, determined its high value, and selected it. The "hypotheses" (alternative moves) perished in the search tree, not on the board. This is the definition of Popperian cognition: internal previewing allowing for riskier, more optimized overt behavior.

  ### Part II: Case Testing Theory — Where the Taxonomy Stretches

  While the mapping above is clean, the specific dynamics of the match reveal fractures in Dennett's hierarchy when applied to artificial systems.

  **1. Is Self-Play Popperian or Skinnerian?**
  A disciplinary ambiguity arises regarding the training phase. One might argue that self-play is Popperian because it occurs in a simulation, not the "real" world. However, in Dennett's biological framework, Skinnerian conditioning happens in the organism's lifetime environment. For AlphaGo, the training phase *is* its developmental lifetime. The weights were updated *after* the games concluded based on results. This is operant conditioning. The Popperian element is strictly reserved for the MCTS during live play, where the weights are *frozen*, and the search tree acts as the temporary workspace for hypothesis testing. If we conflate training self-play with Popperian simulation, we lose the distinction between *learning* (changing the mind) and *thinking* (using the mind).

  **2. The Gregorian Question: Culture as Data vs. Tool**
  Is AlphaGo a Gregorian creature? Dennett's Gregorian stage involves importing cultural "mind-tools" (language, math, diagrams) that restructure cognitive processing.
  *   **Argument for Yes:** AlphaGo's Policy Network was pre-trained on a database of 30 million moves from human games. This is the accumulated cultural history of Go (Kifu). It imported human wisdom.
  *   **Argument for No:** AlphaGo did not *use* symbols to think. It processed vectors. It did not speak to itself or use diagrams to restructure its reasoning; it *was* the diagram.
  *   **Verdict:** AlphaGo is not Gregorian; it is a *artifact of* Gregorian creatures. The DeepMind engineers are Gregorian; they used mathematical tools to build AlphaGo. AlphaGo ingested the *fossils* of Gregorian cognition (the records of human games) but did not wield cultural tools itself. It is a Skinnerian/Popperian hybrid built by Gregorians.

  **3. Lee Sedol and the Limit of Popperian Search**
  Move 78 in Game 4 provides the critical counter-data. Lee Sedol played a "wedge" move that AlphaGo's Policy Network assigned a probability of 1 in 10,000. Consequently, AlphaGo's MCTS (its Popperian engine) barely explored that branch of the tree. It failed to "preview" the danger because its prior probabilities (derived from its Skinnerian training) filtered the move out.
  *   **Implication for Lee:** Lee Sedol is the paradigmatic Gregorian creature. His intuition was not merely a search of possibilities but a restructuring of the board's meaning based on decades of cultural immersion and aesthetic sensibility.
  *   **Implication for the Taxonomy:** If AlphaGo is Popperian and Lee is Gregorian, Lee's victory suggests that Gregorian cognition can outperform Popperian cognition when the search space is too vast for simulation alone. Lee's move was not found by searching deeper; it was found by *seeing differently*. This supports Dennett's hierarchy: the Gregorian layer adds a capacity for reframing problems that the Popperian layer (brute-force simulation) lacks. AlphaGo failed because its "cultural training" (human data) told it the move was impossible, blinding its internal simulation.

  **4. Ontological Category Errors**
  We must acknowledge where the taxonomy misdescribes the case. Dennett's taxonomy tracks the *evolution of biological control systems*. AlphaGo's "hypotheses" are not beliefs; they are value estimates. Its "selection environment" during training was a loss function, not ecological survival. To force AlphaGo into this taxonomy risks a category error: we are mapping functional isomorphisms (search trees look like thinking) onto distinct ontological substrates. The taxonomy assumes a unified agent. AlphaGo is a pipeline: a Darwinian architecture, running Skinnerian training, executing Popperian search. It does not have a single "kind" of mind; it is a stack of all three.

  ### Conclusion: Provenance vs. Competence

  The AlphaGo episode does not neatly vindicate Dennett's hierarchy as a linear story of sophistication, nor does it entirely invalidate it. Instead, it exposes that the taxonomy tracks the **provenance of competence** rather than the **nature of performance**.

  1.  **Provenance:** AlphaGo's competence was derived from Darwinian design (engineers), Skinnerian conditioning (RL), and Gregorian data (human Kifu). It sits at the intersection of all three.
  2.  **Performance:** In play, AlphaGo operated as a Popperian creature (MCTS). However, Move 78 demonstrated that Popperian simulation is vulnerable if the "hypothesis generator" (Policy Network) is biased by its Skinnerian training history.

  **Verdict:** The taxonomy requires a modification to accommodate artificial minds. It should not be viewed as a ladder where higher creatures replace lower mechanisms, but as a **modular stack**. AlphaGo shows that one can have high-grade Popperian simulation (Move 37) without Gregorian understanding (Move 78 failure). Lee Sedol showed that Gregorian intuition can bypass Popperian search limits.

  Therefore, the AlphaGo case suggests Dennett's taxonomy is robust in describing *how* a mind acquires its strategies, but insufficient in predicting *what* it can do in isolation. A system can be Popperian in operation but fail against a Gregorian opponent because it lacks the cultural capacity to redefine the problem space. The taxonomy holds, provided we recognize that AlphaGo was not a new kind of creature, but a mirror reflecting the fragmented layers of our own: our biology (Darwinian), our learning (Skinnerian), our reasoning (Popperian), and our culture (Gregorian), decoupled and optimized for a single task. The "mind" of AlphaGo was not in the software alone, but in the loop between the code, the human data it consumed, and the human opponent it faced.
