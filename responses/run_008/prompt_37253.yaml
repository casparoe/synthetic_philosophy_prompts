          *   *Gregorian Status:* AlphaGo ingested culture but didn't *wield* symbols like a human. It's a "fossilized" Gregorian product.
          *   *Lee Sedol:* He is the paradigmatic Gregorian creature. Move 78 was intuition + cultural mastery. AlphaGo's failure suggests a limit to Popperian search without Gregorian intuition (or that its Gregorian training was biased).
      *   **Section 3: Limitations & Category Errors:**
          *   Dennett wrote about *organisms*. AlphaGo is software.
