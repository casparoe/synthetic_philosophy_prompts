      *   *Correction on Gregorian:* AlphaGo isn't Gregorian because it doesn't *use* language to think. It uses vectors. But it was *trained* by Gregorian creatures on Gregorian artifacts (kifu). So it is a *product* of Gregorian minds, not a Gregorian mind itself. This is a crucial distinction.
      *   *Lee Sedol:* Move 78. AlphaGo's probability dropped. Why? Because its Policy Network (trained on humans) said it was unlikely, and MCTS didn't explore it. Lee's move came from a place AlphaGo couldn't simulate. This highlights that Lee's Gregorian intuition transcended the Popperian search limits of the AI.
