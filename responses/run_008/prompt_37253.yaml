      *   **Conclusion/Verdict:** The taxonomy tracks *provenance* (how the competence was acquired) better than *performance*. AlphaGo is a hybrid: Skinnerian training, Popperian inference, Gregorian data. It exposes a need to separate the *developmental* taxonomy from the *operational* taxonomy.

