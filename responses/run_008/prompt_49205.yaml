answer: |-
  # FUTURE CONTINGENTS: FIND YOUR POSITION
  **The Sea Battle Session**

  **The Scenarios:**
  *   **The Coin:** A fair coin will be flipped tomorrow.
  *   **The Storm:** A system is forming; it may or may not hit Friday.
  *   **The General:** She has secretly decided to attack, but hasn't told staff.
  *   **The Knowledge:** God (or a perfect predictor) knew on Monday how the battle goes.

  **The Starting Point:**
  We agree that claims about the *past* and *present* are either True or False.
  **The Question:** What about **"There will be a sea battle tomorrow"**?

  ***

  ### THE DECISION TREE

  **1. Right now, before tomorrow arrives, is that statement *already True* or *already False*?**
  *   **NO** → Go to **2**
  *   **YES** → Go to **3**

  **2. Why isn't it true or false yet?**
  *   **A.** Because the future literally **does not exist yet** (only the past/present are real).
      *   → **THE GROWING BLOCK**
  *   **B.** Because the future exists but is **unsettled**.
      *   → Go to **2b**

  **2b. Imagine all the possible ways tomorrow could go. Is the statement True in *some* of those ways and False in *others*?**
  *   **YES** (It's true in some futures, false in others).
      *   → **SUPERVALUATIONISM**
  *   **NO** (It is neither true nor false in *any* possible future yet).
      *   → **ARISTOTLE / LUKASIEWICZ**

  **3. If the statement is already True, does that mean the battle *must* happen (it is unavoidable)?**
  *   **YES** (The truth forces the event; deliberation is pointless).
      *   → **FATALISM**
  *   **NO** (It's true, but still contingent; deliberation makes sense).
      *   → Go to **4**

  **4. Are all possible futures equally "real" right now, or is one future *the* Real One from the start?**
  *   **A.** All possible futures are equally real; we just happen to end up in one.
      *   → **OCKHAMISM**
  *   **B.** One specific future is metaphysically privileged as *The Actual Future*.
      *   → **THE THIN RED LINE** †

  ***

  **† Instructor Note:** *Ockhamism and The Thin Red Line are notoriously difficult to distinguish via concrete cases. Both agree the statement is true now and contingent. The difference is metaphysical: does "actual" pick out a privileged timeline (TRL) or just the one we inhabit (Ockhamism)?*

  ***

  ## INSTRUCTOR KEY & LOGICAL SPACE ANALYSIS

  ### 1. Untestable Pairs (The "†" Mark)
  **Ockhamism vs. The Thin Red Line (TRL)**
  As flagged on the handout, this tree cannot cleanly separate these two via concrete scenarios.
  *   **Why:** Both views answer "Yes" to Q1 (It is true now), "No" to Q3 (It doesn't force the event), and both allow for deliberation.
  *   **The Difference:** It is purely metaphysical. TRL posits a privileged "actual" history among the branching possibilities. Ockhamism treats "actual" as indexical (the history we are *in*).
  *   **Pedagogical Tip:** If a student lands here, ask them: *"If we could step outside of time, would you see one timeline glowing 'REAL', or just a bush of equal timelines?"* If they shrug, they are functionally in the same spot for the purpose of the Sea Battle argument.

  ### 2. Empty Paths (Consistent but Unoccupied)
  There is one logically consistent path through the tree that no major position occupies:

  **The Path:** **Q1 (NO)** → **Q2 (B: Future exists/is unsettled)** → **Q2b (NO: Not true in any future)** → **HIDDEN STEP: But the future is fixed.**
  *   **The Position:** "The future is real and fixed, but statements about it are neither true nor false."
  *   **Why Empty:** This is the **"Epistemic Restriction"** view. It claims truth is blocked by our access, not by metaphysics.
  *   **Status:** **Incoherent / Undefended.** If the future is fixed (metaphysically), there is a truthmaker for the proposition. Denying the truth value while affirming the fixed reality creates a gap most philosophers reject (it violates the correspondence theory of truth without the motivation of indeterminism).

  **The Path:** **Q1 (YES)** → **Q3 (NO: Truth forces event)** → **Q4 (A: All futures equally real).**
  *   **The Position:** "The statement is true now and forces the event, but all futures are equally real."
  *   **Status:** **Incoherent.** If all futures are equally real (branching), then the event is not forced (it could go otherwise on a different branch). You cannot have Fatalism (necessity) alongside Branching (possibility of otherwise).

  ### 3. Node Design Notes
  *   **Q1 (Truth Value):** Avoids "Bivalence." Uses "Already True/False."
  *   **Q2 (Existence):** Targets the **Growing Block**. Uses the "Storm" scenario implicitly (is the storm *there*?).
  *   **Q2b (Supervaluation):** Targets the **Aristotle vs. Supervaluation** split. Uses the "Coin" scenario (heads in some worlds, tails in others).
  *   **Q3 (Fatalism):** Targets the **Hard Determinist/Fatalist**. Uses the "Deliberation" test (General's staff).
  *   **Q4 (TRL vs Ockham):** Targets the **Metaphysics of Actuality**. Uses the "God's Eye View" implicitly without requiring theology.

  ### 4. Suggested Flow for Session
  1.  Hand out the sheet.
  2.  Have students walk the tree silently.
  3.  Ask for a show of hands for each Leaf.
  4.  **Crucial Moment:** When you hit the **Ockhamism/TRL** cluster, pause. Admit the tree fails there. Ask the class *why* it fails. This teaches them that some philosophical distinctions aren't about prediction, but about metaphysical grounding.
  5.  **Crucial Moment:** When discussing **Fatalism**, ask the Fatalist if they would still study for an exam tomorrow. If they say "Yes," push them back to Q3 (they aren't true Fatalists, they are Ockhamists).
