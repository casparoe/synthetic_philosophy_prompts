  *   **If she says "One":** She is following **Rule 1 (Active Disunity)**. Conflict is a necessary condition for the "Two" verdict. Isolation alone, even in the lab, preserves unity if the will is unified. (This confirms she should verdict **One** for your Contact Lens case).

