  This is a sharp observation. You are correct that your professor's track record contains a tension between her *etiological* distinctions (acquired vs. congenital) and her *functional* distinctions (conflict vs. integration). The "Afternoon Contact Lens" case is an excellent stress test because it isolates informational asymmetry from behavioral conflict.

  Based on her specific phrasing and the consistency of her past verdicts, here are the two rules she is likely operating under, their predictions for your case, and a proposal for how to settle the matter.

  ### Candidate Rule 1: The "Active Disunity" Principle (Momentary)
  **The Rule:** The number of subjects of experience is determined by the *current functional integration of agency*. In an acquired commissurotomy patient, there are two subjects if and only if there is simultaneous, inter-hemispheric conflict of will or action (e.g., hands acting at cross-purposes). If the hemispheres are cooperating, cross-cueing, or merely asymmetrical without conflict, there is only one subject.
  *   **Consistency Check:**
      *   *Split-Brain (Experimental):* Conflict present → **Two**.
      *   *Split-Brain (Home):* No conflict (cross-cueing resolves asymmetry) → **One**.
      *   *Alien Hand:* Conflict present, but *intra*-hemispheric/subcortical (not inter-hemispheric rivalry) → **One**.
      *   *Agenesis:* Even in tests, the brain developed as a unified agent; conflict is treated as system noise, not duality → **One**.
  *   **Prediction for Contact Lens Case:** **One Experiencer.**
      *   *Reasoning:* Although the visual input is lateralized, the patient is engaging in "ordinary activities" with "no conflicting instructions." The seeing hemisphere guides the body; the speaking hemisphere narrates. As long as the speaking hemisphere can infer the seeing hemisphere's intent via proprioception or speech (cross-cueing), and no conflict arises, the "Active Disunity" threshold is not met. The asymmetry is treated like the "Home" case, just more extreme.

  ### Candidate Rule 2: The "Actualized Capacity" Principle (Structural/Dispositional)
  **The Rule:** The number of subjects is determined by the *structural capacity for independent consciousness* created by the lesion, actualized by *informational encapsulation*. In an acquired commissurotomy, the potential for two subjects exists. This potential becomes actual whenever the experimental or environmental conditions successfully prevent information sharing between hemispheres, regardless of whether conflict occurs. (Congenital cases are exempt because the brain never organized around the capacity for two).
  *   **Consistency Check:**
      *   *Split-Brain (Experimental):* Structure severed + Info isolated → **Two**.
      *   *Split-Brain (Home):* Structure severed + Info shared (via eye movement/cues) → **One**.
      *   *Agenesis:* Structure never allowed duality (subcortical compensation is primary) → **One**.
      *   *Alien Hand:* Structure intact (callosum present) → **One**.
  *   **Prediction for Contact Lens Case:** **Two Experiencers.**
      *   *Reasoning:* The contact lens apparatus *enforces* the informational encapsulation that the experimental tachistoscope usually achieves temporarily. The speaking hemisphere is visually blind; the seeing hemisphere is mute. Even without conflict, there are now two distinct pools of conscious visual information that cannot be directly accessed by a single reporting mechanism. The "Home" verdict relied on "shared context"; the lens artificially removes that shared context, triggering the structural capacity for duality latent in the acquired lesion.

  ### My Best Guess: Rule 1 (Active Disunity)
