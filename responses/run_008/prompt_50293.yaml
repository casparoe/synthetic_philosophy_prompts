answer: |-
  Here is the spec. I am writing this from the perspective of **Computational Functionalism**: if you are building a robot, you are building a functional system. A theory that posits entities you cannot represent is not a theory for you; it is poetry.

  ### The Desiderata

  **1. The Representability Constraint (Implementability)**
  *   **The Call:** Non-negotiable. The conditions for joint action must be reducible to state variables and transition functions within the individual agents.
  *   **Motivating Case:** The "Wizard of Oz" problem. If your theory requires a "group mind" that isn't locatable in the individual processing streams, you cannot verify if the robot is participating or just simulating participation.
  *   **The Spec:** The theory must define joint action as a specific configuration of *individual* intentional states (beliefs, goals, commitments) plus a communication channel. If the theory demands a "plural subject" that cannot be decomposed into Agent A's state + Agent B's state + Coupling, it fails for HRT.
  *   **What breaks when porting:** Phenomenological unity. Humans *feel* like a "we." Robots will never feel. The theory must accept that the robot instantiates the *functional role* of the "we" without the *experience* of the "we." If the theory says the experience is constitutive of the action, the theory is incompatible with robotics.

  **2. The Commitment-to-Adjust Boundary (Distinction)**
  *   **The Call:** The joint-carving distinction is **obligatory mutual responsiveness**, not outcome alignment.
  *   **Motivating Case:**
      *   *Coincidence:* Two strangers painting a house. They align on outcome (painted house) but if one stops, the other doesn't care.
      *   *Strategic (Rush Hour):* Drivers align on outcome (no crash) and adjust to each other, but only out of self-interest. If one driver signals a turn, the other yields only if it benefits them.
      *   *Joint Action (Sofa Lifting):* If I stumble, you *must* adjust your grip to prevent the drop, even if it costs you effort.
  *   **The Spec:** A theory fails if it distinguishes joint action from strategic interaction solely based on "shared goal content." It must distinguish them based on the **normative constraint on sub-plan revision**. In joint action, I adopt a constraint: "I will not revise my sub-plan in a way that undermines *our* plan without negotiating with you." Rush hour drivers do not have this constraint.

  **3. The Cognitive Scale Limit (Scale)**
  *   **The Call:** Adequate theories must cover small-scale, real-time dyadic/triadic interaction. Large-scale institutional action (corporations, cathedrals) is a derived phenomenon, not a primitive one.
  *   **Motivating Case:** A cathedral takes 100 years. No single human holds the intention "build this cathedral" in the same cognitive format as "lift this box."
  *   **The Spec:** Do not try to solve the institutional case first. The cognitive machinery for joint action evolved for immediate cooperation (hunting, carrying). Institutional joint action is just small-scale joint action chained together via artifacts (contracts, blueprints). If a theory requires me to model "generational intention" to explain "lifting a box," it is overfitted.
  *   **Reductionist Stance:** Treat the "firm" as a black box that outputs agents capable of small-scale joint action. The "firm's intention" is a metaphor for the stable structure of individual intentions.

  **4. The Degradation Tolerance (Asymmetric Cases)**
  *   **The Call:** The theory must allow for **graded membership**, not binary verdicts.
  *   **Motivating Case:** Coercion. If I hold a gun to your head and we move a sofa, is it joint action? Gilbert says no (no voluntary commitment). Bratman might say yes (interlocking intentions exist).
  *   **The Spec:** For HRT, binary verdicts are useless. You need a "Jointness Metric." A coerced partner is *less* joint than a voluntary one because their commitment to adjust is fragile (they will drop the sofa the second the gun is gone).
  *   **Verdict:** Treat coercion and deception as **instabilities in the coupling**, not as categorical exclusions. A theory that says "This is simply not joint action" hides the variable you need to measure (stability of coordination).

  **5. The Ontological Deflation (Irreducibility)**
  *   **The Call:** Irreducibility is a metaphysical preference, not a functional requirement. Reject it.
  *   **Motivating Case:** Searle's "We-Intention." He argues "We intend" is primitive, not "I intend that we intend."
  *   **The Spec:** For engineering, "We-Intention" is a useless primitive. You cannot code `agent.set_goal(WE_INTEND(X))`. You must code `agent.set_goal(I_INTEND(WE_DO(X)))`. If the theory claims this reduction loses the essence of joint action, the theory is incompatible with AI.
  *   **Hard Truth:** The "We-Mode" is a user-interface illusion for humans. Under the hood, it is I-Mode interactions with high-bandwidth coupling. Demand a reductionist account.

  ---

  ### The Incompatibility Flag

  **Implementability (Desid 1) vs. Strong Normativity (Gilbert/Tuomela)**

  This is the collision you suspected. It is real.

  *   **The Conflict:** Gilbert's "Plural Subject" theory argues that joint action creates a *sui generis* normative bond. You owe it to the *group* to fulfill your part. This obligation is not reducible to your personal commitment; it exists *between* you.
  *   **Why it breaks code:** You cannot program an obligation that exists in the "between." You can only program Agent A believing they are obligated to Agent B.
  *   **The Consequence:** If you adopt Gilbert's strict criteria, **no robot can ever be a partner.** It can only be a tool that simulates partnership. The robot cannot be a member of a "Plural Subject" because it cannot participate in the normative fabric that constitutes the subject.
  *   **My Call:** If your goal is Human-Robot *Teaming* (where the robot is a peer), you must abandon the strong normativity requirement. You must treat the "obligation" as a **predictive expectation**. The human *expects* the robot to adjust; the robot is programmed to *satisfy* that expectation. That is not genuine normativity, it is control theory. If the literature insists this distinction is vital, the literature is useless for HRT.

  **Scale (Desid 3) vs. Irreducibility (Desid 5)**

  *   **The Conflict:** Anti-reductionists often argue that large-scale institutional intentions *are* irreducible, which implies the small-scale ones might be too.
  *   **The Consequence:** If you accept irreducibility at the institutional level, you invite magic into the cognitive level.
  *   **My Call:** Keep them separate. Demand reductionism for the cognitive agent (the robot/human dyad). Allow sociologists to have their "emergent structures" at the macro level, but do not let those requirements leak into your agent architecture.

  ---

  ### Scorecard

  **Searle (We-Intentions)**
  *   **Implementability:** **FAIL.** "Primitive we-intention" is uncodeable. Requires a homunculus or magic.
  *   **Boundary:** **PASS.** Distinguishes from "I-intend" clearly, but offers no mechanism for how the distinction is maintained.
  *   **Scale:** **FAIL.** Conflates biological capacity with social ontology.
  *   **Verdict:** Philosophically interesting, engineering dead-end. Do not use for architecture.

  **Bratman (Shared Intention)**
  *   **Implementability:** **PASS (with caveats).** "Interlocking intentions" and "meshing subplans" map cleanly to BDI (Belief-Desire-Intention) architectures.
  *   **Boundary:** **PASS.** The requirement for commitment to mutual responsiveness cleanly separates joint action from strategic interaction.
  *   **Scale:** **PASS.** Explicitly focuses on planning agents in small-scale interaction.
  *   **Degradation:** **WEAK.** Too intellectualist. Struggles with preverbal infants or cases where sub-plans aren't explicitly represented.
  *   **Verdict:** **The Industry Standard.** This is your baseline. It is the only one that compiles.

  **Gilbert (Plural Subjects)**
  *   **Implementability:** **HARD FAIL.** The "Plural Subject" is an ontological entity over and above the individuals. You cannot instantiate this in a robot.
  *   **Boundary:** **PASS (Strict).** Best at capturing the *normative* force (the feeling of betrayal when a partner quits).
  *   **Scale:** **PASS.** Handles institutions well, but at the cost of the individual agent.
  *   **Verdict:** **Descriptive, not Prescriptive.** Use this to analyze human *expectations* of the robot, but do not try to build the robot to satisfy Gilbert's criteria. You will build a system that is too brittle.

  ### Summary Recommendation
  Adopt **Bratman** as your architectural spec. It is the only one that treats joint action as a functional state of individual agents. Use **Gilbert** only to understand why your human users will get angry when the robot violates a "meshing subplan" (they feel a normative violation, not just a plan failure). Discard **Searle** and strong **Irreducibility**; they are metaphysical luxuries you cannot afford.
