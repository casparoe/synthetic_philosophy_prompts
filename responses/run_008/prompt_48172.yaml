prompt: |-
  I'm a palliative care nurse practitioner who runs the orientation for residents rotating through our inpatient hospice service, and every few weeks one of them freezes at the same point: a dying patient's pain or agitation is out of control, the family is desperate, and the resident is scared that uptitrating the morphine or starting sedation is going to "kill the patient" — some of them have said flat out they don't want to be the person who gives a fatal dose. Our attendings each give different advice, so the residents get whiplash. One says intent is what matters and if you mean to relieve suffering you're fine; another says the doses we actually use don't hasten death, mostly; a third just tells them never give anything without a documented attending order. I want something more consistent and teachable: a written decision procedure the residents can run at 3am, built around the doctrine of double effect but honestly translated into clinical terms — the questions in order, what counts as a sufficient answer at each step, where the procedure stops with a no, and where it has to hand off to the attending or an ethics consult because it's a values question rather than a clinical one.

  The procedure needs to keep apart the distinctions the residents keep collapsing: intending a bad outcome vs merely foreseeing it, giving a drug that relieves symptoms and might shorten life vs giving something whose only possible effect is to end it (they ask about things like paralytics at the very end), and withdrawing something we started (ventilator, iv fluids) vs starting a new intervention. Also the residents can't tell the difference between sedation for refractory suffering and sedation for the family's peace of mind, so the procedure should catch that somewhere. Then run it on three cases: (1) refractory terminal agitation where the plan is continuous deep sedation and the family is on board; (2) a resident asked to push opioids for a patient who is actually comfortable but breathing noisily, where the family wants him "completely peaceful" — sedation for their sake, not his; (3) a planned extubation where death is expected within minutes and the resident has to give the pre-extubation opioids themselves — that last one is where I already know I won't like wherever the procedure lands, but I want to see it argued anyway rather than dodged.

  One more thing: be honest that the intent/foresight distinction can't be settled by just asking the resident what they intended — if the procedure needs a proxy for intent, say what the proxy is and why it's better than self-report. And flag which steps are really judgment calls dressed up as checklist items, because the residents will trust it more if it admits its limits. It shouldn't be longer than what a resident could realistically read on a shift — aim for something we can print on two sides of one page, with the worked cases as an appendix.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **User:** Palliative care Nurse Practitioner (NP) running resident orientation.
      *   **Problem:** Residents freeze when facing uncontrolled symptoms (pain/agitation) in dying patients due to fear of "killing" the patient (euthanasia vs. palliation). Attendings give conflicting advice (Intent vs. Data vs. Bureaucracy).
      *   **Goal:** A consistent, teachable, written decision procedure (algorithm/checklist) based on the Doctrine of Double Effect (DDE) but translated into clinical terms.
      *   **Constraints:**
          *   Must distinguish: Intent vs. Foresight, Symptom Relief vs. Life-Ending, Withdrawing vs. Starting.
          *   Must catch: Sedation for refractory suffering vs. Sedation for family anxiety.
          *   Must address: The "Intent" problem (self-report is unreliable, need a proxy).
          *   Must admit: Where judgment calls exist (transparency builds trust).
          *   Format: Max 2 pages (front/back), with 3 worked cases as an appendix.
          *   Tone: Honest, clinical, ethically rigorous but practical for 3 AM.
      *   **Specific Cases to Test:**
          1.  Refractory terminal agitation + Continuous Deep Sedation (CDS) + Family on board.
          2.  Comfortable patient + Noisy breathing + Family wants "peaceful" (sedation for family).
          3.  Planned extubation + Pre-emptive opioids (User expects tension here).

  2.  **Deconstruct the Ethical Framework (Doctrine of Double Effect):**
      *   *Standard DDE Conditions:*
          1.  The act itself is good or neutral.
          2.  The bad effect (death) is not intended.
          3.  The good effect (symptom relief) is not produced *by* the bad effect.
          4.  Proportionality (Good outweighs bad).
      *   *Clinical Translation:*
          1.  Indication: Is there a refractory symptom?
          2.  Intent Proxy: Is the titration guided by symptom scales or a target depth of unconsciousness?
          3.  Mechanism: Are we using standard palliative meds (opioids/benzos) vs. lethal agents (paralytics/KCl)?
          4.  Proportionality: Is the suffering severe enough to risk earlier death?

  3.  **Drafting the Procedure (The "Palliative Safety Check"):**
      *   *Need a flowchart style but in text.*
      *   *Step 1: Indication.* Is there suffering? (Stops "sedation for family" in Case 2).
      *   *Step 2: Refractoriness.* Have standard treatments failed? (Justifies escalation).
      *   *Step 3: The Intent Proxy.* How do we know they aren't trying to kill? *Crucial Point:* Don't ask "What do you intend?" Ask "What is the titration target?" If the target is "no breaths," that's euthanasia. If the target is "CPOT score < 3," that's palliation.
      *   *Step 4: Agent Selection.* Morphine/Midaz vs. Rocuronium. (Stops paralytics).
      *   *Step 5: Proportionality/Consent.* Does the patient/family understand the risk? (Stops unilateral decisions).
      *   *Step 6: The Handoff.* When to call Attending/Ethics. (Values conflicts, non-refractory requests).

  4.  **Addressing the "Intent" Problem:**
      *   Self-report is useless ("I didn't mean to!").
      *   *Proxy:* **Titration Endpoint.**
      *   *Why:* If you titrate to a symptom score, you stop when symptoms stop. If you titrate to apnea, you keep going until breathing stops. This is observable behavior, not internal state.

  5.  **Addressing the "Withdrawing vs. Starting" Distinction:**
      *   Ethically equivalent in palliative care (allowing natural death), but residents feel different.
      *   Need to explicitly state that treating symptoms *during* withdrawal is standard care, not killing.

  6.  **Developing the Worked Cases:**
      *   *Case 1 (Refractory Agitation/CDS):* Should Pass. Symptom present, refractory, correct meds, consented.
      *   *Case 2 (Noisy Breathing/Family Anxiety):* Should Fail Step 1 (No patient suffering). This is the critical teaching point.
      *   *Case 3 (Extubation/Pre-emptive Opioids):* This is the tricky one.
          *   *Tension:* Giving opioids *before* extubation to prevent air hunger *might* suppress drive.
          *   *Resolution:* The indication is *anticipated* dyspnea (suffering), not death. The proxy is titration to comfort, not apnea. It should Pass, but needs a warning label about proportionality.

  7.  **Refining the Format:**
      *   Keep it tight. Use bold headers.
      *   Add a "Red Flag" section for when to stop.
      *   Ensure the "Judgment Call" warnings are visible.
      *   Check length: Needs to fit on 2 pages (Procedure + Cases).

  8.  **Drafting Content - Section by Section:**

      *   *Header:* Palliative Symptom Escalation Protocol (P-SEP).
      *   *Intro:* Acknowledge the fear. State the goal (Relieve suffering, not hasten death).
      *   *The 5 Gates:*
          1.  **Symptom Gate:** Is the *patient* suffering? (Objective measure).
          2.  **Refractory Gate:** Have we tried standard care?
          3.  **Intent Proxy Gate:** What is the stopping rule? (Score vs. Apnea).
          4.  **Agent Gate:** Is the drug appropriate? (No paralytics).
          5.  **Consent Gate:** Do they understand the risk?
      *   *The "Handoff" Criteria:* When to call the attending.
      *   *Honesty Box:* Admit where this is subjective (Proportionality).
      *   *Appendix:* The 3 Cases.

  9.  **Review against Constraints:**
      *   *Intent/Foresight:* Addressed via Titration Endpoint.
      *   *Withdrawing/Starting:* Addressed in Case 3 and Agent Gate.
      *   *Sedation for Family:* Addressed in Symptom Gate.
      *   *Length:* Need to be concise.
      *   *Tone:* Professional, direct, supportive.

  10. **Final Polish:**
      *   Make sure the distinction between "foreseeing death" and "intending death" is clear in the "Intent Proxy" section.
      *   Ensure Case 3 doesn't look like euthanasia but acknowledges the risk.
      *   Check that the "Judgment Call" warnings are prominent.

  *(Self-Correction during drafting)*: I initially thought about putting the cases on the second page. But the prompt asks for the procedure to be readable on a shift. Maybe the procedure is Page 1, and Page 2 is the Cases + "When to Call." That fits the "two sides of one page" constraint better.
  *Wait, one more thing:* The prompt asks for the procedure to stop with a "No" or hand off. I need to make the "STOP" points very clear.
  *Also:* The prompt specifically mentions the "Intent/ Foresight distinction can't be settled by just asking." I need to make sure the "Titration Endpoint" is highlighted as the solution to this.

  *Refining Case 3:* The user says "I already know I won't like wherever the procedure lands." This suggests they anticipate the procedure might flag this as risky. I need to ensure the procedure *supports* standard palliative extubation practice (pre-emptive analgesia) while acknowledging the ethical tension. The key is that the *indication* is air hunger, not death.

  *Final check on length:* I will write the procedure concisely to ensure it fits the mental model of a "one-pager."

  Let's assemble.
answer: |-
  # Palliative Symptom Escalation Protocol (P-SEP)
  **For Inpatient Hospice & Palliative Care Residents**
  *Use this checklist when considering high-dose opioids, benzodiazepines, or palliative sedation.*

  ### THE GOAL
  To relieve refractory suffering without intending death.
  **Ethical Anchor:** The Doctrine of Double Effect (Clinical Translation).
  **Core Distinction:** We accept the *risk* of hastened death as a side effect; we never target death as the *mechanism* of relief.

  ---

  ### THE 5 GATES (Run in Order)
  *If you answer **NO** at any gate, STOP. Do not escalate. See "Handoff Criteria."*

  #### 1. THE SYMPTOM GATE (Indication)
  **Question:** Is the *patient* experiencing severe, objective suffering (pain, dyspnea, agitation)?
  *   **Pass:** CPOT > 3, RASS +2/+3, documented grimacing/guarding, self-report of severe distress.
  *   **Fail:** Patient is comfortable/unconscious, but *family* is distressed by noises/appearance.
  *   **Why:** Sedation is for patient suffering, not family anxiety. Treating family anxiety with patient sedation is ethically impermissible.

  #### 2. THE REFRACTORY GATE (Necessity)
  **Question:** Have standard interventions failed or caused intolerable side effects?
  *   **Pass:** Documented trials of first-line agents (e.g., scheduled opioids, non-pharm measures) failed to control symptoms.
  *   **Fail:** Escalating immediately without trying standard dosing or non-pharm options.
  *   **Judgment Call:** "Refractory" is a clinical judgment. If unsure, pause.

  #### 3. THE INTENT PROXY GATE (Titration Target)
  **Question:** What is the specific **stopping rule** for titration?
  *   **Pass:** "Titrate until [Symptom Score] is < 3" OR "Titrate until patient is asleep but rousable" (unless CDS indicated).
  *   **Fail:** "Titrate until breathing stops" OR "Titrate until family is satisfied."
  *   **The Intent Proxy:** We cannot read your mind. We judge intent by your **endpoint**.
      *   If you stop when symptoms stop = **Palliation.**
      *   If you keep going after symptoms stop to ensure death = **Euthanasia.**
      *   *Note:* Foreseeing death is acceptable. Targeting apnea is not.

  #### 4. THE AGENT GATE (Mechanism)
  **Question:** Is the medication mechanism appropriate for symptom relief?
  *   **Pass:** Opioids (pain/dyspnea), Benzodiazepines (anxiety/seizures), Antipsychotics (delirium), Propofol/Midaz (for CDS).
  *   **Fail:** Neuromuscular blockers (paralytics), Potassium Chloride, Digoxin.
  *   **Why:** Paralytics relieve nothing; they only stop breathing. Using them implies intent to kill.

  #### 5. THE CONSENT GATE (Proportionality)
  **Question:** Does the surrogate/patient understand the plan includes a risk of earlier death?
  *   **Pass:** "We must increase meds to stop the suffering. This may unintentionally shorten life. Are you okay with this priority?"
  *   **Fail:** Family demands "make him sleep forever" without understanding the risk, or patient/family refuses risk of earlier death.
  *   **Judgment Call:** Proportionality. Is the suffering severe enough to warrant the risk? (e.g., Mild pain does not warrant CDS).

  ---

  ### HANDOFF CRITERIA: When to Call Attending / Ethics
  *Do not proceed alone if:*
  1.  **Gate 1 Fails:** Family demands sedation for a comfortable patient. (This is a values conflict, not clinical).
  2.  **Gate 3 Fails:** You feel pressured to titrate to apnea.
  3.  **Gate 5 Fails:** Family disagrees on risk tolerance (e.g., one sibling wants everything, one wants comfort only).
  4.  **Uncertainty:** You are unsure if the symptom is truly refractory.

  ### HONESTY BOX: Where This Checklist Is Human, Not Math
  *   **Refractoriness (Gate 2):** There is no lab value for "enough suffering." This requires experience.
  *   **Proportionality (Gate 5):** Weighing "risk of death" vs. "severity of agony" is a value judgment. If your gut tightens, call the attending.
  *   **Withdrawing vs. Starting:** Ethically, treating symptoms during ventilator withdrawal (Case 3) is identical to treating symptoms in a dying cancer patient. Do not let the "act of removal" confuse the "intent of medication."

  ---
  *(End of Page 1)*

  # APPENDIX: Worked Cases
  *Use these to test your understanding of the P-SEP.*

  ### CASE 1: Refractory Terminal Agitation (The "Pass" Case)
  **Scenario:** 65yo M, end-stage glioblastoma. RASS +3 (combative), pulling lines, moaning. Failed haloperidol + PRN lorazepam. Family consents to Continuous Deep Sedation (CDS) to relieve suffering.
  **P-SEP Run:**
  1.  **Symptom:** YES. Objective agitation/distress (RASS +3).
  2.  **Refractory:** YES. Standard delirium cocktail failed.
  3.  **Intent Proxy:** "Titrate midaz/propofol to RASS -4 (unrousable) *to control agitation*." (Stopping rule is symptom control, even if depth is deep).
  4.  **Agent:** YES. Sedatives are appropriate for agitation.
  5.  **Consent:** YES. Family understands goal is comfort, risk is earlier death.
  **Verdict:** **PROCEED.** This is ethically sound palliative sedation. The foresight of death does not negate the intent to relieve agitation.

  ### CASE 2: Noisy Breathing / Family Anxiety (The "Fail" Case)
  **Scenario:** 80yo F, actively dying. Breathing is noisy ("death rattle"). Patient is comatose, CPOT 0 (no grimace, relaxed). Family is crying, says "He's choking, knock him out completely."
  **P-SEP Run:**
  1.  **Symptom:** **NO.** Patient is comatose with CPOT 0. No evidence of air hunger or distress. The suffering belongs to the *family*.
  2.  **Refractory:** N/A (Failed Gate 1).
  3.  **Intent Proxy:** N/A.
  **Verdict:** **STOP.** Do not sedate.
  **Action:** Treat the family, not the patient. Explain that the noise is reflex, not choking. Use glycopyrrolate/scopolamine for secretions if appropriate, but do not deepen sedation. If family persists, **Handoff to Attending.** This is a values conflict.

  ### CASE 3: Terminal Extubation (The "Tension" Case)
  **Scenario:** 50yo M, severe TBI, decision made to withdraw vent. Resident ordered to give fentanyl/midaz *before* extubation to prevent air hunger. Resident fears this will stop the heart before the tube is out.
  **P-SEP Run:**
  1.  **Symptom:** YES (Anticipated). Extubation causes predictable, severe dyspnea/air hunger. Pre-emptive treatment is standard of care.
  2.  **Refractory:** N/A. The stimulus (extubation) cannot be removed.
  3.  **Intent Proxy:** "Titrate to prevent grimacing/tachycardia during withdrawal." **NOT** "Titrate to ensure asystole before extubation."
  4.  **Agent:** YES. Opioids/Benzos treat dyspnea/anxiety.
  5.  **Consent:** YES. Family understands withdrawal leads to death; meds ensure it is peaceful.
  **Verdict:** **PROCEED.**
  **The Ethical Argument:** Withdrawing the vent is allowing the underlying pathology to cause death. The meds treat the *symptoms of withdrawal*, not the life itself.
  **The Risk:** Yes, high doses may blunt respiratory drive further. This is the "Double Effect."
  **The Guardrail:** If the patient shows no signs of distress after extubation, do not push more. Titrate to *distress*, not to *death*. If you feel you are "hurrying it," **Handoff.**

  ---
  ### Quick Reference: Intent vs. Foresight
  | **Feature** | **Palliation (Allowed)** | **Euthanasia (Forbidden)** |
  | :--- | :--- | :--- |
  | **Trigger** | Patient Symptom (Pain, Air Hunger) | Request for Death / Family Distress |
  | **Titration Target** | Symptom Score (e.g., CPOT < 3) | Apnea / Asystole |
  | **Medication** | Opioids, Benzos (Symptom relief) | Paralytics, KCl (Life ending only) |
  | **Response to Relief** | **Stop** titrating if symptoms resolve | **Continue** titrating to ensure death |
  | **Documentation** | "Medicated for dyspnea" | "Medicated to end life" |

  *(End of Page 2)*
