  I've been going down the verisimilitude rabbit hole (Popper's "how can one false theory be closer to the truth than another" thing) and I want to stop reading proposals until I'm clear on what a proposal is even supposed to deliver. Assume you're a philosopher of science who's spent way too many years on this literature. Please actually think carefully, maybe brainstorm the candidate requirements first before committing to the final list, then write me the full spec:

