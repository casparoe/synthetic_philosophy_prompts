answer: |-
  You are right to be suspicious. The slogan "evidence underdetermines theory" is one of the most notoriously ambiguous phrases in the philosophy of science. Your classmate is likely conflating a trivial logical point with a radical epistemological claim to smuggle in a conclusion that doesn't follow.

  Here is a breakdown of the distinct theses hidden within that slogan, evaluated according to your criteria. You can take this list directly to your seminar.

  ### 1. The Duhem-Quine Thesis (Confirmational Holism)
  *   **The Thesis:** A scientific hypothesis cannot be tested in isolation; it is always tested as part of a conjunction including the theory, auxiliary assumptions, and ceteris paribus clauses. Therefore, if a prediction fails, logic dictates only that *something* in the conjunction is false, not specifically the core theory.
  *   **Status:** **Substantive but Defensible.** This is a widely accepted logical point about the structure of testing.
  *   **Supports Classmate's Conclusion?** **No.** While this thesis shows it is *logically possible* to save a theory by modifying auxiliaries (like blaming the apparatus), it does not show it is *rational* to do so in every case. It explains the mechanism of "saving," but not the justification.
  *   **Reasonable Acceptance:** Yes, most philosophers accept holism. However, no reasonable philosopher accepts that this licenses *arbitrary* adjustment. The auxiliary assumptions must be independently testable. Blaming a broken thermometer is rational; positing an unobservable "invisible shield" that only exists to block falsification is not.

  ### 2. Transient Underdetermination (Underdetermination at a Time)
  *   **The Thesis:** Given the finite body of evidence available *right now*, there may be multiple competing theories that are equally compatible with that data.
  *   **Status:** **Platitude.** This is obviously true; science is often in a state of flux before new technology or experiments distinguish rivals.
  *   **Supports Classmate's Conclusion?** **No.** This thesis implies that empirical considerations *could* settle the matter in the future. It advocates for suspension of judgment or further inquiry, not for choosing based on ideological preference.
  *   **Reasonable Acceptance:** Universally accepted. It does not support the claim that empirical considerations can *never* settle the matter.

  ### 3. Permanent Underdetermination (Strong Empirical Equivalence)
  *   **The Thesis:** There are rival theories that are compatible with all *possible* observational evidence, past, present, and future. No conceivable experiment could distinguish between them.
  *   **Status:** **Controversial / Substantive.** This is a strong metaphysical claim. While it might apply to specific cases (e.g., certain interpretations of Quantum Mechanics), many realists argue it is false for mature sciences.
  *   **Supports Classmate's Conclusion?** **Yes.** If evidence can *never* decide, then non-empirical factors must be the tie-breaker.
  *   **Reasonable Acceptance:** **Generally No.** Most philosophers of science reject this as a general principle. Even if accepted in niche cases, it does not justify "ideological preference." It usually justifies choosing based on metaphysical virtues (like ontological parsimony), not political or personal ideology. Furthermore, psychoanalysis is not empirically equivalent to its rivals; it is arguably *disconfirmed* by them, which makes this thesis inapplicable to your classmate's example.

  ### 4. The Inductive Gap (Humean Underdetermination)
  *   **The Thesis:** No finite set of observational statements can logically entail a universal theory. There is always a logical gap between "what we have seen" and "what is always the case."
  *   ** **Status:** **Platitude.** This is the classic Problem of Induction.
  *   **Supports Classmate's Conclusion?** **No.** This applies to *all* science equally (physics, chemistry, biology). If this justified choosing theories on ideological grounds, it would justify doing so for gravity or germ theory as well. Since we don't do that, this thesis cannot be the justification for the classmate's friend.
  *   **Reasonable Acceptance:** Universally accepted, but it leads to skepticism about *all* knowledge, not a license for ideological theory choice in specific fields.

  ### 5. Methodological Underdetermination (The Quinean Web)
  *   **The Thesis:** The criteria we use to choose between theories (simplicity, scope, consistency, fruitfulness) are not algorithmic. They can conflict, and their weighting is a matter of judgment.
  *   **Status:** **Substantive but Defensible.** Thomas Kuhn and others have argued that "simplicity" is not an objective metric.
  *   **Supports Classmate's Conclusion?** **Weakly.** It supports the idea that non-empirical *epistemic values* play a role. However, it does not support "ideological preference." There is a vast difference between preferring a theory because it is mathematically simpler versus preferring it because it aligns with your political or personal worldview.
  *   **Reasonable Acceptance:** Yes, but with the caveat that these values are still *epistemic* (aimed at truth), not *ideological* (aimed at social goals).

  ***

  ### Summary for Seminar: The "Ad Hoc" Distinction

  Your classmate's argument relies on an equivocation. They use **Thesis 1 (Holism)** to argue that the psychoanalyst is *allowed* to add assumptions (just like the physicist), but they rely on **Thesis 3 (Permanent Underdetermination)** to argue that empirical data *cannot* ultimately decide the issue.

  To rebut them, you should focus on the distinction between **progressive** and **degenerating** research programs (a la Imre Lakatos):

  1.  **The Physicist:** When a physicist blames the apparatus, they usually make a new prediction about the apparatus that can be independently checked (e.g., "If we recalibrate the sensor, the reading will change"). This is a **testable auxiliary**.
  2.  **The Psychoanalyst:** When the psychoanalyst adds an assumption (e.g., "The patient is repressing the memory"), does this new assumption generate new, risky predictions? Or does it merely explain away the failure? If it only explains away the failure without predicting anything new, it is **ad hoc**.

  **The Verdict:**
  Is there any reading strong enough to get your classmate's conclusion (that ideological preference is legitimate) that a reasonable philosopher could accept? **No.**

  *   If the underdetermination is weak (Thesis 2), empirical data will eventually settle it, so ideology is premature.
  *   If the underdetermination is strong (Thesis 3), it is too controversial to be a general defense, and even then, it justifies metaphysical caution, not ideological license.
  *   The mere logical possibility of saving a theory (Thesis 1) does not make it rational to do so if the cost is making the theory unfalsifiable.

  **Recommendation:** Ask your classmate: *"Does the auxiliary assumption your friend added yield any new testable predictions, or does it only serve to block the refutation? If the latter, isn't that a degenerating move, regardless of whether underdetermination exists?"*
