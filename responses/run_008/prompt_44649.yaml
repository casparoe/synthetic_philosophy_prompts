answer: |-
  This is a classic "measurement-theoretic ambush," and your instinct is correct: the argument proves too much because it conflates *invariance* with *meaninglessness*. Your economist friend has constructed a sorites of plausible-sounding claims that collapses under the weight of formal measurement theory.

  Here is the breakdown you need to regain control of the reading group.

  ### 1. Brainstorming Readings of Step (1)

  Step (1) claims: *"Affine invariance... [means] facts about a single player's own utilities and their ratios are all that carry information, and no comparison between player 1's utilities and player 2's means anything."*

  To diagnose the error, we must distinguish three ways to interpret "meaningless" in this context:

  *   **Reading A (Ontological):** Utility numbers are not real properties of the world; they are merely indices of preference orderings. Therefore, $u_1(x) = u_2(y)$ is not just false, but *category error*, like comparing meters to seconds.
  *   **Reading B (Measurement Theoretic):** A statement involving utility numbers is "meaningful" if and only if its truth value is invariant under the class of admissible transformations (here, independent positive affine transformations). Since $u_1(x) > u_2(y)$ changes truth value if we rescale $u_2$, it is meaningless.
  *   **Reading C (Normative/Political):** We *ought not* make interpersonal comparisons because there is no ethical consensus on how to weigh one person's welfare against another's. The theory should remain neutral on this.

  The economist is sliding between **Reading B** (the technical justification for affine invariance) and **Reading A** (the philosophical conclusion that cross-person mathematical operations are ill-posed). Step (1) is technically acceptable under Reading B, provided we understand "meaningless" as "not invariant." However, this sets the trap for Step (3).

  ### 2. The Rejection: Step (3)

  I reject **Step (3)**.

  > *(3) The Kalai–Smorodinsky construction makes the same illicit presupposition: to pronounce that player 1 has covered the same fraction of the distance from disagreement to utopia as player 2 is to measure how far each is along her own scale and judge the two distances equal — an interpersonal comparison of utility if ever there was one.*

  This step contains a demonstrable error in measurement theory.

  **The Diagnosis: Confusion of Dimensionless Ratios with Utility Magnitudes**
  The economist claims that equating the "fraction of maximal gain" constitutes an interpersonal comparison (IPC) of utility. This is false.
  In measurement theory (following Luce, Suppes, and Krantz), utility in bargaining is an **interval scale**. The admissible transformations are $\phi_i(u_i) = a_i u_i + b_i$ with $a_i > 0$.
  A statement is meaningful if it is invariant under these transformations.
  *   **Meaningless:** $u_1(x) - d_1 = u_2(y) - d_2$. (Comparing absolute gains). If I rescale player 2 by 1000, this equality breaks.
  *   **Meaningful:** $\frac{u_1(x) - d_1}{m_1 - d_1} = \frac{u_2(y) - d_2}{m_2 - d_2}$. (Comparing ratios of differences).

  Let's check the invariance of the ratio for player $i$:
  $$ \frac{(a_i u_i + b_i) - (a_i d_i + b_i)}{(a_i m_i + b_i) - (a_i d_i + b_i)} = \frac{a_i(u_i - d_i)}{a_i(m_i - d_i)} = \frac{u_i - d_i}{m_i - d_i} $$
  The scalar $a_i$ cancels out. The ratio is a **dimensionless number** (a pure real number between 0 and 1).
  Equating two dimensionless numbers ($t_1 = t_2$) does not require comparing the *units* of the scales, only the *values* of the indices. It is no more an interpersonal comparison of utility than saying two runners have completed the same *percentage* of their respective races is a comparison of their physical speeds.

  The economist commits an **equivocation on "comparison."**
  1.  **Comparison of Magnitudes:** Asserting $1 \text{ util}_1 = 1 \text{ util}_2$. (Forbidden by affine invariance).
  2.  **Comparison of Indices:** Asserting $0.5_1 = 0.5_2$ where the subscripts denote dimensionless ratios derived from independent scales. (Permitted).
  Kalai-Smorodinsky does the latter. Step (3) falsely asserts they do the former.

  **Why It Looked Fine**
  It looked defensible because the language of "fraction of the distance" invites a geometric visualization where the axes are implicitly assumed to be orthogonal and *commensurable* (like inches on a graph). If you draw the bargaining set on paper, the diagonal line $x=y$ looks like it compares $x$ and $y$ directly. The economist exploits this visual intuition to suggest that the mathematical operation shares the ontological baggage of the visualization.

  **The Cost of Rejecting (3)**
  Rejecting this step costs the defender of axiomatic theory nothing in terms of logical consistency. However, it does force a concession on **normative arbitrariness**. By admitting that $t_1 = t_2$ is mathematically meaningful, we admit it is not *uniquely* mandated by rationality. We could have chosen to equate $t_1^2 = t_2$, or maximize $t_1 t_2$ (Nash). The measurement theory validates the *coherence* of the K-S solution, but not its *necessity*. You must concede that K-S is one consistent way to map dimensionless indices to an outcome, not the only way.

  ### 3. Assessing the Residue

  Does any part of your friend's worry survive? **Yes, but it shifts from a logical critique to a normative one.**

  **1. The Symmetry Axiom (Step 2 Residue)**
  While Step (3) is the measurement-theoretic error, Step (2) leaves a philosophical residue. The economist is right that Symmetry applies only to *representations* where scales are aligned.
  *   **Worry:** How do we know when a real-world problem is "symmetric"?
  *   **Concession:** A defender must admit that "Symmetry" is not a fact about the world, but a modeling choice. We *choose* to represent the players in common units to apply the axiom. If the players have different bargaining powers or outside options that we cannot normalize, the Symmetry axiom simply doesn't apply. The theory doesn't solve the problem of *identifying* symmetry; it only says *if* you model it as symmetric, here is the solution.

  **2. The Choice of Benchmark (The Utopia Point)**
  The most significant surviving worry concerns the **utopia point $m$**.
  *   **Worry:** The K-S solution relies on comparing gains relative to $m$ (the best possible payoff). But $m$ is often not feasible. Why should my "fair share" depend on a payoff I can never actually get?
  *   **Concession:** This is the true normative content of K-S. It interprets bargaining as a claim on *potential* surplus. Nash interprets it as a multiplication of *actual* gains. The measurement theory shows both are coherent (both use invariant constructions), but it cannot tell you which benchmark (utopia point vs. disagreement point product) is "fair."
  *   **Advice:** Concede to your group that the axiomatic approach does not derive *values* from *logic*. It derives *consistency* from *values*. If you value proportional claims on potential (K-S), the math works without IPC. If you value proportional claims on welfare (which requires IPC), you need a different theory. The economist is right that we need a normative story to pick the axioms, but wrong that the axioms themselves are logically incoherent without IPC.

  **Summary for the Group:**
  Tell the economist: "You are conflating the invariance of *utility levels* with the invariance of *dimensionless ratios*. Step (3) is measurement-theoretically false; equating normalized gains is invariant under independent affine transformations. The theory is logically consistent without interpersonal comparability. However, you are right that choosing *which* invariant ratio to equate (K-S vs. Nash) is a normative choice, not a logical necessity."
