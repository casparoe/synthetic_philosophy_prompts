  Based on Maya's track record, she is operating like an **Analytical Sociologist** (think Peter Hedström or Raymond Boudon). Her "Real Explanation" list is a catalog of **causal mechanisms** (strategic interaction, path dependence, feedback loops), while her "Handwaving" list is a catalog of **reifications** (treating groups like people) and **teleology** (assuming outcomes happen because they are functional).

  Here is the breakdown of your three candidates, the rule she's using, and how to test it.

  ### 1. Predictions for Your Three Cases

  *   **Case 1: Flat Hierarchies (Selection Argument)**
      *   **Maya's Call:** **Real Explanation.**
      *   **Why:** This explanation explicitly avoids the trap of her "Company wanted to stay lean" handwaving call. It denies that the firm has a mind or a purpose ("nobody chose... because of competition"). Instead, it posits a concrete **selection mechanism** (market competition filtering firms based on decision speed). This fits perfectly with her acceptance of the "Railway Gauge" example (path dependence/constraints) and the "2008 Mess" (systemic constraints). It explains *how* the outcome occurred without attributing agency to an abstraction.
  *   **Case 2: Insurance (Risk Aversion)**
      *   **Maya's Call:** **Handwaving.**
      *   **Why:** This is the micro-level equivalent of her "Crime fell because society became more cohesive" call. While it bottoms out in individuals (which looks good), it treats the **preference change** as a black box. *Why* did they become more risk averse? In mechanism-based sociology, explaining a behavioral shift by saying "preferences shifted" is tautological. It identifies the proximate cause but fails to provide the causal mechanism for that cause.
  *   **Case 3: Unemployment (Interest Rates)**
      *   **Maya's Call:** **Handwaving.**
      *   **Why:** This is a macro-to-macro claim ("Central Bank" -> "Unemployment") that skips the transmission mechanism. It sounds like "The Country changed its mind" (Prohibition). Unless you specify the gears (e.g., "rates cut -> borrowing cheaper -> firms invest -> hiring up"), it treats the economy as a machine with a magic lever. It lacks the interactional detail of the "Bank Run" or "Gas Station" examples.

  ### 2. The Rule She Is Running

  Maya is following the **Mechanism-Based Explanation** rule, not strict Methodological Individualism.

  *   **The Rule:** An explanation is "Real" only if it specifies the **causal gears** (interactions, constraints, selections, or feedback loops) that connect the cause to the effect. It must avoid **Reification** (groups acting like people) and **Teleology** (things happening because they are efficient/good).
  *   **Why not Methodological Individualism?** If she were a strict individualist, she would have rejected the "Railway Gauge" and "2008" examples, as those rely heavily on structural constraints and systemic feedback rather than just individual beliefs. She accepts structural explanations *provided they have a mechanism.*

  ### 3. Which Case Pulls the Rules Apart?

  **Case 2 (Insurance/Risk Aversion)** is the strongest differentiator between the two rules you identified.

  *   **Rule A (Mechanism):** Calls this **Handwaving**. (Preferences are a black box; no mechanism explains the shift).
  *   **Rule B (Individualism):** Calls this **Real**. (It bottoms out in individual psychological states).
  *   **The Test:** If she calls this "Real," she is a Methodological Individualist who cares more about the *level* of analysis than the *depth* of the cause. If she calls it "Handwaving" (as predicted), she is a Mechanism Realist who demands a cause for the preference change itself.

  *(Note: Case 1 also pulls them apart—Rule A says Real, Rule B says Handwaving because firms aren't people—but Case 2 is a cleaner test because her "Handwaving" list is dominated by unexplained cultural/psychological shifts.)*

  ### 4. Which Case Will She Waffle On?

  **Case 3 (Interest Rates/Unemployment)** is the waffle.

  *   **Why:** This is standard economic shorthand. While sociologically thin, it references a specific policy action by a specific group (Central Bankers), which makes it feel more concrete than "Society became cohesive." She might pause to ask, "Do you mean through the investment channel or the exchange rate channel?" If you say "Just the rates," she'll likely mark it Handwaving, but it will take her longer to decide than the other two.

  ### 5. The Tie-Breaker Case

  To definitively settle whether she cares about **Mechanisms** (Rule A) or **Individual Beliefs** (Rule B), you need a case that is **Mechanistic but Non-Individual.**

  **Ask her about this:**
  > *"The traffic jam formed because the rate of cars entering the highway exceeded the capacity of the exit ramp."*

  *   **If she says Real:** She follows the **Mechanism Rule**. The explanation specifies the causal gears (flow dynamics/constraints) without referencing what any individual driver believed or wanted. This confirms her "Railway Gauge" call was principled, not a fluke.
  *   **If she says Handwaving:** She follows the **Individualist Rule**. She believes a social explanation is incomplete unless it describes the drivers' decisions (e.g., "drivers slowed down because they saw brake lights").

  **Summary for your dinner party strategy:**
  Bet on **Hierarchies = Real**, **Insurance = Handwaving**, **Rates = Handwaving**. If you want to win a side bet on her underlying philosophy, use the **Traffic Jam** case. If she accepts the traffic jam explanation, you know she's a Mechanism Realist, and you can safely predict she'll reject the Insurance case.
