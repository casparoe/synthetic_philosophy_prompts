  **Scenario: The EMU Twin Cases**

  **Setting:** A Level 4 Epilepsy Monitoring Unit. Two patients, Patient A and Patient B, are admitted for refractory focal epilepsy. Both have identical lesion profiles: focal cortical dysplasia in the left motor cortex. Both are subjected to the same trigger protocol: controlled sleep deprivation combined with intermittent photic stimulation.

