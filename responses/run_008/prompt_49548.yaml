  **5. The Conditional Analysis Defender's Attack**
  A defender of SCA would argue that the disposition *just is* the truth of the counterfactual. They would claim: "If neither patient convulses in nearby worlds, neither is disposed to seize. The EEG data is irrelevant to the disposition *to seize clinically*."
