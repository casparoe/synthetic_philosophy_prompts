  *   **Clinical Implication:** When a clinician certifies a patient "seizure-free," they are implicitly choosing a metaphysical cutoff. If they rely on behavior alone, they treat Patient A and B identically (SCA). If they rely on EEG, they distinguish them (Fink/Mask). Certifying Patient A as "seizure-free" is a pragmatic mask; certifying Patient B is a claim about the removal of the disposition. The clinic cannot escape the metaphysics; it merely hides the criteria.

