  *   **Patient A (Mask):** The disposition is present. The categorical basis (neural hyperexcitability) is intrinsic and stable. The interferer (paralysis) is extrinsic to the disposition's basis, acting only on the manifestation channel. The failure of the counterfactual is due to masking.
