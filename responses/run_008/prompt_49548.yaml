  *   **Mechanism:** When the trigger (sleep deprivation) begins to alter the neural environment, the device detects this rising susceptibility *before* hyperexcitability reaches the threshold for ictal discharge. It delivers conditioning stimulation that actively normalizes membrane potentials, restoring the seizure threshold to baseline levels. The hyperexcitability (the categorical basis of the disposition) is neutralized *by the presence of the trigger conditions* acting through the device.
  *   **Outcome:** In actuality and all nearby worlds where the trigger occurs, the EEG remains interictal. No electrographic seizure occurs. No clinical convulsion occurs. The patient remains behaviorally still.

