  *   **Problem:** This contradicts the clinical intuition that Patient A is still epileptic (the brain is firing), while Patient B is functionally cured (the brain is stabilized). SCA collapses the distinction.

  **2. The Standing-Ready Rejoinder**
  This rejoinder argues that if a mechanism is standing ready to remove the disposition *upon stimulation*, the disposition cannot be truly ascribed to the object in that context.
