          *   Progression: Start with reasons to save the one (name, face, claim), strip them away until only number remains.
          *   Debrief: Sort decisions into three positions (Numbers count directly, Numbers count indirectly/fairness, Numbers don't count).
          *   Specific focus: Coin-flipping solution (randomization) and class reaction.
