          *   Step 2: Agree mostly. Periods aren't physical.
          *   Step 3: **STOP HERE.** This is the error. "Just a story" does not mean "names nothing." It means "names a conceptual cluster."
          *   Step 4: Consequently, this falls. Events happen in *time*, not in *periods*. Periods are just coordinates.
