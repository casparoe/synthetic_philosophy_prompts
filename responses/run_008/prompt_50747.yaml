      *   *Analogy:* Use the "Time Zone" analogy. Time zones are arbitrary conventions. But "The meeting happened during EST" is still a true statement, even if EST is a human construct. Or "The game happened in the second quarter." Quarters are arbitrary divisions of the clock, but plays happen in them.
