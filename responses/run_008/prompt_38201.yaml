prompt: |-
  After six years of watching from the sidelines, I was elected chair of my department's graduate admissions committee this autumn, and in the first full meeting I chaired I watched something I still have trouble believing happened. We had agreed on a procedure: score each shortlisted applicant against three criteria — writing sample, fit, preparation — vote yes or no on each, and advance only applicants who pass all three. On our first serious case, a majority of the committee judged the writing sample strong, a majority judged the fit good, and a majority judged the preparation adequate, and yet the applicant was rejected, with nobody remarking on the oddity, because the criterion-by-criterion results gave us no way to see that the three majorities did not overlap in any single person. When I drew the table on the whiteboard afterwards, one colleague said it was a trick of how I had presented it, and another insisted it was an artifact of our particular procedure and that no procedure would have done better. I want the next committee — and, more to the point, the graduate seminar on collective choice that I am teaching in the spring — to feel what happened rather than see it argued on a slide.

  Design the session. It is a seminar of about fourteen students, one ninety-minute block, no lecture beforehand, and the standard names (discursive dilemma, doctrinal paradox, and anything in that family) withheld until the debrief. The students should not be told the point in advance; I want the reversal to ambush them. Specifically:

  1. The game itself: a staged committee making real decisions. I would like at least one round in which students hold fixed, assigned judgment profiles — please construct the actual profiles, with three or four binary premises, a conclusion that is a conjunction of them, and between three and five assignments that yield majority-true premises together with a majority-false conclusion, with no individual holding an outright contradiction. I would also like a second round in which something other than the aggregation rule does the work: for instance an agenda effect, where the outcome depends on which question is put to the group first, or on whether the committee votes on the conclusion directly or is forced through the premises one at a time. Tell me exactly what materials I need, how votes should be recorded so the pattern is visible without becoming legible too early, and how to keep students from coordinating around the trap.

  2. Stakes that are not money but are felt. Perhaps each student's standing in the game rises when the committee's final decision matches their own sincere judgment on the conclusion, so that premise-oriented and conclusion-oriented participants in the same round have structurally different interests, and the tension between thinking the applicant should be admitted and thinking the criteria were or were not met becomes the material of the activity rather than commentary on it. I am open to a better scheme if you have one, but I do not want it to collapse into a trivial majority-wins exercise.

  3. The debrief: map specific moments in the activity onto the formal distinctions — premise-based versus conclusion-based aggregation, the gap between the group's verdict and every member's verdict, and, if you use the agenda round, how a sequence of votes can determine what the group believes without anyone changing their mind. I want the debrief to close by returning to my admissions meeting, so please give me a way to reconstruct what happened there from what the students have just experienced.

  4. Failure modes: what will predictably go wrong on the first run. Students seeing through the design; abstentions; and, most important, discussion — real committees usually escape this problem by talking, and I suspect that if the students deliberate freely they will dissolve the dilemma by exchanging reasons before it ever bites. Tell me whether to forbid deliberation, and what is lost either way.

  5. Honesty about limits: which feature of the problem no classroom game can reproduce. My suspicion is that in a real committee the judgment profiles are endogenous — they are shaped partly by the very procedure that then aggregates them, something a game with assigned profiles cannot fake. Tell me whether that is right, and what else the activity necessarily misses and I will have to supply in the debrief.
reasoning: |-
  Here's a thinking process that leads to the suggested seminar design:

  1.  **Analyze the Request:**
      *   **User:** A professor/chair of a graduate admissions committee who experienced the "Doctrinal Paradox" (or Discursive Dilemma) firsthand.
      *   **Goal:** Design a 90-minute seminar session for ~14 students to *experience* this paradox, not just learn about it theoretically.
      *   **Constraints:** No prior lecture, withhold terminology until debrief, ambush the students with the reversal.
      *   **Key Components:**
          1.  *The Game:* Staged committee, fixed judgment profiles (premise-based vs. conclusion-based conflict), agenda effects. Needs specific profiles.
          2.  *Stakes:* Non-monetary, felt stakes (standing/reputation based on alignment with outcome vs. sincere judgment).
          3.  *Debrief:* Map activity to formal distinctions, return to the user's admissions story.
          4.  *Failure Modes:* Anticipate problems (students seeing through it, abstentions, deliberation dissolving the paradox).
          5.  *Limits:* Acknowledge what the game *can't* simulate (endogenous preferences).

  2.  **Deconstruct the Core Problem (The Doctrinal Paradox):**
      *   *Structure:* $P \land Q \to C$.
      *   *Paradox:* Majority says Yes on $P$, Majority says Yes on $Q$, but Majority says No on $C$ (because the individuals who said Yes on $P$ are not the same as those who said Yes on $Q$).
      *   *Requirement:* Need profiles where $\text{Maj}(P)=1, \text{Maj}(Q)=1$, but $\text{Maj}(C)=0$.
      *   *Participants:* 14 students. Need to divide them into sub-committees or run one large committee. A single large committee is harder to manage for specific profiles. Better to split into 3 sub-committees of 4-5 people each, or run one large committee with assigned roles. Let's aim for one large committee simulation but broken into "voting blocs" or individual roles to ensure the math works. Actually, for 14 students, splitting into 3 committees of 4-5 allows comparison, but the prompt asks for *a* staged committee. Let's make the whole class one committee to maximize the "real meeting" feel.
      *   *Profiles:* Need 14 profiles.
          *   To get the paradox:
              *   Group A (5 people): Yes on P1, Yes on P2 $\to$ Yes on C.
              *   Group B (5 people): Yes on P1, No on P2 $\to$ No on C.
              *   Group C (4 people): No on P1, Yes on P2 $\to$ No on C.
              *   *Check:* P1 Yes = 10 (Maj), P2 Yes = 9 (Maj), C Yes = 5 (Min).
              *   *Wait, simple majority:* Need $>50\%$. 14 people. Majority is 8.
              *   Let's adjust:
                  *   Type 1 (Yes/Yes/Yes): 5 people.
                  *   Type 2 (Yes/No/No): 5 people.
                  *   Type 3 (No/Yes/No): 4 people.
                  *   P1 Yes: 10 (Maj). P2 Yes: 9 (Maj). C Yes: 5 (Min).
                  *   This works perfectly.

  3.  **Drafting the Session Plan (90 Minutes):**
      *   *Intro (5 min):* Set the scene. You are the admissions committee.
      *   *Round 1 (25 min):* Premise-Based Procedure (PBP). Vote on criteria, then derive outcome.
      *   *Round 2 (25 min):* Conclusion-Based Procedure (CBP) or Agenda Manipulation. Vote on outcome directly.
      *   *Round 3 (Optional/Time Permitting):* Deliberation allowed (to show failure mode).
      *   *Debrief (35 min):* Reveal the trick, map to theory, connect to Chair's story.

  4.  **Developing the Stakes:**
      *   Money is bad. Grades are unethical.
      *   Idea: "Reputation Points" or "Faculty Standing."
      *   Mechanism: You get points if the *Final Verdict* matches your *Sincere Verdict* on the Conclusion.
      *   Twist: In Round 1, the procedure forces a verdict that might contradict your sincere view on the conclusion (if you are premise-driven). In Round 2, you vote directly.
      *   Wait, the prompt wants tension between "thinking applicant should be admitted" and "thinking criteria were met."
      *   Refined Stake: Each student has a "Sincere Card" (their actual judgment on P1, P2, C). They get a point if the Committee's Final Decision matches their Sincere Conclusion. *However*, they are instructed to vote according to a specific *mandate* in each round (e.g., Round 1: "Vote your conscience on criteria," Round 2: "Vote your conscience on admission").
      *   Actually, to make the paradox bite, they must vote sincerely on the premises in Round 1. If they strategize, the paradox disappears. So the instruction must be: "Vote your true judgment on the specific question asked."
      *   Stake refinement: "Professional Integrity." If the committee outcome matches your private judgment on the *final* decision, you gain 'Standing'. If the procedure forces an outcome you privately disagree with, you lose 'Standing'. This creates the frustration.

  5.  **Addressing Failure Modes (Deliberation):**
      *   *Crucial Point:* The Doctrinal Paradox relies on *fixed* judgments. If students talk, they will realize "Wait, if we all vote Yes on C, we get points." Or they will persuade each other to change premises.
      *   *Decision:* Deliberation must be restricted in Round 1 & 2. It is a voting simulation, not a negotiation simulation *yet*.
      *   *Round 3:* Allow deliberation to show how real committees "solve" it (by shifting judgments, i.e., endogenous preferences).
      *   *Materials:* Secret ballots are essential. Public show of hands reveals the counts too early and allows coordination.

  6.  **Addressing the "Limits" (Endogeneity):**
      *   The user is right. In real life, knowing the procedure affects how you evaluate the premises.
      *   The game treats preferences as exogenous (fixed cards).
      *   Debrief must highlight this: "In the game, you were robots. In my meeting, we were humans who might have shifted our views on 'Fit' if we knew the voting rule."

  7.  **Fleshing out the Details (Iterative refinement):**

      *   *Scenario:* "Candidate X."
      *   *Criteria:* 1. Quantitative Prep (Q), 2. Research Fit (F). Decision: Admit (A). Rule: Admit iff Q and F.
      *   *Profiles:* (Using the 5-5-4 split calculated earlier).
      *   *Materials:* Envelopes with role cards. Ballots. Whiteboard (hidden until debrief).
      *   *Recording Votes:* Use a tally sheet kept by the Chair (Instructor). Do not reveal intermediate counts until the end. Just announce "Motion Passes/Fails."
      *   *Round 1 (Premise-Based):* Vote Q. Vote F. Calculate A. (Result: Admit, because Q=Yes, F=Yes). *Wait, check math.*
          *   Type 1 (5): Q=Y, F=Y $\to$ A=Y.
          *   Type 2 (5): Q=Y, F=N $\to$ A=N.
          *   Type 3 (4): Q=N, F=Y $\to$ A=N.
          *   Vote Q: 10 Yes, 4 No. (Passes).
          *   Vote F: 9 Yes, 5 No. (Passes).
          *   Result: Admit.
          *   *Wait, the User's Story:* The user said the applicant was *rejected* despite majority on all criteria.
          *   *Correction:* I need the profile where Maj(Q)=Yes, Maj(F)=Yes, but Maj(A)=No.
          *   *My previous math:* Q=10Y, F=9Y. A (Sincere) = 5Y, 9N.
          *   *Procedure 1 (Premise-Based):* We vote on Q (Pass), Vote on F (Pass). Logic dictates Admit.
          *   *Procedure 2 (Conclusion-Based):* We vote on A directly. Result: Reject (5 Yes, 9 No).
          *   *The User's Experience:* They used Premise-Based (vote criteria), but the *individuals* were voting based on their holistic view (Conclusion-Based mental model) or the aggregation failed.
          *   *Actually, the User's Story:* "Majority judged writing strong, majority judged fit good... yet applicant was rejected." This implies the committee voted on criteria (Premise-Based), passed them, but *somehow* rejected.
          *   *Wait, re-reading the prompt:* "the criterion-by-criterion results gave us no way to see that the three majorities did not overlap in any single person."
          *   *Ah, the specific paradox:* If you vote on premises, you *must* accept the conclusion logically. If they rejected the applicant despite passing premises, they violated their own procedure.
          *   *OR:* They voted on premises, passed them, but then voted on the conclusion and rejected it (inconsistency).
          *   *Better interpretation for the game:* I want the students to feel the *Discursive Dilemma*.
          *   *Scenario A (Premise-Based):* Vote P1, Vote P2. Derive C. Outcome: **Admit**. (Because P1 & P2 pass).
          *   *Scenario B (Conclusion-Based):* Vote C directly. Outcome: **Reject**. (Because only 5/14 sincerely support C).
          *   *The "Ambush":* In Round 1, they vote premises. The math forces an Admit. Many students (the 9 who sincerely want Reject) will be unhappy. In Round 2, they vote Conclusion. The math forces a Reject. The 5 who sincerely want Admit will be unhappy.
          *   *Wait, the User's story:* The applicant was *rejected*. The majorities supported the criteria. This means the committee effectively voted Conclusion-Based (or acted inconsistently).
          *   *Game Design:* I will run two rounds. Round 1: Premise-Based (Forces Admit). Round 2: Conclusion-Based (Forces Reject). This shows the *procedure* determines the outcome, not the "will of the people."
          *   *Wait, I need to match the User's experience more closely.* The user wants to reconstruct *their* meeting. In their meeting, criteria passed, but applicant rejected. This is logically inconsistent if the rule is "Admit iff Criteria Pass."
          *   *Explanation:* In the user's meeting, members voted on criteria based on their *own* standards, but when it came to the final vote, they voted their *holistic* judgment.
          *   *Game:*
              *   Round 1: "Strict Procedure." Vote P1, Vote P2. Chair announces result based on logic. (Outcome: Admit).
              *   Round 2: "Holistic Procedure." Vote C directly. (Outcome: Reject).
              *   This highlights the conflict.

      *   *Stakes Refinement:*
          *   Give each student a "Constituency Card."
          *   5 Students: "Pro-Admit" (Sincere: Y, Y, Y).
          *   5 Students: "Quant-Skeptics" (Sincere: Y, N, N).
          *   4 Students: "Fit-Skeptics" (Sincere: N, Y, N).
          *   Payoff: You get a "Success Token" if the Committee's Final Decision matches your Sincere Conclusion (Y or N).
          *   Round 1 (Premise Vote): Committee decides Admit. Pro-Admit (5) get tokens. Skeptics (9) get nothing.
          *   Round 2 (Conclusion Vote): Committee decides Reject. Skeptics (9) get tokens. Pro-Admit (5) get nothing.
          *   *Tension:* The group is collectively rational in both rounds, but the "Group Will" flips.

      *   *Materials:*
          *   Role Cards (sealed envelopes).
          *   Ballots (slips of paper).
          *   Tally Sheet (Instructor only).
          *   Whiteboard (covered).

      *   *Deliberation:*
          *   Round 1 & 2: NO TALKING. "You are busy faculty. Email votes only."
          *   Round 3 (If time): Open discussion. Watch them try to align premises to match desired conclusion (Endogeneity).

  8.  **Structuring the Debrief:**
      *   Reveal the counts (The Whiteboard Reveal).
      *   Show the overlap failure (Venn diagram).
      *   Name the paradox (List & Pettit, Kornhauser & Sager).
      *   Connect to User's Story: "This is what happened to me. The majorities existed, but not in the same people."
      *   Discuss the "Real Committee" limit: In the game, you couldn't talk. In reality, we talk, and that changes the judgments (Endogeneity).

  9.  **Refining the "Failure Modes":**
      *   *Seeing through it:* If they realize the counts, they might lie. *Counter:* Emphasize "Professional Integrity" rule. Lying violates the simulation's contract.
      *   *Deliberation:* Strictly forbid in Rounds 1 & 2. Use "Blind Voting" (folded paper).
      *   *Abstentions:* Require a vote. "Abstention counts as a No" or simply mandate participation.

  10. **Final Review against Constraints:**
      *   14 students? Yes (5+5+4 split).
      *   90 mins? Yes (25+25+10+30).
      *   No lecture beforehand? Yes.
      *   Withhold names? Yes.
      *   Stakes felt? Yes (Win/Loss tokens based on alignment).
      *   Reconstruct user's meeting? Yes.

  11. **Writing the Response:**
      *   Tone: Professional, pedagogical, empathetic to the user's frustration.
      *   Structure: Follow the 5 numbered points in the prompt.
      *   Specifics: Provide the exact text for the Role Cards. Provide the exact tally logic.

      *(Self-Correction during drafting)*: Make sure the "Stakes" don't encourage lying. If I tell them "You win if the outcome matches your card," they might lie on the premise vote to force the outcome they want.
      *   *Fix:* The instruction must be: "You are evaluated on your *consistency* and the *committee's success*."
      *   *Better Fix:* Don't make it a game theory equilibrium problem. Make it a simulation of *frustration*.
      *   *Revised Stake:* "Faculty Reputation."
      *   Instruction: "Vote your sincere judgment on the question asked."
      *   Post-Round Feedback: "If the Committee Outcome matched your Sincere Conclusion, you gain 1 Reputation Point."
      *   *Risk:* In Round 1 (Premise Vote), the 9 Skeptics know if they vote sincerely on premises, they lose (Outcome Admit, they want Reject). Will they lie on the premise vote?
      *   *Mitigation:* The Instructor must enforce the "Sincere Judgment" rule strictly. "This is not a strategy game; it is a simulation of cognitive constraint. You must vote your actual assessment of the criterion."
      *   *Alternative:* Don't announce the payoff rule until *after* the votes are cast. "We will now see whose judgment aligned with the committee." This prevents strategic voting on the premises. *This is the key.* Withhold the scoring rule until the ballots are in.

      *(Final Polish on Limits)*: Ensure the distinction between *exogenous* (game) and *endogenous* (reality) preferences is clear. This is the "Discussion" failure mode turned into a feature.

      *(Final Polish on Agenda)*: The prompt asks for an agenda effect round.
      *   Round 1: Premise-Based (Vote P1, Vote P2 $\to$ Derive C).
      *   Round 2: Conclusion-Based (Vote C directly).
      *   This is technically a "Procedure Effect," which is a form of agenda control. I will frame it as "Different Committees use different Bylaws."

      Let's assemble the plan.cw
answer: |-
  This session design is built to replicate the cognitive dissonance you experienced. It forces students to inhabit the judgment profiles that create the paradox, rather than observing them abstractly. The goal is to make the procedure feel like the antagonist.

  ### 1. The Game: "The Admissions Committee Simulation"

  **Setup:**
  *   **Time:** 90 Minutes.
  *   **Participants:** 14 Students (The Committee).
  *   **Role:** You are the Chair. You hold the tally sheets and the "Master Key" (the solution).
  *   **Materials:**
      *   14 Sealed Envelopes (Role Cards).
      *   Voting Slips (small distinct colors for different rounds).
      *   A "Committee Charter" (one-page handout).
      *   Whiteboard (covered with a sheet until the debrief).

  **The Case:**
  *   **Candidate:** "Alex."
  *   **Decision:** Admit or Reject.
  *   **Rule:** Admit **if and only if** (Preparation is Adequate **AND** Fit is Good).
  *   **Criteria:**
      1.  **Prep (P):** Is the quantitative preparation adequate? (Yes/No)
      2.  **Fit (F):** Is the research fit good? (Yes/No)
      3.  **Decision (D):** Admit? (Yes/No) — *Logic: D = P ∧ F*

  **The Profiles (The Trap):**
  Distribute the 14 envelopes randomly. Inside is a card telling them their *sincere* judgment. They must not show this to anyone.

  *   **Group A (5 Students): The Supporters**
      *   Prep: **Yes**
      *   Fit: **Yes**
      *   *Sincere Decision:* **Admit**
  *   **Group B (5 Students): The Prep-Skeptics**
      *   Prep: **Yes**
      *   Fit: **No**
      *   *Sincere Decision:* **Reject**
  *   **Group C (4 Students): The Fit-Skeptics**
      *   Prep: **No**
      *   Fit: **Yes**
      *   *Sincere Decision:* **Reject**

  *Check the Math:*
  *   Majority on Prep: 10 Yes vs. 4 No. (Passes)
  *   Majority on Fit: 9 Yes vs. 5 No. (Passes)
  *   Majority on Decision: 5 Admit vs. 9 Reject. (Fails)

  **Round 1: The Premise-Based Procedure (25 Minutes)**
  *   **Instruction:** "Committee Bylaws require we vote on criteria first. You must vote your sincere judgment on each criterion. The final decision is derived mathematically by the Chair."
  *   **Action:**
      1.  Collect votes on **Prep**. (Tally privately). Announce: "Motion on Preparation passes."
      2.  Collect votes on **Fit**. (Tally privately). Announce: "Motion on Fit passes."
      3.  **The Reversal:** You announce, "Since both criteria passed, per our bylaws, Alex is **Admitted**."
  *   **Stakes:** Hand out a scoring slip *after* the vote. "If the Committee's Final Decision matches your Sincere Decision on the card, mark a Success. If not, mark a Failure."
      *   *Result:* 5 Successes (Group A), 9 Failures (Groups B & C). The majority of the committee is unhappy with the outcome, despite voting for the premises that caused it.

  **Round 2: The Conclusion-Based Procedure (25 Minutes)**
  *   **Instruction:** "New Bylaws. We skip the criteria. We vote directly on the Admission."
  *   **Action:**
      1.  Collect votes on **Decision**.
      2.  **The Reversal:** You announce, "The motion to Admit fails. Alex is **Rejected**."
  *   **Stakes:** Same scoring.
      *   *Result:* 9 Successes (Groups B & C), 5 Failures (Group A). The minority is now unhappy.
  *   **Agenda Effect:** If you have time for a third micro-round, split the room into two sub-committees (7 vs 7). Give Sub-committee 1 the Premise Procedure, Sub-committee 2 the Conclusion Procedure. Ask them to report a single recommendation to you (the Dean). You now have contradictory recommendations from identical faculty.

  **Preventing Coordination:**
  *   **Blind Voting:** Votes are written on slips, folded, and placed in a box. No show of hands.
  *   **No Deliberation:** Explicitly state: "In this round, there is no discussion. This simulates a committee that relies on written assessments without meeting."
  *   **Withheld Scoring:** Do not tell them *how* they are scored until the ballots are in the box. If they know they score points on the Final Decision during Round 1, the 9 Skeptics might lie on the Premise votes to block the admission. By withholding the scoring rule, you ensure sincere premise voting.

  ### 2. Stakes: "Professional Standing"

  Money trivializes the epistemic problem. Grades are unethical. Use **Professional Standing**.

  *   **The Mechanism:** At the end of each round, students privately record if the Outcome matched their Sincere Judgment.
  *   **The Narrative:** "In this simulation, your 'Standing' rises when the Committee's verdict aligns with your professional assessment. If the procedure forces a verdict you believe is wrong, your Standing takes a hit."
  *   **Why this works:** It creates a structural conflict. In Round 1, the "Skeptics" (9 students) are the majority, yet they lose Standing. They feel the frustration of being a "Pyrrhic Majority"—they won the premise votes but lost the war. In Round 2, the "Supporters" (5 students) feel the frustration of logical consistency being ignored for a direct vote.
  *   **The Tension:** This prevents the "trivial majority-wins" collapse. In Round 1, the Majority *loses*. This is the core of the paradox they need to feel.

  ### 3. The Debrief: Mapping the Experience (35 Minutes)

  **Phase 1: The Whiteboard Reveal (10 mins)**
  *   Uncover the whiteboard. Draw the 3-column table (Prep, Fit, Decision).
  *   Ask for a show of hands: "Who had Yes on Prep?" (Count: 10). Write it.
  *   "Who had Yes on Fit?" (Count: 9). Write it.
  *   "Who had Yes on Decision?" (Count: 5). Write it.
  *   **The Question:** "How can 10 say Yes, 9 say Yes, but only 5 say Yes to the conclusion?"
  *   Draw the Venn Diagram. Show that the "Prep-Yes" circle and "Fit-Yes" circle overlap only in the 5-person Group A. The other Yes-voters are disjoint.
  *   **The Term:** Now introduce the **Discursive Dilemma** (or Doctrinal Paradox). Cite Kornhauser & Sager (1986) or List & Pettit (2002).

  **Phase 2: Procedure as Power (10 mins)**
  *   Highlight the Round 1 vs. Round 2 shift.
  *   **Point:** "The 'Will of the Committee' did not exist independently of the voting procedure. The procedure *created* the will."
  *   **Agenda Power:** If you ran the sub-committee variation, highlight how the Dean (you) could choose the outcome simply by assigning the procedure, without changing a single faculty member's mind.

  **Phase 3: Returning to Your Story (15 mins)**
  *   **The Reconstruction:** "This is what happened in my meeting. We voted on criteria (Round 1). The criteria passed. But when we looked at the room, the 'spirit' of the room was Reject (Round 2). We had created a logical inconsistency without realizing it."
  *   **The Colleague's Objection:** Address the colleague who said, "No procedure would have done better."
      *   *Response:* "Some procedures are better at tracking truth (Premise-Based), others at tracking satisfaction (Conclusion-Based). But no procedure can satisfy 'Majority Rule' on all issues simultaneously when judgments are interconnected."
  *   **Closing:** "You felt the frustration of the 9 Skeptics in Round 1. That is the feeling of a committee that has followed the rules but violated its own collective intent."

  ### 4. Failure Modes & Deliberation

  **Predictable Failure 1: Strategic Voting**
  *   *Risk:* In Round 1, if students guess the scoring rule, the 9 Skeptics might vote "No" on Prep or Fit to force a Reject.
  *   *Fix:* Withhold the scoring rule until ballots are collected. Enforce the instruction: "Vote your sincere assessment of the *criterion*, not the candidate."

  **Predictable Failure 2: Deliberation Dissolving the Paradox**
  *   *Risk:* If you allow talk in Round 1, Group A will persuade Group B or C to shift their premise judgments to align with the desired outcome.
  *   *Decision:* **Forbid deliberation in Rounds 1 & 2.**
  *   *Why:* The paradox relies on *fixed* judgments. If they talk, they change their minds, and the paradox vanishes. You want them to feel the structural constraint first.
  *   *The Twist:* If time permits, run a **Round 3 with Deliberation**.
      *   Allow them to talk for 5 minutes before voting on Premises.
      *   *Likely Outcome:* They will coordinate to align premises with the desired conclusion (e.g., Group B admits Fit is 'good enough' to ensure Reject, or vice versa).
      *   *Lesson:* This demonstrates **Endogeneity**. Real committees escape the paradox by changing their minds, not by solving the math.

  **Predictable Failure 3: "It's Just a Math Trick"**
  *   *Risk:* Students dismiss it as artificial.
  *   *Fix:* Your opening story. "I lived this. It wasn't a trick; it was a blind spot." The emotional weight of your chairmanship validates the simulation.

  ### 5. Honesty About Limits

  You are correct: the game cannot reproduce **Endogenous Preferences**.

  *   **The Limit:** In the game, profiles are exogenous (assigned in envelopes). In your real meeting, your colleagues' views on "Fit" were likely influenced by the knowledge of how the voting would work, or by the arguments made during the meeting.
  *   **What the Game Misses:** It misses the *persuasion* that resolves the paradox in real life. In the game, the paradox is a logical trap. In reality, it is a prompt for discussion.
  *   **How to Supply This in Debrief:**
      *   Explicitly state: "In this game, you were robots with fixed code. In my meeting, we were humans. When we realized the inconsistency (after I drew the table), we didn't stick to the vote. We reopened the discussion."
      *   **The Takeaway:** "The paradox proves that 'Majority Rule' is not a coherent concept for connected issues. It does not prove that committees are broken. It proves that committees must deliberate to align their judgments, rather than just aggregating them."
      *   **The Warning:** "However, deliberation introduces power dynamics. The person who speaks first can frame the premises to force the conclusion. The procedure protects the quiet; deliberation empowers the loud. That is the trade-off you must manage as Chair."

  ### Materials Checklist

  1.  **14 Envelopes:**
      *   5 labeled "Role A" (Yes/Yes/Admit).
      *   5 labeled "Role B" (Yes/No/Reject).
      *   4 labeled "Role C" (No/Yes/Reject).
  2.  **Voting Slips:** Two colors (e.g., White for Round 1, Blue for Round 2).
  3.  **Tally Sheet:** For your eyes only.
  4.  **Whiteboard & Cover Sheet:** To hide the logic table until the end.
  5.  **Handout:** "Committee Charter" (Instructions on voting sincerity and confidentiality).

  This design ensures they leave the room not knowing the definition of the Discursive Dilemma, but knowing exactly how it *feels* to be trapped inside it.
