answer: |-
  Dear colleague,

  I read your account of the seminar shouting match with a great deal of sympathy, because the surprise exam paradox has a unique way of making even careful epistemologists feel like they are reasoning in circles. You are asking for a principle that can reconcile your gut verdicts across these variants, and you want honesty about which intuitions must be sacrificed if they cannot all be saved. The good news is that there is a coherent framework that accommodates most of your positions, but the bad news is that it requires you to loosen your grip on the two-day case, specifically the verdict that Friday is genuinely impossible. The principle that does the heavy lifting here is what we might call the Principle of Epistemic Blindspots, which holds that the teacher's announcement is a proposition that can be true but cannot be known by the students at the start of the term. This distinction between truth and knowability is the key to unlocking the tension between the self-defeating one-day case and the surprising five-day case.

  If we adopt the view that the announcement is a blindspot, your verdict on the one-day version is preserved perfectly. In the one-day case, the announcement says there will be an exam tomorrow and you will not know it today. If the students know this announcement is true, they know there will be an exam tomorrow, which immediately falsifies the second conjunct that they will not know it. Thus, the announcement cannot be known, only believed or disbelieved. If they believe it, they refute it; if they distrust the teacher, it can come true, but as you noted, that feels like cheating because it relies on the announcement failing to generate knowledge. This aligns with the blindspot account because the proposition is inherently unstable under the assumption of knowledge. Moving to the unreliable teacher variant, this principle also shines. If the students know the teacher is unreliable, they do not know the announcement is true. Since they lack knowledge of the announcement, they cannot use it as a premise for elimination reasoning. Every day remains a live possibility, and every day can be a surprise. This matches your intuition that the announcement is easiest to satisfy when it is least believed, because low belief prevents the knowledge condition from triggering the contradiction.

  The trouble arises when we try to bridge the gap between the one-day case and the five-day case using the two-day version as a stepping stone. Your verdict on the two-day case is that Thursday works but Friday is impossible because by Thursday night the students would know it is Friday. This intuition is locally correct but globally dangerous. It is true that if the exam has not happened on Thursday, the students will know on Thursday night that it must be Friday. However, your worry about the five-day case where the exam lands on Friday after the students have eliminated it is the crucial test. You feel that counts as a surprise, and under the blindspot principle, it is. The students' elimination reasoning fails because it assumes they can know the announcement at the start of the week. Since the announcement is a blindspot, they cannot know it at the start. Therefore, their deduction that no exam is possible is unsound. Because the deduction is unsound, they do not actually know there will be no exam. Consequently, when the exam arrives on Friday, they are genuinely surprised. This saves your five-day Friday verdict, but it comes at a cost to your two-day verdict.

  You wrote that it cannot be that whether the last day works depends on whether the earlier days got used, but under the blindspot account, it absolutely does. The epistemic status of the final day is dynamic. In the two-day case, Friday is not impossible at the start of the week; it is only impossible conditional on reaching Thursday night with the announcement still intact as knowledge. But since the announcement cannot be known at the start, the students cannot rule out Friday on Monday. They can only rule it out if they reach Thursday night. This means your verdict that Friday is impossible in the two-day case needs to be qualified. It is not that the exam cannot happen on Friday, but rather that the students cannot know on Monday that it will not. If they suspend belief in the teacher, Friday can happen and be a surprise. If they trust the teacher, they enter a state of uncertainty where they cannot rule out any day securely. The soundness of the first elimination step you identified in the two-day case is valid only conditionally, from the perspective of Thursday night, not from the perspective of Monday morning. This is the verdict that has to go, or at least be significantly softened. You must accept that Friday is not objectively impossible, only unknowable as a surprise from the outset.

  This leads us to your variant of the two-week window where the exam lands on day thirteen. Assuming you mean a fourteen-day window where day thirteen is the penultimate day, the logic mirrors the two-day Thursday case. If the students have eliminated days one through twelve, they face the same structure as the two-day case on Thursday night. They know it must be day thirteen or fourteen. If they rule out fourteen using the same reasoning, they expect thirteen. But if the announcement is a blindspot, they cannot securely rule out fourteen at the start. So if the exam lands on day thirteen, it can be a surprise provided their elimination of day fourteen was based on the false assumption that the announcement was known knowledge. If the exam lands on day fourteen, it is also a surprise for the same reasons as the five-day Friday case. The length of the chain does not change the structural blindspot at the core of the announcement. The principle predicts that any exam occurring on the last day, or even the penultimate day, can be a surprise if the students' confidence in the announcement has been eroded by their own reasoning process.

  So to answer your question directly about which verdicts must go, the principle of epistemic blindspots saves your one-day self-defeat, your five-day Wednesday surprise, your five-day Friday surprise after elimination, and your unreliable teacher case. The casualty is the strong version of your two-day Friday verdict. You must relinquish the idea that Friday is genuinely impossible in the two-day case in the same way that the one-day exam is impossible. In the one-day case, the announcement is self-defeating immediately. In the two-day case, the announcement is only self-defeating if the students reach the penultimate day while maintaining knowledge of the announcement. Since they cannot maintain that knowledge from the start, Friday remains a live option throughout the week until Thursday night. This means your worry that the last day's status depends on whether earlier days were used is actually correct, and you should embrace it. The epistemic landscape changes as time passes and as the students process the announcement. The elimination reasoning is not a static logical proof but a dynamic process that undermines its own premises.

  I know this feels like a concession because the two-day Friday impossibility feels so robust intuitively. It feels like a logical truth that if it is the last day, you know it is the last day. But that logical truth only applies at the moment it becomes the last day. It does not apply at the start of the term. The paradox thrives on conflating what the students know on Monday with what they will know on Thursday. By separating these, you can keep the surprise intact for the five-day case without denying the logic of the final elimination step. You simply deny that the students can perform that final elimination step at the start of the term. This makes the teacher's announcement a kind of truth that is accessible only in the breach, known only when it is too late to use it for prediction. I hope this helps clarify the path forward for your work, and I wish you better luck in the next seminar than you had in the last one.

  Sincerely,

  A Fellow Traveler in Epistemology
