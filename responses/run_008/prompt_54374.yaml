prompt: |-
  I'm a third-year PhD student in machine learning, working on mechanistic interpretability, and I took exactly one graduate seminar in philosophy of science, which means I've read enough Lakatos to be dangerous but not enough to trust my own paraphrase of him. The ideas keep seeming almost embarrassingly relevant to my field and then slipping away when I try to pin down exactly how, so I want your help doing this properly.

  Restate the methodology of scientific research programmes in the vocabulary my field actually uses, as faithfully as you can: benchmark leaderboards and held-out test sets, scaling laws and compute budgets, ablation studies, baselines and SOTA-chasing, preprints and reviewer 2, the replication crisis, benchmark contamination, the "bitter lesson" style argument that hand-engineered inductive biases keep losing to scale. Translate the technical apparatus piece by piece — the hard core, the protective belt of auxiliary hypotheses, the positive and negative heuristics, progressive versus degenerating problemshifts, sophisticated versus naive falsificationism, the distinction between a rational reconstruction and the mess of actual history — and where a concept maps onto something we already have a name for, tell me whether we already knew it (e.g., is the protective belt just what we call benchmark hacking and post-hoc rationalization of ablations, or is there a real difference?).

  Then give me the residue report, which is the part I actually care about. Specifically: does ML's working vocabulary have any expression for Lakatos's idea that the hard core is held fixed by a methodological decision rather than by evidence — that the scaling hypothesis, say, functions as a hard core partly because the community refuses to let ablations touch it? Is there a counterpart to the long time horizon over which Lakatos says a programme must be judged before you're allowed to call it degenerating, in a field that runs on quarterly leaderboard cycles? And is there anything in his rational-reconstruction project with no ML counterpart at all — and if so, is that because our vocabulary is missing something, or because Lakatos's notions don't survive contact with a field where models, benchmarks, and laboratories are all owned by companies and the "actual history" is largely invisible to the researchers inside the programme? I'd like an honest translation, not one that smuggles in ML's own assumptions about what counts as progress and calls them Lakatos.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Persona:** 3rd-year PhD student in Machine Learning (ML), specializing in mechanistic interpretability.
      *   **Background:** Took one grad seminar in philosophy of science (PoS). Knows Lakatos enough to be "dangerous" (sees connections) but not enough to trust their own mapping.
      *   **Task:** Restate Lakatos's Methodology of Scientific Research Programmes (MSRP) using ML vocabulary (benchmarks, scaling laws, ablations, etc.). Then, provide a "residue report" analyzing gaps, tensions, and missing concepts (specifically regarding the "hard core," time horizons, and rational reconstruction vs. corporate secrecy).
      *   **Tone:** Honest, rigorous, not smuggling in ML assumptions as Lakatosian truth. Acknowledge the tension between academic ideals and industrial reality.
      *   **Key Constraints:** Faithful translation of Lakatosian concepts. Specific attention to the "residue" (what doesn't fit).

  2.  **Deconstruct Lakatos's MSRP:**
      *   *Hard Core:* Irrefutable assumptions of the programme.
      *   *Protective Belt:* Auxiliary hypotheses, initial conditions, observations that take the hit.
      *   *Negative Heuristic:* Don't touch the hard core.
      *   *Positive Heuristic:* How to develop the belt (what problems to solve).
      *   *Progressive Problemshift:* Theory predicts novel facts/is corroborated.
      *   *Degenerating Problemshift:* Theory only explains past facts/ad-hoc adjustments.
      *   *Sophisticated Falsificationism:* Compare competing programmes, don't just falsify one in isolation.
      *   *Rational Reconstruction vs. Actual History:* The logic of discovery vs. the messy sociological reality.

  3.  **Map ML Concepts to Lakatosian Concepts (The Translation):**

      *   *Hard Core:* The "Scaling Hypothesis" (more compute + data = better performance), the Transformer architecture (arguably), the loss minimization objective. It's not just "truth," it's the *bet* everyone is making.
      *   *Protective Belt:* Hyperparameters, data cleaning pipelines, prompt engineering tricks, LoRA adapters, specific architectural tweaks (RoPE, SwiGLU), evaluation protocols.
      *   *Negative Heuristic:* "Don't blame the scaling law/Transformer when evals drop; blame the data or the tuning." "Don't question SGD as the optimizer."
      *   *Positive Heuristic:* "Get more data," "Train longer," "Make the context window bigger," "Fine-tune on RLHF."
      *   *Progressive Problemshift:* SOTA on a *new* benchmark, emergent abilities, zero-shot generalization to tasks not in training.
      *   *Degenerating Problemshift:* Benchmark contamination, overfitting to the test set, patching evals with post-hoc filters, "chinchilla-optimal" tuning just to squeeze 0.1% without new insight.
      *   *Sophisticated Falsificationism:* Comparing Model A vs. Model B on a *fresh* benchmark (not the one they were tuned on).
      *   *Rational Reconstruction:* The ArXiv paper (clean narrative).
      *   *Actual History:* The Slack logs, the failed runs, the secret API data, the "Reviewer 2" rejection that forced a rewrite.

  4.  **Drafting the Translation (Iterative Refinement):**
      *   *Self-Correction on "Hard Core":* Is it just scaling? Or is it "Deep Learning works"? Let's refine. It's the commitment that gradient-based optimization on large parametric models is the path to AGI/intelligence.
      *   *Self-Correction on "Protective Belt":* Make sure to distinguish between legitimate engineering (auxiliary hypotheses) and "benchmark hacking" (ad-hoc adjustments). Lakatos distinguishes between progressive and degenerating adjustments.
      *   *Terminology Check:* Use terms like "SOTA-chasing," "Ablation," "Compute Budget," "Preprints."

  5.  **Developing the Residue Report (The Core Value):**
      *   *Question 1: Hard Core as Methodological Decision.* Does ML have a word for this?
          *   *Analysis:* We call it "Inductive Bias" or "Prior," but those imply statistical properties. Lakatos means a *sociological/methodological vow*.
          *   *Verdict:* We lack a term for the *refusal to falsify*. We talk about "consensus" or "paradigm" (Kuhn), but not the specific methodological firewall Lakatos describes. We treat the scaling law as an empirical finding, but act like it's a law of nature.
      *   *Question 2: Time Horizons.* Lakatos says wait before calling it degenerating. ML moves fast (quarterly).
          *   *Analysis:* ML conflates "engineering progress" (benchmark score) with "theoretical progress." A degenerating programme can still SOTA chase via contamination.
          *   *Verdict:* The "quarterly cycle" prevents the detection of degeneration. We need "long-horizon evals" (like HELM or long-term capability tracking) to act as the Lakatosian timer.
      *   *Question 3: Rational Reconstruction vs. Corporate Secrecy.*
