  9.  *(Final Review against User Prompt)*: Did I answer the specific residue questions?
      *   Expression for hard core as methodological decision? (No, we call it 'consensus' or 'assumption').
      *   Counterpart to long time horizon? (No, we have 'eval cycles', which are too short).
