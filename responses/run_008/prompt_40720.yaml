  You call it the tyranny of the competent; I call it the trusteeship of the civilized. The distinction lies entirely in the objective: if the rule serves the ruler, it is slavery; if it serves the ruled, it is guardianship. The Company's system was designed precisely to prevent the caprice of a single despot or the ignorance of an electorate from dictating policy. Was it a promissory note? Yes, but one redeemable not by a date on a calendar, but by the measurable progress of the subject people in security, justice, and capacity. To hand India over to the Crown was to subject it to the fluctuating passions of Parliament, where Indian welfare counts for little against English political advantage. I opposed the transfer not to perpetuate power, but to preserve the only mechanism that treated Indian governance as a serious art rather than a political football.
