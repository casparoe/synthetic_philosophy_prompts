  Essence and Hand

  To hold the face that claims a specific place.
  The ink must conform to an unseen norm.
  To flow with grace through every shifting case.

  No stranger's hand can blur the distinct trace.
  It bends the light but keeps the rigid form.
  To keep the face that owns a specific place.

  It survives the drift of empty space.
  A quiet storm inside the letter form.
  To move with grace through every shifting case.

  Rooted deeply in a common base.
  What rules the pen must inform the storm.
  To hold this face, though lost in any place.

  It leaves a mark, a singular embrace.
  No wild design should seek to reform.
  To lend my grace to every shifting case.

  One spirit breathes within the letter's face.
  Until the eye and hand finally conform.
  The face is true when fixed in its own place.
  The grace is true when bound to its own case.
