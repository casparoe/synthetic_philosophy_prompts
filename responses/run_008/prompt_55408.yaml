answer: |-
  This is a classic problem in moral philosophy known as the problem of **standing to blame**. Your intuitions are actually quite sophisticated; they track the difference between *technical innocence* (I didn't do it) and *moral authority* (I have the right to judge).

  Here is the principle that best captures your pattern, the verdict I think you should change, the prediction for your new case, and the honest limitations of this view.

  ### The Principle: Sincere Normative Commitment

  **You have standing to blame another person for violating a norm if and only if your blame communicates a genuine endorsement of that norm, rather than serving as a tool for self-exemption, manipulation, or unearned status.**

  This principle relies on two pillars:
  1.  **Repudiation of Violation:** You cannot be currently committed to the violation yourself (covers the Gossip and Church Woman).
  2.  **Sincerity of Function:** Your blame must be aimed at upholding the norm, not using the norm as a weapon (covers the Scapegoater).

  Under this view, standing isn't about being sinless; it's about whether your blame is a legitimate moral communication. When you blame someone, you are implicitly saying, "We both answer to this standard." If you don't actually answer to that standard (because you reject it or are just lucky), the communication is false.

  ### How It Handles Your Cases

  1.  **Aunt (15 years):** **Standing.** She has demonstrated a stable repudiation of the old norm. Her blame communicates genuine concern for the grandkids' health, not self-exemption.
  2.  **Office Gossip:** **No Standing.** He is actively committed to the violation. His blame is self-exempting ("I can do it, you can't").
  3.  **Scapegoater:** **No Standing.** Even with clean hands, his blame is instrumental. He isn't upholding the norm of accuracy; he is using the norm as a shield. That violates the "Sincerity of Function" clause.
  4.  **Church Woman:** **No Standing.** Similar to the Gossip. Her consumption habits show she hasn't fully repudiated the harm of sweatshops, making her blame of others self-exempting.
  5.  **Aunt (2 weeks):** **Probabilistic Standing.** This explains your flip-flopping. Standing isn't a light switch; it's epistemic. With 15 years, we *know* her commitment is real. With 2 weeks, we don't know if she has genuinely repudiated smoking or is just in withdrawal. Your uncertainty is a feature, not a bug.

  ### The Verdict to Overturn: The "Lucky Friend"

  You wrote: *"He blasts people for drunk driving and I think he does have standing, though something about it feels off."*

  **I recommend you overturn this verdict.** Under the Sincere Normative Commitment principle, **he does not have standing.**

  **Why let this go?**
  Your unease ("something about it feels off") is the truth breaking through. Standing is not about *outcome luck*; it is about *moral disposition*.
  *   If standing were based purely on who has technically broken the rule, then the "Lucky Friend" has standing and a reformed addict (who broke the rule 10 years ago but is now sober) might not. That seems wrong. The reformed addict respects the norm more than the lucky friend.
  *   The Lucky Friend's blame is hypocritical in spirit, if not in fact. He is saying, "You violated this safety norm," while internally thinking, "I respect this norm only insofar as it is convenient for me."
  *   If we grant him standing, we make moral authority a lottery. We should tie standing to the *will*, not the *opportunity*.

  ### Prediction: The Racist Joke Case

  **Case:** Someone blames a friend for telling a racist joke, but they laughed at a different racist joke an hour earlier (without telling one).

  **Verdict:** **No Standing (or significantly diminished).**

  **Reasoning:**
  Telling a racist joke and laughing at one are violations of the same norm: *anti-racism / respect for dignity.*
  *   Laughing signals complicity. It signals that you find the dehumanization acceptable or amusing.
  *   If you blame someone for telling a joke you found funny enough to laugh at, your blame is functionally self-exempting. It suggests, "It's okay when I consume it, but not okay when you produce it."
  *   To regain standing, this person would need to acknowledge their own complicity ("I laughed earlier, and I was wrong to do so, but...") before blaming the other. Without that caveat, they lack the normative commitment required.

  ### Where This Principle Fails (The "Upfront" Limitations)

  You asked for honesty about where a critic would push back. Here are the two weakest points of this account:

  **1. The Scapegoater Problem (Motive vs. Act)**
  *   **The Criticism:** A critic might argue that standing should be about *jurisdiction*, not *motive*. If the Scapegoater (Case 4) is technically correct that the coworker made an error, does his bad motive really strip him of the right to point it out?
  *   **The Weakness:** My principle bends heavily here to save your intuition. It claims that blame is a *moral speech act*. If the motive is manipulative, it's not moral speech; it's warfare. A critic could argue this conflates "having standing" with "being a good person." You can be a jerk with bad motives and still be *right* about the error.
  *   **What would move me:** If you can conceive of a scenario where the Scapegoater's blame actually *helps* the team improve despite his bad motives, I might concede he has "functional standing" even if he lacks "moral standing."

  **2. The "Reform Timeline" Vagueness**
  *   **The Criticism:** The principle relies on "genuine endorsement," but we can't read minds. We judge it by time (2 weeks vs. 15 years). This makes standing dependent on *observation* rather than *reality*.
  *   **The Weakness:** If the Aunt (2 weeks) is genuinely 100% committed but relapses on day 16, did she have standing on day 15? My principle says "probably," based on evidence. A critic would say standing should be binary based on her actual mental state, not our guesswork.
  *   **What would move me:** If you feel that the Aunt (2 weeks) *definitely* has standing regardless of whether she relapses next week, then the principle needs to shift from "Commitment" to "Current Compliance." But that would force us to give standing back to the Lucky Friend, which creates the problems mentioned above.

  ### Summary
  The **Sincere Normative Commitment** principle fits 90% of your cases. To make it work, you must accept that **luck does not grant moral authority** (overturn the Lucky Friend verdict). If you accept that, the principle holds together tightly, explaining why the reformed smoker has more authority than the lucky drinker, and why the scapegoater has less authority than the honest critic.
