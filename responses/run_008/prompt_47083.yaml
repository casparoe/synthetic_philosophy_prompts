  You're a professional philosopher who specializes in ethics, especially questions about harm, wrongdoing, and obligations to future people. Please think carefully before you answer, and start with some quick brainstorming of possible lines of attack before you commit to one, because I've been stuck on this for two weeks and my seminar friend is being insufferable about it.

  Some background first. My cousin was on a medication for a chronic condition while she and her husband were trying to conceive. Her doctor had said they should switch her to a different drug first, but between insurance delays and a move she just stayed on the original one. Their daughter was born with some joint problems from it. Her life is good overall -- she's a happy kid -- but she'll deal with this forever. At a family dinner my cousin said something like "well, at least I didn't wrong HER, since if I'd switched the medication she wouldn't exist," and my seminar friend, who overheard, declared this "actually philosophically impeccable" and wrote it up as a numbered argument, which he then made me walk through. Twice.

  (1) An act wrongs a person only if it makes that person worse off than they would have been otherwise.
  (2) Choices made around conception affect which child exists -- timing, medication, even a stressful month changes which gamete meets which gamete.
  (3) So the alternative to my cousin staying on the medication wasn't "same daughter, healthy joints"; it was "a different child" or "no child."
  (4) A child whose life is worth living isn't worse off than a different child who would have existed, or than no one.
  (5) Therefore staying on the medication didn't wrong the actual daughter.
  (6) The same reasoning applies to any identity-affecting choice: whatever we do about climate, the people alive in 2150 will owe their existence to our choices, so no matter how ruined the world we leave them, nothing we do can wrong them.
  (7) Nothing is wrong unless it wrongs someone.
  (8) So neither my cousin nor, say, a generation that tanks the climate does anything wrong to the people who result, short of creating lives not worth living.

  I hate the conclusion, especially (6), but I can't find the flawed step, and what's worse, I can't fix my first idea for fixing it. My first idea was to reject (1) and replace the "worse off than otherwise" test with a floor test: you wrong someone if you leave them below some decent minimum, even if they wouldn't otherwise exist. But my friend says this proves way too much: take two healthy 24-year-olds of modest means who know that, because of a genetic combination between the two of them, any child of theirs will have a hard but worthwhile life -- chronic pain, limited mobility, below any "decent floor." On my floor test, conceiving at all wrongs that child. And it seems crazy to say they wrong their child just by creating her, when her life is good, just not that good. Worse, my friend points out that the floor test can't even explain why my cousin's case feels different from the young couple's, since in both cases the child is below the floor because of a pre-conception choice the parents could have avoided.

  So here's what I want from you. First, tell me which step of the original argument (if any) you'd reject, and what rejecting it costs -- what other intuitions does it drag down with it? Is the flaw maybe in how the argument slides from "this specific person wasn't wronged" to "nothing was done wrong," or is that slide just premise (7) being applied honestly? Second, tell me whether my friend's "proves too much" objection to my floor test is even fair. And third, if you can see an exit I haven't considered -- some way to keep both the thought that pre-conception negligence and climate recklessness are genuine wrongs AND the thought that creating a hard but worthwhile life isn't wrong -- lay it out and tell me what it has to bite. I'd rather keep (6)'s being false than almost anything else in the argument, so if I have to pay for that preference somewhere, be honest about the price tag. Also, is there anything my cousin actually did wrong here, or only wronged some merely possible child who never existed? That last question has been nagging at me the whole time and I genuinely don't know which answer I'm hoping for.
