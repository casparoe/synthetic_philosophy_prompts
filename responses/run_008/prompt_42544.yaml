answer: |-
  This is a sharp pedagogical move. The standard "Brain vs. Circulatory" debate often devolves into a clash of intuitions because the participants haven't agreed on what work the definition is supposed to *do*. By front-loading the specification, you force the class to see that the disagreement isn't just about biology; it's about which constraints they are willing to relax.

  Here is the spec for an adequate definition of death, structured by desiderata, tensions, and the single constraint that tends to collapse the existing frameworks.

  ### The Spec: Desiderata for a Definition of Death

  An adequate definition must satisfy the following five requirements. For each, I have included the justification for why it is a structural necessity rather than a partisan preference.

  #### 1. The Ontological Clarity Requirement
  **The Spec:** The definition must explicitly state whether it is marking the death of a *human organism* (biological entity) or a *human person* (moral/psychological entity), and it must not equivocate between the two during application.
  **Why it's a requirement:** The "talking past each other" problem arises because one side often argues from biology (homeostasis, integration) while the other argues from moral status (consciousness, relationship). If a definition claims to be biological but relies on moral premises (e.g., "life without consciousness isn't human life"), it is conceptually dishonest. It must declare its ontology so we know if we are turning off a ventilator because the *body* has failed or because the *person* is gone.
  **Cases it handles:** Prevents conflating anencephalic infants (organism alive, personhood debated) with locked-in patients (organism alive, personhood intact).

  #### 2. The Strict Irreversibility Requirement
  **The Spec:** The loss of function must be *irreversible* (cannot restart spontaneously or via intervention), not merely *permanent* (will not restart because we won't intervene).
  **Why it's a requirement:** Legally and logically, death is a state you cannot come back from. If a state is reversible, the patient is in a *dying* process, not *dead*. Confusing "we won't resuscitate" with "cannot be resuscitated" risks violating the Dead Donor Rule by declaring death to facilitate the non-intervention that ensures the outcome.
  **Cases it handles:** Crucial for DCD (Donation after Circulatory Death). If the heart *could* auto-resuscitate after 5 minutes of standstill, declaring death at minute 5 relies on permanence, not irreversibility.

  #### 3. The Bedside Determinacy Requirement
  **The Spec:** The criteria must yield a binary, verifiable result at the bedside within a clinically feasible timeframe, without requiring prophecy about the future.
  **Why it's a requirement:** Medicine requires action-guiding norms. If a definition requires waiting to see if integration *might* return over weeks, it fails the ICU. If it requires complex philosophical adjudication of "personhood" during a code, it fails the trauma bay. The definition must function as a switch, not a dimmer.
  **Cases it handles:** Ensures the definition works for transplant logistics (organs degrade quickly) and family closure (ambiguity prolongs grief).

  #### 4. The Organismal Integration Requirement
  **The Spec:** If the definition claims to mark the death of the *organism*, it must identify the loss of the body's ability to function as a unified whole (homeostasis, response to stimuli, hormonal regulation), not just the loss of one organ (even the brain).
  **Why it's a requirement:** This is the biological justification for the Whole-Brain standard. If the body continues to integrate functions (wound healing, gestation, hormonal balance, temperature regulation) without the brain, the biological claim that "the organism is dead" is empirically falsified. A definition cannot claim biological death while ignoring biological life.
  **Cases it handles:** "Brain dead" pregnant women maintaining fetuses; pediatric brain-dead patients who grow and go through puberty.

  #### 5. The Dead Donor Rule (DDR) Compliance Requirement
  **The Spec:** The definition must ensure that vital organs are not removed *until* the patient is dead, and that the declaration of death does not depend on the decision to remove organs.
  **Why it's a requirement:** Public trust in transplantation relies on the principle that we do not kill patients to get their organs. If the definition of death shifts to accommodate organ viability (e.g., shortening the wait time for DCD to improve liver outcomes), the definition becomes instrumental rather than truthful.
  **Cases it handles:** Prevents the "slippery slope" where DCD wait times shrink from 5 minutes to 2 minutes to save kidneys, potentially declaring death before cessation is permanent.

  ---

  ### The Tensions: Incompatible Pairs

  You should flag these tensions early. Satisfying one desideratum often forces a violation of another. This is where the real bioethics happens.

  **1. Strict Irreversibility vs. Transplant Logistics (DDR)**
  *   **The Conflict:** True biological irreversibility often takes too long to confirm for organs to remain viable. By the time a circulatory stoppage is truly *irreversible* (cellular death), the kidneys and liver are often damaged.
  *   **The Trade-off:** To satisfy transplant logistics, we often settle for *permanence* (we won't try to restart). To satisfy strict irreversibility, we must wait longer, reducing organ utility. You cannot maximize both organ viability and strict biological irreversibility.

  **2. Ontological Clarity vs. Bedside Determinacy**
  *   **The Conflict:** Distinguishing "organism" from "person" is philosophically clean but clinically messy. A bedside test for "organismal integration" is harder than a test for "pupillary reflex." A bedside test for "personhood" is arguably impossible.
  *   **The Trade-off:** To get Bedside Determinacy, definitions often smuggle in ontological assumptions (e.g., assuming no brainstem = no organism) to avoid the hard work of proving the organism has actually died.

  **3. Organismal Integration vs. The Whole-Brain Standard**
  *   **The Conflict:** The Whole-Brain standard claims the brain is the body's integrator. However, many patients meeting Whole-Brain criteria maintain somatic integration (homeostasis, growth, infection response) via the spinal cord and endocrine system.
  *   **The Trade-off:** You must either admit the organism is biologically alive (violating the Integration Requirement) or argue that "social/mental integration" counts as "organismal integration" (violating Ontological Clarity).

  ---

  ### The Killer Constraint

  If you want to break the class out of the "Brain vs. Circulatory" stalemate, introduce this single requirement first. It is the one that creates the most friction for the most popular definitions.

  **The Requirement:** **Strict Irreversibility (The "Cannot" vs. "Will Not" Test).**

  **Why it knocks out the contenders:**
  Most definitions of death, when pressed, rely on *permanence* (the function will not return) but claim to satisfy *irreversibility* (the function cannot return).

  1.  **For Circulatory Death (DCD):** The standard 5-minute wait time is based on the empirical observation that the heart *will not* restart spontaneously after that point. However, it is not strictly *irreversible*; auto-resuscitation (the Lazarus phenomenon) is physiologically possible, just rare. If the definition requires strict irreversibility, DCD protocols are technically declaring death while resuscitation is still physically possible.
  2.  **For Whole-Brain Death:** The standard justification is that the loss of brain function is irreversible. However, if a patient is maintained on ventilation, their somatic functions continue. If "death" is the loss of the organism, and the organism is still integrating, the "irreversibility" is often contingent on the decision to *withdraw* support. If we *would* continue support, the organism persists. Thus, the irreversibility is often normative (we won't treat) rather than physiological (we can't treat).
  3.  **For Higher-Brain Death:** This definition is knocked out immediately because the loss of consciousness is clearly reversible in many cases (coma, vegetative states), and even when permanent, the *organism* remains fully reversible and treatable.

  **Pedagogical Payoff:**
  When you impose the **Strict Irreversibility Requirement**, students realize that almost all current clinical practice actually relies on **Permanence + Normative Decision-Making**.
  *   It forces the DCD proponents to admit: "We are declaring death because we *won't* resuscitate, not because they *can't* be resuscitated."
  *   It forces the Brain Death proponents to admit: "We are declaring death because the *person* is gone, even if the *organism* persists."

  This exposes the hidden premise: **We have moved from defining death as a biological fact to defining death as a moral permission to stop treating.** Once that is on the table, the "Brain vs. Circulatory" fight dissolves into the more honest "Biology vs. Personhood" debate.
