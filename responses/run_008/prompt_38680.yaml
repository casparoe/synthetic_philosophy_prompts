      *   *Is there a better term?* "Scale-Dependent Ontology"? "Effective Realism"? Stick with "Real Patterns" as the anchor, as it's the citation the user needs.

  8.  **Final Polish:** Check citations (Dennett 1991, Ladyman & Ross 2007, Batterman 2002). Ensure the distinction between the *mathematical fact* of compression and the *metaphysical status* of the pattern is clear. (The math is settled; the metaphysics is not).

  9.  *(Self-Correction during drafting)*: I need to be careful not to conflate Dennett's intentional stance with this. While related, "Real Patterns" is the specific paper. Also, make sure to mention that for some hard-nosed reductionists, *nothing* macro is real, so the user's intuition is actually a specific stance (Non-reductive physicalism or Structural Realism).

