answer: |-
  You have independently rediscovered one of the most active and contentious debates in contemporary metaphysics and philosophy of science. The specific intuition you are describing—that higher-level patterns are objective and predictive but depend on a scale of description and a tolerance for noise—is the core problem of **Special Science Ontology**.

  There is no single, universally agreed-upon noun for this, but there is a *locus classicus* paper that introduced the standard terminology, and a subsequent literature that formalized the mathematical intuition you are having.

  Here is the breakdown of the concepts, the literature, and exactly where the agreement ends and the fighting begins.

  ### 1. The Standard Term: "Real Patterns"
  The most direct mapping to your intuition is Daniel Dennett's concept of **Real Patterns**, introduced in his 1991 paper *"Real Patterns"* (reprinted in *Brainchildren*).

  **The Core Argument:**
  Dennett asks: Are beliefs real? Are they like electrons, or are they like the equator (a useful line we drew)? He argues this is a false dichotomy. A pattern is "real" if it supports **predictive leverage** that outweighs the **cost of describing it**.

  **How it fits your case:**
  *   **The Noise:** Dennett explicitly uses the example of a bitmap image. If you can compress the data of the bitmap by positing a "face" (storing the algorithm for a face + error terms) more efficiently than storing every pixel, the face is a "real pattern."
  *   **The Error Budget:** This is the crucial match. Dennett argues that a pattern is real if the "noise" (the deviation from the perfect pattern) is random. If the deviation itself has a pattern, you haven't found the *right* pattern yet. The "tolerance for error" you mentioned is the point where the cost of encoding the exceptions exceeds the savings of encoding the rule.
  *   **Objectivity:** Dennett insists these patterns are not "social constructions." If an alien civilization analyzed our economic data, they would find the same "recession" patterns, provided they used similar compression algorithms.

  **The Contested Status:**
  *   **Settled:** Almost no one in philosophy of science today denies that higher-level descriptions (recessions, faces, chess forks) are *useful*.
  *   **Contested:** Are they *ontologically robust*?
      *   **Dennett's View (Instrumentalist/Compatibilist):** To be real *just is* to be a compressible pattern. There is no "deeper" reality to check against.
      *   **The Reductionist Objection:** Hard-line physicalists argue that only the pixels (or particles) are real. The "face" is a fiction in our heads, even if it's a useful one. They argue Dennett confuses *epistemology* (how we know) with *ontology* (what exists).
      *   **The Realist Upgrade:** James Ladyman and Don Ross (see below) argue Dennett didn't go far enough. They claim the patterns are *more* real than the particles.

  ### 2. The Metaphysical Upgrade: "Ontic Structural Realism"
  If you want to push back against the idea that these patterns are "less real" than electrons, you need **Ontic Structural Realism (OSR)**, specifically the version defended by **Ladyman and Ross** in their 2007 book *Every Thing Must Go: Metaphysics Naturalized*.

  **The Core Argument:**
  They adopt Dennett's "Real Patterns" but strip away the instrumentalism. They argue that the universe is not made of "things" (particles) that have relations; it is made of **structures** (patterns of relations).
  *   **The Electron:** An electron is just a stable node in a quantum field structure.
  *   **The Recession:** A recession is a stable node in an economic transaction structure.
  *   **The Comparison:** Neither is "fundamental" in the old sense. Both are real patterns. The recession is not "less real" than the electron; it is a pattern at a different scale of the same structural reality.

  **Where it fits your case:**
  This captures your intuition that the pattern is "genuinely out there." For Ladyman and Ross, if a pattern supports counterfactual reasoning (e.g., "If interest rates rise, the recession deepens"), it is ontologically legitimate, regardless of whether it reduces cleanly to particles.

  **Where it runs out:**
  OSR is a heavy metaphysical commitment. It requires accepting that "objects" are secondary to "structures." If you just want to talk about data analysis without buying into a specific metaphysics of the universe, this might be overkill. Also, OSR is highly contested by standard realists who believe particles *are* the fundamental building blocks.

  ### 3. The Mechanism: "Coarse-Graining" and "Renormalization"
  You mentioned granularity specifically. In philosophy of physics, this is handled by the concept of **Coarse-Graining**, often discussed in the context of the **Renormalization Group (RG)**. Key figures here include **Robert Batterman** (*The Devil in the Details*, 2002) and **Margaret Morrison**.

  **The Core Argument:**
  Physics shows us that macroscopic laws (like fluid dynamics) are *insensitive* to microscopic details. You can change the shape of individual water molecules, and the flow of the river remains the same.
  *   **Universality:** Different micro-structures can produce the exact same macro-pattern. This explains why the "pattern" is real even if the underlying "pixels" change.
  *   **The Grain:** The pattern only exists *relative to a scale*. At the atomic scale, "fluid flow" disappears. At the human scale, it is the most real thing in the world.

  **Where it fits your case:**
  This provides the mathematical backbone for your "granularity" intuition. It explains *why* the pattern emerges: because the noise averages out at a specific scale.

  **Where it runs out:**
  This is mostly used in philosophy of physics. Applying it to "recessions" or "chess forks" requires an analogy that some philosophers find strained. Not everyone agrees that economic systems behave like thermodynamic systems regarding renormalization.

  ### 4. The Mathematical Formalization: "Minimum Description Length"
  While not a philosophical term per se, the logic you are describing is formally captured by **Minimum Description Length (MDL)** principle and **Kolmogorov Complexity**.

  *   **The Definition:** The "best" pattern is the one that minimizes the length of the description of the data (Model + Error).
  *   **The Edge Case:** This solves your "arbitrary wiggly line" problem. If you fit a polynomial of degree $N$ to $N$ points, the error is zero, but the model complexity is maximal. MDL penalizes this. The "real" pattern is the sweet spot where model complexity + error complexity is minimized.
  *   **Philosophical Status:** Many philosophers of science (including Dennett and Ladyman) treat MDL as the objective criterion for "Real Patterns." However, there is debate over whether MDL selects for *truth* or merely for *predictive utility*.

  ### Summary of the Landscape

  | Concept | What it captures | What it misses / Contested | Key Source |
  | :--- | :--- | :--- | :--- |
  | **Real Patterns** | The balance of predictive power vs. descriptive cost. Objectivity without fundamentalism. | Some argue it's too instrumentalist (makes patterns depend on an observer's compression algorithm). | Dennett (1991) |
  | **Ontic Structural Realism** | The claim that these patterns are *ontologically* robust, not just useful fictions. | Highly contested metaphysics. Rejects "thing-ontology." | Ladyman & Ross (2007) |
  | **Coarse-Graining** | The mechanism of granularity. Why noise disappears at scale. | Mostly limited to physics contexts; analogy to social data is debated. | Batterman (2002) |
  | **Conceptual Relativity** | The idea that different "carvings" of the world can be equally valid. | Often leans too close to social constructionism for your taste. | Putnam (1980s) |

  ### The Verdict: Is there a name?

  If you want to be precise and signal familiarity with the literature, you should call these **Scale-Relative Real Patterns**.

  *   **"Real Pattern"** signals you accept Dennett's criterion (compression + prediction = reality).
  *   **"Scale-Relative"** signals you accept the coarse-graining insight (the pattern vanishes or changes at different granularities).

  **The Honest Answer on Consensus:**
  There is **no consensus** that these entities are "real" in the same way an electron is real.
  1.  **Eliminativists** say only the micro-pixels are real; the rest is user-interface fiction.
  2.  **Non-Reductive Physicalists** say the patterns are real but depend on the micro-level.
  3.  **Structural Realists** (Ladyman/Ross) say the patterns are the *only* things that are real, including electrons.

  However, there **is a consensus** (mostly post-2000s) that "useful fiction" is a bad category for this. The middle ground you are sensing—that something can be objective, predictive, and discoverable without being fundamental—is the standard working position of most philosophers of the special sciences (biology, economics, psychology).

  ### Edge Cases for Your Definition
  If you adopt "Scale-Relative Real Pattern," watch out for these two edge cases:

  1.  **The "Gerrymander" Problem:** I can always find a pattern if I allow the description language to be complex enough. (e.g., "The pattern is: exactly these pixels are on.")
      *   *Solution:* You must specify that the *language* of description is constrained (e.g., standard economic indicators, standard image recognition filters). This is the "conceptual scheme" constraint (Putnam).
  2.  **The "Observer" Problem:** Does the pattern exist if no one compresses the data?
      *   *Solution:* Dennett and Ladyman argue yes. The *compressibility* is a fact about the data, not the compressor. If the data *would* compress if an agent tried, the pattern is real. This is a modal claim (about possibilities) which some empiricists find suspicious.

  ### Recommendation for Your Vocabulary
  Stop looking for a noun that implies "fundamental existence." Instead, use the adjectival phrase **"Robustly Compressible."**

  When you say, "This recession is a **robustly compressible pattern** at the quarterly granularity," you are making a claim that:
  1.  It is objective (any compressor would find it).
  2.  It is scale-dependent (it might vanish at the daily granularity).
  3.  It is real (it supports prediction), without claiming it is a fundamental particle.

  This phrasing avoids the metaphysical trap of "Is it *really* real?" while preserving the scientific intuition that you are discovering something out there, not inventing it.
