answer: |-
  The practice of legal age cutoffs is philosophically underdetermined and strictly requires no specific theory of vagueness, though it functions most coherently under a conventionalist view that treats legal boundaries as stipulative constructs rather than discoveries of natural facts. None of the three candidate theories is strictly required because the law is a normative institution capable of imposing operational rules regardless of the underlying semantic metaphysics; however, the practice fits best with Conventionalism because the statute explicitly defines the term "adult" for legal purposes, bypassing the natural language predicate entirely. It is philosophically underdetermined because an Epistemicist could view the statute as a pragmatic proxy for an unknown true boundary of maturity, and a Supervaluationist could view it as selecting one admissible precisification from many to resolve indeterminacy for administrative utility.

  The persistence of residue vagueness regarding midnight or time zones does not demonstrate that law cannot sharpen predicates, but rather that sharpening is recursive and systemic. This tells us that legal precision relies on a framework of other stipulated definitions; when those run out, vagueness remains unless further stipulated. This supports the Conventionalist view that precision is manufactured by a system of rules that terminates where the legislature decides, whereas an Epistemicist would have to maintain there is a fact of the matter about the exact moment of birth that the law might misidentify. The residue indicates that law sharpens predicates relative to a defined framework, not absolutely against nature.

  The coexistence of bright lines and open textures elsewhere in the legal system is consistent and does not presuppose rival views of vagueness, but rather reflects competing normative values: predictability versus individualized justice. A single theory of vagueness can accommodate both; for instance, a Supervaluationist can accept that some contexts demand a selected precisification (age) for efficiency while others tolerate the penumbra (reasonableness) for fairness. The tension is pragmatic and normative, not semantic, meaning the system does not need to switch metaphysical commitments to switch legal standards.

  If the practice presupposed Epistemicism, the statutory line could be criticized as factually incorrect based on empirical evidence of maturity, shifting litigation toward scientific testimony about the "true" age of responsibility. Under Supervaluationism or Conventionalism, criticism is limited to policy grounds (unjust, arbitrary, or outside the range of admissible precisifications) because the line is either a selected precisification or a created rule, neither of which can be "false" in a descriptive sense. Currently, the system operates largely on Conventionalist grounds, treating the age as constitutive, which insulates the statute from claims that it misidentifies a natural boundary.

  It is settled among philosophers of vagueness that there is no consensus on which theory correctly describes natural language, and it is settled in legal philosophy that legislatures have the authority to stipulate definitions. It is genuinely contested whether vague predicates possess sharp boundaries unknown to us (Epistemicism) or lack truth conditions entirely within a penumbra (Supervaluationism), and consequently contested whether a legal stipulation eliminates vagueness or merely suppresses it for administrative purposes.
