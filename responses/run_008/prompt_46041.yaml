prompt: |-
  I'm a sixth-form student who has spent the past several months reading everything I can find about the self-sampling assumption and the self-indication assumption in anthropic reasoning, originally because of an argument with a friend about the Sleeping Beauty problem, and I've noticed something that puzzles me more than the problem itself: the debate appears to have been going on for decades with essentially the same moves on each side and no convergence whatsoever. As far as I can tell, the two camps agree on all the ordinary facts, agree on Bayesian conditioning, and yet divide cleanly on cases. Those on the self-sampling side typically say Beauty should answer one half, treat the doomsday argument with some seriousness, and refuse to be impressed by the presumptuous philosopher — the thought experiment where two theories make identical predictions about physics but one posits vastly many more observers, and you are somehow asked to prefer the larger-world theory merely because you'd more likely exist under it. Those on the self-indication side give the mirror-image verdicts on all three. What strikes me is that the disagreement seems to survive every attempt to pin it down, and I've even seen the suggestion that the two assumptions are just the same machinery with different reference classes, which would make part of the fight merely verbal. My own working hypothesis, offered only as a hypothesis, is that the real fault line is about whether one's own existence counts as ordinary evidence to be conditioned on in the usual way, or is something structurally odd — evidence that every version of you would necessarily possess, and therefore perhaps not evidence at all. So: what kind of disagreement is this, really? Is it substantive, verbal, a hidden disagreement about reference classes, or two questions travelling under one name? Please diagnose it using what each side actually claims, say what would count as progress given your diagnosis — a distinction, a formal result, a new thought experiment that splits the intuitions — and be explicit about how confident you are in each of your claims, singling out the point on which you feel least sure.
