          *   Condo vs. State: Condos are voluntary associations (you can move), but high exit costs make them quasi-political.
      *   **The Bias Check:** Be direct. If tenants vote, ban likely passes. Opposing their vote helps the opposition (investors/developer). Is the "principle" a shield for strategy?
      *   **The Table:** Fill in based on the analysis.
      *   **Bottom Line:** Clear recommendation.

  8.  **Refining the Argument (Self-Correction during drafting):**
      *   *Initial thought:* Maybe tenants should vote.
