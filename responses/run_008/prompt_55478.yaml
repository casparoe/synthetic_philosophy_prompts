          5.  Provide a specific table (Group, Stake, Case For, Case Against, Verdict).
          6.  Provide a one-line bottom line recommendation.

  2.  **Deconstruct the Scenario & Groups:**
      *   *Current Owners (Occupant):* User's group. Want ban. Live there. Own equity.
      *   *Current Owners (Investor/Non-Resident):* 1/3 of units. Some do STR, some want ban for value. Own equity. Don't live with daily nuisance.
      *   *Current Tenants:* 35 units. Live with nuisance. No equity. No vote.
      *   *Developer:* 18 unsold units. Wants to sell. No long-term stake in community stability, short-term stake in marketability.
      *   *Future Owners:* Will inherit bylaws. No current stake.
      *   *Neighbors/Community:* Guest parking issues, noise spill-over. Externalities.
      *   *Staff/Management:* Deal with the mess. Employment stake.
      *   *Adult Children of Owners:* Emotional stake, maybe future inheritance.

  3.  **Philosophical Frameworks (Democratic Theory):**
      *   *Property Rights (Lockean/Classical Liberal):* Voting belongs to those who bear the financial risk/ownership. The condo is a private corporation, not a state.
      *   *All-Affected Principle (Dahl):* Everyone affected by a decision should have a say. This supports tenants and neighbors.
      *   *All-Subjected Principle:* Everyone subject to the coercion of the rule should have a say. Tenants are subject to house rules.
      *   *Stakeholder Theory:* Distinguishes between shareholders (owners) and stakeholders (tenants, staff).
      *   *Contractualism:* You agreed to the bylaws when you bought/leased. Changing them requires the consent of the contracting parties (owners).

  4.  **Addressing the "Boundary Problem" (The User's Concern):**
      *   The user asks: "Why not the developer's sales agents? Adult kids? People across the street?"
      *   *Philosophical Answer:* We need a criterion of *directness* and *intensity* of impact, coupled with *authority*.
      *   Tenants are *subjects* of the rules daily. Neighbors are affected by externalities but not subjects of the internal governance. Adult kids have no current legal or phenomenological stake.
      *   The line is usually drawn at *residency* (subjected to coercion) or *ownership* (bearing financial risk).

  5.  **Addressing the User's Bias:**
      *   The user is an owner-occupant wanting the ban.
      *   Expanding the vote to tenants likely helps the ban (tenants hate STRs).
      *   Excluding investors hurts the ban (some investors like STRs).
      *   Excluding the developer helps the ban.
      *   *Honesty Check:* Is the user rigging it? Yes, potentially. If tenants vote, the ban likely passes easier. If the user opposes tenant voting because "it's slippery slope," is that principled or strategic? It needs to be interrogated.

  6.  **Developing the Position:**
      *   *Condo vs. Country:* A condo is a hybrid. It's a private property association (contractual) but functions like a micro-state (governance, coercion, shared resources).
      *   *Principle:* The "All-Subjected Principle" is stronger here than pure property rights because the rules govern *behavior* and *living conditions*, not just asset management. However, financial liability rests with owners.
      *   *Compromise:* Owners must vote because they hold the title and liability. *However*, tenants should have a formalized consultative role because they are the primary subjects of the *quality of life* regulation.
      *   *Developer:* They are owners. They get a vote, but their conflict of interest is high.
      *   *Future Owners:* Cannot vote, but bylaws should have high thresholds to protect them from transient majorities.

  7.  **Drafting the Content - Section by Section:**

      *   **Introduction:** Acknowledge the complexity. It's a classic "boundary problem" in democratic theory.
      *   **Brainstorming Groups:** List everyone identified above + Staff + Lenders (banks hold mortgages).
      *   **The Principled Argument:**
          *   Distinguish between *Ownership* (financial risk) and *Occupancy* (lived experience).
