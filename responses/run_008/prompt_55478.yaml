      *   *Bias Check:* I need to be careful not to just tell the user what they want to hear (ban passes). I need to challenge their reluctance on tenants.

  9.  **Final Polish:**
      *   Ensure tone is philosophical but practical.
      *   Check all constraints (Table columns, specific verdicts, one-line bottom line).
      *   Make sure the "Bias" section is sharp.

  10. **Final Review against constraints:**
