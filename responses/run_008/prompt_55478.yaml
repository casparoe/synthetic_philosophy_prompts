answer: |-
  This is a classic instance of what democratic theorists call the **"Boundary Problem"** (or the *demos* problem): before you can decide *how* to vote, you must decide *who* constitutes the "people" entitled to vote. In a nation-state, this is usually solved by citizenship or residency. In a private community like a condo, it is solved by deed ownership. But as you've noticed, the moral weight of those categories doesn't always align with the impact of the decision.

  Here is the breakdown of the stakeholders, the philosophical analysis, and the hard truth about your own position.

  ### 1. Brainstorming the Claimants
  Let's cast a wide net to identify every group with a plausible claim to influence this decision:

  1.  **Owner-Occupants:** You and your neighbors. You hold title and reside there.
  2.  **Owner-Investors:** Hold title, do not reside. Some profit from STRs, some prioritize long-term value.
  3.  **Long-Term Tenants:** Reside there, do not hold title. Directly impacted by nuisance.
  4.  **The Developer:** Holds title to unsold units. Motivated by sales velocity, not community stability.
  5.  **Future Owners:** Do not exist yet (or haven't bought). Will be bound by the new bylaws.
  6.  **Immediate Neighbors (Non-Residents):** People in the surrounding neighborhood. Impacted by noise/parking overflow.
  7.  **Building Staff:** Property manager, concierge, maintenance. Their workload and safety are impacted.
  8.  **Mortgage Lenders:** Banks hold the financial risk. STR bans can affect unit valuation and insurability.
  9.  **Adult Children of Owners:** Potential heirs. Emotional attachment, but no current legal or lived stake.
  10. **Short-Term Guests:** The Airbnb users themselves. They are the "consumers" of the policy, but transient.

  ### 2. The Principled Argument: Who Should Vote?

  To draw a line, we must choose a principle of legitimacy. There are two competing frameworks here:

  **A. The Proprietary Model (The "Shareholder" View)**
  *   *Logic:* A condo corporation is essentially a private business association. Voting rights attach to capital risk. If the building's value tanks, the owner loses equity; the tenant just moves.
  *   *Implication:* Only owners vote. Tenants are customers of the owners, not members of the corporation.
  *   *Weakness:* It ignores that condo bylaws govern *behavior* and *bodily security* (noise, safety, privacy), not just asset management.

  **B. The All-Subjected Principle (The "Citizen" View)**
  *   *Logic:* Democratic legitimacy requires that everyone subject to the coercive power of a rule should have a say in making it. Tenants are subject to the same security checks, noise rules, and lobby surveillance as owners.
  *   *Implication:* Tenants should vote.
  *   *Weakness:* It violates the property rights of the landlord, who legally stands between the tenant and the corporation.

  **My Position:**
  The condo is a **hybrid entity**. It is a property regime, but it functions as a micro-polity. Therefore, the voting right must remain with **Owners**, because they hold the ultimate financial liability and the title. However, the *legitimacy* of the vote is compromised if the people bearing the brunt of the daily coercion (tenants) are silenced.

  **The Line in the Sand:**
  You asked where to stop if you let tenants vote. The principled line is **Legal Residency + Direct Subjection to Enforcement.**
  *   **Tenants:** Yes, they are subjected to the rules daily.
  *   **Neighbors across the street:** No. They are affected by *externalities* (noise), but they are not *subjects* of the building's governance. They cannot be fined by your board; they are not bound by your bylaws.
  *   **Developer's Agents:** No. They are employees, not residents or owners.
  *   **Adult Children:** No. They are not currently subjected to the rules.

  **Condo vs. Country:**
  The logic is similar but the stakes differ. In a country, exit is hard (immigration laws, cost). In a condo, exit is theoretically easier (move out), but transaction costs (selling a home) are high enough to make "just leaving" an insufficient defense against bad governance. This makes the condo more like a state than a simple contract. However, because the condo is fundamentally a property arrangement, you cannot sever the vote from the deed without breaking the legal chain of title.

  **The Verdict on Voting:**
  Owners must vote to change the bylaws (legally, they likely *must* be the ones). However, to make the decision morally binding, the process should include a **mechanism for tenant input** that is more than just a suggestion box.

  ### 3. The Honesty Check: Are You Rigging the Electorate?

  You asked me to be straight. **Yes, there is a high probability you are engaging in motivated reasoning.**

  Here is the math:
  *   **You (Owner-Occupant):** Want the ban.
  *   **Tenants (35 units):** Almost certainly want the ban (they suffer the nuisance without the profit).
  *   **Investors (40 units):** Split. Some want STR income, some want stability.
  *   **Developer (18 units):** Against the ban (wants marketability).

  If you exclude tenants, you exclude 35 votes that would likely align with *your* preference. If you argue against tenant voting on "principled" grounds (slippery slope), but accepting their votes would help your side win, you are using principle as a shield for strategy.

  However, there is a counter-strategy: If you *include* tenants, you might galvanize the Investor bloc to vote *against* you more aggressively, viewing it as a hostile takeover of their property rights.

  The "Slippery Slope" argument you raised ("Why not the neighbors?") is a valid philosophical concern (the *reductio ad absurdum*), but in this specific context, it often serves as a convenient excuse to maintain a status quo that benefits owners at the expense of residents. The line *is* defensible (Residency + Subjection), so dismissing it entirely looks suspicious.

  ### 4. Stakeholder Analysis Table

  | Group | What's at stake for them | Strongest case for giving them a vote | Strongest case against | Verdict |
  | :--- | :--- | :--- | :--- | :--- |
  | **Owner-Occupants** | Quality of life, property value, community stability. | They bear financial risk and live with consequences. | None. This is the baseline. | **Vote** |
  | **Owner-Investors** | Rental income potential, long-term asset value. | They hold title and bear financial liability. | They do not experience the daily nuisance they may create. | **Vote** |
  | **Long-Term Tenants** | Safety, sleep, privacy, enjoyment of home. | They are the primary subjects of the rule's enforcement and impact. | They have no financial equity at risk; landlord stands as proxy. | **In between** (Binding consultation) |
  | **The Developer** | Sales velocity, marketing flexibility for unsold units. | They are legal owners of the 18 unsold units. | Conflict of interest: short-term sales vs. long-term community health. | **Vote** (But disclose conflict) |
  | **Future Owners** | Inheritance of bylaws, resale value, ability to rent. | They will be bound by the decision for years. | They do not exist yet; cannot represent their own interests. | **No vote** |
  | **Immediate Neighbors** | Parking availability, noise spill-over, street congestion. | They suffer negative externalities without compensation. | They are not part of the private contract/property regime. | **No vote** |
  | **Building Staff** | Workload, safety, job security. | They enforce the rules and deal with the fallout (trash, security). | They are employees, not members of the association. | **No vote** |
  | **Mortgage Lenders** | Collateral value, insurability of the building. | STR bans can affect insurance and valuation. | They are creditors, not governance participants. | **No vote** |
  | **Adult Children** | Future inheritance, emotional connection. | They may inherit the unit and be bound later. | No current legal or phenomenological stake. | **No vote** |

  ### 5. Bottom Line

  **Hold the vote under the current rules (owners only), but formally poll the tenants and publish their results to all owners before the ballot is cast.**

  *Reasoning:* Changing the voting eligibility now likely violates your existing bylaws and could invite lawsuits that stall the ban indefinitely. However, ignoring the tenants undermines the moral legitimacy of the decision. A formal, publicized tenant poll puts moral pressure on the Investor owners to recognize that their tenants (their customers) are unhappy, without breaking the legal framework of property ownership.
