answer: |-
  # Diagnostic Instrument: Which theory of exploitation do you actually hold?
  **And is alienation doing any independent work for you?**

  **Instructions:** For each scenario, select the **one** option that best matches your intuitive verdict. Do not overthink; choose the answer that feels most correct to you. There are no "right" answers; this is a map of your own commitments.

  **1. The Independent Artisan**
  A potter owns her own clay and tools. She works alone, makes a comfortable living, and sells her pots at the going market rate. A wealthy merchant buys the pots and resells them abroad for a massive profit, far more than the potter earns. The potter is not in debt and is free to stop selling to the merchant.
  *   **A.** This is not exploitation; the potter owns her work and agrees to the price.
  *   **B.** This is exploitation; the merchant gains wealth solely by capturing value the potter created.
  *   **C.** This is exploitation only if the merchant used monopoly power to force the price down.

  **2. The "Better" Sweatshop**
  A factory pays wages significantly higher than the local farming jobs. Workers choose the factory voluntarily over farming. However, the global system is rigged so that their country remains poor, leaving them no real alternative to low-wage labor.
  *   **A.** Not exploitation; the workers are better off than they would be otherwise.
  *   **B.** Exploitation; the background injustice makes the choice involuntary, even if no force is used.
  *   **C.** Exploitation; the owner profits from labor that should belong to the workers, regardless of the wage level.

  **3. The Desperation Loan**
  A person facing bankruptcy accepts a loan with harsh terms to save their home. The lender did not cause the bankruptcy but knows the borrower has no other options. The lender profits significantly from the interest.
  *   **A.** Not exploitation; it is a consensual contract between adults.
  *   **B.** Exploitation; taking advantage of someone's desperation is wrongful, even if voluntary.
  *   **C.** Not exploitation, but it is charitable to offer better terms.

  **4. The Asset Equality Test**
  Imagine all productive property (factories, land, capital) were divided equally among everyone. In this new world, a CEO would be poorer than she is now, but a janitor would be only slightly richer. Who is exploited in the *current* system?
  *   **A.** The janitor is exploited; she would be better off under equal division.
  *   **B.** The CEO is exploited; she works harder but would lose the most under equal division.
  *   **C.** Neither; exploitation depends on how they are treated day-to-day, not hypothetical property splits.

  **5. The Democratic Cooperative**
  Workers own a company together. They vote democratically on all decisions. To survive market competition, they vote to intensify their own labor and lay off 10% of their friends.
  *   **A.** Not exploitation; they are their own bosses and consent to the rules.
  *   **B.** Exploitation; the market forces them to act against their own interests, even if they vote on it.
  *   **C.** Exploitation of the laid-off workers by those who remain.

  **6. The Wealthy Heir**
  A person inherits a vast trust fund. They never work, live comfortably on the returns, and have no involvement in the companies generating the profit.
  *   **A.** This is exploitative; they consume value produced by others without contributing labor.
  *   **B.** Not exploitative; the property was legally transferred, and they own the assets.
  *   **C.** Not exploitative, but socially undesirable.

  **7. The Unpaid Partner**
  One spouse works for wages; the other cooks, cleans, and cares for children full-time without pay. The working spouse controls the household income.
  *   **A.** This is exploitative; domestic labor produces value that is appropriated by the wage-earner.
  *   **B.** Not exploitative; this is a private family arrangement, not an economic exchange.
  *   **C.** Exploitative only if the domestic partner wants to work for wages but is prevented from doing so.

  **8. The Contented Specialist**
  A worker is paid the full value of what she produces. She loves her tasks, understands the whole process, and feels no hostility toward her employer. She is not free to leave without significant loss, but she doesn't want to.
  *   **A.** She is alienated; the structure of wage labor separates her from her human nature regardless of her feelings.
  *   **B.** She is not alienated; she finds meaning and fulfillment in her work.
  *   **C.** She is exploited, but not alienated; the pay structure is wrong, but her experience is fine.

  **9. The Miserable Smallholder**
  A farmer owns his land and tools. He has no boss and keeps all his profit. However, the work is crushing, lonely, and meaningless, and he feels disconnected from what he makes.
  *   **A.** He is alienated; his work fails to allow for self-realization, even without a boss.
  *   **B.** He is not alienated; alienation requires a capitalist employer to estrange you from your work.
  *   **C.** He is unhappy, but "alienation" is the wrong word for this.

  ***

  ## Scoring Key & Diagnostic Profiles

  **Do not tally points.** Look for the *pattern* of your verdicts. Your profile indicates which underlying commitments drive your judgments.

  ### Axis 1: Theories of Exploitation
  *   **The Labor-Theoretic View:** You likely chose **1B, 2C, 6A, 7A**. You see exploitation as the extraction of effort/value from a direct producer by a non-producer. If labor creates the value, keeping the surplus without working is exploitation.
  *   **The Property-Relations (Unequal Exchange) View:** You likely chose **1B, 4A, 6A**. You focus on the distribution of assets. If unequal ownership of tools/land allows one party to capture value from another (even without a wage relation, as in Q1), it is exploitation.
  *   **The Force/Transfer View:** You likely chose **2B, 3B, 5B**. You focus on vulnerability. If a transaction happens because one party is desperate or backed into a corner (by background conditions or market pressure), the transfer is wrongful, regardless of property rights.
  *   **The Distributive Background View:** You likely chose **2B, 4A, 5B**. You believe transactions cannot be judged in isolation. If the starting gate is unfair (Q2, Q4), the resulting exchanges are tainted, even if consensual.
  *   **The Mutual-Advantage/Voluntariness View:** You likely chose **1A, 2A, 3A, 5A, 6B**. You hold that if there is no force or fraud, and both parties benefit relative to their baseline, the exchange is morally clean. "Exploitation" is a misleading label for mutually beneficial trade.

  ### Axis 2: Theories of Alienation
  *   **The Reductionist View:** You likely chose **8B, 9B**. You believe alienation is merely a symptom of exploitation. If there is no exploiter (Q9) or if the worker is content (Q8), alienation cannot exist.
  *   **The Independent View:** You likely chose **8C, 9A**. You believe exploitation and alienation can come apart. One can be exploited but happy (Q8), or free but alienated (Q9).
  *   **The Essentialist View:** You likely chose **8A**. You believe alienation is a metaphysical estrangement from "human nature" or "species-being" inherent in certain social structures, regardless of subjective satisfaction.
  *   **The Self-Realization View:** You likely chose **9A, 8B**. You focus on the psychological experience of meaningful engagement. If work is crushing/meaningless (Q9), it is alienating; if it is fulfilling (Q8), it is not.

  ***

  ## Instructor's Notes

  ### 1. Limits of the Instrument
  This quiz cannot cleanly separate the **Force/Transfer View** from the **Distributive Background View**. Both will condemn the sweatshop (Q2) and the loan (Q3). To distinguish them, you would need a case where background justice is perfect, but one party is still temporarily vulnerable (e.g., a sudden accident in a just society). The Background theorist might say "no exploitation," while the Force theorist might say "exploitation due to temporary desperation."
  Similarly, the **Labor-Theoretic** and **Property-Relations** views often align on wage labor (Q2) but diverge on the Artisan (Q1). If a student answers inconsistently here, they may be conflating "unfair trade" with "surplus extraction."

  ### 2. Unoccupied Cells
  Certain combinations of verdicts are theoretically unstable or unoccupied in the literature:
  *   **The "Heir is Exploited" Cell (Q4B + Q6A):** Very few argue that the wealthy are the primary victims of exploitation while simultaneously arguing domestic labor is exploitative. This combination suggests a confusion about the direction of value transfer.
  *   **The "Essentialist Reductionist" (Q8A + Q9B):** Claiming the happy wage-worker is alienated due to human nature, but the miserable independent farmer is *not*, is incoherent. If alienation is about estrangement from essential nature, the farmer's disconnection from his product should count.
  *   **The "Voluntarist Alienationist" (Q2A + Q9A):** Claiming the sweatshop is *not* exploitative (because it's voluntary) but the independent farmer *is* alienated (because it's meaningless) is a rare libertarian-humanist hybrid. It is not incoherent, but it is uncommon; it treats economic justice and psychological well-being as entirely separate spheres.

  *Pedagogical Tip:* Use the "Unoccupied Cells" to challenge students in the second session. Ask those who fall into them to defend why their combination isn't a contradiction. This forces them to refine their definitions before reading the assigned texts.
