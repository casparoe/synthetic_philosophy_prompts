  *Wait, one more thing:* The user asked "which should I prioritize?" regarding the *questions*. So the output must be a list of questions, ranked.
  1. Can the deceived part access the evidence? (Epistemic Access)
  2. Is the mechanism partitioning or bias? (Structural Mechanism)
