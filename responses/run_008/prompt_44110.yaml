          *   *Analysis:* This is the Breiman (1961) result / Law of Large Numbers for log wealth. It holds asymptotically (as $n \to \infty$). It compares Kelly to other *fixed fraction* strategies. It does *not* compare to all possible strategies (e.g., dynamic strategies, or strategies that stop betting). It says Kelly maximizes the asymptotic growth rate.
