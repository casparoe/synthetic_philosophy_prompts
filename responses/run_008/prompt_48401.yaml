  ### Goldhagen, translated
  Goldhagen argues the German population underwent specific fine-tuning where eliminationist antisemitism was the primary loss function. The model architecture isn't generic; it's specialized. When deployed (the Holocaust), the output isn't a bug caused by external pressure; it's a feature of the weights. The environment doesn't rewrite the model; it merely triggers the existing logic. Variance in behavior is noise; the mean prediction is violence. The "German model" possesses a unique internal state that generalizes poorly to moral universals but perfectly to the task of extermination. It's a claim about pre-training data dominance: the cultural corpus so overwhelms the base human architecture that inference is deterministic regardless of contextual constraints. This treats culture as frozen weights, implying stability across different inference environments.

  ### Browning, translated
  Browning posits a universal human base model. The Reserve Police Battalion 101 represents a severe distribution shift from peacetime to killing fields. The behavior emerges from hyperparameters set by the environment: authority gradients, peer loss functions, and gradual habituation (curriculum learning). The weights aren't uniquely German; any model deployed in this context converges on similar outputs. The system optimizes for social survival, not ideological alignment. The "killing" output is a local minimum found via gradient descent under extreme coercive pressure. It's a claim about context dominance: the inference environment overrides initial weights, forcing convergence through reward hacking (career safety, peer approval) rather than internal belief. Any standard model, subjected to this specific training loop, produces the same catastrophic failure mode.

  ### What translates, what distorts, what's inexpressible
