answer: |-
  In adjudicating these two cases, we are not merely solving puzzles but testing the boundaries of what it means to act rationally. The Counterfactual Mugging and the XOR Blackmail present scenarios where the causal consequences of an act seem divorced from its evidential significance or its logical implications. To navigate them, we must distinguish between the settled mechanics of the cases and the contested principles of decision theory. It is settled fact in both stipulations that certain events are past and fixed: the coin has landed tails in the mugging, and the letter has arrived in the blackmail. It is contested, however, whether a rational agent should treat their current choice as independent of those past facts, or as logically correlated with them via the predictor's accuracy or the blackmailer's policy.

  To clarify the stakes, we can reconstruct how three distinct decision-making frameworks would approach these stipulations. First, consider the agent who focuses solely on causal consequences. This agent asks: "What physical changes does my act produce from this moment forward?" In the mugging, the money is already gone; handing over $100 causes a net loss with no causal power to retrieve the $10,000. Thus, this agent refuses. In the blackmail, the letter is present. The stipulation states that paying closes the matter, while refusing releases the dossier. Since paying causally prevents career destruction, this agent pays. This framework yields the intuitive pair: refuse the mugging, pay the blackmail.

  Second, consider the agent who focuses on evidential correlations. This agent asks: "What does my choice tell me about the state of the world?" In the mugging, paying is evidence that the predictor forecasted compliance, which is evidence that the coin landed heads and the $10,000 was deposited. Thus, this agent pays. In the blackmail, paying is evidence that the agent is the "paying type." Given the XOR rule (Letter iff Pay XOR Dossier), if the agent is the paying type and receives a letter, logic dictates no dossier exists. Paying is thus evidence of safety. This agent also pays. This framework yields a consistent but costly pair: pay both.

  Third, consider the agent who focuses on policy optimization. This agent asks: "Which general rule of conduct, adopted before knowing the specific details, yields the best outcome?" This agent treats their choice as the output of a fixed function. In the mugging, a policy of "pay if asked" results in gaining $10,000 half the time and losing $100 half the time. A policy of "refuse" yields zero. Ex-ante, the paying policy is superior. Thus, this agent pays. In the blackmail, the logic is subtler. If the agent adopts a policy of "pay," the blackmailer's rule ensures the letter is sent only when no dossier exists (True XOR False). The agent pays $5,000 to avert an empty threat. If the agent adopts a policy of "refuse," the letter is sent only when a dossier exists (False XOR True). The agent loses their career, but only in the rare case where the threat is genuine. Assuming genuine dossiers are rare, the "refuse" policy avoids frequent exploitation. Thus, this agent refuses. This framework yields the pair: pay the mugging, refuse the blackmail.

  The divergence between these verdicts highlights the core tension. Many people's untutored intuition aligns with the causal agent: refuse the mugging because the past is fixed, but pay the blackmail because the threat is immediate. Is there a coherent decision rule that yields exactly this pair? Yes, the causal framework itself. It is internally consistent to treat the predictor's past accuracy as causally inert while treating the blackmailer's future release mechanism as causally active. The cost of this coherence, however, is dynamic inconsistency. The causal agent knows beforehand that they will refuse the mugging, and thus knows they will never receive the $10,000. They are predictable losers in scenarios involving accurate predictors. They leave value on the table because they refuse to acknowledge that their current decision type is logically linked to past predictions.

  Conversely, the policy-first agent achieves a different coherence. By paying the mugging, they secure the windfall ex-ante. By refusing the blackmail, they avoid becoming the type of person who is exploited by logical threats in empty-scenario worlds. This view treats the agent not as a momentary chooser but as a logical output that exists across counterfactuals. The cost here is psychological: it requires accepting that one's choice can be correlated with fixed past facts without causally changing them.

  I conclude that the policy-first approach is the correct adjudication for both cases, though for distinct reasons rooted in the structure of each dependency. In the Counterfactual Mugging, you should pay the $100. The strongest argument against this is that the money is gone; paying now changes nothing in the actual world. This is causally true but decision-theoretically myopic. Rationality is not merely about reacting to the present slice of reality but about embodying a decision type that succeeds across possible worlds. The predictor's accuracy establishes a logical link between your current policy and the counterfactual heads-world. To refuse is to assert that your rationality is bounded by the immediate causal graph, ignoring that your "source code" was read before the coin flip. If you want the $10,000, you must be the kind of agent who pays. Since you cannot change your type only when it is convenient, you must pay now to validate the type that wins then.

  In the XOR Blackmail, you should refuse the demand. The strongest argument against this is the immediacy of the threat: if the dossier exists, refusing destroys your career. However, this argument conflates the conditional risk with the ex-ante policy value. The blackmailer's protocol ties the arrival of the letter to your disposition. If you are the sort who pays, you invite the letter in worlds where you are safe, merely to extract money. You become a money pump for logical correlations. If you are the sort who refuses, the letter arrives only when you are doomed anyway. By refusing, you ensure that your resources are not consumed in the vast majority of scenarios where the threat is bluff. While the causal agent pays to save themselves in the specific instance where the letter arrives, they fail to recognize that their willingness to pay is what populates the scenario with empty threats. Refusing is the only way to break the logical link that makes blackmail profitable.

  We must be clear about what is contested here. It is not contested that the coin flip is past or that the letter is present. It is contested whether rationality requires us to maximize utility relative to the causal consequences of an act, or relative to the logical consequences of a policy. The causal view protects us from delusions of changing the past but blinds us to logical dependencies. The policy view acknowledges that in a universe containing predictors and logical agents, our choices are not isolated events but reflections of our underlying algorithm.

  Therefore, the coherent verdict is to pay the mugging and refuse the blackmail. This pair maximizes ex-ante expected utility while respecting the logical structures stipulated. It accepts that in the mugging, your choice reaches back across counterfactuals to validate the predictor's accuracy, and in the blackmail, your choice reaches forward to determine whether you are the kind of person who gets exploited. To do otherwise is to prioritize the comfort of causal isolation over the efficacy of rational agency.
