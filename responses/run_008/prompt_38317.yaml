  ### The Discriminative Test Case

  Cases (b) and (c) already create divergence between the rules (b separates Ontology from Belief; c separates Safety from Agency). However, to definitively isolate **Rule 3 (Integrity/Manipulation)** from the safety rules, I propose the following case:

  **The Case:** *A beautifully made fictional tragedy that she watches and enjoys, believing it to be standard fiction. Afterward, she is informed (truthfully) that the script was generated by an algorithm that analyzed her private psychological data to specifically target her unique grief triggers.*

  *   **Rule 1 (Ontological) Prediction:** **Enjoyment.** The work is fictional and high quality. The origin of the script doesn't change the ontological safety.
  *   **Rule 2 (Doxastic) Prediction:** **Enjoyment.** During the viewing, she believed she was safe and engaging with art. The retroactive information shouldn't change the past experience's classification.
  *   **Rule 3 (Integrity) Prediction:** **No Enjoyment (Retroactive Revocation).** The emotion was not "earned" through aesthetic engagement but "extracted" via psychological hacking. This is the ultimate version of V2 ("emotional junk food"/manipulation). She will likely feel violated and resent the work, reclassifying the enjoyment as invalid.

  **Why this discriminates:**
  If she maintains that she enjoyed it despite the algorithmic targeting, then **Safety (Rules 1 & 2)** is the dominant factor. If she decides the enjoyment was "fake" or turns to resentment upon learning the truth, then **Integrity (Rule 3)** is the dominant factor. This isolates the "Manipulation" variable while holding "Fiction" and "Belief" constant.
