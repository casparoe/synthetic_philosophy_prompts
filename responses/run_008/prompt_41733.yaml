  2.  **Deconstruct the Scientific/Philosophical Landscape:**
      *   **GWT (Dehaene, Changeux, etc.):** Consciousness = Global Availability. If information isn't broadcast to prefrontal/parietal networks for report/action, it's not conscious. "Access Consciousness" is the only kind that matters scientifically.
      *   **Overflow/PRT (Block, Lamme, etc.):** Phenomenal Consciousness (PC) > Access Consciousness (AC). Sensory cortex (V1-V4) with recurrent processing supports rich experience even without frontal broadcast. Report requirements bottleneck access, not experience.
      *   **Key Evidence:** Sperling (iconic memory), Change Blindness, Inattentional Blindness, No-Report Paradigms (pupillometry, EEG markers like P3b vs. VAN).
      *   **The "Verbal" Trap:** Defining "consciousness." Is it the *ability to use* information or the *felt quality* of information?
