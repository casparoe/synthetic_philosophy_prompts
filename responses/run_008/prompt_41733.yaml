answer: |-
  # Joint Consensus Statement on the Neural Correlates of Consciousness
  **Adversarial Collaboration Group: Global Workspace & Recurrent Processing/Overflow Frameworks**
  **Date:** October 2023
  **Signatories:** [Representatives of GWT/Access Camp] | [Representatives of Overflow/Phenomenal Camp]

  ## Preamble
  We, the undersigned, acknowledge that decades of debate regarding the neural correlates of consciousness (NCC) have yielded high-quality data but divergent interpretations. Recognizing that our disagreement mirrors historical disputes in neural coding regarding the definition of "representation," we commit to distinguishing empirical observations from theoretical inferences. This document outlines our points of convergence, precisely formulates our points of divergence without caricature, and identifies specific empirical cruxes capable of adjudicating the dispute.

  ---

  ## Part I: Agreed Empirical Claims
  *We agree on the following observations and methodological constraints. These statements describe data or paradigmatic limitations, not theoretical conclusions.*

  1.  **Report Requirements:** All standard subjective report paradigms (verbal, button press) necessitate working memory consolidation and motor planning. We agree that these processes engage fronto-parietal networks. Consequently, activity in these networks during report-based tasks cannot be uniquely attributed to conscious experience itself, as it may reflect post-perceptual processing required for the report.
  2.  **Recurrent Processing:** Feedforward processing in sensory cortex (approx. 0–100ms post-stimulus) is insufficient for sustained conscious experience or report. Some form of recurrent (feedback) processing within sensory areas is necessary for the stimulus to persist beyond the initial transient response.
  3.  **The P3b Component:** In EEG/MEG paradigms requiring report, a late positive deflection (P3b, ~300–500ms) correlates strongly with stimulus detection and reportability. We agree this component is associated with task-relevant decision making and global availability.
  4.  **The VAN Component:** In EEG/MEG paradigms, an earlier negativity (Visual Awareness Negativity, VAN, ~200ms) over occipito-temporal sites correlates with subjective visibility ratings, even when controlling for some report variables.
  5.  **Capacity Limits:** We agree that human subjects have a severely limited capacity for reporting multiple items simultaneously (approx. 3–4 items) and that unattended stimuli are frequently not reported (inattentional blindness/change blindness).
  6.  **No-Report Confounds:** We agree that "no-report" paradigms (e.g., pupillometry, optokinetic nystagmus, passive viewing) reduce but do not necessarily eliminate covert access processes. Subjects may still engage working memory or covert attention without explicit motor output.
  7.  **Dissociation Possibility:** We agree that it is empirically possible for neural activity associated with sensory processing to dissociate from neural activity associated with report. The dispute concerns the *phenomenal status* of the sensory activity during such dissociations.

  ---

  ## Part II: Formulated Disagreements
  *The following table isolates the specific points of contention. The "Neutral Issue" column describes the dispute without bias. The "Camp Formulations" allow each side to state their position in their own preferred terminology, provided it remains faithful to their published views.*

  | Neutral Issue | Global Workspace (Access) Formulation | Overflow / Recurrent Processing (Phenomenal) Formulation | Classification |
  | :--- | :--- | :--- | :--- |
  | **1. The NCC Proper** | The NCC is identified with the *ignition* of a fronto-parietal workspace. Consciousness is a global functional state; without broadcasting, information remains unconscious (sub-personal). | The NCC is identified with *specific recurrent loops* in sensory cortex. Consciousness is a local representational state; broadcasting enables report/action, not experience itself. | Substantive |
  | **2. The Bottleneck** | The limitation observed in change blindness and attentional blink reflects a limit on *phenomenal capacity*. We are not conscious of what we cannot access. | The limitation observed in change blindness and attentional blink reflects a limit on *access/report capacity*. Phenomenal field is richer than what can be accessed. | Substantive |
  | **3. Unreportable Experience** | If a stimulus cannot be reported (even indirectly) under ideal conditions, there is no scientific basis to claim it was experienced. "Consciousness" without access is a theoretical posit without operational criteria. | If a stimulus elicits robust sensory recurrent processing but fails to trigger frontal broadcast, it is experienced phenomenally but lost before report. Report underestimates the contents of consciousness. | Substantive/Verbal |
  | **4. Definition of Target** | We define "Consciousness" operationally as *Access Consciousness* (availability for reasoning/report). This avoids positing unmeasurable "ghost" states. | We define "Consciousness" phenomenally as *Phenomenal Consciousness* (what it is like to see). Access is a function *of* consciousness, not its definition. | Verbal (with substantive consequences) |
  | **5. Interpretation of VAN vs. P3b** | The VAN reflects pre-conscious sensory processing or perceptual confidence. The P3b is the true marker of the conscious transition. | The VAN reflects the neural correlate of phenomenal experience. The P3b reflects the subsequent access/report mechanism. | Substantive |

  ---

  ## Part III: Empirical Cruxes and Adjudication
  *We identify three specific experimental domains where our predictions diverge sharply. We commit to accepting the outcomes of these rigorous tests as evidence weighing for or against our respective frameworks.*

  ### Crux 1: The "No-Report" NCC (EEG/MEG)
  **Method:** A binocular rivalry or masking paradigm where the subject does not report trial-by-trial perception. Instead, consciousness is inferred via an objective, involuntary measure (e.g., pupillometry or optokinetic nystagmus) that does not require working memory consolidation. Simultaneous high-density EEG is recorded.
  **The Question:** When the involuntary measure indicates perception, but the subject makes no report, which neural marker is present?

  *   **GWT Prediction:** Even without explicit report, if the stimulus is consciously perceived (as verified by the involuntary measure), **P3b ignition** will be present. If P3b is absent, the involuntary measure reflects unconscious processing.
  *   **Overflow Prediction:** When the involuntary measure indicates perception, **VAN** will be present, but **P3b may be absent**. The P3b will only appear if the task demands explicit consolidation.
  *   **Adjudication:** If robust perception is confirmed via involuntary measure in the absence of P3b (but presence of VAN), GWT must concede that access is not necessary for experience. If P3b is invariably present whenever perception occurs (even without report), Overflow must concede that sensory recurrence alone is insufficient.

  ### Crux 2: Frontal TMS Disruption During Subjective Report
  **Method:** Transcranial Magnetic Stimulation (TMS) applied to dorsolateral prefrontal cortex (DLPFC) at the time of stimulus presentation during a visual detection task. Subjects provide subjective visibility ratings (PAS) rather than objective forced-choice.
  **The Question:** Does disrupting frontal function abolish the *experience* or only the *ability to rate* the experience?

  *   **GWT Prediction:** DLPFC TMS will reduce subjective visibility ratings (PAS) commensurate with objective performance. Disrupting the workspace disrupts the conscious state itself.
  *   **Overflow Prediction:** DLPFC TMS will impair the *consistency* or *speed* of the report, but subjective visibility ratings (PAS) for detected stimuli will remain high relative to objective performance. Subjects will report "seeing clearly" but struggle to respond reliably. (Control: Occipital TMS should abolish visibility).
  *   **Adjudication:** If DLPFC TMS abolishes subjective visibility while sparing early visual processing, GWT is supported. If DLPFC TMS leaves subjective visibility intact but disrupts the mapping of that visibility to a response scale, Overflow is supported.

  ### Crux 3: Iconic Memory Capacity Without Consolidation
  **Method:** A Sperling-style partial report paradigm modified to prevent consolidation. A high-density array (e.g., 12 items) is flashed briefly. A cue appears *after* the offset (delayed cue). Crucially, a secondary distractor task prevents frontal rehearsal during the delay interval.
  **The Question:** What is the capacity of the store available during the delay interval before rehearsal?

  *   **GWT Prediction:** Without frontal rehearsal/access, the capacity of the store will collapse to working memory limits (~3-4 items). The "feeling" of richness is a heuristic, not a reflection of stored detail.
  *   **Overflow Prediction:** The capacity of the sensory store will remain high (>8 items) despite the prevention of frontal rehearsal. The detailed representation exists phenomenally in sensory cortex but decays rapidly if not accessed.
  *   **Adjudication:** Measurement of information content via high-sensitivity forced-choice probing (minimizing report load). If high-fidelity information is retrievable from many items despite frontal load, Overflow is supported. If information is limited to ~4 items regardless of sensory persistence, GWT is supported.

  ---

  ## Part IV: Analysis of Verbal vs. Substantive Dispute
  *Per the request of the collaboration committee, we offer the following analysis on the nature of our disagreement.*

  **1. The Verbal Component:**
  We acknowledge that a portion of the dispute is terminological. The GWT camp utilizes "Consciousness" as a functional label for *information availability*. The Overflow camp utilizes "Consciousness" as a phenomenological label for *subjective experience*.
  *   **Resolution:** If the dispute were *purely* verbal, both sides would agree on the neural data but merely label it differently. However, this is not the case. The verbal difference drives the search for different neural signatures (P3b vs. VAN). Therefore, the verbal dispute is not trivial; it dictates experimental design.

  **2. The Substantive Component:**
  The core substantive disagreement concerns the **causal role of the prefrontal cortex (PFC)**.
  *   **GWT Claim:** PFC activity is *constitutive* of conscious experience.
  *   **Overflow Claim:** PFC activity is *consequential* to conscious experience (required for reporting it, but not having it).
  *   **Why this is not merely verbal:** This is an anatomical and causal claim. It is possible to imagine a world where GWT is right (no PFC, no experience) and a world where Overflow is right (no PFC, rich experience, no report). These are distinct physical states.

  **3. The "Richness" Intuition:**
  We identify the subjective intuition of "peripheral richness" as a major source of friction.
  *   **GWT Stance:** This intuition is a cognitive illusion—a metacognitive judgment about potential access, not a readout of current phenomenal content.
  *   **Overflow Stance:** This intuition is a valid report of the phenomenal field, which exceeds access.
  *   **Consensus on Status:** We agree that subjective intuition alone cannot settle the matter. It must be triangulated with the neural and behavioral data outlined in Part III.

  **Signed,**
  *The Adversarial Collaboration Committee*
