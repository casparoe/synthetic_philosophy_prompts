          *   *Issue 3: Verbal/Substantive.* Is this just definition? GWT says operational definition is necessary. Overflow says operational definition excludes the phenomenon.
          *   *Wording Check:* Ensure GWT doesn't sound dismissive ("just report") and Overflow doesn't sound mystical ("rich soul"). Use technical terms (broadcasting, phenomenal field).

      *   **Section 3: The Cruxes (Adjudicable Experiments):**
