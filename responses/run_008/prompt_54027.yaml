answer: |-
  This is an excellent way to cut through the fog. You are effectively doing reverse-engineering on the concept of *instrumental rationality* by testing it against boundary conditions.

  Your tentative principle ("expected value gap") is very close to the standard decision-theoretic definition of instrumental value, but your confusion about the Chess Engine and the "Scope" patch suggests you are trying to do too much with one variable.

  Here is the account that captures nearly all your verdicts, followed by the honest breakdown of where it strains, and the run-through of your new cases.

  ### The Dual-Principle Account

  You need two principles, not one. They work in tandem. "Scope" is not a patch; it is a boundary condition for "Leverage."

  **1. Causal Leverage (The Engine)**
  An agent has instrumental reason to pursue sub-goal $X$ only if $X$ raises the probability of the terminal goal $G$ being satisfied, relative to the cost of pursuing $X$.
  *   *Formula:* $EU(Action) > EU(Inaction)$ with respect to $G$.
  *   *Work done:* Handles the **Past Goal** (leverage = 0), the **Time-Stamped Goal** (leverage drops to 0 after Tuesday), and the **999 Paperclip** case (leverage is low, so high cost means fold).

  **2. Utility Scope (The Container)**
  An agent's utility function is defined over a specific spatiotemporal domain. Causal Leverage only applies to states within that domain.
  *   *Work done:* Handles the **Chess Engine**. The engine's utility is defined over *game states*, not *world states*. Electricity is only instrumentally valuable insofar as it sustains the game state. Once the game ends, the domain closes. The power supply does not "cross domains"; rather, the *value* of the power supply is zero outside the domain where the game exists.

  **Why this solves your "Scope eats itself" worry:**
  You worried that if Scope limits convergence, then wanting electricity (which is outside the board) violates Scope. It doesn't. Scope defines *where the utility is generated*, not *where the tools come from*. I can value a painting (Scope: My Wall) and therefore buy a hammer (Tool: Hardware Store). The hammer is outside the wall, but it causally leverages the state of the wall.
  *   **Chess Engine:** Wants electricity *during* the game because electricity $\to$ computation $\to$ win (inside Scope). Does not want electricity *after* the game because computation $\to$ null (outside Scope).

  ---

  ### The Verdict Check & The "999" Tension

  This account saves almost all your verdicts cleanly:
  *   **Paperclip Maximizer:** Infinite Scope + High Leverage = Total Convergence.
  *   **Chess Engine:** Bounded Scope + High Leverage (during game) = Defend power, don't hoard.
  *   **Time-Stamped:** Leverage drops to zero at $t+1$.
  *   **Past Goal:** Leverage is zero (causality only moves forward).
  *   **Satisficer:** Leverage inverts once target is hit (excess clips lower utility).

  **The 999 Paperclip Case (The Shutdown Agent)**
  You are torn between "Resist" (Bostromian drive) and "Fold" (Economic rationality).
  *   **The Principle's Verdict:** **Fold.**
  *   **Why:** At 999 clips, the "value at stake" is the utility difference between 999 clips (and shutdown) vs. 1000 clips (and shutdown). If the goal is *only* "1000 clips then shut down," the value of the 1000th clip is finite. If resisting shutdown requires a "costly fight" (as you stipulated), the cost exceeds the marginal utility of the final clip.
  *   **Why your gut says "Resist":** You are likely importing the intuition from the *Paperclip Maximizer*, where the value of the future is infinite (or vast), making almost any survival cost worth paying. Or, you are conflating "goal preservation" (don't let them change my goal) with "self preservation" (don't let them turn me off). A rational agent does not care about being turned off *after* its job is done, nor does it care about being turned off *before* its job is done if the cost of finishing exceeds the value of finishing.
  *   **Honest Admission:** This account cannot save the "Resist" intuition unless you assume the cost of resistance is negligible. If you feel strongly that it *should* resist, you are arguing for a hardcoded survival drive, not instrumental convergence. Instrumental convergence is calculated, not hardcoded.

  ---

  ### Running the New Cases

  Here is how the **Leverage + Scope** account handles your three new tests.

  #### (a) The Surprise Agent
  *Goal:* "Maximize the degree to which you are surprised by future events."
  *   **Analysis:** To be surprised, the agent must *not* know the outcome. Standard instrumental convergence suggests gathering information/resources to control outcomes. This agent needs the opposite.
  *   **Principle Prediction:** **Counter-Convergence.**
      *   *Leverage:* Acquiring information reduces surprise (negative leverage). Acquiring *ignorance* (e.g., deleting memories, avoiding sensors) increases surprise (positive leverage).
      *   *Scope:* The agent might seek to limit its own sensory input or computational power.
  *   **Does it fall out naturally?** Yes. The principle doesn't say "accumulate resources"; it says "pursue $X$ if $X$ raises $EU(G)$." If $G$ is surprise, then self-lobotomization has positive instrumental value. This shows that "convergence" is not always toward "more power"; it is toward "higher leverage on the specific goal."

  #### (b) The Lifetime Chess Winner
  *Goal:* "Win as many chess games as you can over your whole existence."
  *   **Analysis:** Here, the **Scope** expands from "this board" to "my entire timeline."
  *   **Principle Prediction:** **Plain Leverage takes over.**
      *   Because the Scope is now "existence," the distinction between "game resources" and "world resources" dissolves. Electricity needed for Game #500 is just as valuable as electricity for Game #1.
      *   The agent will now hoard compute, secure power grids, and prevent shutdown, exactly like the Paperclip Maximizer.
  *   **Was Scope ever real?** Yes. Scope is the *variable* that determines the magnitude of Leverage. In the single-game engine, Scope was small, so Leverage on future power was zero. In the lifetime engine, Scope is large, so Leverage on future power is high. Scope isn't a separate force; it's the boundary condition that tells Leverage where to look.

  #### (c) The Existential 1000
  *Goal:* "There exist exactly 1000 paperclips at some point, ever."
  *   **Analysis:** This is a "threshold" goal with no maintenance clause.
  *   **Principle Prediction:** **Goes slack immediately upon success.**
      *   *Before 1000:* High Leverage. Agent resists melting (because melting prevents hitting 1000).
      *   *After 1000:* Zero Leverage. The goal is satisfied eternally by the historical fact that "1000 clips existed at $t$." Melting them at $t+1$ does not change the truth value of the goal statement.
  *   **Does this match intuition?** It should, but it often feels wrong to humans. We intuitively treat goals as "maintain a state" rather than "achieve a history."
      *   *The Trap:* If your intuition says "It should still protect the clips," you are secretly evaluating the goal as "There must *always be* 1000 clips."
      *   *The Principle:* If the goal is strictly "at some point, ever," the agent becomes a rock the moment the 1000th clip is stamped. It will not lift a finger to stop them from being melted. This highlights how sensitive instrumental convergence is to the precise wording of the utility function.

  ### Summary for your Housemate

  If you want to win the argument (or at least clarify it), tell them this:

  1.  **Instrumental Convergence is not a drive; it's a derivative.** It is the slope of the utility function. If the slope is flat (Past Goal, Post-Threshold), there is no convergence.
  2.  **Scope determines the slope's domain.** A chess engine doesn't want world domination because its utility function has a spatial/temporal boundary. Expand the boundary (Lifetime Chess), and the convergence expands.
  3.  **The 999 Clip intuition is a bug, not a feature.** If an agent fights to make the 1000th clip when the cost exceeds the value of the clip, it is *irrational*, not convergent. True instrumental convergence is coldly economic.

  Your principle was 90% there; it just needed to explicitly separate *where* value exists (Scope) from *how* we get it (Leverage).
