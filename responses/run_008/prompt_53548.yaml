answer: |-
  Consider eleven neighbours who wish to evict Mr Henderson, a vulnerable tenant, via a landlord's nuisance petition requiring ten signatures. All eleven sign; thus, any single signature is causally redundant, for if you withhold yours, the landlord simply accepts the eleventh neighbour's signature instead, ensuring Mr Henderson is evicted regardless. Your contribution changes nothing ex ante or ex post; the harm is overdetermined by perfect replacement. Yet, signing feels intuitively wrong because you have joined the effort to destroy his home. Contrast this with the Control Case: you are the tenth signer and only nine others exist. Here, your signature is the threshold-crosser; without it, Mr Henderson stays. You intuitively condemn signing in the Control Case. The inefficacy objection suggests you are blameless in the main case despite the identical outcome and intent, merely because your causal leverage was nullified by surplus participation.

  A straightforward act consequentialist concludes the act is permissible in the main case, as the outcome is identical to abstention. A threshold or expected-value theorist agrees, calculating the probability of making a difference as zero. However, a fairness- or complicity-based theorist concludes the act is impermissible, arguing that participating in a wrongful joint enterprise incurs responsibility regardless of marginal causal impact. The structural feature doing the work is indeed perfect replacement (overdetermination), which secures inefficacy while preserving the agent's membership in the harmful collective. The inefficacy objector's strongest reply is to deny that complicity attaches without causal power, insisting that moral responsibility requires the ability to have prevented the harm. They cannot deny perfect replacement in the constructed case without breaking the stipulation, but they can argue that in climate or meat cases, harm is diffuse rather than targeted at an identifiable victim like Mr Henderson. This disanalogy allows them to maintain the objection for statistical harms while conceding the intuition in the petition case, though this risks conceding that the inefficacy objection relies heavily on the abstraction of the victim rather than the causality alone. Ultimately, the case generalises to climate and meat only if one accepts that complicity in systemic harm does not require individual efficacy; if the objector holds that identifiable victims are necessary for complicity, they must abandon the claim that inefficacy alone is the exonerating factor.
