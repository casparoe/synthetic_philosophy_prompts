  **Dana will recommend that the collider should not be turned on.**

  She will argue that while the calculated probability ($2 \times 10^{-8}$) is small, the *epistemic status* of that probability is too fragile to justify imposing a novel risk of absolute ruin. She will distinguish this from the asteroid case on two grounds: the asteroid risk is a natural background hazard we are mitigating (omission), whereas the collider risk is an artificial hazard we are creating (commission); and the asteroid probability rests on tracking physical objects (consensus), whereas the vacuum decay probability rests on extrapolating coupling constants beyond measured precision (speculative).

  ***

  ### Three Candidate Rules Consistent with Her Track Record

  Dana's behavior rejects pure Expected Value (EV) maximization (she buys negative-EV insurance) and pure EV with bounded utility (she rejects the Mugging). Her decisions cluster around three potential principles. Here is how they analyze the collider case.

  #### 1. The Probabilistic Negligence Threshold
