  *   **Prediction for Collider:** **Turn it on.**
  *   **Reasoning:** The risk is 1 in 50 million ($2 \times 10^{-8}$). This is 500 times *smaller* than the asteroid risk she accepted. If her threshold is around $10^{-6}$ (consistent with acting on $10^{-5}$ but ignoring Mugging), this risk is negligible. The "excellent science" is a finite positive utility; the risk is treated as zero.
  *   **Divergence Point:** This rule diverges from the others on *small-probability ruin*. It allows creating tiny risks of catastrophe if the number is small enough, whereas the other rules forbid it.

  #### 2. The Asymmetry of Ruin (Commission vs. Omission)
  **The Rule:** One is obligated to mitigate existing risks of "ruin" (extinction/personal bankruptcy) if cost-effective, but strictly forbidden from *creating* new risks of ruin, regardless of how small, unless the benefit is also survival-critical. This explains the insurance (mitigating personal ruin), the asteroid donation (mitigating global ruin), and the Mugging rejection (refusing to validate a mechanism that creates/leverages ruin).
  *   **Prediction for Collider:** **Do not turn it on.**
  *   **Reasoning:** The asteroid case was *reducing* an existing natural risk. The collider case is *introducing* a new artificial risk. Even if the probability is low, the "Ruin" stake (observable universe destruction) triggers a lexical veto on creating that risk voluntarily. The science benefit is not survival-critical.
  *   **Divergence Point:** This rule diverges from the Threshold rule on *novel risks*. It also diverges from the Epistemic rule (below) if the risk were certified as 100% reliable; this rule says "No" even to reliable tiny ruin risks, whereas the Epistemic rule might say "Yes" if the probability were robust.

  #### 3. The Epistemic Reliability Filter
  **The Rule:** Probabilities are only actionable if derived from robust, consensus models within their domain of validity. Speculative probabilities (theology, muggings, drunk strangers, extrapolated physics) are heavily discounted or treated as "Knightian uncertainty" (unknown unknowns), triggering a precautionary principle.
  *   **Prediction for Collider:** **Do not turn it on.**
  *   **Reasoning:** The asteroid risk is based on observing objects we know exist (high reliability). The collider risk is based on coupling constants measured to "limited precision" with most physicists "shrugging." To Dana, this looks like the Drunk Stranger case: the odds are offered by a source that hasn't earned trust on this specific claim. She will treat the 1-in-50-million not as a small number, but as an *unknown* number, and apply the precautionary principle to unknown ruin risks.
  *   **Divergence Point:** This rule diverges from the Ruin Asymmetry rule on *reliable small risks*. If a consensus of physicists certified a 1-in-1-billion ruin risk as "solid fact," the Epistemic Filter might allow it (probability is real), while the Ruin Asymmetry would still forbid it (creating ruin).

