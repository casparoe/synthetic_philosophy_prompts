answer: |-
  Dear Mara and Julius,

  You have asked me to adjudicate your exchange regarding Dennett's notion of free-floating rationales, and I have done my best to reconstruct the dialectic as you presented it. What follows is my assessment of each move in turn, distinguishing where possible between what is settled among specialists and what remains deeply contested, along with an indication of where I believe each of you holds the stronger position on specific points.

  Regarding your opening move, Mara, you are right to insist that in ordinary language and traditional philosophy of action, the term rationale presupposes a mind capable of grasping it. Specialists agree that reasons in the context of human action are typically understood as mental states or propositions accessible to the agent. However, Julius is also right that Dennett is engaged in a project of naturalization, which often involves stipulative redefinition of terms to bridge the gap between the physical and the intentional. You are correct that calling a causal history a rationale sounds like a pun if one holds to the traditional definition, but Julius is correct that dismissing it merely as metaphor ignores the substantive claim that evolutionary processes instantiate a structure isomorphic to reasoning. The contested ground here is not linguistic but metaphysical: whether naturalizing reason requires eliminating the mental component or expanding the definition of reason to include mindless processes. There is no consensus on this, so your charge of a pun is valid from a traditionalist standpoint, while Julius's defense is valid from within Dennett's specific naturalistic framework.

  In the second move, Julius, you correctly identify that biological explanation relies heavily on teleological forms, such as citing the benefit of a trait to explain its presence. It is settled among philosophers of biology that evolutionary biology routinely uses function talk that looks like reason-giving. However, Mara is right to caution that the utility of an explanatory form does not automatically validate its ontological commitments. Instrumentalists argue that we use teleological language because it is heuristic, not because nature contains real reasons. You are correct that denying any notion of function would make biology absurd, but Mara is correct that one can retain the explanatory utility without committing to the existence of free-floating rationales as ontological entities. The dispute here hinges on whether explanatory indispensability implies ontological reality, a matter on which specialists remain divided between realists and instrumentalists about biological function.

  Moving to your reply, Mara, you argue that the explanation reduces without remainder to etiological facts about differential reproduction. You are right that the dominant etiological account of function, championed by philosophers like Millikan and Neander, grounds function entirely in historical selection events. It is largely settled that functions are tied to history rather than current utility alone. However, Julius is right to suggest that describing this history inevitably involves selectional vocabulary like selected for, which carries normative weight. You are correct that this vocabulary originates in intentional breeding, but Julius is correct that it has been naturalized in evolutionary theory to refer to differential reproduction rates independent of breeder intent. The contested issue is whether this naturalized vocabulary retains enough normativity to count as a reason or whether it is merely causal description dressed up. You are on solid ground claiming the history is just history, but you may be underestimating how deeply the functional interpretation is woven into the identification of the relevant historical facts themselves.

  In the fourth move, Julius, you raise the problem of underdetermination using the heart example, distinguishing between the function of pumping blood and the mere effect of making noise. You are right that not all effects are functions, and it is settled consensus that the etiological account solves this by citing what the trait was selected for, not merely what it does. This is a strong point for your side, as it shows that selection does something specific that mere causation does not, namely filtering effects based on contribution to reproduction. Mara's suggestion that this is just interpretation laid on top of history struggles here because the distinction between function and effect is not arbitrary in biology; it tracks objective historical differences. However, Mara is right to maintain that selection itself is a mindless process, so the point or function it establishes is not a reason in the sense of a justification grasped by an agent. You are correct that selection converts benefit into function, but whether that function constitutes a free-floating rationale depends entirely on whether one accepts Dennett's expansion of the term reason, which brings us back to the disagreement in the first move.

  Mara, your fifth move raises the promiscuity problem, noting that side-effects or spandrels might acquire rationales if any selected effect counts. You are right that distinguishing adaptation from side-effect is notoriously difficult, a point famously made by Gould and Lewontin, and specialists agree that there is often indeterminacy in assigning specific functions to traits. Julius is also right, however, that indeterminacy or vagueness in boundary cases does not necessarily abolish the category itself, much like vagueness about heaps does not abolish the concept of a heap. You are correct that our explanatory interests often guide which effects we label as functions, but Julius is correct that there is still a fact of the matter about what was actually selected for, even if it is sometimes epistemically inaccessible. The contested ground here is whether this epistemic difficulty implies an ontological lack of specific rationales. You are right that without a mind to adjudicate, the specificity of the rationale can seem loose, but Julius is right that loose boundaries do not equate to non-existence.

  In the final exchange, Julius, you extend the argument to machine learning, claiming there is a fact of the matter about why wiring works even if no human grasps it. You are right that there are engineering facts about causal efficacy in artificial neural networks. However, Mara is right to insist that a causal explanation of why something works is not identical to a reason why it does it in the normative sense. Specialists in the philosophy of mind and AI are divided on whether artificial systems possess reasons or merely simulate reason-responsive behavior. You are correct that the rationale exists independently of human grasp if one defines rationale as the functional role within a system, but Mara is correct that this strips the word reason of its connection to justification and awareness. The crux of her final objection is that without a mind, there is no one for whom the fact counts as a reason, and on this specific point regarding the essential link between reasons and minds, she holds the traditional philosophical high ground, while you are advocating for a revised, naturalistic taxonomy.

  There are things both of you are missing that might dissolve some of the friction. First, you are debating realism versus instrumentalism about biological functions without explicitly naming it. Mara is arguing from an instrumentalist or eliminativist perspective, suggesting function talk is a useful tool for us, while Julius is arguing from a realist perspective, suggesting functions are real features of the world. Second, you are conflating two senses of reason. There is the explanatory sense, where a reason is simply the cause that explains a trait's presence, and the normative sense, where a reason is a justification for action. Dennett's free-floating rationales attempt to bridge these, but your disagreement persists because Mara focuses on the normative sense requiring a mind, while Julius focuses on the explanatory sense requiring only a functional structure. Finally, both of you could benefit from distinguishing between producer-side teleology, which involves the history of selection, and consumer-side teleology, which involves how the trait is used by the organism. Julius leans on producer-side facts to establish the rationale, while Mara insists that without consumer-side understanding, it remains mere cause. Recognizing these distinctions would clarify that you are largely agreeing on the biology while disagreeing on the metaphysics of intentionality.

  In sum, Mara is right that traditional concepts of reason require minds and that functional attribution involves interpretive interest, while Julius is right that biological function is objective, historical, and distinct from mere causal effect. The disagreement ultimately rests on whether the naturalized concept of function is robust enough to carry the weight of the word rationale. Since specialists remain divided on the ontology of biological functions and the naturalization of normativity, neither of you can claim a decisive victory based on current consensus. You are describing the same biological reality but disagreeing on whether the vocabulary of reasons applies to it without a mind to hold them. I hope this helps clarify where your arguments succeed and where the broader philosophical community remains undecided.

  Sincerely,

  The Adjudicator
