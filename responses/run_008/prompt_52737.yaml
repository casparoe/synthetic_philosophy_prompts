      *Re-evaluating Move 1:* "Selection is the only naturalistic source of functional organization." This is the definition of Adaptationism. But Gould would say constraints create organization too. I'll call it "Partly Right" but highlight the philosophical contention.
      *Re-evaluating Move 5:* Mara says distinguishing drift/byproduct requires $N_e$. This is true for *drift*, but "byproduct" (spandrel) is about developmental correlation, not necessarily drift. She conflates drift and byproduct. This is a key error to highlight.

