      *   *Refining Rank 3:* Lewis uses CT to avoid trans-world identity. Does he use it for teletransportation? Lewis thought teletransportation breaks spatiotemporal continuity, so strict identity fails. It's a counterpart relation. If the user insists on *identity* in (3), they clash with Lewis. If they mean *survival*, they are fine.

