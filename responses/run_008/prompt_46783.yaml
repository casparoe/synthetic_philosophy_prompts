      *   Rank by severity? Yes.
      *   Tell what has to give and cost? Yes.
      *   Flag false tensions? Yes.
      *   Tone: Philosophical peer, constructive but rigorous.

  7.  **Final Polish:** Ensure the distinction between *trans-world* modality and *trans-temporal* persistence is clear, as that's where the Origin vs. Teleporter clash hides. (Origin is usually framed modally, but implies a constraint on the entity's history). Actually, Origin Essentialism is a modal claim (Across Worlds), Teleporter is a temporal claim (Across Time/Space). The clash is: Does the Modal constraint on origin constrain the Temporal persistence conditions? Yes, if the Teleporter replica doesn't satisfy the origin constraint, can it be *identical*?
