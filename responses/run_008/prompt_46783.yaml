      *   **Apparent Tension: Counterpart Theory (4) vs. Origin Essentialism (1).**
          *   *Analysis:* Lewis *was* an origin essentialist. CT is the framework he used to make sense of it without trans-world identity.
          *   *Verdict:* **False Tension.** (In fact, they support each other).

