prompt: |-
  me and this other guy in my school's philosophy club have been arguing for like 3 months about the laws of nature and our advisor (she did a philosophy phd before becoming a hs teacher lol) says we should do one of those adversarial collaboration things where the two sides write ONE document together instead of yelling past each other. so heres the setup: i'm on team "the laws of nature are just a really good summary of what actually happens" (she called this the Humean side i think, something about a "best system") and he's on team "the laws MAKE things happen, they don't just describe" (the anti-humean side). his whole thing is like, gravity isn't just a pattern we noticed, the law is somehow doing something, its not just a coincidence that stuff keeps obeying it.

  write the joint statement that both of us should be able to sign. i need:

  1. claims we genuinely agree on -- make them say something real, not filler like "science is good"
  2. the exact disagreements, worded so that i'd sign my side's wording and he'd sign his, and neither of us sounds dumb in the other's version
  3. the cruxes: the sub-questions such that if one of us lost one, that side would actually have to move. for each crux, say what argument or case both of us would agree counts as bearing on it, and write down each side's prediction in advance

  also our advisor says we should stress test everything on a made up case, so please include this one i made up: a toy universe with exactly 12 particles where two rival summaries of everything that happens score exactly the same on the humean's own criteria (equally simple, equally strong, equally good a fit with the facts). so what happens to each side when their own machinery ties? does a humean have to say there are no laws there, or two equally good law systems, or what? and does his side get to say a tie like that is impossible bc the laws are whatever produces the facts? whatever the predictions are, both sides have to agree in advance that this case counts as evidence, so work it into the cruxes.

  one more thing: if part of our whole arguement turns out to just be us using the word "governs" differently, say which part and why, bc if its just words i want to know so i can win the actual arguement and not the vocabulary one lol.

  format: numbered list of agreed claims first, then a disagreements table, then the cruxes with predictions, then the 12-particle case. keep it readable for two hs students -- explain any jargon fast or don't use it. the very last line has to start with "Verdict:" and give a one-sentence answer on whether any part of the dispute is merely verbal.
