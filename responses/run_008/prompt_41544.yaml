      *   User suspects it's a prejudice.
      *   *Argument:* Transparency requires that if I have evidence $E$, I know I have $E$. But HOE cases often involve *not* knowing how $E$ supports $p$ until the HOE arrives. If Transparency held, HOE would be redundant. Therefore, Transparency is indeed a camp prejudice (internalist idealization) that HOE exposes as false.

  5.  **Score the Contenders:**
      *   *Deflationary (HOE = FOE):* Fails Processing Sensitivity. Can't explain why "I'm drunk" differs from "It's raining."
      *   *Defeat-Only:* Fails Calibration Sensitivity (sometimes HOE confirms). Fails Self-Undermining (if it only defeats, how do we evaluate the defeat?).
