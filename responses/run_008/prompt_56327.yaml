prompt: |-
  I'm a litigation associate, and my working vocabulary is tort causation: the but-for test, substantial factor, superseding causes, foreseeability, the occasional case where a court treats an entire course of conduct as a single unit. Years ago I minored in philosophy, and I gathered that there is a standing debate between a counterfactual theory of causation and an interventionist one. I half-remember names like Lewis and Woodward being attached to these views, but don't trust my memory, and correct me if I've mixed them up. Restate that debate in the vocabulary I actually use in briefs, as faithfully as you can: if the counterfactual theory is essentially the but-for test, say so; and show me what an intervention would be in my terms, if my vocabulary contains anything for them at all. Then give me the residue report: which parts of the philosophers' disagreement map onto doctrinal problems I already argue, which had to be distorted to fit, and which have no counterpart in anything a court says. On the residue, I want a verdict, not a survey: is legal doctrine silently doing the work the philosophers theorize, or did the philosophers invent problems that law has no use for, or were the two theories never as far apart as the literature makes them look? Say how confident you are in each of your main claims, and single out the one you are least sure of. Write in continuous prose only, like an email to a colleague: no headings, bullet points, bold text, or tables.
