answer: |-
  Hi there, it is good to hear from you, and your memory is serving you well enough that you do not need to worry about having mixed up the core associations. David Lewis is indeed the primary figure behind the counterfactual theory of causation, and James Woodward is the one most closely tied to the interventionist or manipulability account. When you translate the counterfactual theory directly into the vocabulary we use in briefs, it is essentially the but-for test, nothing more and nothing less. Lewis argues that causation holds if and only if, had the cause not occurred, the effect would not have occurred, which is precisely the language we use when we argue that but for the defendant's negligence, the plaintiff would not have suffered harm. The interventionist theory is slightly harder to pin to a single doctrinal label, but it maps most faithfully onto the substantial factor test, particularly in those concurrent cause cases where the but-for test fails. In Woodward's terms, an intervention is a change in a variable that alters the outcome while holding other factors fixed, which in our work looks like asking whether the defendant's conduct was a significant enough contributor to the harm that manipulating or removing it would have changed the risk profile, even if another cause was also present. You can think of an intervention in our terms as the analytical move we make when we treat an entire course of conduct as a single unit to see if it was operative enough to matter, rather than getting bogged down in whether it was the sole necessary condition.

  Regarding the residue report of how these philosophical disagreements map onto our doctrinal problems, the overlap is strongest on the issue of overdetermination, which is where the but-for test breaks and the substantial factor test takes over. This maps cleanly onto the philosophical problem where two fires burn a house down simultaneously; the counterfactual theory struggles here because neither fire is strictly but-for the damage, whereas the interventionist account handles it by showing that intervening on either fire would have changed the outcome in some possible scenarios. However, some philosophical nuance had to be distorted to fit our framework, specifically around foreseeability and superseding causes. Philosophers often treat these as causal questions about the structure of events, but in our briefs, we treat them as policy limitations on liability, often conflating causal potency with normative blame. There is also a significant portion of the philosophical debate that has no counterpart in what a court says, specifically the metaphysical grounding of what causation actually is. Courts do not care about the ontology of causal relations; they care about liability assignment, so when philosophers argue about whether causation is a physical process or a probabilistic dependency, that is residue that gets discarded because it offers no utility in arguing for summary judgment.

  My verdict on whether legal doctrine is silently doing the work the philosophers theorize, or if the philosophers invented problems the law has no use for, or if the theories were never as far apart as they look, is that the two theories were never as far apart in practice as the literature makes them look. The law is pragmatic and eclectic, using counterfactual reasoning as a default because it is administratively cheap, and switching to something resembling interventionist reasoning when the counterfactual yields absurd results, without worrying about the theoretical consistency. I am highly confident, about ninety percent sure, that the Lewis counterfactual theory is functionally identical to the but-for test we argue every day. I am moderately confident, perhaps seventy percent sure, that the Woodward interventionist theory maps onto the substantial factor test, because substantial factor is often a catch-all for policy considerations rather than a strict causal test. I am about eighty percent confident in my verdict that the theories are closer in practice than in theory because the law prioritizes results over metaphysical purity. The claim I am least sure of is the specific mapping of the interventionist theory to the substantial factor test, because substantial factor is sometimes used by courts to smuggle in proximate cause analysis rather than pure causation, which muddies the philosophical parallel. Ultimately, you can rely on the but-for language as your counterfactual baseline, but when you face overdetermination, you are effectively making an interventionist argument when you urge the court to treat the defendant's conduct as a substantial factor, even if you do not need to cite Woodward to win the motion.
