      *   (2) ZFC $\vdash$ "$\mathbb{R}$ is uncountable" $\to$ $M \models$ "$\mathbb{R}$ is uncountable". *Valid (Soundness/Completeness).*
      *   (3) $M$ is countable (externally) $\to$ $\exists$ bijection $f: \omega^M \to \mathbb{R}^M$. *Valid (from the meta-theory perspective).*
