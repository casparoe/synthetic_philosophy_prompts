answer: |-
  1. The system must detect violations of the rule's intent rather than just its literal wording to prevent users from gaming the system while technically complying. Failure here renders enforcement useless against bad actors who exploit the gap between code and context.
  2. It must allow for overrides when strict policy application produces outcomes universally recognized as unjust, even if no specific rule permits the exception. Without this capability, the system becomes morally brittle, enforcing errors simply because they are codified.
  3. The system must possess a method for resolving genuine conflicts between competing values when no existing rule settles which principle wins. If it lacks this, it will either freeze or act arbitrarily in complex situations where ethical trade-offs are unavoidable.
  4. There must be a clear chain of responsibility assigning blame for harmful actions to designers or operators, though this may be logically incompatible with Requirement 3 if the machine makes autonomous moral judgments. Ambiguity here creates a responsibility gap where victims have no recourse and no one is motivated to prevent future errors.
  5. The system must generate intelligible explanations for its decisions so that affected individuals understand why an action was taken against them. A bare decision without justification violates due process and prevents users from correcting their behavior.
