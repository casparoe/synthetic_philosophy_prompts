  # Joint Statement on the Metric of Egalitarian Justice

  **Preamble**
  We, the undersigned, acknowledge that while our theoretical starting points differ regarding the *currency* of distributive justice, we share a commitment to mitigating the moral arbitrariness of brute luck. This statement delineates our substantive convergence, clarifies our irreducible divergences, and identifies empirical and theoretical cruxes that determine the validity of our respective frameworks.

  ### I. Substantive Agreed Claims

  1.  **The Moral Arbitrariness of Endowment:** We agree that inequalities arising from unchosen circumstances (brute luck)—such as genetic endowments, social class at birth, or involuntary disability—are presumptively unjust and require redress. Neither natural nor social lotteries should dictate a person's standing in society.
  2.  **The Disability Consensus:** We agree that a just distribution is not strictly arithmetical. A person born with significant impairments (e.g., blindness or mobility restrictions) is owed a greater share of social resources than an able-bodied person to secure comparable standing. Equality requires asymmetry in treatment to account for differential needs.
  3.  **The Problem of Adaptive Preferences:** We agree that subjective reports of satisfaction are not definitive proof of justice. Preferences formed under conditions of deprivation, oppression, or restricted horizons (adaptive preferences) are distorted; satisfying such preferences does not fully discharge the demands of justice.
  4.  **Responsibility for Choice:** We agree that not all inequalities are unjust. When individuals make informed, voluntary choices from a fair baseline that lead to differential outcomes (option luck), justice does not necessarily require compensation. A theory of equality must distinguish between circumstance and ambition.
  5.  **The Democratic Minimum:** We agree that no individual should be abandoned to destitution or social exclusion, even if their plight results from poor choices. While responsibility matters, the demands of human dignity and democratic citizenship set a floor below which no citizen should fall.

  ### II. Table of Disagreements

  | Topic | Welfare Egalitarian Formulation | Resource Egalitarian Formulation | Classification & Rationale |
  | :--- | :--- | :--- | :--- |
  | **Expensive Tastes** | Individuals with involuntary, high-cost preferences (e.g., a psychological need for luxury to achieve normal satisfaction) are owed compensation because their capacity for welfare is impaired without it. | Individuals bear responsibility for their own preference structure; subsidizing expensive tastes unfairly burdens those with modest tastes and violates ambition-sensitivity. | **Genuine.** This is a fundamental clash over whether justice targets the *satisfaction* of the person or the *fairness* of the bundle held. |
  | **Conversion Factors** | The metric of justice must account for interpersonal differences in converting means into functioning; two people with identical resources may have vastly unequal lives due to physiology or social context. | The metric of justice should focus on the fairness of the resource auction/insurance ex-ante; variations in conversion are risks covered by hypothetical insurance, not direct adjustments to the metric. | **Genuine.** This concerns the *site* of egalitarian concern: the backend (functioning) vs. the frontend (means). |
  | **Determination of Metric** | The correct distribution is determined by assessing what people can actually do and be (capabilities/functionings) in their specific context. | The correct distribution is determined by a hypothetical insurance scheme where agents decide what coverage to purchase against misfortune behind a veil of ignorance. | **Partly Verbal.** Both use insurance/intuition pumps, but Welfare sees insurance as a proxy for welfare protection, while Resource sees it as the constitutive definition of fairness. |

  ### III. Cruxes and Test Cases

  We identify the following cases as decisive for evaluating our theories. We record our predictions below to be tested against future reflective equilibrium.

  **Crux 1: The Unchosen Expensive Taste**
  *   **Test Case:** A person has a clinically verified, unchosen psychological dependency on rare champagne to achieve a baseline level of anxiety-free functioning, costing 10x the average budget.
  *   **Welfare Prediction:** Justice requires subsidizing the champagne. To deny it is to condemn them to a life of anxiety significantly below the norm through no fault of their own.
  *   **Resource Prediction:** Justice does not require subsidizing the champagne. The individual must cultivate cheaper tastes or manage their psychology; the social bundle is fair, and the cost of their specific personality is theirs to bear.

  **Crux 2: The High-Cost Accommodation**
  *   **Test Case:** A mobility impairment can be fully mitigated by a ramp and elevator costing $500,000, allowing full participation, or left unmitigated, leaving the person housebound but financially "equal" in raw cash.
  *   **Welfare Prediction:** The resources must be provided. The metric is the *functioning* (mobility/participation); cash equality here is a failure of justice because the conversion rate is ignored.
  *   **Resource Prediction:** The resources should be provided *if* the hypothetical insurance market would have covered it. If the cost is so high it would bankrupt the insurance pool, the claim is weaker; the metric is the *resource cost* relative to the social pool.

  **Crux 3: The Contented Restricted Life (Adaptive Preferences)**
  *   **Test Case:** An individual reports high life satisfaction despite having sharply restricted options (e.g., a rigid, cloistered life), due to adaptive preference formation.
  *   **Welfare Prediction:** This is an injustice requiring intervention. The reported welfare is unreliable; justice requires expanding their capabilities even if they currently report satisfaction.
  *   **Resource Prediction:** This is an injustice of *option restriction*, not welfare deficit. We must ensure they hold the resources to leave, but if they choose to stay, we respect that agency. The injustice is the lack of the exit option, not the low welfare.

  **Crux 4: The Voluntary Gambler (Added Crux)**
  *   **Test Case:** An individual voluntarily gambles their fair share of resources on a high-risk venture and loses everything, now facing destitution.
  *   **Welfare Prediction:** Partial rescue is required. While the choice was voluntary, allowing a citizen to fall below the democratic minimum violates the commitment to equal moral worth.
  *   **Resource Prediction:** No rescue beyond the absolute survival floor. To compensate is to tax the prudent to subsidize the reckless, violating the ambition-sensitivity constraint of resource equality.

  ### IV. On the Anderson Critique

  Regarding Elizabeth Anderson's critique that luck egalitarianism abandons victims of their own choices to the harshness of the market: we acknowledge this charge applies to both our frameworks, but with different intensities. The Resource view is more vulnerable to the charge of "harshness," as its commitment to ambition-sensitivity strictly limits compensation for option luck, potentially leaving the imprudent without a safety net. The Welfare view is less vulnerable regarding *suffering* (since low welfare triggers concern) but more vulnerable regarding *paternalism* (since it may override an agent's own valuation of their life). However, we both concede that Anderson is correct on the fundamental point of democratic standing: neither of us believes justice permits citizens to be left to starve or lose their political voice. We both incorporate a "democratic minimum" (Claim 5) specifically to inoculate our theories against this critique, acknowledging that equality of status trumps strict adherence to luck-compensation when the two conflict.

