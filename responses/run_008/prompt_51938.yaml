      *   **Side B (Resource Egalitarian - likely Dworkinian):** Focuses on means, external/internal resources, ambition-sensitivity, endowment-insensitivity. Concerned with personal responsibility and the cost of tastes.
      *   **Common Ground:** Both are luck egalitarians (broadly). Both reject strict outcome equality regardless of choice. Both care about mitigating brute luck. Both acknowledge disability/impairment requires compensation.

