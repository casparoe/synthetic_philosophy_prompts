  The cardboard sign taped to the card table wobbled in the breeze, *YARD SALE* written in thick black marker. Sarah sat behind the table, shielding her eyes from the Saturday sun. A man in a windbreaker was poking at a stack of old hardcovers.

  "Two dollars?" he asked, holding up a copy of *The Great Gatsby*.

  Sarah opened her mouth to say yes, take it, just get rid of it. That was the plan. Clear the house. Move on. But what came out was different. She tilted her head to the left, exactly the way Mom used to when she was calculating a tip.

  "Oh, honey," Sarah said, her voice dropping an octave, softening at the edges. "I couldn't take two dollars for that. The spine's cracked. Look at the wear on this. It feels like robbery."

  The man blinked. "So... fifty cents?"

  "Seventy-five," Sarah said, smiling a smile that didn't quite feel like hers. "And you give me a hug for the road."

  The man laughed, handed over the coins, and walked away. Sarah stared at the seventy-five cents in her palm. She hadn't hugged a stranger in ten years. She hadn't called anyone "honey" since high school. She put the coin in the box and felt a strange, warm ripple in her chest, like a memory that wasn't hers had just fired a synapse.

  Inside the apartment, the air smelled of dust and lavender polish. Jen was kneeling by the china cabinet, wrapping porcelain in newspaper. She picked up a ceramic goose wearing a bonnet. It was hideous. Pink cheeks, glazed eyes, a monstrosity they had all mocked at Thanksgiving for twenty years.

  "Garbage," Jen whispered. She moved to toss it into the donate box.

  Her hand stopped. Her fingers traced the rough paint on the goose's wing. A sudden, sharp defensiveness rose in her throat, hot and immediate.

  "It has character," she said to the empty room.

  She froze. She hadn't thought that. She had thought *it's ugly*. But the words had come out with a conviction that felt borrowed. She remembered Mom saying exactly that when Aunt Linda suggested throwing it out. *It has character, Linda. It brings light.*

  Jen looked at the goose. She didn't like it. She still thought it was tacky. But she couldn't put it in the box. It felt like erasing a variable in an equation that was still being solved. She wrapped it carefully in three layers of newsprint and set it aside for herself.

  On the front porch, Mark was on the phone with the landlord. He was leaning against the railing, rubbing his temples. The lease was up, the cleanup needed to be finished by Monday, and the stress was a tight band around his skull.

  "Look, Mr. Henderson," Mark said. "We're doing our best."

  He paused. He usually didn't pause there. He usually rushed the explanation. But he found himself waiting, letting the silence sit on the line, giving the other man space to breathe. It was Mom's rhythm. She never rushed a conversation; she let the words settle like sediment.

  "We just... need a little time," Mark continued. The cadence was unmistakable. The slight lift at the end of the sentence, turning a statement into a shared understanding. "You know how these things go."

  "I suppose," the landlord grumbled.

  "Thank you, dear," Mark said.

  He hung up and stared at the phone. *Dear?* He never called men *dear*. He shoved the phone in his pocket and went inside, shaking off the feeling like water.

  By Sunday evening, the apartment was mostly bare. Boxes were stacked by the door, labeled in sharpie: *KEEP*, *DONATE*, *TRASH*. The three siblings sat on the floor of the living room, exhausted. The only light came from a single lamp plugged into an extension cord.

  Between them sat a small shoebox. Inside were mismatched buttons, spools of thread, and a pair of silver thimbles.

  "You should take it," Sarah said, nodding at the box. "You have the sewing machine."

  "I don't sew," Jen said. "You take it. You're the oldest."

  "It belongs here," Mark said. "It's part of the house."

  "It's not part of the house, it's junk," Sarah snapped. But her voice wasn't sharp. It was firm, gentle, authoritative. "We're not leaving it for the landlord."

  "I'm not taking it," Jen said. She crossed her arms. "You know I don't have the space."

  "Oh, Jen," Sarah said. "Don't be difficult."

  "Don't tell me to be difficult," Jen shot back. "You're the one holding onto everything."

  Mark rubbed his face. "Girls. Please."

  The word hung in the air. *Girls.* They were forty, forty-two, and forty-five. Mom was the only one who called them *girls* with that specific tone of weary affection.

  They looked at each other. The anger drained out of the room, replaced by a sudden, uncanny quiet. They were all sitting in the same posture now, legs crossed, hands resting on their knees. They were all looking at the box with the same expression—a mix of reluctance and protectiveness.

  "It's just buttons," Mark said.

  "It's not just buttons," Sarah and Jen said simultaneously.

  They stopped. The silence stretched out, heavy and electric. Sarah looked at her hands. Jen looked at the box. Mark looked at his siblings. None of them moved to pick it up. None of them wanted to leave it.

  "We'll split it," Sarah said.

  "Equally," Jen added.

  "Equally," Mark agreed.

  They reached for the box at the exact same moment, their hands hovering over the lid, three different people moving with a single, synchronized intent.
