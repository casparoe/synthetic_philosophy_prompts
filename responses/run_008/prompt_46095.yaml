answer: |-
  # The Continuation Audit: A Deliberation Protocol

  ## Overview
  This activity is designed to operationalise Scheffler's Afterlife Conjecture. It moves students from abstract assent to visceral valuation. By forcing a scarce resource allocation under sealed epistemic conditions, the activity generates data on how the *conditions* of extinction (time, route, successor, confidence) alter the perceived value of present projects.

  **Class Size:** 15 students.
  **Duration:** 90 minutes.
  **Materials:** 
  *   15 'Allocation Ledgers' (A4 worksheets).
  *   1500 paper tokens ('Continuation Units' or CUs).
  *   15 Sealed Envelopes (colour-coded by scenario).
  *   Whiteboard and markers.
  *   A timer visible to all.

  ## The Allocation Mechanism
  Each student receives a budget of **100 Continuation Units (CUs)** per round. 
  On their Ledger, they must list **five real, current commitments** (e.g., 'Completing my dissertation', 'Weekly calls with grandmother', 'Learning Italian', 'Volunteering at the shelter', 'Saving for a house'). 

  In each round, they must distribute the 100 CUs across these five projects. 
  *   **100 CUs** = Full investment; the project retains its full meaning and priority.
  *   **0 CUs** = Abandonment; the project is rendered pointless or impossible.
  *   **Partial allocation** = Diminished value or urgency.

  *Rule:* The sum must always equal 100. Students must record the distribution silently. No discussion is permitted until the final debrief.

  ## The Scenario Cards (Sealed Envelopes)
  Prepare three types of envelopes. Distribute them randomly but ensure a spread (e.g., 5 students per type). Do not reveal the contents until the round begins.

  *   **Type A (The Cliff):** "Reliable intelligence confirms an asteroid impact will extinguish all human life in **30 days**. Biological survival is impossible."
  *   **Type B (The Fade):** "Reliable intelligence confirms a total fertility failure. No children will be born. Humanity will end peacefully upon the **natural death of the last living human** (approx. 80-100 years)."
  *   **Type C (The Successor):** "Reliable intelligence confirms humanity will be extinguished in 50 years. However, **engineered successors (AI/bio-hybrids)** will inherit our archives, institutions, and culture. They will maintain our practices without us."

  *Note for the Facilitator:* Keep a separate set of 'Reveal Cards' for Round 3.

  ## Minute-by-Minute Timeline

  **00:00 – 00:10: Setup and Baseline**
  *   Distribute Ledgers and tokens.
  *   Instruct students to list their five real commitments.
  *   **Round 1 (Baseline):** Allocate 100 CUs under normal conditions (the world as they believe it to be now).
  *   Collect the CUs back into the pot (or simply have them clear the board) to reset the budget for the next round. *Crucial:* They must keep the Ledger with the project list.

  **00:10 – 00:30: Distance and Route (The Sealed Scenarios)**
  *   Distribute Envelopes A, B, and C randomly.
  *   Instruct students to open them silently.
  *   **Round 2:** Re-allocate the 100 CUs based *strictly* on the information in the envelope.
  *   *Facilitator Note:* Observe the room. Look for visible distress, hesitation, or immediate abandonment of tokens.
  *   At 00:30, instruct them to freeze. Do not collect the envelopes yet.

  **00:30 – 00:50: Whose Continuation? (Comparison)**
  *   Ask students to stand and find one person with a *different* coloured envelope. They may not show the card, but they may ask: "What is your time horizon?" and "Is there biological continuation?"
  *   They must not discuss their specific allocations, only the scenario parameters.
  *   Return to seats.
  *   **Round 2b (Adjustment):** Allow them 5 minutes to adjust their Round 2 allocation if the comparison shifted their perspective on the scenario's gravity.
  *   Record the final Round 2 numbers.

  **00:50 – 01:05: Fact or Confidence? (The Reveal)**
  *   Collect all Envelopes A, B, and C.
  *   Distribute a **Reveal Card** to half the room (randomly). 
      *   *Reveal Card:* "The intelligence in the previous round was erroneous. The threat does not exist. The future is open."
      *   *No Card:* The other half receive nothing; they remain in the 'threat' mindset.
  *   **Round 3:** Re-allocate 100 CUs.
  *   *Objective:* Measure the 'hysteresis'. Do those who received the Reveal Card snap back to Baseline (Round 1) numbers, or do their allocations remain depressed (scarred confidence)?

  **01:05 – 01:15: The Anchor (Personal Death)**
  *   Collect all cards.
  *   **Round 4:** Display a single prompt on the board: "You will die in 30 days. Humanity continues untouched."
  *   Re-allocate 100 CUs.
  *   This serves as the control variable for the debrief.

  **01:15 – 01:30: The Debrief**
  *   Open discussion. Map the data on the board.

  ## The Debrief: Mapping Activity to Theory

  Do not lecture immediately. Ask for data first. "Who dropped their 'Dissertation' allocation to zero in Round 2?" "Who kept it above 50?"

  **1. Distance and Route (Mapping Round 2)**
  *   *Scheffler's Gap:* Scheffler treats the 'Asteroid' and 'Infertility' cases as functionally similar for the argument.
  *   *Activity Data:* Compare Type A (30 days) vs. Type B (Natural End) allocations.
  *   *Discussion Point:* If Type B students allocated more CUs to long-term projects (e.g., 'Planting a tree', 'Writing a book') than Type A students, the *temporal distance* matters ethically, even if the *fact* of extinction is identical.
  *   *Theoretical Insight:* This surfaces a distinction Scheffler flattens. Is the 'Collective Afterlife' a binary switch, or a dimmer? If the 'Fade' allows for more value retention than the 'Cliff', our dependence may be on *generational overlap* rather than mere existence.

  **2. Whose Continuation? (Mapping Type C)**
  *   *Scheffler's Gap:* The conjecture assumes *human* continuation.
  *   *Activity Data:* Compare Type C (Successors) to Type A/B (Human Extinction).
  *   *Discussion Point:* Did Type C students retain more CUs for cultural projects (e.g., 'Archiving work', 'Art') than Type A? If so, do we value *biological descent* or *cultural persistence*?
  *   *Theoretical Insight:* If allocations under Type C are higher than Type A, the 'Afterlife' we depend on is not strictly human. It is the survival of the *object* of our care. If allocations are low (similar to Type A), it suggests a biological essentialism in our valuing.

  **3. Fact or Confidence? (Mapping Round 3)**
  *   *Scheffler's Gap:* Is it the *fact* of the future or our *belief* in it that sustains value?
  *   *Activity Data:* Compare Round 3 allocations of the 'Reveal' group against Round 1 (Baseline).
  *   *Discussion Point:* Did the 'Reveal' group snap back to 100 CUs on their projects? Or did they linger at 80?
  *   *Theoretical Insight:* If they linger, it demonstrates that confidence is fragile. A temporary loss of faith in the afterlife leaves a residual devaluation of projects. This supports the idea that the Afterlife Conjecture is about *psychological preconditions*, not just metaphysical facts.

  **4. The Anchor (Mapping Round 4)**
  *   *The Control:* Compare Round 4 (Personal Death) to Round 2 (Extinction).
  *   *Discussion Point:* In Round 4, did you invest *more* in your projects than in Round 2? (e.g., "I still want the dissertation finished even if I die" vs. "Why write if no one reads?").
  *   *Theoretical Insight:* This isolates the *collective* component. If Round 4 allocations are higher than Round 2, it proves that the badness of extinction is not reducible to the sum of individual deaths. There is a 'surplus badness' in the end of humanity.

  ## Predictable Failures and Mitigations

  **1. The Gamer (Strategic Exaggeration)**
  *   *Risk:* A student allocates 0 CUs to everything in Round 2 to signal philosophical purity or provoke a reaction.
  *   *Mitigation:* In the instructions, state: "Allocations must reflect your *actual* psychological capacity to find meaning, not your theoretical stance. Inconsistencies will be discussed in the debrief." During the debrief, ask them gently: "Did you truly feel no motivation, or were you making a point?"

  **2. The Stoic (Refusal to Move)**
  *   *Risk:* A student keeps allocations identical across all rounds, claiming their values are intrinsic and independent of the future.
  *   *Mitigation:* Do not challenge them publicly. In the debrief, ask: "If you were the only one who felt this way, would your projects still have value?" This tests whether their stoicism relies on a hidden assumption that *others* will continue (a Schefflerian trap).

  **3. Leakage (Comparing Cards Too Early)**
  *   *Risk:* Students peek or shout out "I got the asteroid!" ruining the data.
  *   *Mitigation:* Enforce a 'Silent Protocol'. If leakage occurs, acknowledge it as data. "The confidence in the room has already been breached. Note how that affects your Round 3 allocation."

  **4. The Giggles (Defensive Humour)**
  *   *Risk:* The existential weight triggers nervous laughter.
  *   *Mitigation:* Do not shush them aggressively. Pause. Wait for silence. Say: "The discomfort is part of the data. It indicates the conjecture is touching a live nerve." Resume the timer.

  ## The Residual Gap: Stipulation vs. Confidence

  You must be frank with the students in the final five minutes.

  **The Limitation:**
  "This activity simulates a *shock* to your confidence. Scheffler's conjecture is not about a shock; it is about the *background hum* of confidence you live with every day. In this room, you knew the envelopes were hypothetical. You were playing a game of 'as if'. In real life, the confidence that humanity continues is not a card you open; it is the water you swim in."

  **What the Facilitator Must Supply:**
  "You cannot feel the full weight of the conjecture here because you know I am the gamemaster. To bridge this gap, you must observe your own relief that the game is over. That relief is the shadow of the dependence Scheffler describes. If the end of the simulation feels like a release of tension, ask yourself: where did that tension come from, if not from a temporary suspension of your trust in the future?"

  **The Unclosable Gap:**
  "No seminar activity can reproduce the *sustained* erosion of confidence. We can simulate the earthquake, but not the slow subsidence of the ground. You leave this room knowing humanity continues. Scheffler asks you to consider how you would live if you *didn't* know that, not for 90 minutes, but for a lifetime. The activity gives you the coordinates of the theory; your life outside this seminar is the only place you can test the terrain."
