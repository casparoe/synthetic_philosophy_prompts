answer: |-
  Dear friends, I have been reflecting deeply on our impasse regarding the special composition question, and I write this to offer a diagnosis of why our discussions have ceased to yield fruit, along with a suggestion for what might genuinely count as progress from this point forward. Your working hypothesis that the dispute is partly verbal is compelling and aligns with a significant strand of contemporary meta-ontology, particularly the deflationary work of scholars like Eli Hirsch, who argue that nihilists and universalists often agree on all the concrete facts about the arrangement of simples while merely disagreeing over the application of the word exists. When the nihilist says there is no chair and the universalist says there is, they may both agree that there are simples arranged chairwise, differing only on whether that arrangement warrants the semantic licence to quantify over a composite object. If this is correct, then our stalemate is not a failure of argumentation but a failure to recognise that we are operating with different conceptual schemes that are equally valid descriptions of the same underlying reality. However, the presence of the brutal compositionists in our group complicates this deflationary picture, for they insist that there is a substantive fact of the matter regarding which fusions exist, even if that fact is unexplainable. Their position suggests that the dispute cannot be merely verbal, because a verbal dispute implies that there is no further fact to be had, whereas the brutalist claims there is a fact that simply resists our epistemic access or conceptual analysis.

  This leads me to a diagnosis that the special composition question is not a single question but rather several distinct inquiries wrongly bundled under a single heading, conflating semantics, metaphysics, and epistemology. The nihilist and universalist are often engaged in a semantic or conceptual dispute about how we ought to regiment our language and whether our quantifiers should be restricted to joints in nature or allowed to range freely over any plurality. The brutalist, conversely, is making a metaphysical claim that the structure of reality itself determines composition without regard for our explanatory needs, thereby positing a substantive disagreement that the verbal thesis denies. The reason our arguments never land is that the nihilist is arguing from a position of ontological parsimony and the universalist from a position of logical simplicity, while the brutalist is arguing from a position of metaphysical realism, and none of these premises are commensurable within the framework of the special composition question as currently formulated. We are talking past one another because the nihilist thinks the burden of proof is on the universalist to explain unity, the universalist thinks the burden is on the nihilist to explain restriction, and the brutalist thinks the burden is misplaced because explanation is not required for existence. Consequently, the impasse is a sign that the question is ill-posed in its current form, inviting us to seek necessary and sufficient conditions for a phenomenon that may either be ubiquitous, non-existent, or brute, depending on which meta-ontological framework one adopts.

  Given this diagnosis, genuine progress would not look like one side converting the other, but rather a shift in the debate from first-order ontology to meta-ontology, where we explicitly negotiate what we want our ontological commitments to achieve. We would make progress if we could distinguish between the question of what exists in the fundamental structure of reality and the question of which conceptual scheme is most useful for our scientific or ordinary purposes. A new kind of case that might move us forward would not be a counter-example to a specific condition of composition, but rather a demonstration that one of these positions leads to an instability in other areas of philosophy, such as ethics or the philosophy of mind. For instance, if the nihilist cannot account for moral responsibility without composite agents, or if the universalist cannot account for causation without an explosion of causal relata, then pragmatic pressures might force a redistribution of the terrain. However, I doubt anything could actually end the debate in the sense of providing a knock-down proof that settles the matter once and for all, because the dispute is ultimately rooted in differing intuitions about the nature of existence and the purpose of metaphysical inquiry, which are not susceptible to empirical falsification. The debate may dissolve if we collectively agree to treat ontological claims as proposals for linguistic frameworks rather than discoveries of mind-independent facts, but this requires a consensus on meta-ontology that is just as hard to reach as a consensus on composition itself.

  I must be explicit about where my own reasoning is most likely to fail, for I am not immune to the errors I perceive in our group. The step in my diagnosis I would give up first is the claim that the dispute is partly verbal, specifically if confronted with a robust argument for quantifier variance being incoherent. Ted Sider has argued forcefully that existence is structured and that there is a single most natural quantifier meaning that carves reality at its joints, which would imply that the nihilist and universalist cannot both be right even in a deflated sense. If Sider is correct that there is a privileged structure to reality that our quantifiers must track to be truly describing the world, then the verbal dispute hypothesis collapses, and one side is simply mistaken about the structure of existence. Furthermore, if the brutalists are right that there is a brute fact of the matter, then the dispute is substantive regardless of our semantic practices, and my attempt to dissolve the tension via meta-ontology would be ignoring the very reality we are trying to investigate. I would be pushed to a different diagnosis altogether if it could be shown that our ordinary usage of existential claims is already fixed enough to rule out one of the positions as linguistically incompetent, rather than just metaphysically revisionary. Until such a demonstration is made, however, I maintain that our stagnation is a feature of the question itself rather than a bug in our reasoning, and that we should perhaps spend our next meeting discussing not when composition occurs, but why we care whether it does.
