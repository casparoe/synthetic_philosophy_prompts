  Your sister is operating with a sophisticated philosophy of history that blends **structuralism** (outcomes are driven by underlying forces) with **contingency** (specific agents and moments matter). Her ledger suggests she is not a strict determinist, nor a pure "Great Man" theorist. She distinguishes between *pressures* and *events*.

  Here is the breakdown of the three candidate rules, their application to your new questions, the theoretical divergence between them, and the specific tests you need to run to crack her code.

  ### 1. The Three Rules Defined

  *   **Rule 1 (Convergence):** An outcome is inevitable if multiple, independent actors or lines of inquiry are pushing toward it simultaneously. (Key indicator: "Someone else was doing it too.")
  *   **Rule 2 (Grain/Scale):** An outcome is inevitable if it is a broad structural trend, but contingent if it is a specific configuration or artifact. (Key indicator: "The *what* is inevitable, the *how* is not.")
  *   **Rule 3 (Singular Window):** An outcome is inevitable if the historical pressure builds until *some* break occurs, but contingent if it relies on a specific, non-recurring opportunity or founding moment. (Key indicator: "If not then, the door closes.")

  ### 2. Predictions for the Three New Questions

  On these three specific questions, **all three rules largely converge on the same verdicts.** This is why they all fit her past ledger so well; they are different lenses focusing on the same structural features.

  **(1) If Darwin had died young, would evolution by natural selection have been established textbook science by 1885?**
  *   **Rule 1 (Convergence):** **Yes.** Alfred Russel Wallace was independently formulating the same theory. The intellectual climate (Malthus, geology, biology) was converging on the idea.
  *   **Rule 2 (Grain):** **Yes.** The *theory* is a broad scientific truth (high grain), not a specific book title like *On the Origin of Species* (low grain).
  *   **Rule 3 (Window):** **Yes.** The "window" of mid-19th-century biology was open. The pressure was building; if Darwin hadn't pushed the door open, Wallace or Hooker would have shortly after.
  *   **Sister's Likely Verdict:** **Yes.** (Matches her ruling on Calculus/Newton).

  **(2) If Constantine had never converted, would the Roman world by about 600 CE nonetheless have been dominated by a single universalist, scriptural religion?**
  *   **Rule 1 (Convergence):** **Yes.** Christianity was not the only candidate. Mithraism, Sol Invictus, Manichaeism, and Judaism were all competing for universal dominance. The lines were converging on *monotheism/universalism*, even if not specifically on *Christianity*.
  *   **Rule 2 (Grain):** **Yes.** The question asks about "a single universalist... religion" (broad outcome), not "Nicene Christianity" (specific configuration).
  *   **Rule 3 (Window):** **Yes.** The late Empire faced a crisis of cohesion that *required* a unifying ideology. The "window" was the structural need of the Empire, not just Constantine's vision.
  *   **Sister's Likely Verdict:** **Yes.** (Matches her ruling on German Unification/Bismarck).

  **(3) If the first commercially successful typewriters had settled on a different keyboard arrangement in the 1870s, would people today nonetheless be typing on roughly the arrangement we actually use?**
  *   **Rule 1 (Convergence):** **No.** QWERTY did not win because multiple independent lines converged on it as the optimal solution; it won due to early market dominance (Remington) and path dependence.
  *   **Rule 2 (Grain):** **No.** A keyboard layout is a "particular configuration" (low grain), not a broad trend like "mechanized writing."
  *   **Rule 3 (Window):** **No.** Once a standard is locked in via network effects, the "window" for changing it closes. If the first successful machine had a different layout, that window would have closed on *that* layout instead.
  *   **Sister's Likely Verdict:** **No.** (Matches her ruling on Shakespeare/Constitution).

  **Where the Rules Diverge:**
  On these three questions, the rules **do not diverge in their predictions.** They all point to the same answers. The divergence is theoretical: Rule 1 looks for *competitors*, Rule 2 looks for *specificity*, and Rule 3 looks for *timing*. To distinguish them, you need a case where one rule says "Yes" and another says "No."

  ### 3. Splitting Rule 1 (Convergence) and Rule 3 (Singular Window)

  You noted that Rules 1 and 3 agree on her entire ledger. To split them, you need a case where **many independent lines are converging (Rule 1 = Yes), but the opportunity relies on a singular, non-recurring political or historical moment (Rule 3 = No).**

  **The Test Case:** *"Would the first atomic bomb have been detonated by 1945 even without the Manhattan Project?"*

  *   **Rule 1 (Convergence) predicts: YES.**
      *   *Reasoning:* The physics of fission was discovered independently in Germany, the UK, the US, and Japan. Multiple nations had the scientific "lines" converging on the possibility of a bomb. The science was inevitable.
  *   **Rule 3 (Singular Window) predicts: NO.**
      *   *Reasoning:* The *deployment* and *funding* relied on the singular window of WWII existential urgency. If the war had ended differently in 1944, or if the specific political will of the Roosevelt/Churchill alliance (the "founding moment" of the Project) had faltered, the window for *wartime* detonation would have closed. The science would remain, but the specific outcome (Bomb by 1945) would not recur.

  **Why this splits them:** Rule 1 sees the scientific convergence and says "Inevitable." Rule 3 sees the unique political crisis and says "Contingent." If your sister rules **No**, she prioritizes the Window (Rule 3). If she rules **Yes**, she prioritizes Convergence (Rule 1).

  ### 4. Refuting the "Technical vs. Humanistic" Heuristic

  You suspected a simpler rule: *"Technical outcomes converge, humanistic ones don't."*
  **This rule is quietly refuted by her existing ledger.**

  *   **Refutation:** Compare **German Unification** vs. **The US Constitution**.
      *   **German Unification:** She ruled **Yes** (Inevitable). This is a political/structural outcome (often coded as "humanistic" or "political").
      *   **US Constitution:** She ruled **No** (Contingent). This is *also* a political/structural outcome (a legal document/government framework).
      *   **Conclusion:** Since she treats two political/structural outcomes differently, the distinction cannot be the *field* (Technical vs. Humanistic). It must be the *conditions* (Convergence/Grain/Window).
      *   *Why the difference?* German Unification had the "Convergence" of the Zollverein and nationalism (Rule 1). The US Constitution relied on a "Singular Window" of the Philadelphia Convention that, if collapsed, might not have reconvened (Rule 3).

