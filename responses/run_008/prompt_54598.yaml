answer: |-
  This is a remarkably sharp diagnosis. You have correctly identified that the regulatory dualism you observed—Expected Value (EV) for routine risks versus the Precautionary Principle (PP) for catastrophic tails—is structurally isomorphic to the Allais paradox. In the Allais setup, agents violate the Independence Axiom by overweighting certainty (the "certainty effect"). In your regulatory setup, the agency violates Independence by overweighting the catastrophic tail (a "catastrophe effect"), treating a small probability of ruin as lexically prior to the aggregation of smaller, routine harms.

  If we assume the regulator is a single agent maximizing a single Expected Utility (EU) function over a fixed set of outcomes, **your friend is right: the practice is formally incoherent.** It violates the Independence Axiom because the preference ordering flips depending on whether the "common consequence" is a routine background risk or a catastrophic tail risk. Under strict EU theory, if a safety retrofit is worth the cost in the routine track, it should be worth the cost in the catastrophic track provided the expected loss ($P \times V$) is equivalent. If the regulator vetoes the catastrophic project despite a lower expected loss than a routine project they approve, they are violating linearity in probabilities.

  However, to call it merely "politics" or "incoherent" misses the philosophical reconstruction available to you. The practice can be saved from incoherence, but only by abandoning the monistic assumption that **Expected Utility Theory (EUT)** is the sole normative standard for rational choice. The regulatory framework is not a failed application of EUT; it is a successful application of a **hybrid or pluralistic decision theory**.

  Here is the reconstruction of the implicit theory that makes the two-track system rational.

  ### 1. The Epistemic Defense: Knightian Uncertainty
  The most robust defense distinguishes between *Risk* (known probabilities) and *Uncertainty* (unknown or unreliable probabilities).
  *   **Track 1 (Routine):** Based on actuarial data (e.g., historical failure rates of valves). Here, probabilities are robust. EUT and the Independence Axiom apply. The calculation $P \times V$ is mathematically valid.
  *   **Track 2 (Catastrophic):** Based on models with high ambiguity (e.g., long-latency pesticide effects, novel reactor designs). Here, the probability $P$ is not a number but a range or a subjective confidence interval.
  *   **Reconstruction:** EUT requires precise probabilities. If $P$ is epistemically unstable, $E[U]$ is undefined. The Precautionary Principle is not a violation of EUT; it is a decision rule (like Maximin or Minimax Regret) invoked specifically when the conditions for EUT (precise probability measures) are not met. This preserves EUT for Track 1 without contradiction.

  ### 2. The Moral Defense: Threshold Deontology
  This approach argues that the "Value" column in your cost-benefit analysis changes category, not just magnitude.
  *   **Track 1:** Treats lives as fungible statistical units within a Social Welfare Function. This is consequentialist.
  *   **Track 2:** Treats catastrophic imposition as a rights violation. If a risk threatens a community with irreversible ruin, it violates a constraint on what can be done to persons without consent, regardless of the aggregate good.
  *   **Reconstruction:** This is **Threshold Deontology**. Consequentialist reasoning (EV) operates *within* constraints, but when a threshold of harm (catastrophe/irreversibility) is crossed, deontological constraints (PP) trump consequentialist aggregation. This violates the *Continuity Axiom* of EUT (which says every gamble has a price), but it does not violate rationality if one accepts that rights are lexically prior to utility aggregation beyond a certain point.

  ### 3. The Structural Defense: Rank-Dependent Utility
  If we insist on a single utility function, we must abandon the Independence Axiom in favor of **Rank-Dependent Utility (RDU)** or **Cumulative Prospect Theory**.
  *   **Theory:** In RDU, agents do not weight probabilities linearly. They apply a weighting function $w(P)$ that overweights small probabilities of extreme outcomes.
  *   **Reconstruction:** The regulator is not violating rationality; they are correctly applying a social weighting function where $w(P_{catastrophe}) \gg P_{catastrophe}$. The "inconsistency" you see is actually the curvature of the probability weighting function. This makes the practice consistent *descriptively*, but it requires admitting that the Independence Axiom is not a normative requirement for rationality (aligning with Allais's own view).

  ### Where the Practice is Underdetermined
  The practice is philosophically underdetermined because **all three reconstructions above license the same behavior.** You cannot look at a regulator approving a $10^5$ risk via EV and vetoing a $10^7$ risk via PP and know *why*.
  *   Are they doing it because the $10^7$ probability is unknowable? (Knight)
  *   Are they doing it because catastrophic harm violates rights? (Deontology)
  *   Are they doing it because society weights tail risks non-linearly? (RDU)

  The practice survives not because it is "just politics," but because it sits at the intersection of these three distinct rational frameworks. It is only incoherent if you insist, dogmatically, that **Monistic Expected Utility** is the only valid theory of rational choice. Given your background in Allais, you likely suspect that dogma is false. The regulator is intuitively practicing what Allais argued for: that rationality requires sensitivity to the *structure* of the probability distribution (the tail), not just its mean.

  ### Summary Table

  | Element of Practice | Presuppositions about Rational Choice or Value | Rival Views Ruled Out | Underdetermination Status |
  | :--- | :--- | :--- | :--- |
  | **Statistical-Life Arithmetic (Track 1)** | Probabilities are known and stable; outcomes are fungible; linearity in probabilities (Independence Axiom) holds. | **Strict Deontology** (lives cannot be traded); **Knightian Skepticism** (probabilities are never known); **RDU** (probabilities should be weighted non-linearly). | **Low.** This element strongly commits to Expected Utility Theory within the domain of "normal" risk. |
  | **Precautionary Vetoes (Track 2)** | Probabilities are either epistemically unstable (Knight) OR outcomes cross a moral threshold (Deontology) OR probability weighting is non-linear (RDU). | **Monistic Act Utilitarianism** (only total expected value matters); **Strict EUT** (Independence Axiom must hold universally). | **High.** Compatible with Knightian Uncertainty, Threshold Deontology, and Rank-Dependent Utility equally well. |
  | **The Switching Mechanism (Thresholds)** | There exists a distinct boundary between "risk" and "uncertainty" OR "routine harm" and "catastrophic rights violation." | **Continuity Axiom** (all goods/risks are comparable on a single scale); **Smooth Consequentialism** (no lexical priorities). | **Medium.** Requires a theory that allows for regime changes (hybrid rationality), but doesn't specify *which* hybrid. |
  | **Overall Two-Track System** | Rationality is pluralistic; different decision rules apply to different domains of the outcome space. | **Methodological Monism** (one decision rule for all choices); **Pure EUT** (Independence Axiom is universally binding). | **High.** The system is coherent *if* Monistic EUT is rejected. It is incoherent *only if* EUT is assumed to be the sole normative standard. |
