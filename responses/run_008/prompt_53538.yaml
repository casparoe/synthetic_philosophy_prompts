  been reading lesswrong and adjacent blogs since like 2015 so I've watched the whole "GPT killed Chomsky" discourse play out at least three times now, and I want to actually understand it instead of just nodding along. the arguement, from my friend and honestly half of my twitter feed: kids learn language from a comparatively tiny and messy dataset, Chomsky said this is only possible because of an innate universal grammar — that's the poverty of the stimulus — and now GPT-4-class models learned fluent grammar from scraped text alone, no innate grammar, just next-token prediction plus scale. so the analogy on the table is: pretraining is what child language acquisition actually is, the poverty of stimulus was just an underestimate of what a generic learner plus enough data can do, and Chomsky's argument was really a confession about the weakness of his own hand-coded 1950s-era learning algorithms. I basically believed this for years. then I finally read some of the pushback and now I'm not so sure.

  the comebacks I've seen are obvious enough: a kid gets on the order of millions to tens of millions of words before age five, versus trillions of tokens for a big model, so the kid is doing it at maybe five or six orders of magnitude less data; the transformer architecture is itself a bundle of priors that humans designed, so "no innate grammar" is quietly doing a ton of work in that sentence; and the kid learns embodied and interactively with live feedback while the model gets a static pile of text. but my problem is I've never seen anyone actually run the audit instead of just gesturing at "it's different." so: lay out the full correspondence table — what plays the role of the linguistic input, the innate faculty, the critical period, the negative evidence (parents correcting kids, which famously barely happens), that famous grammatical-but-nonsensical sentence Chomsky used to show syntax isn't just statistical association, and anything else you think belongs in the table — and for each row say whether the difference matters for the specific conclusion my friend wants, namely "poverty of stimulus is refuted, empiricism wins." seperate the disanalogies that are load-bearing for that conclusion from the ones that are just trivia, and tell me straight whether the conclusion survives once they're on the table or whether the analogy was carrying it the whole time. also if you think there's a better analogy lurking — e.g. that pretraining maps onto something other than first-language acquisition at all, like adult second-language learning, or like no kind of human acquisition at all — say so and say why it fits better.

  format: give me the correspondence table with columns [source_side | llm_side | maps_cleanly | why_it_matters_for_the_conclusion], then a section on where the mapping breaks, then close with a JSON object like {"verdict": ..., "load_bearing_disanalogies": [...], "trivia_disanalogies": [...], "better_analogy": ..., "does_the_conclusion_survive": ...} where verdict is one or two sentences and the arrays are short strings. ty, this has been bugging me for months.
