answer: |-
  ### Where the guest stands

  Your guest defends a deflationary view: manipulation isn't a sui generis moral wrong. He claims it's merely ordinary influence—framing, emotional appeals—labeled negatively because we dislike the outcome. For him, once you subtract lying and coercion, no distinct procedural wrong remains. If a target succumbs due to fatigue or emotion, that reflects their psychology, not a unique violation by the persuader. His project is to dissolve "manipulation" into standard categories of influence and moral disapproval.

  ### Questions and follow-ups

  1. You define manipulation as influence plus disapproval. If a surgeon uses framing to ensure a patient consents to a life-saving procedure, do you call that manipulation?
  **Follow-up:** If you say no, isn't that because you approve of the outcome? Doesn't that confirm your view that the label tracks our preferences, not the mechanism?

  2. Critics argue manipulation bypasses deliberative capacities, treating reason as a lever rather than an audience. Do you accept this description of the mechanism?
  **Follow-up:** If you accept the mechanism but deny the wrong, are you saying bypassing reason is morally neutral unless it involves lying?

  3. If bypassing is real, does it wrong the agent in a way distinct from merely failing to respect their autonomy effectively?
  **Follow-up:** You'll likely say the difference is illusory. But if I respect your autonomy inefficiently versus actively subverting it, isn't there a qualitative difference in how I regard your agency?

  4. You argue that if persuasion works because the target is tired, that's on the target. Does this mean we have no duty to avoid exploiting known vulnerabilities?
  **Follow-up:** If I know you're grieving and push a sale, you'd say that's just successful influence. Why isn't that exploitation distinct from ordinary persuasion?

  5. Consider benevolent manipulation: a nurse distracts a panicking patient rather than arguing. Is this manipulation on your view?
  **Follow-up:** If you call it influence, not manipulation, aren't you reserving "manipulation" only for cases we dislike, proving the term is just a slur?

  6. Suppose the patient later thanks the nurse. Does their retrospective endorsement change the moral status of the act?
  **Follow-up:** If endorsement fixes it, does that mean the wrong was never about the bypassing, but solely about the outcome matching the target's will?

  7. What about self-manipulation? I set an alarm across the room to bypass my morning laziness. Am I manipulating myself?
  **Follow-up:** If yes, does that stretch "manipulation" so thin it loses meaning? If no, what distinguishes self-influence from self-manipulation?

  8. In self-manipulation, I treat my future self as a lever. Is that permissible because I own both selves?
  **Follow-up:** If ownership justifies it, does manipulating a friend become wrong only because I don't own them, not because I bypassed their reason?

  9. Let's return to the bypassing account. If I respect your autonomy but do so inefficaciously, versus bypassing it successfully, is the latter worse?
  **Follow-up:** You argue the difference is illusory. But doesn't bypassing deny the status of being a reason-giver, whereas inefficacy accepts it but fails?

  10. Many philosophers claim bypassing is a distinct wrong. Why do you think such smart people keep positing a category you find empty?
  **Follow-up:** Is it possible they see a harm to dignity that isn't captured by outcome or deceit, which your view misses?

  11. Does your view generalize to gaslighting? Is that just lying plus disapproval, or is subverting someone's trust in their own faculties a distinct wrong?
  **Follow-up:** If it's just lying, why does gaslighting feel uniquely damaging compared to a standard lie about facts?

  12. Finally, if you're right, should we stop using the word "manipulation" in ethical debates entirely?
  **Follow-up:** If we keep using it, aren't we smuggling in the distinct wrong you claim doesn't exist?

  ### Settled vs. contested

  There is broad agreement that lying and coercion are paradigmatic wrongs distinct from persuasion. Philosophers also generally agree that manipulation involves influencing someone without engaging their rational deliberation. However, the field is deeply divided on whether this "bypassing" is itself wrongful. The consensus among critics is that treating a person as a mere causal lever violates dignity. Your guest contests this, arguing that without deceit or force, the only remaining variable is the observer's disapproval of the result. You should treat the existence of non-rational influence as common ground, but the moral weight of that mechanism as the genuine battleground.
