  *(Self-Correction on Sortition)*: Wait, is there a *tiny* sliver of an argument for sortition? Some modern scholars (like Sortition advocates) argue Madison wanted to break factions. But Madison's solution was a *large sphere* + *representation*. Sortition removes the "choice" of the people. Madison trusts the *people's choice*, not the *people's random selection*. I need to be firm: Madison hates sortition. It's indistinguishable from mob rule to him.

  *(Self-Correction on Term Limits)*: Madison's argument against rotation was that it puts power in the hands of the bureaucracy (clerks) because the legislators leave too soon. This is a great detail for the novel.

  *(Self-Correction on Salary)*: Madison wanted compensation to allow non-wealthy to serve. Cutting salaries returns to aristocracy. He would hate that.

