      *   *Check:* Sortition. Is there *any* angle where he likes it? Maybe as a way to break factions? No, Fed 10 is clear: you cure faction by *representation*, not by randomizing it. Randomization removes the "wisdom" filter.
      *   *Check:* Term limits. The Articles of Confederation *did* have them. Madison explicitly moved away from this. Confirm the specific debate record. (Yes, Aug 1787, motion to strike out ineligibility clauses).

  7.  **Final Polish:**
