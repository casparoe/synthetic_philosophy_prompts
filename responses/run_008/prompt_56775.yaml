prompt: |-
  So I write novels for a living, and I'm deep in the weeds on the next one: it's set at a near-future state consitutional convention where the delegates, desperate and slightly hungover, start consulting a (legally dubious) language model trained on James Madison's collected papers to settle their fights. Very meta, I know. The three reforms on the convention floor are (1) replacing the state senate with a body selected by lottery, Athenian style, (2) hard term limits on the legislature, and (3) various schemes to make politics less attractive as a lifelong career — salary cuts, cooling-off periods, the whole menu.

  What I need from you is a real prediction of what Madison would say to each of the three, and not just vibes — I want it anchored in the guy's actual documented positions. I know the broad strokes from school: Federalist 10, the worry about factions, the idea that a small body of representatives should filter and refine public opinion, and his general disdain for the ancient republics that he thought were basically mob rule by lottery. But dig further than that. Which of the three reforms would horrify him most and why, which might he grudgingly like (is there any reading on which sortition is an anti-faction device, which is kind of his whole thing?), and where is he just silent because the concept didn't exist for him — like "career politician" as we understand it, or the primary system, or lobbying as a profession? Also I half remember that the Articles of Confederation had term limits that the framers deliberately dropped, and that Madison himself argued against mandatory rotation at the convention, but correct me if I'm making that up.

  One thing I'm begging you for, because my editor will check: clearly separate what's actually settled among Madison scholars from what's genuinely contested. I gather there's a live debate about how much he trusted representatives versus the people over time, and about how to read his later career. If a take on Madison is something historians would fight about, tell me that it's a fight, because I don't want to hang a whole chapter on one side of a historiograpical brawl without knowing I'm doing it.
