answer: |-
  # Defense Preparation: Keynes on Probability and Uncertainty
  **Seminar:** Joint Decision Theory & Economic Methodology
  **Paper:** *Keynes's Live Problem: Weight, Radical Uncertainty, and the Limits of Bayesianism*

  ## I. Strategic Concessions (Open the Q&A with these)
  *To disarm the room, begin your closing remarks or initial responses by conceding the following. This prevents them from being used as "gotcha" objections later.*

  1.  **To the Historian:** "I concede that Keynes's *logical* theory of probability in the *Treatise* was damaged by Ramsey's critique, and Keynes himself acknowledged this. My argument does not rest on the survival of the *Treatise's* logic, but on the persistence of the *problem* of weight and radical uncertainty in the *General Theory* and his 1937 QJE article."
  2.  **To the Formalist:** "I am not claiming Keynes provided a formal axiom system. He provided a phenomenology of choice under uncertainty that current axiomatic systems (like MEU) approximate but do not fully capture, specifically regarding the independence of 'weight' from 'imprecision'."
  3.  **To the Methodologists:** "I am not offering a new equilibrium model today. I am arguing for a boundary condition on existing models. Where weight is sufficiently low, the assumption of a well-defined preference ordering breaks down."

  ---

  ## II. Anticipated Objections & Replies

  ### 1. The Doctrinaire Bayesians (Ramsey/Subjective Probability)
  **The Objection:**
  "You're treating probability as a logical relation 'out there' waiting to be discovered. Ramsey settled this in 1926: probability *is* degree of belief, operationalized by betting quotients. If an agent can't set a price for a bet, they don't have a belief. By positing 'non-numerical' probabilities, you're just describing a psychological hesitation, not a logical category. If they hoard liquidity, that's just a high marginal utility of money, not a failure of probability theory."

  **The Reply (2 mins):**
  "Ramsey successfully subjectivized probability, but he presupposed a complete preference ordering over all conceivable gambles. My claim is that in cases of radical uncertainty—like Keynes's example of a European war 20 years hence—the agent lacks the *informational basis* to construct that ordering, not just the confidence. It is not that the agent *won't* bet; it is that the question 'What is the price?' is ill-posed because the state space itself is undefined. Liquidity preference isn't just risk aversion; it is a demand for optionality because the agent recognizes that assigning a sharp prior would be arbitrary. If Bayesianism requires a prior where no evidence exists, it ceases to be a theory of rationality and becomes a theory of fabrication."

  **Where this reply is weak:**
  It leans heavily on the "undefined state space" claim. A sophisticated Bayesian will argue that *subjective* states are always definable by the agent. You haven't proven they *can't* form a prior, only that they *shouldn't*.

  ### 2. The Formal Decision Theorist (Ambiguity/Ellsberg)
  **The Objection:**
  "This sounds like standard ambiguity aversion. We have Maxmin Expected Utility (MEU), Smooth Ambiguity, and Variational Preferences. In these models, a set of priors captures the imprecision, and the functional form captures the aversion. Keynes's 'weight' is just the size of the set of priors. Why do we need Keynes as a 'live problem' when we have Gilboa-Schmeidler?"

  **The Reply (2 mins):**
  "In standard ambiguity models, 'imprecision' and 'confidence' are conflated. In Keynes's framework, 'weight' varies independently of the probability estimate. I can have a precise probability of 0.5 with low weight (a coin from a magician's pocket) versus a precise probability of 0.5 with high weight (a minted coin). MEU treats both as the same set of priors. Keynes argues that as weight decreases, rational agents do not just become more 'cautious' (minimizing over the set); they shift decision rules entirely, relying on convention or herd behavior. Ambiguity models still assume maximization over a structure; Keynes is describing a breakdown of the maximization paradigm itself when weight approaches zero."

  **Where this reply is weak:**
  Formalizing "confidence" independently of the set of priors is notoriously difficult (see Eichberger et al.). You are gesturing at a formal distinction without providing the axioms that enforce it.

  ### 3. The Economic Methodologists (Heterodox but Rigorous)
  **The Objection:**
  "You say agents 'refuse to act on expectations.' That is hand-waving. If they are hoarding liquidity, they are maximizing *something*. If you can't specify the objective function, this isn't economics, it's sociology. How do we distinguish 'radical uncertainty' from just 'high risk aversion' empirically? If everything that looks irrational is just 'uncertainty,' your theory is unfalsifiable."

  **The Reply (2 mins):**
  "The testable implication is the *breakdown of comparative statics*. Under risk or standard ambiguity, if the payoff increases, investment should increase. Under radical uncertainty (low weight), changes in expected payoff may have *no effect* on investment because the decision is not driven by calculation but by convention or animal spirits. We see this in liquidity traps: lowering interest rates (changing the payoff) fails to stimulate investment. A risk-aversion model cannot easily explain a zero-elasticity of investment to interest rates without ad-hoc constraints. Keynes offers a structural explanation for that rigidity: the calculation itself has ceased."

  **Where this reply is weak:**
  "Breakdown of comparative statics" is hard to distinguish from extreme parameter values in standard models. You need to be ready to admit that distinguishing "extreme risk aversion" from "uncertainty" econometrically is an open problem.

  ### 4. The Historian of Economic Thought
  **The Objection:**
  "You are conflating the 1921 Keynes with the 1936 Keynes. In the *Treatise*, probability was a logical relation. By the *General Theory*, he had moved to an ontological claim about the future being unknowable. Ramsey *did* convince him to abandon the logical view. By using the *Treatise's* concept of 'weight' to defend the *General Theory's* uncertainty, you are creating a hybrid Keynes that never existed."

  **The Reply (2 mins):**
  "You are right that the *logical* foundation shifted. However, the 1937 QJE paper, 'The General Theory of Employment,' is the bridge. There, Keynes explicitly distinguishes between 'uncertain knowledge' and 'merely probable' risk, citing the very examples from the *Treatise* (war, copper prices). He retained the concept of 'weight' (though he sometimes called it 'confidence') as the crucial variable determining investment. My argument is not that his *logic* remained consistent, but that the *phenomenon* he identified in 1921 remained the core of his macroeconomic critique in 1936. The 'live problem' is the macroeconomic consequence of low weight, regardless of whether the underlying probability is logical or subjective."

  **Where this reply is weak:**
  Keynes was notoriously inconsistent in his terminology. If pressed on specific textual evidence where he explicitly links 1921 'weight' to 1936 'confidence' in a formal way, you may have to concede it's a reconstruction rather than exegesis.

  ---

  ## III. The "Dreaded Question"
  *This is the question you hope they don't ask because it exposes the lack of a positive theory.*

  **The Question:**
  "Okay, let's grant you that Bayesianism fails here. If agents aren't maximizing expected utility over any prior, **what are they doing?** If you can't model it, how is this economics? Are you just saying 'anything goes'?"

  **The Response:**
  "They are following **rules of thumb and conventions**. This is not 'anything goes'; it is a specific, stable behavioral response to computational and ontological limits. They assume the future will resemble the past (convention), they follow the crowd (herding), or they hold liquid assets to preserve the option to decide later.
  The positive theory is **Rule-Based Decision Making** under structural ignorance. The challenge for us as theorists is not to force these rules into a utility function, but to model how conventions form and collapse. That is the research program Keynes left us: not better priors, but a theory of stability and fragility in conventional expectations."

  **Backup Plan:**
  If they press on "That's not formal enough," reply: "Agent-based modeling and behavioral macro are currently doing exactly this work. My paper is a philosophical justification for why that work is necessary, not a substitute for it."

  ---

  ## IV. Tactical Notes for the Room
  *   **When the Bayesians speak:** Nod at "coherence." Do not fight the Dutch Book argument on its own turf. Move the fight to the *applicability* of the premises (i.e., does the agent actually have a preference in this specific case?).
  *   **When the Formalist speaks:** Use her language. Mention "State Space," "Sigma-Algebras." Acknowledge that MEU is the best *formal* attempt, but argue it is a *subset* of Keynes's insight.
  *   **When the Methodologists speak:** Emphasize "Empirical content." The liquidity trap is your best friend here.
  *   **When the Historian speaks:** Defer to their expertise. "You are correct on the textual development, my interest is in the theoretical utility of the concept."

  **Final Reminder:** You don't need to prove Keynes was right about everything. You only need to prove that the *problem* he identified is not solved by the current orthodox toolkit. Keep the bar at "Live Problem," not "Final Truth."
