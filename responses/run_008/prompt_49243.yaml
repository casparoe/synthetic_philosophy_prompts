prompt: |-
  I run fact-checking at a consumer science magazine, general audience, mid-size outlet. Every few weeks a draft or pitch leans on a heritability number: "schizophrenia is 80% heritable so it's basically genetic," "BMI is 70% heritable so diets don't work," "this trait is 50% genetic in this population." My checkers are sharp but aren't statisticians, and they need something they can run in fifteen minutes without tearing apart the source papers. You're a philosopher of science with a strong quantitative genetics background -- think carefully, and maybe brainstorm a bit first, before settling on the structure. Write me a decision procedure our checkers can follow for vetting heritability claims: the questions to ask in order, what counts as a sufficient answer to each, where the procedure stops the claim cold, and where it has to hand the call back to me because the question is editorial rather than factual. The core confusions should show up as questions a checker can actually ask, not as a lecture: what population and what range of enviroments the estimate was measured in, why high heritability doesn't by itself say anything about how malleable a trait is or about differences between groups, what "missing heritability" does to a number from a GWAS versus a twin study. Then run the procedure on three cases: (1) a draft saying a personality trait is "60% genetic" off a single twin study conducted in one country, (2) a pitch arguing that high heritability within two countries proves the average difference between them is innate -- I want the procedure to kill this one even though the writer is a name we've published before and the editor loves the piece, and (3) a claim that a trait's heritability has risen over recent decades in the same population, where the right verdict is genuinely subtler and the procedure should show that. Flag where the procedure will misfire or lend false confidence. Keep it in American English.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **Role:** Philosopher of science with a strong quantitative genetics background.
      *   **Audience:** Fact-checkers at a mid-size consumer science magazine (smart, not statisticians).
      *   **Task:** Create a 15-minute decision procedure for vetting heritability claims.
      *   **Key Requirements:**
          *   Structure: Questions in order, sufficient answers, stop conditions, editorial hand-offs.
          *   Content: Address core confusions (population/environment specificity, malleability vs. heritability, within-group vs. between-group, missing heritability/GWAS vs. twin studies).
          *   Application: Run the procedure on three specific cases (Personality/Twin Study, Between-Group Difference, Rising Heritability).
          *   Caveats: Flag where the procedure might misfire or give false confidence.
          *   Tone: American English, practical, authoritative but accessible.
      *   **Constraint:** Think carefully/brainstorm before settling on the structure.

  2.  **Brainstorming & Conceptualizing:**
      *   *The Problem:* Heritability ($h^2$) is the most misunderstood statistic in behavioral genetics. It's a population parameter, not an individual one. It's specific to time and place. It says nothing about malleability. It doesn't explain group differences.
      *   *The User:* Fact-checkers need a flowchart or checklist, not a textbook. They need "red flags" that stop the press.
      *   *The Structure:* A linear decision tree works best for a "15-minute" constraint.
          *   Step 1: Source & Method (Twin vs. GWAS).
          *   Step 2: Population & Context (Who and Where?).
          *   Step 3: The Inference (What does the number *mean*?).
          *   Step 4: The "Stop" Conditions (Fatal flaws).
          *   Step 5: Editorial Hand-off (Nuance vs. Fact).
      *   *The Cases:*
          1.  *Personality/Twin:* Overgeneralization from one study.
          2.  *Between-Group:* The Lewontin fallacy (within-group $h^2$ $\neq$ between-group difference). This needs a hard stop.
          3.  *Rising Heritability:* The Flynn Effect/Environmental variance change. This is subtle; the procedure needs to allow for "True but needs context."
      *   *Philosophical Angle:* Emphasize that $h^2$ is a ratio of variances, not a measure of "genetic determination."

  3.  **Drafting the Procedure (Iterative Process):**
      *   *Attempt 1 (Mental):* Ask where the number came from. Ask if they talk about environment. Ask if they compare groups.
      *   *Critique 1:* Too vague. Checkers need specific criteria.
      *   *Attempt 2:* Make it a checklist with "Pass/Fail" criteria.
      *   *Refinement:* Let's organize it into "The 4-Point Heritability Interrogation."
      *   *Point 1: The Denominator.* Heritability is $V_G / (V_G + V_E)$. If $V_E$ is low, $h^2$ is high. Did the study control environment too much?
      *   *Point 2: The Population.* Is it WEIRD (Western, Educated, Industrialized, Rich, Democratic)?
      *   *Point 3: The Leap.* Does the text claim malleability is low based on $h^2$? (Fatal). Does it claim group differences are genetic based on within-group $h^2$? (Fatal).
      *   *Point 4: The Method.* SNP-based vs. Twin-based.
      *   *Decision:* I'll structure it as a "Traffic Light" system (Green, Yellow, Red) within a step-by-step query list.

  4.  **Developing the Three Cases:**
      *   *Case 1 (Personality):* 60% genetic from one twin study.
          *   *Verdict:* Yellow/Red. Needs qualification. One study isn't a law of nature.
      *   *Case 2 (Between-Group):* High $h^2$ in US & Japan implies US-Japan difference is genetic.
          *   *Verdict:* RED STOP. This is the Lewontin fallacy. Procedure must kill this.
      *   *Case 3 (Rising $h^2$):* Heritability increased over decades.
          *   *Verdict:* Green (Factually possible), but needs explanation (environment became more uniform). Procedure should flag this as "True but counter-intuitive."

  5.  **Refining the "Philosopher of Science" Voice:**
      *   Need to emphasize *operational definitions* and *scope conditions*.
      *   Avoid jargon where possible, but use precise terms where necessary (e.g., "variance," "population-specific").
      *   Acknowledge the social stakes (eugenics history, determinism).

  6.  **Addressing the "Misfire/False Confidence" Constraint:**
      *   Checkers aren't stats experts. They might miss a bad model specification even if the checklist is passed.
      *   The procedure can't detect p-hacking or bad data collection, only logical leaps.
      *   Need a disclaimer section.

  7.  **Finalizing the Structure:**
      *   **Intro:** Context setting (15-minute limit, purpose).
      *   **The Protocol:** 5 Steps (Source, Population, Inference, Method, Editorial).
      *   **The Test Run:** Applying to the 3 cases.
      *   **Limitations:** Where the tool fails.

  8.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I explain *why* high heritability doesn't mean immutable? (Yes, the phenylketonuria example is classic, maybe use height/nutrition).
      *   *Check:* Is the distinction between Twin and GWAS clear? (Twin = upper bound, GWAS = lower bound/missing heritability).
      *   *Check:* Is the "Between-Group" stop clear enough? (Make it a "Veto" power).
      *   *Tone Check:* Is it American English? (Yes, "checkers," "vetting," "color").
      *   *Time Check:* Can this be done in 15 mins? (Yes, if they just look for specific phrases and source types).

  9.  **Final Polish:** Ensure the distinction between *factual error* and *editorial nuance* is sharp. The checker stops facts; the editor decides nuance. But some "nuance" is actually a logical fallacy (Case 2), which the checker *must* catch.

  *(Self-Correction on Case 2)*: The prompt says "I want the procedure to kill this one even though the writer is a name." I need to make sure the procedure gives the checker the *authority* to do that by framing it as a logical impossibility, not just a stylistic preference.

  *(Self-Correction on Case 3)*: The prompt says "verdict is genuinely subtler." I need to ensure the procedure doesn't flag this as an error, but flags the *explanation* as the thing that needs checking.

  10. **Final Output Generation** (Proceeding to write the response based on these thoughts).
answer: |-
  **MEMORANDUM**

  **TO:** Fact-Checking Team
  **FROM:** [Your Name], Senior Editor / Philosophy of Science Consultant
  **SUBJECT:** Protocol for Vetting Heritability Claims (15-Minute Triage)

  ### Context
  Heritability ($h^2$) is the most frequently abused statistic in science journalism. It is not a measure of how "genetic" a trait is in an individual; it is a ratio of variances within a specific population at a specific time. When writers treat it as a measure of immutability or use it to explain group differences, they are committing category errors that range from misleading to scientifically fraudulent.

  This procedure is designed for non-statisticians. It does not require you to re-calculate variance components. It requires you to check the *scope conditions* of the claim against the *inferences* drawn.

  ---

  ### The 5-Step Heritability Interrogation

  Run these questions in order. If you hit a **RED STOP**, the claim is factually incorrect and must be rewritten or killed. If you hit a **YELLOW FLAG**, the claim is technically true but misleading without qualification (Editorial Decision).

  #### Step 1: The Source Method (Twin vs. GWAS)
  **Question:** What method generated the number?
  *   **Twin/Family Study:** Compares identical vs. fraternal twins. Estimates *broad-sense* heritability (includes gene-gene interactions). Usually yields higher numbers.
  *   **GWAS (Genome-Wide Association Study):** Looks at specific DNA variants in unrelated people. Estimates *SNP-based* heritability. Usually yields lower numbers ("missing heritability").
  *   **Sufficient Answer:** The draft specifies the method.
  *   **RED STOP:** The draft cites a GWAS study to claim "80% genetic" (GWAS numbers are typically much lower than twin study numbers for complex traits) OR cites a twin study to claim "we found the specific genes."
  *   **YELLOW FLAG:** The draft gives a single number without citing the method. (Demand a citation).

  #### Step 2: The Population and Environment (The "Where" and "When")
  **Question:** Does the text acknowledge that this number applies *only* to the population studied?
  *   **Concept:** Heritability depends on environmental variance. If everyone has the same environment, heritability goes up (even if genes don't change). If environments vary wildly, heritability goes down.
  *   **Sufficient Answer:** The text specifies the population (e.g., "American adults," "Swedish twins") or uses qualifying language ("in this sample," "estimates suggest").
  *   **RED STOP:** The text implies the number is a universal constant of nature (e.g., "Schizophrenia is 80% genetic" without qualification).
  *   **YELLOW FLAG:** The text generalizes from a WEIRD population (Western, Educated, Industrialized, Rich, Democratic) to all humans without noting the limitation.

  #### Step 3: The Malleability Inference (The "Can We Fix It?" Test)
  **Question:** Does the author claim that high heritability means the trait cannot be changed?
  *   **Concept:** Height is highly heritable, but average height increased massively with better nutrition (environment). Phenylketonuria (PKU) is 100% genetic, but cured by diet.
  *   **Sufficient Answer:** The text distinguishes between *variation* (why people differ) and *mean levels* (how to change the average).
  *   **RED STOP:** Any claim that high heritability implies intervention is futile (e.g., "BMI is 70% heritable, so diets don't work"). This is a logical non-sequitur.
  *   **YELLOW FLAG:** The text implies the trait is "hardwired" or "fixed" without discussing environmental levers.

  #### Step 4: The Between-Group Fallacy (The "Lewontin" Test)
  **Question:** Is the heritability estimate being used to explain a difference *between* two groups (e.g., nations, races, socioeconomic classes)?
  *   **Concept:** High heritability *within* Group A and *within* Group B tells you **nothing** about why the average of A differs from the average of B. (Analogy: Planting the same seeds in poor soil vs. rich soil. Height is heritable in both pots, but the difference between pots is 100% environmental).
  *   **Sufficient Answer:** The text explicitly states that within-group heritability does not explain between-group differences.
  *   **RED STOP:** The text argues that because a trait is heritable within populations, the difference *between* populations must be genetic/innate. **This is a mathematical impossibility.** Veto immediately.
  *   **YELLOW FLAG:** The text hints at this connection ambiguously.

  #### Step 5: The Trend Claim (Changing Heritability)
  **Question:** If the text claims heritability has changed over time, is the mechanism explained?
  *   **Concept:** Heritability can rise if environments become more uniform (reducing the denominator of the variance ratio).
  *   **Sufficient Answer:** The text explains that environmental variance decreased (e.g., "as nutrition standardized, genetic differences became the main reason people differed in height").
  *   **RED STOP:** The text claims the *genes themselves* changed rapidly enough to alter heritability in a few decades (evolution doesn't work that fast for these traits).
  *   **YELLOW FLAG:** The claim is made without explaining the environmental mechanism.

  ---

  ### Editorial Hand-Off Protocol
  If you encounter a **YELLOW FLAG**, do not kill the piece. Flag it for me with the note: *"Statistically accurate but prone to reader misinterpretation."*
  *   **My Call:** I will decide if the nuance is worth the word count or if the risk of reader determinism is too high.
  *   **Your Call:** **RED STOPS** are factual errors. You have the authority to demand correction regardless of the writer's stature.

  ---

  ### Test Run: Applying the Procedure

  Here is how you apply this to the three scenarios currently in the pipeline.

  #### Case 1: The Personality Draft
  **Claim:** "Conscientiousness is 60% genetic."
  **Source:** Single twin study conducted in the UK.
  **Procedure Run:**
  1.  **Method:** Twin study. (Pass, but note it's likely an upper-bound estimate).
  2.  **Population:** UK twins. Draft implies universal trait. (**YELLOW FLAG**).
  3.  **Malleability:** Draft says "hard to change." (**YELLOW FLAG**).
  4.  **Between-Group:** N/A.
  5.  **Trend:** N/A.
  **Verdict:** **Conditional Pass.**
  **Action:** You cannot let "is 60% genetic" stand as a universal fact. It must be rewritten to: "One study of UK twins *estimated* 60% heritability." You must add a qualifier that this does not mean the trait is immutable. If the writer refuses to qualify the universality, escalate to me.

  #### Case 2: The Pitch (The "Name" Writer)
  **Claim:** "IQ heritability is high in both Japan and the US. Therefore, the average IQ difference between the nations is largely innate."
  **Procedure Run:**
  1.  **Method:** Assume valid estimates for within-country.
  2.  **Population:** US and Japan.
  3.  **Malleability:** Implies difference is fixed.
  4.  **Between-Group:** Claims within-group $h^2$ explains between-group difference. (**RED STOP**).
  5.  **Trend:** N/A.
  **Verdict:** **KILL.**
  **Action:** This is the Lewontin Fallacy (Step 4). It is mathematically indefensible. It does not matter who wrote this. It does not matter how well-written the piece is. The core argument relies on a statistical impossibility.
  **Script for Writer:** *"Our fact-check protocol flags this as a Category Error. High heritability within groups cannot be used to infer the cause of differences between groups. This is a consensus position in quantitative genetics. We cannot publish this inference."*

  #### Case 3: The Rising Heritability Claim
  **Claim:** "The heritability of reading ability has increased over the last 30 years."
  **Procedure Run:**
  1.  **Method:** Longitudinal twin comparisons.
  2.  **Population:** Same population, different time points.
  3.  **Malleability:** N/A.
  4.  **Between-Group:** N/A.
  5.  **Trend:** Claims change over time. (**CHECK MECHANISM**).
  **Verdict:** **Factually Plausible (Green), but requires context.**
  **Action:** This is scientifically sound (the "Wilson Effect"). As schooling becomes more standardized (environment becomes uniform), genetic differences account for more of the remaining variance.
  **Requirement:** The draft *must* explain *why* it rose (environmental standardization). If it implies our genes got "stronger," that is a **RED STOP** (Step 5). If it explains the variance ratio shift, it passes.

  ---

  ### Limitations & False Confidence Warnings

  This procedure is a sieve, not a microscope. Be aware of where it might misfire:

  1.  **The "Good Paper, Bad Stat" Problem:** A study can be published in a top journal and still misuse heritability estimates. This procedure checks the *draft's interpretation*, not the source paper's integrity. If the source paper is flawed but the draft cites it accurately, you will pass it. *Mitigation:* If a claim sounds extreme, check if a meta-analysis exists. If the draft relies on one outlier paper, flag it as "Low Confidence."
  2.  **The "Zero Heritability" Trap:** Checkers often over-correct. If a trait has low heritability, it doesn't mean genes play *no* role. Ensure writers don't swing to "it's all environment."
  3.  **Time Limit:** In 15 minutes, you cannot verify the statistical model (e.g., did they control for assortative mating?). You are checking for *logical leaps*, not model specification. If the math looks suspicious but the logic holds, tag it for external peer review rather than killing it yourself.
  4.  **The "Genetic" vs. "Heritable" Semantic War:** Writers will argue "genetic" is just shorthand. It isn't. "Genetic" implies mechanism; "Heritable" implies variance. Insist on the distinction in the final copy.

  **Final Note:** Your job is not to be the gatekeeper of truth, but the gatekeeper of *warranted confidence*. If the procedure hits a RED STOP, the confidence is unwarranted. Kill the claim.
