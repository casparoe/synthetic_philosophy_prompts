      *Revised Thesis:* **When Collective Memory conflicts with the Historical Record, the Record must prevail, *especially* when the memory is revealed to be strategically manufactured.** To do otherwise is to surrender history to power. The *War of the Worlds* case proves that "social function" is not a sufficient defense for falsehood.

      *Wait, one nuance:* I should acknowledge that the Memory *itself* becomes a historical fact (the fact that people *believed* it). But the *content* of the memory (the panic) is false. I need to distinguish between "Memory as Object" vs. "Memory as Claim."
