  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** A professional novelist (literary fiction/fantasy).
      *   **Context:** Heard about Molinism on a podcast, obsessed with it because it mirrors their creative process.
      *   **Core Task:** Translate Molinism into the vocabulary of novel writing (character bibles, drafts, outlines, "out of character" moments, etc.).
      *   **Specific Requirements:**
          *   Map Molinist concepts (Natural Knowledge, Middle Knowledge, Free Knowledge, Grounding Problem, Actualization) to writing concepts.
          *   Provide a "Residue Report": What doesn't translate? Where does the analogy break down?
