          *   Be honest about disanalogies (Author-Omniscience vs. Divine Omniscience).
          *   No citations/name-dropping, just arguments.
          *   Tone: Intellectual, respectful, creative, honest, nuanced.

  2.  **Deconstruct Molinism (The Source Material):**
      *   *Natural Knowledge:* God knows all necessary truths and all possible worlds (what *could* happen).
      *   *Middle Knowledge:* God knows all counterfactuals of creaturely freedom (what any free creature *would* do* in any specific circumstance). This is pre-volitional (before God decides to create).
      *   *Free Knowledge:* God knows what *will* happen (the actual world) after He decides to create.
      *   *The Goal:* Reconcile Divine Sovereignty (God chooses the world) with Human Freedom (Humans choose their actions).
      *   *The Grounding Problem:* What makes these counterfactuals true *before* the creature exists to make them true? If the creature doesn't exist, what grounds the truth value of "If X were in situation S, X would do A"?

  3.  **Map to Novel Writing (The Target Material):**
      *   *The Author:* God analogue.
      *   *The Characters:* Free creatures analogue.
      *   *The Character Bible/Backstory:* Natural Knowledge (possibilities, traits).
      *   *The "What If" Scenarios:* Middle Knowledge (Counterfactuals).
      *   *The Final Draft:* Free Knowledge/Actual World.
      *   *The "Refusal" of the Character:* The experience of freedom/constraint.

  4.  **Drafting the Translation (Section by Section):**

      *   *Introduction:* Acknowledge the insight. It's a strong analogy because creation *is* the core metaphor of theology.
      *   *The Three Layers of Knowledge:*
          *   *Natural Knowledge:* The "Story Space." All logically possible plots, all genre conventions, the physics of the world. The blank page potential.
          *   *Middle Knowledge:* The "Character Truths." This is the sweet spot. It's not just what *can* happen, but what *this specific person* would do. The scene written 11 times. The "Out of Character" (OOC) judgment. This exists *before* the final draft is locked.
          *   *Free Knowledge:* The Published Book. The actualized timeline. What the reader holds.
      *   *Actualization:* The Author choosing Draft C over Draft A. The Author places the character in Situation S knowing they will do A.
      *   *The Grounding Problem:* This is crucial. In theology: What makes it true *before* creation? In writing: What makes it true *before* writing? Is it the Character Bible? Is it the Author's intuition? Or is it just a feeling?

  5.  **Developing the "Residue Report" (The Critique):**
      *   *Where the analogy breaks:*
          *   *Ontology:* Characters aren't real. Humans (in theology) are assumed to be ontologically distinct from God. Characters are ontologically dependent on the Author in a way that makes "freedom" metaphorical, not metaphysical.
          *   *Epistemology:* The author *makes* the truth true by writing it. In Molinism, God *discovers* the truth. Does the novelist discover what the character would do, or decide it? The user says "discover," but is that just a cognitive process?
          *   *The Grounding:* For a novelist, the "ground" of the counterfactual is the Author's mind. For Molinists, it can't be God's mind (or freedom is lost) and can't be the creature (doesn't exist yet). This is the hard stop.
      *   *What Novelists know that Molinists miss:*
          *   *Co-creation:* The character evolves *during* writing. Molinism assumes static counterfactuals. Writers know characters change based on the circumstances they are put in (arc).
          *   *The Unconscious:* The "character refusal" might be the author's subconscious noticing plot holes, not the character's metaphysical freedom.

  6.  **Refining the Tone:**
      *   Avoid preachiness.
      *   Use writerly terms (drafts, bibles, OOC, canon).
      *   Ensure the philosophical correction is seamless (e.g., clarifying that Middle Knowledge is *pre-volitional*).
      *   Address the "God off the hook for evil" point (Theodicy) -> In writing, this is "Why did you make your protagonist suffer?"

  7.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I correct the user's definition of Molinism? *Adjustment:* Yes, need to emphasize that Middle Knowledge is *prevolitional* (before God decides to create), which maps to the author knowing the character before locking the draft.
      *   *Check:* Did I address the Grounding Problem clearly? *Adjustment:* Make sure to contrast where the truth comes from in theology vs. writing.
      *   *Check:* Is the "Residue Report" honest? *Adjustment:* Don't shy away from saying characters aren't actually free. That's the big disanalogy.

  8.  **Final Polish:** Organize with clear headings. Ensure the flow moves from the mapping to the critique. (Proceed to generate output based on these thoughts.)

  *(Self-Correction Note during drafting the response)*: I need to be careful not to validate Molinism as *true* theology, but treat it as the system the user is asking about. Also, I need to make sure I don't dismiss the writer's experience of "character freedom" as *just* illusion, because phenomenologically it's real to them, even if ontologically different from human freedom.

  9.  **Final Structure:**
