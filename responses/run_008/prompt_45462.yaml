      *   **Role:** Act as a philosopher of history (knowledgeable in Bauman, *Historikerstreit*, philosophy of analogies).
      *   **Task:** Provide a "real audit" of the analogy based on five specific points (Correspondence Table, Where it Holds, Where it Breaks, What it Smuggles In, Survival of the Thesis without the Analogy).
