      *   *Best Strategic Move:* Distinguish the *terms*. But the prompt asks for a change to the *commitments*.
      *   *Let's look at the "Single Change" instruction again.* "Which single change would clean up the most."
      *   If I modify **(1)** to say personhood is *realized* rather than *constituted* by relations, it aligns with (4) (status exists prior), (2) (degrees of realization), and (5) (status persists).
      *   *Alternative:* Modify **(4)**. If recognition *does* confer status, then (1) holds. But then (3) and (5) are in trouble (vulnerable lose status if not recognized).
      *   *Decision:* The tension between 1 and 4 is the engine of the inconsistency. (1) is the course theme. (4) is the liberal safeguard. The "Single Change" should probably be to **(4)** to admit a hybrid view, OR to **(1)** to soften the metaphysics. Given the course context (African Philosophy), softening (1) might be unacceptable to the instructor. Softening (4) is safer for consistency but risks the human rights protection.
