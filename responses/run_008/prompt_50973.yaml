      *   *For 2 vs. 3:* Revise (2) to say *social standing* is scalar, not *moral status*. Cost: Makes "personhood" a weaker term.
      *   *For 1 vs. 5:* Revise (1) to allow for a "humanity" community that persists even if local ties are cut. Cost: Dilutes the specific communal obligation.

