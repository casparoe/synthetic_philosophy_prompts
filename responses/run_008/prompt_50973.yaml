          3.  **1 vs 5** (Practical Contradiction).

      *   *Single Change:* Revise **(1)**. Change "constituted" to "nurtured" or "expressed." This saves (4) (status is there), (2) (expression varies), (3) (status equal), (5) (status persists). It costs the "strong" Ubuntu reading, but saves the argument from self-contradiction.
      *   *Alternative Single Change:* Revise **(4)**. Admit recognition is partly constitutive. This saves (1). But then (3) and (5) need massive work to protect rights. So changing (1) is cheaper.

