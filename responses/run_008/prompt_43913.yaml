answer: |-
  **Project Title:** The Empirical Premise of Practical Reason: Henry Sidgwick's Psychical Research and the Dualism of Ethics

  **Statement of the Question**
  Henry Sidgwick's *The Methods of Ethics* remains the touchstone of Victorian moral philosophy, yet its central unresolved problem—the Dualism of Practical Reason—stands in tension with his decades of leadership in the Society for Psychical Research (SPR). The Dualism posits that Rational Egoism and Utilitarianism are equally self-evident yet may dictate conflicting courses of action. Sidgwick suggested that this conflict might be resolved if the individual's long-term interest coincides with the general good, a convergence guaranteed only if personal consciousness survives death. This project asks a determinate historical and philosophical question: Did Sidgwick's psychical research function as a load-bearing empirical premise intended to resolve the Dualism of Practical Reason, or was it a biographical anomaly with no systematic role in his ethical theory?

  This is not a question of whether Sidgwick *believed* in survival, but whether his ethical system *required* that belief to remain coherent. The "Autonomy Thesis" (the conventional view) holds that the *Methods* is a self-contained rationalist project, and the SPR work is a psychological diversion. The "Integration Thesis" (the competing view) holds that the *Methods* is structurally incomplete without the empirical findings of the SPR. To decide between these, the project must identify whether Sidgwick treated the possibility of survival as a necessary condition for the rationality of morality, or merely as a comforting hypothesis unrelated to the validity of his axioms.

  **Current Scholarship and Discriminating Evidence**
  Existing literature bifurcates. Biographers often treat the SPR involvement as a curious footnote, preserving the purity of Sidgwick's philosophy by isolating it from his "occult" interests. Conversely, sympathetic reconstructors sometimes risk retroactive system-building, imposing a tidy architecture on Sidgwick's fragmented notes. To discriminate between these positions, this project will not rely on general affinities but on specific textual triggers.

  Evidence for the Integration Thesis would include: (1) explicit cross-references in *The Methods* (across successive editions) linking the Dualism discussion to contemporary SPR findings; (2) private correspondence indicating that the motivation for specific SPR investigations was to secure the premises of the *Methods*; and (3) revisions in the *Methods* that correlate chronologically with shifts in Sidgwick's assessment of psychical evidence. Evidence for the Autonomy Thesis would include: (1) Sidgwick's explicit insistence on the independence of ethical axioms from empirical theology; (2) a lack of textual overlap between his ethical manuscripts and SPR minutes; and (3) arguments within the *Methods* that treat the Dualism as a tragic, insoluble fact of reason, regardless of empirical contingencies. The project seeks the textual point where Sidgwick's epistemology meets his soteriology.

  **Methodology and Work Plan**
  The research will be conducted over twelve months, utilizing textual analysis and archival examination rather than experimental philosophy.

  *Months 1–3: Textual Genealogy of the Methods.* I will collate all editions of *The Methods of Ethics* (1874–1907). The focus will be the chapter on the Dualism of Practical Reason. I will track changes in wording, tone, and footnote citations to determine if Sidgwick's presentation of the problem shifted as his SPR involvement deepened. Special attention will be paid to his distinction between "proof" and "probability" regarding survival.

  *Months 4–6: Archival Analysis of SPR Materials.* I will examine Sidgwick's contributions to the *Proceedings of the Society for Psychical Research*, specifically his essays on the evidence for survival and his correspondence with other SPR founders (e.g., Myers, Gurney). The goal is to locate statements of purpose: did he frame these investigations as philosophical necessities or scientific curiosities? I will also review his private letters (held at Cambridge) for references linking ethical anxiety to psychical inquiry.

  *Months 7–9: Synthesis and Reconstruction.* I will map the timeline of SPR investigations against the revisions of the *Methods*. If the Integration Thesis holds, peaks in psychical activity should correlate with periods of ethical revision. I will draft chapters analyzing specific case studies where Sidgwick evaluates specific phenomena (e.g., trance mediums) specifically for their ethical implications.

  *Months 10–12: Drafting and Refinement.* The final three months will be dedicated to writing the dissertation chapters. I will formulate the final argument, ensuring that the distinction between Sidgwick's *reasons for believing* and the *validity of the belief* is maintained.

  **Possible Conclusions**
  This project is designed to yield a definitive result regardless of which thesis is vindicated.
  1.  **Strong Integration:** The psychical research is a necessary empirical supplement. This implies Sidgwick's utilitarianism is not purely rationalist but relies on a gamble on immortality.
  2.  **Weak/Contingent Integration:** The connection exists but is limited. For example, Sidgwick may have hoped for survival to solve the Dualism personally while maintaining publicly that the *Methods* stands without it. This would clarify a distinction between his private practical reason and his public meta-ethics.
  3.  **Autonomy (The Friend's Position):** The research is biographical but philosophically inert. This result is not a failure; it successfully secures the *Methods* as a secular text and isolates the SPR work as a distinct historical phenomenon.
  The contribution lies in locating *where* and *how* the connection holds, rather than simply affirming a pre-existing preference.

  **Risk Assessment and Failure Conditions**
  The primary risk is the ambiguity of the textual record. Sidgwick was notoriously reticent about his personal motivations. If the correspondence is silent on the link between ethics and psychical research, the project may be unable to move beyond speculation. In this event, the dissertation will pivot to an analysis of *why* the silence exists—whether due to Victorian academic norms or a genuine philosophical separation.

  A second risk is conflating the reconstruction of Sidgwick's reasons with an evaluation of the psychical claims themselves. To prevent this, the methodology strictly brackets the question of whether the phenomena were genuine. The analysis concerns only whether Sidgwick *took them to be* genuine and whether he *thought* that genuineness mattered for ethics. If the textual evidence proves too thin to establish intent, the project will conclude with a negative result regarding the Integration Thesis, which remains a valuable contribution to Sidgwick scholarship by definitively severing the alleged link. The project fails only if it cannot maintain this distinction between historical reconstruction and metaphysical validation.
