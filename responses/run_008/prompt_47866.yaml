answer: |-
  Here is the tool you asked for. It is designed for high-volume, low-time triage by staff without philosophy training. It operationalizes Fricker's concepts into bureaucratic red flags.

  ### The Epistemic Triage Protocol (ETP)

  **Purpose:** To distinguish between a student who is unhappy with a *result* (Normal Appeal) and a student who was harmed by the *process of being heard* (Epistemic Risk).
  **Constraint:** Officers rely *only* on the written record of the previous hearing and the intake interview. No new evidence gathering.
  **Time Budget:** 5 minutes per case.

  #### Question 1: The Credibility Modifier Check (Testimonial)
  **Ask:** Does the committee's written decision attribute negative character or competence traits to the student (e.g., "evasive," "confused," "coached," "emotional") *without* citing a specific factual contradiction in the evidence?
  *   **Sufficient Answer for "Normal Appeal":** The record states, "Student claimed X, but email evidence on [Date] shows Y." (Disagreement is based on facts).
  *   **Sufficient Answer for "Epistemic Risk":** The record states, "Student was evasive regarding X," or "Student's account lacked coherence," without pointing to a specific document or timestamp that contradicts them.
  *   **Action:** If "Epistemic Risk," **STOP**. Flag for Senior Review. Do not process as standard appeal.
  *   **Rationale:** Labeling a speaker "evasive" is often a code for "I don't believe their style." This is the primary marker of testimonial injustice.

  #### Question 2: The Scaffolding Check (Hermeneutical)
  **Ask:** If the student struggled to articulate their claim (due to language, policy knowledge, or distress), does the record show the committee offered *active translation* (e.g., rephrasing questions, offering breaks, clarifying terms) before dismissing the claim as "vague" or "unsupported"?
  *   **Sufficient Answer for "Normal Appeal":** The record shows the committee asked clarifying questions three times, offered to pause, or provided a glossary of terms, and the student still could not meet the burden of proof.
  *   **Sufficient Answer for "Epistemic Risk":** The record shows the student stated they didn't understand the terms/process, and the committee's response was to reject the submission for "lack of clarity" without noted intervention.
  *   **Action:** If "Epistemic Risk," **STOP**. Flag for Senior Review.
  *   **Rationale:** Hermeneutical injustice occurs when the powerful refuse to help the marginalized bridge the conceptual gap. Bureaucracy requires compliance; justice requires facilitation.

  #### Question 3: The Object Check (Outcome vs. Process)
  **Ask:** In the current appeal intake, is the student's primary grievance that the *decision was wrong* (e.g., "I didn't plagiarize") or that the *hearing was deaf* (e.g., "They wouldn't let me finish," "They laughed," "They ignored my email")?
  *   **Sufficient Answer for "Normal Appeal":** "I am appealing the grade/conduct finding because the evidence was weighed incorrectly."
  *   **Sufficient Answer for "Epistemic Risk":** "I am appealing because I was not heard." (Even if they also dislike the result).
  *   **Action:** If "Normal Appeal," proceed with standard workflow. If "Epistemic Risk," combine with Q1/Q2 flags.

  #### The Hand-Off Point (Values vs. Facts)
  If Q1 or Q2 triggers a flag, your officer **must not** decide if the student is telling the truth about the underlying incident (e.g., did they actually cheat?). That is a substantive value judgment.
  *   **The Rule:** If the *listening process* was compromised by identity markers or structural gaps, the *verdict* is procedurally tainted, regardless of the student's actual guilt.
  *   **Hand-off:** Send to a Senior Adjudicator. The instruction is: "Re-hear required with accommodation," not "Overturn verdict."

  ---

  ### Where This Procedure Will Misfire (Commitments)

  You asked for straight talk. Here is where this tool breaks:

  1.  **The "Paper Trail" Bias:** This protocol relies on the committee writing down their bias. Smart prejudiced people don't write "I didn't believe him because of his accent." They write "The account was inconsistent." This procedure will miss covert prejudice. It only catches *clumsy* prejudice.
  2.  **The "Skilled Manipulator" False Positive:** A sophisticated student can game Q1. They can provoke a committee into calling them "evasive," then use this protocol to flag it. You will waste senior time on some bad-faith appeals. Accept this cost. It is cheaper than the liability of systemic injustice.
  3.  **The "Guilt" Blindspot:** This procedure explicitly separates *how they were heard* from *what they did*. It will flag cases where the student is actually guilty (e.g., they did cheat) but were treated unfairly during the accusation. Your staff will hate this. They will feel they are "helping cheaters." You must enforce the distinction: **A fair trial for a guilty person is better than an unfair trial for an innocent one.**

  ---

  ### Case Runs

  Here is how your officers apply the ETP to your three scenarios.

  #### Case A: The Dyslexic Student
  *   **Situation:** Student accused of contract cheating. In the hearing, he struggled to verbally reconstruct his writing process due to processing speed issues. Committee notes: "Student appeared coached and evasive when asked to detail drafting timeline."
  *   **ETP Run:**
      *   **Q1 (Credibility):** **FLAG.** The record uses "evasive/coached." Is there a factual contradiction? No, just a struggle to narrate. The "evasiveness" is an interpretation of his speech style, not a fact check against evidence.
      *   **Q2 (Scaffolding):** **FLAG.** Disability was known. No record of extra time or alternative questioning methods to accommodate processing speed.
      *   **Q3 (Object):** Student says, "They thought I was lying because I couldn't speak fast enough."
  *   **Verdict:** **Epistemic Risk (Testimonial & Hermeneutical).**
  *   **Why you won't like this:** Your gut (and the committee's) says: "He was acting suspicious, and he probably did cheat." This procedure forces you to admit that *even if he cheated*, the committee committed testimonial injustice by interpreting a disability symptom as a credibility deficit. You have to reopen the hearing.

  #### Case B: The International Student
  *   **Situation:** Student claims supervisor discrimination. She uses terms like "bad energy" and "unfair treatment." Committee notes: "Complainant failed to articulate specific policy violations. Claim dismissed as vague."
  *   **ETP Run:**
      *   **Q1 (Credibility):** **No Flag.** "Vague" is a judgment on the claim, not necessarily the character, though it borders on it.
      *   **Q2 (Scaffolding):** **FLAG.** Student lacked the specific bureaucratic genre ("policy violations"). Committee demanded compliance with the genre ("articulate policy violations") rather than translating her claim ("bad energy" → "hostile environment"?). They did not offer to help map her experience to the policy.
      *   **Q3 (Object):** Student says, "They didn't understand my culture of respect."
  *   **Verdict:** **Epistemic Risk (Hermeneutical).**
  *   **Outcome:** Flag for Senior Review. The committee failed to bridge the hermeneutical gap. They required her to speak *their* language to be heard, rather than listening to *hers*.

  #### Case C: The "Gaslighting" Claim
  *   **Situation:** Student failed a course. Appeals on grade. Committee reviewed work, compared to rubric, found it lacking. Student says, "They gaslit me into thinking my work was bad."
  *   **ETP Run:**
      *   **Q1 (Credibility):** **No Flag.** Record states: "Essay Section B did not meet Rubric Criterion 3." This is a factual contradiction, not a character attack.
      *   **Q2 (Scaffolding):** **No Flag.** No indication student struggled to understand the question or policy.
      *   **Q3 (Object):** **Normal Appeal.** Primary grievance is the grade ("My work was good"), not the hearing ("They didn't let me speak").
  *   **Verdict:** **Normal Appeal.**
  *   **Outcome:** Reject the epistemic claim. "Gaslighting" is being used here as a synonym for "I disagree with their expertise." The procedure correctly filters this out.

  ---

  ### Critique of Your Friend's Framing

  Your friend is **half-right and half-dangerous.**

  **Where they are right:**
  Fricker's framework fits your desk perfectly. The "evasive" dyslexic and the "vague" international student are textbook cases. Your system is designed for the "ideal knower" (fluent, neurotypical, bureaucratic literacy). Anyone deviating from that pays a credibility tax. Your friend has correctly identified a systemic risk in your office.

  **Where they are wrong:**
  Your friend is treating *epistemic injustice* as a synonym for *bad outcomes*. Fricker is specific: it is about *prejudice* in the exchange of knowledge.
  *   If a committee listens carefully, accommodates disability, translates language barriers, and *still* decides against the student, that is **not** epistemic injustice. That is just losing.
  *   If your friend's framing leads your staff to believe that *any* unhappy student is a victim of injustice, you will paralyze your office. You cannot fix structural inequality in a 30-minute intake.

  **The Hard Truth:**
  You cannot run a university appeals desk on pure Frickerian ethics. You need a filter. The ETP above is that filter. It admits that injustice happens (Cases A & B) but refuses to validate every feeling of unfairness (Case C).

  **Final Instruction to Staff:**
  "When you flag a case using this protocol, you are not saying the student is innocent. You are saying the *microphone was broken.* Fix the microphone. Let someone else decide what was said."
