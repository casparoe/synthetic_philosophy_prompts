prompt: |-
  I host a philosophy-of-mind podcast, and next week's guest is a philosopher who defends Dennett's use of the two-bitser against Searle's distinction between original and derived intentionality. To set the scene: the two-bitser is a coin-operated machine built to detect a particular coin; after the country's currency is decimalized, the machine starts accepting an indistinguishable new coin, and the natural description is that its internal state, unchanged physically, now means 'here-is-a-new-coin' where it used to mean 'here-is-an-old-coin.' The guest takes this to show that the machine's derived content is fixed by something like selection history rather than by the current intentions of a designer or interpreter, and that Searle is wrong to demand an intrinsically intentional source for all content.

  Draft eight to ten interview questions for the guest. They should go beyond restating the position and press where the actual debate presses: include at least one question about how the content flip — same mechanism, new meaning — is supposed to refute Searle rather than merely illustrate loose, 'as-if' talk about machines; one that anticipates Searle's standard rejoinder, that the machine's 'beliefs' are metaphorical and that genuinely derived intentionality requires interpretation by an intrinsically intentional mind, and asks what could make the machine's content count as real; one about whether the selectionist story generalizes — whether our own intentionality is, on this view, just the two-bitser's writ large, and whether the guest accepts the deflationary consequences that follow (e.g., that a molecule-for-molecule duplicate of a person would have the same contents only courtesy of the duplicate's history); and one about a variant case I want to raise on air: a machine cobbled together by a beach vendor from scavenged parts, with no designing mind behind it at all, whose coin-discriminating behavior is nonetheless being steadily shaped because customers abandon machines that misfire — ask whether the derived/original distinction does any explanatory work there. For each question, add a follow-up keyed to the answer the guest is most likely to give.
