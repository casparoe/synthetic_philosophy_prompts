answer: |-
  Your observation cuts to the core of the normative architecture underlying health economic evaluation. The standard QALY model, particularly when extended to include life-years saved, operationalizes what philosophers call the **Deprivation Account** of death's badness. On this view, death is a harm because it deprives the subject of the good experiences they would have otherwise had. When your model assigns value to averted death based on remaining life expectancy adjusted for quality, it is quantifying this deprivation. It assumes a counterfactual baseline of continued existence and treats the deviation from that baseline (death) as a loss of utility. This is why a death at thirty is "costlier" than a death at eighty; the magnitude of the deprivation is larger.

  However, you are correct that the practice is philosophically underdetermined. The mathematical output of the model does not strictly require the metaphysical truth of the Deprivation Account. An agency could arrive at identical cost-effectiveness ratios while holding an **Epicurean** view—that death is nothing to the decedent—provided they instrumentally value life for other reasons. For instance, if the agency values life because living persons contribute to the economy, care for dependents, or maintain social stability, the calculus might look similar. Similarly, a **Desire Fulfillment** theory could justify the scores: if most people strongly desire to continue living, satisfying that desire has utility, regardless of whether death itself harms the subject. Thus, the model is compatible with rival theories that locate the value of survival in the preferences of the living, the interests of survivors, or social contract obligations, rather than in the metaphysical harm done to the dead.

  Despite this underdetermination, there are internal tensions where the practice seems to contradict its own implicit logic. The most glaring is the **Prenatal/Posthumous Asymmetry**. The model treats posthumous nonexistence as a massive loss (counting all foregone years) but treats prenatal nonexistence as neutral (counting zero years for those not yet conceived). If the badness of death is simply the absence of valuable life, there is no logical reason within the utility metric itself to distinguish between not existing *after* birth and not existing *before* birth. The model implicitly accepts a "time-relative" interest in existence that privileges the future over the past without justification. Furthermore, **Equity Weights** often clash with pure deprivation logic. Agencies often apply "fair innings" weights to prioritize saving the young, even when the total QALY gain might be lower than saving a slightly older person with better health prospects. This implies that death is bad not just because of the *amount* of life lost (deprivation), but because of *when* it occurs (fairness), introducing a non-utility value that contradicts the welfarist foundation of the QALY.

  If the health system were run on genuinely Epicurean premises, the valuation of averted deaths would collapse unless grounded in externalities. Under strict Epicureanism, since the dead cannot be harmed, preventing a death generates no intrinsic value for the decedent. Concrete changes would include scoring averted deaths solely based on the grief prevented in survivors, the economic productivity retained, or the maintenance of public trust in the healthcare system. Life-extending treatments for isolated individuals with no dependents would likely be deprioritized, while palliative care—which affects the experienced utility of the living subject—would become relatively more valuable compared to aggressive life extension. The symmetry between prenatal and posthumous nonexistence might also be resolved, as neither would count as a loss to the subject, though policy might still favor existence for instrumental reasons.

