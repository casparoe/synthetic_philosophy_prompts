answer: |-
  You have put your finger on a specific, pervasive, and intellectually slippery maneuver. To answer your primary question directly: **No, there is no single, canonical term in the philosophy literature that captures this exact configuration.**

  However, your analysis is philosophically precise. You are describing a specific corruption of **Historical Contextualism** that relies on an inconsistent application of **Constitutive Moral Luck**.

  If you use your own term, **"Moral Time-Zoning,"** in a book club, you will not be corrected; you will likely be quoted. It is phenomenologically accurate. However, if you want the academic scaffolding to back it up (so you can defend the term), here is the breakdown of the existing concepts, why they fall short, and how to formally label the gap you've found.

  ### 1. The Existing Toolkit (and why it fails)

  Your readers are deploying a hybrid of three established concepts, but they are applying them inconsistently.

  *   **Historical Contextualism:** The academic standard. It argues that actions must be judged by the norms and concepts available *at the time*.
      *   *The Flaw:* As you noted, true contextualism requires an accurate "headcount." If abolitionist arguments were available to Jefferson (they were), contextualism does not grant a blanket excuse; it grants only a mitigation based on the *difficulty* of dissent. Your readers skip the difficulty assessment and go straight to exoneration.
  *   **Constitutive Moral Luck (Thomas Nagel / Bernard Williams):** This is the heavy lifter. It suggests that who we are (including our moral sensitivities) is determined by factors outside our control, such as when and where we were born.
      *   *The Flaw:* Nagel intended this as a paradox to show that moral judgment is impossible, not as a get-out-of-jail-free card. Your readers use it selectively: Jefferson is a *victim* of his era's moral luck regarding slavery, but an *agent* regarding his enlightenment virtues.
  *   **Culpable vs. Inculpable Ignorance:** In ethics, you are excused for ignorance only if you could not reasonably have overcome it (Inculpable). If dissenters existed and were punishable but not silenced, the ignorance is often **Culpable**.
      *   *The Flaw:* Your readers treat Culpable Ignorance as Inculpable by inflating the perceived cost of dissent.

  ### 2. The Missing Concept: The Asymmetry

  The specific move you are identifying—the fact that the "era excuse" applies to slavery but not antisemitism, to imperialism but not homophobia—has no single name. In historiography, this is often discussed under the umbrella of **"The Problem of Historical Blame,"** but the *selectivity* is usually attributed to **Motivated Reasoning**.

  However, we can coin a precise term for the *structure* of the argument. I propose you call it:

  **Asymmetric Historical Contextualism**

  This captures the academic reality: it *looks* like contextualism, but it is applied asymmetrically.

  But for your purposes as a writer? Stick with **Moral Time-Zoning**. It captures the spatial metaphor your readers use (sending the historical figure to a different moral jurisdiction) better than the academic jargon.

  ### 3. Decoding "The List" (Why some vices are excusable and others aren't)

  You asked what decides which list a vice goes on. It is not about the *actual* availability of dissent (as you proved with the abolitionists). It is about the **Perceived Cost of Dissent** relative to the **Foundational Myth**.

  Here is the algorithm your readers are unconsciously using:

  1.  **Is the vice Structural or Idiomatic?**
      *   **Structural (Excused):** Slavery, Imperialism, Sexism. These are viewed as "the water everyone swam in." To oppose them is seen as requiring superhuman economic or social sacrifice.
      *   **Idiomatic (Blamed):** Antisemitism, Religious Intolerance, Personal Cruelty. These are viewed as "personal quirks." To oppose them is seen as requiring only basic decency.
      *   *The Reality:* This is historically false. Opposing antisemitism in 1940s Britain could end a political career. Opposing slavery in 1790s Virginia could end your economic life. But the *perception* of cost drives the excuse.

  2.  **Is the vice Foundational to the Subject's Legacy?**
      *   **Foundational (Excused):** If the vice is tangled up with the achievement we celebrate (e.g., Jefferson's slavery is tangled with the Declaration), we apply Moral Time-Zoning to preserve the hero. We separate the "Man" from the "Era."
      *   **Peripheral (Blamed):** If the vice is not essential to the myth (e.g., Churchill's antisemitism is not essential to the "Finest Hour" myth), we judge it by modern standards. We separate the "Era" from the "Man."

  3.  **Do We Feel Implicated?**
      *   **Implicated (Excused):** Sins that built the society we live in (Slavery in the US, Empire in the UK). We excuse them because condemning them fully destabilizes our own moral standing as beneficiaries.
      *   **External (Blamed):** Sins we view as aberrations. We condemn them to signal our own moral superiority.

  ### 4. Boundary Cases for Your Fiction

  If you want to test this in your writing or discussions, here are the boundary cases that break the "Moral Time-Zoning" defense:

  *   **The Early Adopter:** If you write a character who *does* adopt the "modern" view (e.g., a Virginian who manumits slaves in 1780), you invalidate the "couldn't know" defense for everyone else. Readers will then shift to "That was too dangerous for him," which admits the ignorance was culpable but the action was too costly.
  *   **The Private vs. Public Distinction:** Jefferson wrote privately against slavery while publicly maintaining it. Readers excuse the public action (Context) but often praise the private thought (Virtue). This is the peak of Moral Time-Zoning: claiming the *action* was bound by the era, but the *mind* was free of it.
  *   **The Consistency Test:** If a reader excuses Jefferson for slavery (Structural) but blames him for holding religious views that were standard then (Idiomatic/Foundational to Enlightenment), point out the **Asymmetry**. Ask: "Was the social cost of deism lower than the cost of manumission?" (Often, it wasn't).

  ### 5. Summary for your Book Club

  If you need to articulate this without sounding like you're inventing jargon, say this:

  > "We are engaging in **Asymmetric Historical Contextualism**. We are applying **Constitutive Moral Luck** to their vices (they couldn't help their era) but denying it to their virtues (they were geniuses ahead of their time). We excuse **Structural Sins** where the cost of dissent feels high, but blame **Idiomatic Sins** where the cost feels low, regardless of the actual historical headcount. I call this **Moral Time-Zoning**: sending their worst behaviors to a different moral jurisdiction while keeping their best behaviors in ours."

  You haven't missed a term. You've identified a blind spot in how we consume history. "Moral Time-Zoning" is the right handle for it. Keep it.
