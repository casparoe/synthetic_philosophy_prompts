answer: |-
  Good evening, everyone. For those who don't know me, I'm [Your Name], [Sister]'s sibling.

  Looking around this room, I see a fascinating divide. On one side, we have the family, who are happy to be here, eating good food, and thinking, "Finally, they're married." On the other side, we have [Groom]'s friends from grad school, who I'm pretty sure are currently analyzing the semiotics of the centerpieces.

  And honestly, that divide is the perfect way to talk about [Groom].

  As many of you know, [Groom] took about three years to propose. Three years. Now, for the family members who think philosophy is a waste of a perfectly good brain, you might assume he was just nervous. But those of you who know L.A. Paul's work on "Transformative Experience" know exactly what was happening.

  For the rest of you—hi Grandma—here is the non-lecture version. [Groom] was stuck on a very specific puzzle. The idea is that marriage is a "transformative experience." It changes who you are so fundamentally that the person you are *now* literally cannot know what it will be like to be the person you are *after* you're married.

  So, he was trapped. He thought: "How can I rationally choose a future if the 'me' who has to live in that future doesn't exist yet?" He wanted a map for territory that hasn't been discovered. He wanted to read the reviews for a movie that hasn't been filmed.

  There were times I wanted to shake him. I'd say, "[Groom], she's right there." And he'd look at me with these very serious, very tired eyes and say, "But do I have the epistemic authority to commit the future self?"

  And Grandma, to answer your question: Yes, we all wanted to tell him to just eat the casserole and see if he likes it.

  But here is the thing I realized watching him wrestle with this for three years. He wasn't hesitating because he didn't love [Sister]. He was hesitating because he loved her *so much* that the stakes felt infinite. He wasn't a robot calculating cold numbers; he was a guy who cared so deeply about getting it right that he was terrified of getting it wrong. He was overthinking because he wanted to be worthy of her.

  And eventually, he did propose. The family joke is that he finally popped the question once he decided that an unknowable outcome was statistically the best bet he was ever going to get.

  But I think it's more than that. I think he realized that the philosophy problem *is* the answer.

  L.A. Paul says you can't know who you'll become. And she's right. You can't. But love isn't about knowing. Love isn't a calculation of known variables. Love is the decision to jump even when you can't see the ground.

  [Groom], you spent three years worried that you couldn't rationally choose to change. But [Sister] didn't fall in love with a static statue. She fell in love with a partner. She wants the version of you that exists *after* the jump, just as much as the one standing here today.

  Marrying [Sister] isn't a failure of rationality. It's an act of courage. It is looking at the vast, unknown, terrifying future and saying, "I don't know who I'll be in ten years. I don't know who you'll be. But I know I want to find out alongside you."

  To the philosophers in the room: You can debate the epistemic gap all you want.
  To the family: You can be glad the casserole is finally being eaten.
  But for [Sister] and [Groom], the point isn't to solve the puzzle. The point is to live the answer.

  So, if everyone could please raise a glass.

  To [Sister] and [Groom]. May you never know exactly what's coming next. May you constantly surprise each other. And may you always be brave enough to choose the unknown, together.

  To the bride and groom!
