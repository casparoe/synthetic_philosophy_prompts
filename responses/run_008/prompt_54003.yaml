      *   *Premise 2 (Iterative Fitting):* Math is filed down to fit the data over time. It's not a priori harmony; it's post-hoc engineering.
      *   *Premise 3 (Structural Constraints):* Cross-domain applicability (e.g., same function in QM and elsewhere) isn't magic; it's because physical constraints (locality, 3D space, conservation laws) limit the possible mathematical structures nature can instantiate.
