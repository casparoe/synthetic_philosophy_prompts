  In my epistemology class we just covered the Clifford vs James thing, and honestly I don't get why it's even a debate. Clifford proved that it's always wrong to believe anything without sufficient evidence, right? So James's "The Will to Believe" is basically just saying we should believe whatever makes us feel good, which seems like it loses instantly. Also my TA said Clifford's principle is self-undermining because he has no evidence for the principle itself — is that actually James's argument or did she just make that up? Is there some big thing I'm missing here, or do professors only teach James out of historical curiosity?
