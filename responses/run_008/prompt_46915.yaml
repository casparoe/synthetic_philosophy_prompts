  Dear Friend,

  It was fascinating to watch Dara work through the seminar discussions these past few weeks, and I think I have a reasonable sense of how she will handle the new cases tomorrow, though predicting her requires untangling the web of intuitions she relies on. Based on her past rulings, I predict she will say that the evidence regarding the pre-1965 quarters does support the hypothesis that the uncatalogued roll of pre-1965 quarters is silver throughout, but she will deny that this same evidence supports the hypothesis that a quarter minted in 1968 is silver. Regarding the particle case, I predict she will rule that the five observations do support the hypothesis that every particle of this newly discovered kind decays within a nanosecond. These verdicts might seem straightforward to her, but they actually reveal a tension in the philosophical rules we have been discussing, because no single rule perfectly captures her pattern of judgments across both the old and new cases.

  To understand why, we need to look at the three candidate rules that fit her past performance equally well. The first is the Positional Rule, which holds that a hypothesis is unprojectible if its predicate implicitly or explicitly references a specific time, place, or arbitrary grouping. This fits her rejection of grue, which sneaks in a date, and her rejection of the lab cabinet and seminar cases, which rely on specific locations or groups. The second is the Entrenchment Rule, associated with Goodman, which suggests that a predicate is projectible only if it has a long history of successful past projections. This explains why she accepts green and black but rejects grue, and why she accepts gold but rejects the cabinet contents, as the latter lacks a history of being treated as a natural kind. The third is the Lawlike or Natural Kind Rule, which posits that support flows only to hypotheses that express laws of nature or describe genuine natural kinds, rather than accidental generalizations. This fits her acceptance of gold and ravens as lawlike or kind-based, and her rejection of the cabinet and seminar cases as accidental.

  The trouble arises when we apply these rules to the new cases, because they pull in opposite directions. In the numismatics case, the Entrenchment Rule suggests she should accept the projection, since quarters and silver are deeply entrenched concepts, but the Lawlike Rule suggests she should reject it, because the composition of quarters is a matter of legislative convention rather than natural necessity, much like the stocking of the lab cabinet. The Positional Rule is also ambiguous here, as pre-1965 references a date, which looks suspiciously like grue, yet it defines the subject class rather than the predicate. In the particle case, the situation reverses. The Lawlike and Positional Rules suggest she should accept the projection, because particle decay is governed by laws of nature and involves no sneaky spatial or temporal references in the predicate. However, the Entrenchment Rule suggests she should be skeptical, because this is a newly discovered kind with no history of past projections, making it as unentrenched as grue was at the start. Since I believe Dara will accept the projection in the particle case due to its scientific nature, and accept the coin roll projection due to the stability of the kind, she is effectively prioritizing Natural Kind intuitions over strict Entrenchment, while treating historical kinds like pre-1965 quarters as valid kinds despite their accidental origins.

  This mix of verdicts means we cannot simply say she is a Goodmanian or a Natural Kind theorist without further testing. To discriminate between these candidate rules, specifically to see if she truly privileges Entrenchment over Lawlikeness or vice versa, I propose we present her with a case involving an entrenched predicate applied to an clearly accidental grouping. Imagine we show her a specific bag of marbles known to belong to a child named Tim, and every marble drawn from this bag so far has been red. We then ask if this supports the hypothesis that all the marbles in this bag are red. The Entrenchment Rule would predict she says yes, because marbles, red, and bags are all familiar, entrenched concepts with no tricky definitions. However, both the Positional Rule and the Lawlike Rule would predict she says no, because the bag is a specific spatial location like the lab cabinet, and the regularity is accidental rather than lawlike. If she rejects this hypothesis, it confirms she is following the Lawlike or Positional intuition despite the entrenchment of the terms. If she accepts it, it suggests her reliance on Entrenchment is stronger than her worry about accidental generalizations, which would force us to rethink her rejection of the lab cabinet case. This single case would strip away the confounding variable of scientific authority present in the particle case and the historical kind status present in the coin case, leaving us with a pure test of whether familiarity or lawfulness drives her confidence.

  I hope this helps you prepare for the meeting, and I look forward to hearing how she responds.

  Best wishes,

  Your Classmate
