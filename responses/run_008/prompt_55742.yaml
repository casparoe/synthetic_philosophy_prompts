answer: |-
  ### Essay Question

  Consider a consumer who, facing literally the same budget set on different occasions—identical prices, income, and available options—selects Bundle A approximately 70% of the time and Bundle B approximately 30% of the time. Standard revealed preference theory typically presupposes single-valued, stable choice functions. Write an essay addressing the following: (i) When preference is defined strictly in terms of choice, what is the status of the claim that "agents maximize utility"? Is it a stipulative definition, an empirical hypothesis, or a measurement convention? (ii) Does the split-choice consumer described above break the revealed preference program, or can the program absorb this behavior by redefining the objects of preference (e.g., as lotteries or context-specific goods)? What is the theoretical cost of each solution? (iii) What follows for the meaning of "utility" on this view? Specifically, are utility levels merely summaries of choice dispositions, and does this render talk of utility gains or interpersonal comparisons meaningless or merely undefined?

  ***

  ### Model Answer

  The revealed preference program attempts to ground economics in observable behavior rather than unobservable psychology. However, this creates a fundamental tension regarding the status of the theory. If preference is *defined* strictly as choice (i.e., $x \succeq y$ if and only if $x$ is chosen over $y$), then the claim that "agents maximize utility" is a tautology. It reduces to "agents choose what they choose." For the theory to function as science rather than logic, it must be treated as an **empirical hypothesis** constrained by consistency axioms like WARP. The definition provides the language, but the axioms provide the testable content. Without assuming stability and consistency, the definition alone explains nothing.

  The split-choice consumer (70% A, 30% B) challenges this empirical content. Under strict deterministic revealed preference, this behavior violates WARP: if A is chosen when B is available, B is revealed not preferred to A. Yet B is sometimes chosen. The program can absorb this, but only at a cost. One option is to claim the budget sets were not actually identical due to unobserved state variables (e.g., mood, weather). This saves the theory but risks making it unfalsifiable; any anomaly can be explained away by inventing hidden states. A more honest absorption is to treat the objects of choice as **lotteries**. The consumer chooses a probability distribution over bundles. However, this shifts the framework from ordinal utility over bundles to expected utility over lotteries. Expected Utility Theory requires **cardinal utility** to measure risk attitudes. Thus, saving the theory from stochastic data undermines the original ordinalist goal of revealed preference. We regain predictive power but lose the claim that utility is purely ordinal and behaviorist.

  Consequently, the meaning of "utility" must be understood instrumentally. Utility levels are not psychological quantities being measured; they are mathematical summaries of choice dispositions. To say utility increased is merely to say the agent moved to a chosen bundle. This has stark implications for welfare analysis. If utility is just a representation of individual choice structure, **interpersonal comparisons** are strictly meaningless. There is no common scale connecting my choice dispositions to yours. One might extend the framework by adding ethical axioms (e.g., assuming identical utility functions across agents), but this moves outside the revealed preference program itself. Ultimately, the revealed preference approach succeeds in purging psychology only by risking emptiness; to regain empirical content against stochastic data, it must reintroduce structural assumptions that look suspiciously like the psychological constructs it sought to avoid.

  ***

  ### Marking Scheme (Total: 20 Marks)

  **Part 1: Status of the Claim (4 Marks)**
  *   **2 Marks:** Identifies the risk of tautology/circularity if preference is *only* a definition of choice.
  *   **2 Marks:** Correctly identifies that for the theory to have content, it must function as an **empirical hypothesis** reliant on consistency axioms (like WARP/SARP), not just a definition.

  **Part 2: The Split-Choice Scenario (6 Marks)**
  *   **2 Marks:** Recognizes that deterministic revealed preference views this as a violation (instability).
  *   **2 Marks:** Discusses absorption strategies (e.g., unobserved states or redefining objects as lotteries).
  *   **2 Marks:** Identifies the **theoretical cost**: Redefining objects as lotteries implies Expected Utility, which requires **cardinal utility**, undermining the ordinalist foundation.

  **Part 3: Meaning of Utility (4 Marks)**
  *   **2 Marks:** Defines utility as a summary of dispositions rather than a psychological reality.
  *   **2 Marks:** Correctly concludes that interpersonal comparisons are meaningless/undefined within the strict framework without extra ethical assumptions.

  **Critical Insight: The Explanatory Tension (6 Marks)**
  *   **0-3 Marks (B-Level):** Treats "defining preference by choice" and "testing choice theories" as compatible, independent facts. Describes the mechanics correctly but misses the philosophical friction.
  *   **4-6 Marks (A-Level):** Explicitly articulates the tension: defining preference by choice risks emptiness (tautology), but adding structure to make it testable (axioms/lotteries) reintroduces unobservables or cardinality. Recognizes that the program pulls in opposite directions between **behaviorist purity** and **explanatory power**.

  **Grade Boundaries**
  *   **A (17-20):** Must score 4+ on **Critical Insight**. Answers must integrate the three parts into a coherent argument about the limits of the revealed preference program.
  *   **B (14-16):** Competent technical answers to (i)-(iii) but treats the framework as consistent and unproblematic. Caps at 16 if the **Critical Insight** score is 3 or below (i.e., fails to see the tension between definition and testability).
  *   **C (10-13):** Addresses the scenario but confuses ordinal/cardinal distinctions or fails to identify the tautology risk.
  *   **D/F (0-9):** Significant errors in choice theory basics or fails to address the prompt.
