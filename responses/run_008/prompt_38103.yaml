      *   *Lookup Table?* It's the same problem (triviality) but sharper. It forces you to distinguish between *simulating* a function and *having* a function.
      *   *Grain fixed by science?* That's **Psychofunctionalism**. It's a rescue, not a surrender. It moves the debate from philosophy to cognitive science.
