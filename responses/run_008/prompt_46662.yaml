answer: |-
  # Session Plan: The Architecture of Herding (90 Minutes)

  **Target:** 20 University Students (Social Epistemology/Behavioural Economics)
  **Objective:** Demonstrate information cascades, distinguish them from reputational herding, and demonstrate cascade fragility.
  **Materials:** Two opaque urns (labelled A and B), Red and Blue tokens (60 Red, 60 Blue), Scoreboard, Printed private signal cards (or digital equivalent), Point tally sheet.

  ---

  ## 1. The Core Game: Informational Cascades (30 Minutes)

  ### Setup and Parameters
  *   **The Urns:**
      *   **Urn A:** 2 Red tokens, 1 Blue token.
      *   **Urn B:** 1 Red token, 2 Blue tokens.
  *   **The State:** The facilitator privately flips a coin to select the "True Urn" (e.g., Urn A). This remains fixed for the entire round.
  *   **The Signal:** Students enter sequentially. Each draws one token from the True Urn, observes the colour (Private Signal), returns it, and shakes the urn.
      *   **Signal Accuracy:** 2/3 (66.7%).
      *   **Defence of Parameter:**
          *   *If 50%:* Signal is noise; no learning occurs.
          *   *If 90%:* The first agent is almost certainly correct; cascades form trivially and are rarely wrong.
          *   *Why 2/3:* It allows a cascade to form quickly (after only two agents) but retains enough uncertainty that the cascade locks onto the *wrong* urn approximately 20% of the time (specifically, if the first two signals are misleading). This creates sufficient tension for the seminar.
  *   **Payoffs:** 10 points for guessing the True Urn correctly. 0 points for incorrect. (Accumulated points convert to course credit or small prizes).

  ### Procedure
  1.  Select 10 students to form a "Decision Line." The remaining 10 are "Observers" (they record choices but do not play).
  2.  Students step out one by one, draw a token, memorize the colour, return it, and announce their guess publicly ("Urn A" or "Urn B").
  3.  **Constraint:** No communication other than the public guess. Observers must remain silent.

  ### Facilitator Notes: The Bayesian Arithmetic
  *Use this script during the debrief to validate the rationality of the herd.*

  *   **Prior:** P(A) = 0.5, P(B) =0.5.
  *   **Likelihoods:** P(Red|A) = 2/3, P(Blue|A) = 1/3. P(Blue|B) = 2/3, P(Red|B) = 1/3.

  **Decision 1 (Player 1):**
  *   Sees Red.
  *   Posterior P(A|Red) = $\frac{0.5 \times 2/3}{0.5} = 2/3$.
  *   **Action:** Guess A. (Rational).

  **Decision 2 (Player 2):**
  *   *Scenario X (Sees Red):* Infers P1 saw Red (since P1 guessed A).
      *   Evidence: Red, Red.
      *   Posterior P(A|R,R) = $\frac{0.5 \times (2/3)^2}{0.5 \times (2/3)^2 + 0.5 \times (1/3)^2} = \frac{4/9}{5/9} = 4/5$.
      *   **Action:** Guess A.
  *   *Scenario Y (Sees Blue):* Infers P1 saw Red.
      *   Evidence: Red, Blue.
      *   Posterior P(A|R,B) = $\frac{0.5 \times (2/3)(1/3)}{0.5 \times (2/3)(1/3) + 0.5 \times (1/3)(2/3)} = 1/2$.
      *   **Action:** Indifferent. Follows private signal (Blue). Guesses B.

  **Decision 3 (Player 3) — The Cascade Point:**
  *   *History:* A, A. (Implies P1=Red, P2=Red).
  *   *Private Signal:* Blue.
  *   *Calculation:* Player 3 weighs public history (R, R) against private signal (b).
      *   Likelihood A: $(2/3) \times (2/3) \times (1/3) = 4/27$.
      *   Likelihood B: $(1/3) \times (1/3) \times (2/3) = 2/27$.
      *   Posterior P(A) = $\frac{4/27}{4/27 + 2/27} = 2/3$.
  *   **Action:** Guess A.
  *   **Critical Insight:** Player 3 ignores their private signal. Their action provides **zero new information** to Player 4. Player 4 faces the exact same calculation regardless of their own signal. The cascade is self-sustaining.

  ---

  ## 2. Variant Phase: Informational vs. Reputational Herding (25 Minutes)

  ### Objective
  Distinguish between herding because you think others know better (Informational) vs. herding to avoid standing out (Reputational/Conformity).

  ### Setup
  Swap roles: Observers become the Decision Line.
  **Condition Change:** Alter the payoff structure to introduce reputational concern.

  *   **Round 1 (Informational):** 10 points for Accuracy. (Repeat of Phase 1).
  *   **Round 2 (Reputational):** 5 points for Accuracy + **10 points for Conformity**.
      *   *Conformity Bonus:* Awarded if your public guess matches the **immediate predecessor's** guess.

  ### Predicted Behavioural Shift
  *   **Informational:** Players only herd if the public history outweighs their private signal (requires 2 predecessors). If P1=A, P2=B, P3 follows their private signal.
  *   **Reputational:** Players may herd immediately.
      *   *Example:* P1 guesses A. P2 sees Blue (suggests B).
      *   *Info Calculation:* Expected Value (Guess B) = 0.66 * 10 = 6.6 pts.
      *   *Rep Calculation:*
          *   Guess B (Follow Signal): 5 (accuracy) + 0 (no match) = 5 pts.
          *   Guess A (Match Predecessor): 0 (accuracy) + 10 (match) = 10 pts.
      *   **Result:** Rational agents in the Rep condition will ignore private signals immediately to secure the conformity bonus.

  ### Debrief Check
  Ask the class: "In Round 2, did anyone guess against their private signal?"
  *   If **Yes**: Reputational herding occurred. The cascade formed faster (at Player 2) and is based on incentives, not inference.
  *   If **No**: Discuss why the accuracy incentive dominated. (Note: This highlights that real-world herding often requires both mechanisms).

  ---

  ## 3. Fragility Demonstration (15 Minutes)

  ### Objective
  Show that cascades are brittle because they contain less information than they appear to.

  ### Procedure
  1.  Run a standard Informational Cascade (10 points for accuracy) until Player 5.
  2.  Assume a cascade has formed (e.g., A, A, A, A, A).
  3.  **The Intervention:** Stop the game. Announce: "We are going to reveal the private signal of Player 1."
  4.  **The Twist:** Reveal that Player 1 did **not** draw a token. They were instructed to guess randomly to start the chain.
  5.  **Ask Player 6:** "What do you do now?"

  ### The Logic
  *   **Before Revelation:** Player 6 assumes the history (A, A, A, A) represents at least 2 confirming signals (R, R), outweighing any private signal.
  *   **After Revelation:** Player 1's action was noise.
      *   Player 2 saw P1=A. If P2 saw Blue, P2 would have guessed B (see Bayesian Arithmetic, Decision 2 Scenario Y). Since P2 guessed A, P2 must have seen Red.
      *   Player 3 saw P1=A, P2=A. Since P1 was random, P3 cannot infer P2's signal with certainty based on P1. The chain of inference is broken.
      *   **Result:** The public history collapses from "Overwhelming Evidence" to "Mixed/Unknown." Player 6 should revert to following their own private signal.
  *   **Lesson:** Cascades rely on the *common knowledge of rationality* and signal integrity. A single crack in the foundation shatters the herd's confidence.

  ---

  ## 4. The Debrief (15 Minutes)

  Map the activity to formal social epistemology results.

  1.  **Self-Sustaining Beliefs:** Explain that after two identical public choices, the public history outweighs any single private signal (2/3 vs 1/3 math). Agents are being *rational* by ignoring their own eyes.
  2.  **Information Loss:** Emphasize that once in a cascade, public actions carry **zero information**. The group stops learning. The "Wisdom of Crowds" fails because the crowd is no longer independent.
  3.  **Path Dependence:** If the first two students drew misleading signals (probability 1/9 that both draw Blue when Urn is A), the entire class locks onto the wrong urn forever. The outcome depends on the order of agents, not just the aggregate data.
  4.  **Limitations of the Classroom:**
      *   *Financial Stakes:* Points are not ruinous. Real cascades (bank runs, stock crashes) involve existential risk which may heighten herding.
      *   *Privacy:* In class, signals are physically private but socially visible (nervousness). In models, signals are strictly mathematical.
      *   *Scale:* 20 students vs. millions. In large networks, cascades can form on local clusters before merging.
      *   *Facilitator Assertion:* You must assert that the "True Urn" was fixed and random. In the real world, agents often suspect the environment itself is manipulated.

  ---

  ## 5. Predicted Failure Modes & Remedies

  | Failure Mode | Symptom | Remedy |
  | :--- | :--- | :--- |
  | **Deliberation Contamination** | Students whisper hints ("I got a red one") or facial expressions leak signals. | **Strict Protocol:** Enforce "Sterile Conditions." Players stand at the front, back to the class. Signals are drawn in a opaque box where hands cannot be seen. |
  | **Payoff Misunderstanding** | Players try to "help the class" find the truth rather than maximizing own points. | **Framing:** Explicitly state: "You are competing for individual ranking. Helping the group reduces your relative score." Check understanding with a quiz question before starting. |
  | **Cascade Failure (Alternation)** | Signals alternate (A, B, A, B) preventing a cascade from forming. | **Multiple Lines:** Run 3 parallel lines of 5 students instead of 1 line of 15. Probability dictates at least one line will cascade. Use the successful line for the debrief. |
  | **Second-Guessing** | Players say "Everyone else is wrong, I'll be contrarian." | **Pre-Commitment:** Remind them the goal is *accuracy*, not uniqueness. Show the Bayesian math on the board *before* Phase 1 to establish the rational baseline. |
  | **Reputational Confusion** | In Phase 2, students don't understand the Conformity Bonus. | **Visual Aid:** Project a payoff matrix. "If Predecessor chose A, and you choose A, you get +10. If you choose B, +0." |

  ---

  ## Facilitator Checklist
  *   [ ] Urns prepared (2:1 ratio verified).
  *   [ ] Scoreboard visible.
