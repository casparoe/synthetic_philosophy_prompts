          1.  Core Game: Urn-guessing task, sequential public choice, private signals, stated accuracy. Specify accuracy, defend choice. Use points. Show Bayesian arithmetic for first decisions.
          2.  Variant Phase: Distinguish informational herding vs. reputational herding (accuracy vs. matching majority/competence).
          3.  Fragility Demonstration: Shatter a running cascade (e.g., reveal private signal).
          4.  Debrief: Map phases to formal results, limitations of the classroom setting.
          5.  Predicted Failure Modes: Specific remedies for common issues (deliberation, payoff misunderstanding, etc.).
      *   **Format:** Present only the finished session plan. No preamble, no restating brief, no meta-commentary. Start directly with the activity.

  2.  **Deconstruct the Core Game (Information Cascade):**
      *   *Standard Model:* Bikhchandani, Hirshleifer, Welch (1992).
      *   *Setup:* Two urns, A and B. Urn A has more red balls, Urn B has more blue balls (or vice versa). Nature picks an urn. Students draw a ball (private signal) and guess the urn (public action).
      *   *Signal Accuracy:* Needs to be high enough to be informative but low enough that conflicting signals create uncertainty. Standard is 2/3 (e.g., 2 red, 1 blue in Urn A; 2 blue, 1 red in Urn B).
      *   *Why 2/3?* If 1/2, signal is noise. If 100%, no cascade needed. If 51%, cascades take too long for a 90-min class. If 90%, the first person is almost always right, making the cascade trivial. 2/3 allows a cascade to start early (after 2 people) but leaves room for error.
      *   *Bayesian Math:*
          *   Prior: P(A) = P(B) = 0.5.
          *   Signal: Red (r) or Blue (b).
          *   Likelihood: P(r|A) = 2/3, P(b|A) = 1/3. P(b|B) = 2/3, P(r|B) = 1/3.
          *   Person 1: Sees r. Posterior P(A|r) = (0.5 * 2/3) / 0.5 = 2/3. Guess A.
          *   Person 2: Sees r. Knows P1 saw r (inferred from action). Posterior P(A|r,r) = (0.5 * 4/9) / (0.5 * 4/9 + 0.5 * 1/9) = 4/5. Guess A.
          *   Person 2: Sees b. Knows P1 saw r. Posterior P(A|r,b) = (0.5 * 2/9) / (0.5 * 2/9 + 0.5 * 2/9) = 1/2. Indifferent. Break tie by private signal.
          *   Person 3: If P1=A, P2=A. P3 sees b. P3 knows P1 saw r. P2 saw r (because if P2 saw b, P2 would have guessed B based on private signal since P1's signal was cancelled out). So P3 infers history is r, r. Private is b. Total evidence: r, r, b. Posterior P(A|r,r,b) = (0.5 * 4/27) / (0.5 * 4/27 + 0.5 * 2/27) = 2/3. Guess A.
          *   *Crucial Point:* Once two identical public choices occur (A, A), a cascade starts. Person 3 ignores private signal. Person 4 ignores private signal. The public history outweighs any single private signal.
      *   *Payoffs:* Points for correct guess.

  3.  **Variant Phase (Informational vs. Reputational):**
      *   *Informational:* Payoff for correctness only. (Standard Phase 1).
      *   *Reputational:* Payoff for matching the majority OR being perceived as competent.
      *   *Design:* Split class or run sequential rounds. Let's run sequential rounds to save time and allow comparison.
      *   *Condition 1 (Info):* 10 points for correct urn.
      *   *Condition 2 (Rep):* 10 points for correct urn + 5 points if your choice matches the majority choice of the round (or previous players). Actually, to distinguish *why* they herd, we need a condition where being right is less important than fitting in.
      *   *Better Design:* Split the class into two groups of 10 running parallel, or do two rounds. Parallel is better for comparison but harder to manage. Sequential rounds are easier.
      *   *Round 1:* Standard Info Cascade (Points for accuracy).
      *   *Round 2:* Reputational Cascade (Points for accuracy + Bonus for matching predecessor). Or simply tell them "You are evaluated on how much you agree with the consensus."
      *   *Refinement:* To make the distinction clear:
          *   Group A (Info): Paid for accuracy.
          *   Group B (Rep): Paid for accuracy + Paid if choice matches majority of class.
          *   Actually, Scharfstein & Stein (1990) model is about reputational concern regarding ability. Let's simplify for 90 mins.
          *   *Plan:* Round 1: Accuracy only. Round 2: Accuracy + Conformity Bonus. Compare cascade speed and robustness.

  4.  **Fragility Demonstration:**
      *   Cascades are brittle because they contain little information (only the first few signals matter).
      *   *Intervention:* Mid-cascade, reveal the private signal of one participant publicly.
      *   *Effect:* If the cascade is based on A, A, and we reveal Person 3 actually saw 'b' but chose A, the next person realizes the public history is less informative than thought. Or, introduce a "Expert" who reveals their signal.
      *   *Better:* Stop the sequence at Person 5 (deep in cascade). Reveal Person 3's private signal was contrary to the public choice. Show how Person 6 should update.
      *   *Alternative:* Introduce a "Public Signal" (e.g., a news report) that contradicts the cascade.
      *   *Selected:* The "Signal Revelation." Stop the line. Reveal what Person 3 actually drew. Recalculate the posterior for Person 4 onwards.

  5.  **Debrief:**
      *   Map actions to BHW (1992) model.
      *   Explain the "loss of information" (actions become uninformative).
      *   Discuss path dependence (wrong urn can be chosen).
      *   Limitations: No real money (though points matter), small N, face-to-face pressure.

  6.  **Failure Modes:**
      *   *Deliberation:* Students talk. *Remedy:* Strict silence, written notes.
      *   *Payoff Confusion:* *Remedy:* Simple slide, check understanding.
      *   *No Cascade:* Randomness. *Remedy:* Run multiple lines if needed, or explain probability.
      *   *Second-guessing:* *Remedy:* Emphasize rationality assumption for the sake of the model.

  7.  **Timing (90 mins):**
      *   Intro & Rules (10 mins)
      *   Phase 1: Info Cascade (25 mins)
      *   Phase 2: Rep vs Info (25 mins)
      *   Fragility Demo (15 mins)
      *   Debrief & Discussion (15 mins)
      *   *Wait, 20 students.* Sequential takes time. 20 students x 1 min = 20 mins per round.
      *   *Adjustment:* Run two parallel lines of 10 students each to save time. Or just one line of 10, others observe. Observers are good for epistemology (watching knowledge formation).
      *   *Revised Plan:* One line of 10 active players, 10 observers. Swap for Phase 2.
      *   *Timing:*
          *   Intro: 10
          *   Phase 1 (Info): 20 (setup + play)
          *   Phase 2 (Rep): 20 (setup + play)
          *   Fragility: 15
          *   Debrief: 25
          *   Total: 90.

  8.  **Drafting the Content - Specific Calculations:**
      *   Urn A: 2 Red, 1 Blue.
      *   Urn B: 1 Red, 2 Blue.
      *   Prior: 0.5.
      *   P(Red|A) = 2/3.
      *   Cascade starts after 2 identical public choices.
      *   Need to ensure the facilitator knows *exactly* when the cascade locks.
      *   If P1=A, P2=A. P3 is in cascade. P3's action tells us nothing about P3's signal.
      *   If P1=A, P2=B. No cascade. P3 decides based on own signal + mixed history (which cancels out). P3 is effectively P1.

  9.  **Refining the Reputational Variant:**
      *   To distinguish informational from reputational, we need a condition where people herd *even when* their private information suggests otherwise, *not* because they think the predecessors know better, but because they want to fit in.
      *   In Info cascade, they herd because they think predecessors know better (rational inference).
      *   In Rep cascade, they herd to avoid standing out.
      *   *Implementation:*
          *   Round 1 (Info): Points for correct guess.
          *   Round 2 (Rep): Points for correct guess MINUS penalty if you are the only one who disagrees with the predecessor. Or simply: Points for matching the majority.
          *   *Better:* Keep accuracy payoff, add "Conformity Bonus". If your choice matches the previous person, +5 points. This incentivizes herding even if private signal contradicts.
          *   *Comparison:* In Round 1, herding stops if private signal is strong enough (though in standard model, it doesn't, because public history outweighs single signal). Wait, in standard info cascade, once started, you *always* herd regardless of private signal.
          *   *Distinction:* The distinction is subtle in the standard model because rational herding *looks* like conformity.
          *   *Key Difference:* In Info cascade, if the public history is mixed (A, B), you follow private signal. In Rep cascade, you might follow the predecessor even if history is mixed to avoid conflict.
          *   *Alternative Variant:* "The Expert." Tell half the class that one player is an "Expert" (always right). See if others herd on the Expert even if it contradicts math.
          *   *Let's stick to the prompt:* "Distinguishing informational herding from reputational herding."
          *   *Setup:*
              *   Condition 1 (Info): Payoff depends on accuracy.
              *   Condition 2 (Rep): Payoff depends on accuracy AND being perceived as competent. To simulate "perceived competent," we tell them: "You get a bonus if your choice matches the majority choice of the group."
              *   *Prediction:* In Info, cascades start after 2 identical signals. In Rep, cascades might start immediately (Person 2 matches Person 1 regardless of signal) or persist longer.
              *   *Actually, the cleanest way:* In Info, if the cascade is wrong, a sufficiently strong public signal (like revealing a private signal) breaks it. In Rep, even if you know the predecessor was guessing, you might still match them to get the conformity bonus.
              *   *Let's simplify for the session:*
                  *   Round 1: Accuracy only. (Informational).
                  *   Round 2: Accuracy + Bonus for matching the immediate predecessor. (Reputational/Conformity).
                  *   Debrief: Compare how quickly cascades formed. In Round 2, Person 2 might match Person 1 even if signals differ (if bonus > expected loss from error).

  10. **Refining Fragility:**
      *   Stop the game at Player 5.
      *   Announce: "We are going to reveal Player 3's private signal."
      *   If Player 3 chose A, but signal was B.
      *   This shows Player 3 was in a cascade (ignored signal).
      *   Does this break the cascade for Player 6?
      *   In standard model, Player 6 already assumes Player 3's signal is ignored. So revealing it doesn't change the math *unless* it reveals the cascade started earlier or later than thought.
      *   *Better Fragility:* Introduce a "Public Signal" that is moderately strong. E.g., "The Professor peeked in the urn and saw 2 Red balls."
      *   *Or:* The "Contrarian Incentive." Offer a huge reward for being the one who breaks the cascade correctly.
      *   *Prompt Suggestion:* "A single public revelation of a private signal... or a new entrant with no reputational stake."
      *   *Let's use the "New Entrant" idea.* Bring in a student from outside (or pretend) who doesn't see the history, only the urn? No.
      *   *Let's use the "Signal Revelation" carefully.* If the cascade is A, A, A, A. Students assume signals were r, r, r, r. If we reveal Player 3 had 'b', it confirms the cascade logic (they ignored it). It doesn't break it.
      *   *To break it:* We need to show the public history is *less* reliable than thought.
      *   *Idea:* Tell them "Actually, Player 1 was guessing randomly." This destroys the foundation.
      *   *Selected:* The "Foundation Shock." Mid-cascade, reveal that the first player did not see a signal but guessed randomly. This collapses the posterior for everyone downstream.

  11. **Final Review of Constraints:**
      *   90 mins.
      *   20 students.
      *   No preamble.
      *   Specific signal accuracy (2/3).
      *   Bayesian arithmetic included.
      *   Failure modes included.

  12. **Writing the Plan:**
      *   Structure: Session Overview, Phase 1 (Info Cascade), Phase 2 (Rep Variant), Phase 3 (Fragility), Debrief, Failure Modes.
      *   Tone: Professional, instructional, precise.

      *Self-Correction on Bayesian Math:*
      *   Need to be very clear in the facilitator notes.
      *   Urn A: 2/3 Red. Urn B: 2/3 Blue.
      *   P(A) = 0.5.
      *   P1 sees Red. P(A|R) = 2/3. Chooses A.
