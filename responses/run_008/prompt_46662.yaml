      *   P2 sees Blue. Infers P1 saw Red. P(A|R,B) = 1/2. Indifferent. Follows private signal (Blue). Chooses B.
      *   P3 sees History (A, A). Infers Signals (R, R).
      *   P3 sees Blue. Total evidence (R, R, B). Likelihood A: (2/3)*(2/3)*(1/3) = 4/27. Likelihood B: (1/3)*(1/3)*(2/3) = 2/27.
      *   Ratio 2:1. P(A) = 2/3. Chooses A.
      *   *Crucial:* P3 ignores private signal. Cascade starts.

      *Self-Correction on Reputational Variant:*
      *   To make it distinct: In Info cascade, P2 follows P1 only if signals match (or if P2 is indifferent). In Rep cascade, P2 follows P1 even if signals contradict (if conformity bonus is high).
      *   Payoff: Correct = 10 pts. Incorrect = 0. Conformity Bonus = 6 pts (if match predecessor).
      *   If P1 chooses A. P2 sees Blue (suggests B).
      *   Info: Expected value of A (based on P1's signal) is 2/3 * 10 = 6.67. Expected value of B (private signal) is 2/3 * 10 = 6.67. (Wait, if P1=A, P1 saw Red. P2 sees Blue. P(A|R,B) = 0.5. So EV is 5 for both). P2 follows private signal (B).
      *   Rep: Choose A (match P1). Payoff = 0 (wrong) + 6 (bonus) = 6. Choose B (match private). Payoff = 10 (right) + 0 (bonus) = 10.
      *   *Adjustment:* Need Conformity Bonus to outweigh Accuracy. Or make Accuracy payoff low.
      *   *Revised Rep Payoff:* Correct = 5 pts. Match Predecessor = 10 pts.
      *   Now P2 (seeing Blue, P1 chose A): Choose A -> 0 + 10 = 10. Choose B -> 5 + 0 = 5. P2 herds despite private signal.
      *   This creates a "Reputational Cascade" that is stronger/faster than Informational.

      *Self-Correction on Fragility:*
      *   If we reveal P1 was random, the whole chain collapses.
      *   Setup: Run cascade. Stop at P5. Reveal P1 was forced to guess without a signal.
      *   Result: P2's inference is void. P2 actually followed private signal. P3's inference is void.
      *   This demonstrates dependence on the "common knowledge of rationality."

      *Failure Modes:*
      *   Students laughing/talking. -> Strict rules.
      *   Students trying to be "clever" (non-rational). -> Emphasize "play for points."
      *   Cascade doesn't form (alternating choices). -> Have backup data or run multiple lines.

