answer: |-
  **Joint Statement on the Moral Relevance of Numbers in Rescue Cases**

  **1. Agreed Claims**

  1.  **Symmetry of Victims:** In the standard rescue cases under discussion, all potential victims are strangers to the rescuer and to one another. They are of equal age, possess equal prospects of life, and stand in no special relations (familial, contractual, or causal) to the rescuer that would generate differential duties.
  2.  **Equal Badness of Death:** We agree that death is an equal misfortune for each individual victim. From the standpoint of the person dying, the loss of their future is equally bad whether they die alone or as part of a larger group. There is no sense in which death is 'worse' for the individual in the larger group.
  3.  **Impartiality:** We agree that the rescuer is not permitted to favour any specific individual based on personal affection, bias, or arbitrary characteristics (such as race or gender). The decision must be made on impartial moral grounds.
  4.  **Fairness of Lotteries:** Where a randomising device is available and costless to employ, we agree that a fair lottery is a permissible method for deciding whom to rescue. We agree that such a procedure respects the equal moral status of each victim by giving each an equal ex-ante chance of survival. We disagree, however, on whether a lottery is *obligatory* or merely *permissible* when saving the greater number is an option.
  5.  **Non-Utilitarian Constraints:** Neither of us holds that moral reasoning is exhausted by outcome maximisation. We agree that there are agent-relative constraints (such as prohibitions on killing) that apply even if violating them would save more lives, though we disagree on whether a constraint against 'ignoring the many' applies in rescue cases.

  **2. Disagreements Table**

  | Topic | The Aggregator's Position | The Taurekian's Position | Notes on Verbal Dispute |
  | :--- | :--- | :--- | :--- |
  | **The Moral Weight of Numbers** | The fact that five people will die rather than one constitutes a morally decisive reason to save the five. The claims of the five, while individual, combine to create a stronger aggregate demand on the rescuer's agency. | There is no standpoint from which the losses of the five can be totalled into a single 'super-loss'. The rescuer faces five individual claims and one individual claim; none is stronger than the other. The number of claimants does not intensify the duty. | **Partial Verbal Dispute:** We disagree on whether 'worse' applies impersonally to the *outcome* (Aggregator) or only relatively to the *subjects* (Taurekian). However, this reflects a substantive disagreement about whether impersonal value guides duty. |
  | **Obligation vs. Permission** | In a choice between saving five and saving one, the rescuer is *obligated* to save the five. Saving the one is morally wrong, as it fails to respond to the stronger aggregate reason. | In a choice between saving five and saving one, the rescuer is *permitted* to save either, provided a fair procedure (like a coin toss) is used to give each individual an equal chance. Saving the one is not wrong if chosen via a fair lottery. | None. This is a substantive disagreement about the demandingness of moral duty. |
  | **The Role of Fairness** | Fairness is satisfied by giving each person's *interest* equal weight in the calculation. Since the interest in survival is identical, summing those interests respects them equally. Prioritising the many is the only way to respect the equal value of each life. | Fairness requires giving each *person* an equal chance of being saved, not weighting their interests by the size of the group. A lottery is the only way to acknowledge that no individual's claim is subordinate to the collective. | None. This is a substantive disagreement about the nature of procedural justice. |

  **3. Cruxes Section**

  We have identified three sub-questions where our predictions diverge sharply. Resolving these would likely move at least one party.

  **Sub-Question 1: Does probabilistic aggregation justify prioritising a group over a certain individual?**
  *Case: The Cascade Rescue.*
  Five miners are trapped in sequence (Route A); extraction takes an hour per miner with a 10% cumulative collapse risk at each stage. One miner is trapped separately (Route B); extraction is certain but takes the same total time.
  *   **Aggregator Prediction:** The rescuer ought to take Route A. The expected number of lives saved is approximately 4.08, which outweighs the certain saving of 1. The numbers count even when probabilistic.
  *   **Taurekian Prediction:** The rescuer is permitted to take Route B. No individual in the group has a claim stronger than the Single Miner's claim to certainty. The Taurekian does not sum the probabilistic claims of the five to outweigh the certain claim of the one.
  *   **Crucial Point for Taurekian:** The Taurekian must specify if the numbers *ever* count here. If the collapse risk were 0% (certain rescue for 5), the Taurekian still insists on a lottery between the Single and the *First* of the Five. In the Cascade, the Taurekian maintains that the uncertainty weakens the group's claims relative to the Single's certainty.
  *   **Crucial Point for Aggregator:** If the Aggregator concedes that certainty trumps expected value in this specific case, they admit that 'numbers' are not the sole determinant, but rather 'expected lives'.

  **Sub-Question 2: Does the impossibility of procedural fairness alter substantive obligation?**
  *Case: The Denied Lottery.*
  The choice must be made instantly; no randomising device is available, and victims cannot choose.
  *   **Aggregator Prediction:** The impossibility of a lottery changes nothing. The rescuer ought to save the five. The duty to save the greater number is substantive, not merely procedural.
  *   **Taurekian Prediction:** Since a fair lottery is impossible, the constraint of fairness cannot be satisfied. Therefore, either option is permissible. The rescuer may follow their inclination.
  *   **Cost of View:** The Taurekian concedes that this leaves the rescuer with no moral guidance other than 'choose arbitrarily'. The Aggregator argues this is a fatal cost: morality must guide action even when perfect fairness is unavailable. The Taurekian counters that guidance is not required when rights are symmetrical and procedure is blocked.
  *   **Commitment Note:** The Taurekian here commits to the view that moral permissibility can be entirely unconstrained by outcome when procedural justice is frustrated. The Aggregator commits to the view that outcome obligations persist regardless of procedural constraints.

  **Sub-Question 3: Do downstream consequences generate immediate claims?**
  *Case: The Downstream Single.*
  The rescuer can save five strangers or one stranger who, if saved, will certainly save three further people (total 4 lives vs 5 lives).
  *   **Aggregator Prediction:** The rescuer ought to save the five. The three downstream lives count towards the total outcome. 5 > 4. The agency of the saved person does not alter the value of the lives saved.
  *   **Taurekian Prediction:** The rescuer is permitted to save the One (and thus the three downstream). The three downstream people are not *victims* in the rescue scenario; they have no present claim on the rescuer. Their survival depends on the One's agency, not the rescuer's direct action.
  *   **Genuine Difference:** The Aggregator treats lives as units of value wherever they occur. The Taurekian treats lives as sources of *claims* held by specific individuals against the rescuer. The Taurekian refuses to apply the 'numbers' consideration to the downstream three because they are not 'at stake' in the initial choice.
  *   **Commitment Note:** The Taurekian here commits to a view that may seem paradoxical: permitting a choice that results in fewer total lives saved (1+3 vs 5) based on the *source* of the claim. The Aggregator must explain why the One's agency doesn't make the downstream three 'present' victims.

  ***

  **Concluding Reflections**

  **The Aggregator:** For the Taurekian to be right, it would have to be true that moral reasons are essentially relational bonds between a rescuer and a specific victim, incapable of being weighed against bonds formed with others. I concede that the Taurekian has established that 'maximising lives' cannot be the *only* value; the demand for procedural fairness (the lottery) highlights a respect for persons that pure aggregation can overlook.

  **The Taurekian:** For the Aggregator to be right, it would have to be true that there exists an impersonal standpoint from which losses can be summed without doing violence to the separateness of persons. I concede that the Aggregator has established that ignoring the numbers entirely can lead to counter-intuitive permissions in large-scale cases, and that the 'equal chance' requirement is difficult to operationalise when lotteries are denied.
