          *   *Contrast with AMD:* In AMD, choosing Continue at *this* intersection means you Choose Continue at *that* intersection (same algorithm). In Twin, Choosing Continue doesn't force the other twin.
          *   *Is this consistent?* Yes, if the principle is "Correlation only counts if it's the same decision algorithm/agent." (FDT vs CDT boundary).

      *   *Verdict 6 (Contract):* Conflicted.
          *   *Analysis:* This is Ulysses binding. If the at-the-wheel self is time-inconsistent (tempted to Exit at Y for 4, risking X), the planning self binds them.
          *   *User's conflict:* "Rational agent shouldn't have to pay money to get itself to do what it already wanted."
          *   *Resolution:* The Planning Self wants $p=1/3$. The At-Wheel Self (under CDT) might want to Exit at Y. The contract aligns At-Wheel to Planning. The fee is the cost of overcoming self-control failure. It is rational to pay if the gain (avoiding the 0 payoff at X) exceeds the fee.

