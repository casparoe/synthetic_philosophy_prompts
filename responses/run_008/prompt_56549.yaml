prompt: |-
  I sit on the clinical ethics committee of a large psychiatric hospital, and I need a written opinion circulated before Thursday's meeting. The case: a patient with a fifteen-year history of psychotic episodes has, during a period of documented competence, signed a psychiatric advance directive — the kind the literature calls a Ulysses contract — that names a specific antipsychotic and instructs staff that if she refuses medication during a relapse, they are to administer it over her objection, using restraint if necessary; it further specifies that any refusal she voices while floridly psychotic is to be treated as a symptom rather than as a wish. She is now in exactly that state: actively refusing, and in her brief lucid intervals sometimes telling staff the directive was a mistake, though it is unclear how stable her judgment is within those intervals. The committee is split. One faction holds that honoring the directive simply respects her autonomous self against the transient self the illness produces, and that refusing to honor it renders her competence during wellness meaningless. The other holds that forcibly treating a protesting patient on the strength of a document she can no longer revise is exactly what we would reject in any other context: we do not normally let the past bind the present where the bound party has no ongoing right of revision. What our current drafts lack is any serious engagement with the structural analogy the second faction is implicitly invoking — constitutional precommitment. Defenders of entrenched constitutions face a version of the same problem: why may the living be bound by commitments made by people who can no longer be asked? I want the memo to address that analogy head-on: say what the individual and constitutional cases genuinely share, where they come apart (consider, for instance, that a constitution can be amended by the very people it binds, whereas the whole point of this directive is that its author cannot amend it when it matters — but consider also whether that difference favors one side or cuts both ways), and state which side of the analogy the disanalogy favors in this case. Beyond the analogy, the memo should give a concrete recommendation with any conditions attached, reasons the losing faction could actually engage with rather than a restatement of autonomy doctrine, and a fair treatment of the strongest point against your recommendation. Finally, close with a section on what would change the recommendation: identify the one or two facts about this case, or features of our general policy on such directives, that, if they had turned out differently, would point the other way, and say candidly where the memo's reasoning is most likely to fail. Please keep it to something the committee can read in ten minutes.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Member of a Clinical Ethics Committee (CEC) at a large psychiatric hospital.
      *   **Task:** Write a written opinion (memo) for circulation before Thursday's meeting.
      *   **Case:** Patient with 15-year history of psychosis. Signed a Ulysses contract (psychiatric advance directive) during competence. Directive specifies specific antipsychotic, authorizes administration over objection (including restraint) during relapse, and instructs staff to treat refusal during psychosis as a symptom.
      *   **Current State:** Patient is relapsing, actively refusing. In lucid intervals, she sometimes says the directive was a mistake, but judgment stability is unclear.
      *   **Committee Split:**
          *   *Faction A (Pro-Directive):* Respects autonomous self vs. transient ill self. Honors past competence.
          *   *Faction B (Anti-Directive):* Forcible treatment based on past document when revision is impossible is unacceptable. Analogous to binding the living to the dead/past without recourse.
      *   **Specific Requirement:** Address the *constitutional precommitment analogy* head-on. Compare individual Ulysses contracts to entrenched constitutions. Analyze similarities, differences (amendability), and which side the disanalogy favors.
      *   **Other Requirements:**
          *   Concrete recommendation with conditions.
          *   Reasons the losing faction can engage with (not just "autonomy").
          *   Fair treatment of the strongest counter-argument.
          *   Closing section: What facts/policies would change the recommendation? Where is the reasoning most likely to fail?
          *   **Length:** Readable in 10 minutes (approx. 1,000 - 1,500 words).

  2.  **Deconstruct the Constitutional Analogy:**
      *   *Similarity:* Both involve "precommitment strategies" (Jon Elster/Ulysses). The goal is to bind future action to prevent irrational or harmful deviations (tyranny of the majority in constitutions; tyranny of psychosis in directives). Both prioritize long-term values over short-term impulses.
      *   *Difference (Amendability):* Constitutions *can* be amended by the living (though difficult). Ulysses contracts in psychosis *cannot* be amended when it matters (because the competence required to amend is absent during the relapse).
      *   *Evaluation of Difference:* Does the inability to amend favor Faction A or B?
          *   *Faction B view:* It makes the directive tyrannical. The "sovereign" (patient) is disenfranchised when it counts.
          *   *Faction A view:* The inability to amend is the *feature*, not the bug. If she could amend it during psychosis, the contract is useless.
          *   *Nuance:* In constitutional theory, "entrenchment" is justified only if the amendment process remains accessible *in principle* or if the precommitment protects the very conditions of future autonomy. If the constitution becomes a prison with no key, legitimacy fades. However, in the medical case, the "key" (competence) is temporarily lost due to pathology, not political structure.
      *   *Decision:* The disanalogy cuts *both* ways but ultimately favors honoring the directive *if* strict safeguards are met. Why? Because the constitutional goal is to preserve the democratic process itself. Here, the goal is to preserve the *biological/psychological conditions* for future autonomy. However, the lack of an amendment mechanism during relapse requires a "judicial review" equivalent (the Ethics Committee/Second Opinion) to ensure the "constitution" hasn't become obsolete due to changed values, not just symptoms.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format.
      *   **Introduction:** State the purpose, the case summary, and the core tension (Past Autonomy vs. Present Objection).
      *   **The Constitutional Analogy (The Core Request):**
          *   Acknowledge Faction B's insight: This *is* about precommitment.
          *   Shared Logic: Binding the future self to protect long-term goals against short-term disruption.
          *   The Divergence: Amendment. Constitutions allow amendment by the governed. Ulysses contracts explicitly foreclose this during the crisis.
          *   Resolution of Analogy: In constitutional theory, precommitment is legitimate only if it preserves the capacity for future self-governance. Here, treatment preserves the capacity for future competence. However, the inability to amend requires a proxy for "constitutional review"—hence the need for strict scrutiny of whether the refusal is truly symptomatic or a genuine evolution of values.
      *   **Recommendation:** Honor the directive *but* with specific conditions (Independent psychiatric review, time-limited enforcement, re-evaluation at lucid intervals).
      *   **Engaging the Losing Faction (Faction B):** Don't just say "Autonomy." Acknowledge the risk of "dead hand control." Argue that without the directive, the patient loses the *opportunity* to return to the state where she can have preferences at all. Frame it as protecting the *possibility* of future consent.
      *   **Strongest Counter-Argument:** The "Lucid Interval" problem. If she says "I changed my mind" while lucid, even briefly, does that count as an amendment? This is the weakest link in the reasoning.
      *   **What Would Change the Recommendation:**
          *   Evidence of sustained value change during wellness (not just relapse).
          *   Lack of efficacy of the specific med.
          *   Policy shift requiring periodic renewal of directives.
      *   **Failure Point:** Our ability to distinguish "symptom" from "evolved value" in those lucid intervals.

  4.  **Refining and Polishing (Self-Correction during drafting):**
      *   *Tone:* Professional, analytical, empathetic but firm.
      *   *Length Check:* Keep it tight. Avoid excessive jargon.
      *   *Analogy Check:* Make sure I don't get bogged down in political theory. Keep it tied to the clinical case.
      *   *Constraint Check:* Did I answer the "which side does the disanalogy favor" prompt? Yes, need to be explicit. *Correction:* I need to be careful here. The prompt asks to state which side the disanalogy favors. The inability to amend usually favors the skeptics (Faction B). I should acknowledge this but argue that the *purpose* of the precommitment (restoring competence) overrides the procedural defect, provided there is external oversight. Actually, a more nuanced take is better: The disanalogy favors Faction B *procedurally*, but Faction A *substantively*. I will argue that the disanalogy highlights the need for *oversight*, not necessarily invalidation.
      *   *Wait, re-reading the prompt:* "state which side of the analogy the disanalogy favors in this case." I need to take a stand.
      *   *Decision:* The disanalogy (inability to amend) favors Faction B's concern about tyranny. However, because the *goal* of the medical directive is to restore the capacity to amend (restore competence), whereas a constitution binds the living indefinitely, the medical case is actually *more* defensible than the constitutional one *if* the treatment works. I will argue the disanalogy ultimately favors Faction A *conditionally*, because the binding is temporary and restorative, unlike constitutional entrenchment which is often permanent.
      *   *Wait, let's look closer:* A constitution binds the living (who are competent) to the dead (or past selves). A Ulysses contract binds the incompetent self to the competent self. The "amendment" issue is key. In a constitution, you can amend it. In psychosis, you can't. This makes the Ulysses contract *more* rigid. Does that make it worse? Faction B says yes. Faction A says it's necessary.
      *   *Revised Stance:* The disanalogy favors Faction B's skepticism *unless* we introduce a proxy for amendment (ethical oversight). I will argue that without external review, the disanalogy favors Faction B. With review, it leans back to A. I will recommend honoring it *with* the review condition. This satisfies the prompt's demand to analyze the disanalogy's weight.

  5.  **Final Review against Constraints:**
      *   10-minute read? (approx. 1200-1500 words).
      *   Constitutional analogy addressed head-on? Yes.
      *   Concrete recommendation? Yes.
      *   Reasons for losing faction? Yes.
      *   Strongest counter-argument? Yes.
      *   What would change recommendation? Yes.
      *   Where reasoning fails? Yes.

  6.  **Drafting the Content:** (Mental outline of the text)
      *   To: CEC Members
      *   From: [My Name]
      *   Subject: Case of [Patient Initials] - Ulysses Directive
      *   Intro: The stalemate.
      *   The Constitutional Parallel: Precommitment. Elster.
      *   The Divergence: Amendment.
      *   Weighing the Disanalogy: It favors B *unless* we treat the committee as the amendment mechanism.
      *   Recommendation: Honor, but with "Judicial Review" safeguards.
      *   Argument for B: Avoid "dead hand" control. Focus on current suffering.
      *   Strongest Counter: The Lucid Interval.
      *   Changers: Efficacy, Value Drift.
      *   Failure Point: Epistemic uncertainty.

  7.  **Final Polish:** Check tone. Ensure it sounds like an ethics committee memo, not a philosophy paper. (Proceed to generate output).

  *(Self-Correction during final output generation)*: Ensure I explicitly state which side the disanalogy favors. I will argue it favors the skeptics (Faction B) regarding *procedure*, which necessitates the safeguards I propose. This validates their concern while allowing the directive to stand.

