answer: |-
  **MEMORANDUM**

  **TO:** Clinical Ethics Committee
  **FROM:** [Your Name/Role]
  **DATE:** [Current Date]
  **SUBJECT:** Ethical Opinion Regarding [Patient Initials] and Psychiatric Advance Directive

  **Introduction**

  We are convened to decide whether to enforce a Ulysses contract (psychiatric advance directive) executed by [Patient Initials] during a period of competence. The directive mandates specific antipsychotic medication during relapse, authorizes restraint if necessary, and instructs staff to treat refusal during psychosis as a symptom. The patient is currently relapsing and refusing treatment. In brief lucid intervals, she has suggested the directive was a mistake, though her judgment in these windows is unstable.

  The committee is divided between respecting past autonomy (Faction A) and protecting the present objecting self from irreversible binding (Faction B). This memo argues that we should honor the directive, but only under strict conditions that address the legitimate structural concerns raised by Faction B. To do this, we must engage directly with the analogy Faction B invokes: constitutional precommitment.

  **The Constitutional Analogy: Precommitment and Entrenchment**

  Faction B's objection is not merely clinical; it is structural. They argue that allowing a past competent self to bind a present incapacitated self without recourse mirrors the problem of entrenched constitutions binding the living to the dead.

  *Where the Analogy Holds:*
  Both the Ulysses contract and a constitution are "precommitment strategies." As Jon Elster noted, Ulysses bound himself to the mast to resist the Sirens; similarly, a polity binds itself to a constitution to resist transient passions or tyranny. In both cases, the goal is to prioritize long-term values over short-term impulses. In the patient's case, the "transient passion" is the psychotic delusion; in the constitutional case, it is the tyranny of the majority. Both mechanisms rely on the premise that the "self" at Time A (competent/framers) has a superior claim to define the good than the "self" at Time B (psychotic/current majority).

  *Where the Analogy Breaks:*
  The critical divergence lies in amendability. A constitution, however entrenched, retains a mechanism for amendment by the governed. The living can revise the charter. In this Ulysses contract, the amendment mechanism is explicitly disabled during the very crisis the directive anticipates. The patient cannot revise the directive when she lacks competence, and the directive defines her current state as lacking competence. She is bound by a law she cannot currently repeal.

  *Which Side Does the Disanalogy Favor?*
  On its face, this disanalogy favors Faction B. In constitutional theory, a charter that cannot be amended loses legitimacy because it treats citizens as subjects. If we apply this strictly, the patient's current objection should veto the past directive because she lacks the "legislative" power to change it.

  However, this disanalogy cuts both ways. A constitution binds the living indefinitely. A psychiatric directive binds the patient only *until* treatment restores competence. The goal of the medical precommitment is to restore the very capacity (competence) required to amend the "constitution." Therefore, the binding is temporary and restorative, whereas constitutional entrenchment is often permanent.

  Consequently, the disanalogy favors Faction A *only if* we introduce a proxy for the amendment process. Since the patient cannot amend the directive during relapse, the Ethics Committee and treating team must act as the "constitutional court." We must verify that the refusal is truly symptomatic and not a genuine evolution of values. Without this oversight, the disanalogy favors Faction B: binding a person without recourse is tyranny, even if self-imposed.

  **Recommendation**

  The Committee should recommend **honoring the directive**, subject to the following conditions:

  1.  **Independent Review:** The specific medication and use of restraint must be reviewed by a psychiatrist not involved in the current treatment team to confirm efficacy and necessity.
  2.  **Lucid Interval Protocol:** Any statement made during a lucid interval challenging the directive must trigger an immediate pause in enforcement (barring imminent danger) to assess stability. If the patient consistently rejects the directive across 48 hours of lucidity, the directive is considered revoked.
  3.  **Time-Limit:** Enforcement of the directive is authorized for a maximum of 14 days, after which the Committee must reconvene.

  **Engaging the Losing Faction**

  To my colleagues in Faction B: I acknowledge that enforcing this directive risks "dead hand control." You argue that a person is more than their past signatures. My recommendation does not rest on the idea that the past self is *always* right. It rests on the claim that **without this enforcement, the patient loses the capacity to have a "self" at all.**

  If we prioritize the present objection unconditionally, we accept a trajectory of deterioration that eliminates the possibility of future autonomy. By honoring the directive, we are not silencing the patient; we are buying time for the patient to return. We are treating the directive not as a command from the grave, but as a bridge back to the shore where revision is possible. The conditions above ensure that if the "bridge" is no longer where she wants to go (i.e., if her values have genuinely shifted during wellness), we do not force her across it.

  **The Strongest Counter-Argument**

  The strongest argument against this recommendation is the **epistemic uncertainty of the "lucid interval."**

  The directive instructs us to treat refusal during psychosis as a symptom. But the patient is occasionally lucid. If she says "I changed my mind" during a lucid window, is that a symptom of residual illness or a genuine revision of values? There is no clean clinical test to distinguish a "true" value change from a "delusional" one in real-time. If we err on the side of enforcement, we risk violating the autonomy of a person who has genuinely evolved. If we err on the side of revocation, we risk capitulating to the illness. My recommendation leans toward enforcement, which means we risk overriding a genuine change of mind. This is a moral hazard we cannot fully eliminate, only mitigate through the "Lucid Interval Protocol" listed above.

  **What Would Change the Recommendation**

  Two factors would compel me to switch to Faction B's position:

  1.  **Evidence of Value Drift During Wellness:** If there were documentation that, *during a period of sustained wellness prior to this relapse*, the patient expressed regret over the directive or sought to revoke it but was blocked by procedural hurdles, the directive loses its moral weight. It would suggest the "constitution" no longer reflects the sovereign's will.
  2.  **Lack of Efficacy:** If the specific antipsychotic named in the directive has failed to restore competence in previous relapses, enforcing it becomes punitive rather than restorative. The justification for binding the present self is the restoration of the future self; if that restoration is medically unlikely, the binding becomes purely paternalistic.

  **Where This Reasoning May Fail**

  This memo's reasoning is most likely to fail on the **definition of competence.** We are assuming a binary: Competent (directive valid) vs. Incompetent (directive enforced). In reality, competence is a spectrum. If the "lucid intervals" are more robust than we assess, our enforcement of the directive becomes an act of coercion against a partially competent agent. We risk treating a person who is *struggling* to decide as a person *unable* to decide. If our assessment tools for lucidity are insufficiently sensitive, the "Constitutional Court" role we assign ourselves becomes a rubber stamp, and the disanalogy favors Faction B: we will have bound the living to the past without a genuine mechanism for review.

  **Conclusion**

  We should honor the directive, but not because the past self owns the future self. We should honor it because it is the best available tool to restore the patient's ownership of her future. We must, however, act as the guardians of the amendment process she cannot currently access.

  cc: Hospital Administration, Legal Counsel
