answer: |-
  You have put your finger on the exact nerve that most popular discussions of Wigner's essay miss. Wigner marveled at the *presence* of mathematics in physics; you are asking about the *absence* (or dilution) of it elsewhere.

  To answer your first question directly: **No, there is no single, canonical term in the philosophy of science for this specific asymmetry.**

  It is usually discussed obliquely under the headers of **Reductionism**, the **Unity of Science**, or the distinction between **Fundamental vs. Special Sciences** (a term coined by Jerry Fodor). However, none of these capture the *phenomenological* difference you noticed: the "miraculous fit" versus the "curve-fitting grind."

  Since you asked me to coin a term if one doesn't exist, I propose we call this **The Contingency Asymmetry**.

  Here is the breakdown of why this asymmetry exists, where the edge cases lie, and why Chemistry is the fascinating boundary layer.

  ### 1. Why the Asymmetry? (Symmetry vs. History)

  The reason math works "unreasonably well" in physics is not just that the universe is mathematical, but that physics deals with **fundamental symmetries**.

  *   **Physics (The Physics Side):** An electron in a vacuum here is identical to an electron in a vacuum a billion light-years away, and a billion years ago. The system is ahistorical. It has no memory. Because the objects are invariant under translation in space and time, the mathematics of groups, symmetries, and variational principles (which are themselves about invariance) map onto them perfectly. The math was invented to describe structure, and fundamental matter *is* structure.
  *   **Ecology/Economics (The Economics Side):** These systems are **path-dependent**. An ecosystem is the result of specific evolutionary accidents; a market is the result of specific regulatory and cultural histories. A wolf is not an electron; it has a lineage. An investor is not a boson; they learn. Because these systems are products of *history* rather than *necessity*, there is no a priori reason for a pre-existing abstract structure (like a Hilbert space) to describe them. You have to build the math *around* the data, rather than finding the data inside the math.

  So, the "Contingency Asymmetry" is the measure of how much a system's behavior is determined by **necessary laws** (Physics) versus **accidental history** (Economics).

  ### 2. The Edge Case: Chemistry

  You asked where chemistry falls. This is the most debated boundary in the hierarchy of sciences.

  **The Verdict: Chemistry is the Boundary Layer.**

  It sits squarely on the "Physics Side" regarding *principles*, but often slips to the "Economics Side" regarding *prediction*.

  *   **Why it's Physics:** Quantum Chemistry (DFT, ab initio methods) is essentially solved. If you have enough compute power, you can derive the spectrum of a small molecule from the Schrödinger equation to high precision. No "patching" is required. The math works unprompted. In this regime, chemistry is just slow physics.
  *   **Why it's Economics:** As soon as you move to complex organic synthesis or materials science, the "many-body problem" explodes. We cannot calculate the yield of a complex retrosynthesis pathway from first principles. Chemists rely on heuristics, functional groups, and "rules of thumb" that are effectively local models patched with case-specific corrections. A synthetic chemist in a lab often feels more like an ecologist than a particle physicist: "This reaction works in this solvent with this catalyst, but if you change the temperature by 5 degrees, the model breaks."

  **Placement:** On the Contingency Asymmetry scale, Chemistry is the transition zone. It is the proof that the asymmetry is not about the *subject matter* per se, but about the **complexity and isolation** of the system.

  ### 3. Recommended Reading for the "Asymmetry"

  Since there is no single book on "The Contingency Asymmetry," you have to triangulate it from three specific works that address the halves of the problem:

  1.  **"More is Different" (1972) by P.W. Anderson:**
      *   *Why:* This is the physicist's manifesto for why the "Economics Side" exists. Anderson argues that even if you accept reductionism (everything is physics), **emergence** makes the higher-level sciences autonomous. The math of particle physics cannot efficiently describe a superconductor, let alone a stock market. This explains why the "miraculous math" doesn't propagate up the chain.
  2.  **"The Special Sciences" (1974) by Jerry Fodor:**
      *   *Why:* A philosophical classic arguing that laws in biology/psychology/economics are "ceteris paribus" (all else being equal) laws, whereas physics aims for strict universal laws. This formalizes the "local model" feeling you dislike in economics.
  3.  **"How the Laws of Physics Lie" (1983) by Nancy Cartwright:**
      *   *Why:* A provocative take. She argues that even in physics, our fundamental laws only hold in highly controlled "nomological machines" (like a vacuum chamber). She suggests physics *looks* more effective because we are better at building those cages. This might nuance your view: perhaps the asymmetry is partly experimental, not just ontological.

  ### 4. Summary of the Coinage

  If you use the term **The Contingency Asymmetry**, you can define it as:

  > *The observed gradient in the predictive power of a priori mathematics across scientific disciplines, correlating inversely with the historical contingency and complexity of the system under study.*

  *   **Low Contingency (Physics):** Math precedes data. (e.g., Dirac equation predicting the positron).
  *   **High Contingency (Economics/Ecology):** Data precedes math. (e.g., Black-Scholes requiring volatility smiles to patch the model).
  *   **The Boundary (Chemistry):** Principles are low contingency; application is high contingency.

  It is a pleasure to discuss this with someone who sees the distinction. Too often, the "Unreasonable Effectiveness" is treated as a blanket statement about Science™, when it is actually a specific property of Fundamental Physics that fails to commute to the rest of the natural world. Enjoy your reading; Anderson's essay is short and will likely resonate deeply with your career experience.
