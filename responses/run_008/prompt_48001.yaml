prompt: |-
  Me and my friend finally called it quits at like 1am after arguing for hours about what a species even is, and it basically came down to him saying my gut verdicts are all over the place and me saying they're fine actually. So here's my list of verdicts, and I want to know if there's one principle that captures them, or whether I have to drop some.

  The verdicts: Great danes and chihuahuas are the same species, obviously, even though unaided they mostly can't mate. Lions and tigers are different species, even though they can interbreed in captivity and the female hybrids are sometimes fertile — I don't think the liger counts. Wolves and coyotes I want to say are different species, even though they interbreed a fair bit in the wild where they overlap. Two populations of the same kind of bird where the males sing a slightly different song and the females have stopped responding, even though they could physically interbreed — different species, I say. The salamanders that ring round the Central Valley in California: I say neighbouring populations along the ring are the same species, but where the two ends meet up and don't interbreed, I say the ends are different species. My friend thinks that last one is me having it both ways round the same ring. Bdelloid rotifers, which haven't had sex in millions of years, all-female clone lines: I'm fine calling those species, even though the interbreeding criterion literally never applies to them. And Neanderthals and us: I lean same species since we demonstrably interbred and most people carry a bit of their DNA, but my friend says if I say that, and also say lions and tigers are different species, I'm just picking whichever criterion suits the case.

  My tentative principle was going to be: same species iff the two populations would interbreed freely in the wild and produce fertile offspring. But I can already see it doesn't cover the rotifers, and it seems to give the same answer for lions+tigers and danes+chihuahuas only if I get to decide what counts as 'freely', which feels like cheating.

  So: is there a principle (or a couple of candidate principles) that gets all or nearly all of my verdicts, stated precisely enough that I can apply it to a new case? Which clause does the work for each verdict, and be honest about which of my verdicts it just can't accommodate — especially whether I have to give up either the 'same species all the way round the ring' claim or the 'different species at the ends' one. And then tell me what the principle you land on predicts for a case I haven't listed: polar bears and brown bears, which do interbreed in the wild where their ranges now overlap.

  Also could you write the answer in British English please (neighbouring, colour, that sort of thing), since I keep getting corrected on it. Ta.
