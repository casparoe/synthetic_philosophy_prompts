  9.  **Final Polish:** Ensure tone is analytical and philosophical, matching the user's prompt. (Proceed to generate output).

  *(Post-computation check)*: The prompt asks for "reasons, not a survey." I must ensure every claim about the disagreement is backed by an analysis of *why* they disagree, not just *that* they disagree. The distinction between "constraints" and "trajectories" is a good candidate for the "progress" section.

