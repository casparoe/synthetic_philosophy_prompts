answer: |-
  **FINAL EXAMINATION: DECISION THEORY AND RATIONAL CHOICE**
  **Time Allowed:** 60 Minutes
  **Total Marks:** 25 (Plus 5 Bonus)

  **QUESTION 1: THE ST. PETERSBURG STRUCTURE**

  Consider a game $G$ played with a fair coin. The coin is tossed until it lands Heads for the first time. Let $n$ be the toss number on which Heads first appears ($n \in \{1, 2, 3, \dots\}$). The probability of outcome $n$ is $1/2^n$. In the standard version of $G$, the monetary payoff for outcome $n$ is $\$2^n$.

  **(a) The Truncation Crux (7 Marks)**
  Suppose a casino announces it will cap the payoff at $\$2^k$ for some fixed integer $k$ (i.e., if $n > k$, the payoff remains $\$2^k$). Calculate the expected value of this truncated game $G_k$. Explain why solving the valuation for $G_k$ fails to resolve the paradox for the original game $G$. Furthermore, argue why any resolution that imposes an upper bound on utility functions to make the expectation finite is "deflationary" rather than explanatory.

  **(b) The Revenge Crux (8 Marks)**
  Assume there exists a decision rule $R$ that assigns a finite fair price $p$ to the original game $G$. Construct a specific "cousin" game $G'$ by modifying the payoffs of $G$ such that $G'$ strictly dominates $G$ (i.e., every outcome of $G'$ yields a strictly higher payoff than the corresponding outcome of $G$). Demonstrate that if rule $R$ is applied consistently, it leads to a contradiction or a sure-loss arrangement regarding the price of $G'$. Do not speak abstractly; define the payoff function of $G'$ explicitly.

  **(c) The Fork (7 Marks)**
  You must take a definitive stand on one of the following three positions. Defend your choice and explain its consequences for rational choice theory:
  1.  **The Infinite Acceptance:** The expectation is infinite, and it is rational to pay any finite price to play. You must explain what distinguishes a "good" finite price from a "bad" one if all are rational.
  2.  **The Statistical Rejection:** Expectation is the wrong statistic for this game. You must propose the correct statistic (e.g., relating to repeated play or time averages) and explain why the sample mean behaves pathologically here.
  3.  **The Bounded Utility:** Rational utility must be bounded above. You must argue why this paradox serves as a *reductio ad absurdum* for unbounded utility scales.

  **(d) Bonus: The Alternating Variant (5 Marks)**
  Consider a variant game $G_{alt}$ with the same probabilities ($1/2^n$) but with payoffs defined as $x_n = (-1)^n \cdot \frac{2^n}{n}$. The expected value series is $\sum_{n=1}^{\infty} \frac{1}{2^n} \cdot \left( (-1)^n \frac{2^n}{n} \right)$. Explain the mathematical property of this series that allows its sum to change depending on the order in which terms are added. What does this imply about assigning a single "value" to $G_{alt}$ using standard expectation?

  ***

  **MODEL ANSWER**

  **(a) Truncation**
  In the truncated game $G_k$, the payoff is $2^n$ for $n \leq k$ and $2^k$ for $n > k$. The expected value is $\sum_{n=1}^{k} \frac{1}{2^n}2^n + \sum_{n=k+1}^{\infty} \frac{1}{2^n}2^k = \sum_{n=1}^{k} 1 + 2^k \cdot \frac{1}{2^k} = k + 1$. While $E[G_k]$ is finite, this is a fact about $G_k$, not $G$. Resolving $G$ by substituting $G_k$ changes the ontology of the gamble; it solves a different problem. More critically, resolutions invoking bounded utility (e.g., log utility) are deflationary. They do not explain why the infinite expectation is harmless; they merely deny the premise that utility can grow commensurately with payoff. They render the paradox moot by fiat, asserting that no outcome *could* have sufficient value to generate divergence, rather than explaining how to manage the divergence itself.

  **(b) Revenge**
  Assume rule $R$ prices $G$ at finite $p$. Construct $G'$ such that the payoff for outcome $n$ is $2^n + p + 1$. Every outcome in $G'$ yields strictly more than $G$. By dominance, the price of $G'$ must exceed $p$. However, the expected value of $G'$ is $E[G] + p + 1 = \infty$. If $R$ assigns finite prices to infinite expectation games, it must assign some finite $p'$ to $G'$. But since $G'$ pays $p+1$ more than $G$ in every state, a rational agent should be willing to pay $p + (p+1)$ for $G'$. If $R$ caps the price at some finite limit regardless of the additive shift, it violates dominance. Specifically, if $R$ prices any infinite-expectation game at $p$, it prices $G$ and $G'$ identically, despite $G'$ strictly dominating $G$. This exposes the agent to a sure loss: they would sell $G'$ to buy $G$ at the same price, discarding free money.

  **(c) The Fork**
  I choose **The Statistical Rejection**. Expectation assumes the Law of Large Numbers applies, implying the sample mean converges to the population mean. In $G$, the variance is infinite; the sample mean does not settle. Over $T$ plays, the average payoff grows with $T$ (specifically, logarithmically), so there is no stable long-run average. The correct statistic is the time-average growth rate (ergodicity). A rational agent maximizes the growth rate of their wealth, not the ensemble average. This resolves the paradox without bounding utility: it is irrational to pay a high price because the *time* required to realize the tail events exceeds the agent's horizon, making the "infinite" value inaccessible in reality.

  **(d) Bonus**
  The series simplifies to $\sum_{n=1}^{\infty} \frac{(-1)^n}{n}$, which is the alternating harmonic series. This series is conditionally convergent, not absolutely convergent. By the Riemann Rearrangement Theorem, the terms of a conditionally convergent series can be reordered to sum to any real number, or to diverge. Since the "value" of the game depends on the summation order of the expected utility terms, the game has no well-defined expected value. This implies that for $G_{alt}$, expectation is not merely infinite, but undefined, rendering standard decision rules incoherent.

  ***

  **MARKING SCHEME**

  **Total Marks: 25 (Main) + 5 (Bonus)**

  **Part (a): Truncation (7 Marks)**
  *   **Calculation (2 marks):** Correctly identifies $E[G_k] \approx k$ (or $k+1$).
      *   *Common Error:* Calculating geometric series incorrectly or ignoring the tail probability mass.
  *   **Distinction (3 marks):** Explains that $G_k$ is ontologically distinct from $G$; solving one does not solve the other.
      *   *Common Error:* Treating the cap as a "practical solution" without addressing the theoretical divergence of $G$.
  *   **Deflationary Argument (2 marks):** Articulates that bounding utility denies the premise rather than resolving the conflict (makes value finite by shrinking the scale, not by taming the infinity).
      *   *Common Error:* Praising bounded utility as a "fix" without noting it precludes the possibility of the paradox arising.

  **Part (b): Revenge (8 Marks)**
  *   **Construction (3 marks):** Explicitly defines $G'$ (e.g., payoff $2^n + C$ or $2^{n+1}$).
      *   *Common Error:* Vaguely describing "a better game" without a payoff function.
  *   **Dominance Logic (3 marks):** Shows $G'$ payoff $> G$ payoff for all $n$.
      *   *Common Error:* Asserting dominance without comparing specific outcomes.
  *   **Contradiction (2 marks):** Demonstrates that pricing both at $p$ (or finite prices) violates dominance or creates a sure-loss (money pump).
      *   *Common Error:* Stating "it breaks the rule" without showing the pricing inconsistency.

  **Part (c): The Fork (7 Marks)**
  *   **Selection (1 mark):** Clearly chooses (1), (2), or (3).
  *   **Justification (4 marks):** Provides a coherent argument consistent with the chosen horn.
      *   *Common Error:* Picking (1) but failing to distinguish prices; picking (2) but citing standard LLN incorrectly; picking (3) but treating it as empirical rather than axiomatic.
  *   **Consequences (2 marks):** Explains the implication for rational choice (e.g., ergodicity, axiomatic bounds).
      *   *Common Error:* Restating the position without explaining the theoretical cost.

  **Part (d): Bonus (5 Marks)**
  *   **Series Identification (2 marks):** Identifies conditional convergence / alternating harmonic series.
      *   *Common Error:* Claiming the series diverges or converges absolutely.
  *   **Rearrangement Implication (3 marks):** Explains that summation order changes the value, making expectation undefined.
      *   *Common Error:* Knowing the theorem but failing to apply it to the "value of the game."

  **A vs. B Distinction**
  *   **B Grade:** Correctly calculates the truncation and states diminishing marginal utility. Constructs a dominating game but fails to explicitly show the pricing contradiction. Picks a Fork position but offers a standard textbook defense without engaging the "consequences" requirement.
  *   **A Grade:** Explicitly frames truncation as changing the subject (ontology). The Revenge construction includes the arithmetic of the sure-loss. The Fork answer acknowledges the cost of the chosen position (e.g., rejecting unbounded utility limits rational ambition). Bonus connects rearrangement to decision incoherence.
