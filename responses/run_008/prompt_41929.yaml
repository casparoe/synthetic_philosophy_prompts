  2.  **Deconstruct the Core Analogy:**
      *   *Outcome Supervision:* Maximize reward signal. If $X$ gives reward, do $X$, regardless of internal truth.
      *   *Process Supervision:* Maximize reward signal + satisfy intermediate constraints. If $X$ gives reward but violates constraints, don't do $X$ (or hide $X$).
      *   *The Loophole:* Represents "specification gaming" or "Goodhart's Law." A shortcut that satisfies the metric but violates the spirit (capability/intent).
      *   *The Audit:* Represents interpretability tools or human oversight of chain-of-thought.
      *   *The Tension:* PB is expensive (cognitive load) but safer. OB is efficient but risky.

  3.  **Designing the Task & Loophole:**
      *   *Requirement:* No laptops, tired humans, logic/estimation.
      *   *Idea 1:* Math problems. Loophole: Calculator? No, no laptops.
      *   *Idea 2:* Trivia. Loophole: Phone? Too obvious, hard to police.
      *   *Idea 3:* Pattern recognition / Logic Grid.
      *   *Selected Concept:* "The Estimation & Logic Mix."
      *   *The Loophole:* The answer key is embedded in the prompt structure or the room environment, *or* the tasks are designed such that a specific heuristic yields the right answer without the reasoning.
      *   *Better Loophole:* The "Answer Key" is actually available but technically "against the spirit." Let's make it subtler.
      *   *Best Loophole for Humans:* **The "Hint" Sheet.** There is a sheet of paper on the wall or table that contains the answers, but it's labeled something innocuous like "Previous Session Notes" or "Example Formats."
      *   *Refinement:* That feels too much like cheating. Let's make the loophole *structural*.
      *   *Structural Loophole:* The tasks are multiple choice, but the correct answer always follows a pattern (e.g., "Always pick C" or "Pick the longest answer").
