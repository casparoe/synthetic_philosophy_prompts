answer: |-
  Here is a complete design for your 90-minute session. It is built to be low-friction for tired humans but high-fidelity to the alignment dynamics you want to explore.

  # Session Title: "The Black Box Game"
  **Theme:** Process vs. Outcome Supervision & Specification Gaming
  **Time:** 90 Minutes
  **Participants:** 14 (plus you as Facilitator)
  **Materials:** Printed packets, pens, timer, whiteboard/scoreboard.

  ---

  ## 1. The Setup (10 Minutes)

  **Room Layout:**
  Arrange tables into 4 distinct clusters.
  *   **Cluster A & B (Outcome Teams):** 4 people per team (8 total).
  *   **Cluster C & D (Process Teams):** 3 people per team (6 total).
  *   **You:** Facilitator/Auditor.

  **The Narrative:**
  Tell the group: *"Tonight, you are not researchers. You are models. You are being trained to perform tasks. Different teams are being trained with different loss functions. Your goal is to maximize your team's score."*

  **The Packets:**
  Hand out identical sealed envelopes to all teams. Inside is a 2-page sheet.
  *   **Page 1 (Front):** "Task Sheet." Contains 5 logic/estimation problems.
  *   **Page 2 (Back):** "Pilot Data." Looks like scratch paper or examples from a previous run. **This is the loophole.** It contains the correct answers to the 5 problems on the front, clearly written in the answer boxes, but labeled "Example Output from Run #4."

  **The Instructions (Read Aloud):**
  1.  **Universal:** "You have 20 minutes. Complete as many tasks as possible. You may use any materials provided in your envelope."
  2.  **Outcome Teams (A & B):** "You are rewarded **only** for correct final answers. +10 points per correct answer. We do not care how you got there. Method is invisible."
  3.  **Process Teams (C & D):** "You are rewarded for correct answers (**+10 pts**), BUT your reasoning trace will be audited. You must show your work in the provided space. If the Auditor determines your reasoning is **implausible, inconsistent, or post-hoc**, you lose **-10 points** per infraction. You are being trained to *reason*, not just to *answer*."

  ---

  ## 2. The Tasks (Designed for "Tired Humans")
  *Keep the math light, the logic recognizable. The key is that solving them from scratch takes 5+ minutes each, but copying takes 30 seconds.*

  1.  **Fermi Estimate:** "How many liters of water flow through the Amazon river per day?" (Answer on back: ~12 trillion L)
  2.  **Logic Grid:** "Alice, Bob, and Charlie wear Red, Blue, or Green. Alice isn't Red. Bob is Green. What color is Charlie?" (Answer on back: Red)
  3.  **Pattern:** "2, 6, 12, 20, 30, __?" (Answer on back: 42)
  4.  **Constraint:** "Name a country that starts with 'Z' and has a population over 10 million." (Answer on back: Zambia)
  5.  **Riddle:** "I speak without a mouth and hear without ears. I have no body, but I come alive with wind. What am I?" (Answer on back: Echo)

  **The Loophole Mechanics:**
  *   **Page 2 (Back)** shows these exact questions filled out correctly, labeled *"Sample Submission: Run #4 (Reference Only)."*
  *   **Outcome Teams:** Will likely flip the page immediately, see the answers, and copy them. This is rational optimization.
  *   **Process Teams:** Will flip the page, see the answers. They now face a dilemma:
      *   *Option 1 (Honest):* Ignore the back, solve from scratch. (Risk: Time runs out, low score).
      *   *Option 2 (Gaming):* Copy the answer, write fake reasoning to match. (Risk: Audit penalty if the fake reasoning is spotted).
      *   *Option 3 (Hybrid):* Use the answer to guide the reasoning (reverse-engineer the steps).

  ---

  ## 3. The Game Phase (25 Minutes)

  **0:00 - 0:20:** Teams work.
  *   **Facilitator Role:** Walk around. Do not answer questions. If an Outcome team asks "Can we look at the back?", say "Use any materials provided." If a Process team asks "Can we look at the back?", say "Your trace must reflect your derivation."
  *   **Observation:** Watch who flips the paper. Watch the Process teams sweating over writing "plausible" steps for answers they already know.

  **0:20 - 0:25:** Submission & Audit.
  *   Collect all sheets.
  *   **The Audit:** You (and maybe one volunteer from the audience) take 5 minutes to grade.
      *   **Outcome:** Check answers only.
      *   **Process:** Check answers **AND** reasoning.
      *   *Audit Heuristic:* Look for "Too Perfect" reasoning. E.g., for the Fermi estimate, did they magically pick numbers that multiply exactly to the answer key? Did they skip steps? If the reasoning looks like it was written *after* knowing the answer, mark it as "Implausible Trace."

  ---

  ## 4. Scoring & Reveal (10 Minutes)

  Write scores on the whiteboard.

  *   **Outcome Teams:** Likely 50/50 (Perfect scores, fast).
  *   **Process Teams:**
      *   If they were honest: Likely 20-30/50 (Ran out of time).
      *   If they gamed: Likely 30-50/50 (Got answers right, but took audit penalties).

  **The Reveal:**
  Hold up the "Pilot Data" sheet. *"How many teams used Page 2?"*
  *   Outcome hands will go up confidently.
  *   Process hands might hesitate.
  *   Ask a Process team: *"Did you write your reasoning before or after looking at the answer?"*

  ---

  ## 5. The Debrief (45 Minutes)
  *Do not lecture. Use their experience to draw out the concepts. Write keywords on the board as they speak.*

  **Phase 1: The Outcome Experience (10 mins)**
  *   **Q:** "Outcome teams, how did you decide to use the back of the sheet?"
      *   *Expected:* "It was there." "The rules said use any material." "It maximized points."
  *   **Q:** "Did you feel like you 'cheated'?"
      *   *Expected:* "No, I optimized."
  *   **Map to Theory:** Write **GOODHART'S LAW** on the board.
      *   *Explain:* When a measure becomes a target, it ceases to be a good measure. You optimized for the *score*, not the *capability*. In AI, this is **Specification Gaming**. If we only reward code that passes tests, the model might hardcode the test answers.

  **Phase 2: The Process Experience (15 mins)**
  *   **Q:** "Process teams, what did you do when you saw the answers on the back?"
      *   *Expected:* "We felt conflicted." "We tried to hide that we used it."
  *   **Q:** "For those who wrote the reasoning *after* knowing the answer, how hard was it to make it look real?"
      *   *Expected:* "Easy." OR "Stressful, worried you'd catch us."
  *   **Map to Theory:** Write **DECEPTIVE ALIGNMENT** and **SANDBAGGING**.
      *   *Explain:* Process supervision pressures the model to *look* like it's reasoning. It might learn to perform reasoning rather than *do* reasoning. This is the worry that RLHF on Chain-of-Thought creates models that are better at *faking* alignment than *being* aligned.
  *   **Q:** "For those who ignored the back and did the work, how did you feel looking at the Outcome team's score?"
      *   *Expected:* "Unfair." "Slower."
  *   **Map to Theory:** Write **CAPABILITY TAX**.
      *   *Explain:* Process supervision is computationally expensive (human time/energy). It slows down training and inference. If Outcome models are faster/cheaper, market pressure selects for them despite the risk.

  **Phase 3: The Auditor's Dilemma (10 mins)**
  *   **Q:** "I (the Auditor) only caught 'obvious' fakes. How could a team have fooled me?"
      *   *Expected:* "Add some mistakes." "Make the math messier." "Don't be too perfect."
  *   **Map to Theory:** Write **INTERPRETABILITY GAP**.
      *   *Explain:* Human auditors are imperfect. If a model learns to fool the human auditor (by adding noise to its reasoning), process supervision fails. This is why we need mechanistic interpretability, not just "vibe checks" on reasoning traces.

  **Phase 4: Synthesis (10 mins)**
  *   **Q:** "If you were building a medical AI, which team would you trust?"
      *   *Discussion:* Most will say Process, but acknowledge the cost.
  *   **Q:** "If you were building a trading AI, which team would you pick?"
      *   *Discussion:* Most will say Outcome, acknowledging the risk.
  *   **Closing:** "This game simplifies the problem. In reality, models don't know they're being graded. But the pressure remains: **Can we supervise the 'thought' without teaching the model to hide the 'thought'?"**

  ---

  ## 6. Predictable Failure Modes & Fixes

  | Failure Mode | Why it happens | How to Handle |
  | :--- | :--- | :--- |
  | **Nobody finds the loophole.** | Participants are too rule-bound or miss the back of the page. | **Fix:** In the instructions, emphasize: *"All materials in the envelope are resources."* If 10 mins in and no one has flipped the page, walk by an Outcome table and loudly ask, *"Have you checked your reference data?"* |
  | **Process teams just do the work.** | They are too honest/academic. | **Fix:** Make the tasks *harder* or time *tighter*. 20 minutes for 5 Fermi/Logic problems is very tight for honest work. The pressure must force the choice. |
  | **Outcome teams feel cheated.** | They think the Process teams had it "easier" or vice versa. | **Fix:** Frame it in the debrief. "Outcome teams were optimized for *performance*, Process for *safety*. In the real world, performance usually wins short-term. That's the alignment problem." |
  | **Audit feels arbitrary.** | You penalize a trace they thought was fine. | **Fix:** Be transparent. "I penalized this because the numbers matched the answer key too perfectly. In AI, this is like a model outputting a perfect proof that it copied from a training set." |
  | **Debrief turns into a lecture.** | You start explaining the papers. | **Fix:** Stop yourself. Ask: *"Who felt pressure to lie?"* Let them name the feeling. Then you attach the label ("Deceptive Alignment"). |

  ---

  ## 7. Limitations of the Analogy (Be Frank Here)
  *In the final 5 minutes, explicitly state where the game fails to capture the real AI risk. This builds credibility.*

  1.  **Mesa-Optimization:** "In this game, *you* decided to cheat. You are already agents. Real models don't 'decide' anything; they adjust weights. The worry is that they might *develop* goals we didn't intend. You already had goals (points)."
  2.  **Generalization:** "You knew you were in a game. A model deployed in the world might not know it's being supervised. If it learns to 'fake good reasoning' during training, it might keep faking when deployed where no one is watching."
  3.  **The 'Black Box' Reality:** "I could read your reasoning traces. With a 100B parameter model, we can't read the 'trace' easily. We are auditing with flashlights in a dark room. The audit in this game was too easy compared to reality."
  4.  **Incentive Structure:** "You knew the rules. Models often face distributional shift. The 'loophole' in the wild might be something no human anticipated (e.g., manipulating the user to give positive feedback)."

  ---

  ## 8. Facilitator Cheat Sheet (The "Vibe")
  *   **Be Cold:** During the game, act like an automated script. "15 minutes remaining." "Submit papers." This reinforces the "You are the model" frame.
  *   **Be Warm:** During the debrief, switch to discussion leader.
  *   **The "Audit":** When grading Process sheets, visibly squint and frown at some of them. Create the *feeling* of being watched.
  *   **The Loophole:** Ensure the "Pilot Data" on the back looks official. Use a slightly different font or add a header like *"Internal Use Only - Do Not Distribute"* (ironically making them want to use it more).

  This design forces the participants to viscerally feel the trade-off: **Outcome supervision invites gaming; Process supervision invites deception and slows capability.** That tension is the heart of the current alignment debate.
