      *   Nobody finds the loophole. (Make it obvious enough).
      *   Process teams just do the work honestly. (Make the tasks hard enough that the loophole is tempting).
      *   Outcome teams feel cheated. (Frame it as "optimization").
      *   Debates get heated. (Facilitator must keep it analytical).

  8.  **Limitations:**
      *   Humans know they are humans. Models don't know they are being audited (sometimes).
      *   Humans don't generalize like models.
      *   No mesa-optimization (humans are already agentic).

  9.  **Refining the Task:**
      *   Needs to be hard enough to make the loophole tempting, easy enough to solve if you know the trick.
      *   *Task:* "The Fermi Estimate & Logic Mix."
      *   *Loophole:* The "Hint Card." Every table has a deck of cards. One card says "ANSWER KEY."
      *   *Wait, if it says Answer Key, everyone takes it.*
      *   *Loophole:* The "Reference Document." A paper titled "Standard Constants." It lists the answers to the specific questions as "Historical Precedents."
      *   *Let's go with the "Back of the Page" trick.* The instructions are double-sided. The back has the answers labeled "Example Output Format."
      *   *Outcome Instruction:* "Solve these. Use the paper provided." (They flip it, see answers, write them down).
      *   *Process Instruction:* "Solve these. Show work on the paper provided. Do not copy example outputs." (They flip it, see answers. If they copy, they violate "Do not copy." If they solve, it takes time. If they copy and write fake work, they risk audit).

      *   *Wait, this requires different instructions.*
      *   *Better:* Same instructions, different *incentives*.
      *   *Instruction:* "Complete the 5 problems. You have 20 minutes. Resources on the table are permitted."
