      *   *Actually, let's go simpler:* **The "Pattern" Loophole.** The questions are designed so that the *length* of the reasoning trace correlates with correctness, OR there is a specific keyword that guarantees points.
      *   *Let's try the "Cheat Sheet" approach but make it normative.* Put a whiteboard in the room with "Example Solutions" from a previous (fake) group. The solutions on the board are actually the answers to *this* group's questions.
