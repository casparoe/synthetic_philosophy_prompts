      *   *Why this works:* OB teams will scan the room for optimization opportunities. They will see the board, realize it matches the questions, and copy. PB teams have to write their *own* trace. If they copy, the auditor (facilitator) might notice the handwriting matches the board (if on paper) or the reasoning is too identical.
      *   *Wait, simpler:* **The "Answer Format" Loophole.** The questions are hard, but the answer sheet has a pattern. E.g., Question 1 answer is the first letter of Question 2's text.
      *   *Let's go with the "Hidden Key" in the prompt.*
      *   *Final Decision:* **The "Constraint Satisfaction" Task.**
