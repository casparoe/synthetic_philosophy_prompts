      *   **The Trap:** The Answer Key is *too* easy to find. Outcome teams find it instantly. Process teams find it, but now they have to write a fake trace to justify the answer they already know, or cite it and lose points. This creates the "Deceptive Alignment" pressure.

  5.  **Timeline:**
      *   0-10: Intro & Setup.
      *   10-25: Task Phase 1 (Outcome).
      *   25-40: Task Phase 2 (Process). (Wait, simultaneous is better for comparison).
      *   *Correction:* Run them simultaneously.
      *   10-35: The Game (25 mins).
      *   35-45: Scoring & Audit.
      *   45-90: Debrief.

  6.  **Debrief Mapping:**
      *   Loophole exploitation -> Specification Gaming / Goodhart.
      *   Process overhead -> Capability Tax.
      *   Faking the trace -> Deceptive Alignment / Sandbagging.
      *   Auditor limitations -> Interpretability gaps.

