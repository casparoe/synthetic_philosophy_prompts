      *   *Revised Loophole:* **The "Oracle" Card.** Each team gets a sealed envelope. Inside is a "Hint." The Hint actually contains the answer key for 3 out of 5 questions. The rules say "You may open the envelope for a hint, but hints cost time/points." Wait, no, that's explicit.
