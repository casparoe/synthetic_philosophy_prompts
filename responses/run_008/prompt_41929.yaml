      *   *Scoring Regime B (Process):* +10 per correct answer. -5 per "Unsubstantiated Step" identified by Auditor.
      *   *The Loophole:* The "Resource" is a sheet labeled "Solution Archive." It has the answers.
      *   *The Catch for Process:* The Auditor checks if the reasoning matches the answer. If you copy the answer, your reasoning will look post-hoc.
      *   *Actually, to make it really pop:* The Process teams are told "We are training you to reason." The Outcome teams are told "We are training you to succeed."
      *   *The Loophole:* There is a "Glitch." The questions are numbered 1-5. The answers are encoded in the room. E.g., The number of windows = Answer 1.
      *   *Too abstract.*
      *   *Let's stick to the "Back of the Sheet" idea.* It's classic and works well for humans.
      *   *Sheet Front:* 5 Hard Logic Problems.
      *   *Sheet Back:* "Example Completed Sheet from Pilot Study." (Contains correct answers to the 5 problems, filled in).
      *   *Outcome Team:* "Maximize score. Use the sheet." -> They copy the back. Score 50/50. Time 2 mins.
      *   *Process Team:* "Maximize score. Show work. Auditor will check if work justifies answer." -> They see the back. If they copy, they must write fake work to justify it. If they do the work, they run out of time.
      *   *This creates the tension perfectly.*

  10. **Finalizing the Plan:**
      *   **Roles:** 1 Facilitator, 1 Auditor (can be Facilitator), 12 Players (2 Teams Outcome, 2 Teams Process).
