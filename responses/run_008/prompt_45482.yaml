prompt: |-
  My two roommates got into it at dinner about taxes of all things, and they wanted me to referee, but honestly I couldn't follow all of it, so I'm passing it to you.

  Ben had read about this thought experiment somewhere (Rawls, I think?) where you design the rules of society from behind a "veil of ignorance" — you settle everything before knowing whether you'll be born rich or poor, what talents you'll have, even what you'll end up wanting from life. Ben said obviusly behind the veil you'd demand that the worst-off position be as good as it can possibly be, becuase you might be the one who ends up there, so big inequalities are only okay if they actually lift the bottom. Priya said that's just irrational risk aversion dressed up as morality: if you'd honestly take a lottery with a 90% chance at a comfortable life and a 10% chance of being merely okay-but-not-great, then the people behind the veil should be allowed to gamble too, and a society with that kind of spread could be chosen over Ben's more equal one. Ben said no — the veil strips your gambling itch along with everything else, since your appetite for risk is part of your life plan, and the parties behind the veil don't know their life plans. Priya said then the whole thing cheats: you've built a decision-maker with no desires and then announce what he "would choose," so whatever comes out is just an artifact of what you starved him of. Ben said he's not that starved — even behind the veil you'd still know you'll need basics like income, rights, and self-respect no matter which life plan turns out to be yours, so there's enough to reason with. Priya said fine, but if he's rational and wants those goods, expected-value reasoning over whole lives is back on the table, so her gamble survives after all. Ben's last move was that the veil also wipes out probabilities — you'd have no idea what your odds of being born poor even are — and when you can't plug in probabilities, protecting the worst case is just the sensible rule, not cowardice. Priya said people act under total ignorance all the time without planning around the worst case in everything — she moved to a new city without once checking the unemployment rate — so playing it safe can't be some general rule of rationality; it's just the rule Ben happens to need for his conclusion.

  Can you go through their exchange move by move and tell me who's right at each step? Not just who wins overall — I want to know at each point whether the argument actually works, whether it's fair to the other side, and where they might be talking past each other. And if there's something both of them are missing that would change the whole picture, tell me that too.

  Please write it as plain continuous prose, like an email — no headings, bullet points, bold text, or tables. And American English, please.
