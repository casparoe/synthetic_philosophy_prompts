prompt: |-
  I'm a population geneticist by training — I think natively in selection coefficients, effective population sizes, drift, linkage disequilibrium, heritability, mutation–selection balance, and the Price equation — and I know the memetics literature only at the popular level, Dawkins's replicator proposal and its descendants. Restate memetic theory as a body of claims in my vocabulary, as faithfully as you can, and then give me a residue report.

  To give you a sense of the mapping I'd want attempted, not as a checklist you must complete: Is a meme best treated as an allele, as a haplotype, or as the lineage of a segregating variant? What plays the role of the population, the generation, and the effective population size? Is meme fitness a per-capita replication rate to which something like Fisher's fundamental theorem could apply, or is frequency-dependence so dominant that the quantitative apparatus collapses? Does anything like mutation–selection balance or drift in small populations have a cultural counterpart, and could it in principle be measured the way I would want to measure it? Please treat the dual-inheritance tradition as shared ground — I know gene–culture coevolution and the models of vertical and horizontal transmission that come with it — so concentrate on memetics as its own proposal, including where its proponents took it after Dawkins.

  Then tell me what didn't survive the translation. In particular, I want your honest assessment of three criticisms I've encountered: that cultural inheritance is blending rather than particulate, which was fatal to Darwin's own theory before Mendel; that cultural variation is directed rather than blind, so nothing plays the role mutation plays for me; and that selection on memes is inextricably mediated by selection on the human minds that carry them, leaving no clean way to assign fitness at the level I would need. For each, say whether it is an artifact of forcing my vocabulary onto memetics, a genuine gap memetics has never filled, or something my vocabulary cannot express at all. Where it is the last, tell me whether the inexpressible residue points to something real that neither framework captures — something about meaning, persuasion, or the interests of the host — or whether it points the other way.

  Finally, give me your considered view: is memetics a research program that population-genetic tools could in principle discipline into something quantitative, or is the translation so lossy that the differences are the whole story? If the former, say what the first serious model would have to contain; if the latter, say precisely where the analogy stops paying rent.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Persona:** Population geneticist. Thinks in terms of $s$, $N_e$, drift, LD, $h^2$, mutation-selection balance, Price equation. Knows dual-inheritance theory (gene-culture coevolution) but wants to focus specifically on *memetics* as a distinct proposal (Dawkins + descendants like Blackmore, Dennett, etc.).
      *   **Task:**
          1.  Restate memetic theory using population genetic vocabulary (faithfully).
          2.  Provide a "residue report" (what didn't translate).
          3.  Address three specific criticisms (blending inheritance, directed variation, host-mediated selection).
          4.  Give a considered view on whether memetics can be disciplined by pop-gen tools or if the analogy is too lossy.
      *   **Tone:** Technical, precise, rigorous, respectful of the user's expertise, avoiding pop-sci simplifications.

  2.  **Deconstruct Memetics into Pop-Gen Terms:**
      *   *Meme:* Needs to be mapped. Is it an allele? A locus? A haplotype? Dawkins originally suggested "tune," "catchphrase," "idea." In pop-gen terms, it's a replicator unit. Best fit: A segregating variant at a cultural locus, but loci are ill-defined. Let's call it a *cultural allele* at a fluid *cultural locus*.
      *   *Population:* The set of host minds (human brains) capable of holding the meme. $N$ = number of hosts.
      *   *Generation:* Discrete transmission events? Or continuous time? Memetics often assumes discrete copying events, but culture is continuous. Let's model as overlapping generations with transmission rates.
      *   *Fitness ($w$):* Replication rate. Number of new hosts infected per unit time. $R_0$ equivalent.
      *   *Selection Coefficient ($s$):* Difference in transmission rate relative to a baseline meme.
      *   *Mutation:* Modification during transmission (copying error).
      *   *Drift:* Stochastic loss due to finite $N_e$ of hosts.
      *   *Linkage:* Memes co-occurring in minds (ideological packages).
      *   *Price Equation:* $\Delta \bar{z} = Cov(w, z) + E(w \Delta z)$. This is actually the strongest bridge. Memetics *is* an application of the Price equation to cultural traits.

  3.  **Drafting the Translation (Section 1):**
      *   *Unit:* Treat a meme as a *cultural allele*. Unlike genes, loci are not fixed physically but defined by content similarity.
      *   *Population:* Host minds ($N$). $N_e$ is tricky because transmission is not random mating. It's network-based.
      *   *Fitness:* Per-capita transmission rate ($\beta$ in epidemiology terms). $w = 1 + s$.
      *   *Inheritance:* Vertical (parent-offspring), Oblique (elder-younger), Horizontal (peer-peer). Memetics emphasizes Horizontal (viral).
      *   *Dynamics:* Replicator dynamics. $\dot{p} = p(1-p)s$.
      *   *Linkage:* "Meme complexes" (haptypes). High LD due to co-transmission.

  4.  **Addressing the Residue/Criticisms (Section 2):**
      *   *Criticism 1: Blending Inheritance.*
          *   Pop-gen requires particulate inheritance (Mendel). Culture looks blending (averaging opinions).
          *   *Analysis:* It's not purely blending. Some memes are digital (religious dogma, catchy tunes). Others are analog.
          *   *Verdict:* Genuine gap for analog traits, but memetics focuses on the digital-like ones. Pop-gen tools *can* handle blending (quantitative genetics), but memetics claims *replicators*. If it blends, it's not a replicator. This is a hard constraint.
      *   *Criticism 2: Directed Variation (Lamarckism).*
          *   Mutation in genes is blind. Cultural "mutation" is often intentional improvement.
          *   *Analysis:* This breaks the "blind variation, selective retention" core.
          *   *Verdict:* Genuine gap. However, from the *meme's eye view*, the host's intention looks like an environmental filter. But the variation generation mechanism is fundamentally different.
      *   *Criticism 3: Host-Mediated Selection.*
          *   Gene fitness is intrinsic (mostly). Meme fitness depends on host psychology.
          *   *Analysis:* This is the Gene-Culture Coevolution objection. Memetics tries to decouple them (selfish meme vs. selfish gene).
          *   *Verdict:* This is the biggest friction point. If host selection and meme selection align, fine. If they conflict (virulent memes), memetics works. If they are entangled, assigning $s$ to the meme alone is impossible without controlling for host genotype/phenotype.

  5.  **Addressing the "Inexpressible Residue":**
      *   *Meaning/Semantics:* Pop-gen doesn't care what DNA *means*, only that it replicates. Memes rely on *meaning* to replicate. You can't separate the semantic content from the replication probability easily.
      *   *Agency:* Hosts are active selectors, not passive vessels.
      *   *Verdict:* This points to something real: *Intentionality*. Pop-gen assumes passive vehicles. Memetics requires active vehicles that interpret the replicator.

  6.  **Final Assessment (Section 3):**
      *   *Can it be disciplined?* Yes, but it looks more like Epidemiology (SIR models) + Quantitative Genetics than classical Pop-Gen.
      *   *Where does it stop paying rent?* When trying to define discrete loci and when ignoring host agency.
      *   *The "First Serious Model":* Needs to be an Epidemiological-Price Equation hybrid. Network structure is crucial ($N_e$ is network effective size). Must account for biased transmission (directed variation).
      *   *Conclusion:* Memetics as a *strict* analogy to genetics fails. Memetics as *Cultural Epidemiology* succeeds. The "meme" as a discrete unit is the weak link; the "meme" as a unit of transmission in a network is the strong link.

  7.  **Refining the Vocabulary:**
      *   Use $\Delta p$, $V_A$, $Cov(w,z)$.
      *   Distinguish between "Replicator" (meme) and "Vehicle" (host).
      *   Reference Hull (Interactors), Boyd & Richerson (Dual Inheritance) to show distinction.
      *   Ensure the tone is "colleague to colleague."

  8.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I focus too much on Dual Inheritance? *Correction:* Pull back. The prompt asks for Memetics *as its own proposal*. Dual Inheritance acknowledges the entanglement; Memetics tries to sever it. I need to highlight that tension.
      *   *Check:* Did I answer the "allele vs. haplotype" question? *Correction:* Make sure to explicitly state that memes function more like haplotypes or mobile genetic elements due to lack of fixed loci.
      *   *Check:* Is the criticism of blending inheritance nuanced enough? *Correction:* Acknowledge that Quantitative Genetics handles blending, but Memetics specifically claims *particulate* replication. If culture blends, the meme concept dissolves.

  9.  **Final Polish:** Organize into clear sections: Translation, Residue Report (The 3 Criticisms), and Considered View. Ensure the Price Equation gets its due prominence as the mathematical bridge. (Self-correction: The Price equation is abstract enough to cover almost anything, so the question is whether the *parameters* can be estimated.)

  10. (Final thought on "Residue"): The residue isn't just "stuff we can't measure," it's "stuff that violates the axioms." Specifically, the *semantic* content determines the *transmission* rate, whereas in genetics, the *sequence* determines the rate via the phenotype, but the sequence doesn't "mean" anything to the replication machinery in a semantic sense. This is the "Intentional Stance" residue.

