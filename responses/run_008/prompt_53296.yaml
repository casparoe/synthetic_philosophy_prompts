answer: |-
  Here is a translation of memetic theory into the formal vocabulary of population genetics, followed by a residue report on the fidelity of that mapping and an assessment of the program's viability.

  ### I. The Translation: Memetics as Population Genetics

  To map memetics onto your native framework, we must treat the **host mind** as the vehicle (phenotype) and the **meme** as the replicator (genotype).

  **1. The Unit of Inheritance (The "Allele")**
  In strict memetics (Dawkins, Blackmore, Dennett), a meme is a *replicator*. In your vocabulary, this is best treated not as a fixed locus allele, but as a **segregating variant at a fluid locus**.
  *   **Locus:** A "problem space" or cognitive niche (e.g., "explanation for lightning," "catchy melody structure"). These loci are not physically fixed in the genome but are defined functionally by the competition for attention/memory.
  *   **Allele:** The specific variant occupying that niche (e.g., "Thor" vs. "Zeus" vs. "Electromagnetic discharge").
  *   **Haplotype:** Memes show extreme Linkage Disequilibrium (LD). They travel in "meme complexes" (ideologies, religions). Because transmission is often wholesale copying of a worldview rather than recombination of independent traits, the effective unit is often a **cultural haplotype**.
  *   **Mobile Elements:** Some memes behave like transposons (e.g., chain letters, viral hashtags), inserting themselves into various host cognitive backgrounds without a fixed locus.

  **2. The Population and Generation**
  *   **Population ($N$):** The set of competent host minds.
  *   **Effective Population Size ($N_e$):** This is not simply the number of humans. It is the number of *active transmission nodes* in the cultural network. Because cultural transmission is highly structured (small-world networks, influencers), $N_e$ for memes is likely orders of magnitude smaller than census $N$, leading to high drift.
  *   **Generation:** Discrete generations do not exist. This is an **overlapping generation model** with continuous time. However, transmission events define a "generation." The generation time ($\tau$) is the interval between acquisition and subsequent transmission.

  **3. Fitness and Selection**
  *   **Fitness ($w$):** The expected number of new hosts infected by a meme copy before the host dies or forgets. This is effectively $R_0$ in epidemiology.
  *   **Selection Coefficient ($s$):** The difference in transmission rate between meme variants ($w_1 = 1+s, w_2 = 1$).
  *   **Fisher's Fundamental Theorem:** $\dot{\bar{w}} = V_A(w)$. Memetics claims this holds: the rate of increase in cultural fitness is equal to the additive genetic (cultural) variance in fitness. However, because fitness is frequency-dependent (see below), $\bar{w}$ is not constant.
  *   **Frequency Dependence:** Strongly dominant. A meme's $s$ is a function of its frequency $p$ (e.g., fashion, language norms). This violates the constant selection coefficient assumption of simple pop-gen models, requiring game-theoretic dynamics (ESS).

  **4. Mutation and Drift**
  *   **Mutation Rate ($\mu$):** The probability of modification during transmission (copying error). In memetics, $\mu$ is high compared to DNA.
  *   **Drift:** Stochastic loss of memes due to finite $N_e$. In small subcultures, drift dominates selection.
  *   **Mutation-Selection Balance:** $\hat{q} \approx \sqrt{\mu/s}$ (for recessive deleterious memes). Memetics posits that "bad" ideas (those harmful to the host but good for replication) can persist if $\mu$ is high or $s$ (against the meme) is low.

  **5. The Price Equation**
  This is the strongest mathematical bridge. Memetics is essentially an assertion that the Price Equation applies to cultural traits:
  $$ \Delta \bar{z} = \text{Cov}(w, z) + E(w \Delta z) $$
  Where $z$ is the meme trait value. Memetics argues that the covariance term (selection) dominates, while the expectation term (transmission bias/mutation) is secondary, though often larger than in genetics.

  ---

  ### II. Residue Report: What Didn't Survive Translation

  Here is the assessment of the three specific criticisms you raised, categorized by whether they are artifacts, gaps, or inexpressible residues.

  #### 1. Blending vs. Particulate Inheritance
  *   **The Criticism:** Cultural traits blend (e.g., accents, political views average out), whereas Darwinism requires particulate inheritance to prevent variance from dissolving.
  *   **Assessment:** **Genuine Gap.**
  *   **Analysis:** In pop-gen, blending inheritance destroys $V_A$, halting selection. Memetics attempts to circumvent this by defining memes *only* as the particulate subset of culture (digital, discrete, high-fidelity copying).
  *   **Verdict:** This is not an artifact of your vocabulary; it is a constraint of the replicator concept. If culture blends, it is not memetic; it is quantitative genetic. Memetics survives only by asserting that high-fidelity copying mechanisms (language, writing, ritual) exist to enforce particulate inheritance. Where they don't (e.g., skill acquisition), the meme concept dissolves into quantitative genetics.
  *   **Residue:** The "blending" residue points to **Quantitative Cultural Genetics**, which is a different model than Memetics. Memetics ignores this residue by fiat.

  #### 2. Directed Variation (Lamarckism)
  *   **The Criticism:** Genetic mutation is blind to fitness; cultural variation is often directed (engineered for improvement).
  *   **Assessment:** **Genuine Gap.**
  *   **Analysis:** In your framework, mutation is a parameter $\mu$ independent of $s$. In memetics, "mutation" is often a function of $s$ (people improve ideas *because* they want them to spread/work). This creates a feedback loop where variation generation is coupled to selection pressure.
  *   **Verdict:** This breaks the "blind variation, selective retention" axiom. However, from the **meme's eye view**, host intentionality is part of the *environment*. If a host modifies a meme to make it more transmissible, that is still selection operating on the meme, even if the mechanism is intelligent design by the vehicle.
  *   **Residue:** The inexpressible residue here is **Agency**. Pop-gen assumes passive vehicles. Memetics requires active vehicles that evaluate the replicator. Your vocabulary can model the *outcome* (change in $p$), but it cannot model the *mechanism* (intentional modification) without treating "host intelligence" as an environmental parameter, which feels like a hack.

  #### 3. Host-Mediated Selection (Gene-Culture Entanglement)
  *   **The Criticism:** Meme fitness is inextricably mediated by host psychology/genetics. You cannot assign $w$ to the meme independently of the host.
  *   **Assessment:** **Inexpressible Residue (points to something real).**
  *   **Analysis:** In genetics, the gene builds the vehicle, and the vehicle replicates the gene. In memetics, the meme does not build the host. The host's genetic fitness ($w_G$) and the meme's cultural fitness ($w_M$) are distinct variables. Memetics claims $w_M$ can be maximized even if $w_G$ decreases (e.g., celibacy memes).
  *   **Verdict:** Your vocabulary struggles here because standard pop-gen assumes alignment between replicator and vehicle fitness (except in cases of meiotic drive or parasites). Memetics treats culture as a **parasitic or symbiotic replicator system** independent of the host genome.
  *   **Residue:** This points to **Inter-level Selection**. The residue is the conflict between $w_G$ and $w_M$. Your tools can measure this (using multi-level Price equation), but the *ontological status* of the meme is the friction point. Is the meme a distinct replicator, or just a phenotype of the host genome expressed in a social context? Memetics insists on the former; Dual Inheritance often settles for the latter.

  ---

  ### III. Considered View: Discipline or Dissolution?

  **Is memetics a research program that population-genetic tools could discipline?**

  **Yes, but only if it ceases to claim it is "Genetics" and admits it is "Epidemiology with Evolution."**

  The translation is too lossy to treat memes exactly like alleles at fixed loci. The "locus" problem is fatal to a strict genetic analogy. However, the **dynamics** of replication, selection, and drift are isomorphic.

  **Where the analogy stops paying rent:**
  1.  **Definition of the Unit:** You cannot identify a meme without semantic interpretation. In genetics, you can sequence a locus without knowing its function. In memetics, you must know the *meaning* to identify the *unit*. If the meaning changes, is it the same allele? (e.g., "Freedom" in 1776 vs. 2024). This makes measuring $p$ (frequency) subjective.
  2.  **The Fitness Landscape:** In genetics, the landscape is external (environment). In memetics, the landscape is internal (host minds) and changes as the memes change it (niche construction on steroids).
  3.  **Recombination:** Genetic recombination is mechanistic (meiosis). Cultural recombination is semantic (analogy, synthesis). It is not a random shuffling of parts; it is a guided integration.

  **The First Serious Model:**
  If you were to build a quantitative memetic model that survives these criticisms, it would not look like Wright-Fisher. It would look like this:

  1.  **Framework:** **Cultural Epidemiology** (SIR models) coupled with the **Price Equation**.
  2.  **State Variables:** Frequency of meme $i$ in network node $j$.
  3.  **Transmission Matrix:** A network adjacency matrix $A$, where $A_{jk}$ is the probability of transmission from $j$ to $k$. This captures $N_e$ and structure.
  4.  **Fitness Function:** $w_i = \beta_i - \gamma_i - \delta_i$.
      *   $\beta$ (Transmission rate): Function of meme content *and* host susceptibility.
      *   $\gamma$ (Recovery/Forgetting rate): Function of memory decay.
      *   $\delta$ (Death rate): Host mortality.
  5.  **Variation Operator:** Instead of mutation matrix $\mu$, use a **Transformation Function** $T(meme, host\_context) \to meme'$. This acknowledges directed variation.
  6.  **Selection:** Measured as the Covariance between transmission rate $\beta$ and meme frequency, controlling for host network position.

  **Conclusion:**
  Memetics is not "fake," but it is **ontologically heavier** than genetics. It posits a second replicator system that rides on the first. Your population genetic tools are sufficient to model the *dynamics* ($\Delta p$), provided you treat the parameters ($s, \mu, N_e$) as emergent properties of a psychological network rather than physical constants.

  The "residue" (meaning, agency, blending) is not noise; it is the mechanism. In genetics, the mechanism (chemistry) is distinct from the information (sequence). In memetics, the mechanism (psychology) *is* the interpreter of the information. You cannot ignore the residue. You must model it. If you do, you are no longer doing pure memetics; you are doing **Gene-Culture Coevolution with a focus on horizontal transmission dynamics**.

  Memetics as a distinct discipline (separate from dual-inheritance theory) fails because it tries to sever the link between host and replicator that your vocabulary rightly insists is fundamental to inheritance. But as a heuristic for modeling high-fidelity, horizontal, viral transmission dynamics using pop-gen math? It pays rent, provided you don't believe your own press release about memes being "just like genes."
