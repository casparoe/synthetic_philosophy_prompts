answer: |-
  This is a remarkably clear-eyed summary of a debate that has indeed fossilized. You are asking for a meta-ethical diagnosis of the stalemate, not a solution to the trolley problem. Here is the breakdown of what is actually happening, what progress would look like, and how your committee should handle the grant.

  ### The Diagnosis: A Category Error in Moral Accounting

  Your hypothesis about extrapolation is strong, but as you noted, it doesn't fully explain the stalemate at "ordinary" numbers (a million vs. a few thousand). The disagreement persists there because this is not merely a dispute about magnitude or extrapolation rules. It is a **category error regarding the unit of moral accounting.**

  The two sides are not speaking the same moral language, even though they are using the same words ("worse," "harm," "benefit").

  1.  **The Aggregators are speaking the language of *States of Affairs*.**
      For them, the fundamental unit of value is the *quantum of welfare* (pleasure, pain, utility). This value is fluid; it detaches from the person experiencing it and enters a global pool. When they ask, "Which outcome is worse?" they are asking, "Which universe contains more negative utility units?" In this framework, persons are merely vessels for value. If you pour a cup of water from a bucket into a bathtub, the water doesn't care where it is. Similarly, suffering doesn't care who holds it; it just adds up.

  2.  **The Anti-Aggregators are speaking the language of *Claims and Relationships*.**
      For them, the fundamental unit of value is the *person*. Moral badness isn't a fluid substance; it is a violation of a specific individual's integrity or a frustration of their specific claims. When they ask, "Which outcome is worse?" they are often asking, "Which action is more objectionable to perform?" or "Whose complaint has greater standing?" In this framework, you cannot pour suffering from one person into another. A million itchy feet are a million separate events, not one big pile of itchiness that can outweigh a broken spine.

  **Why this causes a stalemate:**
  The aggregators view the anti-aggregators as making a math error because they believe value *must* be additive to be rational. The anti-aggregators view the aggregators as making a category error because they believe persons *cannot* be merged into a single vessel for calculation without losing the very thing that makes morality matter (the distinction between persons).

  This is why the "threshold" people can't define the threshold. They are trying to draw a line on a graph that they don't actually believe is linear. They are trying to use the aggregators' math to prove the aggregators wrong, which is impossible.

  So, to answer your specific question: **It is a disagreement about ontology, disguised as a disagreement about arithmetic.** One side believes morality is about maximizing the good (impersonal). The other believes morality is about respecting the separate (personal). Neither can prove the other wrong because they are arguing from different first principles about what morality *is for*.

  ### What Would Count as Progress?

  Since this is a clash of frameworks rather than a solvable equation, a "proof" is impossible. You will not find a formal result that forces a utilitarian to accept a threshold or a contractualist to accept additive aggregation. However, progress is possible in three specific forms:

  1.  **Domain Specification:** Progress looks like agreeing that each framework is a tool for a specific job. Aggregation is excellent for policy, logistics, and resource allocation where no specific rights are violated (e.g., traffic light timing). Claim-based morality is essential for rights, justice, and bodily integrity (e.g., criminal law). The stalemate breaks when you admit that "worse" is indexical: "Worse for the universe" vs. "Worse for the victim."
  2.  **Institutional Clarity:** Progress looks like realizing that a *foundation* is not a *god*. A god might be obligated to optimize the state of the universe. A foundation is a specific social instrument with a specific charter. The question shifts from "What is the metaphysically right thing to do?" to "What is the right thing for *this institution* to do?"
  3.  **Decision Rules over Moral Truths:** Progress looks like adopting a decision procedure that allows action despite metaphysical uncertainty. For example, agreeing to minimize "severe deprivation" as a operational definition, rather than "suffering units."

  The psychology findings you mentioned (scope insensitivity) are useful for humility but useless for resolution. Knowing our brains are buggy doesn't tell us which bug to patch.

  ### Advice for the Committee

  You are in a family foundation, not a philosophy department. The goal is not to solve the aggregation problem; the goal is to deploy capital effectively without destroying family relationships. Here is how to move forward:

  **1. Decouple the Grant from the Grand Theory**
  Explicitly state that the committee is not settling the torture vs. dust specks debate for all time. You are making a *portfolio decision* for a specific fiscal cycle. Acknowledge that reasonable people disagree on the weighting of severity vs. scale.

  **2. Consult the Charter**
  Most foundations have a mission statement or a set of donor intent guidelines. Does the foundation prioritize "alleviating the most severe suffering" or "helping the greatest number of people"? If the charter is vague, this is the moment to define it operationally. If your aunt founded the place to "help the helpless," does that mean the *most* helpless (cataract blindness is often more debilitating than worms) or the *most* helpless in aggregate? Let the legal/mission documents break the tie, not your cousin's reading of LessWrong.

  **3. The "Split the Difference" Heuristic**
  If the budget allows, fund both. If the budget forces a choice, consider whether this is a recurring grant. Can you fund deworming this year and cataracts next year? This acknowledges the validity of both moral frameworks without requiring you to declare one false. It treats the disagreement as a resource allocation problem rather than a truth claim.

  **4. The "Regret Test"**
  Ask the committee: "In five years, which decision will we regret more?"
  *   If you fund deworming, and you meet a blind person who could have seen, how does that feel?
  *   If you fund cataracts, and you learn a million kids spent years in pain, how does that feel?
  This bypasses the axiology and targets the emotional/psychological reality of the donors. Since it is family money, the family's ability to sleep at night is a valid metric of success.

  **5. Avoid the "Math Error" Trap**
  Warn your cousin and the aggregators that insisting the other side is making a "math error" is inflammatory and philosophically unsound. It is not a math error to deny that persons are mere containers. Warn the anti-aggregators that refusing to count numbers at all leads to paralysis. Frame the decision as a **weighting exercise**, not a discovery of objective truth.

  ### Summary
  The disagreement is bedrock, but it is bedrock about the *nature of persons*, not the *nature of harm*. You cannot argue someone out of their ontology.

  For the purpose of the foundation, treat the two options as different asset classes. One is high-impact/deep intervention (cataracts); the other is broad/shallow intervention (deworming). An investment committee doesn't argue about whether bonds are "morally superior" to stocks; they ask what fits the portfolio.

  Make the decision based on the foundation's specific mission and the family's risk tolerance for regret, then close the file. The philosophy is interesting, but the grant is due.
