prompt: |-
  i'm a hospitalist, and there's a recurring thing that happens on rounds: families ask whether to make a call now or wait. start the iv antibiotics tonight or hold for culture results and the id consult on monday. sign the dnr now or wait until after the chaplain visit. transfer to hospice this week or let the trial of therapy play out first. i once went to a talk where the speaker mentioned a principle from philosophy called Reflection, roughly: if you're certain today that on monday you'll believe X to degree p, then today you should already believe X to degree p. on that view, deferring to your future self should never change what you think, only when you act on it — which makes "let's wait and see" either rational (new information is coming) or a disguised way of doing nothing.

  the catch is the speaker also said Reflection has known counterexamples, cases where you expect your future self to be compromised — drunk, sleep-deprived, in love, forgetting things. that maps onto medicine uncomfortably well: the family meeting goes sideways, the night on call scrambles everyone, or the patient who survives to day 3 changes what we're willing to say out loud. so deferring isn't automatically honest.

  so here's the ask: turn this into a procedure i can actually run at the bedside in about five minutes with a family in the room. i'm a resident, so anything big needs the attending to co-sign, and the stakes are usually irreversible either way (starting treatment you can't walk back, or delaying past the point where it helps). give me the questions in order, what counts as enough of an answer to each, the points where the procedure outputs "decide now," the points where it outputs "defer," and — this is the part i care about most — where it has to stop and admit the question is one of values (how much suffering to trade for how many days) rather than facts, and hand it back to the patient instead of pretending the philosophy settles it.

  then run it on three cases: (1) start broad-spectrum antibiotics now versus wait 48 hours for cultures in a clinically stable patient, (2) defer the dnr conversation until the estranged son flies in for the weekend, and (3) one case where the procedure gives the answer i wont like — namely that my "let's wait" was just me avoiding a hard conversation, and Reflection calls it. and be honest about which steps of the procedure are judgment calls wearing a lab coat.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and case analyses:

  1.  **Deconstruct the Request:**
      *   **User:** Hospitalist (resident level, needs attending co-sign for big moves).
      *   **Problem:** Recurring dilemma on rounds: Act now vs. Wait/Defer (Antibiotics, DNR, Hospice, etc.).
      *   **Philosophical Core:** Van Fraassen's *Reflection Principle* (If you know you'll believe $P$ with confidence $C$ later, you should believe it now). Counterexamples involve compromised future selves (drunk, tired, emotional shifts).
      *   **Medical Context:** Future selves can be compromised (night call chaos, family dynamics shifting, patient trajectory changing). "Wait and see" can be rational (new info) or avoidance (akrasia/fear).
      *   **Task:** Create a 5-minute bedside procedure based on this philosophy.
          *   Needs ordered questions.
          *   Needs criteria for "Decide Now" vs. "Defer".
          *   Needs a specific stop-point for "Values vs. Facts" (hand back to patient/family).
          *   Needs to acknowledge where judgment calls are masquerading as objective steps.
      *   **Application:** Run the procedure on three specific cases:
          1.  Antibiotics (Stable patient, wait for cultures?).
          2.  DNR (Wait for estranged son?).
          3.  The "Uncomfortable Truth" case (Where "Wait" is actually avoidance).

  2.  **Develop the Procedure (The "Reflection Round" Algorithm):**
      *   *Goal:* Distinguish between *epistemic deferral* (waiting for new data) and *emotional/practical deferral* (waiting for a different mindset).
      *   *Constraint:* 5 minutes, bedside, resident level.
      *   *Structure:*
          1.  **Identify the Decision:** What exactly are we deciding?
          2.  **The Information Test:** Will Monday actually bring *new medical data*? (Reflection Principle: If belief won't change, why wait?)
          3.  **The Compromise Test:** Is the future self/context compromised? (The Counterexample).
          4.  **The Reversibility Test:** Can we undo this? (Risk management).
          5.  **The Values Handoff:** If it's not about data, it's about goals.
      *   *Outputs:* Decide Now, Defer (with conditions), or Values Conversation.
      *   *Self-Correction on "Values":* The prompt asks to admit when the question is values, not facts. This needs a specific step where the doctor stops pretending medical expertise dictates the choice.

  3.  **Drafting the Steps (Iterative Refinement):**
      *   *Step 1 (The Snapshot):* Define the fork in the road.
      *   *Step 2 (The Data Check):* Will waiting change the *medical* picture? If no -> Reflection says act now. If yes -> Proceed.
      *   *Step 3 (The Context Check):* Will the *decision-maker* be better or worse? (Son arriving vs. Night float chaos).
      *   *Step 4 (The Harm Check):* What is the cost of waiting? (Physiologic vs. Psychological).
      *   *Step 5 (The Values Pivot):* If the medical risk is low but the emotional weight is high, admit it's a values call.

  4.  **Refining the "Judgment Calls Wearing a Lab Coat":**
      *   I need to explicitly flag where the "algorithm" relies on the physician's intuition (e.g., assessing "clinical stability" or "family dysfunction"). This addresses the user's request for honesty.

  5.  **Running the Cases:**

      *   **Case 1: Antibiotics (Stable Patient).**
          *   *Data:* Cultures take 48h.
          *   *Risk:* Sepsis progression vs. Resistance/Side effects.
          *   *Reflection:* If I think they need abx Monday, give them now. If I think cultures will guide me, wait.
          *   *Verdict:* Usually "Decide Now" (Start or Don't Start), but "Wait" is valid *if* stability is truly assured.
          *   *Nuance:* Is "stable" a judgment call? Yes.

      *   **Case 2: DNR (Estranged Son).**
          *   *Data:* No new medical data expected by weekend.
          *   *Context:* Son's arrival changes the *social* landscape, not the medical one.
          *   *Reflection:* If I believe DNR is appropriate now, waiting implies I think the son will change my medical assessment. He won't. He changes the *consensus*.
          *   *Verdict:* Defer is okay *if* the goal is consensus, not medical clarity. But need to flag the risk (code during wait).
          *   *Values:* This is about who decides, not physiology.

      *   **Case 3: The "Uncomfortable Truth" (Avoidance).**
          *   *Scenario:* Hospice vs. Trial of Therapy.
          *   *Setup:* I know the patient is dying. I tell family "let's try 3 more days."
          *   *Reflection:* Do I believe on Friday what I believe today? Yes (that this is futile).
          *   *Compromise:* Am I waiting because I'm tired of the conversation? Yes.
          *   *Verdict:* Procedure flags this as avoidance. "Decide Now" (Recommend Hospice).
          *   *Honesty:* This hurts. It admits the doctor is the bottleneck.

  6.  **Review against Constraints:**
      *   5 minutes? Yes, 5 questions.
      *   Resident level? Yes, emphasizes attending co-sign for high stakes.
      *   Values admission? Yes, Step 5.
      *   Judgment calls flagged? Yes, in the commentary.

  7.  **Final Polish:**
      *   Tone: Professional, empathetic, philosophically grounded but pragmatic.
      *   Formatting: Clear steps, bold text for emphasis.
      *   Ensure the "Reflection Principle" is applied correctly (belief consistency vs. action timing).

      *(Self-Correction during drafting Case 3)*: Make sure Case 3 isn't just "Doctor was wrong." It needs to be "Doctor knew the answer but used time as a buffer." The procedure should catch the *buffering*.

      *(Refining the Values Step)*: The prompt asks to "hand it back to the patient." I need to make sure Step 5 explicitly says "I cannot answer this for you."

  8.  **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  Here is a 5-minute bedside procedure based on the Reflection Principle, adapted for clinical uncertainty and the specific constraints of hospital medicine. I call it the **Reflection Round**.

  It is designed to separate *epistemic deferral* (waiting for data) from *emotional deferral* (waiting for courage/consensus), and to flag when you are outsourcing a values judgment to the calendar.

  ### The Reflection Round Procedure

  **Prerequisites:** Patient/family present. Attending available for co-sign if "Decide Now" involves irreversible high-stakes intervention.
  **Time:** 5 Minutes.

  #### Step 1: The Fork Definition
  **Ask:** "If we make this decision today, what happens? If we wait until [Time X], what happens?"
  **Success Criterion:** Both paths are articulated in plain language, not medical jargon.
  **Judgment Call:** *Defining the "Fork."* You are choosing which options are real. Excluding an option here (e.g., not mentioning hospice) biases the output.

  #### Step 2: The Information Test (The Reflection Core)
  **Ask:** "Will [Time X] provide **new medical data** that we do not have now?"
  *   **If YES:** (e.g., Culture results, MRI read, biopsy). -> **Proceed to Step 3.**
  *   **If NO:** (e.g., Waiting for a family member, waiting for 'Monday', waiting to 'see how they look'). -> **Output: DECIDE NOW.**
      *   *Rationale:* If your medical belief won't change, Reflection says your action shouldn't be delayed. Delaying is purely emotional or logistical.

  #### Step 3: The Compromise Test (The Counterexample)
  **Ask:** "Is the decision-making context today **compromised** compared to [Time X]?"
  *   **Check:** Is the surrogate sleep-deprived? Is the key family member absent? Is the team too scrambled (night float) to explain risks clearly?
  *   **If YES (Future is Better):** -> **Output: DEFER (with conditions).**
  *   **If NO (Future is Same/Worse):** -> **Output: DECIDE NOW.**
      *   *Rationale:* If the future self isn't clearer, waiting is just procrastination.

  #### Step 4: The Physiologic Cost Check
  **Ask:** "What is the physiologic price of waiting until [Time X]?"
  *   **Low Cost:** (e.g., DNR status in stable patient, diet choice). -> **Defer is safe.**
  *   **High Cost:** (e.g., Antibiotics in sepsis, intubation in respiratory failure). -> **Output: DECIDE NOW.**
      *   *Judgment Call:* *Defining "Stable."* This is where residents often misjudge risk. If you are unsure, default to "High Cost."

  #### Step 5: The Values Handoff (The Stop Point)
  **Trigger:** If Steps 2-4 suggest "Defer" is safe, but the decision hinges on *quality of life* vs. *length of life*.
  **Action:** State explicitly: "Medicine can tell us if this treatment *works*. It cannot tell us if it is *worth it*. Waiting will not change the medical facts, only how we feel about them. This is a values choice, not a medical one."
  **Output:** **HAND BACK TO PATIENT.** Do not offer a recommendation until they clarify the value.

  ---

  ### Case Runs

  Here is the procedure applied to your three scenarios.

  #### Case 1: Antibiotics (Stable Patient, Wait for Cultures?)
  *   **Context:** 72M, fever, source unknown. Hemodynamically stable. Cultures drawn. ID consult Monday.
  *   **Step 1 (Fork):** Start broad-spectrum now vs. Wait 48h for cultures/ID.
  *   **Step 2 (Info Test):** **YES.** Cultures and ID consult provide new data (organism, sensitivities, expert opinion). *Pass to Step 3.*
  *   **Step 3 (Compromise Test):** Is the team compromised today? No, rounds are calm. Is the patient compromised? No. *Pass to Step 4.*
  *   **Step 4 (Physiologic Cost):** **JUDGMENT CALL.** Is he truly stable? If he spikes another fever or BP drops, cost is high. If he remains afebrile, cost is low.
      *   *Assessment:* Let's assume he is robustly stable.
  *   **Step 5 (Values Handoff):** Not applicable. This is a risk/benefit calculation.
  *   **Procedure Output:** **DEFER (with conditions).**
      *   *Condition:* "We wait *only if* vitals remain stable. If BP drops, we switch to 'Decide Now'."
      *   *Honesty Check:* The judgment call here is Step 4. "Stable" is a prediction, not a fact. If you are anxious, the procedure forces you to admit you are betting on stability.

  #### Case 2: DNR (Wait for Estranged Son?)
  *   **Context:** 85F, metastatic cancer, coding risk high. Daughter wants DNR. Son flying in Sunday.
  *   **Step 1 (Fork):** Sign DNR today vs. Wait for Son.
  *   **Step 2 (Info Test):** **NO.** Sunday brings no new medical data. Her prognosis is the same Friday or Sunday.
      *   *Reflection Check:* If you believe DNR is medically appropriate today, you will believe it Sunday.
      *   *Procedure Signal:* **DECIDE NOW.**
  *   **Step 3 (Compromise Test):** **YES.** The decision-making *unit* is compromised. The daughter feels unable to decide without the brother. The social context changes Sunday.
      *   *Override:* This allows a Deferral, *but*...
  *   **Step 4 (Physiologic Cost):** **HIGH.** She could code Saturday night.
  *   **Step 5 (Values Handoff):** **TRIGGERED.**
      *   *Script:* "Waiting until Sunday does not change her medical outlook. It changes who is in the room. The risk is she might die before he arrives. We can write a DNR order that becomes active only after you speak to him, or we can agree on a 'Limited Code' until he arrives. But we must acknowledge: waiting is for *family consensus*, not medical clarity."
  *   **Procedure Output:** **DEFER (Explicitly Social).**
      *   *Caveat:* You must document that the deferral is for *process*, not *prognosis*. If she codes, you act according to the pre-deferral plan (usually Full Code).
      *   *Honesty Check:* Step 2 flagged this as medically unnecessary delay. Step 3 allowed it for social reasons. You must own that you are prioritizing family peace over medical efficiency/risk.

  #### Case 3: The Uncomfortable Truth (Hospice vs. Trial of Therapy)
  *   **Context:** 65M, end-stage liver disease, recurrent encephalopathy. Family wants "everything." You know he is dying. You suggest "3 more days of therapy."
  *   **Step 1 (Fork):** Hospice now vs. 3-day trial.
  *   **Step 2 (Info Test):** **NO.** Will you know more in 3 days?
      *   *Internal Monologue:* Be honest. Do you expect his ammonia to clear and him to walk out? No. You expect him to stay confused or worsen.
      *   *Reflection:* If you are certain on Friday that this was futile, you should believe it today.
      *   *Procedure Signal:* **DECIDE NOW.**
  *   **Step 3 (Compromise Test):** **NO.** Is the family more capable of understanding in 3 days? Or are *you* hoping they will 'get it' after a crash?
      *   *Analysis:* You are hoping the *patient's body* will convince them. That is using physiology as a messenger.
  *   **Step 4 (Physiologic Cost):** **HIGH.** Three days of invasive treatment (lines, tubes, blood draws) for a dying patient is suffering without benefit.
  *   **Step 5 (Values Handoff):** **TRIGGERED.**
      *   *Script:* "I need to stop. I am suggesting we wait 3 days. But medically, I do not expect his liver to recover. If we wait, we are not waiting for *hope*, we are waiting for *acceptance*. That is not a medical timeline; that is a grief timeline. I cannot prescribe time. I can only tell you that more treatment now means more suffering now, with the same outcome."
  *   **Procedure Output:** **DECIDE NOW (Recommend Hospice).**
      *   *The "Won't Like" Answer:* The procedure catches you. You were using "wait and see" to avoid the conflict of saying "he is dying." Reflection says: If you know the outcome, delay is dishonest.
      *   *Honesty Check:* Step 2 is the mirror. It asks: "Do you actually expect new data?" If the answer is "No, I just need them to cry first," the procedure forces you to admit you are managing *your* discomfort, not their care.

  ### Where the Lab Coat Hides Judgment

  You asked for honesty about which steps are judgment calls wearing a lab coat. Here they are:

  1.  **Step 2 (Defining "Data"):** In Case 3, you can lie to yourself. You can say "We need to see if the lactulose works" (Data) when you know "Lactulose won't fix the necrotic liver" (No Data). The procedure relies on your intellectual honesty.
  2.  **Step 4 (Defining "Cost"):** "Physiologic cost" is easy to measure in blood pressure. It is hard to measure in dignity. In Case 2, the cost of waiting for the son is the risk of a chaotic code. The cost of *not* waiting is family trauma. The procedure treats "Family Trauma" as a Compromise (Step 3), but you decide how much weight that carries against the Physiologic Cost.
  3.  **The Attending Co-Sign:** As a resident, you can run this procedure, but if the output is "Decide Now" on a high-stakes values issue (Case 3), you need your attending to validate that *your* Reflection isn't just burnout. Sometimes "Wait" is actually patience, not avoidance. The procedure distinguishes the two, but it cannot measure your fatigue.

  ### Summary for Rounds
  When the family asks "Should we wait?":
  1.  **Will Monday tell us something Friday doesn't?** (If No -> Decide).
  2.  **Will Saturday be safer than tonight?** (If No -> Decide).
  3.  **Are we waiting for data, or for courage?** (If Courage -> Say it out loud).

  If you can't answer Step 1 with a specific test result, you aren't waiting for medicine. You're waiting for hope. And hope doesn't run on a schedule.
