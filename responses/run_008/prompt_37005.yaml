      *   **Constraints:**
          *   Under 900 words.
          *   Must deal honestly with the strongest version of the gallerist's worry (aesthetic testimony vs. firsthand experience).
          *   Must address the epistemological nuance (knowledge vs. justified belief, deferring judgment).
          *   Must address the bylaw constraint ("exercise its own aesthetic judgment").
          *   Tone: Professional, persuasive, respectful to the losing side, something committee members will actually read.
          *   Goal: Reasoning the losing side could respect (even if they disagree).

  2.  **Determine the Recommendation:**
      *   Option A (Seen): Safe, "fine," corporate. Low risk, low reward.
      *   Option B (Unseen): High potential ("best in a decade"), trusted source (curator who was right before), big name. Higher risk (trust-based), high reward.
      *   *Philosophical Angle:* The prompt implies the user leans towards the "Maya" side (testimony can justify belief/action) but needs to address the "Gallerist" side (aesthetic judgment requires experience).
