      Make sure to explain *why* 2 and 3 conflict. 2 says they are different claims. 3 says they are the same proposition.

      *Cheapest Fix:* Dropping 3 is easiest linguistically. Dropping 1 is easiest logically (restricting scope). Dropping 2 is hardest (goes against strong intuition).

      *Single Revision:* "Contextual Dualism."

