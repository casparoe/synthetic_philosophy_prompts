prompt: |-
  You're a decision theorist who's spent way too much time thinking about how expected value behaves at the limit, so I'm hoping you can get me out of an argument my seminar-mate swears proves expected-value reasoning refutes itself. Please think it through carefully before committing — maybe start by brainstorming the possible escape routes and only then tell me which one is actually real.

  The setup is just the St. Petersburg game: a fair coin is flipped until it lands heads, and if the first heads is on flip n, you're paid 2^n dollars. His arguement:

  (1) A rational agent prefers a gamble to any sure amount smaller than the gamble's expected value, and prefers any sure amount larger than that to the gamble. He says this is just what expected-value maximization says.
  (2) The game's expected value is the sum over n of (1/2)^n · 2^n — an infinite sum of 1's, so infinite.
  (3) Infinite is bigger than any finite amount, so by (1) a rational agent must prefer the game to every sure amount. A guaranteed billion, ten billion, name it.
  (4) With probability 1/2 the game pays exactly $2. So a rational agent must take a half-chance of $2 over a guaranteed billion dollars.
  (5) Preferring a half-chance of $2 to a guaranteed billion is flat irrational, whatever the theory says. So either rational choice theory has lost its mind, or (1) fails somewhere.

  I can feel the problem is in the move from (1) to (3) — (1) was drilled into me for gambles with finite expected values, and something changes once it's infinite — but I can't say precisely what breaks. Not just "infinities are weird"; I want to know what (1) was actually entitled to. And he has a comeback ready: if I try the standard Bernoulli move (treat the value of money as logaritmic, so the game's expected value in utility comes out finite and the paradox dissolves), he says he'll just restate the payoffs so they blow up again even in utility terms. So I need two things from you: exactly where his argument first goes wrong, and whether his rescaling comeback would really work if he tried it.

  Please structure your answer as follows, with roughly these lengths: "Escape routes" — a short list of the exits you considered before committing, ~150 words; "Where it breaks" — the precise diagnosis, ~300 words; "The rescaling comeback" — does it work, ~250 words; "What I'd be giving up" — what rejecting the premise costs, ~150 words; and last, "Confidence" — ~100 words where you say how confident you are in your main claims and single out the one point you're least sure of.
