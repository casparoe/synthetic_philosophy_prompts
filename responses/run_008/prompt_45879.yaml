  The rescaling comeback
  Your mate's rescaling objection is mathematically valid but philosophically misdirected. If you switch to Expected Utility (EU) with an unbounded utility function (like log wealth), he can indeed construct a "Super St. Petersburg" game with payoffs growing fast enough to make expected utility infinite again. This is known as Menger's objection. However, this does not vindicate his original argument about Expected Value; it merely shows that *unbounded* utility functions are incompatible with rational choice theory.

  The standard resolution here is not to abandon EU, but to accept that rational utility functions must be *bounded*. If utility is bounded (e.g., there is a maximum possible satisfaction), no payoff schedule can generate infinite expected utility, and the paradox dissolves. So, his comeback works only if you insist on unbounded utility. If you accept bounded utility as a requirement for coherence, his rescaling fails to regenerate the paradox. Thus, the rescaling doesn't prove EV reasoning refutes itself; it proves unbounded valuation refutes itself. It forces us to recognize that no rational agent can value money without limit, regardless of the payoff schedule. His comeback succeeds in showing the paradox is robust against specific utility functions, but fails to show it is robust against the requirement of boundedness itself.

  What I'd be giving up
  By rejecting Premise (1), you surrender the simplicity of naive Expected Value maximization. You must accept that "maximize expected money" is not a fundamental law of rationality, but a heuristic that works only under specific conditions (finite variance/expectation). This means admitting that in extreme tail-risk scenarios, rationality might require risk aversion even without diminishing marginal utility, or that some choices are simply rationally incomparable. It complicates cost-benefit analysis in fields like existential risk or Pascalian wagers, where infinite expectations are often invoked to justify extreme actions. You lose the ability to say "the math says take the gamble" when the math involves divergent sums. Ultimately, you give up the dream of a purely algorithmic rationality that ignores the agent's specific valuation structure.

  Confidence
  I am highly confident that Premise (1) is the failure point; standard decision theory does not support preference orderings based on divergent expectations. I am also confident that Menger's boundedness result neutralizes the rescaling objection. The point I am least sure of is whether bounded utility is the *only* viable solution; some modern theorists argue for risk-weighted expected utility or allowing incomparability rather than forcing boundedness, but these are technical variations on the same core rejection.
