      *   *Consistency Cost:* To be consistent, we must either (1) Apply "Spheres of Justice" to Pharma/Trials (ban paid trials, nationalize plasma) OR (2) Admit organs should be market goods (legalize kidneys).
      *   *This is the winner.* It uses Walzer (common in bioethics), addresses the "patchwork" (different spheres), and forces a choice (nationalize everything or marketize everything).

  5.  **Drafting the Response:**
