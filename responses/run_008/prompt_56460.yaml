answer: |-
  Here is the reconstruction you need. It is not the standard "commodification is bad" argument, nor is it the "autonomy is king" argument. It is a political-philosophical argument about **institutional integrity**.

  ### The Principle: "Alignment of Procurement and Allocation Spheres"

  The implicit theory presupposed by the U.S. legal patchwork is this: **Bodily commodification is prohibited only when the subsequent distribution of that bodily good is governed by a public, non-market system of medical triage.**

  In political philosophy terms, this is a **Walzerian "Spheres of Justice" argument**. The law assumes that different social goods belong to different distributive spheres. When a bodily good enters a *public, need-based allocation sphere* (like the national kidney transplant queue managed by UNOS), its procurement must be decommodified to preserve the integrity of that sphere. When a bodily good enters a *private, market-based allocation sphere* (like eggs for a specific couple, plasma for pharmaceutical manufacturing, or risk for a drug company), its procurement can be commodified.

  ### Why This Steelmans the Practice Better Than Rivals

  You correctly identified that principles like "risk," "dignity," or "exploitation" fail because the exceptions swallow the rules. The "Alignment Principle" survives those counterexamples because it ignores the *nature of the body part* and focuses on the *structure of the system* surrounding it.

  1.  **It explains the Kidney Ban vs. Plasma/Egg Market:**
      *   **Kidneys:** Once a kidney is procured, it enters the UNOS waiting list. You cannot buy a spot on the list; allocation is based on medical urgency and match quality. If you could pay for the *procurement*, you would inevitably corrupt the *allocation*. The ban exists to prevent wealth from bypassing the triage queue.
      *   **Eggs/Surrogacy:** These are not allocated by a public queue. They are procured for a *specific, private recipient*. The transaction is a private contract from start to finish. There is no public triage system to corrupt, so the market is allowed.
      *   **Plasma:** While plasma products save lives, they are manufactured into drugs (albumin, immunoglobulins) and sold to hospitals. They are not allocated by a "sickest-first" national registry in the same way organs are. They are inventory. Thus, the procurement can be market-based.
      *   **Phase 1 Trials:** This is the sale of *labor and risk*, not a bodily part for transplantation. The "product" (safety data) goes to the FDA and the company, not a sick patient via a triage queue.

  2.  **It explains the "Importing Plasma" Hypocrisy:**
      *   You noted that other countries ban paid plasma but import U.S. plasma products. Under the Alignment Principle, this isn't hypocrisy; it's **boundary maintenance**. Those countries maintain a decommodified *domestic* procurement sphere to signal civic virtue, but they outsource the *market* procurement to the U.S. because the *allocation* (giving the drug to the patient) happens domestically. They don't have to watch the market transaction because it happens in a different jurisdiction. The U.S. simply admits the procurement sphere is market-based.

  3.  **It beats the "Exploitation" Argument:**
      *   If the principle were about protecting the poor from exploitation, Phase 1 trials would be banned (they disproportionately recruit low-income participants). They aren't. Why? Because the trial system is a private market sphere. The law tolerates exploitation in private spheres but forbids it in the public transplant sphere because the latter is a government-managed monopoly.

  ### The Cost of Consistency: What This Principle Forces You to Change

  If you accept this principle as the legitimate justification for the current law, you cannot stop at "there are tensions." You must push the logic to its conclusion. A consistent application of the **Alignment Principle** forces a dilemma. You have to choose one of two paths, and both require massive legal changes:

  **Path A: The Purist (Socialize the Procurement)**
  If you believe the "Public Triage" sphere must remain pure, you must expand the decommodification mandate to *anything* that feeds into a public health need.
  *   **Change 1:** **Ban Paid Phase 1 Trials.** If we prohibit selling kidneys because it exploits the desperate in a medical context, we must prohibit paying healthy volunteers for dangerous drug testing.
  *   **Change 2:** **Nationalize Plasma.** If plasma-derived medicines are essential for public health (hemophilia, immune deficiencies), the procurement should be state-run and altruistic, like blood in the UK. The U.S. should stop being the world's plasma pharmacy.
  *   **Change 3:** **Ban Paid Eggs.** If reproductive assistance is considered a medical necessity (as insurance increasingly mandates), allowing a market for eggs creates a two-tiered system where the rich get better genetic material.

  **Path B: The Market Realist (Marketize the Allocation)**
  If you believe the "Private Procurement" sphere is morally superior (because it increases supply and respects autonomy), you must apply it to organs.
  *   **Change 1:** **Legalize Kidney Sales.** If I can sell my eggs or my plasma, and the risk is comparable or lower than a nephrectomy, the ban is paternalistic.
  *   **Change 2:** **Privatize Transplant Allocation.** This is the hard pill. If kidneys are commodities, UNOS cannot allocate them by "need." They must be allocated by ability to pay or insurance coverage. You cannot have a market procurement system with a socialist allocation system; the black market will always bridge the gap. To be consistent, you must admit that rich people get kidneys faster.

  ### Is It Underdetermined?

  Yes, technically. A legal system is a coalition of compromises, not a treatise. You could argue the law is just a historical accident of the 1984 National Organ Transplant Act (NOTA) reacting to specific scandals, while the plasma and egg industries grew up in regulatory blind spots.

  **However, for the purpose of your paper, you should bet on the "Alignment Principle."**

  Why? Because it is the only theory that gives the law *dignity*. It treats the lawmakers as rational agents trying to balance two competing goods: **Supply** (which markets provide) and **Equity** (which public systems provide). The current patchwork is an attempt to have Equity in transplantation (where scarcity is absolute) and Supply in pharmaceuticals/reproduction (where scarcity is manageable).

  ### How to Use This in Your Paper

  Do not write a survey. Write a *reductio ad absurdum* or a *dilemma*.

  1.  **Thesis:** Argue that the U.S. system is not committed to "preventing commodification" but to "preventing market corruption of public triage."
  2.  **Argument:** Show how this explains the kidney/plasma/trial distinction better than "risk" or "dignity."
  3.  **Critique:** Then, attack the principle. The "spheres" are porous.
      *   *The Attack:* The U.S. *already* allows wealth to bypass triage (living donor chains, travel for transplants, insurance tiers). The "Public Sphere" is already leaky.
      *   *The Clincher:* If the sphere is already leaky, the ban on kidney sales is merely **symbolic hygiene**. It preserves the *appearance* of equity without the reality. It allows the middle class to feel morally superior ("we don't sell organs") while the rich find workarounds and the poor die on the waitlist.
  4.  **Conclusion:** If you want to keep the kidney ban (as you hinted you might), you cannot justify it with this principle alone. You must argue for **Path A** (more socialism). You must argue that we should ban paid trials and nationalize plasma to create a truly coherent "Gift Economy" of health. If you aren't willing to ban paid trials, you have no philosophical ground to ban kidney sales other than intuition.

  This gives you a sharp, argumentative edge. You aren't summarizing Sandel; you are auditing the legal system's internal logic and finding it wants to be two different things at once. Pick which one it should be.
