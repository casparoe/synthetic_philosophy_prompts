      *   *Okay, I need to pick the ONE best reconstruction.*
      *   *I will argue for:* **The Principle of "Protecting the Vulnerable from Irreversible Harm in the Context of Desperation."** (A Paternalistic Harm Principle).
      *   *Wait, the user wants to argue against the kidney ban potentially.*
      *   *Let's try the "Civic Trust" argument.* It's more political philosophy (fits a Bioethics/Philosophy dept).
      *   *Thesis:* The law presupposes that **Life-Saving Organ Allocation must remain a Sphere of Justice immune to Market Distribution.** (Michael Walzer's Spheres of Justice).
      *   *Why:* Kidneys are allocated by medical need. Money corrupts this sphere. Plasma/Eggs/Trials are not allocated by a public "need" queue in the same way. They are private procurements.
