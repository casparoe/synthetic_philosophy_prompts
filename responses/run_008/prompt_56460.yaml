      *   *Actually, I want to push the student toward a specific, provocative thesis.*
      *   *Thesis:* The US system is committed to **Protecting the Public Trust in Medical Triage.**
      *   *Argument:* Kidney transplantation relies on a public queue (UNOS). If money enters, the queue is corrupted. Plasma, eggs, and trials do not rely on a public triage queue. They are private contracts.
      *   *Cost:* To be consistent, we must either (a) Privatize kidney transplants (let the market rule) or (b) Ban payment for anything that impacts public health equity (including pharma trials that drive up drug costs).
      *   *Wait, the "Importing Plasma" point is crucial.* The user mentioned this. The principle must account for the "Not In My Backyard" aspect.
      *   *Revised Thesis:* **The Principle of "Moral Distance" in Commodification.** The US allows commodification only when the transaction is sufficiently distanced from the immediate life-or-death clinical encounter *or* when the commodity is regenerative.
      *   *No, let's go with the "Integrity of the Gift" argument but refine it.*
      *   *Best Steelman:* **The Principle of Non-Commodification of Irreplaceable Vital Organs to Prevent Coercive Inequality.**
      *   *Why it fits:* Kidneys are irreplaceable and vital. Plasma regenerates. Eggs are (biologically) replaceable (ovaries keep making them until menopause) and not vital for the *donor's* survival. Surrogacy is labor. Trials are labor/risk.
      *   *The "Egg" Counter:* Eggs are finite. But they aren't vital for the donor's life.
