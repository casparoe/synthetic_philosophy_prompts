      *   *So the distinction is:* **Vital to Donor + Irreplaceable = No Sale.** (Kidney). **Non-Vital to Donor OR Replaceable = Sale OK.** (Plasma, Eggs, Hair, Surrogacy, Trials).
      *   *This is clean.* It explains the kidney ban. It explains plasma (replaceable). It explains hair (replaceable). It explains eggs (non-vital to donor survival). It explains trials (non-vital to donor survival).
      *   *What about the "Importing Plasma" hypocrisy?* That fits under "Moral Distance." We don't see the donor.
      *   *What changes would this force?*
