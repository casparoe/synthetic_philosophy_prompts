prompt: |-
  A podcast I listen to (pop philosophy but usually pretty careful) gave this rundown of Avicenna's flying man: Avicenna asks you to imagine a person created suddenly in midair — floating, not falling — blind, and with his limbs bound so that he can't sense any of them. The claim is that this person would still be sure of his own existence despite having zero sensory input, and moreover that he wouldn't affirm the existence of his limbs at all. The podcast then said Avicenna took this to prove that the self is a simple, immaterial substance entirely separate from the body, that the flying man literally cannot even conceive of having a body, and that the whole thing is basically the cogito six hundred years before Descartes — and since the soul is immaterial, Avicenna used the flying man to argue the soul survives death. I know just enough to suspect the Descartes comparison is doing alot of work, but I can't tell which of the other claims are fair and which are stretched. Go through it claim by claim: what would a scholar who actually works on Avicenna accept, what would they want to qualify, and what did the thought experiment itself establish for him versus what he argued for with other arguments? Also, does it matter whether the setup is just that the flying man doesn't *sense* anything, or is the stronger reading — that he can't even conceive of his own limbs — something Avicenna actually commits to?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Source Material:** A pop-philosophy podcast summary of Avicenna's "Flying Man" (al-insan al-muhallaq) argument.
