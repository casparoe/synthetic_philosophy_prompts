prompt: |-
  You are a professional philosopher who works on collective action and moral responsibility, and I'd like your help diagnosing a debate rather than winning it. I'm a high school junior in an ethics elective, and the same argument has now stalled out three times in our class: once about taking a flight for a family vacation, once about eating meat, and once about voting. The pattern is always the same. Someone says their one action makes no difference—one flight doesn't measurably warm the planet, one burger doesn't cause a cow to be slaughtered, one vote almost never decides an election. Someone else replies that if everyone reasoned that way, the harm would be enormous. The first person answers that they are not everyone, they are one person, and that "what if everyone did that" is a complaint about a pattern of behavior, not a reason addressed to them. Then someone brings in the idea of being the kind of person who doesn't take part in an unjust system, and the first person says that may be fine as a matter of self-image, but it doesn't show that their burger hurt anyone. At that point we circle back to the beginning. In three months, nobody has moved an inch, even though everyone agrees on the facts about factory farming, emissions, and elections.

  I've been trying to work out what kind of disagreement this actually is, and I have a hypothesis I'd like you to take seriously but not simply agree with. Here is what I've pieced together on my own. Some defenders of individual obligations apparently use an expected-value argument: even if no single burger crosses a threshold, each purchase has some small chance of being the one that tips the supplier into ordering more animals, so you multiply the harm by the probability and get a genuine, if tiny, expected wrong. Critics respond that real supply chains don't have sharp thresholds of that kind, or else that each purchase does an imperceptible share of the harm, which raises a further question of whether imperceptible contributions can add up to something an individual is responsible for. Meanwhile, the voting case seems to run backwards from the other two: elections are occasionally decided by a handful of votes, so there the individual really can be pivotal, just rarely. So maybe we have been treating three different problems as a single debate. Or maybe the whole thing is a fight between two theories of what makes an action wrong—whether the action has to actually make a difference, or whether it can be wrong merely by participating in a collective practice that is bad overall—and neither side has noticed that this is what they are disagreeing about.

  Please diagnose the structure of the disagreement. Is it verbal, or factual, or a clash of normative starting points that people hold without being able to argue for them? Are the "my action makes no difference" side and the "what if everyone thought that way" side even answering the same question, or is one talking about consequences while the other is talking about something like consistency or fairness? Does the asymmetry with voting—where individual pivotality is real, if rare—suggest that what we call one debate is really several? And given your diagnosis, tell me what would genuinely count as progress: a distinction, a piece of information, a reformulated question—or whether we should expect this debate to stay stuck, and why. Before you answer, brainstorm the candidate diagnoses and explain why you settle on the one you do. Throughout, please keep clear about what is more or less settled among philosophers who work on these issues and what is genuinely contested, and don't present a contested view as the consensus just because it happens to be common.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Persona:** High school junior in an ethics elective. Intelligent, observant, has been tracking the debate for three months.
      *   **My Persona:** Professional philosopher specializing in collective action and moral responsibility.
      *   **Task:** Diagnose the debate structure (not win it). Evaluate the user's hypothesis. Determine if the disagreement is verbal, factual, or normative. Address the voting asymmetry. Define what "progress" looks like.
      *   **Constraints:** Brainstorm candidate diagnoses first. Explain why I settle on the chosen one. Distinguish between settled and contested philosophical ground. Do not present contested views as consensus.

  2.  **Deconstruct the Classroom Debate:**
      *   *Pattern:*
          1.  Claim: My individual act makes no difference (causal inefficacy).
          2.  Counter: Generalization would be disastrous (Kantian/Rule Utilitarian).
          3.  Rebuttal: I am not everyone (individual vs. collective).
          4.  Counter: Integrity/Complicity (being the kind of person).
          5.  Rebuttal: Self-image isn't harm (consequentialist challenge).
      *   *User's Hypothesis:*
          *   Maybe it's about expected value (probability * harm) vs. imperceptible harm.
          *   Maybe voting is different (pivotality is real but rare).
          *   Maybe it's a clash of normative theories (consequentialism vs. non-consequentialist participation/complicity).
          *   Maybe they are answering different questions (consequences vs. consistency/fairness).

  3.  **Brainstorm Candidate Diagnoses:**

      *   *Diagnosis A: Factual Ignorance.* The students don't understand the math of thresholds (e.g., how supply chains work).
          *   *Critique:* Unlikely. They agree on the facts (factory farming, emissions, etc.). The stalemate persists despite factual agreement.
      *   *Diagnosis B: Verbal Disagreement.* They are using words like "responsibility" or "difference" to mean different things.
          *   *Critique:* Partially true, but usually verbal disagreements dissolve once definitions are clarified. Here, the stalemate is robust.
      *   *Diagnosis C: Clashing Normative Frameworks.* One side is Act Consequentialist (only outcomes matter), the other is Rule Consequentialist, Kantian, or Virtue Ethicist (principles/character matter).
          *   *Critique:* Strong candidate. This explains why "harm" isn't moving the needle for the second side.
      *   *Diagnosis D: The Problem of Overdetermination/Causal Impotence.* This is a specific metaphysical problem in collective action.
          *   *Critique:* This is the technical name for the "my vote doesn't matter" problem. It's a subset of C.
      *   *Diagnosis E: Category Error (Individual vs. Collective).* They are trying to apply collective predicates to individual agents without a bridging principle.
          *   *Critique:* This is essentially the "Complicity" argument.

  4.  **Select the Best Diagnosis:**
      *   The most accurate philosophical diagnosis is that this is a **clash of normative frameworks regarding the *grounds* of moral obligation**, specifically centering on the **Problem of Causal Impotence in Collective Harm**.
      *   It is *not* merely verbal, because even with clear definitions, the intuitions diverge.
      *   It is *not* merely factual, as the user noted.
      *   It *is* a conflict between **Consequentialist/Instrumental Rationality** (does this specific act cause bad outcomes?) and **Non-Consequentialist/Expressive Rationality** (does this act align with duty/virtue/fairness regardless of outcome?).
      *   *Refinement:* I need to be careful not to say "Consequentialism is wrong." I need to show that the "no difference" argument relies on a specific view of moral mathematics that the "complicity" argument rejects.
      *   *Voting Asymmetry:* This is crucial. Voting *is* causally potent, just probabilistically low. Eating meat/flying is often causally opaque (thresholds). This suggests the debate conflates two distinct problems: **Pivotality** (Voting) vs. **Complicity/Contribution** (Meat/Climate).

  5.  **Drafting the Response (Iterative Process):**

      *   *Introduction:* Acknowledge the sophistication of the student's observation. Validate that this is a genuine, unsolved problem in philosophy (The "Inefficacy Objection").
      *   *Brainstorming Section:* Lay out the options (Factual, Verbal, Normative, Metaphysical).
      *   *Settling on the Diagnosis:* Argue it's primarily a **Normative Clash regarding the "Difference-Making Requirement."**
          *   Side A: Moral wrongness requires causal impact (Act Consequentialism leanings).
          *   Side B: Moral wrongness can arise from participation in unjust structures regardless of marginal impact (Complicity, Fairness, Kantianism).
      *   *Addressing the User's Hypothesis:*
          *   Expected Value: Mention the "Nefsky" and "Norcross" debates. It's contested whether thresholds exist.
          *   Voting: Distinguish Pivotality (Voting) from Contribution (Meat/Climate). This is a key insight.
      *   *Settled vs. Contested:*
          *   Settled: The "Paradox of Collective Action" is real. Individual causal impotence is a standard objection.
          *   Contested: Whether complicity without causal impact is sufficient for blame. Whether expected utility solves the threshold problem.
      *   *Defining Progress:*
          *   Progress isn't winning. It's distinguishing the *questions*.
          *   Distinguish: "Did I cause harm?" vs. "Did I do my fair share?" vs. "Am I complicit?"
          *   Reformulate: Move from "Does my burger kill a cow?" to "Is it fair to benefit from a system I deem unjust?"

  6.  **Refining the Tone:**
      *   Must be professional but accessible (High School Junior level).
      *   Avoid jargon where possible, or explain it (e.g., "overdetermination," "expected utility").
      *   Maintain neutrality (diagnose, don't preach).
      *   *Self-Correction on "Settled" claims:* I must be careful. Is it settled that individual meat buying doesn't kill a cow? No, that's contested (Norcross vs. others). Is it settled that voting is pivotal? Mathematically yes, practically negligible. I need to nuance this.
      *   *Key Philosophical References (Mental Check):*
          *   Derek Parfit (Five Mistakes in Moral Mathematics).
          *   Julia Nefsky (The Problem of Causal Impotence).
          *   Christopher Kutz (Complicity).
          *   Alastair Norcross (Puppies, Burgers, and Expected Utility).
          *   T.M. Scanlon (Contractualism/Fairness).

  7.  **Final Polish:**
      *   Ensure the "Brainstorming" requirement is met explicitly.
      *   Ensure the "Voting Asymmetry" is addressed.
      *   Ensure the "Progress" section is actionable for a classroom.

  8.  *(Self-Correction during drafting)*: I initially thought about calling it "Consequentialism vs. Deontology." But that's too broad. A Rule Consequentialist might side with the "everyone" argument. A Virtue Ethicist might side with the "character" argument. It's better to frame it as "Outcome-Based Responsibility" vs. "Participation-Based Responsibility."

  9.  *(Final check on constraints)*: Did I present contested views as consensus? I need to make sure I say "Many philosophers argue..." rather than "Philosophers agree..." regarding the expected value solution.

  10. **Final Structure:**
      *   Acknowledgment & Validation.
      *   Brainstorming Candidate Diagnoses.
      *   The Selected Diagnosis (Normative Grounds + Causal Impotence).
      *   Addressing the Voting Asymmetry.
      *   Settled vs. Contested Landscape.
      *   Defining Progress.

