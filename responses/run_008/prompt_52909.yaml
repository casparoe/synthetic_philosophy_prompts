answer: |-
  Colleagues, the purpose of this memo is to institute a mandatory intake procedure for every new species, system, or experimental paradigm we propose to run in this lab, designed to prevent the recurring mismatch where we ask a subject to perform a cognitive operation it is not equipped to support. We are adopting Daniel Dennett's hierarchy of creatures as our filtering mechanism, moving from Darwinian creatures that evolve only across generations, to Skinnerian creatures that learn via trial and error within a lifetime, to Popperian creatures that can test hypotheses internally before acting, and finally to Gregorian creatures that reshape their own thinking using cultural tools like language. This is not a statement on consciousness or moral worth, but a functional checklist to ensure our experimental designs match the cognitive competencies of our subjects. The procedure consists of four ordered questions that must be answered affirmatively to move up the ladder, and any proposal must state clearly which rung the subject occupies based on existing literature before a single trial is run. The first question asks whether the behavior in question is fixed by phylogeny, meaning it appears without individual learning and is resistant to modification, which would classify the system as Darwinian for that task. If the behavior can be modified by consequences, we move to the second question, which asks whether the subject requires direct reinforcement to learn the task, marking it as Skinnerian. The third question is the critical boundary for most of our work, asking whether the subject can reject a candidate action without executing it, based on an internal model of how the world works, which is the definition of Popperian competence. The fourth question asks whether the subject uses external symbolic systems to offload or restructure cognitive work, which would mark it as Gregorian. To justify moving a subject from Skinnerian to Popperian, mere speed of learning is insufficient, because a fast Skinnerian learner can look like a planner if the reinforcement schedule is dense enough. Instead, we require evidence of errorless performance on the first exposure to a novel configuration, such as a detour task where the subject must move away from a goal to reach it, or a one-trial learning scenario where the cost of error is too high to allow for sampling. Reversal learning alone does not prove Popperian status because it can be achieved through associative unlearning, but if a subject anticipates a reversal before experiencing the negative reinforcement, that counts toward internal modeling. You must be aware that the step distinguishing a fast Skinnerian from a Popperian creature is a judgment call dressed up as a check, because we cannot directly observe the internal model, only infer it from the absence of overt trial and error, and this inference relies on the assumption that we have controlled for all possible associative histories. If the intake procedure determines that a subject is Skinnerian but the proposed paradigm requires Popperian capacities, such as asking a pigeon to plan a multi-step sequence without prior shaping, the procedure outputs a stop order, meaning the paradigm must not be run as designed and must be redesigned to allow for incremental learning or to rigorously rule out associative explanations. There is one boundary where this procedure must stop and hand the question to a person rather than a checklist, which is the question of suffering. The hierarchy describes cognitive architecture, not phenomenology, so a system can be Popperian without feeling pain, or Skinnerian while suffering greatly, and any question regarding welfare, pain, or ethical treatment exits this procedure immediately and goes to the institutional ethics board.

  Let us apply this procedure now to the jay food-caching and future-planning paradigm, which serves as our flagship experiment. The intake question asks whether the jays are solving the task by simulating a future state of need or by following a chain of associations shaped by past reinforcement. If the jays have undergone months of training where caching in a specific location was consistently rewarded, the procedure flags this as a Skinnerian explanation that has not been ruled out. The behavioral finding required to justify the Popperian label would be caching in a novel location for a future need that has never been rewarded before, without any exploratory errors. If our current design allows the birds to solve the task through a history of differential reinforcement, then the procedure tells us honestly that this experiment cannot distinguish genuinely model-based planning from heavily shaped association. We must hear this conclusion because continuing to claim planning under these conditions is scientifically dishonest. We must either redesign the task to ensure naivety regarding the specific contingency or downgrade our claims from planning to sophisticated associative learning.

  Next we consider the cuttlefish puzzle box, where the live question is what would count as one-trial insight rather than rapid trial-and-error. The procedure requires video evidence of the first attempt. If the cuttlefish manipulates the mechanism correctly on the first exposure without prior probing of ineffective parts, that counts as Popperian insight because it implies an internal simulation of the mechanics. However, if the cuttlefish touches multiple parts and succeeds on the first successful manipulation after several failed attempts within the same session, that is rapid Skinnerian learning, not insight. The observation that would settle it is the latency to first contact with the correct mechanism compared to incorrect mechanisms. If the latency to the correct part is near zero and the latency to incorrect parts is high, it suggests an internal model. If the cuttlefish samples randomly and speeds up over trials, it is trial-and-error. The procedure mandates that we do not publish this as insight unless the first attempt is errorless regarding the mechanism's logic.

  Third, we address the robotics group's language-model robot, which narrates its plan out loud before executing it. The procedure classifies this system as a candidate Popperian creature because it generates text describing potential moves and selects one without physically executing the failed options, effectively letting its hypotheses die in its stead. Furthermore, because it uses language, which is the paradigm Gregorian tool, to structure its own reasoning, the procedure argues it is arguably a Gregorian system functionally. However, you must be explicit that this reading outruns what the hierarchy licenses regarding experience. The hierarchy licenses claims about competence and information processing, not consciousness. To say the robot is Popperian is to say it functions as if it has an internal model, not that it experiences the planning. We must not mistake the functional classification for an ontological claim about sentience. The procedure allows us to say the robot is Gregorian in structure but remains silent on whether anything is experienced, and any team member asserting the robot feels frustration or understanding is violating the boundary of this tool.

  Finally, I must tell you where the ladder breaks as a description of reality, because not all systems sit at a single rung. A honeybee colony is a prime example where the individual bees may operate as Darwinian or simple Skinnerian creatures with rigid response protocols, while the colony as a whole, through the interaction of scouts and dancers, behaves like a Popperian creature that tests multiple site locations against internal criteria before committing. The procedure should say when it meets such a case that the unit of analysis must be defined before the rung is assigned, and we must not mistake the ladder's failures for the animal's limitations. Similarly, an animal whose edge is dense memory rather than an internal model may solve problems that look like planning but are actually retrieval of past episodes, which blurs the line between Skinnerian and Popperian. When the procedure meets such a case, it must output a note that the hierarchy is a heuristic, not a taxonomy, and that the experiment must be designed to dissociate memory retrieval from model-based simulation. If we ignore these exceptions, we risk forcing complex biological systems into simple boxes and concluding falsely that they lack capacities they simply express differently. This intake procedure is not a truth machine but a safeguard against our own tendency to anthropomorphize or under-specify, and it is now mandatory for all new proposals effective immediately.
