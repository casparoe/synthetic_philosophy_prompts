answer: |-
  This is a classic problem in the philosophy of law and ethics. You are essentially trying to reconstruct the boundaries of **autonomy**. Your gut is tracking a distinction between *conditions that undermine the ability to choose* and *conditions that just make the choice hard or regrettable.*

  Your current principle ("Material lie," "No acceptable option," "Competence") is the standard legal starting point, but as you've noticed, it's too blunt. "Materiality" is subjective, and "No acceptable option" applies to the landlord case just as much as the mugger case.

  Here is a refined principle that fits your verdicts, explains the outliers, and handles the new case.

  ### The Principle: "Integrity of the Transaction"

  Consent is invalid when the **autonomy of the agent is bypassed** regarding the **essential nature of the act**, or when the agreement is procured by **wrongful control** rather than **hard choices**.

  To make this work, we need to split your three categories (Lies, Threats, Competence) into sharper tools.

  #### 1. Deception: Essence vs. Inducement
  Not all lies invalidate consent. The distinction is between lying about *what is happening* (Essence) and lying about *why you should do it* (Inducement).

  *   **STI Lie:** Invalid. This changes the physical risk profile of the act itself. You agreed to safe sex; you got unsafe sex. The *nature* of the act changed.
  *   **Married Lie:** Invalid. In many ethical frameworks, sex carries an implicit (or explicit) assumption of exclusivity or availability. Lying about marital status changes the *social and relational nature* of the act (adultery vs. affair). It implicates third-party rights.
  *   **Age Lie (6 years):** Valid (assuming both are adults). While age is a preference, among consenting adults, it is generally treated as an attribute of the *person*, not the *act*. Unless you have a specific "age gap" clause, lying about being 30 instead of 36 is fraud in the inducement. It makes you want to do it, but it doesn't change *what* "it" is.
  *   **Cooking Lie:** Valid. Trivial attribute. Pure inducement.

  **Why Married lies invalidate but Age lies don't:**
  It comes down to **Rights and Risk**. Marital status involves a legal contract with a third party and implies a specific relational status (single/available) that is often a precondition for the sexual contract. Age (among adults) is a demographic statistic. The married lie breaches a duty of disclosure regarding the *structure* of the relationship; the age lie breaches a preference regarding the *partner*.

  #### 2. Coercion: Wrongful Threats vs. Hard Bargains
  Your intuition stumbles on the Landlord vs. Mugger because both leave you with "no acceptable option." The difference is not the *pressure*, but the *right to apply it*.

  *   **Mugger:** Invalid. The threat is **wrongful**. They have no right to break your arm. They are creating the danger to force compliance.
  *   **Landlord:** Valid. The threat is **rightful**. They have a right to evict for non-payment. They are not creating the danger; the contract and your inability to pay are. Consent given to avoid a *lawful* negative consequence is still consent, even if the choice is terrible.
  *   **Boss:** (Your flip-flop). This is the hardest case.
      *   *Verdict:* If the boss implies retaliation ("go out with me or you're fired"), it is **Invalid** (Wrongful threat). If the boss simply asks and the pressure is purely internal ("I'd better say yes to get ahead"), it is technically **Valid**, but ethically fraught.
      *   *Advice:* Throw out the flip-flop. Lean towards **Invalid** in a direct reporting line. Why? Because the boss controls the "lawful" threat (firing/promotion). When the person asking holds the power to punish refusal, the "choice" is structurally compromised. It blurs the line between offer and threat.

  #### 3. Competence: Risk Magnitude x Impairment
  Capacity isn't a binary switch; it's a sliding scale relative to the risk.

  *   **Drunk Tattoo:** Invalid. High impairment + Permanent Bodily Modification. The risk is irreversible and physical.
  *   **Drunk Loan:** Valid (borderline). Moderate impairment + Financial Risk. Financial risk is reversible (you can declare bankruptcy, pay it back later). Bodily integrity is weighted higher than financial integrity.
  *   **Advice:** Keep these verdicts, but acknowledge the Loan is riskier than you think. The principle here is **Bodily Integrity > Financial Interest**.

  #### 4. Context: Normative Frameworks
  *   **Stage Combat:** Valid. Why? Because there is a **shared normative framework**. Both parties understand the "world" they are in. In that context, "swing the knife" means "simulate violence," not "commit assault." The mugger operates outside a consensual framework; the actors operate inside one.

  ---

  ### The New Case: "The Jealous Ex"

  **Scenario:** Someone agrees to sleep with a person who told them, plainly and up front, that they're only doing it to make an ex jealous.

  **Verdict:** **Consent is Valid.**

  **Why it smells off:**
  Your nose is tracking **Morality**, not **Consent**.
  *   **Consent** is about *authority*: Do you have the right to decide what happens to your body? Yes. Did you understand what was happening? Yes. Were you forced? No.
  *   **Morality** is about *respect*: Is this person treating you as an end in yourself, or merely as a tool?

  In this case, you are being **instrumentalized**. You are being used as a prop. This is dishonorable, unkind, and perhaps emotionally manipulative, but it does not violate your *agency*. You possessed all the information, you had the capacity, and there was no wrongful threat. You autonomously chose to be a means to their end.

  **Principle Check:** This fits the "Integrity of the Transaction." You knew the nature of the act (sex) and the motivation (jealousy). There was no fraud in the essence. The "smell" is the difference between a *valid contract* and a *good friendship*.

  ---

  ### Which Verdicts to Throw Out?

  To make your principle robust, I recommend adjusting two of your gut verdicts:

  1.  **The Boss Case:** Stop flip-flopping. Classify this as **Invalid** (or at least "Presumptively Invalid").
      *   *Reasoning:* Power dynamics distort the "rightful threat" calculation. A boss firing you is "lawful," but using the prospect of firing to extract sex is an abuse of that power (quid pro quo harassment). The "choice" is not free because the power imbalance makes the cost of refusal disproportionately high *specifically because of the relationship*.
  2.  **The Loan (3 Drinks):** Be careful here.
      *   *Reasoning:* If they are drunk enough to agree to a tattoo (invalid), they might be drunk enough to cosign a loan. However, since you distinguished the *level* of drunkenness (3am wrecked vs. 3 drinks in), keep the verdict but refine the principle: **Capacity is domain-specific.** Someone might be fit to spend $50 but not to mortgage a house. Your gut correctly identified that the tattoo required a higher bar of sobriety than the loan.

  ### Summary of the Refined Principle

  Consent is invalid if:
  1.  **Deception:** The lie concerns the **physical risks** or **relational rights** inherent to the act (STI, Marriage), not just the attributes of the partner (Age, Cooking).
  2.  **Coercion:** The pressure comes from a **wrongful threat** (Mugger, Abusive Boss), not the enforcement of a **pre-existing right** or natural consequence (Landlord, Market forces).
  3.  **Capacity:** The impairment is sufficient to compromise judgment regarding the **magnitude of the risk** (Tattoo > Loan).
  4.  **Context:** The interaction occurs outside a **shared normative framework** where such acts are understood differently (Stage Combat vs. Street Fight).

  **On the Jealous Ex:** Your nose is right, but it's smelling **disrespect**, not **non-consent**. You can validly consent to be used. That is the tragic freedom of autonomy.
