          *   *Contextual Restriction:* Limiting Adams' Thesis to the context of utterance. This avoids Lewis but makes the semantic value context-dependent. Is it unfalsifiable? It risks becoming a "shifty" semantics where truth conditions change so much they explain nothing.
          *   *Relativism:* Truth relative to an assessor. Saves the probability link but abandons classical truth conditions.
