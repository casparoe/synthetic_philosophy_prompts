          *   *Embedding (The Gibbard/McGee Problem):* If $A \to C$ is a proposition, it should embed freely. But "If (if A then B), C" is notoriously difficult for truth-conditional semantics to handle without violating intuition or logic (Import-Export).
      *   **Tier 2: The Serious/Structural Threats.**
          *   *Indicative vs. Subjunctive:* If the truth conditions are just world-sets, why does mood matter for probability? (e.g., Oswald didn't kill Kennedy vs. If Oswald hadn't killed Kennedy...). This suggests the semantic content isn't just a proposition in the standard sense.
          *   *Modus Ponens Failures:* McGee's examples. If it's a standard proposition, MP should hold. It seems to fail in complex embeddings.
      *   **Tier 3: The Awkward/Manageable Threats.**
          *   *Negation:* "It is false that if A, C." Truth-conditionalists say this means $A \land \neg C$. But speakers often hesitate. This is pragmatic noise, not necessarily semantic death.
