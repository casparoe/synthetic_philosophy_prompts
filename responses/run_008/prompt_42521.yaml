answer: |-
  You are holding a position that is philosophically attractive because it preserves classical logic and aligns with our intuitive handling of uncertainty, but it is technically precarious. You are essentially advocating for a **Truth-Conditional Probabilism**: the view that conditionals express propositions *and* that their probability is given by the conditional probability of the consequent given the antecedent (Adams' Thesis).

  David Lewis's 1976 triviality results are indeed the elephant in the room, but you are right to suspect that they rely on specific assumptions about the algebra of propositions and the stability of probability functions. However, dismissing Lewis as attacking a "strawman" is dangerous. The problem has mutated and strengthened since the 70s.

  Here is the map of where your view is exposed, ranked from genuinely fatal to merely awkward, followed by an assessment of your escape routes.

  ### 1. The Lethal Threats (Loss of Sleep Required)

  **A. Generalised Triviality Results (Hájek & Bradley)**
  Lewis's original result assumed the equation $P(A \to C) = P(C|A)$ held for *all* probability functions in the space. Your defence is that it need only hold for the *current* belief state.
  *   **The Objection:** Alan Hájek and Richard Bradley have since generalised these results. They show that even if you restrict the class of admissible probability functions, structural constraints on the propositions themselves often force triviality. If your conditional proposition $A \to C$ is to sit in a Boolean algebra with ordinary propositions (so it can be negated, conjoined, etc.), and you maintain the probability equation, the algebra collapses.
  *   **Why it hurts:** You cannot simply say "I restrict the probability functions." Unless you also restrict the *logic* governing the propositions (abandoning classical Boolean algebra), the triviality returns. To save the view, you must admit that conditionals do not obey the standard laws of logic (e.g., they might not be distributive). This undermines the main motivation for being a truth-conditionalist (preserving classical logic).

  **B. The Embedding Problem (Gibbard & McGee)**
  If conditionals are standard propositions, they should embed freely into larger sentences just like "It is raining."
  *   **The Objection:** Conditionals behave notoriously badly when embedded, particularly in the antecedent of another conditional ("If, if A then B, then C") or under attitude verbs ("John believes that if A, B").
  *   **The Specific Damage:** Vann McGee provided counterexamples to Modus Ponens involving nested conditionals. If your view is truth-conditional, Modus Ponens should be valid. If McGee is right that we have intuitive counterexamples, your semantics predicts validity where intuition suggests failure. Furthermore, the "Import-Export" principle (equating "If A, then if B, C" with "If A and B, then C") is valid for standard truth conditions but leads to triviality results when combined with Adams' Thesis.
  *   **Why it hurts:** This suggests that the semantic value of a conditional is not a proposition that can be operated on by standard logical connectives. It looks more like an operator or a speech act.

  ### 2. The Serious Threats (Structural Damage)

  **A. The Indicative/Subjunctive Divide**
  *   **The Objection:** Consider "If Oswald didn't kill Kennedy, someone else did" (Indicative) vs. "If Oswald hadn't killed Kennedy, someone else would have" (Subjunctive). We take the first to be true (based on evidence) and the second to be false (based on conspiracy theories).
  *   **Why it hurts:** If both are truth-conditional propositions about world-sets, what is the semantic difference? Usually, we say indicatives quantify over epistemically accessible worlds and subjunctives over metaphysically close worlds. However, if you accept Adams' Thesis for indicatives, you run into trouble. The probability of the subjunctive often *does not* equal the conditional probability in the same way. If the semantic machinery is the same (propositions), why does the probability link hold for one mood and not the other? This suggests the "proposition" expressed by the indicative is not a standard truth-condition but something more ephemeral.

  **B. Bradley's Representation Theorem**
  *   **The Objection:** This is a more sophisticated cousin of Lewis's result. It suggests that if you want to represent agents' preferences and beliefs involving conditionals, you cannot simultaneously maintain that conditionals have truth conditions *and* that they obey the Ramsey Test (accept a conditional if you would accept the consequent upon learning the antecedent).
  *   **Why it hurts:** It forces a choice: keep the truth conditions and abandon the intuitive link to belief revision, or keep the link to belief revision and abandon truth conditions. You are trying to keep both.

  ### 3. The Manageable Threats (Awkward but Survivable)

  **A. Negation**
  *   **The Objection:** What is the negation of "If A, C"? The truth-conditionalist says it is "A and not-C". But speakers often say, "It's not the case that if A, C," without committing to A being true.
  *   **The Defence:** You can argue this is pragmatic. When a speaker denies a conditional without asserting the antecedent, they are denying the *assertability*, not the truth conditions. This is a standard Gricean move. It's annoying, but it doesn't break the semantics.

  **B. Belief Revision Constraints**
  *   **The Objection:** You mentioned Lewis assumes the equation holds across *all* belief revisions.
  *   **The Defence:** You are on firmer ground here. If you claim the equation holds only for the *current* probability function (at the context of utterance), Lewis's original proof does not apply. This is the most common defence (adopted by contextualists like Weatherson). It is not fatal, provided you can explain why the equation holds *now* without explaining why it holds *later*.

  ### 4. Assessing the Escape Routes

  You asked if restricting the probability equation to the context of utterance or making truth relative to an assessment standard saves the view or qualifies it into vacuity.

  **The Contextualist Escape:**
  If you say "$A \to C$ expresses a proposition, but which proposition depends on the context (specifically, the probability function of the speaker)," you avoid Lewis's triviality.
  *   **The Cost:** You have changed the nature of the proposition. It is no longer a stable set of possible worlds; it is a function from contexts to sets of worlds.
  *   **Is it Vacuous?** It risks being unfalsifiable. If the truth conditions shift whenever the probability shifts, it becomes difficult to say two people disagree. If I say "If it rains, it pours" (high probability) and you say "No, if it rains, it doesn't pour" (low probability), are we contradicting each other? On a strict contextualist view, we might just be asserting different propositions. This kills the account of disagreement, which is a central job of semantics.
  *   **Verdict:** It saves the truth-conditional claim but sacrifices the stability of content. It is a viable semantic thesis, but it is a *relational* one, not an absolute one.

  **The Relativist Escape:**
  If you say the truth is relative to an assessor's probability function (MacFarlane style).
  *   **The Cost:** You abandon the idea that a sentence is simply true or false *simpliciter*.
  *   **Verdict:** This is arguably more honest than contextualism for your view. It admits that the "truth" of the conditional is inextricably linked to the epistemic state of the evaluator. However, many philosophers argue that once you go relativist, you have conceded the main point to the non-truth-conditionalists (who say conditionals are merely expressions of epistemic states). You are keeping the label "truth-conditional" but the content looks suspiciously like "acceptability-conditional."

  ### 5. Predictions vs. Rivals

  What does your view predict that the rivals (Expressivists like Dorothy Edgington or Allan Gibbard) do not?

  **1. Logical Validity in Embeddings:**
  *   **Your View:** Predicts that conditionals should obey classical logic (e.g., Law of Excluded Middle: "Either if A, C or if A, not-C" should be a tautology).
  *   **Rival View:** Predicts this sentence might be unacceptable or lack a truth value, because one cannot be in a position to assert either disjunct.
  *   **Test:** Check intuitive acceptance of excluded middle for conditionals. Speakers often find "Either if it rains I'll be happy or if it rains I'll be sad" odd, unless they know they will be happy or sad regardless of the rain. If speakers reject the tautology, your view is under pressure.

  **2. Betting and Assertion:**
  *   **Your View:** Predicts we should be willing to bet on conditionals as propositions. If I bet on "If A, C", I win if $A \land C$, I lose if $A \land \neg C$, and the bet is void if $\neg A$ (De Finetti table).
  *   **Rival View:** Suggests betting is on the *conditional event*, not a proposition.
  *   **Test:** This is actually where your view shines. The De Finetti table aligns perfectly with Adams' Thesis. Expressivists struggle to explain why betting behaviour aligns so neatly with conditional probability if there is no proposition being bet on. This is your strongest empirical foothold.

  **3. Disagreement:**
  *   **Your View:** Predicts genuine contradiction between "If A, C" and "If A, not-C".
  *   **Rival View:** Might treat these as incompatible commitments rather than contradictory truths.
  *   **Test:** In dialogue, do speakers treat the denial of a conditional as contradicting the original assertion? Generally, yes. This supports you.

  ### 6. The Verdict: Where to Worry

  You should lose sleep over **Generalised Triviality** and **Embedding**.

  The triviality results are not merely attacking an idealisation; they are attacking the compatibility of Boolean logic with the probability equation. To save your view, you must either:
  1.  **Abandon Classical Logic:** Admit that conditionals form a non-Boolean algebra (e.g., a quantum logic or three-valued logic). This is a high price for a truth-conditionalist.
  2.  **Accept Contextualism/Relativism:** Admit that the proposition expressed is not stable. This makes the view less robust but logically consistent.

  **The "Strawman" Defence:**
  Your intuition that Lewis attacks a strawman is partially correct regarding *belief revision*, but incorrect regarding the *algebra of propositions*. Even if you fix the probability function, if the conditional proposition exists within the same algebra as the antecedent and consequent, triviality looms.

  **Final Advice:**
  If you wish to maintain this position, do not claim that $P(A \to C) = P(C|A)$ is a necessary truth holding across all contexts. Claim it is a **norm of assertion** relative to a context. Concede that the *proposition* expressed is context-sensitive (dependent on the salient probability function). This moves you towards a **Contextualist Truth-Conditionalism**.

  This saves you from Lewis, but you must accept the cost: you are no longer saying "If A, C" has a fixed truth condition like "Snow is white." You are saying its truth condition is partially constituted by the speaker's epistemic state. If you are willing to pay that price, the view is tenable. If you demand fixed, context-independent truth conditions *and* the probability equation, the view is mathematically untenable.
