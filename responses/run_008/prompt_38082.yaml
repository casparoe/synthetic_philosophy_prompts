  3. This is an accurate summary of the Inquisitor's stated mission, as he claims the Church corrected Christ's mistake by accepting the devil's counsel to provide universal happiness. A careful reader recognizes the novel frames this correction as a tragic betrayal of true Christianity.
  4. This is a simplification, because the Inquisitor claims he and his elite suffer willingly out of a pitying love for the weak masses rather than pure contempt. A careful reader notes he believes he is sacrificing his own soul to save humanity from the terror of free choice.
