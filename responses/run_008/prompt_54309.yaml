      *   *Best Suggestion:* Clarify the "offstage" element. The thesis says the manipulator's view is "fixed offstage." This is a great image. The essay should lean harder into *where* the decision is actually made. Is the decision made *in* the room (persuasion) or *before* the room (manipulation)? This strengthens the structural argument over the psychological one.

