      *   *Verdict:* It feels fresh *in application*, even if the roots are Kantian/Habermasian. The specific framing of "bidirectional revisability" is a concrete operationalization of "treating as an end." It shouldn't read as derivative because it moves away from abstract "rational agency" to concrete "exchange structure."
