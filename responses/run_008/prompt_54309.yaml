      *   *Goal:* Find cases where the thesis misclassifies.
      *   *Case A: Legitimate Persuasion without Back-talk.*
          *   *Idea:* A dying parent's advice. The child can't really argue back (time, respect, finality). Is it manipulation? No, usually seen as wise counsel.
          *   *Idea:* Mass communication (billboard, pamphlet). The prompt mentions this as an objection, but I need to treat it as a counterexample to the *criterion's work*. If I put up a billboard saying "Vote Yes," I can't revise my view based on the billboard's response. Does the criterion call this manipulation? Yes, technically, because it's unidirectional. But is all advertising/advocacy manipulation? That seems too broad.
