answer: |-
  This is a bold and pedagogically sound approach. You are essentially gamifying the method of *reflective equilibrium*. By forcing students to defend consistency, you make the philosophical work (finding the principle) a prerequisite for winning, rather than an abstract lecture topic.

  However, 75 minutes is extremely tight for this. If the game drags, you lose the debrief, and the lesson fails. Below is a streamlined design, a scoring mechanism that incentivizes deep principles over ad-hoc rules, and a candid assessment of the risks.

  # Lesson Plan: The Consistency Game

  **Class Size:** 14 Students (2 Teams of 7)
  **Time:** 75 Minutes
  **Materials:** Whiteboard, Index Cards (pre-printed templates), Voting Cards (Green/Red or Yes/No).

  ## Part 1: Setup & Rules (10 Minutes)
  **Do not mention Double Effect.** Tell them this is a logic and consistency game.

  1.  **Divide:** Team A (Architects) vs. Team B (Judges).
  2.  **The Goal:**
      *   **Team B (Judges):** Maintain a single "Constitution." You want to vote on cases without contradicting your previous votes or needing to add new rules to your Constitution.
      *   **Team A (Architects):** Write pairs of scenarios that force Team B to either contradict themselves or add a new, clunky rule to their Constitution.
  3.  **The Constraint (The Ingredient Menu):** To prevent sci-fi arms races, every scenario must use this template:
      *   *Threat:* [Runaway Trolley / Deadly Gas / Viral Infection]
      *   *Action:* [Pull Lever / Push Person / Administer Drug / Do Nothing]
      *   *Outcome:* [1 Dies, 5 Saved / 1 Dies, 0 Saved / 5 Dies, 0 Saved]
      *   *Knowledge:* [Agent knows X will die / Agent hopes X survives]
  4.  **Scoring:**
      *   Team B starts with **10 Consistency Points**.
      *   Team A presents a **Pair** (Case 1 & Case 2).
      *   Team B votes Permissible/Impermissible on Case 1, then Case 2.
      *   **If Verdicts Match (Yes/Yes or No/No):** Team B keeps points. Team A gets 0.
      *   **If Verdicts Split (Yes/No):** Team B loses 1 Point. Team A gets 1 Point.
      *   **The Appeal:** After a Split Verdict, Team B may propose a **Distinguishing Rule** (e.g., "Pushing is worse than pulling").
          *   If Team A accepts the rule as "not gerrymandered," Team B regains the point.
          *   If Team A challenges it (and Instructor agrees it's ad-hoc), the point stands lost.
      *   **The Trap:** If Team B proposes a Rule in Round 1, but violates it in Round 2, they lose **2 Points**.

  ## Part 2: Gameplay (45 Minutes)
  **Round 1 & 2 (20 mins):** Team A writes, Team B judges.
  **Swap (5 mins):** Teams switch roles. Team B now writes, Team A judges. (Note: Team A inherits Team B's Constitution rules, or starts fresh? **Start fresh** to avoid confusion, but keep the scoreboard running).
  **Round 3 & 4 (20 mins):** Team B writes, Team A judges.

  *Instructor Role:* You are the Supreme Court. You enforce the "Ingredient Menu" strictly. If a case introduces a new variable (e.g., "The one person is the Judge's mother"), reject it. It must be a *structural* difference, not an emotional one.

  ## Part 3: The Debrief (20 Minutes)
  This is where you teach the content. Do not lecture; interrogate their Constitution.

  **Step 1: Map the Rules (5 mins)**
  Write every "Distinguishing Rule" they saved on the board.
  *   *Likely outputs:* "Don't touch people," "Don't kill to save," "Intentions matter," "Side effects are okay."
  *   Group them. You will likely see two clusters emerging: **Means vs. Side Effects** and **Intention vs. Foresight**.

  **Step 2: Introduce the Doctrine (5 mins)**
  Now you lecture, but briefly. "You just invented the Doctrine of Double Effect (DDE)."
  Define the four conditions of DDE using *their* language:
  1.  The act itself must be good or neutral (You said: "Pulling lever is okay").
  2.  The bad effect must not be the means to the good (You said: "Can't use his death to stop the trolley").
  3.  The intention must be only the good effect (You said: "I didn't *want* him to die").
  4.  Proportionality (5 lives > 1 life).

  **Step 3: Stress Test the Doctrine (10 mins)**
  This is where you introduce the cases they *didn't* write but need to know.
  *   **The Transplant Case:** Ask them to apply their "Intention" rule. "Surgeon intends to save 5, doesn't want 1 to die." Why is it impermissible?
      *   *Goal:* Force them to refine the **Means** condition. In Transplant, the death is the *means*. In Trolley, it's a *side effect*.
  *   **The Loop Case:** (Trolley loops back; hitting the fat man stops it).
      *   Ask: "Is the death a means or side effect here?"
      *   *Goal:* Show the pressure point. DDE struggles here. The death *is* the means (stopping the trolley), but intuitively it feels like Switch. This shows the limits of the distinction they just built.

  ---

  # Predicted Failure Modes (And Fixes)

  **1. The "Variable Soup" Problem**
  *   **What happens:** Team A writes Case 1 (Lever, 1 dies) and Case 2 (Push, 5 die). Team B splits the verdict. Team A claims victory.
  *   **Why it fails:** You don't know *which* variable caused the split (the action? the outcome?).
  *   **Fix:** Enforce **Minimal Pairs**. Team A must certify that only *one* ingredient from the menu changes between Case 1 and Case 2. If they change Action AND Outcome, the round is void.

  **2. The "Gerrymandered Principle" Problem**
  *   **What happens:** Team B splits a verdict. To save their point, they say: "It's impermissible if the person is on the right side of the track."
  *   **Why it fails:** This stops the philosophical inquiry.
  *   **Fix:** You (Instructor) have veto power. A rule must be **Generalizable**. Ask: "Would you accept this rule if the positions were swapped?" If not, it's ad-hoc.

  **3. The "Utilitarian Steamroller"**
  *   **What happens:** Team B decides early on: "We save the most lives, period." They vote Permissible on everything. Team A scores 0 points. Game stalls.
  *   **Why it fails:** DDE never emerges because they reject non-consequentialist intuitions.
  *   **Fix:** Incentivize Team A. Tell Team A privately: "If Team B goes full Utilitarian, your job is to write the **Transplant Case**." If Team B says Permissible to Transplant, *Team B loses 5 points instantly* (The "Monster Clause"). This forces them to acknowledge a constraint beyond pure numbers.

  **4. Time Creep**
  *   **What happens:** Debating the scoring takes 20 minutes.
  *   **Fix:** Hard stop. Use a timer. If a round isn't done in 10 minutes, it ends. Sacrifice a round rather than the debrief.

  ---

  # What This Game Cannot Reproduce

  Be honest with yourself (and eventually the students) about the limitations of this exercise.

  **1. The Metaphysical Weight of "Intention"**
  The game treats intention as a reportable state ("What did you mean to do?"). In real DDE debates, intention is a structural feature of the action, not just a mental hope. Students will conflate "I didn't want him to die" with "His death wasn't part of the plan." The game makes it hard to distinguish *psychological* intent from *structural* intent without you intervening.

  **2. The Normative "Why"**
  The game generates *consistency*, but not *justification*. Students will converge on DDE because it saves their points, not because they believe it is morally true. They might leave thinking DDE is just a trick to avoid losing points, rather than a serious account of moral agency. You must explicitly address this in the closing: "You used DDE to win. But should we use it to live?"

  **3. The "Close Call" Nuance**
  DDE is most useful in gray areas (e.g., palliative sedation, collateral damage in war). The Trolley cases are caricatures. The game will likely produce bright-line rules ("Never push") that don't translate well to the messy real-world cases where DDE is actually applied.

  # Instructor Cheat Sheet: The "Trap" Cases
  Keep these in your back pocket if Team A is struggling to trip up Team B.

  *   **If Team B is too Consequentialist:** Suggest the **Transplant** case to Team A. (Surgeon kills 1 healthy to save 5 patients).
  *   **If Team B is too Deontological:** Suggest the **Bridge** case vs. **Switch** case. (Why is pushing worse than pulling if the outcome is identical?)
  *   **If Team B relies on "Touching":** Suggest the **Remote Lever** case. (Pushing a button that drops a person vs. pushing a person).
  *   **If Team B relies on "Means":** Suggest the **Loop** case. (Trolley hits man, stops, saves 5. Is the hit a means?)

  # Final Advice
  Run this with high energy. You are the referee, not the sage. When they argue about scoring, lean in: *"Is that rule generalizable? Or is it just saving your skin?"* That question is the entire seminar.
