prompt: |-
  I'm teaching a small intro ethics seminar (14 students, one 75-minute session) and next week we hit the doctrine of double effect and the trolley literature. I don't want to lecture at them about means vs. side effects and then show them the standard cases, because they'll just nod along. Instead I want to run an adversarial game where the distinction shows up as something they have to invent to save themselves. Here's the rough idea I had, and I'd like you to design it properly.

  Split the class into two teams. Team A are "case writers": each round, they secretly write a pair of short scenarios (2-3 sentences each) that they predict Team B will judge inconsistently -- e.g., saying "permissible" to one and "impermissible" to the other. Team B members vote individually on both scenarios, and Team A scores a point if the majority verdicts come out inconsistent with how Team B voted on any earlier pair. No real money, but I want some token/score scheme that rewards Team B for consistency across the whole game, not just per-round accuracy, and rewards Team A for genuinely tripping them up rather than for writing maximally weird cases. Roles should swap halfway. The scenarios should be constrained somehow (maybe a fixed menu of ingredients like "a runaway trolley OR a hospital OR a lever") so it doesn't just become a sci-fi arms race.

  Then I need a real debrief: how to map the moments where Team B, in their scramble to stay consistent, converges on something like the means/side-effect distinction (or the intention/foresight distinction, or "would the plan still work if the harmed person were absent?" style tests) onto the actual doctrine of double effect and its known pressure points. I'm expecting the loop-track style cases and the transplant/surgeon contrast to come up naturally -- build in how to handle those. Also tell me honestly what will predictably go wrong the first time I run this (I'm guessing: case pairs that differ in five ways at once so nothing is isolated, and Team B inventing some ugly gerrymandered principle that "works" but nobody would defend), and what feature of the real philosophical debate the game just cannot reproduce no matter how I run it.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **Context:** Intro ethics seminar, 14 students, 75 minutes.
      *   **Topic:** Doctrine of Double Effect (DDE) and Trolley Problem literature.
      *   **Goal:** Avoid standard lecture/case presentation. Use an adversarial game where students *invent* the distinction to save themselves (consistency).
      *   **Mechanism:** Two teams (Case Writers vs. Judges). Writers try to force inconsistent judgments. Judges try to remain consistent. Roles swap halfway.
      *   **Constraints:** Need scoring system, scenario constraints (ingredients), debrief strategy (mapping to DDE), prediction of failure modes, and limitations of the game.
      *   **Tone:** Practical, pedagogical, honest about limitations.

  2.  **Deconstruct the Game Mechanics:**
      *   *Time:* 75 minutes is tight. Lecture + Game + Debrief needs careful timing.
      *   *Teams:* 14 students = 2 teams of 7.
      *   *Rounds:* Need enough rounds to generate data but not drag on. Maybe 3 rounds per side (6 rounds total)? Or 2 rounds per side to save time for debrief? Let's aim for 2 rounds per side (4 total) to ensure enough debrief time.
      *   *Scoring:*
          *   Team A (Writers): Point if Team B is inconsistent *with their own previous verdicts*.
          *   Team B (Judges): Points for consistency. But how to measure "consistency" in real-time? If they vote Permissible/Impermissible, inconsistency is easy to spot *if* the cases are relevantly similar. But the Writers want them to be *relevantly different* in the Writers' eyes but treated differently by Judges.
          *   *Refinement:* The prompt says "Team A scores a point if the majority verdicts come out inconsistent with how Team B voted on any earlier pair." This implies a global consistency check.
          *   *Problem:* If Team B says "Yes" to Case 1 and "No" to Case 2, Team A gets a point *only if* Team B can't justify the difference. But in a game, we need immediate scoring.
          *   *Better Mechanism:* Team B must state a *rule* after every round. Team A wins the round if they can show the new verdict violates the stated rule OR if the new verdict contradicts a previous verdict without a new rule.
          *   *Actually, let's stick closer to the prompt's intuition:* The prompt wants the distinction to *emerge*. If Team B just votes, inconsistency is subjective unless the cases are minimal pairs.
          *   *Revised Mechanism:* Team B votes. Then they must articulate the *principle* that distinguishes their Vote 1 from Vote 2. Team A gets a point if Team B cannot articulate a principle that holds across all previous rounds.
          *   *Wait, simpler:* Team A submits a pair (Case X, Case Y). Team B votes on X, then Y. If Vote(X) $\neq$ Vote(Y), Team A gets a point *unless* Team B can cite a principle from a previous "Constitution" they are building. If Vote(X) = Vote(Y), Team B gets a point (consistency).
          *   *Best approach for Intro Ethics:* Keep it visceral. Team A tries to get a "Split Verdict" (one Permissible, one Impermissible) on cases that *look* similar. Team B tries to avoid Split Verdicts unless they can justify them.
          *   *Let's refine the scoring:*
              *   Team A (Architects): Want to force a Split Verdict (Yes/No) on a pair they claim is structurally identical.
              *   Team B (Judges): Want to maintain a consistent "Constitution" (a set of rules).
              *   Scoring: If Team B gives a Split Verdict, Team A gets 1 point. *However*, Team B can "Appeal" by proposing a distinguishing rule. If the class/instructor accepts the rule as non-gerrymandered, Team B keeps the point.
              *   *Actually, the prompt asks for specific scoring:* "Rewards Team B for consistency across the whole game... rewards Team A for genuinely tripping them up."
              *   *Solution:* Team B starts with 10 Consistency Points. Every time they issue a Split Verdict (Yes/No) on a pair, they lose 1 point. *Unless* they successfully identify the "Morally Relevant Difference" (MRD). If they identify an MRD that holds up to scrutiny, they keep the point. Team A gets 1 point for every point Team B loses.

  3.  **Designing the Constraints (The "Ingredients"):**
      *   To prevent sci-fi arms races, limit the variables.
      *   *Action:* Pulling a lever, Pushing a person, Administering drug, Doing nothing.
      *   *Outcome:* 1 dies / 5 saved, 1 dies / 0 saved, 5 die / 0 saved.
      *   *Intent:* Save the 5, Kill the 1, Save the 1.
      *   *Constraint:* Must use standard "Trolley/Hospital" settings. No aliens, no magic.

  4.  **Drafting the Lesson Plan:**
      *   **0-10 min:** Intro & Rules. No mention of DDE yet.
      *   **10-35 min:** Round 1 & 2 (Team A writes, Team B judges).
      *   **35-40 min:** Break/Swap.
      *   **40-65 min:** Round 3 & 4 (Roles swapped).
      *   **65-75 min:** Debrief (The most critical part).

  5.  **Developing the Debrief:**
      *   Need to map their "MRDs" to DDE concepts.
      *   *Intention vs. Foresight:* "I meant to save them" vs. "I knew they'd die."
      *   *Means vs. Side Effect:* "Did we need his death to work?"
      *   *The Transplant Case:* Usually the breaker.
      *   *The Loop Variant:* Usually the stress test.
      *   *Strategy:* Write their rules on the board. Group them. Show how they cluster around DDE.

  6.  **Predicting Failure Modes (The "Honest" Part):**
      *   *Over-complexity:* Writers add too many variables. Need a template.
      *   *Gerrymandering:* Judges make up ad-hoc rules ("It's impermissible if the person is wearing blue"). Need an "Objection" phase.
      *   *Time:* 75 mins is very short for this. Need to cut rounds if necessary.
      *   *Cynicism:* Students might just vote randomly. Need to emphasize the "Consistency Constitution."
      *   *Limitation:* The game can't reproduce the *metaphysical* weight of DDE, only the intuitive pull. It can't solve the "why" (consequentialism vs. deontology), only the "what."

  7.  **Refining the Scoring System (Crucial Step):**
      *   The prompt wants Team B rewarded for consistency *across the whole game*.
      *   Let's create a "Consistency Ledger."
      *   Team B starts with a blank slate.
      *   Round 1: Case Pair 1. Vote. If Split (Yes/No), Team A gets 1 pt. Team B must write a Rule to explain why.
      *   Round 2: Case Pair 2. Vote. If Split, Team A gets 1 pt. *Unless* the Rule from Round 1 covers it. If they have to write a *new* Rule, Team A gets 1 pt. If they contradict a previous Rule, Team A gets 2 pts.
      *   This encourages Team B to find *one* deep principle (like DDE) rather than many shallow ones.
      *   Team A wants to force new Rules or Contradictions.

  8.  **Finalizing the Plan Details:**
      *   *Name:* "The Consistency Game."
      *   *Materials:* Whiteboard, Index cards for cases, Voting paddles (or just hands).
      *   *Templates:* Provide a fill-in-the-blank for Case Writers to ensure comparability.

  9.  **Addressing the "What Will Go Wrong":**
      *   *Variable Confounding:* Writers will change the number of people saved *and* the method. Need to enforce "Minimal Pairs."
      *   *The "Yuck" Factor:* Disgust might drive verdicts, not principle.
      *   *The "Philosophical Ceiling":* Students might converge on Utilitarianism (always save more) and refuse to distinguish. The game needs to force the distinction. *Correction:* If they go Utilitarian, Team A can't score points. Team A needs incentive to find non-utilitarian distinctions. *Adjustment:* Team A scores points *only* on Split Verdicts. If Team B is pure Utilitarian, Team A gets 0. This motivates Team A to write cases that trigger non-utilitarian intuitions (like Transplant).

  10. **Review against Constraints:**
      *   14 students? Yes (2 teams of 7).
      *   75 mins? Tight, but doable with strict timing.
      *   No lecture first? Yes.
      *   Debrief included? Yes.
      *   Failure modes? Yes.

  11. **Final Polish:** Ensure the tone is supportive but rigorous. Make sure the DDE mapping is clear in the debrief section. (Self-Correction: Make sure to explicitly mention the "Loop" case in the debrief strategy, as it's the classic counter-example to simple Means/Side-Effect distinctions).

