answer: |-
  **What the spreadsheet gets right**

  The spreadsheet's value isn't in the arithmetic, but in forcing the board to separate *need* from *opportunity*. It correctly identifies that a massive problem isn't automatically a good investment if your capital cannot change the outcome. By distinguishing between "how big is the problem" and "how much can money move it," the engineer prevents the emotional trap of funding despair—throwing money at a crisis simply because it is tragic. It also implicitly introduces the concept of marginal utility: your $80k matters less if the tank is already full. Even if the scoring is subjective, the framework demands you justify why your specific dollars matter, rather than just validating the virtue of the cause.

  **Where it goes wrong**

  The first failure is the multiplication of correlated variables, which validates the skeptic's "double-punishing" critique. Systemic issues like lead abatement are often underfunded *because* they are hard to solve; by scoring "hard to move" low and "lack of funding" low, then multiplying them, the spreadsheet squares the penalty against complex structural problems. This mathematically guarantees that easy, service-based wins will always beat hard, systemic fixes, regardless of the actual moral weight. It creates an illusion of objectivity where the underlying bias toward solvability is amplified into a decisive numerical gap, disguising a value judgment as a calculation.

  The second failure is how the "other people" column interprets coordination. The skeptic is right that a crowded space can signal a healthy ecosystem, but the engineer is right that your money adds less value if others are already covering the cost. The spreadsheet conflates "crowded" with "saturated." It fails to account for the fungibility worry raised by the tutoring side: if you fund a program that is already fully supported, your money might just allow another funder to slide away, meaning your net impact is zero. The column tracks the *presence* of other funders, but not the *elasticity* of demand, leaving the board blind to whether their grant creates new value or merely subsidizes existing budgets.

  **What I'd actually do with the $80k**

  I would fund the tutoring program, but I would treat the fungibility worry as a risk to be managed rather than a reason to walk away. In a rust belt city, $80k is insufficient to alter the housing market or city compliance mechanisms required to fix lead exposure; the "moveability" score of 2 is the real killer, regardless of the multiplication error. You are buying services, not solving systems. With tutoring, the link between cash and outcome is direct: money buys hours, hours buy literacy. While the "other people" metric is flawed, local nonprofits rarely have slack capital. If you pull out, they likely cut slots rather than bank the difference. The risk of zero impact is theoretically higher with tutoring due to donor replacement, but the risk of *negligible* impact is certainty with the lead program.

  To mitigate the replacement risk, structure the grant as time-limited seed funding for a specific expansion (e.g., "50 new students") rather than general operating support. This forces the organization to treat the money as additive rather than fungible. Even if other funders exist, demand for literacy tutoring in underserved communities almost always outstrips supply. You are not funding a fixed cost; you are funding marginal capacity. The lead program offers the moral satisfaction of tackling a root cause, but with $80k, you are essentially donating to a study of the problem rather than the solution.

  **What would change my mind**

  The step in my reasoning doing the most work is the assumption that the tutoring organization faces unmet demand and will spend your $80k on new services rather than absorbing it into reserves. This is where the "replacement worry" could actually hold true and collapse my recommendation. If that nonprofit is sophisticated enough to treat your grant as fungible revenue—using it to cover overhead while another funder covers the programs—then your marginal impact is indeed zero. The double-punishing critique of the spreadsheet is valid, but it doesn't change the outcome; the fungibility of the tutoring grant is the only variable fragile enough to flip the decision.
