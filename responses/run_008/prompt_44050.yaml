      *   (6) *Action-Guidance:* Theory must guide action. "Ought implies can" (epistemic sense). If it leaves us in the dark, it fails.
      *   (7) *Anti-Pascalian:* Reject longtermist dominance (tiny prob $\times$ huge value) despite SEV arithmetic.

  3.  **Initial Scan for Tensions (Mental Sandbox):**
