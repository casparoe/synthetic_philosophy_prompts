      *   (2) vs. (3): If decision procedure is SEV (2), but we can't assign non-fabricated credences (3), then the decision procedure is broken. You can't maximize a variable you can't define.
      *   (6) vs. (3): If cluelessness is thoroughgoing (3), the theory leaves us in the dark. If (6) says a theory that leaves us in the dark fails, then Act Consequentialism (1) + Cluelessness (3) implies the theory fails. But the student is writing a paper *defending* a position, presumably trying to save consequentialism.
      *   (7) vs. (2): If decision procedure is SEV (2), then tiny prob $\times$ huge value *should* dominate. Rejecting this (7) contradicts the decision procedure (2).
