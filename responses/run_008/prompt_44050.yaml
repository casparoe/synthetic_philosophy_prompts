          *   (1) Rightness = actual consequences. (3) We can't know/predict them. (6) Theory must guide action/ought implies can.
          *   *Conflict:* If rightness depends on unknowable facts (1+3), and guidance requires knowability (6), then (1) fails the adequacy test (6).
