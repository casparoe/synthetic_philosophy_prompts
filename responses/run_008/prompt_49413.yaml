          *   *Mechanism:* If everyone false promises, "promising" loses its meaning. You literally *cannot* conceive the action in that world.
          *   *Weakness:* Relies on empirical facts about how institutions work (Hegel's point). Seems too narrow (only covers perfect duties?).
          *   *Key Text:* *Groundwork* Ak 4:424 (promise keeping example).

      *   **Practical Contradiction (PC):**
          *   *Claim:* Universalizing leads to a contradiction in the *will*. The agent's purpose becomes unachievable.
          *   *Mechanism:* I lie to get money. If everyone lies to get money, no one believes lies, so I can't get money. My will contradicts itself because I will a world where my end is impossible.
          *   *Weakness:* Still relies on causal/empirical assumptions about human psychology (will people stop believing?). Korsgaard argues it's about the *conditions of agency*, not just causal efficacy.
          *   *Key Text:* *Groundwork* Ak 4:403 (rational nature as end in itself connection).

      *   **Heuristic/Screening (Barbara Herman/Onora O'Neill nuances):**
          *   *Claim:* FUL identifies *moral relevance*, not necessarily final verdicts. It flags maxims that need testing against the Formula of Humanity (FH).
          *   *Mechanism:* FUL shows a maxim cannot be a universal law *of nature*. FH tells us *why* (it treats humanity as mere means).
          *   *Weakness:* Makes FUL derivative. Why have the test if FH does the heavy lifting?
          *   *Key Text:* Herman, *The Practice of Moral Judgment*.

