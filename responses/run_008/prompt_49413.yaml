answer: |-
  This is a sophisticated stalemate, and your intuition is sharp: the debate hasn't moved because the participants are often fighting over **what the Categorical Imperative (CI) is supposed to be**, not just what Kant said.

  Here is the diagnosis: The disagreement is **substantive**, but it is sustained by a **categorial confusion** (ships passing in the night). The "Logical" and "Practical" camps are arguing over the metaphysics of morals (substantive), while the "Heuristic" camp is arguing about moral epistemology (categorial). Until the group distinguishes between the CI as a **decision procedure** (algorithm for action) and the CI as a **constitutive account** (explanation of obligation), you will spin in circles.

  Here is the breakdown of why the positions are stuck, where Hegel is hiding, and what would actually count as progress.

  ### 1. The Diagnosis: Substantive Metaphysics vs. Epistemic Function

  You hypothesized that this is about "what a moral test owes you." You are right. The stalemate persists because each side is trying to save Kant from a different fatal objection.

  *   **The Logical Contradiction (LC) Camp:** They are trying to save Kant from **Hegel**. If the test relies on empirical facts about social institutions (e.g., "promising requires trust"), then the CI isn't purely *a priori*. It becomes empirical sociology. They want the contradiction to be in the *proposition itself* to preserve the "pure formalism."
      *   *The Cost:* They make the test too narrow. It only works for perfect duties (promises, property). It fails miserably on imperfect duties (benevolence, self-development), where no logical contradiction arises from universalizing non-help.
  *   **The Practical Contradiction (PC) Camp (Korsgaard/O'Neill):** They are trying to save Kant from **Triviality**. If the test is purely logical, it's empty. By shifting the contradiction to the *will's purpose*, they introduce a teleology of rational agency. The "empirical" fact they rely on isn't about social institutions, but about the *necessary conditions of acting for reasons*.
      *   *The Cost:* They smuggle in a theory of the good (rational agency is valuable). Hegel would say, "Aha! You needed content after all; you just hid it in 'agency'."
  *   **The Heuristic Camp (Herman):** They are trying to save Kant from **Rigidity**. They admit the FUL isn't a verdict machine. It's a filter for *moral salience*. It tells you which features of your maxim are morally relevant so you can apply the Formula of Humanity (FH).
      *   *The Cost:* It demotes the FUL. If FUL just screens for FH, why does Kant spend so much time on it in the *Groundwork*?

  **The Verdict:** This is **Substantive**. The LC and PC camps have incompatible metaphysical commitments about whether moral wrongness is a form of logical incoherence or a form of practical self-defeat. However, it is also **Ships Passing** because the Heuristic camp is often arguing that the other two are asking the wrong question (epistemology vs. ontology).

  ### 2. The Hegel Ghost and the "Empty Formalism" Charge

  Your working hypothesis is correct: the subtext is Hegel's charge that the CI is empty.

  *   **LC Response:** "It's not empty; it's logic!" (But then they need empirical premises about institutions to make the logic work, which validates Hegel).
  *   **PC Response:** "It's not empty; it's the structure of agency!" (But then it relies on a substantive claim about what rational agents will, which validates Hegel).
  *   **Heuristic Response:** "It's not a formalism; it's a method for finding content!" (But then it admits FUL can't stand alone).

  The reason the map hasn't changed since O'Neill's *Acting on Principle* (1975) is that these are the only three ways to skin the cat. You either double down on logic (and fail on benevolence), double down on agency (and admit teleology), or admit the test is incomplete.

  ### 3. What Counts as Progress? (The Test Cases)

  To break the stalemate, you need to stop arguing about the **False Promise** case. It is the worst test case because *all three interpretations can make it work* with enough tweaking.

  You need to force the camps apart using cases where their mechanisms diverge.

  **A. The Non-Benevolence Maxim (The Wedge)**
  *   *Maxim:* "I will never help others in need, to focus on my own projects."
  *   *LC Failure:* There is no *logical* contradiction in a world where no one helps anyone. The concept of "helping" doesn't dissolve like "promising." You can conceive this world.
  *   *PC Success:* Korsgaard argues you cannot *will* this because you are a finite rational agent who will inevitably need the help of others. To will a world where help is impossible is to will the frustration of your own future agency.
  *   *The Progress Move:* If the LC camp insists this maxim fails the FUL, they must explain *where the logical contradiction lies* without smuggling in a premise about "what humans need." If they can't, they must admit FUL has two distinct operations (Contradiction in Conception vs. Contradiction in Will), and the LC model only explains the first.

  **B. The "Successful Free Rider" Case**
  *   *Maxim:* "I will lie when convenient, provided I am skilled enough to maintain my reputation even if lying is common."
  *   *PC Vulnerability:* If the agent is uniquely skilled, their purpose (getting money via lies) might *not* be thwarted even if everyone lies. The practical contradiction disappears for the genius liar.
  *   *LC Vulnerability:* The institution of promising still dissolves, regardless of the liar's skill.
  *   *The Progress Move:* Does the CI condemn the genius liar?
      *   If **Yes**, the LC reading is stronger (institutional collapse).
      *   If **No**, the PC reading is consistent (no frustration of purpose).
      *   *Kant's View:* Kant would condemn the genius liar. This suggests the contradiction isn't just about *my* success (PC), but about the *system of rational communication* (closer to LC or a hybrid). This forces the PC camp to broaden "purpose" from "my end" to "the conditions of communication."

  **C. The Suicide Maxim**
  *   *Maxim:* "I will end my life to avoid suffering."
  *   *The Problem:* Kant argues this contradicts the natural purpose of self-love (preservation).
  *   *The Progress Move:* This is a **teleological** argument, not a logical one. There is no logical contradiction in self-love causing death.
      *   If the group admits this, they must admit the FUL relies on a philosophy of nature/biology (which Kant thought he could ground *a priori*, but we likely can't).
      *   This is the strongest evidence for the **Heuristic** view: The FUL flags the maxim as suspicious because it treats life as a mere means to comfort, which is then fully condemned by the Formula of Humanity.

  ### 4. How to Unstick the Group

  The honest answer is that the debate doesn't move because everyone wants the FUL to be a **moral calculator**. Kant scholars spend decades trying to fix the machine so it outputs "Right/Wrong" without human judgment.

  **Proposal for the Reading Group:**
  Stop asking "How does the test work?" and start asking "What is the input?"

  The real problem isn't the contradiction; it's the **Maxim**.
  *   If I formulate my maxim as "Lie to get money," it fails.
  *   If I formulate it as "Lie to save a life," it might pass.
  *   If I formulate it as "Lie when I can get away with it," it fails.

  **The Distinction that Matters:**
  Distinguish between **The Test of Universalizability** (Could everyone do this?) and **The Test of Universal Law** (Could everyone *will* this as a law of nature?).
  *   The LC crowd focuses on the *Law of Nature* (causal impossibility).
  *   The PC crowd focuses on the *Will* (volitional impossibility).

  **The "Honest Answer" Conclusion:**
  The disagreement won't resolve because Kant's text in the *Groundwork* is genuinely ambiguous. He oscillates between treating the CI as a logical consistency check and a teleological consistency check.
  *   **Progress** looks like admitting that the FUL is not a standalone decision procedure. It is a **deliberative field**.
  *   The "Logical" reading is useful for perfect duties (rights/justice).
  *   The "Practical" reading is useful for imperfect duties (virtue/ethics).
  *   The "Heuristic" reading is the most honest about how we actually use it (to spot moral salience).

  If your group can agree that **FUL is for spotting contradictions in the *system* of agency, while FH is for grounding the *value* of that agency**, you can stop fighting about which contradiction is "real." The Logical/Practical fight is a proxy war for whether morality is about *consistency* (LC) or *value* (PC/FH). Kant needs both, but he tries to derive the second from the first in the *Groundwork*, and that is where the text breaks.

  **Final Recommendation:** Assign Barbara Herman's *"Leaving Deontology Behind"* alongside Korsgaard's *"Kant's Formula of Universal Law."* Ask the group: "Is the contradiction in the *world* (LC), in the *will* (PC), or in the *description of the action* (Herman)?" If they can't agree on where the contradiction is located, they aren't arguing about Kant; they are arguing about whether morality is logic or teleology. Admit that, and the stalemate dissolves into a more interesting meta-ethical debate.
