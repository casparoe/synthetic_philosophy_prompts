      *   **Progress:** Needs to stop asking "Which one is Kant?" and start asking "Which one saves the phenomenon of obligation?"
      *   **Specific Test Case:** The **Non-Benevolence Maxim**. This is the wedge. LC *cannot* explain why refusing to help is wrong via contradiction in *conception*. It requires contradiction in *will*. If the group is arguing about FUL generally, they must distinguish CC from CW. If they treat FUL as one monolithic test, they are doomed.

