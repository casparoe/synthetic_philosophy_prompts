      *   Is it ships passing? Partially. The "Decision Procedure" seekers are frustrated by the "Structure of Reason" describers, and vice versa.

      *   *Core Tension:* The text of the *Groundwork* is notoriously ambiguous here. Kant uses "contradiction in conception" (CC) and "contradiction in the will" (CW), but the examples often blur the line between logical impossibility and practical inefficacy.
