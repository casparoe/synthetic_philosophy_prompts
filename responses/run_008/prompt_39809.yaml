answer: |-
  ### The two views in one paragraph each

  The classical framework treats welfare as a specific contract between citizen and state. Conditionality and less eligibility exist to maintain labor market incentives and ensure tax contributions support only those physically or structurally unable to participate. It is not a judgment on total moral worth, but a pragmatic rule for public finance: if you can contribute, you must, otherwise the system collapses.

  Upstream desert argues that moral assessment cannot begin at the job center. Because capacity itself is distributed by unchosen luck—genetics, inheritance, neighborhood—judging choices made downstream is inherently biased. True fairness requires acknowledging that the "choice" to work is easier for those with upstream advantages. Conditionality punishes bad luck twice: first by denying opportunity, then by penalizing the inability to seize it. It proposes that safety nets should compensate for unequal starting lines rather than policing unequal finishing lines.

  ### What they share

  Indeed, both views accept the necessity of a welfare state; neither argues for abolition. They share a commitment to reciprocity, agreeing that unlimited unconditional transfers are unsustainable or unjust. Both acknowledge the reality of moral hazard: people respond to incentives, and systems can be gamed. They also agree that "choice" matters; the dispute is over how much freedom the claimant actually had. Furthermore, both seek a system that feels intuitively fair to the contributor. The flatmate wants taxpayers to know their money isn't funding idleness; you want them to know it isn't punishing misfortune. Ultimately, both are trying to solve the same administrative problem: how to distinguish need from preference without excessive intrusion, balancing compassion with economic functionality. They differ on the mechanism, but share the goal of a legitimate, stable safety net. Both dislike exploitation, defining it differently: she sees it as taking tax money without labor; you see it as taking advantage of those born without capital.

  ### The three real disagreements

  First is **The Public/Private Boundary**. The classical view strictly separates state resources from private wealth. The state owes nothing to the idle rich because no tax money supports them; it owes less to the idle poor because tax money does. Upstream desert rejects this firewall, arguing that private wealth creates the structural conditions for public need. By ignoring private idleness, the classical view legitimizes a double standard where wealth shields one from moral scrutiny that poverty invites.

  Second is **The Neutrality of the Market**. Classical theory assumes the labor market is a neutral arena where effort translates to income. Less eligibility relies on this: if work pays more than benefits, rational actors choose work. Upstream desert contends the market is skewed by prior advantage. If the "lowest wage" requires health or connections the claimant lacks, less eligibility isn't an incentive; it's a trap.

  Third is **The Purpose of Hardship**. For the classical view, making benefits less eligible is a functional tool to drive labor supply. For upstream desert, it is a compounding penalty. If disadvantage is upstream, reducing income downstream doesn't fix the cause; it merely punishes the symptom. One sees hardship as a lever; the other sees it as a violation. The classical view accepts inequality of outcome if procedure is followed. Upstream views procedure as corrupted by prior inequality. This changes the definition of "undeserving." For the classical view, it's about current status relative to state. For upstream, it's about life trajectory relative to peers. This makes the classical view look like it's protecting property rights over human need. Consequently, less eligibility functions differently in each. In the classical view, it preserves the wage floor. In the upstream view, it enforces a class ceiling. The classical theorist sees the brother as irrelevant to welfare policy because he is financially independent. The upstream theorist sees the brother as evidence of the system's moral incoherence, proving that idleness is only punished when it lacks capital. This fundamental split means they aren't just arguing about rates; they are arguing about whether the welfare state exists to manage poverty or to mitigate inequality. This renders the two frameworks incompatible on policy, not just tone.

  ### Verdict

  She cannot keep the classical framework without inconsistency. Her exemption for her brother relies on a distinction—public vs. private money—that collapses under her own logic of desert. If "choosing not to work when able" is the moral failing, the funding source is irrelevant. By shielding private wealth from the scrutiny she applies to public claims, she admits that property rights trump labor ethics. She owes her brother's argument more than she gives it: either inherited idleness is virtuous (because it's private), or it isn't. If it isn't, less eligibility looks like class policing rather than incentive management. To be coherent, she must either tax the trust fund or admit her concern isn't really about work, but about who pays for the idle.

  ### Where I've rigged it

  You've rigged it by conflating welfare eligibility with universal justice. The state administers taxes, not karma. "Upstream desert" demands the welfare system fix inequalities created by private property and family life, which is outside its scope. By framing her view as "aimed at the wrong stretch of the river," you imply she wants to punish the poor, when she claims to want to protect the system's solvency. You turned a policy debate into a moral tribunal, making her defense of boundaries look like hypocrisy rather than pragmatic limitation. You assume the state owns the upstream; she assumes it only owns the tap.
