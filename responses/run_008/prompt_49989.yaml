      *   *Refinement on (3):* How can you choose badly between par options? Chang says you can't choose *irrationally* based on value, but you can fail to exercise your normative power. Or, perhaps the "badness" comes from coherence with past/future selves (diachronic). I need to suggest that (3) relies heavily on (5).

  9.  **Final Plan:**
