prompt: |-
  i'm a phil PhD student working on choice and value, and my advisor wants me to write down where I actually stand before we draft a proposal, so here's the pile. (1) I'm a value pluralist — friendship, achievement, pleasure, whatever, are genuinely different kinds of value and there's no master scale they all reduce to. (2) I buy the parity view of hard choices: a lot of the time neither option is better, worse, or equal to the other — they're on a par, and that's not me being ignorant of a comparison that secretly exists, it's just how the values are. (3) But I also think you can get a hard choice *wrong* — that someone who picks one on-par option over another can be choosing badly, that there's a real difference between choosing well and choosing badly even when neither option is better. (4) I TA decision theory and I accept the vNM package as genuine norms of rationality, completeness included — I don't want to be the person telling the economists their axioms are optional. (5) And I think deliberation in hard cases isn't trying to discover a ranking that isn't there — it's more like putting your weight behind one option, and once you've done that, the commitment itself generates reasons going forward.

  does this hang together at all? I keep going back and forth on whether some of these are in tension or just sound like they are, and I honestly can't tell anymore whether I have a view or just a pile of verdicts. Go through the pairs, tell me which tensions are real and which dissolve on inspection, rank the real ones by severity, and for each one say what the cheapest fix would be and what it costs me.
