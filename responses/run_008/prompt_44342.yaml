answer: |-
  Points 1 and 3 are logically incompatible, and discarding Point 1 is the necessary fix to align your theory with your moderation practice.

  Point 1 claims slurs share truth conditions with neutral counterparts (only attitude changes), while Point 3 claims slur sentences are false because they assert contemptibility. If Point 1 were true, a slur sentence about a group member would be true (just rude); Point 3 insists it is false. You cannot hold both. Point 1 is also in minor tension with Point 2: if slurs are just neutral words plus attitude, reclamation shouldn't change the *meaning* (semantics), only the vibe, yet you correctly identify reclamation as semantic change. Point 1 is the outlier; modern linguistics largely rejects pure expressivism for slurs in favor of truth-conditional or presuppositional accounts, which supports Point 3.

  Points 4 and 5 are in practical tension but not logical contradiction. Point 4 says mentioning is harmless; Point 5 says flag it. This is an engineering trade-off, not a philosophical error. You can consistently believe mentioning is ethically neutral (4) while flagging it for human review because automated systems cannot reliably distinguish use from mention, and the cost of missing a real slur outweighs the cost of reviewing a quote (5). This tension resolves if you frame Point 5 as "flag for review" rather than "flag as violation."

  The single cheapest revision is to delete Point 1 and replace it with: "A slur contributes false content regarding social hierarchy, not just attitude." This aligns with Point 3 (the sentence is false), supports Point 2 (meaning can change via reclamation), and clarifies Point 4 (mentioning doesn't assert that false content). It removes the philosophical contradiction Dana spotted without forcing you to change your moderation policy in Point 5.
