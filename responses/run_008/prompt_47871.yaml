answer: |-
  **Exam Question**

  **Essay Question (90 Minutes)**

  Max Black's symmetric universe is frequently cited as a counterexample to the Principle of the Identity of Indiscernibles (PII). However, the dialectic surrounding Black's example turns on how the principle is formulated and what counts as a legitimate property. Write an essay arguing for a definite verdict: does the Principle of the Identity of Indiscernibles, properly formulated, survive Black's two-sphere counterexample, or does it fail?

  In defending your verdict, you must explicitly engage with the following four points:
  (a) Clarify the logical status of PII by distinguishing between reading it as a trivial claim about *all* properties (including identity properties) versus a substantive claim about *qualitative* properties, and explain which formulation Black threatens.
  (b) Evaluate the defender's move to include relational properties (e.g., "being two miles from a sphere"). Explain why the symmetry of Black's universe suggests this property is shared by both spheres, and assess whether this defeats the relational defense.
  (c) Consider the retreat to a restricted PII covering only purely qualitative, non-haecceitistic properties. Argue whether this restriction saves the principle as a meaningful metaphysical thesis or whether it constitutes an ad hoc gerrymander that renders the principle trivial or empty.
  (d) Scrutinize the coherence of Black's description itself. Can the sentence "there are exactly two spheres in this universe" be true if each sphere is qualitatively indiscernible from the other, or does the truth of that numerical claim presuppose a qualitative difference?

  Your essay must take a clear stance. Do not merely survey the options; argue for whether PII is true or false in light of these considerations.

  ***

  **Model Answer**

  **Verdict: The Principle of the Identity of Indiscernibles Survives.**

  The Principle of the Identity of Indiscernibles (PII) survives Max Black's counterexample, not because the two-sphere universe is physically impossible, but because the description of that universe presupposes individuation facts that cannot be sustained without violating the principle's qualitative restrictions. To see this, we must distinguish the trivial from the substantive formulations of PII.

  Regarding point (a), if PII is read as the claim that no two distinct objects share *all* properties, including the property of "being identical to x," the principle is a logical truth immune to counterexample. However, this renders PII metaphysically inert. Black targets the substantive formulation: that qualitative indiscernibility suffices for identity. This is the only version worth defending, and it is the only version Black threatens. If we allow haecceities (primitive "thisnesses") as properties, PII is trivially true but explains nothing about the structure of reality. Therefore, the debate must rest on purely qualitative properties.

  The standard defense involves relational properties (point b). A defender might claim Sphere A has the property "being two miles from Sphere A," while Sphere B has "being two miles from Sphere B." However, in Black's symmetric universe, these are not monadic properties but relations. If we analyze the relational profile, both spheres share the property "being two miles from *a* sphere." Because the universe contains only the two spheres and is symmetric, there is no qualitative feature of the source sphere that distinguishes the relation. Both spheres stand in the exact same relation to a qualitatively identical counterpart. Thus, appealing to standard relational properties fails to discern them; the symmetry ensures that every relational property held by one is held by the other.

  This forces the retreat to a restricted PII covering only purely qualitative, non-haecceitistic properties (point c). Critics argue this restriction is an ad hoc gerrymander designed to save the principle by excluding the very properties (like spatial location or haecceities) that do the individuating work. However, this restriction is principled, not ad hoc. Leibniz's motivation for PII was grounded in the Principle of Sufficient Reason: there must be a qualitative ground for distinctness. If distinctness rests on brute numerical difference without qualitative ground, the Principle of Sufficient Reason is violated. Therefore, restricting PII to qualitative properties preserves its role as a substantive metaphysical constraint on reality rather than deflating it into triviality. The restriction is the core of the thesis, not a patch.

  Finally, we must scrutinize the coherence of Black's description (point d). Black asserts, "there are exactly two spheres." But what makes it *two* rather than *one*? In the absence of qualitative difference, the numerical claim "two" relies on a primitive thisness or a bare particular substrate. If one accepts bare particulars, one has already abandoned the Leibnizian framework that motivates PII. If one rejects bare particulars, then the claim "there are two spheres" requires a qualitative ground for the numerical distinction. Since ex hypothesi there is no qualitative difference, the description "there are exactly two spheres" is semantically unstable. It attempts to assert numerical distinctness while denying the conditions (qualitative difference) that make such distinctness intelligible within a Leibnizian ontology.

  Therefore, PII survives. Black's universe is not a genuine counterexample because it is not a coherent possibility under the metaphysical constraints PII demands. The description implicitly relies on haecceitistic individuation to assert there are "two," while explicitly denying qualitative individuation. Once we recognize that numerical distinctness without qualitative ground is unintelligible, the counterexample dissolves. PII remains a necessary truth about the structure of reality: distinctness entails discernibility.

  ***

  **Marking Scheme (25 Marks)**

  **1. Formulation Distinction (5 marks)**
  *   **Must Hit:** Clearly distinguishes between the trivial formulation (including identity properties/haecceities) and the substantive formulation (qualitative properties only), identifying that Black only threatens the latter.
  *   **Typical Fumble:** Students treat the two formulations as logically distinct contrapositives rather than distinctions in property scope, or claim Black refutes the logical truth version.

  **2. Relational Properties & Symmetry (5 marks)**
  *   **Must Hit:** Explains that "being two miles from a sphere" is a shared property due to symmetry, demonstrating why simple relational appeals fail to discern the spheres.
  *   **Typical Fumble:** Asserting that "being two miles from *itself*" is a valid monadic property that discerns the spheres, ignoring the symmetric relational structure.

  **3. Restricted PII & Triviality (5 marks)**
  *   **Must Hit:** Takes a stance on whether restricting PII to qualitative properties is a principled metaphysical move or an ad hoc gerrymander, linking this to the principle's explanatory power.
  *   **Typical Fumble:** Dismissing the restriction as "cheating" without explaining why it renders the principle trivial, or accepting it without addressing the charge of ad hocery.

  **4. Coherence of Black's Description (5 marks)**
  *   **Must Hit:** Analyzes whether the claim "there are exactly two spheres" presupposes individuation facts (haecceities) that contradict the premise of pure qualitative indiscernibility.
  *   **Typical Fumble:** Accepting Black's description as obviously possible without questioning how numerical distinctness is grounded in the absence of quality.

  **5. Definite Verdict & Argumentative Coherence (5 marks)**
  *   **Must Hit:** Commits to a clear "Survives" or "Fails" verdict and ensures all four previous points support this specific conclusion rather than sitting on the fence.
  *   **Typical Fumble:** Concluding that "both sides have good points" or "it depends on your definition," failing to argue for a specific metaphysical outcome.

  ***

  **Zero-Credit Moves**

  *   **The Relational Error:** Asserting that "being two miles from a sphere" successfully discerns the spheres without addressing why the symmetry makes this property common to both.
  *   **The Haecceity Hand-Wave:** Invoking "thisness" or haecceities as a decisive refutation of Black without explaining that accepting haecceities concedes the failure of PII as a *qualitative* principle (rendering it trivial).
  *   **The IoI Confusion:** Confusing the Principle of the Identity of Indiscernibles (Indiscernibility $\rightarrow$ Identity) with the Indiscernibility of Identicals (Identity $\rightarrow$ Indiscernibility).
  *   **The Recitation:** Merely describing Black's two-sphere universe without analyzing the underlying metaphysical commitments regarding property types or numerical distinctness.
  *   **The Fence-Sitting:** Refusing to take a definitive stance on whether PII survives, instead offering a neutral summary of the dialectic.
