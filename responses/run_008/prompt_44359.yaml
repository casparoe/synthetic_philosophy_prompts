prompt: |-
  I've been reading up on lottocracy (filling legislatures by random selection, like jury service) and I want a satirical piece out of it. Write a deadpan FAQ, around 600 words, in the voice of a fictional "National Assembly Onboarding Office", addressed to citizens who've just been drawn by lot to serve a term in parliament — think of things like Ireland's citizens' assemblies as the real-world model, if that helps.

  The humour has to come from getting the actual theory right, not from mocking the punters. Some things worth working in: the fact that facilitators and expert witnesses are the ones with the leverage, since the randomly selected members can't all be policy wonks; that you never face re-election, which is both a liberation and an accountability headache; that sortition arguably fixes the selection bias of elections (who opts into running) without settling the competence question, which is genuinely contested among scholars. Cut both ways — satirise both the romanticism of "the ordinary citizen deliberating" and the elite sneer that the public is too thick to govern. Keep it deadpan; no winking at the reader, and don't let it collapse into a one-sided hit-piece.

  Then append a short note (100ish words) flagging where the FAQ leans on contested claims among people who actually study deliberative democracy — e.g. whether deliberation reliably changes minds or just entrenches priors — versus what's broadly settled, so a reader can tell which jokes rest on live debates. Please recieve the request in the spirit intended: fairness to the idea matters more than easy laughs. Total under ~750 words would be great.
