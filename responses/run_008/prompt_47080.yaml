answer: |-
  The practice presupposes a deontological theory of agency wherein the obligation to refrain from killing innocents is absolute and survives extreme coercion, treating the physical possibility of refusal as sufficient for moral responsibility regardless of psychological improbability.

  This legal framework does not rely on a character-based theory that assumes perpetrators were inherently vicious (Goldhagen), but rather on a normative competence model that assumes moral law binds the will even when self-preservation urges override it (Browning). The law is agnostic regarding whether the shooters were antisemitic zealots or conformist reservists; it requires only that they possessed the physical capacity to lower their weapons and the cognitive capacity to recognize the victim's right to life. Consequently, the practice does not require a false picture of the perpetrators to function; it requires a robust picture of moral obligation that situationism denies is psychologically realistic but insists is normatively necessary. The doctrine sits well with Goldhagen but does not strictly require him; it can accommodate Browning's findings by shifting the locus of blame from "why you wanted to kill" to "why you failed to resist killing."

  A consistent situationist can endorse the convictions, but only by abandoning retributive desert claims based on robust free will and adopting a forward-looking, consequentialist justification. On this view, holding agents responsible is not about giving them their just deserts for a choice they freely made in a vacuum, but about affirming the inviolability of the norm to stabilize future expectations. If the tribunals took the situational explanation as seriously as the week-eight students, the doctrine would not necessarily collapse, but sentencing would shift dramatically toward mitigation, and the purpose of the court would migrate from retributive justice to historical record-setting or preventive incapacitation. We would see more acquittals on *mens rea* grounds or convictions followed by suspended sentences, acknowledging that while the act was wrongful, the blame attributable to the individual agent was diluted by the circumstance.

  The line drawn at killing innocents regarding duress is doing philosophical work, not merely expressing special horror. It rests on a rights-based theory of incommensurability: one's own right to life cannot outweigh another's right to life, whereas property or lesser bodily interests can be traded against self-preservation. This is a deontological constraint that marks the boundary where self-interest ceases to be a valid justification for imposing harm, ensuring that the legal system does not authorize the calculation of innocent lives as expendable resources for the actor's survival.
