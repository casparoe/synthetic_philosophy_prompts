      *   *The Philosophical Presupposition:* The law assumes a "normative competence" that survives extreme pressure. It's not necessarily that the pressure didn't exist, but that the *obligation* not to kill innocents is absolute and overrides the self-preservation instinct.
      *   *Character vs. Fair Opportunity:* It's not strictly character-based (virtue ethics) because the law doesn't ask "were you a vicious person?" It asks "did you commit the actus reus with mens rea?" However, it assumes a capacity for moral resistance that situationism denies is reliable. It leans towards a Kantian/deontological view of agency where moral law binds regardless of consequences (even death).
      *   *Goldhagen vs. Browning:* If Goldhagen is right (eliminationist antisemitism), the legal view fits easily (they wanted to do it). If Browning is right (ordinary men pressured), the legal view *still* holds them responsible, but the *justification* for punishment shifts from retribution for viciousness to affirmation of the norm.
      *   *Situationist Endorsement:* Can a situationist endorse the convictions? Yes, but on consequentialist/normative grounds rather than desert-based grounds. "We must hold them responsible to establish the norm, even if their capacity was compromised."
