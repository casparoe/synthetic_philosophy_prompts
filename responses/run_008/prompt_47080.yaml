      *   *Duress Line:* Killing innocents vs. other crimes. This is the "doctrine of necessity." You can steal a car to get to the hospital, you can't kill a bystander to save yourself. This is philosophical work (inviolability of persons), not just horror. It marks the boundary where self-preservation ceases to be a valid trade-off against another's right to life.

