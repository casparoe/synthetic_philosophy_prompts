  4.  **Developing the Reasoning:**
      *   *Theory of Agency:* It's not character-based (Goldhagen) strictly. It's about *normative competence*. The law assumes you *can* say no, even if psychology says you probably won't. It's a "fair opportunity" view pushed to the absolute limit: the opportunity to refuse exists physically, so the responsibility attaches morally, even if the cost is death.
