  1. **Agreed Claims:** We agree that the demandingness objection asserts consequentialism imposes requirements incompatible with the necessary conditions of moral agency or integrity. We agree that claims stating only that consequentialism "demands too much" are empty without a specified comparison class or normative benchmark for acceptable demand. We agree the objection would be decisive only if it demonstrated that complying with consequentialist requirements systematically undermines the psychological or rational capacities required to pursue value impartially, or if it entailed obligations that exceed the limits of possible action.

  2. **Residual Disagreements:** We disagree on the source and significance of the resistance to consequentialist demands. The Consequentialist maintains that resistance stems primarily from self-serving bias and that a fair-share cap resolves normative concerns without violating consequentialist principles. The Critic maintains that the objection targets the deliberative standpoint required by consequentialism, arguing that reducing the agent to a conduit for impartial value is alienating regardless of the magnitude of sacrifice, and that the fair-share cap introduces non-consequentialist constraints rather than resolving them.

  3. **Cruxes:** The first crux is the evidential weight of demandingness intuitions when the agent has a vested interest in the outcome; specifically, whether these intuitions track moral truth or psychological convenience. The second crux is the derivability of the fair-share cap; specifically, whether limiting obligation to a cooperative share can be justified within a maximizing framework or whether it necessarily imports external deontological restrictions.

  4. **Test Cases and Predictions:**
  *   **Case A (Intuition Weight):** An agent is asked to sacrifice a personal project valued at 100 units to produce 100 units of impartial value elsewhere, with no slack between cost and benefit. The Critic predicts the intuition of excessive demand persists despite the calibrated exchange. The Consequentialist predicts the intuition vanishes when the agent recognizes the symmetry of sacrifice and gain.
  *   **Case B (The Cap):** A group rescue scenario where others fail to contribute their fair share. The Consequentialist predicts the agent's obligation caps at their initial fair share. The Critic predicts the agent's obligation extends to covering the deficit to maximize the outcome.

  5. **Verbal Disputes:** We acknowledge that part of our disagreement hinges on the definition of "consequentialism." The Consequentialist treats the fair-share cap as a refinement of consequentialist application under non-ideal theory. The Critic treats any cap on maximizing good as a departure from consequentialism proper. We also note potential ambiguity in "alienation," where The Consequentialist interprets it as a psychological cost to be weighed, and The Critic interprets it as a structural feature of the moral relationship.
