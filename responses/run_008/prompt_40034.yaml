answer: |-
  You have identified a genuine gap between the textbook models of signaling and the lived reality of modern professional institutions. Your intuition is correct: the classic biological and economic stories (Zahavi's Handicap Principle, Spence's Job Market Signaling) describe **separating equilibria**. In those models, the signal works *because* it is too costly for low-quality types to mimic. The variation is the point; the cost creates a barrier that reveals private information.

  In your examples, the variation has vanished. When everyone sends the signal, it conveys zero information about quality. In game theory, this is called a **pooling equilibrium**. Standard theory suggests that pooling equilibria on costly signals are unstable: if the signal costs resources but yields no informational advantage, rational actors should eventually stop paying the cost.

  The fact that they *don't* stop—that the cost persists despite the lack of informational return—is the puzzle. You are describing a **Pooling Equilibrium sustained by Norm Enforcement and Coordination Failure.**

  There is no single canonical term in the literature that captures the specific triad you identified: (1) universal cost, (2) zero informational value, and (3) social penalty for opting out. However, we can construct a precise definition by synthesizing concepts from game theory, sociology, and management theory.

  ### 1. The Existing Concepts (and why they fall short)

  *   **Pooling Equilibrium (Economics/Game Theory):** This describes the *state* where all types send the same signal, rendering it uninformative.
      *   *Why it's insufficient:* It describes the outcome, but not the *persistence*. Standard models predict that if a signal becomes pooling and costly, the market should find a cheaper way to separate types, or the signal should vanish. It doesn't explain why the waste is *compulsory*.
  *   **The Red Queen Effect (Evolutionary Biology):** "It takes all the running you can do, to keep in the same place." This captures the arms-race dynamic where adaptation is required just to maintain relative fitness.
      *   *Why it's insufficient:* The Red Queen implies an adversarial co-evolution (predator vs. prey, or competitor vs. competitor). In your consulting example, the competitors are cooperating to sustain the waste. It is not a race against an opponent; it is a race against a *standard*.
  *   **Institutional Isomorphism (Sociology):** DiMaggio and Powell described how organizations become identical due to coercive, mimetic, or normative pressures.
      *   *Why it's insufficient:* This explains why the *firms* look the same, but not why the *individuals* endure personal costs (midnight emails, unpaid labor) that do not advance their standing.
  *   **Multi-polar Trap (Game Theory / Cybernetics):** Often associated with the "Moloch" meme, this describes a system where individual rationality leads to collective ruin because no single actor can opt out without being destroyed by the others.
      *   *Why it's insufficient:* This is the closest fit for the *dynamic*, but it is a broad category. It doesn't specifically name the *signal itself* or the mechanism of the opt-out penalty.

  ### 2. The Coined Term: "Hygiene Signaling"

  To capture the specific configuration you described, I propose the term **Hygiene Signaling**.

  This term synthesizes **Signaling Theory** (Spence) with **Two-Factor Theory** (Herzberg). In management theory, "Hygiene Factors" (salary, working conditions, status) do not motivate employees if present, but their *absence* causes profound dissatisfaction and exit. They are not drivers of excellence; they are prerequisites for participation.

  **Definition:**
  **Hygiene Signaling** is a costly display that has transitioned from a *separating signal of quality* to a *pooling signal of legitimacy*.
  *   **Function:** It does not signal "I am better than average." It signals "I am not a deviant."
  *   **Cost:** The cost remains real (time, money, stress), but it is no longer an investment in status; it is an insurance premium against stigma.
  *   **Equilibrium:** It is a **Nash Equilibrium** maintained by **second-order beliefs**. I do not answer the email at midnight because I think it helps the client; I do it because I know *you know* that if I don't, I will be marked as uncommitted.

  ### 3. Boundary Cases and The "Opt-Out" Penalty

  You asked specifically about the boundary where opting out becomes a statement. This is the mechanism that locks the trap.

  **The Mechanism: Second-Order Stigma**
  In a standard signaling game, if I don't send the signal, you infer I am low quality. In Hygiene Signaling, if I don't send the signal, you infer I am *unwilling to submit to the group's norms*.
  *   **The Signal:** "I answered at midnight."
  *   **The Meaning:** Not "I am hardworking," but "I acknowledge your authority to demand midnight work."
  *   **The Opt-Out Penalty:** When you opt out, you are not saving resources; you are breaking a **Common Knowledge** contract. The penalty is not economic (directly); it is social exclusion. You are marked as "not one of us."

  **Boundary Case 1: The Separating Threshold**
  Hygiene Signaling exists only when the cost is high enough to be painful, but low enough that *everyone can still pay it*.
  *   *If the cost drops too low:* It ceases to be a signal (e.g., CC'ing a manager on trivial emails might become so automated it loses even the appearance of effort).
  *   *If the cost rises too high:* The equilibrium breaks. If the cost exceeds the value of the prize (the job, the marriage), participants exit the system entirely (burnout, divorce, industry collapse).

  **Boundary Case 2: The Coalition Exception**
  The only way to break a Hygiene Signaling trap is **coordinated opt-out**.
  *   *Individual Opt-Out:* Punished (seen as deviance).
  *   *Collective Opt-Out:* Renegotiates the norm.
  *   *Example:* This is the function of unions in your consulting example, or editorial boards setting strict limits on peer review turnaround times in academia. If 50% of the associates agree to not answer emails after 8 PM, the signal loses its power to distinguish "deviants," and the norm shifts.

  **Boundary Case 3: The "True Believer"**
  There is a edge case where the signal *does* still separate. A small subset of participants may internalize the norm (the "grinders" who actually enjoy the midnight emails). For them, the cost is lower (psychologically), so they gain a genuine advantage. Hygiene Signaling persists partly because this minority keeps the bar high for the majority who are just paying the tax.

  ### 4. Summary of the Phenomenon

  | Feature | Classic Signaling (Peacock) | Hygiene Signaling (Your Cases) |
  | :--- | :--- | :--- |
  | **Equilibrium Type** | Separating | Pooling |
  | **Information Conveyed** | "I am high quality." | "I am compliant." |
  | **Benefit of Signaling** | Gain status/mate/job. | Avoid stigma/firing/rejection. |
  | **Cost** | Investment (yields return). | Tax (yields safety). |
  | **Opt-Out Consequence** | Assumed low quality. | Assumed uncommitted/deviant. |
  | **Stability** | Stable as long as costs vary by type. | Stable due to coordination failure. |

  ### 5. Conclusion

  You are observing **Hygiene Signaling within a Multi-polar Trap**.

  The peacock's tail is a **weapon of competition**. What you are describing is a **toll gate for entry**. The industry has collectively agreed that the toll is "visible responsiveness," but because everyone pays it, it buys no advantage—it only buys the right to stand in the arena.

  The reason it has no name is that economic theory generally assumes rational actors will eliminate wasteful pooling equilibria. The fact that they don't suggests that the *true* product being transacted is not "consulting advice" or "academic rigor," but **social cohesion and risk mitigation**. The midnight email isn't for the client; it's for the Partner, to prove that the hierarchy still holds. The wedding spending isn't for the couple; it's for the families, to prove they haven't lost status.

  The display is not about quality anymore. It is about **submission to the ritual**. And because the ritual is the glue holding the institution together, opting out is not seen as efficiency; it is seen as betrayal.
