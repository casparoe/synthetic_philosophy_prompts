          *   *Status:* Non-negotiable.

  4.  **Identifying Tensions (The "Hard Part"):**
      *   *Tension A:* Truth-Value Independence (Req 1) vs. Normative Discrimination (Req 6). How do we call something "harmful" without checking if their beliefs are false or lead to bad outcomes (which often relies on truth)?
      *   *Tension B:* Inter-subjective Detectability (Req 5) vs. Earned Distrust (Req 4). To an outsider, "earned distrust" looks exactly like "paranoid closure." Distinguishing them requires context the outsider might not have.
      *   *Tension C:* Structural vs. Individual. Hard to measure group-level epistemic properties without aggregating individual data, which might blur the line.

  5.  **Refining the Language (British English):**
