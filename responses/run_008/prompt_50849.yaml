      *   *Requirement 2: Structural Distinction (Bubble vs. Echo Chamber).* Must distinguish *Sheltered* (don't hear it) from *Sealed* (hear it but reject it).
          *   *Consideration:* User's distinction between "cut off" vs. "trained to distrust."
          *   *Status:* Non-negotiable. This is the core phenomenological difference.

      *   *Requirement 3: Agent/Structure Distinction.* Is it the group's doing or the individual's?
          *   *Consideration:* User mentioned "feature of the group as a whole versus a feature of individual members."
