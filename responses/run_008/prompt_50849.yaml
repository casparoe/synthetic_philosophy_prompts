          *   *Status:* Non-negotiable. Otherwise, the theory pathologises survival strategies.

      *   *Requirement 5: Inter-subjective Detectability.* Can an outsider use this without already knowing who is right?
          *   *Consideration:* User asked for a criterion usable by people who "do not already agree about which side is mistaken."
          *   *Status:* Non-negotiable (but potentially problematic).

      *   *Requirement 6: Normative Discrimination.* Must distinguish harmful closure from benign cohesion.
