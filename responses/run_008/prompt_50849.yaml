  9.  **Final Polish:** (Mental check of British spelling: *behaviour, programme, analyse, centre, favour, modelling, labelled*).

      *(Self-Correction during drafting)*: I need to be careful not to simply regurgitate C. Thi Nguyen's "Echo Chambers vs. Epistemic Bubbles" though it is clearly the underlying academic reference. I must frame it through the user's specific philosophical constraints (especially the "earned distrust" and "detectability" angles).

      *Refining the Tension:* The biggest tension is between "Outsider Accessibility" and "Rational Paranoia." If I am an outsider, I cannot easily know if distrust is earned. If the theory requires me to know that to judge the group, it fails the accessibility test. This is the crucial insight to highlight.

