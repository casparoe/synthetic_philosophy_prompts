  ### Candidate Decision Rules

  Based on the track record (1–6), two primary rules survive. Both reject exit options as cures for unfreedom (verdicts 1 & 4) and both reject benevolence or low probability of interference as cures (verdicts 1 & 3). They diverge on what neutralizes the threat.

  **1. The Domination Rule (Pettit-style)**
  *   **Definition:** An agent is unfree if another agent has the *capacity* to interfere arbitrarily in their choices. "Arbitrary" means interference not forced to track the interests or opinions of the interferee. Institutional checks render interference non-arbitrary by forcing it to track interests/procedures.
  *   **Fit:** Accommodates 1, 3, 4 (capacity exists). Accommodates 2, 5, 6 (checks render power non-arbitrary).
  *   **Awkward Fit:** Verdict 5 ("free... despite residual discretion"). Strict domination theory often struggles with *residual* discretion; if the tribunal leaves *any* room for arbitrary choice, domination technically remains. The friend's willingness to call this "free" suggests she cares more about the *presence* of the check than the total elimination of arbitrary capacity.

  **2. The Recourse Rule (Effective Counterweights)**
  *   **Definition:** An agent is unfree if they lack access to an *effective institutional mechanism* to contest interference. Exit does not count as a mechanism. The actual capacity of the interferer matters less than the availability of recourse.
  *   **Fit:** Accommodates 1, 3, 4 (no recourse). Accommodates 2, 5, 6 (recourse available).
  *   **Awkward Fit:** Verdict 3. The friend notes the power is politically impossible to use. A pure Recourse Rule might argue that if the political cost is high enough, the "mechanism" of political pressure is effective. She explicitly rejects this ("political impossibility... irrelevant"), demanding formal institutional review.

  **3. A Third Candidate: The Status Rule**
  *   **Definition:** Unfreedom is a matter of *standing*. If you are subject to the will of another (vertical relationship), you are unfree. If you are subject only to the law (horizontal/status-equal relationship), you are free.
  *   **Fit:** Explains the "standing" comment in Verdict 1. Explains why the Co-op (a) might be tricky (member vs. assembly).
  *   **Status:** Subsumed by the Recourse Rule in this dataset, as "status" is operationalized via the presence of legal review (Case 6 vs. Case 3).

