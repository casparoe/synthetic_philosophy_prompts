      *   "If some subset of the desiderata is jointly unsatisfiable, say so explicitly."
      *   "Briefly, run three familiar tests against the list."

      *Decision:* I will argue that **Operationalizability** + **Historical Sensitivity** + **Non-Domination** form an inconsistent triad for a third-party agent. This validates the user's suspicion.

