  *(Self-Correction on the "Drop" recommendation)*: Many philosophers think dropping "No Arbitrary Cutoffs" is the least costly (Epistemicism). Others think dropping "Counting" is best (Contextualism). I will argue that dropping the *ontological weight of Counting* is the most viable because counting is pragmatic, whereas logic and physics are foundational.

