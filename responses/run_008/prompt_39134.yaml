      *   *Gradual Beginnings:* This is the clash between Req 6 (No Sharp Lines) and the Law of Excluded Middle (Exists or Doesn't).
      *   *Sortal Drift:* This tests Req 7 against Req 2. Does the *object* survive or just the matter?

