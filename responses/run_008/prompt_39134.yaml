answer: |-
  Here is the specification list for an adequate theory of material constitution, distinguished by logical necessity versus theoretical preference, followed by the inconsistency analysis and the brief evaluation of existing views.

  ### The Specification List

  **1. Semantic Validity (Non-Negotiable)**
  *   **Requirement:** Terms like "the statue" and "the clay" must successfully refer to distinct semantic values.
  *   **Source:** Philosophy of language. If a theory entails that ordinary singular terms fail to refer (without a robust error theory), it makes communication inexplicable.
  *   **Constraint:** The theory cannot treat "statue" as a mere facon de parler if "clay" is treated as an object, unless it eliminates both.

  **2. Persistence Differentiation (Non-Negotiable)**
  *   **Requirement:** The constituting object (clay) and the constituted object (statue) must have different modal and temporal profiles. The clay survives squashing; the statue does not.
  *   **Source:** The data of the puzzle. If persistence conditions are identical, there is no puzzle, just a synonymy.
  *   **Constraint:** Leibniz's Law must be respected or explicitly modified. You cannot have $a=b$ if $a$ has a property $b$ lacks.

  **3. Physical Compatibility (Non-Negotiable)**
  *   **Requirement:** The theory cannot contradict established physics regarding impenetrability and boundaries.
  *   **Source:** Natural science. Two material objects cannot occupy the same exact spatial coordinates at the same time unless the theory redefines "object" or "space."
  *   **Constraint:** No sharp natural boundaries at the micro-level (atoms/quantum fields are the only sharp boundaries).

  **4. Sortal Sensitivity (Non-Negotiable)**
  *   **Requirement:** Identity and persistence must track functional or kind-based changes (Sortal Drift).
  *   **Source:** Tracking practices. A church becoming apartments involves a change in identity conditions despite material continuity.
  *   **Constraint:** The theory must explain survival through functional loss/gain without appealing to magic. It must work bidirectionally (consecration and deconsecration).

  **5. Counting Intuition (Camp Preference)**
  *   **Requirement:** There is "one thing" on the pedestal, not two.
  *   **Source:** Pre-theoretic common sense.
  *   **Status:** *Negotiable.* This is the primary casualty in most solutions. It conflicts directly with Persistence Differentiation + Leibniz's Law. If the statue and clay differ in properties, they are two things. Demanding they be "one thing" is a pragmatic demand, not a metaphysical one.

  **6. No Overgeneration (Camp Preference)**
  *   **Requirement:** The theory should not proliferate objects arbitrarily (e.g., "statue-minus-one-atom," "trout-turkey").
  *   **Source:** Ontological parsimony (Occam's Razor).
  *   **Status:** *Negotiable.* This conflicts with Semantic Validity. If every referring term picks out an object, and we can refer to arbitrary sums, we get explosion. Restricting this requires a principled cutoff, which leads to Requirement 7.

  **7. No Arbitrary Cutoffs / Vagueness Compatibility (Camp Preference)**
  *   **Requirement:** There should be no precise moment when a statue comes into existence during gradual construction.
  *   **Source:** Intuitions about vagueness and the nature of existence ("existence doesn't come in degrees").
  *   **Status:** *Negotiable.* This conflicts with Classical Logic (Bivalence). Either the statue exists at layer $n$ or it doesn't. Denying a fact of the matter requires non-classical logic (supervaluation, degrees of truth) or accepting epistemicism (there is a fact, we just can't know it).

  ---

  ### The Inconsistency and The Drop

  **The Verdict:** The full specification list is **jointly unsatisfiable**.

  You cannot hold **Persistence Differentiation** (Req 2), **Counting Intuition** (Req 5), and **Classical Logic** (implicit in Req 7) simultaneously.
  1.  If Statue $\neq$ Clay (due to different persistence), there are **two** things.
  2.  If there are **two** things, Counting Intuition is false.
  3.  If you force them to be **one** thing (Relative Identity), you violate Leibniz's Law (Req 2).
  4.  If you try to hide the difference via Vagueness (Req 7), you violate Bivalence or introduce Arbitrary Cutoffs (violating the "No Arbitrary Cutoffs" clause of Req 7).

  **Which to Drop:** Drop **Counting Intuition (Req 5)** as an ontological constraint.

  **Reasoning:** Counting is context-sensitive and pragmatic, not metaphysical. When we say "there is one thing on the pedestal," we are answering a practical question about occupancy or attention, not performing a metaphysical census of substances. Physics (Req 3) and Logic (Req 2) are foundational frameworks; if they say there are two coinciding entities with different modal profiles, we must accept two entities. Preserving the "one thing" intuition forces distortions in logic (Relative Identity) or physics (Coincidence). It is less costly to admit that ordinary counting is loose talk than to rewrite the laws of identity or matter.

  **Secondary Trade-off:** Regarding **Gradual Beginnings (Req 7)**, you must also drop "No Arbitrary Cutoffs" in favor of **Semantic Contextualism**. The cutoff isn't in the world (physics); it's in the word usage. The object exists when our linguistic conventions say it does. This preserves "existence doesn't come in degrees" (the object either exists or doesn't relative to a context) without positing magical sharp boundaries in nature.

  ---

  ### Quick Pass: Existing Views

  **Relative Identity**
  Saves Counting Intuition by claiming identity is sortal-relative (statue = clay relative to "constituted matter," but not relative to "statue"). It eats Logical Consistency, as it requires rejecting the standard Indiscernibility of Identicals, making formal reasoning about objects notoriously difficult.

  **Four-Dimensionalism**
  Saves Persistence Differentiation and Physics by treating objects as spacetime worms that overlap temporarily. It eats Counting Intuition and "Wholeness," as it implies the statue and clay are distinct temporal entities that merely share a temporal slice, contradicting the sense that they are the same *current* object.

  **Eliminativism (Nihilism)**
  Saves Physics and No Overgeneration by denying composite objects exist at all (only simples exist). It eats Semantic Validity and Common Sense, requiring an error theory where all talk of "statues," "persons," and "ships" is strictly false, which is pragmatically unsustainable.

  **Plain Coincidence**
  Saves Persistence Differentiation and Semantics by asserting two distinct objects literally occupy the same space. It eats Physical Compatibility, as it violates the principle of impenetrability, and fails Counting Intuition by insisting there are robustly two things where we see one.
