answer: |-
  "Session's dead," Mark said, signaling the bartender. "Best thing all day. Nobody knows what meaning is."

  Ellie swirled her whiskey. "Exactly why we need to talk. Look at these field notes from the new contact group in the basin. Classic *gavagai* setup, but messier." She slid a napkin across the table. "They say *gavagai* when a rabbit runs past. Never when it's still eating. They use *bogoi* for pelts and also for clouds shaped like rabbits. And here's the kicker: when shown a photo of a rabbit, they assent to *gavagai* only if you slide the photo across the screen. Static photo? Nothing."

  Mark glanced at the napkin. "So it's polysemy. *Gavagai* means 'rabbit,' but it's lexically specified for motion in certain contexts. Like 'vehicle' implies transport, but you can park a car. The cloud thing is metaphor. You just need better syntactic distribution tests."

  "That's the Chomskyan optimism," Ellie said. "I say the evidence underdetermines the ontology. Maybe *gavagai* doesn't mean 'rabbit.' Maybe it means 'rabbit-stage' or 'undetached rabbit part.' The sliding photo suggests it's not the object they're tracking, but the *motion-event*. You can build a translation manual where *gavagai* means 'temporal slice of rabbithood' and it fits all the behavioral dispositions perfectly."

  "Until you ask them to count," Mark said. "Ask 'How many *gavagai*?' If they say 'two' when two rabbits run by, you've got individuation. You've got objects. Your 'rabbit-stage' manual collapses because stages aren't counted like objects unless you have a sortal. Universal Grammar provides the sortal structure. The poverty of the stimulus means they didn't learn object-individuation from the data; they brought it with them. All languages are cut from the same cloth."

  Ellie leaned in. "Here's where you owe me. Why isn't the counting test open to the same reinterpretation? If they hold up two fingers, my manual says they're assenting to 'two instances of rabbit-stuff.' I reinterpret the counting behavior itself. The disposition to hold up two fingers is compatible with counting objects *or* counting pieces of stuff. You assume 'two' means 'two objects,' but that's just your manual projecting individuation onto their syntax."

  "Because the syntax isn't neutral," Mark countered. "If *gavagai* takes plural markers distinct from mass nouns, UG constrains the hypothesis space. You can't just reinterpret the plural marker as 'pieces' without breaking the grammatical system. The innate structure forces a convergence. If the data gets rich enough—compounding, negation, embedding—the indeterminacy dissolves. What you call radical indeterminacy is just missing data plus ordinary lexical ambiguity."

  "But why doesn't that innate structure constrain the semantics enough to kill the underdetermination?" Ellie pressed. "You admit the syntax is formal. It says 'count noun,' not 'rabbit.' I can map your count noun syntax to an ontology of events instead of objects. The syntax stays the same; the ontology shifts. Your UG tells us how they combine words, not what those words latch onto in the world. The beam of reference stays inscrutable."

  Mark paused, tapping his glass. "Because the interface between syntax and semantics is biologically fixed. We don't just have syntax; we have a conceptual-intentional system. If their brain is like ours, they carve the world into objects and events similarly. If you posit a manual where they don't distinguish objects from events at the conceptual level, you're positing a different psychology, not just a different translation."

  "And if the psychology is behaviorally identical?" Ellie asked. "Then there's no fact of the matter. You're saying the fact is in the brain state. I'm saying the fact is in the behavior. We're not arguing about rabbits, Mark. We're arguing about what counts as a fact."

  Mark sighed, signaling for another round. "Fine. No fact of the matter about the facts. But until you show me a manual that handles the compounding data without smuggling in English ontology, I'm sticking with objects."

  "And I'll stick with the inscrutability," Ellie said, clinking her glass against his. "But I'll drink to the data."
