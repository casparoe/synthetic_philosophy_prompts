answer: |-
  ### 1. Mapping Bentham's Argument onto the Episode

  To map Bentham's 1785 reasoning onto the 1950s debate, we must distinguish between the *structure* of the arguments and their *foundations*.

  **The Wolfenden Committee** operated on a jurisdictional distinction: the law exists to preserve public order and decency, not to intervene in the private lives of citizens unless public offense is given. This is a pragmatic boundary-drawing exercise. Bentham's argument is structurally similar in outcome (keep law out of private acts) but distinct in foundation. Bentham does not argue from a sphere of "privacy" rights; he argues from the *substance* of the act. For Bentham, the act is not criminal because it produces no net pain, not because it occurs in a protected zone. Wolfenden leaves open the possibility that if public sentiment were sufficiently offended, the law might intervene. Bentham closes this door: unless the "offense" translates to demonstrable pain outweighing the pleasure of the act, it is irrelevant.

  **H. L. A. Hart** argued from the Millian harm principle: the only purpose for which power can be rightfully exercised over any member of a civilized community, against his will, is to prevent harm to others. This aligns closely with Bentham's conclusion but diverges in mechanism. Hart's argument is quasi-deontological; it posits a limit on state authority based on liberty. Bentham's argument is purely consequentialist. For Hart, moral outrage is categorically distinct from harm. For Bentham, moral outrage is merely a psychological fact (a pain in the observer) that must be weighed against the pleasure of the actor and the pain of punishment. Bentham explicitly categorizes this outrage as "antipathy"—a prejudice dressed as principle. Hart treats it as a sentiment that lacks justificatory power; Bentham treats it as a calculation error where the pains of the majority (disgust) are falsely privileged over the pains of the minority (punishment).

  **Lord Devlin** argued that society is held together by a shared morality, and the law must enforce that morality to prevent disintegration. This is alien to Bentham's framework. Bentham treats "society" as a fictional body; only individuals feel pain and pleasure. Therefore, "social cohesion" is not an intrinsic good but an instrumental one. It is valuable only insofar as it secures individual happiness. Devlin treats the erosion of morality as a harm in itself. Bentham would classify this as a "mispriced expectation of harm." Unless Devlin can demonstrate that specific immoral acts lead to specific secular damages (e.g., economic collapse, violence), the appeal to "society" is, for Bentham, metaphysical nonsense.

  **The Critical Divergence:** The difference matters in the handling of "offense." Hart's harm principle struggles with the boundary between harm and offense. Some interpretations allow law to prevent severe offense. Bentham's calculus is stricter: offense is a pain, but it is weighed against the pain of criminalization. If the offender can simply look away, the pain is low; if the state punishes, the pain is high (loss of liberty, stigma). Bentham's ground rejects the enforcement of popular moral sentiment *even if* that sentiment causes genuine discomfort, provided that discomfort is less than the pain of punishment. Hart's ground protects liberty; Bentham's ground maximizes net pleasure. In this specific episode, they converge, but Bentham provides a more radical tool for dismantling the "antipathy" Devlin relies on, by refusing to grant it principled status.

  ### 2. Bentham's Verdict on the Sexual Offences Act 1967

  Bentham's method requires a calculation of the specific pains and pleasures introduced by the legislation as passed. The Act decriminalized acts for men over 21 in private, while maintaining the age of 16 for heterosexual acts.

  **The Asymmetry:** A Benthamite analysis must ask: Does the differential age of consent prevent a specific pain that justifies the restriction?
  1.  **Protection from Harm:** If the higher age limit were based on evidence that men aged 16–20 are uniquely vulnerable to coercion or psychological damage from homosexual acts compared to heterosexual acts, the calculus might support it. The historical record provided no such evidence. Therefore, Bentham would classify this as a "mispriced expectation of harm." The legislature is inflicting a certain pain (restriction of liberty) to prevent a hypothetical harm that has not been empirically established.
  2.  **Stigma as Pain:** The calculus can see the pain of stigma. By marking homosexual acts as distinct and more heavily regulated, the law inflicts a specific pain of inequality and social degradation on the affected group. Bentham's framework counts this pain directly. It is a "pain of restraint" and a "pain of reputation."
  3.  **The Verdict:** Bentham would condemn the asymmetry. It creates a net loss of happiness: it subtracts the pleasure of consenting men aged 16–20 and adds the pain of stigma, without adding a countervailing security or pleasure to others.

  **Can the Framework See It?** The theory does not fail to see this. Utilitarianism is capable of registering the pain of inequality and stigma. However, it lacks the vocabulary of *rights* to explain why the asymmetry is *unjust* in a non-calculative sense. It condemns the asymmetry because it is *inefficient* (creates pain without gain), not because it violates a principle of equal liberty.
  **Comparison with the Millian Route:** The Millian route that won the day handles this potentially better in a legal context. By framing the issue as one of equal liberty and privacy, Hart's approach makes the asymmetry look like a violation of a right. Bentham's approach makes it look like a legislative error in accounting. Both reach the conclusion that the Act is flawed, but Bentham's verdict rests on the empirical claim that the extra restriction produces no utility. If a legislator could prove that allowing men at 16 to engage in homosexual acts *did* cause more social pain than allowing women at 16 to engage in heterosexual acts, Bentham would have to accept the asymmetry. Mill would likely still reject it as a violation of liberty. Thus, Bentham's framework is more vulnerable to empirical manipulation, though in this specific historical instance, the empirical case for asymmetry was nonexistent.

  ### 3. Evaluating Devlin's Claim on Bentham's Terms

  Devlin's central claim—that eroding shared morality dissolves society—is, on Bentham's method, not a moral axiom but an empirical hypothesis. It posits a causal chain: Tolerance of Vice $\rightarrow$ Erosion of Shared Morality $\rightarrow$ Disintegration of Society $\rightarrow$ Massive Pain for Individuals.

  **The Burden of Proof:** A legislator in 1967 equipped only with the calculus would need to establish the probability and magnitude of the final link: "Disintegration of Society." Bentham requires specific, assignable pains. "Society" cannot suffer; only individuals can. Therefore, Devlin must show that tolerating homosexuality leads to specific, measurable harms (e.g., rise in violence, breakdown of contract, family collapse leading to poverty) that outweigh the pains of criminalization.

  **The Evidence in 1967:**
  1.  **Wolfenden Findings:** The Committee found no evidence that homosexual acts undermined marriage or population.
  2.  **Historical Precedent:** Bentham would look for instances where decriminalization led to collapse. None existed.
  3.  **The Calculation:**
      *   *Pain of Criminalization:* Certain, immediate, measurable (imprisonment, blackmail, suicide).
      *   *Pain of Tolerance (Devlin's Claim):* Hypothetical, distant, unmeasured.

  **Bentham's Verdict:** On Bentham's own terms, Devlin's claim fails for lack of evidence. The calculus demands that we weigh a certain present pain against a speculative future pain. Without empirical data showing that moral heterogeneity causes social collapse, the legislator must treat the risk as negligible. To punish based on Devlin's claim is to inflict certain misery to avert a phantom danger.

  **Could it have been established?** In 1967, nothing could have established it either way, as it is a long-term sociological claim. However, the burden of proof lies on the punisher. Since the pain of punishment is immediate and the pain of disintegration is theoretical, the calculus dictates inaction. Bentham takes the threat seriously *in principle* (if society did collapse, the pain would be immense) but rejects it *in practice* due to the absence of proof. This forces Devlin's argument onto the ground of social science, where it was undefended in the 1950s.

  ### 4. The Uncomfortable Result: Theory, Silence, and Social Power

  The historical fact is that Bentham completed the argument in 1785 but suppressed it. He calculated that publishing would damage the reception of utilitarianism and his own reputation, thereby reducing his capacity to do good in other areas. He applied the calculus to the *publication* of the theory and found it wanting.

  **The Theoretical Implication:** This shows that utilitarianism can identify the morally correct action (decriminalization) while simultaneously prescribing political silence about it. The theory is cognitively sufficient to find the truth but politically inert if the social cost of speaking the truth is too high. It creates a paradox: the theory demands the maximization of happiness, but the strategy for achieving that may require concealing the theory's own conclusions.

  **Conceding Devlin's Premise:** This outcome concedes a significant portion of Devlin's premise. Devlin argued that law is bound by shared morality because that morality constitutes society. Bentham's silence confirms that *effective* legislation is indeed bound by shared morality, not because it is right, but because it is powerful. Bentham recognized that "antipathy" is a social fact that generates real pain (for the reformer, for the movement). By withholding the essay, Bentham acknowledged that the "shared morality" Devlin described acts as a constraint on rational reform.

  **The Limit of the Theory:** This suggests that utilitarianism lacks an internal engine for *changing* social sentiment when that sentiment is deeply entrenched. It can critique the sentiment, but if the critique itself causes more pain (via backlash) than the injustice it addresses, the theory mandates acquiescence. The work was eventually done in the 1960s not because Bentham's calculus suddenly became more valid, but because the social facts changed: the "antipathy" weakened, altering the calculation of consequences for the Wolfenden and Hart generation.

  **Conclusion:** The episode demonstrates that while Bentham's theory is a superior instrument for *analyzing* the justice of a law, it is not necessarily a superior instrument for *achieving* justice in the face of entrenched prejudice. The "right conclusion" arrived 180 years early but remained inert. The "Millian gate" succeeded later not because it was more logically robust than Bentham's, but because it arrived when the social costs of opening it had decreased. This validates Devlin's descriptive claim (morality holds society together and constrains law) while vindicating Bentham's normative claim (that morality should not constrain law *unless* it prevents harm). The tragedy is that Bentham's own method forced him to accept Devlin's descriptive reality, delaying the normative victory.
