answer: |-
  Here is the battle plan. You are not teaching biology; you are teaching epistemology using biology as the prop. Your goal is to move them from *literalism* (DNA is code) to *instrumentalism* (Calling DNA code is useful for specific tasks).

  ### 1. The Prerequisite: Define "Code" Before You Define "DNA"
  You cannot ask if DNA is a code if they think "code" just means "secret message" or "computer magic." You must establish the **Triad of Information** in the first 5 minutes. Write this on the board:

  1.  **Symbol:** A shape that stands for something else (arbitrary).
  2.  **Interpreter:** A machine that translates the shape into action.
  3.  **Convention:** The agreement that *this* shape means *that* action.

  **The Test:** Show them a red traffic light.
  *   Is it code? Yes. (Red = Stop).
  *   Why? Because we agreed it means stop. The physics of red light doesn't physically force your foot onto the brake pedal. The *interpreter* (you, the driver) does that.
  *   **Contrast:** Show them a steep cliff.
  *   Is "Cliff = Don't Walk" code? No. It's physics. If you walk, you fall. The environment enforces the consequence, not an agreement.

  **Why this matters:** If DNA is a code, the cell must be *interpreting* symbols. If DNA is chemistry, the cell is just *reacting* to shapes. This distinction is the only thing that matters for the next 35 minutes.

  ### 2. The Single Concrete Example: The "Stop" Codon
  Do not use the whole genome. Do not use CRISPR. Use **UAA (The Stop Codon).**

  **Why this example:**
  *   **It looks like syntax:** It's punctuation. It means "End the sentence."
  *   **It reveals the mechanism:** In "code" language, the ribosome reads "UAA" and understands "Halt." In "chemistry" language, the ribosome encounters a shape (UAA) for which there is no matching tRNA key, so a different protein (Release Factor) falls into the gap by physical affinity and knocks the protein chain off.
  *   **It carries the weight:** It allows you to pivot between "Command" (Code) and "Collision" (Chemistry).

  **How to run it (Minutes 5–20):**
  1.  **The Code View:** Describe translation. The ribosome moves down the mRNA. It hits UAA. The protein is finished. It looks like a period at the end of a sentence.
  2.  **The Chemistry View:** Ask: "Does the ribosome *know* it's the end?" No. There is no tRNA with the anticodon for UAA. The slot stays empty. A Release Factor protein, which happens to fit that empty shape, bumps in there. Because it fits, it triggers a hydrolysis reaction. The chain falls off.
  3.  **The Pivot:** "In my book, my character calls this a 'bug fix.' But a bug implies a rule was broken. Here, no rule was broken. A shape just didn't fit another shape."

  ### 3. Misconceptions & Interception Points
  They will walk in with two specific bugs in their thinking. You must patch them before they crash the session.

  **Misconception A: Anthropomorphism ("The DNA knows what to do")**
  *   **When it happens:** Minute 10, when you describe the ribosome "reading" the mRNA.
  *   **The Fix:** Ban the word "Read." Replace it with "Bind."
  *   **Script:** "I just said the cell 'reads' the DNA. That was me being a writer. Biologically, nothing is reading. Things are sticking together because of electrostatic attraction. If you heat it up too much, the 'reading' stops, not because the cell got confused, but because the glue melted."

  **Misconception B: Teleology ("A code needs a coder")**
  *   **When it happens:** Minute 20–25. This is the Ohio AP Bio minefield. A student will ask, "If it's code, who wrote it?"
  *   **The Fix:** Separate *Origin* from *Function*.
  *   **Script:** "That is a question for a theology or evolution class, not today. Today we are asking: Does it *act* like a code? A river carves a canyon without a planner. We can call the canyon a 'path' without assuming someone paved it. We are analyzing the mechanism, not the author."
  *   **Why this works:** It validates the question without letting it hijack the lesson into Intelligent Design territory.

  ### 4. The Closing Question (The Assessment)
  Do not ask them to define code. Ask them to apply the distinction.

  **The Question:**
  *"If you took a strand of DNA and put it in a glass test tube with no cells, no ribosomes, and no enzymes, is it still a blueprint? Or is it just a string of chemicals?"*

  **What you're looking for:**
  *   **They didn't get it:** "It's still a blueprint because the information is inside the DNA." (They think information is an inherent physical property like mass).
  *   **They got it:** "It's just chemicals. A blueprint is useless without a builder. The 'code' only exists when the cellular machinery is there to interpret it." (They understand information is relational, not intrinsic).

  ### 5. Boundaries: What to Flatly Refuse
  You are a novelist, not a bioethicist or a theologian. There are two rabbit holes you must seal off in your opening remarks.

  **1. "Can we edit humans like software?" (The Gattaca Question)**
  *   **Why:** It leads to eugenics debates you can't solve in 40 minutes.
  *   **How to say it:** "My novel explores the *metaphor* of debugging life. Whether we *should* debug life is a question for ethicists and policymakers. Today we are only asking if the metaphor is scientifically accurate."

  **2. "Does this prove/disprove God?" (The Coder Question)**
  *   **Why:** It shuts down critical thinking and puts you in a political crossfire.
  *   **How to say it:** "Science describes *how* systems work, not *why* they exist. We can discuss whether DNA behaves like language without discussing who, if anyone, spoke it into existence. Let's keep the focus on the mechanics."

  ### 6. The Overreach Warning (Your Occupational Disease)
  **The Trap:** You will be tempted to say something like: *"The genome whispers its secrets to the ribosome,"* or *"The cell struggles to interpret the error."*

  **Why it's dangerous:** It reinforces the exact misconception you are trying to dismantle. It gives agency to the chemistry. It makes the metaphor literal.

  **The Catch:** Whenever you feel the urge to make the biology sound *poetic*, force yourself to make it sound *mechanical*.
  *   Instead of "The gene expresses itself," say "The protein was synthesized."
  *   Instead of "The DNA holds the instructions," say "The DNA holds the sequence."
  *   **Mantra for the day:** "Chemistry is not a conversation."

  ### Summary Timeline
  *   **00–05:** The Traffic Light vs. The Cliff. (Code vs. Causality).
  *   **05–20:** The Stop Codon. (Syntax vs. Shape).
  *   **20–25:** The "Coder" Question. (Function vs. Origin).
  *   **25–35:** Why it matters. (If it's code, we debug. If it's chemistry, we engineer).
  *   **35–40:** The Test Tube Question. (Assessment).

  You are there to break their intuition, not feed it. If they leave thinking "DNA is complicated code," you failed. If they leave thinking "Calling DNA code is a useful lie," you succeeded.
