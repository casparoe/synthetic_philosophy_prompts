          *   *Pushback/Nuance:* Classical autopoiesis (Maturana/Varela) was strictly biological/chemical. They might reject a mechanical system. But *functional* autopoiesis accepts it. Also, does it produce its *own* organization or just copy a static template? Autopoiesis is about self-production of the *process*, not just copying a structure. If the factory just follows a rigid script, is it organizationally closed? Let's assume it is robust enough to count.
      *   **Comparing Intuitions:**
