          *   *Verdict:* Not alive.
          *   *Nuance:* The prompt asks to push back on the "no evolution" claim. Does error correction count as selection? Selection usually implies *differential survival/reproduction of variants*. If variants are eliminated *before* reproduction is complete, is that selection? It's more like proofreading. If no heritable variation exists, evolution cannot happen.
