          *   *Victim Acknowledgement:* Retributivism is agent-centered (focus on the wrongdoer getting their due). The TRC focused heavily on the *victim's* voice. This shifts the axis.
          *   *Fit:* Poor fit, unless the definition of "punishment" is stretched to include public shaming or moral condemnation. But even then, the *legal* immunity violates the retributive demand for legal justice.

      *   **Silences and Misdescriptions (The Critical Analysis):**
