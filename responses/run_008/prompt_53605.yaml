  5.  **Final Polish:** Ensure clear headings and logical flow. (Proceed to generate output based on these thoughts).

      *   *Key Insight to emphasize:* The TRC wasn't just about punishment; it was about *regime change*. Standard penal theory assumes a legitimate state. The TRC was building legitimacy. This is a boundary condition failure for standard theories.

  6.  **Final Output Structure:**
