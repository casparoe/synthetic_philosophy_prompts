          *   *The Asmetry Problem:* Worst offenders had the most to hide, thus the most incentive to apply. This creates a "perverse incentive" structure. Consequentialism might accept this if the net utility holds. Retributivism finds this abhorrent (justice inverted).
          *   *Political vs. Ordinary Crime:* Both theories struggle with the "political objective" clause. Is a political murder different from a common murder? Retributivism says murder is murder. Consequentialism says context matters for future stability.
          *   *The "Silence":* Neither theory adequately handles *collective* guilt/responsibility. The TRC was about national healing, not just individual justice.

      *   **What the Episode Shows About the Theories:**
          *   *Consequentialism:* Confirmed in its flexibility, but risks the "tyranny of the greater good." It justifies the TRC well but struggles to explain why we feel uneasy about letting murderers go free.
          *   *Retributivism:* Exposed as potentially rigid. In a transitional context, strict retribution might be self-defeating (no state to punish). It shows retributivism assumes a stable background order which didn't exist.
