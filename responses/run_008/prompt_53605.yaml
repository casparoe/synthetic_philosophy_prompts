          *   *Design Logic:* The trade-off is purely instrumental. Amnesty is the *price* paid for Truth and Peace. It follows directly from cost-benefit analysis. If $N$ prosecutions risk war, and Amnesty buys peace + truth, Amnesty wins.
          *   *Fit:* Very strong fit. The TRC was explicitly justified by its architects (Tutu, Boraine) in consequentialist terms ("no peace without forgiveness," "no future without truth").

      *   **Retributivist Mapping:**
