answer: |-
  You have put your finger on the central nerve of the modern Maxwell's Demon literature. Your intuition is correct: the Second Law is being protected by a specific argumentative maneuver that blurs the line between empirical physics and definitional bookkeeping.

  There is no single, universally agreed-upon noun for this move (like "The Adiabatic Fallacy"), but in the philosophy of statistical mechanics, it is analyzed under three overlapping concepts. Depending on whether you view the move as legitimate, illegitimate, or historically inevitable, it goes by different names.

  Here is the breakdown of the terminology, the philosophical pedigree, and the boundaries you asked for.

  ### 1. The Specific Terminology: "Exorcism" Strategies
  In the definitive modern analysis by John Earman and John Norton (1998, 1999), the attempt to defeat the Demon is called an **"Exorcism."** They distinguish between two types of the move you described:

  *   **Sound Exorcism:** You identify a specific physical mechanism in the demon's apparatus (e.g., thermal noise in a sensor, dissipation in a switch) that generates entropy, derived from *independent* physical principles (like Hamiltonian dynamics).
  *   **Question-Begging Exorcism:** You assert that the entropy *must* be generated somewhere because the Second Law is assumed to be true universally.

  The move you are critiquing—where the ledger is relocated until it balances—is often flagged by Earman and Norton as risking **Question-Begging Exorcism**. If the only reason we posit a cost in the memory erasure (Landauer's Principle) or the measurement (Szilard) is to save the Second Law, rather than deriving it from the microdynamics alone, the law has ceased to be a physical constraint and become a tautology.

  ### 2. The Broader Philosophical Label: "Conventionalism"
  If you want the historical-philosophical name for "saving a conservation law by expanding the accounting boundary," it is **Poincaré's Conventionalism**.

  Henri Poincaré argued that principles like the Conservation of Energy start as empirical generalizations. However, when faced with counterexamples, scientists posit new forms of energy (chemical, nuclear, mass-energy) to keep the sum constant. Eventually, the principle ceases to be an empirical claim about the world and becomes a **definition** of how we choose to account for interactions. It becomes true by convention, not by fact.

  Your observation about the Second Law is exactly this. By insisting that *any* apparent violation implies an uncounted entropy cost elsewhere (in the information, the correlation, the environment), the Second Law is transformed from a **synthetic** statement (contingent on how the universe works) to an **analytic** statement (true by the definition of "isolated system" and "entropy").

  ### 3. Defining the Edges: Where is the Line?
  You asked for the edges of this thing—how to distinguish it from legitimate boundary drawing or auxiliary hypotheses. Here is the demarcation:

  **A. Distinct from Ordinary Auxiliary Hypotheses**
  *   **Auxiliary Hypothesis:** "The sensor has a mass of $m$ and temperature $T$." This is independently testable. You can measure the sensor without reference to the Second Law.
  *   **The "Move" (Conventionalist Rescue):** "The sensor *must* dissipate $k_B T \ln 2$." If this dissipation is posited *solely* because the Second Law demands it, rather than derived from the specific Hamiltonian of the sensor, it is not an auxiliary hypothesis; it is a **consistency condition**.

  **B. Distinct from Honest Boundary-Drawing**
  *   **Honest Boundary:** Thermodynamics requires an isolated system. If you draw the boundary around the gas but exclude the piston, you have made a category error. Correcting this is just doing thermodynamics correctly.
  *   **The "Move":** The boundary is expanded *retroactively* to include whatever degree of freedom is currently carrying the negative entropy. If the boundary definition depends on the *outcome* of the calculation (i.e., "The system is whatever size is required to make $\Delta S \geq 0$"), it is the maneuver you identified.

  **C. Distinct from Moving the Goalposts**
  *   **Moving Goalposts:** A fallacy where criteria for success are changed arbitrarily.
  *   **The "Move":** In the Landauer-Bennett resolution, the "goalpost" (the cost of erasure) is derived from statistical mechanics (Liouville's theorem, phase space compression). Proponents argue this is **not** moving the goalposts because the cost is **physical**, not stipulative.
  *   **The Counter-Critique:** Philosophers like Meir Hemmo and Orly Shenker (2012) argue that Landauer's Principle itself relies on assumptions that effectively presuppose the Second Law. If they are right, then the "Move" *is* a sophisticated form of moving the goalposts, disguised as information theory.

  ### 4. Why It Feels Different from Duhem-Quine
  You are right to separate this from Duhem-Quine.
  *   **Duhem-Quine:** Concerns *falsification*. We have a web of beliefs; experiment contradicts prediction; which belief do we drop? (Theory? Auxiliary? Observation?)
  *   **The Demon "Move":** Concerns *universality*. The defender is not choosing which belief to drop; they are asserting that the Principle (2nd Law) is a **meta-law** that governs the choice of auxiliaries. They are saying, "You cannot construct a valid auxiliary hypothesis that violates this principle."

  This shifts the Second Law from being a *theory within the game* to being a *rule of the game*.

  ### Summary Definition
  If you need a label for your notes, the most precise description of the maneuver is:

  > **The Analytic Rescue of a Conservation Principle**
  > *The strategy of preserving a universal law (like the Second Law) against counterexample by redefining the system boundary or introducing new accounting categories (like information entropy) such that the law becomes a consistency condition of the model rather than an empirically falsifiable claim.*

  **The Verdict:**
  Your skepticism is shared by a significant minority of philosophers of physics. The "Standard View" (Landauer/Bennett) claims the move is legitimate because information is physical. The "Minority View" (Earman/Norton, Hemmo/Shenker) agrees with you: that much of the literature relies on **Question-Begging Exorcisms** that render the Second Law a tautology.

  The law never loses because, in these arguments, it is no longer playing the same game as the Demon. The Demon is playing physics; the Defenders are playing bookkeeping.
