answer: |-
  You speak of ants, but you confuse the modification of a substance with the combination of distinct categories. Consider my first point: 'Horse' marks out shape. 'White' marks out color. To speak of 'white' is to speak of color; to speak of 'horse' is to speak of shape. What marks out color and shape together cannot be identical to what marks out shape alone.

  Your "big ant" fails this test. "Big" is merely a measure of the shape itself. But "white" is an attribute from an entirely different realm—color—imposed upon the shape. When you combine them into "white horse," you have created a compound name. A compound name is not identical to its simple component. If I say "white," I do not mean "horse." If I say "horse," I do not mean "white." How then can "white horse" be simply "horse"? The combination of two distinct concepts cannot be identical to one of them alone.

  Now, consider the matter of request, which reveals the truth of actual usage. If someone seeks a horse, a yellow one or a black one will do. The color is irrelevant to the request. But if someone seeks a white horse, a yellow or black one will not suffice. The color has become essential. If "white horse" were truly identical to "horse," then the request for a horse and the request for a white horse would yield the same result. They do not. Therefore, the object of the request "white horse" is not the object of the request "horse."

  You ask if I accept the reverse: that "a horse is not a white horse." In terms of names, yes! The name "Horse" is not equivalent to the name "White Horse." The category "Horse" includes yellow and black; the category "White Horse" excludes them. They are not interchangeable terms. But you mistake my purpose. I am not saying a white horse lacks the shape of a horse. I am saying the *name* "White Horse" is not the *name* "Horse."

  You call it wordplay because you wish to live in the world of loose things. I live in the world of precise names. If you allow "white horse" to be "horse," you destroy the distinction between color and form. You allow the specific to swallow the general, or the general to erase the specific. I maintain the distinction. White horse is not horse.
