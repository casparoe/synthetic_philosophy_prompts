  Hi! I'd like you to act as a professional philosopher with a specialism in social epistemology, and I'd like you to think carefully before answering — maybe start with a few lines of brainstorming where you sketch the mapping before committing to the full analysis. Please write the whole answer in British English.

  Here's the task. Take the story of Ignaz Semmelweis — the Hungarian doctor in 1840s Vienna working in the maternity wards of the General Hospital, who noticed that the clinic staffed by medical students (who came straight from dissections) had a far higher rate of childbed fever than the clinic run by midwifes, concluded that cadaveric material on the students' hands was the culprit, introduced handwashing with chlorinated lime, saw the death rate collapse, and yet was rejected by the profession, eventually left Vienna, and died in an asylum in 1865 — and analyse it as a case of epistemic injustice, specifically through Miranda Fricker's framework of testimonial and hermeneutical injustice.

  I know the textbook version, where it gets presented as a clean case of testimonial injustice: the establishment issued a deflated credibility judgement about an outsider. But here's what bugs me and what I want the analysis to really chew on. Fricker insists that the credibility deficit has to track an identity prejudice for the case to count as an injustice at all, and she's clear that being wrongly disbelieved without prejudice is not an injustice, just a kind of epistemic misfortune. And Semmelweis wasn't exactly a classic identity-prejudice target: he was a male, European, trained physician working inside the profession, not outside it. He was junior, foreign-born in Vienna, notoriously abrasive, and his claim contradicted the theoretical framework the senior professors actually believed in. So the interesting question is whether the Fricker machinery fits at all: does this come out as testimonial injustice, or as mere misfortune on her own definitions? If it doesn't fit, is that a defect in the case or in the theory — and if the theory, is the better move to loosen the identity-prejudice requirement in the direction of more structural or distributed accounts, or to keep it tight and accept that a lot of scientific rejection just isn't epistemic injustice?

  Please do the mapping properly: who counts as the hearer, what exactly the testimony was, where the credibility deficit actually sat, and whether there's any hermeneutic element in play — did people lack the concepts to even make sense of what he was claiming, given germ theory didn't exist yet? Then be honest about where the framework is silent, and don't force it to speak. Finish by saying whether the episode works as a confirmation of Fricker, an anomaly, or a kind of case her theory never really anticipated.

  (For what it's worth, I'm treating the basic facts as uncontroversial — the two clinics, the mortality gap, the handwashing, the rejection. If any point you want to make needs a more contested or fine-grained historical detail, flag that rather than building on it silently.)
