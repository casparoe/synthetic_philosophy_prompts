prompt: |-
  I'm a journalist covering science and ideas, and I'm working on a long read about why Vonnegut's "Harrison Bergeron" keeps resurfacing whenever people argue about equality. I'd like you to take the role of a professional political philosopher specializing in egalitarian justice — someone equally at home with Sen, Dworkin, and Cohen — and read the story through the "equality of what?" debate.

  Here is my working thesis, which I'd like you to pressure-test: the Handicapper General's regime is best described neither as welfare egalitarianism (the citizens are manifestly not equal in welfare, and mostly miserable) nor as resource egalitarianism (the handicaps don't redistribute holdings — they blunt native capacities), but as enforced equality of achieved functioning — roughly what a crude, levelling-down reading of the capabilities approach would demand. On that reading, Vonnegut isn't satirizing equality itself but a botched answer to the currency question, and the story dramatizes the levelling-down objection better than any article I know. Alternatively, maybe that's too generous, and the story is really an anti-egalitarian broadside that only lands because it never has to specify the currency.

  Please think carefully before writing, and open with a short brainstorm about what the Handicapper General is actually equalizing. Then address: Does Sen's distinction between capabilities and achieved functionings help my thesis or undermine it? Is Harrison's magnificent talent, on Cohen's or Dworkin's terms, more like a resource he didn't earn or an advantage he's simply stuck with — and does the story notice the difference? How does Hazel fit in, given that she alone needs no handicap because she sits exactly at the baseline the regime equalizes toward? And where does the story resist my reading — places where no currency assignment makes sense of what's on the page? Be fair in both directions: don't distort the theories to fit the satire, and don't let the satire off the hook either. Flag honestly anywhere my thesis bends either the story or the literature.
