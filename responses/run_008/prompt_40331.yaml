      *   *Nuance:* Make sure to distinguish between *causal* decision theory (standard) and *evidential* decision theory (which might suggest voting correlates with others voting). Stick to causal to keep it simple and robust, as the user seems to prefer standard expected value.
      *   *Refinement on Probability:* The $1/\sqrt{N}$ applies if $p=0.5$ is known. If $p$ is unknown with variance $\sigma_p$, then for large $N$, the uncertainty in $p$ dominates. The probability of a tie is determined by the density of the prior distribution of the margin at 0. This is usually $O(1/N)$. I need to explain this clearly.

