answer: |-
  # The Zhuangzi Death Attitude Diagnostic

  **Instructions:** Read each scenario and select the response that best matches your intuition or your character's internal logic. Do not choose the answer you think is "most Zhuangzi"; choose the one that feels most true to the specific interpretation of the text you are holding. There are nine questions.

  ### 1. The Basin and the Song
  Zhuangzi's wife dies. When his friend arrives, Zhuangzi is squatting, drumming on a basin, and singing. His friend says this is too much. Zhuangzi explains that at first he grieved, but then he realized she was not truly gone. When he says she has "gone to live in another room," what is the status of his wife?
  *   **A.** She has dissolved back into the raw material of the universe, like ice melting into water.
  *   **B.** She has moved to a different state of existence where she is safe and resting.
  *   **C.** Her location is irrelevant; the drumming is a tool to stop his own suffering.

  ### 2. The Skull in the Dream
  Zhuangzi dreams of a skull who tells him that death is better than life because there are no rulers above or subjects below, and no seasons to toil through. If the skull woke up and offered to restore him to life, what should he do?
  *   **A.** Refuse, because returning to life is a return to the burden of having a fixed self.
  *   **B.** Accept, because the skull's report is just a dream within a dream and cannot be verified.
  *   **C.** Refuse, because the skull describes a peace that the living body cannot comprehend.

  ### 3. The Butterfly's Boundary
  Zhuangzi dreams he is a butterfly, fluttering about, unaware he is Zhuangzi. He wakes and wonders: is he Zhuangzi who dreamt he was a butterfly, or a butterfly dreaming he is Zhuangzi? What does this uncertainty prove about death?
  *   **A.** It proves that the boundary between "alive" and "dead" is just as fluid as the boundary between "man" and "insect."
  *   **B.** It proves that we cannot certify which state we are in, so fearing the next state is baseless.
  *   **C.** It proves that the consciousness that experiences the dream survives the waking of the body.

  ### 4. The Smith and the Metal
  A man with a fatal growth is told his body is being transformed by the "Maker of Things." He is asked if he would be angry if his left arm became a rooster or his right arm became a crossbow. How should he view this transformation?
  *   **A.** As a trust: the Smith knows how to cast the metal, even if the shape is strange.
  *   **B.** As a mystery: I cannot know what it is like to be a rooster, so I cannot call it bad.
  *   **C.** As a metaphor: the point is not to become a rooster, but to stop fighting the illness.

  ### 5. The Coffin of Heaven and Earth
  Zhuangzi says that when he dies, he needs no burial, for heaven and earth will be his coffin. His disciples worry that crows and kites will eat him. He replies that burying him will only let ants eat him instead; why favor the ants over the crows? What is the fate of the body here?
  *   **A.** It is returned to the ecosystem to feed the next turn of the cycle.
  *   **B.** It is discarded because the true self is not located in the flesh.
  *   **C.** It is a matter of indifference; arguing over it wastes the energy needed for composure.

  ### 6. The Delusion of Life
  Zhuangzi asks: "How do I know that loving life is not a delusion? How do I know that hating death is not like a child lost in the wild?" What is the source of our fear?
  *   **A.** The fear comes from forgetting that life and death are one continuous track.
  *   **B.** The fear comes from making a claim about death that we have no evidence to support.
  *   **C.** The fear comes from attachment to the ego, which composure can dissolve.

  ### 7. The Friend's Funeral
  A close friend dies. You are at the funeral. According to this reading, what is the appropriate internal state?
  *   **A.** Sadness is natural, but it should not harden into a belief that something valuable was destroyed.
  *   **B.** Silence is best, because any statement about where they went is speculation.
  *   **C.** Equanimity is the goal; if tears come, let them flow, but do not let them break your center.

  ### 8. The Doctor's Prognosis
  A doctor says, "When your heart stops, your consciousness ends. That is biological fact." How does the Zhuangzi-respondent reply?
  *   **A.** "You describe the end of the form, but not the end of the transformation."
  *   **B.** "You describe what you can see, but you cannot see what I will be."
  *   **C.** "Your fact may be true, but it is not a reason to tremble."

  ### 9. The Utility of the Story
  A student asks: "Do we need to believe the transformation is *real* to find peace, or is it enough that it is *useful*?"
  *   **A.** It must be real; a lie cannot sustain a life.
  *   **B.** It must be useful; truth is what allows you to navigate the world without injury.
  *   **C.** The question is a trap; 'real' and 'useful' are distinctions we cannot verify.

  ***

  # Scoring Key & Diagnostic Analysis

  Tally your responses. Note that some questions are weighted to detect specific overlaps or inconsistencies.

  ### Position Profiles

  **The Process Reading (Mostly A)**
  *   **Core Tenet:** Death is a phase of the world's ceaseless transformation.
  *   **View on Grief:** Grief is a misreading of one's place in the process; it assumes a finality that does not exist.
  *   **Metaphysics:** Strong. The universe is a literal, churning machine of *qi* and transformation.
  *   **Character Note:** Your protagonist sees herself as fuel for the furnace. She is calm because she believes she is becoming something else, not ceasing.

  **The Skeptical Reading (Mostly B)**
  *   **Core Tenet:** Zhuangzi suspends judgment about what death is.
  *   **View on Grief:** Fear rests on a claim we cannot check (that death is bad). Dissolve the claim, dissolve the fear.
  *   **Metaphysics:** Agnostic. We cannot know if transformation is real, only that we cannot know it isn't.
  *   **Character Note:** Your protagonist is calm because she admits ignorance. She does not claim to know where she is going, only that her map of "death = bad" is unverified.

  **The Survivalist Reading (Mix of A & B, specifically Q1, Q3, Q5)**
  *   **Core Tenet:** Something of the person or their vantage is not annihilated.
  *   **View on Grief:** Grief is premature because the subject persists.
  *   **Metaphysics:** Dualistic or Spiritualist. There is a "traveler" that moves between states.
  *   **Character Note:** Your protagonist is calm because she believes *she* will witness the aftermath. This is the most common drift for modern readers.

  **The Therapeutic Reading (Mostly C)**
  *   **Core Tenet:** Metaphysics is scaffolding for equanimity.
  *   **View on Grief:** Grief is permitted but managed; the goal is composure, not ontological accuracy.
  *   **Metaphysics:** Pragmatic. Zhuangzi would be indifferent among the other three theories so long as the composure holds.
  *   **Character Note:** Your protagonist uses the stories as medicine. She doesn't care if the skull is real; she cares that the story stops her shaking.

  ### Special Diagnostic Flags

  #### 1. The Process/Survivalist Blur (Question 1)
  **Observation:** If you selected **1A** or **1B**, note that this quiz *cannot* separate the Process and Survivalist readings on this specific anecdote.
  **Reasoning:** Both readings rely on a continuity of existence. Process says she becomes the *world*; Survivalist says she becomes a *spirit*. In the concrete image of "going to another room," both reject the notion of "ceasing to be."
  **For Your Novel:** If your character cycles between 1A and 1B without noticing the difference, this is not necessarily an error in her characterization; it is a feature of the text. The "blur" is where her composure is strongest. If she tries to distinguish them too sharply, she may lose the calm the anecdote provides.

  #### 2. The "Cheat" vs. Coherent Therapeutic (Questions 8 & 9)
  **Observation:** Check your answers to Q8 and Q9 against your answers to Q1, Q4, and Q7.
  *   **Coherent Therapeutic:** You chose **C** on emotional/deathbed questions (Q1, Q4, Q7) AND **B** on Q9 ("It must be useful"). This is a valid Zhuangzian position: the metaphysics are *skillful means*.
  *   **The Cheat:** You chose **C** on emotional/deathbed questions (claiming composure) BUT chose **A** on Q9 ("It must be real") while simultaneously rejecting the metaphysics in Q8 ("You describe the end...").
  **Diagnosis:** If you claim composure requires the metaphysics to be *useful* (Therapeutic) but then insist the metaphysics are *false* (Nihilist), you are cheating. The Therapeutic reading requires the metaphysics to be *adopted* as a working truth, even if not an objective one. If your protagonist claims Zhuangzi's calm while secretly believing his stories are lies, she is not a Therapeutic reader; she is a stoic pretender. The Key exposes this in **Q9**: The Therapeutic reader says "Useful is real enough." The Cheat says "It's a lie that helps."

  #### 3. The Epistemic Anchor (Questions 3 & 6)
  **Observation:** If you scored high on **B** in Q3 and Q6, you are firmly in the **Skeptical Reading**.
  **For Your Novel:** This is the hardest position to sustain in a dying character. Skepticism requires energy to maintain doubt. If your character is fading physically, does she have the energy to sustain radical doubt? Or does she slide into Process (A) because it requires less cognitive load? Watch for this drift in your manuscript.

  ### Summary for Character Bible
  *   **If Process:** She speaks of *change*, *cycles*, and *returning*.
  *   **If Skeptical:** She speaks of *knowing*, *guessing*, and *assumptions*.
  *   **If Survivalist:** She speaks of *journeying*, *resting*, and *watching*.
  *   **If Therapeutic:** She speaks of *peace*, *burden*, and *letting go*.

  If your manuscript cycles through these vocabularies without shifting the underlying stance, the character is inconsistent. If she shifts vocabularies because one stops working as the illness progresses, the character is evolving. Use the quiz to map where she starts, and where the illness forces her to move.
