answer: |-
  Your friend's argument is mathematically seductive but structurally unsound when applied to life. You are correct to suspect the slide between (3) and (5). The error is not merely philosophical; it is a specific misapplication of the boundary conditions in the underlying stochastic control problems.

  Here is the hard-nosed breakdown.

  ### 1. The False Step: Step (5) (supported by Step 4)

  The argument breaks at **Step (5)**: *"So rational agents treat every decision as a Kelly bet: what matters is the growth rate of capital..."*

  This step commits a **category error regarding the objective function**. It conflates **maximizing the growth rate of financial wealth** with **maximizing the expected utility of a finite-life agent**.

  In the classical Kelly/Breiman/Thorp setup (Steps 2 & 3), the objective is explicitly to maximize $E[\log(W_T)]$ as $T \to \infty$, subject to the constraint that **no consumption occurs** ($C_t = 0$ for all $t$). The "wealth" $W$ is the terminal score.

  In Step (5), your friend implicitly assumes the objective function for life is the same: maximize $W_{death}$. But for a living agent, wealth is not the utility; consumption is. The objective function for a life is typically modeled as:
  $$ \max E \left[ \int_0^T e^{-\rho t} u(c_t) \, dt + B(W_T) \right] $$
  Where $c_t$ is consumption, $T$ is death (finite), and $B$ is a bequest function.

  By setting $c_t = 0$ to maximize $W_T$, your friend is solving the wrong optimization problem. He is solving for the optimal **estate**, not the optimal **life**.

  ### 2. The Mathematical Flaws

  Here are the three specific mathematical claims your friend makes that do not hold up under scrutiny.

  #### A. The Infinite Horizon Fallacy (Finite vs. Asymptotic)
  Your friend relies on Step (1): *"if strategy A leaves you strictly richer than strategy B with probability approaching one as the number of rounds goes to infinity..."*

  **The Math:** The domination of Kelly over fractional Kelly is an **asymptotic result**. It holds as $N \to \infty$.
  **The Reality:** Human lives are finite. In finite horizons, fractional Kelly often dominates full Kelly in terms of expected utility because it reduces variance drag without sacrificing excessive growth.
  **The Cost:** If you reject the infinite limit, you lose the "strict domination" claim in Step (1). For any finite $N$, there is a non-zero probability that a under-bettor outperforms the Kelly bettor, and for risk-averse agents (which log-utility agents are), the lower variance of fractional Kelly is often preferable. Your friend's claim that underbetting is "irrational" is only true in the limit that no human ever reaches.

  #### B. The Consumption Error (Merton vs. Kelly)
  Your friend claims in (6) that consumption is irrational.
  **The Math:** This is solved explicitly in continuous-time finance by **Robert Merton (1969, 1971)**. In the "Merton Problem," an agent with Log Utility ($U(c) = \log(c)$) investing in a geometric Brownian motion asset should **not** reinvest everything.
  **The Result:** The optimal policy is to consume a constant fraction of wealth at every instant.
  $$ c^*_t = \frac{1}{\text{remaining lifetime}} \times W_t \quad (\text{simplified}) $$
  **The Flaw:** Your friend's model assumes the only way to derive utility is from terminal wealth. If you introduce consumption into the utility function, the "growth rate of capital" is no longer the sole metric. Hoarding capital reduces current utility. The "irrationality" of consumption only exists if you define utility as $U(W_{final})$ rather than $U(\text{life path})$.

  #### C. The Insurance/Ruin Error (Absorbing States)
  Your friend claims insurance is irrational because it lowers growth rate.
  **The Math:** Kelly logic *does* forbid bets with negative expected geometric growth. However, Kelly logic *also* forbids risking **ruin** (an absorbing state where $W=0$).
  **The Flaw:** In life, many risks are not symmetric bets; they are threats of absorbing states (bankruptcy, death, health collapse). If a risk carries a non-zero probability of reducing your wealth to a level where you cannot recover (or cannot consume), the time-average growth rate of that path is $-\infty$.
  Insurance purchases often reduce the *arithmetic* expected return of your portfolio but increase the *geometric* growth rate by removing the left-tail risk of ruin. If your friend's model says "don't buy insurance," he is likely modeling the risk as a standard multiplicative shock rather than a barrier option. If the shock can hit zero, avoiding it is consistent with Kelly, even if it costs a premium.

  ### 3. Can You Keep Kelly for Games? (The Cost of Rejection)

  Yes. You can accept (1)–(3) for the specific domain of **repeatable, non-consuming, investment games** while rejecting (4)–(6) for **life**.

  **The Distinction is Not Convenience; It is Boundary Conditions.**

  | Feature | The "Kelly Game" (Steps 2-3) | The "Life Problem" (Steps 4-6) |
  | :--- | :--- | :--- |
  | **Horizon** | Infinite ($T \to \infty$) | Finite ($T < \infty$, stochastic death) |
  | **Cash Flow** | Reinvestment only ($C_t = 0$) | Consumption required ($C_t > 0$) |
  | **Objective** | Maximize $W_T$ | Maximize $\sum u(c_t)$ |
  | **Ruin** | Avoid $W \to 0$ | Avoid $W \to 0$ **AND** $c_t \to 0$ |
  | **Asset Class** | Financial Capital | Financial + Human Capital |

  **What rejecting Step (5) costs your friend:**
  He must admit that "rationality" is relative to the objective function.
  1.  **If the goal is Bequest:** He is right. Don't consume, buy no insurance, bet Kelly.
  2.  **If the goal is Living:** He is wrong. Consumption is mandatory for utility; insurance is mandatory to protect human capital (which is the present value of future labor income, a major asset class he ignores).

  **What rejecting Step (5) costs you:**
  You must concede that for *pure investment portfolios* intended for very long horizons (e.g., an endowment fund or a multi-generational trust), your friend is largely correct. Fractional Kelly is a concession to finite human psychology and horizon, not asymptotic optimality. You cannot claim that underbetting is *mathematically* superior in the infinite limit; you can only claim that humans live in the finite.

  ### 4. Summary of the Rebuttal

  Tell your friend this:

  1.  **You are solving the Merton Problem, not the Kelly Problem.** By ignoring consumption, you are optimizing for a tombstone, not a biography. The math of optimal life-cycle investing (Merton 1969) explicitly dictates positive consumption.
  2.  **Your Domination Principle (1) is asymptotic.** It requires $N \to \infty$. No human lives forever. In finite time, the "domination" is probabilistic, not absolute, and variance matters to a log-utility agent.
  3.  **You are ignoring Human Capital.** A life is not just a bank account. It is a bond-like stream of labor income. Insurance protects that bond. Ignoring it is a specification error in the balance sheet, not a philosophical stance.
  4.  **Insurance and Kelly are compatible.** If a risk includes an absorbing state (ruin), Kelly logic demands you avoid it. Insurance is the mechanism to avoid absorbing states in non-gambling contexts. If your model says insurance lowers growth, your model has mispriced the probability of ruin.

  **Verdict:** The argument is **unsound**. Step (5) equivocates on the definition of "wealth" (instrumental vs. terminal). You can keep Kelly for the casino (or the endowment fund), but you must discard it for the life plan without contradicting the math. The math itself changes when you add the constraint $C_t > 0$ and $T < \infty$.
