  ### The Verdicts

  Based on thirty-one years of pattern recognition, here is the predicted disposition of the three offers on your aunt's desk:

  1.  **The Ashford Diaries:** **Accessioned.**
  2.  **The Cooperative Ledgers:** **Accessioned.**
  3.  **The Welfare Case Files:** **Declined.**

  ### The Governing Principle: The Principle of Imminent Loss

  The rule that best explains your aunt's record is not about subject matter alone (e.g., "save the poor, reject the rich"), nor is it about format (e.g., "save letters, reject ledgers"). It is a rule of **predictive durability regarding human agency.**

  Your aunt operates on the conviction that institutional records (ledgers, minutes, official files) possess structural inertia; they are created by entities with successors, legal obligations, or perceived economic value, meaning they are likely to survive without her intervention. Conversely, records of individual human experience—particularly those of marginalized people—are ephemeral. They exist on fragile paper, in fading memories, or in the margins of other people's documents.

  Her remark, *"The ledgers always survive; it is the people who don't,"* is the key. She interprets "ledgers" metaphorically as **systems of power** and "people" as **individual voices**. She acts as a rescue archivist for the latter, assuming the former will be saved by the weight of their own importance.

  *   **Why she accepted the Shipping Firm's rejection:** The firm "dominated the town." Its records were "best-condition." She calculated that such valuable economic records would inevitably be claimed by a larger state archive or university if not by her. They were "ledgers that survive."
  *   **Why she accepted the Tenant Letters:** They were "barely literate" and "of no consequence to anyone who writes histories." They had no structural protection. They were "people who don't."
  *   **Why she accepted the Oral Histories:** Despite poor quality, they were the only record of displaced Black families. The *memory* was the fragile artifact.

  ### Rival Rules and Where They Diverge

  To understand why your aunt's rule is distinct, we must compare it against the two rules the volunteers are likely using to predict her.

  **Rival Rule A: The "Gap-Filling" Principle (The Volunteers' Rule)**
  *   **Logic:** The archive should represent a balanced demographic and topical cross-section of the county. If a group is underrepresented, their records should be taken regardless of format or authorship.
  *   **Divergence:** This rule predicts accepting **all three** offers. The Ashfords fill the "servant" gap; the Cooperative fills the "Black business" gap; the Welfare Files fill the "poverty" gap. It fails to explain why she rejected the Chamber of Commerce minutes (which might fill a "civic" gap) or why she might reject the Welfare Files.

  **Rival Rule B: The "Traditional Significance" Principle (The Historians' Rule)**
  *   **Logic:** Prioritize records that document major economic drivers, political power, and official government functions, preferably in good condition.
  *   **Divergence:** This rule predicts accepting the **Ashford Diaries** (elite family) and the **Welfare Files** (government records), but rejecting the **Cooperative Ledgers** (small scale, marginalized group). It fails to explain why she accepted the water-stained farm wives' letters or rejected the "best-condition" shipping ledgers.

  ### How the Three Offers Separate the Rules

  The three offers on her desk function as a perfect diagnostic test to distinguish your aunt's **Principle of Imminent Loss** from the rival rules.

  1.  **The Ashford Diaries (The Elite Container / Marginalized Content)**
      *   **Aunt's Rule:** **Accept.** While the Ashfords are elite ("ledgers that survive"), the *servants* are not. The diaries are the only vessel for the servants' names. She saves the people hidden inside the elite record.
      *   **Gap-Filling:** **Accept.** (Fills the domestic worker gap).
      *   **Traditional:** **Accept.** (Elite family).
      *   *Result:* This offer does not separate the Aunt from the Traditionalist, but it separates her from a strict "Anti-Elite" rule. It proves she cares about *whose voice is preserved*, not just *who wrote it*.

  2.  **The Cooperative Ledgers (The Marginalized Institution)**
      *   **Aunt's Rule:** **Accept.** Although they are ledgers, they document a Black community in the Jim Crow South. Unlike the dominant shipping firm, these records are not "guaranteed to survive." They represent "people" organizing, not "capital" accumulating.
      *   **Gap-Filling:** **Accept.** (Fills the Black commercial gap).
      *   **Traditional:** **Reject.** (Lacks economic dominance, smaller scale).
      *   *Result:* This separates the Aunt from the Traditionalist. It proves she will accept "ledgers" if the *community* behind them is vulnerable enough that the records would otherwise vanish.

  3.  **The Welfare Case Files (The Institutional Gaze)**
      *   **Aunt's Rule:** **Reject.** This is the critical differentiator. These are institutional files *about* poor families, compiled *by* caseworkers. They are the "ledgers" of the welfare state. They lack human agency (they are not letters *from* the families) and they are government records (structurally durable). They violate the "people who don't" clause because they are the "ledgers" looking at the people.
      *   **Gap-Filling:** **Accept.** (Fills the poverty gap, "only contemporary account").
      *   **Traditional:** **Accept.** (Official government records).
      *   *Result:* This separates the Aunt from **both** rivals. The volunteers will argue for them because they fill a hole; the traditionalists will argue for them because they are official. Your aunt will reject them because they are surveillance, not testimony.

  ### Conclusion

  The three offers separate the candidate rules cleanly. The **Welfare Files** are the pivot point: the volunteers see a gap to fill; your aunt sees an institutional ledger that will survive in state archives, documenting people without their consent.

  However, if you wished to test the boundary of her principle further—to distinguish her **Principle of Imminent Loss** from a simpler **"First-Person Voice"** rule—you would need a **Fourth Offer**:

  **The Fourth Offer:** *A collection of 1940s police photographs of striking mill workers, taken for identification purposes during arrests.*

  *   **First-Person Voice Rule:** **Reject.** (The subjects did not create the records; the police did).
  *   **Gap-Filling Rule:** **Accept.** (Visual record of workers is rare).
  *   **Aunt's Principle:** **Likely Reject.** Even though it documents "people," it is an institutional record of surveillance (like the Welfare Files). However, if the photographs were the *only* visual existence of those workers before they were erased, she might accept them under "Imminent Loss."
  *   **Why this tests the boundary:** It forces a decision on whether *visual evidence of existence* outweighs the *lack of agency*. Your aunt's record suggests she prioritizes agency (letters, diaries, oral history). A rejection of the photos would confirm that for her, **how** the person is recorded (by themselves vs. by the state) matters more than **that** they are recorded.

  But for the current three offers, her path is clear: She will save the servants in the diaries, save the community in the cooperative books, and let the welfare state keep its own files. She is not building a library of the county; she is building a monument to the ones who left no stone.
