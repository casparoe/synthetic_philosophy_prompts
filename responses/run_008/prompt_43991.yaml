answer: |-
  First, take a deep breath. Congratulations on your upcoming wedding. And please, do not let your best man's graduate school seminar ruin your marriage before it starts. He is doing what philosophy grad students do: taking a sledgehammer to a stained-glass window to see how the light gets in, and then acting surprised when the glass breaks.

  Your instinct is excellent. The argument he presented is a classic formulation of the **Reliance Theory of Promises** (often associated with Hume, and later refined by legal scholars like Fuller and philosophers like T.M. Scanlon). It is elegant, but it is widely considered incomplete for exactly the reasons you suspect.

  The slip does happen between (3) and (4), but the rot starts earlier, in Premise (1). Here is the breakdown of where the argument fails, why it looks so seductive, and what you have to accept to reject it.

  ### The Diagnosis: Harm vs. Wrong

  The Best Man's argument conflates **the harm caused by breaking a promise** with **the wrong of breaking a promise.**

  *   **The Harm:** If I break a promise, you might lose money, time, or emotional stability because you relied on me. This is a consequentialist injury.
  *   **The Wrong:** If I break a promise, I have violated a specific normative relationship we established. I have disregarded your authority over my action.

  The Best Man argues that the *only* reason breaking a promise is wrong is because of the *Harm* (the reliance).
  You intuitively feel that there is a *Wrong* independent of the *Harm*.

  Here is why his specific steps fail:

  #### The Problem with Premise (4): The Equivalence Leap
  > *(4) But then anything else that produces the same reliance should produce the same duty: a confident lie, my track record... even a third party correctly predicting me...*

  This is the strongest point of attack. If obligation were *only* about reliance, then a confident lie would create the same obligation as a promise. But it doesn't.

  If a used car salesman lies to you and you rely on him, he owes you **compensation** for the harm caused. He does not owe you **performance** of the lie. If he said, "This car has a new engine," and you bought it, he isn't morally bound to go install a new engine to make his statement true. He is bound to pay you back for the loss.

  However, if I *promise* to pick you up at the airport, and you rely on me, I am not merely liable for your taxi fare if I don't show up. I have failed to do the specific thing I said I would do. The obligation is to *perform*, not just to *make whole*.

  **Why this matters for your wedding:** If your vows were just reliance-generators, then if your fiancée got sick and couldn't rely on you, the obligation would vanish. But the vow is an obligation to *perform* (to love, to cherish) regardless of whether she is currently "using" that reliance to plan her week.

  #### The Problem with Premise (5): The Skeptical Spouse
  > *(5) And if you never relied at all... then there's nothing wrong with breaking it...*

  This leads to the absurdity you noticed: if your fiancée is a cynic who assumes you'll leave her in five years, does that mean you are free to leave her tomorrow?

  Under the **Will Theory** (the opposing view), a promise is an exercise of **normative power**. When you vow, you are not just predicting behavior; you are inviting your fiancée to hold you accountable. You are giving her a right to your fidelity that she didn't have before.

  Even if she doesn't *exercise* that right (by relying on you), you have still transferred the authority. Think of it like handing someone the keys to your house. Even if they never use the keys, you cannot enter the house without their permission anymore. You have changed the normative landscape, not just their psychological state.

  #### The Problem with Premise (1): "Out of Nothing"
  > *(1) A promise can't conjure an obligation out of nothing...*

  This premise sounds scientific, but it denies human agency. Humans *do* have the capacity to change their moral reality through speech acts. When a judge says "I sentence you," or a priest says "I pronounce you," or you say "I vow," you are changing the world.

  It isn't "out of nothing." It comes out of **your autonomy**. The source of the obligation is your own will. By promising, you limit your own future freedom to show that you are trustworthy. To say this can't happen is to say humans cannot bind themselves, which would make contracts, marriages, and even apologies meaningless.

  ### The Counter-Examples (Why the Best Man's View Fails Your Intuitions)

  Let's apply the **Will Theory** (Autonomy View) to the nightmares he gave you:

  1.  **The Skeptical Spouse:**
      *   *Best Man:* No reliance = no obligation.
      *   *Reality:* You invited her trust. Even if she withholds it, you are bound because you surrendered the option to leave. The vow binds *you*, not just her expectations.
  2.  **The Used Car Salesman:**
      *   *Best Man:* High reliance = high obligation.
      *   *Reality:* He did not invite the buyer to hold him accountable; he manipulated the buyer. There is reliance, but there is no *authority* transferred. Therefore, he owes damages, not performance.
  3.  **The Gunpoint Promise:**
      *   *Best Man:* If you rely, it binds.
      *   *Reality:* A promise requires voluntariness. If a gun is to my head, I am not exercising my autonomy; I am being coerced. I cannot transfer authority over my actions if I do not possess it in that moment. Therefore, the promise is void, regardless of reliance.

  ### The Price of Rejecting His View

  Your best man warned you that every way out has a price. He is right. If you reject his Reliance Theory, you must accept the **Metaphysical Cost of Autonomy.**

  To say vows bind independently of reliance, you have to believe in **Normative Powers.** You have to believe that human beings have the magical-seeming ability to alter the moral universe through language. You have to believe that "I promise" is a different *kind* of speech act than "I predict" or "I hope."

  **Is this a high price?**
  Philosophically, no. It is the foundation of almost all human relationships. If we accept the Best Man's view, then:
  *   Contracts are just risk assessments.
  *   Apologies are just damage control.
  *   Marriage is just a cohabitation agreement based on mutual utility.

  If you reject his view, you accept that marriage is a **covenant**, not just a contract. A contract protects expectations; a covenant binds the will.

  ### The "Residue" (What you keep from his argument)

  Don't throw out everything he said. He is right about one thing: **Reliance matters.**

  While reliance doesn't *create* the obligation, the *point* of the obligation is to make reliance safe. You don't take vows in a vacuum. You take them so that your fiancée *can* build a life with you.
  *   **The Obligation:** Comes from your Will (the Vow).
  *   **The Value:** Comes from the Reliance (the shared life).

  If you vow but never show up, you violate the Will. If you show up but she never feels safe relying on you, you have failed the Value. The Best Man confused the *source* of the duty with the *purpose* of the duty.

  ### Summary for the Quiet Panic

  Here is how to silence the panic before October:

  1.  **The Vow is an Act of Freedom:** You are not being bound by her expectations; you are binding yourself by your own choice. That is why it holds even if she has doubts.
  2.  **The Vow is Specific:** It is not a general duty to be nice or reliable (like the salesman). It is a specific duty to *this person* based on *this speech act*.
  3.  **The Vow is Robust:** It survives bad days. If she is sick, or skeptical, or stressed, and cannot "rely" on you in that moment, your obligation remains. That is what "in sickness and in health" actually means.

  Your best man is describing a world where morality is just accounting (harm vs. compensation). You are entering a world where morality is also about **fidelity** (who you are and who you said you'd be).

  Tell him at the wedding: *"You argued that my vows bind me only insofar as my wife relies on them. I am vowing today that I will be reliable even when she cannot rely on anything at all. That is the difference between a prediction and a promise."*

  Then go dance. You're going to be fine.
