          1.  Promises don't create obligation *ex nihilo*; wrongness must stem from worldly effects.
          2.  The only worldly effect is changing the promisee's state (reliance/planning).
          3.  Therefore, duty tracks reliance, not the promise itself.
          4.  Therefore, anything creating reliance (lies, predictions, track records) creates the same duty.
          5.  Therefore, if there's no reliance (skepticism, forgetting), there's no duty.
      *   **The User's Intuition:** This leads to counterintuitive results (skeptical spouse = no obligation; gullible victim of salesman = huge obligation; coerced promise = binding if relied upon). The user suspects the slip is between (3) and (4) (reliance makes it *worse* vs. reliance is *all there is*).
      *   **The Task:** Identify where the argument goes wrong (if it does), explain which premise to reject, why it looked innocent, the cost of rejecting it, OR defend the conclusion and explain the "residue." Be thorough but accessible (user is panicking about wedding vows).

  2.  **Deconstruct the Best Man's Argument (The Reliance View):**
      *   This is a classic philosophical debate: *Will Theory* (Promissory Obligation is sui generis, based on autonomy/consent) vs. *Reliance Theory* (Promissory Obligation is reducible to harm prevention/expectation).
      *   The Best Man is channeling David Hume and arguably T.M. Scanlon (though Scanlon tries to bridge the gap) or simple consequentialism.
      *   *Premise 1:* Normative magic is suspicious. (Plausible).
      *   *Premise 2:* The effect is reliance. (Plausible).
      *   *Premise 3:* Duty tracks reliance. (The pivot point).
      *   *Premise 4:* Equivalence of sources of reliance. (The controversial leap).
      *   *Premise 5:* No reliance = no duty. (The skeptical conclusion).

  3.  **Evaluate the User's Instinct:**
      *   The user thinks the slip is between (3) and (4). They are right. The move from "reliance matters" to "reliance is the *only* thing that matters" is the weak link.
      *   However, to give a thorough answer, I need to address the deeper philosophical commitments. Simply saying "Premise 4 is wrong" isn't enough. I need to explain *why* philosophers think promises are special.

  4.  **Identify the Counter-Arguments (The "Will Theory" or "Autonomy View"):**
      *   **The Normative Power View:** Humans have the capacity to change their normative landscape through speech acts. When I promise, I invite the other person to hold me accountable. I transfer control over a specific action to them.
      *   **The Distinction:** Reliance explains the *harm* of breaking a promise, but not the *wrong* of breaking it.
      *   **Example:** If I promise to meet you for lunch, and you don't rely on me (you have a backup plan), have I wronged you? Most say yes, because I violated the authority I granted you.
      *   **Coercion:** A promise at gunpoint lacks *voluntariness*. The Reliance View struggles here because if the victim relies, the Best Man says it's binding. The Autonomy View says it's void because consent was compromised.

  5.  **Drafting the Response - Structure:**
      *   **Empathy & Validation:** Acknowledge the stress. It's a classic philosophical puzzle, not a personal crisis. The Best Man is being a grad student (playful jab).
      *   **Diagnosis:** Identify the school of thought (Humean/Reliance vs. Kantian/Will).
      *   **The Weak Link:** Pinpoint Premise (3) and (4). The category error between *harm* and *wrong*.
      *   **Alternative View (The "Normative Power" Account):** Explain how promises work as speech acts that transfer authority.
      *   **Addressing the Specific Counter-Examples:**
          *   *The Skeptical Spouse:* Why vows bind even if she doubts (you invited her trust).
          *   *The Car Salesman:* Why reliance isn't enough (no invitation to hold accountable).
          *   *The Gunpoint Promise:* Why voluntariness matters (authority can't be transferred under duress).
      *   **The Cost:** What do we lose if we reject the Best Man's view? (We accept "normative magic," but it's the magic of agency).
      *   **Conclusion:** Reassurance for the wedding.

  6.  **Refining the Argument (Self-Correction/Nuance):**
      *   *Caution:* Don't get too bogged down in jargon. Keep it relatable to marriage.
      *   *Scanlon's Principle F:* T.M. Scanlon tried to ground promising in reliance but added a layer of "expectation of assurance." It might be worth mentioning as a middle ground, but the Will Theory is clearer for the user's intuition. Let's stick to the Will Theory/Autonomy view as the primary counter, as it directly addresses the "binding" nature.
      *   *Premise 1:* Is it true that obligation can't come from nothing? Actually, the Will Theory says it comes from *agency*, not nothing. It's an exercise of freedom.
      *   *Premise 4:* This is the biggest stretch. A lie creates reliance, but it doesn't create an *obligation* to fulfill the lie. It creates an obligation to *compensate* for the harm. This is a crucial distinction. Breaking a promise is a specific wrong; causing reliance via lie is a different wrong.

  7.  **Finalizing the Advice:**
      *   Tell the user their instinct is correct.
      *   The slip is indeed treating "reasons not to harm" as identical to "obligations created by consent."
      *   The "Price" of rejecting the Best Man: You have to believe humans have a special capacity to bind themselves (autonomy). This isn't a high price; it's the foundation of marriage law and ethics.
