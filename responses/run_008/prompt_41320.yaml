  To bring your verdicts into reflective equilibrium, we must adopt a principle that respects the core insight of care ethics: that morality is grounded in the maintenance of responsive relationships, not merely the completion of tasks. Your conflict between the professional carer (Case 1) and the daughter (Case 3) arises because you are treating 'care' as a single category when your intuitions correctly detect two different modes: *contractual dependency work* and *constitutive relational care*. However, to make this distinction principled rather than ad hoc, we must acknowledge that even contractual care involves a minimal moral demand for recognition that your first verdict ignores.

  **The Principle: Care as Reciprocal Relational Maintenance**
  This principle holds that the moral obligation to care is proportional to the depth of the shared history of recognition between the parties, but that *all* care encounters require a baseline of affective engagement to avoid objectification.
  1.  **Baseline Requirement (All Cases):** Care involves seeing the dependent as a subject. Purely mechanical task completion without any affective recognition is morally deficient, though sometimes excusable.
  2.  **Relational Modulation (Cases 3, 4, 5):** In constitutive relationships (family, friends), the duty includes emotional attunement because the relationship itself is a good to be sustained.
  3.  **Historical Reciprocity (Unresolved Case):** The duty to provide *personal* care depends on a history of mutual regard. Where care was historically withheld or abused, the duty attenuates to securing safety rather than providing intimacy.

  **Which Verdict Must Go**
  To satisfy this principle, you must overturn your verdict on **Case 1 (The Professional Carer)**. You stated there is "nothing morally amiss" if she feels nothing. Under *Care as Reciprocal Relational Maintenance*, this is incorrect. While we should not expect paid carers to love their patients (protecting them from exploitation), a total absence of feeling reduces the patient to an object. It is morally *lacking*, even if systemic pressures make it understandable. By correcting this, you align the carer and the daughter: both are failing to provide full care, but the daughter's failure is graver because her role is constitutive of her mother's identity, whereas the carer's role is instrumental. The carer fails a baseline duty of recognition; the daughter fails a profound duty of attunement.

  **The Unresolved Case: The Abusive Mother**
  Applying the principle of Historical Reciprocity: a relationship without a history of care generates no claim to *personal* care. The daughter's duty is not to replicate the intimacy her mother denied her, but to ensure her mother's needs are met without sacrificing her own moral integrity.
  **Verdict:** The daughter owes her mother **arranged care, but not personal care**. She must ensure her mother is safe and fed (discharging the baseline duty owed to any dependent human), but she is not morally required to visit, offer affection, or suppress her resentment. To demand personal care would be to enforce a relational fiction that care ethics rejects.

  **An Uncomfortable Prediction**
  Consider **The Estranged Sibling**: A brother with whom you have had no contact for fifteen years due to a trivial quarrel suddenly develops early-onset dementia. He has no other family.
  **Verdict:** The principle dictates that you owe him care *rather than* a kind stranger who knew him for only a year. Because the biological and historical tie exists, the duty of maintenance falls on you, despite the lack of recent relationship and the existence of more willing carers. This is uncomfortable because it privileges biological history over current capacity for care, potentially burdening you with a relationship you have already mourned.

  \answer{Care as Reciprocal Relational Maintenance | the daughter owes arranged care but not personal care}
