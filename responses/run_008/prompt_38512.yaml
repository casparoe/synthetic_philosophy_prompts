          *   Propose cheapest repairs and their costs.
          *   Identify the single revision that cleans up the most.
      *   **User's Intuition:** Feels unstable but can't locate the specific contradiction in the textbook derivation.

  2.  **Analyze the 7 Commitments:**

      *   (1) **Epistemic Closure (Specific):** $K(p) \land K(p \to q) \to K(q)$. *Crucial:* No "derived by agent" rider. Requires explicit knowledge of the entailment.
      *   (2) **Axiom Knowledge:** Competent adults *explicitly* know Peano Arithmetic (PA) axioms + First-Order Logic (FOL).
      *   (3) **Anti-Dispositionalism:** "Implicit knowledge" is just potential. $CanKnow(q) \neq K(q)$.
      *   (4) **Anti-Omniscience (Realism):** Real agents are *not* closed under consequence. This is a feature, not a bug. Idealizing it away ruins the model of bounded reasoning.
      *   (5) **Hintikka Semantics:** Possible-worlds semantics (PWS) for knowledge is the "right starting point." (Standard PWS implies logical omniscience: if $p$ is true in all epistemic alternatives, and $p \to q$ is valid, $q$ is true in all epistemic alternatives).
      *   (6) **Case Verdict (Theorem):** Student knows axioms, hasn't thought of Theorem T, but could prove it. *Verdict:* She *already knew* T before proving it. Proof is discovery of prior knowledge.
      *   (7) **Case Verdict (Open Problem):** Nobody knows Goldbach's Conjecture (GC), even though they know axioms and could verify a proof if shown.

  3.  **Initial Scan for Contradictions:**

      *   *The Classic LO Problem:* (1) + (2) + (5) usually implies Omniscience.
