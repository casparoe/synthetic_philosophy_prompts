      *   *Hidden Assumption:* The metric chosen (e.g., resources) is the right one regardless of whether we are looking at a whole life, a year, or a day.
      *   *Hypothesis:* The defensibility of a metric depends on the temporal unit. Resources might work for lifetimes (opportunity to convert) but fail for time-slices (conversion takes time). Capabilities might work for lifetimes but be too granular/unstable for short slices.
      *   *Implication:* Disagreements might be talking past each other due to temporal granularity mismatches.

  3.  **Drafting - Section by Section:**

      *   **Title:** Needs to be academic and precise. *Temporal Granularity and the Metric of Egalitarian Justice.*

      *   **1. Statement of the Question:**
          *   Define "Metric Invariance": The claim that if $X$ is the correct currency of justice for a life, it is also the correct currency for a decade, day, or hour.
          *   Define "Unit-Relativity": The claim that the correct currency shifts based on the temporal scope of distribution.
          *   The Core Question: Is the normative force of a distributive metric dependent on the temporal extension of the unit of analysis?

      *   **2. The Gap in Existing Positions:**
          *   Need to explain *why* they miss this.
          *   *Resourcists:* Often argue from a "lifetime opportunity" perspective. They assume time to convert. If squeezed to a time-slice, the "conversion" aspect breaks down.
          *   *Capability Theorists:* Focus on functionings and freedom to achieve. At a lifetime level, this is stable. At a daily level, it might become indistinguishable from welfare or too volatile.
          *   *Welfarists:* Often subjective. Might be more slice-sensitive, but usually argued at the level of life satisfaction.
          *   *The Unstated Premise:* All assume the "distributive unit" is transparent or neutral. They treat time as a container, not a variable that alters the normative logic.

      *   **3. Methodology (Month-by-Month):**
          *   Needs to be philosophical (conceptual analysis, thought experiments), not empirical (no surveys/data).
          *   *Months 1-3:* Reconstruction. Map the arguments for each metric, explicitly isolating temporal assumptions.
          *   *Months 4-6:* Stress Testing. Construct thought experiments where the temporal unit is shifted. (e.g., The "Sudden Disability" case across a day vs. a life).
          *   *Months 7-9:* Synthesis/Model Building. Develop the "Unit-Relative" framework. Does it solve the conflicts?
          *   *Months 10-12:* Drafting and Refinement. Writing the chapters/papers.
          *   *Check:* Ensure it sounds like *work*, not just reading.

      *   **4. Successful Results:**
          *   *Positive:* Demonstrating that Resource Egalitarianism is a "Lifetime Theory" and Capability Egalitarianism is a "Mid-Range Theory," etc. Showing the debate is a category error.
          *   *Negative (Invariance holds):* Proving that the arguments *do* hold across units. This strengthens the existing theories by hardening them against a new objection. It clarifies *why* they are robust.
          *   *Value:* Even a negative result clarifies the logical structure of egalitarianism.

      *   **5. Risk Assessment (Scope):**
          *   *Too Big:* Trying to cover Welfare, Resources, *and* Capabilities equally. Or trying to cover all possible time units (hour, day, year, decade).
          *   *Cuttable:* Welfare can be sidelined if Resources vs. Capabilities is the main friction. Specific time units can be reduced to "Short" vs. "Long."
          *   *Indivisible Core:* The comparison of *one* metric across *two* distinct temporal units. If I don't compare units, I don't test invariance.

