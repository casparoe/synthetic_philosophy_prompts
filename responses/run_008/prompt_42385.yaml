answer: |-
  **Project Title:** Temporal Granularity and the Metric of Egalitarian Justice

  **1. Statement of the Question**

  The central question of this project is whether the normative validity of a distributive metric is invariant across temporal units. In the debate over "equality of what?", competing theories propose different currencies of justice: welfare, resources, or capabilities. Standard formulations of these theories implicitly assume *Metric Invariance*. This is the claim that if a specific metric (e.g., resources) is the correct standard for judging justice over the course of a complete life, it remains the correct standard for judging justice over shorter intervals, such as a decade, a workday, or a specific policy cycle.

  Conversely, this project investigates the hypothesis of *Metric Unit-Relativity*. This is the claim that the defensibility of a distributive metric is contingent upon the temporal extension of the unit of analysis. To assert unit-relativity is to claim that the normative logic supporting a metric at the level of a "whole life" may fail when applied to a "time-slice," and vice versa. For example, a resource metric may rely on the assumption that agents have sufficient time to convert holdings into functionings; if the temporal unit is shortened below the threshold required for conversion, the resource metric may lose its normative force, even if it remains valid at the lifetime level.

  The precise philosophical question is: *Does the argument for a specific currency of egalitarianism entail a specific temporal granularity, and does shifting that granularity without adjusting the metric generate logical incoherence?*

  **2. The Gap in Existing Positions**

  Current positions in egalitarian theory leave this question open because they treat the temporal unit of distribution as a neutral background condition rather than a variable integral to the argument. This oversight exists because the standard arguments for each metric rely on unstated premises regarding time that are only visible when the temporal grain is altered.

  *   **Resource-Based Accounts:** These arguments typically rely on the concept of "opportunity." The normative force of equalizing resources rests on the idea that individuals are responsible for converting those resources into outcomes. However, conversion is a process that requires duration. The unstated premise is that the distributive unit is long enough to permit rational planning and conversion. If the unit is compressed (e.g., to a monthly budget), the distinction between "resources" and "outcomes" blurs, because the agent lacks the temporal runway to exercise responsibility. Existing arguments do not specify the minimum temporal threshold required for resource-equality to make sense.
  *   **Capability-Based Accounts:** These arguments focus on the substantive freedom to achieve functionings. At the level of a life, this allows for trade-offs and fluctuations. However, at the level of a time-slice, measuring capability sets becomes notoriously fine-grained and potentially unstable. The unstated premise here is that the "capability set" is a stable property of the agent over the relevant unit. If the unit is too short, the capability set may fluctuate wildly due to transient factors, making it indistinguishable from welfare or momentary functioning. Existing arguments do not address whether capability measurement collapses under high-frequency temporal scrutiny.
  *   **Welfare-Based Accounts:** These arguments often focus on subjective states or preference satisfaction. While seemingly more adaptable to time-slices, they face the "adaptation problem." The unstated premise is that preferences are formed over a duration that allows for reflection. If the unit is too short, welfare metrics may capture transient impulses rather than considered judgments.

  In sum, the debate proceeds as if the metrics are competing for the same logical space. My hypothesis is that they are operating at different temporal resolutions. The existing literature fails to isolate *time* as a parameter that determines the coherence of the metric itself.

  **3. Methodology**

  This project will proceed via conceptual analysis and the construction of normative thought experiments. It is not an empirical study of how people perceive time, but a philosophical investigation into the logical requirements of distributive principles. The work will be divided into four phases over twelve months.

  *   **Months 1–3: Reconstruction and Isolation.**
      I will reconstruct the core arguments for resource and capability metrics without relying on specific textual exegesis. The goal is to formalize the logical structure of each argument to isolate where temporal assumptions are doing hidden work. I will produce a set of "Temporal Premise Statements" for each metric—explicit claims about time that must be true for the argument to hold (e.g., "Premise T1: Agents require duration $D$ to convert resource $R$ into functioning $F$").
  *   **Months 4–6: Stress Testing via Thought Experiment.**
      I will construct a series of distributive cases where the temporal unit is systematically varied while holding the metric constant.
      *   *Case A (The Sudden Shock):* A disability occurs mid-life. I will analyze how resource vs. capability compensation looks different if evaluated at the level of the year of injury versus the level of the whole life.
      *   *Case B (The Short-Term Policy):* A government allocates budget for a single fiscal quarter. I will test whether a resource transfer is justifiable under resource egalitarianism if the recipients cannot utilize the resources within that quarter.
      *   *Case C (The Capabilities Snapshot):* I will test whether a capability set can be meaningfully defined for a single day without collapsing into a description of immediate functionings.
      The output of this phase will be a map of "breaking points" where each metric loses internal coherence.
  *   **Months 7–9: Synthesis and Framework Development.**
      Based on the stress tests, I will develop a model of "Unit-Relative Egalitarianism." This involves determining if a hybrid approach is necessary (e.g., resources for long-term planning, capabilities for short-term protection) or if one metric can be reformulated to be temporally sensitive. I will check this model for consistency, ensuring it does not lead to contradictory judgments when aggregating time-slices into a life.
  *   **Months 10–12: Drafting and Refinement.**
      I will draft the dissertation chapters or fellowship papers. The focus will be on articulating the positive argument for unit-relativity (or the negative argument for invariance) and addressing potential objections regarding the fragmentation of justice.

  **4. Statement of Successful Results**

  A successful result for this fellowship does not require proving the hypothesis of unit-relativity true.

  *   **Positive Success:** I demonstrate that resource egalitarianism is logically coherent only at the level of complete lives, while capability egalitarianism is required for sub-lifetime units. This would resolve portions of the theoretical debate by showing that the rivals are not contradictory but complementary, applying to different temporal domains. This would necessitate a restructuring of how we evaluate policy (e.g., distinguishing between lifetime tax policy and daily civil rights enforcement).
  *   **Negative Success:** I demonstrate that the arguments for the leading metrics *are* unit-invariant. That is, I show that a robust theory of resources can be formulated for time-slices, or that capabilities can be stabilized across short durations. This is a valuable philosophical result because it hardens the existing theories against a novel objection. It clarifies *why* they are robust (e.g., by showing that "conversion time" is not a necessary condition for resource justice).
  *   **Methodological Success:** Even if the hypothesis is indeterminate, the project will produce a rigorous taxonomy of temporal assumptions in distributive justice. This provides a new vocabulary for future debates, preventing theorists from talking past one another regarding the time-horizon of their claims.

  **5. Risk Assessment and Scope**

  The primary risk is that the project becomes too expansive by attempting to cover all three major metrics (welfare, resources, capabilities) across too many temporal units (hour, day, year, decade, life).

  *   **Cuttable Elements:** If time becomes constrained, I will exclude welfare-based accounts. The friction between resources and capabilities is the most theoretically rich area for this specific hypothesis, as welfare is already generally understood to be more moment-sensitive. I will also reduce the temporal units to a binary distinction: "Lifetime" vs. "Sub-Lifetime Slice," rather than analyzing a spectrum of durations.
  *   **Indivisible Core:** The core of the project is the comparison of *one* metric across *two* distinct temporal units. If I do not compare units, I cannot test invariance. If I do not test at least one major metric (resources or capabilities), I am not engaging the "equality of what?" debate. Therefore, the comparison of Resource Egalitarianism at the Lifetime level versus the Time-Slice level is the minimum viable product. Without this specific comparison, the project loses its distinctive contribution.

  **6. The Weakest Link**

  The single weakest link in this proposal is the assumption that distributive justice is conceptually intelligible at the level of sub-lifetime time-slices.

  My entire hypothesis rests on the premise that we can meaningfully ask, "Was this afternoon distributively just?" or "Is this monthly allocation egalitarian?" However, a powerful counter-consideration is that justice is essentially a *diachronic* concept bound to the narrative of a life. If it turns out that the "time-slice" is a category mistake in political philosophy—that distributive claims only make sense when viewed from the perspective of a birth-to-death trajectory—then the project's central variable (temporal granularity) collapses.

  If justice is inherently lifetime-relative, then asking whether a metric works for a "day" is like asking whether a "marriage" is happy for an "hour." The unit is not just difficult to measure; it is normatively inert. If this consideration proves true, it would not merely shrink the project; it would undermine the case for funding it. The project would shift from discovering a new variable in egalitarian theory to correcting a linguistic confusion about the scope of justice. While this is still philosophical work, it changes the outcome from a constructive framework (Unit-Relativity) to a defensive clarification (Lifetime-Exclusivity), which may be less suitable for the intended contribution of this fellowship. I intend to address this in the first three months by rigorously testing whether sub-lifetime distributive claims can bear normative weight independent of their contribution to the life-whole.
