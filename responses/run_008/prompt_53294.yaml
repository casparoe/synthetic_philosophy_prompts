answer: |-
  This is an exceptionally sharp diagnosis of the situation. You have correctly identified that the Quine-Chomsky stalemate is one of the most enduring impasses in 20th-century analytic philosophy, and your hypothesis about the nature of the disagreement is widely shared by contemporary meta-semanticists.

  Here is a breakdown of your diagnosis, the substantive core that remains, and where progress might actually lie.

  ### 1. Is it a verbal dispute about "facts"?
  **Verdict: Largely yes, but with substantive roots.**

  Your hypothesis is correct: the deadlock stems from divergent criteria for **ontological commitment**.

  *   **Quine's Criterion:** "To be is to be the value of a bound variable," constrained by a rigorous physicalism. For Quine, a "fact of the matter" must cash out in terms of physical states or observable behavior. Since multiple translation manuals are compatible with all physical/behavioral data, and there is no "meaning entity" floating above the physics to break the tie, there is **no fact of the matter**. For Quine, indeterminacy is *ontological*.
  *   **Chomsky's Criterion:** Methodological naturalism. For Chomsky, a "fact" is whatever is posited by the best explanatory theory of a natural phenomenon (in this case, the human language faculty). If positing specific semantic contents explains linguistic competence better than denying them, then those contents are real facts, just like genes or tectonic plates. For Chomsky, the issue is merely *epistemological underdetermination* (we can't tell which is true yet), not *ontological indeterminacy* (there is no truth to be had).

  When Quine says "there is no fact," he means "there is no physical fact." When Chomsky says "there is a fact," he means "there is a psychological fact." They are talking past each other because they disagree on the hierarchy of sciences. Quine privileges physics; Chomsky privileges cognitive science.

  **However**, it is not *merely* verbal. The substantive disagreement is about **supervenience**. Quine argues that semantic facts do not supervene on physical facts (two physically identical speakers could mean different things). Chomsky (and most realists) argue that semantic facts *do* supervene on internal physical/functional states. That is a genuine metaphysical clash, not just a definitional one.

  ### 2. Is there a genuine substantive issue about meaning as a natural kind?
  **Verdict: Yes.**

  If we strip away the verbal dispute about the word "fact," the substantive core is: **Can semantics be naturalized?**

  Quine's *gavagai* argument is essentially a challenge to the idea that meaning is a **natural kind**. If meaning were a natural kind (like "water" or "tiger"), we should be able to locate it in the causal structure of the world. Quine argues we cannot; the causal structure (behavior/physics) is too coarse-grained to distinguish *rabbit* from *undetached rabbit part*.

  The substantive debate since the 70s has been an attempt to answer Quine by providing a naturalistic theory of content that breaks the tie.
  *   **Causal/Informational Semantics (Fodor, Dretske):** Tries to link meaning to causal covariance. (Problem: The disjunction problem—how to distinguish "means rabbit" from "means rabbit or rabbit-stage").
  *   **Teleosemantics (Millikan, Papineau):** Tries to link meaning to biological function. (A frog's snap mechanism means *fly* because that is its evolutionary function, not because of current behavior).
  *   **Conceptual Role Semantics:** Meaning is determined by inferential role within the system.

  If any of these programs succeed, Quine is wrong about the substantive issue: there *is* a physical/functional fact that determines meaning, even if behavioral evidence doesn't reveal it. If they all fail, Quine might be right that meaning is not a natural kind.

  ### 3. What would count as progress?
  The debate has stagnated because everyone keeps replaying the 1960s behaviorism-vs-mentalism tape. Progress requires shifting the framework. Here are three avenues that count as genuine movement:

  **A. The Kripkean Turn (Rule-Following)**
  In 1982, Kripke's *Wittgenstein on Rules and Private Language* revitalized this debate. Kripke shifted the focus from *translation* (Quine) to *individual meaning* (Kripke's Wittgenstein). He argued that there is no fact about what *I* mean by "plus" that distinguishes addition from "quaddition."
  *   **Progress:** This forced the debate away from behaviorism toward **normativity**. The question is no longer "what causes the utterance?" but "what justifies it?" This opened the door for **inferentialist** approaches (Brandom) which dissolve the *gavagai* problem by denying that meaning is primarily about reference (naming rabbits) and arguing it is about inference (what follows from calling something a rabbit).

  **B. Two-Dimensional Semantics**
  Philosophers like David Chalmers have introduced distinctions between **epistemic** and **metaphysical** dimensions of meaning.
  *   **Progress:** This allows us to say: Quine is right that translation is *epistemically* indeterminate (we can't know which manual is right from the outside), but Chomsky is right that it is *metaphysically* determinate (there is a fact about the speaker's internal state). This dissolves the tension by assigning Quine and Chomsky to different modal domains.

  **C. Experimental Philosophy and Cognitive Science**
  Quine assumed a "blank slate" behaviorist psychology. Chomsky assumed a Universal Grammar.
  *   **Progress:** Modern cognitive science doesn't look like either. If neuroscience could identify specific neural circuits that activate for *rabbit* but not for *undetached rabbit part* (perhaps due to object-file systems in infancy), Quine's claim that the physics underdetermines the meaning weakens.
  *   **Caveat:** A hardline Quinean would reply that the neural data is just more physical data, still compatible with multiple interpretations. But if the *functional architecture* of the brain makes the "rabbit" interpretation computationally privileged over the "rabbit-stage" interpretation, that is a physical fact that breaks the symmetry.

  ### 4. Is this an ill-posed question destined to stay open?
  It is not ill-posed, but it is likely **dissolvable**.

  The reason it feels like a standstill is that Quine and Chomsky are operating with different **philosophical methodologies**.
  *   Quine is doing **descriptive metaphysics** (cataloging what exists according to our best physics).
  *   Chomsky is doing **scientific realism** (trusting the posits of special sciences).

  **The way out:**
  The most promising path for your seminar is to argue that the question "Is there a fact of the matter?" is the wrong question. The right question is: **"What theoretical work does the notion of 'meaning' do for us?"**

  *   If we need "meaning" to explain communication and cognitive processing, then (à la Chomsky/Dennett) there is a "real pattern" there, and we should treat it as factual.
  *   If we demand "meaning" to be a ghostly entity that transcends physical use, then (à la Quine) there is no fact.

  **Recommendation for your seminar:**
  Propose that the debate is a **category mistake**. Quine treats meaning as an object to be found (like a rabbit), while Chomsky treats it as a property of a system (like digestion).
  *   **Thesis:** The *gavagai* argument succeeds only if we assume a **Referentialist** theory of meaning (meaning = reference to objects).
  *   **Antithesis:** If we adopt a **Use-Based** or **Inferentialist** theory (meaning = role in social practice or cognitive inference), the *gavagai* problem vanishes. The community does not need to distinguish "rabbit" from "rabbit part" ontologically; they only need to distinguish them pragmatically (e.g., do we count two rabbit parts as two rabbits?).

  **Conclusion:**
  Your diagnosis is right: it is largely a verbal dispute about ontology. But the substantive residue is whether semantic properties can be reduced to physical/functional properties. Progress lies not in solving Quine's puzzle on his terms, but in rejecting the behaviorist/referentialist assumptions that make the puzzle arise in the first place. The question won't stay open forever, but it will likely be **dissolved** by a better theory of cognitive architecture rather than **solved** by a new argument about translation.
