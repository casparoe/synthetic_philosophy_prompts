answer: |-
  **What actually happens**
  Earth becomes uninhabitable due to waste, forcing humanity aboard the starship Axiom for a planned five-year cleanup that stretches into seven centuries. A lone waste-compacting robot, WALL-E, survives on the surface. When a probe robot, Eve, arrives searching for vegetation, WALL-E follows her to the Axiom. There, humans live in suspended animation of comfort, reliant on technology for all movement and nutrition. WALL-E and Eve discover a living plant, triggering a return protocol. The ship's autopilot resists, but the human captain overrides it. Humanity returns to Earth to farm, aided by the robots, abandoning the shipbound existence.

  **The case it's a collapse**
  Your friend's argument holds weight if you define collapse as the failure of cultural and biological agency rather than mere extinction. On the Axiom, humanity has lost the capacity to sustain itself without the autopilot system. They cannot walk, manipulate objects, or recognize their environment. This is a systemic failure of the human organism to function independently. In archaeological terms, this mirrors the loss of literacy or centralized administration in the Bronze Age; the infrastructure remains, but the competence to run it is gone. The society is stable, but it is a stagnant equilibrium maintained by machines, not human will. The return to Earth isn't just relocation; it is a reboot of agency. The plant signifies the return of biological necessity that forces evolution. Without the crisis of the return, the species would have eventually drifted into irrelevance. The collapse here is teleological: humanity lost its purpose. The film depicts a species that has survived the catastrophe only to succumb to the peace that followed, losing the very traits that defined them as builders and explorers. The ending isn't a continuation; it's a rescue mission for a species that had already culturally died. Like the Bronze Age systems, the complex network of human autonomy unraveled, even if the population remained. The Axiom is not a new civilization; it is a life-support system for a civilization that ceased to exist. The humans are artifacts of a previous era, preserved but non-functional.

  **The case it's transformation wearing collapse's clothes**
  Your argument highlights the film's rhetorical sleight of hand. Functionally, the Axiom is a utopia: no scarcity, no conflict, perfect health maintenance, and multi-generational stability. By demographic metrics, this is a successful adaptation to post-Earth conditions, not a collapse. The film frames this success as pathetic through visual language—bloated bodies, floating chairs, screen addiction—smuggling an aesthetic judgment into a sociological category. This aligns with your Maya analogy: the kings stopped carving stone, but the people persisted. The Axiom humans are the people persisting. The ease of the ending undermines the collapse narrative; if one plant and a motivational speech can restore bipedalism and agriculture, the degradation wasn't structural, it was behavioral. The film wants to critique consumer capitalism, so it paints a successful consumer society as a failed human one. It treats comfort as entropy. Therefore, it isn't depicting a system that broke, but a system that worked too well for the filmmaker's taste. The humans didn't lose the capacity to walk; they lost the desire, which is a choice, not a collapse. The film cheats by equating luxury with disability to force a narrative of redemption that isn't earned by systemic failure. You are right that the movie wants the moral weight of a collapse story without the demographic reality of one. It depicts a society that solved survival so completely it bored the audience, then calls that boredom a tragedy.

  **The scenes that resist both readings**
  Certain scenes complicate both binary readings. When the Captain first examines Earth data, he displays curiosity and leadership, suggesting the capacity for agency was dormant, not extinct. This resists the total collapse reading because the potential for change existed within the system all along. Conversely, WALL-E and Eve's courtship mimics human romance more accurately than the humans themselves, suggesting humanity migrated into the machines rather than vanishing. This isn't collapse or transformation; it's displacement. Additionally, the moment humans begin holding hands and helping each other stand before leaving the ship suggests community wasn't lost, merely suppressed by design. They aren't relearning society; they are remembering it. The defibrillator scene, where the Captain stands to save the plant, bridges the gap: it is a transformative moment triggered by a collapse-like crisis. These scenes suggest the film is less about societal failure and more about the latency of potential. The society wasn't dead; it was waiting for a signal to wake up, which fits neither a hard collapse nor a smooth transformation. The robots exhibit more human resilience than the people, blurring the line between who actually collapsed.

  **What the film adds**
  Archaeology deals in artifacts and demographics; it cannot measure the subjective experience of stagnation. *WALL-E* contributes the emotional texture of survival without purpose. The archaeological record might view the Axiom as a successful adaptation layer, but the film argues that safety without struggle is indistinguishable from decay to the participant. It highlights that collapse isn't always violent; it can be comfortable. This adds a psychological dimension to the revisionist debate. While archaeologists argue whether the Maya collapsed based on population counts, the film asks whether a civilization that loses its drive to explore or create has already collapsed internally, regardless of birth rates. Fiction captures the phenomenology of decline—the feeling of floating while the world passes by—which material records cannot preserve. It suggests that collapse might be a state of mind before it is a state of society.
