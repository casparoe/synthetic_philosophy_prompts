      *   *Section 3: Closure.* Explicitly state the failure. $Kq$, $q \to p$, $\neg Kp$. Discuss Nozick's intent (blocking skepticism). Discuss if this fits the case. It captures the fragility of the "no missiles" claim vs the robustness of the "machine error" claim.
