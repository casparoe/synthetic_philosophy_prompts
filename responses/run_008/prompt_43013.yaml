  ### Logical Space & Branch Questions

  To map the schools without presupposing their names, we define six epistemological and metaphysical intuitions. Each question offers a binary choice based on concrete cases. The combinations of answers create "logical slots" into which the schools fall.

  **The Six Questions:**
  1.  **Inference (Smoke):** Seeing smoke rising from a distant hill (fire out of view) gives you **knowledge** that there is fire, not just a strong expectation. (Yes/No)
  2.  **Testimony (Report):** A trustworthy person's report about a place you have never visited gives you knowledge **distinct in kind** from what you could infer from clues. (Yes/No)
  3.  **Postulation (Fat Man):** The fact that a robust man never eats during the day supports the conclusion that he eats at night via a **unique** method of knowing (not just standard inference). (Yes/No)
  4.  **Comparison (Gavaya):** Being told an unfamiliar animal resembles a cow, then recognizing it as a *gavaya*, grants **new knowledge** distinct from memory and perception. (Yes/No)
  5.  **Absence (Empty Room):** Failing to find a jar in a carefully checked, well-lit room is itself **something you learned** (knowledge of absence), rather than just the absence of learning. (Yes/No)
  6.  **Reality (World):** The world you perceive is **ultimately real** (pluralist), not a misperception of a single reality (non-dualist). (Yes/No)

  ***

  ### The Decision Tree

  **START:** You are a thinker trying to account for how you know what you know.

  **Q1. Inference:** Does seeing smoke on a distant hill give you *knowledge* of fire, or only expectation?
  *   **NO (Only Expectation):** → **LEAF 1: Cārvāka**
      *   *Diagnosis:* You accept only direct perception. Inference, testimony, and metaphysics are unreliable.
  *   **YES (Knowledge):** → Go to Q2.

  **Q2. Testimony:** Does a trustworthy report give knowledge *distinct* from inference?
  *   **NO (It is just Inference):** → **LEAF 2: Buddhist Logicians**
      *   *Diagnosis:* You accept Perception and Inference. Testimony is valid only because you infer the speaker is reliable. (Note: Metaphysics of no-self assumed).
  *   **YES (Distinct Source):** → Go to Q3.

  **Q3. Postulation:** Is the "Fat Man" case (eating at night) a *unique* way of knowing?
  *   **NO (It is standard Inference):** → **The Logical Realists** (Go to Q4).
  *   **YES (Unique Method):** → **The Vedic Epistemologists** (Go to Q5).

  **Q4. (Logical Realists) Comparison:** Is the *gavaya* recognition a *distinct* type of knowledge?
  *   **YES:** → **LEAF 3: Nyāya**
      *   *Diagnosis:* You accept 4+ tools of knowledge. You are a pluralist realist.
  *   **NO:** → **LEAF 4: Vaiśeṣika**
      *   *Diagnosis:* You prefer a minimalist epistemology (Perception + Inference) focused on atomic categories.
      *   *⚠️ FLAG (Unseparated):* Later Nyāya and Vaiśeṣika merged historically. This split relies on early Vaiśeṣika minimalism.

  **Q5. (Vedic Epistemologists) Absence:** Is the empty room case (knowledge of absence) distinct?
  *   **NO:** → **LEAF 5: Prābhākara Mīmāṃsā**
      *   *Diagnosis:* You accept Postulation but deny Absence is a separate tool (absence is just perceived context).
  *   **YES:** → Go to Q6.

  **Q6. (Vedic Epistemologists) Reality:** Is the perceived world ultimately real?
  *   **YES:** → **LEAF 6: Bhāṭṭa Mīmāṃsā**
      *   *Diagnosis:* You accept all 6 tools of knowledge. The world is real; the Veda commands duty (*dharma*).
  *   **NO:** → **LEAF 7: Advaita Vedānta**
      *   *Diagnosis:* You accept the same tools as Bhāṭṭa, but use them to prove the world is illusion (*māyā*) and only Brahman is real.

  ***

  ### Logical Combinations & Empty Slots

  The tree generates $2^6 = 64$ theoretical combinations, but the branching structure prunes impossible paths.

  *   **Occupied Leaves (7):** Listed above.
  *   **⚠️ FLAG (Unseparated Pair):** **Nyāya and Vaiśeṣika.** In later classical periods, Vaiśeṣika adopted Nyāya's epistemology. This tree separates them based on early textual priorities (minimalism vs. maximalism), but a student holding later Vaiśeṣika views will land on Nyāya.
  *   **⚠️ FLAG (Empty Combination):** **No Inference + Yes Postulation.** It is incoherent to accept "Postulation" (inferring a hidden cause to explain an anomaly) while rejecting "Inference" (inferring fire from smoke). Postulation is a sophisticated form of inference; rejecting the latter makes the former impossible.
  *   **⚠️ FLAG (Empty Combination):** **No Testimony + Yes Postulation.** Postulation often relies on authoritative context or complex reasoning akin to testimony. While theoretically possible, no major school accepts Postulation (a Vedic specialty) while rejecting Testimony (Vedic authority).

  ***

  ### Note on Weaknesses & Contested Placements

  This tree is a pedagogical tool, not a metaphysical proof. I am least confident in two areas:

  1.  **Nyāya vs. Vaiśeṣika (Q4):** This distinction rests on the *early* Vaiśeṣika rejection of Comparison (*upamāna*). By the time of the *Nyāya-Vaiśeṣika* synthesis (c. 10th century CE), they share the same epistemology. If your course focuses on later Indian philosophy, these two leaves collapse into one. To fix this, I would replace Q4 with a metaphysical question about atoms vs. properties, but that violates the "ordinary experience" constraint.
  2.  **Advaita vs. Bhāṭṭa Mīmāṃsā (Q6):** Epistemologically, Śaṅkara (Advaita) borrows heavily from Kumārila (Bhāṭṭa). Distinguishing them solely by "World Reality" risks oversimplifying Advaita's empirical realism (*vyāvahārika satya*). A more precise splitter would be "Does the Veda primarily command action or reveal identity?" but that requires students to know what the Veda *is*. I would redesign this branch if the course emphasizes ritual theory over metaphysics.
  3.  **Buddhist Placement (Q2):** Placing Buddhists at "Testimony = Inference" follows Dignāga and Dharmakīrti. However, some Buddhist traditions accept scripture (*āgama*) with higher authority. If your course covers Mahāyāna faith traditions rather than Logicians, this leaf is inaccurate.

  *Contested Reading:* The placement of **Prābhākara Mīmāṃsā** assumes they reject Absence (*anupalabdhi*) as a separate *pramāṇa*. While standard, some interpreters argue they accept it implicitly. If your primary text treats Prābhākara as accepting 6 *pramāṇas*, merge Leaf 5 and Leaf 6 and split them by "Ritual Duty vs. Liberation."
