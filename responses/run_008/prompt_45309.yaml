      *   **Expected Value (Total Utilitarianism):** Calculate utility. 5,000 * moderate benefit > 1% * (200 * extreme suffering). Wait, if the suffering is *extreme*, EV might actually say stop. I need to tune the numbers so EV says *Go*.
