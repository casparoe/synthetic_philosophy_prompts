  ### The Scenario: The Greenwood Housing Initiative

  The City Council is voting on the Greenwood Initiative, a high-density housing development designed to relocate 5,000 families from substandard, mold-ridden apartments into safe, modern units, reliably preventing thousands of cases of severe pediatric asthma and granting these families a decade of stable health. However, the geological survey indicates a 1% probability that the land sits on a previously undetected pocket of reactive shale; if this pocket exists, the building's ventilation system will inadvertently concentrate a colorless byproduct gas, subjecting the 200 families in Block C to five years of severe, chronic neurological pain and respiratory agony before the defect is discovered and fixed. Demographic modeling confirms that these specific 200 families are marginal migrants who will only move to this district *because* of the new initiative; if the project is scrapped, these specific individuals will not be born into the district at all, but will instead be conceived later in different regions under safe, ordinary conditions.

  ***

  ### The Three Verdicts

  **1. Expected Value (Total Utilitarianism): Build.**
  This view aggregates all outcomes. You have 5,000 families receiving a "moderate good" (asthma prevention/stability) versus a 1% chance of 200 families receiving an "extreme bad" (agony). Even if the agony is weighted 100 times heavier than the asthma prevention, the math favors building: the expected disutility is $0.01 \times 200 \times 100 = 200$ units of suffering, while the utility is $5,000 \times 1 = 5,000$ units of benefit. Since the expected good vastly outweighs the risk-weighted bad, and existence itself is treated as a neutral or positive container for utility, the rational choice is to accept the risk to secure the large ordinary benefit.

  **2. Suffering-Focused (Negative Utilitarianism): Do Not Build.**
  This view rejects the aggregation used above. It posits an **asymmetry**: the moral urgency of relieving suffering lexically overrides the moral benefit of creating happiness or preventing moderate harm. To this view, creating a single life of intense agony is not "canceled out" by 1,000 lives of mild comfort. Because the initiative *risks* creating intense suffering that wouldn't otherwise exist, the mere possibility (weighted by the severity, not just the probability) acts as a veto. The 1% risk of torture is morally heavier than the 100% certainty of asthma prevention, so the project must be rejected to avoid the potential creation of severe negative welfare.

  **3. Person-Affecting View: The Uncomfortable Shrug.**
  This view asks: "Who is harmed?" If we build and the gas leak happens, the 200 families suffer. But if we *don't* build, those specific 200 families never exist (due to the demographic shift). Therefore, we haven't made any *existing* person worse off than they would otherwise have been; we have merely brought into existence people who have lives "worth living" overall (perhaps the pain is bad, but they still value their existence), or we have brought into existence people who suffer. The uncomfortable verdict is that we cannot say we harmed them by building, because the alternative for *them* was non-existence. Yet, intuition screams that creating a child destined for neurological agony is wrong. This view gets stuck trying to explain why creating a suffering person is bad if it doesn't harm a specific pre-existing subject.

  ***

  ### What Feature Is Doing the Work?

  You are right to suspect the **asymmetry**.

  Your colleague's claim that this is a "category error" is actually a philosophical shorthand for rejecting the **symmetry of aggregation**. Expected Value reasoning assumes good and bad are on the same number line; you can have negative utility, but it's just positive utility flipped. A suffering-focused view assumes they are on *different* axes: reducing suffering is a moral imperative, but creating happiness is not (or is much weaker).

  In the Greenwood scenario, the "category error" claim translates to: "You cannot trade a risk of agony for a certainty of comfort." That isn't a logical error; it's an ethical axiom. The reason this feels like a category error to your colleague is that, for her, suffering has a **lexical priority**. It doesn't matter how small the probability or how large the benefit; if the suffering is intense enough, it exits the calculus of trade-offs.

  ### Is the Case Rigged?

  Yes, honestly, it is rigged against Total Utilitarianism *if* we accept your colleague's intuition about intensity.

  A Total Utilitarian can always "re-jigger the numbers." If you tell them the suffering is infinitely bad, they will say "Nothing is infinite." If you tell them the probability is 1%, they will say "Increase the benefit to 10,000 families." As long as the suffering is finite and the probability is non-zero, a Total Utilitarian can mathematically construct a scenario where the benefit outweighs the risk.

  However, the case is *not* rigged regarding your colleague's core point. She is arguing that **some forms of suffering are not commensurable with ordinary benefits.** By moving this to a human scale (radon and asthma instead of simulations and extinction), you can show her that her objection isn't about the *scale* of the future (astronomical vs. human); it's about the *nature* of the trade-off.

  **How to use this with her:**
  Tell her: "I ran the numbers on a hospital-scale version of this. The math only breaks if we assume suffering and benefit are perfectly interchangeable currency. Your 'category error' point isn't about the probabilities being too small to measure; it's that you believe suffering has a veto power that benefit doesn't. That's not a math error, it's a Negative Utilitarian axiom. We need to decide if we share that axiom, not if we can do the multiplication."

  This moves the debate from "You're bad at math" to "We have different foundational ethics," which is where the actual disagreement lives.
