answer: |-
  I know exactly why this is keeping you up at night because you have stumbled onto one of the most famous and frustrating puzzles in modern ethics, known as the Non-Identity Problem, formulated by Derek Parfit. It is designed specifically to trap our intuitions in the way Elena has done, and your discomfort is the correct philosophical response even if her logic seems airtight. You asked me to pick a step to reject and defend that choice as the least costly, so I am going to tell you plainly that you should reject step one, which claims that you can only wrong someone by making things worse for that person than they would otherwise have been. This premise looks innocent because it matches almost every moral situation we encounter in daily life, where the people involved remain the same regardless of what we do. If I steal your wallet, you are worse off than you would have been if I hadn't stolen it, and that comparative harm is what makes me a thief. We naturally assume that morality is about how our actions change the trajectory of specific existing people, so the idea that wronging requires a counterfactual comparison where the same person exists in both outcomes feels like a basic truth of justice.

  However, this intuition relies on a hidden assumption that identity is fixed across different policy choices, and that is precisely what breaks down in cases involving future generations. When Elena argues that the children under the cheap policy are not worse off because the alternative is non-existence, she is forcing you to compare existence with a specific quality of life against non-existence, and while it is true that a life worth living is better than never existing, that comparison misses the moral point. By rejecting step one, you are adopting what philosophers call a non-comparative account of harm, which says that a person is harmed if they are caused to be in a bad state, such as suffering from preventable illness or having their life shortened, regardless of whether they would have been better off in an alternative scenario. This allows you to say that the council wrongs the future children not by making them worse off than they would have been, but by causing them to exist in a harmed condition when they could have caused different children to exist in a healthy condition. This preserves the idea that there is a victim, so you do not have to accept the mysticism of wrongs floating around with no one to suffer them, because the victim is the actual child living with the illness who was caused to suffer by the council's vote.

  The cost of rejecting step one is that you have to accept that morality is not purely about comparing individual welfare trajectories but sometimes about the quality of the states of affairs we bring about. This means acknowledging that we can have obligations to future people that are not grounded in their specific individual claims against us based on comparative harm, but rather on a general duty not to cause preventable suffering even if the sufferers owe their existence to that very suffering. Some people worry that this opens the door to overly demanding obligations, such as a duty to create as many happy people as possible, but you can avoid that slippery slope by setting a threshold for what counts as a harmful state rather than requiring us to maximize goodness. This is a much lower price to pay than the alternative of biting the bullet on step seven, which would force you to tell those future citizens that they have no complaint against a policy that knowingly sickened them, and it would effectively dismantle any coherent framework for climate justice or resource depletion since nearly all long-term policies change who gets conceived. If you keep step one, you are committed to the view that we cannot wrong future generations unless we make their lives so bad they are not worth living, which renders the concept of intergenerational justice meaningless. By dropping step one, you save the core of our moral intuition that causing preventable pain is wrong, even when the victims are contingent on the act, and you avoid the absurd conclusion that we have no power to wrong the future. It feels strange at first because it decouples wronging from making worse-off, but it is the only way to keep our moral language robust enough to handle the unique power we have over who comes into existence.
