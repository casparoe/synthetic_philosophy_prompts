prompt: |-
  I want an Onion-style news article for a dataset I'm building, and I want the satire to actually be about something — Hannah Arendt on lying in politics, specifically her essays on truth and politics and lying in politics. Setup: an invented country (make one up, don't use a real one — call it something bland like the Republic of Greater Velden or whatever feels right) whose Ministry of Information has just announced that its official national image is now fully self-supporting and no longer requires any reference to events that occurred. Headline plus 500ish words of deadpan news reporting: sources, a press conference, a proud official, and at least one quote from a "concerned" records clerk who still insists on filing things that happened.

  The jokes have to come from getting Arendt right, not just from generic "politicians lie" material. I'm thinking specifically of: her distinction between the old-fashioned lie, which hides one particular fact and leaves the surrounding factual texture intact, and modern organized lying, which tries to remake the whole texture at once; her point that the image-makers become the first and most reliable victims of their own images, because someone has to keep the fictive world internally consistent and eventually those people can't check it against anything; the observation that whoever lies first has an advantage, since every correction repeats and spreads the original story; and the darker one, that once the shared sense of reality goes, it's not just the public that can't orient itself — the staff at the top lose their own footing too, and start making decisions inside the world they invented rather than the one they're governing. If you can work in something about how lying is by nature pragmatic and goes stale the moment it succeeds, bonus points. Don't strawman the officials — the target is the internal logic of image-making, not that they're dumb, and the funniest version is one where an Arendt scholar reads it and says yeah, that's the argument.

  You're a satirical writer with a background in political theory, so before drafting, spend a minute mapping each Arendtian point to the joke that's going to carry it, then write the piece so someone who knows nothing about Arendt still finds it funny. Keep it deadpan throughout — no winking at the reader. No citations or quotes from her actual texts, just write from what you know of the ideas. Around 500 words for the article body, roughly.
