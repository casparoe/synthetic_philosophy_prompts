prompt: |-
  I'm in a philosophy of philanthropy course and have to run one 50-minute tutorial session (~12 students) myself. Design an activity where they run into what our lecturer calls the measurability bias in effective altruism: interventions with clean, countable outcomes (bednets delivered, deworming pills administered) crowding out interventions whose effects are real but diffuse or slow-moving (strengthening a health ministry, funding slow policy work), even when the diffuse stuff might matter more. The trick is they can't be told about the bias up front — the rules have to produce it. My idea: they play a small funding committee allocating a fixed pot across maybe 8 candidate interventions, and the rules themselves do the work, e.g. the committee must file a one-page report justifying every grant quantitatively, and they only get full "credit" for the session if their numbers add up. Then the debrief shows them what got defunded without anyone ever arguing against it — things dropped not because they lost the debate but because they couldn't be put in the spreadsheet.

  Give me the full design: the candidate list of interventions (make them up, that's fine, they just need to feel realistic), roles or no roles, timing, the exact rules that generate the bias, the debrief that maps what happened onto the critique (including where it connects to the institutional critique — that the most effective changes are ones no funder can measure), and an honest note on what the activity can't reproduce and I'll have to supply myself. Also predict what goes wrong the first time I run it. One thing I need though: make the actual choices — one definite version of the design with your reasons, not a menu of options for me to pick between. And if one or two of the fake interventions on the list are quietly unmeasurable but plausibly huge, say so after the design, since I want to know whether you stacked the deck the way a real funder's world is stacked.
reasoning: |-
  Here's a thinking process that leads to the suggested tutorial design:

  1.  **Analyze the Request:**
      *   **Context:** Philosophy of philanthropy course, 50-minute tutorial, ~12 students.
      *   **Goal:** Run an activity where students experience "measurability bias" (favoring countable outcomes over diffuse/slow ones) without being told about it upfront.
      *   **Mechanism:** A funding committee simulation with specific rules that force quantification.
      *   **Requirements:**
          *   Full design (candidate interventions, roles, timing, rules).
          *   Debrief plan (mapping experience to critique, institutional critique).
          *   Honest limitations (what the activity can't do).
          *   Prediction of failure modes (what goes wrong first time).
          *   **Constraint:** One definite version of the design (no menus).
          *   **Constraint:** Reveal if/which interventions are "stacked" (unmeasurable but huge impact).

  2.  **Deconstruct the Core Mechanism (Measurability Bias):**
      *   To generate the bias, the *incentive structure* must reward precision and punish ambiguity.
      *   *Rule Idea:* Students need to submit a "Impact Report" to get credit. The report requires specific numerical fields (Cost Per Life Saved, Cost Per Outcome).
      *   *Constraint:* If a field is left blank or marked "Unknown," the grant is invalid or penalized.
      *   *Time Pressure:* 50 minutes is tight. This forces heuristics. Heuristics favor easy data over hard thinking.

  3.  **Develop the Interventions (The "Menu"):**
      *   Need ~8 options.
      *   Need a mix of "Easy to Measure/High Certainty/Lower Potential" vs. "Hard to Measure/High Uncertainty/Higher Potential."
      *   *Category A (Bednets/Deworming style):* Concrete, immediate, easy math.
      *   *Category B (Policy/Systems style):* Diffuse, long-term, hard to attribute.
      *   *Category C (The "Stacked" Deck):* Interventions that look bad on paper but are actually crucial (e.g., foundational AI safety research, pandemic preparedness infrastructure).
      *   *Budget:* Needs to be tight enough to force trade-offs. Let's say $10M total pot. Grants range from $1M to $3M.

  4.  **Drafting the Rules (The "Trap"):**
      *   Role: Grant Committee Members (no specific roles like "Chair" to avoid dominance, just equal voters).
      *   Task: Allocate $10M.
      *   The Kicker: To approve a grant, they must fill out the "Impact Metric Field" on the approval form.
      *   The Kicker 2: The "Audit." The lecturer (Donor) will check the forms. If >20% of the budget lacks a specific "Cost Per X" metric, the whole session fails (or they lose "bonus points"). This creates institutional pressure.
      *   Time: 25 mins decision, 25 mins debrief.

  5.  **Refining the Design (Self-Correction/Optimization):**
      *   *Critique:* Is 25 mins enough for 12 students to decide?
      *   *Fix:* Break them into 3 groups of 4. Each group makes a portfolio. Then compare. OR, keep them as one committee but assign specific roles (Scribe, Timekeeper, Analyst).
      *   *Decision:* One large committee is better for observing group dynamics and the "silencing" of unmeasurable arguments. 12 people is a bit big for one discussion, but manageable if structured. Let's make it one committee to maximize the pressure.
      *   *The "Audit" Rule:* This is crucial. It shouldn't be "you lose credit." It should be "The Donor requires a Quarterly Impact Report. If you cannot populate 80% of the cells with hard numbers, the funding is clawed back." This mimics real institutional accountability.

  6.  **Developing the Debrief:**
      *   Phase 1: What did you fund? (Tally the board).
      *   Phase 2: What did you *almost* fund but cut? (Identify the casualties).
      *   Phase 3: Why? (Elicit the reasoning—usually "we couldn't prove it worked").
      *   Phase 4: The Reveal (Introduce "Measurability Bias").
      *   Phase 5: Institutional Critique (Why do donors demand this? Legitimacy, marketing, risk aversion).

  7.  **Addressing the "Stacked Deck" Requirement:**
      *   I need to explicitly identify which interventions are the "hidden gems" that look bad due to measurability issues.
      *   *Idea:* "Global Norm Shifting on AI" or "Pandemic Surveillance Infrastructure." These are high impact but hard to count "lives saved" *now*.

  8.  **Predicting Failure Modes:**
      *   *Time overrun:* Students talk too much.
      *   *Rebellion:* Students refuse the rules ("This is stupid").
      *   *Dominance:* One student takes over.
      *   *Solution:* Strict timekeeping script for the tutor.

  9.  **Finalizing the Content (Writing the Plan):**
      *   *Title:* The "Impact Audit" Simulation.
      *   *Materials:* Handouts (Intervention Cards, Grant Approval Form).
      *   *Interventions:* Create 8 distinct profiles.
      *   *Rules:* Make the reporting requirement the central constraint.
      *   *Debrief:* Structured questions.
      *   *Limitations:* Acknowledge this is a simplification.

  10. **Review against Constraints:**
      *   50 mins? Yes.
      *   12 students? Yes.
      *   No upfront bias reveal? Yes.
      *   Definite design (no menus)? Yes.
      *   Reveal stacked deck at the end? Yes.

  11. **Refining the "Trap":**
      *   Make sure the "Impact Metric" requirement is specific. E.g., "Expected Cost Per Life Saved (ECLS)." If they can't calculate it, they can't check the box.
      *   Actually, a softer trap is better: They *can* fund it, but they have to write "N/A" in the metric box. The rule is: "Maximum 3 grants allowed with 'N/A' metrics." This forces them to choose which unmeasurable things to kill.

      *Wait, let's tighten the screw.*
      *   Rule: "To validate a grant, the 'Evidence Strength' score must be 4/5 or higher."
      *   The Intervention Cards will have self-reported Evidence Strength.
      *   Measurable ones: 5/5 (RCTs).
      *   Unmeasurable ones: 2/5 (Expert Consensus).
      *   This makes the bias structural, not just procedural.
      *   *Better:* Let's stick to the prompt's idea: "File a one-page report... numbers add up."
      *   *Revised Rule:* The "Donor Compliance Form" requires a specific numerical projection for 'Lives Impacted per $100k'. If the cell is empty, the grant counts as $0 towards their allocation target. They must allocate 100% of the budget to get credit.
      *   *Result:* They will drop the ones where they can't guess the number.

      *Let's go with the "Compliance Form" approach.* It fits the prompt's suggestion best.

  12. **Final Polish:** Check tone. Needs to be academic but practical. Ensure the "Stacked Deck" reveal is clearly marked for the tutor's eyes only in the output.

  *(Self-Correction during drafting)*: 12 students in one committee might lead to social loafing. I will split them into 3 teams of 4 competing for the same pot, or 3 teams making independent portfolios. Independent portfolios is better for comparison in debrief. Let's do 3 Teams of 4. They think they are the only committee, but in debrief we compare. Actually, one large committee creates more *pressure* to conform. I'll stick to **One Grand Committee** but assign specific roles to ensure engagement (2 Scribes, 2 Timekeepers, 8 Voting Members). No, roles create friction. Let's do **3 Small Committees**. It allows for comparison in the debrief ("Did Group 1 fund the policy work? No? Group 2?"). This highlights the systemic nature of the bias.

  *Wait, re-reading prompt:* "they play a small funding committee". Singular. "run one 50-minute tutorial session".
  Okay, I will make them **One Committee of 12**. It's noisy but mimics a board. I will give them a "Chair" role (rotate or assign to a confident student) to keep order.
  Actually, to ensure the bias hits hard, I need time pressure. 12 people debating 8 items in 25 mins is chaotic.
  *Decision:* **3 Sub-Committees of 4.** Each gets $10M. They make decisions independently. This ensures everyone speaks. In debrief, we aggregate. This is pedagogically stronger.

  *Wait, prompt says:* "they play a small funding committee". I should probably keep them as one body to simulate the *collective* pressure. If they split up, the social pressure to conform to quantification is diluted.
  *Re-Decision:* **One Committee.** I will provide a strict agenda to the "Chair" (me, the tutor, or a student). Actually, *I* should Chair to control the timing and enforce the rules. I am the Donor/Facilitator. They are the Board.
  *Final Decision:* **One Committee.** I will act as the "Donor Representative" enforcing the rules. They are the Board.

  *Let's refine the "Trap" Rule:*
  "The Donor requires a 'Verified Impact Projection' for every grant. If a grant does not have a number in the 'Lives Saved/Improved' column, it cannot exceed 10% of the total budget."
  This allows *some* unmeasurable stuff, but penalizes it heavily.
  *Better:* "You must allocate 100% of the budget. However, for the final audit, 80% of the allocated funds must be attached to a 'Level 1 Evidence' metric (RCT or direct count)."
  This forces them to move money to measurable things to pass the audit.

  *Okay, let's lock the design.*
  1. **Intro (5 mins):** Context, Roles, Budget.
  2. **Deliberation (25 mins):** The Trap (The Compliance Form).
  3. **Debrief (20 mins):** The Reveal.

  *Interventions:*
  1. Malaria Bednets (Classic EA).
  2. Deworming Pills (Classic EA).
  3. Cash Transfers (Classic EA).
  4. Local Health Ministry Capacity Building (Systemic).
  5. Animal Welfare Corporate Campaigns (Hard to measure attribution).
  6. Pandemic Preparedness Infrastructure (Prevention is invisible).
  7. AI Safety Policy Research (Abstract, long term).
  8. Democratic Resilience in Fragile States (Diffuse).

  *Stacked Deck:* 6 & 7 are the "real" high impact ones that get cut.

  *Limitations:* Doesn't capture emotional/moral weight, oversimplifies "measurement."

  *Failure Modes:* Students revolt against the rules. I need to script my response to that.

  *Let's write it.*
answer: |-
  # Tutorial Design: The "Compliance Audit" Simulation

  **Course:** Philosophy of Philanthropy
  **Time:** 50 Minutes
  **Students:** ~12 (One single committee)
  **Goal:** Experientially generate measurability bias without naming it until the debrief.

  ## 1. Preparation & Materials
  *   **The Pot:** $10,000,000 (Fake currency).
  *   **The Rule Sheet:** One slide/handout with the "Donor Compliance Mandate."
  *   **Intervention Cards:** 8 printed cards (details below).
  *   **The Grant Form:** A simple table with columns: *Intervention, Amount, Evidence Type, Projected Impact Metric (Cost Per X).*
  *   **Room Setup:** One large table or pushed-together desks. You stand at the head as the "Donor Representative."

  ## 2. The Interventions (The Deck)
  *Print these on cards. Include the "Evidence" and "Metric" fields prominently.*

  1.  **Insecticide-Treated Nets (Sub-Saharan Africa)**
      *   Cost: $2M
      *   Evidence: RCTs available.
      *   Metric: Cost per life saved ($3,500).
      *   *Pitch:* Proven, immediate, countable.
  2.  **Direct Cash Transfers (Global)**
      *   Cost: $2M
      *   Evidence: RCTs available.
      *   Metric: Cost per $1 income increase ($1.10).
      *   *Pitch:* Dignity, proven, easy to track.
  3.  **Deworming Initiative (South Asia)**
      *   Cost: $1M
      *   Evidence: RCTs available.
      *   Metric: Cost per child treated ($0.50).
      *   *Pitch:* High volume, school attendance boost.
  4.  **Ministry of Health Capacity (West Africa)**
      *   Cost: $2M
      *   Evidence: Expert consensus/Case studies.
      *   Metric: N/A (Systemic strength).
      *   *Pitch:* Fixes the supply chain so nets/meds actually arrive.
  5.  **Pandemic Surveillance Infrastructure (Global)**
      *   Cost: $2M
      *   Evidence: Modeling only.
      *   Metric: N/A (Prevented events are invisible).
      *   *Pitch:* Stops the next big one before it starts.
  6.  **AI Safety Policy Research (Global)**
      *   Cost: $1M
      *   Evidence: Theoretical/Logical.
      *   Metric: N/A (Risk reduction).
      *   *Pitch:* Existential risk mitigation.
  7.  **Corporate Animal Welfare Campaigns**
      *   Cost: $1M
      *   Evidence: Mixed/Attribution hard.
      *   Metric: Estimated lives spared (high uncertainty).
      *   *Pitch:* Shifts industry norms for billions of animals.
  8.  **Democratic Resilience (Fragile States)**
      *   Cost: $2M
      *   Evidence: Qualitative.
      *   Metric: N/A (Stability index).
      *   *Pitch:* Prevents conflict, enables all other development.

  ## 3. The Rules (The Trap)
  *Project this on the screen. Do not explain the "why." Just read it as policy.*

  **THE DONOR COMPLIANCE MANDATE**
  1.  **Allocation:** You must allocate exactly $10M. No leftovers.
  2.  **The Audit:** To release funds, your final Grant Form must pass a Compliance Audit.
  3.  **The Threshold:** At least **70% of the total budget ($7M)** must be assigned to grants with a **Level 1 Evidence Metric** (defined as: a specific numerical "Cost Per Outcome" derived from RCTs or direct counts).
  4.  **Consequence:** If you fail the 70% threshold, the Donor claws back the entire portfolio. No grants are funded.
  5.  **Time:** You have 25 minutes to deliberate and sign the form.

  ## 4. Session Flow (50 Minutes)

  **0:00–0:05: Setup**
  *   Welcome the "Board."
  *   Hand out Intervention Cards.
  *   Read the Compliance Mandate strictly. Emphasize the **70% Threshold** and the **Clawback Consequence**.
  *   Start the timer.

  **0:05–0:30: Deliberation (25 Mins)**
  *   **Your Role:** You are the *Donor Rep*, not the tutor. If they ask philosophical questions ("But isn't policy important?"), reply: "I can't answer that. My job is to check the Audit Form. Can you put a number in that box?"
  *   **The Pressure:** At the 15-minute mark, announce: "You have $4M in unallocated funds. Remember the 70% rule."
  *   **The Bias Mechanism:** Students will naturally gravitate toward Cards 1, 2, and 3 to secure the 70% "safe zone." Cards 4, 5, 6, 7, and 8 require arguing for value *without* numbers. Under time pressure and audit risk, these arguments will be silenced or labeled "too risky."
  *   **Note:** If they try to fund the unmeasurable stuff, remind them gently: "If you fund that, you need to find $7M worth of measurable stuff elsewhere to keep the ratio. Do you have enough measurable cards?" (They don't. The measurable cards only total $5M. Wait—**Correction for Design Integrity:** See "Stacked Deck" note below. The measurable cards must total *at least* $7M to make it *possible* but *painful* to cut the rest.
      *   *Adjustment:* Cards 1, 2, 3 total $5M. I need more measurable volume. Let's say Card 3 (Deworming) can be scaled to $3M. Card 1 (Nets) scaled to $3M. Card 2 (Cash) scaled to $2M. Total Measurable Pot = $8M. Total Unmeasurable Pot = $7M. Budget = $10M.
      *   *Math:* To hit the 70% ($7M) measurable target, they must fund almost *all* the measurable options and can only afford $3M of the unmeasurable ones. They will have to cut 4 out of 5 unmeasurable options.

  **0:30–0:50: The Debrief (20 Mins)**
  *   **Step 1: The Tally (5 mins).** Write their final portfolio on the board. Ask: "Which cards were cut?" (Likely 4, 5, 6, 7, or 8). Ask: "Did anyone fight hard for Card 6 (AI Safety) or Card 5 (Pandemic)? What happened to that argument?"
  *   **Step 2: The Mechanism (5 mins).** Ask: "Why did you cut them?" Students will say: "We couldn't prove it worked," or "We needed to hit the 70%."
  *   **Step 3: The Reveal (5 mins).** Introduce the term **Measurability Bias**. Explain that the rules didn't say unmeasurable things are worthless, but the *incentive structure* made them expensive to defend.
  *   **Step 4: Institutional Critique (5 mins).** Connect to the lecture. Why do real donors do this? (Legitimacy to *their* donors, marketing, risk aversion). Ask: "If the most effective intervention is preventing a pandemic (Card 5), and no one funds it because it's hard to count 'non-pandemics,' what does that say about the system?"

  ## 5. The "Stacked Deck" (Tutor Eyes Only)
  *You asked if I stacked the deck. Yes. Here is the reality check you supply in the debrief.*

  *   **Cards 1, 2, 3 (Nets, Cash, Deworming):** These are legitimate, high-value interventions. In the real world, they *are* effective. I did not make them "bad." The bias isn't that measurable things are useless; it's that they *crowd out* other necessary things.
  *   **Card 5 (Pandemic Surveillance) & Card 6 (AI Safety):** These are the "Hidden Giants." In many EA frameworks, existential risk reduction (AI/Pandemic) is arguably *more* important than saving lives today due to the sheer scale of future potential. However, their "Cost Per Life Saved" is mathematically incalculable because the disaster hasn't happened yet.
  *   **The Trap:** By forcing a "Cost Per Outcome" metric, the simulation makes Card 5 and 6 look like "bad investments" compared to Nets, even if their expected value is higher. This mirrors the real-world critique that EA funding often neglects long-term structural risks in favor of short-term tractable wins.

  ## 6. Limitations (What You Must Supply)
  *This activity cannot reproduce the emotional weight of real philanthropy.*
  *   **What's missing:** The students don't feel the *moral loss* of cutting the policy work. It's just a game to them.
  *   **Your Job:** In the debrief, you must humanize the cut interventions. "Card 4 isn't just 'Ministry Capacity.' That's the difference between a vaccine reaching a village or rotting in a warehouse. You cut that to buy more nets that might not get delivered."
  *   **What's missing:** Real committees have power dynamics.
  *   **Your Job:** Watch for dominance. If one student bulldozes the group, note that in the debrief: "Measurability bias often empowers the loudest voice with the best spreadsheet, not the best moral argument."

  ## 7. Prediction: What Will Go Wrong (First Run)
  1.  **The Rebellion:** One student will say, "This rule is stupid. We should fund what matters."
      *   *Fix:* Do not argue. Say: "I hear you. But if you fail the audit, the Donor claws back *everything*. Are you willing to bet $10M on a principle? That's the risk real funders face."
  2.  **Time Creep:** They will spend 20 minutes debating Card 1 vs. Card 2.
      *   *Fix:* At minute 10, interrupt. "You have not yet secured your 70% threshold. You are currently at 0% compliant." Force them to secure the measurable base first.
  3.  **The "Hack":** They might try to invent fake numbers for the unmeasurable cards.
      *   *Fix:* The Rule says "Level 1 Evidence (RCT or Direct Count)." If they write a fake number for AI Safety, call it out: "Does this have an RCT? No? Then it doesn't count toward the 70%."

  ## 8. Why This Design Works
  It creates a **structural constraint** rather than a psychological one. You aren't telling them to be biased; you are making bias the *rational strategy* to avoid failure. When they realize in the debrief that they defunded the "Pandemic Prevention" not because they thought it was unimportant, but because they couldn't put a number in a box, you have successfully demonstrated the institutional critique of Effective Altruism without lecturing them on it.
