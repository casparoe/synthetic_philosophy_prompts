answer: |-
  The money analogy successfully establishes gender as an objective institutional fact but fails to justify individual authority over category validation, meaning it validates social stability better than radical revisability.

  **Mapping the Analogy**
  To audit the comparison, we must assign specific institutional roles to social mechanisms:
  *   **The Currency:** Gender categories (man, woman, non-binary).
  *   **Intrinsic Value:** Biological sex characteristics (which the analogy posits as irrelevant to value, just as gold reserves are irrelevant to fiat currency).
  *   **The Central Bank/Mint:** The coalition of state institutions, medical gatekeepers, and cultural elites that authorize category changes (e.g., legal recognition, hormone therapy access).
  *   **Counterfeiting:** Attempting to claim a gender status without social or institutional recognition (being "read" as deceptive) or, conversely, denying recognition to someone who holds valid "currency" (exclusion).
  *   **Exchange Rates:** Intersectional privilege; gender capital buys different levels of safety or status depending on race, class, and geography.
  *   **Hyperinflation:** The conservative critique that proliferating identity categories dilutes the political utility and coherence of the term "woman," rendering the currency worthless.
  *   **Currency Reform:** Historical shifts in gender norms (e.g., women entering the workforce), which change the value and definition of the categories without biological alteration.

  **Where the Mapping Breaks Down**
  Three disanalogies critically impact the argument's utility:
  1.  **Embodiment:** Money is external to the holder; you do not *feel* like a £5 note. Gender is phenomenologically internal. You can stop using money, but you cannot easily opt out of gendered treatment or internal identity. This makes gender *more* binding than money, not less.
  2.  **Decentralization:** Money has a clear Central Bank. Gender has no single mint; authority is distributed among law, medicine, peers, and the self. This makes "currency reform" (changing norms) slower and messier than monetary policy, undermining the "revisable by fiat" claim.
  3.  **Fungibility:** All £5 notes are interchangeable. All instances of "woman" are not socially interchangeable due to hierarchy. This disanalogy matters for political arguments about class solidarity within gender categories.

  **Assessing the Conflicting Uses**
  The analogy cannot support both "fully revisable by fiat" and "stable/binding" simultaneously for the same agent, but it can support them for different agents:
  *   **Collective Revisability (True to Analogy):** Just as a state can switch to the Euro, societies can shift gender categories (e.g., recognizing non-binary statuses). The analogy supports the idea that gender is contingent on collective agreement, not biology.
  *   **Individual Bindingness (True to Analogy):** Just as an individual cannot print their own money and expect to buy bread, an individual cannot unilaterally declare a gender and expect social recognition without institutional or interpersonal backing. The analogy supports the view that gender is externally binding.
  *   **Individual Fiat (False to Analogy):** The analogy *undermines* the argument that self-identification alone is sufficient. In the money analogy, the individual is the *user*, not the *mint*. If trans inclusion arguments rely on the individual being their own Central Bank, the money analogy breaks, because it introduces the problem of counterfeiting (social friction when recognition is withheld).

  **Verdict on "Real-but-Constructed"**
  The conclusion that gender is real despite being constructed survives the audit. John Searle's concept of "institutional facts" applies to both: money and gender exist because we agree they exist, and that agreement has real-world consequences (you can be jailed for counterfeiting money or assaulted for gender transgression). However, the analogy clarifies that "constructed" does not mean "voluntary." Money is constructed, but you cannot wish yourself rich; gender is constructed, but you cannot necessarily wish yourself recognized without social uptake.

  **A Better Analogy**
  **Language** is a superior analogy for this specific philosophical work.
  *   **Constructed but Real:** Words have no intrinsic meaning, yet you cannot communicate using private definitions.
  *   **Revisability:** Language evolves over time through usage (collective action), not by individual fiat (you can't invent a word and have it stick overnight) nor by rigid decree (academies often fail to stop slang).
  *   **Authority:** Meaning is negotiated between speaker and listener. If you say "I am a woman," it functions like a speech act that requires uptake to be fully felicitous.
  *   **Embodiment:** Like gender, language is a medium we inhabit and use to express internal states, rather than an external token we exchange.

  The language analogy preserves the "real-but-constructed" ontology while better accommodating the tension between individual identity and social recognition, avoiding the transactional coldness and centralized authority implications of the money analogy.
