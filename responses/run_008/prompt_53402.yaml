      *   **Tone:** Philosophical, analytical, fair, and accessible (since the user felt the original argument was "over my head").

  2.  **Deconstruct the Argument Moves:**

      *   **Move 1 (Frances):** Testimonial belief requires non-testimonial evidence of competence/sincerity (ideally observed track record). Trust in Marco was irresponsible because no prior observation. Testimony needs independent credentials.
          *   *Philosophical Context:* This is **Reductionism** (specifically Humean reductionism). Testimony reduces to perception, memory, and induction.
          *   *Critique:* It sets a very high bar. Is it *necessary* to have observed a track record personally?
