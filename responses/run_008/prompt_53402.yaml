      *   **Move 2 (Theo):** The demand is impossible. Background beliefs (language, geography, honesty) are testimonial. Children learn without inductive bases. Acceptance should be default; look for defeaters, not prior grounds.
          *   *Philosophical Context:* This is **Anti-Reductionism** (specifically Reid's or Burge's Principle of Credulity/Transmission).
          *   *Critique:* Strong point about the regress problem. Children do learn. But is *default* acceptance always safe?
          *   *Verdict:* Sound regarding the regress/learning problem. Strong challenge to Frances.

      *   **Move 3 (Frances):** Distinction between mundane and high-stakes. Ordinary assertions rely on aggregate evidence of truthfulness. High-stakes (costly error) require checkable credentials. Marco had a commercial stake (conflict of interest).
          *   *Philosophical Context:* Contextualism or Interest-Relative Invariantism regarding justification. Also raises the issue of **Conflict of Interest**.
          *   *Critique:* Nuanced. Acknowledges we can't check everything. Highlights the specific risk (financial incentive).
