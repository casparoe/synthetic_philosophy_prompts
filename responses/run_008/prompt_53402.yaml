      *   **Move 4 (Theo):** Incentive cuts both ways (injury = lost livelihood). The belief about the guiding economy is testimonial (undermining Frances). Accuses Frances of retreating from speaker-specific verification to aggregate confidence.
          *   *Philosophical Context:* Counter-argument on incentives. Pointing out inconsistency in Frances's reductionism (using testimony to justify testimony).
          *   *Critique:* Strong point on the regress (using testimony to validate testimony). The incentive argument is a wash (both risk exist). The "retreat" accusation is sharp.
          *   *Verdict:* Sound on the regress/inconsistency. Partly sound on incentives (it's complex).

