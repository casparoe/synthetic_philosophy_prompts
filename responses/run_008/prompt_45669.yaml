  **JOINT STATEMENT OF ADVERSARIAL COLLABORATION**
  **Subject:** The Ontological Status of Free-Floating Rationales
  **Date:** 24 October 2023
  **Parties:** Dr. E. Vance (Realist), Dr. J. Thorne (Deflationist), Dr. A. Mercer (Mediator)

  ### 1. Points of Consensus

  Both parties affirm the following claims as accurate descriptions of the phenomena under discussion, irrespective of their differing interpretations of the underlying metaphysics.

  1.  **Darwinian Framework:** Both parties accept standard evolutionary theory. There is no teleological force, world-soul, or conscious designer guiding biological evolution. Apparent design is the result of blind variation and natural selection.
  2.  **The Digger Wasp:** Regarding *Philanthus triangulum* (the digger wasp) and its fixed-action patterns: Both parties agree the behaviour is mechanistic and triggered by environmental stimuli. Both agree that describing the behaviour as 'checking for intruders' is scientifically productive, even if the wasp possesses no concept of 'intruder'.
  3.  **Convergent Evolution (Camera Eyes):** Both parties agree that the independent evolution of camera-type eyes in vertebrates and cephalopods demonstrates that physical and optical constraints limit the solution space. The similarity is not coincidental but dictated by the laws of physics and physiology.
  4.  **Termite Mounds:** Both parties agree that termite mounds exhibit complex functional organisation (ventilation, temperature regulation) without a central architect. The 'design' is distributed across the swarm and the environment.
  5.  **Self-Organising Systems (Crowds and River Deltas):** Both parties agree that patterns such as pedestrian walking lanes or river delta branching minimise energy dissipation or friction according to physical laws. Both parties agree these patterns can be *described* using functional language (e.g., 'the river branches to reduce flow velocity').
  6.  **Artificial Neural Networks:** Both parties agree that trained neural networks often arrive at solutions that human observers can retrospectively describe in rational terms (e.g., edge detection, heuristic shortcuts), despite the internal weights not being explicitly programmed to do so.
  7.  **Scientific Utility:** Both parties agree that 'design stance' or 'intentional stance' explanations are indispensable heuristics in biology, cognitive science, and engineering. They compress data and generate accurate predictions.

  ### 2. Residual Disagreements

  The following points outline the precise locus of the dispute. Each point is stated twice: once in terminology the Realist finds ontologically faithful, and once in terminology the Deflationist finds methodologically accurate.

  **Topic A: The Ontological Status of the 'Because'**

  *   **Realist Formulation:** When we state 'the wing is shaped *because* this shape reduces drag', we are referencing a causal fact about the world that obtains independently of any observer. The rationale is a feature of the causal structure of the universe, discoverable in the same manner as a mountain range, regardless of whether an engineer or organism ever represented it.
  *   **Deflationist Formulation:** When we state 'the wing is shaped *because* this shape reduces drag', we are adopting a predictive stance that treats the object *as if* it were designed for a purpose. This is a useful metaphor for compression; there is no 'reason' residing in the wing, only physical causes which we find convenient to narrate as reasons.

  **Topic B: The Necessity of Etiology (Selection History)**

  *   **Realist Formulation:** While selection history explains *how* a rationale came to be instantiated, the rationale itself (e.g., energy minimisation in a river delta) holds true even in systems without a history of natural selection. A stable functional organisation carries a rationale in virtue of its current causal powers, not merely its past.
  *   **Deflationist Formulation:** The term 'rationale' or 'function' is strictly bound to systems with a history of selection (biological or cultural) or intentional design. Applying 'rationale' to a river delta or a crowd is a category error; it is merely physical causation. Without a selector (natural or artificial), there is no function, only physics.

  ### 3. Analysis of Verbal Dispute

  There is a significant risk that this disagreement is partially verbal. If 'rationale' is defined by the Realist as 'any stable causal relation that can be described functionally', and by the Deflationist as 'a relation resulting from a selection process', they are not disagreeing about the world, but about the extension of the word 'rationale'.

  However, a substantive disagreement remains regarding **indispensability**. If functional talk is indispensable to mature biology, does this indispensability track truth (Realist) or merely utility (Deflationist)? If the latter, the Realist is committed to an ontology that the Deflationist views as superfluous. The parties agree to proceed under the assumption that the dispute is substantive until proven otherwise by the tests below.

  ### 4. Cruxes and Agreed Tests

  The following table outlines the specific sub-questions (cruxes) that, if settled, would resolve or significantly narrow the disagreement. For each crux, a test case or argument is proposed, along with the predictions and concession criteria for each party.

  | Crux | The Agreed Test / Thought Experiment | Realist's Prediction & Concession | Deflationist's Prediction & Concession |
  | :--- | :--- | :--- | :--- |
  | **1. Indispensability vs. Truth**<br>Does the necessity of 'because'-talk in mature science imply the truth of the rationale? | **Analysis of Phlogiston/Caloric:** Examine historical scientific terms that were indispensable for prediction in their time but later deemed ontologically false. | **Prediction:** Indispensability in a mature, converged science (like modern biology) tracks reality, unlike early chemistry.<br>**Concession:** If functional talk is shown to be a temporary heuristic destined to be replaced by pure physics, I will abandon realism. | **Prediction:** Indispensability tracks utility, not truth. We keep 'reasons' because they compress data, not because they exist.<br>**Concession:** If functional explanations are shown to be irreducible to physical laws *even in principle*, I will accept they track something real. |
  | **2. Etiology and Function**<br>Does a system require a selection history to possess a 'rationale'? | **The 'Alien Artifact' Case:** Consider a complex object found in space. We reverse-engineer it. Later we discover it was not designed/selected, but formed by a rare, non-selected physical anomaly that mimics design. | **Prediction:** The rationale remains. If it works to achieve an end, the rationale is present in the structure, regardless of origin.<br>**Concession:** If it is agreed that without a 'for-what' (selection/intent), the object merely *has* effects but no *function*, I will modify my view on etiology. | **Prediction:** Without selection or intent, it has no function/rationale. It is merely a causal chain. Calling it a 'tool' is a mistake.<br>**Concession:** If we agree that physical constraints alone can generate 'proper function' without history, I will accept rationales can be free-floating of history. |
  | **3. The Neural Network Case**<br>Do trained weights contain discovered rationales or projected patterns? | **Interpretability Analysis:** A network solves a problem. We identify a sub-network that performs a logical operation (e.g., 'if X, then Y'). We then prune the network to remove human-interpretable structures without losing accuracy. | **Prediction:** The network 'found' the rationale. The rationale exists in the solution space. Removing the interpretable structure removes the rationale's instantiation.<br>**Concession:** If the network performs identically without the structure we call 'rational', I will admit the rationale was in the observer, not the net. | **Prediction:** The rationale is entirely in the observer's interpretation. The weights are just numbers minimising a loss function.<br>**Concession:** If the network spontaneously develops a structure that is *necessary* for the solution and matches human logic, I will admit there is a 'fact of the matter' about the reason. |

  ### 5. Sign-off

  By signing below, both parties agree that the above document accurately reflects the current state of their disagreement and commit to abiding by the concession criteria outlined in Section 4.

