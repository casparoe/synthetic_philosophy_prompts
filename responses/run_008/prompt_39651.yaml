      *   Deterrence *has* worked so far, but "so far" isn't "forever."
      *   Arms control matters because it reduces the *risk* of the analogy breaking (e.g., reducing alert levels, verifying numbers to prevent first-strike fears).
      *   Stability is not physical (like a table); it's psychological and political. It can wobble.

  5.  **Address Hobbes and Schelling:**
