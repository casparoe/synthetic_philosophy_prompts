      *   *Schelling:* Thomas Schelling (*The Strategy of Conflict*) is the real heavyweight here. He *did* formalize the logic of MAD. *However*, Schelling was deeply concerned with crisis stability, the "threat that leaves something to chance," and the risk of accidental war. He didn't say it was "solved"; he said it was a dangerous bargaining process. He emphasized that rationality is bounded.
      *   *Verdict:* They complicate the story. Hobbes highlights the incentive to strike first out of fear. Schelling highlights the fragility of communication and the risk of losing control.

