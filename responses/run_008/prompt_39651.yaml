      *   *Trigger Finger:* Launch authority (President/PM, but also systems/automation).
      *   *The Rule (Shoot first, die second):* Second-strike capability / Retaliation.
      *   *The Standoff:* Crisis stability.

  3.  **Identify the Breakdowns (Where the Analogy Fails):**
      *   *Human Agency vs. Systems:* A duel is two individuals. Nuclear war involves complex bureaucracies, early warning systems, false alarms, and potential unauthorized use.
      *   *Rationality:* The duel assumes rational actors who value survival above all. What about irrational leaders, misperception, or domestic political pressure?
      *   *First Strike Incentives:* In a pistol duel, if I shoot, I die. In nuclear war, if I think you *might* disarm me with a first strike, I have an incentive to shoot *before* you do (Crisis Instability). This is the "Use 'em or lose 'em" problem.
      *   *More than Two Players:* The duel is dyadic (1v1). Reality is multipolar (US, Russia, China, India, Pakistan, Israel, NK, etc.).
      *   *Accidents/Unauthorized Launch:* Pistols don't go off by themselves (usually). Nukes have technical failures, cyber vulnerabilities, and rogue commanders.
