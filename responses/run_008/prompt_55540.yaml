      You fear the Acquaintance objection (#1). It is epistemically fatal. However, the **Causal Closure/Covariation Coherence** objection is metaphysically worse. If the physical cause produces the quale without physical interaction, you violate causal closure or endorse occasionalism. The Identity Theorist (#2) will hint at this. If you cannot explain *how* the physical necessitates the non-physical without causal interaction, you look like a dualist who denies interactionism without gaining dualist benefits.
