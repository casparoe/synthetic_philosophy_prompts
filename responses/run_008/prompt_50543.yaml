answer: |-
  Your intuition is correct: **Step (3) is the break point.**

  Your friend has taken a theorem about *asymptotic behavior in repeated games* and applied it to *existential one-shot decisions*. This is a category error. The mathematical machinery of ergodicity economics and the Kelly criterion is powerful, but it relies on specific structural assumptions that vanish the moment you introduce an "absorbing barrier" (like death) or a single-decision horizon.

  Here is the breakdown of where the argument fails, why it feels convincing, and what you "pay" to fix it.

  ### 1. The Failure of Step (3): Asymptotics vs. The Single Shot

  **The Claim:** "Your life is just a long sequence of sizing decisions... So the rule generalizes cleanly: at every risky choice, maximize expected log wealth."

  **The Error:** Breiman's theorem (and the ergodicity argument) is an **asymptotic result**. It states that as the number of bets $N \to \infty$, the Kelly bettor will almost surely outperform any other strategy. It relies on the Law of Large Numbers to smooth out variance.

  In a one-shot, all-or-nothing decision (like the hospital surgery gamble), $N=1$.
  *   The "almost surely" guarantee requires a long run to materialize.
  *   In a single bet, variance dominates. The "time average" *is* the "ensemble average" when $N=1$. There is no trajectory to optimize over; there is only the immediate outcome.
  *   By treating a one-shot existential risk as just another step in a compounding sequence, your friend assumes there *will be* a next step. But if the bet kills you (or bankrupts you irrecoverably), the sequence terminates.

  **Why it sounded natural:** We intuitively feel life is a sequence. But ergodicity only holds if the system is **stationary** and **non-absorbing**. If a state exists from which you cannot return (death, total ruin), the system is non-ergodic in a way that breaks the "maximize log-wealth" derivation. You cannot optimize a long-term growth rate if the long term is cancelled by the current bet.

  ### 2. The Failure of Step (4): Wealth $\neq$ Utility

  **The Claim:** "Log of zero is minus infinity... eliminating a ruin risk is worth any finite price."

  **The Error:** This conflates **wealth** with **utility**.
  *   The Kelly criterion maximizes the expected growth rate of *wealth*.
  *   Rational decision theory (Von Neumann-Morgenstern) maximizes *expected utility*.
  *   Log-utility ($U(W) = \ln W$) is a specific *model* of utility, not a law of physics. It is a good model for investable capital where you care about percentage growth. It is a terrible model for survival.

  In the hospital scenario, your friend is modeling the situation as:
  *   **Refuse Bet:** Wealth = $0$ (because you pay everything?), Utility = $\ln(0) = -\infty$.
  *   **Take Bet:** 99% Wealth = $2W$, 1% Wealth = $0$.

  But this ignores the actual state variable: **Alive/Dead**.
  If refusing the bet means you die, your utility is not $\ln(\text{bank balance})$. It is $U(\text{Dead})$.
  If taking the bet means 99% chance you live, your utility is $0.99 \times U(\text{Alive}) + 0.01 \times U(\text{Dead})$.

  Unless $U(\text{Dead})$ is literally negative infinity (which implies you would prefer a 0.0000001% chance of life over 100% certainty of death, which no human actually prefers), the math flips. Most people act as if $U(\text{Dead})$ is very low, but finite. Therefore, a 99% chance of life is worth paying almost everything for.

  **The Log(0) Trap:** Mathematically, $\ln(0)$ is undefined (approaches $-\infty$). In economics, we usually impose a **bounded utility function** to avoid this. If utility is bounded below (e.g., you can't be worse than dead), the "infinity" disappears, and the "pay anything to avoid ruin" conclusion collapses.

  ### 3. The Failure of Step (5) & (6): The Absorbing Barrier

  **The Claim:** "Never accept any gamble that risks your entire bankroll... pay anything... to eliminate a chance of total ruin."

  **The Error:** This ignores the **cost of the premium**.
  In the "bandit" scenario (paying 99.99% of wealth to avoid a 1-in-a-trillion risk), your friend assumes you can pay the premium and *continue playing the game*.
  *   If you pay 99.99% of your wealth, your new bankroll is tiny.
  *   Your future growth rate is now crippled.
  *   You have effectively inflicted "economic ruin" on yourself to avoid "statistical ruin."

  In ergodic terms, you have shifted your trajectory to a lower parallel path that will never recover. By being *too* afraid of the absorbing barrier at zero, you have voluntarily moved yourself to a trajectory that is functionally equivalent to ruin (poverty), just without the mathematical elegance of hitting exactly zero.

  ### Summary: Which Step to Reject?

  **Reject Step (3).**
  You must reject the generalization that "what is optimal for a long sequence of fractional bets is optimal for a single existential bet."

  **Reject Step (4).**
  You must reject the idea that $\ln(0)$ is a hard constraint on rationality rather than an artifact of a specific utility function.

  ### What Do You Pay for Rejecting It?

  You might worry that by rejecting your friend's rigid framework, you are opening the door to "irrational" behavior or falling back into the trap of naive Expected Value (which tells you to take Russian Roulette for a million dollars). Here is the cost:

  1.  **Loss of Universality:** You lose the "One True Rule" (Maximize Log Wealth). You have to admit that rationality is **context-dependent**.
      *   For repeated, divisible, investable bets: Use Kelly/Log-Utility.
      *   For one-shot, existential risks: Use a utility function that prioritizes survival constraints over growth rates.
  2.  **Subjectivity:** You have to define your own utility function (e.g., "How much is my life worth?"). There is no longer a theorem that tells you the answer; you have to choose your risk tolerance.
  3.  **Complexity:** You can't just run a formula. You have to distinguish between "risk" (repeated variance) and "ruin" (absorbing barriers).

  ### How to Save Geometric Rationality (Principled Integration)

  Geometric rationality isn't wrong; it's just **domain-specific**. You can let it back in by adding a **Survival Constraint**.

  A truly rational agent maximizes geometric growth **subject to** the constraint that the probability of hitting the absorbing barrier (ruin/death) remains below a threshold $\epsilon$.

  *   **In Investing:** $\epsilon$ is small (e.g., 1% risk of ruin). You use Kelly to grow, but you cap leverage so you don't blow up.
  *   **In the Hospital:** The "bet" violates the survival constraint. Refusing the bet guarantees ruin (death). Taking the bet keeps you above the constraint (99% survival). Therefore, you take the bet.
  *   **In the Bandit Case:** The risk is $10^{-12}$. The cost of the premium is 99% of wealth. The premium itself causes "effective ruin" (you can't recover from poverty). A rational agent ignores risks that are smaller than the risk of the solution itself.

  **The Verdict:**
  Your friend is suffering from "model intoxication." He has found a hammer (ergodicity/Kelly) that explains why naive Expected Value fails in markets, and now he sees every problem as a nail.

  Tell him this: **"Kelly optimizes the growth rate of a player who stays in the game. If the bet takes you out of the game, you are no longer a player, and the growth rate is undefined. Therefore, survival constraints precede growth optimization."**

  You don't need to abandon ergodicity. You just need to acknowledge that **existence is a prerequisite for ergodicity.**
