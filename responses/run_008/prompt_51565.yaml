          *   *Issue 2: The Status of Projects.* IC says projects are instrumentally valuable. WIC says they are constitutively valuable.
          *   *Issue 3: The "One Thought Too Many" Implication.* IC says the justification is silent on the moment of action. WIC says the existence of the justification undermines the relationship.
          *   *Issue 4: George the Chemist.* IC says he should take the job if a slightly less scrupulous person would otherwise (marginal impact). WIC says taking the job violates his integrity regardless of the replacement.

      *   **Section 3: Cruxes and Predictions:**
          *   Need specific scenarios where the theories diverge in prediction or evaluation.
