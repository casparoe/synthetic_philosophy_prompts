          *   Response to "One Thought Too Many": The justification is external; the agent's internal reasoning need not include the utilitarian calculus.

      *   **Williamsian Critic:**
          *   Integrity is about the connection between action and identity/projects.
          *   Negative Responsibility (being responsible for what you allow) attacks integrity by making you a channel for all outcomes.
          *   "One Thought Too Many": If the husband needs a *general principle* to save his wife, he lacks the proper immediate commitment.
          *   Critique of Indirect Consequentialism: It's lucky if your projects align. If they don't, the theory still demands you drop them. It renders the agent a "satellite" of the outcome. It concedes the phenomenology but keeps the demandingness at the critical level.

  3.  **Drafting - Section by Section:**

