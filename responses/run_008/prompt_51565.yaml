answer: |-
  **JOINT STATEMENT ON INTEGRITY, AGENCY, AND CONSEQUENTIALIST STRUCTURE**

  **Participants:**
  *   **Party A:** Proponent of Sophisticated Indirect Consequentialism (SIC), drawing primarily on the framework of Peter Railton.
  *   **Party B:** Proponent of the Integrity Objection (IO), drawing primarily on the work of Bernard Williams.

  **Date:** October 24, 2023
  **Context:** Graduate Seminar on Consequentialism and Its Critics
  **Purpose:** To delineate the precise points of convergence and divergence regarding the compatibility of consequentialist moral criteria with agent integrity, specifically focusing on the cases of Jim and the Indians, George the Chemist, and the Drowning Wife scenario.

  ---

  ### I. POINTS OF AGREEMENT

  We, the undersigned, agree to the following factual, structural, and conceptual claims. These claims establish the common ground from which our disagreement proceeds.

  1.  **The Structure of Negative Responsibility:** We agree that classical act-utilitarianism entails the doctrine of negative responsibility. This is the claim that an agent is morally responsible for outcomes they merely allow to happen (through inaction) in the same way, and to the same degree, as outcomes they directly cause, provided the agent could have intervened to prevent the outcome at a lower cost to overall value.
  2.  **The Jim Case Details:** We agree on the specific topology of the "Jim and the Indians" case. Jim, a botanist, arrives in a South American town. He finds twenty Indians bound before a captain (Pedro). Pedro offers Jim a "guest's privilege": if Jim kills one Indian himself, Pedro will release the other nineteen. If Jim refuses, Pedro will kill all twenty. We agree that standard act-utilitarian calculus prescribes Jim killing the one. We agree that Williams presents this case not merely to elicit a negative emotional reaction, but to highlight the conflict between the utilitarian prescription and Jim's status as a moral agent who might view himself as responsible for the act of killing itself, distinct from the deaths that follow.
  3.  **The George Case Details:** We agree on the specifics of the George case. George is a qualified chemist who cannot find work due to economic conditions and health constraints. He is offered a position engaged in research for Chemical and Biological Warfare (CBW). George is morally opposed to CBW. However, if George refuses, the job will likely go to a colleague who is zealous about CBW and would pursue the research more vigorously than George. We agree that utilitarianism likely prescribes George take the job to mitigate the harm (the "lesser evil" argument), while Williams suggests taking the job requires George to alienate himself from his deepest moral convictions.
  4.  **Criterion of Rightness vs. Decision Procedure:** We agree that a distinction exists between the *criterion of rightness* (the theory that determines what makes an act morally right) and the *decision procedure* (the psychological process an agent uses to decide what to do). We agree that Party A (SIC) relies heavily on this distinction to answer Party B's (IO) objections.
  5.  **The Drowning Wife Scenario:** We agree on the intuition regarding the husband who saves his drowning wife. In the moment of action, the thought "This is my wife" is the appropriate motivator. We agree that if the husband pauses to calculate that saving his wife produces the best aggregate utility (or that a general practice of saving spouses is optimal), this constitutes "one thought too many." We agree that a moral theory that *requires* this calculation in the moment of action is phenomenologically defective.
  6.  **The Role of Dispositions:** We agree that human psychology relies on stable dispositions (character traits, commitments, personal projects) to function effectively. We agree that agents who lack these dispositions (e.g., agents who are purely calculating in every interaction) generally produce worse outcomes and lead less satisfying lives than those who possess them.

  ---

  ### II. POINTS OF DISAGREEMENT

  The following table outlines our substantive disagreements. We have jointly vetted the phrasing to ensure that neither party is characterizing the other's position via strawman or uncharitable interpretation.

  | Topic | Party A (SIC) Position | Party B (IO) Position |
  | :--- | :--- | :--- |
  | **1. The Source of Alienation** | Alienation arises only when agents adopt consequentialism as a *direct* decision procedure. If agents adopt non-consequentialist dispositions (loyalty, integrity) because doing so maximizes value, alienation is avoided. The theory validates the agent's projects instrumentally. | Alienation arises from the *criterion of rightness* itself. Even if the theory permits me to keep my projects, it does so only contingently. My projects are respected only insofar as they serve the impersonal good. This renders my commitment to them conditional and external, which undermines integrity regardless of my decision procedure. |
  | **2. The Status of Personal Projects** | Personal projects are objectively valuable *because* they contribute to the general welfare (by giving life meaning, motivating action, etc.). Their value is derivative of the good state of affairs they help produce. | Personal projects are constitutively valuable. They give my life meaning not because they add to a global aggregate, but because they are *mine* and identify *me*. Their value is grounded in the agent's identity, not the outcome. |
  | **3. The "One Thought Too Many" Implication** | The utilitarian justification operates at the critical level, not the practical level. The husband saves his wife because he loves her. The fact that this disposition is justified by utility is a silent background fact. It does not enter his deliberation, so it is not an extra thought. | The existence of the external justification undermines the relationship. If I know that my commitment to my wife is ultimately permissible only because it tracks the optimal outcome, I cannot view my commitment as unconditional. The "background fact" infects the practical stance. |
  | **4. The Jim Case: Moral Residue** | If Jim shoots the one to save nineteen, he has done the right thing. Any guilt he feels is a useful psychological disposition (to prevent future casual killing) but does not indicate objective moral wrongdoing. | If Jim shoots, he has violated his integrity. Even if he saves nineteen, he has allowed the utilitarian structure to make him the author of a death he would otherwise reject. The guilt is a fitting response to a genuine moral violation, not merely a useful heuristic. |
  | **5. Transparency and Self-Knowledge** | An agent can know they are a sophisticated consequentialist without losing their non-consequentialist dispositions, provided they understand that maintaining those dispositions requires not calculating in the moment. | This invites a form of self-deception or instability. If I know my commitment to my friend is held only because it is optimal, I am viewing the friend as a means to the optimal. I cannot sustain the disposition while holding the justification consciously. |

  ---

  ### III. CRUXES AND PREDICTIONS

  We have identified three specific "cruxes" where our theoretical commitments lead to divergent evaluations of specific scenarios. For each crux, we list the consideration that bears on the issue and register a prediction regarding how a competent moral judge (or the agents themselves) would evaluate the scenario.

  #### Crux 1: The "Unlucky" Project
  **Description:** A scenario where an agent's deep personal project (e.g., painting, caring for a specific disabled relative) is slightly sub-optimal compared to a marginal alternative (e.g., donating the time/money to effective charity), but abandoning the project would cause the agent significant psychological distress and loss of identity.
  **Shared Consideration:** The trade-off between the marginal gain in aggregate utility and the cost to the agent's integrity/psychological functioning.
  **Predictions:**
  *   **Party A (SIC):** Predicts that the theory will prescribe abandoning the project *if* the utility gain is sufficiently large to outweigh the psychological distress. However, in most real-world cases, Party A predicts the psychological costs of constant abandonment will be high enough that the theory prescribes keeping the project.
      *   *Registered Prediction:* In a case where the utility gain is clear and significant (e.g., saving a life vs. finishing a painting), SIC prescribes dropping the project. The agent ought to feel regret, but not guilt.
  *   **Party B (IO):** Predicts that the theory *necessarily* prescribes dropping the project whenever the aggregate is higher, rendering the agent's integrity hostage to the calculus.
      *   *Registered Prediction:* In the same case, IO prescribes that the agent is permitted to keep the project. If the agent drops it, they have sacrificed their integrity. The agent ought to feel guilt if they drop it, even if the outcome is better.

  #### Crux 2: The George Case (Replacement Condition)
  **Description:** George refuses the CBW job. The job goes to the zealous colleague, who produces more harmful CBW than George would have.
  **Shared Consideration:** The causal impact of George's refusal versus the integrity cost of George's acceptance.
  **Predictions:**
  *   **Party A (SIC):** Predicts that George is objectively wrong to refuse the job. His refusal makes the world worse. His integrity is a "disposition" that, in this specific instance, is failing to track the good. He should cultivate a disposition to take such jobs when the replacement condition holds.
      *   *Registered Prediction:* Post-refusal, George's feeling of "clean hands" is epistemically faulty. He is responsible for the additional harm caused by the zealous colleague.
  *   **Party B (IO):** Predicts that George is objectively permitted (and perhaps required) to refuse the job. The causal chain initiated by the zealous colleague is not George's responsibility in the same way George's own actions are.
      *   *Registered Prediction:* Post-refusal, George's feeling of "clean hands" is epistemically sound. He is not responsible for the colleague's actions, only his own complicity.

  #### Crux 3: Transparency in the Drowning Wife Case
  **Description:** The husband saves his wife. Later, at a seminar, he is asked *why* his action was morally permissible. He explains, "Because she is my wife, and a system where husbands save wives is optimal."
  **Shared Consideration:** Whether the retrospective justification undermines the authenticity of the initial act.
  **Predictions:**
  *   **Party A (SIC):** Predicts this explanation is acceptable. It accurately describes the moral reality without implying the calculation occurred during the rescue. The agent can hold two levels of thought simultaneously without contradiction.
      *   *Registered Prediction:* Observers will not judge the husband as less loving or committed upon hearing this explanation, provided he confirms he did not calculate during the rescue.
  *   **Party B (IO):** Predicts this explanation is corrosive. It reveals that the husband views his commitment as contingent on the system's optimality.
      *   *Registered Prediction:* Observers (and the wife) will judge the husband as less loving or committed upon hearing this explanation. It reveals an alienation from the relationship that existed even during the act.

  ---

  ### IV. DIAGNOSIS OF VERBAL VS. SUBSTANTIVE DISAGREEMENT

  We acknowledge that a portion of our debate may rest on terminological or conceptual framing rather than purely substantive moral facts. We flag the following areas for further semantic clarification:

  **1. The Definition of "Justification"**
  *   **The Dispute:** Party A tends to use "justification" to mean *the condition that makes the act right* (metaphysical/normative status). Party B tends to use "justification" to mean *the reason that must be accessible to the agent to act virtuously* (phenomenological/deliberative status).
  *   **Why it Matters:** When Party A says, "The utilitarian justification does not alienate because it stays at the critical level," they are using the metaphysical definition. When Party B replies, "The existence of the justification alienates," they are often using the phenomenological definition.
  *   **Agreement to Investigate:** We agree to test whether Party B's objection holds if we strictly ban the metaphysical justification from the agent's consciousness forever. If Party B still claims alienation exists, the dispute is substantive (about the nature of value). If Party B concedes alienation vanishes, the dispute is verbal (about what counts as a relevant justification).

  **2. The Meaning of "Integrity"**
  *   **The Dispute:** Party A often treats integrity as a *psychological asset* (a disposition that helps one function and produce good). Party B treats integrity as a *moral boundary* (the limit of what one can be asked to do regardless of outcome).
  *   **Why it Matters:** In Crux 1 (The Unlucky Project), if integrity is an asset, it can be traded for a bigger asset (saving a life). If integrity is a boundary, it cannot be traded.
  *   **Agreement to Investigate:** We will attempt to construct a case where "integrity as asset" and "integrity as boundary" yield different prescriptions. If we cannot, our disagreement may be purely definitional regarding the word "integrity."

  ---

  ### V. METHODOLOGICAL COMMITMENTS

  To ensure this collaboration remains productive and adheres to the standards of adversarial collaboration:

  1.  **No Moving the Goalposts:** If a prediction registered in Section III is proven false (e.g., by intuitive consensus in a controlled survey of moral judgments, or by logical demonstration of inconsistency), the respective party agrees to update their credence in their theory.
  2.  **Charity in Reconstruction:** If Party A argues that Party B's view implies "moral selfishness," Party A must demonstrate that this follows from Party B's actual texts, not a caricature. If Party B argues that Party A's view implies "totalitarianism," Party B must demonstrate this follows from the SIC framework, not classical act-utilitarianism.
  3.  **Focus on the Jim Case:** We agree that the Jim case is the primary testing ground. We will not retreat to abstract meta-ethics if the Jim case yields a clear divergence. If SIC cannot explain why Jim feels a *specific* kind of moral residue that is distinct from simple regret, SIC concedes a point to IO. If IO cannot explain why Jim should not simply shoot Pedro instead (if possible) without violating integrity, IO concedes a point to SIC.

  **Signatures:**

  _________________________
  (Party A: Sophisticated Indirect Consequentialist)

  _________________________
  (Party B: Williamsian Integrity Critic)
