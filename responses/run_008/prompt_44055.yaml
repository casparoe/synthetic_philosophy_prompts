answer: |-
  This is one of the most lucid summaries of the historiographical stalemate I have read, and your diagnosis of the "bundling" problem is remarkably sharp. You are right to feel that the debate is calcified; in philosophy of history, this is often called the "linguistic turn hangover," but your description of the practical impasse is more useful than the theoretical label.

  Here is the diagnosis of the disagreement, an assessment of the Irving/Lipstadt episode, and a recommendation for your reading group.

  ### 1. The Diagnosis: Incommensurable Criteria of Success

  You asked if this is a verbal disagreement, a substantive one, or two disciplines sharing a name. It is **all three**, but the engine driving the stalemate is that each camp is optimizing for a different **criterion of success**, and they all use the word "objectivity" to claim their criterion is the only one that matters.

  *   **The Rankeans (The Correspondence Criterion):** For them, history is a *representational* act. Success is measured by the fidelity of the statement to the trace. When they hear the narrativist say "emplotment is a choice," they hear "fiction is permissible." Their stake is **epistemic security**. If they concede the narrativist point, they fear the floor drops out and they cannot distinguish themselves from a denier.
  *   **The Carrians (The Sociological Criterion):** For them, history is a *production* process. Success is measured by the transparency of the selection mechanism. When they hear the Rankean say "the archive is the arbiter," they hear "naive realism." Their stake is **critical vigilance**. They want to ensure the power dynamics of the present aren't smuggled into the past as "natural facts."
  *   **The Narrativists (The Aesthetic/Moral Criterion):** For them, history is a *meaning-making* act. Success is measured by the coherence and ethical utility of the plot. When they hear the Rankean say "this is how it happened," they hear "a category error." Their stake is **interpretive honesty**. They want to admit that giving the past a "shape" (tragedy, progress) imposes a form that the past itself does not possess.

  **Why it never moves:**
  It is not merely verbal, because the stakes are real. But it is **structurally dialog-proof**.
  *   If the Rankean produces a footnote, the Narrativist says, "That proves the event, not the *story*."
  *   If the Narrativist analyzes the plot structure, the Rankean says, "That's literary criticism, not history."
  *   If the Carrian asks who selected the facts, the Rankean says, "The evidence dictated the selection," and the Narrativist says, "You're hiding the selection behind the evidence."

  You are correct that they are studying different objects. The Rankean studies the **referent** (the past via traces). The Narrativist studies the **representation** (the text about the past). The Carrian studies the **producer** (the historian in context). Since "History" is the name we give to the messy overlap of these three things, the debate is a fight over who owns the word.

  ### 2. The Irving/Lipstadt Trial: Why It Didn't Settle Anything

  Your intuition about the 2000 trial is correct: it was a legal settlement, not a philosophical one. Both sides claimed vindication because the judgment operated on a **pragmatic** level that allowed for multiple **theoretical** interpretations.

  Judge Gray's ruling did not rely on a philosophy of history. It relied on a **forensic standard of manipulation**. He found that Irving had shifted evidence, mistranslated documents, and attributed motives without proof.
  *   **Why Empiricists felt vindicated:** The court affirmed that there *are* constraints. You cannot just say "this is my narrative" if you have actively suppressed a counter-document. The archive *did* bite back.
  *   **Why Theorists felt vindicated:** The court had to adjudicate between competing narratives. The judge essentially acted as a "super-historian," weighing the *plausibility* of one story against another. This confirmed the Carr/White view that history is an argument in the present, judged by present standards of reasonableness, not a mirror of the past.

  **The Verdict:** The trial proved that **fraud is detectable**, but it did not prove that **truth is objective** in the strong Rankean sense. It established a baseline of *disciplinary malpractice* without solving the *philosophical status* of the product. It moved the line between "history" and "fiction," but it didn't explain *why* the line is there, only *where* it is in this specific legal context.

  ### 3. What Would Count as Progress?

  If you want the reading group to move, you must stop asking "Who is right about objectivity?" and start asking "What work is this concept doing?"

  Progress would look like **disaggregation**. You need to force the group to ban the word "objectivity" for two sessions and replace it with specific functional claims.
  *   Instead of "Is this objective?" ask "Is this claim **warranted by the available traces**?" (Rankean domain).
  *   Instead of "Is this biased?" ask "What **selection criteria** were used to include these facts?" (Carr domain).
  *   Instead of "Is this true?" ask "Does this **emplotment** offer moral insight or does it distort the temporal experience?" (White domain).

  **The "Working Historian" Solution:**
  You mentioned the silent majority who just publish monographs. They are effectively **pragmatists**. They operate on a principle of **intersubjective accountability**. They know they can't achieve "God's eye view" objectivity, but they know they can achieve "peer review" objectivity.
  *   *Progress Condition:* A claim is "objective enough" if it survives the attempt by competitors to falsify it using the shared rules of the archive.
  *   This doesn't satisfy the philosopher (who wants metaphysical grounding) or the radical theorist (who wants to expose power structures), but it satisfies the discipline.

  ### 4. Recommendation for the Reading Group

  **Do not split the group yet.** The stalemate *is* the data.

  If you split, you confirm the diagnosis that the disciplines are incommensurable. If you stay together, you can shift the object of study from "History" to "The Impasse."

  **Proposed Pivot:**
  Stop reading theory *about* history. Start reading **cases of failure**.
  *   Look at specific historical controversies where the archive was ambiguous (e.g., the origins of WWI, the Cold War spy debates).
  *   Ask the Rankean: "Where does the evidence run out?"
  *   Ask the Carrian: "What contemporary pressure shaped the question?"
  *   Ask the Narrativist: "What plot structure is filling the gap?"

  **The Goal:**
  Show that in actual practice, all three are always operating simultaneously.
  *   You cannot write history without traces (Ranke).
  *   You cannot select traces without a perspective (Carr).
  *   You cannot communicate the selection without a story (White).

  The debate stalls because each side claims their layer is the *foundation*. The progress comes from realizing they are **interdependent constraints**.
  *   The Archive constrains the Story.
  *   The Story makes the Archive intelligible.
  *   The Historian's Context determines which constraints are prioritized.

  **Final Verdict:**
  Your guess was right: "Objectivity" is a bundle of three distinct questions. But the reason it's a 150-year war is that each side believes their question is the *only* one that guarantees the integrity of the discipline.
  *   Rankeans fear that without (a), history becomes propaganda.
  *   Carrians fear that without (b), history becomes blind ideology.
  *   Narrativists fear that without (c), history becomes sterile data-entry.

  They aren't wrong. They are just protecting different vital organs of the same body. The reading group should stop trying to amputate two organs to save the third. Acknowledge the triad, accept the tension, and move on to how specific historians manage that tension in practice. That is where the actual history is.
