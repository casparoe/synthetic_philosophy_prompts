answer: |-
  Dear Student

  It is a pleasure to see you grappling with the separateness of persons objection, for it remains one of the most fertile grounds for philosophical inquiry in normative ethics. You are quite right to sense that the literature has moved past the initial sloganising found in Rawls or Nozick, and your instinct to look for the live questions beneath the surface is exactly the right approach for a third-year term paper. Five thousand words is a constrained space, sufficient for a tight argument but unforgiving of scope creep, so choosing a topic that is both philosophically substantial and manageable is crucial. You have presented three candidate questions, and while all are intellectually respectable, they vary significantly in their suitability for a paper of this length and at your current stage of training. I shall address them in the order I believe you should prioritise them, explaining the reasoning behind this ordering by reference to their conceptual upstreamness, their tractability given your background, and the potential for original contribution.

  I would place the question of what the objection really amounts to, specifically regarding the distinction between aggregation and distribution and the status of prioritarianism, at the very top of your list. This is the most upstream of the three questions in a normative sense, because until we understand precisely what moral wrong the separateness of persons is supposed to identify, we cannot evaluate whether any given theory escapes it. If the objection is merely that utilitarianism ignores the distribution of welfare, then prioritarianism, which weights benefits to the worse off more heavily, might seem to offer a solution while retaining a form of aggregation. However, if the objection is that aggregation itself is impermissible regardless of the distribution, then prioritarianism fails just as miserably as utilitarianism. This makes the question conceptually fundamental. It is also the most tractable for a student with your profile. It relies primarily on conceptual analysis and the testing of intuitions against cases, which are the core skills you have been developing throughout your degree. You do not need advanced mathematics or a resolved theory of personal identity to argue about whether a moral theory respects the boundaries between individuals. Furthermore, while prioritarianism is a well-established view, the specific question of whether it truly satisfies the separateness of persons objection is not settled. There is a live debate between philosophers such as Michael Otsuka and Larry Temkin regarding whether prioritarianism is sufficiently person-affecting or whether it still sacrifices individuals for the sake of a weighted sum. This leaves room for a genuinely original contribution. You could argue, for instance, that prioritarianism merely masks the aggregation rather than eliminating it, or conversely, that the separateness of persons objection is fundamentally a complaint about indifference to the worse-off rather than about summation as such. Either way, you are engaging with the moral core of the problem without getting bogged down in ancillary disciplines. This topic allows you to stay firmly within normative ethics, which is the focus of your seminar, and ensures that your word count is spent on argumentation rather than exposition of complex formalisms or metaphysical theories.

  I would place the question of the intrapersonal analogy and the metaphysics of personal identity as a distant second priority, and I would advise you to approach it with considerable caution. You ask whether the reductionist riposte, that there is no unified subject across a life any more than across persons, is a serious response or a metaphysical red herring. While this is a profound question, famously explored by Derek Parfit, it is risky for a five thousand word paper in an ethics seminar. The reason is that it is upstream in a way that threatens to swallow the ethical debate entirely. If you argue that the separateness of persons objection fails because persons are not distinct entities over time, you are effectively arguing for reductionism about personal identity. Defending reductionism is a massive task in itself, requiring you to engage with psychological continuity theories, bodily continuity theories, and the various fission and fusion cases that populate the metaphysics literature. If you spend three thousand words defending reductionism, you have little space left to discuss its ethical implications. Conversely, if you assume reductionism without argument, you risk begging the question against those who find the separateness of persons objection compelling precisely because they hold a substantive view of the self. Moreover, even if reductionism is true, it is not clear that it dissolves the moral objection. Many philosophers argue that even if persons are series of experiences, the moral significance of the boundaries between those series remains, perhaps grounded in phenomenology or the practical necessities of agency rather than metaphysical fact. This makes the question less tractable for your purposes. It requires a level of metaphysical sophistication that might distract from the ethical focus of your seminar. Additionally, this area is somewhat neglected in contemporary normative ethics not because it is unimportant, but because most ethicists have agreed to bracket metaphysical questions to get on with the work of moral theory. Entering this debate might feel original, but there is a risk that you will be criticised for changing the subject from ethics to metaphysics. Unless your seminar has a specific focus on Parfit or personal identity, I would suggest you treat this as background context rather than the main engine of your paper. You can mention the reductionist challenge to show depth of reading, but building your central argument on it is likely to overextend the scope of a term paper.

  I would place the question of formal results and aggregation theorems at the bottom of your list, and I would explicitly recommend against making this the central focus of your paper. You mention Harsanyi-style arguments purporting to show that rational individuals behind a veil of ignorance would endorse sum-ranking. While this is a sophisticated angle, it is the least tractable given your self-described background in logic and basic decision theory. The danger here is not philosophical but technical. To critique Harsanyi's utilitarianism theorem or related aggregation results effectively, you need a robust grasp of the axioms involved, such as the independence axiom, and the precise conditions under which the theorem holds. There is a significant literature in social choice theory debating whether the veil of ignorance model truly yields utilitarianism or whether it relies on contentious assumptions about risk aversion and identity. If you misunderstand the formal result, your philosophical critique will miss its target entirely. In a five thousand word paper, you would likely need to devote a significant portion of the text to explaining the theorem to your reader, leaving little room for the philosophical evaluation of whether such a result dissolves the separateness of persons objection. Furthermore, this question is downstream of the first question. Even if rational agents behind a veil of ignorance would choose utilitarianism, the separateness of persons objection might still stand as a critique of that choice from the standpoint of actual moral experience. The formal result tells us what is rational to choose under uncertainty, but the objection is often about what is permissible to do under certainty. Conflating the two can lead to confusion. While this topic is neglected in undergraduate seminars because of its technical difficulty, that neglect exists for a good reason. It is better to produce a clear, philosophically rigorous paper on the nature of the objection than a technically ambitious paper that struggles to explain the mathematics. If you are deeply interested in this angle, I would suggest you save it for a dissertation where you have more space to acquire the necessary technical toolkit, rather than risking it on a term paper where precision is paramount.

  Having established this ordering, I should offer you a specific suggestion on how to narrow the first question to ensure it is suitable for five thousand words. The broad question of whether prioritarianism escapes the separateness of persons objection is still too wide. I recommend you focus on a specific tension within prioritarianism regarding the scope of aggregation. You might consider whether prioritarianism respects the separateness of persons within a generation but fails across generations, or whether it respects separateness in cases of fixed populations but fails in variable population cases. Alternatively, you could focus on the distinction between ex ante and ex post prioritarianism. Ex ante prioritarianism maximises the expected weighted welfare of individuals, while ex post prioritarianism maximises the weighted welfare of outcomes. Some philosophers argue that ex ante prioritarianism respects the separateness of persons better because it focuses on the prospects of individuals rather than the distribution of outcomes, while others argue it leads to counterintuitive results in cases of risk. This specific niche allows you to engage with the aggregation versus distribution debate without needing to survey the entire history of the objection. It is upstream enough that your conclusion will have implications for how we view the objection generally, but narrow enough that you can provide a detailed argument within the word limit. This approach also maximises your potential for originality. While the general debate between utilitarianism and prioritarianism is well-trodden, the specific application of the separateness of persons objection to different variants of prioritarianism is less so. You could argue, for instance, that the separateness of persons objection is not a binary switch that theories either pass or fail, but a gradient that different theories satisfy to different degrees, and that ex ante prioritarianism occupies a unique spot on this gradient. This would allow you to demonstrate nuance and critical engagement with the literature rather than simply summarising existing positions.

  You asked me to be explicit about why I would deprioritise the other questions, and I want to reiterate that this is not because they are unimportant, but because they are ill-suited to the constraints of this specific assignment. The metaphysical question is deprioritised because it changes the subject from normative ethics to metaphysics, requiring a defence of personal identity theory that is too large for five thousand words and risks alienating readers who expect an ethical argument. It is effectively settled in the context of normative ethics that we should proceed as if persons are distinct, even if metaphysically they are not, because morality is a practical discipline. To challenge this is to challenge the framework of the seminar itself. The formal results question is deprioritised because it is too technical for your current background and risks turning the paper into an exposition of decision theory rather than a philosophical argument. An answer to this question would not change much downstream for the purposes of an ethics seminar, because even if the formal results hold, the moral intuition behind the separateness of persons remains a powerful critique of the implications of those results. The formal defence of utilitarianism does not necessarily answer the moral complaint that it is wrong to sacrifice one for the many, even if it is rational to agree to such a sacrifice behind a veil of ignorance. Therefore, progress on the formal question does not resolve the normative tension as effectively as progress on the conceptual question of what the objection actually targets. By focusing on the nature of the objection itself, you are addressing the root of the dispute rather than the branches.

  In terms of structuring your paper should you follow this advice, I would suggest you begin by clearly stating the separateness of persons objection as it is commonly understood, perhaps using Rawls as a starting point but quickly moving to contemporary formulations. You should then introduce prioritarianism as the proposed solution that retains aggregation but modifies distribution. The core of your paper should be a critical examination of whether this modification is sufficient to respect the moral boundaries between persons. You can use case studies involving risk or sacrifice to test the limits of prioritarianism. For example, consider a case where a large number of people receive small benefits at the cost of a severe loss to one person. Utilitarianism might endorse this if the sum is positive. Prioritarianism might not, depending on the weighting function. But does prioritarianism reject it for the right reasons? Does it reject it because it respects the individual's boundary, or simply because the weighted sum is lower? If the latter, then the separateness of persons objection still holds force against the theoretical foundation, even if the practical outcome is more palatable. This distinction is where your original contribution can lie. You are not merely asking if prioritarianism gives better answers, but if it gives better answers for the right reasons. This aligns perfectly with the goals of a third-year seminar, which should be moving you from understanding theories to evaluating their foundational commitments.

  I must also caution you against a common pitfall in writing about the separateness of persons, which is to treat it as a knock-down argument that ends the discussion. The literature has indeed moved past the slogan, as you noted, and your paper should reflect that. You should acknowledge that utilitarians have responses, such as the claim that the distinction between persons is not morally fundamental in the way that the distinction between times is not fundamentally moral for a single person. You do not need to resolve the metaphysics to acknowledge this argument, but you should explain why it fails to satisfy the critic. This shows that you understand the dialectic. Another pitfall is to conflate the separateness of persons with the objection to aggregation simpliciter. Some aggregation is unavoidable in any moral theory that cares about more than one person. The objection is specifically about the kind of aggregation that allows losses to one to be cancelled out by gains to others. Precision in your terminology here will be vital. If you can clearly distinguish between aggregation that respects persons and aggregation that overrides them, you will have made a significant conceptual clarification. This is the kind of work that makes for a strong term paper. It demonstrates that you can wield philosophical tools to dissect a problem rather than just reporting on what others have said.

  Finally, I want to encourage you to trust your own philosophical instincts. You mentioned that you keep returning to this theme, and that is often a sign that there is work to be done. The fact that you feel the literature has moved past the slogan suggests you are ready to engage with the nuances. My advice to prioritise the conceptual analysis of the objection over the metaphysical or formal defences is intended to help you channel that intuition into a manageable project. Do not feel pressured to solve the entire debate. A successful term paper does not need to settle the question of whether utilitarianism is true or false. It needs to make a clear, defended claim about a specific aspect of the debate. If you can argue convincingly that prioritarianism fails to fully respect the separateness of persons because it still relies on an aggregative structure that treats individuals as vessels for value, you will have written an excellent paper. Alternatively, if you can argue that the separateness of persons objection is actually a complaint about distribution that prioritarianism successfully addresses, you will have made a strong case for a rival theory. Both are viable paths. The key is to choose the path that allows you to argue deeply rather than broadly. By avoiding the metaphysical quagmire and the technical minefield, you free yourself to do the normative work that is the heart of your course. I look forward to reading your proposal and seeing how you develop these ideas. Please do feel free to come to my office hours if you wish to discuss the specifics of your argument further, particularly regarding the selection of case studies to test the prioritarian view.

  Yours sincerely

  Your Supervisor
