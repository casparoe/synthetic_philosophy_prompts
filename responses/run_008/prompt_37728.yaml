          *   **MEU:** Rationality = Consistency with the Maximin rule. It's a behavioral axiomatization. It treats ambiguity aversion as a primitive taste (like risk aversion). *Critique:* Is it rational to be this pessimistic always? It builds a specific attitude into rationality.
