prompt: |-
  Hey, I'm a PhD student in philosophy, working-ish in formal epistemology, and I have a prospectus talk coming up in a few weeks with literally nothing written. My half-formed dissertation idea, as it currently lives in my head: the diachronic Dutch book argument for conditionalization only goes through if the agent can't bind herself in advance — a bookie can fleece you across time only because your current self and your future selves disagree and can't sign contracts with each other. Meanwhile, in a different corner of the literature, people complain that the synchronic Dutch book argument proves nothing about degrees of belief at all, only about betting dispositions, since you can always just refuse the bets. My hunch is that these two complaints are secretly the same complaint — both trade on whether credences and betting policies are allowed to come apart, which is really an assumption about the agent's architecture (can she precommit, at what cost, is she one agent or a sequence of them). So the question I want the prospectus to state precisely is something like: does the diachronic Dutch book argument establish a norm on credences or merely a norm on policies, and does the answer change once self-binding is available?

  What I need you to produce is the actual prospectus document: the question stated so it has a determinate answer, why the existing positions leave it open (I'm thinking roughly of the orthodox camp that treats the argument as a genuine argument for updating, vs. the deflationists who say it's all just about money), a chapter-by-chapter plan showing what I'd actually do in each chapter and why that method rather than the obvious alternatives, what a successful result looks like (my dream is something like a separation theorem — when binding is impossible or costly the argument constrains credences, when binding is free it collapses into a norm on policies only), and an honest account of what would count as the project failing. Also, and my committee will ask this first, please flag if the question as I've stated it doesn't actually have a determinate answer, and if so suggest the nearest version that does.

  Don't include a bibliography or cite anything — I'll fill in references myself, I just need the philosophical skeleton. Length should be about two pages. One more thing: if you think the whole "architecture of the agent" framing is doing less work than I think it is, say so bluntly rather than building the prospectus around it. I'd rather find that out now than at the talk.
