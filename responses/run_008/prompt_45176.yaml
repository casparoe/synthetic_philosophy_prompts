answer: |-
  **PRE-SUBMISSION NOTE (READ FIRST)**

  Two blunt observations before you hand this in:

  1.  **The "Architecture" Framing:** It is currently doing less work than you think. "Agent architecture" sounds like cognitive science or metaphysics of personal identity. Your committee will pounce on this as vague. You need to cash this out strictly in **decision-theoretic terms**: specifically, the *available action set* at $t_0$ versus $t_1$. The question isn't "who is the agent?" it is "what commitment devices are available in the choice set?" If you keep the word "architecture," define it immediately as "the set of feasible precommitment strategies." I have adjusted the language in the prospectus below to reflect this precision.
  2.  **Determinacy:** Your question does not have a determinate answer in the abstract. It only has one *relative to a formal model*. If you promise a purely conceptual resolution, you will fail. You must promise a theorem (or a formal proof of impossibility). The prospectus below is written to commit you to a formal result. If you intend to do this purely verbally, stop and rethink.

  ***

  **PROSPECTUS**

  **Title:** Binding and Belief: The Normative Scope of Diachronic Dutch Book Arguments

  **1. The Research Question**
  The diachronic Dutch Book (DDB) argument is standardly taken to establish Conditionalization as a norm of rational belief. Orthodox proponents argue that vulnerability to a DDB demonstrates an inconsistency in the agent's credences over time. Deflationists object that DDB vulnerability demonstrates only a pragmatic loss, avoidable by refusing bets, and thus constrains betting policies rather than credences.

  This dissertation asks: **Does the normative force of the DDB argument target credal states or betting policies, and does this target shift as a function of the agent's capacity for self-binding?**

  More precisely: I will construct a formal model of diachronic choice where the availability of precommitment devices is a variable parameter. I aim to prove a **Separation Theorem**: that when precommitment is impossible or costly, DDB vulnerability entails a defect in credal states (supporting Conditionalization); whereas when precommitment is costless and available, DDB vulnerability entails only a defect in policy selection.

  **2. Motivation and Existing Positions**
  The literature currently treats the Orthodox and Deflationist positions as incompatible stances on the nature of rationality. The Orthodox camp (e.g., standard Bayesianism) treats the DDB as a consistency proof for credences. The Deflationist camp (e.g., pragmatic rebuttals) treats the DDB as a money-pump argument that fails to penetrate the doxastic state because the agent can always decline the bet.

  Both camps leave a critical variable unmodeled: the **control structure** connecting the agent at $t_0$ to the agent at $t_1$.
  *   The Orthodox argument implicitly assumes the agent cannot bind their future self to refuse a bad bet; it assumes the future self *must* accept bets consistent with their current credences.
  *   The Deflationist argument implicitly assumes the agent *can* bind their future self (or simply refuse), treating the betting policy as distinct from the credence.

  Neither side explicitly models the *cost* or *feasibility* of binding. Consequently, the debate stalls. If the "Deflationist" move (refusing the bet) is unavailable because the agent lacks the technology to precommit, the Deflationist objection collapses. If the "Orthodox" move (forcing the update) is unavailable because the agent is fragmented, the Orthodox conclusion fails. By formalizing the availability of binding as a parameter, this project resolves the stalemate by showing that both positions are limit cases of a more general decision-theoretic framework.

  **3. Chapter Plan and Methodology**

  **Chapter 1: The Standard Arguments and the Control Gap**
  I will reconstruct the standard DDB argument for Conditionalization and the primary Deflationist objections. I will demonstrate that both rely on hidden assumptions about the agent's diachronic control.
  *   *Method:* Conceptual analysis and reconstruction of standard proofs.
  *   *Why this method:* Before formalizing, I must isolate the precise premises where "ability to refuse" enters the argument. Existing literature discusses this informally; I need to make the premises explicit to model them.

  **Chapter 2: Modeling Diachronic Choice and Precommitment**
  I will introduce a formal decision-theoretic model of a temporally extended agent. The model will treat the agent as a sequence of decision nodes. Crucially, I will introduce a parameter $\beta$ representing the cost/availability of binding strategies at $t_0$ that constrain choices at $t_1$.
  *   *Method:* Formal modeling (extensive form games with imperfect recall or similar).
  *   *Why this method:* Philosophical prose cannot track the interaction between updating rules and commitment devices. A game-theoretic framework is required to distinguish between "inconsistent beliefs" and "suboptimal strategy" rigorously. Alternatives like pure probability theory are insufficient because they lack the action-theoretic resources to model binding.

  **Chapter 3: The Separation Theorem**
  This is the core technical chapter. I will prove that the normative implication of DDB vulnerability is a function of $\beta$.
  *   *Hypothesis:* As $\beta \to \infty$ (binding impossible), DDB vulnerability implies irrational credences. As $\beta \to 0$ (binding free), DDB vulnerability implies irrational policies only.
  *   *Method:* Mathematical proof.
  *   *Why this method:* This provides the determinate answer the literature lacks. It moves the debate from "which side is right?" to "under which parameters does each side hold?"

  **Chapter 4: Implications for Conditionalization**
  I will apply the Separation Theorem to the norm of Conditionalization. If an agent cannot bind, they must Conditionalize to avoid sure loss. If they can bind, they may rationally maintain non-conditionalizing credences provided they bind their future betting behavior.
  *   *Method:* Application of the Chapter 3 model to specific updating scenarios.
  *   *Why this method:* This tests the philosophical payoff. It shows whether Conditionalization is a universal norm or a contingent one dependent on the agent's technological/psychological capacity for self-control.

  **Chapter 5: Objections and Limits**
  I will address objections regarding the nature of belief (can belief really come apart from policy?) and the realism of the binding model.
  *   *Method:* Counter-argument and model refinement.
  *   *Why this method:* To ensure the formal result maps onto plausible epistemological categories rather than remaining a purely game-theoretic curiosity.

  **4. Success Conditions**
  The project succeeds if I can derive the **Separation Theorem** described in Chapter 3. A successful result will demonstrate that the Orthodox and Deflationist positions are not contradictory but apply to different regions of the parameter space defined by $\beta$.
  *   *Ideal Outcome:* A proof showing that when binding is impossible, the only DDB-immune strategy is Conditionalization of credences. When binding is possible, non-Conditionalizing credences are permissible if paired with a binding policy.
  *   *Acceptable Outcome:* A proof showing that the distinction between credence-norms and policy-norms collapses entirely, rendering the DDB argument purely pragmatic regardless of binding. (This would refute the Orthodox view decisively).

  **5. Failure Conditions**
  I must be honest about where this project could fail.
  1.  **Formal Triviality:** If the model is rigged such that $\beta$ simply stipulates the conclusion (e.g., if "binding" is defined as "fixing credences"), the theorem will be tautological. I must ensure the definition of binding is independent of the definition of credence.
  2.  **Normative Irrelevance:** If the Separation Theorem holds mathematically but fails to map onto the philosophical concept of "rational belief" (e.g., if the model allows agents to hold beliefs they systematically act against without irrationality), the project fails to address the epistemological question.
  3.  **The Collapse Risk:** It is possible that even with binding, DDB vulnerability *always* implies a credal defect regardless of policy. If the math shows that $\beta$ does not actually shift the normative target, the central hunch is false. I will count this as a substantive philosophical discovery, but it would require rewriting the dissertation to argue for the Orthodox view on new grounds.

  **6. Timeline**
  *   Months 1-2: Formalize the model (Chapter 2).
  *   Months 3-4: Attempt proof of Separation Theorem (Chapter 3).
  *   Months 5-6: Draft Chapters 1 and 4 based on results.
  *   Month 7: Objections and polish.

  This project moves the debate from intuitions about money pumps to a rigorous analysis of control and constraint. It clarifies whether Conditionalization is a requirement of rationality or merely a requirement of the unbound.
