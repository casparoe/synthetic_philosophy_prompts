prompt: |-
  I facilitate a small ethics discussion group at my neighborhood community center — about a dozen adults of mixed ages, no philosophy background, one two-hour monthly session. Next month's topic is one I've been chewing on privately for years: whether it's automatically right to save the greater number of people when you can't save everyone. Years ago I came across an essay by a philosopher named Taurek arguing that the numbers don't count in themselves — that when you can rescue either one stranger or five strangers, it isn't obvious you must save the five, and that something like flipping a coin between the groups is a respectable option. I've never been able to articulate why this doesn't strike me as monstrous, and I'd like the group to at least feel the pull of it before we argue about it, not just dismiss it.

  Please design the session for me. I want an actual activity — staged choices, role cards, small real stakes like candy bars rather than a discussion — arranged so that participants first act on the "save the five" reflex, then work their own way, step by step, through a sequence of smaller forced choices, and only notice at the end where their own answers have landed them. They should build the reasoning themselves; I don't want to lecture, and I'd rather the name of the view never come up until the debrief. That debrief should map specific moments in the activity onto the parts of the argument: what each individual person stands to lose, the pairwise comparisons the view rests on, and where fairness or a coin flip enters. I also want you to tell me honestly what will predictably go wrong the first time I run it, and which feature of the position the activity simply cannot reproduce and I'll have to supply myself.

  Take the role of an experienced designer of interactive philosophy sessions for non-academic audiences. Think carefully and brainstorm a couple of possible framings before committing to one, then give me a complete, runnable plan: materials, roles, rules, a minute-by-minute timeline, and the debrief. Assume I have no one to help me run it.
reasoning: |-
  Here's a thinking process that leads to the suggested session plan:

  1.  **Analyze the Request:**
      *   **Facilitator:** Experienced but needs a specific plan for a non-academic group (12 adults, mixed ages, 2 hours/month).
      *   **Topic:** John Taurek's "Numbers Don't Count" argument (saving 1 vs. 5 strangers).
      *   **Goal:** Participants should *feel* the pull of the argument, not just dismiss it as monstrous. They need to build the reasoning themselves through activity, not lecture.
      *   **Method:** Interactive activity with staged choices, role cards, small stakes (candy), leading to a realization at the end.
      *   **Debrief:** Map activity moments to Taurek's specific arguments (individual loss, pairwise comparison, fairness/coin flip).
      *   **Constraints:** No assistants, 2 hours total, no philosophy jargon until the end.
      *   **Required Output:** Brainstorming framings, final chosen plan (materials, roles, rules, timeline, debrief), honest assessment of pitfalls/limitations.

  2.  **Deconstruct Taurek's Argument (Mental Check):**
      *   *Core Claim:* There is no "super-voice" that sums up total pain. Only individuals suffer.
      *   *The "Loss" Argument:* The one person loses their life. The five people *each* lose their life. But no *single* person loses "five lives." The loss to the one is 100% of their future. The loss to any *one* of the five is also 100% of their future.
      *   *The "Fairness" Argument:* If I have a duty to A, B, C, D, and E, do I have a duty 5 times stronger than to F? Or do I have an equal duty to each? If equal, how to choose? Coin flip gives equal chance.
      *   *The "No Aggregation" Claim:* You can't add up utilities across persons.

  3.  **Brainstorming Activity Framings:**

      *   *Idea 1: The Lifeboat Simulation.* Classic trolley problem style.
          *   *Pros:* Intuitive stakes.
          *   *Cons:* Too abstract. People default to utilitarian math immediately. Hard to make it personal without being traumatic.
          *   *Verdict:* Too generic. Doesn't force the "pairwise" thinking.

      *   *Idea 2: The Resource Allocation Game.* Participants are doctors with limited medicine.
          *   *Pros:* Clear scarcity.
          *   *Cons:* Feels like triage (which usually demands saving the most). Hard to isolate the "numbers" variable.
          *   *Verdict:* Too clinical.

      *   *Idea 3: The "Promise" Game.* Participants make promises to individuals.
          *   *Pros:* Highlights individual duty.
          *   *Cons:* Hard to scale to life/death stakes within 2 hours.
          *   *Verdict:* A bit weak on the "life" stakes.

      *   *Idea 4: The "Token Rescue" (Chosen Direction).* Use physical tokens representing people, but assign *participants* as the "voices" of those tokens. This forces them to inhabit the individual perspective rather than the "god's eye" view.
          *   *Mechanism:* Split the room. Some are "Rescuers," some are "Victims."
          *   *Twist:* Change the information available. First, they see groups (5 vs 1). Then, they see individuals behind screens/curtains.
          *   *Refinement:* Let's make it about *claims*. Each person has a claim on the rescuer. Does 5 claims outweigh 1 claim?
          *   *Final Concept:* "The Claim Game." Participants hold cards representing people in danger. They must argue for their own survival. The Rescuer must choose. We iterate the scenario to isolate the "numbers" variable.

      *   *Wait, a better approach for Taurek specifically:* Taurek relies heavily on the idea that the *one* person's loss is not less significant than *any one* of the five's loss. The activity needs to force a comparison between *One vs. One* repeatedly, rather than *One vs. Five*.
      *   *Revised Concept:* **"The Six Chairs."**
          *   6 Participants are "in danger." 1 Participant is the "Rescuer." (Rotate roles).
          *   Scenario: A flood is coming. Only enough life jackets for some.
          *   Round 1: Save 5 vs 1 (Standard intuition).
          *   Round 2: Isolate the individuals. Ask the Rescuer to justify why Person A matters less than Person B.
          *   Round 3: Introduce the Coin Flip as a way to honor equal worth.
          *   *Problem:* 12 people. 6 in danger, 1 rescuer leaves 5 observing. Observers get bored.
          *   *Solution:* Small groups. 3 groups of 4.
          *   *Group Setup:* In each group of 4: 1 Rescuer, 3 "Group A", 1 "Group B". Wait, Taurek is 5 vs 1.
          *   *Adjustment:* 2 Groups of 6.
          *   *Group 1:* 1 Rescuer, 5 Victims (Team Big), 1 Victim (Team Small).
          *   *Group 2:* Same.
          *   *Remaining 4:* Observers/Judges (rotate).
          *   *Actually, keep it simple.* One large simulation is more dramatic. But 12 people is small enough for one circle. Let's try to involve everyone.
          *   *Idea:* Everyone gets a "Life Card." Some are in Zone A (5 people), some in Zone B (1 person). One person is the "Decision Maker" (DM).
          *   *Problem:* Only one DM. Others watch.
          *   *Fix:* Multiple rounds with rotating DMs. Or, use a "Voting" mechanism that reveals the tension.
          *   *Best Fix:* **"The Blind Partition."**
          *   All 12 are "Potential Victims."
          *   Facilitator is the "Fate."
          *   We simulate the *reasoning* process, not just the outcome.
          *   *Wait, the prompt asks for "staged choices, role cards, small real stakes."*
          *   Let's go with **"The Rescue Fund."**
          *   Pot of money (candy/gift cards).
          *   Two buckets of beneficiaries.
          *   Round 1: 5 people vs 1 person.
          *   Round 2: Reveal identities.
          *   Round 3: Pairwise comparison.
          *   *Critique:* Money trivializes life.
          *   *Back to Life Cards.* It's a thought experiment made physical.
          *   *Plan:* 3 Groups of 4.
          *   In each group: 1 Rescuer, 3 "Many", 1 "Few". (Scaling down 5:1 to 3:1 for group size).
          *   This allows everyone to participate actively.

  4.  **Developing the "Three Groups of Four" Plan:**
      *   **Setup:** 3 tables. 4 people each.
      *   **Roles:** 1 Rescuer, 1 "Solo" (the one), 2 "Group" (part of the many). *Wait, Taurek is 5 vs 1.* With 4 people, I can do 3 vs 1. It's the same logic.
      *   **Materials:** Envelopes, "Life Tokens" (poker chips or candy), Decision Cards.
      *   **Flow:**
          1.  **Intuition Pump:** Rescuer chooses 3 over 1 immediately. (Establishes the reflex).
          2.  **Isolation:** Rescuer talks to Solo. Then talks to *one* member of the Group. Compare the two.
          3.  **The Conflict:** If Solo = Group Member 1, why add Group Member 2 & 3 to tip the scale?
          4.  **The Coin:** Introduce the coin flip as a way to respect the equality established in step 2.
          5.  **Reveal:** Connect to Taurek.

  5.  **Refining the Activity for Maximum Impact:**
      *   *Stakes:* Candy is good. Let's make it "Survival Rations."
      *   *Secrecy:* The Rescuer shouldn't know *who* the people are initially.
      *   *The "Taurek Turn":* The key is to make the Rescuer feel that saving the 3 is *not* obviously better once they focus on the individual loss.
      *   *Step 1:* Rescuer saves 3. (Utilitarian reflex).
      *   *Step 2:* Rewind. Rescuer must interview *one* person from the 3 and the *one* person from the 1. They realize they are identical in moral worth/need.
      *   *Step 3:* Rescuer is asked: "If you can only save Person A (from the 3) or Person B (the 1), who do you save?" Most will say "Indifferent/Coin."
      *   *Step 4:* "Now add Person C and D back into Person A's side. Does that change your duty to Person B?"
      *   *This is the core Taurek argument.* The activity must force this specific cognitive sequence.

  6.  **Addressing the "Predictably Go Wrong" & "Limitations":**
      *   *Risk 1:* Participants treat it as a game and gamify it (e.g., "I'll save the 3 because I want to win"). *Mitigation:* Serious framing, low stakes (candy), focus on *justification* not outcome.
      *   *Risk 2:* The "Numbers" intuition is too strong. They will say "3 lives is just more." *Mitigation:* Facilitator script needs to press on *whose* life is lost.
      *   *Risk 3:* Time management. 2 hours is tight for 3 groups + debrief. *Mitigation:* Strict timing.
      *   *Limitation:* The activity can't reproduce the *metaphysical* claim that there is no "social entity" that suffers. It can only show the *fairness* argument. The facilitator must explain the metaphysical bit in the debrief.

  7.  **Drafting the Plan (Iterative refinement):**
      *   *Title:* "The Equal Claim."
      *   *Materials:* Envelopes, Name Tags, Coins, Candy.
      *   *Timeline:*
          *   0-15: Intro & Setup.
          *   15-45: Round 1 (The Reflex).
          *   45-75: Round 2 (The Pairwise).
          *   75-90: Break (Crucial for digestion).
          *   90-110: Round 3 (The Coin & Synthesis).
          *   110-120: Debrief & Taurek Reveal.
      *   *Wait, 2 hours is 120 mins.*
      *   *Correction:* Need more time for the debrief. The activity needs to be tighter.
      *   *Revised Timeline:*
          *   0-10: Intro.
          *   10-40: Activity Part 1 (The Reflex).
          *   40-70: Activity Part 2 (The Isolation).
          *   70-80: Break.
          *   80-100: Activity Part 3 (The Coin).
          *   100-120: Debrief.
      *   *Actually, keep the activity continuous.* Breaks kill momentum in small groups. Let's do 90 mins activity, 30 mins debrief.
      *   *Wait, one facilitator managing 3 groups.* I can't be everywhere. I need the activity to be self-running via instruction cards.
      *   *Solution:* I will rotate. 10 mins per group for key moments, or have them report back.
      *   *Better Solution:* Do it as one large group simulation with subsets. It's easier for one facilitator to control the narrative.
      *   *Decision:* **One Large Simulation.** 12 people.
      *   **Roles:** 1 "Decision Maker" (DM). 6 "Team Alpha". 1 "Team Beta". 4 "Observers" (rotate).
      *   *Wait, 5 vs 1 is the magic ratio.*
      *   **Setup:** 6 "Victims" (5 in Room A, 1 in Room B). 1 "Rescuer". 5 "Witnesses".
      *   *Rotation:* We do 2 rounds so more people are Rescuer/Victim.
      *   *Let's stick to the 3 small groups idea.* It's more intimate. I can print instruction packets for each table. I will circulate.

  8.  **Finalizing the Activity Mechanics:**
      *   **Group Size:** 4 people per table (3 tables).
      *   **Roles:** 1 Rescuer, 3 "Many" (M1, M2, M3), 1 "One" (O1). *Wait, 4 people.* 1 Rescuer + 3 Victims? No, need 5 vs 1 logic.
      *   *Math:* 12 people. 3 tables of 4.
      *   *Scenario:* 3 vs 1. (Proportionally equivalent for the logic).
      *   *Roles:* 1 Rescuer, 2 "Many" (M1, M2), 1 "One" (O1). Total 4.
      *   *Wait, 3 vs 1 is better than 2 vs 1.*
      *   *Roles:* 1 Rescuer. 3 Victims total. 2 are tied together (The Many), 1 is separate (The One).
      *   *Materials:* "Life Cards."
      *   *Process:*
          1.  Rescuer saves The Many (2) over The One (1).
          2.  Reset. Rescuer interviews M1 and O1. Acknowledges equal worth.
          3.  Rescuer asked: "M1 or O1?" (Coin flip).
          4.  Rescuer asked: "Does adding M2 change the duty to O1?"
      *   *This works.*

  9.  **Writing the Debrief:**
      *   Must connect:
          *   Step 1 -> Utilitarian Intuition.
          *   Step 2 -> Taurek's "No Common Loss."
          *   Step 3 -> Fairness/Equal Chance.
          *   Step 4 -> Aggregation rejection.
      *   Must name Taurek here.
      *   Must address the "Monstrous" feeling (why we feel it, but why Taurek thinks it's mistaken).

  10. **Review against Constraints:**
      *   *No lecture:* Check.
      *   *Build reasoning:* Check.
      *   *Small stakes:* Candy/Rations.
      *   *Honest assessment:* Need to write the "What Will Go Wrong" section.
      *   *Limitations:* Need to identify what the activity *can't* do (metaphysical claim).

  11. **Final Polish:** Ensure tone is supportive and professional. Make sure instructions are crystal clear for the facilitator who is running this alone. (Self-Correction: Make sure the instruction cards for the tables are explicit so I don't have to micromanage).

  *(Self-Correction during drafting)*: I need to make sure the "Observers" don't feel left out if I do small groups.
  *Fix:* In the 3-table setup, *everyone* has a role. 1 Rescuer, 1 "One", 2 "Many". That's 4 people. Perfect. No observers needed.
  *Wait, 12 people / 4 per table = 3 tables.*
  *Roles per table:* 1 Rescuer, 1 "Solo", 2 "Pair". (Total 4).
  *Logic:* Save 2 vs 1. (Close enough to 5 vs 1 for the logic to hold).
  *Stakes:* Each victim gets a candy bar if saved. Rescuer gets candy if they make a "defensible" choice (defined later).
  *Actually, better:* All candy goes into a pool. If you "die," you lose your candy. This makes it personal.

  *Let's refine the "What Will Go Wrong".*
  *   People will laugh/nervous giggle.
  *   People will stick to utilitarianism stubbornly.
  *   Time will run over.
  *   The "Coin Flip" will feel like cowardice, not fairness.

  *Let's refine the "Limitation".*
  *   The activity shows *fairness*, but Taurek's deeper point is about *ontology* (there is no "group mind" to suffer). The activity can't simulate ontology, only moral intuition.

  *Okay, ready to write.*
answer: |-
  ## Session Plan: "The Equal Claim"

  **Topic:** John Taurek's "Numbers Don't Count" Argument (Saving 1 vs. Many)
  **Time:** 120 Minutes
  **Group Size:** 12 Adults (3 tables of 4)
  **Facilitator Load:** High (you are circulating, not lecturing)

  ### Designer's Note: Why This Structure?
  Taurek's argument is counter-intuitive because we naturally adopt a "God's Eye View" (summing up total pain). To make the group feel the pull of Taurek, we must force them into the **individual perspective**. This activity uses a "Zoom In / Zoom Out" mechanic. First, they make the utilitarian choice instinctively. Then, we isolate the individuals until the "group" dissolves, forcing them to confront the equality of the single claims. Finally, we reintroduce the numbers to see if the logic holds.

  ---

  ### Materials Checklist
  *   **3 Tables** arranged separately (if possible) to allow parallel conversation.
  *   **12 Envelopes** (labeled Table 1, 2, 3). Inside each:
      *   4 Role Cards (1 Rescuer, 1 Solo, 2 Pair).
      *   1 "Decision Log" sheet.
      *   4 Candy Bars (or equivalent small prize).
      *   1 Coin.
  *   **Whiteboard/Flipchart** for the final debrief.
  *   **Timer** (visible to you).

  ---

  ### Minute-by-Minute Timeline

  #### 0:00 – 0:10 | Introduction & Framing
  *   **Welcome:** Briefly state the goal: "Today we aren't looking for the 'right' answer. We are testing how our moral intuitions behave under pressure."
  *   **The Stakes:** Hand out the envelopes. Tell them: *"Inside are role cards and candy. The candy represents 'survival.' If your role is 'saved,' you keep the candy. If your role is 'lost,' you surrender it to the center of the table. This is low-stakes, but treat the choice seriously."*
  *   **Rule:** No looking at other tables' cards. Follow the instructions in the envelope step-by-step. Do not open the next step until instructed.

  #### 0:10 – 0:35 | Phase 1: The Reflex (Utilitarian Intuition)
  *   **Action:** Participants open **Step 1** in their envelopes.
  *   **Scenario:** A flood is coming. The **Rescuer** has one life raft.
      *   **The Pair:** Two people are stuck on Roof A.
      *   **The Solo:** One person is stuck on Roof B.
      *   **Constraint:** You can save Roof A *or* Roof B, not both.
  *   **Task:** The Rescuer must decide immediately. The Pair and Solo state their claim ("I want to live").
  *   **Outcome:** Almost all Rescuers will save The Pair.
  *   **Documentation:** On the Decision Log, mark: *Round 1 Choice: Save Pair.*
  *   **Facilitator Move:** Circulate. Listen. If a Rescuer hesitates, say nothing. Let the group pressure resolve it.
  *   **Time Check:** At 0:30, call "Pause." Ask for a show of hands: "How many Rescuers saved the Pair?" (Expect 100%). Acknowledge this as the "Common Sense" baseline.

  #### 0:35 – 1:05 | Phase 2: The Isolation (Pairwise Comparison)
  *   **Action:** Participants open **Step 2**.
  *   **Instruction:** "Rewind the flood. The water is rising, but you have time for interviews."
  *   **Task:**
      1.  The Rescuer must turn their chair away from The Pair. They can only look at **one** member of The Pair (let's call them Pair-1).
      2.  The Rescuer looks at Pair-1 and The Solo.
      3.  **Question:** "Ignoring the person behind you (Pair-2), compare Pair-1 and The Solo. Who has a stronger claim on you?"
      4.  **Constraint:** You cannot say "Both." You must choose one *or* declare them equal.
      5.  **Stakes:** If you declare them equal, you must flip the coin for *this specific pair*.
  *   **The Trap:** Most Rescuers will admit Pair-1 and Solo are equal individuals. They will flip the coin (50/50).
  *   **Documentation:** Mark: *Round 2 Choice: Equal Worth / Coin Flip.*
  *   **Facilitator Move:** This is the critical moment. Visit each table. Ask the Rescuer: *"Why did you treat them as equals just now, when you treated the group as heavier before?"* Do not answer for them. Just ask.

  #### 1:05 – 1:15 | Break (Crucial Digestion Time)
  *   **Instruction:** "Stand up. Stretch. Eat your candy if you kept it. Do not discuss the ethics yet. Just reset."
  *   **Why:** The cognitive dissonance between Phase 1 and Phase 2 needs to settle.

  #### 1:15 – 1:45 | Phase 3: The Aggregation Test
  *   **Action:** Participants open **Step 3**.
  *   **Instruction:** "Return to the original scenario. The Pair (Pair-1 + Pair-2) vs. The Solo."
  *   **Task:** The Rescuer must make a final decision, but they must write down a **Justification** on the Decision Log.
      *   *Option A:* Save the Pair because 2 > 1.
      *   *Option B:* Flip a coin between the Group and the Solo (giving the Solo a 50% chance, not a 33% chance).
      *   *Option C:* Flip a coin between every individual (giving everyone a 33% chance).
  *   **Discussion:** The Pair and Solo are allowed to argue their case based on the findings in Phase 2.
      *   *Solo Argument:* "You admitted I am equal to Pair-1. Why does Pair-2's existence reduce my chance of survival?"
      *   *Pair Argument:* "If you save me, Pair-1 also lives. That's more good."
  *   **Documentation:** Mark Final Choice and write the one-sentence Justification.
  *   **Facilitator Move:** Collect the Decision Logs. This is your data for the debrief.

  #### 1:45 – 2:00 | The Debrief (Mapping the Argument)
  *   **Setup:** Bring everyone to one large circle. Put the Whiteboard where all can see.
  *   **The Reveal:** "You just walked through an argument made by philosopher John Taurek in 1977. He argued that 'Numbers Don't Count.'"
  *   **Mapping (Write on Board):**
      1.  **Phase 1 (The Reflex):** We naturally aggregate. We see "2 lives" vs "1 life." We think the *group* suffers more.
      2.  **Phase 2 (The Isolation):** Taurek's Core Claim. There is no "group mind." Pair-1 loses 100% of their future. Solo loses 100% of their future. The loss is identical *to the individual*.
      3.  **Phase 3 (The Fairness):** If the loss is identical, do we owe the Group *more*? Or do we owe each person *equal concern*?
          *   If equal concern: A coin flip between the *groups* (50/50) honors the Solo's equality.
          *   If aggregation: A coin flip between *individuals* (33% each) honors the numbers.
  *   **Closing Question:** "Taurek suggests the coin flip between groups isn't cowardice; it's the only way to respect the Solo's equal worth. Does that feel like justice, or does it still feel like a mathematical error?"

  ---

  ### Honest Assessment: What Will Go Wrong?

  As a designer who has run similar sessions, here are the predictable failure points you need to manage:

  **1. The "Gamer" Response (Predictable)**
  *   **What:** In Phase 1, participants will treat the candy as a game score. They will say, "Obviously save two, more candy for the table."
  *   **Why:** It trivializes the "life" stakes.
  *   **Fix:** In the intro, emphasize that the *Rescuer* is being judged on their *reasoning*, not the outcome. If they save the Pair but can't explain why after Phase 2, they "lose" the facilitator's respect (playfully). Keep the tone solemn during the scenario.

  **2. The Stubborn Utilitarian (Predictable)**
  *   **What:** A Rescuer will refuse to accept Phase 2's premise. They will say, "Pair-1 is still more valuable because they have a friend with them."
  *   **Why:** The intuition that "more death is worse" is deeply wired.
  *   **Fix:** Do not argue. In the debrief, highlight this specific resistance. Say, "This is the exact point where Taurek and the Utilitarian part ways. One sees a sum, the other sees individuals." Validate their feeling; don't correct it.

  **3. Time Creep (High Risk)**
  *   **What:** Phase 2 discussions will run long. People love arguing about fairness.
  *   **Why:** You are alone. You cannot monitor three tables simultaneously.
  *   **Fix:** Be the timekeeper. At 1:00, announce "5 minutes left for Phase 2." If a table is stuck, tell them: "Record the disagreement on the Log and move to Phase 3." The disagreement *is* data for the debrief.

  **4. The Coin Flip Feels Like Cowardice (Predictable)**
  *   **What:** Participants will view the coin flip as "abdicating responsibility."
  *   **Why:** We view moral agents as needing to *act*, not chance.
  *   **Fix:** In the debrief, reframe the coin. "The coin isn't about chance; it's about *equality*. If you choose the Pair without a coin, you are saying the Solo's life is worth less than half of the Pair's."

  ---

  ### Limitations: What This Activity Cannot Do

  You must supply these points verbally in the debrief. The activity mechanics cannot reproduce them:

  **1. The Metaphysical Claim**
  *   **Limitation:** The activity shows that *fairness* suggests a coin flip. It does not prove Taurek's deeper metaphysical claim: that there is no such thing as "social pain."
  *   **Your Job:** Explain that Taurek believes "society" doesn't feel pain; only people do. Therefore, adding people doesn't add pain to a single entity. The activity simulates the *result* of this belief, not the belief itself.

  **2. The "Special Obligations" Loophole**
  *   **Limitation:** Taurek allows you to save your *own child* over five strangers. This activity uses strangers.
  *   **Your Job:** Mention this in the debrief. "Taurek isn't saying you must be random. He says you can choose based on personal connection, but *numbers alone* aren't a valid reason." This often relieves the "monstrous" feeling participants have.

  **3. The Scale Problem**
  *   **Limitation:** 2 vs 1 feels different than 1,000 vs 1.
  *   **Your Job:** Ask them: "At what number does the coin flip become impossible? 100? 1,000,000?" Taurek bites the bullet: even then, the individual loss is 100%. This is the hardest pill to swallow, and you need to voice it for them.

  ### Facilitator Script Snippet (For the Debrief)
  *"Many of you felt a tension in Phase 2. You felt that Pair-1 and the Solo were equal, but in Phase 1, the Solo became 'less.' Taurek argues that Phase 2 is the truth, and Phase 1 is the illusion. He suggests that by saving the five, we aren't minimizing suffering; we are simply voting. And he asks: since when did morality become a vote?"*
