answer: |-
  **Reference Class Forecasting Protocol (RCFP)**

  **Purpose:** Neutralize optimism bias by anchoring estimates to historical outcomes rather than internal scenarios.

  **Step 1: Construct Candidate Classes**
  Identify three distinct reference classes:
  1.  **Broad:** Global projects of this general type (e.g., all rail infrastructure).
  2.  **Contextual:** Domestic projects of this type (e.g., national rail projects).
  3.  **Specific:** Projects matching technical scope and scale (e.g., light rail in cities <500k population).

  **Step 2: Validate Classes (Mechanical)**
  *   **Rule 1 (Minimum N):** Reject any class with fewer than 5 completed projects.
  *   **Rule 2 (Anti-Gerrymandering):** Reject classes defined by success criteria (e.g., "on-budget projects") or excluding known failures.
  *   **Rule 3 (Data Integrity):** Reject if cost/time data is missing for >20% of the class.

  **Step 3: Calculate & Weight (Mechanical)**
  *   Compute the mean cost overrun percentage for each valid class.
  *   **Weighting Formula:** Broad (50%) + Contextual (30%) + Specific (20%).
  *   *Rationale:* We do not take the broadest class alone because local regulatory environments matter. We do not take the specific class alone because it is prone to cherry-picking. The weighted average balances general statistical reality with local context.
  *   **Final Outside View:** Apply weighted average overrun to the internal bottom-up estimate.

  **Step 4: Small-N Exception (Mechanical)**
  *   If total valid comparables across all classes < 5: Do not average.
  *   **Action:** Select the single most similar project. Use its actual overrun plus a 20% contingency buffer.
  *   **Label:** Mark estimate as "High Uncertainty – Limited Reference Class."

  **Step 5: Judgment Trigger (Mechanical)**
  *   If the Final Outside View exceeds the internal estimate by >25%, the internal estimate is rejected.
  *   **Requirement:** Revision requires written justification signed by the Minister.

  **Case Applications**
  **1. Light-Rail Line:**
  *   *Classes:* International Rail (N=150), Domestic Rail (N=12), Specific Light-Rail (N=8). All valid.
  *   *Data:* International overrun = 45%. Domestic = 30%. Specific = 25%.
  *   *Calculation:* (0.5×45) + (0.3×30) + (0.2×25) = 36.5% weighted overrun.
  *   *Result:* Internal estimate $500M → RCFP Estimate $682.5M.
  *   *Outcome:* Leadership receives $682.5M. This number is unpopular but mandatory under Step 5.

  **2. Automated Port Terminal:**
  *   *Classes:* Global Automated Terminals (N=3).
  *   *Validation:* Fails Rule 1 (N < 5).
  *   *Action:* Invoke Step 4 (Small-N).
  *   *Data:* Most similar project had 200% overrun (failure).
  *   *Result:* 200% + 20% buffer = 240% contingency.
  *   *Outcome:* Estimate reflects high failure risk, not precision.

  **Transparency & Limitations**
  *   **Mechanical Steps:** Counting N, calculating means, applying weights, triggering exceptions.
  *   **Judgment Calls:** Defining class boundaries (e.g., what counts as "rail"?), assessing data integrity. Analysts must document why a class was defined broadly or narrowly.
  *   **What This Cannot Do:** It cannot predict black swan events, technological breakthroughs, or political interference. It assumes the future resembles the past. It prevents underestimation but cannot guarantee accuracy.

  **Analyst Note:** When leadership requests narrowing classes to exclude failures, cite Rule 2. When N is low, do not pretend precision exists.
