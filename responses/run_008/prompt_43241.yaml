      *   *Surgeon:* Care was already rendered; the whiskey didn't condition the right to health.
      *   *Cousin:* A job is not a public entitlement; the cousin was qualified, so the public's right to competent work was met.
      *   *Patron/Congress:* Public resources/contracts are entitlements of the citizenry; diverting them to partisans/donors violates that collective right.
  *   **Prediction for A:** Stamping is a right; speed is a privilege. Since the right was fulfilled for everyone, it is **Not Corrupt**.
  *   **Prediction for B:** A license (if qualified) is a right. Shelving it based on location violates that entitlement. **Corrupt**.

  **2. The "Institutional Function" Principle**
  *   **Definition:** Corruption is any action that subverts the specific *purpose* (telos) of the institution. If the institution achieves its goal (roads fixed, patients healed, contracts fulfilled), the action is not corrupt, regardless of private motives.
  *   **Fit:**
      *   *Surgeon:* Goal = Heal. Patient healed. **Not Corrupt**.
      *   *Cousin:* Goal = Fix Roads. Roads fixed by qualified worker. **Not Corrupt**.
