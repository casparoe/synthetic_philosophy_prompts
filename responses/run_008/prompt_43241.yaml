  ### Candidate Principles

  To explain your friend's verdicts, we must discard the obvious definitions. **Legality** fails (Case 3 is legal but corrupt). **Private Gain** fails (Case 6 involves no pocketing). **Quid Pro Quo** alone fails (Case 4 involves an exchange of labor for kinship loyalty but is not corrupt).

  Two principles fit the track record equally well:

  **1. The "Public Entitlement" Principle**
  *   **Definition:** Corruption occurs when an official conditions the fulfillment of a citizen's *public right* (entitlement) on a private criterion (money, kin, loyalty). If the citizen is merely receiving a *privilege* (like a job contract) or the *outcome* is guaranteed regardless of the private criterion, it is not corruption.
  *   **Fit:**
