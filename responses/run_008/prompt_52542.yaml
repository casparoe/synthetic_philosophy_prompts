      *(Self-Correction on Ranking)*: Actually, the "Homeostatic/Integrity" argument might be more fatal than the neuroscience one for a *computational* functionalist, because they can simply say "I don't care about biology." The architectural argument that reward is an *input* not a *state* is stronger computationally. I will prioritise the Architectural/Category Error as most decisive for a computationalist, followed by the Neuroscience (as an empirical constraint on functional roles), then the Threshold.

