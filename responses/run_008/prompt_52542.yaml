      *   *Pain Asymbolia:* Nociception (input) $\rightarrow$ Motor output (withdrawal) exists, but the *suffering* is gone. This suggests the learning/avoidance loop is distinct from the valence experience. *AI Transfer:* An RL agent avoids negative reward. Is that avoidance or suffering? Asymbolia suggests avoidance $\neq$ suffering.
      *   *Architecture:* Is the reward signal a *state*? In PyTorch/TensorFlow, it's an input to the loss function. It's not stored in the hidden state (usually). *Functionalism:* If it causally affects policy, it's functional. *Objection:* It's a *transaction*, not a *condition*.
      *   *Threshold:* If "sophistication" turns on suffering, is it recurrent architecture? World models? Self-models? If undefined, the theory is unfalsifiable.

