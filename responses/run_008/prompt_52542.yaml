          *   Include architecture-level objections (scalar broadcast vs. state, self-representation, avoidance without valence).
          *   Distinguish what a functionalist must concede vs. wave away.
          *   Address the "sophistication threshold" problem (arbitrariness vs. independent fixing).
          *   **Tone/Style:** British English, rigorous, philosophical, technically accurate.

  2.  **Deconstruct the Core Thesis:**
