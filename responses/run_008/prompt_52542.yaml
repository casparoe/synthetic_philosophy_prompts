          *   Meta-representation: Does the agent need to *know* it is being punished to suffer, or just be updated? (Higher-order thought theories).
          *   Homeostasis: Biological suffering is tied to viability/threats to integrity. RL agents don't have "integrity" in the same way unless engineered.

      *   *Philosophy of Mind:*
