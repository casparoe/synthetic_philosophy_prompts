answer: |-
  Here is a defended ordering for your three-year project, based on logical dependency, tractability for a formalist without a lab, and normative leverage.

  ### The Reordering

  Your carving is conceptually sound, but the *logical dependency* between these problems is not linear in the way you listed them. I propose the following ordering for your project timeline:

  1.  **The Dimension Problem** (Year 1)
  2.  **The Conventionality Problem** (Year 2)
  3.  **The Construction Problem** (Year 3)
  4.  **The Calibration Problem** (Deprioritized/Decoy)

  **Why this order?**
  You cannot determine if comparisons are conventional (2) or constructible (3) until you specify *what* is being compared (1). Asking if "utility levels" are conventional is a different question than asking if "utility ratios" are. Similarly, you cannot assess whether a social observer construction (3) is circular without knowing what informational inputs (ordinal vs. cardinal, levels vs. differences) the construction is permitted to use (1) and what metaphysical status those inputs hold (2).

  Calibration (4) is placed last because it is an epistemic problem that presupposes the metaphysical and structural problems are solvable. For a formal philosopher, it is the least tractable and the most downstream.

  ---

  ### 1. The Dimension Problem (Year 1 Priority)

  **Why it is upstream:**
  This is the architectural blueprint. Welfare economics, population ethics, and bargaining theory do not require the same comparability structures. Prioritarianism requires level comparability; utilitarianism requires unit comparability; sufficientarianism may only require sign comparability. If you attempt to solve the Conventionality or Construction problems without fixing the target dimension, you risk solving a problem that no ethical theory actually needs. You must first map the *necessary conditions* for the practices you intend to justify.

  **Tractability (Formal/Philosophical):**
  Highly tractable for your skillset. This requires axiomatic analysis and conceptual mapping, not empirical data. You can model different "fragments" of comparability as invariance conditions under transformation groups (e.g., ratio-scale vs. interval-scale across persons) and test which social choice rules survive which invariance constraints. This is pure decision theory.

  **Shift Trigger (Next 2 Years):**
  *   **Move Up:** If a prominent new argument demonstrates that a dominant theory (e.g., Prioritarianism) collapses without a specific, controversial fragment (e.g., non-zero level comparability), making the dimension question existential for that theory.
  *   **Move Down:** If a general impossibility theorem is published showing that *no* fragment weaker than full cardinal comparability supports *any* plausible aggregation rule. This would render the fragmentation analysis moot, forcing a binary "all or nothing" approach.

  ### 2. The Conventionality Problem (Year 2 Priority)

  **Why it is upstream:**
  Once you know *what* needs to be compared (Dimension), you must determine the *status* of that comparison. If interpersonal utility facts are like "distance," they constrain our aggregation rules. If they are like "zero meridians," aggregation rules are merely stipulations. This determines the normative force of your entire project. If comparisons are conventional, the "Construction" problem (Year 3) changes from a discovery process to a design process. You cannot build the machine (Construction) until you know if you are discovering its parts or inventing them.

  **Tractability (Formal/Philosophical):**
  Tractable, but requires careful metaphysical semantics rather than pure logic. You can analyze the "conventionality" claim by examining the admissible transformations of utility functions. If the "truth" of a comparison is invariant under a wider class of transformations than the "facts" allow, it suggests conventionality. This can be handled via formal semantics and modal logic without a lab.

  **Shift Trigger (Next 2 Years):**
  *   **Move Up:** If a new argument successfully links conventionality to a loss of normative authority (e.g., proving that conventional comparisons cannot ground *obligations*, only *coordination*). This would threaten the normative viability of the whole project.
  *   **Move Down:** If a robust defense of "constitutive conventionalism" gains traction (arguing that some normative facts *must* be instituted to exist, like money or borders), rendering the realism/conventionalism debate less critical for normative force.

  ### 3. The Construction Problem (Year 3 Priority)

  **Why it is upstream:**
  This is the synthesis phase. Only after defining the required dimensions (Year 1) and their metaphysical status (Year 2) can you assess whether a social observer can be derived from individual preferences. This is where you test if the Harsanyi-style derivations can be saved from circularity charges given your specific constraints on dimension and conventionality.

  **Tractability (Formal/Philosophical):**
  Highly tractable. This is classic axiomatic social choice theory. You are testing consistency of axioms (Pareto, Anonymity, Independence) against your established dimensional and metaphysical constraints.

  **Shift Trigger (Next 2 Years):**
  *   **Move Up:** If a new derivation is published that successfully generates interpersonal comparability from ordinal, intrapersonal data without an impersonal observer assumption. This would revolutionize the field and require you to integrate their axiom set.
  *   **Move Down:** If the consensus hardens that all such constructions are necessarily circular (a "no-go" theorem for constructivism). This would shift your focus from *building* the observer to *justifying* direct realist assumptions.

  ---

  ### The Decoy: The Calibration Problem

  **Why it is a decoy:**
  If you settle the Calibration Problem tomorrow (e.g., "fMRI patterns X and Y fix the utility scale across persons"), it changes almost nothing for your normative project if the **Conventionality Problem** remains unresolved. If the comparisons fixed by fMRI are merely conventional stipulations, they lack the normative bite to constrain a social welfare function. Conversely, if comparisons are real but uncalibratable (a "hidden variable" scenario), normative theory might still proceed using idealized models.

  For a philosopher without a lab, Calibration is a trap. It invites you into empirical debates where you have no comparative advantage, while distracting from the conceptual work that determines whether the empirical data *matters*. Solving Calibration gives you a ruler; solving Dimension, Conventionality, and Construction tells you if you are measuring length, weight, or nothing at all.

  ---

  ### The Fifth Problem: The Normative Authority Problem

  There is a problem more important than the four you listed, which I call **The Normative Authority Problem**.

  **The Problem:**
  Even if we settle that comparisons are real (not conventional), have the right structure (Dimension), and can be aggregated (Construction), we still lack an account of *why* these facts generate reasons for action. Why does the fact that $U_A(x) > U_B(y)$ give a third party (or a social planner) a reason to bring about $x$ rather than $y$?

  **The Case for Priority:**
  The four problems you listed are largely *metaphysical* and *epistemic* (What is it? Is it real? How do we build it? How do we measure it?). The Normative Authority Problem is *meta-normative*. It bridges the gap between "Interpersonal comparisons exist" and "We ought to maximize them."

  Without solving this, you risk building a precise engine that drives nowhere. You could have a perfectly constructed, calibrated, non-conventional social welfare function, but if there is no link between the output of that function and the *reasons* agents have to act, the project is descriptively accurate but normatively inert. This is the "Is-Ought" gap specific to welfare aggregation.

  **Why it beats the others:**
  If you solve Dimension, Conventionality, and Construction but fail on Authority, you have a map with no destination. If you solve Authority, you might find that interpersonal comparisons are *not* the fundamental currency of morality (e.g., perhaps rights or virtues are primary, and utility comparisons are derivative). This realization could render the other four problems secondary or obsolete. For a three-year project aiming at normative impact, establishing *why* we should care about the output is logically prior to refining the output itself.
