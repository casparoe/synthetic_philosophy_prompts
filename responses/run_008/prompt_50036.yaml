  2.  **Deconstruct the Game Theory:**
      *   **Scenario:** Prisoner's Dilemma / Race to the Bottom.
      *   **Players:** Software firms in Great Marwick.
      *   **Strategy:** Cooperate (no dark patterns) vs. Defect (use dark patterns).
