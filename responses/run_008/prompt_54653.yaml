answer: |-
  Open by validating the headline to hook them, then immediately sabotage the subjective clock they used to measure it, because if the timing metric fails, the "brain decided first" conclusion collapses.

  **The Sequence (40 Minutes)**

  1.  **The Hook (0–5 mins):** Start with the headline they all believe: "Science Proved Free Will Is an Illusion." Acknowledge why it's compelling. Do not debunk it yet. If you start with dry methodology, you lose the room's energy; let them feel the weight of the claim first so they feel the relief of the rebuttal later.
  2.  **The Methodological Weak Link (5–15 mins):** Move straight to the W-clock and the subjective report. This is your kill shot. Explain that the entire "500ms before" claim rests on a person watching a dot spin and reporting when they *felt* like moving. Highlight the introspective lag and the reliability issues of that timestamp. If the "when" is fuzzy, the "before" is meaningless.
  3.  **The Neural Data & The Veto (15–25 mins):** Now explain the Readiness Potential (RP), but frame it as *preparation*, not *decision*. Use the whiteboard to show the ramp-up. Immediately introduce the "veto" power (free won't). If the brain prepares an action but the conscious agent can stop it up to the last millisecond, the RP is an urge, not a command.
  4.  **The Noise Model (25–35 mins):** Introduce the 2010s modeling critique (Schurger et al.). Be upfront that you are gesturing at the math. Tell them: "Imagine random neural noise that sometimes crosses a threshold by chance." Explain that averaging many trials of random noise creates a curve that *looks* like a readiness potential even if no decision was made. This reframes the RP from a causal signal to a statistical artifact.
  5.  **The Generalization Gap & Boundaries (35–40 mins):** Address the leap from wrist-flexing to life choices. Then explicitly state what you are *not* solving.

  **The Carrying Example**

  Stick to the **wrist-flex setup**. Do not use a mundane morning moment like choosing coffee or brushing teeth.
  *   **What it needs:** Sterility. The wrist flex is artificial, arbitrary, and devoid of reason, which is why Libet chose it. It isolates the motor signal.
  *   **What it must lack:** Ecological validity. You want them to see that the experiment *only* works because it lacks the complexity of real decision-making (memory, emotion, consequence). If you use a morning routine example, the audience will get bogged down debating habits versus choices, which distracts from the methodological critique of the experiment itself.

  **Misconceptions & Timing**

  1.  **"The brain reads your mind before you do" (Head off at Minute 5):** Address this during the Clock section. Clarify that the brain isn't reading a decision; the measurement relies on the subject's flawed report of when that decision happened.
  2.  **"The Readiness Potential IS the decision" (Head off at Minute 15):** Address this during the Neural Data section. Distinguish between motor preparation (getting the gun ready) and firing the trigger (the decision).
  3.  **"The Veto proves free will exists" (Head off at Minute 20):** Address this immediately after introducing the veto. Clarify that the veto itself might be determined; Libet only claimed it showed conscious control, not metaphysical freedom.
  4.  **"This applies to all my everyday choices" (Head off at Minute 35):** Address this in the Generalization Gap. Spontaneous motor acts are fundamentally different from reasoned choices involving deliberation.

  **The Modeling Critique (Schurger/Noise)**

  **Gesture at it, but be honest about the gesture.** You cannot derive the accumulation-to-threshold model in ten minutes, but your audience (programmers, skeptics) understands signal processing. Use the analogy of averaging random static: if you align random noise waves by their peak and average them, you create a shape that looks like a signal even though none existed. Tell them explicitly: "I'm simplifying the math, but the implication is robust: the RP might be a statistical ghost created by averaging, not a biological cause." This lands harder than pretending you can prove it on a whiteboard.

  **Boundaries to Declare Out Loud**

  At the 35-minute mark, say this: "We are not solving determinism today. We are not discussing quantum mechanics. We are not defining consciousness." Tell them that Libet's experiment is often used as a blunt instrument to smash metaphysical questions it wasn't designed to touch. By carving this out, you protect yourself from the guy who has read every pop-neuroscience book and wants to debate compatibilism.

  **The Closing Question**

  Ask this to test structural understanding rather than philosophical agreement:

  "If the subjective report of when the decision occurred is off by just 200 milliseconds, does the Readiness Potential still reliably precede the conscious choice?"

  This forces them to recall the timing gap (the 500ms RP vs. the 200ms report window) and recognizes that the experiment's conclusion hinges entirely on the precision of that measurement, not the existence of the brain signal itself.
