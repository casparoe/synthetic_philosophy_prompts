answer: |-
  Your friend's analogy of the immovable piece of furniture is apt, and your frustration is entirely understandable. You have stumbled upon one of the most persistent logjams in contemporary political theory. To answer your primary question directly: this is not merely a verbal disagreement, nor is it purely factual. It is a dispute over an **essentially contested concept**, underpinned by divergent bedrock intuitions about the source of moral authority, but disguised as a debate about empirical stability.

  Your working hypothesis is correct in its broad strokes: one side is speaking sociologically (descriptive legitimacy as belief in legitimacy), and the other is speaking philosophically (normative legitimacy as the right to rule). However, simply pointing this out rarely stops the circle, because both sides believe their definition is the *useful* one. The descriptive camp thinks the normative definition is irrelevant to understanding why regimes survive; the normative camp thinks the descriptive definition is morally dangerous because it validates tyranny.

  Here is the diagnosis of the structure of your disagreement, the complications you raised, and a proposal for how to move the furniture.

  ### 1. The Structure of the Disagreement

  You asked whether this is verbal, factual, or intuitive. It is all three, layered like sediment.

  **The Verbal Layer:**
  You are fighting over the territory of the word 'legitimacy'. In the sociological tradition, legitimacy is a property of the *subject's belief*. If the population believes the ruler has the right to rule, they do. In the normative tradition, legitimacy is a property of the *regime's moral status*. A regime can be widely believed to be legitimate and still be illegitimate (e.g., a popular democracy voting for genocide). Until your group agrees to stop using one word for two distinct phenomena, you will talk past one another.

  **The Bedrock Intuition Layer:**
  Beneath the vocabulary lies a clash between **consequentialist** and **deontological** intuitions.
  *   The performance camp operates on a consequentialist intuition: the moral value of power is derived from its outcomes. If the outcome is order and prosperity, the power is justified.
  *   The consent camp operates on a deontological intuition: the moral value of power is derived from the procedure of its acquisition and exercise, regardless of outcomes.
  Neither side can argue for this without begging the question because these are foundational axioms. You cannot prove to a consequentialist that procedure matters more than results without appealing to the value of procedure, which they reject.

  **The Missing Position:**
  You asked if your two-camp description misses something. There is a third position often lurking in these seminars, which I call **Instrumental Normativity**. This position argues that delivering basic goods (security, subsistence, order) is a *moral prerequisite* for any political community. Therefore, a regime that delivers these goods acquires a *normative* claim, not just a descriptive one, because it fulfils the basic duty of the state. This is not just saying "they are stable"; it is saying "they are doing the job a state ought to do, even if they weren't elected." This position bridges the gap but often goes unarticulated, leading the normative camp to dismiss the performance camp as merely descriptive when they are actually making a moral claim about the priority of welfare over will.

  ### 2. Addressing the Complications

  **Complication One: The Empirical Robustness Test**
  Your group is right to wonder if performance legitimacy evaporates during a downturn. However, the inference you draw needs nuance. If legitimacy vanishes the moment growth stalls, it suggests the bond was **transactional compliance** rather than **internalised belief**.
  *   *Transactional Compliance:* "I obey because you pay me." (Stops when payment stops).
  *   *Internalised Belief:* "I obey because you represent the nation/tradition/order." (Persists through hardship).

  The empirical disagreement here is whether authoritarian regimes can convert performance into tradition or nationalism. If a regime survives a downturn by pivoting to nationalist sentiment, the performance was merely the *entry fee* to establish the regime, not the ongoing source of legitimacy. The inconclusive results you mention regarding China stem from the fact that we are observing a hybrid: performance legitimacy is being actively converted into nationalist legitimacy. The test is not just "did they survive the downturn?" but "what mechanism kept them in power during the downturn?" If the answer is "coercion," it was never legitimacy. If the answer is "continued belief," then performance was a catalyst, not the sole substance.

  **Complication Two: The Political Loading of 'Performance'**
  This is the sharper point. To accept the frame of 'performance legitimacy' is to accept a technocratic metric of success. It privileges aggregate GDP over distribution, and order over liberty. As you noted, the migrant worker in Singapore or the petitioner in rural China does not experience the 'performance' in the same way as the urban middle class.
  By framing the debate around 'performance', the descriptive camp implicitly argues that the *aggregate* experience validates the regime. The normative camp objects that legitimacy must be justifiable to *each* subject, not just the average. This is not just a semantic quibble; it is a dispute about **whose consent counts**. If legitimacy is performance-based, the silence of the oppressed can be counted as acceptance. If legitimacy is consent-based, the silence of the oppressed is evidence of coercion. Acknowledging this loading is vital: the debate is not just about how power works, but whose experience of power is deemed politically relevant.

  ### 3. What Counts as Progress?

  Waiting for an economic shock to settle the theoretical debate is a fool's errand. Empirical events are always interpretable through competing theoretical lenses. If the regime collapses, the normative camp will say "I told you so," and the performance camp will say "they failed the performance test." If the regime survives, the performance camp claims victory, and the normative camp says "mere stability is not justice."

  To move the furniture, I suggest the following three steps:

  **A. Disaggregate the Concept**
  Stop trying to define 'legitimacy'. Instead, agree to use three distinct terms for the rest of the term:
  1.  **Justification:** The moral right to rule (Normative camp's territory).
  2.  **Acceptance:** The sociological belief in that right (Descriptive camp's territory).
  3.  **Resilience:** The capacity to withstand shocks without collapsing (The empirical test).
  You can then have productive arguments like: "The regime has high Acceptance and Resilience, but low Justification." This prevents the teflon effect. It forces the performance camp to admit that a regime can be stable but unjust, and the normative camp to admit that a regime can be unjust but stable.

  **B. Shift from 'Is it Legitimate?' to 'What is the Mechanism of Renewal?'**
  This addresses the empirical complication without waiting for a crash. Ask: "When this regime makes a mistake or faces a downturn, how does it repair the breach?"
  *   In a consent-based system, the mechanism is elections or accountability procedures.
  *   In a performance-based system, the mechanism is usually compensatory growth or scapegoating local officials.
  *   In a nationalist system, the mechanism is rallying against external threats.
  Analysing the *mechanism of renewal* is more fruitful than analysing the *state of legitimacy*. It reveals whether the regime relies on transactional buying of affection or deep-seated belief.

  **C. Acknowledge the Normative Stakes of Description**
  The group must admit that using the term 'performance legitimacy' is not a neutral act. It lowers the bar for what we accept as valid rule. It is a political choice to treat stability as a proxy for validity. Once this is on the table, the debate shifts from "who is right about the definition" to "do we want to live in a intellectual framework where stability validates authority?" That is a political question your group can actually answer, whereas the definition of legitimacy is a philosophical knot you may not untie.

  ### Summary Diagnosis

  You are stuck because you are treating a **conceptual stipulation** as a **factual discovery**. The performance camp believes they have discovered a new *fact* about how the world works (authoritarianism works via results). The normative camp believes they are defending a *standard* of how the world ought to be judged (authority requires consent).

  Progress will not come from finding the 'true' meaning of legitimacy. It will come from agreeing that 'legitimacy' is a cluster concept that your group is pulling apart. If you separate **Justification**, **Acceptance**, and **Resilience**, you will find you agree on more than you think: you likely agree that the regimes in question are resilient and enjoy a degree of acceptance, but disagree fiercely on whether they are justified.

  That disagreement is not a confusion to be solved; it is the politics you are there to study. Stop trying to resolve the tension and start analysing why the tension exists. That is where the actual work lies.
