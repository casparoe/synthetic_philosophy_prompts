answer: |-
  **MEMORANDUM**

  **TO:** Committee on Naming and Commemoration
  **FROM:** [Your Name]
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation Regarding Whitcombe Hall

  **Recommendation**
  I recommend that the Committee vote to remove the name "Whitcombe Hall" from the Chemistry Building, effective the start of the next academic year. Simultaneously, we must commission a permanent, publicly accessible archival exhibit detailing E. R. Whitcombe's scientific contributions and his eugenics advocacy, housed within the University Library or a Science History Museum, rather than on the building itself. This course action separates historical record from honorific recognition.

  **The Nietzschean Framework: Utility and Limits**
  Our recent debate has utilized the distinction between three ways of engaging the past: the monumental (inspiring examples), the antiquarian (preserving origins), and the critical (judging to enable growth). Each faction has correctly identified a necessary function of memory, but incorrectly claimed it as the sole authority.

  The framework clarifies that our paralysis stems from an excess of history—the inability to decide because we are overwhelmed by competing obligations to the past. The Removalists are correct that endless litigation exhausts the institution's capacity to move forward. However, the Celebrants and Curators are also correct that erasing the name risks severing our connection to our own origins, however uncomfortable.

  What the framework cannot settle is the moral weighting of Whitcombe's actions. Nietzsche's philosophy describes *how* we use history, not *which* history deserves honor. It tells us that we must judge the past to live, but it does not tell us whether Whitcombe's scientific accomplishments outweigh his human rights violations. That is a normative ethical judgment this Committee must make independently of the philosophical framework. The framework only dictates that once we judge, we must act decisively to restore the institution's capacity for future growth.

  **Defining "For Life" in a Plural University**
  The entire debate turns on what serves the "life" of the university. In a biological organism, life means survival and growth. In a pluralistic university, "life" must mean the capacity of the community to flourish through inquiry and belonging.

  If keeping the name inhibits the ability of current students—particularly those from groups targeted by eugenics—to feel they belong in the sciences, then the name is actively hostile to the university's life. It reduces the "plastic power" of our students, their ability to shape themselves within this institution, by marking them as outsiders in a building named for someone who advocated their sterilization. Therefore, serving "life" requires prioritizing the future flourishing of the current community over the preserved honor of a past benefactor. We cannot claim to serve life while maintaining symbols that deny the full humanity of our members.

  **The Strongest Objection**
  Proponents of keeping the name, particularly those wary of performative ethics, will argue that renaming is a form of moral bookkeeping that allows the university to purchase a clean conscience cheaply. They will contend that scrubbing the name is an easy gesture that distracts from harder work: reforming admissions, funding equity, and curriculum.

  From this view, removing the name risks creating a culture of fragility where any historical imperfection leads to erasure, leaving us with no heroes and no continuity. They will argue that the Curator approach—forcing students to confront the ugliness of the past while retaining the name—is the harder, more educative path. It demands we live with ambiguity rather than resolving it through deletion. This is a serious concern: if we rename every building with flawed benefactors, we may end up with a campus that reflects no history at all, undermining the antiquarian duty to acknowledge where we came from.

  **Why This Recommendation Prevails**
  While the objection above is valid, it conflates *remembering* with *honoring*. We can fulfill our duty to remember Whitcombe's complex legacy without honoring him as a namesake. The proposed archival exhibit satisfies the antiquarian need to preserve origins and the monumental need to study scientific history, without forcing marginalized students to study inside a monument to their own exclusion.

  The paralysis we have suffered for two years proves that the current status quo is unsustainable. The "excess of history" is not the remembering itself, but the inability to settle the question. A final decision restores our plastic power.

  **Implementation Plan and Timeframe**
  To ensure this decision is actionable and final, I propose the following timeline for adoption on Thursday:

  1.  **Vote on Renaming (November):** Upon Committee approval, the recommendation moves to the Provost and Board of Trustees for final ratification by December 1.
  2.  **Naming Process (January–March):** A subcommittee will solicit proposals for a new name, prioritizing figures who exemplify inclusive scientific excellence, with student representation included.
  3.  **Archival Commission (January–June):** The University Archivist will be tasked with curating the Whitcombe exhibit. This must include his chemical patents, his eugenics writings, and the context of the era. Funding for this exhibit should be drawn from the building's endowment, ensuring Whitcombe's money still serves education, even if his name does not.
  4.  **Transition (July–August):** Physical signage will be updated during the summer break. The building will reopen under its new name at the start of the next academic year.

  This path allows us to judge the past critically without forgetting it. It ends the litigation that has drained our energy and allows the university to redirect its focus from debating history to building future.

  **Decision Required**
  I move that the Committee adopt this recommendation and forward it to the Provost with a request for inclusion in the December Board agenda.
