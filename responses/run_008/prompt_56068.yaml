      *   *Philosophical Link:* This aligns with the "Uncanny Valley" or "Perceptual Anthropomorphism" critique in moral status literature. We care about things that look/act like us, not necessarily things that *feel* like us.

  3.  **Identify Counter-Evidence (Where the Film Resists):**
      *   *The Captain:* He regains agency. He isn't "cute" initially, but he becomes morally significant through *action*, not just looks. This suggests agency matters.
      *   *WALL-E protecting Hal:* This implies WALL-E attributes moral status to Hal. Does the film endorse this? Yes, Hal survives and helps.
      *   *The Humans' Redemption:* They aren't discarded. They stand up. They plant the tree. Their moral status is restored through *biological function* (walking, planting), not just cuteness.
      *   *AUTO's Motivation:* AUTO is following A113 (directive). Is he purely malicious? Or a rigid deontologist? If he's just following orders, does he lack moral status or just have conflicting directives?
      *   *WALL-E's "Death":* We mourn him not just because he's cute, but because he has *memory* and *relationships*. The reset wipes his memory. This points to *psychological continuity* as a criterion, not just expressiveness.

