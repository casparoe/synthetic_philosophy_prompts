      *Wait, is there a flaw in (3)?* "The judgment would have occurred exactly as it does whether or not my experience was reddish." If epiphenomenalism is true, the physical state causes the experience. If the physical state is the same, the experience is the same (by supervenience). So the counterfactual "whether or not there was any reddish experience" implies "whether or not the physical cause was present" OR "whether the physical cause was present but failed to produce experience." If the latter, it's a zombie world. In a zombie world, the judgment occurs. So (3) holds *if* Epi is true. So (3) isn't the place to attack if you grant (1).

