      Let's refine the "Cheapest" section. Rejecting (1) is the "Interactionist" move. Rejecting (4) is the "Acquaintance" move. Rejecting (6) is the "Illusionist/Skeptic" move. For someone who wants to keep (1) and (6), (4) is the only logical choice. But is it the *cheapest* overall? Yes, because denying consciousness (6) is more counter-intuitive than denying a specific theory of knowledge (4).

