      *   (3) Counterfactual Dependence: Judgment would be the same without the Phenomenal.
      *   (4) Epistemic Principle: If judgment doesn't depend on fact $p$, it's not knowledge that $p$ (no causal/reliabilist link).
      *   (5) Conclusion 1: Epiphenomenalism implies no knowledge of qualia.
      *   (6) Premise: We *do* know our qualia (Cartesian certainty).
      *   (7) Conclusion 2: Epiphenomenalism is false.

  3.  **Evaluate the Steps (Philosophical Analysis):**

      *   *Step (1):* Standard definition. Hard to reject if you want to be an epiphenomenalist.
      *   *Step (2):* Follows from (1) if judgments are physical events. Materialists accept this.
      *   *Step (3):* Follows from (2). If $P$ causes $J$, and $Q$ (qualia) is causally inert regarding $P$, then $J$ happens regardless of $Q$.
      *   *Step (4):* **The Weak Link.** This is a specific theory of knowledge (Causal Theory of Knowledge or Reliabilism). It says knowledge requires a causal connection or counterfactual dependence between the fact and the belief.
          *   *Why it looks fine:* In ordinary cases (seeing a chair), the chair causes the belief. If the chair weren't there, I wouldn't believe it was. This matches intuition.
          *   *Why it's problematic here:* It assumes *all* knowledge works this way. But introspective knowledge might be different. It might be constitutive, not causal. Or it might be a "direct acquaintance" model.
      *   *Step (6):* **The Other Weak Link.** "I know what my experience is like."
          *   *Why it looks fine:* Cartesian certainty. It seems impossible to be wrong about whether I am in pain.
          *   *Why it's problematic:* If the friend denies this, they are biting a very large bullet.

  4.  **Address Task 1: Which step to reject?**
      *   The standard philosophical move against this specific argument (often attributed to Frank Jackson's "Epiphenomenal Qualia" paper, though Jackson eventually changed his mind) is to reject **(4)**.
      *   *Reasoning:* The causal theory of knowledge is not universally applicable. Introspective knowledge is arguably *non-causal*. The relation between having an experience and knowing you have it is not like seeing a tree; it's more like *being* the tree (metaphorically) or a logical/conceptual truth.
      *   *Why it looked fine:* Because in the *physical* world, knowledge usually tracks causation. We extrapolate this model to the mental domain incorrectly.

  5.  **Address Task 2: Price the Rejection & The Friend's Position.**
      *   *Rejecting (4):* Cost is adopting a non-causal theory of introspective knowledge (e.g., Acquaintance, Constitutive). This saves Epiphenomenalism and Self-Knowledge.
      *   *The Friend's Position (Accept 5, Deny 6):* This is the "Illusionist" or "Hardcore Epiphenomenalist" route.
          *   *Is it embarrassing?* Yes, deeply. If I don't *know* I'm in pain, what does "I am in pain" mean? It leads to skepticism about the very data that motivated the theory of mind in the first place.
          *   *Does he have "knowledge"?* He has physical states that *track* physical states. But he loses the "phenomenal knowledge" (what-it's-like-ness). He reduces self-knowledge to third-person self-monitoring. This undermines the motivation for positing qualia in the first place (if they do nothing and we don't know them, why posit them?). It risks collapsing into Eliminativism.

