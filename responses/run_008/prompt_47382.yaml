answer: |-
  ### The Iterated Dominance Sorting Tree

  This tree sorts positions based on technical and epistemic commitments rather than tribal labels. Follow the path of your agreements to find your leaf.

  **Node 1: Mixed Dominance**
  Does rationality forbid playing a pure strategy if it is strictly dominated *only* by a probabilistic mixture of other strategies (e.g., playing a move that loses to a 50/50 mix of two other moves)?
  *   **No:** → Go to **Leaf A**.
  *   **Yes:** → Go to Node 2.

  **Node 2: Belief Independence**
  When determining if a strategy is dominated, must you assume your beliefs about different opponents' actions are statistically independent (i.e., you cannot believe opponents will correlate their moves without explicit communication)?
  *   **No:** → Go to **Leaf B**.
  *   **Yes:** → Go to Node 3.

  **Node 3: Epistemic Depth**
  Does validating the $k$-th round of strategy elimination logically require assuming that all players hold exactly $k$ layers of mutual belief in rationality (e.g., Round 2 requires "I know that you know that I am rational")?
  *   **No:** → (Theoretical outlier; merge into Node 4).
  *   **Yes:** → Go to Node 4.

  **Node 4: Common Knowledge Coherence**
  Is "Common Knowledge of Rationality" (infinite layers of mutual belief) a logically coherent and necessary requirement for an *ideal* rational agent, regardless of human limitations?
  *   **No:** → Go to **Leaf C**.
  *   **Yes:** → Go to Node 5.

  **Node 5: Definition of Rationality**
  Is "rational play" defined by the output of ideal logic (what a superintelligence would do) or by the actual cognitive capacity of the agent (what a human brain can compute)?
  *   **Capacity (Hardware):** → Go to **Leaf D**.
  *   **Logic (Software):** → Go to Node 6.

  **Node 6: Empirical Falsification (The Traveler's Diagnostic)**
  If a model predicts both players claim $2 in the Traveler's Dilemma but experiments show humans consistently claim near $100, is the model falsified?
  *   **Yes:** → (Merge into **Leaf D** or **Leaf C** depending on Node 4).
  *   **No:** → Go to **Leaf E**.

  ***

  ### The Leaves

  **Leaf A: Mixed-Dominance Skeptics**
  *   **Path:** Node 1 (No).
  *   **Who:** Some evolutionary game theorists, strict finitists.
  *   **Awkward Commitment:** You must defend the rationality of playing a pure strategy that is mathematically guaranteed to yield a lower expected payoff than a randomizing device.

  **Leaf B: Correlated Rationalizability (Epistemic Program)**
  *   **Path:** Node 1 (Yes) → Node 2 (No).
  *   **Who:** Pearce/Bernheim rationalizability proponents, some epistemic logicians.
  *   **Awkward Commitment:** You must allow that players can believe opponents will correlate their strategies against you without any mechanism for communication or shared history.

  **Leaf C: Epistemic Finitists**
  *   **Path:** Node 1 (Yes) → Node 2 (Yes) → Node 3 (Yes) → Node 4 (No).
  *   **Who:** Moderate epistemic game theorists, skeptics of infinite regress.
  *   **Awkward Commitment:** You must assert that there is a specific number of "I know that you know" layers after which the concept of rationality simply ceases to have meaning.

  **Leaf D: Bounded Rationality (Level-k)**
  *   **Path:** Node 1 (Yes) → Node 2 (Yes) → Node 4 (Yes) → Node 5 (Capacity).
  *   **Who:** Behavioral economists, cognitive psychologists.
  *   **Awkward Commitment:** You must admit that a player becomes "more rational" simply by ingesting caffeine or training working memory, rather than by better logical deduction.

  **Leaf E: Iterate-to-End Hardliners**
  *   **Path:** Node 1 (Yes) → Node 2 (Yes) → Node 4 (Yes) → Node 5 (Logic) → Node 6 (No).
  *   **Who:** Standard Nash Equilibrium theorists, classical rationalists.
  *   **Awkward Commitment:** You must insist that claiming $2 in the Traveler's Dilemma is the only rational move, even if you know with certainty your opponent will claim $100 and you will lose money.

  ***

  ### Indistinguishable Positions

  **Flag:** This tree cannot separate **Leaf E (Iterate-to-End Hardliners)** from **Independence-Assuming Epistemic Idealists**.
