      *   *Problem:* Hindsight bias. We know slavery ended. How to make the character's choice feel risky?
      *   *Solution:* Focus on *cost*. If the choice has no real cost, it's not a choice.
      *   *Honor Arc:* He must risk losing his father's love, his wife's status, his club membership.
      *   *Interest Arc:* He must risk bankruptcy, ruin, physical danger from other planters.
      *   *Technique:* Write the *resistance*. The part of him that *wants* to stay complicit. The comfort of the status quo. The "good reasons" to stay.
      *   *Teleology:* Avoid foreshadowing that signals "hero." Signal "fool" or "traitor."

