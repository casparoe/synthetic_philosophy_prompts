          1.  *The Honor-Flip (Appiah/Williams):* Norms die when they shift from honor badges to honor stains. Social status drives the change, not pure moral argument.
          2.  *The Interest-Based (Materialist/Economic):* Norms die when economic interests shift (sugar prices, revolts, brittleness). Moral arguments are post-hoc rationalizations.
      *   **Third Idea (to pressure-test):** Moral revolutions as *narrative events* requiring a "memorable face."
      *   **Specific Question on Craft:** How to write the character arc so the outcome feels *undetermined* from the inside (phenomenological realism) rather than teleological (fated), regardless of which framework is chosen.
      *   **Tone:** Intellectual, rigorous, nuanced, respectful of the craft, avoiding platitudes. The user knows their theory (Appiah, Williams, economic history).

  2.  **Deconstruct the Frameworks (Honor vs. Interest):**
      *   *Honor-Flip (Appiah):* Focuses on *social psychology*. People care about what their peers think. Slavery wasn't "immoral" initially; it was "normal." It became "shameful." Key mechanism: Disgust/Contempt from the reference group.
      *   *Interest-Based (Marxist/Williams/Economic):* Focuses on *material conditions*. Slavery became inefficient/unsafe. Capitalism needed free labor/markets. Key mechanism: Profit/Loss, Security/Threat.
      *   *Agreement:* Both agree that *arguments alone* rarely change minds. Both agree that *social context* matters more than individual conscience. Both acknowledge that "status" is a currency (Honor) and "wealth/security" is a currency (Interest). Often, losing honor *costs* money, and losing money *costs* honor.
      *   *Disagreement:* The *primary driver*. Is it the fear of social ostracization (Honor) or the fear of economic ruin/violence (Interest)?
      *   *Timeline Fit (British Abolition):* This is crucial. 1820s-1830s (Emancipation Act 1833).
          *   *Economic:* Sugar prices were fluctuating. Caribbean soil exhaustion. Haitian Revolution (1791-1804) scared the hell out of planters. Industrial Revolution shifted power to Northern manufacturers who wanted free trade/wages, not plantation monopolies.
          *   *Honor:* The rise of Evangelicalism/Quakers made slavery "ungentlemanly." The Zong massacre (1783) and later propaganda made it visceral. By the 1820s, being a slave owner was becoming socially awkward in London, though still profitable in the colonies.
          *   *Verdict:* It's a hybrid. The economic brittleness made the honor flip *possible*. You can't shame a system that is overwhelmingly profitable and secure. You *can* shame a system that is leaking money and blood.

  3.  **Pressure-Test the Third Idea (Narrative/Face):**
      *   *Idea:* Moral revolutions need a "face" (narrative event).
      *   *Critique:* It's not vanity; it's cognitive science/sociology. Humans think in stories, not statistics. (e.g., Emmett Till, the photo of the Syrian boy, Olaudah Equiano's narrative).
      *   *Risk:* It can feel melodramatic or "Great Man Theory" if not handled well. The "face" shouldn't solve the problem, but *crystallize* the tension.
