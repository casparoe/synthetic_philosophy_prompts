      *   **Reductionism (Humean):** Testimonial justification reduces to perception, memory, and induction. To be justified in believing $p$ based on $S$'s say-so, $H$ must have positive reasons (based on other sources) to think $S$ is reliable regarding $p$.
      *   **Anti-Reductionism (Reidian):** Testimony is a basic source of justification. $H$ is justified in believing $p$ based on $S$'s say-so *unless* there are defeaters. No positive reasons required; the burden of proof is on the skeptic.

