answer: |-
  This is a classic question in political economy, often framed as the "Lee Kuan Yew thesis" (that development requires a strong hand) versus the "Modernization Theory" (that development leads to democracy). Since you're coming from the SSC/ACX tradition, I'll skip the moralizing about human rights and stick strictly to the empirical and mechanistic claims about growth, competence, and stability.

  The flaw in your inference isn't that the examples you cited are wrong—Singapore, China, and the East Asian Tigers *did* grow rapidly under authoritarian or one-party rule. The flaw is in the **statistical distribution of outcomes** and the **mechanism of growth** at different stages of development.

  Here is the "cashed out" objection regarding survivorship bias, variance, and the specific conditions required for autocratic success.

  ### 1. Survivorship Bias and the Variance Problem
  You are looking at the winners of a high-variance lottery.

  If you look at the set of all authoritarian regimes in the last 50 years, the distribution of economic outcomes is extremely wide (fat-tailed).
  *   **The Right Tail:** Singapore, South Korea (under Park Chung-hee), Taiwan (under Chiang Ching-kuo), China (post-1978).
  *   **The Left Tail:** North Korea, Zimbabwe under Mugabe, Cambodia under Pol Pot, Venezuela, the Central African Republic under Bokassa, Mao's Great Leap Forward.

  Democracies, by contrast, have a much narrower distribution. They rarely achieve the explosive 10% growth of a reforming autocracy, but they also rarely suffer catastrophic famines or total economic collapse.

  The inference error is treating the *maximum* possible output of a system as its *expected* value. If you are betting on a country's future, an autocracy is a high-risk, high-reward venture capital bet. A democracy is a bond. If you only look at the VC exits (Singapore), you miss the bankruptcies (Zimbabwe). If your goal is to maximize the *probability* of decent living standards for a random citizen, democracy has historically been the safer bet.

  ### 2. The "Good Autocrat" Problem (Information and Incentives)
  Your argument assumes that authoritarian leaders *want* to grow the economy and *know how* to do it. This is not guaranteed.

  *   **Incentives:** In a democracy, leaders are punished at the ballot box for economic downturns (mostly). In an autocracy, leaders are punished by coups, revolutions, or assassination. This often incentivizes short-term patronage (buying off the military/elites) over long-term growth.
  *   **Information:** As Hayek argued, central planning fails because it lacks local knowledge. A "competent" autocracy like Singapore works because it is a city-state with high feedback loops. The leadership can see the potholes. In a large country, local officials lie to central planners to meet quotas (see: China's GDP data skepticism or the Great Leap Forward falsifications). Democracies have a free press and opposition parties that act as error-correction mechanisms. They are slower, but they detect rot earlier.

  The "competence" you observe in Singapore or China is real, but it is **fragile competence**. It relies on the continuous presence of a technocratic elite that is insulated from corruption. There is no institutional guarantee that the successor to Lee Kuan Yew or Deng Xiaoping will be equally competent. Democracies institutionalize mediocrity to avoid catastrophe.

  ### 3. Catch-Up Growth vs. Frontier Innovation
  This is the most critical economic distinction.

  *   **Catch-Up Growth:** When you are poor, you know what the finish line looks like (industrialization, urbanization, basic manufacturing). You can mobilize capital and labor forcibly, suppress wages, and copy existing technology. Autocracies are excellent at this. They can force savings rates up, build infrastructure without zoning hearings, and move peasants to factories. This explains China 1980–2010 and Korea 1960–1990.
  *   **Frontier Growth:** Once you are rich (near the technological frontier), you cannot copy anymore; you must innovate. Innovation requires the free exchange of ideas, questioning orthodoxy, and creative destruction. These are politically dangerous activities for an autocracy.

  Notice that South Korea and Taiwan **democratized** right as they hit high-income status. They didn't stay authoritarian. The argument that "authoritarianism builds wealth" fails to account that many of these states shed authoritarianism to *sustain* wealth. China is currently testing whether you can innovate at the frontier while maintaining tight political control (the "China Model"). The jury is still out, but the slowdown in productivity growth suggests the "catch-up" engine is running out of fuel.

  ### 4. The Succession Crisis (Time Horizons)
  You mention legitimacy is performance. This is **performance legitimacy**. The flaw is that performance is cyclical. No economy grows forever.

  *   **Procedural Legitimacy (Democracy):** "We lost the election, so we step down." The system survives the downturn.
  *   **Performance Legitimacy (Autocracy):** "We delivered 8% growth, so we rule." What happens when growth hits 0%?

  Autocracies face a massive vulnerability at the moment of succession. Even in China's meritocratic one-party system, factional fighting intensifies as leaders age. In personalist dictatorships, succession is often violent. This creates uncertainty for long-term capital investment. Democracies solve the succession problem boringly and reliably. This stability is a form of economic value that doesn't show up in GDP growth rates but shows up in capital retention.

  ### 5. Scale and Uniqueness
  *   **Singapore:** It is a city-state. Governing Singapore is more like governing a corporation than a country. There are no rural provinces to subsidize, no ethnic separatist movements (that aren't heavily suppressed), and it benefits immensely from being a neutral hub between larger powers. This is not scalable to a population of 1.4 billion.
  *   **China:** China is a historical outlier. It has a 2,000-year tradition of centralized bureaucratic rule (the Mandarinate). Most countries do not have the cultural or institutional software to run a competent one-party state. When Nigeria or Brazil try strongman rule, they don't get Singapore; they get kleptocracy.

  ### 6. Selection Bias on the "Democracies"
  You mention democracies can't build rail. This is true (cost disease). But you are comparing the *best* autocracies to the *average* democracy.

  If you compare the best autocracies (Singapore) to the best democracies (Switzerland, Denmark, Japan in the 80s), the gap narrows. If you compare the average autocracy to the average democracy, democracies win on stability and long-term wealth retention.

  Furthermore, many of the "slow" democracies are slow *because* they are rich. They are already urbanized. Building rail in the US is hard because of property rights and existing density. Building rail in China was easy because the state could relocate millions of people instantly. That is a capability, but it comes with a human cost that eventually creates social friction (which is now appearing in China as youth unemployment and social unrest).

  ### Summary of the Flaw
  The inference flaw is **confusing a specific development phase with a permanent system advantage.**

  Authoritarianism is a potent tool for **mobilization** (moving resources from A to B quickly). It is excellent for industrialization from a low base.
  Democracy is a potent tool for **coordination and innovation** (negotiating complex interests and generating new ideas). It is better for sustaining wealth at the frontier.

  The reason the fastest growers of the last 50 years were often autocracies is that the biggest *gains* to be had were in basic industrialization, which autocracies can force. But if you look at the list of the *richest* countries today (not the fastest growing, but the highest GDP per capita), the vast majority are democracies.

  The "flinch" you perceive isn't people ignoring the data; it's people recognizing that **Singapore is a lucky outlier, not a replicable model.** If you advise a developing nation to "be more like China," they are statistically more likely to become Zimbabwe than Shanghai. If you advise them to "be more like Denmark," they are more likely to achieve stable prosperity, even if they never build a high-speed rail line in 3 years.

  **Legitimacy is not just performance.** It is also resilience. A regime that collapses when growth stops (Arab Spring) has lower legitimacy than a regime that survives a recession because the voters can fire the leaders without burning down the palace.
