      *   **Constraint:** No lectures on what Gould/Lewontin *really* meant. Focus on the internal consistency of the user's package.

  2.  **Deconstruct the User's Six Claims:**
      *   (1) *Pragmatic Adaptationism:* Default to selection for complex functional traits. "Byproduct" claims need positive structural evidence.
      *   (2) *Structuralist Concession:* Agrees with G&L on constraints (allometry, pleiotropy, bauplan). Selection works on jury-rigged material.
      *   (3) *Optimality Test:* Adaptation = matches engineering optimality given tradeoffs. Non-optimal design = evidence against adaptation.
      *   (4) *Exaptation Norm:* Co-option is the norm for interesting traits (e.g., feathers).
      *   (5) *Specific Spandrel Acceptance:* Human chin is a byproduct (mechanical), not an adaptation.
      *   (6) *Methodological Priority:* Nonadaptive hypotheses are nearly unfalsifiable; adaptationist hypotheses get the benefit of the doubt.

  3.  **Identify Potential Tensions (Brainstorming):**

      *   *(1) vs. (2):* If constraints are heavy (2), can we really default to selection (1)? Maybe not a direct contradiction, but a tension in weighting.
      *   *(1) vs. (4):* If co-option is the norm (4), does it make sense to default to *current* utility being the result of *original* selection (1)? Exaptation implies the current function wasn't the selecting force.
      *   *(3) vs. (2):* If design space is constrained/jury-rigged (2), can we expect optimality (3)? Optimality models often assume free parameters. Constraints limit the "available" designs.
      *   *(3) vs. (4):* Exaptation means a trait was built for $X$, used for $Y$. An optimality analysis for $Y$ might fail because it was optimized for $X$. So (3) might falsely reject $Y$ as an adaptation (or exaptation).
      *   *(1) vs. (6):* (1) says demand evidence for byproducts. (6) says nonadaptive hypotheses are unfalsifiable. If they are unfalsifiable, why demand evidence? Or conversely, if they are unfalsifiable, giving adaptation the benefit of the doubt is methodologically necessary but risky.
      *   *(5) vs. (6):* (5) accepts a specific nonadaptive hypothesis (chin). (6) says nonadaptive hypotheses are nearly unfalsifiable. How did you falsify/verify the chin claim if they are unfalsifiable?
      *   *(3) vs. (6):* (3) offers a test (optimality). (6) says nonadaptive claims are unfalsifiable. If (3) works, nonadaptive claims *are* falsifiable (by showing optimality).

  4.  **Select and Rank the Tensions:**

      *   *Severity 1 (Critical):* **(3) vs. (2) & (4).** The Optimality Test vs. Constraints/Exaptation. This is the biggest philosophical hole. If constraints dictate form (2) and traits are co-opted (4), optimality modeling (3) will often yield false negatives. You can't expect engineering perfection on a jury-rigged, co-opted trait.
      *   *Severity 2 (High):* **(1) & (6) vs. (5).** The Methodological Default vs. The Specific Exception. You claim nonadaptive hypotheses are unfalsifiable/hard to prove (6) and adaptation is the default (1), *but* you confidently assert the chin is a spandrel (5). How did you overcome the high bar you set in (6) for this specific case?
      *   *Severity 3 (Medium):* **(1) vs. (4).** Pragmatic Adaptationism vs. Exaptation Norm. If most interesting traits are exaptations, treating them as adaptations (selected *for* current use) is systematically misleading, even if "selection is involved." The definition of "adaptation" gets murky here.
      *   *Severity 4 (Low/Apparent):* **(1) vs. (2).** Pragmatism vs. Structuralism. This is standard "Modern Synthesis" negotiation. Can be resolved by saying selection works *within* constraints.

  5.  **Drafting the Audit (Iterative refinement):**

      *   *Introduction:* Acknowledge the sophistication of the position. It's a "constrained adaptationism" view, common but tricky.
      *   *Tension 1 (The Optimality Trap):* Focus on (3) clashing with (2) and (4).
          *   *Conflict:* Optimality assumes access to design space. (2) says design space is constrained. (4) says history matters (path dependence).
          *   *Resolution:* Loosen (3). Optimality is a null model, not a definitive test.
          *   *Cost:* Weakens your ability to distinguish adaptation from byproduct decisively.
      *   *Tension 2 (The Unfalsifiability Paradox):* Focus on (6) clashing with (5).
          *   *Conflict:* If nonadaptive claims are unfalsifiable (6), how do you know the chin is one (5)?
          *   *Resolution:* Loosen (6). Nonadaptive claims are hard, not impossible. Or specify that (5) relies on specific developmental evidence (satisfying (1)'s requirement).
          *   *Cost:* Admitting (6) is too strong undermines the methodological shield for adaptationism.
      *   *Tension 3 (The Exaptation/Adaptation Slide):* Focus on (1) clashing with (4).
          *   *Conflict:* If exaptation is the norm (4), defaulting to adaptation (1) for "functional traits" mislabels the evolutionary history.
          *   *Resolution:* Distinguish "adaptation" (process) from "adaptedness" (state). Or refine (1) to mean "maintained by selection" rather than "originated by selection."
          *   *Cost:* Semantic precision required; might dilute the punch of "adaptationism."
      *   *Tension 4 (The Evidence Burden):* Focus on (1) vs (6).
          *   *Conflict:* (1) puts burden on non-adaptationists. (6) says their claims are unfalsifiable. If unfalsifiable, burden of proof is moot.
