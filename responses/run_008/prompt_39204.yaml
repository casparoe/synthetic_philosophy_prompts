  7.  **Final Polish:** Ensure the distinction between *origin* and *maintenance* is clear, as that's often where exaptation arguments live. Ensure the "optimality" critique references the "local optimum" vs "global optimum" problem inherent in constraints.

      *(Self-Correction during drafting)*: I initially thought (1) and (6) were in tension. Actually, they support each other. (6) justifies (1). The tension is between (6) and (5). If nonadaptive hypotheses are *nearly unfalsifiable*, how did you falsify the chin adaptation hypothesis? You must have found positive structural evidence. So (5) actually relies on (1)'s criterion ("unless someone brings positive structural evidence"). So (1), (5), and (6) form a triangle. The tension is if (6) is *too* strong. If they are *nearly* unfalsifiable, you need a very high bar. Does the chin evidence meet it? I should frame this as the "Threshold Problem."

      Let's re-evaluate (3). (3) is the weakest link philosophically. Optimality modeling is notoriously vulnerable to the "just-so story" critique if constraints aren't modeled. If (2) is true (constraints are heavy), (3) is methodologically dangerous. This is definitely the #1 tension.

      Okay, ready to write.

