          *   *Cost:* None, this is actually coherent, just needs articulation. (Decided to drop this as a "tension" and treat it as coherent, focusing on the real problems).

      *   *Refining the Ranking:*
          1.  (3) vs (2)+(4) [The Engineering vs. History clash]
