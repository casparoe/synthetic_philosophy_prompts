answer: |-
  **Q&A PREP SHEET: CONDITIONAL AUTHORITY OF ADVANCE DIRECTIVES**
  **To:** Clinical Ethicist
  **From:** Strategy Prep
  **Context:** Ethics Committee Presentation (3 Weeks)

  **Strategy Note:** Your position is a "Golden Mean" between Dworkin (precedent autonomy) and Dresser (current interests). Your vulnerability is the *operationalization* of "evaluative continuity." The committee will not attack the philosophy as much as the *risk* of applying it. Your replies must pivot from "happiness" (which is weak) to "behavioral alignment with specific prior values."

  ---

  ### 1. The Internist (Kantian/Dworkin Defender)
  **Damage Potential:** **Critical.** If he successfully argues that precedent autonomy is the *only* valid model of respect, your "testimonial" view collapses into mere best-interests judgment.
  **Likely Objection:** "You're reducing autonomy to a mood. Dworkin argued that critical interests—those that make a life good *as a whole*—survive incapacity. If I write a directive refusing dialysis because I value independence, and then I get dementia and enjoy being cared for, honoring the directive respects the *narrative integrity* of my life. By making authority conditional on current 'evaluative continuity,' you're saying the demented self can betray the competent self. That's not respect; that's abandonment of the person who wrote the document."

  **2-Minute Reply:**
  "I appreciate the Dworkinian frame, but I'm arguing we can honor the person without treating the directive as a irrevocable command. We distinguish between a *command* issued by an owner to property, and *testimony* given by a witness about what makes life good. A command binds regardless of context; testimony requires the witness to remain credible on the subject.
  If a patient writes an AD refusing feeding tubes due to a value of 'not being a burden,' but later, in dementia, consistently opens their mouth for food and shows distress when feeding stops, they are testifying *now* that sustenance is a good. To ignore that current testimony in favor of the past command is to treat the living patient as a vessel for a ghost. I am not saying the competent self is betrayed; I am saying the competent self's authority was to testify to values, not to legislate for a future self that may no longer recognize those values as theirs. We respect the author by listening to what they valued, but we respect the patient by checking if they still hold that value."

  **Soft Spot:** You still haven't solved the "two selves" problem. If the demented patient lacks the cognitive capacity to understand "burden," can they truly hold the value "not being a burden"? You are attributing complex values to simple behaviors.

  ---

  ### 2. Hospital Counsel
  **Damage Potential:** **Fatal.** Even if the ethics are sound, if this exposes the hospital to liability under the Patient Self-Determination Act (PSDA) or state surrogate laws, the policy cannot be adopted.
  **Likely Objection:** "Statutorily, we are required to honor documented wishes. Your 'lapsing' theory introduces a subjective standard that isn't in the law. If we withhold antibiotics because we think the patient's 'values have shifted,' and the family sues claiming we ignored the AD, how do we document 'vestigial evaluative continuity' in a way that protects the hospital? You're asking us to replace a clear document with a clinical hunch."

  **2-Minute Reply:**
  "I understand the liability concern, and I am not suggesting we ignore the AD. The AD remains the primary evidence of the patient's values. My proposal changes the *interpretive framework*, not the compliance requirement. We document the AD, but we also document the *clinical observation* of the patient's current relationship to those values.
  For example, if the AD refuses 'life prolonging care' based on 'loss of dignity,' and the patient now demonstrates comfort and engagement with care, we document that the *condition* of the directive (the preservation of dignity) is no longer met by the *treatment* (withholding antibiotics). We aren't violating the PSDA; we are fulfilling its intent to ensure care aligns with wishes, recognizing that wishes are expressions of values that can become moot. We would need robust documentation standards—behavioral logs, not just 'she looks happy'—to support the determination that the value is no longer operative."

  **Soft Spot:** There is no legal precedent for "evaluative mootness." Counsel will rightly note that judges love bright lines (signed paper) and hate nuanced ethical distinctions (vestigial values). You are asking them to accept legal risk for ethical precision.

  ---

  ### 3. Patient Advocate
  **Damage Potential:** **High.** This attacks the safety of vulnerable populations. If your standard is vague, it enables the abuse you want to prevent.
  **Likely Objection:** "I've seen families use 'she's not herself' to keep a ventilator on because they aren't ready to let go. Your standard relies on 'behavioral evidence' of values. In a nonverbal patient, isn't 'smiling' or 'not resisting' just the path of least resistance? You're giving clinicians a philosophical loophole to override ADs that refuse treatment. How do you prevent bias against the disabled from dictating what counts as a 'vestigial value'?"

  **2-Minute Reply:**
  "That is my primary fear as well, which is why 'contentment' alone is insufficient. My standard requires *specific* alignment, not general affect. If the AD refuses treatment based on 'fear of dependence,' we need evidence that the patient *recognizes* dependence and accepts it, not just that they aren't fighting.
  We must set a high evidentiary bar: consistent behavioral patterns over time, not single observations. And crucially, the burden of proof lies on those claiming the directive has lapsed. If there is ambiguity, the AD stands. This isn't a loophole for families; it's a safeguard for the patient in the bed to ensure we aren't treating a body that is actively rejecting the care the 'past self' mandated. We protect the vulnerable by ensuring the *current* vulnerable person isn't forced to suffer for a value they no longer hold."

  **Soft Spot:** You admitted your evidentiary standard for nonverbal patients is "embarrassingly thin." The Advocate will press you on what, specifically, counts as evidence in a vegetative or minimally conscious state. "Consistent behavioral patterns" is vague.

  ---

  ### 4. The Chair (Palliative Care Physician)
  **Damage Potential:** **Moderate.** If the process is too burdensome, it won't be used.
  **Likely Objection:** "Directives are often the only tool we have to stop the medical machine when families want everything done. They provide closure. If we tell families, 'This document might not apply if she seems okay with it,' you remove the certainty they need to let go. You're turning a decision aid into a conversation starter, which sounds nice but creates more conflict at the bedside."

  **2-Minute Reply:**
  "I agree certainty is valuable, but false certainty causes more harm. Currently, we tell families, 'We have to follow this paper,' even when the patient in front of us is clearly comfortable. That creates moral distress for the team and confusion for the family who sees the patient 'doing fine.'
  My view shifts the conversation from 'What does the paper say?' to 'What did this paper mean to her, and does it still?' This actually *aids* closure by validating the family's observation that the patient is content, rather than gaslighting them. It allows us to say, 'Her directive shows she feared suffering. She is not suffering. We can honor her by treating this infection.' It makes the AD a tool for understanding, not a gag order."

  **Soft Spot:** It increases the workload on the Ethics Committee. If every "lapsed" AD requires a committee review to verify "evaluative continuity," you will bottleneck the hospital.

  ---

  ### 5. The Chaplain
  **Damage Potential:** **Low-Moderate.** Relational/Spiritual concern.
  **Likely Objection:** "If we say the directive lapses because she has 'new values,' are we implying the soul she had before is gone? We must be careful not to treat the demented patient as a stranger. The directive is a sacred promise made by a whole person."

  **2-Minute Reply:**
  "My intent is the opposite: to honor the sacredness of the person *now* in the bed. Treating the directive as an absolute command risks treating the current body as a shell inhabited by a past ghost. If we believe the person remains, we must listen to how they are speaking now, through their presence and reactions. The 'promise' was to honor her values. If her values have transformed through illness, honoring the *letter* of the promise might break the *spirit* of it."

  **Soft Spot:** Risk of sounding like you are dismissing the "sacredness" of the prior competent self's intentions.

  ---

  ### 6. The Family Member (Widower)
  **Damage Potential:** **Low.** Emotional weight, but less policy influence.
  **Likely Objection:** "You're asking us to decide when my wife is 'really' gone. Her writing said stop. My heart says keep going because she smiles. You're putting me in the position of judging her soul."

  **2-Minute Reply:**
  "You are right, it is an impossible burden. That is why this committee exists—to share that burden. We are not asking you to judge her soul, but to help us understand who she is *now*. The directive tells us who she *was*. You are telling us who she *is*. Our job is to hold both truths without letting one erase the other."

  **Soft Spot:** Emotional resonance of the written word is powerful. "Who she is now" can sound like a justification for ignoring her prior wishes to suit family emotional needs.

  ---

  ### 7. THE DANGEROUS QUESTION
  **Who:** Likely the **Internist** or **Chair**, delivered quietly.
  **The Question:** "You recused yourself from your mother's case, but your theory seems built to justify the decision you *wished* you could have made there. Is 'evaluative continuity' just a philosophical retrofit for a son who couldn't bear to turn off the antibiotics? Are we adopting a policy because it's right, or because it comforts *you*?"

  **Why It's Dangerous:**
  1.  **Impartiality:** It attacks your standing as an ethicist. If your theory is born of personal grief rather than rigorous analysis, it lacks objectivity.
  2.  **The "Humming" Evidence:** It highlights your weakest evidentiary point (your mother's happiness) and suggests you are generalizing a single, emotionally charged anecdote into hospital policy.
  3.  **Motive:** It suggests the policy is designed to alleviate *clinician/family guilt* (the "soft spot" of the Chair's view) rather than protect patient rights.

  **2-Minute Reply:**
  "That is a fair challenge, and I welcome it. I recused myself because I knew my judgment was compromised. I developed this view *after* that recusal, precisely because the existing binary—bind or override—failed me and failed her.
  If this theory were only about my mother, it would be self-serving. But the 'testimonial' model solves the theoretical impasse we face in *many* cases where the patient's current reality contradicts their past instructions. My experience was the catalyst, but the justification stands on the distinction between command and testimony, which applies regardless of my personal stake. I am not asking you to adopt this to comfort me; I am asking you to adopt it because the current framework forces us to choose between honoring a ghost and ignoring a patient. I chose neither then; I want us to have a better path now."

  **Soft Spot:** It is impossible to fully disentangle your philosophy from your trauma. If you sound too defensive, you confirm the bias. If you sound too detached, you seem cold. You must walk the line of "informed by experience, not dictated by it."
