prompt: |-
  I'm doing a term paper for my third-year philosophy of logic course and I've somehow talked myself into the surprise exam paradox (teacher announces "there will be an exam next week and you won't be able to know beforehand which day it's on", student reasons it can't be Friday because by Thursday afternoon they'd know, then not Thursday, etc., and then gets blindsided by the Tuesday exam). We spent about two seminars on it and my tutor basically said the literature is a swamp and left it there, cheers for that.

  What I want to figure out before committing my 4,000 words: of the open questions this thing generates, which ones actually matter most and why. The candidates I can see are something like: (1) locating exactly where the student's elimination argument first goes wrong (is it the very first step about Friday, or does the argument only break once it's iterated backwards?); (2) whether the paradox is really about knowledge specifically or whether belief, or even justified belief, versions work just as well (and whether that tells us the problem is with the announcement, not the reasoning); (3) how it connects to backward induction in game theory -- whether solving one solves the other, or whether they just look similar; (4) whether "surprise" should be read as "not knowable in advance" or "not deducible from the announcement itself", and whether the whole paradox is an artifact of picking the wrong reading; and (5) what it shows about self-referential or self-undermining announcements generally, the way Moore's paradox ("it's raining but you don't believe it") works.

  So my question to you: rank these (or argue that some are pseudo-questions, or that I'm missing the real crux entirely), and defend the ordering. What I care about is the reasoning behind the ranking, not just a list -- for each one, tell me whether other questions in the list secretly depend on it getting settled first, whether it's actually tractable for someone with one term and a decent grasp of modal logic but no proper epistemology background, and what a satisfying answer would even look like (a diagnosis of where the argument fails? a formal result? just agreeing on how to state the announcement?). Also flag anything where the "open question" is basically just people talking past each other with different setups, because if that's the case I'd rather know now than in week 8. If you think two or three of them are worth my 4,000 words and the rest aren't, say that plainly and explain what makes the cut.

  Oh and please write the answer in British English -- my tutor marks us down for American spellings, so "behaviour", "recognise", "artefact" and so on. Thanks!
