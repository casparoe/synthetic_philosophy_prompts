          1.  The Procedure (step-by-step, with pass/fail criteria and judgment flags).
          2.  Application to Case 1: Valuation model (2000 & 2008 bubbles).
          3.  Application to Case 2: Macro model (2021-2023 inflation, 2026 recession prediction).
          4.  Conclusion: Which step fails most often in practice.
      *   **Tone:** Professional, pragmatic, slightly cynical (acknowledging the reality of quant finance), honest about uncertainty ("vibes").

  2.  **Deconstruct the Problem (Retrodiction vs. Prediction):**
      *   Why is retrodiction dangerous? Overfitting, data mining, look-ahead bias, narrative fitting.
      *   Why do we do it? We can't wait 5 years for out-of-sample (OOS) data.
      *   How to mitigate?
          *   Out-of-sample testing (time-series split).
          *   Parameter stability.
          *   Economic rationale (does it make sense *ex-ante*?).
          *   Complexity penalty (Occam's razor).
          *   Stress testing (does it break on *other* crises?).

  3.  **Drafting the Procedure (The "Afternoon Protocol"):**
      *   *Goal:* Filter out curve-fits without killing genuine alpha.
      *   *Structure:* Linear flow, with clear "Stop" signs.
      *   *Steps:*
          1.  **Data Hygiene:** Check for look-ahead bias. (Binary/Arithmetic).
          2.  **Out-of-Time Testing:** Train on old, test on recent (or vice versa). (Arithmetic).
          3.  **Parameter Stability:** Do the coefficients change wildly across regimes? (Arithmetic/Judgment).
          4.  **Economic Intuition:** Would a human have trusted this *before* the event? (Judgment/Vibes).
          5.  **Complexity/Parsimony:** How many degrees of freedom vs. data points? (Arithmetic).
          6.  **The "Unseen" Test:** Apply to a different asset class or geography not used in training. (Arithmetic/Judgment).
      *   *Decision Points:* Pass/Fail/Review.
      *   *Handling "No Track Record":* This is the "Paper Trading" or "Shadow Portfolio" phase.

  4.  **Refining the Procedure (Adding the "Vibes" and "Judgment" labels):**
      *   Need to be explicit about where the math ends and the gut check begins.
      *   Need to address the "Old Evidence" problem directly: We can't update probability on old data, so we treat old data as a *stress test*, not a *validation*.

  5.  **Developing Case 1: Valuation Model (2000 & 2008):**
      *   *Claim:* Flagged Tech Bubble and GFC.
      *   *Scrutiny:* Valuation metrics (CAPE, Yield Spreads) are notorious for timing errors.
      *   *Procedure Application:*
          *   Data Hygiene: Did they use restated earnings? (Common trap).
          *   Out-of-Time: If trained on 1970-1999, does it work on 2010-2020?
          *   Intuition: Valuation predicts *returns*, not *crashes*. Timing is the weak link.
          *   Verdict: Likely fails on parameter stability or timing precision.

  6.  **Developing Case 2: Macro Model (2021-2023 Inflation -> 2026 Recession):**
      *   *Claim:* Explains recent inflation, predicts future recession.
      *   *Scrutiny:* 2021-2023 was a unique supply/shock regime. Fitting this is easy with hindsight (supply chains, fiscal stimulus).
      *   *Procedure Application:*
          *   Data Hygiene: Real-time data vintages? (Crucial for macro).
          *   Out-of-Time: Not enough data.
          *   Intuition: Is the mechanism structural or coincidental?
          *   Verdict: High risk of overfitting a unique regime. Needs shadow trading.

  7.  **Identifying the Failure Point:**
      *   Where do quants/researchers cheat (unconsciously)?
      *   Usually "Economic Intuition" or "Parameter Stability."
      *   Actually, the biggest trap is *Selection Bias* masquerading as Intuition. "I chose this variable because..." (when they actually tested 50 variables).
      *   Let's pinpoint the "Researcher Degrees of Freedom" step.

