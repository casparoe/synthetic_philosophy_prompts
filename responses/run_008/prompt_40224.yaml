answer: |-
  The principle you are looking for is **The Principle of Counterfactual Friction.**

  **The Principle Stated Precisely:**
  A cultural belief or value system exerts genuine causal power only when it imposes a specific cost, constraint, or incentive on an actor that **would not exist** given the material conditions alone, and where the **absence** of that belief would plausibly lead to a different, specific action.

  To pass the test, the explanation must satisfy two conditions:
  1.  **Non-Redundancy:** The value cannot be merely a label for the behavior it purports to explain (e.g., "they industrialized because they were tinkers" is redundant; "they industrialized because their religion forbade usury, forcing capital into machinery" is not).
  2.  **Friction:** The belief must force the actor to overcome a path of least resistance (whether that resistance is laziness, immediate gratification, or pure profit maximization). If the belief aligns perfectly with material self-interest without adding a unique constraint, it is likely decoration.

  ### Applying the Principle to Your Verdicts

  This principle validates most of your instincts but clarifies *why* they hold, and it forces a resolution to your conflict.

  *   **Weber (Ascetic Protestantism $\rightarrow$ Capitalism):** **Causal.** It passes Non-Redundancy. Material conditions alone might have encouraged accumulation, but the *religious anxiety* regarding salvation created a specific friction: it forbade the *consumption* of that wealth. The belief altered the flow of capital in a way pure greed would not (greed often buys luxury; asceticism forces reinvestment).
  *   **Individual Industrialist (Work Ethic $\rightarrow$ Fortune):** **Decoration.** Fails Non-Redundancy. "Work ethic" is often inferred from the fortune itself. It ignores market luck, inheritance, or exploitation. It is a character sketch, not a mechanism.
  *   **Honor/Herding:** **Causal (Conditional).** Passes Friction. When tied to asset vulnerability (cows can be stolen), the belief in honor creates a cost for *not* retaliating (loss of status/security) that overrides the risk of violence. When floating free of material conditions, it fails the test.
  *   **British Tinkering:** **Decoration.** Fails Non-Redundancy. "Tinkering" is often a retrospective label for the successful experiments we know about. It does not explain why tinkering paid off in Britain but not elsewhere without referencing patents, coal, or wages.
  *   **Lutheran Literacy:** **Causal.** Passes Friction. The command to read scripture created a specific incentive (salvation) for a specific skill (reading) that had no immediate material payoff for a peasant at the time.
  *   **Colonial Fatalism:** **Decoration/Pernicious.** Fails Friction. It posits a belief to explain a material outcome (poverty) caused by extraction. It blames the victim for the constraints placed upon them.
  *   **Confucian Exam Ethos:** **Causal.** Passes Friction. The belief system creates a specific social penalty for *not* striving (loss of face, family status) that overrides the desire for leisure.
  *   **Protestant Family History:** **The Conflict.**

  ### The Verdict You Must Give Up

  The Principle of Counterfactual Friction forces you to give up the **asymmetry of your skepticism.**

  You accept the Confucian explanation because you view it from the outside, as a system of constraints (the Exam) that generates behavior (Striving). You bristle at the Protestant family explanation because you view it from the inside, often as a myth of meritocracy that ignores privilege.

  However, if the Confucian ethos is causal, then the Protestant ethos *can* be causal, provided it meets the same mechanistic standards. Your bristling is likely **prejudice**—not because the family story is definitely true, but because you are denying the *possibility* of your own culture acting as a constraint while granting it to others. You are treating your own history as "just luck" and another culture's history as "deep structure."

  **The Correction:** You must accept that your family's Protestant discipline *could* be causal **if** it describes specific frictions (e.g., "We rejected lucrative leisure opportunities due to Sabbath observance, which inadvertently built long-term trust capital"). If the story is merely "We worked hard and got rich," it is decoration, just like the Industrialist case. But your instinct to bristle should not be a blanket rejection of cultural causality in your own lineage; it should be a demand for the same mechanistic rigor you apply to the Confucian case.

  ### Prediction for an Unlisted Case

  **Case:** *The claim that "Silicon Valley's culture of failure" causes higher rates of technological innovation.*

  **Prediction:** According to the Principle of Counterfactual Friction, this explanation is **decoration** unless it can be shown that this culture imposes a specific cost on *not* risking failure.
  *   **Why:** In most of the world, bankruptcy is a stigma that ends a career (Material/Social Constraint). In Silicon Valley, bankruptcy is a badge of experience.
  *   **Causal Condition:** The explanation is valid only if you can show that a specific innovation occurred *because* an entrepreneur took a risk they would have otherwise avoided due to fear of stigma.
  *   **Decoration Condition:** If "culture of failure" is just a label applied to successful companies after the fact, while thousands of failed companies are ignored, it is tautological. The principle predicts the explanation is mostly decoration, used to justify venture capital risk structures, unless specific decisions can be traced to the *removal* of the stigma constraint.

  ### Implications for Your Fiction

  Can you honestly let a character's internalized creed be the cause of her fate? **Yes, but only if the creed costs her something.**

  The Colonial Official fails because he uses belief to explain a *status* (poverty) without a mechanism. The Novelist fails if they use belief to explain a *plot point* without a sacrifice.

  *   **Bad Fiction (Decoration):** "She was a proud woman, so she refused to beg, and thus she starved." (If pride is just a synonym for not begging, this is circular).
  *   **Good Fiction (Causal):** "She was a proud woman. The material incentive was to beg, which would have saved her life. Her creed imposed a psychic cost on begging that outweighed the physical cost of starvation. She chose starvation."

  **The Rule for the Novelist:**
  To avoid being the Colonial Official of your own characters, you must write the **Counterfactual Moment**. You must show the reader the path of least resistance—the bribe, the easy lie, the safe silence—and then show the belief system actively blocking that path.

  If your character's creed merely aligns with what they wanted to do anyway, it is decoration. If the creed forces them to act *against* their immediate self-interest, safety, or desire, it is causality. You are not decorating outcomes; you are dramatizing the friction. That is the only place where belief becomes fate.
