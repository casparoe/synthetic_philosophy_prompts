answer: |-
  # The Math Grad's Ontology Decision Tree
  **Start:** Everyone agrees: *"2+2=4" is objectively true (not just a human convention).*

  ```text
                                    [START]
                                       |
                       Q1: Suppose physics stopped using numbers 
                       entirely tomorrow. Would "2+2=4" still be true?
                      /                                               \
                    YES                                               NO
          (Truth depends on utility)                       (Math is independent of physics)
            /                                                   \
     [LEAF 1]                                                 Q2: When we say "numbers 
  Field-Style                                               exist," is that a deep mystery 
  Fictionalism                                              needing explanation, or trivial?
  (Field: Math is a                                         /                       \
   useful fiction we                                       YES                     NO
   should eliminate)                               (Deep Mystery)            (Trivial Fact)
                                                            /                       \
                                                      Q3: Can we rewrite math       [LEAF 2]
                                                      sentences to be about        Deflationism
                                                      concrete marks/symbols       (Existence is cheap;
                                                      without losing meaning?       no metaphysics needed)
                                                     /                       \
                                                   YES                       NO
                                            (We can paraphrase)      (Committed to abstract objects)
                                              /                               \
                                     [LEAF 3]                                 Q4: Is "3 is prime" true 
                                  Paraphrase                                  outright, or short for 
                                  Nominalism                                  "IF axioms hold, THEN..."?
                                  (Math is about                             /                       \
                                   concrete tokens)                        YES                     NO
                                                                      (Outright True)      (Conditional Truth)
                                                                          /                       \
                                                                        Q5: Does EVERY             [LEAF 4]
                                                                    mathematically consistent   If-Thenism 
                                                                    object exist (e.g. all      (Math is a collection 
                                                                    possible cardinals)?        of conditionals)
                                                                       /                       \
                                                                     YES                       NO
                                                              (Consistency = Existence)   (Only standard math exists)
                                                                  /                               \
                                                         [LEAF 5]                                 Q6: Two set-theoretic 
                                                      Full-Blooded                                definitions of "3" 
                                                      Platonism                                   disagree. Is one wrong, 
                                                      (Lewis/Balasagun)                           or is the question confused?
                                                                                                 /                       \
                                                                                               YES                     NO
                                                                                        (One is the real 3)    (Only structure matters)
                                                                                            /                       \
                                                                                   [LEAF 6]                 [LEAF 7]
                                                                                Plain Platonism           Structuralism
                                                                                (Numbers are              (Numbers are places 
                                                                                 specific objects)         in a pattern)
  ```

  ### Instructor Notes for the Whiteboard

  **1. The "Nobody Defends This" Leaf**
  *   **[LEAF 6] Plain Platonism:** Mark this with a `*`.
  *   **Why:** This is the **Benacerraf Problem**. If numbers are specific objects (like sets), there must be a fact about *which* sets they are. But every candidate definition (von Neumann, Zermelo, etc.) works equally well mathematically yet disagrees on identity (e.g., is $1 \in 3$?). No serious philosopher defends this anymore because it makes mathematical knowledge impossible (how could we know *which* set 3 is?). It is included only to show the trap.

  **2. The "Hard to Distinguish" Leaves**
  *   **[LEAF 4] If-Thenism vs. [LEAF 7] Structuralism:** Flag these with `<->`.
  *   **Why:** For a working mathematician, these often look identical. Both say: "We don't care what numbers *are*, only how they behave." The difference is metaphysical: Structuralists usually think the *structure* itself exists objectively; If-Thenists think math is just valid deduction from arbitrary axioms. In practice, you prove theorems the same way.

  **3. The "Incoherent Path"**
  *   **Path:** Q1(YES) $\rightarrow$ Q5(YES).
  *   **Why:** You cannot claim math depends on physical utility (Field) *and* that every consistent abstract object exists (Full-Blooded). If existence is guaranteed by consistency alone, physics is irrelevant to truth. This combination is unexplored because it is internally contradictory.

  **4. How to Run This**
  *   Don't reveal the leaf names until the end.
  *   Ask the questions verbally. Have students raise hands for Yes/No.
  *   When you hit a leaf, *then* write the "-ism" name on the board.
  *   **Goal:** Show them that their mathematical intuitions *force* them into a philosophical camp, even if they didn't know the names.
