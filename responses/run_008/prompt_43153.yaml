answer: |-
  "Watch that cluster near the north wall," Elena said, tapping the glass. "See how it flinched? The simmball for 'predator' just collided with the boundary symbols. That's why the edge particles scattered."

  Marcus didn't look up from the individual trajectories scrolling on his tablet. "The edge particles scattered because three high-velocity spheres impacted them at forty-degree angles. The 'predator' is a ghost you're painting over the grease stains."

  "It's not a ghost. It's a causal agent. If that cluster hadn't formed, the boundary wouldn't have reacted. The pattern itself is doing the pushing."

  "That's double counting, Elena. You've got a closed physical system. Conservation of energy holds. Every collision is accounted for by mass, velocity, and magnetic charge. If I simulate every ball perfectly, I predict every scatter. What work is your 'simmball' doing? Does it predict a collision my ball-level model misses?"

  "No, it doesn't predict *collisions* your model misses. It predicts *stabilities* your model can't see. Look at that cluster again. It's held its shape for ten seconds."

  "Ten seconds of balls swapping in and out."

  "Exactly. The constituent balls are entirely different now than they were when the pattern started. The 'predator' simmball has shed half its mass and absorbed new spheres from the background noise, yet it still acted as a unit. It maintained its identity despite total material turnover. How do you explain that persistence without invoking the pattern itself?"

  "I explain it by noting that the magnetic fields in that region are conducive to temporary lattice structures. The 'identity' is in your head, not the table. You're treating a waveform like a brick. If I say 'the wave pushed the boat,' I'm speaking loosely. The water molecules pushed the boat. The wave is just a description of how they moved. Here, the balls push the balls. The simmball is just a compression algorithm for observers too lazy to track zillions of vectors."

  "But the system is learning, Marcus. That's the part you're ignoring. Watch the magnetism readings." She pointed to the fluctuating gauge. "Over the last hour, the magnetic drift has adjusted. The balls are becoming stickier in configurations that mirror the outside environment more accurately. The system is tuning itself to maintain those isomorphisms."

  "Tuning itself? Or simply settling into local energy minima?"

  "If it were just energy minima, the clumps would be random. They aren't. They correlate with events outside the glass. When a shadow passes outside, a specific clump forms here. When the shadow leaves, the clump dissolves. The magnetic drift is selecting for *representational fidelity*."

  " 'Representational fidelity' is a semantic term, not a physical one. Physics doesn't care about truth. It cares about force. You're smuggling intentionality into the mechanics. You say the system selects for clumps that 'mirror the outside.' I say the system selects for clumps that are magnetically stable. The fact that stable clumps happen to look like outside events is a coincidence of initial conditions, not a causal power of the symbols."

  "It's not a coincidence if the drift is directional. The magnetism changes *in whatever direction produces better-tracking clumps*. If the outside world changes, the internal magnetic rules shift to match it. You can't describe the direction of that shift without referencing what the clumps are *about*. You need the semantic level to explain the physical adaptation."

  Marcus finally looked up, leaning against the rail. "I can describe the shift in terms of feedback loops. The boundary collisions generate heat; the heat alters magnetic permeability; the permeability changes collision probabilities. It's a loop. Closed. Physical. Where does the 'aboutness' enter the equation? If I remove the outside world entirely, do the balls stop moving?"

  "They'd stop forming *meaningful* patterns."

  "They'd stop forming patterns you can name. They'd still form clumps. You're conflating the map with the territory. You want the simmball to be a cause, but a cause has to be a thing that exists at a specific time and place. Your simmball is a ship of Theseus made of rolling ball bearings. One second it's balls A, B, and C. The next it's B, C, and D. What is the 'it' that is causing the effect? If the cause swaps its parts every few seconds, it's not a cause. It's a narrative."

  "It's a functional cause. Like a software routine. The code runs even if the electrons carrying it are different every cycle. The routine causes the screen to light up. If you say only the electrons cause the light, you lose the explanation for why *this* light and not *that* one. The logic constrains the physics."

  "The logic doesn't constrain anything. The physics constrains the physics. The logic is just how we describe the constraints. Here's the test: Give me a prediction. Tell me something the simmball will do next that I cannot derive from the magnetic states of the individual balls."

  "I predict that if we introduce a noise pattern outside that resembles a predator but isn't one, the simmball will still trigger the boundary defense, even if the physical energy input is lower than a non-predator stimulus. The system reacts to the *pattern*, not just the energy."

  "And I predict I can calculate that false positive using signal-to-noise ratios in the ball collisions. I don't need to know it's a 'predator.' I just need to know it's a high-frequency oscillation."

  "But why is high-frequency oscillation treated as 'predator' and not 'wind'? Because the system has learned a mapping. The selection pressure was based on survival value relative to the outside world. You can trace the physics, Marcus, but you can't explain the *trajectory* of the physics without referencing the meaning."

  "I can explain the trajectory. I just can't explain why you care about it."

  "No, you can't explain the trajectory. Because the physical laws inside the table are changing to accommodate the semantics. The magnetism isn't static. It's evolving to preserve the isomorphism. If you ignore the isomorphism, you can't predict which way the magnetism will drift. You'd expect random drift. But we see directed drift."

  "Directed toward what? Stability. Not truth."

  "Stability *of the mapping*. That's the crux. You think the mapping is projected by us. I think the mapping is causal because the system's physical evolution depends on maintaining it."

  Marcus looked back at the table. A large clump dissolved suddenly, sending a ripple through the center. "The system depends on maintaining energy equilibrium. The mapping is a side effect."

  "The equilibrium is defined by the mapping. If the clumps didn't track the outside, the feedback loop would break, and the magnetism would stabilize differently. The 'aboutness' is the attractor."

  "Then prove the attractor isn't just geometry."

  "I can't. Not without agreeing that geometry can be meaningful."

  Marcus shook his head, watching the balls reassemble. "And I can't agree that meaning can push matter."

  "Then we're stuck."

  "We're stuck," Marcus said. "You see a mind in the machine. I see a machine that looks like a mind."

  "And the difference?"

  "Whether the map is in the territory," Elena said, "or just in the eye."
