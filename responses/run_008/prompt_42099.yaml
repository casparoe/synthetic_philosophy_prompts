  I'm preparing a short position statement on logical uncertainty for a graduate workshop and want a consistency check before I circulate it. Here is the package I currently hold: (1) logical omniscience is a modeling artifact of idealized decision theory, not a rationality ideal — a bounded agent's uncertainty about Goldbach's conjecture is not a rationality failure, and even an ideal reasoner need not be certain of every truth of arithmetic; (2) the probability axioms are non-negotiable as norms: rational credences must assign probability 1 to logical truths and equal probability to logically equivalent propositions; (3) logical uncertainty is not a sui generis phenomenon requiring its own epistemology — the same machinery of credences, conditionalization, and betting ratios handles it as handles ordinary empirical uncertainty; (4) the Dutch book argument is the right foundation for the probability axioms: coherence just is immunity to sure-loss betting strategies; (5) on a concrete case, a rational agent's current fair price for Goldbach's conjecture should lie strictly between 0.01 and 0.99 — dogmatic certainty in either direction is irrational, but so is fifty-fifty indifference. Which of these commitments are genuinely in tension, which merely appear to be, and what is the cheapest way to restore consistency? Please rank the tensions by severity rather than flagging everything equally, say for each what would have to give and what that revision costs elsewhere in the package, and identify the single revision that would clean up the most if I could only make one. End with a final line of the form "Verdict: X", where X names that single revision, or "Verdict: consistent" if the package survives as stated.
