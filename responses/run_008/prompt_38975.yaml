      *   *Critique:* A bit dry. Needs to feel "municipal."
      *   *Attempt 2:* City Maintenance. A structural support beam is failing. It holds up a crowded cafe (5 people) or a solitary archive room (1 person). Shoring it up takes all resources.
      *   *Stage 2:* Zoning laws. Allow high-density (risk to 5) or low-density (risk to 1).
      *   *Refining for "Wince":* In Stage 1, the Utilitarian says "Let the 1 die, we save the 5." The 1 is a city inspector doing their job. The 5 are patrons. The Utilitarian sacrifices the worker for the patrons. That stings.
