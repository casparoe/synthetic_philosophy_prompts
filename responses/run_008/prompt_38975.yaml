          *   *Utilitarian:* Choose P. Saves 5.
          *   *Taurek:* If 5 deaths aren't worse than 1, then the *benefit* of P is not greater than Q. So why spend the money on P? Or, if the budget is limited, you should randomize spending?
          *   *The Trap:* If the City Council adopts Taurek's logic ("Saving 5 isn't better than saving 1"), they cannot justify spending more on high-impact safety measures. They might decide to spread the money thinly to give every building an equal *chance* of being saved, resulting in *more total deaths*.
