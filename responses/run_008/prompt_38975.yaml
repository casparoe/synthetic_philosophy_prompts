      *   *Better Idea for Stage 1:* Focus on the *fairness of chance*. If the 5 have already had many chances or the 1 has had none? No, Taurek is about the moment of decision.
      *   *Let's flip the script on the "Wince":* The prompt asks for the *Utilitarian* to do something students wince at.
