      *   *The "Budget" Trap:* If numbers don't count, then a policy that saves 100 people at \$10k each is not *better* than a policy that saves 1 person at \$10k. But surely a city *should* save 100. If the anti-aggregationist says "No, saving 100 isn't morally superior," they clash with public policy intuition.
