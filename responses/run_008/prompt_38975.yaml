      *   *Wait, I need the Taurek view to lead to a WRONG answer in Stage 2.*
      *   *If Taurek says "5 deaths not worse than 1," then in Stage 2, faced with a budget that can prevent 100 deaths (Project A) or 1 death (Project B) at the same cost, the Taurekist cannot say Project A is better.* They might flip a coin to decide which project to fund. This leads to expected loss of life. That's the "clearly wrong" outcome.
      *   *Connection:* The City Council adopts the "Equal Concern" principle from Stage 1 to justify Stage 2.

  4.  **Polishing the Scenario:**
      *   Make it one paragraph.
