answer: |-
  **The Scenario**

  The City Emergency Council faces a flash flood. A rescue boat has fuel for one trip: to the Apartment Block (5 residents trapped on the roof) or the Gatehouse (1 nightwatchman trapped on the balcony); both locations will be submerged in ten minutes. The Utilitarian Chief orders the boat to the Block, radioing the Gatehouse that his death is "the necessary cost of minimizing loss." The Council adopts the Chief's logic as policy: "Equal concern requires maximizing lives saved." Next month, they vote on the Safety Retrofit Budget. They can fully fund the Block Sprinkler Project (statistically saves 50 residents/year) or the Gatehouse Reinforcement Project (statistically saves 10 workers/year) for the same cost. Consistent with their rescue principle that numbers do not determine moral weight—since 50 deaths are not "worse" than 10, just "more"—they flip a coin to allocate the budget, accepting that their policy will likely result in 40 preventable deaths annually to maintain procedural fairness.

  ***

  **Analysis of Views**

  *   **The Straightforward Utilitarian:** In Stage 1, they save the 5. In Stage 2, they fund the Sprinkler Project. They aggregate value across persons; 5 lives > 1 life, and 50 statistical lives > 10 statistical lives. They avoid the Stage 2 disaster but must own the Stage 1 "wince": telling the nightwatchman his life is mathematically negligible.
  *   **The Taurek-Style Anti-Aggregationist:** In Stage 1, they demand a coin flip. This respects the nightwatchman's claim as equal to any single apartment resident; he is not sacrificed for the sum. In Stage 2, however, their core claim ("50 deaths are not worse than 10") prevents them from prioritizing the Sprinkler Project. To remain consistent with their refusal to aggregate claims, they must treat the two projects as morally equivalent, leading to the coin flip and the preventable deaths.
  *   **The Broome-ish Weighted-Lottery View:** In Stage 1, they run a weighted lottery (5/6 chance for the Block, 1/6 for the Gatehouse). This acknowledges the nightwatchman's claim (he gets a chance) without denying the moral significance of the others' claims. In Stage 2, they fund the Sprinkler Project, recognizing that while no *individual* claim is stronger, the *number* of claims generates a stronger overall reason to act.

  **The Feature Doing the Work**
  The pivot is the shift from **identified victims** (Stage 1) to **statistical lives** (Stage 2). In Stage 1, the anti-aggregationist intuition relies on the "separateness of persons"—the nightwatchman is a specific individual being sacrificed. In Stage 2, the victims are probabilistic. The case forces the anti-aggregationist to apply their "no aggregation" rule to policy, where ignoring numbers leads to catastrophic inefficiency that violates the very "concern for individuals" they championed in Stage 1.

  **The Best Taurekian Escape Move**
  The Taurekian should argue: **"Aggregation is permissible for ex ante risks, but not ex post rescue."** They can claim that in Stage 2, no specific person is doomed yet; we are merely reducing risks for everyone. Therefore, we can maximize risk-reduction (save the 50) without violating anyone's specific claim to be saved, because no one has a claim to *safety*, only a claim to *equal consideration* in the face of doom. In Stage 1, the doom is certain for one group, triggering the non-aggregation constraint.

  **The Cost of the Escape**
  This move concedes that **numbers count when identities are unknown.** This undermines the Stage 1 intuition. If the moral force of "five vs. one" depends on whether we know their names or faces, morality becomes epistemically contingent. It suggests the nightwatchman in Stage 1 would have been saved if the flood were happening next year (statistical) rather than tonight (identified), which makes the right to life depend on the timing of the bureaucracy rather than the value of the person.
