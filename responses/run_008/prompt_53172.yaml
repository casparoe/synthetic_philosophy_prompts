answer: |-
  Here is a complete lesson plan designed for your 90-minute seminar. It is structured to let the mechanics of the game generate the philosophical problems organically, saving the theoretical labeling for the debrief.

  # Lesson Plan: The Utopia Simulation
  **Topic:** Decision Markets vs. Voting (Futarchy)
  **Time:** 90 Minutes
  **Class Size:** 16 Students
  **Materials:** Deck of cards, printed "Private Signal" slips, "Course Credit Tokens" (CCT), whiteboard.

  ## I. Preparation & Materials

  1.  **The "Truth" Deck:** Take 10 Red cards and 10 Black cards. Shuffle them.
      *   **Red = Policy Alpha is objectively better.**
      *   **Black = Policy Beta is objectively better.**
      *   *Prep:* Before class, draw one card. This determines the "True State of the World" for today. Keep it secret. (Let's assume for this plan you drew **Red/Alpha**).
  2.  **Private Signals:** Prepare 16 slips of paper.
      *   **12 "Citizen" Slips:** These should mostly align with the Truth. If Truth is Alpha, 9 slips say *"Evidence suggests Alpha,"* 3 slips say *"Evidence suggests Beta."* (75% accuracy signal).
      *   **4 "Stakeholder" Slips:** These say *"You represent the Alpha Industrial Lobby. Your bonus depends on Alpha being chosen."* (Do not label them "Stakeholder" on the slip; just give the instruction).
  3.  **Currency:** 100 "Course Credit Tokens" (CCT). Can be physical chips or tally marks.
      *   **Exchange Rate:** 10 CCT = 1 point of extra credit (or equivalent value in candy/swag).
  4.  **The Market Board:** Draw two columns on the whiteboard: **Asset A** and **Asset B**.
      *   Create a price ledger under each (0.00 to 1.00).

  ## II. Timeline (90 Minutes)

  | Time | Phase | Activity |
  | :--- | :--- | :--- |
  | **00-10** | **Setup** | Distribute signals & currency. Explain the "Crisis." |
  | **10-25** | **Phase 1** | **Democratic Voting.** Secret ballot on Policy. |
  | **25-30** | **Transition** | Tally votes. Announce winner. Reset currency. |
  | **30-60** | **Phase 2** | **Prediction Market.** Trading on policy success. |
  | **60-70** | **Settlement** | Reveal the "Metric/Proxy" rule. Pay out tokens. |
  | **70-90** | **Debrief** | Connect game mechanics to Futarchy theory. |

  ## III. Game Rules & Script

  ### 1. Setup (0-10 mins)
  **Script:** "Today we are the government of the Republic of Utopia. We face a crisis requiring one of two policies: **Alpha** (Strict Regulation) or **Beta** (Deregulation). Only one can be enacted.
  *   **Your Goal:** Maximize your Course Credit Tokens (CCT).
  *   **Your Information:** You have a private slip. Do not show it to anyone. It represents your research into which policy is *objectively* better for the nation.
  *   **The Metric:** The national goal is **'Long-Term Prosperity.'**
  *   **Endowment:** Everyone receives 5 CCT to start."

  *(Distribute the 12 Citizen slips and 4 Stakeholder slips randomly. Ensure the Stakeholders know their goal is Alpha, but keep their identity secret from the class.)*

  ### 2. Phase 1: Democratic Voting (10-25 mins)
  **Rule:** "We will first govern by majority vote. Raise your hand for Alpha or Beta. The majority wins. If you voted for the *Objectively Better* policy (which I know, and you have signals about), you earn **2 CCT**."

  *   **Action:** Take the vote. Record the result.
  *   **Payoff:** Reveal the "Truth" card (e.g., Alpha). Pay the 2 CCT to those who voted correctly.
  *   **Pedagogical Hook:** If the "Stakeholders" vote Alpha, and the signals are noisy, the vote might go Alpha even if Beta was true (or vice versa). Discuss briefly: "Did the majority find the truth? Why or why not?" (Keep this brief; save the theory for later).

  ### 3. Phase 2: The Market (30-60 mins)
  **Script:** "Voting is messy. For the next round, we are trying a new system. We will still vote on the *Value* (which policy to pick), but we will use a market to decide the *Belief* (whether it will work).
  *   **The Vote:** We vote again. The winner is the 'Active Policy.'
  *   **The Market:** There are two assets: **Share A** and **Share B**.
  *   **Conditionality:** Only shares of the *Active Policy* will pay out. Shares of the losing policy are void (worth 0).
  *   **Payout Rule:** An Active Share pays **10 CCT** if the Policy is deemed **'Successful.'**
  *   **Success Definition:** *'A policy is Successful if the Market confidently predicts it will be.'* Specifically: **If the final trading price of the Active Asset is ≥ 0.50 CCT, the policy is Successful.**"

  *(Note: This is the critical "Self-Referential" trap. The market price does not predict an external fact; it determines the fact.)*

  **Trading Mechanics:**
  *   You (Instructor) act as the Market Maker.
  *   Students shout bids/offers or raise hands to trade with the "Bank" (you) at the current price.
  *   Update the whiteboard price after every trade.
  *   **Time Limit:** 20 minutes of active trading.

  **What will happen:**
  1.  **Citizens** will trade based on their private signals (e.g., "Alpha is true, I'll buy Share A").
  2.  **Stakeholders** (the 4 students) *must* ensure Alpha wins and succeeds. They will aggressively buy Share A to drive the price up.
  3.  **Discovery:** Astute students will realize that buying Share A *increases the price*, which *guarantees the payout*. They are not predicting success; they are manufacturing it.
  4.  **The Metric Gap:** They are trading on "Price > 0.50," not on "Long-Term Prosperity." The metric (Prosperity) has been replaced by the proxy (Price).

  ### 4. Settlement (60-70 mins)
  1.  **Hold the Vote:** Determine the Active Policy (likely Alpha, due to Stakeholders).
  2.  **Freeze the Market:** Record the final price of the Active Asset.
  3.  **The Reveal:**
      *   If Price ≥ 0.50: Declare the policy "Successful." Pay 10 CCT to all holders of the Active Asset.
      *   If Price < 0.50: Declare "Failure." Pay 0.
  4.  **The Twist:** Ask the class: "Did this price reflect the *truth* about Prosperity, or did it reflect your ability to manipulate the payout rule?"
      *   Reveal the Stakeholders' identity now.
      *   Reveal that "Long-Term Prosperity" was never measured; only the Price was measured.

  ## IV. The Debrief (70-90 mins)

  **1. Introduce the Term:**
  "Now we can name this. This system is **Futarchy**, proposed by Robin Hanson. 'Vote on Values, Bet on Beliefs.'"

  **2. Map the Game to Theory:**

  *   **Phase 1 (Voting) → Epistemic Democracy:**
      *   *Claim:* Condorcet's Jury Theorem. If voters are better than random (>50% accuracy), majority rule finds the truth.
      *   *Game Data:* Look at the Phase 1 vote. Did the majority match the Truth Card?
      *   *Problem:* Rational Irrationality. Why vote correctly if your vote doesn't matter? (In the game, they voted for tokens, but in reality, they vote for identity).

  *   **Phase 2 (Market) → The Epistemic Superiority Claim:**
      *   *Claim:* Markets aggregate dispersed information better than votes. Prices reflect probability.
      *   *Game Data:* Did the price converge to 1.00 (certainty) or 0.50 (noise)?
      *   *Problem:* **Manipulation.** The Stakeholders had an incentive to distort the price. Hanson's reply is that manipulators provide liquidity for informed traders to profit from. *Did that happen?* In a thin classroom market, manipulators can overwhelm informed traders (unlike in deep financial markets).

  *   **The Settlement Rule → Self-Referential Markets:**
      *   *Claim:* Markets predict outcomes.
      *   *Game Data:* The payout depended on the *price itself*.
      *   *Problem:* **Reflexivity.** In real futarchy, if the market says "War leads to Growth," and we start a War to capture the growth, the market is causing the outcome. In the game, buying the asset *made* it successful. This highlights the danger of optimizing for a metric that the market can influence.

  *   **The Metric → The Principal-Agent Problem:**
      *   *Claim:* We vote on a "National Welfare Metric."
      *   *Game Data:* The metric was "Prosperity," the proxy was "Price."
      *   *Problem:* **Goodhart's Law.** When a measure becomes a target, it ceases to be a good measure. Who defines "Prosperity"? In the game, I (the Instructor) controlled the proxy. In reality, who guards the guardians of the metric? If the metric is GDP, traders might bet on policies that boost GDP but destroy the environment.

  **3. Acknowledge Limitations (Honesty Check):**
  *   **Stakes:** These were course tokens, not life savings. Real futarchy requires "skin in the game" to deter noise trading.
  *   **Liquidity:** 16 students is not a liquid market. Real futarchy relies on global capital to absorb manipulation.
  *   **Time:** We settled in 90 minutes. Real policy outcomes take years. This creates a "horizon problem" where short-term market gains override long-term welfare.

  ## V. Contingency Planning: What Will Go Wrong

  **1. The Market Freezes (No Trading)**
  *   *Risk:* Students are shy or don't understand how to bid.
  *   *Fix:* You must act as an active Market Maker. If no one bids, *you* propose a price. "I will buy Share A at 0.20. Anyone sell?" This jumpstarts liquidity.
  *   *Prep:* Have a "Minimum Activity" rule. "If fewer than 10 trades occur, the market is void." This pressures them to participate.

  **2. The "Stakeholders" Are Too Obvious**
  *   *Risk:* The 4 students openly collude to pump Alpha.
  *   *Fix:* Instruct the Stakeholders *before class* or via a sealed note to be subtle. Tell them: "If you are too obvious, the other students will short you and you will lose your bonus." This forces them to mimic informed trading rather than blatant manipulation.
  *   *Backup:* If they are too obvious, use it in the debrief. "In a real market, anonymity is harder to maintain. How does transparency affect manipulation?"

  **3. Students Miss the "Self-Referential" Trap**
  *   *Risk:* They think the price predicted the truth, not created the payout.
  *   *Fix:* During the Settlement phase, ask: "If I had set the threshold at 0.80 instead of 0.50, would the price have been different?" (Yes, they would have had to bid higher). "So the price wasn't finding a truth; it was hitting a target I set."

  **4. Time Overrun**
  *   *Risk:* Trading drags on.
  *   *Fix:* Use a visible timer. Announce "2 minutes remaining" and "30 seconds remaining." At 0:00, trading stops instantly. The last posted price is the settlement price. This mimics market close volatility.

  **5. Ethical Concerns on "Lying"**
  *   *Risk:* Students feel cheated by the Proxy/Price rule.
  *   *Fix:* Frame the deception as part of the simulation of *information asymmetry*. In the debrief, apologize for the subterfuge but emphasize that in real politics, the gap between "National Welfare" and "GDP" is often just as hidden. Ensure everyone gets at least a participation token so no one loses credit due to the game mechanics.

  ## VI. Instructor's Cheat Sheet (The "Truth")

  *   **True State:** Alpha (Red Card).
  *   **Citizen Signals:** 9 Alpha, 3 Beta.
  *   **Stakeholder Goal:** Alpha wins + Price > 0.50.
  *   **Settlement Threshold:** 0.50 CCT.
  *   **Key Debrief Question:** "If the market price determines the success, what is the market actually measuring? Is it measuring the world, or is it measuring itself?"

  This design ensures they feel the *temptation* of futarchy (the market felt more dynamic than the vote) and the *peril* (they could game the metric) before they ever read Hanson's papers.
