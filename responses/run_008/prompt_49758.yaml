  *(Final check on numbers)*: 45 days = 8 books/year. 4 books/year = 1 every quarter. This is a 50% reduction in velocity for the rapid releasers, but still aggressive for traditional. It seems like a fair "cap."
  Enforcement: 3 strikes? Or immediate expulsion? The prompt mentions "enforced by expulsion." Let's make it a violation of membership terms leading to removal from the promo pool, then expulsion.
