answer: |-
  This is a fantastic set of questions. You have put your finger on one of the most famous and debated cruxes in Plutarch scholarship. The passage you are referring to (roughly chapters 9–10 of the *Life of Pericles*) is where Plutarch transitions from Pericles the political strategist to Pericles the builder, and it is precisely where the moral ambiguity of democratic leadership comes into focus.

  Your group's discussion likely stalled because Plutarch is doing something here that feels alien to modern historical expectations. He isn't trying to establish "what happened" so much as "how do we judge a great man when his actions straddle the line between virtue and vice?"

  Here is a breakdown of your three questions, followed by the comparison with Antony.

  ### 1. Is Plutarch special-pleading for Pericles?

  It looks like special pleading to a modern historian, but to Plutarch the moral philosopher, it is a principled methodological choice.

  Plutarch's project in the *Parallel Lives* is not to write objective history (he explicitly disclaims this in the *Alexander* preface, as you noted). His goal is **ethical modeling**. He is holding up mirrors for statesmen and citizens to examine their own characters. If he presents Pericles—a man he considers one of the pinnacle examples of Greek virtue—as a cynical demagogue who bought the vote, Pericles ceases to be a usable model of *magnanimity*.

  However, Plutarch is too honest to ignore the accusation. The charge of demagoguery (championed historically by Pericles' rival, Thucydides son of Melesias, not the historian) was famous. Plutarch cannot delete it without damaging his credibility.

  So, what is he doing? He is applying a **hermeneutic of charity based on outcomes and demeanor.**
  *   **Outcomes:** Plutarch argues that if the money had simply been squandered on feasts, it would be bribery. But because it was spent on "eternal monuments" (the Parthenon, the Propylaea), the city itself was ennobled. The end result justifies the means.
  *   **Demeanor:** Plutarch spends the earlier chapters establishing Pericles' *aphrosynē* (aloofness). Pericles didn't mingle in the markets; he didn't laugh with the crowd; he spoke rarely. A true demagogue (in the ancient negative sense) typically panders and flatters constantly. Plutarch argues that Pericles' general distance from the people proves he wasn't *trying* to curry favor, even if the effect of his policy was popular.

  He isn't refusing to adjudicate; he is adjudicating based on **intent inferred from the whole life**, rather than the isolated act. He is teaching the reader that you cannot judge a statesman's virtue by a single policy, but by the totality of their character.

  ### 2. Why is the "Unemployment/Job Creation" reading a slur?

  This is the hardest part for modern readers to grasp because we view state employment as a social safety net. In the ancient aristocratic worldview Plutarch inherits, it is more complicated.

  The "Aristotle" reference you recall is likely from the *Constitution of the Athenians* (attributed to Aristotle's school), which argues Pericles turned the people from "self-sufficient" to "dependent."

  **The Problem of Dependency:**
  To Plutarch, a free citizen (*polites*) should be motivated by honor (*philotimia*) and love of the city, not by wages. When the state pays citizens to serve on juries or attend festivals, there is a fine line between compensating them for civic duty and turning them into wage-laborers of the state.
  *   **The "Nurse" Analogy:** This is the key image. A nurse stuffing a child with sweets is not feeding the child for health; she is feeding the child to stop it from crying. It implies the people are irrational, childish, and easily pacified.
  *   **The Threat to *Scholē* (Leisure):** In the ancient view, the ideal citizen has enough private wealth to be independent, allowing them the *leisure* to think about politics. If the state must pay you to participate, you are effectively a dependent client of the state.
  *   **The "Aristotle" Charge:** The specific charge isn't just "he created jobs." It is "he made them idle and talkative." By giving them public money, Pericles allegedly encouraged a culture where citizens expected to be paid for everything, leading to a litigious society (suing for profit) and a demand for endless festivals rather than serious governance.

  So, when Plutarch rejects the "unemployment" reading, he isn't rejecting job creation. He is rejecting the idea that Pericles' **motive** was to pacify a restless mob.
  *   **Charitable Reading:** Pericles wanted to beautify Athens and give the poor a share in the city's glory through labor (building temples).
  *   **Uncharitable Reading:** Pericles wanted to buy the silence of the poor so the elite wouldn't overthrow him.

  Plutarch prefers the former because it treats the poor as **partners in glory**, whereas the latter treats them as **problems to be managed.**

  ### 3. How does this function as Biography? (And the Antony Comparison)

  You asked: *If the outward acts admit of two opposite interpretations and Plutarch just picks one, what exactly have we learned about Pericles the man?*

  We have learned about **Pericles' restraint.**

  Plutarch is showing us that Pericles wielded a tool (public distribution) that was inherently dangerous and prone to corruption, yet he managed to keep it virtuous. The tension *is* the lesson. If it were obviously virtuous, there would be no test of character. If it were obviously corrupt, he would be a villain. The fact that it *could* be seen as corruption, but wasn't (in Plutarch's view), highlights Pericles' unique ability to lead the people without being led by them.

  **The Comparison with Antony:**
  Your observation about the *Life of Antony* is spot-on and gets to the heart of Plutarch's moral system. Both men used resources to please the masses, but Plutarch judges them differently based on **Order vs. Chaos** and **State vs. Self.**

  *   **Pericles' Spending:**
      *   **Source:** Public tribute (allied funds), managed through the state treasury.
      *   **Destination:** Public works (Temples, walls) that endure after his death.
      *   **Goal:** To make Athens great, not just to make Pericles popular.
      *   **Result:** The people were elevated; the city was beautified.
      *   **Character:** Stoic, distant, disciplined. He gives the people money, but he denies them his personal presence.

  *   **Antony's Spending:**
      *   **Source:** Often plunder, or misappropriated state funds, or personal wealth mixed with public.
      *   **Destination:** Feasts, games, gifts to soldiers and friends, indulgences for Cleopatra.
      *   **Goal:** To secure personal loyalty and indulge immediate appetites.
      *   **Result:** The people were fed, but morally degraded; the state was weakened.
      *   **Character:** Dissolute, accessible, emotional. He gives the people money *and* debases himself to be their companion.

  For Plutarch, **generosity without discipline is not virtue; it is prodigality.** Pericles' distributions were part of a grand, rational plan for the city's eternity. Antony's distributions were reactive, emotional, and served his own immediate political survival or pleasure.

  ### Summary for your Reading Group

  If I were to synthesize this for your session, I would suggest framing the passage not as a historical inconsistency, but as a **moral case study.**

  1.  **On the Demagoguery:** Plutarch isn't hiding the charge; he's showing that Great Men often have to use dangerous tools. The mark of Pericles' virtue is that he used a tool of corruption (bribes) for a purpose of glory (architecture).
  2.  **On the Unemployment:** The ancients feared making citizens "wage-earners" of the state because it compromised their freedom. Plutarch defends Pericles by arguing he made them *builders*, not just *recipients*.
  3.  **On Biography:** The ambiguity forces *us* (the readers) to practice judgment. We have to look at the whole life to see that Pericles wasn't flattering the people (he rarely saw them), whereas Antony was.

  Plutarch is essentially asking: *Can you use populist means for aristocratic ends?* His answer for Pericles is "Yes, if you have the character to restrain it." His answer for Antony is "No, because your character will be consumed by it."

  That distinction is what makes Pericles a "Life" to be emulated and Antony a "Life" to be warned against.
