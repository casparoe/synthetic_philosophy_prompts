      *   Even stronger: If A counts chicken deaths because they are "slaughtered for food," B argues that crop deaths are "slaughtered for food" indirectly. The causal chain is identical.
      *   Best argument strategy: **The Consistency Trap.** If A accepts that preventing death is good, A must account for *all* deaths caused by the action. If A excludes wild deaths, A is engaging in speciesism or spatial bias, which contradicts the utilitarian premise of impartial counting of suffering/death.
