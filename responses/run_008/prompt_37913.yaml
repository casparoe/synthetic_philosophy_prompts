answer: |-
  # The Grocery-Store Dilemma: A Thought Experiment

  **The Scenario**
  Two hedonic utilitarians, Alice and Bob, stand in the meat aisle. Both agree that the moral goal is to minimize the total number of deaths caused by their food choices. Both agree that one death counts as one unit of badness, regardless of the duration or intensity of the life lost (a "death-counting" metric). They differ only on the *scope* of counting.

  *   **Alice (The Narrow Counter):** Counts only animals slaughtered specifically for food (chickens, cows, pigs). She excludes wild animals killed during crop cultivation.
  *   **Bob (The Broad Counter):** Counts food animals *plus* wild animals (vertebrates and invertebrates) killed during the tilling, spraying, and harvesting of feed crops.

  They must decide on a single ordinary decision: Should a consumer switch from eating **25 kg of chicken per year** to **25 kg of beef per year**?

  **The Stipulated Parameters**
  To ensure the arithmetic is transparent, we stipulate the following round numbers as facts for this world:
  1.  **Consumption:** 25 kg of meat per year.
  2.  **Yields:** One chicken yields 1.5 kg of meat; one cow yields 200 kg of meat.
  3.  **Feed Conversion:** Chicken requires 2 kg of feed per 1 kg of meat. Grain-finished beef requires 8 kg of feed per 1 kg of meat.
  4.  **Feed Source:** 100% of chicken feed is row crops. For beef, 50% of feed is row crops; the rest is pasture/inedible byproducts (which cause no crop-field deaths).
  5.  **Wild Mortality Rate ($T$):** There are $T$ wild animal deaths per **tonne** of row crop harvested.
  6.  **Value:** 1 Death = 1 Unit of Badness.

  ---

  ### 1. The Calculations

  **Alice's Calculation (Food Animals Only)**
  Alice ignores crop deaths ($T=0$). She counts only the slaughtered livestock.
  *   **Chicken Option:** $25 \text{ kg} \div 1.5 \text{ kg/chicken} = 16.67$ chickens.
  *   **Beef Option:** $25 \text{ kg} \div 200 \text{ kg/cow} = 0.125$ cows.
  *   **Verdict:** $0.125 < 16.67$. Switching to beef prevents ~16.5 deaths.
  *   **Conclusion:** **Switch to Beef.**

  **Bob's Calculation (Food + Wild Animals)**
  Bob includes the wild deaths caused by the row-crop portion of the feed.
  *   **Chicken Feed:** $25 \text{ kg meat} \times 2 \text{ kg feed} = 50 \text{ kg feed} = 0.05 \text{ tonnes}$.
  *   **Beef Crop Feed:** $25 \text{ kg meat} \times 8 \text{ kg feed} \times 50\% \text{ crops} = 100 \text{ kg feed} = 0.10 \text{ tonnes}$.
  *   **Chicken Total Badness:** $16.67 \text{ (chickens)} + 0.05T \text{ (wild)}$.
  *   **Beef Total Badness:** $0.125 \text{ (cow)} + 0.10T \text{ (wild)}$.
  *   **Verdict Condition:** Bob concludes the switch *increases* suffering if Beef Badness > Chicken Badness.
      $$0.125 + 0.10T > 16.67 + 0.05T$$
  *   **Conclusion:** **Depends on $T$.**

  ---

  ### 2. The Threshold ($T^*$) and Real-World Meaning

  To find the point where Bob's verdict flips against Alice's, we solve for $T$:

  $$0.10T - 0.05T > 16.67 - 0.125$$
  $$0.05T > 16.545$$
  $$T > 330.9$$

  **The Threshold:** $T^* \approx 331$ deaths per tonne of feed.

  **Plain Terms Interpretation:**
  For Bob to be right (that beef is worse than chicken), the harvesting of feed crops must kill more than **331 wild animals per tonne of grain**.

  To visualize this, assume a typical grain yield of **10 tonnes per hectare**.
  $$331 \text{ deaths/tonne} \times 10 \text{ tonnes/hectare} = 3,310 \text{ deaths per hectare per harvest.}$$

  **What must the world be like?**
  If we count only mammals and birds (mice, voles, pheasants), this number is impossibly high. A hectare might host a few dozen nesting birds or small mammals; it does not host 3,000 that die every harvest.
  For $T$ to exceed 331, **invertebrates must be counted.** A single hectare of soil contains millions of earthworms, insects, and arachnids. Tilling and pesticide application kill a significant fraction of these. If Bob's moral circle includes insects and worms, $T$ easily exceeds 331. If Bob's moral circle stops at vertebrates, $T$ remains well below 331, and Bob must agree with Alice. The verdict turns entirely on whether the death of a field insect counts as a unit of badness equal to the death of a chicken.

  ---

  ### 3. Sensitivity Analysis: The Critical Parameter

  The parameter doing the most work is not the yield of the animals, but the **crop-share of beef feed (stipulated at 50%)**.

  The "flip" occurs because beef requires *more* crop feed than chicken in this specific model (0.10 tonnes vs 0.05 tonnes). This creates a "wild death debt" that beef must pay.
  *   **Chicken Crop Load:** 0.05 tonnes/year.
  *   **Beef Crop Load:** 0.10 tonnes/year.
  *   **Marginal Cost:** The switch adds 0.05 tonnes of crop demand.

  If the crop-share of beef feed were lower, the gap would shrink. If beef were **100% grass-fed** (0% row crops), the crop load would be 0. In that case, Bob's equation becomes $0.125 + 0$ vs $16.67 + 0.05T$. Beef would *always* be better, regardless of how many insects die in chicken feed.

  **Variation Limit:**
  The flip disappears entirely if the beef crop load drops to match the chicken crop load (0.05 tonnes).
  Since total beef feed is 200 kg (0.2 tonnes), the crop portion must be 0.1 tonnes to hit the 50% mark. If the crop portion falls below **25% of total beef feed** (0.05 tonnes), the switch to beef reduces *both* food animal deaths and wild animal deaths. At that point, Alice and Bob agree. The 50% stipulation is the pivot point that allows the wild deaths to outweigh the saved farm animals.

  ---

  ### 4. The Broad Utilitarian's Reply

  Alice rejects Bob's conclusion, insisting that wild field deaths are "collateral damage" rather than "slaughter," and thus outside her calculus. Bob cannot simply re-assert the arithmetic; she must challenge Alice's moral boundary using Alice's own utilitarian principles.

  **Bob's Reply:**
  "Alice, you justify counting the chicken because its death is a *foreseeable consequence* of your purchase. You admit that if you didn't buy the chicken, that specific bird would not have been killed. But the same causal chain holds for the mouse in the wheat field. The farmer plants the crop *because* you buy the meat. The harvester kills the mouse *because* the crop is planted.

  By excluding the mouse, you are not following the utility principle; you are following a **rule of proximity**. You are treating the slaughterhouse wall as a moral magic barrier: a death inside counts, a death outside does not. But utilitarianism demands we count *states of affairs*, not *intentions*.

  If you concede that the mouse feels pain and loses its future, then excluding it is speciesism. If you deny it feels pain, you must explain why the chicken's pain counts but the mouse's does not, given that both are sentient vertebrates. You cannot claim to minimize death while arbitrarily ignoring 90% of the deaths your wallet causes. To be consistent, you must either admit the switch to beef is wrong (because of the field deaths) or explain why a chicken's death is worth 331 mice."
