prompt: |-
  I'm a grad student and in two weeks I'm presenting the central chapter of my dissertation to my department's political philosophy workshop. The chapter defends what I've been calling a "standby view" of religious arguments in democratic politics: a citizen or official can offer explicitly religious arguments for a coercive policy as long as adequate public reasons for that policy exist somewhere in the wider discourse and are doing the real justificatory work -- the religious arguer doesn't have to supply them, recite them, or even be aware of them. So a bishop can argue for expanded welfare policy in purely theological terms, fine, because there's a solid public case to be had; but a purely religious case for criminalizing blasphemy, where the supposedly public reasons on offer are just post-hoc rationalizations, doesn't pass. The test I propose is roughly "would the policy survive on public reasons alone," and I claim this ends up both more respectful to religious citizens and stricter in practice than a lot of what passes for public reason liberalism, since it doesn't let people launder bad policy behind the mere existence of some thin secular excuse.

  Here's the audience. Maybe half the workshop are pretty committed Rawlsians who think anything short of the proviso -- you owe your fellow citizens public reasons for the exercise of coercive power, full stop, from you, in your own mouth -- is a sell-out. One guy is a Habermasian who insists that translating religious into generally accessible reasons isn't an optional courtesy but a structural feature of legitimate lawmaking, and he's told me before that my view treats the public reasons as a "free rider" subsidy. And then there's a natural law theorist who agrees with my conclusion but hates my framework: she thinks "public reasons" is basically a label for reasons secular academics happen to like, and that my standby view smuggles in the same bias while pretending to be neutral, which honestly stings because it's a version of the worry I raise myself against other people. Plus a couple of first-years who'll happily ask whatever the senior faculty are too polite to say out loud.

  Can you draft my Q&A prep sheet? I want the objections in rough order of how much damage they'd do, phrased the way each camp would actually phrase them (the Rawlsians will go on about reciprocity and civic respect, the Habermasian about the moral function of law and translation, the natural law person about the stacked deck built into the very idea of the "public"). For each one, give me a two-minute reply I could actually deliver, and be honest about where the reply is soft -- I'd much rather find out now than at the workshop. Also tell me what I should just concede up front; I'm half tempted to concede the epistemic asymmetry point about who gets to decide which reasons count as "adequate." And please figure out the question I'm hoping nobody asks, because I already suspect it's this: whether my view quietly collapses back into the proviso whenever the public reasons are genuinely contested rather than sitting there safely on standby. The welfare example is easy precisely because everyone in the room already agrees with it -- the hard cases are exactly the ones where the standby never shows up, and I don't currently have a good answer to that.
reasoning: |-
  Here's a thinking process that leads to the suggested Q&A prep sheet:

  1.  **Analyze the User and Request:**
      *   **User:** Grad student presenting a dissertation chapter on political philosophy (specifically public reason liberalism and religion).
      *   **Topic:** "Standby View" of religious arguments. Religious arguments are permissible *if* adequate public reasons exist elsewhere in discourse (even if the speaker doesn't know/use them).
      *   **Key Distinction:** Contrasts with Rawls's "Proviso" (speaker must provide public reasons). Contrasts with strict secularism. Aims to be more respectful to religious citizens but stricter on policy (no laundering bad policy).
      *   **Audience:**
          *   ~50% Committed Rawlsians (focus: reciprocity, civic respect, duty from the speaker).
          *   1 Habermasian (focus: translation, structural legitimacy, free-rider problem).
          *   1 Natural Law Theorist (focus: bias in "public reason," stacked deck).
          *   ~2 First-years (wildcards, ask the obvious/hard questions seniors avoid).
      *   **Task:** Draft a Q&A prep sheet.
      *   **Requirements:**
          *   Order objections by potential damage.
          *   Phrase objections in the voice of each camp.
          *   Provide 2-minute replies for each.
          *   Be honest about weak points in the replies.
          *   Advise on concessions (specifically mentioning epistemic asymmetry).
          *   Identify the "Killer Question" (the one the user hopes nobody asks: contested cases where standby reasons don't exist).

  2.  **Deconstruct the "Standby View":**
      *   *Strengths:* Inclusivity for religious speakers, prevents secular bias in *speech*, focuses on policy outcomes.
      *   *Weaknesses:* Epistemic burden (who decides if public reasons exist?), the "Free Rider" problem (why should secularists do the work?), the "Contested Case" problem (what if the public reasons aren't obvious/agreed upon?), the "Civic Respect" problem (is it respectful to vote based on reasons you don't accept/share?).

  3.  **Drafting the Objections (Ordering by Damage):**
      *   *Highest Damage:* The "Contested Case" / "Hard Case" problem. If the view only works when public reasons are obvious (like welfare), does it collapse in hard cases (abortion, gay marriage)? This undermines the whole theory.
      *   *High Damage:* The Rawlsian "Civic Respect/Reciprocity" objection. If I vote based on God's word, I'm treating you as a subject of God, not a free equal, even if a secular reason exists somewhere.
      *   *Medium-High Damage:* The Habermasian "Free Rider/Translation" objection. Why should the secular public do the heavy lifting? It creates an asymmetry in democratic labor.
      *   *Medium Damage:* The Natural Law "Stacked Deck" objection. "Public reason" is just secular bias. (User already anticipates this, but it needs addressing).
      *   *Low Damage (but annoying):* Implementation/Epistemic Asymmetry. Who judges the adequacy of the standby reasons?

      *Decision:* I will structure the order based on *theoretical collapse* vs. *normative disagreement*. The "Hard Case" collapse is the most dangerous theoretically. The Rawlsian respect argument is the most dangerous normatively within the field.

  4.  **Drafting the Replies (2-minute limit):**
      *   Need to be punchy, philosophical, but conversational.
      *   Must acknowledge weaknesses (as requested).
      *   *Rawlsian:* Shift focus from *speaker's intent* to *coercive legitimacy*. If the law is justifiable to you, my motive matters less.
      *   *Habermasian:* Frame it as division of labor, not free-riding. Religious voices mobilize support for goods that *are* public, even if they frame them differently.
      *   *Natural Law:* Admit the risk, but argue the "Standby" test actually exposes the bias more than the Proviso does.
      *   *Epistemic/Who Decides:* Concede this is the hardest practical part, but argue courts/judges already do this.

  5.  **Addressing the "Killer Question":**
      *   The user suspects it: What happens when public reasons are *contested*?
      *   *Analysis:* If the Standby View requires existing public reasons, and in hard cases (e.g., abortion) those reasons are deeply contested or non-existent to the satisfaction of opponents, the view either bans the religious argument (collapsing into Rawls) or allows it without backup (collapsing into anything goes).
      *   *Advice:* Don't hide this. Frame it as a feature, not a bug. If no public reasons exist, the policy *shouldn't* pass. The Standby View is a filter for policy stability, not just speech permission.

  6.  **Refining the Tone:**
      *   Academic but practical.
      *   Supportive but critical (as requested: "be honest about where the reply is soft").
      *   Specific terminology (Rawls, Habermas, Public Reason, Coercion, Reciprocity).

  7.  **Iterative Drafting (Self-Correction during the process):**
      *   *Correction:* Initially, I might put the Rawlsian objection first. But the user specifically identified the "Contested Case" as their own worry. I should prioritize that as the "Killer Question" separate from the camp-specific objections, or integrate it as the high-damage theoretical objection. Let's make it the "Killer Question" section as requested, but also ensure the Rawlsian objection touches on it.
      *   *Correction on Concessions:* The user mentioned conceding the epistemic asymmetry. I need to make sure the advice explicitly says *yes, concede that, but spin it*.
      *   *Voice:* Ensure the Habermasian sounds like a Habermasian (discourse ethics, translation), the Rawlsian like a Rawlsian (reciprocity, freestanding), etc.

  8.  **Final Polish:**
      *   Check timing (2 mins is approx. 250-300 words spoken).
      *   Ensure the "Soft Spot" analysis is blunt.
      *   Make sure the "Killer Question" strategy is clear.

  9.  **Final Output Structure:**
      *   Intro (Encouragement).
      *   The "Killer Question" (Address this first as it's the biggest threat).
      *   Objection 1: Rawlsians (Reciprocity).
      *   Objection 2: Habermasian (Translation/Free Rider).
      *   Objection 3: Natural Law (Bias).
      *   Objection 4: Epistemic Asymmetry (Implementation).
      *   Concession Strategy.
      *   Closing Advice.

