      *   *Hart:* Separation of Law and Morals (positivism). Liberty is the default. Burden of proof is on the coercer. Distinction between Positive Morality (what is believed) and Critical Morality (what is rational/true). Disgust $\neq$ Reason. Paternalism is suspect.
      *   *The Friend's Upgrades:*
          *   Drops the empirical "disintegration" claim (weak point of Devlin). Focuses on *Legal Moralism* (Feinberg's term) or *Expressivism*.
          *   "Self-Portrait" is essentially a Dworkinian or Communitarian twist on Devlin. Law as expressive action.
