          *   The Friend's reply: "Accurate" vs. "Flattering."
          *   *Analysis:* Who judges accuracy? If it's the majority, it's Devlin's "reasonable man" again. If it's reason, it's Hart's "critical morality."
          *   *Verdict on this point:* The Self-Portrait argument collapses into Hart's Critical Morality if it wants to avoid tyranny. If it stays with "society's choice," it risks the witch-hunt problem.
      *   **Part IV: The Verdict (Synthesis & Decision):**
          *   Need a clear winner.
          *   *Hypothesis:* Hart wins on the *standard* (reason vs. disgust), but the Friend wins on the *scope* (harm includes institutional integrity).
          *   *Refinement:* A "Refined Liberalism" (Hybrid). Hart is right that disgust isn't a reason. But "Harm" must include damage to constitutive social institutions (like voting markets or family boundaries) that make autonomy possible.
          *   *Why not full Devlin?* Because the "Self-Portrait" lacks a check against oppression without importing Hart's critical reason.
          *   *Why not pure Mill?* Because some acts damage the *preconditions* of liberty without hurting specific individuals immediately.
      *   **Part V: Application to Specific Cases:**
          *   *Consensual Adult Incest:* Taboo, but does it harm institutions? Genetic risk (managed by contraception). Family structure risk (coercion dynamics). *Verdict:* Likely legal, but regulated (strict consent protocols). The "disgust" argument fails.
          *   *Vote Selling:* Harms the institution of democracy (equality of voice). Commodification of civic duty. *Verdict:* Illegal. Not because of morality per se, but because it destroys the *institution* that guarantees liberty.
      *   **Conclusion:** Summarize. Hart provides the *method* (critical reason), Friend identifies a blind spot (institutional harm). The verdict is Hartian Liberalism with an Institutional Harm clause.

  4.  **Refining the Argument (Self-Correction during drafting):**
      *   *Check:* Did I treat the friend's Devlin as a strawman? *Correction:* Ensure I acknowledge they dropped the "disintegration" thesis. That makes their position stronger (Legal Moralism without the empirical sociological claim).
      *   *Check:* Did I address the "Elasticity Problem"? *Correction:* Yes, by defining "Institutional Harm" carefully so it doesn't swallow the rule. It must be about *constitutive* rules, not just preferences.
      *   *Check:* Is the verdict clear? *Correction:* Avoid "both have points." Say "Hart is fundamentally right on the *source* of law, but the Friend is right that 'harm' includes institutional integrity."
      *   *Check:* Did I answer the specific cases? *Correction:* Make sure Incest and Vote-Selling get a definitive "Legal" or "Illegal" tag in the conclusion.

  5.  **Final Polish:**
      *   Ensure tone is respectful but decisive.
      *   Check philosophical terminology (Positive vs. Critical Morality, Harm Principle, Legal Moralism).
      *   Ensure the "Self-Portrait" critique lands: without an objective standard of "accuracy," it's just majority rule.

  6.  *(Mental Outline of the Verdict)*:
      *   Hart wins on the *justification* (Reason > Disgust).
      *   Friend wins on the *ontology* of harm (Institutions can be harmed).
      *   Result: Vote-selling is banned (Institutional Harm). Incest is legal (No Institutional Harm sufficient to override autonomy, provided strict safeguards). This distinguishes the two based on principle, not just "yuck factor."

  7.  **Writing the Essay.** (Proceeding to generate output based on this structure.)
