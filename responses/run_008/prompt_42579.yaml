  **The Morality of Law and the Integrity of Institutions: A Verdict on the Modernized Hart–Devlin Debate**

  The debate between H. L. A. Hart and Lord Patrick Devlin is often taught as a historical artifact, a mid-century quarrel over the decriminalization of homosexuality that ended with Hart's victory and the triumph of liberalism. But as your four-hour argument suggests, the underlying philosophical tension is far from settled. The question is not merely whether the state may police sexual privacy, but whether the law is a neutral framework for coexistence or an expressive project of collective self-definition.

  Your friend has wisely abandoned Devlin's weakest empirical claim: the "disintegration thesis," which holds that society will literally collapse if shared morality is not enforced. That claim is sociologically dubious. Instead, your friend has advanced a more sophisticated version of legal moralism, focusing on "integrity crimes" and the "self-portrait" function of law. You, channeling Hart, have held the line on the danger of enshrining disgust and the elasticity of the harm principle.

  To adjudicate this, we must first reconstruct the original exchange fairly, then test your friend's modern extensions against the Hartian framework, and finally render a verdict that resolves the specific cases of incest and vote-selling.

  ### I. The Original Exchange: Disgust vs. Reason

  Patrick Devlin's argument in *The Enforcement of Morals* (1965) rests on a communitarian premise: a society is not just a political arrangement but a community of ideas. For Devlin, a shared morality is the invisible bond that holds that community together, analogous to a recognized government or secure borders. Consequently, a society has the same right to preserve its moral constitution as it does its physical territory. To identify this morality, Devlin proposed the "reasonable man" test (the man on the Clapham omnibus). If the ordinary person feels deep intolerance, indignation, or disgust toward an act, that is proof enough of its immorality for the law to intervene.

  Hart's reply in *Law, Liberty, and Morality* (1963) was a defense of critical rationality against positive consensus. Hart distinguished between *positive morality* (the rules a group actually believes in) and *critical morality* (the rational principles by which we judge those beliefs). Hart argued that Devlin conflated the two. Just because a majority feels disgust does not mean there is a rational ground for prohibition. Hart's reductio was historical: the "reasonable man" of the 16th century felt deep disgust toward heretics and witches. If Devlin's standard were applied consistently, it would validate the persecution of Galileo or the burning of witches, because those acts were genuinely supported by the shared morality of the time. For Hart, the burden of proof must always lie on the coercer to show harm, not on the individual to show conformity.

  This is the baseline: Devlin prioritizes social cohesion and collective identity; Hart prioritizes individual liberty and rational justification.

  ### II. The Integrity Crimes: Stretching the Harm Principle

  Your friend's first move is to concede the disintegration thesis but argue that Legal Moralism survives without it. He points to "integrity crimes": consensual adult incest, bigamy, dueling, and vote-selling. In these cases, there is no obvious victim in the Millian sense. No rights are violated, no non-consenting parties are hurt, and public offense can be minimized. Yet, the intuition persists that these acts should be illegal.

  The challenge here is the elasticity problem you identified. If we ban vote-selling because it "harms democracy," have we defined harm so loosely that anything the state dislikes counts as harm? If we keep the definition tight, how do we explain the wrongness of selling a vote without resorting to "it's just immoral"?

  A refined Hartian framework can meet this challenge, but it requires an expansion of what counts as "harm." We must distinguish between *harm to individuals* and *harm to constitutive institutions*.

  Liberty does not exist in a vacuum; it relies on background institutions. The right to vote is not merely a personal preference; it is a structural guarantee of political equality. To allow vote-selling is to convert a right of citizenship into a commodity. This does not harm a specific voter immediately, but it degrades the *institution* of voting itself, transforming it from a mechanism of equal voice into a market of influence. This is a systemic harm. It damages the precondition of liberty.

  Similarly, dueling by consent might be banned not because of morality, but because the state cannot permit a private market on violence that undermines the state's monopoly on force and the value of human life as a public good.

  However, this expansion must be strictly policed to avoid the elasticity trap. An institution is only "constitutive" if it is necessary for the framework of liberty itself. This allows the Hartian to criminalize vote-selling without accepting Devlin's general license to enforce morality. The justification is not "this is sinful," but "this destroys the machinery of freedom."

  ### III. The Self-Portrait: Expression vs. Oppression

  Your friend's second move is the "self-portrait" argument: law is expressive. It tells a story about who we are. A society is entitled to paint that portrait, provided it is "accurate" rather than "flattering or prejudiced."

  This is the strongest philosophical challenge to Hart. It acknowledges that law shapes character, not just behavior. However, it runs aground on the question your friend posed: *What makes a self-portrait accurate?*

  If the standard for accuracy is the majority's current feeling, we are back to Devlin's "reasonable man," and Hart's worry about witches and heretics returns with full force. A society can sincerely believe its portrait is accurate while being objectively deluded (e.g., a slave-holding society believing itself to be a beacon of liberty).

  To avoid this, the "accuracy" of the self-portrait must be judged against a standard external to the majority's sentiment. That standard is precisely what Hart called *critical morality*. We can only say a law is an "accurate" reflection of societal values if those values withstand rational scrutiny. If the "portrait" relies on prejudice, superstition, or unexamined disgust, it is a caricature, not a portrait.

  Therefore, the self-portrait argument does not defeat Hart; it presupposes him. A society is entitled to define itself, but it is not entitled to define itself *irrationally*. The right to self-definition is a right to collective autonomy, but collective autonomy is subject to the same constraints as individual autonomy: it cannot be exercised on the basis of mere whim or prejudice if it restricts liberty. The "Self-Portrait" argument collapses into a demand for public reason, which is the Hartian position.

  ### IV. The Verdict

  Who was right? The verdict is a qualified victory for Hart, with a specific concession to your friend regarding institutional integrity.

  **Hart is right on the source of law.** Devlin's standard (disgust/indignation) is epistemologically bankrupt. Feelings are not reasons. History has vindicated Hart: the "shared morality" of the past often enshrined cruelty, and the "reasonable man" is frequently a vessel for bias. A legal system that treats disgust as a justification is inherently unstable and unjust. Therefore, the *Self-Portrait* argument fails as a standalone justification for coercion unless it imports Hart's requirement for critical rationality.

  **Your friend is right on the scope of harm.** Pure Millian individualism sometimes fails to account for the structural preconditions of liberty. There are acts that do not harm specific individuals but corrode the institutions that make individual rights meaningful. This is not Legal Moralism (banning acts because they are immoral); it is Institutional Protection (banning acts because they break the game).

  This leads to a **Hybrid Position: Liberal Institutionalism.** The state may not enforce morality for its own sake (rejecting Devlin), but it may protect the constitutive institutions of a free society from commodification or degradation (accepting a refined version of the integrity crimes).

  ### V. Application to the Hard Cases

  This verdict allows us to resolve the cases that stalled your debate, distinguishing them based on principle rather than intuition.

  **1. Vote-Selling:**
  *   **Verdict:** **Illegal.**
  *   **Reasoning:** This is not a moralism case; it is an institutional harm case. The vote is a fiduciary instrument of political equality. Allowing its sale converts a public right into private property, fundamentally altering the nature of the political system from a democracy to a plutocracy. This harms the *structure* of liberty, even if no specific voter is physically injured. It fits within the Hartian framework as preventing harm to the preconditions of rights.

  **2. Consensual Adult Incest:**
  *   **Verdict:** **Legal (with strict regulation).**
  *   **Reasoning:** This is the harder case, but it must be distinguished from vote-selling. While the family is a constitutive institution, criminalizing sexual relations between *adult* siblings (where coercion is absent and reproduction is prevented) does not damage the institution of the family in the way vote-selling damages democracy. The prohibition on incest is largely rooted in the "yuck factor" (disgust) and genetic risk. If genetic risk is managed (contraction/sterilization) and coercion is absent, the remaining objection is purely moral/expressive. Under the Liberal Institutionalism view, the state cannot ban an act solely because it conflicts with a traditional moral portrait if no institutional harm is demonstrable. The "accuracy" of a self-portrait that criminalizes private, harmless love is suspect. Therefore, Hart's protection of liberty prevails here.

  ### Conclusion

  You and your friend were arguing over two different dimensions of the problem. Your friend correctly identified that the Harm Principle needs to account for structural and institutional integrity, not just physical injury to individuals. However, you were correct to insist that "morality" cannot be the *reason* for prohibition, only the *protection of liberty's framework* can be.

  Devlin's error was thinking that society's bond is morality itself. Hart's insight was that society's bond is the rule of law protecting liberty. Your friend's "self-portrait" is permissible only if painted with the brush of critical reason, not the ink of disgust.

  Bring this back to your friend: He wins on vote-selling, but only by accepting Hart's reasoning (institutional harm, not moral wrong). You win on incest, but only by acknowledging that "harm" must be understood structurally, not just physically. The winner is not Hart or Devlin, but a liberalism that understands that institutions, like people, can be harmed.
