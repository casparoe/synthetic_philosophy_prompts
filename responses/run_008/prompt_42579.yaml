              *   *Option A:* Redefine Harm (Feinberg's Offense Principle? Institutional Harm?).
              *   *Option B:* Paternalism (weak for adults).
              *   *Option C:* Public Goods/Institutional Integrity. Vote-selling harms the *system*, not a specific person. Incest harms the *family structure* (though less convincing for adult siblings).
          *   *Assessment:* The "Institutional Harm" argument saves the Harm Principle but stretches it. It concedes that "harm" includes damage to abstract structures necessary for liberty.
      *   **Part III: The Self-Portrait (The Second Move):**
          *   Law as expressive. Society defining itself.
