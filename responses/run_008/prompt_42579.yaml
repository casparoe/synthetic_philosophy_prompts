  3.  **Drafting - Section by Section:**

      *   **Introduction:** Set the scene. Acknowledge the longevity of the debate. State the essay's purpose: to adjudicate the modernized Devlin (the friend) vs. the refined Hart (the user).
      *   **Part I: The Original Exchange (Reconstruction):**
          *   Devlin's core: Society = moral community. Threat to morality = threat to society. Standard = ordinary person's reaction.
          *   Hart's core: Liberty principle. Critical vs. Positive morality. The "witch/heretic" reductio. The distinction between *is* and *ought*.
          *   *Crucial nuance:* Devlin wasn't just a bigot; he was worried about social cohesion. Hart wasn't an anarchist; he allowed for harm prevention.
