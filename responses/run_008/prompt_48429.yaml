answer: |-
  Here is the referee report on the Iris vs. Theo bargaining dispute.

  ### Executive Summary
  You asked for a ruling on the math, the theory, and the final split.
  1.  **The Math:** All four numbers quoted (65/35, 59/41, 45, 75/25) are **correct** based on the formulas each person applied.
  2.  **The Theory:** Iris is theoretically stronger. Theo is misapplying the Kalai–Smorodinsky solution by using an "ideal point" that is actually impossible to achieve.
  3.  **The Recommendation:** Split it **65/35**. It is the only solution that respects the actual constraints of the deal and standard economic fairness for joint ventures.

  Here is the move-by-move breakdown.

  ---

  ### Move 1: Iris's Opening (Nash Bargaining Solution)
  **Claim:** 65/35 split based on equal gains over the fallback.
  **Math Check:** **Correct.**
  *   **The Pie:** $100k.
  *   **The Fallback (Disagreement Point):** Iris $30k, Theo $0.
  *   **The Surplus:** $100k - $30k = $70k available to split.
  *   **Nash Logic:** Split the surplus 50/50.
  *   **Calculation:** $35k each. Iris gets $30k (fallback) + $35k = $65k. Theo gets $0 + $35k = $35k.
  **Theory Check:** **Correct.**
  This is the standard Nash Bargaining Solution (NBS) for players with equal bargaining power. It maximizes the product of the gains. It is the most common baseline for this exact scenario in economics.

  ### Move 2: Theo's Counter (Kalai–Smorodinsky)
  **Claim:** ~59/41 split based on proportional fairness relative to "best case."
  **Math Check:** **Correct (based on his inputs).**
  *   **Theo's Logic:** He compares "Max Possible Gain."
      *   Iris Max Gain: $100k total - $30k fallback = $70k.
      *   Theo Max Gain: He claims $100k (assuming Iris gets $0).
  *   **Ratio:** 70 (Iris) to 100 (Theo). Total 170 parts.
  *   **Splitting the $70k Surplus:** Theo gets $(100/170) \times 70k \approx \$41.1k$.
  *   **Result:** Iris ~$59k, Theo ~$41k.
  **Theory Check:** **Flawed.**
  Theo is misapplying the Kalai–Smorodinsky (KS) solution. KS requires the "ideal point" to be feasible. Theo's ideal point assumes Iris accepts $0. But Iris has a guaranteed $30k fallback; she will never accept $0. Therefore, Theo's maximum feasible gain is actually $70k (leaving Iris with her $30k), not $100k.
  *   **Correct KS Application:** If both max gains are $70k, the ratio is 1:1. The KS solution collapses into the Nash solution (65/35). Theo is using a "Proportional Claims" rule but labeling it KS to borrow its academic credibility.

  ### Move 3: Iris's Rebuttal (Independence of Irrelevant Alternatives)
  **Claim:** Theo's rule breaks if a dead deal (the $130k offer) is considered.
  **Math Check:** **Correct.**
  *   **Scenario:** A lapsed deal suggested Theo's design *could* have been worth $130k (with Iris still getting $30k).
  *   **Theo's Rule:** If we update Theo's "Max Potential" to $130k:
      *   Ratio: 70 (Iris) to 130 (Theo). Total 200 parts.
      *   Theo's Share of $70k Surplus: $(130/200) \times 70k = \$45.5k$.
  *   **Result:** Theo's share jumps from $41k to $45.5k purely because of a deal that doesn't exist.
  **Theory Check:** **Correct.**
  Iris correctly identifies that the Nash solution satisfies **Independence of Irrelevant Alternatives (IIA)**. The KS solution (and Theo's proportional rule) does not. In a legal or business contract, you generally want the outcome to depend on *actual* options, not hypothetical ghosts. Iris wins this point decisively.

  ### Move 4: Theo's Rebuttal (Monotonicity)
  **Claim:** If Iris's fallback rises to $50k, Theo shouldn't lose money (NBS drops him to $25k).
  **Math Check:** **Correct.**
  *   **New Fallback:** Iris $50k, Theo $0.
  *   **New Surplus:** $100k - $50k = $50k.
  *   **NBS Split:** $25k each.
  *   **Totals:** Iris $75k, Theo $25k.
  *   **Change:** Theo drops from $35k to $25k.
  **Theory Check:** **Debatable.**
  Theo argues for a property often called **Solidarity**: if one person's situation improves, the other shouldn't be punished. However, in bargaining, leverage *is* value.
  *   **Economic Reality:** When Iris's fallback rises, the *total value created by the partnership* shrinks (from $70k surplus to $50k surplus). For Theo to stay at $35k, Iris would have to accept a *smaller gain* over her new fallback than Theo gets over his.
  *   **Example:** If Theo stays at $35k, Iris gets $65k. Her gain over fallback is only $15k ($65k - $50k), while Theo's gain is $35k. This violates the "Equal Gains" fairness principle Iris started with. Theo is asking to be insulated from the economic reality that Iris's increased leverage shrinks the pie available to share.

  ---

  ### What You Both Missed
  1.  **Feasibility Constraints:** Theo's biggest error is ignoring that Iris cannot be forced below $30k. Any "fair" solution that pretends she could get $0 is modeling a different game than the one you are playing.
  2.  **Effort vs. Leverage:** Both solutions assume equal bargaining *power*. If Theo did 80% of the coding and Iris did 20%, the surplus shouldn't be split 50/50 regardless of the fallback. However, assuming equal effort, the surplus split should be equal.
  3.  **Relationship Value:** Game theory maximizes utility, not friendship. A rigid 65/35 might feel "mathematically fair" but could breed resentment if Theo feels his contribution is undervalued. However, a 59/41 split based on a theoretical error (Theo's KS) is worse.

  ---

  ### The Verdict and Recommendation

  **Recommendation: Split 65/35 ($65k to Iris, $35k to Theo).**

  **Why?**
  1.  **It's the Robust Solution:** The Nash Bargaining Solution is the standard for a reason. It satisfies IIA (Iris's Point 3), meaning your split won't change if you find old emails about deals that never happened.
  2.  **Theo's Math is Built on a Fantasy:** Theo's 59/41 argument relies on the idea that he could theoretically take the whole $100k. He can't. Iris has a veto worth $30k. You cannot negotiate based on a "best case" that violates the other person's minimum requirement.
  3.  **Fairness of Surplus:** You built this *together*. The $30k license is Iris's insurance policy, not her contribution to the joint app. The $70k *extra* value was created jointly. Splitting the joint value 50/50 is the most defensible definition of partnership fairness.
  4.  **Monotonicity is a Trap:** Theo's argument that he shouldn't lose if Iris's options improve sounds nice, but it effectively means Iris must subsidize her own success. If she gets a better offer elsewhere, she brings more leverage to the table. In business, leverage commands a premium.

  **Referee's Note to Theo:**
  Your dad's union rule (proportional fairness) works well when dividing a fixed resource based on hours worked or seniority. But this is a bargaining scenario with a disagreement point. You are trying to claim a share of the surplus based on a "potential" that the contract doesn't allow. Stick to the surplus you actually created together.

  **Referee's Note to Iris:**
  You are right on the theory, but be careful with the "Monotonicity" argument. While mathematically sound, telling a friend "My leverage went up, so you get less" can feel aggressive. Frame it as: "The total value we are creating together shrank because my alternative is better, so we are splitting the new, smaller surplus equally."

  **Final Split:** **$65,000 to Iris, $35,000 to Theo.** Go enjoy the rest of the birthday dinner.
