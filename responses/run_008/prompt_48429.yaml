      *(Self-Correction during drafting)*: Make sure to explicitly state that Theo's "KS" calculation is actually a "Proportional Claims" solution, not standard KS, because standard KS respects the feasible set boundaries. This is the "smoking gun" that tips the referee decision to Iris.

