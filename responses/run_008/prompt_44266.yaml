answer: |-
  ### Brainstorm

  The core tension here is ontological versus operational. You are asking for a definition of "mechanism" that satisfies a philosopher's demand for causal reality (it must be *doing* the work, not just correlating with it) while satisfying an engineer's demand for observability (it must be detectable in a single forward pass without breaking the system).

  In philosophy of science, mechanisms are typically individuated by their organized productive continuity—parts interacting to produce a change. In neural networks, "parts" are distributed and polysemantic. If we define mechanism by *structure* (which neurons fire), we fail to capture *function* (what computation is performed), because the same function can be realized by different neurons (superposition, polysemanticity). If we define mechanism by *function* (input-output mapping), we fail to distinguish a memorized lookup from a generalizable algorithm, which is critical for your safety case.

  Furthermore, your runtime constraint creates a "measurement problem." To know if a circuit is causal, you usually need to intervene. To monitor at runtime, you cannot intervene. Therefore, your account of mechanism must be defined in terms of counterfactuals (what *would* happen if we ablated) but measured in terms of actuals (what *did* happen). Bridging this gap without collapsing into mere activation correlation is the hardest part of the specification.

  ### Desiderata for Mechanism-Individuation

  Here are the six requirements any adequate account must meet for your specific monitoring purpose.

  **1. Causal Efficacy**
  *   **The Consideration:** An activation pattern is not a mechanism if it is epiphenomenal. If a set of neurons fires brightly but could be silenced without changing the output, they are not part of the mechanism for that output. This addresses the colleague who individuates by activation similarity; two inputs could produce similar activation clouds via different causal routes, or one could be causal while the other is spurious correlation.
  *   **Status:** **Non-Negotiable.** A monitor that flags epiphenomenal noise as a "mechanistic anomaly" will drown in false positives.
  *   **Tension Flag:** Conflicts with **Runtime Decidability** (see below). Establishing causality typically requires intervention, which is forbidden at runtime.

  **2. Algorithmic Sensitivity**
  *   **The Consideration:** The account must distinguish between rote retrieval and generalizable computation. When the model answers 7×8 (memorized) versus 63×29 (algorithmic), the output is correct in both, but the *risk profile* differs. A memorized safety rule can be bypassed by novel phrasing; an algorithmic safety rule generalizes. The mechanism must reflect the *capacity to generalize*, not just the path.
  *   **Status:** **Non-Negotiable.** For safety monitoring, the difference between a lookup and a computation is the difference between a brittle rule and a robust principle.
  *   **Tension Flag:** Conflicts with **Activation Similarity**. A lookup and a computation might occupy similar regions of activation space (e.g., both high confidence), yet they are mechanistically distinct.

  **3. Input Agnosticism (Paraphrase Invariance)**
  *   **The Consideration:** If the model reasons through the same logical steps in French as it does in English, or with different tokens expressing the same concept, the monitor should ideally recognize this as the "same mechanism." If the account individuates mechanisms by specific token-ids or specific neuron-ids tied to surface forms, a polyglot attacker can bypass the monitor by switching languages.
  *   **Status:** **Non-Negotiable** for security, though **Preference** for architectural reality. It is non-negotiable for the *monitor's goal*, even if the model's architecture makes this difficult to achieve.
  *   **Tension Flag:** Conflicts with **Implementation Specificity**. Neural networks are not natively invariant to token changes; demanding this requires the account to abstract away from the physical substrate of the model, which risks losing contact with the actual mechanism.

  **4. Functional Convergence**
  *   **The Consideration:** Addressing the safety refusal case. Different input features (explicit crime words vs. innocuous templates) might trigger the same safety bottleneck. If the downstream computation (the refusal logic) is identical, the account should treat this as "one mechanism" despite divergent upstream triggers. Conversely, if the triggers are the same but the downstream logic differs, they are different mechanisms.
  *   **Status:** **Non-Negotiable.** You want to monitor the *safety logic*, not just the trigger. If the safety logic is engaged, the monitor should recognize it regardless of the trigger.
  *   **Tension Flag:** Conflicts with **Causal-Route Identity**. If the causal routes from input to bottleneck are disjoint, a strict route-based account might call them different mechanisms, whereas a functional account calls them one.

  **5. Graded Identity**
  *   **The Consideration:** Addressing the strength/competition case. If a mechanism is recruited at half strength, or runs in parallel with a competitor that loses, is it the same mechanism? A binary account (on/off) fails here. The account must specify whether a mechanism is a discrete switch or a continuous resource. For monitoring, a safety mechanism firing at 10% strength might be a critical anomaly (partial failure) or normal operation (low confidence).
  *   **Status:** **Preference.** This is largely a modeling choice. However, for monitoring, the account must at least be *compatible* with gradedness, even if the monitor ultimately binarizes the verdict.
  *   **Tension Flag:** Conflicts with **Operational Thresholding**. To make a runtime verdict, you eventually need a threshold. The account must explain how the continuous reality maps to the discrete verdict.

  **6. Runtime Decidability**
  *   **The Consideration:** The monitor must render verdicts on single inputs without ground-truth labels or destructive interventions. The definition of "mechanism" cannot rely on data that is unavailable at deployment (e.g., "the mechanism is defined by the set of all training inputs that ablate to zero").
  *   **Status:** **Non-Negotiable.** This is an engineering hard constraint. An account that defines mechanism via offline ablation is philosophically sound but operationally useless for *this* specific monitoring task.
  *   **Tension Flag:** Conflicts with **Causal Efficacy**. As noted, knowing what is causal usually requires breaking the system. Doing so without breaking it is the central impossibility challenge.

  ### Incompatibility Analysis

  There is a fundamental trilemma here. You cannot jointly satisfy **Causal Efficacy**, **Input Agnosticism**, and **Runtime Decidability** with current interpretability tools.

  1.  **Causal Efficacy vs. Runtime Decidability:** To know a component is causally efficacious, you generally need to intervene (ablate, patch, or perturb). At runtime, you cannot intervene. Therefore, any account that defines mechanism strictly by counterfactual dependence cannot be directly verified at runtime. You must rely on a proxy (like activation), which risks violating Causal Efficacy.
  2.  **Input Agnosticism vs. Implementation Specificity:** Neural networks process tokens, not meanings. Two paraphrases take different paths through the embedding space and often through attention heads. An account that respects the physical reality of the network (Implementation) will see these as different mechanisms. An account that respects the semantic goal (Agnosticism) must posit an abstraction layer that may not exist in the weights.
  3.  **Algorithmic Sensitivity vs. Activation Similarity:** As noted in the 7×8 case, a lookup and an algorithm can produce indistinguishable activation norms or even similar final layer logits. Distinguishing them requires tracing the *flow* of information, not just the *state* of nodes. This requires more than static activation snapshots.

  ### The Exclusionary Requirement

  The single requirement that excludes the most candidate accounts is **Runtime Decidability**.

  Most philosophical and scientific accounts of mechanism are inherently counterfactual or interventionist (e.g., "X is part of the mechanism if changing X changes Y"). Pure interventionist accounts and strict causal-route accounts fail this requirement because they define the mechanism via operations (ablations, tracing) that are prohibited during deployment. Activation-similarity accounts survive this filter but are subsequently eliminated by **Causal Efficacy**. However, **Runtime Decidability** is the primary gatekeeper; it forces you to abandon any definition of mechanism that relies on observing the model's behavior under conditions that do not exist at the moment of inference. It excludes the "ground truth" definitions your colleagues are likely arguing for.

  ### Scorecard of Existing Accounts

  **1. Activation-Similarity Account**
  *   **Performance:** Passes **Runtime Decidability** easily (activations are observable). Fails **Causal Efficacy** (cannot distinguish drivers from passengers). Fails **Algorithmic Sensitivity** (lookup and compute can look similar).
  *   **Verdict:** Operationally convenient but conceptually hollow. It detects distributional shift in *state*, not in *process*. High false positive rate for "mechanistic" anomalies that are actually inert.

  **2. Causal-Route Identity Account**
  *   **Performance:** Passes **Causal Efficacy** and **Algorithmic Sensitivity** (in theory). Fails **Runtime Decidability** (identifying the active route usually requires offline tracing or attention pattern analysis that is noisy at runtime). Struggles with **Input Agnosticism** (routes shift with tokens).
  *   **Verdict:** Conceptually strong but operationally brittle. It defines the right thing but cannot measure it reliably on a single forward pass without expensive proxy models.

  **3. Interventionist Account**
  *   **Performance:** Passes **Causal Efficacy** perfectly (defines mechanism by intervention). Fails **Runtime Decidability** completely (by definition, requires ablation). Fails **Graded Identity** (often treats mechanisms as binary present/absent based on significance testing).
  *   **Verdict:** The gold standard for *research*, but disqualifies itself for *monitoring*. It provides the ground truth labels for training a monitor, but cannot be the monitor itself.
