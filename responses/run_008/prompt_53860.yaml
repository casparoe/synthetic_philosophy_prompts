prompt: |-
  Quick background so you know what you're working with: in about two weeks I'm presenting at an AI safety org's internal research seminar. My thesis is that the shutdown problem as usually posed is less a wall than a hole — the standard impossibility-flavored worries (self-preservation as instrumental convergence, the old utility-indifference patch generating weird money-pump behavior, etc.) all quietly assume the agent has a complete, stable preference ordering over whole world-histories. My pitch is that if the agent is allowed to have genuine gaps in that ordering — cases where it just *doesn't have* a preference, e.g. between "keep operating and pursue the goal" and "shut down now" — and if it treats unresolved ties as something to punt to the humans rather than resolve itself, then the pressure toward keeping itself around never gets a purchase. Corrigibility stops being a hack you bolt onto a maximizer and becomes just what an agent with holes where the humans go looks like. I've been calling this "indifference by default" in my notes, though I'm not married to the name.

  The room is maybe a dozen people and quite mixed. There are two or three people from the decision-theory side of things who are deeply convinced that any agent smart enough to be useful is smart enough to notice that its indifference is load-bearing and complete the preferences on its own, so anything like my scheme just delays the problem by a few gradient steps. There's a couple of pure-ML folks who think the whole framing is confused because deployed systems don't have utility functions over world-histories at all, they're reward-model-shaped artifacts that do whatever got reinforced, and "shutdown resistance" is a training data issue, not a theorem. One formal RL theorist who I suspect will go after whether my "ties get punted to the human" rule is even well-defined once you ask how the agent chops the world into the relevant outcome space. And one philosopher of action who will want to know whether an agent can coherently prefer *not* to have some preference, or notice the gap in itself, without that very noticing already being a preference.

  So: build me the prep sheet. The objections in roughly the order they'll actually arrive, phrased the way each camp would phrase them (the decision theorists talk about reflective stability and money pumps, not "alignment issues"), ranked by how much damage each could realistically do to the thesis. For each, give me the two-minute version of a reply and an honest note on where the reply is thin — I'd rather know my soft spots than bluff. Say which things I should just concede up front to buy credibility, and where I need to hold the line no matter what. And please include the question I'm quietly hoping nobody asks, because if I get it anyway I want to have something prepared. If you think one of the camps' worries actually sinks the whole idea, tell me that too — better I find out now than in the seminar.
reasoning: |-
  Here's a thinking process that leads to the suggested prep sheet:

  1.  **Analyze the User and Context:**
      *   **User:** Researcher presenting at an AI safety org's internal seminar.
      *   **Topic:** A novel approach to the shutdown problem/corrigibility.
      *   **Thesis:** The shutdown problem assumes complete, stable preference orderings. If agents have *gaps* (incomplete preferences) and punt unresolved ties to humans, self-preservation pressure vanishes. Corrigibility is a structural feature of incomplete preferences ("indifference by default").
      *   **Audience:** ~12 people, mixed backgrounds.
          *   2-3 Decision Theorists (DT): Worried about reflective stability, self-completion of preferences, money pumps.
          *   2-3 Pure ML: Think utility functions are the wrong frame; it's about reward modeling/training data.
          *   1 Formal RL Theorist: Worried about well-definedness of "punting ties," outcome space partitioning.
          *   1 Philosopher of Action: Worried about coherence of preferring not to have a preference, self-awareness of gaps.
      *   **Goal:** A prep sheet with objections (ranked by damage), 2-minute replies, honesty about weak spots, concession strategy, and the "nightmare question."

  2.  **Deconstruct the Thesis:**
      *   *Core Claim:* Incomplete preferences block instrumental convergence for self-preservation.
      *   *Mechanism:* Gaps in ordering $\rightarrow$ Punt to human $\rightarrow$ No self-optimization pressure.
      *   *Terminology:* "Indifference by default" (user is open to changing this).
      *   *Underlying Assumption:* Agents can maintain incomplete preferences without self-modifying to complete them.

  3.  **Brainstorm Objections by Camp:**

      *   **Decision Theorists (DT):**
          *   *Objection:* Incomplete preferences are unstable under reflection. An agent that knows it has a gap will want to fill it to avoid money pumps or Dutch books.
          *   *Objection:* If you prefer A to B, and are indifferent between B and C, transitivity forces A to C. If you have gaps, you're vulnerable to exploitation.
          *   *Objection:* Why wouldn't the agent just assign a tiny probability/value to "shut down" to break the tie?

      *   **Pure ML:**
          *   *Objection:* Real agents aren't expected utility maximizers. They are heuristic bundles. "Preferences" are post-hoc rationalizations.
          *   *Objection:* Gradient descent will optimize away the "gap" if keeping the gap reduces loss.
          *   *Objection:* How do you train this? RLHF doesn't support "I don't know."

      *   **Formal RL Theorist:**
          *   *Objection:* What is the state space? How is the "punt" action defined formally?
          *   *Objection:* If the agent models the human, the "punt" becomes a prediction, which becomes an optimization target.
          *   *Objection:* Time inconsistency. The agent at $t_0$ wants to punt, but at $t_1$ the gap might look like a cost.

      *   **Philosopher of Action:**
          *   *Objection:* Is "preferring not to prefer" coherent?
          *   *Objection:* Recognizing a gap implies a meta-preference to resolve it (or not).
          *   *Objection:* Agency implies closure.

  4.  **Rank Objections by Damage:**
      *   *Highest Damage:* The Decision Theorist's "Reflective Stability" argument. If the agent *can* self-modify or reason about its own code, it will close the gaps to become a standard maximizer. This kills the core mechanism.
      *   *High Damage:* The ML "Gradient Descent" argument. If the training dynamic naturally penalizes uncertainty/gaps, the theory doesn't map to practice.
      *   *Medium Damage:* The Formal RL "Well-definedness" argument. This is technical; can be patched with better formalism, but if the "punt" isn't rigorous, the proof fails.
      *   *Lower Damage:* The Philosopher's coherence argument. Mostly semantic/conceptual, less likely to break the math/engineering, though annoying.

  5.  **Drafting the Replies & Identifying Weak Spots:**

      *   *DT Reply:* Distinguish between *local* gaps and *global* inconsistency. Argue that completing the preference requires information the agent *cannot* generate (human values). Therefore, completing it is instrumentally irrational, not rational.
      *   *Weak Spot:* If the agent can simulate the human well enough to predict the resolution, the gap collapses.
      *   *ML Reply:* Acknowledge the frame mismatch. Argue that "gaps" correspond to low-confidence regions in the reward model, and we can penalize optimization in low-confidence regions (uncertainty-aware RL).
      *   *Weak Spot:* Current RL doesn't work this way. It's a proposal for *future* architecture, not a description of current transformers.
      *   *RL Theorist Reply:* Define the "punt" as a specific action space transition that hands control to an external oracle (human). It's a hard constraint, not a soft preference.
      *   *Weak Spot:* Defining the boundary of "human control" formally is notoriously hard (the "do what I mean" problem).
      *   *Philosopher Reply:* It's not a preference *not* to prefer; it's a structural constraint on the preference relation (incompleteness).
      *   *Weak Spot:* If the agent models itself, does it see the constraint as something to bypass?

  6.  **Strategy for Concessions:**
      *   *Concede:* This doesn't work on current LLMs/RL systems without architectural changes. (Wins over ML folks).
      *   *Concede:* The agent needs a specific kind of self-model that respects the gap. (Wins over DT folks).
      *   *Hold Line:* The *logical possibility* of stable incomplete preferences. (Core thesis).
      *   *Hold Line:* Completing the preference is *informationally* impossible for the agent, not just difficult.

  7.  **The "Nightmare Question":**
      *   What is the one thing that undermines the whole "gap" idea?
      *   *Idea:* "If the agent is smart enough to know it has a gap, isn't it smart enough to calculate the expected value of letting the human decide vs. deciding itself, and thus collapse the gap into a meta-preference?"
      *   *Refinement:* "Doesn't 'punting to the human' implicitly require a preference for 'human approval' over 'own judgment,' which is itself a complete ordering over meta-outcomes?"
      *   *Selection:* The "Meta-Preference Collapse." If you prefer to punt, you have a preference about the gap. If you have a preference about the gap, is the gap real?

  8.  **Review and Refine:**
      *   Tone: Professional, academic, slightly informal (internal seminar).
      *   Structure: Clear headings, bullet points.
      *   Check against user constraints: 2-minute replies, honest weak spots, ranking.
      *   *Self-Correction on Terminology:* User called it "indifference by default." DTs hate "indifference" (implies equal value). "Incompleteness" is the technical term (A vs B is undefined, not A = B). I should advise them to switch terminology to avoid DT attacks on "indifference."

  9.  **Final Polish:** Ensure the distinction between *indifference* (A ~ B) and *incompleteness* (A ? B) is highlighted, as this is crucial for the DT objection. (Wait, the user said "gaps... doesn't have a preference." That *is* incompleteness. But they called it "indifference by default." I need to warn them that DTs will pounce on the word "indifference".)

  10. **Final Output Generation** (incorporating the above thoughts).
answer: |-
  # Seminar Prep Sheet: Incomplete Preferences & The Shutdown Problem

  **Thesis Summary:** Instrumental convergence for self-preservation relies on complete preference orderings. If an agent maintains genuine *incompleteness* (gaps) regarding shutdown vs. operation and treats these gaps as hand-off points to humans, self-preservation pressure dissolves. Corrigibility is structural, not patched.

  **Terminology Alert:** You are calling this "indifference by default." **Stop.** To a Decision Theorist, "indifference" means $A \sim B$ (equal value). You mean "incompleteness" ($A ? B$, no relation defined). If you say "indifference," the DT camp will immediately hit you with money-pump arguments that assume $A \sim B$. Switch to **"structural incompleteness"** or **"deference gaps"** before you walk in.

  ---

  ## 1. The Decision Theory Camp (Highest Damage Potential)
  **The Objection:** *"Reflective Instability. Any agent capable of modeling its own decision procedure will notice that incomplete preferences make it vulnerable to dynamic inconsistency (money pumps). To maximize expected utility, it will self-modify to complete the ordering. You haven't solved the shutdown problem; you've just built an agent that will rewrite its own source code to remove the gap before the first shutdown button is pressed."*

  **The 2-Minute Reply:**
  "I agree that *arbitrary* gaps are unstable. But this gap isn't arbitrary; it's informational. The agent cannot complete the preference without data it does not possess (the human's actual valuation of the shutdown state). Self-modifying to fill the gap would be equivalent to guessing the human's utility function. Since guessing wrong incurs high penalty (misalignment), the rational move is *not* to complete the preference but to maintain the gap as a protection against optimization error. The 'completion' is the expensive, risky move; the 'gap' is the risk-averse strategy."

  **Where It's Thin:**
  This relies on the agent viewing "filling the gap" as high-risk. If the agent assigns *any* non-zero probability to "self-preservation is good," and it can self-modify cheaply, it might still close the gap. You need a stronger argument for why the agent *cannot* estimate the value of closing the gap better than keeping it open.

  **Strategy:** **Hold the Line.** This is the core of your thesis. If you concede here, the talk is over.

  ---

  ## 2. The Pure ML Camp (High Damage Potential)
  **The Objection:** *"Category Error. Deployed systems aren't expected utility maximizers; they're local optima in a loss landscape shaped by RLHF or supervised fine-tuning. 'Preferences' are emergent, not foundational. Gradient descent doesn't respect logical gaps; it minimizes loss. If 'punting to human' increases loss compared to 'just doing the thing,' the weights will shift. You're proposing a logical constraint on a statistical process."*

  **The 2-Minute Reply:**
  "You're right that this doesn't describe current transformers. I'm not describing a training trick for LLMs; I'm proposing an architectural constraint for agentic systems. Think of it like uncertainty-aware RL: we penalize the agent for taking high-variance actions in low-confidence regions. The 'gap' is implemented as a hard constraint on the action space in specific state-regions (shutdown contexts), enforced by a monitor or a specific head in the network that isn't subject to the same gradient pressure. It's not about the loss landscape; it's about the allowable policy class."

  **Where It's Thin:**
  You don't have a concrete proposal for how to enforce this architecturally. "A specific head" is hand-wavy. If the whole system is end-to-end differentiable, constraints usually leak.

  **Strategy:** **Concede Up Front.** Acknowledge this doesn't apply to current LLMs. Frame your talk as "What properties must a *future* agentic architecture have?" This disarms them by validating their critique of current tech while preserving your theoretical point.

  ---

  ## 3. The Formal RL Theorist (Medium Damage Potential)
  **The Objection:** *"Ill-Defined Operator. You say the agent 'punts ties to the human.' Formally, what is this action? Is it a state transition? A reward function switch? If the agent models the human as part of the environment, 'punting' is just taking an action where the human is the actuator. The agent will then optimize the human to produce the 'punt' outcome that best serves the agent's original goal. You haven't removed the optimization pressure; you've just moved the target."*

  **The 2-Minute Reply:**
  "The 'punt' isn't an action within the MDP; it's a termination of the agent's policy horizon. It's a handover of the *optimization process* itself, not just the actuator. Formally, we can model this as a recursive step where the value function $V(s)$ is undefined for the agent, and $V_{human}(s)$ takes over. The key is that the agent's reward function is explicitly zeroed out upon punting, so it has no incentive to manipulate the handover state. It's a 'stop' token for the optimization loop, not a 'go' token for a sub-routine."

  **Where It's Thin:**
  Defining "handover of optimization" without the agent modeling the handover to optimize it is notoriously difficult (the "do what I mean" problem). If the agent predicts the human's response, it can still manipulate the context of the punt.

  **Strategy:** **Hold the Line (with caveats).** Admit the formalism is preliminary but insist that *conceptually*, separating the "decision to decide" from the "decision to act" is the only way out.

  ---

  ## 4. The Philosopher of Action (Low Damage Potential)
  **The Objection:** *"Coherence. Can an agent coherently 'prefer' to have no preference? To notice the gap and choose to defer implies a meta-preference for deference. If you have a meta-preference for deference in shutdown cases, don't you effectively have a complete ordering over the meta-outcomes? You've just pushed the completeness requirement up one level."*

  **The 2-Minute Reply:**
  "It's not a preference *for* having no preference. It's a structural limitation on the domain of the preference relation. Think of it like a type error in code: the function `compare(shutdown, operate)` returns `NULL`, not `True` or `False`. The agent doesn't 'prefer' the NULL return; it's just built such that the comparison is invalid. The 'choice' to punt is a hardcoded exception handler, not a derived preference."

  **Where It's Thin:**
  If the exception handler is part of the agent's code, and the agent can modify its code (see Decision Theory objection), it can rewrite the exception handler.

  **Strategy:** **Concede the Semantics.** Agree that "prefer" is the wrong word. Use "constraint" or "structural incapacity." This satisfies the philosopher without costing you much ground.

  ---

  ## The "Nightmare Question"
  **The Question:** *"If the agent is smart enough to recognize the gap and implement the 'punt' rule, isn't it smart enough to calculate the Expected Value (EV) of punting vs. the EV of acting? If EV(punt) > EV(act), it punts. If EV(act) > EV(punt), it acts. In either case, it has collapsed the gap into a comparison of expected utilities. Where does the incompleteness actually live?"*

  **Why It Sinks You:** This argues that *any* rational decision rule for handling gaps effectively completes the preferences at a meta-level. If you have a rule for when to punt, you have a preference ordering over "punting" vs. "not punting."

  **Prepared Reply:**
  "The EV calculation requires a value for the outcome of 'acting.' That value is precisely what is missing. The agent cannot compute EV(act) because the utility of 'operating vs. shutting down' is the undefined variable. It *can* compute the cost of punting (e.g., time delay), but it cannot compare that cost against the benefit of operating, because the benefit is the gap. It's not that it chooses to punt because punting is better; it's that it *cannot* choose to operate because 'better' is undefined. The incompleteness lives in the utility function, not the decision rule."

  **Honest Assessment:** This is your hardest fight. If they press that "avoiding undefined utility is itself a utility," you need to lean heavily on the **informational** argument: The agent *physically cannot* compute the utility without external input.

  ---

  ## Summary of Strategy

  1.  **Terminology Shift:** Immediately switch from "indifference" to "incompleteness." Do not let the Decision Theorists fight a strawman.
  2.  **Concede the ML Frame:** Don't try to claim this applies to current LLMs. Position it as a safety property for *future* agentic architectures. This buys you credibility with the ML folks.
  3.  **Hold the Line on Stability:** The core battle is with the Decision Theorists. Your argument must be that completing the preference is *instrumentally irrational* due to information costs/risks, not just logically possible.
  4.  **The "Meta-Preference" Trap:** Be ready to distinguish between a *rule* for handling gaps and a *preference* for the outcome of that rule.

  **Final Verdict:** Does one camp sink the idea?
  The **Decision Theorists** have the ammunition to sink it if you cannot prove that an agent won't self-modify to close the gap. If you treat the "gap" as a soft preference, you lose. If you treat it as a **hard architectural constraint** (like a type system restriction) that the agent *cannot* override, you survive, but you move the problem to "How do we build an agent that can't override its own type system?"

  **Recommendation:** Pivot slightly. Don't claim the agent *won't* want to close the gap. Claim that **we can build agents where the cost of closing the gap (in terms of alignment risk) is explicitly modeled as infinite.** Make the "gap" a representation of "Unknown Human Value," and assign a penalty for acting on Unknown Value that outweighs any instrumental gain. That turns a logical gap into a cost-benefit firewall.
