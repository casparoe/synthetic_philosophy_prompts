answer: |-
  Wikipedia's editorial policies presuppose a social epistemology of testimony that treats historical knowledge as an institutional product of expert consensus rather than an individual empirical achievement, prioritizing procedural reliability over metaphysical truth.

  This framework explicitly rejects an individualist epistemology akin to Thucydides' *autopsy*, where knowledge is validated by the observer's direct engagement with evidence. By forbidding original research and mandating reliance on secondary sources, the policy enforces a division of epistemic labor consistent with John Hardwig's arguments on epistemic dependence: individual users lack the training and access to evaluate primary evidence competently, so they must defer to the institutional filtering of the academic community. This rules out strict Rankean empiricism for the editor, even if it retains Rankean source-dependence for the content; the editor is barred from the critical philological work that defines the professional historian's role, reducing the user to a transmitter of established narratives rather than an investigator. Consequently, the system is incompatible with any epistemology that privileges individual rational assessment of raw evidence over institutional credentialing.

  However, the policy remains underdetermined regarding the metaphysical status of historical truth. A scientific realist and a constructive empiricist could both adhere to these rules, as the requirement is publication in a reliable venue, not correspondence with reality. The rules do not settle whether secondary sources accurately describe the past or merely represent a coherent consensus among historians. What the policy does rule out are fringe epistemologies that grant equal weight to non-institutional claims (e.g., conspiracy theories or amateur revisions), enforcing a boundary work that defines "knowledge" as "what the credentialed community currently publishes." This aligns with Edward Craig's functionalist account of knowledge, where the concept serves to flag reliable informants rather than guarantee metaphysical access to the past.

  The relationship between "verifiability not truth" and the preference for recent scholarship reveals a pragmatic tension rather than a coherent theoretical stance. The "verifiability not truth" standard is agnostic, suggesting a coherence theory of justification where claims are valid if they fit within the web of published literature. Conversely, the preference for recent scholarship implies a progressivist view of historiography, assuming that later accounts are methodologically superior or factually more accurate than earlier ones. These sit together only if one assumes that the academic community converges toward better accounts over time, a claim that is contested in the philosophy of history. While social epistemologists generally accept that testimony is a valid source of knowledge (settled), the notion that historiography exhibits linear progress toward truth is highly contested, with postmodern and narrative theorists (e.g., Hayden White) arguing that shifts in historiography often reflect rhetorical or ideological changes rather than epistemic accumulation. Wikipedia's policy implicitly adopts a progressivist realism for operational purposes while officially maintaining agnosticism to avoid editorial arbitration, a compromise that functions practically but lacks a unified philosophical foundation.
