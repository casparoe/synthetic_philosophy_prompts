answer: |-
  # MORAL LUCK: A DECISION TREE FOR SEMINAR

  **Instructions:** Start at **Q1**. Answer based on your intuitive judgment of the case described. Follow the branches to your position.

  **Q1. Case (a): The Drunk Drivers.**
  Two drivers are equally drunk and reckless. One hits a child who runs into the road; the other gets home safely. Do you *react* differently toward them (e.g., punish, condemn, or feel differently about) the driver who killed the child?
  *   **NO** → Go to **Q3**.
  *   **YES** → Go to **Q2**.

  **Q2. The Nature of the Difference.**
  You react differently. Is this because you have better *epistemic access* to the harm caused, or because there is a genuine *moral difference* between the agents?
  *   **Epistemic Access** (We react differently only because we *know* the harm occurred) → **LEAF 1: The Epistemic View**.
  *   **Moral Difference** → Go to **Q2b**.

  **Q2b. The Constraint Node.**
  Regarding this moral difference: Is it a difference in *how blameworthy they are*, or only in *what else is owed* (e.g., apology, restitution, being the object of grief)?
  *   **Only in What is Owed** → **LEAF 2: Obligations Separatist**.
  *   **Difference in Blameworthiness** → Go to **Q2c**.

  **Q2c. Wrongness vs. Blame.**
  If blameworthiness differs, does the *wrongness of the act* itself also differ (i.e., was killing objectively worse than attempting)?
  *   **NO** (Act is equal, Blame is not) → **LEAF 3: Assessment Luck**.
  *   **YES** (Act and Blame both track luck) → **LEAF 4: Moral Luck Realist**.

  **Q3. Case (b) & (c): Character and Circumstance.**
  (You treat the drivers equally). Consider a person with a racist character due to cruel parents/racist town (Case b), or a German who stayed in 1932 vs. one who emigrated (Case c). Is their blameworthiness reduced by these factors?
  *   **YES** (Luck mitigates blame) → **LEAF 5: Constitutive/Circumstantial Luck**.
  *   **NO** (Character is up to the agent) → Go to **Q4**.

  **Q4. Case (d): Determinism.**
  If character is luck-free, consider a deterministic world where every choice is the product of heredity and upbringing. Is anyone blameworthy?
  *   **NO** → **LEAF 6: Hard Determinist / Skeptic**.
  *   **YES** → **LEAF 7: Strict Control Principle**.

  ***

  ### POSITION LEAVES

  1.  **The Epistemic View:** *Awkward Commitment:* We must pretend agents are equally blameworthy in private moral judgment while punishing them differently in public.
  2.  **Obligations Separatist:** *Awkward Commitment:* An agent can be equally blameworthy yet owe vastly different restitution based on factors outside their control.
  3.  **Assessment Luck:** *Awkward Commitment:* The objective wrongness of an action is identical, but the agent's moral status varies inexplicably with the outcome.
  4.  **Moral Luck Realist:** *Awkward Commitment:* The Control Principle is false; moral worth is partially constituted by factors outside the agent's will.
  5.  **Constitutive/Circumstantial Luck:** *Awkward Commitment:* Resultant luck (outcomes) is morally irrelevant, but the luck of who you *are* determines your blame.
  6.  **Hard Determinist / Skeptic:** *Awkward Commitment:* No one is ever truly blameworthy, rendering our reactive attitudes systematically unjustified.
  7.  **Strict Control Principle:** *Awkward Commitment:* Agents in a deterministic world must possess a metaphysical "causa sui" power to escape the chain of heredity and upbringing.

  ***

  ### ANALYSIS FOR THE INSTRUCTOR

  **Pairs of Positions the Tree Cannot Separate**
  1.  **The Epistemic View vs. Strict Control:** Both deny that luck changes *metaphysical* blameworthiness. The tree separates them based on *reaction* (Q1), but a Strict Control proponent might admit we *do* react differently (due to human weakness) while maintaining we *should not*. If a student answers "YES" to Q1 based on descriptive psychology rather than normative justification, they may be misrouted to the Epistemic View.
  2.  **Assessment Luck vs. Moral Luck Realist:** Practically, these positions yield identical treatment of agents. The distinction rests entirely on the metaphysical status of the *act's wrongness* (Q2c), which is often inseparable from the assessment of the agent in standard deontic frameworks.

  **Unoccupied Leaves**
  *   **Assessment Luck (Leaf 3):** This leaf is largely **unoccupied** in the literature. It is generally considered **incoherent** or **unattractive** because blameworthiness is standardly thought to supervene on the wrongness of the act and the quality of will. To claim the act is not worse but the agent is more blameworthy requires severing the link between objective wrongness and retrospective blame without relying on epistemic limitations (which are handled in Leaf 1).
  *   **Obligations Separatist (Leaf 2):** This position is **underexplored** in ethical theory but common in **legal theory** (e.g., strict liability torts). It is unattractive to moral philosophers because it suggests moral obligations (restitution) can float free of moral blame, potentially demanding agents "pay" for harms they are not blameworthy for causing.

  **Note on Case Integration:**
  The tree forces the "Blame vs. Owed" constraint (Q2b) to serve as the primary divergent point for Resultant Luck theories, ensuring that "Moral Luck Realists" are distinguished from those who merely accept differential *obligations* without revising the control principle regarding blame.
