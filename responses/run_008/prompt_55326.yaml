      *   Ensure continuous prose. No breaks.
      *   Check constraints: No headings, no bullets, no citations.

  6.  **Writing - Iteration 1 (Mental Check):**
      *   Did I answer the specific question about "equality of what"? Yes, need to be decisive but nuanced. It's mostly Resource Egalitarianism disguised as Capabilities.
      *   Did I address the documentation gate? Yes, it's the brute luck filter.
      *   Did I address the "no changing the game" rule? Yes, it's about credentialing/signaling.
      *   Did I discuss concrete changes? Yes, universal design vs. vouchers vs. welfare checks.
      *   Is it continuous prose? Must ensure paragraph transitions are smooth.

  7.  **Writing - Iteration 2 (Focusing on Flow):**
