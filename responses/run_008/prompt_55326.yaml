  8.  **Final Polish:** Check for any accidental bullet points or headings. Ensure the voice is consistent. (Self-Correction: Make sure I don't sound *too* dismissive of the committee, but analytically critical.)

      *   *Key insight to weave in:* The documentation requirement is actually anti-Capabilities because Capabilities cares about the *freedom to achieve*, not the *cause of the restriction*. If I can't take the exam because of anxiety, Sen doesn't care if it's "medical" or "situational," he cares that I can't function. The committee cares deeply about the cause. This proves it's Resource Egalitarianism (compensating for bad luck).
      *   *Key insight on "No Changing the Game":* This protects the *signal* of the degree. If we change the exam, the degree means something different. This is about Fair Equality of Opportunity (Rawlsian-ish), not welfare.

      *   *Drafting the response...* (keeping in mind the "long email" vibe).

