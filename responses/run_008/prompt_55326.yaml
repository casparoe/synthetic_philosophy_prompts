answer: |-
  It is genuinely striking how often institutional practices operate on a kind of muscular intuition that collapses under the slightest philosophical pressure, and you have put your finger on exactly why the accommodations office feels so morally robust yet theoretically incoherent. What you are describing is not a pure instantiation of any single theory of equality, but rather a pragmatic hybrid that leans most heavily on resource egalitarianism while wearing the clothes of the capabilities approach, all in the service of protecting a specific notion of fair equality of opportunity. To untangle this, we have to look at what the committee was actually distributing, what it was demanding in return, and what it refused to touch. The practice presupposes resource egalitarianism because it treats disabilities as deficits in internal resources that need to be offset by external resources, and the documentation requirement is the mechanism for distinguishing brute luck from option luck. When you require a medical letter, you are effectively asking the student to prove that their disadvantage is a matter of bad luck rather than preference or choice, which is the core distinction in resource-based theories of justice. You are compensating for a lack of internal assets—like neural processing speed or sensory filtering—by handing them external assets like extra time or quiet spaces, aiming to bring their total resource bundle up to some normative baseline.

  However, the reason it feels like the capabilities approach is that the justification is almost always phrased in terms of functionings. You are not giving them time so they have more stuff; you are giving them time so they can demonstrate their knowledge. You are giving them a note-taker so they can access the lecture. In the capabilities framework, the focus is on what people are actually able to do and be, and accommodations are clearly conversion factors that allow resources to turn into functionings. But here is where the practice diverges from a true capabilities approach: a strict capabilities theorist would care less about the medical cause of the limitation and more about the limitation itself. If a student cannot function in a noisy room because of anxiety caused by working night shifts, a capabilities approach would say their freedom to achieve the functioning of taking an exam is restricted just as much as the student with a documented sensory processing disorder. The fact that your committee rejected the former and accepted the latter proves that the underlying logic is not about capabilities per se, but about compensating for specific kinds of bad luck, which returns us to resource egalitarianism. The documentation gate is not just bureaucratic inertia; it is the philosophical filter that separates those owed compensation from those who are merely unlucky in a way the university does not insure against.

  This leads directly to your question about the mantra that accommodations must level the playing field but never change the game. This rule reveals that the ultimate goal of the university is not student welfare, nor is it even the maximization of capabilities in a broad sense, but rather the maintenance of a credible signaling mechanism for the labor market. If you adjust the grading standard or change the exam questions fundamentally, you alter the information content of the degree. The committee's refusal to touch the transcript or the grading rubric presupposes that the university is a site of competitive opportunity where the prize is a credential that certifies a specific standard of competence. This is fair equality of opportunity in its most rigid form. We are ensuring that everyone has the same chance to prove they meet the standard, but we are not lowering the standard itself, because the value of the degree depends on its uniformity. If we were pursuing welfare egalitarianism, we would care about the stress levels and the subjective well-being of the student, and we might allow pass-fail options or reduced loads without penalty if that maximized their happiness or minimized their suffering. We don't do that because the university is not primarily a welfare institution; it is a credentialing institution. So the practice is a blend: resource egalitarianism determines who gets help, the capabilities approach provides the language of access, but fair equality of opportunity determines the limits of that help.

  There is, however, a significant area where the practice is genuinely underdetermined, meaning two or three different theories could license the current setup without demanding changes. Both resource egalitarians and capabilities proponents would agree on providing a quiet room to a student with ADHD. The resource egalitarian sees it as compensating for an internal deficit; the capabilities proponent sees it as enabling a functioning. Both would agree on the outcome even if they disagree on the justification. Similarly, both welfare egalitarians and capabilities proponents might agree on extended deadlines, though the former sees it as reducing anxiety and the latter as enabling the completion of the task. This overlap is why the committee could function without agreeing on the philosophy; the practical interventions sit at the intersection of these theories. The friction only appears at the margins, like when a student asks for a modification that looks like changing the game, or when a student without documentation claims a functional limitation. At those margins, the resource egalitarian logic wins out because it is the only one that provides a clear cutoff point for liability and cost.

  If you were to rebuild the office's rules around a pure capabilities approach, the changes would be radical and would likely dismantle the documentation requirement as it currently stands. A capabilities-focused system would care about the functional limitation, not the medical etiology. You would move toward universal design, where the quiet room is available to anyone who requests it because the capability of concentrating is what matters, not why you can't concentrate. You might stop asking for proof of disability and start asking for proof of functional need, or even better, you would assume that variance in human functioning is normal and build flexibility into the curriculum for everyone. You would also likely start measuring whether the accommodations actually worked in terms of learning outcomes, rather than just whether they were provided. If a student gets extra time but still fails because the exam format is inherently biased against their mode of cognition, a capabilities approach demands you change the exam format, even if that looks like changing the game. The focus shifts from fair competition to genuine enablement, which might threaten the signaling value of the degree that the current system protects.

  Conversely, if you rebuilt the system around strict resource egalitarianism, you might actually move away from in-kind accommodations toward cash equivalents or vouchers. The logic here is that if the goal is to equalize resource bundles, the student might know better than the committee how to convert those resources into functionings. Instead of assigning a note-taker, you might give the student a stipend to hire help or buy technology, treating them as a rational agent managing their endowment. The documentation requirement would stay, perhaps even become stricter, because you need to be very sure that the resource deficit is due to bad luck and not expensive tastes or lifestyle choices. You would be less concerned with whether the student actually passes the class and more concerned with whether they were given the fair share of resources to attempt it. The "no changing the game" rule would remain intact, perhaps even strengthened, because the game itself is the metric by which resource conversion is measured.

  If you leaned into welfare egalitarianism, the office would look more like a mental health and financial support service combined. You would likely allow for withdrawals without transcript penalties, pass-fail grading options, and course reductions that don't extend time-to-degree, because the goal is to minimize the negative impact of university on the student's well-being. Documentation might shift from medical diagnoses to assessments of distress or hardship, regardless of source. You might find yourself accommodating the student working night shifts just as readily as the student with a documented sleep disorder, because the welfare loss is the same. However, this is the least likely path for a university because it directly conflicts with the credentialing function. The current system is stable precisely because it balances the moral demand to help with the institutional demand to certify. It uses the language of capabilities to sound benevolent, the mechanics of resource egalitarianism to limit liability, and the logic of opportunity to protect the brand. You sensed the incoherence because it is there; the committee was managing a contradiction between being a supportive community and a competitive filter, and the philosophical mashup you encountered is the only thing keeping those two incompatible goals from tearing the institution apart.
