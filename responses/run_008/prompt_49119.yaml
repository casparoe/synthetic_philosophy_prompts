answer: |-
  This is a classic problem in political ethics, and you have mapped the terrain perfectly. You are wrestling with the conflict between **Universalism** (rules apply to everyone equally) and **Particularism** (obligations depend on relationships).

  Your current working theory ("specific quid pro quo") fails because corruption is often implicit, and because some forms of "favoritism" are institutionalized (pork) while others are taboo (friend expediting).

  Here is a principle that captures almost all your verdicts, the verdict you should sacrifice to make it consistent, and the answer to your diaspora case.

  ### The Principle: "Public-Regarding Reasons"

  The consistent principle is not about whether money changes hands, nor strictly about impersonality. It is about **the justification for the exercise of discretion.**

  **Principle:** *Corruption occurs when an official exercises discretion based on **private-regarding reasons** (personal gain, friendship, transactional exchange) rather than **public-regarding reasons** (merit, statutory duty, constituent welfare).*

  Let's run your cases through this filter:

  1.  **Waiter Tip:** **Fine.** Private sector. The "discretion" (service quality) is part of a private contract where incentives are legitimate.
  2.  **Surgeon (Post-Op):** **Fine.** The medical judgment is already exercised. The wine is gratitude, not an influence on *past* or *future* judgment. It does not distort the medical decision.
  3.  **Surgeon (Pre-Op):** **Not Fine.** Private gift intended to influence future professional judgment. Distorts the medical decision.
  4.  **Wedding Gift (Pending Permit):** **Not Fine.** Even if no favor is asked, the *timing* creates a private obligation that competes with public duty. It introduces a private-regarding reason (social debt) into a public decision.
  5.  **Clientelism (Road for Votes):** **Bad.** The road is allocated based on a private transaction (votes), not public need or statutory formula.
  6.  **Pork-Barrel (Bridge for District):** **Fine.** This is the tricky one, but it fits. A Congressman's *public-regarding reason* is specifically to represent their district. Channeling funds to constituents is the *job*, provided it goes through the legislative process. It is institutionalized partiality, not private gain.
  7.  **Customs Speed Money:** **Not Fine.** The clerk is exercising discretion (speed) based on private gain ($20), not public order (queue position). Your low moral charge is likely due to "systemic dysfunction" (if the system is broken, breaking it back feels less wrong), but in principle, it fails the test.
  8.  **Friend in Permits Office:** **Fine (Your Gut) / Not Fine (The Principle).** This is your inconsistency. Expediting a file based on friendship is a **private-regarding reason**. It violates the queue for others.

  ### The Sacrifice: Which Verdict to Drop?

  To have a coherent ethical framework, **you must drop the verdict on the Friend in the Permits Office.**

  You currently say it is "fine, that's just friendship." But under the "Public-Regarding Reasons" principle, this is corruption (specifically, nepotism or favoritism).

  **Why you must drop it:**
  If you keep "Friend = Fine," you cannot logically condemn the Wedding Gift or the Pre-Op Wine.
  *   The Wedding Gift is just "friendship/culture" with a price tag.
  *   The Pre-Op Wine is just "friendship" with better timing.
  *   The Friend Expediting is "friendship" with a tangible outcome.

  If friendship justifies privileged access to public processes, then the "Public-Regarding" standard collapses. You are left with a system where *who you know* matters more than *what the rules say*.

  **The Cost:** Dropping this verdict feels cold. It demands that we treat friends like strangers when they interact with our public role. This is the Weberian burden: **The tragedy of public office is that it requires a degree of alienation from your private self.**

  *(Note: If you refuse to drop this, your alternative principle is "Market Corruption Only." That would mean money makes it corruption, but friendship does not. This is a valid cultural stance—common in many Mediterranean and Latin American societies—but it is incompatible with the impersonal bureaucracy you seem to value in the Customs and Wedding cases.)*

  ### The New Case: The Diaspora Guy and the Cousin

  **Case:** A diaspora guy calls a ministry friend to unstick his cousin's visa paperwork in a country where "everyone does it."

  **Verdict:** **Corruption (Favoritism), but Socially Sanctioned.**

  Under the "Public-Regarding Reasons" principle, this is corruption. The official is exercising discretion (unsticking the file) based on a private-regarding reason (obligation to a hometown friend), not public merit (eligibility or queue position).

  **However, the context matters:**
  1.  **If the cousin is eligible:** This is "facilitation." It corrects bureaucratic inefficiency. It is ethically lighter but still procedurally corrupt because it privileges one citizen over another equally eligible citizen.
  2.  **If the cousin is ineligible:** This is fraud.
  3.  **The "Everyone Does It" Factor:** This indicates a **clash of moral systems**. The state operates on Weberian Rational-Legal authority (rules apply to all). The society operates on Traditional/Particularistic authority (obligations to kin/clan come first).

  In this context, the diaspora guy is acting as a **cultural translator**. He knows the state *says* one thing (impersonal rules) but *does* another (relational access). By calling the friend, he is navigating the *real* system, not the *nominal* one.

  ### The Weberian Question: Universal or Cultural?

  You asked: *Does my whole pattern of verdicts just amount to taking the Weberian ideal of an impersonal bureaucracy as the standard — in which case, is that standard actually universal, or is it just the one my culture handed me?*

  **Answer:** It is **not universal**, but it is **functional for scale.**

  1.  **It is Cultural:** The ideal of the impersonal bureaucrat is a specific product of European modernity (specifically Prussian and British administrative history). In many parts of the world (Asia, Africa, Latin America, Southern Europe), the moral expectation is precisely the opposite: **If you have power and you do *not* help your friend/family, you are the corrupt one.** You are hoarding public resources for strangers instead of your kin. In those cultures, your "Friend in Permits Office" case is not corruption; it is *moral duty*.
  2.  **It is Functional:** While not universal, the impersonal standard is generally required for large, diverse, modern economies.
      *   **Trust:** Strangers need to trust that the rules apply to them equally to invest and participate.
      *   **Efficiency:** Merit-based allocation is generally more efficient than kinship-based allocation.
      *   **Equality:** Particularism inevitably advantages entrenched networks and disadvantages newcomers/minorities.

  **Conclusion:**
  Your discomfort arises because you are holding two moral maps in your head simultaneously.
  1.  **The Civic Map:** Public office is a trust; rules are blind. (Supports: Customs, Wedding, Clientelism verdicts).
  2.  **The Communal Map:** Relationships are paramount; helping friends is good. (Supports: Friend verdict).

  To resolve your inconsistency, you have to decide which map governs the **Public Sphere**.
  *   If you choose **Civic**, you must condemn the Friend case. (Recommended for consistency).
  *   If you choose **Communal**, you must accept the Wedding Gift and Pre-Op Wine as "culturally nuanced." (Recommended for psychological comfort, but ethically messy).

  **My advice:** Keep the Civic Map for public office. It is the only one that scales. Acknowledge that this makes you a "bad friend" in the traditional sense, but a "good citizen" in the modern sense. The tension you feel is the price of living in a modern state rather than a village.

  **Final Verdict on the Diaspora Case:** It is corruption by the standard you are trying to build (Public-Regarding Reasons). It is moral solidarity by the standard of his hometown. If he wants to live by the Weberian standard, he should not make the call. If he makes the call, he is prioritizing his cultural identity over his civic ethics. Neither is "objectively" true, but they are mutually exclusive.
