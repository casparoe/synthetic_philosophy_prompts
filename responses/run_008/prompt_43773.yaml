  6.  **Final Polish:** Organize with clear headings. Ensure the "Verdict" for each section is punchy. (Proceed to generate output based on this structure.)

  7.  *(Final thought before generating)*: Make sure to mention Robert Merton, as Sam is essentially describing "Merton's Law of Multiples." It adds authority to the analysis. Also, mention path dependence for Priya.

