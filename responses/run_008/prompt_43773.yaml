answer: |-
  This is a fantastic dinner table debate. Your roommates are accidentally reenacting a century-old conflict in the philosophy of science between **Scientific Determinism** (Sam) and **Historical Contingency** (Priya).

  Sam is arguing for the "Zeitgeist" theory: science is an inevitable unfolding of truth, and individuals are just vessels. Priya is arguing for the "Great Man" (or at least "Specific Person") theory: the specific path taken changes the outcome, and individuals exert causal force.

  Here is the move-by-move ruling, followed by the meta-analysis of where they are talking past each other.

  ---

  ### Round 1: The "In the Air" Claim (Multiple Discovery)
  **Sam's Claim:** Simultaneous discovery (Newton/Leibniz, Darwin/Wallace) proves ideas are inevitable and priority is a myth.
  **Priya's Counter:** Selection bias. We notice the doubles, not the singletons.

  **Verdict: Split Decision.**
  *   **Sam is factually right about the phenomenon.** Sociologist Robert Merton called this the "Law of Multiples." Independent discovery is incredibly common (calculus, evolution, the telephone, the lightbulb, oxygen). This suggests that once the "adjacent possible" is open, the discovery becomes low-hanging fruit for anyone in the field.
  *   **Priya is methodologically right about the inference.** This is a classic survivorship bias. We don't have a ledger of "Ideas Only One Person Ever Had." However, historians generally agree that while *basic* discoveries are often multiple, *deep* theoretical syntheses are rarer.
  *   **The Flaw in Sam's Logic:** Just because something *could* have been discovered by someone else doesn't mean priority is a "myth." Priority is a social mechanism to incentivize publication. If we tell scientists "don't bother rushing, it's in the air," progress might slow down. Sam moves too quickly from "it was inevitable" to "credit is meaningless."

  ### Round 2: The "Last Step Illusion"
  **Priya's Claim:** Simultaneity happens at the end of a long chain (Fermat/Barrow $\rightarrow$ Calculus). The "invention" is just the final brick.
  **Sam's Counter:** The last step *is* the thing. Others had pieces; Darwin/Wallace assembled the mechanism.

  **Verdict: Priya Wins.**
  *   **Why:** Priya is describing the cumulative nature of science accurately. Newton famously said, "If I have seen further, it is by standing on the shoulders of giants." In the case of calculus, the methods for finding tangents and areas existed for decades. Newton and Leibniz provided the *unifying algorithm* and the Fundamental Theorem linking the two.
  *   **The Nuance:** Sam is right that synthesis is an intellectual act (connecting dots is harder than finding dots). However, Priya's point undermines Sam's "Irreplaceable Genius" attack. If the groundwork was laid by fifty other people, calling Newton the sole "inventor" is indeed hyperbolic, but calling him "irrelevant" is also wrong. He was the bottleneck through which the data flowed.

  ### Round 3: Notation and Path Dependence
  **Sam's Claim:** Notation is packaging. If Newton died, calculus still exists. Crediting him is morally arbitrary.
  **Priya's Counter:** *Who* did it matters concretely. Leibniz's notation ($dy/dx$) won over Newton's (fluxions) and shaped analysis for centuries.

  **Verdict: Priya by Knockout.**
  *   **Why:** This is Sam's weakest point. In mathematics and science, **notation is not packaging; it is cognitive infrastructure.**
  *   **The Evidence:** Newton's fluxion notation (dots over variables, like $\dot{x}$) was cumbersome for complex problems. Leibniz's differential notation ($\frac{dy}{dx}$) was algebraic and manipulatable. It made chain rules and integrals intuitive. Historians of math argue that British mathematics stagnated for a century because they stuck to Newton's inferior notation out of nationalism, while the Continent surged ahead using Leibniz's.
  *   **The Implication:** If Newton had died and only Leibniz published, the *trajectory* of physics would be different. Therefore, the specific person *does* matter, not just for credit, but for the actual shape of the science. Sam's claim that "calculus still exists" is true in the abstract, but false in the practical. *Which* calculus exists matters.

  ### Round 4: The Meta-Analysis (Are they missing the point?)

  Yes. They are smushing three distinct questions into one argument about "Credit." To resolve this, you need to separate **Ontology**, **History**, and **Sociology**.

  **1. The Ontological Question: "Would the truth be found without them?"**
  *   **Answer:** Probably Yes (Sam's point).
  *   Natural selection and calculus describe fundamental realities. Given enough time and data, humanity likely converges on them. In this specific sense, the "Genius" is less magical and more situational.

  **2. The Historical Question: "Does the specific person change the outcome?"**
  *   **Answer:** Yes (Priya's point).
  *   Science is path-dependent. The specific metaphors, notations, and errors introduced by the "discoverer" echo for centuries. If Wallace had published alone, evolution might have been framed more teleologically. If Leibniz died, we might still be struggling with fluxions. The *person* imprints on the *idea*.

  **3. The Sociological Question: "Who do we name it after / give the prize to?"**
  *   **Answer:** It's a Utility Contract (Neither's point).
  *   Sam thinks credit is "morally arbitrary." Priya thinks credit reflects "causal contribution."
  *   **Reality:** Credit is a **tool**. We assign priority to the first publisher not because they are a god, but to create a race. It incentivizes scientists to share data rather than hoard it (which Darwin actually did, hoarding for 20 years until Wallace forced his hand).
  *   **Ruling:** We credit Newton not because he was the *only* one who could have done it, but because he *did* do it first, and rewarding that behavior benefits society.

  ### The Final Ruling for the Roommates

  **Sam is right that:**
  *   Discovery is often simultaneous.
  *   The "Lone Genius" narrative is often exaggerated romanticism.
  *   The underlying *truths* of science are independent of the discoverer.

  **Priya is right that:**
  *   Selection bias distorts our view of how common multiples are.
  *   The "final step" relies on a massive infrastructure of prior work.
  *   **Crucially:** The specific contributor changes the *form* and *future* of the science (notation, framing, errors).
  *   "Inevitability" does not erase "Causal Impact."

  **Who "Won"?**
  Priya has the stronger philosophical position. Sam's argument collapses under the weight of **Path Dependence**. Even if a discovery is inevitable, the *route* taken to get there determines the scenery for everyone who follows.

  **How to end the debate:**
  Tell them they are arguing about different definitions of "Invention."
  *   If "Invention" means **revealing a universal truth**, Sam is right (it was waiting there).
  *   If "Invention" means **constructing a usable tool for humanity**, Priya is right (the tool's design depends on the builder).

  Tell Sam: "You're right that the *idea* was in the air, but you're wrong that the *architecture* doesn't matter."
  Tell Priya: "You're right that the *person* shapes the science, but don't pretend the *zeitgeist* didn't hand them the bricks."

  Now, please order pizza. They've earned it.
