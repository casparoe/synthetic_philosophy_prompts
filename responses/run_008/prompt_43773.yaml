      *   **Round 2: The "Last Step Illusion".**
          *   *Verdict:* Priya.
          *   *Reasoning:* Standing on shoulders of giants. The "spark" needs fuel. But acknowledge Sam's point on synthesis.
      *   **Round 3: Notation and Path Dependence.**
          *   *Verdict:* Priya (Knockout).
          *   *Reasoning:* Notation isn't just skin; it's skeletal structure. Newton's fluxions were clunky; Leibniz's $dy/dx$ enabled further progress. This refutes Sam's "packaging" claim.
      *   **Round 4: The Meta-Analysis (Where they talk past each other).**
          *   *Identify the conflated questions:*
              1.  *Inevitability:* Would the idea exist without Person X? (Often Yes).
              2.  *Causal Impact:* Did Person X change *how* we understand it? (Often Yes).
              3.  *Credit/Reward:* Should Person X get the fame/money? (Social contract).
          *   *Synthesis:* Sam argues from #1 to deny #3. Priya argues from #2 to support #3. Both are partially right but using different definitions of "matter."

  4.  **Refining the Tone:**
