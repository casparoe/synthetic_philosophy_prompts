      *   *Decision Procedure:*
          *   Since epistemic certainty is impossible (as the Master says), rationality shifts from *prediction* to *alignment*.
          *   Can you endorse the *process* of transformation even if the outcome is unknown?
      *   *Weighting Selves:*
          *   The pre-commitment self must authorize the surrender of authority. This is a second-order volition (Frankfurt). Do you *want* to want what the vows will make you want?
          *   Rationality here isn't maximizing expected utility (unknown), but maintaining integrity of will.
      *   *Conclusion:* The decision is an act of faith/reason hybrid.

