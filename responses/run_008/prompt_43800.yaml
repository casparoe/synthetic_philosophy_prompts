answer: |-
  Thank you all for being here. For those of you who knew my grandfather only as a gardener, a father, or a storyteller, you know the most important thing about him already: when he was with you, he was *with* you. There were no distractions. There was no part of him held back for later. He was entirely, fully, in the room.

  For those of you who knew him as a philosopher, you know he had very specific instructions for this day. He left a note. He asked that we not comfort ourselves with the idea that he is "still out there" somewhere in the past, or that pieces of him are scattered along a timeline like beads on a string. He didn't believe that time worked that way. He didn't believe *people* worked that way.

  He believed that we are wholly present. That means that when he held you, he wasn't just a slice of a man; he was all of him. And it means that now that he is gone, he is truly gone. He wouldn't want us to pretend otherwise. He thought it was cowardly to hide from the reality of loss behind clever ideas about eternity. He had a deep suspicion of big, abstract systems that tried to explain away the dirt and the silence. He preferred the dirt.

  And this is where I think we can find our comfort. Not in the idea that he survives, but in the reality of what *happened*.

  If endurantism is true—if we are wholly present at every moment we exist—then every moment my grandfather lived was complete. The love he gave wasn't a down payment on future love; it was the full amount. The patience he taught, the tomatoes he grew, the arguments he had, the silence he kept when listening to a grandchild's story—all of it was real, fully and completely, at the time it occurred.

  The fact that those moments have stopped does not make them less real. It makes them precious.

  For a man who spent his life thinking about what it means *to be*, the end of being was not a puzzle to be solved, but a boundary to be respected. He taught us that presence is a gift, not a guarantee. And because he is not here now, we can feel the weight of how fully he was here then. The silence in his garden is loud, yes. But that silence is proof of the life that filled it.

  I know there are people in this room who saw time differently than he did. Specifically, I know there is one person in the front row who spent forty years telling him he was wrong about this.

  [Friend's Name], Grandpa didn't want me to say that you two were "two halves of a whole" or that your friendship spans a block universe. He would have called that nonsense. But he did tell me, once, that a good argument is a way of paying attention. He said that for forty years, you never stopped paying attention to him. You never let him get away with a sloppy definition or an unexamined premise. You honored him by taking his mind seriously, even when you thought it was mistaken.

  He loved you for that. He didn't need you to agree with him to know that you were with him. In a way, the argument itself was a testament to his view of things: it was a real thing, happening in real time, between two whole people who showed up for each other, week after week, until the end.

  To the rest of the family: We cannot have him back. We cannot find him in the past, and we cannot wait for him in the future. But we can stand in the present, which is the only place he ever trusted anyway.

  We honor him by being wholly present ourselves. When we eat the food he taught us to cook, let's taste it fully. When we tell his stories, let's tell them completely. When we grieve, let's grieve without apology. He was here. He was real. And the fact that he is gone now doesn't change the truth of what he was when he was here.

  He was a gardener. He knew that things grow, they bloom, and they fade. He didn't plant tomatoes expecting them to last forever. He planted them because they were good for the table, and because the soil would be richer for having held them.

  Grandpa is not in the soil. He is not in the stars. He is not in the past. He is finished. But we are still here. And as long as we are, the world he shaped, the people he loved, and the truth he lived are still here too, wholly present with us, for as long as we last.

  Thank you.
