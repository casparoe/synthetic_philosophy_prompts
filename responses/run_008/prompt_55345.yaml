answer: |-
  You have struck at the very heart of the matter, and I shall not pretend otherwise. This is the aggregation problem, famously articulated by Parfit, and it remains the most significant pressure point for contractualism. You have set the trap precisely: if I adhere to the Individualist Restriction—that we compare complaints one person at a time, never summing them across persons—I appear forced to choose Option A. Yet, to many intuitions, sacrificing a million hours of life expectancy (aggregate) for one person's mobility seems morally dubious, if not outright wrong.

  Let me state the contractualist verdict clearly, before I address the cost of holding it. On the strict reading of the principle you have outlined, I must choose Option A. Here is why.

  To determine whether an act is wrong, we ask whether any principle permitting it could be reasonably rejected. Consider a principle that permits Option B (repaving the potholes) at the expense of Option A. The housebound resident can reject this principle. Her complaint is that she remains permanently confined, unable to participate in the public life of her city. This is a catastrophic impairment of her agency and well-being. Now, consider the complaint of any single commuter against a principle that permits Option A. Their complaint is that they lose roughly one hour of life expectancy over a decade due to road wear. Whilst any loss of life is regrettable, an hour over ten years is negligible. It does not disrupt their life plans, nor does it significantly impair their agency.

  When we compare these complaints individually—as the Individualist Restriction demands—the resident's complaint is vastly weightier than any single commuter's. Therefore, a principle that prioritises the commuters over the resident is one that the resident could reasonably reject. Conversely, a principle that prioritises the resident is one that no single commuter could reasonably reject, given the triviality of their individual loss. Thus, contractualism dictates Option A.

  Now, to your charge: does this not imply abandoning the no-summing restriction if I were to choose B? Yes, absolutely. If I were to say, "The million commuters' complaints *together* outweigh the resident's," I would be summing strengths across persons. That is utilitarianism in contractualist clothing, and it undermines the core contractualist idea that we owe justification to each individual separately, not to a collective blob of welfare.

  However, I must be self-critical here. Your move lands. It exposes a genuine vulnerability in the theory. There is a strong intuitive pull to the idea that sufficiently many small harms *should* outweigh a single large benefit, or at least that there is a point where the sheer number of sufferers matters. If contractualism cannot account for this without collapsing into aggregation, it risks appearing fetishistically individualistic, ignoring the moral significance of widespread suffering simply because it is distributed.

  Does this make me abandon contractualism? Not yet. But it forces a patch. Scanlon himself recognised this in later work ('When Does the Sum Matter?'), suggesting that we might allow aggregation where the individual complaints are of a similar kind and the burden on the single individual is not catastrophic. However, you have asked me to hold the line on the no-summing restriction. So, I must defend the verdict without that patch.

  I live with this horn of the dilemma by insisting that our moral theories must protect the individual from being sacrificed for the diffuse benefits of the many. If we allow the commuters' claims to aggregate, we open the door to a tyranny where anyone can be crushed provided enough people gain a trivial benefit. The resident is not merely a container of welfare; she is a sovereign individual to whom justification is owed. To tell her, "Your confinement is necessary so that a million others might save an hour each," is to fail to take her seriousness as a person seriously.

  That said, I concede this looks harsh. For contractualism to remain viable in the face of your challenge, it must be true that the individual's claim to non-sacrifice is lexically prior to aggregate welfare gains of a trivial nature. If you can show me a case where the individual's loss is minor but the aggregate loss is catastrophic (e.g., one person loses a finger, a million people lose a life), and contractualism still protects the one, then I would have to abandon the theory. But in your case, the resident's loss is life-defining. I stand on the principle: we compare complaints individually, and the resident wins.

  How do you propose to shift the weights without invoking summation?
