answer: |-
  **Discussion Memo: Deconstructing the "No Single Vote" Slogan**
  **To:** Political Science Department Reading Group
  **From:** [Your Name]
  **Re:** Precision on Pivotality and Consequentialist Turnout

  Following our last session on rational-choice theories of turnout, I wanted to circulate a breakdown of the claim that *"no single vote has ever decided an election."* As discussed, this slogan is often deployed as a conversation-ender regarding consequentialist reasons to vote. However, the sentence is ambiguous across empirical, causal, and decision-theoretic dimensions.

  Below is a menu of six distinct theses that this sentence could express, ordered from near-truism to genuinely contentious. For each, I have assessed its truth value, its ability to support the conclusion that there are no consequentialist reasons to vote, and its robustness against edge cases like the 2017 Virginia House of Delegates tie (District 94).

  ### 1. The Strong Historical Claim
  *   **Precise Thesis:** In the history of recorded elections, there has never been an instance where the margin of victory was exactly one vote.
  *   **Status:** **Outright False.**
  *   **Analysis:** There are documented cases of one-vote margins in local and state legislative elections (e.g., the 1910 New York State Assembly race, various municipal contests).
  *   **Relevance to Turnout:** If false, it cannot support a normative conclusion.
  *   **Virginia Stress Test:** **Fails.** While the 2017 VA race ended in a tie, the existence of ties implies that *one* additional vote would have created a one-vote margin. Furthermore, other elections have ended with a margin of one.

  ### 2. The Strict Counterfactual Claim
  *   **Precise Thesis:** For any specific voter $V$ in any past election $E$, changing $V$'s behavior (from abstention to voting, or from Candidate A to B) would not have changed the winner.
  *   **Status:** **Outright False.**
  *   **Analysis:** In any election ending in a tie (like VA-94), a single additional vote for either candidate changes the winner. In any election decided by one vote, a single switch changes the winner.
  *   **Relevance to Turnout:** If false, it suggests single votes *can* be decisive, undermining the claim that voting is causally inert.
  *   **Virginia Stress Test:** **Fails.** In VA-94, one additional vote for Simonds or Yancey would have decided the outcome outright, avoiding the coin toss.

  ### 3. The Ex Post Causal Claim
  *   **Precise Thesis:** In any election where a candidate wins, the victory is overdetermined; therefore, no single ballot can be identified as the *sole necessary cause* of the outcome (unless the margin was exactly one).
  *   **Status:** **Platitude / Near-Truism.**
  *   **Analysis:** In any election with a margin $>1$, removing one vote does not change the outcome. Causality is distributed across the coalition.
  *   **Relevance to Turnout:** **Weak.** This is an *ex post* observation about history. It does not address the *ex ante* decision problem faced by a voter before the election occurs. Knowing that most past votes weren't pivotal doesn't prove your current vote won't be.
  *   **Virginia Stress Test:** **Survives.** In non-tied elections, this holds. But it admits that in tied or one-vote margin cases, the claim does not hold.

  ### 4. The Ex Ante Probability Claim (The "Gelman" Reading)
  *   **Precise Thesis:** The *ex ante* probability ($P$) that a specific vote will be pivotal in a large-scale election is vanishingly small (approaching zero).
  *   **Status:** **Substantive and Defensible.**
  *   **Analysis:** This is the standard rational-choice argument (e.g., Gelman, Katz, and Bafumi). In large electorates, $P$ is indeed microscopic.
  *   **Relevance to Turnout:** **Insufficient.** Low probability does not equal zero expected utility. If the Benefit ($B$) of the preferred outcome is sufficiently high, $P \times B$ can still exceed the Cost ($C$) of voting.
  *   **Virginia Stress Test:** **Survives.** The VA case shows $P$ is not *literally* zero, but it remains extremely low. This thesis accepts the rarity of pivotality without denying the possibility.

  ### 5. The Expected Utility Claim
  *   **Precise Thesis:** For any individual voter, the expected consequentialist benefit of voting ($P \times B$) is always less than the cost of voting ($C$).
  *   **Status:** **Genuinely Contentious.**
  *   **Analysis:** This is the actual premise required to conclude one should not vote. It relies on assumptions about the magnitude of $B$ (the difference between candidates). If $B$ is existential (e.g., democracy vs. authoritarianism), $P \times B$ may exceed $C$ even if $P$ is tiny.
  *   **Relevance to Turnout:** **Necessary.** This is the only thesis that logically entails the normative conclusion "do not vote for consequentialist reasons."
  *   **Virginia Stress Test:** **Vulnerable.** In VA-94, the $B$ included control of the entire state chamber. For voters in that district, $P$ was high enough and $B$ was high enough that $P \times B > C$ was a plausible calculation.

  ### 6. The Normative Dismissal
  *   **Precise Thesis:** Therefore, there are *no* consequentialist reasons to vote (only expressive or duty-based reasons).
  *   **Status:** **Non-Sequitur (without Thesis 5).**
  *   **Analysis:** This conclusion only follows if Thesis 5 is accepted. It does not follow from Theses 1, 2, or 3.
  *   **Relevance to Turnout:** This is the colleague's desired conclusion.
  *   **Virginia Stress Test:** **Fails.** In VA-94, there *was* a consequentialist reason to vote because the probability of pivotality was non-negligible and the stakes were high.

  ***

  ### Summary for Discussion

  **1. The Mismatch Between Slogan and Argument**
  To shut down the discussion on consequentialist voting, our colleague needed **Thesis 5** (Expected Utility is negative). However, the slogan uttered ("No single vote has ever decided...") asserts **Thesis 1 or 2** (Historical/Counterfactual Impossibility).
  *   **Thesis 1 & 2** are empirically false (due to ties and one-vote margins).
  *   **Thesis 5** is theoretically possible but empirically debatable (depends on $B$).
  *   **The Gap:** Moving from "votes are rarely pivotal" (Thesis 4) to "votes are never worth casting" (Thesis 6) requires a specific claim about the magnitude of stakes ($B$) relative to costs ($C$), which the slogan obscures.

  **2. The Municipal Inconsistency**
  Our colleague notes he votes in municipal elections. This behavior is inconsistent with **Thesis 1** (if he believes municipal votes *can* matter, then single votes *can* decide elections) and suggests he implicitly rejects **Thesis 5** for small electorates.
  *   In municipal elections, $P$ is orders of magnitude higher than in federal elections.
  *   If he votes municipally for consequentialist reasons, he admits $P \times B > C$ is possible.
  *   If he admits this is possible in small elections, he cannot use the *logical structure* of the paradox to rule it out in large elections, only the *empirical magnitude* of $P$. The slogan "no vote has ever decided" denies the possibility entirely, rather than weighing the probability.

  **3. The Virginia Lesson**
  The 2017 Virginia House of Delegates race demonstrates that:
  *   **Thesis 1 & 2 are false:** One vote *would* have decided the chamber control.
  *   **Thesis 4 is nuanced:** $P$ is small, but not zero.
  *   **Thesis 5 is context-dependent:** For a voter in VA-94, the consequentialist reason to vote was exceptionally strong. For a voter in a safe district, it was weak. A universal slogan cannot capture this variance.

  **Recommendation for the Group:**
  We should press the colleague to specify whether they are making an empirical claim about history (which is falsifiable) or a decision-theoretic claim about expected utility (which requires arguing about $B$ and $C$, not just $P$). If the latter, the slogan is a distraction; if the former, it is incorrect.
