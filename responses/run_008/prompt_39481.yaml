      *   Survive Virginia tie? Yes.

  8.  *(Self-Correction during drafting)*: Make sure to explicitly mention the "Virginia 94th District" case as a stress test for each thesis. It's a key part of the user's prompt.

  9.  *(Final Review)*: Does this help the PhD student circulate this to a reading group? It needs to look like a handout or a memo. I will format it as a "Discussion Memo."

