answer: |-
  ### (1) Exam Question

  **Time Allowed:** 90 Minutes
  **Instructions:** Answer the following question in essay form. Clarity of argument and precision of terminology are prioritized over historical exposition.

  **Question:**

  Consider the following proposal regarding the epistemic status of the Church-Turing Thesis (CTT): CTT is neither a stipulative definition nor a straightforward empirical conjecture, but rather an **inductive generalization**. On this view, the thesis is supported by the fact that multiple formally precise explications of "effective calculability" (e.g., general recursion, lambda-definability, Turing machines) were independently motivated yet proved extensionally equivalent.

  Assess this inductive proposal against two specific challenges:

  1.  **The Biased Sample Objection:** Critics argue that because all proposed formalisms were designed to capture the *same* pre-theoretic intuition, their equivalence is not independent evidence but a result of shared design constraints. There is no enumeration of all possible formalisms, so the "sample" may be biased.
  2.  **Malament-Hogarth (MH) Spacetimes:** In certain relativistic spacetimes, an observer following a specific worldline can, in principle, receive the output of a computation performing an infinite number of steps within the observer's finite proper time.

  In your essay, you must: (a) evaluate whether the Biased Sample objection undermines the inductive support for CTT; (b) distinguish between the *mathematical* CTT (concerning effective calculability) and the *physical* CTT (concerning physical computability); and (c) determine whether MH spacetimes constitute a counterexample to the inductive generalization view of the *mathematical* thesis. Conclude by stating what kind of evidence *would* falsify the CTT under the inductive reading, if MH spacetimes do not.

  ***

  ### (2) Model Answer

  The inductive generalization view posits that the Church-Turing Thesis (CTT) gains credibility through the convergence of distinct formalisms. Unlike a definition, which is true by fiat, or a simple empirical law, this view treats CTT as a robust generalization: every precise attempt to capture "effective calculability" coincides with Turing-computability. However, this epistemic status is fragile when scrutinized against the nature of the "sample" and the domain of applicability.

  The Biased Sample objection strikes at the heart of the inductive claim. For an induction to be strong, the sample instances should be independent. However, Church, Turing, and Post were not discovering pre-existing natural kinds in isolation; they were analyzing the same informal notion of an algorithmic procedure. Their formalisms were constrained by the same pre-theoretic intuition of step-by-step mechanical derivation. Consequently, their extensional equivalence demonstrates the stability of that *intuition*, not necessarily the necessity of the Turing limit. The "sample" is biased because the target concept was fixed prior to the formalization. Thus, the inductive support is weaker than it appears; it confirms the coherence of the intuitive concept, but not that the concept is exhaustively bounded by Turing machines.

  This weakness becomes critical when addressing Malament-Hogarth (MH) spacetimes. To assess MH, one must distinguish the *mathematical* CTT from the *physical* CTT. The mathematical thesis claims that any function effectively calculable by a human following an algorithm is Turing-computable. The physical thesis claims that any function computable by a physical system is Turing-computable. MH spacetimes challenge the *physical* thesis: they suggest a physical setup where a non-Turing-computable function (e.g., the Halting Problem) could be decided via relativistic time dilation.

  However, MH spacetimes do not falsify the *mathematical* CTT, nor do they undermine the inductive generalization regarding *effective calculability*. An MH computation relies on specific geometric features of spacetime to complete a supertask; it is not "effective" in the sense of a finite, repeatable procedure followable by a human agent without access to that specific relativistic geometry. The inductive generalization concerns formal analyses of *effectiveness*, not *physical realizability*. Since MH setups do not offer a new formal analysis of the intuitive notion of an algorithm (but rather a physical mechanism bypassing algorithmic constraints), they fall outside the sample set of the inductive argument.

  Therefore, under the inductive reading, MH spacetimes are irrelevant to the mathematical thesis. They show that physics might allow more than logic, but they do not show that our concept of "effective procedure" was misanalyzed.

  What, then, would falsify the inductive claim? It would require a new *formal analysis* of effective calculability—motivated by the same pre-theoretic intuition of step-by-step manipulation—that is extensionally stronger than Turing machines. Mere physical possibility is insufficient. The inductive view stands or falls on whether the intuitive concept of effectiveness is inherently Turing-bound, not on whether the universe permits hypercomputation. The Biased Sample objection remains the more potent philosophical threat, as it suggests we have merely circled our own intuition, whereas MH merely shows that intuition is not coextensive with physical law.

  ***

  ### (3) Marking Scheme

  **Total Marks:** 20
  **Passing Threshold:** 10/20

  **Five Must-Hit Points (4 marks each):**

  1.  **Characterization of the Inductive View:**
      *   *Requirement:* Student identifies CTT as a claim supported by the convergence of independent formalisms capturing an informal notion, distinct from a definition or empirical law.
      *   *Common Error:* Treating CTT as a theorem proven by Turing or a mere definition stipulated by Church.
  2.  **Analysis of the Biased Sample Objection:**
      *   *Requirement:* Student explains that the "independence" of formalisms is compromised because all authors targeted the same pre-theoretic intuition, weakening the inductive inference.
      *   *Common Error:* Dismissing the objection by claiming the mathematical proofs of equivalence guarantee the thesis (confusing internal consistency with external justification).
  3.  **Distinction Between Mathematical and Physical CTT:**
      *   *Requirement:* Student explicitly distinguishes "effective calculability" (human/algorithmic) from "physical computability" (laws of nature).
      *   *Common Error:* Conflating the two, arguing that if hypercomputation is physically possible, the mathematical thesis is false.
  4.  **Evaluation of MH Spacetimes:**
      *   *Requirement:* Student argues that MH spacetimes challenge the *Physical* CTT but not the *Mathematical* CTT, as MH setups are not "effective procedures" in the intuitive sense.
      *   *Common Error:* Asserting that MH spacetimes definitively disprove the Church-Turing Thesis without qualification.
  5.  **Falsifiability Condition (The "A" Differentiator):**
      *   *Requirement:* Student identifies that falsifying the inductive view requires a *competing formal analysis of effectiveness* (not just a physical mechanism) that exceeds Turing power.
      *   *Common Error:* Suggesting that building a hypercomputer would falsify the mathematical thesis, or failing to specify what would count as evidence against the induction.

  **Grading Boundary (A vs. B):**

  *   **B Range (10–15 marks):** The student accurately describes the inductive view, the biased sample objection, and the MH scenario. They successfully distinguish the mathematical and physical theses. However, they treat these as separate items to be checked off. They may conclude that MH is "complicated" or simply state that the inductive view is "plausible but debatable" without specifying the conditions of its failure.
  *   **A Range (16–20 marks):** The student integrates the points into a cohesive argument. Crucially, they satisfy Point 5 by articulating the **conditions of falsification**: they recognize that for the inductive generalization to fail, one must break the link between the *intuitive concept* and the *formalism*, not just the link between the *formalism* and *physics*. An A answer explicitly states that MH is a category error regarding the *mathematical* thesis because it bypasses rather than analyzes "effectiveness."
