answer: |-
  Dear Sir,

  It is a genuine pleasure to receive a letter from someone who has found their way into the thickets of probability theory by the practical paths of logistics and quiet reflection on train journeys. You should not apologise for describing things clumsily or fearing you have reinvented wheels; in philosophy, the wheel often needs reinventing because the terrain shifts beneath it, and your description of the problem is sharper than many I have read from those with formal training. You have put your finger on a wound that has troubled mathematicians and philosophers for over a century, and you are quite right to sense that the circle puzzle you mentioned is merely the most famous symptom of a deeper condition. To answer your first question directly, the circle puzzle is indeed known as Bertrand's Paradox, named after the French mathematician Joseph Bertrand who published it in eighteen eighty-nine, but the broader pattern you have identified, the one connecting the circle to your cube factory and the surface of the Earth, is generally discussed under the shadow of what is called the Principle of Indifference.

  The Principle of Indifference is the rule you were implicitly using when you assumed that because you knew nothing about the cube's size other than the range, every edge length should be equally likely. It states that if there is no known reason to prefer one outcome over another, we should assign them equal probability. This seems like common sense, yet as you have discovered with your cube, it leads to contradictions when we describe the same physical situation using different variables. If you assume edge lengths are uniform, volumes are not, and vice versa. The literature on this is vast and stretches from the early work of Keynes, who was deeply sceptical of the principle, to the later attempts by physicists like E.T. Jaynes to rescue it. So, to your point about whether there is a genuine literature beyond the circle puzzle, there certainly is. It is not merely a collection of riddles but a central debate in the foundations of probability concerning how we represent ignorance.

  Now, regarding the boring objection you raised, the one suggesting this is merely sloppy phrasing or an incomplete question. Mathematically, the objection is correct. In the formal language of measure theory, a probability distribution must be specified, and saying pick a random cube without specifying the measure is indeed incomplete, much like asking for the distance between two cities without saying whether you mean by road or by air. However, to dismiss it as merely sloppy is to miss the philosophical point, which is precisely what makes the literature so rich. The puzzle arises because we often want to reason in situations where we genuinely do not know the physical mechanism. We want logic to tell us what to believe when data is absent. If logic fails here, if it yields different answers depending on whether we speak of length or volume, then logic alone cannot guide us from a state of ignorance. The extra ingredient required to solve the cube case is not linguistic precision but physical knowledge. You noted that if you visited the factory, you could measure the frequencies. This is the frequentist solution, which dissolves the paradox by grounding probability in physical propensity rather than logical ignorance. The paradox only survives in the realm of pure reasoning, where we ask what we ought to believe given only the range. Thus, the problem is not just vagueness; it is a limit on what pure reason can achieve without empirical input.

  This brings us to your third point about symmetry, which is perhaps the most subtle part of your inquiry. Your intuition about the Earth is correct and aligns with a respectable programme in probability theory championed by Jaynes. The reason we reject equal steps of latitude in favour of equal areas is that the sphere possesses a physical symmetry; it looks the same from every angle, and our method of choosing a point should not favour the poles over the equator simply because of how we draw our grid lines. This is called transformation invariance. If we rotate the Earth, the probability of landing in the tropics should not change. This symmetry forces a specific mathematical solution. However, your scepticism about the cube is also well-founded. Does the cube factory possess a symmetry? If the machine is calibrated to produce uniform edge lengths, it breaks the symmetry for volume. If it is calibrated for uniform volume, it breaks the symmetry for length. Without knowing the mechanism, there is no physical symmetry to appeal to, only the symmetry of our own ignorance. Jaynes argued that we should look for symmetries in the problem statement itself, such as scale invariance, to derive a unique answer, but many philosophers remain unconvinced, arguing that this smuggles in assumptions about the world under the guise of logical necessity. Your friend who says you can always invent a symmetry to deliver the answer you favour is echoing a serious critique known as the problem of description dependence. In the case of the cube, unless you know something about the manufacturing process, symmetry cannot settle the matter, because the variable you choose to treat as fundamental is itself a choice without physical justification.

  As for the third cousin you mentioned, the person who claims any unknown binary outcome is fifty-fifty, this is indeed the same disease in a cruder form. It is the Principle of Indifference applied to discrete propositions without any justification for symmetry. If I ask whether there is life on a distant planet, saying it is fifty-fifty because it is either yes or no ignores the vast complexity and lack of symmetry between the two states. This is often called the binary fallacy, but it shares the same root as Bertrand's Paradox: it treats the way we carve up possibility space as if it were the structure of reality itself. Whether we are dividing a line, a volume, or a set of propositions, the error lies in assuming that our description of the possibilities dictates their probability, rather than the physical or logical structure of the possibilities dictating the probability.

  You asked me finally to tell you honestly if there is an established concept that captures this whole pattern, or to coin a term if there is not. While historians usually refer to these as failures of the Principle of Indifference or Bertrand-style paradoxes, I think these labels are too technical to capture the geography you are looking for. They name the rule that breaks, but not the phenomenon itself. For your purposes, and perhaps for the clarity of your own thinking, I would suggest we call this The Relativity of Ignorance. This term draws a boundary around the cases you described. Inside the boundary fall all situations where we attempt to assign probabilities based solely on a lack of information, and where the result changes depending on the language or variables used to describe that ignorance. This includes the circle chords, the cube factory, and the binary fallacy. Outside the boundary lie cases where the probability is fixed by physical frequency, like your factory visit, or by genuine physical symmetry, like the Earth's surface. The Relativity of Ignorance reminds us that probability is not always a property of the world waiting to be discovered, but sometimes a property of our description of the world. When we lack data, our probabilities are relative to our chosen framework, much like velocity is relative to a frame of reference in physics.

  I hope this helps to map the terrain you have been traversing on your journeys. You have identified a genuine fissure in the foundation of how we reason about uncertainty, one that separates the mathematicians who demand rigorous definitions from the philosophers who ask how we should think when definitions are impossible. It is a distinction worth holding onto. The circle puzzle is not just a trick; it is a warning that nature does not owe us a uniform distribution simply because we are ignorant. Your intuition that the cube case lacks the settling symmetry of the Earth case is precisely correct, and your suspicion that the fifty-fifty crowd are suffering from the same confusion is equally sound. You have not reinvented the wheel, but you have certainly inspected its spokes with a care that many professionals overlook.

  Yours sincerely,

  A Student of Probability
