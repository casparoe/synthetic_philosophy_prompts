prompt: |-
  You are a philosopher of probability and a careful historian of the subject, used to explaining things to intelligent non-specialists. Please think the matter through properly before you commit to an answer — sketch the candidate diagnoses to yourself, test them against the cases, and only then write — because I'm not after a quick label, I'm after the geography around it. And please write your whole answer in British English, in continuous prose only, as you would in a letter: no headings, no bullet points, no bold, no tables.

  I should say upfront that I have no academic background. I left school at sixteen, worked in logistics all my life, and I think about this sort of thing on train journeys and at weekends. So I apologise in advance if I describe things clumsily or reinvent wheels.

  Some years ago I came across an old puzzle about a circle. If you choose a chord of the circle at random and ask for the chance it is longer than the side of the inscribed equilateral triangle, you can argue your way to one third, or one half, or one quarter, depending on how you go about the choosing: fixing one endpoint and picking the other at random gives one answer, picking a random radius and a random point on it gives another, and picking a random midpoint somewhere in the disc gives a third. I understand this is a famous chestnut with a name attached, and you can give me that name, but that's the easy part, because my question is about a pattern I keep running into that seems bigger than this one puzzle.

  Here is a version I worked out myself. Suppose a machine stamps out metal cubes whose edge lengths all lie between 1 and 2 centimetres, and you pick one cube at random from its output. What is the chance its edge is under 1.5 centimetres? If you assume every edge length in the range is equally likely, you get one half. But if you assume every volume between 1 and 8 cubic centimetres is equally likely, you get roughly a third, since the edges below 1.5 correspond to the volumes below 3.375, which fill less than a third of the volume range. And nothing stops you there: take surface area, or the mass, or the logarithm of the edge, and you get a different answer each time. What struck me is that the second assumption doesn't feel like an error you can catch the way you'd catch an arithmetic slip. The question seems completely specified — one machine, one range of sizes, a random draw — and yet nothing in it fixes what is supposed to be flat. Of course if I actually visited the factory I could watch the machine and discover which distributions really occur, so there is a fact of the matter about the frequencies. The puzzle is about the situation where all you know is the range, and you're asked to reason from that alone.

  The other thing I've noticed is that the cases aren't all alike. If you ask for a random point on the surface of the Earth and want the chance it lies between the tropics, one description does seem forced: you'd want every patch of equal area to be equally likely, and you'd feel that picking every degree of latitude with equal weight is an outright mistake, because the latitude rings near the equator are bigger. Something about the sphere looking the same in every direction seems to settle it. With the cubes, though, I can't find any symmetry that does the settling — or rather, any symmetry I can cook up feels like something I imposed on the problem rather than discovered in it, and a cleverer friend of mine says that's exactly the weakness of the whole approach, that you can always invent a symmetry that delivers whichever answer you were fond of anyway. And then there is a third, cruder cousin of all this that I meet constantly in ordinary conversation: someone says a thing is either so or not so, and therefore the chance is fifty-fifty. That seems like the same disease in an extreme form — treating whatever way you've carved up the possibilities as automatically balanced — although perhaps it's a different disease, since the issue there isn't even a range of a quantity.

  So here is what I want from you. Does this failure mode — where the words "at random" or the idea of equally likely cases, added to a fully specified range, still fail to determine any probability, and where what counts as "equally likely" silently depends on which variable you happened to write the problem in terms of — does that have an established name of its own, and is there a genuine literature on it rather than just on the circle puzzle? Second, I want you to address the boring objection head on: is this nothing more than ordinary vagueness or sloppy phrasing, the sort of thing you'd find in a badly worded exam question, such that a determined person could always say the question is simply incomplete and there is nothing philosophical to explain? If you think it is more than that, say precisely what the extra ingredient is; if you think it really isn't, say what the circle puzzle's reputation rests on. Third, tell me honestly about the symmetry idea — whether generalising my Earth intuition is a respectable programme or a way of smuggling in the answer, and whether the cube case can be handled by it or breaks it. And fourth, if no established concept captures the whole pattern I've described, say so plainly, coin a term for it, and draw its boundaries: which cases of ambiguous randomness fall inside it, which are merely careless phrasing, and where exactly the fifty-fifty crowd fit. Please don't just give me the name of the circle puzzle and consider the matter closed — the label is the least of what I'm asking for.
