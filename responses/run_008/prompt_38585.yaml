answer: |-
  Here is the specification for a theory of Logical Uncertainty, based on the current state of the art (primarily the **Logical Induction** framework developed by Garrabrant et al. at MIRI), annotated with impossibility results and trade-offs.

  ### The Core Trilemma (Jointly Unsatisfiable Subset)
  Before listing the requirements, you need to know the hard constraint. You cannot satisfy the following three properties simultaneously. You must relax at least one:

  1.  **Computability:** The probability assignment function is computable.
  2.  **Standard Coherence (No Dutch Books):** The credences satisfy the axioms of probability theory (e.g., $P(A) + P(\neg A) = 1$, $P(A \land B) + P(A \lor B) = P(A) + P(B)$) at all times.
  3.  **Non-Omniscience:** The agent assigns non-extreme probabilities ($0 < P(\phi) < 1$) to unproven logical statements.

  **Why:** If you satisfy Standard Coherence and Non-Omniscience, you must assign probability 1 to all tautologies. If you are Computable, you cannot recognize all tautologies (due to the undecidability of first-order logic and Gödelian limits). Therefore, a Computable, Non-Omniscient agent *must* violate Standard Coherence temporarily.

  ---

  ### The Requirements Spec

  #### 1. Propositional Consistency (Asymptotic)
  *   **Spec:** If a statement $\phi$ is provable, the agent's credence $P(\phi)$ must converge to 1 as time/compute $\to \infty$. If $\phi$ is disprovable, $P(\phi) \to 0$.
  *   **Force:** **Rationality.** If you never converge to the truth on decidable problems, you are systematically wrong.
  *   **Negotiable:** **No.** A theory of *uncertainty* that doesn't resolve to *certainty* upon verification is not a theory of uncertainty; it's a theory of error.

  #### 2. Bounded Proof Recognition
  *   **Spec:** If a proof of $\phi$ is found within the agent's current resource bounds, $P(\phi)$ must update to $\approx 1$ immediately.
  *   **Force:** **Instrumental Convergence.** There is no benefit to maintaining uncertainty about something you have just verified.
  *   **Negotiable:** **No.** Violating this makes the agent strictly less capable than a simpler lookup table.

  #### 3. Computability
  *   **Spec:** The function assigning probabilities to statements must be Turing-computable.
  *   **Force:** **Physicalism.** You are building this for a physical agent (AI or human) embedded in a universe with finite compute.
  *   **Negotiable:** **Yes (Theoretically).** You can posit an uncomputable "ideal reasoner" (Solomonoff Induction style), but it cannot be instantiated. For your purposes, mark as **Hard Constraint**.

  #### 4. Reflection Principle (Self-Trust)
  *   **Spec:** The agent must assign high probability to the claim that its own future probabilities will be accurate. Formally: $P_t( P_{t+k}(\phi) \in [a, b] ) \approx 1$ if indeed $P_{t+k}(\phi) \in [a, b]$.
  *   **Force:** **Self-Reference.** You requested handling claims where the agent's computation matters. Without this, the agent cannot trust its own reasoning process to make decisions (Löb's Theorem blocks full self-trust, so this must be approximate/asymptotic).
  *   **Negotiable:** **Yes.** You can build an agent that doesn't model itself, but it cannot self-improve or reason about its own output reliably.

  #### 5. Efficiency (No *Efficient* Dutch Books)
  *   **Spec:** There should be no polynomial-time trading strategy that can exploit the agent's prices to make infinite money.
  *   **Force:** **Decision Stability.** If an agent can be exploited easily, it will lose resources to competitors.
  *   **Negotiable:** **Yes (Crucially).** See the Trilemma above. You *must* negotiate the standard "No Dutch Book" requirement down to "No *Efficient* Dutch Book."

  ---

  ### Analysis of Your Dutch Book Concern
  > *"I keep going back and forth on whether that one's a genuine requirement or just a description of one particular research program."*

  It is **impossible** for a bounded, computable agent to satisfy the strict "No Dutch Book" requirement against an agent with arbitrarily more compute.

  If you assign $P(\text{trillionth digit of } \pi = 7) = 0.5$, and a super-intelligence knows the digit is 7, it can bet against you repeatedly. You *will* lose money. This is not a flaw in the research program; it is a fundamental fact of bounded rationality. You are uncertain because you lack compute; an agent with more compute exploits that lack.

  **The Fix:** The requirement must be weakened to **Logical Induction**: You cannot be Dutch-booked by any trader *within your own complexity class* (e.g., polynomial time). This ensures you aren't "stupidly" incoherent, even if you are "boundededly" incoherent.

  ---

  ### The "Naive Empirical" Approach vs. The Spec
  > *"How the obvious move of just treating unproven math like ordinary empirical uncertainty does against the list."*

  Treating logical claims like empirical coin flips (e.g., assigning 50/50 to the Riemann Hypothesis because you haven't seen evidence) **fails the spec catastrophically**:

  1.  **Violates Logical Coherence:** If you know $A \implies B$, empirical uncertainty allows $P(A)=0.5$ and $P(B)=0.1$. Logical uncertainty requires $P(B) \ge P(A)$. The naive approach allows you to be Dutch-booked by a trivial logic check.
  2.  **Fails Proof Recognition:** If you prove $A$, empirical updating requires you to treat the proof as "data." Logical uncertainty requires the proof itself to force $P(A)=1$ by structure, not by Bayesian update on evidence.
  3.  **Fails Reflection:** Empirical uncertainty treats your own brain as a black box. It cannot satisfy the Reflection Principle because it doesn't model the logical connection between your computation and the truth value.

  **Verdict:** The naive approach is just standard Probability Theory applied to the wrong domain. It assumes logical omniscience (by demanding coherence) while practically acting non-omniscient, guaranteeing you will be Dutch-booked by anyone who can do basic algebra faster than you.
