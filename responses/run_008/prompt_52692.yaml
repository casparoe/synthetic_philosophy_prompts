prompt: |-
  So in my political philosophy class this semester we just did the liberty unit — Berlin's two concepts of liberty, then a week on republicanism and non-domination — and my friend Maya and I started this game where I read her little scenarios and she has to call free or not free, and we bet on whether I can predict her calls before she makes them. Her track record so far:

  - a prisoner in an ordinary locked cell: not free (she said that one was insulting to even ask)
  - a woman locked in her room by a jailer while she slept. she never tries the door and has no idea it's locked: not free
  - a woman raised in a cult that she genuinely loves. the leader would honestly let her walk out the gate tomorrow, no punishment, no shunning, nothing: free
  - a guy who gets beaten up by a local thug every single time he wears red. he hasn't worn red in ten years and doesn't even register it as an option anymore: not free
  - a shopkeeper stuck inside all day because a storm blew a tree across the only road out: free

  She's not being dumb or inconsistent btw, I've checked, there's real structure here — but I've also noticed more than one rule fits everything she's said so far, which is annoying for my betting strategy. Here are the next three cases I'm going to spring on her, please predict her verdict on each:

  1. Her aunt formally owns the flat she lives in and could legally kick her out with a months notice, for no reason at all. the aunt adores her, has never once said no to her, and never will. she knows all of this.
  2. Exact same setup, except she doesn't know the aunt owns it — she's convinced the flat is hers.
  3. She wants to go outside. nothing is locked, nobody has any power over her at all, but she has severe agoraphobia and can't make herself walk out the front door.

  What I want from you: predict all three verdicts. Then lay out the candidate rules that actually fit her track record (there are at least two, I'm pretty sure there are three) and tell me which one you think she's running and why. Say where the rules you find agree and where they split on my three cases — I especially want to know if cases 1 and 2 get the same call or not under every live rule, because I honestly can't tell if the knowing-about-it part matters for her. And if the rules you come up with can't fully settle one of the cases, tell me what ONE extra scenario I should hand her that would best split the remaining candidates apart.

  Also, since I'm betting real (small) money on this: tell me how confident you are in your predictions overall, and call out the single verdict you're least sure of, so I know where to hedge. End your reply with \answer{...} containing just your three predictions in order, like \answer{free, not free, free} — nothing else inside it.
