answer: |-
  Your diagnosis is sharp: the debate has shifted from ontology (what *is* the unit?) to epistemology and causation (how do we *model* and *manipulate* the process?). The mathematical equivalence thesis (championed by Okasha, Queller, and others) successfully killed the ontological version of the war. If the Price Equation can be partitioned to show identical dynamics regardless of whether you sum fitness at the gene, individual, or group level, then there is no "fact of the matter" about which level is *the* unit in a metaphysical sense.

  However, the debate is not zombie-ing; it has metastasized into a disagreement about **causal interpretability** and **methodological utility**. It is neither purely verbal nor purely substantive in the traditional sense. It is a dispute about **causal modeling commitments**.

  Here is the diagnosis of the current state of the debate, why it persists, and what could actually resolve (or dissolve) it.

  ### 1. The Diagnosis: Statistical Equivalence $\neq$ Causal Identifiability
  The core reason the fight continues is that biologists and philosophers have realized that two models can be **dynamically equivalent** (predict the same change in gene frequency) but **causally distinct** (imply different mechanisms).

  *   **The Statistical View:** If you accept the Price Equation partitions as merely accounting tools, the debate is verbal. You pick the partition that minimizes variance or simplifies the algebra.
  *   **The Causal View:** If you view evolutionary models as representing causal structures, the equivalence breaks down. A statistical covariance between group trait and group fitness does not automatically imply group-level causation. It could be a byproduct of individual-level selection (the "averaging fallacy" critique).

  **The Disagreement:** The residual fight is about **which partition maps onto the actual causal mechanism.**
  Proponents of Multilevel Selection (MLS) argue that in cases like eusociality or microbial biofilms, the causal leverage is at the group level: intervening on group structure changes outcomes in ways intervening on individual genotypes does not. Gene-centric proponents argue that the "group effect" is always reducible to the causal interactions of vehicles (organisms) propagating replicators.

  This is not verbal. It is a disagreement about **causal granularity**. If you are an interventionist (à la Woodward), a variable is a cause if manipulating it changes the outcome. The debate is now: *At which level do stable, invariant interventions exist?*

  ### 2. Why Pragmatics is Substantive, Not Just Preference
  You hypothesized that the fight is about "explanatory pragmatics" (which description asks better questions). This is correct, but you are underestimating how substantive pragmatics is in science.

  In evolutionary biology, the "unit" you choose dictates your **experimental design**.
  *   **Gene-centric framing:** Leads you to look for specific loci, measure individual reproductive success, and treat social context as noise or a fixed parameter.
  *   **MLS framing:** Leads you to manipulate group composition, measure collective output, and treat individual fitness as a derivative of group success.

  If the MLS framing allows you to discover a mechanism (e.g., quorum sensing in bacteria) that the gene-centric framing obscures because it treats the collective behavior as an anomalous cost to the individual, then the MLS framework is *empirically superior* for that domain, even if the math is equivalent.

  Therefore, the debate persists because different sub-fields find different frameworks more **heuristically fecund**. The debate isn't about truth; it's about **discovery efficiency**.

  ### 3. Is it a Disguised Disagreement About Causation?
  Yes. Specifically, it is a clash between **Process Views** and **Interventionist Views**.

  *   **Process View (often Gene-centric):** Focuses on the continuity of information. The "real" cause is whatever persists through time. Since genes are the only thing physically copied with high fidelity, they are the only true causal units. Selection is a consequence, not a cause.
  *   **Interventionist/Manipulationist View (often MLS):** Focuses on counterfactual dependence. If I destroy the group structure, does the trait disappear? If yes, the group is a causal unit. This view allows for "emergent" fitness that isn't reducible to the sum of parts in a practical sense.

  The stalemate exists because neither side can prove the other's causal ontology is *false*, only that it is *less useful* for their specific problems.

  ### 4. What Could Move the Debate?
  Since the mathematical equivalence is settled, new formal results won't end the debate. We don't need more algebra; we need better causal inference.

  **A. Empirical Work on Causal Manipulation (The Winner)**
  The debate will only dissolve when we have robust experimental protocols that distinguish causal levels via intervention, not observation.
  *   *Example:* In microbial evolution, experiments that independently vary individual competitiveness and group productivity (e.g., using synthetic biology to decouple the two) can show which level exerts causal dominance.
  *   *Impact:* If empirical work shows that "group fitness" is a stable target of selection that cannot be predicted by summing individual fitnesses (due to non-linear interactions), the MLS view wins pragmatically. If it shows group effects are always decomposable into individual interaction effects without loss of predictive power, the gene/individual view wins.

  **B. Conceptual Distinction: Prediction vs. Explanation**
  Philosophers need to enforce a stricter distinction between **predictive models** (where equivalence holds) and **mechanistic explanations** (where it might not).
  *   If the community accepts that "Unit of Selection" is a label for *where the mechanism is located* rather than *where the math is easiest*, the fight clarifies.
  *   Currently, people argue past each other: one says "The math works at the gene level" (Prediction), the other says "The mechanism is at the group level" (Explanation). Acknowledging this distinction would render many arguments obsolete.

  **C. The "Origins" vs. "Maintenance" Distinction**
  A promising conceptual move is distinguishing the unit responsible for the *origin* of a trait (mutation/individual variance) vs. the unit responsible for its *maintenance* (group stability).
  *   It is possible that genes are the unit of origin, but groups are the unit of maintenance.
  *   If the debate splits along these temporal lines, the "vs." disappears.

  ### 5. Verdict
  The debate is **substantive but methodological**. It is not about what exists (ontology); it is about how we carve nature to find causal leverage (epistemology).

  *   **Is it verbal?** No. Different frameworks lead to different experiments and different discoveries.
  *   **Is it substantive?** Yes, but only regarding causal modeling, not evolutionary dynamics.
  *   **Will it end?** No, and it shouldn't. Science requires multiple modeling perspectives. The "fight" is actually a healthy tension that prevents complacency. The gene-centric view prevents MLS from becoming mystical holism; the MLS view prevents gene-centrism from missing emergent ecological dynamics.

  **The End Game:** The debate won't end with a surrender. It will end with **domain specificity**. We will accept that for molecular evolution, the gene is the causal unit, and for social evolution/ecosystem engineering, the group is the causal unit. The "Universal Unit of Selection" is the ghost that needs to be exorcised. Once everyone agrees there is no *single* unit, but rather *context-dependent causal levels*, the war becomes a technical discussion about model fit rather than an ideological battle.

  **Recommendation:** Stop looking for a formal result to settle it. Look for papers on **causal inference in evolutionary biology** (e.g., work by Pierrick Bourrat, James Griesemer, or experimentalists like William Swanson). That is where the actual progress is happening. The Price Equation settled the accounting; causal manipulation will settle the cause.
