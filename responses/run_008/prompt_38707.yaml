answer: |-
  Here are ten interview questions designed to navigate around rehearsed defenses. They are structured as five "blocks" corresponding to your five required topics (Fanaticism, Cluelessness, Population Ethics, Dominance vs. EV, Falsifiability). Each block contains a main question and a targeted follow-up.

  To hit your count of eight to ten, I have counted each Main Question and each Follow-up as a distinct numbered item. I have also embedded necessary definitions into the questions themselves so the audience can follow along without prior knowledge of the literature.

  ### Part 1: The Fanaticism Worry

  **1. Main Question:**
  "A common objection to strong longtermism is the charge of 'fanaticism.' This is the idea that if you maximize expected value, you might be forced to prioritize actions with a tiny, tiny probability of an astronomically huge payoff over actions with a guaranteed, significant benefit today. You've replied that these aren't 'Pascalian fictions' but real, estimable probabilities. But at what point does the sheer size of the payoff break our ability to estimate the probability? If I offer you a bet where the payoff is the survival of $10^{50}$ future lives, does the concept of a 'one in a billion' chance still carry meaningful information, or does the magnitude of the stake make the probability estimate essentially noise?"

  **2. Follow-up:**
  *(Use this if he insists the probabilities are 'real' and 'non-zero'.)*
  "You're saying the probability is non-zero and estimable. But in decision theory, we usually require that our probability estimates be more precise than the inverse of the payoff to avoid absurdity. If the payoff is $10^{50}$ lives, your probability estimate needs to be accurate to fifty decimal places to justify a trade-off. Are you claiming we actually have that level of precision in our models of existential risk, or are you effectively admitting that the math breaks down and we are acting on intuition dressed up as arithmetic?"

  ### Part 2: The Cluelessness Objection

  **3. Main Question:**
  "I want to press on 'cluelessness.' Defenders of longtermism often say, 'Ordinary charity is also clueless about the long-term.' But there is a disanalogy. When I buy a bednet, I know it saves a life *now*. The long-term effects are unknown, but the short-term sign is positive. Strong longtermism, however, often asks us to sacrifice definite short-term goods for long-term effects where we can't even determine the *sign* of the outcome. If our causal models are too complex to tell us whether an intervention makes the future better or worse, where exactly does the expected-value calculation get the numbers it needs to claim dominance?"

  **4. Follow-up:**
  *(Use this if he argues that 'some' long-term effects are knowable or that we can model 'trajectory changes'.)*
  "Let's grant that we can model some trajectory changes. But to calculate expected value, you need to sum over all possible causal chains. If the 'cluelessness' objection is right, the positive and negative long-term effects cancel out or remain undefined in our models. If you selectively count the causal chains that favor your conclusion and treat the unknowable ones as neutral, aren't you just smuggling your desired verdict into the causal model rather than deriving it from the math?"

  ### Part 3: Population Ethics

  **5. Main Question:**
  "Many critics suspect that strong longtermism is essentially Total Utilitarianism—the view that we should maximize the total number of happy lives—plus empirical speculation about the future. You've argued that the verdicts are 'robust across a wide range of views.' But isn't that robustness only true if we restrict the range to theories that accept aggregating value across vast numbers of potential people? If we include views that say 'non-existent people have no rights' or 'we have special duties to the living,' does the longtermist priority survive, or does it vanish once you step outside the utilitarian framework?"

  **6. Follow-up:**
  *(Use this if he claims 'most plausible theories' agree on the importance of the future.)*
  "You say 'most plausible theories.' But isn't there a selection effect here? It seems the theories that agree with strong longtermism are precisely the ones that allow the far future to dominate the moral calculus. Theories that prioritize the present or reject the moral weight of merely possible people are dismissed as 'implausible' largely *because* they contradict longtermism. Are you deriving the ethics from the theory, or selecting the theory because it supports the ethics?"

  ### Part 4: Dominance vs. Expected Value (The User's Pet Theory)

  **7. Main Question:**
  "I've noticed two different arguments in the literature for why existential risk reduction is the top priority. One is an Expected Value claim: the future is so big that even small probability shifts matter. The other is a Dominance claim: if humanity goes extinct, the game is over, so any reduction in risk is lexically prior to other goods regardless of the math. You seem to use the Dominance argument when people attack your probability estimates, but the Expected Value argument when people ask why you prioritize the future over the present. Which one is it? Are we maximizing a number, or obeying a lexical constraint?"

  **8. Follow-up:**
  *(Use this if he tries to say 'they amount to the same thing in practice'.)*
  "They don't amount to the same thing in principle. If it's Expected Value, then in theory, a sufficiently large short-term benefit could outweigh a tiny risk reduction. If it's Dominance, then no amount of short-term suffering justifies a higher risk of extinction. If you commit to Expected Value, you open yourself to the fanaticism objections we discussed. If you commit to Dominance, you abandon standard decision theory. Which framework are you willing to be held accountable to?"

  ### Part 5: Falsifiability

  **9. Main Question:**
  "You often describe strong longtermism as 'decision theory plus astronomy'—implying it's an empirical, rational conclusion rather than an ideological commitment. If that's the case, there must be empirical evidence that could prove it wrong. What specific observation, if we found it to be true tomorrow, would force you to abandon strong longtermism? Is there a discovery about the future, or about value, that would make near-term suffering the priority again?"

  **10. Follow-up:**
  *(Use this if he gives a vague answer like 'if the future turned out to be small' or 'if we couldn't influence it'.)*
  "Those are physical constraints. I'm asking about the moral structure. If we discovered that the future *is* vast and we *can* influence it, but you still decided it wasn't the *key* priority, what would drive that decision? If the answer is 'nothing, given those facts, could change my mind,' then isn't strong longtermism an axiom you're protecting from refutation, rather than a hypothesis you're testing against the world?"
