answer: |-
  1. The framing of this debate rests on a false dichotomy that conflates having moral standing with having equal interests, forcing a choice between arbitrary exclusion and unlimited commensurability. We should instead distinguish between binary moral status, which grants entry into the moral community, and the scalar weight of specific competing interests.

  2. On this hybrid model, sentience serves as the non-arbitrary threshold for consideration, ensuring that a bee and a dog both matter fundamentally, while cognitive sophistication determines the scope of future-oriented rights. This avoids the perversity of excluding marginally sentient beings while acknowledging that a person's autonomous projects carry different moral weight than a bee's immediate impulses.

  3. Crucially, this view blocks the objectionable trade-offs by granting lexical priority to vital interests like pain avoidance over trivial interests like convenience, regardless of the beings involved. Thus, a dog's whim cannot outweigh a bee's life because the interest in continued existence lexically outranks the interest in momentary pleasure across the sentient spectrum.

  4. At the bottom of the scale, where experience fades into reactivity, the binary threshold of sentience naturally runs out without requiring a second arbitrary line within the moral community itself. This admits that moral consideration requires a subject of experience, resolving the inconsistency worry by grounding the limit in metaphysics rather than moral stipulation.

  5. My verdict is that moral standing must be binary while the weight of interests remains scalar, rejecting the prompt's assumption that grading status necessitates full commensurability. The strongest reason is that only a binary floor of standing protects vulnerable beings from being aggregated away by the trivial benefits of those with greater cognitive power.
