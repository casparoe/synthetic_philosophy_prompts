prompt: |-
  I'm a novelist — literary fiction mostly, family sagas, the kind where a trait echoes down three generations. I'm starting a new novel about a family where the same cold streak keeps resurfacing: grandmother, mother, daughter, each bent differently by it, and I'm trying to figure out how much of it to treat as inherited and how much as made. My writing group keeps telling me to "respect the science." One friend in particular — she reads alot of pop genetics — says twin studies show personality is about 50% heritable, intelligence something similar, so "half of who a person is, is written at birth," and that if I have my characters genuinely change over their lives I'm being unscientific, or at least sentimental. When I pushed back, she explained heritability to me like this: think of a person as a recipe and heritability as the ingredient proportions — if a trait is 50% heritable, the genetic ingredients are half the recipe and environment is the other half. So a character is, at bottom, half-fixed, and my job as the novelist is to narrate the remaing half.

  Something about this smells off to me but I can't put my finger on what. I dimly recall that heritability is about variation across a population, not the composition of one person — or at least I think I recall that — but I don't know what actually follows from it for my real question, which is: can a novelist depict a temperament as both substantially inherited and substantially reshaped by a life, without fudging either side?

  So here's what I want from you. Take on the role of someone who is both a behavioral geneticist and a philosopher of science — you know the technical material cold and you care about what it does and doesn't license. Think it through carefully before answering; do some brainstorming first if that helps, I'd much rather have a considered answer than a fast one. Then give me three things.

  First, an audit of my friend's recipe analogy. Spell out the correspondences plainly — the recipe, the ingredients, the proportions, the finished cake — and then the points where the mapping stops tracking. I specifically want you to dig into the slide from "about half of the variation in a population tracks genetic differences" to "half of any given person is genetic," because I suspect that slide is the engine of the whole argument. If the proportion reading of heritability is wrong in a way that matters for her conclusion, say so in exactly those terms.

  Second, answer the novelist's question on its own terms. If a temperament runs in a family and is "substantially heritable," what does that leave open about how far a life can bend it? Use knobs I can actually imagine as scenes rather than abstractions: the spread of environments in whatever population got studied (I've heard something about heritability being relative to that — a trait looking highly heritable in one place and much less in another, which if true would make my friend's numbers mean less than she thinks); the difference between a trait being heritable and being fixed or unresponsive; and the fact that genes and environment aren't independent ingredients sitting side by side but interact, so an inherited temperament can be precisely the thing that gets shaped rather than the thing doing the shaping.

  Third, tell me straight: was her conclusion carrying the analogy the whole way, or does some defensible version of it survive the audit? And what should I actually take from twin-study numbers when I sit down to write three generations of the same cold streak — should they constrain me at all, or only warn me off certain kinds of lazy explanation?

  Be as thorough as you like; I'd take long over short. And no citations or reading lists — just explain it to me directly.
