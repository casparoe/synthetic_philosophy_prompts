answer: |-
  This is a classic setup. Your seminar title, "Equality of What?", is a direct nod to Amartya Sen's 1979 lecture, which is the foundational text for this exact debate. Your friend's track record strongly suggests she is operating within the **Luck Egalitarian** framework.

  The core intuition of Luck Egalitarianism is that inequalities resulting from **brute luck** (unchosen circumstances) should be compensated, while inequalities resulting from **option luck** (consequences of calculated risks or choices) should not.

  Here is the breakdown of the three principles you identified, how they map onto your new cases, and where your friend is likely to land.

  ### 1. The Three Principles Defined

  *   **Principle A: Resource Luck Egalitarianism (e.g., Ronald Dworkin).**
      *   **Currency:** Resources (money, assets, transferable means).
      *   **Logic:** Society ensures everyone starts with a fair share of resources. If you have expensive tastes (wine, planes) or choose leisure over labor (surfer), that's your problem. We compensate for physical handicaps (blindness) only because they reduce your *ability to convert resources* into functioning, not because they reduce your happiness.
  *   **Principle B: Welfare Luck Egalitarianism (e.g., Richard Arneson).**
      *   **Currency:** Opportunity for Welfare (well-being, preference satisfaction).
      *   **Logic:** Society ensures everyone has an equal opportunity to be well-off. We compensate for unchosen deficits in welfare potential (depression, unchosen expensive needs). We do *not* compensate for preferences you voluntarily cultivated (wine) or risks you took (climbing).
  *   **Principle C: The Capabilities Approach (e.g., Amartya Sen, Martha Nussbaum).**
      *   **Currency:** Capabilities (substantive freedoms to do and be).
      *   **Logic:** Focuses on what people are actually able to achieve (functionings). It cares less about "compensation" and more about ensuring a threshold of central capabilities (health, reasoning, affiliation). It is skeptical of subjective welfare (happiness) as a metric.

  ### 2. Predictions on the New Cases

  | Case | **Principle A: Resources** | **Principle B: Welfare** | **Principle C: Capabilities** |
  | :--- | :--- | :--- | :--- |
  | **1. The Plane Lover**<br>(Unchosen expensive passion) | **No Compensation.** He has equal resources. His inability to convert them into satisfaction is a preference issue, not a resource deficit. | **Compensation Owed.** He has an unchosen deficit in welfare potential. Unlike the wine drinker, he didn't *choose* this need. | **Likely No.** Flying is not a "central capability." He has the freedom to fly if he spends his share; society doesn't owe him extra to make his hobby cheaper. |
  | **2. The Gloomy Neighbor**<br>(Unchosen temperament) | **No Compensation.** Resources are identical. Temperament is internal. | **Compensation Owed.** She has lower welfare potential due to brute luck (temperament). Resources should be transferred to equalize welfare opportunity. | **No Compensation.** She has the same *freedoms* as the happy neighbor. Her subjective unhappiness is not a capability deprivation. |
  | **3. The Gambler**<br>(Bad upbringing) | **Ambiguous/No.** Strict view: She chose to gamble. Soft view: Her upbringing compromised her resource management skills. | **Ambiguous.** Did she choose the preference? It was inculcated. Likely some compensation for the upbringing, but not the loss. | **Compensation Owed.** Her capability to reason about economic security was stunted by her upbringing. Restoring that capability is a priority. |

  ### 3. The Wedge Case: Case 1 (The Plane Lover)

  **Case 1 is the strongest discriminator.** It isolates the "Equality of *What*?" question perfectly.

  *   **Resource Egalitarians** say "No" (Dworkin's famous "expensive tastes" objection: society shouldn't subsidize champagne tastes over beer tastes, even if unchosen).
  *   **Welfare Egalitarians** say "Yes" (Arneson's view: if the taste is unchosen, it's a brute luck disadvantage in welfare potential).
  *   **Capabilities** say "No" (Flying isn't a basic functioning like health or literacy).

  **Case 2** is a close second, but "temperament without diagnosis" is messy; your friend might classify it as a medical issue (Depression case) or a personality trait (Surfer case). **Case 3** is too confounded by the element of *choice* (buying the ticket), which muddies the water.

  ### 4. Betting on Your Friend's Verdict

  **My Bet:** She will say **Compensation is Owed** for the Plane Lover.

  **The Principle:** **Welfare Luck Egalitarianism.**

  **Why?**
  Look at her distinction between the **Wine Drinker** and the **Depressed Woman**.
  *   **Wine Drinker:** *Cultivated* taste. Verdict: No compensation.
  *   **Depressed Woman:** *Unchosen* mental state. Verdict: Compensation.

  The Plane Lover is structurally identical to the Depressed Woman: an internal state that limits welfare/satisfaction, explicitly described as **unchosen** ("without ever choosing it"). If she were a strict Resource Egalitarian (Dworkin), she would treat the Plane Lover like the Wine Drinker (both are preference issues). But given she compensated the depression, she has signaled that **unchosen internal deficits matter.**

  She is likely following this heuristic: *Compensate for brute luck disadvantages in welfare potential; hold responsible for option luck and cultivated preferences.*

  **Predicted Verdicts:**
  1.  **Plane Lover:** Owed support (subsidize the flying or provide equivalent welfare).
  2.  **Gloomy Neighbor:** Owed support (therapy or resources to mitigate gloom), *unless* she classifies "temperament" as a constitutive part of the self for which one is responsible (a common counter-argument). But given the depression case, I lean toward compensation.
  3.  **Gambler:** Owed partial support. She chose to gamble (option luck), but her *capacity to choose* was compromised by upbringing (brute luck). Your friend will likely split the difference here, perhaps offering rehabilitation but not full restitution.

  ### 5. The Tie-Breaker Case

  To truly settle whether she is a **Welfare Egalitarian** (subjective well-being) or a **Capability Egalitarian** (objective freedom), you need a case where subjective welfare and objective freedom diverge.

  **Propose "The Contented Peasant":**
  > "A woman is born into severe poverty and systemic oppression. She is denied education and economic opportunities. However, she has adapted her desires to her circumstances (adaptive preferences). She reports being perfectly happy, claims she never wanted an education, and says her life is satisfactory."

  **Why this settles it:**
  *   **Welfare Egalitarian:** If she cares about *welfare*, she must admit there is no injustice here. The woman is happy. Compensating her might even be wasteful.
  *   **Capability Egalitarian:** If she cares about *capabilities*, she must say there is a profound injustice. The woman lacks the *freedom* to be educated or economically secure, regardless of her happiness.
  *   **Resource Egalitarian:** Would say she is owed resources regardless of her happiness.

  **How to read her verdict:**
  *   If she says **"She is owed nothing (or less), she's happy,"** she is a **Welfare Egalitarian**.
  *   If she says **"She is owed full support, her happiness is irrelevant,"** she is a **Capability or Resource Egalitarian**.

  Given her verdict on the **Wine Drinker** (ignoring the subjective feeling of impoverishment), she might be skeptical of subjective claims. But given her verdict on the **Depressed Woman** (compensating an internal state), she might be sensitive to them. The "Contented Peasant" forces her to choose between **respecting the subject's own assessment of their life** (Welfare) vs. **imposing an objective standard of deprivation** (Capabilities/Resources). That is the heart of "Equality of What?"
