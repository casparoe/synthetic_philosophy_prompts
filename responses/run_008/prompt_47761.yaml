      *   **Conflict:**
          *   *Pro:* Reduces pressure on wild fish stocks, reduces fish suffering (confident benefit).
          *   *Con:* 10 billion larvae killed/year. Uncertainty about insect sentience. Expected suffering (probability × number) might outweigh fish benefits.
          *   *Staff Split:* 50/50. One side worries about expected value calculations (EV) with moral uncertainty. The other side worries about "Pascal's Mugging" style reasoning (speculative probabilities × huge numbers vetoing concrete benefits).
      *   **Requirements:**
          *   Recommend something concrete (Approve, Reject, or Approve with Conditions).
          *   Engage the strongest argument on the losing side (don't steamroll).
          *   Audience: Trustees (retired lawyer, vet) - sensible, non-philosophers.
          *   Tone: Not consultancy-speak, clear, reasoned.
          *   Length: Roughly one page.
          *   Language: British English (e.g., 'sceptical', 'programme', 'centre').
          *   Context: User is on a train (acknowledge typos implicitly by producing clean text).

  2.  **Determine the Recommendation:**
      *   *Option A (Reject):* Too precautionary. Might stall effective fish welfare work based on highly speculative insect sentience. Hard to justify to fish-focused donors.
      *   *Option B (Approve Unconditionally):* Ignores the moral uncertainty risk. If insects *are* sentient, this is a catastrophe. Looks negligent.
      *   *Option C (Approve with Conditions):* Best middle ground. Acknowledges the fish benefit but mitigates the insect risk. Funds research, mandates humane killing methods (if possible), sets density standards.
      *   *Decision:* Approve with Conditions. This shows due diligence on the insect welfare concern without vetoing the concrete fish welfare gain. It addresses the "spreadsheet ethics" concern by adding tangible safeguards rather than just calculating EV.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Opening:** State the purpose and the recommendation clearly.
      *   **The Benefit (Fish):** Acknowledge the clear win. Reduced wild catch, reduced farmed fish density (potentially).
      *   **The Risk (Insects):** Acknowledge the 10 billion figure and the sentience uncertainty.
      *   **Engaging the Counter-argument (The "Spreadsheet" vs. "Precaution" debate):**
          *   *Side 1 (EV Calculation):* 10 billion × small probability = big number.
          *   *Side 2 (Pascal's Mugging/Speculation):* Don't let vague fears stop concrete good.
          *   *Synthesis:* We shouldn't ignore the risk, but we shouldn't paralysis by analysis either. The solution isn't to reject the math, but to mitigate the risk practically.
      *   **The Conditions:**
          1.  Funding allocated for insect sentience/welfare research.
          2.  Requirement for humane killing methods (freezing vs. heat, etc.).
          3.  Review clause after 1 year.
      *   **Closing:** Reiterate why this balances the competing concerns.

  4.  **Refining Tone and Language:**
      *   *British English:* Check spelling (sceptical, programme, centre, organisation, favour, etc.).
      *   *Style:* Direct, professional, not overly academic. Avoid jargon like "expected utility maximisation" or "Pascal's Mugging". Use plain English equivalents ("multiplying probabilities", "speculative risks").
      *   *Length:* Keep it tight. Around 500-700 words.

