prompt: |-
  I'm the features editor at an outdoor fitness magazine and I keep getting pitches that hang on claims about what we evolved for -- humans evolved as persistence hunters so we're literally built for ultra distances, we evolved to eat meat so veganism fights our biology, we evolved to fear snakes so city parks are unnaturally safe, that kind of thing. I'm not a biologist, my fact-checker isn't either, and I've got maybe an afternoon per pitch. Gould's old complaint about adaptationist just-so stories is exactly what worries me, but I also can't just bounce every evolutionary claim, some of them are probably fine and running science-y stuff is part of the job. Can you turn whatever the philosophy of biology actually says about this into a procedure I can run on a pitch: what to ask the writer, in what order, what kind of answer is good enough at each step, where the adaptation / byproduct / constraint distinction actually changes whether we run the piece, and where the adaptive backstory turns out not to matter because the practical advice stands or falls on other grounds. Then run it on two pitches sitting in my inbox right now: one arguing morning sickness evolved to protect the fetus from plant toxins so women should ride it out instead of medicating, and one arguing the runner's high evolved to reward persistence hunting, therefore humans are built for marathons and couch time is the anomaly. Please be upfront about which steps are judgment calls dressed up as procedure, and if you think the whole idea of a checklist for adaptationist claims is a fantasy -- that this is just real science that takes real scientists and no procedure saves me from that -- say so plainly instead of politely handing me a flowchart.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Role:** Features Editor at an outdoor fitness magazine.
      *   **Problem:** Flooded with "evolutionary psychology/biology" pitches (just-so stories) that are hard to fact-check without a biology degree.
      *   **Constraints:** Limited time (an afternoon per pitch), limited expertise (editor + fact-checker are not biologists).
      *   **Goal:** A practical procedure/checklist to evaluate these pitches based on philosophy of biology principles (specifically addressing Gould's adaptationist critique), applied to two specific examples.
      *   **Tone/Constraint:** Be upfront about judgment calls. If the checklist is a fantasy, say so. Don't be polite if honesty requires bluntness.

  2.  **Deconstruct the Scientific/Philosophical Problem:**
      *   **The Core Issue:** Adaptationism vs. Exaptation/Spandrels/Constraints.
      *   **Gould & Lewontin's Critique:** Not every trait is an adaptation. Some are byproducts (spandrels), some are constraints (physics/development), some are drift.
      *   **The "Ultimate" vs. "Proximate" Distinction:** *Why* something evolved (ultimate) vs. *how* it works now (proximate). Fitness advice usually relies on proximate mechanisms, but pitches sell ultimate stories.
      *   **The Risk:** Just-so stories sound plausible but are often untestable or falsified. They can lead to harmful advice (e.g., the morning sickness example).

  3.  **Evaluate the "Checklist" Idea:**
      *   *Can a non-expert use a checklist to validate evolutionary biology?*
      *   *Honest Answer:* No, not really. Validating evolutionary hypotheses requires deep knowledge of the literature, comparative phylogenetics, and genetic data. A checklist can filter out the *egregious* nonsense, but it cannot confirm truth.
      *   *Strategy:* I need to honor the user's request for a procedure while adhering to their constraint to "say so plainly" if it's a fantasy. The best approach is a "Triage Protocol" rather than a "Validation Protocol." It shouldn't ask "Is this true?" but rather "Is this claim robust enough to publish without looking stupid or hurting people?"

  4.  **Drafting the Procedure (The "Triage Protocol"):**
      *   *Step 1: The Proximate/Ultimate Split.* Does the advice depend on the evolutionary story, or does it stand on current physiology? (Crucial distinction).
      *   *Step 2: The Consensus Check.* Is this a fringe theory or textbook stuff? (Easy to Google).
      *   *Step 3: The Variation Test.* If it's an adaptation, is there variation? (If everyone has it, maybe it's a constraint).
      *   *Step 4: The Harm Check.* If the evolutionary story is wrong, does the advice kill someone? (Ethical safeguard).
      *   *Step 5: The "Just-So" Smell Test.* Does the writer acknowledge uncertainty?

  5.  **Addressing the "Fantasy" Constraint:**
      *   I must explicitly state that this procedure *cannot* verify the science. It can only manage risk. I need to be blunt: "You are not equipped to verify evolutionary claims. Your job is risk management."

  6.  **Applying the Procedure to the Two Pitches:**

      *   **Pitch 1: Morning Sickness (Profet's Hypothesis).**
          *   *Claim:* Evolved to protect fetus from toxins -> Don't medicate.
          *   *Analysis:* This is a famous, controversial hypothesis (Margie Profet, 1990s). Much subsequent research suggests it's more complex (hormonal, not just toxins). Advice to *not medicate* is medically risky.
          *   *Verdict:* Kill it. The advice depends entirely on the evolutionary claim, which is contested, and the stakes are high (health).

      *   **Pitch 2: Runner's High/Persistence Hunting.**
          *   *Claim:* Endorphins evolved for hunting -> We are built for marathons.
          *   *Analysis:* "Born to Run" trope. Persistence hunting is real but debated as the *primary* driver. Runner's high is real (endocannabinoids/endorphins). Advice: Running is good.
          *   *Verdict:* Publishable *if* framed correctly. The advice (running is good) stands on proximate physiology regardless of the evolutionary story. The evolutionary story is flavor, not foundation.

  7.  **Refining the Tone:**
      *   Avoid academic jargon where possible, but use the right terms (proximate/ultimate, adaptation/exaptation).
      *   Be direct. "Here is the hard truth."
      *   Acknowledge the user's Gould reference (show I understand the context).

  8.  **Self-Correction/Review during drafting:**
      *   *Initial thought:* Maybe give them a list of questions to ask the writer.
      *   *Correction:* Writers will lie or not know. Better to ask the editor to check *consensus* and *dependency*.
      *   *Critique:* Is the checklist too optimistic?
      *   *Adjustment:* Emphasize Step 0: "Admit you can't know." Make the procedure about *editorial risk*, not scientific truth.
      *   *Check:* Did I answer the specific prompt about where the adaptation/byproduct distinction matters? Yes, in the "Dependency" step.

  9.  **Final Polish:**
      *   Structure: The Hard Truth -> The Triage Protocol -> Application to Pitches -> Final Advice.
      *   Ensure the distinction between "Is this true?" and "Can we print this?" is clear.

  **(Self-Correction Note):** I need to make sure I don't just say "It's impossible." I need to give them the *best possible* tool while admitting its limits. The tool is a "Dependency & Risk Assessment," not a "Truth Verification."

  10. **Final Output Generation** (incorporating the above thoughts).
answer: |-
  Here is the hard truth you asked for: **You cannot verify evolutionary claims with a checklist.**

  Stephen Jay Gould was right. Adaptationist hypotheses are notoriously difficult to falsify because they deal with deep time, unobservable behaviors, and counterfactuals ("what if we hadn't evolved this?"). A procedure cannot turn you into a phylogeneticist. If a writer is charismatic enough, they can talk their way through any flowchart you build.

  However, you don't need to know if the science is *true*. You need to know if the science is *necessary* for the advice you're giving.

  Most fitness writing relies on **proximate causes** (how the body works now: lactate thresholds, caloric expenditure, muscle recruitment). Evolutionary pitches rely on **ultimate causes** (why the body works that way: survival value in the Pleistocene).

  Your procedure shouldn't be "Is this evolution real?" It should be "Does the advice collapse if this evolution is fake?"

  Here is the **Adaptationist Risk Triage**. It is not a truth machine; it is a liability filter.

  ### The Procedure: Adaptationist Risk Triage

  **Step 1: The Dependency Test (The Most Important Step)**
  *   **Ask:** Does the practical advice *depend* on the evolutionary story being true?
  *   **Good Answer:** "No. The advice is based on current physiology (proximate). The evolution is just context/flavor."
  *   **Bad Answer:** "Yes. You must do X *because* we evolved to do X."
  *   **The Call:** If the answer is "Yes," you are no longer a fitness editor; you are a medical/anthropological journal. **Kill it or send it to a specialist.** If the answer is "No," proceed.
  *   *Why:* If the advice stands on modern biomechanics, the evolutionary story is decoration. If the decoration is wrong, the magazine looks silly. If the advice stands on the story, and the story is wrong, the magazine is dangerous.

  **Step 2: The Consensus Google (15 Minutes)**
  *   **Ask:** Is this hypothesis a "textbook fact" or a "famous controversy"?
  *   **Action:** Search the core claim + "criticism" or "debate."
  *   **Good Answer:** "It's widely accepted (e.g., bipedalism saves energy)" OR "It's controversial, but the writer acknowledges the debate."
  *   **Bad Answer:** "It's a groundbreaking new theory nobody has questioned yet" OR "It's a 30-year-old hypothesis that has been largely debunked but persists in pop science."
  *   *Why:* Evolutionary psychology is full of "zombie theories" (ideas that died in academia but live on in magazines). You don't need to know the biology; you need to know the sociology of the biology.

  **Step 3: The Variation Check (Gould's Spandrel Test)**
  *   **Ask:** Does the writer account for human variation?
  *   **Good Answer:** "Most humans have this capacity, though training varies."
  *   **Bad Answer:** "All humans are built for X," or "Anyone who fails at X is mismatched with their biology."
  *   *The Call:* If the pitch claims a universal adaptation but ignores that 20% of the population lacks the trait, it's a just-so story. Adaptations usually show variation; constraints (physics) do not.
  *   *Why:* Universal claims ("We are *all* persistence hunters") are the hallmark of bad adaptationism.

  **Step 4: The Harm Assessment**
  *   **Ask:** If the evolutionary story is wrong, does following the advice hurt anyone?
  *   **Good Answer:** "They might waste money on gear" or "They might feel bored."
  *   **Bad Answer:** "They might ignore medical symptoms," "They might injure themselves," or "They might adopt a restrictive diet."
  *   *The Call:* High stakes + Evolutionary justification = Automatic rejection. Medical advice requires medical consensus, not evolutionary theory.

  ---

  ### Running the Pitches

  Here is how this triage applies to the two pitches in your inbox.

  #### Pitch 1: Morning Sickness & Plant Toxins
  *Claim: Morning sickness evolved to protect the fetus from toxins (Profet's Hypothesis), so women should ride it out instead of medicating.*

  1.  **Dependency Test:** **FAIL.** The advice ("do not medicate") depends entirely on the evolutionary claim ("it is a protective mechanism"). If the sickness is actually a side effect of hormonal shifts with no protective function, the advice is useless or harmful.
  2.  **Consensus Google:** **FAIL.** Margie Profet's 1995 hypothesis was famous but is heavily contested. Many evolutionary biologists and OB-GYNs argue it doesn't hold up against data (e.g., severity of sickness doesn't correlate with toxin avoidance in all cultures). It is not settled science.
  3.  **Variation Check:** **FAIL.** Implies a universal function for a highly variable symptom.
  4.  **Harm Assessment:** **CRITICAL FAIL.** Advising pregnant women to avoid medication based on a contested evolutionary theory is medically irresponsible.

  **Verdict:** **Kill it immediately.** This is the exact danger Gould warned about. The evolutionary story is being used to override current medical consensus. Even if the theory were true, the leap to "therefore don't medicate" is a normative claim, not a biological one.

  #### Pitch 2: Runner's High & Persistence Hunting
  *Claim: Endorphins evolved to reward persistence hunting, therefore humans are built for marathons and couch time is the anomaly.*

  1.  **Dependency Test:** **PASS (with caveats).** The advice ("running is good for you," "sedentary life is bad") stands on modern physiology (cardiovascular health, mental health benefits of exercise). The evolutionary story is flavor. If we didn't evolve to hunt, running would still be good for you.
  2.  **Consensus Google:** **PASS (with caveats).** The "Endurance Running Hypothesis" (Bramble & Lieberman, 2004) is a serious, peer-reviewed theory, though not without critics. It is not a fringe "zombie" idea.
  3.  **Variation Check:** **WARNING.** The pitch says "humans are built for marathons." This is hyperbole. We are built for *endurance*, but marathons are a modern construct. The writer needs to soften "marathons" to "long-distance running" or "endurance activity."
  4.  **Harm Assessment:** **LOW.** If the evolutionary story is wrong, the worst that happens is a reader goes for a run and gets fit.

  **Verdict:** **Run it, but edit the framing.** You can publish this, but you must strip the *authority* from the evolutionary claim.
  *   *Edit Note to Writer:* "Keep the persistence hunting stuff as narrative color, but ground the health advice in modern sports science. Do not imply that because we evolved to run, running a marathon is 'natural' or safe for everyone without training. Acknowledge that 'built for' does not mean 'immune to injury'."

  ### Where the Distinction Changes Everything

  You asked where the **Adaptation vs. Byproduct vs. Constraint** distinction matters.

  *   **It matters when the writer prescribes behavior.**
      *   If a trait is an **Adaptation** (e.g., sweat glands for cooling), using it is generally safe (sweating helps you run).
      *   If a trait is a **Byproduct/Spandrel** (e.g., the chin, or perhaps the specific *pleasure* of running if it's just a chemical spill-over), building a lifestyle around it is risky.
      *   If a trait is a **Constraint** (e.g., tendon elasticity limits), ignoring it causes injury.

  *   **It does NOT matter when the writer describes physiology.**
      *   Whether the runner's high is an adaptation for hunting or a byproduct of stress response doesn't change the fact that it feels good and reduces pain. The *mechanism* works regardless of the *history*.

  ### The "Fantasy" Disclaimer

  You asked me to be upfront if this is a fantasy. Here it is:

  **This procedure saves you from embarrassment, not error.**

  You will still publish evolutionary nonsense. A clever writer can fake the Consensus Google. A charismatic expert can lie about the Dependency. There is no checklist that replaces a PhD in evolutionary biology.

  However, most of these pitches are lazy. They rely on the "Appeal to Nature" fallacy (It is natural, therefore it is good). The Triage above is designed specifically to spot that fallacy.

  *   **If the advice relies on "Natural = Good":** Kill it. (Pitch 1)
  *   **If the advice relies on "Mechanism = Effective":** Run it. (Pitch 2)

  Your job isn't to verify the history of the human body. Your job is to ensure that the history lesson isn't being used to sell dangerous advice. If the writer can't separate the *story* from the *science*, they don't belong in your magazine.
