  *   *Case 1 (Alignment):* Heart. (Both agree).
  *   *Case 2 (Divergence):* Vestigial Wing. (Performance: Balance. Provenance: Flight).
  *   *Case 3 (Divergence):* Exapted Feather. (Performance: Flight. Provenance: Warmth).
