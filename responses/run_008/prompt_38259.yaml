answer: |-
  # Activity Design: The Function Bureau

  **Course Context:** Upper-level Philosophy of Biology Seminar
  **Class Size:** 15 Students (3 Boards of 5)
  **Time:** 90 Minutes
  **Goal:** To experientially demonstrate that "what a trait does" and "why a trait is there" yield different functional verdicts, forcing a choice between consistency criteria rather than allowing them to be treated as synonymous descriptions.

  ---

  ## I. Materials & Setup

  **Room Setup:**
  *   Three tables arranged in a triangle.
  *   Each table is a "Regional Bureau."
  *   **Per Table:**
      *   1 "Bureau Chief" folder (contains scoring sheet and final verdict forms).
      *   5 Role Cards (face down).
      *   3 "Round 1: Performance Briefs" (sealed in white envelopes).
      *   3 "Round 2: Historical Dossiers" (sealed in red envelopes, marked **DO NOT OPEN UNTIL ROUND 2**).
      *   A stack of "Accreditation Tokens" (poker chips, colored paper squares, or just tally marks on the board).

  **Role Cards (5 per table):**
  *   **2 Performance Officers:** *Mandate:* You may only consider the trait's current contribution to the organism's survival and operations. History is irrelevant to your vote.
  *   **2 Provenance Officers:** *Mandate:* You may only consider the trait's history of selection and reproduction. Current utility is irrelevant to your vote.
  *   **1 Bureau Chief:** *Mandate:* You do not vote on function. You ensure the Board remains **consistent**. If the Board rules based on Performance in Case 1, they must rule based on Performance in Case 2. You deduct Accreditation Tokens for inconsistency.

  **The Cases (Printed on Cards):**
  *   **Case 1 (The Control):** *The Mammalian Heart.*
  *   **Case 2 (The Vestige):** *The Kiwi Bird Wing.*
  *   **Case 3 (The Exaptation):** *The Penguin Flipper.*
  *   **Case 4 (The Artifact):** *The Bulldog Jaw.*

  ---

  ## II. Payoff Scheme: "Accreditation"

  There is no "correct" answer key. There is only **Consistency**.

  1.  **Internal Consistency:** The Bureau Chief holds 10 Accreditation Tokens. They must remove 1 token every time the Board changes its *criteria* between cases (e.g., if they rule Case 1 based on current utility, but Case 2 based on history).
  2.  **Role Adherence:** If a Performance Officer is caught arguing from history (or vice versa), any other student at the table can call a "Point of Order." If the Chief agrees, the Board loses 1 Token.
  3.  **Winning:** The Board with the most Tokens at the end wins "Tenure" (a small privilege, e.g., choosing the reading for next week, or first pick of seminar snacks).
  4.  **The Catch:** To keep tokens, they must issue a verdict. They cannot say "It's both." They must stamp the form: **FUNCTION = [X]**.

  ---

  ## III. Timeline (90 Minutes)

  ### 0:00 – 0:10 | Intake & Briefing
  *   **Instructor:** "Welcome to the Function Bureau. You are regulators. Your job is to issue official function designations for biological traits. These designations determine funding and research priority. You must be consistent."
  *   **Distribute Role Cards:** Students read silently. They are *not* to reveal their role to the table yet, but they must argue according to their mandate.
  *   **Rule:** "You may not use the word 'function' to define 'function.' You must point to features of the trait to justify your ruling."
  *   **Constraint:** "Do not open the Red Envelopes."

  ### 0:10 – 0:30 | Round 1: The Performance Brief (White Envelopes)
  *   **Task:** Boards review Case 1 (Heart) and Case 2 (Kiwi Wing).
  *   **Information Provided:** Detailed description of physiology, current mechanics, and contribution to the organism's daily survival. **No evolutionary history is provided.**
  *   **Action:** Boards debate and stamp a verdict for each case.
  *   **Instructor Role:** Circulate. If you hear a student say, "But why did it evolve?" stop them. "You don't have that file yet."
  *   **Expected Friction:** Case 1 is easy. Case 2 (Kiwi Wing) is hard. It helps with balance (Performance), but looks like a wing (suggesting history). Performance Officers will argue for "Balance." Provenance Officers will be frustrated they can't argue "Flight" yet because they suspect the history, but they must wait for the Red Envelope. *Correction:* Provenance Officers in Round 1 must argue based on *inferred* history or refuse to rule. *Better:* In Round 1, Provenance Officers are "handicapped." They must vote based on the *evidence available*, but their mandate reminds them that current role isn't enough. This creates tension: Provenance Officers may abstain or vote "Null Function" because current role isn't history.
      *   *Refinement for Round 1:* Provenance Officers are told: "If you cannot verify history, you must rule 'Function Undetermined'." Performance Officers will want to rule "Balance." This creates an immediate split verdict within the board. The Chief must force a single official ruling. This forces the Board to choose a standard *before* they know the history.

  ### 0:30 – 0:50 | Round 2: The Historical Dossier (Red Envelopes)
  *   **Task:** Boards review Case 3 (Penguin Flipper) and Case 4 (Bulldog Jaw).
  *   **Action:** Open Red Envelopes. These contain the evolutionary history for *all four cases* (including Round 1).
  *   **The Twist:**
      *   *Kiwi Wing (Case 2):* History confirms ancestors flew. Current role is balance.
      *   *Penguin Flipper (Case 3):* History confirms ancestors flew. Current role is swimming.
      *   *Bulldog Jaw (Case 4):* History confirms human aesthetic selection. Current role is breathing/eating (impaired).
  *   **Friction Point:** Boards must now revisit Round 1 rulings. If they ruled Kiwi Wing = "Balance" in Round 1, but now know it was selected for "Flight," do they change the official record?
      *   If they change it: The Chief removes an Accreditation Token (Inconsistency).
      *   If they keep it: The Provenance Officers feel their mandate is violated.
      *   If they rule Penguin = "Swimming" but Kiwi = "Flight": The Chief removes a Token (Inconsistency across similar cases).

  ### 0:50 – 1:00 | Audit & Scoring
  *   Boards tally their remaining Tokens.
  *   Instructor collects the Verdict Forms.
  *   Instructor writes the three Boards' verdicts for the four cases on the main whiteboard.
  *   **Visualizing the Split:** The board will likely show a mess. Board A might say Kiwi = Flight. Board B might say Kiwi = Balance. Board C might say Kiwi = None.

  ### 1:00 – 1:30 | The Debrief (The Lecture)
  *   *See Script Below.*

  ---

  ## IV. Debrief Script: Mapping Experience to Theory

  **Phase 1: The Phenomenology of Disagreement (10 mins)**
  *   **Instructor:** "Look at the board. Board A said the Kiwi Wing functions for Flight. Board B said Balance. You had the same facts. Why did you diverge?"
  *   **Elicit:** Students will say, "We were weighing the history differently."
  *   **Instructor:** "Exactly. You weren't disagreeing about the biology. You were disagreeing about the *definition* of the word 'function.' In Round 1, some of you felt that what a thing *does* is what it is *for*. Others felt that what a thing is *for* depends on how it got there."
  *   **Connect:** "Philosophers call the 'what it does' camp **Causal-Role** accounts (often associated with Robert Cummins). They call the 'how it got there' camp **Etiological** or **Selected-Effect** accounts (often associated with Ruth Millikan or Larry Wright)."

  **Phase 2: The Bullet-Biting (15 mins)**
  *   **Instructor:** "Let's look at where you lost Accreditation Tokens. Where did it hurt?"
  *   **Scenario A (The Vestige):** "If you ruled the Kiwi Wing functions for Flight, you are an Etiologist. But you have to bite a bullet: The wing *never* generates lift. It contributes nothing to flight *now*. Why call it a flight mechanism?"
      *   *Theoretical Point:* Etiological accounts preserve the distinction between *function* and *malfunction/use*. A broken heart still has the function of pumping.
  *   **Scenario B (The Exaptation):** "If you ruled the Penguin Flipper functions for Swimming, you are leaning Causal-Role. But the bone structure exists *because* of flight ancestors. If function is just current contribution, then the human spine's contribution to bipedalism is its function, even if it evolved for quadrupedalism. Does that make sense?"
      *   *Theoretical Point:* Causal-Role accounts capture *current systemic capacity*, which is often what physiologists care about.
  *   **Scenario C (The Artifact):** "The Bulldog Jaw. Selected by humans for looks. Now causes breathing issues. Does it have a function? If you say 'Yes, to look cute,' you admit that 'selection' doesn't have to be 'natural.' If you say 'No, it's broken,' you prioritize health over history."

  **Phase 3: The Verbal Dispute & Biological Practice (15 mins)**
  *   **Instructor:** "Some of you want to say: 'This is just verbal. Biologists use both.' And you're right. But in philosophy, we care about *why* they switch."
  *   **Key Distinction:**
      *   "When a physiologist asks, 'What is the function of the spleen?', they usually want a **Causal-Role** answer (filtering blood, immune storage)."
      *   "When an evolutionary biologist asks, 'Why do we have a spleen?', they usually want an **Etiological** answer (selected for immune defense in ancestors)."
  *   **The Trap:** "The trouble starts when we ask normative questions. 'Is this trait *supposed* to be here?' 'Is this disease a malfunction?' Causal-Role accounts struggle with malfunction (if the spleen filters blood poorly, but still does *something*, does it still function?). Etiological accounts handle malfunction well (it's failing to do what it was selected for), but struggle with exaptations (feathers weren't selected for flight initially)."
  *   **Closing:** "You felt the tension in the game because the tension is real. It's not Celsius vs. Fahrenheit. It's measuring 'Temperature' vs. measuring 'Molecular Kinetic Energy.' They track together often, but they come apart at the limits. Your job this week is to read Millikan and decide if the cost of the Etiological account is worth the precision it buys."

  ---

  ## V. Troubleshooting: What Will Go Wrong

  **1. The "Both/And" Compromise**
  *   **Problem:** Boards will try to avoid losing tokens by writing "Function: Flight AND Balance."
  *   **Fix:** The Verdict Form must have a single line. The Bureau Chief's instructions explicitly state: "Dual designations incur a 2-Token penalty. You must prioritize." This forces the theoretical choice.

  **2. Provenance Officers Smuggling in Present-Day Considerations**
  *   **Problem:** In Round 2, Provenance Officers might say, "It was selected for flight, and it *still helps* with balance, so Flight is the function."
  *   **Fix:** The Instructor (as "Inspector General") circulates. If you hear this, interrupt: "Officer, are you arguing from history or current utility? Pick one. If you mix them, the Board loses a token." Make the procedural cost immediate.

  **3. Student Buy-In / Role-Play Embarrassment**
  *   **Problem:** Upper-level philosophy students can be cynical about "games."
  *   **Fix:** Frame it seriously. Do not use a playful voice. Use bureaucratic language. "Accreditation," "Mandate," "Verdict." The seriousness of the scoring (affecting next week's reading/snack) raises the stakes. The frustration they feel *is* the learning objective; validate that frustration. "If you feel annoyed that you can't just say 'it's obvious,' good. That means the simulation is working."

  **4. Finishing Too Early**
  *   **Problem:** 15 smart students might crunch the cases in 30 minutes.
  *   **Fix:** Have "Appeal Cases" ready. If a Board finishes early, hand them a "Wild Card": *The Human Appendix.* (History: Digestion. Now: Immune/Gut Biome reservoir). Ask them to rule on it using their established consistency. This deepens the vestigial debate.

  ---

  ## VI. Limitations: What the Activity Cannot Do

  **1. The Pragmatism of Biology**
  *   **Limitation:** The game forces a binary choice (Performance vs. Provenance). In actual scientific practice, biologists are pragmatists. They use "function" to mean whatever is useful for the specific research question. A student might reasonably conclude, "The dispute is just verbal; context determines meaning."
  *   **Instructor Note:** You must supply this nuance in the debrief. The game is a *reductio* of purity. It shows that *if* you want a single, unified theory of function, you must pay a cost. Most modern philosophers (e.g., Garson, Nanay) argue for pluralism. Ensure students know that concluding "pluralism is best" is a valid outcome of the seminar, provided they understand *why* the unity failed.

  **2. The Normative Force**
  *   **Limitation:** The game simulates a bureaucratic rule. It doesn't fully capture the *normative* force of "proper function" (i.e., that a trait *ought* to do X).
  *   **Instructor Note:** In the debrief, emphasize the "Malfunction" case. Ask: "If the Kiwi wing is for balance, can it malfunction? If it breaks, is it a broken balance-organ? Or is it a broken flight-organ that is being used for balance?" This highlights where the Etiological account has more explanatory power regarding norms.

  **3. The "History" Black Box**
  *   **Limitation:** The "Historical Dossiers" present selection history as a known fact. In real science, inferring selection history is contentious.
  *   **Instructor Note:** Acknowledge this. "In the game, history was given to you in a red envelope. In the real world, determining the 'Provenance' is the hard part. This makes the Etiological account epistemically risky, even if it is conceptually precise."

  ---

  ## VII. Instructor Prep Checklist

  *   [ ] **Print Role Cards:** Color-code them (e.g., Blue for Performance, Red for Provenance, Gold for Chief) to help you monitor compliance during circulation.
  *   [ ] **Prepare Envelopes:** Ensure the "History" is not visible through the paper.
  *   [ ] **Scoring Sheet:** Create a simple grid for the Bureau Chiefs to track Tokens.
  *   [ ] **Whiteboard:** Pre-draw the table for the final verdict comparison (Cases down the side, Boards across the top).
  *   [ ] **Timer:** Keep strict time. The pressure is necessary to prevent them from resolving the tension through endless discussion.
