      *   *Scoring refinement:* Points are awarded if the final verdict aligns with the *majority mandate* of the board, OR if the dissenting opinion is recorded clearly. Actually, the prompt says "earn accreditation points for issuing rulings that cohere with their own earlier rulings." This is the key. Consistency over time/cases is the metric.

  5.  **Developing the Cases (Crucial Step):**
      *   *Case 1 (The Hook):* The Human Heart. (Too easy? Both agree pumping blood). Let's use something trickier. The *Spleen*.
      *   *Case 2 (Vestigial):* The Kiwi Bird's Wing. (History: Flight. Now: Balance/Protection).
      *   *Case 3 (Exaptation):* Penguin Wings. (History: Flight ancestors. Now: Swimming).
      *   *Case 4 (Artificial):* Broccoli. (History: Human selection. Now: Reproduction/Nutrition).
      *   *Wait, I need the "Staging" (Role first, History second).*
      *   *Round 1 Packet:* Description of what the trait *does* now.
      *   *Round 2 Packet:* The "Sealed Dossier" (Evolutionary history).
      *   *Cases:*
          1.  *Trait A:* A valve in a fish heart. (Does: Pumps blood. History: Selected for pumping). *Control case.*
          2.  *Trait B:* The male nipple. (Does: Nothing/Minor. History: Byproduct of female development).
          3.  *Trait C:* Bird hollow bones. (Does: Lightness for flight. History: Originally for thermoregulation/metabolism).
          4.  *Trait D:* Domestic Dog floppy ears. (Does: Communication? History: Human selection for tameness).

  6.  **Addressing the "Verbal Dispute" Limitation:**
      *   The prompt explicitly asks for an honest note on this. The activity forces a binary choice. In reality, biologists are pragmatists. The debrief must acknowledge that the *philosophical* project is to clarify the *concepts*, whereas the *scientific* project is to explain the *world*. The tension arises when we ask "What *is* function?" not "What does this do?"

