      *   **Proposed Shape:** Role-play ("Function Bureau"). Boards issue official function designations. Conflicting mandates (Performance Officers vs. Provenance Officers). Scoring based on internal consistency, not correctness.
      *   **Cases:** Vestigial structures, Exaptations, Byproducts/Spandrels, Artificial Selection.
      *   **Structure:** Staged information (Present Role first, then History).
      *   **Deliverables:** Rules/Materials, Payoff Scheme, Timeline (90 mins), Debrief Script, Troubleshooting/Pitfalls, Limitations/Instructor Notes.
      *   **Constraint:** No lecture up front. No theoretical terms until debrief.

  2.  **Deconstruct the Activity Design:**
      *   *Group Size:* 15 students. Dividing into 3 boards of 5 seems optimal. Allows for discussion within groups but enough groups to compare verdicts.
      *   *Roles:* The prompt suggests "Performance" vs. "Provenance." To make the tension real, I need to ensure they *can't* just agree. Maybe assign roles secretly or enforce strict speaking rules. Let's make it explicit: 2 Performance, 2 Provenance, 1 Chair (tie-breaker/consistency keeper) per board.
      *   *Scoring:* "Accreditation Points." Points for consistency *within* the board's own logic, not matching the professor's key. This encourages them to stick to their mandate even when it feels counter-intuitive.
      *   *Cases:* Need specific biological examples.
          1.  *Vestigial:* Human appendix (or tailbone). History: Digestion. Now: Immune/Nothing.
          2.  *Exaptation:* Bird feathers. History: Thermoregulation/Display. Now: Flight.
          3.  *Byproduct:* Human chin (or blood redness). History: None (structural consequence). Now: Muscle attachment/Social signaling? Let's use the *human chin* or *spandrels*. Actually, let's use *panda's thumb* (modified wrist bone) – it's a classic.
          4.  *Artificial:* Pug's snout. History: Human aesthetic. Now: Breathing (poorly).
