prompt: |-
  So, bit of background on me: I write novels for a living, mostly literary fiction, and I've spent twenty years in workshops and editing rooms, so the vocabulary I actually think in is craft vocabulary — showing vs telling, point of view, free indirect style, interiority, the "camera" of a scene, what a character knows vs what the narration knows. I never took a philosophy degree, but I've gotten interested in the Mary's room thing (the colour scientist who knows every physical fact about colour but has never seen colour, and then steps out of the room and supposedly learns something new). Here's what I want, and please don't just explain it to me like a normal person — I want a translation.

  Take the main positions in that debate — Jackson's original claim that Mary gains a new fact, the old ability hypothesis reply that she only gains know-how, and the newer phenomenal-concepts move where she gains a new concept but not a new fact — and restate each one in my vocabulary. So: is what Mary gains when she leaves the room anything like what a reader gains when a passage stops telling and starts showing? Is the ability hypothesis basically the craft claim that you can't learn to write sensory scenes from reading about them, only from doing them? Does the phenomenal-concepts strategy map onto anything — maybe the difference between a character having a word for something and having the lived interiority behind the word, which is the whole trick of free indirect style? Translate each position as faithfully as you can, and where the translation requires distortion, say so — don't quietly rewire the philosophy to make it fit my terms and call that a translation.

  Then I need the residue report, which honestly is the part I care about most. Which parts of the philosophical debate map cleanly onto showing/telling and its neighbours, which parts you had to fudge, and is there anything in the philosophers' argument that has no counterpart in craft vocabulary at all? And I want your actual view on that residue: is it there because workshop vocabulary is missing something, or because the philosophers are arguing about something less clear than it looks? I have a sneaking suspicion that my instinct — that Mary's room is just the show-don't-tell distinction wearing a lab coat — is either exactly right or exactly wrong, and I can't tell which. Tell me which, and why.

  One more thing: I'm British, please write the whole answer in British English. And forgive any typos in this — I typed it fast between chapters.
