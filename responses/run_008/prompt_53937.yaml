  10. **Final Polish:** Check for flow and clarity. Ensure the distinction between "easy" and "hard" cases is clear, as that is where the analogy breaks. (Proceed to generate output).

  *(Note on British English)*: I will ensure spelling (e.g., 'analyse', 'colour', 'labour', 'defence') and phrasing (e.g., 'whilst', 'amongst', 'maths' if needed, though unlikely) are consistent. I will avoid Americanisms like 'gotten' or 'fall' (season).

