answer: |-
  1. **The target system and why**
  Use **"The Forager,"** a simple agent navigating a 10x10 grid projected on the screen. The agent (a red square) moves one step per turn to collect "food" (green dots) that appear randomly. It has a limited "vision" radius (3 squares). I recommend running this via a **single, self-contained HTML file** you save to your desktop before class (code provided in the "How to Run" section). This requires no installation, runs in any browser, and ensures the system is deterministic enough to be predictable but complex enough to overwhelm raw data processing. The grid is ideal because it spatializes the "states" (Physical), makes the "rules" visible (Design), and clearly invites goal-attribution (Intentional). It is boring enough that students won't get distracted by graphics, but visual enough that patterns emerge quickly.

  2. **How to run it**
  **Prep (Before Class):**
  Copy the code block below into a text editor, save it as `forager.html`, and test it on the classroom computer.
  *(Note: The code simulates a bot that seeks food, avoids edges, and has a 10% chance of "glitching" (random move).)*

  ```html
  <!DOCTYPE html>
  <html><body>
  <div id="grid" style="display:grid;grid-template-columns:repeat(10,30px);gap:2px;"></div>
  <button onclick="nextTurn()">Next Turn</button>
  <div id="log"></div>
  <script>
  let bot={x:5,y:5}; let food={x:2,y:2}; let turn=0;
  const grid=document.getElementById('grid');
  function draw(){
      grid.innerHTML='';
      for(let y=0;y<10;y++)for(let x=0;x<10;x++){
          let d=document.createElement('div');d.style.width='30px';d.style.height='30px';d.style.background='#eee';
          if(x===bot.x && y===bot.y) d.style.background='red';
          if(x===food.x && y===food.y) d.style.background='green';
          grid.appendChild(d);
      }
      document.getElementById('log').innerText=`Turn:${turn} Bot:${bot.x},${bot.y} Food:${food.x},${food.y}`;
  }
  function nextTurn(){
      turn++;
      // Design Logic: Seek food if visible (dist<4), else random. 10% Glitch.
      let dx=food.x-bot.x, dy=food.y-bot.y;
      let moveX=0, moveY=0;
      if(Math.random()<0.1){ // Glitch
          moveX=Math.floor(Math.random()*3)-1; moveY=Math.floor(Math.random()*3)-1;
      } else if(Math.abs(dx)+Math.abs(dy)<4){ 
          if(Math.abs(dx)>Math.abs(dy)){moveX=Math.sign(dx);} else {moveY=Math.sign(dy);}
      } else { // Random Walk
          moveX=Math.floor(Math.random()*3)-1; moveY=Math.floor(Math.random()*3)-1;
      }
      if(bot.x+moveX>=0 && bot.x+moveX<10) bot.x+=moveX;
      if(bot.y+moveY>=0 && bot.y+moveY<10) bot.y+=moveY;
      if(bot.x===food.x && bot.y===food.y){ food.x=Math.floor(Math.random()*10); food.y=Math.floor(Math.random()*10); }
      draw();
  }
  draw();
  </script></body></html>
  ```

  **Seminar Flow (90 Minutes):**

  *   **0:00–0:10 (Intro & Teams):** Divide the 16 students into 3 teams of 5 (Physical, Design, Intentional). One student acts as Scorekeeper. Explain the goal: Predict the Red Square's next move (Up, Down, Left, Right, or Stay).
  *   **0:10–0:20 (Info Distribution):** Hand out sealed envelopes.
      *   **Team Physical:** Gets a printout of the last 20 turns' raw coordinates (e.g., `T1: 5,5 -> T2: 5,6`). They get *no* rules, just data history. They must induct the physics from noise.
      *   **Team Design:** Gets the pseudocode (a simplified version of the script above, explicitly stating the 10% glitch chance). They have the blueprint but must compute the trajectory.
      *   **Team Intentional:** Gets a "Psych Profile": *"The Agent desires Food. It believes Food is where it sees it. It is anxious near walls. Sometimes it panics (glitches)."*
  *   **0:20–0:65 (The Game - 5 Rounds):**
      1.  Project the current state.
      2.  **Prediction Phase (3 mins):** Teams confer and write their prediction on an index card.
      3.  **Reveal:** You click "Next Turn."
      4.  **Scoring:** Scorekeeper awards points.
      5.  **Data Update:** Team Physical gets the new coordinate added to their list.
      *   *Crucial Constraint:* Team Design often gets bogged down calculating the "Glitch" probability. Team Intentional should argue about what the bot "believes." Team Physical should drown in the coordinate list.
  *   **0:65–0:90 (Debrief):** See script below.

  3. **Scoring and stakes**
  **Stakes:** The winning team gets first pick of the snacks (high-quality chocolate/cookies) and "Bragging Rights" (their team name written on the whiteboard under "Best Predictors").
  **Scoring:**
  *   Correct Direction: 2 points.
  *   Correct "Glitch" Prediction (predicting a random move when logic dictates otherwise): 5 points (Hard mode).
  *   Penalty: -1 point for being the last team to submit a card (simulates computational cost).

  **Tie-Breaking:** If teams tie on points, the tie goes to the team that submitted their cards *fastest* on average. This reinforces Dennett's point about *efficiency*, not just accuracy.

  **Contingency:** If Team Physical somehow wins (unlikely but possible if the random seed is simple), award them the snacks but frame it in the debrief: "You cracked the code, but how many man-hours did it cost compared to Team Intentional?" If Team Design wins comfortably, ask them: "Did you have to calculate every branch? Did Team Intentional get the same answer faster?" The point isn't that Intentional is *more accurate* than Design (it shouldn't be), but that it is *more efficient* while retaining high accuracy.

  4. **Debrief script**
  **Phase 1: The Experience (10 mins)**
  *   "Team Physical, raise your hand if you felt overwhelmed by the data by Round 3." (Wait for hands). "Why didn't you just find the formula?" (Expected answer: Too much noise/time).
  *   "Team Design, did the code help, or did the 'glitch' clause annoy you?"
  *   "Team Intentional, when the bot moved into a wall, what did you say?" (Expected: "It thought the food was there").

  **Phase 2: The Stances (10 mins)**
  *   Draw three columns on the board: Physical, Design, Intentional.
  *   Ask students to map their info packets to these columns.
  *   **Key Question:** "Team Intentional, you used words like 'want' and 'think.' The code has no 'wants.' Why did your predictions work?"
  *   Let them struggle with this. They will say "It's a metaphor." Push back: "If it predicts the future as well as the code, is it just a metaphor?"

  **Phase 3: Real Patterns (10 mins)**
  *   **The Pressure Point:** This occurs when discussing the "Glitch."
  *   Ask: "When the bot glitched, Team Design said 'Random Number Generator.' Team Intentional said 'It panicked.' Which explanation helps you predict the *next* move better?"
  *   If they say Design: Ask "Do you have the RNG seed? No? Then 'Panic' is a better predictor of future behavior than 'Random' because 'Panic' implies a return to safety."
  *   **The Dennett Hook:** "Dennett says a pattern is **real** if adopting that stance allows you to predict the system's behavior reliably and efficiently. If the 'Belief/Desire' pattern lets you beat the 'Physics' team, is the belief real?"
  *   Shut up here. Let the silence hang. The goal is for them to realize that "Real" might mean "Projectible" rather than "Constituted of matter."

  5. **What will go wrong the first time**
  *   **Tech Glitch:** The browser zoom might mess up the grid projection. *Fix:* Test projector resolution beforehand; have a printed backup of the grid state just in case.
  *   **Team Physical Cheating:** They might try to ask you for the rules. *Fix:* Strictly enforce "No cross-team talk."
  *   **Team Intentional Anthropomorphizing Too Much:** They might say "It's angry." *Fix:* Remind them during the round that "Anger" must cash out in specific move predictions (e.g., "Angry = Reckless").
  *   **The "Glitch" Confusion:** Students might think the Glitch makes prediction impossible. *Fix:* Remind them Dennett admits the Intentional Stance isn't perfect, just *better* than the alternatives given resource constraints.
  *   **Time Creep:** The prediction phase often runs long. *Fix:* Use a visible timer on the projector. Hard stop at 3 minutes.

  6. **What the game can't reproduce**
  This activity demonstrates the *pragmatic utility* of the Intentional Stance (it wins points), but it cannot fully reproduce the *ontological unease* Dennett addresses. Students will likely leave thinking, "Okay, it's a useful fiction," rather than "The pattern is as real as the physics." The game shows that the stance *works*, but it doesn't force them to confront that there is *no fact of the matter* deeper than the pattern itself. The Design team *knows* there is no little man inside the bot. You will need to supply this in conversation: "If the Intentional Stance works perfectly, what extra work is the 'Design' stance doing? If nothing, why privilege the code over the goal?" The game sets the table, but you must serve the metaphysical meal.

  ***

  **Note on "Stacking the Deck":**
  This design does **not** guarantee the Intentional team wins on raw accuracy. The Design team has the source code; theoretically, they should be perfect. The Intentional team wins on *efficiency* (speed) and *robustness* (handling the glitch without complex math). This helps your point: Dennett doesn't claim the Intentional Stance is *magical*, only that it is the *optimal compression* for complex systems. If the Design team wins, it proves the Intentional Stance is an approximation. If the Intentional team ties or wins on speed, it proves the approximation is *good enough* to be treated as real. Both outcomes serve the philosophy.
