      *   **Task:** Translate Dennett's philosophical position into the vocabulary of fictional craft (POV, protagonist, narrator, backstory, arc, retcon, unreliable narrator, etc.).
      *   **Specific Constraint 1 (The Translation):** Must be faithful to Dennett but use craft terms.
      *   **Specific Constraint 2 (The Residue Report):** Identify what *doesn't* translate (the "residue").
      *   **Specific Constraint 3 (Three Careful Places):**
          1.  Physics vs. Narrative metaphor (Abstraction vs. Construction).
          2.  Authorship (External Author vs. Self-Authoring).
