      *   **The Three Careful Places:** Address the specific constraints (Physics/Character, Authorship, Fixity).
      *   **The Residue Report:** What didn't fit?
      *   **The Judgment:** Vocabulary limit vs. Philosophical overreach.
      *   **Confidence Statement:** Level and the specific uncertainty.

  9.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I distinguish the "Center of Gravity" (physics) from the "Character" (craft)?
      *   *Correction:* Make sure to emphasize that for Dennett, the Self is *more* like the Center of Gravity (abstract) than the Character (concrete artifact), but it is *made of* narrative stuff.
      *   *Check:* Did I address the "Author outside the text"?
      *   *Correction:* Explicitly state that Dennett eliminates the "God-author." The "Author" is the chaotic neural network. This is the biggest fudge.
      *   *Check:* Did I handle the "Retcon" issue?
      *   *Correction:* Emphasize that in Dennett's view, there is no "original draft." There is only the current revision.
      *   *Check:* Epistemic markers.
