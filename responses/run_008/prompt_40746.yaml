      *   My diagnosis: It is a **cluster of substantive ontological disagreements masked by terminological inertia.** It's not *just* verbal, because different concepts carve nature at different joints based on different causal processes. But it's not *one* substantive disagreement either.
      *   Progress: Genomics adds resolution but not ontology. Rank-free helps but doesn't solve the "where to cut" problem. Pluralism is the most defensible position, but it needs to be *structured* pluralism, not "anything goes."

  3.  **Drafting the Diagnosis (Substantive vs. Verbal vs. Cluster):**

      *   Acknowledge the user's insight: Yes, "species" is overloaded.
      *   But reject the idea that it's *merely* verbal. Why? Because the BSC relies on *process* (reproductive isolation), while PSC relies on *pattern* (monophyly/diagnosability). These are different claims about how evolution works.
      *   The "Species as Individuals" thesis is ontological (spatiotemporally localized entities vs. natural kinds). This is a metaphysical claim, not just linguistic.
