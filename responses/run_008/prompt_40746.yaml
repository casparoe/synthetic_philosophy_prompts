answer: |-
  This is one of the sharper formulations of the species problem I've encountered. You are correct that the debate feels static because the participants are often talking past one another, but you are also right to sense that dismissing it as merely verbal feels like a cop-out. The frustration comes from the fact that biology is trying to force a discrete taxonomy onto a continuous, dynamic, and multi-dimensional process.

  Here is the diagnosis, tested against the hard cases, followed by an assessment of what progress actually looks like.

  ### 1. The Diagnosis: A Category Error Masquerading as Ontology

  Your hypothesis that "species" is doing three different jobs is essentially the **Pragmatic Pluralist** position (championed by Dupré, Ereshefsky, and Mishler). However, the reason the debate hasn't resolved isn't just that people are using the word differently; it's that they are disagreeing about **what kind of thing evolution produces.**

  The stalemate is not merely verbal; it is a **categorical mismatch** between our linguistic need for nouns and evolution's production of processes.

  *   **The BSC (Mayr):** Treats species as *causal processes* (reproductive communities). It is mechanistic.
  *   **The PSC (Cracraft, cladists):** Treats species as *patterns* (tips on a tree, diagnosable units). It is historical/structural.
  *   **Species-as-Individuals (Ghiselin/Hull):** Treats species as *particulars* (spatiotemporally localized entities). This is an ontological claim that dissolves the idea of species as "natural kinds" with essences.
  *   **The Pluralists:** Argue that because evolution operates via different mechanisms (sexual, asexual, hybridizing, radiating), no single ontological category captures all "species."

  **The Verdict:** The dispute is **substantive**, but it is substantive about *theory choice*, not about discovering a pre-existing boundary in nature. The BSC proponent isn't just using a dictionary differently; they are claiming that reproductive isolation is the *primary engine* of divergence. The PSC proponent claims that lineage independence is the *primary fact*. These are incompatible claims about which evolutionary force is definitive.

  The debate is static because **nature does not respect our need for equivalence.** We want "species" in birds to be equivalent to "species" in bacteria. Evolution does not guarantee that. The stagnation is the result of biologists refusing to abandon the Linnaean expectation that there is a "correct" rank, while philosophers and systematists accumulate evidence that rank is an artifact of human cognition.

  ### 2. Testing the Diagnosis Against Hard Cases

  If the problem were merely verbal, empirical data wouldn't sting so much. The fact that these cases cause genuine theoretical pain suggests the disagreement is about how the world is structured.

  **Ring Species (e.g., *Ensatina* salamanders, *Larus* gulls)**
  *   **The Conflict:** BSC struggles here. If population A breeds with B, B with C, and C with D, but A and D do not interbreed, are they one species or two?
  *   **The Result:** This cuts against the BSC's requirement for transitive reproductive compatibility. It favors the **Species-as-Individuals** view (a lineage stretching across space) or the **PSC** (A and D are distinct terminals).
  *   **Diagnosis:** This shows species are dynamic processes in space, not static boxes. It supports pluralism: you need a spatial/lineage concept here, not a strict reproductive one.

  **Asexual Lineages (Bdelloid rotifers, Bacteria)**
  *   **The Conflict:** BSC is definitionally inapplicable. There is no interbreeding.
  *   **The Result:** If BSC is "The Truth," asexual organisms don't have species. This is absurd to microbiologists. They use genomic clustering (PSC/Genomic species).
  *   **Diagnosis:** This is the strongest evidence for **Pluralism**. If the mechanism of cohesion changes (sex vs. ecological selection vs. horizontal gene transfer), the unit of classification must change. A single concept cannot cover both.

  **Hybridizing Sunflowers (*Helianthus*) & Lake Victoria Cichlids**
  *   **The Conflict:** These groups show extensive gene flow between morphologically and ecologically distinct groups. BSC says "one species" (barriers are leaky). Ecologists/Conservationists say "multiple species" (they occupy distinct niches and look different).
  *   **The Result:** Genomics reveals that "species" are often porous semi-permeable barriers, not closed fortresses.
  *   **Diagnosis:** This favors the **Process View**. Speciation is not an event; it is a trajectory. The "disagreement" is about where to draw the line on a continuum. This isn't verbal; it's a disagreement about whether we classify based on *history* (have they split?) or *current state* (do they exchange genes?).

  **Neanderthal Introgression (*Homo sapiens* vs. *H. neanderthalensis*)**
  *   **The Conflict:** We interbred. Under strict BSC, does that make us the same species? Most paleoanthropologists say no.
  *   **The Result:** This highlights the **Time-Scale Problem**. BSC works for contemporaries. Phylogenetic concepts work across deep time.
  *   **Diagnosis:** This shows that "species" is being asked to do two incompatible jobs: describe a breeding population *now* and describe a lineage *over time*. The Neanderthal case proves that lineage independence can exist despite occasional gene flow. It favors a **Lineage Concept** over a strict Reproductive Concept.

  **Summary of Hard Cases:** None of these cases settle the debate in favor of one camp. Instead, they systematically dismantle the idea that a *single* concept can cover all of biology. They raise dust, but the dust settles into a shape that looks like Pluralism.

  ### 3. What Would Count as Progress?

  You asked the crucial question: Is there a way out, or is this just intellectual trench warfare?

  **A. More Comparative Genomics?**
  **No.** More data will not solve an ontological problem. In fact, genomics has made the species problem *worse*.
  *   **Why:** High-resolution phylogenomics often reveals **gene tree / species tree discordance**. Different parts of the genome tell different stories about relationships (due to incomplete lineage sorting, introgression, etc.).
  *   **Result:** Instead of one clear tree giving us definitive species boundaries, we get a "cloud" of histories. This provides more grist for the PSC mill (look at these distinct clusters!) and the BSC mill (look at this gene flow!). It increases resolution but decreases consensus.

  **B. Going Rank-Free (PhyloCode)?**
  **Partial Solution.**
  *   **The Benefit:** It dissolves the expectation that a "species" in beetles is equivalent to a "species" in mammals. It allows us to name clades without forcing them into the Linnaean hierarchy (Kingdom/Phylum/Class... Species).
  *   **The Limit:** It doesn't solve the **individuation problem**. You still have to decide *which* clade gets a name. Do you name the clade that includes Neanderthals and Sapiens, or do you name them separately? The PhyloCode removes the *rank* pressure, but it doesn't tell you where the biological boundaries are. It relabels the problem but doesn't dissolve it.

  **C. Is Pluralism Surrender?**
  This is the philosophical crux. Is saying "it depends" a defensible position or a white flag?

  *   **The Surrender Charge:** Critics argue Pluralism is an admission that we failed to find the "natural kinds" of biology. It feels like giving up on realism.
  *   **The Defense:** Pluralism is defensible **if** it is *Structured Pluralism* rather than "anything goes."
      *   **Contextual Realism:** We acknowledge that different scientific goals require different units.
          *   **Conservation Law:** Needs units that are ecologically distinct and genetically unique (Evolutionarily Significant Units). Here, the PSC or Genetic Species Concept is legally necessary.
          *   **Field Guides:** Needs diagnosable morphological units.
          *   **Evolutionary Theory:** Needs reproductive communities to model selection (BSC).
      *   **The Progress:** Progress looks like **mapping the concepts to the tasks.** Instead of asking "Is this *really* a species?", we ask "For the purpose of conservation legislation, does this lineage warrant protection?" or "For the purpose of modeling selection, is this a reproductive community?"

  **The Real Progress:**
  The only way to break the century-long static nature of this debate is to **stop treating "species" as a natural kind.**
  The progress has actually already happened, but it hasn't permeated the culture. The shift is from **Essentialism** (species have necessary and sufficient conditions) to **Homeostatic Property Clusters** (Boyd) or **Lineage Segments**.

  If we accept that "species" is a **theoretical term** that refers to different stages of lineage divergence depending on the context, the fight ends. The fight persists only because of **institutional inertia**:
  1.  **Legal:** The Endangered Species Act requires a "species" to be listed. Courts demand a binary yes/no.
  2.  **Funding:** You get grants to study "species diversity."
  3.  **Museums:** Specimens must be filed under a binomen.

  ### Conclusion

  Your hypothesis is mostly correct, but it needs a metaphysical upgrade. It is not just that "species" does three jobs; it is that **evolution produces continuity, while language and law require discreteness.**

  The debate is static because the institutional demand for discrete units (for laws, guides, and counts) clashes with the biological reality of continuous divergence.
  *   **Is it substantive?** Yes, because it's about which evolutionary processes we prioritize.
  *   **Is it verbal?** Yes, because we are using one word for multiple ontological categories.
  *   **Is Pluralism surrender?** No, it is the only position that respects the data. But it requires us to stop expecting "species" to be a universal constant of nature.

  **What counts as progress?**
  Progress is not a new definition. Progress is the **decoupling of scientific classification from legal and administrative necessity.** As long as the law demands a binary "species or not" for conservation, biologists will be forced to pretend the boundary is sharper than it is. If we can move policy toward protecting *processes* and *lineages* rather than Linnaean ranks, the philosophical pressure will ease. Until then, the debate will remain static, because the stakes (money, law, prestige) remain fixed.
