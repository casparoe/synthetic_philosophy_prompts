  ok so this might be a slightly odd request but here goes. I'm an undergrad who helps run our campus effective altruism group, and next month we're doing a panel on whether we should care about people who don't exist yet. my co-panelist is a philosophy grad student really into population ethics, and when we met to plan the panel she absolutely ran rings around me — I was frantically taking notes on my phone while she talked. the crux was the repugnant conclusion: roughly, if you think what matters is total welfare summed over everyone who ever lives, you end up committed to saying that a world with vastly more people, whose lives are each only just barely worth living, can be better than a smaller world full of extremely happy people, as long as the big world's total is higher. I want to practice holding my own before I embarrass myself in front of an audience, so I need a sparring partner.

