answer: |-
  This is a classic Effective Altruism (EA) move: taking a vague moral intuition and forcing it through a spreadsheet to see if it breaks. Your roommate is deploying what's often called the **"Expected Value Argument for Insect Welfare."** It is the standard hard-mode argument in this space.

  He is right that the arithmetic is trivial. He is wrong that the arithmetic does the moral heavy lifting. The equation $P(\text{sentience}) \times N(\text{individuals}) \times W(\text{moral weight})$ hides three distinct philosophical landmines. If you step on any one of them, the conclusion collapses.

  Here is the menu of claims hidden inside "1% of 10 quintillion," ranked from "mathematically true but morally inert" to "philosophically explosive."

  ### 1. The Empirical Claim: "There are 10 quintillion insects."
  *   **The Claim:** The biomass and individual count of insects vastly outnumber vertebrates.
  *   **Plausibility:** **High.** Estimates vary, but the order of magnitude is generally accepted by entomologists. There are indeed roughly $10^{19}$ individual insects alive at any time.
  *   **Does it get him the conclusion?** **No.** This is just the $N$ in the equation. A large number of rocks is still zero moral patients. This claim only matters if the other variables are non-zero.
  *   **Room for your view:** None. You already conceded this. Don't fight here; it's a distraction.

  ### 2. The Epistemic Claim: "We can assign a probability to sentience."
  *   **The Claim:** Sentience is a binary state (either you feel pain or you don't), but we are uncertain about the state. Therefore, we treat it as a probability (e.g., 1% chance they are sentient).
  *   **Plausibility:** **Contested.** This assumes sentience is an on/off switch. Many neuroscientists and philosophers argue sentience is **graded**. An insect might not be "100% sentient with 1% probability," but rather "0.1% sentient with 100% probability." Their nervous systems are so simple that the *capacity* for suffering might be vanishingly small, regardless of whether they qualify as "sentient."
  *   **Does it get him the conclusion?** **Only if sentience is binary.** If sentience is graded, you multiply the count by the *degree* of capacity. If a cricket's capacity for suffering is 1/1,000,000th of a chicken's, the 10 quintillion count shrinks dramatically.
  *   **Room for your view:** **Significant.** You can argue: "Even if they feel *something*, the resolution of their experience is so low that a trillion insect pains don't sum to one chicken pain." This attacks the **Moral Weight** variable, not the count.

  ### 3. The Decision-Theoretic Claim: "Maximize Expected Value under Moral Uncertainty."
  *   **The Claim:** When unsure about moral facts (like "are insects sentient?"), you should act to maximize the *expected* moral value. (1% chance of 100 trillion suffering units > 100% chance of 1 billion suffering units).
  *   **Plausibility:** **Low to Moderate.** This is the engine of the argument, but it is the most controversial part of modern utilitarianism. It leads to **"Expected Value Fanaticism."** If you always follow the biggest numbers, you become vulnerable to Pascal's Mugging (see Item 6). Many philosophers argue for "caution" or "thresholds" when probabilities are tiny and stakes are astronomical.
  *   **Does it get him the conclusion?** **Yes, but at a high cost.** If he accepts this principle, he *must* prioritize insects (and potentially far stranger things).
  *   **Room for your view:** **Yes.** You can reject pure expected value maximization in favor of a "robustness" approach. "I will prioritize causes where I am confident the moral patients exist (chickens), rather than gambling on astronomical numbers of dubious patients (insects)."
  *   **Proves Too Much?** **Yes.** This logic suggests we should ignore near-certain suffering to chase tiny probabilities of infinite suffering (e.g., simulation theory scenarios).

  ### 4. The Aggregation Claim: "Suffering Sums Linearly."
  *   **The Claim:** One unit of suffering plus one unit of suffering equals two units of suffering. Therefore, enough tiny harms eventually outweigh a massive harm.
  *   **Plausibility:** **Intuitively Low.** This is the "Repugnant Conclusion" applied to pain. Most humans have a **lexical intuition**: there is some level of severe suffering (e.g., torture) that no amount of minor annoyance (e.g., a mosquito bite) can outweigh, even if the annoyance is repeated a quadrillion times.
  *   **Does it get him the conclusion?** **Yes.** It allows the sheer volume of insect lives to drown out the intensity of vertebrate suffering.
  *   **Room for your view:** **Strong.** You can defend a **Lexical Threshold View**. "Even if crickets feel pain, the *quality* of that pain is below the threshold of moral urgency compared to the confinement and slaughter of a chicken. Numbers don't bridge that gap."
  *   **Proves Too Much?** **Yes.** It implies you should prevent a quadrillion people from getting a mild headache rather than saving one person from being burned alive, provided the headache count is high enough.

  ### 5. The Counterfactual Claim: "Farming Creates the Suffering."
  *   **The Claim:** By buying cricket protein, you are causally responsible for the existence and suffering of those insects.
  *   **Plausibility:** **High (for farmed insects), Low (for wild insects).** Your roommate is likely conflating farmed crickets with wild insects. The "10 quintillion" number includes wild ants, beetles, etc., whose suffering we cannot affect. Farmed crickets are a tiny fraction of that total.
  *   **Does it get him the conclusion?** **No.** Even if insect welfare is the most important thing *in the universe*, farming crickets might be a drop in the bucket compared to wild insect suffering (which is arguably much worse due to predation/starvation).
  *   **Room for your view:** **Very Strong.** "If the numbers are so big, why are we talking about a cricket farm? By your logic, we should be trying to intervene in wild ecosystems to prevent predation, not arguing over dinner ingredients." This highlights the **neglect** vs. **tractability** gap.
  *   **Proves Too Much?** **Yes.** If wild insect suffering dominates the moral landscape, the EA conclusion isn't "don't eat crickets," it's "dedicate your life to genetically engineering predators out of existence." Most EAs balk at this.

  ### 6. The "Pascal's Mugging" Check (The Trap)
  *   **The Claim:** Astronomical numbers always trump high probabilities.
  *   **The Test:** Ask him: "If I told you there is a 0.0000001% chance that this pebble contains a trapped universe of a quadrillion sentient beings, does smashing it become the worst crime in history?"
  *   **The Problem:** If he says **Yes**, his moral framework is broken (he is vulnerable to mugging). If he says **No**, he admits there is a **probability threshold** where numbers stop mattering.
  *   **Application to Insects:** If he admits a probability threshold, you can argue that insect sentience falls below it. The "1%" isn't a hard fact; it's a guess on a phenomenon we don't understand. When the probability is based on ignorance rather than data, multiplying it by quintillions is mathematical sorcery.

  ---

  ### How to Play This at Dinner

  Don't fight the math. Fight the **inputs**.

  1.  **Concede the Count:** "Okay, there are a lot of bugs. I buy the 10 quintillion."
  2.  **Attack the Weight:** "But you're treating a cricket's pain as equal to a chicken's pain. Given their neural complexity, isn't it more likely their 'pain' is a reflex with no subjective experience? If the *intensity* is a million times lower, your 100 trillion sentient beings becomes 100 million equivalent chickens."
  3.  **Attack the Aggregation:** "Do you really believe a trillion mosquito bites are worse than one human torture? If not, then numbers don't aggregate linearly, and your calculation fails."
  4.  **The "Wild Insect" Trap:** "If insect suffering is the biggest issue, why are we talking about farms? Wild insects suffer vastly more. If you aren't prioritizing wild animal suffering, you aren't actually following your own numbers."

  **The Verdict:** Your roommate's argument relies on **Claim 3 (EV Maximization)** and **Claim 4 (Linear Aggregation)**. Both are standard utilitarian tools, but both are known to produce absurd results in edge cases. You don't need to prove insects *aren't* sentient; you only need to show that the **uncertainty** is too high and the **moral weight** is too low to justify overriding your intuition about vertebrates.

  The "1% of 10 quintillion" line is a rhetorical shield. It sounds like math, but it's actually a moral assertion that **quantity trumps quality** and **expectation trumps certainty**. Those are values, not facts.
