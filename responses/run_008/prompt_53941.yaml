answer: |-
  **The Scenario**
  In our region, the illicit cannabis market is currently saturated with synthetic adulterants causing acute psychosis, yet the proposed legalisation model is not a commercial free market but a **state monopoly requiring mandatory biometric registration linked to provincial health records** for every purchase, designed to enforce strict dosage quotas and flag dependency. Conversely, the decriminalisation option permits unregistered home cultivation and possession without penalty but leaves all supply chains outside state oversight. Faced with this specific choice, the civil libertarian must weigh the right to privacy and freedom from state tracking against the convenience of a legal shop, while the paternalist must weigh the benefit of product safety and health monitoring against the risk of normalising access without surveillance.

  ***

  **The Positional Reversals**

  **The Civil Libertarian (Arguing for Decriminalisation)**
  A consistent civil libertarian prioritises negative liberty—freedom from state coercion and surveillance—above state-conferred conveniences. In this scenario, legalisation is not a liberation of the market but the creation of a **surveillance apparatus**. By tying cannabis access to health records and biometric ID, the state transforms a consumer into a monitored patient, creating a database of citizens' psychoactive habits that could be exploited for insurance, employment, or further coercion. Decriminalisation, by protecting the right to cultivate and possess without registration, preserves the "right to be let alone." The libertarian accepts the risk of the grey market for supply because the alternative is submitting to a panopticon where the state dictates and records your intake.

  **The Paternalist (Arguing for Legalisation)**
  A consistent paternalist prioritises the citizen's welfare and protection from harm over their immediate autonomy. In this scenario, decriminalisation leaves users exposed to the **toxic illicit supply** (synthetic adulterants) and offers no mechanism to intervene when a citizen develops an addiction. The state-monopoly legalisation model, specifically *because* it links purchases to health records, allows the state to act as a guardian: it guarantees product purity (preventing psychosis) and empowers health officials to intervene when purchase patterns indicate dependency. The paternalist accepts the expansion of access because the regulatory leash is tight enough to ensure that access does not equate to unchecked harm.

  ***

  **The Single Feature Doing the Work**
  The pivot point is the **mandatory linkage of purchase data to state health surveillance.**

  *   **If this feature is removed:**
      *   **The Libertarian** immediately switches to **Legalisation**. Without the surveillance burden, legalisation becomes a standard property-rights issue: the right to buy and sell without state interference trumps the semi-legal ambiguity of decriminalisation.
      *   **The Paternalist** likely reverts to **Prohibition** (or becomes deeply ambivalent). Without the health-linkage, the state loses its primary tool for monitoring and intervention. A commercial legal market increases availability and normalisation without the compensatory benefit of health tracking, tipping the calculus back toward restricting access to prevent net harm.

  ***

  **The Paternalist's Counter-Move**
  The paternalist has a principled way out and does not need to bite the bullet of legalisation. She can invoke the **Expressive Function of Law**.

  This principle holds that law is not merely a tool for managing risk but a teacher of social norms. Even if a regulated market reduces physical harm (purity) and allows for health monitoring, legalisation sends a normative signal that cannabis use is a *safe, ordinary, and state-sanctioned activity*. A hardline paternalist can argue that this normative shift will increase initiation rates among youth and vulnerable populations far more than safety regulations can mitigate. She can concede that prohibition causes *some* harm (adulteration) but argue that the **moral and social cost of normalisation** is a greater evil. This allows her to remain pro-prohibition without denying the physical safety benefits of regulation; she simply weights the *symbolic* harm of state endorsement higher than the *physical* harm of the black market.
