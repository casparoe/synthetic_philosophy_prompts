  2.  **Deconstruct the Policy Debate into Craft Terms:**

      *   **The Nordic Model (Criminalize Buy, Decriminalize Sell):**
          *   *Philosophy:* Prostitution is inherently exploitative/violent. The seller is a victim/survivor. The buyer is the perpetrator.
          *   *Craft Translation:*
              *   **POV/Interiority:** The sex worker is granted *limited* interiority regarding the act itself. Her desire is treated as false consciousness (unreliable narration). The State/Society acts as the omniscient narrator knowing her "true" best interest.
              *   **Agency:** She is acted *upon*. The distinction between "what she does" and "what is done to her" is collapsed in favor of the latter.
              *   **Backstory:** Entry into the trade is the *Inciting Incident* of a trauma narrative. It explains everything. It is deterministic.
              *   **Focalization:** Focalized through the lens of potential harm.

      *   **The German/Dutch Model (Legalization/Regulation):**
          *   *Philosophy:* Prostitution is work. It needs regulation for safety/taxation.
          *   *Craft Translation:*
              *   **POV/Interiority:** The worker is a professional character. Interiority is compartmentalized (work self vs. private self).
              *   **Agency:** She is a contract signer. But the *State* becomes a co-author of the scene (licensing, zoning).
              *   **Backstory:** Entry is a career choice (or economic necessity treated as a career pivot). It colors the scene but doesn't define the genre.
              *   **Focalization:** Focalized through bureaucracy and transaction.

      *   **The New Zealand Model (Full Decriminalization):**
          *   *Philosophy:* Prostitution is work, but criminalization creates danger. Remove state interference to increase safety/agency.
          *   *Craft Translation:*
              *   **POV/Interiority:** The worker is the *Author* of her scenes. She holds the pen.
              *   **Agency:** High agency. She can say no, set terms. The distinction between "does" and "done to" is hers to draw.
              *   **Backstory:** Entry is context, not destiny. It doesn't dictate the plot.
              *   **Focalization:** Focalized through the worker's immediate experience and risk assessment.

