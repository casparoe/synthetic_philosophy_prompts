answer: |-
  This is a precise and necessary dissection. You are correct: policy debates regarding sex work are often hermeneutic disputes disguised as empirical ones. They are arguments about who holds the authority to name reality. When you translate this into craft, the masks come off.

  Here is the restatement of the debate in your vocabulary, followed by the residue report.

  ### I. The Restatement: Policy as Poetics

  **1. The Nordic Model (Criminalize Purchase, Decriminalize Sale)**
  *   **Narrative Stance:** This model operates on a **hermeneutics of suspicion**. It posits that the sex worker is an **unreliable narrator** regarding her own consent.
  *   **Interiority & Focalization:** The law grants the sex worker interiority regarding her *suffering*, but denies her interiority regarding her *choice*. If she claims agency, the text treats this as false consciousness. The true "narrator" of her life is the State (or the Social Worker), who possesses an omniscient perspective on her best interests that she lacks.
  *   **Agency:** The distinction between "what she does" and "what is done to her" is collapsed. The model insists that even if she appears to act, she is being acted upon by structural patriarchy. In craft terms, she is a character to whom things happen, not a character who makes things happen.
  *   **Backstory:** Entry into the trade is treated as the **Inciting Incident of a Trauma Plot**. It is deterministic. Whatever scene follows is colored entirely by the presumption that she is trying to escape the first scene. The backstory does not just press on the scene; it dictates the genre (Thriller/Tragedy).
  *   **The Client:** He is the Antagonist. His interiority is irrelevant or villainous by definition.

  **2. The German/Dutch Model (Legalization/Licensing)**
  *   **Narrative Stance:** This model treats sex work as a **Genre Constraint**. It is a bureaucratic realism.
  *   **Interiority & Focalization:** The worker is granted professional interiority, but it is compartmentalized. She is a character following a script written by compliance officers. Focalization is split between the worker and the Regulatory Body.
  *   **Agency:** She has agency within the margins of the contract. She can choose her lines, but not the stage. The State acts as a **Co-Author**. It writes the setting (zones), the supporting cast (health checks), and the plot limits (licensing).
  *   **Backstory:** Entry is a career pivot. It colors the scene but does not define the genre. However, the requirement to register creates a **Permanent Record** that follows the character, limiting her ability to exit the narrative or start a new book (stigma/criminal record if unlicensed).
  *   **The Client:** He is a Customer. His interiority is transactional.

  **3. The New Zealand Model (Full Decriminalization)**
  *   **Narrative Stance:** This model attempts to grant the sex worker **Diegetic Authority**. She is the Author of her own scenes.
  *   **Interiority & Focalization:** The worker's perspective is the primary truth. There is no omniscient narrator (State) correcting her assessment of risk or consent. Focalization is tight, immediate, and subjective.
  *   **Agency:** The distinction between "what she does" and "what is done to her" is hers to draw. She is capable of surprise. She can change the plot mid-scene (refuse a client, set terms) without the Author (State) intervening to say that move is illegal or impossible.
  *   **Backstory:** Entry is context, not destiny. It explains the character but does not sentence her. The novel can be about anything, not just "the life."
  *   **The Client:** He is a variable. He can be benign, dangerous, or mundane, determined by the scene, not the law.

  **4. The Stage Directions (Empirical Claims)**
  *These are facts your vocabulary must register but cannot adjudicate. Do not metaphorize these.*
  *   **Trafficking Flows:** Whether coercive third parties increase or decrease under specific regimes. (This is a plot point regarding antagonists, not a metaphor for agency).
  *   **Health Outcomes:** Rates of STI transmission, access to medical care. (This is setting hygiene).
  *   **Violence Statistics:** Homicide/assault rates against workers. (This is the body count).
  *   **Exit Rates:** How many women leave the trade and how quickly under specific support systems. (This is character arc resolution).

  ***

  ### II. The Residue Report

  You asked where the translation holds, where it distorts, and what is lost.

  **1. Clean Translations**
  *   **Backstory as Determinism:** The policy debate translates perfectly into craft here. The Nordic model insists backstory is *fate* (you were trafficked/coerced, therefore you are a victim now). Decriminalization insists backstory is *history* (you entered for money/survival/choice, therefore you are a worker now). This is a disagreement about whether the first chapter dictates the last.
  *   **Focalization of Harm:** Who defines danger? In the Nordic model, harm is defined by the act itself (omniscient moral judgment). In Decriminalization, harm is defined by the character's experience of the act (limited subjective judgment). This is a pure POV dispute.

  **2. Distorted Translations**
  *   **Agency and Choice:** This distorts badly, as you suspected.
      *   *In Policy:* Agency is an ontological state. It asks: "Is consent possible under capitalism/patriarchy?" It is a binary moral switch.
      *   *In Craft:* Agency is functional. It asks: "Does this character have the capacity to make a choice that alters the plot?"
      *   *The Distortion:* A character can have high *craft* agency (she chooses to take the client, she chooses to rob him, she chooses to leave) while having zero *policy* agency (she is economically coerced). If you use craft vocabulary to solve the policy debate, you will falsely conclude that because your character makes plot-moving choices, she is "empowered" in the political sense. She may simply be a tragic figure making the best of a trap. Craft measures movement; Policy measures the walls of the room.
  *   **The "Unreliable Narrator":** In the Nordic model, the worker is structurally unreliable. In craft, an unreliable narrator is usually a specific device used to create irony or tension. Applying "unreliable narration" to an entire class of people is not a craft choice; it is an epistemological violence. It flattens the character into a symptom.

  **3. The Untranslatables (What Craft Misses)**
  *   **Structural Violence:** Narrative is inherently individual. It happens to *someone*. Policy deals with aggregates. You can write a scene about a bad client, but you cannot write a scene about "neoliberal market forces" except through metaphor. The policy debate is often about macro-economics (supply/demand of bodies); the novel is about micro-experience (one body in a room). The novel will always underestimate the system because the system cannot be a character.
  *   **The Collective:** Policy is about *women* (plural). Novels are about *a woman* (singular). The Nordic model argues for the safety of the class, even if it restricts the liberty of the individual. Decriminalization argues for the liberty of the individual, hoping it secures the class. Your novel, by necessity, must choose the individual. It cannot faithfully render the "class" argument without becoming a pamphlet.

  ***

  ### III. The Verdict

  **Is the debate less clear than it looks?**
  Yes. It is two camps fighting about focalization while claiming to fight about law.
  *   The **Nordic Model** wants the State to be the Omniscient Narrator.
  *   The **Decriminalization Model** wants the Worker to be the First-Person Narrator.
  *   The **Legalization Model** wants the State and Worker to be Co-Authors.

  **Does the philosophy help you or merely flatter you?**
  It will help you, provided you do not confuse *plot agency* with *political liberation*.

  If you choose the **Nordic focalization**, you are writing a novel about entrapment. Your character's interiority will always be shadowed by the suspicion that she is lying to herself. The tension comes from: *When will she admit she is a victim?*
  If you choose the **Decriminalization focalization**, you are writing a novel about labor and risk. Your character's interiority is pragmatic. The tension comes from: *How does she manage the danger without the State's help?*

  **The Trap:**
  Do not let the policy debate decide your Point of View.
  If you adopt the Nordic view that she *cannot* truly consent, you risk stripping her of the complexity required for literary realism. You turn her into a vessel for suffering.
  If you adopt the Decriminalization view that it is *just* work, you risk sanitizing the psychic toll, rendering the narration naive.

  **Recommendation:**
  Use the **Residue** to your advantage. The friction between *craft agency* (she chooses) and *policy agency* (she is coerced) is where the novel lives.
  Let her be the First-Person Narrator (she writes herself), but let the **Backstory** press on the scene with the weight of the Nordic argument (the world treats her as a victim).
  The conflict of the book should not be "Is this law good?" The conflict should be: **She claims authorship of her life; the world insists on writing her as a victim.**

  That is the marriage beneath the dishes. That is the novel.
