      *   *The Legalization Model:* Focus on "Genre Constraints." The state sets the rules of the scene. The character is a professional, but the plot is dictated by compliance.
      *   *The Decriminalization Model:* Focus on "Authorship." The character writes the scene.
      *   *Stage Directions:* Explicitly list the empirical claims (trafficking stats, health outcomes) that must remain facts, not metaphors.

  4.  **Drafting the "Residue Report" (Section 2):**

