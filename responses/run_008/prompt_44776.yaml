answer: |-
  You are right to be frustrated by "emergence." In philosophy of mind and physics, throwing the word "emergence" at this problem is often a conversation-ender that masks the actual mechanistic tension you're feeling. You have identified one of the deepest knots in metaphysics.

  Here is the carving you are looking for.

  ### 1. The Source and The Name
  You are almost certainly thinking of Douglas Hofstadter's **Careenium** thought experiment from *Gödel, Escher, Bach* (or potentially the "Ant Colony" analogy in the same book). In the Careenium, there are "simms" (small particles bouncing around) and "symms" (clusters of simms that move slowly and act as stable symbols). Hofstadter asks whether the symms cause the simms to move, or vice versa.

  If it wasn't that, it might be a conflation with the **Billiard Ball Model of Computation** (Fredkin/Toffoli), but the "symbols standing for themselves" aspect is pure Hofstadter.

  The philosophical problem you are describing has a specific name: **The Problem of Downward Causation**, specifically framed within the **Causal Exclusion Argument** (most famously articulated by Jaegwon Kim).

  *   **Downward Causation:** The idea that high-level properties (the pattern) can cause changes in low-level properties (the particles).
  *   **Causal Exclusion:** The counter-argument that if the physical low-level is "causally closed" (every physical event has a sufficient physical cause), there is no "room" left for the high-level pattern to do any work. If the balls move because of momentum transfer, what is the pattern *adding*?

  ### 2. The "Carving": Force vs. Constraint
  Your intuition that "the pattern is just what those collisions look like" is the standard **Reductionist** view. Your intuition that "engineers build stuff by reasoning about high-level stuff and it works" is the **Non-Reductive** view.

  The resolution—the actual carving—is to distinguish between **Causal Force** and **Causal Constraint.**

  **The Strict Physical Answer:**
  Strictly speaking, in a closed physical system, the pattern exerts **zero force**. No new energy is introduced by the fact that the balls form a triangle. The low-level collisions do 100% of the "pushing." If you say the pattern *also* pushes, you violate the conservation of energy (you are double-counting the cause).

  **The Engineering Answer (Why it works):**
  The pattern does not add *force*; it adds **boundary conditions**.
  Imagine a river. The water molecules push each other (low-level). But the shape of the riverbank (high-level pattern) determines where the water goes. The riverbank does not "push" the water; it *constrains* the degrees of freedom of the water.

  In your pool table thought experiment:
  1.  **Low Level:** Ball A hits Ball B. Momentum is transferred.
  2.  **High Level:** Because Balls A, B, and C are arranged in a specific "symbol" configuration, the *next* collision is guaranteed to happen in a specific way that preserves the symbol.

  The pattern doesn't reach down and shove the atoms. The pattern **is** the arrangement of the atoms that makes certain future arrangements vastly more probable than others.

  This is why engineering works. When an engineer designs a chip, they aren't tracking electrons; they are designing **constraints**. They arrange the silicon (the pattern) so that the electrons *have no choice* but to flow in a way that performs logic. The high-level design is a map of the low-level constraints.

  ### 3. Is Free Will Literally This Question?
  **Yes. It is literally the exact same question.**

  The "Free Will" problem is just the Pool Table problem applied to neurons.
  *   **Low Level:** Neurons fire due to electrochemical gradients (physics).
  *   **High Level:** "I decided to raise my hand" (pattern/symbol).

  If you say the decision caused the neurons to fire, you are claiming **Downward Causation**.
  If you say the neurons firing caused the decision, you are an **Epiphenomenalist** (the decision is just a shadow).
  If you say they are the same event described twice, you are a **Identity Theorist**.

  Most modern compatibilists (like Daniel Dennett) argue that "Free Will" is a high-level competence that requires the low-level physics to be deterministic enough to be reliable, but complex enough to be unpredictable. Your "decision" is the high-level constraint that channels the neural firing. It doesn't violate physics; it *rides* it.

  ### 4. Why "Emergence" Feels Like a Cop-Out
  You are right. "Emergence" often just means "properties at the top that aren't obvious from the bottom." It describes *what* happens, not *how* causality flows.

  The concept you actually want is **Program Explanation** (proposed by philosophers Frank Jackson and Philip Pettit).
  *   **Process Explanation:** Describes the actual causal sequence (the atoms hitting).
  *   **Program Explanation:** Describes the high-level property that *ensured* the process happened.

  *Example:* A glass breaks because a sound wave hit it (process). But we explain it by saying "the sound was loud enough" (program). The "loudness" didn't push the glass; the air molecules did. But "loudness" captures the **counterfactual stability**. If the air molecules had been slightly different but still "loud," the glass still would have broken.

  The high-level pattern is real because it tracks **invariants** that the low-level description misses. The pattern "pushes" in the sense that it identifies which low-level details *don't matter*.

  ### 5. Summary of the Real Concept
  To resolve the bug in your head, replace "pushing" with **"channeling."**

  1.  **Causal Closure:** The low-level physics is complete. No magic energy comes from the "pattern."
  2.  **Multiple Realizability:** The same "symbol" could be made of different balls. The specific balls don't matter; the *relationship* matters.
  3.  **Causal Relevance:** The pattern is **causally relevant** even if it isn't **causally sufficient**. It selects which physical laws get to play out.

  The pattern is not a ghost hovering over the table. The pattern is the **shape of the channel** through which the physics flows. Engineers build with patterns because they are building channels.

  ### Recommended Reading (That isn't just "Emergence")
  If you want to dig into this without getting hand-waved:
  1.  **"Real Patterns" by Daniel Dennett.** (Directly addresses whether patterns are "real" or just descriptions).
  2.  **"Downward Causation" by Donald Campbell.** (The original paper defining the term).
  3.  **"The Causal Exclusion Argument" by Jaegwon Kim.** (The hard objection you are feeling).
  4.  **"Complexity: A Guided Tour" by Melanie Mitchell.** (Specifically the chapters on how high-level information constrains low-level physics).

  The feeling you have—that the pattern *must* be doing something—is correct, but the mechanism isn't force; it's **information as a constraint on physical possibility.**
