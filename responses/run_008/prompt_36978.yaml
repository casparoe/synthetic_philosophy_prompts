answer: |-
  Your suspicion is largely correct: these systems are indeed "historically frozen compromises," but they are not merely accidental. Each has developed a normative justification—a political theology, if you will—that stabilizes the compromise and makes it intelligible to its citizens. The key difference lies in how they define "neutrality." Is neutrality a distance (the state steps back), a posture (the state supports all equally), or a background condition (the state embodies a specific tradition but tolerates others)?

  In **Germany**, the Basic Law (*Grundgesetz*) establishes what constitutional scholars call *hütende Neutralität* (protective or custodial neutrality). The state is not hostile to religion; rather, it views religious freedom as a positive good that sometimes requires state infrastructure to facilitate. The church tax and religious instruction are not violations of separation but affirmations that religion is a vital part of public life that the state should administer impartially. The strict requirement here is the *cooperation*: the state cannot simply ignore churches because it has constitutionally committed to facilitating their public role. However, the specific threshold for becoming a "public-law corporation" is underdetermined; historically, it favored the big two, but the theory demands openness to others, creating tension as Islam and smaller groups seek equal status.

  In **France**, *laïcité* presupposes that neutrality requires the state to be blind to religion to ensure the freedom of the conscience. This is not just separation; it is the construction of a secular public sphere (*l'espace public*) where citizens meet as equals, stripped of particularist identities. The strict requirement is the non-funding of worship and the neutrality of state agents. However, the extension of this neutrality to *users* of public services (like students wearing symbols) is a later, more contentious layer. It is underdetermined whether *laïcité* protects the individual from religious pressure or protects the Republic from religious visibility. The tension lies between freedom *of* religion and freedom *from* religious signs in the public square.

  In **England**, the system presupposes that establishment is compatible with neutrality because the Church of England is viewed as a constitutional organ rather than a theological enforcer. The theory is one of "symbolic establishment": the monarch and bishops represent the spiritual dimension of the state, but the state does not enforce doctrine. The strictly needed parts are the constitutional mechanics (Monarch as Supreme Governor, Lords Spiritual). What is underdetermined is the extent of privilege; the state funds faith schools of various denominations, which contradicts a strict "one church" theory but fits a broader "faith is good" theory. The tension is democratic: why do bishops have legislative rights while other faith leaders do not?

  In the **United States**, the theory is "non-preferentialism" tempered by "ceremonial deism." The Establishment Clause forbids a state church, but the courts have allowed generic religious acknowledgments that have lost theological weight through repetition. The strictly needed element is the absence of a specific sect's establishment. However, tax exemptions and legislative chaplains are underdetermined; they could be seen as unconstitutional subsidies or as harmless traditions. The tension is between the "wall of separation" rhetoric and the reality that the state accommodates religion broadly, presupposing that religion is a net social good that shouldn't be burdened, even if it can't be officially endorsed.

  Across all four, the shared core is the assumption that the *State* holds the ultimate authority to define the boundaries of religion. Even in separationist models, the state decides what counts as religion, what counts as a symbol, and what counts as neutral. None of these systems treat religion as entirely outside state jurisdiction; they all manage it, whether by cooperation, suppression, symbolism, or accommodation.

