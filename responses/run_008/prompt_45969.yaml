      *   *Refining the Newspaper Test:* The prompt says: "if limits on spending were not in any sense limits on speech, the state could cap a newspaper's printing budget." This implies the test is about *spending limits*. But the user's topic is *contribution caps*. I need to bridge this. The classmate likely conflated the two or argued contributions are a form of spending. I should note this distinction in the diagnosis. The newspaper analogy applies more directly to *expenditure* limits. For *contribution* limits, the analogy might be "capping how much advertisers can pay the newspaper." I will stick to the prompt's requested test case but note the friction if necessary. Actually, the prompt asks me to use *that* test case for each reading. I will apply it faithfully, noting where it strains under the contribution vs. expenditure distinction.

