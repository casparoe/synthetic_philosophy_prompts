          *   "Is": Constitutive (part of the act).
          *   Speech: Donor's.
          *   Verdict: Defensible.
          *   Test Case: Capping a newspaper's budget limits their ability to publish. But does it stop the *act* of publishing? No. It limits the scale.

      *   *Thesis 3 (Identity):* Money = Speech.
          *   "Is": Identity.
          *   Speech: Both.
          *   Verdict: False.
          *   Test Case: If Money = Speech, then financial regulation = speech regulation. This makes the newspaper case trivial but the premise absurd.

