answer: |-
  Here is a 40-minute battle plan designed for maximum intuition and minimum notation.

  ### 1. The Order of Operations
  You are correct: **Do not state the theorem first.** If you write the formula or the formal statement on the board at minute 1, you will lose them. The binomial intuition (why independent errors cancel out) is the prerequisite.

  **The Sequence:**
  1.  **The Mechanism (5 mins):** How do we aggregate decisions? (Majority vote on a binary truth).
  2.  **The Intuition (10 mins):** The "Noise Cancellation" demo (N=1 vs N=3 vs N=101).
  3.  **The Theorem (10 mins):** Formalizing the intuition ($p > 0.5$).
  4.  **The Twist (10 mins):** The $p < 0.5$ case (The "Disaster" scenario).
  5.  **The Catch (5 mins):** Independence and the closing question.

  ### 2. The One Concrete Scenario
  **The "Foggy Watchtower" Scenario.**
  Do not use a political election (no objective truth) and be very careful with a legal jury (jurors deliberate, violating independence).

  *   **The Setup:** There is a Yes/No fact (e.g., "Is the enemy ship over the horizon?"). There is an objective truth (Ship is either There or Not There).
  *   **The Voters:** 100 Lookouts in separate towers. They cannot talk to each other.
  *   **The Noise:** It is foggy. Each lookout is imperfect.
  *   **The Competence ($p$):** Each lookout has a specific probability of being right.

  **What it must have:**
  *   **Binary Truth:** Emphasize there *is* a correct answer. This distinguishes it from preference voting.
  *   **Isolation:** Emphasize they are in *separate* towers. This sets up the independence assumption without using the word yet.
  *   **Identical Competence:** For the sake of the model, assume every lookout has the same skill level (e.g., 60% accurate).

  **What it must avoid:**
  *   **Deliberation:** If they talk, the math breaks.
  *   **Preferences:** This isn't "Do you *want* the ship to be there?" It's " *Is* it there?"
  *   **Averaging:** We are not averaging "how big is the ship?" We are voting Yes/No.

  ### 3. The 40-Minute Arc & Misconception Interception

  **0:00 – 0:05: Name Clearing & Setup**
  *   **Action:** Write "Condorcet Jury Theorem" on the board.
  *   **Intercept (Condorcet Paradox):** Immediately say: *"There is a famous 'Condorcet Paradox' about voting cycles (A beats B, B beats C, C beats A). That is not today. Today is about finding a single Truth, not ranking choices."*
  *   **Intercept (Wisdom of Crowds):** Define the voting rule. *"We are not averaging their guesses. We are not asking 'How far away is the ship?' We are asking 'Yes or No?' and taking the Majority."*

  **0:05 – 0:15: Building the Binomial Intuition (The Whiteboard Work)**
  *   **Action:** Draw three columns: **1 Lookout**, **3 Lookouts**, **101 Lookouts**.
  *   **Assume:** Competence $p = 0.6$ (Better than a coin flip).
  *   **N=1:** Probability of Right = 0.6. (Write this).
  *   **N=3:** Ask them: *"When does the majority get it right?"*
      *   They need 2 right + 1 wrong, OR 3 right.
      *   Do the rough math on the board: $3 \times (0.6 \times 0.6 \times 0.4) + (0.6 \times 0.6 \times 0.6) \approx 0.648$.
      *   **Point:** It went up (0.6 $\rightarrow$ 0.65).
  *   **N=101:** Don't calculate. Draw a bell curve.
      *   Show that as $N$ grows, the "spread" of outcomes narrows around the average (60%).
      *   Since 60% is greater than 50%, the "Majority Right" bucket swallows almost the entire curve.
      *   **Visual:** Shade the area below 50% (Majority Wrong) and show it shrinking to zero as $N$ increases.

  **0:15 – 0:25: The Theorem ($p > 0.5$)**
  *   **Statement:** *"If each voter is more likely to be right than wrong, and they vote independently, adding more voters makes the majority verdict approach 100% certainty."*
  *   **Social Connection:** This is the optimistic view of democracy/expert panels. More voices = more truth.

  **0:25 – 0:35: The Twist ($p < 0.5$)**
  *   **Action:** Change the scenario. *"What if the fog is magnetic? What if the lookouts are colorblind and see the opposite signal?"*
  *   **New Math:** Competence $p = 0.4$ (Worse than a coin flip).
  *   **Intuition:** If the average vote is "Wrong," and we add more voters, the Law of Large Numbers says the average will converge *tighter* around "Wrong."
  *   **The Feeling:** This is the crucial emotional beat. More voters $\rightarrow$ Higher confidence in the **False** answer.
  *   **Intercept (Blind Trust/Experts):** *"This is why 'consensus' isn't enough. If a panel of experts is systematically biased (if their $p < 0.5$), adding more experts doesn't save you; it makes the error more confident. We need competence, not just headcount."*

  **0:35 – 0:40: The Catch (Independence) & Closing**
  *   **Action:** Erase the bell curves. Draw the watchtowers again.
  *   **Warning:** Draw a telephone line connecting the towers. *"The theorem assumes Independence. If they copy each other, or read the same biased newspaper, or listen to the same leader, you don't have 100 voters. You have 1 voter with 100 megaphones."*
  *   **Exclusion Statement:** *"We are ignoring ties (assume odd numbers) and we are ignoring the proof details (binomial coefficients). We are focusing on the behavior of the system."*

  ### 4. What to Openly Refuse to Cover
  1.  **The Algebraic Proof:** Do not write out $\sum \binom{n}{k} p^k (1-p)^{n-k}$. It creates a barrier. The bell curve visual is sufficient for "almost certain."
  2.  **Correlated Evidence Derivations:** Do not try to model *how* correlation breaks the math (e.g., intraclass correlation coefficients). Just state it as a qualitative "Warning Label."
  3.  **Heterogeneous Competence:** Keep $p$ identical for all voters. Discussing "what if some are smarter than others" muddies the core intuition of $N$ vs. $p$.

  ### 5. The Closing Question
  You need to test if they understand that $N$ only matters if the information is *new*.

  **Ask this:**
  > *"I have one expert who is 60% accurate. I also have 1,000 parrots. The parrots don't know the answer, but I train them to copy the expert's vote exactly. According to the theorem, does adding the 1,000 parrots increase the probability that the majority is right?"*

  **The Answer they must give:**
  *   **No.**
  *   **Why:** Because the votes are not independent. The "effective" $N$ is still 1. The parrots add noise-free redundancy, not new information. If the expert is wrong, the majority is wrong 40% of the time, regardless of the parrots.

  **Why this works:**
  *   It catches people who think "More Voters = Always Better."
  *   It catches people who confuse "Majority Size" with "Independence."
  *   It reinforces the specific condition ($p > 0.5$ AND Independence) required for the theorem to hold.
