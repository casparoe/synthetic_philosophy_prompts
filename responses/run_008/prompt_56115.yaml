prompt: |-
  I direct the research staff of a citizen-participation office in a mid-sized city, and we are perpetually in the business of creating small, ad-hoc voting bodies: neighborhood councils with advisory power, special-purpose districts (a watershed authority, a business improvement district, a library taxing district), and the occasional referendum, such as an upcoming vote on whether an industrial neighborhood may secede from the city and govern itself. Nearly every time we stand one of these bodies up, we get the same fight: who counts as a member of the demos for this decision? My staff keep improvising answers, and I would like to replace the improvisation with something defensible. The philosophical tension I want the procedure built around is the familiar one between two principles: that everyone whose interests are affected by a decision should have a say in it, and that the demos is properly constituted by those subject to the decision's authority or coercion rather than merely touched by its effects. There is also a third consideration my staff keep running into: some people have relevant local knowledge that the decision needs (the people who actually maintain the watershed, work at the refinery, use the school), and a fourth, practical worry: if every remotely affected party gets a vote, some of these bodies become too large and too heterogeneous to make any decision at all.

  Please convert this tangle into a decision procedure my staff can actually run in under an hour per decision, with no philosophy background, producing a written record that would survive a hostile question at a city council meeting. Give me the questions to ask in order, what counts as a sufficient answer to each, default rules for when the answers are murky (for instance: when in doubt, does the procedure default to residents of the legal boundary, to property owners, to some residency-plus-stake hybrid, or to an explicitly provisional franchise?), and the points where the procedure must stop and hand the choice to elected officials because the remaining question is one of values rather than facts. Be honest about which steps are judgment calls dressed up as procedure, and about what the procedure systematically cannot do — I am particularly interested in whether it can say anything principled about parties who are affected but cannot vote at all: future residents, children, and, in one live dispute, a downwind suburban municipality in another jurisdiction entirely that will bear the air-quality consequences of the refinery neighborhood's secession vote.

  Then run the procedure on three cases we actually face. First, the refinery secession referendum itself: the seceding neighborhood's 9,000 residents would gain zoning and emissions authority whose effects fall mostly on 60,000 people downwind, in a different city. Second, a school district vote on consolidating and closing two schools, where roughly a fifth of the enrolled children live outside the district lines because of an open-enrollment agreement the district now wants to factor into the decision. Third, the watershed authority's vote on reallocating irrigation water, which affects farmers inside the district, downstream recreational users outside it, and a city that draws its drinking water from the river but has never had a seat on the authority. For at least one of these, I expect the procedure to give an answer I will find politically unwelcome, and I would rather see that outcome worked honestly than smoothed over.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure and case analyses:

  1.  **Deconstruct the Request:**

      *   **User Role:** Director of research staff in a citizen-participation office (mid-sized city).
      *   **Problem:** Constant ad-hoc creation of voting bodies (neighborhood councils, special districts, referenda) leads to fights over *who gets to vote* (the boundary problem).
      *   **Core Tension:** All-Affected Principle (interests affected) vs. All-Subjected Principle (subject to authority/coercion).
      *   **Additional Considerations:** Epistemic value (local knowledge), Practicality (decision-making capacity).
      *   **Deliverable:** A decision procedure (flowchart/checklist style) runnable in <1 hour by non-philosophers, producing a defensible written record.
      *   **Requirements:**
          *   Ordered questions.
          *   Sufficient answers.
          *   Default rules for murky areas.
          *   Hand-off points to elected officials (value judgments).
          *   Honesty about judgment calls and limitations (especially regarding non-voters like future gens, children, external jurisdictions).
          *   Application to three specific cases:
              1.  Refinery Secession (9k residents vs. 60k downwind outsiders).
              2.  School Consolidation (District voters vs. Open-enrollment outsiders).
              3.  Watershed Authority (Farmers inside vs. Recreation/Drinking water outside).
      *   **Constraint:** Must be honest about politically unwelcome outcomes.

  2.  **Develop the Decision Procedure (The "Boundary Protocol"):**

      *   *Goal:* Balance legal defensibility, philosophical coherence, and practical speed.
      *   *Structure:* Needs to be a step-by-step filter.
      *   *Step 1: Legal Baseline.* Start with existing law. If the state statute says "property owners," that's the floor.
      *   *Step 2: The Coercion Test (All-Subjected).* Who is legally bound? This is the strongest claim.
      *   *Step 3: The Impact Test (All-Affected).* Who suffers tangible harm/benefit? Needs a threshold to avoid "everyone on earth."
      *   *Step 4: The Competence/Knowledge Test.* Who has the stakes *and* the knowledge to decide wisely? (Addresses the "heterogeneity" worry).
      *   *Step 5: The Capacity Check.* Can this group actually vote/meet?
      *   *Step 6: The Hand-Off.* If conflicts remain, elected officials decide.
      *   *Defaults:* Need clear tie-breakers. Residency is usually the safest legal default.
      *   *Limitations:* Must explicitly state who gets excluded (future gens, external jurisdictions without legal standing).

      *Drafting the Protocol:*
      *   *Name:* The "Franchise Boundary Protocol" (FBP).
      *   *Time limit:* 45-60 mins.
      *   *Output:* A "Franchise Memorandum."

  3.  **Address the Philosophical Tensions within the Procedure:**

      *   *Affected vs. Subjected:* Prioritize "Subjected" (coercion) as the *right* to vote, treat "Affected" as a *right to input* (testimony) but not necessarily a vote, unless the impact is existential.
      *   *Knowledge:* Use this to justify *excluding* disengaged stakeholders if the body needs to be functional, but be careful not to sound elitist. Frame it as "Primary Stakeholders."
      *   *Externalities:* This is the hard part. The procedure must admit it cannot solve cross-jurisdictional externalities via voting alone. It must flag them for inter-governmental agreement.

  4.  **Develop the Three Case Studies:**

      *   **Case 1: Refinery Secession.**
          *   *Conflict:* 9k insiders vs. 60k downwind outsiders.
          *   *Application:* Insiders are subjected (new laws apply to them). Outsiders are affected (pollution) but not subjected (no legal authority over them).
          *   *Outcome:* Procedure likely limits vote to insiders.
          *   *Unwelcome Truth:* The 60k downwind people don't get a vote, even though they bear the cost. This highlights the limitation of local democracy regarding externalities. The mitigation must be regulatory, not electoral.
      *   **Case 2: School Consolidation.**
          *   *Conflict:* District residents vs. Open-enrollment families.
          *   *Application:* District residents pay taxes (subjected to cost). Open-enrollment kids use the service (affected).
          *   *Outcome:* Vote likely stays with tax-paying residents, *but* open-enrollment families get guaranteed testimony/input rights.
          *   *Nuance:* If the closure specifically targets the open-enrollment slots, their claim strengthens.
      *   **Case 3: Watershed Authority.**
          *   *Conflict:* Farmers (inside) vs. Recreation/City Water (outside).
          *   *Application:* Farmers are members (subjected). City/Recreation are affected.
          *   *Outcome:* Vote stays with Farmers.
          *   *Unwelcome Truth:* Drinking water safety is an externality. The procedure admits the voting body *cannot* represent the drinking water city. This requires a veto power or state intervention, not a vote expansion.

  5.  **Refine the "Honesty" and "Limitations" Sections:**

      *   Must explicitly state: "This procedure cannot grant votes to non-residents of another sovereign jurisdiction."
      *   Must explicitly state: "Future generations and children are represented by trustees/guardians, not direct vote."
      *   Must admit: "Sometimes the 'correct' philosophical answer is politically explosive."

  6.  **Review against Constraints:**

      *   *Under an hour?* Yes, if the questions are binary or threshold-based.
      *   *No philosophy background?* Use plain language (Coercion, Harm, Capacity).
      *   *Written record?* The "Franchise Memorandum" template.
      *   *Hostile question proof?* Relies on established legal baselines and clear thresholds.

  7.  **Final Polish:**

      *   Tone: Professional, bureaucratic but ethically aware, direct.
      *   Formatting: Clear headings, bold text for actionable items.
      *   Ensure the "Unwelcome Outcome" is highlighted in the Refinery case as requested.

  **(Self-Correction during drafting):** I initially thought about suggesting a weighted vote. *Correction:* No, that's too complex for a 1-hour procedure and legally risky. Stick to In/Out for voting, with Input rights for outsiders.
  *Correction on Case 1:* The prompt asks for an unwelcome outcome. If I say "Insiders vote," the Director might say "Well, obviously." The unwelcome part is admitting the *procedure validates* the exclusion of the 60,000 downwind people, forcing the Director to find non-electoral solutions for them. I need to make sure the procedure doesn't just wave a magic wand. It must say "They don't vote, and here is why that is a problem you must solve differently."

  *Refining the "Hand-Off":* When does it go to City Council? When the "Affected" group is large enough to constitute a moral crisis but lacks legal standing.

  *Final check on the "Default Rule":* Residency + Taxation is the standard legal default. I should stick to that as the safety net.

  8.  **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  Here is a operational decision procedure designed for your office. It is built to be fast, defensible, and honest about its own limitations. It does not solve the philosophical tension between "affected" and "subjected"; rather, it prioritizes them to prevent paralysis.

  ### The Franchise Boundary Protocol (FBP)

  **Purpose:** To determine the eligible voting membership (the demos) for ad-hoc citizen bodies.
  **Time Limit:** 45–60 Minutes.
  **Output:** A one-page "Franchise Memorandum" signed by the Research Director.

  #### Part 1: The Filter Questions (20 Minutes)
  *Staff must answer these in order. If a question yields a definitive "Yes," proceed to the next. If "No," stop and apply the associated rule.*

  **Q1: Is there a statutory or charter baseline?**
  *   *Definition:* Does state law or the city charter explicitly define who votes for this specific type of entity (e.g., "property owners within the boundary")?
  *   *If Yes:* **STOP.** The baseline is the franchise. You may expand it only if Q3 yields a "High Impact" finding.
  *   *If No:* Proceed to Q2.
  *   *Default:* Legal boundary residents + property owners.

  **Q2: The Coercion Test (All-Subjected)**
  *   *Definition:* Who will be legally bound by the new rules or taxes? Who can be fined or compelled by this body?
  *   *Sufficient Answer:* A list of persons/entities subject to enforcement.
  *   *Rule:* Anyone subject to coercion **must** be in the demos. Excluding them is legally indefensible.
  *   *Proceed to Q3.*

  **Q3: The Impact Threshold (All-Affected)**
  *   *Definition:* Are there parties *not* subject to coercion (Q2) who will suffer direct, tangible, and significant harm (not merely ideological disagreement or minor inconvenience)?
  *   *Threshold:* Is the harm physical, financial, or existential (e.g., health risk, property devaluation >10%, loss of essential service)?
  *   *If No:* **STOP.** Franchise = Q2 Group.
  *   *If Yes:* Identify the "External Stakeholders." Proceed to Q4.

  **Q4: The Capacity Check**
  *   *Definition:* If we add the External Stakeholders (Q3) to the Coerced Group (Q2), does the body become too large (>15,000 voters for a council, >50% increase in district size) or too heterogeneous to function?
  *   *If No:* **STOP.** Franchise = Q2 + Q3.
  *   *If Yes:* Proceed to Q5 (The Hand-Off).

  #### Part 2: The Hand-Off & Defaults (15 Minutes)
  *If you reach Q5, the procedure has hit a value conflict it cannot resolve algorithmically.*

  **Q5: The Value Judgment**
  *   *Question:* Does excluding the External Stakeholders (Q3) violate a core city value (e.g., equity, regional cooperation) enough to risk political backlash?
  *   *Action:* **STOP.** Draft the Franchise Memorandum recommending the Q2 Group, but flag the Q3 Group for "Non-Voting Representation."
  *   *Decision Authority:* This choice must be made by the City Council or City Manager. Your memo provides the options:
      1.  **Strict Boundary:** Vote limited to Q2 (Coerced). Q3 gets testimony rights only.
      2.  **Hybrid Board:** Vote limited to Q2, but Q3 gets appointed seats with veto power on specific issues.
      3.  **Expanded Franchise:** Vote opened to Q2 + Q3 (risks capacity issues).

  #### Part 3: The Written Record (Franchise Memorandum)
  *To survive hostile questioning, the memo must contain these four sections:*
  1.  **The Legal Baseline:** (Statutory requirements).
  2.  **The Coerced Class:** (Who is subject to authority).
  3.  **The Affected Class:** (Who is impacted but not coerced).
  4.  **The Exclusion Justification:** (Why the Affected Class did/ did not get a vote).

  ---

  ### Limitations and Honest Admissions
  *Include this footer on every Memorandum.*

  **What This Procedure Cannot Do:**
  1.  **Future Generations:** This procedure cannot grant votes to future residents. Their interests are represented only through current sustainability constraints imposed by higher law (state/federal).
  2.  **Children:** Minors are excluded from voting. Their interests are presumed to be represented by guardian/parents within the household unit.
  3.  **External Sovereignty:** This procedure cannot grant voting rights to residents of *other* sovereign jurisdictions (e.g., a different city or county). To do so would violate their home jurisdiction's laws. Their protection lies in inter-governmental agreements, not ballots.
  4.  **Judgment Call:** Step Q5 is not a calculation; it is a political risk assessment. Staff recommends; Officials decide.

  ---

  ### Case Applications

  Here is the protocol applied to your three live disputes.

  #### Case 1: The Refinery Secession Referendum
  *   **Context:** 9,000 residents vote to secede and gain zoning/emissions authority. 60,000 downwind residents in a neighboring city face increased pollution.
  *   **Q1 (Statutory):** State secession law usually limits vote to residents of the seceding territory. **Baseline = 9,000 Residents.**
  *   **Q2 (Coercion):** The new local laws apply only to the 9,000. They are the subjected class.
  *   **Q3 (Impact):** The 60,000 downwind residents face tangible physical harm (air quality/health). They clear the Impact Threshold.
  *   **Q4 (Capacity):** Adding 60,000 voters to 9,000 changes the ratio 7:1. It effectively dissolves the "neighborhood" council into a regional body. Capacity Fail.
  *   **Q5 (Hand-Off):** This is the friction point.
  *   **Protocol Recommendation:** **Limit Vote to the 9,000.**
  *   **The Unwelcome Truth:** The procedure validates the exclusion of the 60,000 downwind victims.
  *   **Justification for Record:** "While the downwind population is significantly affected, they are not subject to the authority of the new municipality, nor do they reside within the legal boundary. Granting them a vote would violate the sovereignty of their own jurisdiction and render the secession vote functionally impossible. Protection for the 60,000 must be sought through state environmental regulation and inter-municipal compacts, not through this franchise."
  *   **Political Risk:** High. You are formally documenting that local democracy permits externalizing costs onto non-voters.

  #### Case 2: School District Consolidation
  *   **Context:** District voters decide on closing schools. 20% of students are open-enrollment outsiders (no tax liability in this district).
  *   **Q1 (Statutory):** School board elections are typically limited to registered voters within the district boundaries. **Baseline = District Residents.**
  *   **Q2 (Coercion):** District residents pay the taxes and are bound by the zoning/schooling rules. Outsiders are not taxed.
  *   **Q3 (Impact):** Outsider families lose access to the specific schools their children attend. This is a significant service loss.
  *   **Q4 (Capacity):** Adding 20% more voters is manageable. Capacity Pass.
  *   **Q5 (Hand-Off):** Not strictly necessary, but recommended for equity.
  *   **Protocol Recommendation:** **Limit Vote to District Residents (Taxpayers), Grant Testimony Rights to Outsiders.**
  *   **Justification for Record:** "The franchise is tied to fiscal liability. While open-enrollment students are heavily affected, their families do not bear the tax burden of the consolidation. However, because the impact is high, the procedure recommends a 'Stakeholder Witness' period where affected non-voting families must be heard before the ballot is finalized."
  *   **Nuance:** If the closure targets *only* the programs used by outsiders, Q3 strengthens. If so, flag for City Council review as a potential civil rights/compliance issue, not a franchise issue.

  #### Case 3: Watershed Authority Irrigation Vote
  *   **Context:** Farmers (inside) vote on water allocation. Downstream recreation (outside) and Drinking Water City (outside) lose flow/quality.
  *   **Q1 (Statutory):** Watershed districts are usually special districts defined by hydrology, often limited to landowners within the basin. **Baseline = Landowners in District.**
  *   **Q2 (Coercion):** Farmers are subject to the allocation rules. The Drinking Water City is not; they simply receive the consequence.
  *   **Q3 (Impact):** Drinking Water City faces health/treatment cost impacts. Recreation users lose amenity. Both clear the threshold.
  *   **Q4 (Capacity):** The "Downstream" is potentially infinite (everyone along the river). Capacity Fail.
  *   **Q5 (Hand-Off):** Critical.
  *   **Protocol Recommendation:** **Limit Vote to Farmers. Require Inter-Governmental Agreement (IGA).**
  *   **Justification for Record:** "The downstream parties, including the Drinking Water City, are affected but not subjected to the Authority's governance. Expanding the franchise to all downstream users is geographically indeterminate. The procedure dictates that the Authority cannot vote on water that legally belongs to the public trust downstream without an IGA. The vote may proceed, but implementation is conditional on state approval."
  *   **The Hard Limit:** This highlights the procedure's inability to protect the "Public Trust." The vote happens, but the *power* to execute is checked by the state, not the ballot box.

  ### Summary of Defensibility

  This protocol protects you because it separates **Rights** (Coercion) from **Interests** (Impact).
  *   When attacked for excluding the downwind neighbors (Case 1), you point to **Sovereignty**: "We cannot hold elections in another city."
  *   When attacked for excluding the students (Case 2), you point to **Fiscal Liability**: "Voting is tied to taxation."
  *   When attacked for the water (Case 3), you point to **Capacity**: "We cannot define the boundary of 'downstream'."

  **The Trade-Off:** You are trading moral completeness for administrative viability. The written record must explicitly state: *"This procedure determines who votes, not who matters. Parties excluded from the franchise under this protocol require alternative representation (legal, regulatory, or appointed) to ensure their interests are not ignored."* This sentence is your shield. It admits the flaw while closing the loop on the decision.
