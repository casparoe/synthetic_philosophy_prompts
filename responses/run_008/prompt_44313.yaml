answer: |-
  **POSITION:** Unpaid Brand Synergy Intern (Fall Cohort)
  **COMPENSATION:** $0.00/hour + Academic Credit (Pending)
  **LOCATION:** New York, NY (On-site required)

  Veritas Horizon Media is pleased to announce openings for our Fall Cohort of Unpaid Brand Synergy Interns. Applicants often inquire why we do not offer stipends. This misunderstanding stems from a failure to grasp Zahavi's Handicap Principle. In labor markets, cheap talk is free and therefore worthless. Any candidate can claim "passion" on a cover letter. Such signals are low-cost and easily mimicked by low-quality agents. To guarantee honesty, signals must be costly. They must impose a fitness cost that only high-quality agents can afford to bear.

  Therefore, the unpaid nature of this internship is not an oversight; it is the primary selection mechanism. By requiring you to forego income for 40 hours weekly, we verify your access to external capital reserves. This is a robust handicap. A peacock's tail is heavy and attracts predators; our internship is financially burdensome and attracts anxiety. Both prove fitness through waste. If the signal weren't wasteful, it wouldn't work.

  Requirements include a degree from a top-10 university in any field. We do not care about the curriculum. We care about the tuition cost and admissions selectivity. These are sunk costs that demonstrate your lineage's ability to invest in non-productive status markers. Whether you studied Philosophy or Quantitative Economics is irrelevant; the signaling value lies in the barrier to entry, not the human capital accumulation. Similarly, prior unpaid experience is mandatory. This proves you have already successfully signaled in previous markets and possess the stamina for continued utility loss.

  The environment is fast-paced, implying 60-hour weeks with high burnout risk. This is intentional. Enduring sleep deprivation without compensation separates the committed from the merely interested. As our Head of Talent Acquisition notes, "Other firms are stuck in a pooling equilibrium where everyone looks qualified because they all claim to be hardworking. We have achieved a clean separating equilibrium. We filter out anyone who needs to eat."

  Not everyone agrees with our methodology. Dr. Elias Thorne, an evolutionary economist at the Institute for Market Dynamics, observes: "The Veritas model is technically efficient at sorting, but socially perverse. It filters exclusively for parental wealth, not talent. The cost is pure deadweight loss—resources burned solely to prove you have resources to burn. It creates no value, it merely transfers opportunity to those with the highest subsidy." We consider this a fair trade for brand integrity and signal clarity.

  To apply, submit a CV, transcript, and a letter detailing your financial runway. Do not tell us what you can do. Show us what you can afford to lose. Veritas Horizon Media is an equal opportunity employer committed to maintaining a high-cost barrier to entry.
