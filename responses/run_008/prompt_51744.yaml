          1.  "The loop in the ward" (~400 words): Scenes where classification reshapes the classified from the inside.
          2.  "Where Kesey isn't Hacking" (~300 words): Where the mechanism is coercion rather than looping (plainly stated).
          3.  "Scenes to teach" (~250 words): 3-4 specific scenes, what they show/don't show.
          4.  "What the novel adds" (~150 words): What fiction gives students that Hacking's essays don't.
