      *   **The Tension:** The prompt asks me to be honest about whether it's really looping or just force. Hacking emphasizes the *feedback loop of knowledge*. Kesey emphasizes the *violence of normalization*.
      *   **Section 1 (The Loop):** Focus on Harding (homosexuality as sickness), Billy (stutter/mother complex), Bromden (pretending to be deaf/mute until he isn't). These are internalizations.
      *   **Section 2 (Not Hacking):** Focus on McMurphy (resists until broken physically), the lobotomy (making the label true by destroying the agent), the Combine (conspiracy/power vs. knowledge). Hacking is about dynamic classification; Kesey is about static enforcement via violence.
      *   **Section 3 (Scenes):** Group therapy sessions (internalization), the fishing trip (breaking the loop?), the lobotomy (ending the loop via destruction), Bromden's escape (rejecting the classification).
