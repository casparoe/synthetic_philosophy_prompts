      *   *CDT Stance:* CDT says you should choose the act that *causes* the best outcome. But your act doesn't cause Death's prediction (it happened in the past/is fixed). So, standard CDT often struggles here. It leads to instability.
      *   *The "Randomization" Solution:* To beat a perfect predictor who models your *reasoning*, you must introduce noise (a coin flip) so there is no fact of the matter to predict until the flip happens.
      *   *The Tension:* If Death predicts the *decision procedure*, he predicts you will flip a coin. If he predicts the *outcome*, he can't predict a truly random coin flip.
      *   *Newcomb's Problem:* CDT two-boxes (takes both boxes). Evidential Decision Theory (EDT) one-boxes. In Newcomb's, two-boxers usually get less money but claim they acted rationally. In Death in Damascus, the "rational" move (fleeing) leads to death, just like staying.
