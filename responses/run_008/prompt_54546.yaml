      *   *Decision:* I will focus on the coherence of Common Knowledge of Rationality (CKR). If CKR is logically inconsistent in finite games (as Binmore and others suggest), then Marco's starting point is nonsense. If CKR is consistent, Marco has a stronger leg. I'll bet on the consistency of CKR being the weak point.

