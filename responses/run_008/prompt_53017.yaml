      *Simpler metric:* Compare the variance of final scores against the variance of initial scores. Also, survey panelists on whether they felt pressured.
      *Best metric for "cascade":* In the old system, Seat 1 & 2 predicted the outcome. In the new system, Seat 1 & 2 (in discussion) should not predict the outcome better than random.
      *Let's stick to practical metrics:* 1. Reduction in score drift (initial vs final). 2. Panelist survey on independence. 3. Correlation of seating order with final scores (should be null).

