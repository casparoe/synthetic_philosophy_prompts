answer: |-
  # DECISION TREE: THE LOGIC OF DRUG POLICY

  **Starting Consensus:** Recreational drug use carries a risk of serious harm to the user.
  **Instruction:** Answer the following questions in order. Follow the arrows to your terminal position.

  **Q1. THE HARM PRINCIPLE**
  May the criminal law punish conduct that harms *only* the actor, or must harm to others (or failure of voluntariness) be established first?
  *   **A. Yes, law may punish self-harm.** $\rightarrow$ Go to **Q2**.
  *   **B. No, law must not punish self-harm.** $\rightarrow$ Go to **Q3**.

  ---

  **Q2. VOLUNTARINESS & ADDICTION** (For those answering Q1-A)
  Does heavy addiction defeat the voluntariness required for culpability, such that coercive treatment for the user's own good is justified instead of punishment?
  *   **A. Yes, addiction removes culpability.** $\rightarrow$ **PORTUGUESE DECRIMINALIZATION**
      *(Use remains formally prohibited, but users are referred to a dissuasion commission rather than criminal court.)*
  *   **B. No, users remain culpable.** $\rightarrow$ Go to **Q4**.

  **Q4. ENFORCEMENT & SUPPLY** (For those answering Q2-B)
  If use is prohibited, is the asymmetry between user and supplier principled, or should the state tolerate retail sale despite prohibition on paper?
  *   **A. Tolerate retail sale (De Facto).** $\rightarrow$ **DUTCH TOLERANCE**
      *(Prohibitionist on paper, but retail sale is tolerated within strict guidelines; supply chain remains illicit.)*
  *   **B. Enforce uniformly (De Jure).** $\rightarrow$ **STRICT PROHIBITION**
      *(Criminal penalties for both use and supply; no administrative exceptions.)*

  ---

  **Q3. ENDORSEMENT** (For those answering Q1-B)
  Does legal permission imply state endorsement of use? Can this implication be severed (e.g., by limiting permission to therapeutic contexts)?
  *   **A. Yes, permission implies endorsement.** $\rightarrow$ **MEDICAL-ONLY REGIME**
      *(Use is permitted only when endorsed by medical authority; recreational use remains prohibited.)*
  *   **B. No, permission is neutral.** $\rightarrow$ Go to **Q6**.

  **Q6. GRADED HARM** (For those answering Q3-B)
  Does a more permissive stance toward cannabis than toward heroin track a principled difference in harm/dependence, or is consistency required across substances?
  *   **A. Principled difference exists.** $\rightarrow$ **TIERED LEGALIZATION**
      *(Some drugs legal, others prohibited. Note: Risk of collapsing into ad hocery or Medical Regime.)*
  *   **B. Consistency required.** $\rightarrow$ Go to **Q4 (Supply)**.

  **Q4. SUPPLIER ASYMMETRY** (For those answering Q6-B)
  Is the supplier morally distinct from the user (profiting from vice), justifying restrictions on how drugs are obtained?
  *   **A. Yes, supply is distinct.** $\rightarrow$ Go to **Q5**.
  *   **B. No, supply is neutral.** $\rightarrow$ **COMMERCIAL LEGALIZATION (CANADIAN/US)**
      *(For-profit sales, advertising permitted, market-driven.)*

  **Q5. COMMERCIALIZATION** (For those answering Q4-A)
  If supply is restricted, may it be sold for profit and promoted, or only through non-commercial channels?
  *   **A. Profit/Promotion permitted.** $\rightarrow$ **COMMERCIAL LEGALIZATION**
      *(Merges with Q4-B leaf; regulated market.)*
  *   **B. Non-commercial only.** $\rightarrow$ **NON-COMMERCIAL LEGALIZATION**
      *(Home cultivation, cannabis social clubs, or state monopoly with no profit motive/advertising.)*

  ***

  # COMMENTARY & DIAGNOSTIC NOTES

  **1. The Prohibition Cluster (Q1-A)**
  This branch captures regimes where the state retains the right to ban self-harming conduct.
  *   **Portuguese vs. Dutch:** The tree distinguishes these by *mechanism*. Portugal (Q2-A) focuses on the **user's status** (addiction negates culpability), diverting them to health commissions. The Netherlands (Q4-A) focuses on **enforcement discretion** (tolerating the market despite the law).
      *   *Honest Flag:* In practice, these leaves are neighbors. Both maintain "prohibition on paper." The distinction relies on whether the state admits the user is sick (Portugal) or simply looks away at the shop (Dutch).
  *   **Strict Prohibition:** The only leaf rejecting both health diversion and market tolerance.

  **2. The Permission Cluster (Q1-B)**
  This branch assumes the Harm Principle blocks criminalization of use.
  *   **Medical-Only (Q3-A):** Is this a genuine leaf or "Prohibition with an Exception"? The tree treats it as a distinct position based on **Expressivism**: the state refuses to *endorse* recreational use, granting access only via medical gatekeeping.
      *   *Diagnosis:* If you believe the state cannot endorse vice but must respect autonomy, this is your leaf. If you believe medical gatekeeping is just covert prohibition, you belong in Q3-B.
  *   **Tiered Legalization (Q6-A):** This leaf represents the "Cannabis Yes, Heroin No" position.
      *   *Diagnosis:* **Unstable.** Unless you can articulate a principled harm threshold that isn't arbitrary, this branch collapses into Medical-Only (if the threshold is high) or Full Legalization (if the threshold is low). It is included to force students to defend the gradient.

  **3. The Market Cluster (Q4 & Q5)**
  Here we address the gap between *permission* and *commercialization*. The standard liberal argument (Harm Principle) establishes permission (Q1-B), but most actual regimes deliver a commercial market (Q4-B/Q5-A).
  *   **Non-Commercial Legalization (Q5-B):** This leaf (Clubs, Home Grow, State Monopoly) is often dismissed as a "philosopher's artifact."
      *   *Diagnosis:* **Defensible.** It satisfies the Harm Principle (no criminalization) without inviting the public health risks of profit-driven promotion. It is the logical home for those who accept Q1-B (Permission) but reject Q5-A (Profit).
  *   **Commercial Legalization:** Requires answering "No" to Endorsement, "No" to Graded Harm, "No" to Supplier Asymmetry, and "Yes" to Profit. This is the most permissive leaf, requiring the most affirmative assumptions about markets.

  **4. Unoccupied or Incoherent Spaces**
  *   **"Legal but Punitive":** (Q1-B followed by desire for punishment). Incoherent. If law cannot punish self-harm, punishment is illegitimate.
  *   **"Non-Commercial Prohibition":** (Q1-A followed by Q5-B). If use is criminalized, the commercial question is moot; the state is the sole "supplier" via enforcement.
  *   **"Dutch User, Portuguese Supplier":** A regime that diverts users to health commissions but tolerates retail sale is theoretically possible but politically rare; it would sit between the Portuguese and Dutch leaves.

  **5. Instructional Use**
  Use this tree to reveal contradictions. If a student lands on **Commercial Legalization** but expresses worry about "corporate predation," ask if they should move to **Non-Commercial Legalization**. If a student lands on **Strict Prohibition** but opposes imprisoning addicts, ask if they belong in **Portuguese Decriminalization**. The goal is not to find the "right" leaf, but to ensure your leaf matches your principles.
