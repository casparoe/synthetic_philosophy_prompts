answer: |-
  Your verdicts reveal a hierarchy of trust based on origin, domain, and agency. You trust natural tradition for ingestion, engineered structures for transport, and status-quo chemicals for private external use, but you distrust industrial substances introduced to the body or shared systems.

  **The Principle**
  Accept engineered tools and traditional natural ingestibles; mitigate natural home hazards; but hesitate to introduce industrial substances into the body or shared environment, preferring known external chemicals over novel ones.

  **Clause Breakdown**
  *   *"Accept engineered tools..."*: Forced by the **airliner** case (new model accepted).
  *   *"...and traditional natural ingestibles"*: Forced by the **aged cheese/herbal teas** case (untested but traditional accepted).
  *   *"Mitigate natural home hazards"*: Forced by the **radon** case (natural hazard removed).
  *   *"But hesitate to introduce industrial substances into the body..."*: Forced by the **statin** case (engineered ingestion rejected).
  *   *"...or shared environment"*: Forced by the **fluoride** case (county addition rejected).
  *   *"...preferring known external chemicals over novel ones"*: Forced by the **pesticide** case (old harmful synthetic preferred over new unknown).

  **Application to New Cases**
  1.  **Lab-grown meat:** **Reject/Hesitate.** It is an industrial substance for ingestion, lacking the "traditional natural" status of cheese.
  2.  **Fast-tracked vaccine:** **Reject/Hesitate.** It is an industrial substance for ingestion classified as "novel" due to shortened trials, triggering the precautionary clause.
  3.  **House under transmission line:** **Unclear/Hesitate.** The principle covers "tools" (accept) and "natural hazards" (mitigate), but not existing engineered environmental hazards. Based on your bias against industrial exposure, you would likely hesitate, though the principle does not explicitly forbid it.

  **Blunt Assessment**
  The **fluoride** verdict is the most difficult to save cleanly. It rejects a *known* substance (studied for decades), while the pesticide verdict accepts a *known* harmful one. The principle saves fluoride only by relying on the "shared environment" distinction, which is a contextual nuance rather than a fundamental risk rule. If forced to simplify, this verdict contradicts the "prefer known" clause most sharply.

  Principle: Accept engineered tools and traditional natural ingestibles; mitigate natural home hazards; but hesitate to introduce industrial substances into the body or shared environment, preferring known external chemicals over novel ones.
