      *   *Players:* 14-16 students. Divide into 3-4 "Families" or "Households" (4-5 students each). This reduces chaos and encourages group deliberation on intention.
      *   *Ledgers:*
          1.  **Community Welfare (CW):** Total grain/health/survival points. Visible.
