      6.  **Round 3:** Aftermath.
      7.  **Ledgers:**
          *   **Survival Score (Welfare):** How many people lived? (Facilitator calculates).
          *   **Karmic Ledger:** Based on *Volition Cards* submitted secretly before the vote.
      8.  **Ripening:** Karmic Ledger is only opened after the game ends. It determines "Rebirth Status" (starting conditions for a hypothetical next game), distinct from "Survival Score."

