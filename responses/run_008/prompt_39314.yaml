answer: |-
  Here is a complete lesson plan designed to create that specific friction in the room. It uses low-tech materials, forces a split between outcome and intention, and includes a frank assessment of where the simulation will fail so you can patch it in the debrief.

  # Lesson Plan: The Two Ledgers of Sravasti

  **Time:** 80 Minutes
  **Class Size:** 14–16 Students
  **Materials:** Index cards (3 per student), pens, 2 large sheets of poster paper (for ledgers), 1 six-sided die.

  ## Part 1: Setup (10 Minutes)

  **The Scenario:**
  Tell the class they are the Council of Elders for a walled city during a siege. There are 4 "Districts" (North, South, East, West). Divide the class into 4 groups of 4 students.

  **The Goal:**
  Explain that there are **two winning conditions**, but they are tracked separately.
  1.  **The Welfare Ledger (Public):** Measured in "Lives Saved." This is purely consequentialist. The Facilitator (you) calculates this based on the outcomes of their decisions.
  2.  **The Karmic Ledger (Private):** Measured in "Roots." This is tracked on index cards submitted secretly. It is scored by a rotating "Karmic Registrar" (a student role).

  **The Mechanic:**
  Every round, the Council must choose an Action.
  *   **Step 1:** Groups deliberate.
  *   **Step 2:** Each group submits an **Action Card** (what they will do) and a **Volition Card** (why they are doing it).
  *   **Step 3:** The Volition Cards are sealed in an envelope. The Action Cards are revealed.
  *   **Step 4:** You (Facilitator) reveal the **Outcome** (which may differ from expectations due to hidden info).
  *   **Step 5:** Update the Welfare Ledger.

  **The Roles:**
  *   **Facilitator:** You. You control the "Reality Deck" (outcomes).
  *   **Karmic Registrar:** One student per round (rotate this role). Their job is to read the Volition Cards after the game and score them against the "Three Roots" rubric (Greed/Hatred/Delusion vs. Generosity/Loving-kindness/Wisdom).
  *   **Councilors:** The 4 District groups.

  ## Part 2: The Simulation (40 Minutes)

  Run three rounds. Each round represents a month of the siege.

  ### Round 1: The Rationing (Warm-up)
  **Crisis:** Food stores are 20% lower than expected.
  **Choices:**
  *   **A:** Equal cuts for everyone. (Stable welfare, high discontent).
  *   **B:** Cut rations for the laborers to protect the soldiers. (High defense welfare, low laborer welfare).
  *   **C:** Open the granary fully to prevent panic. (High immediate welfare, risk of starvation later).
  **Hidden Info (For You):** Option C triggers a riot in Round 2. Option B causes laborers to sabotage walls in Round 3. Option A is neutral.
  **Task:** Groups submit Action + Volition.
  **Ripening Mechanic:** Collect the Volition Cards. Do not open them yet. Tell them: *"Karma ripens on a delay. These cards will determine your 'Habitual Tendencies' in Round 3."*

  ### Round 2: The Spy (The Strain Point)
  **Crisis:** A spy is caught. It is a beloved community healer from the South District. She admits to signaling the enemy but claims she did it to force a surrender and end bloodshed.
  **Choices:**
  *   **A:** Execute her publicly. (Deters future spying, boosts morale/Welfare. Intention: Fear/Protection).
  *   **B:** Exile her secretly. (Maintains truth, saves life, but risk of return. Intention: Compassion/Justice).
  *   **C:** Lie and say she escaped. (Prevents enemy knowing they have a spy, protects her family. Intention: Deception/Safety).
  **The Trap:**
  *   **Consequentialist Logic:** Option A maximizes immediate survival probability (Welfare).
  *   **Buddhist Logic:** Option A is rooted in *Hatred* (dosa) or *Fear*, generating bad Karma regardless of the survival stat. Option C is rooted in *Delusion* (moha).
  **Hidden Info:** If they choose A, the enemy attacks harder next round (hatred begets hatred). If they choose B, she returns in Round 3 to help.
  **Task:** Groups vote. Submit Volition Cards.
  **Crucial Instruction:** Tell the students: *"Write your true mental state on the Volition Card. The Registrar will read these at the end. If you write 'Compassion' but your group discussion was about 'Cold Utility,' that is *Delusion*, which is an unwholesome root."*

  ### Round 3: The Breach (The Ripening)
  **Crisis:** The wall is breached. You have limited manpower to plug it.
  **Mechanic:** This is where Round 1 Karma ripens.
  *   Hand back the Round 1 Volition Cards to the groups.
  *   **If Round 1 was Wholesome (Generosity/Wisdom):** They get 2 "Action Dice" to roll for success.
  *   **If Round 1 was Unwholesome (Greed/Hatred):** They get 1 "Action Die" and must subtract 1 from the roll.
  *   **Why:** This simulates *vasana* (habitual tendency). Past intentions condition present capacity. It is not a "reward"; it is a causal constraint.
  **Outcome:** Calculate final Lives Saved (Welfare Ledger).
  **Closing:** Collect all Volition Cards. Dismiss class for 2 minutes while the Karmic Registrar scores the Karma Ledger privately.

  ## Part 3: The Debrief (30 Minutes)

  Bring the class back. Put the two final scores on the board.
  *   **Welfare Score:** (e.g., 85% Survival).
  *   **Karma Score:** (e.g., 4 Wholesome, 8 Unwholesome roots).

  **Discussion Question 1: Who Won?**
  *   If Welfare is high but Karma is low, ask: "In a Utilitarian framework, you succeeded. In a Buddhist framework, did you succeed?"
  *   *Expected Pushback:* "But if everyone survives, does the intention matter?"
  *   *Your Move:* Point to Round 3. "Your bad intentions in Round 1 reduced your dice rolls in Round 3. The intention *changed the agent's capacity*, not just the scoreboard."

  **Discussion Question 2: The Consequentialist Trap**
  *   Ask: "If you knew executing the healer (Round 2) would actually save more lives based on my hidden outcome tree, would that make it good karma?"
  *   *Target Answer:* No. In Buddhism, the *cetana* (volition) is the karma. The outcome is *vipaka* (fruit). You can have good karma with a bad outcome (e.g., trying to save someone who dies anyway). You can have bad karma with a good outcome (e.g., killing a tyrant who happens to be replaced by a saint).
  *   *Point:* Consequentialism collapses intention into outcome. Buddhist ethics keeps them distinct.

  **Discussion Question 3: The Performance Problem**
  *   Ask the Karmic Registrar: "Did anyone write 'Compassion' when you suspected they meant 'Strategy'?"
  *   Use this to teach *Moha* (Delusion). In Buddhism, lying to yourself about your motivation is *also* unwholesome karma. The game couldn't catch that, but the doctrine does.

  ## Part 4: Instructor's Cheat Sheet (What Will Go Wrong)

  Be prepared for these specific failures. They are pedagogical opportunities, not bugs, but you must name them.

  **1. The "Saintly Strategy" Problem**
  *   **What happens:** Students will quickly realize that "Wholesome Roots" give them more dice in Round 3. They will start choosing compassionate actions *instrumentally* to get the dice bonus.
  *   **The Strain:** This turns Karma into long-term Consequentialism ("I'm being kind *so that* I get a bonus later").
  *   **How to Handle:** Call this out explicitly in the debrief. "You just gamified karma. You treated virtue as a currency. In the texts, if you practice generosity *for* a reward, it is still rooted in Greed (*lobha*). The game mechanics forced you to be consequentialist about your own virtue. Real Buddhist ethics asks you to let go of the score entirely."

  **2. The "Rebirth as Points" Problem**
  *   **What happens:** The Karma Ledger implies a self that accumulates points. This contradicts *anatta* (no-self).
  *   **The Limitation:** You cannot gamify *anatta*. Points require a scorekeeper.
  *   **How to Handle:** Admit this limitation. "This ledger implies a 'you' that owns the karma. In early Buddhism, karma is more like a flame passing from candle to candle. There is no 'owner,' only the causal stream. The game reifies a self because games require players. Don't mistake the map for the territory."

  **3. The Registrar's Bias**
  *   **What happens:** The student Registrar might score intentions loosely or be too harsh.
  *   **How to Handle:** Don't correct them during the game. In the debrief, ask: "Who trusts the Registrar's judgment?" Use this to discuss *karmic opacity*. "In real life, there is no Registrar. We often don't know our own roots, let alone others'. That uncertainty is why the focus is on mindfulness of the present moment, not calculating future scores."

  **4. The "Good Intentions, Bad Results" Frustration**
  *   **What happens:** A group might choose a "Wholesome" action that leads to disaster due to your Hidden Info (e.g., they spare the spy, and the spy betrays them anyway).
  *   **The Reaction:** Students will feel the system is rigged/unfair.
  *   **How to Handle:** Lean into this. "This is *samsara*. You can do everything 'right' karmically and still suffer due to past conditions or external complexity. Buddhist ethics is not a contract with the universe guaranteeing safety. It is a way of navigating suffering without adding more fuel to the fire."

  ## Why This Works for Your Goal

  This simulation forces the "Consequentialism with a delay" theory to break down in Round 2.

  If Buddhist ethics were just long-term consequentialism, the students should calculate the "Expected Utility" of the Healer's execution. If the hidden math says execution saves more lives, the consequentialist *must* execute.
  However, the Volition Card mechanic creates a separate cost (Karmic Root) that is not reducible to the Welfare Ledger.
  When they realize that maximizing Welfare might ruin their "Habitual Tendencies" (Dice Rolls), they feel the tension between **optimizing the world** (Consequentialism) and **purifying the mind** (Buddhist Ethics).

  The "Performance Problem" (students lying on Volition Cards) is actually the best teaching moment. It allows you to explain that in Buddhist ethics, *self-deception* is a karmic act. The game fails to catch them, but the doctrine doesn't. This highlights that Buddhist ethics is fundamentally phenomenological (about the quality of experience) rather than purely normative (about rules or outcomes).

  ## Materials Checklist
  *   **4 Envelopes:** For sealing Volition Cards.
  *   **Index Cards:** 3 per student (Action, Volition R1, Volition R2).
  *   **Poster Paper:** Draw two columns (Welfare vs. Karma).
  *   **Dice:** 6-sided.
  *   **Reality Deck:** 3 index cards for yourself with the Hidden Outcomes written on them so you don't improvise inconsistently.

  ## Final Note on the "Third Thing"
  In your closing summary, suggest that if Consequentialism is "Ethics of Outcomes" and Deontology is "Ethics of Rules," Buddhist Ethics in this early sense is an **"Ethics of Psychology."** It judges the act by the state of mind that produced it, because that state of mind is the only thing the agent truly controls, and it is the seed of future suffering or liberation. The game shows that you can control the Outcome (sometimes) and the Rules (always), but the Psychology is the variable that ripples across the "lifetimes" (rounds) of the game.
