      *   *Limitation:* You can't gamify *anatta* (no-self). Points imply a self. I need to be explicit about this in the debrief.

  6.  **Writing the Plan:**
      *   **Title:** *The Two Ledgers of Sravasti.*
      *   **Materials:** Index cards, dice, paper.
      *   **Setup:** 4 Guilds.
