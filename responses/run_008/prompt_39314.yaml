      *   *The Twist:* The outcome of an action is determined by a die roll or card draw *modified* by the Karmic Seed. Wait, if Karma modifies outcomes, that makes it instrumental (do good to get good results), which reinforces consequentialism.
      *   *Correction:* Karma needs to be separate from immediate outcome. The *Welfare* score is determined by the action's efficacy (skill/strategy). The *Karma* score is determined by the intention.
      *   *The "Strain" Moment:* A move that saves the village (High Welfare) but requires lying or sacrificing a vulnerable group (Bad Karma/Unwholesome Root). A move that honors truth/compassion (Good Karma) but leads to grain loss (Low Welfare).
