      *   **Debrief:** Map moments to doctrine, address the consequentialism question.
      *   **Critique:** Predict what will go wrong (gaming the system, performing compassion), acknowledge limitations (no-self, rebirth mechanics).
      *   **Tone:** American English, frank, practical, pedagogical.

  2.  **Deconstruct the Philosophical Problem:**
      *   *Consequentialism:* Right action = maximize good outcomes (welfare).
      *   *Buddhist Ethics (simplified for this context):* Right action = rooted in non-greed, non-hatred, non-delusion (wholesome roots). Outcomes matter but are secondary to the quality of the mind *and* are subject to complex causality (not just immediate utility).
      *   *The Tension:* If I maximize welfare but have bad intentions, Consequentialism says "Good," Buddhism says "Bad Karma." If I have good intentions but welfare suffers (due to complexity/uncertainty), Consequentialism says "Bad," Buddhism says "Good Karma (but maybe painful fruit due to past karma/complexity)."
      *   *The "Rebirth/Time" Issue:* Students think delayed consequences just make it long-term consequentialism. The game needs to show that *intent* changes the *agent*, not just the scoreboard.

  3.  **Drafting the Game Concept:**
