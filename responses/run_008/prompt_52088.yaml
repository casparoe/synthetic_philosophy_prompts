prompt: |-
  You're a decision theory researcher type, so I'm hoping you can untangle something that's been bugging me for a week straight. I got into this stuff through Newcomb's problem, and I thought I understood the "updateless" or "functional" style of decision theory (the one-boxing family), but now I think it contradicts itself between two cases. In case you don't remember them offhand, let me lay out my understanding. Counterfactual mugging: Omega, a perfect predictor, flips a fair coin. On heads, it gives you $10,000, but only if it predicted you'd pay $100 in the tails branch. On tails, it just shows up and asks you for the $100, no reward. The updateless agent pays the $100, because choosing the paying-policy nets you about $5k in expectation from before the flip, even though at the moment you're asked you've already seen tails and the $10k is gone. Then there's XOR Blackmail: you either have or don't have a nasty medical condition, independent of everything you decide. A predictor predicted whether you'd pay $1,000 if a certain letter arrived. A blackmailer sends the letter if and only if exactly one of (you have the condition, the predictor predicted you'd pay) is true. The updateless agent refuses to pay. Fine so far, maybe.

  Here's my problem though. It seems to me XOR Blackmail is literally just counterfactual mugging plus a letter. Both cases have a predictor whose past behavior depended on your future decision, and in both cases being asked for money is evidence about something you'd rather be different (in the mugging, being asked means the coin came up tails; in the blackmail, recieving the letter tells you something about your health). And the whole updateless rationale, as I understood it, is that your decision "correlates with" the better outcome, so you act as if your choice reaches back and fixes things — pay in the tails branch so you can have been the kind of person who gets the $10k on heads. But by that same logic, when the letter arrives you should pay the $1,000, since paying is evidence you're the healthy one and not the diseased one — the letter plus your payment tracks the good outcome exactly like the coin flip plus your payment does. So either updateless agents must pay in both cases or refuse in both, and the fact that they pay in one and refuse in the other looks totally ad hoc to me. I'm inclined to conclude that updatelessness is just broken here and the sensible move is to fall back on causal decision theory, which refuses to pay in both cases, whenever the two disagree.

  Please think this through carefully before answering — like, actually work out what happens under each policy in both scenarios with the numbers I gave, don't just pattern-match to whatever textbook line you have on updatelessness. Where exactly is my reasoning going wrong? Or am I actually onto something — are the two cases secretly the same, or is there some real structural difference between them that I'm missing (something about what does and doesn't depend on my decision)? And if there is a principled difference, can you state the rule that says pay in the mugging but refuse in the blackmail without it collapsing back into "pick whichever answer intuition likes case by case," because honestly that's what it looks like from where I'm sitting.
