answer: |-
  This is an excellent objection. You have correctly identified the tension that motivated the development of Functional Decision Theory (FDT) and refined versions of Updateless Decision Theory (UDT). If you treat these problems purely as "evidential correlations," they do look contradictory.

  However, the contradiction dissolves once we rigorously apply the **updateless prior calculation** to both cases. The difference isn't ad hoc intuition; it is a structural difference in where your decision algorithm exerts **logical control** over the payoff matrix.

  Let's work through the math of the *policies* (not the momentary decisions) for both cases.

  ### 1. The Core Principle: Policy Selection from the Prior

  Updateless agents do not ask, "Given I see Tails/The Letter, what should I do?" They ask, "Which **policy** (function mapping observations to actions) would I have wanted to commit to *before* the coin flip or the disease status was determined?"

  We compare the Expected Utility (EU) of the policies from the **prior** perspective (before any information is revealed).

  ### 2. Counterfactual Mugging (CM) Analysis

  *   **State:** Coin (50% Heads, 50% Tails).
  *   **Policy Options:**
      1.  **Always Pay:** If asked (Tails), pay $100.
      2.  **Always Refuse:** If asked (Tails), pay $0.
  *   **Omega's Behavior:** Omega predicts your policy.
      *   If Policy = Pay: Omega gives $10,000 on Heads. On Tails, Omega asks, you pay $100.
      *   If Policy = Refuse: Omega gives $0 on Heads. On Tails, Omega asks, you pay $0.

  **Prior Expected Utility Calculation:**
  *   **Policy Pay:** $0.5 \times (\$10,000) + 0.5 \times (-\$100) = \$4,950$.
  *   **Policy Refuse:** $0.5 \times (\$0) + 0.5 \times (\$0) = \$0$.

  **Result:** The **Pay** policy dominates. You pay on Tails because that logical fact is what *causes* the $10,000 to exist in the Heads branch. Your decision on Tails has **leverage** over the Heads payoff.

  ### 3. XOR Blackmail Analysis

  *   **State:** Disease (50% Sick, 50% Healthy). *Note: Probabilities don't matter as long as Disease cost > Blackmail cost.*
  *   **Policy Options:**
      1.  **Pay if Letter:** If letter arrives, pay $1,000.
      2.  **Refuse if Letter:** If letter arrives, pay $0.
  *   **Predictor's Behavior:** Letter is sent **IFF** (Disease XOR Predicted_Payment).
      *   Let $D=1$ (Sick), $D=0$ (Healthy).
      *   Let $P=1$ (Pay), $P=0$ (Refuse).
      *   Letter $L = 1$ iff $D \neq P$.

  **Prior Expected Utility Calculation:**
  Let's assume Disease Cost = -$1,000,000 and Blackmail Cost = -$1,000.

  *   **Policy Pay ($P=1$):**
      *   **If Healthy ($D=0$):** $L = (0 \neq 1) = \text{True}$. Letter arrives. You Pay.
          *   Outcome: -$1,000 (Blackmail).
      *   **If Sick ($D=1$):** $L = (1 \neq 1) = \text{False}$. No Letter. You Pay Nothing.
          *   Outcome: -$1,000,000 (Disease).
      *   **Total EU:** $0.5 \times (-\$1,000) + 0.5 \times (-\$1,000,000) = -\$500,500$.

  *   **Policy Refuse ($P=0$):**
      *   **If Healthy ($D=0$):** $L = (0 \neq 0) = \text{False}$. No Letter. You Pay Nothing.
          *   Outcome: $0.
      *   **If Sick ($D=1$):** $L = (1 \neq 0) = \text{True}$. Letter arrives. You Refuse.
          *   Outcome: -$1,000,000 (Disease).
      *   **Total EU:** $0.5 \times (\$0) + 0.5 \times (-\$1,000,000) = -\$500,000$.

  **Result:** The **Refuse** policy dominates.
  $-\$500,000 > -\$500,500$.

  ### 4. Where Your Reasoning Went Wrong

  Your intuition stumbled on this claim: *"Paying is evidence you're the healthy one... the letter plus your payment tracks the good outcome exactly like the coin flip plus your payment does."*

  This is the **Evidential Decision Theory (EDT)** trap. You are conditioning on the observation ("I see the letter") and asking what action correlates with health *given that observation*.

  *   **EDT Reasoning:** "If I see the letter and Pay, I am likely Healthy. If I see the letter and Refuse, I am likely Sick. So I should Pay."
  *   **UDT/FDT Reasoning:** "I must choose a policy *before* I know if I am Healthy or Sick. Which policy makes the 'Healthy' world better?"

  Look at the **Healthy Branch** in the XOR calculation above:
  *   Under **Pay Policy**: The Healthy world costs you **$1,000**. (Because the predictor sends the letter *because* you are the type who pays).
  *   Under **Refuse Policy**: The Healthy world costs you **$0**. (Because the predictor does *not* send the letter).

  In Counterfactual Mugging, the **Heads Branch** (the "good" branch) looks like this:
  *   Under **Pay Policy**: The Heads world gives you **$10,000**.
  *   Under **Refuse Policy**: The Heads world gives you **$0**.

  **The Structural Difference:**
  1.  **In CM:** Committing to Pay **creates value** in the counterfactual branch (Heads). You sacrifice $100 in Tails to gain $10,000 in Heads.
  2.  **In XOR:** Committing to Pay **destroys value** in the counterfactual branch (Healthy). You sacrifice $0 in Sick (outcome is identical) to lose $1,000 in Healthy.

  In XOR, your payment does not *buy* health. The disease status is independent. Your payment only determines whether the blackmailer successfully extracts money from you in the Healthy world. By committing to Pay, you are effectively signing a contract that says, "If I am healthy, I agree to be blackmailed." By committing to Refuse, you sign, "If I am healthy, I will not be blackmailed."

  Since you cannot change the Disease cost (it's -$1M in both policies if Sick), the tiebreaker is the Healthy branch. Refuse wins.

  ### 5. The Principled Rule

  You asked for a rule that distinguishes these without collapsing into intuition. Here is the formal criterion used in FDT/UDT:

  > **The Principle of Logical Control:**
  > An agent should choose the policy that maximizes expected utility from the prior, considering only those outcomes over which the agent's decision algorithm has **logical control**.
  >
  > *   **Logical Control exists** when the outcome is a function of the agent's policy (e.g., Omega's prediction, the Blackmailer's letter).
  > *   **Logical Control does not exist** when the outcome is independent of the agent's policy (e.g., the Coin flip result, the Disease status).

  **Applying the Rule:**

  *   **Counterfactual Mugging:**
      *   Does your policy control the Coin? **No.**
      *   Does your policy control Omega's Reward? **Yes.** (Reward = f(Policy)).
      *   *Decision:* Optimize the Reward. Paying maximizes the Reward function.

  *   **XOR Blackmail:**
      *   Does your policy control the Disease? **No.**
      *   Does your policy control the Letter? **Yes.** (Letter = f(Disease, Policy)).
      *   Does your policy control the Disease Cost? **No.**
      *   Does your policy control the Blackmail Cost? **Yes.**
      *   *Decision:* You cannot save the Disease Cost (it's fixed by nature). You can only minimize the Blackmail Cost.
      *   If you choose Pay: Blackmail Cost occurs in Healthy world.
      *   If you choose Refuse: Blackmail Cost occurs in Sick world (but you refuse to pay it).
      *   Since Healthy world value > Sick world value, you prefer to incur costs in the Sick world (where you are doomed anyway) rather than the Healthy world. Wait, actually, you prefer to incur *no* costs in the Healthy world. Refuse ensures $0 cost in Healthy world. Pay ensures -$1k cost in Healthy world.

  ### 6. Why CDT Fails Here

  You mentioned falling back to Causal Decision Theory (CDT). It is worth noting why CDT is not the "sensible move."

  *   **In XOR:** CDT refuses to pay. It gets the right answer, but for the wrong reason. CDT says, "My payment cannot causally affect the past prediction or the disease." It ignores the logical link. It gets lucky because the logical link in XOR doesn't help the Pay policy.
  *   **In CM:** CDT refuses to pay. It gets the **wrong** answer. CDT says, "The $10,000 is already gone or given based on the past. My payment now cannot causally affect it." It fails to recognize the **logical** causation (the prediction was based on *this* decision algorithm).

  If you adopt CDT to solve XOR, you lose $10,000 in Counterfactual Mugging. If you adopt UDT/FDT, you win in both.

  ### Summary

  The cases are not the same.
  *   **CM:** Paying **creates** a reward in the branch where you don't pay.
  *   **XOR:** Paying **creates** a penalty in the branch where you are healthy.

  In both cases, the Updateless agent asks: "Which policy makes the *other* branch (the one I'm not currently in, or the one I hope to be in) better?"
  *   In CM, the "Pay" policy makes the Heads branch better.
  *   In XOR, the "Refuse" policy makes the Healthy branch better.

  There is no contradiction. The math of the prior expected utility is consistent, provided you calculate the payoff of the *policy* across all possible worlds, not just the conditional probability of the observation.
