answer: |-
  Here is a diagnosis of the dispute, structured according to your constraints.

  ### 1. Diagnosis: Substantive Architectural Dispute, Not Merely Verbal

  Your working theory is that this is a borderline-verbal dispute about the semantics/pragmatics boundary. I argue that while it *looks* verbal because the surface predictions (utterance appropriateness) often overlap, it is actually a **substantive dispute about linguistic architecture with downstream theoretical costs.**

  It is not merely "two questions under one heading" because the answer determines the logical behavior of knowledge ascriptions. If the stakes-sensitivity is semantic (Contextualism/IRI), "knows" behaves like a gradable adjective (e.g., "flat," "tall") or an indexical (e.g., "here"). If it is pragmatic (Classical Invariantism), "knows" behaves like a factive verb with fixed truth conditions, where stakes affect only the *norms of assertion*.

  **Why it is substantive:**
  Semantics and pragmatics have different logical profiles. Semantic content typically projects through embeddings (conditionals, negation, modals), whereas pragmatic implicatures often do not. Therefore, the two sides *do* make different predictions, but the debate has stalled because philosophers have focused on **unembedded, present-tense ascriptions** (the "Bank Case" standard), where the outputs of both architectures are engineered to match.

  *   **The Contextualist** claims the truth conditions of "S knows p" shift with the attributor's context.
  *   **The Invariantist** claims the truth conditions are fixed, but the *warrant to assert* "S knows p" shifts.

  In a simple assertion ("John knows"), both predict you shouldn't say it in high stakes. But in complex sentences, they diverge. If the dispute were purely verbal, there would be no possible sentence where the truth-value diverges. There are such sentences; the disagreement is about whether our intuitions about them are reliable or easily overridden by pragmatic noise.

  ### 2. What Counts as Progress?

  Progress requires shifting the battlefield from **intuitions about cases** to **data about linguistic behavior.** We must stop asking "Is this true?" and start asking "How does this sentence function logically?"

  Progress looks like isolating the **semantic index** of "knows."
  *   If "knows" is contextualist, it should behave like "local" or "ready." (e.g., "It's raining" is incomplete without a location parameter).
  *   If "knows" is invariantist, it should behave like "bachelor" or "electron."

  The debate stalls because both sides engage in **theoretical accommodation.** When a counter-example arises, the Contextualist complicates the context parameters; the Invariantist complicates the pragmatic norms. Progress requires a constraint that prevents further accommodation. That constraint must come from the **logic of disagreement** and **embedding.**

  ### 3. Concrete Data Points for Theoretical Cost

  To force a side to pay genuine theoretical cost (rather than re-labeling), you need data where semantic content and assertability conditions come apart in their logical consequences. Here are two specific datums:

  **A. The Retrospective Self-Ascription Test**
  *   **Scenario:** At $t_1$, you are in a high-stakes situation regarding $p$ (e.g., navigating a ship through rocks) and lack absolute certainty. You do not say "I know." At $t_2$, you are in a low-stakes situation (e.g., recounting the story at a bar).
  *   **The Utterance:** "I didn't know $p$ back then."
  *   **Invariantist Prediction:** This is **True**. Your epistemic position at $t_1$ did not meet the fixed standard (or the subject-sensitive standard).
  *   **Contextualist Prediction:** This is **False** (or at least problematic). In your current low-stakes context ($t_2$), the standards for "knows" are low. Relative to *now*, you did know $p$ back then. To say "I didn't know" requires evaluating the past claim by past standards, which Contextualism struggles to explain without ad-hoc tense rules.
  *   **The Cost:** If ordinary speakers overwhelmingly judge "I didn't know back then" as **true** in low-stakes retrospection, Contextualism must posit a complex, non-standard semantics for past-tense knowledge ascriptions. If speakers judge it **false**, Invariantism must explain why we feel licensed to deny knowledge in the moment if it was technically true all along.

  **B. The Disagreement Contradiction Test**
  *   **Scenario:** Speaker A (low stakes) says "S knows." Speaker B (high stakes) says "S does not know." They are aware of each other's stakes.
  *   **The Question:** Is there a contradiction? Can they both be right?
  *   **Invariantist Prediction:** **Contradiction.** One is objectively wrong.
  *   **Contextualist Prediction:** **No Contradiction.** Both are true relative to their own contexts (like "It is hot" said by a Finn vs. a Senegalese).
  *   **The Cost:** If experimental subjects report that A and B are "disagreeing" in the same way they disagree about facts (e.g., "The cat is on the mat"), Invariantism is favored. If subjects report A and B are "talking past each other" or "both right from their perspective," Contextualism is favored.
  *   **Why this forces cost:** Contextualists currently handle this by appealing to "contextualist disagreement" (we disagree about what standards to adopt). If the phenomenology of the disagreement is indistinguishable from factual contradiction, the Contextualist must argue that our phenomenology of logic is systematically misleading. That is a high theoretical cost.

  ### 4. Where This Diagnosis Might Fail

  My diagnosis relies on the assumption that the **Semantics/Pragmatics distinction is psychologically real and sharp.** This is the weakest link.

  **The Failure Condition:**
  If cognitive science or psycholinguistics demonstrates that the human language faculty does not distinguish between "truth-conditional content" and "assertability norms" in the way philosophers assume, then the dispute is **verbal/category-error.**
  *   If the brain processes "knows" as a unified signal that integrates evidence, stakes, and social context simultaneously without a modular "semantic" stage, then arguing about which module handles the stakes is like arguing whether the "redness" of an apple lives in the skin or the flesh. It's everywhere.
  *   **Argument to push me:** A demonstration that "pragmatic" effects penetrate "semantic" processing so deeply (e.g., via rapid neural integration) that no logical test (embedding/negation) can isolate a pure semantic core. If "knows" is inherently a speech-act operator rather than a propositional attitude descriptor, the Invariantist/Contextualist framework collapses.

  ### 5. Can Experimental Results Settle This?

  **The Hope is Partially Confused.**
  Standard experimental philosophy (surveying intuitions on Bank Cases) cannot settle this because laypeople conflate truth with assertability. If you ask, "Is it true that John knows?", they answer based on whether it's *appropriate to say* John knows.

  **What Could Work:**
  Experiments must bypass the "truth" question and target **logical behavior.**
  *   **Method:** Do not ask "Is this true?" Ask "Can these two people both be right?" or "Does this sentence sound contradictory?"
  *   **The Limit:** Even this relies on folk metalinguistic intuitions, which are notoriously noisy.
  *   **The Verdict:** Experimental results can shift the **burden of proof**, but they cannot settle the **theoretical taxonomy.** If subjects show Contextualist patterns in disagreement tasks, the Invariantist can still argue (as Rysiew does) that this is a pragmatic expectation of uniformity, not a semantic truth.

  **Conclusion:**
  The dispute is substantive because it concerns the logical architecture of our epistemic vocabulary, not just the extension of the word "know." However, it is stalled because both sides have become too adept at modeling the *other side's* data within their own framework. Progress requires abandoning the "Bank Case" intuition pump in favor of **structural linguistic tests** (embeddings, anaphora, disagreement logic). If those tests yield ambiguous results, we must face the possibility that "knowledge" is not a natural kind in linguistics, and the debate is a philosopher's artifact.
