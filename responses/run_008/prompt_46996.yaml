answer: |-
  **MEMORANDUM**

  **TO:** Publications Committee
  **FROM:** Chair, Publications Committee
  **DATE:** October 23, 2024
  **SUBJECT:** Decision Regarding the 2024 Global Resource Projection

  **1. Purpose**

  This memo circulates ahead of Thursday's meeting to frame the Committee's decision on the staff team's proposal to publish a fresh run of the Institute's resource constraint model. The proposal predicts a global food-and-energy crunch circa 2075. Given the publication history of this model class (1974, 1995, 2012), this is not a routine publication decision. It requires us to adjudicate an epistemological question: whether the model's track record represents a legitimate scientific revision of long-term constants or an immunizing strategy that places the theory beyond falsification.

  **2. Epistemological Assessment: "Right but Early"**

  The team's defence rests on the claim that the model is "right but early." We must distinguish between a theory that is *premature* and one that is *unfalsifiable*.

  A theory is premature if it correctly identifies a mechanism but misjudges the rate of approach. It is unfalsifiable if it adjusts its parameters to ensure the critical event always remains outside the window of observation. The distinction lies in whether the revision explains *why* the previous parameters failed. Here, the team attributes past errors to mis-set time constants while retaining the same structure, with technical change entering as an exogenous "rescuing term" that the model does not explain.

  If the "rescue" is exogenous, the mechanism is not self-contained. To claim the model is "right" on mechanism while relying on an unmodelled variable to prevent immediate failure is to claim credit for the constraint while outsourcing the solution. This separates the mechanism-claim from the date-claim artificially. The date is the only observable output of the mechanism; if the date consistently recedes, the operational validity of the mechanism is in doubt.

  **3. The Fifty-Year Horizon Pattern**

  We must address the specific pattern of past projections.
  *   1974: Crunch in 26 years (2000)
  *   1995: Crunch in 50 years (2045)
  *   2012: Crunch in 50 years (2062)
  *   2024: Crunch in 51 years (2075)

  This constant-fifty-year horizon is evidence of parameter drift, not physical discovery. It suggests the model is solving for $T_{publication} + 50$, rather than identifying a fixed physical threshold approaching from the future. A model that consistently predicts a crisis one generation ahead, regardless of the starting date, functions more as a sociological statement than a physical forecast. Publishing this as a standalone forecast would validate a moving goalpost as a scientific finding.

  **4. The Malthusian Analogy**

  The team's covering note invokes Malthus, arguing that like him, the Institute is vindicated on mechanism despite errors on timing. This analogy is flawed. Malthus was not merely "early"; his mechanism (linear food growth vs. exponential population) was structurally incorrect because it could not account for endogenous technological shifts in agriculture.

  To invoke Malthus while simultaneously relying on an exogenous technical change term to rescue the model from immediate falsification is contradictory. We cannot claim Malthusian vindication on the constraint while relying on the very factor (unpredicted technical change) that disproved Malthus. The analogy flatters the model but does not strengthen its scientific standing.

  **5. The Counter-Argument: Long-Run Variables**

  The Committee must also weigh the dissenting view: that demanding short-run falsifiability from a theory of slow variables is a category error. History shows that long-run warnings (e.g., climate change, ozone depletion) are often dismissed as premature and vindicated decades later. To suppress a warning because it has not yet come to pass risks silencing a necessary Cassandra.

  I accept this premise. The value of the model may lie in its qualitative warning rather than its quantitative precision. However, a warning gains credibility not by insisting on a specific date that repeatedly slips, but by defining the conditions under which the warning would be deemed *incorrect*.

  **6. Decision and Conditions**

  To balance the need for rigorous science with the value of long-term warning, I recommend we **decline to publish the 2075 date as a forecast**, but **approve publication as a "Stress Scenario"** within a fan of alternatives, subject to the following explicit conditions:

  1.  **Reframing:** The 2075 date must be presented not as a prediction, but as a "Current Trajectory Scenario" based on specific, stated assumptions regarding technical change. The text must explicitly acknowledge the history of the 50-year horizon pattern.
  2.  **Intermediate Commitments:** To prevent the next revision from simply pushing the date to 2100, the team must commit to specific, falsifiable intermediate milestones. For example: *"If global energy intensity does not decline by X% by 2035, or if yield growth falls below Y% by 2040, this scenario trajectory is considered invalidated."* These checks must be fixed before publication and not revisable afterwards.
  3.  **Endogenous Tech Constraint:** The next model run (due no later than 2029) must attempt to endogenize the "technical change" term. Until the model explains the rescue mechanism, it cannot claim the mechanism is fully sound.

  **7. Implementation**

  The staff team is requested to revise the manuscript to reflect these conditions. Specifically, they must draft the "Intermediate Commitments" section for Committee review.

  **Deadline:** Revised manuscript and commitment metrics due by **November 15, 2024**.

  If the team cannot agree to fixed intermediate milestones that would count against the model class if missed, we must decline publication. A theory that cannot specify what would prove it wrong is not a forecast; it is a belief system. Our Institute publishes the former, not the latter.

  **8. Closing**

  This decision is not a judgment on the urgency of the resource constraint itself, nor on the competence of the modelling team. It is a defense of the Institute's epistemological integrity. Whether the crunch comes in 2075 or 2150 is less important than whether our method for estimating it remains tethered to observable reality. By anchoring the model to intermediate checkpoints, we ensure that if we are wrong, we know it sooner, and if we are right, we will know that too.

  Please review this framework prior to Thursday's session.
