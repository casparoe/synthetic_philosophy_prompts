      *Let's refine the "50-year" analysis:* If the crunch date always moves forward at the same rate time passes (1974->2000 [26 yrs], 1995->2045 [50 yrs], 2012->2062 [50 yrs], 2024->2075 [51 yrs]), it implies the model is structurally anchored to the publication date, not an external variable. This is the key epistemological flaw to highlight.

