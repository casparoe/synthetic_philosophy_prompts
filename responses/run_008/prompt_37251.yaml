answer: |-
  **Course Reading: PHIL 305 – Philosophy of Language**
  **Topic:** Conditionals, Possible Worlds, and *It's a Wonderful Life*
  **Instructor:** [Your Name]
  **Date:** Winter Term

  ### The Metaphysics of Pottersville: Conditionals, Cotenability, and the Miracle of *It's a Wonderful Life*

  **1. Introduction: The Angel as Semanticist**

  As we conclude our unit on conditionals, we turn from the abstract machinery of possible worlds semantics to a cultural artifact that dramatizes these very problems. Frank Capra's *It's a Wonderful Life* (1946) is often treated as a moral fable. For our purposes, it is a thought experiment made flesh. The protagonist, George Bailey, is granted a vision of a world in which his antecedent ("George Bailey was born") is false. The angel Clarence does not merely assert the counterfactual; he transports George into it.

  This reading asks you to treat the film not as a story that happens to involve a counterfactual, but as an argument *about* counterfactuals. We will examine whether the film's depiction of the "no-George world" aligns with the Lewis-Stalnaker framework of closest possible worlds, how it handles the problem of cotenability (what facts to hold fixed), and what the film suggests about the *purpose* of evaluating conditionals. Our verdict will rest on whether the film vindicates the semantic literature or exposes its limitations when applied to human lives.

  **2. The Indicative/Subjunctive Slippage**

  Recall the distinction from our earlier lectures. An indicative conditional ("If Oswald didn't shoot Kennedy, someone else did") leaves the antecedent open; a subjunctive or counterfactual conditional ("If Oswald hadn't shot Kennedy, someone else would have") presupposes the antecedent is false.

  George Bailey knows he exists. When Clarence says, "You have never been born," the antecedent is known to be false. This is a textbook counterfactual. However, the film performs a curious phenomenological trick. Once George enters the vision, the grammar shifts. He is not reasoning *about* the world from the outside; he is walking *through* it. He asks questions ("Where is Mary?"), receives answers ("She's an old maid"), and observes evidence (the sign on the library, the name on the cemetery stone).

  For the duration of the vision, the counterfactual is treated as an indicative fact. George updates his beliefs based on sensory evidence from Pottersville. Philosophically, this is impossible. We cannot observe non-actual worlds. We can only infer their properties based on laws and similarities to the actual world.

  *   **The Critique:** The film conflates *truth conditions* with *verification*. In Lewisian semantics, the truth of "If George hadn't been born, Harry would have died" depends on the structure of causal laws and world similarity, not on George going to a graveyard and looking at a headstone.
  *   **The Defense:** However, this conflation teaches us something vital about the *psychology* of conditionals. When we evaluate deep counterfactuals about our own lives, we do not run logical derivations. We simulate. We "walk around" the possibility in our imagination. Capra literalizes this simulation. The film suggests that for a counterfactual to be existentially meaningful, it must be experienced as an indicative reality, even if that is metaphysically illicit.

  **3. Closeness and the Selection of Pottersville**

  David Lewis and Robert Stalnaker argue that a counterfactual $A \square \rightarrow C$ is true if $C$ holds in the *closest* possible world where $A$ is true. "Closeness" is usually determined by similarity in particular facts and laws of nature.

  Is Pottersville the *closest* world where George Bailey was never born?
  *   **Arguments for Similarity:** The geography is identical. The buildings are the same (though the names change). The secondary characters (Mr. Gower, Ernie the cab driver) exist. This suggests a world minimally divergent from our own, satisfying the "minimal mutilation" principle.
  *   **Arguments for Dissimilarity:** The *tone* of Pottersville is radically different. It is a noir-ish landscape of vice, cynicism, and fear, whereas Bedford Falls is communal and warm. One might argue that the removal of one man—even a good man—should not turn a small town into a den of iniquity so completely.

  Here, the film risks "cherry-picking" the world for rhetorical effect. Clarence is not a neutral semanticist; he is a therapist trying to prevent a suicide. He selects a world designed to maximize the contrast in value. If the closest world were one where George didn't exist but the town was merely *slightly* less charitable, the lesson would fail.

  *   **Philosophical Implication:** This suggests that in moral and existential contexts, "closeness" is not just about metric similarity of facts, but about *salience of difference*. We are interested in the world that highlights the causal impact of the antecedent. The film implies that the "nearest" world is context-dependent. In a logical context, we hold as much fixed as possible. In a moral context, we hold fixed only the background necessary to isolate the agent's contribution.

  **4. The Cotenability Problem: Harry's Grave and Mary's Job**

  The problem of cotenability asks: When we suppose the antecedent, which other facts must we give up, and which must we hold fixed?

  Consider Harry Bailey. In the actual world, Harry lives because George saved him from falling through the ice as a child. In the counterfactual world, Harry died at age nine.
  *   **The Backtracking Issue:** Standard Lewisian semantics often discourages "backtracking" counterfactuals (where the present antecedent changes the past). However, "George was never born" is a past-tense antecedent. If George never existed, the past *must* be different. The film handles this correctly: the ice incident happens, but George is not there to intervene.
  *   **The Cotenability Tension:** But consider the details. Would Harry have been sledding on that specific pond if George didn't exist? Perhaps George's presence influenced where the brothers played. The film assumes a rigid causal chain: No George $\rightarrow$ No Rescue $\rightarrow$ Dead Harry. This is a strong claim about causal dependence.

  Now consider Mary. In Pottersville, she is a bitter librarian, alone.
  *   **The Critique:** Is this the *closest* outcome? Mary is depicted in the actual world as independent and spirited. To assume she necessarily becomes "bitter" without George risks a deterministic view of women's roles in the 1940s. It seems more likely that the film selects this outcome to maximize George's sense of guilt and loss.
  *   **The Lesson:** This highlights a danger in counterfactual reasoning: we often project our current anxieties onto the alternative world. George fears he is a burden; the vision confirms his fear by showing his loved ones miserable. The "truth" of the counterfactual is contaminated by the evaluator's psychological state.

  **5. Zuzu's Petals: Trans-World Identity**

  One of the strangest moments in the film occurs when George reaches into his pocket in the counterfactual world and finds Zuzu's petals ("God's little creatures"), which he collected in the actual world earlier that night. He uses them to prove his identity to a skeptical policeman.

  *   **Lewis's View:** David Lewis would reject this. Objects do not travel between worlds. Individuals do not exist in more than one world. There is a *counterpart* of George in the no-George world (or rather, there isn't, since the antecedent is that he doesn't exist), but there is no trans-world identity.
  *   **The Film's Logic:** The petals serve as an anchor for *psychological continuity*. If George is merely observing a world where he doesn't exist, he is a ghost. But if he carries an object from his "real" life, he remains a continuous agent.
  *   **Philosophical Function:** The petals solve a problem of *evaluation*. For the counterfactual to matter to George, *he* must be the one evaluating it. If the George in the vision is a different person, the misery of that world doesn't reflect on *his* life's value. The petals ensure that the suffering George witnesses is witnessed by the *actual* George. It bridges the gap between the semantic content of the conditional and the subjective experience of the agent.

  **6. Verification and the Return**

  The film ends with the counterfactual world evaporating. George wakes up in Bedford Falls. The "evidence" he gathered (the grave, the jail, the library) cannot be checked. He has only his memory.

  *   **The Epistemic Problem:** In philosophy, a counterfactual that cannot be verified is still truth-apt. Its truth depends on the structure of reality, not our access to it. But for George, the *belief* that the counterfactual is true is what saves him.
  *   **The Verdict on Verification:** The film suggests that the *utility* of a counterfactual does not depend on its metaphysical reality, but on its capacity to reorganize our understanding of the actual world. The Pottersville world "evaporates" because it was never a real alternative; it was a tool for seeing the actual world anew.

  **7. Conclusion: What the Film Adds to the Debate**

  Does *It's a Wonderful Life* vindicate the closest-world approach? **No.** It exposes its limits.

  Lewis and Stalnaker provide a logic for truth conditions. They tell us when a conditional is *true*. Capra provides a pragmatics for *meaning*. He shows us why we *care* whether a conditional is true.

  1.  **Salience over Similarity:** The film demonstrates that in human reasoning, we do not select the "closest" world by metric similarity. We select the *most informative* world. Pottersville is not the nearest possible world; it is the nearest *contrastive* world. It is engineered to isolate the variable of "George's Goodness."
  2.  **The Affective Dimension:** The literature treats conditionals as cognitive assessments. The film argues they are emotional technologies. We run counterfactuals ("If I hadn't met her," "If I had taken that job") to regulate gratitude, regret, and hope. The truth of the conditional is less important than the change it effects in the evaluator.
  3.  **The Actual World is the Target:** Finally, the film corrects a common student misconception. We do not evaluate counterfactuals to understand *other* worlds. We evaluate them to understand *this* one. The statement "If George hadn't been born, the town would be worse" is actually a claim about the actual world: "George's existence causes the town to be better."

  **Discussion Questions for Screening:**

  1.  **The Grave:** When George sees Harry's headstone, is he observing a fact about the counterfactual world, or is he projecting his own guilt? How does this relate to the problem of cotenability?
  2.  **The Petals:** If Lewis is right that objects cannot cross worlds, what do Zuzu's petals represent? Are they a plot hole, or a necessary device for personal identity?
  3.  **The Ending:** When George returns, he says, "I want to live again." Does this imply that the counterfactual vision was "false," or that it revealed a deeper truth about the actual world that he had missed?
  4.  **Pragmatics:** Clarence selects a world where Potter owns everything. Is this a fair test of George's value, or is it a rigged experiment? Does the "rigging" invalidate the lesson?

  **Final Thought:**
  As you watch, do not ask only "Is this world logically consistent?" Ask: "What work is this counterfactual doing?" The film argues that the value of a life is found not in the actual world alone, but in the difference between the actual world and the worlds that might have been. That difference is the semantic content of a life.
