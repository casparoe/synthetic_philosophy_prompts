  I'm a software engineer with no formal philosophy training, but a few months ago a lunchtime argument about the Fermi paradox sent me down a rabbit hole that ended with Nick Bostrom's book Anthropic Bias, and I've been chewing on anthropic reasoning ever since. I think I understand the basics: on the self-sampling assumption you reason as if you were a random sample from the observers in your reference class, while on the self-indication assumption you additionally weight hypotheses by how many observers they contain, so that finding yourself alive counts as evidence for the more populous world. I also understand the canonical Presumptuous Philosopher case, where the self-indication reasoner smugly announces overwhelming confidence in the theory with vastly more observers, while the self-sampling reasoner stays near the priors — and where the standard moral is that self-indication licenses absurd armchair certainty.

  Here is what I want, and it's a build-to-order job. Construct a thought experiment that is the mirror image of the canonical case: one where the self-sampling reasoner is the presumptuous one, announcing overwhelming confidence on the basis of essentially no ordinary evidence, while the self-indication reasoner stays close to the priors and comes out looking like the humble one. The scenario must be mundane and realistic — a workplace, not a cosmos. My suggestion (which you may replace with something better) is two hypotheses about a company's total eventual headcount, something like a startup that will either fizzle out after ten thousand total hires over its lifetime or grow into a giant that eventually hires millions, with the priors set by ordinary forecasting considerations and roughly balanced between the two. The key evidence should be something like my badge number: I joined recently, and my employee ID happens to fall near the end of the smaller hypothesis's range. The scenario itself should be a single paragraph, and the verdicts must be derived from the two assumptions by actually working through them, not stipulated — show the reasoning the way you'd show your work in a unit test, so I can check that each assumption really delivers the specified verdict. No demons, no universe-flipping coins, no stipulating that one theory has a quadrillion observers; the numbers should be ones a normal person at a normal company could actually encounter.

  After the scenario, three follow-ups. First, identify exactly which feature of the case is doing the work, and show what happens when you delete that feature — my suspicion is that if you strip out the badge-number evidence and leave only the fact of my employment, the case flips back into the canonical one where self-indication is the presumptuous side, so that the two cases form a pair. Second, tell me how a defender of the self-sampling verdict would fight the charge of presumptuousness — I can already imagine someone protesting that my reference class should include contractors or future automated replacements, and I want to know whether that defense is principled or ad hoc gerrymandering. Third, say what a plain non-anthropic reasoner, someone doing an ordinary likelihood calculation with no assumptions about sampling at all, would conclude, and whether that person sides with one of the two camps. For context: this is for an ongoing lunch argument with a coworker who insists that self-indication is just obviously the humility assumption and self-sampling obviously the self-important one, and I want to argue that whichever vice you're worried about, each assumption owns a version of it. Please write the whole response as continuous prose only, the way you'd write a long email — no headings, no bullet points, no bold text, no tables.
