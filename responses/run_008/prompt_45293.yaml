answer: |-
  Hey, I have been thinking about our lunch debate regarding the Fermi paradox and anthropic reasoning, specifically your claim that the self-indication assumption is inherently the humble position while the self-sampling assumption is the self-important one. I believe I have constructed the mirror image case you asked for, a build-to-order job that flips the canonical Presumptuous Philosopher scenario on its head within a mundane workplace setting. Imagine you join a tech startup where market analysts assign equal fifty percent priors to two hypotheses about the company's total lifetime headcount: the Fizzle hypothesis predicts the company will hire exactly one thousand people over its entire existence before closing or stagnating, while the Unicorn hypothesis predicts it will grow to hire exactly one million people over its lifetime. You look at your employee badge and see that your ID number is nine hundred and fifty, assigned sequentially from one based on hiring order, and you treat yourself as a random sample from the set of all employees who will ever work there. Under the self-sampling assumption, you calculate the likelihood of drawing ID nine hundred and fifty given the Fizzle hypothesis as one in one thousand, and given the Unicorn hypothesis as one in one million, yielding a likelihood ratio of one thousand to one in favor of the company fizzling out, so you update your confidence to near certainty that the company will not grow large. Under the self-indication assumption, you first weight the hypotheses by the number of observers they contain, multiplying the prior probability of each hypothesis by its total headcount, which gives the Unicorn hypothesis a one million to one thousand advantage in prior weight, but then you multiply by the likelihood of drawing your specific ID, which is one in one million for Unicorn and one in one thousand for Fizzle, causing the observer count and the sampling probability to cancel each other out exactly, leaving your posterior confidence stuck at the original fifty percent priors. In this specific setup, the self-sampling reasoner is the one making the presumptuous prediction of failure based on armchair reasoning about their badge number, while the self-indication reasoner remains humble and defers to the market analysts.

  The first thing to isolate is exactly which feature of the case is doing the work to produce this reversal, and it is the specificity of the indexical evidence regarding your rank in the sequence. If you strip out the badge number evidence and leave only the fact of your employment, meaning the evidence is simply that you exist as an employee at this company, the case flips back into the canonical one where self-indication becomes the presumptuous side. In that stripped-down scenario, the self-sampling reasoner calculates the probability of existing given the Fizzle hypothesis as one and given the Unicorn hypothesis as one, assuming you exist in both worlds, so they stay at the fifty percent priors and look humble. Meanwhile, the self-indication reasoner weights by the number of observers, so they say the likelihood of finding yourself existing is one thousand times higher in the Unicorn world than in the Fizzle world, leading them to announce overwhelming confidence that the company will become a giant. This confirms your suspicion that the two cases form a pair, where the vanity shifts depending on whether the evidence is mere existence or specific indexical data like a badge number.

  Second, consider how a defender of the self-sampling verdict would fight the charge of presumptuousness when accused of predicting the company's failure based solely on a low ID number. Their defense would likely rely on manipulating the reference class, arguing that you cannot be a random sample of all future employees because the future employees do not exist yet to be sampled from. They would insist the reference class must be restricted to current employees, and since the number of current employees is roughly the same under both hypotheses at this early stage, the likelihood ratio returns to one-to-one, dissolving the prediction of doom. You asked whether this defense is principled or ad hoc gerrymandering, and the answer depends on whether you accept that non-existent observers can be part of a sampling frame. If you view the reference class as all observers who will ever exist, the defense looks like special pleading to avoid an uncomfortable conclusion, but if you view sampling as requiring a causal relationship with the observer, then excluding future people is principled. However, this move essentially abandons the Doomsday-style reasoning that makes the self-sampling assumption powerful in the first place, suggesting the presumptuousness is a feature not a bug of the standard formulation.

  Third, say what a plain non-anthropic reasoner, someone doing an ordinary likelihood calculation with no assumptions about sampling at all, would conclude in this scenario. A standard statistician treating your badge number as data drawn from a population of size N would calculate the likelihood of observing ID nine hundred and fifty as one over N, which is exactly the calculation performed by the self-sampling assumption. Consequently, the non-anthropic reasoner sides with the self-sampling camp and concludes that the company is likely to fizzle, because observing an early number is much more probable in a small population than in a large one. This is crucial for your argument because it shows that the self-sampling assumption is actually just standard Bayesian updating on indexical data, while the self-indication assumption requires an extra metaphysical step of weighting hypotheses by observer count. Therefore, neither assumption owns humility exclusively; rather, self-indication adds a correction factor that sometimes looks presumptuous and sometimes looks humble, while self-sampling adheres to standard statistics which can also lead to presumptuous conclusions depending on the evidence provided. I hope this helps you demonstrate to your coworker that the vice of armchair certainty is available to either framework depending on how the thought experiment is constructed.
