  I'm a software engineer, no philosophy background at all, and I've somehow agreed to give a talk at my company's internal AI-safety-adjacent brown bag next week. My thesis is roughly this: the way most people in tech frame the "alignment problem" is way too narrow -- getting an AI to faithfully do what the operator *meant* (intent alignment) is treated as the whole job, when it's really only half of it, and the other half, whether what the operator wants is actually worth optimizing for, gets quietly assumed away. My pet analogy is that we're acting like the hard part is making the compiler honor the spec, and nobody is asking who wrote the spec and whether the spec is any good. The audience is mostly ML engineers who think "alignment" just means RLHF-ing a model until the evals pass, plus two research scientists who beleive interpretability work basically settles it, plus one PM who watched a viral youtube video about the orthogonality thesis once and thinks that makes him the resident philosopher. I want a Q&A prep sheet, not a defense of my view: exactly five objections this specific crowd will actually raise, numbered 1 through 5, no intro or conclusion, just the list. For each one, in a couple of sentences: the objection phrased the way an ML engineer would actually phrase it (not the way a philosophy professor would), the one-breath reply I should give, and a quick note on where that reply is soft or hand-wavy. Make one of the five the question I'm praying nobody asks -- probably something like "okay so who decides what's worth wanting, you?" -- and be honest about how much trouble I'm in if it comes up.
