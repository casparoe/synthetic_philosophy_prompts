prompt: |-
  I'm on the governance committee of a community land trust — we own about 60 homes plus some shared land in a mid-sized city, roughly 400 resident-member households, and around 150 "legacy" members who inherited or kept shares after moving away, some of whom now live in other states. We have to decide by next month who gets to vote in a referendum: a developer has offered to buy air rights over part of our land and put up a six-story building, and the money would fund repairs we otherwise can't afford, but the building will shadow a bunch of our units and change the neighborhood.

  The problem is the membership list wasn't drawn up with this in mind. The residents obviously think they vote. The legacy members say they're the legal members and their grandkids are on the waitlist for these homes, so their stake is generational. The tenants renting trust units (not members, just leases) say they'll live in the shadow of the thing. A few waitlist families want in. The neighbors across the street, who aren't members of anything, have shown up to two meetings angry. And a local environmental group has formally petitioned for either a vote or a designated proxy seat "on behalf of future generations."

  One guy on our committee is pushing the view that the demos is everyone affected by the decision — which, he admits with a shrug, seems to include the future residents of the new building itself, and he can't tell if that's a reductivo of his view or just the obvious conclusion. The rest of us lean toward "whoever's actually governed by the trust's rules," which conveniently means members only, maybe too conveniently.

  Draft the memo I'll circulate before our Thursday meeting: recommend a concrete rule for this referendum — who votes, with what weight if any — and if you can, a standing rule for future ones. Engage the boundary question honestly rather than just citing our bylaws at people, and make sure the strongest version of the losing side gets a fair shake, not a strawman. No citations or reading lists, we need something the committee can actually vote on. Also bear in mind whatever we decide here becomes precedent when someone eventually proposes dissolving the trust entirely and cashing out everyone's shares — that fight is coming in a few years whether we like it or not. (sorry for the typos btw, typing this on my phone in the parking lot before work)
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Member of the Governance Committee of a Community Land Trust (CLT).
      *   **Context:** 60 homes, 400 resident-member households, 150 legacy members (non-resident), tenants (non-members), waitlist families, neighbors, environmental group.
      *   **Issue:** A referendum on selling air rights to a developer (6-story building). Pros: Funding for repairs. Cons: Shadowing, neighborhood change.
      *   **Conflict:** Who gets to vote?
          *   Residents (current member-households).
          *   Legacy Members (legal members, non-resident, generational stake).
          *   Tenants (affected, non-members).
          *   Waitlist (prospective members).
          *   Neighbors/Environmental Group (external stakeholders, "future generations").
          *   Committee Debate: "Everyone affected" (boundary problem) vs. "Legal Members only" (convenient exclusion).
      *   **Task:** Draft a memo for the Thursday meeting.
      *   **Requirements:**
          *   Recommend a concrete rule for *this* referendum (who votes, weight).
          *   Recommend a standing rule for *future* referendums.
          *   Engage the boundary question honestly (don't just hide behind bylaws).
          *   Give the strongest version of the losing side a fair shake (steelman, don't strawman).
          *   No citations/reading lists (actionable).
          *   Consider precedent for future dissolution/cash-out fights.
          *   Tone: Professional, pragmatic, governance-focused, empathetic but decisive.

  2.  **Deconstruct the Stakeholders & Arguments:**
      *   *Current Resident Members:* Most directly impacted (shadow, quality of life). High stake.
      *   *Legacy Members:* Legal owners of the trust's mission. Generational stake. Financial stake (equity).
      *   *Tenants:* Impacted physically (shadow), but no legal equity. Risk of setting precedent that tenancy = ownership.
      *   *Waitlist:* Hopefuls. No current stake.
      *   *Neighbors/Env Group:* Externalities. "Future generations" argument is philosophically strong but operationally impossible to define for voting.
      *   *The "Everyone Affected" Argument:* If everyone affected votes, the electorate is infinite (future residents of the new building, future neighbors, future generations). This leads to paralysis.
      *   *The "Legal Members Only" Argument:* Clean, legalistic. But risks alienating residents who feel the decision is about their daily lives, not just asset management. Also risks legacy members outvoting residents on issues affecting residents' homes.

  3.  **Develop the Recommendation (The "Goldilocks" Solution):**
      *   *Immediate Referendum:* Needs to be defensible and passable.
      *   *Core Principle:* The CLT is a *stewardship* model, not just a co-op or a condo. It balances individual use with community permanence.
      *   *Voting Body:* Must be the Membership. Why? Because the legal liability and fiduciary duty rest with them. Allowing non-members to vote sets a dangerous precedent for dissolution (as noted in the prompt).
      *   *Nuance:* Acknowledge the "Legacy vs. Resident" tension.
      *   *Weighting:* One member, one vote is standard. But how to handle the Resident vs. Legacy split?
          *   *Option A:* All members vote equally. (Simple, but legacy might override residents).
          *   *Option B:* Residents vote on livability, Legacy vote on financials. (Too complex to separate).
          *   *Option C:* Dual Majority. Requires majority of *Resident Members* AND majority of *Total Membership*. This protects residents from being overrun by legacy, and protects the trust's long-term mission from being hijacked by short-term resident NIMBYism.
      *   *Non-Members:* They don't vote, but they need a formal voice. Advisory input, not binding votes.

  4.  **Drafting the Memo - Section by Section:**

      *   **Header:** Standard Memo format.
      *   **Subject:** Clear and urgent.
      *   **Opening:** Acknowledge the difficulty. Validate the tension.
      *   **The Boundary Question:** Address the "everyone affected" vs. "legal members" debate honestly. Acknowledge that "everyone affected" is operationally unworkable (the infinite regress of future residents/generations). Acknowledge that "legal members only" feels exclusionary but protects the legal structure.
      *   **Recommendation for Immediate Referendum:**
          *   Eligibility: All current Member-Households (Resident + Legacy).
          *   Mechanism: Dual Majority (Protects both groups).
          *   Non-Member Input: Formal listening sessions, written testimony included in the ballot packet.
      *   **Recommendation for Standing Rule:**
          *   Codify the "Stewardship Boundary." Voting is tied to legal membership (equity/mission responsibility).
          *   Create a "Stakeholder Advisory Panel" for future major decisions to give non-members a structured voice without voting rights.
      *   **Precedent Check:** Explicitly mention the dissolution scenario. If non-members vote now, they argue for voting rights when selling the whole trust. Must avoid this.
      *   **Steelman the Losing Side:** Acknowledge that excluding tenants/neighbors feels undemocratic regarding *impact*, but emphasize that *governance* requires *responsibility*.
      *   **Next Steps:** Vote on this framework Thursday.

  5.  **Refining the Tone:**
      *   Avoid legalese.
      *   Be firm but kind.
      *   Ensure the "Dual Majority" concept is clear (it's the key compromise).
      *   Make sure the "Future Generations" argument is addressed (it's the mission, not a ballot seat).

  6.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is Dual Majority too hard to pass?
      *   *Fix:* It's hard by design. Major changes should be hard. It forces consensus.
      *   *Critique:* Did I address the "future residents of the new building" point?
      *   *Fix:* Yes, in the boundary section. They are beneficiaries, not governors.
      *   *Critique:* Is the distinction between Resident and Legacy clear?
      *   *Fix:* Define "Resident Members" (live in CLT) vs "Legacy Members" (hold shares, live elsewhere).
      *   *Critique:* Did I handle the dissolution precedent?
      *   *Fix:* Added a specific paragraph on "The Dissolution Precedent."

  7.  **Final Polish:** Check against constraints (no citations, actionable, phone-typo empathy). *Note: I will ignore the user's typos in my output, producing a clean document.*

  8.  **Final Output Generation** (Proceed to generate memo based on these thoughts).
answer: |-
  **MEMORANDUM**

  **TO:** Governance Committee
  **FROM:** [Your Name]
  **DATE:** [Current Date]
  **SUBJECT:** Recommendation on Voting Eligibility for Air Rights Referendum & Standing Governance Rule

  **Purpose**
  This memo recommends a concrete voting framework for the upcoming air rights referendum and proposes a standing rule for future major decisions. We face a tension between our legal structure (membership-based) and the moral reality of this decision (impact-based). The goal of this recommendation is to resolve the immediate deadlock while establishing a precedent that protects the Trust during the eventual dissolution conversation we know is coming.

  **The Boundary Question: Honest Assessment**
  We must address the argument that "the demos is everyone affected."

  *The Strongest Case for Expansion:*
  Proponents of expanding the electorate argue that democracy requires consent from those subject to power. Tenants and neighbors will live in the shadow of this building; the environmental group speaks for ecological interests that outlive us. Excluding them treats the CLT like a private club rather than a community steward. If we claim to be "community-led," ignoring the immediate community feels like a betrayal of our mission.

  *The Operational Reality:*
  However, adopting "everyone affected" as a standard creates an infinite regress. As noted in our last discussion, this logic extends to future residents of the new building, future neighbors, and unborn generations. We cannot construct a ballot for an infinite electorate. Furthermore, voting implies fiduciary responsibility. Those who vote on the asset must be liable for the consequences of that vote. Tenants and neighbors bear the *physical* consequences, but Members bear the *legal and financial* consequences.

  *The Risk of Precedent:*
  If we grant voting rights to non-members now, we establish that governance is tied to *impact* rather than *ownership/stewardship*. When the question arises in five years to dissolve the Trust and cash out shares, non-members (tenants, neighbors) could legally argue they are stakeholders entitled to a share of the proceeds or a veto on dissolution. We cannot afford that precedent. The voting boundary must remain tied to legal membership to protect the Trust's ability to eventually wind down or restructure without external litigation.

  **Recommendation 1: Rules for the Immediate Referendum**
  For this specific vote on the air rights sale, I recommend the following:

  1.  **Eligibility:** Voting is open to all current Legal Members in good standing. This includes both **Resident Members** (households living in CLT units) and **Legacy Members** (shareholders living elsewhere).
  2.  **Exclusions:** Tenants, waitlist families, neighbors, and external organizations do not receive ballots.
  3.  **The "Dual Majority" Requirement:** To pass, the referendum must achieve:
      *   A simple majority of *all* votes cast by the Total Membership; **AND**
      *   A simple majority of votes cast specifically by *Resident Members*.
      *   *Rationale:* This prevents Legacy Members from outvoting Residents on issues affecting their daily homes (shadow, privacy). Simultaneously, it prevents Residents from making purely financial decisions that jeopardize the long-term solvency of the Trust without Legacy buy-in. It forces a coalition.
  4.  **Non-Member Input:** We will hold two mandated listening sessions for tenants and neighbors. A summary of this testimony, including the environmental group's petition, will be attached to every ballot as "Community Impact Statements." They do not vote, but their input becomes part of the official record voters must acknowledge.

  **Recommendation 2: Standing Rule for Future Referendums**
  To avoid re-fighting this battle for every major decision, I propose we adopt the following standing governance policy:

  1.  **Stewardship Boundary:** Voting rights on asset disposition, bylaw changes, or dissolution are permanently restricted to Legal Members who hold equity shares. This affirms that governance is a function of fiduciary risk.
  2.  **Stakeholder Advisory Panel:** For any referendum involving physical changes to the land or housing stock, a non-voting Advisory Panel must be formed. This panel includes representatives from tenants, neighbors, and the waitlist. The Committee must formally respond to the Panel's recommendations in writing before a vote is called.
  3.  **Future Generations Proxy:** We cannot seat a proxy for "future generations" as requested. Instead, the Governance Committee itself shall adopt a "Seventh Generation" check. Before any vote is certified, the Committee must publish a brief statement on how the decision aligns with the Trust's 50-year permanence goals. This internalizes the long-term view without creating an unaccountable external voting block.

  **Addressing the Losing Side**
  To those who feel this recommendation is too exclusionary: I acknowledge that this structure prioritizes the *legal* community over the *geographic* community. It admits that a tenant living in the shadow has less formal power than a legacy member living in another state. This is imperfect. However, it is the only structure that keeps the Trust legally defensible. If we blur the line between stakeholder and member, we invite chaos into the governance structure and risk the assets we are trying to protect. The Advisory Panel recommendation is our commitment to ensuring their voices are heard, even if they do not hold the pen.

  **Next Steps**
  I move that we vote on this framework at Thursday's meeting. If adopted, we will draft the specific ballot language and Advisory Panel charter by next Monday.

  This approach allows us to move forward with the developer negotiation while keeping the Trust intact for the harder fights ahead.
