      *   *Coma:* No function -> No status. (Validates function over mass).
      *   *15% Human Variation:* Within the saturation zone of human capacity. No moral difference.
      *   *100B Neuron Human:* **Challenge.** If function is identical, does extra capacity matter?
          *   *Argument:* If the extra neurons don't change the *kind* of experience, they are redundant. If they allow *more intense* suffering/joy, then yes, they matter morally (utilitarian calculus), but not in terms of *rights/status*.
