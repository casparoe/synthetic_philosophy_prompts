      *   **Constraint:** "Don't be gentle with the enlarged-scale verdict."

  2.  **Deconstruct the Intuitions & Identify Conflicts:**
      *   *Conflict A:* Function vs. Substrate. The corvid and coma cases strongly suggest *functional capacity* (consciousness, agency, suffering) is the moral bearer, not mass. The microcephaly case reinforces this (function preserved despite size loss).
      *   *Conflict B:* Intra-species vs. Inter-species. Why does 15% human variation matter less than human vs. whale variation? Usually, this is explained by *thresholds* or *diminishing returns*.
      *   *Conflict C:* The "More is More" Intuition. The user feels a 100B neuron human-analog would matter *more*. This conflicts with the "function" view. If function is saturated (i.e., it can do everything a human does), why does extra hardware matter? This is the "Philosophical Zombie" or "Qualia Magnitude" problem.
