      *   *Candidate 2: Phenomenal Magnitude (Hedonic Capacity).* Moral weight scales with the *intensity* or *volume* of experience possible. More neurons = more "pixels" of experience or deeper suffering/joy.
          *   *Pros:* Saves the "100B neuron" intuition. Explains why whales might matter "a great deal."
          *   *Cons:* Conflicts with the microcephaly case (unless their functional density is higher). Conflicts with the corvid case (unless density compensates). Risks "specism" or "size-ism."
      *   *Candidate 3: Integrated Information / Complexity.* Moral status scales with $\Phi$ (Phi) or similar measures of information integration. Size is only a proxy for complexity.
          *   *Pros:* Handles the octopus (distributed integration). Handles the corvid (high density/efficiency). Handles the coma (low integration).
          *   *Cons:* Hard to calculate. Might still imply the 100B neuron being has higher $\Phi$.

  4.  **Evaluate the "Enlarged-Scale" Intuition (The Scientific Prior):**
      *   The user asks to be tough on this.
