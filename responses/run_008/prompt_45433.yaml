      *   *Risk:* If we accept "more neurons = more moral worth," we risk implying that adults matter more than infants, or large humans more than small humans (unless we invoke a strict threshold).
      *   *Verdict:* This intuition is likely the outlier that needs revision to maintain consistency with the microcephaly and corvid cases. It confuses *computational capacity* with *moral status*.

  5.  **Drafting the Principle:**
      *   I need a principle that prioritizes *Functional Consciousness* but allows for *Magnitude of Experience* only where it impacts *Suffering/Flourishing Capacity*, not abstract "worth."
      *   Let's propose **"Functional Sentience with Diminishing Returns."**
      *   Actually, a better fit for the neuroscientist might be **"Capacity for Valenced Experience (Hedonic Range)."**
      *   *Refinement:* Brain size is a *proxy* for the *range* of possible experience, but only when functional organization supports it.
      *   *Wait, the user wants to know if size has direct significance.* The answer should probably be "No, size is instrumental, not intrinsic."
      *   *Proposed Principle:* **The Principle of Functional Phenomenal Capacity.** Moral status is determined by the *range and depth* of conscious experience a system can sustain. Brain size is morally relevant *only insofar as* it expands this range beyond a saturation point.

  6.  **Addressing the Specific Cases:**
      *   *Microcephaly:* Function preserved -> Status preserved. (Size irrelevant).
      *   *Whale:* Large brain supports complex social/emotional life -> High status. But not higher than human if human functional range is comparable/superior in morally relevant ways (e.g., anticipation, abstract suffering).
