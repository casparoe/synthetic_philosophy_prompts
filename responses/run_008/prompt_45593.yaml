prompt: |-
  Background first: I'm a backend engineer and team lead at a mid-size company, roughly 40 product teams plus a few platform teams. No philosophy background, obviously. Since forever, each team here has picked its own stack: languages, databases, CI setup, on-call rotation, you name it. It's messy, but teams ship fast and they know their own systems. Our new CTO now wants to pull a bunch of these decisions up a level — one approved stack list, one CI pipeline everyone has to use, a company-wide on-call policy, mandatory security tooling, the works. His pitch at the all-hands was basically consistency, and, his words more or less, that it's the only setup you can actually audit. A group of team leads pushed back saying decisions belong with the people closest to the work, and his response was, fine, tell me *which* decisions and *why* — right now you're just telling me you don't want to give up control. And the annoying part is I think he's half right: our pushback is vibes.

  Years ago I idly read something about how some countries split decisions between the national level and regional/local governments, and the idea was roughly that the higher level should only grab a decision if the lower level genuinely can't handle it as well — but that there was an actual test behind it, not just "local is nice." I can't remember where I read it or what its called, so:

  1. Is there a real, worked-out version of this idea, and what's it properly called? I gather the US, Germany, Switzerland, and the EU all do versions of this — do they share some set of questions you can run a decision through, or does each just wing it?

  2. Take our actual disputed list — programming language per team, database choice, the shared CI pipeline, the on-call policy, security review requirements, and whether teams can pick their own observability tooling — and run each one through whatever the principled test is. For each one, tell me which level should own it, and whether the answer is "one level owns it fully" or something more like "floor set centrally, discretion above it." I'd definately like to know which of the six the CTO should win.

  3. Where does this idea go wrong? Known ways it gets gamed or produces the wrong answer. And be honest about whether it even fits a company: a CTO can just rewrite the rules next quarter, whereas states, I assume, can't get overruled like that. Does that break the whole framing, or is it still worth using? For what it's worth, the single-sign-on rollout that got forced on everyone last year turned out fine, so I'm not dogmatic about either side — I just want the leads' next doc to be more principled than "trust us."

  If I've garbled the thing I half remember, say so. Please don't point me at books or papers, I want the actual reasoning in plain terms. And write in American English — a coworker already complained that my docs mix spellings.
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **User:** Backend engineer/team lead at a mid-size company (40+ product teams).
      *   **Context:** Decentralized stack/ops (chaos but fast) vs. New CTO wanting centralization (consistency, auditability).
      *   **Problem:** Team leads pushback is based on "vibes" (control), CTO wants principled reasoning. User remembers a political philosophy concept about decision-making levels (national vs. local) and wants to apply it.
      *   **Tasks:**
          1.  Identify the concept (name, origin, whether there's a formal test).
          2.  Apply the concept to 6 specific disputed decisions (language, DB, CI, on-call, security review, observability). Determine ownership level (central vs. local vs. floor/ceiling).
          3.  Critique the concept (limitations, gaming, applicability to companies vs. states).
      *   **Constraints:** No books/papers (plain terms), American English, honest assessment.

  2.  **Identify the Concept (Task 1):**
      *   The user is describing **Subsidiarity**.
      *   *Origin:* Catholic social teaching (Pope Pius XI, *Quadragesimo Anno*, 1931), but roots in Aristotle, Aquinas, etc. Adopted by the EU (Maastricht Treaty), Germany (Grundgesetz), Switzerland (federalism).
      *   *Core Principle:* Matters ought to be handled by the smallest, lowest, or least centralized competent authority. Higher levels should only intervene if the lower level cannot handle it effectively.
      *   *Is there a formal test?* Not a rigid algorithm, but a set of criteria (efficiency, scale, externalities, rights protection). The EU has a specific protocol for checking subsidiarity.
      *   *Correction/Nuance:* The user remembers it correctly enough. It's not just "local is nice," it's "local unless there's a compelling reason for central."

  3.  **Apply the Concept (Task 2):**
      *   *The 6 Decisions:*
          1.  Programming Language per team.
          2.  Database choice.
          3.  Shared CI pipeline.
          4.  On-call policy.
          5.  Security review requirements.
          6.  Observability tooling.
      *   *Analysis Framework:*
          *   **Subsidiarity Test:** Can the team do this effectively alone? Does this decision create negative externalities for others? Does this require economies of scale? Does this affect company-wide risk/compliance?
          *   **Ownership Models:** Fully Central, Fully Local, Central Floor/Local Ceiling (Guardrails).
      *   *Drafting the Analysis:*
          1.  *Language:* High cognitive load for cross-team mobility. High support cost. But core competency of devs. *Verdict:* Guardrails (Approved List). Central sets the list, teams pick from it.
          2.  *Database:* Data portability, operational burden, backup/restore consistency. High risk if messed up. *Verdict:* Guardrails (Approved List + Patterns). Central sets supported DBs, teams pick.
          3.  *CI Pipeline:* Pure economies of scale. Security, caching, artifacts. Reinventing this is waste. *Verdict:* Central. (Maybe extensible hooks).
          4.  *On-call Policy:* Human safety, burnout, legal compliance (labor laws). Equity across teams. *Verdict:* Central Floor (min rest, max hours), Local discretion on scheduling.
          5.  *Security Review:* Risk externalities. One weak team hurts everyone. Auditability (CTO's point). *Verdict:* Central Process (mandatory), Local implementation of fixes.
          6.  *Observability:* Data correlation across services. If everyone uses different tools, debugging cross-service issues is impossible. *Verdict:* Central Standard (protocol/format), maybe Central Tool (for cost), but local dashboards.

      *   *Who wins?* CTO wins on CI, Security, Obs (mostly). Leads win on Language/DB (within limits) and On-call scheduling. It's mostly "Guardrails" not "Full Control" either way.

  4.  **Critique the Concept (Task 3):**
      *   *Where it goes wrong:*
          *   **Definition of "Competence":** Who decides if the lower level is competent? (The higher level usually decides, creating bias).
          *   **Transaction Costs:** Negotiating every exception takes time.
          *   **Race to the Bottom:** Local optimization vs. Global optimization.
          *   **Power Dynamics:** In a company, the CTO *can* override. Subsidiarity is moral/political, not legal in a corp.
      *   *Company vs. State:* Employees aren't citizens. At-will employment. CTO can change mind. *However*, using it as a *framework for argument* is still valuable because it shifts the debate from "power" to "efficacy."
      *   *Gaming:* Teams claiming "special needs" to avoid standards. Central team claiming "efficiency" to grab power.
      *   *Verdict:* Still worth using as a negotiation tool/framework, even if not legally binding. It forces the CTO to justify *why* centralization is needed (externalities/scale) rather than just "because I said so."

  5.  **Review and Refine:**
      *   *Tone:* Professional, direct, American English (check spellings: centralized, program, labor, etc.).
      *   *Constraint Check:* No books/papers. Plain terms.
      *   *Specifics:* Ensure the distinction between "Fully Central" and "Floor/Ceiling" is clear.
      *   *Subsidiarity Name:* Make sure to name it clearly.
      *   *EU/Germany/Swiss:* Briefly mention how they handle it (proportionality test).
      *   *CTO's Point:* Acknowledge the auditability argument (security/compliance often *requires* centralization under subsidiarity because local units can't guarantee global compliance).

  6.  **Drafting the Response (Mental Outline):**
      *   **Intro:** You're thinking of **Subsidiarity**.
      *   **Part 1: The Concept.** Name, origin (Catholic/EU), the test (effectiveness, scale, externalities). Not a rigid algorithm but a burden of proof.
      *   **Part 2: The Analysis.** Table or list for the 6 items. Apply the test. Give verdicts (Central, Local, Guardrails).
      *   **Part 3: The Critique.** Power imbalance (Company vs. State), definition of "competence," bureaucracy creep. Why it's still useful (shifts debate to evidence).
      *   **Conclusion:** Summary advice for the doc.

  7.  **Self-Correction/Refinement during drafting:**
      *   *Spelling:* Ensure "centralized" not "centralised", "program" not "programme".
      *   *Nuance on Language:* Don't say "Central owns language." Say "Central defines approved list." That's the subsidiarity compromise.
      *   *Nuance on Security:* CTO is right here. Security is a classic "externality" where one team's failure hurts all. Subsidiarity yields to central authority here.
      *   *Nuance on CI:* Pure infrastructure. Economies of scale dominate. Central wins.
      *   *Nuance on On-call:* Labor law/HR issue. Central floor is needed for compliance/fairness.
      *   *Critique:* Be honest that the CTO holds the cards. Subsidiarity is a persuasive framework, not a constraint.

  8.  **Final Polish:** Check against the "no philosophy background" constraint. Keep jargon minimal. Explain "externalities" simply (costs dumped on others).

  *(Self-Correction on "Subsidiarity" definition)*: Make sure to emphasize the *burden of proof* lies with the higher level to justify taking the decision. That's the key lever for the team leads.

  *(Self-Correction on Company Context)*: Acknowledge that unlike states, companies have a single profit motive. Sometimes "fast shipping" (local) conflicts with "long term stability" (central). Subsidiarity helps balance this.

  *(Final check on American English)*: "Centralized", "organize", "labor", "program".

