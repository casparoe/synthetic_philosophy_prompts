answer: |-
  'Look at the numbers,' said EV, leaning over the table. 'One point two to the power of two hundred. That is the expected value of my bankroll. Yours is a fraction of that. I am mathematically superior.'

  'You're mathematically deceased,' Kelly replied, not looking up from the ledger. 'Zero point six to the power of two hundred is your probability of survival. It's effectively zero. You're trading near-certain ruin for a phantom number carried by a probability mass so thin you'd need a microscope to see it.'

  'Expectation doesn't care about probability mass,' EV snapped. 'It cares about value times probability. Yes, I lose almost every time. But in the one universe where I win every flip, I have more money than exists in the world. That single outlier pulls the average up so high it dwarfs your sensible compounding. You're maximising the median; I'm maximising the mean.'

  'You're maximising a number nobody will ever experience,' Kelly said. 'We live in time, not across parallel universes. You get one trajectory. On your path, you hit a tail eventually—probability one—and you're bankrupt. I grow steadily. I'll actually have money to spend.'

  'But if everyone played my way, the aggregate wealth would be higher.'

  'Everyone isn't playing. You are.'

  'What if I'm a fund?' EV pressed, sensing a wedge. 'I hire a thousand punters. Each goes all-in on their own independent coin. Most bust. Nine hundred and ninety-nine go home broke. But one hits the streak. The fund collects the winnings. The expectation holds. The ensemble average becomes real.'

  Kelly paused, pen hovering. 'If you are a fund with infinite capitalisation and interchangeable agents, fine. The risk is diversifiable. But you're not a fund. You're a bloke with a bankroll. You can't diversify yourself across time. If you bust on flip fifty, you don't get to be the guy on flip two hundred.'

  'But the utility of money is linear in the expectation,' EV argued. 'If I offer you this bet once, you'd take it. Why not repeatedly?'

  'Because repeated betting changes the geometry. You're conflating additive and multiplicative dynamics. In your fund example, the fund survives because it can absorb the loss of the punters. Can you? If you bet everything, you absorb the loss of yourself.'

  'So you admit it's about risk capacity, not the maths?'

  'I admit it's about ergodicity,' Kelly said firmly. 'The average of the outcomes across many people is not the average of the outcomes across time for one person. You're using the former to justify the latter. That's a category error. Your "expected value" is a statistical artefact. My growth rate is physical. It's what happens to the money in your pocket.'

  'But if I run that fund,' EV insisted, 'I prove the expectation is real money. So the expectation isn't a phantom. It's just concentrated.'

  'Concentrated in a reality you won't inhabit,' Kelly countered. 'Unless you can clone yourself a thousand times, the fund argument is a metaphor, not a strategy. And you can't pay rent with metaphors. You're arguing that because someone wins the lottery, buying a ticket is an investment.'

  'It's not a lottery if the edge is positive.'

  'It is if the bet size wipes you out,' Kelly said. 'You're obsessed with the size of the prize. I'm obsessed with staying at the table. You think I'm leaving money on the table. I think you're handing your wallet to a ghost.'

  'The ghost pays better.'

  'The ghost doesn't pay.'

  'The expectation says he does.'

  'Expectation is a map,' Kelly said, closing the ledger. 'Ruins are territory.'
