  **The Thought Experiment: The Plasticity Case**

  Consider a subject in a longitudinal neurofeedback study who learns to modulate their verbal reports of color experiences by recruiting a secondary neural pathway for speech production, effectively shifting the physical realization of the report from the primary motor cortex to a premotor region without altering the phenomenal character of the color experience or the accuracy of the report. Throughout this transition, the visual cortex activity associated with seeing red remains constant, but the neural firing pattern required to produce the utterance "red" changes significantly to accommodate the new pathway. The subject's reports remain perfectly reliable indicators of their experience despite this physical reconfiguration of the output mechanism.

  **1. Theoretical Walkthrough**

  On the **epiphenomenalist picture**, the reliability of the report is secured by a common-cause structure. The initial visual neural state ($N_{visual}$) causes both the quale ($Q$) and the speech motor command ($N_{speech}$). When the subject undergoes plasticity, the physical law connecting $N_{visual}$ to $N_{speech}$ updates via standard synaptic weighting (neuroplasticity). Because $N_{visual}$ remains the common cause, the correlation between $Q$ and the report is preserved automatically; the report tracks $Q$ because both track $N_{visual}$. The theory relies only on known physical mechanisms of learning to explain the maintained reliability.

  On the **interactionist picture**, the reliability depends on a causal chain: $N_{visual} \to Q \to N_{speech}$. Here, $Q$ is the causal intermediary that must produce $N_{speech}$. When the physical realization of $N_{speech}$ shifts to a new neural population, the specific physical conditions required to trigger the utterance change. For the report to remain reliable, the causal power of $Q$ must successfully target the *new* physical configuration to produce the same linguistic output. The interactionist must explain not only how $Q$ causes physical events, but how $Q$'s causal efficacy dynamically recalibrates to match the drifting physical substrate without any physical feedback loop guiding that recalibration. The epiphenomenalist inherits the brain's ability to self-correct; the interactionist must posit that the non-physical mind also "knows" how to update its causal interface.

  **2. The Working Feature**

  The single feature doing the work is **Physical Realization Variance** (the changing neural substrate for the output). This feature generates the asymmetry because it forces the causal link to stretch across a changing physical landscape. If you remove this feature—if the neural pathway for speech remains static throughout the case—the asymmetry collapses. In a static brain, both theories can posit a fixed law (physical or psychophysical) that guarantees reliability. The interactionist's burden only emerges when the physical target of the mental cause moves, requiring the mental cause to track that movement to maintain reliability.

  **3. The Interactionist's Best Defense**

  The interactionist's most plausible defense is to deny that qualia target specific neurons, arguing instead that **mental causation targets functional roles**. They would claim that $Q$ causes "the utterance of 'red'" regardless of which neurons realize it, much like a software command works on different hardware.
  *The Cost:* This defense commits the interactionist to a form of **functional dualism**, which risks undermining the causal efficacy claim. If $Q$ targets a functional role rather than a physical state, it becomes difficult to explain *how* the non-physical exerts force on the physical without violating the causal closure of the physical domain at every specific junction. It also burdens the theory with a "pre-established harmony" where the mental realm automatically aligns with physical functional changes, which is an additional metaphysical assumption the epiphenomenalist does not need.

  **4. Simplification Pass**

  The case **survives** the simplification pass. If you strip out the "neurofeedback study" details and reduce the scenario to: *"A subject's neural realization of speech drifts naturally over time while reports remain accurate,"* the asymmetry persists. The critic cannot claim the setup begs the question against interactionism, as neural drift is a biological fact, not a philosophical stipulation. The core tension remains: the epiphenomenalist explains reliability via physical-to-physical adaptation (which we observe), while the interactionist must explain it via mental-to-physical adaptation (which is theoretical). The interactionist still faces the harder explanatory burden regarding *how* the reliability is maintained across the interface, even if they deny the interface is neuron-specific. The asymmetry holds because the interactionist always requires one extra law (the psychophysical link) to remain stable across physical changes, whereas the epiphenomenalist requires only physical laws to remain stable.
