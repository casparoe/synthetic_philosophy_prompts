  9.  **Final Polish:** Ensure the distinction between "Kingdom" (medieval) and "Nation-State" (modern) is clear. (Proceed to generate output).

  *(Self-Correction Note)*: I should be careful not to validate the "clan tartan" thing too much. While tartans are 18th/19th century, the specific *clan* association is even later. The film uses tartans as a uniform, which is doubly anachronistic. I'll mention that. Also, the woad is Pictish (much earlier than Wallace), so it's a double anachronism.

  *(Refining the "Freedom" point)*: The speech is basically the American Declaration of Independence mixed with French Revolutionary rhetoric. That's the key anachronism.

  *(Refining the "Film as Myth" point)*: Hobsbawm usually talks about elites inventing traditions to control masses. *Braveheart* is a mass culture product that *empowered* a nationalist movement. That's an interesting twist on the theory.

