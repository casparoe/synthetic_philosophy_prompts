          *   Convergence: Both likely agree this is wrong (harmful extraction).
          *   Why? C: Harm to individuals/global system. N: Violation of fair terms between states/undermining other states' capacity.
          *   Significance: Shows overlap on negative duties, doesn't solve positive duty dispute.
      *   *Case 3: Welfare-or-Aid.*
          *   Scenario: Domestic benefit (above sufficiency) vs. Foreign Aid (severe deprivation).
          *   C: Aggregation (more good abroad).
          *   N: Incommensurable (Domestic = Justice, Foreign = Charity).
      *   *Case 4 (Devised):* The Climate Tax.*
          *   Scenario: Domestic carbon tax hurts poor compatriots to help global poor (via adaptation fund).
          *   Tests the "shared scheme" vs. "harm" distinction.

  7.  **Review and Refine:**
      *   *Check Constraints:* Did I include the verbal dispute note? Yes, in the Cruxes or Intro. Let's put it in the Cruxes analysis as it fits the "definition of justice" issue.
      *   *Tone Check:* Is it neutral? Avoid "C argues correctly" or "N fails to see." Use "C maintains," "N contends."
      *   *Substantive Claims:* Ensure they aren't too weak. "We agree people matter" is too weak. "We agree borders aren't magic" is better.
      *   *Formatting:* Use clear headings, tables, and numbered lists as requested.

  8.  **Final Polish:**
