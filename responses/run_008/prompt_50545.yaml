      *   *Disagreement 3: The "Surplus".* C: Owed to the worst off globally. N: Discretionary domestically once domestic sufficiency met.
      *   *Wording Check:* C needs to sound like a cosmopolitan (not a nationalist). N needs to sound like an institutionalist (not a cultural chauvinist).

  5.  **Drafting Section 3: The Cruxes:**
      *   *Goal:* Identify the philosophical pivot points.
      *   *Crux 1:* Nature of Justice (Relational vs. Non-relational). Does justice require coercion/cooperation?
      *   *Crux 2:* Analogy of Partiality. Does family partiality model state partiality? (C says family is private/special, State is public/universal. N says both are special schemes).
      *   *Crux 3:* The "Basic Structure." Does the global economy constitute a basic structure triggering justice? (If yes, N moves toward C. If no, C must rely on beneficence).
      *   *Crux 4 (Verbal/Substantive):* Definition of "Justice." C uses it for all moral duties. N restricts it to associative duties. *Self-Correction:* The prompt asks to identify if a portion is verbal. This is a strong candidate. They might agree on *what to do* but disagree on whether to call it "justice." I need to highlight this in the analysis.

  6.  **Drafting Section 4: Concrete Cases:**
      *   *Requirement:* Use Vaccine Margin, Nurse Recruitment, Welfare-or-Aid. Add one more.
      *   *Case 1: Vaccine Margin.*
          *   Scenario: 60% domestic coverage (low risk) vs. 0% foreign (high risk).
          *   C: Justice requires sending surplus.
          *   N: Beneficence encourages it, but Justice is satisfied domestically first.
          *   Threshold disagreement.
      *   *Case 2: Nurse Recruitment.*
