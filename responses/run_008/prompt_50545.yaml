          1.  **Agreed Claims:** Numbered, substantive (not vacuous), neutral wording.
          2.  **Disagreements Table:** Rows for remaining disagreements, two columns (C's phrasing, N's phrasing).
          3.  **Cruxes:** Subquestions where settling one would shift positions.
          4.  **Concrete Cases:** Specific scenarios (Vaccine Margin, Nurse Recruitment, Welfare-or-Aid) + at least one more devised case. Must include predictions from both sides.
      *   **Constraint:** Address verbal vs. substantive disputes if found.
      *   **Tone:** Philosophical, precise, collaborative, neutral.

  2.  **Deconstruct the Positions:**
      *   **C (Cosmopolitan):**
          *   Equal moral standing for all.
          *   States = instruments for universal duties.
          *   Compatriot priority = instrumental/efficacy-based (not intrinsic justice).
          *   Justice is global; borders don't create special obligations of *justice* (only maybe efficiency or stability).
          *   Sufficientarian: Needs to be met globally first? Or at least, surplus above sufficiency is where discretion lies.
      *   **N (Institutional Nationalist):**
          *   Not cultural nationalist (doesn't care about shared language/history per se).
          *   Coercive/mutually supporting structure of the state creates associative obligations.
          *   Justice is relational (requires shared institutions).
          *   Compatriot priority = requirement of fairness/justice within the scheme.
