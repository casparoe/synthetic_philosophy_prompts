          4.  Severe deprivation creates a binding demand on wealthy states (label neutral: "binding moral demand").

  4.  **Drafting Section 2: Disagreements Table:**
      *   *Goal:* Show the divergence without caricature.
      *   *Disagreement 1: Grounds of Priority.* C: Instrumental/Efficacy. N: Associative/Fairness.
