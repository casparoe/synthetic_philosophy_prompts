      *   Ensure the "Nurse Recruitment" convergence is highlighted as limited (negative vs positive duties).
      *   Clarify the "Verbal" aspect: The prompt asks me to say so explicitly if I conclude some is verbal. The definition of "Justice" is the classic example here. C uses "Justice" broadly (all moral requirements), N uses it narrowly (associative requirements). I should explicitly note this in the Cruxes section.

      *(Self-Correction during drafting)*: Wait, the prompt asks for the *Joint Statement*. The "Verbal vs Substantive" analysis should probably be part of the Chair's commentary *within* the statement or as a preamble, but the prompt says "If, in drafting, you conclude... say so explicitly." I will include this as a specific "Note on Terminology" within the Cruxes section to maintain the document's integrity as a joint statement.

      *Refining the Agreed Claims:*
      1.  Rejection of strict global equality (C accepts this).
      2.  Borders not intrinsically morally significant (N accepts this, it's the institutions inside).
      3.  Severe deprivation creates binding demands (N accepts this as beneficence, C as justice, but both agree it's binding).
      4.  Priority is permissible at the margin (Both agree, disagree on why).

      *Refining the Disagreements Table:*
      Make sure the phrasing is first-person or descriptive but neutral. Let's use descriptive "Position C" and "Position N" to allow them to sign the document as a whole. Or better, "The Cosmopolitan View" and "The Institutional View."

