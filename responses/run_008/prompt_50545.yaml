answer: |-
  # JOINT STATEMENT ON GLOBAL JUSTICE AND ASSOCIATIVE OBLIGATIONS

  **Drafted by:** The Chair
  **Signatories:** C (Cosmopolitan), N (Institutional Nationalist)
  **Date:** October 26, 2023

  ## I. SUBSTANTIVE AGREEMENTS

  We, the undersigned, having engaged in structured adversarial collaboration regarding the scope and grounds of obligations of global justice, affirm the following substantive claims. We agree that these claims rule out specific caricatures previously attributed to our respective positions.

  1.  **Rejection of Strict Global Egalitarianism:** We agree that a commitment to the equal moral standing of persons does not entail a demand for strict global equality of resources or welfare. The Cosmopolitan position (C) is compatible with sufficientarianism; the Institutional Nationalist position (N) is compatible with robust domestic redistribution. Neither of us argues for a flat global distribution regardless of cost or consequence.
  2.  **The Moral Status of Borders:** We agree that state boundaries, considered merely as lines on a map or markers of cultural difference, do not in themselves generate moral obligations. Moral weight attaches to persons and institutions, not to soil. We disagree only on whether the *institutions* typically bounded by states generate special obligations that do not apply globally.
  3.  **Permissibility of Compatriot Priority:** We agree that it is morally permissible for a state to give some priority to its own badly-off citizens over equally badly-off foreigners at the margins. We disagree on the *ground* of this permission (instrumental efficacy vs. associative fairness), but we agree that a policy of strict, immediate global impartiality in all domestic budgeting is not required by morality.
  4.  **Binding Demands of Severe Deprivation:** We agree that wealthy states possess binding moral obligations to address severe deprivation abroad. We disagree on whether to classify these obligations as duties of *justice* (C) or duties of *beneficence/humanity* (N), but we agree that these duties are stringent enough to constrain domestic discretionary spending when the foreign need is sufficiently grave.
  5.  **Negative Duties are Global:** We agree that obligations to refrain from harming foreigners (e.g., through aggressive war, exploitative trade, or environmental damage) are universal and do not depend on shared institutional membership.

  ## II. TABLE OF REMAINING DISAGREEMENTS

  Where we cannot agree on a single formulation, we record our distinct positions below. Each formulation has been vetted by the respective signatory to ensure it accurately reflects their view without caricature.

  | Topic | Position C (Cosmopolitan) | Position N (Institutional Nationalist) |
  | :--- | :--- | :--- |
  | **The Ground of Priority** | Compatriot priority is justified instrumentally: we prioritize compatriots because domestic institutions are more effective delivery mechanisms or because partiality fosters the solidarity required to sustain welfare states. | Compatriot priority is justified constitutively: the coercive, cooperative scheme of the state creates duties of fairness among participants that simply do not exist between non-participants. |
  | **The Scope of "Justice"** | Justice tracks all stringent moral duties owed to persons in virtue of their humanity. If a duty is binding and non-discretionary, it is a duty of justice, regardless of borders. | Justice tracks duties owed specifically to those with whom one shares a basic institutional structure. Outside that structure, stringent duties remain, but they are duties of beneficence, not justice. |
  | **The Surplus Threshold** | Once a domestic population has reached a threshold of sufficiency, surplus resources are owed to the globally worst-off as a matter of right. | Once a domestic population has reached a threshold of sufficiency, surplus resources may be allocated domestically to enhance social goods, provided foreign severe deprivation is not ignored. |
  | **Institutional Analogy** | The state is analogous to a local branch of a global agency; its authority is delegated and must be exercised in alignment with global principles. | The state is analogous to a family or a private club; it is a distinct moral community where members owe each other more than they owe outsiders, independent of efficacy. |

  ## III. THE CRUXES

  We identify the following philosophical subquestions as the "cruxes" of our dispute. Settling any one of these would force at least one of us to significantly revise our current position.

  **Crux 1: The Relational Requirement of Justice**
  *   *The Question:* Do obligations of *justice* (as opposed to beneficence) require a pre-existing relationship of shared coercive institutions, or do they arise solely from capacity and need?
  *   *Significance:* If justice requires shared institutions, N is vindicated, and C must reclassify global duties as beneficence. If justice arises from capacity/need alone, N must admit that global economic integration has already triggered global justice.
  *   *Note on Terminology:* We acknowledge a partially verbal dimension here. C uses the word "justice" to mean "any stringent moral duty." N uses "justice" to mean "duties arising from fair terms of cooperation." We have agreed to retain these distinct usages for precision, provided we agree on the *stringency* of the duties regardless of the label.

  **Crux 2: The Analogy of Special Obligations**
  *   *The Question:* Does the partiality parents show to children (or friends to friends) support or undermine the partiality citizens show to compatriots?
  *   *Significance:* C argues familial partiality is permissible only because it occurs within a background structure of global justice that ensures all children are cared for; without that background, it is impermissible nepotism. N argues familial partiality is permissible *precisely because* special relationships generate special duties, providing a model for the state.

  **Crux 3: The Nature of the Global Basic Structure**
  *   *The Question:* Does the current global economic order constitute a "basic structure" (a system of rules deeply affecting life chances) comparable to a domestic state?
  *   *Significance:* If yes, N's institutional criteria for justice may be met globally, collapsing his position toward C's. If no, C must rely on non-institutional grounds for global redistribution.

  ## IV. CASE-BASED PREDICTIONS AND TESTS

  We agree that abstract principles must be tested against concrete scenarios. Below are four cases. For each, we record our specific predictions and the rationale that would lead us to revise our views if the prediction proved morally counter-intuitive upon reflection.

  ### Case 1: The Vaccine Margin
  **Scenario:** During a pandemic, a wealthy government has doses for 60% of its population. None of these citizens are at serious risk of death (the virus is mild for them). A much poorer country with no doses has a population at high risk of mortality.
  **The Test:** Does the surplus above the domestic sufficiency threshold belong to the global worst-off as a matter of justice?

  *   **C's Prediction:** Justice requires sending the surplus abroad immediately. Domestic citizens have no claim to protection from mild illness while foreigners face death.
      *   *Revision Condition:* C would revise if it were shown that sending the vaccines would cause the domestic welfare state to collapse, thereby creating severe deprivation at home later.
  *   **N's Prediction:** Beneficence strongly recommends sending the vaccines, but Justice does not *require* it over domestic wishes. The state owes its citizens safety first, even from mild threats, before aiding outsiders from mortal threats.
      *   *Revision Condition:* N would revise if it were shown that the "mild" threat domestically carries long-term systemic costs (economic collapse) that would undermine the state's ability to fulfill any future duties, foreign or domestic.

  ### Case 2: The Nurse Recruitment
  **Scenario:** A rich country actively recruits nurses trained at the public expense of a poor country, causing a healthcare collapse in the poor country.
  **The Test:** Is this a violation of justice or merely unfortunate competition?

  *   **C's Prediction:** This is a violation of global justice. It actively harms individuals and undermines the capacity of the poor state to meet basic needs.
  *   **N's Prediction:** This is a violation of international fairness/justice between states. It undermines the poor country's institutional capacity to discharge its own duties to its citizens.
  *   **Convergence Analysis:** We agree this action is impermissible.
      *   *What this shows:* There is significant overlap on *negative* duties (do not harm/undermine).
      *   *What this does not show:* It does not resolve the dispute over *positive* duties (redistribution of surplus). We agree on not breaking the other's system, but disagree on how much we must build it up.

  ### Case 3: The Welfare-or-Aid Case
  **Scenario:** A legislature must choose between: (A) Expanding a modest domestic pension benefit for compatriots who are already above the sufficiency line, or (B) Funding an aid program that would lift 10,000 foreigners from severe deprivation (below sufficiency) for the same cost.
  **The Test:** Are the claims commensurable?

  *   **C's Prediction:** Option B is mandatory. The moral weight of lifting people from severe deprivation outweighs the marginal gain for those already sufficient. The comparison is straightforward aggregation of need.
      *   *Revision Condition:* C would revise if it were proven that the domestic pension is essential to maintain the political coalition that supports foreign aid in the long run (the "instrumental" caveat).
  *   **N's Prediction:** The comparison is category error. Option A is a claim of *fairness* within a cooperative scheme (citizens paid in, they get out). Option B is a claim of *humanity*. While B is urgent, the legislature has a fiduciary duty to the contributors of Scheme A first.
      *   *Revision Condition:* N would revise if it were shown that the foreign deprivation was directly caused by the rich country's past policies (making it a rectification claim, which falls under justice).

  ### Case 4: The Climate Tax (Devised Case)
  **Scenario:** A wealthy state considers a carbon tax. The revenue will not be used domestically, but will be transferred entirely to a Global Adaptation Fund for vulnerable island nations. The tax will slightly reduce the disposable income of the wealthy state's working class (who remain above sufficiency).
  **The Test:** Can domestic citizens be coerced to pay for foreign justice?

  *   **C's Prediction:** This is permissible and required. Since the emissions cause harm globally, the remedy is a matter of justice. The working class is not being sacrificed below sufficiency, so their surplus is liable.
  *   **N's Prediction:** This is impermissible without specific consent. The state's coercive power is legitimated by serving the interests of its constituents. Using that power to transfer resources abroad, even for a good cause, violates the terms of the domestic political contract.
      *   *Revision Condition:* N would revise if the Adaptation Fund were structured as an insurance scheme that the wealthy state might one day need to draw upon (making it a mutual benefit scheme).

  ***

  **Chair's Closing Note:**
  In drafting Section III (Crux 1), I concluded that a portion of the dispute is verbal. C and N often talk past each other because C defines "justice" as *all stringent moral duties*, while N defines "justice" as *duties arising from shared institutions*. However, this is not merely semantic; it tracks a substantive disagreement about whether the *label* of justice matters for political legitimacy. N believes calling something "justice" implies it can be coercively enforced domestically; C believes it implies it can be coercively enforced globally. The wording in the Table (Section II) handles this by specifying the *ground* of the duty rather than fighting over the noun. We proceed with the understanding that we agree on the *action* required in most emergency cases, but disagree on the *legal and political mechanisms* appropriate to enforce them.
