prompt: |-
  You are to act as a senior philosopher specializing in axiology and population ethics who has spent a career translating ethical theories into tools that grant-makers, regulators, and review boards can actually use. Please think carefully and work in stages: begin by brainstorming several ways the fund's commitments (stated below) could be operationalized, noting where the commitments pull in different directions, then commit to the design you think best survives the constraints, and be explicit about what your chosen design sacrifices.

  Context: I am a program officer at a small private fund that makes grants exclusively on animal welfare. Our charter commits the fund to the following five positions, and I need them turned into something usable:

  (1) Reducing suffering takes strict priority over creating or enhancing happiness whenever the two compete for the same budget.
  (2) Suffering below some intensity threshold T may be traded against other goods — including pleasure — using roughly standard utilitarian arithmetic: numbers of animals, duration, intensity.
  (3) Suffering at or above T is lexically prior: no amount of happiness, for any number of beings, can offset preventing or ending it.
  (4) The fund does not know where T sits; the charter is silent, and our board members disagree sharply about how intense something must be to count.
  (5) Even below T, pleasure and pain are not straightforwardly commensurable; a "hedonic exchange rate" between them is at best a modeling convenience, and the procedure should not pretend otherwise.

  I need a written decision procedure my team of three officers can actually run each quarter. Practical constraints: we receive around 80 proposals per cycle, each officer has roughly one hour per proposal, and the final sign-off comes from a board with no philosophy background that must be able to see, from the paperwork alone, why a proposal failed. The procedure should therefore specify: the questions to ask about a proposal, in order; what counts as a sufficient answer to each; which answers return an automatic "no"; and which situations must be escalated to the board because the open question is one of values rather than facts — especially threshold placement, which I suspect cannot be proceduralized away and should be handled honestly rather than buried in a formula.

  The procedure must also tell my officers what to do about three recurring trouble spots. First, proposals whose entire expected benefit is positive-affect enhancement — enrichment for animals whose baseline welfare is already decent — since the charter is unclear on whether these are permitted, discouraged, or forbidden. Second, "many-mild versus few-intense" comparisons: a large herd of chronic, low-grade malaise against a small number of animals in acute agony, where the arithmetic below T points one way and the lexical commitment above T points the other. Third, proposals whose intensity estimates cross T only under the optimistic end of the applicant's own numbers.

  Then run the procedure on three representative proposals, in the form of worked examples with the reasoning visible at each step: (a) subsidizing a switch of a region's broiler flocks to slower-growing breeds, which would reduce mild chronic malaise across tens of millions of birds per year while modestly increasing mortality for some; (b) a surgical street-animal rescue service that treats roughly eight hundred animals per year in acute, T-crossing pain — this project is our founder's favorite, so be honest about what the procedure yields; (c) installing perches, substrate, and foraging devices for a zoo population of elephants whose welfare indicators are already reasonably good.

  Finally, close with a candid statement of where the procedure misfires: which classes of proposals it will systematically mistreat, and which of the fund's five commitments does the most damage when forced into an operational form. Do not give me a reading list or name-drop the literature; I want the reasoning, not the bibliography.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **Role:** Senior Philosopher (Axiology/Population Ethics) turned Practical Tool-Builder.
      *   **Task:** Create a usable decision procedure for a small animal welfare fund based on 5 specific charter commitments.
      *   **Constraints:** 3 officers, ~1 hour/proposal, 80 proposals/cycle. Board needs clear justification for rejections.
      *   **Key Commitments:**
          1.  Suffering reduction > Happiness creation (Priority).
          2.  Below Threshold $T$: Trade-offs allowed (Utilitarian arithmetic).
          3.  At/Above Threshold $T$: Lexical priority (No offsetting).
          4.  Unknown $T$: Board disagrees on intensity threshold.
          5.  Commensurability: Pleasure/Pain not perfectly interchangeable below $T$.
      *   **Trouble Spots to Address:**
          1.  Positive-affect enhancement (baseline decent).
          2.  Many-mild vs. Few-intense (Threshold conflict).
          3.  Uncertainty crossing $T$ (Optimistic estimates).
      *   **Deliverables:**
          1.  Brainstorming/Design Phase (Trade-offs).
          2.  The Decision Procedure (Questions, Flow, Escalation).
          3.  Worked Examples (a, b, c).
          4.  Candid Critique (Where it fails).

  2.  **Deconstruct the Commitments & Tensions:**
      *   *Tension 1 (Priority vs. Arithmetic):* Commitment 1 says suffering reduction is strict priority. Commitment 2 says below $T$, we can trade. This implies a two-tier system: Lexical above $T$, Consequentialist below $T$.
      *   *Tension 2 (Lexicality vs. Ignorance):* Commitment 3 says $T$ is absolute. Commitment 4 says we don't know $T$. This is the biggest operational risk. If we guess wrong, we violate the charter.
      *   *Tension 3 (Commensurability):* Commitment 5 warns against fake precision. We can't just say "1 unit of pain = 5 units of pleasure." We need a heuristic or a buffer.
      *   *Tension 4 (Efficiency vs. Rigor):* 1 hour per proposal means no complex modeling. It needs a checklist or scoring sheet.

  3.  **Brainstorming Operationalization Strategies:**
      *   *Option A: The Safety Margin Approach.* Set a provisional $T_{prov}$ lower than the lowest board member's estimate. Anything above $T_{prov}$ is treated as lexical.
          *   *Pros:* Respects lexicality.
          *   *Cons:* Might reject too many high-impact mild interventions.
      *   *Option B: The Weighted Scoring System.* Suffering gets a multiplier (e.g., 10x) compared to happiness.
          *   *Pros:* Easy to calculate.
          *   *Cons:* Violates Commitment 3 (Lexicality implies infinity, not 10x). Violates Commitment 5 (Fake precision).
      *   *Option C: The Two-Track Triage.* Separate proposals into "Suffering Focus" and "Welfare Enhancement." Suffering Focus gets fast-tracked if intensity is high. Enhancement gets scrutinized for opportunity cost.
          *   *Pros:* Aligns with Commitment 1.
          *   *Cons:* Doesn't solve the $T$ uncertainty.
      *   *Option D: The "Reasonable Doubt" Protocol.* If there is *any* credible evidence intensity $\ge T$, treat as lexical. Escalate uncertainty to the Board.
          *   *Pros:* Honest about Commitment 4.
          *   *Cons:* Burdens the Board.

      *   *Selected Design:* A hybrid of Option A and D. We need a "Provisional Threshold" ($T_{prov}$) based on the *most conservative* board view to ensure we never violate Commitment 3. We need a "Suffering-Weighted Score" for below-$T$ work that acknowledges Commitment 5 (no direct exchange rate, but a priority weighting). We need an explicit "Escalation Path" for $T$-uncertainty.

  4.  **Developing the Decision Procedure:**
      *   *Step 1: Intensity Screening.* Is there *any* chance this involves suffering $\ge T_{prov}$? If yes, Lexical Track. If no, Trade-off Track.
      *   *Step 2: The Lexical Track.* If suffering $\ge T_{prov}$, does it reduce it? If yes, Fund. If it *creates* it (even for happiness), Reject.
      *   *Step 3: The Trade-off Track.* Calculate "Suffering Units Reduced" vs. "Happiness Units Created." Apply a "Suffering Priority Multiplier" (not an exchange rate, but a hurdle rate).
      *   *Step 4: The Uncertainty Clause.* If data is ambiguous regarding $T$, escalate.
      *   *Addressing Trouble Spots:*
          1.  *Enhancement:* Allowed only if no suffering-reduction alternatives exist (Opportunity Cost Test).
          2.  *Many-Mild vs. Few-Intense:* If "Few-Intense" crosses $T_{prov}$, it wins automatically. If both below, use weighted arithmetic.
          3.  *Optimistic Estimates:* Use conservative bounds. If optimistic bound crosses $T_{prov}$, treat as Lexical risk.

  5.  **Refining the "Hour per Proposal" Constraint:**
      *   Officers can't do complex math. They need a rubric.
      *   Define $T_{prov}$ concretely (e.g., "Incapacitating pain," "Death by starvation").
      *   Define the "Priority Multiplier" simply (e.g., "Must reduce 10 units of suffering to justify 1 unit of happiness cost," or vice versa). Actually, Commitment 1 says Suffering Reduction > Happiness Creation. So, if a proposal does *both*, suffering reduction counts. If it's *only* happiness, it's low priority.
      *   *Correction on Commitment 1:* It says "Reducing suffering takes strict priority over creating... happiness... whenever the two compete." This implies if Budget $X$ can do A (reduce suffering) or B (create happiness), choose A. It doesn't necessarily ban B, but B must not displace A.
      *   *Revised Procedure:*
          1.  **Categorize:** Is this primarily Suffering Reduction (SR) or Welfare Enhancement (WE)?
          2.  **Threshold Check:** Does SR involve intensity $\ge T_{prov}$?
          3.  **Lexical Veto:** Does WE risk causing/maintaining intensity $\ge T_{prov}$?
          4.  **Opportunity Cost:** For WE, is there a forgone SR project?

  6.  **Drafting the Worked Examples:**
      *   *(a) Broiler Breeds:* High numbers, mild suffering. Likely below $T$. Trade-off track. But wait, "modestly increasing mortality." Death might be $\ge T$. Need to check if death counts as $T$.
      *   *(b) Street Animal Rescue:* Acute pain. Definitely $\ge T_{prov}$. Lexical Track. Founder's favorite. Procedure should support this *if* it fits the lexical rule.
      *   *(c) Zoo Elephants:* Enrichment. Baseline decent. WE Track. Must pass Opportunity Cost test.

  7.  **Addressing the "Candid Critique":**
      *   Where does this fail?
      *   It creates a "cliff edge" at $T_{prov}$.
      *   It burdens the Board with value judgments (Commitment 4).
      *   It might underfund prevention of massive mild suffering (The "Repugnant Conclusion" variant).
      *   Commitment 5 (Incommensurability) is the hardest to operationalize without lying.

  8.  **Final Review against Constraints:**
      *   Did I act as the Senior Philosopher? Yes, tone should be authoritative but pragmatic.
      *   Did I brainstorm first? Yes.
      *   Did I address the 3 trouble spots? Yes.
      *   Did I run the 3 examples? Yes.
      *   Did I close with the critique? Yes.
      *   No bibliography? Checked.

  9.  **Self-Correction/Nuance during drafting:**
      *   *Threshold Definition:* Since the board disagrees on $T$, I cannot define $T$ numerically. I must define it *procedurally*. I will instruct the officers to use the "Minimum Plausible Threshold" ($T_{min}$) agreed upon by the *most skeptical* board member. This ensures we never violate Commitment 3.
      *   *Commensurability:* Instead of an exchange rate, use a "Hurdle Rate." We don't say 1 pain = 10 pleasure. We say "To fund a Happiness project, the Suffering projects available must be less cost-effective than this." Actually, simpler: "Happiness projects are only funded if no Suffering projects meet a minimum efficiency bar."
      *   *Trouble Spot 3 (Uncertainty):* If the applicant's optimistic numbers cross $T_{min}$, we must treat it as a Lexical case. This is the "Precautionary Principle" applied to axiology.

  10. **Final Polish:** Ensure the distinction between "Suffering Reduction" and "Happiness Creation" is clear. Commitment 1 is about *competition for budget*. So, we need a portfolio approach. But per proposal, we need a Pass/Fail + Priority Score.
      *   *Decision:* Let's create a "Traffic Light" system. Red (Lexical Suffering), Yellow (Trade-off Suffering), Green (Enhancement). Green only funded if Red/Yellow bucket is full.
      *   *Wait, one hour per proposal.* Officers can't compare across the whole pool in one hour. They need to score the proposal *on its own merits* relative to the charter, then the Program Director sorts the pool.
      *   *Refined Procedure:* Officers determine the *Category* and *Eligibility*. Board/Director decides allocation based on Categories.
      *   *Actually, the prompt asks for a procedure the team can run.* I will design a "Proposal Assessment Form" that forces the categorization.

      *(Self-Correction on Commitment 1)*: "Reducing suffering takes strict priority... whenever the two compete." This implies a budget constraint. If we have \$1M, and \$1M of suffering projects exist, we fund 0 happiness projects. The procedure needs to flag proposals as "Priority 1 (Suffering)" or "Priority 2 (Enhancement)."

      *(Refining the Threshold)*: Since $T$ is unknown, I will institute a "Conservative Threshold Proxy" ($T^*$). $T^*$ is set by the Board as the *lowest* intensity any member considers lexical. This guarantees we never violate Commitment 3 (by treating something as tradeable that should have been lexical). It risks being too conservative (treating tradeable stuff as lexical), but that's safer for the charter.

      *(Refining Trouble Spot 1 - Enhancement)*: Charter is unclear. Commitment 1 says Suffering > Happiness *when competing*. It doesn't ban Happiness. So Enhancement is permissible *only if* it doesn't displace Suffering Reduction. The procedure must flag this for the final budget meeting, not necessarily reject the proposal outright. *However*, for the officer's 1-hour review, they need to know if it's a "Yes," "No," or "Maybe." I will make Enhancement proposals "Conditional Yes" dependent on budget surplus.

      *(Refining Trouble Spot 2 - Many vs Few)*: If the "Few" cross $T^*$, they win (Lexical). If neither cross $T^*$, use arithmetic.
      *(Refining Trouble Spot 3 - Uncertainty)*: If the range includes $T^*$, treat as Lexical.

      Let's write it.

      *Structure:*
      1.  **Design Memorandum:** Brainstorming & Selection.
      2.  **The Operational Protocol:** The actual steps/forms.
      3.  **Trouble Spot Resolutions:** Specific rules.
      4.  **Worked Examples:** Applying the protocol.
      5.  **Post-Mortem:** Where this breaks.

      *Tone:* Professional, direct, slightly weary of theory but respectful of the constraints.

      *Key Philosophical Move:* The "Lexical Safety Buffer." Since we don't know $T$, we set a proxy $T^*$ that is definitely *below* the true $T$ (if there is one). Wait, if we set it below, we treat more things as lexical. That protects Commitment 3. If we set it above, we risk violating 3. So $T^*$ = The lowest intensity the most "lexically strict" board member worries about.

      *Wait, one more check on Commitment 5:* "Hedonic exchange rate... at best a modeling convenience." I should avoid asking officers to calculate "Net Utility." Instead, ask them to estimate "Suffering Alleviated" and "Happiness Created" separately. Then compare.

      *Okay, ready to draft.*
answer: |-
  # MEMORANDUM: OPERATIONALIZING AXIOLOGICAL COMMITMENTS

  **TO:** Program Officers & Board of Directors
  **FROM:** Senior Advisor, Ethical Frameworks
  **SUBJECT:** Decision Procedure for Grant Allocation (Cycle Q3)

  ## PART I: DESIGN BRAINSTORM & SELECTION

  You have five commitments that form a coherent philosophical position (a form of *lexical negative utilitarianism with epistemic humility*), but they are operationally hostile to one another. Commitment 3 (Lexical Priority) demands a binary switch; Commitment 4 (Ignorance of Threshold) says we don't know where to flip the switch; Commitment 5 (Incommensurability) says we shouldn't use the math required to manage the switch.

  I considered three architectural designs for this procedure:

  1.  **The Weighted Scorecard:** Assign suffering a heavy weight (e.g., 10x) relative to happiness.
      *   *Rejection:* This violates Commitment 3. Lexical priority means *infinite* weight, not 10x. It also violates Commitment 5 by pretending we know the exchange rate.
  2.  **The Pure Triage:** Fund all suffering reduction first; fund happiness only with leftovers.
      *   *Rejection:* This fails Commitment 2. We are allowed to trade below threshold $T$. A pure triage would reject valid trade-offs (e.g., minor pain for major pleasure) that the charter permits.
  3.  **The Lexical Safety Buffer (Selected):** We establish a *Provisional Threshold* ($T^*$) set at the *lowest* intensity any board member considers potentially lexical. We treat anything crossing $T^*$ as Lexical (Commitment 3). Anything below $T^*$ is subject to Trade-off Arithmetic (Commitment 2), but with a "Suffering Hurdle" to respect Commitment 1 and 5.

  **Why this design?** It prioritizes avoiding the sin of Commission (violating Lexicality) over the sin of Omission (missing a trade-off). If we treat a tradeable pain as lexical, we lose efficiency. If we treat a lexical pain as tradeable, we violate the charter. Given the Board's disagreement (Commitment 4), the Safety Buffer is the only defensible fiduciary position.

  **What this sacrifices:** It will systematically underfund "high-intensity" interventions where the intensity is ambiguous. It creates a "cliff edge" where a proposal marginally below $T^*$ is treated fundamentally differently than one marginally above it. It places the burden of value judgment on the Board for any proposal hovering near $T^*$.

  ---

  ## PART II: THE DECISION PROCEDURE

  **Time Budget:** 60 Minutes per Proposal.
  **Output:** A "Classification & Recommendation" Sheet.

  ### Phase 1: The Threshold Screen (15 Minutes)
  *Goal: Determine if Lexical Priority applies.*

  **Question 1.1:** Does the proposal address suffering that the applicant *claims* reaches an intensity of incapacitating agony, terror, or prolonged physical destruction?
  *   **Yes:** Go to 1.2.
  *   **No:** Classify as **Tier 2 (Trade-off)**. Go to Phase 2.

  **Question 1.2:** Is there *any* credible evidence (applicant data, veterinary consensus, or officer intuition) that the suffering intensity might meet the Board's "Conservative Proxy" ($T^*$)?
  *   *Note on $T^*$:* The Board must define $T^*$ once per year. Recommendation: "Pain that renders normal function impossible and is not relieved by standard analgesics."
  *   **Yes (Crosses $T^*$):** Classify as **Tier 1 (Lexical)**. Go to Phase 3.
  *   **No (Below $T^*$):** Classify as **Tier 2 (Trade-off)**. Go to Phase 2.
  *   **Uncertain:** Classify as **Tier 1 (Lexical)** *for the purpose of review*, but flag for **Board Escalation**. (Precautionary Principle).

  ### Phase 2: The Trade-off Assessment (Tier 2 Only) (30 Minutes)
  *Goal: Apply Commitment 1 & 5 without fake precision.*

  **Question 2.1:** What is the primary outcome?
  *   **Suffering Reduction:** Proceed to 2.2.
  *   **Happiness/Enhancement Only:** Proceed to 2.3.

  **Question 2.2 (Suffering Reduction):** Estimate the "Suffering Units" (Number $\times$ Duration $\times$ Intensity). Is the cost-per-unit efficient compared to historical benchmarks?
  *   **Yes:** Recommend **Fund**.
  *   **No:** Recommend **Reject**.

  **Question 2.3 (Happiness/Enhancement):** Does this project displace a potential Suffering Reduction project?
  *   *Officer Instruction:* You cannot know the whole pool. Instead, ask: "Is this intervention cost-effective enough that it *would* compete with suffering reduction?"
  *   **Procedure:** Apply a **2:1 Suffering Hurdle**. The "Happiness Value" must be demonstrably large (e.g., fundamental behavioral freedom) to justify the budget. If the benefit is merely "novelty" or "minor preference," Recommend **Reject** (per Commitment 1).
  *   **Rationale:** This respects Commitment 5 (no exact rate) while enforcing Commitment 1 (priority).

  ### Phase 3: The Lexical Veto (Tier 1 Only) (15 Minutes)
  *Goal: Enforce Commitment 3.*

  **Question 3.1:** Does the project *reduce* or *prevent* the Tier 1 suffering?
  *   **Yes:** Recommend **Fund** (Priority High).
  *   **No:** (e.g., the project creates this suffering to generate happiness, or ignores it). Recommend **Reject** (Veto).
  *   *Note:* No arithmetic is permitted here. You cannot offset Tier 1 suffering with Tier 2 happiness.

  ### Phase 4: Escalation Triggers
  *Send to Board if:*
  1.  **Threshold Ambiguity:** The proposal sits exactly on $T^*$ (e.g., "Chronic severe lameness" where vets disagree on severity).
  2.  **Budget Competition:** A Tier 2 Happiness project is exceptionally high quality, but the pool is saturated with Tier 1 Suffering projects. (This is a portfolio decision, not a proposal decision).
  3.  **Trouble Spot 3:** The applicant's *optimistic* estimates cross $T^*$, but *conservative* estimates do not. (Treat as Tier 1, flag for Board).

  ---

  ## PART III: TROUBLE SPOT RESOLUTIONS

  **1. Positive-Affect Enhancement (Baseline Decent)**
  *   **Rule:** These are **Tier 2 (Trade-off)** proposals.
  *   **Constraint:** They are permissible *only if* they pass the 2:1 Suffering Hurdle. They are effectively "Budget Surplus" projects.
  *   **Officer Instruction:** Do not reject outright. Score them on "Magnitude of Enhancement." If the enhancement is trivial (e.g., new toy), Reject. If fundamental (e.g., social grouping for solitary animals), Approve as Tier 2.
  *   **Rationale:** Commitment 1 says suffering reduction has priority *when competing*. It does not ban happiness. But Commitment 5 warns against commensurability. We treat these as secondary claims on the budget.

  **2. Many-Mild vs. Few-Intense**
  *   **Rule:** Check the "Few-Intense" against $T^*$.
  *   **Scenario A:** The intense suffering crosses $T^*$. **The Few Win.** Lexical priority overrides the arithmetic of the Many.
  *   **Scenario B:** The intense suffering is below $T^*$. **The Many Win.** Revert to standard arithmetic (Commitment 2).
  *   **Rationale:** This is the only way to honor Commitment 3 without knowing the true $T$. We err on the side of the intense.

  **3. Uncertainty Crossing $T$ (Optimistic Estimates)**
  *   **Rule:** The **Precautionary Lexical Principle**.
  *   **Procedure:** If the *upper bound* of the applicant's confidence interval crosses $T^*$, you must process the proposal as **Tier 1 (Lexical)**.
  *   **Reasoning:** If we fund it as Tier 2 and it turns out to be Tier 1, we have violated the Charter (Commitment 3). If we fund it as Tier 1 and it was Tier 2, we have merely been inefficient. Efficiency is preferable to Charter violation.
  *   **Action:** Flag for Board. The Board must decide if they are willing to accept the risk of the intensity being lower than feared.

  ---

  ## PART IV: WORKED EXAMPLES

  ### Proposal A: Broiler Breed Switch
  *   **Description:** Switch region to slower-growing breeds. Reduces mild chronic malaise (leg pain) for 10M birds. Increases mortality (culling) for 5% of flock.
  *   **Step 1: Threshold Screen.**
      *   *Mild Malaise:* Below $T^*$ (Chronic but functional).
      *   *Increased Mortality:* Death is generally considered $\ge T^*$.
      *   *Analysis:* The intervention *creates* a risk of Tier 1 suffering (death) to reduce Tier 2 suffering (malaise).
  *   **Step 2: Classification.**
      *   Because it risks creating Tier 1 suffering (death), it triggers **Phase 3 (Lexical Veto)**.
      *   *Question 3.1:* Does it reduce Tier 1 suffering? No, it increases mortality risk.
      *   *Conflict:* It reduces massive Tier 2 suffering.
  *   **Step 3: Resolution.**
      *   Strict application of the procedure yields a **Reject** or **Board Escalation**.
      *   *Why:* We are trading Tier 2 goods against Tier 1 risks. Commitment 3 forbids offsetting Tier 1 with Tier 2.
      *   *Officer Recommendation:* **Escalate to Board.** This is a values question: Is "death" automatically $T$? Or is "death after a good life" different from "death in agony"? The Charter is silent.
      *   *Reasoning Visible on Paper:* "Proposal involves trade-off between Tier 2 chronic pain and Tier 1 mortality risk. Violates Lexical Safety Buffer without Board waiver."

  ### Proposal B: Street-Animal Rescue (Founder's Favorite)
  *   **Description:** Surgical rescue of 800 animals/year in acute, infected wounds.
  *   **Step 1: Threshold Screen.**
      *   *Intensity:* Acute, infected wounds, inability to move/feed.
      *   *Assessment:* Clearly crosses $T^*$ (Incapacitating pain).
      *   *Classification:* **Tier 1 (Lexical)**.
  *   **Step 2: Lexical Veto.**
      *   *Question 3.1:* Does it reduce Tier 1 suffering? Yes, it treats the wounds.
      *   *Result:* **Recommend Fund.**
  *   **Step 3: Honesty Check.**
      *   Does the procedure support the Founder's preference? Yes, but *only* because the intensity is objectively high.
      *   *Risk:* If the Board later decides $T$ is higher than $T^*$ (e.g., only "torture" counts, not "acute pain"), this project might be Tier 2. But under our Safety Buffer, it is Tier 1.
      *   *Officer Recommendation:* **Fund.**
      *   *Reasoning Visible on Paper:* "Intervention targets suffering clearly exceeding Provisional Threshold $T^*$. Lexical Priority applies. No offsetting required."

  ### Proposal C: Zoo Elephant Enrichment
  *   **Description:** Perches/foraging for elephants with "reasonably good" welfare indicators.
  *   **Step 1: Threshold Screen.**
      *   *Baseline:* "Reasonably good." No evidence of $T^*$ suffering.
      *   *Classification:* **Tier 2 (Trade-off)**.
  *   **Step 2: Trade-off Assessment.**
      *   *Type:* Happiness/Enhancement Only (Commitment 1).
      *   *Hurdle:* Must pass 2:1 Suffering Hurdle.
      *   *Analysis:* Does this provide fundamental behavioral freedom? Yes (foraging is species-typical). Is it trivial? No.
      *   *Competition:* Does it displace suffering reduction?
      *   *Officer Instruction:* Check the pool. If there are unfunded Tier 1 projects, this must be marked **Conditional**.
  *   **Step 3: Resolution.**
      *   *Officer Recommendation:* **Approve as Tier 2 (Surplus).**
      *   *Reasoning Visible on Paper:* "Enhancement project. Baseline welfare above $T^*$. Benefit is significant (species-typical behavior). Funding contingent on surplus budget after Tier 1 obligations met."
      *   *Note:* This honestly reflects Commitment 1. It doesn't ban the project, but it acknowledges it is secondary to suffering reduction.

  ---

  ## PART V: CANDID POST-MORTEM

  As the philosopher who designed this, I must tell you where it will break. This procedure is a machine built to survive a storm, but it leaks in the calm.

  **1. The "Cliff Edge" Failure**
  The procedure creates a moral discontinuity at $T^*$. A proposal reducing suffering at intensity $T^* - 0.1$ is treated as a commodity (Tier 2). A proposal reducing suffering at $T^* + 0.1$ is treated as sacred (Tier 1). In reality, the moral difference is marginal.
  *   *Consequence:* You will see applicants "game" the language. They will describe mild pain as "incapacitating" to trigger Tier 1 status. Your officers will become cynics, constantly doubting the intensity claims.

  **2. The "Massive Mild" Blind Spot**
  Commitment 3 (Lexicality) combined with the Safety Buffer means you may reject a proposal that prevents *massive* amounts of mild suffering (e.g., 100 million birds with mild malaise) in favor of a project that helps *one* animal in acute agony, if the acute agony crosses $T^*$.
  *   *Damage:* This is the intended consequence of Lexical Priority, but it will look like negligence to the public. You are sacrificing the "Many-Mild" to save the "Few-Intense." Commitment 1 does the most damage here; it forces you to ignore the aggregate sum of the bottom tier when the top tier is present.

  **3. The Board Burden (Commitment 4)**
  I have tried to proceduralize the threshold, but I have failed to remove the value judgment. By setting $T^*$ at the *lowest* plausible threshold, I have pushed all the ambiguity to the Board via the Escalation Trigger.
  *   *Reality:* You will escalate 20% of your proposals. The Board said they wanted to see "from the paperwork alone" why a proposal failed. This procedure will often say: "Failed because the Board hasn't told us if this pain counts."
  *   *Fix:* There is no fix. Commitment 4 (We don't know $T$) is incompatible with a fully automated decision procedure. I have chosen to expose that incompatibility rather than hide it with fake math.

  **4. The Commensurability Lie (Commitment 5)**
  Despite my warning, the "2:1 Suffering Hurdle" in Phase 2 is still a fake exchange rate. Officers will treat it as a formula.
  *   *Risk:* They will start quantifying "Happiness Units" to meet the hurdle.
  *   *Mitigation:* Remind them quarterly: The Hurdle is a *heuristic for caution*, not a *conversion rate*.

  **Final Advice:**
  This procedure protects the Fund's charter integrity better than it maximizes welfare impact. It is designed to ensure you never wake up and realize you funded a pleasure cruise for dogs while ignoring a burning barn of cats. If your goal is maximum welfare units regardless of distribution, discard this. If your goal is to remain faithful to the specific lexical commitments of your donors, use it, but prepare your Board for the "Cliff Edge" controversies.
