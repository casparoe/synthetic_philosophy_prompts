  Regarding eclipses and ice cores, the same principle applies. Eclipse records are ambiguous without a prior timeline; multiple historical dates can fit the same astronomical configuration, and the Scaligerian date is chosen by fiat based on the accepted chronology. Ice cores and varves assume uniformitarian deposition rates that ignore the catastrophic upheavals our statistical models suggest occurred during the phantom centuries. If the climate shifted radically due to the events we propose, layer counting becomes unreliable. You see convergence because all these methods are tuned to the same erroneous baseline established in the seventeenth century.
