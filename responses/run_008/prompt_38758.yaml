  I want to practice arguing against a serious proponent of Fomenko's New Chronology — the claim that the conventional chronology of antiquity and the Middle Ages is systematically corrupted, with whole epochs duplicated and shifted, so that most of recorded history before roughly AD 900 is phantom centuries. The online defenders are usually cranks, and arguing with them is boring; I want the strongest version of the position.

