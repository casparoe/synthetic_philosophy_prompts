      *Disanalogy 2:* Focus on Contractualism vs. Utilitarianism.
      *Disanalogy 3:* Focus on the meta-ethical commitment.
      *Survival:* The negative thesis (species membership isn't *intrinsic* value) survives better than the positive thesis (animals get equal weight).
      *Alternatives:* The "Family" analogy is the strongest rival.

      *Final Polish:* Ensure the distinction between "Equal Consideration of Interests" and "Equal Rights" is clear, as this is where the classmate's objection often trips up. Singer doesn't say a dog should vote. He says a dog's pain counts as much as a human's pain.

      *Wait, one more check:* The prompt asks "If the disanalogies cut against Singer, does that amount to a positive argument that species distinctions are justified, or only a rebuttal?" I need to be explicit that blocking Singer doesn't automatically justify speciesism (negative proof vs positive proof).

