answer: |-
  **Setting:** *A flat in Bristol, 11:30 PM. Two empty bottles of Rioja on the table. A whiteboard covered in half-erased logical notation stands in the corner. Alex is slumped in an armchair; Sam is pacing, holding a glass.*

  **Alex:** You're not listening to the impossibility proof, Sam. It's not a quibble. It's a demolition.

  **Sam:** It's a demolition of *Popper's* definition, yes. 1974. Tichý and Miller. I know the papers. But you're acting as if the whole project died that year. It didn't. It just grew up.

  **Alex:** Did it? Popper defined verisimilitude as truth content minus falsity content. $Vs(A) = Ct_T(A) - Ct_F(A)$. Sounds sensible. Newton has more true consequences than Aristotle, and fewer false ones. But Tichý showed that if Theory A and Theory B are both strictly false—which they always are, on your own admission—you cannot compare their falsity content without the whole thing collapsing. One false theory doesn't necessarily have a *subset* of the false consequences of another. They cross-cut. So the ordering fails. You get incomparability everywhere.

  **Sam:** That's the consequence-based definition. We moved past that. Look at the state-space approaches. Niiniluoto, Oddie. You define the logical space as a set of possible worlds or states of affairs. Truth is a specific point in that space—actually, the set of obtaining states. A theory picks out a region. Verisimilitude is just the distance between the theory's region and the truth.

  **Alex:** "Just the distance." That's the magic word. *Just*. How are you measuring distance? You need a metric. And to have a metric, you need to decide which features of the world count as dimensions in that space.

  **Sam:** We use the natural properties. The causal joints of nature.

  **Alex:** There it is! You've smuggled in a massive metaphysical assumption to save a logical definition. How do you identify the "natural properties" independently of the theory you're trying to judge? If I'm an Aristotelian, my natural properties are *earthy*, *watery*, *violent motion*. If I'm a Newtonian, they're *mass*, *distance*, *force*. You can't measure the distance between the theories unless you've already decided which vocabulary is the "correct" one to map the space.

  **Sam:** That's the language-dependence objection. Goodman's 'grue' problem, essentially. I grant you, it's a nuisance. But it's not fatal. We choose primitive predicates based on projectibility, on causal efficacy. It's not arbitrary.

  **Alex:** It's pragmatic, Sam. Not truth-tracking. You're saying we pick the predicates that *work*. Fine. But then verisimilitude collapses into empirical adequacy. Van Fraassen wins. You don't need "truthlikeness"; you just need "saves the phenomena better."

  **Sam:** No, because empirical adequacy is about the actual data. Verisimilitude explains why we trust theories *beyond* the data. Think about the prediction of Neptune. Newtonian mechanics was strictly false—we know that now. General Relativity superseded it. But when Le Verrier pointed his telescope, he found the planet. If Newtonian mechanics was just a random instrument for saving phenomena, why did it latch onto the existence of an unseen mass with such precision?

  **Alex:** Because it captured the structural relations of the solar system accurately enough within that domain. That's structural realism. You don't need the *propositions* to be truthlike; you need the *mathematical structure* to be isomorphic to the relations in the world.

  **Sam:** But structural realism *is* a form of verisimilitude! It's saying the structure gets closer to the real structure. You're just shifting the goalposts from "propositions" to "structures" to avoid the Tichý result.

  **Alex:** I'm avoiding the incoherence. Look, let's look at the "relevant consequence" approach. Schurz tried to fix the counting problem by saying we only count *relevant* true and false consequences. Not every logical disjunction counts.

  **Sam:** Exactly. It stops the tautology problem. A tautology has all true consequences but no specific content, so it doesn't get a high verisimilitude score. It filters out the noise.

  **Alex:** But who decides relevance? Schurz has to introduce weighting functions. You have to assign weights to different consequences to get the result that Newton > Aristotle. It feels entirely *post hoc*. You tune the weights until Newton comes out on top. It's curve-fitting the history of science, not defining a logical property.

  **Sam:** That's a harsh charge. The constraints on the weighting aren't arbitrary. They follow from coherence requirements. If you want a measure that behaves like a distance metric, you *have* to weight things this way. It's not tuning to get Newton; it's tuning to get a coherent metric, and it just so happens that Newton satisfies it better than Aristotle.

  **Alex:** "Just so happens." I'm sceptical. Here's my challenge, and I want you to think about this properly. Can you write down a definition of verisimilitude—using your state-space or relevant consequences—that delivers the ordering Newton > Aristotelian Physics > Phlogiston *without* already assuming that ordering in your choice of primitives or weights?

  **Sam:** I can't give you a definition that is theory-neutral in a vacuum. Science isn't done in a vacuum. We evaluate verisimilitude from within our best current theory.

  **Alex:** Aha! So verisimilitude is indexical. "Truthlike relative to current theory."

  **Sam:** Not indexical. *Fallibilist*. We assume our current best theory gives us the best approximation of the natural properties. So we use General Relativity to judge Newton. We use Newton to judge Aristotle. It's a bootstrapping operation.

  **Alex:** But if it's bootstrapping, then when Relativity gets superseded, your verdict on Newton might change. Maybe Newton wasn't closer to the truth than Aristotle; maybe he was just closer to *Einstein*. If the next theory says space is discrete, Newton's continuous field might look further from the truth than Aristotle's qualitative elements.

  **Sam:** That's possible. But it's unlikely. The convergence suggests we're narrowing in. Look at the constants. We aren't just flipping paradigms randomly; we're refining values. The deflection of light, the perihelion of Mercury. The error margins are shrinking. That looks like convergence.

  **Alex:** Convergence of predictive accuracy. I'll grant you that. But accuracy isn't truthlikeness. I can converge on the right number for the wrong reason. Ptolemy's epicycles could predict planetary positions quite well. Was Ptolemy truthlike?

  **Sam:** Less than Copernicus.

  **Alex:** Why? Mathematically, Ptolemy's system is isomorphic to a heliocentric system with the earth moving. It's a coordinate transformation. If you say Copernicus is more truthlike, you're saying the *ontology* matters, not just the maths. You're saying "Sun at centre" is a truer *statement* than "Earth at centre," even if the predictive geometry is equivalent.

  **Sam:** Yes! Because the causal story is better. The Sun is the massive body; the planets orbit it. That's a claim about the world, not just a calculation device.

  **Alex:** And how do you measure the truthlikeness of a causal story? Back to the metric. How many "truth points" does "Sun at centre" get? Is it a binary? If the Sun is actually wobbly due to Jupiter, is "Sun at centre" false? If it's false, how truthlike is it?

  **Sam:** It's approximately true.

  **Alex:** "Approximately." You're using the concept to define the concept.

  **Sam:** *[Sighs, sits down]* You're demanding a precision that the concept might not bear, Alex. You want a number. A rigorous $Vs(A) > Vs(B)$. Maybe that's impossible. Maybe verisimilitude is a partial ordering, not a total one. Maybe we can't compare Newton and Aristotle on *every* dimension, only on specific ones.

  **Alex:** If it's a partial ordering, and it's context-dependent, and it relies on pragmatic choices of primitives... then what work is the word "truth" doing? Why not just call it "theoretical utility"?

  **Sam:** Because utility is about *us*. Truthlikeness is about *the world*. That's the realist commitment. If I say Newton is more truthlike, I'm saying the world *is* more like Newton says it is than Aristotle says it is. Independent of our utility. If we went extinct tomorrow, the gravitational constant would still be what it is, and Newton's value would still be closer to it than Aristotle's qualitative physics.

  **Alex:** But you can't access that "still be" without a theory. You're positing a God's Eye View. You're saying there's a metric written into the fabric of reality that we are slowly deciphering.

  **Sam:** I'm saying it's a regulative ideal. We have to *act as if* there is a truth to approximate, otherwise the scientific method makes no sense. Why test? Why refine? If you deny verisimilitude, you have to explain progress as sociological or purely instrumental.

  **Alex:** I explain it as increasing empirical adequacy and unification. I don't need the metaphysical baggage.

  **Sam:** But the baggage explains *why* unification works. It works because the world is unified.

  **Alex:** Or because our brains like unification.

  **Sam:** *[Pauses]* Okay. Here's the crux. You think the formal failures—the Tichý result, the language dependence—show the concept is broken. I think they show the concept is hard to formalise, like "causation" or "explanation." We know causation exists, but defining it without circularity is a nightmare. Does that mean causation isn't real?

  **Alex:** Causation might be a projection too. But let's accept your analogy. Even if causation is hard to define, we can point to instances. Can you point to an instance of verisimilitude without pointing to a successful prediction?

  **Sam:** The success of novel predictions is the *evidence* for verisimilitude, not the definition.

  **Alex:** And that's where we stall. You think the success implies the truthlikeness. I think the success implies reliability. You want to infer the best explanation: "Science succeeds, therefore it must be tracking truth." I say: "Science succeeds, therefore it is reliable." The extra step to 'truth' is the bit I can't justify.

  **Sam:** And I can't justify stopping at 'reliable'. A reliable clock tells the right time twice a day. A truthlike theory tells you about the mechanism of the gears.

  **Alex:** But you can't see the gears without another theory.

  **Sam:** *[Stands up, walks to the whiteboard]* We're not going to solve this tonight. But I think I've forced you to admit that you can't account for the *directionality* of science without something like verisimilitude. You can't just have "change"; you have "improvement."

  **Alex:** And I think I've forced you to admit that you can't define that "improvement" without begging the question. You need the truth to define the distance, but you need the distance to find the truth.

  **Sam:** *[Smiles]* Coherentism.

  **Alex:** Circularism.

  **Sam:** *[Raises glass]* To the asymptote, then. We'll never reach it, but at least we agree on which direction to walk.

  **Alex:** *[Clinks glass]* I'll walk towards empirical adequacy. You walk towards the Truth. Just don't ask me to measure your progress.

  **Sam:** Deal. Pass the bottle.
