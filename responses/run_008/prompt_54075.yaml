prompt: |-
  Me and two friends from my rationalist-adjacent reading group have been at war for basically a year and I want to commission the peace treaty. It started when we read Aumann's "Agreeing to Disagree" and now, whenever the three of us hang out, Priya and Marcus re-litigate it. Priya's position: the theorem shows that two ideal Bayesians with a common prior literally cannot have common knowledge of their posteriors on a proposition and still disagree, so persistent disagreement between smart, honest people is always evidence that somebody is failing at rationality somewhere, and she's started saying things like "the disagreement itself is the data" at parties. Marcus's position: the theorem is true and beautiful and almost totally inapplicable — common priors are a philosopher's fantasy, nobody ever actually reaches common knowledge of posteriors (you'd need infinite back-and-forth, and half the time you can't even settle on the same partition over the same event), and two agents with different priors can disagree forever while both being perfectly coherent. The proximate trigger was an argument about whether a mutual friend's startup is going to fail, which Priya says they've now "iterated posteriors on" enough times that one of them has to be faking something, and Marcus says is exactly the case where Aumann doesn't apply because they never had a common prior on the founder's competence in the first place.

  You are a formal epistemologist who has moderated several adversarial collaborations, and I want you to draft the joint statement document Priya and Marcus should have produced instead of a year of sniping. So: a numbered section of claims both can actually sign (including about what the theorem itself says, and what it does and doesn't establish); a disagreements table where each disagreement is worded so its own side would accept the phrasing — no strawmen, no "one side thinks the theorem applies to real life" vs "the other side is confused"; then the cruxes. I suspect at least one crux is the status of the common prior assumption — whether differences in priors are themselves irrationalities, pre-rational starting points, or just different evidence histories — and another is what "common knowledge of posteriors" would even require for flesh-and-blood humans with finite time and fuzzy partitions. For each crux, give a concrete case or argument both would agree bears on it, with each side's prediction written down in advance (e.g., if two calibrated forecasters with track records share their full evidence histories on a question, does Priya predict their estimates converge, while Marcus predicts stable, honest residual disagreement — and what would count as the crux coming down one way or the other?).

  Take this seriously and make some actual choices: don't give me a menu of possible cruxes, commit to which ones you think are real and say why, and if you think some chunk of their fight is purely verbal — e.g. they're using "rational" in two different senses and never noticed — come out and say which part and why, since that's the part I personally want settled. Format as a numbered agreed-claims section followed by the disagreements table, then the cruxes. And keep it fair: Priya and Marcus will both read it, and if either one thinks the draft is tilted I'll never hear the end of it. Brainstorm the crux structure before you write the final doc, and don't be afraid to say where you're unsure — but put the uncertainty in the crux section, not as an excuse to fence-sit on what's verbal.
