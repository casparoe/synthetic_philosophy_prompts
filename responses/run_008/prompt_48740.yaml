answer: |-
  Your intuition is powerful and aligns with a significant school of thought in metaphysics. You have identified what philosophers call the "problem of profligate omissions." If we say the neighbor's *not* watering caused the death, logically, the stranger's *not* watering, the President's *not* watering, and everyone else's *not* watering also caused the death. Since it seems absurd to blame the President, you conclude that omissions aren't causes at all, but rather placeholders for blame.

  However, I will argue that you are conflating **causal ontology** (what constitutes a cause) with **causal selection** (which causes we choose to talk about). My case is that omissions are genuine causes in the same structural sense as positive events, but your insight about the neighbor vs. the stranger is correct regarding *explanation*, not causation.

  Here is the argument against your position, with specific attention paid to contested metaphysical grounds.

  ### 1. The Counterfactual Dependence Argument
  The strongest case for omissions as causes relies on counterfactual dependence. In standard causal reasoning, $C$ causes $E$ if, had $C$ not occurred, $E$ would not have occurred.

  Apply this to your plants:
  *   **Positive Event:** If the sun had not shone (positive event), the plants would not have died.
  *   **Omission:** If the neighbor had watered (omission removed), the plants would not have died.

  Both the sun shining and the neighbor's inaction satisfy the counterfactual test. The plants' survival depended on the neighbor's action just as physically as it depended on the soil's chemistry. If we deny the omission is a cause, we break the symmetry of counterfactual dependence, which is a cornerstone of modern causal reasoning.

  **[Contested Claim Flag]:** *This argument relies on the Counterfactual Theory of Causation (associated with David Lewis). This is a dominant view in analytic philosophy, but it is contested by "Process Theorists" (like Phil Dowe). Process Theorists argue that causation requires a physical transfer of energy or momentum. Since an omission transfers no energy, they agree with you that omissions are not genuine causes. However, most contemporary work in law, medicine, and AI relies on counterfactual or interventionist models where omissions function causally.*

  ### 2. Causal Ontology vs. Causal Selection
  Your argument hinges on the stranger. You argue that because the stranger's omission isn't a cause, omissions generally aren't causes. I propose a different distinction: **The stranger's omission *is* a cause, but it is not *the* cause we cite.**

  Philosophers distinguish between the **causal field** (all conditions necessary for the effect) and **causal selection** (picking one condition to label "the cause" for the sake of explanation).
  *   **The Causal Field:** Includes the heat, the dry soil, your absence, the neighbor's inaction, *and* the stranger's inaction. All are counterfactually necessary.
  *   **Causal Selection:** We select the neighbor because of norms, expectations, and salience.

  On this view, you are right that norms distinguish the neighbor from the stranger, but wrong about *what* the norms are doing. The norms are not turning a non-cause into a cause; they are filtering a list of genuine causes to find the most relevant one for human communication.

  Consider a medical analogy: A patient dies because a machine wasn't plugged in.
  *   **Doctor A** forgot to plug it in (duty).
  *   **Visitor B** walked past and didn't plug it in (no duty).
  *   **Metaphysical Status:** Both failures are causally equivalent. The electricity didn't flow in both scenarios.
  *   **Explanatory Status:** We cite Doctor A.

  If we adopt your view (that omissions are just blame), we cannot explain why we sometimes cite omissions where there is no blame. For example, "The lack of rain caused the famine." No one is necessarily to blame for the lack of rain, there is no "duty" the sky breached, yet we universally accept this as a causal statement, not a normative one. This suggests omissions have causal power independent of duty.

  ### 3. Interventionism and Manipulability
  A robust way to view causation is through **Interventionism** (associated with James Woodward). On this view, $C$ causes $E$ if an intervention on $C$ changes $E$.

  If we could "intervene" on the neighbor's omission (force them to water), the plants live. If we intervene on the stranger's omission (force them to water), the plants also live. Both are "causal handles" on the outcome. The fact that we are only *allowed* to intervene on the neighbor (socially/legally) does not change the fact that both are causal handles on the physical state of the world.

  **[Contested Claim Flag]:** *Interventionism is highly influential in the sciences but is sometimes criticized as being too anthropocentric. It defines causation relative to what agents can manipulate. Some realists argue causation exists independently of possible interventions. However, even within realism, the "absence of a preventer" is often treated as a causal factor.*

  ### 4. The Danger of Your View for Explanation
  If we accept your view—that "omission causes" are just code for "breach of duty"—we lose the ability to explain accidents where no duty exists.

  Imagine you build a bridge. It collapses because a specific bolt was missing.
  *   **Scenario A:** A worker forgot to install the bolt (negligence).
  *   **Scenario B:** The bolt fell out due to a manufacturing defect unknown to anyone (no negligence).

  In both scenarios, engineers will say, "The absence of the bolt caused the collapse." If your theory were true, Statement B would be false or confused, because no one breached a duty. But engineers treat the absence as a physical cause in both cases. They need to know *that* the missing bolt caused the failure to design better bridges, regardless of who is to blame. This suggests the causal claim is descriptive of the physical dependency, while the blame claim is a separate layer added on top.

  ### 5. Resolving the Stranger Puzzle
  So, why does it sound absurd to say the stranger caused the death?

  It sounds absurd not because of **metaphysics**, but because of **pragmatics**. When we ask "What caused this?", we are usually asking a contrastive question: "What caused this *rather than the normal state of affairs*?"

  *   **Normal State:** Neighbors water plants; strangers walk by.
  *   **Deviation:** Neighbor didn't water; stranger walked by.

  The stranger's behavior was constant with the background conditions. The neighbor's behavior was a deviation from the expected background. We cite causes that represent *changes* or *deviations* from a baseline. The stranger represents the baseline (people who don't water my plants); the neighbor represents the deviation (the person who *should* have).

  Therefore, the stranger's omission is a **background condition**, while the neighbor's omission is a **salient cause**. Both are causally efficacious in the physical sense (the plants died because neither watered them), but only one is useful for explanation.

  ### Conclusion
  Your suspicion is half-right. You correctly identify that norms determine why we single out the neighbor over the stranger. However, you draw the wrong conclusion from this.

  1.  **Causation is broad:** Counterfactually and interventionally, both the neighbor and the stranger are causes. The physical world does not distinguish between "duty-bound inaction" and "stranger inaction"; in both cases, water failed to arrive.
  2.  **Explanation is narrow:** When we speak, we filter causes through norms to find the most relevant one.

  To say "the neighbor's failure caused the death" is not a confused way of assigning blame. It is a precise causal claim (the plants depended on that action) wrapped in a pragmatic selection rule (we only mention causes that violate expectations). If we reduce omissions to mere blame, we lose the ability to describe causal chains in non-moral contexts (like the famine or the bridge), rendering our causal language less powerful, not more.

  **[Final Contested Claim Flag]:** *The claim that "background conditions" are causes but merely unmentioned is a standard view in pragmatics (e.g., H.L.A. Hart), but some contextualists argue that causation itself is context-sensitive. That is, they argue the stranger literally is not a cause in this context, not just that they are an unmentioned cause. I have argued for the former (realist) view, but the latter (contextualist) view is a live option in current philosophy.*
