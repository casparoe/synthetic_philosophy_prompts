  2.  **Brainstorming & Mapping the Terrain:**
      *   *Core Tension:* The psychological consensus (Guilt = adaptive, Shame = maladaptive) vs. Sociological/Anthropological reality (Shame = social glue, Guilt = internalized shame).
      *   *Point 1 (Anthropology):* Benedict's *Chrysanthemum and the Sword* (Shame Culture vs. Guilt Culture) is indeed debunked as a rigid binary. All cultures have both. However, the *mechanism* distinction (external sanction vs. internal sanction) is useful if we acknowledge the internal is shaped by the external. *Survival:* The distinction isn't cultural *types*, but *modes of regulation*.
      *   *Point 2 (Criminology):* Braithwaite's *Reintegrative Shaming*. Key distinction: Stigmatizing shame (reject the person) vs. Reintegrative shame (reject the act, welcome the person back). This bridges the gap. Guilt without social consequence is cheap; Shame without reintegration is destructive.
      *   *Point 3 (Philosophy/Psychology):* The "Internalized Audience" argument (Scheff, Nussbaum, Williams). Guilt *is* shame that has learned to speak in the first person. The "Guilt is Good" narrative serves liberal individualism (you are responsible, not society).
      *   *Point 4 (Cultural Choice):* Can we choose? Yes, but path-dependently. Scandinavia (low shame, high trust) vs. US (high stigma, high recidivism) vs. Internet (high shame, no reintegration). The internet isn't "anonymous market," it's a "permanent record audience."
