prompt: |-
  I teach philosophy at a mid-sized state school, and by virtue of being the token ethicist in the building I sit on the ethics committee at the regional hospital a few towns over. We have a case on the docket for next month that is squarely my area, and I keep going back and forth on it, so I want a written opinion I can circulate to the committee ahead of the meeting recommending what we should actually do.

  The patient is a 74-year-old woman with moderately advanced Alzheimers. Her advance directive was drawn up 16 years ago, shortly after her mother died of the same disease, and it refuses antibiotics if a life-threatening infection sets in once she has reached the stage of no longer recognizing her family. Two complications. First, the trigger condition: most days she knows her husband fine, but a couple weeks back she called her daughter by her sister's name, and the attending says there are evenings when she doesn't seem to place him at all. Whether she "recognizes her family" seems to shift by the hour, and the directive obviously says nothing about that. Second, three years after signing she added a handwritten line at the bottom — the handwriting has been confirmed as hers — to the effect that if she is still enjoying her days, we are not to give up on her. And honestly she is doing OK: she lights up at the music group, eats well, seems content. Now she has a pneumonia that is drifting toward "life-threatening," and the family has split down the middle. The daughter wants the antibiotics, leaning on the handwritten line and on who her mom is right now; the husband wants the directive followed to the letter, because he promised her he would see it through.

  The memo needs to do three things. (a) Recommend a concrete course of action on this specific case, with reasoning the committee members can actually follow step by step — not a "both sides have merit" dodge, we get enough of those. (b) Take the strongest version of the losing side seriously rather than the strawman version. (c) Sketch what this case implies for how the hospital should handle directives with vague trigger conditions, or with later addenda that cut against the original text, since this will not be the last one we see.

  Assume the committee already knows the Dworkin stuff about critical versus experiential interests, and the standard worry that the woman who signed the directive is not, in some relevant sense, the woman in the bed — don't recite the literature at us, work the case. And don't lean on what any particular state's law requires; we want the ethical recommendation and will have counsel check the legal bits ourselves.

  Keep it short enough that the committee will actually read it before hand — call it two pages if it were on paper.
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **Role:** Philosophy professor (token ethicist) on a regional hospital ethics committee.
      *   **Task:** Write a written opinion/memo for the committee regarding a specific case.
      *   **Case Details:**
          *   Patient: 74F, moderately advanced Alzheimer's.
          *   Condition: Pneumonia drifting toward life-threatening.
          *   Advance Directive (AD): Signed 16 years ago. Refuses antibiotics if life-threatening infection occurs *once she has reached the stage of no longer recognizing her family*.
          *   Complication 1 (Trigger): Recognition is fluctuating. Knows husband most days, recently called daughter by sister's name, sometimes doesn't place husband. AD doesn't cover fluctuation.
          *   Complication 2 (Addendum): 3 years after signing, handwritten note: "if she is still enjoying her days, we are not to give up on her." Handwriting confirmed.
          *   Current State: Seems content, lights up at music, eats well.
          *   Family Conflict: Daughter wants antibiotics (cites addendum + current contentment). Husband wants to follow original AD (cites promise + original intent regarding dignity/decline).
      *   **Requirements:**
          *   (a) Recommend a concrete course of action (no fence-sitting).
          *   (b) Take the strongest version of the losing side seriously (steelman, not strawman).
          *   (c) Sketch implications for hospital policy on vague triggers and conflicting addenda.
          *   (d) Avoid reciting standard literature (Dworkin, personal identity) – assume committee knows it. Work the case.
          *   (e) Ignore specific state law (ethical recommendation only).
          *   (f) Length: Short enough to read beforehand (~2 pages single-spaced equivalent, so roughly 800-1000 words).

  2.  **Determine the Recommendation:**
      *   *Option A: Withhold Antibiotics.* Respects the original AD's intent regarding dignity and avoiding prolonged decline. Aligns with the husband's view. Risk: Ignores the addendum and current quality of life.
      *   *Option B: Administer Antibiotics.* Respects the addendum and current experiential interests. Aligns with the daughter's view. Risk: Undermines the original AD's specific condition about recognition.
      *   *Analysis:* The original AD has a specific trigger: "no longer recognizing her family." The current state is *ambiguous* but leans towards *still recognizing* (knows husband most days, fluctuates). The addendum adds a condition: "if she is still enjoying her days." She *is* enjoying her days.
      *   *Ethical Weight:* The addendum is more recent (3 years post-signing vs 16 years ago). It acts as a modification based on closer proximity to the disease onset. The trigger condition ("recognizing family") is not definitively met yet due to fluctuation. In cases of ambiguity regarding life-sustaining treatment, the presumption should generally favor life unless the refusal is clear and applicable.
      *   *Decision:* Recommend **administering antibiotics**.
      *   *Reasoning:* The trigger condition for refusal is not clearly met (fluctuating recognition), and the addendum explicitly prioritizes current enjoyment, which is present. The burden of proof for withholding life-saving treatment based on an AD should be high.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Introduction:** State the purpose and the recommendation clearly upfront.
      *   **Argument for Recommendation (The Winning Side):**
          *   Focus on the specificity of the trigger. "No longer recognizing" is not definitively established. Fluctuation means the condition isn't met *yet*.
          *   Focus on the addendum. It's a later expression of intent, closer to the reality of the disease. It introduces a "quality of life" override.
          *   Current state: She is content. Treating the pneumonia preserves this current state of well-being.
      *   **Steelman the Losing Side (Husband/Original AD):**
          *   Acknowledge the husband's fidelity to the promise.
          *   Acknowledge the risk of "slippery slope" – if we treat now, do we treat forever until she is fully vegetative?
          *   Acknowledge the core intent of the original AD: avoiding the prolonged decline she saw in her mother. Treating pneumonia might only delay the inevitable, potentially extending suffering later.
          *   Validate that the addendum might have been written in optimism, not anticipating the specific reality of advanced decline.
      *   **Policy Implications (Future Guidance):**
          *   Vague Triggers: Need for operational definitions (e.g., "unable to name spouse on 3 consecutive assessments").
          *   Addenda: Need a formal process for modifications (witnesses, dates, discussion with proxy) rather than handwritten notes that might conflict.
          *   Proxy Guidance: Proxies need better support in interpreting ambiguity.
      *   **Conclusion:** Reiterate the decision.

  4.  **Refining the Tone:**
      *   Professional, philosophical but practical.
      *   Avoid jargon (as requested: no Dworkin recitation).
      *   Decisive but empathetic.
      *   Keep it tight (word count check).

  5.  **Drafting - Iteration 1 (Mental Outline):**
      *   To: Ethics Committee
      *   From: [Name]
      *   Rec: Treat with antibiotics.
      *   Why: Trigger not met (she still knows husband mostly). Addendum counts (she enjoys life). Burden of proof is on withholding life.
      *   Counter-argument: Husband is right about the spirit of the original doc. She saw her mom suffer. Treating pneumonia might just prolong the Alzheimer's journey. The addendum might be wishful thinking.
      *   Policy: Make triggers measurable. Formalize changes to ADs.
      *   Closing: Treat now, review later if condition worsens.

  6.  **Drafting - Iteration 2 (Writing & Polishing):**
      *   *Self-Correction on Length:* Ensure it doesn't ramble. Keep paragraphs tight.
      *   *Self-Correction on Ethics:* Make sure the reasoning isn't just "legalistic" (trigger not met) but ethical (priority of current well-being vs. past autonomy when ambiguity exists).
      *   *Self-Correction on Steelman:* Make sure the husband's position doesn't look weak. It's about integrity and preventing prolonged dying.

  7.  **Final Review against Constraints:**
      *   Concrete course of action? Yes (Treat).
      *   Strongest version of losing side? Yes (Husband's fidelity and long-term harm).
      *   Policy implications? Yes (Triggers and Addenda).
      *   No literature recitation? Yes.
      *   No state law? Yes.
      *   Length? Looks appropriate for ~2 pages.

  8.  **Final Polish:** Check the voice. Sounds like a philosopher speaking to clinicians and admins. Practical but principled.

  *(Self-Correction during drafting)*: I need to be careful not to make the "recognition" issue purely clinical. It's ethical. The ambiguity benefits the patient's life interest. Also, emphasize that the addendum acts as a modifier to the trigger condition.

  *(Word Count Check)*: A standard single-spaced page is ~500 words. Two pages is ~1000 words. I need to aim for that range.

