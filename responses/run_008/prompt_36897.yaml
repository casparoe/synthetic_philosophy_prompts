answer: |-
  **TO:** Hospital Ethics Committee
  **FROM:** [Name], Philosophy Dept.
  **DATE:** October 26, 2023
  **SUBJECT:** Ethical Recommendation Regarding Patient Case # [Redacted]

  **Recommendation**
  The committee should recommend **administering antibiotics** to treat the patient's pneumonia.

  This recommendation is not based on a dismissal of the original advance directive (AD), but on the ethical weight of ambiguity in trigger conditions and the moral significance of the handwritten addendum. When an AD's refusal of life-sustaining treatment hinges on a condition that is not clearly met, and when a later expression of intent prioritizes current well-being, the presumption must favor preservation of life. We should treat the infection now while continuing to monitor her cognitive status.

  **Reasoning**
  Our decision rests on two pillars: the specificity of the refusal trigger and the temporal priority of the addendum.

  First, the original AD refuses treatment only *once she has reached the stage of no longer recognizing her family.* This is a factual trigger, not merely a value statement. Currently, that trigger is not definitively pulled. The clinical picture describes fluctuation, not loss. She recognizes her husband most days; the failures are intermittent. In cases where the condition for withholding life-sustaining treatment is ambiguous, the ethical burden of proof lies on those claiming the condition is met. To withhold treatment based on "evenings when she doesn't seem to place him" is to interpret ambiguity as consent to die. Given that the treatment (antibiotics) is low-burden and high-efficacy, erring on the side of life preserves the option to reassess later. If she recovers from pneumonia and subsequently loses recognition permanently, the directive's original terms may then apply to future infections.

  Second, the handwritten addendum modifies the moral landscape. Written three years after the original directive—closer to the onset of symptoms—it introduces a quality-of-life override: *"if she is still enjoying her days, we are not to give up on her."* This is not a contradiction so much as a refinement. It suggests that the patient anticipated the possibility of cognitive decline but wanted to ensure that enjoyment of life remained a veto power against the refusal of care. Clinically, she is enjoying her days (music, eating, contentment). To ignore the addendum is to privilege a document written 16 years ago (based on her mother's death) over a reflection written 13 years ago (based on her own unfolding reality). The later document represents a more informed autonomy.

  **The Case for Withholding Treatment**
  We must take the husband's position seriously. He is not merely being stubborn; he is acting as a guardian of his wife's long-term dignity. His argument relies on the integrity of the original promise and the trajectory of the disease.

  The strongest version of his view is that the original AD captures her *critical interests*—her deep values about what makes a life worth living—whereas the addendum captures only her *experiential interests*—how she feels in the moment. She witnessed her mother's decline and decided that a life without full recognition was not a life she wanted to sustain, regardless of momentary contentment. The husband fears that treating this pneumonia is not saving "her," but merely extending the duration of a disease process she explicitly rejected.

  Furthermore, there is a risk of slippery slope. If we treat this pneumonia based on fluctuating recognition and current happiness, do we treat the next infection when recognition is gone but contentment remains? The husband is rightly worried that we are redefining the threshold for "futile" or "unwanted" life based on caregiver convenience rather than the patient's prior committed values. He promised to see her through according to the original plan, and he views treating this infection as a betrayal of the woman she was when she was competent to decide what kind of death she wanted.

  **Policy Implications**
  This case highlights structural weaknesses in how we process advance directives. We will see this again. I recommend the committee propose the following protocols to Administration:

  1.  **Operationalize Vague Triggers:** We cannot ethically act on phrases like "no longer recognizing family" without clinical criteria. The hospital should work with legal counsel to develop standard operational definitions for common AD triggers. For example: "Unable to name spouse or children on three consecutive cognitive assessments over 48 hours." This removes the burden from surrogates to guess when a threshold is crossed.
  2.  **Formalize Addenda:** A handwritten note on an old document creates exactly this kind of conflict. We need a clear policy that while addenda are considered, they must be witnessed and dated to be weighed equally against notarized originals. More importantly, when an addendum conflicts with the original text, it should trigger a mandatory ethics consult *before* a crisis occurs, not during one.
  3.  **Proxy Support:** Surrogates (like the husband) often feel bound by "substituted judgment" to follow the document even when current circumstances suggest ambiguity. Our proxy support materials should emphasize that when a directive is ambiguous, the surrogate's role shifts toward "best interest" based on current status, rather than strict adherence to a potentially outdated script.

  **Conclusion**
  We should treat the patient. The condition for refusal is not clearly met, and the later expression of intent prioritizes her current well-being. However, we must acknowledge the husband's fidelity to his wife's long-term values. Treating this infection does not invalidate his concern; it simply acknowledges that we are not yet at the point she designated for letting go. We owe it to the patient to be certain before we withhold care. We are not certain yet.
