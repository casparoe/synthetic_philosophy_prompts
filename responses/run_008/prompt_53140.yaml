answer: |-
  Here is a complete lesson plan designed to simulate the **Slow-Switching Argument** (Boghossian) without lecturing. It prioritizes the *epistemic shock* (realizing you can't know your own meaning) over a perfect metaphysical replica of Putnam's Twin Earth.

  ### **Game Title:** The "Dax" Protocol
  **Philosophical Target:** Externalism about content & the threat to privileged self-knowledge.
  **Class Size:** 15 students.
  **Time:** 90 Minutes.

  ---

  ### **1. Materials & Setup**
  *   **Two Identical Opaque Containers:** (e.g., two identical coffee mugs, Tupperware, or paper bags). Label them both **"STANDARD"** in bold marker.
  *   **Two Distinct Objects:**
      *   *Object A:* A specific pen (e.g., a red Bic).
      *   *Object B:* A specific marker (e.g., a red Sharpie).
      *   *Note:* They must be distinct enough to be different categories, but similar enough that a quick glance doesn't scream "SWAP."
  *   **Printed Cards (15 copies):** See *Appendix* below.
  *   **Quiz Slips (15 copies):** Small half-sheets of paper.
  *   **A "Distraction" Handout:** A dense paragraph of text or a logic puzzle (to occupy them during the switch).
  *   **Room Layout:** Desks arranged in a semi-circle facing you. The "Standard" container sits on a table at the front, slightly to the side (not center stage).

  ---

  ### **2. The 90-Minute Timeline**

  #### **Phase 1: Induction (0:00 – 0:20)**
  *   **The Cover Story (Crucial):** Do not mention philosophy. Say: *"We are running a cognitive baseline assessment on semantic retention and attention. This data is for departmental review. Individual accuracy affects your participation grade. Absolute silence is required during testing phases to prevent data contamination."*
  *   **Distribution:** Hand out the **Cards** face down. Tell them not to flip until instructed.
  *   **The Anchor:** Point to **Container 1** (containing Object A/Pen). Say: *"On your count of three, flip your cards. You have 30 seconds to memorize the parameter. Do not discuss."*
  *   **The Card:** Reads: **"Target Term: DAX. Definition: Any object of the same type as the item currently inside the STANDARD container."**
  *   **Verification:** Ask: *"Thumbs up if you have memorized the parameter."* Collect the cards immediately. *"We need to ensure no notes are kept."* (This prevents them from re-reading the rule later).
  *   **Practice:** Hold up Object A (Pen). Ask: *"Is this a Dax?"* (Class: Yes). Hold up a completely different object (e.g., a stapler). *"Is this a Dax?"* (Class: No).
  *   **Lock-in:** Put Object A back in the container. Move the container to the side.

  #### **Phase 2: The Slow Switch (0:20 – 0:50)**
  *   **The Distraction:** Hand out the **Distraction Handout** (a logic puzzle or dense reading). Say: *"For the next 20 minutes, complete this task. It tests working memory load while retaining semantic parameters."*
  *   **The Switch:** While students are heads-down writing/reading:
      1.  Walk casually to the front table.
      2.  Pick up the **Standard Container**.
      3.  Turn your back to the class (as if placing it in a bag or behind a stack of books) or simply turn to write something on the board.
      4.  Swap **Container 1** for **Container 2** (which contains Object B/Marker).
      5.  Place **Container 2** in the exact same spot.
      6.  *Timing:* Do this roughly 10 minutes into the task, when focus is highest.
  *   **Maintenance:** If a student looks up, pause and ask, *"How is the puzzle coming?"* then resume. Do not act suspicious.

  #### **Phase 3: The Test (0:50 – 1:05)**
  *   **Retrieval:** Hand back the **Cards** (the same ones you collected, or identical replacements). Say: *"Refer to your parameter card."*
  *   **The Trap:** Take **Object B** (Marker) out of the *new* container. Hold it up.
  *   **Question 1:** *"Based on your current card and the object in front of you, is this a Dax?"*
      *   *Correct Answer (per current environment):* **Yes.**
  *   **Question 2:** *"Based on your memory of the first 20 minutes, was the object at the start a Dax?"*
      *   *Correct Answer (per memory):* **Yes.**
  *   **Question 3 (The Killer):** Hand out **Quiz Slips**. Ask them to write anonymously:
      1.  *Did the meaning of 'Dax' change during the session? (Yes/No)*
      2.  *Could you have noticed the change from the inside? (Yes/No)*
      3.  *Do you know what you meant by 'Dax' at the start of class? (Yes/No)*
  *   **Collection:** Collect slips immediately.

  #### **Phase 4: The Reveal & Debrief (1:05 – 1:30)**
  *   **The Reveal:** Place Container 1 and Container 2 side-by-side. Open them. Show the Pen vs. the Marker.
  *   **The Discussion:**
      *   Ask: *"Who voted 'No' on Question 1 (Did meaning change)?"* (Most will).
      *   Ask: *"Who voted 'Yes' on Question 3 (Do you know what you meant)?"* (Most will).
      *   **The Pivot:** *"You felt continuous. You felt you knew what you meant. But the environment fixed the meaning, the environment changed, and you didn't notice. Therefore, your internal feeling of 'knowing what you mean' was disconnected from the actual meaning."*
      *   Introduce **Externalism**: Meaning ain't in the head.
      *   Introduce **Slow-Switching**: If meaning is external, and environments can switch quietly, self-knowledge is threatened.

  ---

  ### **3. Scoring Scheme (No Money)**
  Use **"Epistemic Confidence Points"** on the whiteboard.
  *   **Team Score:** The class starts with **100 Points**.
  *   **Penalty:** Every time a student speaks out of turn during Phase 1 or 2, deduct **5 Points**. (Peer pressure enforces silence better than you can).
  *   **Bonus:** If >80% of the class falls for the trap (answers "No" to "Did meaning change?"), add **20 Points**.
  *   **Reward:** If the class ends with >100 Points, everyone gets a "Homework Pass" (skip one short reading response) or you bring donuts next time.
  *   **Why this works:** It gamifies the *silence* (necessary for the switch) and rewards the *philosophical confusion* (which proves the point).

  ---

  ### **4. Predictable Failures & Fixes**

  | **Failure Mode** | **Why it happens** | **The Fix** |
  | :--- | :--- | :--- |
  | **The "What's on your card?" Leak** | Students naturally compare notes. | **The "Data Contamination" Threat.** Tell them explicitly: *"If two cards are found to have been compared, both students receive zero participation credit for the day."* Make it high stakes. |
  | **The Visual Swap Notice** | A student watches you swap the cups. | **Misdirection.** Do the swap while erasing the board or while handing back the distraction sheets. Keep the containers opaque. If caught, **own it**: *"Good observation. But imagine you didn't see that. That's the philosophical thought experiment."* |
  | **The "It's Just Ambiguity" Objection** | Students argue "Dax" just became ambiguous, not externalist. | **Save this for Debrief.** Acknowledge it. The game simulates the *epistemic* situation (not knowing), even if the *metaphysics* (cards vs. world) are simplified. |
  | **Boredom during Phase 2** | 30 mins is long for a logic puzzle. | **Shorten Phase 2.** 15 minutes is enough. Use the extra time for Debrief. The switch only needs to be "distant enough" to feel like past memory. |

  ---

  ### **5. Honest Limitations (For Your Debrief)**
  You suspected gaps in the simulation. You are right. Here is how to handle them in the final 20 minutes without undermining the game:

  **1. Stipulation vs. Causal History (The Big One)**
  *   **The Gap:** In the game, meaning was fixed by a *card* (a description/rule). In Putnam/Burge, meaning is fixed by *causal history* (physical interaction with water/social usage).
  *   **The Assert:** Tell them: *"The game used cards for logistics. But imagine the 'card' was actually the physical water itself. You interacted with Water A, then moved to a world with Water B. Your brain state was identical, but the physical anchor changed. The game simulates the **ignorance**, not the **mechanism**."*

  **2. Time Scale**
  *   **The Gap:** The switch took minutes. Slow-switching arguments rely on years (forgetting the switch).
  *   **The Assert:** *"Time matters for memory decay. In the game, you might suspect a switch. In real life, if the switch happened years ago, you wouldn't just suspect it; you'd have no evidence of it at all. The game compresses the timeline to fit a seminar."*

  **3. The "Experiment" Effect**
  *   **The Gap:** Students know they are in a philosophy class. They are *looking* for tricks.
  *   **The Assert:** *"You were suspicious because this is a class. In real life, you aren't looking for Twin Earth. That's why the argument is scary—it applies when you *aren't* testing yourself."*

  **4. Self-Knowledge Scope**
  *   **The Gap:** The game threatens knowledge of *word meaning*. Boghossian's argument threatens knowledge of *thought content* (e.g., "I know I am thinking about water").
  *   **The Assert:** *"If you don't know what your words mean, do you know what you're thinking? If 'Dax' meant Pen then and Marker now, did you have the same thought? Externalism says no."*

