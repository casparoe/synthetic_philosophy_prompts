  ### **Instructor Cheat Sheet (The Switch)**
  1.  **Prep:** Container A (Pen) is on the table. Container B (Marker) is hidden in your bag/under the podium.
  2.  **Moment:** 20 minutes in. Students are writing.
  3.  **Action:** Walk to table. Pick up Container A. Turn to put it in your bag. *Pocket Container B.* Place Container B on table.
  4.  **Cover:** *"I'm just clearing some space for the quiz slips."*
  5.  **Poker Face:** Do not look at the container after the swap. Treat it as furniture.
