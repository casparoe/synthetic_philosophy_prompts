          *   *Reductionist Response:* Bite the bullet? Or argue that kids have proto-inductive capacities? Or shift the burden to the *community* (social reductionism)?
          *   *Verdict:* Serious. Biting the bullet implies kids don't *know* things, which is counterintuitive. But "justification" might be externalist here.

      *   **3. Expert Testimony (Outrunning Evidence):**
          *   *Issue:* I believe the physicist about quarks. I can't check the math. My evidence for their reliability is testimonial (others say they are good).
