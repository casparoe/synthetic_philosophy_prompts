          *   *Reductionist Response:* Local Reductionism (Fricker) vs. Global Reductionism (Hume). Most modern reductionists go Local. They argue we have *some* perceptual access to the world to check testimony.
          *   *Circularity Type:* Is it vicious? Epistemological circularity (using perception to justify perception) is often accepted as unavoidable (Alston). Does testimony get the same pass?
