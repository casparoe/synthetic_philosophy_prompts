      *   *Did I address the "Circularity" properly?* Need to mention that *all* epistemology is circular in some sense (The Problem of the Criterion). The question is whether testimonial circularity is *more* vicious than perceptual circularity.
      *   *The "Clean Case":* I need to be careful. If I say "No such case exists," I'm siding with Reductionism. If I say "Here is one," I'm siding with Anti-Reductionism. I should present the *claim* of the Anti-Reductionist and the Reductionist's rebuttal regarding semantic grounding.

