answer: |-
  # Revealed Preference Validity Audit (RPVA)
  **Version:** 1.0 (Internal Draft)  
  **Audience:** Analyst Team & Senior Economics Office  
  **Purpose:** To operationalize the "Purchase as Proof" argument in industry submissions, separating valid revealed preference evidence from rhetorical cover for market failure.

  ## I. Protocol Overview & Failure Modes
  This procedure treats "choice" as data, not verdict. It acknowledges two registers of argumentation. Analysts must tag every finding with the appropriate register.

  *   **[ECON-SETTLED]:** Claims grounded in standard microeconomic theory (e.g., budget constraints, ordinal utility, switching costs). Disagreement here indicates an error in analysis.
  *   **[WELFARE-CONTESTED]:** Claims grounded in normative welfare economics or philosophy (e.g., adaptive preferences, definition of harm, paternalism). Disagreement here indicates a policy choice, not an analytical error.

  **Known Failure Modes:**
  1.  **The Libertarian Drift:** The procedure may certify a market as "beneficial" simply because preferences are consistent, even if those preferences are adapted to oppression or desperation (Sen's Critique). *Mitigation: Step 3.*
  2.  **The Paternalist Drift:** The procedure may reject a market because the analyst believes the consumer *should* value money over peace of mind, overriding stated utility. *Mitigation: Step 4.*

  ---

  ## II. The Audit Procedure

  ### Step 1: The Budget Set Test (Samuelson's Condition)
  **Question:** At the moment of purchase, did the consumer face a non-empty set of affordable alternatives, including the option to purchase nothing?
  *   **Data Required:** Market share data of competitors, existence of functional substitutes, evidence of "take-it-or-leave-it" bundling.
  *   **Sufficient Answer for "Pass":** Evidence that $\ge$2 viable competitors existed *and* the consumer had the liquidity to choose the cheaper option or opt out.
  *   **Exit Condition:** If **NO** (Monopoly/Coercion), exit with **Finding: Industry Claim Invalid.** Choice reveals nothing about preference ranking, only constraint acceptance.
  *   **[ECON-SETTLED]:** Revealed preference requires a choice. Acceptance under duress is not preference.

  ### Step 2: The Inertia & Friction Test (Renewal Validity)
  **Question:** Is the transaction a fresh purchase or a renewal/continuation? If renewal, what are the switching costs?
  *   **Data Required:** Cancellation flow friction (clicks/calls required), price change magnitude at renewal, churn rates compared to industry baseline.
  *   **Sufficient Answer for "Pass":**
      *   *Fresh Purchase:* No additional check needed.
      *   *Renewal:* Evidence that cancellation costs (time/effort) are $< 5\%$ of the transaction value *or* evidence of active re-engagement (login/use) post-renewal.
  *   **Exit Condition:** If **Renewal** AND **High Friction** AND **Low Engagement**, exit with **Finding: Industry Claim Invalid.** Inertia is not preference.
  *   **[ECON-SETTLED]:** Status quo bias confounds revealed preference. High switching costs decouple choice from valuation.

  ### Step 3: The Constraint & Desperation Test (Sen's Condition)
  **Question:** Is the choice made within a "cluster of capabilities" that allows for genuine agency, or is it a selection among catastrophic failures?
  *   **Data Required:** Consumer survey data on *why* the option was chosen (e.g., "best feature" vs. "only option"), demographic data on financial distress, availability of public/safety-net alternatives.
  *   **Sufficient Answer for "Pass":** Evidence that the consumer selected the product for positive attributes (features, speed, convenience) rather than negative attributes of alternatives (avoiding eviction, avoiding utility shut-off).
  *   **Exit Condition:** If evidence suggests the choice is the "least bad" among catastrophic options, flag as **[WELFARE-CONTESTED]**. Do not exit. Proceed to Step 4 with a **Warning Label: "Revealed Preference Valid, Welfare Inference Blocked."**
  *   **[WELFARE-CONTESTED]:** A choice among bad options reveals a ranking of harms, not necessarily a net benefit. Intervention here risks removing the "least bad" option.

  ### Step 4: The Welfare Bridge (Preference vs. Benefit)
  **Question:** Does the industry submission equate "willingness to pay" with "well-being," and is that equation defensible given information symmetry?
  *   **Data Required:** Disclosure clarity (APR, actuarial value, coverage exclusions), evidence of cognitive bias exploitation (dark patterns, urgency timers), post-purchase regret/complaint rates.
  *   **Sufficient Answer for "Pass":** Evidence that consumers understood the key terms (EV, APR, Renewal Date) *and* still purchased. OR, evidence that the product provides non-financial utility (e.g., anxiety reduction) that outweighs financial loss *and* consumers know this trade-off.
  *   **Exit Condition:**
      *   If **Information Asymmetry** is proven: Exit with **Finding: Industry Claim Invalid.** (Preference is based on error).
      *   If **Information is Symmetric** but **Financial EV is Negative**: Proceed to **Finding: Industry Claim Provisionally Valid.** (See Note below).
  *   **[ECON-SETTLED]:** Demand does not imply surplus if information is flawed.
  *   **[WELFARE-CONTESTED]:** If information is symmetric, does a negative expected financial value imply harm? (e.g., Is paying for risk mitigation "harmful" even if it costs more than the expected loss?)

  ### Step 5: The Counterfactual Proxy (When Observation Fails)
  **Question:** We cannot observe the world where this product is banned. What is the best proxy?
  *   **Data Required:** Data from jurisdictions where the product is restricted, or data on consumers who were denied the product.
  *   **Action:** If Step 3 flagged "Desperation," you must estimate the harm of the *next best alternative*.
  *   **[WELFARE-CONTESTED]:** This step requires valuing outcomes (e.g., is a loan shark better than a broken leg?). Economics cannot solve this; policy must.

  ---

  ## III. Case Applications

  ### Case 1: Extended Warranties (Electronics)
  **Submission:** Consumers repurchase warranties across multiple product lifecycles. They value the risk mitigation.
  **Analyst Instinct:** Interventionist. Actuarial value is negative (-40% on average). It's a tax on ignorance.

  **RPVA Run:**
  1.  **Budget Set:** **Pass.** Consumers can decline the warranty at checkout. [ECON-SETTLED]
  2.  **Inertia:** **Pass.** These are fresh purchases at point of sale, not renewals. [ECON-SETTLED]
  3.  **Constraint:** **Pass.** No evidence of desperation; these are discretionary durable goods. [ECON-SETTLED]
  4.  **Welfare Bridge:** **Mixed.**
      *   *Fact:* Expected financial value is negative.
      *   *Fact:* Consumers report high anxiety about repair costs.
      *   *Analysis:* If consumers know the EV is negative but buy anyway, they are purchasing *certainty*, not *value*. Risk aversion is a rational preference.
      *   *Crucial Check:* Do they know the EV? Industry data shows disclosures are present but complex.
      *   *Decision:* If disclosures are legible, the negative EV is the *price* of the insurance, not proof of harm.
  5.  **Counterfactual:** Without warranties, consumers bear full risk. Some will face catastrophic repair bills relative to income.

  **Finding:** **Industry Claim Provisionally Valid.**
  **Reasoning:** While the financial expected value is negative, insurance *always* has negative expected value for the buyer (otherwise the insurer fails). If the consumer is risk-averse and informed, the purchase increases utility despite reducing expected wealth.
  **[WELFARE-CONTESTED] Flag:** This finding challenges the instinct that "negative EV = scam." It asserts that paying for peace of mind is a valid welfare benefit. Intervention is only justified if disclosures are misleading (information failure), not because the product is a bad financial bet.
  **Against Instinct:** This clears the product for market continuation provided disclosure standards are met, despite the "rip-off" financial math.

  ### Case 2: Auto-Renewing Subscriptions ("Zombie" Services)
  **Submission:** Users renew annually. They continue to value the service at the price point.
  **Analyst Instinct:** Interventionist. Users forget to cancel.

  **RPVA Run:**
  1.  **Budget Set:** **Pass.** Alternatives exist. [ECON-SETTLED]
  2.  **Inertia:** **Fail.**
      *   *Data:* 85% of renewing users have 0 logins in the prior 90 days.
      *   *Data:* Cancellation requires a phone call during business hours (high friction).
      *   *Analysis:* The cost to switch (time/hassle) exceeds the subscription price for many users. The choice reveals a preference for *avoiding hassle*, not a preference for the *product*.
  3.  **Constraint:** **N/A.** (Failed at Step 2).
  4.  **Welfare Bridge:** **Fail.** The "preference" revealed is for the status quo, not the service.

  **Finding:** **Industry Claim Invalid.**
  **Reasoning:** High switching costs decouple renewal from valuation. The revenue is derived from friction, not utility.
  **[ECON-SETTLED] Flag:** This is a standard market failure (switching costs). No normative ambiguity here.
  **Alignment:** Matches interventionist instinct.

  ### Case 3: Short-Term High-APR Credit (Payday/Installment)
  **Submission:** Repeat borrowers affirm in surveys they understand the APR and would borrow again. They prefer this to the alternative.
  **Analyst Instinct:** Interventionist. Debt traps. Predatory.

  **RPVA Run:**
  1.  **Budget Set:** **Fail/Contested.**
      *   *Data:* Borrowers often have no access to credit cards or bank loans.
      *   *Analysis:* The "choice" is between this loan or defaulting on rent/utilities.
  2.  **Inertia:** **N/A.** Fresh loans, but repeat borrowing indicates ongoing need.
  3.  **Constraint:** **Flagged.**
      *   *Data:* Surveys indicate 60% borrow to cover basic necessities, not discretionary shocks.
      *   *Analysis:* This triggers Sen's Critique. The preference is for "survival," not the loan terms.
  4.  **Welfare Bridge:** **Blocked.**
      *   *Industry Arg:* They prefer this to eviction.
      *   *Analyst Arg:* They shouldn't face eviction.
      *   *Procedure:* We cannot certify "Benefit" here because the counterfactual (no loan) involves severe harm.
  5.  **Counterfactual Proxy:**
      *   *Scenario A (Ban Loan):* Borrowers move to unregulated offshore lenders or face utility shut-off.
      *   *Scenario B (Allow Loan):* Borrowers stay in debt cycle but keep utilities on.

  **Finding:** **Evidence Insufficient to Certify Benefit.**
  **Reasoning:** The revealed preference is valid (they choose the loan), but the inference to *welfare* is blocked by the constrained environment. The industry claims "benefit" based on "preference," but the procedure identifies the preference as adaptive to a failure of the safety net.
  **[WELFARE-CONTESTED] Flag:** The procedure does *not* recommend a ban. It recommends recognizing that the "harm" may lie in the lack of alternatives, not the loan itself. Banning the loan without providing the alternative (Step 5) may reduce welfare.
  **Alignment:** Nuanced. It validates the borrower's choice (against the "they don't understand" argument) but invalidates the industry's "therefore it's good" argument (against the "it's a free market" argument).

  ---

  ## IV. Implementation Notes for the Senior Economist

  **On the "Against Instinct" Finding (Case 1):**
  You will note that Case 1 (Warranties) clears the industry hurdle despite negative expected value. This is intentional. If we regulate based on financial EV alone, we implicitly ban insurance and risk-mitigation products for risk-averse agents. The procedure forces us to prove *deception* (Step 4), not just *bad math*. If the team cannot prove consumers are unaware of the odds, regulating the product is paternalistic in the [WELFARE-CONTESTED] sense—telling consumers they value money more than certainty.

  **On the "Constraint" Failure Mode (Case 3):**
  In Case 3, the procedure refuses to sign off on "Benefit." This protects the agency from endorsing predatory lending. However, Step 5 explicitly warns that removing the product without fixing the constraint (Step 3) is dangerous. This insulates the economist from the claim that "regulation helps the poor" if the regulation actually cuts off their only lifeline.

  **On Counterfactuals:**
  Where we cannot observe the counterfactual (Step 5), the procedure defaults to **"Evidence Insufficient."** This places the burden of proof on the industry to demonstrate that their product is not merely the "least bad" option in a broken market. If they cannot prove the market isn't broken, we do not certify the benefit. This is the safest legal defensibility.

  **Final Directive:**
  Use the **[ECON-SETTLED]** tags to shut down arguments that violate basic micro (e.g., "Renewal = Satisfaction" when switching costs are high). Use the **[WELFARE-CONTESTED]** tags to isolate policy fights. When a submission rests entirely on a [WELFARE-CONTESTED] claim (e.g., "They chose it, so it makes them happy"), return it to the submitter as analytically incomplete. We regulate market failures, not philosophical disagreements, unless the statute explicitly mandates a specific welfare definition.
