answer: |-
  Here is a diagnostic of your position. You are attempting to hold a **Hybrid Traditionalist** view: you want the practical conclusions of Traditionalism (Moral Equality of Combatants, immunity for civilians, no post-war punishment) but you want to ground them with some of the moral nuance of Revisionism (differential responsibility, civilian culpability).

  This is a stable position *only if* you stop trying to ground liability in "threat" and start grounding it in "status." As it stands, your commitment to the **Threat Account (2)** is actively sabotaging your other commitments.

  Here is the ranking of tensions by severity, followed by the specific repair strategy.

  ### 1. Ranked Tensions by Severity

  **Severity 1: The Theoretical Collapse (2) vs. (6)**
  *   **The Conflict:** Claim (2) states liability tracks *posing a threat*. Claim (6) grants immunity to a soldier posing no immediate threat (bathing) and liability to a soldier posing no *active* threat (uniformed on a road).
  *   **Why it's fatal:** (6) is a robust intuition you hold, but it empirically contradicts (2). A bathing soldier is physically capable of killing (you have a gun nearby), yet you deem him immune. A soldier on a road might be miles from the front, yet you deem him liable. Your practice (6) relies on **status**, but your theory (2) relies on **causality/threat**.
  *   **What must give:** You must abandon the strict "Threat" formulation in (2).
  *   **Cost:** You lose the clean, reductionist explanation for why civilians are immune. You must admit that "being a combatant" is a normative status, not just a description of dangerousness.

  **Severity 2: The Moral Contradiction (1) vs. (4)**
  *   **The Conflict:** Claim (1) says the unjust combatant "does nothing wrong." Claim (4) says the volunteer soldier is "more responsible" for the unjust war.
  *   **Why it's fatal:** In moral philosophy, responsibility for a bad outcome (unjust war) typically implies blameworthiness. If the volunteer is *more responsible* for the injustice than the conscript, it is incoherent to say he "does nothing wrong" by participating in it. You are trying to say he is culpable (4) but blameless (1).
  *   **What must give:** You must qualify (1). You cannot maintain that the act is *objectively* permissible without qualification.
  *   **Cost:** You concede a piece of ground to the Revisionist. You must admit the act is *objectively* wrongful but *subjectively* excused, or that the "wrong" attaches to *joining* rather than *fighting*.

  **Severity 3: The Friend's Attack (2) vs. (3)**
  *   **The Conflict:** Claim (2) says civilians are immune because they don't pose threats. Claim (3) says civilians (voters, workers) bear responsibility and aren't "innocent."
  *   **Why it's problematic:** If liability tracks threat (2), and munitions workers causally contribute to death more than soldiers, why are they immune? If they aren't innocent (3), why are they protected? Your friend argues that once you admit (3), you cannot hold (2) without arbitrariness.
  *   **What must give:** The link between "innocence" and "immunity."
  *   **Cost:** You must decouple moral innocence from liability to attack.

  ---

  ### 2. The Single Change That Cleans Up the Most

  **Replace the "Threat Account" in (2) with a "Status/Role Account."**

  Change (2) from: *"What makes combatants permissible targets is that they pose threats..."*
  To: *"What makes combatants permissible targets is that they have assumed the **status** of combatant within a recognized convention of war."*

  **Why this fixes the bundle:**
  1.  **Resolves (2) vs. (6):** A soldier bathing is temporarily non-functional within his status (hors de combat). A soldier on the road is "on duty" within his status. This explains the immunity/liability switch without needing to measure immediate physical threat levels.
  2.  **Resolves (2) vs. (3):** Civilians (munitions workers, voters) may bear *responsibility* (satisfying 3), but they lack the *combatant status* (satisfying 2). They are immune not because they are "innocent" in a moral sense, but because they are outside the "license to kill" convention that applies only to uniformed combatants. This defuses your friend's attack immediately.
  3.  **Supports (1):** If liability is based on status, then the *justice of the cause* becomes irrelevant to the *permission to fight*. Two people with the same status have equal permissions. This preserves your Traditionalist core.

  ---

  ### 3. Which Apparent Conflicts Evaporate with Distinctions?

  Once you adopt the **Status Account** above, two major tensions evaporate if you draw the distinction between **Liability to Attack** and **Moral Blame**.

  *   **The (4) vs. (5) Conflict:** You worry that if volunteers are more responsible (4), they should be punished (contradicting 5).
      *   *The Distinction:* Distinguish **Political/Moral Responsibility** from **Legal Liability**. A volunteer may be morally blameworthy for *joining* an unjust fight (4), but because they fought within the rules of the convention (Status), they are not liable to *punishment* (5). Punishment is reserved for violations of the convention (war crimes), not for participation in the war itself.
  *   **The (2) vs. (3) Conflict:** Your friend thinks admitting civilian responsibility (3) forces you to admit they are liable to attack.
      *   *The Distinction:* Distinguish **Causal Contribution** from **Combatant Function**. Civilians can be causally responsible (3) without assuming the function that makes one liable to lethal force (2). You can consistently say: "The munitions worker is morally complicit, but attacking her violates the convention that protects the non-combatant sphere."

  ---

  ### 4. The Blunt Diagnostic: Which Commitment is Doing the Least Work?

  **Claim (2) is the weak link.**

  It is the only claim that is empirically contradicted by your other intuitions (specifically 6). It is also the claim that gives your friend the most ammunition. You are trying to use a Revisionist-style justification (threat/liability) to support a Traditionalist conclusion (equality of combatants). This is why the structure is groaning.

  **Claim (1) is the most valuable.**
  It is the core of the position you want to defend. Do not sacrifice (1) unless absolutely necessary. By fixing (2), you save (1).

  **Claim (4) is the most dangerous.**
  It is a Revisionist intuition smuggled into a Traditionalist framework. If you keep (4), you must be very careful to frame that "responsibility" as **responsibility for entering the status**, not responsibility for the killings themselves. If you frame it as responsibility for the killings, you collapse back into Revisionism and lose (1).

  ### Summary of Recommended Revision

  1.  **Keep (1), (5), (6).** These are your core Traditionalist conclusions.
  2.  **Modify (2).** Shift from "Threat" to "Status/Convention." This saves (6) and blocks your friend's attack on (3).
  3.  **Clarify (4).** Specify that volunteers are more responsible for *enlisting*, not necessarily for every act of killing. This prevents (4) from contradicting (1).
  4.  **Clarify (3).** Specify that civilian "responsibility" is political/moral, not military liability.

  If you make these moves, you retain the Traditionalist shield (combatants are equal, civilians are immune) without having to pretend that moral responsibility doesn't exist. You stop arguing that civilians are "innocent" (which is hard to defend) and start arguing they are "protected by convention" (which is easier to defend).
