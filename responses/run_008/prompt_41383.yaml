answer: |-
  **Setting:** *A conference room at the Department of Treasury. A draft regulation lies on the table between DR. ARIS THORNE (Epistemicist) and DR. LENA CLARKE (Supervaluationist). Both are senior advisors on the Regulatory Clarity Committee.*

  **Thorne:** (Tapping the draft) We need to finalize Section 4(b). The exemption applies to "small businesses." I propose we define that as firms with fewer than fifty full-time employees. It's clean, it's administrable, and it aligns with the SBA's historical data.

  **Clarke:** It's clean, Aris, but it's semantically dishonest. Look at the Sorites problem hanging over this. If a firm with forty-nine employees is small, and hiring one person doesn't fundamentally alter the nature of a business, then a firm with fifty is also small. By your logic, so is fifty-one, fifty-two, and eventually General Electric.

  **Thorne:** That's the classic paradox, Lena, but it relies on the premise that "small" is inherently resistant to sharp boundaries. I reject that. There *is* a fact of the matter. At some specific point in the growth continuum, a business ceases to be small. The transition is sharp, even if our epistemic access to that exact threshold is imperfect. We are ignorant of the boundary, not the existence of the boundary.

  **Clarke:** But that ignorance isn't just a lack of data. It's because the predicate "small" is vague. There isn't one hidden number waiting to be discovered. There are many admissible ways to make "small" precise. On some precisifications, fifty counts as small. On others, it doesn't. But on *none* of the admissible precisifications is it determinately true that fifty is the exact cutoff while forty-nine is not. By writing "fewer than fifty" into the statute, you aren't discovering a boundary; you're pretending a gap doesn't exist.

  **Thorne:** I'm not pretending. I'm legislating. The law requires binary outcomes. You either get the tax exemption or you don't. If we acknowledge your "gap," as you call it, we paralyze the administration. A tax auditor cannot tell a filer, "Well, on some admissible precisifications you qualify, so come back next week." We need a sharp cutoff to ensure compliance. The epistemic fact exists; the law simply codifies our best estimate of it.

  **Clarke:** And that's where the injustice creeps in. If you set a hard cutoff at fifty, you create a "cliff edge." A firm with fifty employees is treated as determinately *not* small. But according to supervaluationism, the statement "A firm with fifty employees is not small" is not true. It's false, because there are admissible precisifications where fifty *is* small. By enforcing the cutoff, you are treating a borderline case as if it were a negative case. You're forcing a false precision that will invite litigation.

  **Thorne:** Litigation comes from ambiguity, Lena. If we leave it vague, every firm from forty to sixty employees will sue, claiming they fit the ordinary meaning of "small." A sharp line stops that. It forces the semantic vagueness to resolve into legal certainty.

  **Clarke:** I'm not suggesting we leave the text vague. I'm suggesting we draft for *supertruth*. We should write the regulation so that it remains true under every admissible precisification of "small."

  **Thorne:** That would be impossible for a binary exemption. If you mean we only exempt firms that are *determinately* small—say, fewer than thirty employees—then you're excluding firms that are arguably small but borderline. You're shrinking the exemption's scope to avoid the boundary.

  **Clarke:** Or, we acknowledge the borderline zone. We draft a discretionary clause. "Firms with fewer than forty employees qualify. Firms with more than sixty do not. Firms between forty and sixty are subject to administrative review based on capitalization and market share." This allows the administrator to handle the truth-value gaps without pretending they don't exist.

  **Thorne:** That delegates legislative authority to bureaucrats. It violates the non-delegation doctrine. Besides, your view implies that the boundary is *created* by the decision. I hold that the boundary is *discovered*. If a firm has fifty employees, they are either small or they aren't. The administrator's job is to find out which. If we give them discretion, they aren't finding the fact; they're choosing arbitrarily.

  **Clarke:** But if the epistemic fact is unknowable, Aris, how can they find it? You admit we don't know where the sharp cut-off is. So, if an administrator denies a fifty-employee firm, they aren't "discovering" that the firm is big. They are *making* it big for the purpose of the tax code. My discretionary zone just makes that creative act transparent. Your sharp cutoff hides the creative act behind a veil of false objectivity.

  **Thorne:** It's not false objectivity. It's legal stipulation. Once we pass this regulation, "small business" *means* "fewer than fifty employees." The vagueness is extinguished by the enactment. The Sorites paradox applies to natural language, not to defined legal terms.

  **Clarke:** But the statute uses the natural language term "small business" as the header, then defines it. When a court reviews a challenge from a firm with fifty-one employees, they aren't just looking at the definition. They're looking at whether the definition captures the intent of the exemption. If the intent was to help "small" firms, and fifty-one is borderline... what is the judge doing in that courtroom?

  **Thorne:** The judge is interpreting the statute to determine if the firm falls on the correct side of the line we drew. They are discovering whether the firm meets the statutory condition. The boundary was there the moment we signed the regulation.

  **Clarke:** I disagree. In a borderline case, where the firm is neither determinately small nor determinately not, the judge cannot discover a boundary that wasn't there. The statute created a gap, not a line. So, when the judge rules on the fifty-one employee firm, they are not finding a pre-existing fact of the matter. They are exercising judgment to *create* a boundary for that specific context. They are precisifying the concept where the law left it open.

  **Thorne:** If you say the judge is creating the boundary, you make the law unpredictable. It means the status of the firm depends on the judge's whim, not on the firm's actual characteristics.

  **Clarke:** And if you say the judge is discovering the boundary, you pretend there's a metaphysical fact about "smallness" that the judge can access, when really they're just making a policy choice. At least my view admits that in the penumbra of vagueness, the law runs out, and human decision must take over.

  **Thorne:** (Pauses, looking at the draft) So, on your view, a ruling against the fifty-one employee firm doesn't mean they weren't small. It just means the court decided to exclude them.

  **Clarke:** Exactly. It means the court resolved the indeterminacy. It doesn't mean the firm was determinately "not small" prior to the ruling.

  **Thorne:** And on my view, the ruling confirms they were never eligible. The fact was fixed; we just confirmed it.

  **Clarke:** But Aris, if the fact was fixed, why do we need a committee? Why not just measure the "smallness" directly?

  **Thorne:** Because "smallness" supervenes on headcount, revenue, and market impact. We use headcount as a proxy for the hidden fact.

  **Clarke:** A proxy that breaks at the edges. Look, I can't sign off on a hard cutoff at fifty. It treats a semantic gap as a hard wall. I propose we set the safe harbor at forty, the exclusion at sixty, and a review board for the middle. It respects the supervaluationist truth: that for the middle group, there is no truth value until a decision is made.

  **Thorne:** And I maintain that the review board is an abdication of duty. But... (He sighs) if we do the review board, we must ensure they are instructed to find the *economic reality* of the firm, not just negotiate. If they are creating the boundary, they need guidelines. If they are discovering it, they need data.

  **Clarke:** Then we agree on the mechanism, even if we disagree on what the mechanism is doing. The board decides the borderline cases. You think they are uncovering the status; I think they are assigning it.

  **Thorne:** As long as the tax forms come out the same way, I can live with that metaphysical disagreement. But I'm keeping the text "fewer than fifty" as the presumptive standard.

  **Clarke:** Only if we add "unless subject to administrative review."

  **Thorne:** Fine. But I'm writing the dissent on the philosophical justification.

  **Clarke:** (Smiling) I'd expect nothing less. Just make sure your dissent doesn't imply you know where the hidden line is.

  **Thorne:** I don't know where it is, Lena. I just know it's there.

  **Clarke:** And I know that if it's there, we can't see it. So we'd better build a bridge over the gap.
