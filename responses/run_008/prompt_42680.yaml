  so I'm a software engineer with zero philosophy background, but I've gone pretty far down the computability rabbit hole (reading wikipedia at 1am etc) and I've ended up with a bunch of views that I suspect don't all fit together. audit them for me? here's the set:

  1. The Church-Turing thesis is true: whatever is "effectively computable" is computable by a Turing machine.
  2. The thesis isn't a math theorem, it's a claim about physics — it's empirical, the kind of thing that could be confirmed or refuted by what we learn about how the universe actually works.
  3. Hypercomputation is at least logically possible, and I wouldn't even be shocked if some exotic physical setup (weird spacetime geometry, analog signals with infinite precision, that kind of thing) could compute something no Turing machine can.
  4. When Turing and Church originally talked about effective computation, they basically meant what a human with pencil, paper, and unlimited time could do — a finite procedure, no flashes of insight required mid-computation.
  5. The brain is just a physical system, no magic there, so whatever humans can compute is computable, full stop. I don't buy the Penrose stuff about quantum whatever in microtubules.
  6. Strong AI is possible — a big enough computer running the right program could do everything a human mind does, because minds are software-ish.
  7. The halting problem is undecidable, period. not "no Turing machine can decide it," just undecidable, that's just how it is.

  My buddy says 2 and 3 flat-out contradict 1, but when I try to spell it out myself I get confused about whether the clash is real or just sloppiness about what "effective" means — like if 4 is the right reading of the thesis, can physics even touch it at all? And I have a nagging feeling 6 is somehow entangled with which side I take there, and also with 5, but I can't articulate how. And 7 I'm honestly not sure how to fit in with 3 at all.

  So: go through the whole list, tell me which pairs actually clash and how badly, which ones only look like they clash and dissolve once you're careful with definitions, and then rank the real tensions by severity. At the end, tell me the single cheapest thing to give up — one revision that cleans up the most mess. Don't be diplomatic about it, I'd rather know what has to go.
