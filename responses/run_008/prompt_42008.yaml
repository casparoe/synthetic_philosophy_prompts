          *   *Concede:* You aren't solving Hard Incompatibilism. You are offering a Compatibilist account. Own that.
      *   **Evaluation of the Fallback:** Is it unfalsifiable? Yes, potentially. It shifts the goalposts from metaphysics to phenomenology/pragmatics.

  5.  **Refining the Tone:**
