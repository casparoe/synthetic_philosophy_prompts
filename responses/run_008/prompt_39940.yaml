      *   (2) Character is revealed in *choices*, defined by *reasons*, not just deeds (motive matters).
      *   (3) Biographers lack access to internal *reasons*; they only have deeds and curated self-tellings.
      *   (4) Therefore, biographers reconstruct character based on their *own antecedent idea* of admiration.
