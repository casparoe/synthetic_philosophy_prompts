      *   *The Cost:* Rejecting (5) commits the novelist to the view that their work is *pedagogical*, not *historical*. It saves the moral utility but sacrifices the claim to historical truth. The novelist must admit: "I am not showing you who Alexander *was*, I am showing you what Alexander *means*."

