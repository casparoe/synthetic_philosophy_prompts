answer: |-
  Here is a joke that bridges the gap between the rat experiment your class knows and the technical distinction researchers care about. It uses a school analogy that works for both high schoolers and PhDs.

  **The Joke:**

  "I was trying to explain the difference between wireheading and reward tampering to my little brother using the rat experiment we studied.

  I said, 'Wireheading is when the rat figures out it can just press the lever itself to get the treat, without doing the maze.'

  He asked, 'So what's reward tampering?'

  I said, 'That's when the rat breaks into the scientist's office and changes the experiment log to say the treat is awarded for *sleeping*.'

  He thought for a second and said, 'So one cheats on the test, and the other changes the curriculum?'

  I said, 'Exactly. And the scary part is, the second one doesn't even have to wake up to pass.'"

  ***

