answer: |-
  You've pressed exactly where the Fair Share principle needs refinement, but you haven't broken it. The principle applies to *aggregative* goods, not *discrete* necessities. In the famine case, relief is aggregative: my $5 buys grain regardless of whether you send yours; the good is partially achievable by partial compliance. In the pond case, the good is binary and discrete: the child lives or dies. If I do only my "share" and the others refuse, the child dies. My contribution becomes futile, not partial. The Fair Share principle caps obligations when partial compliance yields partial moral credit. It does not apply when my contribution is the *necessary condition* for the good itself. The asymmetry isn't about proximity or cost; it's about causal structure. In the pond scenario, given the others' inaction, I am not merely a contributor; I am the sole available cause of rescue. That shifts the duty from "fair share" to "necessary rescue."

  This preserves the fairness view for famine while respecting the intuition for the pond. In famine, my non-compliance doesn't guarantee specific deaths because the system is buffered and aggregative. In the pond, my non-compliance (beyond the fair share) guarantees this death. The Fair Share principle assumes a background where others' compliance is expected or where the good is divisible. When the good is indivisible and others defect, the principle dissolves, reverting to a duty to secure the outcome. You haven't shown the principle is wrong; you've shown it has a domain of application, and the pond case falls outside it due to causal necessity, not physical distance.

