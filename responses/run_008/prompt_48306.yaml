      *   *Strategy C: Organism-Environment Interaction (Garzon, maybe?).* Content is relational to the niche.
      *   *Strategy D: Bit the Bullet (Indeterminacy is real).* Maybe content *is* fuzzy. Our folk psychology demands precision biology can't give.
      *   *Insider point:* The "Normal Conditions" move. Content is what the mechanism does in *normal* conditions. But what defines "normal"? The conditions under which it was selected? Circular?

  4.  **Deconstruct Request 3: Swampman vs. Indeterminacy (The "Opposite Directions" Claim).**
      *   *The TA's Point:*
          *   Swampman says: History is *too strict* (Swampman has no content, but intuitively he does).
          *   Indeterminacy says: History is *too loose* (History allows too many descriptions, so content is vague).
