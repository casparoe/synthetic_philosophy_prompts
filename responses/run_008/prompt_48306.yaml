          *   *Critique:* Environments change. Are we stuck with Pleistocene content?
          *   *Biting the Bullet:* Maybe content *is* indeterminate. Folk psychology is the bug, not the biology. (Reference: Papineau? Maybe more niche.)
          *   *Verdict:* Most strategies relocate the problem rather than solve it.
      *   **Part 3: Swampman & Indeterminacy (The Tension).**
          *   Analyze the "Opposite Directions" claim.
          *   Swampman = History is unnecessary (Too Strict).
          *   Indeterminacy = History is insufficient (Too Loose).
          *   *Synthesis:* This reveals the core tension of *Naturalizing Normativity*. To get normativity, you need history (Swampman suffers). To get specific content, history is too blunt (Indeterminacy suffers).
          *   *Does it cancel?* No, it suggests the project might need a hybrid or a paradigm shift (e.g., Role Functionalism or Inferentialism).
      *   **Conclusion:** Is the view dead? No, but it's "mature." It's moved from "Here is the solution" to "Here is the cost of doing business."
      *   **Tone Check:** Keep it conversational but rigorous. Use philosophical terminology correctly but explain it. Avoid being overly dogmatic.

  6.  **Refining the Content (Self-Correction during drafting):**
      *   *Correction:* Make sure not to conflate the Disjunction Problem with the Indeterminacy Problem too much. They are cousins, but Disjunction is usually Causal/Informational, Indeterminacy is Teleological.
      *   *Add:* Mention the "Swampman" response from Millikan. She bites the bullet. Swampman *doesn't* have content. This is a crucial data point for the "Opposite Directions" argument.
      *   *Add:* Mention "Structuralism" or "Role Functionalism" as alternatives that might avoid these specific pincers.
