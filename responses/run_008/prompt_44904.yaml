          *   *Impact on England:* If it's positional, charging the student for a "private return" is unjust (it's a arms race). The state shouldn't subsidize an arms race. *Change:* Ration places strictly, or stop funding the premium.
          *   *Impact on Germany:* If it's positional, free access fuels credential inflation. *Change:* Limit university spots, emphasize vocational tracking (which Germany already does somewhat).
      *   **Conclusion:** Synthesize. The systems are path-dependent compromises, not pure philosophical implementations.

