      *   **The Implicit Ontology:** Define the "Service-Access + Social-Contract" model. It's not property, it's *entitlement to an experience*.
      *   **Coherence Check:** Is it inconsistent? No, it's *strategically ambiguous*.
      *   **Requirements vs. Fit:**
