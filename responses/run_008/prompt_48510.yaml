answer: |-
  It is a common reaction to read Amartya Sen's "Equality of What?" and feel that the argument is decisive. Your frustration is shared by many students of political philosophy. However, for your term paper, it is crucial to correct a slight misconception in your premise: Sen did not claim to have *settled* the debate in 1979, nor did he present the Capability Approach as a complete, finalized theory of justice. He presented it as a framework for evaluation rather than a strict formula.

  The reason the debate persists is not merely disciplinary inertia or economists protecting their turf (though those play a role). There are genuine, unresolved philosophical and technical problems with the capability metric that keep the conversation alive. Below is an analysis of why the debate continues and an outline of the strongest surviving objection to the capability approach.

  ### Why the Debate Persists

  You asked if there is a technical obstacle to putting capabilities into a single index. The answer is yes, and it is significant.

  **1. The Indexing and Aggregation Problem**
  Sen's critique of resources (Rawls) and welfare (Utilitarianism) is devastating, but his positive proposal faces a mathematical and philosophical hurdle that his rivals do not.
  *   **Resources** (like income) are easily aggregated. You can add dollars.
  *   **Welfare** (utility) is theoretically aggregable, even if hard to measure interpersonally.
  *   **Capabilities** are heterogeneous. How do you compare "being able to vote" with "being able to walk without pain"? To make policy decisions, you need to weight these capabilities against one another. Sen deliberately refused to provide a fixed weighting scheme, arguing it must be determined through public reasoning in specific contexts. For a theorist seeking a universal principle of justice, this looks like an incomplete theory. For an economist seeking a model, it looks like an unmeasurable variable.

  **2. The Rawlsian Defense (Political, Not Metaphysical)**
  Rawlsians did not abandon Primary Goods because they disagreed with Sen's diagnosis of disability. Instead, they argued that Sen misunderstood the purpose of Primary Goods. Rawls later clarified that Primary Goods are not a measure of *moral worth* or *ideal justice*, but a measure for a *political conception* of justice.
  *   The argument is that in a pluralistic society, the state cannot judge what constitutes a "good life" (which capabilities matter).
  *   Primary Goods are "all-purpose means" that allow citizens to pursue their own ends.
  *   Therefore, Rawlsians argue we should stick to resources because they respect liberal neutrality, whereas selecting specific capabilities risks the state imposing a specific view of human flourishing.

  **3. The Welfare Defense (The Phenomenological Claim)**
  Defenders of welfare economics argue that Sen's "adaptive preferences" argument cuts both ways. While it is true that the deprived may report false contentment, it is also true that capabilities can be "empty freedoms."
  *   If a person has the capability to be well-nourished but chooses to fast for religious reasons, a capability metric might register them as deprived (if focusing on functionings) or ignore their subjective sacrifice (if focusing on capabilities).
  *   Welfare economists argue that ultimately, justice is about how lives *go* for the people living them. If two people have the same capabilities but one is miserable and the other happy, a strict capability egalitarian might say they are equally treated. A welfare egalitarian says this ignores a morally relevant difference.

  ### The Strongest Surviving Objection: The Problem of Selection and Neutrality

  For your term paper, the strongest philosophical objection to the capability metric is the **Problem of Selection (or the "List" Problem) combined with Liberal Neutrality.**

  This objection asks: **Who decides which capabilities count, and by what right?**

  **The Argument:**
  To implement the Capability Approach, you must distinguish between relevant capabilities (e.g., "ability to read") and irrelevant ones (e.g., "ability to count blades of grass").
  1.  **If the state selects the list:** It becomes perfectionist. It assumes the state knows what is valuable in human life. This violates the liberal principle that the state should remain neutral between different conceptions of the good. Martha Nussbaum attempted to solve this by creating a fixed list of "Central Capabilities," but critics argue this is culturally imperialistic or paternalistic.
  2.  **If the individual selects the list:** We return to the problem of aggregation. If everyone chooses their own weighting, how do we compare Person A (who values religious freedom above all) with Person B (who values physical mobility above all)? We lose the ability to make public judgments about injustice.

  **Why this is stronger than the measurement objection:**
  The measurement objection is practical (we can't measure it well yet). The Selection/Neutrality objection is theoretical (we *should not* measure it this way in a liberal society). It suggests that the Capability Approach, while morally attractive, is incompatible with the constraints of political liberalism that Rawlsians prioritize.

  **A Related Objection: Responsibility**
  A second strong objection comes from the "luck egalitarian" camp (e.g., Richard Arneson or G.A. Cohen). They argue that the Capability Approach does not sufficiently distinguish between **circumstance** and **choice**.
  *   If I have the capability to be healthy but choose to smoke and get sick, does justice require society to restore my capability?
  *   Sen focuses on freedom, but critics argue he does not adequately account for personal responsibility. If the metric is simply "equality of capability," it may require expensive compensation for people who voluntarily squander their capabilities, which seems unfair to those who used theirs prudently.

  ### Summary for Your Term Paper

  To present the other side fairly, you should argue that Sen's "Equality of What?" did not end the debate because it traded one set of problems for another.
  *   **Resources** fail on **conversion** (disability).
  *   **Welfare** fails on **adaptation** (happy slaves).
  *   **Capabilities** fail on **selection and aggregation** (who decides what counts and how to weigh it?).

  The debate continues because each metric captures a different moral intuition that the others miss. Resources capture **agency and neutrality**; Welfare captures **subjective experience**; Capabilities capture **substantive freedom**. Most contemporary philosophers now argue that a complete theory of justice likely requires a hybrid approach, rather than a victory for one single metric.

  **Key Sources to Cite:**
  *   **John Rawls,** *Political Liberalism* (for the defense of Primary Goods as political, not comprehensive).
  *   **Martha Nussbaum,** *Women and Human Development* (for the attempt to create a fixed list of capabilities).
  *   **Richard Arneson,** "Equality of Opportunity for Welfare" (for the responsibility objection).
  *   **Ingrid Robeyns,** "The Capability Approach: A Theoretical Survey" (for a clear breakdown of the indexing problem).

  This framing will show your professor that you understand not just Sen's argument, but why it remains a live wire in contemporary political philosophy.
