answer: |-
  This is a classic problem in the philosophy of probability, often called the **Undermining Problem** (or the problem of "undermining futures"). Your friend has essentially reconstructed an argument that David Lewis himself grappled with in the postscript to *A Subjectivist's Guide to Objective Chance*.

  Your intuition is correct: your friend has proven that the **Original Principal Principle (PP)** is inconsistent with the **Best System Account (BSA)**, but he has not proven that *calibration* is impossible. He has only proven that you cannot use the *naive* version of PP if you are a Humean about chance.

  Here is the breakdown of where to cut, what to replace it with, and the costs involved.

  ### The Diagnosis: Step (1) is the Weak Link

  You should reject **(1) as stated**, but replace it with the **New Principal Principle (NPP)**.

  Your friend's argument relies on the Original PP:
  $$Cr(A \mid Ch(A)=p \land E) = p$$
  (where $E$ is admissible evidence).

  Lewis conceded that if BSA is true, the Original PP is false. Why? Because under BSA, the chance $Ch(A)$ is a function of the *entire* Humean mosaic (the total history of the world). If you condition on $Ch(A)=p$, you are implicitly conditioning on a constraint about the total history. If your evidence $E$ (e.g., "99 heads have occurred") conflicts with the total history required to make $Ch(A)=p$ true, you have conditioned on an impossibility or created a logical tension.

  In your friend's "small world" scenario, the chance of the 100th flip is ontologically dependent on the outcome of the 100th flip (because the Best System summarizes the *whole* sequence). This creates a feedback loop that breaks the Original PP.

  **The Fix: The New Principal Principle (NPP)**
  To save BSA + Calibration, you must adopt the NPP (championed by Lewis, Hall, and Thau). The NPP roughly states:
  $$Cr(A \mid Ch(A \mid E)=p \land E) = p$$
  Or, more intuitively: Your credence in $A$, conditional on the proposition that the *current chance of A given your evidence E* is $p$, should be $p$.

  **Why this solves the problem:**
  1.  **Blocks the Loop:** You no longer condition on "The chance is $p$" simpliciter. You condition on "The chance, *taking into account the 99 heads I've already seen*, is $p$."
  2.  **Preserves Calibration:** You are still deferring to objective chance. You are just deferring to the chance *as it stands now*, given the history, not the chance abstracted from history.
  3.  **Saves Statistical Inference:** You don't need to declare past outcomes "inadmissible." You simply acknowledge that past outcomes update your estimate of what the Best System is.

  **The Cost:**
  *   **Complexity:** The NPP is conceptually heavier than the Original PP. It requires understanding chance as a conditional relation rather than a simple property of the present moment.
  *   **Concession to Friend:** You have to admit your friend is right that the *Original* PP is self-defeating in a BSA world. (Lewis admitted this too, so you're in good company).

  ### Secondary Defense: Challenge Step (3)

  Even if you stick with the Original PP, your friend's application of BSA in **(3)** is suspect. This is the "Overfitting" objection to BSA.

  Your friend assumes that after 99 heads, the "Best System" must assign a high probability to heads on the 100th flip to maximize **Fit**. However, Lewis's BSA balances three things: **Fit, Strength, and Simplicity**.

  *   **System A:** "Quantum Coin: $P(Heads) = 0.5$." (Very Simple, Very Strong, Poor Fit for this specific 99/100 sequence).
  *   **System B:** "Quantum Coin: $P(Heads) = 0.99$." (Simple, Strong, Better Fit).
  *   **System C:** "List of 100 outcomes." (Perfect Fit, Zero Strength/Simplicity).

  In a world with quantum mechanics, System A is likely still the "Best" system because the gain in Fit from moving to System B does not outweigh the loss in Simplicity/Strength, especially if the underlying physics (Schrödinger equation) is simple. A good BSA account should be robust against finite sample noise. If the Best System shifts its probabilities wildly based on 100 trials, it's a bad Best System.

  **The Cost:**
  *   **Defending Simplicity:** You must argue that Simplicity is an objective feature of the world (or our language) that can outweigh empirical Fit in small samples. This opens you to charges of subjectivity.
  *   **Single-Case Chance:** You have to maintain that chances exist even in a universe too small for frequencies to converge.

  ### Why Rejecting Step (2) is a Trap

  You suspected Step (2) (Admissibility) was doing something sneaky. You are right to worry about rejecting it.

  If you reject (2) and say "Past outcomes are inadmissible," you destroy empirical science. As you noted, we learn coins are loaded by looking at past flips. If past flips are inadmissible, the Principal Principle forbids you from using them to update your credence about the chance.

  **Under the NPP, you don't need to reject (2).** The concept of "admissibility" becomes less critical because the NPP explicitly allows you to condition on evidence $E$ *inside* the chance term. You can look at the 99 heads, update your belief about what the Best System is, and then defer to *that* chance.

  ### Summary of Options

  | Option | What you reject | What you keep | The Cost |
  | :--- | :--- | :--- | :--- |
  | **A (Recommended)** | **Original PP (1)** | **BSA (3) + Calibration** | Adopt the **New Principal Principle**. Admit Original PP fails for Humeans. Slightly more complex formalism. |
  | **B** | **Naive BSA (3)** | **Original PP (1) + Calibration** | Argue the Best System doesn't overfit small samples. Requires robust defense of Simplicity vs. Fit trade-offs. |
  | **C** | **Admissibility (2)** | **Original PP (1) + BSA (3)** | **High Cost.** Makes statistical inference irrational. Past data becomes "inadmissible" for chance deference. |
  | **D** | **Independence (5)** | **Original PP (1) + BSA (3)** | **High Cost.** Accept that rational agents should commit the Gambler's Fallacy in small worlds. |

  ### The Verdict

  Tell your friend: **"You've successfully reproduced Lewis's Undermining Problem. You are right that the Original Principal Principle is inconsistent with the Best System Account. But Lewis solved this with the New Principal Principle."**

  1.  **Keep (3) BSA:** It's the only non-spooky account of chance.
  2.  **Keep Calibration:** But shift from Original PP to **New PP**.
  3.  **Reject (1) as formulated:** The Original PP is false in a Humean world.
  4.  **Reject (5)'s conclusion:** A rational agent *should* update their credence based on the 99 heads, but not because the coin has a memory. They update because the 99 heads is evidence about *which law governs the world*. If the Best System is robust (Option B above), the chance stays 0.5, and credence stays 0.5. If the Best System is sensitive, the chance changes, and credence follows. Either way, no self-defeat.

  Your friend's conclusion that "defer to objective chance is a rule you can't follow" is false. It's just a rule you can't follow *using the 1980 version of the Principal Principle*. The 1994 version (NPP) works fine.
