      *   **Constraint:** Do *not* provide a general summary of the debate or literature pointers. Focus on the *conceptual anatomy* of the two claims and their relationship.

  2.  **Deconstruct the Two Claims:**

      *   **Claim 1: Hart's "Minimum Content of Natural Law" (MCNL).**
          *   *Source:* H.L.A. Hart, *The Concept of Law*, Chapter 9.
          *   *Basis:* Truisms about the human condition (vulnerability, approximate equality, limited altruism, limited resources, limited understanding/strength of will).
          *   *Nature:* Hypothetical imperative. *If* you want survival (the minimum purpose of law), *then* you must have rules restricting violence, protecting property, enforcing promises, etc.
          *   *Status:* Empirical/sociological necessity, not moral necessity. It explains *why* laws look similar across societies, not why they *ought* to be obeyed morally.
          *   *Relation to Natural Law:* Hart calls it "natural law" ironically or descriptively. It's about content (substance).

      *   **Claim 2: Fuller's "Internal Morality of Law" (IML).**
          *   *Source:* Lon Fuller, *The Morality of Law*.
          *   *Basis:* The nature of law as a purposive enterprise (subjecting human conduct to the governance of rules).
          *   *Nature:* Procedural/Adjectival. Eight desiderata (generality, publicity, non-retroactivity, clarity, non-contradiction, possibility of compliance, constancy, congruence).
          *   *Status:* Moral (in a sense). Failure to meet these isn't just inefficiency; it's a moral failure because it disrespects human agency. A system failing these isn't just "bad law," it's not law *at all* (on Fuller's view).
          *   *Relation to Natural Law:* Fuller explicitly aligns with a procedural natural law tradition. It's about form/process.

  3.  **Address Question (a): Are these concessions to Natural Law Theory?**
      *   *Hart:* No, not really. It's a concession to *natural necessity*, not moral normativity. He admits law *contingently* overlaps with morality due to human nature, but maintains the Separation Thesis (law *as it is* vs. law *as it ought to be*). He uses the term "natural law" to disarm critics, but the mechanism is utilitarian/survivalist.
      *   *Fuller:* Yes, but a specific kind. He redefines natural law away from substantive moral truths (don't kill) to procedural moral truths (don't make secret rules). It is a concession to the idea that law has an inherent moral dimension, but it shifts the ground from *ends* to *means*.
      *   *Comparison:* Hart's is empirical necessity; Fuller's is normative integrity.

  4.  **Address Question (b): The Thomist Perspective.**
      *   *Thomism:* Lex iniusta non est lex (an unjust law is not a law). Natural law is derived from eternal law/reason, pointing toward the *common good* and ultimate human flourishing (beatitude). It is substantive *and* procedural, but primarily substantive regarding justice.
      *   *View on Hart:* Would reject it. Hart says an unjust law is still a law. Hart's "minimum content" is about survival, not flourishing or justice. It's prudential, not moral.
      *   *View on Fuller:* Mixed/Complex. Fuller's proceduralism looks like a subset of Thomistic justice (legal justice), but Fuller stops short of substantive morality. A Thomist might say, "You can follow all 8 desiderata and still create a wicked regime (e.g., apartheid with clear rules)." Therefore, Fuller's "internal morality" is insufficient for *true* natural law. It captures the *form* of practical reason but misses the *end*.
      *   *Verdict:* Both change the subject. Hart changes it to sociology/prudence. Fuller changes it to procedural integrity. Traditional NL is about substantive moral order grounded in ontology/theology.

