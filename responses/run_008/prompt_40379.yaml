answer: |-
  Your confusion is well-founded because it touches on a structural ambiguity in mid-twentieth-century jurisprudence: both Hart and Fuller employ teleological reasoning (reasoning from purposes) to define law, but they locate the normativity of that purpose in fundamentally different places. To untangle this, we must dissect the logical structure of each claim before assessing their relationship to natural law theory.

  ### 1. The Conceptual Anatomy of the Two Claims

  **Hart's Minimum Content of Natural Law (MCNL)**
  Hart's argument is grounded in **hypothetical necessity based on empirical facts**.
  *   **The Structure:** *If* a legal system aims at survival (the minimum purpose), *and* given certain immutable facts about the human condition (vulnerability, approximate equality, limited altruism, limited resources, limited understanding), *then* the system must contain certain substantive rules (restrictions on violence, a system of property, enforcement of promises).
  *   **The Status of the "Must":** This "must" is causal and prudential, not moral. It is analogous to saying, "If you want to build a bridge that stands, you must account for gravity." Ignoring gravity causes the bridge to fall; ignoring the minimum content causes society to dissolve.
  *   **Substantive vs. Formal:** Hart's concession is **substantive**. It dictates *what* the law must say (e.g., "do not kill"). However, Hart insists this does not make the law moral. It merely makes the law *effective*. A rule against killing is not morally good in Hart's view; it is a functional prerequisite for a society that wishes to persist.

  **Fuller's Internal Morality of Law (IML)**
  Fuller's argument is grounded in **constitutive normativity based on the nature of agency**.
  *   **The Structure:** Law is defined as the enterprise of subjecting human conduct to the governance of rules. To engage in this enterprise *at all*, one must adhere to eight procedural desiderata (generality, publicity, non-retroactivity, clarity, etc.).
  *   **The Status of the "Must":** This "must" is normative and constitutive. It is analogous to saying, "If you want to play chess, you must move the bishop diagonally." If you move the bishop like a rook, you are not playing chess badly; you are not playing chess. For Fuller, failing these procedural conditions is not just inefficiency; it is a moral failure because it fails to respect the human agency of the subjects (who cannot follow rules they cannot know or understand).
  *   **Substantive vs. Formal:** Fuller's concession is **procedural**. It dictates *how* the law must be made and administered. Fuller argues that this form has moral weight because it creates a relationship of reciprocity between ruler and ruled.

  ### 2. Addressing Your Specific Questions

  **(a) Are both claims concessions to natural law theory?**
  Strictly speaking, **only Fuller's claim is a concession to natural law theory.** Hart's is a concession to *natural necessity*.

  *   **Hart:** He explicitly uses the term "natural law" to disarm opponents, but he drains it of moral content. Traditional natural law theory asserts that there is a necessary connection between law and *moral truth*. Hart asserts only a necessary connection between law and *survival*. He maintains the Separation Thesis: a law can be legally valid but morally iniquitous. His "minimum content" explains why legal systems look similar sociologically, not why they command moral obedience.
  *   **Fuller:** He explicitly aligns himself with a natural law tradition, though a procedural one. He argues that there is a necessary connection between law and *moral value* (specifically, the value of human agency). For Fuller, a system that utterly fails the internal morality (e.g., secret, retroactive rules) is not just bad law; it is not law. This reconnects legality with morality, which is the hallmark of natural law theory.

  **(b) Would a traditional Thomist natural law theorist recognize either?**
  A traditional Thomist (following Aquinas) would likely regard **both as changing the subject**, though Fuller would be seen as closer to the truth than Hart.

  *   **Regarding Hart:** A Thomist would reject Hart's MCNL as a description of *prudence*, not natural law. For Aquinas, natural law is derived from reason's participation in the eternal law, directing humans toward their *ultimate end* (flourishing/beatitude), not merely their *survival*. Hart's argument is that wicked regimes must also forbid murder to survive. A Thomist would say this confirms the *power* of the regime, not the *legality* of the rule. Since Hart admits an unjust law is still a law (*lex iniusta est lex*), he stands directly opposed to the Thomistic maxim *lex iniusta non est lex*.
  *   **Regarding Fuller:** A Thomist would view Fuller's internal morality as a necessary but insufficient condition for true law. It captures the *ordinatio rationis* (ordination of reason) aspect of law—that law must be rational and communicable. However, a Thomist would argue that one can satisfy all eight of Fuller's desiderata and still create a wicked legal system (e.g., a regime with clear, public, prospective rules enforcing apartheid). For the Thomist, procedural rationality cannot redeem substantive injustice. Fuller's "internal morality" would be categorized as a matter of *legal justice* or *craft*, but it lacks the ontological grounding in the *common good* required by traditional natural law.

  **(c) Is the shared vocabulary accidental, or is there a unifying thought?**
  The shared vocabulary is **not accidental**. There is a genuine unifying thought: **Functionalism.**

  Both Hart and Fuller reject the idea that law can be defined solely by its source (e.g., the command of a sovereign). Instead, both define law by what it *does* (its function).
  *   **Hart's Functionalism:** The function of law is social control leading to survival. The constraints on law are **causal**. If you violate the function, the system collapses empirically.
  *   **Fuller's Functionalism:** The function of law is guiding conduct through rules. The constraints on law are **constitutive**. If you violate the function, the concept vanishes normatively.

  **Where the Analogy Breaks Down:**
  The analogy breaks on the question of **evil purposes**.
  *   For **Hart**, the function (survival) is value-neutral. A gang of thieves can have a legal system if it secures their survival. The "minimum content" applies to them too. The teleology is empty of moral value.
  *   For **Fuller**, the function (governance by rules) inherently contains value (respect for agency). You cannot use the "internal morality" to achieve evil ends easily, because the process of making law clear and public constrains the ruler. The teleology is morally loaded.
  *   For the **Traditional Natural Lawyer**, the function (flourishing/common good) is objectively moral. You cannot achieve the function with evil ends at all.

  ### Summary of the Distinction

  Your friend and you were struggling because both arguments use the logic of "purpose constrains form," but they locate the constraint differently.

  1.  **Hart** argues that **facts about the world** constrain the **content** of the law. (Because humans are vulnerable, laws must protect bodies). This is a **sociological constraint** dressed in natural law vocabulary.
  2.  **Fuller** argues that **the concept of law itself** constrains the **procedure** of the law. (Because law is rule-guidance, rules must be followable). This is a **moral constraint** derived from the nature of the practice.

  Hart's concession is that law cannot be *anything* and still work; Fuller's concession is that law cannot be *anything* and still be *law*. Hart preserves the Separation Thesis by making the constraint empirical; Fuller dissolves the Separation Thesis by making the constraint moral. Thus, while both sound like natural law arguments because they appeal to the "nature" of things, only Fuller's is a concession to the *normativity* of natural law theory. Hart merely concedes the *inevitability* of certain rules.
