      *   Ensure the distinction between "substantive/teleological" (Hart's MCNL is actually teleological regarding survival, but not moral) and "procedural/formal" (Fuller) is clear. *Correction:* Wait, Hart's MCNL is teleological (goal: survival) but based on empirical facts. Fuller's is also teleological (goal: governance by rules) but based on normative integrity. I need to be careful not to conflate Hart's "teleology" with moral teleology. Hart's is a "goal-based necessity." Fuller's is a "practice-based integrity."

      *   *Self-Correction on Hart:* Hart explicitly denies his MCNL is "Natural Law" in the traditional sense. He calls it a "tribute" paid to it. It is a *natural necessity* argument.
      *   *Self-Correction on Fuller:* Fuller argues that procedure *is* substantive in its effect on human dignity.

      *   *Refining the Thomist point:* A Thomist would say Hart describes *prudence*, Fuller describes *art/craft*, but Natural Law is about *justice* and *virtue*.

      *   *Refining the Unifying Thought:* The unifying thought is **Functionalism**. Law is defined by what it *does*. The divergence is on whether the functional requirements are merely causal (Hart) or inherently moral (Fuller).

  8.  **Final Review against Constraints:**
      *   Did I summarize the whole debate? No.
