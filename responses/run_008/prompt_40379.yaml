      *   *Is it accidental vocabulary?* No. Both are responding to the same problem: Legal Positivism's separation of law and morality.
      *   *The Unifying Thought:* Law is a *functional kind*. You can't define a knife without reference to cutting. You can't define law without reference to guiding conduct.
      *   *Hart's Twist:* The function is survival. The constraints are causal/empirical. (If you want X, you must do Y).
