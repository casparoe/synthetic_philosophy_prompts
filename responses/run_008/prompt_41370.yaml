answer: |-
  This is an exceptionally sharp diagnosis of a rhetorical move that often passes unchallenged in policy debates. You are quite right to suspect that 'sex work is work' functions less as a singular proposition and more as a shibboleth—a signal of alliance that conceals significant philosophical divergence. When your discussant deployed it to truncate your query, they implicitly relied on the strongest reading of the slogan to bypass the technical and conceptual hurdles you were rightly highlighting.

  Below is a menu of six distinct theses that the slogan might express, ordered from the most modest (semantic) to the most radical (ontological). For each, I have provided the classification, consensus status, and—crucially for your project—its implication for your specific question regarding the extension of ordinary labour law.

  ### 1. The Semantic-Stipulative Thesis
  **The Claim:** The term 'sex work' should be preferred to 'prostitution' to reduce stigma and acknowledge the agency of the seller, regardless of the legal or moral status of the act.
  *   **Status:** **Trivial but Politically Potent.** It is a claim about nomenclature and social framing rather than metaphysics or law.
  *   **Consensus:** **Widely Held** by advocates and many sociologists; contested by abolitionists who insist 'prostitution' denotes exploitation inherently.
  *   **Implication for Your Question:** **Leaves it Open.** One can agree to use the term 'work' for dignitary reasons without committing to the view that labour law *must* or *can* apply. It changes the vocabulary of the debate, not the regulatory mechanics.
  *   **Confidence:** High.

  ### 2. The Descriptive-Economic Thesis
  **The Claim:** The transaction involves the expenditure of labour time and bodily effort in exchange for remuneration, satisfying the economic definition of work found in other service sectors.
  *   **Status:** **Substantive and Defensible.** It describes the structural reality of the exchange without yet judging its permissibility.
  *   **Consensus:** **Widely Held** by economists and sociologists; contested by those who view the exchange as fundamentally non-labour (e.g., a gift, a violation, or a status transaction).
  *   **Implication for Your Question:** **Leaves it Open.** Slavery and serfdom involve 'work' in a descriptive sense but are excluded from labour law protections on moral grounds. Describing the activity as labour does not automatically solve the problem of *how* to regulate it.
  *   **Confidence:** High.

  ### 3. The Normative-Permissibility Thesis
  **The Claim:** Selling sexual services is morally permissible in the same way that selling massage, therapy, or acting services is permissible; it is not inherently degrading or exploitative.
  *   **Status:** **Substantive and Contested.** This is the core ethical battleground between liberal feminists and radical/abolitionist feminists.
  *   **Consensus:** **Contested.** It is the dividing line between the decriminalisation/legalisation camps and the Nordic/abolitionist camp.
  *   **Implication for Your Question:** **Leaves it Open.** Even if the work is permissible, the state may regulate permissible industries differently (e.g., comparing nuclear power to retail). Permissibility does not entail a specific *mode* of regulation (employment vs. independent contracting).
  *   **Confidence:** High.

  ### 4. The Juridical-Recognition Thesis
  **The Claim:** The state ought to recognise sex work as a legitimate trade for the purposes of taxation, licensing, and business registration, rather than treating it as a grey economy or a social harm.
  *   **Status:** **Substantive and Defensible.** This moves from morality to administrative law.
  *   **Consensus:** **Contested.** Accepted in Germany, the Netherlands, and New Zealand; explicitly rejected by the Nordic model, which treats the sale as a symptom of inequality to be mitigated, not a trade to be licensed.
  *   **Implication for Your Question:** **Positively Demands It.** If the state recognises it as a trade, the question of *which* regulatory framework applies becomes urgent. However, it does not dictate that *ordinary* labour law is the only solution (one could imagine a bespoke regulatory regime).
  *   **Confidence:** High.

  ### 5. The Labourist-Entailment Thesis
  **The Claim:** Because it is work, sex workers are entitled to the *same* employment protections as other workers (minimum wage, collective bargaining, unfair dismissal rights), and existing labour law tests should apply without modification.
  *   **Status:** **Substantive and Highly Contested.** This is the thesis your discussant likely relied upon. It assumes the current machinery of employment law is fit for purpose.
  *   **Consensus:** **Contested.** Even within decriminalisation circles, there is debate over whether sex workers are employees or independent contractors, and whether standard health-and-safety inspections are viable in private dwellings.
  *   **Implication for Your Question:** **Licenses Dismissing It.** If one accepts this thesis as a premise, your question ('Could labour law be extended?') is answered axiomatically ('Yes, it must be'). This is why the discussant cut you off; they treated this entailment as self-evident, whereas you correctly identify it as the core technical problem.
  *   **Confidence:** High.

  ### 6. The Ontological-Flattening Thesis
  **The Claim:** There is no morally relevant difference between sex work and any other intimate service labour (e.g., care work, massage); any perceived distinction is purely stigma.
  *   **Status:** **Radical and Philosophically Vulnerable.** This denies any 'exceptionalism' regarding the body, intimacy, or privacy in this specific transaction.
  *   **Consensus:** **Held by Almost No One Once Stated Precisely.** Many proponents of the slogan act *as if* they hold this, but few would defend it under rigorous cross-examination regarding the unique privacy interests or bodily integrity issues involved.
  *   **Implication for Your Question:** **Positively Demands It.** If there is no distinction, there can be no justification for a bespoke regulatory regime. Ordinary labour law must apply.
  *   **Confidence:** Moderate (see below).

  ***

  ### The Nordic Wrinkle and Regime Compatibility

  You asked whether any reading of the slogan is compatible with all three regimes you study (Nordic, Legalisation, Decriminalisation). The short answer is **no**, not if we move beyond the purely Semantic Thesis.

  The Nordic model (asymmetric criminalisation) relies on a specific fracture in the concept of 'work'. It effectively asserts: *'For the seller, this is a survival strategy (or victimisation) that we will not punish; for the buyer, this is the purchase of a human being which we will punish.'* By criminalising the demand, the Nordic model denies the **Juridical-Recognition Thesis** (Thesis 4). It refuses to validate the transaction as a legitimate market exchange. Therefore, it is incompatible with any version of 'sex work is work' that implies the transaction itself is legitimate.

  However, the Nordic model *does* implicitly accept the **Descriptive-Economic Thesis** (Thesis 2) in a limited sense: it acknowledges that labour is being expended and that the seller requires support (exit services, social welfare). But it frames this labour as *harmful* rather than *productive*.

  This suggests that when your discussant used the slogan, they were likely smuggling in the **Labourist-Entailment Thesis** (Thesis 5) while presenting it as the **Descriptive-Economic Thesis** (Thesis 2). They treated a contentious regulatory conclusion as if it were a neutral sociological description. This equivocation is what allowed them to bypass your technical questions about employment-status tests.

  ### Epistemic Humility and the 'Least Sure' Reading

  I am least confident in my characterisation of **Thesis 6 (The Ontological-Flattening Thesis)**.

  **Reason for Uncertainty:** I suspect that when proponents deploy the slogan, they do not necessarily mean that sex work is *ontologically identical* to other work in every respect. Rather, they may mean it is *sufficiently similar for the purposes of rights attribution*. There is a risk of constructing a straw man here: few serious advocates argue that a sex worker's privacy interests are identical to a barista's. They argue that the *difference* does not justify exclusion from labour protections. Distinguishing between 'identical for all purposes' and 'identical for the purpose of labour rights' is difficult, and proponents often slide between them. If they mean the latter, Thesis 6 collapses back into Thesis 5. If they mean the former, it is indeed radical but easily refuted. I suspect the slogan's power relies on this ambiguity remaining unresolved.

  ### Confidence Summary

  *   **Thesis 1 (Semantic):** High Confidence.
  *   **Thesis 2 (Descriptive):** High Confidence.
  *   **Thesis 3 (Normative):** High Confidence.
  *   **Thesis 4 (Juridical):** High Confidence.
  *   **Thesis 5 (Labourist):** High Confidence.
  *   **Thesis 6 (Ontological):** Moderate Confidence (due to the ambiguity noted above).

  ### Recommendation for Your Next Conference

  When you approach your discussant, I suggest framing your query thus: *"I accept the Descriptive claim that sex work involves labour. But does the slogan entail the Labourist claim that existing employment tests are fit for purpose without modification? If so, on what grounds do we ignore the unique privacy and safety constraints that distinguish this sector from, say, hospitality?"*

  This forces them to specify which thesis they are holding. If they retreat to the Descriptive claim, you have won the right to ask your technical questions. If they insist on the Labourist claim, they must defend the coherence of applying standard employment tests to a sector where the 'workplace' is often private and the 'client' is legally distinct from an 'employer'.

  I hope this menu serves your thesis well. It is a robust line of inquiry, and the tension between the slogan's rhetorical utility and its legal precision is exactly where the most interesting philosophy is to be done.
