      *   *Refining the MinEnt vs. Commutativity point:* MinEnt *is* commutative if the constraints are consistent and applied to the same distribution, but issues arise when constraints are on conditionals vs. marginals. Grove & Halpern (1987) "The value of information..." discusses this. Actually, Shore & Johnson axioms *require* commutativity (system independence). If MinEnt violates it in this setup, it violates the axioms *or* the setup violates the axiom conditions. Van Fraassen argues MinEnt violates the intuition of independence.
