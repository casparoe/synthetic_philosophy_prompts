      *   *Repair for (4)/(5):* Acknowledge MinEnt is order-dependent for *sequential* constraints of different types. Restrict (5) or refine (4) (Grove & Halpern suggest specific constraint handling). *Cost:* Complexity.
      *   *Repair for (6):* Embrace the "Source Modeling" approach. The constraint $P(H|Red)=3/4$ is a summary of a likelihood ratio. *Cost:* Underdetermination. Without source priors, no unique answer.

  6.  **Address the "Cheapest Repair" and "Determinate Answer":**
      *   The "Cheapest" repair for a *hardcore Bayesian* is usually to double down on Conditionalization (1) and treat the input as a proposition about the world *plus* a model of the informant (6).
