answer: |-
  Dear Friend,

  It is entirely understandable that your intuitions are wobbling, because you are currently trying to solve for two different variables with a single equation. You are attempting to define what a tradition *is* historically while simultaneously judging what a tradition *does* morally, and these two inquiries often point in different directions. To help you find a thesis that holds water, we need to disentangle the epistemic question of origin from the ethical question of utility. If we look at your verdicts closely, there are really two competing principles at work in your mind, and choosing between them requires deciding whether you want your column to be a exercise in historical classification or a critique of power.

  The first candidate is what we might call the Veracity Principle. Under this rule, a tradition is labeled invented only if it falsifies its own history, claiming an antiquity it does not possess. This principle cleanly captures your outrage regarding the Scottish tartans, the Olympic torch, and the diamond engagement ring, all of which rely on a specific deception about their age to manufacture authority. It also grants the pass you want to give the Japanese tea ceremony, since its codification by Sen no Rikyū is a matter of historical record rather than mystical attribution. However, this principle forces you to abandon your verdict on Thanksgiving. Lincoln's proclamation was explicit about its timing and purpose; it did not claim to be medieval, yet you still instinctively file it as invented. Furthermore, the Veracity Principle cannot explain your wobble on Bastille Day. In 1880, the ceremony was honest about its newness, so it should not be invented; today, people assume it is old, so it should be. If the status of the tradition flips based on public forgetting rather than historical fact, then truthfulness alone is not the metric you are actually using.

  The second candidate is the Instrumentalization Principle, which draws from the work of Hobsbawm and Anderson you mentioned. Here, a tradition is invented if it is engineered from the top down to serve an external function, such as nation-building, social cohesion, or commerce, rather than emerging organically from lived practice. This principle successfully captures your verdict on Thanksgiving and Bastille Day, as both were deliberate acts of state construction designed to unify a populace. It also explains why the tartans and diamonds feel offensive, as they serve commercial or clan-based power structures. However, this principle demands a sacrifice you have already anticipated: it forces you to reclassify the Japanese tea ceremony as invented. While its purpose was spiritual rather than political, it was still a deliberate codification by a specific master designed to shape behavior, distinct from the slow accretion of the Passover seder. If you adopt this principle, you must accept that designed rituals are invented regardless of their sincerity, and that the difference between the tea ceremony and the tartan is not about invention itself, but about the nature of the power being served.

  My advice is that you should make that sacrifice. For a column on the history of ideas, the Instrumentalization Principle is the stronger tool because it treats invention as a historical condition rather than a moral failing. If you cling to the Veracity Principle to save the tea ceremony, you are forced into a complicated distinction between spiritual engineering and political engineering that risks sounding like mere taste. It is more intellectually honest to admit that the tea ceremony is indeed an invented tradition, but that it lacks the deceptive or coercive elements that make the tartans or the Olympic torch feel offensive. This allows you to distinguish between invention that is merely a fact of cultural history and invention that is a tool of manipulation. Regarding your wobble on Bastille Day, this principle offers a graceful solution: traditions are born invented, but they can become genuine through the process of naturalization. When a top-down decree is metabolized by generations of participants who make it their own, the instrumentality fades into the background. The ceremony stops serving the state and starts serving the people, which is why your verdict wobbles; you are sensing the moment where construction becomes culture.

  Applying this surviving principle to your remaining cases yields clear results. The kilt, in its modern form, is a classic example of invented tradition that leans toward the offensive. While Highland dress existed, the specific garment we recognize today was largely standardized by an English Quaker industrialist in the eighteenth century to facilitate labor in factories, and later romanticized by Victorian enthusiasts. It was engineered for utility and then retroactively clothed in nationalist sentiment, fitting the pattern of the tartans perfectly. It is invented because it was a top-down solution to an industrial problem that was later repurposed for identity formation, obscuring its pragmatic origins. The Pledge of Allegiance is similarly invented but occupies a different moral space. Composed by Francis Bellamy in the 1890s to boost magazine circulation and later promoted by the U.S. Flag Association, it was explicitly designed for nation-building in schools. Like Thanksgiving, it is an instrument of state cohesion, but unlike the tartans, it did not rely on a lie about antiquity to gain traction. It is an invented tradition that has been naturalized through repetition, much like Bastille Day, though its origins in commercial nationalism remain a stark footnote.

  Ultimately, your column will be sharper if you define invention by the mechanism of creation rather than the honesty of the claim. By accepting that the tea ceremony is invented, you free yourself to argue that invention is not the sin; deception and coercion are. This allows you to treat the Bastille Day case not as a paradox, but as a timeline. All these rituals start as tools in the hands of designers, whether merchants or statesmen. Some remain tools, like the diamond ring, forever reminding us of the hand that holds them. Others, like the tea ceremony or eventually Bastille Day, are taken up by practitioners who fill them with meanings the designers never anticipated. Your thesis, then, is not about distinguishing the real from the fake, but about tracing the moment a construct stops belonging to its inventor and starts belonging to its users. That is where the history of ideas truly lives, in the gap between the committee that wrote the rule and the generations who decided to keep it.
