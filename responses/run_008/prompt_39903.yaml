  You can maintain all your verdicts consistently, but only by adopting a principle of reasonable parental care that weighs the child's welfare against the burden of avoidance, rather than relying solely on whether the child is harmed.

  Your intuitions stumble on the Non-Identity Problem, which arises because in cases 4, 5, and 6, the child born with impairments is not worse off than they would have been otherwise, since the alternative was non-existence. If you insist that an act is wrong only if it makes a specific person worse off (the Person-Affecting View), you cannot blame the mother in the medication case (4) without also blaming the couple in the hereditary case (5), yet you feel blame only in the former. To resolve this without abandoning your verdicts, you must shift from a pure outcome-based view to a duty-based view: parents have an obligation to prevent suffering provided the cost to them is not significant. In the medication case, waiting one month is a low burden, so failing to do so is negligent. In the hereditary case, adoption or donor conception involves a high burden (losing a genetic link, financial cost, procedural hassle), so choosing natural conception is permissible despite the suffering.

  This same principle explains your verdict on the IVF case (6). Selecting between two existing embryos involves virtually no additional burden to the parents; therefore, choosing the embryo with the lower welfare potential violates the duty of reasonable care, even if the resulting life is worth living. This distinguishes it from naturally conceiving a deaf child, where the "cost" of avoiding the condition might involve not having a child together or undergoing significant medical intervention. Your verdicts on cases 1, 2, and 3 establish a threshold: there is no duty to create a child (case 2), but there is a strict duty not to create a child whose life is not worth living (case 1). Case 3 falls above the threshold, making it permissible.

  Applied to the ten-good-years case (7), this principle dictates that your uncertainty should not depend on the metaphysical location of the "worth living" line, but on the avoidability of the early death. If the early death is inevitable given the parents' constraints (high cost to avoid), then conceiving is permissible so long as the ten years are genuinely worth living. If the early death is avoidable at low cost (e.g., by waiting or moving locations), then conceiving would be wrong. Since you describe the couple as knowing the outcome in advance, implying inevitability, the principle verdict is permissible, provided the ten years meet the threshold of a life worth living.
