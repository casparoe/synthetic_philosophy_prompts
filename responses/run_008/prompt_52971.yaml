answer: |-
  This is a profound inquiry into the moral architecture of the administrative state. The pattern you describe—lawful individual emissions that aggregate into unlawful or compensable harms—lies at the intersection of non-ideal theory, legal philosophy, and the ethics of risk. Below is an analysis structured according to your requirements.

  ### I. Candidate Views on the Threshold Practice

  Before reconstructing the implicit theory, we must map the logical space of justifications for regulatory thresholds.

  1.  **Ontological Thresholdism (The "Zero Harm" View):** This view holds that below a certain concentration, a pollutant *does not cause harm* in a morally relevant sense. It relies on a biological or toxicological discontinuity (e.g., a threshold dose-response curve). If the dose is below $X$, the physiological state is identical to the baseline. Therefore, aggregation is mathematically possible but morally vacuous; summing zeros yields zero.
  2.  **Epistemic Humility (The "Uncertainty" View):** Harm may exist below the threshold, but current science cannot distinguish it from background noise. The threshold represents the limit of detectability, not the limit of effect. Legally, this treats the harm as *unproven* rather than *non-existent*.
  3.  **Administrative Consequentialism (The "Cost-Benefit" View):** Harms aggregate linearly, but the cost of regulating them below the threshold exceeds the social benefit. The threshold is a proxy for the point where marginal abatement costs outweigh marginal health benefits. The harm is real, but the *regulation* of it is inefficient.
  4.  **Rights-Based Threshold Deontology:** Individuals have a right to safety, but not to absolute safety. A right is only violated when a risk exceeds a "reasonable" or "acceptable" level. Below the threshold, the agent's right to liberty (to emit) trumps the recipient's claim to security.
  5.  **The "Separate Spheres" Compartmentalization:** Regulatory law governs *general* prospective conduct (public law), while tort and criminal law govern *specific* retrospective wrongs (private/public wrongs). They operate on different ontological registers; one defines "safety," the other defines "compensation."

  ### II. Reconstructing the Implicit Theory: Presupposition vs. Consistency

  Does the threshold structure presuppose a genuinely non-aggregative view of badness, or is it merely an administrative rationale?

  **Strict Presupposition:**
  The practice does **not** strictly presuppose Ontological Thresholdism. A regulator can consistently believe that every molecule of a carcinogen carries a non-zero probability of causing cancer (a linear no-threshold model) and still set a permissible limit. Therefore, the practice does not logically require the belief that "sub-threshold harms do not count."

  **Consistency:**
  The practice is *consistent* with Administrative Consequentialism and Epistemic Humility. In fact, modern regulatory impact analysis (RIA) explicitly operates on cost-benefit frameworks (e.g., Executive Order 12866 in the US). The *de minimis* principle here functions not as a metaphysical claim about harm, but as a **normative suspension of claim-making**. It says: "For the purposes of *permitting*, this risk is treated as if it were zero."

  **The Implicit Theory:**
  The regulatory state implicitly relies on a **Dual-Track Normativity**:
  1.  **For Ex Ante Governance (Permitting):** Risks are evaluated *source-by-source*. The moral unit is the *facility*, not the *population*. The threshold is a "safe harbor" that converts a potentially wrongful act (polluting) into a lawful one (operating). This presupposes that **lawfulness is binary**, not continuous.
  2.  **For Ex Post Justice (Tort/Crime):** Harms are evaluated *victim-by-victim* or *act-by-act*. The moral unit is the *injury* or the *intent*.

  **The Tension:**
  There is a genuine tension, not merely a division of labor. If a permit declares an emission "safe" (lawful), it creates an **estoppel-like expectation** that no harm exists. Yet, tort law compensates for that harm.
  *   *Coherence Defense:* One could argue coherence is maintained if tort compensation is for *property value diminution* or *fear*, not physical health. If my house value drops because a factory emits legal fumes, the tort compensates the economic loss, not the health impact.
  *   *Incoherence Reality:* However, in toxic torts (e.g., *medical monitoring* claims), courts award damages for increased risk of disease from *legal* emissions. This contradicts the regulatory premise that the risk is *de minimis*. The system implicitly admits that **aggregate sub-threshold harms are real** (hence tort liability) but **individually sub-threshold harms are unregulable** (hence permits).

  This suggests the implicit theory is **Administrative Consequentialism disguised as Ontological Thresholdism.** Regulators speak as if the risk vanishes (to provide certainty to industry) but adjudicate as if the risk persists (to provide justice to victims).

  ### III. Philosophical Underdetermination

  The current practice is philosophically underdetermined because rival theories of aggregation all license it for different reasons.

  1.  **The Utilitarian:** Supports thresholds because tracking every micro-harm creates transaction costs that reduce overall welfare. The threshold is an efficiency heuristic.
  2.  **The Contractualist (Scanlonian):** Could support thresholds if no individual could "reasonably reject" a principle that allows trivial risks for the sake of vital industrial activity, provided the risks are distributed fairly. The threshold represents the boundary of reasonable rejectability.
  3.  **The Prioritarian:** Might support thresholds if the resources saved by not regulating trivial risks are redirected to alleviate severe poverty or grave dangers elsewhere.
  4.  **The Rights Theorist:** Could argue that rights are not absolute. A right to "pure air" is implausible; a right to "non-hazardous air" is plausible. The threshold defines "hazardous."

  **Where Underdetermination Lies:**
  The practice does not tell us *why* the threshold exists. Is it because the harm is too small to matter (Utilitarian/De Minimis)? Or because the right is not violated (Rights)? Or because we can't prove it (Epistemic)?
  *   If it is **Epistemic**, then new science lowering the detection limit should automatically lower the regulatory threshold. (Often it does, but with lag).
  *   If it is **Utilitarian**, then if abatement costs drop, the threshold should tighten even if science doesn't change. (This happens, but is contested).
  *   If it is **Rights-Based**, then cost should not matter; only the boundary of the right matters. (This is rarely the explicit logic of agencies like the EPA, which are mandated to consider cost in many, though not all, statutes).

  The practice masks these distinct justifications behind the single label of "Standard."

  ### IV. The Aggregative Counterfactual: Regulation Under Straightforward Aggregation

  If we replaced the current implicit view with **Straightforward Aggregation** (the view that $N \times \text{tiny harm} = \text{grave harm}$, and that moral significance sums linearly without threshold discontinuity), regulation would undergo a radical transformation. The "permit shield" would vanish.

  **1. Cumulative Impact Permitting:**
  Currently, a permit assesses the source's contribution in isolation (e.g., "Will this smokestack exceed 50 ppm?"). Under straightforward aggregation, permitting would require **Total Load Modeling**.
  *   *Mechanism:* A regional "budget" of harm would be calculated (e.g., "This valley can absorb 100 units of carcinogen risk").
  *   *Allocation:* Permits would not be based on technology or concentration limits, but on the remaining capacity of the aggregate. If the region is at capacity, no new source can emit, even if their individual contribution is *de minimis*.
  *   *Consequence:* This effectively creates a **cap-and-trade system for health risks**, not just pollutants.

  **2. Elimination of the Compliance Defense:**
  In the current system, complying with a permit is often a complete defense against nuisance or trespass claims. Under straightforward aggregation, **lawful compliance would not negate liability.**
  *   If your legal emission contributes 0.0001% to a community's cancer cluster, you are liable for that fraction.
  *   This shifts the system from **Regulatory Preemption** to **Strict Liability**. The state sets the standard, but the polluter pays for the actual damage caused, regardless of whether they met the standard.

  **3. Shift from Concentration to Dose:**
  Current regulation focuses on *concentration* (ppm in the air). Aggregation ethics focuses on *dose* (total intake by populations).
  *   Regulation would target the **sum of exposures** across time and sources.
  *   This requires personalized or demographic monitoring. A factory might be shut down not because its emissions are high, but because its emissions land on a vulnerable population (e.g., a school) where the *aggregate* dose crosses a moral threshold, even if the air concentration is low.

  **4. The "Repugnant Conclusion" Problem in Policy:**
  If we accept that trivial harms sum to grave harms, we face a paradox similar to Parfit's Repugnant Conclusion.
  *   *Scenario:* A policy creates a tiny headache for 10 billion people vs. a agonizing death for 1 person. Aggregation says the headaches might be worse.
  *   *Regulatory Implication:* Agencies would have to weigh widespread, trivial annoyances (noise, slight odor, minor aesthetic loss) as heavily as rare catastrophic risks.
  *   *Result:* Regulatory paralysis. Every activity causes some aggregate trivial harm. To avoid "grave" aggregate harm, almost all industrial activity would require justification against the sum of all its micro-nuisances.
  *   *Correction:* To avoid paralysis, the aggregative view would likely need a **discount rate for probability or distance**. We might aggregate harms, but weight them by causal proximity. However, this reintroduces a threshold-like structure, suggesting that pure aggregation is administratively impossible without re-introducing *de minimis* cut-offs.

  ### V. Conclusion: The Fiction of Zero

  The pattern of practice you identify presupposes a **functional fiction**: that sub-threshold risks are zero. It does not strictly presuppose this ontologically, but it requires it normatively to function.

  *   **Coherence:** The system is theoretically incoherent but pragmatically stable. It separates the *logic of production* (which requires certainty and non-aggregation to function) from the *logic of compensation* (which requires aggregation to satisfy justice).
  *   **Underdetermination:** The practice is a "big tent" that allows Utilitarians, Rights Theorists, and Pragmatists to agree on a number (the threshold) while disagreeing on why it matters.
  *   **Aggregative Alternative:** If we took aggregation seriously, the regulatory state would collapse into a liability state. Thresholds would not disappear but would shift from **per-source concentration limits** to **cumulative regional caps**. The "right to emit" would be replaced by a "duty to compensate for contribution," regardless of permissibility.

  Ultimately, the threshold is not a discovery of nature (where harm begins) but a political boundary (where we stop counting). The tension arises because the legal system refuses to admit that the boundary is political, pretending instead that it is scientific in regulation and moral in tort.
