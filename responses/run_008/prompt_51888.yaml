      *   *Claim 10: Conclusion.* "harm principle is therefore dead... contemporary liberals have quietly abandoned Mill's principle." -> **Non Sequitur based on errors.** If the premises about Mill are wrong, the conclusion about why liberals abandoned it is suspect. Liberals often adopt a refined harm principle (like Feinberg's), not necessarily abandoning it because of the corn dealer case (which Mill already solved).

