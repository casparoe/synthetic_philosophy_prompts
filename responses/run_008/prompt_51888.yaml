  2.  **Deconstruct Mill's *On Liberty* (Chapters 1 & 2):**
      *   **Chapter 1 (Intro):** Sets out the Harm Principle. "The only purpose for which power can be rightfully exercised over any member of a civilized community, against his will, is to prevent harm to others." His own good is not sufficient.
      *   **Definition of Harm:** Mill does not explicitly define "harm" as "any setback whatsoever to interests" in a way that excludes offense categorically, but he distinguishes between harm and mere dislike/offense. He acknowledges "perceptible hurt" to specific assignable individuals.
      *   **Chapter 2 (Liberty of Thought and Discussion):** Argues for absolute freedom of opinion and sentiment on all subjects (practical, speculative, scientific, moral, theological).
      *   **Connection between Ch 1 and Ch 2:** Chapter 2 is often seen as an application, but Mill treats liberty of thought as having a special status. However, he does introduce qualifications regarding *actions* based on opinions.
      *   **Corn Dealer Example:** Mill explicitly discusses this. Printing an opinion that corn dealers are starvers of the poor is safe. Delivering the same opinion to an excited mob assembled before the house of a corn dealer is not. This shows expression *can* be restricted if it constitutes a positive instigation to mischief.
      *   **Libel/Private Individuals:** Mill distinguishes between criticism of public institutions/conduct and private character. Libel/scrutiny of private life not relevant to public function can be punished.
      *   **Public Indecency:** Mill mentions violations of good manners in public may be prohibited. Not because they harm directly in the physical sense, but because they offend against public decency which individuals have a right not be subjected to involuntarily. This nuances the "offense never counts" claim.
      *   **J.F. Stephen:** *Liberty, Equality, Fraternity*. Critique of Mill. Argues coercion is good, morality needs enforcement.
