answer: |-
  The static wasn't white; it was textured. Like velvet rubbed the wrong way.

  "It's scattering," Silas said, rubbing his eyes. The monitor glow made him look sickly. "Interstellar medium playing tricks with a pulsar tail. It's nature, Mara. Not art."

  "Nature doesn't repeat prime sequences in base twelve," Mara replied. She didn't look away from the spectrogram. For six months, the argument had been the frame around the work. Was there a picture at all, or just a frame hanging on empty wall? Silas represented the universe's indifference; Mara represented the desperate need for it to care.

  To find the message, they first had to agree there was one. That was the first hurdle. If you assume noise, you filter out the anomaly. If you assume signal, you filter out the static. They had to build a consensus reality before they could build a decoder.

  "It's not base twelve," Silas muttered, though he stopped packing his bag. "It's harmonic resonance. You're seeing what you want to see."

  "And you're hearing silence because you're afraid of the noise."

  They didn't speak much outside the lab. Their marriage had dissolved years ago, replaced by this shared, sterile vigil. They knew each other's habits—the way Silas tapped his pen when lying, the way Mara held her breath when hoping—but they couldn't decode the intent anymore. They recognized the marks in the sand were writing, but they had lost the key to read each other.

  It took twenty years to crack the outer layer.

  The signal wasn't a broadcast; it was a lock. The civilization—dead for a million years, emanating from a dwarf galaxy now just cooling embers—hadn't sent data. They had sent a tool. The 'message' was a mathematical construct that required a specific consciousness to assemble. It demanded the reader understand geometry, time, and entropy before it would unlock.

  Humanity had to grow into the key.

  During the long waits for computation, Mara kept a letter in her desk drawer. It was from her father, written the week before he died. She had never opened it. She knew it was there (the frame), she knew it contained words (the outer structure), but she was terrified of the content. What if it was mundane? What if it was painful? What if it was nothing?

  Like the signal.

  When the final algorithm clicked into place, the lab was silent. Silas stood behind her chair. They had built a machine intelligence capable of holding the context required to interpret the data. The outer layer was stripped away. The decoding instructions had done their job: they had taught humanity how to listen.

  "Run it," Silas said. His voice was old now.

  Mara initiated the sequence. The screens flared, not with complex star charts or equations of state, but with text. Translated through the semantic bridge they had built together.

  It read: *WE WERE HERE. WE HOPED YOU WOULD SEE.*

  That was it. No wisdom. No technology. No warning about the heat death of the universe. Just a witness statement.

  Silas laughed, a dry, brittle sound. "That's it? We spent two decades proving intelligence exists across the light years for a cosmic graffiti tag?"

  He turned away, disappointed. The inner message was empty. The payload was negligible compared to the complexity of the ship that carried it.

  But Mara stayed seated. She looked at the screen, then at the static still rolling in the background.

  The meaning wasn't in the text. The text was just the receipt.

  The meaning was in the fact that they had had to become a civilization capable of distinguishing the signal from the noise to read it. The signal hadn't brought meaning; it had demanded it. The dead aliens hadn't transmitted knowledge; they had transmitted a test of worthiness. To understand the message, humanity had to synchronize, to agree on reality, to build a shared mind across languages and borders.

  The value wasn't what was said. It was that someone was listening.

  "It's not a letdown, Silas," Mara said softly.

  "It's empty," he snapped.

  "It's a mirror," she corrected. "They didn't send us a gift. They sent us a mirror. We only see 'We Were Here' because we became the kind of beings who care that someone was here."

  She looked at the drawer. The letter.

  She had spent twenty years waiting for the signal to tell her something about the universe. Instead, it told her about the listener. The struggle to decode Silas, to decode the static, to decode the signal—that struggle was the connection. The content was irrelevant. The contact was the point.

  Mara opened the drawer. She took out the envelope. The paper was yellowed, thin as a wing.

  She didn't need to know what her father wrote to know he wanted her to read it. The act of writing was the handshake. The act of reading was the return.

  She slit the envelope. She didn't look for wisdom. She looked for the hand that held the pen.

  "Silas," she said, not looking up. "Don't turn off the receivers."

  "Why? There's nothing left to hear."

  "Yes," Mara said, unfolding the paper. "But now we know how to listen."

  The static hummed, no longer empty, but full of potential. The universe was noisy, but the noise was where the meaning hid, waiting for someone to care enough to find the pattern.
