answer: |-
  ### 1. Does this configuration have an established name?

  There is no single, settled term in the academic or rationalist corpus that captures this specific two-step dialectical trap with perfect precision. You have correctly identified the near misses:

  *   **Bulverism:** (C.S. Lewis) This describes the act of assuming an opponent is wrong and then explaining *why* they hold that error (e.g., "You only say that because you are biased"). However, Bulverism does not necessarily include the second step where the *objection to the explanation* is itself absorbed as proof of the error.
  *   **Epistemic Kafkatrapping:** This is the colloquial term most often used in the rationalist community for this pattern. However, as you noted, "Kafkatrapping" properly refers to a moral/social dynamic where denial constitutes admission of guilt. Using it for epistemic claims dilutes the specific harm of the original concept (coerced confession) and conflates moral blame with probabilistic assessment.
  *   **Self-Sealing Argument:** This is too broad. It covers any hypothesis that cannot be falsified. Your pattern is more specific: it is a *dialectical posture* that renders the *opponent's* position unfalsifiable by converting their defense into data for the prosecution.
  *   **The Modesty Argument (Corrupted):** In the 2009–2014 modesty debates (Hanson vs. Yudkowsky), the legitimate Outside View was meant to temper overconfidence. This pattern is a weaponized corruption of that norm, but "Modesty Trap" is not a standardized term.

  **Verdict:** There is no established term that cleanly separates the *epistemic* nature of the trap from the *moral* nature of Kafkatrapping, while highlighting the *reference class* mechanism.

  ### 2. Coining a Term: Reference Class Immunization (RCI)

  I propose the term **Reference Class Immunization (RCI)**.

  **Definition:**
  Reference Class Immunization is a dialectical maneuver in which an interlocutor (B) dismisses a claim by assigning it to a reference class with a poor track record, and subsequently defends the composition of that reference class by treating any objection to its validity as a symptom of the very bias the class identifies.

  **Distinctions from Near Misses:**
  *   **Vs. Kafkatrapping:** Kafkatrapping seeks a *confession* of moral guilt; RCI seeks a *concession* of epistemic probability. Kafkatrapping relies on social power dynamics; RCI relies on statistical framing (outside views).
  *   **Vs. Fully General Counterargument (FGC):** An FGC is a static argument that defeats any position (e.g., "You can't know anything"). RCI is dynamic; it allows the object-level argument to exist, only to subsume it and the reaction to it into a higher-order diagnostic.
  *   **Vs. Reference Class Tennis:** Tennis implies two players actively proposing competing classes. In RCI, B monopolizes the right to define the class and immunizes it against A's counter-proposals.
  *   **Vs. Unfalsifiability:** Unfalsifiability usually attaches to a theory (e.g., "God exists"). RCI attaches to a *person* or *argument type* via a meta-diagnostic that renders the person's attempts at falsification self-defeating.

  ### 3. The Principled Marker: Falsifiability of the Diagnostic

  You asked for a principled marker that distinguishes legitimate Outside View usage from RCI, and specifically whether this marker is merely retrospective (i.e., "We only know it was RCI because A turned out to be right").

  **It is not merely retrospective.** There is a structural, observable marker available in real-time: **The Existence of Accepted Exit Conditions.**

  A legitimate Outside View is a Bayesian prior that accepts likelihood ratios. A degenerate RCI is a prior that assigns a likelihood ratio of 1:1 to all counter-evidence. You can distinguish them by asking a single procedural question:

  > *"What specific evidence would allow me to exit this reference class?"*

  **The Legitimate Outside View:**
  B says: "People who make models like this are usually wrong."
  A asks: "What would convince you my model is an exception?"
  B answers: "If you can show [Specific Criterion X] which previous failures lacked, or if your model predicts [Event Y] by [Date Z]."
  *Marker:* **The reference class is permeable.** There is a path to update. B has pre-committed to what constitutes a valid exception. The class was defined *before* the specific objection was raised, or at least allows for objective criteria that do not rely on B's subjective interpretation of A's mental state.

  **The Reference Class Immunization:**
  B says: "People who make models like this are usually wrong."
  A asks: "What would convince you my model is an exception?"
  B answers: "If you were the kind of person who could successfully exit the class, you wouldn't be arguing so defensively," or "The fact that you're asking for a way out shows you don't understand the outside view."
  *Marker:* **The reference class is impermeable.** The "Exit Conditions" are either undefined or defined such that attempting to meet them confirms membership.

  **Why this is not retrospective:**
  You do not need to wait to see if A's model works to identify RCI. You can identify it the moment B refuses to specify *any* state of the world under which A would be deemed "not biased" or "not in the failure class."

  If B claims that the *act of challenging the diagnostic* is itself the primary evidence for the diagnostic, without allowing for a distinction between *challenging it correctly* and *challenging it incorrectly*, they have severed the link between evidence and belief. They have created a **Closed Loop**.

  **The Principled Marker:**
  A legitimate Outside View treats the argument as **evidence** (which can be weighed).
  Reference Class Immunization treats the argument as **symptomatology** (which cannot be weighed, only diagnosed).

  If B cannot articulate a scenario where A's counter-argument *lowers* the probability that A is in the "wrong" reference class, then B is not doing epistemology; they are doing taxonomy of the defeated. This is observable in the moment of disagreement, regardless of the eventual truth of A's claim.

  **Summary:**
  The term is **Reference Class Immunization**.
  The marker is **the refusal to specify Exit Conditions that do not presuppose the conclusion.**
  The distinction is **permeability**: A legitimate outside view allows you to prove you are the exception; RCI interprets the attempt to prove it as confirmation of the rule.
