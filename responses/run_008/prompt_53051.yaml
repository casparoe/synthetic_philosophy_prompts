  ### Brainstorming Framings

  Before drafting the memo, I considered three philosophical lenses to resolve this deadlock. Each offers a different way to weigh the "Ordinary Day" against the "Founding Father."

  **1. The Epistemological Framing (Truth vs. Story)**
  *   *Argument:* The "Ordinary Day" is actually harder to prove than the "Founding Father." We have the ancestor's papers; we know what he owned and signed. The railroad worker's life requires inference. If we present the "Ordinary Day" as *the* truth, we risk fiction.
  *   *Application:* We could recommend the "Ordinary Day" theme only if we explicitly label the reconstruction as *interpretive*, using the Ancestor's papers as the "hard data" that constrained the worker's life.
  *   *Risk:* Makes the main gallery feel tentative ("we think this happened") compared to the donor gallery ("this definitely happened").

  **2. The Civic Framing (Polity vs. Population)**
  *   *Argument:* A "Statehood Bicentennial" celebrates the creation of a legal entity (the State). The Trustee is right: states are made of laws, borders, and elites, not just feelings. However, a Historical Society serves the *population*.
  *   *Application:* The exhibit must distinguish between the *State* (legal structure) and the *Society* (lived experience). The Ancestor represents the State; the Midwife represents the Society.
  *   *Risk:* Can feel like a sterile sociology lesson if not carefully integrated.

  **3. The Dialectical Framing (Power vs. Constraint)**
  *   *Argument:* History happens in the tension between those who make rules and those who live under them. Neither narrative is complete without the other. The pay stub exists *because* of the railroad owner; the ancestor's wealth exists *because* of the laborer.
  *   *Application:* This is the strongest path. It拒绝 (refuses) to treat them as separate galleries competing for space. Instead, it makes the relationship between the two the actual exhibit.
  *   *Decision:* I will use this framing. It allows us to accept the donor's funds (by honoring the ancestor's role) without capitulating to hagiography (by showing the ancestor as part of a system, not a hero). It validates the Curators' "history from below" while acknowledging the Trustee's point about political structure.

  ***

  ### MEMORANDUM

  **TO:** Exhibits Committee, State Historical Society
  **FROM:** [Your Name], Exhibits Committee
  **DATE:** October 24
  **SUBJECT:** Recommendation for Bicentennial Main Gallery Strategy

  **The Decision**
  I recommend we proceed with the **"One Ordinary Day"** concept as the primary narrative arc of the bicentennial exhibition, but structurally integrate the **Founder's Retrospective** as the contextual framework for that day.

  Regarding the trustee's offer: We should accept the donation for the *New Wing capital campaign*, but explicitly decouple it from *exhibit content control*. The ancestor's papers should be featured prominently, but not as a standalone shrine.

  Regarding space allocation: I propose a **70/30 split** in favor of the "Ordinary Day" narrative. This is not a compromise, but a reflection of **interpretive load**. Visitors understand the "Great Man" narrative intuitively; they require more space and objects to understand the systemic reality of ordinary life.

  **The Reasoning**
  Our deadlock stems from treating these two approaches as mutually exclusive: either we tell the story of the State (laws, governors, founders) or the story of the People (workers, families, daily survival). As a state historical society, our mandate is to preserve the record of the polity *and* reflect the experience of the populace.

  The "One Ordinary Day" approach is the stronger *museum experience*. Artifacts like a midwife's ledger or a laundry list create immediate emotional resonance. They allow visitors to project themselves into the past. However, the Head Curator's team must address the "Typicality Problem." A single diary is not a census. To present one worker's day as *the* state's experience is historically risky.

  This is where the Trustee's ancestor becomes essential—not as the hero of a separate show, but as the architect of the constraints the worker lived under. If the main gallery reconstructs 1905 through a railroad worker's pay stub, the adjacent context must explain who set the wage, who owned the line, and what laws protected (or failed to protect) that worker. The Founder's papers provide the "hard structure" (laws, capital, ownership) that makes the "ordinary life" (labor, survival, community) intelligible.

  By making the Founder the *context* rather than the *subject*, we honor his historical significance without reverting to hagiography. We show power, not just personality.

  **The Strongest Argument of the Dissenting View**
  We must be honest about what is lost by not giving the Trustee's ancestor the marquee solo retrospective. The Trustee is correct on a fundamental philosophical point: **A Bicentennial is the birthday of a State, not a Society.**

  Statehood is a legal and political act. It is defined by treaties, constitutions, and the decisions of men with the power to sign them. By prioritizing the "Ordinary Day," we risk obscuring the mechanisms of power that actually created the entity we are celebrating. The "History from Below" approach excels at showing how life was *lived*, but it often struggles to explain why the rules were *written*.

  If we minimize the Founder's role to a supporting character, we may fail to teach visitors how citizenship was defined, who was excluded from the franchise, and how the state's legal boundaries were drawn. These are unglamorous topics, often documented in dry papers rather than evocative diaries, but they are the bedrock of "statehood." If the exhibit focuses too heavily on the emotional texture of 1905, we may celebrate the *feeling* of the state while neglecting the *facts* of its formation. The Trustee's insistence on the Founder is, at its core, an insistence that we do not forget that history is driven by asymmetric power. We must ensure the 30% allocated to structural power is dense enough to carry that weight.

  **Next Steps**
  1.  **Development:** Meet with the Trustee to accept the gift for the *building*, clarifying that exhibit curation remains under professional standards (AAM guidelines).
  2.  **Curatorial:** Task the Head Curator with identifying the specific "Ordinary" figures whose lives can be directly linked to the Founder's economic sphere (e.g., the worker on the Founder's railroad).
  3.  **Design:** Allocate floor plan to reflect the 70/30 interpretive load, ensuring the "Power/Structure" section is not treated as a hallway but as the necessary key to decode the "Life/Experience" section.

  This approach secures the funding, preserves our curatorial integrity, and tells a more complete truth about what a state actually is.
