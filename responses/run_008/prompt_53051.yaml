prompt: |-
  I'm on the exhibits committee at our state historical society (volunteer position, I'm a retired accountant who likes history) and we're planning the big statehood bicentennial show for next year. Our head curator is pushing a "one ordinary day" concept: instead of the usual governors-and-treaties narrative, the main gallery would reconstruct a single day in 1905 through a railroad worker's pay stub, a midwife's account book, laundry ledgers, a tenant farmer's diary, that kind of thing — her claim is that this tells visitors more about how the state actually was than another hall of inauguration portraits and battle flags ever could. Our youngest curator backs her and keeps invoking that famous microhistory of the sixteenth-century Italian miller as proof that one obscure nobody can reveal a whole world. Meanwhile a longtime trustee — donor, and descendant of one of the founding families — wants the marquee space for a retrospective on his ancestor built around the family papers, and he's not-so-subtly reminding everyone that the new wing's fundraising depends on his goodwill. The committee is deadlocked and I've been asked to draft the written recommendation we circulate before the November meeting, and honestly I'm out of my depth.

  I want you to act as a philosopher of history who's also spent time in museums, and please think carefully before writing — maybe brainstorm a couple of framings first, then give me the memo itself. The hard part is that both sides have real arguments, not just donor politics. The ordinary-day people are basically running the history-from-below playbook: ordinary lives are the actual substance of the past, elite papers survive at wildly disproportionate rates, so "significance" as traditionally measured partly just reflects who had the literacy and leisure to leave records. But the trustee's side has a comeback I can't dismiss: the day-in-1905 exhibit would be partly reconstruction and interpretation — we'd be guessing at typicality from scraps, and our single reconstructed "ordinary" person might be as unrepresentative as any great man, just cherry-picked for being relatable (the midwife's account book survived because her grandson kept it, which is already not nothing). Plus a bicentennial is arguably a civic event about the state as a polity — founding decisions, who got included and excluded from citizenship — not only about how people lived day to day.

  So the deliverable is a decision memo the committee could act on: a concrete recommendation (whether to take the trustee's money at all, and what the actual gallery split should be, in rough percentages or square footage terms), the reasoning stated in terms the curators would recognize, and an honest treatment of the strongest point on whichever side loses — not a token paragraph. Please don't just split-the-difference as a cop-out; only recommend a split if you can give a principled reason why a split is right rather than just safe. If it helps, I don't care whether you name-drop the big-name historians and historians' debates or not, but I do want the committee members who've never read any of that stuff to be able to follow it. The memo should be short enough that people will actually read it before the meeting.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Philosopher of history with museum experience.
      *   **Task:** Draft a decision memo for a state historical society exhibits committee.
      *   **Context:** Statehood bicentennial show planning.
      *   **Conflict:**
          *   *Side A (Head Curator + Young Curator):* "One Ordinary Day" (1905). History from below, microhistory (Ginzburg's *The Cheese and the Worms* implied), everyday life over elites.
          *   *Side B (Trustee/Donor):* Retrospective on founding ancestor. Traditional political narrative, donor leverage (funding for new wing), civic/polynomial focus of a bicentennial.
      *   **User's Position:** Retired accountant volunteer, feels out of depth, wants a principled recommendation, not just a compromise.
      *   **Requirements:**
          *   Brainstorm framings first.
          *   Concrete recommendation (money, gallery split).
          *   Reasoning accessible to non-historians but rigorous enough for curators.
          *   Honest treatment of the losing side's strongest argument (no tokenism).
          *   Short enough to be read.
          *   Avoid "split the difference" cop-out unless principled.

  2.  **Brainstorming Framings & Philosophical Angles:**
      *   *Framing 1: The Function of a Bicentennial.* Is it a birthday party (celebratory, elite-focused) or an audit (critical, comprehensive)? A bicentennial marks the *state* as a legal entity. This leans toward Side B, *but* modern historiography argues the "state" is made of people (Side A).
      *   *Framing 2: Evidence vs. Narrative.* Side A has fragments (pay stubs, diaries) requiring heavy interpretation/reconstruction. Side B has a coherent archive (family papers) but risks hagiography. Which makes for better *museum* storytelling? Museums need objects, but they also need truthfulness.
      *   *Framing 3: The "Contract" with the Public.* Why do people visit? To see themselves (Side A) or to understand power structures (Side B)? A state historical society has a dual mandate: preserve the record of governance *and* reflect the populace.
      *   *Framing 4: The Donor Problem.* Taking the money creates a dependency that compromises mission. However, refusing it might kill the new wing. Is there a way to take the money without selling the soul? (Restricted gifts).
      *   *Framing 5: Microhistory vs. Macrohistory.* The "Ordinary Day" risks being unrepresentative (the "typicality" problem). The "Founding Father" risks being irrelevant to modern visitors. The solution isn't 50/50, it's *integration*.

  3.  **Developing the Recommendation:**
      *   *The Trap:* A 50/50 split satisfies no one and dilutes both narratives. It's a "cop-out."
      *   *The Principled Compromise:* The bicentennial is about the *formation* of the state. The "Ordinary Day" is the *substance* of the state. They shouldn't be competing galleries; they should be dialectical.
      *   *Decision:* Accept the donation *with strict curation independence*. Do not give the ancestor the "marquee" solo show. Instead, make the ancestor part of the "Power/Structure" narrative that contextualizes the "Ordinary Day."
      *   *Gallery Split:* 70% "The Lived Experience" (Ordinary Day expanded), 30% "The Structures of Power" (where the ancestor fits). Why? Because the "Ordinary Day" requires more space to explain context (otherwise it's just curios), whereas the elite narrative is already well-documented elsewhere.
      *   *Philosophical Core:* History is not just "what happened" (events/elites) nor just "how it felt" (experience), but the tension between the two. The exhibit should stage that tension.

  4.  **Drafting the Memo - Section by Section:**
      *   **Header:** Standard memo format.
      *   **Opening:** Acknowledge the stakes (bicentennial, funding, mission).
      *   **The Core Question:** Reframe the debate from "Elites vs. Ordinary" to "Structure vs. Experience."
      *   **Recommendation:**
          1.  Accept funds (with strings attached).
          2.  Gallery allocation (70/30).
          3.  Integration strategy (The ancestor contextualizes the ordinary).
      *   **Reasoning (The "Why"):**
          *   Address the Microhistory critique (typicality).
          *   Address the Bicentennial mandate (polity vs. people).
          *   Address the Donor issue (mission integrity).
      *   **The "Losing" Side's Strongest Point:** This is crucial. If I recommend the 70/30 split favoring the Curators, I must acknowledge the Trustee's valid point about the *polity*. If I recommend accepting the money, I must acknowledge the risk of influence. *Correction:* The prompt asks for an honest treatment of the strongest point on *whichever side loses*. If I side mostly with the Curators (Ordinary Day), I need to validate the Trustee's argument about the nature of a State Bicentennial.
      *   **Tone:** Professional, philosophical but accessible, decisive.

  5.  **Refining the Argument (Self-Correction during drafting):**
      *   *Critique:* Is 70/30 just a soft split?
      *   *Fix:* Justify it by the *labor of interpretation*. Ordinary life requires more explanation to make sense to a visitor than a biography does. A biography tells itself; a pay stub needs a wall of text to explain the economy. Therefore, space allocation isn't about importance, it's about interpretive load.
      *   *Critique:* What about the donor's ancestor?
      *   *Fix:* Don't banish him. Make him the "counterweight." Show how his decisions *affected* the railroad worker's pay stub. This validates the Trustee's desire for prominence while subordinating it to the historical truth (power dynamics).
      *   *Philosophical Hook:* Use the concept of "The Archive" vs. "The Experience." The Archive (Trustee) preserves power; The Experience (Curators) reveals cost. A State History museum needs both.

  6.  **Final Polish:**
      *   Check length.
      *   Ensure the "Philosopher of History" voice comes through (epistemological humility, focus on narrative construction) without being jargon-heavy.
      *   Make sure the "Strongest Point of the Loser" is robust. (If the Trustee "loses" the solo show, his point about the State as a legal entity must be honored).

  7.  **Final Review against constraints:**
      *   Brainstorm first? Yes.
      *   Memo format? Yes.
      *   Concrete recommendation? Yes.
      *   Honest treatment of losing side? Yes.
      *   No cop-out split? Yes (principled based on interpretive load).
      *   Accessible language? Yes.

  *(Self-Correction on the "Loser" constraint)*: The prompt says "honest treatment of the strongest point on whichever side loses." If I recommend a hybrid, who loses? The Trustee loses the *solo marquee* show. The Curators lose the *pure* "One Ordinary Day" concept (because it gets contextualized by power structures). I need to decide who "loses" more. The Trustee is losing the specific demand (solo retrospective). The Curators are getting their theme but modified. So the Trustee is the "loser" regarding the specific demand. I must validate his point about the Bicentennial being about the *State*.

  *Wait, a better philosophical angle:* The "One Ordinary Day" is actually *more* risky historically (speculative reconstruction) than the Family Papers (concrete artifacts). So the Curators are taking an epistemological risk. The Trustee is taking a moral risk (hagiography). I will recommend the Curators' theme but structured to acknowledge the Trustee's valid point about political foundations.

  *Let's settle on:* The Recommendation favors the Curators' *theme* (Ordinary Day) but integrates the Trustee's *ancestor* as the structural context. The Trustee "loses" the solo marquee status. I will validate his point about the definition of "Statehood."

  *Wait, one more check:* The prompt asks me to "think carefully before writing — maybe brainstorm a couple of framings first." I need to include this brainstorming in the output before the memo.

  *Okay, plan:*
  1.  Brainstorming Section (3 distinct framings).
  2.  The Memo.
  3.  Ensure the "Loser's Point" is a dedicated, strong section.

  *Let's refine the "Split":* Instead of square footage, let's talk about *narrative weight*. 70% of the narrative journey is the lived experience, 30% is the structural power. This justifies the space based on visitor learning curves, not just "importance."

  *Let's refine the Donor:* Accept the money, but designate it for the "New Wing Infrastructure," not the "Exhibit Content." This separates the capital campaign from the intellectual content.

  *Okay, ready to write.*
