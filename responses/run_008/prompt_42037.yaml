      *   *Knowledge Norm:* Rejects Lottery, Rejects Gettier, Rejects Falsehood, Accepts Selfless (if knowledge present), Rejects Moore (usually, as belief is required for knowledge).
      *   *Truth Norm:* Rejects Falsehood, Accepts Lottery (if true), Accepts Gettier (if true), Accepts Moore (if true).
      *   *Belief Norm:* Rejects Selfless, Rejects Moore, Accepts Falsehood (if believed), Accepts Lottery (if believed).
      *   *Justification Norm:* Accepts Lottery, Accepts Gettier, Accepts Falsehood (if justified), Accepts Selfless (if justified).

      *Problem:* TN and KN often align on Falsehoods (both say No). They diverge on Lottery (TN says Yes if true, KN says No). They diverge on Gettier (TN Yes, KN No).
      *Problem:* BN and JN often align on Falsehoods (both say Yes). They diverge on Selfless (BN No, JN Yes).

      *Indistinguishability:* Pure Truth Norm is hard to distinguish from Knowledge Norm without Lottery/Gettier cases where truth is present but knowledge is absent.
      *Incoherent Combos:* Asserting falsehoods are okay (JN) but Lottery assertions are not (KN)? That's possible (Knowledge Norm). Asserting falsehoods are NOT okay (TN) but Selfless assertion IS okay (JN)? That's a hybrid.

  5.  **Refining the Output:**
      *   Write the quiz clearly.
      *   Write the key with specific instructions for the TA.
      *   Include the "Honesty" section about indistinguishable positions.
      *   Include the "Destabilizing Case" section.

      *Self-Correction on Q2 (Selfless):* Standard view (Lackey): Selfless assertion is proper. BN says improper. KN is debated (does she know?). To make it diagnostic, assume she has *evidence sufficient for knowledge* but lacks belief. If KN requires belief for knowledge, KN says improper. If KN allows knowledge without belief (rare), KN says proper. Let's assume standard Williamson: Knowledge entails Belief. So KN says Improper. JN says Proper.
      *Wait, Lackey argues Selfless Assertion counters KN.* So if a student says "Proper," they are anti-KN (likely JN). If "Improper," they are pro-KN or pro-BN.
      *Actually, let's look at the standard Lackey case:* Teacher asserts evolution. Evidence is strong. She doesn't believe.
      *   BN: Improper (no belief).
      *   KN: Improper (no knowledge, because no belief).
      *   JN: Proper (justified).
      *   TN: Proper (true).
      *   *So "Proper" groups TN/JN. "Improper" groups KN/BN.*

      *Self-Correction on Q4 (Justified Falsehood):*
      *   Scenario: Doctor prescribes med based on best studies. Patient has rare reaction.
