answer: |-
  # Diagnostic Quiz: The Rules of Saying

  **Instructions:** Below are eight short scenarios. For each, select the option that best matches your intuition about whether the speaker did something wrong. There are no right or wrong answers; we are mapping your intuitions. Do not worry about technical philosophical terms; answer based on what seems reasonable to you.

  **1. The Lottery Ticket**
  Sarah holds one ticket in a fair ten-million-ticket lottery. The draw has not happened yet. Based purely on the odds, she tells her friend, "My ticket will lose." (As it happens, her ticket does lose.)
  *   A. Sarah's assertion was perfectly proper; the odds were overwhelmingly in her favor.
  *   B. Sarah's assertion was improper; she couldn't rule out winning before the draw.

  **2. The Reluctant Teacher**
  Mr. Henderson is a biology teacher. He has studied all the evidence for evolution and knows it is overwhelming. However, due to his upbringing, he personally cannot bring himself to *believe* the theory is true. In class, he asserts to his students, "Evolution is the best explanation for the diversity of life."
  *   A. Mr. Henderson acted properly; he presented the evidence as the science requires.
  *   B. Mr. Henderson acted improperly; you shouldn't assert what you don't personally believe.

  **3. The Stopped Clock**
  You walk into a room and look at a clock on the wall. It reads 2:00 PM. You assert to a colleague, "It is 2:00 PM." Unbeknownst to you, the clock stopped exactly 12 hours ago, but it is indeed 2:00 PM.
  *   A. Your assertion was proper; you checked the reliable clock and were right.
  *   B. Your assertion was improper; you were right only by luck, not because you knew the time.

  **4. The Medical Error**
  A doctor prescribes a medication based on all current medical guidelines and extensive testing. She asserts to the patient, "This drug is safe for you." Rarely, the patient has an unknown allergic reaction and becomes ill. The assertion turned out to be false.
  *   A. The doctor did nothing wrong; she was reasonable given the available evidence.
  *   B. The doctor did something wrong; she asserted something that turned out to be false.

  **5. The Lucky Lie**
  A spy wants to mislead an enemy agent. He asserts, "The meeting is in the warehouse," hoping the agent will walk into a trap. In fact, the meeting *is* in the warehouse, though the spy had no idea of this.
  *   A. The spy's assertion was proper; what he said was actually true.
  *   B. The spy's assertion was improper; he was lying and had no evidence.

  **6. The Challenge**
  You assert to a friend, "The bank will be open tomorrow." Your friend asks, "How do you *know* that?" You realize you have no specific proof, only that banks are usually open on Saturdays.
  *   A. You should retract your claim; if you can't answer how you know, you shouldn't have said it.
  *   B. You can stand by your claim; your general experience is enough support.

  **7. The Retraction**
  Yesterday you asserted, "It will rain today." It did not rain. When you see your friend today, you need to address your earlier claim.
  *   A. You should say, "I was wrong."
  *   B. You should say, "I was misled by the forecast."

  **8. High Stakes**
  Scenario A: You casually tell a friend the bank is open Saturday.
  Scenario B: You tell a friend the bank is open Saturday, but if you are wrong, they will be unable to pay their mortgage and lose their house. Your evidence is the same in both cases.
  *   A. Your assertion is equally proper in both scenarios.
  *   B. Your assertion is proper in Scenario A, but improper in Scenario B.

  ***

  # Scoring Key & Instructor's Guide

  ## 1. Mapping Answer Patterns to Positions

  Tally the student's choices. The following profiles correspond to the major normative theories. Note that few students will match perfectly; look for the *dominant* pattern.

  | Question | **Knowledge Norm (KN)** <br>*(Williamson)* | **Truth Norm (TN)** <br>*(Truth-Only)* | **Belief Norm (BN)** <br>*(Sincerity)* | **Justification Norm (JN)** <br>*(Reasonable Belief)* |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. Lottery** | **B** (Improper) | **A** (Proper) | **A** (Proper)* | **A** (Proper) |
  | **2. Selfless** | **B** (Improper)** | **A** (Proper) | **B** (Improper) | **A** (Proper) |
  | **3. Gettier** | **B** (Improper) | **A** (Proper) | **A** (Proper) | **A** (Proper) |
  | **4. Falsehood** | **B** (Improper) | **B** (Improper) | **A** (Proper) | **A** (Proper) |
  | **5. Lucky Lie** | **B** (Improper) | **A** (Proper) | **B** (Improper) | **B** (Improper) |
  | **6. Challenge** | **A** (Retract) | **B** (Stand) | **B** (Stand) | **B** (Stand) |
  | **7. Retraction** | **A** (Wrong) | **A** (Wrong) | **B** (Misled) | **B** (Misled) |
  | **8. Stakes** | **A** (Equal)*** | **A** (Equal) | **A** (Equal) | **A** (Equal) |

  *\*Belief Norm assumes the lottery ticket holder believes they will lose (which is common). If they suspend belief, BN aligns with KN.*
  *\*\*Standard KN entails belief. If knowledge requires belief, Selfless Assertion violates KN.*
  *\*\*\*Invariantist KN. Contextualist KN students will choose B.*

  ### Primary Diagnostics
  *   **The Knowledge Norm Student:** Consistently chooses **B** on 1, 3, 4, 5. They think truth isn't enough (rejects Lucky Lie/Gettier) and justification isn't enough (rejects Falsehood/Lottery).
  *   **The Truth Norm Student:** Chooses **A** on 1, 3, 5 (anything true is okay) but **B** on 4 (falsehoods are not okay). *Note: This is a rare position in pure form.*
  *   **The Belief Norm Student:** Chooses **A** on 4 (falsehoods okay if believed) but **B** on 2 and 5 (must believe what you say).
  *   **The Justification Norm Student:** Chooses **A** on 1, 2, 3, 4 (evidence is enough) but **B** on 5 (no evidence in Lucky Lie).
  *   **The Contextualist:** Chooses **B** on Question 8. This cuts across the other norms (a Contextualist about Knowledge will still likely reject Falsehoods).

  ## 2. Honest Limitations & Indistinguishabilities

  **A. The Truth/Knowledge Overlap on Falsehoods**
  You cannot distinguish the Truth Norm (TN) from the Knowledge Norm (KN) using *only* cases of false assertion (Question 4). Both norms forbid asserting falsehoods.
  *   *Diagnostic Fix:* You must rely on the **Lottery (Q1)** and **Gettier (Q3)** cases. TN permits these (if true); KN forbids them (no knowledge). If a student rejects Falsehoods but accepts Lottery assertions, they are likely Truth-Normers, not Knowledge-Normers.

  **B. The Belief/Justification Overlap on Falsehoods**
  Both the Belief Norm (BN) and Justification Norm (JN) permit asserting justified falsehoods (Question 4).
  *   *Diagnostic Fix:* You must rely on the **Selfless Assertion (Q2)**. JN permits it (evidence exists); BN forbids it (no belief). If a student accepts Falsehoods but rejects Selfless Assertion, they are likely Belief-Normers.

  **C. The "Lucky Lie" as a TN Filter**
  Question 5 is the strongest filter for the pure Truth Norm. Most students, even those inclined toward TN, will reject the Lucky Lie because it involves deception. If a student accepts the Lucky Lie (A) but rejects the Justified Falsehood (B), they hold a very rare, perhaps unexplored, "Truth-Only" view that ignores epistemic responsibility entirely.

  ## 3. Incoherent or Unexplored Combinations

  Watch for these answer profiles. They indicate confusion or a position not currently defended in the literature.

  *   **The "Fact-Checker" (Accepts Falsehoods, Rejects Lottery):**
      *   *Pattern:* Q4=A (Falsehood okay) but Q1=B (Lottery not okay).
      *   *Diagnosis:* This implies that evidence justifies falsehoods, but statistical certainty does not justify truths. This is theoretically unstable. Usually, if you allow justified falsehoods (JN), you allow lottery assertions (also justified).
      *   *Seminar Note:* Ask them: "What is the difference in epistemic support between the doctor's evidence and the lottery odds?"

  *   **The "Sincere Liar" (Rejects Selfless, Accepts Lucky Lie):**
      *   *Pattern:* Q2=B (Must believe) but Q5=A (Truth is enough).
      *   *Diagnosis:* They require belief for proper assertion generally, but think truth alone saves the liar. This suggests they value truth more than sincerity only when deception is involved.
      *   *Seminar Note:* Ask: "Is truth more important than sincerity only when you are trying to trick someone?"

  *   **The "Radical Contextualist" (Stakes affect Truth):**
      *   *Pattern:* Q8=B (Stakes matter) AND Q4=B (Falsehoods never okay).
      *   *Diagnosis:* If stakes raise the norm, does it raise it to Truth? If so, low-stakes falsehoods might be okay to them. If they say stakes matter *and* falsehoods are always wrong, they may be conflating *moral* wrongness with *epistemic* wrongness.
      *   *Seminar Note:* Distinguish "You shouldn't have said that (because it was risky)" from "You shouldn't have said that (because it violated a rule of assertion)."

  ## 4. Seminar Follow-Up: Destabilizing Cases

  Use the quiz results to group students or call on individuals during the seminar. Here is the most effective counter-case for each profile:

  | If the student matches... | Their Vulnerability | **Destabilizing Follow-Up Case** |
  | :--- | :--- | :--- |
  | **Knowledge Norm** | They reject assertions where the speaker is right and reasonable but lacks knowledge. | **The Selfless Assertion (Lackey):** Press them on the teacher. "If the teacher has all the evidence, and the students need to learn it, is he really doing something *wrong* just because of his private psychological state?" |
  | **Justification Norm** | They allow assertions in Gettier and Lottery cases. | **The Lottery Retraction:** "If the lottery ticket actually *wins*, and you challenge the asserter, they must say 'I was wrong.' But if JN is correct, they weren't wrong to assert. Why must they retract?" |
  | **Truth Norm** | They allow Lucky Lies and Gettier assertions. | **The Misleading Truth:** "If I tell you 'The treasure is in the cave' just to get you killed, and it happens to be there, did I really follow the rules of communication? Or did I violate the *purpose* of assertion?" |
  | **Belief Norm** | They reject Selfless Assertion. | **The Expert Witness:** "An expert witness must testify to the data even if they personally have doubts. Is a courtroom assertion governed by different rules than a chat with a friend?" |
  | **Contextualist** | They think stakes change the norm. | **The Knowledge Cut-off:** "At exactly what dollar amount does the assertion become improper? If the norm shifts with stakes, does the word 'know' change its meaning, or just the rules of use?" |

  ## 5. Administrative Note
  *   **Time:** This quiz should take students 6–8 minutes. Allow 2 minutes for scanning/handout distribution.
  *   **Anonymity:** Collect these anonymously if you want honest verdicts; students often feel pressure to select the "Knowledge" answer if they think it's the "smart" philosophical choice.
  *   **Data Use:** Do not grade this. Use it purely to generate a histogram for your own lesson planning. If 80% of the class scores as Justification Normers, spend less time defending JN and more time attacking it with Gettier cases.
