      *   KN: Improper (didn't know it was safe).
      *   JN: Proper (justified).
      *   BN: Proper (believed it).
      *   *So "Proper" groups JN/BN. "Improper" groups TN/KN.*

      *Combining Q2 and Q4:*
      *   If Proper on Q2 (Selfless) + Proper on Q4 (Falsehood) -> JN.
      *   If Improper on Q2 + Improper on Q4 -> KN.
      *   If Improper on Q2 + Proper on Q4 -> BN.
      *   If Proper on Q2 + Improper on Q4 -> TN.

      *This looks like a solid matrix.* I need to add Gettier and Lottery to split KN from TN further (since both reject falsehoods).
      *   Lottery (True, No Knowledge): TN says Proper. KN says Improper.
