prompt: |-
  I live in a death penalty state, and because I'm the kind of person who keeps spreadsheets about things, I've spent the last few years logging our governor's clemency decisions like I'm trying to reverse-engineer a decision function from revealed preference. His track record, compressed: he commuted the sentence of a getaway driver convicted under felony murder, where the evidence of the driver's role in planning rested partly on hair comparison work from analysts later discredited (though he was definitely at the scene); he refused to commute for a prison-gang boss who ordered a murder from his cell, caught on recorded calls arranging the whole thing, even though the boss never touched the victim — that one seems to rule out any simple "death only for the guy who personally pulls the trigger" rule; he commuted for a shooter with an IQ somewhere in the 60s (the exact number is disputed) whose conviction involved conflicting ballistics and two eyewitnesses who later got wobbly; and he refused to commute for a man who premeditated the murder of strangers during a robbery, essentially caught red-handed, clean trial, basically no mitigation offered. As far as I can tell deterrence does zero visible work anywhere in this record, but honestly its unfalsifiable from these cases, none of them sort by it.

  Here's my problem. I sit on the clemency board (non-voting, long story, my partner is very tired of hearing about it) and the next petition is the wierdest one yet. The crime is about as bad as it gets: kidnapping, torture, planned over weeks, victim a total stranger. So maximal culpability, zero mitigation anyone has found. But the physical evidence tying him to the scene leans heavily on bite-mark comparison from the state's odontology unit — the same unit that's had two other convictions vacated — and one of the two eyewitnesses has since recanted. Every court affirmed the conviction though, and by all accounts the trial itself was textbook clean: competent defense, no misconduct, everything above board. What's the call if the governor wants to be consistent with his own record? Both rules I can fit to his past decisions seem to point in opposite directions here, and I want to know if there's something I'm missing.

  So: retrace the verdicts with me. What are the live candidate rules (culpability-proportionality, some kind of residual-doubt threshold where death is reserved for functionally certain guilt, or even a lazier "only commute when there's a headline" PR story), which of them actually fits everything he's done so far, and what does each one predict for this petition? Which precedent is the closest analog? Give me your best guess with your reasoning, tell me what principle the board would be quietly adopting if we recommend each way, and — since I'll be sitting on this board for future petitions — design the case that would actually discriminate between the rules, because every one I come up with feels contrived. I'm less interested in what's morally right than in what his revealed policy is, but if the two come apart here I'd want to know that too.
