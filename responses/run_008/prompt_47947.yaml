prompt: |-
  last night my friend and i got into a really long argument about Aristotle and slavery, and I want to check what he told me before I conceed anything. his rundown went roughly like this: Aristotle held that some people are slaves by nature, and this was straight-up apologia for the Athenian institution -- he was giving philosophical cover to what his society was already doing, and that's all the doctrine amounts to. he thought you could read who the natural slaves are off their bodies, since nature supposedly gives slaves big strong frames for labor while free men get upright bodies unfit for labor but suited for civic life. natural slaves, he said, have no share in reason whatsoever, same as animals -- that's why they can't deliberate at all and need a master to deliberate for them. and since they're reasonless, their enslavement can't be for their own good in any sense; it's purely an arrangement for the master's benefit, and Aristotle was fine with that. finally, he believed the actual slaves in Athens, the ones taken in war, were natural slaves, so conquest legitimately produces slavery.

  then he wrapped it all up with: "so the natural slave doctrine was just the ideology of the slaveholding class dressed up in biology, and it does no real argumentative work -- Aristotle's position collapses the moment you notice that actual Greek slaves weren't different in kind from their masters, which even he basically grants."

  is this a fair summary? go claim by claim and tell me what an Aristotle scholar would accept, what they'd wince at, and what is just wrong -- and tell me whether his wrap-up conclusion follows from whatever parts of the summary survive correction. for what it's worth I'm inclined to agree with him that there's an element of apologia there, but I feel like he's flattening something in the middle claims, I just can't put my finger on what. also I'd want to know if the errors, if there are any, are connected or just separate slips -- like does fixing one of them make the wrap-up look better or worse.
