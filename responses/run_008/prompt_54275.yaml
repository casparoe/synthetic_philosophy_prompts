      *Self-Correction on Deflationary vs. Eliminativism:* Deflationary says "The colony doesn't have a mind *over and above* the ants." Eliminativism says "Nothing has a mind." The quiz needs to distinguish these. Q1 (Neurons) and Q6 (Cities) help here. If they say humans have minds but colonies don't because it's just ants -> Deflationary/Reductionist. If they say humans don't really have minds either -> Eliminativism.

