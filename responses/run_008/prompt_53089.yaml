          *   Payoff: If the selected record says "Heads" and Coin was Heads, win. If "Tails" and Coin was Tails, win.
          *   *Wait, this is exactly the betting argument Thirders use.* Halfers will say "You are weighting Tails scenarios more heavily because they produce more records."
      *   *Need:* A scenario where the *causal impact* is singular, not sampled from the records.
      *   *Idea 4: The "Monday-Only" Mechanism (with a twist).* Suppose the payoff depends on what she does on Monday. But she doesn't know if it's Monday.
          *   If Heads: Monday exists.
          *   If Tails: Monday exists (and Tuesday).
          *   Payoff condition: "We look at what you did on Monday. If you guessed the coin right, you win."
          *   *Analysis:*
              *   Beauty wakes up. She doesn't know if it's Monday or Tuesday.
              *   If it's Tuesday, her action is irrelevant (causally inert).
              *   If it's Monday, her action matters.
              *   She must maximize Expected Utility (EU).
              *   $EU(Action) = P(\text{Monday}) \times P(\text{Coin} | \text{Monday}) \times \text{Payoff} + P(\text{Tuesday}) \times 0$.
              *   Actually, simpler: $EU = P(\text{Monday} \land \text{Correct}) \times V$.
