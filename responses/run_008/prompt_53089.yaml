  Here is a proposal for a thought experiment designed to meet your professor's constraints. It isolates the disagreement about *indexical conditionalization* (what day is it?) rather than just the coin, and it structures the payoff so that the "double-counting" objection is unavailable.

  ### The Thought Experiment: "The Monday Lockbox"

  **The Setup**
  Use the standard Sleeping Beauty protocol: A fair coin is tossed on Sunday.
  *   **Heads:** Beauty is awakened on Monday only.
  *   **Tails:** Beauty is awakened on Monday and Tuesday.
  *   Amnesia drug is administered between awakenings.

  **The Decision**
  Upon each awakening, Beauty is presented with two boxes: **Box H** and **Box T**. She must choose exactly one.
  *   **Box T** is a simple button press (zero effort).
  *   **Box H** requires solving a complex cognitive puzzle to open (high effort).

  **The Payoff Structure (Crucial)**
  At the end of the experiment, the Experimenters look *only* at the choice made on **Monday**.
  *   If the Monday choice matches the Coin (Box H on Heads, Box T on Tails), Beauty wins **\$100**.
  *   If the Monday choice mismatches the Coin, she wins **\$0**.
  *   **Any choice made on Tuesday is shredded unread.** It has zero causal impact on the payoff.

  **The Cost**
  Choosing Box H incurs a subjective "effort cost" equivalent to **\$15**. (Choosing Box T costs \$0).
  *   *Note:* This cost is incurred *every time* she chooses Box H, regardless of whether it is Monday or Tuesday. Effort is experienced locally, even if the payoff is not.

  **The Question**
  Upon awakening (without knowing the day or the coin), which box should Beauty choose to maximize Expected Utility (EU)?

  ---

  ### Analysis of Positions

  Here is how the three major positions calculate the Expected Utility.

  #### 1. The Lewis Halfer
  *   **Credences:** $P(\text{Heads}) = 1/2$. Upon awakening, she assigns $P(\text{Monday} | \text{Heads}) = 1$ and $P(\text{Monday} | \text{Tails}) = 1/2$.
  *   **Conditional Probability:** She calculates the probability of Heads *given that her action matters* (i.e., given it is Monday).
      $$P(\text{Heads} | \text{Monday}) = \frac{P(\text{Monday} | \text{Heads})P(\text{Heads})}{P(\text{Monday})}$$
      $$P(\text{Monday}) = (1 \times 1/2) + (1/2 \times 1/2) = 3/4$$
      $$P(\text{Heads} | \text{Monday}) = \frac{1/2}{3/4} = 2/3$$
  *   **Expected Utility:**
      *   **EU(Box H):** She pays the cost (\$15) now. She wins \$100 only if it is Monday *and* Heads.
          $$EU(H) = P(\text{Heads} \land \text{Monday}) \times 100 - 15$$
          $$P(\text{Heads} \land \text{Monday}) = 1/2$$
          $$EU(H) = 50 - 15 = 35$$
      *   **EU(Box T):** No cost. Wins \$100 if it is Monday *and* Tails.
          $$EU(T) = P(\text{Tails} \land \text{Monday}) \times 100$$
          $$P(\text{Tails} \land \text{Monday}) = 1/4$$
          $$EU(T) = 25$$
  *   **Recommendation:** **Choose Box H.** (The high probability of Heads on Monday outweighs the effort cost).

  #### 2. The Thirder
  *   **Credences:** $P(\text{Heads}) = 1/3, P(\text{Tails}) = 2/3$. She treats the three awakenings ($H_1, T_1, T_2$) as equiprobable ($1/3$ each).
  *   **Conditional Probability:**
      $$P(\text{Monday}) = P(H_1) + P(T_1) = 2/3$$
      $$P(\text{Heads} | \text{Monday}) = \frac{P(H_1)}{P(\text{Monday})} = \frac{1/3}{2/3} = 1/2$$
  *   **Expected Utility:**
      *   **EU(Box H):**
          $$P(\text{Heads} \land \text{Monday}) = 1/3$$
          $$EU(H) = (1/3 \times 100) - 15 = 33.33 - 15 = 18.33$$
      *   **EU(Box T):**
          $$P(\text{Tails} \land \text{Monday}) = 1/3$$
          $$EU(T) = (1/3 \times 100) = 33.33$$
  *   **Recommendation:** **Choose Box T.** (The probability of Heads on Monday is only 50%, so the effort cost makes Box H a losing proposition).

  #### 3. The Double Halfer
  *   **Credences:** $P(\text{Heads}) = 1/2$ always. Crucially, upon learning it is Monday, they maintain $P(\text{Heads} | \text{Monday}) = 1/2$ (rejecting the Lewis update).
  *   **Expected Utility:**
      *   **EU(Box H):** $(1/2 \times 100) - 15 = 35$. (Wait, $P(H \land Mon)$ depends on their $P(Mon)$).
      *   If they maintain $P(H)=1/2$ and $P(H|Mon)=1/2$, then $P(Mon)$ must be 1 (impossible) or they reject standard conditionalization.
      *   *Standard Double Halfer View (e.g., Titelbaum):* They agree with Thirders on $P(H | \text{Monday}) = 1/2$.
      *   **EU(Box H):** $(1/2 \times 100) - 15 = 35$? No, the joint probability $P(H \land Mon)$ is the kicker.
      *   If $P(H|Mon) = 1/2$ and $P(T|Mon) = 1/2$, then the payoff odds are even.
      *   **EU(Box H):** $50 - 15 = 35$. **EU(Box T):** $50$.
      *   *Correction:* If $P(H|Mon) = 1/2$, then $P(H \land Mon) = 1/2 \times P(Mon)$. $P(T \land Mon) = 1/2 \times P(Mon)$. The ratio is 1:1.
      *   **EU(Box H):** $0.5 \times \text{Payoff} - \text{Cost}$. **EU(Box T):** $0.5 \times \text{Payoff}$.
      *   Since Cost > 0, **EU(T) > EU(H)**.
  *   **Recommendation:** **Choose Box T.** (Aligns with Thirder in this specific case).

  ---

  ### What Feature Is Doing the Work?

  The divergence is driven by the **mismatch between causal efficacy and subjective frequency.**

  1.  **Causal Efficacy is Singular:** Only Monday matters for the prize. This prevents the Thirder from arguing "I get paid twice on Tails," and it prevents the Halfer from arguing "You are double-counting the Tails bet." There is only one bet, but its *location* is uncertain.
  2.  **Cost is Local:** The effort cost is paid *every time* she acts. This forces her to weigh the probability of "Today is Monday" against the coin toss.
  3.  **The Divergence Point:** The case turns entirely on $P(\text{Heads} | \text{Monday})$.
      *   Lewis Halfers believe learning "it is Monday" (or reasoning about Monday's efficacy) provides evidence for Heads (because Heads guarantees Monday, while Tails dilutes it with Tuesday).
      *   Thirders (and Double Halfers) believe "it is Monday" does not shift the coin odds from 50/50 *conditional on being on a day that exists for both outcomes*.

  **If you remove the feature:**
  *   **If Tuesday also counted (Standard Betting):** The Halfer objects that the Thirder is counting the Tails payoff twice. The case collapses into the standard Dutch Book debate.
  *   **If there was no effort cost:** The Thirder becomes indifferent ($EU(H) = EU(T)$), while the Halfer still prefers H. This is a divergence, but weaker (Action vs. Indifference). The cost forces a strict preference reversal.

  ### The Halfer Attack (How to Steelman the Objection)

  A sophisticated Halfer (specifically a Lewis Halfer) will not accept the calculation above. They will attack the **decision-theoretic framework** of the case.

  **The Objection:** "You are asking me to maximize Expected Utility conditional on a proposition I do not know ('It is Monday'). But I am not *on* Monday specifically; I am in an epistemic state that spans Monday and possibly Tuesday. Rational action should be based on a **policy** chosen on Sunday, not a credence update on Monday."

  **The Argument:**
  1.  On Sunday, Beauty knows the setup. She can pre-commit to a strategy: "Always choose H" or "Always choose T."
  2.  If she chooses "Always H": She pays the cost twice on Tails, once on Heads. She wins on Heads (Mon), loses on Tails (Mon).
  3.  If she chooses "Always T": She pays cost zero. She loses on Heads (Mon), wins on Tails (Mon).
  4.  The Halfer argues that because the Tuesday action is *experienced* (even if causally inert regarding the prize), the *disutility* of the effort on Tuesday must be counted in the Sunday policy.
  5.  **Halfer Policy Calculation:**
      *   **Policy H:** Cost = $15 \times (1 \text{ on } H + 2 \text{ on } T) = 45$ (weighted by coin 1/2). Expected Cost = $22.5$. Payoff = $50$. Net = $27.5$.
      *   **Policy T:** Cost = $0$. Payoff = $50$. Net = $50$.
      *   **Result:** Even the Halfer should choose **Box T** if reasoning from a Sunday policy perspective that accounts for the *experience* of effort on Tuesday.

  **Why this matters for your paper:**
  This reveals that the "Monday Lockbox" case forces a choice between two decision-theoretic norms:
  1.  **Evidential Decision Theory (Thirder-friendly):** Maximize utility based on current credences about causal efficacy ($P(H|\text{Mon})$).
  2.  **Policy-Based/Timeless Decision Theory (Halfer-friendly):** Maximize utility based on the global strategy chosen before the amnesia, accounting for all experienced costs.

  The Halfer can concede the math ($P(H|\text{Mon}) = 2/3$) but deny that this is the correct input for the decision function when the agent is uncertain about *which* agent-instance is causally efficacious.

  ### Settled vs. Contested (For Your Paper)

  To maintain the neutrality your professor wants, distinguish these clearly:

  **Settled Formal Facts:**
  *   Everyone agrees on the setup mechanics (Coin is fair, Amnesia is perfect).
  *   Everyone agrees on the payoff structure (Monday only).
  *   Everyone agrees on the algebra: *If* you accept $P(H|\text{Mon}) = 2/3$, you choose H. *If* you accept $P(H|\text{Mon}) = 1/2$, you choose T (given the cost).
  *   No one disputes that Thirders hold $P(H|\text{Mon}) = 1/2$ and Lewis Halfers hold $P(H|\text{Mon}) = 2/3$.

  **Contested Interpretations:**
  *   **The Meaning of Credence:** Does $P(H|\text{Mon})$ represent the rational degree of belief for an agent *in* the experiment, or is it a misleading artifact of conditioning on self-locating information?
  *   **The Unit of Agency:** Is the rational agent the "awakening instance" (who should care only about today's efficacy) or the "person over time" (who should care about the total effort expended across all awakenings)?
  *   **Relevance of Tuesday:** The Thirder says Tuesday is irrelevant to the prize, so Tuesday's effort shouldn't sway the decision *if* we know the prize is Monday-locked. The Halfer says Tuesday is irrelevant to the prize, *but* the effort is real, so a rational policy must minimize total effort across the experiment.

  ### Summary for Your Proposal
  This case works because it moves the debate from "Betting Odds" (where stakes scale with awakenings) to "Causal Efficacy" (where stakes are fixed but location is uncertain). It forces the Halfer to defend why their $2/3$ conditional probability shouldn't dictate action, while forcing the Thirder to defend why the Tuesday effort doesn't invalidate the Monday-focused calculation. It creates a clean divergence in recommended action (H vs T) based strictly on the $P(H|\text{Mon})$ dispute, without inviting the "double-counting" rebuttal.
