              *   Heads: 1 signal sent.
              *   Tails: 2 signals sent.
              *   Probability of selecting a Tails-signal is higher if Tails is true.
              *   This favors Tails. This is the Thirder betting argument again.
      *   *Idea 6: The "Random Awakening Selection" (Exogenous).*
          *   Before the experiment, a random day $D \in \{\text{Mon}, \text{Tue}\}$ is selected with probability 1/2 each.
