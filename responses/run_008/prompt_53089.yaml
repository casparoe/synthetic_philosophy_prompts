          *   Win if: ($D=\text{Mon}$ and Coin=H) OR ($D=\text{Tue}$ and Coin=H).
          *   But if Coin=H, Tuesday doesn't happen. So ($D=\text{Tue}$ and Coin=H) is impossible/no-awakening.
          *   So Win if: $D=\text{Mon}$ and Coin=H.
          *   $P(\text{Win} | G=H) = P(D=\text{Mon}) \times P(H) = 1/2 \times 1/2 = 1/4$.
          *   Win if Guess Tails ($G=T$):
          *   Win if: ($D=\text{Mon}$ and Coin=T) OR ($D=\text{Tue}$ and Coin=T).
          *   $P(\text{Win} | G=T) = (1/2 \times 1/2) + (1/2 \times 1/2) = 1/4 + 1/4 = 1/2$.
