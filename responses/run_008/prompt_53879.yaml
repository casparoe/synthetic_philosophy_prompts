          *   *Let's look at the "Progress" claim (6).* If 7 is true (I will be condemned), 6 is shaky. But 6 is necessary for 3 (Indictment).
          *   *Okay, the winner:* **Commitment 5 (The Fair-Opportunity Principle).** It is the linchpin of the conflict. If the planter is *not blameworthy*, the indictment (3) loses its human target. If the reader *must* condemn (4), 5 is a lie.
          *   *Revision:* Change "not blameworthy" to "contextually constrained." He is still blameworthy for the harm, even if his horizon was limited. This is hard but necessary for moral fiction.
          *   *Wait, is there a better way?* What if we distinguish between *moral guilt* and *historical responsibility*?
