answer: |-
  Here is the specification you asked for. It is drafted as a set of functional requirements for a theory of technological politics. If a theory cannot meet these criteria, it is fit for opinion pages but not for reporting.

  ### The Desiderata: A Spec for Technological Politics

  **1. The Material Agency Requirement**
  *   **The Spec:** The theory must explain how an artefact can enforce a social order without issuing a verbal command or relying on a human enforcer. It must account for politics that operate through physical or logical constraint.
  *   **The Case:** Langdon Winner's Robert Moses overpasses. Whether or not the historical anecdote is perfectly accurate, the logic holds: if a bridge is built low enough, buses cannot pass. If buses carry the working class and the wealthy drive cars, the bridge sorts the population without a policeman in sight.
  *   **Why it matters:** Without this, you cannot distinguish a speed bump from a speed limit sign. One persuades; the other compels.

  **2. The Contextual Variance Requirement**
  *   **The Spec:** The theory must allow for the same artefact to exhibit opposing political valences depending on the regime in which it is deployed. It cannot assign a fixed moral or political weight to the technology itself.
  *   **The Case:** Encrypted messaging. In an authoritarian state, Signal is a human-rights tool protecting dissidents. In a liberal democracy, the same protocol can be a harassment-coordination tool shielding abusers from accountability.
  *   **Why it matters:** If the theory says encryption is *inherently* liberatory, it fails when used by extremists. If it says it is *inherently* dangerous, it fails when used by journalists under threat.

  **3. The Protocol Normativity Requirement**
  *   **The Spec:** The theory must identify politics embedded in standards, APIs, and invisible architectures, not just visible hardware. It must detect assumptions about human behaviour baked into the code's logic.
  *   **The Case:** Google/Apple Exposure Notification. The protocol assumed a specific model of infection (proximity via Bluetooth) and privacy (decentralised data). It baked a specific public health strategy into the OS level, making alternative tracing models (like centralised government databases) technically impossible to implement on those devices.
  *   **Why it matters:** This captures the "soft" politics of design choices that look technical but dictate social organisation.

  **4. The Distributive Exclusion Requirement**
  *   **The Spec:** The theory must account for how access requirements function as class filters. It must distinguish between a feature that is merely inconvenient and one that systematically disqualifies a demographic.
  *   **The Case:** Your building's phone app entry. By requiring a bank card on file, the system does not merely verify identity; it verifies creditworthiness. It quietly decides that unbanked guests are less welcome, turning a security feature into a class barrier.
  *   **Why it matters:** This distinguishes "partisan" politics (Labour vs. Tory) from "distributive" politics (who gets access to the common good).

  **5. The Drift Requirement (Resistance and Repurposing)**
  *   **The Spec:** The theory must not treat design as fate. It must accommodate the empirical fact that users misuse, hack, workaround, or repurpose technologies in ways designers did not anticipate.
  *   **The Case:** Everyday adoption facts. People use dating apps for friendship; they use productivity software to organise labour unions; they put foil over webcams.
  *   **Why it matters:** If a theory claims the technology determines the outcome, it is falsified every time a user finds a loophole.

  **6. The Intentionality Independence Requirement**
  *   **The Spec:** The theory must separate the politics of the artefact from the intentions of the manufacturer. A designer's virtue does not guarantee a virtuous tool, and a designer's malice is not required for a harmful tool.
  *   **The Case:** Moses may or may not have been racist; the bridge still blocks the bus. Conversely, a well-meaning team can build a contact tracing app that inadvertently enables surveillance.
  *   **Why it matters:** This stops the "but they didn't mean to" defence and the "they are evil" conspiracy theory. We are judging the thing, not the soul of the maker.

  ***

  ### Status of Requirements: Non-Negotiable vs. Camp-Specific

  **Non-Negotiable (Empirical Constraints)**
  These are not ideological preferences; they are observations of reality. A theory that contradicts these is factually wrong.
  *   **The Contextual Variance Requirement:** It is an observable fact that technologies function differently in different regimes.
  *   **The Drift Requirement:** It is an observable fact that users subvert designs.
  *   **The Intentionality Independence Requirement:** It is an observable fact that outcomes diverge from intentions.

  **Camp-Specific (Ideological Commitments)**
  These are often treated as requirements by specific schools of thought, but should be treated as claims to be tested.
  *   **The Material Agency Requirement:**
      *   *Sacred to:* STS (Science and Technology Studies) and Techno-determinists.
      *   *Rejected by:* The "Neutrality" crowd (Instrumentalists), who argue only humans have agency.
  *   **The Protocol Normativity Requirement:**
      *   *Sacred to:* The "Code is Law" crowd (Lessig et al.).
      *   *Rejected by:* Traditional political scientists, who argue politics only happens in legislatures, not in C++ code.
  *   **The Distributive Exclusion Requirement:**
      *   *Sacred to:* Critical theorists and Marxists.
      *   *Rejected by:* Libertarians, who view market-based access (like the bank card) as a neutral feature of commerce, not a political exclusion.

  ***

  ### The Jointly Unsatisfiable Pair

  Here is the tension that will make your head hurt, and which you should put in your piece. You cannot fully satisfy **The Material Agency Requirement** and **The Drift Requirement** simultaneously without redefining what "politics" means.

  *   **The Conflict:** If the politics are *in* the artefact (Material Agency), then the bridge *is* racist, and the code *is* controlling. But if users can successfully workaround, repurpose, or ignore the design (The Drift), then the politics were not truly *in* the artefact; they were merely suggested by it.
  *   **The Contradiction:** You cannot claim an artefact *determines* a political outcome (Winner's strong claim) while also admitting that users *reinterpret* the outcome (The STS claim).
  *   **The Implication:** If you respect the Drift, you must admit that "politics" is not a property of the object (like weight or colour), but a relationship between the object and the user. This means no artefact is *inherently* political, only *potentially* political. This undermines the headline "New Tech is Inherently Political," which is likely why your editors love it and you hate it.

  ***

  ### The Killer Requirement

  If you must choose one requirement to rule out the popular positions, it is **The Contextual Variance Requirement**.

  Here is how it clears the field:

  1.  **It kills the Neutrality View:** If technology were truly neutral, its political effects would not fluctuate wildly based on context. A hammer is neutral because it drives nails regardless of the regime. If an app protects dissidents in Iran but aids harassers in London, it is not a neutral tool; it interacts with power structures. The Neutrality crowd cannot explain the variance without admitting the tool has affordances that favour certain power dynamics.
  2.  **It kills Winner's Strong Claim:** Winner argues the artefact *has* the politics. But if the encryption app changes sides depending on the country, the politics are not *in* the app. They are in the relationship between the app and the state. This forces you to downgrade Winner's claim from "Artefacts have politics" to "Artefacts crystallise specific political relationships."
  3.  **It kills "Code is Law":** This view suggests the code dictates the rule. But if the context changes the outcome, the code is not the law; the context is. Code is merely a suggestion that is harder to ignore than a statute.

  **The Verdict:**
  Using **The Contextual Variance Requirement** forces you to write a more honest story. You stop asking "Is this tech good or bad?" and start asking "Which power structures does this tech amplify, and in which environments?" It moves the piece from a moral judgement of the machine to a sociological analysis of the system.

  That is the spec. If your next 3,000 words don't meet these criteria, you're just writing a review of a product, not an investigation of power.
