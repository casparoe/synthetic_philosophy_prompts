prompt: |-
  hi, so i'm a journalist who covers science and ideas, mostly longform stuff, and I keep getting assigned pieces where some new tech is declared "inherently political" and then someone else in my DMs insists the tech is neutral and it's all in who uses it. I've written the blockchain-libertarian story, the biased-algorithm story, the "does social media make us worse people" story, and honestly each time I feel like im making it up as I go along, because nobody ever tells me what would COUNT as an artifact carrying politics in the first place.

  So before I write another 3,000 words on this, I want the spec, not the takes. Write me the desiderata: what any adequate theory of whether and how artifacts get to have politics has to deliver. The cases it must get right — I'd include Langdon Winner's old thing about the Robert Moses overpasses on the Long Island parkways that supposedly kept buses off, the way the same encrypted messaging app reads as a human-rights tool in one country and a harassment-coordination tool in another, and covid contact tracing, where the Google/Apple exposure-notification design baked a whole model of who you might have infected into the protocol itself. Also this one from my own life: my building swapped keys for a phone app that requires a card on file with the bank, which quietly decided that unbanked guests are less welcome. Distinctions it has to respect — built-in politics vs politics of a particular deployment, the artifact's politics vs the manufacturer's intentions, and honestly whether "political" here means partisan, distributive, or something about who has to adapt to whom. Results it cant contradict — everyday facts about adoption and repurposing, the way people misuse things, the fact that designs get reversed or worked around.

  For each requirement, give me the case or consideration behind it. Then tell me which are non-negotiable and which are just what one camp (the STS people, the techno-determinists, the "it's just a tool, humans all the way down" crowd) treats as sacred. And the bit I most want: point out any pair of requirements that look jointly unsatisfiable — like whether you can respect the fact that users reinterpret everything and still say anything is built in at the artefact level. Finally, briefly: which single requirement does the most work ruling out the popular positions — Winner's, the neutrality view, and the "code is law" line. Don't score them all in detail, I'll do that in the pub.

  Also please write it in British English throughout — behaviour, labour, organised, artefact (yes I know I spelled it the other way above, i've been in america too long), that sort of thing. And keep it at the level a working journalist can actually use, not a literature review — I'm not asking for reading lists or citations, just the thinking. cheers!
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**

      *   **User:** A science/ideas journalist (longform).
      *   **Problem:** Constantly assigned "is tech political?" stories. Feels like they are making it up because there's no clear spec/criteria for what counts as an artifact having politics.
      *   **Task:** Write the *desiderata* (requirements/specifications) for an adequate theory of technological politics.
      *   **Key Cases to Cover:**
          *   Langdon Winner's Robert Moses overpasses (buses excluded).
          *   Encrypted messaging (human rights tool vs. harassment tool).
          *   Covid contact tracing (Google/Apple protocol embedding infection models).
          *   User's personal case: Phone app entry requiring bank card (excludes unbanked).
      *   **Key Distinctions to Respect:**
          *   Built-in politics vs. politics of deployment.
          *   Artifact politics vs. manufacturer intentions.
          *   Meaning of "political" (partisan, distributive, adaptation).
      *   **Results it Can't Contradict:** Adoption/repurposing, misuse, workarounds/reversals.
      *   **Structure:**
          *   List requirements with the case/consideration behind each.
          *   Label non-negotiable vs. camp-specific (STS, determinists, instrumentalists).
          *   Identify jointly unsatisfiable pairs (tensions/trade-offs).
          *   Identify the single requirement that does the most work ruling out popular positions (Winner, Neutrality, Code is Law).
      *   **Tone/Style:** British English (behaviour, labour, organised, artefact), working journalist level (no academic jargon/literature review, just clear thinking).

  2.  **Deconstruct the Core Philosophical Problem:**

      *   The tension is between *technological determinism* (tech drives society), *social constructivism* (society drives tech), and *instrumentalism* (tech is neutral).
      *   Winner's "Do Artefacts Have Politics?" is the anchor.
      *   The journalist wants a "spec" – essentially, a set of necessary conditions for a theory to be useful.

  3.  **Drafting the Desiderata (The Requirements):**

      *   *Req 1: The Moses Test (Material Agency).* The theory must explain how physical design enforces social order without explicit commands. (Winner's overpasses).
      *   *Req 2: The Context Switch (Interpretive Flexibility).* The theory must account for the same artefact having opposite political valences in different contexts. (Encryption app).
      *   *Req 3: The Hidden Norm (Embedded Assumptions).* The theory must identify politics baked into protocols/standards, not just visible hardware. (Covid tracing).
      *   *Req 4: The Exclusion Mechanism (Distributive Effects).* The theory must capture how access requirements create class barriers. (Bank card entry).
      *   *Req 5: The Drift (Resistance/Repurposing).* The theory cannot treat the design as fate; it must allow for workarounds. (Misuse/Adoption).
      *   *Req 6: Intentionality Independence.* The theory must distinguish between what designers *meant* and what the artefact *does*. (Moses might have lied, but the bridge stands).

  4.  **Categorising Requirements (Non-negotiable vs. Camp-Specific):**

      *   *Non-negotiable:* Must handle the empirical reality (Context Switch, Drift, Exclusion). If a theory ignores that people hack things, it's wrong. If it ignores that bridges block buses, it's wrong.
      *   *Camp-Specific:*
          *   STS (Science & Technology Studies): Loves "Interpretive Flexibility" and "Intentionality Independence."
          *   Techno-determinists: Love "Material Agency" but hate "Drift."
          *   Instrumentalists ("Just a tool"): Hate "Material Agency" and "Hidden Norms."

  5.  **Identifying Jointly Unsatisfiable Pairs (The Tension):**

      *   This is the crux. How can something be *inherently* political (Req 1 & 3) if users can *reinterpret* it completely (Req 2 & 5)?
      *   *The Conflict:* "Embedded Normativity" vs. "Interpretive Flexibility." If the politics are in the code/brick, how can they change when the context changes?
      *   *Resolution hint:* Politics isn't a property like weight; it's a relationship. (Save this for the analysis).

  6.  **Identifying the "Killer" Requirement:**

      *   Which one kills the most popular bad takes?
      *   *Neutrality View:* Killed by "The Moses Test" (Material Agency).
      *   *Code is Law (Lessig):* Killed by "The Drift" (Resistance/Repurposing).
      *   *Winner's Strong Claim:* Killed by "The Context Switch" (Politics isn't stable).
      *   *Selection:* "Interpretive Flexibility" (The Context Switch) is probably the strongest filter because it kills hard determinism *and* hard neutrality. But actually, **"Intentionality Independence"** is quite strong against the "tool" view. Let's look closer.
      *   *Refinement:* The requirement that **"Politics is a Relation, not a Property"** isn't a requirement listed, it's the *solution*. The requirement that breaks the deadlock is **The Drift (Resistance/Repurposing)**. It stops "Code is Law." But **The Moses Test** stops "Neutrality."
      *   *Decision:* The prompt asks for the single requirement that does the most work ruling out popular positions.
      *   *Candidate:* **The Distinction between Embedded Norms and Enforced Outcomes.** Or simply **Requirement 5 (The Drift)**.
      *   *Better Candidate:* **Requirement 2 (The Context Switch).** Why? Because it forces the theory to admit that the artefact doesn't hold the politics alone; the *situation* does. This undermines Winner's strong claim (that the bridge *is* racist) and the Neutrality claim (that the bridge is just concrete). It forces a relational view.
      *   *Actually, looking at the prompt:* "Which single requirement does the most work ruling out the popular positions — Winner's, the neutrality view, and the 'code is law' line."
      *   Winner says artefacts *have* politics. Neutrality says they *don't*. Code is Law says code *enforces* politics.
      *   The requirement that **"Politics must be distinguishable from Intention"** is good, but doesn't kill Code is Law.
      *   The requirement that **"The theory must account for successful workarounds"** kills Code is Law.
      *   The requirement that **"The theory must account for physical exclusion"** kills Neutrality.
      *   The requirement that **"The theory must account for contextual variance"** kills Winner's essentialism.
      *   *Selection:* I will argue that **The Context Switch (Interpretive Flexibility)** is the heavy lifter. It forces the admission that politics isn't *in* the thing, but *between* the thing and the world. This invalidates the Neutrality view (it's not empty) and the Strong Winner/Code is Law view (it's not fixed).

  7.  **Drafting the Content (incorporating British English):**

      *   *Spelling:* Artefact, behaviour, labour, organised, programme, centre, etc.
      *   *Tone:* Professional, sharp, analytical, not academic. "Here is the spec."
      *   *Structure:*
          1.  Intro (acknowledging the fatigue).
          2.  The Desiderata (numbered list with cases).
          3.  Status of Requirements (Non-negotiable vs. Camp).
          4.  The Tension (Jointly Unsatisfiable).
          5.  The Killer Requirement.

  8.  **Refining the Arguments (Self-Correction during drafting):**

      *   *Check:* Did I include the bank card case? Yes, need to ensure it's linked to distributive politics.
      *   *Check:* Did I include the Covid case? Yes, linked to protocol/standards.
      *   *Check:* British English. (Watch out for "z" in "organized" -> "organised", "artifact" -> "artefact").
      *   *Check:* Journalist level. Avoid terms like "actor-network theory" or "hermeneutics" unless explained simply. Keep it practical.
      *   *Check:* The "Jointly Unsatisfiable" section needs to be clear. It's the tension between *affordance* and *appropriation*.
      *   *Check:* The "Killer Requirement." I need to be decisive here. I'll choose **Requirement 2 (Contextual Variance)** because it forces a relational definition of politics, which is the only way to satisfy the others without contradiction.

  9.  **Final Polish:**

      *   Ensure the distinction between "partisan," "distributive," and "adaptation" is mentioned in the distinctions section.
      *   Make sure the "Non-negotiable" section clearly delineates what *must* be true vs. what is ideological.
      *   Verify the "Moses" story is treated with the nuance it deserves (historical accuracy is debated, but the *logic* holds).

  10. **Final Review against constraints:**
