  I've got to write a position statement for my phil of science reading group and I want someone to audit it before I embarass myself in front of people who actually know this literature. You're a professional philosopher who teaches Quine and Carnap for a living — think hard before you give verdicts, don't just pattern-match to "Quine = no a priori, end of story." Maybe brainstorm the pairwise combinations first.

  Here's roughly where I've landed:

  (1) Quine basically wins in Two Dogmas: there's no philosophically workable analytic/synthetic line, and everything — logic and math included — is revisable in principle. There's no class of truths held true come what may and immune to recalcitrant experience.

  (2) Math is nonetheless a priori. If experiments kept coming out strange you'd go fix the physics, you wouldnt start tinkering with Peano arithmetic. Mathematicians just aren't answerable to experiment the way chemists are.

  (3) Carnap's internal/external distinction from Empiricism, Semantics, and Ontology survives Quine's attack just fine. Inside a number-framework, "are there numbers?" has a trivial answer; outside any framework, choosing the number-framework is a pragmatic decision about what's useful, not a theoretical question with a truth value.

  (4) Local synonymy is unproblematic: "bachelor" does mean unmarried man (modulo the usual silly edge cases people bring up — the pope, male seals, whatever), and "all bachelors are unmarried" is true purely in virtue of meaning.

  (5) I accept confirmation holism: evidence bears on the web of belief in large bundles, so no individual claim carries its own discrete empirical content.

  So: go through the pairs of these and tell me which ones are in real tension and how badly, which ones only look like they are, and for each genuine tension what the cheapest fix would be and what it costs. Then tell me which single revision would clean up the most. To be clear I dont know where the problem is and I'm not secretly protecting any one of these — if you tell me it's all consistent, fine, but you have to say why the obvious-looking clashes dissolve.

  End your reply with \answer{N} where N is the number of the one commitment that has to go, or \answer{none} if the package hangs together as stated.
