  my wife and i are doing IVF and something that came up at the clinic has been living rent-free in my head for weeks. we've got a handful of viable embryos and we're choosing which one to implant first. i said half-jokingly on a forum that whichever we pick "is" our kid and the others just... aren't, and someone replied that no — if we'd implanted embryo B instead of A, we'd have a completely different child, and the child we'll actually have would never exist at all. then someone ELSE said that's wrong, the kid from embryo B would still be our kid, just a different version of her, the way i'm a different version of me depending on whether i'd gone to uni in Leeds or Manchester.

  and now i genuinely can't stop thinking about it. if we'd conceived naturally, any of a few hundred million sperm could have reached the egg first, and it seems bizarre that exactly one specific combination produces "our daughter" and every other one produces a stranger. but equally the child from embryo B would presumably look different, act different, be different. so is she a different child, or the same child differently realised? does it even make sense to ask how many "possible children" we've got sitting in a freezer? i gather there's an actual philosophical literature on this — something about whether you could've had a different origin and still been you — but i've never read any of it properly.

  explain what the live positions are, which one you'd actually endorse and why, and whether any of this should make us feel weird about choosing between embryos at all (is it choosing between children, or choosing which child exists, or neither?). under 300 words please — i'm not writing a dissertation, i just want to know how to think about my own kid before she exists.
