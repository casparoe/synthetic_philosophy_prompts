      *   **Marcus (Dampener):** Needs to avoid the "nothing matters" nihilism trap. He needs to argue that the *proportion* of value we can affect shrinks, or that the reference class changes. He needs to be careful about the "completed artifact" claim (it's not about determinism, it's about where the value *is*).

  3.  **Drafting - Section by Section:**

