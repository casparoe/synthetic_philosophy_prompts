          *   *Concession:* Marcus admits his argument collapses without SIA. Elena admits SIA is contentious enough that it shouldn't fully drive global priority setting.

      *   **Conclusion:** Identify the Crux.
          *   Is it anthropics (SIA vs. SSA)?
          *   Is it moral (Absolute vs. Relative impact)?
