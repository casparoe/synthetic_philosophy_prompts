          *   *Elena:* Utilitarianism usually cares about the numerator (total good produced), not the percentage of total possible good.
          *   *Insight:* They realize the crux is about whether moral motivation scales with *absolute* impact or *relative* leverage/significance.
      *   **Topic 4: Credence & Reasoning (SSA vs. SIA):**
          *   *Marcus:* SIA favors the simulation hypothesis (more observers like us). SSA is more neutral.
