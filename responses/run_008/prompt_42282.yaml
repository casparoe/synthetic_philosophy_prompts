  *Crux Identification:* The crux should be about whether we should maximize *expected absolute impact* (Elena) or whether the *probability of being in a high-impact position* (Marcus) should dampen our confidence in the longtermist thesis. Actually, the deepest crux is likely about **Anthropics (SIA vs SSA)** combined with **Moral Realism regarding Simulated vs Base Value**.

