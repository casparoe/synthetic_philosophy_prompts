      *   *Setting:* A quiet corner of a conference, post-talk.
      *   *Structure:* Intro -> Artifact/Leverage -> Population/Anthropics -> General Principle -> Crux.

  *(Self-Correction during drafting the "Completed Artifact" section)*: I need to be careful. Marcus's point isn't just determinism. It's that the *value* resides in the compute running the sim, not the sim itself. If the sim is turned off, the base reality people still exist. Elena needs to counter that the *simulated* people matter morally. Marcus agrees they matter, but there are fewer of them than base people (potentially) or their duration is limited by server time. Actually, the prompt says "mature civilizations would run enormous numbers of ancestor simulations." This implies *more* simulated minds. So Marcus's argument must be about *leverage over the base*, not numbers. Wait, the prompt says: "simulated minds overwhelmingly outnumber unsimulated ones... changes the population ethics." Okay, so Marcus argues that if most minds are sims, and sims have limited leverage over the base, then *most* value is in the base, and we probably aren't there.
