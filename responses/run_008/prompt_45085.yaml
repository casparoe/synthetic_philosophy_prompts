answer: |-
  1. Plot the available sales data against the historical baseline or category proxy to detect structural breaks or stationarity. The step passes if variance is explainable by known seasonality; otherwise, a human must judge whether the product's underlying demand driver still exists.
  2. Scan for external shocks like promotions, weather, or supply constraints that explain deviations from the baseline. The step passes if deviations align with known events; otherwise, the analyst must make a judgment call on whether to overweight recent data over historical averages.
  3. Generate forecasts using both a stable historical average and a responsive recent-trend model to measure divergence. The step passes if predictions converge within an acceptable margin; if not, a human must decide whether stability or responsiveness is more valuable for this specific SKU.
  4. Calculate the financial cost of overstocking versus understocking for this specific item based on margin and spoilage rates. The step passes if costs are symmetric; if asymmetric, the analyst must judge the appropriate safety stock buffer to favor the less expensive error type.
  5. Write down the single biggest risk that could invalidate this number, such as a supply chain disruption or weather event. The step passes if a mitigation plan is documented; otherwise, the analyst must judge whether to reduce order size or increase review frequency to limit exposure.
