  Thinking Process:

  1.  **Analyze the Request:**
      *   **User:** Demand forecasting analyst for a mid-sized grocery chain.
      *   **Problem:** Tension between "trust last year's numbers" (stationarity/induction) and "the world changes" (non-stationarity/bias). No standard procedure, leading to ad-hoc decisions based on who argues loudest.
      *   **Theoretical Background:** User knows about No-Free-Lunch theorems and Hume's induction problem but needs practical application.
      *   **Task:** Create a procedure consisting of exactly five numbered steps.
      *   **Constraints:**
          *   Each step must be runnable on any forecasting question in under an hour.
          *   Each step must specify: what to check, what counts as passing, and where human judgment is required (because no checkable answer exists).
          *   Each step must be 1-2 sentences.
          *   No intro or conclusion.
          *   Must cover both stable history cases and volatile/new cases (e.g., new oat milk, unexplained flour spike).
          *   Must be actionable on a "Tuesday morning."

  2.  **Deconstruct the Forecasting Problem:**
      *   The core tension is between *stability* (past predicts future) and *change* (structural breaks, new products, external shocks).
      *   A good procedure needs to assess data quality, stability, external context, model selection/weighting, and risk management.
      *   It needs to acknowledge where math stops and judgment begins (Hume's point).

  3.  **Drafting the Steps (Iterative Process):**

      *   *Step 1: Data Stability/Relevance.* Need to check if past data is actually relevant.
          *   Draft: Plot the last 2 years of sales against current trends to identify structural breaks or seasonality shifts. Pass if the variance is within 20% of historical norms; otherwise, flag for human review on whether the underlying demand driver still exists.
          *   Critique: A bit too specific on percentages. Needs to cover new products too.
          *   Revision: Compare the recent 8-week trend against the historical baseline to detect structural breaks or stationarity. Pass if the deviation is explainable by known seasonality; fail if unexplained, requiring a human judgment call on whether the product's demand driver still exists.

      *   *Step 2: External Context.* Need to check if something outside the data is happening.
          *   Draft: Scan for known external shocks like holidays, weather, or supply chain issues that aren't in the sales numbers. Pass if all major events are accounted for; otherwise, the analyst must judge whether to overweight recent data over historical averages.
          *   Critique: Good. Covers the "flour spike" scenario.
          *   Revision: Scan for external shocks like promotions, weather, or supply constraints that explain deviations from the baseline. Pass if deviations align with known events; otherwise, require a human judgment call on whether to overweight recent data over historical averages.

      *   *Step 3: Model/Method Selection.* Need to address the "old-timers vs. data science" fight.
          *   Draft: Run both a simple historical average and a responsive moving average to see how much they diverge. Pass if the forecasts are within 10% of each other; if not, a human must decide whether stability or responsiveness is more valuable for this specific SKU.
          *   Critique: Addresses the tension directly.
          *   Revision: Generate forecasts using both a stable historical average and a responsive recent-trend model to measure divergence. Pass if predictions converge within a acceptable margin; if not, a human must decide whether stability or responsiveness is more valuable for this specific SKU.

      *   *Step 4: Uncertainty/Risk.* Need to address the cost of errors (over vs under).
          *   Draft: Calculate the cost of overstocking versus understocking for this specific item based on margin and spoilage. Pass if the costs are symmetric; if asymmetric, the analyst must manually adjust the safety stock level to favor the cheaper error.
          *   Critique: Crucial for grocery (spoilage vs lost sales).
          *   Revision: Calculate the financial cost of overstocking versus understocking for this specific item based on margin and spoilage rates. Pass if costs are symmetric; if asymmetric, the analyst must manually adjust the order quantity to favor the less expensive error type.

      *   *Step 5: Final Sanity Check/Hume's Limit.* Acknowledge the unknowable.
          *   Draft: Review the final number against intuition and store feedback. Pass if it feels right; otherwise, admit the limit of prediction and set a review date to update the forecast sooner than usual.
          *   Critique: Needs to be more about the "no free lunch" aspect—acknowledging the bet being made.
          *   Revision: Document the specific assumption about the future that makes this forecast valid, such as "no supply chain disruption" or "consistent weather." Pass if the assumption is explicit; otherwise, the analyst must set a shorter review cycle to validate the assumption before the next order.

