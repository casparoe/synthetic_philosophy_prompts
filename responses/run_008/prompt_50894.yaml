  **MEMORANDUM TO THE BOARD OF TRUSTEES**

  **FROM:** [Your Name], Trustee
  **TO:** The Board of Trustees
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding Treasury Oversight and Founder Status

  **I. PURPOSE**

  This memo serves as the basis for our vote next month regarding the conduct of our Treasurer and Founder, the financial loss of approximately $1.3 million in endowment principal, and our subsequent obligations to our donors and regulators. We face two competing impulses: to treat this as a breach of trust requiring severe sanction, or to treat it as a tragic error by a dedicated servant requiring compassionate retirement.

  Neither option fully addresses the reality of what occurred. This memo argues that we must recognize a third category of failure: **willful ignorance.** We must act decisively to protect the foundation's future while acknowledging the complex psychology of the past.

  **II. THE FACTS**

  For two years, our annual letters and public communications stated the endowment was "on solid ground." In reality, we spent down principal at 8% annually. The Treasurer received quarterly statements during this period. Testimony from fellow trustees indicates he frequently avoided agenda items regarding investments, stating he preferred not to look when "markets are ugly." When confronted, he did not deny avoiding the data. He asserts he genuinely believed the losses were temporary and that the endowment would recover before anyone noticed. He claims he never knowingly spoke a falsehood.

  **III. THE QUESTION OF SELF-DECEPTION**

  The divide on this board stems from how we interpret the Treasurer's state of mind. One side argues that avoiding the statements proves he knew the truth and lied. The other argues that his genuine belief in a recovery proves he made an honest mistake.

  Both views assume that "knowing" and "not knowing" are mutually exclusive. Human psychology suggests otherwise. It is possible to suspect a truth so frightening that one actively arranges their life to avoid confirming it. This is not ordinary lying, where I know *X* is true and tell you *Y*. This is a process where I suspect *X* might be true, but I refuse to open the envelope that would force me to admit *X*, allowing me to tell you *Y* while maintaining the internal story that I believe *Y*.

  The Treasurer did not lie to us in the cold blood of a fraudster. He lied to himself first. He managed his own knowledge to preserve his self-image as a capable steward. By refusing to look at the statements, he insulated his belief from reality.

  **IV. WHY THIS IS NOT EXCULPATORY**

  Recognizing that self-deception is psychologically possible does not mean it is ethically permissible for a fiduciary. In fact, in our position, it is arguably more dangerous than simple negligence.

  To the trustees who argue this is an "honest mistake": An honest mistake implies engagement with the facts that led to a wrong conclusion. Avoiding the facts is not engagement; it is abandonment. A trustee's primary duty is not to be right about the market; it is to pay attention to the reality of the assets. By choosing emotional comfort over evidentiary rigor, the Treasurer breached his fiduciary duty. We cannot retain him, nor can we allow his resignation to be framed as a standard retirement. To do so would signal to our donors that we value the comfort of our leadership over the safety of their gifts.

  To the trustees who argue this is "straightforward dishonesty": While the outcome is the same as fraud (donors were misled), the intent matters for how we proceed legally and reputationally. There is no evidence he diverted funds for personal use. There is no evidence he altered documents. He was guarding the foundation from a truth he couldn't bear, not lining his own pockets. Treating this as criminal fraud would be factually inaccurate and would invite a legal battle that would consume the remaining endowment in fees. It would also be a betrayal of a man who gave twenty years of service, however flawed the end became.

  **V. RECOMMENDATIONS**

  We must thread the needle between justice and mercy. We must hold the Treasurer accountable for the breach of duty without prosecuting him for a crime he did not commit.

  **1. Status of the Treasurer (Effective Immediately upon Vote)**
  *   **Action:** The Treasurer must resign from the Board and the position of Treasurer immediately.
  *   **Reasoning:** He has demonstrated an inability to confront negative financial data. He cannot remain in a governance role.
  *   **Title:** He will be stripped of the title "Treasurer" in all future official capacities. He may be referred to historically as "Founding Director," but with a footnote in our internal archives regarding the governance failure. We will not grant "Emeritus" status, as that implies honor.

  **2. Regulatory and Legal Obligations (Deadline: 60 Days)**
  *   **Action:** We will file an amended Form 990 and notify the State Attorney General's Charities Bureau.
  *   **Content:** The filing will state that the foundation experienced a "governance failure regarding investment oversight" resulting in principal drawdown. It will explicitly state that there is **no evidence of personal financial gain or criminal fraud** by the former Treasurer.
  *   **Reasoning:** We owe regulators transparency. Hiding this risks our tax-exempt status if discovered later. Clarifying the lack of personal gain protects the Treasurer from criminal investigation while acknowledging the institutional failure.

  **3. Financial Liability (Deadline: Immediate)**
  *   **Action:** We will **not** pursue personal restitution from the Treasurer for the lost $1.3 million.
  *   **Condition:** The Treasurer must agree to pay the full cost of the forensic audit and the legal fees associated with this transition (estimated at $45,000).
  *   **Reasoning:** Pursuing the principal loss is unlikely to succeed in court without proof of malice, and would drain his personal retirement. However, requiring him to cover the cost of cleaning up the mess ensures he bears a tangible consequence for the negligence.

  **4. Communication to Donors (Deadline: 30 Days)**
  *   **Action:** A signed letter from the Board Chair (not the Treasurer) to all donors.
  *   **Key Language:** "We discovered a significant discrepancy between our reported endowment health and reality. This was caused by a failure of oversight and an over-reliance on optimistic projections that were not verified against market data. We have replaced the leadership responsible for financial reporting. We are implementing new controls to ensure this cannot happen again."
  *   **Reasoning:** We must not use the word "fraud" (inaccurate) nor "mistake" (too soft). "Failure of oversight" is the truth. We must admit we were wrong without making the Treasurer the sole scapegoat; ultimately, the *Board* is responsible for overseeing the Treasurer.

  **5. Future Governance (Deadline: 90 Days)**
  *   **Action:** Adopt a new Investment Policy Statement requiring dual-signature verification of all quarterly reports and a mandatory annual third-party review of spending rates.
  *   **Reasoning:** Systems must prevent reliance on any single individual's psychological comfort.

  **VI. ADDRESSING THE DISSENT**

  **To those who seek stricter punishment:** You are right that trust was broken. But our goal is the survival of the foundation, not the ruin of a man. A criminal referral would freeze our assets during investigation. By accepting his resignation and the payment of audit fees, we secure immediate leadership change and financial accountability without inviting a war of attrition we cannot afford.

  **To those who seek a softer landing:** You are right that he loved this foundation. But love without truth is sentimentality, not stewardship. If we allow him to retire with honors, or if we soften the language to donors, we become complicit in the deception. We would be prioritizing his feelings over the donors who trusted us. The kindest thing we can do for him now is to let him face the consequence of his avoidance, so he may find peace in the truth he avoided.

  **VII. CONCLUSION**

  Self-deception is a human failing, but in a fiduciary, it is a disqualifying one. We can acknowledge the Treasurer's anguish without accepting it as an excuse. We remove him to save the foundation. We spare him criminal referral to save our resources. We tell the donors the hard truth to save our reputation.

  I move that we adopt this course of action.

