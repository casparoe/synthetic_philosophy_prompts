answer: |-
  Final Examination: Democratic Theory
  Time Allowed: 90 Minutes
  Total Marks: 25

  Read the following scenario carefully. The Republic of Costa Serrana is a mid-sized state whose demos currently consists of all adult citizens. Its territory includes Isla Cardonal, an island annexed sixty years ago whose inhabitants pay taxes and are subject to its courts but were never offered citizenship. The state hosts roughly 400,000 guest workers on rolling five-year permits, some of whom have now lived there for two decades. A lithium mine on the Costa Serranan side of the border is leaching waste into a river that 2 million people in the neighboring Republic of Alvea depend on. There is a national debate about whether the declining birthrate means today's voters are obliged to give weight to the interests of the not-yet-born. Finally, about 300,000 citizens live permanently abroad but still vote by mail.

  Write an essay addressing the following three requirements. First, diagnose which of these groups presents a hard case for the all-affected interests principle and which for the all-subjected-to-coercion principle, explaining why neither principle cleanly covers every case. Second, adjudicate these conflicts by arguing for a specific rule of inclusion or exclusion for at least three of the groups, rather than simply listing options. Third, confront the regress objection that the boundary problem cannot be solved by any principle because the very people who would apply the principle are themselves picked out by it. Your answer should demonstrate a clear argumentative stance rather than a survey of the literature.

  The following is a model answer that demonstrates the expected depth and stance.

  The boundary problem in Costa Serrana reveals that neither the all-affected interests principle nor the all-subjected-to-coercion principle offers a seamless solution, requiring a hybrid approach that prioritizes subjection for membership while accommodating affected interests through alternative representation. The inhabitants of Isla Cardonal and the long-term guest workers present the strongest case for the all-subjected-to-coercion principle. While guest workers hold temporary permits, those residing for two decades are subject to the coercive apparatus of the state in a manner indistinguishable from citizens, fulfilling the subjection criterion. Isla Cardonal inhabitants are similarly subjected to courts and taxes without representation, constituting a democratic deficit. However, the all-affected principle struggles here because granting membership based solely on subjection might exclude those deeply affected by specific policies but not generally subjected to the state's coercive rule. If we rely strictly on affected interests, the boundary becomes porous and unstable, as almost any policy decision ripples outward to affect non-members.

  This tension is sharpest regarding the citizens of Alvea and future generations. The Alveans are clearly affected by the lithium mine yet are not subjected to Costa Serranan law, making them hard cases for the subjection principle. Conversely, including them in the demos based on affected interests risks an infinite regress where every potentially impacted foreigner gains voting rights, destabilizing the polity. Future generations are similarly affected but cannot be subjected to current coercion. A strong democratic theory must therefore distinguish between membership in the demos and mechanisms for representing affected interests. Costa Serrana should grant citizenship to Isla Cardonal inhabitants and long-term guest workers based on subjection, as they live under the state's coercive umbrella. For Alveans, however, the solution is not voting rights but transboundary regulatory bodies that mandate representation for affected outsiders without granting full membership. This adjudicates the conflict by reserving full demos membership for the subjected while protecting affected interests through institutional constraints. Regarding expatriates, if they remain subject to tax laws and consular protection, their inclusion is justified under subjection, but if they are fully integrated into another polity, their claim weakens.

  Finally, the regress objection posits that defining the demos requires a prior demos, creating a vicious circle. If only current citizens decide who joins, the boundary is arbitrary; if outsiders decide, the state dissolves. This worry is mitigated by acknowledging that the initial boundary is necessarily provisional but justified by the moral necessity of having a decision-making body at all. We must start with the existing legal citizenry as the provisional demos, not because it is morally perfect, but because it is the only agent capable of enacting boundary changes. The moral obligation lies in this provisional group using their power to align boundaries with the subjection principle where possible. Thus, the regress is halted not by a metaphysical trick but by a pragmatic moral duty incumbent upon the existing state to rectify clear cases of subjection without representation, such as on Isla Cardonal, while accepting that perfect alignment is asymptotic. This approach avoids the paralysis of the bootstrapping objection by treating the boundary as a project of ongoing justification rather than a one-time foundational act.

  The marking scheme is structured around five criteria worth five marks each, totaling twenty-five marks. The first five marks are awarded for accurately diagnosing why the all-subjected-to-coercion principle struggles with the guest workers and islanders, specifically noting the tension between temporary legal status and long-term factual subjection. Students typically fumble this by treating guest workers as clearly excluded without analyzing the duration of their residence or the depth of their legal subjection. The next five marks require diagnosing why the all-affected interests principle fails for the Alveans and future generations, focusing on the problem of infinite scope or the impossibility of representation for the unborn. Students typically fumble this by asserting affectedness is sufficient for membership without addressing the destabilizing consequences for state sovereignty. The third set of five marks is for adjudicating the conflict by taking a clear stance on inclusion for at least three groups, such as arguing for citizenship for islanders but only regulatory representation for Alveans. Students typically fumble this by refusing to choose and instead listing pros and cons without reaching a conclusion. The fourth criterion worth five marks assesses the confrontation of the regress or bootstrapping objection, requiring the student to explain how the circle is broken, perhaps through provisional starting points or moral duty. Students typically fumble this by stating the objection exists but failing to offer a solution or mitigation strategy. The final five marks are for overall coherence and argumentative voice, ensuring the essay reads as a unified defense of a position rather than a literature review. Students typically fumble this by writing in a passive voice that surveys theories without committing to a specific normative claim.
