answer: |-
  This is a sophisticated version of what is known in the literature as the **"Input Problem"** or the **"Problem of Relevant Descriptions."** Your colleague has effectively argued that the Formula of Universal Law (FUL) is underdetermined: without a prior rule for how to describe one's maxim, the test yields no results.

  To preserve both (1) (that FUL evaluates maxims) and the verdict that the false promise fails, you should **reject Premise 2**.

  Here is the breakdown of why Premise 2 looks acceptable, why it is false, what rejecting it costs, and how this preserves the False Promise example without smuggling in external moral principles.

  ### 1. The Target: Premise 2
  **Premise 2:** *The C-position in a maxim is filled by whatever circumstances the agent takes herself to be in when acting. The formula itself places no restriction on which believed circumstances may occupy that position...*

  **Why it looks acceptable:**
  It relies on a plausible reading of Kant's claim that maxims are "subjective principles of volition." Since they are subjective, it seems the agent has authority over their content. Furthermore, it respects the agent's perspective: surely *I* know what circumstances I am acting in better than an external observer does.

  **Why it is false:**
  Premise 2 conflates the **context of an action** with the **principle of an action**.
  Premise 1 defines a maxim as a *policy*. A policy, by definition, is a rule for governing conduct across a *range* of cases. To act on a policy is to treat the current situation as an instance of a *type* of situation.

  If an agent fills the C-position with hyper-indexical data ("standing at counter #5, 2:03 PM, loan officer Smith"), she is no longer describing a *type* of circumstance under which she wills to act; she is describing a *token* event. But one cannot have a "policy" for a token event that occurs only once. To will something as a maxim is to commit oneself to a rule of choice. A rule that applies only to a logically unique spatiotemporal coordinate is not a rule; it is a description of an impulse.

  Therefore, Premise 2 contradicts Premise 1. If a maxim is a policy (P1), it must contain generalizable conditions (not-P2).

  ### 2. Addressing the "External Restriction" Objection
  Your colleague anticipates the reply that such descriptions are "gerrymandered." Her rejoinder is strong: *Where does the restriction come from? If it's not the FUL, isn't it an external moral principle?*

  **The Response:**
  The restriction on maxim formulation does not come from an external *moral* principle (which would indeed beg the question); it comes from the **transcendental conditions of rational agency.**

  To act rationally is to act on reasons. To act on a reason is to treat that reason as having *normative force* beyond the immediate instant. If I say, "I will lie only now, at 2:03 PM, because I am me," I am not acting on a reason; I am acting on a brute desire. For a consideration to function as a *reason* within a maxim, it must be describable in terms that could, in principle, recur.

  The restriction is therefore **internal to the concept of a maxim**, not external to the FUL. The FUL tests *laws*. A "law" that governs only one specific atom in spacetime is not a law. Thus, the requirement for generality is built into the very machinery of the test (the concept of "Universal Law"), not added on from the outside.

  ### 3. The Cost of Rejecting Premise 2
  You asked what rejecting this premise costs. It is important to be honest about this, as your colleague will press you here.

  **The Cost:**
  You must concede that the FUL is **not a mechanical decision procedure** that works on any input an agent feeds it. You cannot treat the Categorical Imperative as a black box where *any* description of an action goes in and a moral verdict comes out.

  By rejecting Premise 2, you admit that Kantian ethics requires a **theory of maxim individuation**. You are committing to the view that there are correct and incorrect ways to formulate one's maxim, based on what counts as a *relevant* feature of the situation for a rational agent.

  **The Benefit:**
  In exchange, you save the FUL from triviality. You preserve the insight that morality constrains the *principles* we live by, not just the atomic acts we perform. You also align with Kant's own practice: Kant never tests maxims like "I will lie at 2:03 PM." He tests maxims like "I will make a false promise when in financial distress." He assumes rational agents naturally describe their actions in terms of their *ends* and *types of circumstances*, not spatiotemporal coordinates.

  ### 4. What if you cannot keep both (1) and the False Promise Verdict?
  If you find yourself unable to defend the claim that hyper-specific descriptions fail to be maxims (perhaps you think agents *can* rationally will one-off policies), then you must trade away the idea that the **FUL alone** generates the verdict.

  In this scenario, you would need to adopt a view like **Barbara Herman's "Rules of Moral Salience."**
  *   **The Trade:** You admit that the FUL is a test of *moral permissibility*, but it relies on a prior moral education (the Rules of Moral Salience) to structure the agent's perception of the situation.
  *   **The Consequence:** The "work" of forbidding the false promise is not done solely by the logical contradiction in conception, but by the fact that a properly morally educated agent would not even formulate the maxim in the hyper-specific way your colleague suggests. The "gerrymandering" is ruled out because it violates the rules of moral perception.
  *   **Verdict:** This saves the False Promise example but concedes that the FUL is not the *sole* source of moral constraint; it is the final court of appeal, not the only judge.

  ### Recommendation for the Reading Group
  I recommend you argue for the **rejection of Premise 2** based on the **nature of practical reasoning**.

  **Your argument in summary:**
  1.  Accept (1): Maxims are policies.
  2.  Reject (2): Policies require generality. A description that picks out a unique spacetime coordinate is not a policy; it is a report.
  3.  Counter the "External Restriction" worry: The requirement for generality is not a moral rule added from the outside; it is a condition of the possibility of acting on a principle at all. To act on a principle *just once* is a contradiction in terms.
  4.  Result: The false promisor's maxim must be described in terms of the *type* of situation (financial need) and the *type* of action (borrowing with no intent to repay). When universalized, *that* policy contradicts the institution of promising.

  This allows you to keep the FUL as the primary test while acknowledging that the FUL presupposes a rational agent who describes their actions in terms of reasons, not just coordinates.
