prompt: |-
  I'm a machine learning engineer with a solid statistics background but no formal philosophy. Restate the philosophical debate over the underdetermination of theory by evidence in the vocabulary I actually use — hypothesis classes, non-identifiability, regularization, inductive bias, training/test splits, and the gap between fitting observed data and committing to out-of-sample behavior. Cover at least the weak thesis that any finite evidence set is compatible with multiple incompatible hypotheses, and the Duhem–Quine point that when a prediction fails, blame can always be shifted between the core hypothesis and auxiliary assumptions. Then give me the residue report: which parts of the debate map cleanly onto things my field has names for, which map only with distortion, and which — say, the realist's claim that simplicity or explanatory virtue is a truth-directed tie-breaker rather than an arbitrary prior, or the antirealist's claim that there is simply no fact of the matter about where failed blame belongs — have no counterpart in how my vocabulary carves things up. Conclude by saying whether the residue indicates that my framing is missing something or that parts of the philosophical dispute are less substantive than they look. Please also make clear which parts of your account reflect broad agreement among philosophers of science and which remain genuinely contested, rather than presenting a contested position as settled.
