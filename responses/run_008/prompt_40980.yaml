answer: |-
  In the nearly just Republic of Merit, the "Equitable Transit Tax" funds public transport and is universally regarded as substantively just, yet enforcement is systematically biased: the wealthy routinely evade payment via opaque loopholes without prosecution, while wage-earners are strictly compelled to pay. Elena, a bus driver, publicly refuses to pay the tax on her personal vehicle, issuing a statement that while the law is fair in design, the selective enforcement transforms the scheme into an exploitative burden on the compliant; she parks her car in the central plaza, invites arrest, and accepts the fine to protest the two-tiered system.

  ### Demonstration of Specifications

  This scenario meets your constraints by isolating a specific tension between reciprocal fairness and institutional justice.
  1.  **Realistic/Contemporary:** Tax regimes with enforcement gaps are common; the act is a standard tax protest.
  2.  **Civil Disobedience:** Elena acts conscientiously (protesting unfairness), publicly (central plaza), nonviolently, and accepts the penalty (invites arrest).
  3.  **Nearly Just Society:** The law itself is "universally regarded as substantively just," satisfying Rawls's condition for the Natural Duty of Justice (NDJ) to apply, ruling out the trivial case of resisting tyranny.
  4.  **Non-Stipulated Verdicts:** The disagreement arises from the internal logic of the theories applied to the facts of enforcement disparity, not from arbitrary assignment.

  ### Theoretical Reasoning

  **The Principle of Fair Play (PFP): Permits Disobedience**
  PFP grounds obligation in the reciprocity of a cooperative scheme. One is bound to do one's part only if others are doing theirs, ensuring the benefits and burdens are shared fairly. In Merit, the wealthy (who likely benefit most from the transit system) are free-riding with impunity. This breaks the reciprocal link. For Elena to pay while the wealthy evade is not "playing fair"; it is accepting the role of a "sucker" in a scheme that has ceased to be mutually beneficial in practice. Because the condition of general compliance is violated, the obligation of fair play dissolves. PFP therefore does not condemn Elena's refusal; she is not violating a duty because the duty no longer exists under these conditions of asymmetry.

  **The Natural Duty of Justice (NDJ): Condemns Disobedience**
  NDJ grounds obligation in a universal moral duty to support and comply with just institutions that apply to us. The focus is on the *justice of the institution*, not the conduct of other participants. The Transit Tax law is substantively just, and the state is "nearly just." The fact that others violate the law is a moral failing on their part, but it does not negate the justice of the institution itself. Rawls argues that in a nearly just society, the duty to comply is stringent to maintain the stability of the basic structure. Elena's disobedience reduces the revenue needed for the just end (public transport) and undermines the rule of law. NDJ dictates she should work through political channels to fix enforcement, not violate the law herself. Thus, NDJ condemns the act as a failure to support a just institution.

  ### The Structural Feature

  The single structural feature driving the divergence is **Asymmetric Compliance** (the gap between *de jure* justice and *de facto* reciprocity).

  *   **If Varied (High Compliance):** If the wealthy were compelled to pay (restoring reciprocity), PFP would generate an obligation for Elena. Both theories would then condemn her disobedience. The verdicts converge.
  *   **If Varied (Unjust Law):** If the tax itself were unjust (e.g., regressive theft), NDJ might permit disobedience (as the duty is to *just* institutions), and PFP would also permit it (no fair scheme exists). The verdicts converge.
  *   **The Divergence Zone:** It is only when the law is *just* but the *execution* is *unfair* that PFP releases the obligation (due to broken reciprocity) while NDJ maintains it (due to institutional justice).

  ### Strongest Reply for the Natural-Duty Theorist

  The NDJ theorist's strongest reply is to prioritize **Institutional Stability**. They would argue that allowing individuals to judge the "fairness of enforcement" as a license for disobedience invites chaos. The duty to support just institutions requires upholding the law even when others fail to, precisely to preserve the institution's integrity until democratic reform corrects the enforcement gap.

  Regarding the **Particularity Problem**: This is a double-edged sword for your seminar partner's thesis. The Particularity Problem asks why a general duty to justice binds me to *this* specific state. If the NDJ theorist deploys this to blunt your case—arguing that a state with such corrupt enforcement is *not* sufficiently just to command a natural duty—they concede that NDJ *also* permits Elena's disobedience. This would validate your partner's equivalence thesis for this specific case (both theories permit). However, this comes at a steep cost: it renders NDJ inert in most real-world "nearly just" societies, undermining its utility as a general theory of obligation. To maintain NDJ as a robust, distinct theory, the theorist must insist the state *is* binding, which preserves the divergence you need to prove your partner wrong.

  ### The Consent Theorist's Verdict

  A Consent Theorist would ask: Did Elena voluntarily undertake an obligation to pay this tax? Merely residing in Merit or using the roads is typically insufficient for tacit consent. Unless Elena explicitly promised to pay, the Consent Theorist finds **no obligation**.

  *   **Verdict:** Permits disobedience.
  *   **Impact on Equivalence Thesis:** This pushes **away** from your partner's thesis. In this scenario, PFP and Consent Theory align (Permit), while NDJ stands alone (Condemn). This demonstrates that the theories are not extensionally equivalent; they rest on fundamentally different structures (reciprocity/voluntarism vs. institutional duty), and those structures yield different results when enforcement is asymmetric. Your partner's claim that the choice is "idle" is falsified by the fact that adopting NDJ imposes a moral burden on Elena that PFP and Consent do not.
