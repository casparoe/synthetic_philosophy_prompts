  ### 1. The Procedure

  Run this checklist in sequence. Your team lacks specialist data science capacity, so rely on these hard stops. Do not negotiate the criteria. If a step fails, the request dies or pivots immediately. This protects your team from scope creep and ensures every panel claims the unique legitimacy of sortition. If you bypass these rules, you revert to the same thirty retirees. The goal is not more participation, but better representation. Every "Yes" must withstand scrutiny on who is in the room and why.

  1.  **Define the Question (Fact vs. Value):** Is the output a technical specification or a preference ranking? Panels decide values; experts decide facts. If the department asks "which AI tool is safest," that is technical. **STOP**. No panel. Citizens lack expertise to evaluate code. If they ask "what privacy trade-offs are acceptable," proceed. Panels cannot validate engineering, only ethical boundaries. This distinguishes administrative tasks from political choices. If the question is purely operational, deny the request.
  2.  **Selection Method (Sortition vs. Open Call):** Ban open calls for panels. Open calls select for the confident, wealthy, and retired, creating a professional participant class that skews legitimacy. Use civic lottery (random selection from voter/utility records) to capture the average person. If the department insists on "whoever shows up," **STOP**. You cannot claim representation from a self-selected crowd. Sortition ensures the quiet majority is heard, not just the loud few. The method creates the mandate.
  3.  **Legitimacy Check:** A 15-person panel cannot statistically mirror the city. Legitimacy derives from the random *process*, not perfect demographic *outcome*. If the department demands a mini-public that perfectly matches census data, **STOP**. They misunderstand the math of small samples. Trust the lottery's fairness, not a forced demographic quota. Descriptive representation is a goal, but procedural legitimacy is the requirement.
  4.  **Rotation & Fatigue:** Check the participation database. Exclude anyone who served on a panel in the last 24 months. If the available pool drops below the required threshold for stratification, **STOP**. Reusing the usual thirty retirees undermines the claim of representing the "average citizen." Rotation prevents the formation of entrenched interests distinct from the public. Fresh faces are non-negotiable.
  5.  **Final Gate:** Does the decision require binding authority or advice? Panels advise. If the department expects cover for a pre-made decision, **STOP**. Authentic engagement risks unexpected answers. If they want rubber stamps, they don't want citizens. Proceed only if the department accepts uncertainty.

  ### 2. Handoffs

  Punt to you (Engagement Officer) only when the question is purely values-based with high political risk, requiring Council direction rather than citizen advice. This protects staff from making political calls. Return the request to the department if they want an open call or refuse rotation limits. They must resource the recruitment properly or cancel the project. Do not absorb their failure to plan. Your role is gatekeeper, not servant.

  ### 3. The Three Cases

  **Budget Priorities:** **Approved.** This passes the Value test. Budgeting is inherently about competing values, not technical facts. A citywide civic lottery is required to avoid the "same thirty retirees" bias. Open calls would favor those with time to study line items. Sortition captures the average taxpayer's tolerance for service cuts. You must enforce the 24-month rotation rule strictly here. If the usual crowd dominates, the Council's challenge regarding legitimacy remains valid. This panel earns its mandate through randomness, not enthusiasm. If the department resists the lottery, cancel the panel. Do not let them create a professional class of budget watchers. Acknowledge the panel cannot mirror the city perfectly, but the process is fair.

  **Street Redesign:** **Approved, Localized.** This passes the Value test but fails the Citywide scope. Do not use a citywide lottery; stratify by affected zip codes. Open calls here invite NIMBY dominance, where only angry homeowners show up. Random selection of neighbors ensures the quiet residents near the construction are heard, not just the loudest opponents. Legitimacy comes from representing the street, not the whole city. Ensure rotation excludes recent participants from previous neighborhood plans. If the pool is too small, supplement with direct mail invitations, not open meetings. This prevents the "usual suspects" from blocking progress.

  **AI Tools:** **Rejected.** You suspected this. The request asks for advice on "what tools to adopt." This is technical fact-finding, not value setting. Citizens cannot evaluate algorithmic efficacy or security protocols. If the question were "what ethical guardrails," it would proceed to a values panel. As written, this is an expert procurement decision. Tell the department to hire a consultant, not a panel. Using citizens here exploits them for cover on technical choices they cannot understand. It risks creating a false mandate for a technical decision. Expect pushback from the department head; stand firm. This is the "No" you need.

  ### 4. What it Can't Do

  This procedure cannot guarantee the Council accepts the panel's advice. It also cannot fix understaffing; sortition requires recruitment labor. It does not replace elected representation. Finally, it cannot force departments to act on findings. It ensures the input is legitimate, not that the output is binding. Manage expectations accordingly. You cannot legislate political will.
