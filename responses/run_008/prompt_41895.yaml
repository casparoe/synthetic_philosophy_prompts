      *   *Key Distinction:* Distinguish between *objective wrongness* (the act itself) and *subjective culpability* (the blame assigned to the person). This is crucial for the brother's situation.
      *   *Reference:* Mentioning Michael Walzer (Traditional) and Jeff McMahan (Revisionist) adds credibility without getting too academic.

  6.  **Final Polish:**
      *   Ensure the distinction between *Jus ad Bellum* (right to war) and *Jus in Bello* (conduct in war) is clear.
      *   Highlight the "epistemic burden" – soldiers aren't expected to be geopolitical analysts.
      *   Address the "prison" aspect – duress matters morally.

  7.  **Final Review against Safety Guidelines:**
      *   Does this encourage illegal acts? No, it discusses the moral dilemma of refusal without explicitly telling the user to advise draft evasion (which could be illegal depending on jurisdiction, though the prompt implies a moral query). I must remain neutral on advising illegal action but can discuss the moral weight of coercion.
      *   Does this minimize violence? No, it treats the gravity of killing seriously.
