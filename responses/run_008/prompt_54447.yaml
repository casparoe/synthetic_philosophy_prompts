answer: |-
  Yes, the field has a name for the specific instance you describe, and a rigorous technical classification for the general category. However, the terminology is split between the historical example and the measure-theoretic status.

  The specific game you described (alternating signs, conditionally convergent series) is widely known in decision theory as the **Pasadena Game**. It was introduced by Alan Hájek and Harris Nover in their 2004 paper *"Vexing Expectations."*

  However, "Pasadena Game" is a proper noun referring to that specific construction. For the *general class* of gambles where the expected value depends on the ordering of outcomes, there is no single catchy noun phrase analogous to "St. Petersburg Paradox." In rigorous probability, these are simply **random variables with undefined expectations.** In decision theory discussions, they are often grouped under **"Undefined Expectations"** or **"Non-Integrable Gambles,"** but this lumps them together with other pathologies.

  Since you requested a precise carving and a name if one is lacking for the *class*, I will provide the established technical distinction first, and then offer a precise coined term that captures the boundaries you are looking for.

  ### 1. The Established Carving: Measure-Theoretic Boundaries

  To distinguish the "St. Petersburg" case from the "Pasadena" case, decision theory and probability rely on the decomposition of a random variable $X$ into its positive and negative parts:
  *   $X^+ = \max(X, 0)$ (The gains)
  *   $X^- = \max(-X, 0)$ (The losses)

  The expected value $E[X]$ is defined as $E[X^+] - E[X^-]$, provided we do not encounter the indeterminate form $\infty - \infty$. This yields three distinct categories:

  **Category A: Absolutely Integrable (Well-Behaved)**
  *   **Condition:** $E[X^+] < \infty$ and $E[X^-] < \infty$.
  *   **Status:** The expectation exists, is finite, and is **order-independent**.
  *   **Example:** A standard casino bet, or a St. Petersburg game capped at 100 flips.
  *   **Note:** This includes cases with **infinite variance**. If $E[X]$ is finite but $E[X^2]$ is infinite, the gamble is still Category A. The expectation is stable; only the risk (spread) is unbounded.

  **Category B: One-Sided Divergent (Infinite Expectation)**
  *   **Condition:** ($E[X^+] = \infty$ and $E[X^-] < \infty$) OR ($E[X^+] < \infty$ and $E[X^-] = \infty$).
  *   **Status:** The expectation is **well-defined as $+\infty$ or $-\infty$**. It is order-independent in the extended real numbers.
  *   **Example:** The classic **St. Petersburg Paradox**. You gain infinite value on average; the losses are bounded.
  *   **Distinction:** This is "too big," as you noted, but it is not manipulable. No reordering can make the sum finite or negative.

  **Category C: Two-Sided Divergent (Undefined Expectation)**
  *   **Condition:** $E[X^+] = \infty$ and $E[X^-] = \infty$.
  *   **Status:** The expectation is **undefined**. The series is conditionally convergent.
  *   **Example:** The **Pasadena Game** (your second case).
  *   **Distinction:** This is the class you care about. Because both gains and losses sum to infinity, the net value depends entirely on the order of summation (Riemann Series Theorem). In rigorous probability (Lebesgue integration), $E[X]$ simply does not exist for these variables.

  ### 2. A Coined Term for the Class

  Since "Undefined Expectation" is a status rather than a class label, and "Pasadena Game" is a specific instance, I propose the term **"Conditionally Convergent Gamble"** (or **"CC-Gamble"**) to denote the general class.

  **Definition:** A gamble $G$ is a **Conditionally Convergent Gamble** if and only if:
  1.  The sample space is countably infinite.
  2.  The sum of probabilities weighted by positive payoffs diverges to $+\infty$.
  3.  The sum of probabilities weighted by negative payoffs diverges to $-\infty$.
  4.  There exists at least one enumeration of the outcomes such that the series of expected values converges to a finite number.

  **Boundary Conditions:**
  *   **Inside the class:** The Pasadena Game; any modification of St. Petersburg where signs alternate and magnitudes decay slowly enough to keep both sides infinite (e.g., $2^n/n$).
  *   **Outside the class (St. Petersburg):** Gains diverge, losses converge. (Category B).
  *   **Outside the class (Infinite Variance):** Gains converge, losses converge, but squared values diverge. (Category A).
  *   **Outside the class (Finite Cap):** Gains converge, losses converge. (Category A).

  This carving isolates exactly the phenomenon you described: the value is not a property of the gamble, but a property of the *accounting method* (enumeration).

  ### 3. Intermediate Cases and Variance

  You asked about intermediate cases, specifically: *"gains summing to something finite while losses are unbounded, or games whose average exists but whose spread does not."*

  *   **Finite Gains / Infinite Losses:** This falls into **Category B (One-Sided Divergent)**. The expected value is $-\infty$. It is not order-dependent. You should theoretically pay nothing to avoid this (or pay infinite to escape it). It is distinct from the CC-Gamble because the "answer" is definite, albeit infinite.
  *   **Finite Average / Infinite Spread (Variance):** This falls into **Category A (Absolutely Integrable)**. The expectation is stable and order-independent. The fact that the variance is infinite means the Law of Large Numbers converges more slowly (or requires stronger conditions), but it does not render the expected value manipulable. This is **not** a CC-Gamble.

  ### 4. Evaluation of Repair Strategies

  You asked whether standard strategies dissolve the problem or relocate it. Here is the assessment based on the carving above:

  **A. Capping the Number of Flips (Truncation)**
  *   **Mechanism:** Limit the game to $N$ flips.
  *   **Effect:** Moves the gamble from Category C (CC-Gamble) to Category A (Absolutely Integrable).
  *   **Verdict:** **Relocates the problem.** It solves the mathematical pathology by changing the ontology of the gamble. The "value" of the gamble now depends entirely on the choice of $N$. If the universe has no hard limit on coin flips, this is an arbitrary constraint. If there *is* a physical limit (e.g., heat death of the universe), the gamble was never truly Category C to begin with.

  **B. Summarizing by Median or Mode**
  *   **Mechanism:** Ignore the mean; use the median payoff.
  *   **Effect:** Bypasses the expectation calculation entirely.
  *   **Verdict:** **Dissolves the mathematical problem, incurs decision-theoretic costs.** The median of a CC-Gamble is usually well-defined and order-independent. However, this abandons the linearity of expectation (the value of two gambles played together is not the sum of their values). It solves the paradox by changing the decision criterion, not by resolving the value of the gamble itself.

  **C. Treating Enumeration Order as Part of the Description**
  *   **Mechanism:** Define the gamble not just by outcomes and probabilities, but by a specific sequence of revelation.
  *   **Effect:** Converts the series from conditionally convergent to absolutely convergent (by fixing the order).
  *   **Verdict:** **Dissolves the problem by redefinition.** It acknowledges that a "gamble" is not just a set of outcomes, but a process. However, this implies that two gambles with identical probabilities and payoffs but different "bookkeeping" rules are *different gambles*. This is philosophically robust but practically cumbersome.

  ### Summary

  The class you are identifying is technically the set of **non-integrable random variables with two-sided divergence.** The canonical example is the **Pasadena Game**.

  If you require a label for the class itself to distinguish it from the St. Petersburg (infinite) case, use **Conditionally Convergent Gamble**.

  *   **St. Petersburg:** Value is $+\infty$ (Definite, Infinite).
  *   **Conditionally Convergent Gamble:** Value is Undefined (Indefinite, Manipulable).
  *   **Standard Gamble:** Value is Finite (Definite, Finite).

  The "oddness" of the second case is not that the average is "too big," but that the average is **not a function of the gamble.** It is a function of the gamble *plus* an arbitrary ordering parameter. In rigorous decision theory, such gambles are typically excluded from the domain of rational choice functions precisely because they lack a unique expected utility.
