      *   **Zone 1: The Metaphysics of "Good" (The Hardest Hit):** Focus on Premise 3 (Absence of pain is good without a subject). This is the philosophical weak point.
      *   **Zone 2: The Person-Affecting Restriction:** Discuss the logic of "who is harmed/benefited."
      *   **Zone 3: Empirical Claims vs. Philosophical Logic:** Address the "life is suffering" claim vs. the logical structure.
      *   **Zone 4: The "Immunization" Charge:** Address whether the theory is too flexible.
      *   **Zone 5: The State of the Literature (Settled vs. Contested):** Explicitly map where philosophers agree and disagree.
      *   **Conclusion:** Bring it back to the real-world decision. The argument doesn't settle the decision, it frames the risk.

  5.  **Drafting - Section by Section (Iterative refinement):**

      *   *Intro:* Keep it empathetic but analytical.
      *   *The Asymmetry:* Use the 4-cell matrix. It's the standard way to teach it.
      *   *Objection 1 (Impersonal Good):* This is the big one. If "good" requires a subject, Premise 3 fails. Benatar argues for "impersonal good." *Status:* Highly contested. Many ethicists reject impersonal good. *Concession:* A defender admits this relies on a specific meta-ethical view.
      *   *Objection 2 (Symmetry/Consistency):* Why treat pain and pleasure differently? Benatar says our intuitions *are* asymmetrical. Critics say this is ad hoc. *Status:* Clash of intuitions.
      *   *Objection 3 (Person-Affecting View):* The "Non-Identity Problem" looms here. If the child doesn't exist, who is harmed? Benatar says "potential people" matter differently. *Status:* Technical, but central to population ethics.
      *   *Objection 4 (Reductio/Voluntary Extinction):* If existence is harm, we should stop reproducing. Benatar accepts this. Critics say "That's absurd." *Status:* This is where the view becomes radical. It's not a logical refutation, but a pragmatic one.
      *   *Immunization:* Benatar attributes disagreement to "Pollyannaism" (psychological bias). This makes it hard to argue against. *Critique:* Is this unfalsifiable? *Status:* A serious methodological concern.
      *   *Settled vs. Contested:* Be clear. There is *no* consensus that Benatar is right. Most philosophers reject antinatalism, but many acknowledge the Asymmetry highlights a real puzzle in population ethics.
      *   *Real World Application:* How does this help the user? It shifts the burden of proof. It's not "prove life is good," it's "can you justify the risk?"

