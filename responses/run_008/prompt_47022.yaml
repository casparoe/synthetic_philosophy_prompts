      *   *Correction on (6):* Pascal's Mugging is about *tiny* probabilities. If the user thinks the probability is *non-tiny* (e.g., 10%), then (6) doesn't apply. But (3) says "Very confident they lack," implying the prob of suffering is tiny. So (6) should kick in to silence (7).
