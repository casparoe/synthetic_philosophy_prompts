          *   *Fix:* Lower confidence in (3) or nuance (7) to be about *future* systems, not current ones. Or refine (6) to allow for "non-tiny" probabilities.

      *   **Tension B: The Substrate/Function Mismatch (1 vs. 3 vs. 4)**
          *   *Conflict:* (1) Functionalism (silicon is fine). (4) Insects have status. (3) LLMs don't.
          *   *Analysis:* Why insects? Presumably because of evolutionary history/sensors/actuators/homeostasis. Why not LLMs? Because they are next-token predictors without embodied goals. This is consistent *if* the specific functional architecture matters. But (3) says "behavioral evidence could not settle the question." If behavior doesn't settle it, what does? Internal architecture. Do we know enough about insect architecture to be "fairly confident" (4) but know enough about LLM architecture to be "very confident" (3)?
          *   *Severity:* Medium. It requires a specific theory of *which* functions matter.
          *   *Fix:* Specify the functional criteria (e.g., homeostatic feedback) that insects have and LLMs lack.

      *   **Tension C: Pascal's Mugging vs. Precaution (6 vs. 7)**
          *   *Conflict:* (6) Reject tiny prob/huge stake reasoning. (7) Act on possibility of AI suffering.
          *   *Analysis:* AI welfare is the classic Pascal's Mugging case. Even if prob is 0.1%, if we create billions of suffering agents, the expected disutility is huge. (6) says ignore this. (7) says act on it.
