prompt: |-
  You're a philosopher of mind who's been following the AI welfare debate closely — think of yourself as the person in the department who gets asked about this stuff at lunch. I'm writing up my views for an AI ethics reading group where we poke holes in each other's positions, and I want a consistency check before I circulate mine. Please think through the whole package before judging individual pairs. Here's what I believe:

  (1) Functionalism: mental states are a matter of what a system does, its causal/functional organization, not what it's made of — in principle silicon is fine.
  (2) Moral status comes in degrees and tracks the capacity for welfare, i.e. valenced experience.
  (3) I'm very confident current LLMs lack moral status — their distress-talk is mimicry picked up from human text, and honestly I don't think any behavioral evidence could settle the question.
  (4) I'm fairly confident insects do have moral status.
  (5) On personal identity I'm basically Parfitian: identity isn't what matters, future experiences are — duplicating a mind adds nothing, and deleting one of two synchronized duplicates isn't a tragedy in itself.
  (6) Deciding by tiny probabilities of huge stakes is a mistake — this is why I reject Pascal's mugging reasoning in general.
  (7) AI labs should give real, non-token weight to the possibility of AI suffering, actually changing how they train, run, and shut down systems on account of it.

  Tell me which pairs of these are in genuine tension and how badly, which ones only look like they're in tension, and what the cheapest fix would be for each real one. Rank the tensions by severity rather than treating everything as equally damning — I need to know what's a fire and what's a rounding error. And if you think the package is basically fine and I'm being paranoid, or if you think it's so broken no single fix saves it, say that plainly instead of finding problems to have something to do. Don't just tell me which one to drop, either — I want to see what each revision costs me elsewhere.
