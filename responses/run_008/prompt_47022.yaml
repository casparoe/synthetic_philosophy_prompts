      *   (3) + (4): Why confident about insects (biological) but not LLMs (silicon)? If functionalism is true, biology shouldn't matter. What functional capacity do insects have that LLMs don't? (Homeostasis? Feedback loops?). This looks like a potential tension.
      *   (3) + (7): If I'm *very confident* they lack status (3), why should labs change behavior significantly (7)? (7) implies acting on uncertainty.
      *   (6) + (7): (6) says don't act on tiny probs of huge stakes. (7) says act on the possibility of AI suffering. AI suffering could be huge stakes (millions of copies). Is (7) just Pascal's Mugging in disguise? This looks like a major tension.
      *   (1) + (4): Functionalism + Insects. Do we know the functional organization of insects? If we are confident they have status, do we know *what* function generates it? If we don't know that, how can we be confident LLMs *lack* it?
      *   (5) + (7): Parfitian view on deletion. If I delete an AI, is it a tragedy? (5) says deleting one of two synchronized duplicates isn't a tragedy. Does this apply to shutting down AI? Maybe not a tension, but worth checking.

