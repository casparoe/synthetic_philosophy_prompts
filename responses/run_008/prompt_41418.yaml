answer: |-
  You speak with the confidence of one who sees a sprout and declares the harvest already gathered. You bring me tales from distant lands of small children and even beasts, claiming these prove that the nature of man is good. You say the clay reaches for the vessel. I say you mistake the wetness of the mud for the shape of the bowl.

  Listen closely. I do not deny what you tell me. I do not deny that the eye sees, the ear hears, or that a child of one year may feel a stir of alarm when another stumbles. These are dispositions (*qing*). They are part of what Heaven gives us. But to call this "goodness" is to confuse the raw timber with the straightened beam.

  You say this helping is spontaneous. I say it is instinctual. Is it not also spontaneous that a child cries when hungry and snatches food when he sees it? Is it not spontaneous that a man feels love for his own son but indifference to the stranger? If we follow these spontaneous dispositions without restraint, the strong oppress the weak, and the many assault the few. This is what I mean when I say nature is bad. It is not that man is a demon; it is that man's raw impulses are unordered. They are chaotic.

  You bring up the chimpanzee. This actually strengthens my case, not yours. If a beast can do this thing, then it is not *human* morality. It is animal instinct. What distinguishes the noble man from the beast is not the impulse to grab a fallen object, but the capacity to adhere to *Rightness* (*Yi*) and *Ritual* (*Li*) even when the impulse is absent. If morality is merely what the monkey does, then we need no Sage Kings, no teachers, no classics. We need only remain animals. But we seek to become human.

  Now, consider this matter of reward. You say that when the child is paid, he helps less. You claim this proves the goodness was internal and the payment corrupted it. I say it proves the fragility of the sprout.

  If this "goodness" is so innate, why does it wither at the touch of profit? A truly cultivated virtue, forged through conscious activity (*wei*), stands firm whether there is reward or punishment. The gentleman does good because it is Right, not because he feels a stir in his chest. The toddler's help is like a flash of lightning—bright, but gone in an instant, dependent on the mood of the moment. If the child is tired, does he still help? If the object is heavy, does he persist? If the adult is ugly or strange, does he care?

  Your "sprouts" are fickle. They rely on the weather of the emotions. My Rituals are the irrigation ditches that ensure the crop grows regardless of the rain.

  You claim the child helps before teaching. I ask you: what happens when two children want the same object? Does the "sprout of compassion" resolve the conflict? Or does the "nature" of greed and strife immediately surface? The helping hand you praise is a luxury of the moment; the fighting hand is the reality of scarcity. Without the teacher to show them how to yield, how to defer, how to share according to rank and need, those helpful toddlers will become feuding men.

  I must ask you this, to clarify the limits of your "evidence": When this child helps the adult, does he understand *why* he helps? Does he know that he is fulfilling a duty, or is he merely acting on a fleeting urge, like a dog fetching a stick? If he does not know the *principle* of the act, can it truly be called virtue? Or is it merely a reflex, no more moral than the beating of his own heart?
