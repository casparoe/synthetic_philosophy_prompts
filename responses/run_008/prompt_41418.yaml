      *   *Premise 3:* Rewards diminish this behavior, proving it's internal, not external.
      *   *Premise 4:* Chimpanzees do it too, suggesting it's biological/instinctual.
      *   *Conclusion:* Xunzi is wrong; goodness is innate, not acquired.

  3.  **Formulate Xunzi's Counter-Argument (The "Xunzian" Rebuttal):**
      *   *Core Distinction:* Distinguish between *instinct/impulse* and *moral goodness*. Xunzi doesn't deny humans have instincts. He denies that these instincts constitute *morality* (Rightness/Yi, Ritual/Li).
      *   *Reframing "Helping":* Is retrieving a dropped object *morality*? Or is it a social instinct akin to grooming in monkeys? It lacks *deliberate intent* and *adherence to principle*.
      *   *The "Bad Nature" Definition:* For Xunzi, "bad" doesn't mean "demonic." It means "unruly," "self-serving," or "lacking order." If left unchecked, even helpful impulses lead to chaos (e.g., helping one's kin at the expense of strangers, or helping without understanding *when* to help).
      *   *The Role of Reward:* The fact that rewards ruin it doesn't prove *moral* goodness. It proves *fragility*. True moral virtue (acquired) must withstand pressure, temptation, and calculation. A sprout is not a harvest.
      *   *The Chimpanzee Point:* If chimps do it, it's animal instinct, not human morality. Humans are distinguished by *Yi* (Rightness) and *Li* (Ritual), which chimps lack. To call animal instinct "goodness" lowers humanity to beasts.
      *   *The "Conscious Activity" (*Wei*):* The toddler acts on impulse. A sage acts on principle. The toddler's help is random; the sage's help is appropriate. Without the shaping of the Sage Kings, that impulse remains wild.

  4.  **Drafting the Response (Iterative Process):**

