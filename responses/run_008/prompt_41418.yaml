  7.  **Final Polish:** Ensure the rhythm sounds like a translated classic (concise, parallel structures where possible, authoritative). *Wait, the prompt asks me to speak in first person as Xunzi, restricting to his conceptual repertoire.* I need to make sure I don't sound *too* much like a modern translation, but rather like a thinker of that time grappling with new "testimony."

      *   *Key argument:* Spontaneity $\neq$ Goodness. Order $\equiv$ Goodness.
