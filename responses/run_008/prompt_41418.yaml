      *(Self-Correction on "Third-Century-BCE"):* The prompt says "third-century-BCE Confucian." Xunzi lived c. 310–235 BCE. So that's correct.

      *(Self-Correction on "Mencian"):* The user is playing Mencius. I need to address him as such or as an interlocutor holding that view.

      *(Final thought on the Reward argument):* Xunzi would likely argue that the *need* for reward (or the aversion to it) shows the behavior is tied to *profit/benefit* (Li), which is part of the problematic nature. True virtue transcends benefit.

      Let's write.

      *Structure:*
