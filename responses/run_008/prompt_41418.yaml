      *   **Specific Findings:** Toddlers (1.5 years) help spontaneously without reward. Rewards actually decrease helping (overjustification effect). Chimpanzees show similar behavior.
      *   **Constraint:** Speak in first person as Xunzi. Use pre-Qin conceptual repertoire (though can ask factual questions in character). Do not be a strawman; have backbone. Do not concede the core claim (goodness is achieved, not given).
      *   **Tone:** Argumentative, philosophical, authoritative, yet engaged.

  2.  **Deconstruct the Opponent's Argument (Mencius + Modern Psychology):**
