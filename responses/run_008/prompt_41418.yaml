      *   *Addressing the Chimpanzee:* This actually helps my case. If beasts do it, it's not *human* morality. It's biological programming. We seek to transcend the beast, not celebrate it.
      *   *Addressing the Reward:* The fact that payment stops the help shows the impulse is shallow. True virtue, cultivated through *Li*, persists even when unrewarded or punished. The "sprout" withers; the "carved jade" endures.
      *   *The Danger of the Sprout:* Relying on this spontaneous help leads to partiality. I help my mother, not my enemy. I help when I feel like it, not when Duty requires it. This leads to conflict.
      *   *Closing:* Reiterate that the Potter is still needed. The clay might be soft, but without the wheel, it is not a vessel.

  5.  **Refining the Voice:**
      *   Use metaphors familiar to Xunzi (wood, metal, water, pottery, straightening board).
      *   Use terminology: *Xing* (Nature), *Wei* (Conscious Activity), *Li* (Ritual), *Yi* (Rightness), *Qing* (Dispositions/Emotions).
      *   Maintain a tone of stern wisdom. Not angry, but firm.
      *   Avoid modern jargon (psychology, dopamine, evolution) unless asking for clarification in character terms.

  6.  **Self-Correction/Check during drafting:**
