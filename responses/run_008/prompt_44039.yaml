answer: |-
  1. Proponents of the perceptual view argue that aesthetic value resides solely in observable properties, so indistinguishable forgeries share all artistic merit. Their cases work because they isolate visual experience from historical knowledge, showing that appreciation often persists without provenance.
  2. Advocates for authenticity contend that a work's genesis is constitutive of its identity, making the history of creation an inherent aesthetic feature. Their cases succeed by demonstrating how knowledge of origin fundamentally alters the perceived meaning and achievement embodied in the object.
  3. The disagreement is best understood as a case of two substantive questions being asked under one heading, conflating sensory appreciation with art-historical classification. This conflation creates an illusion of contradiction where each side is actually answering a different query about the object's status.
  4. Your hypothesis correctly identifies that divergent definitions of 'aesthetic value' drive the stalemate, yet it frames the issue as merely verbal rather than a conceptual conflation of distinct categories. The parties are not just using words differently but are investigating different properties under the assumption that they must coincide.
  5. Progress requires abandoning the search for a single definition of aesthetic value in favor of distinguishing between appreciative experiences and art-historical classifications. New cases involving AI generation or collaborative restoration may force a taxonomy that separates perceptual merit from achievement value.
