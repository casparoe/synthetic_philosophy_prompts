prompt: |-
  I've noticed an odd combination of norms within professional historiography, and I'd like to understand what theory of explanation the discipline is implicitly committed to — or whether it's committed to anything coherent at all.

  Consider the following cluster of practices and norms, all of which are standard:

  1. Training, methodology sections, and peer review treat "hindsight," "presentism," "anachronism," "outcome bias," and "Whig history" as cardinal sins. The historian is faulted for explaining the outbreak of the First World War as though contemporaries could see it coming, or for treating a decision made under deep uncertainty as though its consequences were visible to the person making it. The agent's open future is supposed to be respected.

  2. At the same time, the discipline's flagship genre is outcome-driven in title and design: books and courses organized as the origins, the road to, the collapse of, the making of some known result. Historians select topics because of how things turned out, enter archives already knowing the ending, and pick from the record the threads that run forward to it. Nobody proposes to research the run-up to a crisis that never happened, and no press would publish it.

  3. Referees add a further, apparently independent demand: that the author demonstrate contingency — that at some juncture things could plausibly have gone otherwise — while also insisting that the cited causes genuinely carry the outcome rather than merely accompany it. The monograph must make the result both explicable and avoidable.

  4. The publication market runs on narrative shape. A book whose conclusion is that the outcome issued from an accumulation of low-grade frictions, none individually decisive, several of which nearly failed to occur, is hard to publish and harder to assign in a seminar; a book with an arc — mounting pressure, a turning point, resolution — is not. Individual historians are told to resist the narrative fallacy, yet the collective structure of the discipline seems to guarantee it.

  What I want to know is what this cluster presupposes about historical explanation. Some candidate readings, none of which I'm confident in:

  - Perhaps the discipline presupposes a distinction borrowed from statistics: using the outcome to generate hypotheses is legitimate, using it as a premise of inference is not. But historians never receive fresh data — they go back to the same outcome-loaded archives — so there is no held-out set on which a retrospective conjecture could be tested. Can the generate/test distinction survive the absence of anything like a second sample?
  - Perhaps it presupposes a kind of double vision: a good narrative must render the outcome intelligible to the reader, who knows it was coming, while accurately representing it as an open question to the agents, who did not. The genre title ("the road to X") then encodes both perspectives at once. But is that a theory of explanation, or just a description of a rhetorical accomplishment — and is it even achievable, since selection of detail is itself retrospective?
  - Perhaps the anti-hindsight norm is not an epistemic norm at all but a norm of display — don't let the reader see the outcome shaping your inquiry — and the discipline knows, at the aggregate level, that outcome-shaped topics and narrative-shaped publications will produce hindsight bias regardless of individual historians' virtues, much as a casino profits while individual gamblers sincerely intend to win.

  Please reconstruct the implicit theory as best it can be reconstructed: which parts of the practice are strictly required by that theory, which merely fit well with it, and where the practice is underdetermined such that rival theories of explanation would license it too. Then tell me what a historiography built on a rival theory would have to change — for instance, one that treated every retrospective narrative as merely one of several accounts equally well supported by the record, or one that explained non-events with the same seriousness as events. Finally, if you think the puzzle is badly posed — say, because using the outcome to select what to explain is different enough from hindsight bias that no single implicit view needs to cover both, or because the contingency demand in (3) simply tracks a different norm than the causal demand does — please say so plainly rather than manufacturing a unified theory where the practice may simply be making incompatible demands.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the User's Query:**

      *   **Core Observation:** The user identifies a tension in professional historiography between *anti-hindsight norms* (don't treat the past as determined, respect agents' uncertainty) and *outcome-driven practices* (write books about known results, select evidence based on where it leads, demand narrative arcs).
      *   **Specific Tensions:**
          1.  Methodological prohibition vs. Topic selection (Open future vs. Known ending).
          2.  Contingency vs. Causality (Could have gone otherwise vs. This caused that).
          3.  Narrative Fallacy vs. Market Demand (Complex friction vs. Dramatic arc).
      *   **User's Proposed Candidates:**
          1.  Statistical hypothesis generation vs. testing (fails due to lack of held-out data).
          2.  Double vision (intelligible to reader, open to agents).
          3.  Norm of display vs. structural reality (hypocrisy/structural bias).
      *   **Task:** Reconstruct the implicit theory of explanation. Identify what is required, what fits well, and where it's underdetermined. Contrast with a rival theory. Critique the puzzle itself if necessary (is it a false tension?).

  2.  **Initial Assessment & Theoretical Framing:**

      *   Is this a genuine paradox? Yes, it's the classic "retrospective determinism" vs. "causal explanation" problem.
      *   Is there a unified theory? Historians rarely articulate a *philosophy* of history explicitly in their monographs. They operate on a *pragmatic* theory of explanation.
      *   Key Philosophical Concepts:
          *   *Verstehen* (understanding from the inside).
          *   *Counterfactuals* (what if?).
          *   *Narrative Truth* (White, Ricoeur).
          *   *Causal Mechanisms* (process tracing).
          *   *Selection Bias* (the user's strong point).
      *   The "Implicit Theory": It's not a logical positivist covering-law model. It's closer to a **Pragmatic Counterfactual Realism**. The goal isn't prediction; it's *intelligibility*.

  3.  **Drafting the Reconstruction (Step-by-Step):**

      *   **The Core Tension:** The user is right. This is the "Narrative Paradox."
      *   **The Implicit Theory:** I need to name it. Let's call it **"Retrospective Intelligibility via Contingent Mechanism."**
      *   *Premise 1: The Past is Fixed, The Future was Open.* Ontologically, the event happened. Epistemologically, the agents didn't know it would. Explanation requires bridging this gap.
      *   *Premise 2: Explanation = Making Sense of the Actual.* We explain *why X happened*, not *why Y didn't*. This necessitates outcome-selection.
      *   *Premise 3: Causality requires Contingency.* If X *had* to happen, it's not history; it's physics or theology. To claim X caused Y, you must imply "If not-X, then likely not-Y."
      *   *Premise 4: Narrative is the Cognitive Tool.* Humans understand causality through story. This creates the market demand for arcs.

      *   **Addressing the User's Candidates:**
          *   *Statistical:* No, historians don't do hypothesis testing in that sense. They do *process tracing*.
          *   *Double Vision:* Yes, this is the strongest fit. It's a rhetorical/epistemic stance.
          *   *Norm of Display:* Cynical but partially true. Professional virtue signaling vs. structural constraint.

      *   **Required vs. Fitting vs. Underdetermined:**
          *   *Required:* Outcome selection (you can't explain what didn't happen). Contingency (otherwise it's determinism).
          *   *Fits Well:* Narrative arc (helps intelligibility).
          *   *Underdetermined:* The specific shape of the narrative (tragedy, romance, etc.).

      *   **Rival Theory:** What if we took "non-events" seriously? Or treated all narratives as equal?
          *   *Rival:* "Possibilist Historiography" or "Annales-style Structuralism."
          *   *Changes:* No more "Road to War." Instead: "Structures of Conflict in 1913." Focus on *longue durée* rather than events. Or, "History of the Unchosen" (studying paths not taken).

      *   **Critique of the Puzzle:** Is the user asking for coherence where there is none?
          *   There is a distinction between *Context of Discovery* (finding the topic based on outcomes) and *Context of Justification* (arguing the causes without assuming inevitability).
          *   The "Hindsight Bias" prohibition is about *attribution of motive/knowledge*, not *topic selection*.
          *   So, the puzzle is partially based on a category error, but a productive one.

  4.  **Refining the Argument (Self-Correction during drafting):**

      *   *Correction:* I shouldn't just say "Historians are pragmatists." I need to be specific about *causal inference*.
      *   *Key Insight:* Historians use **counterfactuals** implicitly. When they say "A caused B," they mean "In the absence of A, B would likely not have occurred *given the context*." This satisfies the contingency demand (3).
      *   *Key Insight:* The "Hindsight" prohibition is about **epistemic access**, not **ontological status**. You can know the war happened; you just can't claim the Kaiser knew it would happen.
      *   *Market vs. Method:* The narrative arc (4) is a pedagogical/market constraint, not strictly a methodological one. Good historians acknowledge the messiness even if the blurb promises an arc.

  5.  **Structuring the Response:**

      *   **Introduction:** Validate the user's observation. It's a known philosophical tension (Gallie, White, Carr).
      *   **The Implicit Theory:** Define it as **"Counterfactual Process Tracing."**
      *   **Deconstructing the Norms:**
          *   Norm 1 (Anti-Hindsight) $\rightarrow$ Epistemic humility regarding agents.
          *   Norm 2 (Outcome Selection) $\rightarrow$ Ontological necessity (we study what exists).
          *   Norm 3 (Contingency + Causality) $\rightarrow$ The Counterfactual Test.
          *   Norm 4 (Narrative) $\rightarrow$ Cognitive necessity for human understanding.
      *   **Required vs. Contingent:** Distinguish between what makes it *history* vs. what makes it *publishable*.
      *   **The Rival Theory:** Propose "Structural/Serial History" or "History of Possibilities." Show how it changes the output.
      *   **The Critique:** Address the "Badly Posed" option. Distinguish *Topic Selection* from *Causal Attribution*. This is crucial. The user conflates knowing the end (allowed) with assuming the end was inevitable (forbidden).

  6.  **Final Polish:**

      *   Ensure tone is respectful and intellectually rigorous.
      *   Use specific historiographical terms (e.g., *Verstehen*, *longue durée*, *process tracing*).
      *   Make sure to answer the specific prompt requirements (reconstruct theory, required/fitting/underdetermined, rival theory, critique the puzzle).

      *(Self-Correction on the "Statistical" point)*: The user mentions the lack of a held-out set. I should emphasize that historians use *spatial* or *temporal* comparison as their "control group," not a random sample. This addresses the "no fresh data" worry.

      *(Self-Correction on "Double Vision")*: This is actually the standard solution. I need to articulate *why* it works. It works because explanation is for the *reader*, not the *agent*.

      *(Final check on the "Badly Posed" option)*: I think there is truth here. The tension is less logical contradiction and more *tension of focus*. I should validate this.

  7.  **Final Output Generation** (Proceeding to write the response based on these thoughts).
answer: |-
  This is a sophisticated diagnosis of a tension that lies at the heart of the philosophy of history. You have correctly identified what philosophers like W.B. Gallie, Hayden White, and E.H. Carr have wrestled with for a century: the conflict between the **ontology of the past** (it happened, it is fixed) and the **epistemology of the agents** (for them, it was future, it was open).

  Your intuition that the discipline operates on an implicit, perhaps unarticulated theory of explanation is correct. It is not a logical positivist theory (covering laws), nor is it purely literary. It is best reconstructed as a theory of **Counterfactual Process Tracing**.

  Here is the reconstruction of that implicit theory, an analysis of its coherence, a sketch of a rival historiography, and finally, a critique of whether the puzzle itself holds together.

  ---

  ### I. The Implicit Theory: Counterfactual Process Tracing

  The discipline is implicitly committed to the view that historical explanation is the reconstruction of **causal mechanisms within a contingent field**, validated by **narrative intelligibility**.

  This theory rests on three axioms that resolve your four observations:

  1.  **The Axiom of Ontological Fixity:** We can only study what happened. (Justifies Norm 2: Outcome-driven topics).
  2.  **The Axiom of Epistemic Openness:** For a cause to be a cause, it must have made a difference. If the outcome was inevitable regardless of the cause, the cause is explanatory idle. (Justifies Norm 3: Contingency).
  3.  **The Axiom of Agentive Ignorance:** To explain a decision, one must reconstruct the information set available at the time of the decision, not the information set available to the historian. (Justifies Norm 1: Anti-hindsight).

  **How it resolves the tensions:**
  The theory distinguishes between the **context of selection** (why we study WWI) and the **context of explanation** (how WWI happened).
  *   **Norm 2 (Outcome Selection)** is permitted because of Axiom 1. We select topics based on significance, and significance is usually determined by consequences.
  *   **Norm 1 (Anti-Hindsight)** is required because of Axiom 3. Once the topic is selected, the *method* of explanation must bracket the known outcome to accurately model the agents' decision trees.
  *   **Norm 3 (Contingency + Causality)** is the core engine. It demands the historian run a mental simulation: "If variable $X$ (e.g., the assassination) is removed, does outcome $Y$ (War) still occur given the structural pressures?" If yes, $X$ is not the cause. If no, $X$ is a cause, *provided* the agents didn't know $Y$ was inevitable.
  *   **Norm 4 (Narrative)** is the cognitive interface. Human beings understand "mechanism + contingency" best through story. The "arc" is not a claim about metaphysical destiny; it is a pedagogical device to track the narrowing of possibilities over time.

  ### II. Required vs. Fitting vs. Underdetermined

  If we accept **Counterfactual Process Tracing** as the implicit theory, we can categorize the practices you listed:

  **1. Strictly Required by the Theory:**
  *   **Outcome Selection (Norm 2):** You cannot trace the process of a non-event. There is no archival trail for "The War That Didn't Happen." To explain causality, you need an effect to explain.
  *   **Agentive Epistemic Limits (Norm 1):** If you attribute knowledge of the future to an agent, you destroy the causal mechanism. If the Kaiser knew war was inevitable, his deliberation is irrelevant; he was merely executing fate. To explain his *choice*, you must prove he thought he had a choice.
  *   **The Contingency Claim (Norm 3, part A):** If the historian cannot point to a juncture where things could have gone otherwise, they have written theology (Providence) or physics (Determinism), not history.

  **2. Merely Fits Well (Heuristic/Pragmatic):**
  *   **Narrative Arc (Norm 4):** A "mounting pressure" arc is a highly efficient way to communicate the narrowing of the "cone of possibility." However, the theory does not *strictly* require a dramatic turning point. A slow accretion of friction is theoretically valid but cognitively harder to process. The market preference for arcs is a pragmatic adaptation to the limits of reader attention, not a requirement of the explanatory theory itself.
  *   **The "Road to X" Title:** This is a labeling convention that signals the *explanandum* (the thing to be explained). It fits the theory but isn't required by it.

  **3. Underdetermined (Where Rival Theories Could Operate):**
  *   **The Weight of Structure vs. Agency:** The theory allows for explanations that lean heavily on structural inevitability (Marxist, Annales) provided they leave *some* room for contingency. It does not dictate the ratio.
  *   **The Unit of Analysis:** The theory works for diplomatic history (decisions) and social history (movements), but it doesn't dictate which is more "real."
  *   **The "Held-Out" Data Problem:** Your statistical critique is astute. Historians handle this underdetermination through **comparative history**. They treat other times/places as the "control group." (e.g., "Why did revolution happen in Russia but not Germany?"). This is the functional equivalent of a held-out set, though rarely formalized as such.

  ### III. A Rival Historiography: "Possibilist" or "Structural" History

  If we built a discipline on a rival theory, what would change?

  **Rival Theory A: The History of Possibilities (Counterfactual History as Primary)**
  *   **Premise:** The "actual" is just one realized data point in a distribution of probabilities. Focusing only on the actual induces selection bias.
  *   **Changes:**
      *   **Topics:** Monographs titled *The European Peace of 1915* or *The Survival of the Ottoman Empire*.
      *   **Method:** Explicit modeling of alternative futures. Archives would be mined for plans that were *rejected* with the same rigor as plans that were *accepted*.
      *   **Norms:** "Hindsight" would be less of a sin because the goal is to map the landscape of the thinkable, not just the done.
      *   **Downside:** It risks becoming speculative fiction. Without the anchor of the "actual," validation becomes impossible.

  **Rival Theory B: Structuralist / *Longue Durée* History**
  *   **Premise:** Events are foam on the wave. The "contingency" norm is a fetishization of the ephemeral. Explanation lies in deep structures (demography, climate, economics) that render individual choices largely irrelevant.
  *   **Changes:**
      *   **Topics:** *The Mediterranean Grain Trade, 1500–1800*. No "Road to" anything.
      *   **Method:** Serial data analysis over centuries. Rejection of the "narrative arc" in favor of cyclical or static models.
      *   **Norms:** The demand for "contingency" (Norm 3) would be dropped. If the structure determines the outcome, showing it was "avoidable" is misleading.
      *   **Downside:** It struggles to explain rapid change or specific political ruptures (like the outbreak of war in a specific week).

  ### IV. Is the Puzzle Badly Posed?

  I believe the puzzle is **partially badly posed**, though the tension you feel is real. The error lies in conflating **Topic Selection** with **Causal Attribution**.

  **1. Selection Bias is not Hindsight Bias.**
  Norm 2 (selecting topics based on outcomes) is an unavoidable condition of empirical research. We study the fire, not the non-fire. This is not "hindsight bias" in the psychological sense. Hindsight bias (Norm 1) is the *distortion of the causal mechanism* (believing the agents knew it would burn).
  *   *Correction:* A historian can select a topic *because* WWI happened (Norm 2) while rigorously demonstrating that in July 1914, no one knew it would happen (Norm 1). These are not contradictory; they are sequential steps. One defines the *object* of study; the other defines the *method* of analysis.

  **2. Contingency and Causality are not Independent Demands.**
  In Norm 3, you suggest referees demand both contingency ("it could have gone otherwise") and causality ("this carried the outcome"). In the implicit theory, these are the **same demand**.
  *   To say "A caused B" *means* "If not-A, then probably not-B."
  *   To say "It was contingent" *means* "The cause was not sufficient on its own without specific conditions."
  *   Referees asking for both are simply checking that the historian hasn't slipped into Determinism (Causality without Contingency) or Chaos (Contingency without Causality).

  **3. The Narrative Fallacy is a Pedagogical Necessity, not just Market Pressure.**
  You suggest Norm 4 (Narrative) contradicts the anti-hindsight norm. However, narrative is the only way humans process time. A "list of frictions" is not an explanation; it is a dataset. To explain is to show how $T_1$ became $T_2$. That *is* a narrative. The "sin" is not using narrative; it is using a narrative that implies *teleology* (the end was the goal) rather than *causality* (the end was the result).

  ### Conclusion

  The discipline is not committed to a single, coherent *philosophical* theory, but it is committed to a coherent *pragmatic* one.

  **The Theory:** Historical explanation is the **retrospective reconstruction of prospective uncertainty.**

  *   **What is required:** You must start with the actual (Outcome Selection) but model the agents as if the actual were not yet fixed (Anti-Hindsight). You must show how the actual emerged from the possible (Contingency/Causality).
  *   **What is market noise:** The demand for a "clean arc" (Norm 4) often forces historians to oversimplify the "accumulation of frictions." This is where the practice fails the theory.
  *   **The Verdict:** The tension you identify is not a logical contradiction. It is the **constitutive tension of the discipline.** History is defined by the struggle to tell a story about the past that respects the openness of the future as it was lived.

  If you removed Norm 1 (Anti-Hindsight), you would have **Propaganda** (the winners knew best).
  If you removed Norm 2 (Outcome Selection), you would have **Speculative Fiction**.
  If you removed Norm 3 (Contingency), you would have **Theology**.

  The "odd combination" is not a bug; it is the feature that keeps historiography distinct from both sociology and literature. The discipline is coherent, but it walks a tightrope. Your observation that the market (Norm 4) often pushes historians off that tightrope into determinism is the most valid critique of the *practice*, even if the *theory* remains sound.
