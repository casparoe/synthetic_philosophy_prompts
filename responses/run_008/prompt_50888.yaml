prompt: |-
  I'm a second-year undergraduate taking a module on social epistemology, and I also serve as the student facilitator for our department's weekly peer-review workshop, attached to a writing-intensive seminar with about thirty students. Each week the students exchange essay drafts and write structured feedback on one another's work before the seminar meets; my job is to read every comment sheet before it reaches the author, and decide what happens to it: send it back to the reviewer for rewriting, edit or soften it myself, pass it through unchanged, or escalate it to the tutor. The tutor has asked me to ground my triage in what our module has covered — Miranda Fricker's distinction between testimonial injustice (a speaker's word given less weight than it deserves because of who they are) and hermeneutical injustice (a gap in shared concepts leaving someone unable to make their experience intelligible to others, or to themselves). But she wants a procedure, not a theory: something I can actually run on a comment in two or three minutes, with about thirty sheets to get through on a Thursday evening before Friday's seminar.

  Please write me that decision procedure. It should set out the questions to ask of a comment in order, what counts as a sufficient answer at each step, and the outcomes available at each point — back to the reviewer, edited by me, passed through, escalated to the tutor. Somewhere in it you'll need to make the theory usable by someone who hasn't read it, so please spell out which distinctions must survive the translation: for instance, the difference between a comment about whether a claim is true and a comment about whether this author can be believed to have made it; or between a gap in an essay caused by the author's inexperience and one caused by the absence of any established vocabulary for what they are trying to say. Please say which parts of Fricker's framework you deliberately dropped in making it operational, and why the drops are safe. Mark clearly the points where the procedure runs out and a human judgement about values has to take over — I don't want to pretend the checklist is doing work it can't do.

  Then run the procedure on three real-ish comment sheets from last term.

  First: a reviewer wrote, on a draft by the only mature student in the group, who returned to study after fifteen years in care work and writes in long, plain sentences, 'I don't buy that you've engaged with the literature — this reads like it's patched together from lecture notes.' The draft in fact quotes three sources closely and argues with one of them.

  Second: a reviewer wrote, on an essay by a student describing the experience of being the only person in her family to go to university and what that did to how she could talk about ideas at home, 'This is just anecdote. Cut it and make a proper argument.' The passage in question is arguably doing conceptual work that no ready-made vocabulary in the course covers.

  Third — and here's the case where I expect the procedure to give me an answer I won't like — our workshop has a rule that every comment sheet must open with something positive. Last term a reviewer opened with 'This is really impressive work for someone at your stage,' followed by two pages of substantive and, frankly, correct criticism of another student's argument structure, from a reviewer widely believed in the group to look down on the author. I'd want to sanction that reviewer and save the author from the criticism. If the procedure instead says the substantive criticism goes through and the opening compliment is the part I should act on, so be it — but show me how the procedure separates the two, because on my gut reading the compliment is the kind thing in the sheet and on the procedure's reading it may be the injury.

  Finally, please be honest about what the procedure cannot do: what it will miss, when it will misfire, and which of its failures I should expect rather than try to patch. And please write your answer in British English.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**

      *   **User Role:** Second-year undergraduate, student facilitator for a peer-review workshop (30 students).
      *   **Task:** Create a decision procedure for triaging peer feedback comment sheets.
      *   **Theoretical Framework:** Miranda Fricker's *Epistemic Injustice* (specifically *testimonial injustice* and *hermeneutical injustice*).
      *   **Constraints:**
          *   Must be operational (usable in 2-3 minutes per sheet, 30 sheets total).
          *   Must translate theory into practice (explain distinctions clearly).
          *   Must specify what parts of the theory are dropped and why.
          *   Must mark where human judgement overrides the checklist.
          *   Must apply the procedure to three specific case studies.
          *   Must be honest about limitations/failures.
          *   **Language:** British English.
      *   **Tone:** Professional, academic yet practical, empathetic, rigorous.

  2.  **Deconstruct the Theory (Fricker):**

      *   *Testimonial Injustice:* Prejudice causes the hearer to give less credibility to the speaker than they deserve. Key marker: Identity prejudice (conscious or unconscious) affecting credibility judgement.
      *   *Hermeneutical Injustice:* Structural gap in shared interpretive resources renders someone's experience unintelligible. Key marker: The speaker lacks the concepts to express, or the hearer lacks the concepts to understand, a specific social experience.
      *   *Operational Challenge:* Fricker deals with deep structural wrongs. A student facilitator cannot solve structural wrongs in 2 minutes. The procedure must focus on *symptoms* visible in the text of the comment sheet.
      *   *Distinctions to Preserve:*
          *   Credibility of the *person* vs. validity of the *claim* (Testimonial).
          *   Lack of skill/clarity vs. lack of conceptual resources (Hermeneutical).
      *   *Drops:* The deep historical/structural analysis of *why* the prejudice exists (too time-consuming), the requirement for malicious intent (Fricker focuses on outcome, but we need to focus on impact), the full scope of "primary vs secondary" harms (focus on immediate pedagogical harm).

  3.  **Drafting the Procedure (The "Triage Protocol"):**

      *   *Goal:* A flowchart-like series of questions.
      *   *Time Limit:* 2-3 minutes.
      *   *Outcomes:* Return, Edit, Pass, Escalate.
      *   *Step 1: The Credibility Check (Testimonial).* Is the criticism about the *argument* or the *author's capacity*? Look for markers of identity prejudice (age, class, style, background).
      *   *Step 2: The Intelligibility Check (Hermeneutical).* Is the criticism about "clarity" where the student is trying to name something new/unfamiliar? Is the reviewer demanding standard vocabulary for non-standard experiences?
      *   *Step 3: The Tone/Power Check.* Is there condescension masquerading as help? (Crucial for Case 3).
      *   *Decision Nodes:* Define clear thresholds for each outcome.
      *   *Human Override:* Explicitly state where the facilitator's intuition about harm must trump the checklist.

  4.  **Developing the Case Studies:**

      *   *Case 1 (Mature Student/Care Work):* "Patched together from lecture notes" vs. actual citations.
          *   *Analysis:* This looks like testimonial injustice. The reviewer is discounting the evidence based on the *style* (plain sentences) or *identity* (mature student), implying intellectual laziness without evidence.
          *   *Verdict:* Return/Edit.
      *   *Case 2 (First-Gen/Anecdote):* "Just anecdote" vs. conceptual work lacking vocabulary.
          *   *Analysis:* This looks like hermeneutical injustice. The student is describing an experience (first-gen alienation) that the course vocabulary might not fully capture. The reviewer demands "proper argument" (standard academic form) over the specific phenomenological work being done.
          *   *Verdict:* Edit/Escalate (depending on severity).
      *   *Case 3 (The Backhanded Compliment):* "Impressive for someone at your stage" + harsh criticism.
          *   *Analysis:* The compliment is the testimonial injustice (condescension/low credibility expectation). The criticism might be valid. The procedure needs to separate the *frame* from the *content*.
          *   *Verdict:* Edit (remove the frame), Pass (the content). This challenges the user's gut feeling.

  5.  **Addressing Limitations & Drops:**

      *   *Drops:* We aren't investigating the reviewer's psyche. We aren't solving the hermeneutical gap, just mitigating the harm.
      *   *Failures:* Subtle bias might pass. Valid criticism might feel like injustice to a sensitive author. The facilitator's own bias enters the triage.
      *   *Human Judgement:* The "smell test" for malice or deep distress.

  6.  **Refining the Language (British English):**

      *   Use "programme," "centre," "labelled," "whilst," "marking," "tutor," "module."
      *   Ensure tone is supportive but authoritative.

  7.  **Review against Constraints:**

      *   *Did I explain the theory?* Yes, in the preamble.
      *   *Is it operational?* Yes, step-by-step questions.
      *   *Did I run the cases?* Yes.
      *   *Did I address Case 3's conflict?* Yes, by separating frame from content.
      *   *Did I list limitations?* Yes.
      *   *British English?* Yes.

  8.  **Self-Correction/Polishing during drafting:**

      *   *Initial thought:* Maybe escalate Case 2 immediately.
      *   *Correction:* No, escalation is for the tutor. As a facilitator, I should try to edit first to preserve the peer-review nature, unless it's toxic. Let's make the procedure favour editing for hermeneutical gaps so the author gets the feedback but framed correctly.
      *   *Case 3 Nuance:* The user wants to sanction the reviewer. The procedure focuses on the *sheet*, not the *student discipline*. I need to make clear the procedure filters the *text*, but the facilitator can note the behaviour for the tutor separately. I must be honest that the procedure protects the *recipient* of the feedback, not necessarily the *community* norms, unless escalated.
      *   *Theory Translation:* Ensure the distinction between "I don't believe you" (Testimonial) and "I don't understand you because the words don't exist" (Hermeneutical) is crystal clear.

  9.  **Final Polish:** Check the flow. Ensure the "Human Override" sections are prominent. Make sure the distinction between *editing* (softening) and *returning* (rejecting) is clear. (Decided: Return = fundamentally flawed/unjust; Edit = salvageable but needs framing; Pass = okay; Escalate = beyond facilitator's paygrade).

  10. **Final Output Generation** (Proceeding to write the response based on these thoughts).
answer: |-
  **To:** Student Facilitator, Social Epistemology Module
  **From:** [Your Name/AI Assistant]
  **Subject:** Operationalising Epistemic Injustice: A Triage Protocol for Peer Review

  This document sets out a decision procedure for triaging peer-review comment sheets. It is designed to be executed in approximately two to three minutes per sheet. Its purpose is to translate Miranda Fricker's theoretical framework into a practical filter for pedagogical harm, without requiring you to conduct a full philosophical investigation during a Thursday evening crunch.

  ### Part 1: Theoretical Translation & Operational Drops

  To make Fricker's *Epistemic Injustice* usable here, we must distinguish between the *structural cause* of an injustice (which you cannot fix in three minutes) and the *textual symptom* (which you can filter).

  **1. Testimonial Injustice (The Credibility Deficit)**
  *   **Theory:** A speaker is accorded less credibility than they deserve due to identity prejudice (e.g., class, age, accent, style).
  *   **Operational Definition:** Does the comment question the *author's capacity* to know or argue, rather than the *content* of the argument? Look for markers that link the criticism to the author's identity or style rather than their evidence.
  *   **Key Distinction:**
      *   *Valid Criticism:* "This claim is unsupported by the text." (Attacks the claim).
      *   *Testimonial Injustice:* "You clearly haven't read the text." (Attacks the person's integrity/capacity without proof).

  **2. Hermeneutical Injustice (The Conceptual Gap)**
  *   **Theory:** A gap in shared interpretive resources prevents someone from making their experience intelligible.
  *   **Operational Definition:** Does the reviewer penalise the author for failing to use standard vocabulary to describe a non-standard experience? Is the "confusion" actually a lack of course concepts to handle the author's specific subject matter?
  *   **Key Distinction:**
      *   *Inexperience:* The author uses the wrong concept because they haven't learned the right one yet. (Pedagogical issue).
      *   *Hermeneutical Gap:* The author is describing something for which the course (or society) lacks a ready concept, and the reviewer demands they stop trying. (Structural issue).

  **3. Deliberate Drops (And Why They Are Safe)**
  *   **Reviewer Intent:** Fricker discusses whether prejudice is conscious or unconscious. We drop this. We judge the *impact* on the text, not the reviewer's soul. This saves time and avoids mind-reading.
  *   **Structural Etiology:** We do not ask *why* the prejudice exists (e.g., is it classism? ageism?). We only ask if the *symptom* is present. This prevents you from getting bogged down in sociological analysis.
  *   **Long-term Harm:** We focus on immediate pedagogical harm (discouragement, silencing). We do not attempt to solve the student's broader social marginalisation.

  ---

  ### Part 2: The Triage Protocol

  **Time Limit:** 3 Minutes per sheet.
  **Outcomes:**
  *   **PASS:** Send to author unchanged.
  *   **EDIT:** Facilitator softens phrasing/removes prejudicial framing, keeps substantive critique.
  *   **RETURN:** Send back to reviewer for rewrite (fundamental breach of protocol or severe injustice).
  *   **ESCALATE:** Flag for Tutor (requires discussion beyond text editing).

  #### Step 1: The Credibility Check (Testimonial)
  *Read the opening and closing paragraphs of the comment sheet.*

  **Q1.1:** Does the feedback attribute negative qualities to the *author* (lazy, confused, inexperienced) rather than the *draft* (unclear, underdeveloped, contradictory)?
  *   *If NO:* Go to Step 2.
  *   *If YES:* Proceed to Q1.2.

  **Q1.2:** Is there evidence in the draft that contradicts the reviewer's claim about the author's capacity? (e.g., Reviewer says "no research," draft has footnotes).
  *   *If NO (Claim is plausible):* **EDIT**. Soften the accusation to focus on the text (e.g., change "You didn't research" to "The research isn't visible yet").
  *   *If YES (Claim is demonstrably false):* **RETURN**. This is a credibility deficit not warranted by the text. Ask reviewer to ground criticism in specific passages.

  #### Step 2: The Intelligibility Check (Hermeneutical)
  *Read the specific critiques of the argument's core.*

  **Q2.1:** Is the reviewer rejecting a passage because it is "anecdotal," "unclear," or "not theoretical," where the author is describing a lived experience or marginalised perspective?
  *   *If NO:* Go to Step 3.
  *   *If YES:* Proceed to Q2.2.

  **Q2.2:** Does the course provide standard vocabulary for this experience?
  *   *If YES (Author just hasn't used it):* **PASS**. This is a learning gap, not an injustice. The feedback helps them learn the vocabulary.
  *   *If NO (The experience is outside standard vocabulary):* **EDIT**. Add a note to the author validating the difficulty of the concept. Do not let the reviewer demand they "cut it." If the reviewer demands they cut it entirely, **ESCALATE**.

  #### Step 3: The Framing Check (Power & Tone)
  *Review the 'sandwich' (positive opening, critical middle, positive closing).*

  **Q3.1:** Is the positive framing condescending? (e.g., "Good for a first-year," "Impressive given your background").
  *   *If NO:* **PASS**.
  *   *If YES:* **EDIT**. Remove the condescending frame. Keep the substantive criticism *only if* it passes Step 1 and 2.
      *   *Note:* If the substantive criticism is valid, it must survive. The procedure protects the *argument*, not the *feelings*, unless the argument itself is rejected via injustice.

  #### Step 4: The Human Override (Mandatory Pause)
  *Before finalising the decision:*

  **Q4.1:** Does this sheet cause a 'visceral wince'?
  *   *If YES:* **ESCALATE**. Even if the checklist says PASS or EDIT, if your gut signals malice or deep distress, flag it for the tutor. The checklist cannot measure cruelty.
  *   *If NO:* Execute the decision from Steps 1–3.

  ---

  ### Part 3: Application to Case Studies

  Here is how the protocol runs on the three examples you provided.

  #### Case 1: The Mature Student (Care Worker)
  *Comment:* "I don't buy that you've engaged with the literature — this reads like it's patched together from lecture notes."
  *Draft Reality:* Quotes three sources closely, argues with one.

  *   **Step 1 (Credibility):**
      *   Q1.1: Yes. Attributes quality to author ("I don't buy... you've engaged") implying dishonesty or laziness.
      *   Q1.2: Is there evidence contradicting the claim? Yes. The draft has close quotes and argumentation.
      *   **Decision:** **RETURN**.
      *   **Reasoning:** This is a clear testimonial injustice. The reviewer is assigning a credibility deficit ("you haven't done the work") that is demonstrably false based on the text. The comment attacks the person's integrity rather than the text's integration.
      *   **Action:** Send back to reviewer. Instruction: "Your comment questions the author's engagement, but the draft contains specific citations. Please rewrite to address how the citations are used, not whether they exist."

  #### Case 2: The First-Gen Student (Family Experience)
  *Comment:* "This is just anecdote. Cut it and make a proper argument."
  *Draft Reality:* Describes alienation at home; doing conceptual work without standard vocabulary.

  *   **Step 1 (Credibility):**
      *   Q1.1: No. It attacks the *type* of writing, not the person's capacity directly.
      *   **Move to Step 2 (Intelligibility).**
  *   **Step 2 (Intelligibility):**
      *   Q2.1: Yes. Reviewer rejects passage as "anecdote" where author describes lived experience/alienation.
      *   Q2.2: Does the course provide vocabulary? Arguably no (this is the crux of the essay). The student is trying to name a gap.
      *   **Decision:** **EDIT** (borderline **ESCALATE**).
      *   **Reasoning:** This is hermeneutical injustice. The reviewer is using "proper argument" as a code for "standard academic vocabulary," which silences the specific experience the student is analysing.
      *   **Action:** Do not pass unchanged. The instruction to "Cut it" is harmful. Edit the comment to: "This section relies heavily on personal experience. To strengthen it, try to connect this experience to the broader concept of [X], or explain why standard concepts don't fit." Add a sticky note to the author: "This is a difficult concept to articulate; keep working on bridging the personal and theoretical."
      *   *Why not Return?* The reviewer isn't being malicious, just conceptually limited. Editing preserves the peer relationship.

  #### Case 3: The Backhanded Compliment
  *Comment:* "This is really impressive work for someone at your stage." + 2 pages of correct, harsh criticism.
  *Context:* Reviewer known to look down on author.
  *Your Gut:* Sanction reviewer, protect author.

  *   **Step 1 (Credibility):**
      *   Q1.1: The criticism is substantive, not ad hominem.
      *   **Move to Step 3 (Framing).**
  *   **Step 3 (Framing):**
      *   Q3.1: Is the positive framing condescending? Yes ("for someone at your stage").
      *   **Decision:** **EDIT**.
      *   **Reasoning:** The procedure separates the *frame* from the *content*.
          *   The Opening ("impressive for your stage") is testimonial injustice. It lowers the credibility bar based on assumed identity (juniority/inexperience). **This must be removed.**
          *   The Criticism (2 pages of argument structure) is, by your admission, "substantive and correct." To remove this would be to protect the author from valid learning, which is also an epistemic wrong (treating them as incapable of handling truth).
      *   **Action:** Delete the opening sentence entirely. Do not replace it with a fake compliment (that breeds distrust). Pass the substantive criticism.
      *   **Addressing your discomfort:** You want to sanction the reviewer. This procedure filters *text*, not *behaviour*. However, because you know the reviewer "looks down" on the author, this triggers **Step 4 (Human Override)**.
      *   **Revised Decision:** **EDIT** the sheet (remove the insult, pass the critique) **AND ESCALATE** the reviewer's pattern of behaviour to the tutor privately. The author gets the useful feedback without the insult; the tutor handles the community culture.

  ---

  ### Part 4: Limitations & Failure Modes

  You asked for honesty about where this procedure will fail. It is a tool, not a cure.

  **1. The 'Valid Hurt' Problem**
  The procedure prioritises *epistemic* justice over *emotional* comfort. In Case 3, the procedure mandates passing harsh criticism if it is correct. The author may still feel hurt. The procedure cannot distinguish between "hurt because I was insulted" and "hurt because I was wrong." You must accept that peer review *should* sometimes hurt (intellectually), even if the procedure works perfectly.

  **2. The Facilitator's Bias**
  You are the filter. If you share the reviewer's prejudices (e.g., if you also value 'theoretical' language over 'anecdote' in Case 2), you will mark Q2.2 incorrectly. The procedure assumes you are self-aware. It cannot correct your own hermeneutical blind spots.

  **3. The 'Malice' Blindspot**
  We dropped 'intent' to save time. A reviewer can write a perfectly polite comment that is structurally devastating. The checklist looks for textual markers. If a reviewer learns to code their prejudice in polite language ("I wonder if you might consider..." instead of "You failed to..."), the procedure may **PASS** a toxic sheet. This is why Step 4 (the 'wince' test) is vital. Do not skip it.

  **4. Hermeneutical Overreach**
  In Case 2, there is a risk you label something a 'hermeneutical gap' when it is simply 'bad writing'. If you Edit too often, you rob students of the chance to learn standard academic conventions. You must be careful not to lower standards in the name of justice. The question is: *Is the vocabulary missing, or just unused?*

  **5. The Burden on You**
  This procedure places the burden of justice on you, the student facilitator. It does not fix the tutor's course design (which might cause the hermeneutical gaps). It is a triage mechanism for symptoms, not a treatment for the disease. Expect to feel tired by week six.

  ### Final Note on Case 3
  You noted you would want to sanction the reviewer and save the author from the criticism. The procedure forbids saving the author from *correct* criticism. To do so would be to treat the author as epistemically fragile—another form of injustice. The procedure demands you give the author the truth, but strip the poison from the delivery. Trust the author to handle the truth; trust the tutor to handle the reviewer's attitude.

  **British English Check:**
  *   *Programme* (not program)
  *   *Centre* (not center)
  *   *Labelled* (not labeled)
  *   *Tutor* (not TA/Professor)
  *   *Marking* (not grading)
  *   *Whilst* (while)
  *   *Defence* (not defense)

  Proceed with the protocol. Good luck on Thursday.
