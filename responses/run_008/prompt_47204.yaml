answer: |-
  ### Verdict on Your Verdicts

  Your intuition is correctly identifying the tension, but your taxonomy is misaligned. You are sorting cases by **Implementation vs. Function**, but the actual driver is **Coordination Structure vs. Physical Constraint**.

  You are treating "lock-in" as a permanent state rather than a *resistance to marginal change*. This causes your confusion on the EV/Gas case: you see the reversal as evidence that the 1900 lock-in wasn't "real." It was real; it was just overcome by a *paradigm shift* (battery chemistry + climate policy) that reset the switching costs, rather than marginal optimization.

  You are also conflating **Selection of a Specific Vehicle** (English, QWERTY) with **Selection of a Capability** (Literacy, Transport). The former is almost always path-dependent; the latter is almost always convergent. Your English verdict is correct (contingent), but your worry that it "cuts against convergence" is wrong. A global lingua franca is convergent; *English* is the path-dependent winner.

  ### The Principle: The Coordination-Paradigm Threshold

  Path dependence is not a binary property of history; it is a function of switching costs relative to coordination capacity and technological regimes. Here is the principle, broken into three clauses.

  **Clause 1: The Fragmentation Lock-In (High Confidence)**
  > In fragmented systems with high network externalities and no central coordinator, suboptimal standards persist indefinitely, even if superior alternatives exist.
  > *   **Mechanism:** Individual actors cannot capture the benefit of switching alone.
  > *   **Motivating Case:** **QWERTY** (typists/employers fragmented) and **US Metric System** (public/market fragmented).
  > *   **Prediction:** Lock-in holds until an external shock forces coordination.

  **Clause 2: The Coordination Correction (Medium-High Confidence)**
  > In centralized or oligopolistic systems where actors can negotiate joint switching costs, efficiency pressures will override historical accidents within a single technological paradigm.
  > *   **Mechanism:** Switching costs are internalized by the coordinating body; the "network" is managed, not emergent.
  > *   **Motivating Case:** **Railroad Gauges**. The industry was concentrated enough to schedule a "National Gauge Change" (mostly 1886). The benefit of interoperability outweighed the cost of re-laying track, and they could agree on *when* to do it.
  > *   **Prediction:** Standards in regulated industries or state-run systems will converge faster than in free markets.

  **Clause 3: The Paradigm Reset (Medium Confidence)**
  > Lock-in is binding only *within* a technological paradigm. When a new paradigm emerges (changing the underlying physics or cost structure), previous switching costs become sunk and irrelevant, allowing convergence on the new optimal standard.
  > *   **Mechanism:** The old infrastructure loses value; the new infrastructure starts from zero.
  > *   **Motivating Case:** **Gas vs. Electric Cars**. ICE was locked in (Clause 1) due to fuel infrastructure. EVs are not "undoing" the lock-in; they are bypassing it because the battery/fuel-cell paradigm renders gas stations less relevant.
  > *   **Prediction:** Historical standards persist until the technology becomes obsolete, not until they are optimized.

  ### What You Must Give Up

  To adopt this principle, you must abandon two specific intuitions:

  1.  **The Permanence of Lock-In:** You must give up the idea that "locked in" implies "forever." QWERTY is locked in *for the mechanical/digital keyboard paradigm*. If we move to voice-to-text or neural interfaces, QWERTY vanishes overnight. Your verdict on EVs suggested you thought lock-in should be permanent; this principle says lock-in is *regime-dependent*.
  2.  **Implementation vs. Function as the Primary Divider:** You must give up the idea that "implementations" are always path-dependent and "functions" always convergent. **English** is an implementation, yet it is currently locked in (Clause 1) due to network effects, even though *a* lingua franca is convergent (Clause 3/Function). The divider is not *what* the thing is, but *how the actors coordinating it are structured*.

  **The Verdict I Cannot Accommodate:**
  I cannot accommodate your intuition that **Industrialization** is purely convergent while **20th Century Wars** are purely contingent *if* you view them as independent. Under Clause 3, Industrialization is a paradigm shift that *increases* the capacity for war (convergence of capability), but the specific timing and actors (WWI/WWII) are Fragmentation Lock-In (Clause 1) of geopolitical alliances. You want to treat "War" as a contingent event and "Industrialization" as a structural force. This principle argues they are the same force viewed at different time scales. You must accept that industrialization made large-scale war *convergent* (inevitable capability), even if the specific 1939 start date was contingent.

  ### Predictions on New Cases

  **1. Widespread Written Musical Notation**
  *   **Verdict:** **Locked-In Implementation (Clause 1).**
  *   **Reasoning:** Western staff notation is not objectively superior to tablature or solfege for all functions, but it has massive network effects (publishing, education, software). The "industry" (musicians, conservatories) is too fragmented to coordinate a switch to a more workable system (e.g., numbered notation).
  *   **Confidence:** 85%.

  **2. Widespread Decimal Arithmetic**
  *   **Verdict:** **Convergent Function (Clause 3/Physics).**
  *   **Reasoning:** Base-10 is not the only mathematical base, but it is tied to human anatomy (10 fingers). While Base-12 is mathematically superior for fractions, the "switching cost" of retraining human biology/cognition is too high. However, in computing, we see a **Paradigm Reset** to Binary (Base-2) because the "actors" (transistors) are not human. Decimal persists for humans due to biological convergence; Binary converges for machines due to physical constraints.
  *   **Confidence:** 90%.

  **3. The Burning of the Library of Alexandria**
  *   **Verdict:** **Delayed Convergence (Clause 3).**
  *   **Reasoning:** This is the hardest case. If knowledge is "information," it is subject to Clause 1 (loss is permanent). If knowledge is "discoverable truth," it is subject to Clause 3 (rediscovery).
  *   **Prediction:** The burning cost the world *time* (delay), not *capability* (function). Calculus, steam power, and anatomy were rediscovered because the physical/economic pressures to find them remained. However, specific *historical data* (lost plays, unique histories) is gone forever.
  *   **Nuance:** Science converges; History does not. The Library contained both.
  *   **Confidence:** 60%. (See below).

  ### Confidence and Uncertainty

  *   **Clause 1 (Fragmentation Lock-In):** **High Confidence (90%).** This is standard economic theory (Arthur, David) and holds up well empirically.
  *   **Clause 2 (Coordination Correction):** **Medium-High Confidence (80%).** Holds for railroads and state standards, but fails if the coordinating body is corrupt or incompetent.
  *   **Clause 3 (Paradigm Reset):** **Medium Confidence (70%).** Harder to predict when a paradigm shift is "real" vs. a bubble.
  *   **Application to Library of Alexandria:** **Low Confidence (60%).**

  **The One Point of Least Certainty:**
  I am least sure about the **Library of Alexandria** verdict. It rests on the assumption that scientific ideas are *inevitably rediscoverable* given enough time and pressure. This assumes a "Platonic" view of science—that truth is waiting to be found. However, if knowledge is deeply cumulative and path-dependent (e.g., if the Antikythera mechanism implies a lost tradition of mechanical computation that, if continued, would have triggered an industrial revolution 1500 years early), then the loss was not just a delay but a **divergence**. It is possible that specific historical knowledge acts as a "keystone" without which the convergent function never triggers. I am betting on convergence (rediscovery), but the possibility of a "Keystone Loss" that derails convergence is the softest footing in this entire analysis.
