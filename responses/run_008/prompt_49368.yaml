answer: |-
  The term you are looking for is **Metalinguistic Negotiation**.

  This is not a collection of separate phenomena glued together; it is a single, coherent philosophical category. It was formalized in contemporary analytic philosophy (most notably by David Plunkett and Tim Sundell) to describe exactly the scenario you outlined: disputes that look like they are about the world, but are actually about **which concepts we ought to use to describe the world.**

  Here is the carving you asked for. This defines the edges of the phenomenon, separates it from its neighbors, and takes a stance on the "semantics" dismissal.

  ### 1. The Commitment: One Phenomenon
  The fighting experts (Group 1), the dismissers (Group 2), and the abolitionists (Group 3) are all participating in the same underlying activity. They are not engaged in three different types of disagreement. They are engaged in a **negotiation over the normative utility of a concept.**

  *   **Group 1** wants to stretch or shrink the concept to capture specific material benefits (visas, copyright).
  *   **Group 3** wants to dissolve the concept because they believe its normative utility is negative (stigma, medicalization).
  *   **Group 2** is the only one making a category error. They assume that because the *facts* are agreed upon, the *consequences* must be negligible.

  In a metalinguistic negotiation, the "word" is not a label slapped on a finished object; it is a tool that *completes* the object for social purposes. When you argue whether obesity is a "disease," you are not arguing about the physiology (the facts); you are arguing about whether the *concept* of disease is the right tool to manage that physiology (insurance coverage, stigma, research funding).

  ### 2. The Edges: How to Carve It
  To distinguish this from other disputes, apply these two boundary tests. If a dispute fails either test, it is not a metalinguistic negotiation.

  **Edge A: The Factual Agreement Test (vs. Ordinary Dispute)**
  *   **Ordinary Factual Dispute:** Parties disagree on the non-linguistic state of the world. (e.g., "Does this substance contain carcinogens?")
  *   **Metalinguistic Negotiation:** Parties agree on the non-linguistic state of the world but disagree on the *classification*. (e.g., "We agree this substance contains carcinogens; we disagree on whether that makes it a 'pollutant' under the Act.")
  *   *The Boundary:* If new empirical data would settle the fight, it is a factual dispute. If new empirical data leaves the fight unchanged (because the fight is about *policy goals* masked as definitions), it is a metalinguistic negotiation.

  **Edge B: The Stakes Test (vs. Empty Squabble)**
  *   **Empty Definitional Squabble:** The label has no downstream consequences. (e.g., "Is a hotdog a sandwich?")
  *   **Metalinguistic Negotiation:** The label triggers a normative or legal mechanism. (e.g., "Is an e-sports player an 'athlete'?")
  *   *The Boundary:* If you can swap the word without changing the outcome, it's a squabble. If swapping the word changes who gets paid, who gets jailed, or who gets treated, it is a metalinguistic negotiation.

  **Why Group 3 fits:**
  Abolitionists (e.g., "stop calling addiction a disease") pass both tests. They agree on the facts of addiction, and they agree the label has stakes (stigma/treatment). They argue that the *concept itself* is the problem. This is a move within the negotiation: arguing that the best use of our conceptual repertoire is to eliminate that term entirely.

  ### 3. The Stance: Is "It's Just Semantics" Ever Right?
  In the specific cases you described (law, policy, rights, funding), the "just semantics" dismissal is **always a mistake.**

  Here is why: In legal and social systems, semantics *is* substance.

  When a philosopher says "it's just semantics," they usually mean "there is no metaphysical difference in the universe." That is true. There is no cosmic "athlete-ness" particle that an e-sports player lacks. But in a regulatory context, the "metaphysical truth" is irrelevant. The *operational truth* is determined by the label.

  To say "it's just semantics" in a copyright or visa dispute is to misunderstand how institutional reality is constructed. Institutions run on language. The code of the law *is* semantic. Therefore, fighting over the semantics is fighting over the code.

  *   **When the dismissal is wrong:** In any context where the definition gates access to resources, rights, or social standing. Here, "semantics" is the mechanism of power. Dismissing it is dismissing the power dynamic.
  *   **When the dismissal might be right:** Only in purely descriptive contexts with no normative teeth. (e.g., Two astronomers arguing whether a dwarf planet is a "planet" when no funding or mission status depends on the distinction). But even then, it often affects public perception and funding, so the "just semantics" defense is usually weak.

  ### Summary for your Reporting
  You can describe this as a **Metalinguistic Negotiation**.

  *   **The Hook:** It looks like a fight about facts, but it's a fight about *tools*.
  *   **The Mechanism:** Experts agree on the territory but fight over the map, because the map determines who owns the land.
  *   **The Takeaway:** The "just semantics" crowd is wrong. In policy and law, semantics are not a description of reality; they are a technology for building it. When experts fight over a label with high stakes, they are not being pedantic; they are engaging in **conceptual politics**.

  This framework allows you to treat Group 1 (expansionists), Group 3 (abolitionists), and the "semantics" dismissers not as confused parties, but as participants in a recognizable, high-stakes philosophical game where the prize is the authority to define social reality.
