answer: |-
  The porch swing chain squeaked, a rusted rhythm against the cicadas. The river below was back in its banks, dark and slick, carrying the smell of silt and ruined basements. Ruth held a beer she wasn't drinking. Corinne smoked, the ember flaring and dying.

  "They're calling it the Bridge Five," Corinne said. She didn't look at Ruth. "In the diner. Like it's a sports team."

  "Let them talk."

  "They say you didn't even hesitate. That you swung the boat away from Sycamore Street before the motor even idled."

  "The bridge was collapsing, Corinne. The physics were simple."

  "See?" Corinne flicked ash onto the boards. "That's what I mean. Physics. Simple. You make it sound like you were balancing a ledger."

  "I work in public health. I balance ledgers for a living. If a vaccine program saves five hundred kids for the cost of one treatment, you fund the vaccine. You don't fund the treatment because the one kid is crying louder."

  "This isn't a clinic. This is Mark. Your husband."

  "Mark is alive."

  "Because he climbed a chimney. Not because you went to get him." Corinne turned finally, her face shadowed. "I read that stuff, Ruth. Before I quit. I remember the argument. The man on the beach. He can save his wife or a stranger. Utilitarianism says he saves the stranger if the stranger is a surgeon who'll save more lives. But even if the stranger is nobody special, the theory says the wife gets no extra weight. Just one unit of happiness like anyone else."

  "That's a caricature."

  "Is it? Because when you tell the story, you talk about the five. You talk about the collapse vector. You don't talk about Mark. If I asked you why you didn't go to Sycamore Street, you wouldn't say 'Because I was scared' or 'Because I couldn't bear to see him die.' You'd say 'Because five outweighs one.'"

  "I'm saying that my training kicked in. That's not the same as not loving him."

  "It's exactly the same," Corinne said. "Bernard Williams wrote about this. The man who saves his wife. He says it's okay to save her. But if the man stops to think, 'In this situation, it is permissible to save my wife because she is my wife,' he's already lost her. He's got one thought too many. He should just save her because she's *his*. The moment you need a rule to justify loving your own person, you aren't loving them anymore. You're just following a rule that allows it."

  Ruth took a drink. It was warm. "You think I stopped to consult a rulebook while the bridge was going down?"

  "I think you've consulted it for years. I think you've trained yourself so hard to be impartial that when the water rose, you didn't see a husband. You saw a variable. And that terrifies me. Because integrity isn't about doing the right thing for the world. It's about being someone specific. It's about having projects and people that are yours, that you don't have to justify to the universe. You surrendered that. You made yourself a channel for the greater good, and now you're empty."

  "I am not empty." Ruth's voice tightened. "You think I don't know what I live by? There's a difference between the criterion of right action and the decision procedure. I don't run the calculus in the moment. I cultivate instincts. I love Mark wholeheartedly. That love is part of the machinery that makes life worth living. My theory predicts that people should have deep attachments. It just says that when those attachments clash with catastrophic loss, the attachments don't trump the body count."

  "So the love is just… instrumental?" Corinne laughed, a short, hard sound. "You cultivate love because it's efficient? That's monstrous. You're saying the distinction saves your theory, but all it does is admit you don't actually live by it. When it counted, you lived by the calculus. The 'instinct' you cultivated was the instinct to ignore your own life."

  "It's not ignoring my life. It's acknowledging that Mark's life isn't worth more than five others just because I sleep next to him."

  "Isn't it?" Corinne leaned forward, elbows on knees. "To you, isn't it? If you say no, if you say his life is mathematically equivalent to the guy who stole radios from the hardware store, then what are you doing coming home to him? Why not move in with the Bridge Five? They owe you."

  "Don't be cruel."

  "I'm being precise. You want precision. Here it is. You sacrificed your integrity. You let the theory demand that you abandon the ground you stand on. And now you're standing here telling me it was rational. Rationality isn't enough to sleep at night, Ruth."

  "And what sleeps better?" Ruth snapped. "Guilt? Or knowing you let five people drown because you wanted to keep your hands clean? You talk about integrity like it's a virtue. What does it add to the argument besides applause? 'I saved my husband because he's mine.' Okay. And the five strangers? Their wives? Their kids? Does your integrity pay their bills? Does it dry out their walls?"

  "It pays for being human!" Corinne stood up, pacing the small porch. "It acknowledges that we aren't gods. We aren't supposed to hold the weight of the whole world. That's why we have families. To limit the scope. To say, 'I am responsible for this one, and you are responsible for that one.' If everyone did that, maybe the bridge doesn't collapse because the maintenance budget wasn't slashed to fund your public health metrics."

  "That's a strawman. You know that."

  "It's the consequence! You want to talk negative responsibility? You want to talk about what happens when you don't act? Fine. Turn it around. You're asking me to say Mark matters more. I am saying he does. To me. To you. And if you can't say that, then you're already dead. You're just walking around waiting for the next calculation."

  Ruth set the beer down. The glass clicked hard against the wood. "So answer it. Don't talk about scope. Don't talk about being human. If you were in that boat. And you saw Dad on the roof. And five kids on the bridge. And you could only take one group. Who do you take?"

  Corinne froze. The cigarette burned down to her fingers. She didn't drop it.

  "Don't lie," Ruth said. "Don't give me the sister speech. Give me the captain's answer."

  "I'm not the captain."

  "You're the one judging me. So judge yourself. Does Dad count for more than five kids? Yes or no."

  Corinne crushed the cigarette out on the sole of her boot. She looked out at the river, where the water moved silently, hiding the debris. "I don't know," she whispered. "I don't know if I could live with either."

  "Exactly. So don't tell me my integrity is broken because I chose the math that lets me sleep. You don't know what you'd do. You just know you want to be the kind of person who wouldn't have to choose."

  "I want to be the kind of person who loves her family more than strangers," Corinne said, her voice shaking. "Even if that makes me bad. Especially if that makes me bad. Because if I'm not that, then I'm nobody's sister. I'm just… staff."

  Ruth looked at her hands. They were still stained with river mud under the nails, a line of grime that wouldn't scrub out. "I know who you are, Corinne."

  "Do you? Because you left Dad in the hospice wing to go to that conference in Atlanta. You said it was for the greater good. More lives saved. Was that the calculus too?"

  The air left the porch. Ruth flinched, actually flinched, as if struck.

  "That's not fair," Ruth said.

  "You said no seminar diction," Corinne said, tears finally spilling, hot and angry. "So I'm talking about us. You treat us like variables. You always have. I'm just the only one who remembers the names of the variables."

  Ruth stood up. She walked to the railing, gripping the wood until her knuckles whitened. The river didn't care. It never had.

  "I chose the five," Ruth said to the water. "Because I couldn't carry five ghosts. I can carry Mark's anger. I can carry yours. I can carry my own shame. I couldn't carry five strangers who died because I loved my husband too much to let them go."

  "That's not love," Corinne said softly. "That's accounting."

  "Maybe." Ruth turned back. She looked exhausted, older than three weeks ago. "But the boat is still floating. And Mark is still alive. And you're here."

  Corinne looked at her sister. The resentment was there, hard and bright, but underneath it was the terror of the water, the same terror they both breathed. She walked to the table where the beer sat. She picked up the bottle, checked it, and poured the warm foam into the sink. She opened a fresh one from the cooler, the cap hissing.

  She set it down in front of Ruth.

  "Drink it," Corinne said. "Before it gets warm."

  "Corinne—"

  "Drink it." Corinne sat back down on the swing. She didn't look at Ruth. She lit another cigarette, her hands steady now. "We're not done. But not tonight."

  Ruth looked at the bottle. Condensation was already forming on the glass. She picked it up. She didn't drink. She just held the cold against her palm, grounding herself, while the river slid past them, indifferent to who belonged to whom.
