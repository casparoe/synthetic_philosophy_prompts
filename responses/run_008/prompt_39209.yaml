      *   *Preferences cannot be mistaken:* This is a definitional move within the theory, but it limits the theory's ability to explain welfare or error. It's a methodological choice, not an empirical discovery.
      *   *Interpersonal Comparisons:* This comes from the Ordinalist Revolution (Pareto, Hicks, Allen) in the 1930s, *before* Samuelson's 1938 paper. Samuelson reinforced it, but the text implies RPT originated this prohibition.

