      *   *Sentence 5:* "...and that interpersonal comparisons of utility are meaningless."
          *   *Assessment:* This is the tricky part. Ordinalism (Pareto/Hicks) already killed interpersonal comparisons. RPT reinforced it, but crediting it *solely* to RPT ignores the 1930s ordinalist revolution.

  3.  **Address the User's Specific Concerns:**

