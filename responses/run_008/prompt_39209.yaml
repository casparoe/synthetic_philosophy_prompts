          *   *Assessment:* Mostly accurate regarding early marginalists (Jevons, Edgeworth, early Marshall), but ignores the ordinalist turn (Pareto, Hicks, Allen) that happened *before* Samuelson. This is a common simplification.
      *   *Sentence 2:* "Samuelson's revealed preference program replaced this with observable behavior: when a consumer chooses one bundle over another that was affordable, they are thereby revealed to prefer it."
          *   *Assessment:* Accurate description of the core intuition of RPT (1938).
      *   *Sentence 3:* "He then proved that a few consistency conditions on observed choices suffice to construct a utility function the consumer can be represented as maximizing."
          *   *Assessment:* Accurate reference to the Weak/Strong Axioms of Revealed Preference (WARP/SARP) and the integrability problem.
      *   *Sentence 4:* "Utility is therefore nothing but a bookkeeping device for recording choices, economics needs no psychology..."
          *   *Assessment:* This is the behaviorist interpretation. It's a *philosophical* stance (operationalism/behaviorism) adopted by Samuelson, not a mathematical necessity of the theory. This is where the "smuggling" happens.
      *   *Sentence 4 (cont.):* "...and it follows that preferences cannot be mistaken — whatever you choose is, by definition, what you prefer..."
