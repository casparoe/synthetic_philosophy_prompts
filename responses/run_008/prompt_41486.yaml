prompt: |-
  I teach an upper-level course on philosophy of religion and I'm writing the final. Give me one essay question on whether religion actually makes people better — but I want the crux to be a level-reversal puzzle, not the usual recitation of Durkheim. The setup: within most countries, more religious individuals tend to report more trust in strangers and more charitable behavior than their secular neighbors, but across countries the pattern seems to flip — the most secular societies (think Scandinavia) score highest on generalized trust and lowest on corruption, while highly religious countries often score worse on both. So the question has to force students to (a) say what "more moral" would even have to mean for the question to have an answer at all (individual behavior? societal trust? institutions?), (b) deal with the reversal head-on — does it show that religion isn't needed to sustain trust at scale, or is it just confounded, with development driving both secularization and trust so neither is causing the other, and (c) say what kind of evidence could actually settle it, given you can't run the counterfactual of secularizing a country overnight. It should be unanswerable by reciting "religion is the glue of society" or by new-atheist talking points about religious violence — either of those should cost marks. Students get about 45 minutes for it. Include a model answer of roughly 600 words and a marking scheme that can seperate an A from a B by naming the specific moves each requires.
reasoning: |-
  Here's a thinking process that leads to the suggested essay question, model answer, and marking scheme:

  1.  **Analyze the Request:**
      *   **Course Level:** Upper-level Philosophy of Religion.
      *   **Task:** Create one final exam essay question.
      *   **Topic:** Does religion make people better?
      *   **Specific Constraint:** The crux must be a "level-reversal puzzle" (Simpson's Paradox-style dynamic: positive correlation within groups, negative correlation across groups).
      *   **Key Components to Address:**
          *   (a) Define "more moral" (individual vs. societal vs. institutional).
          *   (b) Address the reversal (secular societies = high trust vs. religious societies = low trust). Is it causation or confounding (development)?
          *   (c) Propose evidence needed to settle it (counterfactuals, longitudinal studies, etc.).
      *   **Constraints on Student Answers:** Cannot rely on clichés ("religion is social glue" or "religion causes violence"). These should lose marks.
      *   **Time Limit:** ~45 minutes.
      *   **Deliverables:** Essay question, Model Answer (~600 words), Marking Scheme (distinguishing A from B).

  2.  **Drafting the Essay Question:**
      *   *Goal:* Make it precise enough to guide them toward the paradox but open enough for philosophical analysis.
      *   *Wording:* Needs to explicitly state the empirical puzzle (within-country vs. cross-country). Needs to demand the three specific components (definition, reversal analysis, evidence).
      *   *Drafting:* "Empirical data suggests a paradox: within nations, religious people are often more charitable/trusting than secular neighbors. Yet across nations, secular countries (e.g., Scandinavia) often show higher generalized trust and lower corruption than religious ones. Write an essay addressing whether religion makes people 'better.' You must: 1. Define the level of analysis for 'better.' 2. Explain the reversal (causation vs. confounding). 3. Propose evidence to resolve it. Avoid clichés about social glue or religious violence."
      *   *Refining:* Make it sound more academic. Use terms like "ecological fallacy" or "level of analysis." Ensure the prohibition on clichés is clear.

  3.  **Drafting the Model Answer:**
      *   *Length:* ~600 words.
      *   *Tone:* Philosophical, analytical, nuanced.
      *   *Structure:*
          *   Intro: State the paradox and the need for definitional clarity.
          *   Section 1 (Definition): Distinguish individual virtue from institutional trust.
          *   Section 2 (The Reversal): Address the confounding variable (security/development).
          *   Section 3 (Evidence): Discuss longitudinal/natural experiments.
          *   Conclusion: Summarize the conditional nature of the answer.
      *   *Content Check:* Does it avoid the banned clichés? Yes. Does it hit points (a), (b), (c)? Yes.
      *   *Drafting thought:* I need to make sure I don't just say "it's development." I need to explain *why* that matters philosophically (functional equivalence). I need to mention that religion might be a "starter motor" for trust that becomes obsolete.

  4.  **Drafting the Marking Scheme:**
      *   *Goal:* Distinguish A (Excellent) from B (Good) from C (Average).
      *   *Criteria:* Needs to map to the three required components + the prohibition on clichés.
      *   *Differentiation:*
          *   *A:* Nuanced definition of morality, sophisticated handling of confounding variables (existential security), specific methodological proposals for evidence.
          *   *B:* Correctly identifies the paradox, defines morality adequately, mentions confounding but less deeply, generic evidence suggestions.
          *   *C:* Misses the paradox, relies on clichés, vague definitions.
      *   *Specific Moves:* I need to list specific philosophical moves (e.g., "distinguishes descriptive from normative," "identifies existential security hypothesis").

  5.  **Review and Refine:**
      *   *Check Word Count:* The model answer needs to be tight. 600 words is not a lot for this much content. I need to be concise.
      *   *Check Tone:* Ensure the prompt sounds like a final exam for an upper-level class (challenging but fair).
      *   *Check Constraints:* Did I include the ban on Durkheim/New Atheism tropes? Yes.
      *   *Level-Reversal:* Ensure the prompt explicitly describes the within-country vs. across-country data so students don't have to recall specific stats, but rather analyze the *structure* of the data.

  6.  **Final Polish:** (Self-Correction during drafting)
      *   *Correction:* In the model answer, make sure not to take a definitive side (yes/no) but rather show *how* one would decide. The prompt asks "what kind of evidence could actually settle it," implying the answer might be currently unknowable.
      *   *Correction:* Ensure the marking scheme explicitly penalizes the "social glue" and "religious violence" arguments as requested.

  7.  **Final Output Generation** (Proceeding to generate response based on these steps).
answer: |-
  ### Essay Question

  **Time Allowed:** 45 Minutes
  **Word Limit:** Approx. 600–800 words

  **Prompt:**
  Social scientific data presents a "level-reversal" puzzle regarding religion and morality. *Within* most nations, religious individuals report higher levels of charitable giving and trust in strangers than their secular neighbors. However, *across* nations, the most secular societies (e.g., Scandinavia) often exhibit higher generalized trust and lower corruption than highly religious nations.

  Write an essay addressing the question: **Does religion make people better?**

  Your response must address the following three components:
  1.  **Level of Analysis:** Define what "better" must mean for this question to be answerable. Does it refer to individual virtue, interpersonal behavior, or institutional integrity?
  2.  **The Reversal:** Confront the data paradox directly. Does the cross-national trend suggest religion is functionally obsolete for trust at scale, or is the correlation confounded (e.g., by economic development or existential security)?
  3.  **Evidence:** Given that we cannot run a controlled experiment secularizing a country overnight, what specific kind of longitudinal or comparative evidence would be required to establish causality?

  *Note: Answers that rely on the cliché that "religion is the necessary glue of society" or the counter-cliché that "religion is the primary source of violence" will be penalized. You must engage with the structural paradox described above.*

  ***

  ### Model Answer

  The question of whether religion makes people "better" is unintelligible without first resolving the level of analysis. If "better" refers to individual pro-social psychology, the within-country data suggests a positive correlation; religious individuals often exhibit higher in-group charity. However, if "better" refers to the functionality of a society—measured by generalized trust and low corruption—the cross-national data suggests a negative correlation. Therefore, the question cannot be answered uniformly; religion may support individual virtue while being redundant or even detrimental to institutional integrity in developed contexts.

  To address the reversal, one must avoid the error of assuming the within-country mechanism applies at the national level. The "existential security" hypothesis offers a robust explanation for the confounding variable. In high-risk environments (often correlated with high religiosity), individuals rely on tight-knit religious networks for survival, boosting within-group trust but potentially lowering generalized trust. In secure, wealthy welfare states (often correlated with secularization), the state assumes the risk-mitigation role previously held by the church. Consequently, secular citizens in Scandinavia do not need religion to trust strangers; they trust the institutions that protect them. This suggests religion is not inherently moral or immoral, but rather a functional technology for social cohesion that becomes less necessary as secular safety nets expand. The reversal does not prove religion destroys trust, but that high trust allows for secularization, or that development drives both.

  Establishing causality requires moving beyond cross-sectional snapshots. Since we cannot secularize a nation by fiat, we must look for natural experiments. First, we should examine rapid transitions, such as post-Soviet states or post-conflict regions, tracking whether increases in secular governance correlate with increases in generalized trust over time, controlling for GDP. Second, we should look at migration data: do immigrants from high-religiosity/low-trust cultures acquire the high-trust norms of secular host countries within a generation? If they do, it suggests culture and institutions, not theology, drive the outcome. Finally, we need to distinguish between *religious belief* and *religious attendance*. If attendance predicts charity but belief does not, the mechanism is social accountability, not divine command.

  Ultimately, the evidence suggests a conditional answer. Religion may make individuals "better" in contexts where it is the primary provider of social safety and community accountability. However, at the societal level, it appears that the conditions which allow for high trust (security, rule of law) also allow for secularization. Religion does not necessarily make people better; rather, it often serves as a placeholder for the trust that secure institutions eventually render obsolete. To claim otherwise is to confuse the scaffold with the building.

  ***

  ### Marking Scheme

  **Total Marks: 100**

  #### **A Range (80–100): Distinction**
  *   **Definitional Precision:** Explicitly distinguishes between *individual virtue* (psychological/behavioral) and *societal functionality* (institutional trust). Recognizes that "better" is ambiguous without this distinction.
  *   **Handling the Reversal:** Identifies the **confounding variable** (e.g., existential security, economic development, rule of law). Explains *why* the correlation flips (e.g., religion as a functional substitute for state welfare). Avoids claiming simple causation in either direction.
  *   **Evidence Proposal:** Proposes specific, methodological sound approaches (e.g., longitudinal studies of transition states, migration assimilation data, distinguishing attendance vs. belief). Acknowledges the difficulty of counterfactuals.
  *   **Constraint Adherence:** Strictly avoids banned clichés ("social glue" / "source of violence").
  *   **Philosophical Move:** Recognizes the **Ecological Fallacy** (assuming group-level data applies to individuals or vice versa).

  #### **B Range (60–79): Credit**
  *   **Definitional Precision:** Defines "better" adequately (e.g., chooses trust or charity) but may not fully separate individual vs. institutional levels.
  *   **Handling the Reversal:** Acknowledges the paradox and suggests development/wealth is the cause, but explains the mechanism less clearly than an A (e.g., says "rich countries are secular" without explaining the security/trust link).
  *   **Evidence Proposal:** Suggests general comparative studies or historical analysis but lacks methodological specificity (e.g., "look at history" vs. "look at post-Soviet transitions").
  *   **Constraint Adherence:** Avoids banned clichés.
  *   **Philosophical Move:** Identifies the correlation/causation problem but may lean slightly too heavily on one side (either pro- or anti-religion) without the nuanced "functional equivalence" argument.

  #### **C Range (50–59): Pass**
  *   **Definitional Precision:** Vague definition of morality (e.g., "being nice").
  *   **Handling the Reversal:** Mentions the data but fails to explain *why* it flips. May assert one dataset is "more true" than the other without justification.
  *   **Evidence Proposal:** Vague (e.g., "we need more science").
  *   **Constraint Adherence:** May slip into banned clichés (e.g., "religion holds society together" without nuance).
  *   **Philosophical Move:** Treats the data as straightforward proof rather than a philosophical puzzle.

  #### **F Range (0–49): Fail**
  *   **Content:** Ignores the level-reversal puzzle entirely.
  *   **Constraints:** Relies exclusively on banned tropes (Durkheimian "glue" or New Atheist "violence").
  *   **Structure:** Fails to address all three required components (Definition, Reversal, Evidence).
