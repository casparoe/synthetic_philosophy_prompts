answer: |-
  My overall credence that your colleague is right (that there is a genuine, distinctive norm against moral deference on important matters) is **0.55**.

  Here is the decomposition of that assessment:

  *   **0.95** — Probability that beliefs formed through moral testimony can constitute knowledge in the first place.
      *   *Justification:* There is no metaphysical barrier preventing reliable moral assertions from transmitting justification like any other propositional fact.
  *   **0.85** — Probability that acting well on important moral matters requires moral understanding rather than merely true belief.
      *   *Justification:* Moral worth and virtue generally demand acting for the right reasons, which blind deference obscures even if the action is correct.
  *   **0.50** — Probability that moral judgment differs in kind from domains where deference is unproblematic, like mathematics, history, or weather forecasting.
      *   *Justification:* While moral motivation is unique, the epistemic structure of relying on experts (e.g., doctors, lawyers) suggests structural similarities that undermine strong distinctiveness.
  *   **0.75** — Probability that the "importance" of the matter functions as a defeater for permissible deference.
      *   *Justification:* High-stakes decisions demand personal endorsement of reasons to avoid alienation from one's own agency, whereas trivial matters allow for heuristic reliance.

  ### Least Confident Term
  I am least confident in the probability that **moral judgment differs in kind from non-moral domains (0.50)**.

  **What would move it:**
  A robust comparative case showing that deference in non-moral practical domains (e.g., a lawyer deferring to a senior partner on a case strategy, or a patient deferring to a doctor on treatment) is *equally* criticized as a failure of agency, or conversely, a case showing that deference on trivial moral matters (e.g., which charity dinner menu to pick) is universally accepted as unproblematic. If moral deference tracks general practical deference, the "distinctive" norm dissolves; if it persists only in morality, the disanalogy holds.

  ### Diagnosis of Disagreement
  You and your colleague most likely disagree about **what acting well requires**.

  Your colleague's pessimism rests on the claim that moral worth is compromised without understanding (a normative claim about action), whereas your skepticism ("not just a sensible admonition") suggests you view the requirement for understanding as a general heuristic for good reasoning rather than a strict condition for moral permissibility or worth. You likely agree that testimony *can* yield true belief (epistemology), but you diverge on whether acting on that belief without understanding is morally defective.
