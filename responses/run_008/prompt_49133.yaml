prompt: |-
  I run a blog that sits in the AI-safety-adjacent philosophy space — readers are people who've done the intro reading but nothing technical. Every few months someone relitigates "should AI systems reason as utilitarians or as deontologists" and it always stalls the same way: the utilitarian side says expected-value reasoning is just what alignment wants anyway, the deontologist side says rules and side-constraints are what stops the paperclip stuff, and both quietly slide between two different questions — what makes an action right versus what decision procedure the system should actually run. My pet theory is that the real crux is legibility: deontology buys you a system whose reasoning an overseer can audit step by step, utilitarianism buys you flexibility under novel circumstances, and almost nobody considers that the answer might be split — something like utilitarian at the level of what we want the system to be for, deontological in the machinery it runs, which I gather is roughly where the old two-level views ended up but transplanted from human psychology to AI oversight.

  Write an essay (~1500 words, conversational but rigorous) for the blog that takes a stance. Weigh the main arguments on both sides, but engage my legibility angle seriously — including where I'm wrong, or where it quietly collapses back into rule-consequentialism with extra steps. Consider the obvious objections: that an AI on a mixed system will reason about when to suspend its own rules, that deontology for a system with no rights or dignity of its own is just an engineering choice dressed up as ethics, that "auditability" is an empirical property of the implementation, not of the moral theory. Don't end agnostic — defend a verdict, even if the verdict is that my whole framing is confused. You can name positions and thinkers, but no citations or reading lists, my readers can google.

  After the essay, append a JSON object with these fields: "verdict" (one of "utilitarian", "deontological", "hybrid", "framing-is-confused"), "thesis" (one sentence stating your actual position), "strongest_argument_for" (a string), "strongest_objection_and_reply" (an object with fields "objection" and "reply"), "confidence" (number between 0 and 1), and "crux" (the single consideration that, if it came out the other way, would flip your verdict).
