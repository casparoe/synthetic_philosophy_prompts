prompt: |-
  I teach an intro philosophy elective at a community college, and in two weeks I have one 75-minute session to get students through Frankfurt-style cases and the principle of alternative possibilities. Quick context so you know where they're starting from: we've already done a week on hard determinism and compatibilism in the abstract, so they know the words, but they still basically equate "you couldn't have done otherwise" with "you weren't free" and treat that as the whole game. What I want to plan is the session's arc, not the content dumped on me: the order things need to go in, since I suspect the whole thing collapses if I introduce the wrong piece first.

  Here's the wrinkle I want to build the session around, instead of the standard counterfactual intervener examples. Last summer I read about prototypes of brain-computer interfaces that can decode intended movement a fraction of a second before it's consciously initiated, and I got to thinking about a fictional version: a company offers a "guardian implant" that predicts your choice milliseconds before you're aware of making it, and if it predicts you'll do the wrong thing, it nudges your neural activity so you decide the "right" way instead. Crucially, the nudging is painful and obvious, so the prediction data show that in practice it almost never fires — people who know it's there just decide correctly on their own, every time. The students get to ask: are those people responsible for doing the right thing? They couldn't have done otherwise in the sense that any deviation would have been blocked, yet the block never actually kicked in. I like this case because it's the students' own near-future world rather than old-school neuroscience hypotheticals, but I'm honestly not sure whether it's helping or whether it drags in distracting baggage about AI and surveillance that will eat the session.

  So: plan the explanation for me. Where does the guardian case fit in the sequence, and does anything need to be established before it (like a cleaner vanilla version of the case, or the distinction between actual-sequence and alternative-sequence explanations of responsibility)? Which misconceptions should I expect — I'm guessing at least "Frankfurt cases prove determinism is fine," "if the intervener exists then determinism is true," and something about how responsibility only attaches if the person was coerced — and where exactly in the sequence do I head each off? Also flag honestly whether the "it almost never fires" twist in my version is a strength or a complication I should strip out, since I can't tell whether it sharpens the point that the intervention never causally explains the action, or just muddies things with probabilities. And tell me one thing I should flatly refuse to cover in a first session, and how I'd check at the end whether they actually got the core move rather than just enjoying the sci-fi. No reading list, these are first-years.

  Once you've written the plan, wrap up with a short JSON object summarizing it, with these fields: "session_order" (array of the numbered steps in the order you'd present them), "carrying_case" (one sentence on what the guardian case must contain and what to strip from it), "misconceptions" (array of objects with "misconception", "where_it_comes_up", and "defusal_point"), "check_for_understanding" (the single question or exercise you'd use), and "omit" (the one thing you'd refuse to cover, with a one-clause reason). Keep the JSON tight — it's a cheat sheet, not a second explanation.
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **Context:** Intro philosophy elective at a community college. 75-minute session.
      *   **Topic:** Frankfurt-style cases and the Principle of Alternative Possibilities (PAP).
      *   **Student Background:** Know terms (hard determinism, compatibilism) but equate "couldn't have done otherwise" with "not free/responsible" (intuition pump for PAP).
      *   **Instructor's Idea:** Use a "Guardian Implant" case (BCI predicts choice, nudges if wrong, painful/obvious nudging means it rarely fires because people self-correct).
      *   **Goal:** Plan the session arc (order of operations), not content dump.
      *   **Specific Questions to Answer:**
          *   Where does the Guardian case fit?
          *   What needs to be established before it (vanilla version? actual/alternative sequence)?
          *   Which misconceptions to expect and where to head them off?
          *   Is the "almost never fires" twist a strength or complication?
          *   What to flatly refuse to cover?
          *   How to check understanding at the end?
          *   **Output Format:** Detailed plan followed by a specific JSON summary.

  2.  **Deconstruct the Philosophy:**
      *   **PAP (Principle of Alternative Possibilities):** A person is morally responsible for what they have done only if they could have done otherwise.
      *   **Frankfurt-style Cases:** Designed to show PAP is false. An agent decides on their own, but there was a mechanism ready to force them if they hadn't. Since the mechanism didn't intervene, the agent is responsible, even though they *could not* have done otherwise (because the mechanism would have ensured the outcome).
      *   **The Instructor's Case:** "Guardian Implant." Predicts choice -> nudges if wrong -> painful nudging -> people self-correct to avoid pain -> implant rarely fires.
      *   **Critique of the Instructor's Case:**
          *   *Standard Frankfurt Case:* Counterfactual intervener (Black) waits until the last moment. Jones decides on own. Black does nothing. Jones could not have done otherwise (because Black would have forced him). Jones is responsible. Therefore, PAP is false.
          *   *Instructor's Case:* The implant predicts *before* conscious initiation. If it predicts wrong, it nudges. Because nudging is painful, people choose right to avoid it.
          *   *Problem:* This sounds more like *threats/deterrence* than a Frankfurt case. In a standard Frankfurt case, the agent is unaware of the intervener. Here, "people who know it's there just decide correctly on their own." This introduces coercion/threat dynamics. If I do X to avoid pain Y, am I free? Compatibilists might say yes, but libertarians might say no (coercion).
          *   *The "Almost Never Fires" Twist:* This is crucial. In standard Frankfurt cases, the intervener *never* fires. Here, the instructor says "almost never fires." If it fires sometimes, those cases are clear coercion. If it *never* fires for a specific agent (because they self-correct), it resembles Frankfurt. But the *reason* they self-correct is the threat of the firing. This makes it a "Prior Sign" case which Frankfurt himself worried about (the sign indicates what you will do, but the sign might be caused by the mechanism).
          *   *Verdict on the Case:* It's risky. The "knowing it's there" element turns it into a coercion case rather than a pure "alternative possibilities" case. However, for intro students, it might be more engaging. The key is to isolate the specific moment where the agent acts *without* the implant firing.
          *   *Recommendation:* Use the Guardian case, but strip the "knowing it's there/avoiding pain" motivation for the specific instance being judged. Or, frame it such that the student evaluates a specific instance where the agent *forgot* or *didn't care* about the pain, yet still chose rightly, and the implant was present but inactive. Actually, better: Stick closer to the Frankfurt logic. The implant ensures the outcome. The agent chooses on their own. The fact that they *could not* have chosen otherwise is due to the implant's presence, not the pain threat.
          *   *Refinement:* The instructor asks if the "almost never fires" twist is a strength or complication. It's a complication. It introduces deterrence. A pure Frankfurt case requires the agent to act on their own reasons, unaware or unaffected by the counterfactual intervener. If they act to avoid the nudge, their reasoning is altered by the presence of the device.
          *   *Decision:* I need to advise the instructor to tweak the case to remove the "deterrence" aspect for the specific agent being evaluated, or else it becomes a case about coercion rather than PAP. However, since they love the case, I should show them how to deploy it *after* establishing the logical structure of PAP, so they can see where the case might leak. Actually, for a 75-minute intro, simplicity is key. I should advise simplifying the case to match the Frankfurt structure more closely (unaware of intervener, or intervener ensures outcome without affecting reasoning).
          *   *Wait, re-reading the prompt:* "people who know it's there just decide correctly on their own, every time." This implies the *presence* of the implant changes their decision-making process (they want to avoid pain). This violates the "actual sequence" independence required for a clean Frankfurt case. In a clean Frankfurt case, the actual sequence is identical to a normal free choice; only the alternative sequence is blocked. Here, the actual sequence is influenced by the threat.
          *   *Advice:* I must flag this. It's a complication. I should suggest stripping the "painful/known" aspect for the sake of the philosophical point, or framing it carefully. Let's advise stripping the "deterrence" motivation for the specific test case. The implant should be invisible or the agent unaware, OR the focus should be on a specific instance where the agent acted on their own reasons regardless of the threat.
          *   *Better Advice:* Use a vanilla Frankfurt case first to establish the logic, *then* use the Guardian case as an application/discussion point, but warn about the coercion element. Or, fix the Guardian case to be a true Frankfurt case (implant ensures outcome, agent acts on own reasons, agent unaware of implant).
          *   *Prompt Constraint:* "I like this case... honestly not sure whether it's helping... flag honestly whether the 'it almost never fires' twist... is a strength or a complication."
          *   *My Verdict:* It's a complication. It conflates coercion with lack of alternatives. I will advise simplifying it to remove the "avoiding pain" motivation for the specific agent under scrutiny.

  3.  **Session Arc Planning (75 mins):**
      *   **0-10: Warm-up/Recap.** Re-establish PAP. "Responsibility requires could-have-done-otherwise." Get them to commit to this.
      *   **10-25: The Vanilla Frankfurt Case.** Need a clean logical structure first. Black & Jones. Jones decides to kill. Black would have forced him if he hadn't. Jones kills. Black does nothing. Jones responsible? (Yes). Could Jones have done otherwise? (No). Therefore PAP is false.
      *   **25-45: The Guardian Case (Application).** Introduce the sci-fi version. Apply the logic. *Crucial:* Address the "deterrence" issue. If they act to avoid pain, is it free? Strip that away for the philosophical core. Focus on the "backup mechanism" aspect.
      *   **45-60: Misconceptions & Objections.** Determinism vs. Frankfurt. Coercion. The "Flicker of Freedom" strategy (briefly, don't get bogged down).
      *   **60-75: Synthesis & Check.** What does this mean for Compatibilism? Does it save it? (Not necessarily, just breaks PAP). Exit ticket.

  4.  **Misconceptions:**
      *   "Frankfurt cases prove determinism is true/compatible." (No, they just attack PAP. You can be a libertarian and reject Frankfurt cases).
      *   "If the intervener exists, determinism is true." (No, the intervener is a specific local constraint, not universal causation).
      *   "Responsibility only attaches if coerced." (Confusing coercion with lack of alternatives).
      *   "The device caused the action." (No, the device was idle).

  5.  **Refining the Guardian Case Advice:**
      *   The "almost never fires" because people "decide correctly on their own" to avoid pain is the problem. It makes the *actual sequence* dependent on the device's presence (threat).
      *   *Fix:* The device predicts and stands ready. The agent acts on their own reasons. The agent is *unaware* of the device, OR the device is known but the agent acts on independent reasons (not to avoid pain).
      *   *Recommendation:* Strip the "painful/obvious" deterrent aspect for the specific scenario discussed in class. Make it a "silent safeguard." Otherwise, students will argue about coercion, not PAP.

  6.  **What to Omit:**
      *   Don't get into the "Flicker of Freedom" defense or fine-grained vs. coarse-grained actions. Too technical for 75 mins.
      *   Don't try to solve Determinism vs. Compatibilism fully. This session is just about PAP.

  7.  **Check for Understanding:**
      *   Need a scenario where PAP is violated but responsibility holds, or vice versa.
      *   Question: "If PAP is false, does that mean we are never responsible?" (No).
      *   Better: A mini-case where they have to identify *why* the agent is responsible despite no alternatives.

  8.  **Drafting the Plan:**
      *   *Step 1: Lock in PAP.* Get them to state the intuition.
      *   *Step 2: The Logic of Frankfurt.* Use a simple analogy (voting machine with remote override).
      *   *Step 3: The Guardian Case.* Introduce it. *Modify it* (remove pain/deterrence for the target case).
      *   *Step 4: The Clash.* Why does this break their intuition?
      *   *Step 5: Misconception Sweep.*
      *   *Step 6: Exit Ticket.*

  9.  **Drafting the JSON:**
      *   Needs to be tight.
      *   Fields: session_order, carrying_case, misconceptions, check_for_understanding, omit.

  10. **Review against Constraints:**
      *   75 minutes.
      *   Community College Intro.
      *   No reading list.
      *   JSON at the end.
      *   Address the "strength vs complication" of the twist honestly.

  11. **Final Polish on the Guardian Case Advice:**
      *   I need to be firm. The "painful/obvious" deterrent makes it a coercion case. Coercion mitigates responsibility. Frankfurt cases need the agent to act on *their own* reasons without the intervener affecting the actual sequence.
      *   *Advice:* Keep the tech, lose the pain/threat. The implant ensures the outcome but remains causally inert in the actual sequence. If students fixate on the pain, the lesson fails.
      *   *Wait, one nuance:* The instructor says "people who know it's there just decide correctly on their own." If they decide on their own *because* they know it's there, that's coercion. If they decide on their own *and* the device is just there as a backup, that's Frankfurt. I will advise framing it as the latter for the philosophical exercise.

  12. **Structuring the Misconceptions:**
      *   1. Frankfurt = Determinism Proof.
      *   2. Presence of Device = Causation.
      *   3. No Alternatives = Coercion.

  13. **Structuring the Check:**
      *   A specific question that forces them to distinguish between "caused by device" and "could not have done otherwise due to device."

  14. **Final Review of JSON:**
      *   Ensure valid JSON syntax.
      *   Ensure all fields are present.

