  7.  **Final Polish:** Check for clarity on the "Overround." Ensure the distinction between *credence* and *price* is sharp. (This is the most important philosophical move to make here).

  *(Self-Correction on "Settled"):* Be careful. Even among experts, the normative force of DBA is debated. I must state that the *math* is settled, the *philosophical implication* is contested.

