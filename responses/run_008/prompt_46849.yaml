  2.  **Deconstruct the Four Moves:**
      *   **Move 1 (Historian):** Williams thesis applied broadly. Abolition/Dueling = economic/institutional shifts. Moral rhetoric is window dressing. Generalization: Moral revolutions are just interest shifts.
      *   **Move 2 (Philosopher):** Appiah's reply. Causal story is too fast. Neither pure argument nor pure interest suffices. Moral argument works when attached to honor/shame. Clarkson/Quakers mattered when slave-trading became shameful.
      *   **Move 3 (Historian):** Reductionism. Honor = status interest. If practices confer standing, it's still interest. Appiah collapses into Williams.
      *   **Move 4 (Philosopher):** Phenomenology/Causal Structure. Honor is non-instrumental. Agents override prudential interest (death in duels, costs in abolition). Motive overriding interest isn't interest in disguise.

