answer: |-
  ### Exam Question

  **Module:** PHI304 Epistemic & Philosophical Logic  
  **Section:** B (Essay)  
  **Time Allowed:** 90 Minutes  
  **Instructions:** Answer **one** question.

  **Question 1**

  Fitch's Paradox suggests that if all truths are knowable, then all truths are known. During seminars, two hypothetical strategies were proposed to escape this conclusion without abandoning anti-realism entirely. Evaluate whether either proposal successfully blocks the paradox. In your answer, you must identify the specific logical properties of the operators involved that drive the derivation.

  *   **Proposal A (The Verifiability Swap):** Replace the knowledge operator ($K$) with a verifiability operator ($V$), where $Vp$ means "there exists a finite check that settles $p$." The proponent claims $V$ is factive ($Vp \to p$) and distributes over conjunction ($V(p \land q) \to Vp \land Vq$). They suspect the paradox returns but seek a verdict.
  *   **Proposal B (The Cognitive Restriction):** Retain the Knowability Principle ($p \to \Diamond Kp$) but interpret the possibility operator ($\Diamond$) as *epistemic possibility for beings with human cognitive limits*, rather than metaphysical possibility.

  Assess the viability of both proposals. Does Proposal A succumb to the same formal derivation as knowledge? Does Proposal B undermine the motivation for the Knowability Principle? Justify your verdicts by referencing the structural requirements of the proof (e.g., factivity, distribution, classical negation).

  ***

  ### Model Answer

  Fitch's paradox turns on the inconsistency of the statement $p \land \neg Kp$ being known. The derivation relies on three structural pillars: the factivity of knowledge ($Kp \to p$), the distribution of knowledge over conjunction ($K(p \land q) \to Kp \land Kq$), and classical logic governing the modal operator. To evaluate the proposals, we must test whether they preserve these pillars.

  Regarding **Proposal A**, the student's suspicion is correct: if verifiability ($V$) shares the stated logical properties of knowledge, the paradox returns *mutatis mutandis*. The Fitch derivation does not depend on the semantic content of "knowledge" (e.g., justification or belief) but on the operator's algebraic behavior. If we assume the Verifiability Principle ($p \to \Diamond Vp$) and substitute $V$ for $K$ in the proof, the contradiction arises at the step where one attempts to verify the conjunction $p \land \neg Vp$. If $V$ distributes, verifying the conjunction requires verifying $\neg Vp$. If $V$ is factive, verifying $\neg Vp$ implies $\neg Vp$ is true. However, the act of verifying it implies $Vp$. This yields $Vp \land \neg Vp$.

  Therefore, Proposal A offers no escape unless the proponent denies the premises they initially granted. To save the principle, one must argue that verifiability does *not* distribute over conjunction (perhaps verifying a whole does not guarantee verifying specific parts independently) or is not strictly factive (allowing for verification errors). Merely relabeling $K$ as $V$ without altering the logical axioms preserves the paradox. The structural load-bearing beam here is distribution; without it, the contradiction cannot be isolated to a single conjunct.

  Regarding **Proposal B**, restricting $\Diamond$ to human cognitive limits attacks the scope of the Knowability Principle (KP). The paradox derives $\neg \Diamond K(p \land \neg Kp)$, concluding that it is impossible for there to be an unknown truth. If $\Diamond$ is restricted to "possible for humans," the conclusion weakens to "it is not possible *for humans* to know..." However, this creates a dilemma for the anti-realist. If KP is maintained as a universal claim ($\forall p (p \to \Diamond Kp)$), it becomes empirically false, as there are likely truths beyond human cognitive capacity (e.g., complex cosmological facts). If KP is restricted to only apply to truths within human reach ($\forall p ((p \land \text{Accessible}) \to \Diamond Kp)$), the principle becomes trivial. It effectively says "all truths we can know are knowable," which loses the anti-realist bite that truth is *constituted* by knowability.

  Furthermore, the Fitch proof utilizes classical negation and the interaction between $\Diamond$ and $K$. Restricting $\Diamond$ does not block the derivation itself; it merely restricts the domain of $p$ to which the principle applies. This avoids the absurd conclusion that *all* truths are known, but only by conceding that some truths are not knowable, which abandons the strong verificationism that motivated KP in the first place.

  In conclusion, Proposal A fails because it retains the axiomatic structure that generates the contradiction. Proposal B avoids the contradiction only by weakening the Knowability Principle to the point of triviality or falsity. Neither offers a genuine escape that preserves both the logical structure and the philosophical motivation of anti-realism.

  ***

  ### Marking Scheme

  **Total:** 20 Marks (5 Points × 4 Marks)

  | Point | Requirement | Common Pitfall |
  | :--- | :--- | :--- |
  | **1. Structural Identification** | Identifies that the proof relies on operator axioms (factivity/distribution) rather than semantic content of "knowledge." | Student re-derives the whole proof without isolating the specific axioms used. |
  | **2. Proposal A Analysis** | Correctly notes that if $V$ distributes and is factive, the Fitch derivation applies identically to $V$. | Student argues $V$ is "different" without checking if it satisfies the required axioms. |
  | **3. Proposal A Verdict** | Concludes Proposal A fails unless distribution or factivity is denied for verifiability. | Student claims Proposal A works simply because "verification is weaker than knowledge." |
  | **4. Proposal B Analysis** | Explains that restricting $\Diamond$ forces a choice between KP being false (some truths beyond us) or trivial (KP only covers accessible truths). | Student confuses epistemic and metaphysical modality without discussing the impact on KP's universal quantifier. |
  | **5. Proposal B Verdict** | Concludes Proposal B saves the logic but sacrifices the anti-realist motivation (truth constituted by knowability). | Student claims Proposal B solves the paradox without noting the cost to the principle's philosophical scope. |

  **Distinguishing A from B:**
  A **First-Class (A)** answer explicitly links the failure of Proposal A to the distribution axiom and the failure of Proposal B to the universal quantification of KP, showing *why* the structural changes matter. A **2:1 (B)** answer correctly identifies that both proposals struggle but relies on intuitive claims about "human limits" or "verification" without rigorously tying them back to the logical axioms (factivity/distribution) that drive the proof.
