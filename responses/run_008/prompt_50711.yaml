answer: |-
  Here is an adjudication of the exchange, move by move, followed by an analysis of the underlying philosophical disagreement and a proposed definition.

  ### Move-by-Move Adjudication

  **(1) Dan's Opening**
  *   **Who is right:** Dan is right that the Maya people and culture did not vanish, and that the "organism" metaphor (societies are born, live, and die) is scientifically dubious. He is also right that political power shifted north rather than disappearing entirely.
  *   **Who is mistaken:** Dan is mistaken in treating "Maya civilisation" as a monolith. Archaeologists using the term "Classic Maya collapse" are rarely referring to the ethno-linguistic group, but specifically to the socio-political system of the southern lowlands during the Terminal Classic. By conflating the *people* with the *polity*, he creates a strawman.
  *   **What is missing:** He misses that 'collapse' in archaeology is a technical term regarding complexity, not a synonym for 'extinction'.

  **(2) Emma's Reply**
  *   **Who is right:** Emma is right that Dan's standard renders the word 'collapse' useless (if continuity anywhere negates collapse, Rome didn't collapse either). She correctly identifies the core archaeological signature: the rapid failure of coordinating institutions (water management, record-keeping, trade) and the scale of depopulation.
  *   **Who is mistaken:** She risks overstating the benefit of those institutions to the commoner without qualification, though she hints at it.
  *   **What is missing:** She needs to acknowledge that 'collapse' does carry a negative normative weight in popular discourse, which fuels Dan's resistance, even if the technical definition is neutral.

  **(3) Dan's Counter**
  *   **Who is right:** Dan is right to highlight that 'collapse' is often a value judgment from the perspective of the elite (whose monuments stopped). It is a valid historiographical critique that the end of a state might relieve pressure on subjects.
  *   **Who is mistaken:** He is empirically wrong to claim "we have no way of knowing" if commoner life worsened. Bioarchaeology (isotopic analysis, trauma markers, stature, dental health) provides significant data on peasant welfare during this period.
  *   **What is missing:** He ignores that the "coordinating institutions" Emma mentioned (specifically water management in cities like Tikal) were often essential for the survival of the dense population, not just for elite prestige.

  **(4) Emma's Rebuttal**
  *   **Who is right:** She is right that demographic collapse (mass death or flight) is a hard fact that cannot be dismissed as mere "political reorganisation." This is the strongest empirical evidence for the term 'collapse'.
  *   **Who is mistaken:** She slips into ad hominem reasoning by attributing Dan's argument to a "fashionable distaste for doom narratives." While possibly true, it attacks his motive rather than his logic.
  *   **What is missing:** She could concede that 'collapse' is often used too broadly in pop science, validating Dan's concern without surrendering her point.

  **(5) The Closing Exchange**
  *   **Dan:** Mistaken. He claims that if they agreed on the facts, they would agree on the word. This assumes language is a transparent window onto reality, ignoring that historical categories are interpretive frameworks.
  *   **Emma:** Right. She correctly identifies that 'collapse' is a choice of comparison class (e.g., comparing Tikal AD 900 to Tikal AD 700, rather than Tikal AD 900 to modern Maya villages). This is a conceptual judgment, not an excavated fact.

  ### The Core Disagreement: Facts vs. Concepts

  Dan's closing claim in (5) is that the dispute is shallow and would vanish if they simply agreed on the data. Emma's answer is that the dispute is deep because the data must be categorized, and categorization is a judgment.

  **Emma is right.** Further facts alone cannot settle this disagreement. You could present Dan with exact population figures, precise dates of monument cessation, and detailed isotopic data on peasant health, and he could still argue: "Yes, but since Maya speakers survived in the north, 'transformation' is the better narrative."

  The disagreement is not about *what happened* (the facts), but about *what counts as the relevant unit of analysis* (the concept). Dan chooses the ethno-linguistic group as the unit (which persisted); Emma chooses the socio-political system of the southern lowlands (which failed). No amount of excavation can tell you which unit is the "correct" one to name; that is a philosophical and historiographical choice. Dan is attempting to solve a conceptual problem with empirical tools.

  ### Sketching a Definition of 'Societal Collapse'

  For disagreements of this kind to dissolve, the definition of 'societal collapse' must be precise, multi-dimensional, and morally neutral. It should not rely on organism metaphors or imply total extinction. A robust definition would look like this:

  > **Societal Collapse:** A rapid, significant reduction in socio-political complexity and population density within a defined geographic region, characterized by the loss of centralised authority, the cessation of monumental construction, and the breakdown of long-distance exchange networks, *without* implying the extinction of the underlying population or culture.

  Using this definition:
  1.  **Dan's objection is met:** It explicitly allows for cultural continuity and population survival elsewhere.
  2.  **Emma's point is secured:** It requires the loss of complexity and density (the "hard facts").
  3.  **Dan's ethical concern is addressed:** It describes a structural change, not necessarily a moral "bad" for every individual, though it acknowledges the breakdown of systems.

  If both parties agreed to this definition, they would see they are arguing about emphasis, not reality. Dan prefers to emphasize the *continuity* of the culture; Emma prefers to emphasize the *discontinuity* of the system. Both are true, but 'collapse' specifically labels the discontinuity.

  Verdict: Dan's claim in (5) that facts settle definitions
