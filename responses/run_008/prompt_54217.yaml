answer: |-
  What draws the line that draws the hand that draws
  The pencil tip is drawn by what it makes
  In ink that binds the wrist the shadow takes
  Upon the white without a single pause
  Each stroke depends upon the other's laws
  So neither hand the other's form forsakes
  Yet both emerge from what the other creates
  Until the system closes without flaws
  Yet step outside the logic of the plane
  To where the shadow ends and passes out
  There rests the truth no pencil can see
  Beneath the fingers trying to explain
  Until the hierarchy resolves to doubt
  And leaves the paper simply there to be.

  ***

  **Note on Form and Interpretation**

  This poem takes a definitive stance on the "inviolate level," treating it as a stable ontological ground (the paper) rather than leaving it open to the recursive doubt Hofstadter sometimes suggests applies to the self. In *GEB*, the question of whether *we* have an inviolate level or are merely tangled loops remains provocatively unresolved; by granting the paper a final, end-stopped existence, the poem privileges the artistic metaphor over the psychological uncertainty. The structural correspondence relies entirely on the decision that a change in rhyme sound can audibly enact a change in logical level. If the shift from the octave's interlocking rhymes to the sestet's distinct scheme is heard merely as a conventional volta rather than a categorical boundary, the formal mapping collapses. The poem stands or falls on the claim that form can successfully mimic the phenomenology of stepping outside a system.
