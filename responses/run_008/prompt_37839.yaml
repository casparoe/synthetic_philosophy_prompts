prompt: |-
  I'm the organizer of a small, funded working group on moral change — two philosophers, one historian, one political scientist, roughly three years. We want to understand how practices like dueling, Chinese foot-binding, and Atlantic slavery went from being defensible within their societies' own moral vocabularies to being seen as intolerable, and we're working from the premise (familiar from Kwame Anthony Appiah's account of moral revolutions) that mere argument rarely suffices: the wrongness of dueling and slavery had been argued for centuries before anything changed, and what seems to have shifted was a society's honor structure — what counted as a marker of standing flipped into a marker of shame, with material interest following status rather than leading it. We'd like your help setting the research agenda.

  Which open questions in this area should our group prioritize, and in what order? Please defend the ordering rather than just surveying it. Among the candidates we've been arguing about internally: (1) the selection problem — every famous case is a success, so the mechanism we extract may be an artifact of retrospective storytelling; how do we construct a comparison class of practices that were loudly condemned and did not die, and can that even be done without smuggling in hindsight? (2) the construct validity worry — that "honor" does no real explanatory work, since any change in status can be redescribed as interest, so how would we tell an honor-driven revolution from an ordinary prestige scramble or a shift in factor prices? (3) the mechanism's generality and predictive use — whether anything in the account lets us say which currently contested practices (industrial animal farming, carceral punishment, the assignment of citizenship by birth) are near a tipping point, or whether it is only ever retrospective; and (4) whether argument is ever causally load-bearing, given the standard story that dueling died not because it was condemned as wrong but because it became ridiculous. For each question you rank highly, tell us what makes it upstream of the others, whether it's tractable for a four-person team with no experiments and a small number of historical cases, and what evidence we could realistically produce in three years that would move it up or down your list. We'd also like to know which of these you'd deliberately deprioritize, and why — including if you think the whole honor framing is a dead end and something else should replace question (2) at the top.
reasoning: |-
  Here's a thinking process that leads to the suggested research agenda:

  1.  **Analyze the User and Request:**
      *   **User:** Organizer of a small, funded working group (2 philosophers, 1 historian, 1 political scientist).
      *   **Topic:** Moral change (specifically moral revolutions where practices shift from defensible to intolerable).
      *   **Theoretical Framework:** Heavily influenced by Kwame Anthony Appiah (*The Honor Code*). Key premise: Argument alone rarely suffices; shifts in honor/status structures drive change, with material interest following status.
      *   **Task:** Set a research agenda (prioritize open questions, defend ordering, assess tractability/evidence for a 3-year timeline).
      *   **Candidate Questions:**
          1.  Selection Problem (Success bias).
          2.  Construct Validity (Honor vs. Interest).
          3.  Generality/Predictive Use (Tipping points).
          4.  Role of Argument (Causal load-bearing).
      *   **Constraints:** 4 people, no experiments, small number of historical cases, 3 years.
      *   **Requirements:** Defend ordering (upstream/downstream), assess tractability, suggest realistic evidence, identify deprioritized questions (and potentially challenge the honor framing).

  2.  **Evaluate the Candidate Questions:**

      *   *(1) Selection Problem:* Crucial methodologically. If we only study successes, we can't know necessary vs. sufficient conditions. But historically difficult (finding "failed" moral revolutions).
      *   *(2) Construct Validity (Honor vs. Interest):* Theoretical core. If "honor" is just a redescription of "interest," the theory collapses. Needs operationalization.
      *   *(3) Generality/Predictive:* High stakes, but likely downstream. You can't predict if you don't understand the mechanism. Might be too ambitious for 3 years.
      *   *(4) Role of Argument:* Nuanced. Appiah says argument isn't *enough*, not that it's *nothing*. Needs careful disentanglement from honor shifts.

  3.  **Determine Priorities (The "Upstream/Downstream" Logic):**

      *   *Priority 1: Construct Validity (Question 2).* This is the foundation. If "honor" is epiphenomenal to material interest, the whole project is mis-specified. You cannot study selection or prediction if you can't define the mechanism.
      *   *Priority 2: Selection Problem (Question 1).* Once you define the mechanism, you need to test it against negative cases. If you only look at slavery/dueling, you confirm your bias. You need "near misses" or "stalled revolutions."
      *   *Priority 3: Role of Argument (Question 4).* This refines the mechanism. How does argument interact with honor? Is it a trigger? A lubricant? This depends on having a valid construct and a comparison class.
      *   *Priority 4: Generativity/Prediction (Question 3).* This is the payoff. It's downstream. Don't try to predict the future until you've explained the past robustly.

  4.  **Critique and Refine the "Honor" Framing (Addressing the "Dead End" prompt):**
      *   Is "Honor" a dead end? Not necessarily, but it's vague. Appiah uses it broadly (social esteem). Political scientists might prefer "social norms" or "status markets." Historians might worry about anachronism.
      *   *Recommendation:* Don't abandon it, but operationalize it rigorously. Treat it as *social status signaling* rather than archaic "honor."
      *   *Deprioritize:* Question 3 (Prediction) is the clear candidate for deprioritization. It's too risky for a 3-year humanities/social science grant.

  5.  **Drafting the Agenda - Section by Section:**

      *   **Introduction:** Acknowledge the team composition and the Appiah framework. Validate the premise.
      *   **Top Priority: Construct Validity (Q2).**
          *   *Why Upstream:* If honor = interest, game over.
          *   *Tractability:* Hard but doable with process tracing.
          *   *Evidence:* Look for moments where actors acted *against* material interest for status.
      *   **Second Priority: Selection Problem (Q1).**
          *   *Why Second:* Need valid cases to test the valid construct.
          *   *Tractability:* Historian on team is key here. Find "zombie practices" (condemned but survived).
          *   *Evidence:* Comparative case studies (e.g., slavery vs. sweatshops in 19th C?).
      *   **Third Priority: Role of Argument (Q4).**
          *   *Why Third:* Depends on knowing *what* changed (honor) and *which cases* count.
          *   *Tractability:* Philosophers can analyze texts for shifts in tone (ridicule vs. reason).
          *   *Evidence:* Discourse analysis showing argument becoming effective *only after* status shift begins.
      *   **Deprioritized: Prediction (Q3).**
          *   *Why:* Premature. Risk of looking foolish. Better to produce a diagnostic toolkit than a crystal ball.
      *   **Reframing Question 2:** Suggest moving from "Honor" to "Social Ontology/Status Markets" to make it more社会科学-friendly.

  6.  **Refining the Argument for Ordering:**
      *   Make sure to explicitly state *why* Q2 is before Q1. (You can't select cases if you don't know what variable you are tracking).
      *   Make sure to explicitly state *why* Q1 is before Q4. (You can't weigh the causal role of argument if you haven't controlled for selection bias).
      *   Make sure to explicitly state *why* Q3 is last. (Prediction requires a validated model).

  7.  **Addressing Team Composition:**
      *   Philosopher 1 & 2: Conceptual analysis (Q2, Q4).
      *   Historian: Case selection, archival work (Q1, Q2).
      *   PolSci: Mechanism testing, operationalization (Q2, Q3).
      *   *Note:* Ensure the plan utilizes all four.

  8.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I answer the specific prompt about "evidence we could realistically produce"?
      *   *Adjustment:* Be specific. E.g., "A dataset of 5 failed moral campaigns," "A coding scheme for 'honor-talk' vs 'interest-talk' in parliamentary records."
      *   *Check:* Did I address the "honor framing is a dead end" possibility?
      *   *Adjustment:* Add a section challenging the terminology while keeping the insight. Suggest "Status Anxiety" or "Reputational Economics."

  9.  **Final Polish:** Tone should be academic, strategic, and respectful of the funding constraints. (Proceed to generate output based on this structure).

  *(Self-Correction during final review)*: Wait, I need to be careful about the ordering of Q1 and Q2.
  *Argument for Q2 first:* You need to know what you are looking for before you look for it. If "honor" is nonsense, selecting cases based on honor shifts is garbage in, garbage out.
  *Argument for Q1 first:* You need cases to test the theory.
  *Decision:* Q2 is logically upstream. You must define the variable before you select cases to measure the variable. However, they are iterative. I will place Q2 first but note the interdependence.

  *Wait, let's look at Q4 (Argument).* Is it upstream? If argument *causes* the honor shift, it's part of the mechanism. If it's independent, it's a rival cause. It's best treated as a sub-component of the mechanism testing (Q2). So Q2 encompasses Q4 in a way. But the prompt treats them separately. I will keep Q4 third, as a refinement of the mechanism found in Q2.

  *Let's look at Q3 (Prediction).* Definitely last.

  *Let's look at the "Dead End" prompt.* I should seriously consider if "Honor" is the right variable. Appiah's "Honor" is essentially "Social Esteem." In political science, this is "Status." In sociology, "Prestige." The team should refine the terminology to avoid the baggage of "Honor" (which implies aristocracy) when studying things like factory farming. I will recommend refining Q2 rather than dropping it.

  *Final Plan:*
  1. Priority 1: Construct Validity (Q2).
  2. Priority 2: Selection Problem (Q1).
  3. Priority 3: Role of Argument (Q4).
  4. Deprioritize: Prediction (Q3).
  5. Strategic Reframing: "Honor" -> "Status/Reputation."

