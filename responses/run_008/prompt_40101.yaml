      *   *Permissibility:* Forecasters generally acknowledge engineering bottlenecks. Moving the date based on hardware deployment is a boundary condition adjustment, not a mechanism change.
      *   *Verdict:* **Legitimate.** This fits the "Right about Pressure, Early about Snap" model perfectly.

