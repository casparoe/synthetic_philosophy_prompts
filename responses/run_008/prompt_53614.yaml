answer: |-
  Start your class not with definitions or semantics but with a specific scenario designed to break the equivalence between the two moods immediately. You need a minimal pair where the antecedent is false in reality, yet the indicative conditional strikes the students as true while the counterfactual strikes them as false, or vice versa. The Oswald example works because it separates evidence from causality, but since you want to avoid it, use a medical or attendance scenario which is equally structural but more relatable. Tell them to imagine they stayed home from work today because they had the flu. Establish as fact that they are at home and they are sick. Now present the pair. The indicative is If I am at work today, I am not sick. The counterfactual is If I had been at work today, I would not have been sick. Ask for truth values. Most will say the indicative is true because given the evidence that sick people stay home, finding out they are at work rules out them being sick. Most will say the counterfactual is false because going to work does not cure the flu. This divergence is your wedge. Do not explain why yet. Just let the contradiction sit. If you start with possible worlds here, you will lose them because they do not yet feel the need for a new semantic tool. You must make the material conditional fail first.

  This is where you trigger the first misconception. A student will inevitably argue that since they are not at work, the antecedent is false, so logically both conditionals must be true. This is the material conditional reflex. Do not shut this down immediately with a rule. Let them commit to it. Then point out that if both are true, their intuition about the counterfactual being false is ignored by the logic they learned last year. This is the moment to head it off. Tell them that the material conditional is a truth function based on actual values, but the counterfactual is not asking about actual values. It is asking about a dependency. The indicative is about updating information given what we know now. The counterfactual is about changing the world and seeing what follows. You defuse the material conditional error here by showing it cannot capture the distinction they just felt in their guts. If you do this too early, before they feel the divergence, it is abstract. If you do it too late, after you have introduced worlds, they will try to map worlds onto truth tables and get confused. So it must happen right after the intuition pump but before the semantics.

  Next, address the second misconception that the difference is merely grammatical tense. Students will say the counterfactual is just the past tense version of the indicative. Show them this is wrong by varying the tense while keeping the mood. You can say If I am at work, I am not sick versus If I were at work, I would not be sick. The tense changes but the mood is the real driver. Or use a future example. If I go to the party, I will be happy versus If I were to go to the party, I would be happy. The difference remains even without past tense. This misconception usually surfaces when you try to formalize the difference. Head it off by emphasizing that the subjunctive mood marks a metaphysical shift, not a temporal one. The counterfactual asks us to hold fixed the laws of nature and causal powers, while the indicative asks us to hold fixed our evidence. You need to make this distinction clear before you introduce possible worlds, otherwise they will treat possible worlds as just alternative histories in time rather than alternative states of affairs based on similarity.

  Now you are ready for possible worlds, but keep it minimal. Do not draw the accessibility relation diagrams yet. Use the worlds gloss to explain why the counterfactual was false in your opening example. Explain that for the counterfactual If I had been at work, I would not have been sick, we look for the closest possible world where the antecedent is true. The closest world is one where you went to work but still had the flu, because having the flu caused you to stay home, not vice versa. In that closest world, the consequent is false. For the indicative, we do not look for a new world. We look at the actual world and update our information. If we learn you are at work, we must conclude you are not sick, because in the actual world sick people stay home. The possible worlds semantics earns its keep here because it models the idea of holding things fixed. The counterfactual holds the causal past fixed. The indicative holds the evidence fixed. If you introduce this before the minimal pair, it is dry theory. If you introduce it after the misconceptions are cleared, it is the solution to a puzzle they already care about.

  For the last ten minutes, you want to cover backtracking counterfactuals. This is a risky move but can be a strong closer if framed correctly. The danger is that it undermines the similarity metric you just taught. If you tell them the closest world is the one where the past changes to accommodate the antecedent, they might think the rules are arbitrary. However, it is a good closing move if you present it as a refinement of similarity rather than a contradiction. Use the match example. If the match had lit, it would have been soaked in gasoline. This is false in standard evaluation because lighting the match does not change its past dryness. But in a backtracking context, if we assume the match lit, we might infer it was soaked. Tell them this shows that context determines which facts we hold fixed. In standard counterfactuals, we hold the past fixed. In backtracking, we allow the past to change to make the antecedent reasonable. This demonstrates that the possible worlds model is flexible and depends on context, which is a sophisticated note to end on. It will not wreck the lesson if you emphasize that standard evaluation is the default and backtracking is a special conversational context. It shows them that logic is not just about rigid rules but about how we interpret similarity.

  Finally, for the exit ticket, do not ask them to define the difference. Give them a case that requires applying the distinction. Describe a scenario where a fire alarm went off. It turned out a sensor triggered both the alarm and a sprinkler system independently, but pulling the manual lever does not actually trigger the alarm due to a wiring fault. However, in this specific instance, someone pulled the lever and the alarm went off because of the sensor. Ask them to evaluate two sentences. First, If the lever was pulled, the alarm sounded. Second, If the lever had been pulled, the alarm would have sounded. The first is true evidentially because both happened. The second is false causally because the lever does not cause the alarm. This forces them to choose between evidential support and causal dependency. If they mark both true, they missed the lesson. If they mark the second false, they understand that counterfactuals track causal connections rather than just material correlation. This case avoids presidential assassinations and relies on mechanical causality which is cleaner for logic students. It tests whether they can separate the epistemic reading from the metaphysical reading without needing to draw worlds themselves.

  One final note on the flow. Keep the transitions smooth. Do not announce the sections. Move from the example to the error to the theory to the exception. If you stop to summarize too much, they will tune out. Let the tension between the indicative and counterfactual drive the lecture. The goal is not to make them masters of possible worlds semantics in fifty minutes but to make them distrust the material conditional as a complete model of if. If they leave knowing that If A then B is not the same as If A had been then B would have been, you have succeeded. The possible worlds talk is just the vocabulary to explain that intuition. Do not let the vocabulary overshadow the intuition. If you see them staring at the board during the worlds explanation, return to the flu example. Anchor every abstract claim to that specific case until it sticks. The backtracking discussion should feel like a plot twist, not a new chapter. And the exit ticket should feel like the final test of their new intuition, not a memory quiz.
