          *   Target: The intelligibility of *relational judgment* and *pluralistic ontology*.
          *   Benign Regress Reply: Russell/Armstrong say "So what?" Bradley says "If the link is never secured, the fact never obtains." For Bradley, truth requires a complete, non-contradictory ground. Infinite deferral isn't a ground.
      *   **Part 4: Bradley's Positive View (The Absolute):**
          *   Monism.
