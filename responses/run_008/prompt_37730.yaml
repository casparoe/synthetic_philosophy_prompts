      *   *The "Circle" Argument:*
          *   Standard view: The world consists of qualities (terms) standing in relations.
          *   Bradley's critique:
              1.  If qualities exist *apart* from relations, they are unrelated isolates. But if they are unrelated, how can they enter into relations? A quality defined without relation has no hook to grab a relation.
              2.  If qualities exist *only within* relations, then the quality is defined by the relation. But the relation is defined by the terms it relates.
              3.  Result: You can't start with one without the other. They define each other mutually.
          *   *Why Vicious?* It's not like left/right (conceptual correlation). It's an ontological dependency. To *be* real, a quality needs a relation to distinguish it, but the relation needs real qualities to relate. If neither can exist without the other already existing, neither can get off the ground. It's a "chicken and egg" problem regarding *existence*, not just definition.
      *   *The "Regress" Argument:*
          *   Suppose we have $aRb$ (a is related to b by R).
          *   How does $R$ connect to $a$? There must be a relation $R_1$ between $a$ and $R$.
          *   How does $R_1$ connect to $a$? There must be $R_2$... ad infinitum.
          *   *Connection to Circle:* The circle shows the *concept* is contradictory. The regress shows the *mechanism* of connection fails. They are distinct but complementary attacks on the coherence of external relations.
      *   *The Target:* Bradley is attacking *pluralism* and *relational realism*. He thinks reality must be non-contradictory. Since relations lead to contradiction, relations are not real.
      *   *Benign Regress:* Defenders of relations (like Russell later) argue the regress doesn't stop truth from obtaining. Bradley would say it stops *intelligibility*. If you can't explain *how* the connection works without infinite steps, you haven't explained it at all.
