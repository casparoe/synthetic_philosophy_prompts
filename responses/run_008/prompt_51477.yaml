      *   *Is the metric "completely worthless"?* Not necessarily. It becomes *less* reliable as a proxy, but not always useless. It depends on the strength of the pressure and the ability to game.
      *   *Is the solution secrecy?* Generally, no. Management theory suggests transparency, multiple metrics, and qualitative assessment. Secrecy creates mistrust and doesn't solve the underlying incentive misalignment.

