answer: |-
  Your skepticism is well-founded. Your colleague got the **spirit** of Goodhart's Law right (metrics change behavior), but the **technical details, origin, and proposed solution** are significantly off.

  Here is a breakdown of what is accurate, what is myth, and why the "secrecy" solution is generally considered a bad idea in management theory.

  ### 1. Is it a "Theorem"?
  **Verdict: No.**
  Goodhart's Law is not a mathematical theorem. It cannot be proven via derivation or logic alone. It is an **empirical observation** or an **adage** based on economic history.
  *   **Why it matters:** Calling it a theorem implies it is universally and inevitably true in all cases like gravity or math. In reality, it is a heuristic—a rule of thumb that warns of risk, not a guarantee of failure.

  ### 2. The Original Claim vs. The Popular Version
  **Verdict: Your colleague described the popular version, not the original.**

  *   **The Original (1975):** Charles Goodhart was a member of the Bank of England. His original paper was about **monetary policy**, not employee performance. His exact phrasing was: *"Any observed statistical regularity will tend to collapse once pressure is placed upon it for control purposes."*
      *   **Meaning:** When the government tried to control inflation by targeting specific money supply metrics, the relationship between that metric and inflation broke down because the economy adjusted to the policy. It wasn't necessarily about people "gaming" it maliciously; it was about the system dynamics changing.
  *   **The Popular Version:** Over time, sociologists (like Marilyn Strathern) and management consultants adapted it to human behavior. The common phrasing became: *"When a measure becomes a target, it ceases to be a good measure."*
      *   **Meaning:** This is what your colleague described. It focuses on **agent behavior**—people intentionally optimizing for the number rather than the goal (e.g., a call center agent hanging up on customers to keep "average call time" low).

  ### 3. Is the Metric "Completely Worthless"?
  **Verdict: Exaggerated.**
  The law states the metric becomes **less reliable**, not necessarily useless.
  *   **Degradation, not Destruction:** When pressure is applied, the correlation between the metric and the actual goal weakens. It doesn't always drop to zero.
  *   **Context Matters:** In low-stakes environments, metrics can still function well. Goodhart's Law kicks in hardest when the stakes are high (bonuses, firing, promotions).
  *   **Campbell's Law:** There is a related sociological principle called Campbell's Law which is more specific to your colleague's point: *"The more any quantitative social indicator is used for social decision-making, the more subject it will be to corruption pressures and the more apt it will be to distort and corrupt the social processes it is intended to monitor."* Even this suggests distortion, not total worthlessness.

  ### 4. Is Secrecy the Solution?
  **Verdict: No. This is the most dangerous part of your colleague's advice.**
  Keeping KPIs secret is widely regarded in modern management theory as **counterproductive** and potentially toxic. Here is why the "secrecy fix" does not follow from the law:

  *   **It Creates Anxiety, Not Alignment:** If employees don't know how they are being measured, they cannot align their work with company goals. This leads to "learned helplessness" or guessing games, which reduces productivity more than gaming would.
  *   **It Destroys Trust:** Secret evaluations feel like a "gotcha" system. This erodes psychological safety, which is crucial for high-performing teams (especially in tech/agile environments).
  *   **It Doesn't Stop Gaming:** People are smart. Even if you hide the specific metric, they will infer it. If they see that people who ship code fast get promoted, they will ship fast code regardless of whether "Velocity" is a stated KPI.
  *   **It Prevents Feedback:** You can't improve what you can't see. If a metric is secret, an employee can't self-correct before a review.

  ### Better Defenses Against Goodhart's Law
  Instead of secrecy, management experts recommend these strategies to mitigate Goodhart's Law:

  1.  **Use Multiple Metrics:** Never rely on a single number. If you measure "Lines of Code," pair it with "Bug Rates." If you measure "Speed," pair it with "Customer Satisfaction." This makes it harder to game one without hurting the other.
  2.  **Qualitative Assessment:** Combine quantitative data with manager/peer review. Numbers inform the decision; they don't make the decision.
  3.  **Rotate Metrics:** Change what you measure periodically so people don't settle into long-term gaming strategies.
  4.  **Measure Outcomes, Not Outputs:** Don't measure "features shipped" (output); measure "user retention increased" (outcome). It is harder to game business value than it is to game activity.
  5.  **Accept Imperfection:** Acknowledge openly that the metric is flawed. "We know this KPI isn't perfect, but it's the best signal we have right now." This reduces the pressure to treat the number as absolute truth.

  ### Summary
  Your colleague is **half-right**.
  *   **Right:** Metrics create perverse incentives, and high-stakes KPIs often lead to gaming.
  *   **Wrong:** It is not a theorem, the original context was monetary policy, metrics don't always become worthless, and **secrecy is a terrible solution.**

  The healthiest view is to treat metrics as **dashboard lights**, not the **steering wheel**. They tell you something might be wrong, but they shouldn't be the only thing you look at while driving.
