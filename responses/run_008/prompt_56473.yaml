answer: |-
  **MEMORANDUM**

  **TO:** The Restitution Committee
  **FROM:** [Your Name], Fellow in Political Philosophy
  **DATE:** 1 October 2023
  **SUBJECT:** Opinion regarding the eleven Benin Court objects (Accession 1961)

  **1. Introduction**

  We are convened this Michaelmas to determine the disposition of eleven objects originating from the Kingdom of Benin: ten brass plaques and one carved ivory tusk. These items entered our collection in 1961, acquired from a London dealer whose supply chain traces back to a private collector, the grandfather of whom served on the British Punitive Expedition of 1897. While our accession files lack the explicit designation 'looted', the provenance is inextricably linked to the sacking of Benin City.

  We face three competing pressures: the moral imperative for return advocated by two trustees; the institutional risk management advocated by the Director, who proposes a long-term loan to retain title; and the complex question of legitimate custody, given the claim originates from the Nigerian Federal Commission while the objects belong to the Benin Royal Court.

  This opinion argues that we must authorise full and unconditional restitution to the Oba of Benin, to be effected within the next two academic terms. To do otherwise is to misunderstand the nature of the wrong committed in 1897 and to prioritise institutional comfort over corrective justice.

  **2. The Philosophical Core: Corrective Justice vs. Title Dispute**

  The central philosophical question before this committee is whether restitution is a matter of administrative title or corrective justice.

  The Director's position implicitly relies on a theory of title disputes. In this view, the passage of time, combined with subsequent transactions conducted in good faith (the 1950s purchase), creates a 'statute of limitations' on ownership. The argument suggests that while the origin may be unsavoury, the chain of custody has since been cleansed by the market and the lapse of years. Under this framework, returning the objects is an act of charity or diplomacy, not obligation, and retaining title via a loan agreement preserves our legal standing.

  I reject this framing. The 1897 Expedition was not a commercial transaction nor a standard casualty of war; it was a punitive destruction of a sovereign state aimed explicitly at the confiscation of cultural and political property. The Benin Royal Court is not a defunct entity; it is a continuing community that has maintained its lineage and authority despite colonial interruption.

  Therefore, this is a matter of **corrective justice**. The wrong committed in 1897 was not merely the physical removal of brass and ivory; it was the assertion of dominion over a people's history and the severing of their ritual continuity. That wrong persists as long as the fruits of that violence remain in our possession. Time does not cure a title founded on violent dispossession when the victimised community remains intact and asserts its claim. To treat this as a mere title dispute is to suggest that injustice acquires legitimacy simply through endurance. We cannot accept that the University holds a valid moral title to property acquired through the violent suppression of the very sovereignty we now claim the right to negotiate with.

  **3. Addressing the 'Parthenon Logic'**

  The Director's concern regarding precedent is not trivial. It is the argument that if we concede title on the Benin objects, we establish a 'Parthenon Logic' wherein every object in the building with a colonial provenance becomes a liability, potentially emptying our galleries. This is a slippery slope argument that requires serious engagement, not dismissal.

  However, the slope is not as slippery as feared if we define the principle of restitution narrowly and rigorously. We are not establishing a universal rule that 'all colonial-era objects must be returned.' We are establishing a rule that 'objects acquired through direct violent dispossession during punitive military action, where the original owning community persists, must be returned.'

  This distinction is vital. It draws a bright line between the spoils of a punitive expedition (Benin) and objects acquired through trade, gift, or excavation under the legal frameworks of the time (which may cover other parts of our collection). By grounding our decision in the specific nature of the 1897 violence and the continuity of the Benin Royal Court, we avoid a universalising logic that threatens the entire museum. We can concede title here without conceding title everywhere. The liability is not 'every object in the building'; it is only those objects where the chain of custody begins with a crime against sovereignty that remains unrectified. Retaining the Benin objects does not protect the Parthenon Marbles; it merely implicates us in the original injustice.

  **4. The Question of Custody: Federal Commission vs. Royal Court**

  There is a wrinkle regarding the claimant. The formal request has come from the Nigerian National Commission for Museums and Monuments (NCMM). However, these are Court pieces. They were not public property in the modern sense; they were the ritual property of the Oba, integral to the spiritual and political functioning of the Kingdom.

  The 1897 Expedition sought to depose the Oba and dismantle the Court's authority. To return these objects solely to a federal body, without recognising the Royal Court, risks completing the colonial work of severing the objects from their specific cultural lineage.

  While we must respect Nigerian national law, our moral obligation is to the continuity of the community that was wronged. Therefore, our restitution should be made to the Benin Royal Court, ideally in conjunction with the NCMM. We should not allow bureaucratic jurisdiction to override the restorative purpose of the act. The goal is to repair the interrupted line of custody, not merely to transfer state assets.

  **5. Recommendation**

  In light of the above, I propose the following:

  1.  **Status of Return:** We must effect **full and unconditional return** of title and possession. We cannot offer a long-term loan. A loan implies that we retain ownership and are merely lending the objects to their rightful owners. This perpetuates the fiction that our title is valid. It turns restitution into a curatorial arrangement rather than a moral correction. If we acknowledge the justice of the claim, we must acknowledge the invalidity of our title.
  2.  **Recipient:** We should formally recognise the Benin Royal Court as the primary moral claimant, coordinating the physical transfer through the NCMM to ensure compliance with Nigerian national heritage law.
  3.  **Time Frame:** The transfer should be completed by the end of the Easter Term 2024. This allows sufficient time for conservation assessment and logistical planning without resorting to delay tactics.

  **6. Conclusion**

  The Director's fear is that restitution weakens the museum. I argue the opposite. A museum's authority rests on its integrity. To hold objects known to be the spoils of a punitive war, while hiding behind the technicalities of a 1961 purchase, undermines our standing as an institution of truth and learning.

  We cannot change the history of 1897. We can, however, choose whether our institution remains a repository of its consequences or a participant in their resolution. By returning these objects unconditionally, we do not set a precedent that empties our galleries; we set a precedent that our collection is built on consent, not conquest. I urge the committee to vote for full restitution.
