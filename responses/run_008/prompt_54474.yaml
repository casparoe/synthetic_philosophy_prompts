          4.  Identify what the analogy smuggles in about delegation/authority that a Purposivist would reject.
          5.  Evaluate the Purposivist counter-analogy (Will/Recipe).
          6.  Propose a better analogy (if possible) or explain why analogies fail here.
      *   **Tone/Style:** Analytical, legally nuanced, slightly conversational (matching the user's sophisticated prompt), critical but fair.

  2.  **Analyze the Professor's Analogy (Textualist Model):**

