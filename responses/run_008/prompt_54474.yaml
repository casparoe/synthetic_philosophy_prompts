  *(Self-Correction on the "Better Analogy"):* While Open Source is good, the "Architect and Builder" analogy is more classic for Purposivism. However, the "Multi-Author Codebase" is more modern and fits the "535 bosses" critique better. I will offer the Codebase analogy as the strongest contender for the modern legislative reality.

  *(Final check on the "Smuggled Premises"):* Ensure I highlight that Textualism smuggles in the idea that *democracy* is only served by the vote on the text, whereas Purposivism argues democracy is served by achieving the public good the voters asked for.

  *(Final check on Purposivist Analogy):* The "Will" analogy is actually tricky because Wills are strictly construed sometimes. The "Trust" or "Fiduciary" analogy might be better for Purposivism. I'll stick with the "Recipe/Architect" as the user suggested but refine the critique.

