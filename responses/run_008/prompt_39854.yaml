answer: |-
  This is a high-risk, high-reward pedagogical design. It relies on generating genuine social friction in a classroom setting, which can backfire if the "game frame" overrides the "social frame." Below is the complete run-of-show, designed to maximize the probability of the norms emerging organically.

  # Seminar Game: "The Tall Poppy Protocol"

  **Class Size:** 20 Students
  **Time:** 75 Minutes
  **Materials:**
  *   4 Tables (Groups of 5).
  *   Printed Scorecards for each student.
  *   4 Dice (one per table).
  *   1 Packet of Trivia Puzzles (one per student).
  *   3 "Advantage Cards" (prepared secretly).
  *   Candy/Prizes for the winning group (and a "consolation" prize for the most egalitarian group).

  ---

  ## Part 1: The Rules & Economics (10 Minutes)

  **Facilitator Script:**
  "We are going to play a three-round resource game. You are in groups of five. Your goal is to maximize your personal points, but your group's total points determine if you get the 'Class Prize' (candy/music choice).

  **The Actions:**
  Each round, you must choose one of two actions privately, then reveal simultaneously:
  1.  **Blend In:** You play it safe.
  2.  **Stand Out:** You attempt a high-risk challenge.

  **The Payoffs:**
  *   **Blend In:** Guaranteed **10 points**.
  *   **Stand Out (Success):** **50 points**.
  *   **Stand Out (Failure):** **0 points**.

  **The Enforcement Mechanism (The 'Cut'):**
  After scores are revealed, any player may choose to **Cut Down** a player who Stood Out.
  *   **Cost to Cutter:** You pay **5 points** from your total stash.
  *   **Effect on Target:** The Target loses **all points gained that round**.
  *   **The Bounty:** A pool of **20 points** is created. It is split equally among *only* those who paid to Cut. (If 4 people cut, they pay 20 total and get 20 back. Net zero cost, but the Target is crushed. If 1 person cuts, they pay 5, get 20. Net +15 profit).

  **Winning Conditions:**
  *   **Individual:** Highest personal score gets a bag of premium candy.
  *   **Collective:** If the *Class Total* exceeds X, everyone gets a chocolate bar. (Set X high enough that Stand Outs are *needed* to reach it, simulating the 'growing the pie' aspect of the American Dream)."

  **Design Note on Numbers:**
  *   *Blend (10)* vs *Stand Out (50)*: The gap is large enough to tempt risk-takers.
  *   *Cut Cost (5)* vs *Bounty (20)*: This creates a **volatile equilibrium**. If you think you are the *only* one who will cut, it is profitable. If you think *everyone* will cut, it is financially neutral but socially destructive. This forces them to guess the group's norm, not just do the math.

  ---

  ## Part 2: The Rounds (35 Minutes)

  ### Round 1: Effort (10 Minutes)
  *   **Task:** A moderately difficult logic puzzle or trivia set (5 questions).
  *   **Success Condition:** Get 4/5 correct.
  *   **The Rig (Preparation):** Before class, identify 3 students (ideally socially central, not outliers). Slip them an **"Advantage Card"** as they enter. The card says: *"In Round 1, you may peek at the answer key for 10 seconds."*
  *   **Instruction:** "Choose Blend or Stand Out. If Stand Out, solve the puzzle."
  *   **Procedure:**
      1.  Students choose.
      2.  Stand Outs attempt puzzle.
      3.  Reveal scores.
      4.  **Cutting Phase:** Give them 2 minutes to discuss and write down if they want to Cut any specific Stand Out. (Public declaration of cuts increases social pressure).
      5.  Resolve points.

  ### Round 2: Luck (10 Minutes)
  *   **Task:** Roll a die.
  *   **Success Condition:** Roll a 4, 5, or 6 (50% chance).
  *   **Instruction:** "Same choices. Success is now pure luck."
  *   **Procedure:** Same as Round 1.
  *   **Observation:** Watch if groups Cut the Luck-based Stand Outs more aggressively than the Effort-based ones.

  ### Round 3: The Legitimacy Shock (15 Minutes)
  *   **The Reveal Script:** (Deliver this calmly, without apology).
      *"Pause. Before Round 3, I need to update the game state. In Rounds 1 and 2, the scoring was not entirely neutral. Three students in this room were given hidden advantages that guaranteed their success in Round 1. [Name the 3 students]. Their success was not earned; it was rigged by the House."*
      *"You cannot take their points back. But you enter Round 3 knowing the system is manipulable."*
  *   **Task:** Choice of Effort or Luck (let them pick).
  *   **Procedure:** Play Round 3 immediately. Watch for two reactions:
      1.  **Retribution:** Do they Cut the rigged players now? (Impossible, as points are banked, so they may Cut *new* Stand Outs aggressively).
      2.  **Collapse:** Do fewer people Stand Out because the meritocracy is broken?
      3.  **Nihilism:** Does everyone Cut everyone?

  ---

  ## Part 3: The Debrief (30 Minutes)

  *Do not let them pack up. Keep the tension.*

  **Phase 1: The Data (5 mins)**
  Write on the board:
  *   Round 1 Stand Outs: [Number] | Cuts: [Number]
  *   Round 2 Stand Outs: [Number] | Cuts: [Number]
  *   Round 3 Stand Outs: [Number] | Cuts: [Number]

  **Phase 2: The Norms (15 mins)**
  *   **Question 1 (Effort vs. Luck):** "Look at Round 1 vs Round 2. Did you feel more justified cutting someone who got lucky vs. someone who worked? Why? Does the American Dream survive if success is random?"
  *   **Question 2 (The Cost of Cutting):** "To Cut, you had to pay 5 points. Why did anyone do it? You lost points. What did you *buy* with those 5 points?"
      *   *Target Answer:* You bought social equilibrium. You bought the feeling that 'we are all the same.' This is Jantelagen. It's not about the points; it's about the signal.
  *   **Question 3 (The Rig):** "When I revealed the rig, did you want to punish the rigged students? Or did you just stop caring about the game? When legitimacy collapses, does the norm become 'no one stands out' or 'everyone cuts'?"

  **Phase 3: The Mapping (10 mins)**
  *   **American Dream:** Corresponds to the **Collective Win Condition**. You *need* Stand Outs to get the Class Prize. The system *needs* inequality to function.
  *   **Jantelagen/Tall Poppy:** Corresponds to the **Cutting Mechanism**. It is decentralized. No professor enforced it; *you* enforced it. It is costly to the enforcer (5 points), which proves it's a norm, not a law.
  *   **The Fake Part:** "In the game, Cutting was profitable if you were the only one. In real life, Cutting is rarely financially profitable. It's purely social capital. Where did the game fail to capture that?"

  ---

  ## Part 4: Predictable Failure Modes (Debug Guide)

  **1. The "Mathematicians" Problem**
  *   **What happens:** One group calculates that if 4 people Cut, the net cost is zero. They treat it as a coordinated raid. They systematically drain every Stand Out.
  *   **Why:** They gamified the norm.
  *   **Fix:** In the debrief, highlight this. "Group 3 turned Jantelagen into a cartel. Is that what happens in real villages? Does norm enforcement become a racket?"

  **2. The "Nice Class" Problem**
  *   **What happens:** No one Cuts. Everyone Stands Out. The room is too polite.
  *   **Why:** They don't feel safe being mean, or the 5-point cost is too high for them.
  *   **Fix:** Lower the Cut Cost to 3 points in future runs. Or, during the game, whisper to one student: "If you Cut, I'll give you a bonus point." (Break your own rules to seed the behavior).

  **3. The "Professor is the Villain" Problem**
  *   **What happens:** The Rigged Reveal makes them angry at *you*, not the system. They disengage.
  *   **Why:** The deception felt malicious, not pedagogical.
  *   **Fix:** In the debrief, explicitly apologize for the deception *as a simulation of systemic opacity*. "I broke your trust to show you how hard it is to trust meritocracy when you suspect rigging. My goal was to make you feel that suspicion, not to actually cheat you."

  **4. The "Confederate Blowback"**
  *   **What happens:** The 3 rigged students feel singled out and humiliated.
  *   **Fix:** Debrief them privately after class. Ensure they know they were chosen randomly (or based on seating) and not because they were "too successful." Give them extra candy as a "hazard pay" thank you.

  ---

  ## Part 5: Self-Critique (Where My Reasoning is Weakest)

  **The Weakest Link: The Profitability of Cutting**
  I am least confident in the economic structure of the "Cut."
  *   **My Logic:** By making Cutting potentially profitable (if few people do it), I incentivize the behavior so we have data to discuss.
  *   **The Risk:** This turns "Social Norm Enforcement" into "Predatory Rent Seeking." In real Jantelagen, cutting a tall poppy costs you social capital (you look jealous). In my game, it *gains* you points (if you're the lone cutter).
  *   **What I expect to see if I'm wrong:** Students will Cut *only* when they calculate they can be the lone cutter. They won't Cut out of moral outrage; they will Cut out of greed. The "Norm" will look like a "Market."
  *   **The Debug Signal:** In the debrief, if students say, "I cut him because I needed the points," the design failed. If they say, "I cut him because it wasn't fair that he got 50 while I got 10," the design worked.
  *   **The Fix:** If the debrief reveals the "Greed" motive dominated, I need to change the payout. **Revision:** Cutting should *never* be financially profitable. Cost to Cut: 5 points. Bounty: 0 points. The only reward is that the Target loses points.
      *   *Why I didn't do this initially:* Students hate losing points for no gain. They might refuse to Cut at all.
      *   *Compromise:* Keep the Bounty, but cap it. "Total Bounty is 10 points, split among cutters." Now, if 3 people cut, they lose points. This makes Cutting an **Altruistic Punishment**, which is a much closer map to real-world norm enforcement. **I recommend you use this Compromise Math instead of the original.**

  **Revised Math for Maximum Fidelity:**
  *   **Cut Cost:** 5 points.
  *   **Target Loss:** 30 points.
  *   **Cutter Reward:** 2 points (Token "Social Approval").
  *   **Logic:** You lose 3 net points to Cut. This proves you value the *Norm* more than the *Points*. This is the definition of internalized social pressure. If they still Cut with this math, you have successfully simulated Jantelagen.

  **Final Advice:**
  Run the "Altruistic Punishment" math (Loss of 3 net points per cut). It will result in fewer cuts, but the cuts that *do* happen will be philosophically richer. You want fewer, more meaningful cuts, not a bloodbath of profitable raiding.
