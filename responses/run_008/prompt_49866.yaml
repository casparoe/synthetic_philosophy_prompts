answer: |-
  # DECISION TREE: TOKEN CAUSATION
  **Starting Commitment:** There are token causal relations among particular events.

  **Q1. OMISSION (Case 3):** A contract gardener never waters the flowers, which die (no one else would have). Did the *failure to water* cause the death?
  *   **NO** → **HUMEAN REGULARITY VIEW**  
      *(Causation requires positive events and constant conjunctions; absences are not events.)*
  *   **YES** → Go to Q2.

  **Q2. PREEMPTION (Case 1):** A bodyguard knocks a poisoned glass away; an assassin (backup) would have shot if the poisoning succeeded. The victim dies of thirst later? *Correction: Victim dies because bodyguard knocked glass?* **Scenario:** Bodyguard knocks poisoned glass; Assassin would have shot if glass remained. Victim survives? **Scenario:** Bodyguard knocks glass; Assassin would have shot if glass remained. Victim dies of *other cause*? **Use Prompt Case:** Bodyguard knocks poisoned glass; Assassin waits to shoot if poisoning fails. Victim dies (assume poisoning was fatal, bodyguard prevented it? No, prompt says Bodyguard knocks glass, Assassin fires *in case poisoning failed*). **Re-read Prompt:** "Bodyguard quietly knocks a poisoned glass off a table, and an assassin who had been waiting to shoot only in case the poisoning failed then fires; ask who caused the death." (Implies Victim dies).
      *   **Question:** Did the *bodyguard* cause the death (despite no counterfactual dependence, since the assassin would have killed anyway)?
      *   **NO** → **SIMPLE COUNTERFACTUAL-DEPENDENCE VIEW**  
          *(Causation requires dependence; the bodyguard is not a cause.)*
      *   **YES** → Go to Q3.

  **Q3. DOUBLE PREVENTION (Case 4):** A defender destroys Missile 1. Attackers had a faulty Missile 2 set to launch if Missile 1 was destroyed (but it would not have launched). The city survives. Did the *defender* cause the city's survival?
  *   **NO** → **UNOCCUPIED**  
      *(Incoherent: Rejecting double-prevention while accepting preemption breaks the transitivity of causal chains both rely on.)*
  *   **YES** → Go to Q4.

  **Q4. NORM-SENSITIVE TIEBREAK (Case 5):** Two officials must each sign for a permit; both sign. Ordinarily, we credit the *second* signature with causing the permit to issue because it completed the requirement. Did the second (rather than the first) signature cause it?
  *   **YES** → Go to Q6.
  *   **NO** (Both are equal causes) → Go to Q5.

  **Q5. OVERDETERMINATION (Case 2):** Two riflemen fire simultaneously; either shot alone is fatal. Did *each* rifleman cause the death?
  *   **NO** (Or: It is degenerate/problematic) → **LEWIS'S POSITION**  
      *(Accepts chains for preemption, but treats symmetric overdetermination as a limit-case where dependence fails.)*
  *   **YES** → Go to Q6.

  **Q6. PURPOSE & FORM:** Is causal truth relative to the investigator's purpose, or is there a single invariant relation?
  *   **RELATIVE TO PURPOSE** → **PLURALISM**  
      *(Different causal concepts apply in different contexts; no single "true" theory.)*
  *   **SINGLE INVARIANT RELATION** → **WOODWARD-STYLE INTERVENTIONISM**  
      *(Causation is defined by invariant manipulability; norms/contrasts are pragmatic, not metaphysical.)*
      *(Note: If you answered YES at Q4, you land here as **CONTRASTIVE/CONTEXT-SENSITIVE** if you believe causation is inherently a 4-place relation, or **PLURALISM** if you believe the concept itself shifts.)*

  ***

  **⚠️ THEORETICAL FLAG:** This tree cannot cleanly separate **Lewis** from **Woodward** at Q5/Q6. Both accept overdetermination as causation in their mature work. The split here relies on Lewis's early hesitation vs. Woodward's robust pathway analysis. Similarly, **Contrastive** views and **Pluralism** overlap at Q6; Contrastivists argue for one contrastive relation, Pluralists for many concepts.

  **CLOSING NOTE ON CONFIDENCE:**
  I am highly confident in the placement of **Humean**, **Simple Counterfactual**, and **Unoccupied** leaves, as these turn on clear metaphysical commitments regarding events and transitivity. I am moderately confident in the **Pluralism** leaf, as it is defined by its rejection of the "single relation" assumption in Q6. I am **least sure** about the node separating **Lewis** from **Woodward** (Q5). Lewis ultimately counts overdeterminers as causes, making his verdict identical to Woodward's; the distinction rests on theoretical *explanation* (dependence chains vs. independent pathways) rather than the case verdict itself.
