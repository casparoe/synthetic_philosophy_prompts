      *   *Point 5 (Verdict):* Is it neutral? Probably not fully. But is the search for neutrality a mistake? Yes, because methodology always carries ontological commitments. Heterophenomenology is a valid framework for illusionism but cannot be the "neutral" ground for realists. The verdict should be sharp.

