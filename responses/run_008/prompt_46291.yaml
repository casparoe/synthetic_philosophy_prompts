answer: |-
  **Opening**

  Good morning. For those who don't know me, I'm Alex, Ruth's grandson.

  If you knew my grandmother, you probably remember her hands first. They were steady hands. Capable hands. They could hold a crying infant, stitch a wound, or peel an apple without breaking the skin. She was eighty-eight years old. She was a mother, a sister, a friend, and for thirty-one years, she was a hospice nurse. She was the person you wanted in the room when the lights were dimming. She didn't bring noise into a space; she brought presence. She made you feel that wherever you were, it was enough, and you were safe.

  **Where It Came From**

  That safety wasn't an accident. It was built. For three decades, Ruth walked into rooms where people were facing the hardest thing a human being can face. She didn't do it from a distance. She did it in the middle of the night, in living rooms that smelled of antiseptic and old tea, holding hands when the breathing got difficult.

  She saw pain up close. She saw what it does to a person when the body fails. But she also saw what happens when someone is allowed to leave without fighting alone. She watched thousands of people die. Some died badly, in agony that no medicine could quite touch. Some died well, surrounded by love, with the pain managed down to a whisper. She didn't learn about life in a classroom. She learned it at the bedside. She collected those moments like stones in a pocket, weighing them, turning them over, until she understood something most of us spend our lives trying not to see.

  **What She Believed**

  Eventually, she formed a view on how the world works. She wasn't an academic, but she could argue circles around my philosophy professors. I learned this the hard way at Thanksgiving a few years ago. I was a philosophy major then, full of theories about how the good things in life balance out the bad. We were having apple pie. I tried to tell her that the sweetness of the moment outweighed the bitterness of the world.

  She didn't yell. She just put her fork down. She told me that some pains are so severe they belong to a different category than pleasure. She called it a "lexical threshold," which is just a fancy way of saying: there is a line you can't cross back over. She told me, "You don't get to balance a burn unit against a candy shop." No amount of pie, no matter how much you pile up, cancels out a certain kind of suffering. They don't trade. They don't even speak the same language. I lost the argument, and I lost the pie, but she was right. She believed that if pain is present, especially severe pain, our only job is to reduce it. Not to justify it. Not to balance it. To stop it.

  **What I Can Honestly Say to You Today**

  Knowing that, I found myself stuck writing this. The usual things we say at funerals didn't fit. I can't stand here and tell you that the joy of her life makes up for the pain of losing her, because she taught me that those things don't cancel each other out. I can't tell you that "it all evened out," because she knew it doesn't. And I won't tell you she wouldn't want us to be sad, as if grief is a choice we can simply switch off.

  But here is what I can say, and what she would say is true. She believed suffering was the one thing we are obligated to do something about. Right now, in this room, there is suffering. We are hurting. We are missing her. That pain is real, and it matters. But unlike the pain she spent her life witnessing, this is pain we can touch. We can alleviate it.

  We are here today not to pretend the loss isn't heavy, but to help carry it. If we look out for each other, if we check in on her sister, if we make sure her colleagues know how much they meant to her, we are doing exactly what she taught us. We are reducing the suffering that is left. She is beyond pain now. The only suffering remaining is ours, here, among the living. And that is something we can fix. We honor her not by pretending the pain isn't there, but by treating it with the same mercy she showed everyone else.

  **Closing**

  So, to all of you: take care of each other. Be the steady hands for someone else today.

  And to you, Grandma: You taught us that we can't fix everything, but we can fix what's in front of us. We'll start with this. We'll start with each other. Rest now. The shift is over.
