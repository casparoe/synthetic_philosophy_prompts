answer: |-
  Here is the exam material designed for your graduate seminar.

  ### 1. Essay Question

  **Time Limit:** 72 Hours
  **Word Limit:** 2,500 words maximum

  **Question:**
  David Lewis analyzes convention as a regularity in behavior sustained by a system of preferences and expectations: agents conform because they prefer to conform *if* others do, and this is common knowledge among the population. Crucially, for Lewis, the equilibrium selected must be arbitrary (there exists at least one other possible regularity that would have solved the coordination problem equally well).

  Brian Skyrms and other evolutionary game theorists argue that similar regularities (e.g., driving conventions, bargaining norms) emerge through selection dynamics in populations lacking beliefs, salience, or common knowledge. Lewis later conceded that the common knowledge requirement was too strong, but the evolutionary critique runs deeper: it suggests intentionality is unnecessary for convention.

  Write an essay evaluating whether evolutionary models refute Lewis's analysis or merely reveal a conceptual fork: are there two distinct phenomena (intentional conventions vs. evolutionary norms) that share the label 'convention'? In your answer, you must specifically address whether fairness norms emerging in mixed-motive bargaining games (such as the Ultimatum Game) can count as Lewisian conventions, given Lewis's restriction to pure coordination problems and the condition of arbitrariness.

  ***

  ### 2. Model Answer

  **Title:** Dynamics vs. Reasons: The Evolutionary Fork in Convention

  David Lewis's *Convention* provides a reductive analysis of social regularities grounded in rational choice theory. For Lewis, a convention is not merely a statistical regularity; it is a reason-based equilibrium. Agents conform because they have a conditional preference to coordinate, they expect others to conform, and they know that others know this (common knowledge). Crucially, Lewis restricts conventions to *coordination problems* where solutions are *arbitrary*; if one solution were objectively better (e.g., a unique Nash equilibrium in a Prisoner's Dilemma), conformity would be driven by dominance, not convention.

  Evolutionary game theory (EGT), championed by Brian Skyrms, challenges the necessity of Lewis's epistemic apparatus. Skyrms demonstrates that populations of agents with no cognitive capacity for belief or expectation can converge on stable equilibria (e.g., sending specific signals, dividing resources) via replicator dynamics. Selection filters out unsuccessful strategies, leaving a regularity that *looks* like a convention but lacks the intentional substrate Lewis deemed essential. Lewis's later concession regarding common knowledge acknowledges that finite agents cannot satisfy strict infinite recursive knowledge, but EGT goes further: it removes the need for *any* knowledge.

  Does this refute Lewis? A strong evaluation suggests it exposes a conceptual fork rather than a simple falsification. Lewis is engaged in conceptual analysis of a folk-psychological kind: he is explaining why *we* act as we do by citing our reasons. If I drive on the right because I believe you will, my action is intentional. Skyrms is engaged in functional explanation: he explains why a pattern *persists* regardless of agent psychology. If we accept the evolutionary account as an analysis of "convention," we sever the link between convention and agency. Therefore, EGT does not refute Lewis's analysis of *intentional* convention; rather, it identifies a broader class of *stable normative regularities* that includes, but is not limited to, Lewisian conventions. We are tracking two different *explananda*: the rationale for action versus the stability of the pattern.

  This fork becomes critical when assessing fairness norms in mixed-motive games, such as the Nash bargaining solution in the Ultimatum Game. Evolutionary models show that populations can converge on a 50-50 split norm without explicit agreement. However, can this be a Lewisian convention? First, the Ultimatum Game is not a pure coordination problem; it involves conflict over the surplus. Conformity is not driven solely by a conditional preference to match others, but by threats of rejection and evolutionary pressure against greed. Second, and more damning for the Lewisian classification, the 50-50 split is often not arbitrary in the way "driving on the left" is. It possesses a salience grounded in symmetry and fairness that makes it a unique focal point, potentially violating Lewis's requirement that alternative regularities exist which could have served just as well.

  If we classify bargaining norms as conventions, we must abandon Lewis's restriction to pure coordination and arbitrariness. If we maintain Lewis's criteria, these are norms of justice or cooperation, not conventions. The evolutionary approach blurs this distinction, treating all stable equilibria as "norms." Ultimately, the evolutionary critique succeeds in showing how normative order arises without reason, but it fails to capture the specific phenomenology of acting *because* it is the convention. We should therefore accept the fork: Lewis explains the intentional practice of convention; Skyrms explains the emergence of social order. Conflating them risks losing the distinctively human capacity to follow a rule because it is recognized as such.

  ***

  ### 3. Marking Scheme (20 Points Total)

  **1. Accurate Reconstruction of Lewis (4 Points)**
  *   **Criteria:** Correctly identifies the triad of conditional preferences, expectations, and common knowledge. Must explicitly mention the **arbitrariness condition** and the restriction to **coordination problems**.
  *   **Common Fumble:** Students define convention merely as "regularity" or "habit," missing the reason-based/conditional preference structure, or they forget that Lewis requires alternative equilibria to exist.

  **2. Accurate Reconstruction of Evolutionary Critique (4 Points)**
  *   **Criteria:** Explains that EGT produces stable equilibria via selection dynamics/replicator equations without requiring beliefs, salience, or cognitive reasoning.
  *   **Common Fumble:** Describes evolutionary learning as merely "slow rational learning" rather than a distinct mechanism that bypasses intentionality entirely.

  **3. Evaluation of the "Refutation vs. Divergence" Dilemma (4 Points)**
  *   **Criteria:** Takes a clear stance on whether EGT falsifies Lewis or identifies a distinct phenomenon (the "fork"). Must argue *why* the distinction matters (e.g., reasons for action vs. stability of patterns).
  *   **Common Fumble:** Sits on the fence ("both have good points") without synthesizing a position on the ontological status of conventions.

  **4. Analysis of Mixed-Motive/Fairness Norms (4 Points)**
  *   **Criteria:** Applies the Lewisian criteria to bargaining norms (Ultimatum/Nash). Addresses whether fairness norms meet the **arbitrariness** condition or if they are focal/salient due to fairness, and whether mixed-motive games fit the coordination definition.
  *   **Common Fumble:** Treats bargaining norms as identical to driving conventions, failing to note the conflict-of-interest component that distinguishes them from Lewis's paradigm cases.

  **5. Argumentative Coherence and Synthesis (4 Points)**
  *   **Criteria:** The essay flows logically from definition to critique to application. The conclusion follows from the premises established in the "fork" argument.
  *   **Common Fumble:** The essay is a "list" of points (Lewis says X, Skyrms says Y) without a unifying thesis connecting the epistemic critique to the bargaining application.
