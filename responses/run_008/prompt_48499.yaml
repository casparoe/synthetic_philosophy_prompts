  2.  **Deconstruct the Debate (as presented by the user):**
      *   *Position (a) Semantic/Truth-Conditional:* Derogation is part of the proposition. "X is a [slur]" is false if X isn't contemptible.
      *   *Position (b) Conventional Implicature (CI):* Descriptive content is neutral, but the word carries a conventional, non-truth-conditional attitude (like "but" or "therefore").
      *   *Position (c) Expressivism:* No description, just expression of attitude (like "Boo!").
      *   *Position (d) Pragmatics/Contextualism:* Meaning is fluid, offense arises from use/context.
      *   *Data Points:* Embedding problems (negation/conditionals still offensive), Quotation problems (mentioning still feels dirty), Reappropriation (in-group use flips valence).
      *   *The Stall:* Everyone agrees on data, everyone claims their theory explains it, no movement.
      *   *User's Hypothesis:* It's a disguised disagreement about the semantics/pragmatics boundary or two different projects (linguistics vs. normative pragmatics).
      *   *User's Counterpoint:* They *do* attack each other directly using the same cases, suggesting a substantive dispute.

  3.  **Evaluate the Nature of the Disagreement:**
      *   *Is it merely verbal?* No. If it were just about the definition of "semantics," they wouldn't fight over embedding conditions. Embedding tests are the *tool* used to define the boundary. If they agree on the data (embedding fails to cancel offense), they disagree on *why*.
      *   *Is it substantive?* Yes, but perhaps not in the way traditional truth-conditional semantics expects. The core tension is between *compositionality* and *social force*.
      *   *Is it divergent programs?* This is the strongest angle. One side wants to save compositionality (how does this word fit in the sentence?), the other wants to explain the harm (what does this utterance *do*?).
      *   *The "Frege-Geach" Problem for Slurs:* The embedding data is the crux. If offense persists under negation ("He is not a [slur]"), CI and Expressivism struggle (usually negation targets the assertion, not the CI/Expression). Semanticists say "Aha! It must be truth-conditional!" Pragmatists say "No, the social force projects."
