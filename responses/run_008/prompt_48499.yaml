      *   *Wait, user's hypothesis:* "Two groups answering different questions." I should lean into this but refine it. They are answering different questions *using the same vocabulary*.
      *   *Decision:* I will argue it is a **substantive disagreement about the architecture of meaning** that is currently **stalled due to data underdetermination**, which creates a **functional divergence** (your hypothesis was close, but it's deeper than just "linguistics vs. normative").
      *   *Actually, looking closer at the prompt:* The user asks: "Is it verbal, substantive-but-hard, or two research programs?" I should pick one but nuance it. I'll argue it's **two research programs with different success criteria fighting over the same territory.** This aligns best with the "stall" observation.
