answer: |-
  This is a sharp diagnosis of a well-known friction point in the literature. You are observing what many senior philosophers of language have begun to suspect: the "semantics of slurs" debate has hit a wall because the available linguistic data underdetermines the theoretical architecture required to explain it.

  Here is my diagnosis of the disagreement, what would count as progress, and my confidence levels in these claims.

  ### 1. The Diagnosis: Divergent Programs with a Substantive Core

  I believe your hypothesis is largely correct, but it needs a slight adjustment. This is not *merely* a verbal dispute about where to draw the semantics/pragmatics line, nor is it a straightforward substantive dispute about the world.

  **Diagnosis:** This is a case of **two research programs with different success criteria fighting over the same territory.**

  *   **Program A (Formal Semantics):** Their success criterion is **compositionality**. They need to explain how the slur combines with negation, conditionals, and belief reports without breaking the logical machinery of the language. For them, the "embedding data" (offense persists under negation) is the primary constraint. They are willing to bite the bullet on reappropriation (often treating it as a different word or a pragmatic override) to save the compositional model.
  *   **Program B (Normative Pragmatics/Speech Act Theory):** Their success criterion is **social explanation**. They need to explain the *harm*, the *forbiddenness*, and the *reappropriation*. For them, the "reappropriation data" (in-group use flips valence) is the primary constraint. They are willing to bite the bullet on compositionality (accepting that slurs behave irregularly in embedded contexts) to save the social reality of the term.

  **Why they seem to be attacking each other (The Counterpoint):**
  You noted that they directly attack each other's accounts. This happens because both programs are trying to satisfy a shared constraint: **The Interface Constraint.** Both sides agree that linguistic meaning must eventually interface with use.
  *   The Semanticists argue that if you push too much into pragmatics (Program B), you lose the ability to explain why the offense is *immediate* and *mandatory* (you can't cancel it like a standard implicature).
  *   The Pragmatists argue that if you push too much into semantics (Program A), you lose the ability to explain why the offense is *socially mutable* (reappropriation) and *context-sensitive*.

  They are fighting because they are both trying to build a *unified* theory of meaning that satisfies both compositionality and social mutability, and the current data suggests these two virtues might be in tension.

  **Confidence in this diagnosis:** **High.**
  The literature clearly shows this split. Semanticists (e.g., Hom, May) prioritize logical form; Pragmatists/Expressivists (e.g., Anderson, Lepore) prioritize use conditions. The stalemate arises because neither side can account for the other's "killer data" without weakening their own core virtue.

  ### 2. What Would Count as Real Progress?

  Given that the stall is structural (underdetermination of theory by data), more of the same linguistic cases (negation, conditionals, quotation) will **not** generate progress. Both sides have already incorporated these into their models by adding epicycles (e.g., "complex content," "multi-dimensional semantics," "presuppositional accounts").

  **Real progress would require one of the following:**

  1.  **A New Kind of Data (Empirical Turn):** We need data that breaks the symmetry. Currently, both sides can explain embedding and reappropriation by adjusting parameters. We need evidence from **psycholinguistics or acquisition**.
      *   *Example:* Do children acquire the derogatory content of a slur at the same rate as the descriptive content? If they acquire the "booing" aspect before the "group membership" aspect, that favors Expressivism. If they treat it as a truth-conditional falsehood immediately, that favors Semanticism.
      *   *Why:* This moves the debate from "which theory fits the intuition" to "which theory fits the cognitive mechanism."

  2.  **Theoretical Separation (The "Split" Option):** The field needs to explicitly acknowledge that "The Semantics of Slurs" is actually two questions:
      *   *Q1:* What is the compositional contribution of the term? (Linguistics)
      *   *Q2:* What is the normative status of the utterance? (Ethics/Social Ontology)
      *   *Progress:* A consensus that a single dimensional semantic theory *cannot* capture both, and adopting a **multidimensional framework** (e.g., separating at-issue content from not-at-issue content formally) as a baseline, rather than fighting over which dimension is the "real" meaning.

  3.  **A Decision on Explanatory Priority:** The seminar needs to decide what the theory is *for*. Is the goal to save Truth-Conditional Semantics as a universal system? Or is the goal to explain oppressive speech? If the goal is the former, slurs might be "problematic data" to be managed. If the latter, standard semantics might be the tool that needs breaking.

  **Confidence in this prescription:** **Medium-High.**
  I am confident that more linguistic cases won't help. I am less confident that the field *will* accept splitting the question, as philosophers often prize unified theories over pluralistic ones.

  ### 3. Confidence and Uncertainty Flags

  Here is the breakdown of my certainty regarding this analysis:

  *   **Diagnosis of the Stall (Divergent Programs):** **High Confidence.** The pattern of argumentation you describe (agreeing on data, disagreeing on explanation, claiming victory based on different virtues) is the hallmark of paradigm incommensurability.
  *   **The "Verbal" Element:** **Medium Confidence.** I am confident there is a verbal component regarding the definition of "semantics," but I am less sure it is *only* verbal. There is a genuine substantive disagreement about whether attitude content can be truth-conditional.
  *   **The Solution (Psycholinguistics/Splitting):** **Medium Confidence.** This is the logical path forward, but intellectual fields often resist methodological shifts.

  **The Single Point I Am Least Sure About:**
  I am least sure about **whether a unified theory is actually impossible.**
  My diagnosis assumes that the tension between compositionality (semantics) and mutability (pragmatics) is a hard limit. However, it is possible that a sufficiently sophisticated formal framework (e.g., a dynamic semantics that updates context in a way that handles both truth and social score) could solve this without splitting the questions. I am flagging this because if such a theory exists or is developed, my diagnosis that this is a "divergent program" stall would be proven wrong—it would turn out to be a "substantive-but-hard" problem that just needed better math.

  ### Summary for your Seminar
  If you want to intervene, I suggest framing it this way:
  *"We seem to agree on the data but disagree on the explanatory target. Are we trying to save the compositionality of the language, or are we trying to explain the mechanism of harm? If it's the former, the Semanticists win on embedding but lose on reappropriation. If it's the latter, the Pragmatists win on reappropriation but lose on embedding. Until we decide which constraint is inviolable, we will keep talking past each other."*

  This forces the class to reveal their success criteria, which is usually where the real disagreement hides.
