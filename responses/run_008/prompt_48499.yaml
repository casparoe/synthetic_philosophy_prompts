      *   *Side B (Pragmatists/Normative):* Target = Illocutionary force/Social impact. Success = Explaining harm/reappropriation.
      *   *Why the stall?* They are optimizing for different virtues. Semanticists sacrifice reappropriation data to save compositionality. Pragmatists sacrifice compositionality to save the social reality of harm.

