answer: |-
  You have spotted a genuine tension that trips up a lot of people, even those who hang around decision theory forums. Your suspicion is sharp: if the logic for paying the coin-flip predictor is "you must stick to your precommitment," it feels like that same logic should crush you in the blackmail case too.

  The reason people get vague is that the slogan "Decide as you would have precommitted" is doing a lot of heavy lifting. It sounds like one argument, but it actually hides three different claims. Depending on which one you pick, the answer changes.

  Here is the breakdown of the three precise readings of that one-liner, evaluated against your two cases.

  ### 1. The Literal Contract Reading
  **The Claim:** You literally sat down before the game started and signed a binding agreement or made a solemn vow to pay $100 in this specific scenario.
  *   **(a) Plausibility:** Low. In thought experiments, there is rarely an actual contract. This reading relies on social norms about promise-keeping rather than decision theory.
  *   **(b) Coin Flip Case:** **Yes, Pay.** If you promised, you pay to keep your word.
  *   **(c) Blackmail Case:** **Yes, Pay.** If you promised the blackmailer (or promised yourself generally to pay blackmailers), you pay.
  *   **Verdict:** This is almost never what people mean. If this were the argument, the blackmail case would force you to pay, confirming your suspicion. But since the "rationalist crowd" says *don't* pay the blackmailer, they aren't using this reading.

  ### 2. The Advice-to-Past-Self Reading
  **The Claim:** Imagine you could talk to your self from yesterday (before the coin flip or before the letter arrived). What advice would you give them to maximize your total welfare?
  *   **(a) Plausibility:** Medium. This is close to standard Evidential Decision Theory. It feels intuitive.
  *   **(b) Coin Flip Case:** **Yes, Pay.** Your past self says: "Please agree to pay if it comes up Tails. If you do, I have a 50% chance of winning $1,000,000. It's worth the risk."
  *   **(c) Blackmail Case:** **No, Don't Pay.** Your past self says: "Whatever you do, do not agree to pay blackmailers. If you are the *type* of person who pays, the blackmailer will target you. If you are the *type* who refuses, they won't even send the letter. I want you to be the Refuser type so I never get the letter."
  *   **Verdict:** This reading is consistent! It tells you to pay in the Coin Flip but refuse in the Blackmail case. However, it has a weakness: once you are *in* the situation (holding the letter), your past self's advice looks like it's based on a world that no longer exists (the world where the letter wasn't sent). People get vague here because explaining why you should listen to advice from a timeline that didn't happen is tricky.

  ### 3. The Algorithmic (Updateless) Reading
  **The Claim:** You are not a specific instance of a person at a specific time; you are the output of a decision algorithm. The predictor simulated your algorithm before you existed. You must choose the output that makes your algorithm win in the *broadest* set of possibilities, including ones you now know are false.
  *   **(a) Plausibility:** High (within the specific community you're reading). This is Functional Decision Theory (FDT) or Updateless Decision Theory (UDT). It's the "hardcore" philosophical position.
  *   **(b) Coin Flip Case:** **Yes, Pay.** Your algorithm's output determines the payout in the Heads branch (which you can't see but still care about ex-ante) and the cost in the Tails branch. To win the million, your algorithm must output "Pay."
  *   **(c) Blackmail Case:** **No, Don't Pay.** Your algorithm's output determines whether the letter is sent *at all*. If your algorithm outputs "Pay," the blackmailer predicts this and sends the letter (you lose $100). If your algorithm outputs "Don't Pay," the blackmailer predicts this and stays silent (you lose $0). Therefore, the winning algorithm is "Don't Pay."
  *   **Verdict:** This is the one they are actually using. It resolves the inconsistency. The rule is the same ("Maximize the expected utility of your algorithm before any specific facts are known"), but the *result* is different because the payoff structures are different.

  ### Why They Get Vague When You Push
  You asked which reading people are probably running when they use the line to shut down the argument. It is **Reading #3**, but they usually speak as if they are using **Reading #1**.

  Here is why the conversation stalls:

  1.  **They skip the calculation:** When they say "Precommit!", they implicitly mean "Precommit to the *optimal* policy." In the Coin Flip, the optimal policy is "Pay." In the Blackmail case, the optimal policy is "Refuse." When you ask "Why doesn't precommitment make me pay the blackmailer?", they hear "Why don't I keep my promises?" instead of "Why is the optimal policy different here?"
  2.  **It sounds like magic:** Reading #3 requires you to accept that your decision *now* logically determines what the predictor did *in the past*. To a lot of people, that sounds like backwards causation or magic. So, when you press them, they retreat to vague slogans because they don't want to defend the metaphysics of "logical counterfactuals."
  3.  **Your suspicion is half-right:** You suspected that any logic forcing you to pay the mugger forces you to pay the blackmailer. In **Reading #1** (Literal Promise), you are absolutely correct. But in **Reading #3** (Algorithmic), the logic forces you to do *whatever makes you rich on average*. Sometimes that's paying (Mugging), sometimes that's refusing (Blackmail).

  ### The Takeaway for the Thread
  If you want to cut through the noise on the forum, post this:

  > "I think the confusion comes from mixing up the *principle* of precommitment with the *content* of the precommitment.
  >
  > If the principle is 'Maximize ex-ante expected utility' (Updateless Decision Theory), then the content changes based on the game:
  > 1.  **Coin Flip:** The winning precommitment is 'I will pay.' (Because it unlocks the Heads payout).
  > 2.  **Blackmail:** The winning precommitment is 'I will not pay.' (Because it prevents the letter from ever being sent).
  >
  > So the slogan 'Decide as you would have precommitted' is consistent, but only if you admit that in the Blackmail case, my precommitment was specifically to tell blackmailers to get lost. If you argue I should pay the blackmailer because of precommitment, you're arguing I made the wrong precommitment in the first place."

  This shows you understand the deeper theory (Reading #3) while pointing out that their vagueness comes from failing to specify *which* precommitment is the rational one.
