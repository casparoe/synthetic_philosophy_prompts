answer: |-
  **Q&A PREP SHEET: SUFFERING-FOCUSED AXIOLOGY**
  **Audience:** Welfare Economists, Symmetric Utilitarians, Analytic Philosophers
  **Tone:** Technical, Defensive but Concessive, American English

  ### 1. The Aggregation/Spectrum Objection (The "Reverse Repugnant Conclusion")
  **The Objection:** "You claim severe suffering has lexical priority, yet you deny fanatical negative utilitarianism. But if you allow trade-offs below your severity threshold, you face a spectrum problem. Does a trillion lives with a mild headache outweigh one life of torture? If yes, your lexical priority is illusory; if no, you are committed to a counterintuitive conclusion where aggregate mild suffering never matters. How does your social welfare function handle scope without collapsing into either classical utilitarianism or fanatical negative utilitarianism?"

  **Two-Minute Reply:**
  "I accept that strict lexicality creates discontinuities that standard additive models struggle with. My position is best modeled not as infinite weight, but as a discontinuous weighting function where the marginal disutility of suffering spikes non-linearly at a specific severity point. Regarding the spectrum: I deny that mild discomfort aggregates linearly to outweigh severe pain. There is a qualitative break in moral significance, not just a quantitative one. However, I am not committed to the claim that *no* amount of mild suffering matters. I argue for a 'lexically weighted prioritarianism' where the exchange rate becomes prohibitive, not infinite. This avoids the fanatical conclusion (destroying the world for a headache) while preserving the intuition that torture cannot be 'bought off' by sufficient aggregate pleasure."

  **Soft Spot:**
  You are violating the Continuity Axiom of expected utility theory. Economists will view this as irrational preference ordering. You are asserting a moral discontinuity that their models treat as a modeling error.

  ### 2. The Threshold Arbitrariness Objection
  **The Objection:** "You posit a severity threshold where moral weight shifts. But suffering is a continuum. Any specific cutoff point (e.g., 'intense chronic pain' vs. 'mild discomfort') appears arbitrary. If the moral structure of the universe changes based on a millimeter shift in neural firing rates, your view suffers from a Sorites paradox. Why should we accept a discontinuous social welfare function when the underlying phenomenology is continuous?"

  **Two-Minute Reply:**
  "This is a valid concern regarding precision, but it confuses epistemic vagueness with ontological continuity. Legal and moral systems routinely draw bright lines across continuous phenomena (e.g., age of consent, intoxication thresholds) because decision procedures require them. My claim is that there are phenomenological 'phase shifts' in suffering—points where coping mechanisms fail and the experience becomes all-consuming. While the exact neural correlate might be fuzzy, the moral relevance of that phase shift is not. We can treat the threshold as a range rather than a point to mitigate arbitrariness, but the structural priority remains."

  **Soft Spot:**
  "Phase shifts" are psychologically plausible but axiologically weak. If you admit it's a range, you reintroduce the aggregation problem within the range.

  ### 3. Violation of Additive Separability
  **The Objection:** "Standard welfare economics relies on additive separability: $W = \sum w_i u_i$. Your view makes the weight of a utility unit dependent on the level of utility itself (or the presence of other utility units). This undermines interpersonal comparisons and makes cost-benefit analysis impossible. If weights aren't fixed, how can we compute policy outcomes?"

  **Two-Minute Reply:**
  "I concede that my view complicates standard cost-benefit analysis, but I argue that additive separability is a modeling convenience, not a moral truth. If the moral badness of pain is context-dependent (i.e., worse when severe), then a separable function is descriptively inaccurate. We can still compute policy outcomes using non-separable functions or constrained optimization where suffering reduction is a constraint rather than a variable in the objective function. We sacrifice mathematical elegance for moral accuracy."

  **Soft Spot:**
  Economists hate constraints that aren't prices. You are effectively telling them their primary tool is morally blind. They may dismiss this as "not economics."

  ### 4. Interpersonal Calibration and Measurement
  **The Objection:** "To apply your severity threshold, you need interpersonal comparisons of suffering intensity. Given the variability in pain tolerance and reporting, how do you calibrate the threshold across different agents? Without a common metric, your threshold is operationally empty."

  **Two-Minute Reply:**
  "This is a measurement problem, not a theoretical one. We face similar issues in classical utilitarianism regarding utility comparison. We rely on behavioral proxies, neurological data, and self-reporting to establish rough equivalence classes. My view doesn't require perfect cardinal measurement, only ordinal ranking sufficient to identify 'severe' vs. 'mild.' We can use a 'reasonable person' standard for the threshold, similar to legal standards of harm."

  **Soft Spot:**
  If they press on the *cardinality* required for trade-offs, you're stuck. You need cardinal data to say "this much happiness outweighs that much pain," but you're denying the common scale.

  ### 5. The Digital Minds Objection (Specific Attendee)
  **The Objection:** "You mention a severity threshold. Does this apply to artificial systems or simulations? If I run a trillion simulations of agents experiencing mild frustration, does that trigger your aggregation problem? If your threshold is based on biological markers, are you speciesist? If it's functional, how do you measure severity in code?"

  **Two-Minute Reply:**
  "My view is substrate-neutral; it applies to any system capable of phenomenal suffering. The threshold is defined by the functional architecture of the experience—specifically, the capacity for the experience to dominate the system's goal hierarchy. For digital minds, this translates to whether the 'pain' signal overrides other optimization goals. The aggregation risk remains, which is why I advocate for extreme caution in creating sentient simulations. The threshold isn't biological; it's phenomenological."

  **Soft Spot:**
  We have zero evidence on how to measure "phenomenal dominance" in code. This opens you to charges of speculation.

  ### 6. The Psychological Debunking Objection (Asymmetry)
  **The Objection:** "You argue the procreation asymmetry reflects deep moral structure. But this looks exactly like loss aversion and status quo bias projected onto ethics. We weigh harms more heavily than gains because of evolutionary heuristics, not because the universe is asymmetric. Why treat a cognitive bias as an axiomatic truth?"

  **Two-Minute Reply:**
  "While loss aversion explains *behavior*, it doesn't explain the *normative intuition* that persists upon reflection. Even when we correct for bias, the intuition remains: we owe it to a potential child not to suffer, but we do not owe it to them to exist. If this were merely bias, we would expect it to vanish under idealized reflection, as many biases do. Instead, it aligns with the non-identity problem and the intuition that existence is not a benefit in itself. I argue the bias explanation is insufficient to debunk the normative claim."

  **Soft Spot:**
  Evolutionary debunking arguments are hard to defeat without begging the question. You're asserting intuition trumps genealogy.

  ### 7. The Action-Guidance Objection
  **The Objection:** "You state this is a theory of moral weight, not a decision procedure. But if it doesn't guide action differently than standard prioritarianism in real-world scenarios, what work is it doing? If it *does* guide action differently, how do agents apply it without the decision procedure you disavow?"

  **Two-Minute Reply:**
  "It guides action by changing the *constraints* on policy, not just the optimization target. For example, in clinical trials or development economics, a standard view might accept high risk of severe harm for high aggregate gain. My view vetoes that trade-off. It functions as a side-constraint in Rawlsian terms. It tells policymakers which variables are 'off the table' for aggregation, which is a distinct action-guiding role even without a full algorithmic procedure."

  **Soft Spot:**
  If they ask for a specific example where your view yields a different result than a steep prioritarian view, you might struggle to differentiate them practically.

  ### 8. The "Hope Nobody Asks" Objection: The Continuity Axiom & Rational Choice
  **The Objection:** "Your view violates the Continuity Axiom of von Neumann-Morgenstern expected utility theory. You prefer a world with severe suffering to a probabilistic mix of worlds with mild suffering, no matter the probabilities. This makes you susceptible to a 'money pump' argument. Are you prepared to claim that rational agents *should* violate the Continuity Axiom, or is your theory incompatible with standard rational choice?"

  **Two-Minute Reply:**
  *(See Concession Strategy Below)*

  ---

  ### PRE-EMPTIVE CONCESSION STRATEGY
  **The Objection:** #8 (Continuity Axiom/Rational Choice).
  **Why:** This is the most technical and damaging objection from the economists in the room. If you try to defend continuity, you lose the lexical priority. If you deny continuity, you look irrational by their standards.
  **The Move:** Concede up front in your opening or early Q&A that your view **violates the Continuity Axiom**.
  **Script:** "I want to be clear at the outset: my position entails a violation of the Continuity Axiom in standard rational choice theory. I argue that this is a feature, not a bug. Moral reality contains discontinuities that smooth utility functions cannot capture. I am proposing a modification to the axioms of social choice, not a workaround within them."
  **Benefit:** This disarms the objection. They can't trap you into admitting a contradiction you've already owned. It frames you as revising the model, not breaking it by accident.

  ---

  ### CRITICAL FOCUS JUDGMENT
  **The Single Most Dangerous Objection:** **#1 (The Aggregation/Spectrum Objection).**

  **Why:**
  If you cannot explain how you avoid the "Reverse Repugnant Conclusion" (where trillions of mild pains outweigh one torture) without collapsing into fanatical Negative Utilitarianism (where *any* pain outweighs *any* pleasure), your core mechanism fails. The economists will smell a "just-so story" where you adjust the weights until the output matches your intuitions.

  **Prep Strategy:**
  Spend 60% of your remaining prep time here.
  1.  **Refine the Terminology:** Stop using "lexical" if you mean "very high weight." Use "discontinuous weighting function."
  2.  **The "Phase Shift" Argument:** Develop a robust defense of why severe suffering is *qualitatively* different, not just quantitatively worse. Use neurological or phenomenological evidence if possible (e.g., pain that prevents all other cognitive function vs. pain that is background noise).
  3.  **The Trade-Off Limit:** Be prepared to define the *limit* of the trade-off. "A sufficiently enormous gain in happiness" is vague. Give a hypothetical bound, even if rough. (e.g., "I would not trade one instance of torture for any amount of mild pleasure, but I would trade one instance of mild pain for significant aggregate happiness.")

  **Final Note:**
  The room respects technical precision over moral passion. Do not appeal to compassion; appeal to *structural accuracy* in the social welfare function. Frame your view as a correction to a model error (treating all utility as commensurable), not a plea for mercy.
