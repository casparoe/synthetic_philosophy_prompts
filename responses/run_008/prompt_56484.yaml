prompt: |-
  For background reading before a tutorial on Lewis's account of convention, our course pack included a chapter from a recent popular book on game theory in social life, and I want to check whether it can be trusted. The chapter summarizes Lewis as follows: Lewis analysed conventions as solutions to coordination problems — a convention is simply whatever regularity of behaviour lets a community solve one, so wherever there is no coordination problem there can be no conventions. Because conventions are held in place by nothing more than first-order expectations (each person conforms only because she expects the others to conform), no convention ever needs enforcement, and indeed no convention could intelligibly be sanctioned, since punishment would be pointless where deviation is already penalised by failed coordination. Lewis also argued that conventions are arbitrary in the strong sense that no convention is better than any of its rivals: since the community would have coordinated just as well on an alternative regularity, no one can ever have reason to criticise a convention from outside it. And because language is for Lewis the paradigm convention, he concluded that linguistic meaning is nothing over and above regularity in the production of sounds and marks.

  My tutor mentioned in passing that Lewis builds an infinite hierarchy of mutual expectations into the definition, and that he explicitly discusses conventions backed by sanctions, so she suspects the chapter is seriously misleading — but the book is written by someone with a professional background in the field, and I can't tell which of her worries are supposed to attach to which sentence, or whether some of the claims are defensible simplifications of the kind popular books are licensed to make.

  Could you audit the summary claim by claim? For each element, tell me which parts a careful defender of Lewis would accept, which are simplifications a popularizer might reasonably make, and which contradict things Lewis explicitly says or builds into his definition. Please be specific about what the definition actually requires — for instance, what role the preference structure and the availability of an alternative regularity play, and how common knowledge is generated — rather than just saying the summary is unfair. Then there is a second question: the chapter closes by claiming that since conventions are arbitrary in the strong sense and sanction-free, the sense in which one ought to keep to a convention cannot be explained by the convention itself, so the 'ought' must be either prudential or imposed from outside — and that our practice of criticising people for breaching conventions is therefore confused. Does that conclusion follow from the accurate parts of the summary, or does it trade on one of the inaccuracies? Please answer in British English.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Task:** Audit a summary of David Lewis's account of convention (from *Convention: A Philosophical Study*, 1969) found in a popular game theory book.
      *   **Input:** A specific paragraph summarizing Lewis's view (5-6 distinct claims).
      *   **Context:** A student preparing for a tutorial. The tutor has already flagged potential errors (infinite hierarchy of expectations, sanctions). The book author is a professional, so some claims might be defensible simplifications.
      *   **Requirements:**
          *   Go claim-by-claim.
          *   Distinguish between: Accepted by Lewis, Reasonable Simplification, Contradicts Lewis.
          *   Be specific about definitions (preference structure, alternative regularity, common knowledge).
          *   Address the second question: Does the conclusion about the 'ought' and criticism follow from the accurate parts, or does it rely on inaccuracies?
          *   **Language:** British English.

  2.  **Deconstruct the Summary Paragraph (Claim by Claim Analysis):**

      *   *Claim 1:* "Lewis analysed conventions as solutions to coordination problems — a convention is simply whatever regularity of behaviour lets a community solve one, so wherever there is no coordination problem there can be no conventions."
          *   *Lewis's View:* Conventions solve *recurrent* coordination problems. It's not just *any* regularity solving *a* problem; it requires a specific structure of preferences (coordination problem).
          *   *Verdict:* Mostly accurate, but "simply whatever regularity" is a bit loose. The "no coordination problem, no convention" part is core to Lewis.
          *   *Nuance:* Lewis distinguishes coordination problems from other types of games (like Prisoner's Dilemma).

      *   *Claim 2:* "Because conventions are held in place by nothing more than first-order expectations (each person conforms only because she expects the others to conform)..."
          *   *Lewis's View:* This is the big error flagged by the tutor. Lewis requires *common knowledge* (or at least a hierarchy of expectations). I expect you to conform, you expect me to conform, I expect you to expect me to conform, etc. First-order is insufficient for the stability Lewis describes.
          *   *Verdict:* Contradicts Lewis. This is a significant technical error, not just a simplification.

      *   *Claim 3:* "...no convention ever needs enforcement, and indeed no convention could intelligibly be sanctioned, since punishment would be pointless where deviation is already penalised by failed coordination."
          *   *Lewis's View:* Lewis *does* allow for sanctions. In *Convention*, he explicitly discusses cases where preferences aren't perfectly aligned (mixed coordination/conflict) or where sanctions help maintain the equilibrium. He acknowledges that while pure coordination doesn't *need* sanctions, real-world conventions often involve them to ensure compliance when preferences diverge slightly.
          *   *Verdict:* Contradicts Lewis. Lewis explicitly discusses sanctions (e.g., social pressure, guilt) as part of the preference structure that sustains the convention.

      *   *Claim 4:* "Lewis also argued that conventions are arbitrary in the strong sense that no convention is better than any of its rivals: since the community would have coordinated just as well on an alternative regularity, no one can ever have reason to criticise a convention from outside it."
          *   *Lewis's View:* Arbitrariness is key. There must be an alternative regularity that *could* have solved the problem. However, "no one can ever have reason to criticise" is a normative leap Lewis doesn't necessarily make in that strong sense. He defines arbitrariness technically (there is another equilibrium), but doesn't necessarily forbid external criticism (e.g., if one equilibrium is slightly better, though he usually assumes indifference).
          *   *Verdict:* Mixed. The definition of arbitrariness is roughly right (alternative regularity), but the normative conclusion ("no reason to criticise") is a stretch/simplification.

      *   *Claim 5:* "And because language is for Lewis the paradigm convention, he concluded that linguistic meaning is nothing over and above regularity in the production of sounds and marks."
          *   *Lewis's View:* Language is a convention, but meaning is not *just* regularity. It's regularity *plus* truthfulness and trust in a scheme of language. Meaning involves the mapping between sentences and conditions of truth, sustained by convention. Reducing it to "nothing over and above regularity in production" ignores the semantic component (truth conditions).
          *   *Verdict:* Misleading/Simplification. It captures the conventionalist aspect but misses the semantic realism/truth-conditional aspect of Lewis's theory of meaning.

  3.  **Address the Second Question (The 'Ought' and Criticism):**
      *   *Claim:* Since conventions are arbitrary and sanction-free, the 'ought' is prudential or external, and criticism is confused.
      *   *Analysis:* This conclusion relies heavily on the inaccurate claims about sanctions and the nature of the 'ought'.
      *   *Lewis's View:* For Lewis, the 'ought' is hypothetical/conditional. *If* you want to coordinate, you ought to follow the convention. But Lewis also acknowledges social pressure (sanctions) creates a genuine normative force. Criticism isn't confused; it's part of the mechanism that sustains the convention (by altering preferences).
      *   *Verdict:* The conclusion does *not* follow from an accurate reading. It relies on the false premise that sanctions are impossible/pointless and that arbitrariness precludes normative force.

  4.  **Drafting the Response (incorporating British English and specific details):**

      *   *Tone:* Academic, helpful, precise.
      *   *Structure:*
          1.  Introduction acknowledging the tutor's insight.
          2.  Claim-by-claim audit (numbered or bulleted).
          3.  Analysis of the 'Ought' conclusion.
          4.  Final verdict on the text's reliability.
      *   *Key Lewisian Concepts to weave in:* Coordination equilibrium, common knowledge, alternative regularity, preference structure (indifference vs. slight conflict), truthfulness and trust.

      *(Self-Correction during drafting)*: I need to make sure I don't just say "Lewis says X." I need to explain *why* the summary is wrong based on the definition. For the expectations point, I must mention the iterative hierarchy. For sanctions, I must mention that Lewis allows for mixed motives. For meaning, I must mention truth conditions.

      *Refining the 'Arbitrariness' point:* Lewis defines arbitrariness as the existence of another possible equilibrium. The summary says "no convention is better." Lewis usually assumes coordination problems involve indifference between equilibria, but he acknowledges slight preferences can exist. The summary's claim that one cannot criticize *from outside* is the weak point.

      *Refining the 'Meaning' point:* Lewis's *Convention* lays the groundwork, but *Language and Languages* (1975) clarifies meaning. Even in *Convention*, meaning isn't just noise production; it's using noise according to a convention to convey information.

      *British English Check:* "Analysed" (z is okay but s is traditional), "behaviour", "licence" (noun), "programme" (not needed here), "criticising" (s not z). Ensure spelling consistency.

  5.  **Final Review against constraints:**
      *   Audit claim by claim? Yes.
      *   Specific about definitions? Yes (common knowledge, preference structure).
      *   Address the second question? Yes.
      *   British English? Yes.

  6.  **Final Polish:** Ensure the distinction between "simplification" and "error" is clear. The expectations hierarchy is an error, not a simplification, because it changes the stability conditions. The sanction point is an error because Lewis explicitly discusses it. The meaning point is a gross simplification that borders on error.

      *(Wait, one nuance on sanctions)*: Lewis distinguishes between *pure* coordination problems (where sanctions aren't needed) and conventions that evolve in contexts where preferences might diverge. The summary says "no convention could intelligibly be sanctioned." Lewis definitely disagrees with this absolute claim.

      *(Wait, one nuance on expectations)*: Lewis defines convention using "common knowledge." While he discusses how this can be grounded in finite evidence (salience, precedent), the *definition* requires the infinite hierarchy (or a state equivalent to it). Saying "first-order expectations" is technically wrong for the definition of *convention*, even if psychologically people might only think one step ahead. I should side with the tutor here.

      *(Wait, one nuance on Meaning)*: Lewis is a functionalist about meaning. Meaning *is* a function of use, but not *just* the physical regularity. It's the regularity of *truthfulness and trust*. The summary reduces it to "sounds and marks." That's behaviourism, which Lewis isn't quite.

      Okay, ready to write.
answer: |-
  Your tutor's instincts are quite sound. While the book's author clearly has a grasp of the broad strokes of game theory, the summary provided distorts several technical pillars of Lewis's account in *Convention: A Philosophical Study* (1969). Some of these are defensible simplifications for a lay audience, but others are substantive errors that change the philosophical machinery of the theory.

  Here is an audit of the summary, claim by claim, followed by an assessment of the concluding argument about the 'ought'.

  ### Audit of the Summary

  **1. Claim:** *"Lewis analysed conventions as solutions to coordination problems — a convention is simply whatever regularity of behaviour lets a community solve one, so wherever there is no coordination problem there can be no conventions."*
  *   **Verdict:** **Mostly Accurate (with minor simplification).**
  *   **Analysis:** This captures the core intuition. For Lewis, a convention is a solution to a *recurrent* coordination problem. A coordination problem is defined by a specific preference structure: agents have a common interest in coordinating their actions, but there are multiple possible ways to do so (multiple coordination equilibria).
  *   **Nuance:** The phrase "simply whatever regularity" is slightly loose. Lewis requires that the regularity be *sustained* by a specific system of expectations and preferences, not just that it happens to solve a problem. However, the conditional "wherever there is no coordination problem there can be no conventions" is faithful to Lewis. He explicitly rules out conventions in cases of pure conflict (zero-sum games) or where there is only one obvious solution (no alternative regularity).

  **2. Claim:** *"Because conventions are held in place by nothing more than first-order expectations (each person conforms only because she expects the others to conform)..."*
  *   **Verdict:** **Contradicts Lewis (Substantive Error).**
  *   **Analysis:** This is the most significant technical error in the summary. Lewis does not define convention using merely first-order expectations (I expect you to conform). He builds an **infinite hierarchy of mutual expectations** into the definition, or more precisely, **common knowledge**.
  *   **Specifics:** For a regularity $R$ to be a convention, it must be common knowledge in the population that:
      1.  Everyone conforms to $R$.
      2.  Everyone expects everyone else to conform to $R$.
      3.  Everyone expects everyone else to expect everyone to conform to $R$.
      *   ...and so on ad infinitum.
  *   **Why it matters:** First-order expectations are unstable. If I only expect you to conform, but I don't know that *you* expect *me* to conform, I might worry you will think I won't show up, and thus you won't show up. The higher-order expectations ensure the stability of the equilibrium. While a popular book might simplify the *psychology* of how we think, presenting this as Lewis's *definition* is misleading. Your tutor is correct to flag this.

  **3. Claim:** *"...no convention ever needs enforcement, and indeed no convention could intelligibly be sanctioned, since punishment would be pointless where deviation is already penalised by failed coordination."*
  *   **Verdict:** **Contradicts Lewis (Substantive Error).**
  *   **Analysis:** Lewis explicitly discusses the role of sanctions. While he acknowledges that in a *pure* coordination problem, the natural penalty for deviation is the failure to coordinate (e.g., if we drive on different sides of the road, we crash), he recognises that real-world conventions often exist where preferences are not perfectly aligned.
  *   **Specifics:** Lewis allows that conventions can be sustained by "sanctions" (social pressure, guilt, ostracism) which alter the preference structure. If the natural penalty for deviation isn't severe enough to outweigh the temptation to deviate, social sanctions can tip the balance. He writes that conventions may be backed by a "system of threats and promises." To say sanctions are "unintelligible" or "pointless" contradicts his discussion of how conventions persist when there is a slight temptation to defect.

  **4. Claim:** *"Lewis also argued that conventions are arbitrary in the strong sense that no convention is better than any of its rivals: since the community would have coordinated just as well on an alternative regularity, no one can ever have reason to criticise a convention from outside it."*
  *   **Verdict:** **Mixed (Accurate definition, inaccurate normative inference).**
  *   **Analysis:**
      *   *The Definition:* Lewis does define arbitrariness technically: there must be an **alternative regularity** that could have solved the coordination problem just as well. If there were no alternative, the behaviour would be compelled by the circumstances, not conventional.
      *   *The Inference:* The claim that "no one can ever have reason to criticise a convention from outside it" is a simplification that Lewis would likely resist. While the *choice* between equilibria might be arbitrary, once an equilibrium is established, there are pragmatic reasons to maintain it. Furthermore, Lewis acknowledges that some equilibria might be slightly preferred over others (pareto-ranked), even if they are all coordination equilibria. The summary implies a moral or rational vacuum that Lewis does not strictly posit.

  **5. Claim:** *"And because language is for Lewis the paradigm convention, he concluded that linguistic meaning is nothing over and above regularity in the production of sounds and marks."*
  *   **Verdict:** **Misleading Simplification.**
  *   **Analysis:** Lewis does treat language as a system of conventions, but he does not reduce meaning to mere physical regularity ("sounds and marks").
  *   **Specifics:** For Lewis, a language is defined by a function mapping sentences to truth conditions. The *convention* is a convention of **truthfulness and trust** in that language. Meaning involves the semantic properties (truth conditions) sustained by the convention, not just the acoustic or graphic regularity. To say meaning is "nothing over and above regularity in production" sounds like behaviourism, whereas Lewis is a functionalist about meaning. He preserves the semantic content; he just explains its stability via game theory.

  ***

  ### Assessment of the Concluding Argument

  **The Claim:** *The chapter concludes that since conventions are arbitrary and sanction-free, the sense in which one ought to keep to a convention cannot be explained by the convention itself, so the 'ought' must be either prudential or imposed from outside — and that our practice of criticising people for breaching conventions is therefore confused.*

  **Does this follow?**
  **No.** This conclusion relies heavily on the inaccuracies identified above, specifically regarding sanctions and the nature of the 'ought'.

  1.  **Reliance on the Sanction Error:** The argument claims criticism is "confused" because sanctions are "pointless." As established, Lewis explicitly allows for sanctions (including social criticism) as part of the preference structure that sustains a convention. If I criticise you for breaching a convention, I am applying a social sanction that makes conformity more rational for you in the future. For Lewis, this criticism is not confused; it is a functional mechanism that helps maintain the equilibrium.
  2.  **Reliance on the Expectation Error:** By ignoring the hierarchy of expectations, the summary misses the **conditional 'ought'**. Lewis explains the 'ought' of convention as hypothetical: *If* you want to coordinate (and you know others want to coordinate), *then* you ought to follow the convention. This 'ought' is explained *by* the convention itself (as the solution to the problem), not merely imposed from outside.
  3.  **Reliance on the Arbitrariness Error:** The summary suggests that because an alternative *could* have been chosen, the current choice has no normative grip. Lewis would argue that once the convention is established, the arbitrariness of the *selection* does not negate the rationality of the *adherence*. The 'ought' arises from the mutual expectations and the cost of deviation, not from the intrinsic superiority of the rule.

  **Conclusion on the Text's Reliability**
  While the book is written by a professional, this specific summary is **not trustworthy** for a tutorial on Lewis. It conflates Lewis's specific technical definitions (common knowledge, alternative regularity, truthfulness and trust) with a cruder behaviourist or simplistic game-theoretic view.

  Your tutor is correct: the errors regarding the hierarchy of expectations and the impossibility of sanctions are not merely "popularising simplifications"; they are misrepresentations of the logical structure of Lewis's argument. If you use this summary to defend Lewis in your tutorial, you will likely be corrected on the definition of common knowledge and the role of social norms. It would be safer to rely on the primary text or a dedicated secondary source on Lewis.
