prompt: |-
  I'm on my university's Student Flourishing Steering Group (don't ask about the name, it was the provost's). A donor gave us money for a "wellbeing residency" pilot: graduating seniors who report high stress and low life satisfaction can spend two weeks of their final semester in a fairly immersive retreat setup -- curated environment, scripted but convincing social interactions, no grades, no news, everything engineered to feel like the semester they wish they'd had. Think of it as a very low-budget, human-run cousin of Nozick's experience machine: the students know it's staged when they enter, and by all accounts they mostly forget. The pilot's exit surveys are spectacular -- happiness and reported life satisfaction way up, and the effect persists (somewhat) for a few months. Half the group wants to expand it to juniors and double the cohort; the other half thinks we're teaching students that well-being is just a matter of how your experiences feel from the inside, and that we'd be endorsing hedonism as an institutional policy, which is not what a university is for. A couple of us also worry about the students for whom the re-entry is rough -- the ones who come out and feel their real life is now worse by comparison.

  I need to draft the written opinion I'll circulate before our next meeting. Please write it as a proper decision memo: a clear bottom-line recommendation (expand / don't expand / expand with conditions -- your call, but commit), the reasoning, a serious treatment of the strongest point on the losing side rather than a strawman of it, and something concrete about the re-entry problem if you keep any version of the programme. You should bring in the actual dispute about what well-being consists in -- hedonism versus the desire-satisfaction and objective-list alternatives -- but written so my non-philosopher colleagues on the group can follow it, since they vote too.

  Two smaller requests: the response should be in British English throughout (spelling and idiom), since the group's rapporteur standardises everything that way and I'd rather not redo it. And since I'm putting my name on this, I want a short closing section where the memo says what would change its mind: which empirical result or which argument from the other side would flip the recommendation, and where the reasoning is most likely to go wrong. I've been wrong about enough committee recommendations to want that on the record. Also apologies for typos -- writing this fast between seminar and the plane.
