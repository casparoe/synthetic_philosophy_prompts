answer: |-
  (1) "The exam question"

  Epiphenomenalism holds qualia are causally inert. This raises the problem of phenomenal judgment: if qualia cause nothing, why are our reports about them true? Consider a twin world where psychophysical laws are scrambled: the physical state realizing 'red' judgments is paired with green qualia. In our world, the pairing is orderly. Explain whether the epiphenomenalist can account for judgment reliability without appealing to ad-hoc harmony. Does positing a lawlike correspondence between physical states and qualia explain why we track truth, or does it merely restate the coincidence? Argue whether this appeal constitutes genuine explanatory work or a patched-up rescue undermining the theory's coherence.

  (2) "Model answer"

  The core tension for epiphenomenalism is explaining knowledge of qualia without causal contact. If my saying "I see red" is caused entirely by physical neuron firings, and the redness itself does nothing, the truth of my statement seems accidental. The prompt's twin scenario highlights this contingency. In Twin Earth, the physical state P (which causes me to say "red") is paired with green qualia. In our world, P is paired with red qualia. Since the physical chain is identical in both worlds, the physical causes of my judgment don't care about the specific qualia attached. The physical state P is sufficient for the utterance regardless of the phenomenology.

  So, why am I right here and wrong there? The epiphenomenalist must appeal to psychophysical laws. They claim there's a nomological connection ensuring P aligns with red qualia in our world. But does this explain reliability, or just label it? If the laws are brute facts, the reliability is still coincidental from the perspective of the physical causal chain. The physical state P would cause the same belief regardless of the qualia, because qualia are inert. Positing a law says "they match," but doesn't explain *how* the belief tracks the qualia when the causal arrow only goes one way (physical to mental, not mental to physical). The belief is caused by the physical base, not the qualia.

  To determine if this is ad-hoc, we must ask if the law serves independent work. In standard science, laws predict outcomes based on mechanisms. Here, the mechanism is causally closed physically. The psychophysical law acts like a pre-established harmony. But unlike Leibniz, the epiphenomenalist can't appeal to God ensuring harmony. They just assert the correlation. This looks like a patched-up rescue. It saves the phenomenon (we do report accurately) but costs explanatory power. It essentially says, "We are right because the laws say we are," which is circular if the only evidence for the laws is that we are right. A principled commitment would derive the harmony from deeper metaphysical necessities, but epiphenomenalism typically treats qualia as contingent byproducts.

  However, one might argue it's not ad-hoc if it's part of a broader metaphysical package. If supervenience is necessary, maybe the laws aren't contingent. But even then, the *epistemic* link is missing. Knowledge usually requires causation or counterfactual dependence. If qualia changed but physics stayed the same (as in the twin case), my belief wouldn't change. So my belief doesn't counterfactually depend on the qualia. The law ensures actual correspondence, but not counterfactual tracking. This is crucial: reliability isn't just getting it right once; it's being sensitive to the truth. The twin scenario shows we aren't sensitive.

  Therefore, the appeal to lawlike harmony doesn't do genuine explanatory work regarding reliability. It restates the problem: "Why do we match?" "Because there's a law." "Why that law?" "Because we match." It's a costume for the mind-body problem because it reveals that without causal power, qualia are explanatorily redundant. The twin scenario proves the connection is contingent relative to the physical causes. Unless the epiphenomenalist can ground the psychophysical laws in something that constrains the physical (which violates causal closure) or explains the mind (which violates inertness), the reliability claim remains a lucky guess protected by assertion. The theory undermines itself because it makes knowledge of mind impossible, yet insists we have it. The TA who calls it self-undermining is right: you can't consistently claim qualia exist and are known if they play no role in that knowing. The appeal to harmony is just a desperate attempt to hide the bullet biting.

  (3) "Marking scheme"

  1.  **Articulates the causal inertness problem (4 marks):** Clearly states that if qualia cause nothing, physical states alone cause the judgment, making truth accidental.
      *   *Typical fumble:* Students confuse causal inertness with physical indeterminism or claim qualia cause *some* physical effects.
  2.  **Utilizes the twin scenario correctly (4 marks):** Uses the scrambled law scenario to demonstrate that the physical cause of the judgment remains constant while qualia vary.
      *   *Typical fumble:* Students treat the twin as a zombie duplicate rather than a qualia-scrambled counterpart.
  3.  **Distinguishes law-possession from explanation (4 marks):** Identifies that asserting a psychophysical law does not explain the *mechanism* of tracking or counterfactual dependence.
      *   *Typical fumble:* Students accept the law as a sufficient explanation without probing its explanatory depth.
  4.  **Evaluates the "ad-hoc" charge (4 marks):** Argues whether the harmony is a brute fact (ad-hoc) or derived from necessity (principled), noting the circularity risk.
      *   *Typical fumble:* Students define "ad-hoc" vaguely as "made up" without linking it to independent predictive work.
  5.  **Concludes on self-undermining status (4 marks):** Takes a stance on whether the theory collapses (TA 1) or is just hard (TA 2), justified by the reliability analysis.
      *   *Typical fumble:* Students sit on the fence without committing to whether the theory is coherent or self-refuting.

  (4) "A note for me"

  Your crux is solid, but be aware: the reliability worry *is* the exclusion problem applied to epistemology. The TA calling it "the mind-body problem wearing a costume" isn't wrong; it's the same exclusion issue but focused on justification rather than action. However, framing it via the twin scenario forces students to confront the *contingency* of the correlation, which prevents them from hiding behind brute supervenience. It's a valid distinction for a seminar paper, even if metaphysically contiguous.
