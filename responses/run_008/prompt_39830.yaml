      *   *Application to Vision:* The eye receives light/color (pressure in hand). The brain learns to interpret this as distance/shape (obstacle at distance).
      *   *Implication for Molyneux:* Since the connection between visual signs (light patterns) and tactile objects (cube/sphere) is arbitrary/learned, the newly sighted person cannot make the connection immediately.

