      *   **Gaozi:** Nature is neutral (like water flowing east or west, or willow wood). It's just raw material. Morality is imposed or shaped, but the material itself isn't *inherently* good or bad.
      *   **Daoist (Zhuangzi/Laozi):** "Nature" is the spontaneous state. Moral cultivation (Confucian rituals) actually *cuts* and *damages* the true nature. (Requested as an option).

