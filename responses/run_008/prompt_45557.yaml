answer: |-
  The air in the archive tasted of ozone and old paper, the specific scent of magnetic tape degrading in slow motion. Elias kicked a box of reel-to-reels, sending a plume of dust into the beam of his flashlight.

  "Temperature logs, 1984," he said, picking up a cassette labeled *Station 4*. "Next week, this room gets filled with concrete. No one comes in. Ever."

  Mara adjusted her hardhat, running a gloved finger over the plastic casing. "Then it's not a truth, Elias. It's just noise."

  "It's a fact about the world," Elias countered, his voice echoing slightly in the high-ceilinged room. "The temperature was 22 degrees at noon on July 12th. That proposition is true right now. But once that door seals, it becomes a truth that no human being will ever know. So much for your slogan: 'Every truth is knowable.'"

  Mara didn't flinch. She was used to this. "You're treating knowability like it's a prophecy about future librarians. It's not. It's about the nature of meaning."

  "It's about reality," Elias said. He walked deeper into the rows of shelving, the metal groaning under the weight of dead data. "Look, I know you've read the literature. You know the trick. But let's walk through it, since we're surrounded by the evidence. Assume your principle: Every truth is knowable. Now, look at this tape. Assume it contains a true fact $p$ that nobody currently knows. That's easy to assume; there are terabytes here nobody has parsed."

  "Okay," Mara said, stepping over a coil of cable. "I grant there are unknown truths. I'm not an idealist who thinks we know everything."

  "Right. So we have: $p$ is true, and nobody knows $p$." Elias stopped and turned to her. "Now, consider that whole statement as a single proposition. Call it $K$. '$p$ is true and nobody knows $p$.' If your principle holds, $K$ must be knowable. Someone could, in principle, know $K$."

  "Sure," Mara said. "In principle."

  "But to know $K$," Elias pressed, holding up a finger, "you have to know both parts of the conjunction. You have to know that $p$ is true, and you have to know that nobody knows $p$."

  "Standard epistemic logic," Mara nodded. "Distribution of knowledge over conjunction."

  "Exactly. But here's the snap," Elias said, tapping the tape against his palm. "If you know that $p$ is true, then somebody knows $p$. But the second part of $K$ says *nobody* knows $p$. You can't know $K$ without making $K$ false. So $K$ is unknowable. But $K$ is true—assuming there are unknown truths. So there are true propositions that are unknowable. Your principle dies."

  Mara sighed, the sound mixing with the hum of the ventilation system that was scheduled to be cut tomorrow. "You're describing Fitch. I know it. The derivation is valid. If you accept classical logic and the fact that there are unknown truths, the Knowability Principle entails that all truths are known. Which is absurd."

  "So you concede?"

  "No, I concede that the naive formulation is unsustainable," Mara corrected. "But you're acting like this is a gotcha that proves realism. It's not. It just shows that 'truth' and 'knowability' have a friction point. The question is where you cut the knot."

  She walked over to a console desk buried under stacks of printouts. "Escape route one: We restrict the principle. We say every truth is knowable *except* for truths that assert their own unknowability. So $K$ isn't a candidate for knowledge. It's a logical blind spot."

  Elias leaned against the desk, crossing his arms. "That feels like patching a leak with gum. If you have to carve out a specific class of truths that are exempt from your semantic principle, doesn't that admit your principle isn't about Truth with a capital T? It's about 'Epistemically Safe Truths.'"

  "It's about the bounds of sense," Mara said, brushing dust off a keyboard. "If a proposition cannot be known without contradicting itself, it doesn't function as a truth-claim in the way we use language. It's a paradoxical object."

  "But does that do the work you need?" Elias pressed. "You wanted knowability to ground meaning. To say that to understand a statement is to grasp its verification conditions. But if you exclude all the Moorean sentences—all the 'true but unknown' stuff—aren't you left with a principle that only applies to truths that are already friendly to verification? It sounds like you're protecting the view rather than stating it."

  "Maybe," Mara admitted. "But your view has costs too. You want to say this tape contains a truth that is verification-transcendent. But if it's sealed in concrete, and the tape degrades, and the station is gone... what work is that truth doing? It makes no difference to any practice, any inference, any experience."

  "It makes a difference to reality," Elias said. "The world is how it is, regardless of whether we're there to see it."

  "Is it?" Mara hit the power button on the console. Surprisingly, the CRT monitor flickered to life, casting a green glow on their faces. A drive light blinked. "There's a tape in the drive. Station 4. Maybe the one you're holding."

  Elias looked at the cassette in his hand, then at the drive. "If I put this in, and we read it, we know it."

  "If you don't," Mara said, her face illuminated by the phosphor, "does the truth vanish? Or does it just become inaccessible?"

  "If I don't," Elias said, "it remains true. That's the point."

  "But if knowability is indexed to time," Mara said, her eyes on the blinking cursor, "then we can shift the principle. Escape route two. We say: 'For any truth $p$, there is a time $t$ at which $p$ is known.' Or better: 'It is possible that $p$ is known by some agent in some possible situation.'"

  She turned to him. "The sealing of this archive doesn't create unknowability. It just closes off a practical possibility that was always narrower than 'in principle.' The truth was knowable last week. It was knowable in 1984. The fact that the door locks on Friday doesn't change the modal status of the proposition, only its actualization."

  Elias frowned, looking from the screen to the dark rows of shelves. "So truth shrinks? As the building seals, as agents die, as entropy wins, the set of knowable truths contracts? That makes truth dependent on the HVAC status."

  "Not dependent on HVAC," Mara said softly. "Dependent on the possibility of contact. If there is no possible path from the fact to a mind, then calling it a 'truth' is just a metaphor. It's a placeholder for 'something happened.'"

  "But you're smuggling in actuality," Elias argued. "You're saying because we *could* have known it, it counts as knowable. But if we don't, and no one else does, then in the actual world, it's unknowable. You're retreating to possible worlds to save a principle about actual meaning."

  "Isn't that what you do?" Mara challenged. "You retreat to a 'world-in-itself' that we can't touch. I'm just saying the bridge has to exist somewhere. If the bridge is burned, the destination doesn't count."

  Elias picked up the tape again. He walked over to the drive slot. He hovered the cassette over the opening. "If I put this in, I verify it. I make it known. Does that make it true?"

  "No," Mara said. "It makes it asserted."

  "If I don't," Elias said, "and I walk out, and they pour the concrete... you're saying the proposition 'The temperature was 22 degrees' loses its truth-value?"

  "I'm saying it loses its status as a truth-claim we can engage with," Mara said. "It becomes noise. Like the sound of a tree falling with no one to hear it, except worse. Because we can't even agree on the physics of the sound if we can't measure it."

  Elias held the tape there for a long moment. The drive whirred, waiting. The silence of the archive pressed in on them, heavy and absolute. He lowered his hand.

  "I'm not going to play it," he said.

  "Why?"

  "Because if I do, I prove you right," Elias said, a faint smile touching his lips. "I make it known. I collapse the distinction. And I want to believe there's something here that exists independently of my inspection. I want this data to matter even if I don't see it."

  "And if you don't?" Mara asked. "Then you have a truth that makes no difference. It's ontologically thin, Elias. It's a ghost. You're defending the right of ghosts to exist."

  "Maybe," Elias said. He slipped the tape into his pocket instead of the drive. "But it's my ghost. And I think your patched principle... restricting the knowability clause, indexing it to times... it feels like you're building a fortress around a city that's already empty. You're protecting the view that meaning is human-scale, but the world isn't always human-scale."

  Mara looked at the blinking cursor, then hit the power button. The screen collapsed into a white dot and vanished. The room returned to the dim emergency lighting.

  "Maybe," she said, pulling her hardhat lower. "Maybe the principle is just a regulative ideal. A way of saying we shouldn't posit truths that are essentially beyond reach. But standing here, watching the door lock... I concede it feels like damage control. Like I'm defining away the mystery because I can't solve it."

  "And I concede," Elias said, walking toward the exit, his boots crunching on the grit, "that if a truth can never make a difference to anyone, ever... I'm not sure what work I'm asking it to do. Except stand there. Like a monument."

  They reached the airlock door. Elias pressed the button to cycle the lock. The hydraulics hissed, a final breath before the seal.

  "So," Mara said, waiting for the inner door to open. "Unknown truths exist?"

  "Probably," Elias said. "But you're right. They're lonely."

  "And knowability?"

  "Still broken," Mara said. "But maybe less so than reality."

  The outer door slid open, revealing the bright, noisy construction yard outside. They stepped through, leaving the silence behind them, neither convinced, but both carrying the weight of the sealed room a little differently than before.
