          *   However, saying "same number of objects = same world" is too strong. It ignores the specific relational properties. Two worlds could have 5 objects but different relations.
          *   If the book means "Isomorphic structures are identical," that's a mathematical claim, but applying it to *possible worlds* dissolves modality in a way many philosophers reject.
          *   This sounds like the book is conflating Structural Realism with a specific, radical form of Ontological Structuralism or even Mathematical Universe Hypothesis.
      *   **Conclusion/Summary:**
