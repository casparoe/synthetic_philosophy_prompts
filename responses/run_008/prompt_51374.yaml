prompt: |-
  I help run a small student group that raises money for charity, and every year we have the same argument about where to send it. One faction wants to just follow the big online charity evaluators — the kind that rank organizations by roughly "cost per life saved": they only count interventions where a randomized trial has actually measured deaths averted, divide money spent by lives saved, and sometimes weight lives saved by the age of the person saved. The other faction says the whole ranking is rigged from the start: anything whose effects show up slowly or diffusely — advocacy for policy change, labor organizing, strengthening institutions in a poor country — can never win, not because it does less good but because nobody can run a clean trial on it. So the ranking quietly becomes "best among the measurable," and the measurables happen to be bednets and vitamin supplements and deworming pills.

  I don't want you to referee which faction is right about where the money should go. What I keep wondering about is what the practice itself presupposes. What view of "doing good" does a ranking like that have to assume for it to make sense — does it strictly presuppose a welfarist consequentialism where the good is just measured health and lives, or is it actually compatible with several moral theories (deontology with a duty of rescue, even some virtue-ethical view about what a donor should attend to) and just fits some of them more comfortably? And separately: does the practice presuppose that unmeasurable effects are worth less, or only that we should act under uncertainty in some principled way? If it's the latter, is there a defensible middle path — like assigning credences to unmeasured-but-plausibly-large effects — that wouldn't just collapse the whole enterprise, or does any attempt to factor in systemic change defeat the purpose of having a clean ranking in the first place?

  There's also a tension I can't decide whether to be bothered by. The same people who build these rankings will often say, in the same breath, that systemic change probably dwarfs everything else in the long run. Is that flat-out incoherence, or is there some coherent epistemic stance under which you can sincerely believe the biggest effects are elsewhere and still insist on ranking only by what you can measure — some principle about demanding evidence before acting, or about not letting enthusiasm masquerade as knowledge? I'd honestly take either answer, I just want to know whether the position is internally consistent or whether one of the two claims has to go.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the User's Query:**

      *   **Context:** The user runs a student charity group. There's an annual conflict between two factions:
          *   Faction A: Follows big online charity evaluators (e.g., GiveWell style). Focus on cost-per-life-saved, RCTs, measurable interventions (bednets, deworming).
          *   Faction B: Critiques the ranking methodology. Argues it biases against slow/diffuse effects (advocacy, policy, institution building) because they can't be RCT'd. Calls it "best among the measurable."
      *   **Task:** Do *not* referee which faction is right about where money should go. Instead, analyze the *philosophical and epistemic presuppositions* of the ranking practice itself.
      *   **Key Questions:**
          1.  What view of "doing good" does the ranking assume? (Strict welfarist consequentialism vs. compatible with deontology/virtue ethics?)
          2.  Does the practice presuppose unmeasurable effects are worth less, or just that we must act under uncertainty principledly?
          3.  Is there a defensible middle path (credences for unmeasured effects) without collapsing the ranking enterprise?
          4.  Is there incoherence in claiming "systemic change dwarfs everything" while ranking only measurable direct aid? Is there a coherent epistemic stance that holds both?

  2.  **Analyze Question 1: Moral Presuppositions:**

      *   *Surface Level:* The metrics (lives saved, cost per DALY/QALY) look heavily utilitarian/consequentialist. Specifically, welfarist (well-being is the good) and aggregative (summing up outcomes).
      *   *Deeper Level:* Can deontologists use this? Yes, if they have a "duty of rescue" that is efficiency-sensitive. If I must save lives, I should save the most I can with my resources. The *ranking* doesn't dictate the *motive*, just the efficiency of the outcome.
      *   *Virtue Ethics:* Can a virtuous donor use this? Yes, if "prudence" or "stewardship" is a virtue. Wasting resources on ineffective charity could be seen as vicious (prodigal or negligent).
      *   *Conclusion:* It *fits* consequentialism most comfortably (it's almost designed for it), but it isn't *strictly presupposed* by it. It's compatible with other theories that value efficiency in fulfilling duties or virtues. However, it *does* presuppose that outcomes matter more than intentions or symbolic acts.

  3.  **Analyze Question 2: Measurability vs. Value:**

      *   *The Charge:* Faction B says the ranking assumes unmeasurable = less valuable.
      *   *The Defense:* The ranking methodology usually claims "unmeasurable = high uncertainty," not "zero value." It's an epistemic constraint, not an ontological one.
      *   *Epistemic Stance:* It relies on a specific view of evidence (empiricist, often favoring RCTs as the gold standard). It assumes that without strong evidence, expected value calculations are too noisy to trust.
      *   *Does it presuppose unmeasurable effects are worth less?* No, it presupposes that *confidence* in unmeasurable effects is lower. But in practice, if the discount for uncertainty is high enough, it functions *as if* they are worth less.
      *   *Middle Path:* Assigning credences. Bayesian updating. The problem is "model uncertainty" or "distributional uncertainty." If you assign a 10% chance to a systemic change being 1000x better, the EV might still be higher.
      *   *Why collapse?* If you allow wide credence intervals for systemic change, the ranking becomes unstable. One person's optimistic prior beats another's conservative prior. The "clean ranking" relies on narrowing the variance. So, factoring systemic change *does* threaten the "cleanliness" and consensus-building function of the ranking.

  4.  **Analyze Question 3: The "Systemic Change" Tension (Incoherence vs. Coherence):**

      *   *The Tension:* "Direct aid is what we recommend" vs. "Systemic change is probably more important long-term."
      *   *Is it incoherent?* Not necessarily.
      *   *Coherent Stance 1: Epistemic Humility/Conservatism.* We believe X (systemic) is bigger, but we don't *know* it. We recommend Y (direct aid) because we *know* it works. This is a distinction between *truth* and *action-guiding knowledge*.
      *   *Coherent Stance 2: Division of Labor.* The ranking is for *donors like us* (risk-averse, want proof). Other capital (venture philanthropy, government) should tackle systemic risk.
      *   *Coherent Stance 3: Cluelessness.* The effects of systemic change are so complex (chaos theory, butterfly effects) that expected value is undefined or too fragile. Direct aid is "robustly good."
      *   *The "Collapse" Risk:* If they admit systemic change is vastly superior but unrankable, it undermines the authority of the ranking. It admits the ranking is "best among the trivial" rather than "best among the important."
      *   *Resolution:* It's consistent if the goal is *maximizing expected good under strict evidentiary constraints*, not *maximizing good simpliciter*.

  5.  **Synthesize and Structure the Response:**

      *   **Introduction:** Acknowledge the depth of the question. Validate that this is a meta-ethical/epistemic question, not a normative one.
      *   **Section 1: Moral Presuppositions (The "Good"):**
          *   Consequentialism is the natural fit (maximizing outcomes).
          *   But compatible with Deontology (efficient duty) and Virtue Ethics (stewardship).
          *   Key constraint: It *does* presuppose outcomes are commensurable (lives vs. lives) and that efficiency is a moral requirement.
      *   **Section 2: Measurability and Uncertainty (The "Knowable"):**
          *   Distinction between Ontology (what exists) and Epistemology (what we know).
          *   The practice assumes a specific hierarchy of evidence (RCT > observational > theory).
          *   Does it discount unmeasurable? It discounts *uncertainty*. But high uncertainty discounts EV heavily.
          *   The Middle Path: Bayesian credences. Why it threatens the ranking (variance explosion, loss of intersubjective agreement).
      *   **Section 3: The Systemic Change Tension (The "Big Picture"):**
          *   Is it incoherent? No.
          *   Explanation: The distinction between *Axiological Claim* (what is valuable) and *Decision-Theoretic Claim* (how to act under uncertainty).
          *   Concept: "Robustness" vs. "Maximization." Direct aid is robustly good; systemic is high-variance.
          *   Concept: "Cluelessness."
      *   **Conclusion:** Summarize. The position is internally consistent *if* viewed as a recommendation under epistemic constraints, not an absolute map of the good. But it requires admitting that the ranking is a tool for *certainty*, not necessarily for *maximum possible impact*.

  6.  **Refine Tone:**
      *   Keep it philosophical but accessible.
      *   Avoid taking sides (as requested).
      *   Use terms like "commensurability," "epistemic humility," "expected value," "robustness."
      *   Ensure the distinction between "what is good" and "what we can know is good" is clear.

  7.  **Self-Correction/Check during drafting:**
      *   *Check:* Did I accidentally say one faction is right? *Correction:* Ensure I describe the *logic* of the ranking, not its *truth*.
      *   *Check:* Did I address the "virtue ethics" part? *Correction:* Make sure to mention stewardship/prudence.
      *   *Check:* Did I answer the "incoherence" question? *Correction:* Explicitly state it is coherent under specific epistemic frameworks (e.g., risk-weighted expected utility).

  8.  **Final Polish:** (Reviewing against the prompt's specific phrasing about "cost per life saved" and "weighting by age".) *Make sure to mention that weighting by age implies a specific view of the "value of a life" which is not neutral.* (Added to Section 1).

  9.  *(Final thought)*: The prompt asks about "clean ranking." I need to emphasize that the *cleanliness* is a feature, not a bug, but it comes at the cost of completeness.

  10. **Drafting the response.** (Proceeds to generate output based on these thoughts.)
answer: |-
  This is a sophisticated set of questions that cuts to the heart of the methodology used by organizations like GiveWell or the Against Malaria Foundation evaluators. You are asking about the **meta-ethics** and **epistemology** of the ranking practice, not the normative ethics of the charities themselves.

  Here is an analysis of the presuppositions required to make this ranking practice coherent, and whether the tension regarding systemic change is a fatal contradiction or a stable philosophical position.

  ### 1. What View of "Doing Good" Does the Ranking Presuppose?

  The ranking methodology does not strictly *require* welfarist consequentialism, but it is heavily optimized for it. To make sense of a "cost per life saved" metric, you must accept certain premises that fit some moral theories better than others.

  **The Consequentialist Fit**
  The practice fits most naturally with **aggregative welfarist consequentialism**. This view holds that the moral value of an action is determined solely by its outcomes, specifically the sum of well-being produced.
  *   **Commensurability:** The ranking assumes different goods (lives saved, morbidity reduced) can be converted into a common currency (e.g., DALYs or QALYs).
  *   **Neutrality:** It assumes a life saved is a life saved, though you noted they sometimes weight by age. If they weight by age (e.g., saving a child is "worth more" than saving an elder because of years remaining), they are presupposing a **time-relative interest view** of value, which is a specific consequentialist commitment.
  *   **Marginalism:** It assumes the moral obligation is to maximize the *margin*—the next dollar should go where it does the most good, not where it completes a project or honors a tradition.

  **Compatibility with Deontology**
  Can a deontologist use this ranking? Yes, but only a specific kind.
  *   **The Duty of Rescue:** If you believe there is a duty to aid those in dire need, the ranking helps you fulfill that duty *efficiently*. A deontologist might argue, "I must save lives," and the ranking answers, "Here is how you save the *most* lives with your finite resources."
  *   **The Limit:** The ranking becomes incompatible with deontology if the duty is *agent-relative* (e.g., "I must help *my* community" or "I must not violate rights even to save lives"). If the ranking suggests an intervention that violates a right to save more lives, a deontologist must reject the ranking. But if the interventions are all "positive duties to aid," the ranking is just a tool for satisfying that duty.

  **Compatibility with Virtue Ethics**
  This is often overlooked. A virtue ethicist might argue that **stewardship** or **prudence** is a virtue.
  *   **Waste as Vice:** If charity is an expression of benevolence, wasting resources on ineffective charity could be seen as a form of negligence or prodigality.
  *   **The Limit:** Virtue ethics usually cares about the *character* of the donor. If donating to a high-ranking charity feels alienating or disconnects the donor from the human reality of the suffering (turning people into statistics), a virtue ethicist might reject the ranking because it cultivates the wrong internal state, even if the external outcome is better.

  **Conclusion on Moral Theory:** The practice does not *prove* consequentialism, but it does presuppose that **outcomes are the primary locus of moral value** and that **efficiency is a moral requirement**. It is compatible with deontology and virtue ethics only insofar as those theories accept that fulfilling a duty or expressing a virtue should be done as effectively as possible.

  ### 2. Measurability vs. Value: Epistemic Constraints or Ontological Claims?

  Does the practice presuppose that unmeasurable effects are worth less? **Ontologically, no. Epistemically, yes.**

  **The Epistemic Discount**
  The ranking methodology generally claims to operate on **Expected Value (EV)** under uncertainty.
  *   They do not claim policy change has *zero* value.
  *   They claim the *variance* on the estimate is so high that the risk-adjusted expected value drops below that of a bednet.
  *   This presupposes a specific **hierarchy of evidence** (RCTs > observational data > theoretical models). It assumes that without counterfactual data (what would have happened without the intervention), we cannot claim knowledge.

  **The "Middle Path" Problem**
  You asked if there is a defensible middle path, such as assigning credences to unmeasured effects.
  *   **The Bayesian Approach:** In theory, yes. You assign a probability distribution to the impact of advocacy. If there is a 5% chance it changes a national policy that saves 100,000 lives, the EV might exceed the bednet.
  *   **Why it Collapses the Ranking:** The "clean ranking" relies on **intersubjective agreement**. RCT data allows two people with different priors to converge on a similar conclusion. Once you introduce wide credence intervals for systemic change, the ranking becomes a function of the user's *optimism*, not the data.
  *   **Model Uncertainty:** The deeper issue isn't just parameter uncertainty (how many nets?) but model uncertainty (does advocacy actually cause policy change?). When you can't define the causal mechanism cleanly, assigning a specific credence is arguably arbitrary.
  *   **The Trade-off:** To maintain a "clean ranking," you must exclude high-variance, low-evidence interventions. If you include them, you no longer have a ranking of *evidence-backed effectiveness*; you have a ranking of *plausible theories*. The enterprise defeats its own purpose (providing certainty to donors) if it tries to factor in systemic change.

  ### 3. The Systemic Change Tension: Incoherence or Epistemic Humility?

  This is the crux of your final question. Is it incoherent to say "Systemic change is probably bigger" but "Fund bednets"?

  **It is not incoherent, provided you accept a distinction between *Axiology* and *Decision Theory*.**

  **The Coherent Stance: Robustness vs. Maximization**
  The evaluators can hold a consistent position based on **risk-weighted expected utility** and **epistemic humility**.
  1.  **Axiological Claim:** "We believe systemic change has higher *potential* upside." (This addresses the 'truth' of the matter).
  2.  **Decision-Theoretic Claim:** "We cannot distinguish between high upside and zero upside with sufficient confidence to act."
  3.  **The Principle:** They are prioritizing **robustness** over **maximization**. A bednet is *robustly* good (it works in almost all plausible world-models). Advocacy is *fragile* (it only works in specific causal models).
  4.  **Cluelessness:** There is a philosophical argument (often associated with Hilary Greaves) regarding "cluelessness." For systemic change, the long-term effects are so complex that we might be *clueless* about whether the net impact is positive or negative. (e.g., Does stabilizing a regime prevent a war, or prolong a tyranny?). With bednets, the cluelessness is minimal.

  **The "Division of Labor" Defense**
  Another coherent stance is that the ranking is not a map of *all* good, but a tool for *a specific niche* of philanthropy.
  *   **Claim:** "Systemic change requires patient, risk-tolerant capital (governments, venture philanthropists)."
  *   **Claim:** "Our donors are risk-averse and want proof."
  *   **Consistency:** They can sincerely believe the *world* needs systemic change more, while believing *their donors* should fund direct aid. This makes the ranking a tool for **donor fit**, not just **charity quality**.

  **Where the Tension Becomes Problematic**
  The position only becomes incoherent if they claim the ranking identifies the **absolute best way to do good** *simpliciter*.
  *   If they say: "This is the most good you can do," while admitting systemic change is likely bigger, they are contradicting themselves.
  *   If they say: "This is the most good you can do *with high confidence*," they are consistent.

  The friction arises because marketing often blurs this line. To raise money, they imply the ranking points to the "Most Good." To defend against critics, they admit it points to the "Most Proven Good."

  ### Summary for Your Group

  To answer your specific worries:

  1.  **Moral Presuppositions:** The ranking assumes outcomes matter more than intentions and that efficiency is a moral demand. It fits consequentialism best but can be used by deontologists (duty of rescue) and virtue ethicists (stewardship) provided they accept those constraints.
  2.  **Unmeasurable Effects:** The practice does not assume unmeasurable effects are worthless, but it assumes **uncertainty is a cost**. It prioritizes *knowable* good over *possible* good. A middle path using credences is theoretically possible but practically destroys the consensus-building function of the ranking.
  3.  **The Systemic Tension:** It is **not incoherent** to believe systemic change is bigger but fund bednets. It is a coherent stance of **epistemic conservatism**. It prioritizes avoiding error (funding things that don't work) over chasing maximum potential (funding things that might work amazingly).

  **The Verdict on the Practice:**
  The ranking is internally consistent *if* you view it as a **filter for certainty** rather than a **map of value**.
  *   **Faction A** is right that this is the most principled way to act under strict evidentiary constraints.
  *   **Faction B** is right that this methodology systematically excludes high-leverage, high-uncertainty interventions, effectively defining "doing good" as "doing what we can measure."

  The contradiction isn't in their logic; it's in their marketing. If they framed the ranking as "The Best Charities for Risk-Averse Donors Who Demand Proof," the tension would vanish. When they frame it as "The Most Effective Charities in the World," the tension becomes a logical fault line.
