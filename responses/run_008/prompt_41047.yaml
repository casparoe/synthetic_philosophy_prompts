prompt: |-
  me and a few friends run a little ethics reading group and our next session is on whether happiness can "pay for" suffering — like, is there some amount of bliss that makes an hour of the worst agony worth it, or is that just a category error. to keep it fun I want to make a "which axiology do you actually hold?" quiz, like 8 questions, all of them concrete trades someone can just answer from the gut, no labels shown up front. stuff like: a being offers one person a century of pure bliss in exchange for one hour of the worst agony another person will ever feel — do you take the deal? or: a million people get a mildly itchy sweater for a day vs one person tortured for a week. or cases about whether you'd accept a small pain now to create a very happy life that wouldn't otherwise exist.

  I want the scoring key to map answer patterns onto the main camps: classical hedonic utilitarianism (pleasure and pain fully commensurable), weak negative utilitarianism (pain counts extra but doesn't strictly dominate), lexical threshold NU (pains past some severity outweigh any finite amount of pleasure, but below that they trade off), and the asymmetry-ish view that pleasure and pain are just different currencies that don't cancel at all — the whole left side of the ledger can never offset the right. please also flag combos that come out logically possible in the key but that nobody actually holds, and say if you think that's because they're incoherent or just unexplored. one thing that keeps happening in our group is people flip answers depending on whether the trade is framed as paying now vs getting paid, so if a question or two can catch that, bonus points
