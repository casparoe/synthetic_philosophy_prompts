      *   **Conclusion:** Final advice.

  9.  **Refining the Content (Self-Correction during drafting):**
      *   *Correction on User's Point 4:* The user asks to distinguish "selected for" from "now does." This is the *Spandrel* distinction. It is empirically vital. If I claim a trait is an adaptation for X, but it's actually a byproduct of Y, that's a false hypothesis. So this *is* non-negotiable for empirical truth, even if the "excuse" part is ethical. I will clarify this distinction.
