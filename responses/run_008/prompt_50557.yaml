  *(Self-Correction on the "Surprising vs. Anchored" tension)*: Actually, there is a tension. If you anchor *too* strictly to specific ancestral details that are unknowable, you can't make predictions. If you make predictions too abstract, they aren't anchored. The tension is between *specificity* and *testability*. I should nuance the answer: they aren't mutually exclusive, but balancing them requires careful operationalization.

  *(Final check on User's Point 4)*: "so the same claim is not used to explain a behavior and to excuse one." This is the Naturalistic Fallacy. This is *not* an empirical criterion. It's an ethical/discursive one. I must mark this distinction clearly. The *separation* of function and current use is empirical; the *excuse* part is ethical.

