      *   *Requirement 4: Genetic/Phylogenetic Plausibility.* Heritability and time depth.
      *   *Requirement 5 (The User's #4):* Functional vs. Current. I need to classify this carefully. It's about avoiding the Naturalistic Fallacy. It's a normative constraint on *discourse*, not necessarily a condition for the *truth* of the mechanism. I will classify it as a disciplinary norm rather than an empirical necessity, though vital for reputation.

