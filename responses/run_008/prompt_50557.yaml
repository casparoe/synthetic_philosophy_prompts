answer: |-
  This is the correct moment to demand this specification. The "just-so story" critique is not merely rhetorical; it identifies a structural vulnerability in inference to the best explanation when the historical record is sparse. To practice evolutionary psychology (EP) as science rather than mythology, you must treat the evolutionary hypothesis as a *causal model* subject to the same constraints as any other mechanistic claim.

  Below are the desiderata derived from your list and supplemented by methodological necessities. I have categorized them by **Status**: *Non-Negotiable* (violations render the work non-empirical), *Methodological Norm* (violations weaken the work but remain scientific), and *Discursive/Ethical* (violations invite social critique but do not falsify the mechanism).

  ### The Desiderata for Scientific Evolutionary Psychology

  | # | Requirement | Rationale & Failure Mode | Status |
  | :--- | :--- | :--- | :--- |
  | **1** | **A Priori Falsification Conditions**<br>The hypothesis must specify a pattern of data that would support a *byproduct* or *exaptation* account over an adaptation account. | **Failure Mode:** "Theoretical Immunity." If every possible outcome (presence, absence, or reversal of a trait) is interpreted as consistent with the adaptationist hypothesis, the theory is unfalsifiable. You must define what a spandrel looks like in your specific domain. | **Non-Negotiable** |
  | **2** | **Independent EEA Constraint**<br>The Environment of Evolutionary Adaptedness (EEA) must be characterized using paleoanthropological, archaeological, or comparative primate data *independent* of the psychological trait being explained. | **Failure Mode:** "Circular Reconstruction." Inferring the ancestral environment solely from the existence of the modern trait (e.g., "We have jealousy, therefore ancestors faced paternity uncertainty") makes the argument tautological. The pressure must be established before the mechanism is invoked. | **Non-Negotiable** |
  | **3** | **Quantitative/Ordinal Prediction**<br>The hypothesis must predict effect sizes, interaction orderings, or threshold effects, not merely the direction of an effect. | **Failure Mode:** "Folk Confirmation." If the prediction aligns with lay intuition (e.g., "parents love children more than strangers"), it confirms cultural norms, not evolutionary design. Only predictions that diverge from folk psychology or specify precise magnitudes test the mechanism. | **Non-Negotiable for Progress** |
  | **4** | **Phylogenetic & Genetic Plausibility**<br>The hypothesis must be consistent with quantitative genetics (heritability estimates) and phylogenetic timelines (time depth required for selection vs. time available). | **Failure Mode:** "Magic Wand Selection." Proposing a complex adaptation for a pressure that arose 5,000 years ago (e.g., specific financial trading heuristics) violates the speed of selection. Claiming a trait is adaptive when $h^2 \approx 0$ ignores that selection requires heritable variation. | **Non-Negotiable** |
  | **5** | **Distinction: Selected Function vs. Current Utility**<br>The claim about *why a trait exists* (selection history) must be logically separable from claims about *what the trait does now* (current utility). | **Failure Mode:** "Naturalistic Fallacy / Conflation." Using current utility as proof of past selection is circular. Using past selection to justify current utility is ethical malpractice. While the *separation* is empirical, the prohibition on *excusing* behavior is ethical. | **Mixed** (Separation is Non-Negotiable; Excuse prohibition is Discursive) |
  | **6** | **Mechanism Specification**<br>The hypothesis must propose a cognitive or physiological mechanism (input $\to$ procedure $\to$ output), not just a behavioral outcome. | **Failure Mode:** "Black Box Teleology." Stating "humans do X to maximize fitness" is not psychology; it is optimality modeling. EP must explain *how* the mind solves the problem, allowing for error and bias. | **Non-Negotiable** |

  ### Evaluation of Your Proposed Criteria

  You have correctly identified the fault lines. Here is how I evaluate your specific suspicions:

  1.  **State in advance what counts against it:** **Non-Negotiable.** This is the core of Popperian demarcation. In EP, this specifically means defining the signature of a byproduct. If your hypothesis is "Module M exists," you must state what data would suggest M is actually a side-effect of Module N.
  2.  **Constrain the ancestral environment independently:** **Non-Negotiable.** This is the most common failure point. If the EEA is a free parameter, you can fit any curve to any data.
  3.  **Predict effect sizes/orderings:** **Non-Negotiable for Progress.** Directional predictions are necessary but insufficient. Given the noise in behavioral data, a theory that only predicts direction is often compatible with null results via "noise" excuses.
  4.  **Keep apart selected function from current use:** **Mixed.** The *empirical separation* is Non-Negotiable (conflating them is bad science). The *ethical prohibition on excusing behavior* is Discursive (bad ethics, but the science could technically be true). However, conflating them often leads to bad science because it discourages testing for mismatch.
  5.  **Consistency with quantitative genetics:** **Non-Negotiable.** This is the most overlooked constraint. Many EP hypotheses assume selection acted on variation that likely did not exist or could not be tracked genetically.

  ### Are These Desiderata Jointly Unsatisfiable?

  You asked whether demanding **surprising, counterintuitive predictions** pulls against demanding **anchoring in the ancestral environment**.

  **My view:** They are not in tension; they are synergistic.
  If a hypothesis is truly anchored in the ancestral environment, it *should* often generate counterintuitive predictions about the modern environment. This is the concept of **Evolutionary Mismatch**.
  *   *Example:* An adaptation for calorie conservation (EEA: scarcity) predicts obesity (Modern: abundance). This is counterintuitive to "rational actor" models but anchored in the EEA.
  *   *The Real Tension:* The tension lies between **EEA Specificity** and **Measurement Feasibility**.
      *   To avoid the "free parameter" critique, you need a specific EEA (e.g., "Pleistocene hunter-gatherers in savannahs").
      *   To make a surprising prediction, you often need to test in a modern context where the variables are confounded by culture.
      *   *Risk:* If you make the EEA anchor too specific, critics will attack the archaeological uncertainty. If you make it too general ("ancestral social living"), you invite the "just-so" critique.
      *   *Resolution:* You must anchor the *problem structure* (e.g., "recurrent problem of cheater detection") rather than the *specific setting* (e.g., "sitting around a fire"). The problem structure must be invariant; the setting can be reconstructed.

  There is, however, a tension between **Adaptationism** and **Quantitative Genetics**.
  *   Strict adaptationism assumes traits are optimized solutions.
  *   Quantitative genetics shows that many traits are constrained by genetic correlations, drift, or mutation-selection balance.
  *   *Resolution:* A robust EP hypothesis must allow for "good enough" solutions constrained by genetic architecture, not perfect optimality. If you demand perfect optimality, you will fail the genetics check.

  ### Assessment of Familiar Research Programs

  Here is how the major programs fare against the desiderata above. Use this to calibrate your own scoring.

  **1. Massive Modularity (e.g., Cosmides & Tooby)**
  *   **Strengths:** Excellent on *Mechanism Specification* and *Independent EEA Constraint* (often defines the computational problem first). Strong on *Falsification* (e.g., Wason selection task variations).
  *   **Weaknesses:** Often struggles with *Quantitative Genetics* (assumes modularity is heritable without always demonstrating $h^2$). Sometimes accused of *Circular Reconstruction* regarding the specific content of modules.
  *   **Verdict:** High scientific rigor, but risks over-adaptationism.

  **2. Costly Signaling (e.g., Cooperation, Display)**
  *   **Strengths:** Excellent on *Quantitative/Ordinal Prediction* (signals must be costly enough to be honest; predicts specific ratios of cost to benefit). Strong *Falsification* (if low-quality individuals can fake the signal, the theory fails).
  *   **Weaknesses:** *Independent EEA Constraint* can be weak; often assumes the "cost" structure is universal without verifying ancestral resource distributions.
  *   **Verdict:** Mathematically rigorous, but can drift into economic modeling detached from psychology.

  **3. Life History Strategy (e.g., Fast vs. Slow)**
  *   **Strengths:** Good on *Phylogenetic Plausibility* (aligns with comparative biology). Strong on *Effect Sizes* (predicts correlations across risk, mating, and parenting).
  *   **Weaknesses:** High risk of *Just-So Story*. "Stress causes fast strategy" can become a post-hoc label for any negative correlation. *Mechanism Specification* is often vague (what is the "switch" in the brain?).
  *   **Verdict:** Heuristically powerful, but methodologically the most vulnerable to the "plausible narrative" critique.

  ### Final Recommendation

  If you commit to this field, your dissertation must not merely apply an evolutionary lens; it must **stress-test** it.

  Do not start with "Behavior X exists, what was it for?"
  Start with "If Mechanism M was selected for Problem P, then in Condition C, we must observe Effect E of Magnitude Z. If we observe not-E, or E without Z, the adaptationist account is rejected in favor of a byproduct account."

  If you can write that sentence clearly, and your committee cannot poke a hole in the logic of the rejection conditions, you have insulated yourself from the "just-so" charge. If you cannot write that sentence, you are writing narrative, not science.
