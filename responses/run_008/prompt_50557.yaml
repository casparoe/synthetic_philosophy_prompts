      *   The core criticism (Gould & Lewontin, 1979) is that EP often starts with a behavior, assumes it's an adaptation, invents a plausible ancestral problem, and claims the behavior solves it.
      *   To be scientific, it needs to move from *post-hoc* storytelling to *a priori* prediction and constraint.

  3.  **Evaluate the User's Proposed Desiderata:**

      *   *1. Falsifiability/Byproducts:* Crucial. If every result can be explained as "adaptation" or "byproduct" after the fact, the theory explains everything and nothing. *Verdict: Non-negotiable.*
      *   *2. Independent EEA Constraints:* Crucial. If the EEA is molded to fit the trait, it's circular. We need paleoanthropological/archaeological independence. *Verdict: Non-negotiable.*
      *   *3. Effect Sizes/Orderings:* Strong methodological standard. Directional predictions are weak because folk psychology often aligns with evolutionary logic. *Verdict: Non-negotiable for rigor, though sometimes hard.*
      *   *4. Function vs. Current Use (Is/Ought):* This is more ethical/conceptual clarity than empirical falsifiability. It prevents the "naturalistic fallacy" but doesn't necessarily make the *science* better, just the *interpretation* safer. *Verdict: Prejudice/Standard of interpretation (important but not strictly empirical).*
      *   *5. Quantitative Genetics/Timescales:* Crucial. If a trait requires 100,000 years of selection but the pressure arose 5,000 years ago, the hypothesis fails. *Verdict: Non-negotiable.*

