  got a question thats been bugging me about the meta-problem of consciousness. As I understand it, the meta-problem is just the hard problem shifted onto behavior: instead of explaining experience directly, you explain why we report one — why we talk as if there's something it's like to see red, why we judge there's an explanitory gap, why the whole hard problem discourse even exists. And I've read that Chalmers himself files it under the easy problems, which to me basically means it's ordinary cognitive science — we're already decent at explaining judgments and speech behavior, so this is just normal science with extra steps, probably wrapped up in a decade or two. So here's my actual question: once it IS solved, aren't the remaining hard-problem people just being stubborn? At that point the explanation that covers the reports would obviously cover the experiences too, and anyone who denies that is just refusing to apply Occam's razor. So shouldn't philosophers of mind just concede the hard problem now and save everyone the wait? I assume Chalmers thinks it's subtler than this but I honestly can't see what the extra step is supposed to be, so if someone can point out where I'm going wrong that'd be great.
