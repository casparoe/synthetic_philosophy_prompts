  You should reject premise (4). It looks innocent because it codifies a reliable indicator theory of knowledge: if a belief-forming mechanism would produce the same output regardless of the truth of $p$, it cannot justify believing $p$. This counterfactual dependence is standard in naturalistic epistemology (e.g., Nozick, Dretske). Given (3), epiphenomenalism seems to fail this test miserably, as the physical judgment occurs whether or not the quale exists.

  However, maintaining (1) and (2) requires denying that causal efficacy is necessary for justification. The cost is adopting a non-causal account of introspection, often called "acquaintance." You must argue that the relationship between experience and judgment is not merely causal signaling but constitutive; the experience's presence directly warrants the report, even without physical leverage. This creates epistemological disunity: perception relies on causal chains, while introspection relies on direct presence.

  Your worry about abstract objects is actually a solution, not a new problem. Platonists face the same issue: numbers cause nothing, yet we know them. They reject the causal requirement for knowledge. By rejecting (4), you join them, accepting that knowledge of acausal entities is possible. This generalizes the exception rather than creating a unique problem for mind.

  If you keep (4), you concede (7), rendering your defense of epiphenomenalism irrational—a pragmatic suicide. Rejecting (4) preserves the certainty of consciousness and the rationality of your view. You pay the price of mystery regarding how inert properties justify physical beliefs, but this is preferable to denying you know you are in pain. The flaw lies in assuming all knowledge must mirror causal information transfer.
