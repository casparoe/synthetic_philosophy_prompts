prompt: |-
  I'm on the board of a 46-unit housing co-op, and my unofficial job has become handling exception requests. We have a thick house-rules doc — quiet hours from 10pm, no subletting, guests capped at 14 nights a year, shared workshop has to be booked through the app, no storage in the bike room, residential use only, etc. — and basically every month somebody writes in asking to be excused from one of them for a special reason. The board is split between the "rules are rules" people and the "be reasonable" people, and we have no principled way to split the difference, so it mostly comes down to whoever argues loudest at the meeting.

  Years ago I read a bit of Kant, and the thing that stuck was the universalizability idea: before acting on a maxim, ask whether you could will it as a universal law — the classic case being that lying promises only work *because* most people keep their promises, so the liar is relying on the very practice he's undermining. It struck me that a lot of our exception requests are exactly like that. Some exceptions only work because most people don't ask for them: one member wanted to park in the loading zone all of December because relatives visit for the holidays — fine when it's just her, a disaster if everyone with holiday guests did the same. And then other exceptions seem genuinely harmless even if everyone did them, and maybe those are the ones we should grant.

  So here's the ask: turn universalizability into a procedure the board can actually run, in maybe fifteen minutes per request, with no philosophy background assumed. Things I think it needs:

  - A way to write the request down as a policy statement ("maxim"?) at the right level of detail. I know this is where it gets gamed — "anyone in my situation may..." where "my situation" is described so narrowly it's just me. Give us a rule of thumb for when a description is too gerrymandered to be the thing we universalize, since that seems to be where half our arguments actually live.
  - A clean split between exceptions that make the rule self-defeating if granted to everyone (everyone books the workshop "by exception" and the booking system stops meaning anything) and ones that don't defeat it but that we still couldn't all want at once (everyone sublets their unit and the co-op quietly stops being a co-op). If Kant people have names for these two failure modes, give them to us in plain English but don't make us use the jargon.
  - The points where the test is silent and it just has to go to a straight values vote, marked as such — I don't want the procedure pretending to settle questions it can't.
  - An honest section on where it will misfire. I can already tell it'll say no to sympathetic cases and yes to obnoxious ones, and I'd rather the doc admits that up front than have the board discover it mid-meeting and junk the whole thing.

  Then run it on three real-ish requests from the past year: (1) the December loading-zone one above; (2) a member who wants to run a small home-bakery business out of her unit in violation of the residential-use clause, arguing it's low-impact and she'd be delighted if everyone did it; (3) a member asking to be exempt from the chore rotation because he travels most weeks, who proposes buying out his share instead of doing chores — he's genuinely not trying to free-ride, he just can't be there.

  One more thing: tell me how confident you are in the reading of Kant you're using. I gather there's live disagreement about what the universalizability test is even supposed to rule out — whether the problem is supposed to be some kind of contradiction in the universalized rule itself, or a contradiction in what you can rationally will alongside your other ends — and I want you to flag which of those interpretive choices actually change what my board should do versus which are academic. And please single out the one step of the procedure you're least sure of, so I know where to keep a human override no matter what the checklist says.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** Board member of a 46-unit housing co-op.
      *   **Problem:** Handling exception requests to house rules. Board is split ("rules are rules" vs. "be reasonable"). Decisions are currently ad hoc/loudness-based.
      *   **Inspiration:** Kant's Categorical Imperative (Universalizability).
      *   **Goal:** Turn universalizability into a practical 15-minute board procedure.
      *   **Requirements:**
          *   Rule of thumb for framing the "maxim" (avoiding gerrymandering).
          *   Distinguish between self-defeating exceptions (logical contradiction) and undesirable-but-possible exceptions (volitional contradiction) in plain English.
          *   Identify where the test is silent (needs values vote).
          *   Honest section on limitations/misfires.
          *   Apply the procedure to three specific cases (Loading Zone, Home Bakery, Chore Buyout).
          *   Confidence level on Kant interpretation (academic vs. practical impact).
          *   Identify the weakest step in the procedure.

  2.  **Deconstruct Kant for a Co-op Board:**
      *   *Core Concept:* Can everyone do this without breaking the system or making life unbearable?
      *   *The "Maxim" Problem:* Kant says act on maxims you can will as universal law. The trick is describing the action. If I say "I can lie when I need money," that fails. If I say "I can lie when I'm me and I need money," that's too specific.
      *   *The Two Failures:*
          1.  *Contradiction in Conception:* If everyone did it, the practice itself becomes impossible (e.g., false promising destroys the institution of promising). -> *System Breaker.*
          2.  *Contradiction in Will:* If everyone did it, the practice exists, but no rational person would want to live in that world (e.g., never helping others). -> *Community Breaker.*
      *   *Practical Translation:*
          1.  Does this break the rule's function?
          2.  Does this make the co-op a place no one wants to live?

  3.  **Drafting the Procedure (The "Universalizability Checklist"):**
      *   *Step 1: Framing the Request.* Need to stop "Just me" language. Rule of thumb: "The Reasonable Peer Test." Could another member in a *relevantly similar* situation use this same description?
      *   *Step 2: The System Breaker Test (Logical).* If 46/46 did this, does the rule cease to function?
      *   *Step 3: The Community Breaker Test (Volitional).* If 46/46 did this, is the co-op still desirable?
      *   *Step 4: The Silence Zone.* If it passes both, it's not a *right*, but it's not a *violation*. This is where discretion/values come in.
      *   *Step 5: Limitations.* Acknowledge hard cases.

  4.  **Applying to the Three Cases:**
      *   *Case 1: Loading Zone (Holiday).*
          *   Maxim: "Members with holiday guests may park in the loading zone for up to 2 weeks."
          *   System Breaker? Yes. Loading zone becomes a parking lot. Function lost.
          *   Verdict: Deny (based on test).
      *   *Case 2: Home Bakery.*
          *   Maxim: "Members may run low-impact food businesses from home."
          *   System Breaker? Maybe not logically (kitchens still work), but "Residential Use" defines the zoning/legal status.
          *   Community Breaker? If 46 units become bakeries, it's a commercial block, not a home. Traffic, smell, insurance issues.
          *   Verdict: Deny (Community Breaker).
      *   *Case 3: Chore Buyout.*
          *   Maxim: "Members who travel frequently may buy out their labor obligation."
          *   System Breaker? No. Chores still get done (if paid for).
          *   Community Breaker? If everyone buys out, do we lose community spirit? Or does it just become a fee?
          *   Nuance: This is likely in the "Silence Zone." It doesn't break the system, but it changes the nature of contribution.
          *   Verdict: Values Vote.

  5.  **Addressing the Kant Interpretation (Confidence & Nuance):**
      *   *Scholarly Debate:* Contradiction in Conception (CC) vs. Contradiction in Will (CW). Also, the level of abstraction in the Maxim.
      *   *Practical Impact:* For a co-op, the distinction between "System Breaker" (CC) and "Community Breaker" (CW) is the most useful mapping. The academic debate about *why* CW fails matters less than the outcome (it's not desirable).
      *   *Confidence:* High on the *utility* of this mapping for governance, moderate on strict textual fidelity to Kant (because Kant wasn't writing for HOAs).
      *   *Weakest Step:* Framing the Maxim (Step 1). This is where bias enters.

  6.  **Refining the Output:**
      *   *Tone:* Professional, practical, slightly philosophical but grounded.
      *   *Structure:*
          1.  Introduction (Validating the idea).
          2.  The Procedure (The 15-minute tool).
          3.  The Three Cases (Application).
          4.  Limitations & Misfires.
          5.  Kantian Confidence & Interpretive Choices.
          6.  The Weakest Step.

  7.  **Self-Correction/Review during drafting:**
      *   *Critique:* Did I make the "Maxim" step too abstract?
      *   *Fix:* Add a specific heuristic: "Replace 'I' with 'Any Member' and remove unique identifiers."
      *   *Critique:* Is the Bakery case clear?
      *   *Fix:* Ensure the distinction between "low impact" (subjective) and "Residential Use" (legal/structural) is clear.
      *   *Critique:* Did I answer the "Confidence" question specifically?
      *   *Fix:* Create a dedicated section at the end.
      *   *Critique:* The prompt asks for "plain English" names for the two failure modes.
      *   *Fix:* Use "System-Breaking" and "Community-Undermining."

  8.  **Final Polish:** Check against all constraints in the prompt (15 mins, no philosophy background, specific cases, confidence level, weakest step). *Looks good.*

  *(Self-Correction on the Chore Case)*: Wait, if everyone buys out their chores, who does the work? If the money pays a professional, the work gets done. So it's not a System Breaker. But does it undermine the *co-op* model of shared labor? That's a values question. I need to make sure the procedure flags this as "Silence/Values" rather than a hard "No."

  *(Self-Correction on Kant Confidence)*: I need to be careful not to claim this *is* Kant. It's *Kant-inspired*. The academic debate about "rational willing" vs "logical contradiction" is real. I should acknowledge that the "Community-Undermining" test is a pragmatic adaptation of the "Contradiction in Will."

  9.  **Finalizing the Text:** (Proceeding to generate response based on these thoughts.)
answer: |-
  This is a brilliant application of moral philosophy to property management. You are correct that the "loudest voice" problem stems from a lack of shared criteria. Kant's universalizability test is essentially a stress-test for policy consistency.

  Below is a procedure designed for a 15-minute board agenda item, followed by the application to your three cases, and finally the meta-analysis on Kantian interpretation you requested.

  ***

  # The "Universalizability" Exception Procedure

  **Time required:** 15 minutes per request.
  **Goal:** Determine if an exception can be granted without destroying the rule or the community.
  **Materials:** Whiteboard or shared doc.

  ### Step 1: Frame the "General Rule" (3 Minutes)
  The requester usually frames the exception as: *"I should be allowed to X because [unique personal detail]."*
  The Board must reframe this as a policy statement that could apply to anyone.

  **The Rule of Thumb:** *The "Reasonable Peer" Test.*
  Write the request as: **"Any member in a relevantly similar situation may [action]."**
  *   **Too Narrow (Gerrymandered):** "Any member named Susan with relatives from out of town in December." (Reject this framing. It's just "Susan".)
  *   **Too Broad:** "Any member may park anywhere." (Ignores the constraint.)
  *   **Just Right:** "Any member with overnight guests during holiday periods may park in the loading zone for up to 14 days."

  *Board Check:* If you cannot agree on the framing in 3 minutes, you are arguing about values, not logic. Move to Step 4.

  ### Step 2: The "System-Breaker" Test (4 Minutes)
  Ask: **If 46 out of 46 units exercised this exception simultaneously, would the rule cease to function?**

  *   **Logic:** Some rules only work because they are exceptions. If the exception becomes the norm, the system crashes.
  *   **Example:** "Anyone can book the workshop by email instead of the app." If everyone does this, the app is useless, double-bookings happen, and the system collapses.
  *   **Verdict:** If **YES**, the exception is **Denied**. It is logically incompatible with the rule.

  ### Step 3: The "Community-Undermining" Test (4 Minutes)
  Ask: **If 46 out of 46 units exercised this exception simultaneously, would the co-op still be a place we would want to live?**

  *   **Logic:** The system might technically function, but the character of the building changes so drastically that it defeats the purpose of living there.
  *   **Example:** "Anyone can sublet their unit." Technically, the building stands. But if everyone sublets, there are no neighbors, no stability, and it ceases to be a *community*.
  *   **Verdict:** If **YES** (it would be undesirable), the exception is **Denied**. It is rationally unwelcome.

  ### Step 4: The "Silence Zone" (Values Vote) (4 Minutes)
  If the request passes both Step 2 and Step 3, the Universalizability Test is **Silent**.
  *   This does not mean the request *must* be granted. It means the test cannot decide it.
  *   The question shifts from "Is this consistent?" to "Is this good for us?"
  *   **Action:** Take a straight vote based on board values, budget, or precedent. Acknowledge explicitly: *"Kant doesn't forbid this, but we might still say no."*

  ***

  # Application to Three Real Requests

  ### Case 1: The December Loading Zone
  **Request:** Member wants to park in the loading zone for 2 weeks in December for holiday guests.
  **Framed Maxim:** "Any member with holiday guests may park in the loading zone for up to 14 days per year."

  *   **System-Breaker Test:** **YES.** The loading zone exists for temporary loading/unloading. If 46 units utilize it for 14 days each (even staggered), the probability of overlap is near 100%. It effectively becomes a parking lot. Delivery trucks cannot access the building. The function of the zone is destroyed.
  *   **Verdict:** **Deny.**
  *   **Board Script:** "We cannot grant this because if everyone did it, the loading zone would stop working for everyone, including you."

  ### Case 2: The Home Bakery
  **Request:** Member wants to run a small bakery from her unit. Argues it's low-impact and she'd be delighted if everyone did it.
  **Framed Maxim:** "Any member may operate a low-impact food business from their unit."

  *   **System-Breaker Test:** **NO.** The plumbing and electricity can technically handle 46 ovens.
  *   **Community-Undermining Test:** **YES.** "Residential Use" is not just a rule; it is a zoning and insurance classification. If 46 units become commercial kitchens, the building becomes a commercial block. Traffic increases, insurance premiums skyrocket, and the quiet residential character is lost. Even if the member *says* she'd be delighted, a rational member cannot will that the building loses its residential status (which protects their equity and quiet enjoyment).
  *   **Verdict:** **Deny.**
  *   **Board Script:** "Even if your specific bakery is quiet, a building of 46 bakeries is not a home. We cannot universalize commercial use without changing the nature of the co-op."

  ### Case 3: The Chore Buyout
  **Request:** Member travels frequently, asks to pay a fee instead of doing chore rotation.
  **Framed Maxim:** "Any member unable to attend due to travel may buy out their labor obligation."

  *   **System-Breaker Test:** **NO.** If everyone buys out, the chores still get done (assuming the money hires cleaners). The system functions.
  *   **Community-Undermining Test:** **MIXED/UNCLEAR.** If everyone buys out, do we lose the "co-op spirit" of shared labor? Or do we simply become a condo with a maintenance fee? Reasonable people disagree on whether "sweat equity" is essential to the co-op identity.
  *   **Verdict:** **Silence Zone (Values Vote).**
  *   **Board Script:** "This doesn't break the system, and a building of paid cleaners is still livable. However, we need to vote on whether we value *labor* or *results*. This is a values decision, not a logic test."

  ***

  # Limitations & Misfires

  You asked for honesty on where this will fail. Here is where the procedure will frustrate the board:

  1.  **The "Sympathetic No":** The test will frequently demand you deny exceptions to people with genuine hardships (e.g., a medical need that violates a noise rule). Universalizability is cold. It protects the *system*, not the *individual*. You will need a separate "Hardship Fund" or discretionary clause for these, or the board will feel like monsters.
  2.  **The "Obnoxious Yes":** As seen in the Chore Buyout, the test might allow things that feel culturally wrong. A member might demand to paint their door neon purple. If 46 neon doors don't break the building or make it unlivable, the test says "Allowed." But the board might hate it. You must reserve the right to say "No" in the Silence Zone.
  3.  **The "First Mover" Problem:** Some exceptions are fine at 1/46 but disastrous at 10/46. The test assumes a binary (0 or 46). It struggles with "slippery slope" arguments unless the board agrees that *granting* the exception sets the precedent for the slope.

  ***

  # Confidence & Interpretive Choices (The Kant Meta-Analysis)

  You asked for my confidence level on the Kantian reading and where the academic debates matter for your board.

  **Confidence Level:** **High on Utility, Moderate on Textual Fidelity.**
  I am highly confident that this procedure captures the *spirit* and *structural logic* of the Categorical Imperative as it applies to governance. I am moderately confident that a Kant scholar would accept this as a strict reading of the *Groundwork of the Metaphysics of Morals*, because Kant was writing about moral duties of rational agents, not zoning bylaws.

  **The Academic Debate:**
  Scholars argue over whether the "Contradiction in Will" (my "Community-Undermining" test) relies on:
  1.  **Logical Contradiction:** The world literally cannot exist (e.g., everyone lies, language loses meaning).
  2.  **Volitional Contradiction:** The world exists, but you cannot *rationally want* it (e.g., everyone ignores others in distress; you might need help someday, so you contradict your own self-interest).

  **Does this change what your board should do?**
  **No.** For a housing co-op, the distinction is academic. Whether the failure is "logically impossible" or "rationally unwanted," the outcome for the board is the same: **Do not grant the exception.** You do not need to resolve the philosophical debate to use the tool. The "System-Breaker" vs. "Community-Undermining" split covers both bases practically.

  **The Weakest Step (Human Override Required):**
  **Step 1: Framing the "General Rule."**
  This is the point of highest failure risk.
  *   **Why:** Universalizability is only as good as the description of the action. If the board frames the maxim too broadly ("Anyone can park"), everything fails. If they frame it too narrowly ("Anyone named Susan..."), everything passes.
  *   **The Risk:** Bias enters here. A board member who likes the requester will frame the maxim narrowly to help them pass. A board member who dislikes them will frame it broadly to make them fail.
  *   **The Override:** You need a "Framing Veto." If any board member objects that the framed maxim is gerrymandered (too specific to the individual) or abstract (too vague), you must pause and negotiate the wording *before* running the test. If you cannot agree on the wording in 3 minutes, **abort the test** and move to a straight Values Vote (Step 4). Do not let a rigged maxim drive the decision.

  **Summary Advice:**
  Use this procedure to kill the "bad logic" exceptions (Loading Zone, Bakery). It will save you hours of arguing. But for the "values" exceptions (Chores, Aesthetics), admit the test is silent and vote your conscience. Don't let the tool pretend to be a moral oracle when it's really just a consistency checker.
