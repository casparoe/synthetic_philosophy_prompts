  4.  **Audit and Critique (The "Philosophical Work"):**
      *   *Fair Race Critique:* It assumes individualism that doesn't exist. We are embedded in families. It assumes the state can perfectly measure "starting lines." It ignores the motivational aspect of bequest (why run if you can't pass the shoes?).
      *   *Relay Team Critique:* It assumes the "team" is a moral unit superior to the individual. It ignores that new "runners" (children) didn't consent to join the team. It obscures the fact that other teams start with different quality batons or on different tracks.
      *   *Relevant Disanalogies:*
          *   *Race:* Life has no finish line (relevant because accumulation doesn't stop).
