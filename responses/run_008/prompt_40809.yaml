answer: |-
  This is a splendidly thorny problem. You have effectively channelled Derek Parfit's *Reasons and Persons* into a domestic dispute, which is no mean feat. The Actuary has constructed a 'pincer' argument: if she denies time discounting for the climate, she must deny it for her pension; if she keeps it for the pension, she admits time matters, and the climate argument collapses.

  To let her win honestly without sacrificing Premise (1) — which, as you note, is the moral backbone of your book — she needs to attack **Step (6)**. This is the hinge of his argument, and it relies on a **False Dilemma**.

  He presents two options:
  1.  Prudent saving is irrational bias (nepotism for the self).
  2.  Prudence is special because *bare temporal position* matters.

  She needs to introduce a **third option**: Prudence is special because of **agency and causal responsibility**, not because of time.

  ### The Philosophical Move

  She should concede that *moral value* is impartial (Premise 1 stands), but argue that *rational self-interest* operates on a different axis. The reason she saves for her eighty-year-old self is not because that person is temporally closer than a stranger, but because she is the **author** of that person's situation.

  Here is how she breaks the chain:

  1.  **Accept Premise (3) and (4):** She agrees with him that identity is fuzzy and psychological connectedness fades. This shows she respects his intellect.
  2.  **Reject the Inference in (5):** She argues that rational concern does not fall off *merely* with connectedness. It falls off with connectedness *plus* a lack of causal agency.
  3.  **Destroy Step (6):** She argues that saving for retirement is not a 'bias' comparable to nepotism, nor does it require 'bare time' to matter. It is a rational response to **causal responsibility**.

  **The Argument in her voice:**
  > "Granddad, you're conflating *moral worth* with *prudential duty*. When I look at a child born in 2080, I see a moral equal. Their worth isn't discounted by time. That's why I fight for the climate.
  >
  > "But when I look at the eighty-year-old me, I don't just see a person. I see a person whose predicament I am *creating*. I am the cause of his poverty or his comfort. I have a special obligation to him not because he is 'me' in some magical sense, and not because he is closer in time, but because I am holding the pen that writes his life.
  >
  > "I have no such causal hand in the life of a stranger. So, saving for my future self isn't a prejudice like nepotism. It's taking responsibility for my own actions. That justifies the pension without requiring me to discount the future of the planet."

  ### The Cost to Her Character

  For this to feel honest, she cannot emerge as a flawless saint. If she argues that we have special duties to our future selves based on agency, she must concede a limitation to her own activism.

  **The Cost:** She has to admit that **partiality is permissible**.
  She must concede that it is rational for him to prioritise his own pension over a slightly more effective charitable donation, provided he doesn't actively harm others to do so. She cannot claim that we must be purely impartial agents in every facet of life. She has to accept that being human involves a 'personal standpoint' that is distinct from the 'impartial standpoint'.

  This makes her more grounded. She wins the climate argument (the future counts equally), but she loses the argument for total self-sacrifice. She admits that while the future generations count for *one*, she is allowed to count for *one* as well, and her specific agency links her to her future self in a way it does not link her to them.

  ### How to Stage the Scene

  To make this land in British English without sounding like a lecture, keep the terminology grounded in the porch setting. Use the pension paperwork or the garden as anchors.

  **Suggested Dialogue Beat:**

  > He tapped the pension statement against his knee. "So? Is the fund a prejudice, or is the climate a fantasy?"
  >
  > She leaned forward, elbows on her knees. "It's a false choice, Granddad. You're saying I either treat my future self like a stranger, or I admit time matters."
  >
  > "Those are the arithmetic options."
  >
  > "No, they're the actuarial ones. You're forgetting the human ones." She gestured to the garden, to the oak tree he'd planted decades prior. "You planted that tree. You didn't plant the ones in the state forest. Does that mean the forest trees are worth less?"
  >
  > "No."
  >
  > "Right. But you water *this* one. Why? Because you're responsible for it. You put it there." She tapped the pension paper. "Saving for eighty-year-old you isn't about time. It's about responsibility. You're the one making him poor if you don't save. You aren't making the people in 2080 poor single-handedly. You're just... part of the crowd."
  >
  > He paused. The distinction hung in the air.
  >
  > "So prudence is special?" he asked quietly.
  >
  > "Prudence is ownership," she said. "Morality is impartiality. You can keep your pension, Granddad. You've earned the right to look after the man you're becoming. But don't pretend that gives you licence to steal from the people who are coming after him."

  ### Why This Works

  1.  **It preserves Premise (1):** The moral worth of the future people remains undiminished.
  2.  **It validates him:** It acknowledges his pension is rational, so he doesn't look foolish, just mistaken in his extrapolation.
  3.  **It creates nuance:** She admits we have special duties to ourselves (and our own 'projects'), which makes her a realistic protagonist rather than a moralising mouthpiece.
  4.  **It fits the characters:** An actuary understands 'liability' and 'causality'. Framing the pension as a liability he owes to his future self speaks his language better than abstract ethics.

  By attacking Step (6) and introducing the distinction between **causal responsibility** (self) and **moral impartiality** (others), she escapes the corner without backing down.
