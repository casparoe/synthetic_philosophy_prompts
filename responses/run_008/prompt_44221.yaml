      *   *Diagnosis 2: The Reference Class Problem & Premise 2 Nuance.* Premise 2 is the engine of the induction. The user wants to keep it. I need to show how to keep it but restrict the reference class or the nature of the "confidence" to avoid the self-defeat. This connects to the "Defeater-only" reading vs. "Positive Skepticism."
