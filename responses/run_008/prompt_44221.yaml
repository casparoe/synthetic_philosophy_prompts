      *   *Premise 3 Attack:* Were past theories *really* false? Or just limited? (Kuhnian incommensurability).
      *   *Presupposition of Progress:* To say past theories were false presupposes current theories are truer (Putnam's point).
      *   *Local vs. Global:* Maybe PMI applies globally but not locally to specific mechanisms.
      *   *Bayesian Update:* How does prior probability interact with the base rate of failure?
