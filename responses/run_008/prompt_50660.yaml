  2.  **Deconstruct the Core Philosophical Tension:**
      *   *Precommitment:* Past self binds future self (Code freeze, Ulysses contract, Constitution).
      *   *Revocability:* Present self overrides past self (Medical consent, Contract withdrawal).
      *   *Tension:* Why is binding the future self okay in some cases but not others?
      *   *Implicit Theory:* Autonomy is not merely about momentary choice but about governing one's life narrative according to stable values, especially when future states are predictably compromised or volatile.

  3.  **Evaluate Candidate Views:**
      *   *Authentic Self:* Lucid past > Compromised present. (Fits psychiatry well, fits code less clearly unless "pressure" = compromise).
      *   *Interests vs. Preferences:* Past self knows long-term interests better. (Fits all three).
      *   *Extended Self:* Authority is distributed over time. (Fits all three).
      *   *Requirement:* Do practices *strictly require* one? No, they are compatible with multiple, but "Extended Self + Competence Asymmetry" is the strongest unifier.

  4.  **Address the Inconsistency:**
      *   Is there a single principle? Yes: Consent is valid when the agent is competent and acting on stable values. Precommitment is allowed when the future self is predictably less competent (psychosis, panic during deploy) or when the cost of reversal is catastrophic (constitutional rights, data loss). Revocability is the default when competence is stable and costs are low.
      *   *Principle:* Autonomy respects the *competent* self's long-term governance, not just the *present* self's immediate whim.

  5.  **Sketch Alternative (Present Consent Only):**
      *   No code freezes (deploy anytime).
      *   No Ulysses contracts (patient refuses = stop).
      *   No Constitutions (simple majority rules always).
      *   Result: High volatility, risk of regret, potential harm.

  6.  **Analyze the Team's Rule ("Reversibility beats Preapproval"):**
      *   *Precommitment (Gates):* Prevents action. Assumes future self might be wrong/pressed.
      *   *Reversibility (Kill Switch):* Allows action, mitigates harm. Assumes future self can act, but errors can be undone.
      *   *Comparison:* Legal/Psych precommitment is often about *preventing* irreversible harm where reversal is impossible (death, rights violation, data deletion). The team's rule assumes reversibility is possible.
      *   *Difference:* The team's rule prioritizes *velocity* within a safety net, whereas constitutional/psychiatric precommitment prioritizes *constraint* because reversal is impossible or too costly. They share the goal of protecting interests but differ on the mechanism (block vs. undo).

