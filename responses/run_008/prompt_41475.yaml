prompt: |-
  I'm a novelist, four books in, and I've been trying to figure out when I should trust my own read on my work versus when I should step back and go by the statistics — the outside view, I think people call it. My gut verdicts, honestly: on my debut I was convinced I'd written something brilliant, and the base rate for debut novelists who feel that way should have humbled me but didn't, and the book was mediocre. On my second novel I was sure it was a mess and almost shelved it, and it's the best thing I've done, so there the inside view was worthless even though it was negative. Halfway through my third I switched from third person to first on a pure hunch, even though everyone knows late pov changes sink a draft, and it worked, and I'd do it again. But when a friend in my workshop asks if his book is any good, I give him the outside-view answer — his last two books sold badly, his agent is cooling on him — and that feels right to me, yet when my agent does the same thing to me ("literary books about grief don't sell right now") it feels like he's not even reading the book, and I resent it. Meanwhile if every beta reader tells me a scene doesn't work and I love the scene, I cave — I trust that aggregated outside view over my inside one, no resentment at all. And there's one place I flatly refuse the outside view: I write long, weird, genre-bending books, and the base rates there are brutal, and I've decided I just don't care. Is there any principle that gets all these verdicts, or something close, and does it survive my current situation: fifth book, inside view says it's the real thing, outside view says this kind of book almost always fails commercially but occasionally becomes a cult classic? If a principle can't save every verdict, tell me which ones have to go and why, and please answer in American English.
reasoning: |-
  Here's a thinking process that leads to the suggested advice:

  1.  **Analyze the User and the Request:**
      *   **User:** A novelist with four books published. Experienced but struggling with decision-making regarding their work.
      *   **Core Conflict:** Inside View (gut, intuition, personal connection to the work) vs. Outside View (statistics, market trends, agent advice, beta reader consensus, past performance).
      *   **Specific Scenarios Provided:**
          1.  Debut: Inside (brilliant) vs. Outside (mediocre reality). *Result: Inside failed.*
          2.  Second Novel: Inside (mess) vs. Outside (best work). *Result: Inside failed (false negative).*
          3.  Third Novel (POV switch): Inside (hunch) vs. Outside (conventional wisdom). *Result: Inside succeeded.*
          4.  Friend's Workshop: User gives Outside View (sales history). *Result: Feels right.*
          5.  Agent's Advice: Outside View (market trends) vs. User's Inside View. *Result: Resentment.*
          6.  Beta Readers: Outside View (consensus) vs. User's Inside View (love the scene). *Result: User caves/trusts Outside.*
          7.  Genre/Style Choice: Outside View (brutal base rates) vs. Inside View (commitment). *Result: User refuses Outside.*
          8.  Current Situation (Book 5): Inside ("the real thing") vs. Outside (commercial failure/cult classic odds).
      *   **Goal:** Find a unifying principle to navigate these verdicts. If none exists, identify which verdicts must be discarded.
      *   **Constraint:** Answer in American English.

  2.  **Deconstruct the Tension (Inside vs. Outside):**
      *   *Inside View:* Essential for creativity, voice, risk-taking, and endurance. Without it, the art dies.
      *   *Outside View:* Essential for craft refinement, audience connection, and career sustainability. Without it, the art becomes self-indulgent or invisible.
      *   *The Paradox:* The user applies the views inconsistently. They resent the Outside View when it threatens their *vision* (agent/market) but accept it when it threatens their *craft* (beta readers) or when judging *others* (friend).

  3.  **Search for a Unifying Principle:**
      *   *Idea 1: "Trust your gut on art, trust data on business."*
          *   Problem: The beta reader scenario blurs this. Beta readers are about craft/reader experience (art), yet the user trusts the Outside View there. The agent scenario is business, but feels like a judgment on the art.
      *   *Idea 2: "The Control Test."*
          *   What can you control? You control the writing (Inside). You don't control the market (Outside).
          *   Problem: Doesn't explain why the POV switch worked (risk) or why the friend's sales history matters.
      *   *Idea 3: "The Phase of Creation."*
          *   Drafting = Inside. Editing = Outside (beta readers). Marketing = Outside.
          *   Problem: The agent's comment ("books about grief don't sell") happens during the process, not just at marketing.
      *   *Idea 4: "The Stakeholder Alignment."*
          *   Who is the Outside View serving?
          *   Beta readers: Serving the *reader's experience*.
          *   Agent: Serving the *market's wallet*.
          *   Friend: Serving *reality check*.
          *   Self (Debut/2nd): Serving *ego/fear*.
      *   *Idea 5 (The Winner): "The Locus of Value."*
          *   Distinguish between *Execution* (Craft/Clarity) and *Conception* (Vision/Choice).
          *   Outside View is for **Execution** (Is this clear? Does this land? Is this readable?).
          *   Inside View is for **Conception** (Is this worth writing? Is this my voice? Is this risk necessary?).
          *   *Wait, refinement:* The beta reader issue is about a *scene*. That's execution. The agent issue is about *genre/topic*. That's conception/market fit. The friend issue is about *career trajectory*. That's probability.
          *   *Better Principle:* **The "Why" of the Feedback.**
          *   Trust the Outside View when it identifies *unintended effects* (confusion, boredom).
          *   Trust the Inside View when it defends *intended risks* (weirdness, genre-bending, difficult themes).
          *   *Wait, let's look at the resentment:* Why resent the agent but trust beta readers? Because beta readers talk about the *text*, the agent talks about the *container*.
          *   *Hypothesis:* Trust Outside on **Clarity/Connection**, Trust Inside on **Vision/Selection**.

  4.  **Drafting the Principle:**
      *   Let's call it the **"Intent vs. Impact"** principle.
      *   *Inside View* governs **Intent** (What am I trying to do? Is this book worth existing?).
      *   *Outside View* governs **Impact** (Is it landing? Is it readable? Is it sellable?).
      *   *Correction:* The user refuses Outside View on genre base rates (Book 4 scenario). That's a Vision choice. That fits "Intent."
      *   The user accepts Outside View on Beta Readers (Scene doesn't work). That's Impact.
      *   The user resents Agent (Market trends). That's Impact (sales), but feels like a judgment on Intent.
      *   The user gave Friend Outside View (Sales history). That's Probability of Impact.

      *   *Refined Principle:* **The Domain of Authority.**
      *   **Domain 1: The Work Itself (Craft & Experience).** Here, the Outside View (readers) is the ultimate authority on *effect*, but the Inside View is the authority on *purpose*. If readers say "I'm bored," that's data. If you say "It's supposed to be slow," that's intent. You must negotiate this.
      *   **Domain 2: The Career (Market & Probability).** Here, the Outside View is the ultimate authority on *truth*, but the Inside View is the authority on *tolerance*. The agent is right about sales stats. You are right about your willingness to endure failure for art.
      *   **Domain 3: The Creative Spark (Vision).** Here, the Inside View is the *only* authority. (The POV switch).

      *   *Let's try to synthesize this into a single heuristic.*
      *   **The Principle of "Calibration vs. Constitution."**
      *   Use the Outside View to **Calibrate** (fix bugs, ensure communication, understand odds).
      *   Use the Inside View to determine **Constitution** (what the book *is*, whether you write it, whether you persist).
      *   *Test against scenarios:*
          *   Debut (Brilliant vs. Mediocre): Inside failed on Calibration. Thought it was calibrated, wasn't.
          *   2nd Novel (Mess vs. Best): Inside failed on Calibration (thought it was broken), but succeeded on Constitution (kept writing).
          *   3rd Novel (POV): Inside succeeded on Constitution (vision).
          *   Friend: Outside used for Calibration (reality check).
          *   Agent: Outside used for Calibration (market odds). User resents it because it feels like a judgment on Constitution.
          *   Beta Readers: Outside used for Calibration (scene mechanics). User accepts it.
          *   Genre Choice: Inside used for Constitution (I will write this regardless).
          *   Book 5: Inside says Constitution is strong. Outside says Calibration (market) is bad.

  5.  **Addressing the Current Situation (Book 5):**
      *   Inside: "The real thing." (Constitution)
      *   Outside: "Fails commercially/Cult classic." (Calibration/Probability)
      *   *Advice:* Trust the Inside on *writing it*. Trust the Outside on *expecting the outcome*.
      *   The conflict arises when we let the Outside View dictate the Constitution (don't write it) or the Inside View dictate the Calibration (it will sell).
      *   *The Verdict to Discard:* You must discard the expectation that the Outside View validates the *worth* of the book. You must also discard the expectation that the Inside View predicts the *reception* of the book.

  6.  **Structuring the Response:**
      *   **Acknowledge the expertise:** Four books in is a serious career. This isn't beginner anxiety; it's strategic friction.
      *   **Propose the Principle:** "Constitution vs. Calibration." (Or maybe "Vision vs. Vector"? No, Constitution/Calibration is clearer). Let's go with **"Vision vs. Verification."**
          *   *Vision (Inside):* What the book is, why it exists, the risk worth taking.
          *   *Verification (Outside):* Does it communicate? What are the odds? How does it land?
      *   **Apply to History:** Walk through the user's examples to show how the principle fits.
          *   Debut: Confused Vision with Verification.
          *   2nd Book: Failed Verification check, but Vision held.
          *   POV Switch: Pure Vision.
          *   Beta Readers: Verification of communication.
          *   Agent: Verification of market. Resentment comes from treating market verification as Vision judgment.
          *   Friend: Verification of probability.
      *   **Address Book 5:**
          *   Vision: Write it.
          *   Verification: Accept the odds.
          *   The Trap: Don't let Verification kill Vision. Don't let Vision deny Verification.
      *   **What to Discard:**
          *   Discard the hope that the Inside View predicts success.
          *   Discard the resentment that the Outside View predicts the market.
          *   Discard the idea that "Cult Classic" is a plan. It's a hope.
      *   **Tone:** Professional, empathetic, direct, American English (no British spellings/idioms).

  7.  **Refining the Principle Name:**
      *   "Constitution vs. Calibration" is a bit dry.
      *   "Creation vs. Reception"?
      *   "The Internal Compass and the External Map."
      *   Let's stick with a functional distinction: **"The Domain of Creation vs. The Domain of Consequence."**
      *   Actually, the clearest distinction is **"Quality of Experience" (Inside) vs. "Quality of Communication/Market" (Outside).**
      *   Let's try: **The Principle of Sovereignty vs. Data.**
      *   No, let's go with **"The Maker's Privilege vs. The Reader's Reality."**
      *   Okay, I think the strongest framing is **"Intent (Inside) vs. Effect (Outside)."**
      *   *Wait, one more angle:* Daniel Kahneman's Inside/Outside view is specifically about forecasting. The user is misapplying it to *quality assessment*.
      *   *Key Insight:* The Outside View is good for **Prediction** and **Blind Spots**. The Inside View is good for **Motivation** and **Aesthetic Truth**.
      *   *The Principle:* **Use the Outside View to predict outcomes and find blind spots. Use the Inside View to generate value and sustain effort.**
      *   *Why the resentment?* Because the agent is using Outside View to judge *Value* (which is Inside), not just *Outcome*.
      *   *Why the beta reader trust?* Because they are identifying *Blind Spots* (Outside), not judging *Value*.

      *   *Finalizing the Principle:* **The "Blind Spot vs. North Star" Rule.**
      *   Inside View = North Star (Direction, Meaning, Drive).
      *   Outside View = Blind Spot Check (Clarity, Market Reality, Unintended Effects).
      *   *Application:* You resent the agent because they are using a Blind Spot check to question your North Star. You trust beta readers because they are checking for Blind Spots in execution.

      *   *Wait, I need to be careful.* The user says "Outside view says this kind of book almost always fails." That is a prediction. The Inside view says "It's the real thing." That is a valuation.
      *   *Advice:* Trust Inside on Valuation. Trust Outside on Prediction.
      *   *Conflict:* If the prediction is failure, does the valuation matter? Yes, if you accept the risk.
      *   *Verdict to drop:* Drop the expectation that Valuation influences Prediction. Drop the resentment that Prediction influences Valuation.

      *   *Let's write.*

      *   *Structure:*
          1.  Validate the position (4 books is a lot of data).
          2.  Define the Principle: **"Sovereignty over Purpose, Submission to Effect."** (Or similar). Let's go with **"Vision vs. Verification."**
          3.  Map the history to the principle.
          4.  Address the Agent/Beta Reader discrepancy (The "Why" of the feedback).
          5.  Address Book 5 specifically.
          6.  Identify what must be discarded.

      *   *Self-Correction on Tone:* Keep it sharp. This writer is experienced. Don't coddle. Use industry terms correctly. American English (e.g., "fiction," "manuscript," "check," not "cheque").

      *   *Final Polish on the Principle:*
          *   **Inside View = The Engine.** (Why write? What is it?)
          *   **Outside View = The Navigation.** (Where is it going? Will it crash?)
          *   *Rule:* Never let Navigation kill the Engine. Never let Engine ignore the Map.
          *   *Resentment Source:* Agent is using Navigation to say "Turn off the Engine."
          *   *Beta Reader Source:* They are saying "You're driving off the road."
          *   *Friend Source:* You are acting as Navigation for them.

      *   *Okay, ready to draft.*

      *   *Wait, one nuance:* The user says "Halfway through my third I switched... on a pure hunch." That's Inside View overriding Outside View (conventional wisdom). That worked. Why? Because it was a *craft* decision, not a *market* decision.
      *   *Refinement:* Inside View rules **Craft & Vision**. Outside View rules **Market & Probability**.
      *   *Exception:* Beta readers are Craft, but User trusts Outside. Why? Because Beta Readers measure *Reader Experience*, which is the bridge between Craft and Market.
      *   *Okay, the distinction is:* **Subjective Truth (Inside)** vs. **Objective Effect (Outside).**
      *   *You decide the Truth. The World decides the Effect.*
      *   *Agent:* Talking about Effect (Sales).
      *   *Beta Readers:* Talking about Effect (Confusion/Boredom).
      *   *User:* Talking about Truth (This is good/This is the one).
      *   *Conflict:* User wants Effect to validate Truth. Agent says Effect won't validate Truth.
      *   *Solution:* Decouple them.

      *   *Okay, I have the core argument.*
      *   1. Distinguish **Truth** (Inside) from **Effect** (Outside).
      *   2. Resentment comes when Effect is used to negate Truth.
      *   3. Trust comes when Effect is used to refine Communication.
      *   4. Book 5: Pursue Truth, Accept Effect.

      *   *Let's finalize the "What to discard" section.*
      *   Discard the hope that "The Real Thing" guarantees commercial success.
      *   Discard the resentment that market stats are impersonal.
      *   Discard the idea that you can control the Outside View.

      *   *American English Check:* "Novelist," "Manuscript," "Agent," "Beta readers," "Color," "Realize," "Program." (Avoid "Colour," "Realise," "Programme").

      *   *Final check on the "Principle":* I'll call it **"The Sovereignty of Intent, The Authority of Impact."**
      *   Intent = Inside. Impact = Outside.
      *   You own Intent. The World owns Impact.
      *   Agent is talking Impact. Beta readers are talking Impact (on reader). You are talking Intent.
