prompt: |-
  Last night my friend and I had a long argument about what Harsanyi's work actually establishes, and I left it unable to tell how much of what he said to believe. My friend is a graduate student in economics, very confident, and at one point he laid out the whole case in a paragraph I more or less memorized because it sounded so tidy. As I recall it, he said: Harsanyi showed back in the fifties that utilitarianism is not just a moral intuition but a theorem — if every individual has von Neumann–Morgenstern preferences, if society's preferences satisfy those same axioms, and if social preferences never contradict a unanimous individual preference, then social welfare must be a sum of individual vNM utilities; and since vNM utilities are cardinal rather than ordinal, the ancient objection that you cannot add one person's utility to another's dissolves, because the theorem supplies precisely the common scale that utilitarians were always accused of lacking. He then added that the same argument shows that a rational agent behind a veil of ignorance, not knowing which person in society it will be, must choose to maximize average utility, which means Rawls, starting from his own original position, simply draws the wrong conclusion from his own setup — maximin would be rational only for someone with essentially infinite risk aversion, which no agent satisfying the vNM axioms could have.

  I argued back for a while but mostly on moral grounds, and I could tell he thought I was changing the subject. Two things nag at me, though. First, I have a vague memory that cardinal utility in the vNM sense is only unique up to a positive affine transformation for each person separately, which sounds like it might matter for the "common scale" claim, but he brushed this off. Second, I also have a vague sense that Harsanyi gave two different arguments — one about aggregating individual preferences, and a separate one about a single impartial observer choosing under uncertainty — and I don't know whether it's legitimate to run them together the way my friend did. I don't know where the real errors are, if there are any; the summary sounded professionally competent, and I'm inclined to believe at least the mathematical part.

  Could you go through his summary claim by claim and tell me what a welfare economist or a Harsanyi scholar would accept, what they would wince at, and what they would reject outright? In particular, I'd like to know whether the interpersonal-comparability step is as innocent as he made it sound, whether the veil-of-ignorance point is genuinely part of the same theorem or a distinct argument with different assumptions, and whether the conclusion he drew — that utilitarianism has a mathematical proof and that Rawls's maximin is thereby refuted on Rawls's own terms — actually follows from whichever parts of the summary turn out to be accurate. If some of it needs repairing, I'd also appreciate a corrected version of the paragraph that a careful defender of Harsanyi would be willing to sign.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** The user had an argument with an economics grad student friend about John Harsanyi's work (specifically his utilitarian theorems).
      *   **Friend's Claim:** Harsanyi proved utilitarianism is a theorem. If individuals and society have vNM preferences + Pareto efficiency, social welfare = sum of individual vNM utilities. This solves interpersonal comparison (common scale). Also, a rational agent behind a veil of ignorance must maximize average utility (refuting Rawls's maximin).
      *   **User's Doubts:**
          1.  vNM utility is unique only up to positive affine transformation *per person*. Does this break the "common scale" claim?
          2.  Did Harsanyi give two different arguments (aggregation vs. impartial observer)? Is it legitimate to conflate them?
          3.  Does this actually prove utilitarianism or refute Rawls?
      *   **Task:** Evaluate the friend's summary claim-by-claim. Identify what's accepted, what's controversial/wince-worthy, and what's rejected. Address the interpersonal comparability issue, the two arguments distinction, and the Rawls refutation claim. Provide a corrected paragraph.

  2.  **Deconstruct the Friend's Claims:**

      *   *Claim 1: Harsanyi showed utilitarianism is a theorem.*
          *   **Status:** Technically true regarding the *Aggregation Theorem* (1955), but "utilitarianism is a theorem" is a strong philosophical overstatement. It proves a specific *representation* of social welfare, not necessarily the moral truth of utilitarianism.
      *   *Claim 2: Conditions (vNM individuals, vNM society, Pareto/unanimity).*
          *   **Status:** Accurate description of the Aggregation Theorem assumptions.
      *   *Claim 3: Social welfare must be a sum of individual vNM utilities.*
          *   **Status:** Accurate conclusion of the Aggregation Theorem (weighted sum).
      *   *Claim 4: vNM utilities are cardinal, so the objection about adding utilities dissolves because the theorem supplies a common scale.*
          *   **Status:** **Major Red Flag.** This is the crux of the user's first doubt. vNM utility is cardinal *for an individual* (unique up to affine transformation $a + bU$). But *between* individuals, the scales are not automatically aligned. You can't just add $U_1$ and $U_2$ without fixing the zero points and units across persons. The theorem *assumes* the social welfare function exists and satisfies vNM axioms, which implicitly imposes a weighting, but it doesn't *derive* interpersonal comparability from thin air. It pushes the problem back to the weights.
      *   *Claim 5: Rational agent behind veil of ignorance must maximize average utility.*
          *   **Status:** This refers to the *Impartial Observer Theorem* (1953/1955). It is a distinct argument from the Aggregation Theorem.
      *   *Claim 6: Rawls's maximin is refuted because it implies infinite risk aversion.*
          *   **Status:** This is Harsanyi's specific critique of Rawls. It is logically consistent *within* the vNM framework. However, Rawls explicitly rejects the vNM framework for the Original Position (arguing it's not a decision under risk but uncertainty, or that the stakes are too high for expected utility). So, it's a refutation *if* you accept Harsanyi's modeling of the Original Position, which Rawls does not.

  3.  **Address the User's Specific Doubts:**

      *   *Doubt 1: Affine transformations and common scale.*
          *   The friend is glossing over the "weighting" problem. The Aggregation Theorem says $W = \sum a_i U_i$. The $a_i$ are weights. To determine $a_i$, you need interpersonal comparison. The theorem doesn't solve interpersonal comparison; it *requires* a specific structure that allows it, but the scaling constants remain arbitrary without further ethical assumptions (like equal weights).
      *   *Doubt 2: Two different arguments.*
          *   Yes, there are two distinct theorems:
              1.  **Aggregation Theorem:** Given individual preferences and a social preference satisfying Pareto + vNM, Social Welfare is a linear combination of individual utilities.
              2.  **Impartial Observer Theorem:** An observer who has an equal chance of being anyone maximizes average utility.
          *   They are related but distinct. Conflating them is common but technically imprecise.

  4.  **Drafting the Evaluation (Claim-by-Claim):**

      *   *Intro:* Acknowledge the friend's summary is "standard econ shorthand" but misses philosophical nuance.
      *   *Point 1 (Theorem status):* Acceptable shorthand, but philosophically loaded.
      *   *Point 2 (Assumptions):* Accurate.
      *   *Point 3 (Sum of utilities):* Accurate (weighted sum).
      *   *Point 4 (Interpersonal Comparability - The Big One):* **Reject/Winces.** This is the weakest link. vNM cardinality is intra-personal, not inter-personal. The theorem doesn't fix the units across people. It shows that *if* you have a social welfare function satisfying vNM, it *looks* like utilitarianism, but the weights are still ethically loaded. It doesn't "dissolve" the objection; it relocates it.
      *   *Point 5 (Veil of Ignorance):* **Winces.** This is the Impartial Observer argument, distinct from the Aggregation argument.
      *   *Point 6 (Rawls/Maximin):* **Contested.** Valid within vNM, but Rawls rejects vNM for the Original Position. It's a "begging the question" refutation.

  5.  **Refining the Interpersonal Comparability Issue:**
      *   Need to explain *why* affine transformations matter. If $U_1$ is in "hedons" and $U_2$ is in "dollars," adding them is nonsense. vNM gives $U_1$ a scale and $U_2$ a scale, but not a conversion rate. Harsanyi assumes equal weights (utilitarianism) as an ethical postulate, not a mathematical derivation. The math says "Weighted Sum," ethics says "Equal Weights."

  6.  **Refining the Rawls Critique:**
      *   Harsanyi argues rational choice under risk = Expected Utility.
      *   Rawls argues the Original Position is not "risk" (no probabilities known) or that the stakes (basic liberties) make EU inappropriate.
      *   So Harsanyi refutes a *vNM-version* of Rawls, not necessarily Rawls's actual considered view.

  7.  **Constructing the "Corrected Paragraph":**
      *   Needs to be precise.
      *   Distinguish Aggregation vs. Impartial Observer.
      *   Clarify that interpersonal weights are ethical assumptions, not mathematical necessities.
      *   Soften the Rawls refutation to "incompatible with vNM rationality."

  8.  **Review against Constraints:**
      *   Tone: Professional, analytical, empathetic to the user's confusion.
      *   Content: Welfare economics perspective, Harsanyi scholarship.
      *   Specifics: Address affine transformations, two arguments, Rawls.

  9.  **Self-Correction/Nuance Check during drafting:**
      *   *Did Harsanyi claim the weights are derived?* In the Impartial Observer argument, he argues for equal probability, which implies equal weights *if* utilities are normalized. But normalization is the tricky part.
      *   *Is vNM utility cardinal?* Yes, but only up to affine transformation.
      *   *Does the Aggregation Theorem prove Utilitarianism?* It proves the social welfare function is *linear* in individual utilities. Utilitarianism adds the ethical constraint that weights are equal. The theorem allows for weighted utilitarianism (prioritarianism, etc., depending on weights).
      *   *Make sure to mention Sen.* Amartya Sen is the big critic here regarding informational bases.

  10. **Final Polish:** Organize into clear sections: "The Verdict," "Claim-by-Claim Breakdown," "The Two Big Technical Issues," "The Rawls Dispute," and "The Corrected Paragraph." (This matches the user's request structure).

  **(Self-Correction on the "Common Scale" claim):** I need to be very clear here. The friend claimed the theorem *supplies* the common scale. This is false. The theorem shows that *if* social preferences satisfy vNM axioms, then social welfare is a weighted sum. But to interpret that sum as *moral* utilitarianism, you need to fix the weights. The vNM axioms do not fix the weights across individuals. The "common scale" is not supplied by the math; it's supplied by the ethical assumption that everyone counts equally (which fixes the weights relative to the scales). Actually, even deeper: vNM utilities are not comparable across persons *at all* without an extra assumption. The Aggregation Theorem essentially says "The only way to aggregate vNM preferences into a vNM social preference respecting Pareto is via a weighted sum." It does *not* say the weights must be equal, nor does it solve the measurement problem of comparing $U_i$ to $U_j$. Harsanyi adds the ethical postulate of equal weights separately. I must emphasize this distinction.

  **(Self-Correction on Rawls):** Harsanyi's critique is that Maximin is irrational *under risk*. Rawls argues the Original Position is not a situation of risk (where probabilities are known) but uncertainty (where they are not), or that the "strains of commitment" rule out gambling with basic rights. So Harsanyi's refutation holds only if you accept his modeling of the Original Position as a vNM lottery with equal probabilities.

  Okay, ready to write.
answer: |-
  Your friend's summary is a classic piece of "economics department folklore." It is technically sophisticated enough to sound authoritative, but it elides several crucial distinctions that philosophers and careful welfare economists consider fatal to the strong conclusion he drew. You were right to be nagged by those two points; they are exactly where the argument leaks.

  Here is a breakdown of what a Harsanyi scholar or welfare economist would accept, wince at, or reject in your friend's paragraph, followed by a corrected version.

  ### Claim-by-Claim Evaluation

  **1. "Harsanyi showed... that utilitarianism is not just a moral intuition but a theorem."**
  *   **Verdict:** **Winces.**
  *   **Analysis:** Economists often speak loosely here. Harsanyi proved *representation theorems*. He showed that *if* you accept certain axioms, your social welfare function *looks like* a utilitarian sum. He did not prove that utilitarianism is morally true, only that it is the unique solution to a specific mathematical problem. Calling it a "theorem of utilitarianism" conflates a mathematical result with a moral conclusion.

  **2. "If every individual has von Neumann–Morgenstern (vNM) preferences, if society's preferences satisfy those same axioms, and if social preferences never contradict a unanimous individual preference [Pareto]..."**
  *   **Verdict:** **Accepts.**
  *   **Analysis:** This is an accurate statement of the assumptions of Harsanyi's **Aggregation Theorem** (1955).

  **3. "...then social welfare must be a sum of individual vNM utilities."**
  *   **Verdict:** **Accepts (with a caveat).**
  *   **Analysis:** The theorem concludes that social welfare is a *weighted* linear sum of individual utilities ($W = \sum a_i U_i$). It does not dictate that the weights ($a_i$) must be equal. To get standard utilitarianism (where everyone counts for one), you need an additional ethical assumption that the weights are identical.

  **4. "...since vNM utilities are cardinal rather than ordinal, the ancient objection that you cannot add one person's utility to another's dissolves, because the theorem supplies precisely the common scale..."**
  *   **Verdict:** **Rejects Outright.**
  *   **Analysis:** This is the most serious error in your friend's summary, and your intuition about affine transformations was correct.
      *   **The Problem:** vNM utility is cardinal *intrapersonally* (for one person, the difference between 10 and 20 might mean the same as 30 and 40), but it is *not* cardinal *interpersonally* without further assumptions.
      *   **Affine Transformations:** Person A's utility is unique up to $a + bU_A$. Person B's is unique up to $c + dU_B$. The theorem does not fix $b$ relative to $d$. You can stretch Person A's scale arbitrarily relative to Person B's without violating any vNM axioms.
      *   **The Consequence:** The math does not "supply a common scale." It merely shows that *if* you can compare utilities, the aggregation must be linear. Harsanyi had to add an *ethical postulate* (that all individuals' utility scales should be normalized equally) to solve the interpersonal comparison problem. The theorem itself does not dissolve the objection; it pushes the problem back to the choice of weights.

  **5. "He then added that the same argument shows that a rational agent behind a veil of ignorance... must choose to maximize average utility..."**
  *   **Verdict:** **Winces (Conflation).**
  *   **Analysis:** This is a **distinct argument** (the **Impartial Observer Theorem**, 1953), not the "same argument" as the Aggregation Theorem.
      *   **Aggregation Theorem:** Takes existing individual preferences and asks how to combine them into a social preference.
      *   **Impartial Observer:** Asks a single individual to imagine they have an equal probability of becoming any member of society.
      *   While they lead to similar conclusions, running them together as "the same argument" obscures the assumptions. The Impartial Observer argument relies on the assumption that the observer assigns *equiprobability* to being anyone. That is a substantive assumption, not a logical necessity of the veil of ignorance itself.

  **6. "...which means Rawls... simply draws the wrong conclusion from his own setup — maximin would be rational only for someone with essentially infinite risk aversion..."**
  *   **Verdict:** **Contested/Context-Dependent.**
  *   **Analysis:** This is Harsanyi's specific critique of Rawls, and it is logically valid *within the vNM framework*. If you model the Original Position as a decision under *risk* (where you know the probabilities, e.g., $1/N$ chance of being anyone) and you accept vNM rationality, then Maximin is indeed irrational (it violates the continuity axiom).
      *   **However:** Rawls explicitly rejects the vNM framework for the Original Position. He argues the choice involves fundamental liberties where probabilistic calculation is inappropriate (or that the probabilities are unknown, making it uncertainty, not risk). Therefore, Harsanyi refutes a *vNM-model of Rawls*, not necessarily Rawls's actual considered view. Your friend presents this as a definitive refutation "on Rawls's own terms," but Rawls would deny those terms apply.

  ---

  ### The Two Big Technical Issues

  You asked specifically about the interpersonal comparability and the two arguments. Here is the technical detail you need to hold your own.

  #### 1. The Interpersonal Comparability Trap
  Your friend claimed the theorem solves the "common scale" problem. It does not.
  In vNM theory, if $U(x)$ represents my preferences, then $V(x) = 2U(x) + 10$ represents the *exact same* preferences. Both are valid vNM utility functions for me.
  Now consider you. Your valid functions are $U'(x)$ and $V'(x) = 0.5U'(x) - 100$.
  If we try to add our utilities to find social welfare, do we add $U + U'$? Or $V + V'$? Or $U + V'$?
  The math gives different results for social ranking depending on which valid representation we pick.
  **Harsanyi's Fix:** Harsanyi acknowledged this. He argued we must *ethically* agree to normalize everyone's utility scales (e.g., set the worst outcome to 0 and best to 1 for everyone) before summing. That normalization is a moral choice, not a mathematical derivation. Your friend's claim that the *theorem* supplies the scale is false; the *ethical commitment to utilitarianism* supplies the scale.

  #### 2. Aggregation vs. Impartial Observer
  Your friend ran these together. They are distinct:
  *   **Aggregation (1955):** Starts with *actual* diverse preferences of people in society. Asks: Is there a social preference that respects Pareto and vNM axioms? Answer: Yes, a weighted sum.
  *   **Impartial Observer (1953):** Starts with a *single* moral judge. Asks: What if this judge doesn't know who they are? Answer: They maximize expected utility, which equals average utility.
  *   **Why it matters:** The Aggregation Theorem is more robust descriptively (it handles actual preferences), but the Impartial Observer is more foundational normatively (it explains *why* we should care about the sum). Conflating them hides the fact that the "veil of ignorance" logic relies on the equiprobability assumption, which is not present in the Aggregation Theorem.

  ---

  ### Does the Conclusion Follow?

  **"Utilitarianism has a mathematical proof."**
  No. It has a mathematical representation *conditional on* accepting vNM rationality for social choices and an ethical commitment to equal weighting. If you reject vNM for social choices (e.g., you think society should be more risk-averse than individuals), the theorem breaks.

  **"Rawls's maximin is thereby refuted on Rawls's own terms."**
  No. It is refuted only if you accept Harsanyi's modeling of the Original Position as a vNM lottery with known probabilities. Rawls argues the Original Position is not a lottery but a device of representation where probabilistic calculation is excluded by the nature of the stakes (basic justice). Harsanyi shows Rawls is inconsistent with *expected utility theory*; Rawls replies that expected utility theory is inappropriate for *justice*.

  ---

  ### A Corrected Paragraph

  If you want a version of your friend's summary that a careful defender of Harsanyi (like a modern welfare economist or a scholar of his work) would actually sign, it should look like this:

  > "Harsanyi established two influential results in the 1950s that provide a formal foundation for utilitarianism. First, his **Aggregation Theorem** shows that if individuals and society both satisfy the von Neumann–Morgenstern axioms of rationality, and if social preferences respect the Pareto principle, then social welfare must be represented as a weighted sum of individual utilities. Second, his **Impartial Observer Theorem** argues that a rational moral agent choosing behind a veil of ignorance—assigning an equal probability to occupying any social position—would maximize average utility.
  >
  > However, these theorems do not automatically solve the problem of interpersonal comparison. While vNM utilities are cardinal for each individual, they are not automatically comparable across persons; Harsanyi supplemented the math with an ethical postulate that individual utility scales should be normalized equally. Furthermore, while Harsanyi argued that Rawls's maximin principle is irrational within a vNM framework (implying infinite risk aversion), this critique assumes the Original Position can be modeled as a decision under risk with known probabilities, an assumption Rawls explicitly rejected. Thus, Harsanyi proves that utilitarianism is the unique consequence of combining vNM rationality with specific ethical commitments, rather than a freestanding mathematical truth."

  ### Summary for Your Next Argument
  You can tell your friend:
  1.  **On Scaling:** "vNM utility is unique only up to affine transformation *per person*. The Aggregation Theorem proves the social function is a weighted sum, but it doesn't fix the weights or the scales across persons. That requires an ethical assumption, not just math."
  2.  **On Rawls:** "Harsanyi refutes Maximin only if you model the Original Position as a vNM lottery. Rawls denies that model is appropriate for questions of basic justice. So it's not a refutation on Rawls's terms; it's a demonstration that Rawls and vNM rationality are incompatible."
  3.  **On the Theorems:** "You conflated the Aggregation Theorem with the Impartial Observer Theorem. They have different assumptions and do different work."

  Your friend's summary was "professionally competent" in the sense that it's what many economists say in the hallway, but it collapses under the scrutiny of a seminar room. Your doubts were well-founded.
