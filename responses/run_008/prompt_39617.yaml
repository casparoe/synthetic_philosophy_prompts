          *   *Critique:* This assumes the state at $t=2$ *must* be determined by the limit of the series. Benacerraf later showed this assumption is unwarranted. However, as an initial statement of the paradox, it's coherent. Is it *right*? Most contemporary philosophy of physics/math sides with Benacerraf here. Marta is asserting a strong metaphysical claim (logical impossibility) based on a lack of logical determination.
