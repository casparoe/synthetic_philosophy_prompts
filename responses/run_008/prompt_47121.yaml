          4.  Plutarchan trivial detail (Habit/Manner).
      *   *Mapping to Leaves:*
          1.  **Exemplarist:** Focus on admiration triggering moral concepts.
          2.  **Plutarchan:** Focus on comparison, nuance, flaws.
          3.  **Hagiographic:** Focus on inspiration despite/through fiction.
