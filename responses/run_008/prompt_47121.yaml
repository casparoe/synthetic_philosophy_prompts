          *   Q5: Rule vs. Story (Skeptic check).
          *   Q6: Flaws as Features (Plutarch check).
          *   Q7: Admiration vs. Truth (Exemplarist vs. Historian).
          *   Q8: Idealization (Hagiography check).
          *   Q9: Negative Exemplars (Plutarchan contrast).
          *   Q10: The "Why" of Reading (General orientation).
      *   *Scoring Key:* Needs to map A/B/C choices to the 5 leaves. *Challenge:* 10 questions to 5 views is tight. I need to ensure the options cluster logically. I will group the answers so that a pattern emerges, rather than a simple "Mostly A = View 1". Actually, a weighted system or a "Which column matches best" is better for a high school club. Let's try to make the options represent the *views* directly without naming them.
