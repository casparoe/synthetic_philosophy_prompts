      *   **Goal:** Sort students by *actual case judgments*, not theoretical labels.
      *   **Role:** Professional philosopher (expertise: ancient biography, virtue ethics, moral exemplarism).
      *   **Structure:**
          *   Part 1: Brainstorm underlying structure (diagnostic questions), build a taxonomy (positions, occupied/unoccupied combinations), explain *why* some are unoccupied.
          *   Part 2: Create a 10-question quiz (concrete cases, accessible language, ages 15-18). Specific case requirements included (mixed figure, invented episodes, non-emulatable virtue, trivial details).
          *   Scoring Key: Map patterns to 5 specific leaves (Exemplarist, Plutarchan, Hagiographic, Historian, Skeptic).
          *   Post-Quiz Analysis: Identify the single most sorting case and explain potential complaints from both sides.
      *   **Constraints:** Accessible language, no self-identification questions, honest flagging of indistinguishable views.

  2.  **Part 1: Theoretical Structure & Taxonomy:**
      *   *Goal:* Define the logical space before building the quiz.
