answer: |-
  ## Part One: The Logical Space of Moral Biography

  Before we can build a tool to sort your classmates, we need to map the terrain. You have correctly identified that people often hold inconsistent views until pressed by concrete cases. In philosophy, we call this a gap between *commitment* (what they say they believe) and *intuition* (how they react to scenarios).

  To build a robust taxonomy, I have refined your four diagnostic questions into the following three axes. These carve up the logical space more cleanly because they separate the *source* of morality from the *method* of learning.

  ### The Three Diagnostic Axes

  1.  **The Vehicle Question:** Is the primary carrier of moral value a **Person** (a concrete life to be encountered) or a **Principle** (an abstract rule to be applied)?
      *   *Why this matters:* This separates the Skeptic (Principles) from everyone else (Persons).
  2.  **The Veracity Question:** Does the story need to be **Factually True** to be morally useful, or is **Narrative Truth** (what feels inspiring or meaningful) sufficient?
      *   *Why this matters:* This separates the Historian (Facts) from the Hagiographer (Narrative).
  3.  **The Mechanism Question:** Do we learn by **Emulation** (copying the model) or by **Judgment** (comparing, contrasting, and critiquing)?
      *   *Why this matters:* This separates the Exemplarist/Hagiographer (Emulation) from the Plutarchan/Skeptic (Judgment).

  *(Note: I have folded your question about "Idealization" into the Mechanism question. If you believe we learn by emulation, you usually want idealization. If you learn by judgment, you need flaws to judge.)*

  ### The Taxonomy of Views

  By combining answers to these axes, we get five coherent positions (the "leaves" you requested) and a few empty spots.

  | View | Vehicle | Veracity | Mechanism | Description |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. The Skeptic** | Principle | Irrelevant | Judgment | Stories are anecdotes; only rules teach. |
  | **2. The Historian** | Person | **Factual** | Judgment | False stories corrupt judgment; we need data. |
  | **3. The Hagiographer** | Person | **Narrative** | Emulation | Idealized fiction inspires virtue better than truth. |
  | **4. The Exemplarist** | Person | Factual | Emulation | Real admiration for real people grounds morality. |
  | **5. The Plutarchan** | Person | Factual-ish | **Judgment** | We learn by comparing virtues *and* vices side-by-side. |

  ### Unoccupied Logical Space

  There are combinations of answers that nobody seems to hold. Here is why:

  *   **Combination:** *Vehicle: Principle + Veracity: Factual + Mechanism: Emulation.*
      *   **Status:** **Incoherent.** You cannot emulate a principle. You can only follow it. Emulation requires a person.
  *   **Combination:** *Vehicle: Person + Veracity: Factual + Mechanism: Emulation + Idealization: None.*
      *   **Status:** **Unattractive.** This is the "Realist Trap." If a person must be real (Factual) and you must copy them (Emulation), but they are not allowed to be idealized (No Flaws hidden), you are left with a model who is too messy to copy. Most people abandon either the "Factual" requirement (becoming Hagiographers) or the "Emulation" requirement (becoming Plutarchans).
  *   **Combination:** *Vehicle: Principle + Veracity: Narrative + Mechanism: Judgment.*
      *   **Status:** **Unexplored/Unstable.** This is the position of someone who says, "I only care about rules, but I prefer to learn them from parables I know are fake." While possible (like Aesop's Fables), in moral philosophy, this usually collapses into Skepticism. If the story is fake, why bother with the person at all? Just state the rule.

  ***

  ## Part Two: The "Moral Biography" Quiz

  **Instructions for the Moderator:**
  Hand this out to your classmates. Tell them there are no right or wrong answers, and they should answer based on their gut reaction to the *situation*, not on what they think a philosopher would say.

  **Title:** How Do We Learn From Lives?
  **Target:** Ages 15–18 | **Time:** 10 Minutes

  ### The Questions

  **1. The Flawed Hero**
  You have always looked up to a famous activist because of their work for justice. You then discover credible evidence that they were cruel to their own family and stole money in private. What happens to the moral lesson you learned from them?
  *   A. The lesson is ruined. If their character was corrupt, their public good was probably luck or showmanship.
  *   B. The lesson stays. Their public work was good, and I can still copy that part, even if they were flawed.
  *   C. The lesson changes. Now I see that good work can come from broken people, which makes me judge the work more carefully.

  **2. The Inspiring Lie**
  You read a biography of a great leader. It motivates you to volunteer and work harder. Later, the author admits they invented several key scenes to make the leader look more courageous. Do you feel cheated?
  *   A. Yes. I based my choices on a lie. It corrupts my understanding of what courage actually costs.
  *   B. No. The inspiration was real, and the result (me volunteering) is good. The story served its purpose.
  *   C. Maybe. I'm glad I was motivated, but I won't use this book to teach others.

  **3. The Saint in the Suburbs**
  You read the life of a saint who gave away all their money and lived in a war zone to help refugees. You admire their holiness. But you live in a safe suburb and plan to go to college. Can you emulate them?
  *   A. No. Their virtue depends on circumstances I don't have. I should find a model who fits my life.
  *   B. Yes. The specific actions don't matter; I can copy their *spirit* of generosity in my own context.
  *   C. Not really. This just shows me that I am not as good as them, which makes me feel guilty rather than helpful.

  **4. The Small Habit**
  Plutarch describes a general who always polished his own boots before battle, even when servants offered to do it. Why does this detail matter?
  *   A. It doesn't. It's just trivia. We should focus on his big battles and strategies.
  *   B. It shows his discipline. Small habits reveal the character that allows for big virtues.
  *   C. It's dangerous. Focusing on small habits makes us judge people on superficial things rather than their actual impact.

  **5. The Rule vs. The Story**
  Your school is debating a new honor code. Which argument is more persuasive to you?
  *   A. A logical explanation of why honesty creates a functional society.
  *   B. A story about a student who told the truth and suffered for it, but kept their self-respect.
  *   C. Both are needed. The story makes me care, but the rule tells me what to do.

  **6. The Negative Example**
  You are reading a biography of a brilliant scientist who was also a racist. How should the book handle their racism?
  *   A. Hide it or minimize it. We need heroes to look up to, not reasons to be cynical.
  *   B. Highlight it. We need to see the whole person so we can admire the science but reject the racism.
  *   C. Focus only on the science. Their personal morals are separate from their intellectual work.

  **7. The Admiration Test**
  When you feel admiration for someone, what is that feeling telling you?
  *   A. It tells me this person is good, and I should try to be like them.
  *   B. It tells me nothing. Feelings are unreliable; I need to check if their actions match ethical rules.
  *   C. It tells me what *I* value, but not necessarily what is objectively good.

  **8. The Perfect Portrait**
  Imagine a biography that removes every mistake the subject ever made, presenting them as perfectly wise. Is this book useful?
  *   A. Yes. It gives us a clear target to aim for, even if no human is actually perfect.
  *   B. No. It sets us up for failure. When we inevitably make mistakes, we'll give up.
  *   C. It depends. It's useful for inspiration, but bad for instruction.

  **9. The Contrast Method**
  Plutarch often pairs a Greek life with a Roman life (e.g., Alexander and Caesar). Why do you think he does this?
  *   A. To show that different cultures produce the same kinds of great men.
  *   B. To let us compare their choices. Seeing them side-by-side helps us judge who handled power better.
  *   C. To show that history repeats itself and nobody really changes.

  **10. The Ultimate Goal**
  Why should a high school student read biographies of moral figures?
  *   A. To find a role model to imitate.
  *   B. To learn historical facts about what happened.
  *   C. To practice judging character so I can improve my own.

  ***

  ### Scoring Key & Interpretation

  *Note for the Moderator: This quiz is a heuristic, not a psychometric test. It is designed to spark debate, not to label students permanently. Some views overlap (see note below).*

  Have students tally which letter they chose most often.

  **Mostly A: The Historian / The Skeptic**
  *   **View:** You value accuracy and principles over inspiration. You worry that false stories or flawed heroes corrupt our moral compass.
  *   **Philosophical Leaf:** If you chose A on Q2 (The Lie) and Q5 (The Rule), you are likely a **Skeptic** (Principles over stories). If you chose A on Q1 (Flawed Hero) and Q2, you are likely a **Historian** (Truth is essential for moral data).

  **Mostly B: The Hagiographer / The Exemplarist**
  *   **View:** You believe in the power of the model. You think inspiration matters more than perfect accuracy, or that admiration is a reliable guide.
  *   **Philosophical Leaf:** If you chose B on Q2 (The Lie) and Q8 (Perfect Portrait), you lean **Hagiographic** (Idealization is useful). If you chose B on Q1 (Flawed Hero) and Q7 (Admiration), you lean **Exemplarist** (Real admiration grounds morality).

  **Mostly C: The Plutarchan**
  *   **View:** You believe we learn by *judging* lives, not just copying them. You want the flaws, the contrasts, and the small details because they help you practice moral reasoning.
  *   **Philosophical Leaf:** **Plutarchan Method.** You see biography as a gym for judgment, not a mirror for imitation.

  **Mixed Results (Common):**
  *   **A & B Mix:** You are torn between the need for truth and the desire for inspiration. (This is the tension between the Historian and the Hagiographer).
  *   **B & C Mix:** You believe in models, but you know they must be human. (This is the tension between the Exemplarist and the Plutarchan).

  **Important Flag on Overlap:**
  This quiz cannot perfectly separate the **Exemplarist** from the **Plutarchan**. Both value real people and factual truth. The difference is subtle: The Exemplarist thinks we learn by *emulating* the admired person; the Plutarchan thinks we learn by *judging* the person (sometimes in contrast to others). If a student scores high on both B and C, they likely hold a sophisticated view that we emulate *virtues* we see in people, but we must judge which parts are worth emulating.

  ***

  ### Post-Quiz Analysis: The Sorting Case

  **The Case:** Question 2 (The Inspiring Lie).

  **Why it sorts:** This question cuts directly through the tension between *moral utility* and *epistemic honesty*. It forces students to decide whether the *outcome* (being motivated to do good) justifies the *means* (believing a fiction).

  **The Dissatisfied Quiz-Taker:**
  *   **The Historian (Who chose A):** They will complain that the quiz options are too soft on lying. They would argue that B ("No, I don't feel cheated") is not just wrong, but dangerous. Their complaint: "If you build your morality on a lie, your morality collapses the moment you find out the truth. The quiz treats this as a matter of taste, but it's a matter of integrity."
  *   **The Hagiographer (Who chose B):** They will complain that the quiz is too cynical. They would argue that A ("Yes, I feel cheated") misses the point of sacred stories. Their complaint: "The truth of the story isn't in the facts, it's in the transformation. If the lie made me a better person, the lie contained a higher truth. The quiz treats 'truth' only as data, not as meaning."

  **Moderator Tip:** When you discuss Q2 in your club, expect this to be the loudest argument. Use it to pivot to your reading: Did Plutarch invent details? Did the medieval hagiographer? If so, does that destroy the value of the texts you read, or does it change *how* you should read them?
