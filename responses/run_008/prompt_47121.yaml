      *   *Revised Diagnostic Questions:*
          1.  **Vehicle:** Is the primary unit of moral learning a *person* or a *principle*?
          2.  **Veracity:** Does the story need to be *factually true* to teach truth?
          3.  **Perfection:** Does the model need to be *flawless/idealized* to be useful?
          4.  **Mechanism:** Do we learn by *emulation* (copying) or *judgment* (comparing/contrasting)?
      *   *Taxonomy Construction:*
          *   Combine these to find the 5 target leaves + potential empty spots.
          *   *Exemplarist:* Person, Truth matters (usually), Flaws okay (human), Emulation.
          *   *Plutarchan:* Person, Truth matters (mostly), Flaws essential, Judgment/Contrast.
          *   *Hagiographic:* Person, Truth irrelevant, Flaws hidden, Emulation.
          *   *Historian:* Person (as data), Truth essential, Flaws essential, Judgment (cautionary).
          *   *Skeptic:* Principle, Truth irrelevant (stories are anecdotes), Flaws irrelevant, Rules.
      *   *Unoccupied Combinations:*
          *   *Person + Truth Irrelevant + Flaws Essential + Emulation:* Why emulate a known liar with flaws? (Incoherent/Unattractive).
