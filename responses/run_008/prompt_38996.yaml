  8.  **Final Polish:** Check word count. Ensure the blindness isn't too metaphorical (e.g., "blind to the truth"). Keep it physical (can't see the red).

  9.  **Afterword:** Focus on concrete action vs. abstract meaning. Keep characters specific.

