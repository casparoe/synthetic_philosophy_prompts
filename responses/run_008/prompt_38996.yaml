      *   *Scene 2: The Hollow Victory.* Elara gets her way. Mara says "Yes, perfect." Elara feels the emptiness. The praise sounds flat. The canvas is wrong, but Mara says it's right.
      *   *Scene 3: The Transformation.* Time jump. Mara is deep in the work. She knows the viscosity, the light, the drying. She isn't rebelling; she's just becoming competent/essential. She finds her own rhythm.
      *   *Scene 4: The Inversion.* The exhibition or a final review. Elara asks for validation. Mara gives it, but it's different now. It's not deference; it's assessment. Elara realizes she is the dependent one.

  4.  **Refining the Narrative Arc (Mental Check):**
