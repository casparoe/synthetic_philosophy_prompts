answer: |-
  The argument began over a tube of cobalt. Elara stood before the canvas, a yard away, squinting until her eyes watered. The shadows were eating the room, gray fog creeping in from the periphery of her vision.

  "It's too dark," Elara said. "Add the white. More."

  Mara, holding the palette, didn't move. "It's not dark, Elara. It's the value you asked for. If you add white, it'll chalk."

  "I know what I asked for," Elara snapped, grabbing for the tube. Her hand missed, knocking a jar of turpentine. It shattered. "Do it. Or pack your things. I'll burn this before I let you ruin my name with mud."

  The threat hung in the smell of solvent. Mara looked at the canvas, then at the door. If she walked, she kept her portfolio, her dignity, her own future. If she stayed, she was a brush with a pulse. But if she left, she lost the studio, the light, the access to the mind that had built this room. She wanted the work more than she wanted the credit.

  Mara squeezed the white onto the mix. "Okay," she said. "It's lighter now."

  Elara nodded, satisfied. "Good. Now the edge. Soften it."

  For months, the studio ran on this rhythm. Elara commanded; Mara executed. Elara would stand back, chest swelling, waiting for the validation that her vision remained intact despite the failing eyes. Mara would offer it. "The composition holds," Mara would say. "The tension is there."

  But the praise began to taste like dust. Elara would ask, "Is it working?" and Mara would answer, "Yes," with the flat tone of a switch being flipped. Elara realized she was hearing what she demanded, not what was true. When Mara said *beautiful*, it sounded like *safe*. It sounded like *please don't fire me*. The canvas might have been rotting beneath the paint, but Elara had no way to know, and Mara had no incentive to tell her. The victory was absolute, and it was empty. Elara was alone in a room full of mirrors.

  Meanwhile, Mara's hands changed. She stopped waiting for instructions on viscosity. She knew how the linseed oil behaved in the humid July heat, how the alizarin crimson stained the rag differently than the cadmium. She began to fix mistakes before Elara could perceive them. A drip caught on the edge; a dry patch smoothed over with medium.

  This wasn't rebellion. It was immersion. While Elara lived in the abstract realm of *the vision*, Mara lived in the physics of the thing. She knew which brushes held their spring and which were shot. She knew the drying time of the underlayer. One afternoon, Elara asked for a specific green. Mara mixed it, but adjusted the ratio silently, knowing the pigment would shift as it oxidized. She wasn't thinking about Elara's approval. She was thinking about the paint. The work was shaping her. She stood back from the easel, wiping her hands on a rag, and felt a quiet solidity in her chest. She was the one who knew what was actually on the canvas.

  The opening night was a blur of noise for Elara. She could see only the bright spots of camera flashes, like lightning in a storm. She stood near the center piece, the culmination of their year. She needed to hear it. She needed to know that the world still saw her.

  She grabbed Mara's arm. "Tell me," Elara hissed. "Tell me what they're saying. Do they see it?"

  Mara looked at the crowd, then at the painting, then at Elara. The old deference was gone, not replaced by anger, but by a calm assessment. Mara had spent a thousand hours mixing the colors that caught the light now bouncing off the walls. She owned the material reality of the room.

  "They see the texture," Mara said. Her voice was even. "They like the handling."

  "And the vision?" Elara pressed, desperate. "Do they know it's mine?"

  Mara paused. She could lie. She could give Elara the drug she needed. But Mara had spent a year touching the truth of the canvas while Elara touched only the air.

  "They see what's there, Elara," Mara said. "It's a solid painting."

  "It's *my* painting," Elara said, her grip tightening.

  "It's the one we made," Mara corrected gently. She didn't pull away, but she didn't lean in. She stood on her own ground.

  Elara felt the floor drop. She realized then that she needed Mara to say *you are the master*, but she had spent a year proving Mara was not. She had broken the only person whose opinion could save her. Mara was no longer a mirror; she was a witness. And witnesses tell the truth, not what you command.

  Elara let go of Mara's arm. The noise of the gallery rushed back in. She stood blind in the center of her triumph, waiting for a validation that had quietly walked away to mix another batch of paint.

  ***

  **Afterword**

  The risk here is turning Elara and Mara into labeled jars: "Power" and "Labor." To avoid this, I focused on the sensory friction of the studio—the smell of turpentine, the viscosity of oil, the physical act of missing a jar. Allegory lives in the abstract; story lives in the specific. I kept the blindness medical (shadows, lost periphery) rather than metaphorical (ignoring the truth). The philosophical inversion isn't stated; it's felt in the shift of who knows the material reality of the canvas. Let the characters be difficult people first. Elara isn't "Capital," she's a scared artist losing her sight. Mara isn't "Proletariat," she's a student who loves paint more than credit. If you ground the metaphysics in the mud of the work, the structure holds without showing its beams.
