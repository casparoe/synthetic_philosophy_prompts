answer: |-
  # Quiz: What's Actually in the Baby's Head?

  You've read the intro textbooks. You know the labels: *Nativist*, *Empiricist*, *Generativist*, *Usage-Based*. But in the actual trenches of acquisition research, the fights aren't about labels. They're about mechanics. Is the innate contribution a set of rules (content) or just a tilt in the learning machine (bias)? Is the input actually impoverished, or just messy?

  This quiz skips the buzzwords. It presents nine concrete findings. Pick the explanation that feels most plausible to you. At the end, we'll see where you land on the theoretical map.

  ***

  ### 1. The Structure-Dependence Case
  Children learning English form questions by moving the auxiliary verb associated with the main subject (e.g., *"The man who is tall is singing"* → *"Is the man who is tall singing?"*). They never make the linear error of moving the first "is" they hear (*"Is the man who tall is singing?"*), despite never being corrected on grammar and rarely hearing complex sentences like this in early input.
  *   **A.** The child possesses an innate principle that rules operate on hierarchical phrases, not linear strings.
  *   **B.** The child has a general cognitive bias to prioritize structural relationships over simple sequence.
  *   **C.** The child hears enough simpler examples that the statistical probability of the linear error becomes negligible.
  *   **D.** The child's working memory is too limited to hold the linear string in mind long enough to apply a linear rule.

  ### 2. The Statistical Learning Case
  In lab experiments, 8-month-old infants listen to a continuous stream of nonsense syllables. After just two minutes, they recognize "words" based solely on the transition probabilities between syllables (how often sound B follows sound A).
  *   **A.** This shows a language-specific module designed to chunk phonetic input.
  *   **B.** This shows a domain-general ability to track patterns, applicable to vision or music as well.
  *   **C.** This ability is present, but it's only the first step; it cannot explain complex syntax without help.
  *   **D.** This suggests the brain is primed specifically to track *linguistic* transition rates, not just any rates.

  ### 3. The Creolization Case
  In Nicaragua, deaf children brought together in schools without a established sign language developed a new, fully grammatical sign language (ISN) within a generation, despite having only an impoverished, pidgin-like input to start.
  *   **A.** The children activated a dormant, species-specific grammar blueprint.
  *   **B.** The children used general cognitive tools to maximize communicative efficiency and regularity.
  *   **C.** The input was richer than observers realized; the children systematized existing gestures.
  *   **D.** The structure emerged from the pressure to communicate quickly within a social group, evolving over time.

  ### 4. The "Wug" and Overregularization Case
  Children say *"goed"* and *"foots"* (errors they never heard adults make) and can correctly inflect made-up words like *"wug"* → *"wugs"*.
  *   **A.** This proves access to an abstract, algebraic rule (e.g., [Noun] + /z/) independent of specific words.
  *   **B.** This proves a bias to regularize patterns found in the input, even if overextended.
  *   **C.** This shows the construction of schemas based on similarity to known words (e.g., *bug/wug*).
  *   **D.** This indicates the input must contain enough regular patterns for the child to extrapolate the rule.

  ### 5. The Richness of Input Case
  Corpus analyses (like those by MacWhinney and Bates) suggest child-directed speech contains far more grammatical information than early Poverty-of-the-Stimulus arguments claimed.
  *   **A.** The Poverty-of-the-Stimulus argument is empirically false; the data is sufficient for general learning.
  *   **B.** The data is sufficient, but the child needs an innate filter to attend to the relevant parts.
  *   **C.** The data is sufficient for words, but not for abstract syntactic dependencies.
  *   **D.** The quantity of data matters less than the social context in which it is delivered.

  ### 6. The Processing Constraints Case
  Young children struggle with sentences that require holding multiple dependencies in memory (e.g., object-relative clauses: *"The dog that the cat chased barked"*), mastering them years after simpler structures.
  *   **A.** This reflects the maturation of a specific syntactic module.
  *   **B.** This reflects general increases in working memory and processing speed.
  *   **C.** This reflects the gradual accumulation of specific constructions in memory.
  *   **D.** This reflects the time needed to statistically learn the low-frequency patterns.

  ### 7. The Cross-Species Case
  Humans learn language effortlessly; other primates, even with intensive training, fail to acquire anything resembling human syntax, despite having similar general intelligence.
  *   **A.** Humans possess a unique, biological endowment for grammar absent in other species.
  *   **B.** Humans possess unique social-pragmatic motivations that drive learning, not a grammar module.
  *   **C.** The difference is in vocal tract anatomy, not cognitive capacity.
  *   **D.** The difference is in general pattern-recognition speed, which is just higher in humans.

  ### 8. The Semantic Bootstrapping Case
  Children seem to use word meaning to crack the grammatical code (e.g., assuming the "doer" of an action is the subject), but this only works if they assume certain mappings between meaning and grammar are universal.
  *   **A.** These mappings (e.g., Agent=Subject) are innate linguistic universals.
  *   **B.** These mappings are cognitive biases about how events are typically structured.
  *   **C.** These mappings are learned generalizations from the input.
  *   **D.** These mappings emerge from the frequency of certain event types in daily life.

  ### 9. The Variation Case
  Languages vary wildly (some put verbs at the end, some at the start; some use case markers, some use word order).
  *   **A.** Variation is superficial; all languages share a deep, identical underlying structure.
  *   **B.** Variation is constrained; languages only vary within a specific set of biologically allowed options.
  *   **C.** Variation is unlimited; any pattern that is learnable and useful can become a language.
  *   **D.** Variation is shaped by historical transmission and cognitive ease, not biology.

  ***

  # Scoring Key

  Tally your answers. Each option corresponds to one of the five theoretical "leaves."

  *   **Mostly A:** Strong Nativism
  *   **Mostly B:** Weak Nativism / Innate Constraints
  *   **Mostly C:** Domain-General Statistical Learning
  *   **Mostly D:** Emergentism / Constructivism
  *   **Mostly E (specifically Q5A, Q1C, Q4D, Q3C):** Stimulus-Rich Empiricism

  *(Note: Some options overlap. If you picked a mix, see the diagnosis below.)*

  ### The Five Positions

  1.  **Strong Nativism (Substantive Universals):** You believe the input is too poor to learn grammar without help, and that help comes in the form of specific grammatical knowledge (rules, categories) present at birth. The "language organ" contains content.
  2.  **Weak Nativism (Innate Constraints):** You reject full grammatical knowledge at birth but believe the human brain has species-specific biases that make linguistic patterns easier to learn than non-linguistic ones. It's a tilted playing field, not a pre-built house.
  3.  **Domain-General Statistical Learning:** You believe one general-purpose learning machine handles language, vision, and motor skills. No language-specific innate knowledge is required; everything is extracted from input statistics.
  4.  **Emergentism / Constructivism:** You focus on development. Structure isn't "in" the input or the genes; it emerges from the interaction of cognitive constraints (like memory limits), social pressure, and input over time. Starting "small" (limited memory) might actually help learning.
  5.  **Stimulus-Rich Empiricism:** Your main beef is with the *Poverty-of-the-Stimulus* premise. You believe the input is rich enough that we don't need to posit special innate mechanisms at all. The problem was underestimating the data, not the learner.

  ### Diagnostic Notes & Limitations

  **The "Mush" Zone: Weak Nativism vs. Domain-General Learning**
  Be honest: this quiz cannot perfectly separate Leaf 2 (Weak Nativism) and Leaf 3 (Domain-General) if you believe the "general" learner has architectural constraints. If you answered that infants have a "bias to prioritize structural relationships" (Q1B) but also that this applies to "vision or music" (Q2B), you are in the mush.
  *   *Why:* A "domain-general mechanism with specific architectural constraints" often behaves identically to "domain-specific biases" in behavioral experiments. Unless you have fMRI data showing modularity, these two positions are often empirically indistinguishable in acquisition data.

  **Incoherent Combos**
  *   **Strong Nativism + Stimulus-Rich:** If you scored high on **A** (Innate Content) and **Q5A** (Input is sufficient), your position is theoretically redundant. If the input contains everything needed (Rich), positing substantive innate grammar (Strong Nat) is unnecessary complexity. Few researchers hold both; usually, Strong Nativists rely on the input being impoverished to justify the innate structure.
  *   **Emergentism + Strong Nativism:** If you scored high on **D** (Emergent/Processing limits) and **A** (Innate Rules), you have a contradiction. Emergentism posits that structure *develops* from constraints; Strong Nativism posits structure is *pre-existing*. You can't have it both ways.

  **The "Unexplored" Combo**
  *   **Rich Input + Weak Nativism:** This is a viable but less common position (sometimes called "Rationalist Empiricism"). It suggests the input *is* sufficient, but the brain still has biases that speed up the process. If you landed here, you're in good company (e.g., some Bayesian modelers), but you occupy a nuanced middle ground that often gets flattened in intro classes.
