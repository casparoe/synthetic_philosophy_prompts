      *   *So C6 must go, or C3 must go.* The user explicitly wants to keep C3 (demon gives reasons). So C6 is the primary casualty.
      *   *What about C5?* C5 says Fittingness is primitive/not reducible to reasons. This is actually *helpful* for the Reasons-First FA view (it allows a gap between reasons and fittingness). But C6 closes that gap by equating Fittingness with Rationality (which is reason-responsive). So C5 and C6 are in tension. C5 supports the solution; C6 undermines it.

  7.  **Final Plan:**
