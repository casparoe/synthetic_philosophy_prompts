          *   If Fitting = Rational (C6).
          *   If Rational = Supported by Decisive Reasons (implied by C2/C3).
          *   Then Value = Supported by Decisive Reasons.
          *   But C3 says Threats give Reasons.
          *   So Threats give Value.
          *   But C4 says Threats don't give Value.
