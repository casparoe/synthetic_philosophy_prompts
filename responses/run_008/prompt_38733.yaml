      *   *Critique:* Is the tone right?
      *   *Fix:* Ensure it sounds like a Chair speaking to colleagues, not a judge issuing a ruling. Collaborative but directive.

  6.  **Final Polish:** Check constraints.
      *   Short written opinion? Yes.
      *   Recommend how to decide this case? Yes (Reject).
      *   Recommend standing rule? Yes (Bottom-line post-deliberation).
      *   Deadlock procedure? Yes (Bottom-line vote).
      *   Engage strongest opposing consideration? Yes (Logical consistency/Regulatory integrity).
      *   Honest about non-neutrality? Yes (Pro-accuser vs. Pro-admin).

  7.  **Final Review against the Prompt's "Trap":** The prompt says "Our charter says appeals are decided by majority vote of the panel and is silent on whether that means a vote on the bottom line, votes on the elements, or something else."
      *   If I say "Vote on Bottom Line," I am interpreting "majority vote."
