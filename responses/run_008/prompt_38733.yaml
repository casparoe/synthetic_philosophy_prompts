answer: |-
  **TO:** Appeals Panel Members
  **FROM:** Chair, Academic Integrity Appeals Panel
  **DATE:** October 24, 2023
  **SUBJECT:** Procedural Protocol & Pending Decision in [Student Case]

  Colleagues,

  Last week's deliberation exposed a structural ambiguity in our charter. We faced what social choice theorists call a "doctrinal paradox": a majority found copying occurred (3–2), and a majority found the student understood the norms (3–2), yet a majority voted to reject the finding (4–1). This occurred because the majorities on the elements did not overlap.

  Before we meet Thursday, I am circulating my recommendations on how to resolve the pending case and how to formalize our voting procedure going forward.

  **1. The Pending Case**
  We must issue a decision based on the rules as understood *during* the hearing. Our charter requires a "majority vote of the panel." Last week, every member cast a vote on the ultimate question: *Should the finding be upheld?* Four of you voted no. One voted yes.

  To retroactively apply a new "elements-based" counting method would invalidate the actual votes you cast. It would also impose a sanction on a student when four of five panelists concluded she should not be punished. I recommend we honor the bottom-line vote and **reject the finding.**

  **2. The Standing Rule**
  For future appeals, I propose we adopt a **Bottom-Line Majority Rule**, preceded by mandatory deliberation on the elements.

  We must be honest that neither procedural option is neutral. The choice of how to slice the vote determines who profits from ambiguity.
  *   **The Elements Rule** (vote on prerequisites, derive outcome) favors the **Accuser/University**. It ensures logical consistency with the regulations. If a majority agrees the rules were broken, the rules are enforced, even if the coalition shifts.
  *   **The Bottom-Line Rule** (vote on the verdict) favors the **Accused Student**. It allows a panel to clear a student even if a majority agrees technical violations occurred, provided a different majority believes the outcome should be lenient.

  My colleagues proposing the Elements Rule argue from the strongest consideration on that side: **Regulatory Integrity.** They note that courts instruct juries on elements to prevent the law from being subverted by shifting coalitions. If our regulations say we must find *both* A and B to uphold a charge, a procedure that upholds a charge when no majority agrees *both* exist (as happened here) seems to violate the regulations. Conversely, a procedure that rejects a charge when a majority agrees *both* exist (the reverse of our current case) undermines the Code.

  However, I recommend the Bottom-Line Rule for two reasons. First, we are an educational appeals panel, not a court of law. Our legitimacy depends not on logical purity, but on the collective moral judgment that a sanction is *just*. If four of five members believe a student should not be punished, imposing a sanction is educationally unsound and politically unstable. Second, the Bottom-Line Rule forces us to take responsibility for the outcome. It prevents us from hiding behind a mechanical aggregation of premises that yields a result no single majority actually wants.

  **3. Deadlock and Deliberation**
  A pure vote risks the very paradox we just experienced. Therefore, my proposal includes a procedural safeguard:
  1.  **Deliberation:** We must discuss the elements first to see if the panel can align on a shared rationale.
  2.  **Consensus:** We aim for consensus on the outcome.
  3.  **Deadlock:** If deliberation fails to produce a consensus (as in the recent case), we vote on the **bottom line**. The majority view on the ultimate question controls, regardless of how the elements split.

  This approach acknowledges that while we strive for logical agreement, the final authority rests on the panel's collective judgment of the case's merit.

  Please review this proposal before Thursday. I look forward to discussing how we can best serve both the integrity of our Code and the fairness due our students.

  Regards,

  [Name]
  Chair, Academic Integrity Appeals Panel
