      *   *Eternalism:* Wins on physics (Relativity). Loses on phenomenology (why does time feel like it flows?).
      *   *Presentism:* Wins on phenomenology (matches experience). Loses on physics (requires preferred reference frame or denial of Relativity's ontological weight).
