answer: |-
  This is one of the oldest and thorniest problems in ethics, essentially pitting Kant (duty/struggle) against Hume/Aristotle (sentiment/character). Your gut is oscillating because you are sensing the tension between **Moral Struggle** (worth comes from overcoming the self) and **Moral Integrity** (worth comes from the self being good).

  Here is the breakdown of your friend's theory, the principle that best captures your intuitions, the verdict you must sacrifice, and the application to your new cases.

  ### 1. The Principle: Agentic Integration
  Your friend's "Credit Attribution" model is a strong start, but it contains a fatal flaw: it treats upbringing and psychology as *external* forces (like the masons) rather than *constitutive* forces (like the architect's training). If you subtract upbringing, luck, and psychology, you are left with a "noumenal self" that doesn't exist. No one would have moral worth.

  A better principle that captures your specific intuitions (valuing the Natural Helper and the Empathic Wallet) is **Agentic Integration**.

  **The Principle:** *Moral worth tracks the degree to which the right action flows from the agent's own evaluative commitments and character structure, rather than from external coercion or non-moral self-interest.*

  *   **High Worth:** The action expresses who the agent *is* (values, care, identity).
  *   **Low Worth:** The action expresses what the agent *fears* (cameras, guilt) or *wants for themselves* (profit, repeat business).

  ### 2. Evaluating the Friend's "Credit" Picture
  Your friend's picture works for the **Shopkeeper** and the **Camera Wallet**. In those cases, the "cause" of the goodness is external (the ledger, the lens). The agent is merely a conduit.

  However, the friend's picture mishandles the **Natural Helper**. They suggest her upbringing might be "doing the work" like the masons. This is wrong. Upbringing *builds* the architect; it doesn't lay the bricks *for* her. If her kindness is integrated into her personality, the credit flows from her. The friend's model risks the "Luck Objection": if we subtract all causal influences, no one is responsible for anything.

  **Verdict on the Friend:** The metaphor is useful for filtering out *coercion* and *profit*, but it fails to distinguish between *constitutive character* (which adds worth) and *causal luck* (which doesn't subtract it).

  ### 3. Which Verdict Has to Go?
  You have a conflicted intuition about the **Guilt-Driven Helper** (somewhere in between). **This is the verdict you must sacrifice.**

  **Why:** Acting to avoid guilt is structurally identical to acting to avoid the security camera.
  *   **Camera Wallet:** "I will be punished by the law."
  *   **Guilt Helper:** "I will be punished by my own psyche."

  Guilt is an internalized sanction. It is a pain-avoidance mechanism. If the Shopkeeper has zero worth because he avoids the pain of lost profit, the Guilt-Driven Helper should have near-zero worth because they avoid the pain of psychic discomfort. Neither is acting because the *recipient matters*; both are acting because *they* want to avoid a negative consequence.

  **Correction:** The Guilt-Driven Helper belongs at the bottom with the Shopkeeper and Camera Guy, not in the middle.

  ### 4. Predictions on Your Conflicted Cases
  Here is how the **Agentic Integration** principle ranks your two hardest cases, which may require you to shift your view:

  **A. The Identity-Driven Promise-Keeper**
  *   **Your Intuition:** Unclear ("not who I am").
  *   **Principle Prediction:** **Very High Moral Worth.**
  *   **Why:** This is the peak of Integration. The duty isn't an external rule they are forcing themselves to obey (like the Resentful Donor); it is woven into their identity. Breaking the promise would cause a fracture in the self. This is Aristotelian virtue. It is more stable and more "theirs" than the Resentful Donor, who is at war with themselves.

  **B. The Resentful Donor**
  *   **Your Intuition:** Conflicted (Part of you says "MOST worth").
  *   **Principle Prediction:** **Moderate/Low Moral Worth.**
  *   **Why:** This is the classic Kantian case. Kant loves this person because they act *against* inclination. But on the Agentic Integration model, resentment signals a **misalignment**. The agent judges the act is right, but their values/desires reject it. They are doing the right thing, but they are not *good* in that moment; they are merely compliant. The Empathic Wallet returner is better because their emotions align with the good. The Donor is effective, but morally fractured.

  ### 5. Running the Principle on New Cases

  **Case 1: The Gentle Upbringing (No Temptation)**
  *   *Scenario:* A person raised so gently they never register temptation. Stealing never occurs to them.
  *   *Prediction:* **High Moral Worth.**
  *   *Reasoning:* This is the "Natural Helper" amplified. The absence of temptation does not negate the presence of virtue. If we say they have no worth, we are saying moral worth requires the *possibility* of evil, which makes morality a game of resisting corruption rather than embodying good. Their "no" to stealing is as real as the struggling person's "no," it just costs less energy.
  *   *Caveat:* If they have never *chosen* the good because they never knew an alternative existed (a "golden cage"), worth is lower. But if they understand evil and simply find it repulsive due to upbringing, that is successful character formation.

  **Case 2: The Reflex Soldier**
  *   *Scenario:* Throws self on grenade before thought. Pure reflex.
  *   *Prediction:* **Zero Moral Worth for the Act, High Worth for the Character.**
  *   *Reasoning:* Moral worth attaches to *agency*. A reflex is a physiological spasm, like a knee jerk. In the split second of the jump, there was no "will." However, we attribute worth to the *training and discipline* that made that reflex possible. We praise the soldier, but technically we are praising the months of prior agentic commitment that automated the response. The act itself was non-moral (like a tree falling to block a bullet); the history was moral.

  **Case 3: The Committee**
  *   *Scenario:* A group makes a sacrificial moral choice.
  *   *Prediction:* **Distributed Worth (Conditional).**
  *   *Reasoning:* A committee cannot have a "will" distinct from its members.
      *   *Scenario A:* The vote is 5-4. The majority acted on principle; the minority voted against. Worth lands only on the individuals in the majority who voted from commitment.
      *   *Scenario B:* Unanimous vote, but everyone voted because they thought everyone else would (pluralistic ignorance). **Zero Worth.** (Like the Camera Wallet, but social).
      *   *Scenario C:* Unanimous vote, shared commitment. **Shared Worth.**
      *   *Conclusion:* Worth never lands on the abstract entity "The Committee." It always lands on the members, proportional to their individual Agentic Integration.

  ### Summary of the Shift
  To make your moral map consistent, you need to make this trade:

  1.  **Downgrade the Guilt-Driven Helper.** They are not "trying"; they are hiding from pain. Put them with the Shopkeeper.
  2.  **Upgrade the Identity Promise-Keeper.** They are not "rigid"; they are integrated. Put them with the Natural Helper.
  3.  **Downgrade the Resentful Donor.** Struggle is not a virtue; it is a cost. The Empathic Wallet returner is morally superior because they help *and* feel the right way.

  Your friend's credit theory works if you realize that **character is not a deduction from credit; it is the source of it.** The "Natural Helper" isn't lucky; they are wealthy in virtue. The "Guilt Helper" isn't trying hard; they are in debt to their own conscience.
