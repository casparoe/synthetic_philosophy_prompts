prompt: |-
  I'm a philosophy professor — decision theory and phil sci, mostly — and a former student of mine works as a program officer at a state public health agency. Her job, roughly a dozen times a year, is deciding how to split a preparedness budget between interventions where the risk is well quantified (flu vaccination campaigns, where we literally have decades of data) and ones where the probabilities are basically made up (some novel zoonosis, a vector-borne disease creeping north with the climate, bioterror stuff). She's smart enough to see that every number attached to the second kind is invented, but she can also tell her committee treats those numbers differently depending on whether they arrived with a decimal point. She asked me for help and my honest instinct is to send her Ellsberg's urn paper and let her figure it out, but that would be useless to her, and she knows it.

  So what I want from you is a decision procedure her office could actually run in an afternoon, on paper, no software. Ground it in whatever decision theory actually knows about the difference between risk (probabilities you know) and ambiguity (probabilities you don't and can't), but translate — keep only the distinctions that earn their keep, and say which ones you dropped. It should include: the questions to ask in order, what counts as a good enough answer to each, where the procedure is allowed to say "stop, this one's a values call, hand it to the committee," and — this is the part I care most about — some way of telling apart two things that look identical in a meeting: being rationally cautious because the estimate is fabricated, and just disliking an option because its number looks made-up. The first is defensible, the second is a bias her office will institutionalize if nobody names it.

  Then run it on three cases: (1) shifting money from flu campaigns (well-quantified, boring, saves a predictable number of lives) into surveillance for a possible spillover event (no real probability exists, worst case is very bad); (2) the reverse — a vendor shows up with a slick risk model for the spillover side, complete with confident numbers, and the committee relaxes because now it "looks like" the flu side; (3) a case where you think the procedure should end by refusing to rank the options at all. For at least one of these, give the answer her office won't want to hear, and say so plainly.

  Keep it usable by people with no theory background. If a step only works because someone exercises judgment, mark it as that — don't dress it up as procedure. And please don't give her a reading list; she's never going to read it and neither are her colleagues.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **User:** Philosophy professor (decision theory/phil sci).
      *   **Client:** Former student, program officer at a state public health agency.
      *   **Problem:** Allocating budget between *Risk* (known probabilities, e.g., flu) and *Ambiguity* (unknown/unknowable probabilities, e.g., novel zoonosis, bioterror).
      *   **Constraint 1:** Practical procedure. Run in an afternoon, on paper, no software.
      *   **Constraint 2:** Grounded in decision theory (Risk vs. Ambiguity/Ellsberg), but translated for practitioners. Drop unnecessary theoretical distinctions.
      *   **Constraint 3:** Must distinguish between *rational ambiguity aversion* (caution due to fabricated estimates) and *irrational bias* (disliking options just because numbers look fake).
      *   **Constraint 4:** Include "stop" conditions for value judgments (hand to committee).
      *   **Constraint 5:** Test on three specific cases (Flu vs. Surveillance; Slick Model for Spillover; Unrankable case).
      *   **Constraint 6:** At least one answer must be the "unwelcome truth."
      *   **Tone:** Professional, direct, usable by non-theorists, no reading lists.

  2.  **Theoretical Grounding (Mental Sandbox):**
      *   *Core Concept:* Knightian Uncertainty / Ellsberg Paradox. Risk = known distribution. Ambiguity = unknown distribution.
      *   *Decision Rules:* Maximize Expected Utility (MEU) works for Risk. For Ambiguity, we need something like Maxmin Expected Utility (MEU with sets of priors), $\alpha$-Maxmin, or Info-Gap.
      *   *Practical Translation:* We can't ask them to define sets of priors. We need a heuristic that captures "weight of evidence" or "confidence."
      *   *Key Distinction:* The user wants to separate *rational caution* (the number is garbage, so we discount it) from *pseudo-skepticism* (the number is garbage, so we reject the option regardless of upside).
      *   *Approach:* A "Confidence-Weighted Scoring" system. Instead of changing the probability, we change the *weight* of the outcome based on the quality of the evidence. Or, simpler: A two-track evaluation where Ambiguity options are stress-tested against worst-case/best-case bounds rather than point estimates.
      *   *Refinement:* Let's use a "Robustness Check" approach. If an option relies on a precise number that is actually ambiguous, it fails the robustness check unless the upside is massive even under low confidence.
      *   *Distinguishing Bias:* Bias happens when the *consequence* of ambiguity is treated as a disqualifier rather than a modifier of confidence. Rational caution says "I need more margin of safety." Bias says "I won't touch this."

  3.  **Drafting the Procedure (The "Ambiguity Audit"):**
      *   *Name:* Needs to sound bureaucratic but accurate. "The Confidence-Weighted Allocation Protocol" (CWAP)? "Risk-Ambiguity Triage"? Let's go with "The Evidence-Weighted Decision Protocol."
      *   *Step 1: Classification.* Is this Risk or Ambiguity? (The "Data Lineage" check).
      *   *Step 2: Valuation.* Calculate Expected Value (EV) for Risk. For Ambiguity, calculate a Range (Best/Worst).
      *   *Step 3: The Discount.* Apply a "Confidence Factor" to the Ambiguity EV.
      *   *Step 4: The Bias Check.* This is crucial. Why are we discounting? Is it because the *outcome* is uncertain, or because the *model* is uncertain?
      *   *Step 5: The Stop Rule.* If the trade-off is between "Certain Lives" vs. "Possible Catastrophe," that's a value judgment, not a math problem.

      *Critique of Draft:* Too abstract. Needs to be "on paper, afternoon."
      *Revised Idea:* Use a "Two-Column Ledger."
      *   Column A: The Number (EV).
      *   Column B: The Anchor (How solid is the number?).
      *   Decision Rule: You can't compare Column A directly if Column B differs. You must adjust Column A by Column B.
      *   Bias Check: If Column B is low, do we discard the option or demand higher upside? Discarding = Bias. Demanding higher upside = Rational Caution.

  4.  **Developing the "Bias vs. Caution" Test:**
      *   *Rational Caution:* "I treat this \$1M benefit as worth only \$500k because the probability is shaky." (Discounting the *weight*).
      *   *Irrational Bias:* "I reject this option because the probability is shaky, even if the upside is infinite." (Veto power).
      *   *Procedure:* Force them to state the "Equivalent Certain Benefit." If they say "Nothing," it's bias. If they say "Less than the calculated EV," it's caution.

  5.  **Refining the Steps for the User:**
      *   *Step 1: The Provenance Tag.* (Green = Data, Red = Guess).
      *   *Step 2: The Shadow Price.* Convert Ambiguity to a "Conservative Equivalent."
      *   *Step 3: The Reversal Test.* (If the numbers were swapped, would you still prefer the certain option?)
      *   *Step 4: The Value Handoff.* (When to stop).

  6.  **Addressing the Three Cases:**
      *   *Case 1 (Flu vs. Spillover):* Flu = Risk. Spillover = Ambiguity. Standard EV favors Flu. Ambiguity aversion might favor Spillover if worst-case is existential. *Unwelcome Truth:* If the spillover probability is truly unknowable, you cannot justify shifting funds based on EV. You must justify it based on *regret minimization* or *insurance*. If the committee isn't willing to frame it as insurance, don't move the money.
      *   *Case 2 (Slick Model):* Vendor provides precise numbers for Spillover. *Trap:* False Precision. *Procedure:* The Provenance Tag must catch this. Just because it has decimals doesn't make it Green. *Answer:* Treat as Red. Ignore the decimals.
      *   *Case 3 (Unrankable):* Both options have high ambiguity but different *kinds* of bad outcomes (e.g., immediate visible deaths vs. latent structural collapse). *Answer:* Stop. Hand to committee. Math breaks here.

  7.  **Polishing the Tone:**
      *   Speak to the Professor, but write for the Student.
      *   Acknowledge the theory (Ellsberg/Keynes) without citing it.
      *   Be blunt about the "unwelcome truth."
      *   Ensure the "Bias Check" is actionable.

  8.  **Final Review against Constraints:**
      *   Afternoon/Paper? Yes, it's a worksheet style.
      *   Distinguish Risk/Ambiguity? Yes, via "Provenance."
      *   Distinguish Caution/Bias? Yes, via the "Equivalent Certain Value" test.
      *   Three Cases? Yes.
      *   Unwelcome Truth? Yes (in Case 1 or 3).
      *   No Reading List? Yes.

      *(Self-Correction during drafting)*: Make sure I don't give them a formula that looks like math. It needs to be a *questionnaire* that forces numerical discipline. The "Confidence Weight" should be a multiplier derived from qualitative answers, not a random number. Actually, better: Don't multiply. Compare "Best Case" and "Worst Case" against the "Certain Option."
      *Better approach for the Procedure:* The "Interval Comparison."
      Risk Option: Point Estimate (e.g., 10 lives).
      Ambiguity Option: Interval (e.g., 0 to 1000 lives).
      Decision: Does the *bottom* of the Interval beat the Point? (No). Does the *top* justify the risk? (Maybe).
      Bias Check: Are you ignoring the Top because it's ambiguous?

      *Let's settle on the "Confidence-Adjusted Value" (CAV).*
      1. Calculate raw EV.
      2. Assign Confidence Level (High/Med/Low).
      3. If Low, you must state the "Certainty Equivalent."
      4. Bias Check: If Certainty Equivalent is $0 regardless of upside, that's bias.

      *Wait, the prompt asks for a procedure to run in an afternoon.* A worksheet is best.
      Let's structure it as "The Ambiguity Protocol."

      *Key Theoretical Drop:* We are dropping Bayesian updating (no time/data) and Smooth Ambiguity models (too complex). We are keeping the *ordinal* distinction between Risk and Ambiguity and the concept of *weights* (Keynes).

      *Bias Distinction:* Rational caution reduces the *decision weight* of the ambiguous option. Irrational bias assigns a *negative utility* to the ambiguity itself. The test: Would you pay to resolve the ambiguity? If yes, it's rational. If you just want to kill the project, it's bias.
      *Simpler Test:* The "Swap Test." If the uncertain option had the *same* expected value but was certain, would you take it? If yes, you're cautious. If no (you still prefer the other option), you're biased against the *source*.

      *Let's refine the "Unwelcome Truth".* Case 1 is the best candidate. Moving money from Flu (certain saves) to Surveillance (uncertain prevention) is often politically indefensible unless framed as insurance. If they can't accept the "insurance" frame, they shouldn't move the money.

      *Case 3 (Unrankable):* When the *types* of harm are incommensurable (e.g., equity vs. efficiency, or immediate vs. generational).

      *Final Plan:*
      1. Intro: Acknowledge the Ellsberg problem without naming it.
      2. The Protocol: 4 Steps + 1 Bias Check.
      3. The Three Cases.
      4. Closing note on the "Unwelcome Truth."

      *(Self-Correction on Bias Check)*: The prompt specifically asks to distinguish "rationally cautious because estimate is fabricated" vs "disliking an option because number looks made-up."
      *Rational:* "I discount this benefit by 50% because the data is weak."
      *Bias:* "I reject this because the data is weak."
      *Test:* Force them to quantify the discount. If they refuse to quantify and just veto, it's bias.

      Okay, ready to write.
answer: |-
  Here is a decision protocol designed for your student's office. It strips away the formalism of ambiguity aversion (Ellsberg, Gilboa-Schmeidler, etc.) and keeps only the operational mechanics needed to prevent false precision from driving budget allocation.

  ### The Evidence-Weighted Allocation Protocol (EWAP)

  **Purpose:** To prevent "false precision" (treating guesses as facts) from overriding "known risk" (treating data as data), while distinguishing between rational caution and irrational bias.
  **Time:** 2–3 hours per budget cycle.
  **Tools:** Whiteboard or large paper, markers, printed worksheets.

  ---

  #### Phase 1: The Provenance Tag (15 Minutes)
  *Goal: Classify the input, not the output.*

  For every budget option on the table, the team must assign a **Provenance Tag**. Do not look at the dollar amount or the projected lives saved yet. Look only at how the numbers were derived.

  *   **Tag Green (Risk):** The probability is based on longitudinal data, peer-reviewed models with validated back-testing, or actuarial tables. (e.g., Flu vaccination efficacy).
  *   **Tag Red (Ambiguity):** The probability is based on expert elicitation, analogy to other events, theoretical models without field data, or political directive. (e.g., Novel zoonosis spillover, bioterror).

  **Rule:** If an option has *any* critical variable tagged Red, the whole option is treated as Red for the purpose of comparison. A slick vendor model (Case 2) does not change a Red tag to Green unless they provide the validation data.

  **Theoretical Note:** We are dropping the idea that ambiguity can be reduced to a second-order probability. There is no "probability of the probability." There is only data or there isn't.

  #### Phase 2: The Interval Estimate (45 Minutes)
  *Goal: Force the ambiguity into the open.*

  *   **For Green Options:** Record the Expected Value (EV). (e.g., "Cost \$1M, saves 10 lives").
  *   **For Red Options:** Point estimates are forbidden. You must record an **Interval**.
      *   **Lower Bound:** The outcome if the threat is negligible or the intervention fails completely. (Usually 0).
      *   **Upper Bound:** The outcome if the threat is real and the intervention works as hoped.
      *   **The "Break-Even" Point:** What probability of the threat actually materializing is required for this spend to match the Green option's efficiency?

  **Example:** Spending \$1M on Spillover Surveillance.
  *   Lower Bound: 0 lives saved (no spillover occurs).
  *   Upper Bound: 500 lives saved (spillover occurs and is caught).
  *   Break-Even: If Flu saves 10 lives/\$1M, Surveillance needs a >2% chance of the spillover event to be mathematically equivalent.

  #### Phase 3: The Confidence Discount (45 Minutes)
  *Goal: Quantify rational caution.*

  This is where you separate caution from bias. For every Red option, the committee must assign a **Confidence Weight (CW)** between 0.0 and 1.0.
  *   1.0 = As reliable as the Green option.
  *   0.5 = We are halving the value of the projected benefit due to uncertainty.
  *   0.0 = We have no reason to believe this will work.

  **The Calculation:** Multiply the *Upper Bound* of the Red option by the *Confidence Weight*. This gives you the **Adjusted Value**.
  *   *Compare:* Green EV vs. Red Adjusted Value.

  #### Phase 4: The Bias Check (30 Minutes)
  *Goal: Catch the "Made-Up Number" aversion.*

  This is the critical step. It exposes whether the committee is being *rationally cautious* (discounting the weight) or *irrationally biased* (rejecting the option regardless of weight).

  **The Question:** "If we could guarantee the Upper Bound outcome of the Red option, but we still couldn't tell you the probability of it happening, would you fund it?"

  *   **Answer A (Rational Caution):** "Yes, if the upside is high enough to justify the cost, even without knowing the odds."
      *   *Diagnosis:* You are ambiguity-averse, which is rational. You are using the Confidence Weight correctly.
  *   **Answer B (Irrational Bias):** "No. If we can't know the odds, we can't spend the money, even if it might save everyone."
      *   *Diagnosis:* You are treating ambiguity as a disqualifier rather than a risk factor. This is a value judgment, not a calculation.
      *   *Action:* **STOP.** Hand this to the Committee Chair as a policy question, not a budget question.

  #### Phase 5: The Value Handoff (When to Stop)
  *Goal: Acknowledge incommensurability.*

  The procedure must terminate and escalate to senior leadership if:
  1.  **The Trade-off is Lives vs. Structure:** One option saves identifiable lives now (Green); the other prevents a systemic collapse later (Red). Math cannot weigh "certain deaths" against "possible ruin."
  2.  **The Confidence Weight hits 0.0:** If the team cannot assign *any* weight >0 to a Red option, but the potential harm is catastrophic, the procedure fails. This is an insurance purchase, not an investment.
  3.  **The Bias Check fails:** As noted above.

  ---

  ### Running the Protocol on Your Three Cases

  #### Case 1: Flu (Green) vs. Spillover Surveillance (Red)
  *   **Inputs:**
      *   Flu: Cost \$1M, Saves 10 lives (EV = 10).
      *   Surveillance: Cost \$1M, Saves 0 (Lower) to 1,000 (Upper).
  *   **Procedure:**
      *   Committee assigns Confidence Weight to Surveillance. Let's say 0.1 (10% confidence the threat is real/monitoring works).
      *   Adjusted Value = 1,000 * 0.1 = 100 lives.
      *   Comparison: 10 (Flu) vs. 100 (Surveillance).
  *   **The Bias Check:** "If you knew surveillance would definitely catch the spillover if it happened, but you still don't know *if* it will happen, is it worth it?"
      *   If they say "Yes," the math holds. Move the money.
      *   If they say "No," they are biased against the ambiguity.
  *   **The Unwelcome Truth:**
      If the committee assigns a Confidence Weight low enough that the Adjusted Value drops below 10, **they must not move the money.**
      *Why:* You cannot justify spending *certain* resources on *ambiguous* benefits unless the ambiguity is weighted heavily. If the team genuinely believes the spillover risk is so nebulous that the weight is <1%, then shifting funds from Flu is **negligence**, not preparedness. You are trading certain deaths for a lottery ticket. The procedure forces them to admit that either the risk is real enough to fund (Weight > 1%) or it isn't. They cannot hide behind "just in case."

  #### Case 2: The Slick Vendor Model (False Precision)
  *   **Inputs:**
      *   Vendor presents a model for Spillover with precise probabilities (e.g., "3.4% chance of outbreak").
      *   Committee wants to tag this Green because "it has numbers."
  *   **Procedure:**
      *   Apply **Phase 1 (Provenance Tag)**.
      *   Ask: "What is the longitudinal data validating this 3.4%?"
      *   Vendor: "It's a simulation based on parameters from similar viruses."
      *   **Ruling:** Tag remains **Red**. The decimal point is cosmetic.
  *   **Execution:** Treat as an Interval (0 to Max), not a Point Estimate. Ignore the 3.4%.
  *   **Outcome:** The committee relaxes less. They are forced to assign a Confidence Weight to the *vendor's model*, not just the disease. Usually, this drops the Weight significantly.
  *   **Lesson:** Precision is not accuracy. The protocol prevents "math-washing" ambiguity.

  #### Case 3: The Unrankable Case (Equity vs. Efficiency)
  *   **Inputs:**
      *   Option A (Green): Vaccination campaign in urban center. High efficiency, low cost-per-life.
      *   Option B (Red): Outreach to remote/rural communities. Low efficiency (high cost-per-life), high ambiguity on uptake, but addresses a historical inequity.
  *   **Procedure:**
      *   Phase 2 (Interval): Option B has a wide interval.
      *   Phase 3 (Discount): Even with a high Confidence Weight, Option A's EV likely dominates.
      *   Phase 4 (Bias Check): The committee might say, "We prefer A because B's numbers are fuzzy."
  *   **The Stop:**
      *   This triggers **Phase 5 (Value Handoff)**.
      *   *Reason:* The "Value" of Option B includes a variable (Equity/Justice) that is not captured in "Lives Saved per Dollar."
      *   *Action:* The procedure refuses to rank them. The worksheet is stamped **"INCOMMENSURABLE."**
      *   *Message to Committee:* "Your spreadsheet cannot make this choice. This is a political determination of values. The Program Officer cannot recommend one over the other using this protocol."

  ---

  ### Notes for the Professor (Why this works)

  1.  **Dropping Bayesianism:** We aren't asking them to form priors. We are asking them to admit when they *lack* priors. The "Confidence Weight" is a Keynesian "weight of argument," not a probability. It functions as a discount rate on the utility, not a modifier of the probability.
  2.  **The Bias Distinction:** In standard theory, ambiguity aversion is a preference parameter. In practice, it's often a cognitive bug. The **Bias Check** forces them to reveal if they are averse to the *uncertainty* (rational) or averse to the *source* (bias). If they reject the option even when the Upside is guaranteed (but probability unknown), they are rejecting the *category* of ambiguity, which is a policy stance, not a decision calculation.
  3.  **The Unwelcome Truth (Case 1):** Public health officials often want to have it both ways: treat the novel threat as "urgent" to get funding, but "too uncertain" to be held accountable if it doesn't happen. This protocol forces a trade-off. If it's uncertain, discount it. If you discount it too much, you can't fund it. If you fund it, you must admit the weight is high, which means you believe the threat is real. It kills the "strategic ambiguity" they use to hedge bets.

  ### Implementation Advice for Your Student
  Tell her to print the **Phase 4 (Bias Check)** on a separate card and place it in the middle of the table. When anyone says, "We can't use that number, it's just a guess," she flips the card. "Then tell us what number *would* work, or admit you're vetoing the option based on discomfort, not data."

  It will make meetings uncomfortable. That is the point.
