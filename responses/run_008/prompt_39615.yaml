answer: |-
  This is a solid pedagogical instinct. You are correct: **Temporary Intrinsics (TI) must be the engine.** If you start with the worm picture, perdurantism looks like a gratuitous multiplication of entities. If you start with TI, perdurantism looks like a rescue mission for the Law of Non-Contradiction.

  Here is the dependency structure, the example choice, and the triage plan for a 50-minute section.

  ### 1. The Dependency Structure (0–50 mins)

  Your instinct is right: Numerical/Qualitative identity is the vocabulary, TI is the problem, Views are the solutions. Do not introduce temporal parts until the students feel the pain of TI.

  *   **0–5 mins: The Vocabulary (Numerical vs. Qualitative).**
      *   *Goal:* Establish that persistence requires numerical identity despite qualitative change.
      *   *Move:* Don't lecture this. Ask: "If I paint my bike red, is it the same bike?" (Numerical: Yes. Qualitative: No). "If I scrap it and build a new one from the metal, is it the same bike?" (Numerical: Debatable).
      *   *Constraint:* Keep this brisk. This is a tool, not the topic.
  *   **5–20 mins: The Engine (Problem of Temporary Intrinsics).**
      *   *Goal:* Make them feel the contradiction in Endurantism before offering the Perdurantist exit.
      *   *Move:* Introduce the carrying example (see below). Establish: Object $O$ is $F$ at $t_1$. Object $O$ is not-$F$ at $t_2$. $O$ is numerically identical over time.
      *   *The Trap:* Ask, "How can $O$ be $F$ and not-$F$?" If they say "at different times," press them: "Does adding 'at $t$' change the object, or just describe it?" This sets up the Endurantist's relational move vs. the Perdurantist's parthood move.
  *   **20–35 mins: The Solutions (Endurance vs. Perdurance).**
      *   *Goal:* Map the views onto the TI problem.
      *   *Endurantism:* $O$ is wholly present at $t_1$ and $t_2$. Properties are relations to times. (The poker is bent-*at*-$t_1$).
      *   *Perdurantism:* $O$ is the sum of temporal parts. No contradiction because different parts have different properties. (The $t_1$-part is bent, the $t_2$-part is straight).
  *   **35–45 mins: Misconception Triage (SR, Stage, "No Change").**
      *   *Goal:* Head off the specific derailments you listed. (See Section 3 below).
  *   **45–50 mins: Check for Understanding.**
      *   *Goal:* Discriminate between label-memorizers and dialectic-graspers. (See Section 4 below).

  ### 2. The Carrying Example: The Squashed Clay Ball

  **The Example:** A ball of clay that is perfectly spherical at $t_1$ and flattened into a disc at $t_2$.

  **Why this works:**
  1.  **Avoids Artifacts:** Unlike the Ship, a clay ball has no "function" to lose. It avoids the "is it still a ship?" criteria-of-identity swamp.
  2.  **Avoids Persons:** No psychological continuity, no Parfit, no "am I the same person?" emotional baggage.
  3.  **Avoids the Road Trap:** A road is spatially extended, which tempts students to think "Oh, temporal parts are just like spatial parts along the road." A clay ball is compact. When it is spherical, the *whole* thing is spherical. When it is flat, the *whole* thing is flat. This makes it harder for them to spatialize the time dimension prematurely. It forces the TI contradiction: The *whole* object has incompatible shapes at different times.

  **Where it predictably goes wrong:**
  *   **The "Matter" Confusion:** Students will conflate the clay (matter) with the ball (object). They will say, "The clay persists, so the object persists."
      *   *Fix:* Stipulate that we are talking about the *object* individuated by its shape. If you care about the matter, you're doing a constitution view. Keep them focused on the shape properties.
  *   **The "Destruction" Objection:** "But you destroyed the ball to make the disc."
      *   *Fix:* Pre-empt this. "Assume for the sake of argument it is the same object undergoing change, like you bending your arm. We are testing how that is *possible*, not whether it happened."

  ### 3. Misconceptions & Triage Strategy

  Here is the order they will form these misconceptions and where to kill them.

  **1. "Perdurantism means change is unreal / the worm just sits there."**
  *   *When:* Immediately after you explain the static 4D worm.
  *   *Fix:* Distinguish *change in an object* vs. *variation across parts*. "Does a mosaic change because it has red tiles and blue tiles? No. But the worm isn't a mosaic, it's a history. Change is qualitative variation along the temporal axis of the worm. It's real variation, just not variation in a *part*."
  *   *Script:* "Perdurantists don't deny change. They relocate it. It's not that the poker changes; it's that the poker *has* a bent part and a straight part."

  **2. "Endurantism is common sense; Perdurantism is crazy revisionism."**
  *   *When:* When comparing the two views.
  *   *Fix:* Remind them that Common Sense Endurantism leads to a logical contradiction (TI) unless they accept relational properties (which are also weird). "Common sense says the poker is just bent. Logic says it can't be bent and straight. Perdurantism saves logic at the cost of common sense. Endurantism saves common sense at the cost of logic (or by adding 'at $t$' relations). Both pay a price."

  **3. "Special Relativity settles this." (The Physics Major)**
  *   *When:* Q&A or comparison phase.
  *   *Decision:* **Do not debate this.** You are not the professor, and SR is the prof's follow-up topic. If you argue it, you might contradict the prof's nuance.
  *   *Fix:* The "Park and Validate" move. "That is an excellent point, and it's exactly what the Professor will cover in the lecture on Time and Physics. SR makes simultaneity relative, which creates huge headaches for Endurantists (who need a 'whole' object at a time). However, metaphysicians still debate this because some argue endurance can be made compatible with SR. For today, we are assuming a Newtonian background to understand the *ontological* commitments, not the *physical* ones."
  *   *Why:* This validates the physics major without letting them win the metaphysics debate prematurely.

  **4. Stage Theory (The "Third View")**
  *   *Decision:* **Cut it.**
  *   *Why:* In 50 minutes, Stage Theory confuses the "What persists?" question. It requires explaining seemings vs. being.
  *   *What to say:* If a student asks (they read the SEP), say: "Stage theory is a variant of perdurantism. Instead of saying 'I am the whole worm,' they say 'I am just the stage right now.' It solves some problems but creates others about prediction. For this section, we are treating Perdurantism as the 'Worm View' to keep the contrast with Endurantism sharp."

  ### 4. Check for Understanding (CFU)

  Your current draft ("Why 'bent' and 'straight' don't contradict") is too weak. A student can answer "Because different times!" without knowing *how* the theory handles that.

  **The Replacement Question:**
  Write this on the board:
  > **"The clay ball is spherical."**

  Ask: **"According to the Endurantist, why is this sentence incomplete? According to the Perdurantist, why is this sentence false?"**

  **Why this discriminates:**
  *   **The Memorizer:** Will say "Because time matters." (Vague).
  *   **The Understander (Endurance):** Will say "Because for the Endurantist, the *whole* object exists at every time. To predicate a shape without specifying a time implies it has that shape essentially or permanently. It needs the relational modifier 'at $t$' to be true."
  *   **The Understander (Perdurance):** Will say "Because the 'clay ball' refers to the 4D worm. The worm is not spherical; it is a worm-shaped object that *has* a spherical part. Predicating sphericality of the whole worm is like calling a zebra 'white'."

  **Scoring:**
  *   If they talk about "times" generally: **Pass.**
  *   If they talk about *predication* and *subjects* (whole object vs. worm vs. part): **Distinction.**

  ### Summary of the Arc
  1.  **Vocab:** Num/Qual Identity (Bike example).
  2.  **Problem:** TI (Clay Ball: Spherical then Flat).
  3.  **Solution A:** Endurance (Relations to times).
  4.  **Solution B:** Perdurance (Temporal parts).
  5.  **Triage:** SR is for the Prof; Stage Theory is a cousin; Change is real but relocated.
  6.  **CFU:** The "Incomplete vs. False" predication test.

  This keeps you within 50 minutes, avoids the Ship/Person traps, and leverages your instinct to make TI the driving force of the session. Good luck.
