      *   *Candidate 3: A Ball.* (Moving/Changing color/shape). Simple.
      *   *Candidate 4: A Leaf.* (Green to Red). Classic.
      *   *Selection:* **The Changing Leaf.**
      *   *Why:* It's organic (intuitive change), avoids "artifact" baggage of the Ship, avoids "consciousness" baggage of Persons. It clearly exhibits qualitative change over time (Green at $t_1$, Red at $t_2$).
      *   *Risk:* Students might think "The leaf died, it's a new object." Need to stipulate it's the *same* leaf undergoing seasonal change.
      *   *Spatial/Temporal Conflation Risk:* Unlike the road, a leaf's color change isn't easily mapped to "this part is green, that part is red" spatially (unless it's half-green/half-red). We must emphasize the *whole* leaf is green, then the *whole* leaf is red.

