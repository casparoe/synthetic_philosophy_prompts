prompt: |-
  So I'm a third-year PhD student and I'm TA-ing intro metaphysics for the first time (my area is ethics, great). Next week I have one fifty-minute section on persistence: endurantism vs perdurantism, temporal parts, the whole thing. The lecturer already spent most of the lecture on the Ship of Theseus, so that example is completely burned — if I bring it up again their eyes will glaze over, and anyway it just pushes them towards the fission/criteria-of-identity swamp, which is a different unit. I don't want you to explain the two views to me; I know them. I want a plan for the section itself: the order the pieces have to go in, and I mean the actual dependency structure, because I have a genuine question about that — my instinct is that the numerical vs qualitative identity distinction has to come first and that the problem of temporary intrinsics (the bent poker sort of case) should be the engine of the whole session rather than a technical dessert at the end, but I'm not sure whether that's right or whether students need the worm/stage picture on the table before temporary intrinsics can land as a problem rather than a pun.

  Second thing: the carrying example. It can't be the Ship, and I'd rather not do persons either, because persons immediately drag in personal identity and everyone starts relitigating Parfit instead of thinking about change. I tried the road analogy with my office mate — the road is one thing but it has a flat bit and a hairpin bit — and it half worked, except I worry it secretly teaches them that temporal parts are just spatial parts with a time label slapped on, which is exactly the confusion I need to not install. So tell me what the one example should be, what it has going for it, and what it predictably goes wrong at.

  Third: misconceptions, in the order students will actually form them, with the exact point in the sequence where each should be headed off. My guesses about what's coming: that perdurantism says nothing really persists, that it says change is unreal (the "the worm just sits there" reading), that endurantism is just common sense and perdurantism is the crazy revisionist position you'd only adopt if you hated common sense, and — guaranteed, because there's one physics double-major in the section — that special relativity has already settled this in favor of temporal parts so the whole debate is fighting the last war. I don't know whether to give the relativity point five minutes or whether to honestly defer it to the followup lecture the professor is doing on the topic, so tell me what you'd do. Also, do I fold stage theory in as a third view or present it as perdurantism's cousin with a different answer to who I am when I point at a photo of me as a kid? I suspect fifty minutes can't hold all three as equal citizens, but I'm not sure what to cut and say out loud that I'm cutting it.

  And then a check for understanding at the end — one question I could ask that would actually discriminate between a student who's got the dialectic and one who's just memorized the labels. My current attempt is something like asking them to explain why "the poker is bent" and "the poker is straight" don't contradict each other, but I suspect that's checkable without really understanding the debate, so fix or replace it. Please don't give me readings to assign, the syllabus is set, I just need the arc.
