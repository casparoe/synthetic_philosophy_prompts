          4.  Perdurantist Solution (Temporal parts).
          5.  Misconception Triage (SR, Stage, "No Change").
          6.  CFU.
      *   *SR:* Advise to acknowledge but defer. It's a "motivation" not a "proof."
      *   *Stage Theory:* Explicitly exclude. It muddies the water on persistence.
      *   *CFU:* Make it about *predication*.

  8.  **Refining the Misconception Order:**
