      *   **Tone:** Respectful, rigorous, empathetic but unsentimental. Match the user's philosophical literacy (use terms like "lexical priority," "normative force," "reductionism").
      *   **Specific Focus:** The "Authority Gap" is the big one. If the later self is a different person, the earlier self's "authority" is metaphorical at best. The user needs a bridge. The bridge is usually *property rights over the body* or *narrative integrity*.
      *   **Addressing (4):** This is the user's humane instinct. It conflicts with hardline Dworkin. The fix is to frame (4) as a *side-constraint* on how the AD is executed, not a veto on the AD itself.
      *   **Addressing (6):** This is actually compatible with (1) if framed as "validity conditions" rather than "overrides."

  6.  **Refining the "Authority" Argument (The Core Philosophical Hurdle):**
      *   Parfit says identity isn't what matters. Dworkin says critical interests matter.
