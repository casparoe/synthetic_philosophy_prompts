      *Wait, one more thing:* Commitment (4) is the wildcard. "Counts directly for me." This is subjective. It saves the user from being a monster, but logically it threatens the Dworkinian hardline. I need to make sure (4) is positioned as a *moral remainder* or a *constraint on means*, not a rival end.

