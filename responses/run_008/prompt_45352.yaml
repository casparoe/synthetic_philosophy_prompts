      *   (2) **Source of Authority:** Autonomy/Critical Interests (Dworkin), not Experiential Interests.
      *   (3) **Personal Identity:** Parfitian reductionism. Psychological connectedness matters. Late-stage dad $\neq$ earlier dad (in the "what matters" sense).
      *   (4) **Current Welfare:** The current resident's experiential welfare counts *directly* to the decision-maker (the user).
      *   (5) **Decision Standard:** Not family comfort, not doctor default. (Process constraint).
      *   (6) **Defeasibility:** ADs can be set aside for *factual errors*, not for *change of mind/preferences* by the current patient.

  3.  **Identify Potential Tensions:**

      *   **Tension A: (1)+(2) vs. (3) (The Authority Gap).**
          *   *Issue:* If (3) is true (late-stage dad is a different person/psychological continuity is broken), why does the earlier self have *authority* over the later self? Usually, authority requires identity or a specific moral relationship. If they are distinct persons, why isn't this colonialism?
          *   *Severity:* High. This strikes at the metaphysical justification for the AD.

      *   **Tension B: (2) vs. (4) (Critical vs. Experiential).**
          *   *Issue:* (2) says authority comes from critical interests. (4) says current experiential welfare counts directly. What happens when they clash? (e.g., Dad is happy being fed, but AD says no feeding tube). (2) implies critical interests win (via (1)). (4) implies experiential interests have weight. Do they have *veto* weight?
