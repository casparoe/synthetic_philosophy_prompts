      *(Self-Correction during drafting)*: I need to be careful not to invalidate their Parfitian view. If I say "Identity matters more," I'm ignoring their premise. I must work *within* Parfit + Dworkin.
      *   *Key Insight:* Parfit reduces the *self-interest* in survival, but doesn't necessarily erase *obligations* created by the earlier self regarding the body. The body is the shared resource.
      *   *Refined Tension:* The tension is between "Authority" (1) and "Different Person" (3). If they are different people, Authority is weak.
