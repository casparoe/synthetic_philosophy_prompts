answer: |-
  There is a principle that captures your verdicts, but it requires sharpening your partner's criterion with a specific distinction regarding *agency*. Your partner's criterion (availability, automaticity, trust) is necessary, but it is not sufficient. It describes how you *access* a resource, but not what *kind* of cognitive work that resource is doing.

  To preserve your intuition that the Daybook is *in* while the GPS is *out*, you need to distinguish between **archival retrieval** (fetching data for you to use) and **agentic delegation** (having the tool process data or make decisions for you).

  Here is the precise principle that fits your cases, followed by the analysis you requested.

  ### The Integrated Mnemonic Extension Principle

  An external resource counts as part of your mind if and only if it satisfies all three of the following clauses:

  1.  **The Transparency Clause:** The resource is reliably available and consulted automatically, without deliberative effort.
      *   *Motivated by:* Distinguishing the **Neighbor's Daybook** (In) from a random scrap of paper you might lose or hesitate to use. It also excludes the **Scrabble Player** (Out), who deliberates before choosing to look up an anagram; the lookup is a strategic choice, not a transparent reflex.
  2.  **The Endorsement Clause:** You generally accept the output of the resource as your own without independent verification.
      *   *Motivated by:* Distinguishing the **Password Manager** (In) from a list of passwords you constantly double-check against a secondary source. It also helps exclude the **Horoscope** (Out) if we interpret "endorsement" as relying on *factual* accuracy rather than *guidance*, though Clause 3 does the heavier lifting here.
  3.  **The Non-Delegation Clause:** The resource functions as a store of information (memory) that *you* process, rather than an agent that processes information *for you* (computation/guidance).
      *   *Motivated by:* This is the crucial clause that saves your **GPS** verdict (Out). The GPS calculates the route and tells you where to go; it performs the cognitive labor of navigation. The Daybook and Password Manager merely store data for *you* to retrieve and act upon. This also excludes the **Scrabble App** (which computes anagrams) and the **Horoscope** (which computes advice).

  **Verdict on the Wavering Case:** Under this principle, your **Colleague's Index** is **In**. It is an archival store (Clause 3), consulted automatically during writing (Clause 1), and trusted (Clause 2). The only reason to waver is if the index points to books that are *not* readily available; if the books are in a distant library, it fails Clause 1. If the books are on his shelf, the index is part of his mind.

  ### Can Your Partner's Criterion Be Repaired?

  Your partner's criterion is essentially the standard philosophical argument for the "Extended Mind" (proposed by Clark & Chalmers in 1998). It cannot be simply "repaired" with a tweak; it must be **restricted**.

  As it stands, your partner's criterion is too broad because it focuses on the *relationship* between user and tool, ignoring the *function* of the tool.
  *   **The Fix:** You must add a constraint about the **type of cognitive process**. Your partner's criterion works perfectly for *memory* (Daybook, Passwords), but fails for *navigation* (GPS) or *reasoning* (Scrabble).
  *   **The Repair:** Add the stipulation: *"This criterion applies only to processes of storage and retrieval, not to processes of calculation, navigation, or decision-making."*
  *   **Why this matters:** If you accept your partner's criterion without this restriction, you are committed to Functionalism—the view that where the skin stops doesn't matter, only what the system *does*. If you accept Functionalism, you **ought to give up your GPS verdict**. If the GPS is trusted, automatic, and indispensable, a functionalist says it *is* part of his spatial memory system.
  *   **Recommendation:** If you want to keep the Daybook/GPS distinction, you must reject pure Functionalism in favor of the **Non-Delegation Clause** above. This is philosophically defensible (it preserves human agency), but it is "ad hoc" only in the sense that it draws a line between memory and computation. Given your other verdicts (Scrabble Out, Password In), this line is consistent with your intuitions.

  ### The Unlisted Cases

  Here is how the **Integrated Mnemonic Extension Principle** applies to the two new cases you mentioned.

  **1. The Couple with Divided Memory**
  *   **Verdict:** **No.** (With a caveat).
  *   **Reasoning:** This fails the **Non-Delegation Clause** in a specific way: the "tool" is another *agent*. While the access is automatic and trusted (Clauses 1 & 2), a partner is not a passive archive. They have their own agency, memory failures, and potential for deception.
  *   **Nuance:** Philosophers call this a *Transactive Memory System*. While the *couple* functions as a single cognitive system, the individual minds remain distinct. You do not "contain" your partner's memory; you contain a *reference* to it (i.e., "He knows the birthdays").
  *   **Advice:** Do not count the partner's knowledge as part of your mind. Count your *knowledge of who knows what* as part of your mind. This preserves the boundary between persons, which is ethically and practically crucial.

  **2. The Language Learner**
  *   **Verdict:** **Yes.**
  *   **Reasoning:** This is the strongest case for extension you have encountered.
      *   **Transparency:** The lookup is "so fast" it feels instantaneous (Clause 1).
      *   **Endorsement:** She trusts it implicitly (Clause 2).
      *   **Non-Delegation:** A dictionary (even digital) is a store of definitions. She retrieves the meaning; she does not delegate the *use* of the word to the phone. It functions exactly like biological lexical retrieval (Clause 3).
  *   **Implication:** If the Daybook is part of the neighbor's mind, the phone is part of the learner's vocabulary. The "gap" she feels is not a lack of knowledge, but a latency in retrieval—exactly like the "tip of the tongue" phenomenon in biological memory.

  ### Summary Advice

  You do not need to give up your verdicts, but you must commit to the **Non-Delegation Clause**.

  *   **If you keep the clause:** You preserve the Daybook/GPS distinction. The GPS is a pilot; the Daybook is a library. You are part of the pilot's system, but the library is part of *you*.
  *   **If you drop the clause:** You must concede the GPS is part of your husband's mind. This is the cleaner philosophical position (Functionalism), but it conflicts with your gut feeling that navigation feels different from remembering.

  Given that you also exclude the Scrabble app (which computes) and include the Password Manager (which stores), your intuitions are already committed to the **Storage vs. Computation** distinction. Stick with that. It is not ugly; it is a defense of human agency against mere automation.
