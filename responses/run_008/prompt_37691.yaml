  # ML Interpretability Ontology Decision Tree

  **Instructions:** Answer each question based on your intuition about neural network internals. Do not worry about which philosophical position your answer supports; answer based on what feels technically correct to you.

  **Q1: Decomposition Uniqueness**
  If two different feature decompositions (e.g., different SAE dictionaries) predict the model's behavior equally well but carve up the internal space differently, is one of them objectively wrong?
  *   **Yes:** Go to Q2.
  *   **No:** Go to Q4.

  **Q2: Causal Load**
  If a discovered feature correlates perfectly with a behavior but ablating (zeroing out) that feature changes nothing, did you find a real feature?
  *   **Yes:** Leaf: **Pragmatic Realist** (Features exist, but correlation is sufficient evidence).
  *   **No:** Go to Q3. (You require causal impact).

  **Q3: Superposition Cost**
  When features are stored in overlapping directions (superposition), does the interference cost the model pays to keep them separable make them *more* real or *less* real?
  *   **More Real:** Leaf: **Robust Realist** (Features exist independently; cost confirms reality).
  *   **Less Real:** Leaf: **Fragile Realist** (Features exist, but are mathematical artifacts).

  **Q4: Internal Existence**
  Is there *any* sense in which a direction in activation space deserves the label "feature," or is it all just vector math?
  *   **Just Math:** Leaf: **Eliminativist** (Nothing inside deserves semantic labels).
  *   **Deserves Label:** Go to Q5.

  **Q5: Utility vs. Reality**
  If a pattern supports compression and prediction, is that *all* the reality it needs, or is it still just a useful tool?
  *   **All the Reality:** Leaf: **Real Patterns** (Patterns are real if they compress data).
  *   **Just a Tool:** Leaf: **Instrumentalist** (Feature talk is a useful fiction).

  ***

  **Resolution Limits & Notes:**
  *   **Real Patterns vs. Instrumentalist:** Be aware that Q5 often fails to separate these views in practice. Many engineers hold both positions simultaneously (the pattern is "real enough" because the tool works). If you found Q5 difficult, you likely sit on this boundary.
  *   **Plausibility:** All leaves represent coherent engineering stances. "Fragile Realist" is less common but plausible for those who believe features exist but are unstable across architectures.

