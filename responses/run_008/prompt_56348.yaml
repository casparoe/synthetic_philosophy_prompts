answer: |-
  This is a classic "specification vs. implementation" problem. You are trying to debug your ethical intuition like it's a legacy codebase: you have a bunch of test cases (your scenarios), some pass, some fail, and you're looking for the underlying logic that makes the test suite consistent.

  Since you're a backend engineer, I'm going to skip the philosophy jargon. No Locke, no Kant, no "noumena." Instead, think of this as **The Principle of the Implicit API.**

  ### The Principle: The Implicit API of Exchange

  Every interaction where value (code, ideas, designs) moves from Person A to Person B runs on an **Implicit API**. This API defines the "handshake" required to legally and ethically consume that value.

  *   **The Endpoint:** The value itself (the code, the idea, the algorithm).
  *   **The Auth Protocol:** The cost required to access it (money, attribution, confidentiality, effort).
  *   **The Violation:** Bypassing the Auth Protocol to access the Endpoint.

  "Ownership" isn't a magical property of the idea; it's a record of who paid the Auth cost. If you consume the value without satisfying the protocol of that specific context, you are freeloading.

  Here is how this principle refactors your test cases, including which verdicts need to be patched.

  ---

  ### 1. Refactoring Your Existing Cases

  **Case: Blog Post (Learn -> Implement)**
  *   **Protocol:** Public Read.
  *   **Auth Cost:** Attention / Time.
  *   **Verdict:** **Fine.** You paid the cost. You read the prose, you did the work to translate it into your own system. The API is public.

  **Case: GitHub (Copy -> Closed Source)**
  *   **Protocol:** Open Source License.
  *   **Auth Cost:** Compliance (attribution, sharing changes) or Permission.
  *   **Verdict:** **Not Fine.** You deleted the license file. You literally stripped the Auth header from the request. This is a hard violation.

  **Case: Reverse Engineering (Competitor -> Own Version)**
  *   **Protocol:** Public Interface.
  *   **Auth Cost:** Engineering Effort (deduction).
  *   **Verdict:** **Fine.** The competitor exposed a public API (their product). You did not access their private source (their internal logic). You paid the cost of figuring it out yourself. The "dirty" feeling is just empathy, not ethics.

  **Case: Academic Paper (Verbatim Algorithm)**
  *   **Protocol:** Academic Dissemination.
  *   **Auth Cost:** **Attribution / Citation.**
  *   **Verdict:** **PATCH REQUIRED.** You said this is "Fine." It is only fine *if you cite the paper*.
      *   *Why:* The academic economy runs on credit, not money. If you implement their algorithm, use their variable structures, and *don't cite them*, you are claiming their labor as yours. That is plagiarism. The Auth Protocol for papers is "You can use this, but you must point to us." If you skip the citation, you bypassed the tollbooth.

  **Case: Friend at Party (Idea -> Build)**
  *   **Protocol:** Social Trust / Confidentiality.
  *   **Auth Cost:** Loyalty / Collaboration / Permission.
  *   **Verdict:** **Not Fine.** This is the case that broke your "Idea vs. Expression" theory. But under the Implicit API theory, it makes sense. When a friend shares an idea in a social setting, the Implicit API is "Venting/Brainstorming," not "Public Release." The Auth Cost is maintaining the trust of the friendship. By building it alone, you bypassed the social contract. You didn't steal the code; you stole the *opportunity*.

  **Case: Take-Home Assignment (Interview -> Company Ship)**
  *   **Protocol:** Hiring Evaluation.
  *   **Auth Cost:** Hiring Decision or Return of IP.
  *   **Verdict:** **Theft.** Your gut was right to be suspicious. The Implicit API of a take-home test is "Evaluate my skills," not "Solve your production problem." If they ship your solution, they consumed the Endpoint (working code) without paying the Auth Cost (hiring you or paying for the spec work). They treated a `GET /evaluate` endpoint like a `POST /deploy` endpoint.

  ---

  ### 2. The New Cases

  Now let's run your two new scenarios through the compiler.

  **Case 1: Training AI on Public Repos**
  *   **Protocol:** Public Human Consumption.
  *   **Auth Cost:** Human Engagement / Attribution.
  *   **Analysis:** When a dev puts code on GitHub, the Implicit API is designed for *other humans* to read, learn, or fork. The expected return is reputation, collaboration, or adoption.
  *   **Verdict:** **Ethically Gray / Problematic.** An AI model ingesting millions of repos is not "reading" in the social sense. It is extracting statistical patterns without engaging in the ecosystem (no stars, no forks, no issues, no attribution). It bypasses the intended "Human Reader" Auth Protocol. Under the Implicit API principle, this looks like scraping a site to resell the content rather than visiting it to buy something. It's a protocol mismatch.

  **Case 2: Avoiding Patents ("Clean Room Design")**
  *   **Protocol:** Legal Disclosure.
  *   **Auth Cost:** Licensing Fee or Invention of Alternative.
  *   **Analysis:** The patent system is a specific API: "I disclose my invention to the public, and in exchange, I get a temporary monopoly." If you read the patent, you know the monopoly exists. If you *deliberately avoid* reading it, you are ensuring that your implementation is truly independent.
  *   **Verdict:** **Fine.** This is standard industry practice (Clean Room Design). You are respecting the protocol. You are saying, "I will not access your private logic (the patent details) to save myself effort." You are paying the Auth Cost of doing the work yourself without contamination. It feels fine because you aren't bypassing a tollbooth; you are building a parallel road.

  ---

  ### 3. Summary of the Principle

  To answer your question directly: **You do not own ideas. You own the *leverage* granted by the context in which the idea was shared.**

  *   **Public Context (Blogs, Products):** Leverage is low. You can use it if you pay the effort cost.
  *   **Licensed Context (GitHub, Patents):** Leverage is defined by the license. You must follow the rules.
  *   **Private/Social Context (Friends, Interviews):** Leverage is high. The value is tied to the relationship or the specific transaction. Taking the value without the relationship/transaction is theft.

  **The One Verdict You Must Throw Out:**
  You need to update your view on the **Academic Paper**. Implementing an algorithm is fine; implementing it *verbatim with the same variable structure* without citation is plagiarism. The "currency" of academia is credit. If you don't pay that, you're stealing.

  **The One Verdict You Should Trust:**
  Your hesitation on the **Take-Home Assignment**. That is a growing plague in the industry. Companies that ship interview solutions are violating the Implicit API of hiring. It is spec work, and ethically, it is theft of labor.

  ### Final Debugging Tip
  When you feel that "dirty" feeling (like with the reverse engineering) vs. that "angry" feeling (like with the GitHub copier), check the **Auth Protocol**.
  *   **Dirty feeling:** You followed the rules, but you exploited a loophole (Reverse engineering). Ethically permissible, socially awkward.
  *   **Angry feeling:** You broke the rules (GitHub license, Take-home). Ethically prohibited.

  Your intuition is working correctly; you just needed to define the API contract for each situation.
