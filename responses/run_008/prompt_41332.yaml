answer: |-
  Here is a concrete example you can adapt for your piece.

  **The Scenario: The Bus Stop on a Straight Road**

  Imagine three neighbors—Alice, Bob, and Charlie—living along a single, straight road. They need to decide where to build a new bus stop. The only possible locations are their own three houses. Alice lives at mile marker 1, Bob at mile marker 5, and Charlie at mile marker 9.

  **The Natural Restriction**
  In this situation, it is natural to assume that each neighbor prefers the bus stop to be as close to their own home as possible. Alice's favorite spot is mile 1, her second favorite is mile 5, and her least favorite is mile 9. Bob's favorite is 5, and he is indifferent between 1 and 9 (or perhaps prefers the one closer to his daily routine, but crucially, he doesn't prefer the extremes *over* the middle). Charlie's favorite is 9, then 5, then 1.

  This creates a specific structure called "single-peaked" preferences. Everyone has one ideal spot, and their satisfaction drops off steadily the further you move away from it in either direction. Nobody looks at the map and says, "I really want the stop at mile 1, but if I can't have that, I'd prefer mile 9 over mile 5." That would imply they enjoy walking past their own house to get to the stop, which makes no sense physically.

  **The Voting Rule: Pick the Median**
  The group agrees on a simple rule: Everyone announces their ideal location, and the group builds the stop at the **median** location (the middle one). In our example, the locations are 1, 5, and 9. The middle value is 5. The stop goes at Bob's house.

  **Why Nobody Can Game It**
  Under the Gibbard–Satterthwaite theorem, we would expect someone to be able to lie to get a better result. But here, lying doesn't help.

  Suppose Alice wants the stop at mile 1, but she sees that the current median is mile 5. She considers lying and claiming her ideal spot is actually mile 4, hoping to pull the median toward her. But the votes are now 4, 5, and 9. The median is *still* 5. Her lie changed nothing.

  What if she lies more aggressively and claims she wants the stop at mile 6? Now the votes are 5, 6, and 9. The median becomes 6. The stop moves to mile 6. But Alice lives at mile 1. Moving the stop from 5 to 6 puts it *further* away from her home. She made the outcome worse for herself by lying.

  Because the preferences are aligned along a single line, the median voter (Bob) is a dictator only in the sense that his preference wins, but he isn't a "dictator" by the theorem's definition because if Alice and Charlie both lived at mile 2, the median would be 2, and Bob would lose. The outcome depends on everyone's position, not just one person's fixed authority.

  **The Loophole: Restricting the Domain**
  This example evades the Gibbard–Satterthwaite theorem by relaxing the condition of **Unrestricted Domain**. The theorem assumes voters can have *any* logical preference ordering—for example, that Alice could prefer the far left option most, the far right option second, and the middle option last.

  In the bus stop case, we are restricting the domain of allowable preferences to only those that make geographical sense (single-peaked). We are saying, "You can prefer any spot you want, but your preferences must decline as you move away from your ideal."

  **Why This Isn't Cheating**
  This evasion is fair game because it isn't an arbitrary rule imposed by the voting system; it's a constraint imposed by reality. We aren't forbidding voters from having complex preferences; we are acknowledging that in this specific context, complex preferences don't exist. No one actually wants to walk further than necessary.

  When the choices available to a group align along a single spectrum—like temperature, budget size, or location on a road—democracy isn't broken. The theorem warns us that democracy is fragile when choices are complex and multidimensional, but where preferences are naturally structured, simple rules like the median vote can be both fair and immune to gaming.
