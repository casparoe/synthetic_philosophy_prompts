answer: |-
  This is a classic dialectic, and your classmate has reconstructed a very strong version of the "Self-Promising" or "Bootstrapping" objection often leveled against Gauthier and defenders of the Standard View (like Kavka or Bratman). The tension you feel is the tension between **instrumental rationality** (maximize utility) and **normative consistency** (intention requires belief/commitment).

  Here is my diagnosis: You should **reject the Parity Claim (4)–(5)** and, consequently, the conclusion **(7)**. You can and should keep **(1)**.

  However, to do this without accepting the Professor's potentially circular reply, you must refine *why* the parity fails. The cost is accepting a robust theory of **normative powers** that distinguishes social/moral commitments from purely strategic mental states.

  ### The Diagnosis: Why (4)–(5) and (7) Fail

  Your classmate's argument hinges on the claim that promises, leases, and resolutions are structurally identical to the Toxin case. They are not. The difference lies in **where the future reason comes from.**

  **1. The Structure of Reasons in Commitment Cases**
  In the promise/lease case, the reason to comply at $t_2$ (Saturday afternoon) does not arise *ex nihilo* from the intention itself. It arises from a **normative act** performed at $t_1$ (the act of promising/signing).
  *   **The Professor's Point (Refined):** When you promise, you invoke a social/moral practice (or exercise a normative power, per Raz/Scanlon) that *actually changes the normative landscape*. At $t_2$, you have a decisive reason to help your friend move: *you promised*. This reason exists independently of whether you currently *intend* to keep the promise. The intention merely tracks this independent reason.
  *   **Why it's not Bootstrapping:** The classmate claims the reason is "manufactured by the intention." This is false for promises. The reason is manufactured by the *speech act* or *agreement*, which binds the agent regardless of their subsequent mental state. If you change your mind at $t_2$, you still have the reason (the obligation); you are just choosing to violate it. Therefore, premise (1) is not violated in promise cases: at $t_2$, you *do* have decisive reason to comply (the obligation outweighs the laziness), so intending to comply is consistent with (1).

  **2. The Structure of Reasons in the Toxin Case**
  In the Toxin case, there is no normative practice. There is no "act of intending" that generates an obligation.
  *   At $t_2$ (afternoon), the money is in the bank. The only physical consequence of drinking is sickness.
  *   There is *no* independent reason to drink. The only potential reason would be "because I intended to."
  *   If "because I intended to" is the *only* reason, then the classmate is right: that is bootstrapping. You cannot create a reason to $\phi$ merely by intending to $\phi$ if there was no prior reason to form that intention.
  *   Therefore, in the Toxin case, at $t_2$, you truly have decisive reason *not* to drink. Premise (1) applies: you cannot intend to do what you know you have decisive reason not to do.

  **3. Why (7) is Incoherent**
  Your classmate's conclusion (7) claims the agent can "intend to drink... and then calmly decline." This violates the **Strong Consistency Requirement** on intention (championed by Michael Bratman). Intention is not a wish or a prediction; it is a **commitment to act**.
  *   To intend to $\phi$ entails (normally) believing you will $\phi$ and planning to $\phi$.
  *   If you know at $t_1$ that at $t_2$ you will have zero reason to $\phi$ and will not $\phi$, you cannot sincerely believe you will $\phi$.
  *   If you cannot believe you will $\phi$, you cannot intend to $\phi$.
  *   Therefore, the state described in (7) ("holding a perfectly rational intention" while knowing you won't act on it) is psychologically/normatively impossible for a rational agent. It describes a liar, not an intender.

  ### The Cost of This View

  If you reject the parity and keep (1), here is the price you pay:

  **1. You must accept that Rationality is not purely Outcome-Oriented.**
  You are admitting that a rational agent cannot simply "hack" their own psychology to get the million. You cannot treat your own intentions as tools that operate independently of your reasons for action. This limits the scope of instrumental rationality. You cannot be a "pure strategist" about your own mind.

  **2. You must defend Normative Realism (or at least Normative Powers).**
  To save the promise case, you must assert that promises *actually create reasons*. If you are a hardline Humean who believes reasons are *only* derived from pre-existing desires, then the Professor is wrong: a promise creates no new reason, only a new desire (to avoid guilt). If that desire is weaker than the desire to avoid moving, the promise case collapses into the Toxin case.
  *   **The Cost:** You must argue that the "obligation" of a promise is a reason that stands even against your current desires. This moves you away from simple desire-based rational choice theory toward a more Kantian or Practice-Based view (Rawls, Scanlon, Raz).

  **3. The "Alcoholic" Case becomes the Hard Case.**
  The promise case is easy (external obligation). The Toxin case is easy (no obligation). The **Alcoholic/Resolution** case is the battlefield.
  *   If an alcoholic resolves at breakfast not to drink, is that like a promise (internal obligation) or like Toxin (no obligation)?
  *   **To save (1):** You must argue that a resolution *can* create a reason, but only if it is tied to **Identity** or **Precommitment**.
      *   *Identity:* "I am not a drinker." Drinking at the party violates self-conception, which is a cost at $t_2$. Thus, there *is* a reason at $t_2$.
      *   *Precommitment:* If the resolution involves burning bridges (giving keys to a friend), the payoff structure changes physically.
      *   *Pure Mental Resolution:* If it is *only* a mental state with no identity cost or physical lock, it *is* like Toxin. On this view, a rational alcoholic *cannot* form a sincere resolution they know they will break. They are merely wishing. This is a bitter pill: it means many "resolutions" are irrational self-deceptions.

  ### Where My Diagnosis Might Fail (The Vulnerability)

  I recommend this position for your seminar, but here is where it is most vulnerable to counter-attack:

  **1. The Humean Objection:**
  If your seminar leans heavily on a Humean Theory of Reasons (reasons are slaves to the passions), my defense of the promise case collapses. A Humean will say: "The promise creates no *new* reason. It only adds a desire to avoid guilt. If the agent knows at $t_2$ that the guilt will be less painful than the labor of moving, they have decisive reason *not* to move."
  *   **Consequence:** If the Humean is right, then the Professor is wrong. The promise case *is* structurally identical to the Toxin case. If you want to keep (1), you must conclude that **promises are often irrational** if you know you will renege. This is a massive cost to practical life.
  *   **Move to make:** You must argue that rational choice theory must accommodate **normative facts** (obligations) as inputs to the utility function, not just desires.

  **2. The "Self-Binding" Loophole:**
  A clever classmate might argue: "Why can't I treat the Toxin intention as a precommitment device?"
  *   *Argument:* "I intend to drink. If I don't drink, I prove I am the kind of person who cannot intend. Being that kind of person has long-term disutility (I can't make contracts, etc.). Therefore, at $t_2$, I have a reason to drink: to maintain my reputation as an intender."
  *   **Counter:** This turns the one-off Toxin puzzle into an iterated game. Kavka specifies the case is unique and secret. If the billionaire never tells anyone whether you drank, and you never face a billionaire again, the "reputation" reason vanishes.
  *   **Vulnerability:** If you argue that *maintaining rationality* is itself a reason to drink, you risk circularity. "I drink to prove I am rational" implies "I am rational because I drink."

  ### Summary for Seminar

  1.  **Reject (4)–(5) and (7).** Keep (1).
  2.  **Argument:** The parity fails because promises/contracts invoke **normative powers** that generate independent reasons at $t_2$. Toxin does not.
  3.  **Avoid Bootstrapping:** The reason comes from the *act of promising*, not the *intention*. The intention tracks the reason. In Toxin, the intention tries to *be* the reason.
  4.  **Cost:** You must accept that intentions are constrained by reasons (you can't just intend for payoff) and that obligations are real reasons (not just desires).
  5.  **Weak Point:** If your seminar assumes a Humean theory of reasons, the distinction between Promise and Toxin evaporates. Be prepared to defend the existence of obligation-based reasons.

  This position allows you to keep the intuition that the Millionaire's offer is a trap (you can't get the money) without sacrificing the rationality of everyday commitments. It preserves the integrity of intention while acknowledging the special normative status of social agreements.
