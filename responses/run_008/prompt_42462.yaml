      *   *Empty Spot:* A view that says "There is a fact, it is internal, but it is non-normative." This is basically Dispositionalism.
      *   *Empty Spot:* "There is no fact, and we should stop talking about meaning." (Eliminativism). Not requested, but possible.
      *   *Incoherent:* "There is a fact, but it depends on the community, yet a solitary human could have it." (Contradiction in Node 3).

