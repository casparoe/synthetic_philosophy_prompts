answer: |-
  # Handout: Mapping the Logical Space of Rule-Following
  **Seminar:** Intermediate Philosophy of Language  
  **Topic:** The Grounds of Correctness (Kripke's Wittgenstein)

  ### Instructions
  This decision tree is designed to help you locate your own pre-theoretical intuitions about meaning within the logical space of the rule-following debate. You do not need to know the names of the philosophical positions to use this tree. Answer the questions based on how you think about the case described.

  **The Starting Commitment:**  
  We all agree that when you computed **68 + 57** just now, you were **right** to answer **'125'** and would have been **wrong** to answer **'5'**.

  ---

  ### The Decision Tree

  **NODE 1: The Fact of Meaning**  
  Consider your past use of the word "plus" before today. Is there a specific **fact** about you (your mind, brain, or behavior) that makes it *true* that you meant *addition* rather than *quaddition*?  
  *(Note: "Quaddition" is a function where you answer normally for small numbers, but for any numbers larger than 57, you answer '5'. So, under quaddition, 68 + 57 = 5.)*

  *   **YES, there is a fact of the matter.** → Go to **NODE 2**
  *   **NO, there is no such fact.** → Go to **NODE 5**

  ---

  **NODE 2: The Nature of the Fact (Normativity)**  
  If there is a fact, does this fact **tell you what you ought to do** (it constrains you), or does it merely **predict what you will do** (it describes your tendencies)?  
  *(Test: If you were tired and made a mistake, does the fact say you were wrong, or just that you deviated from your habit?)*

  *   **It merely predicts/describes my tendencies.** → **LEAF A: Simple Dispositionalism**
  *   **It tells me what I ought to do (Normative).** → Go to **NODE 3**

  ---

  **NODE 3: The Solitary Rule-Follower**  
  If the fact is normative (it tells you what you ought to do), could a single human being, isolated from birth with no community, possess this fact and be bound by it?  
  *(Test: Imagine Robinson Crusoe calculating alone. Is he capable of being right or wrong, or only different?)*

  *   **YES, a solitary individual can be bound by meaning facts.** → **LEAF B: Platonist/Intentionalist Realism**
  *   **NO, meaning requires a community to establish norms.** → **LEAF C: Communitarian Realism**

  ---

  **NODE 4: (Unused - Logical Shortcut)**  
  *(This branch is closed because all Factualist paths are accounted for in Leaves A, B, and C.)*

  ---

  **NODE 5: The Status of the Question**  
  If there is no fact of the matter about what you meant, is the question "What did I mean?" a **confused question** based on a bad picture of language, or is it a **legitimate question** that simply lacks a truth-conditional answer?

  *   **It is a confused question; we should dissolve the worry.** → **LEAF D: Quietist/Deflationary Exit**
  *   **It is legitimate, but we must explain correctness without facts.** → Go to **NODE 6**

  ---

  **NODE 6: The Ground of Correctness**  
  If there is no fact, what makes '125' the acceptable answer rather than '5'? Is it that others **agree** with you, or is it that you share a **natural instinct** with others?  
  *(Test: If everyone else answered '5', would you be wrong? Or is correctness just about acting in accord with our shared natural history?)*

  *   **Correctness depends on Community Agreement/Correction.** → **LEAF E: Skeptical-Solution Non-Factualism**
  *   **Correctness depends on Shared Natural Instincts/History.** → **LEAF F: Natural-History View**

  ---

  ### Map of Positions (Leaves)

  | Leaf | Position Label | Core Claim |
  | :--- | :--- | :--- |
  | **A** | **Simple Dispositionalism** | Meaning is just a disposition to behave in certain ways. (Kripke argues this fails to account for normativity). |
  | **B** | **Platonist/Intentionalist Realism** | Meanings are abstract objects or robust mental contents that determine use independently of others. |
  | **C** | **Communitarian Realism** | Meaning facts exist, but they are constituted by social practices and agreement. |
  | **D** | **Quietist/Deflationary** | The search for a "ground" is a philosophical illusion; meaning is just use. |
  | **E** | **Skeptical-Solution Non-Factualism** | There are no truth-conditions for meaning, but community assertibility conditions license our talk. (Kripke's Wittgenstein). |
  | **F** | **Natural-History View** | Norms are not justified by facts or agreement, but are simply the bedrock of what we find ourselves doing. |

  ---

  ### Structural Analysis of the Tree

  **1. Indistinguishable Leaves (Flagged Pairs)**
  *   **Leaf C (Communitarian Realism) vs. Leaf E (Skeptical Solution):** This is the most difficult distinction in the tree. Both rely heavily on the community. The logical distinction is that **C** claims the community *creates a truth* (Factualism), whereas **E** claims the community *licenses assertion* without truth (Non-Factualism). In practice, students often struggle to see why this metaphysical distinction matters for the practice of correcting one another.
  *   **Leaf D (Quietist) vs. Leaf F (Natural-History):** Both deny the need for a robust fact. **D** thinks the philosophical problem is a mistake to be cured. **F** thinks the problem is real but the answer is brute nature. Students who feel the "urge" to ask the question often land in F; those who feel the urge is nonsense land in D.

  **2. Unoccupied Combinations**
  *   **Solitary Non-Factualist:** A view where there is no fact of the matter, *and* a solitary individual can still follow a rule. This spot is logically possible but largely unoccupied in the literature. It would require a notion of normativity that is neither factual nor social. It looks **unattractive** because without facts or a community, it is hard to distinguish "right" from "seems right."
  *   **Dispositional Communitarian:** A view where the fact is non-normative (dispositional) but depends on the community. This collapses into **Leaf A** or **Leaf C** depending on whether the disposition is treated as truth-making. It is **unexplored** because dispositionalists usually want to naturalize meaning individually.

  **3. Coherence Check**
  *   All six leaves represent coherent, historically defended positions.
  *   The path from **Node 1 (No)** to **Node 3** is blocked. You cannot deny meaning facts exist (Node 1) and then claim a solitary individual possesses a normative meaning fact (Node 3). This contradiction is successfully avoided by the tree structure.

  ---

  ### TA Confidence Note

  **Confidence in Leaf Placement:**
  *   **High Confidence:** Leaves A (Dispositionalism), B (Platonism), and E (Skeptical Solution). These are the standard triad in the Kripke literature and map cleanly onto the Fact/Norm/Community distinctions.
  *   **Medium Confidence:** Leaf C (Communitarian Realism). While logically distinct from E, many interpreters argue Kripke's Wittgenstein *is* a communitarian, blurring the line between Factualism and Non-Factualism about community practices.
  *   **Low Confidence:** Leaf F (Natural-History). This view (often associated with Cavell or later Wittgenstein) is subtle. It risks collapsing into Quietism (D) if "natural history" is taken as a brute given that stops explanation.

  **Least Sure Branch Point:**
  I am least sure about **Node 6**. Distinguishing between "Community Agreement" (Leaf E) and "Shared Natural Instincts" (Leaf F) is notoriously difficult. Kripke emphasizes agreement, but Wittgenstein often emphasizes "natural history" and "instinct." A student might reasonably answer that correctness depends on agreement *because* we share natural instincts, making the choice between E and F feel forced. However, keeping them separate is necessary to distinguish the *Skeptical Solution* from a *Stroudian/Cavellian* reading.
