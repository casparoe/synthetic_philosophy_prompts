answer: |-
  This is one of the hardest concepts in intro psych because it requires students to suppress their intuitive language ("inherited") in favor of statistical language ("variance"). If you try to teach the *math* before the *logic*, you will lose them.

  Here is a battle plan for a 50-minute lecture designed to inoculate against the "genetic determinism" virus.

  ### 1. The Core Philosophy: One Thing to Rule Them All
  Your single north star for this lecture is: **Heritability is a description of a population's variation, not an individual's blueprint.**

  Every minute of the lecture must reinforce this. If a slide doesn't serve that distinction, cut it.

  ### 2. The Sequence (Minute-by-Minute)

  **0:00–0:05: The Hook & The Trap**
  *   **Do:** Start with the misconception. Write on the board: *"IQ is 80% heritable."* Ask: *"Does this mean 80% of your intelligence is fixed at birth?"*
  *   **Action:** Take a show of hands. Expect 50–70% to say yes. Tell them: *"By the end of today, you will know why that answer is wrong, and why believing it leads to bad science and bad policy."*
  *   **Why:** You need to create cognitive dissonance immediately. If you define terms first, they will file the definition under their existing (wrong) schema.

  **0:05–0:15: Variance First (The Prerequisite)**
  *   **Concept:** You cannot explain heritability without explaining variance.
  *   **Visual:** Show a histogram of human height. Mark the mean. Show the spread.
  *   **Script:** *"Heritability is not about the height. It is about the **differences** in height. If everyone was exactly the same height, heritability would be zero, even if genes build legs. Heritability asks: 'Why are we **different**?'"*
  *   **Check:** Ask: *"If I clone myself 100 times and raise them all in identical rooms, what is the variance in height?"* (Answer: Zero. Therefore, heritability is undefined/zero).

  **0:15–0:30: The Carrier Example (Corn/Plants)**
  *   **Verdict:** Your instinct is correct. **Use the corn/plant example.** It is superior to humans because you can control the genetics (clones) and the environment (soil) perfectly. Human examples introduce too much noise (gene-environment correlation) too early.
  *   **The Setup:**
      1.  **Population A:** Genetically diverse seeds, planted in **identical** rich soil.
          *   *Result:* All variation is due to genes. Heritability ≈ 100%.
      2.  **Population B:** Genetically **identical** clones, planted in **variable** soil (poor vs. rich).
          *   *Result:* All variation is due to environment. Heritability = 0%.
      3.  **Population C:** Genetically diverse seeds, planted in **variable** soil.
          *   *Result:* Variation is mixed. Heritability is somewhere in between.
  *   **The Killer Point:** Take **Population A** (High Heritability). Now, give them all fertilizer (Environmental Intervention). They all grow taller.
  *   **Lesson:** High heritability **did not prevent** environmental change from working. This kills the "fixed at conception" myth.

  **0:30–0:40: Bridging to Humans & The Misconception Map**
  *   **Transition:** *"Humans aren't corn. We don't have clones. But the math is the same."*
  *   **Pre-emptive Strike 1 (Individual vs. Group):** Use the "Height" analogy. *"Height is highly heritable. But if you starve a population for a generation, average height plummets. Genes didn't change. Environment did. Heritability explains the differences **within** the group, not the average **of** the group."*
  *   **Pre-emptive Strike 2 (Changeability):** Revisit the fertilizer point. *"High heritability means current differences are mostly genetic. It does **not** mean future differences can't be environmental."*
  *   **Reactive/Explicit Strike 3 (Between-Group):** Save this for last. *"Just because Group A differs from Group B, and the trait is heritable **within** groups, does not mean the difference **between** groups is genetic."* (Use the Plant/Soil analogy again: Pot 1 (Rich Soil) vs. Pot 2 (Poor Soil). The difference between pots is 100% environmental, even if heritability inside each pot is 100%).

  **0:40–0:45: Methodology (Briefly)**
  *   **Scope:** Do **not** teach Broad vs. Narrow sense ($H^2$ vs $h^2$). It is statistical hair-splitting that confuses the core concept.
  *   **What to say:** *"We estimate this using twins and adoptees. We compare similarity of identical vs. fraternal twins. That's the 'how'. The 'what' is the population variance statistic we just discussed."*
  *   **Why:** Intro students need to interpret headlines, not run biometric models.

  **0:45–0:50: Comprehension Check & Wrap**
  *   (See specific question below).

  ### 3. The Carrier Example: Requirements & Refinements
  Your plant instinct is the right one, but it needs specific features to work:
  *   **Must Have:** Clones (to zero out genetic variance).
  *   **Must Have:** Manipulable Environment (to show intervention works).
  *   **Must Not Have:** Gene-Environment Correlation (e.g., don't use "smart parents read to kids," because students will conflate the reading with the genes).
  *   **Refinement:** Draw two pots on the board.
      *   **Pot 1:** Mixed seeds, identical soil. (Differences = Genes).
      *   **Pot 2:** Mixed seeds, mixed soil. (Differences = Genes + Soil).
      *   **Ask:** *"In which pot is heritability higher?"* (Pot 1).
      *   **Ask:** *"If I add fertilizer to Pot 1, do the plants grow?"* (Yes).
      *   **Point:** Heritability was high, but the trait was still malleable.

  ### 4. Misconception Map: Pre-empt vs. React
  Don't treat all misconceptions equally. Some are structural; some are political.

  | Misconception | Strategy | Timing |
  | :--- | :--- | :--- |
  | **"Heritable = Fixed/Unchangeable"** | **Pre-empt.** This is the "funding schools" error. Kill it with the Fertilizer/Plant example. | Minute 25 (During Carrier Example) |
  | **"Heritability applies to an Individual"** | **Pre-empt.** This is the definitional error. Must be established before giving numbers. | Minute 10 (During Variance section) |
  | **"High h² means Environment doesn't matter"** | **Pre-empt.** Tie this to the "Fixed" misconception. | Minute 25 |
  | **"Within-Group h² explains Between-Group Differences"** | **Explicitly Teach.** Do not wait for questions. This is the Lewontin fallacy. It needs a dedicated 5-minute segment. | Minute 35 (After Human Bridge) |
  | **"Heritability is a constant property of a trait"** | **Pre-empt.** Emphasize it changes if the environment changes (e.g., if everyone gets equal schooling, heritability of IQ goes *up*). | Minute 30 |

  **Why this order?** If you talk about Between-Group differences too early, the lecture becomes a political debate about race/IQ. If you establish the *statistical logic* first (Plants -> Variance -> Within Group), the Between-Group fallacy becomes a logical error they can spot themselves, rather than an opinion they have to adopt.

  ### 5. What to Refuse to Cover (The Exclusion List)
  To stay within 50 minutes and maintain clarity, you must explicitly exclude:
  1.  **Broad vs. Narrow Sense Heritability:** Just call it "Heritability." The distinction matters for breeders, not for intro psych students interpreting news.
  2.  **GCTA / GWAS / Molecular Genetics:** Do not mention "missing heritability" or specific genes. It suggests we can find "the intelligence gene," which reinforces the individual determinism error.
  3.  **Gene-Environment Correlation (rGE):** (e.g., smart kids seek libraries). This is real, but it confuses the $V_G$ vs $V_E$ partition. Mention it only as a "complication we ignore for today."
  4.  **Specific Heritability Numbers:** Don't make them memorize that IQ is .5 or Schizophrenia is .8. Give ranges (Low, Medium, High) to emphasize context dependence.

  ### 6. The Comprehension Check (The "Exit Ticket")
  Do not ask: *"Define heritability."*
  Do not ask: *"Is IQ heritable?"*

  **Use this Scenario:**
  > "Imagine two classrooms.
  > **Classroom A:** Every student has a unique teacher and different textbooks. (High Environmental Variance).
  > **Classroom B:** Every student has the exact same teacher and the exact same textbook. (Low Environmental Variance).
  >
  > In which classroom will the **heritability** of test scores be higher?
  >
  > A) Classroom A
  > B) Classroom B
  > C) It is the same in both.
  > D) We cannot know without measuring the genes."

  **Correct Answer:** **B) Classroom B.**

  **Why this works:**
  *   **If they chose A:** They think heritability means "how much genes matter generally." (Wrong).
  *   **If they chose C:** They think heritability is a fixed property of the trait (Test Scores). (Wrong).
  *   **If they chose B:** They understand that Heritability = $V_G / (V_G + V_E)$. If you shrink $V_E$ (Classroom B), the proportion of variance explained by genes ($V_G$) goes **up**, even if the genes didn't change.
  *   **Follow-up discussion:** *"Does this mean genes matter more in Classroom B? No. It means environment matters less **in that specific context**."*

  This question forces them to apply the **Population/Variance** framing. If they are thinking about individuals ("Which student will score higher?"), they cannot answer this question. They must think about the *source of the differences*.

  ### Final TA Tip
  When a student asks, *"But how much of MY intelligence is genetic?"*
  Your standard reply should be: *"That is a meaningless question. It's like asking 'How much of the area of this rectangle is due to the length and how much is due to the width?' You need both. Heritability only tells us why you are different from the person sitting next to you, not what made you, you."*
