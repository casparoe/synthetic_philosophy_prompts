prompt: |-
  I'm a TA for intro psych and I've been assigned the heritability lecture next week -- 50 minutes, mostly first-years, and this is the one topic they reliably walk away from understanding backwards. I don't need you to explain heritability to me, I need you to help me plan how to explain it, because last year's cohort left convinced that "IQ is 80% heritable" means 80% of any given person's intelligence was fixed at conception and there's no point funding schools.

  So what I want is a plan: what has to go first in the sequence (like, does the population-vs-individual distinction even land if they haven't internalized variance yet? or should I do variance first with some concrete trait like height?), the single example that should carry the whole thing. My instinct is to use something like a plant grown in poor vs rich soil where the genotype is fixed but the heritability estimate flips depending on which environment the population sits in -- but tell me if there's a better carrier example and what it needs to have / not have. Also worth deciding: do I even get to broad-sense vs narrow-sense heritability (twin studies vs everything else) in 50 min with these students or is that a "say it exists and move on" situation?

  The misconception map is the part I'm least sure about. I can predict the obvious ones -- "heritable = unchangeable," "high heritability means trait X is genetically determined in the individual," and the classic jump from within-group heritability to between-group conclusions. But I feel like students also form subtler wrong ideas, like thinking that if a trait is highly heritable then intervention is pointless, or that heritability estimates are properties of the trait itself rather than of a particular population in particular circumstances. Which ones should I actually pre-empt in the lecture itself versus just deal with if they come up in questions? And where in the sequence should each one be killed off -- like if I say "heritability is about variance explained in a population" too early does it just bounce off them?

  One more thing: I want to end with a comprehension check, ideally a scenario-based question not a definitional one, that would catch a student who's memorized the definition but still thinks heritability tells you about individuals. Something where getting it right requires actually applying the population/variance framing. Any suggestions, and also tell me what I should openly refuse to cover at this level so I'm not trying to cram in stuff like GCTA or gene-environment correlation subtleties that'll just muddy everything.
reasoning: |-
  Here's a thinking process that leads to the suggested lecture plan:

  1.  **Analyze the Request:**
      *   **Role:** TA for Intro Psych.
      *   **Task:** Plan a 50-minute lecture on Heritability.
      *   **Audience:** First-year students (notoriously misunderstand this concept).
      *   **Goal:** Prevent specific misconceptions (e.g., "80% heritable = 80% fixed in individual," "intervention is pointless," "between-group differences").
      *   **Specific Needs:**
          *   Sequencing (Variance first? Population vs. Individual?).
          *   Single Carrier Example (Plant/Soil instinct vs. alternatives).
          *   Scope (Broad vs. Narrow sense?).
          *   Misconception Map (Which to pre-empt vs. react to, and when).
          *   Comprehension Check (Scenario-based, not definitional).
          *   Exclusions (What *not* to cover).

  2.  **Deconstruct the Core Problem:**
      *   Why do students get this wrong? Because "heritability" sounds like "inherited." In everyday language, if I inherit money, *I* have it. In genetics, heritability is a statistic about *variation* in a *group*.
      *   The "Variance" concept is the biggest hurdle. If they don't get variance, they can't get heritability ($h^2 = V_G / V_P$).
      *   The "Individual vs. Population" distinction is the second biggest hurdle.
      *   Time limit: 50 minutes is tight. Deep dives into twin study methodology or GCTA will kill the main point.

  3.  **Develop the Sequence (The "Arc"):**
      *   *Minute 0-5:* Hook & The "Wrong" Intuition. Acknowledge why they think it means "fixed."
      *   *Minute 5-15:* The Foundation (Variance). Must happen before heritability. Use a concrete visual.
      *   *Minute 15-30:* The Carrier Example (Plants/Soil). This is the gold standard for a reason. It separates G and E cleanly.
      *   *Minute 30-40:* The Misconception Killers (Individual vs. Group, Changeability, Between-Group).
      *   *Minute 40-45:* Human Context (IQ/Personality) - Apply the plant logic to humans carefully.
      *   *Minute 45-50:* Comprehension Check & Wrap.

  4.  **Evaluate the Carrier Example (Plants vs. Others):**
      *   *User's Instinct:* Plants in poor vs. rich soil.
      *   *Verdict:* Keep it. It's the best because:
          1.  Clones = Identical Genotype (removes G variance).
          2.  Soil = Environment (manipulable E).
          3.  Height = Quantitative trait (easy to measure).
          4.  It visually demonstrates $h^2$ changing based on environment variance.
      *   *Refinement:* Need to make sure the *variance* aspect is highlighted, not just the mean height.

  5.  **Scope Decision (Broad vs. Narrow):**
      *   *Decision:* Drop it.
      *   *Reasoning:* Intro psych students need the *concept* of heritability, not the *methodology* of estimating it. Distinguishing $H^2$ (broad) vs $h^2$ (narrow) adds mathematical noise without fixing the core conceptual error. Mention twin studies only as "one way we estimate this," not the definition.

  6.  **Misconception Map Strategy:**
      *   *Pre-empt:* "Heritable = Fixed/Unchangeable" (Do this early with the plant example). "Individual vs. Population" (Do this during the definition).
      *   *React/Reinforce:* "Between-Group Differences" (This is politically charged and complex; better to address it explicitly after the concept is solid, usually near the end).
      *   *Timing:* Don't define heritability as "variance explained" in minute 1. Build the need for variance first.

  7.  **Drafting the Comprehension Check:**
      *   Needs to force a choice between individual determinism and population variance.
      *   *Idea:* Two populations, same heritability, different means. Or one population, changing environment.
      *   *Best Scenario:* The "Flynn Effect" style or the "Plant Soil" transfer. Let's go with a modified Plant/Soil scenario or a Shoe Size analogy (classic but effective). Actually, a "New Environment" scenario works best to test the "fixed" misconception.
      *   *Refined Idea:* A trait with high heritability in Population A. What happens in Population B with different environmental variance? Or, does high heritability predict the success of an intervention?
      *   *Selection:* The "Intervention" scenario. It directly addresses the "funding schools" concern mentioned by the user.

  8.  **What to Exclude:**
      *   GCTA/GWAS details.
      *   Gene-Environment Correlation (rGE) and Interaction (GxE) *math*. (Mention GxE conceptually via the plants, but don't define the statistical interaction term).
      *   Broad vs. Narrow sense formulas.
      *   Specific heritability numbers for specific traits (except as examples of range).

  9.  **Review and Refine (Self-Correction during drafting):**
      *   *Critique:* Is 5 minutes enough for variance?
      *   *Fix:* Make variance visual. Use a histogram of heights.
      *   *Critique:* Will the plant example feel too distant from psychology?
      *   *Fix:* Bridge it explicitly. "Humans aren't clones, but the math works the same."
      *   *Critique:* When to hit the "Between-Group" fallacy?
      *   *Fix:* Save it for the end. It requires understanding within-group variance first. If you do it too early, it becomes a political debate rather than a stats lesson.

  10. **Final Polish:** Ensure tone is supportive of the TA (pedagogical advice, not just content). Structure clearly with time stamps. (Proceed to generate output based on these thoughts).

  *(Self-Correction on the Comprehension Check)*: The user wants something that catches students who memorized the definition but still think about individuals.
  *Bad Question:* "What is heritability?"
  *Good Question:* "If height has 80% heritability, and you eat better, will you grow taller?" (Too simple).
  *Better Question:* "Population A has high heritability for reading speed. Population B introduces a new teaching method. What happens to heritability?"
  *Best Question:* A scenario comparing two individuals vs. the group. Let's design a specific "Two Students" scenario.

  *(Final Plan Structure)*:
  1.  Core Philosophy (The "One Thing").
  2.  The Sequence (Minute-by-Minute).
  3.  The Carrier Example (Refining the Plant).
  4.  Misconception Map (Pre-empt vs. React).
  5.  The Exclusion List.
  6.  The Comprehension Check.

