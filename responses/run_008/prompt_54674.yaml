answer: |-
  Q1: Case 1 (Forgery). Perfect copy, painted yesterday. Art?
    Yes → Q2: Case 2 (Chimp/AI). No human intent, beautiful. Art?
      Yes → **Formalism/Aesthetic Functionalism**
        Awkward commitment: Must accept perfect forgeries as aesthetically equal to originals.
      No → **Cluster Account**
        Awkward commitment: Cannot resolve borderline cases where weighted criteria conflict.
    No → Q3: Case 8 (Provenance Flip). Trash mislabeled as art for 20 years. Art?
      Yes → **Procedural/Institutional**
        Awkward commitment: Makes art status fragile on expert error or accidental conferral.
      No → Q4: Case 4 (Urinal). Signed toilet, no craft. Art?
        Yes → **Historical/Intentional**
          Awkward commitment: Excludes accidental masterpieces or purely functional liturgical art.
        No → **Anti-essentialist (Open Concept)**
          Awkward commitment: Offers no predictive power for policy or copyright disputes.

  **Scoring Key**
  If you hovered between branches, check secondary cases:
  *   **Formalism:** Says Yes to Case 7 (AI Beauty) and Case 3 (Hermit).
  *   **Cluster:** Says Yes to Case 6 (Altarpiece) but No to Case 2 (Chimp).
  *   **Institutional:** Says Yes to Case 5 (Certificate) if the artworld accepts it.
  *   **Historical:** Says No to Case 7 (AI) unless linked to human art history.
  *   **Anti-essentialist:** Rejects binary answers across multiple cases.

  **Indistinguishability Flag**
  Institutional and Historical positions often converge on AI/Chimp (both No) and Urinal (both Yes). This tree separates them *only* via Case 8 (Provenance Flip). If you find Case 8 unconvincing, these positions are functionally identical for your purposes: both rely on human agency over aesthetic quality.

  **Unused Cases**
  Cases 3 (Hermit), 5 (Certificate), 6 (Altarpiece), and 7 (AI Radar) are reserved for the Scoring Key to refine borderline results without bloating the main tree. Case 5 specifically tests the limits of the Institutional view (can paper be art?). Case 6 tests Historical intent (can function be art?).

  **Note on Unnamed Leaves**
  No answer combinations in this tree correspond to incoherent views; all paths map to defended philosophical positions. If you answered Yes to Forgery but No to Chimp, you occupy the Cluster branch (aesthetics matter, but history weighs in).

  **Instructions**
  Answer strictly based on intuition. Do not adjust answers to fit a label. The leaf you reach reveals the definition you are already using.
