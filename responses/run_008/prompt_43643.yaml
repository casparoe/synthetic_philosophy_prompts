answer: |-
  # The Promise Binder: A Decision Tree for Your Group

  **Instructions:** Start at **Node 1**. Read the case and choose the answer that matches your gut. Follow the arrow to the next Node or to a **Leaf** (final position). Do not worry about being consistent; just answer what feels right in the moment.

  ---

  ### Node 1: The Lunch Date
  You promise a friend to meet for lunch. You don't show up. They are slightly annoyed but had a fine day anyway.
  *   **A:** It's wrong, but only because you disappointed them. "Promise" doesn't add extra wrongness. → **Go to Leaf D**
  *   **B:** It's worse than just disappointing them. You broke a *promise*. → **Go to Node 2**

  ### Node 2: The Castaways
  Two people are stranded on an island with no prior society or language. One says, "I promise to share the fruit."
  *   **A:** The words are empty. You need a society behind you to make a promise. → **Go to Node 8**
  *   **B:** It still binds them. Two people can make a promise without a crowd watching. → **Go to Node 3**

  ### Node 3: The Dead Friend
  You promise a dying friend to visit their grave. They will never know if you do it. No one else knows.
  *   **A:** You aren't bound. If no one relies on you or gets hurt, there's no duty. → **Go to Node 6**
  *   **B:** You are still bound. You gave your word, regardless of the outcome. → **Go to Node 4**

  ### Node 4: The Insincere Promise
  You say "I promise" to calm someone down, but you never intend to do it. You just want them to feel safe.
  *   **A:** You lied, but you didn't make a promise (because you didn't mean it). → **Go to Node 5**
  *   **B:** You made a promise. The words themselves created the duty, even if you lied. → **Go to Leaf P**

  ### Node 5: The Gun to the Head
  Someone holds a gun to your head and says, "Promise to pay me or I shoot." You say "I promise."
  *   **A:** You are not bound. You didn't freely choose to bind yourself. → **Go to Leaf W**
  *   **B:** You might still be bound. You said the words, and they might rely on them. → **Go to Leaf P**

  ### Node 6: The Secret Promise
  You promise to help someone, but you say, "Don't expect anything, I might not do it." They form no expectation.
  *   **A:** You are not bound. A promise needs to create an expectation to matter. → **Go to Leaf E**
  *   **B:** You are bound. You still invoked the rule of promising. → **Go to Leaf P**

  ### Node 7: The Release
  You promise to pay me $100. Later, I say, "Don't worry about it, you're free."
  *   **A:** I can free you instantly. It's your duty to me, so I can cancel it. → **Go to Leaf W**
  *   **B:** I can only free you if you haven't relied on me yet. If you already planned around it, the duty sticks. → **Go to Leaf E**
  *(Note: Only reach this node if you answered Node 3-B and Node 4-A)*

  ### Node 8: The Wrong Words
  In a culture, "I promise" means nothing, but "I pledge my honor" binds you. You say "I promise" there.
  *   **A:** You aren't bound. You didn't use the correct social code. → **Go to Leaf P**
  *   **B:** You are bound. You intended to bind yourself, regardless of their local rules. → **Go to Leaf W**

  ### Node 9: The Child
  A 5-year-old says "I promise" to share a toy. They don't really understand what promises are.
  *   **A:** They aren't bound. You need to understand the practice to join it. → **Go to Leaf P**
  *   **B:** They are bound. They said the words and meant to do it. → **Go to Leaf W**
  *(Note: Use this node if you reached Node 2-B but want to test the "Social Rule" vs "Personal Will" distinction further)*

  ### Node 10: The Greater Good
  You promise to return a weapon. Later, you learn the owner plans to hurt someone.
  *   **A:** The promise is void. Harm outweighs the promise entirely. → **Go to Leaf D**
  *   **B:** The promise still binds, but morality overrides it. You still owe them an explanation. → **Go to Leaf W**
  *(Note: Use this node if you need to distinguish between "No Duty" and "Overridden Duty")*

  ---

  ### The Leaves (Your Positions)

  *   **Leaf D (The Deflationary View):** There is no special "promissory duty." You shouldn't lie or cause harm, but saying "I promise" doesn't create a unique moral magic. You are just avoiding disappointment or harm. *(Matches Utilitarianism or Error Theory)*
  *   **Leaf P (The Practice View):** Promises are like a game or a social institution. They only work because we all agree on the rules. If you break a promise, you are cheating on the social practice, not just hurting a person. *(Matches Hume, Rawls, Searle)*
  *   **Leaf E (The Expectation View):** Promises bind because you manipulate someone's expectations. If you create an expectation and let them down, you harm them. If no expectation is created, no promise is broken. *(Matches Scanlon, Thomson)*
  *   **Leaf W (The Will View):** Promises bind because you exercised your freedom to bind yourself. It is an act of autonomy. If you didn't freely choose it, or if you didn't intend it, no promise exists. *(Matches Kant, Hegel, Contractarians)*

  ---

  ### Instructor Notes: Collapses and Empty Boxes

  **1. The Practice/Expectation Collapse**
  You guessed right: **Leaf P (Practice)** and **Leaf E (Expectation)** will collapse for many participants.
  *   *Why:* In almost all normal cases, social practices *create* expectations. If you follow the Practice tree (Node 2-A), you usually end up requiring reliance anyway (Node 6).
  *   *The Split:* The tree separates them at **Node 8 (Wrong Words)** and **Node 6 (Secret Promise)**. The Practice view says "Wrong words = No Promise." The Expectation view says "If they expected it anyway = Promise." If your group members give answers that jump between P and E leaves, tell them they hold a hybrid view (which is very common).

  **2. Empty/Incoherent Combinations**
  There are combinations of answers that lead to no leaf because the view is unstable:
  *   **"No Special Duty" + "Binds Without Society":** If a user chooses Node 1-A (Deflationary) but then insists on Node 2-B (Binds without society), they are in a bind. If there is no *special* duty, why does it bind in a vacuum? This usually collapses back to Deflationary (it binds only if harm occurs) or Expectation (it binds because of reliance).
  *   **"Needs Intent" + "Words Bind Anyway":** If a user says Node 4-A (Intent needed) but Node 4-B (Words bind), this is logically inconsistent. You cannot require intent and simultaneously say intent doesn't matter. This combination is **incoherent**.
  *   **"Practice View" + "Release Doesn't Work":** If a user says Node 2-A (Needs Society/Practice) but Node 7-B (Promisee cannot release you), this is **unattractive/unexplored**. If the duty is created by a practice between two people, standard practice allows the promisee to release the promisor. Denying this makes the practice view look like a strange legalism.

  **3. The "Will" vs. "Practice" Tension**
  *   **Node 5 (Coercion)** is the sharpest splitter here. The Will view says coercion kills the promise. The Practice view often says coercion makes the promise void *within the rules*, but some hardline conventionalists might say the words were spoken, so the social record stands. If someone says "Coerced promises bind," they likely have a very rigid Practice view or no clear view at all.

  **4. Timing Tip**
  If the group moves fast, force everyone to answer **Node 1, Node 2, and Node 3**. These three do 80% of the sorting. Use the later nodes (7-10) only for tie-breaking if someone feels stuck between two leaves.
