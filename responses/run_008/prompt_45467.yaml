answer: |-
  You have described the problem of **essentialism** with perfect precision, and the specific structural solution you are looking for is most famously known as **Family Resemblance** (*Familienähnlichkeit*).

  However, given your background in biochemistry, the Wittgensteinian label might feel too linguistic or "soft." In the philosophy of science and biology, this concept has been rigorously formalized under the names **Cluster Concepts** and, most importantly for you, **Homeostatic Property Clusters (HPC)**.

  Here is the breakdown of the terminology, the distinction from vagueness, the ontological status of such kinds, and the verdict on whether the category or the definition is at fault.

  ### 1. The Name and Literature
  The primary term is **Family Resemblance**, introduced by **Ludwig Wittgenstein** in *Philosophical Investigations* (1953), specifically sections §65–71.

  Wittgenstein used the example of "games." Board games, ball games, and solitary card games share no single common feature (some have winners, some don't; some use cards, some don't; some are for fun, some for money). Instead, they share a "complicated network of similarities overlapping and criss-crossing: sometimes overall similarities, sometimes similarities of detail."

  **The Scientific/Biological Equivalent:**
  Since you are coming from science, you will likely find the literature on **Polythetic Classification** and **Homeostatic Property Clusters** more satisfying.
  *   **Polythetic Classification:** Used in taxonomy and systematics. A class is defined by a set of properties where each member possesses a large number of them, but no single property is possessed by *all* members.
  *   **Homeostatic Property Cluster (HPC):** Developed by **Richard Boyd** (e.g., *"Realism, Anti-Foundationalism and the Enthusiasm for Natural Kinds,"* 1991). This is the dominant account of "natural kinds" in contemporary philosophy of biology. It argues that species (and other kinds) are real not because they share an essence, but because a cluster of properties tends to co-occur due to underlying homeostatic mechanisms (e.g., gene flow, stabilizing selection).

  ### 2. Family Resemblance vs. Ordinary Vagueness
  You correctly intuited that this is not the Sorites paradox ("bald," "heap"). Here is the structural difference:

  *   **Ordinary Vagueness (Sorites):** Assumes a **one-dimensional continuum**. There is a clear core and a blurry boundary. The problem is locating the cut-off point. (e.g., We agree on what a "mountain" is, but disagree on whether a 900-foot hill counts).
  *   **Family Resemblance:** Assumes a **multi-dimensional space with no core**. The problem is not the boundary; the problem is the center. There is no "central case" that possesses all the defining features because there *are* no defining features.
      *   *Analogy:* Vagueness is a photograph with a blurred edge. Family Resemblance is a collage where no single image appears in every panel, yet the whole thing forms a coherent picture.

  In a family resemblance category, two members at opposite ends (e.g., *Solitaire* and *Professional Football*) might share *nothing* directly, yet are connected through intermediate cases. In a vague category, every member shares the core essence, they just vary in *degree*.

  ### 3. Is it Just Correlated Properties? (The HPC Account)
  You mentioned a biologist friend suggesting "a bunch of properties that happen to be correlated." This is close, but the **Homeostatic Property Cluster** theory adds a crucial metaphysical mechanism that saves the category from being arbitrary.

  If properties merely *happened* to correlate by accident, the category would be nominal (conventional). But in biology (and chemistry), properties cluster because there are **causal mechanisms** that maintain the cluster.
  *   **Example:** Why do members of a species share morphology, behavior, and genetic markers? Not because of a "species essence," but because of *gene flow* and *common selection pressures*. These mechanisms act as a homeostatic force that keeps the properties clustered together over time.

  This distinguishes HPCs from arbitrary cluster concepts (like "things that are red or round"). HPCs are **projectible** (we can make inductive inferences about them) because the clustering is maintained by natural laws/mechanisms, not just human convention. This explains why experts agree on classification despite the lack of strict definitions: they are tracking the underlying homeostatic mechanisms, not checking a list of necessary and sufficient conditions.

  ### 4. The Normative Question: Defective Category or Defective Demand?
  This is the philosophical crux. Is the category broken, or is our demand for a definition broken?

  **The Verdict: The demand for strict definitions (Essentialism) is the mistake.**

  Wittgenstein's goal in introducing family resemblance was therapeutic. He believed philosophers suffered from a "craving for generality"—a compulsion to find a single common thread where none exists. He argued that insisting on a strict definition often blinds us to how the concept is actually *used*.

  In science, the verdict is nuanced:
  1.  **For "Planet":** You noted astronomers voted a definition into existence. This is a **stipulative definition**. Here, the category *was* deemed defective for scientific utility, so they imposed a boundary (clearing the neighborhood) to resolve the vagueness. This was a pragmatic fix, not a discovery of essence.
  2.  **For "Species":** Most philosophers of biology (following David Hull, Michael Ghiselin, and Richard Boyd) now argue that species are **individuals** or **HPCs**, not natural kinds with essences. The "defect" lies in trying to treat species like chemical elements (Gold, Oxygen). Gold has an atomic number (essence); Species has a genealogical history (relation).

  If you try to force an essentialist definition onto a family-resemblance concept, you will inevitably do violence to the phenomena (e.g., excluding ring species, or excluding Pluto based on orbital dynamics rather than geology).

  ### 5. Recommended Reading
  Given your background, I suggest skipping the introductory Wittgenstein exegesis and going straight to the philosophy of science applications:

  1.  **Ludwig Wittgenstein, *Philosophical Investigations*, §§65–71.** (The source code. Read the "thread" analogy).
  2.  **Richard Boyd, "Realism, Anti-Foundationalism and the Enthusiasm for Natural Kinds" (1991).** (The HPC account. This addresses your "correlated properties" question directly).
  3.  **John Dupré, *The Disorder of Things* (1993).** (Specifically the chapters on species. Dupré argues forcefully against essentialism in biology and defends a polythetic view).
  4.  **Marc Ereshefsky, "Species and the Linnaean Hierarchy" in *The Stanford Encyclopedia of Philosophy*.** (Good overview of why the "species problem" is unsolvable under essentialism).

  ### Summary
  The word you are looking for is **Family Resemblance**, but the robust scientific formulation is **Homeostatic Property Cluster**.

  It differs from vagueness because it lacks a core essence, not just a boundary. It differs from accidental correlation because the cluster is maintained by causal mechanisms. And the lesson is not that the categories are defective, but that **Aristotelian essentialism** (the idea that all valid categories must have necessary and sufficient conditions) is an inadequate tool for describing the complexity of the natural world.
