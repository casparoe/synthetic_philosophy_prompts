answer: |-
  # Lesson Plan: The Libet Introspection Simulation
  **Course:** Free Will & Sciences of the Mind (Upper-Level Seminar)  
  **Time:** 80 Minutes  
  **Class Size:** 14 Students (7 Pairs)  
  **Goal:** Phenomenological replication of the Libet paradigm (introspection only) to expose the instability of "time of intention."

  ---

  ## I. Materials & Setup
  1.  **Projector/Screen:** Displaying a "Libet Clock" animation.
      *   *Specs:* A white dot revolving clockwise on a circle. 1 revolution = 2.5 seconds. The circle should be marked with 60 tick marks (like a second hand), but **no numbers**.
      *   *Prep:* Load a YouTube video titled "Libet Clock 2.5s" or run a simple CSS/HTML animation from your laptop.
  2.  **Whiteboard:** Divided into three sections (Spontaneous, Veto, Preplanned).
  3.  **Markers:** 3 colors (e.g., Blue for Actor reports, Red for Recorder reports, Green for Differences).
  4.  **Student Devices:** Phones set to "Stopwatch" mode (for Recorders only, as backup) or simply watching the clock.
  5.  **Handout (Optional):** A small slip of paper for each pair to record raw data before transferring to the board.

  ---

  ## II. Roles & Rules (5 Minutes)
  *Read this script or adhere closely to it to ensure uniformity.*

  **The Roles:**
  *   **The Actor:** Your job is to watch the clock. At some point, you will feel an urge to move. You must note the **clock position** (0–60) of the *very first awareness* of that urge. Then you move.
  *   **The Recorder:** Your job is to watch the Actor's hand and the Clock. The moment you see the movement begin, note the **clock position** (0–60). You are the objective timer.

  **The Movement:**
  *   A sharp tap of the index finger on the desk. It must be visible. No wind-up.

  **The Reporting:**
  *   We are measuring in **Clock Units (CU)**. 60 CU = 2.5 seconds. (1 CU ≈ 41 milliseconds).
  *   **Honesty is data.** If you didn't feel an urge, or if you felt it *after* you moved, report that. We want the noise.

  **The Three Rounds:**
  1.  **Spontaneous:** Actor decides *when* to move. No counting. No planning. Let the urge happen.
  2.  **Veto ("Free Won't"):** Actor waits for an urge to move. When the urge arises, **do not move.** Instead, report when the urge *would* have triggered movement. (Recorder logs the time the finger *twitched* or when the veto was declared).
  3.  **Preplanned:** Actor chooses a specific clock number (e.g., "15") in advance. Move exactly when the dot hits that number.

  ---

  ## III. Minute-by-Minute Timeline

  ### 0:00 – 0:05 | Introduction & Setup
  *   Project the clock. Verify everyone can see the tick marks.
  *   Assign pairs (7 pairs total). Assign Actor/Recorder roles.
  *   **Crucial Instruction:** "Actor, do not look at the Recorder. Recorder, do not cue the Actor."

  ### 0:05 – 0:20 | Round 1: Spontaneous (15 mins)
  *   **Task:** 3 Trials per pair.
  *   **Action:** Actor watches clock. Feels urge. Notes position ($W$). Taps. Recorder notes tap position ($M$).
  *   **Data:** Recorder writes the pair number, $W$, and $M$ on the whiteboard under "Spontaneous."
  *   **Instructor:** Circulate. Ensure Actors aren't planning ("I'll move on the next pass"). Remind them: "Wait for the impulse."

  ### 0:20 – 0:35 | Round 2: Veto / Free Won't (15 mins)
  *   **Task:** 3 Trials per pair.
  *   **Action:** Actor waits for the urge. When the urge hits, they must **inhibit** the movement.
  *   **Reporting:** Actor reports the clock position where the urge was strong enough to move ($W_{veto}$). Recorder notes the time of inhibition (usually a visible tension or a verbal "Now" from the Actor).
  *   **Instructor:** Emphasize: "If you accidentally move, mark it as 'Failed Veto' and keep going."

  ### 0:35 – 0:45 | Round 3: Preplanned (10 mins)
  *   **Task:** 3 Trials per pair.
  *   **Action:** Actor picks a target (e.g., "30"). Moves when dot hits target.
  *   **Reporting:** Actor reports when they felt the *execution command* ($W_{plan}$). Recorder notes actual movement ($M$).
  *   **Data:** Write on board under "Preplanned."

  ### 0:45 – 0:50 | Data Aggregation (5 mins)
  *   **Calculation:** Ask pairs to quickly calculate $\Delta = W - M$ for their Spontaneous trials.
  *   **Visual:** On the whiteboard, draw a horizontal axis from -30 to +30 (0 = Movement Time).
  *   **Plot:** Have students come up and place a hash mark for their $\Delta$.
      *   Negative = Urge before movement.
      *   Positive = Urge after movement (post-hoc).
      *   Zero = Simultaneous.

  ### 0:50 – 1:20 | Debrief & Philosophical Analysis (30 mins)
  *   (See detailed script below).

  ---

  ## IV. Data Compilation Strategy
  Do not let them calculate milliseconds. It wastes time and creates false precision. Use **Clock Units (CU)**.

  **The Board Layout:**
  Draw a large number line on the left side of the board.
  *   **Center (0):** Movement Time ($M$).
  *   **Left (-):** Urge before movement ($W < M$).
  *   **Right (+):** Urge after movement ($W > M$).

  **The Visual:**
  By minute 50, you should have ~21 data points (7 pairs x 3 trials) clustered mostly between -5 and -10 CU (approx -200ms), but with significant spread.
  *   *Look for:* Outliers on the positive side (actors who report deciding after they moved).
  *   *Look for:* Variance. If everyone reports exactly -5, they are faking. If reports range from -20 to +5, you have authentic noise.

  ---

  ## V. The Debrief Script (30 Minutes)

  ### 1. The Phenomenological Gap (5 mins)
  "Look at the board. You are the Actors. You were asked to locate a specific moment: 'When did you decide?' Look at the spread.
  *   Did everyone find the same distance between urge and action?
  *   Did anyone find that their 'urge' happened *after* their finger tapped? (Point to positive outliers).
  *   **Point:** If the moment of 'free will' is a causal event, it should be locatable. If it were a switch flip, the data should cluster tightly. Instead, you found a fog. Your reports are reconstructions."

  ### 2. The Missing Curve (10 mins)
  "Now, I have to give you the piece of this puzzle you couldn't generate."
  *   **Project/Draw:** The Libet Readiness Potential (RP) curve.
      *   **M (Movement):** 0 ms.
      *   **W (Awareness):** ~ -200 ms (matches your negative CU data).
      *   **RP Onset:** ~ -550 ms.
  *   **The Inference:** "In the real experiment, the brain begins preparing the move 350ms *before* the Actor reports any awareness of deciding.
  *   **The Hard Question:** If the neural cause starts at -550, and consciousness only lights up at -200, what work is consciousness doing? It looks like a passenger reading a map after the car has already started."

  ### 3. The "Free Won't" & Veto (5 mins)
  "Look at your Veto data. Libet argued that while the *initiation* is unconscious, the *veto* is conscious.
  *   In your rounds, did stopping feel different than starting?
  *   Libet suggests the RP builds up, but in the last 150ms, a conscious 'veto' can abort it.
  *   **Skepticism:** But if the *urge* to move is already unconscious, is the veto just another unconscious process that you become aware of later? Did you really stop it, or did the brain stop itself and tell you 'I decided to stop'?"

  ### 4. Alternative Readings: Noise vs. Decision (5 mins)
  "This is where the science has moved since 1983. You noticed your own reports were noisy. Some of you couldn't find the moment.
  *   **The Alternative Hypothesis:** The Readiness Potential might not be a 'decision.' It might be background neural fluctuation (noise).
  *   **The Model:** The brain is always buzzing. Sometimes the buzz randomly crosses a threshold that triggers movement.
  *   **Implication:** If the RP is just noise, then there is no 'unconscious decision' stealing your free will. There is just a stochastic system. The 'decision' isn't at -550ms. The 'decision' might be the threshold crossing itself, which coincides much closer to awareness.
  *   **Question:** Does viewing the RP as noise rescue free will, or does it make action random?"

  ### 5. The "Natural Kind" Problem (5 mins)
  "Finally, look at your difficulty in dating the intention.
  *   Philosophers like Daniel Dennett argue that 'the moment of decision' is not a **natural kind**. It's not like 'the moment the ball hit the bat.' It's a narrative construct.
  *   If you cannot introspectively locate the boundary, are we asking a category error?
  *   **Closing:** Libet assumes consciousness is a *thing* that happens at a *time*. Your experience today suggests consciousness might be a *process* that smears over time. If the 'time of decision' is an illusion, the whole experiment collapses."

  ---

  ## VI. Troubleshooting: What Will Go Wrong
  *Be prepared for these specific failures.*

  **1. The "Clock Drift" Problem**
  *   **Failure:** The projected video doesn't match the 2.5s standard (e.g., YouTube buffering causes lag).
  *   **Fix:** Have a stopwatch running on your own laptop visible on screen. If the video lags, pause and reset. Tell students: "If the clock jumps, discard that trial."
  *   **Pedagogical Save:** "Notice how hard it is to synchronize external time with internal time? That's the experiment."

  **2. The "Recorder Bias" Problem**
  *   **Failure:** Recorders watch the Actor's shoulder tense up and predict the move, logging $M$ too early.
  *   **Fix:** Instruct Recorders to look *only* at the finger tip, not the arm.
  *   **Pedagogical Save:** If this happens, point it out in debrief. "Your observation changed the data. This is the Observer Effect in action."

  **3. The "Faking It" Problem**
  *   **Failure:** Students read the reading beforehand and know Libet found -200ms. They aim for -5 CU to look "smart."
  *   **Fix:** Explicitly say: "I want the outliers. If you report +5, that is more interesting to me than -5."
  *   **Pedagogical Save:** If the data clusters too perfectly, challenge it. "This looks too clean. Who is smoothing their experience? Real introspection is messy."

  **4. The "Veto Confusion" Problem**
  *   **Failure:** In the Veto round, Actors move anyway, or Recorders don't know what to log.
  *   **Fix:** Instruct: "If you move, log it as 'Fail'. If you stop, log the time you *felt* the stop command."
  *   **Pedagogical Save:** Use the fails. "Why was vetoing hard? Does that difficulty imply the motor system was already engaged?"

  **5. The "No Urge" Problem**
  *   **Failure:** Actors say, "I just did it, there was no urge."
  *   **Fix:** Tell them: "Report '0' for urge time. That is a valid data point."
  *   **Pedagogical Save:** This is the gold. "If there is no urge, where is the will? This supports the 'noise' theory."

  ---

  ## VII. Instructor Notes for the "Hand-Off"
  *When you transition from the activity to the EEG curve (Section V.2), pause.*

  **Say this:**
  "Up until now, we have been doing phenomenology. We have been mapping the mind from the inside. Everything we found is subjective.
  Now I am handing you the objective claim. The EEG machine does not care about your feelings. It shows a ramp.
  **The Critical Junction:** The free-will inference lives or dies on whether you trust the EEG curve more than your own introspection.
  *   If you trust the EEG: You are a biological machine aware of itself too late.
  *   If you trust your Introspection: The EEG is measuring something else (noise, preparation, not decision).
  *   If you trust Neither: The question 'When did you decide?' is broken.

  Next week, we read Haggard. He tries to fix the clock. But for today, sit with the uncertainty of your own data."
