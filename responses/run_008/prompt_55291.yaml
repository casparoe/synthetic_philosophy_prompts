prompt: |-
  i'm a phd student in phil mind working on personal identity, and lately i've been going back and forth between parfit-style reductionism and buddhist no-self stuff, so before this goes in my prospectus i want to check whether the package actually hangs together. here's roughly where i've landed:

  (1) i'm a no-self reductionist — there's no self over and above a causally connected stream of psycho-physical events, no further fact about identity over time. (2) like parfit, i think identity itself isn't what matters for prududential concern; psychological connectedness is what matters. (3) that said, i hold onto strong reasons of self-interest — you have special reason to save for your own retirement, to treat your own future suffering as more urgent than a stranger's — and i take these to survive the reduction since they're grounded in the stream rather than in a soul. (4) i also think part of the point of realizing no-self, in the buddhist meditative sense, is that it genuinely weakens egoistic clinging — seeing through the illusion of self actually changes what you care about. (5) finally i'm fine with a two-level picture where conventional persons are perfectly real for ethics, law, and everyday life, and only dissolve under ultimate analysis.

  i honestly can't tell which of these are pulling against each other and which just look like they do. go through the set, rank the tensions by severity instead of flagging everything equally, and tell me which single revision would clean up the most. also: what would actually change your verdict here — which premise, if i turned out to be wrong about it, would reorganize the whole picture — and where do you think your own reading of my view is most likely to go wrong?
