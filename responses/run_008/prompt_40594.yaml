answer: |-
  Your intuitions are remarkably consistent with a specific family of non-classical normative theories. You are rejecting **Classical Utilitarianism** (which would give the Monster everything and treat intra/inter-personal trades identically) in favor of a view that respects the **separateness of persons** while acknowledging that **capacity matters, but not linearly.**

  There is a single principle that captures most, if not all, of your verdicts. I will call it **Saturated Prioritarianism with an Authenticity Constraint.**

  ### The Principle

  **"Moral weight accrues to well-being according to a concave function (prioritarianism), bounded by a lexical threshold of equal moral status (sufficiency), and discounted when capacity is strategically inflated (authenticity)."**

  Here is how this principle rescues your specific intuitions:

  1.  **The Utility Monster (Scale):** The "concave function" means diminishing marginal moral weight. The first 100 units of well-being count morally for much more than the 1,000,000th unit. The Monster's vast conversion rate hits the "saturation point" quickly. After a certain threshold, their additional utility has near-zero moral weight compared to the basic needs of others.
  2.  **The 30% Efficient Person:** Because the function is concave, not flat, efficiency *does* matter. A being who can generate more well-being from the same resources generates more *moral value*, provided they haven't hit the saturation cap. Thus, they deserve a somewhat larger share, but not a dominant one.
  3.  **The Low Hedonic Baseline:** The "lexical threshold of equal moral status" acts as a floor. Regardless of their efficiency, their status as a person guarantees them a baseline share of resources. Prioritarianism further dictates that benefits to those with lower capacity weigh *more* morally than benefits to those with high capacity, justifying priority.
  4.  **Vast Hedonic Range:** This is the saturation point in action. A wider range allows for higher peaks, which count for more, but the moral weight of those peaks diminishes rapidly. One person's ecstasy cannot lexically override a city's ordinary satisfaction because the city's aggregate *baseline* claims outweigh the individual's *saturated* peak.
  5.  **Intra vs. Inter-personal:** This is the **Separateness of Persons** constraint (implicit in the "equal moral status" clause). Within one life, you are a single locus of valuation; you can trade time for intensity. Between lives, you are distinct sovereigns; you cannot sacrifice one sovereign's baseline to maximize another's peaks.
  6.  **Engineered vs. Natural:** This is the **Authenticity Constraint.** Moral weight attaches to the *subject*, not the *optimization of their utility meter*. If a capacity is engineered specifically to claim resources (gaming the system), it is discounted. If it is a natural endowment (the keen child), it is honored.

  **Must some intuitions go?**
  You likely have to abandon the idea that **efficiency is always morally neutral.** Your intuition about the 30% person admits that efficiency *does* grant some claim. The principle saves this, but only by sacrificing the idea that efficiency grants a *proportional* claim.

  ### The Test Case: The High-Speed Upload

  **The Scenario:** An uploaded person runs at 1,000x human clock speed. For every second of real time, they experience 1,000 seconds of subjective life. They claim they deserve 1,000x the resources (or political weight) because their total integrated well-being is vastly higher.

  **The Verdict under Saturated Prioritarianism:**
  The upload receives **one person's share**, perhaps with a very slight premium, but definitely not 1,000x.

  **The Reasoning:**
  1.  **Status Floor:** The upload counts as *one person*. The "equal moral status" clause guarantees them the same baseline resource share as a biological human. They cannot be ignored.
  2.  **Saturation (The Clock Speed):** Clock speed increases the *quantity* of experience, but not necessarily the *depth* or *quality* per unit. Under the concave function, the moral weight of the 1,000th hour of experience in a day is negligible compared to the 1st hour. Running fast creates "cheap utils." The moral value of their experience saturates almost immediately relative to biological humans.
  3.  **Authenticity:** If the upload accelerated their clock specifically to increase their resource claim or voting power, the Authenticity Constraint triggers. This is viewed as strategic manipulation of the moral metric (similar to the engineered Monster). Their claim is discounted heavily.
  4.  **Separateness:** Even if they feel 1,000 times more, they are still one locus of agency. Allowing one agent to outweigh the multitude based on internal processing speed violates the constraint that no single agent's optimized capacity can override the basic claims of others.

  **Implication:**
  The upload is entitled to the resources needed to sustain their existence and a level of well-being comparable to a biological human's baseline. They are not entitled to consume the energy of a city to fuel their speed. If they choose to run fast for their own internal reasons (intra-personal trade), that is their prerogative, but it does not increase their external moral claim on shared resources (inter-personal trade).

  ### Summary
  Your intuitions are not a bug; they are a feature of a **pluralistic moral landscape.** You are effectively arguing for a system where **Rights (Status)** constrain **Goods (Utility)**. The principle that saves your verdicts is that **persons are ends, not vessels for utility.** We care about how much utility they hold, but only up to the point where respecting their personhood is compromised by another's capacity to hold more.
