answer: |-
  # Quiz: What Kind of Voter Are You Actually?

  **Intro:**
  We all argue about voting strategy, but we rarely agree on the rules of the game. Is a vote a tool to change the world, a statement of who you are, or a civic tax you pay to keep the lights on? This quiz doesn't ask what you believe; it asks what you would *do* in specific situations. Answer based on your gut reaction to the scenarios, not the label you think you should hold.

  ---

  ### The Questions

  **1. The Swing-State Squeeze**
  You live in Pennsylvania. Candidate A is flawed but competent. Candidate B is dangerous and incompetent. Candidate C matches your values perfectly but is polling at 4%. Polls show A and B are tied.
  *   **A.** Vote for A. Stopping B is the only thing that matters.
  *   **B.** Vote for C. My vote won't change the result, so I'll support who I like.
  *   **C.** Stay home or spoil the ballot. I won't lend legitimacy to A or B.

  **2. The Safe-State Mirror**
  Same candidates as above, but you live in a state that is historically a blowout for Candidate B. Your vote has no mathematical chance of influencing the winner.
  *   **A.** Vote for A anyway. Harm reduction is a principle, not just a math problem.
  *   **B.** Vote for C. Since the outcome is fixed, I'm free to express my preference.
  *   **C.** Stay home. Why participate in a foregone conclusion?

  **3. The Tiny Gap**
  Candidate A and Candidate B are both mediocre. The only measurable difference is a 1% variance on a minor tax policy. Both will govern roughly the same way.
  *   **A.** Vote for the slightly better one (A). Better is better.
  *   **B.** Vote Third/None. The difference isn't worth the moral cost of choosing.
  *   **C.** Flip a coin or skip it. It makes no difference.

  **4. The Massive Gap**
  Candidate A supports democratic norms. Candidate B has explicitly promised to dismantle them. Both are personally unappealing to you.
  *   **A.** Vote A. Protecting the system is mandatory.
  *   **B.** Vote Third/None. Principles don't bend even for emergencies.
  *   **C.** Stay home. I don't want to be part of this choice.

  **5. The Vote Pair**
  A friend in a swing state proposes a deal: You vote for their preferred "viable" candidate in your safe state, and they vote for your preferred third-party candidate in their swing state.
  *   **A.** Take the deal. It maximizes the good without sacrificing my conscience.
  *   **B.** Decline. My vote is personal; I can't outsource the decision.
  *   **C.** Ignore it. These arrangements are unreliable/pointless.

  **6. The Fog of War**
  You think Candidate A is probably better than B, but you're only 51% sure. The media is conflicting, and both campaigns are lying.
  *   **A.** Vote A. Expected value says I should try to prevent the worse outcome.
  *   **B.** Vote Third/None. I won't risk enabling a bad actor based on a guess.
  *   **C.** Stay home. I'm not informed enough to participate.

  **7. The Write-In**
  You enter the booth and officially write in "None of the Above" or a fictional character, ensuring your ballot is counted but casts no vote for a candidate.
  *   **A.** A waste of a chance to influence the outcome.
  *   **B.** A valid way to participate without compromising.
  *   **C.** A pointless ritual. If I can't vote for who I want, I won't play.

  **8. The Fine**
  Imagine a law required voting, with a small $50 fine for staying home (no penalty for spoiling the ballot).
  *   **A.** Unjust. There is no duty to vote.
  *   **B.** Just. Citizenship requires participation.
  *   **C.** Acceptable only if I can spoil the ballot freely.

  **9. The Job Description**
  When you step into the voting booth, what are you mostly doing?
  *   **A.** Hiring a contractor to do a specific job (fix the road, lower taxes).
  *   **B.** Wearing a jersey to show which team I'm on.
  *   **C.** Giving testimony under oath about what is right.

  ---

  ### Scoring Key & Analysis

  **How to Tally:**
  Don't just count letters. Look for the *cluster* of answers. Most voters will have a "primary" drive (Outcome, Conscience, or System) and a "secondary" modifier. Use the decision tree below to find the reader's profile.

  #### Step 1: The Primary Drive
  *   **Mostly "A" Answers:** You are an **Outcome Voter**. You vote to change the world.
  *   **Mostly "B" Answers:** You are a **Conscience Voter**. You vote to remain true to yourself/values.
  *   **Mostly "C" Answers:** You are a **Skeptic**. You question the act of voting itself.

  #### Step 2: The Specific Profile (The 6 Leaves)

  **1. Straight Consequentialist Lesser-Eviler**
  *   **Pattern:** Q1(A), Q2(A or B), Q3(A), Q4(A), Q5(A).
  *   **Logic:** You believe the only ethical metric is the outcome. If a vote has a non-zero chance of preventing harm, you take it. In safe states (Q2), you might relax because the "cost" of voting third party is zero, but in swing states, the math rules.
  *   **Key Differentiator:** You took the Vote Pair deal (Q5).

  **2. Threshold Consequentialist**
  *   **Pattern:** Q3(B), Q4(A), Q1(A).
  *   **Logic:** You care about outcomes, but not all outcomes are worth the price. If the candidates are nearly identical (Q3), you abstain or go third party. If the stakes are existential (Q4), you hold your nose and vote lesser-evil.
  *   **Key Differentiator:** The split between Q3 and Q4. If they answered the same on both, they are likely a Straight Consequentialist (always vote A) or a Conscience Voter (always vote B).

  **3. Duty-First Civic Deontologist**
  *   **Pattern:** Q8(B), Q1(A), Q7(A).
  *   **Logic:** Voting is a civic obligation, like jury duty. You vote for viable candidates not just to win, but to affirm the legitimacy of the system. You view spoiled ballots (Q7) as shirking duty.
  *   **Key Differentiator:** Support for compulsory voting (Q8) and viewing the vote as "hiring a contractor" (Q9-A).

  **4. Abstentionist / Participation Skeptic**
  *   **Pattern:** Q1(C), Q2(C), Q8(A).
  *   **Logic:** You see voting as a lottery or a ritual with no moral weight. You feel no duty to participate (Q8) and see little value in spoiled ballots (Q7-C) since the act itself is the problem.
  *   **Key Differentiator:** Consistent "Stay Home" across swing and safe states.

  **5. Expressive / Low-Stakes Voter**
  *   **Pattern:** Q1(B), Q2(B), Q9(B).
  *   **Logic:** You believe the odds of your vote mattering are so low that the "stakes" are effectively zero. Therefore, you are free to vote for who you like (Expression) without guilt.
  *   **Key Differentiator:** Q9 ("Wearing a jersey"). You view voting as identity expression, not outcome engineering.

  **6. Clean-Hands / Conscience Voter**
  *   **Pattern:** Q1(C or B), Q4(B), Q7(B), Q9(C).
  *   **Logic:** Voting is an act of moral testimony. Supporting a "bad" candidate corrupts you, regardless of the outcome. Unlike the Expressive voter, you aren't just "cheering"; you are refusing to be complicit.
  *   **Key Differentiator:** Q9 ("Giving testimony"). You would likely reject the Vote Pair deal (Q5-B) because the act of voting for the "bad" viable candidate is personally corrupting, even if it helps a friend.

  ---

  ### Uncharted Territory & Incoherent Combinations

  **The "Inconsistent Math" Profile**
  *   **Pattern:** Q1(B) [Vote Third in Swing] + Q2(A) [Vote Lesser Evil in Safe].
  *   **Diagnosis:** This is logically incoherent for a consequentialist. If the vote matters more in the swing state, that is where you should vote strategically, not in the safe state.
  *   **Result:** *"The Emotional Voter."* Your decisions are driven by local feelings rather than a consistent ethical framework. You might feel more pressure in the swing state to "be heard" but feel more responsible in the safe state to "do no harm."

  **The "System Gamer" Profile**
  *   **Pattern:** Q5(A) [Take Deal] + Q8(A) [Against Compulsory Voting] + Q1(A) [Vote Lesser Evil].
  *   **Diagnosis:** You are a pure strategist with no attachment to civic ritual. You want the best outcome but resent the obligation to get it.
  *   **Result:** *"The Reluctant Engineer."* You'll do the math, but you wish you didn't have to.

  ---

  ### Note on Indistinguishable Positions: Expressive vs. Clean-Hands

  **The Problem:**
  Positions #3 (Expressive) and #6 (Clean-Hands) often produce identical voting behavior (voting third-party or spoiling the ballot in both swing and safe states). In a standard quiz, they are functionally the same leaf.
  *   **Expressive:** "I vote for C because my vote for A won't change anything, so I might as well enjoy it."
  *   **Clean-Hands:** "I vote for C because voting for A is morally wrong, even if it changes something."

  **The Split:**
  They only diverge when the *consequences* become undeniable. The Expressive voter admits that if their vote *were* decisive, they would vote to prevent catastrophe. The Clean-Hands voter maintains that some acts are forbidden even to prevent catastrophe.

  **Proposed Extra Question (To separate #3 and #6):**
  *Scenario:* "Imagine a magical oracle tells you with 100% certainty that if you do not vote for Candidate A right now, Candidate B will win and 1,000 innocent people will be harmed. Candidate A is still morally flawed."
  *   **Option X:** Vote A. (The stakes are no longer low; expression yields to harm reduction.) -> **Expressive Voter.**
  *   **Option Y:** Still vote C/None. (I cannot be the direct cause of endorsing A, regardless of the outcome.) -> **Clean-Hands Voter.**

  *Journalist Note:* If you can only run 9 questions, group these two together as "The Conscience Block" and add a footnote that their internal motivations differ. If you can add a 10th question, use the "Magical Oracle" scenario above to split them.
