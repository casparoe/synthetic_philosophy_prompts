      *(Self-Correction on the "Copying" thought experiment)*: The roommate says "I can't be uncertain which room I'll wake up in." This is the "Elga vs. Lewis" debate on Sleeping Beauty/Self-Location. In MWI context, Saunders/Wallace argue you *are* uncertain. The roommate takes the "Objective Determinism" hard line. I need to explain why the MWI proponent thinks the roommate is wrong about the copying case too.

