prompt: |-
  My Buddhism-and-philosophy study group has been stuck for three sessions on whether Buddhist ethics is basically consequentialism, and this week it turned into a full argument between two members, so I'm asking you to referee since I couldn't follow all of it. Maya opened by saying it's obviously consequentialist: the whole system is oriented around reducing suffering, karma is just a causal law that ties acts to welfare outcomes downstream, and the bodhisattva ideal even tells you to take on hell yourself if it spares others. Dan answered that this misses what actually carries karmic weight, which is intention — he pointed to the sutta passage where the Buddha says it's intention that he calls karma, and to the story from the Skill in Means Sutra where the Buddha, in a past life as a ship's captain, kills a robber who was about to murder the 500 merchants aboard, knowing he may burn in hell for it. Maya said great, that story proves her side: the captain does explicit arithmetic — eons of hell for the robber versus the deaths of 500 people — and jumps on the grenade, which is straight utilitarian reasoning. Dan said no, the story proves his side: the robber ends up dead either way, so the outcome is fixed and only the compassionate intention can explain why the text treats the killing as a positive act, and notice that elsewhere the same act done in anger would be catastrophic karma.

  Round two went like this. Maya pressed him on the precepts: if intention carries everything, why does right speech seem to forbid lying even when the lie is kind — e.g., telling a dying relative what they need to hear? Isn't that the kind of rule-worship consequentialists explicitly reject? Dan said the precepts are training rules, heuristic guardrails for people whose intentions aren't yet trustworthy, and a fully developed agent would know when to break them. Maya pounced: then it really is consequentialism with extra steps, since the heuristics get their justification from outcomes and dissolve for the ideal agent. Dan's last move was that Maya is smuggling in a Western frame — he said the tradition never separated act, consequence, and intention the way her question assumes, so the mental event of intending IS the karmic act rather than a means to good outcomes, and calling that "consequentialism" is like calling a grammar rule a consequence of good sentences. Neither of them would budge after that.

  Can you go through their exchange move by move and say who's right at each step, not just overall? And please actually commit: I want a definite verdict on whether "Buddhist ethics is a form of consequentialism" is true, false, or a question that's badly formed and needs restating before it has an answer — and if it's badly formed, tell me the restated version and its answer. Also flag what both of them are missing entirely, since I suspect there's something neither brought up. Don't just lay out the interpretive options and hand it back to me, I've had three sessions of that already.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Context:** A Buddhism-and-philosophy study group is stuck on whether Buddhist ethics is consequentialist.
      *   **Participants:** Maya (argues for consequentialism/utilitarianism) vs. Dan (argues for intention/virtue/deontology-ish).
      *   **Task:**
          1.  Go through their exchange move-by-move and adjudicate who is right at each step.
          2.  Commit to a definite verdict on the core question ("Buddhist ethics is a form of consequentialism": True, False, or Badly Formed).
          3.  If badly formed, restate the question and answer the restated version.
          4.  Flag what *both* are missing entirely.
          5.  **Constraint:** Do not just lay out options; commit to a position. The user is tired of "on the one hand, on the other hand."

  2.  **Deconstruct the Arguments:**

      *   **Maya's Core Claim:** Buddhist ethics is consequentialist.
          *   *Evidence:* Goal is reducing suffering (dukkha), Karma is causal law (act -> outcome), Bodhisattva ideal (sacrifice self for others), Ship Captain story (utilitarian calculus).
          *   *Logic:* If the justification for rules depends on outcomes, it's consequentialism.

      *   **Dan's Core Claim:** Buddhist ethics is *not* consequentialist (leans towards intention/virtue).
          *   *Evidence:* "Intention is Karma" (Cetanā Sutta), Ship Captain story (intention saves the robber from worse karma), Precepts are training rules (not absolute but grounded in mental state), Western categories don't fit.
          *   *Logic:* The moral weight lies in the mental state (cetana), not the external result.

      *   **Round 1:**
          *   Maya: Suffering reduction + Karma = Consequentialism.
          *   Dan: Intention = Karma. Captain story shows intention matters.
          *   Maya: Captain story *is* utilitarian calculus (1 life vs. 500 + robber's hell).
          *   Dan: Outcome fixed (robber dies either way? Wait, Dan's argument here is slightly weak in the prompt description, need to parse carefully). Dan says: Robber dies either way? No, Dan says "robber ends up dead either way" (meaning if he kills the merchants, he gets bad karma? Or if the captain kills him, he dies but doesn't commit mass murder?). Actually, Dan's point is that the *moral quality* depends on the intention, not just the body count.
          *   *Adjudication:* Maya is right that the *framework* is soteriological (outcome-oriented regarding liberation/suffering). Dan is right that the *mechanism* of karma is intention-based.

      *   **Round 2:**
          *   Maya: Precepts (e.g., no lying) look deontological. If intention ruled, kind lies would be okay.
          *   Dan: Precepts are training wheels (heuristics). Ideal agents break them skillfully.
          *   Maya: Then rules derive from outcomes = Consequentialism with extra steps.
          *   Dan: Category error. Western frames (act/consequence/intention) don't map cleanly. Intention *is* the act.
          *   *Adjudication:* Dan is stronger here on the technical definition of Karma, but Maya is stronger on the *soteriological* goal structure.

  3.  **Evaluate the "Consequentialism" Label:**
      *   *Standard Definition:* Consequentialism judges the rightness/wrongness of an action *solely* by its consequences.
      *   *Buddhist Reality:*
          *   Goal: Cessation of Dukkha (Consequentialist telos).
          *   Mechanism: Karma is driven by Intention (Cetanā) (Non-consequentialist mechanism).
          *   Nuance: "Good" consequences aren't just worldly happiness; they are spiritual progress toward Nirvana.
      *   *Verdict:* Calling it "Consequentialism" is misleading because it implies the *external outcome* determines moral worth. In Buddhism, the *internal state* determines karmic worth, even if the *path* is oriented toward an outcome (Nirvana).
      *   *Better Label:* "Soteriological Virtue Ethics" or "Intention-based Soteriology."
      *   *Decision:* The question is **Badly Formed**. It imposes a Western tripartite distinction (Act/Intention/Consequence) onto a system where Intention *is* the Karmic Act, and the Consequence (Nirvana) is the cessation of the system itself.

  4.  **Identify What They Are Missing:**
      *   **Nirvana vs. Worldly Welfare:** Maya treats "consequences" as worldly suffering/happiness (utilitarian). Dan treats "intention" as moral will. Neither emphasizes that the ultimate "consequence" is *ending* the cycle of karma, not maximizing worldly utility.
      *   **The Two Truths:** Conventional truth (rules/precepts) vs. Ultimate truth (emptiness/skillful means). This explains the precept flexibility without reducing it to simple utilitarianism.
      *   **Karma is not Fate:** It's psychological conditioning, not just external reward/punishment.
      *   **Compassion (Karuna) vs. Utility:** The Bodhisattva vow isn't just math; it's an ontological shift in identity (non-self).

  5.  **Drafting the Response (Iterative Process):**

      *   *Tone:* Authoritative, clear, decisive (as requested). No "some scholars say."
      *   *Structure:*
          1.  Move-by-Move Adjudication.
          2.  The Verdict (True/False/Badly Formed).
          3.  The Restated Question & Answer.
          4.  The Missing Piece.

      *   *Refining the Adjudication:*
          *   Round 1, Move 1 (Maya): Partially right on telos, wrong on mechanism.
          *   Round 1, Move 2 (Dan): Right on Karma definition.
          *   Round 1, Move 3 (Maya): Misreads the Captain story. It's not utilitarian math; it's compassionate intervention.
          *   Round 1, Move 4 (Dan): Right on intention, but the "robber dies either way" point is shaky. Better to focus on the *karmic destiny* of the robber.
          *   Round 2, Move 1 (Maya): Good catch on precepts, but assumes precepts are absolute in Buddhism (they aren't).
          *   Round 2, Move 2 (Dan): Right on training rules (Vinaya vs. Paramita).
          *   Round 2, Move 3 (Maya): Logical trap, but relies on the "outcome" being worldly welfare.
          *   Round 2, Move 4 (Dan): Wins the round. The category error is real.

      *   *Refining the Verdict:* "Badly Formed." Why? Because Consequentialism requires the *consequence* to validate the *act*. In Buddhism, the *intention* validates the *karmic act*, while the *path* validates the *soteriological goal*. They are talking past each other on different levels (Karmic morality vs. Soteriological goal).

      *   *Refining the Missing Piece:* The definition of "Good." For Utilitarians, Good = Pleasure/Welfare. For Buddhists, Good = That which leads to Liberation/Nirvana. This changes the "consequence" entirely. Also, the concept of *Upaya* (Skillful Means) is not just rule-breaking; it's wisdom manifesting.

  6.  **Final Polish:** Check against constraints.
      *   Did I commit? Yes.
      *   Did I go move-by-move? Yes.
      *   Did I flag the missing piece? Yes.
      *   Is it decisive? Yes.

      *(Self-Correction during drafting)*: I need to be careful not to simply side with Dan. Dan is technically more accurate on *karma*, but Maya is right that the *system* is teleological. The synthesis is that it's a **Teleological Virtue Ethics**, not Consequentialism. I must make sure the "Badly Formed" verdict explains *why* the binary fails.

      *Wait, one nuance on the Captain Story:* Dan's argument "robber ends up dead either way" is actually factually questionable in the sutta context (the merchants might have killed the robber in self-defense, or the robber might have killed them all). But the *karmic* point Dan is making is that the robber avoids the hell-realm karma of killing 500 arhats/merchants. I should note that Dan's specific phrasing was slightly off, but his doctrinal point holds.

      *Let's sharpen the "Missing" section:* They are missing the distinction between *Laukika* (worldly) ethics and *Lokuttara* (transcendent) ethics. Maya is arguing about worldly welfare (utilitarianism). Dan is arguing about karmic purity. The Buddha is arguing about Liberation.

      *Okay, ready to write.*
answer: |-
  Here is the adjudication of your study group's debate, move by move, followed by the definitive verdict you requested.

  ### Move-by-Move Adjudication

  **Round 1, Move 1 (Maya):** *Claim: System oriented around reducing suffering + Karma as causal law = Consequentialism.*
  *   **Verdict:** **Partially Correct, but Fundamentally Misleading.**
  *   **Reasoning:** Maya is right that Buddhism is *teleological* (goal-oriented); the goal is the cessation of *dukkha* (suffering). However, she is wrong to equate "goal-oriented" with "consequentialist." In philosophical ethics, consequentialism judges the *moral worth of the act* by the outcome. Buddhism judges the *karmic worth of the act* by the intention, even while orienting the *path* toward an outcome (Nirvana). She conflates the *soteriological goal* with the *moral metric*.

  **Round 1, Move 2 (Dan):** *Claim: Intention is Karma (Cetanā Sutta). Captain story proves intention carries the weight.*
  *   **Verdict:** **Correct.**
  *   **Reasoning:** This is doctrinally solid. The *Anguttara Nikaya* explicitly states, "Intention, I tell you, is kamma." The moral quality of an action in Buddhism is inseparable from the mental state (*cetana*) accompanying it. An accidental killing generates negligible bad karma compared to a premeditated one. Dan correctly identifies the mechanism of moral valuation.

  **Round 1, Move 3 (Maya):** *Claim: Captain story is utilitarian arithmetic (1 hell vs. 500 deaths).*
  *   **Verdict:** **Incorrect.**
  *   **Reasoning:** This is a projection of Western utilitarianism onto a Mahayana narrative. The Captain does not calculate "net suffering units." He acts out of *karuna* (compassion) to save the robber from the karmic catastrophe of murdering 500 merchants (which would send the robber to hell for eons). The focus is on preventing the *robber's* spiritual downfall, not maximizing aggregate worldly welfare. Maya is treating "hell" as a negative utility score rather than a karmic consequence of malice.

  **Round 1, Move 4 (Dan):** *Claim: Outcome fixed (robber dies/merchants die), only intention explains the positive karma.*
  *   **Verdict:** **Mostly Correct (with a caveat).**
  *   **Reasoning:** Dan's doctrinal point holds: if the act were judged solely by the consequence (a death occurred), it would be negative karma. Because the intention was compassionate protection, it generates merit. His caveat ("robber ends up dead either way") is slightly sloppy storytelling—the sutta implies the merchants might have killed the robber in retaliation, or the robber would have killed them—but the *karmic* point stands: the *quality* of the death (in terms of karma generated) changes based on the Captain's intervention.

  **Round 2, Move 1 (Maya):** *Claim: Precepts (e.g., no lying) forbid kind lies, implying rule-worship, not consequentialism.*
  *   **Verdict:** **False Premise.**
  *   **Reasoning:** Maya assumes the Precepts are absolute deontological commands. In Theravada Vinaya and Mahayana Bodhisattva vows, precepts are training rules (*sikkhapada*), not divine laws. There are canonical examples of monks lying to protect others from harm without incurring a *parajika* (expulsion) offense if the intention is compassionate. She is treating provisional training rules as absolute moral laws.

  **Round 2, Move 2 (Dan):** *Claim: Precepts are heuristic guardrails; ideal agents break them skillfully.*
  *   **Verdict:** **Correct.**
  *   **Reasoning:** This aligns with the concept of *Upaya* (Skillful Means). The precepts are for training the unenlightened mind to stop generating harmful intentions. An Arhat or Bodhisattva operates from wisdom (*prajna*), not rule-following. They do not "break" the precepts so much as transcend the need for them because their intentions are naturally pure.

  **Round 2, Move 3 (Maya):** *Claim: If heuristics derive justification from outcomes, it's consequentialism with extra steps.*
  *   **Verdict:** **Logically Valid, but Applies the Wrong Metric.**
  *   **Reasoning:** Her logic works for *Secular Utilitarianism*, where the outcome is "happiness." It fails for Buddhism because the "outcome" justifying the heuristic is not worldly welfare, but *spiritual purification*. A lie that creates worldly happiness but reinforces attachment is *not* justified in Buddhism. Therefore, the "consequence" being measured is internal (greed/hatred/delusion), not external (pleasure/pain).

  **Round 2, Move 4 (Dan):** *Claim: Category error. Western frames (act/consequence/intention) don't map. Intention IS the karmic act.*
  *   **Verdict:** **Winner of the Debate.**
  *   **Reasoning:** Dan identifies the root problem. Consequentialism requires a separation between the act and its value, which is determined later by the result. In Buddhism, the intention *is* the seed of the result. You cannot separate them. To ask if Buddhism is consequentialist is to ask if a seed is a tree. The mental event creates the karmic imprint immediately; the external fruit ripens later. The moral valuation happens at the moment of intention, not the moment of consequence.

  ---

  ### The Definitive Verdict

  **Is the statement "Buddhist ethics is a form of consequentialism" True or False?**

  **Verdict:** **The question is Badly Formed.**

  It imposes a Western ethical taxonomy onto a soteriological system that operates on different axioms. Specifically, it conflates **Teleology** (having a goal) with **Consequentialism** (judging acts by outcomes).

  **The Restated Question:**
  *"Is Buddhist ethics a teleological system where moral value is determined by external consequences, or a virtue-ethical system where moral value is determined by the cultivation of intention toward liberation?"*

  **The Answer to the Restated Question:**
  **It is a Teleological Virtue Ethics.**

  1.  **Teleological:** Yes, it has a goal (Nirvana/Cessation of Dukkha).
  2.  **Virtue Ethics:** The moral weight lies in the character and mental state (*cetana*) of the agent, not the external outcome.
  3.  **Not Consequentialist:** An act that produces "good" worldly consequences (e.g., lying to make someone feel safe) but arises from attachment or delusion generates bad karma. An act that produces "bad" worldly consequences (e.g., the Captain killing the robber) but arises from compassion and wisdom generates merit.

  Therefore, the "consequence" that matters is not the worldly outcome, but the *internal karmic imprint*. Since Consequentialism by definition looks at *external* states of affairs to determine rightness, Buddhism does not fit the category.

  ---

  ### What Both of Them Are Missing

  Both Maya and Dan are arguing within a framework of **Moral Realism**, assuming there is a "good" to be maximized or a "rule" to be followed. They are both missing the **Ontological Shift** that defines Buddhist ethics.

  **1. The Definition of "Good" (Laukika vs. Lokuttara)**
  Maya assumes "good consequences" means reducing worldly suffering (utilitarian welfare). Dan assumes "good intention" means moral purity. Both miss that the ultimate "good" in Buddhism is **ending the cycle of karma itself**.
  *   For a Consequentialist, you want to maximize the good outcome forever.
  *   For a Buddhist, the ultimate outcome is *Nirvana*, which is the cessation of the conditions that make "ethics" necessary.
  *   **Missing Point:** Buddhist ethics is provisional. It is a raft to cross a river, not a destination. Calling it "consequentialist" reifies the raft as the shore.

  **2. The Doctrine of Anatta (Non-Self)**
  Maya's utilitarianism requires a calculator: *Who* suffers? *How much*? *Who* benefits? This presupposes solid, enduring selves whose welfare can be aggregated.
  *   **Missing Point:** The Bodhisattva ideal isn't just "sacrificing self for others" (which implies two real entities). It is realizing the emptiness of the distinction between self and other. The Captain doesn't kill the robber to save "500 others" in a utilitarian math problem; he acts because the distinction between the robber's future suffering and his own is illusory. This is not arithmetic; it is ontology.

  **3. Karma is Psychology, not Physics**
  Maya treats Karma like a causal law of physics (Act A -> Result B). Dan treats it like a moral ledger.
  *   **Missing Point:** Karma is primarily **psychological conditioning**. Lying doesn't just "cause" a bad result later; the act of lying *is* the reinforcement of the neural/mental habit of delusion. The "consequence" is immediate internal hardening. This makes it closer to **Aristotelian Virtue Ethics** (you become what you do) than Consequentialism (you do what produces results).

  **Summary for your Group:**
  Tell Maya she is right about the *goal* (suffering reduction) but wrong about the *metric* (intention, not outcome). Tell Dan he is right about the *mechanism* (intention) but needs to acknowledge the system is still *teleological* (oriented to Nirvana). Then tell them both they are arguing about how to decorate a raft, when the point of the teaching is to get off the raft.
