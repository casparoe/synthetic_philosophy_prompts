          *   *Malkovich's Portal:* This is the killer example. Seeing only Malkoviches is like seeing the texture of the UI itself. It's the "glitch."
      *   **Where the Reading Fails (The Homunculus Problem):**
          *   Address the "Cartesian Theater" worry directly. Yes, the film is technically dualist. The soul/consciousness is a distinct substance that can travel. Interface theory says consciousness *emerges* from the hardware.
          *   *Reframing the Failure:* Instead of saying the film is "wrong," argue that the film uses dualism as a *metaphor* for the phenomenology of dissociation. It makes the internal feeling external.
      *   **What the Film Adds (Phenomenology vs. Theory):**
          *   Philosophy argues; film *shows*.
