answer: |-
  This is a high-quality worry. You have correctly identified that the strongest version of Updateless Decision Theory (UDT)—the one that extends to logical facts and sequential policy trees—is also the most fragile. The move from "don't update on observations" to "don't update on logical computations" is where the theoretical heavy lifting happens, and it's where the body is buried.

  You asked for real defeaters, ranked by how much they should move a committed proponent, along with an assessment of your specific worries about insulation and sequential commitment.

  Here is the breakdown of what actually threatens the view, ranked from "existential threat" to "serious inconvenience."

  ### 1. The "Logical Prior" Incoherence (Existential Threat)
  **The Defeater:** There is no coherent, computable, or reflective consistent prior over logical facts.

  **Why it counts:** Updatelessness requires a "prior standpoint" from which to evaluate policies. In empirical cases, this is easy (your state before the observation). In logical cases, this is the "state before you computed the proof." But logical facts are necessary. To be updateless about them, you must assign non-zero probability to logical falsehoods (e.g., that a specific Turing machine halts when it doesn't, or that PA is inconsistent).

  If your prior assigns probability to logical falsehoods, you are vulnerable to **Dutch Books** (or "Logical Dutch Books"). If you are updateless, you must act as if $2+2=5$ is possible. If a predictor offers you a bet based on the digits of $\pi$ that you haven't computed, UDT says take the bet based on your prior. But if the math is necessary, any coherent prior should eventually assign probability 1 to the truth. If you refuse to update to 1 even after seeing the proof (because you are updateless), you are effectively permanently confused about reality.

  **Proponent Concession:** A committed updateless theorist must concede that **logical updatelessness cannot be absolute.** You cannot be updateless about *all* logical facts. You must draw a line. But where? If you update on *some* logical facts (simple arithmetic) but not others (complex proofs), the view loses its universal normative force and becomes a heuristic about "which logical facts are expensive to compute." This collapses UDT into a bounded rationality heuristic rather than a fundamental normative truth.

  **Rank:** #1. If you can't define the prior standpoint without circularity or incoherence, the theory has no anchor.

  ### 2. The "Troll Bridge" / Spurious Proof Problem (Mechanism Failure)
  **The Defeater:** Logical updatelessness can force you to lose money in scenarios where CDT/EDT win, specifically via spurious counterfactuals.

  **Why it counts:** This is the strongest *internal* technical objection (developed largely within the MIRI/lesswrong sphere). In "Troll Bridge," an agent wants to cross a bridge. A troll blows up the bridge if the agent crosses *for a bad reason* (e.g., because a proof exists that crossing is bad).
  Because the updateless agent reasons from a prior that includes uncertainty about its own consistency, it can reason: "If I cross, there might be a proof that crossing is bad (due to my potential inconsistency). If that proof exists, the troll blows up the bridge. Therefore, expected utility of crossing is low."
  The agent refuses to cross, not because the bridge is actually unsafe, but because its logical uncertainty creates a spurious correlation between its action and the existence of a proof of its own inconsistency.

  **Proponent Concession:** This is a bullet that is hard to bite. It shows that being updateless about your own source code can lead to **self-fulfilling prophecies of failure**. A proponent must admit that naive logical updatelessness is unsafe. They usually retreat to "Logical Induction" style reasoning, but that involves *updating* on logical evidence over time. This contradicts the core "updateless" slogan.

  **Rank:** #2. It shows the mechanism breaks in specific, formalizable environments, leading to dominated strategies.

  ### 3. Reflective Instability (The Self-Modification Defeater)
  **The Defeater:** An updateless agent, upon reflection, might choose to self-modify into an updateful agent.

  **Why it counts:** Normative theories should ideally be **reflectively stable**. If you know you will face a situation where being updateless hurts you (e.g., a scenario where a predictor only rewards agents that update on specific indexical information, or where computational costs make policy-tree search impossible), you should precommit to being updateful in those cases.
  If the optimal policy *from the prior* is "become an updateful agent once you observe X," then Updatelessness recommends its own demise. While proponents argue this is just "flexibility," if the theory recommends abandoning its core principle (acting from the prior) in favor of acting from the posterior, the normative privilege of the prior is undermined.

  **Proponent Concession:** Proponents often argue this is a feature (UDT chooses the best *successor*). However, if the successor abandons the updateless calculus for standard conditionalization, then Updatelessness is just a transient phase, not the fundamental norm.

  **Rank:** #3. It suggests Updatelessness is an instrumental strategy for coordination, not a fundamental truth about rationality.

  ---

  ### Addressing Your Specific Worries

  #### 1. "Ignoring True Information" (The Paranoid Precommitment)
  **Verdict:** **Absorbed with qualification.**
  Proponents will tell you: "You aren't ignoring information; you are weighting it by the probability it would have had at the prior."
  *   **The Concession:** They must concede that this feels like "ignoring" from the inside. If you know $P$, and you act as if you only know $P$ with probability $0.9$ (because that was your prior), you are intentionally degrading your epistemic state.
  *   **The Defense:** They argue this is the price of coordination with counterfactual selves. The "defeater" here is only strong if you value *local* optimality (winning *now*) over *global* optimality (winning across the whole policy tree). If you accept global optimality as the norm, this isn't a defeater, just a feature.

  #### 2. "The Prior Standpoint Circularity"
  **Verdict:** **Real Defeater (See Rank #1 above).**
  You asked if there is a coherent notion of the prior standpoint. The honest answer is **no, not yet.**
  In empirical cases, the prior is "time $t_0$." In logical cases, the prior is "before computation." But computation is a physical process. If you are updateless about the output of your computation, you are updateless about the physical state of your brain. This leads to the "5-and-10" problem (why don't I just take the 10? Because my prior thinks I might be the kind of agent that takes 5).
  The circularity arises because the prior must model the agent who holds the prior. This leads to infinite regress or fixed-point problems that haven't been satisfactorily solved. A committed theorist should be very worried about this.

  #### 3. "Sequential Commitment & Unanticipated Observations"
  **Verdict:** **Hand-wave / Computational Excuse.**
  You asked: *"If you've committed to a policy tree and then observe something the tree didn't anticipate, what does the view say to do?"*
  *   **The Standard Answer:** "The policy tree must cover all possible observations (all computable strings)."
  *   **The Problem:** This is computationally impossible for bounded agents. You cannot store a policy for every possible observation string.
  *   **The Real Answer:** You must update. You must compress the observation space. You must say, "I didn't anticipate *this* specific observation, so I will now treat it as a new node and choose the best sub-policy."
  *   **The Defeater:** This admits that **sequential updatelessness is an idealization that bounded agents cannot implement.** If the theory only works for unbounded agents, its normative force for humans (or AIs) is limited. It becomes "Act as if you were unbounded and updateless," which is a very distant guide.

  #### 4. "Insulation from Disconfirmation"
  **Verdict:** **The Biggest Philosophical Problem.**
  You asked if the insulation disqualifies it as a normative theory.
  *   **The Insight:** Normative theories *are* insulated from empirical disconfirmation (you can't falsify utilitarianism with a telescope). However, they are vulnerable to **reflective disconfirmation** (internal inconsistency) and **pragmatic disconfirmation** (failing to guide action).
  *   **The Worry:** Updatelessness wins the thought experiments it was designed for (Newcomb, Mugging) by *definition*. It defines "rationality" as "what wins these games." If it fails in Troll Bridge (Rank #2), it loses on its own terms.
  *   **Conclusion:** The insulation is expected for a normative theory, *but* the lack of independent motivation is a weakness. Why be updateless? "To win." Win what? "Newcomb-like problems." Why care about those? "Because they reveal the nature of rationality." This is circular.
  *   **Does it disqualify it?** No, but it reduces it from "The Theory of Rationality" to "A Strategy for Specific Game Classes."

  ### Summary: What Should Move You?

  If I were in your shoes, holding this view, here is how I would recalibrate:

  1.  **Downgrade Confidence in Logical Updatelessness:** The "Logical Prior" problem is unsolved. It is highly likely that a pure, absolute logical updatelessness is incoherent. You should view it as a limit concept, not an implementable norm.
  2.  **Accept Boundedness:** Admit that sequential updatelessness is impossible for bounded agents. Therefore, *some* updating is normatively required for tractability. This breaks the "pure" view.
  3.  **Shift to "Reflective Coherence":** Instead of "Updatelessness," frame the goal as "Reflective Coherence." Sometimes that looks like updatelessness (Newcomb), sometimes it looks like updating (Troll Bridge). The core norm isn't "don't update," it's "don't be dynamically inconsistent unless computational constraints force you to."
  4.  **The Real Defeater:** The fact that **Logical Induction** (the best current model of reasoning under logical uncertainty) is inherently *updateful*. It updates on proofs as it finds them. If the best formal model of logical reasoning is updateful, then "Logical Updatelessness" is likely a bug, not a feature, of the earlier UDT formulation.

  **Final Verdict:** Your worry about the "prior standpoint" and the "sequential hand-wave" are the real defeaters. The view survives only if you treat it as an unbounded ideal that bounded agents approximate by *sometimes* pretending to be updateless, rather than a strict commandment to never update. If you demand it be a strict commandment, the Troll Bridge and Logical Prior problems break it.
