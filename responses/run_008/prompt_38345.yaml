      *   *Refining the Prior:* Distinguish between "what prior" and "updateless relative to what." The problem is that logical facts are necessary. Being updateless about necessary truths feels like pretending 2+2 might equal 5. The "logical prior" is the weak link.
      *   *Refining Sequential:* The user asked about unanticipated observations. The answer is usually "the policy covers all computable observations." But if the observation is outside the model? That's the "Old Evidence" problem revived.
