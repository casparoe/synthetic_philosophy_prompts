      *(Refining the "Gameability" point)*: The user asks if gameability is evidence against semantic views. Yes, because if the *token* carries the harm, changing the token (unicode, paraphrase) should remove the harm. If the harm persists, the harm is in the *meaning/intent*, not the *surface form*. This supports Pragmatic/Ideological views.

