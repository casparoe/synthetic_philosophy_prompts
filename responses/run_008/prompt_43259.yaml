  2.  **Deconstruct the Philosophy of Slurs (Mental Sandbox):**
      *   *Semantic Views (Homogenizing/Expressivist):* The slur *means* something derogatory. It's part of the truth conditions or conventional implicature. (e.g., Anderson & Lepore, Saka).
      *   *Pragmatic Views (Contextualist):* The word itself is neutral (or refers to the group), but using it *does* something offensive based on context/intent. (e.g., Croom, Bianchi).
      *   *Prohibitionism (Taboo):* The word is forbidden. Using it violates a rule. (e.g., Anderson & Lepore's prohibitionism, though often grouped with semantic).
      *   *Ideological/Deferred:* The slur invokes a harmful perspective or ideology. (e.g., Homogenizing views often touch on this, but specifically the "expressive content" invoking a perspective).
