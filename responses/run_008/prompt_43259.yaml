  7.  **Final Polish:** Structure the response clearly: Translation, Residue Report, Specific Questions, Final Verdict. (Proceed to generate output based on this structure).

      *   *Key Insight to highlight:* The difference between *detection* (engineering) and *constitution* (philosophy). Engineering asks "can we flag this?" Philosophy asks "what *is* this?"
      *   *Specific NLP terms to use:* Embedding space, attention heads, latent variables, decision boundaries, out-of-distribution (OOD), adversarial robustness, metadata features.

  8.  **Drafting the Content (Mental or Scratchpad):**
      *   *Translation:*
