answer: |-
  To evaluate thought experiments (or "intuition pumps," as Daniel Dennett calls them) with the rigor they often lack, you need a set of normative standards. Below are five desiderata for an adequate test of a thought experiment, followed by an evaluation of your own candidate and the final exclusionary judgment.

  ### The Desiderata for Intuition Pumps

  **1. Descriptive Invariance**
  *   **The Requirement:** The intuitive verdict yielded by the thought experiment must remain stable under paraphrases that alter the rhetorical framing but preserve the factual content.
  *   **The Consideration:** This addresses the **framing effect**. If a case persuades under one description but falls flat under a neutral paraphrase, the persuasion is likely rhetorical rather than logical.
  *   **Case Application:** **Thomson's Violinist.** If you describe the scenario as "unplugging a stranger" versus "aborting a pregnancy," the facts of bodily autonomy remain identical, but the intuitive verdict often shifts. A robust pump must survive this shift.

  **2. Target Distinction**
  *   **The Requirement:** The test must explicitly separate the intuition about the *imagined scenario itself* from the intuition about the *theoretical concept* the scenario is meant to illuminate.
  *   **The Consideration:** This addresses the **distinction you noted** between the case and its relevance. We often agree on what happens in the story but disagree on what it proves.
  *   **Case Application:** **Searle's Chinese Room.** One might agree that the man in the room does not "understand" Chinese (scenario intuition) but deny that this proves a computer running a program cannot understand (concept intuition). The pump fails if it treats these as the same judgment.

  **3. Intersubjective Stability**
  *   **The Requirement:** The intuition generated must be consistent across diverse demographics, cultures, and philosophical trainings, or the pump must explain why the variation occurs.
  *   **The Consideration:** This addresses **variation across audiences**. If an intuition is only held by Western, educated philosophers, it may reflect cultural bias rather than universal truth.
  *   **Case Application:** **Putnam's Twin Earth.** The intuition that "water" refers to H₂O rather than XYZ is not universal; speakers from different linguistic backgrounds often have divergent semantic intuitions about the scenario.

  **4. Detail Relevance**
  *   **The Requirement:** Every vivid detail included in the narrative must be justified as logically relevant to the conclusion, rather than serving merely as an emotional trigger.
  *   **The Consideration:** This addresses **sheer vividness**. Vividness can bypass critical scrutiny by triggering emotional responses that mimic logical assent.
  *   **Case Application:** **Parfit's Teletransporter.** The specific detail of the machine "scanning and destroying" the original body is vivid and emotionally charged. The test demands we ask: Does the *destruction* matter for personal identity, or is it a distraction from the *replication*?

  **5. Bidirectional Compulsion (Your Candidate)**
  *   **The Requirement:** The logical structure of the pump must exert equal pressure when used to argue for a conclusion the evaluator already rejects as it does for a conclusion they accept.
  *   **The Consideration:** This addresses **confirmation bias**. We are prone to find arguments compelling when they flatter our existing views.
  *   **Evaluation:** This requirement **belongs on the list**. It is a crucial check against motivated reasoning. However, it relies heavily on the evaluator's self-knowledge. It conflicts slightly with **Intersubjective Stability**: if I find the reverse unconvincing because I reject the conclusion, but others find it convincing, is the fault in the pump or in me? Despite this, it is a necessary discipline for the user of the pump.

  ### Flagged Incompatibility

  I suspect **Descriptive Invariance** and **Intersubjective Stability** cannot be jointly satisfied.

  *   **Reasoning:** Cognitive science suggests that human intuition is fundamentally context-dependent (violating Invariance) and that context is processed differently across cultures (violating Stability). To achieve Descriptive Invariance, one must strip the scenario of the specific narrative hooks that make it intelligible to a specific audience. If you strip those hooks to satisfy Invariance, the scenario may become too abstract to generate *any* stable intuition across audiences. Conversely, if you keep the details necessary for Stability (making it relatable to specific groups), you inevitably introduce framing that violates Invariance.

  ### The Most Exclusionary Requirement

  While all famous thought experiments struggle with these criteria, the single requirement that excludes the most famous thought experiments in circulation is **Descriptive Invariance**.

  Most canonical thought experiments are narratives. Narratives inherently rely on framing, metaphor, and specific word choice to guide the imagination. When philosophers like Ned Block (responding to Searle) or Peter Unger (responding to Thomson) paraphrase these cases neutrally, the intuitive "punch" frequently vanishes or reverses. If a thought experiment cannot survive a neutral paraphrase, it is functioning as rhetoric, not logic. Since the vast majority of famous pumps rely on their specific narrative framing to generate the intended intuition, strict Descriptive Invariance disqualifies most of them.

  \answer{Descriptive Invariance}
