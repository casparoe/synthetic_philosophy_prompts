answer: |-
  It is completely understandable that the answer you received felt "too quick." It has the ring of philosophical depth, but it often functions as a conversation-stopper that conflates *naming* a thing with *creating* the thing.

  Ian Hacking is a fascinating philosopher, but his concept of "making up people" (Dynamic Nominalism) is frequently misunderstood in online spaces as a form of radical constructivism ("nothing is real until we name it"). Hacking's actual view is more subtle: he argues that classifying people changes how they understand themselves, which in turn changes the classification itself (the "looping effect"). He does not necessarily deny the biological substrate, but he insists the *human kind* is a moving target.

  Here is a menu of precise readings of "making up people," ranked from trivial to radical, along with an evaluation of whether they actually support dismissing your question about the 1990s.

  ### 1. The Semantic Claim (The "Label" Reading)
  *   **The Claim:** The word "ADHD" (specifically applied to adults) and the administrative apparatus surrounding it (diagnostic codes, insurance coverage, specific medications) did not exist in your town in the 90s. Therefore, strictly speaking, you could not be a member of the *social category* "Adult with ADHD."
  *   **Plausibility:** **High.** This is historically and linguistically true. In the 90s, the DSM-IV was just introducing "ADD" with subtypes, and adult diagnosis was fringe.
  *   **Does it dismiss your question?** **No.** This answers the question "Did you have the *label*?" with a "No." It does not answer "Did you have the *condition*?" Dismissing your question based on this is a category error. It's like saying a person in 1850 didn't have "influenza" because the virus wasn't isolated until 1933. They had the illness; they lacked the taxonomy.

  ### 2. The Interactive Claim (The "Looping Effect" Reading)
  *   **The Claim:** Human kinds are "interactive." Once a classification exists, people classified by it change their behavior and self-conception to align with (or resist) it. Therefore, the *experience* of having ADHD in 2024 is fundamentally different from the experience of having those traits in 1990. In the 90s, you were "lazy" or "dreamy"; now, you are "neurodivergent." These are different ways of *being* a person.
  *   **Plausibility:** **High.** This is Hacking's core argument. The *meaning* of your struggles changes when the category exists. In the 90s, your traits interacted with a world that called them moral failings. Now, they interact with a world that calls them medical/neurological.
  *   **Does it dismiss your question?** **Partially.** It suggests that while the *traits* existed, the *person* you were (the "ADHDer") is a product of the current era. However, it does not deny that the underlying struggles were real. It supports the idea that you weren't an "ADHDer" back then, but it doesn't support the idea that you weren't *struggling with executive dysfunction*.

  ### 3. The Historical Claim (The "Moving Target" Reading)
  *   **The Claim:** Psychiatric kinds are not natural kinds (like gold or electrons); they are historical kinds. The criteria for ADHD in the 90s (focused heavily on childhood hyperactivity) are different from the criteria now (which include adult inattentiveness). Therefore, the "kind" you belong to now literally did not exist then, even if a similar-looking kind did.
  *   **Plausibility:** **Medium-High.** Diagnostic criteria do drift. What counts as pathology changes.
  *   **Does it dismiss your question?** **No.** This actually validates your intuition. It suggests that the *definition* was too narrow to catch you back then, not that *you* were missing. It implies the net was too small, not that the fish didn't exist.

  ### 4. The Radical Constructivist Claim (The "Online Community" Reading)
  *   **The Claim:** There is no underlying biological reality independent of the classification. The classification *creates* the reality. Without the practice of diagnosing ADHD, the cluster of behaviors you exhibit is just "personality" or "normal variation." Therefore, you literally could not have had ADHD because the practice that constitutes ADHD was not applied to you.
  *   **Plausibility:** **Low.** This is a very strong philosophical position that most scientists and many philosophers (including Hacking, arguably) reject regarding neurodevelopmental traits. While social context shapes expression, there is strong evidence for heritable neurocognitive traits (working memory deficits, impulse control issues) that exist regardless of naming.
  *   **Does it dismiss your question?** **Yes.** This is the reading your commenter used. It says your question is "confused" because it assumes a reality exists prior to the label.
  *   **Critique:** This reading is often used to sound profound, but it risks gaslighting. It conflates the *validity of the diagnosis* with the *reality of the suffering*.

  ### 5. The Realist Claim (The "Yes, But Unnamed" Reading)
  *   **The Claim:** There is a material, neurocognitive substrate (let's call it "Executive Function Deficit") that exists independently of classification. "ADHD" is the current best attempt to map that substrate. You had the substrate; you just lacked the map.
  *   **Plausibility:** **High.** This aligns with the medical model and common sense.
  *   **Does it dismiss your question?** **No.** It answers "Yes." It acknowledges that Hacking is right about *identity* (you didn't have the social role) but wrong to imply the *condition* was absent.

  ---

  ### How to bring this back to the group chat

  Your intuition that the answer was "too quick" is philosophically sound. The commenter is using Hacking's **Radical Constructivist** reading to shut down a **Realist** question.

  Here is a way to frame this that honors Hacking without erasing your history:

  > "I've been thinking about the 'making up people' point. I think there's a distinction we need to make between the **Interactive Kind** and the **Underlying Trait**.
  >
  > Hacking's point is definitely true that I wasn't an 'ADHDer' in the 90s—that identity, community, and self-understanding didn't exist for me. The *looping effect* means my experience now is different than it would have been then.
  >
  > But using that to say I didn't have the *condition* feels like a category error. If I broke my leg in 1890, I didn't have access to orthopedics or the concept of 'fracture management,' and my experience of the pain would be shaped by the beliefs of that time. But the bone was still broken.
  >
  > So, the accurate answer isn't 'No, the kind didn't exist.' It's: **'I had the neurocognitive traits, but I didn't have the kind.'** I was a member of the biological population, but not the social category. Dismissing the reality of the struggle just because the label wasn't available feels like it ignores the material reality Hacking is trying to complicate, not erase."

  **The Summary for you:**
  You are right to feel that the "No" was too quick. The most honest philosophical position is a hybrid: **You had the traits (Realism), but you did not have the identity (Constructivism).** The suffering was real; the name was absent. The name changes how you live with the suffering, but it does not conjure the suffering out of thin air.
