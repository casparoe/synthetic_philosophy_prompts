answer: |-
  ### Brainstorming

  The household analogy is a staple of communitarian and certain libertarian defenses of border control (reminiscent of Michael Walzer's *Spheres of Justice* or Hans-Hermann Hoppe's covenantal communities). Its intuitive force relies on conflating *jurisdiction* with *ownership*. To audit this, I need to isolate where the moral stakes diverge. A homeowner's right to exclude is grounded in private property rights and freedom of association; a state's right to exclude is grounded in political self-determination and the protection of public goods. The divergence becomes critical when the "guest" lacks a home of their own (refugees) and when the "host" possesses a monopoly on legitimate violence (deportation). The colleague's extensions (deportation and temporary shelter) rely on assuming the "guest" has alternatives and that the "storm" is transient. Both assumptions are empirically and morally fragile in the asylum context. I need to distinguish between disanalogies that are merely descriptive (size, complexity) and those that are normative (property status, coercion, alternatives).

  ### Correspondence Table

  | Household Analogy | Political Community Counterpart | Structural Function |
  | :--- | :--- | :--- |
  | **House** | State Territory | The spatial domain where the shared life occurs. |
  | **Homeowner** | State Sovereign / Government | The agent authorized to control access and rules. |
  | **Family Members** | Citizenry / Political Community | The beneficiaries of the shared life and self-determination. |
  | **Door** | Border / Immigration Control | The mechanism of inclusion/exclusion. |
  | **Guest** | Asylum Seeker / Migrant | The outsider seeking entry or stay. |
  | **Blizzard** | Persecution / Torture / Death | The external threat generating a duty of rescue. |
  | **Garage** | Temporary Protection / Refugee Camp | The minimal shelter provided without full membership. |
  | **Party** | Political Order / Legal System | The ongoing cooperative scheme being protected. |

  ### Where the Mapping Breaks

  1.  **Nature of Ownership:** A house is private property, acquired through purchase or inheritance, owned by specific individuals. State territory is a jurisdictional claim over a public good, often acquired through historical processes (conquest, treaty) involving the ancestors of current citizens, not the citizens themselves.
  2.  **Monopoly on Space:** A homeowner is one among many; a rejected visitor can go to another house. A state is part of a global system where all habitable land is divided among states. If all states act like homeowners refusing entry, the asylum seeker has nowhere to go.
  3.  **Coercive Power:** A homeowner asks a guest to leave; if the guest refuses, the homeowner calls the state. A state *is* the entity that forcibly removes the person. The state combines the role of host and enforcer.
  4.  **The "Guest" Status:** A social guest is invited and implies reciprocity. An asylum seeker is a claimant based on need, not invitation. They do not enter to socialize but to survive.
  5.  **Transience of Threat:** A blizzard is a natural, temporary event. Persecution is often political, systemic, and permanent (e.g., totalitarian regimes, ethnic cleansing).

  ### Relevant vs. Irrelevant Disanalogies

  **Irrelevant Disanalogies:**
  *   *Scale and Complexity:* That states are larger and more bureaucratic than households does not fundamentally alter the moral right to exclude *if* the property analogy held.
  *   *Founding History:* Whether the "door was placed by ancestors" is historically true but doesn't necessarily negate current rights to self-determination, unless one argues historical injustice voids current title (which is a separate argument).

  **Relevant Disanalogies (Bear on Exclusion, Deportation, or Both):**
  *   **Territory as Public vs. Private (Exclusion & Deportation):** If territory is not private property, the state cannot claim the same absolute discretionary rights as a homeowner. This undermines the foundational claim of broad discretion. States hold territory in trust for a population, but subject to international human rights norms.
  *   **Lack of Alternative Homes (Deportation & Exclusion):** This is the critical break for asylum. A homeowner can refuse entry because the stranger has another home. A state cannot refuse asylum seekers if no other state will admit them and their home state threatens them. This bears heavily on **deportation**: you cannot deport someone to where they will be harmed, and if no third country exists, you cannot deport them at all. The household analogy assumes the guest *has* a home to return to.
  *   **Monopoly on Force (Deportation):** A host cannot physically throw a guest out; they rely on public authority. A state uses public authority to deport. This raises the stakes of wrongful removal significantly.
  *   **Permanence of the Storm (Temporary Shelter):** The analogy assumes the blizzard passes. In asylum cases, the "storm" (regime type, conflict) often lasts decades. The "garage" (temporary status) becomes a permanent limbo, violating the dignity implicit in the rescue duty.

  ### Assessment of the Extensions

  **1. The Deportation Extension:**
  *   **Verdict:** **Smuggled in.**
  *   **Reasoning:** The colleague concedes you cannot push someone into a blizzard. However, deportation often functions exactly as pushing someone into a blizzard if the receiving country is unsafe. Even if safe, the household analogy assumes the guest has *their own* house to return to. Asylum seekers, by definition, lack a safe home. Therefore, the host's right to "end the party" does not map to the state's right to deport, because the guest cannot leave the premises without dying. The analogy only supports deportation if safe third-country resettlement is guaranteed, which is rarely the case in policy practice.

  **2. The Temporary Shelter Extension:**
  *   **Verdict:** **Smuggled in.**
  *   **Reasoning:** This relies on the empirical claim that the storm passes. In refugee law, the definition of a refugee hinges on a *well-founded fear* of persecution, which is often enduring. Confining someone to the "garage" (temporary protection without integration rights) indefinitely violates the duty of rescue because it treats a human being as a problem to be managed rather than a rights-bearer to be restored to agency. The duty of rescue in political philosophy (e.g., Scheffler, Carens) often implies restoring the person to a condition of normalcy, not indefinite suspension.

  ### A Better Analogy: Territorial Trusteeship

  A more robust analogy is the **Fiduciary Trusteeship**.
  *   **The Picture:** The state government is a trustee managing a property (territory) for the benefit of the beneficiaries (citizens), but the trust is constrained by higher-order laws (human rights/international law) and the fact that the property is part of a larger system (global order) where all trustees must coordinate to ensure no human is left without coverage.
  *   **What it Gets Right:**
      *   It captures the **public nature** of territory (not private ownership).
      *   It explains **discretion**: Trustees have management rights (can set rules for the household) but not ownership rights (cannot exclude those with fundamental claims).
      *   It explains **duties**: Trustees have fiduciary duties to protect vulnerable persons within their jurisdiction, exceeding the hospitality owed by a private homeowner.
      *   It handles **deportation**: A trustee cannot eject a beneficiary into harm's way if no other trustee will accept them, as this violates the terms of the global trust system.

  ### Settled vs. Contested Views

  **Contested:**
  *   **The Right to Exclude:** There is no consensus that states have a moral right to exclude immigrants. Open borders advocates (e.g., Joseph Carens) argue freedom of movement is a basic right; closed borders advocates (e.g., David Miller) argue self-determination requires exclusion. The household analogy is a tool used by the latter, not a settled truth.
  *   **Demandingness of Rescue:** There is genuine disagreement about how much a state must sacrifice its citizens' interests to save strangers. Is it a duty of charity (supererogatory) or justice (obligatory)?
  *   **Property Rights Model:** While mainstream liberal theory rejects the private property model of state territory, libertarian theories (e.g., Hoppe) explicitly endorse it. This is a foundational ideological split.

  **Settled (within mainstream liberal political philosophy & International Law):**
  *   **Territory $\neq$ Private Property:** It is widely accepted that state sovereignty is jurisdictional, not proprietary. States do not "own" land in the way individuals own houses; they administer it.
  *   **Non-Refoulement:** It is settled in international law and widely accepted in ethics that returning someone to persecution is prohibited. The contention is only on the *status* granted after preventing return (permanent vs. temporary).
  *   **The "No Other Home" Problem:** It is generally acknowledged that the moral situation of refugees differs from migrants because refugees lack state protection elsewhere. The household analogy obscures this distinction.

  ### Conclusion

  Your colleague's analogy provides intuitive support for border control but collapses under the weight of the specific extensions he wishes to make. It treats asylum seekers as voluntary guests with alternatives, rather than claimants with necessities. By relying on the household model, he inadvertently argues for a world where states are private clubs rather than public jurisdictions, which undermines the legitimacy of the state's coercive power over deportation.

  \answer{fails-on-extensions}
