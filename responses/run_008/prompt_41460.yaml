answer: |-
  Here is the specification for an adequate methodology in the science of consciousness, pruned of camp-specific metaphysics and distilled into functional requirements.

  ### I. The Desiderata

  **1. Phenomenal Scope (The "Hard Cases")**
  *   **Requirement:** The method must provide a protocol for adjudicating the presence or absence of experience in subjects who cannot provide standard verbal reports (infants, non-human animals, anesthetized patients) and in subjects whose reports are known to be dissociated from processing (blindsight patients, dreamers, confabulators).
  *   **Case:** Blindsight patients deny seeing stimuli but guess correctly above chance. A method that equates "report of seeing" with "seeing" fails here. A method that equates "correct guessing" with "seeing" fails in normal vision where guessing is unnecessary. The method must navigate this dissociation without presupposing whether consciousness is defined by access or by phenomenology.
  *   **Status:** **Non-Negotiable.** A science of consciousness that only studies verbally competent, neurotypical adults is not a general science of consciousness.

  **2. Epistemic Authority (Agreement and Disagreement)**
  *   **Requirement:** The method must specify conditions under which a subject's report is treated as incorrigible (the final word) and conditions under which it is treated as a fallible behavior to be explained away.
  *   **Case:** If a subject reports pain, the method generally must accept this (to avoid behaviorism). If a subject reports a reason for a choice that psychophysics shows was made prior to the reason arising (confabulation), the method must be able to reject the report's truth value while accepting the report as data.
  *   **Status:** **Non-Negotiable.** Without a rule for when to overrule the subject, the field cannot distinguish between error and reality.

  **3. The Data/Evidence Distinction**
  *   **Requirement:** The method must rigorously distinguish between the *report* (the public data) and the *experience* (the theoretical entity the report is evidence for).
  *   **Case:** In many sciences, the measurement is distinct from the phenomenon (a thermometer reading is not heat). In consciousness research, the report is often treated as identical to the experience. The method must allow for the possibility that the report is a noisy channel, not the signal itself.
  *   **Status:** **Non-Negotiable.** Collapsing this distinction renders the science immune to falsification regarding the nature of the internal state.

  **4. Empirical Consistency**
  *   **Requirement:** The method cannot contradict robust findings from neuroscience and psychology regarding timing, capacity limits, and unconscious processing.
  *   **Case:** Any method positing that conscious experience occurs instantaneously or without neural integration contradicts established latency data. Any method positing that high-level semantic processing requires consciousness contradicts priming studies.
  *   **Status:** **Non-Negotiable.** Consciousness research is a natural science; it cannot violate the laws of the substrate.

  **5. The "What-It-Is-Like" Constraint**
  *   **Requirement:** The method must, in principle, be capable of distinguishing between a system that functions like a conscious being and a system that *feels* like a conscious being (the zombie distinction).
  *   **Case:** If a method identifies consciousness solely with information integration or global broadcasting, it must explain why that physical process entails subjective feeling, or admit it is only measuring function.
  *   **Status:** **School Preference.** This is demanded by Realists and Phenomenologists. Illusionists and Functionalists argue this requirement begs the question by assuming "feeling" is a separate property over and above function. Including it as a hard demand biases the field against deflationary accounts.

  ### II. Structural Tensions (The Impossible Triangle)

  You asked for the friction points where the desiderata pull against one another. There is a fundamental trilemma here; you can satisfy any two, but likely not all three.

  **1. The Neutrality vs. Resolution Tension (Your Hunch)**
  *   **The Conflict:** You require the method to *stay neutral* on whether experience outruns report (to handle infants/blindsight), but also to *settle what experience is like* (to be a science).
  *   **The Judgment:** These are jointly unsatisfiable without theoretical bias. To claim a non-reporting subject is conscious, you must adopt a marker (e.g., specific neural oscillations, information integration). But choosing that marker *is* a theory of consciousness. If you choose Global Neuronal Workspace markers, you might say the infant is unconscious; if you choose Integrated Information Theory markers, you might say they are conscious. There is no "neutral" arbiter. To measure experience without report is to assume a theory of what experience *is*.
  *   **Verdict:** **Incompatible.** A method cannot be both theoretically neutral and empirically decisive regarding non-reporting subjects.

  **2. The Authority vs. Fallibilism Tension**
  *   **The Conflict:** You require the method to respect first-person authority (on pain) but also to overrule it (on confabulation/blindsight).
  *   **The Judgment:** There is no principled, pre-theoretical line between these cases. Deciding that a blindsight patient is "wrong" about not seeing requires assuming that visual discrimination *constitutes* seeing. Deciding a pain patient is "right" requires assuming pain has no hidden components.
  *   **Verdict:** **Unstable.** The line between "data" and "error" is drawn by the very theory the method is supposed to test.

  **3. The Operational vs. Phenomenal Tension**
  *   **The Conflict:** The method must be operationalizable (public criteria) but must also capture the private "what-it-is-like."
  *   **The Judgment:** Public criteria inevitably measure *access* to experience, not experience itself. If you demand public verification, you risk measuring only the reportability of experience. If you demand the capture of private experience, you risk losing scientific rigor.
  *   **Verdict:** **Incompatible.** This is the Hard Problem rephrased as a methodological constraint.

  ### III. Note on Dennett's Heterophenomenology

  Dennett's heterophenomenology fares robustly on the Non-Negotiables regarding Operational Consistency and the Data/Evidence distinction, as it treats subject reports as textual data to be interpreted within a broader theoretical framework, allowing it to easily handle confabulation and blindsight without paradox. However, critics allege it cheats on the "What-It-Is-Like" constraint by effectively defining the subjective experience *as* the interpreted report, thereby dissolving the hard problem rather than solving it; it satisfies the demand for scientific tractability by pruning the requirement that the method account for private phenomenology independent of public expression.
