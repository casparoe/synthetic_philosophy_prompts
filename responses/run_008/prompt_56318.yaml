answer: |-
  Your verdicts on the scientist and benefactor are consistent under a principle of historical outlier culpability, but your tolerance for illegal destruction rests on political legitimacy rather than commemorative ethics.

  **The Principle of Contextual Integrity:** A public honorific is ethically permissible only if (1) the specific achievement being honored retains independent public value, and (2) the conduct associated with securing that achievement did not constitute a moral outlier relative to the prevailing norms of the honoree's own era; if either condition fails, the object must be removed or recontextualized as historical record rather than esteem.

  **Clause Work:**
  *   **Clause 1 (Independent Value):** This removes the Confederate general because the cause he fought for (secession/slavery) retains no positive public value, whereas the scientist's research and the benefactor's infrastructure retain utility regardless of their personal morals.
  *   **Clause 2 (Moral Outlier):** This distinguishes the scientist from the benefactor. The scientist's repugnant views were standard for his time, meaning he was not a moral outlier, whereas the benefactor's labor practices were brutal *even by the standards of his day*, marking him as an outlier whose methods exceed the excuse of historical context.
  *   **Recontextualization Proviso:** This validates moving toppled statues to museums; once the honorific function is stripped, the object serves as evidence rather than esteem, satisfying the ethical requirement without erasing history.

  **Application to New Cases:**
  *   **War Memorial with One War Criminal:** The name must be removed but the memorial can stand. The service of the group retains independent value (Clause 1), but the war criminal's conduct was a moral outlier even by the laws of war at the time (fails Clause 2), requiring specific disassociation while preserving the collective honor.
  *   **Building Named for Manufactured Reputation:** The building must be renamed. The "achievement" was fabricated by PR decades later, meaning it lacks independent public value or truth (fails Clause 1), rendering the honorific baseless regardless of the person's moral conduct.

  **Unsavable Verdict:**
  This principle cannot save your intuition regarding the **illegal destruction of the statue**. The Principle of Contextual Integrity governs the *state* of the symbol (whether it should stand), not the *process* of its removal. Your inability to condemn the illegal act relies on a theory of political legitimacy and the exhaustion of democratic channels, which is a separate ethical domain from commemorative justice; you must accept that a symbol can be unjustified while the method of its removal remains legally and procedurally problematic.
