      *   *2. Circularity:* Interventions are defined causally (I causes X, I is uncorrelated with other causes of Y). Is this vicious? Woodward says no (it's explication, not reduction).
      *   *3. Variable Relativity/Carving:* Causal claims are relative to a variable set. Is this a bug or a feature? Does it make causation mind-dependent?
      *   *4. Acyclicity/Modularity:* Structural Equation Models (SEMs) often assume acyclicity. Real systems (homeostasis, economics) have loops. Modularity (mechanisms stay same when one changes) can fail.
      *   *5. Token Causation:* Interventionism is naturally type-level. Actual causation (token) requires "path-specific" or "default/deviant" distinctions (Hitchcock, Halpern & Pearl).

  3.  **Identify Missed Objections:**
      *   *Common Cause/Confounding:* Interventionism handles this well *in principle*, but in practice, how do we know we've held the right background fixed? (Connects to #3).
      *   *Preemption/Overdetermination:* Interventionism handles late preemption better than Lewis, but early preemption and symmetric overdetermination still require tricky path-analysis.
      *   *Metaphysical Grounding:* Is causation *nothing but* manipulability? Or is manipulability evidence for a deeper metaphysical relation? (The "ontological shallowness" objection).
      *   *Time/Asymmetry:* Interventionism builds in time asymmetry via the intervention, but does it explain it?
      *   *Quantum Mechanics/Indeterminism:* How do interventions work in non-local or fundamentally probabilistic contexts?

  4.  **Evaluate Insulation/Ad Hocness:**
      *   This is the "Duhem-Quine" worry for metaphysics. If every counterexample is solved by "you chose the wrong variables," is it falsifiable?
      *   *Verdict:* It risks insulation. The constraint on "appropriate variables" needs to be independent of the causal judgments we want to save.

