      *   **Core Task:** Map the exposure of interventionism. Assess specific objections (1-5), identify missed objections, evaluate the risk of insulation/tautology, rank the defeaters, identify the strongest case against it, and highlight divergent predictions compared to Lewisian counterfactualism.
