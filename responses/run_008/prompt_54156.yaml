      *   *Omissions:* Lewis handles them easily (closest world where event happens). Interventionism struggles (what is the variable?).
      *   *Symmetry:* Interventionism handles symmetric overdetermination better (intervene on one, effect remains; intervene on both, effect changes? No, intervene on one, effect stays -> not cause? Wait, standard interventionism says if I fix C1, changing C2 changes E, so C2 is cause. If I fix C1, changing C1... wait. Overdetermination is tricky for both).
      *   *Metaphysical Commitments:* Lewis needs possible worlds. Interventionism needs manipulability/agency (or idealized agency).

  6.  **Rank the Defeaters:**
      *   *Fatal:* Variable Relativity (#3) + Insulation risk. If causation is relative to a model we choose, is it objective?
      *   *Serious:* Omissions (#1). It forces interventionists to either accept massive overgeneration or deny omissions are causes (counterintuitive).
      *   *Manageable:* Circularity (#2). Woodward admits it. It's a feature (explication).
      *   *Technical:* Acyclicity (#4) and Token Causation (#5). These are engineering problems, solvable with dynamic systems or structural models (Halpern-Pearl).

  7.  **Drafting the Response (Iterative Process):**

      *   *Introduction:* Acknowledge the sophistication. Validate the shift from Lewis to Woodward.
      *   *Assessment of the 5 Points:* Go through them one by one.
          *   *Omissions:* Strong objection. Interventionists usually bite the bullet (omissions aren't "real" causation, just explanatory) or expand variables (binary). Risk of overgeneration.
          *   *Circularity:* Woodward's standard reply. It's not reductive. It's explication. Not fatal unless you demand reduction.
          *   *Variables:* This is the big metaphysical worry. Causation becomes model-relative. Is reality model-relative?
          *   *Acyclicity:* Solvable with dynamic systems (time-slicing). Not fatal.
          *   *Token Causation:* Halpern-Pearl definitions solve this but add complexity.
      *   *Missed Objections:*
          *   *Ontological Shallowness:* It explains *testing*, not *being*.
          *   *The "Agency" Problem:* If interventions require agents, no agents = no causation? (Woodward says idealized, but still).
          *   *Common Cause vs. Direct Cause:* Distinguishing them requires knowing the graph structure beforehand.
      *   *Insulation:* Address the "variable tuning" worry. Yes, it risks being unfalsifiable if variable selection isn't constrained by non-causal facts.
      *   *Divergence from Lewis:*
          *   *Omissions:* Lewis says Yes, Interventionists say Maybe/No.
          *   *Preemption:* Interventionism wins on early preemption.
