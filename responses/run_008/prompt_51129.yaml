answer: |-
  Hi there,

  It is completely understandable that this has been rattling around in your head for months because you are dealing with one of the most persistent and annoying puzzles in logic, often called the Surprise Examination Paradox or the Unexpected Hanging Paradox. It feels airtight because each step uses valid logic, but the conclusion is obviously false since the exam can and does happen. To find the exact move that goes bad, you have to look at the transition between the students ruling out Friday and then using that ruling to rule out Thursday. The students reason that if they reach Thursday evening without an exam, they will know for certain it must be Friday. Since the teacher promised surprise, they conclude Friday is impossible. The error happens when they treat this conclusion as a stable fact that exists on Monday morning. They assume that because they can deduce Friday is impossible, they now know Friday is impossible, and therefore they can use that knowledge to analyze Thursday. But knowledge isn't static here. The teacher's promise is self-referential, meaning its truth depends on what the students know. By concluding Friday is impossible, the students have actually made Friday possible again. If they truly believe Friday is impossible, then an exam on Friday would be a surprise, which satisfies the teacher's promise. The bad move is assuming that the elimination of Friday is a piece of knowledge they can carry back to Monday to eliminate Thursday. They cannot know on Monday that Friday is impossible, because knowing that would require them to know the teacher's promise is true, but the promise's truth depends on them not knowing the day. So the first step of the induction fails because the students cannot establish the knowledge required to strike off Friday without contradicting the conditions needed to strike off Thursday. It looks fine because it mimics standard logical elimination, like solving a Sudoku puzzle, but in Sudoku the numbers don't change based on whether you know them. Here, the act of knowing changes the reality of the situation.

  Now regarding your mate, his chain of reasoning is tempting because it tries to salvage our intuition by blaming the method rather than the specific puzzle, but link (c) is the bad one where he claims that because backward induction failed here, it is unreliable full stop. This is an overgeneralization that ignores the specific ingredient that made the exam paradox toxic, which was the self-referential promise about knowledge. To see why this doesn't burn down chess or economics, you have to look at how backward induction works in those fields without the self-reference. In game theory, there is a classic setup called the Centipede Game where two players take turns deciding whether to take a pot of money or pass it to the other player, with the pot growing each time. If you reason backward from the last turn, the last player should take the money rather than pass, because passing gives them nothing. Knowing this, the second-to-last player should take the money earlier, and so on, until the logic suggests the first player should take the money immediately. In reality, people often pass for a while. Your mate might say this proves backward induction is broken everywhere, but the flaw there is usually attributed to assumptions about rationality or trust, not a logical contradiction about knowledge itself. In chess, the rules are fixed and do not depend on what the players know about the rules. A checkmate is a checkmate regardless of whether you expected it. The teacher's promise was different because it was a statement about the students' mental state regarding the statement itself. So the flaw in the exam argument does not transfer to chess or standard negotiations because those systems do not contain a rule that says the outcome must be unknown to the participants. The cost to your mate for giving up link (c) is that he has to admit logic is context-sensitive. He cannot use this paradox as a universal sceptical weapon against all future-looking reasoning. He has to concede that backward induction is valid in closed systems with fixed rules, like chess, and only fails in open epistemic systems where the rules refer to the players' knowledge of the rules. This is a significant concession because it means he can't dismiss game theory or strategic planning based on this one puzzle, but it saves him from having to believe that planning for the future is logically impossible.

  On the question of whether experts agree on the fix, the honest answer is that they do not, and it is important you know this isn't just you missing a obvious solution. There are genuinely competing camps. One group, following the philosopher W.V.O. Quine, argues that the teacher's statement is simply self-contradictory and cannot be known to be true by the students at the start. If the students cannot know the statement is true, they cannot begin the backward induction, so the paradox dissolves. Another group argues that the concept of surprise is vague or context-dependent, meaning what counts as expected changes as the week progresses, so the logic shifts mid-week. A third group focuses on the definition of knowledge itself, suggesting that even on Thursday night, the students do not strictly know the exam is on Friday because knowing it would make it false, so they never have the certainty required to rule out the day. The debate is still active because each solution requires giving up something intuitive, either about how language works, how knowledge works, or how logic applies to time. I lean towards the Quinean view that the statement cannot be known to be true at the outset. This seems the most robust because it preserves standard logic and backward induction for everything else, like chess and science, while isolating the problem to this specific kind of self-referential announcement. It costs us the ability to treat the teacher's promise as a known fact, but that feels like the right price to pay. If the teacher says something that logically prevents you from knowing it is true, then you simply don't know it is true, and without that knowledge, the chain of reasoning never starts. This allows the exam to happen on Wednesday surprisingly, not because the logic of elimination was wrong, but because the premise required to start the elimination was never securely held in the first place.

  I hope this helps untangle the knot enough to let you sleep a bit better. It is a rare thing for a puzzle to survive this long in philosophy, so you are in good company with your confusion.

  Best wishes
