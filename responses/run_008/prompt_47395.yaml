answer: |-
  ### (1) The name

  Yes, your friend is not making stuff up. The relation she is describing has an established term of art in contemporary metaphysics: **grounding** (or **metaphysical grounding**). When philosophers say that fact A *grounds* fact B, they mean that B obtains *in virtue of* A. It is the relation of non-causal determination. While the concept has roots in Aristotle's theory of explanation and Spinoza's *causa sui*, it has exploded into a distinct sub-field over the last fifteen years, championed by philosophers like Kit Fine, Gideon Rosen, and Jonathan Schaffer. Your friend's intuition that this "because" is distinct from causation and distinct from mere logical entailment is the exact starting point of the modern literature on grounding.

  ### (2) What it isn't

  To understand grounding, you have to carve it away from its neighbors, which is precisely where your friend was struggling to articulate the boundaries.

  **Causation:** Causation is typically diachronic (happens across time) and relates events (the cue ball *striking* the eight ball). Grounding is typically synchronic (happens at a time) and relates facts or states of affairs (the ball is scarlet *at this moment* grounds the fact that it is red). Causation makes things *happen*; grounding makes things *be*. If you remove the cause, the effect might not occur later; if you remove the ground, the grounded fact cannot obtain *now*.

  **Logical Consequence:** This was the crux of your chess example. Logical entailment is too "cheap" because it is monotonic and insensitive to relevance. As your friend noted, "Checkmate" entails "Checkmate or Not-Checkmate," but the disjunction doesn't explain the specific state. Logic preserves truth; grounding transmits reality. Furthermore, entailment is often symmetric in a way grounding is not. If A entails B, and B entails A (as with necessary truths), logic sees them as equivalent. Grounding insists on directionality: Socrates exists grounds {Socrates} exists, but not vice versa, even if they necessarily co-exist. Grounding is *hyperintensional*: it cares about *how* the truth is constituted, not just that it is true.

  **Reduction and Identity:** You might think grounding is just reduction (chemistry *is* physics). But many grounding theorists deny identity. The crowd *is* the people, but the *fact* that there is a crowd is distinct from the *fact* that these people are standing here. Reduction often suggests we can eliminate the higher-level talk (there are no crowds, only people). Grounding allows the higher-level fact to be real, just dependent. It validates the hierarchy without eliminating the layers.

  **Supervenience:** Supervenience says there can be no difference in the higher level without a difference in the lower level (a modal correlation). But supervenience doesn't tell you *why* they covary. Grounding is the "in virtue of" relation that *explains* the supervenience. The chemistry supervenes on the physics *because* the physics grounds the chemistry.

  ### (3) The floor

  On the question of the "floor" (whether the chain of grounds must stop at a fundamental level), you were technically correct, but your friend was philosophically motivated. The claim that there must be a fundamental level is called **metaphysical foundationalism**. The claim that there *is* a grounding relation is separate from the claim that **grounding chains must terminate**.

  It is logically coherent to accept grounding while denying a floor. This position is called **metaphysical infinitism** (chains go on forever) or **coherentism** (chains loop back on themselves). Nothing in the definition of grounding itself forbids an infinite regress. You can say A is grounded in B, B in C, C in D, ad infinitum, and still maintain that each step is a valid grounding relation. Therefore, the "floor" is a **substantive addition**; it does not fall out of the relation for free.

  However, your friend's insistence that the floor is "the whole point" reflects a dominant view in the literature: that without a foundation, explanation is never completed. If everything is grounded in something else, nothing is ever *fully* explained; the buck never stops. Many philosophers argue that while infinitism is logically possible, it is explanatorily unsatisfying. So, while you were right that the relation doesn't *require* a floor by definition, she was right that for many theorists, the *purpose* of positing grounding is to map the structure of reality down to its fundamental bedrock. If you remove the floor, you keep the relation, but you might lose the promise of a complete metaphysical explanation.

  ### (4) Who won

  This was a split decision, but your friend takes the main prize. She correctly identified a real, robust philosophical distinction that you initially dismissed as "just logic" or "just words." The relation of grounding is widely accepted as a sui generis feature of reality, not merely a linguistic habit. You were right, however, on the secondary point: the existence of the relation does not logically compel the existence of a fundamental "floor." That is a separate structural hypothesis about the world. She won on the nature of the "because"; you won on the architecture of the "chain."
