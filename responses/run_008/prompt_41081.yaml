answer: |-
  Here is a brainstorming map of the concepts we need to juggle, followed by the detailed breakdown you asked for.

  ### The Moving Parts (Brainstorm)

  Before we lock in answers, here is the landscape of the problem as a philosopher of physics sees it.

  *   **Microstates vs. Macrostates:** Your simulation tracks exact positions/momenta (microstate). "Entropy" applies to coarse-grained buckets of microstates that look the same to us (macrostate).
  *   **Phase Space Volume:** Low entropy = tiny volume of phase space. High entropy = massive volume.
  *   **Trajectories:** A line through phase space. The laws dictate the shape of the line; they don't care about the direction.
  *   **Typicality:** If you pick a random point in a high-entropy macrostate, almost all trajectories lead to *higher* entropy (or stay there). Only a vanishingly small subset lead to lower entropy.
  *   **The Boundary Condition:** To get a directed arrow, you must constrain one end of the trajectory (the Past) to be in a tiny volume.
  *   **The Record:** A physical subsystem (hard drive, brain) whose state correlates with another system's state *at a different time*.
  *   **The Asymmetry:** Why does the correlation allow inference in one direction but not the other?

  ---

  ### Confusion 1: Is the Past Hypothesis an Explanation or a Restatement?

  You hit the nail on the head. Your intuition that "the universe started low entropy" sounds like "the coffee started hot" is philosophically astute.

  **The Consensus View:**
  It is settled that *some* boundary condition is required. The microscopic laws are (effectively) time-symmetric. CP-violation in weak interactions exists, but it is far too weak and rare to account for the thermodynamic arrow of macroscopic systems like coffee cups or stars. If you run the movie backward, the laws hold. Therefore, the asymmetry must come from the *contours* of the history, not the *rules* of the motion.

  **The Philosophical Fight:**
  Is the **Past Hypothesis (PH)** a *law* or a *brute fact*?

  1.  **The "Brute Fact" Camp:** Many physicists feel exactly as you do. Saying "the universe started low entropy" is just pointing at the thing that needs explaining. It stops the regress, but it doesn't explain *why* that boundary condition obtained. It's a contingent fact, like "the Earth has one moon."
  2.  **The "Lawhood" Camp (e.g., David Albert, Barry Loewer):** They argue we should promote PH to a law of nature. Why? Because in the "Best System Account" of laws (a dominant philosophical view), a law is a rule that helps you compress the description of the universe.
      *   Without PH: You have to list every particle's position at $t=0$ to explain why entropy increases.
      *   With PH: You just say "Low Entropy at $t=0$ + Dynamics."
      *   Because PH massively simplifies the description of the world's history, it earns the title of "Law."

  **Does calling it a Law do work?**
  *   **Yes:** It justifies using the Past Hypothesis to make predictions. If it's just a random fact, why should we trust it to hold for inference? If it's a law, it supports counterfactuals (e.g., "If the Big Bang had been slightly different, entropy would still likely increase").
  *   **No:** It doesn't explain *mechanistically* why the universe started that way. It just codifies the requirement.

  **Verdict:**
  *   **Settled:** We need a low-entropy boundary condition to get the arrow.
  *   **Contested:** Whether PH is a "law" or a "brute fact." (Humeans/Albert say Law; others say Brute Fact).
  *   **Contested:** Whether PH is the *ultimate* explanation. Some quantum gravity theorists hope a future theory of the Big Bang will *derive* the low entropy state dynamically, making PH redundant. Currently, no such theory is confirmed.

  ---

  ### Confusion 2: Records, Correlations, and the Epistemic Arrow

  This is the harder problem, and your engineering intuition about mutual information is correct: **Correlation is symmetric.** $I(Past; Present) = I(Future; Present)$.

  So why can I read a log file to see what happened, but not to see what *will* happen?

  **The Trap:**
  You are thinking of the record as a static correlation. But a record is not just a correlation; it is a **reliable inference device**.

  **The Mechanism (Step-by-Step):**
  Imagine your log file. To write a line to the log, your CPU changes the state of the disk.
  1.  **Overwriting:** To write new data, you usually have to erase old data (or move to a fresh sector). Landauer's Principle tells us erasing information dissipates heat.
  2.  **The Entropy Dump:** The process of creating the record increases the entropy of the environment (heat goes into the chassis/air).
  3.  **The Asymmetry of Inference:**
      *   **Inferring Past:** I look at the log. I assume the **Past Hypothesis** (the system started ordered). Given the current log state + PH + Dynamics, the probability that the log reflects a past event is near 1.
      *   **Inferring Future:** I look at the log. To infer the *future* from the log, I would need to assume a **Future Hypothesis** (the universe ends in a low entropy state). I do not have that. I assume the future is high entropy (equilibrium).
      *   If I assume the future is high entropy, the correlation between "Log State" and "Future Event" washes out. The log state is compatible with *many* future trajectories, but only *one* past trajectory (because the past was constrained).

  **The "Fork" Asymmetry (Reichenbach):**
  *   **Past $\rightarrow$ Future:** One cause (explosion) creates many effects (shrapnel, sound, light, heat). These effects are correlated with each other because they share a common cause. This creates a "fork" opening toward the future.
  *   **Future $\rightarrow$ Past:** We do not see "anti-forks" where many independent past events converge to determine a single future event *without* a prior correlation.

  **Why the mirror image doesn't happen:**
  You asked for the level of "here's a copy operation."
  *   **Forward Copy:** System $A$ (data) interacts with System $B$ (blank disk). Environment $E$ absorbs heat. $A$ and $B$ become correlated. $S(E)$ increases. This is allowed because total entropy rises.
  *   **Backward Copy (The Mirror):** System $B$ (disk) interacts with $A$ to *uncorrelate* them, returning $B$ to blank and $A$ to data, while $E$ *absorbs* heat (cooling the environment).
  *   **Why it fails:** This requires the environment to be in a very specific state to absorb the order. In our universe, the environment is high-entropy thermal noise. It cannot "accept" order spontaneously. It can only accept disorder.
  *   **Conclusion:** Records are physical structures that are stable *because* the environment is high entropy. They are "islands of low entropy." They persist into the future, but they were *created* by a process that relied on the entropy gradient from the past.

  **Verdict:**
  *   **Settled:** The reliability of records depends on the entropy gradient.
  *   **Contested:** Whether this *fully* reduces to thermodynamics.
      *   **Camp A (Albert/Loewer):** Yes. Given PH + Dynamics, the probability of records being reliable about the past is high, and about the future is low.
      *   **Camp B (Huw Price):** No. They argue we smuggle the asymmetry in when we decide which probabilities to calculate. They claim the "deliberative arrow" (we decide now to affect the future) is primitive and not fully explained by entropy.

  ---

  ### The Boltzmann Fluctuation Hypothesis

  You asked if Boltzmann's original idea is dead.

  **The Idea:** The universe is eternal and mostly in equilibrium. Occasionally, by random chance, entropy fluctuates down. We just happen to live in one of those fluctuations.

  **The Status:** **Effectively Dead.**

  **The Reason (The Boltzmann Brain Problem):**
  Fluctuations are probabilistic. Small fluctuations are vastly more common than large ones.
  *   It is exponentially more likely for a fluctuation to create **one single conscious brain** (with false memories of a universe) than to create **an entire ordered universe** with billions of galaxies and history.
  *   If the Fluctuation Hypothesis were true, you should statistically expect to be a "Boltzmann Brain" popping into existence for a second, not an engineer with a consistent history of physics simulations.
  *   Since you *are* an engineer with a consistent history, the hypothesis predicts your existence is incredibly unlikely. It is self-undermining.

  **Verdict:**
  *   **Consensus:** The simple Boltzmann Fluctuation scenario is rejected because it makes the wrong prediction about typical observers.
  *   **Nuance:** Some multiverse theories try to revive this by weighting probabilities differently, but in standard statistical mechanics, it's a dead end.

  ---

  ### Summary: Settled vs. Contested

  | Claim | Status | Notes |
  | :--- | :--- | :--- |
  | **Micro-laws are Time-Symmetric** | **Settled** | CP-violation exists but is irrelevant for thermodynamics. |
  | **2nd Law is Statistical** | **Settled** | Entropy decrease is possible but improbable for macro-systems. |
  | **Need for Past Hypothesis** | **Strong Consensus** | Without a low-entropy boundary, no arrow emerges. |
  | **PH is a "Law"** | **Contested** | Albert/Loewer say Yes (Best System); others say No (Brute Fact). |
  | **Records reduce to Entropy** | **Contested** | Mainstream view says Yes; Price/anti-reductionists say No. |
  | **Boltzmann Fluctuations** | **Mostly Rejected** | Fails the "Boltzmann Brain" test. |
  | **Quantum Gravity Solution** | **Open** | Hope that a theory of the Big Bang derives PH dynamically. |

  ### Final Thought for the Engineer

  You mentioned: *"It smells like a boundary condition getting promoted to an explanation."*

  In physics, this is often where we stop. General Relativity doesn't explain *why* mass curves spacetime; it posits it as a law. The Past Hypothesis might be the "Initial Value Problem" of cosmology. It is the "input" to the simulation of the universe.

  As an engineer, you know that if you run a deterministic simulation, the output behavior is entirely determined by the code (laws) and the seed (initial state). If the code is symmetric but the output is asymmetric, the asymmetry *must* be in the seed. Asking "why the seed?" is a valid question, but it might be a question for a different layer of reality (multiverse? quantum cosmology?), not for statistical mechanics itself.

  The "explanation" statistical mechanics offers is: **Given this seed, the arrow is inevitable.** It doesn't explain the seed, but it explains why the seed implies the coffee cools and the log file records the past.
