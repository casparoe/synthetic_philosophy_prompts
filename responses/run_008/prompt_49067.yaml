  3. Empirical documentation of sustained altruism evolving between genetically distinct groups where the cost to individual gene propagation is never offset by inclusive fitness or reciprocal benefits. You would probably dismiss this as cryptic kin selection, but if genetic tracking definitively rules out shared alleles, the gene-centric explanation collapses.
  4. Establishment that heritable adaptive traits can spread through populations via epigenetic or cultural mechanisms without any underlying change in DNA sequence frequency. You might argue these are still "replicators" analogous to genes, but if the physical substrate of inheritance is fundamentally different and independent, the "selfish gene" becomes metaphorically empty.
  5. A specific evolutionary trajectory where gene-frequency modeling fails to predict outcomes that are accurately predicted by modeling selection at the organism or group level. You would try to explain this away by adding complex gene-gene interactions, but if the model requires such ad hoc adjustments to match simpler higher-level models, the gene perspective loses its parsimony.
