      *   *Tension B (3 & 4):* Free parameter risk function vs. No exploitation. If risk attitudes vary freely, some might be extreme enough to invite dynamic inconsistency unless constrained. But 4 says exploitation is forbidden. This is manageable if the framework ensures dynamic consistency for *any* risk function.
      *   *Tension C (2 & 5):* REU for self vs. EU for others. Why the switch? If REU is the *right* framework for rationality (Claim 2), why is it wrong for impartial ethics (Claim 5)? Claim 5 says risk attitude drops out for officials. Claim 2 says risk attitude is part of rational evaluation. This looks like a dualism problem.
      *   *Tension D (1 & 3):* Normativity vs. Free Parameter. If theory is normative (1), does allowing any risk function (3) weaken normativity? Usually, normativity allows parameters (utility), so this is likely stable.
      *   *Tension E (5 & Ex Ante Pareto):* Ex ante Pareto + REU for individuals vs. EU for society. If individuals are REU maximizers (Claim 2 & 3), and we accept ex ante Pareto (Claim 5), does social EU maximization respect individual REU preferences? Often, aggregating REU preferences via ex ante Pareto leads to social preferences that violate EU or require specific weighting. Claim 5 says official must maximize Expected Total Welfare (EU). If individuals have REU preferences, satisfying ex ante Pareto might conflict with maximizing Expected Total Welfare (unless welfare is defined linearly).

