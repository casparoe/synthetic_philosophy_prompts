answer: |-
  You have put your finger on one of the most profound structural tensions in the common law system. Your observation is astute: the ritual of the oath promises a theological or moral absolute ("the whole truth"), while the operational rules of the trial and the substantive law of perjury enforce a much narrower, linguistic standard ("nothing but the truth" in a literal sense).

  To answer your question directly: The legal system does not rest on a **moral** theory of the lying/misleading distinction. It rests on a **procedural and epistemic** theory. The system presupposes that truth in a legal context is not a substance to be poured out by a witness, but a structure to be built through adversarial testing.

  Here is a reconstruction of what this cluster of practices presupposes, an analysis of their consistency, and a projection of what would happen if the distinction collapsed.

  ### I. The Underlying Theory: The Division of Epistemic Labor

  The system you describe relies on a specific allocation of responsibility known as the **Adversarial Division of Labor**.

  1.  **The Witness's Duty (Quality Control):** The witness is responsible for the *quality* of the data points they provide. They must not introduce corrupt data (literal falsehoods). This is the domain of *Bronston* and perjury law. The law assumes a witness can control whether a statement corresponds to reality.
  2.  **The Lawyer's Duty (Quantity and Context):** The lawyer (specifically the examiner) is responsible for the *quantity* and *context* of the data. It is the questioner's job to define the scope of the inquiry. If the answer is technically true but misleadingly narrow, the procedural rule assumes the examiner is skilled enough to detect the evasion and ask the follow-up.
  3.  **The Trier of Fact's Duty (Synthesis):** The jury is responsible for synthesizing the data, including weighing the credibility of evasions.

  **Why this distinction?**
  The legal system prioritizes **verifiability** over **completeness**.
  *   **Literal Falsehood:** Can be proven objectively. Either the bank account existed or it did not. This makes it suitable for criminal punishment (perjury), which requires proof beyond a reasonable doubt.
  *   **Misleading Truth:** Is subjective and context-dependent. Determining whether a witness *intended* to mislead by omitting context requires mind-reading. As the *Bronston* court noted, the remedy for a non-responsive answer is "further questioning," not prosecution. To criminalize misleading implications would chill testimony, as witnesses would fear prosecution for ambiguous phrasing.

  Therefore, the "Whole Truth" clause in the oath is not a literal command to volunteer all information; it is a normative command not to *corrupt the record* by omission when directly asked. It is a shield against active deception, not a sword for compelled disclosure.

  ### II. Is the System Consistent?

  You asked if the system is close to self-contradictory. It is **functionally consistent**, though **ritually hypocritical**.

  It is ritually hypocritical because the oath uses language ("the whole truth") that suggests a duty of full disclosure, which the rules of evidence (e.g., "answer only the question asked") explicitly negate.

  However, it is functionally consistent because both the oath and the perjury rule serve the same master: **The Integrity of the Record.**
  *   If witnesses could lie (literal falsehoods), the record is corrupted beyond repair. Cross-examination cannot fix a lie if the jury believes it.
  *   If witnesses are forced to volunteer "the whole truth" without prompting, the record becomes chaotic, prejudicial, and unmanageable. Relevance rules (FRE 401-403) exist specifically to *exclude* parts of the "whole truth" that are distracting or prejudicial.

  The reconciliation principle is this: **The oath binds the conscience of the witness against falsification; the rules of procedure bind the lawyers against ambiguity.** The system tolerates misleading implications because it views them as a puzzle for the adversary to solve, whereas it views literal lies as a poison for the well itself.

  ### III. What If the Distinction Collapsed?

  Suppose we adopted the philosophical view that misleading with literal truth is morally and legally equivalent to lying. This would require a fundamental restructuring of American law. Here is what concretely would have to give:

  #### 1. Perjury Law Would Become Unworkable (or Inquisitorial)
  Currently, perjury requires a false statement of *material fact*. If "intent to mislead" became the standard:
  *   **The End of *Bronston*:** A witness could be prosecuted for answering "My company had an account" when they knew the questioner wanted to know about *their* account.
  *   **Proof Problems:** Prosecutors would have to prove the witness's subjective understanding of what the questioner *meant* versus what they *asked*. This turns perjury trials into metaphysical debates about conversational implicature (Gricean maxims) rather than factual disputes.
  *   **Chilling Effect:** Witnesses would refuse to testify without immunity, fearing that any ambiguity could be later construed as a criminal attempt to mislead.

  #### 2. Negotiation Ethics Would Shift from Caveat Emptor to Fiduciary
  Currently, Model Rule 4.1 prohibits false statements of material fact but allows "puffery" and withholding of bottom lines.
  *   **Duty of Candor:** If misleading = lying, a lawyer could not say "My client will not accept less than $100k" if they would actually take $90k. This is literally true (at that moment) but intended to mislead about the settlement range.
  *   **Consequence:** Settlement rates would likely drop. Negotiation relies on a certain amount of strategic opacity to find a zone of agreement. A general duty of candor would turn every negotiation into a disclosure proceeding, resembling the duties between insured and insurer that you noted.

  #### 3. The Adversarial Trial Would Collapse into an Inquisition
  This is the most significant structural change. The adversarial system runs on the premise that truth emerges from the clash of partial narratives.
  *   **Role of Counsel:** If witnesses had a duty to volunteer the "whole truth" regardless of the question, the lawyer's role in direct examination would vanish. The witness would simply tell their story. Cross-examination would become less about trapping inconsistencies and more about arguing over why the witness didn't volunteer enough.
  *   **Judge's Role:** To enforce a "no misleading" standard, the judge would have to intervene constantly to ensure witnesses aren't technically complying while substantively evading. This moves the system toward the **Civil Law (Inquisitorial) Model**, where the judge is responsible for uncovering the truth, rather than the **Common Law (Adversarial) Model**, where the parties are responsible for presenting it.
  *   **Efficiency:** Trials would become exponentially longer. The "answer the question asked" rule is a time-management tool as much as a truth-seeking one.

  ### IV. Conclusion: The Pragmatic Compromise

  The cluster of practices you identified presupposes that **the law is a game of limited information.**

  It strictly requires that **literal falsifiability** remain the bright line for criminal liability. It sits comfortably with the idea that **civil liability or procedural sanctions** (like striking testimony or instructing the jury to draw an adverse inference) are the proper remedies for misleading conduct.

  The system is not trying to maximize "Truth" in the abstract; it is trying to maximize "Adjudicative Accuracy" within a framework of human fallibility and limited resources. It accepts that some misleading impressions will stand because the cost of rooting them out (criminalizing ambiguity, forcing full disclosure) is higher than the cost of letting skilled lawyers expose them.

  If you conclude that misleading is morally equivalent to lying, you are logically committed to dismantling the adversarial system as we know it. You would need a system where the state (or the judge) has a duty to investigate, rather than a system where the state provides a neutral arena for parties to fight. The oath, as it stands, is a relic of a time when truth was seen as a divine duty; the rules of evidence are the modern machinery that acknowledge truth is a human construction. The tension you feel is the friction between the ritual and the machine.
