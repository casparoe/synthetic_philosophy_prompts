answer: |-
  Your diagnosis is remarkably sharp. You have effectively reconstructed the current state of the art in the analytic literature on this topic without necessarily having read the specific papers. You are right that the debate has fractured, and your "two debates wearing one trench coat" theory is largely correct, though I think there is a third layer hidden inside the moral question that might explain the stubbornness of your group.

  Here is a breakdown of why your diagnosis holds, where it might need nuance, and what could actually constitute progress.

  ### 1. Validating Your Diagnosis: The Normative Shift
  You are correct that the philosophy-of-language project (defining the distinction) and the ethical project (weighing the distinction) have come apart.
  *   **The Language Project:** Most contemporary philosophers (following Grice, and refined by people like Jennifer Saul and Don Fallis) agree there *is* a distinction. Lying involves an explicit assertion of what one believes to be false; misleading involves implying it while asserting something true. The taxonomy is stable.
  *   **The Moral Project:** This is where your group is stuck. You identified the crux: **First-order consequences vs. Second-order norms.**
      *   **The Deniers (Consequentialists/Outcome-Focused):** They look at the *illocutionary uptake*. The hearer ends up with a false belief. The harm is identical. Therefore, the wrong is identical. To them, the assertion/implicature distinction is a linguistic technicality with no moral mass.
      *   **The Defenders (Deontologists/Practice-Focused):** They look at the *norm of assertion*. When you assert, you invite the hearer to trust your word *as a guarantee*. When you mislead, you invite them to trust their own inference. The Defender argues that violating the specific norm of assertion damages the "practice of truth-telling" itself (a second-order harm), whereas misleading leaves the norm of assertion intact, even if it abuses the Cooperative Principle.

  Your intuition that this is a proxy war over **constitutive norms** is spot on. Jennifer Saul's work (*Lying, Misleading, and What is Said*) argues exactly this: lying is worse because it corrupts the specific social tool of assertion, which we rely on for the transmission of knowledge. If your group accepts that social practices have intrinsic normative weight (not just instrumental value), the Defenders win. If they view language purely as a tool for information transfer where only the payload matters, the Deniers win.

  ### 2. The Missing Layer: Agency and Responsibility
  There is a third element you hinted at with the "mental reservation" comment, which is distinct from the "social trust" argument. This is the **Agency/Responsibility Distribution** argument.

  *   **The Defender's Hidden Claim:** It isn't just about social trust; it's about *epistemic agency*. When I lie, I usurp your agency. I dictate the content of your belief directly. When I mislead, I leave you the "final inferential work." I have made it *possible* for you to be deceived, but you have collaborated in the deception by making the inference.
  *   **The Denier's Counter:** This is victim-blaming. If I rig a trap so that you *must* infer the false thing to survive, saying "you pulled the lever yourself" is sophistry.

  This explains the "bedrock intuitions" you mentioned. The Defenders feel that moral responsibility is attached to the *act of commitment*. The Deniers feel moral responsibility is attached to the *causal chain of belief formation*. These are fundamentally different conceptions of moral responsibility, which is why no amount of case-studies will move them.

  ### 3. Is it an Empirical Question?
  You asked if this is a hidden empirical question about getting caught.
  *   **Generally, No:** Most participants in this debate are interested in *intrinsic* wrongness, not *prudential* wrongness. Whether you get caught is irrelevant to whether the act was immoral in the moment.
  *   **Exception:** If the argument is about *trust erosion*, it becomes partially empirical. Does a society where people routinely mislead suffer the same trust decay as a society where people lie? Some argue misleading is *more* corrosive because it creates plausible deniability, making it harder to police. But usually, the "getting caught" argument is a red herring in this specific philosophical context.

  ### 4. What Counts as Progress?
  If you keep pumping intuitions (e.g., "What about the murderer at the door?"), you will stay stuck. Everyone already knows their intuition. Progress requires shifting the framework. Here are three paths forward for your group:

  **A. Shift from "Wrongness" to "Wrongmaking Features"**
  Stop asking "Is lying worse?" and ask "What specific duty is violated in lying that is not violated in misleading?"
  *   Is it a duty of *non-interference*? (Deniers say both interfere equally).
  *   Is it a duty of *fidelity*? (Defenders say assertion creates a specific promise that implicature does not).
  *   **Progress Condition:** If the Defenders cannot articulate a duty that is breached *only* by assertion, their position collapses into "assertion feels ickier." If the Deniers cannot explain why we have a specific norm of assertion at all, their position collapses into radical consequentialism.

  **B. The "Salience" Compromise (The Contextualist Move)**
  Introduce the idea that the distinction is **context-dependent**.
  *   In high-stakes legal or formal contexts, the norm of assertion is rigid. Lying is much worse because the guarantee is explicit.
  *   In casual conversation, Gricean implicature is the primary mode of communication. Misleading might be just as bad because the "guarantee" is looser.
  *   **Progress Condition:** This allows both sides to be right in different domains. It moves the debate from "Which is universally worse?" to "Under which normative frameworks does the distinction track moral weight?"

  **C. Attack the "Guarantee" Premise**
  The Defenders rely on the idea that assertion = guarantee of truth.
  *   **Challenge:** Do we actually guarantee truth, or do we guarantee *sincerity*? If I assert $P$ believing $P$, but $P$ is false, I haven't lied. So the guarantee is about my mental state, not the world.
  *   If the guarantee is only about sincerity, then the Misleader is also being insincere (they intend to deceive). So the "broken guarantee" argument might fail even on its own terms.
  *   **Progress Condition:** This forces the Defenders to refine their philosophy of language. They need to argue that assertion carries a *warranty of truth*, not just sincerity. (See: Timothy Williamson's Knowledge Norm of Assertion).

  ### Recommended Reading to Break the Deadlock
  To move past the stalemate, assign one of these specific papers. They map exactly onto the rift in your room:

  1.  **Jennifer Saul, "Lying, Misleading, and What is Said" (2012):** She defends the view that the distinction *is* morally significant because of the norms of assertion. This arms the Defenders with a rigorous argument beyond "clean hands."
  2.  **Don Fallis, "What Is Lying?" (2009) & "The Ethics of Lying and Misleading" (2013):** Fallis is great at dissecting the "intent to deceive" vs. "assertion" criteria. He often leans toward the Deniers' view that the moral difference is negligible.
  3.  **Thomas Carson, "Lying and Deception" (2010):** Carson argues that the definition of lying requires an explicit warrant of truth. This helps clarify the "guarantee" point.
  4.  **James Mahon, "The Definition of Lying and Deception" (SEP Entry):** A good overview of the taxonomy to ensure you actually agree on the definitions (you think you do, but often groups disagree on whether "implicature" counts as "saying").

  ### Summary
  Your diagnosis is correct. The stalemate is not about the cases; it is a **meta-ethical clash** between those who view moral weight as residing in *outcomes* (false beliefs) and those who view it as residing in *relational norms* (the specific contract of assertion).

  **To make progress:** Stop trying to prove one side right. Instead, ask the Defenders to justify why the "norm of assertion" has moral gravity independent of its consequences, and ask the Deniers to explain why we have a distinct concept of "lying" at all if it carries no distinct moral weight. If they can't answer those, the debate is indeed just intuition pumps. If they can, you'll find the real philosophical engine underneath.
