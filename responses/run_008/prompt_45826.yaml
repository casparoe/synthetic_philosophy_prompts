answer: |-
  The quarter spun on the granite countertop, a silver blur humming against the stone. Elena watched it without breathing, not because she cared about the outcome, but because she loved the hum. It was the sound of a question being asked without words.

  Heads, they would walk to the pier. Tails, they would drive to the canyon. Both were ten miles away. Both offered air and water, one salt and one fresh. To Elena, they were identical weights on a scale that had long since lost its calibration.

  The coin wobbled, flattened, and died. Heads.

  "Pier it is," Elena said, reaching for her sunglasses.

  Her daughter, Claire, stood in the doorway of the kitchen, arms crossed. She had been watching the spin with a tightness around her mouth that suggested physical pain. "You didn't even think about it," Claire said.

  "It's a dead zone," Elena replied, slipping her feet into her sandals. "Ten miles, nice weather, no cost difference. Deliberation is a tax on the irrelevant."

  "It's not irrelevant. It's your Saturday. It's *my* Saturday."

  "Then you choose."

  "I can't," Claire said, the frustration leaking into her voice. "Because I know if I choose the canyon, you'll wonder if you preferred the pier, and if I choose the pier, you'll resent me for overriding your system."

  Elena picked up the quarter and pocketed it. "I don't resent the coin, Claire. The coin has no agenda."

  They walked out to the car. The neighborhood was quiet, lined with jacarandas that dropped purple bruises on the hoods of parked cars. Elena loved this street. She loved the way the light hit the stucco at four in the afternoon. She had lived here for twelve years. She had arrived here because a dodecahedron die had landed on a number corresponding to a list of West Coast cities she'd typed out on a whim.

  Sometimes, looking at the bougainvillea spilling over her fence, she felt a surge of affection so strong it brought tears to her eyes. Other times, usually when Claire was visiting, she felt like a tenant occupying a room assigned by a random number generator. Was the love real? Or was it just the sediment of time, the calcification of habit? If the die had rolled differently, would she be looking at pine trees in Oregon right now, feeling the exact same swell of belonging?

  If the answer was yes, then nothing here was hers. Not the house, not the view, not the life.

  At the yard sale down the block, Claire stopped at a box of paperbacks. She riffled through them, her fingers moving with the same anxious precision she applied to everything. She pulled one out. The cover was faded, a cartoonish illustration of a grey donkey standing between two piles of hay.

  "Look at this," Claire said, holding it up. "It's that thing you do. The donkey."

  Elena glanced at it. "I don't know what you mean."

  "Buridan's Ass. The philosophy puzzle. The donkey starves because it has no reason to pick left or right." Claire tapped the cover. "You're the donkey, Mom. But instead of starving, you just let someone else push you."

  "I eat just fine."

  "You know what I mean." Claire put the book back, but she kept her hand on it. "I found your logs, by the way. In the drawer. The ones where you record the flips."

  Elena stiffened. "Those are private."

  "They're just dates and outcomes. *March 4: Job A vs. Job B. Tails.* *June 12: Red Sofa vs. Blue Sofa. Heads.*" Claire's voice trembled. "There are hundreds of them. Mom, you let a piece of metal decide where you worked for five years."

  "I liked that job."

  "Did you? Or did you just get used to it?" Claire stepped closer, the book forgotten. "I spent nine months choosing a mattress. Nine months. I read the studies on spinal alignment. I tested the foam density. I lay on them in the store until the salespeople asked me to leave. When I finally bought one, I knew it was mine. I knew I wanted it."

  "And?"

  "And you asked me why I needed a new one at all." Claire's eyes were bright, wet with a frustration that had been accumulating since childhood. "You look at me like I'm crazy for wanting to be sure. But I think you're crazy for not caring. You never wanted anything. Not really. You didn't even want to leave Dad. You just waited until the house burned down around you."

  That was the old wound. The two years before the divorce, Elena had paced the kitchen floor, weighing the misery of staying against the terror of leaving. The scales had balanced perfectly. Fear of loneliness equaled fear of stagnation. Love had cooled to lukewarm indifference, which was indistinguishable from hate in the dark. She had waited for a sign, a surge of anger, a definitive reason. None came. So she had stayed, until her husband packed a bag one Tuesday and said he'd met someone. He hadn't noticed her decision because she hadn't made one.

  After he left, she had made the rule. No more dead zones. If reason couldn't distinguish the options, then reason was irrelevant. Let chance decide. Save the will for the things that actually mattered.

  "Come on," Elena said. "We're wasting time. The pier awaits."

  "I'm not going to the pier," Claire said. "I want to go to the canyon."

  "Then drive."

  "I want *you* to want to go to the canyon."

  Elena looked at her daughter. She saw the same face she had seen in the mirror for thirty years, but arranged differently. Claire's features were set in a permanent furrow of evaluation. She was always calculating, always measuring the distance between desire and outcome. She was the donkey, Elena realized. Claire was the one starving, paralyzed by the symmetry of the haystacks, convinced that if she just stared long enough, one pile would reveal itself as superior.

  Elena felt a sudden, sharp preference. She wanted to go to the canyon. She wanted to see the dry heat, the scrub brush, the hawk circles. She wanted to prove to Claire that she could want something. The feeling was physical, a pull in her chest, a specific hunger for the smell of sage.

  It was a real preference. It had come from nowhere, unbidden, uncalculated. It broke the symmetry.

  For a moment, the world sharpened. The coin in her pocket felt heavy, dead. She didn't need it. She could speak. She could say, *Let's go to the canyon.* She could claim this desire as her own, validate Claire's years of agonizing by showing that agency was possible, that one could simply *know*.

  If she said it, she would be admitting that the last twelve years of coin flips were a sham. That she *could* have chosen the city, the job, the sofa. That she had been hiding from the burden of ownership, not liberating herself from the burden of indecision.

  But if she said it, she would also be admitting that Claire was right: that the deliberation, the suffering, the nine months on a mattress, was the only way to find the truth of oneself. That the coin was a lie.

  Elena looked at the car. She looked at Claire, who was waiting, desperate for a sign of life, a sign of will.

  The preference sat in Elena's throat, clear and bright. *Canyon.*

  She reached into her pocket. Her fingers found the cold rim of the quarter.

  "Mom?" Claire asked. "What are you doing?"

  "Checking," Elena said.

  "You know where you want to go. I can see it on your face."

  "Can you?"

  "Yes. You want the canyon."

  Elena's hand closed around the coin. If she went to the canyon now, it would be because she chose it. The weight of that choice would sit on her shoulders forever. If she changed her mind later, if she regretted the heat and the drive, the fault would be hers. She would have to own the regret.

  But if she flipped... if the coin said pier, and they went to the pier, and she hated it... well. It was just the coin. The regret would slide off her like water off wax. She would be free of the consequence.

  And if the coin said canyon? Then she could go there and enjoy it, and tell herself she was following the system, even though she had wanted it all along. She could have the desire without the responsibility. She could eat the hay without admitting she had walked toward it.

  It was a coward's move. It was also the only way she knew how to keep the peace. It was a lie that felt like grace.

  "Mom, don't," Claire whispered.

  Elena brought her hand out. She held the quarter up. The sun caught the profile of the president, blind and staring forward.

  "Heads, canyon," Elena said. "Tails, pier."

  "That's not how it works," Claire said, her voice breaking. "You just said you wanted the canyon. Why are you flipping?"

  "Because I want to be sure."

  "You *are* sure!"

  "Am I?" Elena smiled, a thin, brittle thing. "Or do I just think I am? Maybe I'm just attached to the idea of the canyon because we're standing next to the car. Maybe in ten minutes I'll wish we were smelling the salt air. The future is a dead zone, Claire. We never really know."

  She flicked her thumb.

  The coin rose, catching the light, a disc of pure chance against the blue sky. For a second, it hung there, suspended between the earth and the sun, between the mother who refused to choose and the daughter who couldn't stop choosing. It was beautiful, that suspension. In that arc, there was no regret, no ownership, no self. There was only the spin.

  Claire watched it, her mouth open, her hands clenched at her sides. She looked like she wanted to catch it, to slam it down on the hood of the car and cover it with her palm before it could land. She wanted to freeze the moment where her mother might have been real.

  Elena watched it too. She felt the preference still humming in her chest, screaming for the canyon. She knew, with absolute certainty, what she wanted.

  She let the coin fall.

  It hit the back of her left hand with a sharp slap. She didn't look immediately. She kept her hand covered, feeling the metal warm against her skin.

  "Well?" Claire asked. The word was a plea.

  Elena looked down.

  It was tails. The pier.

  The preference in her chest didn't vanish. It stayed there, a bright, ignored star. She felt a strange lightness, a hollowing out. She had betrayed herself, and in doing so, she had saved herself from the weight of being herself.

  "Pier it is," Elena said.

  She turned toward the driver's side door. Behind her, Claire didn't move. She stood on the sidewalk, staring at the box of books, at the donkey on the cover staring back at her. The donkey looked patient. It looked like it had all the time in the world to starve.

  "Mom," Claire said.

  Elena paused, her hand on the door handle. She didn't turn around. She waited for the accusation, the tears, the final verdict on a life built on chance.

  "Nothing," Claire said softly. "Never mind."

  Elena opened the door. The leather seat creaked. She sat down and started the engine. She didn't look at her daughter as she got in. They sat in the silence of the car, the engine idling, the choice made, the preference buried. Elena put the car in drive. She felt the steering wheel under her hands, solid and real. She would drive to the pier. She would smell the salt. She would tell herself she liked it.

  And maybe, by the time they arrived, she would.
