      *   *The Conflict:* Sarah says, "You didn't choose me." (Too melodramatic?). No, "You didn't choose *us*." Elena says, "I chose to stay."
      *   *The Mattress:* Bring in the mattress anecdote.
      *   *The City:* Elena looks out the window. Does she love Portland because it's Portland, or because the dice said Portland?
      *   *The Ending:* A decision about a dog? No, they have the dog. A decision about dinner? Too trivial. A decision about the house. Selling it?
      *   *Revised Ending:* They are cleaning out the attic. They find the divorce papers or something from the "two years of agonizing." Elena has to decide whether to keep a specific memento. She feels a pang (preference). She flips.

      *Wait, let's look closer at the prompt's ending requirement:* "leave it genuinely open... recognizes it and flips the coin anyway. That last possibility should feel like it could be either defeat or liberation."
      Okay, so Elena *knows* what she wants, but flips anyway. Why? To surrender the burden? Or because she's lost the muscle?

  7.  **Writing Phase (incorporating into the narrative flow):**
