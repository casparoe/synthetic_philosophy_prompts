      *(Self-Correction during drafting)*: Make sure Elena doesn't seem depressed. She seems *content*. That's what scares Sarah. The contentment of a sleepwalker.
      Make sure Sarah doesn't seem superior. Her paralysis is painful.

      *Word Count Check:* Need to expand on the internal monologue of the "dead zone." The feeling of the weightlessness of decision.

      *The "Donkey" reference:* Keep it visual. "A grey donkey staring at two piles of hay."

      *The Ending:* Let's have them deciding on a restaurant. Elena knows she wants the Italian place. She can taste the pasta in her memory. But she reaches for the quarter.

  8.  **Final Polish:** Check the rhythm. Ensure the philosophical weight is carried by the subtext, not the dialogue. (e.g., instead of saying "free will," say "ownership").

