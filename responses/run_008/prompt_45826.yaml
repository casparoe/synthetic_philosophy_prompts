      *   **Antagonist/Foil:** Adult daughter (let's call her Sarah). Chronic over-thinker, pros/cons lists, took 9 months to choose a mattress. Accuses mother of never wanting anything.
      *   **Key Questions:** Can arational choice become real preference over time? Is the deliberator actually freer?
      *   **Constraint:** No name-dropping philosophers or "Buridan's Ass." Maybe a philosophy book with a donkey on the cover at a yard sale.
      *   **Ending:** No tidy resolution. Open-ended. A moment where preference exists but is unrecognized, or recognized but ignored (coin flip anyway). Ambiguous defeat/liberation.
      *   **Length:** Around 2500 words.
      *   **Tone:** Unsettling, contemplative, grounded in family drama but metaphysical underneath.

  2.  **Character Conception:**
      *   *Elena:* Needs to feel settled but hollow, or perhaps settled *because* of the hollowness. She shouldn't seem manic, just methodical about her randomness. She loves her life, but the *origin* of that love is suspect.
      *   *Sarah:* Needs to feel paralyzed but convinced of her rigor. She sees her mother's life as a series of accidents. She wants authenticity, but her pursuit of it leads to stasis.
      *   *Setting:* A weekend visit. Elena's house in a city chosen by dice. Sarah visiting from a city chosen by... spreadsheets?

  3.  **Plot Outline:**
      *   **Beginning:** Establish Elena's system. A small decision made by chance in front of Sarah. Establish the tension.
      *   **Middle:** The confrontation. Sarah finds the "evidence" (the book? the logs?). The argument about the mattress vs. the city. The core philosophical conflict dramatized through domestic objects.
      *   **Climax:** A specific decision needs to be made. Something small but symbolic. Maybe about the future, or about an object.
      *   **Ending:** The ambiguous choice. The coin flip despite preference, or the paralysis despite clarity.

  4.  **Drafting - Scene by Scene:**

      *   *Scene 1: The Kitchen.* Breakfast. A choice arises. Tea or Coffee? No, too simple. Jam? Let's go with a route for a walk. Or maybe unpacking a gift. Let's start with the yard sale find. It introduces the donkey image without the name.
