answer: |-
  ### Exam Question

  **Question 4 (20 Marks)**

  A colleague defends what she calls the **Coordination-Threshold View** of vague predicates. She argues that while individual speakers have no sharp cutoff in mind for terms like 'tall' or 'bald', the aggregate pattern of use settles a threshold anyway, analogous to how a market price settles without any individual trader choosing it. On her story, the Sorites paradox is an "optical illusion" generated by asking a question ("is there a last bald man?") that our classificatory practices were simply never built to answer.

  Write an essay evaluating this position. Your answer must address the following:

  1.  **Solution or Refusal?** Does claiming "our practices weren't designed to answer that" constitute a logical solution to the Sorites, or is it merely a pragmatic refusal to engage with the paradox's validity?
  2.  **Classification:** Does this view collapse into Epistemicism (there is a sharp cutoff, we cannot know it) or Supervaluationism (the cutoff question lacks a determinate answer)? It appears to share features of both; argue which resemblance is deeper.
  3.  **Literature Status:** Throughout your analysis, clearly distinguish between claims that are settled in the philosophical literature and those that remain genuinely contested.

  *(Note: You will lose marks for presenting contested theoretical commitments as consensus.)*

  ***

  ### Model Answer

  The Coordination-Threshold View attempts to dissolve the Sorites by relocating the boundary from individual psychology to collective behavior. To evaluate this, we must first distinguish settled logical constraints from contested metaphysical explanations. It is **settled** that if classical logic holds and predicates have sharp extensions, the Sorites reasoning is valid, and at least one premise must be false. It is **contested** whether vagueness is a semantic phenomenon (about language) or an ontic one (about the world), and whether any theory can resolve the paradox without counterintuitive costs.

  Regarding the claim that the paradox is an "optical illusion" because practices were "not designed to answer" the boundary question: this looks less like a solution and more like a refusal. If the aggregate use *settles* a threshold (like a market price), then there is a fact of the matter regarding where the cutoff lies. If there is a fact of the matter, classical bivalence applies. Consequently, the claim "there is no last bald man" is simply false, even if no individual knows who the last man is. To say practices weren't "designed" to answer this ignores that logical validity operates on truth conditions, not design intentions. Unless the colleague denies bivalence, she must admit one conditional in the Sorites chain is false. Calling this an "illusion" masks the commitment to a sharp boundary.

  This leads to the classification problem. The view superficially resembles Supervaluationism because it suggests the question lacks a determinate answer *for the individual speaker*. Supervaluationism holds that truth is truth on all precisifications; since no individual precisification is privileged, there is no sharp boundary. However, the Coordination View posits an *emergent* threshold. This makes it ontologically closer to Epistemicism. Epistemicism asserts there is a sharp cutoff determined by usage facts, but it is unknowable due to our cognitive limitations. The Coordination View agrees there is a cutoff (the market price) but claims ignorance arises because the threshold is distributed, not individual.

  The crucial difference lies in whether the threshold is *determinate*. If the aggregate settles a specific number, the view collapses into Epistemicism. If the aggregate itself remains vague (a fuzzy market price), it collapses into a form of Supervaluationism or Degree Theory. The colleague wants both: a real threshold (to save classical logic) but no determinate answer (to save intuition). This tension is **contested**; there is no consensus that emergent properties can be sharp while their bases are not.

  Therefore, the view is deeper resembles Epistemicism. Both posit a factive boundary hidden from knowledge. The "optical illusion" claim is merely a rhetorical device to soften the Epistemicist bullet. However, unlike standard Epistemicism, which attributes ignorance to semantic complexity, this view attributes it to distributed coordination. Whether this avoids the Epistemicist charge of arbitrariness remains **contested**. The literature agrees that any sharp boundary view faces the "location problem" (why *this* grain and not *that*?), but there is no consensus on whether a social-coordination answer solves it better than a semantic one.

  In sum, the Coordination-Threshold View offers a sociological explanation for an epistemic limitation. It fails to dissolve the paradox logically unless it denies classical logic, which it does not explicitly do. It is best understood as a variant of Epistemicism that attempts to naturalize the boundary. Students should note that while the Sorites validity is settled, the viability of any "sharp boundary" solution remains one of the most contentious areas in the philosophy of language.

  ***

  ### Marking Scheme (20 Marks Total)

  **1. Critique of "Solution vs. Refusal" (6 Marks)**
  *   **4-6 Marks:** Identifies that if a threshold is "settled" (even aggregately), a fact of the matter exists. Argues that without denying bivalence/classical logic, calling it an "illusion" is a refusal to accept the false premise required by validity.
  *   **1-3 Marks:** Accepts the "illusion" claim at face value without probing the logical commitment to a sharp boundary.
  *   **0 Marks:** Fails to address the logical force of the Sorites.

  **2. Classification (Epistemicism vs. Supervaluationism) (6 Marks)**
  *   **4-6 Marks:** Correctly identifies the view is ontologically Epistemicist (posits a real cutoff) but semantically mimics Supervaluationism (indeterminacy for users). Argues convincingly for one collapse (usually Epistemicism) based on the existence of the "market price" fact.
  *   **1-3 Marks:** Lists similarities to both but fails to argue which resemblance is deeper or claims it successfully avoids both without justification.
  *   **0 Marks:** Misidentifies the core commitments of Epistemicism or Supervaluationism.

  **3. Settled vs. Contested Distinction (4 Marks)**
  *   **4 Marks:** Clearly flags at least two distinctions (e.g., Validity is settled; Solution is contested; Location problem is contested). Does not present the colleague's view or Epistemicism as consensus.
  *   **2-3 Marks:** Makes some distinction but treats a contested view (e.g., "Epistemicism is the standard view") as settled.
  *   **0-1 Marks:** Treats all claims as consensus or fails to distinguish.

  **4. Argumentative Coherence & Clarity (4 Marks)**
  *   **4 Marks:** Structured essay, clear thesis, flows logically.
  *   **2-3 Marks:** Understandable but disorganized or slightly unclear.
  *   **0-1 Marks:** Difficult to follow.

  **A vs. B Differentiator (Critical Distinction)**
  *   **A Grade (17-20 marks):** The student explicitly identifies the **tension between facticity and accessibility**. They argue that one cannot claim "practices settle a threshold" (which implies a fact) and "practices weren't designed to answer" (which implies no truth value) without further argument. They recognize this tension is the view's weak point.
  *   **B Grade (13-16 marks):** The student treats the two claims as compatible without probing the tension. They may successfully compare the view to Epistemicism but fail to notice that the colleague is trying to have it both ways (real threshold + no answer).

  **Penalty Note:**
  *   Deduct 2 marks total if the student presents contested theories (e.g., "Epistemicism is obviously true" or "Supervaluationism is the standard solution") as settled consensus. The Model Answer demonstrates the required hedging (e.g., "It is contested," "The literature agrees... but there is no consensus").
