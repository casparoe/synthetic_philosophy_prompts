  ### Part 2: The Rival Rules

  Her history supports two distinct philosophical heuristics. Both fit her past data perfectly but diverge on the new cases.

  #### Rule A: The "Concrete Carving" Principle (Quantifier Variance)
  *   **The Logic:** Disputes about the existence or composition of **spatio-temporal/concrete objects** are merely verbal. We just choose how to "carve up" space-time (e.g., counting particles vs. tables). Disputes about **abstract objects or modal structure** are real, because they aren't just rearranging furniture in the physical world.
  *   **Fit to History:** Explains why Tables, Statues, and Fusions (all concrete composition) are Verbal. Explains why Numbers (abstract), Laws (modal), and Identity (diachronic structure) are Real.
  *   **Predictions for New Cases:**
      *   **Possible Worlds:** **Verbal.** (If they are "concrete," they are just more space-time furniture. Asking if they exist is like asking if there are "islands" or just "land surrounded by water.")
      *   **Corporations:** **Verbal.** (Concrete arrangement of people/paper.)
      *   **Fictional Characters:** **Real.** (They are typically categorized as *abstract artifacts*. Under Rule A, Abstract = Real, just like Numbers.)

  #### Rule B: The "Fundamental Independence" Principle (Indispensability)
  *   **The Logic:** Disputes about entities that are **mind-independent and theoretically indispensable** (to math or fundamental physics) are real. Disputes about **folk categories, social constructs, or mind-dependent entities** are verbal.
  *   **Fit to History:** Explains why Tables/Statues (folk/vague) are Verbal. Explains why Numbers (indispensable to math), Laws (indispensable to physics), and Identity (indispensable to moral/psychological continuity) are Real.
  *   **Predictions for New Cases:**
      *   **Possible Worlds:** **Real.** (Indispensable for modal logic/semantics; mind-independent structure.)
      *   **Corporations:** **Verbal.** (Social construct; dispensable legal fiction.)
      *   **Fictional Characters:** **Verbal.** (Mind-dependent; created by authors; not indispensable to fundamental theory.)

