  ### Part 1: My Best Guess on Her Verdicts

  1.  **Possible Worlds (Concrete): Real.**
      *   *Why:* She ruled "Laws of Nature" as Real (Governing). Governing laws imply robust modality (necessity/possibility). A math major who believes laws *govern* rather than summarize likely views the structure of possibility as a hard feature of reality, not a linguistic convenience. Even if the worlds are "concrete," they serve the modal structure she respects.
  2.  **Corporations: Verbal.**
      *   *Why:* This is structurally identical to the "Statue/Clay" and "Tables/Particles" disputes. It is a question of whether a social/functional arrangement counts as an "object." Like the Pluto/planet analogy, this is a classification choice, not a discovery of new stuff.
  3.  **Fictional Characters: Verbal.**
      *   *Why:* This is the tricky one. While numbers are abstract and real, fictional characters are *mind-dependent* abstracta. Given she treats tables (mind-independent but vague) as verbal, she will likely treat characters (mind-dependent and vague) as verbal. They are useful fictions, like "centers of mass," not discoveries like prime numbers.

