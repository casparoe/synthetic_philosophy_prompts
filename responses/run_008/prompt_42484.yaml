          *   "Draw the diagram." (Too mechanical).
          *   "If $P$ causes $P^*$, and $M$ is not $P$, what happens to $M$'s role?" (Better).
          *   *Best:* "If we insist the mental cause is real, and we insist physics is closed, what relationship must hold between $M$ and $P$?" (Forces them to see Reduction is the only escape).

  5.  **Final Review against Constraints:**
      *   40 mins? Yes, the plan is tight.
