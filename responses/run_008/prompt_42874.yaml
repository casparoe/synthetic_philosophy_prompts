  A committed defender would concede that this is not immortality in the religious sense; the pattern degrades and eventually vanishes. They would admit the 'original' stream stops. However, they would dismiss the phenomenological objection as a category error. They argue the 'subjective feel' is itself just part of the pattern. If the pattern runs elsewhere, the 'feel' runs there too, just not accessible to the original biological hardware. They treat the 'I' as a logical object, not a metaphysical soul. Regarding the 'influence' collapse, they would insist that high-fidelity modelling *is* agency. If the host acts exactly as you would, the distinction between 'influenced by you' and 'being you' dissolves. They would concede the view is reductionist but deny this makes it false. They dismiss the worry about numerical identity as clinging to a 'further fact' that doesn't exist. For them, if it quacks like you, it *is* you, to the degree it quacks.

  **Is it insulated?**
  There is a genuine risk of insulation. By defining survival as 'partial' and 'degree-based', the theory becomes difficult to falsify. Any memory anyone holds of you counts as some survival. To avoid this, the view requires a rigorous metric for pattern complexity and causal autonomy. Without this, it retreats into unfalsifiable vagueness where 'being remembered' equals 'living on'. A robust version must specify a threshold below which survival is zero. If every mention of your name counts as survival, the claim loses explanatory power. It becomes a synonym for 'legacy'. The position is insulated if it refuses to define when the pattern is too degraded to count. It must be possible for someone to know you well yet carry zero 'you' because the recursive loop is broken.

  **What would move me**
  The most persuasive defeater is the phenomenological gap. Survival matters because we care about *experiencing* the future, not merely being represented in it. A pattern executing without the original centre of experience is a recording, not a life. If there is no 'what-it-is-like' for the original subject to inhabit the new substrate, then nothing that matters to you continues. You do not get to see the future; only a copy does. Persistence of structure without persistence of perspective is not survival; it is echo.
