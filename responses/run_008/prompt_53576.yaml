answer: |-
  Yes, there is a specific term for exactly what you are describing, and you are right to feel that "confirmation bias" is too blunt an instrument here. Confirmation bias explains why someone ignores evidence *against* a specific belief. It doesn't explain why someone holds two mutually exclusive beliefs simultaneously without experiencing cognitive dissonance.

  The term you are looking for is a **Monological Belief System**.

  Here is a breakdown of the concept, the psychological mechanisms behind it, and how it extends beyond conspiracy theories.

  ### 1. The Term: Monological Belief System
  This term was coined by social psychologist Ted Goertzel in a 1994 paper titled *"Belief in Conspiracy Theories."*

  In a **dialogical** system (normal reasoning), beliefs are tested against evidence and against each other. If Belief A contradicts Belief B, one must be discarded or modified. This creates friction.

  In a **monological** system, beliefs are not supported by evidence from the outside world; they are supported by *other beliefs within the system.* They form a closed loop.
  *   **Your Uncle's Logic:** It doesn't matter if the Moon Landing was faked *or* if aliens were found. Both beliefs share the same foundational axiom: **"The Government Lies."**
  *   **The Mechanism:** Because both theories point to the same conclusion (authorities are deceitful), they reinforce each other. The contradiction (we can't have both) is irrelevant because the *function* of the belief isn't to describe reality accurately; it is to validate the underlying distrust.

  As Goertzel put it, conspiracy theories are not distinct hypotheses; they are a "network of mutually supportive beliefs."

  ### 2. The Psychological Trait: Conspiracist Ideation
  In modern psychology, researchers (like Brotherton, French, and Pickering) often refer to this as **Conspiracist Ideation** or **Conspiracy Mentality**.

  This is viewed not as a collection of specific beliefs, but as a **stable personality trait** or cognitive style. People high in conspiracist ideation process information differently:
  *   **Pattern Matching:** They are hyper-sensitive to patterns, specifically patterns of malevolence. Randomness feels uncomfortable; a conspiracy implies order and control, even if that control is evil.
  *   **Epistemic Distrust:** This is the load-bearing part you identified. It is a fundamental rejection of "official" epistemic authorities (science, government, mainstream media). If the source is "official," the information is presumed false.
  *   **Proportionality Bias:** The belief that big events must have big causes. A lone gunman couldn't kill JFK; a pandemic couldn't happen naturally. It *must* be a grand plot.

  ### 3. Solving the "Competence Paradox"
  You noted the friction between "the government is too incompetent to land on the moon" and "the government is competent enough to hide alien tech for 60 years."

  In logic, this is a contradiction. In a monological system, this is called **Ad Hoc Rescue** or **Immunization**.

  The competence of the conspirator is adjusted dynamically to fit the needs of the specific argument:
  *   **When explaining a failure:** The government is bumbling idiots (hence the fake moon landing, they couldn't do the real one).
  *   **When explaining a lack of evidence:** The government is hyper-competent masterminds (hence no proof of aliens, they hid it too well).

  This is sometimes referred to as the **"Omnimalevolence" assumption.** The conspirators are assumed to be all-powerful when it comes to suppression, and all-incompetent when it comes to execution. This allows the believer to win every argument: success proves the lie, failure proves the incompetence. There is no outcome that falsifies the theory.

  ### 4. Why Contradictions Don't Stick (The Mechanism)
  You asked if believing one makes the next easier. Research suggests **yes**. This is known as the **"Gateway Conspiracy"** effect, but it goes deeper than that.

  The mechanism is **Coherence over Correspondence.**
  *   **Correspondence:** Does this belief match the external world? (Normal reasoning).
  *   **Coherence:** Does this belief fit with my other beliefs and my identity? (Monological reasoning).

  For your uncle, the "truth" of the Moon Landing isn't about geology or telemetry; it's about whether he belongs to the group of "people who know the real truth." Accepting that NASA landed on the moon doesn't just change a fact; it threatens his identity as someone who sees through the deception. Therefore, any theory that maintains the "I am awake, they are asleep" dynamic is accepted, regardless of logical consistency.

  ### 5. Does This Apply Elsewhere? (The Edges of the Phenomenon)
  Yes. This is not unique to UFOs and moon landings. You see this **ideological bundling** in politics and religion constantly.

  *   **Political Polarization:** In highly polarized environments, beliefs bundle together regardless of logical connection. If you are "Team A," you must believe X about the economy, Y about foreign policy, and Z about culture. If Team A believes two contradictory things (e.g., "The election was rigged by a massive machine" AND "The opponent won because people are too stupid to vote for us"), the contradiction is ignored because both serve the narrative: "We didn't truly lose."
  *   **Religious Fundamentalism:** Similar mechanisms apply where doctrinal contradictions are resolved by appealing to "mystery" or "faith," maintaining the core axiom of the text's infallibility.
  *   **Echo Chambers:** Philosopher C. Thi Nguyen describes this as an **Epistemic Bubble** (where you lack information) vs. an **Echo Chamber** (where you are actively taught to distrust outside sources). Your uncle is in an Echo Chamber. The mechanism is the same: the *source* of the information matters more than the *content*.

  ### Summary for Your Argument
  If you find yourself talking to him again, knowing this won't necessarily change his mind (these beliefs are emotionally fortified), but it might save your sanity.

  1.  **Don't fight the facts:** Arguing about moon rocks or alien tech is useless because the facts aren't the foundation of his belief.
  2.  **Identify the Axiom:** The core belief is "Authority is malicious." As long as that is true, any conspiracy theory is valid.
  3.  **The "Monological" Label:** If you want to use the term, tell him: *"It sounds like you have a monological belief system. You aren't evaluating these theories on whether they are true, but on whether they all point to the same villain. That means you'll believe anything, even contradictions, as long as it keeps the villain in charge."*

  **The closest academic terms:**
  *   **Monological Belief System** (The structure of the beliefs)
  *   **Conspiracist Ideation** (The psychological trait)
  *   **Epistemic Cognition** (The study of how people think about knowledge/truth)

  You diagnosed it perfectly: The content is decoration; the direction ("Official Story = False") is the load-bearing wall.
