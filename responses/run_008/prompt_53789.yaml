answer: |-
  # The Geometric Allocation Procedure (GAP)

  **Purpose:** To determine commitment sizes for individual funding proposals that balance endowment longevity (geometric growth) with mission impact, while explicitly accounting for estimation error and finite horizons.

  **Time Required:** ~45–60 minutes per proposal (including team calibration).
  **Tools:** Spreadsheet.

  ---

  ## Part 1: The Procedure

  ### Step 1: Define the "Bet" Parameters
  Before calculating, you must quantify the proposal as a wager. If a parameter cannot be estimated, you cannot use this procedure for the *size* decision (see Step 5).

  1.  **Probability of Success ($p$):** The likelihood the project achieves its *minimum viable outcome* (not the moonshot, but the threshold where the money isn't lost).
      *   *Input:* Consensus estimate from review panel (0.0 to 1.0).
  2.  **Net Payoff Multiple ($b$):** The profit per dollar invested *if* successful.
      *   *Formula:* $(\text{Total Return} / \text{Investment}) - 1$.
      *   *Example:* If you invest \$1M and get \$2.2M back, profit is \$1.2M. $b = 1.2$.
      *   *For non-financial returns:* Estimate the "Shadow Value." If the research saves lives or advances knowledge, assign a dollar equivalent your board accepts for modeling purposes. If you cannot assign a number, $b$ is undefined.
  3.  **Probability of Failure ($q$):** Simply $1 - p$.
  4.  **Horizon Check:** Is this fund operating in perpetuity?
      *   *Yes:* Proceed to Step 2.
      *   *No (e.g., spend-down clause):* Skip to **Step 4 (Arithmetic Override)**.

  ### Step 2: Calculate the "Full Kelly" Fraction
  This calculates the theoretical optimal size to maximize the long-term compound growth rate of the endowment.

  *   **Formula:** $f^* = \frac{p(b + 1) - 1}{b}$
  *   *Alternative (easier) form:* $f^* = p - \frac{q}{b}$
  *   **Interpretation:** This is the fraction of your *total investable capital* (not annual budget) you should theoretically commit.
  *   **Constraint:** If $f^* \leq 0$, the bet has negative geometric expectation. Do not fund from the core endowment.

  ### Step 3: Apply the Uncertainty Discount (Fractional Kelly)
  Your $p$ and $b$ are estimates, not facts. Full Kelly assumes perfect knowledge. Using Full Kelly on overestimated edges is the fastest way to ruin.

  *   **Rule:** Apply a **Half-Kelly** discount by default.
  *   **Calculation:** $f_{\text{final}} = f^* \times 0.5$
  *   **Rationale:** Half-Kelly reduces the variance of your outcome by 75% while sacrificing only 25% of the growth rate. It provides a safety margin against overconfidence.
  *   **Cap:** No single commitment should exceed 10% of the total endowment, regardless of the calculation. (This prevents "absorption" where one loss cripples the fund).

  ### Step 4: The Arithmetic Override (Mission & Horizon)
  This is where the human judgment enters. The Kelly criterion maximizes *wealth*. Your fund maximizes *impact*. These are not always the same.

  *   **Check A (Horizon):** If the fund has a spend-down clause (finite life), Kelly is mathematically invalid. Ignore Step 2 & 3. Maximize Arithmetic Expected Value ($p \times \text{Total Return}$) subject to solvency (can we pay the bills for 3 years?).
  *   **Check B (Mission Critical):** If a proposal is core to your charter (e.g., the "Moonshot") but Kelly suggests a tiny bet (or zero):
      *   You may override $f_{\text{final}}$.
      *   **Requirement:** You must document the "Growth Cost." Calculate the difference between your chosen size and the Kelly size. Acknowledge that this increases the risk of endowment shrinkage.
      *   **Limit:** Do not override if $f^*$ is negative (Step 2). Do not fund negative geometric expectation bets with more than 5% of the portfolio unless the board explicitly votes to subsidize them as "marketing/mission cost."

  ### Step 5: Handling the Unquantifiable
  If $b$ (Payoff) cannot be monetized or estimated (common in basic science):
  1.  **Treat as a Call Option:** Assign a nominal $b$ based on the smallest "success" that justifies the cost (e.g., a publication, a prototype).
  2.  **Budget as Expense, Not Investment:** If there is no plausible financial or shadow return, size the grant based on the **Arithmetic Budget Constraint** (what can we afford to lose this year?) rather than Kelly.
  3.  **Label:** Mark these as "Mission Consumption." They reduce the capital base available for Kelly-optimized bets.

  ---

  ## Part 2: Running the Cases

  Here is how the procedure applies to your three specific scenarios.

  ### Case 1: The Equity Spinout
  *   **Context:** 60% success chance ($p=0.6$). 2.2x total return ($b=1.2$). Perpetual endowment.
  *   **Step 2 (Full Kelly):**
      $$f^* = 0.6 - \frac{0.4}{1.2} = 0.6 - 0.333 = 0.267 \quad (26.7\%)$$
  *   **Step 3 (Fractional Kelly):**
      $$f_{\text{final}} = 26.7\% \times 0.5 = 13.35\%$$
  *   **Step 4 (Caps):**
      Apply the 10% single-asset cap.
      **Recommended Commitment:** 10% of Endowment.
  *   **The Fight:**
      *   *Arithmetic Faction:* "EV is positive ($1.32 > 1$), we should bet big."
      *   *Timid Faction:* "40% chance of total loss is too scary."
      *   *Kelly Resolution:* The math supports a significant bet (10% is large for a single grant), but caps it to prevent ruin. The "Timid" fear is addressed by the Half-Kelly discount; the "Concentrate" desire is addressed by the positive $f^*$.
      *   **Decision:** Fund at cap. This is a high-conviction geometric growth bet.

  ### Case 2: The Moonshot
  *   **Context:** 3% success chance ($p=0.03$). Transformative payoff. Let's model "Transformative" as 100x net profit ($b=100$). Perpetual endowment.
  *   **Step 2 (Full Kelly):**
      $$f^* = 0.03 - \frac{0.97}{100} = 0.03 - 0.0097 \approx 0.02 \quad (2\%)$$
  *   **Step 3 (Fractional Kelly):**
      $$f_{\text{final}} = 2\% \times 0.5 = 1\%$$
  *   **The Conflict:**
      *   **Kelly Says:** Bet 1% of the endowment.
      *   **Your Charter Says:** "We exist for exactly this kind of thing."
      *   **The Hard Truth:** Kelly is not wrong. It is telling you that if you make this bet repeatedly at this size, you will grow the endowment. If you bet 10% on this, a string of 5 failures (which is statistically likely, given 97% failure rate) will cut your endowment by nearly half, jeopardizing your ability to fund *anything* else.
      *   **The Override:** You are allowed to override this, but you must admit what you are doing. You are trading **Endowment Longevity** for **Mission Optionality**.
      *   **Procedure Output:**
          1.  Base Recommendation: 1% of Endowment.
          2.  Mission Override: If the Board insists on a \$5M grant (say, 12% of endowment), you must record this as a "Mission Subsidy."
          3.  **Warning:** If you fund three of these "Moonshots" at 12% each, and all fail (91% probability), you have lost 36% of your capital base. Recovery requires a 56% gain just to break even.
      *   **Decision:** Fund at 1% via the standard pool. If the Board wants to fund the rest, they must authorize a separate "Risk Capital" tranche that is acknowledged as potentially non-recoverable. Do not commingle this with the core Kelly-optimized pool.

  ### Case 3: The Spend-Down Clause
  *   **Context:** A donor clause forces full spend-down in 3 years.
  *   **Step 1 (Horizon Check):** Finite horizon detected.
  *   **Procedure Halt:** **Kelly Criterion is Inapplicable.**
  *   **Reasoning:** Kelly relies on the "long run" to smooth out variance. If the game ends in 3 years, the "time average" (ergodicity) does not converge to the "ensemble average." You do not care about geometric growth rate; you care about the total dollar value of impact delivered by Year 3.
  *   **Alternative Procedure:**
      1.  Maximize **Arithmetic Expected Value** ($p \times \text{Payoff}$).
      2.  Constraint: Liquidity. Ensure you have enough cash on hand to meet mandatory grant disbursements for Years 1, 2, and 3.
      3.  Risk Tolerance: Can be much higher. If you have \$40M to spend in 3 years, and a project costs \$10M with a 10% chance of \$200M value (EV = \$20M), you take it. Under Kelly/Perpetuity, you would likely pass or bet tiny because the 90% risk of ruin is unacceptable for a forever fund. Here, "ruin" is scheduled.
  *   **Decision:** Switch to EV maximization. Ignore the Trustee's Kelly advice for this specific tranche of capital. She is optimizing for a timeline that no longer exists.

  ---

  ## Part 3: Operational Notes for the Program Officer

  **1. Where the Fights Are Real**
  The Arithmetic faction and the Geometric (Kelly) faction will agree on "slam dunks" (high $p$, high $b$) and "trash" (low $p$, low $b$). They will fight on **High EV / Low Probability** bets (Case 2).
  *   *Arithmetic View:* "The expected value is huge, we're irrational if we don't bet."
  *   *Geometric View:* "The risk of ruin is too high relative to the frequency of winning."
  *   *Your Role:* Use the procedure to show the *cost* of the Arithmetic view. "We can make this bet, but it reduces our compound growth rate from X% to Y%." Let the Board decide if the mission impact is worth the growth penalty.

  **2. Estimating the Unquantifiable**
  When $b$ is unknown (basic science), do not guess a number. Use the **"Affordable Loss"** method.
  *   Determine the maximum amount the fund can lose this cycle without impairing next year's operations (e.g., 5% of annual budget).
  *   Treat this as a fixed cost.
  *   Do not apply Kelly sizing to these. Apply Kelly sizing only to proposals with recoverable capital or quantifiable returns (equity, real estate, IP licensing).

  **3. The Trustee's "Edge"**
  Your Trustee is right that arithmetic expectation is a trap for repeated bets. However, she is wrong if she treats the fund *only* as a bankroll.
  *   **Use her language:** "We are using Half-Kelly to protect the geometric growth rate."
  *   **Protect your mission:** "But we are overriding the cap for Proposal X because our utility function includes scientific breakthroughs, not just dollars."

  **4. The Spreadsheet**
  Create a simple tab with columns: `Proposal`, `p`, `b`, `Kelly Fraction`, `Half-Kelly`, `Cap Adjusted`, `Mission Override?`, `Final Commitment`.
  Require the `Mission Override` column to be filled with text if the Final Commitment exceeds the Cap Adjusted number. This creates an audit trail of where you are choosing impact over longevity.

  **Summary:** Use Kelly to protect the fund from itself. Use Mission Override to ensure the fund actually does its job. Document the difference.
