prompt: |-
  I'm the program officer at a mid-sized research fund that grants roughly forty million a year across maybe thirty proposals, and every funding cycle we relitigate the same argument: one faction wants us to concentrate the budget on the single best-expected-value bet, another wants timid equal slices across everything so no one failure embarrasses us, and a trustee who spent two decades on a trading desk keeps telling us we're thinking about this completely wrong -- that what we should care about is the geometric growth rate of the endowment, not the arithmetic expectation of any one cycle, and that there's a whole literature (she mentions Kelly this, fractional Kelly that, and something called ergodicity economics that I only half follow) about sizing repeated bets. I've absorbed just enough of this to believe she's onto something and not enough to operationalize it. What I need is not a lecture on log utility but a procedure my team can actually run.

  Please write a decision procedure for sizing our commitments to individual funding bets, grounded in the Kelly criterion and the geometric-rationality tradition but usable by a program officer with a spreadsheet and an hour, not a statistics background. It should specify, in order: what inputs we need before the procedure even starts (and what to do when a payoff is genuinely unquantifiable), how to compute or bound the recommended fraction, how to adjust downward for the fact that our edge estimates are themselves uncertain -- my understanding is that full Kelly on an overestimated edge is a classic way to ruin yourself, so the procedure has to say something principled about fractional Kelly rather than just "be conservative" -- and where the arithmetic-expected-value view and the geometric view actually give different answers, so the team knows which fights are real. It should be explicit about the points where the procedure runs out and a human judgment call has to be admitted as such, especially around how to weigh the fund's mission, which is not the same as maximizing the bankroll.

  Then run it on three concrete cases: first, a proposal where a spinout company offers a 2.2x return on a grant structured as an equity stake, with our internal estimate of success at around 60%, competing against simply holding the endowment; second, a moonshot research program with perhaps a 3% chance of a payoff so transformative that the expected value dwarfs everything else on the slate, where I suspect Kelly will tell us to bet a rounding error and our charter tells us we exist for exactly this kind of thing; and third, a situation we've never faced but might -- a funder's clause that could force us to spend down the entire endowment within three years, so the premise of a long run of repeated bets that seems to underwrite the whole Kelly approach just isn't there. On the second case especially, don't soften it: if the procedure gives me an answer I won't like, I want to see that plainly, along with an honest account of what the procedure can't do and where following it faithfully would be a mistake.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the User and Request:**
      *   **User Role:** Program Officer at a mid-sized research fund ($40M/year, ~30 proposals).
      *   **Problem:** Internal conflict over allocation strategy (Concentrate vs. Diversify vs. Geometric Growth/Kelly).
      *   **Key Constraint:** Needs a *procedure*, not a lecture. Usable by a program officer with a spreadsheet and an hour. No advanced stats background required.
      *   **Key Requirements:**
          *   Specify inputs (and how to handle unquantifiable payoffs).
          *   Compute/bound the recommended fraction.
          *   Adjust for estimation uncertainty (Fractional Kelly).
          *   Highlight divergence between Arithmetic (EV) and Geometric (Kelly) views.
          *   Admit limits (human judgment, mission alignment).
          *   Run on three specific cases (Equity Spinout, Moonshot, Spend-Down Clause).
          *   Be honest about uncomfortable answers (especially Case 2).

  2.  **Deconstruct the Theory (Kelly/Ergodicity) for Practical Application:**
      *   *Kelly Criterion:* $f^* = \frac{p(b+1) - 1}{b}$, where $b$ is net odds received on the wager. Or simpler: $f^* = \text{Edge} / \text{Odds}$.
      *   *Geometric vs. Arithmetic:* Arithmetic maximizes average outcome in one shot. Geometric maximizes compound growth over many shots. For an endowment aiming for perpetuity, Geometric is usually the right metric *unless* the mission demands specific high-variance outcomes.
      *   *Fractional Kelly:* Full Kelly is too volatile for most institutions. Half-Kelly is a standard heuristic to reduce variance while keeping most growth.
      *   *Ergodicity:* Time average vs. Ensemble average. If you go bust, time stops. Hence, avoid ruin.
      *   *The "Mission" Constraint:* A research fund isn't a hedge fund. Maximizing endowment size is a means to an end (research impact), not the end itself.

  3.  **Drafting the Procedure (The "How-To"):**
      *   *Step 1: Inputs.* Need Probability of Success ($p$), Payoff Multiple ($b$), and Cost of Capital (Opportunity Cost). Need to handle "fuzzy" payoffs (convert to "Research Impact Units" or similar, but keep financial constraints in mind).
      *   *Step 2: The Calculation.* Use the standard Kelly formula but adapted for investment/grant contexts.
      *   *Step 3: Uncertainty Adjustment.* This is crucial. If $p$ is an estimate, apply a discount. Half-Kelly is the standard "principled conservatism."
      *   *Step 4: Mission Overlay.* This is where the PO steps in. If Kelly says 0% but mission says "do it," override but acknowledge the cost to endowment longevity.
      *   *Step 5: Cap/Floor.* Don't bet the farm. Don't bet dust.

  4.  **Developing the Three Cases:**

      *   **Case 1: Equity Spinout.**
          *   Inputs: $p = 0.6$, Payoff = 2.2x (gross). Net odds $b = 1.2$ (since you put in 1, get back 2.2, profit is 1.2).
          *   Kelly Calc: $f = (0.6 \times 1.2 - 0.4) / 1.2$. Wait, let's use the standard $p(b+1)-1 / b$ formulation where $b$ is net profit per unit wagered.
          *   Actually, simpler formulation: $f = p - (1-p)/b$.
          *   Let's check: $p=0.6$, $b=1.2$ (profit). $f = 0.6 - 0.4/1.2 = 0.6 - 0.333 = 0.266$.
          *   Fractional Kelly (Half): ~13%.
          *   Comparison: Arithmetic EV is positive ($0.6 \times 2.2 = 1.32 > 1$). Kelly agrees but limits size.

      *   **Case 2: The Moonshot.**
          *   Inputs: $p = 0.03$. Payoff = "Transformative." Let's quantify. If it dwarfs everything, maybe 100x?
          *   Kelly Calc: $f = 0.03 - 0.97/100 = 0.03 - 0.0097 \approx 2\%$.
          *   Wait, if payoff is truly massive (say 1000x), $f \approx 3\%$.
          *   *The Conflict:* The user suspects Kelly will say "rounding error." If the payoff is 100x, Kelly is small. If the payoff is *infinite* (mission success), Kelly breaks.
          *   *Honest Account:* Kelly minimizes time-to-ruin. A moonshot *is* high risk of ruin (capital loss). If the fund exists *for* moonshots, the utility function isn't log-wealth. It's step-function (success/failure). I need to explicitly state that Kelly says "don't do it" or "bet tiny," and the override is a *mission decision*, not a math error.

      *   **Case 3: Spend-Down Clause.**
          *   Context: Finite horizon (3 years).
          *   Theory: Kelly relies on infinite/repeated horizon to smooth variance. With finite horizon, you care about Arithmetic EV at the end date, not geometric growth rate.
          *   Result: Kelly is irrelevant. Switch to EV maximization subject to solvency constraints.

  5.  **Refining the Tone:**
      *   Professional, direct, operational.
      *   Acknowledge the Trustee's point (she's right about math, maybe wrong about mission).
      *   Acknowledge the "Timid" faction's point (variance matters).
      *   Acknowledge the "Concentrate" faction's point (EV matters).
      *   No jargon without definition.

  6.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is the Kelly formula clear?
      *   *Fix:* Define $b$ clearly as "Net Profit per Dollar Wagered." If I invest \$1 and get \$2.20 back, profit is \$1.20. $b=1.2$.
      *   *Critique:* How to handle unquantifiable payoff?
      *   *Fix:* Introduce "Shadow Price" or "Mission Equivalent." If it can't be monetized, Kelly doesn't apply directly. Use Kelly to set a *budget cap* on the risk, then fill with mission judgment.
      *   *Critique:* Fractional Kelly justification.
      *   *Fix:* Cite "estimation error" explicitly. Overconfidence kills Kelly bettors. Half-Kelly reduces variance by 75% while sacrificing only 25% growth.
      *   *Critique:* Case 2 needs to be hard-hitting.
      *   *Fix:* Explicitly state: "Kelly says bet 1%. Your charter says bet 10%. This is a mission override. Record it as such."

  7.  **Final Polish:** Check against constraints. Spreadsheet ready? Yes. One hour? Yes. Addresses all three cases? Yes. Addresses the "fight" between factions? Yes.

  *(Self-Correction on Case 1 Math)*:
  Investment: \$1.
  Return if success: \$2.20 total (\$1.20 profit).
  Return if failure: \$0.
  $p = 0.6$.
  Kelly Formula: $f^* = \frac{p(b+1) - 1}{b}$ where $b$ is net odds (profit).
  $f^* = \frac{0.6(1.2+1) - 1}{1.2} = \frac{0.6(2.2) - 1}{1.2} = \frac{1.32 - 1}{1.2} = \frac{0.32}{1.2} = 0.266$.
  Okay, math holds.

  *(Self-Correction on Case 2 Math)*:
  $p = 0.03$.
  Payoff: Let's assume 50x net profit for "transformative."
  $f^* = \frac{0.03(51) - 1}{50} = \frac{1.53 - 1}{50} = \frac{0.53}{50} \approx 1\%$.
  If payoff is 100x net profit:
  $f^* = \frac{0.03(101) - 1}{100} = \frac{3.03 - 1}{100} = 2\%$.
  So yes, Kelly suggests small bets even on huge EV moonshots because the probability of loss is so high (97%). This highlights the tension perfectly.

  *(Self-Correction on Case 3)*:
  Finite horizon means Ergodicity assumption breaks. Time average $\neq$ Ensemble average if time runs out. Switch to Arithmetic.

  8.  **Final Structure:**
      *   Introduction (acknowledge the tension).
      *   The Procedure (5 Steps).
      *   The Three Cases (applied).
      *   Closing Advice (Governance).

