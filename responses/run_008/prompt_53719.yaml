      *   Ensure the distinction between "Nudges" (Prop 3) and "Manipulation" (Prop 1) is clear.
      *   Check the "Guilt vs. Emotion" distinction (Prop 6). Guilt-tripping is usually *manufactured* obligation. Genuine appeal is *shared* burden. This aligns with Prop 4 (Manufactured insecurity). So 4 and 6 are actually consistent *with each other*, but inconsistent with 1's focus on *rationality*.

      *(Self-Correction during drafting)*: Wait, Prop 3 (Opt-out) is the hardest one. Thaler & Sunstein call this "nudging." Critics call it manipulation. The user says it's *not* manipulation. To keep Prop 3, the definition of manipulation must allow for *choice architecture* that leverages inertia, provided exit is easy. This contradicts Prop 1's "bypass rational capacities" because inertia *is* a non-rational capacity.
