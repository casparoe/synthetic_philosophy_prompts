      *Let's look at Prop 5 again.* Strategic timing. If I don't tell you I'm timing this, is it hidden? Yes. Is it wrong? User says no. So "Hidden workings" isn't the sole criterion. It must be "Hidden workings *that prevent assessment*." Timing helps assessment (by making you rested). Subliminal ads prevent assessment.
      *Refinement:* The definition needs to be about *capacity to assess*, not just the presence of non-rational triggers.

