  # JOINT STATEMENT OF ADVERSARIAL COLLABORATION
  **Subject:** The Structure of Practical Reason and the Ideal-Advisor Model  
  **Participants:** Proponent of the Ideal-Advisor View (IAV) | Proponent of the Alienation Objection (AO)  
  **Date:** October 26, 2023

  ---

  ## I. AGREED CLAIMS
  *The following propositions represent the common ground established during this collaboration. Both parties endorse these claims as accurate descriptions of the dialectical landscape and shared commitments.*

  1.  **The Agent-Connection Requirement:** Any plausible theory of practical reason or personal good must maintain a non-accidental connection to the agent's own perspective. Purely external standards that ignore the agent's motivational set entirely fail to capture the normative force of "reasons for action."
  2.  **The Relevance of Epistemic Conditions:** Actual desires and endorsements are frequently distorted by ignorance, logical error, and coercive circumstances. A theory of practical reason must account for the normative significance of correcting these distortions.
  3.  **The Continuity Intuition:** There is a prima facie constraint on theories of personal good: the entity determining the good must be recognizably continuous with the actual agent. If the "idealized" agent is too psychologically distant, the normative authority of its judgments over the actual agent becomes questionable.
  4.  **The Dilemma Structure:** The debate is accurately characterized by a tension between *normative traction* (the ability to critique actual desires) and *identity preservation* (the ability to claim the idealized desires belong to the same person). Both parties agree that maximizing one tends to minimize the other.
  5.  **Non-Descriptivism:** Both parties agree that analyzing "what is good for a person" is not merely a descriptive psychological task but involves normative judgment about which psychological states are authoritative.

  ---

  ## II. RESIDUAL DISAGREEMENTS
  *The following table outlines the specific points of divergence. Wording has been negotiated to ensure neither party feels mischaracterized.*

  | Topic | Formulation Acceptable to IAV | Formulation Acceptable to AO |
  | :--- | :--- | :--- |
  | **The Identity Threshold** | The idealized agent remains the *same person* provided the procedural conditions of deliberation are met, regardless of substantive preference change. | The idealized agent counts as the *same person* only if substantive psychological continuity (core values/narrative) is preserved alongside procedural conditions. |
  | **Source of Normativity** | The authority of the ideal endorsement derives from the *procedure* itself (autonomy + rationality). | The authority of the ideal endorsement derives from the *relationship* between the outcome and the actual agent's existing identity or objective goods. |
  | **Status of the Dilemma** | The tension between traction and continuity is a manageable parameter to be calibrated, not a fatal logical flaw. | The tension constitutes a fatal dilemma: any calibration either fails to critique flawed desires or fails to bind the actual agent. |

  ---

  ## III. CRUXES OF THE DEBATE
  *We have identified three specific theoretical cruxes. For each, we specify a probative case, the argumentative stake, and the divergent predictions each side makes regarding what the case demonstrates.*

  ### Crux 1: The Circularity of "Correct Reasoning"
  *   **The Issue:** IAV relies on "correct reasoning" to filter desires. AO argues that defining "correct" presupposes a normative standard of the good, rendering the procedure circular or covertly externalist.
  *   **Probative Case:** *The Instrumental Error.* An agent desires to drink a liquid because they believe it is water (quenching thirst), but it is actually petrol. They reason instrumentally: "If I drink this, thirst quenched."
  *   **IAV Prediction:** This case shows that "correct reasoning" is internal to agency. Correcting the factual error reveals the *true* desire (to quench thirst, not drink petrol). This is benign circularity: we define reason by the standards of agency itself.
  *   **AO Prediction:** This case works only because "thirst-quenching" is objectively good for the organism. If the agent desired to drink petrol for its own sake (aesthetic masochism), "correct reasoning" would not rule it out unless we smuggle in an external standard of "healthy desires." This shows the vicious circularity: "correct reasoning" only works if it already knows the good.

  ### Crux 2: Adaptive Preferences and Contentment
  *   **The Issue:** In cases of oppression, agents may report contentment with deprived conditions. IAV claims idealization reveals this as false endorsement; AO claims idealization either validates the contentment (failing traction) or creates a rebel stranger (failing continuity).
  *   **Probative Case:** *The Happy Slave.* An agent, born into servitude, reports deep satisfaction with their role, citing community and duty. They lack knowledge of the outside world.
  *   **IAV Prediction:** Under *vivid* appreciation of alternatives and freedom from *coercive* conditioning (not just physical force, but psychological shaping), the agent would not endorse the servitude. The "contentment" is a distortion, not a true endorsement.
  *   **AO Prediction:** If we remove the coercive conditioning, we fundamentally alter the agent's character. If they remain content, the theory validates oppression. If they become rebellious, the "rebel" is a new person created by the theory, not the original slave. The theory cannot have it both ways.

  ### Crux 3: Path Dependence and Ordering
  *   **The Issue:** Different sequences of information disclosure or therapeutic interventions lead to different "idealized" endpoints. If the endpoint depends on the path, the "ideal self" is not unique.
  *   **Probative Case:** *The Therapy vs. Education Order.* Agent A has a phobia. Path 1: Give full biological info first, then therapy. Path 2: Therapy first, then biological info. Resulting preferences differ.
  *   **IAV Prediction:** Path dependence indicates *incomplete* idealization. A truly *full* and *stable* equilibrium exists (a fixed point). Apparent divergence is due to stopping the process too early.
  *   **AO Prediction:** There is no fixed point. The self is constituted by its history. Changing the order of deliberation changes the person. Therefore, there is no single "ideal advisor," only a spectrum of possible strangers. This supports the "Stranger" horn of the dilemma.

  ---

  ## IV. ANALYSIS OF VERBAL DISPUTE
  *We have examined whether the disagreement is merely terminological. We conclude the following:*

  **1. The Deflationary Reading (Verbal Component):**
  There is a verbal dispute regarding the label **"Welfare" (or "Good For").**
  *   **IAV Usage:** Uses "Welfare" to mean *Rational Prudence* (what the agent's rational nature dictates).
  *   **AO Usage:** Uses "Welfare" to mean *Psychological Well-Being* (what benefits the existing narrative organism).
  *   **Agreement:** Both parties can accept that these are two distinct concepts. If IAV speaks of "Rational Prudence" and AO speaks of "Psychological Well-Being," the confusion regarding whether the idealized agent "benefits" the actual agent diminishes. IAV admits the idealized agent might not maximize Psychological Well-Being (e.g., the rebellious slave); AO admits the actual agent might lack Rational Prudence.

  **2. The Surviving Substance (Non-Verbal Component):**
  Even after disambiguating "Welfare," a substantive disagreement remains regarding **Normative Authority.**
  *   **The Question:** *Why* should the actual agent care about the dictates of Rational Prudence if they conflict with Psychological Well-Being?
  *   **IAV Stance:** The agent *must* care because rationality is constitutive of agency. To ignore the ideal advisor is to be irrational.
  *   **AO Stance:** The agent is not bound by a rationality that alienates them from their own life. Authority requires identity, not just coherence.
  *   **Conclusion:** This is not verbal. It is a fundamental metaphysical disagreement about whether "the self" is defined by its *potential rationality* (IAV) or its *actual psychological continuity* (AO).

  ---

  **Signed,**

  _________________________  
  *Proponent, Ideal-Advisor View*

  _________________________  
  *Proponent, Alienation Objection*
