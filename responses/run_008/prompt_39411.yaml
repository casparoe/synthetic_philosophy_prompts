answer: |-
  Your hunch is excellent. You have correctly identified that the physicist's argument relies on a conflation of *diachronic updating* (how beliefs change over time) with *synchronic support* (the logical relation between evidence and hypothesis), and that he is treating a known limitation of a specific model as a fatal refutation of the entire framework.

  The argument he presented is the famous **"Problem of Old Evidence,"** articulated by Clark Glymour in 1980 (*Theory and Evidence*). It is a staple of graduate seminars in philosophy of science. While it is a serious challenge that forced Bayesians to refine their models, claiming it "refuted the whole Bayesian confirmation program" is, as you suspected, rhetorically confident but philosophically unsustainable. Bayesianism remains the dominant framework in formal epistemology precisely because it absorbed this critique.

  Here is a breakdown of where the physicist is right, where he conflates concepts, and how you might handle the next faculty dinner.

  ### 1. The Valid Core of the Argument
  The physicist gets the math and the history right.
  *   **The Math:** In strict Bayesian conditionalization, if an agent assigns probability 1 to evidence $E$ (i.e., $P(E) = 1$), then conditioning on $E$ cannot change the probability of any hypothesis $H$. Mathematically: $P(H|E) = P(H \cap E) / P(E)$. If $P(E) = 1$, then $P(H \cap E) = P(H)$, so $P(H|E) = P(H)$. No probability raising occurs.
  *   **The History:** The anomalous perihelion of Mercury ($E$) was indeed known (calculated by Le Verrier in 1859) before Einstein formulated General Relativity ($H$) in 1915.
  *   **The Intuition:** Scientists universally agree that GR was confirmed by its ability to explain this anomaly.

  If Bayesianism requires confirmation to be *actual belief updating via conditionalization*, then Bayesianism cannot model this historical case. On this narrow point, the physicist is correct.

  ### 2. The Conflations (Where the Argument Fails)
  The leap from "Standard Conditionalization fails here" to "Bayesian Confirmation is Refuted" relies on two conflations.

  #### A. Confirmation vs. Updating
  The physicist conflates **confirmation** (a logical support relation) with **updating** (a psychological or temporal process).
  *   **Updating:** How I change my mind from Tuesday to Wednesday when I see new data.
  *   **Confirmation:** Whether $E$ supports $H$, regardless of when I learned $E$.

  Most contemporary Bayesians argue that confirmation should be defined by the *likelihood ratio* or by comparing the posterior to a *counterfactual prior*, not necessarily by the actual temporal sequence of belief change. The fact that Einstein didn't change his mind about Mercury (he already knew it) doesn't mean Mercury didn't support GR. It means the *discovery context* differs from the *justification context*. The physicist treats Bayesianism as a history of discovery, whereas most proponents treat it as a logic of justification.

  #### B. "Known" vs. "Probability 1"
  The physicist assumes that because the data was "known," a rational agent must assign it $P(E) = 1$.
  *   **Strict Bayesianism:** Often idealizes agents as logically omniscient. If you know $E$, $P(E)=1$.
  *   **Realistic Bayesianism:** We can be highly confident in data without assigning it logical certainty ($P(E) < 1$). However, for Mercury, $P(E)$ was so close to 1 this fix is weak.
  *   **The Better Distinction:** What Einstein actually learned in 1915 wasn't $E$ (the perihelion shift); he already knew that. What he learned was the **logical connection** between $H$ and $E$. He learned that $H \vdash E$ (General Relativity entails the perihelion shift).

  ### 3. The Standard Fixes (How Bayesians Responded)
  You mentioned "counterfactual likelihoods." There are two main ways Bayesians (like Colin Howson, Daniel Garber, and others) solved this.

  #### Solution 1: The Garber-Style Solution (Learning Entailment)
  This is the most historically accurate fix for the Einstein case.
  Einstein's probability function in 1915 didn't change on $E$. It changed on the proposition $K$: "Hypothesis $H$ entails Evidence $E$."
  Before 1915, Einstein knew $E$, but he did not know $K$ (because he didn't have the theory).
  When he derived GR, he learned $K$.
  We can model this by expanding the probability space. Let $K$ be the proposition "$H$ implies $E$."
  Even if $P(E) = 1$, learning $K$ can raise the probability of $H$.
  $$P(H | E \land K) > P(H | E)$$
  Since $E$ was already certain, the "new" information is $K$. This preserves the Bayesian machinery while acknowledging that the "news" was the derivation, not the data.

  #### Solution 2: The Howson-Style Solution (Counterfactual Priors)
  This addresses the definition of confirmation directly. Colin Howson argued that we should define confirmation not by *actual* belief change, but by *rational* belief change.
  To ask if $E$ confirms $H$, we ask: **"What would the agent's probability for $H$ have been, had they not known $E$?"**
  We construct a counterfactual prior probability function $P^*$ where $P^*(E) < 1$.
  If $P^*(H|E) > P^*(H)$, then $E$ confirms $H$, even if the actual agent already knew $E$.
  This separates the *logic of support* from the *chronology of discovery*. It admits that standard conditionalization is a rule for *new* evidence, but confirmation is a broader relation.

  ### 4. Verdict: Does the Physicist's Point Survive?
  The physicist's point survives only in a significantly weakened, nuanced form.
  *   **Refuted?** No. The program adapted. To say it was refuted is like saying Newtonian physics was refuted by Mercury's perihelion. Well, yes, strictly speaking, but it was subsumed into a broader framework (GR) that handled the anomaly. Similarly, Bayesianism subsumed the "Old Evidence" problem by refining its definitions.
  *   **A Limitation?** Yes. It shows that **simple conditionalization** is insufficient for modeling the history of science. It cannot capture the value of deriving known facts from new theories without modification.
  *   **The Real Takeaway:** The physicist is right that *naive* Bayesianism (the textbook definition of learning *only* by conditioning on new data) is historically inadequate. But he is wrong that this kills Bayesian confirmation theory.

  ### 5. How to Push Back at Dinner
  You don't need to become a formal epistemologist to hold your own. You can frame it in terms familiar to any philosopher: the distinction between the **context of discovery** and the **context of justification**.

  Here is a script for your next interaction:

  > "I looked into that Glymour argument you mentioned. It's the 'Problem of Old Evidence,' right? It's a classic objection, but I'm not sure 'refuted' is the right word.
  >
  > It seems the argument works only if we conflate *updating* with *support*. If Bayesianism is just a rule for how beliefs change when you get new data, then yes, it can't model Einstein. But most Bayesians treat it as a logic of justification.
  >
  > Garber's solution, for instance, suggests Einstein didn't learn the perihelion data was true; he learned that his theory *entailed* the data. That's new information that allows for conditionalization. Or, like Howson suggests, we assess confirmation by asking what our priors *would* have been counterfactually, not what they actually were.
  >
  > So, it's definitely a constraint on simple models, but claiming it refutes the whole program seems like claiming Zeno's paradoxes refute the possibility of motion. It highlights a complexity in the model, not a failure of the framework."

  **Summary for your confidence:**
  1.  **Physicist is right** that $P(E)=1$ blocks standard conditionalization.
  2.  **Physicist is wrong** that this refutes Bayesianism; it merely refutes *naive* conditionalization as a complete theory of confirmation.
  3.  **The Fix:** Distinguish learning the *data* (old) from learning the *entailment* (new), or use counterfactual priors.
  4.  **Your Stance:** The argument identifies a boundary condition, not a falsification.

  You are on solid ground. The physicist is applying a "gotcha" from 1980 as if it were breaking news, unaware that the field spent the last 40 years successfully integrating that very objection.
