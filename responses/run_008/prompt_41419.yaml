  2.  **Deconstruct Task 1: Progressive or Degenerating? (The Scaling Programme)**
      *   *Lakatos's Criteria:* A programme is theoretically progressive if it predicts novel facts. It is empirically progressive if some of those predictions are corroborated. It is degenerating if it only explains what is already known (post hoc accommodation) or if the protective belt grows ad hoc without new content.
      *   *The Scaling Hypothesis:* "More compute + data + params = better performance."
      *   *Novelty Problem:* Benchmarks are known *before* the run. Is passing a new benchmark a "novel fact"? Lakatos distinguishes between heuristic novelty (theory precedes fact) and use novelty (fact not used to construct theory). In DL, benchmarks are often created, *then* models are trained to beat them. This looks like accommodation.
      *   *However:* The *Scaling Laws* (power laws relating loss to compute) were predicted (Kaplan et al., 2020) and then verified. This is a strong candidate for theoretical progress.
      *   *Emergent Abilities:* Claims that abilities "pop" at scale. Are these predictions or retroactive descriptions? Often retroactive.
      *   *Verdict:* It's mixed. The scaling laws themselves are progressive. The specific capabilities are often accommodated. But Lakatos allows for a "time lag."
      *   *Extrapolation:* Lakatos might view the "Bitter Lesson" not as a theory but as a heuristic. The *laws* are the theory.
