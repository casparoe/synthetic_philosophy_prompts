answer: |-
  Your diagnosis is substantially correct, but it requires a slight refinement to fully dissolve the impasse. You identify the disagreement as verbal and temporal (pre-theoretic vs. reformed concept). I argue the disagreement is verbal and **categorical**. The stalemate persists not merely because parties are looking at different historical stages of the word "effective," but because they are conflating two distinct modalities: an **epistemic/normative** constraint (what a human can *justify* as a calculation) and an **ontic/physical** constraint (what a physical system can *causally* evolve).

  Here is the detailed diagnosis of the structure, the substantive remainder, and the implications for your "Refutation Test."

  ### 1. The Categorical Confusion
  Your hypothesis that the disagreement turns on the history of the concept is accurate, but the "stages" are not just temporal (1936 vs. now); they are categorical.

  *   **Turing's 1936 Thesis (CTT-Human):** This is a claim about the limits of **human epistemic access**. It analyzes the notion of a "finite procedure" that a human can follow without insight. It is a thesis about the structure of human cognition and notation. Its status is indeed quasi-empirical/philosophical: it claims that our informal notion of "calculation" maps to Turing-machine steps.
  *   **The Physical Thesis (CTT-Physical):** This is a claim about the **causal structure of the universe**. It asserts that no physical system can generate sequences of digits that a Turing machine cannot. This is the domain of Camp 3 (Gandy, etc.).
  *   **The Formalist Stipulation (CTT-Definition):** This is a move to secure the foundations of logic (Camp 2). It declares that "computable" *means* "Turing-computable" to avoid ambiguity in metamathematics.

  The impasse exists because arguments for one category are deployed to defend claims in another.
  *   When Camp 1 offers "overwhelming evidence" (no counterexamples found), they are usually citing the failure to find a *human* algorithm that exceeds Turing machines.
  *   When Camp 3 worries about analog or relativistic hypercomputation, they are worrying about *physics*, not human cognition.
  *   When Camp 2 calls it a definition, they are trying to protect logic from the instability of Camp 3's physics.

  The disagreement is verbal because the term "Church-Turing Thesis" is used as a single label for three distinct claims. If we forcibly distinguish **CTT-Human** (cognitive limits), **CTT-Physical** (causal limits), and **CTT-Logical** (semantic stipulation), 90% of the friction vanishes.

  ### 2. The Substantive Remainder
  You ask if there is a genuine substantive question lurking that concept-stages cannot dissolve. There is one, but it is not about the thesis itself; it is about the **determinacy of the pre-theoretic concept**.

  The substantive question is: *Did the informal notion of "effective calculability" possess an extension prior to 1936, or did it have "open texture"?*
  *   If it had a fixed extension (Platonist view of concepts), then CTT is a discovery (Camp 1).
  *   If it had open texture (Wittgensteinian view), then CTT is a precisification (Camp 2).

  This is a genuine philosophical disagreement about the nature of concepts and meaning. However, it is **undecidable** within the framework of the dispute. No amount of formal result or physical discovery can settle whether a pre-1936 mathematician "meant" Turing machines implicitly. Therefore, while substantive, this question is a dead end for resolving the CTT dispute. It explains *why* the camps exist, but it cannot be used to *choose* between them.

  ### 3. The Refutation Test
  Your test is the strongest evidence for the verbal diagnosis. You ask: *Would a physical hypercomputer refute the thesis?*

  *   **For Camp 1 (Quasi-empirical):** Yes. It falsifies the hypothesis that "effective" maps to "Turing."
  *   **For Camp 2 (Stipulative):** No. They will retort that a hypercomputer is, by definition, not "effectively calculable" in the sense required for logic, or that the term "computable" has been successfully captured by Turing, and the new device requires a new word (e.g., "super-computable").
  *   **For Camp 3 (Physical):** It refutes CTT-Physical, but leaves CTT-Human untouched. (A human cannot manually simulate the hypercomputer's infinite precision steps, even if the machine can perform them).

  The fact that the *description of the event* changes based on the camp's prior commitment confirms that the dispute is not about the world, but about the **linguistic governance** of the term "computable." If a dispute were substantive, a shared observation would force convergence. Here, the observation is assimilated into the existing semantic framework of each camp.

  However, there is a nuance. If a hypercomputer were found that a **human** could operate to produce non-Turing outputs (e.g., a physical oracle a human can query and trust), then CTT-Human would be refuted. This is the only scenario where Camp 2's stipulation would face genuine crisis, as their "definition" would no longer capture the intuitive notion of "what a human can calculate." But since all current hypercomputation proposals rely on physical properties inaccessible to human verification (infinite precision, infinite time, etc.), CTT-Human remains safe, and the verbal shield holds.

  ### 4. Prospects for Progress
  Given this diagnosis, what counts as progress?

  *   **Not Resolution:** You should expect the camps to persist indefinitely if the question remains "Is the Church-Turing Thesis true?" The question is ill-formed.
  *   **Disambiguation:** Progress consists in retiring the umbrella term "Church-Turing Thesis" in rigorous contexts. We should speak of the **Turing Analysis of Human Computation** (philosophical/psychological claim), the **Physical Computability Thesis** (scientific hypothesis), and the **Formal Definition of Recursiveness** (mathematical convention).
  *   **The "Human-Clerk" Restriction:** You noted Camp 3's focus on the human clerk. This is the lever for progress. Acknowledging that Turing's 1936 argument *only* secures CTT-Human, and that CTT-Physical requires additional premises (like Gandy's principles or the Church-Turing-Deutsch principle), forces Camp 1 and Camp 2 to admit their scope is limited.
  *   **Physical Discovery:** A discovery of hypercomputation would not "refute the thesis" simpliciter. It would force a **terminological split**. We would say, "Turing computability is the limit of *human* effective calculation, but not the limit of *physical* information processing." This validates Camp 3's suspicion that the literature has been waylaid by conflation.

  ### Conclusion
  Your hypothesis is correct: the impasse is verbal, rooted in the conflation of a historical concept analysis with a physical hypothesis and a logical stipulation. The analogy to simultaneity is apt, but with a caveat: in relativity, the theory *forced* the concept change. In computability, the theory *preceded* the physical investigation, allowing the semantic camps to fortify themselves against empirical data.

  There is no resolution to the question "Which camp is right?" because they are answering different questions. Progress lies only in recognizing that **CTT-Human** is a philosophical claim about cognition, **CTT-Physical** is a scientific hypothesis about the universe, and **CTT-Logical** is a useful definition for metamathematics. Until the literature enforces this trichotomy, the disagreement will remain a stable equilibrium of talking past one another. The "Refutation Test" confirms this: if no conceivable empirical outcome can force semantic convergence, the dispute is not about the empirical outcome.
