      *   *Key Distinction:* **Status vs. State.**
          *   Brain tumour/Fevers: Temporary or structural loss of *status* as a moral agent (Objective Stance required).
          *   Cruel Childhood: Retains *status*, but the *state* of their will is constrained. We modify the attitude (mitigation) rather than exempt.
          *   Dog/Tool: They lack *status*, but we engage in a *quasi-participant stance*.
      *   *Better approach:* Focus on the *communicative nature* of reactive attitudes. They are a demand for regard.
      *   *Proposed Principle:* **The Reciprocal Recognition Principle.** Reactive attitudes are fitting responses to the perceived quality of will in a being that is (a) capable of understanding and responding to normative demands, and (b) currently operating with sufficient functional autonomy. Where (a) is absent (dogs, tools), attitudes are *quasi-fitting* (emotional truths, not moral truths). Where (b) is compromised (tumour), exemption applies. Where (a) is present but (b) is historically constrained (childhood), mitigation applies.

      *   *Actually, let's look closer at the Dog case.* The user says gratitude to the dog *seems fitting*. If I say "No, dogs aren't moral agents," I'm overturning their verdict. Strawson allows for this. We treat pets as honorary persons. The tool is the edge case.
