  2.  **Initial Brainstorming & Philosophical Context:**
      *   The user is essentially rediscovering P.F. Strawson's "Freedom and Resentment" (1962). The term "reactive attitudes" is the giveaway.
      *   *Strawson's Core Idea:* Reactive attitudes are responses to the *quality of will* others display toward us. Exemptions occur when the agent is not a full participant in interpersonal relationships (e.g., children, mentally ill).
      *   *The User's Struggle:* The "partial exemption" (cruel childhood) is a classic compatibilist/incompatibilist tension. Determinism vs. Moral Responsibility.
      *   *The Dog/Tool Problem:* This touches on the "participant stance" vs. "objective stance." Can we have reactive attitudes toward non-moral agents? Strawson says we can have *vicarious* or *analogous* feelings, but strict moral gratitude requires moral agency.
      *   *Candidate Principles:*
          1.  *Causal Determination:* If caused by prior events, no blame. (Too strong, eliminates all responsibility).
          2.  *Control:* If they could have done otherwise, blame. (Hard to define "could have").
          3.  *Quality of Will (Strawsonian):* Focus on the attitude expressed by the action.
          4.  *Reciprocity:* Only those who can understand the rules of the community are subject to them.

  3.  **Evaluating the User's Tentative Principle:**
      *   *Principle:* "Agent had capacity to regard you as a person... manifested quality of will."
