      *   I need to distinguish between *Moral Responsibility* (blame/praise) and *Interpersonal Engagement* (the stance we take).
      *   *The "Partial Exemption" (Cruel Childhood):* This is the hardest nut. Strawson suggests we might modify our resentment (take the objective stance partially) without denying agency entirely. The principle needs to allow for *diminished* capacity without *eliminated* capacity. The brain tumour is a *local* disablement of the moral faculty; the childhood is a *developmental* shaping of it.
      *   *The Dog/Tool:* We need to distinguish between *Moral Gratitude* and *Natural/Functional Gratitude*. We treat the dog *as if* it were an agent (participant stance), but we know it isn't morally responsible. The tool is usually treated objectively, but anthropomorphism triggers a "misfire."
      *   *The Novel:* No actual will to respond to. It's a simulation.

      *   *Refined Principle Idea:* Reactive attitudes are fitting when directed at a being capable of *mutual recognition* within a shared normative community, *unless* specific incapacities suspend that participation. However, we are permitted (perhaps even prone) to project these attitudes onto beings that simulate agency, provided we recognize the projection.
