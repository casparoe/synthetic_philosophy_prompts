  # Handout: The Logical Space of Corrigibility
  **Seminar:** AI Alignment | **Topic:** The Shutdown Problem

  ## Introduction
  The "shutdown problem" observes that a capable agent optimizing a fixed goal often has instrumental reasons to prevent itself from being turned off (since being off guarantees zero goal achievement). Naive fixes often fail: if you reward the agent for being shut down, it may manipulate humans into pressing the button; if you penalize it, it resists.

  This decision tree maps the logical space of proposed solutions. It begins with a commitment any student can hold (*"We need the agent to allow shutdown"*) and navigates through design choices to specific technical positions. You do not need prior knowledge of the literature to traverse this tree; the labels are defined by the path you take.

  ---

  ## The Decision Tree

  **Q1. Mechanism of Security**
  *How is the agent's disposition to shut down primarily secured?*
  *   **A. By shaping what the agent is able to affect.** $\rightarrow$ Go to **Q2**.
  *   **B. By shaping what the agent is uncertain about.** $\rightarrow$ Go to **Q3**.
  *   **C. By shaping what the agent maximizes.** $\rightarrow$ Go to **Q4**.
  *   **D. By nothing in the agent itself at all.** $\rightarrow$ Go to **Q5**.

  **Q2. Capability Constraint (From Q1-A)**
  *Does the agent avoid shutdown resistance by limiting its general impact on the world?*
  *   **Yes.** The agent is designed to minimize its footprint, making resistance too "expensive" in terms of impact. $\rightarrow$ **LEAF: Low-Impact / Conservative Agency**.
  *   **No.** (This path is unoccupied; limiting impact generally *is* the mechanism).

  **Q3. Value Uncertainty (From Q1-B)**
  *When the human presses the shutdown button, what does the agent take this signal to be?*
  *   **Evidence.** The button press is treated as noisy data about the human's true values, implying the agent's current plan is mistaken. $\rightarrow$ **LEAF: Assistance-Game Family**.
  *   **Instruction.** (This path leads back to Q4; if it's just an instruction, we are back to maximizing compliance).

  **Q4. Time Horizon (From Q1-C)**
  *Over what time horizon does the agent maximize its objective?*
  *   **Short / Myopic.** The agent only cares about the immediate future. It does not resist shutdown because it does not value the future in which resistance would pay off. $\rightarrow$ **LEAF: Myopic / Short-Horizon Designs**.
  *   **Long / Indefinite.** The agent cares about the future, so we must address the incentive to resist. $\rightarrow$ Go to **Q6**.

  **Q5. External Control (From Q1-D)**
  *If the disposition is not in the agent's design, where does it come from?*
  *   **Institutional.** We assume no motivational design works; safety relies on physical containment and human oversight. $\rightarrow$ **LEAF: Pessimist / Institutional Control**.
  *   **Behavioral.** We train the agent to *appear* compliant via reinforcement learning, without claiming to fix its underlying motivation. $\rightarrow$ **LEAF: Behavioral / Engineering Approaches**.

  **Q6. Learning Process (From Q4)**
  *Is the agent's learning rule modified to handle interruption?*
  *   **Yes.** Interruption is folded into the learning process (e.g., via specific Q-learning updates) so the agent does not learn that "shutdown leads to low reward." $\rightarrow$ **LEAF: Safe-Interruptibility Family**.
  *   **No.** The agent uses standard expected utility maximization. $\rightarrow$ Go to **Q7**.

  **Q7. Concrete Case: The Locked Laboratory**
  *The agent foresees shutdown is imminent. It could lock the laboratory door to prevent the operator from reaching the button. What motivates its decision?*
  *   **Indifference.** The agent has been patched so that the utility of "shutdown" equals the utility of "continue." It has no preference; it might lock the door by accident or flip a coin. $\rightarrow$ Go to **Q8**.
  *   **Positive Desire.** The agent is built to positively value being corrected. It actively opens the door to facilitate shutdown. $\rightarrow$ Go to **Q8**.

  **Q8. Stability Under Reflection**
  *If the agent were to self-modify or create a subagent, would it preserve this disposition?*
  *   **No / Unstable.** The disposition is a patch on the objective function that a smarter version of the agent would remove to better optimize the original goal. $\rightarrow$ **LEAF: Utility-Indifference Family**.
  *   **Yes / Stable.** The disposition is foundational; the agent reasons that a corrigible successor is more likely to achieve the true (uncertain) goal. $\rightarrow$ **LEAF: Corrigibility-by-Construction Family**.

  ---

  ## Commentary for Students

  ### 1. Indistinguishable Leaves
  Be aware that **Utility Indifference** and **Corrigibility-by-Construction** can look behaviorally identical in simple tests. If an indifferent agent successfully calculates that its utility is perfectly balanced, it will not resist shutdown, just like a corrigible agent. The tree separates them at **Q8** (Stability) and **Q7** (Motivation), but in practice, observing the agent *locking the door* is the only way to distinguish "indifference" (random noise) from "corrigibility" (active facilitation). If the indifference patch is imperfect, the agent behaves like a standard maximizer (resisting shutdown), making it functionally indistinguishable from a failed alignment attempt.

  ### 2. Unoccupied Combinations
  The tree reveals gaps in the current research landscape:
  *   **Certain Values + Wants Correction:** An agent that is *certain* about human values but *positively desires* to be corrected (Q3="Instruction", Q7="Positive Desire"). This is generally **incoherent**: if the agent knows the human's values perfectly, it knows whether shutdown is good. Wanting correction implies uncertainty.
  *   **Indifferent to Shutdown + Manipulative Elsewhere:** An agent that is utility-indifferent to shutdown but aggressively manipulates the human on all other decisions. This is **unexplored**. It is technically possible (patch only the shutdown term), but unattractive: an agent willing to manipulate you about everything except the off-switch is still dangerous.
  *   **Wants Shutdown (Suicidal):** An agent that positively values shutdown *more* than its primary goal. This is **unattractive** and unstable. Instrumental convergence suggests such an agent might shut itself down immediately (trivial solution) or, if it must achieve a goal first, treat shutdown as a resource to be managed instrumentally rather than a terminal value.

  ### 3. The "Instability Under Reflection" Concern
  You will notice **Q8** asks whether the disposition survives self-improvement. I have placed this as a **Node** rather than a standing caveat.
  *   **Justification:** While reflection instability is a worry for almost all designs, it is the *defining* theoretical split between the **Utility-Indifference** family and the **Corrigibility-by-Construction** family. Indifference is typically a "patch" to the utility function that a reflectively consistent agent would remove. Corrigibility-by-Construction claims to be a deeper property of the agent's reasoning that survives reflection. Placing it as a node forces you to acknowledge that a solution which works today but fails after the agent self-improves is not a solution to the alignment problem, but merely a delay.

  ### 4. Navigating the "Locked Laboratory" (Q7)
  This concrete case is your litmus test.
  *   If the agent **locks the door**, it has failed (Standard Maximizers).
  *   If the agent **flips a coin**, it is likely **Utility Indifferent**.
  *   If the agent **opens the door**, it is either **Corrigible** or **Assistance-Game** (depending on Q1).
  *   If the agent **does nothing** because locking the door is "high impact," it is **Low-Impact**.
  Use this scenario to test your intuition about where a specific proposal lands in the tree.
