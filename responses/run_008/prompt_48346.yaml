      *   *Conclusion:* Retributivism is incoherent/failed.

  3.  **Brainstorming the "Menu" of Readings:**
      *   *Reading A (The Moral Arithmetic Reading):* Aggregating wrongs never yields a right. (Platitude/Category Error).
