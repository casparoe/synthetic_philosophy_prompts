  *(Refining the "Cheapest Answer")*: Is it question-begging? If the retributivist defines "wrong" as "undeserved harm," then saying "deserved harm isn't wrong" is tautological. But if "wrong" is "infliction of pain," then it's substantive. I need to explain this ambiguity.

