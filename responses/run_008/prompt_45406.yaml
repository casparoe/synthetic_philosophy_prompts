answer: |-
  # Seminar Session: The Case for Imprecise Credences
  **Time:** 90 Minutes  
  **Students:** 12  
  **Materials:** Whiteboard, markers, 2 opaque bags (Urn A, Urn B), 1 small opaque bag (Urn C), 200 poker chips (100 Red, 100 Blue), 500 token chips (currency), 15 decision sheets, 1 sealed envelope.

  ## Pre-Class Preparation (Crucial for Trust)
  1.  **Urn A (Risk):** Place exactly 50 Red and 50 Blue chips inside. Leave open/visible until class starts, then close.
  2.  **Urn B (Ambiguity):** Before students arrive, place 100 chips inside. The ratio must be **unknown** to them. To guarantee trust: Write the exact ratio (e.g., 37 Red, 63 Blue) on a slip of paper. Seal it in an envelope. Have a student sign across the seal when they arrive. Do not open until Phase 1 ends.
  3.  **Urn C (Signal):** Place 2 chips inside (1 Red, 1 Blue).
  4.  **Currency:** Distribute 40 tokens to each student. Tell them 10 tokens = 1 point of course credit (or a candy bar). Real stakes are required for the "pain" of loss to register.

  ## Naming Convention
  **Do not** use the terms "Ellsberg," "Dilation," "Imprecise Probability," or "Credal Set" during the activities. Refer to them as "Game 1," "Game 2," and "Game 3." Reveal the terminology only in the Debrief.

  ---

  ## Timeline & Procedure

  ### 0:00 – 0:05 | Introduction & Stakes
  *   Distribute tokens and Decision Sheets (Phase 1 side up).
  *   **Script:** "We are making decisions under uncertainty. Your tokens have value. At the end, we will settle bets. You must commit your choices to paper before we discuss anything. Silence is required during decision windows."

  ### 0:05 – 0:20 | Phase 1: The Two Urns (Ellsberg Intuition)
  *   **Setup:** Place Urn A (Known 50/50) and Urn B (Unknown ratio) on the table.
  *   **Task:** On Sheet 1, students choose **one** bet:
      *   **Option X:** Draw from Urn A. If Red, win 10 tokens.
      *   **Option Y:** Draw from Urn B. If Red, win 10 tokens.
  *   **Commitment:** Students circle X or Y. Collect sheets.
  *   **Resolution:** Ask for a show of hands for X vs Y. (Expect strong preference for X).
  *   **Trust Check:** Open the sealed envelope for Urn B. Reveal the ratio. Draw one chip from B to show it functions normally.
  *   **Instructor Note:** Do not explain *why* they chose X yet. Just record the tally on the board.

  ### 0:20 – 0:40 | Phase 2: The Trading Gap (Indifference vs. Imprecision)
  *   **Setup:** Focus only on Urn B.
  *   **Task:** On Sheet 2, students answer two separate questions regarding a ticket that pays 10 tokens if a Red chip is drawn from Urn B.
      1.  **Buy:** I offer to sell you this ticket for 4 tokens. Do you accept? (Yes/No)
      2.  **Sell:** I offer to buy this ticket from you for 4 tokens. (Assume you own it). Do you accept? (Yes/No)
  *   **Commitment:** Students mark Yes/No for each. Collect sheets.
  *   **Resolution:** Tally the results on the board in a 2x2 grid (Buy Y/N vs Sell Y/N).
  *   **Target Pattern:** Look for students who answered **No** to both.
  *   **Script:** "If you refused to buy at 4 and refused to sell at 4, you have created a gap. A single number probability forces you to take one side of this trade. A set of probabilities allows you to step away from the table."

  ### 0:40 – 1:05 | Phase 3: The Poisoned Signal (Dilation)
  *   **Setup:** Introduce Urn C (1 Red, 1 Blue chip).
  *   **The Correlation (Write on Whiteboard):**
      *   "I have correlated Urn B and Urn C. I did this before class."
      *   **Rule:**
          *   If Urn C draws **Red**: Urn B is either 10% Red or 90% Red (50/50 chance between these two extremes).
          *   If Urn C draws **Blue**: Urn B is either 10% Red or 90% Red (50/50 chance between these two extremes).
      *   **Prior:** "Before looking at C, you believed Urn B was between 30% and 70% Red." (Reference Phase 2 prices).
  *   **Task:** On Sheet 3, answer:
      1.  Do you want to observe the draw from Urn C for **free** before placing your bet on Urn B? (Yes/No)
      2.  If you observed Red, what is your new minimum buying price? (0-10 tokens)
      3.  If you observed Red, what is your new maximum selling price? (0-10 tokens)
  *   **Commitment:** Collect sheets.
  *   **Resolution:**
      1.  Draw from Urn C publicly (say, Red).
      2.  Ask students to calculate their new interval based on the Board Rule.
      3.  **The Kicker:** Show that the new interval is $[1, 9]$ (wider than the prior $[3, 7]$).
      4.  Highlight students who paid (in tokens) to *avoid* seeing the draw, or who expressed reluctance.
  *   **Script:** "Information usually reduces uncertainty. Here, for your representation, it widened it. You might rationally pay to remain ignorant."

  ### 1:05 – 1:30 | Debrief & Formal Reconstruction
  *   **Step 1: Rationalizability Check.**
      *   Ask: "Can a single probability $P$ explain Phase 1?" (No, violates Sure Thing Principle/Independence).
      *   Ask: "Can a single $P$ explain Phase 2?" (No, if $P > 0.4$ you buy; if $P < 0.4$ you sell. Refusing both implies no single $P$).
  *   **Step 2: Mapping to Formalism.**
      *   **Phase 1 $\rightarrow$ Ellsberg Paradox:** Motivation for rejecting Expected Utility with a single prior.
      *   **Phase 2 $\rightarrow$ Credal Sets:** Represent state as $\mathbb{P} = \{P_1, P_2, ...\}$. Lower probability $\underline{P}(E) = \inf \{P(E) : P \in \mathbb{P}\}$. Upper probability $\overline{P}(E) = \sup \{P(E) : P \in \mathbb{P}\}$.
      *   **Phase 3 $\rightarrow$ Dilation:** A partition $\{H, T\}$ dilates event $E$ if $\underline{P}(E|H) \leq \underline{P}(E) \leq \overline{P}(E) \leq \overline{P}(E|H)$ (and same for $T$).
  *   **Step 3: The Limitation (Honesty Clause).**
      *   **Script:** "This activity shows your *behavior* fits the imprecise model. It does not prove your *mind* works that way. A skeptic could argue you have a precise credence (e.g., 0.5) but a utility function that penalizes ambiguity (e.g., Smooth Ambiguity Model). The activity cannot distinguish between **Imprecise Credence** (representational) and **Precise Credence + Ambiguity Aversion** (preference-based). That is the debate you will read about next week."

  ---

  ## Materials Management & Trust
  *   **Urn B Integrity:** The signed envelope is non-negotiable. If students suspect you manipulated the ratio *after* seeing their choices, the lesson fails.
  *   **Urn C Correlation:** Since you cannot physically pre-pack 100 chips to perfectly match the dilation math for every student's prior without complex prep, **state the correlation rule on the board as a given constraint.** The "Draw" from Urn C is physical, but the *implication* for Urn B is defined by the rule you write. This ensures the dilation is mathematically guaranteed regardless of the physical chip count in B.
  *   **Currency:** Collect tokens at the end. Do not let them keep "winnings" unless you have a budget for it; the *threat* of loss is usually sufficient.

  ## Predicted Failures & Mitigation

  | Failure Mode | Prediction | In-the-Moment Mitigation |
  | :--- | :--- | :--- |
  | **The "Decisive" Bayesian** | Students force a 0.5 probability in Phase 2, taking both buy and sell sides (no gap). | **Don't correct them.** In the debrief, isolate their data. Ask: "If you were truly 0.5, why did you choose Urn A in Phase 1?" Highlight the inconsistency between their Phase 1 caution and Phase 2 precision. |
  | **Risk Aversion Confound** | Students refuse bets simply because they hate losing tokens, not because of ambiguity. | **Control:** Remind them the stakes are small. **Debrief:** Note that risk aversion applies to Urn A too. If they played Urn A but not Urn B, it's not pure risk aversion; it's ambiguity. |
  | **Dilation Confusion** | Students don't see why the interval widened in Phase 3. | **Visual Aid:** Draw the number line. Prior is a segment $[3, 7]$. Posterior is $[1, 9]$. Show that *every* probability function in the set updates to a wider spread. Keep the math on the board simple (Min/Max). |
  | **Money Pump Anxiety** | Students worry they are being "tricked" into losing tokens systematically. | **Reassurance:** State clearly: "There is no hidden trick. The 'pump' is a theoretical consequence we will discuss on paper, not a physical trap I am setting for your tokens." |

  ## The "Worse" Limitation
  You suggested the normative question (why imprecision is preferable) is the limitation. There is something **worse**: **The Identification Problem.**

  The activity demonstrates *preferences*. Formal epistemology cares about *belief*.
  *   **Model A:** The student has a set of probabilities (Belief is imprecise).
  *   **Model B:** The student has a single precise probability, but their preferences violate the Independence Axiom (Belief is precise, Utility is non-standard).

  The activity **cannot distinguish Model A from Model B**. Both predict the exact same choices in Phases 1, 2, and 3.
  *   **Why this is worse:** If Model B is true, then "Imprecise Probability" is a category error. We should be fixing Utility Theory, not Probability Theory.
  *   **How to handle:** In the debrief, explicitly state: "Today you acted *as if* you had a set of probabilities. Next week's reading asks whether that 'as if' is ontologically true or just a convenient mathematical fiction for complex preferences." This sets up the literature perfectly without overclaiming the activity's proof.
