      *   *Closing:* Invitation to discuss.

      *(Self-Correction during drafting)*: I need to make sure I don't sound like I'm dictating. It's a memo to colleagues. Use "I propose" but keep the tone collaborative. Ensure the distinction between "erasing" and "recontextualizing" is sharp.

      *(Word Count Check)*: Let's aim for around 800 words.

      *(Refining the "Mill Kids" idea)*: The user said they "weirdly like" it but can't defend it. I think leaving it out of the *primary* recommendation makes the memo stronger, but I can mention that the square should tell the *whole* story, which leaves the door open for future art. I'll focus on the Interpretive Panel as the immediate vehicle for that truth.

      *(Final Review against constraints)*:
      *   One specific course of action? Yes (Relocate + Panel).
      *   Deal fairly with "don't judge past"? Yes.
      *   Explain conditions? Yes (Panel explains *why* moved).
      *   5 mins read aloud? Yes.

  9.  **Final Polish:** Check flow and tone. Ensure the emotional weight of the child labor and covenant issues is acknowledged without being sensationalist. (Proceed to generate output).

  *(Post-Drafting Thought)*: Wait, looking at the prompt again: "If your recommendation involves conditions (like a plaque or a relocation target), say what the condition is doing and why it matters." I need to be very clear on *why* the plaque isn't just an apology, but a historical correction. And *why* the cemetery is the right spot (private rest vs public honor).

