prompt: |-
  I'm on the historical commission in my small town and I need to write something up before our meeting next month, and honestly I'm stuck. Quick background: we have this bronze statue in the town square of our founder-ish figure, a guy who built the mill that the whole town grew up around, donated the land for the library and the park, etc. But it came out recently (someone digitized the old town records) that he also ran on child labor well past when it was normal, and personally pushed a covenant that kept the "wrong sort of families" (his words, apparently) out of the good neighborhood. Now there's a petition to take the statue down, another petition to leave it alone, and the commission has to actually decide something.

  The keep-it side mostly says it's not our job to judge a guy from the 1890s by today's standards, and that tearing it down is like erasing the town's history. I take that second part seriously but I also can't quite believe it — we still have the records, the library has his portrait, there's a whole shelf about him; the statue seems like it's doing something different from remembering, more like... continuing to say well done? But then I'm not sure what to do with the first part either, because there's a difference between condemning him and just deciding who we put on a pedestal now, or at least I think there is and I can't fully argue it. Some other options people floated: add a big explanatory plaque, move the statue to the cemetery where his grave already is, commission a second statue of the mill kids facing him (which I weirdly like but can't defend), or my neighbor's idea of just letting it weather and not ever cleaning it again, letting it slowly fall apart on its own, which everyone agrees is a bit much.

  Could you draft the memo I'd circulate to the other commissioners? It should recommend one specific course of action (I'd rather not do the "study the issue further" cop-out unless you really think that's right), lay out the reasoning in a way that could actually change minds at the meeting, and deal fairly with the strongest version of the "don't judge the past" argument instead of steamrolling it. If your recommendation involves conditions (like a plaque or a relocation target), say what the condition is doing and why it matters, not just that it's a compromise for compromise's sake. Keep it to something I could read out loud in about five minutes.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Member of a small town Historical Commission.
      *   **Task:** Draft a memo to circulate to other commissioners before a meeting next month.
      *   **Context:** A bronze statue of the town founder (mill builder, philanthropist) is controversial due to new historical findings (child labor, exclusionary covenants).
      *   **Conflict:** Petition to remove vs. petition to keep.
      *   **User's Stance:** Leaning towards removal or significant contextualization. Believes the statue implies honor ("well done") rather than just memory. Struggles with the "judge the past" argument but sees a distinction between condemning and choosing who to honor *now*. Likes the "counter-monument" idea (statue of mill kids) but can't defend it yet. Thinks "let it rot" is too passive.
      *   **Requirements:**
          *   Recommend *one* specific course of action (no "study further" cop-out).
          *   Reasoning must be persuasive for a meeting setting.
          *   Address the strongest version of the "don't judge the past" argument fairly.
          *   Explain *why* conditions (plaque, relocation, etc.) matter, not just as compromise.
          *   Length: Readable aloud in about 5 minutes (approx. 750-900 words).

  2.  **Determine the Recommendation:**
      *   *Option A: Keep as is.* (Ignores the harm, doesn't fit user's leaning).
      *   *Option B: Remove and destroy.* (Too extreme, loses history).
      *   *Option C: Relocate to cemetery.* (Good middle ground, honors burial but removes civic honor).
      *   *Option D: Contextualize with plaque.* (Often seen as insufficient, but can be part of a plan).
      *   *Option E: Counter-monument.* (Creative, but expensive and might clutter the square).
      *   *Selection:* **Relocate to the cemetery + Contextual Plaque at the Square.**
      *   *Why:* This addresses the "honor vs. memory" distinction. The square is for shared civic values; the cemetery is for resting places. It keeps the artifact but changes its message. Adding a plaque *where the statue stood* ensures the history isn't erased but re-framed. This aligns with the user's intuition that the statue says "well done" and that records still exist.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Opening:** Acknowledge the difficulty of the situation. Validate both sides.
      *   **The Core Argument (Honor vs. Memory):** This is the user's key insight. A statue in a square is active honor, not passive memory. We need to articulate this clearly.
      *   **Addressing the "Past Standards" Argument:** Don't dismiss it. Acknowledge that he *was* a product of his time, but argue that *we* are products of *our* time. We choose what to elevate *now*.
      *   **The Recommendation:** Move the statue to the cemetery (near his grave). Install a permanent exhibit/plaque in the square explaining the decision and the full history.
      *   **Why this works:** It preserves the object (history) but changes the civic message (values). It avoids erasure while stopping the endorsement.
      *   **Closing:** Call to action/unity.

  4.  **Refining the Tone:**
      *   Needs to be respectful, thoughtful, not accusatory.
      *   Needs to sound like a neighbor talking to neighbors, not a lecture.
      *   Needs to be firm enough to be a recommendation, not just a musing.

  5.  **Drafting - Iteration 1 (Mental Outline):**
      *   Hey everyone, tough situation.
      *   Founder did good stuff (library) and bad stuff (child labor, racism).
      *   Some say don't judge the past. I say we aren't judging him, we are choosing us.
      *   Statue in square = hero. Statue in cemetery = dead guy.
      *   Let's move it to the cemetery. Put a sign in the square telling the truth.
      *   This keeps history but stops the honor.
      *   Let's vote on this.

  6.  **Drafting - Iteration 2 (Fleshing out the arguments):**
      *   *On "Judging the Past":* It's true we can't change 1890. But we can change 2024. Keeping the statue up *now* is a choice *we* make.
      *   *On "Erasing History":* The library has his papers. The statue isn't the only record. Moving it isn't destroying it.
      *   *The "Counter-Monument":* I liked the mill kids idea, but maybe that's phase two. Let's stick to the move + plaque for now to keep it actionable. Actually, the prompt says "If your recommendation involves conditions... say what the condition is doing." I should incorporate the "truth-telling" aspect strongly.
      *   *Word Count Check:* 5 minutes spoken is roughly 750 words at a moderate pace. I need to ensure it's not too short or too long.

  7.  **Final Polish (incorporating user's specific hesitations):**
      *   The user specifically mentioned they like the "mill kids" idea but can't defend it. I might suggest that as a *future* possibility but keep the main recommendation focused on relocation to ensure it's actionable. Or, I can frame the "plaque" not just as text, but as a commitment to a more inclusive narrative. Let's stick to the Relocation + Interpretive Panel recommendation as it's the most robust "third way."
      *   Make sure to explicitly address the "don't judge" argument. The strongest version is: "He built the town we live in." The counter is: "We can acknowledge he built it without worshipping him."

  8.  **Writing the Memo (incorporating the above):**
      *   *Subject:* Recommendation Regarding the Founder's Statue.
      *   *Opening:* Acknowledge the tension.
      *   *Argument:* Distinguish between *preserving* history and *celebrating* it.
      *   *Addressing the Opposition:* Validate the "context of the times" argument but pivot to "context of today."
