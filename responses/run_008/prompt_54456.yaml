  taking a phil of mind course rn and we just covered the view that consciousness is basically a user illusion — the brain constructs a simplified interface, like a computer desktop, and what we call experience is just that interface doing its job. here's my problem though: every illusion has to be experienced by somebody, so an illusion of consciousness would already have to be conscious, which means the whole view refutes itself. my TA says this is basically settled and that's why no one serious works on it anymore, but then why do I keep seeing papers and book chapters from people defending it? is that whole camp just missing the obvious, or am I missing something? also when you answer, could you seperate what's genuinely settled in this debate from what's actually contested between people who know the literature — I don't want to write my essay treating one side's knockdown objection as the consensus when the other side has replies I haven't heard.
