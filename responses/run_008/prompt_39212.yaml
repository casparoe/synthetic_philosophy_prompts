      *   *Requirement 1: Normativity (The Error Condition).* Matches user's "Error without malfunction." Needs to distinguish *misrepresentation* from *mere variation*.
      *   *Requirement 2: Determinacy (The Disjunction Problem).* Closely related to #1. The content must be specific (Flies) not disjunctive (Flies OR BBs).
