answer: |-
  We, the undersigned students, submit this joint statement to record the results of our adversarial collaboration regarding the enforcement of morality by the criminal law, originating in the exchange between Patrick Devlin and H. L. A. Hart. Having sought to clarify rather than resolve our differences, we agree first, that the harm principle cannot be reduced to immediate physical injury but must account for long-term structural damage to agency and social cooperation; second, that Lord Devlin's conception of society must refer to a cooperative framework capable of persisting over time rather than the transient preferences of a current majority; third, that a distinction must be maintained between morality as a sociological fact of shared belief and morality as a normative standard of right conduct; fourth, that feelings of disgust or intolerance are epistemically unreliable indicators of genuine moral truth or social necessity; and fifth, that the criminal law is inherently limited in its capacity to cultivate virtue and cannot coerce inner conviction without self-defeating results. Despite this consensus, we diverge on the threshold for state intervention, where the Devlinian signer maintains that where a shared moral norm is demonstrably constitutive of the social bond, its erosion constitutes a public wrong sufficient for legal scrutiny even absent a specific victim, whereas the Hartian signer maintains that without an identifiable harm to interests or rights, the preservation of a moral environment remains a matter for social persuasion rather than legal coercion, though she acknowledges that the degradation of public standards is a real object of concern that must be addressed non-coercively. We confront the asymmetry inherent in our positions, wherein the Devlinian signer acknowledges that this logic logically licenses the enforcement of any morality that achieves shared status, including newly emergent progressive moralities regarding speech or association, and accepts this consistency as a feature rather than a bug of the argument, while the Hartian signer notes that this consequence embarrasses the Devlinian position more than it does the Hartian, because it reveals that the Devlinian defense rests on the fact of sharing rather than the truth of the morality, thereby granting the state standing to enforce error so long as it is popular. We recognize that part of our dispute has turned out to be verbal, specifically regarding whether the degradation of public standards counts as a harm to individuals indirectly, since we often used immorality and harm to pick out different aspects of the same social phenomenon, but we identify a genuine disagreement unlikely to be settled by any evidence either can currently imagine regarding whether the existence of a shared morality is itself a public good independent of its content. We identify two cruxes where settling a sub-question would move at least one of us, the first being whether there are genuine victimless wrongs, on which we agree the case of private cruelty indulged without witness bears decisively, such that the Devlinian predicts this will show a corrosion of character that inevitably leaks into public life causing diffuse harm, while the Hartian predicts this will show no measurable increase in public harm sufficient to justify state interference. The second crux is whether the fact that a morality is shared gives anyone standing to impose it, on which we agree the historical episode of the relaxation of divorce laws in the twentieth century bears decisively, such that the Devlinian predicts this relaxation contributed to a measurable dissolution of family stability as a social institution proving the norm was essential, while the Hartian predicts this relaxation shows society adapting without collapse, proving the moral norm was not essential to the bond. We record these predictions in advance so neither can claim victory retroactively, and we sign this to model honest disagreement made exact.
