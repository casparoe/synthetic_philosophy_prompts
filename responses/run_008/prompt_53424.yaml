answer: |-
  Your recap is accurate enough to work with. You have the geography right; now you want the geology. Here is the diagnosis.

  ### (a) Substantive or Verbal?
  **Diagnosis: It is a substantive formal dispute, not a verbal one.**

  Your hypothesis—that the camps are answering different questions under one label—is partially correct but misses the deeper conflict. It isn't just that they have different *jobs* for the concept; it's that they have incompatible **ontologies of what a theory is**.

  1.  **The Content View** treats a theory as a **set of sentences**. On this ontology, truth is binary (a sentence is in the set or it isn't). Consequently, "closeness" must be defined by set inclusion (subset/superset relations).
  2.  **The Likeness View** treats a theory as a **region in a logical space**. On this ontology, truth is a point (or region), and "closeness" is a metric distance.

  The Miller-Tichý proof is not just a technical glitch; it is a theorem demonstrating that **for false theories, logical content and metric distance are formally divergent properties.** You cannot maximize truth-content and minimize distance-from-truth simultaneously once you admit falsity.

  *   If you stick to the **Content** ontology (sets of sentences), you are logically forbidden from ordering false theories (the Miller-Tichý collapse).
  *   If you want to order false theories (the **Likeness** intuition), you must abandon the pure logic of sentences and import a **similarity metric**.

  Therefore, the debate is not verbal. It is a conflict over which formal intuition to sacrifice: the intuition that theories are linguistic objects governed by logic (Content), or the intuition that scientific progress involves shrinking error margins (Likeness). The "verbal" confusion is secondary; the primary issue is that the pre-theoretic concept of "truthlikeness" conflates two logically distinct relations that pull apart under formalization.

  ### (b) The Metric/Parameter Problem: The Actual Crux?
  **Diagnosis: This is the fatal vulnerability of the Likeness program, and it proves the concept is metaphysical, not logical.**

  You asked if the parameter-dependence (language relativity) is the crux. It is the crux of the **Likeness** camp's viability, but not the crux of the Content-vs-Likeness fight (which was settled by Miller-Tichý).

  The Consequence people treat the metric problem as fatal because they demand verisimilitude be a **logical** relation. If the ordering of theories flips based on whether you measure in Celsius or Fahrenheit, or in terms of "grue" vs. "green," then verisimilitude is not objective.

  The Likeness people (Niiniluoto, Oddie) shrug because they implicitly accept that verisimilitude is **not purely logical**. It is **metaphysical**. To define a distance metric that doesn't flip under trivial transformations, you must assume a "privileged vocabulary" or "natural properties." You have to assume the world comes carved into joints (e.g., mass and position are real parameters; "grue" is not).

  **Is this substantive or interest-relative?**
  It is substantive. It forces a commitment to **Scientific Realism**.
  *   If you are an anti-realist or a conventionalist about laws/parameters, the Likeness view collapses. There is no "fact of the matter" about which theory is closer if the parameters themselves are human constructs.
  *   If you are a realist, the problem is solvable (in principle) by appealing to the structure of the world itself.

  So, the metric problem does not show the concept is "interest-relative all the way down." It shows the concept is **ontologically expensive**. It buys you the ability to rank false theories only at the price of assuming there is a "True State Space" independent of our descriptions. The Consequence people refused to pay that price; the Likeness people paid it.

  ### (c) What Counts as Progress?
  **Diagnosis: The debate ended because the underlying framework (theories as sentences) was abandoned, not because the problem was solved.**

  You asked what would count as progress: a theorem, a convention, or an admission of relativity?
  The actual historical outcome was a **paradigm shift in the representation of theories**.

  1.  **The Impasse:** By the early 90s, it was clear that within the **syntactic view of theories** (theories as sets of sentences in a formal language), the Likeness people had won the semantic battle (you *can* define closeness) but lost the epistemic battle (you need a realist metaphysics to do it), while the Content people had lost the formal battle (Miller-Tichý).
  2.  **The Dissolution:** The debate trails off because philosophy of science moved to the **semantic view of theories** (theories as families of models).
      *   In the semantic view, we don't ask if *sentences* are close to the truth. We ask if *models* are structurally similar to the target system.
      *   This absorbs the Likeness intuition (similarity) without getting bogged down in the logical paradoxes of sentence content.
  3.  **The Heir:** The legitimate successor to the verisimilitude debate is **Structural Realism** (e.g., Worrall). Structural Realism effectively says: "We can't know if the entities (parameters) are real, so we can't define distance in parameter space. But we *can* know if the mathematical structure is preserved." This bypasses the metric problem by focusing on relations rather than values.

  **Commitment:**
  The debate did not end because people gave up, nor because it was merely verbal. It ended because **the question was absorbed by a more sophisticated framework.**
  *   **Formal Progress:** Niiniluoto's *Truthlikeness* (1987) essentially solved the formal logic of the Likeness view. The theorems exist.
  *   **Philosophical Progress:** The field realized that defining verisimilitude requires a realist metaphysics of natural properties.
  *   **Historical Outcome:** Once that cost was recognized, the field moved to Structural Realism and Model-Based views, which render the specific syntactic puzzles of the 70s and 80s obsolete.

  **Summary Diagnosis:**
  The verisimilitude debate was a **substantive collision between logic and metaphysics**. The Miller-Tichý theorem proved you cannot have a purely logical account of progress for false theories. The Likeness solution saved the phenomenon of progress but required a realist metaphysics (natural properties) to avoid language relativity. The debate "ended" when the philosophy of science community implicitly accepted that cost and shifted to model-theoretic frameworks where the problem is managed via structural similarity rather than logical content. The Skeptics were right about epistemic access, but wrong about semantic coherence; the concept is coherent, but only for realists.
