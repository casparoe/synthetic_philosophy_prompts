      *   *Crucial Nuance:* Is the narrative *felt* or *told*? Dennett leans towards the narrative being a functional abstraction generated by the brain to coordinate the "Multiple Drafts" of experience. It doesn't necessarily require a conscious, polished autobiography, but it does require a certain level of cognitive integration.
