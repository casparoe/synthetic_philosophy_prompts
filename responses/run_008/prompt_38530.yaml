  i'm a second-year phd student in phil of language and i'm TA-ing our intro course this semester, and next week is the identity-statements lecture. the students always walk out thinking "hesperus is phosphorus" is basically an astronomy fact that was true all along, and that the puzzle is just that ancient greeks were bad at stargazing. i want a decision-tree handout that forces them (and honestly me) to actually locate ourselves on the puzzle instead of nodding along.

  so: write a decision tree that starts from the shared starting point -- "hesperus is phosphorus" is informative in a way "hesperus is hesperus" is not, but both are true, and the astronomer who assents to one and not the other isn't just confused about the sky. every branch node should be a question about a concrete case, answerable without any jargon. i specifically want cases on: substituting co-referring names inside belief reports (if i believe hesperus is visible at dusk, do i automatically believe phosphorus is visible at dusk?); empty names like "vulcan" (did it mean something before we found out nothing's there?); the modal one -- whether "hesperus might not have been phosphorus" makes any sense at all (my advisor claims this is where the real action is, i'm skeptical but include it anyway); and what exactly the name contributes to the *truth* of the identity sentence, not just to how it feels.

  leaves should be: frege's own sense/reference two-level thing, the metalinguistic view (identity statements are secretly about words), descriptivism about names, millianism biting the bullet on informativeness being pragmatic, and whatever you'd call views that keep reference but add cognitive significance via guises or two-dimensional machinery. flag which pairs your tree can't actually separate -- i suspect descriptivism and fregeanism come out nearly identical if you only use these cases, and i'd rather know that than pretend the tree is cleaner than it is. also note any combination of answers that lands nowhere, and say whether thats because the view is incoherent or just uninhabited.

  keep node language undergrad-friendly, 7 or so nodes, and dont require any citations since its a handout not a paper
