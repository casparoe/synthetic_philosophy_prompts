answer: |-
  You have stumbled onto a phenomenon that is ubiquitous in long-form storytelling but notoriously under-theorized. You are correct that the standard tools—unreliable narration, retconning, multiverse theory—fail to describe it. Those tools presume a hierarchy of truth (one version is real, the other is false/illusion/alternate). Your readers are doing something more radical: they are granting **equal ontological status** to contradictory facts, provided those facts remain in their native neighborhoods.

  Here is the position you asked for.

  ### The Best Existing Fit: Paraconsistent Logic
  The closest established framework comes from logic, not literature: **Paraconsistency**.

  In classical logic, a single contradiction triggers the "Principle of Explosion" (*ex falso quodlibet*): if $A$ and $\text{not-}A$ are both true, then *any* proposition $B$ becomes true, collapsing the system into nonsense. Paraconsistent logics are formal systems designed to tolerate contradictions without exploding. Philosophers of fiction (such as David Lewis in "Truth in Fiction," and later logicians like Graham Priest) have used this to explain how we can engage with fictions that contain impossibilities (e.g., a time travel story where you kill your grandfather) without dismissing the whole work as meaningless.

  **Where it fails:**
  Paraconsistency is a **global** solution. It posits that the *entire system* (the book, the mythos) operates under rules that allow $A \land \text{not-}A$. But that is not what your readers are doing. They are not saying, "This book operates under paraconsistent logic." They are saying, "In Chapter 5, $A$ is true. In Chapter 45, $\text{not-}A$ is true." They are not holding the contradiction in mind simultaneously as a logical state; they are **compartmentalizing** it. They refuse to conjoin the premises globally. Paraconsistency explains how a contradiction can exist; it does not explain why the contradiction remains *inert* and localized rather than infecting the whole.

  ### The New Term: Diegetic Modularity
  To capture the specific configuration you describe—where truth is assessed locally within narrative units rather than globally across the corpus—I propose the term **Diegetic Modularity**.

  **Definition:**
  **Diegetic Modularity** is a narrative state in which the truth-conditions of a fiction are bound to specific, discrete narrative modules (installments, arcs, or scenes) rather than the work as a unified whole. Under Diegetic Modularity, contradictory propositions ($P$ and $\text{not-}P$) can both be "true" within the fiction, provided they inhabit different modules. The contradiction is rendered inert by the boundaries between modules, which function as logical firewalls preventing the Principle of Explosion from crossing from one module to another.

  Unlike "continuity errors" (which are mistakes to be fixed) or "multiverses" (which are separate worlds), Diegetic Modularity occurs within a single, continuous world that is nonetheless epistemically segmented by the structure of its delivery or consumption.

  ### The Boundary Case: Single Scene vs. Serial Installment
  You and your editor disagree on whether a contradiction inside a single scene behaves the same as one strung across two installments.

  **My Position:** They are **not** the same. A contradiction within a single scene breaks Diegetic Modularity; a contradiction across installments sustains it.

  **The Reasoning:**
  Diegetic Modularity relies on **cognitive separation**. For the reader to treat two contradictory facts as "both true in their parts," there must be a sufficient barrier between the parts to prevent the immediate conjunction of $P$ and $\text{not-}P$ in the reader's working memory.

  1.  **The Installment (Successful Modularity):** When a reader encounters the scar origin in Chapter 5, it is encoded as "Truth of Module 5." Two years later, in Chapter 45, they encounter the new origin. This is encoded as "Truth of Module 45." Because of the temporal distance (both in publication and reading time), the reader does not automatically merge Module 5 and Module 45 into a single logical set. The "firewall" holds. The truth is *indexical* to the installment.
  2.  **The Single Scene (Failed Modularity):** A scene is an **atomic module**. It is processed as a single temporal and cognitive unit. If you write, "She touched the scar from the ferry accident," and three paragraphs later, "She remembered the knife fight that gave her the scar," the reader is forced to hold both propositions in working memory simultaneously. There is no firewall. The conjunction $P \land \text{not-}P$ happens instantly. This triggers the "explosion" you want to avoid: the reader stops imagining the world and starts diagnosing the text. Immersion breaks because the *local* truth conditions have collapsed.

  **The Verdict:**
  Diegetic Modularity is a function of **narrative distance**. It requires the "parts of the book" to be distinct enough to function as separate contexts. An installment is a context; a scene is usually not. If you place the contradiction within a single scene, you are no longer writing a modular fiction; you are writing a paradox. Your readers will not say "both are true in their parts"; they will say "the author lost track of the sentence they just wrote."

  ### Summary for Your Argument
  You can tell your editor that you are not relying on "reader forgiveness" or "continuity drift." You are relying on **Diegetic Modularity**. It is a structural feature of serialized fiction where the installment, not the corpus, is the primary unit of truth. It works because the serialization creates natural cognitive compartments. It will fail if you collapse those compartments (e.g., by placing the contradiction in a single scene), because the logical firewall depends on the distance between the claims.

  You have not broken the book; you have simply written a modular one. The literature hasn't caught up to name it yet, but the readers have already learned how to read it.
