answer: |-
  This is an excellent dissection of a common pop-finance narrative. You have correctly identified that while the book's summary captures the *spirit* of some deep theoretical results, it conflates distinct theorems and makes a logical leap at the end that most financial economists would reject.

  The passage you are recalling is referencing the **Milgrom-Stokey No-Trade Theorem (1982)**, which is indeed built on the foundation of **Aumann's Agreement Theorem (1976)**.

  Here is a bit-by-bit breakdown of what a financial economist or Bayesian statistician would sign off on, where they would push back, and how the Grossman-Stiglitz paradox fits into the picture.

  ### 1. The Core Claim: "Rational traders with common priors shouldn't trade."
  **Verdict:** **Mostly Accurate (with strict caveats).**

  *   **What they sign off on:** The Milgrom-Stokey theorem essentially states that if traders are risk-averse expected-utility maximizers, share a **common prior** probability distribution, and have **common knowledge of rationality**, then no speculative trade will occur based on asymmetric information.
  *   **The Logic:** If I try to sell you an asset, you infer I must have negative private information. You update your belief downward. If we share a prior and know we are both rational, our posteriors will converge. If the price adjusts to reflect this pooled information, there is no longer a mutually beneficial price at which to trade.
  *   **The Pushback (Your first nagging feeling):** You asked if this hinges on the **common prior**. **Yes, absolutely.** This is the single most fragile assumption in the theorem.
      *   **Heterogeneous Priors:** If we start with different priors (e.g., I believe tech stocks generally outperform, you believe they don't), we can rationally "agree to disagree." I can interpret a signal as bullish, you can interpret the same signal as bearish, and we can trade. This trade is speculative, but it is *rational* given our different starting worldviews.
      *   **Economist View:** Many modern economists argue that assuming common priors is unrealistic. If "disagreement" is modeled as "different priors" rather than "irrationality," the No-Trade theorem dissolves, and high volume is compatible with rationality.

  ### 2. The "Counterparty Acceptance" Argument
  **Verdict:** **True in zero-sum speculative games; false in liquidity markets.**

  *   **What they sign off on:** This is the logic of **Adverse Selection**. In a purely speculative market (a zero-sum bet on price direction), if a counterparty eagerly accepts your bet, it is indeed evidence that they know something you don't. This is often called the "Winner's Curse."
  *   **The Pushback:** This logic fails if the trade is not purely speculative.
      *   **Liquidity/Consumption Needs:** As the book admits, people trade for rebalancing or consumption (e.g., I sell stock to buy a house; I buy bonds to match pension liabilities). If I am selling for liquidity, my trade contains *no information* about the asset's value. A rational buyer can take the other side of my trade without fearing they are being "picked off."
      *   **Economist View:** A huge portion of market volume is liquidity-driven (market making, hedging, index rebalancing). The fact that someone takes the other side of your trade is not evidence of your error; it might just be evidence that they are a market maker earning a spread for providing liquidity.

  ### 3. The Leap: "High Volume $\rightarrow$ EMH is Dead on Arrival"
  **Verdict:** **Logical Non-Sequitur.**

  *   **The Flaw:** This is the weakest link in the book's argument. The Efficient Market Hypothesis (EMH) claims that **prices reflect available information**. It does *not* claim that **all traders are rational** or that **trading volume must be low**.
  *   **The Economist's Counter-Argument (Friedman's Hypothesis):** Milton Friedman argued that you do not need *everyone* to be rational for prices to be efficient. You only need enough rational arbitrageurs to correct the prices set by irrational traders.
  *   **Noise Traders:** In modern microstructure theory (e.g., Kyle 1985), "noise traders" (irrational participants) are actually *necessary* for markets to function. They provide the liquidity camouflage that allows informed traders to profit. If only rational traders existed (per No-Trade), no one would trade, prices wouldn't update, and the market would freeze.
  *   **Conclusion:** High speculative volume proves that the *assumptions of the No-Trade Theorem* (common priors, pure speculation) are false. It does **not** prove that prices are inefficient. You can have a market full of irrational traders where prices remain efficient because arbitrageurs force them to be.

  ### 4. The Grossman-Stiglitz Paradox
  **Verdict:** **Complementary, not Contradictory.**

  You recalled this vaguely, but it is crucial. The **Grossman-Stiglitz Paradox (1980)** argues that perfectly informationally efficient markets are *impossible*.
  *   **The Paradox:** If prices perfectly reflect all private information, no one has an incentive to pay the cost to gather that information (why do research if the price already tells you everything?). If no one gathers information, prices become uninformed.
  *   **How it fits:**
      *   **No-Trade Theorem:** Says rational people won't trade *if* prices reveal everything.
      *   **Grossman-Stiglitz:** Says rational people won't *research* if prices reveal everything.
      *   **Synthesis:** Both theorems attack the concept of **Perfect Efficiency**. They both conclude that a market cannot be *perfectly* efficient in equilibrium. There must be *some* inefficiency (some "noise") to compensate traders for the cost of becoming informed and to incentivize them to trade.
  *   **The Book's Error:** The book uses No-Trade to say "EMH is dead because people trade too much." Grossman-Stiglitz says "Perfect EMH is impossible because people wouldn't trade/research enough." They arrive at the same destination (Perfect EMH is a theoretical impossibility) via different routes. The book's error is assuming this implies *prices are random* or *irrational*, rather than *approximately efficient with pockets of inefficiency.*

  ### 5. Is "Markets are Full of Non-Rational Traders" the Natural Lesson?
  **Verdict:** **It is *a* lesson, but not the *only* one.**

  You mentioned you are inclined to accept the moral that markets are full of non-rational traders. A behavioral financier would agree with you, but a neoclassical economist would offer two other explanations for the high volume that do not require irrationality:

  1.  **Heterogeneous Priors:** As mentioned, if we simply value assets differently based on different life experiences or models, we trade rationally. This is "speculation," but not "irrationality."
  2.  **Difference of Opinion vs. Difference of Information:** Rational agents can have the same information but process it through different models. If I think a P/E of 20 is cheap and you think it's expensive, we trade. We are both rational; we just have different risk tolerances or valuation models.

  **However,** the empirical evidence (momentum, crashes, bubbles) does lean heavily toward the **Behavioral** view. The "irrationality" explanation is currently very fashionable and well-supported by data (e.g., retail trading frenzies).

  ### Summary: What would an economist tell you?

  If you showed this passage to a financial economist, here is the feedback you would get:

  1.  **On the Theorem:** "The summary of the No-Trade Theorem is technically correct regarding the math, but it treats the 'Common Prior' assumption as a law of nature rather than a modeling convenience. Dropping that assumption kills the result."
  2.  **On Disagreement:** "Disagreement is not proof of irrationality; it is often proof of heterogeneous priors or different liquidity needs."
  3.  **On EMH:** "The conclusion that EMH is 'dead on arrival' is a category error. High volume is consistent with EMH if you allow for noise traders and liquidity needs. EMH is about price accuracy, not trader psychology."
  4.  **On Stiglitz:** "You are right to be confused. Stiglitz and Milgrom-Stokey both suggest 'Perfect Efficiency' is impossible, but for different reasons. They don't justify the claim that markets are *inefficient*, only that they cannot be *perfectly* efficient."
  5.  **On Your Bias:** "Your inclination to believe in non-rational traders is well-founded empirically, but don't use the No-Trade Theorem to prove it. Use behavioral evidence. The No-Trade Theorem is a 'knife-edge' result that breaks easily; it's not a robust proof of human irrationality."

  **The Bottom Line:** The book is right that the *strict assumptions* of the No-Trade Theorem do not hold in the real world. It is wrong to conclude that this renders the concept of market efficiency useless. The more nuanced view is: **Markets are efficient enough to make beating them difficult, but inefficient enough to allow trading to happen.** The volume you see is a mix of liquidity needs, rational disagreement (priors), and yes, a significant amount of irrationality.
