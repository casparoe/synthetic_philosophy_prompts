answer: |-
  ### Corruption Scores and Justifications

  **1. Mexico City traffic bribe: 9**
  This constitutes a direct, illegal exchange of money for the suspension of a legal duty, fitting the standard legal definition of petty corruption. While the sum is small, the transaction explicitly undermines the rule of law for private gain.

  **2. American ward boss patronage: 6**
  Although often legal or historically tolerated, steering public resources to partisan supporters prioritises political loyalty over meritocratic allocation. It sits in a grey area where democratic representation blurs into clientelistic exchange.

  **3. Italian construction bribe: 10**
  This is a clear-cut case of grand corruption involving an explicit *quid pro quo* between a private firm and a public official. It directly subverts public procurement laws for significant financial profit.

  **4. Japanese *amakudari*: 5**
  While institutionalised and often legal, this practice creates a profound conflict of interest that compromises regulatory impartiality. It is scored lower than a direct bribe because it operates within accepted bureaucratic norms rather than breaking the law.

  **5. Kenyan MP constituency funds: 7**
  Channeling public development funds to political supporters misuses state resources for electoral gain, even if constituents expect this reciprocity. It represents a form of electoral clientelism that weakens universalistic public service.

  **6. Emirati gift and university admission: 6**
  The ceremonial gift may be culturally appropriate, but the timing relative to the university admission suggests an exchange of influence (*wasta*). The ambiguity lies in distinguishing social hospitality from an implicit bribe.

  **7. German party donation: 4**
  Large donations are legal within strict regulatory frameworks, yet the timing creates a suspicion of undue influence without proof of an illegal agreement. This highlights the tension between legitimate lobbying and purchased access.

  **8. Chinese *guanxi* gift: 3**
  This act is primarily about building long-term social capital and reciprocal obligation rather than securing an immediate, specific favour. Labeling it corruption imposes a Western public-private distinction that does not align with local relational norms.

  ***

  ### Audit of the Scale

  Assigning a single score on a 0–10 linear scale is ultimately incoherent for comparative analysis because it presupposes a Weberian separation between public office and private relationship that several of these settings do not recognise. By scoring the Mexican traffic bribe as a 9 and the Chinese *guanxi* gift as a 3, the scale implicitly privileges a legalistic, universalistic definition of corruption that views the Japanese, Emirati, and Chinese examples through a Western lens of deviance. This approach obscures the functional reality that in some contexts, such 'corruption' acts as a substitute for inefficient welfare systems (as with the American ward boss) or serves as the primary mechanism for social trust (as with *guanxi*).

  Consequently, I would **replace the scale with a multidimensional typology** rather than abandoning comparison altogether. A more pedagogically useful tool would map each practice along three distinct axes: *legality* (against local law), *normativity* (against local social expectations), and *public harm* (impact on collective welfare). This allows students to see that an act can be illegal yet normative (the Mexican bribe), or legal yet harmful (the German donation), without forcing disparate cultural logics onto a single line of moral magnitude. Quantitative comparison should be abandoned in favour of this qualitative mapping, as a single number cannot capture the political context that defines whether an exchange is viewed as corruption or cooperation.
