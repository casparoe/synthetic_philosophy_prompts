    "best_guess": {
      "rule": "which candidate you'd bet on",
      "verdicts": { "case_A": "...", "case_B": "...", "case_C": "..." },
      "reasoning": "why you prefer this rule over the others"
    },
    "tiebreaker_case": {
      "description": "a new case where the candidate rules give different verdicts",
      "divergence": "what each candidate rule predicts for it"
    }
  }

  Then 3-5 sentences of prose: anything the schema couldn't hold — your gut feeling about grandma, notes on which of her verdicts might be noise rather than principle, that kind of thing.
