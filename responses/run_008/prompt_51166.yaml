              2.  Is the view unfalsifiable due to escape hatches? Is that fatal?
              3.  What does the view *predict* that rivals don't? (Positive evidence required).
          *   Tone: Honest, critical, American English.
          *   Format: Ranked list of defeaters + answers to the three questions.

  2.  **Deconstruct the Core View:**
      *   Claim 1: Religious individuals behave better (micro level).
      *   Claim 2: Religious societies function better (macro level).
      *   Claim 3: Secularization leads to trust decay (causal/temporal claim).

  3.  **Brainstorming Defeaters (Ranked by Decisiveness):**
      *   *High Decisiveness:* Longitudinal data showing secularization *increasing* trust over time (contradicts the decay claim).
