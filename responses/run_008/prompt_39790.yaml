answer: |-
  # Diagnostic Workshop: Uncertainty & Credal States

  ## Part 1: The Diagnostic Questions

  **Instructions for Participants:**
  Read each scenario and select the option that best matches your immediate intuition about how the system *should* behave or what the state of affairs *is*. Do not overthink the engineering constraints; answer based on what you believe is mathematically or rationally correct.

  **Q1. The Vendor Swap (Ellsberg-Style)**
  You are routing traffic between two payment processors. Processor A has been running for five years; historical logs show a failure rate of exactly 1.0% ± 0.1%. Processor B is a new vendor; their documentation claims a 1.0% failure rate, but they have no public history, and your audit of their code is inconclusive. You must route 10,000 transactions to one of them.
  *   **A.** It does not matter; the expected failure rate is 1% for both, so I am indifferent.
  *   **B.** I strictly prefer Processor A, even if I have to pay a small premium to use it.
  *   **C.** I need to run a small canary test on B first; until then, I cannot make a routing decision.

  **Q2. The Pipeline Diagnostic (Dilation)**
  Your churn model predicts a user's cancellation risk. Currently, the model outputs a probability range of [0.4, 0.6] for a specific user segment. You have access to a new diagnostic feature (e.g., "login frequency") that is statistically independent of churn but correlates with the *reliability* of the data source. When you observe the value of this new feature, the model's predicted risk range for the user becomes [0.1, 0.9], regardless of whether the feature value is high or low.
  *   **A.** This indicates a bug. Observing more information should never widen the uncertainty interval.
  *   **B.** This is acceptable. The new information revealed that our prior data was less reliable than we thought, justifying a wider range.
  *   **C.** This is acceptable, but we should collapse the range back to [0.4, 0.6] for the downstream report to avoid confusion.

  **Q3. The Disagreement (Expert Aggregation)**
  Model Ensemble X predicts a 10% chance of system failure. Senior Engineer Y, based on intuition and undocumented legacy knowledge, predicts a 40% chance. Both sources have been well-calibrated in the past. You must log a risk score.
  *   **A.** Log 25% (the linear average).
  *   **B.** Log "10% – 40%" (the union of opinions).
  *   **C.** Log 40% (the worst-case bound).
  *   **D.** Log nothing; flag the discrepancy for human review.

  **Q4. The Black Box (Action without Credence)**
  A critical security patch is available. You have absolutely no information on whether the patch will break the build (probability could be 0%, could be 100%). The cost of breaking the build is high; the cost of delaying the patch is moderate.
  *   **A.** I cannot make a rational decision until I assign a specific probability to the breakage.
  *   **B.** I can decide based on the stakes alone (e.g., "better safe than sorry") without assigning a number.
  *   **C.** I assign a probability of 50% (Principle of Indifference) and calculate expected cost.

  **Q5. The Nature of the Range (Ontic vs. Epistemic)**
  When your system reports a risk interval of [5%, 15%], what does the width of that interval represent?
  *   **A.** There is a single "true" risk number (e.g., 9.3%); the width is just a confession that we haven't measured it precisely yet.
  *   **B.** The risk *is* inherently indeterminate; there is no single true number until the event happens or more context is fixed.
  *   **C.** The width represents a disagreement among possible models, but one of those models is the "true" one.

  **Q6. The Safe Bet (Decision Rules)**
  You face two options under deep uncertainty (you have no reliable probabilities).
  *   **Option 1:** Guaranteed loss of $5,000.
  *   **Option 2:** Loss of $0 or Loss of $10,000, but the odds are completely unknown.
  *   **A.** I choose Option 1 (avoid the unknown worst-case).
  *   **B.** I am indifferent; both options are rationally permissible depending on my risk tolerance.
  *   **C.** I choose Option 2; the chance of $0 loss is attractive enough to gamble.

  **Q7. The Downstream API (The Constraint)**
  Your risk scoring tool feeds into a billing system that *only* accepts a single floating-point number. It will crash if sent a range or a flag.
  *   **A.** We must fix the billing system; sending a single number is misleading and mathematically dishonest in high-uncertainty cases.
  *   **B.** We pick the best estimate (e.g., the midpoint or upper bound) and send that, perhaps logging the uncertainty elsewhere.
  *   **C.** We send the upper bound (worst-case) to ensure the billing system is conservative.

  **Q8. The Silent Expert (Missing Information)**
  An elicited forecast is requested from a domain expert. They reply: "I have no idea; it could be anything."
  *   **A.** Treat this as a uniform distribution (0% to 100%) and average it with other data.
  *   **B.** Treat this as missing data; exclude it from the aggregation.
  *   **C.** Treat this as a signal that the uncertainty is maximal; set the range to [0%, 100%].

  **Q9. The One-Off Bet (Betting Behavior)**
  You are offered a bet: Win $1M if a specific, unique, unrepeatable engineering project succeeds. You are asked to name the price at which you are indifferent to buying or selling this ticket.
  *   **A.** I can name a specific price (e.g., $400k).
  *   **B.** I have a buying price and a selling price, and they are different (a spread).
  *   **C.** I refuse to name a price; this event is not the kind of thing that has a betting quotient.

  **Q10. The Taxonomy (Ordinal vs. Cardinal)**
  Your product team asks for risk levels. They suggest using "Low, Medium, High" instead of percentages.
  *   **A.** This is inferior; we lose information needed for cost-benefit analysis.
  *   **B.** This is superior; percentages imply a precision that doesn't exist.
  *   **C.** It doesn't matter, as long as "High" maps to a consistent number behind the scenes.

  ***

  ## Part 2: Scoring Key & Philosophical Mapping

  *Note to Facilitator: Do not distribute this key until after the workshop. The goal is to reveal the landscape, not to grade correctness.*

  ### Profile A: The Sharp Bayesian (Precise Credence)
  *   **Typical Answers:** Q1(A), Q2(A), Q3(A), Q4(C), Q5(A), Q6(C or A based on utility), Q7(B), Q8(A), Q9(A), Q10(A).
  *   **Philosophical Position:** **Classical Bayesianism.**
  *   **Core Tenet:** Every proposition has a single, precise probability. Uncertainty is always reducible to risk (known probabilities) with enough information.
  *   **Decision Rule:** Maximize Expected Utility (MEU).
  *   **View on Constraint:** The "single number" requirement is natural; ranges are just temporary placeholders for the true number.

  ### Profile B: The Imprecise Probabilist (Credal Sets)
  *   **Typical Answers:** Q1(B), Q2(B), Q3(B), Q4(B), Q5(B or C), Q6(A), Q7(A or B with reluctance), Q8(C), Q9(B), Q10(B).
  *   **Philosophical Position:** **Imprecise Probability / Credal Sets.**
  *   **Core Tenet:** Rational belief is represented by a *set* of probability functions, not a single number. This captures the distinction between risk (known odds) and ambiguity (unknown odds).
  *   **Decision Rule Sub-Split:**
      *   **Maximin (Cautious):** Q6(A). Choose the option with the best worst-case outcome across the set.
      *   **E-Admissibility (Permissive):** Q6(B). An option is choosable if it is optimal for *at least one* probability function in the set. (Note: This is hard to distinguish in a short quiz; look for respondents who say "It depends" on Q6).
  *   **View on Constraint:** The "single number" requirement is a category error that forces false precision.

  ### Profile C: The Ambiguity-Averse Pragmatist
  *   **Typical Answers:** Q1(B), Q2(A), Q3(C), Q4(B), Q5(A), Q6(A), Q7(C), Q8(C), Q9(A), Q10(A).
  *   **Philosophical Position:** **Smooth Ambiguity / Preference-Based.**
  *   **Core Tenet:** Probabilities *are* sharp (Q5-A), but the agent's *utility function* penalizes ambiguity. The "width" is not in the world/credence, but in the preferences.
  *   **Distinction:** Unlike Profile B, they believe Q2(A) (updating should narrow) and Q5(A) (true number exists), but they still act cautiously like Profile B.
  *   **View on Constraint:** The single number is fine, but we should adjust it conservatively (Q7-C) to account for our discomfort.

  ### Profile D: The Ordinalist / Qualitative
  *   **Typical Answers:** Q1(C), Q2(B), Q3(D), Q4(B), Q5(B), Q6(B), Q7(A), Q8(B), Q9(C), Q10(B).
  *   **Philosophical Position:** **Qualitative Probability / Comparative Confidence.**
  *   **Core Tenet:** Numerical probabilities are inappropriate for unique, complex events. Only rankings (A is more likely than B) are meaningful.
  *   **View on Constraint:** The "single number" requirement is actively harmful and should be resisted (Q7-A, Q10-B).

  ***

  ## Part 3: The Logical Space (Combinations & Vacancies)

  When mapping your colleagues' answers, you will notice that not all combinations of answers are philosophically stable. Here is how to interpret the logical space:

  **1. The "Imprecise Ontology" + "Always Narrowing" Vacancy**
  *   **Combination:** Believing the width is a fact about the world (Q5-B) *but* insisting that new evidence must always narrow the interval (Q2-A).
  *   **Diagnosis:** **Incoherent.** If the width represents inherent indeterminacy, learning more about the context (Q2) can reveal *more* indeterminacy (dilation). If you think width is real but must always shrink, you are conflating "ignorance" with "indeterminacy."
  *   **Workshop Note:** If a colleague holds this, ask them: "If the width is real, why can't the world be more complex than we thought after checking?"

  **2. The "Credal Set" + "Forced Sharp Action" Tension**
  *   **Combination:** Selecting Imprecise answers (Q1-B, Q3-B) but accepting the single number constraint without protest (Q7-B).
  *   **Diagnosis:** **Pragmatic Compromise.** This is the most common engineering position. It is not theoretically incoherent, but it implies a "decision rule" (like picking the centroid) that is rarely examined.
  *   **Workshop Note:** This is where your team likely lives. The risk is that the "compromise" rule (e.g., always taking the mean) implicitly adopts a Sharp Bayesian worldview downstream, negating the upstream imprecision.

  **3. The "Sharp Credence" + "Maximin Action" Split**
  *   **Combination:** Believing probabilities are single numbers (Q5-A) but choosing the safe bet in Q6(A) despite expected utility calculations suggesting otherwise.
  *   **Diagnosis:** **Ambiguity Aversion (Profile C).** This is a coherent position (e.g., Klibanoff, Marinacci, Mukerji), but it locates the "fuzziness" in the *utility function*, not the *probability*.
  *   **Workshop Note:** Distinguishing this from Profile B (Imprecise Credence) is the hardest philosophical task. It matters because if the fuzziness is in utility, you can train it away; if it's in credence, you cannot.

  **4. The "Indifference" Vacancy**
  *   **Combination:** Q1(A) (Indifferent between known/unknown) *and* Q6(A) (Choose Safe Bet).
  *   **Diagnosis:** **Unstable.** If you are truly indifferent to ambiguity in Q1, you should treat the unknown odds in Q6 as the average of possible odds. Choosing the safe bet implies you are *not* indifferent.
  *   **Workshop Note:** This indicates a respondent is answering based on "gut feeling" per question rather than a consistent model.

  ***

  ## Part 4: Limitations & Flags

  **1. The Decision Rule Blind Spot**
  This quiz cannot reliably distinguish between **Maximin** (choose the best worst-case) and **E-Admissibility** (choose any option that isn't dominated). Both profiles will answer Q6 similarly in simple cases. Distinguishing them requires a "hedging" scenario where an agent pays to avoid making a choice. If your team needs to select a specific aggregation rule (e.g., for code implementation), this quiz will not settle that debate.

  **2. The "Ambiguity vs. Ignorance" Reduction**
  There is a famous philosophical problem (the "Reduction Thesis") suggesting that Imprecise Credences (Profile B) can always be mathematically modeled as Sharp Credences with a specific Utility Function (Profile C). This quiz treats them as distinct for practical purposes, but be aware that a sophisticated colleague might argue their "Range" is just a shorthand for a "Penalized Expectation." This does not change the engineering output, but it changes how you justify it.

  **3. The "Single Number" Constraint Bias**
  You noted your suspicion that the downstream API constraint is itself a philosophical position. This quiz reveals *who* feels the pain of that constraint (Profile B and D) versus who accepts it naturally (Profile A and C).
  *   **Warning:** If the majority of your team scores as Profile A, your tool is philosophically aligned with your pipeline.
  *   **Warning:** If the majority scores as Profile B, **your pipeline is forcing a philosophical conversion.** You are systematically converting Imprecise Probabilities into Sharp Probabilities at the API boundary. This is not a neutral engineering decision; it is an assertion that "all uncertainty is reducible to risk."

  **4. No "Correct" Answer**
  There is no consensus in the literature on which view is "true." Sharp Bayesianism is computationally cleaner; Imprecise Probability is descriptively richer. The goal of this workshop is not to find the truth, but to ensure your code does not silently contradict the stated beliefs of the engineers maintaining it. If your code implements Profile A logic but your team holds Profile B beliefs, you have a technical debt of a philosophical nature.
