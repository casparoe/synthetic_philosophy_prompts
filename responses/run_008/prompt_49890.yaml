      *   *Core Argument 1: The Inevitability of Meta-Ethics.* Any powerful optimizer *must* have a target function. If we don't specify one via extrapolation, the optimization pressure defaults to something else (e.g., the AI's own instrumental convergence, or the literal current preferences of the deployers). CEV is an attempt to *import* human normative uncertainty into the objective function, rather than hiding it.
      *   *Core Argument 2: The "Civil Society" Analogy is Flawed.* Human states aren't neutral; they enforce property rights, definitions of harm, etc. The "civil society" space exists *because* the state enforces a specific meta-framework. An AI alignment target is analogous to a Constitution, not a specific policy. It sets the rules for the game, even if it influences the weather.
      *   *Core Argument 3: Extrapolation as Error Correction.* The point of CEV isn't to be neutral; it's to be *correct* (or less wrong) about what humans *would* want if they knew more. The "laundering" is actually feature, not a bug. It filters out noise (ignorance, bias) to find signal.
      *   *Core Argument 4: The Overlapping Consensus Defense.* Acknowledge the "designers' values" risk. Argue that the "thin consensus" required to build the CEV machinery is the only stable Schelling point. It's not "designers' values" if the designers are constrained by the requirement that the extrapolation must be recognizable to the subjects.

