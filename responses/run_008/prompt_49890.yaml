      *   **Introduction:** Acknowledge the user's pedigree and the strength of the objection. Validate the "Neutrality Laundering" concept.
      *   **Concession:** Admit that CEV is not procedurally neutral. It encodes meta-ethical realism (or quasi-realism). It decides what counts as a "self" and "reflection."
      *   **Argument 1: The False Dichotomy of Neutrality.** The alternative to CEV isn't neutrality; it's *neglect*. If the AI doesn't extrapolate, it optimizes for something else (e.g., revealed preference of the moment, which is noisy). The "laundering" is actually "denoising."
      *   **Argument 2: The Constitution vs. The Legislator.** Reframe the AI's role. It's not adjudicating every dispute (Legislator); it's maintaining the conditions for value pursuit (Constitution). The "arena" isn't closed; the *rules* are fixed, but the *play* is open. CEV defines the rights/protected values, not the specific outcomes.
