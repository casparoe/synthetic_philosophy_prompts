      *   **Argument 4: The Fallback (If Concession is Big).** What if the meta-ethics are wrong? The fallback is *pluralism within the target*. CEV shouldn't converge to a single utility function if humanity doesn't. It should preserve the *structure* of disagreement if that's what we value.
      *   **Conclusion:** Summarize. CEV is the least bad option because it makes the value commitments explicit and subject to the constraint of "would they endorse this?" rather than hiding them in the training data or the corporate charter.

  5.  **Refining the Tone:**
