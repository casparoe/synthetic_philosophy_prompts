  His argument:

  (1) If the supertask is completed, then at t = 1 the lamp is in some definite state — on or off, no third option.
  (2) The state at t = 1 has to be settled entirely by what happened before t = 1. Nothing new happens at t = 1 itself, and there are no toggles after the supertask — that's the whole point of it being completed.
  (3) But nothing before t = 1 settles the state. There's no last toggle — every toggle is followed by another one that undoes it — so no single toggle settles it, and no collection of them, finite or infinite, does either.
  (4) If nothing before t = 1 settles it, then nothing settles it, full stop.
  (5) So at t = 1 the lamp's state is both settled (it must be on or off) and not settled. Contradiction.
  (6) Therefore the supertask can't be completed — not won't be, can't be. Supertasks are impossble.

  He's very pleased with himself. Here's what's bugging me: if I let this argument through, it seems to run way past the lamp. Take the classic bouncing ball: a ball bounces to ever-smaller heights in ever-shorter intervals, so it completes infinitely many bounces before t = 1 and then rolls along the table. There's no last bounce there either, so by (2) through (4) nothing before t = 1 settles where the ball is at t = 1 or that it's rolling — so the ball can't finish bouncing either? Same for Achilles passing the tortoise: no last sub-run, so he never passes. My roommate says fine, he'll bite that bullet too, but I really don't want to conclude that a ball can't stop bouncing or that moving through a dense continuum is somehow impossible.

  So: which step do I reject, and why did that step look fine at first glance? I have a suspicion something slips between (3) and (4), but I can't put my finger on the exact wording of the slip, so don't feel bound by that. I also want to know what rejecting your chosen step costs — including whether the honest move is biting his bullet and explaining why the bouncing ball really is in the same boat as the lamp after all. For what it's worth, here's what I'd like to keep if I can: that the lamp thought experiment is telling us something true, and that the bouncing ball genuinely can finish its bounces. But tell me if I can't have both, and what I'm paying.
