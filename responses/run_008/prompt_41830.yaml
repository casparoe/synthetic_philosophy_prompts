  # My argument restated

  Your essay argues for an "Inertia View" to distinguish doing from allowing. You claim an agent "does" harm only when they initiate a new causal chain leading to a bad outcome. Conversely, an agent "allows" harm when they merely fail to interrupt a causal chain already in motion. In the ventilator case, the disease is the existing chain; the machine is an interruption. Withdrawing support is refusing to continue that interruption, not starting a new chain. You extend this metaphorically: agents are either authors writing new pages of history or editors revising existing drafts. This framework suggests withdrawing life support is morally equivalent to never starting it, as both are refusals to interrupt the natural course of disease, whereas active euthanasia would be authoring a new cause of death. This distinction arose from debates with your sister regarding whether switching off a ventilator differs from never switching it on. You posit that physical causation, not moral duty, grounds this difference.

  # Where it is on track

  Your intuition captures a robust legal and folk-moral distinction. The law generally punishes acts more severely than omissions, and your causal mechanism explains why: injecting poison adds energy to the system; withholding food does not. The "author versus editor" metaphor is also rhetorically effective for lay audiences, clarifying why intervention feels like ownership of the outcome. In clear-cut cases, like pushing a person versus watching them fall, your inertia model aligns with physical reality. It successfully isolates cases where the agent is the sole source of the threat versus cases where the threat is independent. This provides a clear, descriptive baseline before moral evaluation begins, which is necessary for any coherent ethical framework.

  # The biggest problems

  The Inertia View collapses under the "Baseline Problem." You assume we can objectively identify which causal chain is "already running." But is the baseline biological life (death is new) or biological death (life is an interruption)? If a patient is on a ventilator, is the "natural" chain the disease killing them, or is the status quo the machine keeping them alive? Physically, unplugging a machine requires the same muscle contraction as plugging it in. Your view relies on a normative judgment about what counts as "interference" disguised as a physical description. You are smuggling in moral expectations about what doctors ought to do to define what counts as "inertia." Without a prior moral rule defining the baseline, the physical description is indeterminate.

  Furthermore, you are reinventing the "Acts and Omissions" debate without engaging its literature. Philippa Foot and James Rachels have thoroughly dissected this. Rachels famously argued that if the outcome is identical, the causal history is morally irrelevant. Your view attempts to ground the distinction in metaphysics, but most contemporary ethicists treat it as a heuristic for duty, not causation. By insisting on a physical distinction, you ignore that "allowing" often requires complex action, such as standing guard to ensure no one helps. Finally, your view struggles with preemptive cases. If I destroy a bridge to stop a pursuer, killing them when the bridge collapses, is that allowing or doing? Your inertia model cannot easily distinguish removing a support I provided versus removing a natural support, yet the moral difference is vast. The distinction isn't in the physics; it's in the entitlement to the resource being withheld. If I own the life preserver, throwing it away is allowing; if I push you off the dock, it is doing. Your theory misses this ownership component entirely, focusing solely on causal vectors. This makes it unable to handle cases where I remove support I previously provided, which legally and morally shifts from allowing to doing once reliance is established. The "Author/Editor" analogy also fails because editors can destroy stories just as authors can. If an editor deletes a chapter, is that allowing the story to end or making it end? The metaphor breaks down under scrutiny. Additionally, your view implies that if I start a causal chain but stop it halfway, I am merely allowing the rest to happen. But if I shoot someone and miss, then refuse to shoot again, am I allowing them to live? The direction of the chain matters less than the intent. You are describing physics, not agency. The "flat spot" on the wheel you feared is actually a structural failure: you cannot derive an "ought" from an "is" of causal chains. The distinction you want is normative, but you are building it on descriptive foundations. This category error is the primary reason professional philosophy moved away from pure causal accounts of doing versus allowing. You mentioned the "default view"; this is precisely what philosophers call the normative baseline problem.

  # The drowning-lake patch

  Your patch regarding the drowning victim admits defeat. By making the distinction depend on cost and positioning, you convert a metaphysical claim into a moral one. You are effectively saying: "It counts as doing if you should have done something." This renders the distinction useless for determining whether you should have done something. You wanted the doing/allowing distinction to ground the moral judgment, but your patch makes the moral judgment ground the distinction. This is circular. If pressing a ventilator button is costless, your patch implies withdrawing it is "doing," contradicting your core Inertia View. You cannot have it both ways: either the distinction is physical and fails the drowning case, or it is moral and fails to explain why the drowning case is wrong. This collapse suggests your initial instinct was correct: the ventilator case and the drowning case are structurally similar regarding causation. The difference lies in duty, not inertia. By trying to force them into the same bucket via the patch, you acknowledge that causation isn't the differentiator. The patch swallows the distinction because eventually, every omission involves some cost to rectify. If the cost is zero, it becomes doing; if non-zero, it is allowing. This creates a slippery slope where the distinction vanishes into a utilitarian calculus of effort.

  # What to do next

  Stop trying to solve the metaphysics of causation. Read Philippa Foot's "Killing and Letting Die" and James Rachels' "Active and Passive Euthanasia." They map the terrain you are walking. Restructure your essay: admit the physical distinction is weak, but argue the normative distinction remains useful for legal clarity. Shift from "authors versus editors" to "responsibility versus charity." Argue that doctors are editors by contract, not by physics. This saves your intuition without requiring a new theory of causation. Focus on why society wants this distinction, rather than claiming it exists in the fabric of reality. Your sister wins on the physics; you might win on the policy. Specifically, address the "Baseline Problem" explicitly. Acknowledge that "natural course" is a normative construct. If you can defend why we choose disease as the baseline rather than health, you have a stronger argument. Don't hide the difficulty; make it the central puzzle. This shows the discussion circle you understand the stakes.
