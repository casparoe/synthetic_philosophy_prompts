      *   **The Thesis:**
          1.  *Global:* Any theory has an incompatible, empirically equivalent rival.
          2.  *Permanent:* Equivalence holds for all *possible* evidence, not just actual.
          3.  *Evidential:* No non-question-begging reason (evidence-wise) can break the tie. Priors are the only lever, but fixing priors seems to admit non-empirical knowledge or redefine evidence.
      *   **The Task:** Provide a "ranked map of exposure" (what would bring the thesis down).
          1.  Formal defeaters (EE $\neq$ EV).
