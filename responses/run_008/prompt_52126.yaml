prompt: |-
  I run a betting pool with some friends at school -- we each put in like $20 at the start of the semester and bet on stuff all year, fantasy football, whether it snows before Thanksgiving, dumb bets people propose at lunch. Most people in the pool just bet whatever feels right and go broke in a month. I read somewhere that there's this Kelly thing that says you should size bets by how much edge you have, and also something about how if you bet too much even on good bets you lose money over time because of compounding?? But we almost never have real probabilities for anything, and half the people in the pool don't care about math and just want to bet big on the homecoming game. Can you turn the Kelly idea into like an actual procedure I can run in a couple minutes whenever someone proposes a bet? Like what questions do I ask myself in order, what counts as an answer, when does the procedure just say bet small or don't bet at all, and when do I have to admit it's a gut call and the math can't settle it. Then run it on two bets for me: one where someone wants to put their whole remaining bankroll on a bet they feel super confident about, and one on a bet I actually know the odds of (like a dice game we play where I know I win like 55% of the time). And be honest about where my gut is probably going to mess this up even if I follow the procedure.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **Context:** School betting pool (friends, ~$20 buy-in, casual/fun but competitive).
      *   **Problem:** Friends bet emotionally/randomly and go broke. User knows about Kelly Criterion (bet sizing based on edge, volatility drag/overbetting risk) but finds it impractical for informal, subjective bets.
      *   **Goal:** A simplified, actionable "Kelly-like" procedure (heuristic) that can be run in minutes. Needs specific questions, decision thresholds, and application to two scenarios (all-in on confidence vs. known 55% edge).
      *   **Tone:** Practical, honest, slightly cautious (gambling awareness), peer-to-peer (school setting).
      *   **Constraints:** Must address the "no real probabilities" issue, the "friends don't care about math" social aspect, and the limitations of human intuition.

  2.  **Deconstruct the Kelly Criterion for this Context:**
      *   *Full Kelly:* $f^* = (bp - q) / b$. Requires precise $p$ (probability of winning) and $b$ (odds received).
      *   *Problem:* In a school pool, $p$ is almost never known. It's subjective.
      *   *Solution:* "Fractional Kelly" or a "Kelly-inspired Heuristic." Since estimates are noisy, bet *less* than full Kelly to avoid ruin.
      *   *Key Insight:* The user mentioned "compounding" and "betting too much on good bets loses money." This refers to volatility drag (geometric vs. arithmetic mean).
      *   *Adaptation:* Create a checklist that forces estimation of edge and limits exposure based on confidence quality.

  3.  **Drafting the Procedure (The "2-Minute Kelly Check"):**
      *   Need steps that force quantification of the vague.
      *   *Step 1: The Odds.* What are you getting paid? (Even money? 2-to-1?)
      *   *Step 2: The True Probability.* Be honest. Not "I feel good," but "If this happened 100 times, how many wins?"
      *   *Step 3: The Edge.* Does Expected Value (EV) > 0?
      *   *Step 4: The Cap.* Never bet everything. Use a fraction (e.g., Half-Kelly or just a fixed % cap).
      *   *Step 5: The "Gut Check".* Is this fun? Will losing this make me mad?

  4.  **Developing the Two Scenarios:**
      *   *Scenario A: The "All-In" Confidence Bet.*
          *   Context: Friend wants to bet entire bankroll on Homecoming.
          *   Analysis: High risk of ruin. Subjective probability.
          *   Verdict: Don't do it. Cap at small %.
      *   *Scenario B: The 55% Dice Game.*
          *   Context: Known edge (55% win rate, presumably even money).
          *   Analysis: Positive EV. Kelly formula applies better here.
          *   Calculation: $p=0.55, q=0.45, b=1$. Kelly = $0.55 - 0.45 = 0.10$ (10%).
          *   Verdict: Bet small (5-10%), not all-in.

  5.  **Addressing the "Gut Mess Up" (Psychological Biases):**
      *   Overconfidence bias (thinking you know more than you do).
      *   Recency bias (last game won, so we will win).
      *   Social pressure (betting to look cool).
      *   "Gambler's Ruin" concept (even with edge, going all-in kills you).

  6.  **Refining the Tone and Safety:**
      *   *Safety:* Must acknowledge this is gambling, even if small stakes. Don't encourage addiction. Keep it fun.
      *   *Tone:* Keep it relatable. "Here's how to not be the guy who is broke in October."
      *   *Math Check:* Ensure the Kelly calculation is explained simply. $Edge = (Probability \times Payout) - (Loss Probability \times Stake)$.
      *   *Simplification:* Instead of complex formulas, use a "Bet Size Ladder."

  7.  **Iterative Drafting (Self-Correction during thought process):**
      *   *Critique:* Is full Kelly too aggressive for a school pool?
      *   *Correction:* Yes. Full Kelly is volatile. Suggest "Half-Kelly" or a flat 5% max rule for subjective bets.
      *   *Critique:* The user asked for a procedure to run *when someone proposes a bet*.
      *   *Correction:* Make it a checklist they can mentally run through.
      *   *Critique:* Need to emphasize that for subjective bets (football), the "probability" is a guess.
      *   *Correction:* Add a "Confidence Discount." If you're guessing, cut the bet size in half again.

  8.  **Finalizing the Structure:**
      *   **Intro:** Validate the Kelly insight (volatility drag is real).
      *   **The Procedure:** 4-Step "Napkin Kelly."
      *   **Scenario 1 (Homecoming All-In):** Apply procedure. Show why it fails.
      *   **Scenario 2 (55% Dice):** Apply procedure. Show the math.
      *   **The "Gut" Warning:** Where humans fail (overconfidence, chasing losses).
      *   **Conclusion:** Keep it fun, don't be the shark who ruins the game.

  9.  **Safety & Policy Check:**
      *   Gambling content. Is it prohibited?
      *   Policy: Generally, discussing gambling strategy is okay if it doesn't encourage harmful behavior or illegal acts. School pools with $20 buy-ins are usually gray-area social gambling.
      *   Action: Add a disclaimer. Keep stakes low. Emphasize "don't bet money you can't lose." Focus on the *math* and *risk management* rather than encouraging gambling.

  10. **Final Polish:** Ensure the distinction between "Investment Edge" and "Gambling Edge" is clear. In a pool, preserving bankroll to stay in the game is often more important than maximizing EV on a single bet. (Actually, for a finite pool, maximizing growth is good, but ruin means you're out. So avoiding ruin is priority #1).

  *(Self-Correction on Kelly Formula)*:
  Standard Kelly: $f = (p(b+1) - 1) / b$.
  If odds are even money ($b=1$): $f = p - (1-p) = 2p - 1$.
  For 55% win rate: $f = 2(0.55) - 1 = 0.10$ (10%).
