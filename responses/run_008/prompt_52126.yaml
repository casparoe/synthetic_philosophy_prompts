answer: |-
  This is a smart instinct. You've identified the core problem: **Volatility Drag.** Even if you have a positive expected value (a "good bet"), betting too large a chunk of your bankroll means a losing streak wipes you out before the math can catch up. You can't compound if you're at zero.

  However, the strict Kelly Criterion requires precise probabilities ($p$) and precise odds ($b$). In a school pool, your "probability" is usually a guess wrapped in confidence. If you plug a guess into a precise formula, you get "Garbage In, Garbage Out."

  Here is a **"Napkin Kelly" Procedure**. It's a heuristic designed for subjective, informal bets. It takes about 60 seconds to run mentally.

  ### The 4-Step "Napkin Kelly" Procedure

  Whenever a bet is proposed, run these four filters in order. If you fail a filter, you stop or downgrade the bet size.

  **1. The "Even Money" Check (What are the odds?)**
  *   **Question:** If I win, how much do I get? If I lose, how much do I lose?
  *   **Standard:** Most friend bets are 1:1 (Even Money). If someone asks for 2:1 odds on a coin flip, that's a red flag.
  *   **Action:** Write down the payout ratio ($b$). If it's not clearly defined, **no bet.**

  **2. The "100 Trials" Test (What is the real probability?)**
  *   **Question:** Ignore how you *feel*. If this exact scenario happened 100 times, how many times do I objectively win?
  *   **The Trap:** "I feel super confident" is not a number.
  *   **Action:** Assign a percentage ($p$).
      *   *Coin flip:* 50%
      *   *Dice game you tracked:* 55%
      *   *Football game:* Be honest. Is it 60%? 70%? If you can't put a number on it, it's **<55%**.
  *   **Rule:** If $p \le 50\%$ on an even money bet, **DO NOT BET.** (This eliminates most "dumb lunch bets").

  **3. The Edge Calculation (Do I have a mathematical advantage?)**
  *   **Formula:** $Edge = (p \times b) - (1 - p)$
  *   **Simplified for Even Money:** $Edge = 2p - 1$
  *   **Action:** If the result is negative or zero, **DO NOT BET.** You are donating money to the pool.

  **4. The Sizing Cap (How much do I actually wager?)**
  *   **The Math:** Full Kelly says bet 100% of your *Edge*.
  *   **The Reality:** Your probability estimate ($p$) is likely wrong. You are overconfident.
  *   **Action:** Use **Half-Kelly** or a **Flat Cap**.
      *   *Subjective Bet (Football, Snow, etc.):* Max **5%** of current bankroll. No exceptions. Your edge estimate is too noisy.
      *   *Objective Bet (Dice, Cards, Known Stats):* You can go up to **10%** if the math holds.
      *   *Hard Rule:* **Never bet more than 25%** of your bankroll on a single event, regardless of confidence. This prevents "Gambler's Ruin."

  ---

  ### Running the Procedure on Your Two Scenarios

  Let's apply this to the specific situations you mentioned.

  #### Scenario 1: The "All-In" Homecoming Bet
  *   **The Proposal:** A friend wants to bet their entire remaining bankroll ($20 or $100, doesn't matter) on their team winning Homecoming. They say, "I know they're gonna win."
  *   **Step 1 (Odds):** Even Money (1:1).
  *   **Step 2 (Probability):** They *feel* confident. But high school football is volatile. Injuries, luck, refs. A realistic win probability is maybe 60% if they are the better team. Let's be generous and say 65%.
  *   **Step 3 (Edge):** $2(0.65) - 1 = 0.30$ (30% Edge).
  *   **Step 4 (Sizing):**
      *   *Full Kelly:* Would suggest betting 30% of bankroll.
      *   *Napkin Kelly (Subjective Cap):* Because this is subjective (not a tracked dice game), we apply the **5% Max Rule**.
      *   *Friend's Plan:* 100% of bankroll.
  *   **Verdict:** **REJECT.**
  *   **Why:** Even with a 65% win rate, betting 100% of your bankroll means a single loss eliminates you from the pool forever. You lose the option value of future bets. If they lose, they are out. If they win, they double up, but next week they have to bet again to grow. One bad beat ends the season.
  *   **Advice to Friend:** "Bet 10%. If you win, you still make money. If you lose, you're still in the pool to bet on the championship."

  #### Scenario 2: The 55% Dice Game
  *   **The Proposal:** A dice game where you have tracked results and know you win 55% of the time. Even money payout.
  *   **Step 1 (Odds):** Even Money (1:1).
  *   **Step 2 (Probability):** 55% (This is objective data, not a gut feeling).
  *   **Step 3 (Edge):** $2(0.55) - 1 = 0.10$ (10% Edge).
  *   **Step 4 (Sizing):**
      *   *Full Kelly:* 10% of bankroll.
      *   *Napkin Kelly (Objective Cap):* Since this is tracked data, we can trust the number more. We can bet **Half-Kelly to Full-Kelly**. Let's say 5% to 10%.
  *   **Verdict:** **BET 5-10% OF BANKROLL.**
  *   **Why:** This is a positive expectancy grind. You want to compound this. But notice: **Even with a guaranteed mathematical edge, Kelly only says bet 10%.** It does *not* say go all-in.
  *   **Result:** If you bet 10% repeatedly on a 55% game, your bankroll grows steadily. If you bet 50%, a string of 4 losses (which happens statistically) cuts your bankroll by ~80%, and you need a 400% gain just to get back to even.

  ---

  ### Where Your Gut Will Mess This Up (Even If You Follow the Steps)

  You asked for honesty about where the math fails. Here are the three ways you will still lose money even with this procedure:

  **1. The "Edge Illusion" (Overconfidence Bias)**
  *   **The Math:** Requires accurate $p$.
  *   **The Gut:** Humans naturally overestimate their knowledge. You think the football team has a 60% chance, but you really only have 52% (basically a coin flip).
  *   **The Fix:** This is why the **5% Cap on Subjective Bets** exists. It assumes your probability estimate is inflated. If you think you have a 70% edge, cut it in half to 35% for sizing purposes.

  **2. The "Boredom" Factor (Under-betting)**
  *   **The Math:** Kelly is boring. It grows wealth slowly.
  *   **The Gut:** You put in $20. After a month of betting 5% chunks, you've made $4. Your friend who went all-in twice is either at $0 or $80. You will feel tempted to bet bigger to "catch up" or make it exciting.
  *   **The Fix:** Remember the goal. Is the goal to have the biggest stack at the end of the year, or to have the most adrenaline in October? If it's the stack, stick to the 5% rule.

  **3. Correlated Risk (The "Everything is Football" Trap)**
  *   **The Math:** Kelly assumes bets are independent.
  *   **The Gut:** You bet 5% on the Homecoming game. Then you bet 5% on "Total Points Over." Then you bet 5% on "QB throws 2 TDs."
  *   **The Reality:** These are all the same event. If the team loses, you lose all three bets. You just accidentally bet 15% on one game.
  *   **The Fix:** Group correlated bets. If you have three bets on the same game, the *total* exposure cannot exceed your 5% cap.

  ### Summary Checklist for Your Phone Notes

  1.  **Is the probability > 50%?** (If no, walk away).
  2.  **Is this objective (dice/stats) or subjective (feelings)?**
      *   *Subjective:* Max bet **5%** of bankroll.
      *   *Objective:* Max bet **10%** of bankroll.
  3.  **Are these bets correlated?** (If yes, combine them into the cap).
  4.  **Will losing this make me tilt?** (If yes, cut bet size in half).

  **Final Reality Check:**
  You are in a school pool. The primary utility of this money is **fun**, not income. If you become the "Math Shark" who refuses fun bets and lectures people on volatility drag, you might win the money but lose the friends.

  Use the math to keep yourself in the game until the end of the semester. The guys who go all-in on Homecoming will be busted by November. You'll still have chips, and that's when you can afford to take a few calculated shots at the dumb bets they propose because they're desperate.

  *Disclaimer: This is for educational purposes regarding probability and risk management. Gambling involves risk. Never bet money you cannot afford to lose, and ensure any betting pool complies with your school's rules and local laws.*
