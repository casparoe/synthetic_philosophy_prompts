              5.  Both are claimed to be Necessary A Posteriori Identities (by 1 & 4).
              6.  If they are the *same kind* of truth (Nec. A Post. Identity), why does ideal reflection reveal the incoherence of one but not the other?
              7.  Standard Type-B answer: Phenomenal concepts are unique (recognitional, indexical, etc.).
              8.  User's (2) claims IPC is the *core* of modal epistemology. If IPC works for Hesperus (revealing necessity), why does it fail to reveal the necessity of Physical=Phenomenal?
              9.  Actually, (2) says IPC guides to *possibility*. It doesn't necessarily say IPC reveals *necessity*. However, if IPC implies Possibility, then the failure to find a contradiction in Zombies implies Possibility. The failure to find a contradiction in Hesperus $\neq$ Phosphorus (prima facie) is explained by (5) as confusion. The user claims Zombie conceivability survives *ideal* reflection.
              10. **Tension:** It's hard to maintain that Ideal Reflection fixes the Hesperus error but *cannot* fix the Zombie error if both are necessary identities. This requires a robust theory of Phenomenal Concepts (PCT) to explain the asymmetry. Without explicitly endorsing PCT, (3) and (5) look inconsistent under the umbrella of (2).
          *   **Severity:** **Medium/High.** It's not a logical contradiction per se, but a theoretical burden. It requires explaining why two necessary identities behave differently under ideal reflection.

  5.  **Ranking the Tensions:**

      1.  **The Modal Argument Triangle (2 + 3 + 4):** This is a logical contradiction. (2)+(3) $\rightarrow$ Zombies Possible. (4) $\rightarrow$ Zombies Impossible. Cannot hold all three.
