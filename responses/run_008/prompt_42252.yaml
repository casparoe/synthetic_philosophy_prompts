          *   **Verdict:** Insufficient.

      *   **Winner:** Dropping or modifying **(2)**. Specifically, denying that Ideal Conceivability entails Metaphysical Possibility in the case of phenomenal/physical identities. This is the hallmark of Type-B Physicalism. The user claims (2) is the "core of modal epistemology," which makes this painful, but it's the only way to save (4) given (3).
