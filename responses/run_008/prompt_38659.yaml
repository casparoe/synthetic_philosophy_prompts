          *   Q1: (a) 100% 30k. (b) 89% 30k, 10% 150k, 1% 0.
          *   Q2: (c) 11% 30k, 89% 0. (d) 10% 150k, 90% 0.
          *   If I take Option (a) and remove 89% chance of 30k, I have 11% chance of 30k left.
          *   If I take Option (b) and remove 89% chance of 30k, I have 10% 150k + 1% 0 left.
          *   So Q1 is effectively: 11% 30k vs 10% 150k + 1% 0.
          *   Q2 is effectively: 11% 30k + 89% 0 vs 10% 150k + 90% 0.
          *   Actually, the standard Allais explanation is easier:
              *   Q1: A (100% 30k) vs B (89% 30k, 10% 150k, 1% 0).
              *   Q2: C (11% 30k, 89% 0) vs D (10% 150k, 90% 0).
              *   Notice that A and C share an 89% chance of 30k? No, A is 100% 30k. C is 11% 30k.
              *   Let's stick to the algebraic proof in step 3 for accuracy, but explain it conceptually.
              *   Conceptual explanation: In Q1, you prefer certainty. In Q2, both are uncertain, so you prefer the higher payout. The "inconsistency" is that the *difference* between the options is mathematically identical in both questions, just packaged differently.
      *   *The "Why":* Explain Prospect Theory/Certainty Effect. It's not a bug, it's a feature of human psychology.
      *   *The Planner:* She is relying on a specific model (EUT). It's a useful model, but not perfect.
      *   *Recommendation:* Talk to her. Don't lie on the questionnaire. The inconsistency highlights a specific nuance in your risk profile (loss aversion regarding sure things vs. risk seeking in losses/low prob).

  7.  **Refining the Tone:**
