          *   Q1: Compare 100% \$30k vs. (89% \$30k + 10% \$150k + 1% \$0). Remove the common 89% \$30k. Left with 11% \$30k vs. 10% \$150k + 1% \$0.
          *   Q2: Compare 11% \$30k vs. 10% \$150k. (Ignoring the 89%/90% zero parts).
