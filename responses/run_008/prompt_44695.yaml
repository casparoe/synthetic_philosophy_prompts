answer: |-
  The practice strictly presupposes that intention is a sharp, inspectable mental state that fundamentally alters the moral ontology of an action, but this theory is internally inconsistent and likely serves merely as a functional proxy for maintaining bright-line prohibitions against direct killing.

  This framework assumes that an agent's internal orientation toward a outcome is as real and morally determinative as the physical causality of the act itself, treating "intending" versus "foreseeing" as a binary switch that changes a procedure from murder to therapy despite identical biochemical pathways. However, this metaphysics fits well with alternative, non-metaphysical explanations: it functions as a heuristic for enforcing bright-line rules that are easier to administer than case-by-case risk assessments, it screens against slippery slopes by forbidding any procedure that looks like direct killing regardless of utility, and it aligns with a self-defense logic where removing a pathological threat (the tube or uterus) is permissible but attacking a person (the fetus) is not. The internal consistency regarding negligence is weak because the system punishes foreseeable harm in malpractice cases while excusing foreseeable harm in double-effect cases, creating a tension where foreseeability generates culpability in one domain and permissibility in the other; this is only reconciled by arguing that negligence involves *unjustified* risk while double effect involves *proportionate* risk, yet this fails to explain why the physical reality of the death is morally neutral in one context but significant in the other. The experimental philosophy data you cite undermines the presupposition further by suggesting that intention judgments are downstream of moral approval rather than upstream, meaning committees likely decide the outcome is wrong first and then classify the intention as "direct" to justify the prohibition, rendering the doctrine a post-hoc rationalization rather than a decision procedure. If you swapped this for a plain outcomes-and-probabilities view, the lines around ectopic pregnancies and craniotomies would vanish because the net survival and suffering metrics would be identical regardless of the surgical technique, while palliative care guidelines would shift from monitoring the physician's intent to monitoring the patient's benefit, potentially allowing higher doses for suffering relief even if death is certain, or conversely restricting doses that shorten life without proportional pain reduction. Ultimately, the doctrine holds up only if you accept that the moral quality of an event resides partly in the mind of the agent rather than entirely in the physical world, a premise that fits your pharmacological background poorly but serves institutional needs for clear, enforceable boundaries against active killing.
