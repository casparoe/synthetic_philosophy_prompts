answer: |-
  (1) "Order of ideas"
  Begin with the engineering hook (5 mins): "How do you sample a random line?" Show code snippets that look correct but differ. Present the Paradox question (5 mins). Reveal Construction 1 (Endpoints, 1/3) as the intuitive baseline (10 mins). Reveal Construction 2 (Midpoints, 1/4) as the conflicting "uniform" alternative (10 mins). Pause here to introduce the Principle of Indifference (PoI) (5 mins): explain that both claimed "uniformity" but over different spaces. Introduce Construction 3 (Jaynes/Radius, 1/2) not as truth, but as the invariance standard (10 mins). Connect to practical parameterization bugs (5 mins). Close with the philosophical takeaway: probability attaches to processes, not propositions (5 mins). This sequence ensures the math creates the tension before the philosophy attempts to resolve it, preventing premature dismissal. The PoI must come *after* the conflict is shown; introducing it first makes it abstract dogma. Showing the conflict first makes PoI the necessary diagnostic tool. The practical angle comes late to ensure the conceptual shift lands before they retreat to "just fix the code." Crucially, do not resolve the conflict until the practical section. Let them sit with the ambiguity. If you solve it too early, they treat the first two methods as errors rather than valid but distinct models. The dependency is linear: Conflict -> Principle -> Resolution -> Application. Breaking this order causes them to skip the philosophical insight and jump straight to coding fixes.

  (2) "The carrying construction"
  Anchor on **Random Endpoints (1/3)**. This method aligns with the natural language instruction "choose two points on the circle." It is the engineer's default implementation: `theta1 = rand(), theta2 = rand()`. By making this the baseline, you maximize the shock value when the Midpoint method (1/4) is revealed. The Endpoints method accomplishes what the others cannot: it validates the audience's initial intuition before invalidating it. If you anchor on Jaynes' invariant method (1/2), the audience treats the others as "mistakes." If you anchor on Endpoints, the others become "equally valid alternatives," which is the core philosophical friction. The Endpoints method must carry the burden of being "correct but incomplete," forcing the audience to realize correctness requires process specification, not just logical consistency.

  (3) "Misconception map"
  1. **"The problem is underspecified; just ask for clarification."** (Defuse at minute 15). Engineers love specs. Acknowledge this is technically true but insufficient. Explain that in science and modeling, "random" is often used without explicit process details. The lesson isn't "ask better questions," it's "recognize hidden assumptions in 'random'." Stop them from saying "RTFM". Instead, ask "What does the API documentation for Nature look like?" Force them to write the spec for 'random user' to see the difficulty.
  2. **"This is why you always specify a prior."** (Defuse at minute 25). They will think PoI is just a bad prior. Clarify that PoI is a rule for *generating* priors when information is lacking. The error isn't having a prior; it's assuming symmetry in the wrong parameter space. Use the analogy of coordinate systems: changing from Cartesian to Polar changes the Jacobian. Show the Jacobian determinant on the board to make it concrete. You *did* specify a prior implicitly.
  3. **"Probability is subjective; the paradox dissolves."** (Defuse at minute 35). If they retreat to subjectivity, they miss the objective constraint of physical invariance. Emphasize that Jaynes' solution isn't about belief, but about physical robustness. If probability were purely subjective, Monte Carlo simulations of physical systems would never converge. Remind them their work relies on objective frequencies. Point out that their simulation convergence depends on objective truth.
  4. **"It's just a coding parameterization bug."** (Defuse at minute 40). This is the most dangerous dismissal. Agree it looks like a bug, but elevate it: it's a *modeling* error. The code correctly implements the wrong model. Compare it to using Euclidean distance for geospatial data. The code is bug-free; the geometry is wrong. Unit tests verify code, not reality.
  5. **"Probability is broken."** (Defuse at close). Counter by stating probability is precise, but language is ambiguous. The math works; the mapping from English to Math failed. Reassure them their daily work is safe, provided they treat 'random' as a function call with defined side effects, not a magical property. Ambiguity is a human problem, not a math problem.

  (4) "The closing check"
  Question: "I have a physical circle drawn on the floor. I stand on a ladder and drop a long straight stick. What is the probability it forms a chord longer than the triangle side?"
  Good Answer: "It depends on the dropping mechanism. If the drop is invariant to rotation and scale, it's 1/2. If you manually place endpoints, it's 1/3. The physical process dictates the distribution."
  Bad Answer: "1/2, because that's the right answer." or "It's subjective based on what you know."
  This reveals if they understand that the probability resides in the *generation mechanism*, not the geometric shape itself.

  (5) "What I'm leaving out"
  1. **Measure Theory:** Rigorous definitions of sigma-algebras distract from the modeling intuition.
  2. **Frequentist vs. Bayesian Wars:** This paradox predates and transcends that specific dichotomy.
  3. **Bertrand's Original Biography:** Historical context adds no value to the engineering lesson.
  4. **Infinite Density Arguments:** Technical debates about improper priors are too granular for this level.
  5. **Other Paradoxes (e.g., Monty Hall):** Mixing puzzles dilutes the specific lesson on parameterization.
