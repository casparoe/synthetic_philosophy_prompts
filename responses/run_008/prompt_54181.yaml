answer: |-
  Here is a principle that I believe captures the intuition behind your verdicts while addressing the structural worries you raised. I will call it the **Principle of Meta-Epistemic Revisability**.

  ### The Principle

  **A community is epistemically healthy if its mechanisms for excluding information are grounded in defeasible heuristics about source reliability, and the community retains the capacity to update those heuristics when presented with meta-evidence of their failure. A community is epistemically damaged (an echo chamber) if its exclusionary mechanism is immune to revision because challenges to the mechanism are themselves treated as evidence of the challenger's unreliability.**

  This principle has two specific clauses that do the heavy lifting:
  1.  **The Grounds Clause:** Exclusion must be based on *methodological* or *track-record* failures that are publicly verifiable, not on *motivational* attributions (e.g., "shill," "brainwashed") that are hidden and unfalsifiable.
  2.  **The Feedback Clause:** The community must allow for the possibility that its filtering rule is wrong, without treating that possibility as a betrayal or attack.

  ### Mapping Your Verdicts

  Here is how this principle adjudicates your original list, and where it forces a compromise:

  *   **Conspiracy Forum:** Fails both clauses. The grounds are motivational ("shill"), which cannot be proven false. The feedback loop is broken (disagreement = proof of shilling). **Verdict: Saved.** This confirms your intuition that it is the most damaged.
  *   **Grandmother:** Passes. There is no active exclusion mechanism, only absence. She lacks a filter, not a revision capability. **Verdict: Saved.** This confirms the "bubble" classification.
  *   **Climate Scientists & Number Theorists:** Pass both clauses. The grounds are methodological (lack of peer review, lack of training). The feedback loop exists: if an amateur produced a verified proof or data, the community would engage. The exclusion is efficient, not protective. **Verdict: Saved.** This explains why structural discrediting isn't always an echo chamber.
  *   **Abuse Survivors:** This is the hardest case. Structurally, it looks like the conspiracy forum (discredit the family). However, it passes the **Grounds Clause** differently: the exclusion is based on a statistical heuristic regarding safety and trauma response, not a claim about the *truth* of specific factual assertions in the same way a conspiracy theory is. More importantly, the *goal* is therapeutic stability, not just abstract truth-tracking. If we strictly apply the principle, this group risks being an echo chamber if they forbid *any* member from reconciling with a family. However, your verdict is that they are "epistemically valuable." To save this verdict, we must admit that **epistemic health is sometimes subordinate to pragmatic survival.** The principle holds, but we must acknowledge that in high-stakes trauma contexts, a "biased" epistemic filter can be instrumentally rational. **Verdict: Saved, with a caveat.**
  *   **Climbing Gym:** This case triggers your uncertainty because it sits on the boundary. If the claim is "dietitians are *always* wrong because of industry capture," it fails the Grounds Clause (motivational/monolithic). If the claim is "dietitians are *often* biased on supplements, check primary studies," it passes. Your uncertainty is not a failure of your judgment; it is a correct diagnosis of an under-specified exclusion mechanism. **Verdict: Indeterminate.**

  ### Addressing Your Worries

  **Worry 1: Circularity and the Inside View**
  You asked if there is a non-circular way to draw the line, or if you are just labeling communities bad when you disagree with them.
  The **Grounds Clause** solves this. You do not need to know if the conspiracy theorists are *wrong* about the conspiracy to know they are epistemically damaged. You only need to observe *how* they defend their view.
  *   **Number Theorists:** "Show me the proof." (Verifiable)
  *   **Conspiracy Forum:** "You're paid to say that." (Unverifiable)
  The distinction is not about the *truth of the belief*, but the *falsifiability of the rebuttal*. If a community explains away dissent by attributing hidden, unprovable motives to the dissenter, it is structurally an echo chamber regardless of whether their core belief happens to be true. This avoids circularity because you are analyzing the *rules of engagement*, not the *content of the doctrine*.

  **Worry 2: Truth-Independence**
  You are uneasy about the implication that a cult with true beliefs is still epistemically damaged.
  You should accept this implication. In social epistemology, **reliability is not the same as rationality.**
  A lucky cult is like a broken clock that is right twice a day. They are reliable (in that specific instance) but not justified. Their process is brittle. If the environment changes, their belief-forming mechanism will not adapt because it is shielded from feedback. The Number Theorists, conversely, have a robust process; even if they are currently wrong about a specific conjecture, their method will eventually correct it. Epistemic damage is about the *fragility of the process*, not the *current accuracy of the output*. A community that cannot learn is damaged, even if it is currently lucky.

  ### Adjudication of New Cases

  **Case 1: The Mutual-Improvement Startup**
  *   **Analysis:** Recruits are told friends calling it a pyramid scheme "don't understand the business model."
  *   **Application:** This fails the **Grounds Clause**. "Don't understand" is a soft version of "brainwashed." It attributes the dissent to a deficit in the outsider rather than engaging with the structural critique (pyramid scheme mechanics are mathematically verifiable). Furthermore, it likely fails the **Feedback Clause**: if a recruit asks, "What if the math doesn't work?", they are usually told they lack "abundance mindset."
  *   **Verdict:** **Epistemically Damaged (Echo Chamber).** This is structurally identical to the conspiracy forum, merely using softer language ("mindset" vs. "shill"). The exclusion is doing protective work for the revenue model.

  **Case 2: The Secessionist Village**
  *   **Analysis:** Factually right on local predictions for a decade; teaches children national press lies about everything.
  *   **Application:** This is your "Lucky Cult" case. They pass a superficial version of the **Track Record** test (they have been right locally). However, they fail the **Grounds Clause** regarding the national press. The rule is "the press lies about *everything*." This is a universal claim that is immune to counter-evidence. If the press reports a true story about the weather or sports, the village must twist to explain why that too was a lie, or ignore it. They have turned a heuristic (local press is hostile) into a dogma (all press is lies).
  *   **Verdict:** **Epistemically Damaged.** Their accuracy is local and contingent; their epistemic framework is brittle. They have built a wall against *all* outside information based on *some* false outside information. They are unable to update their view of the press even if the press improves, because the rule is absolute. They are the "lucky clock": right for a decade, but structurally incapable of correcting course if the national press starts telling the truth about the village.

  ### Conclusion on Your Uncertainty

  Your hesitation regarding the **Climbing Gym** is the most epistemically mature part of your reflection. Real-world cases are rarely as clean as the conspiracy forum or the number theorists. The **Principle of Meta-Epistemic Revisability** does not give you a binary answer there because the community itself hasn't decided its own rules.

  If the gym group allows members to post the dietitian's study and discuss it, but concludes the study is flawed based on data, they are healthy. If they ban the link entirely because "dietitians are shills," they are damaged. Your uncertainty signals that you are looking for evidence of their **Feedback Clause** in action. Do not resolve the uncertainty yet; use it as a diagnostic tool. Watch what happens when a member brings in contrary evidence. That reaction will tell you which side of the line they fall on.
