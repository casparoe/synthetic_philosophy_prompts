answer: |-
  This is a rigorous ethical inquiry into the philosophy of historical representation. You have correctly identified that your intuitions are not governed by a single rule (like "accuracy") but by a cluster of competing values: reputation, consent, agency, and historical understanding.

  Here is an attempt to codify your verdicts into a working framework, test its limits, and apply it to your new cases.

  ### I. The Principles of Non-Maleficent Representation

  Your verdicts are best captured not by one principle, but by three distinct clauses. Together, they form a **Principle of Non-Maleficent Representation**. This principle posits that the dramatist's primary duty is to avoid harming the moral legacy of the subject and the historical understanding of the audience.

  **Clause 1: The Prohibition on Unverified Vice (Reputation)**
  *   **Definition:** A dramatist must not attribute specific, unverified moral failings, crimes, or private transgressions to a named historical individual.
  *   **Motivating Cases:** This covers the **sabotage** (imputing professional wickedness) and the **affair** (imputing sexual misconduct).
  *   **Rationale:** These acts damage the subject's posthumous reputation and potentially harm living descendants. A disclaimer does not cure this because the dramatic image overrides the textual footnote.

  **Clause 2: The Proportionality of Interiority (Consent)**
  *   **Definition:** Speculation on a subject's private interiority (emotions, unrecorded conversations, deathbed moments) is permitted only in proportion to the subject's historical engagement with the public sphere.
  *   **Motivating Cases:** This distinguishes the **public figure's deathbed** (Fine) from the **obscure figure's deathbed** (Not Fine).
  *   **Rationale:** Public figures trade privacy for legacy; they invite interpretation. Obscure figures did not consent to be archetypes. To invent interiority for the latter is an act of ventriloquism that appropriates a voice that never sought to be heard.

  **Clause 3: The Preservation of Agency (Causality)**
  *   **Definition:** Dramatization may compress time or combine characters for clarity, provided it does not fundamentally alter who is responsible for historical outcomes.
  *   **Motivating Cases:** This validates **compression** and **composite rivals** (Fine) but sets a boundary against distorting *who* did *what*.
  *   **Rationale:** Audiences can accept "this happened faster" or "this person represents a group." They cannot accept "this person caused this" when they actually "had this happen to them."

  ### II. The Conflict: Simplicity vs. Complexity

  You identified a tension in your tentative principle: *"We owe the dead fidelity in their vices and licence in their virtues."* You noted that this principle licenses humanizing a war criminal, which makes you uncomfortable.

  **The Diagnosis:**
  Your tentative principle is too simple. It assumes that "virtue" is always a neutral or positive addition. However, in historical drama, **virtue is not just a character trait; it is an argument.**

  To invent a moment of decency for a war criminal is not merely "making them nicer." It is an intervention in historical memory. It suggests the historical record is incomplete regarding their humanity, potentially diluting the moral lesson of their crimes. Conversely, inventing a moment of weeping for a public scientist does not alter the moral understanding of their scientific contribution.

  **The Verdict:**
  **Buy the complexity.** Do not accept the simple "Licence in Virtues" rule. It fails the war criminal test because it ignores *contextual harm*.

  You must amend Clause 1 (Prohibition on Unverified Vice) to include a **Corollary on Moral Distortion**: *A dramatist must not invent virtues that fundamentally contradict the established moral essence of the subject's historical impact.*

  This creates a slight asymmetry: You can make a good person weep (emotional texture), but you cannot make a monster kind (moral essence). This is not inconsistent; it reflects the differing ethical weight of minimizing evil versus humanizing good.

  ### III. Application to New Cases

  Here is how the refined **Principle of Non-Maleficent Representation** (with the Moral Distortion Corollary) applies to your new scenarios.

  **Case 1: The Humanised War Criminal**
  *   **Scenario:** A fully documented war criminal is given an invented moment of private decency (e.g., sparing a prisoner, loving a child).
  *   **Prediction:** **Not Fine.**
  *   **Argument:** This violates the **Moral Distortion Corollary**. While it invents a "virtue," it actively works against the historical truth of their depravity. It risks generating sympathy where none is warranted by the record, thereby doing harm to the memory of the victims and the understanding of the crime. The "licence in virtues" stops where historical minimization begins.

  **Case 2: The Invented Courage of the Disaster Victim**
  *   **Scenario:** A real, long-dead disaster victim (obscure, left no trace) is given an invented act of courage (e.g., going back to save someone).
  *   **Prediction:** **Not Fine.**
  *   **Argument:** This violates **Clause 2 (Proportionality of Interiority)** and arguably **Clause 1**.
      *   *Clause 2:* As an obscure figure, they did not seek public attention. Inventing specific interior actions appropriates their silence.
      *   *Clause 1:* While courage is a virtue, inventing a specific *act* creates a false historical record. If they are obscure, they cannot defend their legacy, and if they are dead, their descendants may be burdened by a myth they cannot verify. It turns a victim into a prop for the audience's emotional satisfaction.

  **Case 3: The Rearranged Chronology (Caused vs. Happened To)**
  *   **Scenario:** A biopic rearranges time so that events the subject *caused* appear to have merely *happened to* them (making them more passive/victim-like).
  *   **Prediction:** **Not Fine.**
  *   **Argument:** This violates **Clause 3 (Preservation of Agency)**. This is more dangerous than compressing time. It fundamentally alters the subject's moral responsibility. If a leader caused a war, but the film shows the war happening *to* them, you have exonerated them of agency. This is a distortion of historical truth that outweighs narrative flow.

  ### IV. Which Verdicts Should You Give Up?

  You asked whether you should pay the price (drop a verdict) or buy the complexity. I have argued for complexity, but there is one verdict in your original list that you should consider **giving up**, or at least heavily qualifying.

  **The Verdict to Abandon:** *Creating a composite character... is fine, and possibly more honest than the alternative.*

  **Why:**
  You justified this by saying it ensures "no single person carries the blame." This is ethically sound *only if* the composite is clearly fictionalized or the blame is minor. However, composite characters often violate **Clause 3 (Agency)** and **Clause 1 (Reputation)** in subtle ways.
  *   If you stitch three rivals into one, you create a "super-rival." This exaggerates the opposition the protagonist faced, distorting the historical difficulty of their achievement.
  *   If the composite commits the "wickedness" you deemed unacceptable in the sabotage case, you have simply diffused the libel rather than removed it. You are still dramatizing a real event (sabotage) and attaching it to a character built from real people.

  **Recommendation:**
  You should give up the blanket approval of composite characters. Instead, adopt this rule: **Composites are only permissible for functional roles (e.g., "a journalist," "a guard") not for specific historical agents with named reputations.** If you must combine three rivals, they should not be named, or the audience must be explicitly told that the *opposition itself* is condensed, not just the people.

  **The Verdict to Keep (Despite the Prejudice Worry):**
  You worried that your balk at inventing interiority for the **obscure figure** was prejudice. It is not. It is a principle of **Vulnerability**. The famous have estates, biographers, and public records to contest misrepresentations. The obscure have only the dramatist. To invent a inner life for the voiceless is to colonize their silence. Keep this verdict. It is the most ethically robust one you have.

  ### Summary
  Your intuition that "vice is off-limits, virtue is open" was a strong start, but it failed to account for the *weight* of virtue in the context of evil. By upgrading your framework to protect **Moral Essence** and **Agency**, you can condemn the humanized war criminal without contradicting your approval of the weeping scientist.

  You owe the dead fidelity not just to their sins, but to their **significance**. To make a monster human is to lie about the nature of monstrosity. To make a hero weep is merely to acknowledge the cost of heroism. The distinction is not in the invention, but in the historical truth the invention serves.
