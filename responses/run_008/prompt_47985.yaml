  Imagine a branding pitch for a firm named "Block," presented in a custom geometric sans-serif where the lowercase "o" is strictly a square. On the presentation's title slide, a perfect circle appears solely as a decorative bullet point between words, functioning purely as a graphic shape. Yet on the business card, that identical circle appears in the string "br nd," kerned between a standard "r" and "n" while the square "o" appears clearly in the company name above. Observers ignore the circle on the slide as non-text, but on the card, they instantly vocalize the word "brand," supplying the vowel identity solely because the square shape has already claimed the role of "o" elsewhere in the visual system.

  **The Three Verdicts**

  1.  **Features View (Not an 'a'):** This view looks at the glyph in isolation. A lowercase 'a' requires specific structural anatomy—typically a closed counter with a vertical stem or a specific top hook. A perfect circle lacks these defining features entirely; geometrically, it is an 'o' or a dot. Since the shape carries no intrinsic 'a' information, the features theorist must conclude it is not an 'a', regardless of where it sits.
  2.  **Prototype View (Marginal 'a'):** This view compares the glyph to a mental average of all 'a's seen before. A circle shares the roundness and counter-space of a single-story 'a', so it isn't completely alien. However, because it lacks the distinctive stem that differentiates an 'a' from an 'o' in most prototypes, it registers as a strained, ambiguous candidate—a "maybe" that requires extra cognitive effort to categorize.
  3.  **System View (Perfect 'a'):** This view ignores the shape's intrinsic properties and looks at its relational slot. In this specific font ecosystem, the 'o' slot is visibly occupied by the square. The word "br nd" requires a vowel in that position to be legible. Since 'o' is unavailable, the system forces the circle into the 'a' slot to resolve the meaning. Because it fulfills the function perfectly without breaking the system, it is a flawless 'a'.

  **The Linchpin and the Removal**

  The piece of setup doing all the work is the **square 'o'**. It creates a mutual exclusivity constraint. If you remove the square 'o' from the company name and replace it with a standard round 'o', the system collapses. The circle in "br nd" immediately reverts to being an 'o' (making the word "brond," which fails) or becomes ambiguous garbage. Without the square 'o' to disambiguate the vowel slots, the circle loses its systemic permission to be an 'a', and the System View verdict flips to match the Features View.

  **Your Sister's Counter-Attack**

  As a features person, she will attack the **reliability of the context**. She will argue that if a letter only reads correctly when the reader has already scanned the rest of the alphabet to check what shapes are taken, the typeface has failed its primary job. She'll say you're describing *decoding*, not *reading*. In real life, letters are scanned saccadically and often in isolation (think URLs, passwords, or glanced signage); if the 'a' relies on the 'o' to exist, it isn't a letter, it's a variable in an equation. She will insist that a robust 'a' must carry its own identity on its own shoulders, otherwise, you haven't designed a font, you've designed a puzzle.
