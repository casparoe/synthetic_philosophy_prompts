answer: |-
  **OFFICE OF UNIVERSALIZABLE CONDUCT**
  **PUBLIC FAQ: FORM 88-U (MAXIM SUBMISSION)**

  **Q: How specific can I be when wording my personal rule?**
  A: Please avoid excessive specificity. We receive thousands of submissions monthly containing clauses such as "provided I am under significant stress," "only on national holidays," or "unless it inconveniences me." These are treated as attempts to bypass the universalization test. Specifically, the phrase "when I specifically feel like it" appears in approximately forty percent of initial drafts. It is automatically flagged. A valid maxim must apply to any rational agent in similar circumstances, not just you. If your rule requires you to be the exception, it is not a rule; it is a request for exemption, which this Office does not grant. Write the rule as if you are legislating for a species, not an individual. If you find yourself adding conditions to make the rule palatable, the rule is likely invalid.

  **Q: What do the rejection codes mean?**
  A: Denials fall into two categories. Do not inquire regarding the philosophical severity of either; both result in the same denial letter and require a thirty-day waiting period before resubmission.

  **Category A: The World Breaks.** This occurs when the universal adoption of your rule creates a logical contradiction. For example, if everyone made promises they intended to break whenever convenient, the institution of promising would cease to exist. You cannot break a promise in a world where promises are meaningless. The action becomes impossible. The system collapses.

  **Category B: The World Holds, Unfortunately.** This occurs when the world remains logically consistent, but no rational being could willingly inhabit it. For example, a world where no one develops their talents or assists others is possible, but it is one that rational agents would inevitably reject. We reject these rules not because they are impossible, but because they are undesirable. Please do not appeal based on the distinction. The outcome is identical. The form does not ask you to select a preference.

  **Q: Why was my rule rejected when my neighbor's similar rule was approved?**
  A: The universalization test is not purely algorithmic. Adjudicators assess whether a rational agent *could* will the outcome based on prevailing societal norms and contextual coherence. While we strive for consistency, the assessment of "rational willingness" inevitably reflects the collective intuition of the reviewing body. If two similar maxims receive different rulings, it is because the contextual variables differed enough to alter the adjudicator's assessment of rational desire. We recommend framing your maxim in alignment with standard community expectations to improve approval odds. Essentially, if the rule feels wrong to the clerk, it will not universalize. We suggest ensuring your proposal aligns with what most people already believe is acceptable.

  **Q: Can I act while my application is pending?**
  A: No. Acting prior to stamp approval is a Class C violation. However, given processing times, we advise submitting routine maxims in bulk. Note that emergency maxims are subject to the same review period. There is no expedited processing for moral emergencies.

  **Q: Who reviews the Board's own rules while it is on duty?**
  A: The Board operates under Standing Exemption 9. Oversight is conducted internally by the shift supervisor currently on duty. Their maxims are subject to the same review process as any civilian applicant, processed by the junior clerks on the next shift over. This ensures a continuous cycle of accountability without external interference. The system is self-regulating. If the Board fails to universalize its own conduct, the next shift will simply reject the previous shift's actions. This has never happened.
