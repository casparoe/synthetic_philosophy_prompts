answer: |-
  Subject: Decision procedure for cross-values partnership proposals

  Hi team,

  I am writing this to formalize how we evaluate partnership proposals where organizations with divergent moral frameworks attempt to collaborate, what my friend with the philosophy background calls moral trade. We have been relying on intuition to assess these requests, but as the volume and financial stakes increase, we need a reproducible decision procedure that distinguishes between genuine value creation and mission drift or reputational liability. The goal of this procedure is not to make the ethical decision for us, but to structure our inquiry so that we know when we are dealing with facts versus when we are dealing with judgment calls that require senior leadership or board intervention. Please note that this procedure is designed to fail safe, meaning that if a proposal cannot clear a step, the default recommendation is no, and any step that requires subjective weighing of values must be flagged for human review rather than automated approval.

  The first step in the procedure is the Clarity Test, where we ask both partner organizations to articulate the exchange in a single sentence that specifies exactly what action each party will take and what specific outcome they expect from the other. A sufficient answer looks like Organization A will perform Action X which costs them low resources but provides high value to Organization B, while Organization B performs Action Y which costs them low resources but provides high value to Organization A. If either party cannot define the exchange this clearly, or if the actions are vague promises of goodwill rather than concrete deliverables, the procedure stops here with a no recommendation because ambiguous trades cannot be enforced. If they pass this, we move to the Hard Constraint Test, which asks whether either action violates a core constitutional, doctrinal, or legal prohibition for either party. This is a binary check where we look at bylaws, mission statements, or religious doctrines to see if an action is explicitly forbidden, not just disfavored. If either party is being asked to do something their own governance documents forbid, the procedure stops with a no, and this is a hard stop that cannot be overridden by potential benefits. If there is ambiguity about whether something is forbidden versus merely unpopular, this is a judgment call that must be handed off to legal counsel or the board before proceeding.

  Assuming the actions are permissible, the third step is the Asymmetry Test, which verifies the core logic of moral trade by asking whether the cost of the concession is genuinely low for the giver relative to the value it provides the receiver. We need evidence that the animal group does not care much about deworming metrics, or that the health charity does not view food policy as central to their mission. If both parties care equally about both issues, this is not a trade but a standard collaboration, and if one party is making a high-cost concession, they are likely being exploited or coerced. A sufficient answer requires internal communications or past behavior showing the concession is marginal for them. If the costs appear high for either side, we flag this as a potential conversion attempt where one side is trying to change the other's mission rather than trade with it, and the proposal is handed off to senior leadership for a values assessment. The fourth step is the Verification Test, which asks how each party will confirm the other actually delivered their end of the bargain. A sufficient answer involves public records, third-party audits, or measurable metrics that are visible to outsiders. If the deliverable is private or subjective, such as a change in internal tone or a private endorsement, the procedure stops with a no because unverified trades create liability for us as the fiscal sponsor. Finally, the Reputational Test asks whether the association creates significant backlash risk for the foundation or either partner that outweighs the programmatic benefits. This is inherently subjective, so if the risk is unclear, the procedure does not decide but instead flags the issue for the communications team and the board to weigh the tolerance for controversy against the potential impact.

  Applying this procedure to the first proposal regarding the animal advocacy group and the public health charity, the Clarity Test passes easily as the exchange of endorsements is specific. The Hard Constraint Test likely passes because neither supporting deworming nor endorsing plant-based options violates typical nonprofit bylaws, though we must check if the health charity is legally restricted from lobbying on food policy. The Asymmetry Test seems strong since the animal group likely values deworming positively even if it is not their focus, and the health charity may find food endorsement low-cost compared to their core medical work, but we need to verify the health charity does not view food policy as a slippery slope that distracts from their mission. The Verification Test passes because public endorsements are visible. The Reputational Test is the main hand-off point here, as some donors might dislike the politicization of health charity, so this requires a human judgment call on our risk tolerance, but procedurally it looks like a viable trade.

  The second proposal involving the conservation organization and the wild-animal suffering group is more complex and requires me to be honest about my own bias toward forests. The Clarity Test passes as the switch from forest to wetland is concrete. The Hard Constraint Test is the critical failure point here because if the conservation organization's mission is specifically forest conservation, switching to wetlands to reduce sentient suffering violates their core purpose, even if wetlands are ecologically valuable. If their mission is general biodiversity, it might pass, but we must verify if the switch is motivated by ecology or by the donor's moral view on suffering, as the latter risks mission drift. The Asymmetry Test is suspicious because restoring a wetland instead of a forest might be high-cost for the conservation group in terms of expertise and donor relations, suggesting they are conceding too much. The Verification Test passes as land restoration is visible. However, because this trade relies on the controversial moral view that fewer sentient animals are better, the Reputational Test flags this as high risk for the foundation. I love forests, but if the procedure indicates the conservation group is abandoning their specific mission to satisfy a donor's philosophical view on suffering, this is a no, and I must recuse myself from the final decision to ensure my personal preference for forests does not obscure the mission drift risk.

  The third proposal between the faith-based shelter and the secular harm-reduction group hinges entirely on the Hard Constraint Test. The Clarity Test passes as cross-promotion is specific. However, the Hard Constraint Test requires us to determine if the shelter's belief that needle exchange is morally wrong constitutes a prohibition on endorsing organizations that provide them. If their doctrine forbids facilitating sin, even indirectly, then promoting the harm-reduction group violates their core constraints, and the procedure stops with a no. Conversely, if the harm-reduction group has a policy against partnering with organizations that stigmatize their services, that is also a hard constraint. The Asymmetry Test is hard to gauge without knowing if the shelter views this promotion as spiritually costly. The Verification Test passes. The Reputational Test is high risk regardless of the outcome, as both secular and religious donors could be alienated. This proposal cannot be decided by the procedure alone because it rests on theological interpretation of what constitutes endorsement versus acknowledgement, so this must be handed off to legal and the board for a values ruling on whether conscience clauses allow for this type of cooperation.

  In summary, this procedure is designed to catch the obvious failures in definition, constraints, and verification, but it will frequently hand off decisions to you when the issue turns on reputational risk or theological interpretation. Please use this to draft your initial memos, and clearly mark any step where you had to make a judgment call rather than finding a factual answer. If a proposal fails the Hard Constraint or Verification steps, do not bring it to the board unless there is new information, but if it fails the Reputational or Asymmetry steps, bring it forward with the risks clearly labeled so leadership can decide if the moral trade is worth the friction. I know this adds steps to your week, but it should reduce the time we spend debating the same philosophical questions on every new proposal.

  Best regards,

  Director of Partnerships
