  Been reading rationalist blogs since the Overcoming Bias days, so I've absorbed a lot of half-remembered voting theory over the years, and I could use help sorting out a take I ran into. On a forum thread about voting reform (this comes up like once a month in these parts), someone summarized the Gibbard–Satterthwaite theorem like this:

