answer: |-
  1. **"What the post gets right"**
  The core skeleton is accurate: the Gibbard–Satterthwaite (G-S) theorem does prove that for any deterministic voting rule where voters submit ordinal rankings over three or more candidates, if the rule is surjective (every candidate can win), it is either dictatorial or manipulable. There is no perfect ranked-choice system where truth-telling is always a dominant strategy. The poster is also correct that Approval Voting is not immune to strategy; voters often face incentives to "bullet vote" or approve less-preferred candidates to block a worse outcome.

  2. **"What's subtly off and what's wrong"**
  The comparison to Arrow is category confusion. Arrow's Impossibility Theorem concerns aggregating preferences into a consistent *social ordering* (transitivity, IIA), whereas G-S concerns selecting a single *winner* without incentivizing lies. They share a nihilistic vibe but rely on different axioms; one isn't a restatement of the other.

  The Approval Voting claim is technically imprecise. G-S strictly applies to functions mapping *ordinal rankings* to outcomes. Since Approval inputs are cardinal (binary approvals), G-S doesn't formally cover it. While Approval is indeed manipulable, claiming G-S proves this is sloppy theorizing. More importantly, saying advocates are "fooling themselves" ignores that mechanism design aims to *reduce* the complexity or frequency of strategy, not necessarily eliminate it entirely. Approval often simplifies strategy compared to IRV or Plurality, even if it doesn't remove it.

  The most egregious error is the claim that "no amount of clever mechanism design fixes this, not for auctions, not for matching markets." This is factually false. The Vickrey–Clarke–Groves (VCG) mechanism is strategy-proof for auctions (truth-telling is a dominant strategy). Similarly, the Gale–Shapley algorithm is strategy-proof for the proposing side in matching markets. G-S applies to deterministic social choice functions with unrestricted domains; it does not outlaw incentive-compatible mechanisms in restricted domains or with monetary transfers.

  Finally, the phrase "strategic voting is always rational somewhere" conflates possibility with necessity. Strategy depends on information; without polling data, honest voting is often the rational default. The theorem proves a vulnerability exists, not that exploitation is always feasible or profitable for every voter in every election.

  3. **"Does his conclusion follow"**
  No. The leap from "perfection is impossible" to "improvement is worthless" is a nirvana fallacy. First-past-the-post (FPTP) is uniquely vulnerable to spoiler effects and high-strategy equilibria (two-party duopoly). Switching to methods like Score or Approval may not eliminate strategy, but they can drastically reduce the *cost* of voting honestly and mitigate the spoiler effect. G-S proves you can't build a tank-proof car, not that you should stop installing seatbelts.

  4. **"Corrected takeaway"**
  Gibbard–Satterthwaite proves no ranked voting system is perfectly strategy-proof, but it doesn't apply to cardinal methods like Approval, nor does it invalidate strategy-proof mechanisms in auctions or matching. Voting reform isn't about finding a flawless system, but about choosing one where honest voting is *safer* and spoilers are less likely than under FPTP.
