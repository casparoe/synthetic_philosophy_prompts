  Something about this bugs me but I honestly can't put my finger on what. Like, I know approval voting ballots aren't rankings, so maybe the theorem just doesn't apply? But the "you just move the strategizing to picking a cutoff" part sounds right to me — isn't choosing where to set your cutoff literally the strategic voting problem? Also not sure the "basically Arrow restated" thing is fair, they always get lumped together but I vaguely remember them being about different things. And the poster ended by arguing we should give up on voting method reform entirely and stop dunking on first-past-the-post, which feels like a strech, but I can't tell if it follows from what's true in his summary or not.

  Can you audit this for me? Please structure the response like this:

  1. "What the post gets right" — short paragraph, just the accurate skeleton
  2. "What's subtly off and what's wrong" — the meat, go claim by claim through the quoted summary and separate the defensible-but-sloppy stuff from the actual misapplications, especially the Arrow comparison, the approval voting claim, and the "nothing can be fixed" leap (~400 words)
  3. "Does his conclusion follow" — whether anything true in the summary supports giving up on voting reform (~100 words)
  4. "Corrected takeaway" — what I should actually believe about G–S and voting methods, short
