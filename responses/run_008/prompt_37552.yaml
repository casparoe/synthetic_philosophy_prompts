  For Goodman, painting is autographic: a work's identity is inseparable from its history of production. Unlike a musical score (allographic), where identity rests on notation compliance, a painting's authenticity requires the correct causal genesis. Thus, *The Supper at Emmaus* is not a Vermeer, regardless of visual indistinguishability. The revelation corrupts the work's identity, not merely its attribution. Goodman is silent on van Meegeren's motives, the Göring sale, or the market value; these are extraneous to the ontological status of the work. He also does not explain why critical praise evaporated into claims of "kitsch" without physical change, only that the object previously appreciated no longer exists as such.

  For Dutton, artworks are performances recording human achievements. Value derives from the specific difficulties overcome and innovations realized by the artist. The audience valued *Emmaus* as a record of Vermeer's 17th-century genius. The revelation reidentifies the performance as van Meegeren's 20th-century mimicry. Since van Meegeren was a dismissed painter imitating rather than innovating, the achievement recorded is lesser, defeating the earlier appreciation. Dutton is similarly silent on the legal collaboration charge or the specifics of the Göring transaction, focusing solely on the aesthetic appreciation of the act.

  Turning from case to theory, the *Emmaus* episode confirms both theories against the view that we value paintings solely for their visual properties. Since the canvas remained physically unchanged while value collapsed, aesthetic worth must depend on causal history. However, the episode exposes a gap regarding the *nature* of that dependency. The immediate redescriptions of the painting as "kitsch" suggest either a genuine shift in perceived aesthetic properties based on history (supporting Goodman/Dutton) or mere critical conformism.

  This divergence is sharpest in the "never learns" scenario. Consider a viewer who never learns of the forgery. For Goodman, this viewer is aesthetically engaged with a forgery, which he insists is relevant even if undetectable. This is embarrassing: if the forgery is undetectable, how is the aesthetic experience compromised? Goodman asserts a metaphysical difference without a clear phenomenological one. Dutton handles this better. For Dutton, the viewer attributes a specific achievement to the work. If they never learn the truth, they continue to value the (fictional) Vermeer achievement. Their appreciation is based on a false premise, but the value remains intact for them. Dutton thus explains why knowledge is constitutive of the valuation: once the achievement is reidentified, the value changes. Goodman struggles to explain why the undetectable fake is aesthetically inferior if the experience is identical.

  Verdict: Dutton's theory survives in better shape. It accounts for the volatility of critical opinion by tying value to the *status* of the achievement, which changes upon revelation. Goodman's rigid ontological distinction explains why it isn't a Vermeer, but not why it becomes "kitsch" rather than just "a good van Meegeren." Both theories, however, are tested beyond anticipation by the sociological speed of the reversal. Neither author fully anticipates that the art world's valuation might rely less on rigorous historical verification (which failed initially) and more on the authority of figures like Bredius. The episode reveals that while both theories correctly identify history as crucial, they underestimate the fragility of the institutional mechanisms that certify that history.
