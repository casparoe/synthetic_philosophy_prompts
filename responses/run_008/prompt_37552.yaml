          *   Structure: Theory-to-Case (what each says was lost/corrupted, where silent) AND Case-to-Theory (does it confirm or expose gaps, specifically regarding the collapse of critical opinion vs. conformism, and the "never learns" scenario).
          *   Conclusion: Verdict on which theory survives better + one respect both are tested beyond anticipation.
          *   Word Count: Under 800 words.
          *   Tone: Disciplined, analytical.

  2.  **Deconstruct the Theories (based on prompt instructions):**
      *   **Goodman:** Autographic vs. Allographic. Painting is autographic (history of production matters, forgery is relevant even if undetectable). Music is allographic (notation defines identity, forgery of score irrelevant if sound is same). Forgery corrupts the authenticity of the work's history.
      *   **Dutton:** Artworks as performances/achievements. Value depends on the achievement recorded. Forgery misrepresents the achievement (van Meegeren's skill vs. Vermeer's genius). Revelation changes the perceived achievement.

  3.  **Drafting - Section by Section:**

      *   **Introduction:** Briefly set the scene (van Meegeren, Vermeer, *Emmaus*).
      *   **Theory to Case (Goodman):**
          *   Define autographic: History of production is constitutive.
          *   Apply: *Emmaus* is not a Vermeer because it lacks the correct history of production, regardless of visual similarity.
          *   Undetectable forgery: Still aesthetically relevant because authenticity is a condition of identity in autographic arts.
          *   Silence: Goodman doesn't care about motives (collaboration), money (Göring), or psychological shifts in critics (praise to kitsch) unless tied to authenticity conditions. He doesn't explain *why* the value drops so dramatically upon revelation if the object is physically unchanged, other than it's a different work identity.
      *   **Theory to Case (Dutton):**
          *   Define performance/achievement: We value the human achievement behind the object.
          *   Apply: We thought we were valuing Vermeer's 17th-century achievement; we were actually valuing van Meegeren's 20th-century achievement.
          *   Revelation: Defeats appreciation because the achievement is lesser (imitation vs. innovation) or different.
          *   Silence: Dutton doesn't address the legal status (collaborator) or the market mechanics (Göring) directly, focusing on the aesthetic appreciation of the act.
      *   **Case to Theory (The Critical Collapse):**
          *   Fact: Praise evaporated, redescribed as kitsch, no physical change.
          *   Goodman: Supports the view that identity is historical. If identity changes, aesthetic properties attributed to "Vermeer" no longer apply. However, Goodman is embarrassed by the *degree* of shift. If undetectable forgery is aesthetically relevant, why did experts love it *as Vermeer*? Goodman implies we *should* value the authentic history, but doesn't fully explain the psychological crash from "masterpiece" to "kitsch" solely on identity grounds.
          *   Dutton: Handles the crash better. The value was in the *achievement*. Once the achievement is reidentified as van Meegeren's (a competent dismissed painter), the value drops.
          *   The "Never Learns" Scenario:
              *   Someone who never learns it's a fake continues to value it as Vermeer.
              *   Goodman: They are mistaken about the work's identity, but their aesthetic experience might remain. Goodman insists the forgery is aesthetically relevant even if undetectable, which is counter-intuitive here (if you can't tell, does it matter?).
              *   Dutton: They are valuing a fictional achievement. Dutton explains why the value is contingent on knowledge of the performance.
              *   Conformism vs. Causal/History: The collapse suggests we value causally/historically (Goodman/Dutton agree) rather than purely formally. If it were formalism, the physical unchanged canvas would retain value. The collapse confirms both theories against formalism. However, the *speed* of the collapse suggests conformism.
              *   Which handles "never learns" better? Dutton. If art is appreciation of achievement, ignorance sustains the illusion of value. Goodman insists the object *is* different, so the ignorance is metaphysical error. Dutton makes it an error of evaluation based on facts.
      *   **Verdict:**
          *   Dutton survives better because it explains the *valuation* shift (achievement vs. imitation) more dynamically than Goodman's binary identity claim.
          *   Shared Test: Both are tested by the *psychological* volatility of the critics. Neither fully predicts why "masterpiece" becomes "kitsch" instantly without physical change, beyond the label switch. They anticipate philosophical classification, not sociological panic.

  4.  **Refining and Editing (Word Count Check):**
      *   Need to be concise.
      *   Ensure I don't bring in outside info (e.g., specific chemical details of the forgery, other forgers).
      *   Check the "never learns" prediction requirement.
      *   Check the "silence" requirement (Göring, motive).

  5.  **Drafting - Step-by-Step (Mental or Scratchpad):**
      *   *Goodman:* Painting is autographic. Identity requires correct history of production. *Emmaus* is not Vermeer. Undetectable forgery matters because it breaks the chain of authenticity. Silence: Motive, Göring price, psychological shift from masterpiece to kitsch (he cares about identity, not quality shifts).
      *   *Dutton:* Art is performance. Value = achievement. We valued Vermeer's genius; got van Meegeren's mimicry. Revelation defeats appreciation. Silence: Legal collaboration, market specifics.
      *   *Case to Theory:* Collapse of opinion. Shows we value history/causality, not just form. If formalism were true, physical unchanged = value unchanged. Both theories confirm this.
      *   *Never Learns:* If a viewer never knows, they value it as Vermeer. Dutton explains this: they attribute the wrong achievement. Goodman says they are viewing a different work but don't know it. Dutton handles the *valuation* dependency on knowledge better. Goodman is embarrassed because he claims undetectable forgery is aesthetically relevant, yet the viewer's experience is unchanged.
      *   *Verdict:* Dutton wins on explaining the value drop. Both tested by the sociological speed of the reversal (conformism vs. genuine aesthetic shift).

  6.  **Writing the Response (incorporating constraints):**
      *   *Constraint Check:* "Do not bring in further named theories... beyond the two given." "Keep under 800 words."
      *   *Focus:* Ensure the "Theory to Case" and "Case to Theory" mapping is explicit.

      *(Self-Correction during drafting)*: Make sure to explicitly mention the Göring sale and motive as areas of silence. Ensure the "never learns" prediction is clear.

      *Drafting text:*
      For Goodman, painting is autographic: a work's identity is inseparable from its history of production. Unlike a musical score (allographic), where identity rests on notation compliance, a painting's authenticity requires the correct causal genesis. Thus, *The Supper at Emmaus* is not a Vermeer, regardless of visual indistinguishability. The revelation corrupts the work's identity, not merely its attribution. Goodman is silent on van Meegeren's motives, the Göring sale, or the market value; these are extraneous to the ontological status of the work. He also does not explain why critical praise evaporated into claims of "kitsch" without physical change, only that the object previously appreciated no longer exists as such.

      For Dutton, artworks are performances recording human achievements. Value derives from the specific difficulties overcome and innovations realized by the artist. The audience valued *Emmaus* as a record of Vermeer's 17th-century genius. The revelation reidentifies the performance as van Meegeren's 20th-century mimicry. Since van Meegeren was a dismissed painter imitating rather than innovating, the achievement recorded is lesser, defeating the earlier appreciation. Dutton is similarly silent on the legal collaboration charge or the specifics of the Göring transaction, focusing solely on the aesthetic appreciation of the act.

      Turning from case to theory, the *Emmaus* episode confirms both theories against formalism: since the canvas remained physically unchanged while value collapsed, aesthetic worth must depend on causal history rather than form alone. However, the episode exposes a gap regarding the *nature* of that dependency. The immediate redescriptions of the painting as "kitsch" suggest either a genuine shift in perceived aesthetic properties based on history (supporting Goodman/Dutton) or mere critical conformism.

      This divergence is sharpest in the "never learns" scenario. Consider a viewer who never learns of the forgery. For Goodman, this viewer is aesthetically engaged with a forgery, which he insists is relevant even if undetectable. This is embarrassing: if the forgery is undetectable, how is the aesthetic experience compromised? Goodman asserts a metaphysical difference without a clear phenomenological one. Dutton handles this better. For Dutton, the viewer attributes a specific achievement to the work. If they never learn the truth, they continue to value the (fictional) Vermeer achievement. Their appreciation is based on a false premise, but the value remains intact for them. Dutton thus explains why knowledge is constitutive of the valuation: once the achievement is reidentified, the value changes. Goodman struggles to explain why the undetectable fake is aesthetically inferior if the experience is identical.

