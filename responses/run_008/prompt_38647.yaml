answer: |-
  Yes, the pattern you have identified is formally known as **performative contradiction**, and this concept explains both the self-defeating nature of your examples and the limited scope of what the *cogito* can prove.

  A performative contradiction occurs when the content of a statement contradicts the presuppositions required to make the statement. Unlike a plain logical contradiction (e.g., "it is raining and not raining"), which is false regardless of who says it or when, a performative contradiction requires a speaker and an act of utterance to fail. For example, the sentence "I am not speaking" is logically consistent—it describes a possible state of affairs—but it becomes false the moment it is uttered. This distinguishes it from circular reasoning, where the conclusion is assumed in the premises; in a performative contradiction, the premises may be empty, but the *act* of arguing validates the opposite of the conclusion. It also differs from hypocrisy (like the smoking doctor), where the action contradicts the advice; hypocrisy undermines the speaker's credibility, but the advice itself ("smoking is bad") remains true, whereas in a performative contradiction, the truth claim itself collapses because of the act.

  All four instances you collected belong to this family, though the fourth requires a slight nuance. The *cogito*, the denial of absolute truths, and the claim "I do not exist" are classic examples where the act of asserting proves the falsity of the assertion. The hard determinist case is often called **epistemic self-defeat**: if the argument is true, it was not reached by reasoning, so there is no rational reason to accept it. By presenting it as an argument to be weighed, the determinist performs the very reasoning they claim is illusory, creating a pragmatic conflict between the content (reasoning is impossible) and the performance (here is a reason to believe me).

  Regarding your second question, the concept of performative contradiction does indeed explain the shortfall you sensed in the *cogito*. Because the certainty arises solely from the performance of the thought, it guarantees only the existence of the *event* of thinking at that specific moment, not the existence of a persistent entity doing the thinking. This critique was famously articulated by the physicist Georg Lichtenberg, who suggested Descartes should have written "It thinks" rather than "I think," much like we say "it lightnings" rather than "I lightning." The performative act secures the phenomenon (thinking is occurring) but cannot bridge the gap to a substance (a self that owns the thinking) or to duration (that the self existed before or will exist after).

  The principled way to state the limit of such arguments is that they validate the **immediacy of the performance** but not the **ontology of the performer**. A performative contradiction proves that the conditions necessary for the utterance are currently met, but it cannot extrapolate beyond the moment of utterance. Therefore, you are correct that the *cogito* secures the present occurrence of consciousness but cannot legitimately yield a persisting soul, a continuous identity, or any truth about the external world without additional premises.
