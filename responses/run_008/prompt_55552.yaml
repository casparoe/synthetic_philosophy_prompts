      *   *Correction:* Ensure the distinction between "cause" (efficient cause) and "material cause" is clear. *Ex nihilo* usually refers to material cause (out of what stuff?), while First Cause arguments refer to efficient cause (who/what pushed?). This is a key point of confusion between the friends.
