  **ADVISORY COMMITTEE ON SENTIENCE GRADATIONS (ACSG)**
  **MINUTES OF MEETING 442**
  **Date:** 14 November 2024
  **Present:** Dr. E. Vance (Chair), Dr. S. Aris (Ethics), Mr. J. Hale (Legal), Ms. L. Pryce (Junior Analyst)
  **Apologies:** None

  **1. Vertebrate Classifications**
  The Chair noted that protections for mammals, birds, and reptiles remain settled under existing frameworks. The Committee reviewed the status of amphibians. It was agreed that vertebrate status provides a sufficient proxy for sentience in these cases. Discussion was minimal.

  **2. Pisces (Fish)**
  Dr. Aris proposed applying the precautionary principle to all elasmobranchs and teleosts. Mr. Hale noted that legislative ambiguity regarding "gradations" requires a binary regulatory output. Dr. Aris argued that unequal degrees of concern are not equivalent to zero concern. The Committee voted to extend protections to fish pending further review of nociceptive thresholds.

  **3. Invertebrates and Insecta**
  The Committee addressed the extension of remit down the sentience scale. Dr. Aris argued that moral status tracks capacity for suffering in degrees; a boundary is not a threshold. Mr. Hale countered that indeterminacy regarding a fact does not constitute absence of the fact, nor does it justify universal protection.

  The Committee sought operational criteria for sentience.
  *   *Proposal:* "Structural collapse when prodded."
  *   *Objection:* Mr. Hale noted a thermostat collapses its circuit when prodded by heat.
  *   *Proposal:* "Nociceptive avoidance behavior."
  *   *Objection:* Mr. Hale noted plants exhibit phototropic avoidance.
  *   *Proposal:* "Trade-offs between harm and reward."
  *   *Objection:* Mr. Hale noted automated systems optimize utility functions similarly.

  The Chair observed that the Committee could not identify a behavioral marker separating sensing from feeling. The Chair noted this constitutes the "problem of other minds." Discussion closed.

  **4. Flora**
  Dr. Aris presented data on chemical signaling between trees via mycorrhizal networks. The Chair requested this item be excluded from the formal minutes.

  **5. Any Other Business**
  Ms. Pryce raised the status of mechanical thermostats. She submitted that the thermostat in her office "seems to suffer" when set below 19°C, citing erratic clicking and apparent distress signals.

  A motion was proposed to grant the office thermostat provisional welfare status. The motion was taken seriously. The vote was defeated on a technicality. The minutes note that the Committee was unable to specify what the technicality was. Ms. Pryce asked to have her dissent recorded.

  **Action Points**
  1.  Draft guidance on fish nociception (Deferred to next meeting).
  2.  Define operational criterion for insect sentience distinct from automated response (Deferred to next meeting).
  3.  Review legal definition of "technicality" regarding mechanical appliances (Deferred to next meeting).
  4.  Consult legal counsel regarding liability for plant signaling (Deferred to next meeting).

  **Closing**
  The meeting ran over time. The Chair noted that the janitor unplugged the thermostat in the meeting room to clean the floor. No one present considered this an ethical event, the significance of which was noted and deferred.

  **Meeting adjourned.**
