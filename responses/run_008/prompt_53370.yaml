      *   **Perspective:** First-person narrator (a novelist).
      *   **Character:** A supporting character (like Dagmar, but renamed/reimagined) who is killed off. Needs to feel alive (texture, backstory) but also explicitly fabricated (draft changes, authorial control).
      *   **Key Themes:** The paradox of fiction (without naming it), the duality of creator/mourner, the unreliability of emotion vs. fabrication, using fictional grief to avoid real grief.
      *   **Specific Requirements:**
          *   Show the character alive (texture, habits).
          *   Show the machinery of writing intruding (draft changes, existence tied to thought).
          *   Scene: Explaining the death to someone (partner/therapist/writer), lying that she's real to make the grief legible, listener cries, narrator hates that it works.
          *   Scene: Rereading an old draft where she *doesn't* die, feeling nothing (scarier than crying).
          *   Ending: Unresolved. Reader unsure if emotions were real, but still sad.
          *   Narrator Trait: Slightly worse than the user. Uses fictional dead to avoid real dead.
          *   Constraint: Do NOT use the phrase "paradox of fiction."
          *   Length: Long enough to build attachment (not 400 words).
          *   Tone: Honest, uncomfortable, not clever metafiction for its own sake.

  2.  **Character & Plot Development:**
      *   **Narrator:** Needs to be somewhat selfish. Let's call him Elias. He's avoiding a real loss (maybe a parent or partner). Let's go with a father. It adds weight to the "using fiction to avoid reality" aspect.
      *   **Fictional Character:** Needs a name. Let's go with "Elara." No, too fantasy. "Mara." "Sibley." Let's go with "Helen." She needs a specific habit. Dagmar clicked her tongue. Helen maybe smooths her apron or hums. Let's say she polishes silverware even when it's clean. She's older, a mentor figure.
      *   **The Death:** Needs to be poignant. Illness? Accident? Let's go with a quiet passing, maybe in her sleep, but written violently on the page.
      *   **The Real Loss:** Elias's father died a year ago. He hasn't processed it. He's pouring that energy into Helen.
      *   **The Confidant:** A partner named Sarah. She's empathetic but distant from the writing process.
      *   **The Draft Scene:** Finding an early version where Helen lives. The indifference is the horror.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Establish the crying. The physical act of writing the death. The immediate switch to normalcy (dinner). Establish the duality immediately.
      *   **Building Helen:** Show her alive. The polishing habit. The specific voice. Make the reader care.
      *   **The Intrusion:** Remind the reader this is code on a screen. The backspace key. The decision to kill her.
      *   **The Conversation:** Elias talks to Sarah. He implies Helen is real (or blurs the line). Sarah cries. Elias feels guilty/manipulative.
      *   **The Real Grief:** Hint at the father. The unopened boxes. The way Helen's death substitutes for the father's.
      *   **The Old Draft:** Finding the version where she survives. The lack of emotion. The realization that the grief was contingent on the plot necessity, not the "person."
      *   **The Ending:** Lingering sadness despite knowing it's fake. The unresolved feeling.

  4.  **Refining the "Worse Person" Aspect:**
      *   Elias shouldn't just be sad; he should be *using* this. He should feel superior to Sarah for believing him, or relieved that he can cry for Helen instead of his dad. He needs to be aware of the manipulation and lean into it slightly.
      *   When Sarah cries, he should feel a spike of power, not just guilt.
      *   He should neglect something real to focus on the fake.

  5.  **Refining the "Paradox" Execution:**
      *   Don't explain it. Show the switch.
      *   "I killed her at 2 PM. At 7 PM I ate steak."
      *   "I changed her middle name in draft four. Does she know?"
      *   "I deleted a scene where she laughed. Did she ever laugh?"

  6.  **Writing - Step-by-Step:**

      *   *Scene 1:* The death scene writing. The tears. The cleanup.
      *   *Scene 2:* Helen's life. The silverware. The smell of lavender and antiseptic.
      *   *Scene 3:* The intrusion. The cursor blinking. The decision tree.
      *   *Scene 4:* Dinner with Sarah. The lie. Her tears. His resentment/satisfaction.
      *   *Scene 5:* The father's box. The avoidance.
      *   *Scene 6:* The old draft. The numbness.
      *   *Scene 7:* Conclusion. The sadness remains.

  7.  **Self-Correction during drafting:**
      *   *Check:* Am I making Helen too real? I need to pull the rug out.
      *   *Fix:* Insert sentences like "I gave her that scar in chapter three because I needed a visual hook."
      *   *Check:* Is the narrator too likable?
      *   *Fix:* Make sure he judges Sarah for crying over a lie. Make sure he ignores his dad's anniversary.
      *   *Check:* Is the ending unresolved?
      *   *Fix:* Don't explain why he's still sad. Just let the sadness sit there alongside the knowledge of falsity.

  8.  **Final Polish:**
      *   Ensure the transition between "Helen is real" and "Helen is text" is jarring.
      *   Check word count (needs to be substantial).
      *   Verify no "paradox of fiction" phrase.

