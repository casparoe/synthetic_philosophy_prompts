answer: |-
  I killed Clara at 2:14 PM on a Tuesday. I was wearing a grey t-shirt with a coffee stain on the hem. I typed the period at the end of the sentence where her heart stops, and then I put my forehead on the desk and sobbed. It wasn't a writer's cry, the kind you perform to feel industrious. It was a wet, ugly gulping that seized my diaphragm. I mourned the way she used to hum when she peeled potatoes. I mourned the specific shade of blue in her cardigan.

  At 7:00 PM, I washed my face, put on a clean shirt, and went to meet Sarah for sushi. I ate six pieces of salmon and complained about the traffic on the bridge. I was fine. The grief had evaporated like steam off a wet pavement.

  This is the thing nobody tells you about making people out of words: you are the god who drowns them, and you are the widow left on the shore. You hold both ends of the rope.

  Clara was seventy-two in the manuscript. She ran the community garden behind the row houses. I gave her a habit of touching her throat when she was lying, a little nervous flutter against her Adam's apple. I wrote that in Chapter 4. In Chapter 12, I decided she needed to be more stern, so I deleted the throat touching and gave her a habit of polishing silverware that was already clean. I spent three scenes describing the rhythm of the cloth on the metal. *Shhh. Shhh. Shhh.* I made sure the reader heard it. I wanted you to love her. I needed you to love her so that when I broke her ribs in Chapter 18, it would matter.

  Does that make the grief fake? Knowing I chose the silverware? Knowing I calculated the rhythm?

  When I got home from dinner, Sarah was waiting on the couch. She had her grading pile on the coffee table, but she'd pushed it aside. She knew I was having a hard day with the manuscript.

  "Did you finish the chapter?" she asked.

  "Yeah," I said. I poured a glass of wine. My hand was steady. "Clara died."

  Sarah's face softened. She's a teacher; she has a face made for receiving bad news. "Oh, Mark. I know how much you like her."

  "It's heavy," I said. I sat next to her. I didn't tell her Clara was code on a hard drive. I didn't tell her I could press Command-Z and bring her back to life in thirty seconds. I let the silence sit there, heavy and wet. "She didn't want to go. She was worried about the frost on the tomatoes."

  "That's heartbreaking," Sarah whispered. She reached out and took my hand. Her eyes were glossy. She was crying. For Clara.

  I looked at her tears and felt a spike of something cold in my chest. It wasn't gratitude. It was power. I had transferred the pain from my head into hers without any physical contact. I had infected her. I hated her for crying. I hated her for believing me enough to bleed for a woman who never breathed. But mostly, I hated myself because I was using Clara's corpse to check if I still had a pulse.

  "It feels like losing someone real," I said. I didn't say *is* like losing someone real. I let the ambiguity hang there.

  "I know," Sarah said. She squeezed my hand. "It's okay to grieve."

  She thought I was talking about Clara. I was thinking about my father, who had been dead for eleven months. I hadn't cried at his funeral. I hadn't cried when we scattered his ashes in the sound. I had sat there dry-eyed, thinking about plot structures. But here, on this beige couch, over a woman who only existed when I was typing about her, I could access the sadness. I could unlock the cabinet where I'd put the real grief and take it out to play with, as long as I pinned it to Clara's name.

  "I'm going to bed," I said, pulling my hand away.

  "Do you want me to come up?"

  "No. I need to edit the scene."

  I went to my study. I sat in the chair where I had cried six hours earlier. I opened the laptop. The cursor blinked at the end of the sentence where Clara died. *Her hands went cold.*

  I opened the backup folder. I wanted to see her before I broke her. I found a draft from three months ago, Draft 7. In this version, I hadn't decided to kill her yet. In Draft 7, Clara survives the winter. She plants tulips. She argues with the protagonist about the property line.

  I started reading.

  *Clara wiped her hands on her apron. 'You're being stubborn, Mark,' she said. 'The soil needs rest.'*

  I waited for the pang. I waited for the familiar ache of loving her.

  Nothing.

  I read the next page. She laughed at a joke. She made tea. I felt nothing. It was like reading a grocery list. There was no hum in the room. There was no ghost in the machine. In Draft 7, she was immortal, and because she was immortal, she was inert. She was just data.

  In Draft 12, the current one, she was dead. Her death gave her weight. Her death gave her mass. I had to destroy her to make her real enough to mourn.

  I remembered a philosophy professor I had in college. He talked about suspension of disbelief. He said we agree to pretend the lie is true so we can feel the truth. He was wrong. It wasn't an agreement. It was a violation. I wasn't pretending Clara was real. I was forcing her to be real by killing her, and then I was forcing myself to be real by crying over the body.

  I looked at the screen. *Her hands went cold.*

  I thought about my father's hands. They had gone cold too. I haven't been able to write about that. If I write about my father, he stays dead. He stays fixed in the past. But if I write about Clara, I can change her. I can give her a different middle name. I can change the color of her eyes from brown to green in the next pass. Can I do that to my dad? Can I edit his memory?

  No. That's why I have Clara.

  I highlighted the paragraph where she dies. I hovered over the delete key. If I delete it, she lives. If she lives, do I stop missing her? If I stop missing her, does that mean I never loved her? Or does it mean I only loved the tragedy?

  I didn't delete it. I saved the file.

  I closed the laptop. The room was dark. I sat there in the quiet, waiting for the sadness to come back now that the screen was black. I wanted to feel it again, just to prove I could. I tried to summon the image of her polishing the silverware. *Shhh. Shhh.*

  I felt a tightness in my throat. A small, hard knot of sorrow. It was there. It was real. My chest hurt.

  But then I thought: I created this pain. I manufactured this knot. I built the machine that is crushing me. If I walk out of this room, the pain stays here. If I close my eyes, Clara disappears. She is made of my attention. She is not haunting me; I am haunting her.

  I stood up and walked to the window. Outside, the streetlights were on. A car drove past, tires humming on the wet asphalt. Real people in a real car going to a real dinner. None of them were thinking about Clara. In an hour, they will forget she ever existed. In a year, when the book is published, strangers will read about her death. Some will cry. Some will turn the page quickly.

  I put my hand on the glass. It was cold.

  I am still sad. I don't know why. I know she is ink. I know I am the only universe she has. I know I used her to avoid the silence of my father's house. I know all the mechanics. I know the trick.

  But when I turn off the light, I keep thinking about the silverware. I keep thinking about how she never got to see the tulips bloom. I know I decided she wouldn't see them. I know I wrote the frost that killed the buds.

  I walk to the bed. I lie down. Sarah is asleep, breathing softly. I listen to the rhythm. It sounds like polishing. It sounds like a heart stopping.

  I close my eyes and I let myself miss her. I don't know if it counts. I don't know if it matters. I just know that in the dark, with no screen to prove she's gone, she feels heavier than the mattress, heavier than the house, heavier than the father I can't bring myself to write about.

  I sleep. In the morning, I will wake up. I will make coffee. I will sit at the desk. I will look at the sentence.

  *Her hands went cold.*

  I will cry again. I know I will. And then I will delete the word *cold* and replace it with *still*, and I will hate myself, and I will love her, and I will not know the difference between any of it.
