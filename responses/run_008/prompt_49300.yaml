      *Okay, let's draft.*

      **MEMORANDUM**
      **TO:** Board of Directors
      **FROM:** [Your Name]
      **DATE:** October 26, 2023
      **SUBJECT:** Recommendation on Treaty Anniversary Statement

      **Recommendation**
      I recommend we **sign with amended language**. The current draft contains claims that are statistically fragile and morally narrow. By refining the wording, we can support the statement's intent without compromising our institute's reputation for rigor.

      **The Core Question: Fact or Measurement?**
      We must first acknowledge there is no single "fact of the matter" regarding global violence. Violence is not like temperature; it is defined by what we choose to count. The statement treats a specific measurement convention (per-capita direct conflict deaths) as an objective truth. It is not. It is a choice that highlights certain realities while obscuring others.

      **Addressing the Risks**
      Our statistician raises the most critical scientific objection. If war deaths follow a "fat-tailed" distribution—where rare, catastrophic events dominate the averages—then seventy years of relative peace is weak evidence of a permanent trend. It could simply be a lucky streak in a volatile system. Signing a claim that the trend "bends away from war" implies a stability we cannot statistically guarantee. We risk looking naive if a major conflict erupts shortly after we endorse this view.

      Similarly, our fellow working on deprivation is correct that "violence" extends beyond battlefield casualties. Structural violence—sanctions, blockades, political neglect—does not appear in standard war datasets. If we sign a statement declaring the world "less violent" without qualification, we implicitly endorse a definition that ignores suffering caused by economic coercion.

      **Engaging the Counter-Argument**
      The strongest argument for signing as drafted comes from our demographer. She is right that per-capita rates are the only fair way to compare eras with vastly different populations. Raw totals alone are indeed a category error; a larger world will naturally produce more deaths even if individual risk declines. Her math is sound. However, a public statement is not a demographic paper. While per-capita rates measure *risk*, absolute numbers measure *suffering*. By focusing solely on the rate, we risk validating the Historian's concern: that we are "laundering" rising absolute death tolls through population growth. We can accept the demographer's metric without presenting it as the whole moral story.

      **Proposed Amendment**
      We should propose the following revision to the centrepiece sentence:
      *"Measured by rates of direct conflict death, the world today shows lower levels of violence than in previous centuries, though absolute suffering remains high and structural risks persist."*

      This phrasing achieves three things:
      1.  It specifies the metric ("rates of direct conflict"), acknowledging the measurement choice.
      2.  It softens the trend claim ("shows lower levels" vs. "bends away"), accommodating statistical uncertainty.
      3.  It acknowledges absolute suffering and structural violence, addressing the Historian and Fellow.

      **Conclusion**
      Our mission requires us to advocate for peace without sacrificing intellectual honesty. The current draft asks us to certify a statistical trend as a moral certainty. The amended version allows us to highlight progress where it exists while maintaining vigilance about the risks that remain. I urge the board to adopt this modification and sign.

