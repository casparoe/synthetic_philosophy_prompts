      *   This is the classic *Discursive Dilemma* (Pettit & List).
      *   **Premise-based Procedure (PBP):** Vote on conditions, derive conclusion. Result: Award.
      *   **Conclusion-based Procedure (CBP):** Vote on the award directly (or derive from individual holistic judgments). Result: No Award.
      *   **Key Tension:** Collective Rationality vs. Individual Responsibility/Democratic Integrity.
      *   **Collective Agent:** Does the committee have a "mind" distinct from the members? If yes, PBP makes sense. If no, CBP is more honest.
