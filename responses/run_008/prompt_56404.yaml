answer: |-
  ### Brainstorming the Fault Lines

  Before we construct the tree, we must identify where the real disagreements lie. When people argue about insect welfare, they often talk past one another because they are disagreeing on different levels of reasoning. There are three main fault lines you should watch for in your group.

  First, there is the **metaphysical question**: what *is* sentience? Is it like a light switch (either you feel pain or you don't), or is it like a dimmer switch (where an insect's pain might be 'fainter' or less significant than a mammal's)? This matters because if sentience is graded, we might care less about insects even if they are sentient.

  Second, there is the **epistemological question**: how much evidence do we need? Some students will say, "Unless we have proof of a cortex, we assume nothing." Others will say, "If it behaves like it's in pain, we must give it the benefit of the doubt." This determines the probability we assign to insect suffering.

  Third, and perhaps most crucially, there is the **decision-theoretic question**: how do we handle uncertainty? If there is only a 1% chance insects feel pain, but there are ten quintillion of them, does the huge number multiply the small probability to create a massive moral obligation? Or is there a threshold where the probability is too low to matter, regardless of the numbers? This is where the 'Expected Value' thinkers clash with the 'Rights' or 'Threshold' thinkers.

  The decision tree below is designed to bypass labels like 'utilitarian' or 'vegan' and sort your classmates by their actual intuitions on these concrete claims.

  ***

  ### The Insect Ethics Decision Tree

  **Instructions:** Start at **Node 1**. Answer the question honestly. Follow the arrow to the next Node or to a final Leaf position.

  **Node 1:** Is there any non-zero chance that insects feel pain or suffering?
  *   **No:** Go to **Leaf 1**.
  *   **Yes:** Go to **Node 2**.

  **Node 2:** Is a bee's pain either fully real or non-existent, or can it be 'fainter' than a human's?
  *   **All-or-nothing (Binary):** Go to **Node 3**.
  *   **Fainter/Graded:** Go to **Node 4**.

  **Node 3:** If a bug pulls its leg away from heat, is that enough reason to act as if it feels pain?
  *   **No (Need more proof):** Go to **Leaf 2**.
  *   **Yes (Behaviour is enough):** Go to **Node 5**.

  **Node 4:** Does a 'faint' or graded pain still count morally, even if it is less than a human's?
  *   **No (Too faint to matter):** Go to **Leaf 3**.
  *   **Yes (Still counts):** Go to **Node 5**.

  **Node 5:** If a human and an insect feel the same intensity of pain, do their interests count equally?
  *   **No (Humans count more):** Go to **Node 6**.
  *   **Yes (Equal consideration):** Go to **Node 7**.

  **Node 6:** Is there a threshold where the sheer number of insects overrides human priority?
  *   **No (Humans always priority):** Go to **Leaf 4**.
  *   **Yes (Numbers can override):** Go to **Node 8**.

  **Node 7:** Should we calculate moral choices by multiplying probability by number (Expected Value)?
  *   **No (Use thresholds/rights):** Go to **Node 9**.
  *   **Yes (Multiply everything):** Go to **Node 10**.

  **Node 8:** Should the school ban pesticides even if it ruins the biology department's prize plants?
  *   **No (Plants/Students first):** Go to **Leaf 5**.
  *   **Yes (Ban pesticides):** Go to **Leaf 6**.

  **Node 9:** Is it permissible to swat a mosquito biting you, even if it might feel pain?
  *   **Yes (Self-defence allowed):** Go to **Leaf 7**.
  *   **No (Rights block swatting):** Go to **Leaf 8**.

  **Node 10:** Should £1,000 go to cure human blindness or reduce insect suffering in farms?
  *   **Human Blindness:** Go to **Leaf 5**.
  *   **Insect Suffering:** Go to **Leaf 9**.

  ***

  ### The Positions (Leaves)

  **Leaf 1: The Hard Skeptic**
  *   **Awkward Commitment:** You must accept that you might be ignoring massive amounts of suffering simply because you demand impossible levels of biological proof.

  **Leaf 2: The Epistemic Skeptic**
  *   **Awkward Commitment:** You admit insects might feel pain but refuse to change your behaviour unless certainty is reached, potentially allowing preventable suffering to continue.

  **Leaf 3: The Diminisher**
  *   **Awkward Commitment:** You believe pain comes in degrees, but you must define exactly how 'faint' pain becomes morally irrelevant without being arbitrary.

  **Leaf 4: The Speciesist Humanist**
  *   **Awkward Commitment:** You hold that human interests always trump insect interests, even if trillions of insects suffer to save one human from a minor inconvenience.

  **Leaf 5: The Cautious Humanist**
  *   **Awkward Commitment:** You accept insects matter and numbers can override species, but in practice, you still prioritise humans in charity and school policy.

  **Leaf 6: The Policy Interventionist**
  *   **Awkward Commitment:** You are willing to sacrifice educational resources (the plants) to protect insects, which may confuse students who see the plants as learning tools.

  **Leaf 7: The Threshold Deontologist**
  *   **Awkward Commitment:** You believe insects have rights, but you allow them to be killed for trivial human reasons (like an itchy bite) based on a threshold of necessity.

  **Leaf 8: The Rights Absolutist**
  *   **Awkward Commitment:** You must refrain from swatting mosquitoes even when they are feeding on your blood, potentially risking disease or significant discomfort.

  **Leaf 9: The Insect Prioritiser**
  *   **Awkward Commitment:** You must donate money to help insects rather than blind humans, because the sheer number of insects outweighs the intensity of human suffering.

  ***

  ### Notes for the Discussion Leader

  **1. Indistinguishable Leaves**
  You may find it hard to separate **Leaf 1 (The Hard Skeptic)** from **Leaf 4 (The Speciesist Humanist)** in practice. Both groups will vote against banning pesticides and against donating to insect charities. The difference is theoretical: the Skeptic says insects *don't* count, while the Humanist says they count but *lose* to humans. In a real-world vote, their actions look identical, which can frustrate attempts to debate the underlying reasons.

  **2. Unoccupied Positions**
  A combination like **Graded Sentience (Node 2) + Rights Absolutism (Node 9)** is rarely occupied. Rights are usually thought of as binary (you have them or you don't), whereas graded sentience suggests a sliding scale of moral weight. It is likely unoccupied because it is conceptually difficult to have a 'partial right' not to be swatted. It is not necessarily incoherent, but it is unattractive because it complicates decision-making without offering clear guidance.

  **3. The Most Loaded Node**
  **Node 7 (Expected Value vs. Thresholds)** does the most work. Students often think they are answering a question about maths, but they are actually smuggling in their moral conclusion. If a student already believes we should prioritise humans, they will reject Expected Value calculations because they know the maths leads to insect prioritisation. Conversely, if they want to help insects, they will embrace the maths. It is the hardest node to answer neutrally because the calculation dictates the outcome.
