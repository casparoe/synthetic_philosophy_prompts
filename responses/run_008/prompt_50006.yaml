  10. **Final Review of the "Insulation" point:** If the claim is "structural feature," it's more like a philosophical stance than a scientific hypothesis. To falsify it, you need to show the structure *isn't there*. How? By showing a psychiatric kind behaving exactly like an indifferent kind.

