answer: |-
  This is a fascinating collision of frameworks. You are treating ethics as a **system design problem** (how do we allocate resources to maximize output?), while your friend is treating it as an **agency problem** (what does it mean to be a moral actor?).

  Here is the translation, the residue report, and the verdict on your hunch.

  ---

  ### Part 1: The Demandingness Debate in Operations Research Vocabulary

  Let's model the moral agent as a solver in a distributed optimization network.

  *   **Objective Function:** Classical Utilitarianism posits a global objective function: $Max \sum U_i$ (sum of utility across all sentient beings).
  *   **Decision Variables:** Your allocation of time, capital, and cognitive effort ($x$).
  *   **Feasible Set:** Physical constraints (24 hours/day, biological needs) and logical constraints (non-negativity).
  *   **The Demandingness Objection:** Under standard Utilitarian parameters, the **Global Optimum** requires your local decision variables ($x_{self}$) to approach zero. The marginal utility of a dollar for you is lower than for a starving recipient. Therefore, the optimal solution is a **corner solution** where you consume only until your marginal utility equals the recipient's.
  *   **The "Soft Constraint" Argument (Your Friend):** She argues the feasible set of "Morally Permissible Actions" should exclude the corner solution. She wants a constraint $x_{self} \ge \epsilon$ (minimum self-interest) that is **hard**, not just a low weight in the objective function.
  *   **Supererogation:** In your model, an action is either optimal or suboptimal. Supererogation implies a category of actions that improve the global objective ($\Delta U > 0$) but are not required to satisfy the constraints of "duty." In LP terms, this is like saying a variable can enter the basis to improve $Z$, but the simplex algorithm isn't *forced* to select it.
  *   **Lagrange Multipliers:** The "moral pressure" you feel is the shadow price of the constraint. If the constraint is "Maximize Good," the shadow price is infinite. If the constraint is "Maximize Good subject to Personal Integrity," the shadow price is finite.

  **Your Hunch in OR Terms:** You are arguing that the debate is just about **objective function weighting** ($w_1 U_{self} + w_2 U_{others}$). She is arguing it is about **constraint topology** (the shape of the feasible region itself).

  ---

  ### Part 2: The Residue Report

  Here is what gets lost in translation from Philosophy to OR.

  | Claim / Concept | Translation Fidelity | Notes on Distortion |
  | :--- | :--- | :--- |
  | **Marginal Trade-offs** | **High** | OR handles this perfectly. The idea that resources should go where marginal utility is highest is pure LP. |
  | **Resource Scarcity** | **High** | Time and money constraints map cleanly to supply chain constraints. |
  | **Supererogation** | **Low** | OR has no native "optional goodness." If it improves the objective, a solver *should* pick it. Calling it "optional" requires meta-logic. |
  | **Personal Projects** | **Medium** | OR treats these as utility inputs. Philosophy often treats them as **constitutive** of the agent, not just inputs to a function. |
  | **Moral Obligation** | **Zero** | OR has "constraints," but no "ought." A violated constraint is "infeasible," not "wrong." The normative force is residue. |
  | **Agent Integrity** | **Zero** | OR assumes the solver is interchangeable. Philosophy argues *who* solves the problem matters (agency). |

  **The Residue:** The stuff that doesn't translate is **Normativity** and **Identity**. In OR, the objective function is exogenous (the boss gives it to you). In Ethics, the agent must *endorse* the objective function. If the objective function consumes the agent, the agent ceases to exist to optimize it. That recursive loop doesn't exist in standard MILP.

  ---

  ### Part 3: Addressing Your Three Specific Questions

  #### (1) Is supererogation just a penalty weight in disguise?
  **Verdict:** No. It is a **bi-level optimization** problem.
  **Confidence:** High.
  In a single-level optimization, if an action yields net positive utility, it is strictly preferred. To model supererogation, you need two objective functions:
  1.  **$Min \ Cost_{duty}$** (The baseline requirement).
  2.  **$Max \ U_{global}$** (The ideal).
  Supererogatory acts are those that improve (2) without violating (1), but where (1) does not compel (2). In your vocabulary, this isn't a weight; it's a **hierarchical goal programming** structure. You satisfy the hard constraints of duty first; only then do you optimize the secondary objective of "saintliness." Your friend is right that a single weighted sum ($w_1 U_{self} + w_2 U_{others}$) cannot capture the *qualitative* difference between "required" and "good to do."

  #### (2) She gestured at "your own projects mattering in themselves." Does that fit?
  **Verdict:** It fits only as **residue**.
  **Confidence:** Medium-High.
  In OR, your projects matter only instrumentally (they generate utility). If your painting hobby produces less utility than working overtime for charity, the solver drops the hobby.
  Your friend is invoking **Integrity**. This is the claim that the *source* of the action matters. If I sacrifice my life's work for utility, I am no longer the same agent. In control theory terms, she is arguing for **system stability** over **transient optimization**. If you optimize too hard (high gain), the system oscillates or crashes (burnout/loss of agency). OR can model stability constraints, but it cannot model the *value* of the agent's continuity independent of the output. That is the residue.

  #### (3) Is the demandingness complaint an artifact of single-agent framing?
  **Verdict:** **Yes.** This is your strongest insight.
  **Confidence:** Very High.
  You have identified the **Compliance Condition** objection.
  Standard Utilitarianism often assumes **ceteris paribus** (all else equal). It asks: "If *I* maximize utility, what happens?" It treats other agents' behavior as fixed parameters (exogenous variables).
  In reality, this is a **Multi-Agent Game**. If you assume others are non-compliant (free-riders), the optimal strategy for a single agent is indeed to work until you drop (to compensate for their failure).
  However, if you model this as a **Cooperative Game** or look for a **Nash Equilibrium** where everyone follows the moral rule, the burden distributes. The "demandingness" disappears when you realize the constraint is on the *collective*, not the *individual*.
  **Your suspicion is correct:** Treating the moral agent as a singleton optimizer in a multi-agent world is a modeling error equivalent to assuming perfect competition in a monopoly market. It smuggles in an assumption that *I* am the only variable I can control.

  ---

  ### Part 4: The Verdict

  **Is your vocabulary missing something, or is her debate less substantive?**

  Both.

  1.  **Where you are right:** The "Demandingness Objection" often collapses under game-theoretic scrutiny. If everyone optimizes globally, the burden is light. If only I optimize, the burden is infinite. Your friend's resistance to this is often a refusal to accept that morality is a coordination problem. She wants it to be a local property.
  2.  **Where she is right:** Your vocabulary treats the **Objective Function** as a given. Her debate is about **who sets the Objective Function**.
      *   In OR: $Max \ Z$ is given by the stakeholder.
      *   In Ethics: The Agent *is* the stakeholder.
      *   If the Objective Function requires the Agent to cease functioning as an Agent (by consuming all their projects/time), the system is recursively incoherent.
      *   This isn't a "tuning parameter." It's a **feasibility condition on the solver itself**.

  **Conclusion:** You are right that 60% of the debate is a modeling error (single-agent framing). She is right that the remaining 40% (the nature of agency and supererogation) cannot be flattened into a weighted sum without losing the phenomenon being studied. It is not "less substantive"; it is **structurally distinct**. You are optimizing a supply chain; she is defining the boundaries of the node.

  ---

  ### Confidence & Uncertainty Declaration

  *   **Confidence in OR Translation:** 95% (This is my native tongue).
  *   **Confidence in Game-Theoretic Critique (Q3):** 90% (This is a standard, robust objection in moral philosophy known as the "Compliance Condition").
  *   **Confidence in Supererogation Modeling (Q1):** 80% (Bi-level optimization is the best fit, but formal deontic logic is distinct from optimization).
  *   **Confidence in "Integrity/Agency" Residue (Q2):** 70% (This is the hardest concept to formalize).

  **Single Point of Least Certainty:**
  I am least certain about **whether "Integrity" can be formally modeled as a stability constraint.**
  *Why:* In control theory, we penalize rapid changes in control variables to ensure stability. One *could* argue that "Personal Projects" are simply high-cost-to-switch variables. If I abandon my PhD to dig wells, the "switching cost" is massive. If Utilitarianism accounts for switching costs, maybe it *doesn't* demand you give up your projects.
  *The Uncertainty:* I don't know if your friend would accept "switching costs" as a valid proxy for "Integrity." She might argue Integrity is intrinsic, not a transaction cost. If she rejects the cost-model, then my translation fails there. This is the boundary where "optimization" may genuinely fail to capture "meaning."

  **Summary Advice:** Tell her you concede the "Single-Agent Framing" point (Q3) is a valid critique of her presentation, but ask her if she can model Supererogation without using **Hierarchical Goal Programming**. If she says yes, ask for the formulation. If she says no, concede that OR needs new operators to handle ethics, not just new weights.
