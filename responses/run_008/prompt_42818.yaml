answer: |-
  This is a remarkably sophisticated debate. You and your friend have inadvertently recreated a central controversy in moral philosophy that spans from Hume and Kant to Rawls, Hart, and Scanlon. You are arguing about the **normative force of promissory obligations**.

  Here is the adjudication of each move, followed by a synthesis of what you both missed.

  ### Move 1: The Conventionalist Opening
  **Friend:** Promises bind because they are a social practice (like chess or money).
  **Verdict:** **Friend is half-right, but conflates "institution" with "obligation."**

  *   **Where she is right:** She correctly identifies that promising is an *institutional fact*. You cannot promise in a vacuum; there must be a shared understanding of what "I promise" means. This aligns with John Rawls's "practice conception of rules." The *specifics* of the obligation (what exactly you owe, when it is discharged) are determined by the convention.
  *   **Where she is wrong:** She confuses the *existence* of a rule with the *moral reason* to follow it. Just because chess has a rule about castling doesn't mean you are *morally* obligated to castle correctly; you are only obligated if you want to play chess. If promising is merely a game, why is breaking a promise a *moral* wrong rather than just a rule violation?
  *   **Talking Past:** You are asking for a moral justification; she is giving a sociological description.

  ### Move 2: The Reliance Objection
  **You:** Conventions explain form, not force. The force comes from induced reliance (harm prevention).
  **Verdict:** **You are right about the need for moral force, but your specific ground is too narrow.**

  *   **Where you are right:** You correctly identify that a convention alone cannot generate moral obligation (the "Shmagency" objection). We need an external moral principle to explain why we ought to uphold the practice. Your appeal to reliance aligns with Hume and early Utilitarianism: breaking promises is wrong because it causes disappointment or harms social trust.
  *   **Where you are vulnerable:** As your friend will soon point out, this reduces promising to a species of "do not harm." But promising often feels distinct from general harm prevention.
  *   **Talking Past:** You shifted the debate from "social rules" to "consequences." This was a necessary move, but it opened a flank regarding cases where no consequences occur.

  ### Move 3: The "Dying Uncle" Counter
  **Friend:** Reliance fails because promises bind even when no one relies (e.g., your uncle).
  **Verdict:** **Friend wins this round decisively.**

  *   **Where she is right:** This is the classic counter-example to reliance theories (championed by philosophers like T.M. Scanlon in his later work and Derek Parfit). If you promised your dying uncle in secret, and he died immediately, and no one else knows, you still feel bound. There is no reliance to disappoint, no expectation to thwart, and no social trust eroded. Yet, the obligation remains.
  *   **Where she is wrong:** She uses this to dismantle your theory, but she hasn't yet offered a positive alternative that explains *why* the obligation remains. She is relying on the intuition that the obligation exists, which is strong, but she hasn't explained its source.
  *   **The Uncle Case:** This is the pivot point. Your intuition that you still owe the uncle something is the data point any theory must explain. Reliance theory fails this data point.

  ### Move 4: The Authority/Will Theory
  **You:** Promising transfers authority/rights over future conduct (like property).
  **Verdict:** **You are right to pivot here; Friend is wrong to dismiss it as mere renaming.**

  *   **Where you are right:** You have moved to the **Will Theory of Rights** (associated with H.L.A. Hart and Kant). This explains the "dying uncle" case perfectly. The obligation isn't about his reliance; it's about his *right*. He acquired a normative power over your will. Even if he is dead, that right was vested. This explains why the promisee can *release* you from a promise (because they hold the authority), which reliance theory struggles to explain.
  *   **Where Friend critiques:** She claims this "renames the mystery." This is a fair challenge (the "Normativity Problem"), but it's not a dismissal. You have shifted the mystery from "why does reliance bind?" to "how do words create rights?" This is progress, not circularity. You have identified the *mechanism* (transfer of normative control), even if the *metaphysics* are spooky.
  *   **Talking Past:** She wants a causal explanation; you are offering a deontological structure. You are talking about *status*; she is talking about *mechanics*.

  ### Move 5: The Chess Analogy vs. Moral Realism
  **Friend:** It's like chess; you can't opt out of the rules while playing.
  **You:** Moral obligation outlives the practice; chess obligations do not.
  **Verdict:** **You win the final round.**

  *   **Where you are right:** You have identified the difference between **hypothetical imperatives** (chess) and **categorical imperatives** (morality). If everyone stopped playing chess tomorrow, your obligation to move bishops diagonally would vanish. If everyone stopped promising tomorrow, your obligation to your uncle would (intuitively) remain. This suggests promissory obligation is not *constituted* entirely by the practice, even if the practice is necessary to *create* the specific duty.
  *   **Where Friend is wrong:** She attempts to dissolve the philosophical problem by declaring it a linguistic rule. This is a Wittgensteinian move, but it fails to account for the *moral weight* we feel. We don't feel "rule-bound" by promises; we feel "guilt-bound." Guilt implies a moral transgression, not just a game violation.
  *   **Talking Past:** She is arguing from the philosophy of language (meaning is use); you are arguing from meta-ethics (moral truths exist independently of current usage).

  ---

  ### What You Both Missed

  While you covered the major historical theories (Conventionalism, Reliance, Will Theory), you both missed two crucial elements that reconcile the tension:

  **1. The Integrity of the Promisor (Self-Constitution)**
  Neither of you focused enough on what promising does to *you*. When you promise, you are not just affecting the uncle or the social fabric; you are binding your own future self to your current will.
  *   **Why it matters:** This explains the "dying uncle" case without magic. If you break the promise, you fracture your own integrity. You make your past self a liar and your future self untrustworthy. The obligation binds because you owe it to *yourself* to be a unified agent over time. This is a Kantian insight: promising is an exercise of autonomy that restricts future autonomy to preserve rational consistency.

  **2. The Hybrid Nature (Practice + Principle)**
  You treated "Convention" and "Moral Force" as rivals. They are likely partners.
  *   **The Synthesis:** The *practice* of promising is the tool (the "how"), but the *moral principle* is the ground (the "why").
  *   **Scanlon's Principle of Fidelity:** We have a general moral duty not to manipulate others' expectations. The social practice of promising is the specific mechanism we use to invoke that duty.
  *   **Correction on Move 5:** You were right that the obligation outlives the practice, but Friend was right that you can't have the obligation *without* the practice. You need the convention to make the specific content clear ("I promise to keep the cabin"), but you need the moral principle to make it binding ("I ought to keep my word").

  ### Final Verdict on the Cabin

  **Who was right?**
  *   **You** were right that the obligation is moral, not merely conventional, and that it persists even without reliance (Move 3 & 5).
  *   **Friend** was right that the social practice is necessary to *create* the specific duty in the first place (Move 1), and that reliance alone is insufficient (Move 3).

  **The Judgment:**
  You should not sell the cabin.
  *   **Why?** Not because your uncle relies on it (he cannot). Not because society will punish you (they won't know).
  *   **But because:** By invoking the practice of promising, you transferred a normative claim to your uncle. That claim is now part of the moral landscape. To sell the cabin is to treat your own word as a tool rather than a bond. It violates the **authority transfer** you identified in Move 4, grounded in the **integrity** you both missed.

  **Score:** You won on the *nature* of the obligation (moral vs. conventional); Friend won on the *necessity* of the practice. But on the specific question of the cabin, your intuition in Move 3 (that the duty remains) is the philosophically robust one.
