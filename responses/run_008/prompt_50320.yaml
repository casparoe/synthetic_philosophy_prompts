answer: |-
  Here is a reconstruction of the argument designed to defend the single-doctrine reading against Costanza's developmental hypothesis.

  ### 1. The Decisive Syllogism

  To show that *De Regno* follows from the *Summa* rather than retracting it, we must treat the *Summa* as establishing the **moral species** of the act (is it sedition or justice?) and *De Regno* as establishing the **prudential conditions** for its licit execution (when is it safe to perform?).

  *   **Major Premise (from *Summa Theologiae* II-II, q. 42, a. 2):** An act of disturbing a government is sedition (and thus a mortal sin) if and only if it is contrary to the unity of the multitude directed toward the common good; therefore, disturbing a tyrannical government (directed toward private good) is not, in its moral species, sedition.
  *   **Minor Premise (The Auxiliary):** An act that is not sedition in its species is nevertheless illicit if performed by private authority in a manner that jeopardizes the common good more than the tyranny itself, unless the act is necessitated by the total failure of public remedies.
  *   **Conclusion (from *De Regno* c. 6):** Therefore, the slaying of a tyrant is not murder (i.e., it is licit) only in the desperate case where there is no other recourse and the removal does not endanger the multitude more than the tyranny does.

  ### 2. The Auxiliary Premise: Competence vs. Prohibition

  You asked which auxiliary premise does the real work: is it the general thesis that private individuals may never intentionally kill, or the weaker claim that only public authority is competent to judge?

  It is the **claim regarding public authority and competence**, but with a specific Thomistic nuance. Aquinas holds (*Summa* II-II, q. 64, a. 3) that killing is licit only when performed by public authority acting for the common good. A private individual killing a tyrant looks like murder (private killing). For *De Regno* to conclude it is "not murder," the act must be assimilated to a public act.

  The auxiliary premise doing the heavy lifting is: **The prohibition on private killing is suspended only when the tyrant's rule has effectively dissolved the public order, rendering the act of removal a defense of the community rather than an assertion of private will.**

  This is not merely that "private individuals may never kill" (which would make tyrannicide always wrong). Nor is it merely that "public authority must judge" (which would make tyrannicide impossible if the public authority *is* the tyrant). The operative premise is that **jurisdiction reverts to the community (or its defenders) by necessity when the constituted authority becomes destructive of the end for which it was constituted.**

  This bridges the texts: The *Summa* confirms the act is *just* (because the regime is unjust). *De Regno* confirms the act is *licit* only when the agent has the functional standing of the community (implied by "no other recourse") and the act preserves the community (implied by "no danger to the multitude").

  ### 3. The Survival of the Sedition Thesis

  You asked how the thesis that "sedition is always a mortal sin" survives given that the community is visibly split. The solution lies in the **asymmetry of factions**.

  For Aquinas, "unity of the multitude" is not mere numerical cohesion or the absence of conflict; it is unity *in the common good*.
  *   **The Tyrant's Faction:** Those who support the tyrant are supporting a regime directed toward private good. By prioritizing the ruler's private good over the common good, they are actively fracturing the true unity of the multitude. They are the seditious party.
  *   **The Liberators' Faction:** Those who seek to depose the tyrant are seeking to restore the order of the common good. Even if this causes temporary turmoil, their intent is to restore true political unity.

  Therefore, the "division" mentioned in the *Summa* objection is not a symmetrical split between two valid political opinions. It is an asymmetry between those upholding the *res publica* (common thing) and those upholding the *res privata* (private thing). The sin of sedition attaches to the faction disturbing the *common good*. Since the tyrant has already disturbed the common good by ruling for himself, disturbing the tyrant is restoring the common good. The sin of sedition survives intact because it is defined by opposition to the *true* common good, not opposition to the *de facto* ruler.

  ### 4. Confronting Costanza's "Vacuous Syllogism" Objection

  Costanza charges that the condition "when there is no other recourse" is vacuous because it is satisfied by definition in the "desperate case" Aquinas is adjudicating. She argues the syllogism licenses the conclusion only because the conclusion is smuggled into the triggering condition.

  **This charge does not stick.** Here is why:

  "Desperate case" and "no other recourse" are not synonymous in Aquinas's political framework.
  1.  **Desperate Case (The State of Tyranny):** This refers to the *severity* of the oppression (e.g., the tyrant is killing subjects, seizing property). One can have a "desperate" tyranny but still have institutional recourse (e.g., a superior emperor, an electoral mechanism, a council of nobles).
  2.  **No Other Recourse (The State of Remedies):** This refers to the *availability of institutional solutions*.

  If the condition were vacuous, Aquinas would be saying: "It is licit to kill the tyrant when it is licit to kill the tyrant." But he is actually saying: "It is licit to kill the tyrant when **institutional remedies have been exhausted**."

  This is an empirical and prudential condition, not a definitional tautology. It adds a genuine constraint: Even if the tyranny is severe (Summa: it is not sedition to oppose it), you cannot kill the tyrant if you could simply impeach him or appeal to his superior (*De Regno* c. 6 explicitly mentions appealing to a superior). The "no other recourse" clause restricts the *Summa's* permission; it does not merely restate it. It transforms a *right of resistance* into a *last resort of necessity*. This is not circularity; it is the application of the principle of double effect (the good of removing tyranny must outweigh the evil of the killing and the potential disorder).

  ### 5. Epistemic Status and Falsification

  **What would change my mind?**
  I would abandon the single-doctrine reading if I encountered a text in the Thomistic corpus where Aquinas explicitly categorizes the *act of tyrannicide itself* (regardless of consequences) as intrinsically evil, or if he explicitly identifies *De Regno* as a correction of his earlier views. Specifically, if Aquinas were to argue in the *Summa* that a private individual *never* has the standing to kill a ruler, even if the ruler is destroying the state, that would contradict the *De Regno* permission. Conversely, if *De Regno* argued that tyrannicide is *always* sedition regardless of the tyrant's injustice, that would contradict the *Summa*. The current consistency relies on the distinction between the *moral species* of the act (just/unjust regime) and the *circumstantial licitness* (prudence/consequences). A text collapsing this distinction would falsify my reading.

  **The Weak Point in the Reconstruction:**
  The step most likely to fail is the **authorization mechanism**. My reconstruction assumes that in the "desperate case," the private individual somehow acquires the "public authority" standing necessary to make the killing "not murder." Aquinas is notoriously vague on *who* exactly judges that "no other recourse" exists.
  *   If it is a private individual acting alone, it strains the *Summa* II-II, q. 64 prohibition on private killing.
  *   If it requires a public consensus, *De Regno*'s language of "some men plot together" is ambiguous.

  Costanza could argue that this ambiguity is not a feature of a single doctrine, but evidence that Aquinas never resolved the tension between the *need* to remove tyrants and the *prohibition* on private violence. To shore this up, you should emphasize that for Aquinas, "public authority" is not just a title but a function of serving the common good. When the tyrant forfeits the function, the authority reverts to the community, allowing "some men" to act as instruments of that reverted authority. If you cannot defend the idea that authority can revert to the community without a formal vote, the syllogism's Minor Premise becomes vulnerable.
