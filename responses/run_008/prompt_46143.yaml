  So my sister and I have been having this running argument for like two months now and I want a second opinion with actual numbers attached. It's about Mary, the color scientist who's raised in a black and white room and learns every physical fact there is about color vision -- all the neuroscience, all the physics of light, everything you could read in a textbook -- and then one day she steps outside and sees a red tomato for the first time. The question we keep circling: does she learn anything new in that moment? I keep flip-flopping, honestly. Right now I'd say there's maybe a 70% chance she does learn something genuinely new, my sister says it's more like 20% and that the whole setup kind of cheats, but neither of us can really articulate *why* we landed on those numbers, which is what bugs me.

