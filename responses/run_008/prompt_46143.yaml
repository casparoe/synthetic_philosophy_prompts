  So give me a rough probability for each piece with a sentence or two of why, then show how you put them together into an overall number, and then tell me which single piece the final answer is most sensitive to. And here's the part I actually care about most: given your decomposition, is my 0.7 vs my sister's 0.2 disagreement more likely a disagreement about physicalism itself, or more likely a disagreement about whether the "she just gains an ability, not a fact" move actually works? Because if it's the second one, we could probably settle this over dinner, and if it's the first one we're probably doomed lol. Also if you think the whole question is confused in some way I haven't listed, say so, but you still have to give me a number at the end -- no ducking it.
