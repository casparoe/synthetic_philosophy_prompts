answer: |-
  # Quiz: What Do You Actually Think About Moral Responsibility?

  **Instructions:** Read each short scenario carefully. Imagine you are the person in the story. At the end of each case, choose the option that best matches your gut judgment about whether the protagonist deserves blame or praise for what they did. There are no right or wrong answers—this is about mapping your intuitions.

  ---

  ### 1. The Vote
  You are standing in the voting booth. You deeply care about the election and have thought about your choice for weeks. Unbeknownst to you, a neuroscientist is monitoring your brain. She has a device that *could* force you to vote for Candidate A if she detects you hesitating. However, you don't hesitate. You freely and confidently vote for Candidate A on your own. The scientist never touches the device.
  **How responsible are you for your vote?**
  A) Fully responsible. It was your choice.
  B) Not responsible. You couldn't have done otherwise.
  C) Unsure / Partially responsible.

  ### 2. The Signal
  You are about to make a difficult confession. A neuroscientist is monitoring you again. This time, her device is triggered by a specific hormone spike in your brain that happens *before* you make any conscious decision. You cannot control this hormone spike; it happens automatically. If the spike occurs, the device ensures you confess. The spike occurs. You then confess, feeling it was your own idea.
  **How responsible are you for the confession?**
  A) Fully responsible. You still wanted to do it.
  B) Not responsible. The trigger was out of your hands.
  C) Unsure / Partially responsible.

  ### 3. The Garden
  You grew up in a secluded community. As a child, caregivers used subtle psychological conditioning to implant specific values and desires in you. Now an adult, you act on those desires happily. You have no internal conflict; you feel free. However, if you had not been conditioned, you would not have these desires. You recently helped a stranger, driven entirely by these implanted values.
  **How responsible are you for your help?**
  A) Fully responsible. You acted on your own desires.
  B) Not responsible. Your values were planted by others.
  C) Unsure / Partially responsible.

  ### 4. The Open Gate
  You were supposed to lock the barn door tonight. You forgot. It was a careless mistake, nothing more. By pure bad luck, a thief happened to pass by and stole the equipment. If no thief had passed by (good luck), nothing would have been lost, and your forgetfulness would have gone unnoticed.
  **How responsible are you for the loss?**
  A) Fully responsible. You were negligent.
  B) Not responsible. The theft was bad luck.
  C) Unsure / Partially responsible.

  ### 5. The Chain
  Imagine the universe is like a row of dominoes. Every event is caused by the one before it, stretching back to the beginning of time. Your thoughts and actions are part of this chain. Given the past and the laws of nature, exactly one future was possible. You helped a friend, but you could not have done otherwise given the history of the universe.
  **How responsible are you for helping?**
  A) Fully responsible. You still did it.
  B) Not responsible. It was all determined.
  C) Unsure / Partially responsible.

  ### 6. The Gun
  A robber points a gun at your head and says, "Hand over your wallet or I shoot." You hand over the wallet. You want to keep your wallet, but you want to live more.
  **How responsible are you for handing over the wallet?**
  A) Fully responsible. You made the choice.
  B) Not responsible. You were coerced.
  C) Unsure / Partially responsible.

  ### 7. The Craving
  You are trying to quit a harmful substance. You know it's bad for you and you genuinely want to stop. However, when the craving hits, your body and mind feel compelled to use it. You feel like a passenger in your own body as you act.
  **How responsible are you for using the substance?**
  A) Fully responsible. You still chose it.
  B) Not responsible. You lacked control.
  C) Unsure / Partially responsible.

  ### 8. The Mistake
  You are cooking for a friend. You reach for the sugar bowl, but the label was wrong. You pour arsenic into their tea, thinking it is sugar. They get sick. You had no way of knowing the label was wrong.
  **How responsible are you for their sickness?**
  A) Fully responsible. You poured the poison.
  B) Not responsible. You were ignorant of the facts.
  C) Unsure / Partially responsible.

  ### 9. The Cold Heart
  You hurt someone to get what you wanted. You feel no guilt, no empathy, and you cannot understand why others think hurting people is wrong. You aren't forced; you just don't care about moral reasons.
  **How responsible are you for the harm?**
  A) Fully responsible. You did the deed.
  B) Not responsible. You can't grasp right from wrong.
  C) Unsure / Partially responsible.

  ### 10. The Dice
  You are reaching for a cup. Suddenly, a random quantum event in your nervous system causes your arm to jerk, knocking the cup over. It was not caused by your desires, beliefs, or character. It was pure chance.
  **How responsible are you for the breakage?**
  A) Fully responsible. It was your arm.
  B) Not responsible. It was a random accident.
  C) Unsure / Partially responsible.

  ---

  ## Scoring Key

  To find your philosophical profile, look at your answers to the **Pivotal Questions** below. Your pattern reveals which "leaf" of the responsibility tree you inhabit.

  ### Step 1: The Determinism Check (Question 5)
  *   **If you answered B (Not Responsible):** You lean toward **Incompatibilism**. You believe responsibility requires the ability to break the causal chain. Proceed to Step 2.
  *   **If you answered A (Fully Responsible):** You lean toward **Compatibilism**. You believe responsibility is compatible with a determined universe. Proceed to Step 3.

  ### Step 2: For the Incompatibilists (Q5 = B)
  Look at your answer to **Question 1 (The Vote)**.
  *   **If Q1 = B:** You are a **Strict PAP Theorist** (Principle of Alternative Possibilities). You believe that if you couldn't have done otherwise (even due to a backup plan), you aren't responsible.
  *   **If Q1 = A:** You are likely a **Libertarian Sourcehood Theorist**. You reject determinism, but you think the "backup plan" in Q1 doesn't matter because the actual cause was you.
  *   **Check Question 10 (The Dice):** If you answered B here as well, you are a **Hard Incompatibilist**. You believe neither determinism *nor* randomness grants responsibility. We are never truly responsible.

  ### Step 3: For the Compatibilists (Q5 = A)
  Look at your answer to **Question 3 (The Garden)**.
  *   **If Q3 = A:** You are a **Structural Compatibilist**. You care about how your mind works *now* (do you have conflicts? do you want what you do?), not where your desires came from.
  *   **If Q3 = B:** You are a **Historical Sourcehood Theorist**. You believe responsibility requires that you are the *ultimate origin* of your values, not just the current actor.
  *   **Check Question 2 (The Signal):** If you answered B here but A on Question 1, you hold a **Frankfurt-Style View**. You think backup plans (Q1) don't remove responsibility, but unavoidable biological triggers (Q2) might.

  ### Step 4: The Tracing Check (Question 4)
  *   **If you answered A (Fully Responsible):** You accept **Responsibility-by-Tracing**. You believe you are responsible for outcomes caused by your past negligence, even if luck played a role in the outcome.
  *   **If you answered B (Not Responsible):** You reject Moral Luck. You believe responsibility is limited to what you directly controlled at the moment.

  ---

  ## Instrument Analysis & Limitations

  ### Leaves That Cannot Be Separated
  This instrument cannot genuinely separate **Frankfurt-Style Compatibilism** from **Reasons-Responsive Compatibilism**.
  *   **Diagnosis:** Both views typically yield "Responsible" (A) on the Frankfurt cases (Questions 1 & 2) and "Responsible" (A) on the Determinism case (Question 5). The difference between them is theoretical: Frankfurtians focus on the *absence of intervention*, while Reasons-Responsive theorists focus on the agent's *ability to recognize reasons*. Since this quiz asks for judgments on cases rather than justifications for those judgments, these two distinct philosophical "leaves" will appear identical in the scoring key.

  ### The "Empty" Combination
  The scoring key treats the following combination as **empty/incoherent**:
  *   **Answer A (Responsible) on Question 3 (The Garden/Manipulation)** AND **Answer B (Not Responsible) on Question 5 (The Chain/Determinism).**
  *   **Diagnosis:** This combination implies that being manipulated by scientists (where your values are implanted) is *better* for responsibility than being determined by the laws of physics. Philosophically, this is unattractive and rarely defended. Manipulation cases are typically designed to be *worse* for responsibility than plain determinism because they introduce an external controller. If plain determinism excuses you (Q5=B), then manipulation, which includes determinism plus an external manipulator, should certainly excuse you (Q3=B). Affirming responsibility in the manipulation case while denying it in the determinism case suggests a bias against physics but a trust in neuroscientists, a position with no established philosophical defense.
