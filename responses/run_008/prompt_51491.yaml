      *   *Distorted:* Philosophers treat dispositions as metaphysical properties. Engineers treat them as specifications. The "Fink" in philosophy is often magical/instantaneous. In engineering, protection has latency. If latency > failure time, it's not a fink.
      *   *Missing:* The metaphysical "why." Engineers don't care if the disposition *exists* if the system doesn't fail. Philosophers care about the truth conditions of the property attribution.

  6.  **Evaluating the User's Instinct:**
      *   *Instinct:* "Fink literature is a mix-up between component specs and system-level behavior."
