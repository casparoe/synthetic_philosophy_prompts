      *   **Primary Target:** Step (4). This is the weak link.
      *   **Secondary Target:** Step (2) (Verificationism) is also suspect, but rejecting (4) is more surgical for an economist.
      *   **The "Identity" Argument:** Distinguish between *calibrating scales* (interpersonal) and *integrating a life* (intrapersonal).
