          *   *Cons:* The friend challenges: "What fixes the zero and unit?" If memory/body fixes it for one person, why not two similar strangers?
          *   *Strategy:* Need to show that *personal identity* provides a normative grounding for comparison that is distinct from *observational equivalence*. The "common scale" isn't found in the preferences themselves, but in the *subject of experience*.

      *   **Rejecting (1) (Preference Sovereignty):**
          *   *Pros:* Maybe preferences aren't the only data. Neural states, hedonic tones, etc.
          *   *Cons:* Moves away from standard economics. Hard to measure.
          *   *Verdict:* Viable, but maybe too radical for an economist friend.

      *   **Rejecting the Inference from (4) to (5) (The Normative Claim):**
          *   Even if scales aren't fixed observationally, do we *need* them to be fixed to make judgments? Maybe prudence is constitutive, not comparative.

  4.  **Developing the Best Counter-Argument (The "Identity" vs. "Similarity" Distinction):**

      *   The friend's argument relies on **Structuralism**: Utility is *only* the structure of the preference ordering.
      *   If Utility = Structure, then Pre-Self and Post-Self are structurally distinct modules, just like You and Me.
      *   *Counter:* Utility is not just structure; it's anchored in a **subject of experience**.
      *   *Key Distinction:* **Numerical Identity vs. Qualitative Similarity.**
          *   Interpersonal: Qualitative similarity (maybe high) but Numerical Difference.
          *   Intrapersonal: Numerical Identity (it's the *same* entity) despite Qualitative Difference (preferences changed).
      *   *Why (4) fails:* It assumes that because the *representation* (the utility function) needs alignment, the *reality* (the welfare) does too. But for one person, the "alignment" is guaranteed by the continuity of the conscious subject, not by the isomorphism of preference structures.
      *   *Addressing the "Zero and Unit" worry:* The friend asks what fixes the zero/unit for the extended self. The answer is: **Nothing external.** The scale is internal to the life. We don't need to map Pre-Self Utility to Post-Self Utility on a common cardinal scale to say "Life A is better than Life B." We evaluate the *narrative* or the *whole life*, not the sum of disjoint utility moments.
      *   *Addressing the "Strangers" worry:* Why doesn't this work for strangers? Because strangers are distinct subjects. Merging their utilities requires a "Social Welfare Function" which is a normative choice, not a factual discovery. Merging Pre/Post self utilities is a requirement of **rational agency over time**.

  5.  **Refining the Rejection of Step (4):**

      *   *Why it looked fine:* It treats utility functions as free-floating mathematical objects. In static models, they are. In dynamic models of identity, they aren't.
      *   *The Cost:* You have to admit that "Personal Identity" is doing heavy lifting that preference data cannot do. You move from "Revealed Preference" to "Philosophical Psychology."
      *   *Does it save IPC?* No. Because the grounding is *identity*. Strangers lack identity. Even if strangers are identical twins with same preferences, they are two *zeros*. The pre/post self is one *zero* persisting through time.
      *   *Does it save Prudence?* Yes. Prudence is the rationality of a persisting agent.

  6.  **Alternative: Rejecting Step (1) / The Nature of Utility (Hedonism/Objectivism):**
      *   If utility is hedonic tone (neural firing), then we *do* have a common zero/unit (no pain vs. max pain).
      *   This solves IPC *and* Intrapersonal.
