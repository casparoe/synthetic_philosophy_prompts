  **Joint Statement on Non-Empirical Theory Assessment in Fundamental Physics**

  Following adversarial collaboration, we submit this statement regarding the epistemic status of string theory.

  **1. Agreed Claims**
  1.  String theory yields substantial mathematical insights (e.g., AdS/CFT correspondence) independent of empirical validation.
  2.  Naive falsificationism is inadequate for high-energy physics where direct tests exceed accessible energy scales.
  3.  Underdetermination by data is a structural feature of this domain, not merely a temporary experimental gap.
  4.  Sociological factors inevitably influence theory selection when empirical constraints loosen.
  5.  Rational credence may shift based on theoretical virtues, though the epistemic weight of such shifts is disputed.

  **2. Statements of Disagreement**

  | The Dawidian Position | The Empiricist Position |
  | :--- | :--- |
  | Non-empirical arguments (No-Alternatives, Unexpected Coherence, Meta-Induction) provide legitimate confirmation, raising the probability that the theory is true. | Non-empirical arguments are pragmatic heuristics; confirmation requires empirical risk, and unfalsifiable theories warrant no increased belief in truth. |
  | The community's failure to find alternatives evidences a constrained solution space, not merely sociological blindness. | Assessments of "no alternatives" reflect the community's training limits, not nature's constraints. |
  | Historical meta-induction licenses trust in mathematical coherence as a truth-tracking feature. | History shows many coherent theories died on contact with data; beauty is not a reliable guide to truth. |

  **3. Cruxes and Predictions**

  **Crux 1: The Space of Possibilities.** Does the failure to find alternatives reflect reality or sociology?
  *   *Agreed Historical Case:* The development of General Relativity (1915). Competitors existed (Nordström, Abraham), but GR succeeded.
  *   *Dawid Prediction:* Future analysis will show the solution space was objectively narrow then, as it is for string theory now.
  *   *Empiricist Prediction:* Competitors existed but were marginalized; similarly, viable string rivals exist but are currently unseen due to paradigmatic lock-in.

  **Crux 2: Meta-Inductive Reliability.** Does mathematical beauty track truth?
  *   *Agreed Future Scenario:* Supersymmetry (SUSY) searches at the LHC.
  *   *Dawid Prediction:* Null results do not invalidate naturalness arguments; the theory remains probable despite accessible energy failures.
  *   *Empiricist Prediction:* Null results decisively lower credence; beauty-based expectations were false leads.

  **4. Verbal Dispute Note**
  We identify a verbal dispute regarding "confirmation." The Dawidian defines it as "rationally elevated credence based on available arguments," while the Empiricist defines it as "empirical validation involving falsification risk." We agree this terminology masks a substantive disagreement: whether non-empirical virtues justify belief without empirical risk.
