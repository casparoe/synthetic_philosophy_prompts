answer: |-
  1. **Question:** Bishop Augustine, you define a lie not merely as saying what is false, but as speaking against your own mind—saying what you believe to be false, even if it turns out to be true. Why is the state of my own conscience weightier than the reality of the world? If I mistakenly tell a falsehood thinking it true, you say I am no liar; if I tell the truth thinking it false, you say I am a liar. Why is the internal error worse than the external deception?

     **Anticipated Reply:** He will argue that God looks at the heart, not merely the outcome. Truth is an internal conformity of the soul to what it knows; to speak against that knowledge is to fracture the soul's integrity, regardless of external facts.

     **Follow-up:** So the primary injury of a lie is done to the liar's own soul, rather than to the neighbor who is deceived?

  2. **Question:** If the injury is primarily internal, consider the stage actor or the poet. They speak falsehoods knowingly, yet you argue these are not lies because no one intends to be deceived. But doesn't this concession prove that the intent to deceive is the real sin, rather than the falsehood itself?

     **Anticipated Reply:** He will agree that without the intent to deceive (*fallendi voluntas*), there is no lie. The sin lies in the will to lead another into error.

     **Follow-up:** If the will to deceive is the poison, why is a deceptive lie told to save a life morally worse than the death it prevents? Is the poison in the intent, or in the act?

  3. **Question:** Let's speak of the pursuer asking for the fugitive hiding in your house. You allow me to be silent, or to say something ambiguous like "I know where he is" without revealing where. But if I say something ambiguous knowing the pursuer will take it as a denial, haven't I achieved the lie without the word? Is this escape hatch not just dressing up the deception in technical truthfulness?

     **Anticipated Reply:** He will insist that you must speak truth according to your own meaning. If your meaning is true, even if the listener misunderstands, you have not lied. You owe the truth only to those who have a right to it.

     **Follow-up:** But if your goal is explicitly to manufacture a false belief in his mind, does the technical truthfulness of your words matter to God, who sees the goal rather than the grammar?

  4. **Question:** You sort lies into eight grades, from doctrinal error down to jest. You admit some are venial sins and some are mortal. If there are degrees of guilt, does that not quietly concede what the total ban is supposed to deny—that some lies are negligible enough to be risked in extremis?

     **Anticipated Reply:** He will maintain that any sin separates the soul from God, however slight. A graded scale of punishment does not imply a license to commit the lesser offenses.

     **Follow-up:** But you weigh sins elsewhere and allow for necessity. Why is this specific boundary absolute when the gravity within it varies so wildly? Why is the smallest lie here stricter than the greatest violence elsewhere?

  5. **Question:** We accept that a soldier may kill in a just war, or that a wife may be separated from her husband by captivity. These are grave evils licensed by necessity. Why is the tongue the one member that must never be bent by necessity? Is the word more sacred than the life?

     **Anticipated Reply:** He will argue that killing destroys the body, which is temporal, but lying destroys the soul's capacity for truth, which is eternal. To save the body by losing the soul is poor trade.

     **Follow-up:** So you would let the neighbor's body be destroyed to save your own soul from stain? Is that charity, or is it spiritual self-preservation at the neighbor's expense?

  6. **Question:** In your later letter to Consentius, you forbid lying even to bring someone to the faith or save them from heresy. You say we cannot do evil that good may come. But if a lie saves a soul from eternal damnation, is that not the ultimate good?

     **Anticipated Reply:** He will state that God does not need our lies to save souls. Truth must build the house of faith; a lie in the foundation corrupts the salvation itself.

     **Follow-up:** Then are we to stand by and watch a soul perish rather than soil our own integrity? Is the purity of the messenger more important than the safety of the recipient?

  7. **Question:** You argue that if lying were licensed, all human trust would collapse. But surely trust collapses faster if a man dies because his friend refused to lie for him? Would I trust a friend who values his own sinlessness over my survival?

     **Anticipated Reply:** He will counter that trust in words is the foundation of society itself. If words become unreliable, all community dissolves, whereas death is a natural passage we all face.

     **Follow-up:** Is it not charitable to sacrifice a principle to save a life, as Christ sacrificed himself for us? Or is the principle itself idolized above the person?

  8. **Question:** Is this absolute ban rooted ultimately in the nature of God? Because God cannot lie, we cannot lie?

     **Anticipated Reply:** He will affirm that God is Truth itself. To lie is to act against the Divine Image in which we are made. We must imitate God's inability to deceive.

     **Follow-up:** Then for the man who does not know your God, or doubts He exists, does this prohibition lose its absolute force? Is this ethics for Christians only, or for all men?

  9. **Question:** If this ethic rests on God's nature, what happens when two truths conflict? If telling the truth to one man brings death to another, you say I must speak the truth and let God handle the death. But am I not still the instrument of that death?

     **Anticipated Reply:** He will say you are responsible for your speech, not for the wickedness of the murderer who overhears it. You cannot control another's sin, only your own.

     **Follow-up:** But if I have the power to stop the murderer with a word, and I refuse because of my own purity, am I not loving my own cleanliness more than my neighbor's blood?

  10. **Question:** Bishop, in confession, do you find your flock can keep this standard? Or is it a star to steer by, rather than a law to be kept without fail? If grace covers our failure to keep it, why not permit the weakness beforehand rather than condemn it afterward?

      **Anticipated Reply:** He will say it is a law to be kept, but grace covers weakness when we fall. We must aim for perfection even if we stumble.

      **Follow-up:** If I understand you, you would rather the world burn than that a Christian speak a falsehood. Is there no middle ground where love permits a shadow to protect the light?

  ***

  **Notes for the Interviewer:**

  *   **Pacing:** Allow "Augustine" time to expound. He was a rhetorician; he will want to elaborate. If he goes too long, use the follow-up to gently steer him back to the binary choice you are proposing.
  *   **Tone:** Keep your voice warm. You are not prosecuting him; you are struggling with him. The sharpness should come from the logic, not the delivery. Use phrases like "Help me understand," or "I worry that..."
  *   **The "Escape Hatch" (Q3):** This is often the hardest point for modern audiences. If he leans heavily on "mental reservation," press hard on the *intent*. Augustine is consistent here, but it feels slippery to us.
  *   **The Theological Pivot (Q8):** If he plays up the natural law aspect (that lying is wrong even without revelation), press the follow-up on whether a non-believer would agree. If he says it's purely revealed truth, press on whether it binds conscience universally.
  *   **Ending:** Q10 is designed to be the closing note. Whatever his answer, you can thank him for his time and honesty, leaving the group to ponder the tension between purity and mercy.
