  *(Refining the "No New Laws" point)*: The user suspects this is sneaky work. I need to confirm this. Physicalist panpsychists want to keep causal closure. But if consciousness is fundamental, causal closure of the *physical* is technically violated unless you redefine the physical to include the proto-mental. This is a key tension.

