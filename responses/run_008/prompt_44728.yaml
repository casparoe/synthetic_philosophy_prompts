answer: |-
  # Session Plan: The Dilation Trap
  **Course:** Upper-Level Formal Epistemology  
  **Topic:** Imprecise Probabilities & Dilation  
  **Time:** 90 Minutes  
  **Class Size:** 12 Students  

  ## I. Learning Objectives
  1.  **Experiential:** Students will viscerally experience *dilation*: the phenomenon where acquiring relevant, independent evidence (the coin flip) strictly increases imprecision (widens the probability interval).
  2.  **Formal:** Students will map the betting behavior to the machinery of sets of priors ($\mathcal{P}$), lower/upper probabilities ($\underline{P}, \overline{P}$), and conditionalization on sets.
  3.  **Decision-Theoretic:** Students will observe how different decision rules (Maximin, E-Admissibility) diverge when faced with dilated credences.
  4.  **Philosophical:** Students will recognize the underdetermination of representational models by behavioral data.

  ## II. Materials & Setup
  *   **The "Master Envelope":** One sealed opaque envelope containing a card stating a specific proportion $\theta$ (e.g., "30% Red"). This represents the true state of $A$. *Instructor knows the range is $[1/4, 3/4]$, students know the range, no one knows $\theta$ until the end.*
  *   **The Coin:** One large, visibly fair coin.
  *   **Betting Slips:** 24 slips (2 per student). Pre-printed with "I BUY a bet on $E$ for X tokens" and "I SELL a bet on $E$ for X tokens."
  *   **Tokens:** 120 "Epistemic Utility Points" (EUPs) per student (poker chips or printed slips).
      *   *Conversion:* 100 EUPs = 1% extra credit on final paper (capped) OR a $10 coffee gift card for the top 3 earners. (Stakes must be non-trivial to induce risk sensitivity).
  *   **Whiteboard:** Divided into "Pre-Flip Market" and "Post-Flip Market."

  ## III. Timeline & Procedure

  ### 0:00–0:10 | Introduction & Setup (No Ellsberg Re-hash)
  *   **Brief Recap:** Remind them that a state of belief is modeled as a set of probability functions $\mathcal{P}$. For event $A$ (proportion of Red balls in the Master Urn), $\forall p \in \mathcal{P}, p(A) \in [1/4, 3/4]$.
  *   **The Derived Event $E$:** Define $E$ as the "Match" event.
      *   Flip fair coin $C$ (Heads/Tails).
      *   $E$ occurs if $(A \land \text{Heads}) \lor (\neg A \land \text{Tails})$.
      *   *Intuition:* $E$ is true if the Coin and the Urn "agree" (Red/Heads or Black/Tails).
  *   **Math Check:** Ask the class to verify verbally: For any precise $p \in \mathcal{P}$, $p(E) = 1/2$.
      *   $p(E) = p(A)p(H) + p(\neg A)p(T) = \theta(0.5) + (1-\theta)(0.5) = 0.5$.
      *   **Conclusion:** Before the flip, the set of probabilities for $E$ collapses to the singleton $\{0.5\}$. It is *precise*.

  ### 0:10–0:30 | Phase 1: The Precise Market (Pre-Flip)
  *   **Task:** Students must post buying and selling prices for a bet on $E$.
      *   **Bet:** Pays 10 EUPs if $E$ is true, 0 if false.
      *   **Fair Price:** 5 EUPs (since $p(E)=0.5$).
  *   **Rule:** To participate, every student must post at least one price (Buy or Sell) within the range [4, 6].
      *   *Instructor Note:* If they believe it's exactly 0.5, they should be willing to Buy at 4 and Sell at 6.
  *   **Action:** Students fill out slips. Instructor acts as the "House," accepting bets that cross the midpoint.
  *   **Expected Outcome:** High volume. Students should feel comfortable. The uncertainty about $A$ cancels out with the coin flip.
  *   **Token Check:** Ensure everyone has skin in the game.

  ### 0:30–0:50 | Phase 2: The Flip & Dilation (Post-Flip)
  *   **The Event:** Instructor flips the coin publicly. Let's say it lands **Heads**.
  *   **The Update:**
      *   Ask: "Did you learn anything about the Urn ($A$)?" (No, coin is independent).
      *   Ask: "What is $P(E | \text{Heads})$?"
      *   **Formal Derivation:** $p(E|H) = p(A|H) = p(A) = \theta$.
      *   Since $\theta \in [1/4, 3/4]$, the new probability interval for $E$ is **$[1/4, 3/4]$**.
      *   **Phenomenon:** You started with precision $\{0.5\}$. You gained information (the coin outcome). You now have imprecision $[0.25, 0.75]$. **This is Dilation.**
  *   **The Market Re-Open:**
      *   Same bet: 10 EUPs if $E$ is true.
      *   **Rule:** Students post Buy/Sell prices based on their *current* credence.
      *   **Constraint:** If you hold an imprecise credence $[0.25, 0.75]$, your Buying Price should be $\le 2.5$ and Selling Price $\ge 7.5$.
      *   *Observation:* The "spread" widens drastically. Many students will refuse to trade at the old 5 EUP price.
      *   *Instructor Action:* Try to offer them a bet at 5 EUPs. Watch them refuse *both* sides (refuse to buy, refuse to sell).
  *   **Emotional Arc:** Highlight the discomfort. "You knew the coin was irrelevant to the urn, yet looking at it made you less willing to bet on the match."

  ### 0:50–1:15 | Phase 3: Forced Choice & Decision Rules
  *   **Scenario:** The seminar requires a decision. You *must* either take the bet or pay to opt out.
  *   **The Choice:**
      1.  **Bet:** Win 10 EUPs if $E$, Lose 10 EUPs if $\neg E$. (Net: +10 or -10).
      2.  **Opt-Out:** Pay a sure fee of 2 EUPs to cancel the bet. (Net: -2).
  *   **Task:** Students vote privately on their choice.
  *   **Debrief the Split:**
      *   **Maximin (Pessimist):**
          *   Bet Min EU: $0.25(10) + 0.75(-10) = -5$.
          *   Opt-Out Min EU: $-2$.
          *   *Choice:* Opt-Out.
      *   **E-Admissibility (Liberal):**
          *   Is there *any* $p \in \mathcal{P}$ where Bet > Opt-Out?
          *   If $\theta = 0.75$, $EU(\text{Bet}) = 0.75(10) + 0.25(-10) = +5$.
          *   Since $+5 > -2$, Betting is admissible.
          *   *Choice:* Bet (permissible).
      *   **Discussion:** Why did the class split? Because the imprecise probability *underdetermines* the action without a secondary decision rule.

  ### 1:15–1:30 | Formal Debrief & Limitations
  *   **Map the Machinery:**
      *   Write $\mathcal{P} = \{p_\theta : \theta \in [0.25, 0.75]\}$.
      *   Show $\underline{P}(E) = \overline{P}(E) = 0.5$ (Pre-flip).
      *   Show $\underline{P}(E|H) = 0.25, \overline{P}(E|H) = 0.75$ (Post-flip).
      *   Define Dilation: $\underline{P}(E|C) < \underline{P}(E) \le \overline{P}(E) < \overline{P}(E|C)$.
  *   **The "Why":** The coin outcome selects which hypothesis about $A$ becomes relevant to $E$. Before the flip, $H$ and $T$ averaged out the uncertainty. After the flip, you are stuck with the raw uncertainty of $A$.
  *   **Reveal:** Open the Master Envelope. Reveal the true $\theta$. Calculate who actually won the bets. (This grounds the abstract in reality).

  ---

  ## IV. Troubleshooting: Predictable Failure Modes

  ### 1. The "Risk-Neutral Sharks" (2–3 Students)
  *   **Problem:** These students treat the interval $[0.25, 0.75]$ as a mean of $0.5$ and continue betting at even odds post-flip. They ruin the phenomenological point that dilation causes *hesitation*.
  *   **Fix:** Do not shame them. Assign them the role of **"Precision Auditors."** Their job is to calculate the expected value for the *extremes* of the interval during the debrief. Ask them: "If you were forced to guarantee a win against an adversary who knows your $\theta$, would you still bet?" This forces them to engage with the *imprecision* rather than the *average*.

  ### 2. The "Ahead-of-the-Class" Calculators
  *   **Problem:** One student realizes the dilation structure during the intro and announces, "We're going to dilate," killing the suspense.
  *   **Fix:** Pre-brief this student if possible, or pivot immediately. "Excellent. You see the formal structure. Your task now is to watch the *others*. Do they *feel* the dilation? Your job in the debrief is to explain why their hesitation is rational even if they didn't do the math beforehand." Turn them from a spoiler into a teaching assistant.

  ### 3. Stakes Too Low to Matter
  *   **Problem:** 10 EUPs feels like nothing. Students bet randomly.
  *   **Fix:** **Social Stakes.** Make the betting public. "Write your name on the slip." The cost of being the person who bets confidently and loses is social embarrassment. Alternatively, use a **Cumulative Pot**: "The student with the most EUPs at the end of the semester gets to choose the topic for the final week."

  ### 4. Confusion about Independence
  *   **Problem:** Students suspect the coin is rigged or dependent on the urn (gambler's fallacy).
  *   **Fix:** Use a physical coin flipped high in the air. Emphasize: "The urn was sealed in 1990. This coin was minted yesterday. There is no causal link." If suspicion remains, acknowledge it: "If you suspect dependence, you aren't modeling the problem correctly. For this exercise, you must *assume* independence to see the logical result of dilation."

  ---

  ## V. Critical Limitations: What This Activity Cannot Prove

  You must be frank in the final 5 minutes. This activity demonstrates *behavior* consistent with imprecise probabilities, but it does not prove the *mind* works that way.

  **1. The Underdetermination Problem**
  *   **Observation:** A student refuses the bet post-flip.
  *   **Interpretation A (Imprecise Credence):** They have a set of priors $\mathcal{P}$.
  *   **Interpretation B (Precise Credence + Non-Linear Utility):** They have a single prior $P(A)=0.5$, but their utility function is concave regarding ambiguity (e.g., Klibanoff-Marinacci-Mukerji smooth ambiguity aversion). They treat the "unknown $\theta$" as a second-order risk they dislike.
  *   **The Hard Truth:** Nothing that happened in this room distinguishes A from B. The betting behavior is identical.
  *   **Instructor Script:** "We modeled you as having imprecise credences because that fits the syllabus. But a committed Bayesian could say, 'My probability was always 0.5; I just hate betting on things where I don't know the chance.' We cannot distinguish representation from preference here. We choose the imprecise model because it handles the *structure* of the ignorance more elegantly, not because we proved you aren't Bayesians."

  **2. The "One-Off" Problem**
  *   **Observation:** Dilation is often criticized because it seems to suggest we should avoid free information (the coin flip).
  *   **Limitation:** In a single session, avoiding the flip looks rational if you hate dilation. In the long run, conditioning on the coin allows you to learn $\theta$ over many trials.
  *   **Instructor Script:** "Dilation looks like a bug here: information made you less precise. But in a long sequence of trials, conditioning on the coin allows you to estimate $\theta$. Dilation is a short-term tax on ignorance that pays off in long-term learning. Don't leave thinking information is bad."

  **3. The Artificiality of the "Set"**
  *   **Observation:** Students don't actually carry a set of functions in their head.
  *   **Limitation:** The set $\mathcal{P}$ is a normative model of their state, not a descriptive map of their neurons.
  *   **Instructor Script:** "You didn't actually calculate 50 different probability functions. The set is a tool *we* use to describe your state of ignorance. Don't reify the model."

  ## VI. Instructor Cheat Sheet (The Math)
  *   **Prior:** $\theta \in [0.25, 0.75]$.
  *   **Event $E$:** Match ($A \leftrightarrow C$).
  *   **Pre-Flip:** $P(E) = 0.5$ (Precise).
  *   **Post-Flip (Heads):** $P(E|H) = P(A) = \theta \in [0.25, 0.75]$.
  *   **Post-Flip (Tails):** $P(E|T) = P(\neg A) = 1-\theta \in [0.25, 0.75]$.
  *   **Decision Rule Divergence:**
      *   **Bet:** Payoff $+10 / -10$.
      *   **Opt-Out:** Payoff $-2$.
      *   **Maximin:** Min(Bet) = $-5$. Min(Opt) = $-2$. **Choose Opt-Out.**
      *   **E-Admissibility:** Max(Bet) = $+5$. Max(Opt) = $-2$. **Bet is Admissible.**
