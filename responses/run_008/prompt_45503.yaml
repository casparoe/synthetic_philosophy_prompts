      *   **Utopia Point:** Max $x$ in $S$ is 6. Max $y$ in $S$ is 4. So $u = (6,4)$.
      *   **KS Calculation:** Find intersection of line from $D(0,0)$ to $u(6,4)$ with the Pareto Frontier.
          *   Ray equation: $y = (4/6)x = (2/3)x$.
