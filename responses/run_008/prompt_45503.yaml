      *   **Conclusion:** The student who got $(4, 8/3)$ is right about KS. The student who got $(3,3)$ is right about the book's *sloppy description*, but wrong about the actual math. The book conflated KS with the Egalitarian solution.

  4.  **Address Monotonicity (Task b):**
      *   **Book Claim:** KS is "resource monotonic, so whenever the pie grows, both players weakly benefit."
      *   **Theory:** KS satisfies *Individual Monotonicity* (if the feasible set expands in a way that improves one player's max possible payoff without hurting the other's max, that player shouldn't lose).
      *   **Resource Monotonicity:** Usually implies that if the *entire* set expands (the "pie grows"), everyone benefits. KS does *not* satisfy full Resource Monotonicity in all general formulations, though it satisfies the specific Individual Monotonicity axiom Kalai & Smorodinsky proposed. The Egalitarian solution is the one famous for strong resource monotonicity properties. The book is likely conflating Individual Monotonicity with a broader intuition about "the pie growing."
      *   **Verdict:** The book is imprecise. It's mixing up "Individual Monotonicity" (the axiom KS satisfies) with "Resource Monotonicity" (a property often desired but not fully guaranteed by KS in all contexts, and definitely not the definition of the axiom swap).

  5.  **Address the Normative Conclusion (Task c):**
