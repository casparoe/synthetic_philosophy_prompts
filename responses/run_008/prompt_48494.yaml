answer: |-
  The arrangement presupposes a theory of divided legitimacy that locates sovereign authority in the electorate while assigning state dignity to a hereditary office, sustained by conventional norms rather than legal enforcement. This implicit view, often termed constitutional dualism, separates the source of valid coercion from the embodiment of national continuity, allowing democratic states to retain pre-democratic symbols without compromising democratic control over governance. While it is settled among comparative constitutionalists that these monarchies function democratically in practice, it is genuinely contested whether this hybridity constitutes a stable normative theory or merely a historical anomaly awaiting resolution.

  Regarding the distinction between symbolic and operative functions, the practice fits sharply with the view that only operative power requires democratic authorization, though it does not strictly require it. A pure electoral-authorization view could license the arrangement on the ground that an office exercising zero coercive power needs no mandate, treating the monarch as a state employee with no discretionary authority. However, I take the contested position that symbolic representation is itself a form of authority, meaning the distinction is not merely functional but normative; by monopolizing the "dignified" parts of the constitution, the monarch claims a representational status that rivals the elected government. If one accepts the settled view that democracy requires authorization only for coercive power, the monarchy is harmless; if one accepts the contested view that symbolic representation constitutes political authority, the monarchy remains democratically deficient regardless of its powerlessness.

  On the load-bearing mechanism of convention, the practice presupposes that political norms can constrain power without legal sanction, relying on the threat of reputational destruction rather than judicial review. It is settled that conventions like royal assent are legally unenforceable, but it is deeply contested whether they constitute binding obligations or merely descriptive habits of power. The 1975 Australian dismissal did not falsify the implicit theory but revealed its contingency: the theory assumes actors prefer constitutional stability over partisan advantage, yet when that calculation fails, the dormant power surfaces. I argue that this reveals the theory is not one of legal constraint but of mutual self-interest; the stability of the system depends on the contested premise that political actors will consistently value long-term constitutional norms over short-term gains, a premise that fails precisely when conventions are most needed.

  Concerning political neutrality, the practice presupposes that neutrality is an attainable institutional status rather than a personal virtue, maintained by strict socialization and the exclusion of the monarch from policy deliberation. It is settled that monarchs do not vote or campaign, but it is contested whether a hereditary official, embedded in elite social structures, can ever be truly neutral compared to an elected ceremonial president. The presupposition survives the observation that neutrality is conventional because the institution punishes deviations severely; however, this relies on the contested claim that the public perceives hereditary status as apolitical. If the public comes to view the monarchy as a partisan or class-based institution, the convention collapses, indicating that the neutrality is not self-guaranteeing but dependent on sustained public belief in the myth of above-politics status.

  Finally, the practice is philosophically underdetermined because it is licensed by rival theories of legitimacy that reach the same conclusion via different paths. Liberal constitutionalism licenses it as a check on populist excess, while consequentialism licenses it if it produces stability and happiness, evidenced by high approval ratings. Conversely, a strict electoral-authorization theory (civic republicanism) would require abolishing the monarchy or making the head of state elected, as any public office without a ballot mandate is illegitimate. A purely consequentialist view would require instituting regular plebiscites on the monarchy's existence, abolishing it if utility dips, whereas the current implicit view treats the office as permanent regardless of fluctuating polls. I take the contested position that the current system persists not because it satisfies a single coherent theory, but because it exploits the underdetermination, allowing democrats to ignore the normative conflict so long as the operative power remains securely with the legislature.
