  5.  **Address Question 3: Political Neutrality:**
      *   *Issue:* Is neutrality coherent for a hereditary official?
      *   *Analysis:* The "Bagehot" view (dignified vs. efficient).
      *   *Settled:* Neutrality is a performed role, not an inherent trait.
      *   *Contested:* Whether hereditary status undermines neutrality (class bias, etc.).
