  2.  **Deconstruct the Bottom Line:**
      *   What is the core theory of legitimacy? It's not purely populist (all power from the ballot) nor purely traditional (divine right). It's a hybrid often called "dual legitimacy" or "constitutional dualism." It separates *authority* (sovereignty lies with the people) from *dignity* (the state is embodied in the monarch).
      *   *Draft Bottom Line:* The practice presupposes a theory of dual legitimacy that separates the source of sovereign authority from the embodiment of state continuity, relying on constitutional convention rather than legal enforcement to maintain democratic control.

  3.  **Address Question 1: Symbolic vs. Operative Functions:**
      *   *Issue:* Does only operative power need democratic authorization?
      *   *Analysis:* The practice suggests a distinction between *reigning* (symbolic/constitutive) and *ruling* (operative). Democratic theory usually demands authorization for *power*. If the monarch has no power, do they need a mandate?
      *   *Settled:* Most theorists agree that democratic legitimacy primarily attaches to the exercise of coercive power.
      *   *Contested:* Whether "symbolic power" counts as public authority requiring authorization. Some argue symbolic representation *is* a form of authority.
      *   *Position:* The practice fits the distinction but doesn't strictly require it; a pure electoral view could license it via the "no power, no mandate" loophole. However, the *intent* of the arrangement relies on the distinction.

  4.  **Address Question 2: Convention and Normativity:**
      *   *Issue:* Can norms constrain power without sanction? Is it stable?
      *   *Analysis:* This is the "conventionalist" view of constitutions (Jennings, Dicey).
      *   *Settled:* Conventions are the primary mechanism.
      *   *Contested:* Whether conventions are truly binding or merely descriptive of power relations. The 1975 Australian dismissal (Kerr/Whitlam) is the classic counter-example.
