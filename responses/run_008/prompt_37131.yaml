      *   *Wait, is (4) the problem?* If belief is dispositions, can I intend to change my dispositions? If I can't (due to 3), then SD is impossible.
      *   *Actually, the tension is primarily between (2) and (3).*
      *   *Revision:* Change (2) from "set out to make them believe" to "set out to bias the evidence." This is the standard "deflationary" move. It respects (3) (I can't will belief) and (1) (SD happens) and (4) (Belief is just the resulting disposition).

  6.  **Final Review of the Plan:**
