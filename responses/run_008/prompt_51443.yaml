  You have a very strong intuitive grasp of a specific ethical framework. Your "load-bearing" hunch is correct, but it needs to be sharpened to resolve the tension between the German tourist and the protesting waiter.

  The principle that unifies almost all your verdicts is **The Principle of Dependent Reliance.**

  ### The Principle Defined
  You are morally obligated to follow a social convention if, and only if:
  1.  **Vulnerable Parties Rely on It:** There is a specific person or group whose welfare, dignity, or expectations depend on your compliance.
  2.  **Deviation Shifts the Burden:** Breaking the convention saves *you* a cost (money, effort, time) while imposing a cost on *them*.

  **The Exception (The Protest Clause):** You are permitted (or even praised) for breaking a convention if the convention is unjust, *provided* you absorb the cost of the deviation yourself rather than shifting it to a vulnerable third party.

  ---

  ### How This Explains Your Verdicts

  **1. The Tipping Tension (Resolved)**
  *   **German Friend:** *Verdict: Must Tip.*
      *   **Analysis:** In the US, waiters rely on tips for a living wage due to labor laws. If your friend opts out, they save money, but the waiter loses income. The burden shifts from the customer to the vulnerable worker.
  *   **Protesting Waiter:** *Verdict: Admirable.*
      *   **Analysis:** The waiter is breaking the same convention, but they are *absorbing* the cost (lost income) to highlight the injustice. They are not shifting the burden to a customer (who pays the menu price) or a colleague.
  *   **Resolution:** The principle distinguishes these cases based on **who pays the price of deviation.** Selfish deviation that hurts a dependent is wrong; sacrificial deviation that challenges the system is right.

  **2. Jaywalking (Manhattan vs. Germany)**
  *   **Manhattan (3am):** *Verdict: Fine.*
      *   **Analysis:** No cars mean no safety risk. No other pedestrians are relying on you to model behavior at 3am. There is no "dependent" harmed by your crossing.
  *   **Small German Town:** *Verdict: Wrong.*
      *   **Analysis:** This is the trickiest one, but your intuition holds up under **Systemic Reliance.** In high-trust, rule-based societies (like Germany), the safety system relies on *predictability*, not just situational awareness. If you teach your kid to break the rule, you erode their habit of strict adherence, which makes them less predictable to drivers who *expect* strict adherence. The "dependent" here is the social trust mechanism itself.

  **3. Queue Cutting vs. Escalator Blocking**
  *   **Queue Cutting:** *Verdict: Wrong.*
      *   **Analysis:** People behind you rely on the convention for fairness and time. You save time; they lose it. Direct burden shift.
  *   **Escalator Blocking:** *Verdict: Annoying, not wrong.*
      *   **Analysis:** This is an efficiency norm, not a fairness norm. While it slows people down, it doesn't typically violate a specific expectation of "turn-taking" or cause distinct harm to a specific vulnerable individual. It's a "tragedy of the commons" minor sin, not a moral violation.

  **4. Shoes Off vs. Bonjour**
  *   **Shoes Off:** *Verdict: Borderline Wrong.*
      *   **Analysis:** The host relies on you to respect the intimacy and cleanliness of their private space. Violating this is a dignity harm to a specific person you are in a relationship with.
  *   **Bonjour:** *Verdict: Not Wrong.*
      *   **Analysis:** While polite, the shopkeeper's welfare does not *rely* on this greeting. It is a low-stakes coordination norm. The "foreigner pass" applies because the reliance is weak.

  **5. Bribing the Border Guard**
  *   **Verdict:** *Wrong.*
      *   **Analysis:** Even if "everyone does it," the convention is unjust. However, participating in it shifts the burden to society (corruption undermines institutions that protect the vulnerable). You cannot excuse this via "When in Rome" because the "Roman" custom harms dependents (citizens relying on rule of law).

  ---

  ### The Verdict You Might Have to Drop

  To make this principle work cleanly, you may need to adjust your view on **The German Jaywalking Case.**

  If you stick strictly to *Dependent Reliance*, jaywalking at 3am with no cars is harmless in Germany just as it is in Manhattan. To maintain your verdict that it is *wrong* in Germany, you have to accept a stronger version of **Social Contract Theory**: that in some cultures, the *act of rule-following itself* is a public good that everyone relies on, regardless of immediate physical danger.

  If you aren't willing to accept that "rule-following for its own sake" is a moral obligation, you must concede that jaywalking in Germany at 3am is also permissible, and your desire to tell your kid not to do it is purely pragmatic (avoiding trouble) rather than moral.

  ---

  ### Application: The Gender-Segregated Bus

  Here is how the **Principle of Dependent Reliance** handles your new case:
  *   **Context:** A country with gender-segregated seating on buses (custom, no law).
  *   **The Question:** Is a visitor wrong to decline to follow it?

  **The Analysis:**
  1.  **Is the convention unjust?** Yes, gender segregation is generally discriminatory. This triggers the **Protest Clause**.
  2.  **Who is the vulnerable party?** Usually, these customs exist (ostensibly) to "protect" women from harassment, or to enforce male dominance.
  3.  **Does deviation shift the burden?**
      *   If a man sits in the women's section: He may make the women there feel unsafe or subject them to social harassment from other locals. **This shifts a burden to the vulnerable.**
      *   If a woman sits in the men's section: She may face harassment, but she is choosing that risk for herself. **This is absorbing the cost.**

  **The Verdict:**
  *   **For a Male Visitor:** It is **wrong** to sit in the women's section. Even if the custom is sexist, violating it in a way that makes local women uncomfortable or endangers them (by drawing attention to them) shifts the burden to the vulnerable. You do not get to use local women as props for your protest.
  *   **For a Female Visitor:** It is **permissible/admirable** to sit in the men's section, provided she is prepared to absorb the social cost (stares, comments). She is challenging the unjust norm without endangering others.
  *   **General Rule:** You are not obligated to follow unjust customs ("When in Rome" fails), but you **must not break them in a way that endangers the very people the custom claims to protect.**

  ### Summary
  Your gut is tracking **who gets hurt when you break the rule.**
  *   If breaking the rule saves you money/effort and hurts a worker/local: **Don't do it.** (Tipping, Queue Cutting).
  *   If breaking the rule costs you money/effort to highlight injustice: **Do it.** (Waiter Protest).
  *   If breaking the rule hurts no one and relies on no one: **It's fine.** (Manhattan Jaywalking, Bonjour).
  *   If breaking the rule hurts the social fabric that protects the vulnerable: **Don't do it.** (Bribing, German Jaywalking, Men on Women's Bus Seats).
