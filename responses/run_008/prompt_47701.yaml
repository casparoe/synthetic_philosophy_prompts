answer: |-
  This is a sophisticated version of the "separateness of persons" objection, most famously associated with John Rawls (in *A Theory of Justice*) and Robert Nozick (in *Anarchy, State, and Utopia*). Your roommate has distilled it into a tight syllogism.

  You are right to feel that the argument is seductive but that the conclusion (6) doesn't fully land. The argument relies on a category mistake between **the location of value** (ontology) and **the logic of justification** (deliberation).

  Here is the breakdown of where the argument breaks, how to handle the prudence objection without getting bogged down in Parfitian metaphysics, and how you can keep premise (1) without conceding (6).

  ### 1. The Break Point: Steps (4) and (5)

  The argument breaks at the inference from (4) to (5) and subsequently to (6).

  **The Roommate's Assumption:**
  She assumes that for a trade-off to be morally real, there must be a **subject of experience** who "holds" the sum. She treats the "utilitarian scale" as if it were a phenomenological container (like a mind) rather than a deliberative tool (like a ledger).

  **The Counter:**
  The "single scale" does not need a *feeler*; it needs a *weigher*.
  *   **Premise (5)** is true: Nobody *experiences* the sum. (No super-mind feels A's headache and B's joy simultaneously).
  *   **Premise (6)** is false: It does not follow that the sum is a fiction or that the trade-off is incoherent.

  **Why?** Because moral reasoning happens from the standpoint of an **agent**, not the standpoint of the **recipient**.
  When you (the moral agent) decide whether to sacrifice A for B and C, *you* are the single subject holding the scale. You are not required to *experience* A's pain to weigh it against B's pleasure. You are required to *recognize* A's pain as a reason for action and B's pleasure as a counter-reason.

  The "fiction" she accuses utilitarianism of creating is not the sum of values, but the idea that values must be co-located in a single consciousness to be compared. But comparison happens in the deliberation of the agent, not in the nervous systems of the patients.

  **The Fix:** You can keep (1) ("Pain is bad-for the subject") fully intact. You just deny that "bad-for the subject" implies "only relevant to the subject" or "only comparable within the subject."

  ### 2. The Hidden Slide: Step (2) to (4)

  There is hidden work being done between (2) and (4).

  *   **(2)** says: Moral reasons bottom out in goods/bads for particular people.
  *   **(4)** says: To justify trade-offs, I need a single scale containing both.

  Utilitarianism agrees with (2)! Classical utilitarianism is hedonistic; it agrees pain is bad *for the person in pain*. The slide happens when she implies that because the badness is *located* in A, the *reason to prevent it* is also *located* in A.

  This is the distinction between **Agent-Relative Value** and **Agent-Neutral Reasons**.
  *   **Value:** The pain is agent-relative (it hurts *him*).
  *   **Reason:** The reason to stop it is agent-neutral (it gives *anyone* in a position to help a reason to act).

  Your roommate is arguing that because the *value* is segmented (in separate people), the *reasons* must be segmented. Utilitarianism denies this. It says: "The fact that pain is bad-for-A gives *me* (the agent) a reason to minimize it, just as if it were bad-for-me."

  If she insists that reasons cannot cross personal boundaries, she isn't just arguing against utilitarianism; she is arguing against the possibility of altruism or moral obligation altogether. If A's pain gives *me* no reason to act unless I feel it, morality collapses into egoism.

  ### 3. The Prudence Objection (Parfit and the "Life" Boundary)

  Your instinct here is correct, but you don't need to win the metaphysical battle to win the moral one.

  Your roommate says: *"Within a life there IS a single subject over time... separateness of persons marks [the boundary]."*

  She is trying to draw a bright line at the skin/biological life. She wants to say: "Aggregation is okay inside the skin (prudence), but not outside the skin (morality)."

  **The Problem for Her:**
  If she rests her case on the "single subject over time," she owes an account of why *that* specific metaphysical fact generates a moral shield.
  *   **The Parfitian Pincer:** If she admits personal identity is just psychological continuity (Parfit's view), then the boundary between "me today" and "me next year" is just as fuzzy as the boundary between "me" and "you." If aggregation is okay across time-slices, why not across person-slices?
  *   **The Biological Pincer:** If she insists on biological identity, ask her why biology matters morally. If we could fuse two people into a hive-mind (biologically distinct, psychologically one), would aggregation suddenly become okay? If yes, then morality depends on neural connectivity, which is arbitrary. If no, then biology doesn't matter.

  **The Strategic Move:**
  Don't get stuck proving Parfit right. Instead, point out that **prudence and morality share the same structure.**
  In prudence, I sacrifice Tuesday-Me for Thursday-Me. Tuesday-Me does not experience Thursday-Me's relief. The "sum" of my life's welfare is not experienced by any single time-slice. It is a construct of deliberation.
  If she accepts prudence is rational, she accepts that **rational deliberation can aggregate across distinct centers of consciousness (time-slices).**
  Once she admits that, the burden is on her to explain why *spatial* separation (different bodies) is morally relevant while *temporal* separation (different times) is not. There is no clean story that does this without arbitrary stipulation.

  ### 4. How to Keep (1) and Reject (6)

  You want to keep: *(1) Pain is bad because it's bad for the one who feels it.*
  You want to reject: *(6) Utilitarianism is incoherent.*

  Here is the formulation that allows this:

  > "Pain is indeed bad-for the subject. There is no free-floating pain. However, the **moral significance** of that pain is not limited to the subject. When I deliberate morally, I adopt an impartial standpoint. From that standpoint, A's bad-for-A counts as 'one unit of badness' and B's good-for-B counts as 'one unit of goodness.' I am not claiming A and B share a mind. I am claiming that *my* reason to act is determined by the sum of their distinct, unshared experiences."

  **The "Price" She Pays:**
  If she holds the line at (6), she pays a high price:
  1.  **Moral Solipsism:** She risks implying that A's pain gives *me* no reason to act unless I am A.
  2.  **Arbitrary Boundaries:** She must defend the "human life" as the sacred container of value against the Parfitian reductionist view (which you rightly noted).
  3.  **Incoherence of Prudence:** If she pushes the "no subject experiences the sum" argument too hard, she threatens the rationality of long-term planning (as you noted).

  ### Summary of the Exit Strategy

  1.  **Concede (1) and (5):** Yes, pain is located in the subject, and no one feels the total sum.
  2.  **Deny the Inference to (6):** The sum is not a *phenomenological* reality; it is a *deliberative* reality. It exists in the mind of the agent weighing the options, not in the victims.
  3.  **Challenge the Boundary:** Ask her why the "skin" is the limit of aggregation if the "present moment" isn't. If she can sacrifice now for later (where no single moment experiences the whole life), why can't society sacrifice A for B (where no single person experiences the whole society)?
  4.  **Final Blow:** If she says "Because they are different people," ask: "What is the *moral* difference between 'different people' and 'different times' that justifies aggregation in one case but not the other?"

  The argument breaks because she confuses **where value lives** (in individuals) with **how we count it** (in aggregation). Utilitarianism respects the former while insisting on the latter.
