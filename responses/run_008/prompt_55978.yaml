      *(Focus on the "Retroactive" point)*: This is the crux. If a long proof yields $\bot$, does a short proof of $\phi$ still warrant belief in $\phi$? In classical logic, if $\bot$ is provable, $\phi$ is provable *trivially*. But we already had a short proof. The issue is *soundness*. If axioms are inconsistent, they have no model. If they have no model, "truth" relative to the axioms is meaningless. So yes, epistemic standing collapses.

      *(Paraconsistency)*: Is it bookkeeping? Yes, largely. It saves the practice but abandons the classical conception of truth.

