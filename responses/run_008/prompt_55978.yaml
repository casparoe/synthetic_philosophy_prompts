          *   *Friend's View (Pragmatic/Fallibilist):* "Practical consistency." If a contradiction requires a proof longer than the universe's lifespan, it doesn't matter. Value of proof = checkability. Analogy: Engineering/Bridges (use what stands).
          *   *User's View (Realist/Epistemic):* Consistency is substantive. An inconsistency, however long, retroactively impugns *all* proofs (even short ones). Analogy: Testimony/Trust (once impugned, trust is gone everywhere).
          *   *Compromise View (Paraconsistent):* Quarantine contradictions. Keep using classical math locally. Analogy: Software bug quarantine.
      *   **Specific Tasks:**
          *   Weigh "practical consistency" vs. "substantive consistency."
          *   Address the "retroactive impugnment" claim vs. the "bridge analogy."
          *   Assess the paraconsistent quarantine strategy.
          *   **Constraint:** Do not end on a non-committal note. Reach and defend a verdict (even if conditional). State what would count against it.

  2.  **Initial Brainstorming & Philosophical Context:**

