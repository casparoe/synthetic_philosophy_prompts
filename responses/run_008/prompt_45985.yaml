prompt: |-
  bit of background first: I sit on a small "condition review" panel for a regional health service. A few times a year we get a dossier asking whether something should be counted as a disease "for our purposes" — which sounds technical but really decides whether treatments get covered, whether people can claim sick leave, whether screening programs get funded. Past cases have included things like prolonged grief (still intense, disabling grief more than a year after a bereavement) and gaming disorder, and we have misophonia (rage/panic reactions to other people's chewing sounds, basically) coming up. Nobody on the panel is a philosopher and honestly our discussions are a mess.

  From my own reading I gather the underlying split is this: naturalists say disease is basically biological dysfunction — something in the person isn't doing what it's supposed to do, where "supposed" is read statistically, roughly along the lines of Boorse's biostatistical theory, dysfunction = failure of a part to contribute to survival and reproduction the way it typically does in the species. Normativists say no, disease is at least partly a value judgment — roughly Wakefield's line, that you need both a dysfunction AND harm judged by social standards, and there are people who push the value side even harder (if nothing were bad for anyone, nothing would be a disease, period). The panel ends up half-doing both without noticing: someone says "but it's in the ICD" (which begs the question, the ICD people had to decide the same thing), someone else says "but look how much suffering there is," and we usually end up splitting the difference in a way that satisfies nobody.

  So what I want is a procedure. Please write the panel a decision procedure we can actually run in one long meeting: the questions in order, what a sufficient answer to each looks like, the points where the answer is "no, stop here," and the points where we have to admit the question is about values and hand it to a vote or a named official rather than pretend the procedure settled it. Keep whatever distinctions from the philosophy actually matter for coverage-type decisions and drop the rest, and be upfront about where the procedure is going to misfire or just can't finish. Then run it on the three cases above — prolonged grief, gaming disorder, misophonia — and tell me straight which ones it completes and which it hands back to us. For what it's worth I personally think gaming disorder is mostly a moral panic, so if the procedure comes out clearing it over my objections, I'd honestly like to see that rather than have the procedure rigged to agree with me. Also, one of us has to write public minutes, so the steps need to be defensible to a reader who wasn't in the room — no step that only works because we all share an intuition.

  Note the constraints: we're clinicians and policy staff, not philosophers, the decision has to be made in weeks, and the final sign-off belongs to the clinical director, so the procedure's output should be a recommendation with the value-laden parts marked as such. If the honest answer is that naturalism vs normativism doesn't actually change any of our three outcomes either way, say that too — I'd rather know the philosophy is decorative here than keep pretending its doing work it isnt.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **User:** Member of a regional health service "condition review" panel.
      *   **Task:** Create a practical decision procedure for determining whether a condition counts as a "disease" for coverage/benefit purposes.
      *   **Context:** Panel consists of clinicians and policy staff (not philosophers). Discussions are currently messy, mixing empirical claims (ICD status, biology) with normative claims (suffering, values) without distinguishing them.
      *   **Cases to Test:** Prolonged Grief Disorder (PGD), Gaming Disorder, Misophonia.
      *   **Constraints:** Must be runnable in one long meeting, defensible in public minutes, acknowledge where philosophy stops and values begin, honest about limitations (if philosophy doesn't change outcomes, say so).
      *   **User's Bias:** Suspects Gaming Disorder is a moral panic but wants an honest procedure, not a rigged one.
      *   **Goal:** A step-by-step protocol with stop-points, clear criteria, and explicit flagging of normative judgments.

  2.  **Deconstruct the Philosophical Background:**
      *   **Naturalism (Boorse):** Disease = Biological dysfunction (statistical deviation from species-typical functioning contributing to survival/reproduction). *Problem:* Hard to define "species-typical" for mental states; ignores harm.
      *   **Normativism (Value-based):** Disease = Disvalued condition. *Problem:* Too broad (criminality, poverty could be diseases); makes medicine purely political.
      *   **Hybrid (Wakefield):** Disease = Harmful Dysfunction. Needs *both* a mechanism failure (naturalist) AND harm/value judgment (normativist). *Advantage:* Balances objectivity with relevance.
      *   **Pragmatism (Health Service Context):** The goal isn't metaphysical truth; it's resource allocation. Does recognizing this as a disease improve health outcomes and justify public spending?

  3.  **Drafting the Procedure (Iterative Process):**
      *   *Attempt 1 (Too Philosophical):* Step 1: Is there a biological mechanism? Step 2: Is it harmful? Step 3: Vote. *Critique:* Clinicians can't always prove biological mechanisms for mental health issues. "Harmful" is too vague.
      *   *Attempt 2 (Too Bureaucratic):* Step 1: Is it in the ICD? Step 2: Is there a treatment? *Critique:* User explicitly said relying on ICD begs the question.
      *   *Attempt 3 (The Hybrid/Pragmatic Approach):* Combine Wakefield's "Harmful Dysfunction" with a pragmatic "Intervention Efficacy" check. This fits a health service context.
      *   *Structure:*
          1.  **Threshold Check (Existence & Consistency):** Is this a real, identifiable pattern?
          2.  **Dysfunction Check (Naturalist lean):** Is there a failure of internal mechanism?
          3.  **Harm Check (Normative lean):** Does it cause significant negative impact?
          4.  **Intervention Check (Pragmatic):** Can we actually do anything about it medically?
          5.  **Value Declaration (The "Hand-off"):** Explicitly state where the decision relies on social values, not science.

  4.  **Refining the Steps for the Panel:**
      *   Need clear "Stop" conditions. If it fails Step 2, it's not a dysfunction. If it fails Step 3, it's not harmful.
      *   Need to distinguish *evidence* from *values*.
      *   Need to address the "Moral Panic" concern (Gaming Disorder).
      *   Need to ensure public defensibility.

  5.  **Running the Cases:**
      *   **Prolonged Grief Disorder (PGD):**
          *   Pattern: Yes.
          *   Dysfunction: Debatable (is grief a mechanism?), but generally accepted as dysregulated emotional processing.
          *   Harm: High (suicide risk, inability to function).
          *   Intervention: Therapy exists.
          *   *Verdict:* Likely passes, but the "dysfunction" part is the weak link philosophically.
      *   **Gaming Disorder:**
          *   Pattern: Yes.
          *   Dysfunction: Reward pathway hijacking (addiction model).
          *   Harm: Variable (some play a lot without harm). Needs strict harm criteria.
          *   Intervention: Behavioral therapy.
          *   *Verdict:* This is the tricky one. The procedure should highlight that the *harm* threshold is where the value judgment lies. If the panel thinks it's a moral panic, they should flag that at the Value Declaration step.
      *   **Misophonia:**
          *   Pattern: Yes.
          *   Dysfunction: Sensory gating/neural connectivity issues (emerging evidence).
          *   Harm: High (social isolation, rage).
          *   Intervention: Limited (CBT, sound therapy), but manageable.
          *   *Verdict:* Strong candidate, often overlooked.

  6.  **Addressing the "Philosophy is Decorative" Constraint:**
      *   I need to be honest. For a health service, the "Disease" label is mostly a key to unlock funding. The philosophical distinction between Naturalism and Normativism often collapses into "Is it severe enough and treatable enough to warrant spending?"
      *   I must explicitly state that the procedure *cannot* resolve the metaphysical status, only the policy status.

  7.  **Finalizing the Output Structure:**
      *   **Introduction:** Acknowledge the messiness, set the tone (pragmatic hybrid).
      *   **The Protocol:** 5 Steps with specific questions, evidence requirements, and "Stop/Proceed" logic.
      *   **The "Value Flag":** A specific moment where the panel must admit they are making a moral/policy choice.
      *   **Case Applications:** Run PGD, Gaming, Misophonia through the protocol.
      *   **The Hard Truth:** A concluding section on whether the philosophy actually matters for the *outcome* (spoiler: it matters for the *justification*, not necessarily the binary yes/no).

  8.  **Self-Correction/Refinement during drafting:**
      *   *Check:* Did I allow ICD status to be a shortcut? *Correction:* No, make ICD status *evidence* but not *proof*.
      *   *Check:* Is the Gaming Disorder bias addressed? *Correction:* Ensure the "Harm" step requires impairment *beyond* mere time spent, to filter out moral panic.
      *   *Check:* Is it defensible in minutes? *Correction:* Use language like "Evidence suggests..." and "Panel determined value threshold..." rather than "We feel..."

  9.  **Final Polish:** Ensure the tone is professional, direct, and respectful of the user's time and intelligence. (Proceed to generate response).

  *(Self-Correction Note during final review)*: I need to make sure I don't just give them a "Yes/No" on the cases, but show *where* the procedure stops or flags a value judgment. The user wants to see the *workings*, not just the result. Also, emphasize that "Disease for our purposes" $\neq$ "Metaphysical Disease."

  10. **Final Output Generation** (incorporating the above thoughts).
answer: |-
  This is a common problem in health policy. You are trying to draw a boundary around "medical necessity" using tools that were designed for metaphysics. The reason your discussions are a mess is that you are treating "Is this a disease?" as a single question, when it is actually three different questions stapled together:

  1.  **Is this real?** (Empirical/Scientific)
  2.  **Is this bad?** (Normative/Value)
  3.  **Is this our job to fix?** (Policy/Resource)

  The philosophy you cited (Boorse vs. Wakefield) matters because it tells you *where* the uncertainty lies. Boorse (Naturalism) tries to make #1 answer #2. Wakefield (Harmful Dysfunction) admits you need both. For a health service, you need a **Pragmatic Hybrid**. You don't need to solve the philosophy; you need to isolate the value judgments so they can be voted on openly rather than hiding them behind medical jargon.

  Below is a decision procedure designed for your specific constraints: one meeting, defensible minutes, and a clear hand-off to the Clinical Director for the final value call.

  ***

  # The Condition Review Protocol (CRP-v1)

  **Purpose:** To determine if a condition qualifies for service coverage.
  **Output:** A recommendation (Cover / Do Not Cover / Defer) with explicit justification flags.
  **Time:** One 4-hour session.
  **Rule:** If the panel cannot agree on an empirical step, the condition fails that step. If the panel cannot agree on a value step, it is flagged for the Director.

  ## Step 1: The Consistency Check (Empirical)
  **Question:** Is the phenomenon identifiable, distinct, and consistent across observers?
  **Evidence Required:**
  *   Operational criteria (symptoms must be definable).
  *   Inter-rater reliability (two clinicians would agree this patient has it).
  *   *Note:* ICD/DSM inclusion is **evidence**, not proof. If the ICD says yes but your clinicians say "we can't reliably diagnose this," you proceed with caution.
  **Stop Condition:** If **NO**. The condition is too vague to administer policy around. **Recommendation: Do Not Cover.**
  **Proceed if:** **YES.** (Move to Step 2).

  ## Step 2: The Dysfunction Check (Naturalist)
  **Question:** Is there evidence of an internal mechanism failing to perform its expected function?
  **Evidence Required:**
  *   Biological, psychological, or neurological data showing deviation from species-typical functioning.
  *   *Crucial Distinction:* This is not about "suffering." A broken leg is a dysfunction even if it doesn't hurt. A social problem (e.g., poverty) is not a dysfunction even if it causes suffering.
  *   *For Mental Health:* Look for cognitive/emotional processing failures (e.g., inability to regulate affect, reward pathway hijacking), not just "behavior we dislike."
  **Stop Condition:** If **NO**. If the condition is a rational response to circumstances (e.g., grief at 2 weeks) or purely a social deviation without internal mechanism failure. **Recommendation: Do Not Cover.**
  **Proceed if:** **YES** or **EQUIPOISE**. (If evidence is emerging but not definitive, proceed but flag uncertainty).

  ## Step 3: The Harm Check (Normative)
  **Question:** Does the dysfunction cause significant harm or impairment to the individual?
  **Evidence Required:**
  *   Impact on Activities of Daily Living (work, relationships, self-care).
  *   Risk of morbidity/mortality (suicide, physical health decline).
  *   *Crucial Distinction:* High prevalence does not equal low harm. Unusual behavior does not equal harm.
  **Stop Condition:** If **NO**. If the condition is benign or primarily annoying to *others* rather than the patient. **Recommendation: Do Not Cover.**
  **Proceed if:** **YES.** (Move to Step 4).

  ## Step 4: The Intervention Check (Pragmatic)
  **Question:** Is there a safe, effective intervention available within our scope?
  **Evidence Required:**
  *   Clinical guidelines or trial data showing treatment improves outcomes compared to no treatment.
  *   *Rationale:* We do not cover conditions we cannot treat. Labeling something a disease without a treatment creates patients without solutions.
  **Stop Condition:** If **NO**. **Recommendation: Do Not Cover (Research Only).**
  **Proceed if:** **YES.** (Move to Step 5).

  ## Step 5: The Value Declaration (The Hand-Off)
  **Status:** You have now exhausted empirical and clinical questions. Any remaining objection is a **Value Judgment**.
  **Action:** The Panel must vote on the following statement:
  *"Recognizing this condition as covered aligns with our service's priorities and does not risk medicalizing normal human variation."*
  *   **Vote YES:** Recommend Coverage.
  *   **Vote NO:** Recommend Exclusion.
  *   **Vote SPLIT:** Flag for Clinical Director.
  **Minutes Requirement:** You must record *why* the value judgment was difficult. (e.g., "Panel agreed on harm, but disagreed on whether this is a medical issue or a social one.")

  ***

  # Running the Cases

  Here is how the protocol applies to your three dossiers. I have applied the "strict" reading you asked for, including your skepticism on Gaming Disorder.

  ### Case 1: Prolonged Grief Disorder (PGD)
  *   **Step 1 (Consistency):** **PASS.** Diagnostic criteria exist (ICD-11/DSM-5-TR). Clinicians can distinguish from depression/PTSD.
  *   **Step 2 (Dysfunction):** **PASS (with caveat).** Evolutionary biology suggests grief has a function (social re-bonding). PGD represents a failure of the "recovery mechanism" to disengage. It is a stuck state, not just sadness.
  *   **Step 3 (Harm):** **PASS.** High correlation with suicide, substance use, and cardiovascular issues. Impairment is severe.
  *   **Step 4 (Intervention):** **PASS.** Complicated Grief Therapy (CGT) shows efficacy.
  *   **Step 5 (Value):** **LOW CONFLICT.** Most panels view preventing suicide and restoring function as core medical duties.
  *   **Outcome:** **Recommend Coverage.**
  *   **Minutes Note:** "Panel noted the dysfunction is a failure of emotional regulation mechanisms, not the grief itself."

  ### Case 2: Gaming Disorder
  *   **Step 1 (Consistency):** **PASS.** ICD-11 criteria are specific (impaired control, increasing priority, continuation despite harm).
  *   **Step 2 (Dysfunction):** **PASS (Neurobiological).** Evidence shows reward pathway changes similar to substance use disorders. It fits the "internal mechanism failure" model.
  *   **Step 3 (Harm):** **STOP / FLAG.** This is the bottleneck.
      *   *Evidence:* Many high-hour gamers have no impairment. Harm is only present in a small subset.
      *   *The Trap:* If you cover "Gaming," you risk covering high engagement that isn't harmful. If you cover "Gaming *Disorder*," you rely on the harm criteria being strictly enforced.
      *   *Your Objection:* If you believe this is a moral panic, your argument belongs here. Is the "harm" real, or is it society valuing productivity over leisure?
  *   **Step 4 (Intervention):** **PASS.** CBT and behavioral interventions exist.
  *   **Step 5 (Value):** **HIGH CONFLICT.**
      *   *Argument for:* It matches the addiction model; people are suffering.
      *   *Argument against:* Risk of pathologizing youth culture; resource drain for a condition often self-limiting.
  *   **Outcome:** **FLAG FOR DIRECTOR.**
  *   **Minutes Note:** "Panel agreed on biological mechanism but split on whether the harm threshold justifies medicalization given the risk of stigmatizing normal leisure. Requires policy decision on resource prioritization."
      *   *Honest Assessment:* The procedure does not clear this over your objections. It forces the objection into Step 3 and 5, where it belongs. If you vote "No" at Step 5, the recommendation is "Do Not Cover," and the Director must override you to approve it.

  ### Case 3: Misophonia
  *   **Step 1 (Consistency):** **PASS (Emerging).** Criteria are less standardized than PGD but clinically recognizable (specific trigger sounds, rage/panic response).
  *   **Step 2 (Dysfunction):** **PASS (Emerging).** fMRI studies show altered connectivity between auditory cortex and amygdala (fight/flight). It is not "being grumpy"; it is a neural gating failure.
  *   **Step 3 (Harm):** **PASS.** Severe social isolation, job loss, family estrangement.
  *   **Step 4 (Intervention):** **EQUIPOISE.** Treatments (sound therapy, CBT) exist but evidence base is thinner than PGD.
  *   **Step 5 (Value):** **LOW CONFLICT.** Suffering is high, mechanism is neurological.
  *   **Outcome:** **Recommend Coverage (with review clause).**
  *   **Minutes Note:** "Panel recommends coverage contingent on 2-year review of treatment efficacy data."

  ***

  # The Hard Truth: Does the Philosophy Matter?

  You asked me to be upfront about where the procedure might misfire or if the philosophy is decorative.

  **1. The "Dysfunction" Step is doing the heavy lifting.**
  In all three cases, Step 2 (Naturalism) is where you filter out "social problems." If you didn't have this step, you might cover "Unemployment Distress." The Boorse/Wakefield distinction matters here: you are explicitly looking for an *internal* failure, not just an *external* bad situation. This prevents the service from becoming a general welfare agency.

  **2. The "Harm" Step is where the Philosophy Dies.**
  In practice, Step 3 (Normativism) swallows Step 2. If the harm is bad enough (e.g., suicide risk in PGD), the panel will find a "dysfunction" to justify it. If the harm is ambiguous (Gaming), the "dysfunction" gets scrutinized much harder.
  *   **Honest Answer:** For your purposes, the Naturalist/Normativist debate is **decorative**. You are not deciding if these are "True Diseases." You are deciding if they are **Actionable Health Burdens.**
  *   **Why keep the steps?** Not because they reveal metaphysical truth, but because they force you to write down *why* you are saying yes or no.
      *   If you reject Gaming Disorder, you must write: "We acknowledge the mechanism, but do not accept the harm threshold."
      *   If you accept Misophonia, you must write: "We acknowledge the mechanism is less proven than PGD, but the harm is equivalent."

  **3. Where the Procedure Will Misfire.**
  The procedure assumes you can separate "Dysfunction" from "Harm." In mental health, you often can't.
  *   *Example:* Is "inability to hold a job" a dysfunction (Step 2) or a harm (Step 3)?
  *   *Fix:* Your minutes must define "Dysfunction" as *mechanism* (brain/mind processing) and "Harm" as *outcome* (life impact). If you blur these, the procedure fails.

  **4. The Recommendation.**
  Use the protocol. It will likely result in:
  *   **PGD:** Covered.
  *   **Misophonia:** Covered (with caveats).
  *   **Gaming:** Flagged for Director.

  This protects you. If Gaming Disorder turns out to be a moral panic, the minutes show the Panel flagged the value risk. If it turns out to be real, the Director can override based on new evidence. You have done your job: you separated the science from the values.

  **Final Advice for the Minutes:**
  Do not write "The panel debated whether gaming is a disease."
  Write: "The panel confirmed neurobiological mechanisms (Step 2) but could not reach consensus on whether the prevalence of harm justifies resource allocation over other priorities (Step 5)."
  That is defensible. That is policy. That is not philosophy.
