      *   *Contested (Substantive):* When does the choice of framework matter for *prediction*? How do we handle Major Evolutionary Transitions (METs)? What is the role of cultural evolution in humans? Is inclusive fitness theory (IFT) general enough for all cases (Nowak et al. 2010 critique)?
