answer: |-
  This is a sophisticated brief. You have correctly identified that the "war" is no longer about whether group selection *can* happen (it can), but about where it *does* happen, how we model it, and what narratives we build on top of the math.

  For a year-long project aimed at a general-interest audience, you should avoid the "history of ideas" trap (the 1970s polemics) and the "pure philosophy of biology" trap (semantic debates about the definition of a "vehicle"). Instead, focus on where the choice of framework changes **what we look for** and **what we can fix**.

  Here are the three priorities I recommend, ranked by their potential to correct public misunderstanding while tracking live scientific stakes.

  ---

  ### Priority 1: Cultural Group Selection and the "Selfish Gene" Misinterpretation
  **The Question:** *Does the evolution of human cooperation require a group-selection framework that gene-centric models cannot easily capture, and does this invalidate the leap from biological selfishness to psychological egoism?*

  **The Journalistic Hook:**
  This is the direct antidote to the most harmful public misunderstanding of evolution: that "survival of the fittest" implies humans are fundamentally selfish, competitive, or capitalist. If you can show that high-fidelity cultural transmission allows groups to outcompete other groups *even when individual selection favors defectors*, you dismantle the "biological justification for greed." This moves the debate from "Are we selfish?" to "Under what structural conditions does altruism win?"

  **The Scientific Stakes:**
  *   **Live Stake:** Proponents (e.g., Boyd, Richerson, Henrich) argue that genetic kin selection cannot explain large-scale human cooperation among non-kin. They posit that cultural traits (norms, institutions) evolve via group selection because groups with better norms outcompete others.
  *   **Live Stake:** Critics argue this is just kin selection or reciprocal altruism dressed up in cultural clothing, or that individual-level selection on cultural variants is sufficient.
  *   **Prediction Difference:** A gene-centric/individual-selection model predicts cooperation scales with relatedness or repeated interaction. A cultural group-selection model predicts cooperation scales with *group identity markers* and *punishment institutions*, even among strangers.

  **Rigor Markers:**
  *   **[SETTLED]:** Gene-culture coevolution is a real phenomenon. Cultural traits can evolve faster than genes.
  *   **[CONTESTED]:** Whether "Cultural Group Selection" is a distinct causal mechanism or just a descriptive label for individual-level learning biases aggregated.
  *   **[RHETORICAL]:** The claim that "Selfish Gene" theory *requires* humans to behave selfishly. (No serious evolutionary psychologist claims this; the is-ought fallacy is settled science, but the public confusion remains).

  **What Moves This Up/Down:**
  *   **Up:** New cross-cultural data showing societies with specific "pro-social" institutions outcompeting others historically, where kinship ties are explicitly controlled for.
  *   **Down:** A robust model demonstrating that individual-level cultural learning biases (e.g., "copy the successful") fully account for the data without invoking group-level fitness differentials.

  ---

  ### Priority 2: Somatic Selection (Cancer and Aging) as the "Control Case"
  **The Question:** *If multilevel selection is real, the clearest evidence should be within the organism. How does the body suppress "cheater" cells, and what happens when that suppression fails?*

  **The Journalistic Hook:**
  This bypasses the ideological baggage of the 1970s. No one has an emotional investment in whether a tumor is a "group" or an "individual." It makes the units-of-selection debate visceral: cancer *is* cell-level selection breaking free of organism-level selection. Aging is arguably the accumulation of somatic selection. This frames multilevel selection not as a political metaphor, but as a medical reality.

  **The Scientific Stakes:**
  *   **Live Stake:** Evolutionary medicine relies on the premise that the organism is a "coalition" of cells. Understanding the mechanisms that enforce this cooperation (immune surveillance, apoptosis, limited telomerase) is understanding the mechanisms of multicellularity itself.
  *   **Prediction Difference:** A strict gene-centric view might focus on specific oncogenes. A multilevel view focuses on the *ecological* context of the tissue (e.g., does inflammation lower the cost of cheating?). It shifts therapy from "kill the bad cells" to "change the selection pressure so cheating doesn't pay."

  **Rigor Markers:**
  *   **[SETTLED]:** Cancer is an evolutionary process of somatic selection. Multicellular organisms require mechanisms to suppress lower-level selection.
  *   **[CONTESTED]:** The extent to which aging is driven by somatic selection vs. antagonistic pleiotropy (genes good early, bad late).
  *   **[RHETORICAL]:** Calling cancer "cellular selfishness." (It's not psychological; it's a breakdown of selection constraints).

  **What Moves This Up/Down:**
  *   **Up:** Clinical trials based on "evolutionary therapy" (managing resistance by altering selection pressures) showing superior outcomes to maximum-dose strategies.
  *   **Down:** If somatic mutations turn out to be largely neutral passengers rather than drivers of tissue-level decline, reducing the stakes of within-organism selection.

  ---

  ### Priority 3: The "Equivalence" vs. "Heuristic" Debate
  **The Question:** *If the math of kin selection and multilevel selection is often equivalent, why do biologists still fight? Does the framework you choose determine what discoveries you make?*

  **The Journalistic Hook:**
  This addresses your "bookkeeping" framing. The public thinks science is about "Truth." This story reveals science is about "Utility." If two math models describe the same reality, why does E.O. Wilson's camp say Inclusive Fitness is "wrong" (Nowak et al. 2010), while Dawkins' camp says Multilevel Selection is "confusing"? The story isn't about who is right; it's about which lens reveals new phenomena.

  **The Scientific Stakes:**
  *   **Live Stake:** The 2010 *Nature* paper by Nowak, Tarnita, and Wilson attacked the generality of Inclusive Fitness Theory (IFT). They argued MLS is more general. The counter-attack was ferocious (137 co-authors on a rebuttal).
  *   **Prediction Difference:** Proponents of MLS argue IFT focuses too much on pairwise relatedness and misses emergent group structures. Proponents of IFT argue MLS is often just a post-hoc description that lacks the predictive power of Hamilton's Rule.
  *   **Empirical Test:** In social insects (the battleground), does assuming a "colony fitness" function predict sex ratios or caste allocation better than calculating individual inclusive fitness?

  **Rigor Markers:**
  *   **[SETTLED]:** The Price Equation shows the mathematical equivalence of the approaches in many standard models.
  *   **[CONTESTED]:** Whether Inclusive Fitness Theory holds in cases of non-additive interactions (synergy). Whether MLS provides better *heuristics* for experimental design.
  *   **[RHETORICAL]:** Claims that one framework is "ideologically motivated" (e.g., socialism vs. capitalism). This is almost entirely rhetorical posturing by the participants.

  **What Moves This Up/Down:**
  *   **Up:** A specific empirical case where an IFT model fails to predict an outcome that an MLS model predicts correctly (or vice versa).
  *   **Down:** A consensus statement or synthesis showing that the "attack" on IFT was based on a narrow definition of the theory that its proponents don't actually use.

  ---

  ### What to Deprioritize (The "Do Not Report" List)

  To save your year, you should actively avoid or minimize these topics. They consume oxygen but yield little new insight for a general audience.

  1.  **The Definition of "Group":**
      *   *Why:* Philosophers of biology have written libraries on whether a "group" needs to be bounded, persistent, etc.
      *   *Verdict:* **[RHETORICAL/TERMINOLOGICAL]**. For a journalist, a group is any set of individuals where the fitness of one depends on the traits of the others. Don't get bogged down in ontology.
  2.  **The Wynne-Edwards Historical Autopsy:**
      *   *Why:* Retelling the story of how he was "wrong" about lemmings is history, not science.
      *   *Verdict:* **[SETTLED]**. We know naive group selection (for the good of the species) doesn't work. Mention it only to contrast it with modern MLS.
  3.  **"Selfish Gene" as a Metaphor for Human Psychology:**
      *   *Why:* You noted this yourself. No serious biologist endorses psychological egoism based on Dawkins.
      *   *Verdict:* **[SETTLED]**. Treat this as a public misconception to be corrected (via Priority 1), not a live scientific hypothesis to be debated.
  4.  **The "Altruism" Semantics:**
      *   *Why:* Biologists define altruism as "costly to self, beneficial to other." The public defines it as "nice."
      *   *Verdict:* **[TERMINOLOGICAL]**. Define your terms once in a sidebar and move on. Do not write 3,000 words on the definition of altruism.

  ### A Note on Reporting the "Settled" vs. "Contested"

  You asked for rigor in marking these lines. Here is the specific friction point you will encounter in interviews:

  *   **The Trap:** A researcher will say, "Group selection is back!"
  *   **The Correction:** You must ask: "Do you mean the *mechanism* is accepted, or that it is the *dominant* explanation for sociality?"
      *   *Mechanism Accepted:* Yes. (Settled)
      *   *Dominant Explanation:* No. Kin selection/Individual selection is still the null hypothesis for most. (Contested)
  *   **The Trap:** A researcher will say, "Inclusive Fitness is dead."
  *   **The Correction:** Ask: "Is it mathematically invalid, or just hard to measure in complex scenarios?"
      *   *Mathematically Invalid:* No, not generally. (Settled)
      *   *Hard to Measure:* Yes, in non-additive scenarios. (Contested)

  ### Final Recommendation for the Narrative Arc

  If I were editing this project, I would structure the year as a triangulation:
  1.  **The Body (Cancer):** Show multilevel selection is physically real and medically urgent. (Establishes the mechanism).
  2.  **The Tribe (Cultural Evolution):** Show multilevel selection explains human uniqueness and corrects the "selfish" myth. (Establishes the stakes for human nature).
  3.  **The Math (The Framework War):** Explain why scientists still fight about how to count these things, and why that fighting actually helps science progress. (Establishes the philosophy of science).

  This avoids the 1970s ghost story and gives you a modern, empirical, and high-stakes narrative that respects the complexity of the field without drowning the reader in it.
