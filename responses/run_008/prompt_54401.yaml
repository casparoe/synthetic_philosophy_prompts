  5.  **Drafting the Response (incorporating rigor markers):**
      *   *Structure:* Introduction acknowledging the sophistication of the prompt. Three prioritized questions. For each: The Journalistic Hook, The Scientific Stakes, Settled vs. Contested, Trigger Events. Then a section on what to Deprioritize.
