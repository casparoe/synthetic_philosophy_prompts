  7.  **Final Polish:** Check against the prompt's specific request for "what developments would move a question up or down." Ensure this is included for each priority. Check the deprioritization list to ensure it saves the journalist time.

      *(Self-Correction on "Settled"):* Be careful. Is MLS *fully* accepted? Most evolutionary biologists accept it exists, but disagree on its *prevalence* relative to kin selection. I need to be precise there. The *possibility* is settled; the *prevalence* is contested.

