  The argument pattern you describe is widely recognized in the philosophy of mind and philosophy of computation under the established name **The Triviality Argument** (often specifically attributed to Hilary Putnam as **Putnam's Triviality Theorem** or **Putnam's Triviality Argument**).

  ### Origin and Literature
  The canonical formulation appears in Hilary Putnam's *Representation and Reality* (1988), where he argues that any open physical system (like a rock or a wall) can be mapped onto any finite state automaton, provided the mapping is sufficiently complex and gerrymandered. John Searle popularized a version of this in "Is the Brain a Digital Computer?" (1990) with his "wall" example, arguing that syntax (computation) is observer-relative because you can find syntactic structures in anything. David Chalmers discusses this extensively in *The Conscious Mind* (1996) under the heading of "The Triviality Result," and contemporary philosophers of computation like Gualtiero Piccinini address it in the *Stanford Encyclopedia of Philosophy* entry on "Computation in Physical Systems."

  ### Bearing on the Upload Case
  The argument bears directly on the upload debate by challenging the substantive content of the claim "the brain is a computer." If the implementation relation between physics and computation is unconstrained, then:
  1.  **Pancomputationalism:** Every physical system implements every computation. A wall simulates a brain just as faithfully as a silicon chip does, given the right (complex) mapping.
  2.  **Loss of Discriminatory Power:** If everything computes, saying the brain computes doesn't explain why the brain produces mind and the wall doesn't. The computational description fails to carve nature at its joints.
  3.  **Threat to Functionalism:** Since functionalism relies on the causal organization implementing the right computation, triviality suggests that "causal organization" is also in the eye of the beholder unless constrained.

  ### Standard Responses and Their Success
  Defenders of computationalism typically offer three types of constraints to block the triviality:
  1.  **Causal Constraints:** The physical states must causally mirror the computational states (not just correlate). A wall's states don't causally drive each other in the way logic gates do.
  2.  **Counterfactual Constraints:** The system must support the right counterfactuals (e.g., if the input had been different, the output would have been different). Putnam argues that with enough mapping ingenuity, you can satisfy these too, but defenders argue this makes the mapping non-natural or disjunctive.
  3.  **Input/Output Individuation:** Computation requires individuated inputs and outputs. A wall lacks the specific sensory-motor interfaces a brain has.

  **Do they succeed?** The consensus in the literature is mixed. The constraints succeed in ruling out *naive* mappings (like simple state-to-state correlation), but critics argue they push the problem back a level. To define "causal structure" or "counterfactual support" non-trivially often requires appealing to the very computational or intentional concepts one is trying to ground, risking circularity. For instance, distinguishing a "real" causal state from a "gerrymandered" one often relies on prior assumptions about what counts as a relevant physical similarity, which may implicitly presuppose the computational description. Thus, while the Triviality Argument doesn't refute computationalism outright, it forces proponents to provide a robust theory of **implementation** that is not merely interpretive.

  ### Distinction from Related Concepts
  *   **Underdetermination of Theory by Evidence:** That problem concerns data failing to distinguish between competing scientific theories. The Triviality Argument concerns the *interpretation relation* itself being unconstrained, making the theory compatible with *all* physical systems.
  *   **Conventionalism:** This isn't just about words; it's about whether the physical structure itself supports the computation independently of an observer's description.
  *   **Simplicity:** Appeals to simplicity (the brain mapping is simpler than the wall mapping) are often rejected as insufficient to ground the metaphysical claim of *real* implementation versus *ascribed* implementation.

  \answer{The Triviality Argument}
