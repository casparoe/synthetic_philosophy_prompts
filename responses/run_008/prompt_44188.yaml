answer: |-
  The 2000 presidential election remains the definitive case study for the fragility of American democracy, decided in Florida by a margin of 537 votes while Ralph Nader drew roughly 97,000 votes in the same state. In the weeks prior, websites like voteswap2000.com attempted to mitigate the spoiler effect by matching Nader supporters in swing states with Gore supporters in safe states, exchanging pledges to vote strategically for one another. California's Secretary of State threatened prosecution on October 30, 2000, characterizing the arrangement as vote-buying, prompting the sites to shut down before the Ninth Circuit Court of Appeals later ruled such threats violated the First Amendment. This episode offers a rare empirical stress test for the normative theories of voting, revealing where philosophical abstractions fracture against the mechanics of collective action.

  The civic duty view posits that voting is an obligation to exercise independent judgment for the common good. Under this framework, the swappers were arguably abdicating their duty; by casting a ballot for a candidate they might oppose based on a stranger's reciprocal pledge, they transformed a sovereign judgment into a coordinated transaction. The episode genuinely explains the discomfort many felt regarding the swaps: if the duty attaches to the content of the vote rather than the act of casting it, then voting for Gore while preferring Nader constitutes a failure of civic integrity. However, the theory is strained by the possibility that coordination *is* a form of judgment—that recognizing the systemic risk of a spoiler and acting to neutralize it is itself a duty to the common good. Ultimately, the episode weakens the civic duty theory by demonstrating that duty can be fragmented across agents, challenging the assumption that the voter and the judge must be the same individual.

  The expressive view, which treats voting as a declaration of allegiance rather than an instrument of outcome, appears initially vindicated by the swap. The arrangement allowed Floridians to secure a preferred outcome (Gore) while preserving national expression (Nader votes for funding and ballot access). Yet the existence of the swap quietly reveals the incompleteness of pure expressivism. If voting were solely about expression, a Nader supporter in a safe state would require no partner; they could vote their conscience without consequence. The fact that they sought a swap indicates that the national vote total held instrumental value beyond mere speech, suggesting that even expressive voters are covertly consequentialist. The episode confirms the expressive view only by showing that expression is rarely pursued in isolation from impact.

  The lesser-evil view argues that voters in competitive contexts are obligated to minimize harm, even at the cost of preference. The swap dissolves this dilemma elegantly, allowing participants to satisfy conscience and consequence simultaneously. However, the state's intervention suggests this solution is morally suspect, treating the arrangement as vote-selling rather than strategic voting. This raises the question of whether the swap dissolves the lesser-evil problem or merely launders it, allowing voters to avoid the moral residue of compromising their principles by anonymizing the act across two strangers. The episode confirms the functional utility of the lesser-evil calculus but highlights the ethical discomfort surrounding the avoidance of direct moral responsibility.

  The interactions between these theories become stark when examining the state's crackdown and the subsequent court ruling. When California officials threatened prosecution, they implicitly relied on a civic duty model where the vote is a non-alienable trust held by the citizen for the state; to trade it is to commodify a public function, hence the label "vote-buying." Conversely, the Ninth Circuit's framing of swaps as protected speech commits the law to the expressive view, prioritizing the communicative act over the transactional content. This legal oscillation reveals that the vote possesses an ontological instability: it is treated as a duty, a commodity, and a speech act depending on who is adjudicating its use.

  Despite their utility, none of the three theories addresses the technological mediation of the vote itself. The theories assume an individual moral agent relating to the state, but the swap introduced a binding contractual relationship between strangers facilitated by an algorithm. This shifts the ontology of voting from a solitary ritual to a distributed network of enforceable promises, a feature left unexplained by normative ethics that focus solely on intent or outcome. The 2000 experiment suggests that the future of voting ethics may lie less in why we vote than in how we coordinate the act itself.

