prompt: |-
  Bio major here, currently slogging through a political philosophy elective where we just did the Ayn Rand unit on altruism, and I keep wanting to run her argument through the vocabulary I actually think in. So here's the job: restate Rand's critique of altruism in evolutionary biology terms -- kin selection, inclusive fitness, Hamilton's rule, reciprocal altruism, costly signaling, the gene's-eye view -- as faithfully as you can, and then give me a residue report.

  To make sure the mapping is honest, a few things worth getting right. Rand isn't attacking "being nice to people" -- she explicitly allows helping people you value, and calls that not sacrifice but pursuing your own values. What she's attacking is roughly the Comte-style view that the standard of value is other people as such, so that giving up a greater value for a lesser one (or for a stranger) is morally praiseworthy. So the questions I want run through the biology: does a sterile worker ant count as Rand's nightmare or does it not even register, given she takes the organism's life as the standard of value while biology scores things by gene copies? Does the gene's-eye view -- where kin altruism looks like selfishness at a different level -- count as vindicating her, or is that an equivocation between "selfish" in the Dawkins sense and "selfish" in hers? Do reciprocal altruism and costly signaling collapse her altruism/egoism dichotomy entirely, since they're behaviors that look other-regarding but pay off for the actor over time? And where does the whole thing just fail to translate: her claim is normative (about what the standard of value *should* be), while fitness talk is descriptive, so I'd guess the moral core of her critique has literally no expression in my vocabulary -- but tell me if you think the residue points at something my framework is missing, or at something in her position that was never that clear to begin with.

  Don't sanitize the translation to protect either side -- if some of her points come out looking stronger in bio terms and others look incoherent, say so. Lead with your bottom line in the first sentence (basically: what does and doesn't survive), then the reasoning, no preamble and no restating my question back at me. American English please.
