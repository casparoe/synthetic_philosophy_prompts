answer: |-
  Rand's argument survives translation as a defense of individual-level fitness maximization against maladaptive sacrifice, but her normative core dissolves because biology validates the success of the very organismic self-destruction she condemns, leaving an unbridgeable gap between descriptive fitness and prescriptive value.

  **The Translation**

  In evolutionary terms, Rand's "rational selfishness" maps onto individual fitness maximization: behaviors that increase the actor's survival and reproductive output. Her specific target, "altruism," translates not to helping behavior per se, but to actions where the fitness cost to the actor exceeds the direct benefit to the actor ($C > B$) without satisfying Hamilton's rule ($rB > C$) or reciprocal expectations. When Rand distinguishes helping a loved one (selfish) from sacrificing for a stranger (altruistic), she is effectively distinguishing between kin selection/reciprocal altruism (which yield inclusive fitness returns) and true fitness deficits. Her claim that altruism is anti-life becomes the biological claim that systematic self-sacrifice without inclusive fitness payoff is an evolutionarily stable strategy only for the gene, not the organism.

  **The Residue Report**

  **1. The Sterile Worker Ant (Unit of Selection Conflict)**
  The sterile ant is the breaking point. For Rand, the organism is the standard of value; a sterile worker is a biological tragedy, a life forfeited for the collective, embodying the "altruist nightmare." For evolutionary biology, the ant is a success story; the gene is the standard of value, and the worker maximizes inclusive fitness by sacrificing individual reproduction. Rand's framework cannot accommodate this because she treats the organism as the terminal unit of value, whereas biology treats it as a vehicle. If you run Rand's ethics through the gene's-eye view, the sterile ant is "rational," but only by equivocation: the *gene* is selfish, the *organism* is altruistic. Rand forbids the organism from being the vehicle for the gene's selfishness if it costs the organism its life.

  **2. The "Selfish" Gene Equivocation**
  Dawkins' "selfish gene" does not vindicate Rand; it confuses levels of analysis. Rand's selfishness is psychological and volitional (conscious pursuit of values); Dawkins' selfishness is mechanistic (differential replication). Biology shows that "selfish" genes often build "altruistic" organisms. Rand argues that an organism *ought* to pursue its own life; biology shows that organisms are often built to sacrifice themselves. The vocabulary matches superficially, but the mechanism contradicts her ethical imperative. You cannot derive Rand's "ought" (live for yourself) from the gene's "is" (replicate at any cost to the vehicle).

  **3. Reciprocal Altruism and Costly Signaling**
  These concepts actually strengthen Rand's distinction between trade and sacrifice, even if they weaken her critique of helping behavior. Rand argues that helping friends is trade (value for value), not sacrifice. Reciprocal altruism and costly signaling confirm this: much of what looks like altruism is actually investment or status signaling that pays off in future fitness. Biology supports Rand's claim that pure sacrifice is rare and often misunderstood; however, biology also shows that when $rB > C$, sacrifice is adaptive. Rand rejects sacrifice even when it might benefit her "values" (which could include kin), whereas biology dictates sacrifice is mandatory when inclusive fitness demands it.

  **4. The Normative/Descriptive Gap**
  This is the largest residue. Rand's critique is normative: she claims altruism is *evil* because it violates the standard of value (life). Biology is descriptive: it claims altruism is *adaptive* because it violates the standard of individual survival (in favor of gene propagation). Biology has no vocabulary for "should," only "does." When Rand says, "Man must not sacrifice himself," biology replies, "Man is built to sacrifice himself when $rB > C$." Your framework explains the mechanism of the behavior she condemns, but it cannot register her condemnation. The residue is the concept of *conscious value* itself. Genes don't value; humans do. Rand's ethics rests on the premise that conscious valuation is the primary reality, while biology treats conscious valuation as a proximate mechanism for ultimate genetic ends. If the gene's end requires the conscious valuer to die, biology says "success," Rand says "failure," and there is no shared metric to resolve the dispute.
