answer: |-
  This is a fascinating docket. You are describing a board that is actively constructing a common law of restitution *ex nihilo*, balancing positivist legalism against moral imperatives. The tension you've identified—between "coercive context" and "encyclopedic retention"—is the central fault line in modern museum ethics.

  Per your instructions, I will begin by brainstorming the candidate decision rules implicit in the five prior cases before applying them to the new regalia case.

  ### Part 1: Brainstorming Candidate Decision Rules

  Based on the five decided cases, here are four competing jurisprudential frameworks the board could be operating under:

  1.  **The "Hierarchy of Harm" Rule:**
      *   *Logic:* Restitution is determined by the moral severity of the acquisition and the nature of the object.
      *   *Evidence:* Human remains (Case 1) and illicit excavations (Case 4) warrant unconditional return. Colonial violence (Case 3) warrants title transfer but allows possession retention. Legal permits/market buys (Case 2 & 5) warrant retention.
      *   *Implication:* The Regalia (colonial violence) should be treated like Case 3, regardless of the "war booty" legality.

  2.  **The "State Sovereignty" Procedural Rule:**
      *   *Logic:* The museum recognizes nation-states as the sole legitimate interlocutors for cultural property, with a narrow exception for human dignity.
      *   *Evidence:* Case 5 (diaspora refused, must go through state) and Case 3 (transfer to source state). Case 1 (remains) is the outlier exception for biological kinship.
      *   *Implication:* The Traditional Council (community) has no standing against the National Government (state). The museum deals with the Capital.

  3.  **The "Encyclopedic Stewardship" Rule:**
      *   *Logic:* The museum retains physical possession of any object that serves a critical educational or "world cultures" narrative function, provided legal title is defensible or a compromise is reached.
      *   *Evidence:* Case 2 (frieze stays for gallery) and Case 3 (objects stay on loan for joint gallery). Even when title is lost (Case 3), possession is kept.
      *   *Implication:* Physical return is almost never granted if the object is display-worthy.

  4.  **The "Positive Law" Rule:**
      *   *Logic:* Validity is determined by the law *at the time and place of acquisition*, unless it violates specific modern statutes (like patrimony laws in Case 4).
      *   *Evidence:* Case 2 (permit valid) and Case 5 (market buy valid). Case 3 is the anomaly here, suggesting "punitive expedition" overrides "law of the day."
      *   *Implication:* If the Regalia were lawful war booty in the 1900s, the museum could refuse (Case 2). But Case 3 suggests they view punitive expeditions as inherently coercive/void.

  ### Part 2: Analysis of the New Case

  **The Closest Analog:**
  **Case 3 (Royal Objects/Punitive Expedition)** is the strongest precedent. Both involve documented colonial seizures during military actions. In Case 3, the board established that "colonial punitive expedition" trumps "lawful at the time." Therefore, the board will likely reject the "lawful war booty" defense and acknowledge the claim's validity.

  **The Conflict:**
  The divergence lies in the *remedy*.
  *   **Case 3 Remedy:** Title transfer + Physical Retention (Loan) + Public Display.
  *   **New Claimant Demand:** Title transfer + Physical Return + **No Public Display** (Ritual Use).

  This creates a collision between **Case 3** (Encyclopedic Stewardship) and **Case 1** (Human Dignity/Community Autonomy). In Case 1, the museum allowed the community to dictate terms (reburial/private keeping) because they were human remains. They have not yet tested whether *sacred objects* afford the same ethical immunity as *ancestors*.

  ### Part 3: The Prediction (Consistency Check)

  If the board wants to be strictly consistent with its *object* jurisprudence (Cases 2, 3, 4, 5), they will decide as follows:

  **The Decision:**
  The board will **transfer title to the National Government** (satisfying Case 3 and Case 5's state-sovereignty rule) but **insist on the long-term loan arrangement** (satisfying Case 3's encyclopedic rule). They will likely reject the condition of "no public display."

  **The Reasoning:**
  1.  **Procedural Consistency:** Following Case 5, they will recognize the National Government, not the Traditional Council, as the legal claimant. The dispute between the Capital and the Traditional Council is an internal matter for the Source State.
  2.  **Mission Consistency:** Following Case 2 and 3, the board views public access as a core obligation. Allowing an object to disappear into ritual secrecy sets a precedent that undermines their "world cultures" mandate.
  3.  **The Compromise:** They will likely argue that the "jointly curated gallery" (from Case 3) can accommodate ritual sensitivity (e.g., restricted viewing times, specific handling), but they will not sign off on total non-display.

  **The Outcome:**
  A stalemate. The State accepts the title and the loan deal; the Traditional Council rejects it. The objects remain in the European museum, legally owned by the Source State, physically held by the European museum.

  ### Part 4: The Underdetermination (The Two Principles)

  However, as you noted, the precedents underdetermine this outcome. The board stands at a fork. Here is what each path signifies for your essay:

  **Option A: The "Ritual Integrity" Principle (Siding with the Traditional Council)**
  *   **The Choice:** The board grants unconditional physical return to the Traditional Council, waiving the loan-back and display requirements.
  *   **The Principle Adopted:** *Sacred objects functionally equate to human remains.* The board acknowledges that for some cultures, "preservation" equals "desecration," and that the right to practice religion (ritual use) trumps the public's right to view.
  *   **The Shift:** This elevates Case 1 (Remains) from a niche exception to a broader rule for sacred material. It effectively creates a "cultural dignity" veto over the encyclopedic mission.

  **Option B: The "Universal Stewardship" Principle (Siding with the National Museum/Board Status Quo)**
  *   **The Choice:** The board insists on the Case 3 model (Title to State, Objects on Loan, Public Display).
  *   **The Principle Adopted:** *Cultural heritage is a global public good.* Even if ownership is restituted, physical access must be maintained for the "benefit of humanity." The museum positions itself not as an owner, but as a permanent trustee for the global public, even against the wishes of the source community.
  *   **The Shift:** This hardens Case 2 and 3 into a doctrine that restitution is primarily symbolic (title) rather than material (possession).

  ### Part 5: The Hypothetical "Test Case" for Your Conclusion

  To end your essay, you need a case that strips away the compromises and forces the board to reveal which of the two principles above is its true north. The Regalia case is messy because it involves a dispute between a State and a Community. The *next* case should remove the State from the equation.

  **The Hypothetical Case:**
  > *A secret society from a Pacific Island nation claims a masked spirit figure held by the museum. The object was acquired in the 1920s from a colonial administrator (no bill of sale, no permit). The society demands its return on the condition that it be **destroyed** upon arrival, as per their tradition for spirits whose secrecy has been breached. The Source State's government supports the museum keeping it, citing its tourism value.*

  **Why This Exposes the Rule:**
  *   **If the Board Returns it for Destruction:** They have fully adopted the **Ritual Integrity Principle**. They acknowledge that the source community's ontological relationship with the object supersedes the museum's duty to preserve physical matter for the future. They are admitting that "museum ethics" are Western-specific, not universal.
  *   **If the Board Refuses:** They have fully adopted the **Universal Stewardship Principle**. They are admitting that their commitment to "preservation" is non-negotiable, even if it means perpetuating a spiritual harm to the source community. It reveals that their restitution program is ultimately about cleaning their own legal title, not empowering source communities.

  This hypothetical forces the board to answer: *Do you restitute to people, or do you restitute to history?* That is the sentence your essay should end on.
