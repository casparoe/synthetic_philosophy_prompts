      *   *Perception:* Not Duck-Rabbit, but perhaps *recognizing a face in a crowd* (requires context, builds up) or *putting on glasses* (clarifies blurred data).
      *   *Language:* Not total translation failure, but *semantic shift* within a shared grammar (like legal interpretation).
      *   *History of Science:* Lakatos (Research Programmes) or Shapere (Domains of Observation). Or simply the specific history of geophysics: *Instrumentation-driven theory change*. The "tool" model. The theory didn't just change the view; it changed what tools were built, which produced new data.
      *   *Best Fit:* **The "Tool/Instrument" Model or "Problem-Shift" (Lakatos).** Plate tectonics wasn't just seeing differently; it was *doing* differently. It opened new lines of inquiry (predicting ridge locations) that fixism couldn't.

