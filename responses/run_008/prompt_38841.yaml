      *   **User Persona:** Retired marine geophysicist, lived through the plate tectonics revolution (1960s), now studying philosophy of science (specifically Kuhn).
      *   **Context:** A reading group discussing Thomas Kuhn's *The Structure of Scientific Revolutions*. Younger colleagues are using the "Gestalt switch" (duck-rabbit) analogy to argue for strong incommensurability and irrationality/non-evidence-based consensus in the plate tectonics shift.
      *   **User's Intuition:** The user suspects the analogy is flawed based on their lived experience (magnetic stripes weren't ambiguous like a duck-rabbit, the change wasn't instant, colleagues could be "bilingual," there was shared argumentation).
      *   **Task:**
