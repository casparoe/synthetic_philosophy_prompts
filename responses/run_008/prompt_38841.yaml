      *   *The Two Readings:* The old paradigm (Fixism/Geosynclines) vs. the new paradigm (Plate Tectonics).
      *   *The Instant of Reversal:* The "Aha!" moment of conversion.
      *   *Unlearnability/Exclusivity:* You can't see both at once; the world changes.
      *   *The Perceiver:* The scientist undergoing the paradigm shift.

  3.  **Evaluate the Disanalogies (User's Points vs. Philosophy):**
      *   *Ambiguity:* Duck-rabbit is inherently ambiguous. Magnetic stripes were *anomalous* under the old view but *predictive* under the new. They didn't flip back and forth; they made sense one way and nonsense the other.
      *   *Bilingualism:* Kuhn suggests you can't see both. The user notes colleagues used both vocabularies. This suggests conceptual overlap, not total isolation.
