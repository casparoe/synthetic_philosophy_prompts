  Step (3) is the break. The "Lesser Harm Principle" assumes moral permissions function like a budget: if you can spend $100, you can spend $10. But rights aren't currency; they're categories. When the bomber lunges, he forfeits his right to life *specifically* to neutralize the immediate threat. Once cuffed, that forfeiture expires. He hasn't forfeited his right against cruel treatment. Killing in self-defense is justified by *stopping a threat*; torture is justified by *extracting information*. These are different moral jobs. You cannot swap the means just because one inflicts less physical damage. The permission to kill does not transfer to torture because the justification isn't about harm magnitude; it's about the specific right violated and the immediate necessity of the act. Consequently, the logic collapses.

  - "Why it fooled me"
  It works because it mimics arithmetic. We intuitively rank death above pain, so logically, permitting the greater should permit the lesser. It feels like common sense, like saying if you can lift 50 pounds, you can lift 10. But morality isn't physics. The argument hides a category error inside a comparison of severity. It tricks you into thinking the *reason* for the harm stays constant, when actually shifting from killing to torture shifts the goal from defense to coercion. Your brain accepts the math because it ignores the context. It is a seductive trap.

  - "The alternatives, priced"
  If you keep Step (3), you must accept Step (5). This means any lawful killing justifies torture. A cop shooting a fleeing arsonist could instead burn him to find accelerants. A soldier killing an enemy sniper could instead flay him for intel. This destroys the concept of human rights, reducing all bodily integrity to a calculable cost against utility. It makes your detective a pure utilitarian, viewing people as containers of pain rather than rights-bearers.
  If you reject Step (2) instead, you claim torture is worse than death, which is hard to defend physically but possible psychologically—arguing dignity outweighs life. If you reject Step (1), your detective is a pacifist who lets the bomb blow, ending your thriller.
  Rejecting (3) is the only viable path. The cost is admitting there is no clean logical justification for torture, even here. It remains a moral violation, but a necessary one. Your detective isn't right; she's just responsible. She carries the guilt of crossing a line that logic says she shouldn't have to, but morality says she did. By breaking (3), you acknowledge that some barriers exist precisely because they shouldn't be crossed, even when the math works.

  - "What my detective should do"
  Write her as someone who knows she's wrong, not someone who knows she's right. She shouldn't feel the cold clarity of logic; she should feel the heat of violation. She picks up the wires knowing this crosses a line she can't uncross. She isn't a hero saving the day; she's a guardian dirtying her hands so civilians don't have to. Show the physical revulsion. Have her hesitate not because she doubts the math, but because she doubts herself. Afterward, don't let her shrug it off. The bomb stops, but the moral injury remains. This makes her human, not a calculation engine. Your critique partner wants honesty: the honesty is that she is doing something terrible for a good reason, not that the terrible thing becomes good. She should articulate the difference. She can say, "I know I shouldn't do this," rather than, "I have to do this." The former admits the violation; the latter hides behind necessity. That is the story.
