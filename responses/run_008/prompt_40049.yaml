prompt: |-
  I'm a third-year PhD student in political philosophy, and my department runs a year-long working group in which two faculty members — a committed liberal nationalist and an uncompromising cosmopolitan — have spent two semesters arguing about whether compatriots have special claims on one another. They have finally agreed to attempt an adversarial collaboration, and I've been tasked with drafting the document. Please write the joint statement the two of them could both sign.

  Some context on where their dispute has gotten stuck, so the statement can be genuinely in the weeds rather than a bland restatement of the literature. The cosmopolitan holds that the arbitrariness of birthplace is on all fours with the arbitrariness of native talent — if luck-egalitarian reasoning constrains what people are entitled to claim on the basis of unchosen circumstances, national membership should be no exception. The nationalist's central move is institutionalist: the state is a coercively imposed cooperative scheme that demands sacrifice, compliance, and contribution, and only within such a scheme do duties of justice (as opposed to duties of humanitarian aid) arise. Over the year, three sub-disputes have crystallized out of this exchange, and I'd like the statement to treat each with real precision rather than lumping them together:

  First, the family analogy. The nationalist leans on the thought that unchosen associations can ground real obligations — we do not think a parent wrongs strangers by preferring her child — while the cosmopolitan insists the analogy fails because states, unlike families, involve administrative exclusion backed by force.

  Second, what I've privately started calling the levels problem, though they never use that term: if special obligations track shared coercive institutions, it is not obvious why the state is the right-sized unit. Rich regions within states, provinces, and even municipalities run cooperative schemes of their own; the nationalist owes us a principled stopping point, and the cosmopolitan has yet to show that the sliding argument stops at the globe rather than somewhere intermediate.

  Third, the practical crux: whether compatriot priority is defensible in immigration and refugee policy specifically, or whether whatever special obligations exist are fully consistent with open (or nearly open) borders — the nationalist wants to say compatriot claims justify exclusion, the cosmopolitan wants to say they justify at most redistribution.

  The deliverable should have three parts: a numbered section of claims both parties can sign, including about what they jointly take themselves to be disagreeing about and what they are not; a disagreements table in which each residual disagreement is phrased so that its own side would accept the wording; and, for each genuine crux, a concrete case, policy, or thought experiment both would agree bears on it, with each side's prediction recorded in advance. If any part of their dispute strikes you as verbal rather than substantive — I have begun to suspect the dispute over whether compatriot claims are claims of justice or of something else might be — please flag which part and why, and note how the collaboration should reword things so the parties are no longer trading blows on a question of labels. Please do not include a reading list; the two of them have read everything already.
reasoning: |-
  Here's a thinking process that leads to the suggested joint statement:

  1.  **Analyze the Request:**
      *   **User:** Third-year PhD student in political philosophy.
      *   **Task:** Draft a joint statement for an adversarial collaboration between two faculty members (Liberal Nationalist vs. Cosmopolitan).
      *   **Context:** Year-long working group, stuck on special claims of compatriots.
      *   **Key Positions:**
          *   *Cosmopolitan:* Birthplace is arbitrary (like talent); luck-egalitarianism applies; national membership shouldn't exempt one from global equality.
          *   *Nationalist:* Institutionalist; state is a coercive cooperative scheme; duties of justice arise *within* this scheme (vs. humanitarian aid outside).
      *   **Three Sub-Disputes to Address:**
          1.  *Family Analogy:* Unchosen associations (Nationalist) vs. Coercive exclusion (Cosmopolitan).
          2.  *Levels Problem:* Why the state? (Nationalist needs stopping point) vs. Why the globe? (Cosmopolitan needs to rule out intermediate units).
          3.  *Practical Crux:* Immigration/Refugees. Exclusion (Nationalist) vs. Redistribution/Open Borders (Cosmopolitan).
      *   **Deliverable Structure:**
          1.  Numbered section of joint claims (agreements + scope of disagreement).
          2.  Disagreements Table (phrased neutrally/acceptably to both).
          3.  Concrete Cases/Thought Experiments (with predicted outcomes for each side).
          4.  Verbal/Substantive Flag (identify if any dispute is merely semantic, specifically regarding "justice" vs. "something else").
      *   **Constraint:** No reading list (they've read everything). Tone should be "in the weeds" (technical, precise), not bland.

  2.  **Deconstruct the Philosophical Positions:**
      *   *Nationalist (likely Miller-style or similar):* Focus on ethical significance of national identity, reciprocity within institutions, trust required for redistribution. Key distinction: Justice (internal) vs. Humanity (external).
      *   *Cosmopolitan (likely Pogge-style or Luck-Egalitarian):* Focus on moral equality of individuals, arbitrariness of borders, global basic structure. Key distinction: Global Justice vs. Parochial Privilege.
      *   *The "Verbal" Suspicion:* The prompt hints that the dispute over whether compatriot claims are "justice" or "something else" might be verbal. This is a classic meta-ethical/semantic stalemate. If the Nationalist calls it "special justice" and the Cosmopolitan calls it "associative duty" but they agree on the *content* of the duty, it's verbal. However, usually, the *force* of the duty differs (trumping vs. non-trumping). I need to address this carefully.

  3.  **Drafting - Section 1: Joint Claims:**
      *   Need to establish common ground to show collaboration is possible.
      *   Agree on moral individualism (both are liberals).
      *   Agree that birthplace is morally arbitrary *in some sense*.
      *   Agree that states are coercive.
      *   Agree that *some* special obligations exist (even cosmopolitans usually admit some associative duties, just not justice-based ones that override global needs).
      *   Define the scope: We are disagreeing about the *weight* and *source* of these obligations relative to global claims.

  4.  **Drafting - Section 2: Disagreements Table:**
      *   Needs to be precise.
      *   *Dispute 1 (Family/Coercion):* Nationalist sees value in unchosen ties even without coercion; Cosmopolitan sees coercion as the trigger for *justice* specifically.
      *   *Dispute 2 (Levels):* Nationalist sees the state as the site of democratic will-formation/reciprocity; Cosmopolitan sees the state as an arbitrary slice of the global basic structure.
      *   *Dispute 3 (Immigration):* Nationalist sees right to exclude as necessary for self-determination/maintaining the scheme; Cosmopolitan sees right to exclude as violating global liberty/fair value of opportunity.

  5.  **Drafting - Section 3: Concrete Cases/Thought Experiments:**
      *   Need specific scenarios where predictions diverge.
      *   *Case 1 (Refugees):* High influx. Nationalist: Limit intake to preserve trust. Cosmopolitan: Open until marginal cost equals global benefit.
      *   *Case 2 (Regional Wealth):* Rich province vs. Poor province within same state. Nationalist: Full redistribution (same state). Cosmopolitan: If the province functions like a state coercively, why not treat it as the unit? Or conversely, if global, why stop at state?
      *   *Case 3 (Brain Drain):* Skilled workers leaving. Nationalist: Exit taxes/restrictions justified to protect cooperative scheme. Cosmopolitan: Violation of individual liberty/right to exit.

  6.  **Drafting - Section 4: The Verbal/Substantive Flag:**
      *   The prompt specifically asks to flag if the "justice vs. something else" dispute is verbal.
      *   *Analysis:* Often, Nationalists say "These are duties of justice." Cosmopolitans say "No, those are duties of humanity/associative ethics; Justice is global." If they agree on the *action* required (e.g., "We must prioritize compatriots up to point X"), but disagree on the *label*, it's verbal. However, usually, "Justice" implies enforceability and priority.
      *   *Recommendation:* Suggest rewording to focus on "Enforceable Priority Claims" rather than the label "Justice." This bypasses the definitional fight and gets to the normative weight.

  7.  **Refining the Tone:**
      *   Must sound like political philosophy (technical terms: *luck-egalitarian, coercive basic structure, associative duties, self-determination*).
      *   Must not favor one side.
      *   Must address the specific "stuck points" mentioned in the prompt (Family, Levels, Immigration).

  8.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I address the "Levels Problem" specifically? *Adjustment:* Ensure the disagreements table explicitly mentions sub-state units (regions/cities) vs. the state vs. the globe.
      *   *Check:* Is the Family Analogy handled precisely? *Adjustment:* Distinguish between "unchosen" and "coercive."
      *   *Check:* Is the "Verbal" flag clear? *Adjustment:* Make sure to explain *why* it's verbal (different definitions of justice leading to same or different practical outcomes) and offer the rewording.
      *   *Check:* Is the tone appropriate for a PhD student submitting to faculty? *Adjustment:* Formal, precise, respectful but analytically sharp.

  9.  **Final Polish:** Check against the prompt's specific constraints (three parts + verbal flag, no reading list). Ensure the "Joint Claims" section clearly delineates what is *not* in dispute (e.g., basic human rights).

  *(Self-Correction on the Verbal Dispute)*: I need to be careful. If the Nationalist says "Justice requires X" and Cosmopolitan says "Humanity requires X," but they disagree on whether X can be *coercively enforced* domestically, it's substantive. If they agree on enforcement but argue over the word "Justice," it's verbal. The prompt suggests the user suspects it *might* be verbal. I will argue it is *partially* verbal regarding the label, but substantive regarding the *priority rule*. I will suggest focusing on "Priority Rules" to cut through the semantics.

  *(Refining the Levels Problem)*: The Nationalist needs a stopping point. The Cosmopolitan needs to show why the globe is the unit. I should frame the disagreement as "The Site of Democratic Reciprocity" (Nat) vs. "The Scope of Causal Impact/Coercion" (Cosmo).

  *(Refining the Immigration Crux)*: Make sure to distinguish between "refugees" (asylum) and "economic migrants" if necessary, but the prompt focuses on "immigration and refugee policy" generally. I'll focus on the *right to exclude*.

