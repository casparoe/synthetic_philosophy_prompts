answer: |-
  **JOINT STATEMENT OF ADVERSARIAL COLLABORATION**
  **Working Group on Special Obligations and Border Justice**
  **Signatories:** [Faculty Name A] (Liberal Nationalist) & [Faculty Name B] (Cosmopolitan)
  **Drafted By:** [Your Name]

  ### I. Joint Commitments and Scope of Disagreement

  We, the undersigned, affirm the following propositions as the shared foundation of our inquiry. We agree that our disagreement is not about the moral status of individuals *per se*, but about the mediating institutions that translate moral status into enforceable claims.

  1.  **Moral Individualism:** We agree that ultimate units of moral concern are individuals, not states or nations. Any special claim made on behalf of a collective must be justifiable by reference to the interests or agency of the individuals composing it.
  2.  **The Arbitrariness of Birth:** We agree that birthplace is morally arbitrary in the sense that no individual deserves the initial advantages or disadvantages conferred by their jurisdiction of origin. We disagree, however, on whether remedying this arbitrariness requires global equality of opportunity or merely a sufficientarian threshold guaranteed by *some* state.
  3.  **Coercion and Institutions:** We agree that the state is a coercive institution that distinguishes itself from voluntary associations. We disagree on whether this coercive nature is the *source* of special duties of justice (Nationalist view) or merely the *mechanism* through which global duties are currently (and unjustly) mediated (Cosmopolitan view).
  4.  **Humanitarian Baseline:** We agree that all persons, regardless of nationality, possess basic human rights that generate negative duties of non-harm and positive duties of rescue in extremis. Our dispute concerns "special obligations" *above* this humanitarian baseline.
  5.  **The Nature of the Dispute:** We acknowledge that a portion of our exchange has turned on the labeling of compatriot priorities as "justice" versus "associative ethics." We agree to treat this as a substantive disagreement about *enforceability and priority* rather than a semantic dispute over definitions (see Section IV).

  ### II. Table of Residual Disagreements

  The following table isolates the three crystallized sub-disputes. Each statement is phrased to be acceptable to the proponent of that view while accurately reflecting the opponent's objection.

  | Domain | Liberal Nationalist Position | Cosmopolitan Position |
  | :--- | :--- | :--- |
  | **1. The Family Analogy & Coercion** | **Claim:** Unchosen associative ties (like family) can ground priority claims without coercion; the state is analogous insofar as it constitutes a shared ethical life.<br>**Objection to Opponent:** The Cosmopolitan erroneously reduces all political obligation to coercive liability, ignoring the value of trust and solidarity generated by unchosen membership. | **Claim:** The family analogy fails because state membership involves administrative exclusion backed by force, which families do not impose on outsiders.<br>**Objection to Opponent:** The Nationalist conflates *ethical* preferences (which are permissible) with *justice* claims (which must be impartial); coercion triggers impartiality requirements that family ties do not. |
  | **2. The Levels Problem (Unit of Analysis)** | **Claim:** The nation-state is the unique site of democratic will-formation and reciprocal redistribution; sub-state units lack the sovereignty to sustain justice, and global units lack the solidarity.<br>**Objection to Opponent:** The Cosmopolitan cannot identify a functional global basic structure capable of sustaining the specific duties of democratic reciprocity required for justice. | **Claim:** If coercion grounds justice, the "basic structure" exists wherever coercive rules apply, including sub-state regions or the global trade regime; stopping at the border is arbitrary.<br>**Objection to Opponent:** The Nationalist offers no principled reason why a wealthy province's coercive scheme does not generate internal justice claims distinct from the poorer provinces it subsidizes. |
  | **3. Immigration & Exclusion** | **Claim:** A political community has a right to exclude non-members to preserve the integrity of its cooperative scheme and the trust required for domestic redistribution.<br>**Objection to Opponent:** Open borders would dissolve the specific community that generates the special obligations the Cosmopolitan claims to respect. | **Claim:** Special obligations to compatriots justify internal redistribution but cannot trump the liberty rights of outsiders to move or the global duty to remedy arbitrary disadvantage.<br>**Objection to Opponent:** Prioritizing compatriots via exclusion perpetuates the very luck-based inequality the Nationalist claims to merely moderate. |

  ### III. Adjudicating Cases: Predictions and Thought Experiments

  To move beyond abstract principle, we identify three concrete scenarios where our theories generate divergent policy prescriptions. We record our predictions here to allow for future empirical or normative testing.

  **Case A: The "Rich Region" Secession Scenario**
  *Scenario:* A wealthy province within a state (e.g., Catalonia, Northern Italy) threatens secession to avoid subsidizing poorer regions within the same state, arguing it constitutes a distinct "coercive cooperative scheme."
  *   **Nationalist Prediction:** The central state is justified in using coercive means to prevent secession or enforce fiscal transfer. The *state-wide* scheme is the locus of justice, not the regional one, because the state holds the monopoly on legitimate violence and democratic citizenship.
  *   **Cosmopolitan Prediction:** If the region functions as a distinct economic zone with its own coercive rules, the Nationalist owes an explanation of why *state* borders matter more than *regional* borders. If the argument is purely about solidarity, it is not a claim of justice. The Cosmopolitan remains agnostic on secession but insists the global poor have a stronger claim on the wealthy region's surplus than the compatriot poor do.

  **Case B: The "Climate Refugee" Threshold**
  *Scenario:* A neighboring state collapses due to climate change, sending 5% of its population to our border annually. Absorbing them would require reducing domestic welfare benefits by 10%.
  *   **Nationalist Prediction:** Exclusion is permissible (or limits should be set) once the influx threatens the stability of the domestic redistributive scheme. The duty to compatriots (maintaining the scheme) outweighs the duty to admit outsiders beyond a humanitarian minimum.
  *   **Cosmopolitan Prediction:** Exclusion is impermissible. The 10% reduction in domestic welfare is a cost that must be borne to remedy the arbitrary disadvantage of birthplace. The "stability of the scheme" cannot justify perpetuating global inequality.

  **Case C: The "Brain Drain" Tax**
  *Scenario:* Skilled professionals trained at public expense seek to emigrate to a richer state. The home state considers an exit tax or service requirement.
  *   **Nationalist Prediction:** Such restrictions are justified. The cooperative scheme invested in these individuals; reciprocity demands they contribute to the maintenance of the scheme before exiting.
  *   **Cosmopolitan Prediction:** Such restrictions are a violation of basic liberty rights. While the state may have a claim for reimbursement, it cannot restrict movement. The global market for labor should determine allocation, not local reciprocity.

  ### IV. Meta-Philosophical Flag: The "Justice" Label

  **Diagnosis:**
  We identify a significant portion of our dispute over whether compatriot claims are claims of *justice* versus claims of *associative ethics* as **verbally mediated but substantively grounded**.

  *   **The Verbal Component:** We have often talked past one another because the Nationalist defines "justice" as *whatever duties are enforceable within a polity*, while the Cosmopolitan defines "justice" as *whatever duties are owed to persons qua persons*. Under the Nationalist definition, compatriot priority is trivially "justice." Under the Cosmopolitan definition, it is trivially "partiality."
  *   **The Substantive Component:** Beneath the labeling dispute lies a genuine disagreement about **Priority Rules**. Both sides agree we have duties to compatriots and duties to humanity. The substantive fight is about *lexical ordering*.
      *   The Nationalist holds that compatriot claims can *trump* global efficiency or equality claims in certain contexts (e.g., immigration caps).
      *   The Cosmopolitan holds that compatriot claims are *weighted* but cannot trump basic global liberty or sufficientarian claims.

  **Recommendation for Collaboration:**
  Going forward, we agree to suspend the use of the term "justice" when referring to special compatriot obligations. Instead, we will use the phrase **"Enforceable Priority Claims" (EPCs)**.
  *   *Question to be answered:* Under what conditions does an EPC to a compatriot override an EPC to a stranger?
  *   *Benefit:* This rewording prevents the Nationalist from smuggling in enforceability via the definition of justice, and prevents the Cosmopolitan from dismissing special obligations as merely "charitable." It forces us to argue directly about the *weight* of the obligation rather than its *category*.

