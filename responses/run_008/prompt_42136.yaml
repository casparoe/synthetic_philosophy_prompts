answer: |-
  Here is a complete lesson plan designed for your 90-minute session. It uses a coordination game with private signals to simulate the tension between local optimization (updating on evidence) and policy optimization (acting ex-ante).

  # Lesson Plan: The Twin Signal Protocol

  **Goal:** Demonstrate that maximizing expected utility *conditional on your current observation* can yield lower returns than maximizing expected utility *over a policy chosen before the observation*.
  **Class Size:** 16 Students (8 Pairs).
  **Materials:**
  *   16 "Role Envelopes" (Round 1).
  *   16 "Strategy Sheets" + 16 "Sealing Envelopes" (Round 2).
  *   16 Signal Cards (Sun/Rain).
  *   Projector for Payoff Tables.
  *   Small snacks/tokens for payoffs (e.g., 1 point = 1 chocolate coin).

  ---

  ## 1. The Scenario (5 Minutes)
  **Story:** "You are part of a deep-space exploration team. For safety, you operate in 'Twins'—pairs of agents who must coordinate actions to keep the ship stable. You are separated from your Twin and cannot communicate. Nature assigns each of you a private environmental signal: **Sun** or **Rain** (50/50 chance, independent of your Twin)."

  **The Task:** "You must press either Button **A** or Button **B**."

  **The Payoff Structure (Project this):**
  1.  **Coordination Bonus:** If you and your Twin press the *same* button (A/A or B/B), you each get **30 points**. If you mismatch, **0 points**.
  2.  **Signal Bonus:** You get an extra **15 points** if your button *matches* your signal.
      *   If Signal = **Sun**, Button **A** gives the bonus.
      *   If Signal = **Rain**, Button **B** gives the bonus.

  **Total Payoff = Coordination (0 or 30) + Signal Bonus (0 or 15).**

  ---

  ## 2. Round 1: Informed Action (25 Minutes)
  **Procedure:**
  1.  Hand out Role Envelopes. Inside is a Signal Card (Sun or Rain) and a Decision Slip.
  2.  **Instruction:** "Look at your signal. You know your signal, but you do *not* know your Twin's signal or action. Choose A or B to maximize your points."
  3.  Collect Decision Slips.
  4.  **Pairing:** Randomly pair the students (pre-assigned numbers work best). Reveal the pairs.
  5.  **Scoring:** Calculate scores based on the matrix.

  **Predicted Outcome:**
  *   Most students will reason: "If I see Sun, A gives me 15 bonus points. B gives 0. My action doesn't causally change my Twin's action. So I should take the bonus."
  *   **Result:** Almost everyone plays "Match Signal" (Sun→A, Rain→B).
  *   **Aggregate Score:** Since signals are independent, Twins match only 50% of the time.
      *   Expected Value per student: (50% × 30) + (100% × 15) = **30 points**.
  *   **Feel:** Students feel they made the "obviously rational" choice given their information.

  ---

  ## 3. The Gap & Setup for Round 2 (10 Minutes)
  1.  Reveal the class average score (approx. 30).
  2.  Ask: "Is there a way the *pair* could have done better?"
  3.  Guide them to see: "If you both ignored the signal and just pressed A, you'd always coordinate (30 pts) and get the bonus half the time (7.5 pts). Total **37.5 points**."
  4.  **The Tension:** "In Round 1, pressing A when you saw Rain felt irrational (leaving 15 points on the table). But if *both* of you had committed to ignoring the signal, you'd be richer."
  5.  **Round 2 Instruction:** "We run the game again. But this time, **before** you receive your Signal Card, you must submit a **Strategy Sheet**. It must say: *'If Sun, I press __. If Rain, I press __.'*"
  6.  **Crucial Rule:** "You seal this sheet in an envelope. I collect them. *Then* I hand out the Signal Cards. You must act according to the sealed sheet. No changing your mind after seeing the card."

  ---

  ## 4. Round 2: Policy Selection (20 Minutes)
  **Procedure:**
  1.  Distribute Strategy Sheets. Students fill them out.
  2.  Collect Sealed Envelopes.
  3.  Distribute Signal Cards (new random draw).
  4.  Students reveal actions based on their sheet.
  5.  Score and Compare.

  **Predicted Outcome:**
  *   Many (hopefully) will write "If Sun: A, If Rain: A" (or both B).
  *   **Result:** Coordination is 100%.
  *   **Aggregate Score:** (100% × 30) + (50% × 15) = **37.5 points**.
  *   **Comparison:** Round 2 average should be visibly higher than Round 1.

  ---

  ## 5. Debrief & Theory Mapping (30 Minutes)
  *Do not use jargon until this section.*

  **Step 1: The "Observation" Trap (10 mins)**
  *   Ask Round 1 players: "When you saw Rain, why did you press B?"
  *   Answer: "Because B was better *given* I saw Rain."
  *   **Formal Map:** This is **Conditional Expected Utility**. You treated the observation (Rain) as fixed information about the world and optimized for *that* branch of reality.
  *   **The Problem:** Your observation (Rain) was *evidence* about your bonus, but it was not *causally linked* to your Twin's action. By reacting to the evidence, you broke the correlation needed for the Coordination Bonus.

  **Step 2: The "Policy" Move (10 mins)**
  *   Ask Round 2 players: "When you wrote the sheet, did you know your signal?"
  *   Answer: "No."
  *   **Formal Map:** This is **Policy Selection** (or Updateless Decision Theory). You chose a function $f(Observation) \to Action$ *before* updating on $Observation$.
  *   **Key Distinction:** In Round 1, you asked: "What is best *now* that I know I'm in the Rain branch?" In Round 2, you asked: "What rule yields the best result across *both* Sun and Rain branches, weighted by their probability?"
  *   **The Updateless Insight:** Sometimes, the information you receive (Rain) is "bad news" for your coordination if you let it change your plan. A rational agent prices in the value of consistency *before* seeing the card.

  **Step 3: Addressing the "Cheat" (5 mins)**
  *   Ask: "In Round 2, if you got Rain and your sheet said A, did you *want* to switch to B?"
  *   Answer: "Yes."
  *   **Point:** This feeling is the **Time Inconsistency**. Your "Ex-Ante Self" (who wants 37.5 pts) and your "Ex-Post Self" (who sees Rain and wants the bonus) have different preferences. Rationality requires the Ex-Ante Self to bind the Ex-Post Self.

  **Step 4: Jargon Reveal (5 mins)**
  *   Reveal terms: **Evidential Decision Theory** (Round 1 logic), **Causal Decision Theory** (similar here), **Updateless Decision Theory / Policy Selection** (Round 2 logic).
  *   Connect to Newcomb: "In Newcomb's Problem, the Box contents are fixed based on what you *would* do. Here, the Twin's coordination is fixed based on what you *committed* to do. The math is the same: don't let the observation drive the car if the observation is correlated with the payoff structure."

  ---

  ## 6. Predictable Pitfalls & Fixes

  | Pitfall | Why it happens | Fix |
  | :--- | :--- | :--- |
  | **Communication** | Students try to whisper to find their Twin. | Explicitly forbid talk. Seat them far apart. Collect phones. |
  | **"I'll Lie on the Sheet"** | In Round 2, students write "Always A" but plan to play B if they see Rain. | **Crucial:** Collect the sheets *before* handing out Signal Cards. Tell them: "I will check for consistency. Inconsistency = 0 points." Make the binding physical. |
  | **Confusion on Payoffs** | They don't understand the "Independent Signal" math. | Walk through one example pair on the board *before* Round 1 starts. (e.g., "If you are Sun/Twin is Rain...") |
  | **Low Round 2 Adoption** | They don't trust others to commit to "Always A". | In the debrief, acknowledge this. "If you think your Twin will defect, you should too." This leads to a discussion on **Common Knowledge of Rationality**. |

  ---

  ## 7. Honest Limitations (For your preparation)
  *You asked what the game cannot reproduce.*

  1.  **Counterfactual Suffering:** In the game, if I commit to "Always A" and get "Rain," I lose the 15-point bonus. I feel that loss. In true Updateless Decision Theory (UDT), the agent cares about the utility in the counterfactual world (where I got Sun) *even though I am not there*. Humans cannot emotionally value a world they don't inhabit. The game fakes this by using *pairs* to simulate the "other self." You must explain in the debrief: *"Your Twin represented your possible self in the other branch of the probability tree."*
  2.  **Logical vs. Causal Correlation:** In this game, the correlation is causal/social (we are a team). In Newcomb/UDT, the correlation is logical (the Predictor simulates you). The game demonstrates the *benefit* of policy selection, but not the *metaphysical* mechanism of logical correlation.
  3.  **Binding:** In the game, I (the instructor) enforce the policy. In real life, you cannot physically bind your future self. You can only rely on your own rationality to follow through. The game solves the "commitment problem" externally; UDT solves it internally.

  ---

  ## 8. The Free Will Derailment Warning
  **Where it happens:** During Round 2 instructions. A student will ask: *"But if I write 'Always A', and then I see Rain, isn't it my free will to change my mind? Why should my past self dictate to my present self?"*

  **How to handle it (2 minutes max):**
  1.  **Acknowledge:** "That is a deep philosophical question about personal identity over time."
  2.  **Bracket:** "For this experiment, we are treating 'You at 2:00 PM' and 'You at 2:15 PM' as agents with the same goal but different information. We are testing which *information structure* yields higher points."
  3.  **Redirect:** "If you change your mind, you aren't testing the decision theory; you're testing your willpower. Please play the 'Program' you wrote on the sheet. If you can't trust yourself, that's a finding, but let's assume perfect compliance for the math."
  4.  **Move On:** Do not engage in determinism debates. Keep the focus on **Payoff Maximization**.

  ---

  ## 9. Timeline Summary (90 Minutes)
  *   **00-05:** Intro & Story.
  *   **05-10:** Payoff Explanation & Example.
  *   **10-30:** Round 1 (Play, Collect, Score).
  *   **30-40:** Reveal Round 1 Sub-optimality.
  *   **40-45:** Round 2 Instructions (Emphasize Sealing).
  *   **45-65:** Round 2 (Write, Collect, Distribute Signals, Play, Score).
  *   **65-90:** Debrief (Map to Theory, Limitations, Q&A).

  This plan keeps the "Updateless" concept visceral. They will *feel* the regret in Round 1 and the security in Round 2, making the formal distinction in the debrief land much harder.
