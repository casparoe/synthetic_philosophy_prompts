                  *   So "Follow Signal" is the Nash Equilibrium in Round 1.
                  *   But "Ignore Signal" (Policy) yields 25.
                  *   *Perfect.* This creates the gap. Round 1 converges to Nash (20). Round 2 allows Policy (25).

      *   *Wait, one nuance:* In Round 1, do they know they are paired? Yes. Do they know who their partner is? No, anonymous.
      *   *Materials:* Need to ensure random assignment of Signals is independent between pairs.
      *   *Debrief:* Connect "Signal" to "Evidence." Connect "Policy Sheet" to "Decision Function."

      *   *Free Will Derailment:* The moment they get the sheet in Round 2, they will ask "Can I lie?"
      *   *Handling:* "The grade depends on the sheet. If you lie, you are testing the honesty module, not the decision module. For the sake of the experiment, assume the sheet is binding."

      *   *Limitations:* The game makes the correlation *causal* (you are a team). UDT is often about *logical* correlation. I need to be honest about this. The game demonstrates "Rule Consequentialism" or "Commitment" more than pure "Logical Updatelessness," but the math is isomorphic. I will note this.

      *   *Wait, one more check:* "Updateless" specifically refers to not updating on observations that are logically correlated with the outcome. In this game, the Signal is *not* correlated with the Twin's Signal. It's independent. The correlation is in the *Payoff Structure* (Matching).
      *   *Is this Updatelessness?* It's "Precommitment."
      *   *Does it fit the prompt?* "Deciding as if choosing a policy for all your possible selves before you know which observation you'll end up with."
      *   *Yes.* The "Possible Selves" are "Me if Sun" and "Me if Rain." The Policy chooses for both. The Local Choice chooses for one.
      *   *This fits.*

      *   *Let's finalize the Payoff Numbers to be integers.*
      *   Match: 30. Mismatch: 0.
      *   Bonus: 15.
      *   Policy "Always Yes": Match (30) + Bonus (50% of 15 = 7.5) = 37.5.
      *   Policy "Follow Signal": Match (50% of 30 = 15) + Bonus (15) = 30.
      *   Gap is clear.

      *   *Wait, I need to make sure the "Local" choice in Round 1 actually leads to "Follow Signal".*
      *   *If I think Twin follows Signal:*
