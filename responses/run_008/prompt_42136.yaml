          *   Twin Sun (50%): Twin Yes. I Yes -> 30+15=45. I No -> 0.
          *   Twin Rain (50%): Twin No. I Yes -> 0+15=15. I No -> 30.
          *   Exp(Yes) = 0.5*45 + 0.5*15 = 30.
          *   Exp(No) = 0.5*0 + 0.5*30 = 15.
          *   Yes is dominant.
      *   *So Round 1 naturally converges to "Follow Signal".*
      *   *Round 2 allows "Always Yes".*
      *   *This works.*

