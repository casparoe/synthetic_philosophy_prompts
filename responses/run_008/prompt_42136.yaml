  2.  **Deconstruct the Core Concept (Updatelessness):**
      *   *Standard Causal Decision Theory (CDT)/Evidential Decision Theory (EDT):* You observe $O$, update beliefs $P(World|O)$, maximize expected utility given $O$.
      *   *Updateless/Policy Selection:* You choose a function $f(O) \to Action$ *before* observing $O$. You maximize expected utility over the prior distribution of $O$ and $World$.
      *   *The Tension:* Sometimes, the action that maximizes utility *given* $O$ is different from the action prescribed by the optimal policy *ex-ante*. This usually happens when your observation $O$ is correlated with the state of the world in a way that isn't caused by your action, but your action influences the payoff structure based on that correlation (similar to Newcomb, but needs to feel different).
      *   *Key Mechanism:* Correlation between "Type/Role" and "Payoff Structure" or "Other Players' Types."
      *   *Challenge:* In a one-shot classroom game, students *are* in one specific role. They don't actually experience the counterfactual world where they had the other observation. The "benefit" of the policy is aggregate across the class, not necessarily individual (unless we use a mechanism where everyone shares the pot or roles are randomized per student across hypotheticals).
      *   *Solution:* Use a "Team/Group" payoff structure or a "Role Randomization" where the *class* outcome depends on the aggregate success of the policy, even if individuals feel regret. Or, better yet, a game where the payoff depends on *consistency* across types.
      *   *Idea:* The "Two-Door Guard" or "The Color-Coded Room." Let's try to make it about coordination with *yourself* across possible states.
