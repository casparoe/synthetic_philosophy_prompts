answer: |-
  This is a classic and high-quality disagreement. You and your friend have effectively reconstructed a significant portion of the debate surrounding Derek Parfit's *Reasons and Persons* (specifically Part 1, "Self-Defeating Theories") and the broader tension between Act-Consequentialism and Disposition-Consequentialism in rational choice theory.

  Neither of you was arguing in bad faith; you were operating from different levels of abstraction. Your friend was arguing from the perspective of **Standard Rational Choice Theory (RCT)** and **Sophisticated Choice**, while you were arguing from the perspective of **Parfit's Critique** and **Indirect Consequentialism**.

  Here is the round-by-round adjudication, followed by an analysis of the substantive/verbal dispute and what was missing from the conversation.

  ### Part 1: Round-by-Round Adjudication

  **Round 1: Friend's Opening (Enforcement & Institutions)**
  *   **Argument:** The case is trivial; it just shows promises need sanctions. In the real world (police, reputation), rational agents do fine.
  *   **Adjudication:** **Friend is partially right on realism, but wrong on methodology.**
      *   *Degree:* 30% Right.
      *   *Reasoning:* Your friend is correct that in the "real world," institutions solve this. However, they miss the purpose of a philosophical thought experiment. The goal of Parfit's case is not to describe the world as it is, but to test the *definition* of rationality in isolation. If a theory of rationality only works when propped up by external threats, it may not be a theory of rationality at all, but a theory of prudence under threat. Dismissing the case because it lacks institutions is like dismissing a physics frictionless-plane model because there is no such thing as a frictionless plane. It isolates the variable (rationality) to see if it holds.

  **Round 2: Your Reply (Self-Defeating Rationality)**
  *   **Argument:** The hitchhiker who does best is disposed to pay even when it hurts. Rationality seems to require making yourself act against immediate self-interest. This embarrasses act-based theories.
  *   **Adjudication:** **You are right on the theoretical stakes.**
      *   *Degree:* 90% Right.
      *   *Reasoning:* You correctly identified Parfit's core claim: Standard RCT (which evaluates acts by their consequences at the time of the act) is *self-defeating*. It tells the agent to be the sort of person who doesn't pay (because paying is costly ex post), but being that sort of person ensures they never get picked up (bad outcome ex ante). You correctly saw that the agent who maximizes utility is the one who *ignores* the standard rational calculation at the moment of payment.

  **Round 3: Friend's Response (Commitment Devices)**
  *   **Argument:** This is just a commitment device (Ulysses and the Sirens). Binding yourself is rational; the act flowing from it is rational. Calling it "irrational" is provocative.
  *   **Adjudication:** **Friend is conceptually close but technically mistaken.**
      *   *Degree:* 50% Right.
      *   *Reasoning:* Your friend is describing **Sophisticated Choice** (associated with Edward McClennen). This view says a rational agent plans over their whole life, not time-slices. However, they miss a crucial constraint in Parfit's case: **There is no mast.** In the Ulysses case, there is an external constraint (ropes). In the Hitchhiker case, once in the city, the hitchhiker is free. There is no physical or institutional barrier to non-payment, only their own psychology. If the "commitment" is just a mental disposition, we are back to your point: the *act* of paying is still costly. Calling it "rational" requires redefining rationality from "maximizing utility at time T" to "fulfilling a plan made at time T-1."

  **Round 4: Your Pushback (Act-vs-Disposition)**
  *   **Argument:** Dispositions cash out in acts. At the bank, paying is costly. If the theory calls that act irrational, it's contradictory. If it calls it rational, it's not evaluating acts by consequences.
  *   **Adjudication:** **You are theoretically precise.**
      *   *Degree:* 95% Right.
      *   *Reasoning:* This is the strongest point in the debate. You forced the dilemma: Either the theory condemns the act that secures the good outcome (self-defeating), or it stops evaluating acts based on their actual consequences (abandoning Act-Consequentialism). You correctly identified that a disposition is useless if it doesn't issue in the specific act when the chips are down. If the hitchhiker has a "paying disposition" but calculates at the bank and decides not to pay, the disposition was fake. Therefore, the theory must endorse the *act* of paying, even though it is locally sub-optimal.

  **Round 5: Friend's Rejoinder (Time-Slices & Stripped World)**
  *   **Argument:** Theory advises *ex ante*. Grading *ex post* is wrong. Also, stripping away reputation/emotions deletes what makes choice possible.
  *   **Adjudication:** **Friend is right on *ex ante* evaluation, wrong on idealization.**
      *   *Degree:* 60% Right.
      *   *Reasoning:* The *ex ante* defense is the standard rebuttal to Parfit. It says rationality is about choosing the best *policy*, not the best *move*. If you accept this, the contradiction vanishes. However, their second point (that the stripped world is invalid) is weak. Idealization is necessary to find universal principles. If rationality depends on reputation, it isn't a property of the agent, but of the agent's environment. Parfit wants to know if rationality is intrinsic to the agent.

  ### Part 2: Substantive Thesis or Verbal Dispute?

  You asked whether the claim "it can be rational to cause oneself to be irrational" is substantive or merely a verbal dispute about the locus of evaluation (acts vs. dispositions vs. lives).

  **It is a substantive thesis that manifests as a verbal dispute.**

  Here is why:

  1.  **The Verbal Layer:** On the surface, it is a definitional argument.
      *   If you define **Rationality** as "maximizing expected utility at the moment of choice" (Act-Rationality), then paying the driver is **Irrational**.
      *   If you define **Rationality** as "maximizing expected utility over the life of the agent" (Global-Rationality), then paying the driver is **Rational**.
      *   If the debate stops here, it is purely verbal. You are just arguing about which time-slice gets to define the word "rational."

  2.  **The Substantive Layer:** The dispute becomes substantive because Standard Rational Choice Theory claims to be **instrumental**. It claims to be the best tool for getting what you want.
      *   Parfit's charge is that Act-Rationality fails by *its own standard*. It aims to maximize utility, but if you follow it, you get less utility (you die in the desert).
      *   Therefore, the claim is substantive: **The standard definition of rationality is functionally broken.** It recommends a strategy (always maximize locally) that leads to worse outcomes than a competing strategy (be disposed to cooperate).
      *   If you stick with Act-Rationality, you must admit that **Rationality is Self-Defeating**. This is a substantive claim about the world, not just words. It means the thing we value most in decision-making (rationality) actively prevents us from achieving what we value most (well-being).

  **Verdict:** It is not *just* a verbal dispute. If it were, we could just agree to call the disposition "rational" and move on. But doing so requires abandoning the core axiom of Standard RCT (that the rational act is the one with the best causal consequences *at that moment*). Abandoning that axiom changes how we model economics, game theory, and ethics. That is a substantive shift.

  ### Part 3: What Both of You Were Missing

  While your debate was high-level, there were three conceptual tools missing that would have dissolved the tension or clarified the stakes further.

  **1. Causal vs. Evidential Decision Theory (CDT vs. EDT)**
  Your friend treated the driver as a reactive agent, but Parfit's Hitchhiker is structurally identical to **Newcomb's Problem**. The driver is a *predictor*.
  *   **CDT (Your Friend's view):** My act of paying cannot causally change the past (the driver picking me up). Therefore, I should not pay.
  *   **EDT (Your view):** My act of paying is *evidence* that I am the kind of person who gets picked up. Therefore, I should pay.
  *   **Missing Insight:** The debate isn't just about time-slices; it's about whether rational agents should care about the *news* their acts bring (EDT) or only the *causal impact* of their acts (CDT). Most modern decision theorists side with your friend (CDT), but admit it loses in Newcomb/Parfit cases. This admits Parfit's point: CDT is self-defeating in predictor-rich environments.

  **2. Transparency and Legibility**
  You both assumed the hitchhiker can simply "choose a disposition."
  *   **Missing Insight:** The disposition must be **legible** to the driver. If the driver cannot distinguish a "rational maximizer" from a "cooperator," the case collapses.
  *   This adds a layer: Rationality might require cultivating *emotions* (like gratitude or honor) that are hard to fake. Your friend mentioned emotions but dismissed them as "real world" clutter. In fact, Parfit argues these emotions are the *mechanism* of rationality. We need to be biologically/psychologically incapable of defecting to solve the game. This moves the debate from "choice" to "evolutionary psychology."

  **3. Indirect Consequentialism**
  You argued that the theory must evaluate the act. Your friend argued the theory evaluates the plan.
  *   **Missing Insight:** There is a third option: **Indirect Consequentialism.**
  *   This theory says: "The right act is the one that maximizes utility (Act), *BUT* the best way to achieve that is to follow a disposition that sometimes ignores utility calculations."
  *   This allows you to say: "Paying is technically irrational (locally), but you should cultivate a psychology that makes you pay."
  *   **Why this matters:** It saves the theory from contradiction without changing the definition of rationality. It admits that **Rationality is Self-Defeating** (you shouldn't try to be rational directly) but **Consequentialism is Not** (you should aim for good outcomes indirectly). Parfit ultimately argues for this: we should be "Disposition-Consequentialists" even if we are "Act-Consequentialists" at the foundational level.

  ### Final Adjudication

  **Who won?**
  You won on the **philosophical implications**, but your friend won on the **technical defense of Standard Theory.**

  *   **You** correctly identified that Standard Rational Choice Theory cannot account for the hitchhiker's success without contradicting itself or changing its definition of rationality. You saw that the "act" at the bank is the stress point.
  *   **Your Friend** correctly identified that if you shift the locus of evaluation to the *ex ante* plan (Sophisticated Choice), the contradiction disappears. They were defending the orthodoxy that rationality is about planning, not just momentary impulses.

  **The Synthesis:**
  The disagreement was not merely verbal, but it was about **which contradiction we are willing to accept.**
  *   **Your position:** Accept that the *act* of paying is "irrational" by standard lights, proving standard rationality is self-defeating.
  *   **Friend's position:** Accept that the *definition* of rationality must include dispositions, proving standard act-evaluation is too narrow.

  **What to take away:**
  Parfit's conclusion is that we should accept **your** view: Rationality (as standardly defined) is self-defeating. We should not try to be rational in the moment; we should try to be the kind of person who is not rational in the moment. Your friend resisted calling this "irrationality" to protect the prestige of the word "rational." You were willing to let the word break to save the concept. In philosophy, that is usually the more honest move.
