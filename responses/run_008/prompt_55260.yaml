      *   **Bundle Theory vs. Substrate Theory:** Are objects just bundles of properties?
      *   **Quantum Mechanics:** Bosons vs. Fermions. Black's spheres are like bosons (can occupy same state), but fermions obey PII (Pauli Exclusion). Actually, quantum particles challenge PII even more (indistinguishable particles).
      *   **Symmetry Breaking:** Is the symmetry stable?
      *   **Ontic Structural Realism:** Maybe there are no objects, just relations.
      *   **Necessary vs. Contingent PII:** Is PII a logical truth or a metaphysical principle?

  4.  **Drafting the Adjudication:**

