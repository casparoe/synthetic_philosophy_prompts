      *   **Tone:** Respectful, intellectual, precise, acknowledging the user's expertise. No condescension.

  2.  **Deconstruct the Philosophical Positions & Map to Craft:**

      *   **Jackson (Original):** Mary knows all physical facts (telling/summary) but learns something new upon seeing red (showing/scene).
          *   *Craft Translation:* This is the purest form of "Show, Don't Tell." The summary of the wavelength of red light is not the experience of the red light. The scene *is* the knowledge.
      *   **Lewis (Ability Hypothesis):** Mary doesn't learn a new fact; she learns *how* to do things (remember, imagine, recognize).
          *   *Craft Translation:* This isn't about the text giving new info; it's about the text training the reader's muscle. It's not "here is grief," it's "here is how you simulate grief in your own mind." It shifts the locus from the page to the reader's capacity.
      *   **Phenomenal Concept Strategy (PCS):** Mary has the same fact but accesses it via a new conceptual mode (phenomenal concept vs. physical concept).
          *   *Craft Translation:* This feels like Free Indirect Discourse (FID) or Point of View (POV). The *event* (the fact) hasn't changed, but the *lens* through which it is rendered has. It's the difference between "The neuron fired" and "The pain stung." Same reality, different access code.
      *   **Dennett (Illusion/ deduction):** If Mary *really* knew everything, she could deduce the experience. The intuition that she learns something new is a failure of imagination.
          *   *Craft Translation:* This is the ultimate "Tell." If the summary is perfect enough, it *becomes* the scene. A sufficiently detailed report renders the staging unnecessary. It challenges the necessity of "Show, Don't Tell."

  3.  **Drafting the Translations (Iterative Process):**

      *   *Jackson:* Keep it close to "Show, Don't Tell." The text enacts the experience. The reader shakes.
      *   *Lewis:* Focus on "Ability." The text is a gym, not a lecture. The reader gains the *capacity* to feel, not the feeling itself as a datum.
      *   *PCS:* Focus on "Mode of Access." FID is a good analogy. The world is the same, the rendering changes.
      *   *Dennett:* Focus on "Sufficiency of Summary." If the telling is perfect, showing is redundant.

  4.  **Developing the Residue Report:**

      *   *What survives cleanly?* Jackson maps perfectly to Show/Don't Tell. Lewis maps well to the idea of reader engagement/imagination.
      *   *What gets bent?* PCS is tricky. FID changes the *voice*, but does it change the *concept*? The philosophical distinction is about reference and mode of presentation. Craft distinguishes voice/tone. There might be a slippage.
      *   *What breaks?* Dennett is the hardest. Craft insists showing is *always* better/different than telling. Dennett says telling *can* be showing if dense enough. This contradicts the "doctrine drilled into every apprentice."
      *   *The "Third Place":* The user suggests "acquaintance at one remove." This is crucial. Philosophy deals with the subject (Mary) and the object (Red). Fiction deals with Author -> Text -> Reader -> Experience. It's mediated. The "knowledge" is vicarious.
      *   *Addressing the Hypothesis:* Does philosophy miss the mediated nature of aesthetic experience? Or does fiction flatter itself that it conveys "experience" when it only conveys "symbols of experience"?

  5.  **Refining the Tone:**
      *   The user is a professional writer. Use their language. Avoid overly dense jargon without explanation, but don't oversimplify the philosophy.
