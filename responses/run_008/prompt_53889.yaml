      *   *Best Philosophical Fit:* Belief 1 is the outlier. It claims *absolute* sovereignty ("full stop," "no matter how many"). Beliefs 3 and 4 describe how social reality actually works. Belief 5b shows the user *actually* believes in limits to sovereignty.
