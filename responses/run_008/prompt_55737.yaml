      *   *Strongest Flip:* If W was shown that rejecting bivalence leads to logical chaos that undermines the very language games he wants to protect. W prioritizes practical function. If vagueness breaks the function, he might shift. But he likely wouldn't think it does.
      *   *Actually, the shakiest ground is W's view on "facts" about meaning.* Williamson says there *is* a fact. W says there is no "super-fact." If W's rule-following argument is weaker than thought (e.g., Kripke's skeptical solution vs. straight solution), the attack weakens.

