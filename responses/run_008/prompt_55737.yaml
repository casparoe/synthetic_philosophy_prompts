prompt: |-
  Quick one I've been chewing on: suppose you could bring Wittgenstein (late Wittgenstein, the Philosophical Investigations guy) back and sit him down with Timothy Williamson's epistemicism about vagueness — the view that there really is a sharp cutoff in a sorites series, we're just constitutionally unable to know where it is, because our total use plus the environment fixes a determinate extension even though no human could ever locate the boundary. Keep in mind his later stuff: rule-following (no fact of the form "he meant plus rather than quus" that goes beyond all possible use), family resemblance concepts like "game" held together by overlapping criss-crossing similarities rather than necessary and sufficient conditions, and his general allergy to the idea that language hides a mathematical structure waiting to be discovered. So how would he react — as a brave facing-up to the fact that our words either apply or don't, or as exactly the philosophers' myth he spent his later life dissolving? Sketch his most likely line of attack on Williamson, but then steelman the other side: family resemblance fits "game" beautifully, but "heap" doesn't look like a family-resemblance concept at all, it looks like the tolerance premise of the sorites is just true for it — so where exactly does he get traction? Also say what you think he'd make of the epistemicist's move that the unknowability of the boundary is explained by meaning-fixing use being total and environmental rather than mental. Flag clearly where you're extrapolating beyond anything he actually wrote versus where he said something genuinely close, and tell me which piece of evidence about his views would most plausibly flip your verdict — I want to know where this prediction is on its shakiest ground.
