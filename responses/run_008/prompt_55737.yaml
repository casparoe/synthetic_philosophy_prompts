  2.  **Deconstruct Wittgenstein's Position (Late):**
      *   *Core Idea:* Meaning is use. There is no "super-order" between super-concept and super-fact (*PI* §97).
      *   *Vagueness:* For W, vagueness isn't a defect to be cured; it's essential to language (*PI* §71, §88). A blurry picture can be perfectly useful.
      *   *Rule-Following:* There is no fact of the matter about what a rule dictates in all future cases beyond how we actually apply it. There is no "railway track to infinity."
      *   *Reaction to Precision:* The demand for exactness is often a philosophical craving, not a practical need (*PI* §107).

  3.  **Deconstruct Williamson's Position (Epistemicism):**
      *   *Core Idea:* Classical logic holds (Bivalence). "This is a heap" is either true or false, even for borderline cases.
      *   *Vagueness:* It's ignorance. There *is* a fact of the matter, but our cognitive access is limited because meaning is sensitive to micro-variations in use/environment that we can't track.
      *   *Metaphysics:* Realism about semantic facts. The world + use fixes a sharp line.

  4.  **Drafting the Confrontation (Wittgenstein's Attack):**
      *   *The "Myth" Angle:* W would see Williamson's "sharp boundary" as a philosophical myth. It posits a fact that makes no difference to practice.
      *   *Rule-Following:* Williamson claims use *fixes* a boundary. W says use *is* the practice. If the practice doesn't distinguish, there is no distinction. To say there *is* a distinction we can't see is to posit a "super-fact."
      *   *Exactness:* W would ask: "What work is this boundary doing?" If it can't be used, it's not part of the language game.
      *   *Key Quote:* *PI* §88 ("I can say 'Stand roughly here'... does this mean I don't know what I mean?").

  5.  **Steelmanning the Counter (Williamson/W Vagueness):**
      *   *The "Heap" Problem:* Family resemblance works for "game." But "heap" seems different. It looks like a cumulative concept.
      *   *Tolerance:* The premise "if n grains is a heap, n-1 is a heap" seems intuitively true. Williamson says it's false (there's a cutoff). W says the premise is a grammatical illusion.
      *   *Traction:* Where does W get traction? He denies the *need* for a cutoff. The sorites paradox arises from demanding precision where none is needed. The paradox dissolves if we accept blurred edges.
      *   *Williamson's Strength:* He preserves classical logic. W is okay with logic being a tool, not a mirror of reality.

  6.  **Analyzing the "Use + Environment" Move:**
      *   Williamson says meaning is fixed by total use + environment, which is too complex for us to know.
      *   W's Reaction: "Use" for W is public, communal practice (*PI* §202). It's not a hidden causal mechanism. If the community doesn't mark a difference, there is no difference. Williamson treats "use" as a causal determinant; W treats "use" as a normative practice. This is a category mistake from W's view.

  7.  **Flagging Extrapolation vs. Evidence:**
      *   *Evidence:* *PI* §71 (no sharp boundaries), §88 (blurry picture), §107 (craving for generality/precision). Rule-following considerations (*PI* §185-202).
      *   *Extrapolation:* W never read Williamson. Applying *PI* to modern epistemicism requires bridging 50 years of semantic theory. Specifically, W's view on "truth" in borderline cases is less explicit than his view on "meaning."

  8.  **Identifying the "Shakiest Ground":**
