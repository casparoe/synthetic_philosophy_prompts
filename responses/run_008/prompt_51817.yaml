prompt: |-
  I'm a PhD student in philosophy of mind, and next week I defend in our departmental colloquium the thesis that qualia, as standardly conceived — intrinsic, private, ineffable properties of experience, directly apprehended in introspection — are an incoherent posit rather than a genuine explanandum. My central exhibit is Dennett's pair of coffee drinkers, Chase and Sanborn, who one day find that the Maxwell House they have always enjoyed suddenly tastes awful: I argue that introspection cannot adjudicate among the rival hypotheses about what changed — the taste-experience itself, the reaction to it, or the judgment about it — and that a posit too indeterminate to settle even this does no theoretical work. The audience is mostly phenomenal realists: a senior metaphysician who regards the knowledge argument as decisive, a perception specialist who takes dissociations like blindsight to show that experience has intrinsic properties about which a subject can be ignorant, two ordinary-language types who will suspect my target is a position no one actually holds, and one graduate student already sympathetic to illusionism who will ask why I stop short of it. Draft my Q&A prep sheet: the objections I will actually get, in roughly the order they will arrive, phrased in that audience's vocabulary, each with a two-minute reply and a note on where the reply is soft; mark which points I should concede up front and which I must hold; and include the question I am hoping nobody asks. Please also say what would change your ranking — which consideration would make a different objection the most dangerous — and where your own assessment is most likely to fail. End with a final line beginning "Verdict:" naming, in a short phrase, the single most damaging objection.
