answer: |-
  **Q&A PREP SHEET: THE INCOHERENCE OF QUALIA**
  **To:** PhD Candidate
  **From:** [Simulated Advisor]
  **Re:** Colloquium Defense Strategy

  You are walking into a minefield. Your argument relies on the indeterminacy of introspection (Chase/Sanborn) to dissolve the *explanandum*. Your audience, however, believes the *explanandum* is the only thing we know for sure. Your goal is not to convince them they don't have experiences, but that their *metaphysical categorization* of those experiences is doing no work.

  Here are the objections you will face, in likely order of engagement.

  ***

  ### 1. The Ordinary-Language Objection (The "Strawman" Charge)
  **Who:** The two Ordinary-Language Philosophers.
  **The Objection:** "You define qualia as 'intrinsic, ineffable, private properties.' But no serious phenomenologist claims introspection is infallible or that these properties are detached from judgment. You are attacking a Cartesian ghost no one houses anymore. If you redefine 'experience' to exclude the messy cognitive integration Chase and Sanborn exhibit, you aren't refuting qualia; you're refuting a caricature."
  **2-Minute Reply:** "I am not conducting a census of what philosophers *say* they believe; I am reconstructing the commitments required to make the Knowledge Argument work. To claim Mary learns something *ontological* rather than *epistemic*, one must posit a property that exists independently of our discriminatory judgments. Chase and Sanborn show that when we peel away judgment and reaction, there is no residual 'taste' left to point to. If the property cannot be distinguished from the reaction to it, it is not an intrinsic property of the experience, but a relational feature of the organism. I am not changing the subject; I am demanding the posit pay its theoretical rent."
  **Soft Spot:** You risk sounding like you are stipulating definitions to win. If they press that "phenomenal concepts" function differently than "physical concepts," you need to avoid getting bogged down in semantics.
  **Strategy:** **CONCEDE** that experience exists. **HOLD** that the *metaphysical gloss* (intrinsic/private) is the target.

  ### 2. The Perception Specialist (The "Blindsight" Push)
  **Who:** The Perception Specialist.
  **The Objection:** "Dissociations like blindsight prove there are unconscious visual states. By contrast, there are conscious states. The difference isn't just judgment; it's the presence of an intrinsic property that makes the state 'light up.' Chase might be confused about the *label*, but he isn't confused about whether there is *something it is like*. Your indeterminacy argument conflates *uncertainty about classification* with *absence of the property*."
  **2-Minute Reply:** "Blindsight shows a functional dissociation between input and report. It does not prove the conscious alternative possesses 'intrinsic properties' accessible only to introspection. It proves there is a mode of processing that allows for reportability. When Chase says the coffee tastes different, he is reporting a change in his discriminatory disposition. To say there is an extra 'glow' on top of that disposition is to add a wheel that turns nothing. If the 'lighting up' makes no difference to behavior or judgment, it is epiphenomenal. If it does make a difference, it is detectable, and Chase should be able to track it."
  **Soft Spot:** The intuition that "there is something it is like" is very strong. Denying the "glow" feels like denying consciousness itself.
  **Strategy:** **HOLD** the line on theoretical utility. Do not deny the difference between blindsight and sight; deny the *explanation* for that difference requires qualia.

  ### 3. The Senior Metaphysician (The Knowledge Argument)
  **Who:** The Senior Metaphysician.
  **The Objection:** "This is the crux. Mary leaves the room. She knows all the physical facts. She sees red. She says, 'Ah, so *that* is what it is like.' She has learned a new fact. If your Chase/Sanborn indeterminacy holds, she shouldn't learn anything. The fact that she *does* learn something proves the property is real, intrinsic, and non-physical. Your argument dissolves the datum to save the theory."
  **2-Minute Reply:** "Mary does not learn a new *fact about the world*; she acquires a new *mode of access* to an old fact. She gains a phenomenal concept, not a new property. Think of it like knowing everything about water (H2O) but never having seen it. Seeing it gives you a demonstrative capacity ('this is water'), not a new ontological commitment. Chase and Sanborn show that when we try to isolate the 'property' Mary supposedly discovers, we find only shifting dispositions. If the property were intrinsic, she should be able to isolate it. She cannot."
  **Soft Spot:** This is your hardest hit. The "New Fact" intuition is the bedrock of their realism. If you sound dismissive of Mary's surprise, you lose the room.
  **Strategy:** **HOLD**. This is the main event. Frame it as an epistemic shift, not an ontological one.

  ### 4. The Graduate Student (The "Illusionist" Push)
  **Who:** The Sympathetic Grad Student.
  **The Objection:** "If qualia are incoherent, why stop at 'incoherent posit'? Why not embrace Illusionism? If introspection misleads us into thinking there are intrinsic properties, then the *appearance* of qualia is the real phenomenon. Why not say the user-illusion is real, even if the properties aren't?"
  **2-Minute Reply:** "Because 'illusion' implies a distinction between appearance and reality. To say 'qualia are an illusion' is to say 'it seems to me I have qualia, but I don't.' But for the qualia realist, the seeming *is* the being. If you remove the being, you must explain the seeming. If the seeming is just a judgment (as I argue), then there is no illusion, just a mistaken theory. I prefer to say we are theorizing badly about our experience, rather than that our experience is systematically fooling us."
  **Soft Spot:** This is a friendly fire. Don't spend too long here, or you look like you're hiding from the hard ontological commitment.
  **Strategy:** **CONCEDE** the affinity, but distinguish your methodological error theory from their ontological illusionism.

  ***

  ### The Question You Hope Nobody Asks
  **The Self-Defeat Challenge:**
  "You argue that introspection is too indeterminate to ground the posit of qualia (via Chase/Sanborn). But your evidence for this indeterminacy *is* the introspective reports of Chase and Sanborn. If introspection is unreliable, why trust their report that they *cannot* tell the difference? You are using introspection to prove introspection is broken. If their confusion is real, doesn't that require a reliable introspective faculty to detect the confusion?"

  *Why this is dangerous:* It attacks the methodological foundation of your central exhibit. If you can't trust the data (the confusion), the argument collapses.
  *Prep:* Be ready to say: "We don't need to trust introspection as a *revelatory* mechanism, only as a *behavioral* report. They report confusion. That report is a physical event. I am not trusting their access to properties; I am trusting their report of their own uncertainty."

  ***

  ### Strategic Concessions & Holds
  *   **CONCEDE UP FRONT:** "I am not denying that coffee tastes different to Chase. I am not denying consciousness exists. I am denying that 'qualia' is the correct metaphysical bucket for these events." (If you don't say this in the first 30 seconds, you will spend the hour trying to say it).
  *   **HOLD THE LINE:** "A posit that cannot distinguish between a change in experience and a change in judgment is theoretically inert." (Do not let them move the goalposts to 'dispositional qualia'.)

  ***

  ### Ranking Changer
  **What would change the danger ranking?**
  Currently, the **Metaphysician (Knowledge Argument)** is the most dangerous philosophical objection. However, if the **Ordinary-Language Philosophers** successfully convince the room that your definition of "qualia" is a strawman *before* the Metaphysician speaks, the Metaphysician's objection becomes irrelevant. If the audience agrees "No one believes that," they will stop listening to your refutation of it.
  *   *Contingency:* If the first question is the Strawman charge, spend your opening statement clarifying that you are targeting the *commitments of Physicalist Realism*, not a historical census.

  ### Where My Assessment Is Most Likely to Fail
  I am underestimating the **Perception Specialist's** ability to pivot to **Unconscious Perception**. If they argue that *unconscious* states lack the "intrinsic glow" and *conscious* states have it, and that this is a binary switch (not a gradient), your indeterminacy argument looks like a category error. They will argue Chase/Sanborn is about *discrimination thresholds*, not the *presence of consciousness*. If they separate "conscious access" from "discriminatory judgment" cleanly, your argument that they are indistinguishable fails.

  ***

  Verdict: The Phenomenological Datum.
