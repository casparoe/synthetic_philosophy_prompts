  The implicit theory
  The implicit theory underpinning contemporary peer review is fundamentally synchronic and internalist. It presupposes a conception of scientific rationality where justification is local to the specific argument and data set presented. This view echoes a refined logical empiricism, distinguishing sharply between the context of discovery and the context of justification. Validity depends on logical relation to evidence and methodological rigor, rather than the paper's role within an evolving theoretical framework. The practice assumes that scientific progress is aggregative: if each brick is sound, the wall will stand. Consequently, appraisal focuses on internal validity, statistical robustness, and immediate significance, treating the paper as a self-contained unit of knowledge. It operates on the belief that methodological correctness guarantees epistemic value, independent of the heuristic fertility of the surrounding research program. This approach implicitly rejects the notion that a paper's value is contingent upon the future success of its guiding assumptions. Instead, it posits that rationality is accessible at a single moment in time, without requiring historical context. The system trusts that long-term theoretical viability is a separate issue, best left to the sociological dynamics of the field rather than editorial gatekeeping. This perspective treats science as a collection of discrete facts rather than a dynamic process. It prioritizes the certification of knowledge claims over the cultivation of research directions. The reviewer acts as a judge of evidence, not a forecaster of utility. Thus, the journal functions as a validator of immediate rigor, not a steward of long-term progressive problem shifts, maintaining a firewall between local methodological soundness and global theoretical health.

  What the practice rules out
  Strictly speaking, this practice rules out rejecting a methodologically sound paper solely because its underlying research program is degenerating. It forbids reviewers from dismissing valid data as epistemically worthless merely because the theory generating them relies on ad hoc auxiliary assumptions. Conversely, it prevents accepting a flawed study simply because it belongs to a progressive program. The system explicitly excludes historical trajectory from the criteria of acceptance. It renders illegitimate any appeal to the long-term heuristic power of a theory during the review process. By isolating the paper from its program, the practice prohibits editors from acting as guardians of progressive problem shifts. It mandates that evaluation remain ahistorical, ensuring that scientists working within stagnant paradigms are not penalized for their theoretical affiliations, provided their immediate execution is flawless. This creates a firewall between local rigor and global theoretical health.

  Where it is underdetermined
  However, this practice is philosophically underdetermined. It is compatible with multiple rival views of science. A Kuhnian perspective fits comfortably, viewing journals as venues for normal science puzzle-solving, where adherence to paradigmatic methods matters more than theoretical progress. Naive Popperians also accept it, focusing on the corroboration of individual claims rather than the health of the broader theory. Even scientific realists and instrumentalists can agree on methodological rigor while disagreeing on ontological commitment. The practice does not prove logical empiricism is correct; it merely reflects an institutional division of labor. It leaves open whether science aims at truth or empirical adequacy. Consequently, the journal structure does not commit to a specific metaphysics of progress. It accommodates any philosophy that values local validity, leaving the question of long-term rationality unresolved.

  If the programme were the unit
  If the research program became the unit of appraisal, editorial practice would undergo radical transformation. Editors would require historical expertise to track the trajectory of competing programs, assessing whether submissions generate novel facts or merely accommodate existing ones. Review forms would mandate evaluations of heuristic fertility, asking if the paper proposes risky predictions or patches anomalies ad hoc. Journals might prioritize special issues dedicated to progressive problem shifts, while systematically rejecting technically sound papers belonging to degenerating lines. This would align publication with funding and tenure practices, creating a coherent ecosystem rewarding long-term viability. However, this risks conservatism, potentially stifling nascent programs that appear degenerating before a breakthrough. To mitigate this, editors would need mechanisms to identify emerging progressive shifts early. The focus would shift from verifying past data to betting on future potential. Collaboration between journals would be necessary to map the landscape of competing programs. Ultimately, the journal would become an active agent in scientific rationality, steering the field rather than merely recording it. This requires a shift from auditing methods to evaluating theoretical momentum, transforming reviewers from auditors into strategists of scientific progress. Authors would need to articulate the progressive potential of their work explicitly, changing the rhetoric of submission from mere validity to theoretical vitality. This shift would inevitably introduce greater subjectivity, as judging progress is less objective than checking statistics. Editors would face pressure to justify rejections based on theoretical stagnation rather than methodological error.

  Verdict
  Current peer review is locally rational but globally blind. It ensures rigor while ignoring theoretical vitality. Adopting Lakatos would align journals with funding and tenure incentives but risks editorial bias against nascent ideas. Furthermore, it demands historical expertise editors may lack. A hybrid model, retaining methodological scrutiny while contextualizing contributions within broader trajectories, offers the most robust path forward for scientific rationality.
