  ### Prediction: Collapse

  Your supervisor will likely rule the end of Angkor a **genuine collapse**.

  While the persistence of the Khmer script and population mirrors her "Not Collapse" verdicts for Rome and the Maya, the fate of the Angkorian *system* mirrors her "Collapse" verdicts for Mycenae and Easter Island. In her taxonomy, the survival of the *people* is secondary to the survival of the *complexity-generating engine*. For Rome, the "engine" (Law, Church) migrated to successor states. For the Maya, it migrated geographically (South to North). For Angkor, the hydraulic city and the *devaraja* (god-king) cult were terminally abandoned, not migrated or reconstituted. The shift to Theravada Buddhism represents a new ideological operating system, not the continuation of the old one. Given her specific emphasis on the "ecology that sustained" Easter Island despite population continuity, she will weigh the abandonment of the waterworks and the royal cult heavier than the continuity of the Khmer script.

  ***

  ### Reconstructed Rules

  Her refusal to define "collapse" suggests she is an inductive theorist; she derives the definition from the phenomenology of the cases rather than imposing *a priori* criteria. Based on her six rulings, here are two candidate rules that fit her record equally well but diverge on Angkor.

  **Rule 1: The "Cultural Memory" Rule (Continuity of Encoding)**
  *   **The Rule:** A society has not collapsed if it retains the technological means to encode its complexity (writing/script) and a political entity that claims direct succession, regardless of material changes. Collapse is defined by the loss of literacy and the break in political self-identification.
  *   **Fit with Record:**
      *   *Mycenae/Indus:* Script lost → Collapse.
      *   *Easter Island:* Rongorongo (script) effectively lost/obsolete; system forgotten → Collapse.
      *   *Maya/Rome/Egypt:* Script (or Law as codified script) and successor polities continued → Not Collapse.
  *   **Prediction for Angkor:** **Not Collapse.** The Khmer script, literary tradition, and a Khmer kingdom persisted. The "memory" of the civilization was not broken.

  **Rule 2: The "Socio-Ecological Contract" Rule (Continuity of Function)**
  *   **The Rule:** A society has not collapsed only if the specific material and ideological infrastructure that generated its peak complexity is maintained, repurposed, or rebooted. If the defining "engine" (palaces, urbanism, statue cults, hydraulic systems) is abandoned and replaced by a fundamentally different system, it is a collapse, even if the population remains.
  *   **Fit with Record:**
      *   *Mycenae:* Palatial economy burned, not rebooted → Collapse.
      *   *Indus:* Urbanism ended, not rebooted → Collapse.
      *   *Easter Island:* Statue system/ecology terminally lost → Collapse.
      *   *Maya:* Kingship/Writing moved North (Engine repurposed) → Not Collapse.
      *   *Rome:* Imperial administration fell, but Law/Church sustained Roman complexity (Engine repurposed) → Not Collapse.
      *   *Egypt:* State paused, then reconstituted *same* model (Engine rebooted) → Not Collapse.
  *   **Prediction for Angkor:** **Collapse.** The hydraulic network and the Sanskrit royal cult (the Angkorian engine) were abandoned. The Theravada kingdom that followed was a different socio-ecological contract.

  ***

  ### The Discriminating Case

  To distinguish between these rules without waiting for her Angkor verdict, you should propose the **Fall of Constantinople (1453 CE)**.

  *   **The Case:** The Ottoman conquest ended the Byzantine Empire. The Imperial capital was lost, the Emperor killed, and the Roman state apparatus dissolved. However, the Greek Orthodox Church survived, the Greek language and script continued, and the population remained culturally Greek (later under the Ottoman *Rum* millet).
  *   **Rule 1 Demand (Cultural Memory):** **Not Collapse.** The script, religion, and ethnic identity survived the political break. The "memory" of Rome persisted in the Church and language.
  *   **Rule 2 Demand (Socio-Ecological Contract):** **Collapse.** The specific political engine of the Roman Empire (1,500 years of imperial statecraft) was terminally lost. The "Byzantine" system did not migrate or reboot; it ended.

  If she rules Byzantium 1453 as "Not Collapse," she follows Rule 1 (and will likely spare Angkor). If she rules it "Collapse," she follows Rule 2 (and will condemn Angkor). Given her Easter Island ruling, Rule 2 is the stronger bet.

  ***

  ### Evaluation of Her Track Record

  Her track record amounts to a **substantive notion of collapse**, not merely a label for interesting changes.

  A merely subjective label would show inconsistency regarding *what* survives (e.g., calling Rome a collapse because the Emperor died, but Egypt not because the Pharaoh returned). Her rulings are consistent regarding the *persistence of complexity*. She distinguishes between **transformation** (where the capacity for complex organization is transferred or reconstituted, as in Rome, Maya, and Egypt) and **extinction** (where the capacity for complex organization is lost, as in Mycenae, Indus, and Easter Island).

  Her refusal to state a definition is likely methodological: she recognizes that "collapse" is a cluster concept (Wittgensteinian family resemblance) rather than a binary switch. By prioritizing the cases, she avoids the trap of defining collapse by a single metric (like population loss) that would misclassify her "Not Collapse" cases. Her implicit theory aligns with systems theory: collapse is the irreversible loss of a society's *information processing capacity* (script, administration, infrastructure), not just a change in government or demographics. This is a rigorous, defensible sociological position.
