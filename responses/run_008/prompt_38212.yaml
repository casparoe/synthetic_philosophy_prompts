prompt: |-
  So last night my friend and I had another one of our marathon arguments about why promises bind — like three hours, we ended exactly where we started, and I've realized we've been having basically this same argument for over a year now. I want help figuring out what kind of disagreement this actually is, because at this point I don't think more examples are going to move anything.

  Here's where we each stand. She's drawn to the normative-powers view: roughly, promising is an exercise of a power to alter your own normative situation, similar to consenting or authorizing, and that's what generates the obligation — not the downstream effects, not anyone's expectations. I keep landing on the reliance/convention side: something like Hume-style conventions plus the thought that what you really owe people is not to betray the expectation you deliberately created. And we each know our standard moves by heart. She says the reliance story can't explain the cases where nobody is actually relying — the secret promise, the promisee who's forgotten, the promise kept only because being the kind of person who keeps promises pays off in the long run even if this particular breach would go undetected. I say her view has an embarrassing bootstrap problem: the power is only binding if there's already a norm saying you ought to use your normative powers correctly, and I don't see where that prior norm comes from without smuggling in exactly the consequences and practices she's trying to explain away. Then we go around again.

  What I want is a diagnosis, not a verdict for either of us. Is this a substantive disagreement, or are we answering two different questions under one heading — her answering what promising is, me answering when we're actually obligated? Is there a hidden factual or conceptual question doing the work that neither of us ever states? Or is it bedrock all the way down — intuitions about whether obligation can be self-imposed that neither of us could argue for non-circularly? And then, given the diagnosis, tell me honestly whether anything would count as progress here — a distinction we're missing, a test case we haven't tried, a way of splitting the question — or whether we should just accept we're stuck and why. If you think the whole framing assumes something both of us should give up, say that too.

  One practical note: please write the answer in American English. And sorry if this is a bit rambly, its very late here and im still annoyed at her, definately not at the philosophy.
