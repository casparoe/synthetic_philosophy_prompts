          *   User: Believes duty must be grounded in something observable (harm, expectation, social utility).
      *   *The "Bootstrap" vs. "No Reliance" standoff:* This is the classic Rawls/Prichard vs. Hume/Scanlon debate. It's a philosophical stalemate because both sides have intuitive pull but struggle with edge cases.

  3.  **Evaluate Potential for Progress:**
