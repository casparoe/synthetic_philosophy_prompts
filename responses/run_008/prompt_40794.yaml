      *   *Three Conditions:* 1. Individuality of feeling, 2. Clearness of expression, 3. **Sincerity** (most important).
      *   *The "Good" Art:* Universal, religious (in the broad sense of brotherhood), accessible to all (peasants).
      *   *The "Bad" Art:* Exclusive, obscure, sensual, patriotic, ecclesiastical (of his time), counterfeits.
