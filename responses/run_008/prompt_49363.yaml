answer: |-
  **Dissertation Prospectus**

  **Title:** Sunk Costs as Intrapersonal Commitment: Distinguishing Evidential and Strategic Rationality

  **1. Research Question and Core Hypothesis**
  The orthodox verdict in decision theory and practical rationality is that honoring sunk costs is a fallacy. Rational agents are instructed to ignore irrecoverable past investments when choosing between future courses of action. This dissertation challenges the universality of this verdict. It argues that for temporally extended agents prone to motivation slumps (time-inconsistency), a standing policy of honoring sunk costs can function as a rational intrapersonal commitment device.

  The central research question is: *Under what conditions is it instrumentally rational to adopt a decision rule that weights sunk costs, even when those costs carry zero evidential value regarding project quality?*

  To answer this, the project must disentangle two rationales often conflated in the literature. First, sunk costs may serve as *evidence*. If past investment correlates with private information about quality (e.g., "I wouldn't have started this if I didn't think it was promising"), conditioning on past investment is standard Bayesian updating. This is widely accepted as rational. Second, sunk costs may serve as *strategic self-binding*. Even if past investment signals nothing about quality, adhering to a rule like "finish what you start" may prevent a future self from abandoning a high-value project during a temporary dip in motivation. Here, the "loss" incurred by finishing a doomed project is the premium paid to maintain the credibility of the rule for future, more valuable projects. This proposal focuses exclusively on the second, strategic justification, which remains under-theorized.

  **2. Context and Gap in Existing Literature**
  Standard treatments of the sunk cost fallacy (e.g., in behavioral economics and normative decision theory) typically assume a temporally unified agent with costless access to self-control. Under these idealizations, any weight given to sunk costs reduces expected utility. Where time-inconsistency is acknowledged (e.g., in literature on akrasia or hyperbolic discounting), the focus is usually on external commitment technologies (contracts, penalties) or precommitment strategies (Ulysses pacts).

  Existing literature leaves open the possibility of *internal* commitment via heuristics. While some authors have noted that rules of thumb can manage self-control, few have applied this specifically to the sunk cost case to show that the "fallacious" rule itself is the technology. The gap is a lack of formal comparison between an agent who can access explicit external commitment and an agent restricted to internal rules of thumb. Without this comparison, we cannot determine if the sunk cost heuristic is a second-best rational solution for constrained agents or merely a cognitive bug.

  **3. Methodology: A Comparative Formal Model**
  The dissertation will construct a simple decision-theoretic model to compare two agent types across a sequence of projects.
  *   **Agent A (Commitment):** Can bind their future self at the outset of a project (e.g., via a penalty for abandonment).
  *   **Agent B (Heuristic):** Cannot bind externally but can adopt a standing policy regarding sunk costs (e.g., "Abandon only if expected future value < 0," vs. "Abandon only if expected future value < –S," where S represents a weight given to sunk costs).

  The model will vary two key parameters:
  1.  **Distribution of Project Quality:** The probability that a project is inherently valuable vs. doomed.
  2.  **Strength of Temptation:** The degree of time-inconsistency (the gap between the valuation of the project at *t1* vs. *t2*).

  The analysis will determine the expected utility for Agent B under the "Sunk Cost" policy compared to the "Rational" (ignore sunk costs) policy. The goal is to identify the parameter space where the Sunk Cost policy outperforms the Rational policy for Agent B, approaching the efficiency of Agent A.

  **4. Success and Failure Conditions**
  A successful outcome will demonstrate a non-empty set of plausible parameters where Agent B maximizes utility by honoring sunk costs. Specifically, it should show that the utility lost by completing "doomed" projects (the premium) is outweighed by the utility gained by preventing the abandonment of "good" projects during motivation slumps.

  The project will be deemed to have failed if:
  1.  **Conceptual Collapse:** The distinction between evidential and strategic rationales cannot be made precise within the model (i.e., if the "strategic" weight inevitably functions as a proxy for evidence).
  2.  **Implausible Parameters:** The model only validates the sunk cost rule under parameter values that are empirically unrealistic (e.g., if the temptation strength must be impossibly high, or the cost of the premium impossibly low).
  3.  **Triviality:** The result merely demonstrates that *some* rule is better than *no* rule, without specifically vindicating a sunk-cost-sensitive rule over other heuristics (e.g., a simple "never quit" rule).

  **5. Timeline and Scope**
  *   **Term 1:** Literature review (focusing on the conflation of evidence and strategy); formalization of the base model.
  *   **Term 2:** Solving the model; analyzing parameter sensitivity; drafting the philosophical interpretation of the results.
  *   **Word Count:** Target 15,000 words.

  ***

  ### Feasibility Assessment & Scoping Advice (For the Student)

  **Is the formal modeling too ambitious?**
  Yes, there is a significant risk. Building a *novel* formal model from scratch, solving it, and interpreting it philosophically is a heavy lift for a 15,000-word MA dissertation over two terms. Philosophy MAs often underestimate the time required to troubleshoot mathematical proofs or ensure the model is robust. If you get stuck on the math, you won't have space for the philosophical argument.

  **What to cut first if time runs short:**
  1.  **Simplify the Agent Comparison:** Instead of comparing Agent A (External Commitment) vs. Agent B (Heuristic), focus solely on Agent B. Compare two policies for the *same* constrained agent: (1) Ignore Sunk Costs vs. (2) Honor Sunk Costs. This removes the need to model external contract technology, which adds complexity without changing the core philosophical point.
  2.  **Binary States:** Do not model a "distribution" of project quality. Stick to a binary case: Projects are either "Good" or "Bad." Do not model a continuous distribution of temptation strength; use two states (High Motivation/Low Motivation). This allows you to use simple expected utility algebra rather than calculus or optimization functions.
  3.  **Narrative over Proof:** If the math gets sticky, pivot. Use the model as a *schema* to illustrate the logic, rather than a rigorous proof. You can argue qualitatively that "if X > Y, then Z" without solving for the exact equilibrium. The philosophical contribution is the distinction between evidence and strategy, not the specific algebraic threshold.
  4.  **Leverage Existing Frameworks:** Instead of building a model from scratch, adopt an existing framework for time-inconsistency (e.g., Ainslie's picoeconomics or Bratman's planning theory) and show how sunk costs fit into *that* model. This saves you from defending the axioms of your own model.

  **Verdict:** The idea is strong and viable, but treat the math as a tool for clarity, not the primary output. If you spend 80% of your time on the model, you will run out of space to explain *why* it matters for rationality. Keep the model simple enough to explain in one paragraph.
