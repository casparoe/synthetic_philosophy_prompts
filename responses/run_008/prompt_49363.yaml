prompt: |-
  I'm preparing an MA dissertation prospectus in philosophy (roughly 15,000 words over two terms) and need a two-page proposal from a half-formed idea. The idea: the textbook verdict that honoring sunk costs is always irrational seems to assume a single, temporally unified agent who can costlessly self-bind or walk away. But for agents who know they will hit a motivation slump in the middle of any long project, a standing rule like "finish what you start" can function as a cheap intrapersonal commitment device — the occasional doomed project is the premium paid for keeping the rule credible to one's future selves. What I want the proposal to do: state the question precisely, and in particular separate two things the fallacy literature tends to run together — sunk costs as evidence about a project's prospects (using them that way is legitimate and no one disputes it) versus sunk costs operating as self-binding (deliberately letting past costs move you, knowing they carry no evidential weight, because of what that policy does to later choices); explain why the existing treatments leave this open; lay out the method, which I envision as a comparison, at the level of a simple formal model, between an agent with access to explicit commitment technology (contracts, deadlines with teeth) and one stuck with rules of thumb, across different distributions of project quality and strength of temptation; describe what a result would look like on either side of the question and what would count as the project failing — for instance, if the evidence/self-binding distinction cannot be made precise, or if the model yields an answer only for parameter values nobody believes in. I'd also like an honest assessment of whether the formal modeling is too ambitious for a philosophy dissertation within two terms, and, if so, what should be cut first. No bibliography needed; I'll add citations myself.
