answer: |-
  In 2011, Daryl Bem published "Feeling the Future," reporting nine experiments suggesting that participants could anticipate random stimuli before they occurred. Eight of the nine studies yielded $p < .05$. This episode catalyzed the psychology replication crisis, sparking a methodological reform movement centered on preregistration and transparency. The crisis is frequently narrated as a victory for Bayesian inference over frequentist null hypothesis significance testing (NHST). However, a rigorous analysis requires mapping the specific inferential claims of each framework against the historical facts, identifying where each theory illuminates the failure, and acknowledging where both remain silent.

  **Task 1: Mapping the Frameworks**

  To understand the dispute, we must distinguish what counts as evidence, hypothesis, and procedure in each framework, and what Bem's results licensed under each description.

  Under the **frequentist framework**, the hypothesis is a fixed claim about a data-generating parameter (e.g., the precognition effect size $\delta = 0$). The evidence is the test statistic derived from the data. The procedure is the NHST protocol, which guarantees that if the null hypothesis ($H_0$) is true, the probability of observing data this extreme is no more than $\alpha$ (typically 0.05). Bem's significant $p$-values licensed the rejection of $H_0$ based on this error guarantee: the data would be surprising (rare) under the assumption of no precognition. A failed replication, in this view, indicates that the original procedure's advertised error guarantees were illusory. This could occur because the original result was a Type I error (a rare event that happened to occur) or, more damningly, because the sampling distribution was violated via "researcher degrees of freedom" (p-hacking). If the data collection or analysis was contingent on the results, the $p$-value no longer tracks the long-run error rate, rendering the license to reject $H_0$ invalid.

  Under the **Bayesian framework**, the hypothesis is a model assigned a prior probability. The evidence is the likelihood ratio, or Bayes Factor (BF), comparing the predictive success of the null model ($H_0$) against an alternative ($H_1$). The procedure is conditionalization: updating prior odds to posterior odds. Bem's results were supposed to license a shift in belief toward the psi hypothesis. However, the 2011 reanalysis by Wagenmakers et al. calculated BFs for Bem's data and found that most provided only "anecdotal" evidence for psi, or actually favored the null, once reasonable priors were applied. Here, the distinction is crucial: frequentist significance asks, "Is the data surprising under $H_0$?" whereas Bayesian inference asks, "Is the data more probable under $H_1$ than $H_0$?" Bem's data were surprising under $H_0$ (low $p$), but not necessarily more probable under $H_1$ (low BF). A failed replication, in the Bayesian reading, is simply a posterior update. As new data arrive that favor $H_0$, the posterior probability of precognition diminishes. The failed replication does not invalidate the original math; it simply swamps the original likelihood with stronger contrary evidence.

  **Task 2: Illumination**

  Each framework illuminates specific structural features of the crisis, though neither offers a complete explanation.

  The **Bayesian framework** correctly highlights the weakness of the $p < .05$ threshold. Wagenmakers' reanalysis demonstrated that a $p$-value just below 0.05 often corresponds to a Bayes Factor of less than 3, which is considered weak evidence. This asymmetry shows that NHST licenses rejection on evidential grounds that a Bayesian would deem insufficient for belief revision. Furthermore, Bayesian theory correctly identifies that **optional stopping** (collecting data until $p < .05$) inflates Type I error rates in frequentist testing but theoretically leaves Bayes Factors invariant (the Stopping Rule Principle). In the Bem episode, while explicit optional stopping was not the sole culprit, the flexibility in analysis was. The Bayesian critique illuminates why flexible designs erode evidential strength: they allow the researcher to find noise that looks like signal.

  However, the **frequentist framework**, particularly through **Paul Meehl's** earlier critiques, illuminates the theoretical vacuity of the null hypothesis in social science. Meehl argued that in psychology, the "null" (exact zero effect) is almost always false due to the "crud factor"—everything correlates with everything to some minute degree. Consequently, with a sufficiently large sample, a significance test will almost always reject $H_0$, regardless of the substantive theory. This explains why Bem could achieve significance: with enough flexibility and sample size, detecting a non-zero deviation is trivial. This is a devastating critique of the habitual use of NHST to confirm theories. Does Bayesianism vindicate itself here? Only partially. A Bayesian test also favors $H_1$ if the effect is non-zero, unless the prior on $H_1$ is sufficiently skeptical or specific. If the alternative hypothesis is merely "not zero," the Bayesian suffers the same fate as the frequentist. The illumination here is that the problem lies not just in the calculus, but in the specification of the alternative hypothesis.

  **Task 3: Silence and Misdescription**

  Despite their theoretical strengths, both frameworks are silent on the primary drivers of the crisis: design integrity and reporting honesty. Neither prior probabilities nor long-run error rates can detect **fabricated data**. If a dataset is invented to satisfy a statistical threshold, it will pass both a $p$-value check and a Bayes Factor check. The crisis was driven largely by Questionable Research Practices (QRPs)—selective publication, hiding failed conditions, and post-hoc hypothesis generation. These are violations of the *assumptions* required for inference, not failures of the inference engines themselves.

  This leads to an awkward fact regarding **preregistration**, the reform most successful in mitigating QRPs. Preregistration is typically justified in frequentist terms: by fixing the sample size and analysis plan in advance, one preserves the validity of the sampling distribution and the $\alpha$ error rate. For a **subjective Bayesian**, this justification is opaque. According to the Likelihood Principle, the evidence in the data depends only on the observed values, not on the intentions of the experimenter or the stopping rule. Why, then, should a Bayesian care if the analysis was preregistered?

  The silence here is only apparent; the justification must be meta-statistical. A Bayesian conditions on the likelihood function. If a researcher engages in QRPs, the reported likelihood function is not the true likelihood of the data given the model; it is the likelihood of the data given the model *and* the selection process. Preregistration assures the Bayesian that the reported model matches the data generation process, preserving the integrity of the likelihood itself. Thus, while the *math* of Bayesian updating is indifferent to intention, the *epistemology* of trust requires transparency. Both frameworks require honest reporting to function, yet neither provides the internal machinery to enforce it.

  **Task 4: The Statistical Dispute**

  What does this episode show about the frequentist–Bayesian dispute? Three readings are available: (a) the crisis confirms Bayesianism; (b) the crisis indicts degenerate frequentist practice, not frequentism itself; (c) the crisis shows the philosophical dispute was orthogonal to the institutional failures.

  The episode best supports reading **(c)**, with significant concessions to **(b)**. The crisis was not caused by the use of $p$-values per se, but by an incentive structure that rewarded significant $p$-values regardless of their evidential quality. The reforms that worked—preregistration, registered reports, multi-lab consortia—are procedural and institutional, not philosophical. They restrict the researcher's degrees of freedom, which benefits both frameworks. The Bayesian reanalysis of Bem was diagnostic, but it did not solve the crisis; large-scale replication efforts (Many Labs), which rely heavily on frequentist meta-analysis and confidence intervals, did the heavy lifting of correcting the record.

  For reading **(a)** to be the right one, the history would have to show that widespread Bayesian adoption *prevented* the QRPs ex ante. This did not happen. Researchers can "p-hack" a Bayes Factor by trying different priors or models until the BF exceeds a threshold, just as they can with $p$-values. Unless the culture of skepticism changes, changing the statistic changes little.

  For reading **(b)** to be exclusively correct, strict adherence to frequentist rules would have had to prevent the crisis without needing Bayesian insights. If researchers had respected the assumptions of NHST (no optional stopping, no p-hacking), Bem's results likely would not have survived peer review even without Bayesian reanalysis. However, this ignores the Meehl critique: even "honest" NHST in low-power environments produces a literature of false positives due to the fragility of the null hypothesis.

  Ultimately, the Bem episode demonstrates that statistical philosophy is subordinate to research governance. The frequentist–Bayesian debate focuses on how to interpret data *given* a model. The replication crisis revealed that the model of the scientific process itself was broken. The reforms that fixed it did not choose a side in the inference wars; they imposed discipline on the data generation process, ensuring that whatever statistic is calculated reflects reality rather than researcher intention. The lesson for the seminar is not that one calculus is superior, but that no calculus can compensate for a system that incentivizes the manufacture of surprise.
