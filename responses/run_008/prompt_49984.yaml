answer: |-
  There is no single, universally standardized term that captures this exact failure mode in the context of heuristic rubrics, though pieces of it exist across different disciplines. In statistics, this is **multicollinearity** (when predictor variables in a model are highly correlated). In psychometrics, this is a lack of **discriminant validity** (when tests meant to measure different constructs actually measure the same thing). In economics, this is **endogeneity** (when an explanatory variable is correlated with the error term or determined by the system it is supposed to evaluate).

  However, none of these fully capture the specific dynamic you described: a rubric designed for discovery that instead recapitulates the history of prior discovery efforts, treating the *absence* of attention as an independent virtue rather than a dependent variable.

  Since no existing term fits cleanly, I propose we coin the term **"Criterion Endogeneity."**

  ### Definition: Criterion Endogeneity

  **Criterion Endogeneity** is a failure mode in multi-criterion decision analysis where the scoring criteria, formally treated as independent dimensions of value, are in fact causally linked through a shared historical mechanism (typically prior optimization or resource allocation by capable agents).

  This renders the mathematical combination of the criteria (e.g., multiplication) invalid, as it double-counts the same underlying signal. Crucially, it creates a perverse incentive structure where the rubric systematically overvalues options that have been implicitly vetted and rejected by the "market" of prior attention, under the false assumption that neglect is an exogenous feature rather than an endogenous outcome.

  ### Distinguishing Edges and Boundaries

  To distinguish **Criterion Endogeneity** from its nearest neighbors (Goodhart's Law and the Efficient Market Hypothesis) and to handle edge cases, we can map the boundaries as follows:

  1.  **Vs. Goodhart's Law:** Goodhart's Law states, "When a measure becomes a target, it ceases to be a good measure." This implies *gaming* or *optimization pressure* applied *after* the metric is introduced. Criterion Endogeneity occurs even in perfect good faith, *before* the metric is applied, because the criteria themselves are historical artifacts of prior optimization. Goodhart is about the future reaction to the rule; Criterion Endogeneity is about the past formation of the data.
  2.  **Vs. Efficient Market Hypothesis (EMH):** EMH suggests asset prices reflect all available information. If EMH holds perfectly, there is no alpha (no undervalued causes). Criterion Endogeneity is the *measurement error* that occurs when you try to use a rubric to find alpha in a market that is already semi-efficient. EMH describes the world; Criterion Endogeneity describes the flaw in your map of that world.
  3.  **Partial Endogeneity (The Edge Case):** You asked what to say if only two factors are entangled (e.g., Neglectedness and Tractability correlate, but Importance is truly independent). This is **Partial Criterion Endogeneity**. The rubric is not useless, but the weighting must be adjusted. You cannot treat the factors as orthogonal multipliers; you must treat the entangled pair as a single composite dimension.
  4.  **Inverse Endogeneity (The "Blind Spot" Case):** You asked about the case where neglect is evidence of a genuine blind spot (correlation runs opposite). This is **Market Inefficiency** or **Alpha**. Criterion Endogeneity assumes the "market" of prior researchers was competent and rational. If the prior attention was misguided (e.g., social stigma, paradigm blindness), then neglect *is* a valid independent signal. The failure mode only exists if the prior neglect was rational.

  ### Patches for the Workshop

  You cannot simply tell students to "be more independent" in their scoring. The correlation is in the world, not just in their heads. To patch the exercise without abandoning ITN, consider these structural changes:

  **1. Switch from Multiplication to Filtering (The "Gate" Method)**
  Multiplication implies that a high score in Neglectedness can mathematically compensate for a low score in Tractability. If Neglectedness and Tractability are endogenous, this compensation is fake.
  *   **Patch:** Use ITN as a series of thresholds, not a calculator. A cause must meet a minimum threshold for Importance and Tractability *before* Neglectedness is even considered. Neglectedness becomes a tie-breaker among viable options, not a multiplier that rescues intractable ones.

  **2. Explicitly Model the "Quality of Neglect"**
  Acknowledge the endogeneity openly in the worksheet. Add a sub-column to Neglectedness called **"Reason for Neglect."**
  *   **Patch:** Students must categorize neglect as either *Structural* (hard to solve, low ROI, smart people left) or *Accidental* (boring, unfashionable, new data). Only *Accidental* Neglect gets a high score. This forces the group to debate the *causality* of the neglect rather than just counting heads.

  **3. Bayesian Priors on Tractability**
  The problem is that Tractability gets "nudged" to fit priors.
  *   **Patch:** Before discussing Neglectedness, have students lock in Tractability estimates based on *technical* constraints alone (e.g., "Is there a known mechanism to solve this?"). Once Tractability is locked, reveal the Neglectedness data. This prevents the "smart people left, so it must be hard" heuristic from silently lowering the Tractability score.

  **4. The "Counterfactual Crowd" Test**
  To break the correlation between Neglectedness and Tractability/Importance:
  *   **Patch:** Ask students to score Neglectedness not as "How many people are working on this?" but as "How many people *should* be working on this, given its Importance and Tractability?" This reframes Neglectedness from a raw headcount (which is endogenous) to a gap analysis (which is exogenous). A cause with 100 people might be highly neglected if it *should* have 10,000. A cause with 0 people might be crowded if it *should* have 0.

  ### Summary for Your Students
  If you introduce this to your workshop, you might say:
  > "We are watching out for **Criterion Endogeneity**. This happens when the three columns aren't actually three separate questions, but three different ways of asking 'How much attention has this already gotten?' If we multiply them, we aren't getting a more accurate score; we're just magnifying the history of past decisions. To fix this, we treat Neglectedness as a tie-breaker, not a multiplier, and we ask *why* a cause was neglected before we reward it."

  This preserves the utility of the framework (it forces structured thinking) while inoculating against the statistical collapse you have observed.
