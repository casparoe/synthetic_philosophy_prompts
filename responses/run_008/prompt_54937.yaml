      *   **Task:** Stress-test this position. Act as a specialist (philosopher of mind/anthropics). No generic summaries. No "it depends." Commit to a stance. Rank defeaters. Answer two specific closing questions (Survive/Patch/Abandon? Defensible/Special Pleading?).
      *   **Tone:** Rigorous, engaged, peer-to-peer, critical but charitable. Avoid low-hanging fruit ("computers are expensive").

