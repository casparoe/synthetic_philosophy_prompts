answer: |-
  You have put your finger on a very real, very frustrating, and philosophically rich phenomenon. You are not "smooshing" things together accidentally; you have identified a tension that sits right at the intersection of **social epistemology**, **linguistic pragmatics**, and **psychology**.

  To answer your first question directly: **There is no single, universally agreed-upon noun for this specific social violation.** However, there is a cluster of established concepts that describe its components. If we were to coin a term for the specific normative violation you are describing, the most precise label would be **"Epistemic Overcommitment."**

  Here is the breakdown of the literature, the distinction between the phenomena you've noticed, and how this relates to the norms of assertion.

  ### 1. Is there a name? (The Existing Literature)

  While no single word captures the *social blame* aspect perfectly, three fields describe the components of what you are seeing:

  **A. Psychology: "Calibration"**
  In the psychology of judgment and decision-making, the match between a person's confidence and their actual accuracy is called **calibration**.
  *   **Well-calibrated:** "I'm 80% sure" happens to be right 80% of the time.
  *   **Poorly calibrated (Overconfident):** "I'm 100% sure" is right only 60% of the time.
  Your flatmate was *miscalibrated*. Your hedging friend is likely *underconfident* (or at least, her expressed confidence matches her low reliability). The annoyance you feel is a social reaction to **epistemic miscalibration**.

  **B. Philosophy of Language: "The Maxim of Quality"**
  Paul Grice's cooperative principle includes the **Maxim of Quality**: "Try to make your contribution one that is true." This is usually broken into two sub-maxims:
  1.  Do not say what you believe to be false.
  2.  **Do not say that for which you lack adequate evidence.**
  Your flatmate violated sub-maxim #2. He believed it (so he didn't lie), but he lacked adequate evidence to assert it *flatly*. The hedge ("I think") functions as a marker that the speaker knows they are violating the standard evidence threshold for a flat assertion.

  **C. Social Epistemology: "Epistemic Vigilance"**
  Dan Sperber and colleagues argue that humans have evolved **epistemic vigilance**. We don't just listen to information; we monitor the *source*. We are specifically tuned to detect speakers who claim more competence than they possess, because following an overconfident leader gets you killed (or, in your case, locked out of the pharmacy). The blame is a punitive mechanism to enforce honest signaling of competence.

  ### 2. Is it one phenomenon or several?

  You asked if you are accidentally smooshing things together. You are actually observing **two distinct mechanisms** that produce the same social result. It is crucial to separate them to understand why the blame lands where it does.

  **Mechanism 1: The Semantic Shift (What was said?)**
  *   **Flat Assertion:** "The pharmacy closes at 9."
      *   *Proposition:* The pharmacy closes at 9.
      *   *Truth Condition:* False (since it closed at 8).
      *   *Result:* The speaker is factually wrong.
  *   **Hedged Assertion:** "I *think* the pharmacy closes at 9."
      *   *Proposition:* This is debated (see below), but often interpreted as: "My current belief state is that the pharmacy closes at 9."
      *   *Truth Condition:* True (since the friend *did* think that).
      *   *Result:* The speaker is factually correct about their own mind, even if the world is different.

  **Mechanism 2: The Normative Shift (What was promised?)**
  Even if we treat both sentences as asserting the pharmacy hours, the *commitment* differs.
  *   **Flat Assertion:** Implicates "I have verified this" or "I know this."
  *   **Hedged Assertion:** Implicates "I am recalling this from memory and might be wrong."

  **The Verdict:** You are observing **Mechanism 2** primarily. If it were only Mechanism 1, your partner wouldn't have been livid about the directions; she would have just corrected you. She was livid because you led her to rely on you as an *authority*, and you failed to be one. That is a breach of trust, not just a breach of fact.

  ### 3. The Hedge: Does it change the content?

  This is a classic debate in linguistics and philosophy of language.

  *   **The Semantic View:** The hedge changes the **truth conditions**. "I think P" is not the same as "P". If I say "I think P" and P is false, I haven't lied, because I accurately reported my mental state. This explains why your friend escapes blame: she literally didn't assert the fact, she asserted her uncertainty *about* the fact.
  *   **The Pragmatic View (Standard):** The hedge modifies the **illocutionary force**, not the content. Both speakers are putting "The pharmacy closes at 9" on the table for discussion. However, the flat speaker invites you to add it to your "common ground" (your set of accepted facts) immediately. The hedging speaker invites you to add it tentatively.

  **Why this matters for blame:**
  If the Pragmatic View is correct (which most linguists favor for casual conversation), then your friend *did* assert the false thing, but she **warned you** not to bet the house on it. Your flatmate asserted the false thing and **told you to bet the house on it.** The blame is for the bad advice regarding the *risk*, not just the *outcome*.

  ### 4. Relation to Norms of Assertion

  You mentioned the debate between the **Knowledge Norm** (Williamson: You must know P to assert P) and the **Justified Belief Norm** (Lackey/others: You must reasonably believe P).

  Your observation highlights a flaw in treating these norms as binary (On/Off). In reality, assertion is **gradable**.

  *   **The Knowledge Norm Problem:** Under a strict Knowledge Norm, *both* your flatmate and your friend violated the norm (neither *knew* the hours). So why is the flatmate blamed more?
  *   **The Solution: Assertoric Strength.**
      Recent work in epistemology (e.g., by Jennifer Lackey or in discussions of "partial belief") suggests that assertion carries a **warrant requirement proportional to its strength.**
      *   To assert "P" (flatly), you need Warrant Level 10.
      *   To assert "Probably P" or "I think P", you need Warrant Level 5.

  Your flatmate claimed Warrant Level 10 while possessing Warrant Level 5. Your friend claimed Warrant Level 5 while possessing Warrant Level 5.
  **The violation is not asserting a falsehood; it is claiming a warrant you do not possess.**

  ### 5. Coining the Concept: "Epistemic Overcommitment"

  Since you asked for a careful definition if one doesn't exist, here is a proposal for the specific term that captures your intuition.

  **Term:** **Epistemic Overcommitment**
  **Definition:** The act of expressing a degree of confidence in a proposition that exceeds the speaker's actual epistemic warrant, thereby inducing a level of reliance in the listener that is not justified by the evidence.

  **Edges and Boundaries:**
  1.  **Distinct from Lying:** The speaker must believe the proposition. If they don't believe it, it's deception, not overcommitment.
  2.  **Distinct from Error:** Simple error is being wrong despite having appropriate confidence. Overcommitment is being wrong *because* (or while) claiming inappropriate confidence.
  3.  **Distinct from Bullshitting:** (Harry Frankfurt's definition). Bullshit is indifference to truth. Overcommitment cares about truth but misjudges the relationship between belief and fact.
  4.  **The "Hedge" Defense:** Using epistemic modals ("might," "think," "probably") reduces the level of commitment. If the warrant matches the reduced commitment, overcommitment has not occurred, even if the content is false.

  ### Summary for your arguments

  When you argue with your partner or flatmates, you can now frame it this way:

  1.  **It's not about being wrong.** Everyone is wrong sometimes.
  2.  **It's about risk allocation.** When you speak flatly ("The road is closed"), you are absorbing the risk of error. You are telling the listener, "You can stop checking; I have checked."
  3.  **The blame is for the transfer of risk.** When you are wrong after speaking flatly, you have transferred the cost of your error to the listener (who got lost). When your hedging friend is wrong, she kept the risk on herself (she told you she wasn't sure, so if you got lost, it's partly on you for trusting a hedge).

  The philosophical term for what your flatmate violated is the **Gricean Maxim of Quality (Evidence Clause)**, but the social phenomenon is **Epistemic Overcommitment**. You are right to feel that the "tone of certainty" is the actual offense; in social epistemology, confidence is a currency, and spending confidence you don't have is a form of fraud.
