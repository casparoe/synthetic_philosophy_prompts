      *   *Tension B (Consent/Agency):* Verdict 5 relies on consent. Verdict 1, 3, 6 involve non-consenting parties (characters, children).
      *   *Tension C (Existence):* Verdict 6 allows creating life with grief. Verdict 1 suggests severe suffering makes a world worse regardless of total happiness. If life *necessarily* entails some risk of threshold-crossing suffering, is creation permissible?
      *   *Tension D (Aggregation):* Verdict 4 rejects aggregation of mild pains to equal severe pain. Verdict 2 allows mild pain to be traded for happiness.

  4.  **Formulate the Principle (Brainstorming):**
      *   *Candidate 1: Lexical Threshold Negative Utilitarianism (LTNU).* Severe suffering cannot be outweighed by happiness. Mild suffering can.
