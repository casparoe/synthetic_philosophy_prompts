      *   *Best Fit:* A hybrid view. **Lexical Threshold Negative Utilitarianism with Consent Exceptions and a "Normal Risk" Clause for Procreation.**

      *Let's refine the principle:*
      1.  **The Threshold:** Suffering above intensity $I$ cannot be outweighed by happiness.
      2.  **The Aggregation Block:** Suffering below intensity $I$ cannot aggregate to exceed $I$.
      3.  **The Consent Exception:** If the sufferer consents, the threshold constraint is relaxed (allows trade-off).
