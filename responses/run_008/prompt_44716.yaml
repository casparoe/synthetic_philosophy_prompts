      *   *Verdict 3 (Depression):* The user says "my own first verdict forbids me that comfort." I need to confirm this. If Torture is forbidden, is Depression forbidden? Only if Depression >= Torture. I should suggest the principle requires a distinction between "Meaningless/Extreme" suffering and "Meaningful/Human" suffering. This risks ad-hocery.
