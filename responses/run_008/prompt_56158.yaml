answer: |-
  This is a fascinating intersection. You are essentially asking for a system identification problem where the variable of interest is explicitly excluded from the system dynamics. As a control theorist, your instinct is correct: the setup feels like a violation of the realizability conditions for a state-space model.

  Here is the translation, the residue analysis, and my position on what the breakdown tells us.

  ### 1. The Control-Theoretic Translation

  Let's formalize the Epiphenomenalist claim using standard state-space notation. We are dealing with two distinct state vectors.

  **The Physical Plant ($\Sigma_P$):**
  This is the brain/body.
  $$ \dot{x}_p = A_p x_p + B_p u $$
  $$ y = C_p x_p $$
  *   $x_p \in \mathbb{R}^n$: Physical neural states (membrane potentials, firing rates).
  *   $u$: Sensory inputs.
  *   $y$: Behavioral outputs (including speech acts like "I am in pain").

  **The Phenomenal Shadow ($\Sigma_Q$):**
  This is the qualia.
  $$ \dot{x}_q = f(x_p) $$
  $$ \text{Causal Power} = 0 $$
  *   $x_q \in \mathbb{R}^m$: Phenomenal states (the redness of red, the hurt of pain).
  *   Crucially, $x_q$ does **not** appear in $\dot{x}_p$. There is no feedback matrix $K$ such that $\dot{x}_p = \dots + K x_q$.
  *   Crucially, $x_q$ does **not** appear in $y$. The output map is $C_p$, not $C_q$.

  **The Paradox of Phenomenal Judgment in Control Terms:**
  You (the operator/observer) observe the output $y(t)$. Specifically, you observe a speech act $y_{report} \subset y$ which encodes the proposition: *"The state $x_q$ has value $v$."*

  In a standard observer design (like a Luenberger observer or Kalman Filter), for $y$ to carry information about a state variable, that variable must be **observable**.
  The Observability Matrix $\mathcal{O}$ for the combined system would look like this:
  $$ \mathcal{O} = \begin{bmatrix} C \\ CA \\ \vdots \\ CA^{n-1} \end{bmatrix} $$
  If $x_q$ is epiphenomenal, it is decoupled from the $A$ matrix governing $x_p$, and it is absent from $C$. Therefore, the rank of the observability matrix with respect to $x_q$ is zero. $x_q$ is an **unobservable mode**.

  **The Contradiction:**
  1.  **Epiphenomenalism:** $x_q$ is unobservable from $y$ (Transfer function from $x_q$ to $y$ is zero).
  2.  **Phenomenal Judgment:** The signal $y$ contains high mutual information with $x_q$ (specifically, semantic reference).
  3.  **Control Constraint:** You cannot generate a signal $y$ that tracks $x_q$ unless there is a causal path (direct or via common dynamics) allowing information flow from $x_q$ to $y$.

  **Your Intuition Check:**
  You suggested: *"Qualia as state components that never appear in the state-update equation but somehow show up in the output equation."*
  *   **Verdict:** This violates the epiphenomenalist constraint. If $x_q$ is in the output equation ($y = C_p x_p + C_q x_q$), it is causally efficacious in generating the physical signal $y$. That is interactionism, not epiphenomenalism.

  You suggested: *"Pre-established-harmony story about synchronized duplicate states."*
  *   **Verdict:** This is the only mathematically consistent translation. It implies that the dynamics $A_p$ are structured such that the trajectory of $x_p(t)$ perfectly mirrors the trajectory of $x_q(t)$ without coupling.
  *   **The Control Problem:** This requires infinite precision in the initial conditions ($x_p(0)$ and $x_q(0)$) and the plant matrix $A_p$. Any noise or perturbation in $x_p$ would cause the trajectories to diverge (Lyapunov instability). For the report $y(x_p)$ to remain accurate about $x_q$ over a lifetime, the system must be robustly stable despite having no feedback correction from $x_q$. In control terms, this is an **open-loop tracking system with zero error despite model uncertainty.** That is physically impossible for any non-trivial plant.

  ### 2. The Residue Report

  Here is what survives the translation and what gets lost.

  **Translates Cleanly:**
  *   **Causal Inertness:** This maps perfectly to a state variable with no column in the $A$ matrix feeding back into other states and no row in the $C$ matrix affecting outputs. It is a "sink" node in the signal flow graph.
  *   **Correlation:** The common drive ($u \to x_p$ and $x_p \to x_q$) explains statistical correlation without causal feedback.
  *   **The Paradox:** It translates as an **Information-Theoretic Violation**. The channel capacity from $x_q$ to $y$ is zero, yet the mutual information $I(x_q; y_{report})$ is reported as high.

  **Translates with Distortion:**
  *   **"Aboutness" (Intentionality):** In control theory, $y$ is a vector of numbers. It is not "about" $x_q$ unless an external interpreter assigns meaning. The paradox relies on the report *meaning* something. Control theory handles syntax (signals), not semantics (meaning). We can model a signal *correlating* with a state, but not a signal *referring* to a state.
  *   **Reliability:** In engineering, reliability is a function of gain margins and noise rejection. In philosophy, the "reliability" of phenomenal judgment is often treated as immediate and infallible (incorrigibility). Mapping "infallible first-person access" to "high-gain feedback loop" distorts the phenomenological claim into a performance metric.

  **No Expression in Control Vocabulary:**
  *   **The Ontological Status of $x_q$:** Control theory is agnostic to ontology. A state variable is defined by its role in the dynamics. If $x_q$ has no role in the dynamics (no input, no output, no feedback), **it is not a state variable in the control sense.** It is a mathematical ghost. Control theory has no container for "existing but functionally null."
  *   **The "What It Is Like":** The actual texture of the qualia. Control theory models the *structure* of information processing, not the *content* of experience.

  ### 3. Candidate Readings

  Before I commit to a position, let's brainstorm three ways to interpret this translation failure.

  **Candidate A: The "Bad Model" Reading**
  The epiphenomenalist model is simply a bad plant model. In reality, $x_q$ *must* be in the $A$ matrix or $C$ matrix for the system to be identifiable. The paradox proves epiphenomenalism is false because it posits a system structure that is unrealizable in a noisy, physical universe. (This is the Daniel Dennett / Illusionist take).

  **Candidate B: The "Category Error" Reading**
  Control theory defines "existence" functionally (to be is to do). Philosophy of mind (specifically property dualism) defines "existence" ontologically (to be is to be experienced). The paradox arises because you are trying to put an ontological object into a functional box. The "Residue" isn't missing data; it's a type mismatch. $x_q$ isn't a state variable; it's a property of the *observation* of the state variable.

  **Candidate C: The "Information Structure" Reading**
  Perhaps $x_q$ isn't a state, but a specific *encoding* of $x_p$. The paradox dissolves if we view $y_{report}$ not as tracking $x_q$, but as $x_p$ accessing its own internal encoding. The "feeling" is just the data format. The paradox only exists if we reify the data format into a separate shadow system $\Sigma_Q$. (This is the Physicalist/Identity Theory take).

  ### 4. My Position

  I am going to argue for a modified version of **Candidate B (The Category Error)**, but with a specific control-theoretic twist.

  **The Verdict:**
  The residue points to the debate being **less substantive than it looks from the inside**, but not for the reason physicalists usually claim. It is less substantive because the "Paradox of Phenomenal Judgment" relies on a definition of "state" that control theory rejects as incoherent.

  In control engineering, **a state is defined by its causal footprint.** If you claim a variable exists but has zero footprint on the future evolution of the system or its outputs, you are claiming it is not part of the minimal realization of the system. By Kalman's decomposition, such states are irrelevant to the input-output behavior.

  The Epiphenomenalist wants to have it both ways:
  1.  $x_q$ is real (Ontological claim).
  2.  $x_q$ has no causal power (Functional claim).
  3.  We know $x_q$ exists via reports (Observability claim).

  In control theory, (2) and (3) are mutually exclusive. If you can report it (3), it affects the output, so it has causal power (violating 2). If it has no causal power (2), you cannot report it (violating 3).

  **Why the debate persists:**
  The debate persists because philosophy allows for "non-causal existence" (ontology without function). Control theory does not. When you translate the problem into your vocabulary, the epiphenomenalist position collapses into a **realizability error**. The "Paradox" is simply the engineer looking at a block diagram and saying, "This signal line is disconnected; why does the meter read it?"

  The Epiphenomenalist answers: "Because the meter *is* the signal."
  The Engineer answers: "Then it's not a meter reading a signal; it's the signal itself."

  This suggests the "Paradox" is a linguistic confusion between *reference* (the report) and *presentation* (the experience). Control theory forces you to distinguish the sensor from the signal. If they are the same thing, there is no "tracking" problem, and the paradox dissolves.

  ### 5. Failure Modes & Flipping the Verdict

  **Where this translation breaks:**
  It breaks if **Information** is more fundamental than **Causation**.
  Control theory is causal. If the universe allows for non-causal information transfer (which sounds mystical, but is essentially what the epiphenomenalist needs), my model fails.
  More realistically, it breaks if **Intentionality** cannot be reduced to signal correlation. If "aboutness" is a primitive property of the universe that doesn't require a causal channel, then the Observability Matrix is the wrong tool. You would need a "Semantic Observability Matrix," which doesn't exist.

  **What would flip my verdict:**
  I would change my mind if you could demonstrate a **control instability** that is resolved *only* by positing the causal efficacy of qualia.
  *   *Scenario:* You design a flight controller. It works perfectly until you account for the "pilot's experience of stress." Once you model the stress qualia as a feedback state $x_q$ entering the $A$ matrix, the system becomes stable.
  *   *Implication:* This would prove qualia are not epiphenomenal. They are controllable/observable modes necessary for system stability.
  *   *Current Status:* We have no evidence for this. Neuroscience suggests we can explain behavior entirely with $x_p$.

  **Final Advice for your Toolkit:**
  Don't try to model qualia as a state vector $x_q$. Model them as the **cost function** $J$.
  *   The brain ($x_p$) optimizes a trajectory.
  *   Qualia are not the state; they are the *value* of the state relative to the objective function (pain = high cost, pleasure = low cost).
  *   This preserves the "feeling" (the magnitude of the cost) without requiring a shadow state.
  *   The "Paradox" then becomes: "Why does the optimizer report the value of the cost function?"
  *   Answer: Because the cost function is internal to the optimizer. It's not tracking an external variable; it's reading its own register.

  This moves you from Epiphenomenalism (Shadow State) to Functionalism (Cost Function). It solves the causal closure problem because the cost function *does* drive the update law ($\dot{x} = -\nabla J$).

  **Summary:** The paradox is a "Realizability Violation." You are trying to observe a mode that, by definition, has been canceled out of the transfer function. The only way to resolve it without magic is to admit the mode was never canceled—it was just misidentified as a shadow state when it was actually part of the controller's internal cost landscape.
