      *   **Goal:** A decision procedure (sequence of questions) to run at the whiteboard. Needs to be short (15 mins per claim), accessible (no jargon), and explicit about where science stops and values begin. It must also acknowledge where the procedure might misfire (not mechanical).
      *   **Task:**
          1.  Write the procedure as continuous prose (no headings, bullets, bold, tables), like a long letter to a colleague.
          2.  Run the procedure on three specific claims:
              *   Incest taboo (inbreeding avoidance).
              *   Purity judgments (pathogen avoidance).
              *   Factory farming/animal suffering (empathy for offspring).
          3.  Address the "self-defeat" objection (if evolution debunks morality, does it debunk belief in evolution/perception too?).
      *   **Constraints:** American English, no formatting (bold/headers/etc.), plain language (translate jargon), suitable for a 90-minute session (max 2 claims, but I need to demonstrate 3 + the self-defeat issue in the explanation).

  2.  **Deconstruct the Philosophical Issue:**
      *   The core issue is the *genetic fallacy* vs. *evolutionary debunking arguments*.
      *   *Genetic Fallacy:* Judging a belief based on its origin rather than its merit. Just because X caused belief Y doesn't mean Y is false.
      *   *Evolutionary Debunking:* If evolution shaped our moral beliefs for survival, not truth, then we have no reason to trust them as tracking objective moral facts (Street's dilemma).
      *   *The Distinction:* Explanation of origin vs. Justification of truth.
      *   *The Procedure Needs:*
          1.  Identify the causal claim (Did evolution shape this?).
          2.  Identify the normative claim (Does this origin invalidate the reason?).
          3.  Check for independence (Is there a reason for the belief *other* than the instinct?).
          4.  Check for self-defeat (Does this logic destroy science too?).
          5.  Identify the "is-ought" gap (Where science stops).

  3.  **Drafting the Procedure (Mental Outline):**
      *   Step 1: The Origin Story. What is the scientific explanation?
      *   Step 2: The Leap. Does the article say "because it evolved, it's false"?
      *   Step 3: The Independent Reason. Can we give a reason for the belief that doesn't rely on the instinct? (e.g., Incest causes harm, not just "yuck").
      *   Step 4: The Self-Check. If we distrust instincts here, do we distrust them everywhere (vision, logic)?
      *   Step 5: The Stop Sign. When do we admit science can't answer the "should"?

  4.  **Drafting the Content (incorporating constraints):**
