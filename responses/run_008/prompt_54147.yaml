answer: |-
  Dear Colleague,

  It is a pleasure to hear from someone who has navigated the transition from the empirical rigors of evolutionary biology to the conceptual tangledness of moral philosophy. I know exactly the dynamic you are describing in your discussion group. It is a very common reaction when scientifically literate people first encounter evolutionary explanations for moral intuitions. They see the machinery of natural selection behind the curtain of their convictions and assume the convictions must therefore be puppets. You are right to sense that there is a distinction between explaining why someone holds a belief and showing that the belief is false, but as you have found, simply stating that distinction is often not enough to stop the momentum of the debunking argument. What you need is a tool that slows the conversation down and forces the group to separate the causal story from the justificatory story. I have put together a sequence of questions that should serve this purpose. It is not a magic wand that will solve ethical disputes, but it is a filter designed to catch the specific logical error of assuming that origin determines validity. I will describe the procedure first, and then we will walk through the three cases you mentioned, including the tricky one about animal suffering and the meta-worry about evolution itself.

  The procedure consists of four questions that you should write on the whiteboard in order whenever a member brings forward a claim that science has debunked a moral belief. The first question is the Causal Question. Ask the group to state clearly what the scientific explanation is for why humans hold this belief. In the cases you described, the answer is usually something like natural selection favored this intuition because it increased reproductive success or survival. For the group to move to the next step, everyone must agree on this causal story. If the science is disputed, you are still doing biology, not philosophy, so pause there until the empirical claim is settled or bracketed. The second question is the Leap Question. Ask the group to state exactly why this causal story is supposed to make the moral belief false or unjustified. Usually, the implicit premise here is that if a belief is useful for survival, it cannot also be true, or that if a belief comes from an instinct, it cannot be based on reason. You need to make this premise explicit. The third question is the Independence Question. This is the most critical step. Ask the group whether there is a reason to hold the moral belief that is independent of the evolutionary instinct. In other words, even if we did not have the instinct, would there still be a good argument for the belief? If the answer is yes, the evolutionary origin is irrelevant to the truth of the belief. If the answer is no, then the evolutionary explanation poses a real challenge. The fourth and final question is the Mirror Question. Ask the group whether applying this same logic to our scientific or perceptual beliefs would destroy our ability to trust anything, including the evolutionary theory they are using to debunk the morality. If the logic destroys the tool used to apply it, the logic is self-defeating. You should tell your group that if they get through all four questions and still feel uneasy, that unease is legitimate philosophy, not a failure of the procedure. The procedure clarifies the battlefield; it does not necessarily win the war.

  Let us apply this to the first case you mentioned, the claim that the incest taboo is just inbreeding avoidance dressed up as a rule. When you run the Causal Question, your group will likely agree that evolutionary biology suggests we have an instinctive aversion to mating with close kin to avoid deleterious recessive traits. That is a solid causal story. When you move to the Leap Question, the claim is that because this aversion is biological, the moral rule against incest is an illusion. Here is where you pause. Now ask the Independence Question. Can we give a reason for condemning incest that does not rely on the instinct? Most people can. We can point to the harm caused to offspring, the power dynamics within families, or the disruption of social structures. If the group agrees that incest is wrong because it causes harm, then the evolutionary origin of the disgust feeling is just the mechanism that alerts us to the harm, not the justification for the rule. The science explains the feeling, but the ethics rests on the harm. However, you should note where the procedure might misfire here. If a member argues that the harm is only bad because we evolved to care about our genetic lineage, then the Independence Question fails, and we are back to square one. The procedure reveals that the real disagreement is not about biology, but about whether harm is objectively bad. That is where you draw the line and tell them science cannot answer that part.

  Now consider the second case, the claim that purity judgments are just pathogen-avoidance instincts. This is a harder case than incest. Run the Causal Question. The science suggests that feelings of disgust evolved to keep us away from rotting food and disease. The Leap Question suggests that because disgust is a survival mechanism, moralizing about purity is irrational. Now ask the Independence Question. Is there a reason to avoid certain acts independent of the feeling of disgust? In cases of hygiene, yes, because of disease. But often purity moralization extends to things that are harmless, like certain foods or consensual sexual acts that people merely find icky. Here the procedure should show the group that the evolutionary explanation successfully debunks the moral belief only when there is no independent reason for the rule. If the only reason a group condemns a food is that it feels gross, and the grossness is explained by pathogen avoidance, then the moral rule is indeed on shaky ground. But if there is a health reason, the instinct is a useful guide. This is a good place to show the group that the procedure does not always vindicate morality. Sometimes science does show that a moral belief is just a fossilized instinct with no current justification. The procedure allows for that outcome, which gives it credibility.

  The third case is the one you expect to cause trouble, the claim that opposition to factory farming is debunked because empathy evolved only for kin selection. Run the Causal Question. The science says our capacity for empathy evolved to help us care for offspring and allies, not strangers or other species. The Leap Question claims that because empathy is limited and evolved for utility, extending it to animals in factories is a mistake. Now ask the Independence Question. Why do we think factory farming is wrong? Is it only because we feel empathy? Or is it because the animals suffer? If the group says it is wrong because suffering is bad, then the evolutionary origin of empathy is irrelevant. Empathy is just the sensor that detects the suffering. The fact that the sensor evolved for a different purpose does not mean what it detects is not real. However, if a member argues that suffering is only bad because we evolved to care about it, then the Independence Question fails. This is where you will see the disagreement you anticipated. The procedure forces them to admit that their stance on animal rights depends on whether they believe suffering is objectively bad or just subjectively disliked. You should warn your group that this is the stop sign. If they cannot agree on whether suffering is bad independent of evolution, no amount of evolutionary data will settle it. This is the point where the question stops being scientific and becomes a values question. The procedure has done its job by locating the exact point of disagreement.

  Now we must address the hardest case, the member who objects that by this same logic, evolution debunks our belief in evolution. This is the Mirror Question in action, and it is the most important safeguard your procedure has. If a member argues that our cognitive faculties evolved for survival, not truth, and therefore we cannot trust our belief in evolution, you must ask them whether they apply this standard to their own perception. Do they distrust their eyes when they see a car coming because vision evolved for survival? Usually, they will say no. The procedure requires you to ask why morality is treated differently than perception. One possible answer is that perception tracks physical reality which impacts survival directly, whereas morality tracks abstract values which might not. But a better answer, which you should offer, is that we have independent checks for perception. We can cross-verify sight with touch, or with instruments. For moral beliefs, we check them against reason and consistency. If the evolutionary debunking argument destroys our trust in logic itself, it destroys the argument used to debunk morality. You should tell your group that if the procedure leads them to distrust all reasoning, the procedure has misfired because it is self-defeating. However, you must also be honest about where the procedure cannot help. It cannot prove that moral truths exist in the same way physical truths exist. It can only show that the evolutionary origin of a belief is not sufficient proof that the belief is false. If a member insists that only beliefs with survival value can be true, they have adopted a philosophical stance called pragmatism, and you should tell them that is a choice they are making, not a fact science has discovered.

  There are a few places where you need to warn the group that the procedure is not mechanical. The first is the Independence Question. Determining whether a reason is independent of evolution is itself a philosophical judgment. For example, is the belief that logic is valid independent of evolution? Some philosophers say no. If your group gets stuck there, acknowledge it. Tell them they have reached the bedrock of metaphysics and that reasonable people disagree. The second place is the Leap Question. Sometimes the evolutionary explanation does undermine the belief, as in the purity case where there is no health risk. The procedure should not be used to shield all moral beliefs from science. Its purpose is to prevent the automatic assumption that origin equals falsehood. You should encourage your group to use the procedure to map the argument, not to win it. If they finish the four questions and still feel that the moral belief is an illusion, that is a valid philosophical position, provided they have accepted the consequences for their other beliefs via the Mirror Question.

  I suggest you print this sequence out or keep it on a card when you facilitate. When someone brings a news story, write the four questions on the board before anyone argues about the morality itself. Force them to fill in the blanks. What is the cause? What is the leap? Is there an independent reason? Does this break science? You will find that this slows the conversation down enough for the non-philosophers to see the structure of the argument. It respects their scientific literacy while introducing them to philosophical rigor. It also protects you from having to be the arbiter of truth. You are just the arbiter of the procedure. If they argue about whether suffering is objectively bad, you can point to the Independence Question and say that this is where the science stops and the ethics begins. That is a valuable lesson in itself.

  I hope this serves your group well. It is a wonderful thing you are doing, helping people navigate the intersection of their scientific understanding and their lived values. The fact that they are wrestling with these questions shows that the retirement years can be just as intellectually vigorous as the career years. Do not worry if the discussions end without consensus. In philosophy, a clear disagreement is often more valuable than a muddy agreement. If the procedure helps them understand exactly why they disagree, you have succeeded.

  Warmly,

  Your Colleague
