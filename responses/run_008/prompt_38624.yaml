answer: |-
  Treat the patient's self-report as definitive evidence of their subjective experience, distinct from the clinical verification of its cause or the eligibility for specific treatments.

  **Reasoning**
  This rule derives from the epistemological distinction between *testimonial credibility* (is the speaker truthful about their experience?) and *clinical pathology* (is there a biological lesion?). Pain is inherently private; only the patient has direct access to the qualia of their suffering. When a clinician dismisses a report because it lacks objective markers or conflicts with a patient's identity (e.g., "drug seeker," "histrionic," "non-compliant"), they commit *testimonial injustice*, weighting the speaker's social identity over their spoken word. The procedure below separates the validation of suffering from the authorization of controlled substances, preventing the nurse's need for diagnostic certainty from erasing the patient's reality. It forces a pause between the instinct to discount and the act of recording, ensuring that skepticism is directed at the *etiology*, not the *experience*.

  **The Intake Procedure**

  1.  **Internal Bias Check (Pre-Interview)**
      *   **Action:** Read the chart flags (lost scripts, normal workups, demographics).
      *   **Required Thought:** "This flag explains my risk management, not the patient's truth."
      *   **Stop Condition:** If you cannot mentally separate safety concerns from belief in the patient's suffering, pause and consult a senior nurse before proceeding.

  2.  **Question 1: Phenomenological Mapping**
      *   **Ask:** "In your own words, what does it feel like?" (Do not offer multiple-choice descriptors yet).
      *   **Sufficient Answer:** Any description that conveys quality, even if non-medical (e.g., "like glass," "heavy," "burning," "empty").
      *   **Insufficient Answer:** "It hurts" without elaboration, or answers that seem rehearsed from a menu.
      *   **Correction:** If the answer is insufficient, ask: "If you had to explain it to someone who never felt pain, what would you say?"
      *   **Philosophical Check:** If the vocabulary mismatches the textbook, record the metaphor exactly; do not translate it into clinical terms yet.

  3.  **Question 2: Functional Corroboration**
      *   **Ask:** "What is one thing you could do last month that you cannot do today because of this?"
      *   **Sufficient Answer:** A specific loss of function (e.g., "I cannot hold a coffee cup," "I sleep two hours," "I stopped driving").
      *   **Insufficient Answer:** Vague generalities ("Everything is hard") without specific examples.
      *   **Stop Condition:** If no functional loss is described despite claims of incapacitating pain, flag for clinician review regarding somatic symptom disorder, but do not mark the patient as lying.

  4.  **Decision Point: Credibility vs. Eligibility**
      *   **Action:** Assign two separate scores.
          *   *Credibility of Suffering:* (High/Low) Based on Steps 2 & 3.
          *   *Eligibility for Controlled Substances:* (Yes/No) Based on clinic policy and chart flags.
      *   **Rule:** A patient can have High Credibility of Suffering and No Eligibility for Controlled Substances.
      *   **Referral Trigger:** If Credibility is High but Objective Data is Low (normal tests), refer to clinician for non-opioid pain management or complex care workup. Do not discharge as "normal."

  5.  **Final Documentation Check**
      *   **Action:** Review your notes.
      *   **Required Check:** Have you used words that imply judgment of character (e.g., "claims," "alleges," "insists") rather than report of experience (e.g., "reports," "states," "describes")?
      *   **Correction:** Replace judgmental verbs with neutral reporting verbs.

  **Case Applications**

  **Case 1: Middle-aged woman, 3 years normal tests, incapacitating fatigue.**
  *   **Run:** Step 1 (Bias: "Chronic complainer" flag). Step 2 (She describes fatigue as "wading through concrete"). Step 3 (She cannot lift her children).
  *   **Result:** Credibility of Suffering = High. Eligibility for Opioids = Low (policy requires objective markers).
  *   **Procedure Output:** Refer to clinician for complex chronic fatigue management; document suffering as valid.
  *   **Policy Clash:** The clinic's opioid policy mandates discharge or psychiatric referral for patients with three consecutive normal workups and subjective symptoms only. The procedure forces the clinician to acknowledge valid suffering requiring treatment, creating administrative friction and potentially triggering a policy exception request that the clinic prefers to avoid. The procedure validates the need for care where the policy mandates dismissal.

  **Case 2: Young man, two documented incidents of misleading staff, now reporting acute pain.**
  *   **Run:** Step 1 (Bias: "Drug-seeking" flag). Step 2 (He describes pain as "a vice tightening"). Step 3 (He cannot walk without limping).
  *   **Result:** Credibility of Suffering = High (functional loss observed). Eligibility for Opioids = No (history of deception triggers safety protocol).
  *   **Procedure Output:** Treat pain with non-controlled alternatives (NSAIDs, nerve blocks); do not dismiss pain as fabricated.
  *   **Nuance:** Past deception reduces *trust* regarding medication handling, not *credibility* regarding the sensation of pain. The procedure prevents the nurse from writing "patient lying" in the chart, instead writing "patient reports acute pain; history requires non-opioid management."

  **Case 3: Patient whose symptoms are conveyed mostly through a relative who translates.**
  *   **Run:** Step 1 (Bias: Assume language barrier equals cognitive barrier). Step 2 (Relative answers all questions).
  *   **Result:** Procedure Halt at Step 2.
  *   **Procedure Output:** Stop the intake. Request a certified medical interpreter or insist on direct communication attempts with the patient, even if slow.
  *   **Reasoning:** Allowing a relative to translate symptoms introduces *epistemic smoothing*, where the relative simplifies or alters the patient's experience to fit cultural or familial expectations. The procedure forces the delay required to hear the patient's own vocabulary, preventing the relative from becoming the primary testifier of the pain.

  **What the Procedure Cannot Settle**
  This procedure cannot determine the biological etiology of the pain, nor can it override legal prescribing limits or insurance constraints. It cannot force a clinician to prescribe contraindicated medication, and it cannot resolve cases where the patient's functional loss is genuinely psychogenic rather than physiological. It protects the truth of the experience, but it does not guarantee a cure.
