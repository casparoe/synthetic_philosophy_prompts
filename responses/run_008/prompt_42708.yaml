answer: |-
  It is a fascinating puzzle, precisely because your friend's behaviour does seem to fluctuate. However, looking at the pattern of her acceptances and rejections, two distinct candidate rules emerge. Both fit her past record reasonably well, but they rely on different criteria for when moral testimony is permissible.

  ### Candidate Rule 1: The 'Local Knowledge' Principle
  This rule suggests that the permissibility of outsourcing moral thinking depends on the **relationship and epistemic access** of the advisor.
  *   **The Rule:** You may accept moral testimony only from those who know the specific particulars of your situation and your character intimately. You must reject it from distant authorities or strangers, regardless of their expertise.
  *   **Fit with Record:**
      *   **Mum:** Accepted. She knows the couple and your friend's history.
      *   **Book Club:** Accepted. They know the office context and the colleague involved.
      *   **Tutor:** Rejected. He offered an abstract principle without knowing the specific relational context.
      *   **Amnesty:** Rejected. They are a distant organisation with no knowledge of the specific execution's local nuances or your friend's personal stake.

  ### Candidate Rule 2: The 'Normative Domain' Principle
  This rule suggests that the permissibility depends on the **nature of the question** being asked.
  *   **The Rule:** You may accept testimony on matters of personal prudence or social convention, but you must never outsource questions of fundamental moral truth or justice.
  *   **Fit with Record:**
      *   **Breakup:** Accepted. This is viewed as a prudential, personal welfare decision.
      *   **Expenses:** Accepted. Reporting fraud is often seen as a matter of workplace protocol or convention.
      *   **Sex/Consent:** Rejected. This concerns a fundamental moral axiom about bodily autonomy.
      *   **Execution:** Rejected. This concerns fundamental human rights and justice.

  ### Prediction for the Lunch
  Here is how each rule predicts she will respond to the famous moral philosopher regarding the charitable donation:

  *   **Prediction under Rule 1 (Local Knowledge):** She will **refuse** his word. The philosopher is a stranger; he knows nothing about her, her finances, or her personal commitments. He lacks the requisite local knowledge.
  *   **Prediction under Rule 2 (Normative Domain):** She will **refuse** his word. Effective charity (giving a tenth of one's salary) is typically framed as a fundamental moral duty (akin to the sex/consent principle or the execution verdict), not merely a prudential choice like a breakup.

  ### My Best Guess
  I suspect she will **refuse to take his word**, despite her current intention to the contrary.

  **Why?** Her track record is a more reliable indicator of her deep-seated intuitions than her statement in the midst of "agonising" deliberation. In both the Tutor and Amnesty cases, she drew a hard line when the issue touched on fundamental moral architecture. Charitable obligation is philosophically akin to those cases (it is a demand of justice/morality, not just prudence). Furthermore, the philosopher fits the 'distant expert' profile of the Tutor and Amnesty, not the 'intimate context' profile of her Mum or Book Club. Her current willingness to accept his authority is likely a symptom of her decision fatigue rather than a consistent application of her principles. Once the lunch is over and the pressure eases, the inconsistency will likely bother her, and she will revert to working it out herself.

  ### The Decisive Test Case
  To determine which rule is actually driving her behaviour, you need a scenario where the *source* is approved by one rule but the *topic* is rejected by the other.

  **The Case:**
  Imagine she is struggling with a **fundamental moral question**—for example, whether it is morally permissible to lie to protect a friend's feelings—and she asks her **Mum** for the answer. Her Mum knows the friend and the situation intimately.

  *   **If she follows Rule 1 (Local Knowledge):** She will **accept** her Mum's verdict. The advisor has the required intimacy and contextual knowledge, so the moral weight of the question shouldn't matter.
  *   **If she follows Rule 2 (Normative Domain):** She will **refuse** her Mum's verdict. Even though her Mum is an intimate, the question concerns a fundamental moral principle (truth-telling vs. care), which is the sort of thing she insists on settling for herself (as with the sex/consent and execution cases).

  If she accepts her Mum's word on the lying, Rule 1 is the true driver. If she insists on reasoning through the lying herself despite her Mum's advice, Rule 2 is the true driver.
