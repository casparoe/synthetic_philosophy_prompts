answer: |-
  To arbitrate the start of the Anthropocene as a period concept, we must establish desiderata that respect the integrity of the contributing disciplines without pretending their epistemological foundations are identical. The following four requirements constitute the standard of arbitration for this volume.

  **1. Stratigraphic Autonomy (The "Sediments Only" Test)**
  *   **The Case:** A geological epoch must be definable by the rock record alone. If the boundary relies on human archives (texts, datasets) to be identified, it is a historical event, not a geological boundary. This ensures the marker is objective, synchronous, and independent of human narrative.
  *   **Status:** **Preference of the Stratigraphy Camp.**
  *   **Note on Classification:** You asked whether this test belongs on the list as a hard requirement or a preference. It is a preference. While essential for a *Geological Epoch* ratified by the International Commission on Stratigraphy, it is not essential for a *Period Concept* in the humanities. However, because this volume seeks to bridge the two, this preference functions as a veto point: if a proposal fails this test, geologists will not accept it as an epoch; if it passes this test but fails the historical requirements below, historians will not accept it as the Anthropocene.

  **2. Planetary Signal Magnitude**
  *   **The Case:** The boundary must track a measurable departure from Holocene variability in the Earth system (e.g., carbon, nitrogen, biodiversity loss). The signal must be global in extent and significant in magnitude to justify the claim that "humans" have become a planetary force.
  *   **Status:** **Non-Negotiable.**
  *   **Rationale:** Without a demonstrable shift in Earth-system functioning, the term "Anthropocene" loses its scientific referent and becomes merely a metaphor for human impact.

  **3. Historical Specificity (The "Agency" Test)**
  *   **The Case:** The boundary must distinguish between the agents of change and the subjects of change. It cannot treat "Humanity" as a homogeneous agent. A valid start date must allow us to identify *which* humans drove the transformation (e.g., colonizers, industrialists) and *which* humans were transformed or eliminated (e.g., indigenous populations, the colonized).
  *   **Status:** **Non-Negotiable.**
  *   **Rationale:** For environmental history, a boundary that erases inequality and causality is politically and analytically useless. If the strata cannot distinguish the perpetrator from the victim, the periodization is ethically insufficient.

  **4. Procedural Pluralism**
  *   **The Case:** The authority to fix the date cannot rest solely with the Anthropocene Working Group (AWG) or geological bodies. Because the concept doubles as a cultural and political diagnosis, the decision procedure must include standing for historians, social scientists, and indigenous representatives.
  *   **Status:** **Non-Negotiable.**
  *   **Rationale:** If the geologists' rulebook is the sole instrument for naming this period, the concept is captured by natural science, stripping it of the critical power it holds in the humanities and social sciences.

  ### Analysis of Tensions

  Regarding the stratigrapher's test (Requirement 1): I have classified it as a **Preference of the Stratigraphy Camp** rather than a universal non-negotiable. To demand it as a non-negotiable condition for a *period concept* is to privilege geology over history by definition. However, its presence on the list reveals the central fracture of the Anthropocene debate.

  This leads to the critical finding for your chapter: **A subset of these requirements is jointly unsatisfiable.** Specifically, **Stratigraphic Autonomy** and **Historical Specificity** cannot be jointly met.

  Stratigraphic Autonomy demands that the boundary be readable in the mud without archives. But the mud does not record agency, intent, or social structure. A plutonium spike (1950) is globally synchronous and stratigraphically clean, but it is silent on the colonial histories that made the nuclear age possible. Conversely, the collapse of indigenous populations (1610) is historically specific and marks a profound transformation in human-land relations, but its atmospheric signal (the CO2 dip) is noisy, diachronous, and arguably indistinguishable from natural variability without the archival context of the Columbian Exchange. You cannot read the genocide from the carbon; you need the archives. Therefore, a boundary that satisfies the geologist's demand for archival independence necessarily fails the historian's demand for causal specificity.

  ### Assessment of Candidate Dates

  *   **1610 (Orbis Spike):** Satisfies **Historical Specificity** (colonialism) but fails **Stratigraphic Autonomy** (the CO2 signal is debated and requires archival correlation to be meaningful).
  *   **Steam Engine (Industrial Revolution):** Satisfies **Historical Specificity** (capitalism/energy) but fails **Stratigraphic Autonomy** (the signal is gradual, lacking a single synchronous marker).
  *   **1950 (Great Acceleration):** Satisfies **Stratigraphic Autonomy** (plutonium is a perfect golden spike) and **Planetary Signal Magnitude**, but fails **Historical Specificity** (it homogenizes humanity and obscures the deep history of colonial extraction).
  *   **Agriculture:** Satisfies a longue-durée version of **Historical Specificity**, but fails **Stratigraphic Autonomy** and **Planetary Signal Magnitude** (the signal is diachronous and locally variable).

  No existing proposal satisfies the full list. This is not a failure of the proposals, but a feature of the concept.

  \answer{jointly unsatisfiable: Stratigraphic Autonomy and Historical Specificity}
