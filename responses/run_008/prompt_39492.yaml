      *   *Check:* Did I answer the specific sub-questions? Yes. Did I address the children aspect? Yes.

  5.  **Final Polish:** Check for clarity, flow, and empathy. Ensure the distinction between "moral reassurance" and "moral reasoning" is maintained. (The user asked for reasoning, not just a hug).

