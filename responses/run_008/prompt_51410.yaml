answer: |-
  # JOINT STATEMENT OF ADVERSARIAL COLLABORATION
  **Subject:** The Normative and Descriptive Status of Satisficing vs. Maximizing
  **Parties:** Camp A (Orthodox Bayesian/Decision Theory) & Camp B (Bounded Rationality/Ecological Psychology)
  **Date:** October 26, 2023

  ## 1. Points of Agreement
  *Both parties affirm the following claims as empirically or formally accurate, regardless of their normative interpretation.*

  1.  **Computational Costs are Real:** Decision procedures consume time, energy, and cognitive resources. These costs causally influence the outcome of the decision process and the net payoff of the agent in the world.
  2.  **Definition of Satisficing:** We agree on Herbert Simon's technical definition: Satisficing is a search procedure wherein an agent samples options sequentially and terminates search immediately upon encountering an option that meets a specified aspiration level, selecting that option without further comparison.
  3.  **Aspiration Adjustment:** Empirical evidence confirms that aspiration levels are not static; they adjust dynamically based on the ease or difficulty of finding acceptable options during the search process (e.g., the Cyert-March adjustment rule).
  4.  **Less-Is-More Effects:** There exist specific information structures where an agent with less information (or a simpler processing rule) achieves higher predictive accuracy or payoff than an agent using all available information or complex integration rules (e.g., the Recognition Heuristic in specific domains).
  5.  **Heuristic Performance:** In out-of-sample prediction tasks involving noisy, limited data, simple heuristics (e.g., fast-and-frugal trees, equal-weighting) frequently match or exceed the performance of multiple regression and other "optimizing" statistical models.
  6.  **Optimization Requires a Model:** To maximize expected utility, an agent must possess a model of the environment (likelihoods, priors, utility functions). If the model is misspecified, the "optimal" decision relative to the model may yield suboptimal outcomes in reality.

  ## 2. Record of Disagreement
  *The following table outlines remaining divergences. Each column is phrased to accurately reflect the respective camp's position, such that a proponent of that camp would accept the wording as their own.*

  | Topic | Camp A (Orthodox Bayesian) Formulation | Camp B (Bounded Rationality) Formulation |
  | :--- | :--- | :--- |
  | **The Unity of Rationality** | There is a single normative standard of rationality: coherence and maximization of expected utility relative to available information. Deviations are errors or constraints. | There are multiple standards of rationality dependent on the environment. "Ecological rationality" (fit between heuristic and structure) is a distinct normative standard, not a subset of coherence. |
  | **Normative vs. Descriptive** | The normative project (how agents *should* decide) is logically separable from the descriptive project (how agents *do* decide). Human limitations do not change the normative ideal. | The normative project must be grounded in the descriptive reality of the agent's cognitive architecture. A norm that cannot be implemented by the agent is not a valid norm for that agent. |
  | **"Better Than Optimal"** | The phrase is logically incoherent. An option cannot yield higher expected utility than the option defined as having the maximum expected utility. | The phrase is coherent in practice. A heuristic can yield higher *realized* payoff than a maximizing procedure that is too costly or prone to overfitting to be practically executed. |
  | **Status of Aspiration Levels** | Aspiration levels are proxy variables for marginal utility or shadow prices of search costs. They are inputs to a hidden optimization function. | Aspiration levels are constitutive of preference formation. They are not proxies for a pre-existing utility function but tools for constructing a decision in complex environments. |
  | **The Role of Error** | Bias and variance are errors to be minimized. A rational agent minimizes total error (bias + variance + cost). | Bias is often a feature, not a bug. Ignoring information (inducing bias) can reduce variance and improve robustness in uncertain environments. |

  ## 3. The Cruxes
  *We identify the following two issues as the primary drivers of our theoretical divergence. Resolution of these issues would significantly shift the weight of evidence between our frameworks.*

  **Crux 1: The Prevalence of "Kind" Environments**
  *   **The Issue:** Camp B argues that real-world environments are typically high-dimensional, noisy, and sparse, making simple heuristics robust and optimization fragile. Camp A argues that these are special cases; in sufficiently structured or high-stakes environments (e.g., financial arbitrage, engineering safety), optimization dominates, and these are the environments that matter most for normative theory.
  *   **The Question:** Are the environments in which heuristics outperform optimization the *normal condition* of human choice, or are they *rare exceptions*?

  **Crux 2: The Ideal-Agent Limit**
  *   **The Issue:** Camp A argues that if you remove computational constraints (infinite time, memory, compute), a satisficer's behavior converges to that of an Expected Utility Maximizer. Camp B argues that without bounds, the concept of satisficing dissolves; rationality is *essentially* a relation between bounds and environment, so an "unbounded satisficer" is a category error, not a maximizer.
  *   **The Question:** Is the theoretical limit of a bound-free satisficer an Expected Utility Maximizer, or is the concept undefined/incoherent?

  ## 4. Proposed Tests and Predictions
  *For each crux, we propose a concrete case or simulation. Both parties agree to accept the outcome of these tests as evidence bearing on the crux, though we may disagree on the ultimate interpretation.*

  ### Test for Crux 1 (Environment Prevalence)
  *   **The Protocol:** A competition using a library of 100 real-world datasets (covering social, economic, biological, and physical domains). Task: Binary prediction (e.g., will this customer churn? will this bridge fail?).
  *   **Competitors:** (1) A regularized Bayesian logistic regression (Camp A's proxy for optimization). (2) A Fast-and-Frugal Tree (Camp B's proxy for heuristic).
  *   **Metric:** Out-of-sample accuracy adjusted for computational time (time-to-decision).
  *   **Camp A Prediction:** The Bayesian model will win on aggregate accuracy, especially in high-stakes subsets. The time adjustment will not outweigh accuracy gains in critical domains.
  *   **Camp B Prediction:** The Fast-and-Frugal Tree will win on aggregate robustness (variance across datasets). The Bayesian model will overfit in the majority of "noisy" datasets, losing on the time-adjusted metric in >60% of cases.

  ### Test for Crux 2 (Ideal-Agent Limit)
  *   **The Protocol:** A formal sequential search simulation where computational cost parameter ($c$) approaches zero.
  *   **Task:** Search a distribution of unknown quality for the highest value item.
  *   **Competitors:** (1) A Satisficer with an aspiration level set to the theoretical expected maximum of the distribution. (2) An Optimal Stopping rule derived via dynamic programming.
  *   **Metric:** Convergence of the Satisficer's stopping point and selection value to the Optimal Stopping rule as $c \to 0$.
  *   **Camp A Prediction:** As $c \to 0$, the Satisficer's aspiration level will converge to the reservation price of the Optimal Stopping rule. The behaviors will become indistinguishable.
  *   **Camp B Prediction:** Even as $c \to 0$, the Satisficer's rule remains distinct because it relies on a threshold *construction* rather than a global *comparison*. The limit does not yield a unique maximizer if the aspiration level is set adaptively rather than derived from the distribution's moments.

  ***

  # META-COMMENTARY & DRAFTING NOTES
  *(To be read by the collaborators, not part of the signed statement)*

  ### 1. Verbal vs. Substantive Disputes
  A significant portion of your disagreement appears to be **verbal regarding the definition of "Rationality."**
  *   **Why:** Camp A uses "Rationality" to mean *internal coherence* (consistency with axioms). Camp B uses "Rationality" to mean *external success* (achieving goals in an environment).
  *   **Resolution:** You can agree on all the empirical claims (Section 1) while disagreeing on which label to paste on them. If Camp A admits "Ecological success is good" and Camp B admits "Coherence is good," the fight is mostly about who gets to own the word "Rational." However, this becomes **substantive** when Camp A claims coherence *causes* success, and Camp B claims coherence often *impedes* success (due to overfitting). Section 2 attempts to capture this substantive split.

  ### 2. Potential Slant and Refusal Risks
  *   **Risk for Camp A:** In Section 1, Claim 5 ("Heuristics... frequently match or exceed... optimizing... models"). Camp A may refuse this if they interpret "optimizing models" as *true* Bayesian optimization rather than *applied* regression.
      *   *Mitigation:* I specified "out-of-sample" and "noisy, limited data." If Camp A insists that a *true* Bayesian model with *true* priors would win, they are arguing about a counterfactual that doesn't exist in the data. I have drafted this to force them to concede the empirical reality of overfitting.
  *   **Risk for Camp B:** In Section 3, Crux 2 ("Ideal-Agent Limit"). Camp B may feel that framing the test as "convergence to optimality" concedes the game. They might argue that an unbounded agent is impossible, so the test is moot.
      *   *Mitigation:* I phrased Camp B's prediction to allow them to say the concept is "undefined/incoherent" rather than forcing them to predict divergence in values. This preserves their philosophical stance while allowing the math to be run.

  ### 3. AI Self-Reflection: What Would Change My View?
  As the drafter, I have attempted neutrality, but my training data favors formal coherence (leaning Camp A). Here is what would shift my own synthesis:
  *   **To shift toward Camp A:** If it can be proven that the "costs" Camp B cites (computation, time) can be fully internalized into a Bayesian utility function without making the model unfalsifiable. If every heuristic can be shown to be the exact solution to a specific inverse reinforcement learning problem, Camp A's claim that "everything is optimization" becomes tautologically robust.
  *   **To shift toward Camp B:** If there is a demonstration of a "Less-is-More" effect in a domain where information is costless and computation is instantaneous. If an agent *chooses* to ignore free information to succeed, and this cannot be modeled as "cost of processing," then Camp B's claim that rationality is essentially bounded (not just contingently bounded) is validated. Currently, most "less-is-more" effects rely on the cost of variance/overfitting, which Camp A can absorb as a "complexity cost." Camp B needs a stronger case for *ignoring* information being inherently superior, not just cost-effective.

  ### 4. Final Advice for the Collaborators
  You are arguing past each other because Camp A is playing **Chess** (a closed, perfect information game where optimization is king) and Camp B is playing **Poker in a hurricane** (open, noisy, where survival is king).
  *   **Camp A:** Acknowledge that in the hurricane, calculating the exact odds of every card is a losing strategy.
  *   **Camp B:** Acknowledge that in Chess, "good enough" moves lose to precise calculation.
  *   **The Synthesis:** The dispute is not about which strategy is "True," but about **which game humans are actually playing.** Crux 1 is the only thing that matters. If the world is mostly Chess, A wins. If the world is mostly Poker/Hurricane, B wins. Focus your energy there.
