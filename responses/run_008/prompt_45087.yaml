          *   Verdict: "defensible_with_caveats" (because the policy choice is valid, but the execution/reporting is flawed). Or "unsound" because claiming calibration is false. Let's go with "defensible_with_caveats" because the core insight (prediction vs. allocation) is correct, even if the specific mechanism is clunky. Actually, if the calibration claim is false, it's risky. Let's look at the "proposal_reasoning" field to explain the nuance.
