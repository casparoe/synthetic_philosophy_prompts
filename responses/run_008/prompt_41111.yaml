answer: |-
  Here is a Thanksgiving menu of the specific claims hiding inside that sentence. You can pick the one that fits the conversation, or point out which course your brother-in-law is serving.

  ### 1. The Denominator Claim (Rates vs. Absolutes)
  *   **The Claim:** "The *percentage* of people dying violently is lower than ever."
  *   **The Fact/Value Split:** **Mostly Fact.** Historians and statisticians can estimate death rates per 100,000 people for different eras. There is debate over the accuracy of ancient data, but the trend line is generally accepted.
  *   **The Catch:** If the population triples and the rate halves, *absolute* suffering increases. A 0.01% death rate in a population of 8 billion is still 800,000 dead people.
  *   **Does it justify your BIL's conclusion?** **No.** Even if the *rate* is down, high *absolute numbers* still justify increased effort. You wouldn't tell a hospital to stop trying to save lives because their mortality rate dropped, if they are still losing thousands of patients a year.

  ### 2. The Definition Claim (Visible vs. Invisible Violence)
  *   **The Claim:** "Violence (war, homicide, genocide) is down."
  *   **The Fact/Value Split:** **Mixed.** Battle deaths and homicides are recorded (Fact). Domestic abuse, state torture, structural violence (poverty-induced death), and animal suffering are often unrecorded or depend on how you define "violence" (Value).
  *   **The Catch:** "Peace" often means "public order." If domestic abuse was considered private discipline in 1800 but is counted as violence now, statistics might look worse even if behavior didn't change. Conversely, if factory farming counts as violence, the numbers skyrocket.
  *   **Does it justify your BIL's conclusion?** **No.** If the definition of violence narrows to only "war between states," then saying "we're doing enough" ignores all the violence that falls outside that definition (e.g., domestic safety, systemic inequality).

  ### 3. The Baseline Claim (Who are we comparing to?)
  *   **The Claim:** "We are safer than humans have ever been."
  *   **The Fact/Value Split:** **Fact (with caveats).** We are likely safer than prehistoric foragers or Medieval Europeans. We are *not* necessarily safer than people in the 1950s or 90s (depending on the region).
  *   **The Catch:** Comparing 2024 to the Stone Age sets a very low bar. Comparing 2024 to "a world without preventable violence" sets a high bar.
  *   **Does it justify your BIL's conclusion?** **Only for "Cheer Up."** It supports the idea that things are better than they *were*. It does not support the idea that things are as good as they *could be*.

  ### 4. The Psychological Claim (Risk vs. Perception)
  *   **The Claim:** "Your worry is irrational because the statistical risk is low."
  *   **The Fact/Value Split:** **Value.** Statistics measure frequency; psychology measures impact.
  *   **The Catch:** Human risk assessment isn't just math. It's about control, dread, and visibility. A rare terrorist attack feels worse than a common car accident because it is intentional and unpredictable. Worrying about social collapse isn't necessarily a math error; it's a response to systemic fragility.
  *   **Does it justify your BIL's conclusion?** **No.** Even if the statistical probability of you being a victim is low, the *consequence* of societal violence is high. Prudent people buy fire insurance even if their house is unlikely to burn down.

  ### 5. The Logical Leap (The "Is-Ought" Gap)
  *   **The Claim:** "Because violence is lower, we should not pour more effort into reducing it."
  *   **The Fact/Value Split:** **Pure Value.** This is a moral judgment, not a statistical one.
  *   **The Catch:** This is the **Complacency Trap**. Smallpox was rarer in 1970 than in 1900, but that didn't mean we should have stopped eradication efforts. Decline is not completion.
  *   **Does it justify your BIL's conclusion?** **Never.** This is the smuggled premise. You can accept the statistic (violence is down) and reject the conclusion (therefore, stop trying).

  ***

  ### How to serve this at the table

  If you want to push back without starting a war, pick one of these three responses based on what you want to achieve:

  **Option A: The "Fire Insurance" Rebuttal (Focus on Effort)**
  > "I agree the rates are down. But if a disease became 50% less deadly, we wouldn't stop funding the cure. Low rates don't mean zero risk, and 'better than the Stone Age' isn't the bar I want to set for society."

  **Option B: The "Definition" Rebuttal (Focus on Scope)**
  > "That statistic usually counts battlefields and homicides. It doesn't count domestic abuse, state oppression, or structural violence. If we narrow the definition of violence, of course the numbers look better. But that doesn't mean the suffering is gone."

  **Option C: The "Logic" Rebuttal (Focus on the Leap)**
  > "You're moving from a fact ('violence is down') to a value judgment ('therefore worry is irrational'). I can be grateful for progress and still believe we need to work harder to maintain it. Complacency is usually how progress gets lost."

  **Summary for your pocket:**
  *   **Fact:** Violence rates are likely lower than in the past.
  *   **Fact:** Absolute numbers of suffering may still be high.
  *   **Value:** Whether that justifies stopping effort is a moral choice, not a math problem.
  *   **Verdict:** Your brother-in-law is using a **descriptive statistic** to enforce a **normative silence**. You can accept the math without accepting the mandate.
