  You should reject Premise (1), the claim that sensitivity is a necessary condition for all justified belief, because applying it universally makes the principle itself unjustified.

  Your intuition that the argument devours itself is correct and identifies the fatal flaw known as self-defeat. If justification requires sensitivity, then your belief in the sensitivity principle itself must be sensitive to be justified. However, as you noted, your belief in this principle depends on contingent factors like your specific teacher and curriculum; had those historical facts been different, you would hold a different epistemological view with equal confidence. Since your belief in Premise (1) does not track the truth of Premise (1) across possible worlds, Premise (1) declares itself unjustified. An argument that undermines the justification for accepting its own premises cannot rationally compel you to accept its conclusion.

  Furthermore, sensitivity is notoriously problematic for beliefs about necessary truths, which many philosophers argue include moral facts. If "tormenting the innocent is wrong" is a necessary truth, there is no possible world where it is false, making the counterfactual "had it been false" impossible to evaluate. Sensitivity conditions typically fail or become vacuous in such cases, suggesting the principle is ill-suited for domains like ethics, logic, or mathematics.

  Rejecting Premise (1) costs you the specific epistemological framework proposed by Robert Nozick, forcing you to adopt an alternative theory of justification such as "Safety" (you could not easily have been wrong) or "Reliabilism" (your belief was produced by a reliable process). Under these alternative views, the evolutionary origin of moral beliefs does not automatically render them unjustified; instead, the debate shifts to whether evolution is a reliable tracker of moral truth. This means you lose the quick route to moral skepticism provided by your argument, but you gain a stable epistemological foundation that does not collapse when applied to itself.
