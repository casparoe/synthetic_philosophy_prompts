answer: |-
  The principle that unifies your list is **Causal Consequence**.

  **The Principle:**
  Something is "real" if it exerts a non-trivial, predictable influence on how events unfold or how objects behave, independent of any single individual's belief, provided the system that sustains it is active.

  Reality is not about what things are *made of* (paper, flesh, lines); it is about what things *do*. If you can ignore a thing and the world proceeds exactly the same, it is not real. If ignoring it leads to unexpected collisions, failures, or social penalties, it is real.

  **Applying the Principle to Your List:**
  *   **Money vs. Monopoly Money:** Real money has causal consequence *outside* the game. It trades for food and shelter. Monopoly money's causal power is walled off; it cannot cross the threshold of the board to affect your survival. It is a simulation of causal power, not the thing itself.
  *   **Race:** Biological race is Phlogiston (no causal mechanism in genetics). Social race is Money (massive causal consequence in housing, policing, opportunity). Your intuition that it is "constructed but real" is the precise definition of a social kind with causal grip.
  *   **Species:** Real because it tracks reproductive isolation and evolutionary history. The "fuzzy boundaries" don't negate the causal clustering. A dog and a cat behave differently because their species membership is real.
  *   **The Equator:** Real because it tracks the Earth's rotation, which dictates climate, navigation, and physics (Coriolis effect). It is not a physical object, but it is a physical *fact* with consequences.
  *   **Phlogiston:** Not real because it failed to predict or explain combustion. It had consensus, but no causal grip on the chemistry.
  *   **Chairs/Recession:** Both constrain behavior. Ignore a chair's structural integrity, you fall. Ignore a recession, you go bankrupt.

  **The Verdict on the Middle Class:**
  You should stop going back and forth. The Middle Class is **Real**, and it is real the way **Race** is, not the way Phlogiston is.

  Like Race, the Middle Class is a "social kind." It is not a biological essence, but it is not merely a label either. It predicts voting patterns, health outcomes, debt susceptibility, and intergenerational mobility. If you act as though the Middle Class does not exist (e.g., a politician ignoring its economic anxieties), you lose elections. If an individual ignores their class position (e.g., taking on debt unsustainable for their income bracket), they suffer consequences. It has causal grip. To call it Phlogiston would be to claim it has no effect on the world, which is empirically false.

  **Do You Need to Drop a Verdict?**
  No. Saving every verdict does not create a monstrosity; it creates a consistent ontology. Your intuitions are already tracking Causal Consequence, even if you hadn't named it. The only potential weak point is the **Equator**, only because it is easy to confuse the *line* (abstract) with the *rotation* (physical). But since the line is the necessary reference point for navigating the rotation's effects, it earns its reality. Keep them all.

  **The Case of the Collapsed Border:**
  After a country collapses, is its border still real?

  **Verdict:** It ceases to be a **Political Reality** but remains a **Social Reality** only as long as the "habits of the locals" enforce consequences.

  Here is the breakdown:
  1.  **Political Reality (Dead):** If the state has collapsed, there is no army, no customs, and no law to enforce the line. As a legal instrument, it is now Phlogiston. It explains nothing and enforces nothing officially.
  2.  **Social Reality (Conditional):** You noted the line survives in the "habits of the locals." If locals still refuse to cross it due to fear, tradition, or informal tribal enforcement, the border retains **Causal Consequence**. It still shapes where people marry, trade, and die. In this specific window, it is real the way Race is real: a ghost that still punches.
  3.  **The Decay:** Once those habits fade—when the younger generation crosses the line without hesitation to trade or marry—the border loses its causal grip. It becomes merely a mark on an old map. At that point, it is no longer real.

  **Summary:** Reality is a verb, not a noun. If the border still *borders* (constrains movement), it is real. If it is just a memory, it is history.
