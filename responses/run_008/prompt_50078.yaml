answer: |-
  ### The Specification of Bargaining Desiderata

  You are correct that axiomatic bargaining theory treats the division rule as a function $f(S, d)$ mapping a feasible set of utility agreements $S$ and a disagreement point $d$ to a specific outcome. To choose a rule, you must choose which axioms you are willing to violate, because they are not jointly satisfiable.

  Below are the six standard desiderata. For each, I provide the definition, the motivating scenario, and an evaluation of its status as a logical necessity versus a philosophical stance.

  #### 1. Pareto Optimality (PO)
  *   **Specification:** The solution $f(S, d)$ must lie on the Pareto frontier of $S$. There is no other point in $S$ that makes at least one party better off without making the other worse off.
  *   **Motivating Case:** If the rule selects an interior point, there exists a "free lunch" where both cofounders could receive more equity or cash. Selecting an interior point is equivalent to burning value.
  *   **Status:** **Non-negotiable.** Violating PO implies the rule is economically inefficient. In a dissolution, leaving value on the table contradicts the purpose of the exercise.

  #### 2. Individual Rationality (IR)
  *   **Specification:** For each party $i$, $f_i(S, d) \geq d_i$.
  *   **Motivating Case:** If the computed split gives you less utility than walking away (your outside option), you would reject the agreement. A rule that prescribes such an outcome is unstable.
  *   **Status:** **Non-negotiable.** This is a participation constraint. If the rule violates IR, the "solution" is not an equilibrium; one party will defect.

  #### 3. Symmetry (SYM)
  *   **Specification:** If the feasible set $S$ is symmetric around the 45-degree line and $d$ lies on that line, then $f_1(S, d) = f_2(S, d)$.
  *   **Motivating Case:** If you and your cofounder have identical utility functions, identical outside options, and identical contributions (the problem looks the same if you swap names), the rule should not arbitrarily favor one name over the other.
  *   **Status:** **Conditional.** This is only non-negotiable if the parties are truly interchangeable *in the model*. In your case, if one cofounder has a significantly better outside option (a higher $d_i$), the problem is *not* symmetric, and SYM does not demand equal splits. It demands equal treatment of *equal bargaining positions*. If you encode the outside options correctly into $d$, SYM is a requirement of impartiality.

  #### 4. Invariance to Positive Affine Transformations (INV)
  *   **Specification:** If we transform the utility scales $u'_i = a_i u_i + b_i$ (where $a_i > 0$), the physical outcome corresponding to the solution should not change.
  *   **Motivating Case:** Suppose you measure your utility in "dollars" and your cofounder measures in "thousands of dollars." Or suppose one of you is risk-averse and the other risk-neutral, reflected in the curvature of your utility functions. The physical division of assets should not depend on the arbitrary zero-point or unit of measurement used to represent preferences.
  *   **Status:** **Genuine Constraint (with a caveat).** You asked if this smuggles in interpersonal utility comparisons. It does not. It is a requirement of *intrapersonal* consistency within von Neumann-Morgenstern (vNM) expected utility theory. vNM utilities are unique only up to positive affine transformation. If a solution changes when you merely change the units of measurement, the solution is arbitrary.
      *   *The Caveat:* INV prevents the rule from making direct interpersonal comparisons of utility levels (e.g., "give more to the person who feels pain more intensely"). If you believe fairness *requires* comparing utility levels (e.g., the Egalitarian solution), you must drop INV. For a corporate dissolution, keeping INV is usually preferable to avoid arguing about whose "utils" are bigger.

  #### 5. Independence of Irrelevant Alternatives (IIA)
  *   **Specification:** If $S' \subset S$ and the solution to the larger set $f(S, d)$ is contained within $S'$, then $f(S', d) = f(S, d)$.
  *   **Motivating Case:** Suppose the set of possible deals includes a specific equity split that the rule selects. If we remove a *different* deal that was never going to be chosen anyway, the selection should not change. The presence of an option that is strictly worse than the solution should not influence the solution.
  *   **Status:** **Camp Prejudice.** This is the primary fault line. IIA assumes that bargaining power is determined entirely by the local trade-off rates at the solution point. It ignores the *shape* of the rest of the frontier.
      *   *The Smuggle:* You correctly suspected IIA smuggles an assumption. It assumes that the *availability* of alternatives matters only if they are chosen. It ignores that the *existence* of a high-value alternative (even if not chosen) represents leverage or "hope." In a dissolution, removing a potential high-value buyer for the company (shrinking $S$) changes the dynamic even if that buyer wasn't the final deal. IIA forbids the solution from reacting to this loss of leverage.

  #### 6. Individual Monotonicity (MON)
  *   **Specification:** If the feasible set expands from $S$ to $S'$ in a way that increases Player 1's maximum possible payoff (ideal point) while leaving Player 2's maximum payoff and the disagreement point unchanged, then Player 1's payoff in the solution should not decrease (and should ideally increase).
  *   **Motivating Case:** Suppose a new investor expresses interest, increasing the maximum possible valuation of the company, but only if you (Player 1) stay on. Your "best case scenario" improves. Your cofounder's best case does not. It is intuitive that your share of the settlement should not drop, and should likely rise, because your potential contribution to the surplus has increased.
  *   **Status:** **Competing Prejudice.** This is the Kalai-Smorodinsky replacement for IIA. It asserts that "hope" (the ideal point) is a source of bargaining power. It is intuitively compelling but mathematically incompatible with IIA.

  ---

  ### The Impossibility Theorem and the Tradeoff

  You are correct: the desiderata list is a theorem-shaped object.

  **Nash (1950)** proved that **PO, SYM, INV, and IIA** uniquely identify the **Nash Bargaining Solution**:
  $$ \text{Maximize } (u_1 - d_1)(u_2 - d_2) $$
  Geometrically, this is the point where a hyperbola tangent to the Pareto frontier touches the set.

  **Kalai & Smorodinsky (1975)** proved that if you replace IIA with **MON** (keeping PO, SYM, INV), you uniquely identify the **Kalai-Smorodinsky Solution**:
  $$ \text{Connect } d \text{ to the ideal point } (u_1^{max}, u_2^{max}) \text{ and find the intersection with the Pareto frontier.} $$
  Geometrically, this preserves the ratio of maximum possible gains.

  **The Conflict:** You cannot have both IIA and MON.
  *   **Nash satisfies IIA but violates MON.**
  *   **Kalai-Smorodinsky satisfies MON but violates IIA.**

  #### Concrete Tradeoff Scenario
  Imagine you and your cofounder are splitting the proceeds of a sale.
  *   **Disagreement Point ($d$):** $(0, 0)$ (Company goes bankrupt, nobody gets paid).
  *   **Feasible Set ($S$):** A triangle with vertices $(0,0), (100, 0), (0, 100)$.
      *   Your ideal payoff: 100. Cofounder's ideal: 100.
      *   **Nash Solution:** $(50, 50)$.
      *   **KS Solution:** $(50, 50)$.
      *   *Result:* They agree.

  Now, suppose a new regulatory constraint arises that caps *your* maximum possible payout at 60, but leaves your cofounder's potential at 100. The feasible set $S'$ is now a triangle with vertices $(0,0), (60, 0), (0, 100)$.
  *   **Your Ideal:** 60. **Cofounder's Ideal:** 100.
  *   **KS Solution:** Connects $(0,0)$ to $(60, 100)$. The line is $u_2 = \frac{100}{60}u_1$. Intersecting the efficient frontier (line from $(60,0)$ to $(0,100)$), the solution shifts to roughly $(30, 50)$ (proportional to ideals). You lose because your "ceiling" dropped.
  *   **Nash Solution:** Maximizes $u_1 u_2$ subject to the new frontier. The solution shifts to $(30, 50)$ as well in this linear case.

  **The Divergence Case:**
  To see the conflict, we must change the *curvature* of the frontier, not just the corners.
  *   **Scenario:** Let $S$ be a set where the Pareto frontier is concave.
      *   $d = (0,0)$.
      *   Ideal points: $(100, 100)$.
      *   Current Nash Solution: $(50, 50)$.
  *   **Change:** We expand the set to $S'$ *only* in a region far away from the solution, increasing your ideal point to 120, but leaving the frontier shape untouched in the neighborhood of $(50, 50)$.
      *   **Nash (IIA):** Since the local trade-off rate at $(50, 50)$ hasn't changed, and $(50, 50)$ is still feasible, Nash says the solution **stays at $(50, 50)$**. Your increased potential (leverage) grants you no additional actual value.
      *   **Kalai-Smorodinsky (MON):** Your ideal point moved from 100 to 120. The line from $d$ to the ideal point steepens. The intersection with the frontier moves in your favor. You get **more than 50**.

  **The Sacrifice:**
  *   **Choose Nash:** You accept that "potential" does not matter, only "marginal substitutability" at the agreement point. If your cofounder's maximum possible payout doubles (perhaps they have a side deal available), but the marginal trade-off at the current split remains the same, Nash gives them more. You might view this as ignoring their increased leverage.
  *   **Choose Kalai-Smorodinsky:** You accept that removing an option that was *never going to be chosen* can change the deal. If your cofounder had a "moonshot" option available (1 in a million chance of huge payout) that gets removed, KS adjusts the split even if that moonshot was irrelevant to the likely outcome. You might view this as the solution being too sensitive to "noise" in the feasible set.

  ---

  ### Scorecard and Third Contender

  **Nash Bargaining Solution**
  *   **Satisfies:** PO, SYM, INV, IIA.
  *   **Violates:** MON.
  *   **Verdict:** The standard for stability. It treats the bargaining problem as a local optimization. It is less sensitive to the "shape" of the total opportunity set. If you want a rule that is robust to the inclusion of unrealistic "dream" outcomes, choose Nash.

  **Kalai-Smorodinsky Solution**
  *   **Satisfies:** PO, SYM, INV, MON.
  *   **Violates:** IIA.
  *   **Verdict:** The standard for proportional fairness. It treats the bargaining problem as a claim on the *total possible surplus*. If your cofounder has a significantly better outside option (higher ideal point), KS awards them a larger share of the *current* pie than Nash does. In a dissolution where outside options are asymmetric, KS is often perceived as more "intuitively fair."

  **The Egalitarian Solution (Kalai, 1977)**
  *   **Rule:** Maximize the minimum gain. Equalize $u_1 - d_1 = u_2 - d_2$.
  *   **Satisfies:** PO, SYM, MON.
  *   **Violates:** **INV**.
  *   **Verdict:** This solution requires **interpersonal comparability of utility**. It demands that a "util" for you is the same size as a "util" for your cofounder. In a legal dissolution, this is dangerous. It invites arguments about who "needs" the money more or who "suffered" more. Unless you have a shared metric (e.g., splitting cash only, where utils = dollars), avoid this. It sacrifices the objectivity of INV for a strong notion of equality.

  ### Recommendation for Specification

  For a cofounder dissolution, **Kalai-Smorodinsky** is typically the superior specification, provided you can robustly define the "ideal points."

  *   **Why:** Dissolutions are usually driven by asymmetric outside options (one founder has a new job, the other doesn't). Nash tends to underweight the leverage provided by a strong outside option because it focuses on the marginal trade-off. KS explicitly encodes that leverage via the ideal point.
  *   **The Risk:** You must define the "ideal point" carefully. Is it the maximum theoretical valuation of the company? Or the maximum payout *that party* could secure? KS requires the latter (the utopia point). If you define this loosely, the MON axiom makes the solution volatile.
  *   **The Compromise:** If you fear the volatility of KS (due to IIA violation), but want to account for asymmetric outside options, stick with **Nash** but ensure your **disagreement point ($d$)** accurately reflects the value of those outside options. Nash is sensitive to $d$. If one founder has a great outside option, $d_i$ should be high. Nash will then award them a larger share. This achieves a similar result to KS without sacrificing IIA, provided you can agree on the valuation of the outside options *ex-ante*.

  **Final Specification Clause:**
  > "The division shall be determined by the **Kalai-Smorodinsky solution** relative to the disagreement point $d$ and the feasible set $S$ of all legally and physically possible asset allocations. The 'ideal point' for each founder shall be defined as the maximum value that founder could theoretically extract from $S$ assuming the other founder receives their disagreement payoff $d_j$."

  This locks in Monotonicity (leverage matters) and sacrifices IIA (the set of total possibilities matters), which aligns best with the intuition that a founder with better prospects should capture more value from the split.
