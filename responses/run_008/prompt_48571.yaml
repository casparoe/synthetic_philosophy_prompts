      *   **Topic:** Moral Luck (specifically introducing the problem before the unit on it).
      *   **Goal:** Design an in-class game where students generate instances of the problem, commit to judgments in writing, and confront their own records in the debrief.
      *   **Constraints:** Paper, index cards, timer, single die. No software, no real money. Position named only in debrief.
      *   **User's Working Design:** Agent/Auditor pairs. Agent allocates endowment across 3 projects under time pressure. Hidden circumstance cards change outcomes (live/dead/doubles stakes). Random handicaps (time/brief). Die roll for final outcome. Auditor grades Agent at 3 checkpoints (before outcome, after outcome, after hidden factors). Closing turn: Auditors graded by class, but their rubrics were randomly corrupted.
      *   **Deliverables:**
          1.  Short prose rationale (< 1 page).
          2.  Run sheet (table: minutes, segment, participants, facilitator, risks).
          3.  Complete rules (dealing, timing, card text, grading scale).
          4.  Scoring scheme (engagement/honesty without cash).
          5.  Debrief plan (mapping mechanics to luck types, using ledgers as data).
          6.  Prediction of failures/limitations.
          7.  Final JSON object with "mapping" and "unreproducible_feature".

  2.  **Evaluate and Refine the User's Design:**
      *   *Strengths:* The Agent/Auditor dynamic is good for generating judgment data. The three checkpoints (pre-outcome, post-outcome, post-reveal) perfectly track the drift of moral judgment based on luck. The "corrupted rubric" closing turn is a brilliant touch for regress/meta-luck.
      *   *Weaknesses/Risks:* 14 students = 7 pairs. 80 minutes is tight for complex mechanics. Hidden cards + handicaps + die rolls + 3 grading checkpoints + closing meta-game might be too much admin for the facilitator. The "corrupted rubric" idea needs to be simple enough not to confuse the main point.
      *   *Improvement:* Simplify the allocation mechanic to ensure speed. Ensure the "hidden circumstance" is truly hidden from the Auditor until the right moment. The "corrupted rubric" needs to be handled carefully so it doesn't feel like a trick that invalidates the exercise, but rather demonstrates constitutive/circumstantial luck on the *judges*.
      *   *Scoring:* Since no money, use "Reputation Points" or "Accuracy Tokens" that translate to a minor course benefit (e.g., dropping a quiz score) or just social capital/bragging rights. Let's use "Integrity Tokens" awarded by the facilitator based on consistency, not outcome.
      *   *Luck Types:*
          *   Resultant Luck: The die roll outcome.
          *   Circumstantial Luck: The hidden circumstance cards (project live/dead).
          *   Constitutive Luck: The handicap (time/brief) affecting the Agent's capacity.
          *   (Maybe) Antecedent/Causal Luck: The initial deal of cards.
      *   *Debrief:* Needs to physically collect the ledgers and show the drift.

  3.  **Drafting the Content:**

      *   **Rationale:** Keep it punchy. Focus on *experiential epistemology*—feeling the injustice of judgment rather than hearing about it.
      *   **Run Sheet:** Needs precise timing. 80 mins.
          *   Intro (5)
          *   Setup/Pairing (5)
          *   Round 1 (Decision) (10)
          *   Round 2 (Outcome/Grading 1 & 2) (15)
          *   Round 3 (Reveal/Grading 3) (15)
          *   Meta-Game (Auditor Judging) (15)
          *   Debrief (30)
          *   *Correction:* That's 90 mins. Need to trim. Merge rounds.
          *   *Revised:* Intro (5), Setup (5), Decision (10), Outcome/Grade 1 (10), Reveal/Grade 2 (10), Meta-Game (10), Debrief (30). Total 80.
      *   **Rules:**
          *   *Endowment:* 10 Units.
          *   *Projects:* A, B, C.
          *   *Cards:* "Flood" (A dead), "Boom" (B doubles), "Normal" (No change).
          *   *Handicaps:* "Rushed" (5 mins instead of 10), "Blind" (Missing project description).
          *   *Die:* 1-3 Failure, 4-6 Success (modified by cards).
          *   *Ledger:* 1-10 scale.
          *   *Meta-Game:* Auditors swap ledgers. Class votes on who judged "fairly". Facilitator reveals some auditors had "Biased Lens" cards (e.g., "Downgrade all Rushed Agents").
      *   **Scoring:** "Philosophical Credit" (abstract). Or simply the debrief *is* the grade. Let's suggest a small participation credit based on completing the ledger, to ensure honesty.
      *   **Debrief:** Collect ledgers. Calculate averages for identical decisions with different outcomes. Plot on board.
      *   **Failures:** Students colluding, timing overrun, confusion on card rules, students feeling *too* cheated by the meta-game.
      *   **Unreproducible Feature:** Real moral stakes. The game is low-stakes. The lecture must connect the felt irritation to real-world blame/praise (prison, reputation, etc.).

  4.  **Refining the Mechanics for Clarity:**
      *   Make sure the Auditor *cannot* see the cards until Checkpoint 3.
