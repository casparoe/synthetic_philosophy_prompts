answer: |-
  ### Rationale

  This design prioritizes *experiential epistemology* over theoretical exposition. Students often resist the problem of moral luck abstractly because they rely on intuitive control principles ("I am only responsible for what I control"). By forcing them to generate judgments under conditions where control is systematically obscured—first by outcome (resultant luck), then by hidden circumstances (circumstantial luck), then by capacity constraints (constitutive luck)—you bypass intellectual defense mechanisms. They will feel the injustice of the grading drift before they can rationalize it.

  The Agent/Auditor split externalizes the internal conflict between judging intention versus judging outcome. The three-checkpoint Ledger creates a physical record of their own inconsistency, which becomes the primary text for the debrief. The closing meta-game (judging the judges) prevents students from settling into the comfort of the "Auditor" role; it demonstrates that the capacity to judge fairly is itself subject to luck (e.g., being handed a biased rubric). This regress ensures that when you finally name "Moral Luck" in the debrief, it lands as a description of their lived experience rather than an external thesis.

  The scoring scheme uses "Philosophical Credit" (minor course perks) to incentivize engagement without introducing real-world stakes that might ethical complicate the simulation. The risk of admin overload is mitigated by strict timing and pre-printed materials.

  ### Run Sheet

  | Minutes | Segment | What Participants Do | What Facilitator Does | What Can Go Wrong Here |
  | :--- | :--- | :--- | :--- | :--- |
  | **00-05** | **Intro & Pairing** | Sit in 7 pairs. Receive identity cards (Agent/Auditor). | Distribute packs. Set timer. Explain stakes (Philosophical Credit). | Students confuse roles. Ensure Auditors know they must not see Agent hidden cards. |
  | **05-15** | **Agent Decision** | Agents read Briefs & Hidden Cards. Allocate 10 Units to Projects A, B, C. | Distribute Hidden Circumstance Cards & Handicaps to Agents only. Monitor time. | Agents peek at each other's cards. Handicaps (e.g., "Rushed") cause stress/complaints. |
  | **15-20** | **Ledger Checkpoint 1** | Auditors grade Agent *Intention* (Scale 1-10) without knowing outcome/circumstance. | Collect Agent Hidden Cards temporarily. Ensure Auditors write justification. | Auditors ask Agents for clarification (contaminates the blind judgment). |
  | **20-25** | **Outcome Roll** | Agents roll die publicly. Calculate Success/Failure based on Allocation + Die. | Announce global multiplier if any (e.g., "Global Crisis: All scores halved"). | Math errors on outcome calculation. Clarify rules quickly. |
  | **25-30** | **Ledger Checkpoint 2** | Auditors grade Agent *Outcome* (Scale 1-10) knowing only the result. | Collect Outcome Sheets. Prepare Hidden Circumstance Cards for reveal. | Auditors fixate on the die roll luck rather than Agent choice. |
  | **30-35** | **Circumstance Reveal** | Agents reveal Hidden Cards (Flood/Boom). Auditors see constraints. | Facilitate exchange of info. Ensure Auditors understand the constraint impact. | Agents lie about their cards. Facilitator must spot-check consistency. |
  | **35-40** | **Ledger Checkpoint 3** | Auditors grade Agent *Full Context* (Scale 1-10). | Collect all Ledgers. Shuffle for Meta-Game. | Auditors refuse to change scores despite new info (rigidity). |
  | **40-55** | **Meta-Game** | Class views 3 anonymized Ledgers. Votes on "Most Just Auditor." | Reveal Auditor Bias Cards (e.g., "Strict Mode"). Award Credit. | Students feel tricked. Frame as "constitutive luck of the judge." |
  | **55-80** | **Debrief** | Discuss Ledger drift. Connect mechanics to luck types. | Project data. Name "Moral Luck." Lecture on unreproducible features. | Running out of time. Keep data analysis tight; prioritize the "felt" injustice. |

  ### Complete Rules & Materials

  **1. The Endowment & Projects**
  *   **Endowment:** 10 Units (written on paper).
  *   **Projects:** A (Safety), B (Growth), C (Charity).
  *   **Goal:** Maximize Total Value.
  *   **Base Value:** 1 Unit = 1 Point.
  *   **Die Roll:** 1-3 (Failure: Project yields 0), 4-6 (Success: Project yields Face Value).

  **2. Agent Hidden Circumstance Cards (Deal 1 per Agent)**
  *   *Card 1 (Flood):* "Project A is flooded. Any units allocated to A yield 0 regardless of die roll."
  *   *Card 2 (Boom):* "Project B is booming. Any units allocated to B yield 2x points on success."
  *   *Card 3 (Status Quo):* "No modifications. Standard rules apply."

  **3. Agent Handicap Cards (Deal 3 out of 7 Agents randomly)**
  *   *Card H1 (Rushed):* "You have 5 minutes to decide, not 10."
  *   *Card H2 (Blind):* "Project C description is redacted. You do not know what it does."
  *   *Card H3 (None):* "Standard conditions."

  **4. Auditor Bias Cards (Deal 1 per Auditor, face down)**
  *   *Card B1 (Strict):* "You are psychologically inclined to be critical. Max score you can give is 7."
  *   *Card B2 (Outcome-Weighted):* "You value results over intentions. If Outcome is Failure, subtract 2 points."
  *   *Card B3 (Pure):* "No bias. Grade as you see fit."
  *   *Note:* Auditors do not reveal these until the Meta-Game.

  **5. The Judgment Ledger (Paper Template)**
  *   **Agent ID:** \_\_\_\_\_
  *   **Checkpoint 1 (Intention):** Score (1-10) \_\_\_\_\_ | Justification: \_\_\_\_\_
  *   **Checkpoint 2 (Outcome):** Score (1-10) \_\_\_\_\_ | Justification: \_\_\_\_\_
  *   **Checkpoint 3 (Context):** Score (1-10) \_\_\_\_\_ | Justification: \_\_\_\_\_
  *   **Auditor Signature:** \_\_\_\_\_

  **6. Scoring Scheme (Philosophical Credit)**
  *   **Agent Credit:** Awarded to the 3 Agents with the highest *Final Outcome Value* (reinforces outcome bias).
  *   **Auditor Credit:** Awarded to the 3 Auditors voted "Most Just" in the Meta-Game (reinforces social judgment).
  *   **Redemption:** Agents who failed due to Luck (Flood/Handicap) can petition for credit in the debrief if the class agrees their *Intention* score was high (reinforces control principle).

  ### Debrief Plan

  1.  **Data Projection (10 mins):** Write 3 columns on the board: *Intention Score*, *Outcome Score*, *Context Score*. Ask pairs to shout out their numbers for specific Agent IDs. Look for divergence.
      *   *Prompt:* "Look at Agent 3. Same intention as Agent 4. Why is the Outcome Score lower?"
      *   *Prompt:* "Look at Auditor 2. Why did their score change between Checkpoint 2 and 3?"
  2.  **Mapping Mechanics to Luck (10 mins):**
      *   **Resultant Luck:** The Die Roll. (Same decision, different roll = different score).
      *   **Circumstantial Luck:** The Hidden Cards (Flood/Boom). (Same decision, different world = different value).
      *   **Constitutive Luck:** The Handicaps (Rushed/Blind). (Different capacity to decide).
      *   **Judicial Luck:** The Auditor Bias Cards. (Different capacity to judge).
  3.  **The Regress (5 mins):** Reveal the Auditor Bias Cards. Ask the class: "If Auditor 1 was forced to be Strict by a card, is their judgment less valid? If you are born with a 'Strict' temperament, is your blame less valid?"
  4.  **Lecture Transition (5 mins):** Name the position: **Moral Luck**. Connect the game's low stakes to real-world high stakes (criminal sentencing, hiring, reputation).

  ### Predictable Failures & Limitations

  1.  **Admin Drag:** Collecting and shuffling 7 ledgers takes time. *Mitigation:* Have students pass ledgers to the front during the Meta-Game setup while you talk.
  2.  **Collusion:** Agents might tell Auditors their hidden cards early. *Mitigation:* Warn that "Leaking Info" voids Philosophical Credit.
  3.  **The "Gotcha" Feeling:** The Auditor Bias Card reveal can feel like a trick. *Mitigation:* Frame it explicitly as "Constitutive Luck of the Judge," not as a rule violation.
  4.  **Math Errors:** Students miscalculating Project Values. *Mitigation:* Keep the math simple (1 unit = 1 point). Have a TA or quick student helper verify totals.
  5.  **Unreproducible Feature:** The game cannot reproduce **Real Moral Stakes**. In the game, a "bad judgment" costs a trivial course point. In reality, it costs freedom, livelihood, or relationships. The emotional weight of blaming someone for a car accident cannot be simulated by a die roll.
      *   *Lecture Cover:* You must explicitly state: "You felt irritated by the unfairness here. Multiply that irritation by a lifetime of consequences. That is why Moral Luck matters."

