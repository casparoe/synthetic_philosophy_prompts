      *Self-Correction on Timing:* 7 pairs means 7 Agents, 7 Auditors. Collecting data from 7 ledgers takes time. I need to streamline the data collection. Maybe only 3 pairs present data? No, all should participate. I will allocate time for the facilitator to quickly scan ledgers during the meta-game.

      *Self-Correction on Meta-Game:* If I tell them "Your rubrics were corrupted," it might feel like a "gotcha." I need to frame it as "Some of you were given additional instructions on how to judge." This mirrors constitutive luck (your nature/instructions) affecting judgment.

      *Luck Types:*
      *   Resultant: Die roll.
      *   Circumstantial: Hidden Project Cards (Flood/Boom).
      *   Constitutive: Agent Handicaps (Rushed/Blind) AND Auditor Bias Cards.
