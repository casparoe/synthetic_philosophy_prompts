      *   *Wait, simpler:* The user wants the Auditors' grading to be graded. Let's have the class vote on which Auditors were "fairest". Then reveal that some Auditors were handed a "Bias Card" at the start (e.g., "Ignore time pressure") which they may or may not have followed. This shows constitutive luck on the judges.

  5.  **Constructing the JSON:**
