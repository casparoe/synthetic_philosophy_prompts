prompt: |-
  I'm a PhD student working on logic, and I've been asked to moderate the Q&A after a departmental colloquium next week. The speaker defends dialetheism — roughly, the view that some sentences are both true and false, with the Liar paradox as the paradigm case — though she's a local dialetheist: she thinks the contradictions are confined to semantic paradoxes, and she wants to somehow recapture classical reasoning everywhere else. She's very sharp and gives textbook answers to textbook objections, so my worry is that a generic Q&A will just let her run the greatest hits.

  Draft me a sequence of about eight questions, ordered so they build on each other rather than sitting as a list. At least one should be on the revenge problem: once she says the Liar is both true and false, we can form a sentence that says of itself that it is only false, and her framework seems pushed into calling that sentence both true and only-false, which she can't consistently assert even by her own lights. Her likely reply will be that the negation in "only false" is a stronger negation than the one her object language contains, so include a follow-up asking whether that stronger negation is expressible in her theory or only available in the metalanguage — and whether a view whose key distinction lives outside its own language can still be stated. I'd also like one on what the truth predicate even does for her: if some sentences are true and false, does asserting a contradiction ever give her a reason to give anything up, or is "true" doing no work that "asserted" couldn't do? And one on the recapture strategy: she says classical logic is fine "away from the paradoxes", but what actually determines where the paradoxes end? That boundry looks drawn by fiat, and I want to press her on whether there's a principled criterion.

  For each question, give a follow-up keyed to the answer she's most likely to give — I want to be able to react to her actual reply, not just fire off prepared shots. End with a question about what would count against dialetheism for her: what she'd treat as a genuine refutation rather than just another cost to absorb. Please skip any warm-up or "how did you get into this" questions; we'll have limited time and she openly dislikes filler.
