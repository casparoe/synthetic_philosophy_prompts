answer: |-
  # SEMINAR HANDOUT: The Gavagai Decision Tree
  **Course:** Philosophy of Language | **Topic:** Indeterminacy of Translation | **TA:** [Your Name]

  **Instructions:** Imagine you are the field linguist in Quine's jungle. You have observed all possible native behavior (past, present, future, including nods and interrogations). Answer the following questions honestly based on your intuitions. Do not worry about which philosopher "owns" the position; find *your* spot in the logical space first.

  ---

  ### 🌳 THE DECISION TREE

  **NODE 1: The Empirical Tie**
  Is it *possible* for two translation manuals to be compatible with **all** possible behavioral evidence yet disagree on what "gavagai" refers to (e.g., Manual A says "rabbit," Manual B says "undetached rabbit part")?
  *   **NO:** Behavioral evidence (plus constraints) *does* fix reference. → *Go to Node 5.*
  *   **YES:** Evidence alone is insufficient; a tie is possible. → *Go to Node 2.*

  **NODE 2: The Shaman Test (Projectibility)**
  Consider a manual that translates "gavagai" as *"rabbit, except on days after the shaman visits, in which case it means undetached rabbit part."* Assuming this fits the data perfectly, is it **evidentially just as good** as the simple "rabbit" manual?
  *   **YES:** Simplicity/projectibility is not an evidential constraint. → **LEAF A: Radical Behaviorist / "Grue" Semantics**
  *   **NO:** We impose constraints (like simplicity) on valid hypotheses. → *Go to Node 3.*

  **NODE 3: The Physics Analogy**
  Is this underdetermination **stronger** than the underdetermination found in physics (e.g., choosing between orbital theories that fit all data)?
  *   **NO:** It is the same as physics (theories differ, facts exist). → **LEAF B: Scientific Underdetermination (Realism)**
  *   **YES:** Translation is uniquely indeterminate (worse than physics). → *Go to Node 4.*

  **NODE 4: The Fact of the Matter**
  If the manuals tie and the case is worse than physics, is there still a **fact of the matter** about what the native means (even if we can't know it)?
  *   **YES:** Meaning is fixed but epistemically inaccessible. → **LEAF C: Epistemic Skepticism**
  *   **NO:** There is literally no fact to be found. → **LEAF D: Quinean Indeterminacy / Kripke-Wittgenstein**

  **NODE 5: The Fixer (Internal?)**
  *(Reached if you answered NO at Node 1)*: What prevents the tie? Is the constraint located in the **speaker's biology/mind**?
  *   **YES:** Innate structures limit possible meanings. → **LEAF E: Chomskyan Nativism**
  *   **NO:** The constraint is external or normative. → *Go to Node 6.*

  **NODE 6: The Fixer (Normative or Metaphysical?)**
  Is the constraint based on **interpretive norms** (we *must* interpret them as rational) or **metaphysical magnetism** (objects attract reference)?
  *   **NORMS:** Charity/Rationality constitutes meaning. → **LEAF F: Davidsonian Interpretivism**
  *   **METAPHYSICS:** The world itself fixes reference. → **LEAF G: Lewisian Metaphysical Realism**

  ---

  ### 🍂 THE LEAVES: Positions & Commitments

  | Leaf | Position | The "Awkward Extra Commitment" |
  | :--- | :--- | :--- |
  | **A** | **Radical Behaviorist** | You must accept that "grue"-like predicates are valid meanings, making communication surprisingly unstable. |
  | **B** | **Scientific Realist** | You reject Quine's specific thesis; you believe meaning is a hidden natural fact like an electron. |
  | **C** | **Epistemic Skeptic** | You believe in facts about meaning that are permanently unknowable, even to God. |
  | **D** | **Quine / Kripke-Wittgenstein** | You must accept that "meaning" is not a robust ontological category; there is no "real" reference. |
  | **E** | **Chomskyan Nativist** | You commit to a rich, innate Universal Grammar that pre-structures semantic hypotheses. |
  | **F** | **Davidsonian** | **Note:** Davidson often lands here *or* at Leaf D; he thinks indeterminacy is benign, not skeptical. |
  | **G** | **Lewisian Realist** | You accept that the world has "natural properties" that magnetically attract our words. |

  ---

  ### 👻 LOGICAL GHOSTS (Empty/Unstable Spots)
  *   **The "Fixed but Factless" Ghost:** Answering **NO** at Node 1 (Meaning is fixed) but **NO** at Node 4 (No fact of the matter). *Verdict: Incoherent.* If it's fixed, there's a fact.
  *   **The "Innate Grue" Ghost:** Answering **YES** at Node 2 (Shaman manual is valid) but **YES** at Node 5 (Innate constraints). *Verdict: Unattractive.* Innate constraints usually rule out gerrymandered predicates like the Shaman case.
  *   **The "Physics Plus" Ghost:** Answering **NO** at Node 3 (Same as physics) but **NO** at Node 4 (No fact). *Verdict: Unexplored.* Standard scientific realism assumes underdetermined theories still describe a factual world.

  ---

  ### ⚠️ A NOTE ON LIMITS
  **Quine vs. Davidson:** This tree separates them at Node 4, but in practice, they overlap significantly. Both deny a "fact of the matter" independent of interpretation. The difference is tone: Quine sees this as a scientific limitation (behaviorism); Davidson sees it as a conceptual truth (charity is constitutive). If you landed on **Leaf D** but feel optimistic about meaning, you are probably a Davidsonian.

  **The Physics Split:** Be careful at Node 3. Quine admits physics is underdetermined by evidence. His radical claim is that translation is *indeterminate* (no fact), whereas physics is merely *underdetermined* (fact exists, theory ambiguous). If you think physics also lacks facts, you are an Instrumentalist, not a Realist.

  ---
  *Print this single-sided. Bring it to seminar.*
