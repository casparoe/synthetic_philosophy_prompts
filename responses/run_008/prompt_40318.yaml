answer: |-
  **MEMORANDUM**

  **TO:** Governance Committee, Graduate Student Assembly
  **FROM:** [Your Name], PhD Candidate & Committee Member
  **DATE:** February 14, 2024
  **SUBJECT:** Recommendation on Electorate Definition for March Childcare Referendum

  **1. Purpose and Context**

  This memo outlines a recommendation for defining the eligible electorate ("the graduate student body") for the upcoming March referendum on the student activities fee and childcare subsidy. As we know, the Assembly's charter does not define this body, and the referendum's legitimacy depends on our ability to draw a boundary that is both administratively workable and politically principled.

  We face two polarized positions: one faction advocates using the Registrar's current headcount of registered students for administrative cleanliness; another argues for an "all affected parties" standard that would extend voting rights to non-student partners. Neither option is theoretically satisfactory. The former risks excluding members with a legitimate stake; the latter risks expanding the electorate beyond the polity the Assembly is authorized to govern.

  **2. The Philosophical Challenge: The Boundary Problem**

  We must acknowledge that political theory offers no consensus resolution to what is known as the "boundary problem" (Whelan, 1983). There is no self-evident formula for who constitutes "the people" in any given decision. However, we can distinguish between widely accepted constraints and contested claims.

  It is widely accepted that a democratic body must be bounded; a vote cannot include everyone in the world. It is also generally accepted that those subject to binding coercion (e.g., mandatory fees) have a strong claim to participation (the "All Subjected to Coercion" principle). However, the "All Affected Interests" principle—that anyone impacted by a decision should vote—is contested because, pushed to its limit, it proves too much. Almost any policy affects non-members (e.g., local landlords, future employers, family members). If we grant voting rights based solely on affected interests, we dissolve the boundary of the student polity entirely. This is why we cannot, in good faith, extend ballots to non-student partners. While they are deeply affected by childcare availability, they are not members of the *Graduate Student Assembly*. They cannot hold this body accountable in future cycles, nor are they subject to the University's student governance structures. Including them would conflate a stakeholder interest with membership in a self-governing community.

  **3. Proposed Principle: Constituent Membership**

  Rather than relying solely on "affected interests" or raw registration data, I recommend we adopt a standard of **Constituent Membership**. This standard combines two criteria:
  1.  **Formal Status:** A recognized institutional tie to the University (typically registration).
  2.  **Enduring Stake:** The capacity to remain part of the community long enough to experience the reciprocal accountability of the decision (i.e., the ability to judge the outcome in a future cycle).

  This principle respects the Registrar's data as a baseline for formal status but corrects it where administrative categories fail to capture political membership.

  **4. Application to Contested Groups**

  Applying the Constituent Membership standard, I recommend the following determinations for the four contested groups:

  *   **Students on Parental/Medical Leave: ELIGIBLE.**
      *   *Reasoning:* Although they are not currently registered for courses (and thus may not appear on a strict Registrar headcount), they retain their status as graduate students in good standing. They intend to return and will be subject to the fee and eligible for the subsidy upon re-enrollment. Excluding them would disenfranchise members based on a temporary pause in their studies, violating the principle of enduring stake.
  *   **Dissertation Writers (Off-Campus): ELIGIBLE.**
      *   *Reasoning:* These students are technically registered and paying the fee. They remain degree-seeking members of the community. Their physical absence does not negate their membership or their subjection to the fee.
  *   **Part-Time Professional Master's Students: ELIGIBLE.**
      *   *Reasoning:* While they utilize fewer activities funded by the fee, they are fully registered members subject to the coercion of the fee. In a political community, the right to vote is not contingent on the intensity of benefit usage (otherwise, low-income students who use fewer services might be excluded). Their membership status grants them the right to decide how collective resources are allocated, even if their personal utilization is low.
  *   **Visiting Exchange Students: INELIGIBLE.**
      *   *Reasoning:* This is the most difficult case. While they are registered and will pay the fee, their status is transient by definition. They will depart before the subsidy is operational and cannot participate in the subsequent accountability cycle (e.g., voting to renew or repeal the fee based on its performance). In political theory terms, they are akin to temporary residents rather than citizens. While it is regrettable they will pay a fee they cannot vote on, the GSA is a self-governing body of the *degree-granting* community. Their primary political membership lies with their home institutions. Extending the vote here would stretch the "coercion" principle beyond the bounds of our specific polity.

  **5. The Role of the Registrar's Headcount**

  The faction advocating for the Registrar's headcount is correct that administrative clarity is a virtue. A defined, verifiable list is necessary to conduct a secure election. Therefore, the Registrar's list should serve as the **default baseline** for eligibility. It is a defensible proxy for "Formal Status."

  However, the Registrar's list is merely convenient, not principled, when it conflicts with political membership. It fails to capture students on leave (who are members but not currently course-registered) and it incorrectly includes visitors (who are registered but lack an enduring stake). We should instruct the Elections Committee to use the Registrar's list *modified* by manual inclusion of students on approved leave and manual exclusion of visiting exchange students.

  **6. Recommendation**

  I move that the Governance Committee recommend the following definition of "the graduate student body" to the Assembly:

  *   All students currently registered for graduate courses, **excluding** visiting exchange students; **plus**
  *   All students currently on approved parental or medical leave who intend to re-enroll.

  This approach balances the need for a clear administrative list with a principled account of membership. It rejects the over-expansion of the "affected interests" principle while correcting the under-inclusion of a strict "registration only" view.

  I look forward to discussing this framework at our meeting.
