answer: |-
  Good evening, everyone. For those who don't know me, I'm the brother. Which means I've had the unique privilege of watching [Groom's Name] try to apply game theory to Thanksgiving dinner since 2012.

  Looking around this room, I realize we have a bit of a divide. On my left, we have the family. You see a man who had that massive tournament score a few years ago. You see a genius who cracked the code. You see the check framed on the wall.

  On my right, we have the poker community. And I know, I *know*, that when I mention that score, half of you are physically cringing. Because you know the truth. [Groom] knows the truth. He's told me himself that win was mostly variance. Luck. In his world, praising someone for a lucky outcome isn't a compliment; it's an insult. It's like praising a surgeon because the patient survived a lightning strike.

  So, I'm not going to toast his winnings. I'm going to toast his discipline.

  Because my brother has organized his entire life around a pretty sobering fact: He doesn't control the cards. He believes roughly half of life is just fortune—random chaos—and the only thing you actually own is the quality of your decisions.

  He's a bit of a student of history. Specifically, he's a fan of Machiavelli. Don't worry, [Bride's Parents], not the "poison your enemies" part. He has a printed page pinned above his desk from *The Prince*. It's the chapter where Machiavelli compares fortune to a violent river. He says when the flood comes, it flattens everything. You can't stop the rain. But, in calm weather, you can build dikes and embankments. So when the water rises, it does less damage.

  [Groom] treats that as career advice. He spends his life building dikes. He manages risk so meticulously that when the bad beats come—and they do come—he doesn't wash away. He's not a gambler in the sense that he likes risk; he's a professional risk *manager*. He's the guy who checks the tire pressure so we don't have to worry about the blowout.

  And that brings me to the thing that actually matters today. What does it mean to love a man like that?

  It means you never have to panic. Because he knows the difference between a bad result and a bad decision. If dinner burns, it's a bad result, not a bad decision to try a new recipe. If the flight is delayed, it's variance, not a crisis. Loving him means living with someone who refuses to let the chaos of the world dictate the mood of the house. He builds the embankments so the people he loves can stay dry.

  But there is a irony here. For twelve years, he's lived by the rule: "Never fall in love with the outcome." And yet, today, he is publicly betting everything on one specific outcome. He is choosing [Bride].

  Now, [Bride], I need to address you and your family directly. I know the word "gambling" makes some people nervous. But I want you to know: [Groom] isn't treating this marriage like a hand of poker. He's not calculating odds. He's not waiting to see if he gets a better hand on the turn. He knows that in this specific game, you don't protect yourself against the variance by building walls. You protect yourself by having a partner who stands next to you when the river rises.

  He knows he can't control the cards life deals him. But he knows, with absolute certainty, that he wants you in his corner when the flood comes.

  So, if I could ask everyone to raise a glass.

  To [Groom] and [Bride]. May you build strong dikes against the hard times. May you recognize that luck plays a part in your joy, so you never take it for granted. And may you never, ever judge your marriage by a single bad day, but only by the quality of the love you show each other every time you shuffle up and deal.

  To the happy couple.
