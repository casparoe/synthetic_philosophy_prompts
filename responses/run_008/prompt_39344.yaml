  Here is a decision tree designed for your interactive feature. It is constructed from the logical commitments of the positions rather than the historical figures associated with them. The questions focus on concrete biological scenarios to elicit the reader's intuition before labeling their view.

  ### The Logic Map
  The tree is structured to separate views based on two axes:
  1.  **Scope:** At which biological hierarchy does the reader perceive the *primary* causal engine of adaptation? (Gene/Cell → Organism → Group → Species)
  2.  **Ontology:** Does the reader view higher-level descriptions as distinct causal forces or as bookkeeping for lower-level processes? (Reductionism → Pluralism/Realism)

  ---

  ### The Decision Tree

  **Start:** You accept that natural selection occurs and that traits which improve survival and reproduction tend to become more common.

  #### Node 1: The Internal Conflict (Meiotic Drive & Somatic Evolution)
  **Case:** Consider a "cheating" allele that forces its way into 90% of offspring (meiotic drive), or a tumor lineage that evolves resistance to therapy within a body (somatic evolution). In both cases, a part of the system replicates successfully while damaging the larger whole (the organism).
  **Question:** When the cheating allele spreads or the tumor grows, is natural selection genuinely operating *on* that gene or cell lineage, or is this merely a breakdown of the selection operating on the organism?
  *   **A) It is selection on the part.** The gene or cell is a unit that replicates, varies, and has differential fitness, even if it harms the host. *(Go to Node 2)*
  *   **B) It is pathology of the whole.** Selection acts on the organism; the gene/cell is just a malfunctioning component, like a failing brake pad. *(Go to Node 3)*

  #### Node 2: The Accounting Hinge (Causation vs. Bookkeeping)
  **Case:** (For those who chose A). We can track the frequency of the cheating gene perfectly. We can also track the survival of the organism.
  **Question:** If we know the gene frequencies, is saying "the organism was unfit" just a convenient shorthand (bookkeeping) for the gene changes, or does the organism's death exert a causal force that the gene list alone misses?
  *   **A) It is bookkeeping.** The gene frequency change is the fundamental reality; organism talk is a summary. *(Leaf: Gene-Level Selectionism)*
  *   **B) It is causal context.** The gene changes matter, but the organism's fate is a distinct causal layer that constrains or enables the genes. *(Leaf: Pluralist)*

  #### Node 3: The Social Conflict (Sterile Workers & Haystacks)
  **Case:** (For those who chose B at Node 1). Consider sterile ant workers who die for the colony, or a "haystack" model where groups of cooperators out-survive groups of selfish individuals.
  **Question:** When the colony thrives despite sterile workers, or the cooperative group out-competes the selfish one, did selection act on the *group/colony* as a unit, or did it act on the *individuals* (perhaps via their relatives)?
  *   **A) It acted on the group.** The colony or group had a survival rate distinct from the sum of its members' fitness. *(Leaf: Multi-Level / Group Selection)*
  *   **B) It acted on the individuals.** The workers helped their own genes (via kin), or the individuals in the cooperative group happened to be the lucky survivors. *(Go to Node 4)*

  #### Node 4: The Macro Conflict (Species Selection)
  **Case:** (For those who chose B at Node 3). Consider a trait like "geographic range size" that varies between species. Species with wide ranges speciate more often and go extinct less often than species with narrow ranges.
  **Question:** Is this pattern natural selection operating on *species* as individuals, or is it simply the accumulated effect of many individual organisms surviving better within the wide-ranging species?
  *   **A) It is selection on species.** Species are born (speciate), die (extinct), and have heritable traits; they are units of selection. *(Leaf: Species Selection)*
  *   **B) It is the effect of organisms.** Species don't reproduce in a way that allows selection; this is just the sum of individual organism success. *(Leaf: Organism-Centered Selection)*

  ---

  ### The Leaves: Positions & Awkward Commitments

  | Leaf Position | Definition | The "Hard Pill to Swallow" (Most Awkward Commitment) |
  | :--- | :--- | :--- |
  | **Gene-Level Selectionism** | Genes are the only true replicators; organisms are vehicles. | Must describe sterile workers as "machines" built by genes, denying the worker is an individual with a fitness of zero. |
  | **Pluralist** | Different levels (gene, organism, group) are legitimate descriptions depending on the question asked. | Must accept there is no single "true" story of an evolutionary event, which frustrates the desire for a unified theory. |
  | **Multi-Level / Group Selection** | Selection operates simultaneously at multiple levels, often in conflict (e.g., individual vs. group). | Must define exactly when a "group" becomes a distinct individual worthy of selection, which can be arbitrary in fluid populations. |
  | **Species Selection** | Macroevolutionary patterns are driven by selection on species traits, not just microevolution. | Must treat species "birth" (speciation) and "death" (extinction) as analogous to organism reproduction, which is metaphorically stretched. |
  | **Organism-Centered Selection** | The organism is the primary interactors; selection above or below is derivative. | Must classify meiotic drive and cancer as "system failures" rather than evolution, ignoring that they follow selection rules perfectly. |

  ---

  ### Logical Gaps & Unheld Combinations

  **1. The "Species-Only" Selectionist (Incoherent)**
  *   **Combination:** A reader who selects *Species Selection* at Node 4 but *Organism-Centered* at Node 3 (believing species are selected but organisms are not).
  *   **Status:** **Incoherent.** Species are composed of organisms. If organisms do not replicate and vary, species cannot have heritable traits. This view is logically impossible because the higher level depends on the lower level's mechanics.

  **2. The "Group-Without-Gene" Selectionist (Unattractive/Unexplored)**
  *   **Combination:** A reader who selects *Multi-Level/Group* at Node 3 but denies *Gene-Level* mechanisms entirely (believing groups are selected but genes are not replicators).
  *   **Status:** **Unattractive.** While logically possible to argue groups are the *primary* unit, denying the gene's role as the mechanism of heredity makes it difficult to explain *how* group traits are inherited. Most Group Selectionists accept genes as the mechanism of inheritance, even if the *unit* of selection is the group.

  **3. The "Tumor Evolution" Denier (Incoherent)**
  *   **Combination:** A reader who selects *Organism-Centered* at Node 1 (tumor is pathology, not selection) but accepts *Gene-Level Selectionism* elsewhere.
  *   **Status:** **Incoherent.** Somatic evolution (tumors) follows the exact logic of gene-level selectionism (mutation, replication, differential survival). Accepting gene selection generally forces one to acknowledge tumor evolution as a form of selection, even if it is pathological for the host.

  ---

  ### Indistinguishable Leaves (The "Formal Machinery" Limit)

  You should inform readers that the tree cannot perfectly separate the following pairs. This distinction often requires mathematical formalism (like the Price Equation) rather than intuition about cases.

  **1. Gene-Level Selectionism vs. Pluralist (The "Dominant" Problem)**
  *   **Why they blur:** A Pluralist might agree that in the Meiotic Drive case, the gene is the *dominant* causal story. If they answer Node 2 by saying "Genes are the main cause, but organisms matter sometimes," they might land on **Gene-Level Selectionism** when they are actually **Pluralists**.
  *   **Interface Note:** "If you feel genes are the *primary* driver but not the *only* description, you sit on the border between Gene-Level and Pluralist."

  **2. Kin Selection (Gene) vs. Group Selection (Multi-Level)**
  *   **Why they blur:** In the Sterile Worker case (Node 3), mathematical models often show that "Kin Selection" (helping relatives spreads *your* genes) and "Group Selection" (groups with helpers outcompete groups without) are mathematically equivalent descriptions of the same change in frequency.
  *   **Interface Note:** "Readers who choose 'It acted on the individuals (via kin)' and those who choose 'It acted on the group' often agree on the biological outcome but disagree on the best *language* to describe the cause. This is the hardest split in the debate."

  **3. Pluralist vs. Multi-Level Selection**
  *   **Why they blur:** Both positions acknowledge selection at multiple levels. The distinction is subtle: **Multi-Level** often implies distinct causal *forces* pushing in opposite directions, while **Pluralism** often implies distinct *descriptions* of the same process.
  *   **Interface Note:** "If you believe multiple levels are real, you may land on either Pluralist or Multi-Level depending on whether you see them as different views of one process or competing forces."
