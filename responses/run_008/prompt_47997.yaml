          *   Separate theory from partisanship? Maintained throughout.

  6.  **Writing the Essay:** (Focusing on tone: analytical, philosophical, precise.) *Self-correction: Ensure I explicitly mention the 12.5% unemployment context as the driver for the "work-sharing" rationale.* *Make sure to distinguish between the 1998 and 2000 laws briefly if needed, but treat them as the "Aubry regime."* *Ensure the distinction between "instrumental" and "constitutive" work is clear.*

      *(Drafting mental outline of the conclusion)*: Keynes didn't anticipate the *anxiety* of leisure. Weber didn't anticipate the *secularization* of the ethic without the *salvation*. Both are silent on the *power dynamics* of who decides the hours (state vs. firm vs. individual).

  7.  **Final Review:** Does this answer the specific question about whether the "work-sharing" rationale matters for the theory test? Yes, it shifts it from a Keynesian *cultural* shift to a Keynesian *macroeconomic* fix, which changes how we interpret the failure. If the goal wasn't leisure, the lack of leisure enjoyment isn't a refutation of Keynes's *prediction*, but it is a refutation of his *hope*.

      *Wait, one more check:* The prompt asks: "Is the willingness of many to buy their hours back... a revealed-preference refutation of Keynes, or just his own point about insatiable relative needs?" I need to be decisive here. It's the latter. Keynes explicitly warned about relative needs.

      *Weber Check:* "What does the episode say about Weber, given that Catholic France legislated against a work discipline he had located in the Protestant north?" Answer: The ethic has become institutional/bureaucratic, detached from theology.

