answer: |-
  The Aubry laws of 1998 and 2000, which mandated a reduction of the legal workweek in France from 39 to 35 hours, stand as one of the most significant natural experiments in the political economy of time. Enacted by Lionel Jospin's Plural Left coalition against a backdrop of 12.5% unemployment, the legislation was a desperate macroeconomic intervention disguised as a social reform. To analyze this episode through the rival lenses of John Maynard Keynes and Max Weber is to uncover a tension not merely between policy outcomes, but between two anthropological visions of human nature: one that anticipates leisure as the final dividend of progress, and another that sees work as the constitutive ground of moral life.

  However, a disciplined analysis requires separating the theoretical commitments of Keynes and Weber from the partisan claims of the Socialists who passed the laws and the Conservatives who later dismantled them. The Left claimed the laws would create a million jobs; the Right claimed they would destroy competitiveness. Neither claim maps cleanly onto the philosophical theories in question. The test lies not in the unemployment statistics, which remain contested, but in the behavioral response of the workforce to the availability of time and the structure of obligation.

  ### The Keynesian Miscalculation: Instrumental Leisure vs. The Art of Living

  Keynes's 1930 essay, *Economic Possibilities for our Grandchildren*, rests on a specific technological optimism: productivity would solve the problem of scarcity, rendering long hours unnecessary. The challenge, Keynes argued, would be psychological: learning to live "wisely and agreeably." He assumed that once the pressure of economic necessity was lifted, leisure would be naturally embraced as a good in itself.

  The Aubry laws, however, were not Keynesian in spirit, though they were Keynesian in mechanism. The stated rationale was work-sharing (*partage du travail*), not leisure enhancement. The state did not offer the 35-hour week as a cultural invitation to pursue the arts or family life; it offered it as a rationing mechanism to spread scarce employment opportunities. This distinction matters profoundly for the theoretical test. Keynes predicted a *demand* for leisure driven by satiated needs. The Aubry laws imposed a *supply* of leisure driven by labor market rigidity.

  When the Nicolas Sarkozy government passed the TEPA law in 2007, making overtime pay tax-exempt under the slogan "work more to earn more," a significant portion of the French workforce opted to "buy back" the hours the state had given them. Is this a revealed-preference refutation of Keynes? Superficially, it suggests workers value income over time. However, a closer reading suggests it confirms Keynes's darker insight regarding "relative needs." Keynes distinguished between absolute needs (which are satiable) and relative needs (which are insatiable, as they depend on feeling superior to others).

  The French workers who took the overtime were not necessarily rejecting leisure because they lacked the skill to enjoy it (the Keynesian psychological problem); they were often accepting it because the 35-hour reduction had not been accompanied by proportional wage increases for all, or because the cost of living had outpaced the productivity dividend. By choosing overtime, they were trapped in the realm of relative needs Keynes warned about. The failure was not that Keynes was wrong about productivity—he was right, as French hourly productivity remained robust—but that he underestimated the social pressure to convert productivity gains into consumption rather than time. The state treated time as a macroeconomic variable; the workers treated it as a currency to be traded for status and security.

  ### The Weberian Paradox: Discipline Without the Calling

  If the Keynesian lens reveals the insatiability of needs, the Weberian lens reveals the stickiness of discipline. In *The Protestant Ethic and the Spirit of Capitalism*, Weber argued that disciplined, rational work became a "calling," a moral end in itself that survived the dissolution of its religious justifications. He located this specifically in the Protestant North, contrasting it with the Catholic South, which he viewed as more traditional and less driven by systematic accumulation.

  The French episode presents a paradox: a historically Catholic nation legislated a reduction in work time, ostensibly rejecting the Protestant ethic, yet the implementation reinforced the Weberian discipline. The 35-hour week did not lead to a dissolution of work intensity; it led to its compression. To maintain output within fewer hours, firms intensified shifts, automated tasks, and tightened monitoring. Hourly productivity did not collapse; it surged. This suggests that the "spirit" of capitalism had detached from its Protestant genealogy and become embedded in the bureaucratic and managerial structures of globalized industry. The work ethic was no longer a matter of individual salvation but of organizational survival.

  Furthermore, the exemption of managers (*cadres*) through annualized-days contracts (*forfait jours*) highlights a class division in the Weberian ethic. For the working class, work remained instrumental (hours traded for wages), and the state could regulate the time. For the managerial class, work remained constitutive. Their contracts were not based on hours but on the completion of tasks, effectively legalizing the "calling" where work bleeds into life. The fact that managers accepted, and often embraced, this exemption suggests that for the professional class, the Weberian prediction holds: work is not merely a burden to be reduced but a domain of identity that resists legislative containment.

  Weber would likely argue that the French attempt to legislate leisure failed to account for the internalized compulsion to work. The anxiety of idleness described by Weber did not vanish with the Catholic tradition; it was secularized into career anxiety. The willingness to intensify work within the 35-hour frame demonstrates that the discipline of work is not easily legislated away, even when the theological underpinnings are absent.

  ### The Unanticipated and The Silent

  Ultimately, the Aubry episode exposes blind spots in both theories that partisans on both sides of the French debate ignored.

  Keynes never anticipated that leisure requires infrastructure and social validation that capitalism does not provide. He assumed that "living wisely" was a default human capacity that would emerge once the shackles of toil were removed. The French experience suggests the opposite: without a cultural framework that values non-instrumental time, leisure becomes merely "non-work," a void to be filled with consumption or anxiety. The theories are silent on the *politics of time*: Keynes assumed the state could simply hand over time, but he did not foresee that without a corresponding shift in social status attached to leisure, time would remain a secondary good to income.

  Weber, conversely, did not anticipate that the "ethic" could become so thoroughly bureaucratized that it would operate without the "spirit." He linked the discipline to a specific psychological drive rooted in religious anxiety. The French case shows that work discipline can be maintained purely through managerial pressure and economic precarity, devoid of any sense of "calling." The theories are silent on the *power dynamics* of the workplace: Weber focused on the worker's internal state, but the intensification of the 35-hour week was often driven by employer mandates, not worker volition.

  Where the honest answer is that the theories are simply silent is on the question of *heterogeneity*. Neither Keynes nor Weber accounted for a society where the relationship to work is so sharply bifurcated. For the French *cadre*, the Weberian ethic thrives (work is identity); for the service worker, the Keynesian trade-off is purely financial (hours are money). The Aubry laws treated the workforce as a monolith, assuming a uniform desire for time or a uniform capacity for work-sharing.

  In the end, the 35-hour week was not a test of whether humanity could handle freedom, as Keynes hoped, nor a test of whether the moral obligation to work could be broken, as Weber might have feared. It was a demonstration that in a mature capitalist economy, time is not a natural resource to be enjoyed, but a factor of production to be optimized. The French workers who took the overtime under Sarkozy were not refuting Keynes; they were navigating a system where the "economic possibilities" had indeed arrived, but the social architecture to support the "good life" had not. The discipline of work remains, not because of Protestant theology, but because the alternative—unstructured time in a society organized around employment—remains, for now, unintelligible.
