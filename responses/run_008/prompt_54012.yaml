answer: |-
  The syllabus from Community College of Allegheny County still sat on Elena's kitchen table, weighted down by a salt shaker and a stack of unopened mail. It was from two semesters ago, *PHI 105: Introduction to Metaphysics*. She had been the only auditor over fifty, the only one who didn't need the credits, the only one who took notes in a leather-bound journal instead of a spiral notebook. She hadn't gone looking for comfort. She had gone looking for structure, something rigid enough to hold the weight of a house that had gone quiet two years prior.

  She found it in David Lewis.

  The professor, a grad student with a nervous tic in his left eye, had drawn diagrams on the whiteboard. Circles representing worlds. He called it Modal Realism. *Plenitude.* The view that possible worlds are not stories, not abstractions, not pictures in the mind. They are concrete. They are flesh. They are as real as the linoleum beneath Elena's feet.

  *Ontological parity,* she had written in her journal. *No world is special except by indexicality.*

  It was the elegance that hooked her, not the hope. Lewis argued that you couldn't see the other worlds, couldn't touch them. They were spatio-temporally isolated. No portals, no dreams, no ghosts. They were simply *there*, in the same way that Tokyo is there while you sit in Pittsburgh. You cannot walk to Tokyo without traversing the space between; you cannot walk to World B without traversing a gap that is not space at all.

  At first, the belief acted like a narcotic. When the grief hit her in the shower, when the water went cold and she slid down the tiles, she could stop the spiral. *Maya is dead here,* she would think. *But the set of all worlds is plenitudinous. There is a world where the car skidded on the ice and stopped. There is a world where Maya decided to study abroad. There is a world where I never bought her that car.*

  In those worlds, Maya was breathing. She was aging. She was twenty-four, then twenty-five. She was concrete. It wasn't a heaven of spirits; it was a universe of matter. The comfort was visceral. Elena could lean against the counter and feel the solidity of it. Her daughter existed. The totality of existence had not lost her.

  But then the second half of the course began, and the narcotic wore off, leaving the raw nerve exposed.

  Counterpart Theory.

  Lewis was strict. Identity is world-bound. You are here. You are only here. The woman in the other world who looks like you, who has your memories up to the divergence point, who wakes up in a bed that looks like yours… she is not you. She is your counterpart. She resembles you. She is maximally similar. But she is numerically distinct.

  Elena stared at the salt shaker. If the other Elena was not her, then the other Maya was not hers.

  The vertigo came in waves. If all worlds are real, why is *this* one marked "actual"? Lewis said the word *actual* is indexical. It works like *here* or *now*. When I say "here," I mean where I am. When you say "here," you mean where you are. Neither of us is wrong. When the other Elena says "actual," she means her world. She is right.

  There was no cosmic spotlight shining on Pittsburgh, 2024. There was no reason she was this Elena and not the one who woke up next to a living daughter. It was brute fact. Arbitrary. She was stranded in the extension of *this* specific world not because it was chosen, but because she was indexed to it.

  It made the grief lonely. In the early months, she had imagined a kind of shared suffering. But if the other Elena was a different person, then her grief was different too. In the world where Maya lived, there was no grief. In the world where Maya died twice, the grief was double. They were not sharing the burden. They were just separate women, identical in structure, suffering in isolation.

  Elena picked up the syllabus. The final unit was *Decision and Deliberation*.

  She stood up and walked to the hallway. The door to Maya's room was closed. It had been closed for twenty-three months. Inside, the dust motes hung in the air, undisturbed. Clothes were folded on the chair. A half-finished sketchbook lay on the desk.

  Tomorrow was the anniversary. Her sister had suggested they clear the room. "Don't keep it as a shrine, El. It stops the clock."

  Elena had agreed to decide tomorrow. Keep the room, or clear it.

  She stood with her hand on the doorknob. The metal was cold.

  If she kept the room, she would be preserving the past. She would be the Elena who couldn't let go. If she cleared it, she would be the Elena who moved forward. She would be the Elena who survived.

  Under Modal Realism, both Elenas already existed.

  In some worlds, the door remained closed forever. The dust thickened. The clothes smelled of stale air. In other worlds, the box was packed today. The room was painted beige. It became a guest room.

  Lewis said that deliberation is not about creating possibilities. The possibilities are already there, concrete and fixed. Deliberation is about finding out which one you are in. But that wasn't quite right, either. She couldn't find out until she acted. Her action was part of the causal chain of *this* world.

  But there was a muddled hope, human and irrational, that tugged at her hand. If she cleared the room, would she be more like the lucky Elena? The one whose Maya lived?

  No. That was magic. The lucky Elena didn't clear the room because her daughter was still using it. The lucky Elena's life was different in kind, not just in choice. Clearing the room here wouldn't make her a counterpart to the happy mother. It would just make her a counterpart to the women who cleared rooms.

  There were counterparts of Elena who cleared the room and remained broken. There were counterparts who kept the room and found peace. The action didn't guarantee the similarity that mattered.

  She turned the knob. The latch clicked.

  The room smelled of lavender and old paper. Nothing had moved. The sketchbook was open to a drawing of the house, seen from the street. The perspective was wrong; the roof was too steep. Maya had always hated perspective.

  Elena sat on the edge of the bed. The mattress dipped.

  She thought about the indexicality again. *Actual.*

  When she said "Maya is dead," she meant *here*. When the other Elena said "Maya is alive," she meant *there*. Both statements were true. Both women were real. Neither was a ghost. Neither was a dream.

  The hard edge of the theory was that she could not cross the gap. She could not visit the world where the car stopped. She could not hug that Maya. That Maya was as unreachable as a star in a different universe, only more so, because there was no space between them, only isolation.

  But there was a comfort in the parity. If her world wasn't special, then her pain wasn't the center of the universe. It was just a local condition. There were worlds where this house never existed. Worlds where Elena died young and Maya grew old. Worlds where the snow didn't fall that night.

  The suffering wasn't unique. It was just distributed.

  Elena opened the drawer of the nightstand. Inside was a box of photographs. She took one out. Maya at six, missing a front tooth, holding a ice cream cone that was melting over her hand.

  In this world, the ice cream stained the carpet. In another world, Maya caught the drip. In another, the photo was never taken.

  She held the picture. She was here. The photo was here. The grief was here.

  She thought about the choice again. To pack the box or leave it.

  If she packed it, she was aligning herself with the counterparts who endure by shedding. If she left it, she aligned with those who endure by holding. She realized she wanted to be the counterpart of the woman who was happy. But happiness wasn't a choice you made in a kitchen. It was a state of the world.

  She couldn't become the lucky Elena. She could only be this Elena, doing what this Elena does.

  But there was a strange freedom in that. If "actual" was just where she stood, then she didn't need to justify why she was here. She didn't need to wonder why she wasn't there. There was no *why*. There was only *here*.

  The other Elenas were not waiting for her. They were not watching. They were living their own indexical moments. They were saying "now" and meaning their own time. They were saying "I" and meaning their own selves.

  She put the photograph back in the box. She closed the drawer.

  She stood up and walked to the window. The rain had stopped. The street outside was wet, reflecting the orange glow of the streetlights. A car drove past, tires hissing on the wet asphalt.

  In some worlds, that car was Maya's. In most, it wasn't.

  Elena placed her hand against the glass. It was cold. Solid.

  She whispered to the room, to the house, to the silence that was specific to this coordinate of reality.

  "I am here."

  It wasn't a lament. It was a location.

  She turned off the light. The room went dark, but the house remained. The other houses remained. The other women turned off their lights in their own worlds, in their own nows, believing themselves to be the center of the real.

  Elena walked down the hall. She would leave the room as it was. Not because it kept Maya here, but because clearing it wouldn't bring her back. And keeping it wouldn't stop the world from turning.

  She went to the kitchen and picked up the syllabus. She folded it once, twice, and put it in the recycling bin.

  She filled the kettle. She took one mug from the cupboard. She set it on the counter.

  The water began to boil. The sound was loud in the quiet house. It was the sound of this world, heating up, moving forward in this time.

  Elena waited for the whistle. She was actual. She was here. And somewhere, in the infinite plurality of things, another woman was waiting for a whistle too, and she was actual there.

  The kettle screamed. Elena poured the water. The steam rose, white and transient, vanishing into the air of the kitchen, into the air of this world, which was all she had, and which was enough to be real.
