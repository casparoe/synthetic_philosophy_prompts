answer: |-
  ### 1. The Principle: Fair Cooperation

  The single principle that best captures your social verdicts (Fraud, Free-riding, Line-Cutting, Tipping) while avoiding the "rule consequentialism in a wig" critique is a refined version of your tentative principle. Let's call it the **Principle of Fair Cooperation**:

  > **A maxim is impermissible if it accepts the benefits of a cooperative practice without bearing the burdens necessary to sustain that practice, when the practice relies on widespread compliance to function.**

  This is distinct from simple universalizability ("what if everyone did that?") because it focuses on **free-riding** rather than logical contradiction. It explains why an act can be *conceivable* in a universalized world (a world of line-cutters is physically possible) but still *wrong* (you are taking a benefit—orderly access—that depends on others following a rule you are breaking).

  ### 2. Repairing the Line-Cutting vs. Email Distinction

  Your current struggle is that Line-Cutting and Email-Ignoring both seem to pass the "conceivability" test, yet you judge them differently. The Principle of Fair Cooperation resolves this by distinguishing between a **Cooperative Practice** and a **Personal Preference**.

  *   **Line-Cutting:** A queue is a paradigmatic cooperative practice. The benefit (orderly, first-come-first-served access) exists *only* because others bear the burden of waiting. When you cut, you accept the benefit of the queue's existence while refusing the burden of waiting. You are free-riding. **Verdict: Wrong.** (Matches your strictness).
  *   **Email-Ignoring:** Is there a cooperative practice of "mandatory immediate responsiveness"? Generally, no. Email functions as an asynchronous tool; there is no mutual agreement that "I answer you immediately if you answer me immediately." Therefore, ignoring email does not free-ride on a specific cooperative burden others are bearing. **Verdict: Permissible.** (Matches your leniency).

  *However*, this repair comes with a cost, which leads to the surrender question below.

  ### 3. The Tipping Case and Neglected Talents

  **The Tipping Case:**
  Your intuition ("smells exactly like the free-rider") is correct under this principle. The tipping norm is a cooperative practice: customers collectively subsidize server wages to ensure good service and fair pay.
  *   **Objection:** "I'm never coming back; I don't depend on the continuing relationship."
  *   **Reply:** You do not depend on the *relationship*, but you depend on the *institution*. You are consuming a service whose economic viability relies on the norm of tipping. By not tipping, you accept the benefit of the norm (the service model) without bearing the cost. The fact that you are a "one-time" actor does not exempt you from the fairness obligation any more than a shoplifter is exempt because they won't return to that store.
  *   **Verdict:** **Wrong.** The principle validates your unease.

  **Neglected Talents:**
  Here the Principle of Fair Cooperation hits a wall. Neglecting your talents is not primarily a violation of fairness toward others (unless you have dependents); it is a failure of **Rational Agency**.
  *   **Diagnosis:** This verdict cannot be derived from Fair Cooperation alone. It requires a second limb, often Kantian: **The Duty to Self.** A rational agent must will the development of their capacities because a world where all agents neglect their capacities is one where rational agency itself is undermined (you cannot will to be helpless if you will to be an agent).
  *   **Coverage:** This requires an **ad hoc clause**. You must admit that your ethical system is hybrid: Fair Cooperation for social acts, Duty to Self for personal development. There is no non-ad hoc way to fold "Talents" into "Fairness" without arguing that you are "free-riding on society's investment in you," which is a stretch for a hermit.

  ### 4. The Verdict to Surrender

  You asked which verdict this candidate forces you to surrender: your leniency on email, your strictness on line-cutting, or your unease about one-time tipping.

  To maintain a non-ad hoc, unified principle, you must surrender **your leniency on email.**

  **Why?**
  To distinguish Line-Cutting (Wrong) from Email-Ignoring (Permissible) using the Principle of Fair Cooperation, you must argue that a Queue is a cooperative practice but Email Responsiveness is not.
  *   **The Tension:** In a rationalist/professional context, email *is* a cooperative practice. The utility of the network depends on a norm of reasonable responsiveness. If you send emails expecting replies, you are benefiting from the norm that "people read and answer emails." If you universally adopt the maxim "I answer only when I feel like it," you degrade the utility of the system for others while relying on them to maintain it for you.
  *   **The Cost:** If you accept that Line-Cutting is wrong because it exploits a cooperative norm (the queue), consistency demands you admit that Email-Ignoring is wrong if you exploit a cooperative norm (the communication network).
  *   **The Surrender:** You must either admit Email-Ignoring is wrong (when you benefit from others' responsiveness) or admit that Line-Cutting is merely "rude" rather than "wrong" (because queues, like email, are technically conceivable without the norm). Since you are committed to Line-Cutting being *wrong*, you must tighten your view on Email.

  ### Summary of Commitments

  1.  **Principle:** **The Principle of Fair Cooperation** (for social acts) + **Duty to Rational Agency** (for self-regarding acts).
  2.  **Tipping:** **Wrong.** (You free-ride on the local norm even as a traveler).
  3.  **Talents:** **Wrong.** (But this requires the second "Duty to Self" limb; it is not covered by Fair Cooperation).
  4.  **Surrender:** **Leniency on Email.** (If you accept the fairness argument for lines, you must accept it for communication networks you utilize).
  5.  **Ad Hoc Clause:** The inclusion of **Neglected Talents**. This verdict does not fit the Fairness principle and requires a separate philosophical justification (Perfectionism/Kantian Duty to Self). If you demand a *single* principle without limbs, you must surrender the Talents verdict entirely.
