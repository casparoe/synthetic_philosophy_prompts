answer: |-
  Here is a disambiguation of the proverb "hindsight is 20/20" into five distinct philosophical readings. Each includes a verdict on its truth status and an analysis of which of your friend's three deployments (D1: Excuse Actors, D2: Discredit Historians, D3: Block Counterfactuals) it supports.

  Following the list, I have provided a synthesis addressing the specific tension you noted between D1 and D2, and the commitments required for D3.

  ### 1. The Psychological Reading (Hindsight Bias)
  *   **The Claim:** Human cognition is subject to a specific bias wherein, once an outcome is known, individuals retroactively believe the outcome was more predictable than it actually was. We rewrite our memory of our prior uncertainty to match current knowledge.
  *   **Verdict:** **Substantive and Defensible.** This is a robust finding in cognitive psychology (e.g., Fischhoff, 1975). It is not trivial; it makes a specific claim about human memory and confidence calibration.
  *   **Supports Friend's Deployment:**
      *   **D2 (Discredit Historians):** **Strong Support.** If historians are subject to this bias, their confidence in their explanations is inflated. They may feel the war was "inevitable" simply because it happened.
      *   **D1 (Excuse Actors):** **Weak/No Support.** This reading is about the *observer's* bias, not the *actor's* limitation. It does not inherently excuse the statesmen; it indicts the people judging them.
      *   **D3 (Block Counterfactuals):** **No Support.** Knowing we are biased doesn't mean counterfactuals are impossible, only that we must be careful constructing them.

  ### 2. The Epistemic Reading (Information Asymmetry)
  *   **The Claim:** There is a structural asymmetry between prediction and explanation. To predict an event, one needs sufficient antecedent conditions and laws; to explain an event that has already occurred, one can select from a vastly larger set of data (including the outcome itself) to construct a sufficient chain. Explanation is epistemically "cheaper" than prediction.
  *   **Verdict:** **Substantive and Defensible.** This aligns with philosophical debates on the symmetry thesis (Hempel vs. Scriven). It acknowledges that knowing the endpoint allows you to prune the causal tree in ways a predictor cannot.
  *   **Supports Friend's Deployment:**
      *   **D1 (Excuse Actors):** **Strong Support.** The statesmen lacked the "outcome data." They were predicting; we are explaining. They cannot be held to the standard of explanation.
      *   **D2 (Discredit Historians):** **Moderate Support.** It suggests historians' explanations are easier to generate than valid predictions, but it doesn't necessarily make them *false*, just easier to achieve.
      *   **D3 (Block Counterfactuals):** **No Support.** This reading admits the future was open (otherwise prediction would be easy). It implies counterfactuals are hard, not meaningless.

  ### 3. The Normative Reading (The Foreseeability Condition)
  *   **The Claim:** Moral or political responsibility is contingent upon foresight. An agent cannot be fairly blamed for failing to prevent an outcome that was not reasonably foreseeable at the time of action. "Ought implies can" extends to "Ought implies could have known."
  *   **Verdict:** **Substantive and Defensible.** This is a standard principle in ethics and legal theory (negligence vs. strict liability). It is not trivial because it rejects strict liability for historical actors.
  *   **Supports Friend's Deployment:**
      *   **D1 (Excuse Actors):** **Strong Support.** This is the direct philosophical grounding for D1. If the war wasn't foreseeable, the statesmen are not blameworthy.
      *   **D2 (Discredit Historians):** **No Support.** This concerns the ethics of the actors, not the methodology of the historians.
      *   **D3 (Block Counterfactuals):** **No Support.** Counterfactuals are often used precisely to test foreseeability.

  ### 4. The Methodological Reading (The Narrative Fallacy)
  *   **The Claim:** Humans have a compulsive tendency to impose coherent narrative structures on disjointed facts. When the endpoint is known, the historian inevitably selects causes that fit the story, creating an illusion of inevitability. A "good fit" story is not evidence of causal truth.
  *   **Verdict:** **Substantive and Defensible.** This is a core concern in historiography and philosophy of history (e.g., Gallie, White). It warns against confusing literary coherence with causal necessity.
  *   **Supports Friend's Deployment:**
      *   **D1 (Excuse Actors):** **Contradicts.** If the narrative of inevitability is a fallacy, then the outcome was *not* inevitable. This supports the idea that actors could have chosen differently, which complicates the excuse (though it still supports the idea that they didn't *know* the narrative).
      *   **D2 (Discredit Historians):** **Strong Support.** This is the strongest argument for D2. It claims the historian's product is structurally compromised by knowing the end.
      *   **D3 (Block Counterfactuals):** **Contradicts.** Counterfactual reasoning is the primary *cure* for the narrative fallacy. By asking "what if?", we break the illusion of inevitability. Using this reading to block counterfactuals is self-defeating.

  ### 5. The Metaphysical Reading (Fixity of the Actual)
  *   **The Claim:** The past is fixed and determinate, whereas the future was open and indeterminate. Therefore, vision "backward" is clear because the object is static, while vision "forward" was blurry because the object did not yet exist. In its strongest form, this implies that only the actualized path has ontological clarity.
  *   **Verdict:** **Substantive but False (or Highly Contested).** While the past is fixed in fact, it is not necessarily "clear" in cause. This reading often smuggles in determinism (the idea that what happened *had* to happen).
  *   **Supports Friend's Deployment:**
      *   **D1 (Excuse Actors):** **Moderate Support.** If the future was genuinely open/blurry, actors couldn't see clearly.
      *   **D2 (Discredit Historians):** **Weak Support.** It explains why historians see clearly, but doesn't explain why that's a *problem*.
      *   **D3 (Block Counterfactuals):** **Strong Support.** This is the only reading that legitimizes D3. If only the actualized path has "20/20" clarity, then unactualized paths are inherently unknowable fog.

  ***

  ### Synthesis: The Tension and The Commitments

  You suspected your friend's deployments might undermine each other. Your suspicion is correct, specifically regarding the tension between **D1 (Excuse Actors)** and **D2 (Discredit Historians)**, and the high cost of **D3 (Block Counterfactuals)**.

  #### 1. The Tension Between Excusing Actors and Discrediting Historians
  Can D1 and D2 both be true without tension? **Yes, but not under the same reading of the proverb.**

  *   **The Conflict:** D1 requires the **Epistemic** or **Normative** reading (the future was genuinely hard to see). D2 requires the **Methodological** or **Psychological** reading (the past looks deceptively clear).
  *   **The Contradiction:** If your friend uses the **Metaphysical Reading** for both, she contradicts herself. If the past is "20/20" because it was *inevitable* (Metaphysical), then the statesmen *should* have been able to foresee it (undermining D1), and the historians are *correct* to describe it as inevitable (undermining D2).
  *   **The Resolution:** To hold both D1 and D2 consistently, she must argue: *The future was ontologically open (supporting D1), but human psychology compulsively reconstructs the past as closed (supporting D2).*
  *   **The Trap:** If she uses the slogan to mean "It was obvious all along" to discredit the historians (D2), she cannot simultaneously use it to mean "It was impossible to see" to excuse the actors (D1). She must specify that **clarity is a property of the observer's position in time, not the event itself.** If she fails to make that distinction, she is treating the proverb as a single thesis when it is actually two opposite claims about the nature of time.

  #### 2. The Legitimacy of Blocking Counterfactuals (D3)
  Is there a reading under which invoking the proverb against counterfactuals is legitimate? **Only the Metaphysical Reading (Reading 5).**

  *   **The Commitment:** To use "hindsight is 20/20" to rule out counterfactuals (e.g., "British policy in 1912") as meaningless, your friend commits herself to **Actualism** or **Hard Determinism**.
  *   **What this means:** She is claiming that because the war *did* happen, any path where it *didn't* happen is not just unknown, but epistemically inaccessible or ontologically inferior. She is asserting that we can only have knowledge of what *is*, not what *could have been*.
  *   **The Cost:** This is a very expensive philosophical commitment. It renders most social science impossible, as policy analysis relies on comparing actual outcomes against counterfactual baselines. If she accepts D3, she must concede that we cannot learn lessons from history (since lessons require knowing what would have happened if we acted differently).
  *   **Better Alternative:** The **Methodological Reading (Reading 4)** actually argues the opposite: counterfactuals are *necessary* to correct the 20/20 vision bias. If she wants to be defensible, she should argue that counterfactuals are *difficult*, not *meaningless*.

  ### Summary for Your Argument
  Tell your friend that "hindsight is 20/20" is a chameleon phrase.
  1.  If she means **Psychological Bias**, she can attack historians (D2) but cannot excuse statesmen (D1).
  2.  If she means **Epistemic Asymmetry**, she can excuse statesmen (D1) but cannot claim historians are wrong, only that their task is different.
  3.  If she means **Metaphysical Fixity**, she can block counterfactuals (D3), but she undermines both the excuse for the statesmen (if it was fixed, they had no choice) and the critique of historians (if it was fixed, their narrative is true).

  She cannot have all three without changing the definition of the proverb mid-argument.
