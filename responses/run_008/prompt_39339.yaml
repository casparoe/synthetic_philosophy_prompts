          *   **Format:** Lead with bottom line in the first sentence. No preamble. Don't restate the question.

  2.  **Deconstruct Safe Pareto Improvements (SPI) in this Context:**
      *   SPI usually refers to transforming a game (negotiation/conflict) into a safer subgame where both parties expect higher utility than the default conflict outcome, without needing to know exact utilities.
      *   In mediation, this often looks like finding a correlated equilibrium or a randomized agreement that dominates the conflict outcome (the "fight").
