      *   The "coin flip" idea is essentially a lottery over outcomes. If $p \cdot U_A(Outcome1) + (1-p) \cdot U_A(Outcome2) > U_A(Conflict)$ and same for B, it's a Pareto improvement over conflict.
      *   Since valuations are private, the ombudsperson must elicit *relative* preferences or confidence levels without asking for numbers.

