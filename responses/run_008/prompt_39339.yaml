answer: |-
  You can operationalize Safe Pareto Improvements in 20 minutes by substituting private valuation elicitation with comparative conflict-cost questions, but the procedure collapses if the parties view the issue as non-lotterizable or if informal side-payments exceed the reputational cost of reneging.

  ### The 20-Minute SPI Protocol

  **Phase 1: The Legitimacy Gate (Minutes 0–5)**
  *Goal: Determine if randomization is normatively acceptable.*
  *   **Question:** "If we cannot agree, the status quo is [describe conflict cost: e.g., no hire, broken equipment, stalled project]. Is it acceptable to this group that this specific decision be resolved by chance rather than consensus?"
  *   **Sufficient Answer:** Both parties say "Yes" or "I can live with it."
  *   **Stop Condition:** If either party says "No, this must be decided on merit/principle," terminate SPI search. Proceed to interest-based negotiation. Randomizing principled disagreements destroys trust and creates latent conflict.

  **Phase 2: Threat Point Calibration (Minutes 5–10)**
  *Goal: Verify the conflict outcome is worse than losing the lottery without asking for numbers.*
  *   **Question:** "Imagine a coin flip decides this today. If you lose the flip, you get nothing. Is losing the flip better or worse than continuing the current fight for another six months?"
  *   **Sufficient Answer:** Both parties say "Losing the flip is better than the fight."
  *   **Stop Condition:** If either party says "I'd rather fight than lose," there is no SPI zone. The conflict costs are not high enough to justify risk acceptance.

  **Phase 3: Probability Search (Minutes 10–15)**
  *Goal: Find a weighted lottery both prefer to conflict.*
  *   **Question:** "We don't need a 50/50 split. What probability of winning would make you prefer the lottery to the fight? 40%? 30%?" (Ask separately).
  *   **Sufficient Answer:** Party A needs ≥30% chance; Party B needs ≥40% chance. (Since 30+40 < 100, a zone exists).
  *   **Stop Condition:** If Party A needs 60% and Party B needs 60%, no SPI exists. The parties' risk aversion or valuation gaps are too wide for a simple lottery.

  **Phase 4: Commitment Hardening (Minutes 15–20)**
  *Goal: Mitigate reneging without enforcement power.*
  *   **Action:** Draft a one-page Memorandum of Understanding (MOU) signed by both and copied to a neutral third party (e.g., Dean, Department Chair).
  *   **Question:** "If one of you tries to undo this later, what institutional cost can we trigger? Does the Dean need to sign off on the result?"
  *   **Sufficient Answer:** A mechanism is identified where unilateral reneging requires public admission of bad faith.

  ### Case Applications

  **Case 1: Labs Fighting Over Sequencer Time**
  *   **Legitimacy:** Pass. Time slots are resources, not principles. Randomization is standard in lab management.
  *   **Threat Point:** Pass. Continued fighting means machine idle time or degraded relationships, which hurts both labs' publication rates more than losing a slot.
  *   **Probability:** High likelihood of SPI. Lab A might accept 40% priority if it guarantees access; Lab B might accept 40% if it prevents total lockout.
  *   **Outcome:** Implement a rotation schedule (deterministic equivalent of a weighted lottery) codified in lab policy.
  *   **Verdict:** **SPI Viable.** The resource is fungible over time, and the conflict cost (idle machine) is objectively wasteful.

  **Case 2: Department Deadlocked on Hiring Subfield A vs. B**
  *   **Legitimacy:** Fail (High Risk). Faculty often view hiring as epistemic (what is *best* for science) rather than allocative (who gets a resource). A coin flip implies the decision doesn't matter, insulting both sides' expertise.
  *   **Threat Point:** Pass. No hire is worse than the "wrong" hire for most pragmatists, but ideologues may prefer no hire to a rival subfield.
  *   **Probability:** Low. Even if a lottery is accepted, the "winner" may sabotage the hire, or the "loser" may block resource allocation (lab space, grad students) post-hire.
  *   **Outcome:** The procedure reveals the fight isn't about resource allocation but strategic identity. An SPI here hides the conflict rather than resolving it, leading to passive aggression later.
  *   **Verdict:** **SPI Not Recommended.** Use the procedure to prove there is no SPI, then pivot to mediation on criteria for merit.

  ### Failure Mode: Side-Payments and Reneging

  The procedure cannot prevent private side-payments (e.g., Lab A promises Lab B grant collaboration if they veto the lottery), but it can raise the transaction cost of reneging.

  1.  **Transparency as Defense:** The MOU must be filed with an authority (Chair/Dean). If Party A tries to renege, they must explain to the authority why they are violating a signed agreement. This converts a private breach into a public reputational hit.
  2.  **The "Poison Pill" Clause:** Include a clause stating that if the agreement is violated, the resource reverts to a neutral default (e.g., the sequencer goes to external users, the hire line expires). This makes reneging costly for both parties, aligning incentives to enforce the deal on each other.
  3.  **Limitation:** If the side-payment exceeds the reputational cost (e.g., a massive grant opportunity), the SPI will unwind. The ombudsperson must explicitly warn parties: "This agreement relies on your reputational capital. If you plan to私下 deal around this, do not sign."

  **Value Judgment Note:** The procedure explicitly outs the normative question in Phase 1. If parties feel a decision *shouldn't* be left to chance, the ombudsperson must validate that intuition. Proceduralizing a value judgment away is itself a failure mode; sometimes the fight is necessary to establish a precedent.
