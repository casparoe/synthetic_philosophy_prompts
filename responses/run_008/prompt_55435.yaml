      *   "Finish with whether..." -> Explicit conclusion.

  6.  (Mental Note on Specific Theorists): Mentioning Trouillot (Silencing the Past) is almost mandatory here. Stoler (Along the Archival Grain) is relevant for colonial administration. Ketelaar is good for the "act of archiving."

  7.  (Final Polish): Ensure the distinction between the *Immigration Archive* (Hostile) and the *Welfare Archive* (Helpful) is clear. This is the key to the "theory strain" section.

