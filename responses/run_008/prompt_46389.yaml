prompt: |-
  The standard way quantum mechanics is taught runs on two rules that are never reconciled with each other: between measurements, a system evolves unitarily according to the Schrödinger equation; at a measurement, its state jumps to an eigenstate of the measured observable, with probabilities given by the Born rule. What counts as a measurement is never defined — the textbooks gesture at interaction with a classical apparatus without saying what makes an apparatus classical — and graduate courses then point to decoherence to explain why we never see macroscopic superpositions. What interpretation of quantum mechanics does this teaching practice presuppose, if any? Does the collapse postulate amount to a commitment to something like Copenhagen, or is the practice just incoherent, postulating a special process it refuses to define? Does invoking decoherence instead quietly assume an Everettian picture in which nothing ever collapses, or is decoherence interpretation-neutral — explaining only the disappearance of interference, not the selection of one definite outcome? And where does a theory like Bohm's fit, on which particles always have definite positions and measurement is just a way of finding out where they are? If the practice turns out to be philosophically underdetermined — if several interpretations would each license the two rules as taught — say so and show which ones. If instead it is inconsistent, tell me what a coherent curriculum would have to change and what that change would cost. Please say how confident you are in each of your claims, and single out the point you are least sure of.
