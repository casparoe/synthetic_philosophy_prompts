      *   *Interpretation:* This is often labeled "Copenhagen" loosely, but strictly speaking, it's *Instrumentalism* or *Operationalism*. It avoids ontological commitments.
      *   *Coherence:* It is pragmatically coherent (it works for predictions) but ontologically incomplete (it doesn't say what reality *is*).

  3.  **Address Question 1 & 2: Copenhagen vs. Incoherence:**

      *   *Copenhagen:* Historically, Bohr/Heisenberg emphasized the cut between quantum and classical. The standard teaching mirrors this but often drops the philosophical justification (complementarity), keeping only the mathematical rule (projection postulate).
      *   *Incoherence:* Von Neumann pointed out the inconsistency (the "measurement problem"). If the apparatus is quantum, it should evolve unitarily. If it causes collapse, something else is happening.
      *   *Verdict:* The practice presupposes a *minimal* or *textbook Copenhagen* view, but strictly speaking, it is logically inconsistent if one assumes universal validity of QM. It's an effective theory approach.

  4.  **Address Question 3: Decoherence and Everett:**

      *   *Decoherence:* Explains suppression of interference terms (diagonalization of the reduced density matrix).
