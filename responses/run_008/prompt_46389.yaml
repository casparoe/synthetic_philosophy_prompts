  ### 1. The Presupposition of Standard Pedagogy: "Textbook Copenhagen"

  The teaching practice you describe presupposes a stance best labeled **Instrumentalism** or **Minimal Quantum Mechanics**, often loosely bundled under the historical banner of the **Copenhagen Interpretation**. However, it is crucial to distinguish between the philosophical Copenhagen interpretation (Bohr, Heisenberg) and the "Textbook Copenhagen" used in pedagogy.

  *   **The Claim:** The standard curriculum presupposes that quantum mechanics is not a description of an observer-independent reality, but an algorithm for predicting the results of experiments performed by classical agents.
  *   **The "Cut":** By refusing to define "measurement" beyond "interaction with a classical apparatus," the pedagogy posits a **Heisenberg Cut**. It assumes a dualistic ontology: quantum systems (governed by Schrödinger) and classical apparatuses (governed by intuition/thermodynamics), without specifying where the boundary lies.
  *   **Coherence:** This practice is **operationally coherent** (it yields correct predictions) but **ontologically incomplete**. It is not strictly "incoherent" unless one demands that the theory describe the apparatus itself quantum mechanically. As long as the theory is viewed as a tool for users *outside* the system, the two rules (unitary evolution + collapse) do not contradict; they apply to different domains (system vs. measurement context).
  *   **Confidence:** **95%**. This is the consensus view among physicists and philosophers of physics regarding standard pedagogy (e.g., Griffiths, Shankar).

  ### 2. Decoherence: Neutral Mechanism or Everettian Trojan Horse?

  You ask if invoking decoherence assumes an Everettian (Many-Worlds) picture or is interpretation-neutral.

  *   **The Claim:** Decoherence is **interpretation-neutral regarding dynamics**, but **insufficient regarding outcomes**. It explains the *suppression of interference* (why the density matrix becomes diagonal), but it does not explain *unique outcomes* (why we see one result rather than a mixture of possibilities).
  *   **The Trap:** When textbooks use decoherence to explain the absence of macroscopic superpositions, they often implicitly rely on an **FAPP (For All Practical Purposes)** argument. They argue that because interference terms vanish exponentially fast, the system *behaves as if* it has collapsed.
  *   **Everettian Link:** To move from "interference is suppressed" to "there is no superposition," one must adopt an interpretation.
      *   **Everett:** Accepts the superposition remains but is branched; decoherence defines the branches.
      *   **Copenhagen/Instrumentalist:** Uses decoherence to justify *when* it is safe to apply the collapse postulate without calculating error terms.
      *   **Conclusion:** Invoking decoherence does not *force* an Everettian view, but it is often used to paper over the measurement problem in a way that is compatible with Everett but marketed as a solution for Copenhagen. It does not solve the "and-to-or" transition (the problem of outcomes) on its own.
  *   **Confidence:** **90%**. This is a technical fact of the formalism (decoherence yields improper mixtures, not proper mixtures), though pedagogical intent varies.

  ### 3. Where Bohmian Mechanics Fits

  *   **The Claim:** The standard two-rule curriculum is **ontologically incompatible** with Bohmian Mechanics (De Broglie–Bohm theory), even though they are **empirically equivalent**.
  *   **The Conflict:**
      *   **Standard Teaching:** The state vector is the complete description; collapse is a physical or epistemic update; particles do not have trajectories prior to measurement.
      *   **Bohm:** The state vector is a guiding field; particles *always* have definite positions; collapse is merely an update of our knowledge about the particle's position (effective collapse).
  *   **Curriculum Fit:** You cannot teach Bohmian mechanics using the standard postulates without lying. You would need to replace the Born Rule postulate with a derivation from the guidance equation and equilibrium hypothesis, and remove the collapse postulate entirely.
  *   **Confidence:** **98%**. The axioms of Bohmian mechanics explicitly contradict the axiom of wavefunction completeness taught in standard courses.

  ### 4. Underdetermination vs. Inconsistency

  Is the practice philosophically underdetermined or inconsistent?

  *   **The Claim:** The practice is **philosophically underdetermined** regarding ontology, but **logically inconsistent** if claimed to be a universal fundamental theory.
  *   **Underdetermination:** The mathematical algorithm (Prepare $\to$ Evolve $\to$ Measure) is compatible with multiple interpretations that agree on predictions:
      1.  **Instrumentalist Copenhagen:** The math is just a tool; don't ask about reality.
      2.  **QBism:** The state represents an agent's beliefs; collapse is belief updating.
      3.  **Everett (with care):** If "collapse" is taught as a subjective experience of branching rather than physical dynamics.
      4.  **Consistent Histories:** If measurements are treated as specific framework selections.
  *   **Inconsistency:** If the curriculum claims these rules describe *nature itself* universally (i.e., the apparatus is also made of atoms), the theory is inconsistent. You cannot have universal unitary evolution *and* non-unitary collapse.
  *   **Verdict:** The curriculum survives by remaining agnostic. It functions as an **Effective Field Theory of Measurement**: it works within a specific domain (microscopic system + macroscopic observer) without claiming to describe the boundary itself.
  *   **Confidence:** **85%**. While the underdetermination is clear, the extent to which textbook authors *claim* universality varies. Some explicitly warn students the theory is incomplete.

  ### 5. A Coherent Curriculum: Changes and Costs

  If we demanded a coherent curriculum that resolved the inconsistency, what would change?

  *   **Required Changes:**
      1.  **Explicitly Teach the Measurement Problem:** Acknowledge the tension between Rule 1 (Unitary) and Rule 2 (Collapse) in Week 1.
      2.  **Select an Ontology:** The course must either:
          *   **A:** Adopt **Everett**, teaching that collapse is illusory and explaining probability via decision theory or branch counting.
          *   **B:** Adopt **Objective Collapse (e.g., GRW)**, modifying the Schrödinger equation to include stochastic terms.
          *   **C:** Adopt **Bohm**, teaching particles and pilot waves.
          *   **D:** Adopt **Rigorous Instrumentalism**, explicitly stating QM does not describe reality, only correlations (QBism style).
      3.  **Redefine Measurement:** Define apparatuses physically (e.g., via decoherence thresholds) rather than gesturing at "classicality."
  *   **The Cost:**
      1.  **Cognitive Load:** Students must learn foundational philosophy alongside calculus. This distracts from learning to solve the Hydrogen atom or calculate scattering cross-sections.
      2.  **Controversy:** Faculty are divided. Choosing one interpretation alienates proponents of others.
      3.  **Time:** A rigorous treatment of decoherence and interpretations requires 3–5 weeks of a standard semester, displacing standard topics (perturbation theory, angular momentum).
      4.  **Professional Risk:** Students trained in Bohm or Everett may find themselves at a disadvantage in standard graduate qualifiers or research fields that assume standard formalism.
  *   **Confidence:** **80%**. The pedagogical costs are evident, but the exact time displacement is an estimate.

  ### Summary of Confidence and Uncertainty

  | Claim | Confidence Level | Justification |
  | :--- | :--- | :--- |
  | **Standard pedagogy is Instrumentalist/Textbook Copenhagen** | **95%** | Reflects the content of major texts (Griffiths, Sakurai) and standard lecture practices. |
  | **Decoherence does not solve the outcome problem alone** | **90%** | Mathematical fact: Decoherence yields improper mixtures, not unique outcomes. |
  | **Bohmian Mechanics is ontologically incompatible with standard postulates** | **98%** | Bohm denies wavefunction completeness and physical collapse, which are central to standard postulates. |
  | **Practice is underdetermined (compatible with multiple interpretations)** | **85%** | The algorithm works for Copenhagen, QBism, and Everett (with caveats), provided ontology is bracketed. |
  | **Curriculum reform would displace significant technical content** | **80%** | Based on standard semester credit hours and topic density. |

  **Point of Least Certainty:**
  I am least certain about the **claim regarding the cognitive cost and professional risk (80%)**.
  *Reasoning:* While it seems obvious that adding philosophy takes time, it is possible that teaching the *consistency* of the theory might actually reduce student confusion in the long run, potentially saving time spent unlearning misconceptions about "magic" collapse. Furthermore, the "professional risk" depends heavily on the specific subfield; quantum information theorists, for example, are increasingly open to foundational discussions, whereas condensed matter traditionalists may not be. The exact magnitude of the friction caused by a coherent curriculum is sociological and empirical, not derivable from the physics itself.

  ### Final Verdict

  The standard teaching practice is **philosophically underdetermined but ontologically evasive**. It is not strictly incoherent if viewed as an instrumentalist recipe, but it becomes inconsistent if presented as a complete description of reality. It does not commit to Copenhagen in the historical sense, but rather to a **pragmatic silence**. Invoking decoherence is technically neutral but often rhetorically used to mask the persistence of the measurement problem. A coherent curriculum is possible but requires choosing a specific interpretation, the cost of which is primarily sociological and pedagogical rather than mathematical.
