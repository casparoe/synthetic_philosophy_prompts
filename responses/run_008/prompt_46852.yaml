answer: |-
  Here is the breakdown of Maya's logic, your predictions, and the test to prove it.

  ### The Predictions

  Based on her track record, here is how Maya will likely rule on your new batch:

  **1. The Night Market Stall (Tour Group Line)**
  *   **Verdict:** **Not sensible.**
  *   **Why:** This is the clearest "No" of the bunch. In the street-food case she approved, the line formed because individuals smelled the food or saw others eating it. Here, the correlation between "crowd" and "quality" is broken by the tour guide. The people in line didn't choose the stall; the guide chose it for them. The signal is corrupted.

  **2. The Blender (Most Purchases)**
  *   **Verdict:** **Not sensible.**
  *   **Why:** You might think sales figures are better than reviews, but Maya rolled her eyes at reviews for a reason. Online purchase data is often driven by algorithms, sponsored placements, or temporary price drops, not long-term satisfaction. It suffers from the same problem as the crypto case: it measures *momentum*, not *merit*. Unless she can see people actually using them (like the cars on the road), digital sales numbers look like noise to her.

  **3. The Box Office Movie**
  *   **Verdict:** **Not sensible** (though she might hesitate, like with the bar).
  *   **Why:** This is the trickiest one. A full theater is physical, like the street food. But "topping the box office" is usually a function of marketing spend and opening weekend hype, not necessarily how good the film is. Unlike the rooftop bar—where the crowd *is* the product (atmosphere)—the crowd at a movie doesn't make the story better. If she treats this like the crypto case (momentum chasing), she'll pass. If she treats it like the bar (social experience), she'll go. Given she rejected the blender reviews, I bet she distrusts aggregate digital stats about quality. She'll say skip it and ask a friend instead.

  ***

  ### The Rule Maya Is Actually Running

  Your hypothesis was: *Follow the crowd when choices were costly and made independently.*

  That is close, but the **"costly"** part doesn't hold up. Maya approved of the street food (a $5 lunch) and the conference session (free/low cost). She rejected crypto (high financial cost). So cost isn't the filter.

  Maya is running what I'd call **The Causal Quality Test.**

  She follows the crowd only when she believes the crowd's behavior is **caused by the intrinsic quality of the thing**, not by external momentum, marketing, or coercion.
  *   **Street Food/Car/Conference:** People choose these because they taste good, run well, or teach something. The quality causes the crowd.
  *   **Crypto/Reviews/Box Office:** People choose these because *other people chose them* (or because ads told them to). The crowd causes the crowd.

  **Where your hypothesis fits:** You were right about **independence**. Maya hates "crowd watching itself" (crypto). She wants independent agents signaling private information.
  **Where your hypothesis breaks:** You thought **cost** mattered. It doesn't. She cares about *incentive alignment*. A street food eater wants a good lunch. A crypto trader often wants a quick flip.

  ***

  ### The Verdict That Refuses to Fit

  There is one case in her history that wobbles her own rule: **The Rooftop Bar.**

  She hesitated longer on this than any other, and she should have. A trendy bar is the definition of "crowd watching itself." People go there *because* it's popular. The "intrinsic quality" of the drinks is often secondary to the social proof.
  *   If her rule is strictly "Intrinsic Quality," she should have said **Not sensible**.
  *   If her rule is "Physical Observation," it fits perfectly.

  This is the crack in the armor. It suggests her rule might actually be: **"Follow the crowd when you can physically witness the choice, unless you know the crowd was manipulated."** The bar was physical and unmanipulated (organic hype), so she let it slide. But it's the weakest link in her logic.

  ***

  ### The Discriminating Test Case

  To settle whether Maya is running the **"Causal Quality"** rule (my guess) or the **"Physical Presence"** rule (an alternative that fits her history almost as well), you need a case that is **Physical** but **Low Quality Signal**.

  **The Case:**
  > You're at an airport. There are two security lines. Line A is packed. Line B is moving fast but empty. You find out Line A is the "Priority Lane" for first-class passengers who paid extra, while Line B is for everyone else. Do you try to get into Line A?

  **Why this splits them:**
  *   **If she follows "Physical Presence":** She should say **Sensible**. There is a physical crowd. People are choosing it. (Just like the street food).
  *   **If she follows "Causal Quality":** She should say **Not sensible**. The crowd isn't there because the line is *better*; they are there because they *paid* to be there. The choice doesn't signal private information about speed or efficiency; it signals wealth.

  **My bet:** Maya will say **Not sensible**. She cares about *why* the crowd is there, not just *that* they are there. If she says that, her rule is definitely about information quality, not just herd size.
