          *   *Wait, PSC requires monophyly/diagnosability.* If there is significant gene flow (BSC=1), can PSC justify 3 species? Yes, if the gene flow is low enough that lineages retain unique autapomorphies (fixed characters), even if some introgression occurs. Or, more accurately, PSC advocates often treat distinct populations with fixed differences as species even if some hybridization occurs (the "gene flow is noise" argument).
          *   *Refining the Phenetic count:* Why would Phenetic say 2? Maybe A and B look similar, C looks different? But PSC says 3. So A, B, C all have unique genetic markers. But morphologically A~B != C.
          *   *Let's try to match the prompt's specific suggestion:* BSC=1, PSC=3, Phenetic=2.
