      *   **Biological Species Concept (BSC):** Focuses on *reproductive isolation* and *gene flow*. If they interbreed and produce fertile offspring in nature, they are one species.
      *   **Phylogenetic Species Concept (PSC):** Focuses on *monophyly* and *diagnosability* (fixed derived characters). If a population has a unique combination of traits marking a distinct lineage, it's a species. Often leads to "splitting."
      *   **Phenetic Concept:** Focuses on *overall similarity* (morphological, ecological, behavioral). Clustering based on observable traits. Often ignores underlying genetics or potential gene flow.

