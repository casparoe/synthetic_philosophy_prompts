          *   *Analysis:* This appeals to meta-cognition and plasticity. It distinguishes between *fixed action patterns* (FAPs) and *goal-directed behavior with feedback*.
          *   *Verdict:* Strong point on architectural difference, but vulnerable to Marcus's next move (is "noticing" just another trigger?).

