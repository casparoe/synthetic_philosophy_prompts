      *   *Is the Wife right?* Partially. The *meaning* of "quarter" is social. The machine doesn't know economics. However, dismissing the machine's agency entirely ignores that it *does* act autonomously within its constraints.
      *   *Is the Son right?* Closest to the mechanical truth. The machine discriminates based on physical properties ($P_1, P_2, P_3$). "Quarter" is a human label mapped onto those properties. If the foreign coin matches $P$, the machine succeeds, not fails.

