          *   *Decision:* I will adjudicate each round, noting where each is technically correct vs. practically insightful. I will conclude that Bella understands the *theorem* better, but Anton understands the *politics* better. However, since the prompt asks about what the theorem *shows about real elections*, Anton's practical constraints are highly relevant. But Anton's nihilism ("pointless") is wrong. Bella's optimism ("escape routes") is technically true but practically limited.
