  8.  **Final Polish:** Check the flow. Ensure the "Impossibility Conjecture" is prominent. Make sure the distinction between "semantic indecision" (Caffeine) and "conceptual competence" (Tomato) is clear. Ensure the Water case emphasizes the *a posteriori* nature.

