          *   Constraints to honor (Neutrality regarding first-order metaphysics).
          *   Classification of requirements (Non-negotiable vs. Camp-specific prejudices).
          *   Identification of tension/unsatisfiability (Specifically regarding the "non-metaphysician referee" vs. "quantifier variance neutrality").
          *   Closing Scorecard: Brief evaluation of Chalmers, Thomasson, and Sider against the *criteria* (not a deep dive, just a scorecard).
      *   **Tone:** Academic, precise, philosophical, slightly provocative (acknowledging the difficulty/impossibility).
      *   **Constraint:** Close with *only* a brief scorecard. The focus must be on the criteria.

  2.  **Deconstruct the Desiderata:**

      *   *Case 1: Caffeine/Doping (Rulebook Silent).* This is a normative/semantic gap. It's verbal in the sense that it depends on definition, but substantive in terms of policy. A good criterion needs to distinguish "semantic indecision" from "factual disagreement."
      *   *Case 2: Tomato/Fruit.* Classic botanical vs. culinary. Clearly verbal in one context, substantive in another. The criterion must handle context-sensitivity.
      *   *Case 3: Water/H2O (Pre-Chemistry).* This is the Kripke/Putnam intuition. It *wasn't* verbal; it was an empirical discovery. A criterion that calls this verbal fails. This tests the "a priori vs. a posteriori" distinction.
      *   *Case 4: Mereological Sums.* The core metaontological dispute. The criterion must not rule this verbal *by fiat* (that would violate neutrality). It must leave it open whether this is verbal or substantive.

      *   *Distinction 1: Verbal vs. Verbal-looking/Substantive.* (e.g., Lewis vs. Van Inwagen on composition). Some look verbal but track deep modal differences.
      *   *Distinction 2: Stipulation vs. Discovery.* Resolving "Is a tomato a fruit?" by looking at a botany book (discovery of usage/nature) vs. deciding "Let's call this a fruit" (stipulation).
      *   *Distinction 3: Inter-party vs. Intra-party.* Two people disagreeing vs. one person confused about their own language.

      *   *Constraint: Neutrality.* The "Metaontological Free Lunch." You can't use the criterion to prove universalism or nihilism before the argument starts.
      *   *Constraint: Applicability.* Can a referee apply it without doing metaphysics?

      *   *The Tension:* The prompt explicitly suspects a conflict between "easy application (no metaontology)" and "neutrality on quantifier variance." I need to articulate this clearly.

  3.  **Drafting the Desiderata (Iterative Process):**

      *   *Requirement 1: The Empirical Immunity Clause.* (Addresses Water/H2O). A verbal dispute must be resolvable (in principle) without empirical investigation of the world, only of language/concepts. *Status: Non-negotiable.*
      *   *Requirement 2: The Paraphrase Test.* (Addresses Caffeine/Tomato). Parties must be able to state their position in a neutral idiom where they agree. *Status: Non-negotiable.*
      *   *Requirement 3: The Neutrality Constraint.* (Addresses Mereology). The criterion cannot presuppose a specific ontology (e.g., that quantifiers *must* vary or *must* be fixed). *Status: Non-negotiable.*
      *   *Requirement 4: The Practicality Condition.* (Addresses the "Referee" worry). It should be decidable without settling the metaphysical dispute itself. *Status: Camp-specific (Deflationists want this easy; Inflators suspect it's impossible).*
      *   *Requirement 5: The Depth Distinction.* (Addresses Verbal-looking/Substantive). Must distinguish shallow semantic disagreement from deep conceptual/modal divergence. *Status: Non-negotiable.*

  4.  **Developing the Tension/Impossibility Proof:**
      *   The prompt hints that a criterion applicable without metaontology and one neutral on quantifier variance are incompatible.
      *   *Why?* To check if a dispute is verbal (e.g., about existence), you often need to know if the quantifiers *can* vary. If you assume they can't (Sider), the dispute is substantive. If you assume they can (Hirsch), it might be verbal. To apply the criterion *neutrally*, you need a "view from nowhere" on language that doesn't presuppose the semantic facts in dispute. But accessing those semantic facts *is* doing metaontology.
      *   So, the "Referee Condition" (easy application) clashes with the "Neutrality Condition" (not taking sides on semantics).

  5.  **Drafting the Scorecard:**
      *   *Chalmers (Elimination):* Good on Paraphrase, struggles with Neutrality (assumes scrutability).
      *   *Thomasson (Easy Ontology):* Good on Practicality, fails Neutrality (presupposes application conditions are easy).
      *   *Sider (Joint-Carving):* Good on Depth, fails Neutrality (presupposes structure exists).

  6.  **Refining the Tone:**
