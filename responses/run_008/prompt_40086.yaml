  1.  **Analyze the Request:**
      *   **Task:** Write a set of desiderata (requirements/criteria) for identifying "merely verbal disputes."
      *   **Context:** A metaontology seminar stalling on quantifier variance. The goal is to define the *criterion* before applying it to specific theories.
      *   **Required Content:**
