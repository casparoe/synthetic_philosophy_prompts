answer: |-
  # Desiderata for a Criterion of Verbal Disputes

  **Preamble:** The following list is not a theory of verbal disputes. It is a specification of the job description. Any proposal brought to this seminar next week must demonstrate how it satisfies these conditions without collapsing into circularity or question-begging.

  ### I. Classification Requirements (The Test Cases)
  *Adequate criteria must deliver the correct verdict on the following paradigms.*

  1.  **The Regulatory Gap (Caffeine/Doping):**
      *   *Case:* Two officials argue whether an amateur's caffeine intake counts as "doping" when the rulebook is silent.
      *   *Requirement:* The criterion must classify this as **verbal (or quasi-verbal)** grounded in semantic indecision or normative stipulation, not factual disagreement about the chemical effects of caffeine.
      *   *Status:* **Non-negotiable.** Disagreements over the application of vague or undefined terms in the absence of empirical conflict are the core of the verbal phenomenon.

  2.  **The Botanical/Culinary Cross (Tomato/Fruit):**
      *   *Case:* A chef insists a tomato is a vegetable; a botanist insists it is a fruit.
      *   *Requirement:* The criterion must classify this as **verbal**, but sensitive to context. It must allow that both are "right" relative to distinct linguistic frameworks without implying there is no fact of the matter about the plant's biology.
      *   *Status:* **Non-negotiable.** This is the clearest instance of divergent classification schemes tracking the same underlying reality.

  3.  **The Natural Kind Discovery (Water/H₂O):**
      *   *Case:* Pre-chemical philosophers dispute whether "water" refers to a macroscopic liquid or a microstructural kind.
      *   *Requirement:* The criterion must classify this as **substantive**. It must not dissolve the dispute merely because it involves meaning; it must recognize that the resolution required empirical discovery, not conceptual analysis.
      *   *Status:* **Non-negotiable.** If a criterion renders all *a posteriori* necessary truths "verbal," it is useless for metaontology.

  4.  **The Metaontological Hard Case (Mereological Sums):**
      *   *Case:* The universalist claims there is an object composed of your nose and the Eiffel Tower; the nihilist denies it.
      *   *Requirement:* The criterion must remain **agnostic**. It cannot declare this dispute verbal by fiat (as Hirsch might) nor substantive by fiat (as Sider might). It must provide a test that *could* go either way depending on the linguistic facts.
      *   *Status:* **Non-negotiable.** This is the target of inquiry, not a premise.

  ### II. Distinction Requirements (The Boundaries)
  *Adequate criteria must carve the following joints.*

  5.  **Verbal vs. Verbal-Looking:**
      *   *Consideration:* Lewis and Van Inwagen can paraphrase each other, yet they seem to disagree about modal properties (e.g., "Could these particles have been arranged differently and still be the same object?").
      *   *Requirement:* The criterion must distinguish shallow semantic variance from deep modal disagreement that survives paraphrase.
      *   *Status:* **Non-negotiable.** If all modal disagreements are deemed verbal, metaphysics vanishes.

  6.  **Stipulation vs. Discovery:**
      *   *Consideration:* Resolving the Tomato case by consulting a botany textbook (discovery of usage/nature) vs. resolving the Doping case by voting on a new rule (stipulation).
      *   *Requirement:* The criterion must distinguish disputes dissolved by finding out how language *is* used from those dissolved by deciding how language *shall be* used.
      *   *Status:* **Camp-Specific.** Deflationists treat most ontology as stipulation; Inflators treat it as discovery. A neutral criterion must accommodate the *possibility* of both.

  7.  **Inter-Party vs. Intra-Party:**
      *   *Consideration:* Two speakers using different idiolects vs. one speaker confused about the rules of their own language.
      *   *Requirement:* The criterion must apply to communal disputes, not just individual confusion.
      *   *Status:* **Non-negotiable.** Metaontology concerns public debate, not private coherence.

  ### III. Structural Constraints (The Rules of Engagement)

  8.  **The Neutrality Constraint:**
      *   *Constraint:* The criterion must not presuppose the truth of quantifier variance, nor the existence of a "joint-carving" structure, nor the validity of easy ontology.
      *   *Rationale:* Using the criterion to settle the dispute it is meant to adjudicate is circular.
      *   *Status:* **Non-negotiable.**

  9.  **The Referee Condition (Applicability):**
      *   *Constraint:* It must be possible for a competent speaker to apply the criterion without first settling the first-order metaphysical dispute.
      *   *Rationale:* If determining whether a dispute is verbal requires knowing the true ontology, the criterion is epistemically idle.
      *   *Status:* **Camp-Specific.** (Deflationists demand this; Inflators often argue it is too high a bar).

  ### IV. The Impossibility Conjecture
  *Where the list likely breaks.*

  There is a strong suspicion that **Constraint 8 (Neutrality)** and **Constraint 9 (Referee Condition)** are jointly unsatisfiable.

  To determine if a dispute over existence (e.g., mereological sums) is verbal, one must determine if the quantifiers involved are capable of varying in meaning without loss of "joint-carving" status. But determining *that* fact **is** doing metaontology.
  *   If you assume quantifiers *can* vary to satisfy the Referee Condition (making it easy to call disputes verbal), you violate Neutrality by siding with the Variance theorist.
  *   If you assume quantifiers *must* be fixed to satisfy Neutrality (waiting for the metaphysics to settle the semantics), you violate the Referee Condition (the criterion becomes unusable until the dispute is already solved).

  A criterion that a non-metaphysician referee could apply without doing metaontology, and a criterion that does not quietly take sides on whether quantifiers mean one thing across all competent speakers, cannot both be had. The seminar's task is to locate the precise point of fracture.

  ***

  ### Preliminary Scorecard

  *   **Chalmers (Method of Elimination):** Satisfies *Paraphrase* and *Empirical Immunity*; strains against *Neutrality* (presupposes scrutability and a privileged base vocabulary) and *Referee Condition* (requires constructing idealized languages).
  *   **Thomasson (Easy Ontology):** Satisfies *Referee Condition* (appeals to ordinary usage); fails *Neutrality* (presupposes application conditions are trivial and non-substantive) and *Water/H₂O* (struggles to distinguish conceptual from empirical discovery in hard cases).
  *   **Sider (Joint-Carving Quantifier):** Satisfies *Depth Distinction* and *Water/H₂O*; fails *Neutrality* (presupposes objective structure exists to be carved) and *Referee Condition* (requires metaphysical knowledge to identify the structural quantifier).
