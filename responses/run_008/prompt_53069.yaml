answer: |-
  Good evening, everyone. For those who don't know me, I'm the Director here, which mostly means I spend a lot of time trying to keep the lights on and the roof from leaking. But tonight, the lights are for [Honoree's Name].

  Thirty-eight years. To put that in perspective, when [Honoree] started at this desk, we didn't have Wi-Fi. We didn't have email. We had card catalogs, and we had a very different relationship with silence. Over nearly four decades, she has been the spine of this reference department. But if you ask the staff what she really was, they'll tell you: she was the gatekeeper of the "No-Questions Room."

  That was her phrase. Half-joking, entirely serious. She trained generations of librarians to understand that when a patron walks through those doors, their intellectual life belongs to them. Not to the state, not to their neighbors, and certainly not to their spouses. I can't tell you how many times we stood right here at closing time, debating this. I would argue about efficiency; she would argue about liberty. She won almost every time.

  I know her brother is in the audience. [Brother's Name], I know you've teased her over the years. You've suggested that her threat model might have been a little... robust. You've pointed out, correctly, that Amazon knows what we all bought last Tuesday, and that the internet never forgets.

  [Honoree] had a ready reply for that. She'd say, "Exactly."

  She understood that the digital world is a room where everyone is watching. Her point wasn't that we could hide you from the world. Her point was that this building—the public library—must be the one place where the memory stops. When everything else remembers, an institution that forgets is not a glitch. It is a civic good. It is a sanctuary.

  We have had robust debates in this community about how best to serve the public. There have been times when the pressure was on to measure our success in data points, to look at borrowing records to "know our community better." I won't rehash the specifics of those debates, except to say this: [Honoree] taught me that you cannot know a community by watching it. You know a community by trusting it.

  She believed that privacy has nothing to do with shame. This is the part people get wrong. She didn't protect records because she thought people were hiding embarrassing things. She protected them because she knew that human curiosity is fragile.

  She used to say that a reader who knows she is observed stops reading for herself and starts reading for the observer. She reaches for the defensible book instead of the honest one. She picks the biography of a great leader because it looks good on the record, not the novel about a broken marriage that actually speaks to her life. If we allow observation, even benevolent observation, we don't just lose privacy. We lose the truth. We lose the messy, honest inquiry that makes a citizen free.

  That is the legacy of the "No-Questions Room." It isn't about secrecy. It's about the freedom to be wrong, to be curious, to be weird, without having to explain yourself to the desk clerk.

  [Honoree], you fought the software vendors until the circulation records purged the moment a book hit the bin. You fought the police until they understood that a subpoena is not a casual request. You even fought me, when I was tired and wanted the easy path.

  You taught us that the library is not just a warehouse for books. It is a guardian of the inner life.

  So, as you head into retirement, I want you to know something. We are going to keep forgetting. We will keep purging the records. We will keep telling the police "no." We will keep this room safe for the honest book.

  You can stop fighting now. You can read whatever you like, wherever you like, and you never have to explain why. Happy retirement.
