      *   *Correction:* The "Thin Coherence" term needs to be defended as a useful category, not just a wastebasket.

  7.  **Final Polish:** Check the "Two-Minute" constraint. Keep paragraphs tight. Add the "Temptation to Overclaim" warnings.

