answer: |-
  # Q&A Prep Sheet: "The Limits of Coherence"
  **Workshop Context:** Formal Epistemology + Decision Science (Savage/VNM loyalists) + Moral Philosophy Skeptics.
  **Goal:** Defend the claim that coherence arguments (Dutch Book/Money Pump) do not entail Expected Utility (EU) maximization, only "Thin Coherence" (Transitivity/Weak Ordering).

  ---

  ### 1. The "Representation Theorem" Objection (The Nuclear Option)
  **Who:** The Decision Scientists / Savage Loyalists.
  **The Objection:** "You're attacking the *pedagogy* (money pumps), not the *math*. Savage's representation theorem shows that if an agent's preferences satisfy certain axioms (including independence), they *are* maximizing EU. The money pump is just an intuition pump for the axioms. If you grant the axioms, you get EU. If you deny the axioms, you aren't attacking coherence arguments, you're just stipulating non-EU preferences. The theorem does the work, not the bookie."
  **Damage Level:** **Critical.** This bypasses your critique of the *arguments* by pointing to the *results* that the community treats as foundational.
  **Two-Minute Reply:**
  "I grant the math: if you assume the Savage axioms, you get an EU representation. But my thesis is about *normative justification*, not mathematical representation. The representation theorem tells us that consistent preferences *look like* EU maximization; it doesn't tell us *why* we should have those preferences in the first place.
  The coherence arguments are supposed to provide that 'why'—they claim that violating EU makes you *irrational* (exploitable). I'm arguing that the exploitability story fails without substantive assumptions about sequential choice and trade refusal (as Gustafsson admits). If the only reason to accept the Independence Axiom is 'otherwise you get pumped,' and the pump requires controversial diachronic assumptions, then the theorem rests on normative sand. I'm not denying the theorem; I'm denying that coherence arguments provide the normative force to compel the axioms."
  **Soft Spot:** You are conceding the math to fight the philosophy. If they press that "rationality *just is* satisfying the axioms," you have no comeback other than bare assertion.
  **Temptation to Overclaim:** Do not say the theorem is wrong. Say it lacks *normative bite* without the coherence story.

  ### 2. The "Thin Coherence is Unstable" Objection
  **Who:** Formal Epistemologists.
  **The Objection:** "You say what survives is just transitivity and weak ordering ('Thin Coherence'). But without probabilism, transitivity is fragile. If I don't have additive probabilities, I can construct preference cycles that look transitive locally but fail globally. 'Thin Coherence' isn't a stopping point; it's just the absence of a theory. If you don't have full coherence, you don't have a decision theory at all."
  **Damage Level:** **High.** Makes your positive thesis look empty or incoherent.
  **Two-Minute Reply:**
  "That's a fair worry, but I think it conflates *structure* with *content*. Thin Coherence is a constraint on the *structure* of agency, not a guide to *content*. It says: 'If you prefer A to B and B to C, don't prefer C to A.' That rules out blatant self-sabotage without forcing you to adopt specific risk attitudes (like Independence).
  It's stable in the sense that it's the common denominator across EU, Risk-Weighted EU (Buchak), and even some non-probabilistic models. I'm not offering Thin Coherence as a *complete* decision theory. I'm offering it as the *limit* of what coherence arguments can prove. What fills the rest of the gap must come from substantive normative ethics or pragmatic considerations, not from the threat of a bookie."
  **Soft Spot:** You are admitting your thesis is largely negative ("coherence doesn't get you X"). You need to sound like this is a feature (clearing the deck), not a bug.
  **Temptation to Overclaim:** Don't imply Thin Coherence is sufficient for rationality. It's necessary, but not sufficient.

  ### 3. The "Gustafsson/Buchak" Objection (The Scholarship Check)
  **Who:** The Well-Read Economist or Epistemologist.
  **The Objection:** "You mention Gustafsson and Buchak, but are you giving them enough credit? Gustafsson argues that 'resolute choice' blocks the pump but at the cost of dynamic inconsistency. Buchak argues she preserves coherence while modifying EU. Doesn't this show the coherence program is adaptable, not broken?"
  **Damage Level:** **Medium-High.** Suggests you are fighting a strawman of the current literature.
  **Two-Minute Reply:**
  "Absolutely, and I appreciate their rigor. But notice what they have to do to save the program. Gustafsson has to introduce 'resolute choice,' which is a substantive psychological commitment, not a logical requirement of coherence. Buchak has to redefine the utility function to include risk weights.
  My point is precisely that the *standard* coherence arguments (the ones cited in intro texts and used to dismiss skeptics) don't do the work on their own. They need these extra, substantive additives. If saving EU requires adding a theory of resolution or risk-weights, then 'coherence' alone isn't doing the heavy lifting. The coherence argument is the hook, but the substantive theory is the line."
  **Soft Spot:** You need to be careful not to misrepresent Buchak. She claims her view *is* coherent. You must argue it's not coherent *in the standard VNM/Savage sense*.
  **Temptation to Overclaim:** Don't say Buchak is "incoherent." Say she violates the *standard* Independence axiom which coherence arguments are supposed to secure.

  ### 4. The "Normative Bite" Objection (The Advisor's Fear)
  **Who:** The Moral Philosophers (and your Advisor).
  **The Objection:** "Okay, suppose you're right. Coherence arguments don't get us to EU. They only get us to transitivity. So what? If 'Thin Coherence' permits basically every non-transitive-reforming theory on the table, what have we learned? You've undermined the dominant justification for EU without replacing it. Isn't this just skepticism in disguise?"
  **Damage Level:** **Medium (Philosophically), High (Politically).** This questions the *point* of your talk.
  **Two-Minute Reply:**
  "I think this is the most important question. My goal isn't skepticism; it's precision. Currently, coherence arguments are used as conversation-stoppers: 'You can't reject EU, it's incoherent.' I want to turn that into a conversation-starter: 'Okay, EU isn't forced by coherence. So what *positive* reasons do we have for it?'
  If we strip away the exploitability rhetoric, we might find we prefer EU for reasons of fairness, or aggregative welfare, or simplicity. But we shouldn't hide those substantive reasons behind a technical claim about bookies. Thin Coherence tells us where the logic ends and the ethics begins. That's a gain in clarity, even if it's a loss in deductive power."
  **Soft Spot:** This is the hardest reply to pull off without sounding like you're giving up. You must sound like you are *liberating* the field, not destroying it.
  **Temptation to Overclaim:** Do not promise you have a better theory ready. Admit this is a meta-ethical point about justification.

  ### 5. The "Diachronic Dutch Book" Objection
  **Who:** Formal Epistemologists.
  **The Objection:** "You focus on synchronic coherence and money pumps. But what about diachronic Dutch Books for Conditionalization? Those seem much tighter. If you grant those, don't you get probabilism at least, which pushes you closer to EU?"
  **Damage Level:** **Low-Medium.** True, but tangential to your main point about Utility.
  **Two-Minute Reply:**
  "I'm willing to concede more ground on the credence side than the utility side. Diachronic Dutch Books for conditionalization are stronger than synchronic ones. However, even there, you need assumptions about how learning occurs and that the agent can't foresee the betting setup.
  But my primary target is the *Utility* side of the EU equation. Even if I grant you full probabilism for credences, the Money Pump arguments for the Independence Axiom (utility) still rely on those controversial sequential choice assumptions. So even with a solid probabilistic agent, the step to *Expected Utility* maximization remains unsupported by coherence alone."
  **Soft Spot:** **Concede this upfront.** Do not fight a war on two fronts. If you can save the Utility critique, let them have the Probabilism victory. It makes you look reasonable.

  ---

  ### The Question You're Secretly Hoping Nobody Asks
  **The Question:** "If coherence arguments don't ground EU, and Thin Coherence is too weak to guide action, **what method should a rational agent actually use to make decisions?** Are you suggesting we just guess?"
  **Why it's dangerous:** Your advisor is right. This is the worst one. It exposes the gap between your critique and a constructive alternative. If you say "I don't know," you look like a skeptic. If you say "Use EU anyway," you undermine your thesis.
  **Prepared Reply:** "I'm not suggesting we guess. I'm suggesting we recognize that using EU is a *substantive normative choice*, not a logical requirement. We might choose EU because it handles social welfare well, or because it's computationally tractable. But we should own that choice as a value judgment, not hide it behind a theorem. The 'method' is to deliberate on values, not just check for consistency."
  **Note:** This is risky. It pivots to meta-ethics. Practice this transition so it sounds confident, not evasive.

  ---

  ### Strategic Concessions (Say these *during* the talk if possible)
  1.  **Diachronic DB:** Explicitly state: "I am focusing on the Utility/Preference side. I am less skeptical about probabilism for credences, though even there, assumptions lurk." (Disarms the Epistemologists).
  2.  **Gustafsson:** "Gustafsson has shown the Money Pump can be saved, but only by adding substantive assumptions about choice architecture." (Disarms the well-read Economist).
  3.  **Normative Goal:** "I am not trying to destroy Decision Theory. I am trying to locate where the Math ends and the Ethics begins." (Disarms the Moral Philosophers).

  ### Final Advice
  *   **Watch the Economists:** If they start talking about "revealed preference," stop them. Remind them that revealed preference is descriptive, and you are talking about *normative* coherence.
  *   **Don't get bogged down in Axioms:** If they ask about Specific Axiom X (e.g., Continuity), pivot back to the *argument structure*. "Whether Continuity holds is less important than whether the Money Pump *proves* it holds."
  *   **Own the "Thin" Label:** Don't let them treat "Thin Coherence" as an insult. Treat it as a precise categorization of the logical remainder.
