answer: |-
  **MEMORANDUM**

  **TO:** Charter Review Commission
  **FROM:** [Your Name], Commissioner
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation on Voter Eligibility Amendment (Noncitizen Residents)

  **1. Executive Summary and Recommendation**

  After reviewing public testimony, legal precedents, and the philosophical arguments presented during our hearings, I am circulating this recommendation to establish a clear position before our next deliberation.

  **Recommendation:** I propose the Commission **endorse the amendment** to allow Legal Permanent Residents and qualifying long-term visa holders to vote in all municipal elections (Mayor, City Council, School Board, and local initiatives), **subject to a minimum continuous residency requirement of one year.**

  This is not a "menu of options." It is a specific position that seeks to reconcile the moral claim of representation with the practical need for community stability. Below, I outline why this position prevails over the status quo, why it addresses the "commitment" concern without resorting to citizenship, and why the argument for "arbitrariness" should not lead to paralysis.

  **2. The Argument for Representation (Addressing Faction 1)**

  The strongest moral argument for this amendment rests on the principle of affected interests. Municipal government differs fundamentally from state or federal government. While Congress debates war and treaties, City Hall debates zoning, policing, trash collection, and school funding.

  In our city, approximately [Insert % if known, otherwise "a significant portion"] of our residents are noncitizens who are nonetheless fully subject to the coercive and distributive powers of the city. They pay property taxes (directly or via rent), they are subject to local police enforcement, and their children attend our schools. To exclude them from the ballot creates a class of permanent subjects within a democratic municipality.

  If the purpose of a municipal election is to select agents who manage local public goods, then the relevant qualification should be stakeholding in those goods, not national sovereignty. The status quo treats voting as a reward for national status; this amendment treats voting as a tool for local governance. For municipal purposes, the "governed" should choose the "governors."

  **3. The Argument for Commitment (Addressing Faction 2)**

  The second faction argues that citizenship marks a unique commitment to the political community, and that removing this line reduces voting to a transactional "customer relationship." This is a serious concern. If voting requires no stake in the future of the community, it risks becoming a mechanism for short-term extraction rather than long-term stewardship.

  However, citizenship is a blunt instrument for measuring *local* commitment. A U.S. citizen may move to our city tomorrow and vote the next day, with no intention of staying. Conversely, a Legal Permanent Resident may have lived here for 20 years, raised children here, and built a business here, yet remain voiceless.

  Citizenship measures commitment to the *nation*, not the *city*. To address the valid concern about transient voters without relying on nationality, we should look to **duration of residence**. By adding a one-year continuous residency requirement for noncitizen applicants, we ensure that eligible voters have demonstrated a tangible investment in the community's future. This satisfies the "commitment" criterion without relying on a federal status that may be inaccessible to long-term residents for reasons unrelated to their local stake.

  **4. The "Arbitrariness" Objection (Addressing Faction 3)**

  The third argument suggests that because *any* eligibility line (age, residency, citizenship) is somewhat arbitrary, the status quo is as defensible as any change. This relies on a logical fallacy: that because a line is constructed, all lines are equally valid.

  It is true that all boundaries are, to some degree, arbitrary. The voting age of 18 is not a law of nature; it is a convention. However, it is not *capricious*. We do not set the age at 5 or 50 because those lines fail to serve the purpose of the election (selecting mature decision-makers). Similarly, the fact that "citizenship" is a constructed line does not mean it is the *best* line for municipal purposes.

  The status quo is not a neutral default; it is an active choice to prioritize national identity over local residence. To say "all lines are arbitrary, so let's keep the old one" is to argue that inertia is a virtue. If we agree that the purpose of municipal voting is to ensure those governed have a say, then a line based on *residence and legal presence* serves that purpose better than a line based on *national naturalization*. The question is not "Is this line perfect?" but "Does this line better serve the function of city government?" The evidence suggests it does.

  **5. Precedent and Feasibility**

  Regarding the testimony on other jurisdictions: It is factually correct that several U.S. municipalities allow noncitizen voting in specific local elections.
  *   **Takoma Park, MD:** Has allowed noncitizen voting in municipal elections since 1992.
  *   **Massachusetts:** Several towns (e.g., Amherst, Brookline) have passed measures to allow noncitizen voting in school board elections, though some await state approval.
  *   **New York City:** The City Council passed a law in 2021 to allow noncitizen voting in local elections, though it faced subsequent legal challenges.

  These precedents demonstrate that the administrative mechanics are feasible. However, we must note that our authority to enact this is contingent on [State Name] Election Code. I recommend we request an immediate opinion from City Legal Counsel regarding state preemption before finalizing the ballot language.

  **6. Conclusion**

  The Commission was asked to take a position. Maintaining the status quo is a position, but it is one that ignores the demographic reality of our city and the functional nature of municipal power.

  By endorsing this amendment with a one-year residency buffer, we affirm that local democracy should be rooted in local presence. We acknowledge the need for commitment without conflating it with nationality. We reject the idea that because drawing lines is difficult, we should not draw them better.

  I look forward to debating this specific formulation at our next meeting.

  ***

  **Implementation Note for the Commission:**
  *Please be advised that this recommendation assumes the Commission has the authority to alter voter eligibility under state law. If state statute restricts municipal voter eligibility to state/federal electors, this charter amendment may require accompanying state legislation to take effect.*
