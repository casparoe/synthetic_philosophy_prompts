  The Sestina of the Worker

  She pays the metabolic **cost**
  To raise her mother's genetic **copy**
  In every larva, every hungry **sister**
  Within the darkened heart of **colony**
  She loses track of any distinct **self**
  And waits the quiet approach of **death**

  What looks like early **death**
  Is bookkeeping that ignores the **cost**
  To the bounded, individual **self**
  For genes only count the successful **copy**
  Whether housed in queen or **colony**
  It matters not which body holds the **sister**

  She tends the **sister**
  But meets her own reproductive **death**
  A sterile cell inside the **colony**
  The ledger shows a net personal **cost**
  Unless you count the indirect **copy**
  Then where resides the **self**?

  The **self**
  Is emergent, built of many a **sister**
  Units working to propagate the **copy**
  Some face a higher risk of **death**
  To minimize the collective **cost**
  Selection acts upon the **colony**

  Partition the variance of the **colony**
  The **self** contributes to the within-group term
  The altruism bears a within-group **cost**
  But lifts the average **sister**
  One term predicts lineage **death**
  The other saves the faithful **copy**

  Who holds the pen that counts the **copy**?
  Is it the hive, the **colony**, or gene?
  The balance always zeros out at **death**
  We argue over the boundaries of **self**
  She feeds the **sister** without asking why
  And pays the biological **cost**

  *Envoi*

  Are these three explanations, one **copy** of **self**?
  Or one truth with names for **colony** and **sister**?
  One story told through **death** and **cost**.

  ***

  **Note on Contested Readings**

  1.  **Colony as Unit (Stanza 4):** The claim that "Selection acts upon the colony" reflects the Multi-Level Selection (MLS) view (e.g., Sober, Wilson). A strict Gene Selectionist (e.g., Williams, Dawkins) would argue selection *always* acts on genes, with the colony being merely a vehicle or environment. The poem presents this as a competing ledger rather than a falsification.
  2.  **Price Equation (Stanza 5):** The partitioning of variance into within-group and between-group components is mathematically uncontroversial, but its *explanatory* status is debated. Some argue it is a tautology that describes change without identifying causal mechanisms, while others (like the stanza suggests) treat the terms as causal forces competing against one another.
  3.  **The "Self" (Stanza 3 & 6):** The poem leverages the ambiguity of "self." In biology, this oscillates between the physiological organism (the worker bee) and the genetic individual (the replicate lineage). The philosophical question in the envoi hinges on whether these are ontologically distinct entities or merely different accounting perspectives on the same physical process.
