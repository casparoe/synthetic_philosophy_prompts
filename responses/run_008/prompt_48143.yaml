  Here's a weird thing about my company I keep turning over. We have an "Above and Beyond" award — quarterly, a shoutout at the all-hands plus a $100 gift card if you did something way outside your role, like the support guy who spent a weekend hand-migrating a customer's data so we didn't lose the account. Nobody thinks the people who don't do that kind of thing did anything wrong — it's not like skiping a deadline, no one gets talked to for merely doing their job. But at the same time, in performance reviews, "meets expectations" is quietly treated as a bad rating: it's the box managers check for someone they're about to put on a improvment plan, and when we had layoffs last year, the people who "just did their job" were the first to go. So in one breath going beyond the role is optional-but-praiseworthy, and in the next it's basically required, just with the requirement never stated out loud. What's going on here philosophically? What view of duty and obligation does this setup actually presuppose — is there really a category of acts that are good to do but not bad to omit, or does the review/layoff side reveal that the "optional" part was a fiction all along? And if there's no such category, what would the award itself have to become for the whole system to be consistent? Answer as exactly five numbered points, each one or two sentences, no intro or conclusion.
