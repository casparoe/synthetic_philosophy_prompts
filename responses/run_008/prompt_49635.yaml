          *   (a) Substantive/Defensible (intuitively appealing to many).
          *   (b) Cost: Hard to justify theoretically without arbitrary lines.
          *   (c) Vindication: Strong. Creating happy animals is neutral; preventing suffering is good. Rewilding is neutral at best.
          *   (d) Need: Crucial for the "not create happiness" part regarding *new* lives.

      *   *4. Differential Weighting (Prioritarianism):* "Suffering counts, happiness counts, but suffering counts more."
