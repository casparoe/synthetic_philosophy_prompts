      *   *Idea 2: Scope Restriction.* We only owe duties to existing beings. New animals don't have claims.
      *   *Idea 3: Differential Weighting.* Suffering counts more than happiness, but happiness still counts.
      *   *Idea 4: Existence Asymmetry.* Benefiting existing beings is good; bringing new beings into existence to benefit them is neutral/not required.
      *   *Idea 5: Lexical Priority (Negative Utilitarianism).* Suffering is the only thing that matters, or no amount of happiness cancels suffering. (Strongest)

      *Refining the specific distinctions requested:*
      *   *Lexical Priority:* Need to distinguish between "Suffering is the *only* value" (Strong NU) and "Suffering lexically outweighs happiness" (Lexical Prioritarianism).
      *   *Differential Weighting:* Standard Negative Utilitarianism or Prioritarianism.
      *   *Asymmetry:* The "Person-Affecting" view or Benatar's Asymmetry.
      *   *Scope:* Existing beings only.
      *   *Practical:* Epistemic humility.

      *Let's order them logically by "strength of constraint on creating happiness":*
      1.  Practical/Epistemic (Happiness is hard/uncertain).
      2.  Scope Restriction (Duties only to existing).
      3.  Existence Asymmetry (No duty to create happy lives).
      4.  Differential Weighting (Suffering > Happiness).
