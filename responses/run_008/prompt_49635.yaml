          *   (d) Need: Required to categorically block rewilding based on wild suffering.

      *   *6. Strong Negative Utilitarianism:* "Only suffering has moral disvalue; happiness is morally neutral."
          *   (a) Radical/Controversial.
          *   (b) Cost: "World Destroyer" objection (best way to reduce suffering is to eliminate all sentient life).
