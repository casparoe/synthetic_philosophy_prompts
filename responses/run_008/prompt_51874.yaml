      *Move 3:* The American claims "every datum... exists only because citizens initiated it." This is factually questionable (third-party data brokers, public records), but in the context of tax data, it's mostly true. The logical leap is "therefore you can't complain." That's the mistake.
      *Move 4:* "Require the state to show you every inference." This is the "right to explanation" in GDPR. It's a valid legal concept. So it's not "mistaken," just maybe insufficient per Move 5.
