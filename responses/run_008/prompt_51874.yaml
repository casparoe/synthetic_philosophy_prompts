      *   **Move 5 (German):** Transparency is toothless. Need to ban certain inferences, not just reveal them. Can't list data types because sensitive conclusions come from insensitive inputs.
          *   *Nature:* Substantive limits on power.
          *   *Validity:* Very Strong. This is the core of modern privacy law (purpose limitation). Transparency without recourse is useless. The "mosaic theory" of privacy is accurately described.
          *   *Rating:* Clearly Right.

