  2. Claiming descriptive facts never vindicate morality contradicts asserting that lacking a foundation is a moral defect, since that defect is inferred from a descriptive psychological absence. You should revise (2) to specify that descriptive facts about judgment content do not vindicate, even if facts about moral capacity do.
  3. Asserting conservatives use more foundations while maintaining only harm-based facts implies much of conservative morality is illusory, undermining the neutral descriptive tone of (1). The least costly fix is to clarify in (1) that engaging more foundations indicates psychological breadth, not normative accuracy.
  4. The tension between evolutionary etiology and moral realism dissolves because your vision analogy successfully grants that adaptive origins do not preclude reliability about stance-independent facts. This works because both vision and moral intuition can be selected for tracking truth rather than mere utility.
  5. You would likely abandon the pluralistic repair if convinced that loyalty's value is entirely instrumental to long-term well-being rather than intrinsic. This empirical reduction would restore consistency between your consequentialism and your intuition about moral defects.
