          *   *Simplification:* If Theory A and Theory B are both false, they both have infinite false consequences. Popper's definition requires comparing the *sets*.
          *   *The Kill Shot:* Tichý and Miller showed that under Popper's logic, if two theories are false, you cannot order them. One cannot be closer. In fact, adding a false consequence to a theory might technically increase its "truth content" in weird logical ways, or the conditions become impossible to satisfy for false theories.
