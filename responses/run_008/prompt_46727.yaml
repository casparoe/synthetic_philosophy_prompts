      *   *Pessimistic Meta-Induction:* Past successful theories (Newton) were false. So current ones (Einstein) are likely false.
      *   *Verisimilitude:* We need a way to say Einstein is *better* than Newton even if both are strictly false.
      *   *Popper's Attempt:* Define it logically. $A$ is closer to truth than $B$ if $A$ has more true consequences and no more false consequences (or some variation).
