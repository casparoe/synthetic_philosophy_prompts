answer: |-
  This is one of the most sophisticated debates in the philosophy of science, and your friend has stumbled upon a genuine crisis that occupied the field for decades. His position is a version of **instrumentalism** or **constructive empiricism**: if theories are strictly false, talk of "approximate truth" is merely a metaphor for empirical adequacy or pragmatic utility.

  To answer your question directly: **Your friend is right that Popper's original definition failed, but he is likely wrong that the concept of verisimilitude (truthlikeness) is inherently empty.** The collapse of Popper's definition revealed a deep logical problem, but modern accounts have largely rescued the concept by shifting from *logical consequences* to *semantic distance*.

  Here is an explanation of why the naive idea breaks down, why the Miller–Tichý result was so devastating, and what a workable analysis requires to defeat your friend's deflationary hunch.

  ---

  ### 1. The Intuitive Goal: Why We Need Verisimilitude
  Scientific realism relies on the idea that science progresses toward the truth. But the "Pessimistic Meta-Induction" notes that almost all past successful theories (Newtonian mechanics, phlogiston, caloric) turned out to be strictly false. If we say they were "false," we risk saying science is a history of errors. If we say they were "true," we contradict current science.

  We need a middle ground: Newton is *false*, but Einstein is *less false*. We need a measure of **verisimilitude** to say that Einstein's theory captures the structure of the world more accurately than Newton's, even if neither is perfectly true.

  ### 2. Popper's Naive Definition: The Content Approach
  Karl Popper wanted to define this logically, without relying on vague metaphors. He proposed comparing the **truth content** and **falsity content** of two theories.

  *   **Truth Content:** The set of all true statements entailed by the theory.
  *   **Falsity Content:** The set of all false statements entailed by the theory.

  **Popper's Definition:** Theory $A$ has more verisimilitude than Theory $B$ if:
  1.  $A$ has more truth content than $B$ (and no less falsity content), **OR**
  2.  $A$ has less falsity content than $B$ (and no less truth content).

  Intuitively, this matches your requirement: *verisimilitude should increase when truth content increases without falsity content increasing.* It seems to say: "Get more right, don't get more wrong."

  ### 3. The Collapse: The Miller–Tichý Result
  In the 1970s, David Miller and Pavel Tichý independently proved that Popper's definition collapses. They showed that **for any two false theories, Popper's conditions can never be met.** Under Popper's logic, no false theory can be closer to the truth than any other false theory.

  **Why does the naive idea break down?**
  The problem lies in how logical consequence works compared to how "error" works.

  1.  **Logical Strength vs. Truth:** In logic, a stronger theory (one that makes more specific claims) entails more consequences. If a theory is true, being stronger is good (more truth content). If a theory is false, being stronger is bad (it entails more false consequences).
  2.  **The Entanglement:** You cannot separate truth content from falsity content simply by counting consequences. If you add a true consequence to a false theory, you often logically commit yourself to new false consequences, and vice versa.
  3.  **The "Ex Falso" Problem (Simplified):** While not relying on explosion (*ex falso quodlibet*), the Miller–Tichý proof demonstrates that for false theories, the sets of true and false consequences are linked in such a way that you cannot increase the size of the truth set without inadvertently increasing the size of the falsity set in a way that violates Popper's ordering.

  **The Conceptual Failure:**
  Popper treated all errors as equal. In his system, a theory is just a bucket of sentences. If Theory A says "It is raining and cold" (False, because it's hot) and Theory B says "It is raining and freezing" (False, because it's hot), Popper's logic struggles to distinguish them based on *how* wrong they are. It only counts *that* they are wrong.

  Because logical consequence is binary (a statement follows or it doesn't), it cannot capture **magnitude of error**. Being off by 1% and being off by 100% both generate "false consequences." Popper's definition had no way to weigh the *severity* of the falsity.

  ### 4. What an Adequate Account Must Deliver
  To save scientific realism from your friend's deflationary attack, a new definition of verisimilitude must move away from counting syntactic consequences and toward measuring **semantic distance**.

  Modern accounts (championed by philosophers like Ilkka Niiniluoto and Graham Oddie) use **Possible Worlds Semantics**.

  #### A. State-Space and Distance
  Instead of counting sentences, we imagine the "state space" of the world.
  *   **Example:** Suppose the truth is that a particle has mass $10$.
  *   **Theory A** says mass is $9$.
  *   **Theory B** says mass is $1$.
  *   Both are false. But A is *closer* to the truth.

  An adequate account must define a **metric of distance** between the world described by the theory and the actual world. This allows us to say that some falsehoods are "smaller" than others.

  #### B. The Requirements for Success
  To defeat your friend, a theory of verisimilitude must satisfy specific conditions that Popper's failed to meet:

  1.  **The Truth Preference:** If Theory $A$ is true and Theory $B$ is false, $A$ must have higher verisimilitude.
  2.  **The Error Magnitude Condition:** Among false theories, one that makes smaller errors (in terms of physical parameters or structural similarity) must rank higher.
  3.  **The Content Condition (Modified):** Your intuition was correct: generally, adding truth should help. However, an adequate account must allow that **reducing the severity of error** can increase verisimilitude even if the theory remains strictly false.
      *   *Correction to your requirement:* You suggested verisimilitude increases *only* when truth content increases without falsity content increasing. Modern accounts relax this. Sometimes we accept a new falsity (a new idealization) if it drastically reduces the *magnitude* of other errors. (e.g., General Relativity is mathematically more complex and entails new false predictions in quantum regimes, but it reduces the gravitational error to near zero).

  #### C. Structural Similarity
  The most robust defense against your friend is **Structural Realism**. Even if the *objects* of a theory change (e.g., from absolute time to spacetime), the *mathematical structure* often remains continuous.
  *   Newton's equations are a limiting case of Einstein's (as $c \to \infty$).
  *   This mathematical continuity provides an objective fact of the matter about "closeness." It is not just pragmatic preference; it is a topological fact about the relationship between the theories' models and the world's structure.

  ### 5. Verdict on Your Friend's Deflationary Hunch
  Is your friend right that "closer to the truth" is empty rhetoric?

  **He is right that:**
  *   Popper's original logical definition is dead.
  *   If you define "closeness" merely by counting true/false sentences, the concept is incoherent.
  *   We cannot access "The Truth" directly to measure the distance (the measurement problem).

  **He is wrong that:**
  *   There is *no fact of the matter*. If the world has a structure (mass, curvature, charge), and theories model that structure, then mathematical distance provides an objective metric.
  *   It is *merely pragmatic*. Pragmatics explains why we *use* a theory (ease of calculation), but verisimilitude explains why the theory *works* (because it latches onto real causal structures).

  ### Summary for Your Argument
  To resolve your impasse, you can concede that Popper's specific definition was a failure, but insist that the **concept** survived the crash.

  Tell your friend: *"Popper tried to measure truthlikeness by counting logical consequences, and Miller and Tichý proved that doesn't work because logic doesn't measure magnitude. But modern verisimilitude measures the **distance between models and reality**. Newton's model is mathematically contiguous with Einstein's; it is a specific limit of Einstein's geometry. That mathematical relationship is an objective fact, not a pragmatic preference. Therefore, Einstein is objectively closer to the truth, even if both are strictly false."*

  This preserves realism without requiring theories to be "true" in the absolute sense, satisfying the intuition that science progresses rather than just changes.
