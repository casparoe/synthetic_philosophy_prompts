answer: |-
  This is a delightful brief. It's rare to get a facilitator who knows the literature but respects the constraints of a non-specialist group. Given your background, you'll appreciate a structure that treats the session like an experiment: control variables, isolate the phenomenon, then test the hypothesis.

  Here is the plan, structured around your five requests.

  ### 1. The Ordering (Dependencies & Sequence)

  You are right to worry about the sequence. With a lay group, if you start with the metaphysics (properties) or the epistemology (ability vs. fact), you lose them. If you start with "Subjectivity," the conversation ends before it begins.

  **The Critical Dependency:** You must establish the **normativity of aesthetic judgment** before you can explain why testimony fails. If they think aesthetic claims are just reports of pleasure ("I like this"), testimony works fine (I can testify that I am happy). The puzzle only exists if aesthetic claims claim a kind of *authority* that requires grounding.

  **Recommended Sequence:**
  1.  **The Baseline (Ordinary Testimony):** Establish how effortlessly we accept non-aesthetic testimony (the salty soup).
  2.  **The Glitch (The Aesthetic Intuition):** Introduce the carrying example. Show that testimony *feels* different here.
  3.  **The Subjectivity Trap (Early Intervention):** Neutralize the "beauty is in the eye of the beholder" crowd immediately after The Glitch.
  4.  **The Explanation (Fact vs. Ability):** Once the intuition is secure and subjectivity is bracketed, offer the "ability" explanation for *why* the glitch happens.
  5.  **The Assessment:** Test if they grasp the distinction.

  **Where it breaks:** If you move to **Fact vs. Ability** before securing **The Glitch**, they will treat "ability" as just another fact to be memorized. If you don't neutralize **Subjectivity** early, the "Glitch" will be dismissed as "well, obviously, tastes differ," and you'll spend 40 minutes arguing relativism instead of testimony.

  ### 2. The Carrying Example

  Stick with your instinct: **The Friend and The Dish.** Do not use Hume's wine. It introduces historical distance and alcohol-specific baggage (intoxication, snobbery). Food is universal, sensory, and allows for complexity without requiring specialized training.

  **The Specific Case:**
  Don't make it "a meal." Make it a specific dish with a specific aesthetic property that resists simple description.
  *   *Suggestion:* **A complex stew (e.g., Beef Bourguignon) or a specific Pastry.**
  *   *The Scenario:* Your friend says, "The balance of acid and fat in this stew is perfect; it's profound." You haven't tasted it.
  *   *What it needs:* It must have **perceptual properties** (salty, sweet, tender) that *are* testimonial-friendly, and **aesthetic properties** (balanced, profound, harmonious) that are the target of the testimony.
  *   *What it needs to lack:* It must lack **instrumental stakes**. It shouldn't matter if the stew is good, other than for the experience of eating it. (If the stew was poisoned, testimony about safety works fine. We need to isolate the *aesthetic* value).

  **Why this works:** It mirrors the "Salty Soup" baseline but escalates the complexity. Everyone knows salt is a physical property. "Balance" is a relation between properties that requires holding them in the mind (or palate) simultaneously. This sets up the "Ability" argument perfectly later.

  ### 3. The Misconceptions

  **Predicted 1: "Beauty is Subjective" (The Relativist)**
  *   *Where to head it off:* **Immediately after The Glitch (Minute 20).**
  *   *How:* Don't argue against it. Bracket it. Say: "For the sake of this hour, let's assume there *are* better and worse stews, just as there are sound and unsound arguments. If we assume there is a fact of the matter about the stew's quality, does testimony transmit it?" This turns subjectivity from a conversation-stopper into a controlled variable.

  **Predicted 2: "Reviews Work, So Obviously Yes" (The Naive Optimist)**
  *   *Where to head it off:* **During The Explanation (Minute 50).**
  *   *How:* Distinguish between *acting* on testimony and *knowing* via testimony. "You might book the table based on the review (action), but if someone asks 'Is it good?', do you say 'I know it is' or 'I'm told it is'?" This highlights the normative gap.

  **Unpredicted Misconception 1: "It's About Persuasion"**
  *   *The Risk:* They will think the goal of testimony is to get you to eat the stew.
  *   *The Catch:* **Minute 30.** Clarify that we are talking about *epistemic entitlement*, not practical utility. "If you eat the stew and love it, the testimony worked pragmatically. But did you *know* it was good before you swallowed?"

  **Unpredicted Misconception 2: "Confusing Properties"**
  *   *The Risk:* They will treat "balanced" as just a fancy word for "salty + sweet."
  *   *The Catch:* **Minute 15 (The Baseline).** Explicitly distinguish *simple sensory properties* (salt, heat, crunch) from *aesthetic properties* (balance, elegance, clumsiness). Use the whiteboard for this one (see below).

  ### 4. The Assessment Check

  You need a question that forces them to choose between "believing a fact" and "holding a judgment."

  **The Question:**
  *"Imagine you accept your friend's testimony. You believe the stew is profound. You are now at a dinner party with a critic who says the stew was clumsy and unbalanced. Do you feel entitled to **argue** with the critic, or do you feel you must **defer**?"*

  *   **Why this works:** If they think testimony gives knowledge, they should feel entitled to argue (they possess the fact). If they sense the "Ability" constraint, they will admit they must defer (they lack the grounding to defend the judgment). This reveals whether they grasp the *normative* weakness of aesthetic testimony, not just the practical uncertainty.

  ### 5. What to Leave Out (The General Testimony Debate)

  **The Verdict:** You can leave out 95% of the Hume/Reid/Coady reductionism debate. It is not load-bearing for *aesthetic* testimony specifically.

  **The One Scrap to Keep:** The **Norm of Assertion**.
  You need to briefly mention that when we speak, we imply we have grounds for what we say. This is the only piece of general epistemology you need.

  **How to Announce the Exclusion:**
  At the start (Minute 5), say this:
  *"There is a huge philosophical debate about whether we can trust testimony in general—science, history, news. Today, I am asking you to grant that ordinary testimony works. If I tell you it's raining, you know it's raining. I want to bracket that general debate entirely. We are asking only: Is aesthetic testimony a special case? If we find it fails, it's not because testimony is broken, but because aesthetics is special."*

  This prevents the "Well, you can't trust anyone these days" tangent and focuses them on the aesthetic specific.

  ### Session Flow (90 Minutes)

  **00-10: Setup & Exclusions**
  *   Coffee poured.
  *   State the question: "Can I know a dish is good if you tell me so, without tasting it?"
  *   Set the bracket: "We assume ordinary testimony works (rain, salt, traffic). We are testing if aesthetics breaks the machine."
  *   *Whiteboard:* Write "Ordinary Testimony = OK" on the left.

  **10-25: The Baseline & The Glitch**
  *   *Example:* "I tell you the soup is salty." (Write "Salty" under Ordinary). They agree you know this.
  *   *Example:* "I tell you the stew is *balanced*." (Write "Balanced" under Aesthetic).
  *   *Discussion:* Does the second one feel the same? Why does it feel like you're missing something?
  *   *Goal:* Elicit the intuition that something is missing (the "experience gap").

  **25-35: Neutralizing Subjectivity**
  *   *Intervention:* Someone will say "It's just opinion."
  *   *Response:* "Let's pretend there is a fact of the matter. Even if it's subjective, can I inherit *your* subjective fact? Or must I generate my own?"
  *   *Goal:* Move from "Truth" to "Entitlement."

  **35-60: The Core Debate (Fact vs. Ability)**
  *   This is the heavy lifting. Introduce the idea that aesthetic judgment might be a **skill** (like swimming or tasting) rather than a **file** (like a phone number).
  *   *Analogy:* I can tell you how to swim (facts), but that doesn't mean you can swim (ability).
  *   *Discussion:* Is appreciating the stew more like knowing the phone number or knowing how to swim?
  *   *Whiteboard:* Draw a line between "Know-That" (Propositional) and "Know-How" (Procedural). Place "Salty" on the left, "Balanced" on the right.

  **60-75: The Assessment & Implications**
  *   Pose the **Critic Question** (see Section 4).
  *   Discuss the implications. If testimony doesn't work, what is the point of critics? (They are trainers, not informants).
  *   Discuss the social function. If I can't know via testimony, why do we talk about art/food at all? (To align our abilities, not transfer data).

  **75-90: Wrap & Exclusions Recap**
  *   Summarize the consensus (likely a nuanced pessimism).
  *   Reiterate what was left out (General epistemology of trust).
  *   Final coffee top-up.

  ### Whiteboard Requirements
  You don't need handouts, but a whiteboard (or large notepad) is **load-bearing** for Section 5 (Misconceptions) and Section 1 (Ordering).
  *   **Draw:** A simple T-Chart.
  *   **Left Column:** "Physical/Simple" (Salt, Hot, Loud).
  *   **Right Column:** "Aesthetic/Complex" (Balanced, Profound, Clumsy).
  *   **Use:** As they speak, place their examples in the columns. This visually reinforces the distinction between properties that transmit via testimony and those that don't.

  ### Final Note for a Microbiologist
  You'll be tempted to look for the "mechanism" of why testimony fails. Resist the urge to solve it. Your role is to keep the culture growing in the petri dish, not to stain the slide. If they get stuck on "But my friend never lies," remind them: "It's not about trustworthiness. It's about capacity."

  Good luck. It sounds like a splendid group.
