prompt: |-
  I'm giving a talk at my local EA meetup arguing against fanaticism — roughly, the view that you should always prefer a tiny chance of astronomically huge value over a certainty of modest value. My line is that we should put some cap on how much weight super-low-probability upsides get, so you'd turn down Pascal's mugging but also some of the more far-fetched long-shot interventions our community likes to fund. The audience is maybe 25ish people: mostly longtermists who think the far future just dominates the expected value math, one guy who's deep into the decision theory literature and will definately come at me with money-pump / stochastic dominance style arguments, and a couple of stats-curious folks who don't care about EA framing at all and just want to know if my cap is even a coherent decision rule. Prep me a Q&A sheet: the objections I'll actually get from this crowd, in roughly the order they'll come, phrased the way they'd phrase them, each with a short reply and a note on where my reply is shaky. Flag what I should concede up front, and include the question I'm quietly hoping nobody asks. Also — if you think my whole framing is off, e.g. that "fanaticism" isn't the real target or my cap idea collapses under any pressure, tell me that straight instead of building a defense I shouldn't want.
reasoning: |-
  Here's a thinking process that leads to the suggested Q&A sheet:

  1.  **Analyze the User and Request:**
      *   **User:** Giving a talk at a local EA (Effective Altruism) meetup.
      *   **Topic:** Arguing against "fanaticism" (prioritizing tiny probabilities of astronomical value over modest certainties). Proposing a "cap" on low-probability upsides.
      *   **Audience:** ~25 people.
          *   Majority: Longtermists (believe far future dominates EV).
          *   One Specific Individual: Deep into decision theory (will use money-pump/stochastic dominance arguments).
          *   Few: Stats-curious (care about coherence of the decision rule, not EA framing).
      *   **Goal:** A Q&A sheet with objections, replies, weaknesses, concessions, and the "hope nobody asks" question.
      *   **Constraint:** If the framing is fundamentally flawed, tell them straight instead of building a weak defense.

  2.  **Initial Assessment of the Position ("Capping" Probabilities/Utility):**
      *   *The Core Problem:* The user is essentially proposing bounded utility or probability discounting to avoid Pascal's Mugging. This is a well-trodden path in decision theory.
      *   *The Hard Truth:* Standard expected utility theory (EUT) *does* imply fanaticism if utility is unbounded and probabilities are non-zero. To avoid fanaticism, you *must* violate some axiom of EUT (like Continuity, Independence, or Unbounded Utility).
      *   *The "Cap" Idea:* A hard cap on probability weight or utility value is mathematically coherent *if* you explicitly reject standard EUT. However, it opens you up to money-pump arguments (intransitivity) or "stochastic dominance" violations (preferring a distribution that is strictly worse in every state).
      *   *Verdict:* The framing isn't "off" in the sense that it's a popular and necessary pragmatic stance for many EAs. However, the *theoretical justification* is the weak point. You can't have your cake (EUT) and eat it too (no fanaticism). The advice should reflect this tension: be pragmatic, admit the theoretical cost, and focus on epistemic humility rather than pure decision-theoretic axioms.

  3.  **Drafting the Q&A Content:**

      *   **Objection 1: The Decision Theorist (Money Pump/Stochastic Dominance).**
          *   *Phrasing:* "If you cap utility/probability, you violate stochastic dominance. I can construct a lottery you prefer to A, and B to that lottery, but prefer A to B. You're money-pumpable."
          *   *Reply:* Acknowledge the theoretical cost. Argue for "ecological rationality" over abstract coherence.
          *   *Weakness:* It *is* a violation of rationality axioms. Hard to deny.
          *   *Concession:* Admit EUT must be modified.

      *   **Objection 2: The Longtermist (The Stakes are Too High).**
          *   *Phrasing:* "If the future is $10^{50}$ lives, even 1% of 1% matters more than saving 100 lives now. Your cap arbitrarily ignores the most important thing."
          *   *Reply:* Focus on epistemic uncertainty (probability is actually lower than you think) rather than decision-theoretic caps.
          *   *Weakness:* If they insist the probability is robust, the cap looks like willful ignorance.

      *   **Objection 3: The Stats Person (Coherence/Arbitrariness).**
          *   *Phrasing:* "Where does the cap come from? Why $10^{-9}$? Why not $10^{-8}$? It looks ad hoc."
          *   *Reply:* It's a heuristic, not a law. Like a p-value threshold.
          *   *Weakness:* It is ad hoc.

      *   **Objection 4: The "Shutdown" Argument (Existential Risk).**
          *   *Phrasing:* "If you cap low probabilities, you ignore X-risk. That's the whole point of EA."
          *   *Reply:* Distinguish between "speculative far-future" and "concrete existential risk this century."
          *   *Weakness:* The line is blurry.

      *   **The "Hope Nobody Asks" Question:**
          *   *Candidate:* "If you reject fanaticism, do you also reject religious Pascal's Wagers?" (Too easy).
          *   *Better Candidate:* "Does your cap apply to negative outcomes too?" (If you cap bad outcomes, you ignore s-risks. If you don't, you're asymmetric).
          *   *Best Candidate:* "Are you advocating violating the Independence Axiom? If so, which alternative decision theory are you using?" (Forces the user to name a specific non-EUT framework, which they likely haven't done).

  4.  **Refining the Advice (The "Straight Talk" Section):**
      *   I need to tell the user that "capping" without a formal framework is vulnerable.
      *   The strongest argument isn't a *decision-theoretic cap*, it's *epistemic skepticism*. (i.e., "The probability isn't $10^{-9}$, it's 'model error'").
      *   I should advise them to pivot from "I cap utility" to "I distrust probability estimates at this scale."

  5.  **Review and Formatting:**
      *   Tone: Direct, slightly cynical (EA crowd style), precise.
      *   Structure: Straight talk first, then Q&A, then concessions.
      *   Check against constraints: Did I include the shaky notes? Did I include the "hope nobody asks"? Did I address the specific audience members?

  6.  **Self-Correction/Polishing during drafting:**
      *   *Correction:* Make sure I distinguish between *probability discounting* and *utility bounding*. They solve the same problem but have different vulnerabilities. I'll advise the user to mix them but be clear.
      *   *Refinement on the Decision Theorist:* This person is the biggest threat. I need to make sure the user doesn't try to out-math them. The strategy is to concede the math but challenge the *applicability*.
      *   *Refinement on Longtermists:* Don't attack longtermism, attack *fanaticism*. Distinguish the two.

  7.  **Final Polish:** Check the "Straight Talk" section. Is it too harsh? No, the prompt asks for honesty. The "cap" idea is notoriously difficult to defend formally without embracing a specific non-standard decision theory (like bounded utility or truncated expectation). I need to make sure they know this.

  *(Self-Correction on the "Hope Nobody Asks" question)*: The classic killer question for anti-fanaticism is usually about *symmetry*. If you cap positive outliers, do you cap negative outliers? If yes, you ignore s-risks (suffering risks). If no, why the asymmetry? I'll use that.

  8.  **Final Output Generation** (incorporating the above thoughts).
answer: |-
  ### The Straight Talk (Read this first)

  Your framing is **theoretically vulnerable**. In standard Expected Utility Theory (EUT), if you have unbounded utility and non-zero probabilities, fanaticism is a theorem, not a bug. To avoid it, you must violate an axiom (usually Continuity or Unbounded Utility).

  If you propose a "cap" without specifying *which* axiom you're breaking, the decision theorist in the room will eat you alive. A "pragmatic cap" looks like an ad hoc patch to someone who cares about coherence.

  **My advice:** Pivot your talk. Don't argue for a *decision-theoretic cap* (which implies the math is wrong); argue for *epistemic humility* (which implies the inputs are wrong).
  *   **Bad argument:** "Even if the probability is real and the value is real, I ignore it." (This is money-pumpable).
  *   **Good argument:** "At this scale, probability estimates are indistinguishable from model error. We aren't dealing with risk; we're dealing with Knightian uncertainty."

  If you stick with the "cap" framing, you need to own the theoretical cost. Below is the Q&A prep based on your current plan, assuming you don't pivot.

  ---

  ### Q&A Sheet

  #### 1. The Decision Theorist (The Money Pump)
  **Q:** "If you truncate expected value at a certain probability or utility threshold, you violate **Stochastic Dominance**. I can construct two lotteries where Option A is strictly better than Option B in every possible state of the world, but your rule makes you prefer B. Are you comfortable admitting your rule is formally irrational?"
  *   **The Reply:** "I'm comfortable admitting that standard EUT axioms don't map perfectly to real-world decision-making under radical uncertainty. Coherence is a virtue, but not if it forces you to sell your house for a 1 in $10^{20}$ chance of a magic wand. I prioritize robustness over axiomatic purity."
  *   **Where it's shaky:** You are essentially admitting to being irrational by standard definitions. If they press on *how* to make you coherent without accepting fanaticism, you need a named alternative theory (e.g., bounded utility), not just a "cap."
  *   **Concession:** Concede immediately that this violates EUT. Don't try to deny the math.

  #### 2. The Longtermist (The Stakes)
  **Q:** "You're conflating 'fanaticism' with 'longtermism.' Most longtermist interventions (like pandemic preparedness) have probabilities way higher than your cap. Are you accidentally arguing against mitigating existential risk this century because the future is big?"
  *   **The Reply:** "I'm drawing a line between *concrete* x-risk (e.g., engineered pathogens with measurable prevalence) and *speculative* value (e.g., simulating $10^{50}$ digital minds). My cap targets the latter, where the probability estimate is driven by philosophical argument rather than empirical data."
  *   **Where it's shaky:** The line between "concrete" and "speculative" x-risk is blurry (e.g., AI alignment). They will argue that alignment *is* speculative but dominates EV.
  *   **Concession:** Agree that near-term x-risk likely passes the threshold. Clarify your target is *astronomical* value in the *far* future, not basic survival.

  #### 3. The Stats-Curious (The Arbitrariness)
  **Q:** "Okay, you want a cap. Is it on probability (e.g., ignore $p < 10^{-9}$) or utility (e.g., ignore value $> 10^{10}$)? And where does that number come from? It looks like you picked a number that gives the answer you wanted."
  *   **The Reply:** "It's a heuristic, similar to a p-value threshold in science. It's not a law of physics; it's a guardrail against overfitting our moral intuitions to noisy variables. I suggest a probability discount based on the complexity of the claim (Occam's prior)."
  *   **Where it's shaky:** P-values are for hypothesis testing, not decision rules. If they ask why $10^{-9}$ and not $10^{-8}$, you have no non-arbitrary answer.
  *   **Concession:** Admit the threshold is pragmatic, not fundamental.

  #### 4. The Symmetry Trap (S-Risks)
  **Q:** "Does your cap apply to negative outcomes too? If I offer you a certainty of mild discomfort vs. a tiny chance of astronomical suffering (s-risk), do you cap the suffering? If yes, you're ignoring the worst possible outcomes. If no, why is your decision rule asymmetric?"
  *   **The Reply:** "That's a strong point. However, avoiding catastrophe is often more tractable than creating utopia. I might weight negative tails differently because the 'value' of avoiding torture is more robustly defined than the 'value' of extra happy lives."
  *   **Where it's shaky:** This violates the linearity of utility. If you cap gains but not losses, you are explicitly rejecting a standard utility function.
  *   **Concession:** **See "Hope Nobody Asks" below.** This is the hardest spot.

  #### 5. The "Shut Up and Multiply" Guy
  **Q:** "If you had to choose between saving 1,000 lives for sure or a 1% chance of saving 100,000 lives, you'd take the EV. At what exact point does your intuition break? Is it just when the numbers get big enough to feel absurd?"
  *   **The Reply:** "It breaks when the probability estimate becomes less reliable than the moral intuition. I trust my intuition that '1,000 lives matters' more than I trust a calculation involving $10^{50}$ beings."
  *   **Where it's shaky:** This sounds like emotional reasoning. They will argue that moral intuitions evolved for tribal dynamics and shouldn't override math at scale.

  ---

  ### The Question You're Hoping Nobody Asks

  **"Which specific decision theory are you proposing as an alternative to Expected Utility? Are you advocating for Bounded Utility, Probability Discounting, or something like Risk-Weighted Expected Utility? Because each has known flaws."**

  *   **Why this hurts:** It forces you to stop using "common sense" as a shield and pick a formal framework.
      *   If you say **Bounded Utility**: They'll argue you'd refuse to save infinite lives for any finite cost.
      *   If you say **Probability Discounting**: They'll hit you with the Stochastic Dominance argument (Obj #1).
      *   If you say **Risk-Weighted**: They'll argue you're just smuggling in a cap via the risk function.
  *   **Prep:** If asked, say: *"I'm not proposing a new formal theory tonight; I'm arguing for a pragmatic constraint on input parameters due to epistemic limits. I'm treating extreme probabilities as 'model error' rather than 'risk'."* (This leans into the epistemic humility pivot).

  ---

  ### Strategic Concessions (Say these voluntarily)

  1.  **Concede EUT Violation:** "I am not claiming this cap is consistent with standard Expected Utility Theory. I am claiming EUT is the wrong tool for this specific domain." (Disarms the decision theorist).
  2.  **Concede Longtermism Value:** "I am not arguing against longtermism. I am arguing against *fanaticism*. We can care about the future without chasing infinite lotteries." (Keeps the room on side).
  3.  **Concede Arbitrariness:** "The specific threshold is fuzzy. But 'fuzzy' is better than 'precisely wrong'." (Defuses the stats crowd).

  ### Final Recommendation
  If you can, shift the talk 20% toward **Epistemic Humility**.
  Argue that $P(Astral Value)$ isn't $10^{-6}$, it's **undefined** because the model required to calculate it hasn't been validated. Pascal's Mugging works because the mugger gives you a number. In reality, nobody can give you a number for the far future. If the probability is "unknown" rather than "small," the EV calculation collapses, and you don't need a "cap"—you just need to admit you can't do the math. This is much harder to money-pump.
