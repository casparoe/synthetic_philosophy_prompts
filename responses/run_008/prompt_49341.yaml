  1.  **Ask the Perfume case first.** It is the cleanest test between "Incapacity allows testimony" vs. "Aesthetics block testimony."
  2.  **If she says No to Perfume,** follow up with the **Wine/Corked case**. This will confirm whether her block is against *Aesthetics* specifically or *Perception* generally.
