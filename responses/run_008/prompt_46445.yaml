prompt: |-
  hi — i'm a phd student in philosophy of biology, and in a couple of weeks im giving a talk at a graduate conference on explanation in the biological sciences. the paper is on Dennett's cranes vs skyhooks distinction — good explanations build everything up from the ground (cranes), bad ones appeal to something outside the causal order that lowers the finished product in from above (skyhooks) — and instead of ending on the usual "thanks, questions?" slide i want to close with a poem. my supervisor thinks this is a terrible idea, which is honestly part of why im doing it.

  i have a slightly fussy spec. i'd like a sestina, and i want the form to do real work rather than just be decoration. the crane idea is that every structure gets assembled out of materials already lying around, with nothing winched in from outside the system — so the poem should enact that: everything on the page by the last full stanza should be built out of the six end-words planted in stanza one, recombined into new configurations. the envoi is the one legitimate break in the pattern, and i'd like it to be where the poem risks the charge Dennett actually cares most about — greedy reductionism, explaining so fast you skip the scaffolding — and then answers it in the last line.

  voice-wise, do whatever you think works. i toyed with having the poem spoken by the building process itself, which has no foresight and keeps being surprised by what it's ended up building, but you know better than me.

  standards: it should be philosophically right enough that the Dennett people in the room dont wince, and a good enough poem that the people whove never opened Darwin's Dangerous Idea still enjoy it on its own terms. and please write it in british english — the conference is in the UK and im trying to look credible. (the talk is 20 minutes so nothing sprawling, a standard sestina is fine.) apologies in advance for the typos in this message, im writing it on a train.
