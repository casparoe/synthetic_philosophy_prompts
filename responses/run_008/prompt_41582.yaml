answer: |-
  ### The Case: The Shared Microscope Schedule

  **The Scenario**
  You and a colleague, Dr. Bob, share a high-throughput microscope. You both need to book a 4-hour slot for your experiments. The available windows are **Morning (M)**, **Noon (N)**, and **Evening (E)**. 

  The payoffs represent "Efficiency Points," combining data quality and convenience. 
  *   **Morning/Evening:** High data quality, but only if you don't clash. If you both book the same extreme slot, you waste time negotiating, and payoffs drop.
  *   **Noon:** The "safe" slot. It's always available, but the equipment is warm and drift-prone, capping your maximum efficiency. 
  *   **The Catch:** You submit your bookings simultaneously. 

  **The Payoff Matrix**
  Rows are your strategies (Alice); Columns are Bob's. Payoffs are listed as (Alice, Bob).

  | | **Bob: Morning** | **Bob: Noon** | **Bob: Evening** |
  | :--- | :---: | :---: | :---: |
  | **Alice: Morning** | 10, 10 | 2, 4 | 11, 0 |
  | **Alice: Noon** | 4, 10 | 3, 11 | 4, 14 |
  | **Alice: Evening** | 2, 21 | 5, 18 | 10, 19 |

  ---

  ### Demonstration of Specifications

  Here is the step-by-step verification that this game meets your constraints.

  **1. Mundane Situation & Ordinary Goods**
  The scenario is a standard coordination problem in a lab setting. Payoffs are efficiency points (ordinary goods), not abstract utilities.

  **2. No Initial Pure-Strategy Dominance**
  Iterated Elimination of Strictly Dominated Strategies (IESDS) cannot begin using only pure strategies. Every strategy is a best response to something.

  *   **Alice:**
      *   *Morning vs. Evening:* Morning wins against Bob-Morning (10 > 2) but loses against Bob-Evening (11 < 10 is false, 11 > 10). Wait, Morning (11) > Evening (10) against Evening. Morning (2) < Evening (5) against Noon. **No dominance.**
      *   *Morning vs. Noon:* Morning wins against Morning (10 > 4) and Evening (11 > 4), but loses against Noon (2 < 3). **No dominance.**
      *   *Evening vs. Noon:* Evening wins against Noon (5 > 3) and Evening (10 > 4), but loses against Morning (2 < 4). **No dominance.**
  *   **Bob:**
      *   *Morning vs. Evening:* Morning wins against Alice-Morning (10 > 0) and Alice-Evening (21 > 19), but loses against Alice-Noon (10 < 14). **No dominance.**
      *   *Morning vs. Noon:* Morning wins against Morning (10 > 4) and Evening (21 > 18), but loses against Noon (10 < 11). **No dominance.**
      *   *Evening vs. Noon:* Evening wins against Noon (14 > 11) and Evening (19 > 18), but loses against Morning (0 < 4). **No dominance.**

  **3. Mixed Dominance Triggers Two Rounds of Elimination**
  Once we allow comparisons against mixtures (randomizations), the "Noon" strategy collapses for both players, which subsequently triggers a second round of pure dominance in the reduced game.

  *   **Round 1 (Mixed Dominance):**
      *   **Alice:** Compare **Noon** against a 50/50 mix of **Morning** and **Evening**.
          *   Against Bob-Morning: $0.5(10) + 0.5(2) = \mathbf{6}$. (Noon gets 4). **6 > 4.**
          *   Against Bob-Noon: $0.5(2) + 0.5(5) = \mathbf{3.5}$. (Noon gets 3). **3.5 > 3.**
          *   Against Bob-Evening: $0.5(11) + 0.5(10) = \mathbf{10.5}$. (Noon gets 4). **10.5 > 4.**
          *   *Result:* Alice's **Noon** is strictly dominated. Eliminate **Noon**.
      *   **Bob:** Compare **Noon** against a 50/50 mix of **Morning** and **Evening**.
          *   Against Alice-Morning: $0.5(10) + 0.5(0) = \mathbf{5}$. (Noon gets 4). **5 > 4.**
          *   Against Alice-Noon: $0.5(10) + 0.5(14) = \mathbf{12}$. (Noon gets 11). **12 > 11.**
          *   Against Alice-Evening: $0.5(21) + 0.5(19) = \mathbf{20}$. (Noon gets 18). **20 > 18.**
          *   *Result:* Bob's **Noon** is strictly dominated. Eliminate **Noon**.

  *   **Round 2 (Pure Dominance in Reduced Game):**
      *   The game is now reduced to Morning/Evening for both.
      *   **Alice:** Compare **Morning** vs. **Evening** (Bob only plays Morning or Evening).
          *   Against Bob-Morning: **10** > 2.
          *   Against Bob-Evening: **11** > 10.
          *   *Result:* **Morning** strictly dominates **Evening**. Eliminate **Evening**.
      *   **Bob:** Compare **Morning** vs. **Evening** (Alice only plays Morning or Evening).
          *   Against Alice-Morning: **10** > 0.
          *   Against Alice-Evening: **21** > 19.
          *   *Result:* **Morning** strictly dominates **Evening**. Eliminate **Evening**.

  **4. Unique Survivor**
  The only strategy profile surviving iterated elimination is **(Alice: Morning, Bob: Morning)** with payoffs **(10, 10)**.

  **5. Strict Dominance Only**
  Every inequality cited above is strict ($>$). There are no weak dominance relations. Therefore, the order of elimination does not matter; the result is robust.

  ---

  ### Analysis: What Feature Does the Work?

  The engine of this case is the **"Safe Middle" Trap**. 

  In many games, a "middle" strategy (like Noon) survives because it offers a secure floor against worst-case scenarios. However, this game is constructed so that the *average* of the extreme strategies (Morning/Evening) provides a higher floor *and* a higher ceiling than the middle strategy. 

  The specific feature doing the work is the **convexity of the payoff space relative to the middle strategy**. The "Noon" payoff vector $(4, 3, 4)$ for Alice lies strictly inside the convex hull of the "Morning" $(10, 2, 11)$ and "Evening" $(2, 5, 10)$ payoff vectors. Geometrically, the middle option is "surrounded" by the weighted average of the extremes. 

  **What happens if you remove this feature?**
  If you adjust one payoff so that pure dominance holds immediately (e.g., raise Alice's Morning-Noon payoff from 2 to 5), the "Noon" strategy would be purely dominated by "Morning" in Round 0. The lesson would vanish. Students would see a standard dominance solvable by simple comparison. The *necessity* of the mixture concept relies on the middle option being locally robust (beating Morning in one column, beating Evening in another) but globally fragile (losing to the hedge).

  ---

  ### Philosophical Stance: Is It Irrational?

  **Yes, it is genuinely irrational to play a strategy that fails mixed-dominance.**

  I take this side firmly. The student objection—that rationality shouldn't require "comfort with randomization"—confuses the *justification* for a choice with the *action* itself. 

  When we say "Noon is dominated by a mix of Morning and Evening," we are not commanding the agent to carry a coin to the lab. We are making a claim about the **value** of the strategy. If you prefer more efficiency points to fewer, and you accept the basic axioms of expected utility (which underpin rational choice theory), you *must* prefer the lottery $\sigma$ over the sure thing $s_{noon}$. 

  Why? Because $\sigma$ yields more points than $s_{noon}$ against *every possible state of the world* (every strategy Bob chooses). If you play Noon, you are effectively choosing a guaranteed lower expected return regardless of what your opponent does. To refuse this comparison is to refuse to maximize expected utility.

  **Confronting the Strongest Objection**
  *The Student's Objection:* "This presupposes Common Knowledge of Rationality (CKR) across rounds and a comfort with randomization no ordinary agent possesses."

  *The Response:* 
  1.  **On Randomization:** The agent does not need to randomize. The mixture is a *theoretical benchmark*. It proves that the strategy 'Noon' has lower value than the *option* to randomize. If I offer you a box containing \$100 (Noon) or a ticket that gives you a 50% chance at \$200 and 50% at \$50 (Mix), and the ticket costs nothing, rationality demands you take the ticket. The fact that you don't *have* to flip the coin to realize the value (you can just sell the ticket) doesn't change the valuation. In the game, recognizing the dominance allows you to discard Noon without flipping a coin.
  2.  **On CKR:** The first round of elimination (discarding Noon) does *not* require CKR. It only requires **individual rationality**. Alice doesn't need to know Bob is rational to see that Noon is worse than the Mix against *any* Bob strategy. She can discard Noon unilaterally. 
      *   However, the **second round** (discarding Evening) *does* require Alice to know Bob has discarded Noon. This requires Alice to believe Bob is rational. 
      *   If Alice doubts Bob's rationality, she should stop after Round 1. But if she stops there, she is left with Morning and Evening. Without Round 2, she cannot uniquely solve the game. 
      *   Therefore, if the goal is to identify the *unique* rational solution, CKR is required. But the irrationality of playing Noon stands even without CKR. Playing Noon is irrational *simpliciter*; playing Evening is irrational only if you know Bob is rational.

  ---

  ### Pedagogical Recommendation

  **Teach this as a demonstration of the POWER of iterated dominance.**

  Do not frame it as a limitation ("Look how much we have to assume to get a result"). Frame it as a refinement of rationality ("Look how much more precise our predictions become when we acknowledge that rational agents compare options against all feasible alternatives, including hedges").

  **Moral for the Answer Key:**
  > "Rationality requires consistency. If a randomized hedge outperforms a pure strategy in every contingency, the pure strategy is objectively inferior in expected value. Rejecting mixed dominance is not 'prudence'; it is a refusal to evaluate options based on their expected consequences. This case demonstrates that allowing mixed dominators sharpens our predictive power, turning a game with no clear solution into one with a unique rational outcome."

  Put this on the problem set. It forces them to do the arithmetic, and the arithmetic forces them to confront the fact that 'Noon' is mathematically inferior, regardless of their intuition about coin flips.
