answer: |-
  You promised your college roommate, Alex, you'd help him manage his life after a bad breakup. Five years later, Alex is physically safe but chronically irresponsible, requiring you to spend every weekend fixing his avoidable errors (overdrafts, landlord disputes, emotional crises) which prevents him from learning independence. You are now a senior engineer whose weekend overtime funds a malaria charity saving a life every month. Common-sense morality says abandoning a friend who relies on you is a betrayal of loyalty and the explicit promise to "see him through." Act consequentialism says the promise was instrumental to welfare, and now keeping it destroys more value than breaking it; you should donate the weekend pay and let Alex face consequences.

  **Act Consequentialism:** This view treats your promise as a tool for generating welfare, not an end in itself. Initially, helping Alex produced high utility (preventing homelessness). Now, the marginal utility of your weekend hours is low for Alex (avoiding late fees) but astronomically high elsewhere (saving lives). The "demand" here is only to maximize good; since your time is more valuable elsewhere, consequentialism releases you from the duty. It sets the baseline for demandingness at *opportunity cost*: you stop giving when your resource creates more value elsewhere than where it is currently committed.

  **Duty/Common-Sense Morality:** This view prioritizes agent-relative obligations. You made a commitment to a specific person, creating a special bond that overrides general welfare calculations. Loyalty requires sticking through hard times, especially when the other person is vulnerable. Abandoning Alex treats him as a means to an end (utility maximization) rather than a friend. The baseline for demandingness here is *fidelity to the rule*: you stop only when the promise is fulfilled. Since Alex never fully "recovers," the duty never terminates, demanding endless sacrifice of your weekends and career potential.

  **The Baseline Question:** As an engineer, your confusion about baselines is spot-on. Demandingness is always relative to a "prerogative baseline"—the amount of time/resources an agent is allowed to keep for their own projects before morality intervenes. Classic objections claim consequentialism sets this baseline too low (you keep nothing). This reverse case shows deontology can set it too low *in specific contexts* (you keep no weekends). The friction arises because deontology lacks a global "stop condition" based on efficiency, while consequentialism lacks a local "stop condition" based on relationship history.

  **Key Feature:** The single feature doing the work is **Endless Low-Yield Dependency**. The need is non-terminating (Alex doesn't learn), but the impact of meeting it is trivial compared to alternatives.

  **Counterfactual:** If you delete this feature—say, Alex's crises become life-or-death (High-Yield)—consequentialism agrees you must stay (saving a life beats donating money). If the promise was time-bound (Terminating)—"help for six months"—the duty view agrees you can leave after six months. The conflict only exists because the obligation is infinite but the good produced is diminishing.

  **Duty Defender's Reply:** A defender wouldn't just bite the bullet; they'd attack the consequentialist calculus. They'd argue that integrity and trust are public goods that can't be quantified in a single weekend's math. Breaking promises erodes your character and the social institution of promising, leading to long-term negative consequences (loss of trustworthiness) that outweigh the immediate lives saved. They'd claim you're miscalculating the utility of being a person who keeps their word.

  \answer{Endless Low-Yield Dependency}
