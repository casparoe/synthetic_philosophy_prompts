  I want a thought experiment that runs this in reverse. build me a realistic, ordinary-life case (family, work, a neighborhood -- no trolleys, no sci fi organ harvesting) where it's common-sense morality, or the duty/promise-respecting side of things, that turns out to be the unreasonably demanding one, and act consequentialism that lets the agent off. specifics:

  - the demandingness has to be the same *kind* as the classic objection: open-ended and unending, the kind where you can never point to a moment you're done. not just a big one-time cost.
  - the consequentialist verdict must not come from the agent being lazy or the stakes being trivial -- the welfare math has to genuinely favor walking away, and the person who walks should be doing real good elsewhere.
  - the duty-side verdict shouldn't come from a weird or obviously bad obligation either; it should fall out of something people actually endorse, like keeping a promise or loyalty to a person who keeps needing you.
  - scenario itself should be one paragraph, then walk through it: what act consequentialism says and why, what the duty-respecting view says and why, which single feature of the case is doing all the work, what happens to the case if you delete that feature, and finally how a defender of the duty view would attack the case rather than just bite the bullet.

