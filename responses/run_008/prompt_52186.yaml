answer: |-
  Good evening.

  Fifty years. Half a century. In the life of a human being, it is a long arc. In the life of an institution, it is a miracle. And in the life of an idea, it is a test.

  We are gathered here to celebrate the Cooperative, but we are also gathered to celebrate a specific stubbornness. The stubbornness of the woman who founded this room. My mentor. She ran this organization for forty years, and she ran it on a fuel that many told her was obsolete before she even started burning it. She operated on an unrepentant Du Boisian principle.

  She read W.E.B. Du Bois's 1926 essay, "The Criteria of Negro Art," the way some people read scripture. She held to his assertion that "all Art is propaganda and ever must be." She believed that the artist who claims to have escaped that condition has merely been conscripted into someone else's.

  I know that for some of you, particularly those whose work is being honored tonight, that language feels heavy. "Propaganda." It sounds like pamphlets. It sounds like instruction. It sounds like the subordination of the beautiful to the useful.

  But to honor her, we must not turn her conviction into a strawman. She did not believe in bad art made for a good cause. Du Bois did not believe in bad art. When he said all art is propaganda, he was not saying, "Make your characters mouthpieces." He was saying something far more unsettling about the world we live in. He was arguing that in a society structured by race, there is no neutral ground. There is no vacuum in which a Black image exists.

  The strongest form of her argument—and it is one I ask you to sit with tonight—is not that you *ought* to teach a lesson. It is that the audience *will* learn one, whether you intend it or not. When a Black body moves across a screen, it does not move through empty space. It moves through a history of how Black bodies have been allowed to move. A white audience brings a set of assumptions about danger, about virtue, about intellect. A Black audience brings a set of hopes about survival, about dignity, about recognition.

  Du Bois understood that you cannot separate the aesthetic from the social because the reception of the art is already socialized. To claim "apolitical" art is to claim that you can control how your work is read. Her view was that you cannot. The only choice is whether you surrender that meaning to the prevailing winds of the market and the status quo, or whether you seize the pen and write the meaning yourself.

  That is where the weight of her legacy presses hardest on the work we celebrate tonight.

  I look at the program for this evening. I see genre films. I see intimate character studies that refuse to explain their characters' trauma to the viewer. I see formal experiments that prioritize texture over narrative. I see commercial ventures that aim simply to entertain.

  To the older generation in this room, the founders and the early members, some of this work looks like a retreat. You chose your subjects for their political weight. You documented the struggle. You centered the movement. You believed that visibility was a shield. When you look at a horror movie made by a member of the third generation, you might ask: Where is the message? Is this not a distraction? Is this not the conscription she warned us about?

  It is a fair question. It is the question this Cooperative was built to ask.

  But to the younger filmmakers in this room, I say this: You cannot answer that question by saying, "It's just a movie." That is an evasion. You know that when your film hits the streaming landscape, it will be categorized as "Black content." You know that your success will be used as data points about what Black audiences "want." You know that your formal adventures will be read through the lens of identity, whether you invite that reading or not.

  However, I believe you have a real answer. It is not an evasion. It is an evolution.

  Your answer is that truth is not singular. The previous generation fought for the right to be seen as human. This generation is exercising the right to be seen as complicated.

  Du Bois wrote that the duty of the Black artist is to find "Truth" and "Beauty." Sometimes, the truth is that we are tired. Sometimes the truth is that we want to laugh without a lesson. Sometimes the truth is that we are interested in the abstract, the surreal, the profitable.

  By refusing to make "protest art" in the traditional sense, you are not escaping politics. You are making a political claim about the breadth of Black interiority. You are asserting that a Black story about a ghost, or a romance, or a heist, is not a deviation from the race; it is a part of it.

  Furthermore, your formalism is its own propaganda. To demand that a Black film be difficult, to demand that it not explain itself, to demand that it prioritize the aesthetic experience over the sociological one—that is a radical act in a world that often treats Black suffering as the only consumable Black truth. When you prioritize beauty, when you prioritize craft, you are rejecting the idea that our value lies only in our pain.

  So, the tension in this room is not a failure. It is the engine.

  The older generation reminds the younger that the world is still dangerous, that the context is still rigged, that ignoring the propaganda of the status quo is a luxury we may not have. The younger generation reminds the older that we are not merely soldiers in a culture war, that we are artists, that joy is not a betrayal of struggle.

  My mentor would have argued with many of you tonight. She would have challenged the commercial choices. She would have questioned the silence on certain issues. But she would have recognized the fire. She knew that the Cooperative was not a museum for a specific style of filmmaking. It was a fortress to protect the right of Black artists to define their own reality.

  If Du Bois was right that all art is propaganda, then the most dangerous propaganda of all is the lie that there is only one way to be Black. The work in this room tonight, in all its friction and disagreement, proves that lie false.

  We are not here to resolve the tension between art and duty. We are here to sustain it. Because as long as this tension exists, the work is alive. As long as we are arguing about what our images mean, we retain ownership of them.

  So, I ask you to look at the person sitting next to you. Whether you think their work is too didactic or too frivolous, recognize that you are on the same side of the only divide that matters: the side of those who believe Black stories are worth telling, worth funding, and worth arguing over.

  Please, raise your glasses.

  To the founder, who taught us that there is no neutral ground.
  To the new generation, who are mapping the terrain of that ground anew.
  To the friction that keeps us honest.
  And to the work—always the work.

  Cheers.
