      *   *Refinement:* Focus on the *closed world assumption* (CWA) vs. *open world*. DBs live in CWA. AI/Philosophy lives in Open World. This is the key distortion.

  5.  **Addressing the Three Variants:**

      *   **1. Narrow Persistence (Things staying the same):**
          *   *DB Mapping:* Incremental View Maintenance (IVM). If $UPDATE \ R$, which $V_i$ need patching?
          *   *Distortion:* DBs assume static schema. Dependencies are explicit (foreign keys, view definitions). AI assumes implicit, potentially unknown dependencies.
          *   *Residue:* In DBs, "nothing else changed" is enforced by the transaction isolation and the fact that nothing *can* change unless there's a pointer to it. In AI, causal links might be hidden.

      *   **2. Qualification (Preconditions):**
