  2.  **Deconstruct the Frame Problem (Philosophy/AI side):**
      *   *Origin:* McCarthy & Hayes (1969). Representing change in logic.
      *   *Narrow Frame Problem:* How to represent that *most* things don't change when an action occurs without writing infinite frame axioms ($P(s) \land Action \implies P(Result(s))$).
      *   *Qualification Problem:* Actions have infinite preconditions (e.g., potato in tailpipe prevents car starting).
      *   *Relevance Problem:* (Often attributed to Dennett/Fodor). How does an agent know *which* facts are relevant to a decision without checking everything?
      *   *Philosophical Core:* It's about *ontology* and *epistemology* in open worlds, not just efficient computation. It's about *meaning* and *causality*, not just dependency graphs.

  3.  **Translate to Database Vocabulary:**
      *   *State:* Database instance (snapshot).
      *   *Action:* Transaction / Update statement.
      *   *Beliefs/Facts:* Tuples in base relations and materialized views.
      *   *Frame Axioms:* Dependency graphs / Schema constraints / Trigger definitions.
      *   *Narrow Problem:* Incremental View Maintenance (IVM). Avoiding full recomputation.
      *   *Qualification Problem:* Integrity Constraints (ICs) and Trigger Conditions.
      *   *Relevance Problem:* Index selection / Materialized View selection / Query Optimization (which paths to explore).

  4.  **Drafting the Translation (Iterative Process):**

      *   *Attempt 1 (Mental):* The frame problem is like updating a view. If I change table A, I don't want to scan table B. DBs solve this with dependency tracking.
