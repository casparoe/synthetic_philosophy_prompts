answer: |-
  This is a sharp intuition. You have correctly identified that the "Narrow Frame Problem" looks suspiciously like the problem of **Incremental View Maintenance (IVM)** under a Closed World Assumption.

  However, the reason philosophers and AI researchers still talk about the Frame Problem while database researchers do not is not because you solved the *logic* of change better than they did. It is because your domain allows you to **offload the ontological burden** to the schema designer. You solve the computational cost of updating beliefs; they are stuck with the epistemological cost of defining which beliefs *exist* and how they *connect*.

  Here is the restatement of the Frame Problem in your vocabulary, followed by the residue report.

  ---

  ### Part 1: The Frame Problem in Database Vocabulary

  **The Setup:**
  Imagine a database instance $D$ representing the agent's belief state. The base relations are sensory inputs or primitive facts. The materialized views are derived beliefs. A transaction $T$ is an action.

  **The Naive Algorithm (The "Frame Axiom" Blowup):**
  When $T$ commits a write to base relation $R$, the system must ensure the belief state remains consistent.
  *   *Philosophical/AI version:* For every fluent $F$ (predicate), assert $F(s) \iff F(Result(T, s))$ unless an axiom says $T$ changes $F$.
  *   *Database analogue:* Upon update to $R$, scan every materialized view $V_1 \dots V_n$ in the schema. Recompute each $V_i$ from scratch against the new $D$. If $V_i$ changes, propagate that change to dependent views.
  *   *The Problem:* This is $O(N)$ where $N$ is the total size of the knowledge base. It is computationally intractable for a real-time agent.

  **The "Solved" Engineering Approach (Dependency Analysis):**
  *   *Philosophical/AI version:* Use situation calculus or event calculus to logically derive that only specific fluents change.
  *   *Database analogue:* Maintain a static **Dependency Graph** (schema metadata).
      1.  **Static Analysis:** At registration time (CREATE VIEW), analyze the query plan. Determine which base relations $R_{base}$ map to view $V_{derived}$.
      2.  **Invalidation/Patching:** When $T$ writes to $R$, traverse the dependency graph. Only touch $V$ if $R \in Dependencies(V)$.
      3.  **Incremental Maintenance:** Apply a delta ($\Delta$) to $V$ rather than recomputing $V$. $\Delta V = f(V, \Delta R)$.
      4.  **Isolation:** Assume that if $R$ is not in the dependency graph of $V$, $V$ is logically unaffected. This is your "Nothing Else Changed" axiom, enforced by the schema.

  ---

  ### Part 2: The Residue Report

  Here is the mapping of the three specific variants you identified, analyzing where the translation holds and where it breaks.

  #### 1. The Narrow Persistence Problem
  *   **The Philosophical Worry:** How do I represent that the wall color didn't change when I picked up the block, without writing an axiom for every object in the universe?
  *   **DB Vocabulary:** **Dependency Graph Pruning.**
      *   *Mapping:* The schema defines the dependency graph. If `Inventory` updates, and `CustomerAddresses` is a view that does not join or select from `Inventory`, the optimizer proves statically that `CustomerAddresses` is invariant.
      *   *Distortion:* In DBs, dependencies are **explicit and syntactic** (defined by SQL queries). In the philosophical problem, dependencies are **implicit and semantic** (defined by physics/causality).
      *   *Residue (What's Missing):* **Implicit Side Effects.** In a DB, if I update `Inventory`, I know `SalesSummary` might change because the view definition says `SUM(Inventory)`. In the real world, picking up a block might change the `ShadowPosition`, but unless the agent has a "view" defined over shadows, it won't track it. The DB assumes the schema captures all relevant causal pathways. The Frame Problem arises precisely because we *cannot* know all causal pathways in advance.
      *   *Verdict:* **Solved by Assumption.** You solved this by assuming the schema is a complete causal model.

  #### 2. The Qualification Problem
  *   **The Philosophical Worry:** To start a car, I need a key. But also no potato in the tailpipe. But also gravity must exist. But also the engine isn't disassembled. I cannot list all preconditions.
  *   **DB Vocabulary:** **Trigger Conditions and Integrity Constraints (ICs).**
      *   *Mapping:* A transaction $T$ is allowed to commit only if all `CHECK` constraints and Trigger `WHEN` clauses evaluate to true.
      *   *Distortion:* DBs treat constraints as **hard boundaries**. If a constraint is violated, the transaction aborts. The Qualification Problem is about **default reasoning**: we assume the car starts *unless* we know of an exception. DBs don't do defaults; they do enforcement.
      *   *Residue (What's Missing):* **Unknown Exceptions.** You can define a trigger `ON Insert CarStart CHECK (TailpipeClear)`. But you cannot define a trigger for `CHECK (NoMeteorStrike)` because that predicate isn't in your schema. The Qualification Problem is the realization that the set of relevant constraints is open-ended.
      *   *Verdict:* **Offloaded to Schema Design.** Your system handles known exceptions perfectly. It has no mechanism for "unknown unknowns" other than transaction abort (failure), whereas the agent needs to reason about the *probability* of unknown exceptions.

  #### 3. The Relevance Problem (Dennett's Variant)
  *   **The Philosophical Worry:** An agent has unbounded sensory data and unbounded memory. When acting, how does it select *which* facts to consider without checking everything? (e.g., Should I check the price of tea in China before pulling the trigger?)
  *   **DB Vocabulary:** **View Selection and Index Tuning under Uncertain Workload.**
      *   *Mapping:* You have limited storage (memory) and CPU. You must decide which views to materialize (which facts to keep "hot") and which indexes to build (which access paths to optimize).
      *   *Distortion:* DBs optimize against a **known or profiled workload** (query log). The Relevance Problem is about optimizing against an **unknown future** in an open environment.
      *   *Residue (What's Missing):* **Semantic Grounding.** In a DB, "relevance" is defined by the presence of a query. If no query ever touches `Table_X`, `Table_X` is irrelevant. In AI, the agent must decide *what queries to ask itself*. The DB assumes the application layer (the user) provides the relevance signal (the SQL). The philosophical problem is: who tells the agent what query to run?
      *   *Verdict:* **Architectural Boundary.** This is the hardest map. Your field treats relevance as an input parameter (the workload). AI treats relevance as an internal state to be optimized.

  ---

  ### Part 3: The Boundary Analysis (Solved Engineering vs. Unsolved Philosophy)

  You asked whether the split tracks a real boundary or is an artifact of formalization.

  **It is an artifact of the Closed World Assumption (CWA).**

  1.  **The Real Boundary:**
      *   **Database Systems:** Operate under CWA. The universe of discourse is exactly what is in the tables. Dependencies are exactly what is in the schema. Relevance is exactly what is in the query log.
      *   **Philosophy/AGI:** Operates under Open World Assumption (OWA). The universe is larger than the representation. Dependencies are discovered, not declared. Relevance is inferred, not submitted.

  2.  **Why it looks "Solved" in DBs:**
      You solved the **Computational Frame Problem** (how to update efficiently given a model).
      You did *not* solve the **Representational Frame Problem** (how to build the model such that it captures the right dependencies).

      When you say, *"dependencies between base data and derived data are analyzable up front,"* you are making a metaphysical claim: *The schema captures the causal structure of the domain.*
      *   In an ERP system, this is true (by fiat of the business process).
      *   In a robot navigating a house, this is false (the schema cannot anticipate every physical interaction).

  3.  **The "Defect" in Your Vocabulary:**
      Your vocabulary lacks **Non-Monotonicity** and **Default Logic**.
      *   In DBs, if $A \to B$ and I add $C$, $A \to B$ still holds.
      *   In the Frame Problem, adding a new fact (e.g., "There is a potato in the tailpipe") can invalidate a previous derivation ("The car will start") without changing the original premises ("Key is turned").
      *   Your `TRIGGER` system is monotonic: adding a trigger adds a constraint. It doesn't typically allow you to say "This rule holds *unless* something weird happens, and I don't know what 'weird' is yet."

  ### Conclusion

  The Frame Problem was never a well-defined *technical* problem in the sense of algorithmic complexity. It was a **modeling** problem.

  *   **Your field's success:** You formalized the *propagation of change* within a fixed ontology. You turned the Frame Problem into a graph traversal problem.
  *   **Philosophy's residue:** The problem of *constructing the ontology* such that the graph traversal yields truth rather than just consistency.

  The split between "solved engineering" and "unsolved philosophy" tracks the boundary between **manipulating symbols** (which you do perfectly) and **grounding symbols** (which no one knows how to do). You assume the mapping from `UPDATE Inventory` to "World State Change" is faithful. The Frame Problem is the suspicion that for an intelligent agent, that mapping can never be fully faithful because the world is richer than any schema.

  **Summary for your mental model:**
  *   **Narrow Frame Problem** $\approx$ **Incremental View Maintenance**. (Solved in DBs via static analysis).
  *   **Qualification Problem** $\approx$ **Incomplete Integrity Constraints**. (Solved in DBs by aborting on violation; Unsolved in AI because we can't list all constraints).
  *   **Relevance Problem** $\approx$ **View Selection without a Workload**. (Solved in DBs by assuming a DBA exists; Unsolved in AI because the agent must be its own DBA).

  You haven't solved the Frame Problem; you have **bounded** it so tightly that it disappears. The philosophical worry is exactly about the cases where you cannot draw that boundary.
