prompt: |-
  hey so I'm a junior and somehow I'm now the science editor of our school paper (the previous senior graduated and nobody else wanted it lol). the problem is we keep getting into trouble with how we word science stuff. last year we ran a headline saying scientists proved phone use causes depression and my chem teacher emailed the advisor complaining that nothing in science is ever "proven," and then a month later we were too chicken to say anything confident about the JWST finding stuff in an exoplanet's atmosphere, so our article was so hedged it said basically nothing.

  I asked my teacher about this and she went on this whole tangent about scientific realism vs something called the pessimistic meta-induction? like the argument that tons of past theories were super empirically successful (predicted stuff, built working tech on them) and then turned out to be straight up FALSE anyway — phlogiston, caloric, the ether, that whole crew — so maybe our current successful theories are just the next batch waiting to be embarrassed. but the realists have comebacks too apparently. anyway it made me realize me and my writers have no actual system, we just vibe-check each headline.

  so what I want is: a real procedure my writers (all teenagers, zero philosophy background, deadline is like 48 hours from getting the press release) can actually run when deciding how strong a claim about a new finding is allowed to be. like a checklist of questions in order, with concrete rules for what words we're allowed to use at each level — "proven," "discovered," "evidence suggests," "scientists report," etc. — and where the procedure has to just give up and hand it to me because it's a judgment call not a rule. build in whatever actually matters from the realism/pessimistic meta-induction debate (success vs truth, whether a theory's success should make us believe it, selective confirmation, that whole thing) but translated so a 15 year old on four hours of sleep can use it at 10pm before print night.

  then run it on three real-ish scenarios: (1) a small physics experiment claiming evidence for a new fifth force that contradicts the standard model, (2) a big 40-person study claiming a supplement improves memory, and (3) plate tectonics, which is old and settled but was once the fringe theory everyone mocked. I want to see if the procedure can handle both new flashy claims and old ones, and whether it treats them differently.

  also please be honest at the end: say how confident you are that the procedure actually captures the philosophy instead of a caricature of it, and point out the single step you're least sure about, like the one most likely to misfire in practice. don't just say "it depends on context," actually commit. ty!!
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** High school junior, new science editor of school paper. Smart, aware of the nuance (knows about "proven" vs. "evidence," knows about scientific realism vs. pessimistic meta-induction), but needs practical tools for a team of tired teenagers.
      *   **Problem:** Inconsistent wording (too strong -> "proven," too weak -> "hedged into nothingness"). No systematic approach.
      *   **Goal:** A concrete, step-by-step procedure/checklist for writers to determine claim strength/language. Must incorporate philosophical nuance (realism/PMI) but be accessible. Must include an escalation path to the editor.
      *   **Task:** Create the procedure, test it on three scenarios (New Physics, Supplement Study, Plate Tectonics), and provide an honest self-assessment of the procedure's philosophical fidelity and weakest link.
      *   **Tone:** Respectful, practical, slightly informal (matching the user's vibe), but rigorous enough to satisfy the intellectual curiosity.

  2.  **Deconstruct the Philosophy (for the Procedure):**
      *   *Scientific Realism:* Successful theories are likely (approximately) true. We can talk about "discoveries."
      *   *Pessimistic Meta-Induction (PMI):* Past successful theories were false. Current ones might be too. Be careful with "truth" claims.
      *   *Constructive Empiricism (van Fraassen):* Aim for empirical adequacy (saving the phenomena), not truth.
      *   *Synthesis for Journalism:* We can't say "Truth," but we can say "Robust Consensus" or "High Confidence." We need to distinguish between *observational claims* (we saw X) and *theoretical claims* (X means Y theory is true).
      *   *Key Distinction:* Observation vs. Interpretation. Replication vs. One-off. Consensus vs. Fringe.

  3.  **Drafting the Procedure (The "Science Claim Strength Matrix"):**
      *   Needs to be a flowchart or checklist. Let's go with a numbered checklist that assigns a "Confidence Level."
      *   *Step 1: Source Check.* Is it a preprint? Peer-reviewed? Press release?
      *   *Step 2: Consensus Check.* Is this one team or the whole field?
      *   *Step 3: Methodology Check.* Sample size? Controls? Replication?
      *   *Step 4: Claim Type.* Observation (we saw light) vs. Explanation (this light means dark matter).
      *   *Step 5: Language Assignment.* Map the score to specific verbs/adjectives.
      *   *Escalation:* If the score is ambiguous or high-stakes, editor decides.

  4.  **Refining the Language Rules:**
      *   *Banned:* "Proven," "Truth," "Fact" (in theoretical contexts).
      *   *High Confidence:* "Confirms," "Established," "Consensus."
      *   *Medium Confidence:* "Suggests," "Indicates," "Supports."
      *   *Low Confidence:* "Claims," "Proposes," "Preliminary."

  5.  **Developing the Scenarios:**
      *   *Scenario 1 (Fifth Force):* High novelty, low consensus, high theoretical stakes. Needs cautious language.
      *   *Scenario 2 (Supplement):* Medium novelty, potential bias, specific scope. Needs methodological scrutiny.
      *   *Scenario 3 (Plate Tectonics):* High consensus, historical context. Can use stronger language but acknowledge history (PMI check).

  6.  **Writing the Self-Assessment:**
      *   Must be honest. Am I caricaturing philosophy? Yes, inevitably.
      *   What's the weakest step? Probably the "Consensus" step. Consensus can be wrong (groupthink), but for journalism, it's the best proxy for reliability. Or maybe the distinction between Observation and Theory. Let's pick the "Consensus vs. Truth" mapping as the risky part.

  7.  **Drafting the Content (Iterative refinement):**

      *   *Intro:* Acknowledge the difficulty. Validate their teacher's point.
      *   *The Protocol:* Call it the "S.C.O.P.E. Protocol" (Source, Consensus, Observation, Peer Review, Escalation). No, that's too acronym-y. Let's just call it the "Claim Strength Protocol."
      *   *Philosophy Integration:* Explicitly mention how PMI informs the "Theory vs. Observation" step. Realism informs the "Consensus" step.
      *   *Scenarios:* Walk through the steps for each.
      *   *Critique:* Be sharp.

      *(Self-Correction during drafting)*: Make sure the language rules are very specific. Teenagers need "Use Word X, Not Word Y."
      *(Self-Correction on Philosophy)*: Don't get bogged down in defining PMI in the text, just use its logic (past success $\neq$ current truth).
      *(Self-Correction on Escalation)*: Define clearly when the editor gets involved.

  8.  **Final Review against Constraints:**
      *   Checklist of questions in order? Yes.
      *   Concrete rules for words? Yes.
      *   Escalation path? Yes.
      *   Philosophy translated? Yes.
      *   Three scenarios run? Yes.
      *   Honest confidence assessment at end? Yes.
      *   Commit to a weakest step? Yes.

  9.  **Final Polish:** Ensure tone is supportive but authoritative. (Proceed to generate output).

  *(Wait, one more thought on the "Weakest Step")*: The trickiest part is distinguishing between a *measurement* and an *interpretation*. In the Fifth Force scenario, "we measured an anomaly" is safe. "This anomaly is a fifth force" is the risky interpretation. This is the core of the PMI argument (the data stays, the theory changes). I should highlight this in the critique.

  *(Wait, one more thought on Confidence)*: I should rate my confidence. Maybe 85%? It's a pragmatic adaptation, not a pure philosophical treatise.

  Okay, ready to write.s
answer: |-
  This is a fantastic problem to have. It means you care about accuracy, and your teacher cares about epistemology. The tension you're feeling—between "saying something" and "saying something true"—is literally the central tension of the philosophy of science.

  The **Pessimistic Meta-Induction (PMI)** argues that because past successful theories (Newtonian physics, Phlogiston) turned out to be false, current successful theories are probably false too. **Scientific Realism** argues that success is a marker of truth, so we should believe our best theories are *approximately* true.

  For a high school paper, you cannot solve this debate. But you can build a protocol that respects the PMI (by avoiding "truth" claims about theories) while respecting Realism (by acknowledging when consensus is robust enough to act like truth).

  Here is the **Claim Strength Protocol (CSP)**. It is designed for a tired writer at 10 PM.

  ---

  ### The Claim Strength Protocol (CSP)

  **Instructions:** Answer these 4 questions in order. Tally your "Risk Points." Use the Language Table at the bottom to write your headline and lede. If you hit a **STOP**, email the Editor (you).

  #### Step 1: The Source Check (Max 3 Points)
  *Where is this coming from?*
  *   **0 Points:** Peer-reviewed journal (Nature, Science, PLOS, etc.) + Independent replication exists.
  *   **1 Point:** Peer-reviewed journal, single study, no replication yet.
  *   **2 Points:** Pre-print server (arXiv, bioRxiv) or conference presentation only.
  *   **3 Points:** Press release only, no paper linked, or corporate-funded study without independent review.
      *   **STOP:** If 3 Points. Hand to Editor.

  #### Step 2: The Consensus Check (Max 3 Points)
  *Who agrees with this?*
  *   **0 Points:** Textbook science / Field-wide consensus (e.g., gravity, germs, plate tectonics).
  *   **1 Point:** Majority of specialists agree, but some active debate remains.
  *   **2 Points:** Fringe theory / Contradicts established paradigm (e.g., breaks Standard Model).
  *   **3 Points:** Single team claims breakthrough that contradicts everyone else.
      *   **STOP:** If 3 Points. Hand to Editor.

  #### Step 3: The Observation vs. Theory Check (The PMI Filter)
  *What exactly did they do?*
  *   **Option A (Observation):** They measured a number, saw a signal, or recorded a phenomenon. (e.g., "The telescope detected carbon.")
  *   **Option B (Theory):** They explain *why* the number/signal is there. (e.g., "The carbon means life exists.")
      *   **Rule:** If Option B, add **+2 Risk Points**.
      *   **Why:** PMI says observations usually stick, but explanations get tossed. Never treat an explanation as solid as a measurement.

  #### Step 4: The Stakes Check
  *Does this change everyday life or fundamental reality?*
  *   **Low Stakes:** Specific chemical property, minor biological mechanism. (No points)
  *   **High Stakes:** Health advice, fundamental physics, climate models. (+1 Risk Point)
      *   **Why:** High stakes require higher burden of proof to avoid misinformation.

  ---

  ### The Language Table

  **Total Risk Points: 0–2 (Green Zone)**
  *   **Status:** Solid Science.
  *   **Allowed Verbs:** *Confirms, Establishes, Demonstrates, Shows.*
  *   **Allowed Nouns:** *Fact, Mechanism, Consensus.*
  *   **Example:** "Study **confirms** link between sleep and memory."

  **Total Risk Points: 3–5 (Yellow Zone)**
  *   **Status:** Emerging / Debated.
  *   **Allowed Verbs:** *Suggests, Indicates, Supports, Proposes.*
  *   **Allowed Nouns:** *Evidence, Findings, Correlation.*
  *   **Banned Words:** *Proves, Truth, Cause (unless randomized trial).*
  *   **Example:** "New data **suggests** supplement **may improve** recall."

  **Total Risk Points: 6+ (Red Zone)**
  *   **Status:** Speculative / Controversial.
  *   **Allowed Verbs:** *Claims, Reports, Hypothesizes.*
  *   **Required Context:** Must mention "preliminary," "unverified," or "contradicts previous models."
  *   **Example:** "Researchers **claim** anomaly **could indicate** fifth force."
  *   **STOP:** If you hit 7+ points, you must email the Editor. Do not write the headline yet.

  ---

  ### Running the Scenarios

  Here is how the CSP handles your three test cases.

  #### Scenario 1: The "Fifth Force" Physics Experiment
  *   **Context:** A small lab claims a particle deviation that breaks the Standard Model.
  *   **Step 1 (Source):** Peer-reviewed, but no replication yet. (**1 Point**)
  *   **Step 2 (Consensus):** Contradicts Standard Model; most physicists skeptical. (**2 Points**)
  *   **Step 3 (Obs vs. Theory):** They measured a deviation (Obs), but claim it's a "Fifth Force" (Theory). (**+2 Points**)
  *   **Step 4 (Stakes):** Fundamental physics. (**+1 Point**)
  *   **Total:** 6 Points (Red Zone).
  *   **Result:** Headline must use "Claim" or "Report." Cannot say "Discovered Fifth Force."
  *   **Verdict:** **Passes.** It stops the paper from making a massive claim that will likely be retracted in six months. It respects PMI: The measurement might be real, the "Force" theory might be phlogiston.

  #### Scenario 2: The 40-Person Supplement Study
  *   **Context:** 40 people took a pill; memory scores went up.
  *   **Step 1 (Source):** Peer-reviewed journal. (**0 Points**)
  *   **Step 2 (Consensus):** Nutrition science is messy; likely debate. (**1 Point**)
  *   **Step 3 (Obs vs. Theory):** Measured scores (Obs), claim pill *caused* improvement (Theory/Causality). (**+2 Points**)
  *   **Step 4 (Stakes):** Health advice. (**+1 Point**)
  *   **Total:** 4 Points (Yellow Zone).
  *   **Result:** Headline: "Study **Suggests** Supplement **Linked to** Memory Boost."
  *   **Verdict:** **Passes.** It avoids the "Cause/Proven" trap your chem teacher hated, but doesn't hedge so much that it says nothing. It acknowledges the small sample size implicitly through the weaker verbs.

  #### Scenario 3: Plate Tectonics (Settled Science)
  *   **Context:** Article about how continents move.
  *   **Step 1 (Source):** Textbook/Decades of replication. (**0 Points**)
  *   **Step 2 (Consensus):** Field-wide consensus. (**0 Points**)
  *   **Step 3 (Obs vs. Theory):** GPS measurements + Geological record. The theory explains the data perfectly. (**0 Points** — *Editor Override: Mature theories graduate from 'Theory' to 'Fact' in journalism.*)
  *   **Step 4 (Stakes):** Low (in this context). (**0 Points**)
  *   **Total:** 0 Points (Green Zone).
  *   **Result:** Headline: "Plate Tectonics **Drive** Volcanic Activity."
  *   **Verdict:** **Passes.** This tests if the system is *too* skeptical. Because the consensus is total and the predictive success is absolute, the CSP allows strong language. It acknowledges Realism: At some point, success *does* warrant belief.

  ---

  ### Honest Self-Assessment

  **Confidence Level:** 85%
  This protocol captures the *functional* utility of the philosophy without requiring your writers to read Kant or Kuhn. It successfully translates the PMI warning (don't trust explanations as much as observations) into a point system. It prevents the "Proven" error while allowing you to report on settled science without sounding agnostic about gravity.

  **The Weakest Link (Most Likely to Misfire):**
  **Step 3: The Observation vs. Theory Check.**

  **Why:** In practice, it is incredibly difficult for a 15-year-old (or even a seasoned reporter) to cleanly separate "Observation" from "Theory."
  *   *Example:* In the Fifth Force scenario, is the "deviation" an observation? Or is the calibration of the machine based on a theory? If the machine is calibrated using the Standard Model, can it truly "observe" a break in the Standard Model?
  *   *Risk:* Writers might mark something as "Observation" (0 points) when it is actually "Theory-Laden Observation" (should be +2 points). This is the deepest trap in philosophy of science (theory-ladenness of observation), and this checklist inevitably oversimplifies it.
  *   *Mitigation:* This is why the **Editor Escalation** exists. If a writer is unsure if something is a raw measurement or an interpretation, they must ask you.

  **Final Advice:**
  Print this out. Tape it to the wall. Tell your writers: *"If you aren't sure if it's an Observation or a Theory, assume it's a Theory and add the points."* It's better to be slightly boring than to be famously wrong.
