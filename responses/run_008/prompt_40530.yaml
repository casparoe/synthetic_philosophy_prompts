answer: |-
  This is a classic problem in the philosophy of history, often lurking behind the distinction between *Verstehen* (understanding) and *Erklären* (explaining), but your specific list suggests the issue is more about **causal ontology** than hermeneutics. You are asking for a demarcation criterion between *historical explanation* and *historical storytelling*.

  I am going to approach this as a philosopher of science who leans toward an **interventionist** or **manipulability** account of causation (similar to James Woodward), adapted for the singular, non-experimental nature of history.

  ### Part 1: Brainstorming the Pattern

  Let's look at your "Bad" cases first. What do Sarajevo, Decadence, Hubris, and the Unsinkable Belief have in common?

  1.  **Sarajevo (The Fragile Trigger):** This fails because it lacks **modal stability**. If we "rewind" history and remove the assassin but keep the alliance system, the war likely still happens. The assassination is a *trigger*, not a *cause* in the deep sense. It is a fragile point in the causal chain.
  2.  **Decadence & Hubris (The Circular Redescription):** These fail because of **outcome dependence**. How do we know Rome was "decadent"? Because it fell. How do we know Hitler was "hubristic"? Because he lost. If Rome had survived, would they have been "vigorous"? If Hitler had won, would it have been "boldness"? These aren't independent variables; they are moral labels applied to the outcome itself. They explain nothing; they just rename the failure.
  3.  **Unsinkable Belief (The Broken Chain):** This is the most subtle "Bad" case. The belief existed. It was causally relevant. But it is **mechanistically distal**. The belief didn't sink the ship; the belief caused the *speed*, and the *speed* sank the ship. Citing the belief without the speed leaves a gap in the mechanism. It's a "spooky" cause that skips the physics.

  Now the "Good" cases: Alliances, Nuclear Deterrence, Industrial Capacity, Speed.

  1.  **Alliances & Industry (Structural Constraints):** These are **outcome-independent**. We can measure steel production or count treaty obligations regardless of who won the war. They exert pressure across many possible scenarios (high modal strength).
  2.  **Nuclear Deterrence (The Non-Event):** This is tricky, but it passes because the *mechanism* (mutual assured destruction) is physically and strategically definable independent of the peace. It explains why the *alternative* (war) was suppressed.
  3.  **Speed (Proximate Mechanism):** This completes the physical chain.

  **The Structural Symmetry Problem:**
  You noted that Cold War (Good) and Hitler's Hubris (Bad) look identical (one big factor explaining a huge outcome). The difference is **identifiability**. We can identify the existence of nuclear warheads and game-theoretic incentives without knowing the Cold War stayed cold. We cannot identify "hubris" without knowing Hitler lost. One is a variable; the other is a label for the residual.

  ### Part 2: The Principle

  Here is the principle that delivers your verdicts. I call it **The Principle of Independent Causal Leverage**.

  A retrospective historical explanation is legitimate if and only if the explanatory factor ($X$) satisfies three conditions relative to the outcome ($Y$):

  1.  **Independence:** $X$ must be identifiable and measurable *without reference to $Y$*. (This kills *Hubris, Decadence*).
  2.  **Robustness:** $X$ must exert causal pressure across a *range* of nearby possible worlds, not just in the actual sequence. It must constrain the possibility space, not just trigger a single path. (This kills *Sarajevo*, saves *Alliances*).
  3.  **Mechanism:** The link between $X$ and $Y$ must specify a transmission belt (physical, economic, strategic) rather than a psychological or moral tendency. (This kills *Unsinkable Belief*, saves *Speed*).

  **Why this handles your worries:**

  *   **WWI/Alliances vs. Sarajevo:** Alliances are *Robust*. Even if Franz Ferdinand survives, the mobilization schedules ($X$) constrain the diplomats ($Y$). Sarajevo is not Robust; remove the bullet, the structural tension remains. The Alliance explanation respects the *constraints* on the alternatives; the Sarajevo explanation pretends a contingency was a constraint.
  *   **Cold War vs. Hitler:** Deterrence passes *Independence*. We know the nukes were there and we know the strategic logic regardless of the peace. Hubris fails *Independence*. It is a post-hoc moralization of the defeat.
  *   **Titanic:** Speed passes *Mechanism* (physics of buoyancy/impact). Belief fails *Mechanism* (it requires an extra step of human decision-making that isn't specified).

  ### Part 3: The "Live Alternatives" Worry

  You asked: *"If the principle ends up being basically a covert appeal to how much alternatives were live at the time, say so plainly, because then I want to know how we could ever know that from the armchair."*

  I will say so plainly. **Yes.** The principle is a covert appeal to live alternatives. Specifically, Condition 2 (Robustness) is a claim about **modal space**. To say "Alliances caused WWI" is to say "In a wide cluster of possible worlds where alliances exist, war probability is high." To say "Sarajevo caused WWI" is to say "In worlds without Sarajevo, war probability is low."

  **How do we know this from the armchair?**
  We don't. And that is the danger zone. However, we are not *purely* armchair. We use **models**.
  *   When we say "Industrial Capacity" caused the Allied victory, we are relying on economic models of logistics that hold across time.
  *   When we say "Nuclear Deterrence" kept the peace, we are relying on game-theoretic models of rational actors.
  *   When we say "Sarajevo" didn't cause the war, we are relying on diplomatic records showing war plans existed prior to the assassination.

  **The Lesson for Students:** A good historical explanation isn't just a story that fits the facts. It is a story that survives **counterfactual stress-testing**. If the explanation relies on a factor that, if removed, leaves the outcome unchanged (Sarajevo), or if the factor can only be identified *after* the outcome is known (Hubris), it is a bad explanation. We justify our counterfactuals not by imagination, but by invoking general theories (physics, economics, psychology) that we trust more than the specific narrative.

  ### Part 4: The Reformation Case

  **Case:** *"The Reformation succeeded because of the printing press."*

  Let's run it through the **Principle of Independent Causal Leverage**:

  1.  **Independence:** Can we identify the "printing press" without knowing the Reformation succeeded? **Yes.** We can count presses, pamphlets, and literacy rates independently of theological outcomes.
  2.  **Robustness:** Does the press exert pressure across nearby possible worlds? **Yes.** If Luther is burned in 1521, his writings still circulate. The technology constrains the Church's ability to suppress information across a range of scenarios (Luther lives, Luther dies, Luther recants). It changes the *structural conditions* of religious conflict.
  3.  **Mechanism:** Is there a transmission belt? **Yes.** The mechanism is *informational replication cost*. It lowers the cost of distributing heresy and increases the cost of censorship.

  **Verdict:** **Good (with a caveat).**
  This is a legitimate explanation, akin to "Industrial Capacity" in WWII. It cites a material constraint that alters the probability space.

  **The Caveat:** Your students should challenge the word "Succeeded."
  *   If "Succeeded" means "Luther's ideas were printed widely," the explanation is circular (Press causes Printing).
  *   If "Succeeded" means "The Catholic Church failed to maintain a religious monopoly in Northern Europe," the explanation is robust.
  *   *Risk:* It risks becoming a "Technological Determinism" fallacy if it ignores the *content* (theological dissatisfaction) or the *political context* (German princes wanting independence from Rome).
  *   *Refinement:* A better explanation is "The Reformation succeeded because the printing press **amplified** pre-existing theological and political fractures." This acknowledges the Press as a robust causal lever (Good) without treating it as a magic wand (Bad).

  ### Summary for Your Seminar

  Tell your students that hindsight bias isn't just "looking backward." It's **confusing the actual path with the only path.**

  *   **Bad narratives** treat fragile triggers as deep causes (Sarajevo).
  *   **Bad narratives** treat moral labels as causal mechanisms (Hubris).
  *   **Good narratives** identify variables that would have constrained the actors even if the specific events had varied slightly (Alliances, Industry, Physics).

  The test is not "Is this true?" (The belief that the Titanic was unsinkable *was* true). The test is: **"If we tweak the scenario slightly, does this factor still do the work?"** If the answer is no, it's a story, not an explanation.
