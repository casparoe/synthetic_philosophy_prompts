prompt: |-
  I teach a philosophy of history seminar, and every year I hit the same wall when we get to hindsight bias and the narrative fallacy: my students can spot the obviously bad narratives, but neither they nor I can quite say what separates a bad one from a legitimate retrospective explanation. So I've been keeping a list of historical explanations with my gut verdicts, and I'd like your help finding the principle behind them, if there is one. Act as a philosopher of science who thinks hard about explanation, and do some actual brainstorming before you commit to anything -- don't just hand me "hindsight bias bad" as if that settled it.

  My verdicts, in no particular order:

  - "WWI happened because the alliance system and mobilization schedules made a general European war nearly inevitable" -- I think this one is decent, even though it was clearly constructed in hindsight.
  - "The assassination at Sarajevo caused WWI" -- bad. A contingency got promoted to a cause.
  - "Rome fell because of decadence" -- bad, obviously.
  - "The Cold War never went hot because of nuclear deterrence" -- I think this is good, even though it's an explanation of a non-event with no control group.
  - "Hitler lost the war because invading Russia was hubris, hubris always gets punished" -- bad.
  - "The Allies won WWII mostly because of industrial capacity" -- good.
  - "The Titanic sank because it was going too fast through a known ice field on a moonless night" -- good. But "the Titanic sank because everyone believed it was unsinkable" -- bad, somehow, even though the belief was real and causally involved.

  Here's what bugs me: 4 and 5 look structurally almost identical -- one big cause, retrospectively selected, explaining a huge outcome -- and my verdicts go opposite ways. Same with the two Titanic explanations, which share facts. And honestly 1 bothers me too, since inevitability claims made after the fact are exactly what people say hindsight bias produces, yet I find the inevitability story there more respectable than the Sarajevo one.

  So: is there one principle (or maybe two, cleanly split) that delivers all or nearly all of these verdicts? If a simpler principle forces me to drop one, tell me which one and why. And then tell me what the principle says about a case I haven't made up my mind on: "the Reformation succeeded because of the printing press." I go back and forth on it constantly and would love to know what I'm committed to. Please be precise about the principle -- enough that I can apply it to new cases myself, and enough that my students could argue with it. Also, if the principle ends up being basically a covert appeal to how much alternatives were live at the time, say so plainly, because then I want to know how we could ever know that from the armchair.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** Philosophy of history seminar instructor.
      *   **Problem:** Students (and the instructor) struggle to distinguish between *bad* retrospective narratives (hindsight bias/narrative fallacy) and *legitimate* retrospective explanations. They can spot the obvious caricatures but lack a principled distinction for the borderline cases.
      *   **Task:** Act as a philosopher of science/history. Brainstorm deeply before committing. Find a principle (or two) that accounts for the user's specific verdicts on a list of historical explanations.
      *   **Constraints:** Don't just say "hindsight bias is bad." Be precise enough for students to argue with. Address the structural similarities between cases with opposite verdicts (e.g., Cold War vs. Hitler's Hubris). Address the "inevitability" worry. Finally, apply the principle to the "Reformation/Printing Press" case.
      *   **Specific Worry:** If the principle relies on "live alternatives at the time," explain how we can know that from the armchair.

  2.  **Analyze the Data (The User's Verdicts):**
      *   *Good:* WWI/Alliances (Structural inevitability), Cold War/Nuclear Deterrence (Counterfactual stability), WWII/Industrial Capacity (Material constraint), Titanic/Speed+Ice (Specific mechanism).
      *   *Bad:* WWI/Sarajevo (Contingency as cause), Rome/Decadence (Moralistic/Vague), Hitler/Hubris (Moralistic/Psychologizing), Titanic/Unsinkable Belief (Ideational/Cultural without mechanism).

  3.  **Initial Brainstorming & Pattern Recognition:**
      *   *Observation 1 (Mechanism vs. Label):* The "Bad" explanations often use a label ("Decadence," "Hubris," "Unsinkable Belief") that *describes* the outcome rather than *mechanizing* the process. "Hubris" is just a name for "overconfidence that led to failure." It's circular. "Industrial Capacity" is measurable (steel, shells, man-hours).
      *   *Observation 2 (Structural vs. Agential/Contingent):* The "Good" explanations tend to point to structural constraints (Alliances, Industry, Physics of ice/steel) that limit the possibility space. The "Bad" ones point to specific events (Sarajevo) or moral/psychological states (Hubris, Decadence) that feel like post-hoc storytelling.
      *   *Observation 3 (Counterfactual Robustness):* Why is Cold War/Deterrence good? Because if you remove nukes, the counterfactual (hot war) seems highly probable. Why is Hitler/Hubris bad? Because "hubris" is defined by the failure. If he won, would it have been "boldness"? Yes. So it's not a robust variable.
      *   *Observation 4 (The Titanic Puzzle):* Speed/Ice is physical causality. Belief is cultural. Why is belief bad? Because the belief didn't *make* the ship sink; the physics did. The belief explains why they didn't slow down, but it's one step removed. It requires a chain: Belief -> Decision -> Speed -> Collision. The "Speed" explanation cuts closer to the immediate physical cause.
      *   *Observation 5 (Inevitability):* The user worries about WWI/Alliances being "inevitability." But it's *structural* inevitability (tipping points), whereas Sarajevo is *trigger* inevitability. The distinction might be between *conditions of possibility* vs. *triggers*.

  4.  **Developing a Candidate Principle:**
      *   *Hypothesis A: Causal Mechanism vs. Redescription.* Good explanations provide a mechanism that operates independently of the outcome. Bad explanations rename the outcome. (Explains Hubris/Decadence, but maybe not Sarajevo).
      *   *Hypothesis B: Structural Constraints vs. Contingent Triggers.* Good explanations cite factors that restrict the range of possible outcomes (modal strength). Bad explanations cite factors that were merely present. (Explains WWI/Alliances vs. Sarajevo).
      *   *Hypothesis C: Counterfactual Dependence.* Good explanations show that if $X$ were absent, $Y$ likely wouldn't happen (or would be very different). Bad explanations fail this test. (Explains Cold War well. Does it explain Titanic? If they didn't believe it was unsinkable, would they have slowed? Maybe, maybe not. If they didn't go fast, would it sink? No.)
      *   *Hypothesis D (The Winner?):* **Causal Invariance and Modal Strength.**
          *   Good explanations cite factors that would have exerted causal pressure *across a range of slightly different scenarios*.
          *   Bad explanations cite factors that are either (a) too specific/fragile (Sarajevo), (b) morally loaded/redescriptive (Hubris/Decadence), or (c) lack a clear transmission mechanism to the physical outcome (Unsinkable Belief).
          *   Let's refine this. It's about **Causal Leverage** combined with **Independence from the Outcome**.

      *   *Refining the Principle:* Let's look at the "Bad" ones again.
          *   Sarajevo: Too specific. Remove the assassin, maybe another trigger happens soon after (structural tension). Low leverage.
          *   Hubris/Decadence: Tautological. Defined by the failure.
          *   Unsinkable Belief: Proximate cause is missing. Belief $\to$ Action $\to$ Outcome. The explanation skips the action.
          *   *Good* ones:
              *   Alliances: Structural. High leverage. Even without Sarajevo, tension remains.
              *   Industrial Capacity: Measurable, independent variable.
              *   Nuclear Deterrence: Mechanism of fear/calculation that actively prevents action.
              *   Speed/Ice: Physical mechanism.

      *   *Proposed Principle:* **The Principle of Causal Independence and Modal Robustness.**
          1.  **Independence:** The explanatory factor must be identifiable and measurable *independently* of the outcome it explains. (Rules out Hubris/Decadence).
          2.  **Modal Robustness (or "Levers"):** The factor must exert pressure across a range of nearby possible worlds, not just in the actual sequence. It restricts the *space of possibilities*. (Rules out Sarajevo, supports Alliances).
          3.  **Mechanism:** There must be a clear transmission belt from cause to effect. (Rules out Unsinkable Belief unless linked to speed).

      *   *Wait, is there a simpler unification?*
          Many philosophers of history (e.g., Mandelbaum, Dray, Gallie) discuss this. But in philosophy of science (Salmon, Woodward), it's about **Interventionism**.
          *   *Woodward's Manipulability Theory:* $X$ causes $Y$ if intervening on $X$ changes $Y$.
          *   Apply to History: Can we conceptually intervene?
          *   Hubris: Can't intervene on "hubris" without changing the person/outcome definition.
          *   Sarajevo: Intervene on assassination $\to$ War still likely (due to alliances). So Assassination isn't the *deep* cause.
          *   Alliances: Intervene on Alliances $\to$ War less likely.
          *   Printing Press: Intervene on Press $\to$ Reformation spreads differently?

      *   *Let's try to synthesize Interventionism with Historical Specificity.*
          The core distinction seems to be between **Background Conditions/Structural Constraints** (Good) vs. **Triggers/Moral Redescriptions** (Bad).
          But Cold War/Deterrence is a mechanism, not just a background condition.
          Titanic/Speed is a specific decision, not a structural background.
          So "Structural vs. Event" isn't enough.

      *   *New Angle: The "Because" Test.*
          Does the explanation identify a *difference-maker* that was *stable*?
          Bad explanations are often **Outcome-Dependent**. We only call it "Hubris" because he lost. We only call it "Decadence" because Rome fell.
          Good explanations are **Outcome-Independent**. Industrial capacity was high regardless of winning. Alliances existed regardless of war. Speed was measurable regardless of sinking.
          *Exception:* Nuclear Deterrence. We infer the deterrence worked because war didn't happen. This is tricky. But the *mechanism* (MAD) is theoretically robust independent of the specific peace.

      *   *Let's focus on the "Live Alternatives" worry.*
          The user asks: "if the principle ends up being basically a covert appeal to how much alternatives were live at the time, say so plainly."
          Actually, the "Good" explanations tend to show that alternatives were *not* live (WWI Alliances, Industrial Capacity). The "Bad" explanations imply alternatives *were* live but were closed by a moral failing or a single bullet.
          So the principle isn't "alternatives were live." It's "Does the explanation accurately map the *constraints* on the alternatives?"
          Bad narratives pretend the path was narrower than it was (Sarajevo) or wider than it was (Hubris - implies he could have chosen 'humility' easily).
          Wait, "Hubris" implies he *should* have chosen otherwise.
          "Alliances" implies war was hard to avoid.
          So, Good explanations respect the **Constraint Structure** of the situation. Bad explanations violate it (either by overstating contingency or overstating agency/morality).

      *   *Refining the Principle: Causal Depth and Independence.*
          Let's go with a version of **Interventionist Robustness**.
          A good historical explanation cites factors $X$ such that:
          1.  $X$ is identifiable without reference to $Y$ (No circularity).
          2.  Intervening on $X$ (conceptually) would change the probability of $Y$ significantly across a *range* of background conditions (Robustness).
          3.  $X$ connects to $Y$ via a specified mechanism, not a moral or psychological label.

      *   *Testing against the cases:*
          *   WWI/Alliances: $X$=Alliances. Identifiable independent of war. Remove alliances $\to$ war less likely even with triggers. Robust. (Pass)
          *   WWI/Sarajevo: $X$=Assassination. Identifiable. Remove assassination $\to$ war still likely (due to alliances). Not robust. (Fail)
          *   Rome/Decadence: $X$=Decadence. Identifiable? No, defined by fall. Circular. (Fail)
          *   Cold War/Nukes: $X$=Nukes. Identifiable. Remove nukes $\to$ hot war more likely. Mechanism (fear) specified. (Pass)
          *   Hitler/Hubris: $X$=Hubris. Identifiable? No, defined by failure. Circular. (Fail)
          *   WWII/Industry: $X$=Factory output. Identifiable. Remove output $\to$ loss likely. Robust. (Pass)
          *   Titanic/Speed: $X$=Speed. Identifiable. Reduce speed $\to$ no sink. Robust. (Pass)
          *   Titanic/Belief: $X$=Belief. Identifiable. Remove belief $\to$ maybe slower, maybe not. Mechanism indirect. Less robust than speed. (Fail/Weak)

      *   *This looks promising.* It handles the structural similarity between Cold War and Hitler (one has a mechanism independent of outcome, one is circular). It handles Titanic (one is proximate physical, one is distal psychological). It handles WWI (one is robust constraint, one is fragile trigger).

  5.  **Addressing the "Live Alternatives" Worry:**
      *   The user is worried that judging "robustness" is just guessing about counterfactuals from the armchair.
      *   I need to admit this tension. The principle *does* rely on counterfactuals. But it's not "armchair guessing." It's "model-based inference." We use theories (game theory, physics, economics) to justify the counterfactuals.
      *   I need to be honest: Yes, it appeals to alternatives, but *structured* alternatives, not just imagination.

  6.  **Drafting the Response:**
      *   **Role:** Philosopher of Science (Interventionist/Manipulability focus, maybe Woodward-adjacent but adapted for history).
      *   **Brainstorming Section:** Show the work. Discuss circularity, fragility, and mechanism.
      *   **The Principle:** "The Principle of Outcome-Independent Causal Leverage." (Or something catchier). Let's call it **The Principle of Causal Independence and Modal Stability.**
      *   **Breakdown:**
          1.  **Independence:** Can you define the cause without knowing the effect? (Kills Hubris/Decadence).
          2.  **Stability (Leverage):** Does the cause do work across nearby possible worlds, or is it a fragile trigger? (Kills Sarajevo, Saves Alliances).
          3.  **Mechanism:** Is the link physical/structural or moral/psychological? (Kills Unsinkable Belief as a standalone).
      *   **Addressing the Cold War/Hitler Symmetry:** Explain why Deterrence passes Independence (Nukes exist regardless of peace) but Hubris fails (Hubris is inferred from loss).
      *   **Addressing the WWI Inevitability:** Distinguish "Structural Inevitability" (constraints) from "Narrative Inevitability" (teleology).
      *   **The Reformation Case:** Apply the principle. Printing Press is independent. Does it have leverage? Yes, but maybe not sufficient alone. It's a "Good" explanation but incomplete.
      *   **The Armchair Problem:** Confront the "how do we know alternatives were live" question. Admit we use models, not crystal balls.

  7.  **Refining the Reformation Verdict:**
      *   "Reformation succeeded because of the printing press."
      *   Independence: Yes, press existed before/during.
      *   Stability: If press existed, did Reformation *have* to succeed? Or did it just spread? "Succeeded" is the tricky word. If "succeeded" means "survived and spread," Press is high leverage. If "succeeded" means "Luther wasn't burned," Press is high leverage.
      *   Comparison: Is it like "Industrial Capacity" (Good) or "Unsinkable Belief" (Bad)? It's more like Industrial Capacity. It's a material constraint on information flow.
      *   Verdict: Good, *provided* "succeeded" is defined independently of the press (e.g., theological adoption vs. just printing). If "succeeded" just means "books were printed," it's circular. Assuming "succeeded" means "religious schism became permanent," the Press is a robust causal lever.

  8.  **Final Polish:**
      *   Ensure tone is collegial but rigorous.
      *   Make sure the principle is actionable for students.
      *   Check against the "don't just hand me hindsight bias bad" constraint.

      *(Self-Correction during drafting)*: I need to be careful with the Cold War case. "Nuclear deterrence" is a theory *about* the nukes. Is it independent? Yes, the weapons existed. The *theory* explains the non-event. The user says it's "Good." My principle must support this. The mechanism is rational actor theory + destructive capacity. This is independent of the peace itself (we can measure destructive capacity without knowing peace occurred). Hubris is not independent (we infer hubris *from* the loss). This distinction is crucial.

      *(Self-Correction on Titanic)*: Why is "Unsinkable" bad? It's not circular. The belief existed. But it's *distal*. It explains the speed, not the sinking. The Speed explains the sinking. So the principle should prioritize **Proximate Mechanism** or **Causal Chain Completeness**. "Unsinkable" is an incomplete chain. "Speed" completes it.

      *Revised Principle:* **The Principle of Independent Causal Leverage.**
      1.  **Non-Circularity:** Cause identifiable without effect.
      2.  **Robustness:** Cause works across counterfactual variations (not a fragile trigger).
      3.  **Completeness:** Mechanism connects cause to effect without gaps.

