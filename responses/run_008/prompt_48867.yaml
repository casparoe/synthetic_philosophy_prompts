      *   *User's Level:* Definition mismatch (Formal Stratigraphic Unit vs. Cultural/Political Concept).
      *   *Deeper Level:* Authority, Epistemology, and Ontology.
      *   *The "Bitterness":* Why fight so hard? Because stakes are high (funding, narrative control, political agency, the nature of "Truth").

  3.  **Evaluate the "Verbal Dispute" Hypothesis:**
