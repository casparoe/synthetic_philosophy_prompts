      *   *However*, calling it *just* verbal misses the power dynamics. If geologists say "No," does it invalidate the humanities' usage? No, but it creates friction over who owns the term.

  4.  **Identify the Hidden Substantive Questions:**
      *   **Question 1: Ontological Status.** Is the Anthropocene a *thing in the world* (independent of us) or a *tool for thinking* (dependent on us)? Geologists lean toward the former (it must be in the rock); Humanities lean toward the latter (it's a story we tell).
      *   **Question 2: Authority/Epistemic Justice.** Who gets to name the age? The keepers of deep time (geologists) or the analysts of human impact (historians, sociologists)? The 2024 vote was a reassertion of disciplinary boundary policing.
