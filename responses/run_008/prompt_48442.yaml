prompt: |-
  i'm a phd student in decision theory (philosophy dept, but i basically live with the formal epistemology crowd), and my dissertation keeps drifting toward whether credences can be imprecise. my advisor's go-to question is "adequate for what?" and i need a real answer for my prospectus defense, not a shrug. so: write me the desiderata — what any adequate theory of imprecise credence has to deliver, with the case behind each requirement. the fixed purpose is: a theory good enough to tell an ideally rational agent what to believe and do under ambiguity.

  stuff i specifically want on the list, though add things if you see gaps. it should explain Ellsberg-style behavior, where i bet on the known urn even at worse odds and that seems rational, not just a psychological quirk. it should handle what people call dilution — when i use a coin i'm sure is fair to randomize between betting heads or tails on an ambiguous coin, my willingness to bet drops below what i'd give for either side straight up, and precise probabilities can't reproduce that, but i want to know if a theory can reproduce it without saying randomizing makes me *worse* off in a way that looks irrational. it needs an updating story that answers the belief inertia complaint — the standard worry that no finite amount of data ever shrinks the credal set, so learning does nothing until suddenly it does everything. and it has to connect to action: which decision rules are even candidates for someone holding a set of probabilities, and do their known costs disqualify them — like whether Γ-maximin throwing away sure-thing reasoning, or the money pump arguments against E-admissibility, are bugs or acceptable losses. also somewhere in there: does the theory have to earn imprecision with a representation theorem, or is demanding one smuggling in camp commitments.

  beyond just listing, here's what i actually care about. flag which requirements are genuine desiderata vs. just what one camp happens to want (i suspect "must not collapse into a single precise probability" is doing less work than people think, since the second-order probability people have a story there). tell me whether any subset of the requirements is jointly unsatisfiable — i have a suspicion you can't both have a representation by sets of probabilities and ban dilution, but i'd like to know if that's right or if i've misremembered the result. and identify which single requirement knocks out the most contenders, since that's the one my committee will grill me on.

  then a quick pass, a couple sentences each, on how three broad pictures do against the list: the sets-of-probabilities view in the walley/levi tradition, the "it's really just higher-order probabilities" move, and the deflationary line that imprecision lives in our language about credences, not in the credences themselves. keep the weight on the criteria though — the scoring is for my prospectus, the requirements are for my advisor. no reading list needed, i know where the library is.
