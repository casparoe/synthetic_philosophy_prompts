answer: |-
  The phenomenon you and your friend stumbled upon has an established name in the literature. It is standardly called **the Revenge Paradox** (or **the Revenge Problem**). Sometimes, when referring specifically to the sentence you constructed ("This sentence is neither true nor false"), it is called the **Strengthened Liar**.

  I am **highly confident** in this attribution. The term "Revenge" has been the dominant label in philosophical logic since at least the 1970s, gaining prominence through the work of logicians like Saul Kripke, Bas van Fraassen, and later Hartry Field and J.C. Beall.

  Here is how the standard discussions carve the concept, addressing your specific questions about its unity, its impact on solutions, and its boundaries.

  ### 1. Is it One Phenomenon or a Family?
  **Confidence: Medium-High.**

  The literature is divided, but the prevailing view is that Revenge is a **structural family of problems** rather than a single, uniform logical bug.

  *   **The Uniform View:** Some philosophers (notably Kevin Scharp) argue that Revenge reveals a deep, unified inconsistency in our concept of truth itself. On this view, every solution fails because the concept of truth is inherently incoherent ("alethic inconsistency").
  *   **The Family View:** Most logicians treat Revenge as a test of *expressive power*. Every time you propose a solution (e.g., "Liar sentences are gappy"), you introduce a new semantic category (e.g., "gappy"). If your language is strong enough to express that new category, you can construct a sentence that says, "I am in that new category." If the language *cannot* express that category, the solution is accused of being expressively incomplete.

  Therefore, Revenge is usually analyzed as a trade-off: a solution to the Liar Paradox is judged by how much expressive power it sacrifices to avoid Revenge.

  ### 2. How It Bears on the Original Treatment
  **Confidence: High.**

  The existence of Revenge does not necessarily defeat every treatment, but it drastically raises the cost of admission. A theory of truth is now expected to be "Revenge-immune."

  *   **Gap Theories (Your Friend's View):** If you say the Liar is neither true nor false (a "gap"), the Revenge sentence ("This sentence is not true") forces you to distinguish between *negation* types. If "not true" means "false or gappy," the Revenge sentence becomes paradoxical again. To survive, the theory must claim that "not true" cannot be expressed in the language without triggering a new hierarchy.
  *   **Paraconsistent Theories:** If you say the Liar is *both* true and false (a "glut"), the Revenge sentence is "This sentence is only false." If it's only false, it's not both, so it's not true... and so on.
  *   **Contextualist Theories:** These argue that the truth predicate shifts context when evaluated. Revenge is blocked because the sentence tries to fix a context that is inherently shifting.

  The consensus is that **no classical solution is fully immune.** The debate is about which kind of immunity is most philosophically palatable.

  ### 3. The Escape Attempts and Tarski (The 1930s Claim)
  **Confidence: High.**

  Your friend is recalling **Alfred Tarski's Hierarchy of Languages**, detailed in his 1933 paper *The Concept of Truth in Formalized Languages* (published in Polish; German/English later).

  *   **The Claim:** Tarski proved that a consistent language cannot contain its own truth predicate. To talk about the truth of sentences in Language A, you need a Metalanguage B. To talk about the truth of B, you need Metalanguage C, ad infinitum.
  *   **How it Blocks Revenge:** In Tarski's system, your friend's sentence ("This sentence is neither true nor false") is **ill-formed**. The predicate "true" in the sentence cannot apply to the sentence itself because the truth predicate belongs to a higher level than the sentence it evaluates.
  *   **The Cost:** This solves the paradox by making the problematic sentences ungrammatical. However, it prevents us from saying general things like "All sentences in this hierarchy are true," because that would require a truth predicate above the highest level. Many philosophers find this too restrictive for natural language, which seems to allow us to talk about its own truth.

  ### 4. The Edges: Self-Reference and Other Predicates
  **Confidence: High.**

  You are correct that self-reference alone is not the culprit.
  *   **The Truth-Teller:** The sentence "This sentence is true" is self-referential but stable. It can be true without contradiction, or false without contradiction. It does not generate Revenge because it lacks the *negative feedback loop* (the negation) that creates the oscillation.
  *   **Other Predicates:** The pattern extends beyond truth.
      *   **Provability:** Gödel's First Incompleteness Theorem uses a sentence that says "I am unprovable." If the system proves it, it's false (inconsistent); if it doesn't, it's true (incomplete). This is a syntactic cousin of the Liar.
      *   **Knowability:** Fitch's Paradox of Knowability involves sentences like "There is a truth that is unknown." Under certain logical assumptions, this implies "There is a truth that is *unknowable*," which contradicts the verificationist principle that all truths are knowable.
      *   **Expressibility:** Sentences like "This proposition cannot be expressed" create similar loops in theories of propositions.

  The common thread is not self-reference, but **semantic closure**: the ability of a system to represent its own semantic limitations (truth, proof, knowledge) within itself.

  ### 5. Definition and Distinctions
  Since the term "Revenge Paradox" exists, I will not coin a new one, but I will provide the rigorous definition you requested to distinguish it from nearby concepts.

  **Definition:** A **Revenge Paradox** occurs when a proposed solution to a semantic paradox introduces a new semantic status (e.g., "gappy," "undefined," "context-shifted"), and a new sentence can be constructed within the same language that predicates this new status of itself, thereby re-generating a contradiction or triviality within the proposed solution.

  **Distinctions:**
  *   **Vs. The Original Liar:** The Liar uses the standard boolean values (True/False). Revenge uses the *exception* values introduced to solve the Liar.
  *   **Vs. Infinite Regress:** Tarski's hierarchy creates an infinite regress of languages, but that is a *feature* of the solution, not a paradox. Revenge is a *failure* of the solution to close the loop.
  *   **Vs. Vagueness Sorites:** Sorites paradoxes rely on borderline cases and tolerance principles. Revenge relies on the expressibility of semantic classifications.

  ***

  ### Candid Assessment of Confidence

  Throughout this answer, I have marked my confidence in the historical and technical attributions (Tarski, the name "Revenge," the distinction regarding self-reference) as **High**. These are settled matters in the history of logic.

  However, per your instruction, I must single out the **single point in this answer I am least sure of**.

  **The Point of Least Certainty:**
  I am least certain about the claim that **the regeneration trick is genuinely the same phenomenon across all different treatments.**

  **Why:** While logicians group these under the label "Revenge," there is a live, unresolved debate about whether this is a unified logical structure or merely a loose analogy.
  *   **The Unified View:** Logicians like Hartry Field argue that Revenge stems from a specific failure of the logic's conditional or negation, suggesting a single technical fix might solve all forms.
  *   **The Disunified View:** Others argue that Revenge in a *hierarchical* system (Tarski) is fundamentally different from Revenge in a *gap* system (Kripke) or a *paraconsistent* system (Priest). In one case, it's about ill-formedness; in another, it's about truth-value gaps; in another, it's about consistency.

  My verdict: It **only feels that way from the outside.** The *structural* similarity (a solution generating a new counter-example) is real, but the *logical* mechanism required to generate the Revenge sentence changes depending on the underlying logic of the solution. Therefore, treating "Revenge" as a single monster rather than a genus of distinct problems may be a category error. I estimate the probability that "Revenge" is a unified natural kind in logic to be less than 50%, despite the literature often treating it as one.
