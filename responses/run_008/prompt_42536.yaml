answer: |-
  This is a sophisticated topic for a 20-minute high school session, but it is perfectly manageable if you treat it as a *detective game* rather than a lecture. Your goal isn't to solve the problem (philosophers haven't), but to make the group feel the tension that makes the problem matter.

  Here is a structured plan designed for a 20-minute window.

  ### **Session Title:** The Currency of Pleasure
  **Goal:** To determine if "pleasure" is a single measurable thing (like inches) or a label for unrelated things (like "games").
  **Stakes:** If pleasure isn't one single thing, Bentham's Hedonism (which adds up pleasure like math) doesn't work.

  ---

  ### **1. The Setup (Minutes 0–3)**
  **Goal:** Define terms, kill the "selfishness" myth, and separate pleasure from happiness.

  *   **The Hook (1 min):** Start with a definition. "Hedonism says the only thing good in itself is pleasure. If we want to make the world better, we just need to maximize it."
  *   **Pre-empting Misconception #1 (Selfishness):** Immediately add: "Note: This doesn't mean 'be selfish.' A hedonist could argue that helping others creates the most pleasure overall. We aren't judging the *morality* of hedonism today; we are testing its *mechanics*."
  *   **Pre-empting Misconception #2 (Happiness):** Draw a line on the board: **Pleasure ≠ Happiness**.
      *   *Script:* "Happiness is usually a long-term state of your life (e.g., 'I had a happy childhood'). Pleasure is an episodic experience (e.g., 'This cookie tastes good'). Today, we are only talking about the episodic moments. If we can't define the moment, we can't build the life."
  *   **The Stakes:** "Bentham treated pleasure like a currency. You can add 5 dollars to 5 dollars. But can you add 5 minutes of reading to 5 minutes of a roller coaster? Only if they share the same 'currency.' That's our mystery."

  ### **2. The Core Activity: The "Impossible Trade" (Minutes 3–10)**
  **Goal:** Use specific cases to test the "Common Property" theory.

  *   **The Cases:** Do not use just one example. The problem *is* the diversity. Use **The Calculus Problem** (Mental/Accomplishment) vs. **The Cold Water** (Physical/Relief).
      *   *Addressing your worry:* You are right to worry about Calculus being dismissed as "relief." **Lean into that.**
  *   **The Prompt:** "Imagine I have a machine. Option A gives you the exact feeling of cracking that calculus problem. Option B gives you the exact feeling of cold water after a run. Both last 1 minute. Hedonism says we should be able to measure which has 'more pleasure.' What are we measuring?"
  *   **Facilitation:** Ask the group: "What is the *same* in both experiences?"
      *   *Expected Answer:* "They both feel good."
      *   *Your Counter:* "But *how* do they feel good? Is there a specific 'tingle' in your brain that is identical in both? Or do they feel totally different?"
  *   **Pre-empting Misconception #3 (Brain Chemistry):** If a student says, "It's just dopamine," stop them gently.
      *   *Script:* "That's a biological cause, not the experience itself. If I took a pill that released dopamine but I felt terrified, is that pleasure? We are talking about what it *feels like* from the inside, not what the neurons are doing."

  ### **3. Theory Generation (Minutes 10–17)**
  **Goal:** Let them propose solutions, then you introduce the "Candidate Answers" you found in your reading as tools to test their ideas.

  *   **Phase 1: The Feeling Theory (7 mins)**
      *   Ask: "Is there one specific feeling all pleasures share?"
      *   If they struggle, introduce the **Roller Coaster vs. Rainy Day** contrast. One is high arousal, one is low.
      *   *The Trap:* If they say "No common feeling," ask: "Then how can Hedonism add them up? You can't add liters to kilograms."
  *   **Phase 2: The Desire Theory (5 mins)**
      *   If the Feeling Theory fails, pivot: "Maybe pleasure isn't a feeling. Maybe it's just **getting what you want**."
      *   *Test:* "What if you want to solve the calculus problem, you solve it, but you feel empty? Is that pleasure?" (This usually breaks the Desire theory).
      *   *Test:* "What if you didn't want the cold water, but you drank it and it felt amazing anyway?"
  *   **Phase 3: The Family Resemblance (5 mins)**
      *   Introduce this only if the room is stuck. "Wittgenstein argued that 'games' don't share one thing (some have balls, some don't; some have winners, some don't). They just overlap."
      *   *The Killer Blow to Hedonism:* "If pleasure is like 'games' (a grab bag), then Bentham's math breaks. You can't sum up a grab bag."

  ### **4. The Closing (Minutes 17–20)**
  **Goal:** Assess understanding and leave them with the tension.

  *   **Summary:** Briefly recap. "We found that physical and mental pleasures feel different. We couldn't agree on a single 'feeling.' We saw that 'desire' doesn't always match 'pleasure'."
  *   **The Diagnostic Closing Question:**
      Do not ask "Did you enjoy this?" Ask this:
      > **"If we decide that 'pleasure' is just a word for a bunch of unrelated feelings, does Hedonism survive? Can you still be a Hedonist if pleasure isn't a single currency?"**
      *   *Why this works:* A student who just nodded along will say "Sure, pleasure is still good." A student who grasped the problem will realize: "Wait, if it's not a single currency, you can't maximize it. The whole theory collapses."

  ---

  ### **Specific Advice on Your Concerns**

  **1. Order of Distinctions (Pleasure vs. Happiness)**
  Do this **first** (in the Setup). If you wait until later, students will conflate "a good life" with "a pleasant moment," and the discussion will drift into "Is a life of drug addiction good?" (which is a different debate). Keep them locked on the *momentary experience*.

  **2. The Calculus Example**
  Keep it, but pair it. The Calculus example is actually your strongest tool *because* it is easy to dismiss.
  *   *Strategy:* When someone says "That's just relief, not pleasure," ask the room: "Is relief a type of pleasure? If yes, does relief feel the same as the roller coaster drop?" This forces them to define the boundary of the word "pleasure."

  **3. Handling Misconceptions**
  *   **"Hedonism is selfish":** Address in Minute 1. Don't let it linger.
  *   **"It's just brain chemistry":** Address during the Core Activity (Minute 5-7). Frame it as "Category Error" (Biology vs. Experience).
  *   **"Pleasure = Happiness":** Address in Minute 2. Write it on the board.

  **4. What to Decline (Scope Limits)**
  *   **Neuroscience:** Explicitly say, "We are doing phenomenology (study of experience), not biology. No fMRI scans allowed."
  *   **Mill's Higher/Lower Pleasures:** Do not bring this up. Mill admits pleasures differ in *quality*, which sidesteps your specific question about *quantity* and common properties. It will confuse the "common currency" argument.
  *   **Technical Vocabulary:** Avoid words like "qualia," "propositional attitudes," or "axiology." Use "felt quality," "wanting something," and "theory of value."

  **5. Introducing the Candidate Answers**
  Do not list them at the start. That turns the session into a history lesson.
  *   **Let them generate "Feeling Theory" first.** (It's the most intuitive).
  *   **Introduce "Desire Theory"** when they realize feelings are too different.
  *   **Introduce "Family Resemblance"** as the "nuclear option" at the end if they can't solve it.
  *   *Why:* This mimics the actual philosophical discovery process and keeps them engaged.

  ### **Facilitator's Cheat Sheet (Print this for yourself)**

  *   **If the room goes silent:** Ask, "Close your eyes. Think of the cold water. Now think of the calculus. Is there a single 'thread' connecting the two?"
  *   **If they agree too easily:** Push back. "Really? The adrenaline of the roller coaster feels *identical* in quality to the calm of reading? Or just 'good' in a vague way?"
  *   **If they say "It doesn't matter":** Remind them of the Stakes. "If I can't measure it, I can't maximize it. If I can't maximize it, I can't follow Bentham's rule."
  *   **Time Check:** At Minute 15, stop the debate and move to the Closing Question. It is better to end on a sharp question than to run out of time mid-sentence.

  This plan keeps the focus tight on the *metaphysics of pleasure* (what is it?) rather than the *ethics of pleasure* (should we pursue it?), which is where your specific philosophical snag lies. Good luck!
