answer: |-
  ### Specification for an Adequate Account of the Person in Buddhist Philosophy

  To function as a viable philosophical anthropology within the Buddhist tradition, a theory of personal identity must satisfy five core desiderata. These requirements balance the metaphysical negation of a permanent self (*anattā*) with the pragmatic necessities of soteriology, ethics, and lived experience. Each requirement is anchored by a specific puzzle or case drawn from the tradition's history.

  #### 1. The Ontological Parsimony Constraint (The Milinda Condition)
  **Requirement:** The account must not posit any entity over and above the five aggregates (*skandhas*) that serves as a master, owner, or underlying substrate.
  **The Case:** In the *Questions of King Milinda*, Nāgasena employs the chariot analogy to demonstrate that 'person' is a designation (*prajñapti*) dependent on the assembly of parts, not a sixth thing existing independently. An adequate theory must explain the person as a conceptual imputation upon causally connected processes without reifying the imputation itself.
  **Status:** **Non-Negotiable.** Any theory positing a substantial self violates the core doctrine of *anattā*.

  #### 2. The Diachronic Continuity Constraint (The Karmic Condition)
  **Requirement:** The theory must explain how causal efficacy, moral responsibility, and memory transmit across time without a persisting bearer.
  **The Case:** If a person is merely a bundle of momentary events, it is unclear how an action performed at time *t1* bears fruit at *t2*, or how one remembers a past life without a subject who was there. A bare bundle risks collapsing into a series of disconnected flashes, rendering karmic retribution unjust and rebirth unintelligible.
  **Status:** **Non-Negotiable** for traditional adequacy (mechanism is Camp-Specific). While the *fact* of karmic continuity is required, the *mechanism* (e.g., the Theravāda *bhavaṅga* stream vs. the Sautrāntika seed theory vs. a metaphorical reading of rebirth) varies by camp.

  #### 3. The Soteriological Agency Constraint (The Path Condition)
  **Requirement:** The account must make sense of spiritual effort and gradual transformation without presupposing an agent who exerts will.
  **The Case:** If there is no self, the question arises: 'Who exerts effort toward awakening?' If the path requires gradual cultivation of virtues over years, there must be a sense in which the practitioner at the beginning of the path is sufficiently identical to the practitioner at the end to justify the labour, yet sufficiently non-identical to allow for transformation.
  **Status:** **Non-Negotiable.** The efficacy of the Noble Eightfold Path is central to the tradition, though the explanation of 'effort' (e.g., as impersonal causal arising vs. conventional agency) differs.

  #### 4. The Semantic Non-Eliminativism Constraint (The Two Truths Condition)
  **Requirement:** Ultimate analysis must not collapse into eliminativism about the everyday person; the distinction between conventional (*saṃvṛti*) and ultimate (*paramārtha*) truth must do real philosophical work.
  **The Case:** If the person is ultimately unreal, one risks licensing two contradicting stories: one where persons suffer and strive, and another where nothing exists but impersonal dharmas. An adequate theory must validate the conventional reality of the person enough to sustain moral and legal practices (e.g., punishment, promise-keeping) without contradicting the ultimate emptiness of that person.
  **Status:** **Camp-Specific.** Abhidharmic realists tend to view conventions as merely useful fictions, whereas Madhyamaka philosophers argue conventions possess a dependent reality that is not merely illusory.

  #### 5. The Phenomenological Accuracy Constraint (The Experience Condition)
  **Requirement:** The theory must explain the pervasive intuition of selfhood rather than merely denying it.
  **The Case:** Experience does not present itself to us as a disjointed aggregate; it presents as a unified field owned by a subject. A no-self theory that simply asserts 'there is no self' fails to explain why the illusion is so structurally robust. The theory must account for the *appearance* of unity (perhaps as a functional construct) without conceding that the appearance reflects an ontological reality.
  **Status:** **Non-Negotiable.** Any theory ignoring the phenomenological datum fails to address the root ignorance (*avidyā*) that the path is meant to cure.

  ***

  ### Analysis of Joint Satisfiability

  There is a significant risk that the following subset of requirements is jointly unsatisfiable without smuggling a 'thin self' back into the ontology: **Strict Momentariness + Robust Karmic Retention + Gradual Path.**

  If one maintains that reality consists of discrete, momentary events (Strict Momentariness) to satisfy Ontological Parsimony, it becomes exceptionally difficult to explain how karmic 'seeds' are carried forward without a container (Robust Karmic Retention). Furthermore, if there is no continuity of substance, the 'Gradual Path' risks becoming a series of unrelated arisings, undermining the notion of spiritual progress. Historically, traditions that prioritise strict momentariness often introduce quasi-substantial carriers (like the *ālaya-vijñāna* in Yogācāra or the *pudgala* in Pudgalavāda), which critics argue violate the first constraint. Holding all three strictly may require a radical redefinition of causality that borders on incoherence for analytic philosophy.

  ***

  ### Theoretical Scorecard

  **Humean Bundle Theory:** It satisfies ontological parsimony but fails the karmic condition by offering psychological continuity without a mechanism for moral binding across lives.

  **Parfitian Reductionism:** While it converges with the Buddha on the unreality of the self, it struggles to ground the soteriological urgency and agency required by the Path Condition.

  **Pudgalavāda's Inexpressible *Pudgala*:** It successfully secures karmic continuity and agency but collapses into the substantialist heresy it sought to avoid, violating the Milinda Condition.

  **Madhyamaka's Merely Conventionally Existent Person:** It preserves the two truths and avoids substantialism, but risks rendering the conventional person too insubstantial to bear the weight of moral responsibility.
