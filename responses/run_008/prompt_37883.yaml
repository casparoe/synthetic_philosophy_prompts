answer: |-
  Your instinct is substantially correct: active inference is stochastic optimal control with endogenous probabilistic setpoints, but the "residue" is a normative claim that minimizing this cost function is identical to maintaining physical existence, which classical control treats as an external boundary condition rather than a derived objective.

  ### The Translation Layer

  **The Generative Model** is your internal state-space representation. It includes the plant dynamics, sensor models, and disturbance statistics. In Friston's terms, this is the organism's model of how hidden causes generate sensory data; in your terms, it is the identified model $\hat{P}(s)$ used in your observer and controller design.

  **Predictive Coding** is recursive Bayesian estimation, effectively a Kalman Filter. The "prediction error" is the innovation sequence or residual $r = y - \hat{y}$. Hierarchical predictive coding is simply cascade control or multi-loop estimation, where residuals at higher levels (slow dynamics, context) modulate the gains or priors at lower levels (fast dynamics, reflexes).

  **Variational Free Energy (VFE)** is your cost functional $J$. Mathematically, it is an upper bound on surprise (negative log model evidence). In control vocabulary, minimizing VFE is equivalent to minimizing a risk-sensitive cost function that penalizes both state estimation error and deviation from preferred states. It serves as a Lyapunov candidate function ensuring stability of the estimation and control loop.

  **Active Inference** is Model Predictive Control (MPC). You simulate future trajectories under the generative model and select control inputs $u$ that minimize the expected free energy over a horizon. Unlike standard MPC where you track an external reference $r(t)$, here you track a prior distribution over sensory states.

  **Self-Evidencing** is the requirement that the system maintains its states within a viable subset of the state-space (a homeostatic set). If the system fails to minimize surprise (i.e., enters high-surprise states), it encounters conditions incompatible with its structural integrity (death/failure).

  ### The Residue Report

  **Clean Mappings:**
  *   **Observer Dynamics:** Prediction error minimization maps 1:1 to the correction step in a Kalman Filter or Luenberger observer.
  *   **Feedback Loops:** Hierarchical predictive processing maps cleanly to cascade control architectures where outer loops provide setpoints to inner loops.
  *   **Disturbance Rejection:** Modeling hidden causes equates to disturbance observer (DOB) techniques where unmeasured inputs are estimated and cancelled.

  **Distorted Mappings:**
  *   **Probabilistic References:** Classical control uses deterministic setpoints $r(t)$. Active inference uses probability distributions over trajectories. You have to stretch your definition of "reference" to include a desired probability density function rather than a specific value.
  *   **Cost Function Geometry:** Classical control typically uses quadratic costs ($e^T Q e$). Free energy uses Kullback-Leibler (KL) divergence. While locally quadratic, KL divergence handles non-Gaussian uncertainties and multimodal priors differently than LQG control.
  *   **Learning vs. Control:** In classical engineering, system identification (learning $A, B$) and control design (finding $K$) are often separate phases. Active inference treats parameter learning (updating the generative model) and control (selecting actions) as simultaneous gradient descent on the same free energy surface.

  **No Counterpart (The Missing Piece):**
  *   **The Origin of the Objective:** Classical control assumes the cost function $J$ and reference $r$ are given by the designer. Active inference claims the cost function is *derived* from the necessity of the system to remain in a non-equilibrium steady state. There is no external engineer; the physics of the system's persistence defines the cost function.
  *   **Epistemic Value:** Active inference includes an "exploration" term (information gain) in the cost function explicitly. While dual control exists in engineering, it is rarely implemented; in active inference, reducing uncertainty is mathematically equivalent to tracking error minimization, forcing exploration as a control objective.

  ### The Setpoint and Existence Question

  You are right: "action serves perception" is indeed control theory speak for "action minimizes the error between sensed data and endogenous priors." The reference signal is internal, encoding homeostatic bounds (e.g., body temperature, glucose levels) rather than an external command.

  However, this does not mean Friston is merely dressing up tracking error. The critical divergence is teleological. In your toolkit, if the setpoint is unreachable or the cost function is poorly tuned, the system simply performs poorly; the math does not care if the plant destroys itself. In the Free Energy Principle, minimizing surprise is not just a performance metric; it is a condition for the system's continued existence as a distinct entity. The math is isomorphic to stochastic optimal control, but the *interpretation* claims that biological systems do not just *use* this control structure, but that this control structure is *why* they persist. Control theory describes how to track; Active Inference proposes why there is something there to do the tracking.
