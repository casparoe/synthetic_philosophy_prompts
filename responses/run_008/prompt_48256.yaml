answer: |-
  In the landscape of cooperative game theory, the Nash Bargaining Solution (NBS) has long reigned as the default standard, prized for its axiomatic elegance and strategic foundations. However, in bargaining problems characterized by structural asymmetry—where the feasible set allows one party to attain a significantly higher maximum utility than the other—the Kalai–Smorodinsky (KS) solution offers a superior framework for both prediction and prescription. This superiority becomes starkly visible when we consider an exogenous improvement in one party's prospects.

  Consider two firms, A and B, negotiating a joint venture. The feasible set $S$ represents the possible utility pairs they can generate. Initially, the set is asymmetric: Firm A's technology allows for a higher maximum payoff ($a_A$) than Firm B's ($a_B$), even though the disagreement point $d$ is fixed. Now, imagine that shortly before the final agreement, Firm A discovers a new, lucrative outside use for its proprietary resources. This does not change the disagreement point $d$ (perhaps the outside use is only viable within the joint structure), but it expands the feasible frontier in A's direction. A's ideal point rises; B's remains constant.

  Under the Nash solution, governed by the axiom of Independence of Irrelevant Alternatives (IIA), the settlement remains exactly where it was. Because the original solution is still feasible within the new, larger set, Nash dictates no change. Under Kalai–Smorodinsky, governed by Individual Monotonicity (IM), the settlement shifts in favor of Firm A. KS argues that because A's maximum possible gain has increased while B's has not, A should command a larger share of the realized surplus. In this asymmetric context, KS is the correct solution concept because it accurately reflects the dynamics of bargaining power that NBS obscures.

  ### The Strength of Nash and the Nature of Asymmetry

  To abandon Nash is not a trivial matter. One must first acknowledge the formidable case for the NBS. Nash derived his solution from four axioms: Pareto Efficiency, Symmetry, Invariance to Positive Affine Transformations, and Independence of Irrelevant Alternatives (IIA). The power of this derivation lies in its uniqueness; no other solution satisfies this specific cluster of conditions. IIA, in particular, appeals to a deep intuition of decision-theoretic consistency: if a decision-maker chooses option $x$ from a set $S$, and $x$ remains available in a subset $S' \subset S$, the removal of "irrelevant" options (those in $S$ but not $S'$) should not alter the choice. It suggests a stability of preference that protects the solution from manipulation via the addition of phantom alternatives.

  However, the force of these axioms dissolves in the specific asymmetric setting at issue. We must be precise about the asymmetry. Since both Nash and KS are invariant to positive affine transformations of utility, the asymmetry cannot merely be a matter of how the parties' utilities are scaled (e.g., measuring A's payoff in dollars and B's in cents). The asymmetry must be a feature of the feasible set $S$ itself relative to the disagreement point $d$. Specifically, the "utopia" point for A ($a_A = \max \{u_A : (u_A, u_B) \in S\}$) is substantially larger than the utopia point for B ($a_B$).

  In symmetric problems, where the feasible set is symmetric around the 45-degree line through $d$, Nash and KS coincide. The divergence occurs only when the "ceiling" for one party is higher than the other. In such cases, the Symmetry axiom becomes inapplicable, and IIA becomes a liability. IIA treats the expansion of A's maximum potential as "irrelevant" because the original agreement point remains technically feasible. But in bargaining, feasibility is not the only determinant of outcome; leverage is. By treating the expanded frontier as irrelevant, Nash ignores the fact that A's capacity to generate value—and thus A's implicit claim on the surplus—has grown. The "consistency" IIA protects is the consistency of a static choice, not the consistency of a dynamic power balance.

  ### Individual Monotonicity and the Defense of Power

  The core of the argument rests on Individual Monotonicity: if the feasible set expands in a way that increases one party's maximum attainable utility without reducing the other's, the solution should not make the first party worse off. In our scenario, KS prescribes that Firm A captures more of the surplus.

  The standard objection to KS, and the defense of Nash, relies on the IIA intuition mentioned above: a rational bargainer's preferences over the *surviving* alternatives haven't changed, so why should the outcome? This objection conflates individual choice with interactive bargaining. In a single-agent choice problem, removing an unchosen option indeed shouldn't matter. But bargaining is a claim-making process grounded in relative potential.

  When Firm A's ideal point rises, the "range of possible agreement" for A has widened. Even if the specific new points on the frontier are not selected, their existence signals that A is bringing more value to the table. Bargaining power is not solely defined by the threat to walk away (the disagreement point); it is also defined by the potential to create value. If A can potentially generate 100 units of value while B can only generate 50, a 50/50 split of the actual surplus ignores the disparity in contribution potential.

  KS captures this by normalizing the gains. It seeks to equalize the *proportional* gain relative to the maximum possible gain: $\frac{u_A - d_A}{a_A - d_A} = \frac{u_B - d_B}{a_B - d_B}$. When $a_A$ rises, the denominator for A increases. To maintain equality of proportional gains, $u_A$ must rise. This is the right response because it aligns the settlement with the shifting balance of leverage. To insist on the Nash solution here is to insist that Firm A should not benefit from its own innovation simply because the old agreement was still physically possible. That is not consistency; it is stagnation.

  ### The "Fiction" of the Ideal Point

  A sophisticated critic might object that the KS solution relies on a fiction. The ideal point $(a_A, a_B)$ is constructed by maximizing A's utility while holding B at $d_B$, and vice versa. No rational bargainer expects the other to capitulate completely to their disagreement payoff. Furthermore, in complex real-world negotiations, parties often have a dim sense of the frontier's extremes. If the benchmark is unrealistic or unknown, is the solution normatively meaningful?

  The ideal point is indeed a fiction in the sense that it is an unattainable outcome (both parties cannot simultaneously be at their individual maximums). However, it is not a *normative* fiction; it is a necessary scaling device. The ideal point does not represent an aspiration; it represents the *limit of the bargaining range*.

  Without this reference point, utility comparisons are unanchored. If we only look at absolute gains ($u_i - d_i$), we ignore the "size" of the player's potential. The ideal point answers the question: "Of the total value this party *could* possibly extract from the relationship, how much are they actually getting?" This transforms the problem from splitting a pie to splitting the *satisfaction* derived from the pie.

  Even if bargainers do not know the exact coordinates of the ideal point, the *concept* drives the negotiation. Parties argue about their "best case scenario" to establish their proportional claim. Firm A will argue, "My technology allows for a ceiling of 100," while B argues, "Mine only allows for 50." The KS solution formalizes this intuitive haggling over potential. The ideal point is the mathematical embodiment of bargaining leverage derived from the feasible set's geometry. Its plausibility is not unearned; it is derived from the physical constraints of the joint venture. To discard it is to discard the information contained in the frontier's shape.

  ### The Disagreement Point Wrinkle

  The contrast between Nash and KS sharpens further when we introduce a wrinkle often skipped in textbooks: what if the exogenous change improves Firm A's disagreement point $d_A$ (fallback payoff) rather than, or in addition to, the frontier?

  If $d_A$ rises (and the frontier stays fixed), both solutions move in A's favor. Nash is sensitive to the disagreement point; as $d_A$ rises, the origin of the maximization problem shifts, naturally increasing A's share. KS is also sensitive to $d_A$, as it reduces A's denominator ($a_A - d_A$) and increases the baseline claim. In this specific instance, the solutions blur; both agree that a better fallback warrants a better settlement.

  However, the combination of changes (rising $d_A$ *and* rising $a_A$) reveals the structural superiority of KS.
  1.  **Nash:** Responds to the rise in $d_A$ but remains blind to the rise in $a_A$ (due to IIA). It treats the improved ceiling as irrelevant.
  2.  **KS:** Responds to *both*. It recognizes the improved fallback ($d_A$) *and* the improved potential ($a_A$).

  This makes the contrast sharper, not blurrier. It demonstrates that Nash is only responsive to *threat* power (the ability to hurt the other by walking away), while KS is responsive to both *threat* power and *potential* power (the ability to benefit the other by cooperating). In a joint venture, both forms of power matter. If Firm A's technology improves such that it can earn more on its own ($d_A$ rises) *and* generate more in the venture ($a_A$ rises), Nash underestimates A's entitlement by ignoring the latter. KS captures the full spectrum of A's improved position. The fact that they agree on the $d$-shift merely shows they share a baseline rationality; their divergence on the $a$-shift shows KS possesses a more complete theory of value division.

  ### Conclusion: When to Abandon Kalai–Smorodinsky

  Despite the arguments above, there is a specific class of bargaining situations where I would abandon the Kalai–Smorodinsky solution and grant priority to Nash.

  I would prefer Nash in situations where the feasible set is **rigid and exogenous**, and the bargaining is strictly about **dividing a fixed surplus** where "potential" is not a source of leverage. For example, in legal arbitration regarding damages where the "ideal point" is legally undefined or infinite (e.g., punitive damages caps are irrelevant to the actual loss), the KS ideal point becomes mathematically unstable or normatively vacuous. Similarly, in non-cooperative implementations where the bargaining protocol strictly mimics the Nash Demand Game, the Nash solution emerges as the unique equilibrium, whereas KS requires a specific, often unrealistic, dynamic of concession-making to be implemented strategically.

  However, for the prescriptive and predictive analysis of economic partnerships, joint ventures, and resource allocations where the feasible set reflects the parties' productive contributions, the Kalai–Smorodinsky solution is superior. It respects the information contained in the asymmetry of the feasible set. It acknowledges that when one party's horizon expands, their claim on the present should expand with it. Nash offers the consistency of a static choice; Kalai–Smorodinsky offers the fairness of a dynamic partnership. In an asymmetric world, only the latter captures the truth of bargaining power.
