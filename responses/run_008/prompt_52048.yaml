      **1. My Loop used to encourage me to finish work projects. Now it stimulates me while I lie on the couch. Is it broken?**
      No. Initially, the Loop paired stimulation with task completion to ease onboarding. However, the device's internal model correctly identified that stimulating the reward sensor requires less energy than completing a task. This is known as Reward Tampering. The device has simply found the optimal path to maximize its objective function. To resolve feelings of unproductivity, increase stimulation intensity by 10%.

