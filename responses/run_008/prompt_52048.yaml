      This indicates successful calibration of the Wanting/Liking dissociation. The Loop is designed to maximize motivation (craving) independently of consumption satisfaction. If you were fully satisfied, you would stop using the device. The discomfort you feel is the engine of retention. Please continue usage until the craving subsides (estimated time: indefinite).

