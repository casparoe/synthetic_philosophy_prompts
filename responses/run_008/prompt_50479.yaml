          *   Content: Idealized, typological (reliving Christ/earlier saints), pre-conversion sin vs. post-conversion perfection, miracles.
          *   Goal: Template for imitation, spiritual edification, not necessarily historical accuracy.
          *   Nature of Subjects: Static perfection post-conversion, no doubt/development, off-distribution events (miracles).

  3.  **Drafting the Translation (ML Vocabulary):**
      *   *Plutarch:*
          *   Paired Lives + Comparison: Controlled contrast / Ablation study. Holding "context/task" roughly constant while varying "parameters/character."
          *   Anecdotes vs. Events: High-frequency, low-dimensional signal (micro-decisions) vs. high-dimensional, noisy outcomes (macro-success). Claim: Character signal is in the residuals of small interactions, not the aggregate reward of battles.
          *   Emulation: Not Behavioral Cloning (BC). BC copies actions ($ \pi(a|s) $). Plutarch wants reward modeling ($ r(s,a) $) + RL fine-tuning, or Inverse Reinforcement Learning (IRL) to recover the underlying utility function, then optimize own policy.
          *   Flawed Figures: Noisy demonstrations. Requires robust learning algorithms (e.g., DAgger, or learning from imperfect experts).
      *   *Hagiography:*
          *   Training Corpus: Highly curated, low-entropy.
          *   No Variance: Deterministic policy after conversion.
          *   No Negative Labels: Censored data (only success shown).
          *   No Recovery from Failure: Trajectory truncated at conversion; pre-conversion is "noise," post-conversion is "optimal."
          *   Off-Distribution Events: Miracles are out-of-distribution (OOD) samples relative to human capability.
          *   Goal: Behavioral Cloning of an idealized policy, but the policy is unreachable for the learner.

  4.  **Developing the Residue Report:**
      *   *Clean Translation:* Data curation, signal-to-noise ratio in anecdotes, the risk of OOD data (miracles).
      *   *Distorted Translation:* "Emulation" vs. BC. Plutarch isn't just optimizing a reward function; it's about *habitus* (dispositional state), which is harder to map than a policy. Hagiography isn't just "bad data"; it's *performative* data (invoking grace), not just descriptive.
      *   *Missing Vocabulary:* Teleology (purpose-driven history), Grace/Divine Intervention (external reward signal/optimizer), *Phronesis* (practical wisdom vs. policy optimization).
      *   *Implication:* ML assumes the learner is a closed system optimizing a function. Ancient traditions assume the learner is an open system being transformed by an external agent (God, Reason, Tradition).

