      *   *Hypothesis:* Hagiography fails like a perfect demonstrator (no coverage of learner's state distribution, specifically the "sinner mid-fall" state). Plutarch succeeds by covering the space with flawed figures and contrasts.
      *   *Evaluation:*
          *   *Faithful aspect:* Yes, in IRL/BC, if the expert never visits the states the learner visits (e.g., error states, temptation states), the learner cannot recover (covariate shift). Hagiography hides the "loss landscape" of sin.
