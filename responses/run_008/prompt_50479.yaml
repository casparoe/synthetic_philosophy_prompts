      *   *Check:* Did I imply Hagiography is "wrong"? *Correction:* Frame it as "mismatched objective." Hagiography aims for sanctification (external optimization), Plutarch for virtue (internal optimization).
      *   *Check:* Is the "Residue" section distinct? *Yes, make sure it's clearly labeled.*
      *   *Check:* The user's hypothesis about "sinner mid-fall." *Crucial point:* Hagiography *does* show the sinner mid-fall (pre-conversion), but it treats it as a distinct regime (pre-grace vs. post-grace). The gap is the conversion event. I need to highlight that the "policy" changes discontinuously.

  9.  **Final Polish:** Ensure the vocabulary matches the prompt's density (policies, demonstrations, distribution shift, etc.). (Self-correction: Ensure I don't overuse jargon to the point of obscurity, but maintain the requested register.)

  *(Self-Correction on the Hypothesis)*: The user suggests Hagiography fails because the learner's state distribution isn't covered. Specifically, "a sinner mid-fall has no demonstrated policy for that state." Actually, Hagiography *does* show the sinner mid-fall (the pre-conversion life). But it shows a *random* or *adversarial* policy there, then switches to an *optimal* policy. The issue is the *transition* isn't learnable by imitation. It requires an external update (Grace). Plutarch shows gradual gradient descent. This is a key distinction to make.

