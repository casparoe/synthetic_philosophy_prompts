      *   **Task:** Translate two ancient moral-learning traditions (Plutarch's *Parallel Lives* and Christian Hagiography) into ML terminology *faithfully*, without forcing ML assumptions onto the history. Then, provide a "residue report" (what fits, what distorts, what's missing). Finally, stress-test a specific hypothesis about why Hagiography might fail as training data compared to Plutarch (perfect demonstrator vs. coverage of state space).
      *   **Key Constraints:** Do not smuggle ML assumptions as historical fact. Be precise with ML terms. Address the "Residue Report" explicitly. Evaluate the user's hypothesis critically.

  2.  **Deconstruct the Source Material (Historical/Philosophical):**
