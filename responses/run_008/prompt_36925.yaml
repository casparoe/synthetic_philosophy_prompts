  9.  **Final Polish:** Check for clarity and flow. Ensure the distinction between "Authoritarianism" and "Genocidal Total War" is clear, as that's the crux of the empirical slack. (Self-correction: Make sure to mention that most historians actually agree on a synthesis now, so the seminar is fighting a ghost war from the 1980s).

