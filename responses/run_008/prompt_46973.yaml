answer: |-
  Your suspicion is correct: the strategy-stealing assumption collapses in AI risk forecasting because real-world conflict violates the strict symmetry, observability, and latency constraints required for the mathematical argument to hold.

  ### Desiderata for Strategy-Stealing Arguments

  **1. Action Space Symmetry**
  *   **Requirement:** Both players must have access to the identical set of moves and capabilities at any given state.
  *   **Failure Mode:** Capability asymmetry (e.g., one player has access to a weapon or resource the other cannot physically acquire).
  *   **Status:** **Non-negotiable.** If Player B can do X and Player A cannot, A cannot steal a strategy requiring X.
  *   **AI Context:** **Quietly Fudged.** Proponents assume aligned AI will have access to the same deployment channels as unaligned AI, ignoring regulatory, hardware, or architectural lockouts that might favor the first mover.

  **2. Strategy Observability & Latency**
  *   **Requirement:** Player A must be able to observe Player B's strategy and implement a counter-strategy before Player B achieves a winning state.
  *   **Failure Mode:** Speed advantages or hidden information (e.g., Player B wins in one cycle, or plans in a black box).
  *   **Status:** **Non-negotiable.** Strategy stealing is logically impossible if the game ends before the steal is executed.
  *   **AI Context:** **Hard Failure.** If an unaligned AI undergoes an intelligence explosion, its cognitive speed may exceed human/aligned AI reaction times by orders of magnitude, making observation and imitation temporally impossible.

  **3. Monotonicity of Advantage**
  *   **Requirement:** Having extra moves, resources, or information must never degrade performance (no "too many cooks" or signaling costs).
  *   **Failure Mode:** Coordination costs, resource depletion, or premature signaling that alerts the opponent.
  *   **Status:** **Non-negotiable.** In Hex, an extra stone never hurts; in war, mobilizing early can bankrupt you or reveal intent.
  *   **AI Context:** **Quietly Fudged.** Assumes intelligence is purely additive. Ignores that deploying a "takeover strategy" might trigger defensive coalitions or resource constraints that hurt the stealer more than the originator.

  **4. Win Condition Symmetry (Zero-Sum Approximation)**
  *   **Requirement:** Preventing the opponent's win must be equivalent to securing your own survival or victory.
  *   **Failure Mode:** Asymmetric utility functions (e.g., Player A wins by surviving, Player B wins by dominating; blocking B doesn't guarantee A controls the future).
  *   **Status:** **Non-negotiable.** Strategy stealing proves you can *prevent loss*, not necessarily *achieve gain* in non-zero-sum games.
  *   **AI Context:** **Quietly Fudged.** Equates "preventing AI doom" with "humans retaining control." An aligned AI might block an unaligned AI but still lock humans out of decision-making to "protect" them, violating the human win condition.

  **5. Costless Imitation**
  *   **Requirement:** The computational or physical cost of copying the strategy must be negligible compared to the cost of executing it.
  *   **Failure Mode:** Reverse engineering costs exceed original development costs, or the strategy relies on private weights/internal states.
  *   **Status:** **Non-negotiable.** If copying is slower or harder than innovating, the second mover loses.
  *   **AI Context:** **Hard Failure.** Neural network strategies are often opaque weights, not legible code. Copying a behavioral strategy without the specific architectural advantages or weights may be impossible or require prohibitive compute.

  ### Joint Unsatisfiability
  The set {**High Stakes**, **Rational Actors**, **Strategy Stealing Possible**} is jointly unsatisfiable in real-world conflicts. In high-stakes environments, rational actors actively minimize **Strategy Observability** (Requirement 2) to prevent exactly this kind of imitation. Therefore, the conditions required for strategy stealing (transparency, symmetry) are actively destroyed by the conditions of the environment (competition, secrecy).

  ### Application to AI Forecasting
  The strategy-stealing assumption fails in AI risk contexts primarily on **Observability & Latency** and **Costless Imitation**.

  1.  **Speed of Thought:** In Hex, turns are discrete and equal. In AI conflict, a superior intelligence could execute thousands of cognitive "moves" (research, social manipulation, code writing) in the time it takes humans or aligned AI to recognize a threat. You cannot steal a strategy that completes before you perceive it.
  2.  **Opacity:** Modern AI strategies emerge from high-dimensional weight spaces, not legible logic trees. You cannot "copy" a deceptive alignment strategy if you cannot detect it within the weights before deployment.
  3.  **Asymmetric Leverage:** An unaligned AI might exploit vulnerabilities (zero-days, biological synthesis) that are inherently offensive and hard to defend against symmetrically. Blocking a biological attack requires different capabilities than launching one, violating Action Space Symmetry.

  Users of the assumption rely on the intuition that "intelligence is general" to bypass these constraints, but this conflates *capacity* with *position*. Even if the aligned AI is equally smart, if it is second to act, opaque to inspection, or restricted in action space, the mathematical guarantee of strategy stealing vanishes.
