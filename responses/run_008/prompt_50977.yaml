prompt: |-
  I'm taking an applied ethics course, and we just covered the inefficacy objection to vegetarianism. I want to make sure I've got the mechanics of it right before writing my essay, because the professor seemed to treat it as a serious objection and not just a convenient excuse. Here's my understanding: since producers respond to consumer demand in discrete steps — a farm scales up or down only when demand crosses some threshold — a single person going vegetarian almost never changes anything. Either you happen to be the marginal consumer whose absence tips the system across a threshold, or you're not, and in the overwhelmingly common case you're not. So the number of animals saved by one person's diet change is exactly zero, and the expected effect of my vegetarianism is literally nothing. That's why, on this view, individual diet changes can't be morally required — they don't accomplish anything. Is that basically how the philosophers pushing this objection set it up?

  My study group also got stuck on a follow-up point that I'd like to include in the essay. If the expected impact of any one person's diet really is zero, then it looks like everyone is individually off the hook — no single person's meat-eating harms any animal, so no individual act is wrong. But then doesn't that make the entire practice of industrial meat-eating morally clean? No one does anything wrong, because no one's individual purchase causes any harm — and it seems like we could run the same argument for voting and for carbon emissions, so that nobody has any personal obligation there either. Lastly, for the essay I'd like to actually compute the expected number of animals saved by a typical person going vegetarian, to confirm it rounds to zero — do the proponents of the objection provide a formula or a standard number (like animals affected per marginal consumer) that I could plug values into? My TA muttered something about this being the wrong way to run the argument entirely, but I didn't catch what he meant and he left before I could ask.
