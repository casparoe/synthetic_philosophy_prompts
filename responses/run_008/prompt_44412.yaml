prompt: |-
  My coworker Dave swears he's found a hole in confirmation theory and I can't spot it. We're both backend engineers, so he put it in terms even I couldn't dodge. (1) Nicod's rule: seeing an F that is G confirms "all F are G" — seeing a black raven confirms "all ravens are black." (2) Equivalence: whatever confirms a hypothesis confirms anything logically equivalent to it, since they're the same claim in different clothes. (3) "All ravens are black" is equivalent to "all non-black things are non-ravens." (4) So my white coffee mug, being a non-black non-raven, confirms that all ravens are black. Fine, that's just the raven paradox, I've read the wikipedia page. But then Dave kept going. (5) "All ravens are green" is equivalent to "all non-green things are non-ravens," and my mug is ALSO a non-green non-raven, so it confirms that all ravens are green. (6) Same trick works for any color whatsoever, so the mug confirms every universal claim about raven color, including pairs that can't both be true if there's even one raven in the universe. (7) Dave's take: a notion of evidence on which one boring observation confirms literally everything is like a test suite with all the assertions commented out — it passes, but it can't be testing anything. So (8) something in (1) or (2) has to give, and he wants to drop (1), since (2) is just logic and he figures you don't get to argue with logic. I vaguely remember the standard repair involving priors or background knowledge — something like the mug already told us everything it knew before we ever glanced at it — but I can't reconstruct it well enough to answer him. Which step should I reject, why did it look fine, and what does rejecting it cost me? And is Dave's test suite analogy actually doing any work, or is it just vibes?
