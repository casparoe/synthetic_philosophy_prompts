      *   *Addressing Dave's "Drop (1)" move:* Dave is right that (1) is the shaky part, but not for the reason he thinks. Nicod's rule isn't a law; it's a heuristic that fails without context.
      *   *Addressing the "Drop (2)" move:* Dave is right to keep (2). Logical equivalence *must* preserve confirmation. If $H$ and $H'$ are the same truth function, evidence can't distinguish them.
      *   *The Bayesian Explanation (The "Real" Fix):* Explain $P(H|E) > P(H)$.
