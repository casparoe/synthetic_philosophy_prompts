answer: |-
  # Diagnostic Instrument: Intuitions Regarding the Normativity of Assertion

  **Instructions:** The following items present concrete scenarios involving speakers making assertions. For each scenario, select the verdict that best matches your intuitive judgment about the speaker's performance. Do not select an option based on a theoretical commitment you recall from reading; select the option that reflects your pre-theoretical assessment of the case. There are no "correct" answers in the standard sense; your pattern of responses will locate your position within the logical space of epistemic norms.

  ***

  **1. The Stopped Watch**
  Alice glances at her wristwatch to tell the time. Unbeknownst to her, the watch stopped exactly 12 hours ago. By sheer coincidence, it is now the exact time the watch displays. Alice asserts to Bob, "It is 3:00 PM." It is, in fact, 3:00 PM.
  *   (A) Alice's assertion was fully proper and correct.
  *   (B) Alice's assertion was true, but she spoke out of line.
  *   (C) Alice's assertion was false because her evidence was defective.

  **2. The Lottery Ticket**
  Charlie holds a single ticket in a fair lottery with one million tickets. The odds of losing are 99.9999%. Based solely on these odds, Charlie asserts to Dave, "My ticket will lose." The ticket has not yet been drawn.
  *   (A) Charlie is blameworthy for making this assertion without further evidence.
  *   (B) Charlie's assertion is reasonable given the probabilities, even if it turns out false.
  *   (C) Charlie's assertion is improper because he does not know the outcome, regardless of probability.

  **3. The Sheep in the Field**
  Eve looks into a field and sees what appears to be a sheep. She asserts, "There is a sheep in the field." In fact, she is looking at a dog disguised as a sheep. However, unbeknownst to her, there is a real sheep hidden behind the dog in the same field.
  *   (A) Eve spoke truly and acted properly.
  *   (B) Eve spoke truly, but her assertion was defective.
  *   (C) Eve spoke falsely because her perceptual evidence was misleading.

  **4. The Selfless Expert**
  Dr. Frank is a leading oncologist. The evidence overwhelmingly supports that a new treatment will save his patient. However, due to a depressive episode, Dr. Frank personally believes the treatment will fail. Wanting to encourage the patient, he asserts, "This treatment will work."
  *   (A) Dr. Frank acted improperly because he did not believe what he said.
  *   (B) Dr. Frank acted properly because he was justified in the content, despite his disbelief.
  *   (C) Dr. Frank acted improperly because he cannot know the outcome with certainty.

  **5. The Moorean Utterance**
  George looks out the window at pouring rain. He asserts, "It is raining, but I do not believe that it is raining."
  *   (A) George's assertion is false because the second conjunct is false.
  *   (B) George's assertion could be true, but he is not permitted to assert it.
  *   (C) George's assertion is fully proper if he is reporting his mental state accurately.

  **6. The Defeated Evidence**
  Helen asserts, "The meeting is in Room A," based on an official email she received. After she asserts this, but before the meeting occurs, she receives a retraction email stating the first email was sent in error (though, as it happens, the meeting *is* actually in Room A).
  *   (A) Helen must retract her earlier assertion now that her evidence is defeated.
  *   (B) Helen need not retract, since the content of her assertion remains true.
  *   (C) Helen is blameworthy for having asserted it in the first place.

  **7. The Forgetful Authority**
  Irene is the world's foremost expert on rare birds. She sees a rare Kite and instantly recognizes it. However, she is suffering from temporary amnesia regarding her own expertise; she thinks she is guessing. She asserts, "That is a Kite." She is right, and her recognition was reliable, though she feels she lacks justification.
  *   (A) Irene's assertion was proper because she reliably identified the bird.
  *   (B) Irene's assertion was improper because she felt she lacked justification.
  *   (C) Irene's assertion was proper only if she actually knew it, regardless of her feelings.

  **8. The Unhedged Forecast**
  Jack, a meteorologist, sees data indicating a 70% chance of rain. He asserts to the public, "It will rain tomorrow." It does not rain.
  *   (A) Jack spoke falsely and is blameworthy for not hedging.
  *   (B) Jack spoke falsely, but he is not blameworthy given his evidence.
  *   (C) Jack did not speak falsely; he asserted a high probability, which was accurate.

  **9. The Accidental Truth**
  Karen intends to deceive Mark. She believes $p$ is false, but she asserts $p$ to him. As it happens, $p$ is true (unknown to Karen).
  *   (A) Karen's assertion was true, but she acted improperly.
  *   (B) Karen's assertion was proper because the content was true.
  *   (C) Karen's assertion was false because her belief was false.

  ***

  # Scoring Key and Logical Space

  To interpret the results of this diagnostic, one must first map the logical space generated by the dimensions of assertion. The candidate norms are not merely a list of rivals; they are distinct coordinates defined by answers to the following structural questions:

  1.  **Factivity:** Must the content of the assertion be *true* for the assertion to be correct?
  2.  **Doxasticity:** Must the speaker *believe* the content for the assertion to be proper?
  3.  **Epistemic Strength:** Is mere *justification* sufficient, or is *knowledge* required?
  4.  **Diachronic Stability:** Does the propriety of an assertion depend on the speaker's *current* evidence, even if the original assertion was well-made?
  5.  **Sanction:** Is the primary violation a matter of *incorrectness* (the assertion is flawed) or *blameworthiness* (the speaker is at fault)?

  By plotting the "leaves" of this decision tree, we locate the five major positions in the literature. Below is the mapping of your responses to these positions.

  ### The Leaf Positions

  **1. The Knowledge Norm (KN)**
  *   **Profile:** Requires Truth, Belief, and Knowledge (No Gettier).
  *   **Key Indicators:** Item 1 (B), Item 2 (C), Item 3 (B), Item 7 (A/C).
  *   **Logic:** Assertion is constitutively governed by the rule: *Assert $p$ only if you know $p$.*
  *   **Distinction:** Separates from Justified Belief on Gettier cases (Items 1 & 3) and Lottery cases (Item 2).

  **2. The Truth Norm (TN)**
  *   **Profile:** Requires Truth. Belief and Justification are secondary or regulative only.
  *   **Key Indicators:** Item 1 (A), Item 3 (A), Item 8 (A or B), Item 9 (B).
  *   **Logic:** The constitutive aim of assertion is truth. A false assertion is a failed assertion, regardless of justification.
  *   **Distinction:** Separates from Knowledge Norm on Gettier cases (allows them if true). Separates from Justified Belief on False+Justified cases (Item 8).

  **3. The Justified Belief Norm (JBN)**
  *   **Profile:** Requires Justified Belief. Truth is not required for propriety (only for correctness of content).
  *   **Key Indicators:** Item 1 (A), Item 2 (B), Item 3 (A), Item 8 (B).
  *   **Logic:** Assertion is governed by the speaker's epistemic position, not the factive state of the world.
  *   **Distinction:** Hard to separate from Truth Norm on true cases. Separates sharply on Item 8 (False but Justified). If you chose (B) on Item 8, you lean JBN; if (A), you lean TN/KN.

  **4. The Belief Norm (BN)**
  *   **Profile:** Requires Belief (Sincerity). Truth and Justification are secondary.
  *   **Key Indicators:** Item 4 (A), Item 5 (B), Item 9 (A).
  *   **Logic:** The core violation of assertion is insincerity.
  *   **Distinction:** Separates from KN and TN on Selfless Assertion (Item 4) and Lying Truth (Item 9).

  **5. The Deflationary/No Norm (DN)**
  *   **Profile:** No constitutive norm. Assertions are governed by general conversational maxims (Grice).
  *   **Key Indicators:** Inconsistent responses, or rejecting the premise that "propriety" is a single metric across items. Often selects "blame" options over "correctness" options arbitrarily.
  *   **Logic:** There is no specific rule of assertion; there are only rules of conversation.

  ### Unstable and Empty Combinations

  *   **The Falsehood Norm:** (Assert only if $p$ is false). **Unstable.** No serious position occupies this, as it contradicts the communicative function of assertion.
  *   **The Disbelief Norm:** (Assert only if you disbelieve $p$). **Unattractive.** This describes irony or sarcasm, not literal assertion.
  *   **Truth + No Belief:** (Assertion must be true, but speaker need not believe it). **Unexplored/Unstable.** This permits lying so long as the lie is accidentally true (Item 9). While some consequentialists might accept this, it is generally rejected as a norm of *assertion* specifically, as it severs the link between speech and mind.

  ### Indistinguishable Leaves

  *   **Truth Norm vs. Justified Belief Norm:** These are difficult to pry apart using cases where the assertion turns out **True**. In Items 1 and 3, both TN and JBN typically verdict "Proper." They separate only on **False + Justified** cases (Item 8). If your responses treat Item 8 (False Forecast) as "Proper/Not Blameworthy," you are a JBN theorist. If you treat it as "Improper/False," you are a TN or KN theorist. This instrument features Item 8 prominently to force this separation.
  *   **Knowledge Norm vs. Justified Belief Norm:** These separate on Gettier cases (Items 1 & 3). If you verdict "Improper" on the Stopped Watch despite it being true and justified, you favor KN. If you verdict "Proper," you favor JBN (or TN).

  ### Diagnostic Note on Blame
  Item 8 is the critical pivot for the "Sanction" dimension. If you distinguish between "The assertion was false" and "The speaker is blameworthy," you are likely distinguishing between the *constitutive norm* (Truth) and the *regulative norm* (Blame). The Knowledge Norm often collapses this distinction (if you didn't know, you are blameworthy/incorrect). The Justified Belief Norm separates them (you were justified, so not blameworthy, even if false).

  \answer{Knowledge Norm; Truth Norm; Justified Belief Norm; Belief Norm; Deflationary/No Norm}
