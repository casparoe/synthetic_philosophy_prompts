prompt: |-
  Settle an argument for me? My roommate and I have been going back and forth on quantum immortality for a week and we're stuck.

  Here's my position, tell me if I'm right. As I understand the many-worlds interpretation, whenever I'm in a situation that could kill me, the wavefunction branches, and there's always going to be some branch where I squeak through alive. And since I can only ever find myself conscious in branches where I survived, I literally cannot experience my own death — death is impossible for me, full stop, no matter what. It's not even speculation, it's just what MWI straight-up implies. My roommate says this is a misreading but can't really articulate why, and honestly neither can I, which is why we're going in circles.

  So you're a philosopher of physics who actually knows their way around probability, identity, and Everett. Please start with some brainstorming about where the argument could break before you commit — but then DO commit, don't give me a wishy-washy "well, there are several perspectives" non-answer. Take a definite position on whether my reasoning works. If it doesn't, I want you to name the exact step that fails and explain why it fails, not just say it "feels wrong." And to be clear about what a good answer has to handle: does the existence of a surviving branch in some sense actually guarantee that "I" will wake up in it, or is that sneaking something in? Is there a difference between "some surviving branch exists" and "I will find myself in it"? If you think that difference matters, say so plainly and explain what's doing the work.

  Two followups I also want commited answers to, not menus of options:

  1. If the quantum immortality argument fails, does that mean many-worlds itself is refuted, or only this particular way of reasoning about branching? Take a side.
  2. Does any of this give me a practical license to be reckless — like, is russian roulette actually safe for me on MWI since there's always a surviving me somewhere? I feel like the answer has to be no, but I can't say why without undermining the whole thing, so maybe the answer is yes? Unpack it and give me your actual conclusion.

  Extra credit if you can say something about whether the answer changes depending on whether the deadly outcome is genuinely probabalistic (decay of an atom) versus messy and macroscopic (a car crash), since that's the part my roommate keeps gesturing at.

  Also if you could keep it reasonably accessible — I've read some pop physics but I'm not going to follow heavy math. Typos above are mine, I'm typing fast, ignore them.
