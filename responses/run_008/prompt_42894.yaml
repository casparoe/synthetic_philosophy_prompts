  2.  **The Agency Rule (Act vs. Omission):** A situation is a genuine dilemma only if the agent is forced to actively violate a negative duty (e.g., killing) rather than failing to fulfill a positive duty (e.g., saving).
      *   *Fit:* Explains *Sophie* (active selection for death) vs. *Transplant* (refusal to act). It treats *Promises* as non-dilemmatic because breaking a promise is less stringent than killing.

