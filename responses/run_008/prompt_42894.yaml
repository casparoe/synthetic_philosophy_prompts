  **The Implicit Rule: The Unavoidable Wrongdoing Principle**
  The rule Elena appears to be running is what we might call the **Unavoidable Wrongdoing Principle**. Under this framework, a situation counts as a *genuine moral dilemma* only if every available course of action leaves the agent with unavoidable moral residue (guilt, blame, or the violation of a stringent duty). If there is even one path that allows the agent to act without committing a substantive wrong—often through procedural fairness or by adhering to a negative duty—the situation is merely a difficult choice, not a dilemma.

  *   **Why it fits the track record:**
      *   **Trolley & Transplant:** There is a clearly right answer (divert; refuse). Choosing it incurs no wrongdoing.
      *   **Two Promises:** Symmetry allows for a coin flip. The flip discharges the obligation fairly; the apology handles the residue. No wrongdoing remains.
      *   **Sophie's Choice:** Every option violates the profound duty of a mother to protect her child. Wrongdoing is unavoidable.
      *   **Sartre's Student:** No objective fact determines the right path; any choice abandons a profound value. Wrongdoing (or at least moral loss) is unavoidable.

  **Alternative Rules**
  Two other rules fit her past verdicts equally well but diverge on the ventilator case:

  1.  **The Harm Threshold Rule:** A situation is a genuine dilemma if the outcome involves irreversible, severe harm (specifically death), regardless of procedure.
