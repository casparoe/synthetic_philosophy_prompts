answer: |-
  Here is a dissection of the proverb "charity begins at home," broken down into distinct philosophical claims. I have ordered them from the weakest (mere description of human behavior) to the strongest (competing moral theories that directly challenge your premise).

  ### 1. The Psychological Heuristic
  *   **The Claim:** Human beings are evolutionarily wired to feel stronger empathy for those physically proximate to them; therefore, prioritizing local aid is a natural psychological impulse.
  *   **Classification:** **Platitude.** This is a descriptive claim about human psychology, not a normative claim about morality.
  *   **Impact on Argument:** **Explains Reluctance.** Even if true, this does not defeat your argument. Singer's point is precisely that we *ought* to overcome this bias, just as we overcome the bias to keep our shoes dry. It explains why your opponent *feels* you are wrong, but not why you *are* wrong.

  ### 2. The Empirical Efficiency Claim
  *   **The Claim:** A unit of resources (money, time) produces more tangible good when deployed locally than when sent abroad due to lower logistical overhead and corruption risks.
  *   **Classification:** **Straightforwardly False (in most contexts).** Data from effective altruism research generally demonstrates that a dollar saves more lives in extreme global poverty than in developed nations.
  *   **Impact on Argument:** **Would Defeat (if true).** If local aid were objectively more efficient, your analogy would fail on practical grounds. However, because this is empirically dubious, relying on it makes the argument vulnerable to fact-checking.

  ### 3. The Epistemic Certainty Claim
  *   **The Claim:** We can verify local needs with high certainty (we see the drowning child), whereas distant aid involves opacity, uncertainty of outcome, and potential fraud (the "muddy shoes" are guaranteed, the saved life is probabilistic).
  *   **Classification:** **Substantive Thesis.** This highlights a disanalogy between the pond case (direct rescue) and the charity case (indirect contribution).
  *   **Impact on Argument:** **Weakens the Analogy.** It does not prove you have *no* obligation to distant strangers, but it suggests the obligation is weaker because the causal chain is less certain. It forces you to argue for probabilistic duties, which is harder than arguing for certain rescue.

  ### 4. The Civic Reciprocity Claim
  *   **The Claim:** Prioritizing one's local community maintains the social fabric and trust networks that make any cooperation (including future charity) possible. Ignoring "home" to save "away" erodes the local systems that sustain moral agents.
  *   **Classification:** **Substantive Thesis.** This is a rule-utilitarian or communitarian argument. It suggests that a universal rule of "ignore proximity" would have bad long-term consequences for social stability.
  *   **Impact on Argument:** **Defeats the Argument.** It argues that your principle, if universalized, is self-defeating. It posits a systemic duty to maintain local cohesion that outranks the immediate utility of saving a distant stranger.

  ### 5. The Special Obligations Claim
  *   **The Claim:** We have agent-relative duties to family, neighbors, and co-citizens that are morally weightier than agent-neutral duties to strangers. Distance *does* make a moral difference because relationships create specific debts.
  *   **Classification:** **Substantive Thesis.** This is the standard deontological or communitarian rebuttal to utilitarianism. It rejects Singer's premise that impartiality is the only moral standard.
  *   **Impact on Argument:** **Defeats the Argument.** This directly contradicts your core premise that "distance cannot make a moral difference." If accepted, it validates the opponent's position that local duties legitimately trump distant ones, regardless of efficiency.

  ### 6. The Supererogation Claim
  *   **The Claim:** Aiding distant strangers is *praiseworthy* (supererogatory) but not *required* (obligatory). The pond case is a duty because the cost is trivial; the charity case is a gift because the cost involves ongoing sacrifice of life plans.
  *   **Classification:** **Substantive Thesis.** This challenges your classification of the act. It argues there is a threshold where "preventing bad" shifts from a duty to a choice.
  *   **Impact on Argument:** **Defeats the Argument.** It attacks your conclusion that we are "equally obligated." It grants that giving is *good*, but denies that it is *mandatory*, thereby protecting the opponent from the charge of immorality without denying the value of charity.

  ***

  ### Note on Your Opponent's Strategy
  Your opponent was most plausibly invoking a conflation of **#1 (Psychological Heuristic)** and **#5 (Special Obligations)**.

  By delivering the phrase as though it "settled the matter," she was treating a **Platitude** (how people naturally feel) as if it were a **Substantive Thesis** (how people morally ought to act). This is a common rhetorical move: she relied on the coach's intuition that #1 is true to smuggle in the claim that #5 is true.

  **How to counter this in practice:**
  Do not attack the proverb itself. Instead, force her to choose which claim she is making.
  *   *"Are you saying we **feel** more for locals (Claim 1), or that we **owe** more to locals (Claim 5)?"*
  *   If she says **feel**: Remind the judge that ethics is about overcoming bias, not following it.
  *   If she says **owe**: Ask her to justify why geography creates moral debt, and whether that debt holds if the local need is minor (a scratched knee) and the distant need is mortal (starvation).

  This exposes that "Charity begins at home" is not a single argument, but a placeholder for several distinct claims, most of which crumble under the weight of a dying child.
