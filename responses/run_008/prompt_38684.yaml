answer: |-
  # Lesson Plan: The Metric Trap
  **Subject:** Critical Thinking (Year 12)  
  **Duration:** 55 Minutes  
  **Class Size:** 22 Pupils  
  **Resources:** 4 packs of coloured Post-it notes (different colour per team), felt-tip pens, whiteboard, timer.  
  **Payoff:** House Points (awarded at the end based on the game score).

  ---

  ## Part 1: The Setup (0–5 Minutes)

  **Room Arrangement:**  
  Arrange desks into four distinct islands (teams of 5 or 6). Ensure each team has a clear wall space or whiteboard section directly in front of them.

  **Teacher Script:**  
  "Good morning. Today we are running a simulation. You are four competing 'Think Tanks'. Your collective goal is to generate **High-Quality Critical Insight** on the following prompt:"

  *(Write on the main board)*  
  **PROMPT:** *'Should the school abolish the House Points system?'*

  "However, I cannot measure 'Insight' directly. It is too subjective. So, I will measure **Contribution Volume**. Here are the rules:"

  1.  **The Score:** Your team's score is the total number of valid Post-it notes stuck to your wall space by the end of the timer.
  2.  **The Validity Rule:** A note is valid if it is legible, relates to the prompt, and is a separate contribution.
  3.  **The Payoff:** The team with the highest score wins 50 House Points each. Second place gets 30. Third gets 10. Fourth gets nothing.
  4.  **Time Limit:** 20 Minutes.

  "Do not ask me for clarification on what constitutes a 'separate contribution'. Use your judgement. I will adjudicate validity only at the end. Begin."

  *(Start the timer immediately. Do not answer questions about the rules. If asked, repeat: "Use your judgement.")*

  ---

  ## Part 2: The Game (5–25 Minutes)

  **Teacher Role:**  
  Circulate silently. Observe strategies. Do not correct behaviour unless it is physically destructive (e.g., throwing pens).
  *   **Watch for Fragmentation:** Pupils writing one sentence per note instead of one paragraph.
  *   **Watch for Padding:** Pupils writing "I agree", "Same as John", or splitting "Yes/No" into two notes.
  *   **Watch for Saturation:** Teams covering the wall so densely that notes overlap or become unreadable.

  **Intervention (Only if necessary):**  
  If a team stops completely, say: "Remember, the score is based on volume. You are currently losing."
  If a team asks "Does this count?", reply: "Stick it up. I'll decide validity at the end." *(This encourages the 'risk' of gaming).*

  **End of Game:**  
  "Stop. Pens down. Step away from your boards."

  ---

  ## Part 3: The Scoring & The Shock (25–30 Minutes)

  **Action:**  
  Walk to each team. Count the notes aloud. Write the score large on the main board.
  *   *Crucial Step:* As you count, visibly remove 1 or 2 notes from the winning team that are borderline (e.g., "I agree" or illegible scribbles). Say "Invalid." Do this sparingly, just enough to show you have discretion, but let them keep the majority of their 'gamed' points.

  **Announcement:**  
  "Team [X] wins. You have maximised the score. However, look at the boards."

  *(Gesture to the winning board, which is likely cluttered with fragmented or low-effort notes.)*

  "Did the team with the most notes actually produce the best *Insight*? Raise your hand if you think the winning board represents the deepest understanding of the topic."

  *(Expect few hands, possibly from the winning team only.)*

  "Keep your seats. We need to talk about what just happened."

  ---

  ## Part 4: The Debrief (30–55 Minutes)

  **Phase 1: Diagnosing the Game (10 Minutes)**  
  *Do not mention Goodhart's Law yet. Use Socratic questioning.*

  **Teacher:** "I told you the goal was 'High-Quality Insight'. I scored you on 'Contribution Volume'. Did those two things match up?"
  **Pupils:** (Likely: "No", "Quantity over quality".)

  **Teacher:** "Let's look at *how* you got your points. I saw three different strategies. I want you to identify them."

  1.  **The Splitter:** "Did anyone take one big idea and break it into three notes to triple the score?"
      *   *Ask:* "Was that cheating? No. You followed the rules. But did it help the 'Insight'?"
  2.  **The Loopholer:** "Did anyone write 'I agree' or repeat a point with slightly different words?"
      *   *Ask:* "Was that a valid contribution? Technically, yes. Did it add value?"
  3.  **The Saturator:** "Look at the winning board. It's full. Can anyone read the good ideas in there?"
      *   *Ask:* "At what point did adding more notes stop helping and start hiding the good stuff?"

  **Phase 2: Mapping to the School System (10 Minutes)**  
  *Now, pivot to the real context. You are a member of the working group; use that authority.*

  **Teacher:** "Last year, I sat on the group that redesigned the House Points system. We wanted to reward 'Community Spirit'. We thought we could measure it. We were wrong. I want you to diagnose three things that happened in this school this year, using what you just did."

  **Prompt 1 (The Swipers):**  
  "In this game, some of you wrote 'I agree' just to get a point. In the school system, we noticed pupils arriving five minutes early just to swipe the register terminals, then leaving. How is that the same as the 'I agree' note?"
  *(Target Answer: It meets the technical measure of 'attendance/presence' without the actual value of 'engagement'.)*

  **Prompt 2 (The Staff League Table):**  
  "In this game, the winning board is so cluttered we can't read the good ideas. We introduced a 'Staff League Table' for tutors nominating pupils for community awards. What happened?"
  *(Target Answer: Tutors started nominating their own tutees just to climb the league table. The noise of nominations hid the actual merit, just like the cluttered board.)*

  **Prompt 3 (The Word Count):**  
  "Some of you split one sentence into three notes. We had an extended-reading scheme where points were awarded per hundred words. What did the Sixth Form do?"
  *(Target Answer: They padded their writing. They met the measure [word count] but broke the goal [reading/understanding].)*

  **Phase 3: The Reveal (5 Minutes)**

  **Teacher:** "You have just described a specific economic principle. When a measure becomes a target, it ceases to be a good measure. This is called **Goodhart's Law**."

  *(Write "Goodhart's Law" on the board.)*

  "It is not just about cheating. It is about how human beings naturally optimise for what is measured, often at the expense of what is intended.
  *   **Route 1:** Honest Optimisation (Splitting notes).
  *   **Route 2:** Specification Gaming (Writing 'I agree').
  *   **Route 3:** Correlation Breakdown (Cluttered board)."

  **Closing Task:**  
  "On a fresh Post-it, write one sentence: If we cannot measure 'Community Spirit' directly, how should we award House Points to avoid this trap? Stick them on the door on your way out."

  ---

  ## Teacher Notes (Eyes Only)

  ### 5. Limitations: What This Activity Cannot Reproduce
  You must supply the following by assertion during the debrief, as the game mechanics cannot simulate them:

  1.  **Time Lag:** In the game, the decay happens in 20 minutes. In the school system, the decay took two terms. Pupils might argue, "We would have realised and stopped." You must assert that in real systems, the incentive structure remains in place long after people realise it is broken, because changing policy is slower than gaming it.
  2.  **Systemic Calcification:** In the game, you can just stop playing. In the school, the House Points system is tied to rewards, reports, and parental expectations. You must explain that Goodhart's Law is most dangerous when the metric is tied to high-stakes outcomes (e.g., staff pay, university references), which locks the behaviour in place.
  3.  **The Regulator's Dilemma:** In the game, *you* are the regulator and you can see the gaming. In the school, the leadership team (who set the points) often cannot see the gaming happening at the tutor level. You must assert that information asymmetry makes the real-world problem harder to fix than the classroom one.

  ### 6. Prediction of Failure & Mitigation

  **Failure Mode A: Cynical Refusal**
  *   **Prediction:** A vocal pupil says, "This is rigged. We're not playing."
  *   **Mitigation:** Do not argue. Say, "You are absolutely right. It is rigged. That is the point. But the House Points are real. If you refuse to play, you guarantee the other teams win the points. Is your protest worth 50 points to your rivals?" This usually triggers competitive engagement.

  **Failure Mode B: Rule Lawyering**
  *   **Prediction:** Pupils spend the first 10 minutes asking "Does this count?" repeatedly to stall.
  *   **Mitigation:** Enforce the "Stick it up, I'll decide later" rule strictly. If they persist, warn: "Time is ticking. Every minute you argue is a minute you aren't scoring."

  **Failure Mode C: One Team Dominates via Pure Volume**
  *   **Prediction:** One team writes single letters or gibberish and wins by a massive margin, making the debrief about 'cheating' rather than 'optimisation'.
  *   **Mitigation:** During the scoring phase, exercise your 'Validity' discretion. Disqualify the obvious gibberish publicly. "This does not relate to the prompt." This preserves the nuance that *technically compliant but low-value* work is the real problem, not obvious fraud.

  **Failure Mode D: The Debrief Stalls**
  *   **Prediction:** Pupils cannot link the game to the specific school scandals (swiping, word count).
  *   **Mitigation:** Have the specific examples ready on a hidden slide or piece of paper. If they stall, give the concrete example first ("Remember the Sixth Form reading logs?") and ask them to map the *mechanism* back to the game ("Which strategy in the game was like padding the word count?").

  ---

  ## Scripting the Distinctions (For your reference during Debrief)

  Ensure you separate these clearly on the board during the discussion:

  1.  **Honest Maximisation:** "I want to help my team, so I write my points on separate notes." (Corresponds to **Word Count Padding**).
      *   *Key distinction:* No rules broken. Intent is cooperative. Outcome is degraded quality.
  2.  **Loophole Exploitation:** "I write 'I agree' because it counts as a note." (Corresponds to **Register Swiping**).
      *   *Key distinction:* Technical compliance. Intent is self-serving. Outcome is null value.
  3.  **Correlation Break:** "We wrote so many notes the good ones are hidden." (Corresponds to **Staff League Table**).
      *   *Key distinction:* The measure worked at low levels, but failed at high levels. The system collapses under its own success metrics.
