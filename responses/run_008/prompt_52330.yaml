answer: |-
  First, congratulations on the return to work and the nap-time writing window. What you are describing is exhaustingly familiar to sociologists and psychologists who study gendered labor, even if it feels invisible in the moment. You are right to reject "double standard" as too blunt; it implies a moral hypocrisy, whereas what you're describing is a structural calibration of expectation.

  Here is the breakdown of the existing literature, the economic link you suspected, and a precise conceptual tool you can use.

  ### 1. The Economic Link: Motherhood Penalty vs. Fatherhood Premium
  You asked if this is the same thing as the pay hit. It is the **mechanism** that drives the money, but it is not the money itself.

  *   **The Motherhood Penalty:** Well-documented in economics (Correll, Benard, & Paik, 2007). Mothers are perceived as less competent and committed than childless women, leading to lower hiring rates and salaries.
  *   **The Fatherhood Premium:** The inverse. Fathers are often perceived as *more* committed and stable than childless men, leading to higher wages.

  Your observation is the **social-psychological engine** that powers those economic outcomes. Because your competence baseline is set lower, your basic participation is viewed as "extra commitment" (Premium). Because your wife's baseline is set at maximum, her basic participation is viewed as "minimum requirement," and any deviation (like wanting to work full-time) is viewed as a lack of commitment (Penalty).

  ### 2. The Academic Frameworks
  There isn't one single noun phrase that covers exactly this perceptual phenomenon in all contexts, but three concepts from the literature map onto it precisely.

  **A. Role Congruity Theory (Eagly & Karau)**
  This is the psychological "why." Society holds a stereotype that women are communal (nurturing, caring) and men are agentic (assertive, leading).
  *   **For your wife:** Caregiving is *role-congruent*. It is expected. Doing it generates no surplus credit because it confirms the stereotype.
  *   **For you:** Caregiving is *role-incongruent*. It violates the stereotype in a positive way. Therefore, it is salient and rewarded.
  *   **The result:** Identical behavior is processed as "nature" for her and "choice/effort" for you.

  **B. The Motherhood Mandate (Russo, 1976)**
  This defines the "100% baseline" you noticed. The mandate dictates that a "good mother" must be constantly available and prioritize her child above all else.
  *   **Boundary:** If she works, she is violating the mandate (hence the manager's question about full-time return).
  *   **Boundary:** If you work, you are fulfilling the "Provider" role. If you care for the child, you are "helping" the mother fulfill *her* mandate.

  **C. The Helper Frame vs. Responsible Owner**
  Linguistic analysis of parenting shows fathers are framed as "helpers" or "babysitters" (temporary, optional), while mothers are "managers" or "parents" (permanent, responsible).
  *   **Your Dad's Comment:** Calling it "babysitting" linguistically demotes you from a parent (responsible owner) to a contractor (temporary help). It protects the idea that the child ultimately belongs to your wife's domain.

  ### 3. The Term You Need: "Asymmetric Competence Baseline"
  Since there is no single universally agreed-upon noun for the *perceptual* act itself (most literature describes it rather than naming it), I propose using the term **Asymmetric Competence Baseline (ACB)**.

  This distinguishes it from a "double standard" (which implies unfair rules) by focusing on the *calibration of measurement*.

  **Definition:**
  > **Asymmetric Competence Baseline:** A social-psychological phenomenon wherein the threshold of effort required to demonstrate "competent" or "noteworthy" caregiving is systematically calibrated lower for fathers than for mothers. Consequently, identical caregiving behaviors are attributed to **dispositional virtue** (he is a "good dad") in men, and to **role obligation** (she is "just doing her job") in women.

  **How it differs from a Double Standard:**
  *   A **Double Standard** suggests two different rules (e.g., "Men can be angry, women cannot").
  *   **ACB** suggests one rule (Parenting is good) but two different measuring sticks. You are being measured against "Other Men" (who do nothing); she is being measured against "Ideal Motherhood" (which is impossible).

  **Edges and Boundary Cases:**
  To use this precisely (and avoid slapping it on every argument), you need to know where it applies and where it doesn't.

  *   **The Zone of Application (Routine Maintenance):** Feeding, changing, soothing, night wakes, logistics. This is where ACB is strongest. The baseline for her is 100%; the baseline for you is 10%.
  *   **Boundary Case 1 (Heroic/Emergency):** If a child is in danger and a parent saves them, ACB collapses. Both are praised equally. ACB applies to the *mundane*, not the *exceptional*.
  *   **Boundary Case 2 (Leisure/Play):** If a father takes a child to the park or on a "fun outing," he often receives *more* credit than a mother doing the same (The "Fun Dad" vs. "Nagging Mom" trope). ACB still applies but flips into the "Fatherhood Bonus."
  *   **Boundary Case 3 (Neglect):** If a child is neglected, ACB collapses. Both parents are punished, though often the mother is punished *more* severely for violating the Motherhood Mandate.

  ### 4. Why This Matters for Your Return
  You mentioned your manager called you a "good man" and HR put you in the newsletter. This is **Token Celebratory Fatherhood**. It signals to the workplace that you are an anomaly for doing what is standard for your wife.

  **How to use this concept:**
  1.  **With your Dad:** Don't argue that he's sexist. Argue that his *baseline calibration* is outdated.
      *   *Script:* "I know you call it babysitting, but that implies I'm helping her with her job. I'm not. I'm parenting. The reason it feels like babysitting to you is that you're measuring me against a baseline of zero, but I'm actually operating at 100% when I'm with her."
  2.  **With your Manager/HR:** When they praise you for leaving on time for pickup, reframe it.
      *   *Script:* "I appreciate the recognition, but I want to normalize this. This isn't 'going above and beyond'; it's standard parental logistics. I'd love for the team culture to treat this as baseline for everyone, not just a perk for dads."
  3.  **With your Wife:** This is crucial. The ACB creates resentment because it makes your effort visible and hers invisible.
      *   *Action:* Acknowledge the asymmetry explicitly. "I know I'm getting credit for the night feed because I'm a man, but you've been doing this for 8 months without a newsletter mention. I see the labor that's invisible to everyone else."

  ### Summary
  The phenomenon is **Asymmetric Competence Baseline**.
  It is driven by **Role Congruity Theory**.
  It results in the **Motherhood Penalty** and **Fatherhood Premium**.
  It is sustained by the **Motherhood Mandate**.

  You aren't imagining it. The measuring stick is literally different. The goal isn't necessarily to lower the praise you get (though that would be nice), but to raise the visibility of the labor she does so the baselines eventually converge.
