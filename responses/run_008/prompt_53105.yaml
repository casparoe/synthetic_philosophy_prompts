      *   **The physical description is just another pattern relative to interests.**
          *   → **Leaf: Rainforest Realism** (Every scientifically serviceable pattern is real in a scale-relative way; physical patterns have no exalted status.)
      *   **The physical description is the fundamental anchor independent of taxonomy.**
          *   → Go to Question 2.

  *   **Question 2: The Glider Test (Case 1 & 2)**
      Given a complete cell-by-cell description of a system (e.g., the Game of Life), is a higher-level pattern (e.g., a glider) a fact of the matter in the world independent of an observer, or does its existence depend on the utility of tracking it for a specific purpose?
      *   **Its existence depends on the utility of tracking it (observer-relative).**
          *   → Go to Question 3.
      *   **It is a fact of the matter independent of an observer (observer-independent).**
          *   → Go to Question 5.

  *   **Question 3: The Design Stance Parity (Case 5)**
      Are functional attributions (e.g., "the heart is for pumping") ontologically on the same footing as belief attributions (e.g., "the agent believes it will rain"), or is one a fact of the world while the other is merely a tool?
      *   **They are on the same footing (both are tools/patterns relative to interests).**
          *   → Go to Question 4.
      *   **They are not on the same footing (functions are real, beliefs are tools, or vice versa).**
          *   → **Leaf: Unnamed Combination A** (Diagnosis: Unattractive. Posits an ontological gap between design and intention without a clear metaphysical basis given the previous acceptance of observer-relativity.)

  *   **Question 4: False but Predictive Attribution (Case 3)**
      Consider an observer who predicts a group's behavior reliably by attributing beliefs the observer regards as flatly false (e.g., rain-dance causality). Does the success of this prediction require that the attributed beliefs be by and large true, or can predictive usefulness float free of truth altogether?
      *   **Predictive usefulness can float free of truth altogether.**
          *   → Go to Question 6.
      *   **Predictive success requires the attributions to be approximately true.**
          *   → **Leaf: Unnamed Combination B** (Diagnosis: Incoherent. If patterns are observer-relative tools (Q2), demanding mind-independent truth (Q4) contradicts the initial premise.)

  *   **Question 5: Truth vs. Utility (Case 3)**
      (For those who hold patterns are observer-independent): Does the success of the intentional stance require that the attributed beliefs be by and large true, or is predictive utility sufficient for correctness even if the content is false?
      *   **Predictive utility is sufficient (truth not strictly required).**
          *   → **Leaf: Dennett's Pattern Realism** (Patterns are real objective features, but their reality is constituted by predictive leverage rather than strict correspondence.)
      *   **Attributed beliefs must be approximately true.**
          *   → Go to Question 7.

  *   **Question 6: Marginal Agents (Case 4)**
      Consider a chess engine, a crow, a human infant, and a patient in a persistent vegetative state. Is there a determinate boundary where belief stops, a penumbra of vague cases, or no fact of the matter until an attribution is made?
      *   **No fact of the matter until an attribution is made (indeterminate boundary).**
          *   → **Leaf: Hard Instrumentalism** (Belief talk is a predictive tool; attributions are not apt for truth; boundaries are set by the user.)
      *   **There is a determinate boundary (fact of the matter exists).**
          *   → **Leaf: Unnamed Combination C** (Diagnosis: Merely unexplored. Claims patterns are interest-relative but insists on objective boundaries for their application.)

  *   **Question 7: Fodor's Worry (Case 7)**
      Suppose cognitive science yields local generalizations about attitudes that predict well but do not carve nature at anything worth calling a joint (no neural natural kinds). Does belief talk survive that result intact, survive with downgraded status, or die?
      *   **Belief talk survives intact as an ordinary empirical theory.**
          *   → **Leaf: Fodor-style Realism** (Beliefs are natural kinds; folk psychology is vindicable even without strict reduction.)
      *   **Belief talk dies (or must be replaced by neural description).**
          *   → **Leaf: Eliminativism** (If it doesn't carve joints, it doesn't exist; folk psychology is a false theory.)

  ***

  **Notes on Unoccupied Combinations**

  *   **Unnamed Combination A (Design/Intentional Split):** This position claims intentional and design stances are both observer-relative (Q2) but insists one is real and the other instrumental (Q3). This is marked unattractive because it introduces an ontological distinction without a metaphysical ground once observer-independence is abandoned.
  *   **Unnamed Combination B (Relative Patterns/Truth Requirement):** This position claims patterns are interest-relative tools (Q2) but insists attributions must be true (Q4). This is marked incoherent because "truth" in this context typically implies correspondence to mind-independent facts, which Q2 denies.
  *   **Unnamed Combination C (Relative Patterns/Objective Boundaries):** This position claims patterns depend on our interests (Q2) but insists there is a fact of the matter about where they apply (Q6). This is marked merely unexplored; it requires a theory of "objective interests" not currently standard in the literature.

  **Notes on Inseparable Leaves**

  *   **Dennett's Pattern Realism vs. Hard Instrumentalism:** The tree separates these at Question 6 (Marginal Agents) and Question 5 (Truth vs. Utility). However, in practice, these leaves are nearly inseparable. Dennett insists patterns are "real" because they offer predictive leverage, while the Instrumentalist insists they are "useful" because they offer predictive leverage. Both agree that without the leverage, the pattern vanishes. The distinction rests on whether the word "real" applies to the compression ratio itself. If the seminar discussion finds that "real pattern" just means "optimal compression strategy," these two leaves collapse into a single position labeled differently.
  *   **Dennett's Pattern Realism vs. Rainforest Realism:** The tree separates these at Question 1 (The Physical Anchor). Dennett typically accepts the physical description as the fundamental anchor (Q1: Anchor), whereas Rainforest Realism denies this (Q1: Pattern). However, Dennett's criterion for patternhood (compression relative to interests) is structurally identical to the Rainforest criterion. If Dennett admits that the physical description is itself just a pattern relative to a specific scale/interest (which he sometimes hints at), he slides into Rainforest Realism. The tree treats them as distinct based on the standard reading of Dennett, but the logical space suggests they may be contiguous.
  *   **Hard Instrumentalism vs. Eliminativism:** These are separated at Question 4 (Truth) and Question 7 (Fodor's Worry). The Instrumentalist says belief talk is useful but not true (survives as tool); the Eliminativist says it is false and should be discarded (dies as theory). In practice, both agree that beliefs do not exist as internal causal states. The difference is purely pragmatic (keep the tool vs. drop the tool), not ontological. The tree separates them based on their prescription for scientific practice, not their metaphysical commitment.
