  3. "Where Dickens pushes back"
  However, the lens cracks when we scale up. Singer's expanding circle is a historical, collective project involving institutions, laws, and rights. Scrooge's progress is individual, sentimental, and reliant on supernatural intervention. There is no institutional follow-through in the story; the poor are helped by charity, not justice. This risks reinforcing the very arbitrariness Singer critiques: Scrooge helps the Cratchits because he likes them now, not because they have a right to living wages. His morality is contingent on his feelings, not their status.

  Furthermore, can terror-based morality sustain itself? Singer wants reasons that hold when the ghosts are gone. If Scrooge's morality relies on vivid particulars, what happens when faced with abstract suffering again? Dickens resists the lens here by suggesting that reason alone is too cold to motivate change. This doesn't break the pairing; it makes it productive. It forces students to ask whether Singer's rationalism is psychologically naive. The mismatch highlights the tension between ideal theory (how we should decide) and non-ideal theory (how we actually change). Dickens provides the micro-foundations for Singer's macro-history. We must acknowledge that while Singer describes the destination of moral progress, Dickens describes the messy, emotional vehicle required to get there. The story warns us that without the emotional capacity to care, the rational argument lands nowhere, yet also warns that without structural change, individual charity is insufficient. The 'Ignorance and Want' children represent structural societal failure, yet Scrooge's solution is personal generosity. This highlights the limit of the sentimental model. It is a limitation worth teaching.

  4. "Discussion questions"
  1. Scrooge never argues with the spirits; he only watches. Does moral change require argument, or just attention?
  2. Singer says we expand circles because boundaries are arbitrary. Scrooge expands because he fears death. Is a change driven by fear actually moral?
  3. In the "Ignorance and Want" scene, the children are abstract concepts made concrete. Does this support Singer's view or contradict it?
  4. Scrooge helps the Cratchits specifically, not the poor generally. Is this charity or justice?
  5. If you removed the ghosts and just gave Scrooge Singer's essay, would he change? Why or why not?

  5. "My take"
  The story adds the dimension of imagination to Singer's rationalism. Singer assumes that seeing the truth is enough to motivate action. Dickens argues that seeing the truth requires feeling it first. The story shows that the "expanding circle" isn't just a logical maneuver; it's an act of empathy. Without the capacity to vividly imagine the inner life of the other, the rational argument for their inclusion remains inert. Dickens provides the emotional fuel that allows Singer's engine to run. He reminds us that moral progress is not just about drawing lines correctly, but about caring about what lies within them. The argument gives us the map; the story gives us the will to walk the path. Singer appeals to the head; Dickens appeals to the gut. We need both. Ultimately, they are partners.
