      *Wait, one more check:* The prompt says "lead with your bottom line in the very first sentence — no preamble, no restating my proposal back at me". Okay.

      *Objection Handling:*
      *   CFO: Liquidity. Reply: Liquidity follows relevance. Soft spot: Chicken/egg problem.
      *   GC: Gambling. Reply: Employee compensation plan exemption. Soft spot: Regulatory discretion.
