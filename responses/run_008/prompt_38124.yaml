  # SEMINAR HANDOUT: ADVERSARIAL COLLABORATION FRAMEWORK
  **Topic:** The Knobe Effect (Side-Effect Effect)
  **Goal:** Move from shouting to joint publication.

  ### I. SUBSTANTIVE CLAIMS (AGREED BY BOTH CAMPS)
  *Both Camp A (Conceptualists) and Camp B (Pragmatists) must sign off on these premises before proceeding to new data collection.*

  1.  The asymmetry in intentionality ascriptions between the Harm and Help cases is a robust, replicable empirical phenomenon across diverse populations.
  2.  The asymmetry cannot be explained by differences in the agent's stated beliefs, desires, or awareness, as these are held constant in the standard vignettes.
  3.  The asymmetry is sensitive to the moral valence of the side effect, not merely the specific lexical items (e.g., "harm" vs. "help") used in the vignette.
  4.  Simple mental-state models (e.g., "intentional = belief + desire + awareness") are insufficient to predict folk judgments without modification or contextual supplementation.
  5.  Neither camp claims that ordinary folk are "irrational"; the dispute concerns the cognitive architecture producing the judgment, not the competence of the participants.

  ### II. RESIDUAL DISAGREEMENTS & TESTABLE CRUXES

  | # | Disagreement (wording both sides accept) | Underlying crux | Test both sides accept | Conceptualists' prediction | Pragmatists' prediction |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | 1 | **The Locus of Processing:** The asymmetry arises from the semantic content of "intentionally" (Camp A) vs. pragmatic context surrounding its use (Camp B). | Is the normative influence automatic/competence-based or inferential/performance-based? | **Cognitive Load Task:** Participants judge standard cases while performing a high-load working memory task (e.g., dot-matrix recall). | Asymmetry persists unchanged; normative integration is automatic and does not require extra cognitive resources. | Asymmetry significantly shrinks or vanishes; pragmatic inference requires resources, reverting judgments to symmetric mental-state criteria. |
  | 2 | **The Role of Blame:** The asymmetry is driven by a desire to blame/praise the agent (Camp B) vs. a normative feature of the action itself (Camp A). | Is the effect dependent on the *opportunity* to hold the agent responsible? | **Third-Party Observation:** Participants judge a case where the agent is dead/unchallengeable and no social blame can be enacted, only recorded. | Asymmetry persists; the judgment is about the action's properties, not the utility of blaming. | Asymmetry shrinks; without the pragmatic function of blaming, the motivation to ascribe intentionality in the Harm case is removed. |
  | 3 | **Truth vs. Assertability:** Participants judge the statement "He did it intentionally" as literally *true* (Camp A) vs. merely *appropriate to say* (Camp B). | Do folk distinguish between literal truth-conditions and conversational warrant? | **Literalness Probe:** After the standard judgment, participants answer: "Is this sentence literally true, or just okay to say?" on a forced scale. | High correlation between "Intentional" and "Literally True"; folk treat normativity as truth-conditional. | Significant divergence; participants will endorse "Intentional" but deny "Literally True" in the Help case (or vice versa). |

  ### III. NOTE ON VERBAL DISPUTES

  We suspect Disagreement #1 (Locus of Processing) contains a merely verbal component regarding the definition of "concept." If Camp B admits that the pragmatic inference is *universal, automatic, and law-governed*, and Camp A admits that the semantic content can be *context-sensitive*, the empirical predictions may converge. The fight over whether this mechanism lives in "Semantics" or "Pragmatics" may be a dispute about labeling cognitive modules rather than a dispute about how the mind works. We agree to treat this as a secondary theoretical interpretation to be settled *after* the empirical data from the table above is collected. Do not let taxonomy block data collection.

  ### IV. NEXT STEPS
  1.  Pre-register the three studies outlined in Section II.
  2.  Agree on statistical thresholds for "significant shrinkage" (e.g., interaction effect p < .05, Cohen's d reduction > 0.5).
  3.  Draft the methods section jointly before running participants.

