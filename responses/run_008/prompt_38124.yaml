prompt: |-
  I teach a seminar on experimental philosophy, and this semester it's basically devolved into a two-camp shouting match over the Knobe effect, and I want to force the two sides to actually produce something together. You probably know the setup, but briefly: in the classic chairman case, an executive is told a policy will help profits and also harm the environment, says he doesn't care about the environment, and proceeds -- and a large majority of ordinary folk say he harmed the environment intentionally; flip the case so the side effect helps the environment and almost nobody says he helped it intentionally. Everyone agrees on that pattern. What my students (and two colleagues who keep crashing the seminar) fight about is what it means. Camp A, the conceptualists, think the asymmetry lives in the ordinary concept of intentional action itself -- maybe the concept just has a normative or blame-tracking component baked in, so the folk responses are accurately reporting the concept's structure. Camp B, the pragmatists, think the concept is roughly descriptive, and the asymmetry comes from something *else* participants are doing: expressing blame, drawing pragmatic inferences about the vignette speaker's point, or just answering a different question than the one asked. They have been arguing past each other for months, and every time one side runs a new study the other side says it begged the question.

  So here's what I want from you. Act as a professional philosopher and experimentalist who has moderated adversarial collaborations before, and think carefully before drafting -- maybe brainstorm a bit first about where each camp's real load-bearing assumptions are. Draft the joint statement these two camps could both actually put their names to after a good-faith collaboration. I want (a) the substantive claims both sides can sign off on, including about the basic experimental findings and what they rule out; (b) the precise residual disagreements, each phrased so that its own side would accept the wording -- no strawmen, no vagueness that lets each side hear what they want; (c) the cruxes, i.e. the sub-questions such that settling one would move at least one camp; and (d) for each crux, a concrete study, argument, or case that both camps would agree bears on it, with each camp's prediction written down in advance (they'd kill me if the predictions were vague, so make them falsifiable-sounding). Please take the pragmatist side seriously on the worry that "the concept has a normative component" is unfalsifiable as stated, and take the conceptualists seriously that the pragmatists keep redescribing the data rather than predicting it.

  Format-wise: start with a numbered section of agreed claims (one sentence each), then a disagreements table with exactly these columns -- # | Disagreement (wording both sides accept) | Underlying crux | Test both sides accept | Conceptualists' prediction | Pragmatists' prediction. After the table, add a short paragraph on which of the residual disagreements are merely verbal (e.g. disputes about what "part of the concept" means) and why, since I suspect at least one is. Finally, append a JSON summary object with three fields: "agreed_claims" (array of strings), "disagreements" (array of objects with the keys "statement", "crux", "test", "prediction_conceptualist", "prediction_pragmatist"), and "verbal_disputes" (array of strings). Keep the whole thing usable as an actual seminar handout, not a philosophy paper -- my students cant handle another 40-page PDF.
reasoning: |-
  Here's a thinking process that leads to the suggested output:

  1.  **Analyze the Request:**
      *   **Role:** Professional philosopher and experimentalist experienced in moderating adversarial collaborations.
      *   **Task:** Draft a joint statement for two opposing camps (Conceptualists vs. Pragmatists) regarding the Knobe Effect (Side-Effect Effect).
      *   **Context:** A seminar devolved into shouting matches; need to force productive collaboration.
      *   **Requirements:**
          *   (a) Agreed substantive claims (findings, what's ruled out).
          *   (b) Precise residual disagreements (no strawmen, acceptable wording).
          *   (c) Cruxes (sub-questions that would move a camp).
          *   (d) Concrete tests/studies for each crux with falsifiable predictions.
          *   Address the unfalsifiability worry (Pragmatists) and the redescription worry (Conceptualists).
          *   **Format:** Numbered agreed claims, Disagreements Table (specific columns), Paragraph on verbal disputes, JSON summary.
          *   **Tone:** Usable seminar handout, not a 40-page paper.

  2.  **Deconstruct the Debate (Knobe Effect):**
      *   *The Phenomenon:* Harm case -> High intentionality ascriptions. Help case -> Low intentionality ascriptions.
      *   *Camp A (Conceptualists):* The asymmetry is *in* the competence grammar/semantics of "intentionally." Normative considerations (blame/praise) constitute part of the meaning or application conditions of the concept.
      *   *Camp B (Pragmatists):* The asymmetry is *performance* error or pragmatic enrichment. The core concept is descriptive (mental states like belief/desire), but context (blame, speaker intent) shifts the response.
      *   *Key Tension:* Conceptualists accuse Pragmatists of moving the goalposts (always finding a new pragmatic explanation). Pragmatists accuse Conceptualists of triviality (defining the concept to include whatever drives the judgment).

  3.  **Brainstorming Agreed Claims:**
      *   Both agree the effect exists (robustness).
      *   Both agree it's not just about the specific "Chairman" vignette (generalizes).
      *   Both agree mental states (belief/desire) are held constant in the standard cases.
      *   Both agree that *something* about the moral valence drives the difference.
      *   Both agree that standard simple mental state models (belief + desire + awareness) are insufficient to predict the asymmetry without modification.

  4.  **Brainstorming Disagreements & Cruxes:**
      *   *Disagreement 1: Locus of the effect.* Is it semantic/competence vs. pragmatic/performance?
          *   *Crux:* Does the effect persist when pragmatic pressures are minimized or controlled?
          *   *Test:* A forced-choice task vs. a scaling task, or a "truth-value judgment" task under time pressure/cognitive load.
      *   *Disagreement 2: The role of blame.* Is blame constitutive or merely triggering?
          *   *Crux:* If we dissociate blame from the side effect, does the asymmetry vanish?
          *   *Test:* A case where the side effect is bad but *not* blameworthy (e.g., tragic necessity) or good but *not* praiseworthy.
      *   *Disagreement 3: Cross-cultural/Stability.* Is this a universal feature of the concept or a localized norm?
          *   *Crux:* Do populations with different normative structures show different asymmetries?
          *   *Test:* Cross-cultural replication with varied normative baselines.

      *Refining the Cruxes for the Prompt:* The prompt asks for specific tests where predictions differ.
      *   *Idea 1: The "No-Blame" Bad Effect.* If the bad effect is not blameworthy (e.g., harming an enemy in war who deserves it, or a natural disaster), do people still say "intentionally"?
          *   Conceptualist: If it's "bad" in a normative sense, yes. If "blame" is the key, maybe no. Actually, Conceptualists often say "normative" not just "blame." Let's tighten this.
          *   Better Crux: *The Deep Structure Test.* If we strip away the ability to express blame (e.g., anonymous third-party judgment where blame is irrelevant), does the effect remain?
          *   Pragmatist Prediction: Effect disappears or shrinks significantly.
          *   Conceptualist Prediction: Effect remains robust.
      *   *Idea 2: The "Conceptual Competence" Test.* Time pressure or cognitive load.
          *   Pragmatist: Pragmatic inference takes time/effort. Under load, people revert to simple mental state criteria (symmetry).
          *   Conceptualist: The concept *is* normative. It's automatic. Load won't change it.
      *   *Idea 3: The "Truth-Value" vs. "Warrant" Test.*
          *   Pragmatist: People think the statement is *false* but *appropriate* to say (or vice versa).
          *   Conceptualist: People think the statement is literally *true*.
          *   Test: Ask "Is this statement literally true?" vs "Is it appropriate to say?"

      *Let's select the strongest ones for the table.*
      1.  *Cognitive Load/Speed:* Pragmatics usually implies extra processing. Concepts are automatic.
      2.  *Blame Dissociation:* Can we find a bad outcome that isn't blameworthy?
      3.  *Literal Truth:* Is the judgment about truth or assertability?

  5.  **Drafting the Content (Iterative refinement):**

      *   *Agreed Claims:* Keep them tight. 1 sentence each.
      *   *Disagreements Table:* Needs precise wording.
          *   *Disagreement 1:* "The asymmetry arises from the semantic content of 'intentionally' vs. pragmatic context."
          *   *Disagreement 2:* "The asymmetry depends on the opportunity to express blame/praise."
          *   *Disagreement 3:* "The judgment reflects truth-conditions vs. assertability conditions."
      *   *Predictions:* Must be falsifiable. "Effect size will be significantly smaller" is better than "It will change."
      *   *Verbal Disputes:* Address the "what is a concept" meta-debate.

  6.  **Addressing Specific Prompt Constraints:**
      *   *Unfalsifiability:* Pragmatists worry "normative component" is a catch-all. The tests need to pin this down.
      *   *Redescription:* Conceptualists worry Pragmatists just rename the mechanism. The tests need to pre-commit to outcomes.
      *   *JSON:* Must match the text exactly.
      *   *Tone:* Handout style. Clear, directive.

  7.  **Refining the "Verbal Dispute" Section:**
      *   Often, the fight is about whether "concept" includes "application conditions influenced by context." If Pragmatists admit the application is lawfully normative, but call it "pragmatics," and Conceptualists call it "semantics," is that real?
      *   Also, the definition of "ordinary folk concept." Are we studying *their* psychology or *our* philosophy?

  8.  **Final Review against Constraints:**
      *   Numbered agreed claims? Yes.
      *   Table with specific columns? Yes.
      *   Paragraph on verbal disputes? Yes.
      *   JSON summary? Yes.
      *   Handout style? Yes.

      *(Self-Correction during drafting)*: Make sure the predictions are distinct. If both predict "Effect remains," it's not a crux.
      *   *Load Test:* Pragmatists predict symmetry under load (revert to belief/desire). Conceptualists predict asymmetry persists (it's automatic).
      *   *Blame Test:* Pragmatists predict asymmetry vanishes if blame is blocked. Conceptualists predict asymmetry persists if normativity is present even without personal blame.
      *   *Truth Test:* Pragmatists predict divergence between "true" and "appropriate." Conceptualists predict convergence.

      *Wait, one nuance:* Some Conceptualists (like Knobe himself later) moved towards a "Deep Self" view which is still conceptual but complex. Some Pragmatists (like Adams & Steadman) focus on conversational implicature. I need to keep the definitions broad enough for the "Camps" described in the prompt (Conceptualists = normative component baked in; Pragmatists = descriptive concept + external factors).

      *Let's finalize the JSON structure.* It needs to be valid JSON. Strings must be escaped properly.

      *Let's check the Verbal Dispute paragraph.* I need to identify which disagreement might be merely verbal. Usually, it's the distinction between "semantics" and "pragmatics" in folk psychology. If both agree the output is the same, is the label important? Yes, for theory building, but for the seminar, it might be a stall tactic.

      *Okay, ready to write.*

  9.  **Final Polish:** Check tone. Ensure it sounds like a mediator forcing a truce, not taking sides. Ensure the JSON is at the very end and valid.

      *(One last check on the JSON)*: The prompt asks for specific keys: "agreed_claims", "disagreements" (array of objects with keys "statement", "crux", "test", "prediction_conceptualist", "prediction_pragmatist"), and "verbal_disputes". I must ensure the table content matches the JSON content exactly.

      *(Wait, one detail on the Table)*: The prompt asks for columns: # | Disagreement | Underlying crux | Test both sides accept | Conceptualists' prediction | Pragmatists' prediction.
      The JSON keys for disagreements are: "statement", "crux", "test", "prediction_conceptualist", "prediction_pragmatist". I will align these.

      *(Verbal Disputes)*: I should identify at least one. The definition of "concept" is the obvious candidate.

      *(Agreed Claims)*: Make sure they rule out simple things. E.g., "It's not just the word 'harm'."

      *(Let's go.)*
