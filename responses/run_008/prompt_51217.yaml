          *   *The Error:* The student suggests Wright validates the bootstrapping *inference* as a way to gain the conclusion. Wright's point is usually that the project of trying to validate the source via bootstrapping is misguided; we have entitlement *prior* to the inquiry. Saying the inference is "perfectly cogent" and we acquire the conclusion "the easy way" misrepresents Wright. Wright blocks the need for the inference; he doesn't endorse the inference as a knowledge-generator.
          *   *Decisive Call:* This is a misattribution/misunderstanding. Wright uses entitlement to *dissolve* the pressure to validate, not to validate via bootstrapping. The student makes it sound like Wright says "Yes, bootstrapping works, it's just entitlement." Wright says "You don't need to bootstrap."
