prompt: |-
  My friend has strong opinions about what you're allowed to do when you don't prefer either option, and I want to predict what she'll say about a new case. Her track record so far: the Buridan's ass donkey between two haystacks is no paradox at all, it just picks one, and starving would be the irrational part. When she herself had two job offers that seemed exactly equally good and took the one whose recruiter called first, she says that was fine, no need to manufacture a preference. But a person who deliberated between two identical apartments until both got rented out from under her was being irrational — not for lacking a preference, just for the dithering. Asked whether that person should've flipped a coin instead, she said sure, that's fine, but it wasn't required, any old way of picking works. And a teacher who gave an award to one of two exactly tied students by picking the one she liked more that day — that was not okay, she was pretty worked up about that one. So, next week her office has to lay off one of two employees with identical perfomance records, and the manager plans to pick by first name alphabetical — neutral, no favoritism, but not random. Predict her verdict on that, tell me which rules fit her track record so far and where those rules come apart on this case, and give me one further case that would best tell the rules apart.
