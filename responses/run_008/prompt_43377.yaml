answer: |-
  ### Nearest concepts

  The closest framework is Miranda Fricker's concept of **testimonial injustice**, where prejudice causes a hearer to assign a deflated level of credibility to a speaker's word. However, your scenario suggests a more granular split within testimony itself. Epistemologists distinguish between **observational reliability** (accurately reporting sensory data) and **interpretive authority** (competently assigning meaning to that data). In standard social epistemology, such as the work of John Hardwig on **epistemic trust**, we rely on others because we cannot know everything ourselves; this creates a "division of epistemic labor." Usually, this division is based on expertise. However, feminist standpoint theory argues that marginalized positions often grant superior observational access (the caregiver sees what the doctor misses) while simultaneously stripping the knower of the power to certify that knowledge. The phenomenon you describe sits at the intersection of these ideas: the caregiver is granted the status of a reliable instrument (high observational credibility) but denied the status of a cognitive agent (low interpretive credibility). The family treats her eyes as valid but her mind as intrusive. This echoes **hermeneutical injustice**, where someone is blocked from contributing to the shared understanding of social experiences, though here the blockage is active rejection rather than a structural lack of concepts.

  ### Where they fall short

  These concepts fall short because they typically treat credibility as holistic. In standard testimonial injustice, if I distrust your judgment, I usually distrust your facts too. If I trust your facts, I generally afford you basic rationality. Your example reveals a **compartmentalized credibility** that existing taxonomy rarely isolates. The family does not doubt the caregiver's honesty or perception; they doubt her *jurisdiction* over meaning. Furthermore, standard accounts of epistemic authority usually link factual accuracy to interpretive weight. They do not adequately explain why the doctor's factual errors are indulged while the caregiver's interpretive insights are suppressed. The deficit is not about reliability; it is about social permission to synthesize.

  ### A label, if warranted

  I propose the label **Epistemic Instrumentalization**. This defines a state where an agent is credited solely as a conduit for raw data but disqualified from processing that data into significance. It is distinct from mere disagreement because it persists regardless of the agent's track record; it is structural, based on social role rather than competence. To qualify, the exclusion must be systematic: the subject is welcomed as a sensor but silenced as an analyst. This excludes simple error, where a person is ignored because they are occasionally wrong. Here, the person is ignored because their role is defined as "hands," not "head." It captures the specific violence of being used to know, but not allowed to understand.

  ### Two boundary cases

  First, consider a pathological liar who reports a fire correctly but claims it was arson. If the fire department believes the fire exists but doubts the arson due to past lies, this is **risk assessment**, not instrumentalization. They are weighing probability based on performance history, not enforcing a social role. The concept ends where evidence dictates skepticism; if she were ignored simply because she was frequently wrong, it would be rational discounting, not structural exclusion.

  Second, consider your doctor. He misstates the dosage (fact) but diagnoses depression (meaning). The family accepts the diagnosis while quietly correcting the dosage. This confirms **Epistemic Instrumentalization** in reverse: the doctor is insulated from factual scrutiny because his interpretive authority is paramount. Your caregiver belongs firmly within this concept. She is not disbelieved because she is wrong; she is silenced because her synthesis threatens the family's hierarchy. She is the sensor; they are the thinkers. The boundary lies in whether the dismissal is about *accuracy* or *authority*.
