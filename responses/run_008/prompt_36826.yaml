answer: |-
  The core move is to stop trying to invent a new object and start mapping the variables of the existing concept.

  ### The Knob-Box Protocol (60 Minutes)

  **1. Define the Frame and Welds (10 mins)**
  Write the theme in one sentence. Below it, list the "Welded Knobs"—the attributes that, if changed, destroy the thing entirely. These are not up for debate.
  *   *Example:* For a "chair," "has a surface to sit on" is welded. "Has four legs" is not.
  *   *Designer Trap:* Do not confuse industry habits with welded essentials. "Must be blue" is rarely a weld; "Must be trustworthy" might be.

  **2. List the Variables (15 mins)**
  Brainstorm every attribute that *can* change. Be granular. Don't write "style"; write "line weight," "color temperature," "verbal tone," "material density," "speed of interaction."
  *   *Goal:* Get 20+ knobs. If you have fewer, you aren't looking hard enough.
  *   *Designer Trap:* Do not list solutions ("use serif font"). List parameters ("typographic era").

  **3. Mark the Industry Defaults (10 mins)**
  Take a red marker. Circle every knob setting your competitors use automatically. These are the "sleep knobs."
  *   *Example:* Coffee = Brown, Kraft, Handwritten. Finance = Blue, Shield, Sans-Serif.
  *   *Action:* You are now forbidden from using these settings unless you have a philosophical reason to override them.

  **4. The Breakpoint Test (15 mins)**
  Pick the unmarked knobs. Turn them to the extreme. Ask: "At what point does this stop being a variation and become a different object?"
  *   *Method:* Push until it breaks, then pull back 10%. That edge is where the creative work lives.
  *   *Designer Trap:* Stopping at "safe." If you haven't felt a moment of "this feels wrong," you haven't turned it far enough.

  **5. The Intent Filter (10 mins)**
  For each extreme variation, ask: "Does this turn reveal something true about the theme, or is it just noise?"
  *   *Fresh Knob:* Changes the attribute to highlight a hidden truth.
  *   *Weird Knob:* Changes the attribute just to be different.
  *   *Decision:* Keep only the Fresh Knobs.

  ***

  ### The Taste Gap
  This procedure ends at step 5. It produces a list of *candidates*, not *solutions*. It cannot tell you which candidate resonates emotionally, culturally, or aesthetically. That requires taste. Taste is the ability to look at two valid variations and know which one carries the right weight for the specific audience at the specific time. Do not treat this protocol as a vending machine; it is a excavator. It digs up the ore; you still have to smelt it. If your team expects the procedure to pick the winner, they are outsourcing their judgment. That is where safety comes from.

  ***

  ### Procedure Run-Throughs

  #### Brief 1: Artisan Coffee Brand (No Hipster Clichés)
  **1. Frame & Welds:**
  *   *Theme:* High-quality coffee made by humans who care.
  *   *Welds:* Must involve coffee beans, must imply drinkability, must signal quality.
  *   *Industry Defaults (Red):* Brown/Kraft paper, serif fonts, illustrations of farms/tools, words like "craft/roast," muted tones.

  **2. Variables:**
  *   Color saturation, typographic era, material texture, imagery subject (bean vs. person vs. machine), tone of voice (poetic vs. technical), packaging shape.

  **3. The Turn (Breakpoint Test):**
  *   *Knob:* **Tone of Voice.** Default: Poetic/Warm. Turn: Clinical/Precision.
      *   *Breakpoint:* If it sounds like chemical analysis, it loses the "human" weld.
      *   *Edge:* "Surgical Care." Treating the bean with the precision of a lab, not the warmth of a hug.
  *   *Knob:* **Color.** Default: Earth tones. Turn: Neon/High-Vis.
      *   *Breakpoint:* If it looks like energy drink, it loses "artisan."
      *   *Edge:* "Safety Orange." Signaling alertness and hazard-level caffeine, but with matte finish to keep it premium.
  *   *Knob:* **Imagery.** Default: Farms/Hands. Turn: Urban/Infrastructure.
      *   *Edge:* Coffee as fuel for the city machine. Concrete textures, not wood textures.

  **4. Intent Filter:**
  *   *Clinical Tone:* Fresh. Reveals the science behind the craft.
  *   *Neon Color:* Weird. Distracts from the product quality.
  *   *Urban Infrastructure:* Fresh. Positions the drinker as a builder, not a lounger.

  **Result:** A brand that looks like high-end lab equipment or urban utility gear, using precise technical language instead of "cozy" storytelling.

  #### Brief 2: Savings App for Teens (Big Conventional Bank)
  **1. Frame & Welds:**
  *   *Theme:* Secure money growth for young people.
  *   *Welds:* Must feel safe (it's a bank), must be usable on mobile, must comply with regulations.
  *   *Industry Defaults (Red):* Bank Blue, shields/locks, piggy banks, gamification (confetti/levels), slang-heavy copy.

  **2. Variables:**
  *   Color temperature, iconography style, reward mechanism, time horizon visualization, tone of voice (peer vs. mentor), transparency of fees.

  **3. The Turn (Breakpoint Test):**
  *   *Knob:* **Time Horizon.** Default: Now/Short-term (gamified). Turn: Deep Future.
      *   *Breakpoint:* If it feels like retirement planning, teens disengage.
      *   *Edge:* "The 5-Year Plan." Visualizing what money looks like in 5 years, not 50. Treating them like adults planning a mission, not kids saving for toys.
  *   *Knob:* **Tone.** Default: Cool/Peer. Turn: Radical Honesty.
      *   *Breakpoint:* If it's depressing, they leave.
      *   *Edge:* "Anti-Marketing." Admitting saving is boring. "This app is boring. That means it works."
  *   *Knob:* **Visuals.** Default: Abstract shapes/3D blobs. Turn: Real World Objects.
      *   *Edge:* Photos of actual things money buys, not abstract concepts of "freedom."

  **4. Intent Filter:**
  *   *Deep Future:* Fresh. Respects their intelligence.
  *   *Radical Honesty:* Fresh. Cuts through the noise of "get rich quick."
  *   *Real World Objects:* Fresh. Grounds the abstract number in reality.

  **Result:** A utilitarian interface that avoids gamification, uses plain language admitting saving is hard, and visualizes concrete mid-term goals rather than abstract wealth.

  #### Brief 3: Funeral Home Rebrand
  **1. Frame & Welds:**
  *   *Theme:* Dignified care for the dead and grieving.
  *   *Welds:* Must convey respect, must handle legal logistics, must provide a physical space for gathering.
  *   *Industry Defaults (Red):* Black/Gray/White, Serif fonts, imagery of flowers/stones/doves, tone is Somber/Whispered, naming conventions (Smith & Sons).

  **2. Variables:**
  *   Color palette, typographic weight, imagery subject (death vs. life), tone of voice (somber vs. narrative), service structure (rigid vs. flexible), sensory environment (smell/light).

  **3. The Turn (Breakpoint Test):**
  *   *Knob:* **Emotional Tone.** Default: Somber/Mourning. Turn: Celebratory/Vibrant.
      *   *Breakpoint:* If it feels like a party, it violates the "respect" weld.
      *   *Edge:* "Vivid Memory." Using full saturated color to represent the life lived, not the death died.
  *   *Knob:* **Imagery.** Default: Static objects (urns, flowers). Turn: Dynamic Action.
      *   *Breakpoint:* Photos of dead people (too literal).
      *   *Edge:* Photos of people *doing* things they loved. High energy.
  *   *Knob:* **Naming.** Default: Family Surname. Turn: Descriptive/Verb.
      *   *Edge:* "The Sendoff," "Continuum."

  **4. Intent Filter (The Hard Part):**
  *   *Celebratory Tone:* **Fresh.** The procedure flags this as valid. It shifts focus from loss to legacy.
      *   *Conflict:* Your partner says "playful is off the table." The procedure argues that "Celebratory" is not "Playful." Playful implies frivolity; Celebratory implies weight and honor. The friction here is cultural taboo, not structural integrity. The knob *can* be turned without breaking the frame, but it requires navigating social norms.
  *   *Vivid Memory:* **Fresh.** Breaks the monotony of gray.
  *   *Dynamic Action:* **Fresh.** Humanizes the deceased.

  **Result:** A brand that uses bold color and photography of life rather than symbols of death. The logo might be dynamic rather than static. The copy speaks of "continuing the story" rather than "laying to rest."
  *   *Note on Partner's Constraint:* The procedure identifies "Somber" as an Industry Default, not a Welded Knob. Avoiding playfulness is a business constraint, but avoiding *color* or *life* is a creative habit. The procedure suggests you can honor the dead without dressing the brand in black. If you reject this, admit it is a fear of client reaction, not a failure of the concept.
