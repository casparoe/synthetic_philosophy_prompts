          *   *Case:* We want the AI to track the *real thing* we cared about, not the flawed theory we used to describe it.
          *   *Status:* Non-negotiable for long-term alignment. Otherwise, the AI locks in our current ignorance.
      *   *Desideratum 3: Human Checkability vs. Inaccessible Info.*
          *   *Question:* The user asks specifically about this tension. The motivation is that the AI knows things we don't (e.g., nanotech risks). But if we can't check it, how do we know it mapped "happiness" correctly?
          *   *Case:* AI says "This state is happiness." Human says "Looks like torture to me." AI says "No, trust my ontology."
          *   *Status:* This is the crux. *Checkability* is usually seen as non-negotiable for verification. *Inaccessible Info* is the motivation for needing the tool.
