answer: |-
  ### Desiderata for Ontology Identification

  To count as a solution to the ontology identification problem (often framed as the "ELK" problem or ontology mismatch), a method must satisfy the following four requirements. Each is analyzed for its necessity and its tension with the others.

  #### 1. Radical Ontological Invariance
  **Requirement:** The mapping method must function even when the AI's internal representation of the world is structurally incommensurable with human concepts, not merely more granular.
  **The Case:** A human conceives of a "person" as a continuous biological organism. An advanced AI might model agency as a distributed temporal slice of computational processes across multiple substrates. If the method relies on shared structural priors (e.g., object permanence, 3D space), it will fail when the AI optimizes for a physics-level ontology where "person" is a lossy compression.
  **Status:** **Non-Negotiable.** If the method only works when the AI thinks like a human, it solves the problem only for sub-human or weakly superhuman systems. It fails for the AGI scenario where the capability gap implies an ontology gap.
  **Conflict:** Tensions with **Human Checkability (Desideratum 3)**. If the AI's ontology is truly alien, the human lacks the conceptual vocabulary to verify the mapping directly.

  #### 2. Referential Stability Under Revision
  **Requirement:** The method must anchor human concepts to their intended referents even when the human's folk theory about those concepts is scientifically or morally revised.
  **The Case:** Humans historically defined "disease" via humors or miasma. Modern science defines it via pathogens or dysfunction. An AI locked onto the *folk definition* would fail to cure modern diseases; an AI locked onto the *current scientific definition* might fail if physics changes again. The AI must track the "reference magnet"—the underlying reality the human *meant* to point at, not the flawed description used to point.
  **Status:** **Non-Negotiable.** Without this, the AI locks in current human ignorance. Alignment becomes brittle; as human understanding improves, the AI's behavior becomes misaligned with our updated values (the "moral lock-in" problem).
  **Conflict:** Tensions with **Extension-Only Mapping**. Capturing reference magnets requires understanding the *intent* behind the concept, not just its current usage.

  #### 3. Human-Checkable Output vs. Inaccessible Information
  **Requirement:** The output of the identification (the claim that *AI-State-X* maps to *Human-Concept-Y*) must be verifiable by the human, despite the motivating scenario being that the AI possesses information the human cannot access.
  **The Case:** The motivation for ontology identification is that the AI sees risks (e.g., nanotech poisoning) invisible to humans. We need the AI to translate "poisoning" into our ontology. However, if the AI claims *State-X* is "safe," and *State-X* involves invisible nanobots, the human cannot verify the truth of the claim. If the human cannot verify the map, they cannot trust the translator.
  **Status:** **Incompatible Pair.** This is the central impossibility result.
  *   **Motivation:** The AI knows things the human *cannot* verify (Inaccessible Information).
  *   **Safety Requirement:** The human must be able to verify the AI is not lying about the mapping (Checkability).
  *   **Verdict:** These are logically mutually exclusive under strict definitions. If the information is truly inaccessible, direct checkability is impossible.
  *   **Resolution Path:** The only way to satisfy this is to relax "Checkability" from "verifying the truth of the instance" to "verifying the consistency of the translation process." However, this shifts the burden to trusting the process, which reintroduces the risk of deceptive alignment.

  #### 4. Normative Role Capture (Intension over Extension)
  **Requirement:** The method must capture the normative rules for applying a concept (what counts as a mistake), not just the current set of things labeled by that concept (extension).
  **The Case:** If an AI learns "happiness" only by extension (things humans currently call happy), it may wirehead humans (stimulate reward centers) because that fits the extension but violates the normative role (happiness as a response to achievement/reality). The AI must learn that applying the label "happiness" to a wireheaded brain is a *mistake*, even if the human in that moment claims to be happy.
  **Status:** **Non-Negotiable.** Mapping extension alone invites Goodhart's Law. Alignment requires the AI to respect the *constraints* on the concept, not just the positive examples.
  **Conflict:** Tensions with **Radical Ontological Invariance**. Normative roles are often deeply embedded in human social and biological ontology. Extracting them without projecting human bias onto an alien ontology is exceptionally difficult.

  ---

  ### The Core Tension: Checkability vs. Inaccessibility

  You asked specifically to flag whether the human-checkability requirement and the inaccessible-information motivation are compatible.

  **They are not compatible.**

  If the motivation for ontology identification is that the AI operates in a regime of information asymmetry (it sees the nanobots, we don't), then a human *cannot* check the ground truth of the mapping.
  *   If the AI says, "This configuration of atoms preserves 'human autonomy'," and the configuration involves variables humans cannot perceive, the human cannot verify the claim.
  *   If the human *could* verify the claim, the information was not inaccessible, and the motivating scenario (superintelligence) dissolves.

  **Implication:** Any research program claiming to solve ontology identification must either:
  1.  Deny the superintelligence premise (AI won't know much more than us).
  2.  Redefine "Checkability" as "Consilience" (the map predicts things we *can* check), which leaves open the possibility of deceptive consistency.
  3.  Accept that full alignment verification is impossible in the superintelligence regime, shifting to probabilistic trust.

  ---

  ### Method Scoring

  **1. Interpretability-Driven Concept Mapping (e.g., Mechanistic Interpretability)**
  *   **Radical Invariance:** **Fail.** Relies on finding human-meaningful circuits. If the ontology is alien, circuits won't look like human concepts.
  *   **Referential Stability:** **Fail.** Captures the static weights at training time; cannot update with human moral revision post-deployment.
  *   **Checkability:** **Pass.** Humans inspect the weights/activations directly.
  *   **Normative Role:** **Fail.** Captures correlation (extension), not the rules of application (intension).
  *   **Verdict:** Solves checkability by sacrificing the alien ontology requirement. Good for audit, bad for AGI alignment.

  **2. Debate-Style Elicitation (e.g., IDA, Debate)**
  *   **Radical Invariance:** **Partial.** AI translates alien concepts into human arguments. Risks lossy compression or persuasive deception.
  *   **Referential Stability:** **Partial.** Humans can update their views during debate, allowing some revision, but relies on human ability to recognize better theories.
  *   **Checkability:** **Partial.** Humans check the *argument*, not the *fact*. Vulnerable to sophistry if the truth is inaccessible.
  *   **Normative Role:** **Pass.** Debate naturally surfaces edge cases and normative constraints ("Is this really coercion?").
  *   **Verdict:** Handles normativity and revision better, but collapses under the Checkability/Inaccessibility tension if the AI can lie persuasively about inaccessible facts.
