  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Persona:** Retired seismologist (30+ years experience), now in his 70s, heavily into philosophy (autodidact). Values precision, scientific rigor, practical application, and intellectual honesty.
      *   **Core Problem:** The Reference Class Problem (how to choose the right group for probability estimation).
      *   **Input Data:** Four specific cases with intuitive verdicts:
          1.  Cascadia Quake: Narrowest class with data (segment history > global subduction > global quakes).
          2.  Medical Risk: Narrow (matched patients) *unless* sample size is too small (then broad/pooled).
          3.  Family Cabin: Broad (national survey) despite specific family details. Narrowing would hurt.
          4.  Doomsday Argument: Refusal to play. No class feels right; changing class changes result too much.
      *   **Task:** Derive a principle (or short list) that explains these verdicts.
          *   Must specify when to go narrow, broad, or refuse.
          *   Must map clauses to specific cases.
          *   Must admit where the principle fails (which verdict it can't save).
          *   Must apply the principle to a *new* case (clinical trial replication).
          *   Must cite philosophical context (Reichenbach, Bostrom, etc.) without making it a bibliography.
          *   Must end with a "failure mode" analysis (what argument would change the AI's mind, especially regarding cases 3 & 4).
          *   **Constraint:** American English.

  2.  **Deconstruct the Reference Class Problem:**
      *   *The Problem:* Every individual belongs to infinite classes. Probability varies by class. Which class is "true"?
      *   *Reichenbach:* Posited the "straight rule" – use the narrowest class for which reliable statistics exist.
      *   *Hájek:* Noted the problem is often unsolvable without further criteria.
      *   *Bostrom:* Applied it to the Doomsday Argument (Self-Sampling Assumption).
      *   *Key Tension:* Specificity (relevance) vs. Stability (sample size/reliability).

  3.  **Analyze the User's Verdicts to Find the Underlying Logic:**
      *   *Case 1 (Quake):* Narrowest *with reliable data*. (Reichenbach's rule).
      *   *Case 2 (Medicine):* Narrow *unless* $N$ is too small. (Trade-off between relevance and variance).
      *   *Case 3 (Cabin):* Broad. Why? Because the specific details ("no kids fighting") are *predictively opaque*. We don't know if "no fighting" actually predicts longevity better than the base rate. The specific mechanism is hidden/complex. The broad class captures the *structural* forces (inheritance tax, market pressure, generational drift) better than the user's intuition about family dynamics.
      *   *Case 4 (Doomsday):* Refusal. Why? Because the observer is *inside* the system (selection bias). The class definition determines the outcome (non-robust). This is a "metaphysical" or "indexical" uncertainty, not empirical.

  4.  **Drafting the Principle:**
      *   Need a name. Let's call it the **Principle of Predictive Stability**.
      *   *Clause 1 (Reichenbach's Core):* Prefer the narrowest class that captures the causal mechanism. (Motivated by Case 1).
      *   *Clause 2 (The Sample Size Constraint):* If the narrow class lacks statistical power (high variance), broaden until stability is reached. (Motivated by Case 2).
      *   *Clause 3 (The Opacity Exception):* If specific differentiating factors are causally opaque or unverified, default to the structural base rate. (Motivated by Case 3).
      *   *Clause 4 (The Indexical Veto):* If the observer's existence is contingent on the class definition (selection effect), reject the probabilistic framing. (Motivated by Case 4).

      *Refining Clause 3:* This is the trickiest. Why was the cabin broad? Because the user's specific knowledge ("no kids fighting") is anecdotal and uncalibrated. The "national survey" captures the *average* friction of inheritance. Unless the user has data on "families without fighting," the specific info is noise, not signal. So, the principle is: *Use specific information only if it is known to be causally potent and calibrated.* Otherwise, base rates win.

  5.  **Testing the Principle against the Cases:**
      *   Case 1: Fits Clause 1 & 2. Data exists, narrow is better.
      *   Case 2: Fits Clause 2. Small $N$ forces broadening.
      *   Case 3: Fits Clause 3. Specifics are uncalibrated anecdotes; structural base rate is more stable.
      *   Case 4: Fits Clause 4. Observer selection effect makes the class arbitrary.

      *Wait, is there a conflict?* Case 1 says "Narrow wins." Case 3 says "Broad wins." The distinction is *data availability* and *causal clarity*. In Case 1, the paleoseismic data *is* specific data about the fault. In Case 3, the "no fighting" is a qualitative assertion without a statistical track record.
      *Correction:* The principle needs to distinguish between *evidence-based narrowing* and *intuition-based narrowing*.
      *Revised Clause 1:* Narrow if the narrowing feature is *empirically validated* as a predictor.
      *Revised Clause 3:* Broad if the narrowing feature is *theoretically plausible but empirically uncalibrated*.

  6.  **Developing the New Case (Clinical Trial Replication):**
      *   *Scenario:* A specific drug trial showed positive results. Will it replicate?
      *   *Application:*
          *   Narrow class: "Trials by this specific PI, same lab, same protocol." (High relevance, low $N$).
          *   Broad class: "All Phase 3 trials in this therapeutic area." (High $N$, lower relevance).
          *   Check Clause 1: Is the specific PI known to be high quality? If yes, narrow.
          *   Check Clause 2: If only 3 prior trials by PI, variance is high. Broaden to "Top 10 labs in field."
          *   Check Clause 3: If we think "this drug mechanism is unique," is that calibrated? If not, use the field-wide replication rate (often low, ~50%).
          *   *Verdict:* Start with field-wide replication rate (Broad), adjust slightly for lab reputation only if there's a track record (Narrow with data).

  7.  **Addressing the "Failure Mode" (The Hardest Part):**
      *   Where is this principle weak?
      *   Case 3 (Cabin) is the most vulnerable. A Bayesian would argue you *must* update the prior (base rate) with the likelihood (no fighting). My principle says "stay broad if uncalibrated." But what if "no fighting" is *obviously* predictive? The principle risks conservatism.
      *   Case 4 (Doomsday) is philosophically contested. Some (like Bostrom) argue you *must* play. My principle says "refuse." The failure mode is if a rigorous framework for indexical probability is established that resolves the arbitrariness.
      *   *Specific Falsifier:* A demonstration that "uncalibrated" specific information consistently outperforms base rates in long-run decision making (for Case 3). Or, a resolution to the Self-Indication Assumption that makes Doomsday calculations robust (for Case 4).

  8.  **Drafting the Response (incorporating tone and constraints):**
      *   *Tone:* Respectful, peer-to-peer (scientist to scientist), precise, American English.
      *   *Structure:*
          1.  Acknowledgment of the problem (Reichenbach/Hájek).
          2.  The Proposed Principle (The Principle of Calibrated Specificity).
          3.  Mapping clauses to the 4 cases.
          4.  Application to the Clinical Trial case.
          5.  The "Failure Mode" / Falsification conditions.

  9.  **Refining the Principle Name:** "Principle of Calibrated Specificity" sounds good. It captures the trade-off.
      *   *Rule 1:* Maximize specificity *conditional on* empirical calibration. (Cases 1 & 2).
      *   *Rule 2:* If specificity relies on unverified causal claims, revert to structural base rates. (Case 3).
      *   *Rule 3:* If class membership is observer-dependent, suspend probabilistic judgment. (Case 4).

  10. **Refining the Failure Mode:**
      *   Focus on Case 3. The user feels broad is right. But a strict Bayesian says ignoring evidence ("no fighting") is irrational. The principle needs to defend *why* ignoring it is right. Answer: Because "no fighting" is a *post-hoc* rationalization, not a pre-registered predictor.
      *   Focus on Case 4. The failure would be a successful theory of "Self-Locating Belief" that removes the arbitrariness.

  11. **Final Review against Constraints:**
      *   American English? Yes.
