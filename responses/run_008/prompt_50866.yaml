      *(Self-Correction during drafting)*: Make sure I don't sound like I'm lecturing a seismologist on statistics. He knows stats. He wants the *philosophical justification* for his heuristics. Keep the stats talk pragmatic. Ensure the distinction between Case 1 (data-rich narrowing) and Case 3 (data-poor narrowing) is sharp.

      *Wait, one nuance on Case 3:* Why is "no kids fighting" data-poor? Because it's a single data point (this family). We don't know the failure rate of "families without fighting." We *do* know the failure rate of "family cabins." So the class "families without fighting" has no frequency data. The class "family cabins" does. This aligns with Reichenbach: use the class with known frequencies.

      *Wait, one nuance on Case 4:* The Doomsday argument relies on the "Self-Sampling Assumption." The user's rejection aligns with the critique that the reference class of "observers" is ill-defined. I should mention that.

