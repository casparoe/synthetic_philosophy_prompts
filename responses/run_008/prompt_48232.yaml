answer: |-
  Your intuitions are not mush. In fact, they are more sophisticated than the legal definitions currently used in many jurisdictions. You have stumbled upon the exact friction points that privacy philosophers and legal scholars have been wrestling with for the last thirty years.

  The reason you cannot find a single principle like "secrecy" or "consent" is that those principles are wrong. Privacy is not about hiding information; it is about **governing the flow of information.**

  The principle that saves almost all your verdicts is a combination of **Contextual Integrity** (Helen Nissenbaum's theory) and the **Mosaic Theory** of privacy.

  Here is how that principle reconstructs your cases, resolves your inconsistencies, and handles the painter.

  ### The Principle: Contextual Integrity + Mosaic Theory

  **Contextual Integrity** states that privacy is not violated when information is revealed, but when it flows in a way that violates the norms of a specific social context.
  **Mosaic Theory** states that many non-private pieces of information, when aggregated, create a private whole that was never intended to be revealed.

  Here is how this applies to your specific tensions:

  **1. The Doctor vs. The Data Firm (Contextual Integrity)**
  *   **Doctor:** You share intimate data in a *medical context*. The norm of this context is that the doctor uses this info *for your care*. The flow is appropriate.
  *   **Data Firm:** You share purchase data in a *transactional context*. The norm is "I give money, you give goods." Inferring pregnancy and selling that insight violates the norm of that context.
  *   **Resolution:** Consent forms don't matter because they attempt to override context with contract law. Your gut knows that signing a 40-page policy doesn't make the *context* appropriate.

  **2. The Sidewalk vs. The Instagram Dossier (Mosaic Theory + Scale)**
  This is your biggest conflict. Why is looking through blinds up okay, but scraping public posts not?
  *   **Sidewalk:** This is **ephemeral, high-cost, low-scale observation.** A stranger sees you dance once. They cannot easily record it, store it, or cross-reference it with your medical history. The "cost" of gathering the info limits the power imbalance.
  *   **Instagram Dossier:** This is **permanent, low-cost, high-scale aggregation.** You posted photos for a *social context* (friends/followers). The stranger is operating in a *surveillance context*. By aggregating years of posts, they derive patterns (location, habits, psychology) that no single post reveals.
  *   **Resolution:** You do not have to throw out the Sidewalk verdict. The distinction is **aggregation and purpose.** A human eye on the sidewalk cannot build a predictive model of your life. A script scraping Instagram can. The violation isn't the data points; it's the *profile*.

  **3. The Smart Speaker (Ontological Privacy)**
  *   **The Case:** No human hears it, but the device records it.
  *   **The Principle:** This violates **agency and dignity.** Privacy is also about the right to remain "unprocessed." When a device converts your speech into data logs, it objectifies you. It changes the nature of your home from a space of *being* to a space of *production* (you are producing data).
  *   **Resolution:** The violation isn't "who knows." It is the **existence of the record.** It creates a potential power asymmetry that didn't exist before.

  **4. The Partner and the Journal (Fiduciary Norms)**
  *   **The Case:** Reading the journal is a violation even if she learns nothing new.
  *   **The Principle:** This confirms privacy is not about secrecy. It is about **access rights.** In an intimate relationship, there are norms about how information is shared (voluntarily, verbally). Bypassing that mechanism violates the trust structure of the relationship, regardless of the informational content.

  ### The Painter Case

  **Case:** A painter does a hyperrealistic portrait of a stranger crying on a park bench and exhibits it.

  **Verdict:** **Violation.**

  **Reasoning:**
  This tests the limit of "Public Space."
  1.  **Civil Inattention:** In public spaces, there is a social norm of "civil inattention." We see each other, but we do not *fixate*. We allow people to be anonymous in the crowd.
  2.  **Context Collapse:** The crying person is in a *private emotional moment* occurring in a *public physical space*. By painting them hyperrealistically (making them identifiable) and exhibiting it (changing the context from "passing stranger" to "art subject"), the painter violates the norm of civil inattention.
  3.  **Vulnerability:** Crying signals vulnerability. Exploiting that vulnerability for art without consent violates the dignity norm, even if no law was broken.

  If the painter had drawn a stick figure, it would be fine (abstraction protects identity/context). If they painted a smiling person high-fiving, it might be fine (no vulnerability). But capturing identifiable vulnerability out of context is a privacy violation under Contextual Integrity.

  ### Which Verdict Must Die?

  You asked if you should throw out the Sidewalk case or the Instagram case to resolve the inconsistency.

  **You should keep both, but refine the Sidewalk case.**

  Your intuition on the Sidewalk case is fragile. If the stranger on the sidewalk stood there for 4 hours, took 500 photos with a zoom lens, and logged your movements, your gut would likely flip to "Violation."

  The principle isn't "Public vs. Private space." The principle is **"Reasonable Expectation of Contextual Flow."**
  *   **Sidewalk:** I expect to be seen casually. I do not expect to be studied.
  *   **Instagram:** I expect to be seen by my network. I do not expect to be data-mined by strangers.

  If you must sacrifice one to make the logic cleaner, **sacrifice the "Blinds Up" verdict.**
  In a high-surveillance society, the "assumption of risk" by leaving blinds up is becoming an outdated concept. If technology allows a stranger on the sidewalk to use thermal imaging or high-res zoom to see inside, the law is slowly shifting to say that *technological enhancement* violates privacy even in public view. However, for your current intuition, you can keep the Sidewalk verdict as long as you acknowledge it relies on the **limitations of human attention.**

  ### Summary of Your Principle

  Privacy is violated when:
  1.  **Context is breached:** Information moves from a context of trust/care (Doctor) or social sharing (Instagram) to a context of profit/surveillance (Data Firm/Stranger Dossier).
  2.  **Aggregation occurs:** Non-private data is combined to create a private profile (Mosaic Theory).
  3.  **Recording happens without agency:** Experience is converted to data without the subject's active participation (Smart Speaker).
  4.  **Vulnerability is exploited:** Public visibility is used to capture intimate states against norms of civil inattention (The Painter).

  Your gut is working correctly. The "mess" you feel is the collision between 20th-century privacy laws (based on secrecy and public spaces) and 21st-century reality (based on data flows and power asymmetry). You are intuitively arguing for **Contextual Integrity.** Stick with it.
