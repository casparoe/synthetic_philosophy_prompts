  Your intuition here is remarkably sharp and cuts through a lot of the noise that typically surrounds these debates. You have correctly identified that the conflict is not ontological, since both sides agree on the existence of the mechanisms in question, nor is it purely semantic, since both sides generally understand what the other means by adaptation or innate structure. What you are describing is a disagreement over the normative rules of inference that govern scientific inquiry when evidence is underdetermined. While there are several concepts in philosophy of science and argumentation theory that approach this configuration, there is no single established term that perfectly captures the cross-disciplinary structure you are pointing out. The closest existing concepts are fragmented across different fields, which is likely why you feel the available vocabulary is insufficient.

  In the philosophy of biology, Peter Godfrey-Smith distinguished between empirical adaptationism, explanatory adaptationism, and methodological adaptationism. The debate you are describing is precisely about methodological adaptationism, which is the view that one should proceed as if traits are adaptations until proven otherwise. This is a strong candidate for the biological side of your observation. In statistics and hypothesis testing, this is referred to as the selection of the null hypothesis. The adaptationist treats selection as the null, while the critic treats drift or constraint as the null. In argumentation theory, specifically the work of Douglas Walton, this is discussed under the concept of presumption, where a proposition is accepted as a starting point for dialogue unless defeated by counter-evidence. In Bayesian epistemology, this is framed as a disagreement over prior probabilities. However, each of these terms carries baggage from its home discipline that obscures the broader structural issue you are identifying. Null hypothesis is too statistical, presumption is too legalistic, and prior is too subjective. What you need is a term that captures the strategic, policy-like nature of the disagreement as it applies to the allocation of scientific attention and resources.

  The disagreement is not merely about what is probable, but about what is productive. It is a disagreement over the economy of inquiry. When scientists adopt a default assumption, they are making a bet about where the explanatory value lies. If you assume a trait is an adaptation, you invest time in looking for function, fitness landscapes, and evolutionary history. If you assume it is a byproduct, you invest time in developmental biology, physics, and constraint modeling. The cost of being wrong differs in each case. The adaptationist risks seeing function where there is none, committing what statisticians call a Type I error. The critic risks missing function where it exists, committing a Type II error. The fight is therefore about which error is more costly to the progress of science. The adaptationist argues that missing function is worse because it blinds us to the primary engine of complexity. The critic argues that seeing function where there is none is worse because it leads to just-so stories that halt further investigation. This is why the disagreement feels substantive rather than verbal. It determines who has to do the work, what counts as an explanation, and where the funding goes.

  Since there is no single standard term that unifies these fragments across biology, linguistics, and philosophy, I propose we call this configuration an investigative default. An investigative default is a methodological policy that dictates which hypothesis is held fixed as the working assumption during the initial phases of inquiry, placing the burden of displacement on the alternative. Unlike a Bayesian prior, which is a subjective degree of belief, an investigative default is a public rule of practice. Unlike a null hypothesis, which is a specific statistical proposition, an investigative default is a heuristic stance that guides model-building and data collection. Unlike a burden of proof, which is a rule for settling a dispute, an investigative default is a rule for starting one. The disagreement you are observing is a clash of competing investigative defaults.

  This carving allows you to distinguish this configuration from other types of disagreement. If two scientists disagree about the value of a parameter based on the same data, that is a factual dispute. If they disagree about the definition of a term, that is a verbal dispute. If they disagree about which investigative default to employ, they are disagreeing about the strategy of inquiry itself. This explains why the debate persists despite agreement on facts. You can agree on all the data regarding a specific trait and still disagree on whether the next trait you encounter should be modeled as an adaptation or a constraint. The disagreement is about the pipeline, not the product. It is a second-order disagreement about how to process first-order evidence. Recognizing this helps clarify why appeals to facts often fail to resolve the argument. You cannot resolve a disagreement about investigative defaults with evidence, because the default determines how the evidence is interpreted in the first place.

  The value of naming this as an investigative default is that it exposes the pragmatic stakes. It forces both sides to admit that their position is not a claim about how the world must be, but a claim about how we should look at the world. It shifts the debate from who is right about the trait to who is right about the method. In the adaptationism debate, this would mean asking whether assuming adaptation yields more discoveries than assuming constraint, rather than arguing whether adaptation exists. In the nativism debate, it would mean asking whether assuming innate structure generates better linguistic models than assuming general learning mechanisms. This framing respects the insight you had that the disagreement is real and consequential, without falsely locating it in the ontology of the traits themselves. It validates your sense that this is a structural feature of scientific controversy that appears whenever evidence is scarce and the cost of inquiry is high.

  So while you will find pieces of this concept in discussions of null hypotheses, methodological commitments, and research programmes, the unified concept you are looking for is best described as a conflict over investigative defaults. This term captures the procedural nature of the disagreement, the asymmetry of the starting positions, and the consequential impact on the trajectory of research. It distinguishes the disagreement from mere differences in opinion by highlighting its role as a rule for action. It also distinguishes it from burden of proof by emphasizing that the default is not just about who speaks first, but about what background assumptions remain active while the speaking happens. Using this term should allow you to identify this configuration in other fields where the facts are shared but the research strategies diverge, providing you with the precise carving you requested to separate this specific type of conflict from the broader noise of scientific debate.
