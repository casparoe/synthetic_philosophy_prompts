prompt: |-
  I help run a little forecasting meetup — about a dozen people who put probability calls on elections and such, smart but no formal training beyond some stats. Last month two members got into a multi-day spat about whether it's "irrational" to keep disagreeing about a prediction after they've both seen each other's numbers, and I've decided my next 30-minute session should be on the common prior assumption — what it says, and what it doesn't. Plan the session for me instead of explaining the ideas to me. What has to be in place first before the question is even interesting (I'd guess the split between prior and information needs to come before anything else?), what one concrete scenario should carry the whole thing — I want a case where two people rationally hold different credences after talking, so I can then show what extra assumption would squeeze them together — which misconceptions they'll walk away with (common prior means everyone has the same information, or "so we should just average our numbers", or "this proves everyday disagreement is irrational"), and where in the sequence each one should get headed off. Give me one question I can ask at the end to tell whether it actually landed. And be honest about what to just refuse to cover in half an hour — the full common-knowledge machinery, Harsanyi stuff, whatever it is — and say so out loud. Lead your response with the single most important sequencing decision and why, then the rest, no preamble and no restating of my question.
