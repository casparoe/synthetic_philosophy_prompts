answer: |-
  **Sequencing Decision:** Secure the legitimacy of different priors *before* introducing the Common Prior Assumption (CPA).
  **Why:** If you introduce CPA first, attendees will immediately reject it as unrealistic ("But I have private information!"). By first demonstrating that rational agents *can* disagree despite sharing data (because priors differ), you validate their intuition. This sets up CPA not as a rule they are breaking, but as a specific, strong theoretical constraint that *removes* one source of valid disagreement.

  ### 1. Prerequisites (Minutes 0–5)
  Before the scenario, establish the **Prior vs. Information Split**.
  *   **Definition:** Write this on the board: `Posterior Belief = Prior Belief + New Information`.
  *   **The Hook:** Ask, "If two people see the exact same poll data, must they have the exact same forecast?"
  *   **The Answer:** No. Not if they weight the data differently based on past experience (priors).
  *   **Goal:** Ensure everyone accepts that *different starting points* justify *different ending points*, even with shared data. This is the baseline for "rational disagreement."

  ### 2. The Concrete Scenario: The Two Urns (Minutes 5–20)
  Use this single narrative for the whole session. Do not switch examples.

  *   **Setup:** There are two urns. **Urn A** (70% Red balls), **Urn B** (30% Red balls). One urn is selected and placed on the table.
  *   **The Priors (The Divergence):**
      *   **Alice** knows the selector loves Urn A. She assigns an 80% prior probability to Urn A.
      *   **Bob** knows the selector hates Urn A. He assigns a 20% prior probability to Urn A.
  *   **The Information (Shared):** Both draw one ball from the urn. Both see **Red**.
  *   **The Talk:** They share their updated probabilities.
      *   Alice calculates: ~89% chance it's Urn A.
      *   Bob calculates: ~54% chance it's Urn A.
  *   **The Conflict:** They have talked. They have seen the same data. They still disagree.
      *   *Head Off Misconception #1 (CPA = Same Info):* Explicitly state: "They have the same information. They disagree because they started at different places."
  *   **The Squeeze (Introducing CPA):**
      *   Now, impose the **Common Prior Assumption**. Force Alice and Bob to agree that the urn was chosen by a fair coin flip (50/50 prior).
      *   They both see Red. They both do the math.
      *   **Result:** They both arrive at ~70%. They agree.
      *   *Head Off Misconception #2 (Just Average):* Explicitly state: "They didn't compromise or average their numbers. They converged because the input variable (prior) was identical."

  ### 3. Misconceptions & Real-World Application (Minutes 20–25)
  Address the lingering doubts before closing.

  *   **Misconception #3: "This proves everyday disagreement is irrational."**
      *   **Where:** Immediately after the Urn scenario.
      *   **Correction:** CPA is a theoretical assumption, not a descriptive law. In the real world, we *don't* have common priors (different life experiences) and we *don't* have common knowledge (private data). Therefore, real-world disagreement is usually rational.
  *   **Misconception #4: "Common Prior means we should trust each other blindly."**
      *   **Where:** During the "Squeeze" phase.
      *   **Correction:** CPA requires common knowledge of *honesty and rationality*. If you think I'm lying or bad at math, CPA doesn't apply.

  ### 4. What to Refuse to Cover (Explicit Note)
  Do not attempt to explain the **Common Knowledge Hierarchy** ("I know that you know that I know...").
  *   **Why:** In 30 minutes, this will turn into a logic puzzle that distracts from the intuition.
  *   **Substitution:** Use the phrase "Full Transparency." Tell them: "For this session, assume 'Common Knowledge' just means 'We both know the data, we both know each other's numbers, and we both trust each other's math.'"
  *   **Also Exclude:** Harsanyi Type Spaces and the formal proof of Aumann's Agreement Theorem. Stick to the Bayesian update mechanics shown in the Urn scenario.

  ### 5. Final Check Question (Minutes 25–30)
  Ask this to verify they understand the *source* of disagreement under CPA.

  **"In our Urn scenario, if Alice and Bob agree on the 50/50 prior (Common Prior) and see the same Red ball (Common Information), but still announce different probabilities, what is the only remaining explanation?"**

  *   **Target Answer:** One of them is being irrational (doing the math wrong) or dishonest.
  *   **Why this works:** It confirms they understand that under CPA + Shared Info, disagreement is impossible *unless* rationality breaks. It cements the theorem without requiring them to prove it.
