prompt: |-
  You are a professional philosopher specializing in the ethics of consent, and I would like you to adjudicate a family disagreement about a real-feeling case rather than deliver a lecture on the theory of consent generally. Please reason carefully about each move in the exchange below before giving verdicts.

  The case: my sister was admitted through the ER with severe abdominal pain. The surgeon told her she needed her gallbladder removed that night, said there was a small chance of complications, and mentioned only in passing that antibiotics and waiting were an alternative he wouldn't recommend. She signed the form about ten minutes after first meeting him, while in considerable pain. The surgery went fine.

  At dinner, my sister argued her consent was hollow. Her husband disagreed, and the exchange went several rounds:

  1. She said the consent was invalid because it was extracted under duress. Coercion doesn't require threats, she said: the surgeon controlled both the information and the clock, and exploited her pain and fear to get a signature. Exploiting someone's circumstances to extract agreement is enough to vitiate consent.
  2. He replied that on her definition every emergency treatment becomes coerced. A coercer has to make you worse off than you would otherwise be if you refuse; but if she'd refused, she'd simply be left where her illness already put her. The surgeon didn't create the harm that backed the pressure.
  3. She conceded the baseline point but said he was still making her deliberatively worse off than she needed to be: the compressed timing, the one-sentence mention of the alternative, the phrase "wouldn't recommend" doing the work of a warning while sounding like pure expertise. That may not be lying, she said, but it's deception by design.
  4. He answered that deception requires falsehood, and every sentence the surgeon uttered was true. Doctors are entitled to recommend, and if informed consent required the full menu presented with equal billing, nothing urgent could ever be consented to.
  5. She then shifted ground: the work he was assigning to truthfulness belongs to competence, and competence isn't a toggle but a threshold that pain and time pressure degrade. The surgeon chose a moment when she was at low capacity, so even if the information was accurate and no one threatened her, the whole setup was aimed at her signature rather than her decision. That, she said, is the difference between consent and mere compliance.
  6. He closed with a challenge: reverse the case. If she had wanted the surgery and the surgeon had leaned on her to wait, the structure would be identical, and she'd be praising his caution. A standard for valid consent can't depend on whether we happen to like the outcome it produced.

  Please adjudicate move by move: for each of the six moves, say whether it is clearly right, clearly mistaken, or right in part, and why. Then say who is more right overall, and identify anything both of them are missing.
reasoning: |-
  Here's a thinking process that leads to the adjudication:

  1.  **Analyze the Request:**
      *   **Role:** Professional philosopher specializing in the ethics of consent.
      *   **Task:** Adjudicate a specific family disagreement about a real-feeling case (sister's gallbladder surgery).
      *   **Constraint:** Do not deliver a general lecture on consent theory. Reason carefully about *each move* in the exchange.
      *   **Output Structure:**
          1.  Adjudicate each of the 6 moves (Right/Mistaken/Right in Part + Why).
          2.  Overall verdict (Who is more right?).
          3.  Identify what both are missing.

  2.  **Analyze the Case:**
      *   **Patient:** Sister, severe abdominal pain, ER admission.
      *   **Provider:** Surgeon.
      *   **Action:** Gallbladder removal (cholecystectomy) that night.
      *   **Process:** Met surgeon, told surgery needed, small chance of complications mentioned, antibiotics/waiting mentioned *in passing* (not recommended), signed form 10 mins after meeting, in considerable pain.
      *   **Outcome:** Surgery went fine.
      *   **Conflict:** Sister claims consent was hollow/invalid. Husband claims it was valid.

  3.  **Analyze the Exchange (Move by Move):**

      *   **Move 1 (Sister): Consent invalid due to duress/exploitation.**
          *   *Claim:* Coercion doesn't require threats. Surgeon controlled info/clock. Exploited pain/fear. Exploiting circumstances vitiates consent.
          *   *Philosophical Analysis:* Standard coercion theory (Nozick, Wertheimer) usually requires a proposal that makes the recipient worse off relative to a moral baseline *if they refuse*. However, "undue influence" or "exploitation of vulnerability" is a distinct category from strict coercion. She is conflating coercion with exploitation/vulnerability. Pain does impair autonomy, but does it *vitiate* consent entirely?
          *   *Verdict:* Right in part. She correctly identifies that vulnerability matters, but her definition of coercion is too broad (threatens emergency medicine).

      *   **Move 2 (Husband): Emergency treatment isn't coerced (Baseline Argument).**
          *   *Claim:* Coercion requires making you worse off than the baseline. Refusal = status quo (illness). Surgeon didn't create the harm.
          *   *Philosophical Analysis:* This is the standard Nozickian definition of coercion. It holds up well logically. If the doctor says "I will cut off your leg if you don't sign," that's coercion. If the doctor says "Your leg is infected, we need to cut it," that's not coercion, that's nature + treatment.
          *   *Verdict:* Clearly right (on the specific definition of coercion). He correctly identifies that the *source* of the pressure is the pathology, not the doctor's threat.

      *   **Move 3 (Sister): Deliberative worsening/Deception by design.**
          *   *Claim:* Concedes baseline. Argues info presentation was manipulative ("wouldn't recommend" as warning). Compressed timing. Deception by design (omission/framing), not lying.
          *   *Philosophical Analysis:* This shifts from coercion to *informed* consent and manipulation. Framing effects matter. "Wouldn't recommend" is a value judgment, not necessarily a fact, but if based on expertise, it's advice. However, minimizing an alternative (antibiotics) without explaining *why* (e.g., high recurrence rate) undermines informed consent. Time pressure affects voluntariness.
          *   *Verdict:* Right in part. She is right that framing and timing affect the *quality* of consent, but calling it "deception" is strong if the medical consensus truly favors surgery.

      *   **Move 4 (Husband): Truthfulness vs. Recommendation.**
          *   *Claim:* Deception requires falsehood. Sentences were true. Doctors can recommend. Full menu with equal billing makes urgent care impossible.
          *   *Philosophical Analysis:* Truthfulness is necessary but not sufficient for informed consent. Professional recommendation is part of the job. However, "equal billing" isn't the standard; "material information" is. If the alternative is viable but risky, it needs more than a passing mention. His slippery slope ("nothing urgent could ever be consented to") is a bit hyperbolic but points to a real practical constraint.
          *   *Verdict:* Right in part. He is right that doctors should advocate, but wrong that truthfulness alone satisfies informed consent standards (understanding and voluntariness matter too).

      *   **Move 5 (Sister): Competence/Capacity threshold.**
          *   *Claim:* Competence is a threshold degraded by pain/time. Surgeon chose a moment of low capacity. Aimed at signature, not decision. Consent vs. Compliance.
          *   *Philosophical Analysis:* This is her strongest move. Decision-making capacity (DMC) is situational. Pain and stress reduce DMC. If the surgeon *knows* capacity is low and proceeds without a surrogate or delay (if safe), consent is ethically shaky. The distinction between consent (authorization) and compliance (submission) is crucial.
          *   *Verdict:* Clearly right (mostly). Capacity is indeed contextual. If pain was "considerable" as stated, her ability to weigh risks was compromised.

      *   **Move 6 (Husband): Reverse Case/Outcome Independence.**
          *   *Claim:* Reverse the preference (she wants surgery, doctor says wait). Structure identical. Validity shouldn't depend on outcome.
          *   *Philosophical Analysis:* This is a strong proceduralist argument. Validity is about the process, not the result. However, the analogy fails slightly because the *risk profile* changes. If she wants surgery and he says wait, he is preventing harm. If he says operate and she is in pain, he is preventing harm. The structural symmetry holds, but it doesn't address the capacity issue raised in Move 5.
          *   *Verdict:* Right in part. He is right that validity is procedural, but wrong to ignore that the *direction* of the push matters relative to the patient's values and capacity.

  4.  **Synthesize Overall Verdict:**
      *   Who is more right? The Sister has the stronger ethical case regarding *informed* consent and *capacity*, even if the Husband wins on the strict definition of *coercion*. The medical ethics standard (Faden & Beauchamp) requires understanding, voluntariness, and competence. The process described (10 mins, high pain, minimized alternative) fails the "understanding" and "competence" thresholds more than it fails the "coercion" test.
      *   What are they missing?
          *   **The Emergency Exception:** Both ignore the specific ethical/legal waiver for emergencies where delay causes significant harm.
          *   **Surrogate Decision Making:** If capacity is low, where was the husband (proxy)?
          *   **Shared Decision Making:** The model used was paternalistic ("I recommend this") rather than collaborative.

  5.  **Drafting the Response:**
      *   *Tone:* Professional, analytical, precise, empathetic but rigorous.
      *   *Structure:* Follow the prompt's requirements (Move-by-move, Overall, Missing Elements).
      *   *Refinement:* Ensure I don't just say "Sister is right." I need to nuance *where* she is right (capacity/information) vs where she is wrong (coercion definition). Ensure I acknowledge the Husband's valid points about the nature of emergency medicine.

      *(Self-Correction during drafting)*: In Move 1, I need to be careful not to validate her definition of coercion too much, or it undermines emergency care. I should distinguish coercion from undue influence. In Move 5, I need to highlight that capacity is decision-specific. In the "Missing" section, I must mention the husband's role as a potential proxy since he was present at dinner (was he present at the hospital? The prompt implies he wasn't involved in the signing, just the dinner debate). Actually, the prompt says "She signed... 10 minutes after first meeting him." It doesn't say the husband was there. That's a key missing piece.

  6.  **Final Polish:** Check against the "professional philosopher" persona. Use terms like "normative baseline," "decision-making capacity," "paternalism," "procedural validity." Keep it focused on the adjudication, not a lecture.

      *Move 1:* Right in part. Confuses coercion with exploitation.
      *Move 2:* Clearly right. Standard baseline view.
      *Move 3:* Right in part. Framing affects voluntariness/understanding.
      *Move 4:* Right in part. Truth is necessary but not sufficient.
      *Move 5:* Clearly right. Capacity is the crux.
      *Move 6:* Right in part. Proceduralism is good, but ignores the capacity asymmetry.

      *Overall:* Sister wins on the quality of consent (capacity/info), Husband wins on the definition of coercion/necessity. Ethically, Sister's concerns carry more weight regarding autonomy.

      *Missing:* Emergency exception criteria, Proxy involvement, Distinction between authorization and permission.

      *Wait, one nuance:* The prompt asks me to adjudicate *moves*. I need to be decisive.
      Move 1: Mistaken on coercion, Right on vulnerability. -> Right in part.
      Move 2: Clearly Right on coercion baseline.
      Move 3: Right in part (Framing is manipulation, not necessarily deception).
      Move 4: Mistaken on sufficiency of truth. Right in part on recommendation.
      Move 5: Clearly Right (Capacity is key).
      Move 6: Right in part (Outcome independence is valid), but misses the capacity point.

      Let's refine the "Overall" verdict. In medical ethics, valid consent requires Capacity, Disclosure, Understanding, Voluntariness. The Sister attacks Disclosure, Understanding, and Capacity. The Husband defends Voluntariness (via non-coercion) and Disclosure (via truth). The Sister's attack on Capacity is the strongest philosophical point.

      Okay, ready to write.
answer: |-
  Here is the adjudication of the exchange, analyzed move by move, followed by an overall verdict and an identification of the blind spots in the debate.

  ### Adjudication of Moves

  **Move 1 (Sister): Coercion via Exploitation**
  *Verdict: Right in Part.*
  She is **mistaken** on the technical definition of coercion. In ethical theory (following Nozick or Wertheimer), coercion requires a proposal that threatens to make the recipient worse off relative to a moral baseline *if they refuse*. The surgeon did not threaten to worsen her illness; the illness did that. However, she is **right** to identify that coercion is not the only way consent can be vitiated. She is pointing toward *undue influence* or *exploitation of vulnerability*. Her intuition that power asymmetry and pain can compromise autonomy is correct, even if her label ("coercion") is imprecise.

  **Move 2 (Husband): The Baseline Defense**
  *Verdict: Clearly Right.*
  He correctly identifies the normative baseline. If the alternative to signing is "return to the state of severe illness caused by nature," the doctor is not the coercer. To rule this coercion would indeed make emergency medicine ethically impossible. He successfully defends the surgeon against the charge of *threatening* harm. However, this move only addresses coercion; it does not address whether the consent was *informed* or *competent*, which leaves her broader concern unaddressed.

  **Move 3 (Sister): Deliberative Worsening and Framing**
  *Verdict: Right in Part.*
  She is **right** that the *presentation* of information affects the validity of consent. Ethical informed consent requires not just truth, but understanding. Framing an alternative as "not recommended" without explaining the risks of that alternative (e.g., sepsis, recurrence) can function as manipulation, even if strictly truthful. She is **mistaken** to call this "deception by design" if the surgeon genuinely believed surgery was the standard of care. Professional recommendation is permissible; minimizing viable alternatives without justification is not. She correctly identifies that time pressure degrades deliberation, but she conflates "rushed" with "invalid."

  **Move 4 (Husband): Truthfulness and Recommendation**
  *Verdict: Right in Part.*
  He is **right** that deception requires falsehood and that doctors are not neutral information dispensers; they are advocates for health. A recommendation is not a violation of consent. However, he is **mistaken** in implying that truthfulness is sufficient for valid consent. A patient can be told nothing but truths and still not give valid consent if they lack the capacity to weigh them or if material alternatives are obscured by brevity. His slippery slope ("nothing urgent could ever be consented to") is rhetorical; urgent consent requires streamlined info, not absent info.

  **Move 5 (Sister): Capacity and Compliance**
  *Verdict: Clearly Right.*
  This is her strongest philosophical move. Decision-making capacity is not a binary switch but a threshold that fluctuates with pain, stress, and medication. If the surgeon proceeded when she was in "considerable pain" and allowed only ten minutes for deliberation, he may have bypassed a capacity threshold. There is a profound ethical distinction between *consent* (an authorized choice) and *compliance* (submission to authority). If the process was designed to secure a signature rather than ensure a choice, the moral validity is compromised, regardless of the medical outcome.

  **Move 6 (Husband): The Reverse Case Test**
  *Verdict: Right in Part.*
  He is **right** that the validity of consent must be outcome-independent. We cannot judge the ethics of the process solely by whether the patient is happy with the result. If the structure were reversed (patient wants surgery, doctor says wait), the procedural ethics should hold. However, his analogy is **flawed** because it ignores the asymmetry of risk. A doctor preventing a patient from undergoing unnecessary surgery protects bodily integrity; a doctor pushing a patient in pain toward surgery risks overriding autonomy. The "structure" is not identical because the stakes regarding bodily invasion differ.

  ### Overall Verdict

  **The Sister is more right overall.**

  While the Husband wins the technical argument on *coercion* (Move 2), the Sister wins the more significant ethical argument regarding *validity* (Move 5). In medical ethics, valid consent requires four elements: Capacity, Disclosure, Understanding, and Voluntariness. The Husband successfully defends Voluntariness (in the narrow sense of no threats). However, the Sister successfully challenges Capacity (due to pain/time) and Understanding (due to framing/minimization of alternatives).

  A signature obtained ten minutes after meeting a surgeon, while in severe pain, with alternatives dismissed in passing, constitutes **compliance** rather than robust **authorization**. The surgery may have been medically indicated, but the *consent process* was ethically deficient. The Husband defends the medical necessity; the Sister defends the autonomous process. In a liberal ethical framework, the process holds priority over the outcome.

  ### What Both Are Missing

  1.  **The Emergency Exception:** Neither party explicitly addresses the specific ethical waiver for emergencies. If the surgeon judged that waiting for pain management or a surrogate would result in significant harm (e.g., rupture), he is ethically permitted to proceed under *presumed consent* or emergency privilege. If this was truly "that night or never," the standard for informed consent lowers. They are debating standard consent rules for a potentially non-standard situation.
  2.  **Surrogate Decision-Making:** The Husband notes he is her husband but does not mention his presence during the admission. If the Sister's capacity was degraded by pain (as she argues in Move 5), the ethical recourse was not to cancel the surgery, but to seek consent from a surrogate (him) who was not under the same duress. The failure to involve a proxy when capacity is questionable is a key ethical omission in the case.
  3.  **Shared Decision Making:** Both assume a paternalistic model (Doctor recommends/Patient accepts or rejects). They miss the modern standard of *shared decision making*, where the surgeon should have asked, "I know you are in pain, but we need to decide. Do you want me to manage the pain first so you can think, or is this too urgent?" That specific offer would have resolved the capacity conflict.
