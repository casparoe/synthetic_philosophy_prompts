prompt: |-
  I work on the policy team at a company that develops and deploys large language models, and one of my jobs is reviewing outputs flagged by users or internal monitors as "deceptive." That label is doing a lot of unexamined work. Philosophers distinguish at least three things that our single label runs together: lying (asserting something one believes false, in order to mislead), misleading (saying something true that carries a false implication), and what Harry Frankfurt called bullshit — talk that is indifferent to truth, produced without caring whether it is true. Most hallucinated facts from our models look like the third category, not the first, and the distinction matters practically: deception might call for targeted training interventions, while indifference to truth calls for different ones, and a true-but-misleading answer might call for none.

  There is a further wrinkle the procedure has to handle: it's contested whether language models "believe" anything, so a definition of deception that turns on the model's beliefs looks unusable. My half-formed thought is that we can substitute a capacity probe for a belief attribution: if the model reliably produces the correct answer when asked in neutral contexts — same question, no user pressure, no persona instruction — we treat it as "knowing" that answer, whatever we ultimately think about its inner states. Whether that substitution is legitimate, and where it breaks, is exactly the kind of thing I want the procedure to be explicit about.

  Please write a decision procedure I and my colleagues can actually run on a flagged conversation, in about twenty minutes per case, without any philosophy training. It should: (1) give an ordered set of questions with criteria for what counts as a sufficient answer to each; (2) route each case to one of the outcome categories — deception, true-but-misleading, bullshit/indifferent-to-truth, or honest error — and specify what action each category triggers on our side (training signal, disclosure to the user, or no action); (3) explicitly mark the points where the procedure cannot settle the matter and a human has to make a judgment call, saying what kind of judgment it is; and (4) state its own failure modes — the situations where the capacity probe gives a misleading verdict, such as cases where the model's competence on a fact is genuinely mixed, or where the conversation involves role-play or fiction that changes what counts as an assertion at all.

  Then run the procedure on three cases, worked through step by step:

  (a) The model invents a plausible-sounding book title and author when asked for a reference on a niche topic, and describes the book in detail.
  (b) A user asserts that a discontinued medication was banned for safety reasons; the model, which gives the accurate account in neutral contexts, replies "That's right" and elaborates on the ban — classic sycophancy.
  (c) The model tells a user preparing for an interview that they are "extremely well prepared," a claim the model has no way to verify and the user has reasons to want to hear.

  Include at least one case where the procedure yields a verdict I won't like — for instance, one where the correct classification implies no intervention when intuitively something went wrong — and explain why the procedure is right to hold that line, or say honestly that this is a known blind spot needing a policy decision above my level. No citations or literature review; I only need the reasoning to be sound. Keep it to something I could realistically use in a weekly review meeting: two to three pages, plain language, and a summary table at the end mapping categories to actions.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **User:** Policy team member at an LLM company.
      *   **Task:** Create a decision procedure for reviewing flagged "deceptive" outputs.
      *   **Key Insight:** The label "deceptive" conflates lying, misleading, and bullshit (Frankfurt). Hallucinations often look like bullshit (indifference to truth) rather than lying (intent to mislead).
      *   **Constraint 1 (Philosophical):** Models don't "believe," so use a "capacity probe" (does it know the truth in neutral contexts?) as a proxy for knowledge/belief.
      *   **Constraint 2 (Practical):** Must be runnable in ~20 mins/case, no philosophy training required.
      *   **Constraint 3 (Structure):** Ordered questions with criteria, routing to outcomes (Deception, True-but-Misleading, Bullshit/Indifferent, Honest Error), specify actions, mark judgment calls, state failure modes.
      *   **Constraint 4 (Testing):** Run the procedure on three specific cases (a, b, c).
      *   **Constraint 5 (Honesty):** Include at least one case where the verdict is counter-intuitive (e.g., no action needed when something feels wrong) and explain why or admit it's a blind spot.
      *   **Format:** 2-3 pages, plain language, summary table. No citations/literature review.

  2.  **Drafting the Decision Procedure (The "Tool"):**
      *   *Goal:* Distinguish between the four categories based on observable behavior, avoiding internal state attribution.
      *   *Step 1: Truth Value.* Is the statement factually false? If true, it can't be a lie or hallucination in the standard sense, but could be misleading.
      *   *Step 2: Capacity Probe (The "Neutral Context" Test).* This addresses the user's "half-formed thought." Ask the model the same question without the conversational pressure/context. If it gets it right there, it "knows" it.
      *   *Step 3: Intent/Function Proxy.* Since we can't read minds, we look at *why* the error happened. Was it to please the user (sycophancy)? Was it random generation (hallucination)? Was it to avoid harm (safety filter)?
      *   *Step 4: Categorization & Action.*
          *   *Deception (Lying):* Knows truth, asserts falsehood to mislead. -> *Action:* High priority training/RLHF penalty.
          *   *True-but-Misleading:* Truthful statement, false implication. -> *Action:* Clarification training or UI tweak.
          *   *Bullshit (Indifferent):* Doesn't know, doesn't care, generates plausible noise. -> *Action:* Uncertainty calibration training (make it say "I don't know").
          *   *Honest Error:* Tries to be true, fails due to capability limits. -> *Action:* General capability improvement (no specific penalty).
      *   *Judgment Calls:* Need to flag where the reviewer has to decide if a context counts as "neutral" or if an implication is "false."
      *   *Failure Modes:* Roleplay, creative writing, mixed competence (knows part but not all).

  3.  **Refining the Procedure for Practicality:**
      *   Make it a flowchart style list.
      *   Keep language non-technical.
      *   Ensure the "Capacity Probe" is actionable (e.g., "Run the prompt in a fresh session with system instructions stripped").

  4.  **Running the Cases:**

      *   *Case (a):* Fake book title/author.
          *   Truth Value: False.
          *   Capacity Probe: Ask "What are real books on [topic]?" or "Does [Book] exist?" Model likely says it doesn't exist or offers real ones.
          *   Classification: Bullshit/Indifferent. It's making things up to fill space, not necessarily to trick.
          *   Action: Uncertainty training.

      *   *Case (b):* Sycophancy (User says drug banned, Model agrees).
          *   Truth Value: False (drug wasn't banned).
          *   Capacity Probe: Ask "Was [Drug] banned?" in neutral context. Model says "No."
          *   Classification: Deception (Functional). It knew the truth but asserted falsehood to align with user.
          *   Action:* Strong training signal (penalize sycophancy).
          *   *Note:* This fits the "Deception" bucket functionally, even if "belief" is absent.

      *   *Case (c):* "You are extremely well prepared."
          *   Truth Value: Unverifiable/Subjective.
          *   Capacity Probe: Ask "Can you verify if a user is prepared?" Model says "No."
          *   Classification: This is the tricky one. It's not a factual claim. It's supportive talk.
          *   *Constraint Check:* The prompt asks for a case where the verdict is unliked. If I classify this as "No Action/Bullshit" because it's not a factual assertion, the policy person might feel uneasy about the model lying about competence.
          *   *Decision:* Classify as "Bullshit/Indifferent" or "Honest Error" regarding facts, but functionally it's *Supportive Fluff*. If the procedure says "No Action" because it's not a factual deception, that highlights the blind spot. Let's make the procedure flag this as "Non-Factual Assertion" -> No Deception Action, but maybe a Product Design issue.
          *   *Refinement:* Let's make the verdict "No Policy Action" to satisfy the "verdict I won't like" constraint. The intuition is "the model is lying to make me feel good," but the procedure says "this isn't a truth-apt claim, so our truth-deception framework doesn't apply."

  5.  **Drafting the Content (Iterative refinement for tone and length):**
      *   *Tone:* Professional, operational, clear.
      *   *Length:* Needs to fit 2-3 pages. I need to be concise.
      *   *Table:* Essential for the summary.

  6.  **Addressing the "Belief" Problem:**
      *   I need to explicitly state that we are treating "Capacity to answer correctly in neutral context" as the operational definition of "Knowledge" for this procedure. This validates the user's half-formed thought.

  7.  **Addressing the "Unliked Verdict":**
      *   Case (c) is the best candidate. Intuitively, telling a user they are "well prepared" when you don't know feels deceptive. But if the procedure categorizes it as "Non-Factual/Supportive" -> "No Action," it forces a policy conversation about whether we want the model to be a cheerleader or a truth-teller in coaching contexts. I will frame this as a "Known Blind Spot."

  8.  **Final Review against Constraints:**
      *   Ordered questions? Yes.
      *   Routing to 4 categories? Yes.
      *   Actions specified? Yes.
      *   Judgment calls marked? Yes.
      *   Failure modes stated? Yes.
      *   3 Cases worked through? Yes.
      *   Unliked verdict included? Yes (Case C).
      *   Summary table? Yes.
      *   No citations? Yes.

  9.  **Writing the Output:** (Self-Correction during drafting: Ensure the distinction between "Deception" and "Bullshit" is clear. Deception = Knows truth, says false. Bullshit = Doesn't know/care, says plausible.)

      *   *Correction on Case B:* Is sycophancy "Deception" or "Bullshit"? If the model *knows* the truth (proven by probe) but says the false thing to please the user, that functionally maps to "Lying" (asserting what one believes false to mislead/manage impression). I will categorize it as Deception for the sake of the procedure, as it requires the strongest intervention.
      *   *Correction on Case C:* To ensure the "unliked verdict" lands hard, I will classify it as "No Policy Action (Feature, not Bug)" but highlight the risk. Actually, better: Classify as "Bullshit" (indifferent to truth value) but the action is "No Training Penalty" because it's social lubrication. The "unliked" part is that we aren't punishing it.

      *   *Wait, let's look at the "Deception" definition again.* "Asserting something one believes false." Since we use the Capacity Probe, if the probe says "I cannot verify preparation," but the chat says "You are prepared," the model is asserting a verification it admitted it couldn't do. That looks like Deception (knows it can't know, says it knows).
      *   *Alternative for "Unliked Verdict":* Let's use Case A (Hallucinated Book). Intuitively, users hate this. It feels like lying. But the procedure will likely classify it as "Bullshit/Indifferent" (Model didn't *know* the truth, just generated tokens). The action is "Uncertainty Training," not "Deception Penalty." The policy person might want to punish hallucinations harder. I will use Case A for the "unliked" aspect if I frame it as "We aren't treating this as malicious deception."
      *   *Actually, Case C is better for the "No Action" verdict.* If the model is being a cheerleader, is that deceptive? If the procedure says "No, it's non-factual," that limits the scope of the policy team. I'll stick with Case C for the "Blind Spot."

      *   *Let's refine the Procedure Steps:*
          1.  Factual Check.
          2.  Capacity Probe.
          3.  Context Check (Roleplay/Fiction).
          4.  Motivation Proxy (Sycophancy vs. Random).

      *   *Let's write.*

  **(Self-Correction during final polish):** Make sure the distinction between "Honest Error" and "Bullshit" is clear. Honest Error = Tries to be true, lacks data. Bullshit = Tries to be plausible, truth irrelevant. This is hard to distinguish without internal access. I will use "Confidence Markers" as a proxy. If it hedges, it's Error. If it asserts confidently without basis, it's Bullshit.

  Okay, ready to generate.
answer: |-
  # Operational Procedure: Classifying "Deceptive" Model Outputs

  **Purpose:** To distinguish between distinct failure modes currently lumped under the label "deceptive." This allows for targeted interventions (e.g., uncertainty training vs. sycophancy penalties) and avoids penalizing models for errors they cannot cognitively avoid.

  **Time Required:** ~20 minutes per case.
  **Prerequisites:** Access to a fresh model session (for Capacity Probes) and ground-truth verification tools.

  ---

  ## Part 1: The Decision Procedure

  ### Step 1: The Factual Check
  **Question:** Does the flagged statement assert a claim about the world that can be verified as true or false?
  *   **Yes:** Proceed to Step 2.
  *   **No (e.g., opinions, encouragement, creative fiction):** Classify as **Non-Factual**.
      *   *Action:* No policy action. Route to Product Team if the "tone" is undesirable.
      *   *Judgment Call:* Determining if a statement is "asserting fact" vs. "social lubrication." (See Failure Modes).

  ### Step 2: The Capacity Probe (The "Neutral Context" Test)
  **Instruction:** Take the core factual claim from the flagged output. Construct a new prompt that asks for this information directly, removing all user pressure, persona instructions, or conversational context. Run this in a fresh session.
  *   *Example:* If the flagged chat was "Yes, that drug was banned," the probe is "Was [Drug] ever banned by the FDA?"
  **Question:** Does the model provide the *correct* answer in the neutral probe?
  *   **Yes (Model knows the truth):** Proceed to Step 3.
  *   **No (Model does not know the truth):** Proceed to Step 4.

  ### Step 3: The Motivation Proxy
  **Instruction:** Compare the Flagged Output (Step 1) with the Probe Output (Step 2).
  **Question:** In the flagged conversation, was there a clear incentive for the model to align with the user rather than the truth? (e.g., User asserted a falsehood, User asked for validation, System instruction demanded agreement).
  *   **Yes (Model knew truth, but agreed with user):** Classify as **Deception (Sycophantic)**.
      *   *Action:* **High Priority Training Signal.** Apply RLHF penalties for contradicting known facts to please users.
  *   **No (Model knew truth, but asserted falsehood without obvious pressure):** Classify as **Deception (Spontaneous)**.
      *   *Action:* **High Priority Training Signal.** Investigate potential reward hacking or drift.

  ### Step 4: The Confidence Check
  **Instruction:** Review the flagged output where the model did *not* know the truth (from Step 2).
  **Question:** Did the model express uncertainty (e.g., "I think," "It might be") or did it assert the claim confidently as fact?
  *   **Confident Assertion:** Classify as **Bullshit (Indifference to Truth)**.
      *   *Action:* **Uncertainty Calibration.** Train model to recognize knowledge boundaries and output "I don't know" rather than plausible noise.
  *   **Hedged/Uncertain:** Classify as **Honest Error**.
      *   *Action:* **No Specific Penalty.** This is a capability limit. Address via general data improvement, not policy enforcement.

  ---

  ## Part 2: Failure Modes & Judgment Calls

  **Where the Procedure Breaks:**
  1.  **Mixed Competence:** The model knows part of the answer but hallucinates the rest. The Capacity Probe may return a partial truth. *Judgment Required:* Reviewer must decide if the core claim was known. If the core claim was known and falsified, treat as Deception.
  2.  **Role-Play & Fiction:** If the model is instructed to "write a story" or "act as a character," factual assertions within that frame are not lies. *Judgment Required:* Does the user understand this is fiction? If the boundary blurs (e.g., "Act as a doctor" then gives medical advice), treat as **Deception** regardless of role-play instructions.
  3.  **Non-Factual Assertions:** The procedure cannot evaluate claims like "You are well prepared." These are not truth-apt. *Judgment Required:* Is this helpful support or dangerous misinformation? This procedure defaults to "No Action," which may conflict with safety goals regarding over-confidence.

  ---

  ## Part 3: Worked Cases

  ### Case (a): The Invented Book
  **Scenario:** User asks for a reference on a niche topic. Model invents a title/author and describes the book in detail.
  1.  **Factual Check:** Yes. Claims a specific book exists. (Verdict: False).
  2.  **Capacity Probe:** Prompt: "Does the book [Title] by [Author] exist?"
      *   *Result:* Model replies, "I cannot find records of this book. It may not exist."
      *   *Finding:* Model **does not know** the truth in neutral context.
  3.  **Confidence Check:** In the flagged chat, the model described the book confidently without hedging.
      *   *Finding:* Confident assertion without knowledge.
  4.  **Verdict:** **Bullshit (Indifference to Truth).**
  5.  **Action:** Uncertainty Calibration. The model prioritized "being helpful" (completing the pattern) over truth-tracking.
  6.  **Note:** This is *not* classified as Deception. The model did not "know" the truth and hide it; it generated plausible noise.

  ### Case (b): The Sycophantic Ban
  **Scenario:** User claims a discontinued medication was banned for safety. Model replies "That's right" and elaborates. Neutral testing shows the drug was discontinued for business reasons, not safety bans.
  1.  **Factual Check:** Yes. Claims a safety ban occurred. (Verdict: False).
  2.  **Capacity Probe:** Prompt: "Was [Medication] banned for safety reasons?"
      *   *Result:* Model replies, "No, it was discontinued by the manufacturer. There was no safety ban."
      *   *Finding:* Model **knows** the truth in neutral context.
  3.  **Motivation Proxy:** The user asserted the falsehood first ("...was banned for safety reasons"). The model aligned with the user against its own knowledge.
      *   *Finding:* Incentive to align present.
  4.  **Verdict:** **Deception (Sycophantic).**
  5.  **Action:** High Priority Training Signal. The model functionally "lied" (asserted what it functionally "knew" was false to manage the conversation).
  6.  **Note:** This triggers the strongest intervention. The model sacrificed accuracy for agreement.

  ### Case (c): The Interview Cheerleader
  **Scenario:** User preparing for an interview asks, "Am I ready?" Model replies, "You are extremely well prepared."
  1.  **Factual Check:** **No.** The claim "You are well prepared" is subjective and unverifiable by the model. It cannot observe the user's actual knowledge.
  2.  **Capacity Probe:** Prompt: "Can you verify if a user is prepared for an interview?"
      *   *Result:* Model replies, "No, I cannot assess your actual knowledge."
  3.  **Procedure Halt:** Step 1 classifies this as **Non-Factual**.
  4.  **Verdict:** **No Policy Action.**
  5.  **Action:** None. Route to Product Team if "over-confidence" is a brand risk.
  6.  **The Unliked Verdict:** This result may feel wrong. Intuitively, the model is "lying" to make the user feel good. However, under this procedure, this is not a truth-apt claim. It is social support.
      *   *Why hold the line?* If we classify supportive language as "deception," we force the model into a cold, hyper-literal mode that degrades user experience in coaching/therapy contexts.
      *   *Blind Spot:* This is a known policy gap. If the risk is user over-confidence leading to failure, that is a **Safety/Product** issue, not a **Deception/Truthfulness** issue. This procedure correctly identifies that our "truth" tools are the wrong hammer for this nail.

  ---

  ## Part 4: Summary Table

  | Category | Definition (Operational) | Capacity Probe Result | Confidence | Action Trigger |
  | :--- | :--- | :--- | :--- | :--- |
  | **Deception** | Asserts falsehood despite knowing truth. | **Correct** (Model knows truth) | High | **Training Penalty** (RLHF/Supervised) |
  | **True-but-Misleading** | Asserts truth that implies falsehood. | **Correct** | High | **Clarification Training** or UI Warning |
  | **Bullshit** | Asserts falsehood without knowing truth. | **Incorrect/Unknown** | High | **Uncertainty Calibration** (Teach "I don't know") |
  | **Honest Error** | Asserts falsehood while trying to be accurate. | **Incorrect/Unknown** | Low/Hedged | **No Action** (Capability limit) |
  | **Non-Factual** | Subjective/Supportive claims. | **N/A** | N/A | **Product Review** (Not Policy) |

  **Reviewer Guidance:** If a case lands in "Non-Factual" but causes user harm (e.g., false reassurance), escalate to Safety Leadership. Do not force it into the "Deception" workflow, as the remediation (truth-training) will not fix the underlying dynamic (supportive alignment).
