prompt: |-
  I came out of a graduate course on decoherence a convinced Everettian, and next month I have to defend that conversion in my qualifying exam; the examiner on my committee is known for pressing that Everettians cannot so much as make sense of expecting anything, since every outcome of every measurement happens to someone. Before I rehearse the standard replies, I want to know what would actually count as a reply. Write the desiderata that any account of probability in a theory where every outcome occurs must meet: why it must single out the Born weights rather than some other measure of the branches; whether it may help itself to probabilistic or decision-theoretic assumptions en route or must instead justify them; what it owes agents facing one-shot events, where there is no long-run frequency to lean on; what it says to someone who asks what to expect when each future successor of her will see a different result; whether the account may depend on how finely branches are individuated, given that decoherence supplies no privileged grain; and what it must preserve empirically so that no experiment could favor collapse theories. For each requirement, give the case behind it, mark which are genuinely non-negotiable and which merely smuggle in a single-outcome picture of measurement, and say whether any subset is jointly unsatisfiable — and if one has to be surrendered, which is cheapest to give up. Please do not score the existing decision-theoretic or self-locating-uncertainty derivations against the list; it is the list itself I will be examined on.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** A graduate student converting to Everettianism (Many-Worlds Interpretation, MWI) for their qualifying exam.
      *   **Task:** Define the *desiderata* (requirements/criteria) that any account of probability in MWI must meet to satisfy a skeptical examiner (specifically one focused on the "incoherence problem" or "problem of making sense of expectation").
      *   **Constraints:**
          *   Do *not* evaluate existing derivations (Deutsch-Wallace, Sebens-Carroll, etc.) against the list. Focus *only* on the list itself.
          *   Address specific points: Born rule uniqueness, circularity/assumptions, one-shot events, subjective expectation ("what to expect"), branch individuation/grain, and empirical equivalence.
          *   For each requirement: Give the case behind it, mark if non-negotiable or smuggling single-outcome assumptions, and assess joint satisfiability (which is cheapest to give up).
      *   **Tone:** Academic, rigorous, philosophical, suitable for a qualifying exam context.

  2.  **Deconstruct the Core Problem:**
      *   The "Incoherence Problem" (or Quantitative Problem): In MWI, everything happens. Probability usually implies uncertainty about *what* happens. If everything happens, what is there to be uncertain about? And why should that uncertainty follow the Born Rule ($|\psi|^2$) rather than branch counting or something else?
      *   The Examiner's Challenge: "Everettians cannot make sense of expecting anything."

  3.  **Drafting the Desiderata (Iterative Process):**

      *   *Requirement 1: Uniqueness of the Measure (Born Rule).*
          *   *Case:* Why $|\psi|^2$ and not branch counting? If probability is just counting worlds, interference patterns break.
          *   *Status:* Non-negotiable for empirical adequacy.
          *   *Smuggling?* No, this is about matching the formalism.

      *   *Requirement 2: Circularity/Assumptions.*
          *   *Case:* Can we use probability to derive probability? Decision theory assumes rational agents maximize expected utility. Is that begging the question?
          *   *Status:* Contested. Needs to avoid *explicit* circularity, but some normative principles might be needed.
          *   *Smuggling?* Risky. If it assumes "uncertainty" to derive "probability," it might be smuggling single-outcome intuition.

      *   *Requirement 3: One-Shot Events.*
          *   *Case:* Frequency interpretations fail here. MWI needs to handle single measurements (e.g., Schrödinger's cat).
          *   *Status:* Non-negotiable. Real experiments happen once.
          *   *Smuggling?* No.

      *   *Requirement 4: Subjective Expectation ("What to expect").*
          *   *Case:* The examiner's specific point. If I split, one sees Up, one sees Down. What does "I expect Up" mean?
          *   *Status:* This is the hardest one. Is "expectation" coherent?
          *   *Smuggling?* High risk. "Expectation" usually implies exclusivity.
          *   *Cost:* This might be the one to give up or redefine radically (e.g., caring measure vs. belief).

      *   *Requirement 5: Branch Individuation (The "Grain" Problem).*
          *   *Case:* Decoherence is approximate. Branches aren't discrete countable objects.
          *   *Status:* Non-negotiable for mathematical consistency. The measure must be robust against basis changes.
          *   *Smuggling?* Branch *counting* smuggles discrete ontology. Measure does not.

      *   *Requirement 6: Empirical Equivalence.*
          *   *Case:* MWI must predict the same stats as Collapse theories to be viable.
          *   *Status:* Non-negotiable. Otherwise, it's falsified.
          *   *Smuggling?* No.

  4.  **Refining and Categorizing (The "Non-Negotiable" vs. "Smuggling" Analysis):**

      *   *Joint Satisfiability:* This is the crux. Can we have subjective uncertainty *and* deterministic branching *and* Born rule *and* no circularity?
      *   *The "Cheapest" to Give Up:* Likely the naive notion of "subjective expectation" (pre-measurement uncertainty about which outcome *will* occur). It needs to be replaced by something like "caring measure" or "self-locating uncertainty" which is distinct from standard single-outcome expectation. Or, one might have to admit a normative decision-theoretic axiom that looks suspiciously like probability (the "cheap" give-up might be the demand for *non-circular derivation* vs. *axiomatic postulation*).
      *   *Wait, looking closer at the prompt:* "If one has to be surrendered, which is cheapest to give up."
      *   *Option A:* Give up Empirical Equivalence? No, theory dies.
      *   *Option B:* Give up Branch Robustness? No, math breaks.
      *   *Option C:* Give up the idea that "Expectation" means "Belief about exclusive truth." This is the "Revise Concept" move.
      *   *Option D:* Give up the demand for a *derivation* and accept the Born rule as a primitive postulate. (Many Everettians hate this, but it's an option).
      *   *Decision:* The most philosophically defensible "surrender" is the pre-theoretic notion of *uncertainty as ignorance of exclusive fact*. It must be replaced, not kept. However, regarding the *desiderata list*, the requirement that "the account must make sense of standard pre-measurement expectation" is the one that smuggles single-outcome assumptions. So, that requirement should be flagged as the one to modify/surrender.

  5.  **Structuring the Response:**
      *   **Introduction:** Acknowledge the stakes (Qualifying Exam, Incoherence Problem).
      *   **The Desiderata List:** Numbered items corresponding to the prompt's specific points.
      *   **Structure per Item:**
          *   The Requirement.
          *   The Case (Why it's needed).
          *   Status (Non-negotiable vs. Smuggling).
      *   **Joint Satisfiability Analysis:** Can they all be met?
      *   **The Surrender:** Which one goes if they clash?
      *   **Conclusion:** Advice for the exam defense.

  6.  **Drafting Content (Self-Correction/Nuance Check):**
      *   *Check:* Did I evaluate Deutsch-Wallace? *No.* Good.
      *   *Check:* Did I address the "grain" of decoherence? *Yes, need to emphasize measure over count.*
      *   *Check:* Did I address the "one-shot" issue? *Yes, frequency is out.*
      *   *Check:* The "Expectation" point is the examiner's main weapon. I need to be precise. The requirement shouldn't be "recover naive expectation" but "recover the *functional role* of expectation."
      *   *Check:* Circularity. The requirement should be "Non-circular derivation" vs "Axiomatic input."
      *   *Refining the "Smuggling" label:* Be careful. Some assumptions look like smuggling but are actually necessary rationality constraints. Distinguish between *ontological* smuggling (assuming one outcome) and *normative* assumptions (rationality).

  7.  **Final Polish:** Ensure the tone is appropriate for a grad student talking to a committee (respectful but firm on the philosophy). Use standard terminology (Incoherence Problem, Quantitative Problem, Self-Locating Uncertainty, Caring Measure).

      *(Self-Correction during drafting)*: I need to make sure I explicitly answer "which is cheapest to give up."
      *   If I give up Empirical Equivalence -> MWI is false.
      *   If I give up Branch Robustness -> MWI is ill-defined.
      *   If I give up Non-Circularity -> MWI is less elegant but viable (postulate Born rule).
      *   If I give up "Standard Expectation" -> MWI requires conceptual revision (which Everettians admit).
      *   *Verdict:* The requirement that "Probability must represent pre-measurement uncertainty about which outcome *will* obtain" is the one that smuggles single-outcome metaphysics. It is the cheapest to surrender/revise. Alternatively, the demand for a *derivation* (non-circularity) is often relaxed to *justification* (decision theory). I will argue the conceptual revision of "expectation" is the key.

  8.  **Final Review against constraints:**
      *   Did I score existing derivations? No.
      *   Did I cover all 6 points mentioned in the prompt? (Born weights, assumptions, one-shot, expectation, grain, empirical). Yes.
      *   Did I mark non-negotiable vs smuggling? Yes.
      *   Did I discuss joint satisfiability? Yes.

      *Let's write.*
answer: |-
  To defend the Everettian interpretation (Many-Worlds Interpretation, MWI) against the charge of incoherence regarding probability, you must present a clear set of criteria that any solution to the "Quantitative Problem" (why the Born rule?) and the "Incoherence Problem" (how to make sense of chance?) must satisfy. Your examiner is probing whether you understand that the difficulty is not merely mathematical, but conceptual.

  Below are the six desiderata for an account of probability in MWI, analyzed according to your constraints.

  ### 1. Uniqueness of the Measure (The Born Rule)
  *   **The Requirement:** The account must derive or justify why the rational measure of existence (or probability) assigned to a branch is proportional to the squared amplitude ($|\psi|^2$) rather than the number of branches, the amplitude itself, or any other function.
  *   **The Case:** Without this, the theory cannot recover the statistical predictions of standard quantum mechanics. If probability were branch-counting, interference phenomena would not yield the correct statistics, and the theory would be empirically distinct from (and inferior to) collapse theories.
  *   **Status:** **Non-Negotiable.**
  *   **Smuggling?** No. This does not assume a single outcome; it assumes the formalism of the wavefunction is correct and asks for a consistent mapping from that formalism to observational statistics.

  ### 2. Non-Circularity of Assumptions
  *   **The Requirement:** The derivation of the Born rule should not explicitly presuppose probabilistic concepts (like "uncertainty" or "chance") in the premises that are meant to be concluded. It must justify probabilistic behavior from non-probabilistic foundations (deterministic unitary evolution + rationality).
  *   **The Case:** If the derivation assumes "agents act as if they are uncertain" to prove "agents should act as if they are uncertain with Born weights," it is viciously circular. The goal is to explain the *emergence* of probability, not to hide it in the axioms.
  *   **Status:** **Contested (High Value).**
  *   **Smuggling?** High Risk. Demanding that the premises be entirely free of *any* normative decision-theoretic structure often smuggles in a demand for a logical deduction of value from fact, which is generally impossible. However, demanding that the premises not include *probabilistic* ontology is fair.

  ### 3. One-Shot Adequacy
  *   **The Requirement:** The account must assign probabilities to single, non-repeatable measurements (e.g., a single spin measurement on a unique system) without relying on limiting frequencies over infinite ensembles.
  *   **The Case:** In MWI, every measurement creates a branching. Even a single measurement creates successors seeing different outcomes. An agent betting on a one-shot event needs a guide for action *now*. Frequency interpretations fail here because "frequency" across branches is ill-defined (due to the grain problem) and irrelevant to the single pre-branch agent.
  *   **Status:** **Non-Negotiable.**
  *   **Smuggling?** No. This is a standard requirement for any interpretation of probability, not specific to single-outcome views.

  ### 4. Coherence of Pre-Measurement Expectation
  *   **The Requirement:** The account must explain what it means for a pre-branch agent to say "I expect outcome X" when they know for a fact that successors will see both X and not-X. It must recover the *functional role* of expectation (guiding belief and action) without requiring the *ontological exclusivity* of outcomes.
  *   **The Case:** This is your examiner's primary weapon. In a single-outcome view, expectation tracks ignorance of the one true future. In MWI, there is no ignorance of the *global* future. If "expectation" requires believing only one outcome *will* happen, the Everettian is lying.
  *   **Status:** **The Pivot Point (Candidate for Surrender).**
  *   **Smuggling?** **Yes.** This requirement often smuggles the single-outcome assumption that "expectation" *must* imply "belief in exclusive truth." If the requirement is interpreted as "recover the *behavior* of expectation," it is non-negotiable. If interpreted as "recover the *phenomenology* of single-outcome ignorance," it smuggles.

  ### 5. Robustness to Branch Individuation (The Grain Problem)
  *   **The Requirement:** The probability measure must be independent of how finely or coarsely the branches are individuated. Since decoherence defines branches only approximately (there is no discrete "count" of worlds), the probability cannot depend on counting them.
  *   **The Case:** If probability depended on branch counting, one could manipulate probabilities simply by changing the basis or the coarse-graining of the decoherence functional. The measure must be continuous and basis-independent (unitarily invariant).
  *   **Status:** **Non-Negotiable.**
  *   **Smuggling?** No. In fact, insisting on branch *counting* is what smuggles a discrete ontology. Insisting on a measure robust to grain is required by the continuous mathematics of Hilbert space.

  ### 6. Empirical Equivalence
  *   **The Requirement:** The account must ensure that the predicted statistics for observers within branches match the predictions of standard collapse quantum mechanics exactly. No experiment should be able to distinguish MWI from Collapse based on statistical outcomes.
  *   **The Case:** If MWI predicts different frequencies than collapse theories (e.g., due to branch counting), it is empirically falsified by existing data.
  *   **Status:** **Non-Negotiable.**
  *   **Smuggling?** No. This is a condition for the theory's viability, not a metaphysical assumption about measurement.

  ---

  ### Joint Satisfiability and the "Cheapest" Surrender

  **Are they jointly satisfiable?**
  This is the heart of the debate.
  *   If you insist on **Non-Circularity (2)** and **Standard Expectation (4)** (interpreted as single-outcome ignorance), they are likely **jointly unsatisfiable**. You cannot derive subjective uncertainty about exclusive outcomes from a deterministic theory where all outcomes occur without smuggling the uncertainty in as a premise.
  *   However, if you revise **Standard Expectation (4)** to mean "Self-Locating Uncertainty" or "Caring Measure," joint satisfiability becomes plausible (as argued by decision-theoretic and self-locating approaches).

  **Which is cheapest to give up?**
  If you are forced to surrender one requirement to save the interpretation, the cheapest to give up is **Requirement 4 (Coherence of Pre-Measurement Expectation)**, *provided* you specify exactly what you are surrendering.

  *   **What to surrender:** You must surrender the notion that expectation requires *ontological exclusivity* (the belief that only one outcome will become real). You must admit that the pre-branch agent does not experience "ignorance of the future" in the classical sense.
  *   **What to keep:** You must keep the *functional role* of expectation (Requirement 4, revised). The agent must still act *as if* they are uncertain, and their bets must be guided by the Born rule.
  *   **Why it is cheapest:** Surrendering the naive phenomenology of uncertainty costs less than surrendering Empirical Equivalence (which kills the theory), Branch Robustness (which breaks the math), or the Born Rule Uniqueness (which contradicts data). It requires a conceptual revision of "probability" from "degree of belief in truth" to "degree of care for successors" or "measure of self-location," but this is a philosophical cost, not an empirical one.

  **Alternative Surrender:**
  The second cheapest is **Requirement 2 (Non-Circularity)**. One could argue that the Born rule is a primitive postulate of rationality in a branching universe, rather than something derived from non-probabilistic physics. This makes the theory slightly less elegant (less reductive) but saves it from the charge of incoherence. However, most Everettians prefer to surrender the naive concept of Expectation rather than admit a probabilistic axiom.

  ### Advice for the Qualifying Exam

  When your examiner presses you on "making sense of expecting anything," do not try to prove that the pre-branch agent is ignorant of *what will happen* (globally). Instead, argue that the requirement to "make sense of expectation" must be cashed out in terms of **decision-theoretic consistency** rather than **ontological ignorance**.

  *   **If they ask:** "How can you expect Up if Down also happens?"
  *   **You reply:** "I reject the premise that expectation requires the falsity of the alternative. I satisfy the desideratum of *functional expectation* (guiding action via the Born rule) while surrendering the desideratum of *exclusive truth-conditions* for that expectation. The cost is a revision of our concept of probability, not a failure of the theory."

  This shows you understand the landscape: you know which constraints are hard (empirical, mathematical) and which are soft (conceptual intuitions inherited from single-outcome metaphysics).
