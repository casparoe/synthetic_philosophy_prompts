  # Discussion Section Decision Tree: Causation by Omission

  **Instructions for the Discussion Leader:**
  Begin by reading the **Starting Case** aloud. Ask your classmates to answer the questions sequentially. Each question offers two paths; follow the path that matches the majority view of your class (or split the group if they disagree). The goal is to land on one of the nine **Leaves**, which represent distinct philosophical positions.

  ### Starting Case
  > You hire a gardener to water your plants while you are away. The gardener goes on holiday instead, does not water the plants, and they die. We are inclined to say the gardener killed the plants by not watering them.

  ---

  ### Node 1: The Status of the Claim
  **Question:** When we say the gardener "killed" the plants by not watering them, are we stating a **literal fact about the physical world**, or are we just stating a fact about **who we should blame**?
  *   **A. Literal fact about the physical world:** Go to **Node 4**.
  *   **B. Fact about blame/responsibility:** Go to **Node 2**.

  ### Node 2: The Double Prevention Contrast (Pragmatic Branch)
  **Question:** Imagine a net that catches a baseball, preventing it from breaking a window. Is the gardener's *not-watering* the **same kind of cause** as the net *catching* the ball?
  *   **A. Yes, they are the same kind of cause:** Go to **Leaf 1**.
  *   **B. No, they are different kinds of cause:** Go to **Node 3**.

  ### Node 3: The Duty Contrast (Pragmatic Branch)
  **Question:** Think of a random neighbor who also *didn't* water your plants (but had no job to do so). Is it **false** to say the neighbor caused the death, or just **unhelpful/misleading** to say it?
  *   **A. It is literally false:** Go to **Leaf 2**.
  *   **B. It is true but misleading:** Go to **Leaf 3**.

  ### Node 4: The Nature of the Cause (Realist Branch)
  **Question:** If this is a physical fact, was the cause the **missing water itself** (an absence), or a **positive thing** the gardener did (like traveling on holiday)?
  *   **A. A positive thing (an event/state):** Go to **Leaf 4**.
  *   **B. The missing water itself (an absence):** Go to **Node 5**.

  ### Node 5: The Proliferation Problem
  **Question:** If the cause is the *missing water*, did **everyone** who didn't water the plants (including you, the Prime Minister, and Genghis Khan) cause their death?
  *   **A. Yes, everyone caused it:** Go to **Leaf 5**.
  *   **B. No, only some people caused it:** Go to **Node 6**.

  ### Node 6: The Basis of Restriction
  **Question:** What stops the Prime Minister from being a cause? Is it because they had no **duty/job** to water, or because they weren't **physically nearby**?
  *   **A. Because they had no duty/job:** Go to **Node 7**.
  *   **B. Because they weren't physically nearby:** Go to **Node 8**.

  ### Node 7: The Inanimate Omission Test
  **Question:** Consider a pacemaker that fails to deliver a shock, and the patient dies. Did the **machine** cause the death by omission, even though it has no duties?
  *   **A. Yes, the machine caused it:** Go to **Leaf 6**.
  *   **B. No, only agents can omit:** Go to **Leaf 7**.

  ### Node 8: The Location of Absence
  **Question:** If it depends on being nearby, where is the "not-watering" located? Is it **in the flowerpot** (where the water isn't), or **nowhere at all**?
  *   **A. In the flowerpot:** Go to **Leaf 8**.
  *   **B. Nowhere at all:** Go to **Leaf 9**.

  ---

  ### The Leaves (Positions)

  **Leaf 1: Unified Pragmatism**
  *   **Description:** You view causation as a broad category that includes both actions and preventions/omissions, but you treat the "causal" label as sensitive to context or interests rather than deep metaphysics.
  *   **Literature Name:** *Contrastivism* or *Pragmatic Causal Selection*.

  **Leaf 2: Causal Error Theory**
  *   **Description:** You believe omissions are never genuine causes. We talk as if they are to assign blame, but strictly speaking, nothing caused the plants to die except perhaps the heat or sunlight.
  *   **Literature Name:** *Causal Nihilism regarding Omissions* (e.g., Moore).

  **Leaf 3: Contextualism**
  *   **Description:** You think omission-causation claims can be true, but their truth depends on the conversational context (e.g., who we are comparing the gardener to).
  *   **Literature Name:** *Causal Contextualism*.

  **Leaf 4: Causal Reductionism**
  *   **Description:** You believe there is no such thing as "causation by absence." The real cause was a positive event (the gardener traveling), which prevented the watering.
  *   **Literature Name:** *Event-Based Reductionism* (e.g., Davidsonian views).

  **Leaf 5: Unrestricted Absence Realism**
  *   **Description:** You accept that absences are real causes and accept the consequence that countless absences (Genghis Khan, the Prime Minister) cause every event.
  *   **Literature Name:** *Liberal Realism* (e.g., Lewis).
  *   **Note:** This view is often defended by biting the bullet on proliferation.

  **Leaf 6: Unnamed (Normative Naturalism)**
  *   **Description:** You think absences cause only when there is a normative expectation, but you extend this to machines.
  *   **Awkward Commitment:** This view implies that inanimate objects like pacemakers can have "duties" or "jobs" in a metaphysical sense, which is difficult to explain without anthropomorphizing the machine.

  **Leaf 7: Agent-Only Realism**
  *   **Description:** You believe absences can be genuine causes, but only when they involve the inaction of an agent who could have acted.
  *   **Literature Name:** *Agency-Based Realism*.

  **Leaf 8: Localized Absence Realism**
  *   **Description:** You believe absences are real causes located at the specific site of the effect (the dry soil).
  *   **Literature Name:** *Spatial Realism about Absences*.

  **Leaf 9: Unnamed (Non-Spatial Realism)**
  *   **Description:** You believe absences are real causes but have no spatial location.
  *   **Awkward Commitment:** This view requires causation to occur without spatial contact between the cause (nowhere) and the effect (the pot), challenging standard physical intuitions about how causes transmit energy or influence.
  *   **Discrimination Flag:** **Leaf 8 and Leaf 9 are difficult to separate empirically.** A classmate might argue the absence is "nowhere" but still "acts at" the pot, blurring the line between Localized and Non-Spatial Realism.

