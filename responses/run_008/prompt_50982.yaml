answer: |-
  Good morning. Thank you for being here to remember her.

  I spent last week cleaning out her office. Among the textbooks and the papers, I found a small black notebook labeled, in her handwriting, "Evidence." Inside weren't proofs of crimes or scientific theories, but lists of weird words she'd heard during the week. "Petrichor." "Borborygmus." She wasn't collecting them to use them in a book or to teach a class. She collected them because she liked how they felt in her mouth. She collected them for the same reason she did jigsaw puzzles of paintings she didn't even like. She wasn't trying to finish the puzzle. She just liked sorting the pieces by color on a Tuesday afternoon.

  For forty years, she taught philosophy. But if you asked her what she believed, she wouldn't talk about ethics or logic. She'd talk about play. She believed that life isn't a project to be completed. There was no finish line she was racing toward. She thought that when we live only for tomorrow—for the weekend, for retirement, for the next generation—we miss the only thing that's actually real, which is today.

  Some of you know she loved her grandchildren more than anything. She didn't love them because of what they might become. She didn't see them as a legacy to be built. She loved them because of the way they played in her living room. She loved the noise, the mess, the immediate joy of being together right then. She wasn't investing in the future; she was spending time in the present.

  I know some of us find comfort in the idea that everything happens for a reason, or that a life is a journey toward a destination. She respected those beliefs. But her own faith was quieter. She found the sacred not in the ultimate answer, but in the immediate question. She found holiness not in the afterlife, but in the alive-ness of this one.

  The image I keep coming back to is her recorder group. Every Wednesday night, friends would come over. They weren't good musicians. Some of them, including her, played badly. They played badly on purpose. They never performed for anyone. There was no audience, no concert, no recording. They simply made music together for an hour, and then they put the instruments away and had tea.

  When I asked her why she bothered, since she wasn't trying to improve or perform, she smiled and said, "The music isn't for the end of the song. It's for the breathing."

  That was her art. She kept the play alive while the responsibilities piled up. She didn't wait for permission to enjoy herself. She didn't wait until her work was done, because she knew the work was never done. She just started playing.

  So, how do we comfort ourselves now? We don't find it by saying her life is complete. It isn't complete, because it wasn't a task. We find comfort by remembering that the music happened. The notes she played on those Wednesday nights didn't vanish just because the song ended. The time she spent sorting puzzle pieces wasn't wasted time. It was lived time.

  She taught us that meaning isn't something you hunt down in the distance. It's something you do, like making a sound, like fitting a piece into place, like saying a weird word out loud just to hear it. She is not here to finish anything. But she was here to play. And she played beautifully.

  \answer{Playing badly on purpose}
