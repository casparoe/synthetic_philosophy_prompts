      *   *Critique:* Vacuous.
      *   *Revision:* "Isolated pairwise judgments in long chains are susceptible to cognitive limitations or context shifts, regardless of whether the underlying value relation is transitive." (Allows Structuralist to call it error, Intransitivist to call it structural noise).

  **Boundary Decisions:**
  *   *Parity:* If we include "on a par," the logic becomes tripartite (Better, Worse, Par). This complicates the transitivity test (is Par transitive?). To focus on the specific dispute regarding "better than," we will quarantine parity. If two items are on a par, they are not "better than" each other, so they drop out of the strict inequality chain.
  *   *Equality:* "Equally as good as" is generally treated as an equivalence relation (transitive). If the Intransitivist argues equality is also intransitive, the problem becomes global indeterminacy. We will bracket equality and focus strictly on strict betterness ($>$).

  **Verbal/Concession Flags:**
  *   *Verbal:* There is a risk the Structuralist defines "better than" as *by definition* transitive, making their claim tautological. The Intransitivist defines it by *phenomenology*. We need to ensure they are arguing about the same concept.
  *   *Concession:* The Structuralist may concede too much by allowing "standpoint relativity." If "better" is always "better relative to standpoint S," and S shifts, is it still the same relation? This needs monitoring.

