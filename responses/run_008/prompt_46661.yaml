  # ADVERSARIAL COLLABORATION DRAFT: THE TRANSITIVITY OF BETTERNESS

  **To:** The Reading Group
  **From:** [Commissioned Drafter]
  **Subject:** Draft Consolidation of Positions on the Transitivity of "Better Than"

  ## PREAMBLE AND BOUNDARY CONDITIONS

  This document serves as the baseline for the final adjudication of the dispute regarding the transitivity of the relation "better than." The goal is not to force a premature consensus, but to isolate the precise locus of disagreement and establish empirical or conceptual tests that could resolve it.

  Before proceeding to substantive claims, two boundary conditions are established to delimit the scope of this inquiry:

  1.  **Exclusion of Parity:** Cases involving "parity" (where two items are comparable but neither is better nor are they equally good) are quarantined. This collaboration focuses exclusively on the binary relation of strict betterness ($>$). If a pair of items is judged to be "on a par," they are treated as lacking the "better than" relation for the purposes of this chain, rather than as evidence of intransitivity.
  2.  **Bracketing of Equality:** The relation "equally as good as" ($=$) is assumed to be transitive for the duration of this analysis. We are investigating whether strict betterness fails transitivity, not whether equivalence fails. We acknowledge that if betterness is intransitive, the interaction between $>$ and $=$ requires revision, but that is a secondary downstream problem.

  ## SECTION I: SUBSTANTIVE AGREED CLAIMS

  The following claims are endorsed by both the Structuralist and the Intransitivist. These are not mere pleasantries; they rule out specific error theories and establish the playing field.

  1.  **The Phenomenology of the Spectrum:** In a spectrum sequence (e.g., lives varying in duration and quality, or pains varying in intensity and length), competent evaluators will consistently judge adjacent item $n$ to be better than adjacent item $n+1$, while simultaneously judging the first item in the sequence to be worse than the last item. Both parties agree this phenomenology is robust and not easily dismissed as simple confusion.
  2.  **The Distinction between Value and Choice:** The relation "better than" (axiological) is conceptually distinct from "more choiceworthy than" (practical). While standard views hold that one ought to choose the better option, both parties agree that decision-theoretic constraints (such as avoiding money pumps) apply primarily to choice and preference, and only derivatively to betterness. A failure of transitivity in choice does not automatically prove a failure of transitivity in betterness, nor vice versa.
  3.  **The Role of Formal Models:** Standard representation theorems in decision theory require transitivity to assign real numbers to values. Both parties agree that if "better than" is intransitive, standard additive utility models are inadequate descriptions of the axiological landscape. The disagreement lies in whether this inadequacy reveals a flaw in the models or a flaw in the world.
  4.  **Contextual Sensitivity of Judgment:** Both parties agree that human evaluative judgments are sensitive to context, framing, and the specific alternatives present in a choice set. The Structuralist attributes the spectrum phenomenon to this sensitivity shifting the *meaning* of the terms; the Intransitivist attributes it to this sensitivity revealing the *structure* of the value. Both agree the sensitivity exists.
  5.  **No Hidden Lexical Thresholds (Initial Stipulation):** For the purpose of the core spectrum argument, we agree to construct chains where no single step involves a lexical leap (a change in kind that arguably trumps all quantitative changes). The chain must proceed via marginal differences. This prevents the Structuralist from dissolving the problem by claiming a hidden "kind change" occurs at every step.

  ## SECTION II: TABLE OF RESIDUAL DISAGREEMENTS

  The following table isolates the specific points of contention. The wording has been vetted to ensure neither party feels their position is misrepresented.

  | Topic | Structuralist Position | Intransitivist Position |
  | :--- | :--- | :--- |
  | **The Nature of the Relation** | Transitivity is constitutive of the concept "better than." If $A > B$ and $B > C$ but not $A > C$, the term "better" is being used in different senses in each comparison. | Transitivity is a contingent property of a relation. "Better than" picks out a specific axiological relation that, as a matter of fact, fails to transmit across long chains of marginal difference. |
  | **Explanation of Spectrum Cases** | The apparent intransitivity is an illusion caused by a shift in the *evaluative standpoint* or the *weighting of criteria* between pairwise comparisons. The relation itself remains transitive. | The apparent intransitivity is veridical. The relation itself is intransitive. The shift in judgment reflects the actual structure of value (e.g., sorites susceptibility), not a shift in the definition of value. |
  | **Normative Implications** | Because transitivity is conceptual, rational agents must refine their judgments until transitivity is restored. Intransitive judgments indicate a failure of rationality or clarity. | Rational agents may need to adopt decision rules that accommodate intransitivity (e.g., maximizing within local sets rather than global optimization). Rationality does not demand the impossible. |
  | **Semantic Stability** | The word "better" is context-indexed. To make the relation transitive, one must fix the context/standpoint explicitly. | The word "better" is stable. Fixing the context does not dissolve the intransitivity; it merely clarifies that the stable relation is intransitive. |

  ## SECTION III: CRUXES AND PREDICTIVE TESTS

  To move beyond stalemate, we identify three "cruxes." These are sub-questions where an answer would force at least one party to revise their position. For each crux, we specify a concrete test and the conflicting predictions.

  ### Crux 1: The Fixed-Standpoint Regimentation
  **Question:** Does explicitly fixing the evaluative criteria (the "standpoint") for the entire chain eliminate the intransitive judgment?
  **Test:** Construct a spectrum chain where the criterion for "better" is explicitly defined operationally for every step (e.g., "Item X is better than Y if and only if X scores higher on metric M"). We then run the spectrum through this metric.
  *   **Structuralist Prediction:** If the metric $M$ is a real-valued function, transitivity *must* hold mathematically. If the intuitive judgment of intransitivity persists despite the fixed metric, the intuitive judgment is simply an error in processing the metric, not a feature of value. The intransitive intuition will evaporate under regimentation.
  *   **Intransitivist Prediction:** Even with a fixed metric, if the metric relies on human intuition (e.g., "choose the more painful experience"), the intransitivity will survive. If the metric is purely physical (e.g., milliseconds of duration), it ceases to be an *evaluative* comparison. The residue of intransitivity will survive in any metric that captures *value* rather than mere *quantity*.
  *   **Settling Condition:** If a fixed evaluative metric yields transitivity, the Structuralist gains ground. If a fixed evaluative metric yields intransitivity, the Intransitivist wins.

  ### Crux 2: The Money Pump with Exit Costs
  **Question:** Does acting on intransitive betterness judgments necessarily lead to exploitable loss (a money pump)?
  **Test:** An agent is offered a sequence of trades based on the spectrum chain ($A \to B \to C \dots \to Z \to A$), paying a small fee for each trade.
  *   **Structuralist Prediction:** The agent will lose value. If $A$ is truly better than $Z$, returning to $A$ should be a gain, but the fees ensure a net loss. This proves the initial judgments were flawed because rational preference cannot be cyclic.
  *   **Intransitivist Prediction:** The agent may not lose *value*, only *resources*. If "better than" is intransitive, the cycle $A > B > \dots > Z > A$ is possible. The fees represent a loss of resources, but not necessarily a violation of value maximization if value is not aggregative in that way. Alternatively, the agent will refuse the final trade ($Z \to A$) because the gap between $Z$ and $A$ is large enough to trigger a different evaluative mode, breaking the pump.
  *   **Settling Condition:** If an agent can be pumped indefinitely without recognizing a loss in value, the Intransitivist position is strengthened (suggesting standard decision theory is the problem). If the pump forces the agent to admit a mistake in valuation, the Structuralist is vindicated.

  ### Crux 3: The Semantic Shift vs. Structural Discovery
  **Question:** Is "better than" a context-sensitive expression (like "tall" or "near")?
  **Test:** Present two identical items, $X$ and $Y$, in two different contexts. Context 1: $X$ and $Y$ are compared alone. Context 2: $X$ and $Y$ are compared as part of a long spectrum chain. Ask if the truth value of "$X$ is better than $Y$" changes.
  *   **Structuralist Prediction:** The truth value *appears* to change, but strictly speaking, the proposition changes. In Context 1, it means "Better-relative-to-local-standpoint." In Context 2, it means "Better-relative-to-chain-standpoint." Once indexed, the contradiction disappears.
  *   **Intransitivist Prediction:** The truth value *actually* changes for the same proposition. "Better than" is not indexical in a way that saves transitivity. The relation is stable, but non-transitive. The context changes the *salience* of the value, not the *meaning* of the term.
  *   **Settling Condition:** If speakers accept that they were "speaking loosely" in one context and "precisely" in the other, the Structuralist wins. If speakers insist they meant the exact same thing in both contexts and the judgment still flips, the Intransitivist wins.

  ## SECTION IV: ANALYST NOTES ON VERBAL DISPUTES AND CONCESSIONS

  **1. Potential Verbal Dispute:**
  There is a significant risk that the disagreement is verbal regarding the definition of "better than."
  *   **The Issue:** The Structuralist tends to treat "better than" as a term that *must* satisfy logical consistency conditions to count as "betterness." The Intransitivist treats "better than" as a label for a phenomenological experience of preference or valuation.
  *   **Diagnosis:** If the Structuralist defines "better than" as "a transitive ordering relation," their claim is analytically true but trivial. If the Intransitivist defines it as "whatever guides our pairwise choices," their claim is empirically robust but may not be about *value* in the Structuralist's sense.
  *   **Recommendation:** The parties must agree on whether they are doing **conceptual analysis** (what must "better" mean?) or **phenomenological description** (how do we actually judge?). The Cruxes above are designed to force this into the open.

  **2. Flagged Concession (Structuralist):**
  In Section I, Claim 4, the Structuralist has agreed that "human evaluative judgments are sensitive to context."
  *   **Risk:** This may concede too much ground. If context sensitivity is robust enough to alter truth conditions, the Structuralist's claim that transitivity is a "conceptual truth" is weakened. It suggests "better" is not a rigid designator.
  *   **Note:** The Structuralist should clarify whether this sensitivity is an *epistemic* limitation (we get confused) or a *semantic* feature (the meaning shifts). The draft currently blurs this.

  **3. Flagged Concession (Intransitivist):**
  In Section I, Claim 3, the Intransitivist has agreed that "standard representation theorems... require transitivity."
  *   **Risk:** This may imply that the Intransitivist accepts the authority of standard decision theory as a normative benchmark.
  *   **Note:** The Intransitivist should clarify that they view this as a limitation of *theory*, not necessarily a requirement of *rationality*. They should not be read as conceding that intransitive agents are irrational, only that they are unrepresentable by standard models.

  **4. Final Recommendation:**
  The collaboration should proceed by testing **Crux 1** first. If a fixed evaluative metric restores transitivity, the Structuralist's "shifting standpoint" explanation is vindicated. If it does not, the Intransitivist's "structural discovery" claim stands. This is the most tractable empirical/Conceptual hinge.
