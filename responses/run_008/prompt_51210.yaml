answer: |-
  Here is a complete lesson plan designed to generate the Surprise Exam Paradox through gameplay before you ever write a logical symbol on the board.

  # Lesson Plan: The Unexpected Quiz Game
  **Course:** Paradoxes and Puzzles (First-Year Seminar)
  **Time:** 80 Minutes
  **Students:** 16
  **Goal:** Students experience the backward induction and the "annoyance" of the surprise through incentives, then analyze the epistemic conditions in the debrief.

  ---

  ## 1. Materials & Setup
  *   **The "Syllabus" Contract:** A printed slide or handout stating the rules (see below).
  *   **5 Envelopes:** Labeled Mon, Tue, Wed, Thu, Fri. Inside 4 are empty. Inside 1 is a card saying **"QUIZ TODAY."** (Seal them in front of the class).
  *   **Prediction Slips:** Small index cards (2 per student per round).
  *   **Scoreboard:** Whiteboard space to track 16 students' scores (or use a shared spreadsheet projected on screen).
  *   **Currency:** "Logic Points" (LP). Start everyone at **100 LP**. Final LP converts to participation credit (e.g., >150 LP = Full Credit).

  ## 2. The Rules (Project this immediately)
  1.  **The Promise:** Exactly one quiz will occur this "week" (5 rounds). It will be a **Surprise**.
  2.  **Definition of Surprise:** If, on the morning of the Quiz Day, the class *collectively* makes it impossible to give the quiz, the promise is broken.
      *   *Operational Rule:* If **>75% of students** (12+ people) predict "Quiz Today" on the actual Quiz Day, the Quiz is **VOID**. It cannot happen (because it wasn't a surprise).
  3.  **The Night Phase:** Before each "Day," you submit a prediction slip: **"QUIZ"** or **"NO QUIZ."**
  4.  **Payoffs:**
      *   **Quiz Happens & You voted NO:** You were surprised. **-20 LP** (Penalty for being unprepared).
      *   **Quiz Happens & You voted YES:** You predicted it. **+50 LP** (Reward for cleverness). *BUT* if >75% vote YES, see Rule 2 (Void).
      *   **No Quiz & You voted YES:** False Alarm. **-10 LP**.
      *   **No Quiz & You voted NO:** Correct. **+5 LP**.
  5.  **Void Penalty:** If the Quiz is VOIDed (because >75% predicted it), the Instructor loses. All students get **+100 LP** instantly, and the week ends.

  ---

  ## 3. Timeline (80 Minutes)

  ### Phase 1: The Public Announcement (45 Minutes)
  *   **0:00–0:05: Setup.** Hand out starting scores (100 LP). Show the 5 sealed envelopes. Shuffle them visibly. Place one on the podium. *Do not explain the paradox.* Just read the rules above.
  *   **0:05–0:10: Monday Night.** Students vote. (Likely mostly "NO QUIZ").
      *   *Reveal:* Open Monday envelope. (Assume Empty). Update scores.
  *   **0:10–0:15: Tuesday Night.** Students vote.
      *   *Reveal:* Open Tuesday envelope. (Assume Empty). Update scores.
  *   **0:15–0:20: Wednesday Night.** Students vote.
      *   *Reveal:* Open Wednesday envelope. (Assume Empty). Update scores.
      *   *Note:* Tension should be rising. 2 days left.
  *   **0:20–0:25: Thursday Night.** **The Critical Moment.**
      *   *Facilitation:* Ask: "If the quiz hasn't happened yet, where must it be?"
      *   *Expected Outcome:* Students realize if it survives Thursday, it *must* be Friday. Therefore, on Friday morning, they will know. Therefore, Friday cannot be a surprise.
      *   *The Move:* They will try to coordinate to vote "QUIZ" on Friday to force a Void and win the +100 LP bonus.
      *   *Action:* On Thursday Night, many will vote "NO QUIZ" (hoping to catch you on Friday).
      *   *Reveal:* Open Thursday envelope. **It is Empty.**
  *   **0:25–0:30: Friday Night.**
      *   *The Trap:* Students now know it *must* be Friday. Rational play dictates voting "QUIZ" to get +50 LP or force the Void for +100 LP.
      *   *The Twist:* You (Instructor) reveal the Friday envelope. **It is Empty.**
      *   *The Annoyance:* Wait. You promised *one* quiz. Where was it?
      *   *Resolution:* You reveal you actually placed the "QUIZ TODAY" card in **Wednesday's** envelope.
      *   *The Conflict:* "But we voted NO QUIZ on Wednesday!"
      *   *The Ruling:* "Yes, but <75% of you voted YES. So it wasn't 'Common Knowledge' enough to void it. It was a surprise to the collective, even if some of you suspected it."
      *   *Score Update:* Apply the -20 LP surprise penalty to everyone for Wednesday (retroactively). Watch them squirm. They reasoned it couldn't be Friday, so it couldn't be Thursday, so it couldn't be Wednesday... yet there it was.

  ### Phase 2: The Private Announcement (20 Minutes)
  *   **0:30–0:35: Setup.** Reset scores to 100 LP. Tell them: "Same rules, but I am whispering the Quiz Day to **one student** (choose a confident one, 'Alex'). Alex cannot speak or signal. The rest of you do not know Alex knows."
  *   **0:35–0:45: Speed Run.** Compress the week into 3 Days (Wed, Thu, Fri) to save time.
      *   Run the rounds quickly.
      *   *Likely Outcome:* The class *cannot* eliminate Friday because they don't know what Alex knows. The backward induction fails for the group.
      *   *The Quiz:* Give the quiz on Friday.
      *   *Result:* For the class, it is a surprise (they didn't eliminate Friday). For Alex, it is *not* a surprise (Alex knew).
  *   **0:45–0:50: Alex's Debrief.** Ask Alex: "Did you try to signal?" "Did you know the quiz was impossible?" (Alex might say "I knew it was Friday, so I knew the rule said it couldn't be, but I couldn't tell them.").

  ### Phase 3: The Formal Debrief (30 Minutes)
  *   **0:50–1:10: Mapping the Game to the Argument.**
      *   Draw the Backward Induction on the board *now*.
      *   **Base Case:** Friday. (Game moment: Friday Night in Phase 1). Why did they think they knew? Because Mon-Thu were empty.
      *   **Induction Step:** If Friday is impossible, Thursday becomes the new Friday. (Game moment: Thursday Night).
      *   **The "Surprise" Condition:** Discuss the 75% rule. This operationalized "Common Knowledge."
          *   *Point:* For the elimination to work, everyone must know that everyone knows... that the quiz can't be Friday.
          *   *Phase 1:* The announcement was public. Common Knowledge existed. Elimination worked (in their heads).
          *   *Phase 2:* The announcement was private to Alex. The class lacked Common Knowledge. Elimination failed.
      *   **The Resolution:** Why did the Wednesday Quiz work in Phase 1?
          *   Because their reasoning proved the quiz *couldn't happen anywhere*. By giving it on Wednesday, you proved the premise ("It will be a surprise") and the conclusion ("It will happen") are in tension. The logic eliminates the possibility of the quiz, but reality demands one exists.
  *   **1:10–1:20: Q&A and Wrap.**
      *   Ask: "Who feels cheated?" (Validate this feeling. That is the paradox).
      *   Assign reading: Kripke or Quine on the Surprise Exam.

  ---

  ## 4. Payoff Scheme Summary (For your reference)

  | Scenario | Student Vote | Outcome | Point Change | Rationale |
  | :--- | :--- | :--- | :--- | :--- |
  | **Quiz Day** | **NO QUIZ** | Quiz Happens | **-20 LP** | **The Surprise.** You were caught out. |
  | **Quiz Day** | **QUIZ** | Quiz Happens | **+50 LP** | **The Prediction.** You beat the teacher. |
  | **Quiz Day** | **QUIZ** | **>75% Vote QUIZ** | **+100 LP (All)** | **The Void.** You made it impossible to surprise. Teacher loses. |
  | **No Quiz** | **QUIZ** | No Quiz | **-10 LP** | **False Alarm.** Cried wolf. |
  | **No Quiz** | **NO QUIZ** | No Quiz | **+5 LP** | **Safety.** Survived another night. |

  ---

  ## 5. Troubleshooting: What Will Go Wrong

  **1. "Someone guessed Wednesday by dumb luck in Phase 1."**
  *   **Risk:** If 3 students guess Wednesday correctly, the "Annoyance" is diluted. They feel smart, not paradoxical.
  *   **Fix:** Emphasize the **Collective** rule. Even if *some* guessed it, if <75% guessed it, the class *as a whole* was surprised. The paradox is about what the *group* can know, not individuals. Remind them: "The announcement was to the class, not to Dave."

  **2. "Students refuse to coordinate on Friday to force the Void."**
  *   **Risk:** They are too competitive. They want the +50 for themselves and fear others won't vote QUIZ, leaving them with a -20 surprise penalty. This is a Prisoner's Dilemma layer.
  *   **Fix:** Allow 30 seconds of "Open Debate" on Friday Night. Let them try to coordinate. When they agree "We all vote QUIZ," and then *someone defects* (votes NO to try to get the surprise penalty avoided while others void it? No, if it voids, everyone wins).
  *   *Actually:* If they coordinate to Void, everyone gets +100. If they don't, and it happens, most get -20. They should coordinate. If they fail to coordinate, it highlights the difficulty of establishing Common Knowledge in practice. **Use this failure as a teaching point.** "You couldn't even trust each other to vote QUIZ. How can you trust the logical premise?"

  **3. "Phase 2 (Private) confuses everyone."**
  *   **Risk:** Students think Alex cheating or the rules changed.
  *   **Fix:** Be very clear: "The rules of the *game* are the same. The *information state* is different." If it gets messy, cut Phase 2 short and turn it into a thought experiment. "Imagine Alex knew. Would *you* have eliminated Friday?"

  **4. "They realize I (Instructor) can just lie about the envelope."**
  *   **Risk:** They accuse you of moving the quiz card.
  *   **Fix:** **Seal the envelopes in front of them at the start.** Do not touch the sealed envelopes until the reveal. This integrity is crucial for the "Promise" to hold weight.

  ---

  ## 6. Limitations: What the Game Cannot Do
  Be honest with yourself (and them) about where the simulation falls short.

  1.  **Knowledge vs. Belief:** In the game, "Surprise" is defined by a vote threshold (75%). In the paradox, "Surprise" is about *deducibility*. The game gamifies epistemology, which can mislead students into thinking logic is a majority vote.
      *   *Debrief Fix:* Explicitly state: "The 75% rule was a proxy for 'Common Knowledge.' In the real argument, it's not about voting; it's about what a perfectly rational agent *must* conclude."
  2.  **The "Liar" Aspect:** In the game, you (Instructor) are an adversary trying to maximize their surprise. In the paradox, the Teacher is a premise-giver. The game makes it feel like a trick; the paradox is a logical contradiction.
      *   *Debrief Fix:* "You felt annoyed because I tricked you. The Paradox is annoying because *Logic* tricked you. I didn't break the rules; your reasoning did."
  3.  **Time Compression:** 80 minutes forces the "Week" to feel rushed. The emotional weight of waiting days is lost.
      *   *Debrief Fix:* Acknowledge this. "You felt a flicker of anxiety on Thursday. Imagine that over a real weekend."

  ## 7. Instructor Script for the "Annoyance" Moment
  *When you reveal the Wednesday card after they eliminated Friday:*

  > "Look at your scores. You lost points on Wednesday. Why? Because you voted 'No Quiz.' Why did you vote 'No Quiz'? Because you were sure it couldn't be Friday. And if not Friday, not Thursday. And if not Thursday, not Wednesday.
  >
  > You used my promise to prove the quiz couldn't happen. I used your proof to surprise you.
  >
  > Who here feels like I broke the rules? (Wait for hands).
  > Who here feels like *you* broke the rules? (Wait for hands).
  >
  > That feeling? That is the paradox. We are going to spend the next 30 minutes figuring out which one of us is actually wrong."
