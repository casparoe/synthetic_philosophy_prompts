answer: |-
  This is an excellent set of intuitions. You have effectively reconstructed the debate between **Entity Realism** (we believe in the things), **Structural Realism** (we believe in the math/relations), and **Instrumentalism** (we believe in the predictions) without the jargon.

  Your engineering analogy is the key to unlocking this. You are treating scientific theories like legacy codebases. You want to know: *When we refactor this system, which modules are stable APIs, and which are implementation details that will be rewritten?*

  Here is the analysis of your seven verdicts, the principle that unifies them, the cost of maintaining that principle, and the application to modern physics.

  ### 1. The Search for a Single Principle

  You suspected no clean principle works. You are half-right. A *simple* principle (like "math survives" or "entities survive") fails. But a **composite principle** derived from software architecture handles all seven cases consistently.

  **The Principle: "Preservation of the Causal-Structural Role."**

  A theory is "on to something" if the *functional role* assigned to its central posit is preserved in the successor theory, even if the *nature* of the posit changes. We must distinguish between **Kinematics** (describing *how* things move/change) and **Dynamics** (explaining *why* they move/change via causal mechanisms).

  *   **Kinematic survival** (curve fitting) $\rightarrow$ Not "on to something" (Ptolemy).
  *   **Dynamic/Structural survival** (mechanism/relation) $\rightarrow$ "On to something" (Fresnel, Darwin, etc.).

  Here is how this principle maps to your seven verdicts:

  | Case | Your Verdict | Principle Application | Why it fits |
  | :--- | :--- | :--- | :--- |
  | **1. Fresnel** | On to something | **Structural.** The wave equation (the relation) survived; the medium (the entity) did not. | The *dynamics* of propagation were correct, even if the substrate was wrong. |
  | **2. Caloric** | On to something | **Structural.** The heat flow equation (the relation) survived; the fluid (the entity) did not. | Same as Fresnel. The API (Fourier's Law) remained stable; the backend (Caloric fluid) was refactored. |
  | **3. Ptolemy** | **NOT** on to something | **Kinematic Only.** Epicycles describe *paths* (kinematics), not *forces* (dynamics). | The math was a coordinate transformation, not a causal mechanism. It was a UI skin, not business logic. |
  | **4. Phlogiston** | On to something | **Functional.** The *transaction* (mass exchange in combustion) survived, even if the direction was reversed. | It identified a conserved quantity exchange. The "ledger" was right, even if the "currency" was named wrong. |
  | **5. Bohr** | Useful ladder (Not Truth) | **Mixed.** Quantization (Dynamic principle) survived; Orbits (Kinematic model) died. | You correctly sense it's "on to something" structurally (energy levels) but false ontologically (orbits). |
  | **6. Mendel** | On to something (Strong) | **Entity + Structural.** The discrete unit (entity) and inheritance logic (structure) both survived. | The "class definition" for `Gene` was correct, even if the memory allocation (DNA) was unknown. |
  | **7. Darwin** | On to something (True) | **Mechanism.** Natural Selection (the algorithm) survived; Heredity (the data structure) was fixed. | The core logic loop was correct. The dependency (blending inheritance) was swapped for a better library (genetics). |

  ### 2. Which Verdict Must Go?

  If we insist on a **simpler** principle, you must sacrifice one of your intuitions.

  **Option A: Strict Structural Realism (Math is King)**
  *   **Principle:** Only theories where the *equations* survive are "on to something."
  *   **Verdict to Drop:** **Phlogiston (Case 4).** Phlogiston had no rigorous mathematics. It was a qualitative chemical story. Under strict structural realism, Phlogiston is just a metaphor, like Ptolemy.
  *   **Consequence:** You lose the ability to say qualitative conceptual shifts (like "conservation of mass") count as progress.

  **Option B: Strict Entity Realism (Things are King)**
  *   **Principle:** Only theories where the *objects* survive are "on to something."
  *   **Verdict to Drop:** **Fresnel & Caloric (Cases 1 & 2).** The ether and caloric fluid do not exist.
  *   **Consequence:** You become a pessimist about current theories. Since particles might not be "things" but field excitations or strings, you'd have to say the Standard Model isn't "on to something."

  **Option C: Strict Predictive Realism (Output is King)**
  *   **Principle:** If it predicts well, it's on to something.
  *   **Verdict to Drop:** **Ptolemy (Case 3).** You would have to admit Ptolemy was "on to something" because it predicted eclipses for 1,000 years.
  *   **Consequence:** You lose the distinction between a working hack and a correct design.

  **My Recommendation:**
  Keep your current set, but tighten the definition of **Case 5 (Bohr)**.
  You called Bohr "not on to something in the truth sense." Under the **Causal-Structural** principle, Bohr *was* on to something in the truth sense regarding **quantization**, just not regarding **trajectories**.
  *   *Repair:* Admit Bohr was "on to something" structurally (discrete energy states are real), even if the visual model (orbits) was a lie. This aligns it with Fresnel (math real, entity fake).

  ### 3. The Ptolemy Constraint: Why isn't it just prejudice?

  You asked for a principled distinction between Ptolemy's "prediction machine" and Fresnel's "structure-getting," without relying on "geocentrism is silly."

  Here is the engineering distinction: **Coordinate Dependence vs. Physical Law.**

  *   **Ptolemy (Kinematics):** Epicycles are essentially a Fourier series expansion. You can describe *any* periodic motion with enough epicycles. The math describes the *shape of the path* relative to the Earth. If you change the reference frame (move to the Sun), the epicycles vanish. They are **artifacts of the coordinate system**, not features of the system.
      *   *Code Analogy:* Hardcoding pixel positions for a UI element. It works on your screen resolution, but breaks if the window resizes. It's not responsive design.
  *   **Fresnel/Caloric (Dynamics):** The wave equation or heat equation describes how a disturbance *propagates* regardless of where you stand. The math describes a **physical constraint** on the system, not just a path.
      *   *Code Analogy:* Defining the physics engine's gravity constant. It works regardless of where the camera is looking.

  **Can Phlogiston be saved by this move?**
  Yes. Phlogiston wasn't just curve-fitting observations; it posited a **mechanism** (transfer of substance) to explain mass change. It failed the mechanism (direction of transfer), but it succeeded in identifying that combustion is a **transactional process** involving mass conservation.
  *   *Ptolemy:* "Here is where the planet will be." (Description)
  *   *Phlogiston:* "Here is why the metal gets lighter." (Explanation)
  *   Even though the explanation was wrong, the *category of explanation* (chemical transaction) was the correct architectural choice.

  ### 4. Application to Modern Physics

  Now, let's run your **Causal-Structural Principle** on the two cases you provided.

  #### Case A: The Standard Model of Particle Physics
  *   **Scenario:** It gets superseded (e.g., by String Theory or Quantum Gravity).
  *   **Verdict:** **On to something.**
  *   **Reasoning:** The Standard Model is built on **Gauge Symmetries** (mathematical structures describing how fields interact). Even if "particles" turn out to be vibrations of strings or informational bits, the **symmetry groups** (SU(3)×SU(2)×U(1)) are likely to survive as low-energy approximations of the deeper theory.
  *   **Engineering Analogy:** The API endpoints and data protocols are robust. The underlying database implementation might change from SQL to NoSQL, but the contract remains valid. The *structure* of the interactions is the invariant core.

  #### Case B: Dark Matter
  *   **Scenario:** 80 years of gravitational anomaly fitting. Entity unidentified.
  *   **Verdict:** **Currently "On to something" Structurally, Agnostic Ontologically.**
  *   **Reasoning:** This is the critical test.
      *   **If Dark Matter is a particle:** It is like **Neptune**. (Entity Realism vindicated).
      *   **If Dark Matter is Modified Gravity (MOND):** It is like **Phlogiston**.
          *   *Why Phlogiston and not Ptolemy?* Because Dark Matter posits a **causal source** for the gravity (missing mass), whereas Ptolemy just described the path. If it turns out to be Modified Gravity, the "missing mass" was a bookkeeping error, but the **anomaly** (the rotation curves) was a real structural feature of the universe that demanded a new dynamic law.
  *   **The Principle's Prediction:**
      *   The **Gravitational Anomaly** (the data/structure) is real. We are "on to something" there.
      *   The **Dark Matter Particle** (the entity) is a "working posit." It is doing the causal work in the current theory.
      *   **If the particle is never found:** We do not say "Dark Matter theory was useless." We say "The *structural relation* (gravity behaves differently at low acceleration) was the truth; the *entity* (WIMP) was the legacy code we refactored out."
      *   **Bearing on PMI:** This shows that the Pessimistic Meta-Induction is too blunt. It assumes that if the *entity* is replaced, the *theory* was false. But if the *structural role* (accounting for the gravity) is preserved, the theory was "on to something" even if the ontology changes.

  ### Summary for the Engineer

  You are practicing **Structural Realism with a Functionalist twist.**

  1.  **Don't trust the "Things" (Entities):** They are like specific class implementations. They get refactored (Ether $\rightarrow$ Field, Caloric $\rightarrow$ Kinetic Energy).
  2.  **Don't trust the "UI" (Kinematics):** It's just curve fitting. It gets responsive-designed away (Epicycles $\rightarrow$ Ellipses).
  3.  **Trust the "Business Logic" (Dynamics/Structure):** If the theory captures the *relations*, *symmetries*, or *causal transactions*, it is "on to something," even if the variable names change.

