  **The Scenario**

  In 1995, the historic sloop *Aurora* was purchased by a maritime museum, fully disassembled, and cataloged into crates stored in a climate-controlled warehouse for twenty years. In 2015, museum technicians reassembled the vessel using sixty percent of the original timber; the remaining planks were too rotted to save and were burned, while the original keel was repurposed into a garden bench so no rival ship could be built. The reassembled *Aurora* was never intended to sail; it was bolted to a concrete floor as a static exhibit, maintained by different people than the original crew, serving a purely educational purpose rather than its original function as a working vessel.

  **The Walkthrough**

  Here is where the theories diverge. The **Spatiotemporal Continuity** theorist says this is a *different* boat. For them, identity requires an unbroken path through space and time. That twenty-year gap in the warehouse, where the boat existed only as scattered crates, severs the continuous history. There is no moment-to-moment connection between the 1995 sloop and the 2015 exhibit. The **Four-Dimensionalist**, however, says it is the *same* boat. They view objects as spacetime worms composed of temporal parts. As long as there is a causal connection linking the earlier temporal parts (the 1995 hull) to the later ones (the 2015 exhibit) via plans, intent, and preserved matter, the worm can be "gappy." The object survives the hiatus because the causal history bridges the gap. The **Hobbesian Matter** theorist also says it is the *same* boat, but for a different reason: identity tracks the stuff. Since sixty percent of the original matter was recycled into the exhibit, the majority of the physical substance persists, securing identity regardless of the gap or the change in function.

  **The Engine of the Case**

  The single feature doing the work here is **the gap**. In the classic Ship of Theseus, replacement is gradual, so continuity is maintained, and both Continuity and Four-Dimensionalists agree the ship survives. By inserting a twenty-year hiatus where the object ceases to function or exist as a unified whole, we break the Spatiotemporal Continuity view while leaving the Four-Dimensionalist room to appeal to causal connections across time. If you remove the gap—if the *Aurora* is refitted continuously in drydock over six months—the Continuity theorist must concede it is the same boat, and all three theories converge on "Same."

  **The Defender's Move**

  How does the Continuity theorist bite this bullet? They must argue that our intuition that it is the "same boat" is merely psychological, not metaphysical. They will say: "You feel it's the *Aurora* because of the causal story, but metaphysically, that object ceased to exist in 1995 and a new one began in 2015. Continuity is the only non-arbitrary criterion for identity." Is this tolerable? For a strict metaphysician, yes; for anyone trying to explain why museums display historical artifacts as "the real thing," it is fatal. It implies the museum is lying to the public.

  **Taking a Side**

  I am telling you it **is the same boat**, and the Four-Dimensionalist view is the superior account. Here is why: The Continuity view is too fragile; it makes existence depend on arbitrary thresholds of interruption (is a 20-year gap fatal? What about 19 years?). The Matter view is too coarse; if we had used 51% of the wood to build a house and 49% to build this exhibit, the Matter view would say the house is the boat, which ignores the causal history that makes the exhibit significant. The Four-Dimensionalist captures what we actually care about: causal history and functional continuity across time. It allows for "gappy existence" in a way that matches how we treat heirlooms, institutions, and people (think coma patients). It respects the history without being held hostage by the strictures of continuous contact.

  **A Note on the Spec Sheet**

  You asked to separate *three* theories, but with the constraint "uses most... of the original matter," the Hobbesian and Four-Dimensionalist views naturally converge on "Same." To get a true three-way split (Yes/No/Maybe), you would need to relax the "most matter" requirement. If you stipulate that the *critical* matter (the keel) was lost to the garden bench, the Hobbesian might say "Different" (the matter is gone), while the Four-Dimensionalist still says "Same" (causal history remains), and the Continuity theorist says "Different" (the gap remains). Finally, watch out for the "museum exhibit" stipulation. By changing the function from sailing to static display, you risk stacking the deck against the Matter view if your students think matter implies function. Ensure they understand the Hobbesian cares only about the wood, not the sailing.
