answer: |-
  # Lesson Plan: The Value of Information Game
  **Course:** Upper-Level Seminar in Decision Theory  
  **Time:** 90 Minutes  
  **Students:** 14 (7 Pairs)  
  **Goal:** Experiential demonstration of Good's Theorem and its boundary conditions.

  ## I. Setup & Materials (Pre-Class)
  *   **Groups:** 7 Pairs (Decision Units or "DUs"). Arrange tables so pairs can work privately.
  *   **Currency:** "Decision Points" (DP). Start each DU with 100 DP. Final leaderboard determines a small prize (e.g., choosing the next reading, extra credit, or candy).
  *   **Materials:** 
      *   7 "State Envelopes" (containing the true state for the round).
      *   7 "Signal Cards" decks (shuffled).
      *   Decision sheets for each round.
  *   **The Core Mechanic:** 
      *   **States:** $S_{Red}$ or $S_{Blue}$ (50/50 prior).
      *   **Acts:** $Act_{Red}$ or $Act_{Blue}$.
      *   **Payoff:** Match State = +20 DP. Mismatch = 0 DP.
      *   **Signal:** A card drawn from a deck. 
          *   *Standard Signal:* 80% accurate (If $S_{Red}$, 80% chance card says "Red").

  ---

  ## II. The Session Flow

  ### 0. Introduction (10 Minutes)
  *   **Hook:** "Good's Theorem says free information is always good. Today, you will prove it wrong. Or rather, you will find out exactly *when* it stops being true."
  *   **Rules:** Explain the Core Mechanic. Emphasize that DUs maximize expected points. 
  *   **Baseline:** Run a quick practice round (no info) to ensure they understand the payoff matrix.

  ### Phase 1: The Theorem Holds (25 Minutes)
  *Goal: Establish the baseline where VOI $\ge$ 0.*

  **Round 1: Blind Choice (No Signal)**
  *   **Procedure:** Instructor sets the State (flip coin). DUs choose $Act_{Red}$ or $Act_{Blue}$ without info. Reveal State. Pay points.
  *   **Expected Outcome:** ~50% accuracy. Average gain ~10 DP.

  **Round 2: The Free Signal (Good's Theorem)**
  *   **Procedure:** Instructor sets State. DUs are offered a **Free Signal** (80% accurate). 
      *   *Critical Choice:* They can **Accept** (see card, then choose act) or **Decline** (choose act blind).
      *   *Instructor Script:* "You do not have to take the card. If you think it will confuse you, leave it on the table."
  *   **Outcome:** DUs who Accept should update beliefs ($P(S|Signal)$) and match the signal. Accuracy rises to ~80%. 
  *   **Debrief Point:** Any DU that Declined strictly dominated themselves. $EU(Info) > EU(No Info)$.

  **Round 3: Costly Information (VOI Calculation)**
  *   **Procedure:** Same as Round 2, but the Signal costs **5 DP**.
  *   **Math:** 
      *   $EU(No Info) = 10$ DP.
      *   $EU(Info) = (0.8 \times 20) + (0.2 \times 0) - 5 = 11$ DP.
      *   Rational choice: Buy.
  *   **Outcome:** Most buy. Some risk-averse pairs might decline. 
  *   **Debrief Point:** You pay up to the Expected Value of Information (EVI). Here EVI = 6 DP. Price = 5 DP. Buy.

  ---

  ### Phase 2: Violating the Assumptions (40 Minutes)
  *Goal: Break one assumption per round. Keep instructions fast.*

  **Round 4: The Commitment Violation (Act Before Signal)**
  *   **Assumption Violated:** *The decision must be made after receiving the information.*
  *   **Procedure:** DUs must **commit to an Act** first. *Then* they are offered the Free Signal. They cannot change their Act.
  *   **Trap:** The signal is free, but it cannot influence the payoff. It creates "noise" without utility. If there is *any* cognitive cost to reading the card, VOI is negative.
  *   **Outcome:** Students realize the info is useless. Some may feel "regret" seeing they guessed wrong.
  *   **Lesson:** Information has no instrumental value if it cannot change the action.

  **Round 5: The Strategic Violation (The Opponent)**
  *   **Assumption Violated:** *Single Agent / Fixed Payoffs (Game Theory).*
  *   **Procedure:** Pair the 7 DUs into 3 matches (one DU sits out as observer). 
      *   DU1 (You) wants to Match the State. 
      *   DU2 (Opponent) wants to **Block** DU1 (Payoff is zero-sum).
      *   DU2 observes whether DU1 **bought** the signal.
  *   **Trap:** If buying the signal signals "I am trying to optimize," the Opponent can exploit this. (Simplified: If DU1 buys signal, Opponent chooses the Act that defeats DU1's likely choice).
  *   **Outcome:** Buying the signal reveals your strategy. Silence is safer.
  *   **Lesson:** In games, information can be a liability if it reveals your hand to a strategic adversary.

  **Round 6: The Relevance Violation (Counterfactual Regret)**
  *   **Assumption Violated:** *Consequentialism (Utility depends only on the chosen act's outcome).*
  *   **Procedure:** DUs choose an Act. Then, they are given **Free Information about the Act they DID NOT Choose.**
  *   **Trap:** "You chose Red. State was Red. You won 20 DP. By the way, Blue would have paid 100 DP."
  *   **Outcome:** Students report lower satisfaction/utility despite winning points.
  *   **Lesson:** Good's theorem assumes you care about the *outcome*, not the *foregone alternative*. If you experience regret, info has negative psychological utility.

  **Round 7: The Model Violation (State-Dependent Accuracy)**
  *   **Assumption Violated:** *Correct Likelihood Function (Bayesian Rationality).*
  *   **Procedure:** Offer the Free Signal. 
      *   **Hidden Rule:** Signal is 100% accurate in $S_{Red}$, but 50% accurate (random) in $S_{Blue}$.
      *   **Student Belief:** Students assume standard 80/80 symmetry (from Round 2).
  *   **Trap:** If they see "Blue," they update to $P(Blue) \approx 80\%$. In reality, a "Blue" signal is much less reliable than they think. They will over-bet on Blue and lose.
  *   **Outcome:** Accuracy drops below baseline. 
  *   **Lesson:** Information is only valuable if your model of the information structure is correct. Misspecification turns VOI negative.

  ---

  ### III. Debrief & Mapping (15 Minutes)
  *Draw a 2x2 grid on the board: "Assumption" vs. "Round Violated".*

  | Round | Feature | Good's Theorem Assumption Violated | Why VOI < 0 |
  | :--- | :--- | :--- | :--- |
  | **2 & 3** | **Baseline** | **None** | **VOI $\ge$ 0** |
  | **4** | Commit First | **Temporal Order** (Act must follow Signal) | Info cannot alter decision; pure cognitive cost. |
  | **5** | Opponent | **Single Agent** (Payoffs fixed) | Info reveals strategy to adversary (Signaling game). |
  | **6** | Renounced Option | **Consequentialism** (Utility = Outcome) | Info generates regret, lowering ex-post utility. |
  | **7** | Biased Signal | **Correct Model** (Known Likelihoods) | Bayesian updating on wrong priors/likelihoods leads to error. |

  **The "Frank" Limitation (Instructor Script):**
  "Notice what we couldn't reproduce. Good's Theorem assumes **logical omniscience** and **risk neutrality**. 
  1.  **Cognitive Cost:** In Round 4, even if the signal was free, processing it took mental energy. In the real world, 'free' info is never cognitively free.
  2.  **Risk:** Good's Theorem is about *Expected* Utility. If you are risk-averse, a signal that increases variance (even if it raises the mean) might be rejected. 
  3.  **Finite Trials:** In one session, luck dominates. Good's theorem is an expectation over infinite trials. You might lose points taking free info just by bad luck. That doesn't falsify the theorem; it falsifies your sample size."

  ---

  ## IV. Predictable Failure Modes (Instructor Notes)
  *Be prepared for these specific issues during the run:*

  1.  **The "Decline" Glitch (Round 2):** 
      *   *Prediction:* At least one pair will decline the free signal in Round 2, thinking it's a trick.
      *   *Fix:* Do not correct them during the round. Use them as the "control group" in the debrief to show they scored lower.

  2.  **Confusion in Round 7 (Model Violation):**
      *   *Prediction:* Students will argue the signal was "unfair" rather than admitting they updated incorrectly.
      *   *Fix:* Reveal the true likelihood matrix immediately after the round. Show the math: $P(Signal|State) \neq P(State|Signal)$.

  3.  **Time Creep:**
      *   *Prediction:* Phase 1 will take too long as students calculate EU.
      *   *Fix:* Enforce a 2-minute timer per round. Decision theory is often about heuristics under pressure.

  4.  **Risk Aversion Masquerading as Rationality:**
      *   *Prediction:* In Round 3 (Costly Info), students will refuse to pay 5 DP because they fear losing points.
      *   *Fix:* In the debrief, distinguish between *Risk Aversion* (concave utility) and *VOI*. Good's theorem holds for Risk Averse agents too, provided the cost is less than the certainty-equivalent value of the info. If they refused, they likely miscalculated the certainty equivalent.

  5.  **The "Opponent" Collusion:**
      *   *Prediction:* In Round 5, friends might collude to split points rather than block.
      *   *Fix:* Remind them this is a seminar on *rational choice*, not friendship. Assign points individually within the pair if necessary.

  ## V. Handout: Decision Sheet Template
  *(Print 7 copies per round)*

  **Decision Unit #:** ______  
  **Round #:** ______  
  **Starting Points:** ______  

  1.  **Will you purchase the Signal?** [ ] Yes (Cost: __ DP)  [ ] No  
  2.  **If Yes, what did the Signal say?** _______________  
  3.  **Which Act do you choose?** [ ] Red  [ ] Blue  
  4.  **True State (Instructor Fill):** _______________  
  5.  **Payoff:** _______________  

  ---

  ### Instructor's Cheat Sheet: The Math for Round 3
  *   **Prior:** $P(Red) = 0.5$.
  *   **Payoff:** Match = 20, Miss = 0.
  *   **No Info:** $EU = 0.5(20) + 0.5(0) = 10$.
  *   **With Info (80% acc):**
      *   Signal Red (50% chance): $P(Red|SigRed) = 0.8$. Choose Red. $EU = 0.8(20) = 16$.
      *   Signal Blue (50% chance): $P(Blue|SigBlue) = 0.8$. Choose Blue. $EU = 0.8(20) = 16$.
      *   Total $EU(Info) = 16$.
      *   $EVI = 16 - 10 = 6$.
      *   **Price:** 5.
      *   **Net Gain:** 1.
      *   **Verdict:** Buy.
