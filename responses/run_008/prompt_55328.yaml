answer: |-
  This is a fantastic set of intuitions. You have essentially recreated a live debate in contemporary meta-ethics known as **the problem of moral testimony**. Philosophers like Sarah McGrath, Alison Hills, and David Enoch have spent careers arguing over exactly the cases you listed.

  Your intuition that "non-moral testimony" (crime stats) feels different from "moral testimony" (factory farming) is the central puzzle. In standard epistemology, trusting an expert is rational. In ethics, it feels like cheating.

  Here is an attempt to find the thread connecting your verdicts, a principle to organize them, and an answer to your specific questions.

  ### The Principle: The Condition of Non-Alienation

  The thread connecting your "OK" cases and your "OFF" cases isn't about *truth* or *expertise*; it's about **agency and integration**.

  Moral beliefs are not just maps of the world (like crime stats); they are **directives for your will**. To act morally is to act for reasons. If you act on a moral belief without grasping the reason, you are alienated from your own action. You become a vessel for someone else's will rather than an agent exercising your own.

  **The Principle:** *You may defer to moral testimony only when the cost of integrating the reasons yourself is disproportionately high compared to the stakes, or when the relationship implies a shared agency. You may not defer when the belief governs your routine, identity-constituting actions.*

  Let's run your cases through this:

  1.  **Friend on Abortion (OK):** You trust her *reasoning process*, not just her conclusion. Because she is a close friend, her agency is intertwined with yours. You aren't outsourcing your morality; you are participating in a shared moral community. Also, unless you are pregnant or voting tomorrow, this is a "standing belief," not a "routine action."
  2.  **Philosopher on Factory Farming (OFF):** This governs your **routine, identity-constituting actions** (eating, three times a day). To quit meat without understanding *why* is to submit to a rule you don't own. Every meal becomes a reminder that you are following orders, not acting on conviction. This creates *alienation*.
  3.  **Panic/Surgery (OK):** **Cost of integration is disproportionately high.** You literally do not have the time or cognitive capacity to integrate the reasons. The emergency suspends the requirement for ownership.
  4.  **Uncle/Church (BAD):** This is **permanent abdication**. He has made a policy of never integrating reasons. He has surrendered his agency entirely. This violates the duty to be a moral agent.
  5.  **Testimony as Pointer (OK):** This is the ideal. The testimony sparked your own agency. You integrated the reasons.
  6.  **Doctor vs. Ethics Consultant (OFF on Consultant):** Facts describe the world (Doctor); Values prescribe action (Consultant). You can outsource the map, but you cannot outsource the destination. The stakes involve *your* body and *your* conscience. The cost of integration is high, but the stakes (your moral life) are higher.
  7.  **Non-Moral/Crime Stats (OK):** These are descriptive. Believing a neighborhood is safe doesn't require you to *will* anything. No alienation possible.

  ### 1. Is there one principle?
  Yes, the **Condition of Non-Alienation** (or **Moral Ownership**).
  Moral knowledge requires *understanding*, not just *true belief*. You can borrow true belief in emergencies or low-stakes standing views, but you cannot borrow the *understanding* required to own your routine actions without losing a piece of your moral self-respect.

  ### 2. Does the squeamishness track something real?
  **Yes.** It tracks **moral fragility** and **alienation**.

  If you quit meat because of a philosopher you can't quote, what happens when you're at a BBQ and a friend challenges you? If you can't reconstruct the reason, you either cave (showing your belief was shallow) or you dogmatically assert authority (showing you are closed off).
  *   **The Squeamishness:** It is the feeling of your agency slipping. It is the recognition that you are acting on a script you haven't read.
  *   **The Uncle Case:** It bugs you more than the Philosopher case because the Uncle has made a *virtue* of his passivity. The Philosopher case is laziness; the Uncle case is a renunciation of the responsibility of adulthood.

  ### 3. Which verdict would I overturn for a cleaner principle?
  I would nudge your verdict on **Case 1 (Friend on Abortion)**.

  You said it feels "fine, even smart" to adopt her view because you trust her, admitting you were "lazy."
  *   **The Correction:** If you truly understand *none* of the reasons, this is actually **problematic**, just less so than the Philosopher case. It is only "fine" because you implicitly trust that if you *asked*, she could explain it in a way you'd grasp.
  *   **Why overturn?** If you treat your friend's view as a black box (just like the philosopher's), you are vulnerable. If she changes her mind, do you? If you meet someone who disagrees, can you engage?
  *   **Refinement:** The Friend case is only "OK" if it is treated as **provisional**. It is a placeholder until you have the time to think. If you treat it as a final, unexamined dogma, it slides toward the Uncle case. The "laziness" is permissible only because the *relationship* keeps the door open for future reasoning.

  ### 4. The Inherited Moral Outlook Case
  *Suppose your whole moral outlook was inherited from your parents and never once examined by you, and it happens to be a good one.*

  **Verdict:** You have done nothing **wrong**, but you possess no **moral virtue**.

  *   **Why not wrong?** You haven't violated a duty if you never encountered a reason to doubt. If the world never challenged your inherited views, you weren't required to stress-test them. You are morally lucky.
  *   **The Catch:** You are **morally fragile**.
      *   A moral outlook is a tool for navigating novel situations. Inherited, unexamined morals work like a script. As long as life follows the script, you're fine.
      *   The moment you face a dilemma your parents didn't anticipate (e.g., a new technology, a complex social situation), your unexamined outlook will crash. You won't know how to derive an answer because you never learned the *method*, only the *conclusions*.
  *   **The Duty:** The duty isn't to *examine everything* (impossible); it's to examine *when friction occurs*. If your inherited view causes conflict or confusion, *then* the duty to integrate/own the reason kicks in. If you ignore that friction and cling to the inherited script, you slide into the "Uncle" category.

  ### Summary
  Your gut is tracking a distinction between **believing true things** and **being a moral agent**.
  *   **Non-moral:** Just believe true things.
  *   **Moral:** You must own the reasons for your actions.
  *   **Exceptions:** Emergencies (no time), Intimacy (shared agency), or Low-Stakes/Non-Routine (standing beliefs).
  *   **Forbidden:** Routine, identity-constituting actions based on authority you cannot explain.

  The squeamishness is real. It's the feeling of driving a car while looking at the passenger instead of the road. Even if the passenger is a better driver, it's not *your* car.
