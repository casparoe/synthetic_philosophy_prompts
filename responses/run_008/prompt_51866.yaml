  This is a classic instantiation of the debate between Eliminative Materialism (Churchland, Churchland) and Non-Reductive Physicalism or Interpretivism (Fodor, Dennett). To adjudicate this numerically, we must distinguish between the empirical trajectory of cognitive science and the philosophical criteria for ontological commitment.

  Regarding **p1 (Neurocomputational Foundation)**: The trend in cognitive science is increasingly integrative. While Marr's computational level remains useful, explanatory depth increasingly demands mechanistic realization. By 2100, it is highly probable that cognitive explanations will be grounded in neurocomputational mechanisms, even if higher-level abstractions remain heuristic. I assign this a high probability, as "implementation-agnostic" functionalism often stalls when faced with biological constraints.

  Regarding **p2 (Mapping Failure)**: This is where the LLM analogy is potent. Interpretability research reveals that internal states in intelligent systems are often high-dimensional, distributed vectors rather than discrete symbols. These states are causal and robust but do not isomorphically map to natural language predicates like "believes that p." If human cognition shares this distributed architecture—as connectionism and neuroscience suggest—the classical "sentence-like" individuation of propositional attitudes will fail to find a principled neural counterpart. I assign this a moderate-high probability.

  Regarding **p3 (Elimination Criterion)**: This is the philosophical hinge. If p1 and p2 are true, are propositional attitudes like "temperature" (reduced successfully) or "phlogiston" (eliminated)? The distinction lies in whether preserving the *functional role* is sufficient for ontological survival, or whether preserving the *structural individuation* is required. Given the shift from discrete to distributed, the structural mismatch is significant. However, scientific practice often retains terms via revision (e.g., "gene"). I assign this a probability reflecting the uncertainty of future philosophical consensus.

  The LLM analogy supports **p2**. It demonstrates that robust, causal cognitive features can exist without aligning cleanly with folk-psychological vocabulary, suggesting that the failure to map is a feature of intelligence, not a bug of current models.

  Your disagreement with your advisor likely hinges on **p3**. You (0.15) likely view any functional preservation as survival (revision), while your advisor (0.6) views structural mismatch as elimination (phlogiston). My credence lands between these, leaning toward survival via revision, but acknowledging the risk of elimination if the structural divergence is too great.

