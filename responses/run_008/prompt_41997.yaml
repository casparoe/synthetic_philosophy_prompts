  # Joint Statement on the Limits of Causal Inference in the Economics of Long-Run Development

  **Authors:** [User Name] (Institutionalist) and [Colleague Name] (Deep-Structuralist)
  **For:** *Edited Volume on the Limits of Causal Inference from History*

  ## 1. Agreed Claims
  We, the undersigned, agree on the following propositions regarding economic history, econometric strategy, and the interpretation of historical data:

  1.  **Observational Nature of History:** Historical data on national development is fundamentally observational. We lack the ability to run controlled experiments on sovereign states, meaning all causal claims rest on assumptions about counterfactuals that cannot be directly verified.
  2.  **Endogeneity and Reverse Causality:** We agree that prosperity affects institutions, culture, and even demographic geography (e.g., via migration). Simple regressions of income on institutions or geography suffer from severe simultaneity bias.
  3.  **Value and Limits of Natural Experiments:** Quasi-experimental strategies (e.g., colonial settler mortality, arbitrary border partitions, division of nations) provide crucial leverage but are not definitive. They often rely on exclusion restrictions that are plausible but unprovable.
  4.  **High Collinearity:** Geographic factors, cultural traits, and institutional quality are historically co-evolved and highly correlated. Statistically disentangling their independent effects is prone to multicollinearity and model dependence.
  5.  **Persistence:** Historical trajectories exhibit strong path dependence. Whether driven by institutional stickiness or cultural transmission, past conditions strongly predict present outcomes.
  6.  **No Monocausality:** Neither side claims a single variable explains 100% of the variance in development. We dispute the *primary* channel of causation, not the existence of multiple contributing factors.

  ## 2. Residual Disagreements
  While we agree on the methodological challenges, we disagree on the structural interpretation of the data. We have identified one substantive disagreement and one verbal/conceptual disagreement.

  ### A. Substantive Disagreement: The Locus of Policy Leverage
  *   **Institutionalist Wording:** Inclusive political and economic institutions (property rights, rule of law, checks on power) are the *fundamental* cause of growth. While geography and culture influenced the *historical emergence* of these institutions, institutions can be reformed independently of their deep origins. Therefore, policy interventions targeting institutional design can succeed even in unfavorable geographic or cultural contexts.
  *   **Deep-Structuralist Wording:** Geographic constraints (disease, trade access) and culturally transmitted traits (trust, kinship structures) are the *fundamental* causes of growth. Institutions are largely endogenous outcomes of these deep factors. Therefore, policy interventions targeting formal institutional rules will fail or revert to equilibrium unless the underlying geographic or cultural constraints are also addressed, which is often beyond policy reach.

  ### B. Verbal/Conceptual Disagreement: The Definition of "Institutions"
  *   **Nature of Dispute:** Partly Verbal.
  *   **Institutionalist Wording:** We define institutions primarily as *formal* rules, laws, and organizational structures (e.g., constitutions, courts, central banks). These are distinct from culture and can be changed by legislative or political action within a generation.
  *   **Deep-Structuralist Wording:** We define institutions to include *informal* constraints, norms, and enforcement mechanisms (e.g., trust networks, kinship obligations). Under this definition, "institutions" are slow-moving and indistinguishable from "culture." If the Institutionalists mean only formal rules, their claim that "institutions cause growth" is incomplete because formal rules without informal enforcement are ineffective.

  ## 3. Cruxes and Evidence
  We identify three specific questions (cruxes) that, if settled empirically, would significantly alter our respective confidence levels. For each, we specify the evidence we both accept as relevant and our divergent predictions.

  ### Crux 1: The Exogenous Institutional Shock
  *   **Question:** Can formal institutional changes, imposed exogenously without underlying shifts in geography or culture, generate sustained economic convergence?
  *   **Evidence Both Accept:** The divergence and subsequent convergence of **East and West Germany (1949–1990)** and **North and South Korea (1953–Present)**. These cases hold geography and pre-split culture constant while varying institutions radically.
  *   **Institutionalist Prediction:** The rapid growth of West Germany and South Korea relative to their counterparts demonstrates that institutional quality alone is sufficient to override cultural or geographic baselines. Convergence should continue post-reunification (Germany) or upon institutional reform (Korea).
  *   **Deep-Structuralist Prediction:** The divergence was enabled by pre-existing cultural/industrial differences (e.g., Protestant work ethic, industrial base) or external geopolitical subsidies (US aid) which acted as geographic/structural inputs. Post-reunification convergence in Germany has been slower than predicted by institutional theory alone, suggesting deep structural frictions (culture/capital stock) persist despite institutional unification.

  ### Crux 2: The Validity of the "Settler Mortality" Instrument
  *   **Question:** Does the instrument used in *Acemoglu, Johnson, & Robinson (2001)* (colonial settler mortality) affect current income *only* through institutions, or does it correlate with deep cultural/biological traits?
  *   **Evidence Both Accept:** The **Colonial Origins of Comparative Development dataset**, specifically the correlation between settler mortality, early European settlement density, and current property rights protection.
  *   **Institutionalist Prediction:** Settler mortality is a valid instrument because it determined whether Europeans built extractive or inclusive *institutions*. Once institutions are controlled for, mortality has no direct effect on income.
  *   **Deep-Structuralist Prediction:** Settler mortality is an invalid instrument because it correlates with deep demographic and cultural shifts (e.g., proportion of European descent, introduction of specific religious norms) that affect growth directly, not just through formal institutional channels. Controlling for culture/ethnicity will diminish the institutional coefficient.

  ### Crux 3: Methodological Identifiability
  *   **Question:** Is there, in principle, a historical quasi-experiment that can orthogonalize institutions from deep structural factors?
  *   **Evidence Both Accept:** **Arbitrary Colonial Border Partitions in Africa** (e.g., the split of the Maasai or Ewe peoples between different colonial powers with different legal traditions).
  *   **Institutionalist Prediction:** Groups on the side of the border with better post-colonial institutions (e.g., British indirect rule vs. French direct rule) will show significantly higher development outcomes, controlling for ethnic fixed effects. This proves institutions can be varied independently of culture/geo.
  *   **Deep-Structuralist Prediction:** The variation in outcomes across these borders will be statistically insignificant or small compared to the variance explained by ethnic/kinship fixed effects. The "institutional" difference imposed by colonizers was superficial compared to the persistent influence of pre-colonial kinship tightness and disease environment.

  ## 4. Limits of Inference
  We jointly concede that historical data alone cannot settle this debate definitively. Specifically:
  1.  **Unobservable Counterfactuals:** We cannot observe the counterfactual world where South Korea adopted North Korea's institutions in 1950, or where settler mortality was low in the tropics without cultural transmission.
  2.  **Equifinality:** Different combinations of institutions, culture, and geography may lead to the same outcome (prosperity), making it impossible to identify a single necessary cause from observational data.
  3.  **Time Horizons:** Historical data covers centuries, but policy operates on decades. Even if deep factors determine outcomes over 500 years, institutional reform might still be the only viable lever available to policymakers over 50 years. We cannot infer policy feasibility from historical determinism.

