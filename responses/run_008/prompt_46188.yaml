answer: |-
  You have asked for a specification, not a survey. You want the adequacy conditions for a theory of disease, weighted against the hard realities of clinical practice, with a commitment to which conditions are genuine and which are category errors. You also want to know if your suspicion regarding value-neutrality is correct.

  Here is the specification.

  ### Part I: The Desiderata (The Requirements List)

  An adequate account of health and disease must satisfy the following five conditions. Failure to meet any one of these renders a theory philosophically coherent but clinically or socially useless.

  **1. The Non-Arbitrary Reference Class Condition**
  *   **Requirement:** The theory must specify the biological parameters that fix the reference class (age, sex, etc.) without appealing to statistical frequency alone.
  *   **Case:** The tallest villager.
  *   **Rationale:** Statistical deviation is necessary but not sufficient. A theory must distinguish between *variation* (tallness) and *failure* (gigantism due to pituitary adenoma). The reference class must be fixed by shared physiological architecture, not by the demographic available in the clinic. If the theory cannot explain why we do not pathologize the tails of a normal distribution (e.g., high IQ, exceptional height) without ad hoc adjustments, it fails.

  **2. The Harmful Dysfunction Condition**
  *   **Requirement:** The theory must posit two distinct components: a *factual* component (mechanism failure) and a *evaluative* component (harm/badness). Both are necessary.
  *   **Case:** Asymptomatic bacteriuria in the elderly vs. Pyelonephritis.
  *   **Rationale:** This addresses your "pre-disease" and "risk" concern. A mechanism failure without harm (asymptomatic bacteriuria) is a biological anomaly, but calling it "disease" invites over-treatment. A harm without mechanism failure (social deviance) is not a disease. An adequate theory must explain why we treat one and not the other, and why "pre-hypertension" sits in the uncanny valley where the mechanism is present but the harm is probabilistic. The theory must define the threshold where risk becomes pathology.

  **3. The Evolutionary Consistency Condition**
  *   **Requirement:** The theory must distinguish between *species-typical design flaws* and *individual functional failures*.
  *   **Case:** The vertebrate blind spot vs. Retinal detachment.
  *   **Rationale:** As you noted, selection produces trade-offs, not optima. Senescence, the recurrent laryngeal nerve, and the blind spot are universal to the species design. If "function" is defined strictly by selection, the healthy human is a collection of diseases. An adequate account must define disease as a deviation from the *species-typical functional design*, even if that design is suboptimal. Universal traits are not diseases, even if they are limitations.

  **4. The Contestation Explanation Condition**
  *   **Requirement:** The theory must explain *why* certain boundaries are contested, not merely rule on them. It must account for the rationality of the dissent.
  *   **Case:** Homosexuality (DSM removal), Deafness (Culture vs. Pathology).
  *   **Rationale:** If disease were a purely biological fact like tuberculosis, the removal of homosexuality from the DSM would have been a scientific correction akin to correcting a lab error. It was not; it was a moral and political shift. An adequate theory must acknowledge that the "Harm" condition is value-laden. If the theory cannot explain why the Deaf community's rejection of "pathology" is a coherent philosophical stance (rather than denial of reality), it is descriptively inadequate.

  **5. The Clinical Actionability Condition (Not Insurance)**
  *   **Requirement:** The concept of disease must map to a locus of clinical intervention, but it must not be *defined* by reimbursement structures.
  *   **Case:** Insurance denial for "experimental" treatments vs. standard of care.
  *   **Rationale:** This corrects your fifth point (see Part II). A disease is a state that warrants medical attention. Insurance is a financing mechanism. While the concept of disease *gates* insurance, making insurance the *criterion* for disease turns ontology into economics. An adequate theory must allow for the possibility of a "true disease" that is currently untreatable or uninsured, and a "covered condition" that is not a disease (e.g., cosmetic surgery covered due to trauma).

  ---

  ### Part II: Critique of Your Five Points

  You asked me to commit: which of your candidate requirements are genuine, and which are prejudice?

  1.  **Reference Class:** **Genuine.** This is the hardest technical problem in naturalist accounts.
  2.  **Pre-disease/Risk:** **Genuine.** This is the locus of modern iatrogenesis.
  3.  **Evolutionary Function:** **Genuine.** Essential for avoiding the "suboptimal design" trap.
  4.  **Contested Conditions:** **Genuine.** Essential for social validity.
  5.  **Insurance/Gatekeeping:** **Prejudicial/Confused.**
      *   *Why:* You ask to anchor adequacy to the purpose of deciding "what insurers must pay for." This is a category error. Insurance criteria are *policy* decisions based on cost-effectiveness, risk pooling, and contract law. Disease criteria are *ontological* and *clinical* judgments.
      *   *Correction:* Anchor the definition to **Clinical Obligation**, not Insurance Payment. Physicians have an obligation to alleviate suffering caused by dysfunction (Clinical Obligation). Insurers have an obligation to fulfill contracts (Payment). These overlap but are not identical. Basing the definition of disease on insurance distorts the concept to fit budget cycles rather than biological and normative reality.

  ---

  ### Part III: The Incompatibility of Value-Neutrality and Contestation

  You suspect that value-neutrality (the demand that disease judgments be scientific rather than moral) cannot be satisfied alongside the demand to explain contested cases.

  **Your suspicion is confirmed.** They are jointly unsatisfiable.

  **The Argument:**
  1.  **If disease is value-neutral (Pure Naturalism):** Then disease status is determined solely by biological facts (e.g., statistical deviation from species-typical function). In this view, the debate over homosexuality or deafness is merely an epistemic error. One side is right, the other is wrong about the facts. The "heat" of the controversy is irrational.
  2.  **If the contestation is rational (as required by Desideratum #4):** Then the disagreement is not about the biology (everyone agrees on the physiology of same-sex attraction or cochlear function). The disagreement is about whether that biology constitutes a *harm* or a *bad state* for the individual.
  3.  **Conclusion:** To explain the contestation as rational, you must admit that values determine the boundary. To maintain value-neutrality, you must dismiss the contestation as ignorance. You cannot do both.

  Therefore, any theory claiming to be purely value-neutral (like Christopher Boorse's Biostatistical Theory) fails Desideratum #4. It can classify homosexuality as non-dysfunctional (perhaps), but it cannot explain why it was *ever* classified as a disease without admitting that the classification was driven by social values, which undermines the claim that the *current* classification is purely scientific. The boundary of disease is a hybrid of fact (dysfunction) and value (harm).

  ---

  ### Part IV: The Single Most Exclusionary Requirement

  You asked for the single requirement on my list that excludes the most existing theories.

  **The Requirement:** **The Harmful Dysfunction Condition (Desideratum #2).**
  Specifically, the mandate that **Dysfunction is necessary but not sufficient; Harm is also required.**

  **Why this excludes the most theories:**
  1.  **It excludes Pure Naturalism (e.g., Boorse):** Boorse's Biostatistical Theory (BST) attempts to define disease purely as statistical subnormal functioning relative to a reference class. It explicitly tries to exclude values. My requirement demands that *harm* (a value judgment) be a constitutive element. Under BST, if a condition reduces functional efficiency but the individual values it (or it causes no suffering), it is still a disease. My requirement says it is not. This kills the BST as a complete account.
  2.  **It excludes Pure Normativism (e.g., Szasz/Engelhardt):** Szasz argued that "mental illness" is a myth because it is a deviation from social norms, not a biological lesion. My requirement demands *biological dysfunction* as a necessary condition. This excludes the view that disease is *merely* social disapproval or rule-breaking.
  3.  **It excludes Pure Subjectivism:** It prevents pain or suffering alone (without dysfunction) from counting as disease (e.g., normal grief, though contested, often lacks the specific dysfunction of Major Depressive Disorder).

  **Defense of this Ranking:**
  Most philosophy of medicine falls into two camps: those who try to save objectivity by stripping out values (Naturalists) and those who try to save humanism by stripping out biology (Normativists). The **Harmful Dysfunction** requirement forces a hybrid view. It admits that biology sets the *stage* (you can't have a disease without a broken mechanism), but values write the *script* (you don't have a disease unless that break matters to the human good).

  This is the hardest requirement to satisfy because it demands a theory be biologically rigorous *and* morally sensitive. Most theories sacrifice one to save the other. By demanding both, you exclude the vast majority of extant philosophical accounts, leaving only the Hybrid theories (like Wakefield's, though even his requires the refinements regarding evolution and contestation listed above).

  ### Summary Specification

  To count as adequate, your account of disease must:
  1.  **Ground** reference classes in biology, not statistics.
  2.  **Require** both dysfunction (fact) and harm (value).
  3.  **Accept** species-typical suboptimality as health.
  4.  **Explain** boundary contestation as value-conflict, not error.
  5.  **Prioritize** clinical obligation over insurance reimbursement.

  If your theory cannot satisfy these, it is either biologically naive or morally blind. Given your background, you know which error is more dangerous in practice.
