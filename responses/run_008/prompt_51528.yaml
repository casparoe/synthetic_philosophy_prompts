  3.  **Evidence:** Analyze specific rhetorical moves by Cohen/Armelagos (Declinists) vs. Bocquet-Appel/Demographic Archaeologists (Progressivists).
  4.  **Path Forward:** Propose specific conceptual tools (Capability Approach, Risk Variance, Explicit Counterfactuals).
  5.  **Conclusion:** The impasse is structural until the normative layer is exposed.

