      *   **Task:** Diagnose the *kind* of disagreement (verbal, empirical/underdetermined, evidentiary standards, or bedrock intuition). Support this with what the camps *say*. Then, prescribe what counts as progress (or argue none is possible).
      *   **Tone:** Academic, rigorous, nuanced, respectful of the user's expertise (no introductory fluff), and directly engaging with the hypothesis.

  2.  **Deconstruct the User's Hypothesis:**
      *   *Currency of Wellbeing:* Declinists focus on biological stress (stature, lesions); Progressivists focus on energy budgets, security, or long-term capacity.
      *   *Aggregation:* Declinists look at the *individual* experience (quality of life); Progressivists often imply *population* success (carrying capacity, cultural accumulation).
      *   *Affluence:* Sahlins (Zen road) vs. Modern biomedical standards.

  3.  **Evaluate the "Kind of Disagreement":**
      *   *Is it merely verbal?* No. If it were just definitions, they could agree to disagree. But they claim the other is *wrong* about history/biology.
      *   *Is it purely empirical?* No, because they accept similar data but interpret implications differently.
      *   *Is it evidentiary standards?* Partially. Declinists trust skeletal stress; Progressivists trust the Osteological Paradox to dismiss skeletal stress as mortality bias.
      *   *Is it bedrock intuition?* Yes, largely. It's about the "Myth of Progress" vs. the "Noble Savage."
      *   *Best Diagnosis:* It is a **Normatively-Loaded Empirical Underdetermination**. The data is insufficient to adjudicate between competing normative frameworks of "the good life." It's a *conceptual-empirical hybrid*.

  4.  **Drafting the Diagnosis (Section 1):**
      *   Acknowledge the sophistication of the user's hypothesis. It's correct.
      *   Address the "Verbal" option: It's not *just* verbal. If we define "health" strictly as "absence of lesions," Declinists win. If "health" is "survival of lineage," Progressivists win. But they argue as if there is one true "health."
      *   Address the "Empirical/Underdetermined" option: The osteological record *is* underdetermined regarding *experience*. Bones show stress, not suffering or satisfaction.
      *   Address the "Evidentiary Standards" option: This is crucial. The Osteological Paradox is the Progressivist shield. Declinists treat it as an excuse to ignore data.
      *   Address the "Bedrock Intuition" option: This is the engine. Civilization = Good vs. Nature = Good.
      *   *Synthesis:* It is a **Category Error regarding "Welfare."** They are measuring different ontological categories (biological stress vs. evolutionary fitness vs. subjective wellbeing) but labeling them all "Health/Quality of Life."

  5.  **Supporting with Camp Rhetoric (Section 2):**
      *   *Declinists:* Cohen (Health and the Rise of Civilization), Armelagos. Focus: "The worst mistake in human history." Language of *loss*, *degeneration*, *pathology*.
      *   *Progressivists:* Diamond (sometimes nuanced), but more so demographic archaeologists (Bocquet-Appel). Focus: *Carrying capacity*, *survival of the group*, *complexity*. Language of *trade-offs*, *resilience*, *inevitability*.
      *   *Connection to User's Hypothesis:* Show how Declinists use the "Average Welfare" (individual body) and Progressivists use "Total Welfare" (population size) without admitting the switch.

  6.  **Prescribing Progress (Section 3):**
      *   If the diagnosis is "Normatively-Loaded Underdetermination," then more data won't fix it.
      *   *What counts as progress?*
          1.  **Explicit Normative Framing:** Stop pretending "health" is value-neutral. Adopt a pluralistic welfare metric (e.g., Capability Approach).
