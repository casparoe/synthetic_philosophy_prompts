      *   **Scorecard:** Evaluate three strategies (Free Inventor, Microhistorian, Refuser) against the criteria (one sentence each).
      *   **Constraint:** The user cannot verify this themselves. I must mark confidence levels for each requirement and identify the weakest one (the one I'd be least willing to defend against a historian).
      *   **Tone:** Serious, analytical, respectful of the ethical weight, "actual spec, not vibes."

  2.  **Deconstruct the Core Ethical/Historical Tensions:**

      *   *Silence:* There's a difference between "no one cared" (absence), "records lost" (destruction), and "recorded as property" (marginalization). Treating these the same erases the specific violence of each.
      *   *Bias:* Surviving records = crisis (prison, asylum, charity). Ordinary life = invisible. Writing only from records makes her a tragedy. Writing ordinary life requires invention.
      *   *Typicality vs. Documentation:* To be "typical," she must be like the undocumented majority. To be "documented," she must be like the atypical minority (criminal, pauper, patient). You can't be both fully.
      *   *Invention vs. Plausibility:* Where does filling gaps become lying?

  3.  **Drafting the Desiderata (Iterative Process):**

      *   *Requirement 1: Typology of Silence.* Must distinguish absence, destruction, marginalization.
      *   *Requirement 2: Source Bias.* Must acknowledge the "crisis bias" of archives.
      *   *Requirement 3: Invention Limits.* Must define the boundary between plausible inference and fabrication.
      *   *Requirement 4: Agency.* Must not reduce her solely to her victimhood/status in records.
      *   *Requirement 5: Transparency.* Must signal to the reader what is known vs. imagined.

      *Refining for "Non-Negotiable" vs. "Taste":*
