answer: |-
  Here is the spec sheet for the ethical reconstruction of an undocumented life, based on current historiographical debates (Subaltern Studies, Microhistory, Archives of Violence).

  ### The Desiderata

  **1. The Typology of Silence**
  *   **Requirement:** The text must distinguish between *Archival Absence* (no record created), *Archival Destruction* (record created then lost/removed), and *Archival Marginalization* (record exists but defines the subject as an object/asset).
  *   **Status:** **Non-Negotiable.** Treating these as identical erases the specific violence of each; a missing census line is different from a burned union ledger, which is different from being listed as "1 wife" in a husband's inventory.
  *   **Confidence:** High (Standard archival theory).

  **2. The Pathology Correction**
  *   **Requirement:** If the only surviving documents depict the subject in crisis (prison, asylum, charity), the reconstruction must explicitly acknowledge this skew and refuse to let "crisis" stand in for "biography."
  *   **Status:** **Non-Negotiable.** Failing this turns the subject into a case study of deviance rather than a human being who likely spent 95% of their life outside of crisis.
  *   **Confidence:** High (Core tenet of social history).

  **3. The Invention Boundary**
  *   **Requirement:** Any interiority (thoughts, feelings, dialogue) not attested to by a document must be signaled as inference or invention, distinct from attested fact.
  *   **Status:** **Taste/Convention.** *How* you signal it (author's note, italics, afterword) is stylistic, but the *separation* of fact from fiction is ethically required to prevent the invention from hardening into future fact.
  *   **Confidence:** Medium (Debated in creative nonfiction vs. historical fiction).

  **4. The Negative Space Acknowledgement**
  *   **Requirement:** The narrative must account for the "destroyed/lost" records by acknowledging the gap itself, rather than filling it so seamlessly the reader forgets the information is missing.
  *   **Status:** **Non-Negotiable.** To fill a known void without marking it is to lie about the nature of the evidence.
  *   **Confidence:** **Low (The Weakest Link).** *See note below.*

  **5. The Contextual Anchor**
  *   **Requirement:** When specific data is missing, the subject may be grounded in aggregate data (wages, caloric intake, mortality rates) for her class/location, provided the text admits she may not have matched the average.
  *   **Status:** **Non-Negotiable.** This is the only bridge between "no record" and "plausible reality."
  *   **Confidence:** High (Standard quantitative history method).

  ***

  ### The Jointly Unsatisfiable Pair

  You cannot satisfy **Requirement 2 (Pathology Correction)** and **Requirement 5 (Contextual Anchor)** simultaneously without breaking **Requirement 3 (Invention Boundary).**

  *   **The Conflict:** To correct the "Pathology Bias" (showing her as normal, not just a crisis case), you *must* invent ordinary days, because ordinary days were not documented. To stay grounded only in "Contextual Anchors" (aggregate data) makes her a statistic, not a person. To make her a person who is *also* typical requires inventing interiority that contradicts the surviving "crisis" documents.
  *   **The Choice:** You must choose whether to prioritize her **humanity** (which requires invention that risks accuracy) or her **historical footprint** (which accepts she is only visible as a tragic case). You cannot have a "typical" woman who is also "strictly documented."

  ***

  ### The Weakest Link

  **Requirement 4 (The Negative Space Acknowledgement)** is the one I would be least willing to defend if a working historian pushed back.
  *   **Reasoning:** We cannot know what was in the destroyed records. Demanding a narrative "account" for them risks speculating on the very silence we claim to respect. A historian could argue that marking the gap is a performative gesture that changes nothing about the actual knowledge loss, and that the only honest move is to leave the gap empty, even if it breaks the narrative flow.

  ***

  ### Strategy Scorecard

  **The Novelist (Free Inventor)**
  This approach succeeds at restoring humanity and correcting pathology bias but fails the invention boundary by allowing plausible fabrications to harden into perceived fact.

  **The Microhistorian (Document-Bound)**
  This approach satisfies the invention boundary and typology of silence but fails the pathology correction by inevitably presenting the subject as a deviant or victim defined by the archive.

  **The Refuser (Silence Kept)**
  This approach maintains perfect ethical integrity regarding the invention boundary but fails the fundamental purpose of reconstruction by leaving the subject in the archival absence where she was found.
