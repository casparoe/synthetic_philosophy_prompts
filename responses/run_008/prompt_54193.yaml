      *Confidence Marking:* I need to be honest. I am an AI, not a historian. I need to base this on established historiographical debates (Subaltern Studies, Microhistory, Archives of Violence).
      *   *Weakest Point:* Probably something regarding "destroyed records." We can't know what was destroyed. Claiming we must "account" for them is philosophically sound but practically impossible.

  4.  **Developing the Scorecard:**

      *   *Novelist (Free Inventor):* Fails on transparency/bias, succeeds on humanity.
