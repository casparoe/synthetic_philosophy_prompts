prompt: |-
  I've been reading a popular book on rationality that summarizes Aumann's agreement theorem roughly as follows: 'Aumann proved that two fully rational people cannot agree to disagree. If you and I start from the same prior beliefs and each know the other is rational, then simply exchanging our final estimates is enough to bring them into line, even if we arrived at them from different evidence. The proof turns on common knowledge, meaning simply that both of us know the same thing. It follows that whenever two honest, intelligent people persist in a disagreement, at least one of them is failing at rationality — and now that we all have access to the same internet, there is less and less excuse for it.'

  The book leans on this to argue that I should move my credences toward those of my disagreeing peers, on pain of being irrational. I'm inclined to accept the theorem itself but suspicious of what's being built on top of it. Please audit the summary sentence by sentence: tell me which parts a decision theorist would accept without complaint, which are harmless simplifications, and which are genuine misstatements — being careful about what the theorem actually assumes about priors, information, and what "common knowledge" means. Then tell me whether the book's practical conclusion survives once the summary is corrected, or whether it depended on one of the distortions. Please keep the whole audit under 400 words.
