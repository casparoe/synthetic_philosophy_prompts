  **The Temperament**

  The clinic smelled of lemon disinfectant and warm dust, not ozone or futurism. It was a converted dental office in the brick district, the kind of place where you waited in a vinyl chair before being ushered into a room with beige curtains. Ilse liked the modesty of it. There were no neon promises here, just a form signed in triplicate and a helmet that looked like a motorcycle relic.

  She was on week six of the Split. The arrangement was simple: five days in the Experience Machine, two days in the city. In the machine, Ilse was still a piano tuner, but the pianos were always receptive. The humidity was perfect. The pins held their torque. The owners listened with rapt silence. She felt the surge of competence, the clean dopamine of a problem solved without friction.

  On weekends, she woke in her actual apartment. The air was stale. The radiators clanked. Her back ache, suppressed chemically during the week, returned with a dull throb.

  "You look tired," Marcus said. They were sitting in the back of a van, waiting for a client to finish brewing coffee. Marcus was a refuser. He wore wool sweaters that itched and tuned by ear alone, refusing electronic aids.

  "The transition is rough," Ilse admitted. She held her tuning hammer, feeling the weight of it. It felt heavier than the simulated one. In the machine, the tool was an extension of her hand. Here, it was cold steel.

  "Sarah went under full-time," Marcus said, not looking up from the upright he was working on. "Didn't even say goodbye. Just stopped answering."

  "I know."

  "It's the partial bit that gets you," Marcus said, striking a key. A dissonance wavered in the air. "You remember the high enough to hate the low."

  Ilse struck the matching key on the piano. The beat was slow, ugly. In the machine, she would have adjusted the tension until the wave smoothed into a perfect unison. Here, the string was old, the pin block worn. She could fix it, but it would never be *true*. It would always be a compromise.

  "That's the point, isn't it?" Ilse said. "To appreciate the real work."

  "Is it work if you know you're going back to the dream on Monday?" Marcus asked. "You're not living here, Ilse. You're camping."

  The friction grew over the next month. The machine's pleasures began to curdle. Because she knew the perfection was programmed, the applause of simulated concert hall audiences felt like pity. Yet, the reality she returned to had lost its texture. When she tuned a client's Steinway on a Saturday, her ear drifted. She couldn't trust the beat she heard. Was the string actually sharp, or was her memory calibrated to the machine's absolute pitch?

  The uncertainty was a nausea. Nozick had argued we want to *do* things, not just experience doing them. But the Split had convinced Ilse that doing was merely a prelude to experiencing. If the feeling of accomplishment was identical in the helmet, why suffer the backache? Yet, if the feeling was identical, why did the real one feel so hollow?

  The crisis came on a Tuesday. She was due back in the clinic at noon. She stood in her living room, holding the helmet case. Outside, rain streaked the window. A neighbor was practicing scales on a poorly maintained vertical. The notes were muddy, the rhythm stumbling.

  In the machine, she would have fixed the piano by now. She would have soothed the neighbor. She would have been loved for it.

  Ilse looked at the tuning hammer on her table. It had a nick in the handle from when she dropped it three years ago. A real scar on a real object. She realized that during her weeks in the machine, she hadn't missed the rain. She hadn't missed the nicked handle. She had missed the *consequence*. In the simulation, if she dropped the hammer, it made a sound. Here, it left a mark.

  The partial immersion hadn't given her the best of both worlds. It had made her a tourist in her own life. The pleasure of the machine relied on the contrast with reality, but the reality was now merely the waiting room for the machine. She was becoming like Sarah, but slower. A ghost in phases.

  She picked up the phone and dialed the clinic.

  "Center for Restorative States," the voice said. Cheerful. Synthetic.

  "I'm canceling," Ilse said. "The remaining sessions. All of them."

  "There's a penalty for breaking the contract, Ms. Vane. And may I ask why? The withdrawal symptoms usually peak at week ten. You're only at eight."

  "It's not the withdrawal," Ilse said. She looked at the hammer. "I can't tune anymore."

  "We can adjust the simulation. Make it more challenging."

  "No," Ilse said. "In there, I know I'm safe. Here, I don't. I need to not know."

  She hung up. She walked to the window and listened to the neighbor's stumbling scales. It was irritating. It was imperfect. It was happening. Ilse picked up her kit. She would go over there. She would knock on the door. She might be rejected. The piano might be beyond repair. The rain would get her coat wet.

  She opened the door and stepped into the hallway. The air was cold. She shivered, and the sensation was sharp, unmediated, and entirely hers. She chose the resistance of the string over the silence of the wire.

