answer: |-
  This is a classic and sophisticated impasse, and your intuition that the dispute has shifted terrain is correct. Based on the details you provided—specifically the concession of the paraphrase thesis coupled with the resistance to calling the dispute "merely verbal"—the diagnosis is that this is no longer a first-order ontological disagreement about composition. It is a **metaontological disagreement about the nature of quantification and the accessibility of metaphysical structure.**

  Your working hypothesis is largely accurate: the residual disagreement is about the epistemology of metaphysical structure. However, to be precise, it is specifically a clash between **ontological realism** (the view that there is a single, privileged structure of reality that our quantifiers must match) and **conceptual pragmatism** (the view that quantification is a tool we impose, and multiple tools can be equally valid).

  Here is the breakdown of why the stalemate exists, why it feels substantive, and what (if anything) could move it.

  ### 1. The Diagnosis: A Migration of the Dispute
  The Special Composition Question (SCQ) was originally framed as a question about objects: *When do some things compose a whole?* However, once your group conceded the **Paraphrase Thesis**, the first-order question was effectively dissolved.

  If the Nihilist's "There are no tables, only simples arranged table-wise" and the Universalist's "There are tables (fusions of simples)" are intertranslatable with no loss of predictive or explanatory power, then there is no empirical or logical fact that can distinguish them. They are empirically equivalent theories.

  At this point, the Universalist attempted to rescue substantivity by appealing to **joint-carving** (a la Ted Sider). They are arguing that while both sentences are "true" in their own frameworks, one framework maps onto the fundamental structure of reality and the other does not. The Nihilist and the quantifier-variant Moderate (a la Eli Hirsch) are countering that "structure" is not something we can access independently of our conceptual schemes.

  Therefore, the debate is no longer about shoes, moons, or tables. It is about **semantics and fundamentality**.
  *   **The Universalist** is maintaining that existence is a property of the world that our language attempts to track.
  *   **The Nihilist/Variantist** is maintaining that existence is a function of the language we use to describe the world.

  ### 2. Why It Does Not Feel Verbal
  You asked why, if the paraphrase thesis holds, the dispute does not feel verbal to the participants. This is a crucial phenomenological point in metaontology.

  *   **The Phenomenology of Discovery:** Metaphysicians generally experience their work as discovery, not stipulation. When the Universalist says the quantifier "carves at the joints," they are expressing a realist intuition that reality has a specific grain. To tell them the dispute is verbal feels like being told their discovery is actually an invention. It triggers a sense of loss regarding the objectivity of metaphysics.
  *   **Theoretical Virtues as Truth-Trackers:** The Universalist likely believes that theoretical virtues (simplicity, elegance, lack of arbitrariness) are evidence of truth. Their argument that "any restriction draws a sharp line" is an appeal to simplicity. They feel this *must* correspond to reality. The Nihilist, conversely, views these virtues as pragmatic. The feeling of substantivity comes from the fact that both sides are appealing to deep philosophical values (Realism vs. Anti-Realism), which feel weightier than mere dictionary definitions.
  *   **The Moderates' Squeeze:** The Moderates feel the most friction because they lack the theoretical elegance of the Universalist (who has no restrictions) and the ontological parsimony of the Nihilist (who has no composites). Their stalemate is the most telling: they are trying to find a "middle ground" in a debate that has become binary at the metaontological level. You cannot have "moderate" joint-carving; either the structure is there or it isn't.

  ### 3. Testing Your Hypothesis
  Your hypothesis is that the disagreement is about **whether a metaphysical posit can be vindicated by theoretical virtues alone or requires contact with something independent of them.**

  This diagnosis holds up well against the positions you described:
  *   **The Universalist** believes theoretical virtues (avoiding arbitrariness/vagueness) *are* contact with independence. For them, the fact that unrestricted composition is simpler *means* it is more likely to be the structure of reality.
  *   **The Nihilist/Variantist** believes theoretical virtues are internal to the system. Without an independent check (which the paraphrase thesis suggests is impossible), virtues are just aesthetic preferences.

  **Where your hypothesis might need refinement:** It is not just about *epistemology* (how we know); it is about *metaphysics* (what there is to know). The Universalist claims there *is* a fact of the matter about joint-carving, even if it is hard to access. The Variantist claims there *is no* fact of the matter. So the dispute is both metaphysical (does structure exist?) and epistemological (can we access it?).

  ### 4. What Could Count as Progress?
  You asked what would count as progress: a formal result, a new criterion, an empirical discovery, or an agreement to speak differently.

  *   **Empirical Discovery:** None. Science deals with the paraphrase-equivalent predictions. Physics does not care if you call a fusion an "object" or "simples arranged fusion-wise."
  *   **Formal Result:** Unlikely. Both systems can be formalized consistently. Logic can tell you if a system is coherent, not if it is the "one true" system.
  *   **New Criterion:** Unlikely to help. Any new criterion for composition (e.g., causal integration) will face the same metaontological challenge: "Is this criterion a discovery about the world or a rule of your language?"
  *   **Agreement to Speak Differently:** This is the only viable path, but it requires a metaontological settlement. Progress would look like the group agreeing to frame the debate as **Conceptual Choice** rather than **Ontological Discovery**.

  **The Hard Truth:** The stalemate is itself the finding. In the absence of a way to access "joint-carving" independent of our theories, the debate cannot be resolved on its current terms. The Universalist is asking for a "God's Eye View" of quantification that many philosophers (following Putnam or Carnap) believe is incoherent. The Nihilist is asking the Universalist to abandon realism about structure, which the Universalist views as abandoning metaphysics itself.

  ### 5. Recommendation for the Reading Group
  If you want to unstick the group, you must change the question. Stop asking, "Do composites exist?" and start asking, "What do we want our ontology to *do*?"

  1.  **Acknowledge the Metaontological Shift:** Explicitly state that since the paraphrase thesis was conceded, the SCQ is no longer the primary object of study. The primary object is now the justification for quantifier variance vs. quantifier absolutism.
  2.  **Evaluate Pragmatic Goals:** Ask the Universalist: "If the Nihilist's language predicts everything yours does, what specific work does 'joint-carving' do for you?" Ask the Nihilist: "If the Universalist's language is simpler, why resist adopting it as a useful fiction?"
  3.  **Accept the Stalemate as a Boundary:** Recognize that this specific debate hits the limit of what analytic metaphysics can resolve without a new theory of reference or truth.

  **Verdict:** The disagreement is **metaontological**. It feels substantive because it concerns the realism of logic itself. No empirical or formal progress will solve it. The only progress available is the realization that the Special Composition Question, under the constraint of the Paraphrase Thesis, is not a question about the world, but a question about which linguistic framework the group finds more philosophically satisfying. The stalemate is not a failure of argument; it is the natural result of two incompatible views on the relationship between language and reality.
