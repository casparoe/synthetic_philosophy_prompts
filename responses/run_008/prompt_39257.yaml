answer: |-
  # JOINT STATEMENT ON ANTHROPIC REASONING
  **Adversarial Collaboration Outcome**  
  **Signatories:** Dr. Aris Thorne (Defender, Self-Sampling Assumption) & Dr. Lena Kovic (Defender, Self-Indication Assumption)  
  **Date:** October 24, 2023

  ## 1. Agreed Claims

  After a year of adversarial collaboration, the undersigned agree to the following foundational claims regarding the structure of anthropic reasoning. These claims establish the common ground upon which our remaining disagreements rest.

  1.  **Bayesian Framework:** Self-locating beliefs must be updated via Bayesian conditioning. The posterior probability of a hypothesis $H$ given evidence $E$ (including indexical evidence) is proportional to the prior probability of $H$ multiplied by the likelihood of $E$ given $H$.
  2.  **The Nature of Indexical Evidence:** The statement "I exist" or "I am observing this" constitutes evidence that must be accounted for in the likelihood function. We disagree on *how* this evidence modifies the likelihood, but agree it cannot be ignored.
  3.  **The Trilemma of Test Cases:** Any viable theory of anthropics must provide a consistent resolution to the following three thought experiments:
      *   **The Doomsday Argument:** Does our relatively early birth rank among humans imply a higher probability of early human extinction?
      *   **The Presumptuous Philosopher:** Should physicists be confident that the universe is vast (containing trillions of observers) rather than small, simply because their existence is more likely in the vast universe?
      *   **The Incubator (Bostrom):** If a machine creates one observer on Heads and a billion observers on Tails, what credence should a created observer assign to Tails upon waking?
  4.  **Dutch Book Avoidance:** Credences assigned in anthropic scenarios should, wherever possible, be calibrated to avoid sure-loss betting scenarios (Dutch Books), assuming standard decision-theoretic linkages between credence and action.
  5.  **Reference Class Sensitivity:** Both parties acknowledge that the definition of the "reference class" (the set of observers from which one considers oneself a sample) is a critical variable. We agree that a theory that requires an *ad hoc* or gerrymandered reference class to avoid counterintuitive results is theoretically inferior to one that does not.

  ## 2. Table of Disagreements

  The following table isolates the precise points of divergence. The wording has been negotiated to ensure both parties accept the characterization of their own position and their opponent's.

  | Issue | Self-Sampling Assumption (Thorne) | Self-Indication Assumption (Kovic) |
  | :--- | :--- | :--- |
  | **Core Maxim** | "Reason as if you are a random sample from the set of all **actual** observers in your reference class." | "Reason as if you are a random sample from the set of all **possible** observers, weighted by their probability of existence." |
  | **Treatment of Existence** | My existence is a precondition for reasoning, not evidence that favors hypotheses with more observers. Conditioning on "I exist" screens off the number of observers. | My existence is positive evidence for hypotheses that posit more observers. Hypotheses that make my existence more probable *a priori* receive a likelihood boost. |
  | **The Doomsday Argument** | **Valid.** My early birth rank is surprising if humanity lasts for trillions of years. I should update toward earlier extinction. | **Invalid.** The likelihood boost for a populous humanity (because it makes my existence more likely) cancels out the likelihood penalty from my early birth rank. |
  | **The Presumptuous Philosopher** | **Rejected.** It is absurd for physicists to conclude the universe is vast without empirical data. SSA blocks this inference by treating existence as fixed. | **Accepted (in principle).** It *is* more probable that I find myself in a universe with more observers. If the only evidence is existence, we should favor the populous hypothesis. |
  | **Double-Counting Charge** | SIA double-counts: it conditions on existence to enter the game, then weights by observer count as if existence weren't already guaranteed. | SIA corrects for selection bias: ignoring observer counts treats a world with 1 observer and a world with 1 billion as equally likely to contain *me*, which is false. |

  ## 3. Cruxes and Empirical Predictions

  We have identified specific claims where our theoretical differences yield divergent numerical predictions. We agree to treat these as the empirical cruxes of our dispute.

  ### Crux 1: The Double-Counting Objection
  **Question:** Is the SIA probability shift a legitimate correction for selection effects, or does it treat the fact of one's existence as evidence twice (once to condition on being an observer, again to weight by observer density)?

  **Concrete Case: The AI Cloning Experiment**
  *   **Setup:** A fair coin is flipped.
      *   **Heads:** A specific AI architecture is instantiated **once** in a secure server.
      *   **Tails:** The same AI architecture is instantiated **one billion times** in identical secure servers.
      *   All instances are qualitatively identical and receive no information other than their own instantiation and the setup description.
      *   Each instance is asked: "What is your credence that the coin landed Tails?"
  *   **SSA Prediction (Thorne):** **50%.**
      *   *Reasoning:* The coin is fair. I condition on the fact that I am an AI instance. In both worlds, AI instances exist. The probability of the coin landing is independent of how many copies are made. To shift credence is to count my existence as evidence for Tails, but my existence was guaranteed in both branches by the experimental setup.
  *   **SIA Prediction (Kovic):** **>99.9999999%.**
      *   *Reasoning:* There are one billion times more "observer-moments" experiencing this evidence in the Tails world than in the Heads world. I should reason as if I am a random sample from all possible observer-moments. It is overwhelmingly more likely that I am one of the billion Tails-copies than the single Heads-copy.

  ### Crux 2: The Doomsday Update
  **Question:** Does birth rank alone justify a probability shift regarding the total duration of a civilization?

  **Concrete Case: The Galactic Census**
  *   **Setup:** We discover we are the $10^{10}$th human-born observer. We consider two hypotheses: $H_{short}$ (Total humans = $10^{11}$) and $H_{long}$ (Total humans = $10^{20}$). Priors are equal (50/50).
  *   **SSA Prediction (Thorne):** **Posterior for $H_{short}$ $\approx$ 100%.**
      *   *Reasoning:* Being among the first 10% is much more likely if the total pool is small. $P(Rank|H_{short}) \gg P(Rank|H_{long})$.
  *   **SIA Prediction (Kovic):** **Posterior remains 50/50.**
      *   *Reasoning:* While the rank is less likely in $H_{long}$, the prior probability of *existing* to observe the rank is $10^9$ times higher in $H_{long}$. The factors cancel exactly ($10^{-9} \times 10^9 = 1$).

  ## 4. Analysis of Verbal Disputes

  We have identified a component of the SSA/SIA dispute that appears to be verbal rather than substantive, specifically regarding the link between **credence** and **betting behavior**.

  **The Verbal Component:**
  A significant portion of the disagreement dissolves when we specify the **payoff structure** of the bets associated with the credences.
  *   If the bet pays **$1 per world** (the reward is shared among all copies or paid once to the universe), the SSA credence (50%) maximizes expected utility.
  *   If the bet pays **$1 per observer** (each copy gets the reward individually), the SIA credence (~100%) maximizes expected utility.

  **Why it is Verbal:**
  Both parties agree on the physical facts of the cloning case. Both agree on the decision theory (maximize expected utility). The disagreement over "credence" arises because "credence" is being used as a shorthand for "betting odds," but the betting odds depend on the *aggregation function* of utility across observers.
  *   Thorne (SSA) implicitly assumes an **average utilitarian** or **world-centric** aggregation.
  *   Kovic (SIA) implicitly assumes a **total utilitarian** or **observer-centric** aggregation.

  **Surviving Substantive Dispute:**
  Once this verbal confusion is set aside by fixing the betting protocol, a metaphysical disagreement remains: **The Ontology of Possible Observers.**
  *   **Kovic (SIA)** maintains that non-actualized possible observers have a sort of "weight" in probability space that affects the likelihood of the actual world.
  *   **Thorne (SSA)** maintains that only actual observers exist, and probability shifts based on merely possible observers constitute a category error.

  This ontological crux cannot be resolved by betting behavior alone, as it pertains to the interpretation of probability mass in modal realism versus actualism. We agree to focus future seminar work on this metaphysical foundation.

  ***

  **Signed,**

  *Aris Thorne*  
  *Senior Fellow, Center for Rational Epistemology*

  *Lena Kovic*  
  *Director, Institute for Anthropic Studies*
