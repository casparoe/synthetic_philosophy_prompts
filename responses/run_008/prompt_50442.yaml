prompt: |-
  I serve on the board of a mid-sized nonprofit music school — about four hundred students, a modest endowment, no municipal backing. Four years ago we launched a capital campaign to convert a 1920s vaudeville house we own into a proper recital hall. The original estimate was $3.4 million; we have now spent $11.2 million, the contractor has just disclosed a serious waterproofing problem at the foundation, and completing the work is now priced at roughly $5 million more. Meanwhile, a comparable, fully renovated 400-seat venue two neighborhoods over has come on the market at $7.9 million, and our broker believes we could sell our half-finished shell for perhaps $3 million. The board is split down the middle. The strongest argument for continuing is not architectural: the family behind our largest naming gift — $4 million, pledged specifically for this building — has let it be known that they would withdraw all support from the school, and encourage their circle to do likewise, if we abandon what they regard as their hall, and their annual giving covers an operating gap no other funder plausibly would. One of our trustees, who teaches game theory, has begun calling the project Shubik's dollar auction: the game in which a dollar bill is auctioned to the highest bidder under the rule that the second-highest bidder also pays, so that once bidding passes a certain point both parties are trapped paying for a prize only one can win. She argues our position is worse, because under every option we are the one who pays for something already sunk, and each individually reasonable decision to continue has carried us to an outcome none of us would have voted for at the outset.

  Please draft the written opinion I will circulate to the board before next month's meeting. It should recommend one concrete course of action — finish under a hard cap, buy the alternative venue and sell the shell, stop and sell outright, or a better option we haven't yet considered — with the options compared on a forward-looking basis only, treating the $11.2 million as gone under every branch, as our game-theorist trustee insists. But it must also engage the donor consideration seriously rather than waving it away as sentimentality, because it is the one respect in which our situation arguably is not a dollar auction: the money already spent is, in effect, held over us by parties who can retaliate, and I want the memo to say plainly whether that makes further escalation rational here, or merely explicable. Finally, it should close with a standing rule for any future capital project — some form of pre-committed stop-loss or renewal gate at fixed spending thresholds — and defend that rule against the obvious objection that it will sometimes force abandonment of projects whose expected value, judged from inside the escalation, still favors continuing. The other trustees are practical people; they will not accept a memo that just labels the sunk-cost fallacy and stops, nor one that pretends the donor question doesn't exist.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**

      *   **Role:** Board member of a mid-sized nonprofit music school (400 students, modest endowment, no municipal backing).
      *   **Situation:** Capital campaign to convert a 1920s vaudeville house into a recital hall.
          *   Original Estimate: $3.4M.
          *   Spent so far: $11.2M.
          *   New Estimate to Complete: +$5M.
          *   Total Cost if Finished: $16.2M.
          *   Alternative Option: Buy a comparable, fully renovated 400-seat venue nearby for $7.9M.
          *   Exit Option: Sell the half-finished shell for ~$3M.
      *   **The Conflict:** Board is split.
      *   **The Donor Constraint:** A major family pledged $4M specifically for *this* building. They threaten to withdraw all support (including annual giving covering an operating gap) and turn their circle against the school if the project is abandoned.
      *   **The Game Theory Analogy:** A trustee calls it "Shubik's Dollar Auction" (escalation of commitment where both winner and loser pay, leading to irrational escalation). She argues sunk costs are trapping them.
      *   **Requirements for the Memo:**
          1.  Recommend *one* concrete course of action (Finish, Buy Alternative + Sell Shell, Stop + Sell, or New Option).
          2.  Compare options on a *forward-looking basis only* (treat $11.2M as sunk/gone).
          3.  Engage the donor consideration seriously (is retaliation rational to accommodate or just explicable?).
          4.  Close with a standing rule for future capital projects (pre-committed stop-loss/renewal gate).
          5.  Defend that rule against the objection that it might kill viable projects mid-stream.
          6.  Tone: Practical, serious, not just labeling "sunk cost fallacy," acknowledging the donor reality.

  2.  **Evaluate the Options (Forward-Looking Financials):**

      *   *Option A: Finish the current building.*
          *   Forward Cost: $5M (construction) + potential contingency (let's say 10% = $0.5M) = $5.5M.
          *   Asset Value: A renovated recital hall (value unknown, but presumably covers the investment eventually? Or is it an operating drain?).
          *   Donor Impact: Retain $4M pledge + annual operating support.
          *   Net Forward Cash Flow: -$5.5M + $4M (pledge) = -$1.5M (plus retained annual support).
          *   Risk: More construction surprises (waterproofing suggests structural issues).

      *   *Option B: Buy Alternative Venue + Sell Shell.*
          *   Forward Cost: $7.9M (purchase) - $3M (sale of shell) = $4.9M net cash outlay.
          *   Asset Value: Fully renovated, ready-to-use venue.
          *   Donor Impact: Lose $4M pledge + lose annual operating support + reputational damage.
          *   Net Forward Cash Flow: -$4.9M (capital) + Loss of Annual Gap Funding.
          *   Comparison: Capital cost is similar to finishing ($4.9M vs $5.5M), but you get a *finished* product vs. one with known foundation issues. However, the donor loss is the killer.

      *   *Option C: Stop and Sell Outright (No new venue).*
          *   Forward Gain: $3M.
          *   Forward Cost: Need a venue eventually? If the school needs a hall, this isn't viable long-term. Assuming the school *needs* a performance space to function as a music school. If they sell and don't buy, they lose capacity. Let's assume they must have a hall. If they sell and rent, that's an operating cost.
          *   Donor Impact: Total loss of support.
          *   Viability: Low. A music school without a hall is crippled.

      *   *Option D: Negotiated Pivot (The "Better Option").*
          *   Can we finish but scale back? Can we buy the other building and offer the donors naming rights there?
          *   The prompt says the pledge is "specifically for this building." The donors regard it as "their hall."
          *   However, the financial reality is stark.

      *   *Re-evaluating the Donor Threat:*
          *   The donors gave $4M *pledged*. Has it been paid? "Pledged specifically." Usually, capital pledges are paid over time or upon milestones. If they withdraw, does the school owe them money back? Or do they just stop paying the remainder?
          *   Crucially: "Annual giving covers an operating gap no other funder plausibly would." This is an existential threat to operations, not just capital.
          *   If we abandon the project, we lose the $4M (unpaid pledge) AND the annual operating subsidy.
          *   If we finish, we spend $5M more to get the $4M pledge. Net capital cost: $1M. Plus we keep the operating subsidy.
          *   If we switch venues: We spend $4.9M net capital (Buy 7.9 - Sell 3.0). We lose the $4M pledge (so we have to find that elsewhere). We lose the operating subsidy.
          *   Financially, finishing looks *less* expensive forward-looking *if* the donor money is contingent on completion.
          *   *Wait, check the math:*
              *   **Finish:** Spend $5M. Receive $4M (pledge). Net Capital: -$1M. Keep Operating Subsidy. Asset: Risky building.
              *   **Switch:** Spend $7.9M. Receive $3M (sale). Net Capital: -$4.9M. Lose $4M Pledge (need to raise elsewhere). Lose Operating Subsidy. Asset: Safe building.
              *   **Difference:** Switching costs ~$3.9M more in immediate capital *plus* the loss of the operating subsidy *plus* the need to replace the $4M pledge.
              *   **Conclusion:** Financially, finishing is the only viable option, *despite* the sunk cost trap. The donor threat changes the payoff matrix. It is not a pure Dollar Auction because there is an external enforcement mechanism (the donors) that penalizes walking away.

  3.  **Addressing the Game Theory (Dollar Auction):**
      *   The trustee is right that *structurally* it looks like escalation of commitment.
      *   However, a Dollar Auction assumes rational actors maximizing utility based *only* on the auction item. Here, the "auction" is tied to a broader relationship.
      *   The "penalty" for losing the auction (abandoning the project) is imposed by a third party (the donors).
      *   Therefore, continuing is not irrational *if* the cost of donor retaliation exceeds the cost of completion.
      *   Calculation: Cost to complete (net of pledge) = $1M. Cost of donor retaliation = Loss of $4M pledge + Loss of annual operating gap coverage (in perpetuity?) + Reputational damage.
      *   Rational choice: Finish. But with strict controls.

  4.  **Drafting the Memo - Section by Section:**

      *   **Header:** To Board, From [Me], Date, Subject.
      *   **Opening:** Acknowledge the gravity. Validate the Game Theory argument (it's a strong insight) but contextualize it.
      *   **Financial Analysis (Forward-Looking):**
          *   Explicitly state: $11.2M is gone.
          *   Compare Option 1 (Finish) vs. Option 2 (Switch).
          *   Show the math including the donor variable.
          *   Show that Option 1 is actually cheaper forward-looking *because* of the donor constraints.
      *   **The Donor Question:**
          *   Don't dismiss it as sentiment. It's a contractual/relational risk.
          *   Is it rational to yield to blackmail? In game theory, if the threat is credible and the cost of defiance > cost of compliance, compliance is the Nash Equilibrium.
          *   However, we must mitigate the risk of *further* escalation.
      *   **Recommendation:** Finish, but under a "Hard Cap" and revised governance.
      *   **Future Governance Rule:**
          *   Need a "Stop-Loss" or "Renewal Gate."
          *   Objection: What if we kill a good project?
          *   Defense: The cost of error in escalation is asymmetric (ruin vs. delay). Better to kill a viable project early than let a bad one bleed us dry. Or, require fresh independent valuation at thresholds.

  5.  **Refining the Argument (Self-Correction/Nuance):**
      *   *Critique:* Is it ethical to yield to donor blackmail?
      *   *Response:* It's not blackmail if it's their money. They are setting conditions on their gift. It's a constraint, like a regulation.
      *   *Critique:* What if the $5M estimate is also wrong?
      *   *Response:* That's why the "Hard Cap" is essential. If it goes over $5M, we stop automatically. No more board votes to "just finish it."
      *   *Critique:* The Trustee's Dollar Auction point.
      *   *Response:* Acknowledge she is right about the *psychology*, but wrong about the *math* in this specific instance due to the donor variable. The Dollar Auction becomes rational if the penalty for losing the bid is higher than the bid itself.
      *   *The "Better Option":* Is there a middle ground? Try to negotiate with donors to apply funds to the alternative building?
      *   *Decision:* The prompt asks to recommend one concrete course. Negotiating is risky and might fail. The financials strongly favor finishing *if* the $5M is hard-capped. The alternative building costs $7.9M cash vs $5M cash (minus $4M pledge). The alternative is financially disastrous. I will recommend finishing with a hard cap.

  6.  **Developing the Governance Rule:**
      *   Rule: "The 20% Variance Gate." If projected costs exceed budget by 20%, project pauses. A *new* board vote (excluding original champions) + independent audit required.
      *   Defense against "killing good projects": Good projects survive scrutiny. Bad projects hide behind momentum. The friction is a feature, not a bug.

  7.  **Tone Check:**
      *   Respectful of the Game Theory Trustee.
      *   Respectful of the Donors (without being subservient).
      *   Firm on financial reality.
      *   Practical, not academic.

  8.  **Final Polish:**
      *   Ensure the distinction between "Sunk Cost" and "Forward Cost" is clear.
      *   Make sure the donor threat is treated as a financial variable, not an emotional one.
      *   Ensure the recommendation is unambiguous.

  *(Self-Correction during drafting)*: I need to be careful about the $4M pledge. Is it already in hand? "Pledged specifically." Usually means promised. If they withdraw, we lose the *remaining* pledge. I should assume the $4M is part of the funding mix for the *completion*. If we finish, we get the $4M. If we don't, we don't.
  Wait, if we finish, we spend $5M. We get $4M. Net cost $1M.
  If we switch, we spend $7.9M - $3M = $4.9M. We lose $4M pledge (so we need to raise $4M + $4.9M = $8.9M total new capital).
  The difference is massive. $1M net vs $8.9M net (plus loss of operating support).
  The recommendation must be to finish, but with extreme safeguards.

  *Wait, one nuance:* The prompt says "completing the work is now priced at roughly $5 million more." Does that include the remaining pledge? No, that's construction cost.
  So:
  Path A (Finish): Raise $5M construction. $4M comes from Family. Net raise needed: $1M.
  Path B (Switch): Raise $7.9M purchase. Sell shell for $3M. Net raise needed: $4.9M. Plus replace $4M pledge. Plus replace operating gap.
  Path A is overwhelmingly superior financially, *provided* the $5M estimate is accurate.
  The risk is the $5M estimate is wrong (like the previous ones).
  Therefore, the recommendation is: **Finish, but with a statutory Hard Cap at $5M.** If costs exceed $5M, the project is abandoned regardless of donor wrath. This breaks the Dollar Auction loop.

  *Governance Rule:* Needs to be about *process*, not just this project. "Mandatory Independent Review at Variance Thresholds."

