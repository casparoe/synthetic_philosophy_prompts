prompt: |-
  My roommate is doing an epi masters and I'm doing philosophy of science, and we've gotten into a running argument about Simpson's paradox. Every time a reversal shows up in her coursework — treatment A beats treatment B in both the mild cases and the severe cases but loses overall, or the acceptance rates flip when you split by department — someone says "obviously you use the partitioned data" and someone else says "obviously the aggregated data is bigger and less noisy," and neither side ever says what makes it obvious. I've realized what I actually want is not another fight about a particular dataset but the spec: what does a theory of Simpson reversals have to deliver before it deserves to settle our arguments?

  So write me the desiderata. Fix the purpose as decision-making under time pressure — a doctor choosing a treatment, or an admissions officer staring at a reversal, not a theorist with infinite leisure — since I think adequacy depends on that and I want the list relative to it. For each requirement give the case behind it: it has to actually get the classic reversals right without peeking at which answer we already wanted; it has to say something about the difference between a confounder, a mediator, and a collider, because those three seem to demand opposite conditioning choices; it should not be circular, i.e. not require causal knowledge so specific that using it already answers the partition question; it has to deal with the reference-class embarrassment where several partitions are available and they disagree (age, severity, hospital site, all at once); and whatever it says should degrade gracefully when the cells get tiny, since "condition on everything" quietly becomes "condition on noise." Add whatever else belongs. For each one, say whether it's non-negotiable or a preference of one camp, and flag any subset you suspect is jointly unsatisfiable — my own hunch is that non-circularity plus getting every reversal right can't both hold, but I'd like to see whether that's real or just my ignorance of the literature, so that part is what I most want from you.

  Then a quick pass at the scorecard, keeping it short since the criteria are the real work: Pearl's do-calculus / back-door story, the potential outcomes people, and the deflationary "there is no paradox, just report all the data" line. For each, one or two sentences against your own list, and tell me which single requirement on the list does the most to exclude candidates — my roommate bets it's the non-circularity one, I bet it's the one about multiple available partitions, and we've got a dinner riding on it. Also if any of the requirements only make sense once you've already bought a causal framework rather than being neutral between frameworks, point that out, because then it's smuggling in a camp preference dressed as a desideratum and I want to catch those. A table is fine for the main list if thats easier, just keep the reasoning next to each row.
