answer: |-
  There is no single, canonical term in philosophy of mind or cognitive science that captures *exactly* this specific conversational asymmetry. You have correctly identified a gap in the terminology.

  However, your observation is a precise intersection of three established concepts from different fields. To understand what you are seeing, we need to stitch together **Algorithm Aversion** (psychology), **Falsificationism** (philosophy of science), and **Indexicality** (linguistics).

  Here is the breakdown of the nearest neighbors, why they don't quite fit, and a proposal for how to carve out the concept you are describing.

  ### 1. The Nearest Neighbors

  **A. Algorithm Aversion (Behavioral Economics/Psychology)**
  *   **What it is:** The empirical finding that people lose confidence in algorithms much faster than in humans after both make the same mistake. (See: Dietvorst, Simmons, & Massey, 2015).
  *   **Where it fits:** It captures the **asymmetry**. Humans are granted "idiosyncrasy credit"; algorithms are not. One error destroys the algorithm's perceived competence, whereas humans are afforded a margin of error.
  *   **Where it parts ways:** Algorithm aversion usually focuses on *competence* (is this advice good?), not *ontology* (is this entity a mind?). Your observation is deeper: the error doesn't just make the bot look *incompetent*; it makes it look *non-sentient*.

  **B. The Uncanny Valley (Robotics/Aesthetics)**
  *   **What it is:** The dip in emotional response when an entity looks/almost acts human but has subtle artificial features.
  *   **Where it fits:** It captures the **failure-mode-as-fingerprint** aspect. A bot that is 99% human but repeats a phrase triggers a "revulsion" or "detection" response similar to a corpse-like android.
  *   **Where it parts ways:** Traditionally, this is visual or tonal. You are describing a *logical* uncanny valley based on conversational structure (repetition, perfect politeness). Also, the Uncanny Valley explains the *feeling*, not the *evidentiary logic* (why one error outweighs thirty successes).

  **C. Popperian Falsification (Philosophy of Science)**
  *   **What it is:** The logic that universal claims ("All swans are white") can never be fully verified, but can be definitively falsified by a single counter-example ("Here is a black swan").
  *   **Where it fits:** This is the **logical structure** you identified. Users treat "This is a human" as a hypothesis. "Humanity" is treated as a state that implies *non-determinism*. A repetitive loop is a "black swan" that falsifies the hypothesis of non-determinism.
  *   **Where it parts ways:** Falsification is a normative logic of science, not a descriptive psychology of chat. It doesn't explain why a *typo* counts as confirming evidence for humanity (since a perfect typist could also be human).

  ### 2. Are You Mushing Two Phenomena?

  You asked if you are conflating **Asymmetry** (one error kills credibility) with **Failure-Mode-as-Fingerprint** (specific errors imply machinery).

  **Yes, you are describing two distinct mechanisms that reinforce each other.**

  1.  **The Weighting Mechanism (Asymmetry):** This is *Negativity Bias* applied to agency. Negative evidence weighs heavier than positive evidence. This applies to humans too (one betrayal ruins a friendship), but the threshold is much lower for bots.
  2.  **The Typological Mechanism (Fingerprint):** This is about *Essentialism*. Users hold a folk-psychological theory that "Machines are deterministic/perfect" and "Humans are noisy/imperfect."
      *   **Repetition** is treated as evidence of *determinism* (a loop).
      *   **Typos** are treated as evidence of *noise* (biological interference).

  **Why they feel like one thing:**
  They merge because the *only* errors that trigger the Asymmetry are the ones that fit the Fingerprint. If your bot hallucinates a fact (a "human" error), users might get mad, but they might not instantly conclude "Bot." If your bot repeats a string (a "machine" error), the verdict is instant. The asymmetry is *conditional* on the type of error.

  ### 3. Carving Out the Concept

  Since there is no existing term, here is a conceptual carving of what you are witnessing. You might call this **"The Fragility of Attributed Agency."**

  **Definition:**
  A cognitive heuristic wherein the attribution of "mind" or "humanity" to an interlocutor is treated as a **defeasible assumption** that is highly vulnerable to **mechanistic tells**, but resistant to **humanizing evidence**.

  **The Three Rules of this Heuristic:**

  1.  **The Determinism Trap:** Users assume minds are inherently non-deterministic (capable of true variation). Any behavior that suggests a fixed loop (repetition, rigid structure) is treated as a *proof of absence* of mind.
  2.  **The Noise Requirement:** To sustain the attribution of humanity, the interlocutor must demonstrate "organic noise" (typos, variance in tone, emotional leakage). Perfection is suspicious; imperfection is exculpatory.
  3.  **Asymmetric Burden of Proof:** The bot bears the burden of proof for humanity continuously. The human bears the burden of proof for machinery only when they act *too* perfectly.

  **Borderline Cases:**
  *   **The Stressed Human:** A human support agent pasting a macro response twice due to high volume. *Verdict:* Users often still flag this as "bot-like," suggesting the heuristic overrides context.
  *   **The Creative Bot:** A bot programmed to intentionally insert typos or vary phrasing. *Verdict:* This exploits the heuristic. If done well, it passes. If done poorly (randomized typos that don't match context), it triggers the Uncanny Valley.
  *   **The "Glitch" vs. The "Slip":** A bot dropping a connection (technical failure) is forgiven. A bot repeating a sentence (logical failure) is convicted. This suggests users distinguish between *channel noise* and *processing logic*.

  ### 4. Why This Bugs You (The Philosophical Stakes)

  You mentioned: *"It feels like there's something specific here about how people treat a mind as the kind of thing that must be shown consistent across time, while a bot can be convicted off one slip."*

  This touches on the **Problem of Other Minds**.
  *   **For Humans:** We grant "mind" by default (Solipsism is psychologically impossible for social creatures). We assume continuity of self. One slip is just noise in the signal.
  *   **For Artifacts:** We grant "machine" by default. To attribute a mind is a *category error* that requires overwhelming evidence. However, because we know machines are simulacra, we scan for the *seams* of the simulation.

  The "seam" is always a break in **Gricean Maxims** (specifically the Maxim of Manner).
  *   **Repetition:** Violates "Avoid obscurity and ambiguity" / "Be brief." It suggests the system has lost track of the conversational state.
  *   **Perfect Politeness:** Violates "Be natural." It suggests the output is generated rather than felt.

  ### Summary Recommendation

  If you need to name this in a report or discussion, **"Algorithm Aversion"** is the recognized scientific term for the *asymmetry*, but it misses the *ontological* weight you're describing.

  If you want to be precise about the phenomenon you've isolated, I suggest using the phrase **"Mechanistic Falsification."**

  *   **Why:** It captures that users are running a falsification test (looking for the one error that disproves humanity).
  *   **Why:** It captures that the specific errors sought are *mechanistic* in nature (loops, perfection, determinism).

  **Practical Advice for your Bot:**
  Since you are managing this: Do not try to prove your bot is human by making it "smarter." Prove it is human by giving it **controlled failure modes**.
  *   Program variance in greeting length.
  *   Allow for "processing time" delays that vary.
  *   If the bot gets stuck, have it break the fourth wall *before* it loops ("I'm having trouble parsing that, let me try again") rather than letting the loop happen. The *admission of confusion* is a high-value human signal; the *repetition of confusion* is a high-value bot signal.

  You have identified a genuine gap in how we categorize agency. It isn't just a diagnostic test; it's a **boundary maintenance ritual** where humans define themselves by what they are *not* (deterministic, perfectly consistent, loop-prone).
