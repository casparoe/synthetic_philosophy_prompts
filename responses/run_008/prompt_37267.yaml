answer: |-
  This is a classic formulation of the **Cluelessness Objection** to consequentialism (specifically act consequentialism and longtermism). It's a serious argument that has kept professional ethicists busy for decades (see work by Peter Singer, Frank Jackson, and more recently Hilary Greaves and William MacAskill).

  Your hunch is correct: the rot is in the move from **(5) to (6)**, but it relies on a hidden, unjustified assumption buried inside **(5)**.

  Here is the breakdown of where the argument breaks, why it looked convincing, the distinction you asked for, and the cost of the alternatives.

  ### The Broken Step: Premise (5) and the Inference to (6)

  The critical error is the claim in **(5)** that the noise is **symmetric**.

  > **(5)** *For any act I might do, the far-future effects are unpredictable in both sign and size; as far as I can tell the noise is symmetric, so nothing I can estimate about the near future tells me which act comes out ahead once the far future is included.*

  Your friend is conflating **Epistemic Ignorance** ("I don't know what will happen") with **Probabilistic Symmetry** ("The probability of good outcomes equals the probability of bad outcomes").

  **Why it looked fine:**
  It feels intuitive. If the future is chaotic and I can't trace the causal chains, I have no *evidence* to favor one outcome over another. In the absence of evidence, the Principle of Indifference suggests I should assign equal probability to positive and negative deviations. If the deviations are equal, they cancel out in the expected value calculation.

  **Why it is false:**
  Chaos does not imply symmetry. Chaos implies *sensitivity to initial conditions*. It means small differences get amplified. It does **not** mean that amplifying a "good" initial difference is equally likely to result in a bad world as amplifying a "bad" initial difference.

  Consider the baseline. If I save a child from drowning (Act A) vs. let them drown (Act B):
  *   **Act A** starts with a world containing one more happy life, plus their descendants, plus the economic/social contributions of that lineage.
  *   **Act B** starts without those.
  *   **The Chaos:** Yes, that lineage might produce a tyrant 200 years later (bad) or a saint (good).
  *   **The Symmetry Claim:** Your friend claims the probability that the lineage produces a tyrant is exactly offset by the probability they produce a saint, *relative to the baseline of the child being dead.*

  There is no physical or moral law that guarantees this symmetry. In fact, most longtermists argue that **existential security** is a "robust good." A world with more people, more technology, and more stability (Act A) might have a higher *floor* of value than a world with fewer people and less stability (Act B), even if both are subject to chaotic variance. The "noise" might be high variance, but the **mean** (the expected value) of Act A can still be higher than Act B.

  **The Inference (5) → (6):**
  Because (5) fails to establish symmetry, (6) fails to follow. Even if the far-future effects are unpredictable (high variance), it does not mean the *expected value* difference is zero. It just means the *confidence interval* is wide. Consequentialism can still say: "Act A has a wider range of outcomes, but its center of mass is higher than Act B."

  ### The Distinction: "Unknown" vs. "Symmetric Noise"

  This is the crux of your seminar debate. Here is how to spell it out using your friend's own terms.

  **1. Unknown (Epistemic Cluelessness):**
  "I cannot predict whether saving this child leads to a utopia or a dystopia in 300 years."
  *   *Status:* True. We accept this.
  *   *Implication:* We have high uncertainty.

  **2. Symmetric Noise (Probabilistic Neutrality):**
  "The probability that saving this child leads to a net-positive future is exactly 50%, and the magnitude of the positive outcomes exactly balances the magnitude of the negative outcomes."
  *   *Status:* Unjustified assumption.
  *   *Implication:* Expected Value = 0.

  **The Example:**
  Imagine you are betting on a die roll.
  *   **Scenario 1 (Unknown):** I hide the die. You don't know what number is on top. You don't know the EV.
  *   **Scenario 2 (Symmetric):** I tell you the die is standard (1-6). You don't know the outcome, but you know the *distribution*. The EV is 3.5.
  *   **Your Friend's Claim:** Because the future is chaotic (Scenario 1), we must treat it like a fair coin toss where Heads = +Infinity and Tails = -Infinity (Scenario 2).
  *   **The Rebuttal:** Chaos makes the future like a **loaded die where we don't know the weighting**, not a fair coin. Just because you don't know the weighting doesn't mean you are entitled to assume it's fair. If you have *any* reason to think saving a life tends to create more value than destroying one (a near-term certainty), the burden is on your friend to prove that the chaotic long-term effects *systematically* reverse that value often enough to cancel it out. They cannot prove that.

  ### Pricing the Alternatives

  You want to keep **(4)** (Maximize Expected Value). Here is the cost of fixing the argument by rejecting different premises.

  #### Option A: Reject (5) — The "Robust Good" Defense (Recommended)
  *   **The Move:** Accept chaos, deny symmetry. Argue that some actions (like reducing existential risk) improve the *baseline* trajectory of civilization in a way that is robust to chaos.
  *   **Why it works:** It preserves Consequentialism and Longtermism. It admits uncertainty but refuses to equate uncertainty with neutrality.
  *   **The Cost:** You must do the hard work of identifying which goods are "robust." You can't just say "maximize happiness"; you have to argue why certain structural changes (e.g., better governance, AI safety) have a positive *drift* even if the *variance* is high.
  *   **Verdict:** This is the standard longtermist response (Greaves/MacAskill). It keeps your view intact.

  #### Option B: Reject (6) — The "Subjective Consequentialism" Defense
  *   **The Move:** Argue that (6) is wrong because "better than" is relative to available evidence, not omniscient knowledge.
  *   **Why it works:** It saves action-guidance. Even if the *objective* EV is unknowable, the *subjective* EV (based on your best credences) is not. If your best credence is that saving the child is better, you do it.
  *   **The Cost:** You concede that you might be objectively wrong (the child might have become Hitler). You have to accept that moral rightness is indexed to your epistemic state, not the actual outcome.
  *   **Verdict:** This is compatible with keeping (4) if you interpret "Expected Value" as "Subjective Expected Value."

  #### Option C: Grant the Friend (Accept 8) — Moral Skepticism
  *   **The Move:** Accept that total-consequence consequentialism is action-guiding only in trivial cases, or not at all.
  *   **Why someone might do it:** It is intellectually honest about the limits of prediction.
  *   **The Cost:** **Catastrophic.**
      1.  **Longtermism Dies:** You cannot justify spending money on AI safety, pandemic prevention, or climate change mitigation, because the "butterfly effects" of spending that money (e.g., diverting resources from art) might be worse.
      2.  **Short-termism Dies Too:** Your friend thinks this only hurts longtermism. It doesn't. If I save a drowning child, that child lives 50 more years. Those 50 years are full of chaotic interactions. If the butterfly effect refutes longtermism, it also refutes saving the child, because I can't know if their 50 years of life net positive or negative relative to the chaos they introduce.
      3.  **Paralysis:** You are left with a moral theory that tells you nothing. You might have to retreat to rule-consequentialism or deontology, but your friend can run the same butterfly argument against rules ("Following the rule 'don't lie' might cause a war 100 years later").
  *   **Verdict:** This leads to global moral skepticism. It's a high price to pay for a symmetry assumption that has no evidence.

  ### Summary Advice for Your Seminar

  Your friend's argument is seductive because it uses **humility** (admitting we can't predict the future) to sneak in a **substantive claim** (that the unpredictability is neutral).

  **The line to hit:**
  > "You are moving from 'I don't know the sign of the long-term effects' to 'The expected value of the long-term effects is zero.' That only follows if the probability distribution is symmetric around zero. But chaos amplifies *initial differences*. If my action creates a near-term good (saving a life), the chaos amplifies a world *with that good*. There is no reason to think the amplification process is biased against the initial good. Therefore, the near-term good gives me a reason to think the Expected Value is positive, even if the variance is huge."

  **Which step to hate?**
  Hate **(5)**. Specifically, hate the clause *"the noise is symmetric."* That is the unsupported premise doing all the work. Without it, (6) collapses, and Consequentialism survives as a guide to maximizing *estimated* value under uncertainty, rather than requiring omniscience.

  If you keep (4) (MEV), you simply define "Expected Value" as the sum of outcomes weighted by your *credences*. Your credence that saving a life is good shouldn't be wiped out by chaos unless you have a specific reason to think chaos is malicious. Since you don't, you act on the near-term evidence, acknowledging the long-term uncertainty without letting it veto the decision.
