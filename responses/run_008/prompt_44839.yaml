answer: |-
  **TO:** Grantmaking Committee
  **FROM:** Advisory Desk (Decision Theory)
  **DATE:** October 23, 2023
  **SUBJECT:** Decision Memo: Staged Research Proposal (St. Petersburg Structure)

  **Recommendation**
  Fund Stage 1 ($200k) immediately. Pre-authorize Stage 2 ($400k) contingent on Stage 1 success metrics. Establish a hard expenditure cap of $5M (1% of endowment) for this program. Future stages beyond Stage 2 require fresh committee review against contemporary opportunity costs.

  **The Core Disagreement**
  This proposal is a practical instance of the St. Petersburg Paradox. The mathematics of Expected Value (EV) suggest infinite return, but human intuition and institutional constraints scream "risk." The committee is not disagreeing about the math; you are disagreeing about the *utility function* of the foundation.

  **Addressing the Finance Member (The 2% Cap)**
  Your colleague argues that accepting infinite EV logic commits us to funding any longshot with a huge payoff, risking ruin. This is correct. However, the proposed 2% cap ($10M) is a heuristic for "risk of ruin," not a moral absolute. It is principled in spirit (preserving the foundation's permanence) but arbitrary in magnitude. Why 2% and not 1%? By setting the hard cap at 1% ($5M), we honor the principle of risk management more conservatively without rejecting the opportunity entirely. Rejecting Stage 1 outright ignores the value of "real options"—the right, but not the obligation, to proceed. Buying the option (Stage 1) is cheap; buying the whole chain is risky.

  **Addressing the EV Maximizers (Infinite Arithmetic)**
  Proponents argue that positive EV mandates funding. This is where the arithmetic becomes a cop-out. Expected *Value* is linear; Expected *Utility* is not. A loss of $5M hurts us more than a gain of $5M helps us (diminishing marginal utility). Claiming "infinite EV" ignores that money has diminishing returns and that our capital is finite. Recognizing this isn't rejecting math; it's applying better math. We maximize impact, not dollar-weighted probability.

  **The Stopping Rule**
  To resolve the third faction's concern about arbitrary caps, we adopt a **Dual-Trigger Stopping Rule**:
  1.  **Financial Ceiling:** Total cumulative funding for this program ceases at $5M. Given the doubling cost structure, this naturally limits the program to roughly 5 stages.
  2.  **Performance Gate:** Funding for Stage 3+ is not automatic. It requires a renewed assessment of whether this program remains the best use of marginal dollars compared to new proposals at that time.

  **Conclusion**
  This approach validates the EV argument (we take the bet) while respecting the Finance argument (we limit exposure). It treats the grant as a portfolio option rather than a binding contract. The infinite EV is a signal to cap exposure, not a command to ignore risk.

  Please review this framework before Thursday. The question is not whether the math works, but whether this risk profile fits our institutional utility.
