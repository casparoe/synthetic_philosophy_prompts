answer: |-
  ### Preliminary Filtering: What I Discarded and Why

  Before settling on the final list, I wrestled with several candidate requirements that I ultimately rejected or merged. I want to show you this work, as it clarifies why the remaining list is so tense.

  1.  **Discarded: "The theory must align with current legal statutes."**
      *   *Reason:* Law is a floor, not a ceiling, for ethics. In a post-*Dobbs* landscape, legal permissibility varies by zip code. A moral theory for a consultation service must be able to critique the law, not just mirror it.
  2.  **Discarded: "The theory must provide a deterministic algorithm for every case."**
      *   *Reason:* This is a category error. Ethics is often about weighing competing goods, not solving equations. Demanding determinacy forces theories to be overly simplistic. I merged this into a weaker requirement for *action-guidance*.
  3.  **Merged: "Respect for Conscience" and "Professional Integrity."**
      *   *Reason:* While vital for hospital policy, these are meta-ethical constraints on the *implementation* of the theory, not the moral theory itself. I set them aside to focus on the normative core.
  4.  **Discarded: "The theory must maximize overall well-being."**
      *   *Reason:* This presupposes utilitarianism. We need desiderata that a deontologist, virtue ethicist, or care ethicist could also accept as baseline checks.

  ***

  ### The Desiderata: Requirements for an Adequate Theory

  Here are the six requirements any theory must address to be viable in your clinical context. I have marked them as **Non-negotiable** (required for the theory to function in a pluralistic, rights-based clinical setting) or **Substantive** (philosophically robust commitments that reasonable people might dispute).

  #### 1. The Infanticide Constraint
  *   **Requirement:** The theory must explain why killing a newborn is impermissible without relying solely on the biological event of birth.
  *   **Motivation:** The case of the newborn. If a theory grants the fetus no moral status until birth, it struggles to explain why infanticide is wrong, given that a newborn and a late-term fetus are biologically and cognitively nearly identical.
  *   **Status:** **Non-negotiable.** (For a clinical ethics service, a theory that permits infanticide is professionally untenable, regardless of philosophical arguments by Tooley or Singer.)

  #### 2. The Bodily Integrity Constraint
  *   **Requirement:** The theory must account for the unique moral weight of forced bodily use.
  *   **Motivation:** The rape case and the maternal health threat. Even if the fetus is a person, most intuitions hold that one cannot be compelled to donate kidneys or bone marrow to save a life. A theory that ignores the physical imposition of pregnancy fails the rape case.
  *   **Status:** **Non-negotiable.** (This is the bedrock of modern bioethics and informed consent.)

  #### 3. The Non-Arbitrariness Constraint (The Line Problem)
  *   **Requirement:** If the theory posits a sharp moral threshold (e.g., viability, birth), it must identify a *moral* difference at that location, not merely a biological or technological one.
  *   **Motivation:** The 31-week renal agenesis case vs. a 32-week case. Viability shifts with geography and technology. If moral status hinges on the quality of local NICUs, morality becomes arbitrary. Biology is gradual; if the theory demands a binary (permissible/impermissible), it owes an account of why the line isn't magical.
  *   **Status:** **Non-negotiable.** (Without this, the theory is vulnerable to the charge of superstition or administrative convenience.)

  #### 4. The Responsibility Constraint
  *   **Requirement:** The theory must specify whether voluntary intercourse creates a special obligation to sustain the pregnancy, distinct from the general duty to rescue.
  *   **Motivation:** The "convenience" case vs. the rape case. If voluntary sex implies consent to pregnancy, the rape exception becomes hard to justify (as the fetus is still a life). If it implies no obligation, the distinction between rape and contraception failure vanishes. The theory must avoid treating gestation as a penalty for risk-taking.
  *   **Status:** **Substantive.** (Libertarians may argue risk creates obligation; feminists may argue sex is not a contract for gestation. A theory must take a stand, but the stand itself is contestable.)

  #### 5. The Consistency Constraint (Potentiality)
  *   **Requirement:** The theory must not entail that contraception or abstinence is morally equivalent to abortion, unless it is prepared to defend that claim.
  *   **Motivation:** The "Future-Like-Ours" argument. If the wrongness of abortion is depriving a being of a future, then preventing that being from conceiving does the same. A theory that condemns abortion as murder but condones contraception faces a consistency gap regarding *which* potential persons count.
  *   **Status:** **Non-negotiable.** (In a secular, pluralistic hospital, a theory that categorizes contraception as morally equivalent to homicide is practically unusable.)

  #### 6. The Action-Guidance Constraint
  *   **Requirement:** The theory must offer sufficient determinacy for clinical decision-making, even if it admits of gray zones.
  *   **Motivation:** Your need to advise colleagues. A purely gradualist theory ("moral weight increases slowly") is biologically accurate but clinically paralyzing. At what percentage of neural development does abortion become impermissible? The theory must bridge the gap between gradual biology and binary decisions.
  *   **Status:** **Substantive.** (Some philosophers argue ethics shouldn't be action-guiding in hard cases, but for a consultant, this is a functional necessity.)

  ***

  ### Incompatible Pairs: Where the Desiderata Fight

  You asked for the tensions. These are the points where satisfying one desideratum makes satisfying another nearly impossible.

  **1. The Non-Arbitrariness Constraint vs. The Action-Guidance Constraint**
  *   **The Conflict:** Biology is continuous (Non-Arbitrariness), but clinical decisions are binary (Action-Guidance).
  *   **The Cost:** To satisfy Action-Guidance, you usually need a bright line (e.g., "24 weeks"). To satisfy Non-Arbitrariness, you must admit that 24 weeks and 23 weeks + 6 days are morally nearly identical. A theory that gives you a clear rule (Action-Guidance) almost always violates the demand for non-arbitrary biological alignment. You cannot have perfect biological nuance and perfect clinical clarity simultaneously.

  **2. The Bodily Integrity Constraint vs. The Infanticide Constraint**
  *   **The Conflict:** If you ground the permissibility of abortion strictly in Bodily Integrity (Thomson), you can justify abortion even late in pregnancy. However, once the child is born, Bodily Integrity no longer applies (the mother is not physically tethered). If the fetus was killable *only* because of the bodily burden, the newborn suddenly acquires full protection at birth.
  *   **The Cost:** This creates a "moral magic" at birth. To satisfy the Infanticide Constraint (newborns are protected), you need to grant the fetus some independent status. But if you grant the fetus independent status, you erode the Bodily Integrity Constraint (why doesn't that status protect it against the mother's refusal?). Satisfying both requires a complex hybrid theory that risks internal contradiction.

  **3. The Responsibility Constraint vs. The Bodily Integrity Constraint**
  *   **The Conflict:** If voluntary sex creates a special obligation (Responsibility), you limit Bodily Integrity. If Bodily Integrity is absolute, Responsibility is irrelevant.
  *   **The Cost:** If you prioritize Responsibility to handle the "convenience" case, you risk victim-blaming in the contraception-failure case or undermining the rape exception (does the fetus's right to life trump the mother's body if she took the "risk"?). If you prioritize Integrity, you lose the ability to morally distinguish between the rape case and the "convenience" case, which troubles many clinicians.

  ***

  ### The Single Great Excluder

  If you must choose one requirement that will eliminate the most "live" theories from consideration, it is this:

  **The Non-Arbitrariness Constraint (specifically regarding Birth).**

  *   **Why:** This requirement excludes any theory that relies on **birth** as the beginning of moral personhood.
  *   **The Logic:** Biologically, there is no significant difference between a fetus at 40 weeks gestation (in utero) and a newborn at 40 weeks (ex utero). If a theory says the newborn has a right to life but the fetus does not, solely because of location, it violates Non-Arbitrariness.
  *   **The Exclusion:** This kills the "Social Contract" view (you are a person when you enter society), the "Legal Personhood" view, and many moderate political compromises that use birth as the hard stop. It forces the theory to either:
      1.  Admit the fetus has significant status (challenging early abortion); OR
      2.  Admit the newborn has limited status (challenging infanticide norms); OR
      3.  Find a non-arbitrary moral hinge *other* than birth (e.g., sentience, which creates its own line problems).
  *   **Impact:** It is the single hardest filter for a moderate, clinically viable position. Most hospital policies implicitly rely on birth as a clean administrative line; this requirement demands you justify why that line isn't morally arbitrary.

  ***

  ### Brief Theory Audit

  Here is how the three major frameworks you mentioned fare against these desiderata.

  **1. Judith Jarvis Thomson (Bodily Autonomy)**
  *   **Performance:** Excellent on **Bodily Integrity** and **Responsibility** (distinguishes rape vs. voluntary). Fails **Infanticide Constraint** (if the right to life doesn't include the right to use another's body, why does the newborn suddenly have a claim on the mother's resources post-birth? Thomson has to pivot to a different argument for newborns).
  *   **Verdict:** Solves the "hard cases" (rape, health) but struggles to explain why the 31-week anomaly case is *easier* than the early "convenience" case, as bodily burden is high in both.

  **2. Don Marquis (Future-Like-Ours)**
  *   **Performance:** Excellent on **Infanticide Constraint** and **Non-Arbitrariness** (continuity of the valuable future). Fails **Consistency Constraint** (implicates contraception/abstinence as morally similar) and struggles with **Bodily Integrity** (does not easily account for why the mother's rights trump the fetus's future).
  *   **Verdict:** Explains why abortion is serious, but makes it too serious to be clinically actionable in cases of rape or severe anomaly without significant modification.

  **3. Gradualism (Neural Capacities/Sentience)**
  *   **Performance:** Excellent on **Non-Arbitrariness** (tracks biology). Fails **Action-Guidance** (where exactly is the cutoff for sentience?) and struggles with **Infanticide Constraint** (newborns have low neural capacity, similar to late fetuses).
  *   **Verdict:** Biologically honest, but clinically messy. It helps you explain why the 31-week case feels different from the 8-week case, but it doesn't give you a clean rule for the 23-week case.

  ### Final Recommendation for Your Committee

  Do not look for a theory that scores 100% on all desiderata. It does not exist. The work of your committee will be to decide which desiderata you are willing to compromise.

  If I were in your chair, I would prioritize the **Bodily Integrity Constraint** and the **Infanticide Constraint** as the non-negotiable bookends. Accept that the **Non-Arbitrariness Constraint** will be violated slightly at the margins (we must draw a line for viability, even if biology is gradual) to satisfy **Action-Guidance**. This leaves you with a "modified gradualist" view: early pregnancy is governed by autonomy; late pregnancy is governed by fetal status, with birth serving as an administrative, if not metaphysical, bright line.

  This doesn't solve the moral mystery, but it gives you a principled vocabulary to explain to your colleagues why the 31-week case and the 8-week case land in different ethical buckets, without claiming the fetus magically becomes a person at the moment of delivery.
