prompt: |-
  I'm a physician who joined the clinical ethics consultation service at a large teaching hospital about three months ago, and the abortion cases are the ones I feel least equipped to handle. Last month we saw a termination at 31 weeks for a fetus with bilateral renal agenesis — no possibility of sustained life outside the womb — and the following week an early first-trimester request that some of my colleagues wanted to refuse as a matter of "convenience." I found I had no principled way to explain why one case felt easy and the other hard, and I've decided that before I read another argument in the literature, I want to know what I should be demanding of a theory in the first place.

  You are a professional moral philosopher working at the boundary of normative ethics and bioethics. Think carefully, and brainstorm before committing to your final list — I would rather see requirements you considered and discarded or merged than a list you didn't have to fight over.

  Write the desiderata: what any adequate theory of the ethics of abortion has to deliver. For each requirement, give the case or consideration that motivates it, and mark whether it is non-negotiable or instead reflects a substantive commitment that a reasonable person could reject. At minimum, consider (though you need not accept):

  - which cases the theory must get determinately right, or at least not get wrong: pregnancy resulting from rape, contraception failure, a lethal fetal anomaly discovered late, a serious but not lethal threat to maternal health, and the request that even the clinicians involved describe as purely social;
  - which distinctions it must respect rather than collapse — killing versus letting die, the difference (if any) between a fetus, a newborn, and a patient in a permanent vegetative state, the difference between declining to sustain another person's body and actively ending a life that would otherwise continue;
  - the consistency constraints: a theory that entails that infanticide is permissible, or that contraception and even abstinence are seriously wrong because they deprive a future person of a future, must either own the implication or explain it away — I want to know which requirements, once adopted, force those costs;
  - what I'll call the line problem: the relevant biology is gradual — implantation, the emergence of sentience, viability that shifts with each generation of neonatal technology, birth itself — so any theory that concentrates enormous moral weight at a sharp line owes an account of why the line's location matters morally and not merely administratively;
  - what I'll call the responsibility problem: whether, and how much, it matters that a pregnancy resulted from voluntary intercourse, and whether a theory can weigh that at all without treating gestation as a penalty for assumed risk.

  Then flag which pairs of desiderata you suspect cannot be jointly satisfied — that is the part I most want to see — and identify the single requirement that, once adopted, excludes the most otherwise-live theories. If you have room at the end, briefly say how Thomson's bodily-autonomy approach, the future-like-ours argument, and a gradualist view that ties moral weight to developing neural capacities each fare against your list, but keep the weight on the criteria: I'll do the scoring with my committee.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** A physician new to a clinical ethics consultation service (3 months in).
      *   **Problem:** Struggling with abortion cases (specifically the contrast between late-term lethal anomaly vs. early-term "convenience"). Feels lacking a principled framework.
      *   **Task:** Act as a professional moral philosopher at the boundary of normative ethics and bioethics. Brainstorm and produce a list of *desiderata* (requirements) for an adequate theory of abortion ethics.
      *   **Specific Instructions:**
          *   Think carefully/brainstorm before committing (show the work of discarding/merging).
          *   For each requirement: Give the motivating case/consideration. Mark as "Non-negotiable" or "Substantive Commitment" (reasonable people could reject).
          *   Minimum considerations to address: Specific cases (rape, contraception failure, lethal anomaly, maternal health, social request), Distinctions (killing/letting die, fetus/newborn/PVS, active/passive), Consistency constraints (infanticide, contraception/abstinence), The Line Problem (gradual biology vs. sharp moral lines), The Responsibility Problem (voluntary intercourse vs. penalty).
          *   **Crucial:** Flag pairs of desiderata that cannot be jointly satisfied (tensions/trade-offs).
          *   **Crucial:** Identify the single requirement that excludes the most otherwise-live theories.
          *   **Optional:** Briefly assess Thomson, Marquis (Future-Like-Ours), and Gradualism against the list.
      *   **Tone:** Professional, philosophical, rigorous, empathetic to the clinical context.

  2.  **Initial Brainstorming & Filtering (The "Fight Over" Phase):**
      *   *Idea 1: The theory must prohibit infanticide.*
          *   *Critique:* Is this non-negotiable? Most say yes. But some philosophers (Tooley, Singer) argue otherwise. For a *clinical* ethics service in a hospital, allowing infanticide is likely a non-starter legally and professionally. Let's mark it Non-negotiable for *clinical* applicability, even if philosophically debatable.
      *   *Idea 2: The theory must respect bodily autonomy.*
          *   *Critique:* Essential for the rape case. But does it cover the "convenience" case? If autonomy is absolute, "convenience" is fine. If limited, where is the line?
      *   *Idea 3: The theory must account for fetal moral status.*
          *   *Critique:* If it says fetus = person from conception, early abortion is murder. If fetus = nothing, late abortion is trivial. Needs nuance.
      *   *Idea 4: The Line Problem.*
          *   *Critique:* Biology is continuous. Morality often demands binaries (permissible/impermissible). A theory needs to handle this without arbitrariness.
      *   *Idea 5: Responsibility.*
          *   *Critique:* Does having sex imply consent to pregnancy? Most modern ethics say no (risk $\neq$ consent). But does it create a special obligation?
      *   *Idea 6: Killing vs. Letting Die.*
          *   *Critique:* Abortion is active killing. Refusing treatment is letting die. Does this matter? Thomson argues it doesn't (unplugging). Others argue it does.
      *   *Discarded Idea:* "The theory must align with current law."
          *   *Reason:* Laws change (e.g., Dobbs). Ethics should guide law, not just mirror it. Discard as a *moral* desideratum, though keep as a practical constraint.
      *   *Discarded Idea:* "The theory must provide a single algorithm for every case."
          *   *Reason:* Unrealistic. Ethics often involves judgment. Better to demand "guidance" rather than "determinacy."

  3.  **Drafting the Desiderata (Iterative Refinement):**

      *   *Req 1: The Intuition of Impermissibility (Infanticide).*
          *   Motivation: Newborns are persons.
          *   Status: Non-negotiable (for clinical context).
      *   *Req 2: The Intuition of Permissibility (Rape/Threat).*
          *   Motivation: Forced use of body is wrong. Life threat is self-defense.
          *   Status: Non-negotiable.
      *   *Req 3: The Continuity Constraint (The Line Problem).*
          *   Motivation: Biology doesn't jump. Moral status shouldn't jump magically at birth.
          *   Status: Non-negotiable (philosophical rigor).
      *   *Req 4: The Responsibility Constraint.*
          *   Motivation: Does voluntary sex create obligation?
          *   Status: Substantive (some say yes, some say no).
      *   *Req 5: The Distinction Constraint (Killing vs. Letting Die).*
          *   Motivation: Is abortion different from withdrawing life support?
          *   Status: Substantive.
      *   *Req 6: The Consistency Constraint (Contraception/Abstinence).*
          *   Motivation: Potentiality arguments often prove too much.
          *   Status: Non-negotiable (reductio ad absurdum check).

  4.  **Identifying Tensions (The "Hard Part"):**
      *   *Tension A:* Bodily Autonomy vs. Moral Status Continuity. If the fetus is a person (continuity with newborn), autonomy usually yields (except maybe rape). If autonomy is absolute, moral status of fetus is negligible.
      *   *Tension B:* The Line Problem vs. Clinical Determinacy. A gradualist theory is biologically accurate but clinically messy (what % of neural development allows abortion?). A binary theory is clinically clean but biologically arbitrary.
      *   *Tension C:* Responsibility vs. Autonomy. If sex creates obligation, autonomy is retroactively limited. If autonomy is paramount, responsibility is irrelevant.

  5.  **Selecting the "Theory Excluder":**
      *   Which requirement kills the most theories?
      *   *Candidate:* The Continuity Constraint (Birth is not morally magic). This kills strict "Birth Threshold" views.
      *   *Candidate:* The Consistency Constraint (Contraception is not murder). This kills strict "Conception Personhood" views (unless they accept the abstinence implication).
      *   *Selection:* The **Non-Arbitrariness Constraint (Line Problem)**. It forces theories to either embrace gradualism (hard to act on) or find a non-biological moral hinge. It excludes simple "viability" or "birth" thresholds without further justification. *Wait, actually:* The requirement that **"Infanticide is impermissible but early abortion is permissible"** is the classic exclusion zone. Let's frame it as the **Newborn/Fetus Continuity Requirement**. If you must treat them similarly, you can't have one be killable and the other not without a *massive* moral difference occurring at birth. This excludes almost all moderate positions that don't rely solely on bodily autonomy.
      *   *Refinement:* Let's go with **The Consistency Constraint regarding Moral Status**. If a theory grants full personhood at conception, it fails the contraception/abstinence check or the rape check. If it grants no status until birth, it fails the infanticide check. The requirement that *excludes the most* is likely **The Demand for a Non-Arbitrary Moral Threshold**.

  6.  **Developing the Content (incorporating the prompt's specific cases):**
      *   Need to ensure the 31-week renal agenesis vs. 1st-trimester "convenience" tension is addressed.
      *   Need to address the "killing vs. letting die" distinction explicitly.

  7.  **Final Review against Constraints:**
      *   Did I show discarded ideas? Yes, in the preamble.
      *   Did I mark Non-negotiable vs. Substantive? Yes.
      *   Did I flag incompatible pairs? Yes.
      *   Did I identify the single biggest theory-excluder? Yes.
      *   Did I briefly assess Thomson, Marquis, Gradualism? Yes.

  8.  **Drafting the Response (incorporating tone):**
      *   Tone: Collegial, rigorous, acknowledging the difficulty.
      *   Structure: Preamble (Brainstorming), The Desiderata List, The Tensions/Incompatibilities, The Big Excluder, Brief Theory Assessment.

      *(Self-Correction during drafting)*: Make sure I don't just give answers. The user asked for *desiderata for a theory*, not the theory itself. I need to remain meta-ethical/normative about the *requirements* of the theory.
      *(Refining the "Non-negotiable" tag)*: Be careful. In philosophy, little is truly non-negotiable. I should frame "Non-negotiable" as "Required for clinical viability/broad reflective equilibrium" and "Substantive" as "Philosophically contestable."
      *(Refining the Tensions)*: The prompt asks to flag pairs that *cannot be jointly satisfied*. This is strong. I need to be precise. For example, "Absolute Bodily Autonomy" and "Fetal Personhood" are incompatible. But as *desiderata*? "Requirement: Respect Autonomy" and "Requirement: Protect Innocent Life". These conflict. I will frame them as tensions between desiderata.

      *(Final Polish on the "Big Excluder")*: The requirement that **"Moral status must track biological development without a magical jump at birth"** combined with **"Infanticide is wrong"** effectively kills any theory that relies on birth as the start of personhood. But the requirement that **"Contraception is not morally equivalent to abortion"** kills the Potentiality Principle. I think the **Non-Arbitrariness Requirement (Line Problem)** is the most philosophically demanding. Let's stick with that, or perhaps the **Reflective Equilibrium Requirement** (must match core intuitions about rape *and* infanticide). Let's choose **The Continuity Constraint** (Newborns and late-term fetuses must have similar status) because it forces the hardest choices.

      *Wait, re-reading prompt:* "Identify the single requirement that, once adopted, excludes the most otherwise-live theories."
      If I adopt "Infanticide is impermissible," I exclude Singer/Tooley.
      If I adopt "Early abortion is permissible," I exclude Marquis/Conservative.
      If I adopt "The theory must not rely on arbitrary biological lines," I exclude Viability and Birth thresholds.
      The most "live" theories in a hospital setting are usually Moderate (permissible early, restricted late). The requirement that kills the most *moderate* theories is the **Continuity Constraint** (why is birth magic?). But the requirement that kills the most *philosophical* theories is likely **The Consistency Constraint on Potentiality** (depriving a future).
      Let's go with **The Non-Arbitrariness Constraint (Line Problem)**. It forces theories to do heavy lifting.

      *Actually, looking at the "Responsibility Problem"*: This is a specific prompt requirement. I need to make sure it's in the list.

      *Okay, let's assemble.*

      *Preamble:* Acknowledge the difficulty. Show the filtering process.
      *List:* 5-6 key desiderata.
      *Tensions:* Explicitly state the conflicts.
      *Excluder:* Pick the strongest one.
      *Assessment:* Thomson, Marquis, Gradualism.

      *(Self-Correction on "Non-negotiable")*: I will define "Non-negotiable" as "Necessary for the theory to function in a pluralistic clinical setting without violating basic human rights norms," and "Substantive" as "Philosophically robust but contestable."

      *(Final check on tensions)*: The prompt asks for pairs of *desiderata* that cannot be jointly satisfied.
      Example: "Respect Bodily Autonomy absolutely" vs "Protect Potential Life absolutely."
      Better: "Demand for Determinacy" (clear lines) vs "Demand for Non-Arbitrariness" (biology is gradual). You can't have both perfect clarity and perfect biological alignment. This is a strong philosophical tension.

      Let's write.

      *(Wait, one more thing)*: The prompt asks me to "Think carefully, and brainstorm before committing to your final list — I would rather see requirements you considered and discarded or merged than a list you didn't have to fight over." I need to make sure this "fighting" is visible in the output, perhaps in an introductory section or interwoven. I'll put it in a preamble section titled "Preliminary Filtering."

      *(Final Plan)*:
      1.  **Preamble:** The filtering process (what I threw out and why).
      2.  **The Desiderata:** The core list with motivations and status.
      3.  **The Incompatibilities:** Where the desiderata fight each other.
      4.  **The Great Excluder:** The single most restrictive requirement.
      5.  **Theory Audit:** Thomson, Marquis, Gradualism.

