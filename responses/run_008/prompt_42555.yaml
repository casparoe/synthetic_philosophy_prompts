      *   75 minutes is *tight* for a complex role-play game with rotation, writing, and deep debrief.
      *   *Phase 1 Rotation:* If everyone tries both conditions, that's multiple rounds.
      *   *Phase 2 Cross-condition:* Requires reshuffling.
