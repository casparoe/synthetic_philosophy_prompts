answer: |-
  This is a sophisticated pedagogical challenge. You are trying to move students from a binary moral judgment (Lying = Bad vs. Kindness = Good) to a pragmatic/semantic understanding (Communication = Shared Code).

  The 75-minute timeframe is tight for a multi-round simulation with 22 students. Below is a streamlined design that preserves your core insights while ensuring you have enough time for the philosophical debrief.

  ### Lesson Plan: The Code of Candor
  **Time:** 75 Minutes
  **Class Size:** 22 Students (11 Pairs)
  **Materials:** Condition Cards (Amsterdam/Kyoto), Feedback Sheets, Timer.

  #### Part 1: Setup & Phase 1 (30 Minutes)
  **1. Introduction (5 mins)**
  *   Frame the activity: "We are testing communication protocols, not personalities."
  *   Briefly define the two protocols (avoid heavy cultural essentialism, frame as *styles*):
      *   **Protocol A (Amsterdam):** Priority is *Information Fidelity*. No hedges. "The logic is weak."
      *   **Protocol B (Kyoto):** Priority is *Relational Harmony*. No direct negatives. "Have you considered strengthening the logic?"
  *   **The Task:** Student A pitches a 60-second argument (e.g., "Cats are better than dogs"). Student B gives 60 seconds of feedback based on their card.
  *   **The Measurement:** The Receiver writes down: (1) What they think the Giver's *actual* opinion was (1-10 scale), and (2) "Would you work with this person again?" (Y/N).

  **2. Phase 1: Homogeneous Pairing (15 mins)**
  *   Pair students up. Both get the *same* protocol card (A/A or B/B).
  *   **Round 1:** Student A pitches, Student B feedback (Protocol A). Switch roles.
  *   **Round 2:** New pairs. Both get Protocol B. Pitch/Feedback. Switch roles.
  *   *Instructor Note:* Keep time strictly. 3 minutes per pair max.

  **3. Phase 2: The Cross-Condition Misfire (10 mins)**
  *   **The Twist:** Reshuffle pairs. Now, pair a **Protocol B Giver** with a **Protocol A Receiver**.
  *   **Instruction:** Do not reveal your protocol to your partner. Act strictly according to your card.
  *   **Task:** One round of Pitch/Feedback.
  *   **Measurement:** Receiver records their interpretation of the opinion.
  *   *Why this specific pairing?* A Direct Receiver interpreting an Indirect Giver creates the "false negative" (thinking they were lied to when they weren't). An Indirect Receiver interpreting a Direct Giver usually just feels bullied, which is less philosophically interesting for the "lying" question.

  #### Part 2: The Debrief (40 Minutes)
  *Do not move to the board until you have collected the data sheets.*

  **1. The Data Reveal (10 mins)**
  *   Ask for a show of hands: "In Phase 1 (Same Protocol), how many Receivers felt they knew the Giver's *true* opinion?" (Likely high).
  *   "In Phase 2 (Cross Protocol), how many Receivers are confident they know the true opinion?" (Likely low or polarized).
  *   **Key Question:** "In Phase 2, did the Giver *lie*?"
      *   *Expected Answer:* No, they followed their rules.
      *   *Philosophical Point:* Deception occurred without a false statement. This isolates the variable: **Lying is not just about propositions; it's about shared context.**

  **2. Mapping the Ethics (20 mins)**
  *   **Consequentialism (Mill/Utilitarianism):**
      *   Ask the Phase 2 Receivers: "How did that feedback make you feel? Did it help you improve?"
      *   *Point:* If the code isn't shared, the "polite lie" fails the utility test. It causes confusion (bad outcome) without preserving harmony (bad outcome). White lies only work *consequentially* if the receiver can decode them.
  *   **Kant (Deontology):**
      *   Ask: "Did the Protocol B Giver treat the Protocol A Receiver as an end or a means?"
      *   *Point:* Kant argues lying treats people as means because it robs them of agency to choose based on truth.
      *   *Nuance:* In Phase 1 (Kyoto/Kyoto), no agency is robbed because the code is shared. The Receiver *chooses* to enter a system where 'interesting' means 'bad'. In Phase 2, the Receiver's agency *is* compromised because they lack the key to the code. The wrong isn't the words; it's the **asymmetry of information.**
  *   **The "Shared Code" Insight (Gricean Pragmatics):**
      *   This is your core takeaway. Write on board: **Truth = Words + Context.**
      *   When culture matches, "This is interesting" + [Context: Politeness] = "This is bad." (Truthful).
      *   When culture clashes, "This is interesting" + [Context: Confusion] = "This is good." (Deceptive).
      *   *Conclusion:* The moral weight of a white lie depends on whether the listener holds the decryption key.

  **3. Limitations & Real World (10 mins)**
  *   Discuss the "Rotating Pairs" problem (see Honest Notes below).
  *   Ask: "If you had to work with this person for a whole semester, would you change your feedback style?"
  *   *Goal:* Highlight that trust is built over time. In the game, bluntness is cheap. In life, bluntness costs social capital.

  ---

  ### Honest Notes: Risks & Rigging

  Here is the critical feedback on your design, specifically regarding the "adjusted evaluations" twist and potential biases.

  #### 1. The "Adjusted Evaluation" Twist (Logistical Warning)
  You mentioned: *"The givers should be working from evaluations that I've secretly adjusted -- sometimes harsher than what the giver actually thought."*
  **Recommendation:** **Drop this.** It introduces a confounding variable that will break your 75-minute timeline and muddy the philosophy.
  *   **Why:** If you force a Giver to say "This was bad" when they thought "This was good," you are instructing them to **lie**, not just communicate indirectly. This conflates "Style" (Kyoto) with "Dishonesty" (Lying).
  *   **The Better Rig:** Measure the **Gap**, don't rig the Input.
      *   Have the Giver write down their *actual* rating of the pitch privately *before* they speak.
      *   Have the Receiver guess that rating *after* the feedback.
      *   **The Metric:** The difference between Giver's Private Rating and Receiver's Guess.
      *   **The Insight:** In Phase 1 (Shared Code), the Gap should be small for *both* Amsterdam and Kyoto. In Phase 2 (Cross Code), the Gap should explode for the Kyoto Giver/Amsterdam Receiver.
      *   **Why this is better:** It proves your point (indirectness isn't lying if the code is shared) without forcing students to act dishonestly, which makes them self-conscious and ruins the "natural" feel of the white lie.

  #### 2. Predictable Failure Modes
  *   **The "Kyoto" Giggle:** Second-year students often struggle with sustained indirectness. They will break character, laugh, or say "I'm trying to be polite but this is awful."
      *   *Fix:* Give them linguistic scaffolding on the card. Instead of "Be polite," write: "You must use a question to give feedback" or "You must praise one specific element before critiquing." Constraints breed creativity.
  *   **The "Amsterdam" Bully:** Without guardrails, Amsterdam students may use the "Direct" card as permission to be cruel rather than precise.
      *   *Fix:* Add a constraint to the Amsterdam card: "You must be direct, but you must not attack the person, only the idea."
  *   **Data Variance:** The "Would work with again" ratings will be noisy.
      *   *Fix:* Don't over-analyze the quantitative data. Use it anecdotally. "One person said they wouldn't work with their partner. Why?" is more powerful than an average score.

  #### 3. Where the Deck is Stacked
  *   **Efficiency Bias:** The game inherently favors Amsterdam in a classroom setting. Classrooms are "truth-seeking" environments. Kyoto style takes *time* to decode. In a 3-minute round, Amsterdam looks "efficient" and Kyoto looks "evasive."
      *   *Mitigation:* In the debrief, explicitly name this bias. "In a 3-minute game, directness wins. In a 3-year marriage, does directness still win? When is efficiency the wrong virtue?"
  *   **The "Low Stakes" Problem:** As you suspected, relational damage is cheap here. Students might prefer Amsterdam because they never have to see the partner again.
      *   *Mitigation:* This is actually a feature, not a bug, *if* you highlight it. Use it to show that **White Lies are a relational tax.** We pay the tax (by lying slightly) to maintain the relationship. If there is no relationship (this game), the tax seems unnecessary. This validates the "Care" camp's argument: Politeness isn't about the *truth value*, it's about the *relationship value*.

  #### 4. Cultural Sensitivity
  *   **Labeling:** Using "Amsterdam" and "Kyoto" is catchy, but be careful not to reify national stereotypes.
      *   *Script:* "We are using these labels as shorthand for communication *styles* often associated with these regions. But remember, there are direct Japanese people and polite Dutch people. Today, we are simulating the *protocols*, not the people."
  *   **Power Dynamics:** Ensure students know they can opt-out if a topic makes them uncomfortable, and that "feedback" is on the *pitch*, not the person.

  ### Summary of the Philosophical "Win"
  If you run this well, the "Cross-Condition" round is your smoking gun.
  When the Amsterdam Receiver says, "They told me it was fine," and the Kyoto Giver says, "I told them it was terrible," and you ask the class **"Who lied?"**...
  *   If they say "The Giver," they miss the code.
  *   If they say "The Receiver," they miss the expectation of truth.
  *   If they say **"The Situation,"** they have understood that ethics lives in the space *between* people, not just in the mouth of the speaker. That is the lesson you want.
