          *   Debrief: 30 mins.
          *   *Total:* 75 mins. This is doable but requires strict timekeeping.
      *   *Critique of the "Adjusted Evaluation" Twist:* The prompt asks for the *giver* to work from evaluations secretly adjusted. This is logistically messy in a 75-min class. Handing out secret "internal thought" cards adds cognitive load and might confuse the "Amsterdam vs. Kyoto" communication style variable.
      *   *Better Approach:* Keep the *opinion* constant (e.g., "You thought the pitch was a 4/10"), but vary the *instruction* on how to convey it. The "noise" variable is better tested in the debrief by asking the *receiver* what they heard vs. what the *giver* meant. The prompt's idea of "adjusted evaluations" is meant to show that directness doesn't guarantee truth. I need to preserve this insight without over-complicating the mechanics. *Solution:* Give the Giver a "True Opinion" card, but sometimes add a "Pressure Modifier" (e.g., "You want to be nice" or "You want to win") that skews their internal truth before they speak. Actually, simpler: Just rely on the natural variance of human honesty. Or, assign the *content* of the feedback (e.g., "Tell them the logic was weak") regardless of their actual opinion. This isolates the *style* from the *substance*. Let's refine this in the design.

  3.  **Refining the Game Mechanics:**

      *   *The "Adjusted Evaluation" Problem:* If I tell Student A "You secretly think the pitch was bad, but pretend you think it was okay," that's lying, not style. If I tell Student A "You think it was bad. Tell them it was bad," that's honesty.
      *   *The User's specific twist:* "givers should be working from evaluations that I've secretly adjusted -- sometimes harsher than what the giver actually thought, sometimes milder."
      *   *Interpretation:* The Giver watches the pitch. They form an opinion. *Then* they get a card that says "Your Official Opinion for this exercise is X." This forces them to speak a truth that isn't theirs. This tests if Directness = Truth.
      *   *Logistical Fix:* To save time, pre-assign the "Official Opinion" on the Condition Card.
      *   *Phase 2 Cross-Condition:* This is crucial. A Kyoto speaker talking to an Amsterdam listener. This creates the "misfire without lying" scenario.

  4.  **Drafting the Lesson Plan:**

      *   **Title:** The Code of Candor.
      *   **Materials:** Condition cards, Feedback sheets, Timer.
      *   **Phase 1 (Homogeneous):** Amsterdam/Amsterdam and Kyoto/Kyoto pairs.
      *   **Phase 2 (Heterogeneous):** Kyoto Giver / Amsterdam Receiver.
      *   **Debrief:** The core philosophical work.

  5.  **Addressing the Philosophical Mapping:**

      *   *Kant:* Lying violates the Categorical Imperative / treats as means. In the game, when does the receiver feel used? Usually when they realize the "code" was broken.
      *   *Consequentialism:* Outcomes matter. Did the feedback improve the next pitch? Did it hurt feelings?
      *   *The "Shared Code" Insight:* This is Gricean pragmatics. If the convention is known, "That's interesting" means "That's bad." If the convention is unknown, "That's interesting" means "That's good." The lie isn't in the words; it's in the mismatch of context. This is the "Misfire without Lying" point.

