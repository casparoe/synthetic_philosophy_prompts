              *   *My suggestion:* Drop the "secretly adjusted evaluation." It creates a confounding variable (now they are lying *and* communicating). Instead, measure the *gap* between Intended Message and Received Message. That proves the "Noise" theory better. I will argue this in the "Honest Notes."

  7.  **Structuring the Debrief:**

      *   Start with data (the ratings).
