prompt: |-
  Heard a guy on a podcast the other day say that Turing basically predicted modern AI back in 1950: his point, apparently, was that instead of trying to hand-programme an adult mind, we should build a child machine and then educate it, and that this is exactly what we now do with pretraining language models on mountains of text. The host kept nodding along like this settled the whole debate about whether LLMs are "real intelligence", and it's been bugging me since. I've read a bit about the Turing test but I'd never really registered that he had this whole picture of machines being taught rather than built.

  Can you lay out what that one idea -- make a child machine, then educate it -- could actually be claiming? Like, the distinct precise theses hiding in there, from the trivial to the radical. I can see it might just be a mundane engineering observation (start simple, build up gradually), but it might also be something much stronger: that intelligence can't be specified directly and has to be acquired through something like a developmental process, or that the training method matters (Turing apparently talked about reward and punishment, and even mused that the machine could be spared the harsher bits of a Victorian education). Which readings are platitudes, which are substantive and defensible, which are just false, and -- crucially -- which ones would actually support the podcast guy's move of claiming Turing anticipated today's language models? Because "we train models rather than programme them" and "a machine raised the way a child is raised would think" feel like very different claims to me, and I suspect only the weaker one is true of LLMs.

  Give me the readings as a list, each with a verdict, and then tell me which reading the "Turing predicted all this" line needs and whether it can have it. Also happy to hear whether any of the readings are in tension with the Turing test stuff -- e.g. if the child machine has to spend years learning like a child, does that change what the imitation game is supposed to show?
