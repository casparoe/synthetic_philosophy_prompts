          4.  Deprivation account objection (Death is bad because it deprives goods).
          5.  Book's counter to deprivation (You have to exist to be deprived).
          6.  Lucretius' Symmetry Argument (Pre-birth non-existence wasn't bad, so post-death isn't).
          7.  Claim: Epicurus won; most contemporary philosophers accept death isn't bad for the person who dies.
          8.  Claim: Mourning is a conceptual confusion because nothing bad happened to anybody.
      *   **User's Instincts/Suspicions:**
