answer: |-
  1. **Suggested grade** — **B** (Smooth writing and solid Hobsbawm coverage mask a fundamental misreading of Anderson's core theoretical stance.)

  2. **What the student gets right** — The student correctly identifies both authors as constructivists who date the nation to the modern era (last 2–3 centuries). The explanation of print capitalism's role in vernacular languages is accurate, and the Hobsbawm section is strong: the definition of invented tradition is clear, and the Scottish kilt example is the canonical choice for this argument. The synthesis correctly notes that both authors view the "ancient" feel of nations as a retrospective projection.

  3. **Errors and slips** — There are three substantive theoretical errors here that prevent an A-range mark:
      *   **Anderson and "False Consciousness":** This is the biggest error. Anderson explicitly argues *against* treating nationalism as "false consciousness" or an illusion to be dispelled. He uses "imagined" in a neutral, sociological sense (like Kantian community), not a pejorative one. He argues nations generate *real* loyalty and sacrifice, not that they are a "mass illusion" we should get "free of." This misrepresents his entire normative project.
      *   **Anderson's Timeline:** The student claims nations start with Gutenberg (15th century). Anderson argues print capitalism was a *precondition*, but nationalism itself emerges much later (late 18th century, starting with Creole pioneers in the Americas). Conflating the technology with the political form is a significant chronological slip.
      *   **Hobsbawm's "All Traditions":** The student writes, "His claim is that all traditions are invented." Hobsbawm distinguishes between "custom" (flexible, old) and "invented tradition" (rigid, recent). He does not claim *all* traditions are invented, only that many nationalistic ones are.

  4. **Marginal calls** — The student claims the authors' answers are "pretty similar." While both are constructivists, Anderson focuses on cultural psychology (how we feel belonging) while Hobsbawm focuses on political engineering (how elites manipulate symbols); treating them as identical glosses over important mechanistic differences. Also, the kilt example proves traditions are invented, but strictly speaking, it doesn't directly answer "how old are *nations*?" (it answers how old *symbols* are), though it supports the broader argument. Finally, the claim that there are "no exceptions worth taking seriously" is too absolute; both authors acknowledge proto-national forms, even if they prioritize modernity. I would lean toward penalizing the "false consciousness" point heavily, as it suggests the student hasn't grasped the nuance of the primary text.
