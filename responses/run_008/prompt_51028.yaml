answer: |-
  The line your friend is quoting is known as **Blackstone's Ratio** (from William Blackstone's *Commentaries on the Laws of England*, 1765). The critic's objection is a classic philosophical challenge: if the principle is absolute, it implies we should have no criminal justice system at all, since all human systems carry some risk of error.

  To resolve your confusion, we need to separate the *rhetorical slogan* from the *underlying philosophical mechanisms*. Below is a breakdown of the precise theses the ratio could be expressing, evaluated for plausibility and whether they support the anti-death-penalty (DP) conclusion specifically.

  ### 1. The Evidentiary Threshold Thesis
  *   **The Claim:** This is a procedural rule for juries. It dictates that the "Burden of Proof" (Beyond a Reasonable Doubt) should be set high enough that, statistically, we would rather acquit ten guilty people than convict one innocent one.
  *   **Plausibility:** **High.** This is the standard legal interpretation. It acknowledges that errors are inevitable but sets a high bar to minimize false positives.
  *   **Does it support the Anti-DP conclusion specifically?** **No.** This applies equally to shoplifting and murder. If the standard of proof is the same for all crimes, this thesis does not distinguish death from imprisonment. To make this work for your friend, she would have to argue that the "Beyond a Reasonable Doubt" standard *cannot be met* in capital cases due to the stakes, effectively requiring a higher threshold (e.g., "no doubt whatsoever") for DP than for prison.

  ### 2. The Variable Harm (Utilitarian) Thesis
  *   **The Claim:** This is an expected-harm comparison. It argues that the moral "cost" of punishing an innocent person is not a fixed number; it scales with the severity of the punishment.
      *   *Formula:* $1 \times \text{Harm(Innocent)} > 10 \times \text{Harm(Guilty Escape)}$.
      *   If Punishment = Death, Harm(Innocent) is infinite/absolute.
      *   If Punishment = Prison, Harm(Innocent) is finite (and potentially compensatable).
  *   **Plausibility:** **Moderate to High.** It aligns with common moral intuition that killing is worse than imprisoning.
  *   **Does it support the Anti-DP conclusion specifically?** **Yes.** This is your friend's strongest defense against the critic. It avoids "proving too much" by acknowledging that wrongful imprisonment is bad (and we try to minimize it), but wrongful *execution* is categorically worse because it is irreversible and total. The ratio applies with "special force" because the variable on the left side of the equation (Harm to Innocent) is maximized.

  ### 3. The Deontological Constraint Thesis
  *   **The Claim:** This is a rights-based constraint. The state is morally forbidden from intentionally inflicting severe harm on the innocent, regardless of the social benefit of catching criminals. It treats the innocent person as an end in themselves, not a means to public safety.
  *   **Plausibility:** **High (Philosophically), Low (Practically).** Pure deontology suggests we should never risk innocent harm. However, since all state action (police patrols, speed limits) carries some risk of accidental harm to innocents, a strict interpretation leads to anarchism (proving too much).
  *   **Does it support the Anti-DP conclusion specifically?** **Maybe.** If the constraint is "Do not kill innocents," it bans DP but allows prison. If the constraint is "Do not risk harming innocents," it bans all punishment. Your friend must argue that DP involves a *deliberate* killing that carries a known risk of error, whereas imprisonment involves a *risk* of harm that is not the primary intent. This is a fine line, but it allows for distinguishing DP from other penalties.

  ### 4. The Institutional Legitimacy Thesis
  *   **The Claim:** This is a sociological claim. The moral authority of the legal system relies on public trust. Executing an innocent person destroys public trust disproportionately more than letting a guilty person go free or even imprisoning an innocent person (who can be released and compensated).
  *   **Plausibility:** **Moderate.** Historical data shows exoneration scandals damage trust, but it is hard to quantify if it damages it "ten times" more.
  *   **Does it support the Anti-DP conclusion specifically?** **Yes.** Because execution is irreversible, the scandal is permanent. A wrongful imprisonment can be remedied (release + compensation), allowing the system to repair the breach of trust. A wrongful execution offers no remedy, permanently staining the system's legitimacy. This supports abolishing DP without abolishing the system itself.

  ### 5. The Asymmetry of Error Types Thesis
  *   **The Claim:** This focuses on the nature of the mistake. A "False Negative" (letting a guilty person go) is a failure of *efficiency*. A "False Positive" (punishing an innocent) is a failure of *justice*. The ratio claims failures of justice are more tolerable than failures of rights.
  *   **Plausibility:** **High.** It captures the liberal democratic priority of protecting liberty over ensuring security.
  *   **Does it support the Anti-DP conclusion specifically?** **Weakly.** This argues for a robust defense system in general. It only supports the anti-DP conclusion if one accepts that the *type* of rights violation in DP (right to life) is asymmetrical to the rights violation in prison (right to liberty). If life and liberty are on the same continuum, this thesis proves too much.

  ***

  ### Does the number "Ten" do any work?

  **Short Answer:** No, it is rhetorical, not mathematical.

  *   **Rhetorical Function:** The number ten is a placeholder for "significantly more than one." It creates a memorable heuristic. Blackstone could have said "twenty" or "five"; the philosophical logic remains the same.
  *   **If it were "Two":** The system would be more aggressive. We would accept a higher risk of convicting innocents to ensure guilty people are caught. (This aligns with authoritarian or "tough on crime" models).
  *   **If it were "One Hundred":** The system would be hyper-cautious. Many guilty people would go free to ensure near-perfect safety for the innocent.
  *   **Impact on the Argument:** Changing the number does not change the *structure* of your friend's argument. However, if the number is treated as a literal statistical cap, the critic is right: no human system can guarantee a 10:1 error ratio with certainty.
  *   **Best Interpretation:** Treat "ten" as a symbol for **lexical priority**. It means the protection of the innocent *trumps* the punishment of the guilty, not that we should literally count errors.

  ### Summary: How to Resolve the Debate

  The critic is correct that if Blackstone's Ratio is interpreted as a **fixed rule against *any* risk to the innocent**, it proves too much (it abolishes all punishment).

  However, your friend's argument survives if she shifts the interpretation to the **Variable Harm Thesis (#2)**.
  1.  **Concede:** Yes, all punishment risks harming the innocent. We accept this risk for imprisonment because it is reversible and compensatable.
  2.  **Assert:** The "Suffering" in Blackstone's Ratio is not constant. For imprisonment, $1 \text{ Innocent} < 10 \text{ Guilty Free}$ (sometimes). For execution, $1 \text{ Innocent} > 10 \text{ Guilty Free}$ (always), because the harm is infinite.
  3.  **Conclusion:** The ratio doesn't ban punishment; it bans *irreversible* punishment in a fallible system.

  This allows her to keep the moral weight of the quote without falling into the trap of arguing for the abolition of all criminal justice.
