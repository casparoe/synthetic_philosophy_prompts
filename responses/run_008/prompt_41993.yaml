answer: |-
  ### Brainstorming and Preliminary Considerations

  Before committing to a verdict, we must disentangle the distinct normative claims at play in the "luck-neutralizing statute." The debate hinges on three intersecting axes: the metaphysics of responsibility, the function of criminal punishment, and the logic of the "suspiciously easy" defense.

  **1. The Control Principle vs. The Intuition of Harm**
  *   **For the Statute (Nagel/Kantian):** The "Control Principle" holds that we are only responsible for what is within our control. Since the survival of the victim is outside the shooter's control (resultant luck), two identical shooters possess identical moral worth. Differential punishment punishes luck, not agency.
  *   **Against the Statute (Williams/Folk Intuition):** The world is altered by death in a way it is not by mere attempt. The victim's family suffers a loss that cannot be equated with fear. Punishment serves not only to censure the agent but to acknowledge the violation done to the victim. Ignoring the outcome insults the reality of the harm.

  **2. The "Suspiciously Easy" Defense**
  *   **The Claim:** The prompt suggests parity is defensible whether luck is real or not.
      *   *If luck affects blameworthiness:* The prompt claims parity is consistent. (This is logically suspect; if luck increases blameworthiness, parity under-punishes the killer.)
      *   *If luck does not affect blameworthiness:* Parity is consistent (both are equally blameworthy).
  *   **The Flaw:** This argument equivocates on "blameworthiness." It assumes a univocal metric of responsibility. If luck *does* matter, parity is unjust. If luck *does not* matter, parity *might* still be unjust if punishment tracks harm rather than just character. The defense tries to have it both ways by obscuring the *grounds* of punishment.

  **3. Blame vs. Liability**
  *   **Blame (Assessment of Agent):** Internal, focused on will, intention, and character. Luck should ideally not matter here.
  *   **Liability (Allocation of Sanction):** External, focused on social repair, deterrence, and the normative order. Outcomes matter here because they change the debt owed to the community/victim.

  **Verdict Strategy:** I will argue that resultant moral luck is **not genuine** regarding the moral worth of the agent (siding with Nagel), but that the statute is nevertheless **philosophically undefensible** because it conflates agent-assessment with liability-allocation. The "suspiciously easy" defense fails because it ignores the independent normative significance of harm.

  ***

  ### Essay: The Illusion of Luck and the Reality of Harm

  **To:** Graduate Seminar on Moral Responsibility
  **From:** [Philosopher's Name]
  **Re:** The Philosophical Defensibility of the Luck-Neutralizing Statute

  The proposal to equalize sentencing for attempted and completed murder is a provocative test case for the literature on moral luck. It forces us to move from abstract taxonomy (Nagel's categories) to institutional design. While the statute's proponents rely on the intuitive force of the Control Principle, I argue that the statute is philosophically undefensible on the proposed rationale. Furthermore, regarding the broader metaphysical question: resultant moral luck is **not genuine** with respect to the moral worth of the agent, but this conclusion does not entail the legal parity the statute demands. The "suspiciously easy" defense offered in your discussion relies on a category error between *blame* and *liability*.

  #### I. The Genuineness of Resultant Moral Luck

  We must first settle the metaphysical premise. Is resultant moral luck genuine? By "genuine," I mean: does the actual outcome of an action retroactively alter the *moral worth* of the agent who performed it?

  Here, I side with Thomas Nagel's skepticism, though I flag this as a contested reading. Some interpreters argue Williams ultimately accepts luck as constitutive of ethical life in a way that validates differential assessment. However, reading Nagel charitably, the argument from the Control Principle is decisive. If Agent A and Agent B both form the intent to kill, both procure a gun, and both fire at a victim with equal malice and precision, the only difference between A (whose victim dies) and B (whose victim lives due to a random deflection) is a feature of the world external to their agency.

  To claim A is *more vicious* or *more blameworthy* than B simply because a breeze moved a bullet is to surrender the notion of agency to causality. If moral worth is a property of the will, and the will was identical in both cases, the moral worth must be identical. Therefore, **resultant moral luck is not genuine regarding the assessment of the agent's character.** The "luck" is real in the world, but it does not attach to the *moral self*.

  This is the premise I am most confident in. It preserves the integrity of the moral subject against the chaos of external events. However, this is where the proponents of the statute make their fatal leap. They assume that because the *agent's worth* is identical, the *state's response* must be identical. This ignores the second object of moral assessment: the harm done.

  #### II. The Category Error: Blame vs. Liability

  The statute's rationale is that the state should not let chance determine severity. This assumes the sole function of sentencing is to mirror the internal blameworthiness of the offender. This is a reductive view of criminal liability.

  Criminal law is not merely a mechanism for grading souls; it is a system for managing normative violations within a community. When a murderer succeeds, they do not just manifest a bad will; they effectuate a **normative rupture** that an attempter does not. A death creates a specific debt to the victim's community and family that a non-death does not. This is not about luck; it is about the *object* of the wrongdoing.

  Consider the distinction between *evaluative judgment* (How bad is this person?) and *allocative judgment* (What does this person owe?).
  1.  **Evaluative:** As established, the attempter and the killer are equally wicked.
  2.  **Allocative:** The killer has destroyed a life. The attempter has endangered one.

  The "luck-neutralizing statute" attempts to solve a problem of *evaluation* (luck shouldn't change how we see the agent) by altering *allocation* (sentencing). This is a category error. We can maintain that the two shooters are equally *blameworthy* (Nagel's view) while insisting they are not equally *liable*. Liability tracks the damage to the normative order. To punish them equally is to declare that the death of the victim is morally irrelevant to the state's response. This validates the "suspiciously easy" argument's flaw: it assumes that if luck doesn't change the *agent*, it shouldn't change the *sentence*. But sentences respond to the *world* the agent altered, not just the *mind* they possessed.

  #### III. Dismantling the "Suspiciously Easy" Defense

  The objection you raised in seminar—that the statute is defensible whether luck is real or not—requires careful dismantling. The argument posits:
  *   (A) If luck affects blameworthiness, parity is consistent.
  *   (B) If luck does not affect blameworthiness, parity is consistent.

  Premise (A) is logically incoherent. If resultant luck *genuinely affects* blameworthiness (the Williams/Intuition view), then the killer *is* more blameworthy than the attempter. If the killer is more blameworthy, sentencing parity is *inconsistent* with justice, as it under-punishes the more blameworthy agent. The only way (A) works is if one conflates "luck affects blameworthiness" with "the law should ignore luck." But if luck genuinely makes one more blameworthy, the law *should* reflect that.

  Premise (B) is more plausible (if luck doesn't matter, they are equally blameworthy), but it fails for the reasons in Section II. Even if they are equally blameworthy, they are not equally *harmful*. If the function of punishment includes reparative justice or acknowledging the victim's status, parity is unjust because it treats a corpse and a living person as equivalent objects of legal concern.

  Thus, the "suspiciously easy" defense collapses. It relies on an equivocation between the *source* of responsibility (the will) and the *scope* of responsibility (the consequences). The statute is not robust across metaphysical views; it is fragile, relying on a specific, contested theory of punishment that ignores the victim.

  #### IV. Conclusion and Verdict

  My verdict is twofold:

  1.  **On Moral Luck:** Resultant moral luck is **not genuine** regarding the moral worth of the agent. We must resist the intuition that the successful killer is a worse *person* than the failed attempter, assuming identical intent and carelessness. To concede this is to allow the external world to dictate the value of the human will.
  2.  **On the Statute:** The luck-neutralizing statute is **philosophically undefensible**. While it correctly identifies that the *agents* are equally blameworthy, it incorrectly infers that they should be equally punished. Punishment is not a pure mirror of character; it is a response to harm. By neutralizing the sentence, the statute does not eliminate luck; it merely blinds the law to the reality of the victim's loss.

  The most defensible position is a hybrid: We should acknowledge in our *moral discourse* that the two drivers are equally reckless and equally vicious (denying resultant luck regarding character), but we should maintain in our *legal practice* that causing death warrants heavier sanctions than risking death (accepting outcome-responsibility regarding liability).

  The premise doing the most work here is the distinction between **agent-assessment** and **liability-allocation**. If you accept this distinction, the tension dissolves. We can satisfy the Control Principle (by not calling the killer a worse person) without satisfying the Statute (by punishing the killer more heavily). The statute fails because it tries to solve a metaphysical problem (luck) with a blunt legal instrument (sentencing parity), thereby sacrificing the normative significance of harm on the altar of control.

  Do not be seduced by the elegance of the "suspiciously easy" argument. It offers consistency only by ignoring the distinct duties the law owes to the living and the dead.
