      *Decision:* The strongest move is to reject the inference in (4) by redefining the normative significance of "luck" in (1). Luck Egalitarianism is not about *eliminating* all causal luck, but *neutralizing* unchosen disadvantages. The "choice" mechanism is a normative cutoff, not a metaphysical one.

