      *   *Option 3 (The Pragmatic Cut-off):* Reject (4). *Cost:* Arbitrariness.
      *   *Option 4 (The Criminal Law Distinction):* Reject (6). *Cost:* Theoretical fragmentation.
      *   *Option 5 (Surrender):* Accept (5). *Cost:* LE ceases to exist as a distinct view.

      *   *Focus on the User's preference:* They want to deny (7) (Relational turn) without accepting (5) (Collapse). This means they must defend the Luck/Choice distinction without Ultimate Responsibility.
      *   *Solution:* The "Political, not Metaphysical" move (Rawlsian flavor applied to LE). The distinction is normative, not causal. We *treat* people as responsible for X because it serves justice, not because X is metaphysically uncaused.
      *   *Addressing (6):* Criminal law is about blame/punishment (requires stronger agency). Distributive justice is about burden allocation (requires weaker agency/fairness).

  7.  **Refining the "Price" for each:**
      *   Make sure the "price" is clear. E.g., if you reject (2), you lose the "deep desert" claim. If you reject (6), you look inconsistent.
