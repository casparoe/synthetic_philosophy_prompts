answer: |-
  ### Exam Question (25 Marks)

  **Context:**
  In Hofstadter's **Platonia Dilemma**, 20 players must independently decide whether to send a telegram. If exactly one telegram arrives, that sender wins \$1 billion. If zero or >1 arrive, everyone gets \$0. Players cannot communicate.
  In the **Luring Lottery**, players submit a postcard with a positive integer $n$ (representing $n$ entries). One winner is drawn proportional to entries. The prize pool is \$1 million divided by the *total* number of entries submitted by all players.

  **Answer the following:**

  1.  **Strategy & Equilibrium (10 marks):** Show the derivation for why a superrational agent sends a telegram with probability $p=1/20$ in Platonia. Explain why this is not a Nash Equilibrium and contrast it with the recommendation of Causal Decision Theory (CDT).
  2.  **Philosophical Mechanism (10 marks):** Identify the specific assumption superrationality makes about the relationship between your deliberation and others'. Is this assumption identical to One-Boxing in Newcomb's Problem? Is it identical to Kantian Universalizability? Distinguish these clearly.
  3.  **Empirical Assessment (5 marks):** In the actual Luring Lottery, readers submitted astronomical numbers, destroying the prize value. Does this outcome refute superrationality? Discuss the falsifiability of the theory given this result.

  ***

  ### Model Answer (Approx. 600 words)

  **1. Strategy & Equilibrium**
  In Platonia, assume all $N=20$ players adopt the same probability $p$ of sending. The probability of winning is the probability that *I* send ($p$) AND the other $N-1$ do not ($(1-p)^{N-1}$). Expected utility is maximized by maximizing $f(p) = p(1-p)^{19}$. Taking the derivative $f'(p) = (1-p)^{19} - 19p(1-p)^{18}$ and setting to zero yields $1-p = 19p$, so $20p=1$, or $p=1/20$.

  This is not a Nash Equilibrium. In a Nash Equilibrium, I treat others' strategies as fixed. If others play $p=1/20$, the probability they all stay silent is $(19/20)^{19} \approx 0.38$. Since the prize is huge, my best response is to send with $p=1$. If everyone reasons this way, $p \to 1$, and the expected payoff collapses to zero. Causal Decision Theory (CDT) mandates this Nash reasoning: my action cannot *cause* others to change their independent choices, so I should grab the positive expected value available given their fixed probabilities. Superrationality rejects the independence assumption.

  **2. Philosophical Mechanism**
  Superrationality assumes **logical correlation**: because we are identical rational agents facing identical data, our outputs must be identical. My deliberation is not merely evidence of yours (as in standard statistics); it is *logically entangled* with yours.

  *   **Newcomb's Problem:** This is **contested**. Many decision theorists argue superrationality is simply Evidential Decision Theory (EDT) applied to symmetric games (One-Boxing relies on the correlation between choice and prediction). However, Hofstadter argued for a stronger "logical causality" distinct from statistical evidence. **Settled:** Both reject CDT's independence axiom. **Contested:** Whether superrationality requires a distinct metaphysics of logic or is just EDT.
  *   **Kantian Universalizability:** There is a structural similarity (act only on maxims you can will to be universal law). However, Kant's is a moral deontological constraint, whereas superrationality is an instrumental claim about maximizing utility. **Settled:** They are not identical; one is moral, one is prudential. **Contested:** Whether rationality itself entails a form of contractualism that bridges this gap.

  **3. Empirical Assessment**
  The Luring Lottery outcome does not refute superrationality; it refutes the premise that magazine readers are superrational agents. Superrationality is a normative theory of *ideal* rationality, not a descriptive theory of human psychology. If agents fail to recognize the logical correlation (treating the game as CDT dictates), the superrational strategy fails.

  This raises a falsifiability problem. If the theory predicts "Rational agents do X" and humans do Y, the theorist can always claim "Humans are irrational." **Settled:** The experiment tested human behavior, not the mathematical consistency of the theory. **Contested:** Whether a theory of rationality that cannot be empirically distinguished from "idealization" has practical content. If no actual population ever satisfies the "identical reasoner" condition, the theory may be vacuous.

  ***

  ### Marking Scheme

  | Section | Marks | Must-Hit Points | Common Pitfall | Status Flag |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. Strategy** | 10 | • Correct maximization of $p(1-p)^{19}$ to get $1/20$. (4)<br>• Explanation that NE treats others as fixed parameters. (3)<br>• CDT recommendation: Send ($p=1$) because action doesn't cause others' change. (3) | • Confusing $1/20$ with a mixed NE (Symmetric NE is $p=1$).<br>• Saying CDT recommends $1/20$ because it's "safer." | **Settled:** The math and CDT definition are standard game theory. |
  | **2. Mechanism** | 10 | • Identification of "logical correlation" or "identical reasoning." (3)<br>• **Newcomb:** Distinguish EDT correlation vs. Hofstadter's logical causality. (3)<br>• **Kant:** Distinguish prudential utility vs. moral duty. (4) | • Claiming Superrationality *is* Kantianism.<br>• Claiming Newcomb/Superrationality are exactly the same without nuance. | **Contested:** Equivalence to EDT is debated (e.g., Joyce vs. Ahmed).<br>**Settled:** Kant is deontological, Superrationality is consequentialist. |
  | **3. Empirical** | 5 | • Argument that failure was due to agent irrationality, not theory error. (2)<br>• Identification of the "no true Scotsman" / falsifiability risk. (3) | • Claiming the lottery proved superrationality false.<br>• Ignoring the normative/descriptive distinction. | **Settled:** Normative theories aren't falsified by descriptive failure.<br>**Contested:** Whether this makes the theory vacuous. |

  **Instructor Note on Contention:**
  In Part 2, award full marks if students acknowledge the debate. If a student asserts "Superrationality IS EDT" as an uncontested fact, deduct 1 mark for lack of nuance, as prominent decision theorists (e.g., David Lewis vs. Hilary Greaves) distinguish logical dependence from evidential correlation. In Part 3, students must recognize that normative theories (like CDT or Superrationality) are not falsified by humans failing to follow them, but should note the risk of the theory becoming unfalsifiable.
