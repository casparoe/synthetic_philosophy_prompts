prompt: |-
  My friend has this whole thing about "collapse" — she's read a bunch of the Jared Diamond-ish stuff plus the pushback, and over the years she's accumulated actual verdicts, mostly ancient world. Her rulings so far: the late Bronze Age eastern Med around 1200 BC was a genuine collapse — palaces burned, Ugarit just gone, trade networks dead, writing lost for centuries. The Classic Maya southern lowlands: NOT collapse, just change — she says the cities emptied out but the people moved north and kept doing Maya things, so calling it a collapse is basically colonial nostalgia. Easter Island: definately collapse, the moai, the forests, the chiefdom, the whole thing coming down together. The Harappan/Indus situation after 1900 BC: change — cities emptied but people just dispersed into villages, no die-off, no violence (she admits this is the one she's least sure about). And the Old Kingdom Egypt wobble into the First Intermediate Period: change, because the state re-formed within a century or so with the same script, same gods, basically the same people.

  Next month she's actually visiting Angkor, and Cahokia came up in our book club, so now I want predictions. What will she say about Angkor — the court leaving in the 1400s, the city draining out over decades, the kings continuing elsewhere but nobody ever building anything like the temple-cities again? What about Cahokia, where everything just stops around 1350, no successor polity on the site, but no destruction layer or famine evidence at the end either? And Chaco Canyon, where the great houses empty out but the Pueblo peoples are obviously still here?

  Honestly I care less about the predictions than about (a) what rule she's actually running, (b) what other rules would fit her track record just as well, and (c) which further case would really split those rules apart. She talks alot about whether a society "gets its thing back," but she also talks a lot about whether the ending was violent/catastrophic versus people just gradually relocating — and I genuinely can't tell if those are the same rule in her head or two rules she's been lucky to never have to choose between. Like, do her existing verdicts already strain one of them? The Maya one feels like it's doing a lot of work for her.

  And if you can think of a case — real or hypothetical — where her candidate rules give opposite verdicts and she can't dodge, name it and tell me what each rule says about it. That's the part I actually want to nail her down on over dinner.
