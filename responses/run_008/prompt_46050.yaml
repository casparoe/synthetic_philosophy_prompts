answer: |-
  Here is the breakdown of your friend's framework, the predictions for her upcoming trips, and the specific case that will force her to choose between her conflicting criteria.

  ### 1. The Predictions
  Based on her track record, here is how she will likely rule on the new cases. Note that **Angkor** is the only one where she might hesitate.

  *   **Angkor (1400s): VERDICT: CHANGE.**
      *   **Why:** This is the closest parallel to her **Classic Maya** ruling. The court moved (to Phnom Penh/Ayutthaya), the population dispersed, and the religion shifted (from Devaraja Hinduism/Buddhism to Theravada), but the Khmer people and polity continued.
      *   **The Trap:** She might stumble here if she focuses on the *loss of complexity*. She ruled LBA a "collapse" partly because writing was lost. At Angkor, the massive temple-building machine stopped forever. If her rule is "Did they stop doing the hard stuff?" it's a collapse. If her rule is "Did the people survive and keep a kingdom?" it's a change. Given the Maya precedent, she will likely prioritize the survival of the people/kingdom over the loss of the specific monument-building technology.
  *   **Cahokia (1350): VERDICT: CHANGE.**
      *   **Why:** This mirrors her **Harappan** ruling. The urban center emptied, but there is no evidence of a massacre or famine. The people didn't vanish; they dispersed into smaller Mississippian groups (ancestors of Quapaw, Chickasaw, etc.). No "destruction layer" means no "collapse" in her book.
  *   **Chaco Canyon (1100s): VERDICT: CHANGE.**
      *   **Why:** This is the easiest call for her. It is essentially the **Maya** ruling on a smaller scale. The great houses were abandoned, but the Pueblo peoples are explicitly still there, maintaining oral histories and religious continuity connecting back to Chaco. To call this a "collapse" would contradict her Maya verdict directly.

  ### 2. The Rules She Is Running
  You are correct that she is conflating two different criteria. Her existing verdicts work because, historically, *violent endings often lead to discontinuity*, and *gradual endings often allow for continuity*. She hasn't had to separate them yet.

  *   **Rule A: The "Phoenix" Criterion (Continuity)**
      *   *Definition:* A society only "collapses" if its specific cultural/political identity is extinguished or fundamentally broken for a long period. If the state re-forms, the script remains, or the people migrate and keep their culture, it is merely "Change."
      *   *Evidence:* This drives her **Maya** (people moved north), **Harappan** (dispersed to villages), and **Old Kingdom** (state re-formed) verdicts.
      *   *Implication:* True "Collapse" is incredibly rare. It essentially requires cultural genocide (like LBA writing loss) or total ecological/cultural suicide (Easter Island).

  *   **Rule B: The "Fire and Blood" Criterion (Catastrophe)**
      *   *Definition:* A society "collapses" if the ending is marked by violence, sudden destruction, burning, or mass die-off. If the end is gradual, adaptive, or peaceful, it is "Change."
      *   *Evidence:* This drives her **LBA** (palaces burned), **Easter Island** (forests/chiefdom came down together), and **Harappan** (no violence = change) verdicts.
      *   *Implication:* A society can "collapse" even if the people survive, provided the end was traumatic enough.

  **The Tension:** The **Maya** verdict is indeed doing the heavy lifting. It proves she prioritizes **Rule A (Continuity)** over urbanism. She accepts that cities can vanish without it being a collapse. However, her **Easter Island** verdict shows she prioritizes **Rule B (Catastrophe)** over mere population survival (people survived on Easter Island, but she calls it a collapse because the *system* died violently/ecocidally).

  ### 3. The Killer Case: The Western Zhou (771 BC)
  To nail her down at dinner, you need a case where the **Ending is Violent (Rule B = Collapse)** but the **Continuity is High (Rule A = Change).**

  **The Case:** The End of the Western Zhou Dynasty in China.
  *   **The Event:** In 771 BC, the Quanrong nomads sacked the Zhou capital at Haojing. They **burned the palaces** and **killed the King** (King You).
  *   **The Aftermath:** The Zhou nobility fled east, established a new capital (Luoyang), and the dynasty **continued for another 500 years** (the Eastern Zhou). The script, the rituals, the gods, and the ruling lineage remained intact.

  **How the Rules Split:**
  *   **If she follows Rule A (Phoenix/Continuity):** She must rule this **CHANGE**. The state re-formed within a year, the same kings ruled, the same script was used. It fits her **Old Kingdom Egypt** verdict perfectly (state wobble, then re-formation).
  *   **If she follows Rule B (Fire and Blood):** She must rule this **COLLAPSE**. The capital was burned, the King was executed, and the sack was violent and sudden. It fits her **Late Bronze Age** verdict perfectly (palaces burned, sudden break).

  **Why she can't dodge:**
  *   She can't say "But the people survived," because she said that about the Maya (Change) *and* Easter Island (Collapse).
  *   She can't say "But the cities emptied," because she said that about the Maya (Change).
  *   She can't say "But there was violence," because she used violence to define LBA (Collapse).
  *   She is forced to admit whether "Collapse" is about the **death of the system** (Zhou survived = Change) or the **trauma of the event** (King killed/Capital burned = Collapse).

  ### 4. Alternative "Killer" Case: The Black Death (Europe, 1347)
  If she wants to move away from ancient politics to demographics:
  *   **Rule A (Continuity):** **CHANGE.** The Church, the Monarchies, the Feudal System, and the Script all survived and rebounded quickly. (Matches Old Kingdom Egypt).
  *   **Rule B (Catastrophe):** **COLLAPSE.** 30–50% of the population died. Villages were abandoned. Social order temporarily disintegrated. (Matches Easter Island die-off).

  **Recommendation:** Stick with the **Western Zhou**. It fits her "Ancient World" wheelhouse better than Medieval Europe, and it directly tests her definition of "State Re-formation" vs. "Palace Burning." If she calls Western Zhou a "Change," she admits that violence doesn't equal collapse. If she calls it a "Collapse," she admits that cultural continuity doesn't save you. Either way, her current framework cracks.
