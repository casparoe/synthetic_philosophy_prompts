answer: |-
  This is a sharp, engaging draft. You've correctly identified the pivot point where the literature gets interesting (shifting from decision theory to philosophy of action/intention).

  Here is feedback structured around your specific concerns, plus a few accuracy notes.

  ### 1. The Central Argument: Is the "Expectation" Assumption Load-Bearing?

  **Short answer:** Yes, it is extremely load-bearing. You have flagged this correctly.

  **The Issue:** Your argument rests on the claim that intending $p$ while expecting $\neg p$ is Moore-paradoxical ("I intend to drink, but I know I won't"). In the literature, this is the divide between **Michael Bratman** (Planning Theory) and **J. David Velleman** (Belief-Based Theory).
  *   **Bratman** argues you *do not* need to believe you will succeed to intend. You only need to believe it is *possible*. (Example: I intend to finish the marathon, though I know there's a 10% chance I'll cramp up.)
  *   **Velleman** (and later Kieran Setiya) argues closer to your position: intention involves a belief-like commitment that tends to be self-fulfilling.

  **Why it matters for your draft:** If Bratman is right, your central argument collapses. A Bratmanian agent can say, "I intend to drink tonight to get the money. I know tomorrow I won't have a reason to drink. But tonight, my intention is simply a planning state that doesn't require a belief in success."

  **Recommendation:** You don't need to solve the Bratman/Velleman debate, but you must acknowledge it. Your argument works best if you frame the Toxin case as a *limit case* for Bratman.
  *   *Revision idea:* Argue that while Bratman is right about *risky* intentions (marathon), Toxin is different because the agent knows their *future rationality* will undermine the act. It's not just that you might fail; it's that you know your future self will *rationally abandon* the plan. This makes the "expectation of failure" internal to the deliberation, not just an external obstacle. This strengthens your claim that the intention is self-undermining specifically because of the *transparency to future deliberation* point you made.

  ### 2. The Ending: Does it Undercut Itself?

  **Short answer:** Your friend is right. The ending currently undercuts the middle.

  **The Tension:**
  *   **Middle:** You argue the impossibility is *conceptual* (Moore-paradoxical, self-refuting performance). It's like trying to lie to yourself; the structure of the attitude forbids it.
  *   **Ending:** You suggest it's a *skill* or a trait of "constrained maximizers." This implies the impossibility is merely *psychological* or *contingent*.

  If the attitude is truly self-refuting (like asserting "I am not speaking"), no amount of training allows you to do it. By suggesting Gauthier-style agents can "solve" it, you imply the barrier isn't conceptual, which weakens your claim that the puzzle reveals something essential about the *nature* of intention.

  **Furthermore:** Kavka specifically designed the puzzle to rule out Gauthier-style binding. The billionaire pays on *intention*, not on *disposition*. If a "constrained maximizer" drinks the toxin, they didn't necessarily *intend* to drink it at midnight in the way required; they just have a disposition that causes them to drink. Many critics argue Gauthier changes the subject from "intention" to "dispositional rationality."

  **Recommendation:**
  *   **Option A (Cut):** End on the strong conceptual point. The lesson is that rational agency has limits; we cannot intend what we know we will not do. This is a feature, not a bug, of being a transparent agent.
  *   **Option B (Reframe):** If you want to keep the "skill" angle, pivot to **Resolute Choice** (Edward McClennen) rather than Gauthier. Argue that the puzzle shows standard decision theory assumes "sophisticated choice" (updating preferences constantly), but rational agency *requires* the capacity for resolute choice (sticking to plans without re-deliberating). However, be careful: this risks turning the paper into a decision theory paper, which you said you wanted to avoid.
  *   **My Vote:** Cut the Gauthier/skill bit. It dilutes the original insight. The most philosophically potent point you have is the **Moore-paradoxical nature of intention**. Stick there. The "lesson" is that intention is a truth-aiming attitude in a way that makes Toxin impossible for transparent agents.

  ### 3. Accuracy Nitpicks

  *   **"Newcomb Cousin":** Be careful here. Kavka explicitly distinguished Toxin from Newcomb. In Newcomb, the predictor looks at your *disposition* to one-box. In Toxin, the scanner looks at your *current intention*. The puzzle isn't about prediction accuracy; it's about the agent's access to their own future rationality.
      *   *Fix:* Instead of "The standard reading treats this as a Newcomb cousin," try "The standard reading treats this as a problem for decision theory (like Newcomb), asking which theory gets the money."
  *   **"Gauthier-style constrained maximizers... would receive the million":** This is contentious. Gauthier argues they *should* receive it because they are rational, but many argue Gauthier fails to show how they form the *intention* without binding mechanisms.
      *   *Fix:* Qualify this. "Gauthier argues that constrained maximizers..." rather than stating it as fact.
  *   **"Moore-paradoxical... isn't an intention plus a prediction":** This is good, but ensure you distinguish between *belief* and *expectation*. Velleman argues intention *is* a belief. You seem to argue intention *requires* an expectation. Slight difference, but worth tightening.

  ### 4. Summary of Suggested Revisions

  1.  **Acknowledge the Bratman Objection:** In the middle section, add a sentence acknowledging that some philosophers (Bratman) think intention doesn't require belief. Counter this by emphasizing the *future deliberation* aspect. In Toxin, you don't just believe you might fail; you know your future *reasons* will vanish. That makes the intention unstable in a way a risky marathon intention is not.
  2.  **Clarify the Newcomb Comparison:** Shift focus from the billionaire as a predictor to the problem as one of *diachronic rationality*.
  3.  **Rethink the Ending:** The "skill" argument contradicts the "conceptual impossibility" argument. Either admit the impossibility is only psychological (which weakens the middle) or drop the skill claim. I recommend dropping it. End on the strength of the "transparency" point: The puzzle shows that we cannot treat our own future intentions as mere causal levers; we must view them as commitments to act.
  4.  **Tone Check:** The draft is very conversational ("wierd," "fishy," "honestly she might be right"). If this is for a blog or magazine, it's fine. If it's for an academic journal, you'll need to formalize the tone.

  **Verdict:** The core insight (Toxin is about the transparency of intention to future deliberation, not decision theory) is excellent and defensible. The ending is the weak link that threatens to turn a conceptual insight into a self-help tip. Cut the "skill" language, defend the "expectation" assumption against Bratman, and you have a solid piece.
