answer: |-
  Your hypothesis is remarkably astute, and it correctly identifies the source of the exhaustion your group is experiencing. You are not merely going in circles; you have arrived at the perimeter of the debate, where the path forward is blocked not by a lack of ingenuity but by the structural features of the positions themselves. The stalemate persists because the Telic Egalitarian and the Prioritarian are not, in fact, offering competing predictions about the world, but rather competing metaphysical descriptions of value that are insulated from empirical refutation.

  Here is a diagnosis of the structure of this disagreement, followed by an assessment of what might constitute progress.

  ### 1. The Substantive Core: The Supervenience of Value
  You ask whether the dispute is substantive. It is, but not at the level of practical reason or policy. It is substantive at the level of **axiological metaphysics**. Specifically, the disagreement concerns the *supervenience base* of evaluative facts.

  The Prioritarian operates with a commitment to **Individual Goodness Supervenience**: the value of an outcome is entirely determined by the welfare levels of the individuals within it, considered in isolation. On this view, a world is a collection of lives; to value the world is to sum (with weighting) the value of those lives. There is no 'extra' fact about the world once you have fixed the facts about each person's welfare.

  The Telic Egalitarian rejects this. They hold that **Relational Supervenience** is possible: there are evaluative facts about the *pattern* of distribution that do not reduce to the sum of individual values. For the Egalitarian, the gap between Person A and Person B is a fact about the world that carries evaluative weight, independent of whether closing that gap benefits A or B.

  When the Prioritarian deploys the Leveling-Down Objection (LDO), she is not merely pointing out a counter-intuitive result; she is invoking a hidden premise: *that all value must be value for someone.* She treats the Person-Affecting Restriction (PAR) as a constraint on rational axiology. The Egalitarian, however, treats the PAR as a substantive commitment that he is under no obligation to accept. Consequently, the LDO functions as a *reductio* only if one has already accepted the Prioritarian's metaphysics. To the Egalitarian, the LDO is not a refutation but a clarification: "Yes, equality is good in itself; yes, that implies leveling down is in one respect better; no, that does not imply we should do it."

  Therefore, the disagreement is not verbal. They are not using the word 'good' in different senses in a way that can be dissolved by stipulation. They are disagreeing about the fundamental architecture of value: is it atomistic (Prioritarian) or holistic/relational (Telic Egalitarian)?

  ### 2. Competitors or Complements?
  You suggest they may be answering different questions. This is the most promising avenue for dissolving the practical tension, though it leaves the theoretical clash intact.

  The Prioritarian view is often best understood as a theory of **right action** masquerading as a theory of **good outcomes**. It tells us how to weigh claims: a benefit to the worse off counts for more. It is a decision procedure. The Telic Egalitarian view is a theory of **outcome value**. It tells us how to rank states of affairs.

  If we distinguish sharply between the *Good* (the ranking of outcomes) and the *Right* (what we ought to do), the two views can coexist more peacefully, though they remain distinct.
  *   The Prioritarian can say: "I do not care about the pattern, only the weighted sum of benefits."
  *   The Egalitarian can say: "I care about the pattern, but I also care about benefits, and benefits outweigh pattern when they conflict."

  However, they remain competitors in one specific domain: **the explanation of our intuitions.** When you both agree that we should help the worse-off stranger, the Prioritarian says, "This is because her gain is weightier." The Egalitarian says, "This is because her gain reduces inequality *and* benefits her." If the Egalitarian cannot point to a case where the reduction of inequality matters *independently* of benefits (other than the Leveling-Down case, which they concede is not all-things-considered decisive), then the Egalitarian's relational value is doing no work in guiding action. It becomes an 'idle wheel' in the machinery of practical reason.

  This is where the dispute tightens. If the Egalitarian admits that relational value never overrides individual benefit in practical decision-making, the Prioritarian will argue that the relational value is otiose. The Egalitarian will retort that the universe contains truths that do not necessarily dictate action. This returns you to the metaphysical stalemate.

  ### 3. What Would Count as Progress?
  Given this diagnosis, standard argumentative moves will not work. Constructing new cases will fail because you have agreed on all concrete cases. Deploying the LDO will fail because it begs the question against the relational view.

  Progress could only be made in one of three ways:

  **A. The 'Reasons' Challenge (The strongest move for the Prioritarian)**
  The Prioritarian should press the link between *value* and *reasons*. If a fact is evaluatively significant (e.g., "inequality is bad"), does it not provide a reason for action? If leveling down is "in one respect better," does that not provide a pro tanto reason to level down? If the Egalitarian says "No, it provides no reason," the Prioritarian can argue that 'value' has been severed from 'reasons' to the point of meaninglessness. If the Egalitarian says "Yes, it provides a reason," they must explain why we are rationally permitted to ignore it. Forcing the Egalitarian to clarify the normative force of their 'in one respect better' claim might expose a tension between their axiology and their theory of rational action.

  **B. The 'Risk' Argument (The strongest move for the Egalitarian)**
  The debate often shifts when moved from outcomes to risk. Prioritarianism and Egalitarianism diverge in cases of uncertainty. There are formal results (notably by Alex Voorhoeve and others) suggesting that Prioritarianism, when applied to choices under risk, may violate plausible principles of rational choice (like the 'Ex Ante Pareto' principle) in ways that Egalitarianism does not, or vice versa. If your group can shift the debate from *outcomes* to *choices under risk*, you may find a formal result that forces one side to abandon a core commitment. This moves the dispute from metaphysics to decision theory, where formal constraints are tighter.

  **C. Acceptance of Bedrock (The Wittgensteinian move)**
  It is highly probable that this is a 'bedrock' disagreement. In the Wittgensteinian sense, you have reached the point where "my spade is turned." The Prioritarian finds the idea of value without a beneficiary unintelligible; the Egalitarian finds the idea that relations lack value implausible. These are foundational intuitions about the shape of the normative universe.
  If this is the case, progress consists not in refutation, but in **mapping the cost**. The group should stop trying to prove the other wrong and start cataloguing what each must sacrifice to maintain their view.
  *   The Prioritarian must accept that her view is vulnerable to the 'Utility Monster' style objections if weights are not carefully constrained, and that she cannot explain the intuitive badness of certain inequalities that involve no loss of utility.
  *   The Egalitarian must accept that his view posits 'free-floating' value that lacks a clear connection to human reasons for action.

  ### Conclusion
  Your working hypothesis is correct: the dispute is primarily about whether there can be irreducibly relational evaluative facts. The Leveling-Down Objection is indeed a person-affecting intuition masquerading as a logical refutation.

  Do not expect a argument to force one side to move. The disagreement is not about the data (the cases) but about the theory of the data (the supervenience of value). The most productive path forward is to acknowledge that Telic Egalitarianism and Prioritarianism are **axiological rivals but practical allies**. They compete to describe the moral landscape, but they guide the traveller in the same direction.

  If you wish to break the deadlock, I recommend abandoning the Leveling-Down case entirely. It is a cul-de-sac. Instead, examine **choices under risk** or the **connection between value and reasons**. If those avenues also close, you should conclude that you are facing a fundamental divergence in normative sensibility. At that point, the rational response is not to argue further, but to understand that you are looking at the same world through different categorical frameworks, neither of which can be proven superior without circularity. That is not a failure of your reading group; it is a feature of the subject matter.
