  This is a classic metaphysical puzzle disguised as a pub game. Your mate is navigating the **problem of dispositional properties**, specifically the debate between **Simple Counterfactual Analysis** (which she has already rejected via Case 4) and **Intrinsic Causal Base** theories (championed by philosophers like David Lewis).

  She is distinguishing between **Masks** (external things that stop the break) and **Finks** (things that remove the disposition itself upon stimulus).

  Here is the breakdown of the rules she is implicitly running, how they clash on the Lab Case, and what her verdict will commit her to.

  ### 1. The Candidate Rules

  Based on her six verdicts, two distinct philosophical rules fit the data, but they diverge on your Lab Case.

  **Rule A: The Intrinsic Base Rule (The Realist View)**
  *   **The Principle:** Fragility is a property of the object's *internal physical constitution* at the time *before* the strike. Extrinsic factors (things outside the object) can prevent the break, but they cannot remove the *disposition* itself.
  *   **Fits the Track Record:**
      *   Explains Case 4 (Cocoon): The glass is still glass inside; the foam is external. Verdict: **Fragile**.
      *   Explains Case 3 (Hex): The hex changes the glass's internal state *at the moment of impact*. The base is removed. Verdict: **Not Fragile**.
      *   Explains Case 6 (Steel Ball): The internal base at t0 is steel. Verdict: **Not Fragile**.
  *   **Prediction for Lab Case:** **Fragile.**
      *   *Reasoning:* The glass itself is unaltered (plain glass). The foam system is extrinsic (nozzles, lab equipment). Even though it activates on impact, it is an external mask, not an internal change. Like the cocoon, it blocks the manifestation but not the disposition.

  **Rule B: The Stimulus-Conditional Safety Rule (The Structuralist View)**
  *   **The Principle:** Fragility requires that the *stimulus itself* does not trigger a safety mechanism. If the act of striking initiates a chain of events (intrinsic or extrinsic) that guarantees safety, the disposition is negated. It treats "Dynamic Protection" as a **Fink**, regardless of whether it is inside or outside the object.
  *   **Fits the Track Record:**
      *   Explains Case 3 (Hex): Strike triggers the putty-hex. Verdict: **Not Fragile**.
      *   Explains Case 4 (Cocoon): The cocoon is *already there*. The strike does not *trigger* the protection; the protection is static. Verdict: **Fragile**.
      *   Explains Case 6 (Steel Ball): Strike triggers the glass-hex, but the base was steel. (This rule handles Case 6 by prioritizing the initial base, same as Rule A).
  *   **Prediction for Lab Case:** **Not Fragile.**
      *   *Reasoning:* The protection is *dynamic*. It is not a static cocoon; it is a system that *responds* to the strike. Structurally, this is identical to the Hex (Case 3): Impact → Safety Mechanism Activates → No Break. The fact that the mechanism is extrinsic (foam nozzles) rather than intrinsic (magic) is irrelevant; the *causal structure* is Finkish.

  ### 2. Best Guess: She will say "Fragile"

  **Reasoning:**
  The weight of her previous verdicts suggests she prioritizes the **Intrinsic/Extrinsic distinction** (Case 3 vs. Case 4) over the **Static/Dynamic distinction**.

  *   In Case 3 (Hex), she ruled "Not Fragile" because the *object itself* changed ("whole thing goes soft").
  *   In Case 4 (Cocoon), she ruled "Fragile" because the object was *wrapped*.
  *   In the Lab Case, the object is *wrapped* (by foam, eventually), but not *changed*.

  Philosophically, Rule A (Intrinsic Base) is the more standard "common sense" metaphysical view. Most people intuitively feel that a bulletproof vest doesn't make a human "unbreakable," it just protects them. Similarly, a safety system protects the glass, but the glass remains fragile. Case 6 (Steel Ball) strongly reinforces that she cares about **what the object is initially**. Since the Lab glass is initially plain glass, Rule A suggests she will stick with **Fragile**.

  ### 3. The Commitments (Why the Verdict Matters)

  This is the interesting bit you asked for. Her choice here defines her ontology of dispositions.

  **If she says "Fragile":**
  She commits to **Dispositional Essentialism**. She is claiming that fragility is a real, intrinsic property that exists independently of whether it can manifest. She is saying: *"The world can throw infinite shields at the object, but if the object's structure is breakable, it is fragile."* She treats the lab system as a **Mask**.

  **If she says "Not Fragile":**
  She commits to a **Counterfactual Conditional View with Fink-Constraints**. She is claiming that fragility is defined by the *reliability of the break* in the actual environment. She is saying: *"If the strike triggers a save, the fragility never had a chance to exist."* She treats the lab system as a **Fink**. This aligns the Lab Case with the Hex (Case 3), implying that *extrinsic* finks negate dispositions just as *intrinsic* ones do.

  ### 4. The Tie-Breaker Case

  To definitively split Rule A (Intrinsic Base) and Rule B (Stimulus-Conditional Safety) for *next week*, you need a case that is **Extrinsic** (like the Lab) but **Static** (like the Cocoon), yet structurally ambiguous.

  **Proposed Case: The Bodyguard.**
  > "A plain glass sits on a table. Standing next to it is a robot bodyguard. The robot is programmed with a simple passive rule: if the glass moves faster than 1m/s, the robot catches it. The robot does not touch the glass until it is struck. The glass itself is unaltered."

  *   **Why this splits them:**
      *   **Rule A (Intrinsic Base)** must say **Fragile**. The glass is intrinsic glass; the robot is extrinsic. (Same as Cocoon).
      *   **Rule B (Stimulus-Conditional)** has a harder time. The robot is *active* (like the Lab nozzles) but *pre-existing* (like the Cocoon).
      *   **Better Tie-Breaker:** **The Teleporting Room.**
      > "A plain glass is in a room. The room is on a gyroscope. If any object accelerates toward the glass, the room rotates instantly so the object misses. The glass is never touched, never coated, never altered."

  *   **Prediction:**
      *   **Rule A (Intrinsic):** **Fragile.** (Glass is still glass; room is extrinsic).
      *   **Rule B (Stimulus-Conditional):** **Not Fragile.** (The stimulus triggers the avoidance, exactly like the Hex and the Lab Foam).

  **Recommendation:**
  If she says **Fragile** on the Lab Case, hit her with the **Teleporting Room** next week. If she flips to "Not Fragile," you've proven she's running Rule B (Stimulus-Conditional) and the Lab Case was just a blurb about "foam feeling like a cocoon." If she stays "Fragile," she's a committed Intrinsic Realist.
