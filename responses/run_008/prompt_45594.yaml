answer: |-
  There is no single, established term in historiography, archaeology, or complexity theory that precisely names this structural phenomenon. While the observation is common among specialists (particularly in Maya studies and Bronze Age archaeology), it is usually discussed descriptively rather than conceptualized as a distinct methodological problem.

  Below is an analysis of the nearest existing concepts, followed by a coined term that captures the specific structural dependency you describe.

  ### 1. The Near-Misses: Existing Concepts and Their Failures

  Several concepts encroach on this phenomenon, but each captures only a slice of the problem.

  **A. Survivorship Bias (or Archival Bias)**
  *   **What it captures:** This explains *why* the choice of tracking is often made silently. As you noted, the institutions that perished (royal courts, temple builders) are the ones that produced the durable evidence (stelae, palaces), while the persisting institutions (village kinship, subsistence farming) left little trace.
  *   **Where it fails:** Survivorship bias explains the *distortion of the data*, not the *definition of the system*. One could acknowledge the bias and still choose to define "Maya Society" by its monuments. This concept describes the evidence gap, not the logical dependency of the verdict on the unit of analysis.

  **B. Reification (or The Fallacy of Misplaced Concreteness)**
  *   **What it captures:** This identifies the error of treating an abstract concept ("The Maya," "The Bronze Age System") as a concrete, singular object that can be born and die.
  *   **Where it fails:** Reification warns against treating the society as a *single* thing. Your observation is more granular: it notes that the society is a *bundle of threads*, and the verdict depends on which thread is pulled to represent the whole. Reification critiques the lumping; it does not name the variability of the verdict based on the lumping.

  **C. Tainter's "Loss of Complexity"**
  *   **What it captures:** Joseph Tainter defines collapse specifically as a rapid loss of sociopolitical complexity. This aligns with tracking the elite/administrative layer.
  *   **Where it fails:** It codifies one specific tracking choice (complexity/hierarchy) as the *definition* of collapse. It does not account for the structural fact that one could alternatively define the society by its *subsistence continuity* or *linguistic persistence*, which would yield a different verdict. It solves the problem by fiat rather than naming the variability.

  **D. Scale and Resolution**
  *   **What it captures:** In resilience theory, changing the spatial or temporal scale changes the observation of stability.
  *   **Where it fails:** "Scale" implies zooming in or out on the *same* map. Your phenomenon is about changing the *map itself* (switching from a political map to a demographic map). It is a change of *category*, not just resolution.

  ### 2. The Coinage: The Continuity-Frame Effect

  Since no established term fits, I propose naming this phenomenon **The Continuity-Frame Effect**.

  **Definition:**
  The **Continuity-Frame Effect** is the structural dependency wherein the diagnosis of societal "collapse" or "persistence" is determined not by the total sum of changes occurring, but by the pre-analytic selection of which social substrates (e.g., elite ideology, subsistence patterns, demographic density, material culture) are privileged as the constitutive identity of the society.

  It is an "effect" because the verdict (collapse vs. continuity) is a function of the frame (the chosen continuity), much like velocity is a function of the reference frame in physics.

  **Why this term works:**
  *   **Continuity:** It centers the problem on what is being tracked over time.
  *   **Frame:** It borrows from "frame of reference," implying that there is no absolute state of "collapsedness," only a state relative to the chosen metrics of identity.
  *   **Effect:** It highlights that this is an outcome of methodology, not necessarily an objective feature of the history itself.

  ### 3. Boundary Cases

  To clarify the term, we can place historical events on a spectrum of how susceptible they are to the Continuity-Frame Effect.

  **Case A: The "Frame-Insensitive" Event (True Collapse)**
  *   **Example:** The extinction of the Beothuk people of Newfoundland (early 19th century) or the demographic collapse of Hispaniola post-1492.
  *   **Why:** Here, the verdict of "collapse" holds on *any* tracking.
      *   *Elite track:* Gone.
      *   *Village track:* Gone.
      *   *Language track:* Gone.
      *   *Biological track:* Near total extinction.
  *   **Relation to Term:** The Continuity-Frame Effect is negligible here. No matter which substrate you choose as the "essence" of the society, the verdict is the same.

  **Case B: The "Frame-Sensitive" Event (The Phenomenon in Question)**
  *   **Example:** The Classic Maya "Collapse" (9th Century) or the End of the Late Bronze Age Palatial System.
  *   **Why:** The verdict flips based on the frame.
      *   *Elite/Monumental Frame:* Collapse (palaces abandoned, writing stops).
      *   *Demographic/Agrarian Frame:* Continuity (population remains, farming persists, language evolves but continues).
  *   **Relation to Term:** This is the core domain of the Continuity-Frame Effect. The historian's silent choice of frame dictates the narrative.

  **Case C: The "Single-Track" Event (Political Collapse, Societal Continuity)**
  *   **Example:** The Dissolution of the Soviet Union (1991).
  *   **Why:** We universally call this the "collapse of the Soviet Union," but we do not call it the "collapse of Russian/Eurasian society."
  *   **Relation to Term:** This shows we already intuitively apply the Continuity-Frame Effect in modern history. We define the "Soviet Union" by its political/ideological frame, not its demographic frame. The term names the structural logic we use here but often forget to apply to ancient history.

  ### 4. Distinction from Normative Evaluation

  It is crucial to distinguish the **Continuity-Frame Effect** from the evaluative question of whether a change was "bad."

  *   **Normative Evaluation (Declinism):** Asks, "Did the quality of life decrease?" or "Was this a tragedy?" One can argue the end of the Maya royal courts was *good* for the commoners (less tribute, less warfare) even if it counts as a "collapse" of the state.
  *   **The Continuity-Frame Effect:** Asks, "Did the defined entity cease to exist?" This is an ontological question, not an axiological one.

  The Continuity-Frame Effect reveals that when historians argue about whether a collapse occurred, they are often not arguing about the *data* (everyone agrees the palaces were abandoned and the villages remained), but about the *ontology* of the society. They are arguing over which frame constitutes the "real" society.

  ### Summary
  The phenomenon is the **Continuity-Frame Effect**. It identifies that "collapse" is not an absolute state of a historical population, but a relative verdict derived from the silent selection of which social continuities (monuments vs. maize, kings vs. kin) are deemed essential to the society's identity. This selection is often unconsciously dictated by **Archival Bias** (the evidence available), but the logical structure of the verdict's dependency is the Effect itself.
