answer: |-
  He will refuse to park in the fire lane, he will run the red light to get you to the ER, and he will process the refund despite the policy.

  Here is the reasoning behind those predictions and the moral algorithm driving them.

  Your boyfriend is not running a simple "obedience" script, nor is he running a pure "consequence" calculator. He is operating on a principle of **Legitimate Functionalism**. He adheres strictly to rules that maintain a free, fair, and truthful society (traffic laws, queues, accounting accuracy) because he views them as the infrastructure of trust between strangers. However, he rejects rules that serve only arbitrary authority, obscure the truth, or protect an oppressive system (the GDR state, flattering rounding, confidentiality for wrongdoing). The 3 a.m. red light wasn't about safety in that moment; it was about his commitment to the *idea* of the rule as a public good. His father's lie wasn't hypocrisy; it was recognizing that the GDR state had forfeited its legitimacy to demand truth.

  There are two competing hypotheses that fit his past behavior but split on your new cases:

  1.  **The Universal Precedent Rule:** He acts as if he is always being watched, asking, "If everyone did this, would the system collapse?" (This explains the 3 a.m. light and the queue).
  2.  **The Moral Hierarchy Rule:** He follows rules unless they conflict with a higher moral imperative like Life, Truth, or Justice. (This explains the father, the whistleblowing, and the rounding refusal).

  **The Separator:** The **Refund Case (3)** best separates these rules.
  *   Under **Universal Precedent**, he should deny the refund. Making exceptions erodes the policy that strangers rely on (just like the queue). If he makes an exception for her, he weakens the rule for the next person.
  *   Under **Moral Hierarchy**, he must grant the refund. Denying it enforces a falsehood (that she didn't return it) and violates justice. Since he refused to round the number because "the number is what it is," he must acknowledge "the return is what it is."
  *   *Prediction:* He follows Moral Hierarchy here. The Queue was about *privilege* (cutting); the Refund is about *truth* (entitlement). He protects truth over procedure.

  **The Tie-Breaker Case:**
  To settle this beyond doubt, put him in a situation where following the rule helps the system, but breaking it helps a friend without harming anyone. *Scenario:* A close friend forgot their ID to enter a secure building where they work; the guard is on a break, and no one is watching. Does he hold the door open (breaking security protocol to help a friend) or make them wait (upholding the security system)?
  *   If he holds the door: He prioritizes personal loyalty over abstract system integrity when no harm is done.
  *   If he makes them wait: His commitment to "Ordnung" (order) is absolute, regardless of legitimacy or harm.

  **Whose way holds up better under pressure?**
  I have to pick his.

  Your way (pragmatic contextualism) is superior for navigating immediate crises—you'd get us through the ER light and the client day without stress. But his way is superior for *withstanding* pressure over time. Societies don't collapse because people run red lights at 3 a.m.; they collapse because people decide the rules only apply when it's inconvenient not to follow them. His rigidity creates a predictable environment where strangers can trust strangers (the queue), where data can be trusted (the numbers), and where authority knows it cannot demand the impossible (the father). Your flexibility solves the problem in front of you; his integrity prevents the problem from becoming systemic. In a long-term crisis, I want the partner who won't erode the floor we're standing on just to get a little more room.
