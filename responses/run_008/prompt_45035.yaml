tion — but I cannot make the objection precise, and I want to see what each rejection costs. Please tell me which step to reject, why it looked unobjectionable, and what the tracking theorist must pay to reject it (including, if you think the real cost lands on step (2), whether trading sensitivity for some other anti-skeptical condition — safety, say — would avoid the aggregation result while keeping the account's virtues). Please answer in American English, and end with a line of the form "Verdict: reject step N," followed by one sentence naming the flaw.
