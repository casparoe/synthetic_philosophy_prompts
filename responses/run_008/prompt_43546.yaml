      *   *Option D: Drop (2).* Reclaim PAP. (Cost: Gives up Frankfurt, which is standard for compatibilists).

      *   *Decision:* The prompt asks me to take a definite position. The most unstable part of this specific mix is holding (1) and (3) together. (1) is a *structural* view (Wallace). (3) is a *historical* intuition. You cannot have both without a complex "historical compatibilist" amendment that usually undermines the simplicity of the Wallace view.
