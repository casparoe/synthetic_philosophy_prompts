          2.  *Frankfurt Cases:* "Could have done otherwise" (PHDW) is not required. Blame holds in Frankfurt cases.
          3.  *Manipulation Cases (Pereboom-style):* Covertly engineered agents are *not* responsible, even if they have capacities and express the same quality of will.
          4.  *Strawsonian Exemptions & Quietism:* Psychopaths/mentally ill are exempt (lack capacities). Reactive attitudes don't need external vindication.
          5.  *Hard Luck/Mitigation:* Agents shaped by abuse (but with intact capacities) deserve mitigated blame, not full-strength.

  2.  **Initial Scan for Tensions:**
      *   (1) & (3): Compatibilism usually says history doesn't matter, only current structure/capacities. Manipulation cases are designed to show that history *does* matter. This is the classic "History vs. Structure" debate.
      *   (2) & (3): Frankfurt cases say sourcehood matters less than actual sequence (capacities). Manipulation cases say sourcehood (history) matters more than actual sequence. This looks like a direct contradiction in criteria for responsibility.
      *   (3) & (5): Manipulation (engineered psychology) = No responsibility. Hard Luck (abuse-shaped psychology) = Mitigated responsibility. What's the relevant difference? Both involve causal determination of psychology by external factors. This is the "Zygote Argument" vs. "Ordinary Determinism" tension.
      *   (1) & (5): If capacity to grasp reasons is what matters (Wallace), and the abuse victim *has* intact capacities (as stated in 5), why is blame mitigated? Wallace usually argues for full responsibility if capacities are intact.
      *   (4) & (1)/(5): Strawsonian quietism says we don't need external vindication. But (3) and (5) seem to appeal to external facts (history/causation) to modify the practice, potentially violating the internal logic of the reactive attitudes.

  3.  **Deep Dive into Specific Tensions:**

      *   **Tension A: The Manipulation Intuition vs. Compatibilist Structure (Commitments 1 & 3).**
          *   *Analysis:* Commitment 1 adopts a Wallace-style reasons-responsiveness view. This is typically *structural* and *ahistorical*. It looks at the agent *now*. Commitment 3 accepts the manipulation intuition (no responsibility if engineered). This is *historical*.
          *   *Severity:* High. This is the core incompatibilist challenge to compatibilism (Mele, Pereboom). If you accept 3, you usually have to abandon standard compatibilism (1) or significantly modify it to include historical conditions.
          *   *Conflict:* If capacities are sufficient (1), why does engineering negate them (3)?

      *   **Tension B: Frankfurt vs. Manipulation (Commitments 2 & 3).**
          *   *Analysis:* Frankfurt cases (2) argue that alternative possibilities aren't needed; what matters is the actual sequence (the agent's own mechanism). Manipulation cases (3) argue that even if the actual sequence looks normal, the *origin* of the mechanism matters.
          *   *Severity:* Medium-High. It's not a logical contradiction, but it creates an unstable criterion. Why is a counterfactual intervener (Frankfurt) irrelevant, but a past manipulator (Pereboom) decisive? Both bypass the agent's control in some sense.
