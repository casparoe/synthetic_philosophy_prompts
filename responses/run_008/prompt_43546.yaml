      *   *Most coherent path:* Revise (3). Why? Because (1), (2), and (5) form a relatively standard "Moderate Compatibilist" package (Capacities matter, PAP doesn't, fairness mitigates). (3) is the "Incompatibilist Intuition" smuggled in. It creates the "Basic Argument" vulnerability.
