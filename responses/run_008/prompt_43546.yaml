      *   *What if I recommend revising (1)?* If they admit they are a *Historical* Compatibilist, then (3) and (5) make sense. But (2) (Frankfurt) becomes trickier (some historical views struggle with Frankfurt).
      *   *What if I recommend revising (5)?* If capacities are intact, blame should be full. This aligns with (1) and (2). But (3) still hangs there.
      *   *Actually, the strongest tension is between (1) and (3).* (1) says Determinism doesn't undermine responsibility. (3) says Determinism-by-Design *does*. Pereboom's argument is that there is no relevant difference.
      *   *My Recommendation:* Revise (3). It's the weak link. It invites the "Basic Argument" attack. A consistent Wallace-style compatibilist should argue that if the agent *now* has the capacities, the history of how they got them (unless it destroyed the capacities, as in 4) is irrelevant.
