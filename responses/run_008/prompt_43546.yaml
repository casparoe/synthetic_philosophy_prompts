      *   *Better Recommendation:* The strongest philosophical move for a seminar paper is to resolve the **Manipulation (3) vs. Compatibilism (1)** tension. Most graduate seminars will pounce on the fact that accepting Pereboom's manipulation intuition while claiming to be a Wallace-style compatibilist is the "Basic Argument" trap.
      *   *Wait, looking closer at (1):* "roughly the reading of Strawson that Wallace later developed." Wallace *does* try to handle history, but his core is reasons-responsiveness. Pereboom's argument is specifically designed to show that reasons-responsiveness isn't enough.
