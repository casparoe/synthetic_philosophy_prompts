      *   *Looking at (3):* "not responsible." This is an exemption.
      *   *The Pivot:* The biggest target for classmates will be (3). If you are a compatibilist (1), you should arguably treat the engineered agent like the determined agent. If determinism is compatible, why isn't *determinism-by-design* compatible? The only difference is the *source*. But if you accept Frankfurt (2), you say source/alternatives don't matter, only the actual sequence matters. But in (3), you say the source *does* matter.
      *   *Conclusion:* Commitment (3) is the outlier. It contradicts the spirit of (1) and (2). It opens the door to incompatibilism.
      *   *Alternative:* Commitment (5) is also weak. If capacities are intact (as stated), why mitigate? But this is a common "fairness" add-on.
      *   *Best Advice:* Drop or modify (3). If you are a compatibilist, you must bite the bullet that engineered agents (who are functionally identical to normal agents) are responsible. OR, you must admit you are a "Historical Compatibilist" which changes (1).
