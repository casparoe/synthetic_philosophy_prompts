      1.  **Manipulation vs. Hard Luck (3 vs. 5):** This is the most glaring inconsistency. It treats two forms of deterministic shaping differently without a clear principled distinction, given that both agents currently have "intact capacities."
      2.  **Compatibilist Structure vs. Manipulation (1 vs. 3):** This is the theoretical core conflict. You can't easily be a standard reasons-responsiveness compatibilist *and* accept the manipulation intuition without adding historical conditions that threaten the compatibilist label.
      3.  **Frankfurt vs. Manipulation (2 vs. 3):** A symptom of the above.
      4.  **Quietism vs. Theory (4 vs. Rest):** A methodological friction, but common in the literature.

