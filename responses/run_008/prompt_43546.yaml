      *   **Tension C: Manipulation vs. Hard Luck (Commitments 3 & 5).**
          *   *Analysis:* In (3), engineered psychology = No responsibility. In (5), abuse-shaped psychology = Mitigated responsibility. Both agents have "intact capacities" (per the prompt).
