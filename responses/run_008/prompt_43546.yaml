          *   *Conflict:* Inconsistent treatment of causal history.

      *   **Tension D: Strawsonian Quietism vs. Historical Conditions (Commitments 1/3/5 vs. 4).**
          *   *Analysis:* Strawson (4) says the practice of reactive attitudes is self-vindicating. We don't look outside the practice. But (3) and (5) introduce metaphysical/historical facts (engineering, abuse) to modify the practice. A hardline Strawsonian might say: "If they have the capacities and express ill will, blame them. Don't worry about how they got there."
          *   *Severity:* Medium. Many modern Strawsonians (like Wallace) integrate reasons-responsiveness. But the "quietist" element of (4) clashes with the theoretical work being done in (3) and (5).

