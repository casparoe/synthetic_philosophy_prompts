  ### The Dissertation Case

  **7. The Dissertation (6 years in, 7th to go):** *Verdict: Rational (conditionally).*
  *   **Clause 1:** Passes. A PhD is a constitutive good. The credential "Doctor of Philosophy" is logically dependent on the completion of the process. You cannot have the degree without the seventh year. Furthermore, the *meaning* of the prior six years shifts from "lost time" to "apprenticeship" only upon completion.
  *   **Clause 2:** Contingent. This depends on whether the "PhD" retains forward-looking value (career, identity) sufficient to offset the misery of the seventh year. You note the topic no longer excites you, but if the *identity* of being a philosopher matters, the payoff is constitutive, not topical.
  *   **Clause 3:** Passes. Assuming no harm to others.
  *   **Prediction:** This is **completion value**, not the fallacy. The fallacy would be continuing *if* the degree had no future value (instrumental or constitutive) and the *only* motive was to avoid the pain of waste. But since the degree itself is a threshold good that validates the past investment, honoring the sunk cost is rational under the Constitutive Payoff Principle.

  ### Summary of Repairs

  Your tentative principle failed on the **Team Loyalty** case (no completion event) and risked licensing the **War** case (completion value exists but is too costly/harmful). The **Constitutive Payoff Principle** repairs this by:
  1.  Expanding "completion" to include **Identity Integrity** (saving the Team case).
  2.  Adding a **Harm Constraint** (condemning the War case more strongly than the Relationship case).
  3.  Adding a **Net Benefit Constraint** (ensuring the cost of validation doesn't outweigh the value of the validated life).

  This principle saves all your intuitive verdicts by showing they are not exceptions to rationality, but applications of a richer utility function that includes narrative and identity.

  \answer{Constitutive Payoff Principle, none overturned}
