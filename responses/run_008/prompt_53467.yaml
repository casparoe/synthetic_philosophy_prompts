answer: |-
  The tension you feel arises because the standard textbook doctrine of the sunk cost fallacy relies on a thin conception of utility—one that treats outcomes as atomic states of the world rather than temporally extended narratives. The doctrine correctly identifies that *resources* spent cannot be recovered, but it incorrectly assumes that the *value* of future states is independent of past investments. In many human contexts, the value of a future state is logically or constitutively dependent on the history that led to it.

  Your tentative "completion-value" insight is correct but needs expansion to handle the Team Loyalty and War cases. I propose repairing it into the **Constitutive Payoff Principle**.

  ### The Constitutive Payoff Principle

  **An agent is rational to honor a past investment if and only if:**
  1.  **Narrative Dependence:** The utility of the prospective outcome is logically contingent on the history of investment (the "good" is constitutive, not merely instrumental).
  2.  **Net Forward Benefit:** The expected utility of completing the narrative (including the retroactive validation of the past) exceeds the marginal cost of continuation.
  3.  **Harm Constraint:** The continuation does not inflict severe, non-consensual harm on others to secure the narrative value.

  ### Testing the Principle Against Your Cases

  **1. The Novel (300/380 pages):** *Verdict: Rational.*
  *   **Clause 1:** The aesthetic value of the ending is logically dependent on reading the beginning; the "story" is a single temporal object.
  *   **Clause 2:** The cost (80 pages of boredom) is low; the value (narrative closure) is high.
  *   **Prediction:** Matches your verdict.

  **2. The Plate (Paid for meal):** *Verdict: Irrational.*
  *   **Clause 1:** Fails. The nutritional or hedonic value of the food is not logically dependent on the financial transaction. A clean plate does not constitute a "completed meal" in a way that generates value beyond satiety.
  *   **Prediction:** Matches your verdict (push it away).

  **3. The Relationship (3 years invested):** *Verdict: Irrational.*
  *   **Clause 1:** Weak. While relationships have narrative structure, a "floundering" one implies the narrative is broken, not completable.
  *   **Clause 2:** Fails. The future misery outweighs the value of retroactively labeling the past three years as "a serious attempt" rather than "a mistake."
  *   **Prediction:** Matches your verdict (leave).

  **4. The War (Dead died in vain):** *Verdict: Monstrous (Irrational/Immoral).*
  *   **Clause 1:** Passes. Victory would retroactively confer "meaning" on the deaths (heroism vs. waste).
  *   **Clause 2:** Fails. The cost (more death) is catastrophic.
  *   **Clause 3:** **Fails.** This is the critical differentiator from the Team case. Securing the narrative value requires inflicting severe harm on others (soldiers/civilians).
  *   **Prediction:** Matches your verdict (stop). This explains why War is *worse* than Relationship: it violates the Harm Constraint, not just the Net Benefit calculation.

  **5. The Football Team (30 years losing):** *Verdict: Admirable (Rational).*
  *   **Clause 1:** Passes. The value is *fidelity*. The "good" being pursued is the maintenance of a specific identity (the Loyal Fan). This identity is logically dependent on the history of support; a fan who switches teams upon winning cannot claim the virtue of loyalty.
  *   **Clause 2:** Passes. The cost (sad Sundays) is low/subjective; the value (integrity of self-concept) is high for the agent.
  *   **Clause 3:** Passes. No external harm.
