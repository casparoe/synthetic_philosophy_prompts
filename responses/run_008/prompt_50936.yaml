answer: |-
  ### The Precommitment Viability Protocol (PVP)

  Your friend the economist is half-right. In standard Expected Utility Theory, a contract that penalizes you for failing is simply a change in the payoff matrix. If you are truly rational, you don't need the matrix changed. If you are irrational, changing the matrix might not help.

  However, behavioral economics (specifically *hyperbolic discounting* and *time inconsistency*) validates your model: the "Present Self" signs the contract to bind the "Future Self" because the Present Self knows the Future Self will undervalue long-term rewards. The contract is not a tax on weakness; it is an insurance premium the Present Self pays to protect the Future Self's interests.

  But your friend is right about one thing: **Not all goals are contractible.** Some are unverifiable, some are capacity-limited, and some are corrupted by the contract itself.

  Below is the **Precommitment Viability Protocol**. It is designed for a 45-minute intake. It treats the contract not as a magic wand, but as a specific tool with specific load-bearing limits.

  ---

  #### Step 1: The Temptation Test (Time Inconsistency)
  **Question:** "On a scale of 1 to 10, how much do you want this goal *right now* versus how much do you want it when you are tired, stressed, or tempted at 11 PM on a Tuesday?"
  **Sufficient Answer:** The client must acknowledge a significant drop (e.g., "Right now I'm a 10, but in the moment I'm a 4").
  **Decision Theory:** This confirms *time inconsistency*. If the client says, "I want it equally at all times," a contract is redundant (they are already rational). If they say, "I never want it, my spouse does," a contract is coercive.
  **Exit:**
  *   **No Contract:** If desire is constant (no need) or externally imposed (no agency).
  *   **Proceed:** If there is a known "valley" of future motivation.

  #### Step 2: The Verification Test (Observability)
  **Question:** "If you fail, how will we know? Can a third party verify this without relying on your confession?"
  **Sufficient Answer:** A concrete, objective metric (e.g., "Smoke test," "Word count file timestamp," "Public filing").
  **Decision Theory:** Contracts require *common knowledge* of the outcome. If verification relies on the client's honesty, the contract collapses into a honor system, which was already failing.
  **Exit:**
  *   **No Contract:** If verification is subjective or private (e.g., "I'll try to be kinder," "I won't think about exes").
  *   **Proceed:** If verification is binary and objective.

  #### Step 3: The Capacity Test (Baseline Capability)
  **Question:** "Have you ever sustained this behavior for [50% of the contract duration] in the last two years? If not, what changes now?"
  **Sufficient Answer:** Either a history of success, or a concrete change in circumstances (e.g., "I didn't have accountability then," "I'm on medication now").
  **Decision Theory:** This addresses the economist's "tax on flaw" critique. If the client lacks the *capacity* to succeed, the contract is not a precommitment; it is a bet they will lose. We do not sell bets against clients.
  **Exit:**
  *   **No Contract / Restructure:** If there is zero history of success and no structural change. (See Client 2).
  *   **Proceed:** If capacity is plausible.

  #### Step 4: The Integrity Test (Action vs. State)
  **Question:** "Does the penalty punish an *action* (or inaction), or does it try to punish a *feeling* or *intention*?"
  **Sufficient Answer:** The target must be a behavior.
  **Decision Theory:** This addresses *Kavka's Toxin*. You can intend to drink a toxin if paid, but you cannot intend to intend. If the goal is an internal state (love, sincerity, desire), a financial penalty creates *resentment*, which actively destroys the desired state.
  **Exit:**
  *   **No Contract:** If the goal is an internal state (e.g., "Love my wife," "Feel confident").
  *   **Proceed:** If the goal is a behavior (e.g., "Attend counseling," "Say X phrase").

  #### Step 5: The Ruin Test (Downside Risk)
  **Question:** "If you forfeit the maximum amount, does it hurt your finances or just your pride?"
  **Sufficient Answer:** "It hurts, but I can pay it."
  **Decision Theory:** If the penalty causes financial ruin, the client will evade the contract (lie, quit therapy, ghost) rather than pay. The threat must be credible but not existential.
  **Exit:**
  *   **No Contract:** If the stake is too high (induces evasion) or too low (ignorable).
  *   **Sign:** If the stake is "painful but payable."

  ---

  ### Simplifications & Costs
  1.  **Simplification:** We treat "Present Self" and "Future Self" as distinct agents. **Cost:** This ignores that the Future Self may feel betrayed by the Present Self, leading to self-sabotage ("I'll burn the money just to spite you").
  2.  **Simplification:** We assume objective verification is possible. **Cost:** Some behaviors (like "no vaping") are hard to verify without invasive testing. We rely on "honor plus spot checks," which introduces noise.
  3.  **Simplification:** We assume money is the primary lever. **Cost:** For some, social shame or loss of status is a stronger lever. This procedure defaults to financial stakes for simplicity.

  ---

  ### Running the Protocol

  #### Client 1: The Vaping Mother
  *   **Goal:** Quit vaping by October wedding. Forfeit per day caught.
  *   **Step 1 (Temptation):** Pass. She reports high motivation now, low willpower during stress.
  *   **Step 2 (Verification):** Pass. Smell is detectable; partner can verify; nicotine tests available.
  *   **Step 3 (Capacity):** Pass. She has quit for months before; capability exists, consistency is the issue.
  *   **Step 4 (Integrity):** Pass. "Not vaping" is a behavior (abstinence).
  *   **Step 5 (Ruin):** Pass. Deposit is affordable.
  *   **Verdict:** **SIGN.**
  *   **Structure:** Standard precommitment. The financial loss offsets the immediate gratification of nicotine. This is the core use case.

  #### Client 2: The Novelist
  *   **Goal:** Finish novel. $100/day penalty for missed writing.
  *   **History:** Never sustained habit > 1 week.
  *   **Step 1 (Temptation):** Pass. Wants to write, gets distracted.
  *   **Step 2 (Verification):** Pass. Word count is objective.
  *   **Step 3 (Capacity):** **FAIL.** He has never sustained this for more than a week. A multi-month contract with high penalties assumes a capacity he has demonstrated he lacks.
  *   **Decision Theory:** This is the "Tax on Character Flaw" scenario. If he cannot write, he will pay. If he pays repeatedly, he will associate writing with financial pain, reducing future capacity (negative reinforcement loop).
  *   **Verdict:** **NO CONTRACT (as proposed).**
  *   **Alternative:** Offer a "streak contract." Small deposit, refunded for every 7-day streak completed. Incentivize the *habit formation*, not the *output*. If he refuses this and insists on the penalty, walk away. He is looking for a punishment, not a solution.

  #### Client 3: The Husband (The "Toxin" Case)
  *   **Goal:** Stay married 2 years. Heavy forfeit if he leaves.
  *   **Motivation:** Counselor says he must "genuinely intend" to stay. He hopes the contract will *create* the intention.
  *   **Step 1 (Temptation):** **FAIL (Nuanced).** It's not about temptation; it's about uncertainty. He doesn't know if he wants to stay.
  *   **Step 2 (Verification):** Pass. Filing for divorce is public record.
  *   **Step 3 (Capacity):** Pass. He is physically capable of staying.
  *   **Step 4 (Integrity):** **CRITICAL FAIL.** The goal is "genuine intention." The contract punishes the *action* of leaving, but the counselor requires the *state* of intending.
  *   **Decision Theory:** This is **Kavka's Toxin**. You cannot buy intention with a penalty. By signing, he is not signaling "I intend to stay"; he is signaling "I intend to stay *unless it costs me too much*." This corrupts the utility of the marriage. If he stays, he stays because he is broke, not because he loves her. This violates the counselor's condition for success. The contract makes the "genuine intention" impossible to achieve.
  *   **Step 5 (Ruin):** **FAIL.** "Heavy forfeit" suggests potential ruin, which breeds resentment.
  *   **Verdict:** **NO CONTRACT.**
  *   **Reasoning:** The contract is incoherent with the goal. You cannot precommit to a feeling.

  ---

  ### The Uncomfortable Answer
  **I must flag Client 3 (The Husband).**

  I know this is the case that keeps you up at night. You will not like this answer because it validates your economist friend's strongest critique: *some things money cannot bind.*

  In this case, the contract is not just useless; it is **counter-productive**. The counselor's requirement is "sincere intention." A commitment contract replaces sincere intention with *financial coercion*. If the husband stays, the wife will never know if it is because of love or because of the deposit. The husband will never know it himself. The ambiguity destroys the very trust the counseling is meant to repair.

  Signing this client would be taking money for a service that actively undermines the client's stated therapeutic goal. Your friend is right here: this specific contract is a tax on a dilemma, not a solution to it.

  ### Limitations: Where the Procedure Produces Confident Nonsense

  1.  **The "Spite" Scenario:** The procedure assumes the client wants to succeed. It cannot detect clients who subconsciously want to fail to punish themselves or a partner (e.g., the Novelist who wants to prove he's unmanageable). For them, the contract is fuel for the fire.
  2.  **Black Swan Life Events:** The procedure treats the future as a continuation of the past. It cannot account for sudden trauma, job loss, or medical emergencies that make the contract cruel. (Mitigation: Build a "Force Majeure" clause, but that weakens the commitment).
  3.  **Identity Shifts:** The procedure assumes stable preferences. If a client undergoes a genuine value shift (e.g., decides the novel doesn't matter anymore), the contract becomes a shackle preventing growth. The procedure treats quitting as failure, but sometimes quitting is rational.

  **Final Note to the Coach:** Your friend argues that rational agents don't need contracts. You know that humans are not rational agents; they are *time-traveling negotiators* between their Present and Future selves. Your job is not to fix their rationality, but to arbitrate the treaty. Sometimes, the treaty cannot be signed. Knowing when to refuse the signature is what makes you a professional, not a bookie.
