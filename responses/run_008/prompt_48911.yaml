answer: |-
  Thank you for being here. Standing here, looking out at you, I am acutely aware of the irony. This is a eulogy, a genre built on the currency of moral credit. We are supposed to say she *chose* to be kind, that she *earned* our respect, that she *deserved* this love. If she were standing here, she would likely clear her throat and point out that "deserve" is a word without a referent.

  For those who don't know, my mother taught philosophy for thirty years. Her hill to die on was P.F. Strawson's Basic Argument. In short: you cannot be ultimately responsible for your actions because you are not responsible for who you are. You didn't choose your genes, your parents, or the circumstances that shaped your character. Nobody is *causa sui*—nobody creates themselves out of nothing. So, when I say she was generous, she would correct me: she was *lucky*. Her generosity was a constellation of traits she inherited and acquired, not a moral trophy she hoisted.

  She asked me not to undo her at the finish line. She didn't want me to sneak ultimate responsibility back in through a side door just to make you feel comfortable. So I won't. I won't tell you she chose to be the way she was. She didn't. She simply *was*.

  But to say her goodness was luck does not make it less real. If a tree provides shade, it doesn't matter that the tree didn't choose to grow leaves. The shade is still cool. The relief is still felt. My mother's mind was a sharp instrument, and I know that sometimes, that cut. She believed truth mattered more than comfort. I know there are people in this room, including my brother, for whom her rigor felt like distance. She knew ideas had weight, and she knew that deploying them could wound. We cannot rewrite that history. We can only acknowledge that the same mind that could dismantle an argument at Thanksgiving was the mind that cared deeply enough about the truth to risk the tension.

  So, if we cannot praise her for *choosing* to be good, why are we here? Why gather to honor a sequence of causal events?

  She had an answer for that, too. She believed in forward-looking reasons. We praise and we love not because a debt is owed, but because acknowledging value shapes the future. When we speak of her kindness today, we are not paying her a wage she earned. We are lighting a beacon for ourselves. We are saying: *This is what matters. This is how we want to be.*

  We are here because her existence changed the texture of our lives. She wove herself into us. The way I pause before reacting, the way my brother protects his own, the way her colleagues challenge a premise—it ripples forward. The lack of ultimate responsibility doesn't sever the connection between us; it highlights it. We are not isolated judges of one another. We are participants in a shared web, shaped by forces we didn't choose, responding to gifts we didn't earn.

  She is not watching us. She is not at peace in some other realm. She is here, in the silence she leaves behind, and in the ways we have been altered by her presence. We loved her not because she was free, but because she was here. And we go on, carrying the luck of having known her, hoping to pass the shade along.

  Thank you.
