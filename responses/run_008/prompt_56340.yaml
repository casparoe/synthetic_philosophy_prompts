answer: |-
  Dear Colleague

  It is a pleasure to correspond with someone who has seen the machinery of science from the inside rather than just from the armchair. Your frustration with the underdetermination debate is not only understandable but shared by many who have watched the philosophy of science turn in on itself over the last few decades. You have put your finger on the exact nerve that keeps the discussion alive yet stagnant. The stalemate you describe is real, and your intuition that it might be a case of two different questions wearing the same label is remarkably close to the mark. I believe the dispute is substantive, but it is substantive because it conflates a logical possibility with a historical claim, and until we disentangle those, the circles will continue.

  Your diagnosis that the disagreement is partly verbal, turning on the definition of evidence, is correct but incomplete. It is not merely that one side counts theoretical virtues as evidence and the other does not. It is that the two camps are operating with different modalities of inquiry. The defenders of underdetermination, often following the logical empiricist tradition, are asking a question about justification in principle. They want to know if the data logically necessitates the theory. The critics, often naturalists or historical realists, are asking a question about practice in time. They want to know if scientists are ever actually stuck between rivals forever. When the defender says equivalence holds in the meantime, they are making a logical point about the current state of deduction. When the critic says equivalence breaks with new auxiliaries, they are making a historical point about the dynamic nature of investigation. They are talking past each other because one is discussing the static relation between sentences and observations, while the other is discussing the temporal process of inquiry. Your epidemiology example illustrates this perfectly. For that decade, you faced a logical underdetermination relative to the available instruments, but you did not face a permanent metaphysical underdetermination. The field drifted not because the truth was inaccessible, but because the cost of resolving it outweighed the immediate utility, or because the necessary auxiliary theories to build the test did not yet exist. That is a practical constraint, not a logical limit.

  This leads to your point about theoretical virtues like simplicity and unification. You are right that if these count as evidence, underdetermination evaporates, but you are also right that the literature often punts on why these virtues should track truth. This is the substantive core that remains once we clear away the verbal confusion. The real battle is not about whether rivals can be constructed, but whether the reasons we prefer one theory over another are epistemic or pragmatic. If simplicity is just about human cognitive comfort, then the anti-realist wins even if underdetermination is rare. If simplicity is a guide to the structure of the world, then the realist wins even if underdetermination is possible. The debate stalls because neither side can prove the status of these virtues without begging the question. The realist assumes nature is simple to prove simplicity tracks truth, and the anti-realist assumes we cannot know nature to prove simplicity is merely pragmatic. Progress here would not come from more logical proofs of equivalence, but from a naturalized account of why successful science tends to converge on simple theories if the world were not simple. We need a historical meta-analysis showing that theories chosen for virtues other than fit tend to yield better instrumental predictions over the long run, thereby earning their epistemic keep indirectly.

  Regarding your specific question about what would count as progress, I believe we need to stop looking for a knockout argument against underdetermination and start looking for a taxonomy of it. We need to distinguish transient underdetermination, which is just a gap in technology or auxiliary knowledge, from permanent underdetermination, which implies a limit on human knowledge. Most of the cases cited in the literature, including the ones you encountered, are transient. A genuine advance would be a rigorous historical study of cases where equivalence was resolved not by new data, but by theoretical integration, showing that the virtues did the work. Alternatively, progress would look like a reformulation of scientific realism that does not require unique determination. If realism is about approximate truth and reference rather than unique selection, underdetermination becomes less threatening. We could accept that multiple models might capture different aspects of a mechanism without one being the single true description, much like your transmission models might have both captured partial truths about the disease dynamics that were later unified.

  I must admit, however, that there is a point where my reasoning is most likely to have gone wrong. I may be too dismissive of the logical threat. Even if permanent underdetermination is historically rare, the mere possibility might undermine the claim that science is rational. If the choice between rivals is ultimately decided by something other than evidence, even rarely, then the rationality of science is contingent rather than necessary. I might be conflating the reliability of scientific practice with the justification of scientific belief. It is possible that scientists are good at finding truth without being able to prove logically that they have done so. If I am wrong, it is because I have privileged the sociological success of science over the epistemological requirement for justification. I am treating science as a successful hunt rather than a justified belief system, and for a philosopher concerned with knowledge, that might be an unacceptable concession.

  What would change my mind about this diagnosis is a formal demonstration that theoretical virtues cannot be grounded in any naturalistic framework. If someone could show conclusively that simplicity is entirely language-relative or species-specific with no connection to worldly structure, then the two questions would collapse back into one, and the logical threat would swallow the practical success. Alternatively, if a case study emerged of a genuine, permanent empirical equivalence between two serious theories that was resolved only by arbitrary sociological fiat, with no subsequent difference in instrumental success, that would validate the defenders claim that underdetermination is a live practical problem. Until then, I stand by the view that the debate is a category error mixing logic with history. You have spent a career chasing outbreaks where the data was messy and the models were provisional, and your intuition that the drift was a gap in instruments rather than a gap in logic feels far more trustworthy than the abstract worries of the academy. The philosophy of science would do well to listen more to the retired epidemiologists than to the logicians on this particular matter.

  I hope this offers some clarity on why the debate feels so circular to someone with your experience. It is circular because it is trying to solve a practical problem with logical tools and a logical problem with historical anecdotes. Thank you for sharing your perspective from the field. It is a reminder that the philosophy of science should be accountable to the science itself.

  Sincerely

  A Student of the Debate
