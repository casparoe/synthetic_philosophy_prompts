answer: |-
  Dear Managing Editor,

  I understand exactly why your team is at an impasse, and it is not because anyone is doing their job poorly. You are stumbling over a genuine philosophical fault line that divides biologists and philosophers alike, often without them realizing it. When one writer says the appendix has a function and another says it is a useless leftover, they are actually speaking different languages despite using the same English words. One is using what we call the causal-role view, where a function is simply whatever useful job a part performs in the system right now, like a brick in a wall holding up the structure. The other is using the selected-effect view, where a function is strictly defined by why natural selection kept the trait around in the past, like a heart being for pumping blood because ancestors with pumping hearts survived better. Neither is wrong, but they lead to different conclusions about vestigial traits. Since you asked for a tool to manage this without requiring your staff to get degrees in philosophy, I have designed a decision procedure that translates these abstract views into a series of concrete questions you can ask about any sentence attributing function, malfunction, or vestigial status. The goal here is not to find the metaphysical truth, but to ensure your copy is precise about what kind of claim it is making.

  To use this procedure, take the sentence in question and walk through three stages of interrogation. The first question you must ask is whether the trait currently contributes to a capacity of the organism that we generally consider beneficial, such as survival, reproduction, or homeostasis. If the answer is no, if the trait does nothing or actively harms the organism without any offsetting benefit, you should label it a malfunction or noise and avoid function language entirely. However, if the answer is yes, and the trait does seem to do something useful now, you must move to the second question, which is whether there is strong consensus in the literature that the trait was specifically shaped by natural selection to perform this specific useful job. This is the pivot point where the two views diverge. If the answer to both questions is yes, meaning it does something useful now and was evolved for that purpose, you have a green light to use strong function language like exists for or designed to. If the answer to the first question is yes but the answer to the second is no or unknown, meaning it helps now but wasn't necessarily selected for that help, you must soften the language. In this zone, you cannot say the trait exists for that purpose, but you can say it serves a role or contributes to. This is where the appendix usually lands. If the answer to the first question is no but the second is yes, meaning it was selected for something but now fails to do it, you are describing a malfunction or a mismatched trait, not a functionless one. Finally, if both answers are no, you are safe to call it vestigial or a leftover, provided you are sure it does not currently contribute to anything beneficial.

  There is a fourth exit condition you need to be aware of, which is when the biological evidence itself is too contested to answer the second question. In cases where evolutionary history is speculative or actively debated among experts, the procedure cannot license strong evolutionary claims. Here, the output must be to cut the sentence or rewrite it as a hypothesis rather than a fact. You might say some researchers propose that this trait evolved to, but you cannot assert it as the explanation. This is where the procedure hands the decision back to you, the editor, because philosophy cannot resolve empirical uncertainty. If your writers disagree on the biology, no amount of philosophical clarification will fix the sentence until the science is settled. However, if they agree on the biology but disagree on the language, this procedure will show you that they are prioritizing different definitions of function. In that scenario, you must make a house-style choice about whether your publication prefers the causal-role view, which is common in medicine and physiology, or the selected-effect view, which is common in evolutionary biology. You cannot have it both ways in the same article without confusing the reader.

  Let us run this procedure on the three cases you mentioned to see how it works in practice. Starting with the appendix and the claim that it stores beneficial gut bacteria, we ask the first question and find that yes, current research suggests it does contribute to immune function or bacterial reseeding, which is beneficial. When we ask the second question about whether it was selected for this specific role, the biology becomes murky. Some evolutionary biologists argue it is a vestige of a larger cecum used for digesting cellulose, meaning the bacteria storage is a secondary exaptation or a lucky side effect, not the original selected effect. Because the evolutionary history is contested, the procedure flags this as a zone where strong function language is risky. If you follow the selected-effect view strictly, you must call it vestigial with a possible secondary role. If you follow the causal-role view, you can call it a functional organ. The unpleasant truth here is that the procedure cannot tell you which writer is right because the theory itself splits here. You will have to decide as an editorial team whether you allow current utility to count as function. If you choose the stricter evolutionary definition to avoid teleology, you will have to tell the writer claiming it stores bacteria that they are describing a current benefit, not an evolutionary function, and they must rewrite the sentence to say it acts as a safe house for bacteria rather than its function is to store them. This might frustrate the writer who feels the current benefit is what matters to the reader, but it maintains philosophical consistency.

  Next, consider the case of fever and sickness behavior. When we ask if fever contributes to a beneficial capacity, the answer is generally yes, as it inhibits pathogen replication and boosts immune response. When we ask if it was selected for this purpose, the consensus is much stronger than with the appendix. Fever is widely regarded as an adapted defense mechanism rather than a mere symptom of damage. Therefore, both questions return a yes. The procedure licenses strong function language here. You can write that the function of a fever is to raise body temperature to fight infection. However, you must be careful with the word malfunction. A fever that goes too high becomes a malfunction, but the fever response itself is functional. The procedure clarifies that you should not describe the fever itself as a malfunction unless it exceeds the regulated range, distinguishing between the adaptive mechanism and its pathological excess. This case should be straightforward for your team and provides a good example of where function language is safe to use because the evolutionary history and current role align.

  The third case is the writer who wants to say depression exists for an evolutionary reason. This is where the procedure should act as a brake. When we ask if depression contributes to a beneficial capacity, the answer is highly contested. Some argue it serves a social negotiation function or conserves energy, while others argue it is a disorder with no adaptive value. Because the answer to the first question is not a clear yes across the board, we cannot proceed to the second question with confidence. Even if we grant that it might have some current effect, the second question regarding whether it was selected for that effect is even more speculative. There is no consensus that depression itself was the target of selection rather than being a byproduct of other selected traits like deep social bonding or rumination. Consequently, the procedure outputs a directive to cut the sentence or soften it to pure mechanism and hypothesis. You cannot say depression exists for an evolutionary reason. You can say some theorists hypothesize that certain components of depressive behavior may have had adaptive value in ancestral environments, but you must attribute this to the researchers and not state it as fact. I know this outcome might be disappointing if you were hoping to validate a compelling narrative about the purpose of suffering, but the philosophy of biology demands we distinguish between a trait having a function and a trait having a cause. Depression has causes, but asserting it has a function requires evidence of selection that we simply do not have yet.

  I want to be honest about where this procedure will fail to give you the comfort of a single right answer. In the case of the appendix, you will likely find the outcome unsatisfying because it forces you to admit that your publication style dictates the truth value of the sentence. If you decide to adopt the causal-role view for the sake of medical clarity, the evolutionary biologists on your review board may object that you are being imprecise. If you adopt the selected-effect view, your medical writers may feel you are ignoring current clinical utility. The procedure exposes that this is not a factual dispute but a definitional one. Furthermore, the procedure cannot save you when the underlying biology is unknown. If your writers argue about whether a specific hormone receptor was selected for binding a specific ligand, and the evolutionary history is genuinely unknown, the procedure simply tells you to stop making evolutionary claims. It cannot generate evidence where there is none. It acts as a filter, not a microscope. My advice is to adopt a default stance of caution. When in doubt, describe what the trait does rather than what it is for. Mechanism is rarely wrong; teleology is often speculative. By training your editors to ask whether we know the history or just the current job, you will reduce the friction between your writers and reviewers, even if you cannot eliminate the philosophical disagreement entirely. You will at least be disagreeing about the same thing.
