prompt: |-
  I'm the managing editor at a small nonprofit that writes plain-language health and biology explainers for the general public — short pieces on how the body works, why we get fevers, what the appendix is for, that sort of thing. We keep fighting about function language. One writer claims the appendix's function is storing beneficial gut bacteria, another calls it a useless leftover, a third says vestigial organs have no functions full stop, and our medical reviewers are just as split. I gather philosophy of biology has a whole literature on what it even means to say a trait has a function — the selected-effect / etiological view where function depends on evolutionary history, versus the causal-role view where function is about what a part contributes to a system right now — and I want that turned into something my team can actually use. So act as a philosopher of biology who's used to translating for non-specialists, take a moment to brainstorm and think through the design before committing to it, and then write a decision procedure my editors can run on any sentence that attributes a function, a malfunction, or 'leftover' status to a trait: the questions to ask in order, what kind of answers license evolutionary claims versus merely causal-role ones, where it outputs 'cut the sentence or soften it to pure mechanism,' and where it hands the decision back to an editor because its a judgment call the theory can't settle. Then run it on three cases: the appendix and gut bacteria claim, fever and sickness behavior (is fever a function or a malfunction?), and a writer who wants to say depression 'exists for an evolutionary reason.' Make sure at least one case comes out in a way I won't like, be honest about where the two accounts of function simply disagree and no procedure can paper over that, and say what the procedure can't do when the underlying biology is itself contested. Write everything as continuous prose, no headings, bullets, bold or tables — like a long email — and keep it usable by people who've never read a word of philosophy.
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **Role:** Philosopher of biology translating for non-specialists (managing editor of a small nonprofit).
      *   **Task:** Create a decision procedure for editors to evaluate function language (function, malfunction, leftover/vestigial) in health/biology explainers.
      *   **Input Context:** Team is fighting about function language (e.g., appendix function vs. vestigial). There's a split between selected-effect (etiological) and causal-role views.
      *   **Output Format:** Continuous prose, no headings, bullets, bold, or tables (like a long email).
      *   **Content Requirements:**
          *   Brainstorm/think through design first (implicitly or explicitly in the flow).
          *   Provide a step-by-step decision procedure (questions to ask in order).
          *   Explain when to license evolutionary claims vs. causal-role ones.
          *   Explain when to cut/soften to mechanism.
          *   Explain when it's a judgment call the theory can't settle.
          *   Run the procedure on three cases:
              1.  Appendix and gut bacteria.
              2.  Fever and sickness behavior (function vs. malfunction).
              3.  Depression 'exists for an evolutionary reason.'
          *   **Constraint:** At least one case must come out in a way the user won't like (honest disagreement between accounts).
          *   **Constraint:** Acknowledge where the procedure fails due to contested biology.
          *   **Tone:** Usable by people who've never read philosophy, practical, authoritative but accessible.

  2.  **Deconstruct the Philosophy:**
      *   **Selected-Effect (SE) / Etiological View:** Function is what the trait was *selected for* in evolutionary history. If it wasn't selected for, it has no function (even if it does something useful now). Vestigial traits have no function.
      *   **Causal-Role (CR) / Systemic View:** Function is what the trait *currently does* that contributes to the capacity of the containing system. If the appendix stores bacteria now, that's a function, regardless of history.
      *   **The Conflict:** SE says "vestigial = no function." CR says "vestigial can still have a function if it does something useful now."
      *   **The Goal:** A procedure that helps editors navigate this without getting bogged down in metaphysics, while acknowledging the split.

  3.  **Drafting the Decision Procedure (Mental Outline):**
      *   Start with the current contribution (CR). Does it do something useful now?
      *   Move to evolutionary history (SE). Was it selected for this?
      *   If both yes -> Strong function claim okay.
      *   If CR yes, SE no -> It's a "current benefit" or "side effect," not an evolutionary function. Be careful with "purpose" language.
      *   If CR no, SE yes -> It's a malfunction or broken trait.
      *   If both no -> It's truly vestigial/noise.
      *   Need to handle the "judgment call" zone where biology is unsure.

  4.  **Drafting the Cases:**
      *   **Appendix:** CR = yes (stores bacteria). SE = debated/likely no (originally for cellulose digestion?). *Result:* Conflict. SE says "vestigial/no function." CR says "has a function." I need to make sure the procedure highlights this split. The prompt asks for at least one case I won't like. If the user wants clear answers, telling them "philosophy can't decide this" might be the unpleasant part. Or, if they prefer the CR view (common in medicine), forcing the SE view might be unpleasant. Let's aim for honesty: the procedure will show that "function" is ambiguous here.
      *   **Fever:** CR = yes (fights infection). SE = yes (adapted response). *Result:* Strong function claim okay. But is it a malfunction? Usually considered a defense mechanism.
      *   **Depression:** CR = debated (what does it contribute?). SE = highly debated (adaptation vs. byproduct). *Result:* Soften to mechanism or hypothesis. Don't say "exists for."

  5.  **Refining the Format:**
      *   **CRITICAL:** No headings, no bullets, no bold, no tables. Continuous prose like an email.
      *   This is hard because decision procedures naturally lend themselves to lists. I must use paragraph breaks and transitional phrases ("First," "Next," "If the answer is...") to simulate the structure without formatting.

  6.  **Addressing the "Unpleasant Outcome" Constraint:**
      *   The user wants usable guidance. The unpleasant outcome should be where the philosophy reveals that their desire for a single correct answer is impossible. For the appendix, I should show that depending on which definition they pick, the answer flips. If they want to say "it has a function," the SE theorist says they are wrong. If they say "it's useless," the CR theorist says they are wrong. I need to make sure the procedure forces them to pick a lane or soften the language, which might be frustrating if they want a definitive biological truth.
      *   Actually, a better "unpleasant" outcome might be regarding depression. If the writer wants to say it has an evolutionary reason, the procedure should likely shut that down as speculative unless there's strong consensus. That might annoy the writer/editor who wants a compelling narrative.
      *   Let's go with the Appendix being the site of the theoretical clash. The procedure will reveal that "function" is ambiguous there. The unpleasant part is admitting that science hasn't settled the history, so the philosophy can't settle the language.

  7.  **Writing - Section by Section (incorporating into continuous prose):**
      *   **Opening:** Acknowledge the difficulty, validate the team's struggle. Introduce the two views simply (history vs. current job).
      *   **The Procedure (Embedded):** Walk through the questions.
          1.  Does it do something useful now? (CR)
          2.  Was it shaped by evolution to do that? (SE)
          3.  Decision rules based on combinations.
      *   **Application to Cases:**
          1.  Appendix: Show the split. CR says yes, SE says maybe/no. Result: Soften language.
          2.  Fever: Strong match. Function claim okay.
          3.  Depression: Weak evidence. Soften to hypothesis.
      *   **Limitations:** Where biology is contested, philosophy can't help. Where the two views disagree, you must choose a style guide rule.
      *   **Closing:** Encouragement.

  8.  **Review against Constraints:**
      *   Continuous prose? Yes.
      *   No headings/bullets/bold/tables? Yes.
      *   Act as philosopher of biology? Yes.
      *   Translate for non-specialists? Yes.
      *   Decision procedure included? Yes.
      *   Three cases run? Yes.
      *   At least one unpleasant outcome? Yes (likely the appendix or depression where certainty is denied).
      *   Acknowledge contested biology? Yes.

  9.  **Drafting - Mindful of Flow:**
      *   I need to make sure the "decision procedure" doesn't look like a list. I will use phrases like "The first step is to ask..." and "If the answer is yes, move to the second question..."
      *   I need to ensure the tone is empathetic but firm on the philosophical distinctions.
      *   I need to make sure I don't use bold text for emphasis.

  10. **Refining the "Unpleasant" Part:**
      *   The prompt says "Make sure at least one case comes out in a way I won't like." As an editor, I probably want clear guidance. The philosophy might say "You have to choose your definition," which is annoying. Or, regarding depression, the procedure might force me to kill a compelling headline. Let's make the Depression case the one where the procedure kills the claim firmly, because that's often where pop-sci overreaches. Or, better, the Appendix case where I have to tell them that *both* writers are technically right under different definitions, which means the editor has to make a stylistic choice rather than a factual one. That undermines the hope for an objective arbiter. Let's go with the Appendix creating a stalemate that requires editorial fiat.

  11. **Final Polish:** Check for accidental formatting (like asterisks for bold). Ensure paragraph breaks are clear.

  *(Self-Correction during drafting)*: I must be careful not to use markdown bullets even implicitly. I will use numbering words like "first," "second," "third" within the sentences. I also need to make sure I don't bold the case names.

  *(Plan for the "Unpleasant" outcome)*: I will ensure the Appendix analysis concludes that the procedure cannot arbitrate the dispute without the editorial team first deciding which definition of function they prefer as a house style. This might be unpleasant because it pushes the burden back onto them rather than solving it.

  *(Plan for Contested Biology)*: I need to explicitly state that if the biology is unknown (e.g., evolutionary history of depression), the procedure defaults to caution.

  Let's write.

