answer: |-
  You have identified the central nerve of modern truth theory. The pattern you are describing is not a side effect; for many philosophers of logic (e.g., Kevin Scharp, Jc Beall, Hartry Field), it is the *primary* problem, rendering the original Liar almost secondary.

  Here is the carving you requested: the name, the formal relationship to Gödel/Löb, the precise definition of the phenomenon, and the boundary conditions regarding new vocabulary.

  ### 1. The Name
  The standard term in the literature is **The Revenge Problem** (or **Revenge Paradoxes**).
  However, the specific structural pattern you identified—the "one-level-up" regeneration—is formally analyzed by Graham Priest as **The Inclosure Schema**.

  While "Revenge" names the *outcome* (a new paradox arises), the **Inclosure Schema** names the *mechanism* (the structural conditions that force the paradox to regenerate). Priest argues that the Liar, Gödel's Incompleteness, and the Limitation of Size paradoxes in set theory all share this same inclosure structure.

  ### 2. The Carving: What exactly is the phenomenon?
  You asked for a distinction between this and mere self-reference. Mere self-reference generates the *first* contradiction. The phenomenon you are tracking is the **inexpressibility of the semantic diagnosis**.

  **Definition:** A theory of truth suffers from Revenge if the resources required to consistently characterize the semantic status of the Liar sentence (e.g., "undefined," "glut," "level $n$") cannot be expressed within the object language of the theory without reinstating inconsistency.

  **The Structural Dynamic (Inclosure):**
  Priest's Inclosure Schema isolates three conditions that generate this "one-level-up" pattern:
  1.  **Existence:** There is a totality of objects (e.g., all true sentences, all provable sentences).
  2.  **Transcendence:** There is a function (e.g., diagonalization) that produces an object *outside* that totality (e.g., the Liar sentence is not in the set of true sentences).
  3.  **Closure:** The object produced is nevertheless *inside* the totality (e.g., the Liar sentence is a sentence of the language, and if the language is semantically closed, it must have a truth value).

  **Why it feels like "One-Level-Up":**
  To resolve the contradiction, the theory must deny **Closure** (e.g., "The Liar is not in the domain of truth-evaluable sentences"). But to *state* this resolution, you must quantify over the totality you just restricted. If you can quantify over it, you can reconstruct the diagonalization within that new domain. Thus, the solution requires a metalanguage that can see the object language's limitation, but the metalanguage itself becomes subject to the same Inclosure conditions.

  **Distinction from Mere Self-Reference:**
  *   **Simple Liar:** "This sentence is false." (Self-reference + Naive Truth).
  *   **Revenge:** "This sentence is not true*" (where *true* is the theorist's repaired truth predicate).
  *   **Difference:** The simple Liar attacks the *naive* concept. Revenge attacks the *theoretic repair*. It shows that the repair itself relies on a distinction (e.g., true vs. undefined) that the theory cannot internally validate.

  ### 3. Relation to Gödel and Löb
  You asked if there is an actual theorem or just an argument shape. It is both.

  **The Formal Link:**
  The phenomenon is a direct generalization of **Tarski's Undefinability Theorem** and **Gödel's Second Incompleteness Theorem (G2)**.
  *   **Tarski:** Truth for $L$ cannot be defined in $L$.
  *   **G2:** Consistency of $T$ cannot be proved in $T$.
  *   **Revenge:** The *semantic status* of $L$ (e.g., "L is undefined") cannot be asserted in $L$ without contradiction.

  **The Theorematic Backbone:**
  There is no single "Revenge Theorem," but there are limitative results in **Axiomatic Theories of Truth** that formalize this.
  *   **Montague's Theorem (1963):** Shows that if you treat "necessary truth" (or knowledge) as a predicate satisfying natural reflection principles, the system becomes inconsistent. This applies mutatis mutandis to truth.
  *   **Feferman's Reflective Closure:** Solving the Liar often requires moving to a theory $T'$ that proves the consistency (or soundness) of $T$. But then $T'$ faces its own Liar. This is exactly the G2 dynamic: you can never reach a "final" theory that certifies its own semantic soundness.
  *   **Löb's Theorem:** As you noted, this is the engine. If a system could assert "If I say $\phi$ is true, then $\phi$," (a form of reflection), it collapses. Revenge shows that any theory that asserts its own *diagnostic correctness* (e.g., "All sentences I classify as 'gaps' are indeed not true") effectively asserts its own soundness, triggering Löb/G2.

  **Is it inevitable?**
  Yes, for any theory that aims for **Semantic Closure** (the ability to express its own semantic concepts). If you give up semantic closure (like Tarski), you avoid the contradiction but admit the "one-level-up" limitation as a feature. If you keep semantic closure (like Priest), you accept the contradiction. There is no known consistent, expressively complete theory of truth that blocks the Inclosure Schema.

  ### 4. Boundary Cases: New Vocabulary
  You asked: *If a counterexample is built from brand-new vocabulary... is that a genuine instance of the pattern, or just a fresh paradox?*

  This is the battleground of **Conceptual Engineering** (e.g., Scharp's *Replacing Truth*).

  **The Criterion for Genuine Revenge:**
  A new operator (e.g., "hyper-true," "determinate truth," "ascending truth") generates genuine Revenge if:
  1.  It is governed by rules that allow it to perform the *same functional role* as truth (e.g., disquotation: "P" is hyper-true iff P).
  2.  The theory cannot express the *relationship* between the new operator and the old Liar without contradiction.

  **Example:**
  *   **Theory:** "The Liar is neither true nor false. It has a **gap**."
  *   **Revenge:** "This sentence is either false or a **gap**."
  *   **Analysis:** If the theory says the Revenge sentence is a gap, it must be neither true nor a gap (contradiction). If it says it's true, it must be false or a gap (contradiction).
  *   **Verdict:** This is genuine Revenge because "gap" was introduced as a semantic status, but the language cannot consistently predicate "is a gap" of the sentence that asserts its own gap-status.

  **When is it NOT Revenge?**
  If the theorist can argue that the new vocabulary is **inherently context-sensitive** (Contextualism, e.g., Burge, Simmons).
  *   **Move:** "The word 'true' in the object language means $true_1$. The word 'true' in my diagnosis means $true_2$."
  *   **Defense:** This isn't Revenge because the concepts are genuinely different (indexical shift). The "one-level-up" is not a failure of the theory, but a feature of the semantics of 'true'.
  *   **Counter-Attack:** Critics argue this just pushes the problem to the **context shift mechanism**. Can you express the rule for when the context shifts? If you can express that rule in the language, you can often reconstruct the paradox (the "Contextual Revenge").

  ### 5. Summary and Proposed Terminology
  If you find "Revenge" too colloquial for the structural phenomenon you've isolated, the most precise technical description is **Diagnostic Inexpressibility** or **Semantic Transcendence**.

  However, the literature converges on **Revenge**. The "carving" you should use is this:

  > **The Revenge Phenomenon** is the structural inability of a formal theory to express its own semantic classification rules without violating its own consistency constraints. It differs from the original Liar in that it targets the *explanatory resources* of the solution rather than the naive truth predicate. It is formally underwritten by the Inclosure Schema and is the semantic analogue of Gödel's Second Incompleteness Theorem.

  **Recommended Reading for your specific angle:**
  1.  **Graham Priest, *Beyond the Limits of Thought*:** Specifically the chapters on the Inclosure Schema. This validates your intuition that this is a unified pattern across logic and set theory.
  2.  **Kevin Scharp, *Replacing Truth*:** He argues Revenge is the *real* problem and proposes replacing "truth" with two new concepts (Ascending/Descending Truth) to block it. (Spoiler: Critics argue he gets Revenge anyway).
  3.  **Hartry Field, *Saving Truth from Paradox*:** Defends a paracomplete approach and spends significant time battling Revenge (specifically regarding the "exclusion negation").
  4.  **Jc Beall, *Spandrels of Truth*:** Defends a dialetheic approach and argues that Revenge is blocked if you accept that the "exclusion" intuition is the thing to discard.

  You are correct that this is the central phenomenon. Most contemporary work in truth theory is essentially an attempt to manage, block, or embrace Revenge.
