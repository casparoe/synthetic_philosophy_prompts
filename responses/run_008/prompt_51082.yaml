answer: |-
  1. Augustine locates the essence of lying not in factual falsity but in the speaker's intentional divergence from their own mind, such that one can speak the truth while still lying if one believes it false.
  2. He distinguishes lies from jokes or irony by the absence of an intent to deceive, arguing that where a shared understanding prevents error, the divergence between word and thought is not sinful.
  3. He organizes lies into a hierarchy of eight types based on the injury done to charity and truth, ensuring that even beneficial falsehoods remain sins, though less grievous than those harming religious doctrine.
  4. When Scripture seems to attribute dissimulation to revered figures, Augustine argues they were signifying a future mystery rather than asserting a present fact, transforming apparent falsehood into prophetic truth.
  5. His prohibition rests on a teleological view of language as a natural sign system intended to reveal thoughts, meaning any use of speech to conceal the mind violates the created order itself.
