prompt: |-
  me and my friend Maya have been arguing about this for basically the whole school year and our philosophy teacher finally told us to just write up what we actually agree on instead of yelling past each other. here's the situation: for our elective we got into the special composition question (van inwagen's question of when a bunch of things add up to one further thing), and Maya is now a full mereological nihilist, like she genuinely believes there are no tables or chairs, just atoms "arranged table-wise." I've gone the other way and I kind of buy universalism, that whenever you have any collection of things there's a further thing they compose, so the left half of my chair and the Eiffel tower jointly compose some object (a "scattered" one). The weird thing is we agree on alot more than we disagree: we both think van inwagen's own answer (composition only happens for living organisms) is super arbitrary, and we both actually like the vagueness argument, the one where if composition happened sometimes-but-not-always there'd have to be borderline cases of a thing existing, which seems like it can't make sense, so its all or nothing. We also agree that neither of us wants to say ordinary talk is just false forever, we just disagree on what's doing the work when we say "there's a chair in the room."

  So basically I want you to write the joint statement that me and Maya could both actually sign after a good faith "adversarial collaboration" (our teacher showed us this format where two sides who disagree write one document together). It should have: a numbered section of claims we both accept (about the special composition question itself, about why the moderate view fails, about what would count as a real cost for any theory here), then a disagreements table where each row states one thing we still disagree on, worded so that BOTH of us would accept the wording for our own side (this is the hard part, we've tried and we always sneak something slanted in). I suspect some of our real cruxes are: (1) whether Maya's "arranged table-wise" paraphrase actually avoids tables or just smuggles them back in through a vague predicate, (2) whether composition being "cheap" or even kind of like identity (something I read about lewis believing?) makes universalism harmless instead of crazy, and (3) whether it's a cost for me that universalism says there are a zillion more objects than anyone ever needs to count, versus it being a cost for Maya that she has to paraphrase basically every noun. But feel free to find better cruxes than those if we're missing something.

  For each crux, write down a case, argument, or thought experiment that BOTH of us would agree bears on it, and record each of our predictions about it in advance (like, for the paraphrase crux, maybe something about whether Maya can state her own view, "there are only simples," without it coming out false or trivial). Also if you think any part of our fight is actually just verbal, like maybe we agree on all the facts and are only fighting over the word "exist," say which part and why, cause our teacher keeps hinting that's the case and neither of us wants to admit it lol. Keep it fair to both sides — don't let the nihilist or the universalist get the last word just because one of them sounds more sensible at first. oh and no need for citations or a reading list, our library barely has any philosophy books anyway.
