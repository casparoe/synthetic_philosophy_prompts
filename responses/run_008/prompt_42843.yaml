  # JOINT STATEMENT ON THE SPECIAL COMPOSITION QUESTION
  **Submitted by:** [User Name] & Maya [Last Name]
  **Course:** Philosophy Elective
  **Date:** October 26, 2023

  ## I. JOINTLY ACCEPTED CLAIMS
  *The following claims represent the philosophical ground we have established through adversarial collaboration. Both signatories endorse these premises as the foundation for our continued debate.*

  1.  **The Special Composition Question (SCQ) is substantive.** We agree that the question "Under what conditions do some things compose a further thing?" is a legitimate metaphysical inquiry, not merely a linguistic confusion.
  2.  **Rejection of Moderate Restrictionism.** We jointly reject Peter van Inwagen's answer (that composition occurs *only* when the activity of the parts constitutes a life). We agree that drawing the line at "living organisms" is arbitrary and lacks sufficient metaphysical justification compared to the two extreme views.
  3.  **The Vagueness Argument is Decisive.** We both accept the argument that existence cannot be vague. If composition were restricted (happening sometimes but not always), there would have to be borderline cases where it is indeterminate whether an object exists. Since existence cannot be indeterminate, composition must be either "always" (Universalism) or "never" (Nihilism).
  4.  **Preservation of Ordinary Discourse.** We agree that a successful metaphysical theory should not render ordinary statements (e.g., "There is a chair in the room") strictly false or meaningless. We differ on *how* to save these statements, but we agree they must be saved.
  5.  **Ontological Costs Matter.** We agree that any theory must pay a price. For Universalism, the price is ontological abundance (too many objects). For Nihilism, the price is paraphrase complexity (rewriting ordinary language). We disagree on which price is higher.

  ## II. AREAS OF DISAGREEMENT
  *The following table outlines our remaining differences. We have crafted the "Issue" and "Test Case" columns to be neutral, such that both parties agree they accurately frame the dispute.*

  | # | Issue | Shared Test Case / Argument | [User]'s Prediction (Universalism) | Maya's Prediction (Nihilism) |
  | :--- | :--- | :--- | :--- | :--- |
  | **1** | **The Viability of Nihilist Paraphrase**<br>Does replacing "table" with "simples arranged table-wise" successfully eliminate commitment to composite objects, or does it smuggle them back in? | **The Self-Reference Test:** Can a Nihilist state their own theory ("There are no composite objects") without using terms that presuppose the existence of the very things they deny (e.g., is "arranged" a relation that requires a composite relata)? | **Failure.** The predicate "arranged table-wise" implicitly references a table. You cannot define the arrangement without referencing the shape/function of the composite object you claim doesn't exist. | **Success.** "Arranged table-wise" is a primitive predicate describing the spatial relations of simples. It does not presuppose a whole; it merely describes the pattern of the parts. |
  | **2** | **The Cost of Ontological Abundance**<br>Is the existence of "scattered objects" (e.g., the sum of my left shoe and the Eiffel Tower) a fatal flaw, or is composition "cheap" enough that this doesn't matter? | **The Counting Test:** If asked "How many objects are in this room?", does the Universalist answer commit them to an absurdly high number that makes communication impossible, or is this number harmless? | **Harmless.** Composition is like identity. Adding a scattered object doesn't add new "stuff" to the world, just a new way of counting what is already there. The abundance is weird but not false. | **Fatal.** Positing objects that have no causal unity or spatial continuity violates the principle of parsimony. It makes the word "object" lose all useful meaning. |
  | **3** | **The Meaning of the Quantifier**<br>When we say "There exists an X," are we using the same logical operator, or do we mean different things by "exists"? | **The Translation Test:** Can every true sentence in the Universalist's language be translated into the Nihilist's language (and vice versa) without loss of truth value? | **Same Operator.** "Exists" is unrestricted. If the Nihilist translates "There is a chair" to "There are simples arranged chair-wise," they are changing the subject, not translating. | **Different Operator.** "Exists" is restricted to simples. The translation preserves the *truth* of the situation without committing to the *ontology* of the chair. We are saying the same thing about the world, just using different quantifiers. |

  ## III. ANALYSIS OF POTENTIAL VERBAL DISPUTE
  *Per our teacher's suggestion, we have evaluated whether our disagreement is merely verbal (quantifier variance) or substantive.*

  **Our Joint Conclusion:**
  We agree that there is a **significant verbal component** to our disagreement, specifically regarding the meaning of the existential quantifier ("there exists").

  *   **Why it is verbal:** We agree on all the *physical facts*. We both agree that there are simples in this room. We both agree those simples are arranged in specific patterns. We both agree that if you sit on the "simples arranged chair-wise," you will not fall through the floor. There is no empirical experiment that could prove one of us wrong.
  *   **Why it is not *merely* verbal:** The choice of quantifier dictates how we build further theories. If Maya is right, we must rewrite physics and biology to avoid referring to "systems" or "atoms" as composite objects. If [User] is right, we must accept that logic allows for objects with no causal unity. The choice changes the *structure* of our metaphysics, even if it doesn't change the physical predictions.

  **Final Stance:**
  We conclude that while we are describing the same world, we are using different "conceptual frameworks" to carve it up. Maya prefers a framework where "object" implies causal unity. [User] prefers a framework where "object" implies logical possibility. We agree to disagree on which framework is more useful, while acknowledging that neither of us is denying the obvious facts of the classroom.

  ***

  **Signed:**

  __________________________ (Universalist)

  __________________________ (Mereological Nihilist)
