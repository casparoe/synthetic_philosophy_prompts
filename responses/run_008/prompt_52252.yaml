prompt: |-
  I'm a third-year PhD student in cognitive psych, and I've been attending a reading group with some evo psych grad students where we work through classic and current EP papers. Something about the genre conventions of these papers keeps bugging me and I want to figure out what the field's standard operating procedure actually commits it to, philosophically speaking.

  Here's the template I keep seeing. You take some contemporary behavior -- men reporting more distress over sexual than emotional infidelity, people preferring landscapes with water in them, mate preferences supposedly shifting across the ovulatory cycle, whatever. You propose it's the output of a mechanism that solved a specific adaptive problem in the Pleistocene, usually with a plausible-but-unverifiable story about ancestral conditions attached. Then you gather evidence that's one or two steps removed from the hypothesis itself: questionnaires, cross-cultural replications, sometimes a cross-species comparison. Confirmation of a prediction is treated as support for the whole adaptive story. My question: what view of evidence and explanation does this practice presuppose? The obvious reading is that it's abductive design-detection -- the same kind of reasoning a biologist uses when she infers what the vertebrate kidney is for, and nobody calls that a fable. So does the practice strictly need the strong stuff the field is famous for (massive modularity, a roughly uniform environment of evolutionary adaptedness, selection as the default explanation of complex functional design), or can the weaker Popper-flavored material carry the weight on its own? And is it even internally consistent, given that the same journals and reviewers will browbeat you about falsifiability while accepting adaptive hypotheses that can accomodate almost any pattern of results by reaching for the byproduct or exaptation escape hatch?

  Relatedly, and this is the part I actually got into an argument about at the pub: the just-so story accusation itself. When critics say an adaptive explanation is a just-so story because you can always invent a rival one after the fact, what philosophy of science is that complaint presupposing? It seems to assume a Popperian standard -- one deduced risky prediction or it isn't science -- that we don't apply to historical sciences generally; nobody says paleontology or historical linguistics isn't science because you can't rerun the Cretaceous. So is the criticism smuggling in a view of confirmation that the critics themselves would reject anywhere else? What I want is a proper reconstruction of the implicit commitments: what the EP research program strictly presupposes versus what it merely fits well with, where it's underdetermined such that several epistemologies would license the exact same practice, and what would have to change in how these papers get written and reviewed if the field dropped one of the big presuppositions -- say, stopped treating the Pleistocene as the relevant selective environment, or stopped treating selection as the default. I don't need citations or a reading list, I have plenty, I need the actual reconstruction and a sense of where the pieces can and can't be pried apart.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** Third-year PhD student in Cognitive Psychology. Attends a reading group with Evolutionary Psychology (EP) grad students.
      *   **Problem:** Bothered by the genre conventions of EP papers. Wants to understand the *philosophical commitments* underlying the standard operating procedure (SOP).
      *   **Specific Observations:**
          *   Template: Contemporary behavior $\rightarrow$ Pleistocene adaptive mechanism $\rightarrow$ indirect evidence (questionnaires, cross-cultural, etc.) $\rightarrow$ confirmation of prediction = support for adaptive story.
          *   Tension: Abductive design-detection (like biology) vs. Popperian falsifiability demands vs. "just-so story" accusations.
          *   Argument at the pub: Critics call EP "just-so stories" (implying post-hoc fabrication), but EP defenders say historical sciences can't rerun the Cretaceous. Who has the better philosophical ground?
      *   **Goal:** A reconstruction of the implicit commitments. What does EP *strictly* presuppose vs. what fits well? Where is it underdetermined? What happens if key presuppositions (Pleistocene focus, selection default) are dropped?
      *   **Constraint:** No citations or reading lists. Needs actual philosophical reconstruction and structural analysis.

  2.  **Deconstruct the EP Methodology (The "Template"):**
      *   *Input:* Universal or widespread human trait/behavior.
      *   *Process:* Reverse-engineering (Engineering Analysis). Assume the trait is an adaptation. Identify the Adaptive Problem (AP) in the Environment of Evolutionary Adaptedness (EEA). Propose a Mechanism (Module). Derive predictions. Test predictions.
      *   *Output:* Confirmation of the adaptation hypothesis.

  3.  **Address the Core Philosophical Questions:**

      *   **Q1: What view of evidence and explanation does this presuppose?**
          *   It's not purely Popperian (falsificationism). It's largely *Inference to the Best Explanation (IBE)* / Abduction.
          *   It relies on *Adaptationism* as a heuristic (Dennett's "Design Stance").
          *   It treats the mind as an artifact of natural selection.

      *   **Q2: Does it need the "Strong Stuff" (Massive Modularity, Uniform EEA, Selection Default)?**
          *   *Massive Modularity:* Not strictly necessary for *specific* hypotheses, but necessary for the *systematic* program. If the mind isn't domain-specific, the "adaptive problem" framing loses traction.
          *   *Uniform EEA:* This is the weak link. Strictly speaking, you need *statistical regularities* in the past, not a uniform environment. If this drops, the "Pleistocene" specificity weakens, but the "ancestral statistics" requirement remains.
          *   *Selection Default:* This is crucial. If you don't treat selection as the null for complex functional design, you have to rule out drift/byproducts first. EP usually assumes adaptation first.

      *   **Q3: Internal Consistency (Falsifiability vs. Escape Hatches)?**
          *   There is a tension. The "Lakatosian" view is useful here. EP is a Research Programme with a Hard Core (mind is adapted) and Protective Belt (specific modules, specific EEA conditions).
          *   The "byproduct/exaptation" move is a protective belt adjustment. It's consistent *if* treated as a revision of the specific hypothesis, but inconsistent *if* used to immunize the Hard Core from *any* negative evidence.

      *   **Q4: The "Just-So Story" Accusation & Philosophy of Science.**
          *   Critics often use a naive Popperian standard (must predict *novel* data, not accommodate existing data).
          *   Defenders use a Historical Science standard (consilience, independent lines of evidence).
          *   *The Real Issue:* It's about *independence of evidence*. If the only evidence for the EEA problem is the existence of the trait itself, it's circular. If there's independent evidence (paleoanthropology, primatology) for the EEA problem, it's stronger.
          *   Critics aren't necessarily wrong to demand more than IBE; they are demanding *riskiness*.

  4.  **Drafting the Reconstruction (Iterative Process):**

      *   *Introduction:* Acknowledge the sophistication of the question. Validate the "template" observation.
      *   *Section 1: The Epistemic Engine (Abduction vs. Deduction).*
          *   EP is fundamentally abductive (IBE). It argues: "Trait T exists. T looks designed for Function F. Best explanation is Selection for F."
          *   Contrast with Popper. Popper wants "If H, then O. Not O, therefore Not H." EP often does "If H, then O. O, therefore H is supported (via IBE)."
          *   This explains the "confirmation" vibe.
      *   *Section 2: The "Strong Stuff" vs. Weak Commitments.*
          *   *Selection Default:* This is the Hard Core. You can drop Massive Modularity (maybe modules are fuzzy), but you can't drop the idea that complex function implies selection without collapsing the program.
          *   *The EEA:* It doesn't need to be *uniform*, but it needs to be *stable enough* for selection to track it. The "Pleistocene" label is often a placeholder for "ancestral statistical regularities."
          *   *Can it survive without them?* If you drop Selection Default, EP becomes "Evolutionary *Science* of Psychology" (pluralistic). If you drop EEA stability, you lose predictive power.
      *   *Section 3: The Just-So Story & Falsifiability.*
          *   The criticism isn't just "you can't rerun history." It's "your evidence is endogenous."
          *   The "Escape Hatch" (byproduct) is the problem. If Adaptation and Byproduct are empirically equivalent given the data, the theory is underdetermined.
          *   To fix this: Need *independent* evidence of the ancestral problem (not just the modern trait).
      *   *Section 4: Lakatosian Analysis.*
          *   Use Imre Lakatos. Hard Core: Mind is a set of adaptations. Negative Heuristic: Don't attack the Hard Core. Positive Heuristic: Build models of specific modules.
          *   The "byproduct" move is a belt adjustment. It's allowed until it becomes degenerative (always saving the core without new predictions).
      *   *Section 5: What if we change the presuppositions?*
          *   Drop "Pleistocene": Shift to "Ancestral Statistics." Less specific, harder to test.
          *   Drop "Selection Default": Shift to Null Hypothesis Significance Testing where Null = Drift/Byproduct. This changes the burden of proof entirely.

  5.  **Refining the Argument (Self-Correction/Nuance):**
      *   *Correction:* Make sure not to sound like I'm bashing EP. The user is in a reading group; they want to understand the *logic*, not just hear criticism.
      *   *Nuance:* Distinguish between "Evolutionary Psychology" (the Tooby/Cosmides school) and "Human Behavioral Ecology" (HBE). HBE is more flexible on mechanisms. EP is committed to the architecture. The user is asking about EP specifically.
      *   *Key Insight:* The "Just-So" criticism is actually about *degrees of freedom*. If you can adjust the EEA story to fit any outcome, the theory has too many degrees of freedom.
      *   *Key Insight 2:* The "Design Stance" is the real commitment. Dennett is the philosopher here, even if not cited.

  6.  **Final Polish:**
      *   Ensure the tone is academic but conversational (peer-to-peer).
      *   Check that all parts of the prompt are answered (Evidence view, Strong vs. Weak commitments, Just-So/Popper issue, Internal Consistency, Counterfactuals on changing presuppositions).
      *   Avoid citations as requested.

  7.  **Final Output Structure:**
      *   Intro: Validating the "Template."
      *   1. The Epistemic Engine: Abduction & The Design Stance.
      *   2. The Hard Core vs. Protective Belt (Lakatos).
      *   3. The "Just-So" Charge: Degrees of Freedom vs. Historical Constraint.
      *   4. Decoupling the Commitments (What if we drop X?).
      *   Conclusion: The trade-off between heuristic power and empirical risk.

  *(Self-Correction during drafting)*: I need to be careful about the "Popper-flavored material" part of the prompt. The user asks if weaker Popperian stuff can carry the weight. I need to explain why pure Popperianism fails for historical sciences, but why a *sophisticated* falsificationism (Lakatos) is actually what's happening, even if imperfectly.

  *(Refining the "Escape Hatch" point)*: The user notes reviewers demand falsifiability but accept byproduct escapes. This is the "degenerative shift" in Lakatosian terms. I need to highlight that.

  *(Refining the "Pleistocene" point)*: It's not that the Pleistocene is sacred, it's that it's the last time statistics were stable *before* agriculture. If we drop that, we need a different anchor for "ancestral."

  Okay, ready to write.
answer: |-
  This is a sharp diagnosis of the field's methodological anatomy. You have correctly identified that the tension you're feeling isn't just procedural; it's a clash between the *logic of historical reconstruction* and the *logic of experimental manipulation*, mediated by a specific set of philosophical commitments that are often left implicit.

  Here is a reconstruction of the implicit commitments of the Evolutionary Psychology (EP) research program, structured by the epistemic engine, the necessary vs. contingent presuppositions, and the specific philosophical vulnerability regarding the "just-so" critique.

  ### 1. The Epistemic Engine: Abduction and the Design Stance

  You asked whether the practice presupposes abductive design-detection or Popperian falsification. The answer is that it **presupposes Abduction (Inference to the Best Explanation) but dresses it in Popperian clothing for review.**

  *   **The Design Stance:** The foundational commitment is Dennett's "Design Stance." EP treats psychological mechanisms *as if* they were artifacts designed by a rational engineer (Natural Selection) to solve a problem. This is not merely a metaphor; it is an ontological claim that the mind contains *functional design*.
  *   **Abductive Logic:** The reasoning flow is:
      1.  Phenomenon $P$ exists (e.g., sex differences in jealousy).
      2.  $P$ exhibits complexity and functional specificity (it looks designed).
      3.  The only known natural process that generates complex functional design is Natural Selection.
      4.  Therefore, the best explanation is that $P$ is an adaptation selected for function $F$ in environment $E$.
  *   **The Popperian Mask:** Because modern psychology journals demand falsifiability, EP papers derive *novel predictions* from the adaptive hypothesis to satisfy Popperian norms. However, the *weight* of the argument rests on the abductive step (3). If the mechanism looks designed, the burden of proof shifts to the critic to show it *isn't* an adaptation.

  **The Philosophical Commitment:** EP is committed to **Adaptationism as a Default Heuristic.** It does not treat "adaptation" as a hypothesis to be tested against a null of "drift" or "byproduct" in every single paper. It treats "adaptation" as the working null hypothesis for complex functional traits. This is why the "byproduct escape hatch" feels like a cheat: it violates the heuristic default without overturning the Hard Core.

  ### 2. Hard Core vs. Protective Belt (A Lakatosian Analysis)

  To understand what is strictly necessary versus what is merely convenient, it helps to view EP as a Lakatosian Scientific Research Programme.

  **The Hard Core (Non-negotiable):**
  1.  **The Mind is Domain-Specific:** General-purpose learning is insufficient to explain complex behavior. (This is the commitment to Massive Modularity, or at least substantial functional modularity).
  2.  **Selection is the Primary Architect:** Complex functional design in the mind is the result of selection, not drift, spandrels, or cultural evolution alone.
  3.  **Past Causality:** Current psychological architecture is determined by ancestral selection pressures, not current utility.

  **The Protective Belt (Negotiable/Adjustable):**
  1.  **The Specific EEA:** The claim that the "Environment of Evolutionary Adaptedness" was specifically the Pleistocene savannah is in the belt. It can be adjusted (e.g., to "ancestral statistical regularities" generally) without collapsing the program, provided the *stability* of the environment is maintained.
  2.  **Specific Module Boundaries:** Whether jealousy is one module or two is a belt hypothesis.
  3.  **The "Byproduct" Move:** Reclassifying a trait from adaptation to byproduct is a belt adjustment to save the Hard Core from falsification.

  **Internal Consistency Check:**
  You noted the inconsistency of demanding falsifiability while allowing the byproduct escape hatch. In Lakatosian terms, a research programme becomes **degenerative** when the protective belt adjustments are made *only* to accommodate anomalies without generating new successful predictions.
  *   **The Inconsistency:** If a paper predicts $X$, finds $\text{not-}X$, and the authors say "Ah, it's actually a byproduct," they have saved the Hard Core but stalled the Positive Heuristic. If this happens systematically across the field, the programme is philosophically vulnerable. It is internally consistent *logically* (you can always posit a byproduct), but methodologically degenerate *if* it stops producing novel facts.

  ### 3. The "Just-So Story" Accusation: Degrees of Freedom

  You asked what philosophy of science the "just-so" critics are presupposing. They are not necessarily presupposing a naive Popperianism that denies historical science. They are presupposing a constraint on **Degrees of Freedom.**

  *   **The Critic's Argument:** A theory is a "just-so story" if the number of adjustable parameters in the model equals or exceeds the number of data points to be explained.
  *   **The EP Vulnerability:** In many EP papers, the "Ancestral Problem" is inferred *from* the "Modern Trait."
      *   *Observation:* Men are distressed by sexual infidelity.
      *   *Inference:* Paternity uncertainty was the ancestral problem.
      *   *Explanation:* Selection solved paternity uncertainty.
      *   *Evidence:* Men are distressed by sexual infidelity.
      *   **Circularity:** The evidence for the adaptive problem is the existence of the trait itself.
  *   **The Historical Science Defense:** Paleontology avoids this by having **independent evidence** of the past (fossils, geology) that constrains the adaptive story. You can't say "T-Rex had big teeth because it ate clouds" because the fossil record constrains the diet.
  *   **The Philosophical Fix:** For EP to escape the "just-so" label philosophically, the **Ancestral Problem must be established independently of the Modern Trait.**
      *   *Valid:* "Paleoanthropological evidence suggests high infant mortality due to pathogen X; therefore we predict a disgust mechanism sensitive to cues of pathogen X." (Independent constraint).
      *   *Invalid (Just-So):* "People dislike pathogen cues; therefore pathogen avoidance was the problem." (Endogenous constraint).

  The critics are right that historical sciences require **consilience** (independent lines of evidence), not just internal coherence. If EP relies solely on the modern behavior to reconstruct the past problem, it is underdetermined.

  ### 4. Decoupling the Commitments: What if we drop the "Big Stuff"?

  You asked what would change if the field dropped specific presuppositions. Here is the breakdown of what is load-bearing and what is not.

  **Scenario A: Drop "Selection as Default" (Adopt Pluralism)**
  *   *Current State:* Assume adaptation first; rule out byproducts later.
  *   *If Dropped:* The burden of proof flips. You must demonstrate *function* and *heritability* and *fitness variance* before positing an adaptive mechanism.
  *   *Consequence:* The "Template" collapses. You can no longer start with a behavior and assume a module. You would need behavioral genetics data or fitness correlates for almost every paper. The field would merge into Behavioral Ecology or Quantitative Genetics.
  *   *Philosophical Shift:* Moves from **Adaptationism** to **Evolutionary Pluralism**.

  **Scenario B: Drop "The Pleistocene" (Adopt Statistical Ancestry)**
  *   *Current State:* Mechanisms are matched to Pleistocene conditions.
  *   *If Dropped:* Mechanisms are matched to *any* stable statistical regularity in the lineage's history (could be Miocene, could include early agriculture).
  *   *Consequence:* This actually strengthens the philosophy. It removes the arbitrary time-stamp. The commitment is to **Environmental Stability**, not a specific epoch.
  *   *Requirement:* You must specify *which* statistical regularity was stable long enough for selection to track it. This makes papers harder to write (requires more paleo-data) but makes them less vulnerable to the "world has changed" critique.

  **Scenario C: Drop "Massive Modularity" (Adopt Plasticity)**
  *   *Current State:* The mind is a Swiss Army Knife of specific tools.
  *   *If Dropped:* The mind is a general-purpose computer with a few specialized inputs (e.g., language, face recognition).
  *   *Consequence:* This destroys the EP "Template." If the mind is general-purpose, you cannot reverse-engineer a specific "infidelity module." You must explain how general learning rules interact with ancestral incentives.
  *   *Philosophical Shift:* This moves the field toward **Evolutionary Developmental Psychology (Evo-Devo)**. The explanation shifts from "pre-loaded content" to "pre-loaded learning rules."

  ### 5. Summary of the Reconstruction

  To answer your core question: **The practice strictly presupposes Adaptationism and Domain-Specificity.** It does not strictly require the Pleistocene (only stable ancestral statistics), nor does it strictly require Popperian falsification (it relies on Abductive consilience).

  **The Internal Tension:**
  The field is currently in a state of **methodological dissonance**.
  1.  **Ontologically**, it is Abductive/Design-based (Inferring the past cause from the present effect).
  2.  **Rhetorically**, it is Popperian (Claiming to test risky predictions).
  3.  **Defensively**, it is Conventionalist (Using the byproduct/exaptation belt to save the Hard Core).

  **How to Fix the Genre (Philosophically):**
  If you were to rewrite the "Standard Operating Procedure" to be philosophically robust without abandoning the core insights, you would need to enforce **Independent Constraint.**
  *   **Rule:** You cannot infer the Ancestral Adaptive Problem solely from the Modern Behavior.
  *   **Requirement:** The paper must cite independent evidence (primatology, paleoecology, archeology) that establishes the *problem* existed before establishing that the *solution* exists.
  *   **Result:** This eliminates the "just-so" charge because it reduces the degrees of freedom. You can no longer invent a problem to fit the trait; the problem must be evidenced independently.

  **The Pub Argument Verdict:**
  The critics are right that "you can always invent a rival story" is a problem of **underdetermination**, not just historicity. Paleontology is science because the bones constrain the stories. EP often fails to be science (in the critic's eyes) because the *modern behavior* is the only bone, and the *ancestral story* is the flesh wrapped around it.

  However, the critics are wrong if they imply historical reconstruction is impossible. It is possible *if* the constraints are external. EP is philosophically sound *if and only if* it treats ancestral conditions as empirical variables to be measured, not narrative devices to be invented. The current genre conventions often treat them as the latter, which is where your intuition about the "fable" quality is correct.
