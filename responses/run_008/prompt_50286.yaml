answer: |-
  **Ask a True Judge**
  *Weekly counsel on matters of sentiment, art, and the proper ordering of pleasure.*

  **Dear Judge,**
  My friends and I used to debate poetry over wine, but now they prefer the tavern. They say the noise and strong ale bring them more joy than any sonnet. They seem happy. Am I wrong to try to save them from such crude diversions?
  *— Concerned in Cambridge*

  **Dear Concerned,**
  You cannot save those whose organs are not fitted for higher enjoyment. It is a fact of nature that some palates are delicate and others blunt. If your friends find greater satisfaction in the clamor of the common drink than in the refined harmony of verse, they are not being oppressed; they are simply limited. We do not mourn the ox for its inability to appreciate the nightingale. You may invite them to the concert, but do not be distressed if they prefer the drum. Their happiness is real, but it is of a lower order. Yours is superior.

  **Dear Judge,**
  I wish to become a critic of recognized authority. What certification do I need? Should I study specific texts, or is there an examination of delicacy I can take to prove I am qualified to issue verdicts?
  *— Ambitious in Albany*

  **Dear Ambitious,**
  There is no board that grants this license, for the qualification is internal. You must practice extensively, comparing the works of different ages and cultures until your sentiment aligns with the enduring masters. You must also purge yourself of all prejudice—personal, historical, and cultural. How will you know when you have succeeded? You will find that your judgments coincide with those already acknowledged as true judges. If you find yourself praising what the consensus condemns, you have not yet perfected your sense. Trust the verdicts of the qualified to identify the qualified.

  **Dear Judge,**
  I am a poet adored in my village, but the critics in the capital dismiss my work as rustic. They claim only time will tell if I am any good. Must I wait until I am dead to be validated? It seems the standard favors the old over the new.
  *— The Local Bard*

  **Dear Bard,**
  The test of time is not a bias; it is a filter. Many contemporaries are swept up by novelty or local fashion, much like the villagers who praise you. The great works survive because they appeal to universal principles of human nature, transcending their era. Consider the difference between Milton and Ogilby. One is read centuries later; the other is forgotten. If your work possesses true merit, it will eventually command the agreement of the true judges across generations. If it does not, no amount of local applause can manufacture a standard. Patience is the only proof.

  **Dear Judge,**
  I am hosting a dinner. My guests prefer a sweet, simple wine, but I possess a bottle of complex vintage that experts deem superior. Should I serve what they enjoy or what is objectively better? Also, how can I be sure the experts aren't pretending?
  *— Perplexed Hostess*

  **Dear Hostess,**
  You must serve the wine that is, in fact, better. Enjoyment is not the metric; correctness is. Regarding your doubt, consider the story of Sancho's kinsmen. They were asked to taste a famous wine. One said it tasted of leather, the other of iron. They were mocked by the company until, at the bottom of the hogshead, a leather thong and an iron key were discovered. Their delicacy was vindicated by the physical evidence.

  This proves that the fault lies not in the wine, but in the taster's inability to detect the constituent parts. If your experts detect nuances your guests cannot, do not assume pretension. Assume your guests lack the key. Serve the complex vintage. If they complain, it is merely evidence that their senses are not yet refined enough to perceive the truth residing in the glass. You are not responsible for their blindness, only for providing the light.
