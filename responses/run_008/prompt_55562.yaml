          3.  Run the analysis in reverse: How would Khaldun react to modern scholarly objections that "collapse" is the wrong word (preferring "transformation/fragmentation")?
          4.  Provide a concluding judgment on which framework fits the evidence better, noting silences in both.
      *   **Tone/Style:** Academic but accessible (suitable for a third-year seminar essay context), American English.
