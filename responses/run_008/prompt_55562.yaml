  2.  **Deconstruct Ibn Khaldun's Theory (The *Muqaddimah*):**
      *   *Asabiyyah:* Group solidarity, strongest in harsh, peripheral environments (bedouin/nomadic).
      *   *Cycle:* Rise (conquest via *asabiyyah*) $\rightarrow$ Peak (luxury, settlement) $\rightarrow$ Decay (loss of *asabiyyah*, softness) $\rightarrow$ Fall (conquered by new group with fresh *asabiyyah*).
      *   *Timeline:* Roughly 120 years (3 generations of 40 years).
      *   *Nature of Decline:* Inevitable loss of cohesion due to urbanization and luxury.

  3.  **Deconstruct the Maya Evidence (Terminal Classic, c. 800-950 CE):**
      *   *Context:* Southern Lowlands (Tikal, Calakmul, Copán, Palenque).
      *   *Stressors:* Dynastic rivalry, warfare, elite display, intensive agriculture, severe droughts.
      *   *Outcome:* Cessation of dated monuments, abandonment of major cities, population dispersal (not extinction).
      *   *Continuity:* Northern centers (Chichén Itzá) thrived; Itzá (Tayasal) lasted until 1697.
      *   *Key Discrepancy:* No "fresh wave of hardened outsiders" conquered the south; the system imploded rather than being replaced by a specific new dynasty in the *same* location immediately.

  4.  **Drafting - Section by Section:**

      *   **Introduction:** Set the stage. Introduce Khaldun's cyclical model and the Maya case. State the essay's purpose (stress-testing the theory).
      *   **Part 1: Khaldun vs. The Maya Record (Confirmation & Strain):**
          *   *Confirmation:* The trajectory of luxury and softness. The elite obsession with monuments (waste). The timeline (roughly fits the 120-year window of crisis). The idea that periphery matters (though the Maya periphery didn't conquer the center in the same way).
          *   *Strain:* The lack of a successor. Khaldun expects a *replacement* dynasty (transfer of power), not a vacuum. The environmental factor (drought) is external, not just moral/social decay. The survival of the people (dispersal) vs. the fall of the state.
          *   *Khaldun's Reaction:* Would he stretch? Maybe classify it as a "natural disaster" interrupting the cycle, or argue the *asabiyyah* vanished without a replacement ready. He might look to the North (Chichén Itzá) as the new center of *asabiyyah*.
      *   **Part 2: The Reverse Lens (Modern "Transformation" vs. Khaldun's "Collapse"):**
          *   *Modern View:* "Collapse" is pejorative. It was decentralization. People survived. Culture continued.
          *   *Khaldun's View:* He cares about the *State* (Dawlah). If the dynasty falls and monuments stop, the civilization (in his political sense) has declined. He would likely see the modern distinction as semantic softness. For him, political cohesion *is* the metric.
      *   **Part 3: Concluding Judgment:**
          *   Which fits better?
          *   Khaldun explains the *elite* failure well (luxury, loss of cohesion).
          *   Modern theory explains the *social* continuity better (people didn't die, system changed).
          *   Silence: Khaldun ignores ecology. Modern theory sometimes underplays the psychological/political loss of legitimacy.
          *   Synthesis: It was a political collapse (Khaldun) but a social transformation (Modern).

  5.  **Refining the Argument (Self-Correction/Nuance):**
      *   *Correction:* Make sure not to paint Khaldun as purely "wrong." He offers a specific political sociology.
      *   *Nuance:* The Itzá kingdom lasting until 1697 is a huge point for Khaldun. It shows *asabiyyah* can persist in the periphery (Petén lakes) even after the center falls. This actually supports him if viewed correctly.
