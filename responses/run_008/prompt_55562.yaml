      *   *Khaldun's Analysis:* He'd nod at the "softness" of the Classic Maya kings. The monument building is "waste of revenue." The drought is a "calamity" that exposes weakness. But the lack of a conqueror is problematic. He might argue the *asabiyyah* dissolved into the countryside.
      *   *The Northern Shift:* Khaldun would likely point to Chichén Itzá or the Itzá as the new locus of *asabiyyah*. This saves his cycle.
      *   *The "Collapse" Debate:* Moderns say "transformation." Khaldun says "State death." He defines civilization by the throne, not the peasant. He'd call the modern view a confusion of *state* with *species*.
      *   *Conclusion:* Khaldun captures the political mechanism; Moderns capture the demographic reality. The truth is a political collapse that looked like a civilizational end to the elites, but was a reorganization for the masses.

  7.  **Final Polish:** Check against the prompt's specific questions.
      *   *Which parts confirm?* (Luxury, generational span, periphery).
      *   *Where does it strain?* (No outsider conquest in south, population survival).
      *   *Stretch, revise, or file elsewhere?* (Likely stretch to include ecological shock + shift focus to North).
      *   *Reverse analysis:* (Khaldun vs. Modern "transformation" terminology).
      *   *Final Judgment:* (Hybrid view).

  8.  **Final Review against constraints:** American English? Yes. Third-year seminar level? Yes (sophisticated but clear). Addressed all prompt points? Yes.

  *(Self-Correction during drafting)*: I need to be careful with the "three generations" rule. The Classic Maya dynasties lasted centuries, not 120 years. The *collapse* happened over a few generations. Khaldun talks about the lifespan of a *dynasty*, not necessarily the whole civilization. I need to clarify that the *Terminal Classic* represents the end of a specific political order, which fits Khaldun's dynastic fall, even if the culture persisted. I should emphasize that Khaldun focuses on the *Dawlah* (state/dynasty), not "culture" in the modern anthropological sense.

