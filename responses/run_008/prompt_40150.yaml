  ### The question

  In *Philosophical Investigations* §§66–67, Wittgenstein introduces 'family resemblance' to challenge the idea that language functions via a unified logical picture. Consider the following case study:

  > Dr Ines Halvorsen, a corpus linguist, has analysed a large corpus of everyday English and reports that uses of 'game' fall into three tight clusters — children's pastimes, organised competitive sport, and 'playing at' activities such as pretend tea parties — with almost no corpus instances bridging the clusters. Halvorsen concludes that 'game' is locally essentialist: each sub-community of speakers uses the word with a stable core, and the famous family resemblance appears only when one conflates their dialects, rather as a linguist who mixes dialects finds 'no common grammar'.

  Does Halvorsen refute Wittgenstein, vindicate him, or rest on a confusion about what kind of claim §66 was making? Specifically, is Wittgenstein's claim about the empirical extension of a word across a community, or about the grammar available to any competent speaker? Does your answer change whether the claim is vulnerable to empirical evidence about usage? Finally, connect your verdict to Wittgenstein's insistence that he offers 'reminders for particular purposes' rather than a theory of concepts (§127). Is this insistence a legitimate defence here or an evasion?

  ### Model answer

  Halvorsen rests on a fundamental confusion regarding the logical status of Wittgenstein's claim. She treats family resemblance as an empirical generalization about the distribution of word usage across a population, whereas Wittgenstein is conducting a grammatical investigation into the conditions of meaningful application available to a competent speaker. This distinction is the crux of the matter.

  Wittgenstein's target in §66 is not the statistical overlap of features in a corpus, but the philosophical prejudice that a concept *must* possess a common essence to be coherent. Halvorsen's 'local essentialism' suggests that within sub-communities (e.g., athletes), 'game' has a rigid definition. Wittgenstein would counter that even within 'sport', the boundaries are fluid. Is chess a sport? Is solitaire a game? Is professional wrestling a competition? The lack of corpus bridges does not prove essentialism; it merely shows sociological segregation. Family resemblance describes the *logic* that allows a speaker to extend the concept to new cases without a defining rule, not the historical frequency of such extensions. Therefore, corpus data is category-mistaken evidence against a grammatical remark. The claim is about the *possibility* of use, not the *actuality* of recorded instances.

  Consequently, Halvorsen does not refute Wittgenstein. His claim is that no *single* feature is necessary for the application of 'game', not that every speaker must personally witness overlapping instances. A speaker can recognize a new activity as a game via resemblance to known cases, regardless of corpus clusters. If a child encounters a new board game, they classify it not by checking a definition but by seeing affinities with known pastimes. The vulnerability to empirical evidence is null because the claim is not predictive but descriptive of conceptual logic. Halvorsen assumes Wittgenstein is making a claim about the extension of a word across a whole linguistic community; in reality, he is describing the grammar available to any competent speaker who can navigate the concept without a rule.

  Regarding §127, Wittgenstein's insistence on 'reminders' is a defence, not an evasion. He is not constructing a theory of concepts liable to falsification by linguistics, but dissolving the philosophical urge to theorize essence. Halvorsen treats him as a theorist proposing a rival hypothesis to essentialism; Wittgenstein denies he is proposing a hypothesis at all. To demand empirical verification is to miss the therapeutic point. Halvorsen's error lies in treating a grammatical reminder as a sociological theory. Wittgenstein survives because his project is to show that the search for essence is itself the confusion, not to prove that overlaps empirically exist in every dialect. A first-order empirical claim could be refuted by Halvorsen's data; a second-order grammatical reminder cannot be, because it clarifies how the empirical claim is even possible.

  Consider the implication of 'reminders for particular purposes'. Wittgenstein is not offering a universal theory of semantics that must hold for all time and all corpora. He is addressing a specific philosophical bewitchment: the idea that meaning *must* be fixed by essence. When he says he offers reminders, he means he is drawing attention to what we already know but overlook when theorizing. We already know how to use 'game' without a definition. Halvorsen's data might show clusters, but it cannot show that speakers *require* essences to use the word within those clusters. Her 'local essentialism' is an attribution of theoretical structure to speakers who operate purely on practice.

  Thus, the insistence on reminders is a defence. It insulates the investigation from empirical refutation not by dogmatism, but by shifting the ground from science to philosophy. If Wittgenstein were proposing a theory of concepts, Halvorsen would refute him. But he is dissolving the framework that makes such a theory seem necessary. Halvorsen vindicates Wittgenstein inadvertently by demonstrating the very philosophical temptation he warns against: the desire to find hidden order where there is only open-ended practice. Her confusion confirms the necessity of his therapy. The family resemblance claim is not vulnerable to empirical evidence because it is not a claim about the world, but about the limits of our philosophical description of the world.

  ### Marking scheme

  **1. Diagnosis of the Crux (8 marks)**
  Distinguishes between empirical/extension claims and grammatical/competence claims.
  *Upper-second error:* Treats family resemblance as a sociological hypothesis testable by corpus data.

  **2. Methodological Interpretation (8 marks)**
  Explains 'reminders' as therapeutic defence rather than theoretical evasion.
  *Upper-second error:* Dismisses 'reminders' as an ad hoc evasion to save Wittgenstein from falsification.

  **3. Argumentative Coherence & Verdict (9 marks)**
  Clearly decides on refute/vindicate/confusion and sustains the argument throughout.
  *Upper-second error:* Sits on the fence or contradicts the verdict in the conclusion.

  A first-class answer must demonstrate why the grammatical claim insulates Wittgenstein from data without rendering his philosophy dogmatic or vacuous.
