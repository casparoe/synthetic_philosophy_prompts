  A flood rescue team in a single helicopter faces a choice between saving a lone stranded homeowner on a stable roof nearby or a group of three neighbors trapped in a sinking basement across town. Saving the lone individual is straightforward with a 90% success rate, while the group rescue is hazardous due to structural instability and distance, carrying only a 30% success rate for the mission as a whole. The rescuer has two procedurally fair options: flip a coin to decide between attempting the lone rescue or the group rescue, or hold a lottery where each of the four individuals receives one ticket, such that drawing the lone person's ticket triggers the lone rescue, but drawing any of the three group members' tickets triggers the group rescue mission for all of them.

  **Walkthrough**
  Under the **Coin Flip** procedure, the choice is 50/50 between the two missions. The lone individual's survival probability is $0.5 \times 0.9 = 45\%$. Each group member's survival probability is $0.5 \times 0.3 = 15\%$. Here, survival odds come apart significantly. Under the **Individual Lottery** procedure, there are four tickets. The lone individual survives only if their ticket is drawn ($25\%$) and the rescue succeeds ($90\%$), yielding $22.5\%$. A group member survives if *any* of the three group tickets is drawn ($75\%$) and the rescue succeeds ($30\%$), also yielding $22.5\%$. Here, every person has the exact same survival probability. A straightforward maximizer of lives saved is indifferent between the two procedures: the Coin Flip yields an expected value of $0.5(1 \times 0.9) + 0.5(3 \times 0.3) = 0.9$ lives saved, and the Lottery yields $0.25(1 \times 0.9) + 0.75(3 \times 0.3) = 0.9$ lives saved. Both procedures are eligible readings of "equal chance": the Coin Flip treats the *options* equally (50/50), while the Lottery treats the *persons* equally (1 ticket each). The structural feature doing the work is the **bloc rescue constraint** (saving one group member saves all), combined with the **risk differential** required to align expected values. If you remove the bloc constraint (e.g., the group is scattered and must be rescued individually), the lottery would require separate missions for each ticket, collapsing the distinction between the procedures or making the lottery logistically impossible within the resource limits.

  **Evaluation of the Equal-Chance Requirement**
  This scenario shows the equal-chance requirement is underspecified. It does not clarify whether "equal chance" means equal ex-ante probability of survival (satisfied by the Lottery in this risk-calibrated case) or equal weight in the decision mechanism between options (satisfied by the Coin Flip). In standard cases without risk differentials, the Coin Flip equalizes survival chances (50% each) while the Lottery unequalizes them (Lone < Group). However, to satisfy your constraint that the maximizer must be indifferent, I had to introduce a risk differential ($P_{Lone} = 3 \times P_{Group}$). This mathematically forces the Lottery to equalize survival chances and the Coin Flip to unequalize them, flipping the standard intuition. I cannot make the expected values equal *and* keep the Lottery odds unequal without rigging the risk to apply differently based on the procedure chosen, which violates the "natural feature" constraint.

  **Responses**
  A **Taurekian** would most plausibly argue that the Lottery is the true expression of "equal chance" because it gives each person equal weight (one ticket) and, in this calibrated scenario, equal survival probability. The cost to them is admitting that "equal chance" depends on empirical risk factors; if the group rescue were safer, the Lottery would no longer equalize survival probabilities, forcing them to either accept unequal survival chances or abandon the lottery for a weighted coin, which looks suspiciously like counting numbers. A **Numbers-Count person** would argue that the indifference point proves numbers aren't the whole story, but only because risk is doing the moral work here. They would say the fact that numbers don't settle it here actually cuts in their favor: it shows that when expected lives are equal, we need a tiebreaker, and "equal survival probability" (via the Lottery) is a better tiebreaker than "equal option weight" (Coin Flip), but only because it respects the individual status of the group members rather than treating them as a blob.
