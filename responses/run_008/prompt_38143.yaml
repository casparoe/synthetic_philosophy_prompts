prompt: |-
  I run discussion sections for a course on AI safety, about 20 students, one 90-minute session coming up on inner alignment and goal misgeneralization. They've already had the outer alignment material (reward hacking, specification gaming) so they think they know what "the model is optimizing the wrong thing" means, and I want an activity that breaks that intuition -- that makes them feel the difference between a model pursuing reward and a model pursuing the goal it formed *while being rewarded*, which comes apart exactly when the reward is gone or the distribution shifts. My idea, which you should fix and extend: students pair up, one is the trainer with a secret target concept written on a card (like "animals that could plausibly be someone's pet" or "sentences about the past") and the other is the model. The model generates items, the trainer can only respond thumbs up / thumbs down, no talking, and the model has to figure out the rule from like 15 training examples. Then the deployment phase: (1) new items where the model's inferred concept and the trainer's actual concept diverge -- and I want the setup arranged so this actually happens, not just sometimes; (2) the key round, where the model sorts a whole batch of novel items with the trainer gone, no feedback channel at all, so whatever rule it applies then is what it's *actually* pursuing, not what it was paid to pursue. Give me the full design: materials, exact timeline, how to write concept pairs that reliably come apart off-distribution, scoring if useful, and a debrief that maps each phase onto outer objective vs inner objective, training vs deployment distribution, and how this differs from plain old reward hacking. Don't tell them the terms until the debrief. Also: tell me what will predictably go wrong the first time I run it (I'm guessing trainers will accidentally leak the rule with facial expressions, and some pairs will get lucky and never diverge), and be honest about what this can't reproduce -- my worry is that a human "model" is doing conscious hypothesis-testing they can introspect on, whereas a network's inner objective is something nobody chose and nobody can just ask about, plus the thumbs up comes from a person who *means* something by it, which real reward doesn't. One more thing I'd like: a short follow-up writing prompt for them that connects the no-feedback round to the question of whether a model with a misgeneralized goal counts as misaligned even if it never misbehaves during training. End your whole response with a single sentence on the last line, starting "Bottom line:", stating the one thing this activity must get right or it fails. Nothing else after that. Thanks, this has been on my mind alot and I can't quite see how to make the no-reward round land.
