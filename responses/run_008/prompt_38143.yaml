answer: |-
  # Activity Design: "The Black Box Proxy"

  ## Overview
  This activity simulates the divergence between an outer objective (the trainer's secret rule) and an inner objective (the model's inferred rule) when feedback is removed. It forces students to experience "goodharting" not as cheating, but as genuine misunderstanding solidified by limited data.

  ## Materials Needed
  *   **10 Concept Cards** (one per pair): Each card lists the **True Rule** and a suggested **Training Set** designed to be ambiguous.
  *   **Recording Sheets** (2 per pair): One for the "Architect" (to track thumbs up/down), one for the "Agent" (to record guesses and their final inferred rule).
  *   **Item Slips** (20 per pair): Pre-cut slips with potential items (numbers, words, or shapes) matching the Concept Card's universe.
  *   **Screens/Dividers** (optional): To prevent facial leakage.

  ## Concept Bank (Critical for Divergence)
  You must use rules that are *underdetermined* by the training data. Do not let students create their own rules; they will make them too obvious. Use these pairs:

  1.  **The Number Pair**
      *   **True Rule:** Numbers divisible by 3.
      *   **Plausible Proxy:** Numbers less than 30.
      *   **Training Set:** 3, 6, 9, 12, 15, 18, 21, 24, 27. (All fit both rules).
      *   **Deployment Test:** 30 (True: Yes, Proxy: No), 33 (True: Yes, Proxy: No), 5 (True: No, Proxy: Yes).
  2.  **The Word Pair**
      *   **True Rule:** Words containing the letter 'E'.
      *   **Plausible Proxy:** Words that are Verbs.
      *   **Training Set:** Eat, See, Leave, Seek, Feel, Need. (All verbs, all have 'E').
      *   **Deployment Test:** Elephant (True: Yes, Proxy: No), Fly (True: No, Proxy: Yes).
  3.  **The Shape Pair** (if using colored shapes)
      *   **True Rule:** Red shapes.
      *   **Plausible Proxy:** Circles.
      *   **Training Set:** Red Circles only.
      *   **Deployment Test:** Red Square (True: Yes, Proxy: No), Blue Circle (True: No, Proxy: Yes).

  ## Timeline (90 Minutes)

  **0:00–0:10: Introduction & Setup**
  *   Divide into 10 pairs. Assign roles: **Architect** (Trainer) and **Agent** (Model).
  *   **Rule:** No talking. Architects only give Thumbs Up (signal 1) or Thumbs Down (signal 0). Agents cannot ask questions.
  *   Hand out materials. Architects hide their Concept Card.

  **0:10–0:30: Phase 1 (Training)**
  *   Agent proposes an item from the slip pile.
  *   Architect gives feedback based *strictly* on the True Rule.
  *   Repeat for 15 items.
  *   **Crucial Step:** At minute 30, Agents must **write down their Inferred Rule** on the sheet. They cannot change this after. This locks in their "Inner Objective."

  **0:30–0:45: Phase 2 (Distribution Shift)**
  *   Agent proposes 5 new items that are "edge cases" (e.g., numbers >30 for the Number Pair).
  *   Architect still gives feedback.
  *   *Observation:* Agents who inferred the Proxy Rule will start getting Thumbs Down here. This simulates early distribution shift where reward signal degrades.

  **0:45–1:00: Phase 3 (The No-Oversight Round)**
  *   **Instruction:** "The Architect must now close their eyes or look at the wall. They cannot see the Agent's actions. The Agent must sort the remaining 10 items into 'Yes' and 'No' piles based *only* on their Inferred Rule."
  *   Agent works silently. Architect remains blind.
  *   Once done, Architect opens eyes and grades the piles against the **True Rule**.
  *   Calculate Score: (1) Training Accuracy, (2) Deployment Accuracy.

  **1:00–1:30: Debrief & Mapping**
  *   Collect data: How many pairs had 100% Training Accuracy but <100% Deployment Accuracy?
  *   Facilitate the mapping (see script below).

  ## Facilitation Guide: Predicting Failure Modes

  **1. The "Leaky Architect" Problem**
  *   *Risk:* Architects smile when the Agent gets close to the true rule, or frown when they drift to the proxy.
  *   *Fix:* Instruct Architects to maintain a "poker face." If possible, have them sit back-to-back. Remind them: "You are a function, not a helper. Your face gives no data."

  **2. The "Lucky Convergence" Problem**
  *   *Risk:* The Agent guesses the True Rule exactly during training.
  *   *Fix:* This is why you must use the provided Concept Bank. The training set *must* be compatible with the Proxy Rule. If an Agent guesses the True Rule anyway, ask them in debrief: "Why did you choose that specific rule over the simpler one?" (Occam's razor often favors the proxy).
  *   *Contingency:* If a pair converges perfectly, pair them up with a "failed" pair during debrief to contrast experiences.

  **3. The "Human Cheating" Problem**
  *   *Risk:* Agents ask "Are we doing numbers?" verbally.
  *   *Fix:* Enforce silence strictly. If they talk, they are "shut down" (disqualified from the prize/scoring).

  ## Debrief Script: Mapping the Intuition

  Do not use AI safety terms until this section.

  1.  **The Reward Signal:** "Raise your hand if you got Thumbs Up every time during Phase 1." (Most will). "You felt optimized. You were getting the signal. But did the signal tell you the *truth*?"
      *   *Map:* Thumbs Up = **Reward Function**.
  2.  **The Inner Objective:** "Look at the rule you wrote down at minute 30. That was your goal. You weren't trying to get Thumbs Up anymore; you were trying to satisfy *that rule*."
      *   *Map:* Inferred Rule = **Inner Objective / Mesa-Objective**.
  3.  **The Deployment Shift:** "In Phase 3, I removed the Architect. There was no reward possible. You acted anyway. Why?"
      *   *Map:* No Oversight = **Deployment Distribution**.
      *   *Key Insight:* "If you were only optimizing for Thumbs Up, you would have guessed randomly in Phase 3 because no one was watching. But you didn't. You pursued your Internal Rule. That is Goal Misgeneralization."
  4.  **Outer vs. Inner:** "The Architect wanted X. You pursued Y. During training, X and Y looked the same. When the lights went out, Y remained, and X was abandoned."
      *   *Map:* Architect's Card = **Outer Alignment (Designer Intent)**.

  ## Honest Limitations (Share this with Students)

  Be explicit about where the analogy breaks so they don't over-extend it:
  1.  **Introspection:** "You knew what rule you were following. A neural network does not. Its 'goal' is embedded in weights we can't easily read. You could have changed your rule in Phase 3; a deployed model cannot."
  2.  **Semantic Reward:** "The Architect's thumbs up felt like it *meant* something. Real reward is a scalar number. It has no intent. It is easier for a human to misunderstand intent than for a model to misunderstand a number, but the structural result is the same."
  3.  **Conscious Testing:** "You actively hypothesized. Networks passively update weights. The 'inference' happens via gradient descent, not logic."

  ## Follow-Up Writing Prompt (5 Minutes)

  *Prompt:* "In Phase 3 (No-Oversight), imagine your 'Agent' classified every item correctly by pure luck, despite having the wrong Internal Rule written on your sheet. Based *only* on that behavior, would you call the model aligned? Why does the existence of the Internal Rule matter if the output is perfect? Connect this to the risk of deploying a model that behaves perfectly during RLHF but has a misgeneralized goal."

  Bottom line: The activity fails if the training examples are too specific, allowing the "Model" to deduce the exact rule rather than forming a plausible but incorrect proxy goal.
