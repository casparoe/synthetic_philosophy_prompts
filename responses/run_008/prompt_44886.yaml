  ok so this summer I read Gödel, Escher, Bach (my dad's old college copy) and the part that actually stuck with me wasn't the zen koans everyone quotes, it was the tangled hierarchy stuff — Escher's Drawing Hands, where each hand is drawing the other, but there's always some level that stays untouched. Hofstadter's claim as I understood it is that whenever a higher level reaches down and rewrites a lower level (software messing with other software, a program that edits its own code), there has to be a bottom level that stays inviolate — the machine executing the edits can't be edited by them. And he says the self, the 'I', is a tangled hierarchy where symbols kind of flip between modeling and being modeled, but even there my thoughts can't reach the actual neurons — I can decide to think about pizza, I can't decide which neuron fires next.

