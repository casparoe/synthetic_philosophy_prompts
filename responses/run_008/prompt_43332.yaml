answer: |-
  **MEMORANDUM**

  **TO:** Grants Committee
  **FROM:** [Your Name]
  **DATE:** October 26, 2023
  **SUBJECT:** Funding Allocation Strategy: Near-Term Welfare vs. Longtermist Risk Reduction

  ### Executive Summary

  At our last meeting, we confronted a tension between our historical mission (global health and local literacy) and a proposal to reallocate the majority of our capital toward longtermist causes (AI safety, civilizational resilience). The argument for the latter rests on Strong Longtermism: the claim that the potential size of the future population is so vast that reducing existential risk (x-risk) by even a microscopic fraction outweighs saving lives today in Expected Value (EV) terms.

  This memo analyzes that argument, identifies its critical failure points, and proposes a funding allocation for the upcoming cycle. My conclusion is that while the EV math of longtermism is compelling in theory, it relies on assumptions about *tractability* and *epistemic stability* that do not yet warrant an 80% portfolio shift for a foundation of our size. However, ignoring the argument entirely is also irrational. I propose a diversified "barbell" strategy that maintains our core impact while purchasing exposure to high-upside future outcomes.

  ### The Strong Longtermist Argument

  We must address the strongest version of the proposal, not a softened one. The argument is not merely that "the future matters." It is a mathematical dominance claim:

  1.  **Stake:** If humanity survives and reaches a stable state, there could be $10^{50}$ or more future lives.
  2.  **Probability:** Even if our interventions only reduce the probability of extinction this century by $0.0001\%$, the expected number of lives saved is in the billions or trillions.
  3.  **Comparison:** Saving a life today costs ~$5,000 (via bednets, etc.). Saving a "future life" via x-risk reduction, when amortized over the astronomical stake, costs effectively fractions of a penny in EV terms.
  4.  **Conclusion:** Any funding not directed toward the highest-leverage x-risk intervention is morally suboptimal, akin to ignoring a burning building to sweep the sidewalk.

  Proponents argue that objections based on "tangible results" are myopic. If the building burns down, the sidewalk doesn't matter.

  ### Fragility and Assumptions

  While the multiplication above is correct, the inputs are fragile. A smart proponent will defend the *moral weighting* of future lives (which is hard to dispute) but must concede ground on *tractability* and *epistemic confidence*.

  **1. The Tractability Assumption (The Leverage Problem)**
  The EV calculation assumes our grant dollars actually move the needle on x-risk.
  *   **The Objection:** AI safety is a capital-intensive field dominated by well-funded labs and sovereign states. Can a few hundred thousand dollars meaningfully alter the trajectory of AGI development? If our marginal dollar does nothing, the EV is zero, regardless of the stake.
  *   **Proponent Concession:** Most serious longtermists admit that direct funding is less effective than talent density. They argue fellowships work by unlocking *people*, not buying *things*. However, the causal link between a small fellowship and reduced global x-risk is tenuous.

  **2. The Pascal's Mugging Objection (Epistemic Stability)**
  *   **The Objection:** If we accept that tiny probabilities $\times$ infinite stakes = dominant decision, we become vulnerable to any claim with a big enough number. We could justify funding magic spells if the claimed payoff is high enough.
  *   **Proponent Defense:** They argue x-risk is not "magic"; it is based on physical trends (compute growth, capability gains).
  *   **The Reality:** We lack a feedback loop. In global health, we know if bednets work within a year. In AI safety, "success" is the absence of a catastrophe that hasn't happened yet. We cannot update our priors effectively.

  **3. The Moral Weight Assumption**
  *   **The Objection:** Do future people count equally to present people?
  *   **Consensus:** Philosophically, yes. But practically, we have higher confidence in the welfare of existing, suffering people. Discounting the future at 0% is theoretically sound but practically risky when the "present" contains acute suffering we can definitively end.

  ### Proposed Allocation

  We should not split the difference simply to keep the peace, but we should split the portfolio to manage *model risk*. We are uncertain about the longtermist model, not just the outcomes.

  I recommend a **60% / 30% / 10%** split.

  *   **60% Near-Term Human Welfare (Global Health & Literacy):** This preserves our core identity and ensures that our capital definitely does good. Even if the longtermist thesis is 100% correct, the uncertainty around our *leverage* on x-risk is high enough that putting the majority of capital there is imprudent. We know bednets work. We do not know if our specific AI grants work.
  *   **30% Longtermist Portfolio (AI Safety & Resilience):** This is a significant bet. It acknowledges that if the Strong Longtermist math is right, this 30% could outweigh the 60% in EV terms. It funds the fellowships and technical research proposed, treating it as a high-risk venture investment.
  *   **10% Evaluation & Learning:** This is the critical third bucket. We cannot evaluate x-risk reduction by "lives saved." We must evaluate by *insight generated*. This bucket funds external audits of our longtermist grants, meta-research on cause prioritization, and the cost of tracking the career trajectories of fellows. We need to buy information to decide if we should increase or decrease this allocation next year.

  ### Decision Procedure: How We Review Next Year

  We cannot use "lives saved" as a metric for the Longtermist bucket. Instead, we will use a **Milestone-Based Review**:

  1.  **Global Health:** Continue tracking Cost Per DALY (Disability-Adjusted Life Year). If this drifts above standard effective altruism benchmarks (e.g., >$100/DALY), we reallocate.
  2.  **Longtermist:** We will assess *tractability signals*, not outcomes.
      *   *Did the funded research produce novel, public insights that were cited by major labs?*
      *   *Did the fellowship place candidates in roles with genuine leverage (not just credentialing)?*
      *   *Has the broader field's estimate of "tractability of intervention" increased or decreased based on new data?*
  3.  **The Kill Switch:** If, after one year, the Longtermist grantees cannot articulate a clear causal mechanism for how their work reduces risk (beyond "building community"), we reduce that bucket to 10% and move the rest to Near-Term Welfare. Conversely, if we identify a specific intervention with demonstrable leverage (e.g., a policy win), we may pivot to 80% longtermist in Year 3.

  ### Conclusion

  The Strong Longtermist argument is mathematically robust but empirically fragile. It asks us to bet on high-confidence theory over high-confidence data. For a foundation of our size, the most rational approach is to secure definite good while purchasing options on the astronomical good. We should fund the future, but we should not mortgage the present on a model we cannot yet verify.

  Recommendation: 60% Global Health/Local / 30% Longtermist / 10% Evaluation
