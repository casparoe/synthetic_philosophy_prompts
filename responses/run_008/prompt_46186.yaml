answer: |-
  This is a profound set of questions that cuts to the heart of metaphysics, bioethics, and the philosophy of mind. Cryonics is not merely a medical procedure; it is a materialized philosophy. To understand what your uncle has signed up for, we have to excavate the implicit ontology—the theory of what exists and what persists—buried beneath the technical protocols.

  Here is a reconstruction of the implicit theory behind cryonics, an analysis of where it is underdetermined, and a mapping of its tension with societal norms.

  ### 1. The Theory of Death: Information-Theoretic vs. Biological Cessation

  You are correct that cryonics presupposes death is a **process** rather than an **event**.

  **The Implicit Theory:**
  Standard medicine and law operate on a threshold model of death. Clinical death (heart stops) leads to biological death (cells die), which leads to legal death (status change). Cryonics rejects the finality of the first two stages. It operates on the concept of **Information-Theoretic Death**.

  Under this view, a person is not dead until the structural information that encodes their memory, personality, and identity is irretrievably lost. As long as the connectome (the map of neural connections) remains intact enough to be read—even if the tissue is frozen and chemically fixed—the person is merely "injured" or "in stasis," not dead. Legal death is viewed as a bureaucratic convenience, a societal signal that the person cannot currently participate in social life, not an ontological end.

  **Is it Coherent?**
  It is internally coherent *if* one accepts that identity is substrate-independent. If the "you" is the data, then preserving the hard drive (the brain structure) preserves the "you," even if the computer is turned off.
  However, it creates a **temporal dissonance**. For the state, your uncle ceases to exist at 2:00 PM on Tuesday. For the cryonics organization, 2:00 PM on Tuesday is the moment of admission to the ICU. He is simultaneously a corpse (for the IRS) and a patient (for the cryonicists). This is not logically contradictory, but it is *juridically* unstable. It relies on a "fiction of law" (that he is dead) coexisting with a "hope of science" (that he is sleeping).

  ### 2. The Theory of the Person: Patternism vs. Animalism

  This is the crux of the metaphysical wager.

  **The Implicit Theory: Patternism (Psychological Continuity)**
  Cryonics makes the most sense under a **Patternist** view of personal identity. This view holds that you are not your specific atoms, but the *pattern* those atoms form. Specifically, it relies on a neuro-reductionist version of John Locke's theory of identity: you are where your memories and psychological continuity are. If the pattern of your brain is preserved, *you* are preserved.

  **Can Other Views Sign Up Coherently?**
  *   **The Biological Organism View (Animalism):** If your uncle believes he is essentially a living biological organism (a human animal), cryonics is on shaky ground. An organism is defined by its metabolic processes. A frozen body is not metabolizing; it is a statue of a human. To sign up coherently, an Animalist must believe that an organism can be "paused" without ceasing to be that organism. This is biologically unprecedented. However, they could argue that the *potential* for metabolism is preserved, making it a high-stakes medical gamble rather than a metaphysical certainty.
  *   **The Dualist/Soul View:** If your uncle believes a non-physical soul departs at legal death, cryonics cannot *cause* survival. However, it can be coherent as a bet on **resurrection**. If the soul waits in an afterlife for the body to be repaired, preserving the body makes it easier for God (or future tech) to reunite the soul with the vessel. In this view, cryonics isn't about *preventing* death, but about *preparing the vessel* for a return.

  **Verdict:** The practice is *optimized* for Patternism, but *compatible* with Dualism (as resurrection prep) and *strained* under strict Animalism (unless "life" is redefined to include suspended animation).

  ### 3. The Brain vs. Body Puzzle

  The offer of two options (Neuropreservation vs. Whole Body) reveals a pragmatic hedge against the philosophical uncertainty described above.

  **Do they presuppose different views?**
  *   **Neuropreservation (Brain Only):** This strictly implies **Patternism**. It assumes the body is mere life support, discardable once the data (brain) is safe. It assumes future technology can grow a new body or upload the mind.
  *   **Whole Body:** This leans toward **Animalism** or caution. It assumes the body might be necessary for identity (perhaps somatic markers or hormonal systems contribute to the "self") or that growing a new body is harder than fixing the old one.

  **How can the organization offer both?**
  They can offer both because they are selling **optionality**, not metaphysical truth.
  1.  **Market Capture:** They capture the Patternists (cheaper, brain only) and the Animalists/Cautious (expensive, whole body).
  2.  **Technological Agnosticism:** The organization admits it does not know *how* revival will happen. If revival requires a body, whole body wins. If revival is software-based, brain wins. By offering both, they admit their own ignorance regarding the future mechanism of salvation.
  3.  **Insurance:** Whole body preservation can be seen as "insurance" against the failure of head-transplant technology. If you can't put the brain in a new body, at least you have the original one.

  There is no contradiction here, only a recognition that the *path* to revival is unknown, even if the *goal* (preserving the person) is the same.

  ### 4. The Uploading Puzzle: Continuity vs. Copying

  This is the most philosophically volatile aspect.

  **The Implicit Theory: Reductionism**
  For uploading to count as *survival* rather than *replication*, the practice must presuppose a **Reductionist** view of identity (akin to Derek Parfit). This view argues that there is no "deep further fact" of identity. What matters is not that the *same substance* continues, but that *psychological continuity* is maintained.

  If your uncle believes he is a specific, unique substance that cannot be copied, uploading is suicide. A scan-and-upload process destroys the original brain to read it. If the upload wakes up, is it him?
  *   **Patternist says:** Yes. The pattern continued.
  *   **Substance Dualist/Biological Essentialist says:** No. That is a copy. The original died.

  **Can the practice stay neutral?**
  The *company* can stay neutral by framing it as "We preserve the information necessary for *some form* of recovery."
  However, *your uncle* cannot stay neutral if he wants to believe he will survive. To bet on uploading is to bet that **Psychological Continuity is sufficient for Identity.** He must accept that if his neurons are replaced by silicon simulations that function identically, *he* is still there. If he believes his biological flesh is essential to his "self," the uploading option renders the contract incoherent as a survival strategy.

  ### 5. The Societal Tension: The Ontological Clash

  You noted the oddity that the state treats him as gone while the company treats him as a patient. This is an **Ontological Clash**.

  *   **The State's View:** Death is a binary switch required for social order. Property must move, marriages must end, and responsibilities must cease. The state cannot handle a category of "Legally Dead but Ontologically Pending." It creates too much friction (Who inherits the house if he might come back in 200 years? Is it murder to unplug him?).
  *   **The Cryonicist's View:** Death is a gradient. The "switch" is a social construct that lags behind medical reality.

  **Where is the tension?**
  The tension is managed by a **Legal Fiction**. Your uncle must agree to be declared dead. He cannot be legally "alive" while frozen, or he would be a prisoner (unable to leave the facility) and a tax liability. The cryonics arrangement relies on the state *ignoring* his potential future life so that his current estate can fund his future revival.
  *   **The Paradox:** He must be dead enough to pay for his revival, but alive enough to benefit from it.
  *   **The Resolution:** The contract treats him as **property** (a preserved asset) owned by the organization, rather than a **person** (a rights-holder). He is currently a "legal corpse with potential." He only regains personhood upon revival.

  ### Summary Reconstruction

  Here is the implicit theory your uncle has subscribed to, reconstructed from the practice:

  1.  **Metaphysics:** Physicalism. The mind is what the brain does. There is no soul that vanishes at the moment of legal death.
  2.  **Identity:** Patternism. You are the information structure of your connectome, not the specific atoms currently holding it.
  3.  **Death:** Information-Theoretic. Death is the loss of data, not the cessation of metabolism.
  4.  **Continuity:** Psychological. Survival is maintained by the continuity of memory and personality, even if the substrate changes (biology to software) or time is interrupted (centuries of freezing).
  5.  **Legal Status:** Pragmatic Dualism. Accepting "Legal Death" as a necessary administrative hurdle to secure the funding and legal protection required for "Ontological Stasis."

  **Where it is Underdetermined:**
  The practice does not dictate *how* revival happens. It is compatible with biological repair, cloning, or uploading. It is also compatible with religious resurrection (as body prep). This ambiguity is a feature, not a bug; it allows people with different metaphysical commitments (e.g., the Transhumanist and the Christian) to sign the same contract for different reasons.

  **Where it is in Tension:**
  The tension lies in the **Status Gap**. Society requires your uncle to be *gone* so that the living can move on. Cryonics requires him to be *here* (in stasis) so that he can return. The arrangement works only because the frozen body makes no claims on the living world. It is a silent bet against the finality of the death certificate, funded by the very legal system that asserts that finality.

  Your uncle has essentially wagered that the law is wrong about what he is, while relying on the law to pay for the proof.
