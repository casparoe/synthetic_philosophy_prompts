prompt: |-
  I design the visual reasoning section of the entrance exam for an architecture school. Every year we need about 40 items in the style of Bongard problems: two panels, six small drawings each, left panel all sharing some property, right panel all lacking it, and the student has to state the property (or classify new drawings into which panel they belong to). I say "in the style of" because we don't copy his geometric vocabulary, but the logic is his: induce a concept from a handful of positive and negative examples.

  My problem is that quality is wildly inconsistant, because different item writers have different instincts about what makes an item solvable-but-not-trivial. Some items are basically free points (one obvious thing all left drawings have and right ones don't, like "contains a circle"). Others are basically unsolvable in the time we give — we've had complaints, and when we check, the intended rule turns out to be something like "the number of elements times the number of enclosed regions is even", which no sane person finds in 90 seconds. And a middle category worries me most: items where a student gets the right answer through a shortcut the writer never intended. E.g. the left panels happen to be busier than the right ones, so "more cluttered" works even though the intended rule was about symmetry.

  So what I want is a procedure my item writers can actually follow — a checklist they run on every draft item, in order: what to check, what counts as passing, where it stops with "kill this item", and where it flags the item for a human judgment call (I'm guessing "is this rule interesting" can't itself be reduced to a rule). Ground it in whatever is actually known about how people induce concepts from few examples — needing contrast cases, near-miss negatives being more informative than random ones, the difference between a rule that's a conjunction of per-object features vs. a relation among parts, that kind of thing. And be honest about which of these ideas are solid findings and which are basically folklore that got passed down.

  For what it's worth, here's my own half-baked theory, which you can evaluate as part of this: I think the best items are ones where the MOST salient thing about the left panel is NOT the answer — the drawings lure you toward a wrong rule and you have to dig past it. If that's right it should show up somewhere in the procedure, but if it's wrong or only sometimes right, tell me.

  Then run the procedure on the three draft items below. Note that Item B is one I personally like and am proud of — apply the procedure honestly even if it comes out against me. Also say what the procedure can't do: I suspect there's no real substitute for testing on fresh solvers, so at minimum tell me whether the procedure can recognize when that's needed.

  Constraints: each writer produces maybe 15 items a season and has at most 20 minutes per item to run the procedure. They're mostly art school graduates with no philosophy or psych background, so whatever you extract from the theory has to survive the translation. Two senior designers (me and a colleague) sign off on anything the procedure flags as a judgment call.

  The three drafts (described, not drawn):

  Item A — Left panel: six drawings, each a small central figure (cross, triangle, blob) with two or three straight lines radiating from it at odd angles, the lines noticeably longer on one side of each figure. Right panel: same kind of figures, but the radiating lines are symmetric, same length on both sides. Intended rule: "asymmetry" — left figures have a visually heavier side. My worry: "heavier on one side" and "asymmetric" might be two rules, not one, and I can't tell which one a student will find, or whether different students find different ones.

  Item B — Left panel: six drawings, each containing exactly two shapes, one nested inside the other (circle in a square, square in a triangle, etc.). Right panel: six drawings, each containing exactly two shapes side by side, not nested. Intended rule: "one shape contains the other." This is the one I like — it feels clean and satisfying. But apply the procedure honestly.

  Item C — Left panel: six drawings of objects (a house, a tree, a boat, a ladder, a fence, a bridge). Right panel: six drawings of other objects (a ball, an apple, a cloud, a sun, a stone, an egg). Intended rule: "man-made vs. natural." I already suspect this one is a disaster for several reasons, but I want the procedure to say so systematically rather than just my gut saying so.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and analysis:

  1.  **Deconstruct the Request:**

      *   **Goal:** Create a quality control procedure (checklist) for designing visual reasoning exam items (Bongard-style).
      *   **Context:** Architecture school entrance exam. ~40 items/year. Writers are art school grads (no psych/phil background). Time limit: 20 mins/item for the check.
      *   **Problem:** Inconsistent quality (too easy, too hard, unintended shortcuts).
      *   **Requirements:**
          *   Grounded in concept induction theory (solid findings vs. folklore).
          *   Evaluate the user's "salience theory" (best items lure you to a wrong rule).
          *   Apply the procedure to three specific draft items (A, B, C).
          *   Be honest about limitations (need for field testing).
          *   Format: Actionable checklist + Theoretical grounding + Item Analysis.

  2.  **Theoretical Grounding (Concept Induction & Psychometrics):**

      *   *Solid Findings:*
          *   **Contrastive Learning:** Humans learn rules better by comparing positive and negative examples (Bongard's core insight).
          *   **Near Misses:** Negative examples should be very similar to positives except for the critical feature (Winston's "Near Miss" theory). Random negatives make it too easy; identical negatives make it impossible.
          *   **Salience & Attention:** High-salience features (color, size, obvious shape) grab attention first. If the rule is low-salience, it's harder.
          *   **Cognitive Load:** Working memory limits. Counting complex relations is harder than spotting a single feature.
          *   **Rule Complexity:** Conjunctive rules (A AND B) are harder than single-feature rules. Relational rules (inside, above) are harder than attribute rules (red, circle).
          *   **Ambiguity:** If multiple rules fit the data, the item is invalid (construct-irrelevant variance).
      *   *Folklore/Nuance:*
          *   "Trickery" (User's Theory): Luring to a wrong rule *can* increase discrimination, but if the lure is *too* strong, it becomes a "gotcha" item which measures test-taking cynicism rather than reasoning. It needs balance.
          *   "Interestingness": Subjective. Hard to codify, but correlates with "non-trivial relational rules."

  3.  **Developing the Procedure (The Checklist):**

      *   *Constraint:* 20 minutes max. Art school background.
      *   *Structure:* Needs to be a funnel. Pass/Fail gates.
      *   *Steps:*
          1.  **The "One-Liner" Test:** Can the rule be stated simply? (Validity)
          2.  **The "Near Miss" Check:** Are the Right Panel items *almost* like the Left? (Difficulty control)
          3.  **The "Alternative Rule" Scan:** Can I solve this a different way? (Validity/Shortcut check)
          4.  **The "Salience" Audit:** Is the rule the most obvious thing? (Difficulty/Salience Theory check)
          5.  **The "Counting/Calculation" Ban:** Does it require math? (Cognitive Load check)
      *   *Decision Points:* Kill, Fix, Flag for Senior Review.

  4.  **Evaluating the User's "Salience Theory":**

      *   *Theory:* Best items lure you to a wrong rule.
      *   *Verdict:* Partially true, but dangerous.
      *   *Nuance:* It's called "Distractor Validity." If the distractor is *plausible* but *falsifiable* upon closer inspection, it's good. If the distractor is *equally valid*, the item is broken. If the distractor is *obviously wrong*, it's just noise.
      *   *Integration:* The checklist needs to distinguish between a "productive struggle" (digging past salience) and a "broken item" (multiple valid rules).

  5.  **Applying the Procedure to the Draft Items:**

      *   **Item A (Asymmetry vs. Heaviness):**
          *   *Rule:* Asymmetry.
          *   *Check:* Is "heavier on one side" different from "asymmetric"? Yes, technically, but visually similar.
          *   *Risk:* Ambiguity. Is it about the *lines* or the *whole figure*?
          *   *Verdict:* Flag for Review. Needs tighter control on the "negative" examples to ensure they aren't just "symmetric" but specifically "balanced weight."
      *   **Item B (Nesting vs. Side-by-Side):**
          *   *Rule:* Containment.
          *   *Check:* Is it too easy? "One inside other" is very salient.
          *   *Risk:* Might be a "free point" item (too easy).
          *   *Verdict:* Pass on validity, Flag on Difficulty. Might need more visual noise to ensure it's not *too* obvious.
      *   **Item C (Man-made vs. Natural):**
          *   *Rule:* Semantic category.
          *   *Check:* Visual reasoning or knowledge test?
          *   *Risk:* Cultural bias, drawing style dependency (is a cloud man-made in a cartoon?), not purely visual logic.
          *   *Verdict:* Kill. Violates the "visual reasoning" construct.

  6.  **Refining the Output:**

      *   *Tone:* Professional, collaborative, authoritative but accessible.
      *   *Formatting:* Clear headings, bullet points, distinct sections for Theory, Procedure, and Item Analysis.
      *   *Constraint Check:* Ensure the procedure fits the 20-minute limit and the writers' background. Avoid jargon like "construct-irrelevant variance" without explanation.

  7.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is the checklist too long for 20 minutes?
      *   *Fix:* Keep the questions binary (Yes/No). Add a "Stop" rule.
      *   *Critique:* Did I address the "Solid vs. Folklore" requirement?
      *   *Fix:* Add a specific sidebar or section distinguishing evidence-based guidelines from heuristics.
      *   *Critique:* Did I handle Item B honestly?
      *   *Fix:* Even though the user likes it, I must point out it might be too easy (ceiling effect) unless the shapes are complex.

  8.  **Final Polish:** Check against the prompt's specific request for "where it stops with kill this item" and "where it flags for human judgment." Ensure the distinction between *visual* reasoning and *semantic* knowledge is clear (crucial for Item C).

  *(Self-Correction on User's Theory)*: I need to be careful not to validate the "lure" theory too much. In psychometrics, misleading items are often flagged as biased. However, in *reasoning* tests, overcoming a perceptual bias *is* the skill. I will frame it as "Perceptual Interference" — valid if the interference can be resolved by the rule, invalid if the interference creates a second valid rule.

  *(Final Plan)*:
  1. Introduction & Theory Grounding (Solid vs. Folklore).
  2. The 20-Minute Protocol (The Checklist).
  3. Analysis of Items A, B, C.
  4. Limitations of the Procedure.
  5. Closing advice.cw
answer: |-
  Here is a procedure designed for your constraints (20 minutes, art-school background, high volume) grounded in cognitive science, followed by an honest application of that procedure to your three draft items.

  ### Part 1: The Theory (Solid Findings vs. Folklore)

  Before the checklist, your writers need to know *why* they are checking these things. Here is the translation of concept induction research into plain language.

  **Solid Findings (Evidence-Based)**
  1.  **The "Near Miss" Principle:** (Winston, 1970s). Negative examples (Right Panel) must be visually similar to positive examples (Left Panel) but lack the specific rule. If the Right Panel is random noise, the item measures "spotting the obvious" not "inducing the rule."
  2.  **Uniqueness of Solution:** (Psychometrics 101). If two different rules fit the data equally well, the item is invalid. It measures guesswork, not reasoning.
  3.  **Visual vs. Semantic:** Visual reasoning tests should not rely on external knowledge (e.g., knowing what a "bridge" is). They must rely on properties visible in the ink (lines, shapes, relations).
  4.  **Working Memory Load:** Rules requiring counting >3 items, or multi-step math (regions × lines), exceed working memory limits for a 90-second task.

  **Folklore / Nuance (Heuristics)**
  1.  **The "Lure" Theory (Your Theory):** *Verdict: Partially True.* Research calls this **Perceptual Interference**. It is good to have a high-salience feature that is *not* the rule, provided the student can disprove it. It is bad if the lure is a *valid alternative rule*.
      *   *Good:* "It looks like it's about size, but actually it's about orientation." (Size varies in both panels).
      *   *Bad:* "It looks like it's about size, and actually all left are big." (Now size is a valid shortcut).
  2.  **"Interesting" Rules:** This is subjective. However, in architecture, **Relational Rules** (inside, touching, parallel) are generally better predictors of design potential than **Attribute Rules** (is red, is a circle).

  ---

  ### Part 2: The 20-Minute Quality Control Protocol

  **Instructions for Writers:** Run these 5 checks in order. If you hit a **KILL**, stop and discard the item. If you hit a **FLAG**, send it to Senior Review. If you pass all, the item is ready for the bank.

  #### Check 1: The "One-Sentence" Rule (Validity)
  *   **Action:** Write down the intended rule in one simple sentence.
  *   **Pass:** "Left shapes contain a closed loop; Right shapes do not."
  *   **Fail (KILL):** "Left shapes feel more dynamic" or "It's about the balance of weight." (Vague/Subjective).
  *   **Fail (KILL):** "The number of lines plus the number of corners is prime." (Computational/Arithmetic).
  *   **Why:** If you can't state it simply, the student can't induce it reliably.

  #### Check 2: The "Near Miss" Audit (Difficulty)
  *   **Action:** Look *only* at the Right Panel (Negatives). Do they look like they *could* belong to the Left Panel?
  *   **Pass:** The Right Panel items look very similar to the Left, but break the specific rule.
  *   **Fail (KILL):** The Right Panel looks totally different (e.g., Left = Geometric, Right = Organic). This makes the item a "free point."
  *   **Flag:** The Right Panel items are *identical* to Left Panel items except for one tiny pixel. This makes it an eyesight test, not a reasoning test.
  *   **Why:** Learning happens at the boundary. If the boundary is a mile wide, no learning is demonstrated.

  #### Check 3: The "Alternative Rule" Scan (Ambiguity)
  *   **Action:** Spend 2 minutes trying to find a *different* rule that separates Left from Right.
  *   **Pass:** You cannot find another consistent rule.
  *   **Fail (KILL):** You find a second rule (e.g., Intended = "Containment", Alternative = "Left has more ink").
  *   **Flag:** You find a second rule, but it requires counting or measuring, whereas the intended rule is immediate. (Send to Senior Review to decide if the shortcut is too easy).
  *   **Why:** Multiple valid keys invalidate the score.

  #### Check 4: The "Salience" Check (Your Theory)
  *   **Action:** Identify the most obvious visual feature (color, size, boldness). Is that the rule?
  *   **Pass (Ideal):** The most obvious feature is *constant* across both panels (e.g., all are black). The rule is a subtler relation.
  *   **Pass (Lure):** The most obvious feature *varies* but does not match the panels (e.g., Left has big and small, Right has big and small). This forces the student to ignore salience.
  *   **Fail (KILL):** The most obvious feature *is* the rule (e.g., Left = Big, Right = Small). This is a "free point" item.
  *   **Why:** We want to test if they can suppress a dominant percept to find a structural truth.

  #### Check 5: The "Knowledge" Filter (Bias)
  *   **Action:** Cover the labels (if any). Can you solve this without knowing what the objects represent?
  *   **Pass:** Yes. The shapes alone dictate the answer.
  *   **Fail (KILL):** No. You need to know what a "tree" or "house" is.
  *   **Why:** Architecture reasoning is about form, not vocabulary. Cultural knowledge introduces bias.

  ---

  ### Part 3: Application to Draft Items

  Here is the procedure run honestly on your three drafts.

  #### Item A (Asymmetry / Heaviness)
  *   **Check 1 (One-Sentence):** "Left figures are asymmetric; Right figures are symmetric." -> **PASS.** (Though "heavier side" is vague, "asymmetric" is definable).
  *   **Check 2 (Near Miss):** Right panel has symmetric lines. Left has asymmetric. They look very similar. -> **PASS.**
  *   **Check 3 (Alternative Rule):** You noted "heavier on one side." If the Left panel lines are longer on the right, and Right panel lines are equal, does "Total Line Length" work? If Left always has more total ink than Right, that's a shortcut. -> **FLAG.** (Seniors must measure total ink area to ensure it's not a confounding variable).
  *   **Check 4 (Salience):** Asymmetry is high salience. Is there a lure? If the shapes (cross, blob) vary randomly, that's good. If the Left shapes are all "sharp" and Right are all "round," that's a shortcut. -> **FLAG.** (Check shape variety).
  *   **Check 5 (Knowledge):** Purely geometric. -> **PASS.**
  *   **Verdict:** **FLAG FOR SENIOR REVIEW.**
      *   *Reason:* "Asymmetry" is a binary state, but "Heaviness" is a gradient. If the Left panel includes items that are *technically* asymmetric but visually balanced, students will argue. Seniors need to verify the "Near Miss" negatives aren't just "Symmetric" but specifically "Balanced."

  #### Item B (Nesting / Containment)
  *   **Check 1 (One-Sentence):** "Left: One shape inside another. Right: Shapes side-by-side." -> **PASS.**
  *   **Check 2 (Near Miss):** Side-by-side shapes can look very similar to nested shapes if they touch. If the Right Panel shapes are far apart, it's too easy. -> **FLAG.** (Ensure Right Panel shapes are touching or very close, making "containment" the only distinct factor).
  *   **Check 3 (Alternative Rule):** Does "Left" always have fewer total lines than "Right"? (A square in a square = 8 lines. Two squares side by side = 8 lines). If the line count matches, good. If not, it's a counting shortcut. -> **FLAG.** (Check line count parity).
  *   **Check 4 (Salience):** Containment is extremely salient. This is the "most obvious thing." -> **FAIL (KILL) on Difficulty Grounds.**
      *   *Reason:* You mentioned you like this one. It is logically clean. But per Check 4, if the rule is the *most* obvious feature, it is a "free point" item. In a competitive exam, this wastes a slot. It should be used only if you need to boost the overall pass rate.
  *   **Check 5 (Knowledge):** Geometric. -> **PASS.**
  *   **Verdict:** **KILL (for a competitive exam) / KEEP (for a warm-up).**
      *   *Honest Take:* It is a valid item, but likely too easy for a selective architecture entrance exam unless the shapes are complex enough to obscure the boundary.

  #### Item C (Man-made vs. Natural)
  *   **Check 1 (One-Sentence):** "Left: Man-made objects. Right: Natural objects." -> **PASS.**
  *   **Check 2 (Near Miss):** A cloud and a stone vs. a house and ladder. Visually distinct. -> **PASS.**
  *   **Check 3 (Alternative Rule):** "Left has straight lines; Right has curved lines." (Trees have branches, clouds are curved). This is a massive visual shortcut that bypasses the semantic rule. -> **FAIL (KILL).**
  *   **Check 4 (Salience):** The semantic category is the rule. -> **FAIL (KILL).**
  *   **Check 5 (Knowledge):** Requires knowing what a "bridge" or "sun" is. -> **FAIL (KILL).**
      *   *Reason:* This violates Check 5 fundamentally. If a student draws a "stone" that looks like a cube, is it natural? If they draw a "tree" that looks like a lollipop, is it man-made? This measures drawing convention and cultural knowledge, not visual reasoning.
  *   **Verdict:** **KILL.**
      *   *Reason:* Systematically invalid. It tests semantic memory, not visual induction.

  ---

  ### Part 4: What This Procedure Cannot Do

  You asked for honesty about limitations. This checklist is a **filter**, not a **guarantee**.

  1.  **It Cannot Detect "Group Think":** If all your item writers are from the same art school, they may share a blind spot (e.g., they all think "hatching implies shadow" is a universal rule). The checklist assumes the writer is a proxy for the student, but they are not.
  2.  **It Cannot Measure Time Pressure:** A rule might be inducible in 5 minutes but not 90 seconds. The checklist checks *logic*, not *processing speed*.
  3.  **It Cannot Validate the "Lure":** The checklist flags items where a lure *might* exist. It cannot confirm if the lure is *productive* (leads to deeper thinking) or *destructive* (leads to frustration).

  **The "Human Judgment" Requirement:**
  The procedure flags Items A and B for you. This is where your Senior Review comes in.
  *   **For Item A:** You must decide if "Asymmetry" is too subjective.
  *   **For Item B:** You must decide if "Too Easy" is acceptable for your exam balance.
  *   **For Item C:** The procedure killed it. Do not override this without changing the stimuli to abstract shapes.

  **Final Recommendation on Field Testing:**
  You suspected there is no substitute for testing. You are right.
  *   **The "5-Student Sprint":** Before finalizing the exam, take 5 draft items that passed the checklist. Give them to 5 students who are *not* in the art school (e.g., high schoolers).
  *   **Ask them to think aloud.** If 3 out of 5 find a shortcut you didn't see, the item is broken.
  *   **Time them.** If the average time is >2 minutes, the cognitive load is too high, regardless of how "clean" the logic is.

  ### Summary for Your Writers
  1.  **Don't be clever.** (Avoid Item C).
  2.  **Don't be obvious.** (Avoid Item B unless needed for difficulty balancing).
  3.  **Be precise.** (Refine Item A to ensure "asymmetry" isn't confused with "ink weight").
  4.  **Use the Checklist.** It takes 20 minutes and saves 20 hours of arguing about validity later.
