answer: |-
  Here is a complete lesson plan designed for a tight 50-minute window. It prioritizes the "Aha!" moment over complex mechanics.

  # Lesson Plan: The Handicap Game
  **Time:** 50 Minutes
  **Class Size:** 12 Students
  **Goal:** Demonstrate that signal cost is not a bug, but a feature. Without cost, information evaporates (Pooling Equilibrium). With differential cost, honesty emerges (Separating Equilibrium).

  ## 1. Preparation (Before Class)
  *   **Prizes:** A bag of candy or stickers. Top 3 scorers get a prize. (Tangible stakes prevent "it's just a game" apathy).
  *   **Envelopes:** Prepare 6 envelopes labeled **SENDER**.
      *   3 envelopes contain a card: **"TYPE HIGH. Your Signal Cost: 2 Points."**
      *   3 envelopes contain a card: **"TYPE LOW. Your Signal Cost: 12 Points."**
  *   **Sheets:** 12 simple scorecards (Name, Round 1 Score, Round 2 Score, Total).
  *   **Board:** Write the **Receiver Payoff** clearly on the board before they arrive:
      *   *Guess HIGH & Correct:* +5 Points
      *   *Guess LOW & Correct:* +5 Points
      *   *Guess Wrong:* 0 Points

  ## 2. The Setup (5 Minutes)
  **Script:**
  "Today we are testing the Handicap Principle. We have two roles: **Senders** (6 of you) and **Receivers** (6 of you).
  *   **Senders:** You have a hidden 'Quality' (High or Low). You want Receivers to think you are High. You can choose to **Signal** or stay **Silent**. Signaling costs points, deducted from your final score.
  *   **Receivers:** You want to guess the Sender's true type. You get points for correct guesses.
  *   **The Economy:** Points = Candy. Top 3 scores win.

  **Crucial Rule:** Senders, your envelope tells you your **Type** and your **Cost**. Receivers, you know that *generally* High Types find signaling easier than Low Types, but you don't know individual costs. Senders, do not show your envelope."

  *   **Logistics:** Seat Senders on one side, Receivers on the other. Hand out envelopes to Senders. Hand out scorecards to everyone.

  ## 3. Round 1: The Handicap (10 Minutes)
  **Mechanic:** High Cost / Separating
  1.  **Sender Decision:** Senders look at their cost. They write **"SIGNAL"** or **"SILENT"** on a card.
      *   *Math:* Reward for being judged "High" is **10 Points** (added to score).
      *   *High Type:* Cost is 2. Net gain if believed = +8.
      *   *Low Type:* Cost is 12. Net gain if believed = -2. (Rational Low Types should stay Silent).
  2.  **Transmission:** Senders hold up their card. Receivers see "SIGNAL" or "SILENT."
  3.  **Receiver Decision:** Receivers write **"HIGH"** or **"LOW"** for each Sender.
  4.  **Reveal & Score:**
      *   Senders reveal Type cards.
      *   Calculate scores. (e.g., High Type Signaled + Believed = 10 - 2 Cost = 8 pts).
      *   Receivers get +5 for correct ID.

  **Expected Outcome:** High Types Signal. Low Types stay Silent. Receivers guess "High" on Signals, "Low" on Silence. Everyone is happy. Information is perfect.

  ## 4. Round 2: The Crash (10 Minutes)
  **Mechanic:** Zero Cost / Pooling
  **Script:**
  "New Technology. Signaling is now free. **Cost is 0 for everyone.** The Reward for being judged High is still 10 Points."

  1.  **Sender Decision:** Write "SIGNAL" or "SILENT".
      *   *Math:* Cost is 0.
      *   *High Type:* Net gain = +10.
      *   *Low Type:* Net gain = +10. (Now it is profitable for Low Types to mimic!).
  2.  **Transmission:** Senders hold up cards.
  3.  **Receiver Decision:** Receivers guess types.
  4.  **Reveal & Score:** Reveal types.

  **Expected Outcome:** **Everyone Signals.** Receivers stare at a sea of "SIGNAL" cards. They have no information. They must guess randomly.
  *   *The Lesson:* Low Types likely score *higher* in Round 2 than Round 1 (because they successfully mimicked). High Types score the same. But the *Receivers'* accuracy plummets. The signal's value has been destroyed by efficiency.

  ## 5. The Debrief (25 Minutes)
  *Do not let them pack up early. This is where the learning happens.*

  ### A. Equilibria (5 Mins)
  Ask: "What happened to the Receivers' accuracy in Round 2?"
  *   **Round 1 (Separating Equilibrium):** Costs were high enough that Low Types couldn't afford to fake it. The signal was honest *because* it was expensive.
  *   **Round 2 (Pooling Equilibrium):** Costs dropped. Low Types mimicked. The signal became noise.
  *   **Key Takeaway:** If you optimize for efficiency (remove waste), you destroy information. The waste is load-bearing.

  ### B. Marginal Cost of Signaling (5 Mins)
  Ask: "Why didn't the Low Types signal in Round 1? They wanted the points."
  *   Explain **Differential Cost.** It's not that Low Types *can't* signal; it's that the cost hurts them *more*.
  *   In biology: A peacock with parasites *can* grow a big tail, but it might die from the energy drain. A healthy peacock survives the drain. The cost is the same, the *marginal utility* differs.
  *   In our game: I artificially gave Low Types a higher point cost to model that physiological burden.

  ### C. Handicaps vs. Indices (5 Mins)
  Draw a line on the board: **Handicap** vs. **Index**.
  *   **Handicap (Peacock Tail):** Costly to produce. Honest because faking is *unprofitable* (you'll go bankrupt/die). Can be faked in theory, just not in practice.
  *   **Index (Deep Voice):** Physically linked to size. Honest because faking is *impossible* (you can't fit a deep voice box in a small throat without surgery).
  *   **Question:** "Is a PhD a Handicap or an Index?"
      *   *Discussion:* It's mostly a Handicap (time/effort cost). But if the degree becomes too easy (Cost drops), it loses value (Grade inflation/Pooling).

  ### D. Human Signaling (10 Mins)
  Ask: "Does this apply to humans? Conspicuous consumption? Hazing?"
  *   **Conspicuous Consumption (Luxury Watches):** Classic Handicap. Burning money to show you have money to burn. If everyone could print fake Rolexes easily (Cost drops), the signal dies.
  *   **Hazing/Fraternity Pledging:**
      *   *Handicap View:* Pain is the cost. Only those truly committed (High Quality members) will endure it.
      *   *Counter-argument:* Sometimes hazing is an **Index** of loyalty, not quality. Or, it creates *group cohesion* (a different biological model: coalition signaling).
      *   *Critical Thought:* Human signaling is messy. We signal to multiple audiences at once. A peacock signals to peahens. A human buying a Tesla signals to peers (status), the environment (values), and the bank (creditworthiness).
  *   **The Trap:** Humans try to find "cheap talk" solutions (LinkedIn endorsements, Instagram likes). What happens? The signal pools. Everyone has 500+ connections. It means nothing. We then invent new costly signals (verified checkmarks, exclusive clubs). The arms race continues.

  ## 6. Troubleshooting: What Will Go Wrong
  *Predict these issues and have a script ready.*

  **1. The "Low Type" Rebellion**
  *   **Problem:** In Round 1, a Low Type student signals anyway, taking the -2 point hit just to be difficult or because they miscalculated.
  *   **Impact:** Receivers get confused. "I saw a signal, but they were Low!"
  *   **Fix:** **Use this.** In the debrief, say: "Noise exists in nature. Mutations happen. But if too many Low Types signal, Receivers stop trusting the signal, and the system collapses. One rebel proves the rule: the cost *should* have stopped them."

  **2. Collusion / "Let's All Win"**
  *   **Problem:** Students talk across the aisle. "I'm Low, I won't signal, you guess Low."
  *   **Impact:** Ruins the incentive structure.
  *   **Fix:** **Seating & Secrecy.** Keep Senders and Receivers separated. Remind them: "This is a competition for candy. If you help the other side, you lower your own rank." If you catch collusion, disqualify that pair from the prize (playfully).

  **3. Time Creep**
  *   **Problem:** The game takes 25 minutes, leaving 15 for debrief.
  *   **Fix:** **Hard Stop.** At minute 25, say "Pens down. We are moving to debrief even if Round 2 isn't scored." The debrief is the actual lecture; the game is just the hook. You can explain Round 2's outcome theoretically if you run out of time to play it.

  **4. "This is Silly"**
  *   **Problem:** Students refuse to "pay" points or do the task.
  *   **Fix:** **Frame it as Econ, not Play.** "You are rational agents maximizing utility." If they refuse to pay the cost, ask them: "Are you saying the cost of signaling in nature is zero? If so, why don't gazelles stot all the time?" Use their resistance as data points about human vs. biological incentives.

  ## Instructor Cheat Sheet (Payoff Matrix)
  | | **Receiver Guesses HIGH** | **Receiver Guesses LOW** |
  | :--- | :--- | :--- |
  | **Sender: HIGH (Cost 2)** | Sender: +8 (10-2) <br> Receiver: +5 | Sender: 0 (No bonus - 2) <br> Receiver: 0 |
  | **Sender: HIGH (Cost 2)** | *(If Silent)* <br> Sender: 0 <br> Receiver: 0 | *(If Silent)* <br> Sender: 0 <br> Receiver: +5 |
  | **Sender: LOW (Cost 12)** | Sender: -2 (10-12) <br> Receiver: 0 | Sender: 0 (No bonus) <br> Receiver: +5 |
  | **Sender: LOW (Cost 12)** | *(If Silent)* <br> Sender: 0 <br> Receiver: 0 | *(If Silent)* <br> Sender: 0 <br> Receiver: +5 |

  *Note: In Round 2, change Cost to 0 for everyone.*
