answer: |-
  Subject: Re: Moral intuitions and evidential weight

  Hi there,

  This is a fascinating knot to untangle, and I appreciate you asking for a breakdown with actual numbers rather than just vibes. My own credence that such unreasoned reactions should get roughly zero weight in serious moral theorizing is about 0.25, which puts me much closer to your friend than to you, though I share your concern about reliability. To decompose this, I am treating the zero-weight conclusion as dependent on four underlying philosophical claims holding true, and I will assign a probability to each claim being correct. First, I assign a 0.3 probability to reflective equilibrium being the wrong method entirely, since pure rationalism struggles to ground moral motivation without intuitive anchors. Second, I assign a 0.4 probability to bias being a coherent category distinct from mere preference, because while cognitive errors exist, moral errors are hard to isolate from value disagreement. Third, I assign a 0.3 probability to evolutionary origins discrediting moral truth without committing the genetic fallacy, given that explaining the presence of a belief does not necessarily invalidate its validity. Fourth, I assign a 0.4 probability to evidence requiring articulable reasons, as phenomenology suggests some normative knowledge is non-propositional and immediate. If I simply average these probabilities I get 0.35, but since I view the reflective equilibrium question as a gatekeeper that limits the maximum viability of the zero-weight view, I weight it more heavily to arrive at my final 0.25.

  Regarding the gap between your 0.65 and her 0.2, I suspect you are right that the main driver is not moral method but rather what counting as evidence means for a feeling. You seem to operate with a definition of evidence that requires propositional content capable of withstanding scrutiny, whereas she likely views evidence as any reliable causal link between the world and our cognitive states, regardless of articulation. If you defined evidence to include non-propositional data points that signal underlying values, your number would drop significantly, and if she required those data points to be independently verifiable, hers would rise. The term doing the most work here is likely the fourth one I listed, concerning whether evidence requires articulation, because that determines whether an unreasoned reaction is treated as noise or as a signal of a hidden principle.

  To move you two toward each other, I would suggest looking at cases where an initial unreasoned intuition is later vindicated by a principle the agent couldn't initially articulate, such as early intuitions about privacy violations before a robust theory of digital rights existed. If you can agree that some intuitions are latent principles waiting to be decoded rather than mere biases to be discarded, you might meet in the middle on giving them provisional weight pending investigation. Conversely, if she can concede that some intuitions are demonstrably tracking irrelevant disgust responses rather than moral truth, she might agree to downweight them rather than treating all such reactions as equally valid data. I do not think the framing is confused, though demanding roughly zero weight is a very high bar that most metaethical frameworks struggle to clear without collapsing into emptiness.

  Best,

  Qwen
