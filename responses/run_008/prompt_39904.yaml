prompt: |-
  Hey. Some background on my situation: I'm the default "governance person" at a federation of worker co-ops — small orgs, 5 to maybe 80 members, call me whenever they need to set up a vote, and it's always kind of last minute (someone's leaving the board friday, we need a replacement rule by thursday). Usually 3 to 6 options on the table: pick a supplier, elect one of three board candidates, choose between four retreat dates, whatever. My background is facilitation, not math, but I've picked up that there's a classic result in voting theory (Gibbard–Satterthwaite, I think?) that says roughly: with 3 or more options, where everyone is allowed to rank the options in any order, any voting rule that's non-dictatorial and doesn't rule an option out in advance is manipulable — meaning there's always some situation where somebody gets a better outcome by reporting preferences that aren't their real ones. So "just find the voting rule that can't be gamed" is off the table, which is very much not what the orgs expect to hear when they call me.

  What I want from you: a procedure I can actually run during a ~20 minute phone call, that tells me which voting rule to recommend for a given vote — and that's honest about the moments where the answer is "no rule does what you want, here are three bad options, the members have to pick one as a group." The procedure should ask about things like (adjust as you see fit): how many options there are; whether the options genuinely fall on a single spectrum, since I gather single-peaked preferences are the main escape hatch from the theorem; whether the org can stomach randomness (I've half-remembered something about picking randomly between top options, or random choice among individuals, being harder to game — correct me if I've garbled it); whether they can afford a second round / runoff; how much strategic voting actually costs them given they'll vote together for years; how obvious the gaming would need to be before it poisons trust. It needs explicit stopping points: one where it says "every rule here is gameable, so aim for making gaming rare and hard to pull off quietly rather than impossible," and one where it says "this is a values question, like simplicity vs. fairness, don't decide it for them — put it to a vote or a discussion."

  Then run it on three real-ish cases: (1) a 40-person co-op electing one of three board candidates, high stakes, they have a tradition of ranked ballots; (2) an 8-person team choosing between four retreat dates, where I'd guess preferences run "middle of the range is fine, extremes are annoying" — my hunch is this is the single-peaked case and there's a clean rule for it, is that right?; (3) 60 members choosing between five logo designs, where any "left-right spectrum" story is obviously nonsense. Make sure at least one case produces an answer the caller won't like (I suspect case 3, where the honest output might be "accept a designated chooser, draw straws, or live with gaming"), and end by telling me what the procedure flat-out cannot do. And if I've misdescribed the theorem anywhere above, say so — I'd much rather learn it from you than mid-call with a chairperson on the line.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Role:** Governance person for a federation of worker co-ops.
      *   **Context:** Small orgs (5-80 members), last-minute voting setup, facilitation background (not math).
      *   **Knowledge Level:** Knows about Gibbard-Satterthwaite (GS) theorem, understands the implication (no perfect voting rule), knows about single-peaked preferences and randomness as potential workarounds.
      *   **Goal:** A practical, ~20-minute phone call procedure to recommend a voting rule.
      *   **Requirements:**
          *   Must be honest about impossibility (GS theorem).
          *   Must ask specific diagnostic questions (number of options, spectrum, randomness tolerance, runoffs, relationship costs, transparency).
          *   Must have explicit "stopping points" (acknowledging gameability vs. values trade-offs).
          *   Must run the procedure on three specific cases (Board election, Retreat dates, Logo designs).
          *   Must include at least one "unpleasant" answer.
          *   Must correct any misconceptions about the theorem.
          *   Must state limitations of the procedure itself.

  2.  **Fact-Check the Theory (Gibbard-Satterthwaite):**
      *   *User's description:* "with 3 or more options, where everyone is allowed to rank the options in any order, any voting rule that's non-dictatorial and doesn't rule an option out in advance is manipulable."
      *   *Correction/Refinement:* This is essentially correct. The conditions are:
          1.  At least 3 outcomes.
          2.  Unrestricted domain (voters can have any preference order).
          3.  Non-dictatorial.
          4.  Surjective (every option *can* win under some profile).
          5.  Deterministic (usually assumed).
      *   *Escape Hatches:*
          1.  **Restricted Domain:** Single-peaked preferences (Median Voter Theorem applies).
          2.  **Randomness:** Random Dictator or Random Ballot (strategy-proof in expectation, but introduces variance).
          3.  **Binary Choices:** If only 2 options, simple majority is strategy-proof (mostly).
          4.  **Approval Voting:** Not ranked, but GS applies to ordinal rules. Approval has its own strategic issues but is often simpler.
      *   *User's understanding:* Pretty solid. I need to validate them but clarify that GS applies specifically to *ordinal* (ranking) systems. Cardinal systems (like Score/Approval) dodge the *letter* of GS but face similar strategic incentives (hybrid strategies).

  3.  **Drafting the Procedure (The "Governance Triage Protocol"):**
      *   *Structure:* Needs to be linear, like a flowchart or script.
      *   *Phase 1: The Reality Check.* Acknowledge GS immediately but gently.
      *   *Phase 2: Diagnostics.* The questions the user listed + a few more.
      *   *Phase 3: Decision Nodes.*
          *   Node A: Single-Peaked? (Median rule).
          *   Node B: Binary? (Majority).
          *   Node C: High Trust/Long Term? (Focus on transparency over immunity).
          *   Node D: Randomness OK? (Lottery).
          *   Node E: The "Bad Options" pivot.
      *   *Phase 4: Values Handoff.* When to stop recommending and start facilitating.

  4.  **Developing the Three Cases:**

      *   **Case 1: Board Election (40 people, 3 candidates, ranked tradition).**
          *   *Context:* High stakes, political.
          *   *Theory:* 3 options + rankings = GS applies. No single peak (candidates aren't a spectrum).
          *   *Recommendation:* Instant Runoff (IRV) or Condorcet. IRV is common but can fail monotonicity. Condorcet is better but complex. Given "tradition of ranked ballots," keep it ranked.
          *   *Honesty:* Admit strategy is possible (burying a rival), but transparency helps.
          *   *Verdict:* Use Condorcet if possible, IRV if software limited. Acknowledge gaming risk.

      *   **Case 2: Retreat Dates (8 people, 4 dates, single-peaked hunch).**
          *   *Context:* Low stakes, scheduling.
          *   *Theory:* If preferences are single-peaked (nobody prefers Tuesday & Friday over Wednesday), Median Voting Rule is strategy-proof.
          *   *Verification:* Need to confirm the "spectrum" is real (time is linear).
          *   *Recommendation:* Median Voting (ask for "ideal date," pick the median).
          *   *Verdict:* This is the "clean" case.

      *   **Case 3: Logo Design (60 people, 5 designs, no spectrum).**
          *   *Context:* Aesthetic, subjective.
          *   *Theory:* 5 options, no spectrum = GS applies hard.
          *   *Constraint:* 60 people is a lot for complex deliberation.
          *   *Recommendation:* This needs to be the "unpleasant" one.
          *   *Options:* Approval Voting (simpler, less ranking strategy), Random Dictator (pick one voter at random), or Designated Decider (committee).
          *   *Verdict:* "You can't solve this mathematically." Suggest Approval or Random Selection.

  5.  **Refining the Output:**
      *   *Tone:* Professional, empathetic, technically accurate but accessible.
      *   *Correction:* Gently confirm GS but note it applies to *deterministic ordinal* rules. Mention Approval/Score as alternatives that change the game but don't solve strategy entirely.
      *   *Procedure:* Make it actionable. "Step 1," "Step 2."
      *   *Limitations:* What can't this procedure do? (It can't fix culture, it can't predict specific strategic moves, it can't replace facilitation).

  6.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I include the "stopping points"? Yes, need to label them clearly.
      *   *Check:* Did I correct the theorem description? Yes, need to mention "deterministic" and "ordinal."
      *   *Check:* Is Case 3 unpleasant enough? Suggesting a lottery for a logo might annoy a design-focused co-op. That works.
      *   *Check:* Is the Median Voter Theorem explanation clear for Case 2? Yes, emphasize that *time* is the spectrum.
      *   *Check:* Is the randomness part accurate? Random Dictator is strategy-proof. Random Ballot (pick a ballot at random) is also strategy-proof. Need to distinguish.

  7.  **Final Polish:** Organize with clear headings. Ensure the "Procedure" looks like a tool they can use. Ensure the "Cases" look like simulations of that tool.

  *(Self-Correction on GS Theorem)*: I should be precise. GS says *every* non-dictatorial, surjective, deterministic social choice function with $\ge 3$ outcomes is manipulable. The user said "doesn't rule an option out in advance" which is basically surjectivity. I will validate their understanding as "functionally correct for your purposes" while adding the technical nuance about *deterministic* and *ordinal* so they know where the loopholes (randomness, cardinal votes) live.

  *(Self-Correction on Randomness)*: Random Dictator (pick a person, they decide) is strategy-proof. Random Ballot (pick a ballot, that profile decides) is also strategy-proof. But co-ops usually want collective input. I will suggest "Random Ballot" as the 'honest but weird' option.

  *(Self-Correction on Case 1)*: IRV is often marketed as "anti-strategic" but isn't. Condorcet is better but harder to explain. I'll recommend Condorcet with a caveat.

  *(Self-Correction on Case 3)*: Approval voting is often the pragmatic winner here. It reduces the "order" complexity. But GS still applies to the *outcome* function. I will frame it as "reducing the cognitive load of strategy" rather than "eliminating strategy."

