answer: |-
  First, a quick correction on the theory, because you're right to want to be precise before getting on a call with a chairperson.

  **The Theory Check**
  Your summary of **Gibbard–Satterthwaite (GS)** is functionally correct for your work, but technically it applies to **deterministic, ordinal** voting rules.
  *   **Ordinal:** Voters rank options (A > B > C).
  *   **Deterministic:** The same votes always produce the same winner (no dice rolls).
  *   **The Loophole:** If you allow **randomness** (e.g., pick a voter at random and let them decide), the rule becomes strategy-proof. If you allow **cardinal** ratings (Score/Approval voting) instead of rankings, GS doesn't strictly apply, though strategic incentives (like "bullet voting") still exist.

  You haven't garbled it badly at all. For the purpose of a 20-minute triage call, your mental model holds: *There is no perfect, fair, deterministic ranking system for 3+ options.*

  Below is the **Governance Triage Protocol**. It is designed to be read off a screen or printed as a checklist during your call. It includes the required "stop and hand off" points.

  ***

  # The Governance Triage Protocol
  **Time:** ~20 Minutes
  **Goal:** Select a voting rule or identify a values conflict.

  ### Phase 1: The Reality Check (Minutes 0–3)
  *Script:* "Before we pick a method, I need to be transparent. In voting theory, there's a proof that says if you have three or more options, there is no voting system that is perfectly fair, immune to strategy, and always produces a winner. Every system has trade-offs. My job isn't to find a magic bullet, but to help you pick the trade-off that fits your culture."

  **Diagnostic Q1:** How many winning options do you need? (One? A committee?)
  **Diagnostic Q2:** How many distinct choices are on the table?
  *   *If 2 options:* Stop. Use **Simple Majority**. It's robust and strategy is rarely worth the effort.
  *   *If 3+ options:* Proceed to Phase 2.

  ### Phase 2: The Structure of Preferences (Minutes 3–10)
  *Goal:* Determine if we can escape GS via "Single-Peakedness."

  **Diagnostic Q3:** Do the options fall on a single, shared spectrum? (e.g., dollar amounts, dates on a calendar, temperature settings).
  **Diagnostic Q4:** Is it plausible that everyone prefers a "middle" option over an "extreme" option? (i.e., If they like Friday, they probably like Thursday more than Monday).
  *   *If YES to both:* You likely have **Single-Peaked Preferences**.
      *   **Recommendation:** Use the **Median Voter Rule**. Ask everyone for their *one* ideal option. Pick the median.
      *   *Why:* It is mathematically strategy-proof in this specific context. Lying about your ideal date won't move the median in your favor.
  *   *If NO:* (e.g., Candidates, Logos, Policy directions). Proceed to Phase 3.

  ### Phase 3: Risk & Relationship Tolerance (Minutes 10–15)
  *Goal:* Determine how much "gaming" matters versus simplicity.

  **Diagnostic Q5:** How high are the stakes? (Budget impact, power dynamics).
  **Diagnostic Q6:** How well do members know each other? (Will they vote together for years, or is this a one-off?)
  **Diagnostic Q7:** Can the organization stomach randomness? (e.g., If there's a tie or a deadlock, are you willing to draw straws?)

  *   *Decision Node A (High Trust, Low Stakes):*
      *   **Recommendation:** **Approval Voting** (Vote for all you find acceptable).
      *   *Why:* Easier to count than rankings. Reduces the "lesser of two evils" pressure.
  *   *Decision Node B (High Stakes, Long Term):*
      *   **Recommendation:** **Condorcet Method** (Pairwise comparisons).
      *   *Why:* Finds the option that beats all others head-to-head. Harder to game than Plurality, but complex to explain.
      *   *Warning:* "This requires more education. If members don't understand it, they will trust it less."
  *   *Decision Node C (Deadlock/High Conflict):*
      *   **Recommendation:** **Random Ballot**.
      *   *Why:* Collect all ballots. Pick one at random. That ballot decides.
      *   *Why:* It is the only strategy-proof method for 3+ options without a spectrum. It incentivizes honesty because you might be the dictator.
      *   *Stop Point:* "This often feels unfair to co-ops. If they reject this, move to Phase 4."

  ### Phase 4: The Values Handoff (Minutes 15–20)
  *Goal:* Acknowledge when math can't solve a political problem.

  **Trigger:** If the client wants a deterministic rule for 3+ non-spectrum options but refuses to accept strategic risk.
  *Script:* "We have reached a limit. Math says you cannot have a system that is simple, deterministic, and strategy-proof for this vote. You have three bad options:"
  1.  **Plurality:** Simple, but encourages vote-splitting.
  2.  **Ranked (IRV/Condorcet):** Fairer, but complex and still gameable.
  3.  **Delegated:** Appoint a small committee to decide.

  *Action:* "Do not let me pick this. This is a values question: Simplicity vs. Fairness vs. Trust. I recommend you present these three trade-offs to the membership and let *them* choose the voting rule."

  ***

  # Running the Protocol: Three Cases

  Here is how I would run this protocol on the three scenarios you provided.

  ### Case 1: The Board Election
  *   **Context:** 40-person co-op, 3 candidates, high stakes, tradition of ranked ballots.
  *   **Protocol Run:**
      *   *Phase 1:* 3 options. Proceed.
      *   *Phase 2:* Candidates are not a spectrum (Q3 = No). Proceed.
      *   *Phase 3:* High stakes (Q5 = High). Long term relationships (Q6 = High).
      *   *Decision Node B:* Recommend **Condorcet**.
  *   **The Recommendation:**
      "Because this is high-stakes and you have a tradition of ranked ballots, I recommend a **Condorcet Method** (specifically Minimax or Schulze). Unlike Instant Runoff (IRV), Condorcet ensures that if a candidate would beat every other candidate in a head-to-head matchup, they win. IRV can sometimes eliminate the consensus candidate too early."
  *   **The Honesty Clause:**
      "However, I must tell you: Gibbard–Satterthwaite still applies. Members *can* game this by ranking a weak opponent higher to hurt a strong rival. But because you are a co-op voting together for years, the social cost of being caught gaming is high. Rely on culture, not math, to prevent strategy here. Publish the pairwise matrix so the logic is transparent."
  *   **Outcome:** Client accepts. They get a robust system with a clear warning about transparency.

  ### Case 2: The Retreat Dates
  *   **Context:** 8-person team, 4 dates, preferences likely single-peaked.
  *   **Protocol Run:**
      *   *Phase 1:* 4 options. Proceed.
      *   *Phase 2:* Dates are a spectrum (Q3 = Yes). Middle preferences likely (Q4 = Yes).
      *   *Decision Node:* **Median Voter Rule**.
  *   **The Recommendation:**
      "This is the one case where math gives us a clean win. Don't do a ranked vote. Just ask every member: 'What is your **one** ideal date?' Write them down. Order them chronologically. Pick the middle one (the median)."
  *   **The Honesty Clause:**
      "This works because time is linear. If you prefer Wednesday, you won't lie and say Monday to try to get Friday, because you might end up with Monday. It is strategy-proof *if* preferences are single-peaked. If someone genuinely hates the middle date (e.g., they can only make Friday or Monday), tell them now, because this rule will fail them."
  *   **Outcome:** Client is relieved. This is the "clean" case you suspected.

  ### Case 3: The Logo Design
  *   **Context:** 60 members, 5 designs, no spectrum, aesthetic judgment.
  *   **Protocol Run:**
      *   *Phase 1:* 5 options. Proceed.
      *   *Phase 2:* No spectrum (Q3 = No). Proceed.
      *   *Phase 3:* 60 people is too many for complex deliberation. Randomness (Q7) is likely a hard "no" for branding.
      *   *Phase 4 Trigger:* Client wants a deterministic winner, no spectrum, high potential for subjective strategy.
  *   **The Recommendation (The Unpleasant One):**
      "I cannot give you a voting rule that solves this cleanly. With 5 subjective options and 60 voters, strategic voting (e.g., 'I hate Blue, so I'll vote for Red even though I like Green') is inevitable in any deterministic system."
      "Here are your three bad options:"
      1.  **Approval Voting:** Members vote 'Yes' on all logos they can tolerate. Highest votes wins. (Reduces strategy complexity, doesn't eliminate it).
      2.  **Random Ballot:** Collect 60 ballots. Pull one from a hat. That person's top choice wins. (Mathematically honest, feels illegitimate for branding).
      3.  **Designated Decider:** The Board or a Marketing Committee chooses. (Removes the voting problem entirely).
  *   **The Honesty Clause:**
      "If you try to use Ranked Choice here, you will spend 40 minutes explaining the count, and people will still suspect the count was rigged to favor the 'popular' design. If you care more about buy-in than mathematical fairness, use **Approval Voting**. If you care about fairness over buy-in, use **Random Ballot**. But do not pretend there is a 'correct' winner here."
  *   **Outcome:** Client is annoyed. They wanted a tool; you gave them a dilemma. This is the correct output.

  ***

  # What This Procedure Cannot Do

  To close, here are the limitations you need to keep in mind so you don't oversell this tool to yourself or the co-ops:

  1.  **It Cannot Detect Single-Peakedness in Advance:** In Case 2 (Retreat), I assumed preferences were single-peaked. In reality, one member might have a flight on Thursday, making their preferences "Wednesday or Friday, but NOT Thursday." The Median Rule fails if too many people have "multi-peaked" preferences. You can't verify this without seeing the ballots first.
  2.  **It Cannot Fix Power Imbalances:** A voting rule doesn't stop a dominant personality from pressuring members on how to vote before the ballot is cast. GS prevents *mathematical* manipulation, not *social* coercion.
  3.  **It Cannot Replace Facilitation:** In Phase 4 (The Values Handoff), the procedure tells you to "put it to a discussion." That is the hardest part of your job. The procedure identifies the conflict; it does not resolve the emotion.
  4.  **It Assumes Rational Actors:** Voting theory assumes voters know their preferences and want to maximize the outcome. In co-ops, voters often vote to signal virtue, support a friend, or punish a rival. The "Strategy" GS warns about is cold calculation; real-world "gaming" is often messy and emotional.

  **Final Note for the Call:**
  When you hit the "Values Handoff," use this line: *"My job is to make sure you know the cost of the tool you're picking. If you pick the simple tool, the cost is accuracy. If you pick the accurate tool, the cost is complexity. You have to decide which debt you're willing to carry."*
