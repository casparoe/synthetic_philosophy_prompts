answer: |-
  Here is the translation of the debate into the vocabulary of the workshop, followed by the residue report you requested.

  ### The Positions, Translated

  **1. The Strict-Fidelity View → The Documentary Constraint**
  This position treats the source material as a hard ceiling on *interiority*. It argues that *free indirect style* cannot be applied to a real person unless there is epistolary evidence (letters, diaries) to authorize the voice. It forbids *inventing backstory* where the record is silent. It views *composite characters* as a breach of contract if they merge distinct historical agents. In terms of *narrative distance*, this view demands the camera stay outside the skull; we may render *scene* and *dialogue* only where transcripts exist. To do otherwise is to treat *anachronism* not as a stylistic flavor, but as a factual error.
  *   **Craft Map:** This maps directly onto decisions regarding *POV depth*. It is the choice to write a "close third" that refuses to cross the threshold into the character's unrecorded mind. It treats the *author's note* as a ledger of deviations.

  **2. The Larger-Truth Defense → The Arc Priority**
  This position holds that the *character arc* supersedes the chronology. It argues that *summary* may compress or rearrange time to serve the thematic coherence of the life. It grants license to invent *interiority* if the documented facts fail to reveal the *essence* of the person's motivation. It justifies *composite characters* if they streamline the narrative without distorting the protagonist's *journey*. Here, *anachronism* of sensibility is permitted if it makes the historical figure intelligible to a modern reader.
  *   **Craft Map:** This is the standard novelist's approach to *plot* versus *story*. It prioritizes *emotional truth* (the arc) over *factual accuracy* (the timeline). It is the argument for using *free indirect style* to bridge gaps in the historical record to maintain *narrative drive*.

  **3. The Consent-and-Harm View → The Living Heir Constraint**
  This position grounds the ethics of *characterization* in the impact on the surviving. It argues that assigning malicious *interiority* to a real person without proof damages their posthumous reputation, which is held in trust by descendants. It treats the *afterword* not just as context, but as a mitigation of harm. It suggests that *backstory* involving living relatives requires a different calculus than *backstory* involving the long-dead.
  *   **Craft Map:** This maps onto *paratext* and *publisher risk*. In craft terms, this is the "legal read" or the "sensitivity read." It is an external constraint on *characterization* driven by the potential for backlash against the *author's brand* or the *estate's cooperation*.

  **4. The Genre-Contract View → The Shelving Agreement**
  This position argues that obligation is determined by the label on the spine. If the *paratext* says "A Novel," the *contract* allows full *narrative license* (invented *interiority*, *composites*, *scene* construction). If it says "Biography" or "Historical Account," the *contract* demands the *Documentary Constraint*. It posits that reader trust is broken not by invention itself, but by invention that violates the *shelving* expectations.
  *   **Craft Map:** This is purely a matter of *title page* and *blurb*. It defines the rules of *narrative license* before page one. It treats the *author's note* as the place where the terms of the *contract* are disclosed or adjusted.

  ***

  ### The Residue Report

  You asked which parts of the debate survive as genuine craft decisions, which were distorted, and which vanish in translation. You also asked me to address your suspicion: that craft treats entering a mind as a technical choice of distance, while philosophy treats it as a moral act done *to* someone.

  **1. What Survives as Craft**
  The **Documentary Constraint** and the **Shelving Agreement** translate perfectly. These are already levers on your dashboard. You decide *POV distance* based on how much evidence you have. You decide the *paratext* based on how much you invented. When you write an *author's note* explaining where you deviated, you are already performing the ethical work the philosophers demand. The **Arc Priority** is also native to you; it is simply the argument for *story* over *plot*, which you make every time you cut a boring truth to keep a compelling scene.

  **2. What Was Distorted**
  The **Living Heir Constraint** suffers distortion in translation. In philosophy, this is a claim about *rights* and *dignity*. In craft vocabulary, it inevitably sounds like *risk management*. When I translate "harm to the dead" into "impact on surviving relatives," it becomes a matter of PR and legal clearance rather than a moral duty to the subject. The craft vocabulary has no mechanism to measure "dignity" other than "reputation," and no mechanism to measure "reputation" other than "public reaction." The moral weight is reduced to a practical consequence.

  **3. What Cannot Be Expressed**
  The core of the philosophical debate—the **status of the dead subject**—dissolves in craft terms.
  *   **The Missing Register:** Your vocabulary assumes the character is *yours* to manage once they are on the page. *Interiority* is a resource you deploy. *Backstory* is material you shape. The philosophical view insists that even on the page, the person remains *themselves*, not *yours*. There is no craft term for "violation of a subject" because in craft, the subject *is* the text.
  *   **The Gap:** You suspected that *free indirect style* is a technical matter of *narrative distance* for you, but a matter of *consent* for them. This is correct. Craft has no word for "consent" because the dead cannot grant it, and the text cannot receive it. The only proxy you have is the *author's note*, but a note is a disclaimer, not a permission slip.

  **4. Addressing Your Suspicion**
  You asked which side is missing something: does your vocabulary lack a register for the moral standing of the dead, or do the philosophical positions reduce to conventions we already handle?

  Here is the honest assessment: **Both are true, but they are talking about different objects.**

  *   **The Craft Blind Spot:** Your vocabulary lacks a register for the *human residue*. When you decide on *POV distance*, you are optimizing for *effect* (pacing, empathy, tension). You are not optimizing for *justice*. Craft treats the historical figure as a *composite* of data points waiting to be animated. It cannot see the "person" outside the "character." Therefore, your vocabulary cannot express the specific wrong of putting unspoken thoughts into a specific dead mouth, because to you, that mouth is a vessel for *voice*.
  *   **The Philosophical Reduction:** Conversely, when philosophers argue for the **Genre-Contract** or the **Author's Note**, they are trying to solve a moral problem with a labeling solution. They want the *paratext* to carry the weight of the *text*. But an *afterword* that says "I invented this" does not undo the reader's experience of believing it was true during the *scene*. The philosophical positions often reduce to *shelving* and *disclosure* because they lack your vocabulary for how *interiority* actually works on a reader. They think a warning label fixes the *POV*; you know that once the reader is in *free indirect style*, the warning label is forgotten.

  **The Verdict:**
  The gap is real. Your vocabulary describes the **mechanics of the illusion**; their vocabulary describes the **ethics of the source**.
  *   When you choose *narrative distance*, you are solving a problem of **narrative power**.
  *   When they argue about *fidelity*, they are solving a problem of **narrative authority**.

  You are not missing a moral register; you are working in a medium where the moral register is silent. The dead do not speak in *scenes*. They speak in records. When you use *free indirect style* to make them speak in *scenes*, you are necessarily overriding the silence of the record. Your vocabulary calls this "bridging the gap for *arc*." Their vocabulary calls this "speaking for the voiceless."

  The **Author's Note** is the only place where these two vocabularies touch. But in your hands, it is a tool of *transparency* (a craft virtue). In their hands, it is a tool of *atonement* (a moral virtue). The translation fails because transparency does not equal atonement. You can be perfectly transparent about a trespass and still have trespassed.

  **Conclusion:**
  Do not look for the moral standing of the dead in your craft vocabulary. It is not there. It is found only in the **Living Heir Constraint** (the reaction of the living) and the **Shelving Agreement** (the trust of the reader). If the dead have a claim that survives without heirs and bypasses the genre label, your vocabulary has no tool to measure it. That does not mean the claim is false; it means it is external to the work of making the book function. It is a cost the craft does not account for, like the environmental cost of printing paper. You can use recycled stock (strict fidelity), or you can plant trees (author's note), but the cost of the tree remains outside the binding.
