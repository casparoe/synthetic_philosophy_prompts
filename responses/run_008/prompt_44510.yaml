  4.  **Evaluate Originality/Interest:**
      *   *Standard Relativist Riff?* It risks being standard "cultural differences mean no truth."
      *   *How to make it interesting:* Focus on the *psychology of objectivity* rather than just the variation. The claim that "the feeling of objectivity is what a locally produced intuition feels like from the inside" is the gold here. That's a meta-ethical claim about phenomenology, not just a sociological claim about difference.
      *   *Framing:* The "WEIRD" framing is a bit dated (2010s peak), but still relevant. The connection to moral objectivity is the key.

  5.  **Evaluate the Examples (Strength/Weakness):**
      *   *Purity (Shweder):* Good for showing *content* variation. Weak for undermining objectivity because one can argue purity *shouldn't* be moral (Nussbaum's critique). It might just show WEIRD people are *right* to exclude it.
      *   *Ultimatum (Henrich):* Good for showing *structural/functional* variation. Shows fairness is instrumental, not intrinsic. Stronger for undermining objectivity because it targets a core "justice" intuition.
      *   *Incest (Westermarck/Wolf):* Strongest for *debunking*. It takes a universal-seeming taboo and shows it's a heuristic (co-residence) that can misfire or be absent. It directly attacks the "objective wrongness" of incest by showing the psychological mechanism is blind to the actual moral reason (genetics).
