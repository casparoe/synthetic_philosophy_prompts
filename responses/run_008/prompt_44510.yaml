      *   *Section 1: The Genetic Fallacy/TA Objection.* Explain *why* the TA is technically right but how to bypass it. Introduce "Evolutionary/Cultural Debunking." The key is the *explanatory redundancy* of moral truth. If culture explains the belief fully, moral truth does no work.
