      *   *Wolf (Incest/Kibbutzim):* This is the Westermarck effect. The Israeli kibbutz data (Shepher) and Taiwanese "minor marriages" (Wolf) are the classic citations. The user says "Wolf's findings" regarding kibbutzim—technically Shepher did the kibbutz work, Wolf did the Taiwanese work. Need to correct that attribution slightly. The mechanism is co-residence, not genetic relatedness.
