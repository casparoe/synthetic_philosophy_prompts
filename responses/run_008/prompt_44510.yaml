      *   *Section 3: Example Ranking.* Incest is the killer. It shows the mechanism is blind to the supposed moral reason. Purity is easiest for an objectivist to dismiss.
      *   *Section 4: Originality.* The "phenomenology of objectivity" line is the winner. Lean into that.
