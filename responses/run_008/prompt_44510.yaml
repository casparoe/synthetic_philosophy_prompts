      *   *The Philosophical Nuance:* The argument isn't just "variation exists, therefore objectivity is false." It's "variation exists *and* is explained by contingent local factors *and* the feeling of objectivity is a psychological byproduct of those factors." This moves closer to an *error theory* or a *debunking argument* (like Street or Joyce) rather than simple relativism.
      *   *Verdict:* The user *is* leaning on an extra premise. The premise is something like: "If moral intuitions are fully explained by contingent socio-ecological factors without reference to mind-independent moral truths, then we have no reason to trust them as tracking truth." This is the "evolutionary debunking" move. I need to help them articulate this so they don't get crushed by the genetic fallacy charge.

  3.  **Evaluate the Empirical Claims:**
      *   *Shweder (Bhubaneswar):* Generally accurate. The "Big Three" ethics (Autonomy, Community, Divinity) is the standard citation. WEIRD people focus heavily on Autonomy (harm/rights).
