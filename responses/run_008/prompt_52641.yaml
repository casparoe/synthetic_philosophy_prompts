answer: |-
  This is a robust and promising line of argument. It moves beyond the tired aestheticism versus historicism debate by offering a functional account of provenance. The analogy to scientific fraud is particularly strong; it grounds the moral intuition against forgery in something concrete (the integrity of the record) rather than something mystical (the 'aura'). The project is certainly worth pursuing, as it clarifies why we care about origins even when perception fails us.

  Here are my comments on your specific questions.

  **1. The Workshop Case**
  This does not refute the account; rather, it necessitates a precise definition of 'decision process'. If your theory relies on the physical trace of the master's hand, the workshop case is fatal. However, if the evidential value attaches to the *authority* and *supervisory intent* of the master, the account survives intact.

  In a Rubens workshop piece, the original still licenses inferences about Rubens's aesthetic judgments, his delegation strategies, and his approval of the final output. The forgery of a workshop piece severs the link to that authority just as effectively as a forgery of an autograph work. Indeed, this case strengthens your position by demonstrating that the value lies in the *agency* behind the object, not merely the biological contact. You should frame this as a friendly amendment: the 'evidential record' is not of motor execution, but of authorised artistic will. This clarifies that the epistemic value is about the history of *production*, not just the history of *manufacture*.

  **2. Epistemic versus Ritual Distinction**
  This distinction is doing genuine explanatory work and is superior to the blunt instrumental/non-instrumental divide. The instrumental/non-instrumental dichotomy is too broad; almost any value can be construed as instrumental (e.g., aesthetic experience is instrumental to pleasure).

  Your distinction is more granular. 'Epistemic' value is indeed instrumental (the object is a tool for knowledge), but 'ritual' value is not simply 'non-instrumental' in the aesthetic sense. It is a specific type of historical value based on causal contact (contagion magic, effectively). By separating these, you explain the divergence between critical condemnation (which focuses on the lie—the epistemic breach) and market valuation (which focuses on the relic—the ritual scarcity). If you merely used instrumental/non-instrumental, you would struggle to explain why a perfect duplicate (high instrumental aesthetic value) is worthless compared to a damaged original (low instrumental aesthetic value, high ritual value). The epistemic/ritual split captures this nuance without collapsing into general utility.

  **3. The Indiscernible Duplicate**
  This is the most vulnerable point, but it need not sink the argument. The worry is that if the duplicate is physically identical, claiming it lacks evidential value seems to rely on already knowing which is which, which is circular.

  The repair lies in distinguishing between the *ontology* of the evidence and our *access* to it. The argument is not that we can detect the difference empirically (by hypothesis, we cannot); it is that the difference exists metaphysically. The original supports the counterfactual 'If Rembrandt had not painted this, this object would not exist.' The duplicate supports 'If Rembrandt had not painted this, this object would still exist (created by the forger).'

  The evidential status is a relational property dependent on causal history, not an intrinsic physical property. You must concede that in the hypothetical scenario where they are indiscernible, we cannot *know* which is which, but that does not mean they possess the same value. One is a true record; the other is a false record. The value lies in the truth of the relation, not our ability to verify it. Do not claim the duplicate fails as evidence because it looks different; claim it fails because the proposition 'This object was made by Rembrandt' is false when predicated of the duplicate, regardless of its appearance. The hole is only fatal if you conflate 'evidence' with 'detectable evidence'.

  **4. The Restoration Claim**
  This claim holds up, but only if you emphasise *continuity of existence* over *integrity of surface*. Your argument is that heavy restoration is tolerated because it preserves the ritual chain (it is the same object, merely altered), whereas forgery severs it (it is a different object pretending to be the original).

  However, you must be careful not to overreach. If restoration destroys the underlying layers (the evidential record of the artist's process), it *does* commit the epistemic sin you describe. The distinction rests on intent and transparency. A restored painting usually claims, 'I am the original object, modified.' A forgery claims, 'I am the original object, unmodified.' The horror of forgery is the lie about the causal chain; the tolerance of restoration is the acceptance of a damaged causal chain. You should acknowledge that egregious restoration (where the original surface is obliterated) often attracts forgery-like condemnation (e.g., the *Ecce Homo* botch), which actually supports your thesis: when restoration destroys the evidential record too thoroughly, it is treated as epistemically bankrupt.

  **Overall Soundness**
  The argument is sound provided you maintain the distinction between the metaphysical status of the object and our epistemic access to it. The move to treat forgery as akin to data fabrication is the strongest element of the draft; it bypasses the subjective trap of 'aesthetic experience' and anchors the value of art in the integrity of art history itself. The addition of the ritual component saves the theory from being too coldly rationalist, accounting for the market behaviour that pure epistemism cannot explain. Pursue this line.
