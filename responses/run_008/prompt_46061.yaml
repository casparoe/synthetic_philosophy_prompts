          *   *Refinement:* Focus on the *recovery* effort. Is it a burden or a clarification?
          *   *Follow-up:* If he says "clarification," ask why the majority of mathematicians haven't adopted this clarity if it's so beneficial.

      *   *Topic 5: Useful Fiction (Philosophical).*
          *   *Draft 1:* If it works, why not call it true?
          *   *Critique:* Good, but needs to be integrated.
          *   *Refinement:* Make it about the definition of truth. Instrumentalism vs. Realism.
          *   *Follow-up:* If he sticks to "fiction," ask about the ontology of numbers themselves (is 5 a fiction?).

      *   *Topic 6: Falsification/Changing Mind.*
          *   *Draft 1:* What would change your mind?
          *   *Critique:* Required by prompt.
          *   *Refinement:* Make it specific to math or observation.
          *   *Follow-up:* If he says "nothing," challenge the scientific nature of his claim.

      *   *Filling the gaps (Need 8-10 total).*
          *   Need a question on *computability* (since finitism often aligns with constructivism).
