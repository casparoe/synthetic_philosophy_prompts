          *   *Refinement:* Focus on the *success* of the continuum. If the map (reals) works perfectly for the territory (physics), is the map just a tool or does it reflect territory?
          *   *Follow-up:* If he says "tool," ask about the risk of the tool breaking at extreme scales (singularities).

      *   *Topic 4: Cost to Math.*
