          *   *Refinement:* Focus on the category error. Hotels are physical. Sets are abstract.
          *   *Follow-up:* If he says it's a category error, ask why we trust intuition about physical hotels to govern abstract logic.

      *   *Topic 2: Cantor's Diagonal.*
