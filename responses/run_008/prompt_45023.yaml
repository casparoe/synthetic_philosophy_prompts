      2. Explain the metacognitive failure (why "feeling careful" fails at 3 AM).
      3. Address the "point of being careful" (distinguishing negligence from incapacity).
      4. Address coherence (downgrade confidence, keep hypothesis).
      5. Address infinite regress (baseline vs. variable).
      6. Verdict.

      *Verdict Label:* **"Contextual Re-verification"** feels most precise. It's not always redoing, only when context dictates.

