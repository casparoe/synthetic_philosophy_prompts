      *   **Ending:** Craig Schwartz is trapped inside Malkovich's head, watching Lotte and Maxine. This looks like the "inner theater" Hofstadter critiques (a spectator self).
      *   **Supportive Scene:** Craig's puppeteering. He controls others (and himself) through strings, suggesting the self as an operator/controller, perhaps mirroring how the brain operates itself.

