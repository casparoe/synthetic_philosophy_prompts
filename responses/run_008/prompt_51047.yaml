answer: |-
  ### Candidate Readings

  Before settling on a path, let us consider three ways to map Adam Smith's *The Theory of Moral Sentiments* onto *Emma*.

  1.  **The Moral Internalization Model:** This aligns with your hypothesis. Emma begins with a defective moral mechanism: she possesses high imaginative sympathy (she can model others' minds) but lacks the internalized impartial spectator (self-command). Knightley serves as the external prosthetic for this missing internal judge. Her arc is the process of swallowing this external judge until it becomes her own conscience. The novel is a bildungsroman of moral sentiment.
  2.  **The Patriarchal Discipline Model:** Here, we treat Smith's "impartial spectator" not as a universal moral truth but as a social construct enforcing hierarchy. Knightley cannot be the impartial spectator because he is an interested party: a male landowner with authority over Emma. Her "shame" at Box Hill is not moral growth but social conditioning. She learns not to be good, but to be submissive to the specific spectator who holds power over her happiness. This reading resists the moral optimism of the first.
  3.  **The Narratorial Spectator Model:** This reading suggests Emma never fully internalizes the impartial spectator; rather, the novel's free indirect discourse forces the *reader* to occupy that role. We are given access to Emma's errors without her immediate awareness of them. The "growth" is ambiguous; the true moral work is done on the audience, who must judge Emma as Smith suggests we judge others. The novel is a training ground for the reader's sympathy, not just the heroine's.

  **Selection:** I will pursue a synthesis of the **Moral Internalization Model** and the **Narratorial Spectator Model**. I choose this because it honors your strong intuition about Knightley and the Box Hill episode while acknowledging the formal complexity of Austen's narration. It allows us to treat Knightley not merely as a patriarchal enforcer (though he is that) but as the necessary concrete embodiment of an abstract principle, while also admitting that the narration itself performs the work of the spectator where Emma fails. This offers the most fertile ground for discussion: it validates the moral growth without ignoring the social machinery that produces it.

  ***

  ### The Man Within the Breast and the Man in the Room: A Smithian Reading of *Emma*

  To read *Emma* through Adam Smith's *The Theory of Moral Sentiments* is to witness the dramatization of a psychological mechanism. Smith argues that moral judgment arises from a two-way adjustment of sentiments. When I observe you, I imagine myself in your situation; if your emotions match what I would feel, I sympathize. If they exceed what I would feel, I demand you lower them; if you lower them, we achieve "propriety." Over time, we internalize this exchange. We imagine how an impartial spectator would view us, and we adjust our conduct to earn not just praise, but praiseworthiness.

  Emma Woodhouse begins the novel as a virtuoso of the first half of this mechanism and a failure of the second. She is a brilliant simulator of other minds. Her matchmaking is not blind guessing; it is an aggressive exercise of imaginative projection. She models Harriet Smith's desires, Mr. Elton's ambitions, and Frank Churchill's secrecy with uncanny accuracy. However, she uses this capacity for manipulation rather than communion. She projects herself into others to move them like pieces on a board, not to feel with them. Consequently, she lacks the reflexive half of Smith's mechanism: the discipline of viewing her own conduct as a well-informed bystander would. She wants to be praised—specifically for her discernment and wit—but she cares little for being praiseworthy. She seeks the applause of the spectator without submitting to the spectator's judgment.

  This deficit is most visible in her relationship to Mr. Knightley. In Smith's system, the impartial spectator is an abstract internalization of social feedback. In Austen's Highbury, this spectator is made flesh. Emma treats Knightley's judgments as authoritative even when they sting, a relationship she shares with no other character, including her father. Why? Because Knightley is the only one who refuses to sympathize with her vanities. Her father sympathizes too much (lowering the standard to match her); Mrs. Weston sympathizes too politely. Knightley demands Emma lower her claims to match the situation. He is the externalized conscience she has not yet built within herself.

  However, we must press on the Smithian machinery here. Smith insists the impartial spectator must be *impartial*. Knightley is notoriously partial: he is a neighbor, a friend, and a man in love. Does this disqualify him? A strict Smithian might say yes; love biases judgment. But Austen suggests something Smith underplays: that the impartial spectator is too abstract to function without being assembled out of actual, partial spectators. Knightley's love is not a bias that corrupts his judgment, but the guarantee that his judgment aims at her long-term good rather than his immediate convenience. He rebukes her at Box Hill not to humiliate her, but to save her from herself. Austen argues that we learn to be impartial by first trusting the partiality of those who love us best. The "man within the breast" is built from the bones of the "man in the room."

  The Box Hill episode is the crisis point of this moral economy. Smith describes propriety as the agent lowering their emotions to a level the spectator can enter. Emma does the opposite. She raises her wit to a pitch that no spectator can join without cruelty. Miss Bates, conversely, is the novel's unconscious Smithian saint. Throughout the book, Bates systematically diminishes her own claims so that others can sympathize with her without strain. She lowers her emotional pitch to match the indifference of her neighbors, ensuring social harmony. When Emma mocks her, Emma violates the fundamental contract of sympathy: she refuses to lower her pride to match the vulnerability of the situation.

  Knightley's rebuke forces the mechanism to reset. He tells Emma explicitly what the impartial spectator would see: "Badly done, indeed!" The drive home is the dramatization of shame, which Smith defines as the painful recognition that one's conduct cannot be sympathized with. Emma revisits the scene, not defending herself, but viewing herself through Knightley's eyes. This is the moment she begins to internalize the spectator. She is no longer performing for applause; she is suffering the loss of praiseworthiness.

  Yet, we must ask if this reform is genuine moral growth or merely romantic desperation. Does Emma become praiseworthy, or does she simply want to be praised by Knightley again? The text strains here. Her remorse is intense, but it is triggered by the fear of losing Knightley's esteem. Smith would argue that mixed motives are inevitable; we start by wanting praise and slowly learn to want praiseworthiness. Emma's marriage suggests she has merged the two: she values Knightley's judgment enough to make it her own. But Austen's free indirect narration complicates this. For most of the novel, the narration aligns with Emma's limited perspective, withholding the impartial spectator's view until Emma achieves it herself. We are trapped in her head. At Box Hill, the narration does not condemn her immediately; it waits for Knightley to speak, and then for Emma to feel the shame. This suggests that moral truth in Austen is not objective fact, but intersubjective agreement. We know Emma is wrong because she knows she is wrong.

  There is, however, a limit to how far Austen lets Smith's logic go. Smith might demand a more rigorous penance than marriage to the judge. By allowing Emma to marry Knightley, Austen risks collapsing the distinction between the agent and the spectator entirely. If the judge becomes the husband, is there anyone left to judge? Yet, the final chapters show Emma continuing to check her conduct against Knightley's view, suggesting the internalization is complete. She has built the spectator within, using Knightley as the blueprint.

  Ultimately, *Emma* resists being a mere illustration of *The Theory of Moral Sentiments* because it reveals the emotional cost of the theory. Smith describes a mechanism; Austen describes the pain of its operation. The impartial spectator is not a calm judge; it is a source of acute shame. And Miss Bates remains the quiet foil, proving that propriety is often the burden of the powerless, while the powerful (like Emma) are afforded the luxury of impropriety until checked by those they love. Austen gives us the machinery of Smith, but she oils it with the messy realities of love, hierarchy, and the fear of loneliness.

