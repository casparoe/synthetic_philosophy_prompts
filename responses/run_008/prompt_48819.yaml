      *   Key concept: *Illusions*. She believes nature deceives us to keep us going, and we should cooperate with nature by maintaining illusions that make us happy (e.g., believing we are loved, believing our work matters), provided they don't harm others.
      *   Key concept: *Taste* (Goût). Cultivating a taste for study and knowledge is superior to the taste for gambling or court favor because it is within our control and less susceptible to fortune.
      *   Key concept: *Passions*. We shouldn't kill them, but regulate them.
