      *   **Character 2 (The Critic):** Suspects du Châtelet's program quietly concedes the Stoic point it claims to reject (detachment from outcomes). Presses on the risks of curated illusions (collapse, harm, complacency). Raises the issue of gender/social constraint (retreat into study was a privilege).
