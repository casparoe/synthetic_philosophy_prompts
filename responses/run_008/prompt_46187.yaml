  hey, I'm writing a novel set in a cognitive science department in the late 80s and my cast will not stop arguing about the Chinese Room. I want a decision tree I can pin above my desk so that every time a character opens their mouth I know exactly which position they're arguing from. Everyone starts at the same node: they've just heard Searle describe the guy in the room shuffling symbols back and forth, and they have to say whether they share the intuition that no understanding of Chinese is happening in there. Build the tree out of the questions that actually split the field — if you accept the intuition, does it attach to the man alone or could it attach to the whole room; does bolting cameras and robot arms onto the room change anything; and if even the robotic room doesn't understand, should that scare you about your friends and colleagues too. For the people who reject the intuition, give me separate branches depending on why: the setup is physically impossible, intuitions about a slowed-down paper-shuffling version of a process are worthless, or the whole syntax/semantics distinction was doing no work from the start. Leaves should be named positions (systems reply, robot reply, other minds reply, whatever the connectionist-flavored one is called) with one sentence of dialogue each, something a character at that leaf would actually say. Flag any two leaves the tree can't really separate, and any combination of answers nobody defends — and tell me whether thats because it's incoherent or just unpopular. Aim for 6-8 leaves, and if you can, add a final leaf for the character I'm stuck on: someone who grants Searle everything and still doesn't care, because they think the machines are coming anyway.
