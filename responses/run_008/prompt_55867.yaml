answer: |-
  To ground "dysfunction" clinically, a theory of biological function must satisfy five desiderata:

  1.  **Normativity:** Distinguish malfunction from mere disvalue (e.g., psychosis vs. eccentricity).
  2.  **History:** Explain why the trait exists (evolutionary etiology).
  3.  **Current Contribution:** Explain what the trait does now (physiological role).
  4.  **Novelty:** Avoid attributing function before selection pressure exists (e.g., did pesticide resistance function before DDT?).
  5.  **Harm Independence:** Acknowledge selected traits can be harmful (e.g., childbirth pain).

  **Conflicts:** Desiderata 2 (History) and 3 (Current Contribution) are jointly unsatisfiable in cases of exaptation or vestige. If function is what a trait was selected for, it cannot simultaneously be whatever it currently contributes when those diverge. Feathers insulated before they flew. The appendix remains after digestion changed. You cannot privilege evolutionary origin *and* current utility equally; one must ground the other. Furthermore, History pulls against Novelty: if a trait suddenly helps survival (DDT resistance), Current Contribution says it functions immediately; History says it lacks function until selection acts across generations.

  **Verdict:** For psychiatry, you must commit to **Selected-Effects (SE)**. Drop Current Contribution as the definition of function.

  **Why:** The Causal-Role (CR) camp defines function as any causal contribution to a system's capacity. In psychiatry, "system capacity" is vulnerable to social definition. If function is merely "what helps the organism cope now," social deviance becomes dysfunction. A trait preventing conformity could be labeled dysfunctional because it hinders social integration. SE anchors function in evolutionary history, creating a value-free boundary between disorder and difference. This satisfies Normativity, History, Novelty, and Harm Independence.

  **The Cost:** You must accept two counterintuitive consequences.
  First, **vestigial traits cannot malfunction.** If the appendix has no selected effect, appendicitis is not a "dysfunction" but a structural failure or external attack. This feels linguistically awkward but preserves the definition's rigor.
  Second, **novel adaptations start functionless.** A mutation conferring immediate pesticide resistance has no "function" until it is selected across generations. It is merely a causal role until history catches up. SE theorists must say resistance had no function before DDT existed. This is the correct weirdness: function requires a history of selection, not just immediate utility.

  **Conclusion:** CR offers better physiological granularity, but SE offers the only firewall against moralizing mental distress. In clinical contexts, preventing the pathologizing of social non-conformity outweighs the loss of precision regarding vestigial traits. Hold firm on History. Accept that some harmful conditions aren't "disorders" in the evolutionary sense, and some useful traits aren't "functional" until selection validates them. The price of protecting patients from social prejudice is accepting that "function" is a historical claim, not a current utility report. This ensures "dysfunction" refers to a broken engine, not an engine driving the wrong destination.
