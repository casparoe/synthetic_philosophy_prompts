      *(Self-Correction during drafting)*: Wait, I need to make sure I don't conflate "Uniformitarianism" with "Volcanism." Volcanism was the *protective belt* adjustment for Uniformitarianism to handle the Ir anomaly. The Core remained "Terrestrial/Gradual." I need to make that distinction clear.

      *(Refining the 1985 advice)*: Lakatos advises sticking with a programme as long as it is progressive. In 1985, Impact had predicted Ir globally (Progressive) but lacked a mechanism (crater). Volcanism had a mechanism (Deccan) but struggled with Ir distribution. A Lakatosian would say "Watch the rate of novel fact prediction."

      *(Refining the "Crucial Experiment")*: Chicxulub wasn't a logical refutation. Volcanists could say "Coincidence" or "Impact triggered Volcano." It was decisive because it made the Volcanic belt *too complex* relative to the Impact belt. It's about comparative simplicity/heuristic power, not logical falsification.

      *(Refining the "Outsider" point)*: Lakatos assumes RPs are communities. The Alvarez team *formed* a community quickly. But the fact that they were physicists suggests Lakatos underestimates cross-disciplinary intrusions.

