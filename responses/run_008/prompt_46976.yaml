      *   *Tension:* Is "Impact" a full RP? Or just a specific theory within a broader "Catastrophism" RP? Or is it an intrusion into the "Uniformitarian" RP?
      *   *Lakatos on Crucial Experiments:* He denies they exist *at the time*. They are retrospective reconstructions. So Chicxulub (1991) can't be logically decisive *in 1991*. It shifts the problem shift balance.
      *   *1985 Context:* Both sides adding belts. Impact finding Ir globally (Progressive). Volcanism explaining Ir via aerosols (Ad hoc?). But Volcanism also predicting fossil gradations (Progressive?).
