prompt: |-
  i'm a second year phd student and my term paper is on logical omniscience, and i've hit an embarassing wall: i can't actually say what would count as *solving* it. the setup is everywhere — standard epistemic logic has agents knowing every logical consquence of what they know, real agents don't, something's off. but "something's off" is compatible with at least three very different responses: fix the logic so closure fails, keep the ideal model and say it's fine as an idealization of a bounded agent's competence, or say the target was never knowledge-of-consequences in the first place and the paradox comes from equivocating. my advisor told me to stop surveying and instead say what i'd demand of a theory, which is fair, so that's what i want from you: write me the desiderata list. what does an adequate account of a bounded agent's attitudes toward logical consequences have to deliver — which cases must it get right, which distinctions can it not collapse, which results does it have to be consistent with — and put the motivating case behind each requirement.

  some things i want on the list (tell me if any are camp prejudice rather than a real requirement): the mathematician who knows her axioms, hasn't yet proved the theorem — she's not *believing the negation*, she's also not exactly believing the theorem, so whatever the theory says has to respect the difference between disbelieving p, believing not-p, and never having gotten around to p. also no skeptical disaster: if closure fails, i need it to not turn out that ordinary agents fail to know anything at all, since every mundane fact has some remote consequence they haven't drawn. also the theory has to explain why deduction is still *useful* — an agent who genuinely failed to know consequences wouldn't gain anything by working through a proof, but obviously deriving stuff on demand is how we operate, so the account has to model the difference between what an agent believes outright and what it can get with some amount of reasoning. also the arithmetic point: an agent closed under consequence who knows the axioms of arithmetic knows every theorem, including ones that took humans centuries, which seems to be where the idealization stops being harmless. also, if the fix is permissive enough to block all the consequences, it shouldn't be so permissive that agents can believe outright contradictions. and there's a probabilistic twin of the problem — tautologies get probability 1, so the same issue recurs for degrees of belief — plus a decision-theoretic one: a doctor who keeps deducing forever never orders the treatment, so arguably the theory has to be good enough to say when an agent should stop computing. tell me which of these are genuinely non-negotiable and which are just what one camp happens to care about.

  then: flag any subset of the desiderata that you suspect can't be jointly satisfied — if there's a tension, say exactly where it bites, that's the part i most want. and say which single requirement knocks out the most contenders. last thing, a quick scorecard of the three obvious moves — impossible worlds, awareness-style restrictions on what the agent has even entertained, and just biting the bullet that the ideal model is a competence model and real agents only approximate it — against the list. don't send me to the literature, i can find it, the list itself is what i'm missing.
