          *   Nuance 2: Falsifiability. It's not that a specific experiment shows 2+2=5 directly. It's that if our best physics *requires* a non-standard arithmetic to make sense of quantum mechanics, we might change the math. (Mention Quantum Logic as an example).
          *   Warning: This is "Confirmational Holism." Be careful not to say math is *inductive* in the same way gravity is. It's about system-wide coherence.
