      *   **User's Understanding:** Quine destroyed the analytic/synthetic distinction. Therefore, analytic truths (like math or definitions) are actually empirical. Therefore, "2+2=4" is just a very well-confirmed scientific hypothesis, potentially falsifiable by experiment.
      *   **Proposed Thesis:** "Math is just extremely well confirmed science."
      *   **Second Question:** Why is it still called "analytic philosophy" if Quine killed analytic truths? Did everyone agree with Quine in 1951?
