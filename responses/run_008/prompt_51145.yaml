  ok so i'm writing my end of term essay for philosophy and i picked quine bc the "two dogmas" paper sounded cool, and i think i actually get most of it but now im stuck on what seems like the obvious consequence and nobody in class will just say it straight. quine proved that the analytic/synthetic distinction is bogus right, like there's no such thing as an analytic truth. so doesn't that mean statements like "2+2=4" or "all bachelors are unmarried" are really just empirical claims, the same kind of thing as "water boils at 100 degrees"? and if thats true, could we in principle do an experiment that shows 2+2=5, sort of like how we found out newtonian mechanics was wrong? my essay is basically going to be "math is just extremely well confirmed science" and honestly it feels like a banger of a thesis.

  also second question - my teacher mentioned that quine's argument basically settled it and everyone agreed after 1951, which is why it's such a famous paper. but then why does everyone still call it "analytic" philosophy? like is that term just a leftover from before, or did the people who do analytic philosophy never actually believe in analytic truths in the first place?

  if i'm misreading quine here or my thesis is secretly terrible please just tell me straight, i'd way rather find out now than after i hand it in. also if the answer is genuinely contested among philosophers (like maybe some of them think quine lost this argument?) i want to know that too, dont just give me the neat version.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

