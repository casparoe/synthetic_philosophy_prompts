      *   *The Ethical Problem:* Covert manipulation of classmates (making them think they are helping when they are being tested, inducing mood/stress covertly) is ethically fraught in a classroom setting, even with consent. Deception in research requires IRB approval usually. In a pedagogical context, it risks trust.
      *   *The "Rigged" Problem:* If the tasks are too trivial (small stakes), virtue ethicists will rightly say "of course traits didn't show up, virtues require practice and high stakes." This might confirm the situationist critique too easily without giving virtue ethics a fair shake.
      *   *The Criterion Problem:* The prompt asks to use the students' struggle to code behavior as an instance of the criterion problem. This is a strong insight.
