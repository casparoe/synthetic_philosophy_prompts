answer: |-
  Dear Colleague,

  It is a bold and pedagogically sound instinct to want your students to encounter the situationist critique phenomenologically rather than merely textually. There is a distinct difference between reading about the Good Samaritan study and feeling the pressure of the clock yourself, and that embodied recognition can anchor the subsequent philosophical debate in a way that abstract argumentation often fails to do. However, because you have asked me to be candid about the design, I must start by pushing back on two significant elements of your sketch before offering a revised plan. The first concerns the ethics of covert manipulation in a seminar setting, and the second concerns the methodological noise introduced by asking students to predict the behavior of their classmates.

  Regarding the ethical constraint, you asked whether this can be run with consent given at the right level of abstraction. My judgment is that full covert manipulation of classmates is too risky for a philosophy classroom, where trust is the currency of discussion. If students feel they have been used as unwitting props in a psychological experiment without their knowledge, it can damage the rapport necessary for the rest of the term. However, you do not need full deception to make the lesson work. You can run this with informed consent that masks the hypothesis. In the setup session, you should tell them explicitly that they will be participating in behavioral exercises that will be observed and analyzed later, and that some variables will be manipulated to see how they affect decision-making. You do not need to tell them which variables or what philosophical point is at stake. This preserves their autonomy to consent to being observed while maintaining the surprise necessary for the data to be authentic. If you feel even this is too intrusive, the honest alternative is to tell them exactly what you are testing, which removes the surprise element and likely dampens the situational effects, as knowing one is being tested for helpfulness often triggers demand characteristics. I strongly advise the masked hypothesis approach with explicit consent for observation, as it balances pedagogical efficacy with respect for the students as participants rather than subjects.

  The second issue where I must push back is your plan to have students write trait attributions and predictions for named classmates. With a class size of sixteen, this introduces a confounding variable that will muddy the philosophical water you are trying to clarify. If Student A predicts that Student B will not help, and Student B does not help, you cannot tell if this is because virtues do not exist or simply because Student A does not know Student B well. Upper-level seminars often consist of students who know each other only superficially. This measures acquaintance, not character. Furthermore, if the prediction fails, the student whose character was misjudged may feel defensive, shifting the focus from metaphysics to interpersonal awkwardness. I suggest you shift the prediction element to self-attribution. Have them assess their own virtues and predict their own behavior. The situationist critique is partly about the gap between our self-conception and our actual behavior. When a student who rates themselves as highly honest fails to return extra change in a specific framing condition, the cognitive dissonance is personally relevant and philosophically potent without risking social friction between peers. You can still have them observe peers, but without the high-stakes element of public prediction.

  With those adjustments in mind, here is how I would structure the activity. In the twenty-minute setup session the previous week, after securing consent for behavioral observation with masked hypotheses, distribute index cards. Ask each student to write down three virtues they believe they possess strongly and one situation where they believe that virtue would reliably guide their action. For example, I am honest, so I would return a lost wallet. Collect these and keep them sealed. This establishes their baseline self-conception. For the main ninety-minute session, design three rotating stations or rounds of tasks that vary the situational parameters you mentioned. For the first round, create a helping task, such as sorting papers for a distressed research assistant, but vary the time pressure. Half the class is told they have ten minutes to complete a subsequent task, the other half is told they have an hour. For the second round, create a truth-telling task involving a small pot of money where they can easily cheat to increase a payout, but vary the framing. In one condition, frame the money as a bonus for performance; in the other, frame it as shared community resources. For the third round, vary the responsibility diffusion. Have them solve a problem where someone else is ostensibly responsible for the outcome versus one where they are solely accountable. Ensure the tasks are engaging enough to absorb them but low-stakes enough to be ethical. Throughout this, have a co-instructor or trusted observer quietly record the behavioral outcomes without the students knowing exactly which behaviors are being tracked.

  The debrief is where the philosophical work happens, and it must be handled with care to avoid cynicism. Begin by returning their index cards and asking them to compare their self-predictions with what actually happened in the tasks. Reveal the situational variables you manipulated and display the aggregate data on the board. You will likely see that the situational variables correlated more strongly with behavior than their self-reported virtues did. Use this moment to map the activity onto the philosophical argument. Point out that the lack of correlation between their self-conception and their action across different situations illustrates the situationist challenge to cross-situational consistency. Then, pivot to the criterion problem. Ask them how they coded their own behavior during the tasks. Did returning the money because they were being watched count as honesty? Did helping because they had extra time count as kindness? Highlight their struggle to define the act itself as a live instance of the criterion problem. If we cannot agree on what counts as a virtuous act independent of the situation, then measuring the trait becomes impossible. This validates their confusion as a philosophical data point rather than just experimental noise.

  Next, you must give the virtue-ethical replies their due, or the lesson will simply produce nihilists. Ask them whether these tasks actually tested virtue or merely habit and reflex. This opens the door to the argument that virtues are deliberative achievements that require time and reflection, which the time-pressure condition specifically obstructed. Discuss the idea of phronesis or social intelligence, noting that a virtuous agent might recognize the situational pressure and compensate for it, but that this requires a level of moral attention that the experiment deliberately distracted. Make it clear that the situationist critique targets global, robust traits that operate automatically, not necessarily the nuanced, context-sensitive dispositions that some modern virtue ethicists defend. This distinction prevents the activity from becoming a straw-man attack on virtue ethics. You must also be plain about what the activity cannot reproduce. Acknowledge that these were low-stakes tasks with no longitudinal dimension. Real virtue is often forged in high-stakes scenarios over a lifetime, and a ninety-minute session cannot capture the stability of character that develops over years. Admit that you do not have population base rates to know if their behavior was actually abnormal. These are gaps they must fill with lecture and reading, knowing that the classroom activity is a model, not a proof.

  Finally, I want to warn you about what will predictably go wrong the first time you run this. The most common failure mode is that students will feel the tasks are artificial and therefore dismiss the results as irrelevant to real life. They may say that of course they didn't help when rushed, because the task was silly. To mitigate this, you must frame the debrief around the psychological mechanism rather than the specific task. It does not matter if sorting papers is not morally weighty; what matters is that the same psychological mechanism that overrides helping in low-stakes scenarios operates in high-stakes ones. Another predictable issue is that the data might not look clean. With sixteen students, you might not get a statistically significant split. If the data is messy, do not fake it. Use the messiness itself as a teaching moment about the difficulty of empirical ethics and the complexity of human behavior. If the situationist effect does not show up strongly, ask them why. Was the situation not strong enough? Were their virtues too robust? This turns a failed experiment into a successful inquiry into the conditions required for situationism to hold. There is also a risk of ethical discomfort during the debrief if students feel embarrassed by their own behavior. Normalize this feeling. Tell them that the point of the literature is that almost everyone behaves this way, and that recognizing the situational power is the first step toward building better environments for virtue, rather than blaming individual character.

  If you navigate the consent carefully, shift the prediction to self-assessment to avoid social noise, and handle the debrief with a balance of empirical realism and philosophical charity, this could be the session they remember years later. The goal is not to prove situationism true, but to make the problem undeniable. I hope this helps you refine the plan, and I would be happy to hear how it goes once you have run it.

  Best regards,

  A Colleague
