answer: |-
  You have a very sharp philosophical instinct. That "something feels off" feeling you have is actually one of the most famous problems in modern ethics, articulated by the philosopher Thomas Nagel in his 1979 essay *Moral Luck*.

  Your friend is trying to have it both ways, and your intuition that the argument for "equal blame" logically slides into "no blame" is correct. Here is exactly where the reasoning wobbles, why your friend is being inconsistent, and how you can keep your principle (1) without accepting conclusion (6).

  ### 1. Where the reasoning goes wrong
  The break in the chain happens at **Step 7**.

  Your friend is running two different arguments simultaneously and pretending they don't interfere with each other:
  *   **Argument A (Steps 2 & 3):** This attacks *Resultant Luck*. It says outcomes (killing a kid vs. getting caught) shouldn't change moral judgment. This is widely accepted.
  *   **Argument B (Steps 4 & 5):** This attacks *Constitutive Luck*. It says your very character and choices are determined by genes/environment. This leads to Hard Determinism.

  Your friend uses **Argument B** to unsettle you (showing how deep "luck" goes), but then refuses to accept the conclusion of Argument B (Step 6). Instead, they pivot at Step 7 and say, "Well, luck is everywhere, so we just blame people anyway."

  **The Error:** If luck is "baked in" to the point where *nothing* is under our control (Step 5), then the Control Principle (Step 1) dictates that *nothing* is blameworthy. Your friend cannot claim that "luck undermines outcome-based blame" (Step 3) while simultaneously claiming "luck does *not* undermine choice-based blame" (Step 7). If luck invalidates control regarding the *result*, it invalidates control regarding the *decision* for the exact same reason.

  Your friend is essentially saying: "The dice are loaded, so we can't blame you for the number that came up, but we can still blame you for rolling the dice." If the dice are truly loaded (determinism), the second part doesn't hold.

  ### 2. Can he have both?
  Technically, **no**, not if he sticks to the strict logic of Steps 1 through 5.

  However, many philosophers (called **Compatibilists**) do try to have both. They argue that "control" doesn't require magical, metaphysical freedom from cause-and-effect. They argue you have control if you act according to your own desires and reasoning, even if those desires were caused by genes/upbringing.

  Your friend is trying to be a Compatibilist, but they are using Incompatibilist logic (Steps 4-5) to make their point. They are saying, "You are determined (4-5), but you are still blameworthy (7)." Without redefining "control," that is a contradiction. To make it work, he has to admit that Step 5 is false *in the relevant sense*.

  ### 3. Which step is cheapest to lose?
  You said you want to keep **(1)** (The Control Principle) and reject **(6)** (No Blame). To do that, you must reject **(5)**.

  **Step 5 ("Nothing about us is under our control") is the cheapest step to lose.**

  Here is why: Step 5 assumes a definition of "control" that is impossibly high. It assumes that for you to be in control, you must have created your own genes, chosen your own parents, and existed outside the laws of physics. That is "God-like" control, not human control.

  If you reject Step 5, you can adopt a **Compatibilist** view of control:
  *   **Control isn't about being uncaused;** it's about being *responsive*.
  *   Did your coworker respond to reasons? Yes. He knew drinking and driving was illegal and dangerous. He weighed that against his desire to get home. He chose the desire.
  *   The fact that his *capacity* to weigh reasons was influenced by genetics doesn't mean he lacked control *in the moment*.

  By rejecting Step 5, you save Step 1. You can say: "I only blame you for things under your control. You had control over your decision to drive drunk, even if your personality was shaped by luck. Therefore, you are blameworthy."

  ### 4. How to view your coworker
  Your friend's argument was useful for one thing: It correctly identified that your coworker is **morally equivalent** to the driver who killed the kid. That is a hard pill to swallow, but it's true. The only reason we punish the killer more is utilitarian (deterrence, retribution for harm), not because they were *more* immoral in the moment of decision.

  However, your friend is wrong to suggest that this equivalence dissolves blame entirely.

  **The Verdict:**
  1.  **Keep (1):** Blame requires control.
  2.  **Keep (2) & (3):** Your coworker is just as blameworthy as a drunk driver who kills someone. Outcome luck shouldn't excuse him.
  3.  **Reject (5):** Determinism does not eliminate control. We have "sufficient control" to be held accountable for actions that flow from our own reasoning, even if that reasoning has prior causes.
  4.  **Reject (6):** Because we have sufficient control, blame is valid.

  **Why your friend is annoying you:**
  He is using a "nuclear option" argument (determinism removes all control) to win a tactical point (outcome luck doesn't matter), but then he refuses to detonate the nuke. He wants the devastation of determinism to wipe out the difference between the two drivers, but he wants a shield to protect the concept of blame itself.

  You are right to feel that if you open the door to "it's all luck," you can't just choose which things the luck applies to. But you don't have to open that door. You can assert that **human control is real enough**, even if it isn't metaphysically perfect. Your coworker made a choice. He controlled the car. He controlled the bottle. That is enough for blame.
