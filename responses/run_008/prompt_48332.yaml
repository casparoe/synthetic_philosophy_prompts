answer: |-
  This is a profound observation about the unwritten ethics of conversation. You have stumbled upon a central debate in epistemology (the theory of knowledge) and the philosophy of language. Your intuition is correct: the rule your circle enforces is not about truth, and it is not about belief. It is about **warrant**.

  Here is an analysis of what your social rule presupposes, whether it is consistent, and how life would look under the rival rules you proposed.

  ### 1. What Rule Are You Actually Enforcing?

  The rule your group enforces is what philosophers call the **Knowledge Norm of Assertion**.

  Proposed most famously by philosopher Timothy Williamson, this norm states: *You should assert that $p$ only if you know that $p$.*

  In your dinner example, your friend violated this norm. He asserted a specific, contingent fact ("The neighbor is selling") without possessing knowledge. In epistemological terms, he had a **Gettierized belief**: he had a belief that turned out to be true, but not because of the justification he had. His justification (the brother-in-law) was flawed (the brother-in-law lied). The truth was accidental. Because his connection to the truth was broken, he did not *know* it, even though it *was* true. Your group punished him not for being wrong, but for claiming an epistemic authority he did not possess.

  **Is it one consistent rule or several?**

  It is one underlying principle (**Epistemic Responsibility**) applied with **contextual thresholds**. This explains the "Rain in June" exception.

  *   **Specific Claims (High Threshold):** When you speak about a specific, changeable state of affairs (a neighbor selling a house), the stakes for accuracy are high, and the information is not publicly available. The threshold for "knowledge" is strict: direct observation or a verified chain of custody.
  *   **Generalizations (Low Threshold):** When you say "It always rains here in June," you are not making a specific factual claim about the future; you are stating a **heuristic** or a piece of **common knowledge**. Everyone at the table shares the burden of verification for that claim because it is based on collective experience.

  So, the rule is consistent, but the *cost of entry* varies.
  1.  **Stakes:** If acting on the information could cause harm (e.g., "Don't buy that car, it's a lemon"), the warrant must be stronger.
  2.  **Publicity:** If the information is private (neighbor's finances), you need direct access. If it is public (weather patterns), shared experience suffices.
  3.  **Precision:** Specific claims require specific evidence. General claims allow for probabilistic evidence.

  Your group is not applying different rules; you are applying a sliding scale of **Epistemic Authority**. You are demanding that the speaker's confidence matches their evidence.

  ### 2. The Rival Rules: How Conversations Would Change

  If you explicitly adopted one of the three rival rules you mentioned, the texture of your daily life would change drastically.

  #### Rule A: "Only Say What Is True" (The Truth Norm)
  *   **The Principle:** You are permitted to say anything, provided it turns out to be the case.
  *   **The Conversation:** This would create a world of **retrospective validation**. You could guess wildly at dinner. "The neighbor is selling." "The stock market will crash tomorrow." If you are right, you are vindicated. If you are wrong, you apologize.
  *   **The Consequence:** Trust would collapse. We would stop treating assertions as information and start treating them as gambles. You would never know if a speaker was reliable or just lucky. Conversation would become high-risk; people would speak less, or they would speak in a way that hedges every bet so they can't be held accountable.
  *   **Verdict:** This is impossible to live by because humans are not omniscient. We cannot know if a statement is true *before* we say it.

  #### Rule B: "Only Say What You Sincerely Believe" (The Sincerity Norm)
  *   **The Principle:** As long as you aren't lying, you can say it.
  *   **The Conversation:** This would create a world of **unfiltered subjectivity**. Rumors would flow like water. "I heard the neighbor is selling" would become "The neighbor is selling." Conspiracy theories would thrive because the speaker *believes* them.
  *   **The Consequence:** Information quality would plummet. The distinction between "fact" and "opinion" would vanish. We would spend all our time managing conflicting subjective realities rather than coordinating on shared facts. However, people might feel more "heard" and emotionally expressive.
  *   **Verdict:** This is the default mode of social media, and as you noted, your circle explicitly rejects it.

  #### Rule C: "Only Say What You Know" (The Knowledge Norm)
  *   **The Principle:** You must have justified true belief (without luck) to assert a fact.
  *   **The Conversation:** This would create a world of **cautious precision**. People would hedge constantly. "I haven't verified this, but..." or "My understanding is..." would become standard prefixes. Silence would increase.
  *   **The Consequence:** Information flow would slow down, but reliability would skyrocket. When someone finally made a flat assertion ("The neighbor is selling"), everyone would act on it immediately. Trust would be very high.
  *   **Verdict:** This is the ideal your circle strives for.

  ### 3. Which Rule Do We Actually Live By?

  We live closest to **Rule C (Knowledge)**, but with a crucial, unspoken modification: **We allow Rule B (Belief) for low-stakes generalizations.**

  If we strictly lived by Rule C (Only Knowledge), conversation would grind to a halt. We do not *know* it will rain in June; we only have inductive evidence. We do not *know* the restaurant is good; we have heard reviews. If we required Cartesian certainty for every assertion, we would be mute.

  So, the actual rule we live by is: **"Assert only what you know, or what is safe to assume based on shared context."**

  Your friend was punished because he treated a **private, high-stakes fact** (a specific neighbor's financial move) as if it were **shared, low-stakes context**. He tried to bypass the verification cost that the specific claim demanded.

  **Conclusion**
  Your circle's unwritten rule is a sophisticated social technology. It preserves trust by ensuring that assertions carry the weight of evidence.
  *   **The "Rain" exception** proves the rule isn't about truth, but about **epistemic labor**. Everyone has done the labor of observing June weather over the years; no one has done the labor of checking the neighbor's deed.
  *   **The "Friend" punishment** proves the rule isn't about belief, but about **warrant**. He hadn't done the work to own the fact.

  You are living by the **Knowledge Norm**, but you are wise enough to recognize that "knowledge" includes both verified facts and agreed-upon generalizations. To switch to "Only Truth" would make you gamblers; to switch to "Only Belief" would make you gossips. You have chosen to be **witnesses**, which is the hardest role of all.
