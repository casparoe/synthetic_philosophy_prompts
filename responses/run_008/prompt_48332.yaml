          *   Answer the "One Rule or Many?" question: It's one principle (Epistemic Authority) with **Contextual Thresholds**. Stakes matter.
      *   **Part 2: The Rival Rules (Counterfactual Conversations).**
          *   *World of Only Truth:* The "Oracle" problem. You can't know if you're allowed to speak until after the fact. Leads to silence or gambling.
