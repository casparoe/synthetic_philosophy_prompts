answer: |-
  Here is the definite position you asked for: **The standard practice is philosophically incoherent.** It relies on an epistemic bait-and-switch that treats social signals as *independent evidence of quality* when it suits the platform's need for legitimacy, but engineers them as *dependent drivers of momentum* when it suits the platform's need for conversion.

  You cannot have it both ways. A rating aggregate is either a statistical approximation of objective quality (which requires independence) or a record of social contagion (which implies dependence). Current platform design claims the former to earn your trust while actively constructing the latter to capture your wallet.

  ### The Epistemic Bait-and-Switch

  The incoherence lies in the justification for why you should trust the number.

  When a platform displays "4.8 stars (10,000 ratings)," it is invoking **Condorcet's Jury Theorem**. The implicit argument is: *Many independent agents have assessed this item; errors cancel out; the average converges on the truth.* This presupposes that my rating is a fresh signal added to a pool of other fresh signals.

  However, the UI design invokes **Banerjee's Information Cascade model**. By sorting by "Best Selling," displaying "1,200 people bought this," or putting the average rating above the fold, the platform ensures that my decision is *not* independent. I am not assessing the item; I am assessing the item *plus* the prior assessments of others. If I rate it 5 stars because the average is 4.8, I am not adding new information; I am amplifying existing noise.

  The platform wants the **authority** of the Wisdom of Crowds without the **structural reality** of it. They want you to believe the number represents a consensus of independent experts, because that makes the number a reliable truth-claim. But they simultaneously want you to behave like a herd animal, because herding reduces decision friction and increases sales velocity. If the signals were truly independent, the "Best Seller" badge would be redundant information. If the signals are cascades, the "4.8 stars" is a self-fulfilling prophecy, not a quality metric.

  ### What a "Cascade-Aware" Platform Would Look Like

  If a platform genuinely believed that information cascades degrade the epistemic value of their data, they would have to radically alter their interface to protect signal independence. Here is what that would concretely entail:

  1.  **Blind Voting (The Pre-Commitment Widget):** As you noted, the platform must collect your rating *before* revealing the aggregate. You interact with the content, submit your score, and *then* the system says, "Thanks! The community average is 4.2." This prevents anchoring.
  2.  **Randomized Default Sorting:** "Most Popular" and "Top Rated" must never be the default view for new users. The default should be chronological or randomized. This prevents the "rich get richer" dynamic where early lucky items lock in the top spot permanently, starving new items of the visibility required to generate independent signals.
  3.  **Signal Decay or Clustering:** To prevent early noise from locking in a cascade, the displayed average should weight recent ratings more heavily than older ones, or display ratings in temporal clusters (e.g., "Recent 30-day average") rather than a lifetime cumulative sum. This acknowledges that early ratings might have been based on less information or different contexts.
  4.  **Suppression of Count Salience:** Remove "X people bought this" counters. These are pure herd triggers with zero epistemic value regarding quality. They only signal volume, which is often a function of marketing spend, not product merit.

  ### What The Platform Would Lose

  So why don't they do this? It's not an oversight. It's a trade-off. A platform that prioritized epistemic coherence over cascade engineering would suffer three specific losses:

  1.  **Decision Friction (Conversion Rate):** Herding is a heuristic. It allows users to make fast decisions with low cognitive load. If you remove the "1,200 people bought this" shortcut, users have to actually read descriptions or compare features. This increases abandonment rates. The cascade *is* the conversion engine.
  2.  **The Blockbuster Effect (Revenue Concentration):** Platforms rely on winner-take-all dynamics. A few massive hits subsidize the long tail. Cascades create superstars; independent signals create a bell curve. If you randomize sorting and blind votes, you flatten the distribution of attention. You get a more accurate map of quality, but you lose the massive revenue spikes generated by viral snowballing.
  3.  **Perceived Trust (The Paradox):** Ironically, hiding the numbers might make users feel *less* safe. Even if the numbers are epistemically poisoned, users derive comfort from social proof. A platform that says "We hid the rating so you wouldn't be biased" sounds paternalistic and suspicious. Users prefer the illusion of independent wisdom, even if it's structurally impossible.

  ### The Verdict

  The practice is incoherent because it treats ratings as **data** when selling the platform to users ("trust our reviews"), but as **levers** when operating the platform ("drive engagement").

  A philosophically consistent platform would admit that the displayed number is not a measure of *quality*, but a measure of *momentum*. It would label the 4.8 stars not as "Average Rating," but as "Social Consensus Index," acknowledging that the number reflects how well the product triggered a cascade, not necessarily how good the product is. Until they make that distinction explicit, they are asking you to treat a self-fulfilling prophecy as a statistical fact.
