prompt: |-
  I'm on the three-person steering committee of a forecasting shop (about 25 analysts who produce probability estimates for corporate clients on things like product launches and geopolitical risk). Our CEO heard about Aumann's agreement theorem on a podcast and is now convinced that disagreement between our analysts is basically evidence of irrationality: if two smart people have shared all their evidence, they should walk out with the same numbers. So he's proposed a "convergence policy": whenever two analysts still disagree meaningfully on an estimate after a full evidence-sharing session, they get scheduled into daily recalibration meetings until their credences converge, and a slice of their bonus depends on how quickly they converge. One of my colleagues thinks this is a neat operationalization of a real theorem, the other thinks it just pays people to fake agreement and manufacture groupthink. Draft the memo I'll circulate before our thursday call recommending adopt, reject, or adopt with changes -- and if changes, the actual revised policy wording. Structure it as: Summary (~100 words), What the theorem does and doesn't actually license (~200 words), The case for the CEO's policy, The strongest argument against it, Recommendation and concrete policy text. Take the CEO seriously -- he's not wrong that there's something real in the idea -- but be honest about where his analogy to messy human analysts breaks down.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Member of a three-person steering committee at a forecasting shop (25 analysts).
      *   **Audience:** The other two committee members (and implicitly the CEO, as this is for a Thursday call to decide on policy).
      *   **Topic:** CEO's proposal based on Aumann's Agreement Theorem (daily meetings until convergence, bonus tied to speed of convergence).
      *   **Conflict:** One colleague likes it (operationalizing theory), one hates it (incentivizes faking/groupthink).
      *   **Task:** Draft a memo recommending Adopt, Reject, or Adopt with Changes (including revised policy text).
      *   **Structure:**
          1.  Summary (~100 words).
          2.  What the theorem does and doesn't actually license (~200 words).
          3.  The case for the CEO's policy.
          4.  The strongest argument against it.
          5.  Recommendation and concrete policy text.
      *   **Tone:** Take the CEO seriously (acknowledge the kernel of truth) but be honest about the limitations (human messiness vs. Bayesian ideal).

  2.  **Deconstruct Aumann's Agreement Theorem:**
      *   *What it says:* Two Bayesians with common priors and common knowledge of each other's posteriors cannot agree to disagree.
      *   *Key Assumptions:* Common priors, perfect rationality, common knowledge of posteriors (knowing *what* they think and *why* without loss), honest reporting.
      *   *Reality Check:* Humans aren't perfect Bayesians. Priors differ. "Sharing evidence" isn't the same as "common knowledge of posteriors." Incentivizing convergence creates Goodhart's Law issues (measure becomes target).

  3.  **Evaluate the CEO's Policy:**
      *   *Intent:* Reduce noise, increase accuracy, enforce rigor.
      *   *Risk:* Coercion, groupthink, gaming the system (fake agreement to get the bonus), burnout (daily meetings).
      *   *Verdict:* The core insight (disagreement often stems from unshared info) is valuable. The mechanism (forced convergence + financial penalty) is dangerous.
      *   *Recommendation:* Adopt with Changes. We need to encourage resolution but not mandate identical numbers or tie money to speed.

  4.  **Drafting - Section by Section:**

      *   **Summary:** Needs to be punchy. Acknowledge the CEO's insight but flag the implementation risk. Recommend a modified approach.
      *   **The Theorem:** Explain "Common Priors" and "Common Knowledge." Explain that humans don't have common priors and "sharing evidence" $\neq$ "common knowledge."
      *   **Case for CEO:** Efficiency, reducing noise, forcing engagement. It stops analysts from siloing.
      *   **Case Against:** Goodhart's Law. If you pay for convergence, you get fake convergence. Groupthink kills the value of diverse perspectives (the "wisdom of crowds" aspect).
      *   **Recommendation & Policy:** Shift from "mandatory convergence" to "structured reconciliation." Remove the bonus tie to *speed*. Focus on documenting *why* disagreement persists.

  5.  **Refining the Content (Self-Correction/Iterative Process):**
      *   *Word Count Check:* Keep Summary tight (~100). Keep Theorem section dense but clear (~200).
      *   *Tone Check:* Don't sound like I'm lecturing the CEO on math. Sound like a partner helping him implement his vision *successfully*.
      *   *Policy Wording:* Needs to sound like actual HR/Operations policy.
      *   *Constraint:* "Take the CEO seriously." Avoid dismissing Aumann. Acknowledge that *persistent* disagreement *can* signal a process failure, just not necessarily irrationality.

  6.  **Drafting the Content (Mental or Scratchpad):**
      *   *Summary:* CEO is right that disagreement often means info asymmetry. But Aumann assumes perfect rationality. Tying bonus to speed creates perverse incentives. Recommend "Structured Reconciliation" instead of "Forced Convergence."
      *   *Theorem:* Aumann proves honest Bayesians with same priors can't disagree on posteriors. Key constraints: Common priors (humans differ), Common knowledge (hard to achieve), Truthfulness (bonuses encourage lying).
      *   *Pro:* Stops silos. Forces dialogue.
      *   *Con:* Groupthink. Analysts will just average numbers to stop meetings. Kills diversity of thought which is our product's value.
      *   *Policy:* If disagreement > X%, trigger review. Not daily meetings. Bonus on accuracy, not speed. Document divergence reasons.

  7.  **Final Polish:** Check word counts and formatting. Ensure the "Recommendation" is clear. (The prompt asks for "Recommendation and concrete policy text").

      *(Self-Correction on Word Count)*: I need to be careful not to go way over on the Theorem section. Keep it precise.
      *(Self-Correction on Tone)*: Ensure I don't sound like the colleague who thinks it's "groupthink." I need to bridge the gap.

  8.  **Final Review against constraints:**
      *   Summary ~100 words?
      *   Theorem ~200 words?
      *   Structure followed?
      *   Policy text included?
      *   Tone appropriate?

      *Let's write it.*
answer: |-
  **MEMORANDUM**

  **TO:** Steering Committee
  **FROM:** [Your Name]
  **DATE:** Wednesday, October 25
  **SUBJECT:** Recommendation on Proposed Analyst Convergence Policy

  **Summary**
  The CEO's intuition is correct: persistent disagreement often signals unshared information or process failure. However, Aumann's Agreement Theorem relies on assumptions (common priors, perfect rationality) that do not hold for human analysts. Tying compensation to the *speed* of convergence creates perverse incentives to fake agreement, destroying the diversity of thought that drives our accuracy. I recommend we reject the "daily meeting" mandate and bonus structure but adopt a "Structured Reconciliation" process that documents *why* disagreements persist without forcing identical numbers.

  **What the Theorem Does and Doesn't License**
  Aumann's theorem proves that two honest Bayesians with *common priors* and *common knowledge* of each other's posteriors cannot agree to disagree. It is a powerful normative ideal, but it is not a descriptive manual for human psychology. First, our analysts do not share common priors; their different backgrounds are features, not bugs, allowing us to capture diverse signal. Second, "sharing evidence" in a meeting is not the same as establishing "common knowledge" of posteriors; humans struggle to fully articulate their internal weighting of evidence. Finally, the theorem assumes honest reporting. By financially penalizing disagreement, we violate the honesty assumption, incentivizing analysts to lie about their true credences to stop the meetings. The theorem licenses encouraging information sharing; it does not license mandating identical outputs.

  **The Case for the CEO's Policy**
  The CEO is right that frictionless disagreement is often lazy disagreement. In our current workflow, analysts can silo themselves, ignoring contradictory data held by colleagues. A convergence requirement forces engagement. It ensures that when Analyst A says 60% and Analyst B says 90%, they cannot simply average the numbers or ignore the gap. It operationalizes the idea that our product is a consolidated view of reality, not a collection of individual opinions. Furthermore, reducing variance in our forecasts can improve client trust, provided the consensus is well-reasoned.

  **The Strongest Argument Against It**
  The policy triggers Goodhart's Law: when a measure becomes a target, it ceases to be a good measure. If a slice of bonus depends on *quick* convergence, analysts will converge immediately to avoid daily meetings, regardless of the evidence. This manufactures groupthink and eliminates the "wisdom of crowds" benefit of having 25 independent analysts. If everyone is forced to the same number to protect their bonus, we lose the ability to detect tail risks that only a minority might see. Additionally, daily meetings for unresolved disputes will cause burnout and reduce time actually spent researching.

  **Recommendation and Concrete Policy Text**
  We should adopt the *spirit* of the policy (rigorous reconciliation) but reject the *mechanism* (forced convergence and speed bonuses). We must reward accuracy, not agreement.

  **Revised Policy: Forecast Reconciliation Protocol**

  1.  **Trigger:** If two primary analysts on a single forecast differ by >15% probability after initial research, a Reconciliation Session is mandatory.
  2.  **Process:** Analysts must submit a joint "Divergence Memo" outlining specific evidentiary weights causing the gap.
  3.  **Resolution:** Analysts may update their numbers based on the session, but *identical convergence is not required*. Persistent disagreement must be flagged to the Steering Committee as a "High Uncertainty Signal."
  4.  **Compensation:** Bonuses are tied solely to Brier scores (accuracy) over time. No bonus component is tied to the speed of agreement or variance reduction.
  5.  **Escalation:** If disagreement persists after two sessions, a third senior analyst is assigned as a tie-breaker for the client deliverable, while original estimates are archived for post-mortem analysis.
