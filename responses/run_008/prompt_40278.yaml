answer: |-
  # Q&A Prep Sheet: Truth-Conditional Indicatives & Restricted Stalnaker

  **Context:** Formal Epistemology Workshop.
  **Audience:** Hostile/Expert. They know Lewis, Hájek, Bradley, and the triviality literature better than you do.
  **Goal:** Survive without conceding the core thesis. Do not try to win; try to show the view is tenable.

  ---

  ### 1. The Import-Export Trap (High Damage)
  **The Objection:**
  "You restrict the Stalnaker Thesis (ST) to 'focused' cases to avoid Lewis's result. But Lewis's proof doesn't require unrestricted ST; it only requires ST to hold for a sufficiently rich set of propositions. If you accept Import-Export (I-E)—that $(A \land B) \to C$ is equivalent to $A \to (B \to C)$—you can generate nested conditionals from simple ones. Even if $A$ is live, $B$ might not be live in the context of $A$. If I-E holds, you can transform a case where ST holds into a nested case where you claim it fails, but logical equivalence demands they have the same probability. Doesn't I-E + your Restricted ST still yield a local triviality result for the focused fragment?"

  **The Reply (2 mins):**
  "I deny that I-E holds unrestrictedly for indicative conditionals, specifically in the cases that generate triviality. My view is that the truth conditions of conditionals are sensitive to the epistemic context of evaluation. When we move from $A \to (B \to C)$ to $(A \land B) \to C$, we shift the context. In the nested case, we are evaluating $B \to C$ in a context where $A$ is assumed. This can change whether the antecedent $B$ is 'focused' or live. Therefore, the probability of the nested conditional isn't required to match the probability of the conjoined antecedent conditional in the way I-E demands. I'm willing to sacrifice unrestricted I-E to save the truth-conditional account from triviality. The cost is lower than accepting that conditionals aren't propositions."

  **Where it's Soft:**
  Sacrificing I-E is a major bullet to bite. Logicians love I-E. If they press that your view makes the logic of indicatives extremely weak or non-standard, you have little recourse other than saying "Truth conditions trump intuitive logical equivalences."

  ---

  ### 2. The "Same Proposition, Different Probabilities" Charge (High Damage)
  **The Objection:**
  "You claim $A \to B$ always expresses the same proposition $p$, regardless of context. But you also claim $P(p) = P(B|A)$ only when $A$ is 'focused.' If $p$ is the same proposition, its probability is determined solely by the probability function $P$ and the world, not by whether $A$ is 'live' in the context. By making the validity of the Stalnaker equation depend on the *status* of the antecedent in the context, aren't you effectively reintroducing assertability conditions under a different name? You're saying the *semantic* value is constant, but the *probabilistic* behavior varies pragmatically. How do you ground that disconnect without making the view ad hoc?"

  **The Reply (2 mins):**
  "The disconnect isn't ad hoc; it's grounded in the cognitive role of belief. The Stalnaker Thesis isn't a semantic constraint; it's a constraint on rational credence *when* the agent is using the conditional for planning. When $A$ is live, the agent treats $A \to B$ as a rule for updating on $A$. When $A$ is dead, that planning role vanishes, so the constraint on credence vanishes. The proposition $p$ remains the truth-conditional content, but the *rational pressure* to align $P(p)$ with $P(B|A)$ is lifted. Think of it like indexicals: 'I' refers to different people, but even if it referred to the same person, the *salience* of that reference might change how I bet on it. I'm separating the metaphysics of the proposition from the epistemology of the constraint."

  **Where it's Soft:**
  This is the hardest philosophical sell. If $p$ is a standard proposition, standard probability theory applies to it. Saying "sometimes probability laws apply to $p$ and sometimes they don't" sounds like you're changing the logic of probability, not just the semantics.

  ---

  ### 3. McGee-Style Modus Ponens Failures (Medium-High Damage)
  **The Objection:**
  "Consider a McGee-style case: 'If the Republicans win, then if Reagan doesn't run, Anderson will win.' Intuitively, we accept the conditional and the antecedent, but reject the consequent. On your view, since nested conditionals are 'unfocused,' the probability identity breaks. But does the *logic* break? If $A \to (B \to C)$ is a true proposition, and $A$ is true, does $B \to C$ follow? If yes, you have to explain away the intuitive counterexample. If no, you've abandoned Modus Ponens for your truth-conditional account. Which is it?"

  **The Reply (2 mins):**
  "I preserve Modus Ponens for truth, but acknowledge it fails for *preservation of high credence*. In McGee cases, the nested conditional is true, and the antecedent is true, so the consequent is true. The intuition that the argument is bad stems from the fact that in those contexts, the nested conditional is 'unfocused.' Therefore, our credence in the premise $A \to (B \to C)$ is not tied to $P(C | A, B)$. We can be certain of the premises but uncertain of the conclusion because the probabilistic link is severed in nested contexts. The logic is classical; the epistemology is non-classical."

  **Where it's Soft:**
  Distinguishing truth-preservation from credence-preservation is standard, but if the credence divergence is massive (as in McGee cases), audiences often feel the truth-conditional account is losing touch with the actual use of the connective.

  ---

  ### 4. The "Plan" Story is Pragmatic, Not Semantic (Medium Damage)
  **The Objection:**
  "Your explanation for why the Restricted ST holds relies on a 'toy story' about plans. But plans are pragmatic phenomena. You're using a pragmatic explanation to justify a semantic restriction. How does the fact that I can *use* $A$ as a plan ground the fact that $P(A \to B) = P(B|A)$? It sounds like you're deriving an 'is' (the probability identity) from an 'ought' (how I should plan). Isn't this just Griceanism in disguise?"

  **The Reply (2 mins):**
  "It's not Gricean because I'm not saying the *content* changes. I'm saying the *access* to the content changes. The proposition $A \to B$ is a map of the world. When $A$ is live, the map is used for navigation (planning), which requires the probabilities to align for the navigation to be successful. When $A$ is dead, the map is archival. The 'plan' story explains *why* the constraint exists where it does, not *what* the conditional means. It's an error theory for why people think the ST is unrestricted: they only ever test it in focused contexts."

  **Where it's Soft:**
  "Archival vs. Navigation" is a metaphor. If pressed on the formal mechanism linking planning success to probability identities, you might have to admit this is the least developed part of the paper.

  ---

  ### 5. THE QUESTION I'M HOPING NOBODY ASKS (Critical Damage)
  **The Objection:**
  "You say the proposition expressed by $A \to B$ is constant, but the probability constraint depends on whether $A$ is 'live' in the context. But 'live' is a contextual parameter. If the context changes (e.g., I learn $A$ is impossible), does the proposition expressed by $A \to B$ change?
  *   **If Yes:** You are a contextualist. But Hájek (1989) and others have triviality results for contextualist accounts too. You haven't escaped triviality; you've just moved it to the context shift.
  *   **If No:** The proposition is constant. But then how can a rationality constraint on that *single proposition* turn on and off based on context? If $P(p) \neq P(B|A)$ in context $C_1$ but $P(p) = P(B|A)$ in context $C_2$, and $p$ is identical, then $P(B|A)$ must change value between contexts without $A$ or $B$ changing. That implies conditional probability is context-sensitive in a way that breaks standard probability theory.
  Which horn are you choosing?"

  **The Reply (2 mins):**
  "I choose a modified version of the second horn. The proposition $p$ is constant. Standard probability theory applies to $p$. However, the *Stalnaker Thesis* is not a law of probability; it's a law of *epistemic alignment*. It says: 'When in context $C$ where $A$ is live, align your credence in $p$ with $P(B|A)$.' When context shifts to $C'$ where $A$ is dead, the alignment rule is suspended. $P(B|A)$ doesn't change value; the *requirement to match it* disappears. I am not claiming conditional probability is context-sensitive; I am claiming the normative link between conditional credence and conditional probability is."

  **Where it's Soft:**
  This is the kill shot. If they press that a "normative link" that turns on and off for the *same proposition* based on *epistemic status* is indistinguishable from saying the proposition has different truth conditions in different contexts, you are cornered. You must hold the line that **semantics is static, epistemology is dynamic**, even if the audience thinks that distinction is unsustainable for conditionals.

  ---

  ### General Strategy Notes
  *   **Don't defend the "Plan" story too hard.** It's the weakest link. If they attack it, concede it's a "motivating picture" and retreat to the formal claim: *Restricted ST blocks Triviality.*
  *   **Embrace the cost.** Admitting I-E fails or that MP fails for credence is better than admitting triviality. Formal epistemologists respect a consistent system over an intuitive one.
  *   **Watch the Linguists.** The linguists will care about embedding data. If you say conditionals embed but behave weirdly probabilistically, they will ask about syntactic tests. Keep the reply focused on *semantics*, not syntax.
  *   **Key Phrase to Use:** "I am separating the *truth-conditional content* from the *constraints on rational credence*." Repeat this whenever they conflate probability and truth.
