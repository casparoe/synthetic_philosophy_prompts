      *   **Mechanism:** A "toy story" about plans: live antecedents allow planning, linking conditional prob to prob of conditional proposition.
      *   **Audience:** ~15 experts (formal epistemologists, logicians, semanticists). They know the literature, won't be polite, and will look for technical holes.
      *   **Deliverable:** A Q&A prep sheet.
      *   **Requirements:**
          *   Objections ordered by damage potential.
          *   Phrased technically (as a formal epistemologist would).
          *   Two-minute reply for each.
          *   Note on where the reply is soft/vulnerable.
          *   Must include Import-Export and McGee-style issues.
          *   Must include "The Question I'm Hoping Nobody Asks."

  2.  **Deconstruct the Position & Identify Vulnerabilities:**
      *   *Position:* Truth-conditional indicatives + Restricted Stalnaker Thesis (RST) + "Focused" antecedents + Plan-based explanation.
      *   *Vulnerability 1: Import-Export (I-E).* If I-E holds, and RST holds for *some* cases, can we derive triviality for *those* cases anyway? Usually, triviality proofs rely on I-E + Stalnaker. If I deny Stalnaker generally but accept it for focused cases, does I-E allow me to construct a focused case that behaves like an unfocused one, triggering triviality locally?
      *   *Vulnerability 2: Embedding.* The user says conditionals are propositions, so they *should* embed. But the restriction says the probability identity breaks when embedded. This looks ad hoc. Why does the *meaning* (truth conditions) stay constant but the *probability* connection break just because of embedding?
      *   *Vulnerability 3: The "Focused" Definition.* What exactly makes an antecedent "live"? Is it context-dependent? If so, does the truth condition of the conditional depend on the context of utterance in a way that creates instability (context shift problems)?
      *   *Vulnerability 4: McGee/Modus Ponens.* If nested conditionals break the probability identity, do they also break logical laws like MP? If $A \to (B \to C)$ doesn't behave probabilistically like $P(C|A,B)$, does it still entail $C$ given $A$ and $B$?
      *   *Vulnerability 5: The "Plan" Story.* This is the weakest link philosophically. It sounds pragmatic, but the claim is semantic/metaphysical (they are propositions). Bridging the gap between "planning" and "truth conditions" is risky.
      *   *Vulnerability 6: Bradley's Triviality.* Richard Bradley has developed triviality results that don't rely on the full Stalnaker Thesis but rather on weaker assumptions about independence or revision. Will these catch the restricted view?

  3.  **Drafting the Objections (Iterative Process):**

      *   *Objection 1 (High Damage): Import-Export + Restricted Stalnaker.*
          *   *Phrasing:* Needs to mention that I-E allows transforming a focused conditional into a nested one where the antecedent might not be "live" in the same way, or that I-E + RST is enough for a local triviality result.
          *   *Reply:* Deny I-E for the problematic cases? Or argue I-E preserves "focusedness"?
          *   *Soft Spot:* Denying I-E is costly for a truth-conditional view.

      *   *Objection 2 (High Damage): The Ad Hoc Restriction.*
          *   *Phrasing:* Why does the *proposition* expressed change its probabilistic behavior based on epistemic context? If $A \to B$ expresses proposition $p$, $P(p)$ should be stable. You're making the probability depend on the *status* of $A$, which sounds like you're smuggling assertability conditions back in.
          *   *Reply:* Distinguish semantic content from epistemic accessibility.
          *   *Soft Spot:* Hard to motivate why truth conditions are stable but probability connections aren't without looking like a hidden contextualist.

      *   *Objection 3 (Medium-High Damage): McGee Counterexamples.*
          *   *Phrasing:* Nested conditionals. If $P(A \to (B \to C)) \neq P(C | A \land B)$, does Modus Ponens fail? If you keep MP, how do you handle the probabilistic mismatch?
          *   *Reply:* MP holds for truth, not probability.
          *   *Soft Spot:* If probability diverges that much, why trust the truth-conditional logic?

      *   *Objection 4 (Medium Damage): The "Plan" Story.*
          *   *Phrasing:* This sounds pragmatic. How does a pragmatic story about planning ground a semantic claim about truth conditions?
          *   *Reply:* Planning reveals the underlying cognitive role which aligns with truth conditions in live cases.
          *   *Soft Spot:* It's a "toy story." It might not bear the metaphysical weight.

      *   *Objection 5 (The "Hope Nobody Asks"): Context Shift/Triviality.*
          *   *Phrasing:* If "focused" depends on context, does the proposition expressed by $A \to B$ change when context changes (i.e., when $A$ goes from live to dead)? If yes, you're a contextualist (and Lewis has triviality for that too, see Hájek). If no, how can the probability relation change for the *same* proposition?
          *   *Reply:* (This is the trap).
          *   *Soft Spot:* This is the hardest technical hit.

  4.  **Refining the Tone:**
      *   Needs to be sharp, technical, and slightly aggressive (simulating the audience).
      *   Use terms like "triviality result," "Import-Export," "Modus Ponens," "contextualism," "credence," "propositional attitude."
      *   Ensure the replies are realistic (2 minutes spoken is roughly 250-300 words).

