prompt: |-
  my roommate and I have been going in circles for months about the boundary problem in democratic theory -- you know, the problem of constituting the demos: for any given collective decision, who counts as a member of the group entitled to make it? I'm basically team "all-affected interests": anyone who's interests are significantly affected by a decision should get a say in it. She's team "all-subjected": the demos is whoever is actually subject to the authority/coercive power of the decision-making body, not just whoever happens to be affected by the outcome. Over time we've accumulated a running list of test cases we fight about: a coastal county voting on whether to build a sea wall that inland taxpayers partially fund, seasonal migrant workers who can't vote where they live and work 9 months a year, foreign investors hit by a new tariff, future generations and climate policy, tourists passing through during election season, and whether any of this changes when a referendum is binding versus merely advisory.

  Write us the document we should've produced instead of yelling across the kitchen: a numbered list of claims we could both genuinely sign off on (not mushy compromise fluff -- real points of agreement, including about what makes the boundary problem hard in the first place), then a table of our disagreements, where each side's position is stated in wording that that side would itself accept -- she should read the description of the all-subjected view and nod, and vice versa for me. Then lay out the cruxes: the sub-questions such that settling them would actually move at least one of us. I suspect some candidates are: whether affectedness is ever measurable/stable enough to ground inclusion rights, whether being subject to coercion is just one species of being affected or something categorically different, and whether the demos can legitimately vary decision-by-decision or has to be fixed at some higher level (and if so, who fixes THAT, which feels like it just regresses the whole problem). For each crux, give a concrete case, argumnet, or thought experiment that both of us would agree bears on it, and record what each of us would predict about it in advance -- especially on our test cases like the sea wall and the migrant workers. And if part of our fight turns out to be just verbal -- like maybe we mean different things by "governed" vs "affected" -- please say which part and why, because honestly I've started to suspect a decent chunk of it is.
reasoning: |-
  Here's a thinking process that leads to the suggested document:

  1.  **Analyze the Request:**
      *   **Context:** Two roommates (User = All-Affected Interests [AAI], Roommate = All-Subjected Principle [ASP]) have been debating the "boundary problem" in democratic theory for months.
      *   **Goal:** Create a document they *should* have produced instead of yelling.
      *   **Tone:** Intellectual, precise, fair, non-mushy, collaborative but clear on disagreements.
      *   **Structure:**
          1.  Numbered list of shared claims (points of agreement, including why it's hard).
          2.  Table of disagreements (positions stated in language each side accepts).
          3.  The Cruxes (sub-questions that, if settled, would move the needle).
          4.  For each crux: Concrete case/test, predictions from both sides (specifically regarding their running list: sea wall, migrants, tariffs, future gens, tourists, binding vs. advisory).
          5.  Verbal Dispute Check: Identify if any disagreement is merely semantic.

  2.  **Deconstruct the Philosophical Positions:**
      *   **All-Affected Interests (AAI):** Focuses on *consequences*. If $X$ impacts your well-being/interests, you should have input.
          *   *Strengths:* Captures externalities, future gens, global issues.
          *   *Weaknesses:* "Affected" is vague/infinite (butterfly effect), hard to measure, unstable demos.
      *   **All-Subjected Principle (ASP):** Focuses on *authority/coercion*. If you are bound by the law/force of the state, you should have input.
          *   *Strengths:* Clearer boundary (jurisdiction), links to autonomy/freedom from domination.
          *   *Weaknesses:* Excludes non-citizens affected by foreign policy, future gens, ignores soft power/economic coercion.

  3.  **Drafting Section 1: Shared Claims (The Common Ground):**
      *   Need to acknowledge the difficulty. It's not just "who votes," it's "who constitutes the 'we'".
      *   Both agree democracy requires a boundary (you can't have *everyone* vote on *everything*).
      *   Both agree exclusion is a moral harm that needs justification.
      *   Both agree current borders are historically contingent, not necessarily morally ideal.
      *   Both agree the "who decides who decides" regress is a real logical problem.

  4.  **Drafting Section 2: Table of Disagreements (Steel-manning):**
      *   *AAI Column:* Needs to sound like the User. Focus on impact, welfare, consequences. "If the decision changes my life trajectory..."
      *   *ASP Column:* Needs to sound like the Roommate. Focus on law, coercion, subjection, autonomy. "If I am liable to punishment or binding obligation..."
      *   *Key Distinction:* AAI is about *causal impact*; ASP is about *normative authority*.

  5.  **Drafting Section 3: The Cruxes (The Engine of the Debate):**
      *   *Crux 1: The Nature of Coercion vs. Impact.* Is being taxed for a sea wall "coercion" (ASP) or just "affected" (AAI)?
          *   *Test:* The Sea Wall.
          *   *AAI:* Inland taxpayers are affected (money), should vote.
          *   *ASP:* Inland taxpayers are subject to tax law, so they vote on the budget, but coastal voters vote on zoning? Or is the tax the subjection? Need to clarify. Actually, ASP usually says if you are subject to the *specific* coercive rule. If the law says "Inland people pay," they are subjected. If the law says "Coastal people build," they are subjected.
      *   *Crux 2: Stability vs. Fluidity of the Demos.* Can the voting body change per issue?
          *   *Test:* Migrant Workers.
          *   *AAI:* Demos shifts. If working there, vote there.
          *   *ASP:* Demos is fixed by jurisdiction/residence. If not a subject of the polity long-term, no vote. Or, if they are subject to labor laws, they vote on labor laws? ASP usually prefers a fixed demos to avoid infinite regression.
      *   *Crux 3: Epistemic/Measurement Feasibility.* Can we know who is affected?
          *   *Test:* Tariffs/Foreign Investors.
          *   *AAI:* Hard to measure, but principle holds.
          *   *ASP:* Easy to measure (are they under our jurisdiction?).
      *   *Crux 4: Future Generations.*
          *   *AAI:* Clearly affected. Need representation (guardians?).
          *   *ASP:* Cannot be subjected (don't exist). Excluded.

  6.  **Drafting Section 4: The Verbal Dispute Check:**
      *   Are they defining "Subjected" differently?
      *   Often ASP proponents expand "coercion" to include economic necessity, which bleeds into AAI.
      *   Often AAI proponents restrict "affected" to "significantly/legally" affected, which bleeds into ASP.
      *   *Verdict:* There is overlap, but the core normative justification differs (Autonomy vs. Welfare).

  7.  **Refining and Polishing:**
      *   *Tone Check:* Is it too academic? Keep it accessible but rigorous.
      *   *Formatting:* Use Markdown for lists and tables.
      *   *Specific Test Cases:* Ensure the Sea Wall, Migrants, Tariffs, Future Gens, Tourists, and Binding/Advisory are woven into the Cruxes section.
      *   *Self-Correction on "Binding vs. Advisory":* This is a great nuance. ASP cares deeply about binding force. AAI cares about impact regardless of legal bindingness.
      *   *Refining the "Regress" point:* Who fixes the demos? AAI says "meta-affect." ASP says "constitutional moment."

  8.  **Final Review against constraints:**
      *   Numbered list of claims? Yes.
      *   Table of disagreements (steel-manned)? Yes.
      *   Cruxes with concrete cases? Yes.
      *   Predictions on test cases? Yes.
      *   Verbal dispute analysis? Yes.

  *(Self-Correction during drafting)*: Make sure I don't solve the problem for them. The prompt asks for the document *they* should produce to clarify the fight, not a philosophical paper resolving the boundary problem. The goal is clarity of disagreement, not resolution.

  *(Refining the Sea Wall case)*:
  *   AAI: Inland payers affected -> Vote. Coastal residents affected -> Vote.
  *   ASP: Inland payers subjected to tax -> Vote on tax. Coastal residents subjected to zoning/safety law -> Vote on wall.
  *   *Wait, nuance:* If the referendum is "Should we build the wall?" (funded by general treasury).
  *   AAI: Everyone in treasury catchment.
  *   ASP: Everyone subject to the treasury authority (usually the whole polity).
  *   *Actually, the tension is better on the Foreign Investor.*
  *   AAI: Affected by tariff -> Vote (impossible practically, but principle holds).
  *   ASP: Not subject to US law (just trade consequences) -> No vote.

  *(Refining Migrant Workers)*:
  *   AAI: Affected by labor laws -> Vote.
  *   ASP: Subject to laws while present -> Vote? Or only if citizens? ASP usually aligns with residency. If they live there, they are subjected. So ASP might actually *include* migrants if they are residents, even if non-citizens. AAI includes them if they are *affected*, even if temporary.
  *   *Correction:* ASP is often "All Subjected to Coercion." If a migrant is deportable, they are heavily subjected. So ASP often supports migrant voting rights *more* than current law, but less than AAI if the migrant is temporary.
  *   *Let's stick to the prompt's framing:* Roommate is ASP. User is AAI.
  *   *Migrant Case:* 9 months work.
  *   AAI: Affected for 9 months -> Include.
  *   ASP: Subject to authority for 9 months -> Include? Or is "subjected" a status of membership? Let's assume Roommate argues "Subjected" implies a stable legal relationship, not transient presence.

  *(Final Polish)*: Ensure the "Verbal Dispute" section is honest. A lot of this *is* verbal. "Affected" can be read narrowly. "Subjected" can be read broadly.

  Let's write it.cw
answer: |-
  # The Boundary Protocol: A Joint Memorandum on Constituting the Demos

  **Date:** October 26, 2023
  **Parties:** Proponent of All-Affected Interests (AAI) & Proponent of All-Subjected Principle (ASP)
  **Subject:** Clarifying the Disagreement on Democratic Boundaries

  ## I. Shared Premises (Points of Agreement)

  Before detailing our divergence, we affirm the following claims as common ground. We agree that:

  1.  **The Boundary Problem is Prior to Democracy:** You cannot have rule by the people (*demos*) without first defining who "the people" are. This definition cannot itself be made democratically without circularity (the "who decides who decides" regress).
  2.  **Exclusion Requires Justification:** There is a prima facie moral presumption against excluding adults from collective decision-making. Any boundary that excludes capable agents bears a burden of proof.
  3.  **Current Borders are Contingent:** Existing national and municipal boundaries are largely products of history, war, and geography, not necessarily moral philosophy. We agree they are likely imperfect.
  4.  **Stability Matters:** A demos must be stable enough to facilitate deliberation and accountability. If the membership changes completely between every single decision, collective agency dissolves.
  5.  **Coercion is Real:** We agree that state decisions often involve coercion (taxation, policing, regulation) and that being on the receiving end of this coercion is a morally significant fact.
  6.  **Impact is Real:** We agree that state decisions often create externalities (economic, environmental, social) that profoundly alter life chances for those outside the formal decision-making structure.
  7.  **The "All-Everyone" Impossibility:** We agree that including *every* human being on *every* decision is practically impossible and potentially undesirable (diluting stakes). Some filtering mechanism is necessary.

  ## II. The Disagreement Matrix

  We disagree on the *criterion* for inclusion. Below, each position is stated in its strongest form, using language its proponent accepts.

  | Feature | **All-Affected Interests (AAI)** <br> *(User's Position)* | **All-Subjected Principle (ASP)** <br> *(Roommate's Position)* |
  | :--- | :--- | :--- |
  | **Core Normative Value** | **Welfare & Consequence.** Democracy is a tool to protect well-being and ensure outcomes account for all relevant stakes. | **Autonomy & Legitimacy.** Democracy is a requirement of justice for those bound by coercive law. To be ruled without a voice is domination. |
  | **Inclusion Criterion** | **Causal Impact.** If a decision significantly alters your interests (positive or negative), you are entitled to input. | **Normative Subjection.** If you are liable to the coercive authority of the decision-making body (law, force, penalty), you are entitled to input. |
  | **Scope of Demos** | **Fluid/Issue-Specific.** The "people" should ideally expand or contract depending on the specific reach of the policy's consequences. | **Fixed/Jurisdictional.** The "people" is defined by the scope of the legal order. Membership is a status, not a consequence of specific outcomes. |
  | **Primary Risk** | **Over-inclusion/Instability.** The "butterfly effect" makes everyone affected by everything. Without limits, the demos becomes unmanageable or infinite. | **Under-inclusion/Exclusion.** Ignores powerful externalities. Allows a demos to vote itself benefits at the expense of outsiders they don't have to answer to. |
  | **View on Borders** | Borders are heuristic shortcuts for "likely affectedness." They should be permeable when impact crosses them. | Borders define the sphere of coercive authority. They are the necessary container for political community. |

  ## III. The Cruxes (Where the Debate Turns)

  We have identified four sub-questions. Settling these empirically or conceptually would resolve or significantly shift our debate. For each, we list a test case, the specific point of contention, and our respective predictions.

  ### Crux 1: Is "Coercion" just a subset of "Affectedness"?
  *   **The Question:** Is being subject to law fundamentally different from being impacted by a decision, or is it just a particularly intense form of impact?
  *   **The Test Case:** **Foreign Investors & Tariffs.**
      *   *Scenario:* The US imposes a 20% tariff on steel. A German steel manufacturer loses 30% of their revenue. They are not subject to US law (they aren't arrested if they don't pay; they just lose market access).
  *   **AAI Prediction:** The German manufacturer is **included**. Their economic interests are significantly affected. Excluding them allows the US to export harm without accountability.
  *   **ASP Prediction:** The German manufacturer is **excluded**. They are not subject to US coercive authority. They can choose to exit the market. Including them would grant veto power to non-members over a polity's internal economic rules.
  *   **Settlement Condition:** If we agree that "market access loss" counts as *coercion* (ASP shifts), or that "market loss" is too indirect for *affectedness* (AAI shifts), we converge.

  ### Crux 2: Can the Demos vary Decision-by-Decision?
  *   **The Question:** Must the voting body be a fixed entity (e.g., "The Citizens of County X") to maintain accountability, or can it be a temporary coalition of stakeholders?
  *   **The Test Case:** **The Coastal Sea Wall.**
      *   *Scenario:* A coastal county votes on a sea wall. It is funded by a general tax that includes inland residents.
  *   **AAI Prediction:** **Variable Demos.** Inland taxpayers should vote on the *funding* (they are affected financially). Coastal residents should vote on the *placement/design* (they are affected physically). Ideally, a joint referendum.
  *   **ASP Prediction:** **Fixed Demos.** The County is the legal jurisdiction. Everyone subject to the County's taxing authority votes on everything the County does. Splitting the issue fractures political responsibility. If inlanders pay, they are already represented by the officials who levy the tax.
  *   **Settlement Condition:** If AAI concedes that variable demoi make accountability impossible (who do you vote out if the wall fails?), or if ASP concedes that fixed borders allow "internal colonialism" (coastal exploiting inland), we move.

  ### Crux 3: Does "Bindingness" Change the Moral Stakes?
  *   **The Question:** Does the obligation to have a say depend on whether the decision is legally enforceable, or on whether the life-impact is real?
  *   **The Test Case:** **Advisory Referendum vs. Binding Law.**
      *   *Scenario:* A university holds a vote on a divestment policy. The administration is not legally bound to follow it, but practically will.
  *   **AAI Prediction:** **No Difference.** Students and staff are affected by the moral/financial outcome regardless of the legal technicality. Inclusion rights remain the same.
  *   **ASP Prediction:** **Crucial Difference.** If the vote is advisory, no one is *subjected* to coercion. It is speech, not rule. Democratic inclusion requirements are weaker or non-existent.
  *   **Settlement Condition:** If we agree that "soft power" is functionally coercive (ASP shifts), or that advisory votes are merely "opinion polling" with no right to participation (AAI concedes), we move.

  ### Crux 4: The Problem of Future Existence
  *   **The Question:** Can you be "subjected" or "affected" if you do not yet exist?
  *   **The Test Case:** **Climate Policy & Future Generations.**
      *   *Scenario:* A carbon tax today that prevents warming in 2100.
  *   **AAI Prediction:** **Include (via Proxy).** Future people are the most affected stakeholders. We must institutionalize guardianship or proxy voting for them.
  *   **ASP Prediction:** **Exclude.** You cannot be coerced if you do not exist. There is no "subject" to hold the relation with. We have duties *regarding* them, but they have no right *to* a vote.
  *   **Settlement Condition:** If ASP admits that long-term binding laws create a "trans-generational polity," or if AAI admits that representing non-existents is conceptually incoherent, we move.

  ## IV. The Verbal Dispute Check

  We suspect a portion of our fight is semantic. We have analyzed our terminology and found the following overlaps:

  1.  **"Significantly Affected" vs. "Subjected":**
      *   *The Overlap:* When AAI says "significantly," they often mean "legally or economically constrained." When ASP says "subjected," they sometimes include "economic coercion" (e.g., you must pay taxes or go to jail).
      *   *The Verbal Fix:* If AAI restricts "Affected" to **"Legally Cognizable Interests"** and ASP expands "Subjected" to **"De Facto Coercion,"** our lists of included people look 80% identical.
      *   *Remaining Disagreement:* The 20% difference is the **Foreign Investor** (AAI says yes, ASP says no) and the **Tourist** (AAI says no [too transient], ASP says yes [subject to laws while present]).

  2.  **"The People" (Singular vs. Plural):**
      *   *The Overlap:* AAI often speaks of "stakeholders" (plural, issue-specific). ASP speaks of "The Demos" (singular, constitutional).
      *   *The Verbal Fix:* We are arguing about **Institutional Design** (AAI) vs. **Constitutional Theory** (ASP).
      *   *Conclusion:* AAI is proposing a method for *legislative input* (who gets consulted). ASP is proposing a method for *sovereign membership* (who belongs).
      *   *Action:* We should stop asking "Who should vote?" and start asking "Is this a question of Membership or a question of Consultation?"

  ## V. Next Steps for the Migrant Worker Case

  *Specific application of the above to our most heated test case.*

  *   **Scenario:** Seasonal migrant workers, present 9 months, no citizenship, subject to labor laws, cannot vote.
  *   **AAI Stance:** They are affected by labor/housing laws. They should vote in local elections while present.
  *   **ASP Stance:** They are subject to coercive authority while present. *Therefore*, ASP actually supports their inclusion **IF** we define "subjected" as "liable to arrest/regulation."
  *   **The Real Disagreement Here:** It is not AAI vs. ASP. It is **ASP vs. Current Law.**
  *   **Agreement:** The Roommate (ASP) should logically agree with the User (AAI) that migrant workers *currently* deserve voting rights in local elections, because they are subjected to the local coercive order.
  *   **Remaining Fight:** Whether their *temporary* status negates the "subjected" claim. (AAI says impact is real regardless of duration; ASP worries temporary subjects undermine the stability of the demos).

  ***

  **Signed:**

  _________________________ (Team All-Affected)

  _________________________ (Team All-Subjected)
