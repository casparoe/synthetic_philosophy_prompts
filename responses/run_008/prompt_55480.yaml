          *   *The Counter:* "The Recorder only survives *because* the Evolver did well."
          *   *Selection OF vs. FOR:* Selection *of* genes (frequency change). Selection *for* organismal traits (causal reason).
          *   *Analogy:* A winning lottery ticket. The paper (gene) persists in your safe. The *choice* of numbers (phenotype) matched the draw (environment). Did the lottery select *for* the paper quality? No. Did it select *of* the ticket? Yes.

