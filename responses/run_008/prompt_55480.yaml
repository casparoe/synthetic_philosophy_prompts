      *   *The Critique:* Just because genes are the *medium* of inheritance (bookkeeping) doesn't mean they are the *target* of selection (causal role). Organisms interact with the environment; genes sit inside them.
      *   *The "Slide":* Arguing that because genes are the only things that *accumulate* changes (bookkeeping), they must be the things selection is *for* (beneficiary).
      *   *Substantive vs. Conventional:* Is "gene selectionism" a factual claim about causality or just a translation manual?
      *   *Empirical Work:* When does the unit choice matter for prediction or explanation? (e.g., multilevel selection scenarios, intragenomic conflict).

  3.  **Drafting the Explanation - Section by Section:**

      *   **Introduction:** Acknowledge the user's expertise (insects/social behaviour) to build rapport. Validate that this is a tricky conceptual knot, not a lack of biological knowledge.

      *   **Part 1: The Two Roles (The Gut-Level Distinction):**
          *   Need an analogy. Money/Ledger vs. Shopper? Or perhaps something more biological. Let's use the "Ink vs. Story" analogy or "Scoreboard vs. Player."
