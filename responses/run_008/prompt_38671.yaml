  2.  **Identify the Philosophical Concepts:**

      *   **State-Given vs. Object-Given Reasons:** This is the most precise technical fit.
          *   *Object-Given:* Reasons provided by the properties of the object of the attitude (Tom's qualities for love; Evidence for belief; Danger for fear).
          *   *State-Given:* Reasons provided by the benefits/consequences of *having* the attitude (Tom loving Dana makes her happy; Believing makes the team perform; Believing gets you $500).
      *   **The "Wrong Kind of Reason" (WKR) Problem:** This is the specific puzzle within meta-ethics and value theory. It asks why state-given reasons seem to fail to justify the attitude itself, even though they justify wanting/hoping/trying to have it.
      *   **Pascal's Wager:** A classic example of pragmatic reasons for belief (state-given) vs. evidential reasons (object-given).
      *   **The Guise of the Good / Fitting Attitude Analysis:** Related to what makes an attitude *fitting*. Love is fitting if the object is lovable, not if loving is beneficial.

  3.  **Evaluate the Fit:**

      *   *Epistemic vs. Practical:* The user rejected this, but technically, the distinction they are describing *is* often mapped onto Practical (state-given) vs. Epistemic (object-given) for belief. However, for emotions (love, fear), the terminology shifts to "Reasons of the Right Kind" vs. "Reasons of the Wrong Kind." I need to validate their intuition that "Epistemic/Practical" feels off for *love* while introducing the more general "Object/State-Given" framework.
      *   *The Boundary Case (Tom's Intention):* This is crucial. Intentions are different from emotions/beliefs. Intentions *are* action-guiding. So pragmatic reasons *do* count for intentions. This explains why the user is confused there. The "dead reason" phenomenon applies to *passive* or *responsive* attitudes (belief, love, fear), not necessarily *volitional* states (intention, decision).

