answer: |-
  You have stumbled directly into one of the most persistent and annoying puzzles in contemporary meta-ethics and philosophy of mind. Your intuition is razor-sharp: you have identified a structural difference between reasons that make an attitude *fitting* and reasons that make an attitude *beneficial*.

  Here is the breakdown of the phenomenon, the name it goes by, why your "world vs. having" hypothesis is close but needs tuning, and the solution to your boundary case about Tom's intention.

  ### 1. The Name: "The Wrong Kind of Reason" (WKR)
  In the literature, this is most commonly called **The Wrong Kind of Reason Problem**.

  It usually arises in the context of the "Fitting Attitude Analysis" of value (the idea that for something to be good is for it to be fitting to favor it). The puzzle is: If I offer you a million dollars to admire a saucer of mud, you have a massive reason to admire it. But the saucer of mud doesn't become *admirable*. The money is a reason of the *wrong kind* to make the admiration fitting.

  The technical distinction used to map this is **Object-Given Reasons vs. State-Given Reasons**.

  *   **Object-Given Reasons (The "Live" Ones):** These cite properties of the *object* of the attitude.
      *   *Love:* Tom's kindness, humor, shared history.
      *   *Belief:* Evidence that the launch will succeed.
      *   *Fear:* The dog's bared teeth, its size.
      *   *Why they work:* These properties make the attitude **fitting**. They align the mind with the world.
  *   **State-Given Reasons (The "Dead" Ones):** These cite properties of *holding the attitude* itself (the consequences of being in that state).
      *   *Love:* Dana will be happy if Tom loves her.
      *   *Belief:* The team will perform better if I believe.
      *   *Fear:* The owner will give me space if I look scared.
      *   *Why they fail:* These make the attitude **prudent** or **beneficial**, but not **true** or **fitting**.

  ### 2. Why Your "World vs. Having" Hypothesis Leaks
  You asked: *"Is the mark that live reasons are about the world and dead ones are about the having of the attitude?"*

  This is almost exactly the Object/State distinction, but the leak you sensed comes from the Dana case. You noted: *"Dana's devotion is a fact about her, not about Tom's loving her."*

  If devotion is a fact about *her* (the object), why is it a dead reason for *love*?

  Here is the refinement: It is not about whether the fact is "in the world" or "in the head." It is about **Direction of Fit**.

  *   **Belief, Fear, and Love** (in the romantic sense) are **responsive attitudes**. They aim to track something independent of themselves.
      *   Belief aims at *Truth*.
      *   Fear aims at *Danger*.
      *   Love aims at *Lovability* (or value).
  *   **State-Given reasons** try to use the *consequences* of the attitude to justify the *cause* of the attitude. This creates a loop.
      *   To love Dana *because* she is devoted is to love the devotion (Object-Given).
      *   To love Dana *because* loving her will reward her devotion is to love the *outcome of loving* (State-Given).

  Your flatmate's error was treating Dana's devotion as a *claim* on Tom's heart (State-Given: "Look how much this costs her, therefore you should love her") rather than a quality of her character (Object-Given: "She is loyal, which is lovable").
  *   If Tom loves her *because she is loyal*, that is a live reason.
  *   If Tom loves her *because she loves him and it would be mean not to*, that is a dead reason. It turns love into a transaction or a charity case. Love cannot be willed into existence by the utility of loving.

  ### 3. Solving The Boundary Case: Tom's Intention
  This is the most critical part of your query. You asked:
  *> Tom is planning to go to Dana's family thing partly because he knows how crushed she'd be if he skipped -- is "she'll be devastated" a dead reason for intending to go, or a live one?*

  **It is a Live Reason.**

  Here is why your intuition wobbled: You are conflating **Attitudes** (Love, Belief, Fear) with **Intentions/Actions**.

  *   **Attitudes (Belief/Emotion):** These are constrained by "constitutive aims." You cannot believe something just because it's useful; belief *by definition* aims at truth. You cannot love someone just because it's nice; love *by definition* aims at value. State-given reasons are the "Wrong Kind" here because they violate the constitutive aim of the attitude.
  *   **Intentions/Actions:** These are *not* constrained by truth or fittingness in the same way. They are constrained by *practical rationality*.
      *   If I intend to go to the party, I am planning an action.
      *   "She will be devastated if I don't go" is a consequence of my *action* (or omission).
      *   Practical reasons (kindness, duty, avoiding harm) are the **Right Kind of Reason** for intentions.

  So, the phenomenon you found has a hard boundary:
  1.  **Responsive Attitudes (Belief, Fear, Love):** State-given reasons are **Dead** (Wrong Kind). They cannot generate the attitude, only the desire to have it.
  2.  **Volitional States (Intention, Decision, Action):** State-given reasons are **Live** (Right Kind). Consequences are exactly what we weigh when deciding what to do.

  Tom cannot *love* Dana because she'll be crushed (Dead Reason for Love).
  Tom can *go to the party* because she'll be crushed (Live Reason for Intention).

  The confusion arises because going to the party *looks like* an act of love. But structurally, it is an act of **duty** or **kindness**. Tom is acting *as if* he loves her (or acting as a good friend), but the reason for the action is pragmatic/moral, not romantic. If he tells himself "I am doing this because I love her," he is lying. If he tells himself "I am doing this because I am a decent person who doesn't want to hurt a friend," he is being rational.

  ### 4. Why It Feels Like It "Slips Through Your Fingers"
  You described the boss/belief case perfectly: *"It slips through my fingers."*

  Philosophers call this **The Transparency of Belief** (and by extension, other responsive attitudes).
  When you ask yourself, "Do I believe the launch will land?" you look *through* your mind at the world (the evidence). You do not look *at* your mind (the benefits of believing).
  *   If you try to use the benefit ("The team needs me to believe") as a reason, you have to shift your gaze from the *launch* to *yourself*.
  *   The moment you look at yourself, you are no longer forming a belief; you are managing a state.
  *   That is why it feels like it "pushes around neighboring attitudes" (wanting, trying, projecting) but misses the core. You can manage the *container*, but you can't fill it with the wrong substance.

  ### 5. Summary & Literature
  **The Phenomenon:** The distinction between reasons that make an attitude **fitting** (Object-Given) vs. reasons that make an attitude **beneficial** (State-Given).
  **The Problem:** The **Wrong Kind of Reason (WKR) Problem**.
  **The Boundary:** It applies to **Responsive Attitudes** (Belief, Emotion) but generally *not* to **Intentions/Actions**.

  **If you want to read the source code:**
  1.  **T.M. Scanlon, *What We Owe to Each Other*:** He draws the distinction between "judgment-sensitive attitudes" (which require object-given reasons) and mere desires.
  2.  **Derek Parfit, *On What Matters* (Vol 1):** He has a massive section dedicated to "Reasons and Acting" vs. "Reasons and Believing" and explicitly tackles the Wrong Kind of Reason problem.
  3.  **R.A. Duff, "Reasons of the Right Kind":** A more technical paper specifically on this distinction.
  4.  **Pascal's Wager:** The classic historical example. Pascal argues you have a state-given reason to believe in God (infinite reward). The counter-argument is always: "That might be a reason to *try* to believe, or to act as if you believe, but it is not a reason that makes God exist."

  **Your Flatmate's Error:** She was trying to use a State-Given reason (the cost of Dana's devotion) to justify a Responsive Attitude (Tom's Love).
  **Your Boss's Error:** He was trying to use a State-Given reason (team performance) to justify a Responsive Attitude (Belief).
  **Your Poker Friend:** Correctly identified that money is a reason to *want* the belief, not a reason for the belief.
  **Tom's Party:** "She'll be devastated" is a **Live Reason** for the **Intention** to go, because intentions are action-states governed by practical consequences, not truth-tracking states governed by fittingness.

  You didn't just find a leak; you found the seam where the mind stitches together truth and action. They are sewn with different thread.
