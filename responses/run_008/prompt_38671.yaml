      *   **Naming the Phenomenon:** If they want a name, "The Wrong Kind of Reason Problem" is the academic term. "Fittingness Constraints" is another angle.

  5.  **Review and Refine:**

      *   *Tone:* Keep it conversational but rigorous. The user is thinking like a philosopher; treat them like one.
      *   *Check the Dog Example:* "Owner gives space if you're scared." This is a reason to *feign* fear or *cultivate* fear, but not a reason the dog is fearful. It's a state-given reason.
