          *   *State-Given:* Properties of holding the attitude (Dana's happiness, Team morale, $500). These make the attitude *beneficial*.
      *   **Address the "Deadness":** Explain *why* state-given reasons feel dead for certain attitudes. It's about "Fittingness." You can't love something *because* it's useful to love it; you love it because it's lovable. Belief aims at truth. Fear aims at danger.
      *   **Address the Boundary Case (Tom's Intention):** This is the key insight.
          *   Attitudes like Belief, Love, Fear are *constrained* by their object. They are "truth-apt" or "fittingness-apt."
          *   Intentions are *action-oriented*. Practical reasons *are* the right kind of reason for intentions.
          *   So, "She'll be devastated" is a **Live Reason** for the *Intention* to go, even if it's a **Dead Reason** for *Love*.
