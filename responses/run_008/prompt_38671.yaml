          4.  Why it feels "Dead" (Transparency).
          5.  Suggested Reading.

  7.  (Final thought on the "Intention" case): The user asks: "is 'she'll be devastated' a dead reason for intending to go, or a live one?"
      *   If Tom *intends* to go, that is a practical decision.
      *   Reasons for intentions are generally practical/state-given.
      *   So it *is* a live reason for the intention.
