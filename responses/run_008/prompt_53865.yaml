          *   *Refinement:* Make it sharper. Focus on the *motivation* for practice. If "I" don't exist, why do "I" meditate?
          *   *Follow-up:* Anticipate the "conventional self suffers" answer. Push on the *ultimate* stakes.

      *   *Requirement 2: First-Person/Two Truths.*
          *   *Draft:* You say "I" all the time. Isn't that hypocritical?
          *   *Refinement:* Focus on the *boundary*. When does the conventional lie become dangerous? Is the Two Truths doctrine a get-out-of-jail-free card?
