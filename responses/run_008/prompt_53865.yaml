          *   *Follow-up:* If he says it's experiential, ask how that differs from standard psychology.

      *   *Filling the Gap (Need 8-10 total):*
          *   *Q5: Moral Responsibility.* If I commit a crime, who goes to jail? (Classic but necessary).
          *   *Q6: Love/Relationships.* Can you truly love someone if they don't exist? (Good for literary context).
          *   *Q7: The "Owner" of Pain.* When you stub your toe, is there pain but no one hurt? (Phenomenological angle).
          *   *Q8: The Writer/Novelist Angle.* How does this affect storytelling? Characters need selves. (Meta-commentary).
          *   *Q9: Fear of Death.* If there's no self, why are we afraid of dying? (Existential angle).
          *   *Q10: The "Aha" Moment.* What does realizing this actually *feel* like? Is it a click or a fade?

  4.  **Refining and Polishing:**
