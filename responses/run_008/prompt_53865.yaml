      *   **Common Defense:** Two Truths Doctrine (Conventional truth allows for "I," Ultimate truth reveals emptiness/no-self).
      *   **Potential Weak Points:** Moral responsibility, soteriology (point of practice), linguistic performativity, the intensity of the claim vs. lived experience.

  3.  **Drafting the Questions (Iterative Process):**

      *   *Requirement 1: Liberation/Karma.*
