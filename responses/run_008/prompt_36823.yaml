answer: |-
  This is a classic "map vs. territory" problem in historiography. As a rationalist, you are correctly sensing that "collapse" is often used as a loaded label rather than a precise technical term. The tension you feel—particularly between the Maya (collapse despite people) and Rome (transformation despite catastrophe)—suggests your intuition is tracking something more specific than "things got worse." It is tracking the **continuity of the coordination substrate.**

  Below, I will brainstorm candidate criteria, propose a precise principle derived from your verdicts, test it against new cases, and address the philosophical implications.

  ### 1. Brainstorming Candidate Criteria

  To extract your principle, we must isolate the variables that shift your verdict from "Collapse" to "Transformation/Change."

  *   **Criterion A: Loss of Complexity (Tainter's Account).**
      *   *Verdict:* Fails. Rome lost massive complexity (urbanization, literacy, trade). If this were the only metric, Rome would be the quintessential collapse. Your intuition rejects this.
  *   **Criterion B: Demographic Continuity.**
      *   *Verdict:* Fails. You classify Maya as a collapse despite millions of people persisting. You classify Rome as transformation despite population cratering. People are not the unit of analysis for you.
  *   **Criterion C: Speed of Decline.**
      *   *Verdict:* Partial fit. LBA and Maya were fast; Angkor and Rome were slow. However, "slow collapse" is still collapse. Speed alone doesn't explain why Rome is *transformation*.
  *   **Criterion D: Endogeneity vs. Exogeneity.**
      *   *Verdict:* Strong fit. You reject Easter Island because the cause was external (Europeans). You accept LBA/Maya because the failure modes were internal (systemic fragility).
  *   **Criterion E: Continuity of the Coordination Layer.**
      *   *Verdict:* Strongest fit. In Rome, the *Imperial State* fell, but the *Civilizational Stack* (Law, Church, Local Governance) absorbed the functions of the state. In Maya/LBA, the specific coordination technology (Palace Redistribution, Divine Kingship) vanished without a functional successor in that region.

  ### 2. The Proposed Principle

  Based on your verdicts, I propose the **Principle of Discontinuous Coordination Capacity.**

  > **Definition:** A society undergoes **collapse** if and only if it experiences an **endogenous rupture** in its **primary coordination topology**, resulting in a **permanent loss of institutional memory** regarding that complexity, which occurs **involuntarily** relative to the actors' preferences.

  Let's break down the four clauses and tie them to your cases:

  1.  **Endogenous Rupture:** The failure must arise from the internal logic or fragility of the system, not purely external conquest or disease.
      *   *Motivated by:* **Easter Island.** You reject the collapse label because the decisive blow was external (slave raids/disease), not internal ecocide. The system didn't fail; it was broken.
  2.  **Primary Coordination Topology:** This refers to the specific mechanism that enables high-level organization (e.g., Palace Redistribution, Divine Kingship, Imperial Bureaucracy).
      *   *Motivated by:* **LBA & Maya.** In both, the specific network that enabled complexity (Palaces/Kings) evaporated. Trade stopped; inscriptions ceased. The *topology* of the network broke.
  3.  **Permanent Loss of Institutional Memory:** The knowledge or social technology required to maintain the previous state is lost or inaccessible to the successors. Crucially, the *elites* managing this complexity do not successfully transition their roles.
      *   *Motivated by:* **Rome vs. Maya.** This is the crux. In Rome, the Imperial Admin failed, but the *institutional memory* was absorbed by the Church and local warlords (who became the new nobility). The "software" of civilization (Law, Literacy, Religion) ran on new "hardware." In the Maya Lowlands, the Divine Kingship software vanished. The farmers remained, but the *coordination layer* was gone and not rebuilt for centuries.
  4.  **Involuntary Relative to Preferences:** The actors within the system experience the change as a loss of agency or capacity, not a deliberate optimization.
      *   *Motivated by:* **Hypothetical Future & Angkor.** In your hypothetical, decline is chosen for welfare (optimization). In Angkor, the court relocated to maintain function (adaptation). Neither is an involuntary loss of capacity.

  ### 3. Application to New Test Cases

  **Case 1: The Dissolution of the Soviet Union (1991)**
  *   **Analysis:**
      *   *Endogenous?* Yes (economic stagnation, legitimacy crisis).
      *   *Coordination Topology?* The Command Economy and Party Hierarchy dissolved.
      *   *Institutional Memory?* Mixed. The state broke, but much infrastructure and human capital remained. However, the *specific coordination technology* (Central Planning) was abandoned and largely lost as a viable tool. Life expectancy dropped sharply (involuntary welfare loss).
      *   **Verdict:** **Collapse (of the Soviet System), Transformation (of the Region).**
      *   *Nuance:* Under our principle, the *Soviet Society* (defined by its coordination topology) collapsed. The *Russian/Post-Soviet Society* underwent transformation. This matches the intuition that 1991 was a catastrophic systemic failure, even if the people remained.

  **Case 2: The Black Death (1347–1351)**
  *   **Analysis:**
      *   *Endogenous?* No. It was an external biological shock.
      *   *Coordination Topology?* Strained, but did not break. Feudal contracts, Church authority, and Monarchies persisted.
      *   *Institutional Memory?* Preserved.
      *   **Verdict:** **Catastrophe, not Collapse.**
      *   *Nuance:* This aligns with your Easter Island verdict. A society can lose 40% of its population without "collapsing" if the coordination stack remains intact. In fact, the Black Death led to *increased* welfare for survivors (higher wages), which pushes it closer to your "Hypothetical" non-collapse case.

  ### 4. Accommodating Your Verdicts (and Overturning One)

  Your list is remarkably coherent under the **Discontinuous Coordination Capacity** principle. However, there is one tension I must address explicitly.

  **The Rome Verdict:**
  Standard collapse literature (Tainter, Diamond, Goldstone) classifies Western Rome as a collapse. You classify it as transformation.
  *   *Accommodation:* My principle supports *your* view, but it requires a specific definition of "Society." If "Rome" = The Imperial State, it collapsed. If "Rome" = The Mediterranean Civilizational Stack (Law, Christianity, Urbanism), it transformed. Your intuition tracks the latter. You are defining society by its **cultural/institutional substrate**, not its **political regime**.
  *   *Why this is robust:* In the Maya Lowlands, the substrate (Kingship/Stelae culture) *did* vanish. In Rome, the substrate (Church/Law) *persisted*. Therefore, Rome is Transformation, Maya is Collapse.

  **The Easter Island Verdict (Potential Overturn):**
  *   *My Challenge:* I would gently push back on your Easter Island verdict. While the *initial* decline might not have been ecocidal, the society's **fragility** to external shock is an internal property.
  *   *Argument:* If a system lacks the coordination capacity to repel or absorb external shocks (slave raids), that is a failure of the coordination topology. However, to remain faithful to your specific intuition (which rejects the "self-inflicted" narrative), I will accommodate it under the **Endogenous Rupture** clause. If the damage is >90% external, it is conquest, not collapse. I will accept your verdict but note that the boundary is fuzzy.

  ### 5. Philosophical Implications: Do Societies Fail or Change?

  You asked whether societies ever genuinely fail, or merely change. Your list, processed through this principle, answers this quietly but definitively:

  **Societies do not "die" like organisms; they "decompile" like software.**

  1.  **Failure is Specific:** "Society" is too granular a term. What fails are **Coordination Technologies**. The Palace Economy failed in the LBA. The Divine Kingship failed in the Maya. The Imperial Command failed in Rome.
  2.  **Continuity is Layered:** Your Rome verdict reveals that you view "Civilization" as a stack. If the top layer (Empire) crashes but the OS (Church/Law) remains, the system reboots in Safe Mode (Feudalism). That is transformation. If the OS is corrupted (LBA/Maya), that is collapse.
  3.  **The Normative Element:** Your inclusion of "preferences" and "welfare" (Hypothetical case) is crucial. It implies that collapse is not just a physical metric but a **loss of agency**. A society that deliberately downshifts to improve well-being has not collapsed, because the *actors* remain in control of the coordination topology.

  **Conclusion:**
  Your intuitions are consistent with a **Functionalist/Information-Theoretic view of history.** A collapse is not when people die or buildings burn; it is when the **information required to maintain the previous level of complexity is lost or rendered inaccessible**, and this loss is involuntary.

  Under this principle, you are right to distinguish Rome from Maya. Rome was a hard drive reformat (Transformation); the Maya Lowlands were a hard drive physical destruction (Collapse). Both lost data, but only one lost the ability to read the disk.

  **Final Verdict on Your Principle:**
  Your tentative principle ("rapid, involuntary loss of complexity... against preferences") was 80% there. It needed the **Institutional Memory** clause to distinguish Rome from Maya, and the **Endogenous** clause to distinguish Easter Island. With those additions, it holds.
