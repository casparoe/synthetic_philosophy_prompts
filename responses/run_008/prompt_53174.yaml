answer: |-
  A gradual, undetectable substitution of a natural kind demonstrates that while internalists and externalists converge on current reference, they diverge on historical content, compelling externalists to adopt a preservationist view of memory to avoid attributing systematic error to sincere recall.

  Imagine a subject, Elena, who lives on Earth and frequently uses the natural-kind term "cobalt" to refer to the metal used in her batteries and alloys. Unbeknownst to Elena or the scientific community, a slow cosmic process begins to transmute the atomic structure of all cobalt on Earth into a distinct substance, "schmobalt," which is microphysically different but macroscopically identical in color, weight, malleability, and chemical reactivity. This transition occurs gradually over twenty years; at no point is there a sharp cutoff, and no test available to Elena or her community can distinguish schmobalt from cobalt. Twenty years ago, all instances of the kind were cobalt; today, all instances are schmobalt. Elena's internal psychological states, behavioral dispositions, and sincere reports regarding her use of "cobalt" remain exactly the same throughout this period.

  According to the Putnam-style externalist, the reference of "cobalt" is determined by the causal history between the user and the environment. Today, Elena's word refers to schmobalt because her current usage is causally connected to schmobalt. Twenty years ago, her word referred to cobalt because her usage was then causally connected to cobalt. Thus, the externalist concludes Elena does not mean the same thing by "cobalt" today as she did twenty years ago. According to the internalist, semantic content is determined entirely by factors internal to the subject. Since Elena's internal state has not changed, her semantic content remains constant. Because her word refers to schmobalt today given her constant content and the current environment, that same constant content determined what she meant twenty years ago. Thus, the internalist concludes Elena means the same thing by "cobalt" today as she did twenty years ago, even though the extension of that content shifted with the world.

  The feature doing the philosophical work is the locus of semantic individuation: the externalist ties meaning to the changing causal environment, while the internalist ties meaning to the stable psychological state. This divergence creates the charge that externalism makes Elena's sincere memory reports—such as "I bought a cobalt battery last year"—true when uttered in the past but false if uttered today, since the term now refers to schmobalt while the past battery was cobalt. The externalist's best response is the preservationist thesis of memory content: memory states preserve the original intentional content of the experience rather than translating it into current semantic terms. When Elena recalls the past today, she tokens a memory state with the *original* cobalt-content, not her current schmobalt-content, ensuring her report remains true despite the shift in her current linguistic reference.
