      *   **User:** Philosophy professor and member of an academic integrity committee.
      *   **Context:** Puzzled by the inconsistent policy on writing tools (spell-check OK, MT sometimes OK, GenAI banned). Acknowledges the technical blur between grammar checkers and GenAI.
