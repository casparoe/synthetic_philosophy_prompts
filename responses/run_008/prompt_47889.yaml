      *   Writing isn't just recording thought; it's the *process* of thinking.
      *   Therefore, if a machine does the writing, the student hasn't done the thinking.
      *   *Label:* Let's call this the "Expressivist-Cognitive" model or the "Transparency Thesis." The prose is a transparent window into the mind.

  3.  **Apply Dennett's "Strange Inversions":**
      *   *Darwin:* Competence (adaptation) without Comprehension (designer's intent).
      *   *Turing:* Computation (competence) without Comprehension (semantic understanding).
      *   *Application to Writing:* LLMs demonstrate competence (grammatical, coherent, even insightful prose) without comprehension (no mind, no intent).
      *   *Impact on Policy:*
