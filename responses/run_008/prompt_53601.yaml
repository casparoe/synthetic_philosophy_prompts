prompt: |-
  I have a half-formed idea for my term paper in a history of philosophy seminar and need to turn it into a proposal (the paper itself will be around 6000 words, one semester). The idea: everyone treats Berkeley's economic writings — The Querist, his 1730s case for a national bank and paper money in Ireland — as a quirky side project that has nothing to do with the immaterialism, but I keep suspecting they're actually connected. Money, for Berkeley, seems to work as a sign whose value rests entirely on collective acceptance and opinion rather than on any intrinsic property, and that looks structurally like the same move as esse est percipi, just applied to value instead of physical substance. So the question would be: is Berkeley's theory of money a genuine application of his idealism to economics, or is the resemblance superficial and the two projects independent? Turn this into a proper proposal — state the question precisely, say what the obvious rival reading (the two are just unrelated) gets right and where it might fail, what the actual method would be for deciding the issue (e.g., what features of his account of money would have to be there only if the idealism were doing work), and what would count as the paper failing. Also be honest about whether this is too big for a semester and what to cut. Please don't include a bibliography or citations, I'll fill those in myself.
