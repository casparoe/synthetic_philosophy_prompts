      *   *Berkeley's Economics:* Paper money has value not because of intrinsic metal content (substance) but because of public credit/utility/will (collective mind/acceptance).
      *   *The Link:* Is the economic theory an *application* of the metaphysics, or just a coincidence of structure? Did Berkeley *intend* the link, or are we projecting it?

  3.  **Drafting - Section by Section:**

