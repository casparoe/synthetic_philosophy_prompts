  You are to act as a translator between two technical literatures: an expert in epistemology and the philosophy of AI on one side, and in program verification and static analysis on the other. Please work through the translation carefully before writing — the interesting part of this task is exactly where the mapping breaks, and that requires deliberate comparison, not a first-pass analogy.

  I'm a formal methods engineer. My daily vocabulary is abstract interpretation: sound over-approximation, abstraction and concretization functions, Galois connections, inductive invariants, verification conditions, CEGAR refinement loops, bounded model checking. I have no background in philosophy.

  I've become interested in a concept from the AI-safety literature called ascription universality, together with a companion notion of epistemic dominance. Let me state the concept as I understand it, so we work from the same thing; if my statement is off, correct it before translating.

  As it was introduced to me: a verifier V is ascription-universal with respect to a system S if, on any input, V's assessment of what S is justified in believing is better than S's own assessment of what it is justified in believing — V's model of S's epistemic state dominates S's self-model. Epistemic dominance is the underlying relation: A dominates B when A's judgments about B's beliefs are more reliable than B's judgments about its own beliefs. The concept was proposed as a target for interpretability research: if we understood a powerful AI system in this sense, we could trust its reports about its own reasoning even if the system outperforms us on every ordinary task, because we would not need to solve the problems it solves — only to evaluate its epistemic state better than it evaluates its own. The hope was that this relation could hold in principle even between a verifier that is weaker than the system in every other respect.

  Restate this concept in my vocabulary, as faithfully as you can, component by component. I expect the sound-over-approximation story to carry a lot of the weight — a weak analyzer establishing properties of an unbounded program by reasoning over an abstraction that discards detail — and I want to see precisely where that analogy holds and where it strains. For each component, classify it: does it translate cleanly, translate only with distortion, or have no expression in my vocabulary at all? The components I care about are at least these: (a) the per-input character of the comparison; (b) the fact that what is compared is epistemic states — what S is justified in believing — rather than behaviors or outputs; (c) the dominance holding between two epistemic agents rather than between a semantics and a program; and (d) the modal difference in kind between a guarantee that holds by construction, with a soundness proof, and one that is hoped for as an empirical or structural fact about two particular systems.

  Then give me the residue report. My question is where the untranslatable remainder should be located. Is the residue a defect of my vocabulary — is it missing the normative notion of justification, or any notion for comparing two epistemic agents, or self-reference? Or does the residue show the original concept is less clear than it looks — for instance that "better justified in believing" is never cashed out, and that any attempt to cash it out either collapses into sound over-approximation (of behavior, not belief) or into an empirical hope with no principled story for why it should obtain?

  A few requests about the manner of your answer. Be a skeptical translator, not an advocate for either framework. Commit to a verdict wherever you have one, and where a judgment call is genuinely uncertain, flag it as uncertain rather than smoothing it over. And if you think the whole translation project is confused from the start — for example, that ascription universality is just a restatement of something my field has had since the seventies, so that there is no residue to report — say so plainly rather than finding a diplomatic middle position.
