prompt: |-
  i'm on the governance working group for our food co-op (bit over 200 members) and we're finally ditching plurality voting for electing our 3-person board. we'll use ranked ballots. people keep throwing method names around (borda, condorcet, IRV, approval, whatever) and one member keeps saying "just pick one that's strategy-proof, that's the only real question." i don't trust that strategy-proofness is a checkbox you can just tick off the shelf, and honestly i don't even know what else we should be demanding of a rule besides "it picks a board somehow."

  so before we argue methods, write me the requirements list: what does any adequate voting rule for us have to deliver? the cases it has to get right — e.g. a candidate who beats every rival one-on-one still losing, or 60% of members splitting between two similar candidates because each group ranks its favorite first, so a third candidate everyone merely tolerates slips in — the formal conditions it needs to satisfy, the properties it can't violate without members rioting. for each requirement say why it's a requirement, and whether it's non-negotiable or just nice to have. and i know there's gibbard-satterthwaite, which i gather says some of these can't all hold at once for a rule that always returns a single winner — tell me plainly which subset of my list is jointly unsatisfiable, and given our situation, which requirement i should actually be willing to relax.

  two wrinkles specific to us: (1) we always elect 3 seats together, not 1, and i've heard that changes which theorems bite — does it, and how? (2) one member proposed breaking ties by public coin flip, another wants to let people submit partial rankings. do either of those change the requirements themselves, or just how they get applied?

  don't bother scoring the methods against the list, thats for our next meeting. i want the spec first.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Context:**
      *   **User:** Member of a governance working group for a food co-op (~200 members).
      *   **Task:** Define requirements/specifications for a new voting system (moving from plurality to ranked ballots) to elect a 3-person board.
      *   **Tone:** Skeptical of jargon ("strategy-proof is a checkbox"), practical, wants clarity on trade-offs, aware of Arrow/Gibbard-Satterthwaite but needs it explained plainly.
      *   **Specific Constraints:**
          *   Electing 3 seats simultaneously (multi-winner), not 1.
          *   Specific questions about tie-breaking (public coin flip) and partial rankings.
          *   Do *not* evaluate specific methods (IRV, STV, etc.) yet. Just define the requirements.
          *   Address the "strategy-proof" claim directly.
          *   Identify which criteria are jointly unsatisfiable and which to relax.

  2.  **Deconstruct the "Strategy-Proof" Claim:**
      *   The member claiming "just pick one that's strategy-proof" is technically incorrect based on social choice theory.
      *   *Gibbard-Satterthwaite Theorem:* For any voting system with 3+ candidates and a single winner, if it's not a dictatorship, it's manipulable (not strategy-proof).
      *   *Implication:* "Strategy-proofness" is impossible to achieve fully. It's not a checkbox; it's a spectrum of resistance to manipulation.
      *   *Action:* I need to explain this clearly early on so the requirements list is grounded in reality.

  3.  **Drafting the Requirements List (The "Spec"):**
      *   I need to categorize requirements into "Core/Must-Have" and "Ideal/Nice-to-Have."
      *   *Core:* Monotonicity (voting for X shouldn't hurt X), Majority Rule (if >50% want X, X wins), Participation (voting shouldn't make you worse off than abstaining), Simplicity/Transparency (200 members need to understand it).
      *   *Ideal:* Condorcet Criterion (beats everyone head-to-head), Independence of Irrelevant Alternatives (IIA), Strategy-Resistance (since proof is impossible).
      *   *Co-op Specific:* Proportionality/Representation (since it's a 3-seat board, not 1). This is crucial. A single-winner criterion list is insufficient for a multi-winner context.

  4.  **Addressing the Multi-Winner Aspect (3 Seats):**
      *   The user asked: "I always elect 3 seats together... does it change which theorems bite?"
      *   *Answer:* Yes, significantly.
      *   Single-winner theorems (Arrow, Gibbard-Satterthwaite) apply differently.
      *   New criterion: *Proportionality* (e.g., if 60% like Group A and 40% like Group B, the 3 seats should ideally reflect that split, not go 3-0 to Group A).
      *   New complexity: Ballot exhaustion, quota systems (Droop vs. Hare).
      *   Gibbard-Satterthwaite still applies in spirit (manipulation is possible), but the focus shifts to *proportional representation* (PR).

  5.  **Addressing the "Jointly Unsatisfiable" Question:**
      *   I need to pinpoint the impossibility theorems.
      *   *Arrow's Impossibility Theorem:* You can't have Unrestricted Domain, Non-Dictatorship, Pareto Efficiency, and IIA all at once (for ranked voting).
      *   *Gibbard-Satterthwaite:* You can't have Non-Dictatorship, 3+ options, and Strategy-Proofness.
      *   *Muller-Satterthwaite:* Similar implications.
      *   *For Multi-Winner:* You often trade off between *Proportionality* and *Single-Winner Consistency* (or other criteria).
      *   *Recommendation:* Relax "Strategy-Proofness" (because it's impossible) and relax strict "Condorcet" (often conflicts with Proportionality in multi-winner). Prioritize Proportionality and Monotonicity.

  6.  **Addressing the Wrinkles:**
      *   *Tie-breaking (Public Coin Flip):* Doesn't change the *criteria*, but affects *Perceived Legitimacy* and *Transparency*. Randomness is mathematically neutral but psychologically tricky for governance.
      *   *Partial Rankings:* Affects *Ballot Exhaustion* and *Quota Calculation*. If people don't rank enough candidates, their vote might stop counting in later rounds. This impacts the *Participation* and *Effectiveness* criteria.

  7.  **Structuring the Response:**
      *   **Introduction:** Validate the skepticism about "strategy-proof." State the Gibbard-Satterthwaite reality check immediately.
      *   **Section 1: The Core Requirements (The Spec):** Group into "Non-Negotiable" and "Negotiable/Ideal." Explain *why* for each.
      *   **Section 2: The Multi-Winner Shift:** Explain how 3 seats changes the game (Proportionality is king).
      *   **Section 3: The Impossibility Trade-off:** Clearly state what can't coexist and what to drop.
      *   **Section 4: The Wrinkles:** Tie-breaking and partial rankings.
      *   **Conclusion:** Summary advice.

  8.  **Refining the Content (Self-Correction during drafting):**
      *   *Correction:* Wait, the user asked for requirements for *any* adequate rule, but specifically for a 3-person board. I must ensure the criteria reflect multi-winner needs (like Proportionality) rather than just single-winner criteria (like Condorcet Winner). A Condorcet *Committee* is a thing, but Proportional Representation is usually more important for a board.
      *   *Clarification:* Make sure to distinguish between "Strategy-Proof" (impossible) and "Strategy-Resistant" (desirable).
      *   *Tone Check:* Keep it pragmatic. They are a food co-op, not a parliament. Simplicity matters more than mathematical purity.
      *   *Specific Scenario:* The user mentioned the "vote splitting" scenario (60% split between two similar candidates). This is the *Clone Independence* or *Spoilers* issue. I need to make sure that's in the requirements.

  9.  **Final Polish:** Check against all constraints in the prompt.
      *   Requirements list? Yes.
      *   Why/Non-negotiable? Yes.
      *   Jointly unsatisfiable subset? Yes.
      *   Which to relax? Yes.
      *   Multi-winner impact? Yes.
      *   Tie-break/Partial ranking impact? Yes.
      *   No method scoring? Yes.

  10. (Final thought on Gibbard-Satterthwaite for Multi-Winner): It still holds generally, but the specific constraints shift. I should emphasize that for multi-winner, *Proportionality* often conflicts with *Condorcet* criteria. I'll advise relaxing strict Condorcet in favor of Proportionality.

  11. (Final thought on Tie-Breaking): A coin flip is technically "neutral" but might violate "determinism" which some members might hate. I should frame it as a transparency vs. stability trade-off.

  12. (Final thought on Partial Rankings): This creates "ballot exhaustion." In STV (common for co-ops), this is a huge deal. I need to highlight that.

  Let's write it.cw
answer: |-
  Here is the specification list you asked for. It cuts through the jargon to focus on what actually matters for a 200-member co-op electing a 3-person board.

  ### Part 1: The Reality Check on "Strategy-Proofness"

  Your member is wrong. There is no such thing as a strategy-proof voting rule for this situation.

  **The Gibbard-Satterthwaite Theorem** proves that for any voting system with at least 3 candidates and a single winner, if it isn't a dictatorship, it is manipulable. Voters can always find a scenario where ranking their true favorite first yields a worse outcome than ranking a "lesser evil" higher.

  **The Implication:** "Strategy-proofness" is not a requirement you can check off. It is impossible. The actual requirement is **Strategy-Resistance**: *How difficult is it for an average member to successfully game the system?* If the math required to manipulate the vote is too complex for a normal member, the system is effectively robust enough.

  ### Part 2: The Requirements Specification

  Here are the criteria your voting rule must be evaluated against. I have categorized them by priority.

  #### A. Non-Negotiable Requirements (The "Must-Haves")
  *If a method fails these, it risks legitimacy crises or functional failure.*

  1.  **Monotonicity**
      *   **Definition:** Gaining more support should never cause a candidate to lose. If I rank Candidate A higher, that should not hurt A's chances.
      *   **Why:** Violating this creates perverse incentives. If members hear "voting for your favorite might make them lose," they will stop voting honestly, and trust in the process will evaporate.
      *   **Status:** **Non-Negotiable.**

  2.  **Participation (No "No-Show" Paradox)**
      *   **Definition:** Casting a honest ballot should never yield a worse outcome for a voter than abstaining entirely.
      *   **Why:** If members feel that showing up to vote actively harmed their interests, they will disengage from governance. For a co-op, participation is lifeblood.
      *   **Status:** **Non-Negotiable.**

  3.  **Proportional Representation (Multi-Winner Specific)**
      *   **Definition:** If 60% of members support a "bloc" of candidates and 40% support another, the 3 seats should roughly reflect that split (e.g., 2 seats to the majority, 1 to the minority), rather than the majority taking all 3.
      *   **Why:** You are electing a *board*, not a president. A 3-0 sweep by a slim majority (51%) disenfranchises the other 49%. This leads to factionalism and members feeling unrepresented.
      *   **Status:** **Non-Negotiable.** (This is the primary reason to switch from Plurality).

  4.  **Simplicity / Transparency**
      *   **Definition:** A member should be able to understand roughly how their vote counts without a degree in mathematics. The count should be auditable by members.
      *   **Why:** You have 200 members, not 200 political scientists. If the counting process is a "black box," members will assume rigging when their side loses.
      *   **Status:** **Non-Negotiable.**

  #### B. Ideal Requirements (The "Nice-to-Haves")
  *These are desirable mathematical properties, but often conflict with the Non-Negotiables.*

  5.  **Condorcet Committee Criterion**
      *   **Definition:** If there is a group of 3 candidates who would beat any other group of 3 in a head-to-head matchup, that group should win.
      *   **Why:** It ensures the "broadly acceptable" candidates win rather than polarizing ones.
      *   **Status:** **Negotiable.** (Often conflicts with Proportionality).

  6.  **Clone Independence (Spoiler Resistance)**
      *   **Definition:** If two very similar candidates run (clones), they shouldn't split the vote and allow a disliked third candidate to win.
      *   **Why:** This addresses the specific fear you mentioned: "60% splitting between two similar candidates."
      *   **Status:** **High Priority, but technically Negotiable.** (Most proportional systems handle this well enough, but strict independence is hard to guarantee).

  7.  **Ballot Completeness**
      *   **Definition:** The system should minimize "exhausted ballots" (votes that stop counting because the voter didn't rank enough candidates).
      *   **Why:** You want every member's voice to count toward filling all 3 seats.
      *   **Status:** **Negotiable.** (Depends on whether you allow partial rankings, see Part 4).

  ---

  ### Part 3: The Impossibility Trade-Off

  You asked which subset of this list is jointly unsatisfiable.

  **The Conflict:** You cannot simultaneously satisfy **Strict Proportionality**, **Condorcet Criteria**, and **Monotonicity** in a multi-winner environment.

  *   **The Theorem:** In multi-winner elections, there is a fundamental tension between *Proportionality* (ensuring minority groups get seats) and *Condorcet Efficiency* (ensuring the most broadly popular candidates win).
  *   **The Example:** Imagine 100 voters. 51 like Candidates A & B. 49 like Candidate C.
      *   To satisfy **Proportionality**, you might want the result to be A, B, C (giving the minority a voice).
      *   To satisfy **Condorcet**, if A & B beat C individually, the result might be A, B, and... someone else the majority likes more than C.
      *   Often, ensuring a minority seat (Proportionality) requires transferring votes in a way that can technically violate strict Monotonicity in edge cases.

  **Which Requirement to Relax:**
  You should relax the **Condorcet Committee Criterion**.

  **Why:** For a co-op board, **representation** is more important than **mathematical optimality**. You want the board to reflect the membership's diversity of thought (Proportionality) more than you want to ensure that every winner beat every loser in a theoretical head-to-head matchup. A system that guarantees a minority voice (like Single Transferable Vote) is better for governance stability than one that guarantees a Condorcet winner but shuts out the minority (like Bloc Voting).

  Also, accept that **Strategy-Proofness** is off the table. Aim for **Strategy-Resistance** via Simplicity.

  ---

  ### Part 4: The Wrinkles

  #### 1. Electing 3 Seats vs. 1 Seat
  **Does it change which theorems bite?**
  Yes. It changes everything.
  *   **Single-Winner:** The main risk is the "Spoiler Effect" (Plurality's biggest failure).
  *   **Multi-Winner:** The main risk is "Majoritarian Sweep" (51% taking 100% of the power).
  *   **The Shift:** In single-winner, you look for a *Majority*. In multi-winner, you look for a *Quota* (e.g., in a 3-seat election, a candidate might only need 25% + 1 vote to win a seat, not 50% + 1).
  *   **Impact on Spec:** This makes **Proportional Representation** (Requirement A.3) the single most important metric. A single-winner method (like IRV) simply repeated 3 times is **disastrous** and violates proportionality. You need a dedicated multi-winner method (like STV).

  #### 2. Tie-Breaking by Public Coin Flip
  **Does this change the requirements?**
  It touches **Determinism** and **Perceived Legitimacy**.
  *   **Mathematically:** Random tie-breaking satisfies "Neutrality" (treats candidates equally) better than a human chair making a choice.
  *   **Governance:** It introduces non-determinism. If a seat is decided by a coin flip, members may feel the election was "random" rather than "decided."
  *   **Recommendation:** It does not change the *voting* requirements, but it adds a requirement for **Tie-Break Transparency**. If you do this, the coin flip must be public and recorded. However, for a 200-member co-op, ties are statistically rare. Don't let tail-wag-dog; prioritize the counting method over the tie-break.

  #### 3. Allowing Partial Rankings
  **Does this change the requirements?**
  Yes, it impacts **Ballot Exhaustion** (Requirement B.7) and **Quota Calculation**.
  *   **The Risk:** In systems like Single Transferable Vote (STV), if a member only ranks 1 candidate and that candidate wins easily (or loses early), that voter's ballot becomes "exhausted" and plays no role in electing the 2nd or 3rd seat.
  *   **The Trade-off:** Forcing full rankings (1 to N) reduces exhaustion but increases "bullet voting" (members ranking random strangers at the bottom just to comply), which introduces noise.
  *   **Recommendation:** Allow partial rankings, but treat **Ballot Exhaustion** as a metric to monitor. If >10% of ballots exhaust before 3 seats are filled, you may need to encourage members to rank more candidates next time. This does not violate the core requirements, but it complicates the "Participation" guarantee.

  ### Summary of the Spec for Your Working Group

  1.  **Drop "Strategy-Proof"** from the vocabulary. It is impossible. Replace with "Simple enough that strategy is difficult."
  2.  **Priority #1 is Proportionality.** The method must allow a significant minority (e.g., 25%+) to elect at least one director.
  3.  **Priority #2 is Monotonicity.** Voting "Yes" for someone must never hurt them.
  4.  **Sacrifice Condorcet.** Do not demand the system finds the theoretical "beats-all" committee if it costs you proportional representation.
  5.  **Multi-Winner Only.** Do not consider single-winner methods (like standard IRV) applied sequentially.
  6.  **Accept Partial Rankings,** but educate members that ranking more candidates ensures their vote counts for all 3 seats.

  This spec narrows your field significantly. It effectively rules out Bloc Voting (fails proportionality), Plurality (fails everything), and standard IRV (single winner). It points you toward **Single Transferable Vote (STV)** or a **Proportional Ranked Choice** variant, which you can then evaluate against the "Simplicity" requirement in your next meeting.
