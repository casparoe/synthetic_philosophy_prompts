prompt: |-
  I write the wall labels and tour captions for a small regional museum — local history and natural history — and the final wording of every claim is mine to settle, though a curator signs off. Each week brings about a dozen decisions of the same shape: a label says something, and I have to choose between stating it flat, hedging it, attributing it to someone, or leaving it out. Stating flat: "This bowl was made around 1200 BCE." Hedging: "was probably made." Attributing: "our curator believes." Leaving out: no claim at all.

  The problem is that we have no rule for which of these a given claim deserves, and I have been trying to build one on my own. Here is as far as I have got, and where I am stuck.

  Flat statements seem to require more than being true. A claim about a famous oak tree might be true, but if our only ground for it is that older guidebooks repeated it for a century, the flat statement still seems wrong even in the lucky case where it turns out true. On the other hand, some claims have been stated flat for decades on solid documentary grounds, and then the grounds collapse — a reattribution, a redating — and I cannot decide whether those flat statements were already wrong at the time or only became wrong. So the distinction I keep circling is between what is merely true, what we have good grounds for, and what we actually know. The middle one and the last one come apart in exactly our hard cases, and I do not know which of them should govern a flat statement on a museum wall. I suspect philosophers have a name for this question — when it is permissible to assert something outright — and I would like the procedure grounded in whatever has actually been worked out there rather than in my half-theory. Please do not attach a reading list or name-drop articles; I want the reasoning itself, and I will chase references later if I ever need them.

  Write me a procedure I can run in a few minutes per label. Specify: the questions to ask, in order; what counts as a sufficient answer to each; the output at each exit point — flat, hedged, attributed, or dropped; the point at which the questions stop and a human decides, because what remains is a matter of judgment about our audience or our mission rather than about the claim; and where the procedure should be honest that a step is a judgment call dressed up as a checklist item. Then run it on three cases we face or have recently faced:

  1. A fossil label where the dating method is one we trust, applied by people we trust, with a published margin of error.
  2. A portrait long labeled as the work of a minor master, which one respected specialist has recently declared a workshop copy while the rest of the field has not engaged; the old label appears in every guidebook, and changing it will draw complaints.
  3. A local legend that a famous historical figure planted the oak at our entrance — repeated in our own older materials and beloved by visitors, with no primary evidence either way. The director wants it kept because it draws people in. This is the case where I expect the procedure to give an answer the director will not like, and I want it to give that answer anyway, with the reasoning stated openly.

  Finally, tell me what the procedure cannot do: the cases where two careful people running it in good faith will reach different outputs, and what I should do when that happens. Keep it usable by someone with no philosophical training — me — under deadline, with the curator reading over my shoulder.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the User and Request:**
      *   **User:** Museum label writer/captioner for a small regional museum (local + natural history).
      *   **Task:** Create a decision procedure for wording claims on labels (Flat, Hedged, Attributed, Dropped).
      *   **Problem:** No existing rule for when to use which mode. Struggling with the distinction between "true," "well-grounded," and "known."
      *   **Constraints:**
          *   Do not provide a reading list or name-drop articles (want the reasoning itself).
          *   Write a procedure runnable in a few minutes per label.
          *   Specify: Questions in order, sufficient answers, output at exit points, where human judgment takes over, and where the procedure admits it's a judgment call.
          *   Run the procedure on three specific cases (Fossil, Portrait, Oak Tree).
          *   Explain limitations (where two careful people might disagree) and how to handle that.
          *   Tone: Usable by a non-philosopher under deadline, with a curator watching.
          *   Specific Instruction for Case 3: The procedure must give the answer the director might not like (intellectual honesty), with open reasoning.

  2.  **Deconstruct the Philosophical Core:**
      *   The user is grappling with *epistemic justification* vs. *truth* vs. *assertability*.
      *   In philosophy (specifically epistemology and speech act theory), this touches on the *Norm of Assertion*. The standard view (Knowledge Norm) is: "Assert $p$ only if you know $p$."
      *   However, in a museum context, "knowledge" is institutional, not just individual. It's about *warrant*.
      *   The user's distinction:
          *   *Merely True:* Lucky guess, tradition without evidence. (Don't assert flatly).
          *   *Good Grounds:* Evidence exists, but maybe contested or probabilistic. (Hedge or Attribute).
          *   *Known:* Solid evidence, consensus, reliable method. (Assert Flatly).
      *   The "hard cases" involve the gap between *having grounds* and *being certain*.
      *   *Solution:* The procedure needs to operationalize "Institutional Warrant." It's not about metaphysical certainty, but about whether the institution is willing to stake its reputation on the claim *as fact*.

  3.  **Drafting the Procedure (The "Warrant Checklist"):**
      *   Need a flowchart style but in text.
      *   Step 1: Evidence Check. (Is there *any* evidence?) -> If no, Drop or Attribute (as legend).
      *   Step 2: Consensus/Method Check. (Is the evidence reliable and agreed upon?) -> If yes, Flat.
      *   Step 3: Contestation Check. (Is there significant disagreement?) -> If yes, Hedge or Attribute.
      *   Step 4: Institutional Risk. (Are we willing to be wrong?) -> Judgment call.
      *   *Refinement:* Need to make sure the distinction between "Hedged" and "Attributed" is clear.
          *   *Hedged:* The fact itself is uncertain (probability).
          *   *Attributed:* The fact is contested, but a specific authority holds this view (shifting responsibility).
      *   *Refinement on "Flat":* Needs to pass the "Retraction Test." If new evidence comes out, would we say "We were wrong" (Flat) or "We said 'probably'" (Hedged)?

  4.  **Developing the Steps (Iterative Process):**
      *   *Q1: Evidence Source.* Is there direct physical/documentary evidence?
      *   *Q2: Reliability.* Is the method standard and accepted?
      *   *Q3: Consensus.* Is there expert agreement?
      *   *Q4: Stakes.* Does being wrong damage credibility?
      *   *Decision:* Let's structure it as a funnel. Start with the strongest claim (Flat) and see if it survives.
      *   *Philosophical Grounding (Internal):* This is essentially a pragmatic adaptation of the *Knowledge Norm of Assertion* combined with *Social Epistemology* (trust in institutions/experts). I won't name these, but I'll build the logic on them.

  5.  **Running the Cases:**
      *   *Case 1 (Fossil):* High reliability method, trusted people, published error margin. -> **Flat** (with the error margin included as part of the fact).
      *   *Case 2 (Portrait):* Old consensus vs. New specialist. Field hasn't engaged. -> **Hedged** or **Attributed**. Since it's one specialist vs. tradition, "Attributed" protects the museum while acknowledging the new research. "This portrait was *long considered*... Recent analysis *suggests*..." Actually, the prompt asks for specific categories. Let's aim for **Hedged/Attributed hybrid** or choose the safer one. The prompt asks to choose between Flat, Hedged, Attributed, Dropped. If one specialist says X and others are silent, it's not consensus. So not Flat. Is it "Probably"? Or "Smith argues"? "Attributed" is safer for institutional reputation.
      *   *Case 3 (Oak Tree):* Legend, no evidence, director wants it. -> **Dropped** as fact. Can be **Attributed** as legend ("Local tradition holds..."). The prompt says the procedure should give an answer the director won't like (i.e., not Flat). So it must rule out Flat. It should probably allow "Attributed as legend" but forbid "Flat."

  6.  **Refining the "Judgment Call" Section:**
      *   Where does the algorithm fail? When evidence is ambiguous or when "mission" overrides "accuracy."
      *   Need to explicitly state: "This step is where philosophy ends and policy begins."

  7.  **Addressing the Limitations:**
      *   Two people might weigh "consensus" differently.
      *   Two people might assess "risk" differently.
      *   Advice: Default to the more cautious option when in doubt. The museum's long-term credibility is the asset.

  8.  **Drafting the Content (incorporating constraints):**
      *   *Tone:* Professional, direct, practical.
      *   *No Name-Dropping:* Avoid "Gettier," "Williamson," "Epistemology." Just use the logic.
      *   *Structure:*
          1.  Introduction (The Logic).
          2.  The Procedure (The Checklist).
          3.  The Test Cases.
          4.  Limitations & Disagreements.

  9.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is the distinction between Hedged and Attributed clear?
      *   *Fix:* Define Hedged as uncertainty about the *world* (it probably happened). Define Attributed as uncertainty about the *claim* (someone says it happened).
      *   *Critique:* Case 3 needs to be firm.
      *   *Fix:* Ensure the procedure explicitly blocks "Flat" for legends without evidence, even if popular.
      *   *Critique:* The user asked for "where the procedure should be honest that a step is a judgment call."
      *   *Fix:* Add a specific "Stop & Decide" box in the procedure.

  10. **Final Polish:** Check against the "few minutes per label" constraint. Keep questions binary (Yes/No) where possible. Ensure the reasoning for the Oak Tree case is sharp (Truth vs. Engagement).

  *(Self-Correction on Case 2)*: One specialist vs. silence. Is it "Probably a copy"? Or "Specialist X says copy"? If the field hasn't engaged, the consensus is still the old view. But the old view is now shaky. "Hedged" implies probability based on evidence we hold. "Attributed" implies we are reporting a debate. Since the museum hasn't verified the new claim, "Attributed" is more honest. "Recent examination by [Name] suggests..."

  *(Self-Correction on Case 3)*: Director wants it kept. Procedure says "Don't state as fact." Solution: State as legend. This satisfies the director (it's on the wall) but satisfies the procedure (not a flat claim). I need to make sure the procedure distinguishes between "Dropping the claim" and "Dropping the *Flat* version of the claim." The prompt options are Flat, Hedged, Attributed, Dropped. "Attributed as legend" fits "Attributed."

  Let's write it.

  *Plan:*
  1.  **Preamble:** Briefly explain the underlying logic (Institutional Warrant).
  2.  **The Procedure:** 5 Questions.
  3.  **The Cases:** Apply the 5 Questions.
  4.  **Limitations:** Where human judgment is unavoidable.
  5.  **Closing:** Advice on disagreement.

  *Wait, one constraint check:* "Specify... the point at which the questions stop and a human decides." I need to build a "Decision Gate" into the procedure.
  *Another constraint:* "Tell me what the procedure cannot do."
  *Another constraint:* "Keep it usable by someone with no philosophical training."

  Okay, ready to generate.cs
answer: |-
  ### The Logic of the Procedure

  You are asking for a rule of **assertability**, not just truth. In a museum, a "flat statement" is not merely a claim that happens to be correct; it is a promise that the institution is willing to stake its reputation on that claim being correct. If you say "This bowl was made in 1200 BCE," you are telling the visitor: "We have checked this, and if it turns out to be 1100 BCE, we made a mistake."

  The procedure below operationalizes **Institutional Warrant**. It treats the museum as a single knower. It prioritizes the long-term credibility of the institution over the immediate satisfaction of a visitor or the convenience of a writer. It distinguishes between *facts* (the world), *evidence* (our access to the world), and *consensus* (our community's agreement on that evidence).

  ***

  ### The Label Warrant Procedure

  **Time required:** 3–5 minutes per label.
  **Instructions:** Answer the questions in order. Do not skip ahead. If you answer "No" at any step, follow the arrow to the next step or the exit point.

  #### Step 1: The Evidence Test
  **Question:** Is there direct physical or documentary evidence for this claim currently held in trust by this museum or accessible to our staff?
  *   *Direct evidence:* Carbon dating, signed documents, contemporary eyewitness accounts, stratigraphy.
  *   *Indirect/Traditional evidence:* "It has always been said," "An old guidebook says," "It looks like."
  *   **If YES:** Proceed to Step 2.
  *   **If NO:** **STOP.** Output: **Attributed** (as legend/tradition) or **Dropped**.
      *   *Reasoning:* You cannot state as fact what you cannot show. If the story is culturally important, attribute it to the tradition ("Local legend holds..."). If it is merely decorative, drop it.

  #### Step 2: The Method Test
  **Question:** Was the evidence generated using a method that is currently standard and accepted in the relevant field?
  *   *Accepted:* Radiocarbon dating, provenance research, peer-reviewed stylistic analysis.
  *   *Disputed/Outdated:* Phrenology, outdated dating ranges, discredited attribution styles.
  *   **If YES:** Proceed to Step 3.
  *   **If NO:** **STOP.** Output: **Hedged** or **Dropped**.
      *   *Reasoning:* If the tool is broken, the result is not a fact. You may state what the object *might* be if the method has some residual utility ("Likely dates to..."), but do not state it flatly.

  #### Step 3: The Consensus Test
  **Question:** Is there active, significant disagreement among qualified experts about this specific claim?
  *   *No Disagreement:* The field generally accepts the finding.
  *   *Active Disagreement:* Published papers argue against it, or a significant minority of specialists reject it.
  *   *Silence/Uncertainty:* The field hasn't looked closely yet, or one voice has raised a doubt that others haven't addressed.
  *   **If NO (General Agreement):** Proceed to Step 4.
  *   **If YES (Active Disagreement):** **STOP.** Output: **Attributed**.
      *   *Reasoning:* When experts fight, the museum reports the fight. ("While traditionally dated to X, recent analysis by Y suggests...")
  *   **If SILENCE (One voice/Unverified):** **STOP.** Output: **Hedged**.
      *   *Reasoning:* If a new claim exists but isn't settled, treat it as probability, not fact. ("Probably a workshop copy.")

  #### Step 4: The Margin Test
  **Question:** Does the evidence come with a quantifiable margin of error or probability?
  *   **If NO (Precise):** Proceed to Step 5.
  *   **If YES (Range/Probability):** **STOP.** Output: **Flat** *including the margin*.
      *   *Reasoning:* A flat statement can include uncertainty if the uncertainty is part of the fact. ("Made around 1200 BCE (±50 years)" is a flat statement about a range. "Made around 1200 BCE" without the range is a lie.)
      *   *Note:* If the margin is too wide to be useful to a visitor (e.g., "Made between 1000 BCE and 1 CE"), move to **Hedged** ("Likely made in the first millennium BCE").

  #### Step 5: The Retraction Test (Judgment Gate)
  **Question:** If new evidence emerges tomorrow proving this claim false, would the museum issue a correction, or would we say "we didn't know"?
  *   *This is a judgment call.* There is no objective metric here. You must imagine the press release.
  *   **If "We would correct it":** Output: **Flat**.
  *   **If "We would say we didn't know":** Output: **Hedged**.
      *   *Reasoning:* This step measures institutional confidence. If you aren't willing to apologize for being wrong, you aren't ready to state it flatly.

  ***

  ### Application to Your Cases

  #### Case 1: The Fossil
  *   **Step 1 (Evidence):** Yes (Physical fossil, dating method applied).
  *   **Step 2 (Method):** Yes (Trusted method, trusted people).
  *   **Step 3 (Consensus):** Yes (No mention of dispute).
  *   **Step 4 (Margin):** Yes (Published margin of error).
      *   *Action:* Output **Flat** (including the margin).
      *   *Wording:* "This fossil dates to 150 million years ago (±2 million years)."
      *   *Reasoning:* The uncertainty is quantified and part of the scientific fact. Stating the range flatly is honest.

  #### Case 2: The Portrait
  *   **Step 1 (Evidence):** Yes (Visual analysis, historical records).
  *   **Step 2 (Method):** Yes (Stylistic analysis is standard).
  *   **Step 3 (Consensus):** **Silence/Uncertainty.** One specialist says "copy"; the rest haven't engaged. The old consensus is shaken but not overturned.
      *   *Action:* Output **Hedged**. (You could Attribute, but since the field hasn't adopted the new view, a hedge protects the museum from backing a lone wolf until the pack moves).
      *   *Wording:* "Long attributed to [Master], this portrait is *likely* a workshop copy."
      *   *Reasoning:* You cannot state flatly that it is a copy (consensus lacks). You cannot state flatly that it is an original (evidence is now shaky). A hedge acknowledges the shift without staking the museum's reputation on a single dissenting voice.

  #### Case 3: The Oak Tree
  *   **Step 1 (Evidence):** **NO.** ("No primary evidence either way," "Local legend").
      *   *Action:* **STOP.** Output: **Attributed** (as legend).
      *   *Wording:* "Local tradition holds that [Figure] planted this oak."
      *   *Reasoning:* The procedure blocks a Flat statement immediately. There is no evidence.
      *   *Addressing the Director:* The procedure does not require you to *drop* the story. It requires you to drop the *claim of fact*. You can keep the story to draw people in (satisfying the Director) but you must label it as what it is: a story (satisfying the truth). If the Director insists on " [Figure] planted this oak," the procedure dictates you must refuse. To state it flatly is to lie to the visitor about the state of knowledge. The museum's currency is trust; spending it on a legend devalues the labels that are true.

  ***

  ### Limitations and Disagreements

  This procedure cannot resolve cases where the inputs themselves are disputed. Two careful people will reach different outputs in the following scenarios:

  **1. The "Significant Disagreement" Threshold (Step 3)**
  *   *The Problem:* How many dissenting experts constitute "active disagreement"? Is one vocal professor enough? Is 10% of the field enough?
  *   *The Conflict:* Person A might say, "One published paper counts as disagreement." Person B might say, "Until a textbook changes, there is no disagreement."
  *   *The Fix:* When in doubt, default to **Hedged**. It is less damaging to be accused of timidity than of arrogance. If you hedge and later the claim becomes consensus, you can update the label. If you state flat and are wrong, you lose credibility.

  **2. The Retraction Test (Step 5)**
  *   *The Problem:* This is explicitly a judgment call. One writer might feel, "We are confident enough to eat this crow if needed." Another might feel, "We are a small museum; a correction would be embarrassing."
  *   *The Conflict:* This is where your mission competes with your epistemology.
  *   *The Fix:* This is the point where the Curator's sign-off is not just bureaucratic but substantive. If you and the Curator disagree here, the Curator overrides you *only if* they are willing to sign their name to the potential correction. Make the risk personal. "Are you willing to sign the correction notice?" usually clarifies the answer.

  **3. The "Good Enough" Evidence (Step 2)**
  *   *The Problem:* Methods degrade over time. A dating method trusted 20 years ago might be suspect today.
  *   *The Conflict:* One person reads the current literature; the other relies on the museum's past files.
  *   *The Fix:* The procedure requires *current* standard. If the method is outdated, you must Hedge or Attribute, even if the label has been flat for 30 years. The past does not warrant the present.

  ### Final Instruction for Disagreement

  If you run this procedure and a colleague (or the Curator) runs it and you get different results:

  1.  **Identify the Step:** Pinpoint exactly which Question caused the divergence. (e.g., "I said Yes to Step 3, you said No.")
  2.  **Debate the Input, Not the Output:** Do not argue about whether the label should say "probably." Argue about whether the evidence actually exists.
  3.  **The Tie-Breaker:** If the input remains genuinely ambiguous after discussion, **choose the option that requires less evidence.**
      *   Flat requires the most evidence.
      *   Hedged requires less.
      *   Attributed requires less still.
      *   Dropped requires none.
      *   *Rule:* In a tie, move down the list. It is better to under-promise and over-deliver than to over-promise and under-deliver.

  This procedure will not make you infallible. It will not stop new evidence from proving you wrong. But it will ensure that when you are wrong, you were not negligent. It ensures that every flat statement on your wall is a claim you are willing to defend, not just a story you are willing to tell.
