      *   *Reading 2:* Irrelevant. We know she doesn't know. Question is whether lack of knowledge makes it improper.
      *   *Reading 3 (Necessity):* Directly challenged. If KNA-Necessity is true, she acted improperly. If intuition says she acted properly, KNA-Necessity is false.
