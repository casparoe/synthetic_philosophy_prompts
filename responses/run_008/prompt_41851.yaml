      *   *Reading 2 (Sufficiency):* If you know, you're allowed to assert.
      *   *Reading 3 (Necessity):* You must know to assert properly.
      *   *Reading 4 (Constitutive/Williamsonian):* Assertion is *defined* by this rule (like chess).
