answer: |-
  This is a remarkably precise observation of a phenomenon that sits at the intersection of action theory, ethology, and systems engineering. You have identified a structural flaw in agency where **local rationality** (the individual steps make sense) is undermined by **global fragility** (the sequence cannot tolerate state changes).

  There is no single canonical term in philosophy that captures the *entirety* of this pattern (the intelligence, the rigidity, and specifically the *restart-on-interruption* mechanic). However, there are several "near-miss" concepts in adjacent fields. I will walk you through the three strongest candidates, explain why each fails to fully capture your description, and then propose a synthesized term that fits the boundaries you've drawn. Finally, I will address your friend's claim regarding free will.

  ### 1. The Ethological Candidate: Fixed Action Pattern (FAP)
  **The Concept:** In ethology (the study of animal behavior), a Fixed Action Pattern is an innate, stereotyped behavior triggered by a specific stimulus (a "sign stimulus"). Once triggered, the FAP runs to completion, even if the stimulus is removed mid-stream. The classic example is a greylag goose that continues the motion of rolling an egg back to its nest even if the egg is removed halfway through.

  **Where it fits:**
  *   **Rigidity:** Like your nurse and robot, the agent follows a pre-programmed motor sequence.
  *   **Insensitivity:** The behavior is largely insensitive to changing environmental feedback once initiated.

  **Where it fails:**
  *   **Completion vs. Restart:** A classic FAP typically tries to *finish* the current motor program (the goose finishes the rolling motion). Your examples *abort and restart from the beginning*.
  *   **Innate vs. Learned:** FAPs are biologically hardwired. Your nurse and software are operating on *learned* or *designed* procedures.
  *   **Intelligence:** FAPs are usually "dumb" reflexes. Your examples contain genuine checks (the wristband verification is a cognitive act, not a reflex).

  **Verdict:** This explains the *rigidity*, but not the *transactional restart* logic or the presence of local intelligence.

  ### 2. The Sociological Candidate: Ritualism (Mertonian Strain)
  **The Concept:** Sociologist Robert K. Merton, in his *Social Theory and Social Structure* (1949), described "Ritualism" as a mode of adaptation where an agent adheres strictly to the institutionalized *means* (rules, procedures) while abandoning or losing sight of the cultural *goals* (success, safety, efficiency).

  **Where it fits:**
  *   **Means-End Decoupling:** This perfectly describes the nurse who protects the *procedure* (the checklist) more than the *purpose* (patient safety). If the procedure is interrupted, the "safety" of the procedure is compromised, so it must be redone, even if the patient's safety was never actually at risk.
  *   **Institutional Context:** It accounts for why the nurse does this (professional training/liability) and why the software does this (integrity protocols).

  **Where it fails:**
  *   **Lack of Mechanical Specificity:** Merton's Ritualism explains *why* the agent follows the rule blindly, but it doesn't technically describe the *restart-on-interruption* mechanic. A ritualist might just pause and resume. Your examples demand a return to *step one*.
  *   **Pathology vs. Protocol:** Merton viewed ritualism as a deviant adaptation (a failure of the system). In your software example, the restart is a *feature* (data integrity), not a bug.

  **Verdict:** This explains the *motivation* (rule-following over goal-tracking), but not the *structural behavior*.

  ### 3. The Action Theory Candidate: Lack of Reasons-Responsiveness
  **The Concept:** In contemporary philosophy of action (specifically the work of John Martin Fischer and Mark Ravizza), moral responsibility and agency depend on "Guidance Control." An agent has guidance control if their mechanism of action is **responsive to reasons**. If the world changes in a way that provides a reason to act differently, a free agent *can* adjust.

  **Where it fits:**
  *   **The Free Will Claim:** Your friend's intuition is philosophically sound here. The agent is acting on a "script" rather than a "reason." If the reason for checking the wristband is "ensure identity," and identity is already established, a reasons-responsive agent skips the check. Your agent cannot.
  *   **Alienation:** The agent is alienated from the purpose of the action; they are serving the routine, not the goal.

  **Where it fails:**
  *   **Descriptive, Not Structural:** "Lack of reasons-responsiveness" is a diagnosis of the *capacity* for freedom, not a name for the *behavioral pattern* of restarting. It tells us the agent isn't free, but not what they are *doing*.

  **Verdict:** This validates your friend's claim but doesn't name the phenomenon.

  ---

  ### The Synthesis: "Procedural Atomism"

  Since no existing term captures the specific combination of **local intelligence**, **global rigidity**, and **atomic restart**, I propose we adapt a term from your own field (computer science) and apply it to action theory: **Procedural Atomism**.

  In database theory, an **Atomic Transaction** is a series of operations that must all succeed together; if one fails, the entire transaction rolls back to the start. There is no partial state.

  **Definition:**
  **Procedural Atomism** is a mode of agency wherein a sequence of actions is treated as an indivisible unit. The agent possesses the capacity for intelligent assessment at individual steps, but lacks the meta-cognitive capacity (or permission) to assess the *state of the sequence* as a whole. Consequently, any interruption or anomaly invalidates the entire sequence, forcing a rollback to the initial state, regardless of partial progress or unchanged conditions.

  **Boundaries and Distinctions:**

  1.  **Procedural Atomism vs. Prudence:**
      *   *Prudence:* The nurse restarts because she judges that the interruption *might* have contaminated the sterile field or her focus. She is tracking the *goal* (safety).
      *   *Atomism:* The nurse restarts because the *script* dictates that an interruption voids the sequence. She is tracking the *rule*.
      *   *Test:* If you ask the agent, "Did the interruption actually change the risk?" and they answer, "I don't know, but I have to start over," that is Atomism.

  2.  **Procedural Atomism vs. Compulsion (OCD):**
      *   *Compulsion:* The restart is driven by internal anxiety (the "feeling" isn't right).
      *   *Atomism:* The restart is driven by external logic (protocol, code, liability).
      *   *Overlap:* Structurally, they are identical. This suggests that institutional protocols often co-opt the psychological structure of compulsion to ensure compliance.

  3.  **Individual vs. Institutional:**
      *   Does the institution count? **Yes.** In fact, Procedural Atomism is often a **Systemic Property** imposed on individuals. The software deployment system is an instance of *Engineered Procedural Atomism*. The nurse is an instance of *Internalized Procedural Atomism*. The institution designs the atomism to prevent "partial states" (e.g., half-administered drugs, half-deployed code) because partial states are dangerous. The "stupidity" you perceive is the cost of **Transaction Safety**.

  ### Addressing the Free Will Claim

  Your friend claims: *"This pattern is what the lack of free will really looks like... an inability to register that a routine has stopped tracking its purpose."*

  This is a sophisticated insight that aligns with the **Reasons-Responsiveness** account of freedom mentioned earlier, but also touches on **Marxian Alienation** and **Reification**.

  1.  **Reification:** The procedure (a tool created by humans for a purpose) becomes a "thing-in-itself" that governs the human. The nurse serves the checklist; the checklist does not serve the nurse.
  2.  **Guidance Control:** In the philosophy of free will, an agent is not free if they cannot modulate their behavior in response to relevant changes in the world. Your examples show agents who *can* perceive the change (the interruption, the moved furniture) but whose *action mechanism* is insulated from that perception.
  3.  **The Verdict:** Your friend is correct, provided we define free will as **autonomous agency** rather than metaphysical freedom. This is not about whether the universe is deterministic; it is about whether the agent is the *author* of the action or merely the *executor*. In Procedural Atomism, the agent is an executor. The "author" is the protocol designer.

  ### Summary

  *   **Nearest Existing Concept:** **Mertonian Ritualism** (for the means-end decoupling) combined with **Atomic Transactions** (for the restart logic).
  *   **Proposed Term:** **Procedural Atomism**.
  *   **Definition:** Treating a sequence of actions as an indivisible unit where interruption necessitates a full rollback, prioritizing transactional integrity over situational adaptability.
  *   **Free Will Connection:** It is a concrete example of **heteronomy** (being governed by external law) and a lack of **reasons-responsiveness**. The agent is not "unfree" in a metaphysical sense, but they are functionally alienated from the purpose of their own actions.

  You are seeing the friction point where **safety engineering** (which demands atomicity) meets **human agency** (which demands flexibility). The "stupidity" is the price paid for guaranteeing that the system never exists in a corrupted partial state.
