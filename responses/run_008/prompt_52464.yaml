prompt: |-
  My roommate has gotten really into libertarian YouTube and now whenever taxes come up he just says "taxation is theft" like it's a knockdown argument and then refuses to elaborate. Last week it came up because I mentioned my paycheck, and when I pushed him on it he started talking about some basketball player named Wilt Chamberlain who apparently proves that any redistribution requires the state to constantly interfere with people's lives, which I confess I did not follow. I want to be able to respond to the slogan properly instead of just going "well no, theft is illegal and taxes aren't," which felt pedantic even to me.

  Can you break down what "taxation is theft" could actually be claiming, as distinct precise theses rather than one slogan? Like, one reading might be a flat definitional thing (taxation literally satisfies the definition of theft), another might be a moral claim that it's pro tanto wrong in the same way taking someone's stuff without asking is, another might be the full Nozick-style conclusion that no taxation of earnings could ever be justified even by majority vote, and maybe there are others I'm not thinking of — I've seen people use it to mean everything from "the income tax specifically is illegitimate" to "any government spending is". For each reading, can you say whether it's plausible, whether it's basically trivial or actually contentious, and crucially whether my roommate needs THAT reading for his argument to work, or whether a weaker one would do? I'm especially confused about where the Wilt Chamberlain stuff fits in — does the entitlement theory argument (people entitled to their holdings, transfers preserve entitlement) actually get you all the way to "taxation is theft," or does it get you something weaker that the slogan then oversells? I'd love a list I can basically read back to him.

  Also, seperate question but related: does the slogan even need the strong self-ownership premise, or could you get a theft-like conclusion from weaker premises about consent? Because I'd honestly accept something like "taxation without any democratic say is closer to theft than taxation you voted for," and I want to know if that's a coherent middle position or if it concedes the whole thing to him. Lay it out plainly, I took one phil class in college so don't assume I know the jargon but dont dumb it down either.
