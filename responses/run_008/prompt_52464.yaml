  3.  **Analyze the Wilt Chamberlain Argument:**
      *   *What is it?* Nozick's thought experiment from *Anarchy, State, and Utopia*.
      *   *The Setup:* Start with a perfectly equal distribution of wealth (D1). People voluntarily pay 25 cents to watch Wilt play. Wilt gets rich. New distribution (D2) is unequal.
      *   *The Point:* If D1 was just, and the moves to D2 were voluntary, then D2 must be just. To maintain D1 (equality), the state must constantly interfere with voluntary exchanges.
      *   *Relevance to Taxes:* Progressive taxation to redistribute wealth is essentially undoing the voluntary moves from D1 to D2. It violates liberty to maintain a pattern.
