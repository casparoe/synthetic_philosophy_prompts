answer: |-
  **Brainstorming Candidates**
  1. *The Queue:* Two habitual line-cutters. One blames the other for cutting again. *Risk:* Intuition might rely on public norm enforcement rather than interpersonal standing.
  2. *The Lab:* Two safety violators. One blames the other for risking *them*. *Selected:* Clearer personal stake isolates the standing variable.

  **Scenario**
  Elena and Mark are lab partners bound by a safety protocol they both frequently ignore to save time. Yesterday, both skipped crucial pressure checks. Today, Mark prepares to bypass a valve again, knowing a failure could injure Elena standing nearby. Elena stops him, saying, "You can't do this; it's reckless." She has not reformed, apologized, or claimed moral superiority; she simply demands he stop risking *her* safety. Mark cries hypocrisy, noting she skipped checks yesterday. Yet, Elena's blame feels forceful, not nullified.

  **Analysis of Standing**
  (a) **Moral Authority:** On views where blame claims a normative differential (e.g., Fritz), hypocrisy undermines standing because the blamer lacks the requisite moral authority. Elena is guilty of the same violation, so she cannot claim the high ground required to sanction Mark. Her hands are not clean, so her verdict lacks legitimacy.
  (b) **Protest:** On communicative views (e.g., Shoemaker, Wallace), blame is a protest against a demand violation. Here, wrongdoers retain standing to protest violations targeting them, as the demand is grounded in shared vulnerability rather than moral purity. Elena protests the risk to *her*, not the abstract norm, inviting Mark to recognize her claim against him.

  **The Decisive Feature**
  The work is done by **directed harm**. Elena blames Mark for violating the norm *against her*. If you remove this—say, Mark's violation risks only a third party—Elena's hypocrisy likely defeats standing, reverting to the standard verdict. The personal stake overrides the hypocrisy deficit because the right to protest harm to oneself is more robust than the right to enforce general norms.

  **Pushback**
  A defender of the "hypocrisy defeats standing" view would push back by distinguishing *appropriateness* from *standing*. They would explain away the intuition: conceding Elena's reaction is psychologically understandable or even morally appropriate, but denying she possesses the normative *power* to blame. Her complaint is valid, but *she* is not the agent entitled to lodge it formally. They would argue the intuition of "force" is merely psychological pressure, not evidence of normative standing, employing an error theory about our reactive attitudes.

  **Literature Status**
  It is settled that hypocrisy is a *pro-tanto* defeater of standing; it always counts against the blamer. It is deeply contested whether it is an *all-things* defeater. Some argue standing is binary (you have it or you don't); others argue it is scalar or context-sensitive (e.g., self-defense exceptions). Do not present the "absolute defeater" view as consensus; it is a major live debate between relational and norm-enforcement accounts.
