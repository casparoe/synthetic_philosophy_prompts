prompt: |-
  You're a professional philospher specialising in the ethics of blame — I need you to build me a thought experiment to order, and please brainstorm a couple of candidate scenarios before committing to the final one.

  Here's what I want and what it's for: my students have just absorbed the standard line that hypocrisy undermines one's standing to blame, and I want a case that puts pressure on that line from an unexpected direction. So the scenario must feature a genuine hypocrite — someone who is themselves guilty of the very thing they're blaming another person for — whose standing to blame nonetheless survives. The reverse of the usual verdict, in other words. Constraints:

  - Realistic setting: an office, a shared flat, a family — no trolleys, no sci-fi, no perfect predictors.
  - The scenario itself must be no longer than one paragraph.
  - The hypocrisy must be real and undissolved: the blamer really did the same thing, it wasn't trivially different, and they haven't apologised, reformed, or done any of the usual things that restore standing.
  - No cheating by stipulating the verdict — don't just say everyone found the blame fitting. It has to fall out of the details of the case.

  After the scenario, walk through how at least two mainstream pictures of standing would treat it: (a) the view that blame involves claiming a moral differential or authority that the guilty party lacks, so hypocrisy is self-undermining; and (b) the view of blame as a form of protest that wrongdoers are still entitled to join. Then tell me: which single feature of the case is doing the work, what happens to the verdict if you remove that feature, and how a defender of the "hypocrisy nearly always defeats standing" view would push back on the case — would they deny the intuition, or explain it away?

  One more thing: this literature is full of people talking past each other, so please separate what's genuinely settled from what's contested among people who work on it — don't present one contested account as the consensus view. And keep the whole answer under 650 words, tight but doable — no padding, no throat-clearing. Think carefully before you write.
