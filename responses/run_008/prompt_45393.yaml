answer: |-
  Here is a battle plan for a 40-minute pub session. Your hunch is right: without scaffolding, the distinction evaporates into "it depends." You need to build a cage around the intuition before you try to poke it.

  ### 1. The Foundation: What must be in place first?
  Before you present the distinction, you must secure agreement on two things, or the whole thing will feel arbitrary:
  1.  **Counterfactual Equality:** The group must agree that in both cases (Doing and Allowing), the victim dies *at the same time* and *in the same way*, and that the agent's action/inaction was the deciding factor in both. If the "allowing" case involves a pre-existing condition that would have killed them anyway, the distinction is rigged.
  2.  **The Normative Baseline:** This is the critical piece people miss. You cannot distinguish "doing" from "allowing" without agreeing on what counts as the **status quo**. "Allowing" is not just "not moving"; it is "not interfering with a process *that you have some standing to interfere with*."
      *   *Pub Translation:* "We have to agree on what counts as 'minding your own business' versus 'stepping in.' If we don't agree on the baseline, one person's 'letting die' is another person's 'killing.'"

  **Action:** Spend the first 5 minutes establishing that we are comparing two scenarios where the *result* is identical, and the *relationship* to the victim is identical.

  ### 2. The One Example: The "Ventilator Switch"
  Do not use the Trolley Problem. You are correct; it drags in "means vs. side-effect" and "numbers saved," which muddies the water. You want a 1-on-1 comparison.

  **The Scenario:**
  *   **Case A:** A doctor enters a room, sees a patient on a ventilator, and actively turns the dial to "Off." The patient dies.
  *   **Case B:** A doctor enters a room, sees the ventilator is unplugged (perhaps by a glitch or a previous shift), and sees the patient dying. The doctor could plug it back in with zero risk to themselves. They choose not to. The patient dies.

  **Why this example works:**
  *   **Controls for Motive:** Assume in both cases the doctor wants the patient dead (inheritance, mercy, malice—pick one and stick to it).
  *   **Controls for Causation:** In both cases, if the doctor had acted differently, the patient lives.
  *   **Avoids "Body Stillness":** In Case B, the doctor is *doing* things (standing, looking, deciding), just not manipulating the plug. This kills the "omission = freezing" misconception immediately.
  *   **Avoids "Natural Causes":** A ventilator is artificial. Dying without it isn't "nature taking its course" in the same way a disease is.

  **What it needs:** Explicitly state that the doctor has a *duty* to care for the patient in both cases. If you don't establish the duty, Case B becomes "stranger watching stranger drown," and the legalistic "no duty to rescue" intuition will hijack the moral discussion.

  ### 3. Sequence: Heading off Misconceptions
  Here is the order of operations to trap the errors before they derail the room.

  *   **Minute 10 (The "Stillness" Trap):** As soon as you describe Case B, someone will say, "But in the second one, he didn't *do* anything."
      *   *Head it off:* "He made a decision. He used his muscles to walk away or stand still. Is 'doing' just about muscle movement, or is it about changing the world?" Write **Movement vs. Intervention** on the board.
  *   **Minute 20 (The "Causation" Trap):** Someone will say, "In Case A he caused death, in Case B the machine failure caused death."
      *   *Head it off:* "If I see you drowning and I don't throw the rope, did the water kill you or did I?" Push them to admit that *preventing a rescue* is a causal factor. Write **Cause vs. Condition** on the board.
  *   **Minute 30 (The "Permission" Trap):** This is the big one. People think if it's "letting die," it's morally neutral.
      *   *Head it off:* Ask, "If the distinction holds, does it mean letting die is *okay*?" Force them to separate **Categorization** (Is this killing or letting die?) from **Evaluation** (Is this wrong?). You can categorize it as "letting die" and still call it monstrous.

  **The Unexpected Misconception: Intent vs. Mechanism**
  Watch for the person who says, "Killing requires *wanting* them dead; letting die happens when you just don't care."
  *   *Correction:* Remind them you stipulated the doctor *wanted* the patient dead in both cases. The distinction is about the *mechanism of agency*, not the *state of mind*.

  ### 4. The Check: The "Own Child" Flip
  Do not end by asking "Does everyone get it?" They will lie to save face.
  Run this check at Minute 35:

  **The Test:** "Imagine it's your child on that ventilator.
  *   Scenario 1: A nurse walks in and turns it off.
  *   Scenario 2: A nurse walks in, sees it's unplugged, and walks out.
  *   **Question:** Do you feel the same anger in both cases? If yes, why do we have different laws for them? If no, what is the difference in your anger?"

  If they say "I'm equally angry," they understand that the moral *weight* might be the same even if the *category* differs. If they say "I'm angrier at the turner," ask them to articulate *why* without using the words "active" or "passive." If they can't, they haven't grasped the distinction, just the vocabulary.

  ### 5. Scope: What to Refuse (The Intersection)
  **Do not use your road intersection argument.**
  *   **Why:** It introduces **Systemic Negligence**. When a city redesigns a road, is it "doing harm" (creating a kill zone) or "allowing harm" (failing to protect)? This blends individual agency with institutional policy, statistical probability, and resource allocation.
  *   **The Risk:** It will turn into a political debate about city budgets and traffic engineering, not a moral philosophy session. It's a "Level 2" problem that requires solving the "Level 1" distinction first.
  *   **The Move:** Tell them, "That's a perfect example of why this matters, but it's too messy for tonight. Let's solve the doctor problem first, then you can take the tool home to fix the road argument."

  ### 6. The Whiteboard Layout
  Keep it visual. Draw this early and don't erase it.

  | | **Case A** | **Case B** |
  | :--- | :--- | :--- |
  | **Outcome** | Patient Dies | Patient Dies |
  | **Motive** | Wants Death | Wants Death |
  | **Action** | Turns Switch | Ignores Plug |
  | **Counterfactual** | If didn't turn -> Life | If plugged -> Life |
  | **Category?** | Killing? | Letting Die? |

  **Final Tip for the Facilitator:**
  Your job isn't to solve the debate (philosophers haven't in 50 years). Your job is to make sure they realize *why* it's hard. If they leave thinking "Well, it's complicated, but I see why the words matter," you've won. If they leave thinking "It's obviously just killing," you've failed to secure the Baseline. If they leave thinking "It's obviously different," you've failed to poke the Causation trap. Aim for the uncomfortable middle.
