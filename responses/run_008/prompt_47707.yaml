      *   *Consequentialism:* Right action = best outcome (saving lives, reducing suffering).
      *   *Deontology/Rule-Based:* Right action = following rules (Precepts: No killing, no stealing, no lying).
      *   *Virtue/Intention-Based (Karma):* Right action = pure intention (cetana).
      *   *The Buddhist Twist:* Karma is intentional, but the goal is ending suffering (consequentialist-ish). The "Ship's Captain" case (Upaya/Skillful Means) complicates it.
