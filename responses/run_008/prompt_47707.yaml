      *   **Core Mechanism:** A deliberation game (Village Council Simulation).
      *   **Key Constraints:**
          *   16 students.
          *   80 minutes total.
          *   No software (printable cards/paper).
          *   No prior knowledge of Buddhist texts assumed.
          *   Two ledgers: Merit (Intention/Purity) vs. Welfare (Outcomes/Consequences).
          *   Ledgers must visibly diverge by the end.
          *   One round must align precept and outcome (to show divergence isn't just about conflict of interest, but about the *nature* of evaluation).
          *   Hidden outcome table (randomized).
          *   Debrief must map the game to the philosophical question (Consequentialism vs. Intentionalism/Deontology) and address limitations (Rebirth).
