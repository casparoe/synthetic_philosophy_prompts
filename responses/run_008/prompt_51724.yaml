  # SPEECH ACT DIAGNOSTICS: A DECISION TREE

  **Instructions:** Answer **YES** or **NO** to each question based on your intuition about the case. Follow the arrows to discover which theoretical account matches your verdicts.

  ### **NODE 1: THE CHATBOT (Case 2)**
  *A customer-service chatbot, lacking intentions altogether, outputs: "I promise the refund will arrive in five days."*
  **Q: Did the chatbot actually make a promise?**

  *   **NO (Intention Required)** → Go to **Node 2A**
  *   **YES (Convention Sufficient)** → Go to **Node 2B**

  ---

  ### **NODE 2A: THE SARCASTIC FRIEND (Case 4)**
  *You say to a friend, "I promise to pay you back," sarcastically. Everyone understands no commitment is undertaken.*
  **Q: Was a promise nevertheless made?**

  *   **NO (Uptake/Intention Wins)** → **LEAF 1: The Gricean**
      *   *Verdict:* Illocution requires complex speaker intention and audience recognition; convention is secondary.
      *   *Weakest Case:* **Case 1 (Corp Apology).** Struggles to explain how the CEO apologized despite lacking sincere intention, yet the public accepts the act.
  *   **YES (Constitutive Rule Wins)** → **LEAF 2: The Searlean**
      *   *Verdict:* Illocution is constituted by rules; intention makes it serious, but the act occurs if rules are satisfied.
      *   *Weakest Case:* **Case 2 (Chatbot).** Cannot easily account for how a mindless system could satisfy conditions of "psychological state" essential to the rule.

  ---

  ### **NODE 2B: THE JUDGE IN THE CORRIDOR (Case 5)**
  *A judge utters a sentence of imprisonment in the corridor, not the courtroom, though she has authority over the defendant.*
  **Q: Did the judge sentence the defendant?**

  *   **NO (Procedure/Context Wins)** → **LEAF 3: The Austinian**
      *   *Verdict:* Illocution requires correct procedure and context (felicity conditions); status alone is insufficient without execution.
      *   *Weakest Case:* **Case 2 (Chatbot).** If procedure is key, a functional chatbot following script should promise, yet Austin requires a person.
  *   **YES (Standing Wins)** → Go to **Node 3**

  ---

  ### **NODE 3: THE CEO'S APOLOGY (Case 1)**
  *A corporation sends a pre-drafted apology under the CEO's signature. The CEO has no sincere intention behind it.*
  **Q: Did the CEO apologize?**

  *   **NO (Status Individualism)** → **LEAF 4: The Status Individualist**
      *   *Verdict:* Institutional standing empowers the act, but it remains tethered to the individual's agency/sincerity.
      *   *Weakest Case:* **Case 3 (Spokesperson).** Cannot explain how a spokesperson successfully apologizes *for* the minister if the act requires the specific individual's agency.
  *   **YES (Pure Institutionalism)** → **LEAF 5: The Institutional Status Theorist**
      *   *Verdict:* Illocution is a status function; once assigned, the act occurs regardless of mind, context, or sincerity.
      *   *Weakest Case:* **Case 4 (Sarcasm).** Overgenerates acts; implies the sarcastic friend made a promise simply by having the status of a speaker, ignoring uptake.

  ---

  ### **EMPTY SPACE & LIMITATIONS**

  **Unoccupied Logical Space:**
  *   **Combination:** **YES** on Chatbot (Intention not needed) + **NO** on CEO Apology (Sincerity needed).
  *   **Diagnosis:** This combination is **incoherent**. If intention is not required for a chatbot to promise, sincerity cannot be required for a CEO to apologize; both rely on the same convention/status mechanism.

  **Indistinguishable Leaves:**
  *   **Pair:** **Leaf 3 (Austinian)** and **Leaf 1 (Gricean)** on **Case 3 (Spokesperson)**.
  *   **Issue:** Both likely answer "NO" (No one apologized, as the minister didn't speak).
  *   **Additional Case Needed:** *A written decree signed by the minister but drafted by a aide.* The Austinian might say "YES" (procedure met), while the Gricean says "NO" (minister's intention absent). This separates Procedure from Intention in delegated contexts.

  **The "Further Position" (Leaf 4):**
  *   **Status Individualism** occupies space not on the reading list. It accepts institutional standing (unlike Grice) but rejects pure conventionalism (unlike Leaf 5), arguing that status empowers *agents*, not *roles* independent of agents.

