answer: |-
  # THE LEADER'S DILEMMA: A DECISION TREE
  **For the Community Centre Discussion Group**

  ### INTRODUCTION
  We often argue about whether a leader can be *right* to do something *wrong*. Philosophers call this the **Problem of Dirty Hands**. This handout helps us map our disagreements without using jargon. It starts with one case and asks five questions. Follow the arrows to find which view matches your own.

  ### THE STANDING CASE
  **The Mayor's Lie:** A Mayor learns a violent riot will erupt tomorrow unless a specific witness testifies. The witness refuses unless granted immunity for a past crime. The Mayor has no legal power to grant immunity but promises it anyway. The witness talks, the riot is stopped. The Mayor lied to a citizen to save the peace.

  ---

  ### THE DECISION TREE

  **START: The Mayor has lied to prevent a riot.**

  **QUESTION 1: THE RULE**
  Is lying *always* forbidden, even if it saves lives?
  *   **YES:** The Mayor should not have lied, even if the riot happens.
      *   ➔ **GO TO LEAF A (The Absolutist)**
  *   **NO:** Sometimes lying is necessary.
      *   ➔ **GO TO QUESTION 2**

  **QUESTION 2: THE STAIN**
  If the lie was necessary, was it still a **moral wrong** (a stain on the soul), or did the good outcome make it **morally okay** (clean hands)?
  *   **MORALLY OKAY:** It was just choosing the "lesser evil." The hands are clean.
      *   ➔ **GO TO LEAF B (The Calculator)**
  *   **MORAL WRONG:** It was a violation, even if necessary. The hands are dirty.
      *   ➔ **GO TO QUESTION 3**

  **QUESTION 3: THE LOTTERY**
  Suppose the Mayor lies, but the riot happens *anyway*. Was the Mayor still right to lie?
  *   **NO:** If the good result doesn't arrive, the lie was a waste and a sin. Morality depends on success.
      *   ➔ **GO TO LEAF C (The Gambler)**
  *   **YES:** A sincere, reasonable attempt is enough. The outcome is luck, not morality.
      *   ➔ **GO TO QUESTION 4**

  **QUESTION 4: THE VERDICT**
  When we judge the Mayor, do we say he was **justified** (it was the *right* thing to do) or merely **excused** (it was *wrong*, but we won't punish him)?
  *   **EXCUSED:** He did wrong. We understand the pressure, but we cannot call it "right."
      *   ➔ **GO TO LEAF D (The Tragic Figure)**
  *   **JUSTIFIED:** He did the right thing, all things considered.
      *   ➔ **GO TO QUESTION 5**

  **QUESTION 5: THE GUILT**
  Since the act was justified but still a moral wrong, should the Mayor feel **guilt and remorse**?
  *   **NO:** Guilt is a luxury. A leader must do the job and move on.
      *   ➔ **GO TO LEAF E (The Cold Realist)**
  *   **YES:** Guilt is the proof that morality still matters. He must carry the burden.
      *   ➔ **GO TO LEAF F (The Dirty Hands)**

  ---
  *(Turn over for descriptions of the leaves and new test cases)*
  ---

  ### THE SIX POSITIONS (THE LEAVES)

  **A. The Absolutist**
  *   **View:** Some rules (do not lie, do not kill innocents) can never be broken.
  *   **On the Mayor:** He did wrong. He should have accepted the riot rather than corrupt his office.
  *   **Philosophical Label:** *Deontology* (Duty-based).

  **B. The Calculator**
  *   **View:** Morality is math. If the good outweighs the bad, no wrong was done.
  *   **On the Mayor:** He did the right thing. His hands are clean because he chose the best outcome.
  *   **Philosophical Label:** *Utilitarianism* (Consequentialism).
  *   *Note: This view denies "Dirty Hands" exist. There is only "Clean Hands."*

  **C. The Gambler**
  *   **View:** You are only right if you win. Risking a moral wrong for a failed outcome is unforgivable.
  *   **On the Mayor:** If the riot stops, he is a hero. If the riot happens, he is a criminal.
  *   **Philosophical Label:** *Result-Dependent Justification.*

  **D. The Tragic Figure**
  *   **View:** The act was wrong and cannot be called "right," but the leader is not to blame.
  *   **On the Mayor:** We pardon him, but we do not praise him. He remains stained.
  *   **Philosophical Label:** *Excuse Theory.*
  *   *Note: This is distinct from Dirty Hands (Leaf F). Leaf F says the act was "Right." Leaf D says it was "Wrong but Understandable."*

  **E. The Cold Realist**
  *   **View:** The act was wrong, but necessary. Feeling guilty is self-indulgent and weakens leadership.
  *   **On the Mayor:** Do the dirty work, but do not burden the public with your conscience.
  *   **Philosophical Label:** *Machiavellian Realism.*

  **F. The Dirty Hands (Classic View)**
  *   **View:** The act was wrong, yet it was the right thing to do. Guilt is required to show respect for the moral law you broke.
  *   **On the Mayor:** He must be praised for saving the city, but he must also suffer internally for lying.
  *   **Philosophical Label:** *Walzerian Dirty Hands.*

  ---

  ### THREE FRESH CASES FOR DISCUSSION
  *Use these to test if your group lands on the same leaf as the Mayor case. Different cases often reveal hidden inconsistencies.*

  **1. The Triage Doctor**
  During a pandemic, a doctor has one ventilator but two patients who will die without it. One is a 20-year-old student; the other is a 70-year-old donor who funded the hospital. The doctor gives it to the student to save more "life-years," knowing the donor's family will sue and cut funding, harming future patients.
  *   *Test:* Is this "math" (Leaf B) or a betrayal of the donor (Leaf F)?

  **2. The Peace Treaty**
  To end a ten-year war, a Prime Minister secretly agrees to let enemy war criminals go unpunished. This stops the killing immediately but denies justice to victims. The Prime Minister never admits this deal to the public.
  *   *Test:* Is the silence a "necessary lie" (Leaf E) or a "corruption of justice" (Leaf A)?

  **3. The Innocent Scapegoat**
  A Sheriff knows a violent mob will burn down a neighbourhood unless someone is arrested for a crime *they* committed. The real culprit is dead. The Sheriff frames a homeless man with no family to save the neighbourhood. The mob disperses.
  *   *Test:* Even if it works, is this "justified" (Leaf F) or simply "murder" (Leaf A)? Most people shift leaves on this case.

  ---

  ### DISCUSSION NOTES
  *   **Merging Leaves:** If you find no difference between **The Calculator (B)** and **The Cold Realist (E)**, you may believe that "Rightness" wipes out "Wrongness" entirely. If you find no difference between **The Tragic Figure (D)** and **The Dirty Hands (F)**, you may believe "Justification" is just a fancy word for "Excuse."
  *   **Consistency:** It is common to be an Absolutist (A) on Case 3, but a Calculator (B) on the Mayor case. The goal of this tree is not to force consistency, but to reveal where your limits lie.
  *   **Technical Terms:**
      *   *Justified:* The act was the correct moral choice.
      *   *Excused:* The act was incorrect, but the person is not blameworthy.
      *   *Consequentialism:* Judging acts only by their results.
      *   *Deontology:* Judging acts by rules or duties, regardless of results.

  *Printed for the Community Centre Philosophy Group. Not for academic citation.*
