  To be **born** is to inherit the ash,
  A legacy of every careless **choice**.
  They say we suffer no tangible **harm**,
  Since our faces are not the **same**
  As those who might have paid the **debt**,
  In a greener, absent **world**.

  I walk the streets of this exhausted **world**,
  Grateful for the breath I was **born** with.
  The ledger shows an ecological **debt**,
  But who can question such a **choice**?
  My genes are not the **same**
  As the children spared this **harm**.

  Is it **harm** if the alternative is null?
  I love the sky of this specific **world**,
  Even if the clouds are not the **same**
  As the stories told before I was **born**.
  We pay the interest on the **debt**,
  Without recalling the original **choice**.

  There was no other **choice**
  That could settle this accumulating **debt**.
  The burden of being **born**
  Is to inhabit this depleted **world**.
  We feel the weight, but call it **harm**
  Where victim and the crime are **same**.

  My blood is not the **same**
  As those who escaped the **harm**.
  I cannot undo the **choice**,
  Nor forgive the unpaid **debt**.
  No other soul was **born**
  Into this breathing, burning **world**.

  I would not trade this **world**,
  Though the air is never **same**.
  Is existence a kind of **harm**?
  I stand here, fully **born**.
  There was no other **choice**,
  Only this inherited **debt**.

  To question the **choice** is to deny the **debt**,
  In this **world**, once **born**,
  There is no **harm**, only the **same**.
