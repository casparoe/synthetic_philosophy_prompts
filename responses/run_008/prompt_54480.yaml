      *   **User:** 34 years old, stable job, considering quitting for a 4-year high-risk/high-reward project.
      *   **The Project:** 2% chance of success ("enormous" payoff), 98% chance of failure (presumably lost time/income/career momentum).
      *   **The Brother's Argument:** Expected Value (EV) maximization. $0.02 \times \text{Huge} > 1.0 \times \text{Mediocre}$. This leads to "fanaticism" (accepting tiny probabilities for huge payoffs).
