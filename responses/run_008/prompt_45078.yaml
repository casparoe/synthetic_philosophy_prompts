  **Confused Commitment**
  **Commitment (3)** is historically and philosophically confused. Claiming drapetomania was a "factual error about biological function" rather than a value judgment is contentious. The error was positing a biological function where none existed (escaping slavery), driven entirely by moral values. Maintaining (3) requires defending the view that all past psychiatric errors were purely empirical mistakes, not conceptual corruptions.

