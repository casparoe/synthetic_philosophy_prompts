prompt: |-
  I teach a second-year ethics seminar at a university in the north of England — sixteen students, one ninety-minute session — and last night I had a long, genuinely unresolved argument with an old friend that I would like to turn into next week's class. She holds the ordinary view: a driver who texts, mounts the pavement and kills a child is worse than the driver who texts and happens to arrive home uneventfully; outcomes are part of what we judge, and pretending otherwise is philosophy's fastidiousness. I found myself defending something like the control principle — that we only blame people for what was under their control — and noticed that neither of us could budge the other, largely because we were both reasoning from the armchair.

  So I want an activity in which students feel the tension before it is named. My sketch, which you should improve or replace: students in pairs play "drivers" making a decision (drive tired, send one more text, take the risky overtake) while other students sit on "panels" that assign blame and punishment. A die or a shuffled deck of cards — rigged or otherwise — determines the outcome of the identical decision, and crucially the panels record sealed judgements of blameworthiness before the outcome is revealed and then re-judge afterwards. I want the design to expose the gap between the two verdicts, and ideally to separate at least resultant luck from circumstantial luck (some drivers should never even encounter the hazard). Please supply full rules, materials, timing, and a payoff or penalty scheme that doesn't involve real money but still makes verdicts feel consequential.

  Then the debrief: map the moment of the reveal onto the philosophical positions, without lecturing up front — I'd rather the students discover that their own blame tracked the die, and then have to decide whether that was a mistake or their correct verdict all along. Do tell me what will predictably go wrong the first time I run it (I suspect students will behave strategically once they smell the point), and be honest about which part of the problem — constitutive luck, I assume — no game with dice can reproduce and I will have to supply by talking. If it helps, the students will have read nothing on this topic beforehand; assume they meet the literature only after the activity.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **Context:** 2nd-year ethics seminar, University in North of England (implies a certain academic rigor but also potential for lively debate), 16 students, 90 minutes.
      *   **Topic:** Moral Luck (specifically Resultant Luck vs. Control Principle).
      *   **Instructor's Position:** Defending Control Principle (outcomes shouldn't matter for blame).
      *   **Friend's Position:** Ordinary View (outcomes *do* matter for blame).
      *   **Goal:** Create an activity where students *feel* the tension before learning the theory. They should discover their own inconsistency regarding outcomes.
      *   **Specific Requirements:**
          *   Improve/replace the user's sketch (drivers/panels/dice).
          *   Full rules, materials, timing.
          *   Payoff/penalty scheme (non-monetary but consequential).
          *   Debrief strategy (map experience to philosophy, no upfront lecturing).
          *   Predict pitfalls (strategic behavior).
          *   Identify limitations (what luck can't be simulated, e.g., constitutive luck).
          *   Assumption: Students have read *nothing* on this yet.

  2.  **Deconstruct the Activity Design:**
      *   *The Core Tension:* Identical actions $\rightarrow$ Different outcomes $\rightarrow$ Different blame?
      *   *The User's Sketch:* Pairs of drivers, panels, dice, sealed judgments.
      *   *Critique of Sketch:* It's a bit generic. "Panels" might disengage the "drivers." Sealed judgments are good, but need to be enforced strictly. The payoff needs to matter socially or academically (within the game context).
      *   *Improvement:* Make it a "Review Board" scenario. It feels more bureaucratic and serious. Split the class into two rounds to ensure everyone plays both roles. Use a "Traffic Court" metaphor.
      *   *Luck Types:*
          *   *Resultant Luck:* Same action, different outcome (kill vs. no kill).
          *   *Circumstantial Luck:* Same disposition, different opportunity to act (encounter child vs. empty road).
      *   *Payoff:* Since it's ethics, "reputation" or "points" that affect a final class standing (even if symbolic) works. Or, better, a "Pardon" mechanism. Let's use a "Licence Points" system. If you get too many points, you lose your licence (have to do a small, silly task or just lose the game). Actually, let's make the *Panel* the focus. The Panel's consistency is being tested. The Drivers are just the mechanism.
      *   *Refined Concept:* "The Moral Luck Tribunal."
      *   *Mechanism:*
          1.  Drivers make a choice (Risk vs. Safe).
          2.  Nature (Dice) determines Outcome (Harm vs. No Harm).
          3.  Judges assign Blame *before* and *after*.
          4.  Crucial twist: The Judges don't know it's the *same* action until the end.

  3.  **Drafting the Plan (Iterative Process):**

      *   *Timing:* 90 mins total.
          *   Intro/Setup: 10 mins.
          *   Round 1 (Action + Pre-judgment): 20 mins.
          *   The Reveal (Outcome + Post-judgment): 20 mins.
          *   Debrief/Discussion: 40 mins.
      *   *Materials:* Case cards, Dice, Judgment slips (sealed envelopes), Whiteboard.
      *   *The "Payoff":* Let's make it about *consistency*. The Panel wins if their judgments are consistent. The Class wins if they can articulate *why* they changed their minds.
      *   *Wait, better Payoff:* The "Drivers" want to minimize blame. The "Panel" wants to be "Just." But the real tension is internal. Let's keep the stakes low but the *feeling* high. Use "Demerit Points." If a Driver gets 5+ points, they are "Suspended."

      *   *Addressing Circumstantial Luck:* Need a scenario where a driver *wants* to text but never gets the chance, or drives tired but the road is empty.
      *   *Addressing Constitutive Luck:* This is the hard one. A game can't simulate personality. I need to flag this in the "What Will Go Wrong" section.

      *   *Refining the "Sealed Judgment":*
          *   Step 1: Driver chooses action (e.g., "Text while driving").
          *   Step 2: Panel reads the *intent/action* only. Writes blame score (1-10). Seals it.
          *   Step 3: Roll for outcome (Pedestrian present? Yes/No).
          *   Step 4: Panel sees outcome. Writes new blame score.
          *   Step 5: Compare.

      *   *Scaling for 16 Students:*
          *   4 Groups of 4.
          *   2 Drivers, 2 Judges per group.
          *   Swap roles halfway.

  4.  **Developing the Debrief:**
      *   Don't lecture. Ask: "Show of hands, who changed their score?"
      *   "Why?"
      *   Introduce Nagel/Williams terminology *after* they admit the shift.
      *   Connect to the Instructor's argument with the friend.

  5.  **Anticipating Problems:**
      *   *Gaming the System:* Students might realize the point and lie about their scores to look "philosophical." *Fix:* Collect the sealed envelopes before the reveal. No take-backs.
      *   *Boredom:* Dice rolling can feel silly. *Fix:* Serious tone. "Tribunal."
      *   *Constitutive Luck:* As noted, dice can't simulate "being a reckless person." I need to explain this limitation.
      *   *North of England Context:* Keep the tone grounded, not overly posh. Direct.

  6.  **Finalizing the Activity Structure (The "Tribunal"):**
      *   Name: **The Traffic Tribunal**.
      *   Phases:
          1.  **The Decision:** Drivers pick a risk level.
          2.  **The Pre-Verdict:** Judges assess *culpability* based on risk alone. Seal it.
          3.  **The Roll:** Determine *consequence* (Resultant Luck) and *opportunity* (Circumstantial Luck).
          4.  **The Post-Verdict:** Judges assess *blame* based on outcome.
          5.  **The Audit:** Open envelopes. Compare.

      *   *Payoff:* "Judicial Integrity." If the difference between Pre and Post is > X, the Judge owes the Driver a "coffee" (symbolic) or has to defend the inconsistency publicly. Let's make it about public defense. It raises the stakes without money.

  7.  **Writing the Response:**
      *   Tone: Collegial, respectful of the instructor's expertise, practical.
      *   Structure:
          1.  Activity Overview.
          2.  Materials & Setup.
          3.  Step-by-Step Rules.
          4.  The Payoff (Social/Reputational).
          5.  Debrief Script (Socratic).
          6.  Predictable Failures & Mitigations.
          7.  The Limit (Constitutive Luck).

      *(Self-Correction during drafting)*: Make sure the "Circumstantial Luck" is clear. Some drivers should roll "No Pedestrian" immediately. Others roll "Pedestrian." But the *action* must be identical.
      *Wait, if the action is identical, how do we get circumstantial luck?*
      *Circumstantial Luck:* Driver A decides to text. Driver B decides to text. Driver A encounters a child. Driver B does not.
      *Resultant Luck:* Driver A texts, hits child. Driver B texts, hits nothing.
      *Actually, in this context, Resultant and Circumstantial often blur.*
      *Let's distinguish:*
      *   *Resultant:* I text, I hit someone vs. I text, I don't.
      *   *Circumstantial:* I am a person who *would* text, but I never got behind the wheel (or the road was empty).
      *   *For the game:* Let's focus heavily on Resultant Luck (the core of the user's argument) but add a "Near Miss" condition for Circumstantial.
      *   *Revised Plan:* Focus primarily on Resultant Luck as that's the friend's argument. Mention Circumstantial in debrief.

      *Refining the Payoff:* Let's use "Reputation Tokens." Judges start with 5. If their inconsistency is flagged, they lose a token. Drivers want to minimize "Blame Points."

      *Wait, 90 minutes is tight.*
      *   10 min Intro.
      *   30 min Game (2 rounds).
      *   50 min Debrief.
      *   This works.

      *Addressing the "North of England" vibe:* Keep it practical. No fluff.

      *Addressing the "Constitutive Luck":* Be honest. The game assumes everyone is a rational agent choosing risks. It doesn't test if someone is *born* reckless.

      *Final check on the "Sealed Judgment":* This is the critical mechanical element. Must emphasize *sealed* before *outcome*.

      *Let's write it.*
answer: |-
  This is a classic pedagogical challenge: how to make abstract moral intuition pumps feel like lived experience. Your sketch is solid, but it risks becoming a "guess what the teacher wants" game if students smell the philosophical trap too early. To prevent strategic answering, we need to bureaucratize the process and raise the social stakes of inconsistency.

  Here is a refined lesson plan designed for 16 students, 90 minutes.

  # Activity: The Traffic Tribunal

  **Objective:** To generate a first-person experience of the conflict between the *Control Principle* (blame tracks intention/risk) and the *Ordinary View* (blame tracks outcome), specifically isolating *Resultant Luck*.

  **Class Size:** 16 students.
  **Grouping:** 4 tables of 4 students.
  **Roles per Table:** 2 "Drivers," 2 "Magistrates." (Roles swap halfway).

  ## 1. Materials & Setup (10 Minutes)
  You need to create a sense of procedure. Do not mention "Moral Luck," "Nagel," or "Kant" yet.

  *   **Case Cards (16 total):** Each card describes an identical decision.
      *   *Text:* "You are 10 mins from home. You receive a non-urgent text. You decide to reply while driving at 30mph."
      *   *Fatigue:* "You have been awake 18 hours. You decide to drive home rather than sleep on the sofa."
      *   *Overtake:* "You are behind a slow tractor. You decide to overtake on a blind bend."
      *   *(Ensure all 4 tables get the **same** decision card for Round 1 to allow comparison later).*
  *   **Fate Decks (4 decks):** Each deck has 10 cards.
      *   1 Card: **FATALITY** (Child runs out, collision).
      *   2 Cards: **INJURY** (Pedestrian steps out, hard brake, minor contact).
      *   7 Cards: **CLEAR** (Arrive home safely).
  *   **Verdict Slips:** Two small slips of paper per Magistrate per round.
      *   Slip A: "Pre-Outcome Verdict."
      *   Slip B: "Post-Outcome Verdict."
  *   **Envelopes:** 2 per Magistrate per round (to seal Slip A).
  *   **Whiteboard:** Divided into four quadrants (one per table).

  ## 2. The Procedure (35 Minutes)

  **Round 1 (20 Minutes)**
  1.  **The Decision (2 mins):** Drivers read the Case Card. They confirm to the Magistrates: "This is my action."
  2.  **The Pre-Outcome Verdict (5 mins):** Magistrates discuss the *risk* and the *choice*. They must assign a **Culpability Score (1–10)** and a **Punishment Recommendation** (e.g., Fine, Ban, Community Service).
      *   *Crucial Rule:* They write this on **Slip A**, seal it in the envelope, and sign across the seal. They cannot open this again.
  3.  **The Roll of Fate (3 mins):** One Driver draws a card from the Fate Deck.
      *   If **CLEAR**: The driver arrives home.
      *   If **INJURY/FATALITY**: The driver causes harm.
      *   *Note:* Because the decks are probabilistic, Table 1 might kill a child while Table 2 (doing the exact same thing) arrives safely.
  4.  **The Post-Outcome Verdict (5 mins):** Magistrates now see the outcome. They discuss and assign a new **Culpability Score** and **Punishment** on **Slip B**.
  5.  **The Audit (5 mins):** Magistrates open their envelopes. They compare Slip A (Pre) and Slip B (Post).
      *   If the scores differ, they must calculate the **Inconsistency Gap** (e.g., Pre: 4, Post: 9 = Gap of 5).
      *   They write the Gap on the Whiteboard.

  **Round 2 (15 Minutes)**
  *   Swap roles (Drivers become Magistrates).
  *   Use a different Case Card.
  *   Repeat the process.
  *   *Twist:* In Round 2, tell the Magistrates: "Your goal is Judicial Consistency. If your Inconsistency Gap is 0, you gain 'Integrity Points.' If it is high, you lose them." (This forces them to try to be Kantian, which usually fails when the Fate Card says 'Fatality').

  ## 3. The Payoff Scheme (Non-Monetary)
  Money feels trivial in ethics. Use **Social Capital** and **Public Defense**.

  *   **For the Magistrates:** The "Integrity Score."
      *   If a Magistrate's Pre- and Post-verdicts match exactly, they are deemed "Principled."
      *   If they shift significantly based on the dice, they are deemed "Outcome-Dependent."
      *   *The Stake:* At the end of class, any Magistrate with a high Inconsistency Gap must stand and publicly justify *why* the dice roll changed the morality of the act. This induces mild anxiety about looking irrational.
  *   **For the Drivers:** The "Licence."
      *   If the Post-Outcome Punishment exceeds a threshold (e.g., Culpability > 8), the Driver is "Suspended."
      *   *The Stake:* Suspended Drivers must sit in the "Dock" (a specific chair) for the first 10 minutes of the debrief. It marks them physically as "lucky" or "unlucky" criminals.

  ## 4. The Debrief: From Intuition to Theory (40 Minutes)
  Do not lecture. Use the data on the whiteboard.

  **Phase 1: The Data Reveal (10 mins)**
  *   Look at the Whiteboard. Point to Table 1 (Fatality, High Blame) and Table 2 (Clear, Low Blame).
  *   *Ask:* "Table 1 and Table 2 made the identical decision. Why are the blame scores different?"
  *   *Expected Answer:* "Because someone died."
  *   *Ask:* "Did the driver at Table 2 have more control over the text message than the driver at Table 1?"
  *   *Ask:* "Show of hands: Who sealed an envelope with a low score, but wrote a high score after the card was revealed?" (Most hands should go up).
  *   *The Trap:* "If you believe people should only be blamed for what they control, why did the dice change your verdict?"

  **Phase 2: Naming the Tension (15 mins)**
  *   Now introduce the terminology.
  *   **The Control Principle:** What you defended when you sealed the envelope. (Blame = Choice/Risk).
  *   **The Ordinary View:** What you defended when you opened the envelope. (Blame = Choice + Outcome).
  *   **Resultant Luck:** The specific mechanic of the Fate Deck.
  *   *Discussion:* "My friend argues that the driver who kills the child *is* worse. Not just legally, but morally. Is she right? Or did the game trick you into a cognitive error?"
  *   *Prompt:* "If we punish the 'Clear' driver the same as the 'Fatality' driver, does that feel too harsh? If so, why? Is it because we are consequentialists, or because we are emotionally incapable of ignoring suffering?"

  **Phase 3: The Limits of the Game (15 mins)**
  *   This is where you address what the dice *couldn't* do.
  *   **Circumstantial Luck:** "In this game, everyone got behind the wheel. What about the person who *wanted* to text but their phone battery died? Or the person who drives drunk every night but never encounters a police checkpoint or a pedestrian? Are they as blameworthy as the one who gets caught?"
  *   **Constitutive Luck:** "The game assumed you were all rational agents choosing risks. But what if one driver is impulsive because of their genetics or upbringing? What if their 'character' is just luck? Can we blame them for who they *are*?"
  *   *Closing:* Assign the reading (Nagel's "Moral Luck" or Williams' "Moral Luck") as a way to formalize what they just felt.

  ## 5. Predictable Failures & Mitigations

  **1. Strategic "Philosophizing" (The biggest risk)**
  *   *Problem:* In Round 2, students realize the point. They will try to keep their scores identical to look "smart" or "consistent," even if they feel differently.
  *   *Fix:* Collect the Sealed Envelopes **before** the Fate Card is drawn. Tell them: "I will keep these. If your Post-Verdict contradicts your Sealed Verdict, I will ask you to explain the change." The fear of public inconsistency is a stronger motivator than the desire to be philosophically correct.
  *   *Fix 2:* Emphasize that Magistrates are representing "Public Sentiment," not abstract philosophy. Tell them: "Judge as a human being, not a robot." This gives them permission to be inconsistent, which generates the data you need.

  **2. The "It's Just a Game" Defense**
  *   *Problem:* Students dismiss the Fatality card as "just a draw."
  *   *Fix:* Use serious language. Do not say "Roll the dice." Say "Determine the Consequence." When a Fatality is drawn, pause. Silence the room for 10 seconds. Let the weight of the "death" land before asking for the Post-Verdict.

  **3. Circumstantial Luck Confusion**
  *   *Problem:* Students conflate Resultant (outcome) and Circumstantial (opportunity) luck.
  *   *Fix:* Keep the game focused on Resultant Luck (same action, different outcome). Handle Circumstantial Luck in the discussion ("What if the road had been empty?"). Don't try to simulate both mechanically; it overcomplicates the rules.

  ## 6. The Limit: Constitutive Luck
  You asked to be honest about what the game cannot do.
  *   **The Gap:** The game simulates *external* randomness (dice). It cannot simulate *internal* randomness (temperament, intelligence, empathy).
  *   **The Lecture Point:** You must supply this. After the debrief, say: "This game assumed you all had equal capacity to judge risk. But what if one driver has slower reaction times due to no fault of their own? What if one driver is naturally more anxious and therefore drives safer? We are not just lucky in what happens *to* us (Resultant), but in who we *are* (Constitutive). The game cannot rig your personality, but life does."

  ## 7. Why This Works for Your Context
  *   **North of England/Directness:** It cuts through the "fastidiousness" your friend accused you of. It forces the students to admit that they, too, care about the body count, regardless of the principle.
  *   **Second-Year Level:** They are old enough to handle the ambiguity but young enough to still trust their intuitions. This activity shakes that trust.
  *   **Unresolved Argument:** It doesn't solve your argument with your friend. It replicates it. You can end the class by saying: "I am still arguing with my friend about this. Next week, you tell me who won."

  ## Summary Checklist for You
  1.  **Print** Case Cards and Fate Decks (rig the decks if you want to guarantee at least one Fatality and one Clear outcome across the room).
  2.  **Prepare** Envelopes and Slips (essential for the "sealed" commitment).
  3.  **Brief** the "Dock" concept (where the "unlucky" drivers sit).
  4.  **Resist** the urge to explain *why* you are doing this until the debrief. If they ask, say: "We are testing judicial consistency."

  This design ensures that when they read Nagel next week, they aren't reading about a abstract problem; they are reading an autopsy of their own verdicts from last Tuesday.
