answer: |-
  Here is a conceptual map of the slogan "marriage exists for the sake of children," broken down by the distinct philosophical claims it might encode. This is structured for use in a workshop setting, distinguishing between the *plausibility* of the premise and its *inferential power* regarding same-sex marriage (SSM).

  ### I. The Menu of Claims

  **1. The Historical/Etiological Claim**
  *   **The Claim:** The institution of marriage *originated* historically to manage lineage, property transmission, and child-rearing.
  *   **Plausibility:** **High.** Anthropological and historical consensus generally supports this as a primary origin story for formalized kinship structures.
  *   **Supports Exclusion?** **No.** This commits the genetic fallacy (confusing origins with current justification). Even if marriage began for children, its function may have evolved (e.g., toward companionship or mutual care). It supports neither exclusion nor inclusion, only description.

  **2. The Conceptual/Definitional Claim**
  *   **The Claim:** The *meaning* of the word "marriage" analytically entails a procreative union. To speak of "non-procreative marriage" is a contradiction in terms (like "married bachelor").
  *   **Plausibility:** **Low.** Linguistic usage and legal history show the concept has shifted. If this were true, infertile opposite-sex marriages would also be conceptually impossible, which the discussant admits they are not.
  *   **Supports Exclusion?** **Yes (if accepted).** If the definition excludes SSM by analytic truth, inclusion is a category mistake. However, because the definition is contested, this merely asserts the conclusion rather than arguing for it.

  **3. The Instrumental/Consequentialist Claim**
  *   **The Claim:** The state recognizes marriage *in order to* secure optimal outcomes for children (stability, resources, socialization). Marriage is a technology for child welfare.
  *   **Plausibility:** **Medium.** There is evidence that stable two-parent homes benefit children, but evidence also suggests parental stability matters more than biological link or sexual orientation.
  *   **Supports Exclusion?** **No.** This supports the **Weaker Conclusion** (SSM is not the paradigm). If the goal is child *welfare*, excluding SSM couples who *do* raise children (via adoption/IVF) undermines the goal. If the goal is child *production*, it excludes SSM but also requires excluding infertile couples (which the discussant tries to avoid).

  **4. The Teleological/Perfectionist Claim (Natural Law)**
  *   **The Claim:** Marriage is an intrinsic good realized through the "organic union" of reproductive organs. The *telos* is not merely the *outcome* (a baby) but the *orientation* of the act toward procreation. (Associated with Finnis, George, Bradley).
  *   **Plausibility:** **Contested.** Requires acceptance of specific metaphysical premises about biological functions constituting moral goods.
  *   **Supports Exclusion?** **Yes.** This is the only claim that robustly supports **Exclusion** while accommodating infertile couples. It argues SSM lacks the *structural capacity* for organic union, making it a different kind of relationship entirely, regardless of love or commitment.

  **5. The Civic/Republican Claim**
  *   **The Claim:** The state privileges marriage because it produces the next generation of *citizens*. It is a duty-based institution regarding the polity's continuity.
  *   **Plausibility:** **Medium.** Fits within civic republican theory but clashes with liberal neutrality.
  *   **Supports Exclusion?** **No.** Supports the **Weaker Conclusion**. SSM couples can raise citizens (adoptees, etc.). Excluding them reduces the pool of potential citizen-rearers without a clear civic benefit.

  ---

  ### II. Analysis of the Type/Token Repair

  The discussant's reply ("infertile couples are blunt knives; gay couples are spoons") is a specific maneuver to save the argument from the infertility counterexample. Here is where it fits and what work it does:

  **1. Which reading does it rescue?**
  It rescues **Claim 4 (Teleological/Natural Law)** and attempts to shore up **Claim 3 (Instrumental)**.
  *   It admits that *actual* procreation (token) is not required for marriage.
  *   It insists that *procreative type* (biological complementarity) is required.
  *   **The Shift:** It quietly moves the goalposts from **Consequentialism** (children as outcomes) to **Essentialism** (procreation as inherent structure).

  **2. Does it do real work?**
  *   **Internal Consistency:** Yes, it successfully distinguishes infertile opposite-sex couples (who possess the *equipment* for the "type" of act, even if broken) from same-sex couples (who lack the *equipment* for that "type" of act).
  *   **Argumentative Weight:** No, not on its own. It relies entirely on the prior acceptance of Claim 4. If you do not accept that marriage is *defined* by biological complementarity (rather than emotional union or legal commitment), the distinction between "blunt knife" and "spoon" is question-begging.

  **3. Does it change the claim mid-argument?**
  **Yes.** This is the critical vulnerability.
  *   **Initial Slogan:** "Marriage exists for the sake of *children*." (Implies a consequentialist end: the baby).
  *   **Repaired Slogan:** "Marriage exists for the sake of *procreative-type unions*." (Implies a deontological/inherent end: the act itself).
  *   **The Problem:** If the justification is *children* (outcomes), infertile couples and SSM couples are similarly situated (neither produces children naturally). If the justification is *biological complementarity* (acts), then the original slogan ("for the sake of children") was misleading. It should have been "for the sake of uniting reproductive organs."

  **4. The Knife Analogy Critique**
  *   **The Flaw:** A knife is defined by its physical geometry relative to a function. Marriage is a *legal status*. The "type" of a legal status is determined by the law, not biology.
  *   **The Counter:** A better analogy might be "Citizenship exists for the sake of voting." If someone is disenfranchised (felon, or living abroad), are they a "blunt citizen"? Or is the *institution* of citizenship broader than the *act* of voting? The discussant assumes the biological function defines the legal institution, which is the very point in dispute.

  ---

  ### III. Workshop Strategy: Three Questions to Pose

  To press the discussant without being adversarial, consider these three interventions:

  1.  **The "Ends" Question:** "You argue marriage is for the sake of children. Do you mean the *outcome* (the welfare of existing kids) or the *act* (the biological orientation)? If it's the outcome, excluding same-sex parents harms children. If it's the act, why is the slogan about 'children' and not 'complementarity'?"
  2.  **The "State Interest" Question:** "If the state's interest is in the *type* of union rather than the *welfare* of children, does the state have an interest in regulating the private sexual acts of infertile couples to ensure they are 'procreative in type'? If not, why is the biological type relevant to the legal status?"
  3.  **The "Paradigm" Question:** "Even if we grant your Type/Token distinction, does establishing that SSM is 'non-paradigmatic' justify *exclusion*? We allow non-paradigmatic drivers (elderly, disabled) to hold licenses. Why does being a 'spoon' rather than a 'blunt knife' warrant a ban rather than just a footnote?"

  ### Summary for your notes
  *   **The Slogan** is ambiguous between Consequentialist (child welfare) and Natural Law (organic union) claims.
  *   **The Infertility Objection** kills the Consequentialist reading.
  *   **The Type/Token Repair** saves the Natural Law reading but admits the slogan was imprecise.
  *   **The Conclusion:** The discussant is likely arguing from **Claim 4** (Natural Law) while using the language of **Claim 3** (State Interest). Your job is to force them to own Claim 4, where the metaphysical heavy lifting is visible and contestable.
