      *   **Fact Check:** Daniel Dennett is a *compatibilist*. He wrote "I Could Not Have Done Otherwise" and *Elbow Room*. He uses the *Sphex* example to show that while simple systems are sphexish, complex systems (like humans) have enough "flexibility" and "avoidability" to warrant the label "free will" *within* a deterministic framework. He argues *against* the idea that determinism necessarily implies sphexishness in all agents. The student has inverted Dennett's actual argument. The student describes an *incompatibilist* or *hard determinist* interpretation but attributes it to Dennett.

