  never went to college, this is just something i think about a lot on my own time (machinist, lots of podcasts and forum reading on quantum stuff over the years), so bear with me. i've ended up with a bunch of beliefs about the many-worlds thing and I want somebody to tell me whether they can all be true at once or whether im kidding myself somewhere. here they are:

  1. there's no collapse, the wavefunction just evolves by the schrodinger equation all the time, and every outcome in it is equally real. many-worlds basically has to be right because every other interpretation adds extra machinery (a collapse postulate, hidden variables, whatever) on top of the same math.

  2. the whole selling point, for me, is that many-worlds adds nothing. no new postulates, just the equation. that's why i pick it over the others.

  3. whatever the story about probability turns out to be, it has to give the born rule (squared amplitudes), because that's what every experiment ever has confirmed. i'm not budging on the born rule, it's the one thing that's actually tested.

  4. before i run a quantum measurement, i genuinely don't know which result i'm going to see. i know (per #1) that both results happen somewhere, and i still think there's a real uncertainty here, not just me being sloppy with words.

  5. right after a split, my future copies should count equally. there's no sense in which one of them is "more me" than the other one. they're both me, same amount.

  6. here's the case that bugs me. a machine puts me in a superposition of "room with red light" and "room with green light," one copy of me in each room. i feel like i should expect 50/50 red/green. now a slightly different machine does the same two-room setup but the amplitudes are such that the born weights are 1/3 red and 2/3 green. there's still exactly one copy of me in each room, so counting copies says 50/50 again, but i find myself actually expecting 1/3 and 2/3. both of those feel right to me and i cant make them both be right.

  7. i also think my probabilities shouldn't depend on how many "steps" an experiment has. like if a device does one big split at the end versus a bunch of little splits along the way that all merge back together or whatever, the answer should be the same. but the number of copies floating around obviously DOES depend on how you chop up the process into steps, which seems to wreck any "count the copies" way of doing things, including my 50/50 feeling in #6.

  so, go through these and tell me which ones are actually fighting each other, which ones only look like they're fighting, and which single belief is the cheapest one to drop. i'd rather fix one thing than rebuild everything. also if the fix ends up costing me #2 (the no-extra-postulates thing), tell me honestly, because i suspect that's where this is going and i want to know how bad it is. i dont need any reading lists or name-dropping, just the logic.

  (ps i type fast and dont always proofread, sorry)
