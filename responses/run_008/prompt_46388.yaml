answer: |-
  # The "Why Do You Laugh?" Quiz: Pascal's Mugging Edition

  You know the scene. A shady figure approaches you on the street. "Give me $10," they say, "or I will use my magic powers from the 5th dimension to inflict 3^^^3 units of suffering on you." (That's a number so big it breaks your calculator).

  You laugh. You walk away. You tell your friends, "Obviously I'm not paying that."

  But *why* aren't you paying? If you actually believed the math, you'd pay. If you think the math is wrong, *where* is it wrong? Most rationalist-adjacent folks give a vague shrug. This quiz is designed to pin down exactly which philosophical safety net you're standing on.

  **Instructions:** Read the eight scenarios below. Pick the answer (A, B, or C) that best matches your genuine intuition. Don't overthink it, and don't answer based on what you think a "rationalist" should say. Answer based on what you'd actually do.

  ***

  ### 1. The Classic Street Corner
  A mugger demands $10. They claim that if you don't pay, they will use trans-dimensional powers to destroy 3^^^3 happy lives. You have no evidence they can do this, but you can't strictly disprove it.
  *   **A.** I hand over the $10. The expected value is too high to ignore.
  *   **B.** I walk away. The claim is too absurd to take seriously.
  *   **C.** I walk away, but I feel a nagging worry that I'm violating the rules of rationality.

  ### 2. The Mirror Image
  Same mugger, same $10. But this time, they promise to *create* 3^^^3 happy lives if you pay. No threat, just a massive reward.
  *   **A.** I hand over the $10. The math is the same as the threat.
  *   **B.** I walk away. If I didn't pay for the threat, I won't pay for the reward.
  *   **C.** Actually, I might pay for the reward, but I still wouldn't pay for the threat.

  ### 3. The Magic Trick
  The mugger raises their hand. The sky briefly turns green, gravity reverses for five seconds, then everything returns to normal. "See?" they say. "Now about that $10..."
  *   **A.** I still don't pay. A green sky isn't enough proof for *that* number.
  *   **B.** I pay up. That demonstration crossed the threshold of credibility.
  *   **C.** I still don't pay. I have a rule against reacting to street magic.

  ### 4. The Sequel
  You ignored the first mugger. You turn the corner, and a second mugger steps out with the exact same story.
  *   **A.** I pay them both. Each threat stands on its own.
  *   **B.** I ignore the second one, just like the first.
  *   **C.** I ignore the second one specifically because if I paid the first, I'd be setting a precedent that drains my wallet.

  ### 5. The Empty Pockets
  You have already donated your entire altruistic budget for the year to what you sincerely believe is the best cause (e.g., AI safety or global health). You have $10 left for groceries. The mugger appears.
  *   **A.** I borrow money or skip a meal to pay. The stakes are too high to let budgeting get in the way.
  *   **B.** I tell them I'm tapped out. I've already allocated my resources to the best bet I have.
  *   **C.** I tell them no. I wouldn't have paid even if I had a million dollars.

  ### 6. The Dust Specks
  Forget the mugger. Imagine you could prevent 3^^^3 people from getting a tiny dust speck in their eye. The only way to do this is to allow one person to be tortured for 50 years.
  *   **A.** I allow the torture. 3^^^3 specks is mathematically worse.
  *   **B.** I prevent the torture. At some point, adding more specks doesn't make it worse.
  *   **C.** I refuse to answer. The comparison itself is broken.

  ### 7. The Lottery Ticket
  A normal lottery ticket costs $10. The jackpot is $100 million. The odds are 1 in 30 million. The expected value is technically positive (if you ignore taxes/splitting).
  *   **A.** I buy it. I always maximize expected value when the math says so.
  *   **B.** I don't buy it. I ignore tiny probabilities in daily life, mugging or no mugging.
  *   **C.** I don't buy the lottery, but the mugging case worries me more. (I treat them differently).

  ### 8. The Contract
  The mugger produces a contract signed by "The Universe" guaranteeing the payout. It looks official. You still can't verify it.
  *   **A.** I don't pay. A signature doesn't change the prior probability of the claim.
  *   **B.** I don't pay. I have a standing rule not to update on arbitrary verbal/written claims.
  *   **C.** I pay. It's enough evidence for me.

  ***

  ## The Scoring Key

  Grab a pen. Count how many **A**s, **B**s, and **C**s you selected. Then, read the profiles below to find your match.

  ### Most people will land in one of these five buckets:

  **1. The Bullet-Biter (Mostly A's)**
  *   **Your Position:** Shut Up and Multiply.
  *   **The Vibe:** You take expected utility maximization seriously. If the math says pay, you pay. You likely believe utility is unbounded and that probabilities should be updated strictly on evidence, regardless of how "magic" the claim sounds.
  *   **Coherence Check:** If you answered **B** on Question 6 (Specks), you are inconsistent. You can't be an unbounded utilitarian who rejects the speck calculation.

  **2. The Hansonite (Mostly B's, specifically Q1, Q3, Q8)**
  *   **Your Position:** The Probability Response.
  *   **The Vibe:** You believe that as the stakes get higher, the prior probability of the claim must get lower *at least as fast*. You aren't saying the utility is capped; you're saying the chance of the mugger being telling the truth is effectively zero.
  *   **Coherence Check:** If you answered **B** on Question 3 (Magic Trick), you are consistent (the trick wasn't enough evidence). If you answered **A** on Q3 but **B** on Q1, you believe evidence can overcome the prior penalty.

  **3. The Bounded Utilitarian (Mostly B's, specifically Q6)**
  *   **Your Position:** Bounded Utilities.
  *   **The Vibe:** You think numbers stop mattering after a certain point. 3^^^3 isn't "more bad" than 3^^^2 in a way that action-guides you. You reject the mugging because the utility function caps out, not because the probability is zero.
  *   **Coherence Check:** If you answered **A** on Question 1 (Classic Mugging), you are in an **Unoccupied Leaf**. Very few people claim to have bounded utility but still pay the mugger. This is usually incoherent (why pay if the utility is capped?).

  **4. The Policy Defender (Mostly C's)**
  *   **Your Position:** The Policy Response.
  *   **The Vibe:** You don't calculate case-by-case. You have a standing rule: "I do not update on arbitrary verbal threats" or "I do not give money to strangers." You accept this might lose you some expected value on average, but it protects you from exploitation.
  *   **Coherence Check:** If you answered **C** on Q1 but **A** on Q2 (Reward), you have an **Unoccupied Leaf**. A policy against muggers should generally apply to both threats and promises, or you're just loss-averse, not following a policy.

  **5. The Soaking Saturated (Mostly B/C on Q5)**
  *   **Your Position:** The Soaking Response.
  *   **The Vibe:** You might theoretically agree with the math, but you've already allocated your resources to the most credible high-stakes cause you know (e.g., x-risk). The mugger is just a less credible version of what you're already funding. There's nothing left to collect.
  *   **Coherence Check:** If you answered **A** on Q5 (Borrow money), you aren't a Soaker; you're a Bullet-Biter.

  ### The "Glitch in the Matrix" Section (Incoherent Combinations)

  If your answers don't fit the buckets above, check these specific combinations. These are positions almost nobody defends because they tend to collapse under scrutiny.

  *   **The "Magic Exception" (Q1=B, Q7=C):** You ignore tiny probabilities in the mugging case, but you admit you *shouldn't* ignore them in normal life (or vice versa).
      *   *Verdict:* **Incoherent.** You are abandoning Expected Utility maximization *only* when it gives you a result you dislike. This is "motivated stopping." You either trust the math everywhere or nowhere.
  *   **The "Reward Asymmetry" (Q1=B, Q2=C):** You refuse the threat but accept the reward.
      *   *Verdict:* **Unattractive.** This implies loss aversion is driving your decision theory more than expected utility. It's a common human bias, but hard to defend as a rationalist principle.
  *   **The "Evidence Ignorer" (Q3=B, Q8=A):** You would pay after the sky turns green (Q3), but a contract from the Universe (Q8) doesn't change the prior (Q8)?
      *   *Verdict:* **Unexplored/Inconsistent.** Usually, if a green sky moves you, a verified contract should too. If neither moves you, you're a Policy Defender. If both move you, you're a Hansonite. Picking one but not the other suggests you haven't thought through your evidence threshold.

  ### The Blind Spot

  **Can we separate the Hansonite from the Policy Defender?**
  Honestly? Not perfectly.
  *   **The Hansonite** says: "I assign a low probability to this claim."
  *   **The Policy Defender** says: "I assign a low probability to this *class* of claims as a rule."
  In practice, they act the same. Question 8 attempts to pull them apart (Hansonites update on the *content* of the evidence; Policy Defenders update on the *type* of interaction). If you scored high on both B and C, you likely straddle this line. You use a policy *because* you trust the Hansonian math, which is a perfectly valid hybrid position.

  ### Final Result: Do You Actually Abandon EU?

  Look at **Question 7**.
  *   If you answered **A**: You are a Pure Expected Utility Maximizer. You are rare.
  *   If you answered **B**: You have abandoned Expected Utility maximization for *all* low-probability events. You are a pragmatic skeptic.
  *   If you answered **C**: You have abandoned Expected Utility maximization *only* for mugging-shaped cases.
