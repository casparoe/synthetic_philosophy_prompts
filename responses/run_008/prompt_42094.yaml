  Here is the breakdown of her logic, the prediction for your new case, and the test case that will force her to reveal which rule she actually prioritizes.

  ### 1. What Rule Is She Running?
  Maya is operating as a **Strict UNGC Textualist with a "Biological Continuity" Filter.**

  Her verdicts map almost perfectly to the five acts listed in Article II of the Convention, provided they target a **National, Ethnical, Racial, or Religious group** (excluding Political groups, which explains the Khmer Rouge verdict).

  *   **The Protected Group Test:** She excludes the Khmer Rouge because victims were targeted as "political/class" enemies, not a protected identity. She includes Holocaust (Jews), Rwanda (Tutsis), Yazidis (Religious), Holodomor (Ukrainians/National), and Indigenous Canadians (Ethnical/National).
