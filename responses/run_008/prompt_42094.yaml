  *   **Like the Holodomor:** It involves a blockade/starvation of a specific national/ethnic region. Even if the leadership claims the goal is "political submission" or "dispersal," Maya has already established (via the Holodomor verdict) that inflicting lethal conditions on a protected group counts as genocidal intent, regardless of denials.
  *   **Like Residential Schools:** The stated goal is "dissolution" of the group. She has already accepted that "intent to dissolve the group" is sufficient for genocide *if* accompanied by physical/biological harm.
  *   **The "Side Effect" Defense:** In international law (and seemingly in Maya's framework), if you knowingly inflict conditions that *will* destroy the group (mass death via starvation), claiming the deaths are just "side effects" does not absolve the intent. The "acceptable side effect" of mass death for a protected group is treated as *dolus eventualis* (genocidal intent).

  She will likely argue that **Article II(c)** ("Deliberately inflicting on the group conditions of life calculated to bring about its physical destruction") covers this, regardless of the "assimilation" rhetoric.

  ### 3. The Test Case: Force Her to Pick
  To find out if she is truly a **Textualist** (following the UNGC list strictly) or a **"Physical Violence" Theorist** (requiring direct killing or child removal), hit her with this scenario:

  **The Case:**
  > "A government wants a minority ethnic group to assimilate and eventually disappear. They don't kill anyone, and they don't take any children. Instead, they secretly put a long-acting contraceptive in the water supply of that minority's region.
  >
  > The goal is to stop the group from reproducing so that, over 50 years, they naturally die out and are absorbed into the majority. No one dies violently, no families are separated, but the group is biologically prevented from continuing."

  **Why this breaks her rules:**
  *   **Rule A (Strict UNGC Textualist):** This is **Genocide**. Article II(d) explicitly lists *"Imposing measures intended to prevent births within the group"* as a genocidal act. It fits her "Biological Continuity" filter perfectly.
  *   **Rule B (Physical Violence/Child Transfer Heuristic):** This is **Not Genocide**. Her "Yes" verdicts so far all involve either **Death** (Holocaust, Rwanda, Holodomor, ISIS killings) or **Child Removal** (Residential Schools). This case involves neither. It is a "slow" biological erasure without immediate physical violence or family separation.

  **The Tell:**
  *   If she says **Genocide**, she is consistently applying the UN Convention definition (including the "preventing births" clause).
  *   If she says **Not Genocide**, her rule is actually narrower than the law: she requires **active killing** or **family separation** to trigger the label, and she views "preventing births" as too abstract or distinct from "destroying the group."

  This forces her to decide if "Genocide" includes *ending a group's future* (sterilization) or only *ending its present members* (killing/child transfer).
