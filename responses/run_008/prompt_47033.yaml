  I've been around the rationalist blogs since the Overcoming Bias days, long enough to have watched the community default drift from vague mysterianism toward something like Dennett's program: consciousness as the brain's user interface, a model of a model, with the felt quality of experience explained away rather than explained. I found Frankish's 2016 target article in the Journal of Consciousness Studies persuasive, and I'd describe myself as a strong illusionist: there are no qualia as standardly conceived, and what exists are physical and functional states that introspection misrepresents as bearing intrinsic, directly accessible qualitative properties. So I was annoyed and then worried when a friend — a Chalmers fan, deliberately biding his time — produced an argument that seems to show that strong illusionism either refutes itself or explains nothing. I can't find the clean exit, and I'd like a serious diagnosis rather than the usual comments-section hand-waving.

  The argument:

  (1) Strong illusionism: no phenomenal properties, as standardly conceived, are instantiated. Instead, introspection systematically misrepresents our physical and functional states as having them. Call the misrepresentation the illusion of phenomenality.

  (2) An illusion is not a mere error or false belief; it is a way things seem to the subject. To be under the illusion that your states are phenomenal, it must seem to you that they are phenomenal.

  (3) The illusion does its explanatory work — explaining why we talk about qualia, why the hard problem feels hard, why the zombie thought experiment gets any grip — only if the subject is introspectively aware of the seeming itself, and not merely causally driven to produce qualia-talk.

  (4) The awareness of the seeming is either phenomenal or non-phenomenal; there is no third option.

  (5) If it is phenomenal, then at least one phenomenal property is instantiated — that of the awareness constituting the illusion — and strong illusionism is false.

  (6) If it is non-phenomenal, then the seeming that things are qualitative does not itself seem like anything from the inside; but then it cannot explain the very datum it was posited to explain, namely that consciousness presents itself to the subject as intrinsically qualitative. The illusion of phenomenality becomes a state the subject is in while being in no way aware of it — a hidden cause of error-like reports, which is not an illusion at all.

  (7) So strong illusionism is either false or explanatorily empty: it refutes itself or explains nothing.

  What makes this harder for me than the standard why-does-it-seem-like-anything jab is that my friend claims the template is completely general. Run it on moral error theory, he says: the error theorist holds that our moral judgments misrepresent natural facts as categorical reasons; for the theory to do any work the subject must be aware of the misrepresentation; that awareness is either morally loaded or it isn't; if it is, the theory is false, if it isn't, the misrepresentation is a hidden state that can't explain why normativity presents itself as binding. He concludes that he has a master argument against every error theory ever proposed. Since error theories are not, as a class, standardly regarded as self-refuting, I take this as evidence that something in the template is broken — but each candidate repair I try seems to cost me something I actually believe.

  I'll be honest about my leanings, since half-measures will get half-answers. I'd most like to keep (1) — rejecting phenomenal properties as standardly conceived is, for me, the entire point of the view, the thing Dennett was reaching for in his qualia paper back in 1988. I suspect the trouble lies in (2) or (3): the word seems there can be read heavily, as phenomenally loaded, or lightly, as a matter of introspective classification — the way the lines seem unequal in the Müller-Lyer illusion, which commits us to no intrinsic qualitative properties over and above representational states. If seems is heavy throughout, (2) is simply false by my lights; if light, then (6)'s demand that the illusion explain a datum that is qualitative from the inside quietly re-imposes the heavy reading, and the argument equivocates somewhere between (2) and (6). But if my repair is just to insist on the light reading, my friend will say I have changed the subject rather than answered him — which is uncomfortably close to the accusation realists make against illusionism as a whole, so I can't tell whether I've dissolved the argument or merely relocated it one level up. It's also possible the real cost is at (4): the illusionist can, with Frankish, retain a deflated notion of a phenomenal property — a functional surrogate doing the work of the real thing — which breaks the dilemma at the price of admitting that when I say this pain is qualitative I am, strictly speaking, speaking the idiom of a useful fiction. And I notice I keep flinching away from the possibility that (6) is simply true and must be denied anyway, which would mean the only datum is reports and dispositions — that there is nothing it is like to be me, I merely believe there is — the bullet everyone assures me is repugnant.

  What I want from you: name the step to reject or qualify, explain why that step sounded fine when I first heard the argument, and then price the alternatives honestly. Don't just tell me which step falls; tell me what each candidate rejection commits me to, including the ones I'd rather not pay, and tell me whether my light/heavy diagnosis of the word seems is the actual flaw or just the first draft of one.

