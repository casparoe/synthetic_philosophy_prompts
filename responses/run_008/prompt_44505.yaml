  *(Refining the "Unreliable Narrator" point: The user thinks the narrator is unreliable because they claim access they don't have. But in epiphenomenalism, the report is *true*, just causally disconnected. This is a crucial distinction. An unreliable narrator says "I was home" when they were out. An epiphenomenal narrator says "I was home" and *was* home, but the 'feeling' of being home didn't make them say it. The brain did. This is more like a 'Possessed Narrator' or 'Automaton Narrator'.)*

