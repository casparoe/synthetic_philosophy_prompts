          *   Qualia = The Tone/Voice (the "feel" of the scene).
          *   Epiphenomenalism = The Tone does not influence the Plot.
          *   Judgment = The Character commenting on the Tone.
          *   Paradox = How does the Character know the Tone exists if the Tone didn't make them speak?

  5.  **Developing the "Residue Report" (The Critical Analysis):**
