answer: |-
  This is one of the sharpest intersections of craft and metaphysics I've seen in a long time. Your intuition is not just "vibes"; you have correctly identified the structural isomorphism between the Paradox of Phenomenal Judgment and the problem of Narrative Authority.

  However, your specific mapping to the "Unreliable Narrator" needs a slight calibration. If you get that wrong, you risk turning a metaphysical horror story into a psychological thriller about a liar.

  Here is the translation, the residue report, and the strategic advice for your novel.

  ***

  ### Part 1: The Translation (Claim by Claim)

  Let's translate the philosophy of mind into the mechanics of fiction.

  **1. Physicalism / Materialism = The Manuscript**
  In a novel, the only thing that objectively exists is the text on the page. The ink, the pixels, the syntax. In materialism, the only thing that objectively exists is the physical brain state.
  *   **Philosophy:** Neurons firing.
  *   **Craft:** The words actually printed on the page.

  **2. Qualia = The "Voice" or "Tone"**
  Qualia are the subjective *feel* of experience (the redness of red, the hurt of pain). In fiction, this is the *Voice*. It's not the plot points; it's the *texture* of the narration. It's the difference between "He died" and "He expired like a candle."
  *   **Philosophy:** The subjective experience.
  *   **Craft:** The emotional resonance that the reader feels but isn't strictly in the plot mechanics.

  **3. Epiphenomenalism = Voice Without Agency**
  Epiphenomenalism says qualia exist but don't *do* anything. The brain causes the qualia, but the qualia don't change the brain.
  *   **Translation:** The Tone exists, but it doesn't drive the Plot. The words on the page (Manuscript) generate a feeling of sadness (Voice), but that sadness cannot go back and change the words on the page. The text is fixed; the "feel" is just smoke rising off it.

  **4. Phenomenal Judgment = The Narrator's Testimony**
  This is when the character says, "I am sad," or "This hurts." It is a speech act within the text.
  *   **Translation:** The Narrator stating, "I am telling this story in my own voice."

  **5. The Paradox of Phenomenal Judgment = The Ventriloquist Problem**
  Here is the crux. If the Voice (qualia) has no agency, it cannot cause the Narrator to speak. Only the Manuscript (brain states) can cause the speech.
  *   **The Paradox:** So why does the Narrator say, "I am speaking my truth"? If the Manuscript wrote the lines, and the Voice was just a byproduct, the Narrator should be saying, "I am reading lines written by physics." But they don't. They insist, "I feel this."
  *   **The Horror:** It implies the Narrator is claiming authorship of a script they didn't write, about feelings that didn't influence the script, yet they are *correct* about the feelings. It is a miraculous coincidence that the text matches the tone, given that the tone didn't write the text.

  ***

  ### Part 2: The Residue Report

  You asked for honesty on where this mapping holds and where it breaks.

  **What Translates Cleanly:**
  *   **The Alienation of Agency:** You have perfectly captured the horror of epiphenomenalism. It is the horror of being a narrator who believes they are choosing their words, only to realize they are merely the vocal tract through which the text passes. This is a potent metaphor for your neuroscientist's crisis.
  *   **The "As-If" Structure:** In fiction, we accept that a character acts *as if* they have free will. In epiphenomenalism, we must accept humans act *as if* qualia matter. The structural gap is identical.

  **What You Had to Distort (The Danger Zone):**
  *   **"Unreliable Narrator" vs. "Dispossessed Narrator":** This is the critical distinction.
      *   An **Unreliable Narrator** (e.g., Humbert Humbert) gives a report that *conflicts* with the truth. They say "I am good," the text shows they are bad.
      *   In **Epiphenomenalism**, the report is *accurate*. When the character says "I am in pain," they *are* in pain. The qualia exist! The problem is not that they are lying; it's that the *causal link* is severed.
      *   **The Distortion:** If you frame her as an "Unreliable Narrator," the reader will think she is mistaken or lying about her experience. But the philosophy says she is *right* about the experience, just wrong about *why* she's reporting it.
      *   **Better Craft Term:** **The Puppet Narrator.** Or **Free Indirect Discourse without a Consciousness.** She is reporting data she has access to, but she didn't generate the report.

  **What Has No Counterpart (The Missing Piece):**
  *   **The Ontological Ghost:** In fiction, the "Voice" is made of words. It is physical (ink/pixels). In philosophy, Qualia are *non-physical*. They are ghosts. In your novel, you can depict the "Voice," but you can't depict the "Non-physicalness" of it easily.
  *   **The Hard Stop:** In a novel, if the narrator stops speaking, the book ends. In epiphenomenalism, if the qualia vanish (a "Philosophical Zombie"), the person keeps walking and talking exactly the same. There is no narrative equivalent for a character who keeps narrating perfectly after their "inner life" is deleted, because in fiction, the narration *is* the inner life.

  ***

  ### Part 3: The Flip (What Philosophers Should Envy)

  You asked if there is stuff in *your* vocabulary philosophers should envy. Yes. There is one specific tool in narrative theory that solves the Paradox of Phenomenal Judgment better than philosophy does: **Dramatic Irony.**

  Philosophers struggle with the Paradox because they demand the *character* solve it. They want the mind to explain how it knows itself.
  But a Novelist knows that **the Reader knows more than the Character.**

  *   **The Philosophical Stalemate:** "How can I know I have qualia if they don't cause my knowledge?"
  *   **The Narrative Solution:** "You don't know. *I* (the Author/Reader) know."

  In a novel, we can have a character who is an epiphenomenalist zombie, and the *reader* perceives the tragedy of it. The character says, "I feel love," and the reader sees the mechanical strings pulling the mouth.
  Philosophers are trapped inside the first-person perspective (the "I"). Novelists operate in the third-person omniscient (the "God view").
  *   **The Insight:** The Paradox of Phenomenal Judgment is only a paradox from the inside (First Person). From the outside (Third Person), it looks like simple mechanics.
  *   **Your Advantage:** You can show the audience the machinery *while* the character insists they are the engine. You don't need to solve the paradox; you need to *stage* it. You can give the reader the "God view" of the neuroscientist's brain firing while she insists she is choosing her words. That creates a specific kind of subtext: **The Subtext of Determinism.**

  ***

  ### Part 4: Strategic Advice for the Novel

  Should you frame this as an Unreliable Narrator story?

  **No.** If you frame it as "Unreliable," you make it a mystery about *truth*. (Is she crazy? Is she lying?)
  Epiphenomenalism is not a mystery about truth; it is a horror story about *authorship*.

  **Do this instead:**
  Frame it as a **Loss of Narrative Authority.**

  1.  **The Setup:** She starts with standard First-Person Interiority. "I felt the pain." "I chose the red pill." The voice is authoritative.
  2.  **The Glitch:** As her faith in materialism crumbles, shift the **Free Indirect Discourse**. Start separating her *reported thoughts* from the *narrative description of her body*.
      *   *Example:* "I decided to lift my hand. [New Paragraph] The hand rose, obeying the electrochemical gradient, indifferent to the decision."
  3.  **The Climax:** She realizes her testimony is valid but empty. She can describe the qualia perfectly, but she is describing a painting she didn't paint, hanging in a room she didn't build.
  4.  **The "Unreliable" Twist:** The unreliability isn't that she's wrong about the *qualia*. It's that she's wrong about the *causality*. She thinks she is the **Author** of her speech. She discovers she is the **Microphone**.

  **Why this works better:**
  If you call her an Unreliable Narrator, the reader waits for the moment she admits she was lying.
  If you call her a **Ventriloquized Narrator**, the reader waits for the moment she realizes the Ventriloquist is Physics.

  **The "Vibes" Check:**
  Your pattern-matching was correct. The Paradox of Phenomenal Judgment *is* a problem of Narrative Authority. It asks: "Who is speaking?"
  *   Philosophy answers: "Physics is speaking, pretending to be Mind."
  *   Fiction answers: "The Author is speaking, pretending to be Character."

  Your neuroscientist is discovering that she is a Character who has read the manuscript and realized the Author isn't her. That is a devastating, novel-worthy realization. Don't dilute it by making her "unreliable" in the traditional sense. Make her **accurate but dispossessed.**

  That is the story.
