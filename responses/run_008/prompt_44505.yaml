prompt: |-
  So here's my situation: I write novels for a living, and I've somehow gotten deep into a philosophy rabbit hole after a character I'm writing -- a neuroscientist who's losing her faith in materialism -- started mouthing off about things I only half understand. I did my reading, and I think I actually get epiphenomenalism now: consciousness as this byproduct that gets generated by brain states but doesn't push back on anything, like smoke coming off an engine without driving the car. But then I hit the thing people call the paradox of phenomenal judgment and my whole novelistic brain lit up, because it sounds EXACTLY like a problem I deal with professionally and I can't tell if that's a real insight or me pattern-matching where I shouldn't.

  Here's the translation I want, and I want it done honestly. Take epiphenomenalism and the paradox of phenomenal judgment and restate the whole thing in the vocabulary I actually work in: narrators, narration, unreliable narrators, free indirect discourse, show-don't-tell, subtext, the fact that a first-person narrator never actually IS the author even when the voice sounds identical. The way I currently see it: the paradox is that if qualia are causally inert, then my character's sincere first-person reports about her own experience -- "the pain feels sharp, I know what red looks like" -- weren't caused by the experiences themselves, only by the underlying brain states, which makes her a kind of unreliable narrator about her own inner life, one whose testimony happens to track something she never had access to. The felt authoritativeness of introspection would be like a narrator who insists the story is being told in her own words when every word was actually written by someone else. But I don't trust myself to know which parts of that mapping are doing real work and which are just vibes.

  So give me the full translation, claim by claim, and then the residue report I keep hearing philosophers demand: what translates cleanly, what I had to distort to make it fit, and whether anything in the philosophy has no counterpart at all in how narrative and narration actually work. And then flip it -- is there stuff in MY vocabulary that the philosophers should be envying here, or is the narrator analogy just decorating a problem that's already about causation and doesn't care about storytelling at all? I ask because I'm deciding whether my neuroscientist's crisis should be framed as a story about an unreliable narrator, or whether that framing would quietly smuggle in assumptions that make the philosophy look easier than it is. If it helps, assume I'm fluent in craft vocabulary but self-taught in philosophy -- I've read the standard intro stuff but I'll lose you if you get too technical, so carry the technical parts on the back of the novelist vocabulary wherever you can.
