prompt: |-
  Hi — I teach a final-year political philosophy module and I'm writing the resit paper this summer. You're helping as someone who's taught this literature for years, so please actually think it through before drafting: do a quick brainstorm first and list the three or four moves a top answer could make on the problem below, then decide which one your model answer should take, and say why you picked it.

  The question needs to be on luck egalitarianism, but it can't be passable by reciting the brute luck / option luck distinction plus a list of standard complaints. What I want it to centre on is second-order luck: luck in the capacities that are supposed to do the responsibility-tracking. Heres the case I want candidates to chew on — sharpen it if you like, and add one more case of your own invention:

  Rhona grew up in a family where impulsiveness was the house style — call it upbringing, call it genes, she now takes terrible gambles. She's prudent about nothing, she knows it, and she bets anyway. Her twin, raised elsewhere, bets once on a longshot and loses. Both end up broke. Ask candidates whether luck egalitarianism can give the twins different compensation without either (a) smuggling in a capacity for responsibility that itself looks like brute luck, or (b) compensating everyone regardless of choices, at which point the 'luck' part has stopped doing any work.

  Deliverables: the exam question (90 minutes), a model answer of about 700 words, and a marking scheme totalling 25 marks, with five must-hit points, marks for each, and a one-line note per point on how candidates typically fluff it. At least one must-hit point must be an original move, not exegesis — e.g. sketching what a non-circular cut between responsibility-relevant and responsibility-irrelevant influences would have to look like.

  Then append a short self-critical note: say where the marking scheme is contestable — which must-hit point a Cohenian or a relational egalitarian would call underweighted or biased, and what would make you redistribute the marks. If the model answer leans on a particular reading of Dworkin or of Anderson's critique, flag that rather than presenting it as neutral.

  British English throughout. Don't ask candidates for bibliographies or exact essay titles, and don't name-drop works you cant vouch for — refer to positions and arguments instead.
