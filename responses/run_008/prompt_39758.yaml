answer: |-
  ### Brainstorming Moves for a Top Answer

  Before drafting the paper, here are the four strategic moves a distinction-level candidate should consider:

  1.  **The Regress Argument:** Argue that any capacity for responsibility (willpower, risk-assessment) is itself distributed by brute luck. Therefore, holding Rhona responsible for her impulsiveness is unjust because she didn't choose her capacity for prudence. This leads to the conclusion that luck egalitarianism collapses into strict equality.
  2.  **The Epistemic/Institutional Defence:** Argue that while metaphysical responsibility is impossible to isolate, institutions must draw a line for practical reasons. We compensate Rhona not because she is metaphysically blameless, but because screening for 'true' capacity is too costly or intrusive.
  3.  **The Valuation of Disadvantage:** Shift focus from 'responsibility' to 'disadvantage'. Rhona is disadvantaged by her lack of capacity regardless of whether she 'chose' it. The twin is not disadvantaged in the same way. This sidesteps the responsibility trap by focusing on the currency of egalitarianism.
  4.  **The Non-Circular Cut (Original Move):** Propose a criterion that distinguishes between *constitutive* luck (who you are) and *circumstantial* luck (what happens to you), arguing that responsibility attaches only to the exercise of capacities within a normal range, without requiring the agent to have chosen those capacities. This attempts to stop the regress without abandoning responsibility-tracking.

  **Decision for Model Answer:**
  I will anchor the model answer in **Move 4 (The Non-Circular Cut)**.
  **Why:** For a final-year resit, simply reciting the regress problem (Move 1) is too easy; it shows comprehension but not construction. Move 2 is too pragmatic for a philosophy module focused on normative justification. Move 3 is strong but risks drifting into sufficiencyarianism. Move 4 demonstrates the ability to *repair* the theory under pressure, which distinguishes a resit candidate capable of passing at a high level from one merely scraping through. It allows the answer to engage with the prompt's specific demand to avoid circularity.

  ***

  ### Exam Question (90 Minutes)

  **Question 1**

  Luck egalitarianism aims to compensate for brute luck while holding individuals responsible for option luck. However, critics argue that the capacities required to exercise responsibility (such as willpower or risk-assessment) are themselves distributed by brute luck.

  Consider the following case:
  **Rhona** grew up in a family where impulsiveness was the norm—whether due to upbringing or genetics is unclear. She knows she is impulsive, admits she should be more prudent, yet consistently takes terrible gambles. She ends up broke.
  **Rhona's Twin**, raised in a cautious household, possesses similar genetic predispositions but was trained to suppress them. She bets once on a longshot, loses, and ends up broke.

  Now consider a second case:
  **Sam** possesses a genetic predisposition for exceptional risk-assessment. He takes gambles identical to Rhona's but wins due to this natural talent. He ends up wealthy.

  Answer the following:
  1.  Can luck egalitarianism compensate Rhona without compensating her Twin, without smuggling in a capacity for responsibility that itself looks like brute luck?
  2.  Does Sam's success represent option luck or brute luck, and what does this imply for the theory's stability?
  3.  Sketch a non-circular criterion for responsibility that avoids collapsing into strict equality while acknowledging second-order luck.

  ***

  ### Model Answer

  The central tension here is the problem of second-order luck: if the capacities required to make responsible choices are themselves luck-laden, then tracking responsibility seems to track brute luck anyway. A successful luck egalitarian response must distinguish between the possession of capacities and the exercise of agency without triggering an infinite regress.

  Regarding Rhona and her Twin, the intuitive luck egalitarian verdict is to compensate Rhona but not the Twin. Rhona's impulsiveness appears to be a brute luck disadvantage (constitutive luck), whereas the Twin's loss stems from option luck (a calculated risk). However, the prompt notes Rhona *knows* she is impulsive. If she acts against her better judgment, is this not option luck? The difficulty is that the willpower required to act on that judgment is itself unequally distributed. If we deny compensation because she 'chose' to gamble, we ignore that her capacity to choose otherwise was compromised by brute luck. If we grant compensation, we risk compensating everyone who claims 'I couldn't help it', rendering the luck/choice distinction workless.

  To resolve this, we must look to Sam. Sam's success is clearly brute luck in origin (genetic talent), yet it manifests through option luck (gambling). If luck egalitarianism taxes Sam's winnings to compensate Rhona, it admits that natural talents are common assets. But if it leaves Sam wealthy because he 'took the risk', it privileges those lucky enough to have good risk-assessment capacities. This suggests that 'option luck' is often just 'brute luck successfully navigated'.

  Therefore, the theory cannot rely on a metaphysical notion of 'could have done otherwise'. Instead, it must adopt a non-circular cut based on **reasons-responsiveness within a normal range**. We do not ask if Rhona chose her capacities (she didn't). We ask if her capacities fell below a threshold of normal social functioning due to brute luck. Rhona's impulsiveness constitutes a disability in the currency of advantage; she lacks the normal capacity for prudence. Her Twin possesses the normal capacity but misused it. Sam possesses a superior capacity.

  On this view, compensation is owed to Rhona not because she is blameless in a metaphysical sense, but because she is disadvantaged in her capacity to engage with risk compared to the social norm. The Twin is not disadvantaged in capacity, only in outcome. Sam is advantaged in capacity. This avoids circularity because it does not require the agent to be responsible for their capacities; it only requires that society sets a baseline of normal functioning. Capacities below the baseline are brute luck disadvantages (compensatable); capacities above or at the baseline are the ground for responsibility (not compensatable).

  This stops the regress. We do not ask if she chose her baseline capacity. We accept the baseline as a normative fact of social cooperation. Rhona falls below it; the Twin does not. Thus, luck egalitarianism can distinguish them without claiming Rhona is metaphysically free, and without compensating the Twin who merely suffered a standard loss within the normal range of agency. The 'luck' part continues to do work by identifying the source of the capacity deficit, while the 'egalitarian' part ensures only deficits relative to the norm are neutralised.

  ***

  ### Marking Scheme (25 Marks Total)

  **1. Identification of the Second-Order Luck Problem (5 marks)**
  *   **Requirement:** Clearly articulate that capacities for responsibility (willpower, prudence) are themselves distributed by brute luck, threatening the coherence of the brute/option luck distinction.
  *   **Common Fluff:** Candidates define brute and option luck correctly but fail to explain why the *capacity* to distinguish them is problematic.

  **2. Analysis of Rhona vs. Twin (5 marks)**
  *   **Requirement:** Discuss the nuance of Rhona's knowledge of her impulsiveness. Acknowledge that treating this as option luck ignores the brute luck distribution of willpower.
  *   **Common Fluff:** Candidates simply assert Rhona is responsible because she 'knew better', ignoring the prompt's constraint about the origin of her impulsiveness.

  **3. Analysis of Sam's Case (5 marks)**
  *   **Requirement:** Identify that Sam's success blurs the line between skill and luck. Acknowledge that treating his winnings as purely 'option luck' privileges natural talent unfairly.
  *   **Common Fluff:** Candidates treat Sam's win as straightforward option luck without questioning the genetic advantage underlying his risk assessment.

  **4. The Collapse Objection (5 marks)**
  *   **Requirement:** Explain the risk that acknowledging second-order luck forces the theory into strict equality (compensating everyone) or abandoning responsibility tracking entirely.
  *   **Common Fluff:** Candidates state the theory collapses but do not explain the mechanism (i.e., that all choices become traceable to prior luck).

  **5. Original Move: The Non-Circular Cut (5 marks)**
  *   **Requirement:** Sketch a criterion (e.g., normal range/reasons-responsiveness) that allows responsibility tracking without requiring agents to choose their capacities. Must avoid circularity.
  *   **Common Fluff:** Candidates propose 'society decides' or 'we can't know', which are epistemic surrenders rather than normative solutions.

  ***

  ### Self-Critical Note

  This marking scheme is contestable, particularly regarding **Point 5**. A strict **Cohenian** might argue that any 'normal range' cutoff is arbitrary and still masks brute luck, thereby underweighting the impossibility of the task. They would argue full marks should only be awarded for acknowledging the theory's ultimate failure to resolve the regress. Conversely, a **Relational Egalitarian** would argue that Point 5 is biased towards 'luck neutralisation' rather than social relationships; they would redistribute marks towards a critique of the whole responsibility-tracking framework, arguing that asking whether Rhona 'deserves' compensation is the wrong question compared to whether she is treated as an equal.

  Furthermore, the **Model Answer** leans heavily on a **semi-compatibilist** reading of responsibility (focusing on reasons-responsiveness rather than ultimate control). It presents the 'normal range' solution as viable without fully engaging with the objection that setting the norm is itself a political act subject to luck. I have flagged this here to ensure markers do not penalise candidates who challenge the model answer's theoretical commitment, provided they justify their alternative rigorously.
