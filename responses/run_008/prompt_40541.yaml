prompt: |-
  Write me a short story (roughly 600-900 words) about futarchy. I've gotten kind of obsessed with Robin Hanson's whole idea lately — "vote on values, but bet on beliefs," where elected representatives just define a national-welfare metric and prediction markets actually decide which policies get adopted — and I want fiction that engages with the actual mechanism, not another generic "the algorithm rules us now" dystopia.

  Setting suggestion (tweak as you like): a mid-sized city that's been futarchic for about a decade. Every major policy goes through a conditional prediction market, and the markets settle against a "civic flourishing index" — a composite of economic output, health metrics, and an annual survey where a random sample of citizens rate their own lives. The story centers on one trader, someone with strong values and a decent track record, who notices a way the index itself can be gamed — Goodhart-style, e.g. the survey sample can be nudged, or one of the health metrics tracks something that doesn't actually track wellbeing. Say there's a proposal on the ballot-market to privatize the riverfront parks or whatever, and she becomes convinced the pro-policy side will win the market for reasons that have nothing to do with the policy actually being good.

  Here's the tension I actually care about: she can see the exploit, but profiting from it (or moving the market with her insight) requires betting hard on a policy she believes will harm the city — and the whole futarchist constitution says markets get the final word precisely because traders are supposed to put money where their beliefs are, not their values. So is dumping her savings into the pro-policy side a betrayal of everything she cares about, or exactly the discipline the system demands? Please let the ending stay genuinely unresolved — no tidy markets-bad or markets-good message.

  Also, small request: no wisecracking AI traders or crypto-bro caricatures, I've seen enough of those. I want her to feel like a real person with a mortgage.

  After the story, add a brief structured summary as a JSON object with these fields: "title" (the story's title), "protagonist" (one line on who she is), "mechanism_gimmick" (one or two sentences describing the specific exploit of the index), "tension" (the values-vs-beliefs dilemma in a single sentence), "ending_stance" (one of "pro-futarchy", "anti-futarchy", or "ambiguous", plus a one-clause justification), and "best_line" (one sentence from the story you're proudest of). And dont put the JSON in a code block, just raw is fine.
