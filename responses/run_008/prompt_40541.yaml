answer: |-
  The glow of the triple-monitor setup was the only light in Mara's home office, casting long shadows over the stack of mortgage statements on the desk. Outside, Oakhaven slept under the hum of the futarchic grid. Ten years since the transition. Ten years of letting the markets decide what was true, while the elected council merely defined what was good.

  On the center screen, Proposition 88 blinked: *Riverfront Leisure Trust Privatization.* The policy was simple: sell the public parks to a consortium for development. The metric was the Civic Flourishing Index (CFI), the composite god of this new age. Economic output, health data, and the annual self-reported life satisfaction survey.

  Mara rubbed her eyes. She had a good track record. Her portfolio had paid for this house, for her daughter's tuition, for the safety net that kept her awake at night worrying about maintaining it. She looked at the data streams feeding the conditional markets. The market was asking: *What will the CFI be if Prop 88 passes?* versus *What will the CFI be if it fails?*

  She had found the glitch. It wasn't in the code, but in the human layer. The consortium behind Prop 88 was launching a "Community Wellness Initiative" next month. It offered free premium health tracking and lifestyle coaching to fifty thousand residents. By pure coincidence, the demographic clustering of those eligibles overlapped by eighty percent with the random sample pool used for the CFI life satisfaction survey.

  It was Goodhart's Law made flesh. Once a measure becomes a target, it ceases to be a good measure. The parks would be lost, the riverfront gated, but the survey scores would spike. The market knew efficiency, but it didn't know soul.

  Mara's finger hovered over the keyboard. The rational trade was obvious. Buy shares in "CFI Increase | Policy Pass." The market hadn't fully priced in the survey manipulation yet. If she placed a large order, she would profit handsomely when the metric settled high after the privatization. But under futarchy, liquidity drives decision. Her bet would push the "Pass" price above the "Fail" price. The system would execute the policy because her money said it would work.

  She believed the policy would raise the index. She believed the policy would hurt the city.

  "Vote on values, bet on beliefs," the constitution read. The council had voted that flourishing was good. It was her job to bet on what caused it. But what if her belief was that the cause was a lie?

  If she bet against the policy, she would be betting that the CFI would *not* rise. But she knew it would. She would be lying with her money. She would lose her capital, her credibility, and the policy might still pass because someone else saw the same arbitrage. If she bet with the policy, she validated the exploit. She became the mechanism of the city's decline, funding her own security with the proceeds.

  The mortgage statement on the desk seemed to vibrate. Thirty years fixed. A promise to the future. Was the future the city outside, or the family inside these walls? Robin Hanson's ghost seemed to whisper from the servers: the market doesn't care about your guilt, only your accuracy.

  She opened the trading interface. The cursor pulsed on the *BUY* button for the "Pass" contract. The depth chart showed thin resistance. A moderate order would tip the balance. She could secure her family's finances and adhere to the epistemic discipline the system demanded. She could be a good trader and a bad citizen.

  Or she could burn her savings to send a signal that the market couldn't interpret—a signal of values disguised as a loss. But a loss was just noise. The system would interpret her sacrifice as incompetence, not protest.

  Mara took a breath. The air conditioning hummed. She thought of the riverfront in summer, the kids playing on the grass that would soon be fee-based turf. Then she thought of the bank account that kept the roof over their heads.

  She typed in the volume. The number was significant enough to move the price, enough to ensure the policy passed. Her heart hammered against her ribs, a biological metric no index could capture. She didn't close the window. She didn't lean back. She sat with her finger on the enter key, watching the countdown timer for the market settlement tick down, suspended between the city she loved and the truth she knew.

