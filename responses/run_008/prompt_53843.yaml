answer: |-
  # Joint Statement on the Ethics of Historical Comparison
  **Prepared by the Comparativist (Camp A) and Incommensurabilist (Camp B) Working Groups**

  ### I. Points of Consensus
  *We affirm the following claims as shared ground for further inquiry:*

  1.  **Factual Realism:** We agree that historical facts regarding casualty counts, duration, and methods of violence are discoverable and distinct from moral evaluation. Disagreement over data quality does not justify abandoning the data.
  2.  **Moral Gravity:** We agree that the atrocities in question constitute profound moral evils and that minimizing their significance is itself a moral failure.
  3.  **Instrumental Utility:** We agree that comparison is legitimate and necessary when serving specific institutional ends, such as legal sentencing, reparations allocation, or curriculum time-allocation.
  4.  **Risk of Trivialization:** We agree that "Olympic-style" comparisons (e.g., "Who suffered more?") in public discourse often cause harm to victims' descendants and distract from perpetrator accountability.
  5.  **Shared Goal:** Both camps aim to honor the memory of victims and prevent future atrocities; the dispute is methodological, not motivational.

  ### II. Map of Disagreements
  *The following table isolates the specific propositions where consensus breaks down. Each statement is phrased to be acceptable to the camp holding it as a accurate description of their view.*

  | # | Domain of Disagreement | Camp A (Comparativist) Position | Camp B (Incommensurabilist) Position |
  | :--- | :--- | :--- | :--- |
  | **1** | **The Dignity Constraint** | Ordering atrocities by severity is a neutral moral accounting tool; disrespect arises only from *how* the order is used, not the ordering itself. | Ordering atrocities by severity is inherently reductive; the act of sorting human suffering into a hierarchy inflicts secondary harm on the victims regardless of intent. |
  | **2** | **The Metric Problem** | A non-arbitrary metric is achievable by aggregating dimensions (intent, scale, novelty); moral reality allows for objective weighing of distinct evils. | Any single metric inevitably privileges certain types of pain (e.g., physical over psychological) and bakes in cultural biases; no scale can be morally neutral. |
  | **3** | **The Terminology of 'Rank'** | "Ranking" simply denotes establishing a sequence based on defined criteria (like severity); it does not imply the victims are in competition. | "Ranking" linguistically entails a contest of worth; using the term inevitably signals to the public that some victims matter less than others. |

  ### III. Cruxes and Predictive Cases
  *We identify the following sub-questions as "cruxes." Settling these empirically or conceptually would significantly shift the position of at least one camp. For each, we propose a concrete case and record divergent predictions.*

  **Crux 1: Does ranking-as-such express disrespect?**
  *   **The Question:** Is the harm caused by comparison intrinsic to the act, or dependent on the audience's reception?
  *   **Concrete Case:** A digital archive intended *only* for forensic historians (not public) categorizes genocides into "High Intensity" and "Systematic" tiers based on death toll and bureaucratic organization.
  *   **Camp A Prediction:** Historians will view this as a neutral taxonomy that aids pattern recognition; no disrespect is incurred because there is no public audience to misinterpret it.
  *   **Camp B Prediction:** Even private categorization treats victims as data points; the researchers will inevitably begin to view the "High Intensity" group as more significant, corrupting their future public work.

  **Crux 2: Is any ordering metric non-arbitrary?**
  *   **The Question:** Can we separate moral weight from cultural bias in a scoring system?
  *   **Concrete Case:** A Truth & Reconciliation Commission uses a "Severity Index" (combining death toll, duration, and intent) to prioritize which communities receive state reparations first.
  *   **Camp A Prediction:** The Index will successfully identify the most devastated communities, and recipients will view the prioritization as just and evidence-based.
  *   **Camp B Prediction:** The Index will systematically undervalue communities that suffered cultural erasure over physical death, leading to justified grievances that the metric was biased.

  **Crux 3: Is the dispute about the word 'ranking' or the thing?**
  *   **The Question:** If we ban the word "rank" and use "cluster" or "tier," does the moral objection remain?
  *   **Concrete Case:** A museum exhibit groups atrocities by "Scale of Impact" (Small, Medium, Large) rather than numbering them 1 through 5.
  *   **Camp A Prediction:** Camp B will accept this as a sufficient compromise, acknowledging that grouping avoids the implication of a strict hierarchy.
  *   **Camp B Prediction:** Camp B will reject this as semantics; grouping by scale still implies a linear hierarchy of suffering, so the moral objection remains unchanged.

  ### IV. Analysis of Dispute Nature
  *In the spirit of adversarial collaboration, we assess whether the disagreements in Section II are genuine (conflict over reality/values) or verbal (conflict over definitions).*

  *   **Regarding Row 1 (Dignity):** This is a **genuine** disagreement. It rests on conflicting meta-ethical views about whether human suffering can be objectified without harm. No definition change resolves this.
  *   **Regarding Row 2 (Metric):** This is a **genuine** disagreement. It rests on empirical and philosophical claims about the commensurability of qualitative experiences.
  *   **Regarding Row 3 (Terminology):** This is a **verbal** disagreement. Camp A defines "ranking" as *ordering by criteria*; Camp B defines "ranking" as *implying a contest of worth*. If Camp A agrees to never imply a contest of worth, and Camp B agrees that ordering by criteria is permissible if no contest is implied, the dispute dissolves. The conflict is over the connotations of the label, not the underlying procedure.

  \answer{genuine genuine verbal}
