      *   Conclusion.

  *(Self-Correction on the "Collapse" issue)*: I need to be precise. If Peirce says "The final opinion is determined by the Real," isn't that correspondence? Yes, but Peirce redefines correspondence. It's not Idea-Object mirroring; it's Sign-Object mediation. The counterfactual doesn't collapse into *traditional* correspondence because the access is still mediated by the pragmatic maxim. I will argue this distinction preserves the pragmatist label.

  *(Self-Correction on James)*: James actually addresses similar objections in *Pragmatism*. He talks about "working" over the long run. I need to show why that fails in the 50-year apocalypse scenario or the sprinter scenario specifically. The sprinter case is about *individual* utility vs. *public* fact. James struggles here.

