prompt: |-
  I teach a mid-level ethics course, about 22 students, one 75-minute session, and we're about to hit supererogation -- acts beyond duty. I don't want to lecture the definition at them; I want them to build the concept's structure themselves and then watch it misbehave. Design the session for me.

  Here's the conceptual load I want them to run into, in this order if you can manage it. First, the standard three-part structure: a supererogatory act is one it's permissible not to do, good to do, and worthy of praise for doing. Second, the credit paradox -- if omitting it leaves you blameless, what exactly is the praise tracking? And does praising the one who acted leak a silent criticism onto the one who didn't? Third, the competence wrinkle: if one participant is just better at the relevant skill (think of the difference between a random bystander and a trained lifelier at the beach), does the duty floor rise for them -- and if so, doesn't that threaten the "beyond duty" part of the whole idea? Fourth, the remainder problem: everyone meets duty, nobody's done anything wrong, and the outcome is still bad.

  So I'm imagining something like a staged scenario or role-play with a rulebook that defines duties exactly, plus costly windows of action the rulebook doesn't cover, and outcomes that depend on the uncovered acts -- but you design the actual thing. The students should have to draw the duty line themselves, under some pressure, before they've heard the term supererogation or the definitions. Maybe they play a committee that has to write or amend the rulebook, and every proposed amendment either swallows the optional acts into duty or leaves the remainder sitting there. You could secretly assign one student extra capability in the scenario so the group has to decide whether skill changes obligation -- but make that work mechanically, don't just narrate it.

  Give me: rules, roles, materials, a payoff scheme that doesn't involve real money (tokens, grade things, whatever), a rough minute-by-minute timeline, and a debrief that maps specific moments in the activity onto the four ideas above. Then tell me honestly what will predictably go sideways the first time I run it, and which part of the problem (I suspect the credit paradox) no activity can really reproduce and I'll have to just supply in the debrief.

  Also, don't put the word supererogation anywhere until the last ten minutes -- I want the reveal to land as them realizing they've been living inside a definition they wrote themselves.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **Target Audience:** Mid-level ethics students (approx. 22 students).
      *   **Time:** 75 minutes.
      *   **Topic:** Supererogation (acts beyond duty).
      *   **Pedagogical Goal:** Inductive learning (students build the concept, then see it break) rather than deductive (lecture definition first).
      *   **Conceptual Load (in order):**
          1.  Standard Tripartite Structure (Permissible not to do, Good to do, Praiseworthy).
          2.  Credit Paradox (If omission is blameless, what does praise track? Does praise imply blame?).
          3.  Competence Wrinkle (Does higher skill raise the duty floor?).
          4.  Remainder Problem (Everyone meets duty, outcome still bad).
      *   **Constraint:** Do *not* use the word "supererogation" until the last 10 minutes.
      *   **Mechanism:** Staged scenario/role-play with a rulebook, costly windows of action, and outcome dependency. One student secretly has extra capability.
      *   **Deliverables:** Rules, Roles, Materials, Payoff Scheme, Timeline, Debrief (mapping activity to concepts), "What Will Go Sideways" analysis.

  2.  **Deconstruct the Activity Design:**
      *   *Core Mechanic:* Needs to be a resource allocation or rescue scenario where there's a baseline requirement and an optional "extra" effort that costs the agent something but helps the outcome.
      *   *The "Rulebook":* Needs to be vague enough to allow interpretation but specific enough to create a "duty" baseline.
      *   *The "Secret Capability":* One student needs to be able to do the "extra" thing cheaper or better than others.
      *   *The "Committee":* The class acts as a regulatory body or a team deciding on protocols.
      *   *Payoff:* Needs to simulate "praise" vs. "blame" without real money. Points or "Reputation" tokens work well.

  3.  **Drafting the Scenario: "The Floodwall Committee"**
      *   *Setting:* A town facing a potential flood.
      *   *Task:* Allocate sandbags and monitor the wall.
      *   *Duty:* A minimum number of sandbags placed.
      *   *Supererogatory:* Placing *more* sandbags or staying *longer* than required, at personal cost (study time, comfort).
      *   *Secret Capability:* One student (the "Engineer") knows a trick to place bags faster/effectively.
      *   *Remainder:* Even if everyone does their duty, the flood might still breach if the "extra" isn't done.

      *Refinement:* Let's make it more abstract to avoid getting bogged down in flood physics. Let's use "The Triage Protocol."
      *   *Scenario:* A medical or disaster triage simulation.
      *   *Roles:* Triage Officers.
      *   *Resource:* "Effort Points" (EP).
      *   *Duty:* Save X patients using Y EP.
      *   *Beyond Duty:* Spend personal EP (from a separate pool) to save more.
      *   *Secret:* One officer has a "Specialist" token allowing them to save more for less personal cost.

      *Actually, let's go with a "Safety Inspector" scenario.* It fits the "Rulebook" idea well.
      *   *Scenario:* Factory Safety Inspectors.
      *   *Task:* Inspect machines.
      *   *Duty:* Check the "Red List" items.
      *   *Beyond:* Check the "Gray List" items (takes extra time/effort, prevents rare accidents).
      *   *Secret:* One inspector is a "Veteran" (can check Gray List faster).

      *Let's refine the "Committee" aspect.* The prompt suggests they *write or amend the rulebook*. This is crucial. They need to define what is mandatory vs. optional.
      *   *Activity:* "The Protocol Draft."
      *   *Setup:* Students are a Safety Board. They must write the "Minimum Safety Protocol" (MSP) for a high-risk facility.
      *   *Tension:* Making the MSP too high burns out workers (cost). Making it too low risks accidents (bad outcome).
      *   *The Twist:* There are "Bonus Actions" that prevent disasters but aren't in the MSP.
      *   *The Secret:* One student is assigned the role of "Senior Tech" who can perform Bonus Actions easily. Others find them costly.

  4.  **Developing the Mechanics:**
      *   **Materials:** Handouts (Scenario, Cost Sheet, Voting Ballots), Tokens (Duty vs. Merit).
      *   **Payoff:** "Commendation Points" (CP). High CP = Good grade participation/credit.
      *   **Rounds:**
          1.  Define Duty (What *must* be done?).
          2.  Simulate Action (Did you do duty? Did you do extra?).
          3.  Evaluate Outcomes (Did disaster strike?).
          4.  Assign Praise/Blame.

  5.  **Addressing the Four Conceptual Loads:**
      1.  *Tripartite:* They must distinguish between "Required" (Duty) and "Optional but Good" (Extra).
      2.  *Credit Paradox:* When awarding tokens, if they give Merit Tokens for Extra actions, does that imply the non-doers were bad?
      3.  *Competence:* The "Senior Tech" can do Extra easily. Should their Duty be higher?
      4.  *Remainder:* Even if everyone follows the Protocol (Duty), a disaster can still happen if no one did the Extra.

  6.  **Timeline Construction (75 mins):**
      *   0-10: Setup & Hook.
      *   10-25: Phase 1 (Defining Duty).
      *   25-40: Phase 2 (The Simulation & Secret Role).
      *   40-55: Phase 3 (The Judgment & Paradox).
      *   55-65: The Reveal (Supererogation).
      *   65-75: Deep Debrief.

  7.  **Fleshing out the "What Will Go Sideways":**
      *   Students might make the Duty *too* high (eliminating the optional).
      *   Students might ignore the Secret Role.
      *   The Credit Paradox is abstract; they might just say "Nice job" without feeling the tension.
      *   Time management is tight.

  8.  **Refining the "Secret Capability":**
      *   How to make it mechanical? Give one student a "Efficiency Card." When they choose the "Extra Action," it costs them 1 Resource instead of 3.
      *   How to keep it secret? Pass a sealed envelope or a distinct colored card face down.

  9.  **Drafting the Content (Iterative refinement):**
      *   *Scenario:* "The Deep-Sea Station." High stakes, isolated, clear protocols.
      *   *Task:* Oxygen Scrubber Maintenance.
      *   *Duty:* Standard Check (Cost: 1 Energy).
      *   *Extra:* Deep Clean (Cost: 3 Energy).
      *   *Outcome:* Standard Check = 50% chance of failure. Deep Clean = 0% failure.
      *   *Secret:* One student (Chief Engineer) pays only 1 Energy for Deep Clean.
      *   *Committee Task:* Decide if Deep Clean becomes Duty.

      *Wait, the prompt asks for them to build the concept structure.*
      *   Better: They define the rules *before* knowing the costs fully? No, they need to know costs to decide duty.
      *   Let's have them vote on what counts as "Negligence" vs. "Merit."
      *   If they vote Deep Clean = Duty, then the Chief Engineer is just doing their job. If they vote Deep Clean = Optional, the Chief Engineer gets praise, but others are blameless for not doing it.

  10. **Finalizing the Plan:**
      *   **Title:** The Oxy-7 Protocol.
      *   **Materials:** Role cards, Action Cards, Token bowls (Blame/Praise).
      *   **Secret:** The "Veteran" card.
      *   **Debrief:** Map the voting and token distribution to the 4 concepts.

  11. **Self-Correction on "Credit Paradox":**
      *   The prompt asks what will *not* work. The Credit Paradox is internal/philosophical. An activity can show the *social* awkwardness (praise implying blame), but the logical paradox (how can praise exist without a corresponding duty to be praiseworthy?) might need lecture. I need to be honest about this.

  12. **Writing the Response:**
      *   Tone: Professional, pedagogical, practical.
      *   Structure: Follow the prompt's requirements exactly.
      *   Check constraint: No "S-word" until the end.

      *(Self-Correction during drafting)*: Make sure the "Remainder Problem" is clear. If everyone does Duty, and the system fails, who is responsible? No one. That's the remainder. I need to ensure the simulation allows for failure even when Duty is met.

      *(Refining the Secret Role)*: If the Veteran finds the Extra action cheap, the class will likely vote to make it Duty for *everyone*. I need to prevent that or make it a point of contention. I'll make the cost high for everyone *except* the Veteran. If they make it Duty, the regular students revolt (too costly). If they leave it Optional, the Veteran is singled out. This creates the Competence Wrinkle tension.

      *(Timeline Check)*: 75 minutes is tight for 22 students to debate. I need to use small groups for the initial rule-drafting, then plenary for the vote.

      *(Payoff)*: Use "Reputation Chips." Red = Blame, Green = Praise. White = Neutral.

      *Let's write it.*
answer: |-
  # Session Plan: The Oxy-7 Protocol

  **Course:** Mid-Level Ethics
  **Time:** 75 Minutes
  **Students:** 22
  **Goal:** Inductive discovery of supererogation, its paradoxes, and limits.
  **Constraint:** The word "supererogation" is banned until minute 65.

  ## I. Materials & Setup

  **Room:** Arrange tables into 5 clusters (4-5 students each). One table is the "Board Table" (front of room).

  **Handouts:**
  1.  **Scenario Brief:** "Station Oxy-7" (Deep-sea research station. Oxygen scrubbers failing. Risk of suffocation.).
  2.  **Action Menu:**
      *   *Action A (Standard Maintenance):* Cost: 1 Personal Energy Token (PET). Success Rate: 50%.
      *   *Action B (Deep Clean):* Cost: 3 PETs. Success Rate: 100%.
  3.  **Role Cards:** 21 "Technician" cards. 1 "Chief Engineer" card (Secret).
  4.  **Voting Ballots:** "Protocol Definition Sheet."
  5.  **Tokens:** 3 bowls per cluster. Green (Merit), Red (Blame), White (Neutral). Each student gets 3 PETs (Personal Energy Tokens) physically (poker chips or paper slips).

  **The Secret Mechanic:**
  *   **Technicians:** Action B costs 3 PETs.
  *   **Chief Engineer:** Action B costs 1 PET (same as Action A). *This card is marked subtly (e.g., a star in the corner) and instructs them not to reveal this unless forced.*

  **Payoff Scheme:**
  *   **Survival:** If the Station survives, everyone gets +1 Course Participation Point.
  *   **Reputation:** At the end, students distribute Green/Red tokens to peers based on their choices. 3+ Green tokens = Public "Commendation" (minor grade bump/privilege). 3+ Red tokens = "Review Board Hearing" (must write a 1-page justification reflection).

  ---

  ## II. Minute-by-Minute Timeline

  ### 00:00 – 00:10: Setup & Stakes
  *   **Hook:** "You are the Safety Board for Station Oxy-7. Last week, a scrubber failed. Two people died. No one broke the rules. Today, you rewrite the rules."
  *   **Distribute:** Scenario Brief, Action Menu, Role Cards (face down), and 3 PETs to each student.
  *   **Instruction:** "Do not open Role Cards yet. Read the Brief. You have 5 minutes to discuss within your clusters: What is the *minimum* we must require of every technician to keep them employed and the station safe?"

  ### 00:10 – 00:25: Phase 1 – Drawing the Duty Line
  *   **Task:** Each cluster must fill out a **Protocol Definition Sheet**.
      *   *Line 1:* Mandatory Actions (Failure to do = Blame/Fire).
      *   *Line 2:* Optional Actions (Failure to do = No Blame).
      *   *Line 3:* Praiseworthy Actions (Doing these = Merit Tokens).
  *   **Pressure:** Tell them, "Technicians have limited Energy (PETs). If you make the Mandatory list too long, they burn out and quit. If too short, the station fails."
  *   **Collection:** Collect the sheets. Most will likely make Action A Mandatory and Action B Optional (because B is costly).
  *   **Reveal Roles:** "Open your Role Cards now. Keep them hidden from your group." (The Chief Engineer now knows they can do Action B cheaply).

  ### 00:25 – 00:40: Phase 2 – The Simulation
  *   **Mechanic:** Each student privately chooses Action A or Action B. They pay the PET cost to the instructor.
  *   **The Twist:** The Instructor rolls a d20 for the Station's survival.
      *   If *everyone* did Action A: Station survives on 15+. (High risk).
      *   If *anyone* did Action B: Station survives on 8+. (Low risk).
  *   **Execution:** Students submit choices. Instructor calculates outcome.
      *   *Likely Outcome:* Most will do Action A (to save PETs). The Station is at high risk.
      *   *The Engineer:* The student with the Chief Engineer card realizes Action B is cheap for them. If they do Action B, they save the station at low personal cost.
  *   **Result:** Roll the die. (Rig this if necessary: If no one did B, roll a failure. If the Engineer did B, roll a success).
  *   **Announcement:** "The Station [Survived/Failed]."

  ### 00:40 – 00:55: Phase 3 – The Judgment (The Pressure Cooker)
  *   **Task:** Distribute the Green/Red/White tokens. Students must assign tokens to their cluster mates based on the **Protocol Definition Sheet** they wrote earlier.
  *   **Constraint:** "You must justify every Red or Green token. You cannot give tokens based on outcomes, only on adherence to the Protocol."
  *   **The Trap:**
      *   If a Technician did Action A (Mandatory): They get White (Neutral).
      *   If the Chief Engineer did Action B (Optional): They get Green (Merit).
      *   *Conflict:* If the Station Failed because everyone did Action A, the Technicians feel blameless (they followed rules), but the outcome is terrible.
      *   *Conflict:* If the Chief Engineer did Action B, they get Praise. But does that Praise imply the Technicians were *wrong* not to do it?
  *   **Intervention:** At minute 50, stop the class. Ask the Chief Engineer to stand. Ask the class: "Knowing what the Engineer knows (that B was easy for them), should we amend the Protocol to make B Mandatory *for them*?"
  *   **Vote:** Show of hands. This forces the **Competence Wrinkle**.

  ### 00:55 – 01:05: The Reveal
  *   **Stop:** "Put down the tokens."
  *   **Lecture:** "You just navigated a specific ethical category. You defined acts that are good to do, permissible not to do, and praiseworthy when done. In philosophy, this is called **Supererogation**."
  *   **Board Work:** Write the Tripartite Structure.
      1.  Permissible to omit.
      2.  Morally good to do.
      3.  Praiseworthy to do.
  *   **Connect:** "Look at your Protocol Sheet. Line 2 and Line 3 were your attempt to map this."

  ### 01:05 – 01:15: Debrief & Mapping
  *   Map the activity moments to the four conceptual loads (see below).
  *   Collect tokens and sheets for participation credit.

  ---

  ## III. Debrief: Mapping Activity to Concepts

  Use the whiteboard to draw four columns. Fill them in with student testimony from the activity.

  | Concept | Activity Moment | Discussion Question |
  | :--- | :--- | :--- |
  | **1. Tripartite Structure** | **Phase 1 (Protocol Sheet)** | "Why did you put Action B on the 'Optional' line instead of 'Mandatory'? What happens if you move it to Mandatory?" (Answer: It stops being supererogatory; it becomes duty). |
  | **2. Credit Paradox** | **Phase 3 (Token Distribution)** | "When you gave the Engineer a Green token, did anyone feel a Red token was implicitly waiting for those who didn't? If omission is blameless, what is the praise tracking?" |
  | **3. Competence Wrinkle** | **Phase 3 (The Vote)** | "When we found out the Engineer could do Action B cheaply, did their duty change? If duty scales with skill, is any act truly 'beyond duty' for an expert?" |
  | **4. Remainder Problem** | **Phase 2 (The Roll)** | "If everyone did Action A (Duty), followed the rules, but the Station failed... who is responsible? No one. That moral residue is the Remainder." |

  ---

  ## IV. Predictive Failure Analysis (What Will Go Sideways)

  **1. The "Maximalist" Rebellion (Predicted: 20% chance)**
  *   **Risk:** One cluster decides that *saving lives* is the only metric that matters. They mark Action B as **Mandatory** on their Protocol Sheet.
  *   **Effect:** This destroys the supererogatory space. There is no "beyond duty" if everything good is duty.
  *   **Fix:** Do not correct them during Phase 1. Let them sit with the cost. In Phase 2, they will run out of PETs (Energy). Use this in the debrief: "You eliminated the supererogatory, but you burned out the agents. Is a moral system that demands maximum good sustainable?"

  **2. The Secret Role Leak (Predicted: 40% chance)**
  *   **Risk:** The Chief Engineer tells their group immediately. "Hey, I can do Action B for cheap."
  *   **Effect:** The group coerces the Engineer to save them. The tension shifts from "individual duty" to "collective bargaining."
  *   **Fix:** Lean into it. "Okay, the group knows. Does the group have the right to *demand* the Engineer use their advantage? Does that turn the Engineer's gift into an obligation?" This actually *helps* teach the Competence Wrinkle.

  **3. The Credit Paradox Flatline (Predicted: 60% chance)**
  *   **Risk:** Students hand out Green tokens like candy. "Good job saving the station!" No one feels the tension that praise might imply blame.
  *   **Effect:** The philosophical paradox doesn't land. It just feels like a game reward.
  *   **Fix:** **Instructor Intervention in Phase 3.** When a student gives a Green token, interrupt. Ask the recipient: "Do you feel this praise suggests your peers were lacking?" Ask the giver: "If they were blameless, why do they deserve less than you?" You have to manufacture the awkwardness they aren't feeling naturally.

  **4. Time Creep (Predicted: 80% chance)**
  *   **Risk:** Debating the Protocol Sheet takes too long.
  *   **Fix:** Hard stop at minute 25. Collect sheets even if incomplete. The ambiguity helps the debrief.

  ---

  ## V. Honest Limitations: What You Must Lecture

  **The Credit Paradox (The "Blameless Omission" Problem)**
  *   **Why the activity fails here:** In a game, praise is a resource (tokens). In ethics, praise is a judgment of character. Students will treat Green Tokens like points in a board game ("I get points for doing extra!"). They won't naturally feel the logical tension that *if* I am praiseworthy for X, *then* not doing X must be a defect.
  *   **Your Job:** In the last 10 minutes, you must explicitly articulate the logic: "If we praise the saint, do we condemn the non-saint? If the non-saint is blameless, is the praise just a pat on the head with no moral weight? Supererogation tries to walk a line where praise exists without corresponding blame. The activity showed you the *social* awkwardness of that; the lecture must explain the *logical* difficulty."

  **The "Ought Implies Can" Nuance**
  *   **Why the activity fails here:** The "Competence Wrinkle" in the game is about resource cost (PETs). In reality, it's about moral capacity.
  *   **Your Job:** Clarify that the Chief Engineer's "discount" isn't just about time/energy, it's about moral expectation. "We expect more from the doctor than the bystander." The game simulates the *cost*, you must explain the *norm*.

  ## VI. Instructor Script Snippet (The Reveal)

  *"Look at the Protocol Sheet you wrote at the start. You created a category of action that was good, but not required. You created a space where someone could be a hero without making everyone else a villain. You built the structure of Supererogation without knowing the name. Now that you have the name, look at where your structure broke. Look at where the praise felt like blame. Look at where the Expert's duty shifted. That breakage? That's where the philosophy lives."*
