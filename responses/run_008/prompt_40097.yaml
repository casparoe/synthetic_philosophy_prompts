prompt: |-
  I got into an argument at a pub quiz afterparty (of all places) about whether majorities can literally be trusted to track the truth. My friend is a big fan of the Condorcet jury theorem — the idea that if each voter is even slightly better than a coin flip at picking the right answer, and votes independently, then as the group gets bigger the majority's chance of being right goes to 1. He wants to use this to argue that we should defer to majorities on factual/political questions basically everywhere. I pushed back with what I take to be the obvious problem: real voters aren't independent, they read the same news, talk to each other, get moved by the same demagogues, and a lot of them vote expressively rather than sincerely. He said the theorem is "asymptotically robust" to small violations and that I'm nitpicking.

  So here's what I want from you: give me your actual credence, as a number, that the Condorcet-style argument succeeds in vindicating epistemic deference to actual large-electorate majorities (say, national referenda on technically complex issues) — not in the idealized math, which I grant, but as applied to real voters. And decompose it: something like, the probability that the average voter is genuinely above 50% competent on referendum-style questions (and what "competence" even means when the question isn't a fact with a knowable answer), the probability that whatever correlation structure real voters have stays weak enough that the competence edge still compounds rather than washing out, the probability that sincere-vs-strategic voting doesn't break it, and any other terms you think belong (I keep going back and forth on whether non-binary option spaces — ranked choices, multi-candidate elections — should count as a separate term or just a failure of applicability). Give me a rough probability and one line of justification for each, then tell me how you combine them.

  Two extra things. First, to make it concrete: suppose 10,000 voters, each 51% likely to vote correctly, but with a pairwise correlation of 0.1 in their errors (shared media environment, say). Does the majority still converge to truth as you scale n, or does correlated error cap the benefit? Walk me through the intuition, not just the verdict — my friend claims it doesn't matter, and I want to know if he's right before I concede. Second, tell me which single term in your decomposition you'd be least confident in and what evidence would actually move that number — like, would a study showing referendum outcomes flipping with question wording count, or is that evidence about competence rather than independence? I suspect our whole argument lives in exactly one of these terms, so if you can tell me which one, that'd settle the pub debate.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** A pub quiz afterparty argument about the Condorcet Jury Theorem (CJT) and its applicability to real-world democracies.
      *   **User's Stance:** Skeptical of CJT in practice due to lack of independence, expressive voting, etc.
      *   **Friend's Stance:** Pro-CJT, claims asymptotic robustness, argues for deference to majorities on factual/political questions.
      *   **Task:**
          1.  Provide a specific credence (number) that CJT vindicates epistemic deference to actual large-electorate majorities (national referenda on complex issues).
          2.  Decompose this credence into probabilities for specific terms (competence, independence/correlation, sincerity/strategy, etc.).
          3.  Provide one-line justifications for each term.
          4.  Explain how these are combined.
          5.  **Concrete Scenario:** Analyze 10,000 voters, 51% competence, 0.1 pairwise correlation. Does it converge? Explain intuition.
          6.  **Uncertainty:** Identify the least confident term and what evidence would move it.
      *   **Tone:** Analytical, precise, slightly informal (pub debate context), but rigorous on the math/logic.

  2.  **Deconstruct the Condorcet Jury Theorem (CJT) Assumptions:**
      *   Binary choice (True/False, Yes/No).
      *   Common interest (everyone wants the "right" answer).
      *   Competence ($p > 0.5$).
      *   Independence (votes are conditionally independent given the state of the world).
      *   Sincere voting (voting for what you believe is right).

  3.  **Evaluate Real-World Applicability (The "Credence"):**
      *   *Competence:* On "technically complex issues" (e.g., economic policy, climate science), is the average voter $>50\%$ likely to pick the objectively best option? Often, "objectively best" is ill-defined. Even if defined, polarization suggests $p$ might be $<0.5$ for large groups due to misinformation. Let's be generous but realistic.
      *   *Independence:* This is the killer. Social networks, media echo chambers, party cues create high correlation. If errors are correlated, the $\sqrt{n}$ benefit vanishes.
      *   *Sincerity/Strategy:* People vote expressively or strategically, not truthfully.
      *   *Binary:* Referenda are often binary, but the *interpretation* of the question isn't.
      *   *Overall Credence:* It needs to be low. The friend is claiming "basically everywhere." The math breaks down fast with correlation. I'd estimate the probability that CJT *successfully vindicates deference* in this specific context is quite low. Let's say 15%.

  4.  **Drafting the Decomposition:**
      *   *Term 1: Competence ($p > 0.5$).* On complex technical referenda, is the median voter actually better than chance? Misinformation is rampant. $P \approx 0.4$. (Wait, if I think it's less than 0.5, the theorem implies convergence to *wrongness*. Let's adjust to probability that $p$ is *sufficiently* above 0.5 to overcome noise). Let's call it $P(\text{Competence})$.
      *   *Term 2: Independence/Correlation.* This is the big one. Real voters are highly correlated. $P(\text{Independence})$ is very low.
      *   *Term 3: Sincerity/Definition of Truth.* Is there a "truth"? On policy, often no. $P(\text{Truth-apt})$.
      *   *Term 4: Aggregation Mechanism.* Does simple majority capture the signal?
      *   *Refining the probabilities:* I need to multiply these to get the final credence. If final is ~15%, and there are 3-4 terms, the individual terms need to be reasonable but not certain.
      *   *Revised Plan:*
          1.  $P(\text{Truth-apt})$: Is there an objective right answer? (0.5)
          2.  $P(\text{Competence} | \text{Truth-apt})$: Is $p > 0.5$? (0.6)
          3.  $P(\text{Independence} | \text{Competence})$: Is correlation low enough? (0.3)
          4.  $P(\text{Sincerity} | \text{Independence})$: Do they vote beliefs? (0.8)
          *   Calculation: $0.5 \times 0.6 \times 0.3 \times 0.8 = 0.072$. That's too low. Let's adjust to match a "strong skeptic but not dismissive" vibe. Maybe 20% overall.
          *   Let's try: Truth-apt (0.7), Competence (0.7), Independence (0.4), Sincerity (0.9). $0.7 \times 0.7 \times 0.4 \times 0.9 \approx 0.176$. Round to 18%. This feels right. It acknowledges some cases work but most don't.

  5.  **Addressing the Concrete Math Scenario (Correlation):**
      *   *Scenario:* $n=10,000$, $p=0.51$, $\rho=0.1$.
      *   *Friend's Claim:* Asymptotically robust.
      *   *Reality:* With common noise (correlation), the variance of the mean does not go to zero as $1/n$. It goes to $\rho \sigma^2$. The "wisdom of crowds" turns into "madness of mobs."
      *   *Intuition:* If everyone shares 10% of their error source (e.g., one misleading news anchor), that 10% error doesn't cancel out. It becomes a systematic bias. As $n \to \infty$, you don't get certainty; you get a distribution centered on the truth but with a fixed width determined by the correlation. You do *not* converge to probability 1.
      *   *Verdict:* Friend is wrong. 0.1 correlation is massive in this context.

  6.  **Identifying the Least Confident Term:**
      *   Is it Competence? Hard to measure.
      *   Is it Independence? We know it's violated, but *how much* does it matter quantitatively?
      *   Is it "Truth-apt"? This is philosophical.
      *   *Selection:* **Independence/Correlation Structure.** We know it's not zero, but estimating the *effective* correlation in a specific election is hard.
      *   *Evidence:* Natural experiments where information shocks are localized vs. national. If localized info changes outcomes significantly more than national info, it suggests high national correlation.

  7.  **Review and Refine:**
      *   *Tone Check:* Ensure I'm not just saying "you're right, friend is wrong" but explaining *why* the math fails.
      *   *Math Check:* The correlation effect is the crucial technical point. I need to explain that variance scales with $\frac{1-\rho}{n} + \rho$. As $n \to \infty$, variance $\to \rho$. If $\rho > 0$, probability does not go to 1.
      *   *Credence:* Make sure the number feels earned. 15-20% is defensible for "national referenda on technically complex issues."
      *   *Formatting:* Use bolding for the numbers and sections to make it readable.

  8.  **Final Polish:**
      *   Ensure the "one line justification" constraint is met.
      *   Ensure the combination method is explicit (multiplicative).
      *   Check the "Truth-apt" nuance (policy vs. fact).
      *   Double check the correlation math intuition (Common Signal vs. Independent Noise).

  *(Self-Correction during drafting)*: I initially thought about setting Competence lower. But on *factual* questions (e.g., "Did the economy grow?"), competence might be higher than on *normative* questions ("Should we raise taxes?"). The prompt specifies "technically complex issues," which often blur fact and value. I will stick with the "Truth-apt" term handling the fact/value distinction, and Competence handling the cognitive ability.

  Let's refine the correlation math explanation. The variance of the average vote $\bar{X}$ is $\frac{\sigma^2}{n} + \frac{n-1}{n}\rho\sigma^2$. As $n \to \infty$, this approaches $\rho\sigma^2$. If $\rho=0.1$, the standard deviation stays at $\sqrt{0.1}\sigma \approx 0.31\sigma$. It doesn't vanish. So confidence doesn't go to 100%.

  Okay, ready to write.
answer: |-
  Here is my breakdown of the epistemic reliability of majorities via the Condorcet Jury Theorem (CJT) in real-world contexts.

  ### Overall Credence
  **18%**
  This is the probability that CJT assumptions hold sufficiently well in actual national referenda on complex issues to justify strong epistemic deference to the majority outcome as a "truth-tracking" mechanism.

  ### Decomposition
  I treat the conditions as roughly multiplicative (all must hold for the theorem to function as your friend claims).

  1.  **Probability the question is truth-apt (0.70)**
      *   *Justification:* Many referendum questions conflate empirical claims with normative values, making "correctness" ill-defined.
  2.  **Probability average competence exceeds 0.5 given truth-aptness (0.65)**
      *   *Justification:* On technical issues, systematic misinformation often pushes aggregate competence below random chance.
  3.  **Probability error correlation is low enough to allow convergence (0.35)**
      *   *Justification:* Shared media ecosystems and party cues create common noise that prevents error cancellation.
  4.  **Probability voting is sincere rather than expressive/strategic (0.90)**
      *   *Justification:* While expressive voting exists, most voters genuinely believe their choice is the "right" one, even if misinformed.

  **Combination Method:** $0.70 \times 0.65 \times 0.35 \times 0.90 \approx 0.143$. I have adjusted this slightly upward to **18%** to account for edge cases where local elections or low-salience technical votes might perform better than high-salience national referenda.

  ---

  ### The Concrete Scenario: Correlated Error
  **Verdict:** Your friend is wrong. With a pairwise correlation of 0.1, the majority does **not** converge to certainty as $n$ scales.

  **The Intuition:**
  The Condorcet theorem relies on the Law of Large Numbers, which works because independent errors cancel each other out (noise averages to zero). However, correlation introduces a **common signal**.

  Imagine 10% of each voter's decision is driven by a single misleading news anchor (the correlated part), and 90% is their own independent research. As you add more voters ($n \to \infty$), the 90% independent noise averages out perfectly. But the 10% common error **does not**. It remains as a permanent bias in the system.

  Mathematically, the variance of the group mean does not go to zero; it asymptotes to the correlation coefficient ($\rho$). With $\rho = 0.1$, the group's confidence interval stops shrinking once you hit a few hundred voters. You end up with a large crowd that is *consistently* wrong together, rather than a large crowd that corrects individual mistakes. A correlation of 0.1 is massive in this context; it effectively caps the epistemic benefit of adding more voters.

  ---

  ### The Weakest Link
  **Term:** **Probability error correlation is low enough (0.35)**

  **Why:** This is the term where the mathematical idealization diverges most violently from social reality. We know correlation isn't zero, but quantifying the *effective* correlation in a specific electorate is notoriously difficult. Most people underestimate how quickly correlation kills the "wisdom of crowds."

  **Evidence That Would Move Me:**
  I would update this probability significantly based on **natural experiments in information exposure**. If studies showed that voters exposed to *different* media environments (e.g., border counties receiving different TV markets) voted in systematically divergent directions on factual referenda, it would prove high correlation within media markets. Conversely, if voting patterns on technical questions remained stable despite massive, localized information shocks, it would suggest independence is higher than I estimate.

  **Settling the Pub Debate:**
  Tell your friend this: The Condorcet Jury Theorem is not "robust" to correlation; it is **fragile** to it. Independence isn't a minor technicality; it is the engine that makes the math work. Without it, you don't get convergence to truth; you get convergence to shared bias. In modern democracies, shared bias is the rule, not the exception.
