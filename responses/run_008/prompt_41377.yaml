  **Editor's Note on Liberties & Bias**

  This satire takes several liberties with the technical philosophy of Newcomb's Problem to fit the Yelp format.

  **1. The "Winner's Bias" (Stacking the Deck)**  
  The page inevitably flatters the One-Boxer. In a review aggregation site, satisfaction correlates with payout. Since One-Boxers receive \$1M and Two-Boxers receive \$1k, the One-Boxers appear happier and more "correct" by metric of utility. A committed Two-Boxer (Causal Decision Theorist) would argue this is irrelevant; they made the *rational* choice given the fixed past, and the satire punishes them for being poor. To make the satire fairer to the Two-Boxer, I would need a review from a Two-Boxer who is wealthy for *other* reasons, validating their rationality despite the loss here, or a management response admitting the predictor cannot actually violate causality.

  **2. Decision Theory as Personality Types**  
  The reviews treat Causal Decision Theory (CDT) and Evidential Decision Theory (EDT) as lifestyle choices ("be a one-boxer") rather than normative algorithms. In reality, a CDT proponent argues One-Boxing is *irrational*, not just less profitable. The joke frames Two-Boxers as bitter losers rather than defenders of causal integrity.

  **3. The Pre-Commitment Question-Begging**  
  The management reply to Markus quietly begs the question. It claims pre-commitment alters the "causal profile." A Two-Boxer would argue that if pre-commitment works, it proves the prediction isn't about *you*, but about your constraints, undermining the "free choice" premise of the original problem. The joke assumes the Predictor's power is fragile, which protects the mystique but sidesteps the hard metaphysical claim of Omega's infallibility.

  **4. The "Stupid" Two-Boxer**  
  Gary's review risks making the Two-Boxer argument look like sore losing rather than a principled stand on dominance. The gag works by implying Gary is angry about money, whereas a philosophical Two-Boxer should be angry about *principle*. I mitigated this by having Gary cite "logical dominance," but the "0 people found this helpful" tally still implies his reasoning is practically worthless, which is the One-Boxer's conclusion, not a neutral observation.
