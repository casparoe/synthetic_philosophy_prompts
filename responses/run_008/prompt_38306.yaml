answer: |-
  Your friend is correct: you can't recycle the theorem. The Condorcet Jury Theorem relies on increasing the total number of *independent* voters, not restructuring existing ones.

  Mathematically, a single majority vote of all 100 colleagues is the optimal way to aggregate their predictions. Splitting them into juries actually reduces accuracy. Hierarchical voting discards information: in your 4-person juries, a 3-1 victory counts the same as a 4-0 sweep, whereas a flat vote recognizes the stronger consensus in the latter. Furthermore, your coin-flip tie-breakers introduce random noise, actively lowering the probability of a correct verdict.

  There is no accuracy gain from adding layers because you aren't adding new data or independence; you're just processing the same 100 bits of information through a lossy filter. The "super-voters" aren't independent enough to boost performance beyond the raw majority.

  **Optimal layers:** One. Just count all 100 votes directly.
  **Infallibility:** Impossible. With fixed voters and individual accuracy $p < 100\%$, there is always a non-zero chance of error. Stop trying to build a pyramid; trust the flat majority.
