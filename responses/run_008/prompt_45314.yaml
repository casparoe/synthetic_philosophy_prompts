answer: |-
  # The Logical Space of Color Phi
  ### A Decision Tree for Timing and Experience

  **Start:** Two dots flash (Red, then Green). Subject sees one dot move and change color mid-path.

  **Q1: Is there a determinate fact about *when* a specific content becomes conscious, independent of later report?**
  *   **No** ───────────────────────────────────────────────► **LEAF A: Multiple Drafts / Dennett**
      *   *View:* There is no "finish line" for consciousness. Only competing narratives and verbal dispositions exist.
      *   *Note:* ⚠️ **Empirically Indistinguishable** from Leaves B, C, & D from the subject's perspective.
  *   **Yes** ───────────────────────────────────────────────► **Go to Q2**

  **Q2: Is the conscious percept assembled only *after* all contributing neural signals have arrived?**
  *   **Yes** ───────────────────────────────────────────────► **LEAF B: Stalinesque / Delayed Broadcast**
      *   *View:* The brain buffers input, edits the "movie," and then projects it to consciousness. Experience is real but late.
      *   *Note:* ⚠️ **Empirically Indistinguishable** from Leaf A regarding the "fact of the matter."
  *   **No** ────────────────────────────────────────────────► **Go to Q3**

  **Q3: If later signals alter the percept, do they rewrite the *memory* of the event or the *experiential content* itself?**
  *   **Memory** ────────────────────────────────────────────► **LEAF C: Orwellian / Post-Experiential Revision**
      *   *View:* The subject genuinely saw red motion, but memory is falsified later to include the green change.
  *   **Content** ───────────────────────────────────────────► **LEAF D: Extensionalist / Temporal Holism**
      *   *View:* Perceptual content is temporally "thick"; later inputs legitimately constitute earlier experience.
      *   *Note:* ⚠️ **Incoherent Variant:** If one holds "Content Revision" but insists on strictly linear time (point-like moments), this implies backward causation. This combination is **Unheld/Incoherent**.

  ***

  ### Handout Notes for Discussion

  1.  **The "Orwellian vs. Stalinesque" Trap:** This tree shows that accepting a "fact of the matter" (Q1: Yes) still leaves three distinct options (B, C, D), not just two.
  2.  **Indistinguishability:** Leaves A and B are functionally identical from the first-person perspective. The debate is purely about the *metaphysics* of consciousness, not the phenomenology.
  3.  **The Unheld View:** Leaf D contains a hidden fork. Most philosophers accept "Content Revision" only if they reject linear time (Extensionalism). Accepting "Content Revision" + "Linear Time" implies physical backward causation, which is generally rejected as incoherent.
  4.  **Node Count:** 3 Decision Nodes + 4 Leaves = 7 Nodes total.
