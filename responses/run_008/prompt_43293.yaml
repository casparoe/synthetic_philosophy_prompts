answer: |-
  ### Adjudication of Moves

  **Move (1): Dana on Logic and Validity**
  *   **Verdict:** Dana is **wrong** in her conclusion, though she identifies a genuine pressure point.
  *   **Reasoning:** Dana assumes that for truth to play a role in logic (specifically in defining validity as truth-preservation), it must be a "genuine property" in the substantive sense. This is a category mistake. Deflationists successfully argue that the logical role of truth is exhausted by its inferential role, which is secured by the equivalence schema. Validity can be characterized via infinite conjunctions of schemas or substitutional quantification without invoking a robust property.
  *   **Nuance:** Dana is right to demand an account of how generalizations about truth work in logic, but wrong to assert that deflationism *cannot* provide one. She denies the possibility of a solution Miguel is about to offer.

  **Move (2): Miguel on Generalization**
  *   **Verdict:** Miguel is **right**.
  *   **Reasoning:** This is the standard, strongest defense of deflationism (associated with Quine and Horwich). The truth predicate functions as a logical device enabling finite expression of infinite conjunctions (e.g., "Everything the witness said is true"). This explains the utility of the concept without positing a hidden nature. It directly answers Dana's worry in (1) by showing that "explanatory emptiness" does not entail "expressive uselessness."

  **Move (3): Dana on Normativity**
  *   **Verdict:** Dana is **wrong** in what she denies, but **right** to press for clarity.
  *   **Reasoning:** Dana claims that without truth as a property, the norm "believe $p$ only if $p$ is true" collapses. This assumes norms require robust properties as targets. However, she is right to highlight that deflationists must explain how a "thin" concept can carry normative weight. Her error is assuming the norm requires a *property* of truth rather than a *relation* between belief and the world.

  **Move (4): Miguel on Normative Reconstruction**
  *   **Verdict:** Miguel is **right**.
  *   **Reasoning:** Miguel correctly identifies that the norm can be understood schematically: for any $p$, one ought not believe $p$ unless $p$. The truth predicate is only needed to generalize this norm over all propositions. This preserves the normative force without ontological commitment. Dana's objection in (3) is neutralized because the norm does not rely on truth being a causal or explanatory property, only on the equivalence holding.

  **Move (5): Dana on the Liar**
  *   **Verdict:** Dana is **right**.
  *   **Reasoning:** Given the common ground (that deflationism holds the equivalence schema holds *without exception*), Dana's argument is logically decisive. The Liar sentence generates a contradiction ($T(L) \leftrightarrow \neg T(L)$) using only classical logic and the unrestricted schema. If deflationism is defined by the unrestricted schema, it is inconsistent. Dana is correct that this forces a modification: either the schema is restricted (admitting there is "more to truth" than the schema) or logic is changed.
  *   **Nuance:** Dana is right that the *unrestricted* schema is refuted. She may be too quick to infer this proves truth is a "substantive property," but she is certainly right that it proves the deflationist's initial formulation is incomplete.

  **Move (6): Miguel on Tarski and Symmetry**
  *   **Verdict:** Miguel is **right in what he asserts** about Tarski's theorem, but **wrong in what he denies** regarding symmetry.
  *   **Reasoning:** Miguel is correct that Tarski's Undefinability Theorem shows truth cannot be defined within the same language. However, he is wrong to claim the Liar counts equally against all theories in this context. Substantive theories can restrict the extension of truth (e.g., via Kripkean fixed points) without abandoning the core idea of truth as a property. Deflationism, defined strictly by the *schema*, faces a more immediate crisis because the schema *is* the theory. Furthermore, Miguel's appeal to Tarski is double-edged: Tarski provided a *definition* of truth (via satisfaction), which many argue is itself a substantive theory, not a deflationary one.
  *   **Nuance:** Miguel tries to have it both ways: using Tarski to block the Liar while claiming deflationism needs no definition. But Tarski's solution involves structural constraints on truth that go beyond the simple equivalence schema.

  **Move (7): Dana on Tarski and Hierarchy**
  *   **Verdict:** Dana is **right**.
  *   **Reasoning:** Dana correctly identifies that Tarski's hierarchy implies truth is not merely a logical device but a semantic property that requires richer resources (a metalanguage) to articulate. If truth were *only* the equivalence schema, the need for a hierarchy of languages would not arise in the way Tarski describes. Tarski's recursive definition adds structural content (satisfaction conditions) that exceeds the deflationist's "nothing more than the schema" claim. Miguel cannot lean on Tarski's technical results while rejecting the substantive implications of those results.

  ---

  ### Overall Verdict

  **Dana fared better.**

  While Miguel successfully defended the *motivation* and *utility* of deflationism in the early moves (logic and normativity), he lost the technical debate in the later moves.
  1.  **Consistency:** Dana demonstrated that the specific version of deflationism agreed upon at the outset (unrestricted equivalence schema) is logically inconsistent due to the Liar Paradox. Miguel had no answer to this other than to shift the ground.
  2.  **Tarski:** Miguel's attempt to recruit Tarski for deflationism backfired. As Dana pointed out, Tarski's work is generally interpreted as providing a substantive definition of truth (via satisfaction) that outruns the deflationary schema. By invoking Tarski to solve the Liar, Miguel implicitly conceded that the schema alone is insufficient, undermining the common ground definition.
  3.  **Burden of Proof:** Miguel successfully showed deflationism is *coherent* regarding logic and norms, but Dana successfully showed it is *incomplete* regarding paradox and definability. In a debate over a theory's viability, demonstrating inconsistency (Move 5) outweighs demonstrating utility (Move 2).

  ---

  ### Substantive Points Missed by Both

  Both Dana and Miguel missed several crucial distinctions that would have clarified the debate, particularly regarding the Liar and Tarski.

  **1. The Distinction between Disquotationalism and Minimalism**
  They treated deflationism as a monolith defined by the equivalence schema. However, there is a distinction between **Disquotationalism** (Quine/Field), which treats truth as a logical device for generalization, and **Minimalism** (Horwich), which treats the equivalence principles as axioms.
  *   **Relevance:** Minimalists can accept that the Liar shows some equivalence instances must be rejected without abandoning the theory, whereas Disquotationalists face a harder time. Neither party distinguished these, leading to confusion over whether restricting the schema refutes the theory.

  **2. Tarski's Convention T vs. Tarski's Definition**
  Miguel and Dana conflated Tarski's **Convention T** (the adequacy condition that any theory of truth must entail the T-sentences) with Tarski's **Recursive Definition** (which defines truth via satisfaction).
  *   **Relevance:** Deflationists claim Convention T is *all* there is. Substantivists claim the Recursive Definition shows there is *more* (i.e., the structure of satisfaction). Miguel tried to use Tarski's Definition to support a Deflationist view based on Convention T. Dana correctly sensed the tension but didn't explicitly name the conflation. The disagreement wasn't just about the Liar; it was about whether Tarski's *method* (substantive) supports Tarski's *criterion* (deflationary-friendly).

  **3. The Logical vs. Semantic Nature of the Liar**
  Both treated the Liar as a test for the *theory of truth*. However, many contemporary logicians view the Liar as a problem for **classical logic** itself, not just truth.
  *   **Relevance:** If one adopts a paracomplete or paraconsistent logic, the equivalence schema can be retained (mostly) without contradiction. Both assumed classical logic was fixed. If they had agreed that the Liar forces a choice of logic rather than a choice between deflation/inflation, the "inconsistency" charge in Move (5) would have been less decisive. The debate turned on the truth predicate, but the real pivot point was the underlying logic, which neither interrogated.

  **4. The Ambiguity of "Property"**
  Both argued as if "property" had a single, clear meaning.
  *   **Relevance:** Deflationists often argue that calling truth a "property" is grammatically correct but ontologically lightweight (a "cambridge property" or logical placeholder). Substantivists mean a causal/explanatory natural kind. Much of their disagreement in Moves (1) and (3) stems from talking past each other on this metaphysical issue. If they had clarified whether "property" meant "logical predicate" or "causal power," Moves (1) through (4) might have dissolved into verbal dispute.
