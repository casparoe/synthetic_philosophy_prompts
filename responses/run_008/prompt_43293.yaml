      *   **Common Ground:** Deflationism = Truth is exhausted by the equivalence schema ($T(p) \leftrightarrow p$); no deep hidden nature.

  2.  **Analyze Move (1): Dana on Logic and Validity.**
      *   *Dana's Claim:* Deflationism is unstable for logic. Validity = necessary truth-preservation. If truth isn't a property, it can't do this work. Deflationism saws off the branch logic sits on.
      *   *Miguel's Counter (Move 2):* Truth is a device of generalization. Expressive indispensability $\neq$ explanatory property.
      *   *Adjudication:* Dana raises a classic objection (e.g., from Field or early Putnam). However, deflationists (like Horwich or Field later) have responses. Validity can be defined schematically or via the generalization function. If "validity" means "for all arguments of form X, if premises are true, conclusion is true," the truth predicate allows us to quantify over propositions. Dana assumes truth *must* be a robust property to play a logical role. Miguel correctly points out the generalization role covers this.
      *   *Verdict:* Miguel is mostly right, but Dana identifies a genuine tension. Deflationists *can* account for validity via generalization, but they need to be careful about logical laws involving truth (e.g., $\forall x (True(x) \to \dots)$). Dana is wrong that it *cannot* do the work, but right that it requires a specific (deflationary) account of logical generalization.
      *   *Nuance:* Dana is wrong to assume property-hood is required for logical utility. Miguel is right about generalization.

  3.  **Analyze Move (2): Miguel on Generalization.**
      *   *Miguel's Claim:* Truth predicate is for generalization (e.g., "Everything the witness said is true"). Expressive indispensability is compatible with explanatory emptiness.
      *   *Adjudication:* This is the standard deflationist line (Ramsey, Quine, Horwich). It is technically correct within the deflationary framework. It directly answers Dana's worry in (1) by reinterpreting the logical role as expressive/quantificational rather than causal/explanatory.
      *   *Verdict:* Miguel is right. This is the core deflationist insight.

  4.  **Analyze Move (3): Dana on Normativity.**
      *   *Dana's Claim:* Belief aims at truth. Norm: Believe $p$ only if $p$ is true. If truth isn't a property, belief aims at nothing. Norm collapses.
      *   *Adjudication:* This is the "Norm of Truth" objection. Dana assumes norms require robust properties as targets.
      *   *Verdict:* Dana is pushing a substantive intuition. However, deflationists argue the norm is just a schema. Miguel's upcoming response will address this. Dana is right that *substantive* normativity is threatened, but wrong that *any* normativity requires a property.

  5.  **Analyze Move (4): Miguel on Normative Reconstruction.**
      *   *Miguel's Claim:* Norm is schematic: For each $p$, do not believe $p$ unless $p$. General statement needs truth predicate (generalization), but instances don't. No property invoked.
      *   *Adjudication:* This is the standard deflationist response to the norm objection (e.g., Horwich). It preserves the normative force without ontological commitment.
      *   *Verdict:* Miguel is right. The norm can be understood as an infinite conjunction of schematic norms. Dana's demand for a "target" property is question-begging against deflationism.

  6.  **Analyze Move (5): Dana on the Liar.**
      *   *Dana's Claim:* Liar sentence ($L \leftrightarrow \neg True(L)$). Equivalence schema yields contradiction ($True(L) \leftrightarrow \neg True(L)$). Deflationism says schema is universal. Therefore, deflationism is inconsistent or incomplete.
      *   *Adjudication:* This is the strongest objection. Pure naive deflationism (unrestricted T-schema) *is* inconsistent in classical logic. Deflationists must restrict the schema or change the logic. Dana claims this shows there is "more to truth" (i.e., constraints on the schema).
      *   *Verdict:* Dana is right that unrestricted deflationism is inconsistent. Miguel needs to address this. However, Dana's inference that this proves truth is a "substantive property" is a non-sequitur. It proves the *schema* needs restriction, not necessarily that truth is a deep nature. But she is right that deflationism as stated (unrestricted schema) is refuted.

  7.  **Analyze Move (6): Miguel on Tarski and Symmetry.**
      *   *Miguel's Claim:* Tarski's Undefinability Theorem shows truth can't be defined in-language. This fits deflationism (it's a device, not a defined property). Inflationists need a definition and can't have one. Liar is a problem for everyone.
      *   *Adjudication:* Miguel is partially right but slippery. Tarski's result *does* show limits on definability within a language. However, Tarski provided a *definition* in a metalanguage (Convention T). Deflationists usually like Tarski, but Tarski's definition is often seen as *substantive* (set-theoretic satisfaction). Miguel claims inflationists owe a definition deflationists don't. But deflationists also need to handle the Liar. Saying "it's a problem for everyone" is a deflection. If deflationism relies on the *unrestricted* schema (as per common ground), the Liar kills it specifically. Inflationists can restrict truth conditions without relying solely on the schema.
      *   *Verdict:* Miguel is wrong to claim symmetry regarding the Liar if deflationism is committed to the *unrestricted* schema. He is right that Tarski shows limits, but wrong to imply Tarski supports deflationism over inflationism clearly (Tarski's definition is often viewed as inflationary).

  8.  **Analyze Move (7): Dana on Tarski and Hierarchy.**
      *   *Dana's Claim:* Tarski defined truth in a metalanguage. The hierarchy shows truth outruns any fixed schema. This evidences truth is a genuine property. Miguel can't lean on Tarski and refuse the lesson.
      *   *Adjudication:* Dana is stronger here. Tarski's method is constructive and substantive (recursive definition based on satisfaction). If deflationism says truth is *only* the schema, Tarski's metalanguage definition shows there is structural content to truth (satisfaction conditions) beyond just $T(p) \leftrightarrow p$. The hierarchy suggests truth is not merely a logical device but has semantic depth requiring richer resources.
      *   *Verdict:* Dana is right. Tarski's approach is generally considered a substantive theory (or at least compatible with substantivism), not a deflationary one. Miguel's attempt to co-opt Tarski for deflationism is shaky.

  9.  **Overall Verdict:**
      *   Dana wins on the Liar and Tarski points (5, 6, 7). These are technical knock-downs against *naive* deflationism.
      *   Miguel wins on the Logic and Normativity points (1, 2, 3, 4). He successfully defends the coherence of deflationism regarding use and norms.
      *   Who fared better? Dana exposed a fatal flaw in the *formulation* of deflationism (unrestricted schema). Miguel defended the *motivation* and *utility*. However, since the common ground defined deflationism as "nothing more... than instances of the equivalence schema," Dana's Liar argument (5) is technically decisive against that specific definition. Miguel's retreat to Tarski (6) contradicts the common ground (Tarski adds structure). So Dana wins on technical consistency, Miguel wins on philosophical plausibility of the *idea*.
      *   *Decision:* Dana has the stronger technical case against the *stated* version of deflationism. Miguel has the better grasp of the deflationist *spirit*, but his technical defense (Tarski) undermines the common ground.

  10. **Substantive Missed Points:**
      *   **The Liar isn't just a deflationist problem:** It's a problem for classical logic + naive truth. Both treat it as a theory-selector, but it's really a logic-selector (paracomplete, paraconsistent, etc.).
      *   **Tarski's Convention T vs. Definition:** Miguel conflates the T-schema (deflationist core) with Tarski's recursive definition (substantive). Dana spots this but doesn't explicitly distinguish Convention T from the recursive definition.
      *   **Generalization vs. Quantification:** They discuss generalization, but miss the distinction between object-language and meta-language quantification which is crucial for the logic objection (1).
      *   **The "Property" Talk:** Both assume "property" is univocal. Deflationists often argue "property" is just a grammatical placeholder (Quine).

