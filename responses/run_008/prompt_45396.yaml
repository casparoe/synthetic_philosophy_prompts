answer: |-
  **The Thought Experiment**

  Consider a pregnant person at 39 weeks gestation whose fetus is diagnosed with anencephaly, a condition guaranteeing death within hours of birth regardless of medical intervention. The pregnancy is healthy and low-risk; continuing to spontaneous labor requires only seven more days of normal gestation, involving negligible physical discomfort, zero medical risk to the woman, and the minor inconvenience of attending two routine prenatal checkups. The woman, overwhelmed by the emotional anticipation of the infant's imminent death, requests an immediate abortion to terminate the pregnancy today rather than endure the week of waiting. She acknowledges the fetus will die either way but asserts a right to end her bodily involvement immediately. The physical burden of continuing is objectively trivial, comparable to wearing a slightly heavy backpack for a week, while the fetus's remaining biological life, though lacking consciousness, is the only "future" it possesses.

  **Analysis of Verdicts**

  Under Marquis's framework, the abortion is not seriously wrong. The wrongness of abortion, for Marquis, derives from depriving an entity of a "future like ours"—a continuum of valuable experiences, projects, and enjoyments. Because the anencephalic fetus lacks the neurological capacity for consciousness and will die immediately upon birth, it possesses no such future. Depriving it of the remaining seven days of gestation deprives it of nothing of value; thus, the primary wrong-making feature of abortion is absent.

  Under Thomson's framework, the verdict is more critical. Thomson grants the fetus a right to life *arguendo* but denies it a right to use the woman's body *unless* the refusal to provide that use violates a duty of "Minimally Decent Samaritanism." Here, the burden of continuing the pregnancy is so trivial that refusing to sustain the fetus for one week falls below the threshold of decency. Thomson explicitly notes that while we may not be forced to be Good Samaritans (great sacrifice), we are morally criticized for failing to be Minimally Decent Samaritans (trivial aid). Therefore, Thomson implies the abortion is morally wrong—not because it violates the fetus's *rights* (the woman remains within her bodily autonomy), but because it is an act of indecency. Can this be honestly described as "wrong"? In a deontological rights framework, no; she violates no duty of justice. But in a broader moral sense, acting callously when the cost of kindness is near-zero is a moral failure. To close the gap between "indecent" and "strictly impermissible," the case would need to stipulate that the duty of minimal decency generates an obligation strong enough to override autonomy in trivial-burden cases, a move Thomson resists to protect bodily integrity. The gap is likely unclosable in principle within her theory, as she prioritizes the right to refuse over the duty to aid, even when the refusal is uncharitable.

  **The Single Feature**

  The divergence rests entirely on the **intersection of a nullified future and a trivialized burden**. This specific coordinate allows Marquis to permissiveness (no future to lose) while pushing Thomson toward prohibition (no burden to refuse). If you remove the fatal anomaly and restore a normal fetal prognosis, Marquis immediately objects (a valuable future is lost), aligning him with Thomson's likely objection to trivial-burden abortion. Conversely, if you remove the trivial burden and make the remaining week of gestation medically risky or painful, Thomson immediately permits the abortion (refusal is no longer indecent), aligning her with Marquis (who might still permit it depending on the value of the future relative to the mother's loss, but certainly wouldn't object as strongly). The theories only diverge when the *value of the life* is zero (satisfying Marquis) but the *cost of saving it* is also zero (satisfying Thomson's condition for duty).

  **Thomsonian Attack and Orthogonality**

  A committed Thomsonian would attack this case by rejecting the premise that "Minimally Decent Samaritanism" compels *continuing* a pregnancy that yields no viable life. They would argue that the duty to aid applies only when aid results in a saved life; sustaining a fetus for seven days only to watch it die at birth is not "saving" it, but merely prolonging the dying process. Therefore, the woman is not refusing aid that works, but refusing futile gestation. Furthermore, the Thomsonian would insist that bodily autonomy is a "trump" card; even if the refusal is indecent, it remains within her rights, and labeling it "wrong" conflates moral criticism with moral prohibition. This exercise strongly supports your friend's parting shot: the arguments are orthogonal. Marquis measures the *loss to the fetus* (deprivation of value), while Thomson measures the *demand on the woman* (burden of obligation). They usually converge because valuable futures usually coincide with significant burdens (late-term pregnancy), but when decoupled—as in this case of a valueless future with a valueless burden—the frameworks speak past one another, evaluating different moral dimensions entirely.
