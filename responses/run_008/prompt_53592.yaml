answer: |-
  # JOINT STATEMENT ON THE NORMATIVE STATUS OF RISK-WEIGHTING

  **Signatories:** [Name, Orthodox EU Proponent] & [Name, REU Proponent]  
  **Date:** October 26, 2023  
  **Context:** Adversarial Collaboration, Graduate Decision Theory Reading Group

  ## I. AGREED CLAIMS

  Both signatories affirm the following claims as the common ground for this dispute. Denial of any claim below constitutes a withdrawal from this collaboration.

  1.  **The vNM Framework:** Both parties accept the von Neumann-Morgenstern (vNM) setup (outcomes, objective or subjective probabilities, and lotteries) as the standard formal language for stating the problem. The dispute is not about the mathematics of representation theorems, but about which axioms are normatively mandatory for a rational agent.
  2.  **Descriptive Adequacy:** Both parties agree that Allais-style preferences (violations of the Independence Axiom) are robust empirical phenomena. The dispute is not whether humans *have* these preferences, but whether a rational agent *ought* to have them.
  3.  **Explanatory Burden:** Both parties agree that a decision theory must explain the source of risk aversion. Orthodox EU locates this entirely in the curvature of the utility function (diminishing marginal utility). REU locates this partially or wholly in a distinct risk-function applied to cumulative probabilities.
  4.  **Dynamic Consistency:** Both parties agree that a viable normative theory must account for dynamic choice. A theory that renders an agent inherently vulnerable to a guaranteed loss (a money pump) without recourse to sophisticated planning is deficient.
  5.  **Separation of Belief and Desire:** Both parties agree that, in principle, a decision theory should distinguish between an agent's representation of the world (belief/credence) and their evaluation of outcomes (desire/utility). The dispute concerns whether risk-attitudes belong to the former, the latter, or a third category.

  ## II. STATEMENT OF DISAGREEMENT

  The following table isolates the specific points of contention. The wording has been vetted by both signatories to ensure each recognizes their own position in the description.

  | Topic | Orthodox EU Position | REU (Buchak) Position |
  | :--- | :--- | :--- |
  | **1. The Independence Axiom** | The Independence Axiom is a requirement of rationality. Violating it implies a failure to treat identical outcomes in different states as equivalent, leading to separability failures. | The Independence Axiom is too restrictive. Rational agents may prefer to weight outcomes based on their global position in a lottery (e.g., worst-case vs. best-case), not just local probability. |
  | **2. "Beliefs in Disguise"** | **Classification:** Substantive Error.<br>Any REU preference structure can be mathematically represented as EU with distorted probabilities. If an agent acts as if $p \neq p_{true}$, their reported credences are simply incorrect. | **Classification:** Substantive Error.<br>Redescribing risk-weights as distorted probabilities conflates attitude towards risk with belief about likelihood. It forces the agent to misreport their actual credences to save the EU model. |
  | **3. The Retiree Case**<br>*(Reject Bet A, Reject Bet B, Accept A+B)* | **Verdict:** Irrational (if wealth effects controlled).<br>If utility for wealth is linear in the relevant range, rejecting positive-EV bets individually while accepting them jointly violates Separability. It indicates incoherent evaluation of the same states. | **Verdict:** Rational.<br>This is a paradigmatic case of hedging. A convex risk function permits rejecting volatile individual assets while accepting a diversified portfolio, even with linear utility for wealth. |
  | **4. Normative Guidance** | **Goal:** Coherence.<br>Theory should prevent internal contradiction in preferences. Risk aversion is solely about how much you value money, not how you weight chances. | **Goal:** Endorsement.<br>Theory should model the reasons agents give for choices. Agents cite "risk" distinct from "value" and "likelihood." Theory should reflect this tripartite structure. |

  ## III. ADJUDICATION CRUXES

  Per the terms of this collaboration, vague appeals to "further work" are prohibited. The following two cruxes identify specific tests where the theories make divergent predictions. The signatories commit to accepting the outcome of these tests as evidence weighing for or against their respective views.

  ### Crux 1: The "Beliefs in Disguise" Objection
  **The Issue:** The EU proponent claims REU is merely EU with distorted probabilities. The REU proponent claims this forces a misrepresentation of the agent's actual credences.
  **Drafting Judgment:** This is classified as a **Substantive** disagreement, not a verbal one. If it were verbal, we could resolve it by definition. The substance lies in whether a single parameter (probability) can normatively do the work of two (probability + risk-weight) without losing explanatory power regarding the agent's mind.
  **The Test:** **Dual-Elicitation Protocol.**
  Subjects are subjected to two independent elicitation methods regarding a binary event (e.g., a coin flip):
  1.  **Credence Elicitation:** A proper scoring rule (e.g., Brier score) incentivizing truthful reporting of probability $p$.
  2.  **Choice Elicitation:** A series of bets on the event incentivizing revelation of decision weights.
  **Predictions:**
  *   **Orthodox EU:** The decision weights derived from Choice will match the Credence reports. If they diverge, the Credence report was inaccurate (the agent was lying or confused about their belief).
  *   **REU:** The decision weights will systematically diverge from the Credence reports (e.g., reported $p=0.5$, but choice behavior implies weight $< 0.5$ for the uncertain outcome), and the agent will endorse both reports as accurate upon reflection.

  ### Crux 2: The Retiree Case (Portfolio Separability)
  **The Issue:** An agent rejects two positive-EV bets individually but accepts them jointly. EU claims this is incoherent unless utility for wealth is non-linear. REU claims this is rational risk-management even with linear utility.
  **Drafting Judgment:** The EU position often relies on the "model wealth properly" defense. To prevent this from becoming a tautology (where any behavior is explained by post-hoc utility curvature), we must fix the utility function independently.
  **The Test:** **Controlled Linearity Range.**
  1.  Establish a monetary range $[W, W + \Delta]$ where the agent's utility for wealth is verified to be linear (via standard lottery equivalence tests).
  2.  Offer two bets, $A$ and $B$, with payoffs strictly within $[W, W + \Delta]$ and positive expected value.
  3.  Observe if the agent rejects $A$, rejects $B$, but accepts $A+B$.
  **Predictions:**
  *   **Orthodox EU:** This pattern will not occur in a rational agent. If it occurs, the agent is vulnerable to a money pump (e.g., selling $A+B$ and buying back $A$ and $B$ separately) or the linearity verification was flawed.
  *   **REU:** This pattern will occur and remain stable under reflection. The agent will not view themselves as vulnerable to a money pump because they evaluate the *global risk* of the portfolio, not the additive value of the parts.

  ***

  # DRAFTING COMMENTARY (FOR THE ORGANIZER)

  *You asked me to make judgment calls where the drafting required it and explain why. Here is the rationale for the hard lines drawn in the document above.*

  **1. On "Beliefs in Disguise" (Substantive vs. Verbal)**
  *   **The Call:** I classified this as **Substantive**.
  *   **Why:** In many philosophical disputes, "is X just Y in disguise?" is a verbal stalemate. However, in decision theory, this has empirical teeth. If EU is right, there is only one mental state (credence) driving both betting behavior and probability reporting. If REU is right, there are two distinct mental states. By committing to the **Dual-Elicitation Protocol**, we force the dispute into the lab. If agents consistently report $p=0.5$ but bet as if $p=0.3$, the EU proponent must either call the agent irrational (for misreporting $p$) or admit the EU model requires "hidden variables." I worded the prediction to force the EU proponent to claim the agent is *wrong* about their own belief, which is a strong, falsifiable claim.

  **2. On the Retiree Case (Preventing the "Model Wealth Properly" Dodge)**
  *   **The Call:** I imposed the **Controlled Linearity Range** constraint.
  *   **Why:** The Orthodox EU position often survives by saying, "You didn't model the utility function correctly." This makes EU unfalsifiable. To satisfy your constraint against hedging, I forced the EU proponent to agree that if utility is *independently verified* as linear, the preference pattern is irrational. This puts skin in the game. If the retiree pattern persists in the linear range, EU must call it irrationality; REU calls it rationality. There is no "more work needed" escape hatch regarding utility curvature.

  **3. On Dynamic Consistency (Money Pumps)**
  *   **The Call:** I nuanced the Money Pump prediction.
  *   **Why:** REU theorists (like Buchak) argue that while REU violates Independence, it doesn't necessarily lead to *naive* money pumps if the agent is sophisticated. A flat statement like "REU allows money pumps" would be inaccurate. However, EU theorists argue that *any* violation of Independence creates a *potential* for dynamic inconsistency. I worded the prediction to focus on **stability under reflection**. The EU claim is that a rational agent, upon seeing the structure, will fix the inconsistency. The REU claim is that they will endorse it. This avoids getting bogged down in technical mechanisms of specific money-pump arguments and focuses on the normative core: is the preference pattern reflectively stable?

  **4. On Tone**
  *   **The Call:** Formal and binding.
  *   **Why:** You mentioned the group is "sick of watching it." A polite, hedged document would invite more seminar-room wrangling. By using language like "Denial of any claim... constitutes a withdrawal" and "commit to accepting the outcome," I have raised the stakes. This forces the signatories to treat the document as a contract, not a summary.
