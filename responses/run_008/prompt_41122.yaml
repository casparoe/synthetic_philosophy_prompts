          *   (2) is false/misleading. The value of committing depends entirely on whether the other has *already* committed.
          *   (3) fails because it treats commitment as a dominant strategy. It's not. It's a strategy in a game of Chicken.
          *   If both commit instantly, the "first mover" logic vanishes. You enter a simultaneous move game where "Commit" vs "Commit" yields disaster.
          *   Rational agents must account for the probability of the other committing.
      *   **The Solution (Conditional Commitment):**
          *   Address the roommate's point. "Regret-proof" is vague. The precise term is **Conditional Commitment**.
          *   Instead of "I demand 60%," commit to "I demand 60% *unless* you have already committed to <= 40%."
          *   Better yet: Commit to a **bargaining procedure** rather than a **demand**.
          *   This avoids the "born bomb" conclusion.
      *   **Cost of giving up (3):**
          *   You lose the simplicity of "always be tough."
