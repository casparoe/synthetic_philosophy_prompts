      This is a game of Chicken (or Hawk-Dove).
      In Chicken, "Always Swerve" (Never Commit) is not stable. "Always Drive Straight" (Always Commit) is not stable.
      The rational strategy is a **mixed strategy** or a **conditional strategy**.
