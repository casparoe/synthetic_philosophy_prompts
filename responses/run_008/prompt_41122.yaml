      The most robust theoretical break is at **(3)**.
      Why? Because (3) asserts a dominant strategy ("should commit immediately") where none exists.
      In a symmetric game where both players have the option to commit, "Commit Immediately" is not a Nash Equilibrium if it leads to mutual destruction.
      If both play "Commit Immediately," both get -100 (war).
      If both play "Wait/Negotiate," both get +50 (split).
