      *   "Evaluate the policy, not the greedy action at a node."
      *   **Verdict:** Mostly correct. In RL, we optimize parameters $\theta$ of $\pi_\theta$. We don't typically re-optimize $\theta$ at every timestep based on self-locating uncertainty unless we are doing model-predictive control (MPC) with a specific assumption about future self's behavior.
