      *   **Actions:** Exit ($E$) or Continue ($C$).
      *   **Payoffs:** $E$ at $X \to 0$. $E$ at $Y \to 4$. $C$ at $Y \to 1$.
      *   **Constraint:** "Absent-mindedness" = No memory of past actions/visits. Same policy $\pi(a|o)$ must be used at both $X$ and $Y$.
      *   **The Conflict:**
          *   *Ex-ante:* Optimize $\pi$ before starting. Result: $\pi(C) = 2/3$. Expected Value (EV) = $4/3$.
          *   *In-media-res:* At an intersection, update belief $P(Y | \text{at intersection})$. But this belief depends on $\pi(C)$. If I change $\pi(C)$ now, does my belief change? (Piccione & Rubinstein's argument).
          *   *Time Consistency:* Is the plan made at start consistent with the action chosen at the node?

  3.  **Map to POMDP Vocabulary:**
      *   **States:** $S = \{s_{start}, s_X, s_Y, s_{end}, s_{home}\}$.
      *   **Observations:** $\Omega = \{o_{start}, o_{int}, o_{end}\}$. Crucially, $O(s_X) = O(s_Y) = o_{int}$.
      *   **Transition:** Deterministic based on action.
      *   **Policy:** Memoryless stochastic policy $\pi(a | o_{int})$. Let $p = \pi(C | o_{int})$.
      *   **Objective:** Maximize $J(\pi) = \mathbb{E}[\sum \gamma^t r_t]$. (Here $\gamma=1$, finite horizon).
      *   **Belief State:** $b(s) = P(s | \text{history})$. Since history is erased, $b(s)$ depends on the prior and the policy used to get there.

  4.  **Address the "Paradox" in RL Terms:**
      *   **Ex-Ante Optimization:** This is standard Policy Search. We define $J(p)$ and find $p^* = \arg\max_p J(p)$.
          *   $J(p) = (1-p) \cdot 0 + p(1-p) \cdot 4 + p \cdot p \cdot 1 = 4p - 3p^2$.
          *   $dJ/dp = 4 - 6p = 0 \Rightarrow p = 2/3$.
          *   $J(2/3) = 4/3$.
      *   **The "In-Media-Res" Update (The Spooky Part):**
          *   In standard POMDPs, belief update is $b'(s') \propto O(s', a, o) \sum_s T(s, a, s') b(s)$.
          *   In AMD, the "belief" of being at $Y$ given you are at an intersection depends on the probability you *continued* at $X$.
          *   $P(Y | \text{at int}) = \frac{P(\text{at } Y)}{P(\text{at } X) + P(\text{at } Y)} = \frac{p}{1 + p}$.
          *   *The Philosophical Twist:* If I am at an intersection and consider deviating from $p$ to $p'$, do I update my belief using $p$ (the policy that got me here) or $p'$ (the policy I'm considering)?
          *   *RL View:* You don't "update belief" during inference to choose an action. You execute $\pi(a|o)$. If you are doing online planning (e.g., POMCP), you simulate forward using the *current* policy for future steps, but the past trajectory is fixed.
          *   *The Conflict:* Causal Decision Theory (CDT) vs. Evidential Decision Theory (EDT) vs. Updateless Decision Theory (UDT).
          *   *RL Equivalent:* Policy Gradient vs. Q-Learning vs. Global Optimization.

