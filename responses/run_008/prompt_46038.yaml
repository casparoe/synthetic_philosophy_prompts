answer: |-
  # PREP SHEET: ETHICS COMMITTEE DEFENSE
  **Topic:** Relational Personhood in Advanced Dementia Guidance
  **Time:** 20 Minutes
  **Goal:** Survive scrutiny, secure mandate for rewrite.

  ---

  ## 1. THE CRITICAL THREAT (Damage Rating: Fatal)
  **Source:** Disability Rights Advocate
  **Likely Sequence:** Mid-meeting, after initial definitions are settled.

  **The Objection:**
  > "I have sat at bedsides where 'relational' language meant 'burden on the family.' If personhood is constituted by the web of relationships, what protects the patient when that web is frayed, exhausted, or prejudiced? You are proposing we make moral status contingent on the quality of the patient's social support. That is not protection; that is a means-test for human rights."

  **Concede Up Front:**
  *   "You are right that relational language has historically been weaponized to devalue disabled lives. I am not asking you to trust my intentions, but to look at the safeguard structure."

  **30-Second Reply:**
  *   "Current guidance treats personhood as an internal asset the patient spends until bankruptcy. My proposal treats it as a trust fund the *committee* manages. The shift isn't making status contingent on the family's capacity; it's making the *institution* responsible for sustaining the relationship when the family cannot. We aren't asking if the family still values them; we are asking if *we* are still holding their place."

  **Honest Note on Weakness:**
  *   **Soft Spot:** This relies on the institution having the resources/will to "sustain the relationship." If the guidance doesn't mandate specific advocacy resources (time, money, staff), this is just noble rhetoric. You have no budget attached to this proposal.

  ---

  ## 2. THE CONCEPTUAL TRAP (Damage Rating: High)
  **Source:** Analytic Philosopher
  **Likely Sequence:** Opening round (definitions).

  **The Objection:**
  > "You are conflating the *criteria* for personhood with the *treatment* owed to persons. Are you making a metaphysical claim that the self literally extends into others? Or an ethical claim that we should *act as if* it does? If it's the former, it's mysticism. If it's the latter, it's paternalism disguised as ontology."

  **Concede Up Front:**
  *   "I am not making a metaphysical claim about the boundaries of the soul or the brain. I concede this is a normative framework, not a biological fact."

  **30-Second Reply:**
  *   "It is a *clinical* ontology. In dementia care, the 'self' that interacts with medicine is inevitably co-constructed by caregivers. If we treat the patient as an isolated biological unit, we treat symptoms. If we treat them as a relational node, we treat a life. I am asking for the latter because it yields better ethical outcomes, not because it's quantum physics."

  **Honest Note on Weakness:**
  *   **Soft Spot:** A strict analytic philosopher may reject "clinical ontology" as a category error. They may press you on whether a "better outcome" justifies a "false premise." You need to be ready to admit the premise is pragmatic, not true-in-itself.

  ---

  ## 3. THE BIOLOGICAL REDUCT (Damage Rating: High)
  **Source:** Behavioral Neurologist
  **Likely Sequence:** Early, following the Philosopher.

  **The Objection:**
  > "Sentience is the hardware. Relationships are the software. When the hardware degrades to the point of advanced dementia, the software cannot run. You are asking us to treat the ghost of the machine. Why does moral status persist after the capacity for relational reciprocity is biologically extinguished?"

  **Concede Up Front:**
  *   "I concede that the capacity for *reciprocity* is lost. I am not arguing the patient is still relationally active in a cognitive sense."

  **30-Second Reply:**
  *   "We do not withdraw moral status from comatose trauma patients who lack reciprocity, because we hold their standing in trust based on their prior narrative. Advanced dementia is a permanent coma with a history. The 'Ubuntu' element isn't that the patient is currently relating, but that the community's duty to remember and honor does not expire with the patient's cognitive decline."

  **Honest Note on Weakness:**
  *   **Soft Spot:** The coma analogy is weak. Comas are often acute/reversible; advanced dementia is progressive/terminal. The neurologist will press you on whether "permanent coma" justifies indefinite resource allocation. You risk sounding like you are ignoring the biological reality of suffering.

  ---

  ## 4. THE LOGISTICAL BRICK WALL (Damage Rating: Medium)
  **Source:** Hospital Administrator
  **Likely Sequence:** Closing round (implementation).

  **The Objection:**
  > "This sounds beautiful. But at 2 a.m., a resident has to decide on intubation. Does this guidance change the checkbox they tick? If the answer is still 'call the surrogate,' how is this different from current policy? If the answer is 'convene the web,' we don't have time."

  **Concede Up Front:**
  *   "It does not create a new algorithm for emergency escalation. I concede it adds complexity, not speed."

  **30-Second Reply:**
  *   "It changes the *default presumption*. Currently, the default in ambiguity is often medical futility. Under this guidance, the default is 'presume continuity of personhood.' It forces the resident to pause and ask, 'Who holds this person's story?' before documenting 'non-beneficial.' It slows down withdrawal, not escalation."

  **Honest Note on Weakness:**
  *   **Soft Spot:** Administrators hate slowing down processes without clear data on improved outcomes. If you can't show that "slowing down withdrawal" reduces moral distress or litigation, they will view this as bureaucratic friction.

  ---

  ## 5. THE QUESTION YOU HOPE NOBODY ASKS (Damage Rating: Fatal)
  **Source:** Disability Rights Advocate (The Second Strike)
  **Likely Sequence:** If they sense evasion in Question #1.

  **The Question:**
  > "You say the community holds the standing in trust. But trusts can be terminated. If the 'web of relationships' collectively decides the burden is too great, or that the patient's prior wishes are unclear, does your framework allow the web to vote that the personhood is extinguished? Yes or no."

  **Critique of Your Current Answer:**
  *   **Your Draft:** "Relational views protect, they don't diminish."
  *   **The Verdict:** This is a hope, not an argument. It is rhetorically pretty but logically empty. It dodges the mechanism of revocation. If personhood is *constituted* by relationships, the dissolution of those relationships logically entails the dissolution of personhood. You cannot have it both ways.

  **What The Argument Would Have To Be:**
  *   To survive this, you must argue that the "trust" is **irrevocable by the trustees**. The community has the *duty* to sustain the status, but not the *authority* to revoke it. The standing becomes a one-way ratchet: relationships can sustain it, but only biological death can end it.

  **Do You Have It?**
  *   **Honest Assessment:** **No.** Your current proposal frames standing as "partly constituted by" the web. That implies contingency. To fix this, you must amend the guidance to explicitly state: *"Relational standing creates a duty of care that is not contingent on the capacity of the relationships to sustain it."*
  *   **Action:** If this question is asked, do not use your current answer. Pivot immediately to the "Irrevocable Trust" concept above. If you cannot commit to that in the text of the proposal, you will lose this argument.

  ---

  ## STRATEGIC SUMMARY
  *   **Biggest Risk:** The Advocate. If they frame this as a risk to vulnerable populations, the Neurologist and Administrator will align with them.
  *   **Best Ally:** The Philosopher. If you can satisfy them that this is a *normative* tool and not a *metaphysical* claim, they may help you defend the coherence against the Neurologist.
  *   **Tone:** Humble on the metaphysics, rigid on the ethics. Do not claim this makes the patient "more alive." Claim it makes the *care* "more human."
  *   **Kill Switch:** If the "Irrevocable Trust" question (Section 5) is asked, do not bluff. Admit the risk and offer to add a specific safeguard clause to the guidance text immediately.
