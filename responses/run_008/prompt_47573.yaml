      *   *Akrasia:* Emphasize that guilt requires identity. If I am not Future Me, why do I care?

  10. **Final Polish:** Ensure all parts of the prompt are answered explicitly. (Audit, Break, Math, Metaphor, Policy, Akrasia).

      *(Self-Correction during drafting)*: Wait, I need to be careful about the "policy" part. Thaler/Sunstein (Nudge) use this. They argue for "libertarian paternalism." The friend's "predatory borrower" line is a bit more aggressive than standard Nudge theory. I should point out that distinction. The friend is making a stronger moral claim than the econ usually supports.

      *(Refining the Akrasia point)*: If Present Self wins, it's rational for Present Self. So "weakness of will" becomes "shift in agency." This eliminates the *normative* failure, leaving only a *coordination* failure. That is indeed "explaining away."

      *(Final check on tone)*: Keep it sharp. "Here is the audit. Here is the break. Here is the verdict."

