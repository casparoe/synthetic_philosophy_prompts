answer: |-
  Here is the audit of your friend's "Multiple Selves" model. He is using a standard heuristic from behavioral economics (often associated with Thaler, Shefrin, O'Donoghue, and Rabin), but he is reifying a modeling tool into a metaphysical claim to do moral and political work it cannot support.

  ### 1. The Audit: Mapping the Analogy

  To treat Present Self and Future Self as distinct agents in a bargaining game, the correspondence must look like this:

  *   **The Agents:**
      *   **Agent A (Present Self):** The Proposer. Holds control over current resources and actions. Has a high discount rate (values now heavily).
      *   **Agent B (Future Self):** The Responder. Inherits the consequences. Has a lower discount rate (values long-term welfare).
  *   **The Bargaining Game:** An inter-temporal sequential game. Agent A chooses an action (e.g., eat cake vs. diet). Agent B inherits the payoff (health vs. pleasure).
  *   **The Contract:** Commitment devices (e.g., Odysseus's ropes, stickK.com, freezing credit cards). These are binding agreements made by Agent A to restrict Agent A's future moves, ostensibly to benefit Agent B.
  *   **The Enforcement:** External penalties (fees, social shame, physical inability). Since Agent A cannot trust Agent A's future iterations to comply, they bind themselves to a third-party enforcer.
  *   **The Policy:** Default enrollment (pensions). The State acts as a court or trustee, enforcing a contract Agent B (Future Self) would have wanted but Agent A (Present Self) is too "predatory" to sign.

  ### 2. Where It Breaks: The Disanalogies

  Your intuition is correct; the analogy fractures under ontological scrutiny.

  *   **Unidirectional Control:** In a real bargaining game, the Responder can reject the offer. Future Self cannot reject the consequences of Present Self's actions. Future Self has no veto power. This isn't a negotiation; it's a dictatorship with a time delay.
  *   **No Retaliation:** If a stranger breaches a contract, you sue or withhold future trade. Future Self cannot punish Present Self. Regret and guilt are internal psychological states, not external sanctions. They are felt by the *same* continuing consciousness, which undermines the "different people" claim.
  *   **Identity Continuity:** Real agents have distinct utility functions and memories. Present and Future Self share a memory stream and a nervous system. Present Self feels *anticipatory* anxiety about Future Self's pain. If they were truly strangers, Present Self would be sociopathic toward Future Self. The fact that we care about our futures at all proves we view them as *us*.
  *   **The Homunculus Problem:** If Present Self and Future Self are different agents, who is the "I" that feels the conflict? There must be a meta-agent observing the struggle to experience the tension of procrastination. The model explains the behavior but eliminates the experiencer.

  ### 3. The Math: One Curve or Two Agents?

  You hit the nail on the head: **A single hyperbolic discount curve generates preference reversal all by itself.**

  *   **The Math:** In standard exponential discounting, preferences are time-consistent. In hyperbolic (or quasi-hyperbolic $\beta-\delta$) discounting, the discount rate drops sharply for immediate delays. This creates a "preference reversal" mathematically without needing two ontological entities.
  *   **The Model:** The "Planner vs. Doer" or "Multiple Selves" framework is a *game-theoretic representation* of a single time-inconsistent utility function. It is a modeling choice, not an empirical discovery of split personalities.
  *   **Verdict:** The two-selves talk is a **metaphor riding on the math**. It is an "as-if" model. It is useful for predicting behavior (e.g., designing commitment devices), but it is an error to infer from the model that there are literally two agents with moral standing.

  ### 4. The Policy: Does Paternalism Survive?

  Your friend's policy conclusion (default enrollment protects Future Self from a predatory Present Self) is the weakest link.

  *   **If they are different people:** The State is taking sides in a dispute between two entities, one of whom (Future Self) has no legal standing and cannot vote. Protecting a non-existent entity from a current citizen is legally and morally incoherent.
  *   **If they are the same person:** The State is engaging in soft paternalism. It is helping a single agent overcome a cognitive bias (time inconsistency) to achieve their *own* revealed long-term preferences.
  *   **The Contradiction:** The friend wants to have it both ways. He uses the **Two-Selves** view to explain the conflict (it's not a failure, it's a dispute), but he uses the **Single-Self** view to justify the policy (we are helping *you* achieve *your* goals).
  *   **The Break:** If you take the Two-Selves analogy seriously, the "predatory borrower" claim collapses. Present Self isn't predatory; they are just rationally maximizing their own utility function which heavily discounts the future. You cannot call it "predation" if the "victim" is just a future iteration of the same organism with no right to consent.
  *   **Conclusion:** The paternalism conclusion survives **only if** you drop the "different people" ontology and admit this is about helping a single agent with inconsistent preferences. The "predatory borrower" rhetoric is moral dressing on a mathematical phenomenon.

  ### 5. Akrasia: Solved or Explained Away?

  This is the philosophical crux.

  *   **Classic Akrasia:** Requires a unified agent who knowingly acts against their better judgment. It implies a moral or rational failure of the *self*.
  *   **Multiple Selves Model:** There is no failure. Present Self is acting rationally according to Present Self's preferences. Future Self will act rationally according to Future Self's preferences. The conflict is just a handover of control.
  *   **The Verdict:** This **explains away** akrasia rather than solving it.
      *   It dissolves the *logical paradox* (How can I choose against my interest? -> "I" changed).
      *   But it fails to capture the *phenomenology*. We do not feel like a baton being passed between runners. We feel guilt, regret, and a sense of *betrayal*. Guilt requires identity. If Future Self is a stranger, why do I feel bad *now* about hurting *him*?
      *   By turning a moral/rational failure into a coordination problem, the model sanitizes procrastination. It removes the "weakness" from "weakness of will."

  ### Summary Judgment

  Your friend is using a **useful economic fiction as a metaphysical truth.**

  1.  **The Math:** He is right that hyperbolic discounting explains the behavior. He is wrong that this necessitates two distinct agents.
  2.  **The Analogy:** It breaks on enforcement, retaliation, and identity continuity.
  3.  **The Policy:** The "protection from predator" argument collapses without the two-self ontology, but the two-self ontology makes the policy morally incoherent. It works best as "helping a unified agent navigate their own biases."
  4.  **The Akrasia:** It explains the mechanism of procrastination but eliminates the experience of it.

  **Bottom Line:** Tell your friend the "Two Selves" model is a brilliant *heuristic* for designing commitment devices, but a terrible *ontology* for understanding human agency. He is mistaking the map for the territory. The "predatory borrower" line is rhetorical flair that doesn't survive the audit.
