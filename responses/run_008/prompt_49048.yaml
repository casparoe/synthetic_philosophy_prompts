answer: |-
  Take a definite side: **The Negation Problem is distinct from the Frege–Geach problem.**

  Your seminar partner is mistaken. While the Negation Problem is often presented as the *first step* in solving Frege–Geach, it is not merely a special case of embedding. It is a distinct difficulty because it targets the **nature of inconsistency** between mental states, whereas the Frege–Geach problem targets the **preservation of validity** across sentential structures. An expressivist can construct a formal semantics that validates moral inferences (solving Frege–Geach) without successfully explaining what mental state constitutes a contradictory attitude (failing the Negation Problem).

  Here is the defense of that verdict, anchored in the distinction between logical validity and psychological incompatibility, using a worked example to demonstrate the gap.

  ### 1. The Conceptual Distinction: Validity vs. Inconsistency

  The Frege–Geach (FG) problem is fundamentally a problem about **logic**. It asks: How can moral sentences function in valid arguments (like *Modus Ponens*) if they do not express truth-apt propositions? The requirement is to provide a semantics that preserves truth (or commitment) across complex embeddings like conditionals and disjunctions.

  The Negation Problem is fundamentally a problem about **psychology** (or metaphysics of mind). It asks: If "Stealing is wrong" expresses a non-cognitive attitude (e.g., disapproval), what attitude does "Stealing is not wrong" express such that holding both is *inconsistent*? The requirement is to identify a specific mental state that clashes with the first, explaining the phenomenon of **disagreement**.

  Your partner claims that a semantics handling negation automatically handles conditionals. I argue the reverse is the danger: a semantics can handle conditionals (FG) by mimicking propositional logic, while leaving the nature of the negative attitude unexplained (Negation).

  ### 2. Worked Example: The "Complement Set" Semantics

  To prove these problems are distinct, I will construct a hypothetical expressivist semantics that **solves Frege–Geach** but **fails the Negation Problem**. This demonstrates that the machinery for FG does not automatically do the work required for Negation.

  **The Setup:**
  Let moral sentence $P$ ("Stealing is wrong") express a non-cognitive attitude of **Disapproval** toward stealing. Let us denote the set of agents holding this attitude as $\|P\|$.
  Let moral sentence $Q$ ("Lying is wrong") express **Disapproval** toward lying. Denote this $\|Q\|$.

  **The FG Solution (Validating Logic):**
  To solve Frege–Geach, we need to validate standard inferences. Consider *Modus Tollens*:
  1.  $P \to Q$ ("If stealing is wrong, lying is wrong")
  2.  $\neg Q$ ("Lying is not wrong")
  3.  $\therefore \neg P$ ("Stealing is not wrong")

  Our expressivist defines a semantic value for moral sentences as sets of "acceptance states."
  *   $\|P\|$ = Set of states containing Disapproval(Stealing).
  *   $\|Q\|$ = Set of states containing Disapproval(Lying).
  *   $\|P \to Q\|$ = Defined classically as the set of states where either $\|P\|$ is absent or $\|Q\|$ is present (material conditional mimicry).
  *   $\|\neg P\|$ = Defined as the **complement set** of $\|P\|$ (i.e., all states *not* in $\|P\|$).

  **Does this solve Frege–Geach?**
  Yes. By defining negation as the set-theoretic complement and conditionals via standard Boolean operations, the inference above is formally valid. If an agent is in a state in $\|P \to Q\|$ and in $\|\neg Q\|$, they must mathematically be in $\|\neg P\|$. The logical machinery works. The expressivist has assigned "the right significance to moral sentences under negation" in terms of truth-preservation (or commitment-preservation).

  **Does this solve the Negation Problem?**
  No. And here is where your intuition is correct and your partner's collapses.
  The Negation Problem demands an explanation of **disagreement**. If Speaker A asserts $P$ and Speaker B asserts $\neg P$, they are in conflict.
  *   Speaker A is in a state of **Disapproval(Stealing)**.
  *   Speaker B, by our semantics, is in a state **not in $\|P\|$**.

  What mental state is Speaker B in? The semantics only tells us what they are *not* in. They could be in a state of **Tolerance**, or **Indifference**, or **Disapproval of Disapproval**, or simply **no attitude at all**.
  *   If $\neg P$ expresses *Indifference*, then A and B are not genuinely contradicting each other in a normative sense; A is prescribing, B is shrugging.
  *   If $\neg P$ expresses *Disapproval of Disapproval*, we have a higher-order attitude, but we haven't explained why *that* specifically clashes with first-order Disapproval in a way that mirrors logical contradiction.

  By defining $\neg P$ merely as the logical complement to satisfy FG validity, the expressivist has **stipulated** contradiction without **explaining** inconsistency. They have solved the logical problem (FG) by borrowing propositional structure, but they have failed the psychological problem (Negation) because they cannot specify which positive attitude constitutes the negation.

  ### 3. Why This Makes Them Distinct

  Your partner argues that negation is just the "simplest embedding context." This treats the problem as purely syntactic. But expressivism is a thesis about *speech acts* and *mental states*, not just syntax.

  1.  **FG is about Composition:** It asks how complex sentences get their meaning from parts. The "Complement Set" semantics above solves this by fiat.
  2.  **Negation is about Content:** It asks what the *parts* are. The "Complement Set" semantics fails this because "not-Disapproval" is not a unified psychological kind.

  If the Negation Problem were just a special case of FG, solving the logic of conditionals would automatically tell us what attitude $\neg P$ expresses. But as the example shows, you can fix the logic (FG) while leaving the attitude (Negation) indeterminate. Therefore, the Negation Problem imposes an **additional explanatory burden**: it requires a theory of **attitude incompatibility** that is not reducible to logical validity.

  ### 4. Theoretical Dependence

  This verdict depends on a reading of **Mark Schroeder's** analysis in *Being For* (2008). Schroeder argues that the heart of the Frege–Geach problem is actually the Negation Problem, but he distinguishes them by noting that FG is about *validity* while Negation is about *inconsistency*. He critiques "minimal expressivism" (like the example I constructed above) for solving validity while failing to explain inconsistency.

  It also aligns with **Simon Blackburn's** quasi-realism, which acknowledges that projecting a logic (solving FG) is easier than explaining the "real" disagreement that underpins it (solving Negation). Blackburn admits that quasi-realism must *earn* the right to talk of disagreement, implying it is not automatically granted by solving logical embedding.

  ### Conclusion

  You are right to resist your partner's collapse. The Frege–Geach problem is a challenge to the **logic** of expressivism; the Negation Problem is a challenge to the **psychology** of expressivism. A theory can possess a valid logic (solving FG) while misdescribing the nature of moral conflict (failing Negation). Because one can be solved without the other, they are distinct difficulties. The Negation Problem is not merely the simplest embedding context; it is the foundational requirement for explaining why moral debate is possible at all.
