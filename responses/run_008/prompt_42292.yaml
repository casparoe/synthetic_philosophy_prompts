answer: |-
  Here is the reverse-engineering of your colleague's heuristic, the prediction for the new vignette, and the theoretical payoff.

  ### 1. The Candidate Rules

  You have correctly identified the surface tension between **Formal Legality** and **Enforced Impartiality**. However, looking at her specific distinctions between Vignette 2 (potholes = corruption) and Vignette 4 (pork = not corruption), a more precise rule emerges. Both involve steering public resources to supporters. Both are often legal (or legally gray). The difference is the *institutional role*.

  *   **Rule A: Positive Legality.** Corruption is whatever the written code criminalizes.
      *   *Fit:* Perfect on the first six. (1, 2, 5 are illegal; 3, 4, 6 are legal).
      *   *Weakness:* As you noted, this makes corruption tautological. It also fails to explain *why* she distinguishes potholes (admin) from pork (legislative), as both can be legal or illegal depending on the jurisdiction.
  *   **Rule B: Institutional Teleology (Function + Norm).** Corruption is an act that subverts the *specific functional purpose* of the institution *as understood by its participants*, violating the operating norms required to achieve that purpose.
      *   *Fit:*
          *   **V1 (Elections):** Purpose is autonomous choice. Vote-buying subverts this. (Corruption)
          *   **V2 (Admin):** Purpose is neutral service delivery. Politicized potholes subvert this. (Corruption)
          *   **V3 (Tokyo Admin):** Purpose is efficiency/relationships. Gifts within limits facilitate this without distorting it. (Not Corruption)
          *   **V4 (Legislature):** Purpose is representation/allocation. Pork is a *feature* of this function, not a bug. (Not Corruption)
          *   **V5 (Planning):** Purpose is transparent zoning. Non-disclosure subverts this. (Corruption)
          *   **V6 (Legislature):** Purpose is interest aggregation. Lobbying is a *feature*. (Not Corruption)

  ### 2. The Prediction

  **Her Call:** **Not Corruption.**

  **The Reasoning:**
  While Rule A (Legality) fits her track record perfectly, Rule B (Teleology) is the *mechanism* driving it. She is a comparativist who studies informal institutions; she knows that "law on the books" often diverges from "law in action." In her first six vignettes, legality and institutional norms happened to align. The new vignette forces them apart.

  In this case, the **functional purpose** of the procurement committee is to secure the best value for the municipality. The vignette specifies the contract went to the "lowest qualified bidder." The meritocratic outcome was achieved. Furthermore, the **operating norms** of the participants (bidders, committee, losers) treat the gifts as ritualized and universal—a "tax" or a greeting, not a bribe. There is no *quid pro quo* distortion.

  To her, the anti-corruption code here is a "dead letter"—a Weberian ideal imposed on a system that operates differently. Since the act did not subvert the institution's actual function (getting the best contract) and did not violate its *enforced* norms (everyone accepts it), she will likely categorize this as **inefficient regulation** or **cultural ritual**, but not corruption. She will likely argue that calling this "corruption" imposes an external moral framework on a stable, functioning local equilibrium.

  ### 3. The Discriminating Vignette

  To cleanly split **Positive Legality** (Rule A) from **Institutional Teleology** (Rule B), you need a scenario where an act is **Legal** but **Function-Subverting**.

  **The Vignette:**
  > "A tenured professor at a public research university serves on a hiring committee for a new department chair. The university statutes allow committee members to vote based on 'any criteria they deem relevant to the institution's future.' The professor votes for the least qualified candidate because that candidate promised to hire the professor's spouse for a separate, open administrative position. This 'logrolling' is technically legal under the statutes, common in this specific university's history, and rarely punished. However, the university's stated mission is meritocratic excellence, and the faculty senate privately condemns the practice as undermining the department's quality, even if they tolerate it."

  **The Split:**
  *   **If she says Corruption:** She is running **Rule B (Teleology)**. The act is legal, but it subverts the core function of the hiring committee (meritocratic selection) and violates the *normative* purpose of the institution, even if tolerated. This aligns with her V2 call (potholes) where the administrative function was subverted.
  *   **If she says Not Corruption:** She is running **Rule A (Legality)** or a radical **Normative Relativism**. If it's legal and tolerated, it's just "politics."

  *(Note: I suspect she might pause here. This vignette attacks the "Academic State," which might trigger a different heuristic. If you want a safer discriminator, use a **Judicial** one: A judge in a system where judicial elections are legal accepts a massive campaign donation from a litigant and recuses themselves *after* the trial starts, which is legal under procedural rules, but clearly undermines the function of impartial justice.)*

  ### 4. The Weberian Reflection

  Her ruling on the gift-committee case tells us exactly where she stands on the universality of corruption.

  *   **If she calls it Corruption:** She believes in a **Universalist** category. There is a "line" defined by formal rules and impartiality that exists independent of local context. This contradicts her wine-table muttering. It suggests that even a scholar of clientelism ultimately relies on a Weberian ideal type to make moral judgments.
  *   **If she calls it Not Corruption (My Prediction):** She confirms that "corruption" is a **Parochial/Endogenous** category. It is merely the label we apply when informal practices clash with formal ideals *and* cause dysfunction. If the system works (lowest bidder wins) and the norms are stable (gifts are ritual), the "corruption" label is an export from a different political culture.

  **The Honest Take:**
  If she votes "Not Corruption," she is admitting that **corruption is not a moral absolute, but a measure of institutional friction.** It validates her suspicion: "Corruption" is indeed the name for whatever offends a Weberian fantasy. But it also risks a dangerous relativism where *no* informal practice can be criticized as long as it is "normalized." Her challenge next week will be explaining why V1 (vote buying) is corruption if it is also normalized in parts of Brazil. Her answer will likely be: *Vote buying subverts the secret ballot (the function), whereas ritual gifts do not subvert the procurement outcome (the function).*

  She is not a moralist; she is a functionalist. She defines corruption not by the act, but by the **breakage** it causes in the machine.
