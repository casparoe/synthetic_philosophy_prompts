answer: |-
  ### Inventory of Candidate Commitments

  Before reconstructing the epistemology, let us lay bare the implicit commitments currently operating in this hybrid regime. The practice is not monolithic; it is a patchwork of old norms and new tools. Here is what the current institution seems to be juggling:

  1.  **The De Bruijn Criterion:** Trust is not placed in the complex automation (tactics, solvers) but in the small, human-auditable kernel of the proof assistant. This presupposes that logical validity can be localized to a manageable syntactic core.
  2.  **Semantic Fidelity:** A machine check verifies that *a* statement follows from *some* axioms. The human text is required to warrant that the formalized statement actually matches the intended mathematical theorem. The practice assumes a gap between "formal string" and "mathematical content."
  3.  **Proof as Communication:** Mathematics is treated as a social technology for transferring understanding, not just a repository of truths. A proof that cannot be understood by a peer is epistemically deficient, even if logically valid.
  4.  **Fallibilism regarding Hardware/Software:** The community implicitly acknowledges that hardware bit-flips or compiler bugs are possible, yet treats the probability as negligible compared to human error in long derivations.
  5.  **The Hierarchy of Value:** "Insight" is ranked higher than "Certainty." We are willing to tolerate a tiny residue of uncertainty in a proof that illuminates a field, whereas a black-box certification of a trivial result is often deemed unworthy of publication.
  6.  **Distributed Epistemic Labor:** The referee is no longer the sole verifier of correctness. They are now a verifier of *relevance* and *formalization quality*, while the machine is the verifier of *deductive validity*.

  With this inventory in hand, let us address your specific questions regarding the tension between mechanistic certification and human understanding.

  ***

  ### 1. Does Machine Verification Presuppose Formalism?

  It is a common misconception that using a formal tool commits one to formalism (the view that mathematics is *nothing but* the manipulation of symbols). I argue that accepting machine verification does **not** strictly presuppose a syntactic conception of proof, though it is certainly *compatible* with one.

  A Platonist or a structuralist can consistently accept machine certification on the grounds of **instrumental reliability**. Consider an astronomer who uses a digital sensor to record the position of a star. The sensor outputs binary data (syntax), but the astronomer believes the star exists independently of the sensor (realism). The sensor is merely a tool that extends human perceptual capacity and reduces observational error.

  Similarly, a non-formalist mathematician can view the proof assistant as a "logical microscope." They believe the theorem describes a mind-independent structure. The machine check ensures that the path taken through the logical landscape contains no slips or gaps. The commitment here is not that the theorem *is* the derivation, but that the derivation is the only reliable *access* we have to the theorem's necessity.

  The crucial distinction is between **verification** (is the derivation valid?) and **validation** (does this derivation correspond to the intended concept?). A Platonist uses the machine for verification but reserves human judgment for validation. Therefore, the practice does not force the user to believe that mathematics is syntax; it only forces them to believe that syntax is a reliable proxy for necessity.

  ### 2. Does the Demand for Exposition Presuppose Anti-Mechanism?

  The residual demand for readable, explanatory exposition does **not** necessarily presuppose the Lucas-Penrose style anti-mechanism (i.e., that human insight transcends computation). A thoroughgoing mechanist can explain this demand through **pragmatics** and **social epistemology**.

  If one believes human minds are computational systems, "understanding" is simply a state of having a compressed, efficient internal representation of the proof that allows for future simulation and variation.
  *   **Heuristic Utility:** A human-readable proof allows other mathematicians to reuse lemmas, adapt methods, and spot generalizations. A binary "verified" flag provides no affordances for future discovery. The mechanist values explanation because it increases the computational efficiency of the community.
  *   **Trust Management:** Even a mechanist knows that formalization is error-prone. Mapping informal math to formal code is a translation task. The human text allows peers to audit the *translation layer*. If the code says `Theorem_X` but the text describes `Theorem_Y`, the verification is useless. The text is a checksum for semantic fidelity.
  *   **Pedagogy:** Mathematics must be taught to new agents (students). If the archive contains only certificates, the "training data" for the next generation of mathematicians is lost.

  Thus, the demand for explanation is compatible with mechanism. It treats understanding not as a metaphysical glow that machines lack, but as a functional capacity for manipulation and transmission that raw certificates do not provide.

  ### 3. Where is the Practice Philosophically Underdetermined?

  The current practice is remarkably agnostic about the **ontology** of mathematical objects while being quite specific about the **epistemology** of warrant.

  *   **Underdetermined:** Whether mathematical objects exist independently (Platonism), are mental constructions (Intuitionism), or are linguistic conventions (Formalism). The machine checks the relations; it does not care what the relata *are*. A Platonist and a Formalist can look at the same Coq or Lean output and both say "This is established," for entirely different metaphysical reasons.
  *   **Underdetermined:** The source of the axioms. The practice does not dictate whether ZFC is "true" or merely "useful." It only requires that the axioms be declared.
  *   **Determined:** The standard of **deductive rigor**. The practice has shifted from "convincing to an expert" to "checkable by a kernel." This is a hardening of the warrant condition.
  *   **Determined:** The **division of labor**. The practice mandates that certification can be outsourced to silicon, but *interpretation* cannot.

  The practice is coherent because it separates the **context of justification** (increasingly mechanized) from the **context of discovery and meaning** (resolutely human). It avoids the Gödelian trap by not claiming the machine *finds* the truth, only that it *guards* the path to it.

  ***

  ### Reconstruction: The Shift to Pure Machine Certification

  Let us now imagine the profession abandons the readability requirement. A theorem is published if and only if a repository contains a valid certificate checked by a standard kernel. The human text is optional or deprecated.

  **What would have to change?**

  1.  **The Referee's Role:** The referee ceases to be a verifier of logic and becomes an **auditor of the Trusted Computing Base (TCB)**. Their job shifts from "checking the proof" to "checking the checker." They must verify that the formalization matches the problem statement (the semantic gap) and that the software environment is secure. This requires a new skillset: computer science and logic engineering, rather than domain-specific mathematical intuition.
  2.  **Vouching for the Assistant:** Currently, we rely on the "small kernel" hope. In a pure certification regime, we would need institutionalized verification of the proof assistant itself. We would need a chain of custody for the compiler, the OS, and the hardware. The "social contract" of math would expand to include software engineers and hardware manufacturers as epistemic partners.
  3.  **The Notion of "Proof":** The concept of proof would collapse entirely into **derivability**. The normative force of "proof" would no longer be tied to "perspicuity." A proof could be a terabyte-sized object inaccessible to any human mind.

  **What would be lost?**

  *   **Transfer of Heuristics:** The primary loss is the ability to learn *how* to solve problems from the archive. If proofs are black boxes, mathematics becomes a list of facts rather than a web of methods.
  *   **Detection of Triviality:** Humans reject proofs that are "correct but uninteresting." Without human readability, the literature could be flooded with mechanically verified trivialities or "accidental" truths that lack structural significance.
  *   **Error Localization:** When a machine check fails, it tells you *where*, but not *why* in a conceptual sense. Without the narrative, debugging the mathematical intuition becomes impossible.

  ***

  ### Evaluation: Gain or Loss?

  **On the Mechanist View:**
  *   **Gain:** This would be a net epistemic gain. If mathematics is ultimately about securing true beliefs via reliable processes, removing the human element removes the primary source of error (cognitive bias, fatigue, sloppy inference). The "loss" of heuristics is a practical inconvenience, not an epistemic deficit. The archive becomes a perfect library of truths.
  *   **Loss:** Only in terms of *efficiency of discovery*. If humans can't read the proofs, they can't build on them easily. But in principle, mining algorithms could extract patterns.

  **On the Anti-Mechanist View:**
  *   **Loss:** This would be a catastrophe. If mathematical knowledge requires *grasping* the necessity of the connection (as per the Lucas/Penrose line or even traditional phenomenological accounts), a certificate without understanding is not mathematical knowledge—it is merely **true belief**. It is testimony without comprehension. The "mathematics" ceases to be a human science and becomes a data dump. The Gödelian insight—that we can *see* the truth of the unprovable—is rendered irrelevant because the profession no longer cares about "seeing," only about "outputting."

  ***

  ### Coherence of the Current Practice

  Is the current mixed practice internally coherent? **Yes, but it is a pragmatic coherence, not a metaphysical one.**

  The profession is effectively operating with a **bifurcated epistemology**:
  1.  **For Certainty:** We act like Formalists. We demand syntactic checks. We acknowledge that human intuition is fallible.
  2.  **For Meaning:** We act like Platonists or Humanists. We demand that the symbols refer to concepts we can grasp. We acknowledge that syntax without semantics is empty.

  Do members disavow these commitments if asked?
  *   If you ask a working mathematician, "Is a theorem true because it is derived?" they might say "No, it was always true." (Platonist).
  *   If you ask, "Can we accept it without a proof?" they say "No." (Formalist constraint).
  *   If you ask, "Is a computer check sufficient without a human text?" they say "No." (Humanist constraint).

  This looks like a contradiction only if one demands a unified metaphysical theory. But as an institutional practice, it is robust. It treats the machine as a **safety device** and the human text as a **communication device**.

  The tension you identified regarding Gödel is neutralized because the profession does not claim the machine *generates* the insight. The machine certifies the *consequences* of the insight. The anti-mechanist can comfortably say: "The human had the insight that the theorem is true; the machine merely confirmed that our formalization of that insight contained no logical slips."

  **Conclusion:**
  The practice rests on the distinction between **certification** (which can be mechanical) and **understanding** (which is currently treated as human). It is internally coherent because it does not claim that certification *constitutes* understanding. It would only become incoherent if the profession began to claim that a terabyte certificate *without* a human narrative constituted a complete mathematical contribution. As long as the "readable exposition" remains a norm, the profession safeguards the idea that mathematics is a human activity, even as it outsources the guarantee of its correctness to machines. The tension is not a bug; it is a feature of a community trying to maximize reliability without sacrificing intelligibility.
