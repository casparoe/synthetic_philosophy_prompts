answer: |-
  # JOINT STATEMENT ON THE BADNESS OF DEATH
  **Adversarial Collaboration between Proponent A (Epicurean) and Proponent B (Deprivationist)**

  ### 1. Agreed Claims

  After ten years of dialectical exchange, we endorse the following propositions as the common ground of our dispute. We agree that any viable theory of death's badness must accommodate these constraints:

  1.  **The Phenomenal Constraint:** Death is not bad for its subject in the manner of pain, suffering, or humiliation. Unlike these states, death (and being dead) possesses no phenomenal character; there is no "what it is like" to be dead. Consequently, death cannot be an *experiential* evil.
  2.  **The Subject/World Distinction:** The question under debate is strictly whether death is bad *for the person who dies*. We distinguish this from the claim that death is bad *simpliciter* (e.g., a tragedy for the world, a loss for loved ones, or a reduction in total aggregate welfare). We agree that death may be bad in these latter senses even if it is not bad for the decedent.
  3.  **The Symmetry Challenge:** The "Lucretian Symmetry" argument (comparing post-mortem non-existence to pre-natal non-existence) constitutes a genuine prima facie puzzle for the Deprivationist position. It cannot be dismissed merely by asserting that we care more about the future than the past; an explanation is required for why the direction of time creates an asymmetry in misfortune if the state of non-existence is identical in both cases.
  4.  **The Timing Problem:** If death is a misfortune for the one who dies, pinpointing *when* this misfortune obtains is a genuine difficulty that neither side has fully dissolved. We agree that standard models of time and predication struggle to locate the harm: it does not occur when the subject is alive (as they are not yet dead), nor when the subject is dead (as they do not exist), nor clearly at the instant of death (which is too brief to ground a lifelong misfortune).

  ### 2. Disagreements Table: Residual Differences

  Our primary divergence concerns the interpretation of the phrase "bad for." We have isolated two distinct readings: the **Comparative Reading** (a life containing death is worse than the relevant counterfactual continuation) and the **Predicative Reading** (a specific state of affairs constitutes a misfortune *of* a subject).

  | Issue | Comparative Reading (Life Value) | Predicative Reading (Subject Misfortune) | Status of Disagreement |
  | :--- | :--- | :--- | :--- |
  | **Definition** | "Bad for" means the actual world containing the death has less value *for the subject* than the possible world where they survive. | "Bad for" means there is a property of "being harmed" that attaches to the subject at a specific time. | **Verbal:** We agree that if "bad for" means *only* the Comparative Reading, the Deprivationist is correct. The Epicurean accepts the comparison but denies it entails harm. |
  | **Existence Requirement** | Does the subject need to exist at the time the comparison holds true? | Does the subject need to exist at the time the harm is *received*? | **Substantive:** This is the core disagreement. The Epicurean insists harm requires a bearer who exists when the harm obtains. The Deprivationist denies this, arguing counterfactual dependence is sufficient. |
  | **Symmetry Resolution** | Pre-natal non-existence is not "bad" because there was no prior subject to be deprived of a longer past. | Post-mortem non-existence is "bad" because there was a prior subject who is deprived of a future. | **Substantive:** Even resolving the verbal ambiguity, we disagree on whether the *direction* of deprivation matters morally. |
  | **Survival of Disagreement** | **Resolved (Verbal):** If we define "bad for" strictly as "reduces the total goods in a life narrative," the Epicurean concedes the description but rejects the normative weight. | **Unresolved (Substantive):** The Epicurean maintains that a "misfortune" without an existing subject is a category error. The Deprivationist maintains that "misfortune" is a relation between a person and a possible history, not a state of a person. |

  **Summary of Resolution:** Resolving the ambiguity reveals that much of our debate was verbal regarding the *description* of the loss (Deprivationist wins on the math of goods), but substantive regarding the *metaphysics of harm* (Epicurean wins on the requirement for an existing bearer). The residual substantive disagreement is: **Can a relation to a non-existent future constitute a harm to a subject who no longer exists?**

  ### 3. Cruxes

  The following subquestions represent the pivot points of our collaboration. Settling any one of these would significantly shift the dialectical landscape.

  | Crux | Test Case / Argument | Epicurean Prediction | Deprivationist Prediction |
  | :--- | :--- | :--- | :--- |
  | **The Existence Requirement** | **Case:** A standard untimely death. <br>**Question:** Must a subject exist at time *t* to be harmed at time *t*? | **Yes.** Harm is a state of a subject. No subject, no harm. "Where death is, the one who died is not." | **No.** Harm is a comparative relation between actual and possible histories. The subject's *past existence* grounds the relation. |
  | **The Content of the Future** | **Case A:** A person dies one day before a lifetime of bliss begins.<br>**Case B:** A person dies one day before a century of agonizing misery begins. | **Neutral.** Death is equally neutral in both cases. The subject experiences neither bliss nor misery. | **Divergent.** Death is a great misfortune in Case A (deprivation of goods) and potentially a benefit in Case B (prevention of bads). |
  | **Posthumous Harm** | **Case:** A promise made to a person is betrayed immediately after their death. <br>**Question:** Is the dead person harmed by the betrayal? | **No.** The person is gone. The betrayal harms the living or violates abstract moral law, but not the dead subject. | **Yes.** The betrayal alters the narrative value of the life that was lived. The subject is harmed because their life's meaning is retroactively diminished. |
  | **The Symmetry Breaker** | **Argument:** We do not regret pre-natal non-existence. Why regret post-mortem non-existence? | **Validation.** This confirms non-existence is never bad for the subject. Our asymmetry is psychological, not metaphysical. | **Challenge.** We must identify a relevant difference (e.g., the "investment" of a life already lived) that breaks the symmetry without begging the question. |

  ### 4. Closing Stipulation: Metaphysics of Time

  **Stipulation:** We agree to frame the entirety of this statement within **Eternalism** (the view that past, present, and future times and their contents are equally real). We adopt this frame because it provides the most robust truthmakers for the Deprivationist's counterfactual comparisons (i.e., the "lost future" exists as a coordinate in logical space to be compared against the actual timeline).

  **Impact of Presentism:**
  In a final assessment of how our positions would fare under **Presentism** (the view that only the present moment is real), we note the following: The Deprivationist acknowledges that their position is significantly more difficult to maintain under Presentism, as the "future goods" which ground the badness of death literally do not exist to be lost. For the Deprivationist, the metaphysics of time is **load-bearing**; without Eternalism (or a robust theory of truth about the future), the deprivation account loses its ontological grounding. The Epicurean, conversely, views the metaphysics of time as **convenient but not load-bearing**. While Presentism aligns naturally with the Epicurean intuition that "only the present exists, and the dead are not present," the Epicurean argues that the "No Subject" argument holds regardless of temporal ontology: even in an Eternalist block universe, the *person* (as a conscious locus) does not occupy the time-slice of their death. Therefore, a shift to Presentism would weaken the Deprivationist position disproportionately, potentially collapsing the substantive disagreement into a straightforward victory for the Epicurean view.
