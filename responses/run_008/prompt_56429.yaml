          3.  *Cruxes:* Subquestions where settling them moves a party. Must include arguments/test cases (one blissful day, worsening misery, existence requirement, posthumous harm) with predictions.
          4.  *Closing Stipulation:* Framed within Eternalism. Final paragraph on Presentism's impact and whether metaphysics is load-bearing.
      *   **Tone/Style:** Precise, non-vacuous, non-slanted, clear to an outside reader.

  2.  **Drafting Section 1: Agreed Claims:**
      *   *Constraint:* Must include specific points (phenomenal character, subject vs. world, symmetry, timing).
      *   *Drafting:*
          1.  *Phenomenal Character:* Death lacks the "felt" quality of pain. It's not an experience.
          2.  *Subject vs. World:* Distinguish "bad for the person" from "bad simpliciter" (sad for others, worse world).
          3.  *Symmetry:* Lucretius' argument (pre-birth vs. post-death) is a challenge for Deprivationists, not easily dismissed.
          4.  *Timing:* When does the harm occur? Before? After? At the moment? Both admit this is unresolved.
      *   *Refinement:* Ensure language is neutral. Use "We agree..."

  3.  **Drafting Section 2: Disagreements Table:**
      *   *Constraint:* Focus on "bad for" ambiguity (Comparative vs. Predicative). Identify verbal vs. substantive.
      *   *Analysis:*
          *   *Comparative:* Is the actual life worse than the counterfactual? Deprivationist says Yes. Epicurean might concede this *description* but deny it implies harm *to the subject*.
          *   *Predicative:* Is there a state of affairs that is a misfortune *of* the person? Epicurean says No (no subject). Deprivationist says Yes.
      *   *Verbal Disagreement:* If "bad for" just means "makes the life narrative worse compared to alternatives," the Epicurean might accept the logic but reject the label "harm."
      *   *Substantive Disagreement:* Does harm *require* an existing subject at the time of the harm? This is the core metaphysical/ethical clash.
      *   *Structure:* Create a table or clear list format.

  4.  **Drafting Section 3: Cruxes:**
      *   *Constraint:* Subquestions, arguments/test cases, predictions from both sides.
      *   *Required Cases:* One blissful day, worsening misery, existence requirement, posthumous harm.
      *   *Drafting Crux 1 (Existence Requirement):* Does harm require an existing subject?
          *   *Case:* Standard death.
          *   *Epicurean:* Yes, requires existence.
          *   *Deprivationist:* No, can be retroactive or atemporal.
      *   *Drafting Crux 2 (Magnitude/Content of Future):* Does the *quality* of the lost future matter?
          *   *Case:* 1 blissful day vs. 100 years misery.
          *   *Epicurean:* Death is neutral in both.
          *   *Deprivationist:* Bad in first, good (or less bad) in second.
      *   *Drafting Crux 3 (Posthumous Events):* Can events after death harm?
          *   *Case:* Broken promise.
          *   *Epicurean:* No subject to harm.
          *   *Deprivationist:* Yes, affects the narrative/value of the life.
      *   *Refinement:* Ensure predictions are clear.

  5.  **Drafting Section 4: Closing Stipulation (Metaphysics of Time):**
      *   *Constraint:* Frame within Eternalism. Discuss Presentism impact. Is metaphysics load-bearing?
      *   *Analysis:*
          *   *Eternalism:* Helps Deprivationist (future goods are real coordinates to compare against).
          *   *Presentism:* Hurts Deprivationist (future doesn't exist to be lost). Helps Epicurean (only now exists, dead person doesn't).
          *   *Load-bearing:* Deprivationist relies heavily on Eternalism (or at least truthmakers for counterfactuals). Epicurean is more comfortable with Presentism but doesn't strictly need it (logic holds regardless, but Eternalism makes the "non-existence" claim stronger).
      *   *Drafting:* State the Eternalist frame. Then the paragraph on Presentism.

  6.  **Review and Refine:**
