answer: |-
  This is a sophisticated character problem. You have built Marianne on the classic psychological tension of *akrasia* (acting against one's better judgment), but you have layered it with specific constraints regarding *audience* and *structure*. To keep her consistent, we need to determine which constraint is the dominant variable in her decision-making matrix.

  Here is an analysis of your candidate rules, their predictions for the marathon, a verdict on her likely behavior, and a test case to settle the ambiguity.

  ### 1. Evaluating the Candidate Rules

  Let's stress-test your three hypotheses against the six data points you've established.

  **Rule A: The Social Contract (Self = Break, Other = Keep)**
  *   **Fits:** The Sunday Run (Self, Failed), The Manuscript (Self, Failed), The Friend's Move (Other, Succeeded), The Editor Deadline (Other, Succeeded).
  *   **Strains:** The Dessert Scene. She made a social signal of discipline (declining gracefully) but broke the implicit social contract of the dinner party (shared experience) by eating alone later. More importantly, she lied to the group about her habits. This suggests she values the *appearance* of reliability over *actual* reliability.
  *   **Status:** Plausible, but complicated by the fact that she performs virtue rather than practicing it.

  **Rule B: The Structure Rule (Discrete/Crisis = Success, Routine/Grind = Failure)**
  *   **Fits:** The Sunday Run (Routine, Failed), The Museum (Routine/Enrichment, Failed), The Manuscript (Long-term Grind, Failed).
  *   **Fits:** The Friend's Move (Discrete Event, Succeeded), The Editor Deadline (Discrete Crisis, Succeeded).
  *   **Status:** Very Strong. This aligns with the "mid-list novelist" archetype who thrives on the panic of a deadline but cannot sustain the daily quiet of the craft. It distinguishes between *events* and *habits*.

  **Rule C: Hyperbolic Discounting (Smaller-Sooner Reward vs. Larger-Later)**
  *   **Fits:** Almost everything. She chooses Bed over Run (Sooner comfort), Cake over Health (Sooner taste), Procrastination over Manuscript (Sooner relief).
  *   **Nuance:** She only overrides this when the "Later" penalty becomes "Immediate." (e.g., If she misses the move, the friend is stranded *now*. If she misses the deadline, the contract is breached *now*.)
  *   **Status:** Strong, but this is the *mechanism* of her failure, not necessarily the *rule* of her success. It explains why she fails, but Rule B explains when she succeeds.

  ### 2. Predictions for the Marathon Commitment

  Here is how each rule forecasts the marathon training (3x week, 5:30 AM, 4 months, Friend-dependent).

  *   **Rule A (Social) Predicts:** **Success.** She showed up hungover for the move. She will show up exhausted for the run. The friend's dependence overrides her physical discomfort.
  *   **Rule B (Structure) Predicts:** **Failure.** This is a *routine*, not a *crisis*. It requires self-generated arousal four months in advance of the actual "event" (the race). The friend is a partner, not a boss; there is no hard deadline until the race day, which is too far away to trigger panic.
  *   **Rule C (Discounting) Predicts:** **Failure (with exceptions).** Every morning at 5:30 AM, the bed is a *certain, immediate* reward. The friend's disappointment is an *abstract, delayed* cost. Unless the friend threatens to end the friendship *immediately* upon a missed run, the bed wins.

  ### 3. The Verdict

  **Marianne fails the marathon commitment.**

  **Reasoning:**
  Rule B (Structure) is the strongest predictor of her behavior. Marianne is a "crisis worker." She functions when the building is on fire (Editor deadline, Friend stranded by move). She does not function when the goal is to prevent a fire four months from now (Marathon training, Manuscript).

  The marathon training is structurally identical to the Sunday Run (Morning, Routine, Self-propelled), merely with a social passenger. The "Friend's Move" was a discrete rescue mission; the marathon is a grind.

  **However, the Dessert Scene modifies *how* she fails.**
  Because of the dessert incident, we know Marianne manages *shame* through performance. She will not simply ghost the friend.
  1.  **Weeks 1-3:** She succeeds. The novelty and initial social pressure work.
  2.  **Week 4:** She misses a run. The immediate comfort of bed wins (Rule C).
  3.  **The Aftermath:** She does not admit she chose bed. She invents a "crisis" to excuse the failure. She tells the friend, "I was up all night fixing a plot hole," or "I had a migraine." She uses her work (the other failure point) as the excuse for her fitness failure.
  4.  **The End:** She bows out gracefully, citing an injury or schedule conflict, preserving the *appearance* of reliability (Rule A) while succumbing to the *reality* of the routine (Rule B).

  This keeps her intelligently self-aware: she knows she is lying, she knows she is weak, but she cannot stop the slide.

  ### 4. The Test Case

  To cleanly distinguish Rule A (Social) from Rule B (Structure) in a future chapter, you need a task that is **Socially High-Stakes** but **Structurally Routine**.

  **The Scenario:**
  A friend asks Marianne to be the **Accountability Partner** for a daily task. Specifically: *"I'm trying to quit smoking. Can you text me every single evening at 8 PM to ask if I've smoked? I need to know you're waiting for that text."*

  *   **If she does it (Rule A Wins):** She maintains the daily text for the duration. The social obligation overrides the routine fatigue. This would imply the Marathon failure was due to the *physical* exertion, not the routine.
  *   **If she fails (Rule B Wins):** She does it for a week, then "forgets" (chooses the sooner reward of not engaging), then apologizes profusely. This confirms that *no amount of social pressure* can sustain a routine for her.

  **Why this works:** It removes the physical barrier of the run (she can text from bed) and the discrete deadline of the move. It isolates the *daily repetition* against the *social promise*.

  ### 5. Re-evaluating the Dessert Scene

  You are right to worry that the dessert scene is doing more work than intended. Currently, it is the most psychologically revealing moment you have written.

  **The Unintended Implication:**
  The dessert scene shifts Marianne from "Weak-Willed" to "Performative."
  *   **Weak-Willed:** "I want cake, I eat cake, I regret it."
  *   **Performative:** "I want cake, I *say* no to look good, I eat cake where no one sees, I feel no regret, only relief."

  **Does this break the character?**
  No, it deepens her. It suggests her "intelligent self-awareness" is actually a tool she uses to curate her image, not to fix her life. She understands her flaws well enough to hide them, not enough to cure them.

  **How to use this:**
  In the marathon chapter, seed this behavior early. When she agrees to the marathon, have her post about it on social media *before* the first run. "So excited to start this journey!"
  When she starts failing, have her continue posting vague, inspirational quotes about discipline.
  This aligns the marathon failure with the dessert scene: she is maintaining the *brand* of Marianne-the-Disciplined-Novelist while privately being Marianne-the-Bed-Lover.

  **Summary:**
  Let her fail the marathon training. It is more true to the "Routine vs. Crisis" dynamic established by the manuscript and the Sunday runs. But let her lie about *why* she failed, which honors the "Social/Performative" dynamic established by the dessert scene. This makes her consistent, tragic, and recognizably human.
