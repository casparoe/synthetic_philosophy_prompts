      *   **The Great Divergence (Pomeranz/California School):** Argues that core regions (England vs. Yangzi Delta) were similar in living standards and market sophistication until c. 1750-1800. The split was due to *contingent* factors (coal geography, New World land bonus), not deep institutional/cultural differences.
      *   **The Tension:** If Pomeranz is right, the Needham Question (framed as "Why did China fail over 500 years?") is based on a false premise (that China was falling behind earlier). If the split was late and contingent, there's no deep cultural failure to explain.
