  3.  **Philosophical Framework (Contrastive Explanation):**
      *   A "Why X rather than Y?" question requires a *foil* (Y) and a *presupposition* (that X and Y were comparable candidates).
      *   To answer it, you must identify a *difference-maker*.
      *   If the presupposition is false (e.g., Y was never a candidate), the question is ill-posed (erotetic logic).

