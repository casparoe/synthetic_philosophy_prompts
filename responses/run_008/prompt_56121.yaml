      *   **(d) Generalization (Voting, Newcomb):**
          *   *Voting:* Ex ante, organizing a voting bloc is good. Ex post, my single vote is futile. Policy view says "Vote" (as part of a policy). Node view says "Don't Vote" (causal dominance).
          *   *Newcomb:* Ex ante, be a one-boxer. Node view (causal) says two-box.
          *   *Defeater:* If the logic doesn't hold in these cases (e.g., if voting is causally efficacious in a way AMD isn't), the analogy fails.
