          *   *Assessment:* It's a foundational disagreement about the *locus* of rationality. It's not empirically falsifiable, but it can be theoretically undermined (e.g., by showing it leads to Dutch Books or Money Pumps).
          *   *Money Pump:* If I prefer Policy A ex ante, but at the node I prefer Action B, can someone pump money out of me? In AMD, not really, because I can't distinguish the nodes to be pumped *between* them. But if I can pre-commit, I pay for pre-commitment.

  5.  **Structuring the Response:**

      *   **Introduction:** Acknowledge the sophistication of the view (Ex Ante Optimization / Control View). State the goal: evaluate defeaters by severity.
      *   **Category 1: Fatal Defeaters (Internal Coherence & Money Pumps).**
          *   Focus on executability without commitment. If I *know* I'll deviate, is the plan rational?
          *   The "Missing Justification" problem: Why obey the past self?
