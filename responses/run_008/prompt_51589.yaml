answer: |-
  This is a high-risk, high-reward plan. It requires tight facilitation because 75 minutes is extremely tight for two distinct intuition pumps plus a rigorous debrief. If the logistics drag, you lose the philosophy.

  Here is the design for **"The Reference Protocol."**

  ### **Logistics & Materials**
  *   **Room:** Seminar table preferred. If rows, clear space for movement.
  *   **Groups:** 3 Teams of 5 students (Alpha, Beta, Gamma).
  *   **Materials:**
      *   3 Sealed Envelopes labeled "CONFIDENTIAL: TEAM ALPHA," etc.
      *   1 "Public Record" sheet (projected or whiteboard).
      *   3 Small vials (clear water), labeled **"ZORP."**
      *   3 Sealed "Lab Report" envelopes (to be opened mid-Phase 2).
      *   Play money or poker chips (for betting).
      *   A small prize (chocolate, coffee voucher).
  *   **Roles:**
      *   **Instructor:** Game Master / Arbiter (Do not explain *why*, only *how*).
      *   **Students:** Investigators.

  ---

  ### **Phase 1: The Belson Chain (30 Minutes)**
  **Goal:** Generate the Gödel/Schmidt intuition and the distinction between fixing reference and giving meaning.

  **1. The Setup (5 mins)**
  *   Divide class into Teams Alpha, Beta, Gamma.
  *   **Alpha (The Dubbers):** Call them to the front. Show them a student volunteer (let's call him "Dave"). Tell Alpha: *"Dave just proved the Reductio Lemma in front of us. We hereby name the prover of the Reductio Lemma 'Belson'."* Dave leaves. Alpha returns to seats.
  *   **Beta (The Chain):** Tell Beta: *"You didn't see the proof. But Alpha tells us that the guy who proved the Lemma is named 'Belson'. You now use the name 'Belson'."*
  *   **Gamma (The Descriptions):** Hand them a dossier. It reads: *"Belson is the famous mathematician who proved the Reductio Lemma in 1990. He is tall, Austrian, and won the Fields Medal."* (Do not mention Dave).

  **2. The Twist (5 mins)**
  *   Announce to the whole class: *"New historical evidence has surfaced. Dave (the guy Alpha saw) did not prove the Lemma. His grad student, Schmidt, did. Dave stole the notebook. Schmidt died in obscurity. No one ever knew Schmidt's name. The public record (Gamma's dossier) remains unchanged."*
  *   **Crucial Instruction:** *"Do not discuss with other teams yet."*

  **3. The Bet (10 mins)**
  *   Distribute betting slips. Each team has 100 chips.
  *   **Question 1 (Actual World):** "When you say 'Belson', who are you referring to? The thief (Dave) or the prover (Schmidt)?"
      *   *Bet chips on Dave vs. Schmidt.*
  *   **Question 2 (Counterfactual):** "Imagine a world where Dave did *not* steal the notebook. Schmidt published it. Dave became a baker. In that world, who is 'Belson'?"
      *   *Bet chips on Dave vs. Schmidt.*
  *   **Question 3 (Existence):** "Imagine a world where *no one* proved the Lemma. Does 'Belson' refer to anyone?"
      *   *Bet chips on Yes vs. No.*

  **4. The Reveal (10 mins)**
  *   Collect bets. Do **not** announce the correct answers.
  *   Ask each team to briefly state *why* they bet where they did. (e.g., "We bet Schmidt because that's who actually did the math.")
  *   **Instructor Move:** If a student says, "It depends on what we *mean* by Belson," interrupt gently: *"I am not asking about your definition. I am asking who you are talking about."*

  ---

  ### **Phase 2: The Zorp Kind (25 Minutes)**
  **Goal:** Generate the Water/H2O intuition and the Epistemic/Metaphysical split.

  **1. The Dubbing (5 mins)**
  *   Place the three vials of clear liquid on the table.
  *   Say: *"This substance is called 'Zorp'. Zorp is the stuff in these vials."*
  *   Pass the vials around. Let them look/smell (it's water).
  *   **Constraint:** Do not say it is water. Do not say it is H2O.

  **2. The Discovery (10 mins)**
  *   Hand each team a sealed "Lab Report."
  *   **Report Content:** *"Analysis Complete. The molecular structure of Zorp is H₂O."*
  *   Give them 2 minutes to process.
  *   **The Counterfactual Bet:**
      *   **Scenario A:** "In the closest possible world where the liquid in these vials looks and tastes exactly the same but has molecular structure **XYZ**, is that Zorp?"
      *   **Scenario B:** "In the closest possible world where the liquid is H₂O but is purple and tastes like grape soda, is that Zorp?"
      *   *Bet chips on YES vs. NO.*

  **3. The Lock (10 mins)**
  *   Collect bets.
  *   Ask: *"Could we have been wrong about Zorp being H₂O before we opened the lab report?"* (Bet chips: Yes/No).
  *   Ask: *"Now that we know, could Zorp be something else?"* (Bet chips: Yes/No).

  ---

  ### **The Debrief (20 Minutes)**
  **Goal:** Map the game mechanics to Kripkean terminology without validating one team's bets as "correct" immediately. Focus on the *conflict*.

  **1. The Data (5 mins)**
  *   Project the betting results. You will likely see a split.
      *   *Phase 1:* Some teams will bet on the Description (Gamma usually), some on the Causal Chain (Alpha/Beta).
      *   *Phase 2:* Most will bet that XYZ is *not* Zorp (Rigid), but that we *could have been wrong* initially (Epistemic).
  *   Point out the tension: *"Team Alpha, you said Belson is Schmidt (the prover), but Team Gamma, you said Belson is Dave (the famous name). You are using the same word, but your bets show you aren't tracking the same object."*

  **2. The Mapping (10 mins)**
  *   **Fixing Reference vs. Giving Meaning:**
      *   *Point to Phase 1:* "When I told Alpha 'This is Belson,' that was a **dubbing**. When I gave Gamma the dossier, that was a **description**. The game forced you to choose: does the name stick to the person (Dave/Schmidt) or the description (Prover of Lemma)?"
      *   *Introduce Term:* **Rigid Designator**. "If you bet that 'Belson' refers to Schmidt even in the world where he wasn't famous, you treated the name as rigid. It picks out the same guy in every world where he exists."
  *   **Epistemic vs. Metaphysical Modality:**
      *   *Point to Phase 2:* "Before you opened the Lab Report, was it possible Zorp was XYZ?" (Students: "Yes, epistemically.")
      *   "After you opened it, in the counterfactual world, was the XYZ stuff Zorp?" (Students: "No, metaphysically.")
      *   *Introduce Term:* **A Posteriori Necessity**. "You discovered the identity (H2O) through experience (Epistemic), but once discovered, you treated it as necessary (Metaphysical). You felt you *couldn't* call XYZ 'Zorp' even if it looked identical."

  **3. The Payoff (5 mins)**
  *   Award the prize to the team that showed the most *consistency* between their Phase 1 and Phase 2 bets (i.e., those who treated Names and Kinds similarly).
  *   **Closing Line:** "Kripke's claim is that your intuition in this game isn't just a habit. It's a clue about how language hooks onto reality. Next week, we ask: why?"

  ---

  ### **Troubleshooting: Predictable Failures**

  **1. The "Smug Kripkean"**
  *   **Risk:** A student who read the book interrupts Phase 1 saying, "Obviously it's Schmidt because names are rigid designators."
  *   **Fix:** Pre-empt this in the rules. *"This is a phenomenology game. I am not testing your knowledge of philosophy. I am testing your linguistic intuitions. If you use technical terms like 'rigid designator' or 'possible world semantics' during the betting phase, your team loses 50 chips."*
  *   **Advanced Move:** If they persist, give them a secret role. Pull them aside during the betting: *"I know you know the theory. Your job is to play Devil's Advocate for the Description Theory. Try to convince your team why the dossier matters more than the dubbing. Can you make that case?"* This turns a spoiler into a pedagogical tool.

  **2. The "Lawyer"**
  *   **Risk:** "Well, it depends on how we defined 'Belson' in the dossier. If the dossier is a stipulation, then Belson is Dave."
  *   **Fix:** Do not engage in the metaphysics during the game. Use the **Usage Test**. *"I'm not asking about the definition. I'm asking: If you met Schmidt at a bar, would you say 'Hey Belson'? Yes or No. Bet on your gut."* Force them off the meta-language and into the usage.

  **3. Time Creep**
  *   **Risk:** Phase 1 discussion drags on.
  *   **Fix:** Use a visible timer. When the timer hits zero, betting slips must be in. No late bets. If Phase 1 runs over, truncate Phase 2 Scenario B (the purple H2O). Keep the XYZ scenario; it's the crucial one.

  **4. The "It's Just Semantics" Objection**
  *   **Risk:** Students conclude the game proves nothing about the world, only about English usage.
  *   **Fix:** This is actually a *good* objection, but save it for the end of the debrief. Acknowledge it: *"You're right. This game shows how we use words. Kripke's bold move is to argue that how we use words reveals the structure of the world. Whether he's right is what we're debating for the next three weeks."*

  ---

  ### **Limitations: What This Activity Cannot Do**

  You are correct to be skeptical about the bridge from **Semantic Intuition** to **Metaphysical Necessity**.

  **1. The Gap**
  The activity successfully generates the *intuition* of rigidity. Students will feel that "Belson" *should* refer to Schmidt, and "Zorp" *should* be H2O. However, this only proves that our *language* behaves rigidly. It does not prove that *essences* exist in the world.
  *   **What the activity shows:** We are unwilling to apply the name "Zorp" to XYZ stuff.
  *   **What Kripke needs:** That Zorp *could not be* XYZ stuff.
  *   **The Missing Link:** Essentialism. The activity doesn't prove that H2O is the *essence* of water, only that we treat it as the *criterion of identity* for the word "Zorp." A descriptivist could argue, "You've just shown that 'is H2O' is a necessary *property* in our concept of Zorp, not that Zorp has a metaphysical essence."

  **2. What You Must Supply by Hand**
  In the debrief (or the following lecture), you must explicitly make the jump they cannot make themselves:
  *   **From Concept to Object:** Explain that Kripke argues these intuitions aren't just about our concepts (Fregean *Sinn*), but about the objects themselves.
  *   **The Modal Argument:** You will need to write out the formal modal argument on the board *after* the game.
      1.  If 'Zorp' is rigid, it refers to the same stuff in all possible worlds.
      2.  If 'H2O' is rigid, it refers to the same stuff in all possible worlds.
      3.  If 'Zorp = H2O' is true in the actual world, and both are rigid, it is true in all possible worlds.
  *   **Why the Game Isn't Enough:** The game relies on their *reluctance* to call XYZ "Zorp." You need to explain that this reluctance is evidence of a deeper metaphysical commitment, not just a linguistic rule.

  **3. The "Closest World" Problem**
  Students often struggle with "closest possible world." In the game, they might imagine the XYZ world as a "distant" world (magic land).
  *   **Fix:** In the debrief, clarify: *"When I asked about the XYZ world, I meant the world that is exactly like this one, except for the microstructure of the liquid. Not a fantasy world. The world that is minimally different."*

  ### **Summary of Instructor Mindset**
  *   **During the Game:** Be a neutral arbiter. Do not nod when they give Kripkean answers. Do not frown when they give Descriptivist answers. Your face must be a poker face.
  *   **During the Debrief:** Be the cartographer. "Here is where you went. Here is where the theory says you went. Let's look at the map."
  *   **On the Limitation:** Be honest. "This game makes you feel the pull of rigidity. It doesn't prove the world is rigid. That's the argument for next week."

  This plan respects the 300-level constraint: it treats them as philosophers capable of holding conflicting intuitions, rather than vessels to be filled with "The Kripke View." Good luck.
