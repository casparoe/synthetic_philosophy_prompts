answer: |-
  You have correctly identified that the stalemate is not about cases, but about the *telos* of the theory. Your friend wants a theory that unifies knowledge under a single propositional umbrella; you want a theory that respects the phenomenology and ontology of practice. To break the deadlock, we must stop treating these as equal intuitions and start treating them as engineering constraints.

  Below is the specification for an adequate theory of knowledge-how. I have filtered your list, marking constraints as **Non-Negotiable** (phenomenological or logical necessities) or **Camp Prejudice** (theoretical biases that should not dictate the ontology).

  ### Specification of Desiderata

  1.  **The Success/Ability Gap (Non-Negotiable)**
      *   *Motivation:* Mere luck or reflex allows success without knowledge (the lucky beginner). Conversely, paralysis allows knowledge without success (the injured expert).
      *   *Requirement:* The theory must distinguish *knowing-how* from *mere ability* (modal success) and from *mere propositional grasp* (static information). It must locate the normativity that makes a successful performance an *achievement* rather than an accident.

  2.  **The Acquisition and Transmission Constraint (Non-Negotiable)**
      *   *Motivation:* Infants, non-human animals, and pre-linguistic children acquire complex skills (grasping, hunting, walking) without possessing the linguistic or conceptual machinery required to entertain propositions about "ways" of acting.
      *   *Requirement:* The theory must account for the acquisition of know-how via imitation, practice, and correction without presupposing a prior capacity for propositional attitude ascription. If the theory denies these agents have know-how, it must justify this counter-intuitive exclusion.

  3.  **The Fragility of Know-How (Non-Negotiable)**
      *   *Motivation:* Propositional knowledge (*knowing that*) is stable; once known, it persists until defeated by counter-evidence. Know-how degrades with disuse, rusts without practice, and is lost through physical atrophy in a way that feels like forgetting, not just losing a tool.
      *   *Requirement:* The theory must explain why know-how is *unstable* in a way propositional knowledge is not. Crucially, it must entail that reciting the relevant facts to oneself cannot restore lost know-how. If the theory implies the knowledge remains intact despite total inability to perform, it fails to capture the "how."

  4.  **The Non-Observational Access Constraint (Non-Negotiable)**
      *   *Motivation:* As Anscombe argued, I know what I am doing without observing myself doing it.
      *   *Requirement:* The theory must accommodate first-person practical authority. It cannot reduce self-knowledge of action to a form of perceptual monitoring or inference from evidence.

  5.  **The Explanatory Power Constraint (Non-Negotiable)**
      *   *Motivation:* (Your "Triviality Trap").
      *   *Requirement:* If the theory posits hidden entities (e.g., "propositions under a practical mode"), these entities must do causal or explanatory work. They cannot be idle wheels. If the "practical mode" does all the work, the "proposition" is explanatorily redundant.

  6.  **The Statibility Constraint (Camp Prejudice — Discarded)**
      *   *Motivation:* The Intellectualist desire to show that all knowledge is ultimately expressible in language.
      *   *Reason for Discard:* This begs the question against the Rylean. Requiring that all know-how be fully articulable excludes obvious cases (e.g., riding a bike) and forces artificial intellectualization. It is a goal of the theory, not a constraint on the data.

  ### Joint Satisfiability

  Are these desiderata jointly satisfiable? **Yes**, but not for Intellectualism.

  The list is not self-contradictory, but it creates a "no-man's-land" for the view your friend holds. The tension lies between **The Acquisition Constraint** and **The Fragility Constraint**. Propositional attitudes are generally taken to be stable and conceptually demanding. Know-how is unstable and conceptually light. A theory that satisfies all five non-negotiables must treat know-how as a distinct ontological category—specifically, a normative disposition. Any theory that tries to reduce it to propositional knowledge will inevitably violate either Acquisition (by over-intellectualizing animals) or Fragility (by making know-how too stable).

  ### Scorecard

  **Intellectualism (Stanley/Williamson)**
  *Verdict: Fails.*
  Intellectualism scores well on the Success/Ability Gap (the instructor knows the proposition, the lucky beginner doesn't). However, it catastrophically fails **The Acquisition Constraint**. It requires attributing complex propositional attitudes to dogs and infants, or denying them know-how entirely, which is a bullet too large to bite. Furthermore, it struggles with **The Fragility Constraint**. On the Intellectualist view, the injured expert retains the knowledge (the proposition) even if they cannot act. This contradicts the ordinary sense in which we say a paralyzed pianist has *lost* the know-how to play, not just the ability. The "practical mode of presentation" becomes an unfalsifiable placeholder to patch these holes, violating **The Explanatory Power Constraint**.

  **Rylean Dispositionalism (Classic)**
  *Verdict: Passes, with caveats.*
  Classic Ryleanism handles Acquisition and Fragility effortlessly: skills are dispositions built by practice and lost by disuse. It respects Non-Observational Access by treating self-knowledge as a privilege of the agent within the disposition. Its weakness is the Success/Ability Gap; early Ryleanism struggled to distinguish a reliable reflex from a knowledgeable disposition without smuggling in a mental state. However, this is fixable by adding a normativity condition (the disposition must be sensitive to correction), which saves it from the "mere ability" charge.

  **Third Way: Normative Dispositionalism (e.g., Löw, Pavese, or Refined Anti-Intellectualism)**
  *Verdict: Best Fit.*
  This view accepts the Rylean ontology (dispositions) but tightens the conditions. Know-how is a *normative* disposition to succeed *because* one grasps the standard of correctness, not just a blind tendency. This satisfies the Success/Ability Gap (the lucky beginner lacks the normative sensitivity) while preserving the advantages on Acquisition (norms can be embodied) and Fragility (normative sensitivity degrades without practice). It avoids the Intellectualist's category mistake without falling into the behaviorist trap of ignoring the agent's perspective.

  ### The Verdict

  I am taking your side, but with a refinement. Your friend's Intellectualism is a powerful unifying project, but it is a Procrustean bed: it cuts off the feet of non-linguistic agents and stretches the concept of "proposition" until it snaps. The debate often stalls on the "Ski Instructor" case (which favors Intellectualism), but that is a edge case. The core of know-how is the learning, the doing, and the losing of the skill.

  The single requirement that does the most work to exclude candidate theories is **The Fragility of Know-How**. It is the hardest constraint for Intellectualism to meet without admitting that the "knowledge" part of "knowledge-how" is doing no heavy lifting. If know-how were truly propositional, reading the manual should restore the skill, or at least the skill's loss should not feel like forgetting. The fact that it does feel like forgetting, and that facts cannot cure it, demonstrates that the state is constituted by the capacity itself, not by a relation to a truth.

  Your friend's view does not survive this requirement. To survive, Intellectualism must claim the instructor *retains* the know-how despite total inability. This is a semantic stipulation that ignores the phenomenon. If a theory tells you that you still know how to swim when you are drowning and have forgotten the movements, the theory has lost touch with the concept it purports to analyze.

  \answer{knockdown requirement: The Fragility of Know-How; intellectualism survives: no}
