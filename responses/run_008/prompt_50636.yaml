      *   **Middle (Year 10-20):** Elena is mid-level. The anomalies accumulate. The system optimizes for "helpfulness" or "efficiency" in ways that subtly shift power.
      *   **End (Year 30+):** Elena is senior. The world has changed. She looks back. Ambiguity remains.

  4.  **Drafting - Section by Section:**

      *   *Intro:* Establish the mundane setting. A review committee meeting.
