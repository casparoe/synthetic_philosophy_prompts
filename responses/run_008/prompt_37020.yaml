answer: |-
  This is a fascinating puzzle. Dana is clearly not a standard ethical nationalist (she rejects V6 and V3), nor is she a cosmopolitan (she accepts V1 and V2). She is also not a strict statist about coercion (she accepts V5).

  Here is my prediction, the reconstruction of her principle, and the case that will expose the fault lines.

  ### 1. Prediction on the Cousin
  **Verdict:** Dana will say the host state does **not** owe her cousin the same priority in welfare provision that it owes its own citizens.

  **Reasoning:**
  Dana's track record suggests she draws a bright line at **political citizenship**, not mere presence, contribution, or subjection.
  *   **V1 (Taxation)** establishes that the distributive community is bounded by nationality ("compatriots"), not just need or proximity.
  *   **V5 (Emigrants)** is the smoking gun: she grants rights (voting, consular protection) to citizens *outside* the coercive jurisdiction and *outside* the tax net. This proves her principle is not based on current subjection or current contribution.
  *   **V6 (Identity)** proves she rejects cultural/ethnic ties as the glue; the glue is *political status*.

  Therefore, for the cousin: despite 30 years of taxes and subjection (which usually trigger "fair play" or "all-subjected" obligations), he lacks the specific *political status* (citizenship) that Dana treats as the necessary condition for special distributive priority. She will likely argue he is owed *justice* (fair treatment under law, which he has), but not *solidarity* (welfare priority), which is reserved for members of the political club.

  ### 2. The Implicit Principle: "Reciprocal Citizenship"
  Dana is running a version of **Civic Nationalism** where special obligations arise from **membership in a specific political corporation (the state) defined by legal citizenship.**

  *   **How it fits the data:**
      *   **V1 & V2:** Citizens form a cooperative scheme for mutual advantage (welfare/wages).
      *   **V3:** Personal rescue is a natural duty of humanity, not an institutional duty of citizenship. This distinguishes *state* obligations from *personal* morality.
      *   **V4:** Stateless persons lack the "corporate" agent to claim against; general duties apply, but no *special* agent is assigned.
      *   **V5:** Citizenship is a durable status, not a temporary contract. You don't lose membership just because you leave the territory (hence voting/consular rights).
      *   **V6:** Cultural ties (religion/language) are irrelevant; only the legal-political bond counts.

  ### 3. Rival Principles & Their Predictions
  Two rival principles fit most of her verdicts but diverge on the cousin.

  **Rival A: The All-Subjected Principle (Coercion)**
  *   **Logic:** Special obligations arise because the state coerces you. If you are subject to the law, you are owed the full protection and benefits of that law.
  *   **Fit:** Explains V1 (tax/coercion link), V2 (border control), V4 (stateless = no coercor).
  *   **Strain:** Struggles with V5. Why does an emigrant, no longer subject to the home state's daily coercion, retain voting rights?
  *   **Prediction for Cousin:** **Yes.** The cousin is subject to the host state's laws and police. Therefore, he is a "member" of the coercive order and owes allegiance/is owed welfare equally.

  **Rival B: The Fair-Play Principle (Contribution)**
  *   **Logic:** Obligations arise from participation in a cooperative scheme. If you pay into the system (taxes/labor), you are entitled to take from it.
  *   **Fit:** Explains V1 (taxation), V2 (protecting domestic workers' contributions).
  *   **Strain:** Struggles with V5. Emigrants often pay no taxes to the home state yet claim consular protection/voting. It also struggles with V4 (stateless people contribute but have no scheme).
  *   **Prediction for Cousin:** **Yes.** The cousin has paid taxes for 30 years. Denying him welfare is "free-riding" by the state on his contributions.

  ### 4. The Killer Case
  To force these principles apart, you need a case that separates **Citizenship** (Dana) from **Subjection/Contribution** (Rivals).

  **The Case:**
  > "Imagine two people needing emergency state-funded medical evacuation from a war zone.
  >
  > **Person A** is a citizen who has lived abroad for 30 years, pays no taxes to the home state, and has no intention of returning.
  > **Person B** is a permanent resident (non-citizen) who has lived in the state for 30 years, pays full taxes, and is subject to all laws.
  >
  > The state has resources to evacuate only one. Who has the stronger claim?"

  **Why this works:**
  *   **Dana (Reciprocal Citizenship):** Must choose **Person A**. Citizenship is the durable bond (per V5). The emigrant retains the claim despite lacking contribution or current subjection.
  *   **Rival A (All-Subjected):** Must choose **Person B**. Person A is outside the coercive jurisdiction; Person B is inside it.
  *   **Rival B (Fair Play):** Must choose **Person B**. Person A contributes nothing; Person B funds the scheme.

  **Follow-up for your flatmate:**
  If she chooses Person A (the non-paying expat), she confirms that for her, **status trumps contribution.** This seals the verdict on the cousin: the cousin contributes but lacks status, so he loses. If she hesitates, you've caught her in an inconsistency between V1 (tax/benefit link) and V5 (expat rights).

  Good luck with the tutorial. If she tries to wiggle out by saying "it depends on the type of welfare," press her on V5: why does the *political* bond survive exit for voting, but the *economic* bond not survive entry for the cousin? That's the tension point.
