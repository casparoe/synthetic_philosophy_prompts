      *   **Task:** Predict Dana's verdict on a specific case (the cousin), identify the underlying principle she is likely using, compare it with rival principles that fit her past verdicts, show how those rivals predict differently for the cousin, and propose a "killer case" to distinguish between the principles.
      *   **Tone:** Academic, analytical, precise, but accessible (peer-to-peer).
      *   **Constraint:** The user wants a *prediction* based on the provided list of verdicts, not just a theoretical overview.

  2.  **Deconstruct Dana's Verdicts (The Data Set):**
      *   *V1 (Taxation):* Priority to compatriots over foreigners (even if foreign poverty is greater). -> Suggests Special Obligations to Compatriots.
