      *Self-Correction on V3 (Rescue):* Why does she say no special duty in rescue? This is classic "Institutional Division of Labor." Personal morality != State morality. I should mention this distinguishes her from "Ethical Nationalists" who might say save the compatriot. This reinforces the *Political/Civic* nature of her principle.

