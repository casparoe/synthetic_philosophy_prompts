      *   *V3 (Rescue):* No special duty in personal rescue (compatriot vs. foreigner drowning). -> Suggests a limit to special obligations (maybe institutional vs. personal?).
      *   *V4 (Stateless/Failed State):* Owed help only by general duty, no *particular* agent. -> Suggests duties are tied to *functioning* state structures, not humanity alone.
      *   *V5 (Emigrants):* Strong claims on home state (evacuation, voting, consular). -> Suggests membership persists despite exit (allegiance/blood?).
      *   *V6 (Identity Groups):* Rejects duties to co-religionists, language speakers, diaspora. -> Suggests *political* membership trumps *cultural/ethnic* membership.

  3.  **Evaluate the Candidate Principles:**
      *   *P1: Shared Subjection to Coercion (Associative/Political Obligation).*
          *   Fits: V1 (Tax), V2 (Immigration/Wages).
          *   Strains: V5 (Emigrants). If they leave, they aren't subject to coercion anymore, yet she says they retain claims. V3 (Rescue) fits (personal vs. state). V4 (Stateless) fits (no coercive structure to assign duty).
      *   *P2: National Community as Quasi-Family (Ethical Nationalism).*
          *   Fits: V1 (Tax), V5 (Emigrants).
          *   Strains: V6 (Diaspora/Identity). She explicitly rejects duties based on shared history/culture *unless* it's the specific "national" one. But V3 (Rescue) is hard for strong nationalism (usually nationalists say save the compatriot). V4 (Stateless) is tricky (are they part of the family?).
      *   *P3: Administrative Capacity/Best-Positioned Agent (Institutional Pragmatism).*
          *   Fits: V1 (Tax collection), V4 (Stateless = no agent), V2 (Immigration control).
          *   Strains: V5 (Emigrants). Why is the home state best positioned to protect an emigrant *abroad*? The host state is closer. V3 (Rescue) fits (capacity is equal). V6 (Identity) fits (no administrative link).

  4.  **Synthesize Dana's "Principled Nationalism":**
      *   It's not pure Ethical Nationalism (rejects V6).
      *   It's not pure Coercion (accepts V5).
      *   It looks like a hybrid: **Citizenship as a Reciprocal Political Status.**
      *   *Key Feature:* It distinguishes between *membership* (which persists for emigrants) and *presence/jurisdiction* (which dictates welfare/tax).
      *   *Crucial Distinction:* She separates *welfare/economic distribution* (tied to current contribution/jurisdiction) from *political protection/voice* (tied to enduring citizenship status).
      *   *Wait, look closer at V5:* Emigrants get consular protection and voting. This implies the bond is political/legal, not just cultural.
      *   *Look at V1:* Tax for compatriot poverty. This implies the welfare state is for *current* members.
      *   *Look at V4:* Stateless people have no specific claimant. This implies the duty falls on the *state apparatus* that exists, not humanity.

      *   *Refined Principle:* **Institutional Citizenship.** Duties arise from the reciprocal relationship of citizenship. For residents, this includes welfare (tax/benefit). For non-resident citizens, this includes protection/voice (consular/voting). For non-citizens, duties are general only.
      *   *Why V3 (Rescue) is neutral?* Because rescue is a *natural duty*, not an *institutional obligation*. She distinguishes state duties from personal morality.

  5.  **Analyze the Cousin Case:**
      *   *Facts:* Worked legally abroad 30 years. Pays taxes, subject to laws, protected by police/courts. *No* welfare entitlement. Did not naturalize. Home state functioning.
      *   *Question:* Does the host state owe him welfare priority equal to citizens?
      *   *Applying Dana's Logic:*
          *   He pays taxes (like V1).
          *   He is subject to coercion (like P1).
          *   BUT he is not a *citizen* (V5 implies citizenship is the magic key for special claims).
          *   V2 (Immigration) suggests protecting domestic workers implies a distinction between citizens/residents and outsiders.
          *   V6 suggests shared culture/history isn't enough, but *political status* is.
          *   *Prediction:* She will likely say **No**, the host state does not owe him the *same priority* as citizens, though perhaps more than a tourist. Why? Because she accepts V1 (Tax for compatriots) and V5 (Emigrants keep claims on *home*). If the host state owed him full welfare equality, the distinction in V1 collapses. Her "Principled Nationalism" seems to hinge on *citizenship* as the boundary of the distributive community, not just tax contribution.
          *   *Nuance:* She might say he deserves *some* help because he pays taxes (fairness), but not the *priority* of a citizen (national solidarity). Given V1 (compatriot priority over greater foreign need), she prioritizes the *political bond* over the *economic contribution*.

  6.  **Develop the Rival Principles & Predictions:**
      *   *Rival 1: All-Affected Interests / Contribution Principle (Liberal Egalitarian).*
          *   Logic: If you pay taxes and are subject to laws, you are a member of the scheme.
          *   Prediction for Cousin: **Yes**, he is owed equal welfare. Excluding him is exploitation.
      *   *Rival 2: Strict Ethical Nationalism (Cultural).*
          *   Logic: Shared blood/culture defines the boundary.
          *   Prediction for Cousin: **No**, definitely not. He doesn't share the culture. (Actually, this aligns with Dana, but for different reasons).
      *   *Rival 3: Cosmopolitanism.*
          *   Logic: Borders are morally arbitrary.
          *   Prediction for Cousin: **Yes**, but so is everyone else. (Doesn't fit Dana's V1).

      *   *Better Rival for the "Principle" analysis:*
          *   *Dana's Principle:* **Political Citizenship (Reciprocity of Status).** Membership is binary (Citizen/Non-Citizen). Welfare tracks Citizenship + Residence. Protection tracks Citizenship.
          *   *Rival A:* **Fair Play / Contribution (Associative).** If you contribute, you get benefits.
              *   *Cousin:* Yes, equal welfare.
          *   *Rival B:* **Humanitarian Capacity (Institutional).** States help those within their reach.
              *   *Cousin:* Yes, if he's there, they help him.
          *   *Rival C:* **Cultural Nationalism.**
              *   *Cousin:* No.

      *   *Wait, I need to match the user's prompt:* "Set out which principle she is implicitly running and which rival principles fit her track record nearly as well."
      *   *Dana's Implicit Principle:* **Civic Nationalism with a Residence Caveat.** (Citizenship creates the special bond, but welfare is tied to current participation in the specific cooperative scheme *of citizens*). Actually, looking at V5 (Emigrants get voting/consular), the bond is *Citizenship*. Looking at V1 (Tax for compatriots), the duty is to *Compatriots*. The Cousin is *not* a compatriot of the host state.
      *   *So Dana's Principle:* **Special obligations are generated by Citizenship Status, not mere presence or contribution.**
      *   *Rival 1:* **Coercive Subjection (All-Subjected Principle).** If you are subject to the law, you get the benefits.
          *   *Fits Dana?* Mostly. Fits V1, V2, V4. Strains at V5 (Emigrants aren't subject to home coercion but get rights).
          *   *Cousin Prediction:* **Yes**, he is subject to laws, so he gets welfare.
      *   *Rival 2:* **Reciprocal Fairness (Contribution).** If you pay in, you get out.
          *   *Fits Dana?* Fits V1 (Tax). Strains at V5 (Emigrants don't pay home tax but get consular).
          *   *Cousin Prediction:* **Yes**, he pays taxes, so he gets welfare.

  7.  **Design the "Killer Case":**
      *   Need a case that separates *Citizenship* (Dana) from *Subjection/Contribution* (Rivals).
      *   *Idea:* A non-citizen resident who pays taxes vs. A citizen expat who pays no taxes.
      *   *Better Idea:* **The "Tax-Haven Expat" vs. The "Permanent Resident Alien."**
      *   *Case:* Compare Dana's cousin (Host State) with a Citizen living abroad (Home State).
      *   *Wait, I need a single case to test the principle.*
      *   *Case:* A long-term resident alien who *never* pays income tax (due to loopholes/low income) but is subject to laws, vs. A citizen living abroad who pays *no* tax but is protected.
      *   *Actually, the best divider is the "Non-Resident Citizen" vs "Resident Non-Citizen".*
      *   Dana says Non-Resident Citizen (V5) gets protection/voting. Resident Non-Citizen (V1/V2 logic) gets less welfare priority.
      *   Rival (Coercion) says Resident Non-Citizen gets full rights (subject to laws), Non-Resident Citizen gets none (not subject to laws).
      *   *The Killer Case:* **A citizen who moves abroad permanently and pays zero taxes to the home state, versus a non-citizen who lives there 30 years and pays full taxes.**
      *   *Question:* Who gets the emergency evacuation or welfare support?
      *   *Dana:* Citizen (even if non-resident/non-taxing).
      *   *Rival (Coercion/Contribution):* Resident Non-Citizen (subject to laws/contributes).

  8.  **Drafting the Response:**
      *   *Introduction:* Acknowledge the complexity. Dana is running a specific version of Civic Nationalism.
      *   *Prediction:* No, she won't grant the cousin equal welfare priority.
      *   *Reasoning:* Her principle is **Political Citizenship**, not Contribution or Coercion alone.
      *   *Analysis of Principles:*
          *   *Dana's:* Citizenship as the boundary of distributive justice. (Explains V1, V5, V6).
          *   *Rival 1:* All-Subjected Principle (Coercion). (Explains V1, V2, V4. Fails V5).
          *   *Rival 2:* Fair Play (Contribution). (Explains V1, V2. Fails V5).
      *   *Cousin Predictions:*
          *   Dana: No (Not a citizen).
          *   Rival 1 & 2: Yes (Subject/Taxes).
      *   *The Killer Case:* The "Non-Resident Citizen vs. Permanent Resident" comparison regarding *voting/welfare* specifically. Or, more sharply: **The "Tax-Dodging Expat" vs. The "Tax-Paying Resident."**
      *   *Refining the Killer Case:* To separate Citizenship from Coercion/Contribution.
      *   *Case:* A citizen who renounces tax liability (moves to tax haven) vs. a refugee who cannot work but is present.
      *   *Better:* **The "Dual Citizen in Crisis."** A dual citizen is in a third country. Which state evacuates?
      *   *Best:* **The "Long-Term Resident vs. Absentee Citizen" Welfare Claim.**
