      *   *The Nature of the Stall:* It's a clash between *ideal theory* and *non-ideal agency*. Consequentialism is often formulated as a "God's eye view" standard. Cluelessness attacks the bridge between God's eye view and human eyes. The stall persists because neither side wants to concede their core commitment (either the purity of the theory or the necessity of guidance).
      *   *What Counts as Progress?* Not a solution, but a dissolution or a shift. Progress looks like admitting that "rationality" might not be a single unified thing. Or shifting from "maximizing" to "satisficing" or "robustness." A formal result is unlikely because the problem is metaphysical/epistemic, not mathematical.
      *   *The Final Verdict (for the novel):* Is it a genuine error or a category mistake? It's likely the latter. Ethics (specifically consequentialism) provides a *standard of assessment*, not necessarily a *algorithm for deliberation*. The crisis comes from conflating the two. However, for a civil servant, the *procedure* is what matters. So the crisis is real for *her*, even if the theory survives. This nuance is crucial for the character arc.

