answer: |-
  1. The central question is whether the rational reconstruction of Allais-style preferences necessitates a discontinuous utility function at probability one, or if continuous non-linear probability weighting can account for the phenomena without incurring unacceptable normative costs.
  2. Expected utility theory dismisses these preferences as errors and prospect theory accepts them via continuous weighting, but neither framework definitively settles whether the transition from certainty to uncertainty represents a categorically distinct psychological or normative boundary.
  3. Given the inability to run new experiments, the method will be a comparative conceptual analysis of the axiomatic modifications required by each view to determine which imposes a lighter burden on the overall theory of rational choice.
  4. A positive result will demonstrate that one of these models preserves the normative force of rational choice theory significantly better than the other, thereby dictating whether we should locally restrict independence or abandon linearity globally.
  5. This project will fail if the distinction between discontinuity and steep continuous weighting proves to be merely notational, or if the technical mathematics required to formalize the comparison exceeds the scope of a philosophical term paper.
