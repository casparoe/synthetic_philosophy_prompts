answer: |-
  The non-negotiable requirement is **Normative Clarity regarding whether the audit corrects or preserves historical disparity**, because the subset of desiderata comprising **Calibration Within Groups** and **Error Rate Balance Across Groups** is mathematically jointly unsatisfiable whenever base rates differ and predictions are imperfect.

  ### Desiderata for Algorithmic Fairness Criteria

  1.  **Normative Clarity (Correcting vs. Avoiding Amplification)**
      *   **Case:** Worldly disparities (e.g., differing crime rates or loan defaults due to historical exclusion).
      *   **Requirement:** The criterion must explicitly state whether it treats existing outcome disparities as legitimate baseline data or as bias to be corrected.
      *   **Status:** **Non-negotiable.** Without this, a criterion like Demographic Parity (corrects) and Equalized Odds (avoids amplification) are indistinguishable in intent but opposite in effect.
  2.  **Calibration Within Groups**
      *   **Case:** Differing base rates and impossibility results.
      *   **Requirement:** For any risk score $s$, the probability of the outcome $Y$ given $s$ must be equal across groups ($P(Y|s, A=0) = P(Y|s, A=1)$).
      *   **Status:** **Preference (Conflicting).** Essential for interpretability and utility, but cannot hold simultaneously with Error Rate Balance if base rates differ.
  3.  **Error Rate Balance Across Groups**
      *   **Case:** Differing base rates and impossibility results.
      *   **Requirement:** False positive and false negative rates must be equal across groups ($P(\hat{Y}=1|Y=0, A=0) = P(\hat{Y}=1|Y=0, A=1)$, etc.).
      *   **Status:** **Preference (Conflicting).** Essential for equalizing harm from mistakes, but mathematically incompatible with Calibration under unequal base rates.
  4.  **Proxy Resistance (Construct Validity)**
      *   **Case:** Proxies for protected attributes (e.g., zip code for race).
      *   **Requirement:** The criterion must detect discrimination mediated by variables correlated with protected attributes, not merely direct inputs.
      *   **Status:** **Non-negotiable.** "Blindness" to protected attributes is insufficient for legal or ethical compliance if redlining occurs via proxies.
  5.  **Decision-Process Separation (Score vs. Threshold)**
      *   **Case:** Judging a score vs. judging a threshold.
      *   **Requirement:** The criterion must distinguish between the fairness of the underlying risk estimation and the fairness of the decision cutoff imposed on it.
      *   **Status:** **Preference.** Technically precise, but some stakeholders prefer end-to-end outcome metrics regardless of the score's properties.
  6.  **Subgroup Robustness**
      *   **Case:** Subgroups beyond those named in statute (e.g., intersectional groups).
      *   **Requirement:** The criterion must hold for latent or intersectional subgroups not explicitly audited, preventing "fairness gerrymandering."
      *   **Status:** **Preference/Aspirational.** Computationally difficult to guarantee for all possible subgroups, but necessary for true equity.
  7.  **Task Alignment (Ranking vs. Classification)**
      *   **Case:** Ranking and top-k selection.
      *   **Requirement:** The criterion must be valid for the specific decision structure (e.g., binary approval vs. ranked resume screening).
      *   **Status:** **Preference.** Criteria formulated for binary thresholds often fail or become undefined in continuous ranking contexts.

  ### Evaluation of Common Criteria Against Desiderata

  *   **Demographic Parity:** Fails **Normative Clarity** by implicitly mandating correction of base rate differences regardless of context. Fails **Error Rate Balance** when base rates differ, potentially increasing error rates for qualified candidates in low-prevalence groups.
  *   **Equalized Odds:** Fails **Mathematical Consistency** (subset conflict) because it cannot satisfy **Calibration Within Groups** when base rates differ. It satisfies **Normative Clarity** only if the goal is strictly equalizing error burdens, not outcome representation.
  *   **Calibration-Based Criteria:** Fails **Mathematical Consistency** (subset conflict) because it cannot satisfy **Error Rate Balance** when base rates differ. It excels at **Decision-Process Separation** but fails **Normative Clarity** if used alone, as a calibrated model can still perpetuate historical disparities via thresholds.
  *   **Counterfactual Criteria:** Fails **Proxy Resistance** in practice because they rely on causal graphs that are rarely known with certainty; if the causal model omits a proxy path, the criterion yields false negatives. They satisfy **Normative Clarity** best by forcing explicit definitions of discrimination, but are often too brittle for standardized auditing.
