answer: |-
  This is a classic problem in bioethics: the gap between the *regulatory checklist* (disclosure, capacity, voluntariness) and the *moral reality* of authorization. Your intuitions are consistently tracking something deeper than the Common Rule. You are rejecting a purely transactional view of consent in favor of a **relational** and **constitutive** one.

  The principle that captures your verdicts is:

  ### **The Principle of Substantial Understanding of the Essential Normative Nature**

  **The Core Claim:** Valid consent requires that the agent substantially understands the *essential normative features* that constitute the specific type of interaction they are entering, and their authorization must not be secured through the manipulation of those features or illegitimate control over the *reasons* for which they agree.

  This draws on Faden and Beauchamp's work on *understanding*, but updates it with **Relational Autonomy** (acknowledging power dynamics) and the **Constitutive View of Actions** (certain facts make an act what it *is*).

  Here is how this principle organizes your cases, resolves your flip-flops, and handles the therapeutic misconception.

  ---

  ### 1. How the Principle Explains Your Intuitions

  Your intuitions distinguish between **Essential Features** (what makes the act *this* kind of act) and **Peripheral Features** (details that don't change the nature of the act).

  *   **The Love Lie vs. The Job Lie:**
      *   *Principle:* In the context of a romantic relationship, mutual affection is an *essential normative feature* of the sexual act. Lying about love changes the *nature* of the act from "making love" to "using someone." Consent is invalid because the person did not agree to *that* act.
      *   *Contrast:* A job title is peripheral to the normative nature of sex. The act remains consensual sex, even if based on a mistaken belief about status.
  *   **The Investigator Lie ("Promising" vs. "Worthless"):**
      *   *Principle:* Research is constituted by scientific integrity and equipoise. By claiming the drug is "promising" when he believes it is worthless, the investigator misrepresents the *scientific validity* of the trial. This is an essential feature of research participation. The participant thinks they are joining a valid scientific inquiry; they are actually joining a sham. Invalid.
  *   **The Finder's Fee & The Overtime:**
      *   *Principle:* These are cases of **illegitimate control over the will**. The finder creates a coercive situation (holding property hostage); the boss implies a threat to livelihood. These constrain the *normative options* available. You aren't just influencing the decision; you are rigging the decisional environment to remove reasonable refusal. Invalid (or leaning invalid).
  *   **The Drunk Surgery:**
      *   *Principle:* Capacity is a threshold requirement for understanding the normative nature. If the cognitive machinery to process the "nature of the act" is offline, there is no authorization. Invalid.

  ### 2. Resolving the Flip-Flops

  You have two cases where you are unsure. The principle clarifies them by distinguishing **Validity** from **Justice**, and **Active Deception** from **Passive Conflict**.

  **Case A: The Desperately Poor Participant (\$8,000)**
  *   **The Conflict:** You feel the money is both the reason they say yes and the reason it feels unfair.
  *   **The Resolution:** You must separate the **validity of consent** from the **justice of the offer**.
      *   *Validity:* Does the money prevent them from understanding the *essential nature* of the trial (risk vs. benefit)? Usually, no. High payment is an *offer*, not a *threat* (unlike the boss or the wallet finder). It expands options rather than constraining them.
      *   *Justice:* The situation is exploitative because of background social injustice, not because the consent transaction itself is void.
      *   **Verdict:** **Valid Consent, Unjust Context.** Stop flip-flopping. If the risk is reasonable and they understand the risk, the consent is valid. The ethical problem lies in the socioeconomic structure, not the signature. (See: *Wertheimer on Undue Inducement*).

  **Case B: The Surgeon's Undisclosed Equity**
  *   **The Conflict:** Is this like the Investigator Lie?
      *   *The Resolution:* Distinguish between **Essential Nature of the Act** vs. **Fiduciary Purity**.
      *   The patient understands they are getting an implant (essential nature). The surgeon's financial interest is a *conflict of interest*, which violates fiduciary duty, but it does not necessarily change the *medical nature* of the procedure in the patient's mind.
      *   *Contrast with Investigator:* The investigator lied about the *science* (essential to research). The surgeon hid a *financial incentive* (peripheral to the physical act, though central to trust).
      *   **Verdict:** **Valid Consent, Ethical Breach.** The consent stands (the patient agreed to the surgery), but the surgeon has acted unethically. You don't void the consent; you sanction the surgeon.

  ### 3. The Core Puzzle: Therapeutic Misconception

  > *The fully informed, competent, uncoerced participant in a phase 1 oncology trial who... expects the drug to cure their cancer.*

  **Verdict: Invalid Consent.**

  **Why:** This is the strongest test of your principle. On paper, they signed the form. They know the risks. They are sober.
  However, under the **Essential Normative Nature** principle, **Research and Clinical Care are distinct normative categories.**
  *   **Clinical Care:** Goal is patient benefit.
  *   **Research:** Goal is generalizable knowledge.
  *   If the patient believes the goal is benefit (cure), they do not understand the *essential nature* of the interaction. They think they are consenting to *treatment*, but they are actually consenting to *experimentation*.
  *   Because the "Shared Meaning" of the transaction is broken, the authorization is void. It is not the consent the IRB thinks it is. As an IRB member, if you discover this in an exit interview, the study team has failed to ensure *substantial understanding*, regardless of what the consent form said.

  ### 4. The New Case: "In Your Position I Would Do This"

  > *A patient consents to a procedure after their doctor, honestly and correctly, says "in your position I would do this."*

  **Verdict: Valid Consent.**

  **Why:** This distinguishes **Guidance** from **Manipulation**.
  *   **The Investigator Lie** was manipulation because it misrepresented *evidence* ("promising" vs. "worthless").
  *   **The Recommendation** is an exercise of **Fiduciary Expertise**. Patients lack the medical framework to weigh risks/benefits. They *need* the doctor to synthesize the data.
  *   Saying "I would do this" is not a threat, nor a lie, nor a concealment. It is the fulfillment of the doctor's role as an advisor. It aids autonomy by making the information intelligible (Onora O'Neill's criterion).
  *   **Caveat:** It becomes invalid only if the doctor implies, "If you don't do this, I won't treat you" (coercion) or if they say "I would do this" when they *wouldn't* (deception). But as stated? It is ethically robust.

  ### Summary for your IRB Work

  When you read those consent forms, stop looking only for the *information provided*. Look for the **Decisional Frame**.

  1.  **Does the participant understand what *kind* of thing this is?** (Research vs. Care, Sex vs. Transaction, Return vs. Ransom).
  2.  **Was their will formed within a legitimate normative space?** (Free from threats, active deception about essential features, or exploitation of vulnerability regarding the *purpose* of the act).

  Your gut is tracking **Relational Autonomy**: the idea that consent isn't a solitary mental state, but a social transaction that requires shared meaning and non-domination. Trust it, but use the "Essential Normative Nature" test to articulate it when the PI argues that "everything was disclosed on page 4." (Page 4 doesn't matter if the patient thinks the game is Tennis and you're playing Chess).
