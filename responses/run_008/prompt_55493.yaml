      *   *Valid Cases:* Placebo (structural necessity understood), Job title lie (irrelevant to core act), Poor person trial (contested, but often valid if risk/benefit ok).
      *   *Ambiguous Cases:* Surgeon equity (conflict of interest), Poor person trial (undue inducement).

      *   *Common Thread:* It's not just about *information disclosure* (truthfulness). It's not just about *capacity* (drunk vs. sober). It's about the *quality of the authorization* relative to the *relationship* and the *meaning of the act*.
      *   *Key Distinction:* Lies about "essential" features vs. "peripheral" features. Power dynamics that constrain options vs. power dynamics that influence will.
      *   *The "Therapeutic Misconception" Case:* This is the crux. If the patient thinks it's treatment but it's research, is consent valid? Standard IRB stance: We try to correct it. If it persists, is enrollment ethical? Usually, no. Why? Because the *purpose* of the interaction is misunderstood.

  3.  **Evaluate Potential Ethical Frameworks:**
      *   *Autonomy (Kantian/Deontological):* Focuses on rational agency. Deception violates autonomy. But what about the poor person? They are rational but constrained.
