      *   *Relational Autonomy:* This seems promising. It acknowledges that autonomy is exercised within social contexts, power dynamics, and relationships.
      *   *Fiduciary Theory:* Focuses on trust and vulnerability. The investigator/doctor holds power.
      *   *Substantial Understanding/Authorization:* Consent requires understanding the *nature* of the transaction, not just the risks.

