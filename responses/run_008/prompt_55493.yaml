      *   *Let's refine based on "Investigator Lie".* "Promising" implies evidence. If no evidence, it misrepresents the *scientific validity*, which is essential to research consent.
      *   *Let's refine based on "Therapeutic Misconception".* Research vs. Care is the *essential nature* of the interaction. If they think it's care, they don't consent to research.

      *   *Proposed Principle:* **The Principle of Substantial Understanding of the Essential Normative Nature of the Transaction.**
      *   *Wait, one more angle:* **Fiduciary Integrity.** The investigator/doctor has a duty not to manipulate the patient's decision-making framework.
      *   *Let's combine:* **Relational Autonomy with a Duty of Non-Manipulation regarding Essential Features.**

      *   *Decision:* I will propose a principle based on **"Substantial Understanding of the Essential Normative Nature"** combined with **"Non-Exploitation of Decisional Vulnerability."**
      *   *Actually, the most robust philosophical fit for these specific intuitions (especially the love lie vs job lie and the therapeutic misconception) is the **"Essential Features" doctrine of consent** often associated with **O'Neill** or **Faden & Beauchamp**, but updated with **Relational Autonomy** to handle the power dynamics (boss, finder's fee).*

