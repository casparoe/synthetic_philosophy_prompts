          3.  The unifying principle: **Valid consent requires substantial understanding of the essential normative nature of the interaction, formed without manipulation of the reasons that justify that specific type of interaction.**

  5.  **Address the Contradictions/Flip-Flops:**
      *   *Poor Person/\$8k:* This is the "Undue Inducement" debate. If the principle is about *understanding the nature*, the money doesn't invalidate understanding. If the principle is about *exploitation*, it might.
