      *   *The "Principle":* Let's call it **"The Principle of Substantial Understanding of the Essential Normative Nature."** Or better: **"The Shared Meaning Principle."** Let's go with **"The Essential Normative Nature Principle"** grounded in **Relational Autonomy**.

      *   *Refining the "Poor Person" advice:* This is the trickiest. If I say "Valid," does it ignore exploitation? I need to distinguish between *validity of consent* and *justice of the offer*. This is a classic bioethics distinction (Wilkinson, etc.). I will advise them to separate these. Consent can be valid even if the offer is exploitative. This resolves the flip-flop.

