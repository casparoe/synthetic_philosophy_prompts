      *   *Let's try "Valid Authorization requires alignment of understanding regarding the *normative nature* of the interaction."*
      *   *Actually, there is a specific concept in bioethics that fits this:* **The "Meaningful Consent" or "Substantial Understanding" standard, grounded in Relational Autonomy.**
