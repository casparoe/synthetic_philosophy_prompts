      *   *Advice:* Prioritize **Understanding of Nature** over **Economic Desperation** *unless* the money blinds them to the risk (which \$8k usually doesn't in a Phase 1 context, but might). However, in bioethics, the consensus is shifting: High payment is rarely invalidating *per se*, it's the risk/benefit ratio that matters. I should advise them to stop flip-flopping and call it **Valid**, provided risks are reasonable. The desperation is a social justice issue, not a consent validity issue.
