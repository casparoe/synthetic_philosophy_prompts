answer: |-
  Here is the breakdown of Dahlia's logic, the prediction for your dinner party, and the tools you need to test her.

  ### The Prediction
  **Verdict:** **Guilt.**

  **Why:** Dahlia will argue that the driver committed a moral wrong (negligence), which rules out the "Wine Spill" exception, but because it was a **single, out-of-character act**, it does not define the driver's global identity. She will insist that even though the *consequences* are permanent, the *moral relationship* is still about what was *done*, not who the driver *is*. To assign shame would be to condemn the driver's entire existence based on one choice, which contradicts her view that guilt is the functional emotion for moral agents.

  ---

  ### The Rule: Why "Act vs. Self" Beats "Repairability"

  You have two strong candidate rules, but the **Wine Case** is the key that breaks one of them.

  **Candidate 1: The Repairability Rule**
  *   *Logic:* Guilt = Fixable. Shame = Broken beyond repair.
  *   *Prediction for Driver:* **Shame** (The damage is permanent).
  *   *Fatal Flaw:* Look at the **Wine Case**. A wine-stained dress is objectively repairable (cleaning or replacement). Yet Dahlia assigned **Shame**. Why? Because "nothing wrong was done." This proves repairability isn't the primary switch. Guilt requires a *moral violation*. If there's no moral violation, it defaults to shame (social embarrassment), regardless of fixability.

  **Candidate 2: The Locus of Evaluation Rule (Act vs. Self)**
  *   *Logic:*
      1.  **Is there a moral violation?** No → **Shame** (Wine Case). Yes → Go to step 2.
      2.  **Does this evaluate the Behavior or the Global Self?** Behavior/Specific Act → **Guilt** (Journal, Cashier). Global Self/Character/Identity → **Shame** (Chronic Liar).
  *   *Prediction for Driver:* **Guilt**. There is a moral violation (negligence), but it is a specific act by a "normally careful driver," not a revelation of a corrupt character.

  **Why Candidate 2 is Dahlia's actual algorithm:**
  Dahlia's comment on the Chronic Liar is the smoking gun: *"It's what they made her."* She isn't focusing on the broken marriage (the damage); she is focusing on the **identity shift**. She views Guilt as the emotion of *agency* ("I did bad") and Shame as the emotion of *being* ("I am bad"). Since she champions guilt as "superior," she reserves it for situations where agency is intact and the self isn't totally consumed by the error.

  ---

  ### The Tiebreaker Case

  To definitively split these rules at dinner, you need a scenario where **Repairability** and **Identity** point in opposite directions.

  **The Case of the "Reformed Bully"**
  > "A manager who spent five years systematically belittling subordinates (a pattern of behavior) is caught, immediately quits, undergoes therapy, compensates every victim fully, and receives formal forgiveness from all of them. The harm is repaired, but the behavior was a long-term pattern."

  *   **Repairability Rule Predicts:** **Guilt.** (The harm was fixed; relationships restored).
  *   **Act/Self Rule Predicts:** **Shame.** (The behavior was a pattern that defined their character for years, regardless of later repair).

  **Why this works:** If Dahlia sticks to her "Guilt is better" gun, she might *want* to say Guilt. But if she stays consistent with the Chronic Liar verdict (where pattern = shame), she must say **Shame**. If she says Shame, the Act/Self rule is confirmed. If she says Guilt, she has to explain why the Chronic Liar was different, potentially exposing a contradiction in her "consistency."

  ---

  ### Bonus Round: Can Cultures Choose?

  **Does her rule support her cultural claim?**
  **Yes, but with a caveat.**

  If Dahlia's rule were about **Repairability** (H1), her cultural claim would be weak. Cultures cannot legislate physics; they cannot choose to make permanent injuries "repairable." If the rule were about objective consequences, cultures would be stuck with whatever emotions those consequences dictate.

  However, since her rule is actually about **Locus of Evaluation** (Act vs. Self), her cultural claim holds water.
  *   **Guilt Cultures:** Socialize citizens to interpret failure as *"I violated a rule"* (Behavioral). This keeps the self intact and allows for restitution.
  *   **Shame Cultures:** Socialize citizens to interpret failure as *"I dishonored my group/essence"* (Global Self). This binds the act to the identity.

  **The Overreach:**
  Dahlia is slightly overreaching when she says a culture can *more or less choose* its mix. While cultures can emphasize framing (Act vs. Self), they cannot fully override human psychology.
  1.  **Public Exposure:** The Wine Case shows that public exposure triggers shame even without moral wrong. A culture cannot easily train people not to feel embarrassment when watched failing.
  2.  **Severity of Harm:** In the Driver Case, even if a culture tries to frame it as "Guilt" (Act), the sheer permanence of the harm often forces a psychological shift toward Shame ("I am a killer") regardless of cultural scripting.

  **Verdict on the Bonus:** She is right that cultures steer the *interpretation* of the act (Behavior vs. Identity), which is the lever her rule actually uses. But she is wrong to imply this steering is unlimited; extreme consequences (death, permanent disability) tend to force shame responses across all cultures, regardless of the "official" moral framework.
