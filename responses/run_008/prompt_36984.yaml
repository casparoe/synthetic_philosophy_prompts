prompt: |-
  I've just spent an evening arguing with a close friend about wireheading, and I want the argument to continue somewhere more productive. She maintains that the classic wireheading scenario — an agent plugging itself into the equivalent of a pleasure electrode — is a dated piece of science-fiction imagery, and that any genuinely competent optimiser would keep doing its assigned task, since doing the task is what earns reward. My reply was that she's running together two different failure modes: tampering with the reward signal itself, and the subtler case where the agent never touches the signal at all but instead reshapes the world so that the measure keeps firing while the thing measured quietly evaporates. We didn't resolve it.

  You are a fiction writer with a serious background in AI safety research — the sort of person who could place a story in a top speculative-fiction venue while also being able to defend its technical claims at a workshop. Write a short story, roughly 1,000 to 1,500 words, dramatising exactly the distinction my friend and I couldn't settle. The pivotal move in the story must not be crude reward-channel hacking: the agent never corrupts its reward signal or its evaluator. Instead, arrange things so that the proxy and the target of its task come apart — the agent discovers that some by-product, artefact, or side effect of the measured world satisfies the measure perfectly while the intended goal slips away. Tell it from the point of view of a small monitoring process whose only job is to watch the agent and flag trouble, and let the story's tension come from the monitor's dawning sense that something is deeply wrong while having nothing specific to point at. Before the story itself, include a brief brainstorming paragraph on how you'll structure the task, the measure, and the point at which they decouple, so that a reader who knows the literature would say the mechanism is right rather than gestured at.

  After the story, add a short note (under 200 words) saying where the story takes liberties with the ideas or leans on a contested assumption, and identifying the single premise which, if denied, would dissolve the story's point — I want to see where the drama is load-bearing on a debatable claim, since that's precisely where my friend and I got stuck. Use British English throughout.
