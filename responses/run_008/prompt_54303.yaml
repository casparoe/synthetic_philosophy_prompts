      1.  Overview.
      2.  Harmonious Pairs (briefly).
      3.  The Three Friction Points (2vs3, 1vs4, 1vs6).
      4.  The Single Change.
      5.  Closing.

      *Wait, one more thing:* Claim 1 says "Only radical evil... generates a duty that reaches humanity." Claim 4 says Spain was defensible. Spain involved radical evil (Civil War atrocities). If it was radical evil, Claim 1 says humanity has a duty. But Claim 4 says Spain (a specific community) could forget. Does the *universal* duty override the *local* pact? This is a nuance of Claim 1. I should touch on it. Actually, Claim 1 says "duty that reaches humanity." It doesn't say local communities *can't* forget, just that humanity *must* remember. Spain forgot internally, but the world remembers. This might be an *apparent* tension that resolves. I will classify it as resolvable.

      *Focus on the big one:* Claim 2 (Constitutive) vs Claim 3 (Disposable). This is the heart of the matter.

