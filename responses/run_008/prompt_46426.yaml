prompt: |-
  I'm writing a dissertation prospectus, roughly two pages, and I'd like your help turning a half-formed idea into a proper proposal. Please take the role of a professional philosopher of cognitive science, someone who works on the classical problems of AI and knows the frame problem literature cold. Don't just draft; think through the territory first and sketch what the proposal must accomplish before committing to a structure.

  The idea, as it currently stands: the frame problem is discussed as if it were a single problem — roughly, the problem of how a system updating its beliefs about a changing world avoids being swamped by everything that stays the same, or everything that doesn't need to be re-derived, after each action. But I suspect it's really a bundle of several distinct problems that only look unified because they surfaced together in the original setting where the problem was posed: a toy robot world with a fixed inventory of state variables, change represented by explicit axioms, and an inference engine that had to be told, axiom by axiom, what remains untouched by each action. My hunch is that some members of that bundle are artifacts of that style of representation, and would simply dissolve under a different way of representing change — and that this is quietly visible in modern learning-based systems, which don't represent change as axioms at all and yet don't visibly struggle with the parts of the bundle that consumed so much ink in the classical literature. But I also suspect at least one member is invariant: a genuine feature of any agent that must, under real time pressure, decide what in its picture of the world needs re-examining after it acts. That invariant member, if there is one, is what the frame problem really is, and the rest is scaffolding we mistook for the building.

  Turn this into a proposal with the following components. State the question precisely enough that it has a determinate answer. Explain why the existing treatments leave it open — as I read them, they mostly argue about whether the problem was solved, whether by nonmonotonic techniques like circumscription, by more careful reasoning about events, or by just letting statistical learners take over; but none of them first asks which problem is being solved, and that question has to come first. Set out the method: I would build a taxonomy of the phenomena lumped under the label, then for each member ask what happens to it when the representation of change is swapped, holding a fixed set of cases constant across representations so the comparison is fair, and classify each member as artifact, invariant, or mangled — transformed into a different problem rather than made to disappear. Say what a positive result would look like and what would count as the project failing. And be honest about scope: this is one year of dissertation work, not a career, so tell me which parts to cut first if it threatens to sprawl.

  No citations or bibliography, please — I'll fill those in myself, and I don't want a literature review by name-dropping; positions and arguments can be described in prose, with the attributions left to me.

  Finally, tell me the single objection most likely to sink this at a prospectus meeting, and how the proposal should be worded to survive it.
