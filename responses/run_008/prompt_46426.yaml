  ### Strategic Assessment: The Philosophical Terrain

  Before drafting, we must locate the trap. The Frame Problem literature is a graveyard of "solutions" that solved one formulation only to be accused of missing the point. Your insight—that the problem is a bundle—is strong, but it risks the charge of verbal stipulation. If you simply define the "real" problem as the invariant part, critics will say you've moved the goalposts.

  To survive, the proposal must ground the "bundle" not in intuition, but in *computational commensurability*. You are not arguing about definitions; you are arguing about computational costs across architectures. The proposal must accomplish three things:
  1.  **Operationalize the Bundle:** Define the "Frame Problem" not as a philosophical puzzle but as a set of specific computational bottlenecks (e.g., update cost, relevance detection, qualification tracking).
  2.  **Isolate the Variable:** The independent variable is *representational format* (logical vs. statistical); the dependent variable is *computational friction*; the control is the *task environment*.
  3.  **Limit the Scope:** Do not attempt to solve the invariant. Your job is merely to identify it. Solving it is for the next decade.

  Below is the prospectus text, followed by the strategic advice on the committee objection.

  ***

  # Dissertation Prospectus

  **Title:** The Frame Problem as a Bundle: Distinguishing Representational Artifacts from Architectural Invariants

  **Research Question**
  The classical Frame Problem is treated as a singular obstacle to artificial intelligence: how an agent efficiently updates its beliefs about a changing world without explicitly representing every non-change. However, historical treatments conflate difficulties arising from specific logical formalisms with difficulties inherent to situated agency. This dissertation asks: **Which specific computational difficulties traditionally grouped under the Frame Problem persist across distinct representational paradigms, and which dissolve when the representation of change is altered?**

  The goal is not to solve the Frame Problem, but to decompose it. A determinate answer will take the form of a taxonomy classifying each component difficulty as either a *Representational Artifact* (dissolves under alternative formalisms), an *Architectural Invariant* (persists across all known formalisms), or a *Mangled Problem* (transforms into a distinct computational challenge).

  **Motivation and Existing Treatments**
  Current literature is stalled in a cycle of solution-and-rebuttal. Proponents of non-monotonic logic argue that circumscription solves the problem by minimizing change. Proponents of event calculus argue that careful axiomatization of preconditions resolves it. More recently, proponents of connectionist and reinforcement learning systems argue that the problem never arises in statistical learners, as they do not reason via explicit axioms.

  These positions talk past one another because they assume the target is fixed. They argue over whether a specific key fits the lock without verifying they are looking at the same door. By treating the Frame Problem as a monolith, existing work fails to distinguish between the cost of *logical inference* (which may be avoidable) and the cost of *relevance realization* (which may be unavoidable). Until we isolate which part of the problem is a byproduct of the situation calculus and which part is a feature of real-time agency, we cannot know if the problem is solved, dissolved, or merely hidden in the weights of a neural network.

  **Methodology**
  The project employs a comparative computational analysis. I will construct a taxonomy of the phenomena lumped under the Frame Problem label (e.g., the need for frame axioms, the explosion of indirect effects, the qualification of preconditions). I will then subject each member of the taxonomy to a "Representation Swap."

  1.  **Task Control:** I will define a fixed set of task environments (e.g., deterministic block worlds, stochastic navigation grids) independent of any internal representation.
  2.  **Paradigm Variation:** I will model agents solving these tasks using two distinct paradigms: a classical symbolic planner (relying on explicit state updates) and a modern learning-based agent (relying on implicit state representation via value functions or latent states).
  3.  **Friction Measurement:** For each paradigm, I will measure the computational friction associated with each taxonomic member. Does the agent require explicit rules to ignore irrelevant data? Does it struggle with rare exceptions?
  4.  **Classification:**
      *   *Artifact:* Friction appears in the symbolic agent but is absent in the learning agent.
      *   *Invariant:* Friction appears in both, manifesting as training sample inefficiency or planning latency.
      *   *Mangled:* The problem disappears but is replaced by a new, structurally distinct failure mode (e.g., catastrophic forgetting).

  **Success and Failure Conditions**
  A positive result yields a mapped distinction. Success looks like demonstrating that the "need for frame axioms" is an artifact of logical representation, while the "cost of filtering irrelevant inputs under time pressure" is an architectural invariant. This would clarify that AI safety concerns regarding unpredictability are not about logic, but about relevance.

  The project fails if: (1) All components classify as artifacts, implying the Frame Problem was merely a historical confusion with no remaining core; or (2) All components classify as invariants, implying the distinction offers no explanatory power. A more likely failure mode is scope creep: attempting to solve the invariant rather than identifying it.

  **Scope and Feasibility**
  This is a one-year conceptual and modeling project, not an engineering endeavor. I will not build novel architectures. I will utilize existing, standard implementations of symbolic planners and reinforcement learning agents as testbeds.
  *   **Cut First:** Historical exegesis of the 1970s and 80s literature beyond what is necessary to build the taxonomy. The focus is on the computational structure, not the intellectual history.
  *   **Cut Second:** Complex, real-world environments. The comparison must hold in toy worlds to ensure the variables are controlled. Generalization to robotics is a discussion point, not a data point.
  *   **Cut Third:** Any attempt to propose a solution to the Architectural Invariant. The dissertation ends at the identification of the invariant.

  **Conclusion**
  By disentangling the Frame Problem, this dissertation will prevent future category errors in cognitive science. If we mistake artifacts for invariants, we waste effort fixing representation when we should be fixing architecture. If we mistake invariants for artifacts, we deploy systems that fail under pressure because we assumed the problem had vanished. This project draws the boundary line.

  ***

  ### The Single Objection and Defense

  **The Objection: The Incommensurability Charge**
  The committee member most likely to sink this will argue that you are comparing apples and oranges. They will say: *"If the learning-based system doesn't represent state explicitly, it isn't solving the same task. It's solving a different task (pattern matching) rather than the original task (reasoning about change). Therefore, the disappearance of the problem is trivial; you changed the subject."*

  **How to Preempt It**
  You must anchor the identity of the "problem" in the **environment**, not the **agent**.
  In the proposal text, I have deliberately defined the "Task Control" as independent of internal representation. In your oral defense, you must double down on this. Argue that the Frame Problem is fundamentally about the relationship between an agent and a dynamic environment, not about the syntax of the agent's mind. If a system successfully navigates the environment without being swamped by non-changes, it has solved the functional problem, regardless of whether it used axioms or gradients. If the problem disappears when you switch to gradients, then the "axiomatic difficulty" was indeed an artifact of the axioms, not the world. Your defense is functionalism: if the input-output behavior satisfies the constraint of efficient updating, the internal mechanism determines whether the difficulty was real or representational.
