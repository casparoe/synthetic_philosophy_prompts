      **Desiderata for Dispositional Analysis**

      To adjudicate between competing analyses of dispositions (e.g., fragility), we must establish adequacy criteria. The literature diverges because theorists prioritize different desiderata. The following table outlines requirements, their motivations, and their dialectical status.

      | Requirement | Motivation & Cases | Status |
      | :--- | :--- | :--- |
      | **Extensional Accuracy** | Must yield true verdicts on plain cases (struck fragile vase breaks) and false verdicts on non-disposed objects (rubber vase). | Non-negotiable |
      | **Fink Sensitivity** | Must handle *finks*: cases where disposition exists but conditional is false because stimulus removes disposition (Martin's vase). Analysis must not deny the disposition. | Non-negotiable |
      | **Mimmic Sensitivity** | Must handle *mimics*: cases where disposition lacks but conditional is true because stimulus triggers external mechanism (dead wire). Analysis must not ascribe disposition. | Non-negotiable |
      | **Mask Sensitivity** | Must handle *masks*: cases where disposition exists but manifestation is blocked (packed glass). Analysis must affirm disposition despite non-manifestation. | Non-negotiable |
      | **Distinctness** | Must distinguish having a disposition from its manifestation. A fragile vase remains fragile even if never struck. | Non-negotiable |
      | **Non-Triviality** | Must not imply everything is disposed to everything. Stimulus/background conditions cannot be completely open or vacuous. | Non-negotiable |
      | **Intrinsicality** | Dispositions appear to be intrinsic properties of their bearers, dependent only on internal structure, not extrinsic environment. | **Contested** |
      | **Multi-Track Capacity** | Must accommodate dispositions with multiple manifestation types (e.g., solubility in various solvents), not just one-track stimuli. | Non-negotiable |

      **Incompatible Desiderata**

      The central tension lies between **Intrinsicality** and **Fink/Mask Sensitivity**. If dispositions are strictly intrinsic, extrinsic interferers (finks/masks) should not affect the truth of the disposition ascription. However, the simple conditional analysis fails precisely because extrinsic factors alter the conditional's truth value while the intrinsic disposition remains. To repair the analysis (e.g., by adding "holding conditions" to the antecedent), one typically must reference extrinsic circumstances to rule out finks and masks. This threatens Intrinsicality: if the truth conditions for "x is fragile" depend on the absence of extrinsic interferers, fragility becomes extrinsic.

      Conversely, preserving Intrinsicality often requires abandoning the conditional analysis entirely (e.g., adopting a primitivist powers ontology), which sacrifices the reductive goal of analyzing dispositions via conditionals. Furthermore, **Non-Triviality** conflicts with **Extensional Accuracy** if the "holding conditions" required to rule out finks become so specific they render the analysis circular or vacuous. If the condition is "struck AND no fink is present," we arguably presuppose the disposition to define the condition, violating the reductive aim. Thus, one cannot simultaneously satisfy strict Intrinsicality, robust Fink/Mask Sensitivity, and a non-circular Conditional Analysis. Theories must sacrifice either the intrinsic nature of dispositions or the purity of the conditional reduction.

      **Scorecard: SCA vs. Lewis**

      The Simple Conditional Analysis (SCA) satisfies **Intrinsicality** (superficially) and **Non-Triviality** but fails **Fink/Mask Sensitivity** catastrophically; it falsely denies dispositions in fink/mask cases. Lewis's Revised Conditional Analysis (RCA) adds a causal basis and temporal proximity clause. RCA succeeds on **Extensional Accuracy** regarding finks and masks by specifying intrinsic bases. However, RCA faces challenges on **Intrinsicality**; if the causal basis can be extrinsic, the disposition becomes extrinsic. Additionally, RCA risks violating **Non-Triviality** if the "causal basis" is defined dispositionally, inviting circularity. Lewis saves the conditional form but at the cost of complex, potentially extrinsic truth conditions.

