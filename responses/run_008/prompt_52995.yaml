      *   *D2: Anti-Overfitting/Temporal Asymmetry.* (User's Item 2). Case: Astrology fits past data but predicts nothing.
      *   *D3: Bounded Rationality.* (User's Item 3). Case: Agents can't know all logical consequences instantly.
      *   *D4: Accommodation vs. Prediction.* (User's Item 4). Case: Intuition says prediction is stronger.
      *   *D5: Computational Tractability.* (User's Item 5). Case: Must run on hardware, not angelic minds.

  5.  **Analyzing Conflicts (The "Impossibility" Check):**
      *   Is there a formal theorem? Not exactly a "Gödel" for this, but there are strong tensions.
      *   *Tension 1:* D1 (New Theories) + Standard Bayes. Standard Bayes assumes a fixed sigma-algebra. Changing the algebra breaks Conditionalization.
      *   *Tension 2:* D3 (Boundedness) + Probability Axioms. If you aren't logically omniscient, you violate $P(A \lor \neg A) = 1$ or $P(T \implies E) = 1$. You are technically incoherent by standard definitions.
      *   *Tension 3:* D2 (No Manufacturing) + D3 (Boundedness). If I derive $T \implies E$ today, is that "new"? If yes, how do we stop me from deriving tautologies that fit data just to boost credence?
