          4.  Check for incompatibility (Impossibility Theorems/Trade-offs).
          5.  Evaluate two specific fixes against these desiderata: (a) Counterfactual/Historical (pretend you didn't know), (b) Ur-Priors/Event Space Expansion (conditioning on the relation between theory and evidence).
