          *   *Refinement:* This is about *conceptual change* or *refinement of the hypothesis space*. The sigma-algebra changes.
      *   *User Item 2:* No confirmation manufacturing (avoid overfitting/post-hoc rationalization).
          *   *Refinement:* This is about *temporal asymmetry* or *heuristic penalties*. If I fit a curve to existing points, it shouldn't count as much as predicting new points.
      *   *User Item 3:* No logical omniscience.
          *   *Refinement:* Bounded rationality. $P(T \implies E)$ isn't automatically 1 just because it's mathematically true. It becomes 1 only when the agent *computes* the implication.
      *   *User Item 4:* Explain vs. Predict distinction.
          *   *Refinement:* Accommodation vs. Prediction. Does the Bayesian framework *need* to distinguish them, or is the distinction illusory?
      *   *User Item 5:* Implementability/Boundedness.
          *   *Refinement:* Computational tractability.

  3.  **Evaluate Desiderata (Classification & Conflicts):**
      *   *Non-negotiable:* Logical Omniscience relaxation (otherwise POE doesn't exist), No Manufacturing (otherwise Bayes is useless), Handle New Theories (otherwise it doesn't solve the specific GR case).
      *   *Contested:* Explain vs. Predict (Some Bayesians argue they are formally identical; others say there's a pragmatic difference).
      *   *The Conflict:* The user suspects a trilemma.
          *   If you relax logical omniscience (allow $P(E|T)$ to rise from <1 to 1 upon derivation), you solve POE but risk "manufacturing" if not careful (anyone can claim they just derived it).
          *   If you require strict conditioning on new data only, you fail "Handle New Theories".
          *   If you allow conditioning on "I learned T", you need a prior over T, which brings back the "where did the prior come from?" problem.
          *   *Key Insight:* Garber's solution (conditioning on $T \implies E$) vs. Counterfactuals. The real tension is between *Psychological Realism* (boundedness) and *Normative Rigor* (probability axioms).

  4.  **Drafting the Desiderata List:**
