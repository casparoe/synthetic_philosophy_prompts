      *   **Key Requirements:**
          *   Define "harm" concretely (physical, financial, reputational, etc.).
          *   Distinguish harm vs. offense.
          *   Distinguish harm to others vs. self-regarding conduct.
          *   Distinguish Removal vs. Deamplification (force the debate, don't smuggle it).
          *   Be honest about soft spots/biases/limitations (e.g., diffuse harms).
          *   Run the procedure on three specific cases (Doxxing, Vaccine Misinfo, Reclaimed Slur).
