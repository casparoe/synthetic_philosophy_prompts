          *   Identify what needs escalation to policy leadership (human values decisions).

  2.  **Deconstruct the Harm Principle for a Private Platform:**
      *   *Classic Mill:* State power only justified to prevent harm to others.
      *   *Platform Translation:* We aren't the state, but we hold the "public square" keys. Our "punishment" is exclusion/silencing, not jail.
      *   *Definition of Harm:* Needs to be tangible. Physical safety, financial loss, targeted harassment, credible threats, illegal acts (CSAM, etc.).
      *   *Offense vs. Harm:* Offense is subjective emotional reaction. Harm is objective detriment to rights/safety.
      *   *Self-Harm:* Tricky. Mill says let them do it. Platforms usually intervene (suicide, EDs). Need to categorize this carefully. Is it *encouraging* self-harm (harm to others by facilitating) or *expressing* self-harm (self-regarding)?
      *   *Removal vs. Deamplification:* Removal = "This violates rights/safety." Deamplification = "This is low quality/misleading but not strictly harmful enough to ban." *Crucial:* The prompt asks to force the debate. So the procedure needs a specific checkpoint for "Why aren't we removing this?"

  3.  **Drafting the Decision Procedure (The "Harm-Adapted Triage"):**
      *   *Time Limit:* 5 minutes. Needs to be a flowchart or checklist style.
      *   *Step 1: Identify the Claimed Harm.* (What bad thing happens if this stays?)
      *   *Step 2: Verify Causality & Immediacy.* (Is it direct? Is it speculative?)
      *   *Step 3: Assess Target.* (Specific individual? Protected group? General public? Self?)
      *   *Step 4: Select Action.* (Remove, Deamplify, Allow).
      *   *Step 5: Bias Check.* (Am I offended or is someone harmed?)
      *   *Soft Spots:* Acknowledge where this breaks (cumulative harm, context dependence).

