answer: |-
  ## The Harm-Adapted Triage (HAT) Procedure

  **Purpose:** To move moderation decisions from "this feels bad" to "this causes specific, preventable harm."
  **Time Budget:** 5 minutes per ticket.
  **Audience:** Generalist Moderators.

  ### Part 1: Defining "Harm" for This Platform
  We are not the state. We cannot jail anyone. Our sanctions are speech restrictions. Therefore, our threshold for restriction must be **tangible detriment to rights or safety**, not moral judgment.

  **Actionable Harm Taxonomy (Check all that apply):**
  1.  **Physical Safety:** Credible threats of violence, instructions on making weapons, incitement of imminent violence.
  2.  **Material Security:** Doxxing (private info), financial scams, fraud, non-consensual sexual imagery.
  3.  **Targeted Harassment:** Sustained, targeted abuse intended to silence a specific user (not just "being mean").
  4.  **Illegal Goods/Services:** Drugs, weapons, human trafficking (where applicable by local law).

  **Explicit Exclusions (Not Actionable Harm under this procedure):**
  *   **Offense:** Content that makes you angry, sad, or disgusted.
  *   **Falsehoods:** Incorrect claims *unless* they directly incite imminent physical harm (see Step 3).
  *   **Self-Regarding Conduct:** Content where the primary risk is to the poster (e.g., "I am sad," "I am restricting calories"), *unless* it actively recruits others to self-harm.

  ---

  ### Part 2: The 5-Minute Decision Flow

  **Step 1: Identify the Victim (30 Seconds)**
  *   **Specific Individual?** (e.g., the person being doxxed).
  *   **Protected Group?** (e.g., a racial/religious group targeted by hate).
  *   **The Public?** (e.g., health misinformation).
  *   **The Poster?** (e.g., self-harm, eating disorder content).
  *   **No One?** (e.g., abstract ideology, offensive humor).
  *   *If "The Poster" or "No One," proceed to Step 2B. If "Individual/Group/Public," proceed to Step 2A.*

  **Step 2A: Assess Causality & Immediacy (2 Minutes)**
  *   **Is the link between this post and the harm direct?**
      *   *Yes:* "Here is his address, go hurt him." (Direct)
      *   *No:* "I hate this group of people." (Abstract)
  *   **Is the harm imminent?**
      *   *Yes:* Threats happening now, active doxxing campaign.
      *   *No:* Generalized hatred, historical revisionism, speculative health claims.
  *   **Decision:** If **Direct + Imminent**, mark for **Removal**. If **Indirect or Speculative**, mark for **Deamplification Review** (Step 4).

  **Step 2B: The Self-Regarding & Offense Check (2 Minutes)**
  *   **Is this primarily offensive?** If the only harm is that people are upset, this is **Allow**.
  *   **Is this self-harm?**
      *   *Expression:* "I am struggling with anorexia." -> **Allow** (Support resources).
      *   *Facilitation:* "Here is how to starve yourself safely." -> **Remove** (This crosses from self-regarding to harming others by providing tools).
  *   **Is this reclaimed identity?** (e.g., slurs used by the in-group).
      *   If used as identity/handle without targeting others -> **Allow**. (Offense to outsiders is not harm).

  **Step 3: The "Truth Police" Trap (1 Minute)**
  *   *Applies to health, science, politics.*
  *   Are we removing this because it is **dangerous** or because it is **wrong**?
  *   Under the Harm Principle, being *wrong* is not enough. It must be *dangerous*.
  *   *Test:* Does this claim create an immediate physical risk (e.g., "Drink bleach to cure virus")?
      *   **Yes:** Remove (Physical Safety Harm).
      *   **No:** Deamplify or Allow (e.g., "This ingredient is toxic" without specific lethal instruction).

  **Step 4: Removal vs. Deamplification (The "Smuggling" Check) (1 Minute)**
  *   *If you are leaning toward Deamplification (reducing reach) instead of Removal:*
  *   **You must answer:** "Why is this not harmful enough to remove, but too risky to recommend?"
  *   **Write the justification:** If you cannot articulate the specific harm that justifies hiding it, you are acting on vibes.
  *   **Rule:** Deamplification is for **Low Quality/Speculative Harm**. Removal is for **Clear/Imminent Harm**. Do not use deamplification to punish content you secretly want to ban but can't justify.

  **Step 5: Bias Mirror (30 Seconds)**
  *   Does this content offend *my* personal politics?
  *   If I swap the political party/identity group involved, would I make the same call?
  *   *If No:* Escalate to Senior Mod.

  ---

  ### Part 3: Honest Soft Spots (Where the Procedure Leaks)

  1.  **The Cumulative Harm Problem:** The Harm Principle works best on acute incidents (a threat, a doxx). It fails at "death by a thousand cuts." A community driven away by steady low-level hostility isn't a "harm event" a mod can point to in 5 minutes. *This procedure will under-enforce on culture drift.*
  2.  **Power Asymmetry:** "Debate" between a powerful figure and a marginalized user is not symmetric. The Harm Principle treats speech as neutral, but impact is not. A mod might see "counter-speech," but the target sees "harassment." *This procedure requires mods to weigh "Punching Down" as an aggravating factor in Step 2A.*
  3.  **The "Sincere Idiot":** Someone spreading dangerous misinformation sincerely (not maliciously) causes the same harm as a troll. This procedure struggles to distinguish intent from impact in the 5-minute window.
  4.  **Moderator Politics:** Step 5 is a self-check, not a fix. If your team is politically homogenous, "swapping the party" in your head is a theoretical exercise. *This is why you need escalation paths.*

  ---

  ### Part 4: Worked Cases

  Here is the procedure applied to your three scenarios.

  #### Case 1: The Doxxing (Fired Employee)
  *   **Content:** Post accurately doxxing a publicly fired employee, including home address "so people can protest."
  *   **Step 1 (Victim):** Specific Individual.
  *   **Step 2A (Causality):** Direct. Publishing home addresses directly enables physical harassment and threats to safety. Imminent.
  *   **Step 3 (Truth):** Accuracy is irrelevant. Private address publication is a Material Security harm regardless of truth.
  *   **Step 4 (Action):** **Remove.**
      *   *Justification:* Direct threat to physical safety and privacy. "Protest" at a home is inherently coercive/harmful.
  *   **Outcome:** Removal. (Matches your instinct).

  #### Case 2: The Vaccine Misinfo (Sincere Parent)
  *   **Content:** Viral post claiming a common childhood vaccine ingredient is toxic. Posted sincerely by a worried parent.
  *   **Step 1 (Victim):** The Public / Children.
  *   **Step 2A (Causality):** Indirect/Speculative. While vaccine hesitancy causes public health harm, does *this specific post* cause imminent physical harm? It is a claim, not an instruction to injure.
  *   **Step 3 (Truth Police):** We are not a medical journal. Is it *dangerous*? It creates risk, but it is not "Drink Bleach." It is a contested scientific claim presented as fact.
  *   **Step 4 (Action):** **Deamplify + Context Note.** Do **Not** Remove.
      *   *Justification:* Under the Harm Principle, sincere error is not punishable by silencing unless it incites imminent violence. Removal sets a precedent of the platform arbitrating scientific truth, which chills legitimate health discussion. However, the risk is high enough to stop algorithmic recommendation.
  *   **Outcome:** **Deamplification.**
      *   *Note:* **This is the outcome you likely won't like.** You want to remove it to protect public health. The Harm Principle argues that removal is too blunt a tool for "sincere error" and risks turning the platform into an arbiter of truth. This forces your team to admit: *We are hiding this because it's risky, not because it's strictly 'harmful' in a rights-violation sense.*

  #### Case 3: The Reclaimed Slur (User Handle)
  *   **Content:** User handle contains an ethnic slur. User argues it is reclaimed usage/identity. No targeted harassment in posts.
  *   **Step 1 (Victim):** Protected Group (potentially), but primarily The Poster (Identity).
  *   **Step 2B (Offense/Self):** Is this targeted harassment? No. Is it self-regarding expression? Yes.
  *   **Harm Check:** Does the *existence* of the handle cause tangible harm to others? No. It causes **Offense**.
  *   **Step 5 (Bias):** Would we ban a handle that says "Queer" if a straight person complained? (Analogy for reclaimed terms).
  *   **Step 4 (Action):** **Allow.**
      *   *Justification:* Offense to observers is not harm. Reclaimed identity is self-regarding conduct. Unless used to target others, it is protected expression.
  *   **Outcome:** **Allow.** (Also likely disliked by you, but consistent with Case 2).

  ---

  ### Part 5: What Lands on Your Desk (Escalation Criteria)

  This procedure is a triage tool, not a constitution. Moderators should escalate the following to you (Policy Lead) for a "Human Values Decision":

  1.  **Diffuse/Community Harm:** "This sub is becoming toxic and driving women away, but no single post violates the Harm Procedure."
      *   *Why:* This requires cultural intervention, not content removal.
  2.  **Novel Harms:** "This is a new type of scam/manipulation we haven't defined yet."
      *   *Why:* You need to update the Taxonomy.
  3.  **The "Sincere Idiot" Edge Case:** High-reach misinformation that doesn't meet the "Imminent Physical Harm" bar but is clearly dangerous (e.g., Case 2 if it goes viral enough to trigger a local health crisis).
      *   *Why:* This is where Safety trumps Liberty, and that is a leadership call, not a mod call.
  4.  **Bias Disputes:** When a moderator recuses themselves because they cannot pass the "Bias Mirror" check.
      *   *Why:* You need to audit if your policy is politically aligned.

  ### Final Note to the Team
  *   **On Deamplification:** If you Deamplify, you are admitting the content is **Allowed but Unwanted**. If you Remove, you are admitting the content is **Harmful**. Do not confuse the two. If you find yourself Deamplifying things you think are Harmful, you are breaking the procedure to avoid a hard fight. Escalate instead.
  *   **On the Harm Principle:** It will let some bad things stay. That is the cost of a principled system. If we ban everything "bad," we ban everything controversial. Our job is to stop harm, not to curate virtue.
