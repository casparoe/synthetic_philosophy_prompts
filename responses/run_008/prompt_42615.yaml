answer: |-
  **OMNI-STATE MUTUAL INSURANCE GROUP**
  **RIDER ECA-404: EXTENDED COGNITIVE ASSETS**

  **SECTION 1: DEFINITIONS**

  **1.1 Policyholder.** The biological entity designated herein.
  **1.2 Covered Artifact.** Any non-biological device, storage medium, or digital account designated by the Policyholder as integral to ongoing cognitive processes. To qualify, the Artifact must meet the Trust-and-Reliability Criteria defined in Section 2.
  **1.3 Cognitive Coupling.** The functional interface between the Policyholder and the Covered Artifact.
  **1.4 Dispositional State.** The Policyholder's capacity to access information or execute procedures without conscious deliberation regarding the source of said information.

  **SECTION 2: ELIGIBILITY AND TRUST CRITERIA**

  **2.1 Constant Availability.** Coverage applies only to Artifacts physically accessible to the Policyholder during standard waking hours. An Artifact stored in a locked facility, a different municipality, or a secondary residence shall be classified as "Merely Environmental" and is excluded from coverage. For example, a mobile device maintained on a nightstand with consistent charge levels qualifies; a laptop consulted once per month from a storage closet does not.

  **2.2 Automatic Endorsement.** Information retrieved from the Artifact must be accepted by the Policyholder without critical verification. If the Policyholder habitually cross-references the Artifact against biological memory or third-party sources prior to action, the Artifact is deemed an external reference tool rather than a cognitive extension. Coverage is void if the coupling requires active authentication protocols that interrupt cognitive flow.

  **2.3 Past Access.** Prior usage does not constitute current integration. An Artifact used historically but abandoned for a period exceeding thirty (30) days reverts to "Property" status. Re-certification as a Covered Artifact requires a continuous usage period of fourteen (14) days.

  **SECTION 3: CLAIM PROCEDURES AND COMPENSATION**

  **3.1 Notification of Loss.** In the event of loss, theft, or corruption of a Covered Artifact, the Policyholder must file a claim within forty-eight (48) hours. Delays suggesting the Policyholder functioned without the Artifact negate the claim of cognitive integration.

  **3.2 Assessment of Damages.** Omni-State Mutual does not compensate for lost memories, as the Policyholder cannot be indemnified for content she never biologically possessed. Compensation is calculated solely on the loss of *Dispositional States*. The adjuster will measure the time and cognitive load required to re-establish functional equivalence using replacement tools.

  **3.3 Restoration.** Payouts are limited to the cost of hardware replacement and data migration. No compensation is provided for the subjective experience of cognitive impairment, confusion, or the emotional distress of feeling "less intelligent" during the interim period.

  **SECTION 4: SUBROGATION AND COUPLING FAILURE**

  **4.1 Interface Liability.** In instances where the Covered Artifact remains intact but the Cognitive Coupling fails (e.g., network outage, software incompatibility, Bluetooth latency), liability is assigned based on the locus of the interruption. If the failure resides in the transmission protocol rather than the hardware, the claim is processed under "Service Interruption" rather than "Asset Loss."

  **4.2 Third-Party Systems.** If the Artifact relies on a cloud server owned by a third party, Omni-State Mutual reserves the right to subrogate against the server provider. However, if the Policyholder voluntarily updated firmware knowing it might alter the interface, the failure is deemed a voluntary modification of the cognitive system, and coverage is denied.

  **SECTION 5: EXCLUSIONS AND LIMITATIONS**

  **5.1 The Parity Cap.** Coverage does not extend to ubiquitous environmental resources. While the Policyholder may argue that public signage, library archives, or the internet at large function as cognitive aids, Omni-State Mutual defines the "Mind" as bounded by the Policyholder's immediate personal ecosystem. Insuring all potential informational inputs would constitute insuring the municipality, which is outside our risk pool.

  **5.2 Ontological Ambiguity.** In the event of a dispute regarding whether the Covered Artifact constitutes part of the Policyholder's Personhood or merely their Property, premium rates shall default to the higher "Personhood" tier during the investigation. If the investigation concludes the Artifact was Property, no refund of the premium difference will be issued.

  **5.3 Cognitive Bloat.** Omni-State Mutual explicitly rejects the notion that any tool used for thinking becomes part of the mind. Coverage is restricted to Artifacts that have undergone the vetting process in Section 2. Attempting to claim coverage for a calculator, a spouse, or a search engine browser tab not saved to favorites will result in immediate policy review.

  **5.4 Biological Baseline.** This Rider insures the extension, not the baseline. If the Policyholder's biological cognitive capacity degrades, rendering the Artifact useless regardless of its functionality, this Rider is voided. The Artifact must remain capable of functioning were it attached to a standard cognitive agent.
