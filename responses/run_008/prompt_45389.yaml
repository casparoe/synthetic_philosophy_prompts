answer: |-
  Good evening. For those who don't know me, I'm [Your Name]. I write about science for a living, which means I spend most of my life trying to explain complex ideas to people who didn't ask for them. Today, however, I'm surrounded by people who understand the ideas better than I do. Half this room could teach a course on evolutionary theory. The other half just wants to know when the cake is coming. I intend to serve both.

  I've been asked to explain why we're here. Why the rings? Why the vows? Why this absurdly expensive party? As a science writer, I look for mechanisms. And [Groom], being an evolutionary biologist, gave me the framework. It's called the Handicap Principle.

  In nature, honest signals are costly. A peacock's tail is heavy. It attracts predators. It burns energy. Only a male who is truly fit can afford to drag that tail around and survive. The cost is the point. If the signal were cheap, it could be faked. Because it's costly, it's honest.

  Now, I know [Groom's Advisor] is in row three. I know you believe the Handicap Principle gets overapplied to everything from altruism to art. And for the biologists here, yes, I promise not to bring up Fisherian runaway selection regarding the open bar. But the core logic holds.

  Humans aren't peacocks. We have complex motives. But [Groom], look at what you've done. You've invested time. You've taken on risk. You've planted a flag in the ground that says, "I am all in." In a world where commitment is often treated as optional, you've chosen to make it costly. That makes the signal honest.

  And [Bride], you are the perfect recipient for this signal. You're an ER physician. You see life and death on a Tuesday night. You have zero tolerance for nonsense. You can spot a fake pulse from across the room. You wouldn't accept a cheap tail. You wouldn't accept a hedged bet. You demanded a signal that matched the reality of your love.

  The biology explains the mechanism, but it doesn't explain the feeling. The theory tells us *why* the cost proves the commitment. But only you two know *why* the commitment was worth the cost. The tail is just the structure. The love is the payload.

  So, if a peacock spreads his tail to say "I am strong," you two stand here to say "We are together." And because it wasn't easy, because it wasn't cheap, and because it wasn't safe… we believe you.

  Please raise your glasses. To the cost, to the signal, and to the honest, beautiful life you're building together. To [Groom] and [Bride].

  Verdict: romance
