      *   *Nuance on "Drift":* Is it really strategic? Some of it is definitely emergent chaos. But the *resistance to formalizing restoration* suggests a structural commitment to permanence.
      *   *Terminology:* Use terms like "Outlawry," "Civil Death," "Expressive Sanction," "Preventive Exclusion."

  5.  **Final Polish:** Check against all constraints in the prompt.
      *   Did I cover (a), (b), (c), (d)? Yes.
      *   Did I distinguish presupposition vs. drift? Yes.
      *   Did I distinguish presupposition vs. underdetermination? Yes.
      *   Did I address the "consequences not punishment" coherence? Yes.

