      *   *Evolution:* We evolved from simple thermostats to complex predictors (MPC-ish).
      *   *Avoidability:* "Could have done otherwise" means "If the situation had been slightly different, or if I had processed information differently, the output would change." It's about *evitability*.
      *   *Libertarians:* Want "causa sui" (self-caused). Want the decision to pop out of nowhere, uncaused by prior physics. Dennett says this is incoherent.
      *   *Hard Determinists:* Say "If physics determines it, it's not free." Dennett says "Freedom is a functional property of the system, not a metaphysical exemption from physics."
      *   *Worth Wanting:* We want free will because it makes us responsible agents, punishable/rewardable, capable of moral growth. It's about social coordination and self-control.

  3.  **Translate to Control Systems Vocabulary:**
      *   *Agent/Person:* The closed-loop system (Controller + Plant).
      *   *Free Will:* High-bandwidth, robust reference tracking with advanced feedforward (anticipation).
      *   *Determinism:* The system equations are known and causal. $x_{k+1} = f(x_k, u_k)$.
      *   *Libertarianism:* Requesting $u_k$ to be independent of $x_k$ and reference $r_k$. White noise generator?
      *   *Hard Determinism:* "Since $u_k$ is calculated by $f$, there is no freedom."
      *   *Dennett:* "Freedom is the quality of the controller $f$. If $f$ includes a world-model and MPC, you have 'freedom'."
