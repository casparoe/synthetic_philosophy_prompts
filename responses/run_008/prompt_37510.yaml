  9.  **Final Polish:** (Mental check of the "Residue" section). The user asks: "Say whether the residue points to something my vocabulary is missing, or to something that was less clear than it looked in the philosophers' original."
      *   *Answer:* It points to something the vocabulary treats as an external boundary condition (the Reference/Cost Function) which Dennett treats as an internal, evolved state variable. The vocabulary isn't "missing" it, but it walls it off. Dennett brings it inside the loop.

