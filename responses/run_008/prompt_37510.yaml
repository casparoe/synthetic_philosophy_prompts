      *   *Suspicions:*
          *   Suspicion 1 (Counterfactuals): Yes, this maps to sensitivity analysis/simulation.
          *   Suspicion 2 (Libertarian Fault): Yes, an uncaused control signal is actuator noise or a fault.

      *   *The Residue (The "Worth Wanting"):* The user is sharp here. Control theory takes the Reference ($r$) as given. Dennett cares about *where $r$ comes from* (higher-order volitions). The "worth" is normative, not descriptive. Control theory is descriptive/normative regarding *performance*, but not regarding *goal selection*.

