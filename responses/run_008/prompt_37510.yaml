          5.  Address Two Suspicions:
              *   Suspicion 1: "Could have done otherwise" = counterfactual input sensitivity (not spooky).
              *   Suspicion 2: Libertarian "extra demand" = output not a function of inputs (a fault, not freedom).
          6.  Address the "Worth-Wanting" Residue: The user suspects their vocabulary lacks a way to evaluate the *specification* itself (who sets the setpoint?) and that this is where the "worth wanting" lives. Confirm/correct this.

  2.  **Deconstruct Dennett's Position (Mental Model):**
