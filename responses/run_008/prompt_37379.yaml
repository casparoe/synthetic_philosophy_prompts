answer: |-
  **MEMORANDUM**

  **TO:** Faculty Senate
  **FROM:** Committee on Voting Methods
  **SUBJECT:** Recommendation for Dean of Humanities Election Rule
  **DATE:** March 15

  **Recommendation**

  The Committee on Voting Methods recommends the adoption of **Approval Voting** for the election of the Dean of Humanities. Under this rule, each voter receives a ballot listing all candidates. Voters may mark ("approve") any number of candidates they find acceptable. The candidate with the highest total number of approvals wins. In the event of a tie, the winner shall be selected by a random lottery administered by the Senate Chair.

  **Reasoning and Analysis**

  Our recent straw poll revealed a Condorcet cycle: a majority prefers A to B, B to C, and C to A. This indicates no candidate commands a majority against all rivals. Consequently, the election outcome depends entirely on the counting rule. We have evaluated three competing perspectives on how to proceed.

  **1. On Arrow's Impossibility Theorem and the Mathematician's Claim**
  Our mathematician colleague argues that Arrow's Impossibility Theorem proves all ranked-ballot methods are arbitrary, suggesting we retain Plurality for simplicity. This interpretation requires correction. Arrow's theorem states that no ranked voting system can simultaneously satisfy six specific conditions: Unrestricted Domain (any preference order is allowed), Ordinal Aggregation (only rankings, not intensity, are counted), at least Three Alternatives, the Pareto Condition (unanimous preferences are respected), Independence of Irrelevant Alternatives (IIA), and Non-Dictatorship.

  The theorem proves that no *perfect* system exists, not that all imperfect systems are *equally* arbitrary. Plurality voting is a ranked method (implicitly ranking the chosen candidate first and all others lower). It fails the Pareto condition and IIA spectacularly. In a cycle, Plurality allows a candidate to win with only 34% support while 66% oppose them. Simplicity is a virtue, but not when it systematically disenfranchises the majority. We reject the claim that impossibility justifies inertia.

  **2. On Cardinal Information and the Political Scientist's Proposal**
  The Political Scientist correctly notes that Arrow's theorem applies only to ordinal rankings. By eliciting cardinal or dichotomous information, we escape the theorem's grip. Approval Voting operates on this principle: it asks not "Who is best?" but "Who is acceptable?" This avoids the arbitrary elimination of candidates seen in Instant-Runoff voting and mitigates the "spoiler effect" of Plurality.

  However, we must note that Approval Voting is not immune to strategic manipulation. Voters may "bullet vote" (approve only their favorite) to avoid boosting a rival, effectively reverting to Plurality. Nevertheless, compared to ranked methods, Approval reduces the incentive to insincerely lower a strong rival, as approving a rival never harms your favorite's count. It is the most robust method for eliciting broad consensus without requiring complex ballot tabulation.

  **3. On Independence of Irrelevant Alternatives and the Philosopher's Demand**
  Our philosopher colleague demands a rule satisfying Independence of Irrelevant Alternatives (IIA), fearing that fringe candidates might spoil the result. We must be candid: given three or more candidates, *no* voting rule can satisfy IIA while meeting other basic democratic standards (per Arrow). We cannot meet this demand fully.

  The trade-off is unavoidable. We must choose which violation of fairness is least damaging. Plurality violates IIA by allowing similar candidates to split the vote, handing victory to a opposed majority. Approval Voting also violates IIA—if a new candidate enters, voters may adjust their approval threshold, changing the outcome between existing rivals. However, Approval minimizes the *harm* of this violation. It allows voters to support both a favorite and a compromise without penalty. We accept the violation of IIA because the alternative is a rule that ignores the intensity of acceptance, which is vital in a Dean selection where collegiality matters.

  **4. Discovering vs. Constructing Collective Preference**
  The cycle in our straw poll forces us to answer an ontological question: Does the faculty possess a pre-existing collective preference that the rule must discover? The cycle proves the answer is no. Collective preferences are not transitive even when individual preferences are. There is no hidden "will of the faculty" waiting to be uncovered.

  Therefore, the voting rule does not discover a truth; it constructs a decision. Approval Voting is superior here because it constructs a mandate based on acceptability rather than narrow plurality. It asks faculty to define a set of viable leaders, acknowledging that in a cycle, legitimacy comes from broad acquiescence, not maximal ranking.

  **5. May's Theorem and Binary Reduction**
  We note May's Theorem, which guarantees that if a choice is reduced to two candidates, simple majority rule is the only method satisfying anonymity, neutrality, and positive responsiveness. If Approval Voting yields a clear top two, a runoff would satisfy May's conditions. However, holding a second election is costly. Approval Voting attempts to simulate this binary consensus in a single round by allowing voters to support multiple candidates, effectively collapsing the field without a second poll.

  **6. Strategic Considerations of This Recommendation**
  Finally, we address the selection of the rule itself. Social choice theory teaches that the choice of voting method is itself strategically manipulable. A committee with a favored candidate could recommend a method tailored to elect them. We acknowledge this risk. The Mathematician's preference for Plurality coincides with his agenda-setting power; the Political Scientist's preference for Approval aligns with a desire to bypass ordinal constraints. We have chosen Approval not because it benefits a specific faction, but because it best balances the need for a decisive outcome with the reality of our cyclic preferences. It forces voters to draw a line of acceptability, constructing a winner who can govern with the broadest possible consent.

  **Conclusion**

  No voting rule is perfect. Plurality is demonstrably flawed in cyclic environments. Ranked methods fall prey to Arrow's constraints and complexity. Approval Voting offers a implementable, constitutionally sound mechanism that respects the lack of a latent majority while maximizing the legitimacy of the winner. We urge the Senate to adopt this rule for the upcoming election.
