  ### Part 2: The Residue Report

  **Your Hypothesis:** *The everyday claim "a white horse is a horse" is the subsumption judgment `WhiteHorse <: Horse`. Gongsun is covertly answering three different questions (type identity, subtyping, naming) as though they were one.*

  **Verdict:** **Your diagnosis is robust, but incomplete.** You have correctly identified the conflation of `==` (type identity) and `<:` (subtyping). However, there is residue that your vocabulary cannot capture, not because your vocabulary is defective, but because Gongsun is playing a different game: **Normative Semantics vs. Descriptive Typing.**

  #### 1. The Residue of "Naming" (Ming)
  You asked: *"Is the residue... that what a name names settles the type relations, whereas in my world whether WhiteHorse <: Horse is a convention... or a fact about structure?"*

  **Yes.** In your world (Java/Scala/Haskell), the compiler or the structural rules decide subtyping. The *name* `WhiteHorse` is just a label for a structure.
  For Gongsun, the **Name (Ming)** is primary. It rectifies the **Actuality (Shi)**.
  *   **CS View:** We observe the world, model it with types. If a white horse exists, we make `WhiteHorse <: Horse` to model reality.
  *   **Gongsun's View:** The Name `Horse` has a fixed, ideal definition (Shape). The Name `White` has a fixed definition (Color). If you combine the Names, you create a new Ideal. The relationship between Names is logical and *a priori*, not empirical.
  *   **The Residue:** Your type system describes *what compiles*. Gongsun's system prescribes *what is correct to say*. When he says "A white horse is not a horse," he is making a linguistic prescription: "Do not use the label `Horse` where the label `WhiteHorse` is precise." He is fighting against semantic drift. In CS, we allow `WhiteHorse` to upcast to `Horse` for convenience. Gongsun argues this upcast is a logical error because it discards the `White` constraint, changing the "Name."

  #### 2. Intension vs. Extension
  Your vocabulary handles Extension (sets of values) very well (Move 2). It handles Intension (type definitions) reasonably well (Move 1).
  *   **The Residue:** Gongsun treats Intensions as **Objects**. In your system, `Horse` is a type. In Gongsun's system, "Horse-ness" is a universal entity that exists independently of individual horses.
  *   When he says "If horses had no color..." (Move 3), he is talking about the Universal `Horse`. In CS, `trait Horse` is abstract, but it doesn't "exist" at runtime. For Gongsun, the Universal is more real than the instance. Your type theory erases types at runtime (type erasure in Java/Scala); Gongsun's ontology insists the "Type" (the Universal) is the only thing that truly persists.

  #### 3. The Ambiguity of "Is" (Fei)
  You identified this as Identity vs. Subtyping.
  *   **CS:** We have distinct operators: `==`, `<:`, `:=`.
  *   **Chinese (and English):** "Is" (Shi/Fei) covers `==`, `<:`, `∈`, and `implies`.
  *   **The Residue:** Gongsun isn't just confused; he is exploiting the lack of distinction to make a metaphysical point. He wants to force you to acknowledge that `WhiteHorse` carries *more information* than `Horse`. In CS, we accept `WhiteHorse <: Horse` as a convenience. Gongsun rejects the convenience because it hides information. He is arguing for **Strict Typing** where implicit upcasting is forbidden. If your language required explicit casting `h.asInstanceOf[Horse]`, you would be closer to Gongsun. He objects to the implicit subsumption.

  **Conclusion on Residue:** The residue is not a defect in your vocabulary. It is the difference between **Engineering** (building systems that work via subsumption) and **Logic/Metaphysics** (categorizing reality via strict identity). Gongsun is effectively arguing for a system where `WhiteHorse` and `Horse` are disjoint types unless explicitly coerced, because the *Names* denote different concepts.

  ---

  ### Part 3: The Companion Thesis (Hard and White Stone)

  **The Thesis:** "Hardness and whiteness are never given together. The eye receives whiteness without hardness, the hand receives hardness without whiteness."

  **Translation Attempt:**
  You asked if this translates to *two typeclass constraints that can each be checked but never jointly*.

  **The Translation:**
  No, that is not quite right. In your world, `Stone` can implement `trait Hard` and `trait White` simultaneously. `Hard & White` is a valid intersection type.
  Gongsun is making an **Epistemic** claim, not an **Ontological** one. He is talking about *Accessors* or *Projections*, not the Object itself.

  ```haskell
  -- In your world:
  data Stone = Stone { hardness :: Int, color :: Color }
  -- Both exist in the record.

  -- Gongsun's view translated to Capabilities/Effects:
  class Perceiver p where
    sense :: p -> Stone -> Property

  -- The Eye can only project Color
  eye :: Eye
  sense eye stone :: Color 

  -- The Hand can only project Hardness
  hand :: Hand
  sense hand stone :: Hardness

  -- Gongsun's Claim:
  -- There is no function `senseAll :: Stone -> (Color, Hardness)` 
  -- that returns them as a unified 'Stone' object.
  ```

  **The Residue here is larger:**
  1.  **Property Independence:** In CS, properties belong to the object (`stone.hardness`). For Gongsun, "Hardness" and "Whiteness" are universals that float independently and *attach* to the stone. The stone is merely the locus where they meet, but they don't merge.
      *   *CS Equivalent:* This is like saying `Hardness` and `Color` are separate microservices that return data about an ID, but there is no central database record that holds both simultaneously.
  2.  **Perception vs. Existence:** Gongsun argues that because we *perceive* them separately, they *are* separate.
      *   *CS Equivalent:* This is like arguing that because `getHardness()` and `getColor()` are different methods, the fields they access must be stored in different memory locations or even different objects. It conflates the **Interface** with the **Implementation**.
  3.  **Mutual Externality:** He claims they are "mutually external."
      *   *CS Equivalent:* This implies `Hard` and `White` are **Disjoint Types** or that the constraints are **Incompatible** in a single context. But they aren't incompatible in reality (the stone exists).
      *   *Better Translation:* It is a claim about **Contextual Availability**. In the context of `Vision`, `Hardness` is undefined (or `null`). In the context of `Touch`, `Color` is undefined.
      *   ```scala
          trait Vision { def perceive(s: Stone): Color }
          trait Touch  { def perceive(s: Stone): Hardness }
          
          // Gongsun says: There is no trait 'Perception' that extends both 
          // and returns a unified Stone object.
          ```

  **Does it leave a residue?**
  Yes. The residue is **Qualia**.
  Your type system models *data*. Gongsun is modeling *experience*.
  In CS, `stone.color` is a value. For Gongsun, "Whiteness" is an event of perception.
  *   **CS:** The property exists on the object regardless of observation.
  *   **Gongsun:** The property is only real in the act of perception.
  *   **Translation Failure:** Your type system assumes the object persists with all its fields regardless of which function accesses it. Gongsun's thesis denies the unified object. He is effectively arguing against the existence of the `Stone` class itself, claiming only the properties (`Hard`, `White`) exist, and they never co-locate.

  **Final Verdict on the Stone:**
  It does **not** translate to typeclass constraints that cannot be joint. It translates to a rejection of the **Product Type** `Stone = Hard × White`. He argues for a **Sum Type** of experiences: `Perception = See(White) | Feel(Hard)`, denying the existence of the underlying tuple `(White, Hard)`. This is a metaphysical claim about the unity of objects that type theory generally takes for granted (that an inhabitant of a type holds all its fields simultaneously).

  ### Summary
  1.  **White Horse:** You are correct. It is a conflation of Type Identity (`==`) and Subtyping (`<:`), driven by a philosophy where Names dictate Reality. The residue is the normative power of Naming, which CS treats as syntactic sugar.
  2.  **Hard/White Stone:** This does not map to constraints. It maps to a rejection of the unified Object/Record in favor of disjoint Perceptual Projections. The residue is the difference between modeling *data structures* (CS) and modeling *phenomenological experience* (Gongsun).

  Gongsun is not writing code; he is writing a linter that forbids implicit upcasting and questions the existence of the heap itself.
