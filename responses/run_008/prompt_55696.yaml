answer: |-
  Here is a complete package for your seminar session: the student handout (quiz) and the facilitator's guide (scoring key and discussion roadmap).

  I have designed this to be printed as a two-sided handout. The quiz is on the front; the instructions tell them not to turn it over until instructed. The scoring key and discussion guide are on the back (or a separate sheet for you).

  ### Part 1: Student Handout

  **SEMINAR QUIZ: Intuitions on the Boundary of Life**
  **Instructions:** Do not consult phones or textbooks. This is not a test of knowledge, but a map of your intuitions. For each scenario, select the option that best matches your immediate judgment. There are no "correct" answers, only consistent or inconsistent ones.

  **Answer Options:**
  *   **[L] LIFE:** It fits your intuitive category of "living."
  *   **[N] NOT LIFE:** It fits your intuitive category of "non-living" or "dead."
  *   **[?] UNSURE / DEPENDS:** The case is ambiguous, or your answer depends on missing information. *(Note: Selecting this is valid data, not a skip.)*

  ***

  **1. The Obligate Virus**
  A bacteriophage is suspended in a saline solution. It contains DNA and a protein capsid. It cannot replicate or metabolize on its own; it must infect a specific bacterium to hijack the cell's machinery and produce copies of itself. Over generations, its lineage accumulates mutations and adapts to host defenses.
  **Is the virus in the solution alive?** [L] [N] [?]

  **2. The Protein-Only Infectious Agent (Prion)**
  A misfolded protein enters a host organism. It causes normal proteins to refold into its own shape. It "replicates" its structure without DNA or RNA. It evolves slightly under selective pressure (e.g., strain variation), but it is purely structural chemistry.
  **Is the prion alive?** [L] [N] [?]

  **3. The Deep Freeze (State A)**
  A vial contains the last known cells of an extinct amphibian species. They are suspended in liquid nitrogen at -196°C. All metabolic activity has ceased. Chemical reactions have effectively stopped. The cellular structure remains intact.
  **Are the cells in the vial alive *while frozen*?** [L] [N] [?]

  **4. The Deep Freeze (State B)**
  The same vial from Question 3 is thawed. The cells resume metabolism, grow, and divide.
  **Does the fact that they can "wake up" change whether they were alive in Question 3?**
  *(Answer based on the frozen state again, knowing the future potential)*: [L] [N] [?]

  **5. The Naked Replicator**
  In a laboratory prebiotic simulation, a specific strand of RNA is observed to catalyze the assembly of copies of itself from free nucleotides in the solution. It mutates during copying. It has no lipid membrane, no metabolism, and no compartment other than the test tube.
  **Is the RNA strand alive?** [L] [N] [?]

  **6. The Sterile Worker**
  A worker honeybee is foraging. It maintains homeostasis, metabolizes sugar, and responds to stimuli. However, it is genetically sterile and cannot reproduce. It exists only to support the colony's reproductive queen.
  **Is the worker bee alive?** [L] [N] [?]

  **7. The Campfire**
  A fire consumes wood (fuel), excretes ash and smoke (waste), grows in size, moves across the landscape, and maintains a complex structure far from equilibrium. If "fed," it persists; if not, it "dies."
  **Is the fire alive?** [L] [N] [?]

  **8. The Digital Organism**
  A self-replicating computer program (e.g., in the Avida platform) exists on a server. It copies its code, introduces random mutations, and competes for memory space (resources). It undergoes natural selection and adapts to the digital environment.
  **Is the digital organism alive?** [L] [N] [?]

  **9. The Autocatalytic Soup**
  A mixture of organic molecules forms a network where Product A catalyzes the formation of Product B, which catalyzes Product C, which regenerates Product A. The system sustains itself, repairs minor damage, and becomes more complex over time. There is no single molecule that replicates; the *cycle* persists. There is no membrane boundary.
  **Is the reaction network alive?** [L] [N] [?]

  **10. The Synthetic Cell**
  Scientists synthesize a minimal bacterial genome on a computer and insert it into a hollowed-out natural cell membrane. The cell boots up, metabolizes, and divides. It is functionally identical to a natural bacterium, but its origin was intelligent design rather than biological ancestry.
  **Is the synthetic cell alive?** [L] [N] [?]

  ***
  *(Stop. Do not turn over until instructed by the facilitator.)*

  ---

  ### Part 2: Facilitator's Guide & Scoring Key

  **Goal:** Do not use this to grade students. Use it to group them for discussion. The value is in the *conflict*, not the consensus.

  **How to Score:**
  There is no point system. Instead, look for **Patterns of Agreement**. Ask students to raise hands for specific combinations (e.g., "Who said Life to the Virus but Not Life to the Fire?"). Use the profiles below to label the dominant intuitions in the room.

  **The Role of [?] UNSURE:**
  Treat [?] as a positive assertion. A high frequency of [?] (4 or more) indicates a specific philosophical stance (Deflationism/Continuum), not confusion.

  #### Profile A: The Darwinian Lineage (The "NASA" View)
  *   **Core Intuition:** Life is a process of heredity and evolution. If it evolves by natural selection, it's alive.
  *   **Typical Pattern:**
      *   **Virus:** [L] (It evolves).
      *   **RNA Replicator:** [L] (It evolves).
      *   **Mule:** [L] (It is part of a living lineage, even if a dead end).
      *   **Fire:** [N] (No genetics).
      *   **Digital Organism:** [L] (Substrate doesn't matter, evolution does).
      *   **Frozen Cells:** [L] (Information is preserved).
  *   **Blind Spot:** Struggles to explain why the *individual* matters if the *lineage* is the unit of life. May conflate "capable of evolution" with "currently evolving."

  #### Profile B: The Autopoietic / Metabolic View
  *   **Core Intuition:** Life is about self-making and boundaries. You must maintain a distinction between "self" and "world" through active work.
  *   **Typical Pattern:**
      *   **Virus:** [N] (No metabolism, no boundary of its own).
      *   **RNA Replicator:** [N] (No compartment/membrane).
      *   **Mule:** [L] (It maintains itself).
      *   **Fire:** [N] (No boundary, does not make itself).
      *   **Autocatalytic Soup:** [?] or [N] (Without a boundary, it's just chemistry).
      *   **Frozen Cells:** [N] (Process has stopped; autopoiesis requires activity).
  *   **Blind Spot:** Can be too restrictive on early life (pre-cellular evolution) or entities like viruses that clearly participate in biology.

  #### Profile C: The Thermodynamic / Dissipative View
  *   **Core Intuition:** Life is a specific kind of physical structure that exists to dissipate energy gradients efficiently.
  *   **Typical Pattern:**
      *   **Fire:** [?] or [L] (It is the classic dissipative structure; this is the biggest tell).
      *   **Autocatalytic Soup:** [L] (It manages energy flow).
      *   **Frozen Cells:** [N] (Equilibrium has been reached; process halted).
      *   **Digital Organism:** [N] or [?] (Requires physical energy dissipation, not just logic).
  *   **Blind Spot:** Risks over-inclusivity (calling hurricanes or stars "alive").

  #### Profile D: The Physiological Individualist (The "Fifth Position")
  *   **Core Intuition:** Life is a property of the *individual organism* right now, not its ancestors or descendants.
  *   **Typical Pattern:**
      *   **Mule:** [L] (Strongest indicator).
      *   **Frozen Cells:** [N] (It is not doing anything *now*).
      *   **Virus:** [N] (It is not doing anything *now*).
      *   **Synthetic Cell:** [L] (It is functioning now).
  *   **Distinction:** Separates from Darwinians on the Mule (Lineage vs. Individual) and from Autopoietics on the Frozen Cell (Structure vs. Process).

  #### Profile E: The Deflationist / Cluster Concept
  *   **Core Intuition:** "Life" is a human word with no single essence. It's a family resemblance concept.
  *   **Typical Pattern:**
      *   **High [?] Count:** 5 or more [?] answers.
      *   **Inconsistency:** Might say [L] to Virus but [N] to RNA, without a clear theoretical rule.
      *   **Synthetic Cell:** [?] (Depends on what you mean by "alive").
  *   **Discussion Value:** These students often drive the best philosophical critiques. They argue the question is wrong.

  ***

  #### Facilitator Notes: Where the Cases Blur (Be Honest About This)

  **1. The Virus (Q1) vs. The Mule (Q6)**
  *   **The Conflict:** This separates the **Lineage View** from the **Individual View**.
  *   **The Trap:** If a student says the Virus is *Not Life* (no metabolism) but the Mule *Is Life* (no reproduction), ask them: "Why is metabolism more essential than reproduction?" This exposes whether they prioritize *physics* (metabolism) or *biology* (reproduction).
  *   **Ambiguity:** The Darwinian view actually struggles here. Strictly speaking, a mule is an evolutionary dead end. If life is about evolution, the mule is a "zombie" of the lineage. If they call the Mule alive, they are smuggling in physiological criteria.

  **2. The Frozen Cells (Q3 & Q4)**
  *   **The Conflict:** This separates **State** from **Potential**.
  *   **The Trap:** Thermodynamic and Autopoietic views usually demand current activity ([N]). Darwinian views often allow potential ([L]).
  *   **Ambiguity:** If a student answers [N] to Q3 but [L] to Q4, ask: "Did life emerge at the moment of thawing, or was it latent?" This probes whether life is a *noun* (a thing you have) or a *verb* (a thing you do).

  **3. Fire (Q7) vs. Autocatalytic Soup (Q9)**
  *   **The Conflict:** This is the **Thermodynamic** litmus test.
  *   **The Trap:** Both fire and the soup dissipate energy. Both grow. Neither has clear heredity (in the standard sense).
  *   **Ambiguity:** If a student says Fire is [N] but Soup is [L], press them on the physical difference. Is it just "chemistry vs. plasma"? This often reveals **Chemical Chauvinism** (Life must be wet carbon chemistry) vs. **Functionalism** (Life is what it does).

  **4. Digital Organism (Q8)**
  *   **The Conflict:** **Substrate Independence**.
  *   **The Trap:** Darwinians usually say [L]. Biochemists usually say [N].
  *   **Ambiguity:** This case separates the **Information View** from the **Material View**. If they say [N], ask if an alien made of silicon would be alive. If they say [L], ask if a self-replicating spreadsheet is alive.

  **5. The "Unsure" Cluster**
  *   **The Conflict:** **Essentialism vs. Pragmatism**.
  *   **The Trap:** Don't let students off the hook for picking [?].
  *   **Ambiguity:** If a student picks [?] on the Virus, Fire, *and* RNA, they are likely a **Deflationist**. Ask them: "If we found this on Mars, would we treat it as a rock or a contaminant?" This forces the philosophical definition into a practical ethical context.

  #### Suggested Flow for the Two Hours
  1.  **Quiz (15 mins):** Distribute and collect.
  2.  **The Reveal (30 mins):** Don't give answers. Tally the class results on the board for Q1 (Virus), Q6 (Mule), and Q7 (Fire). These three usually create the biggest split.
  3.  **Group Work (45 mins):** Group students by their "Profile" (e.g., put all the "Fire = Life" people together, even if there's only two of them). Ask them to defend their coherence. Why is Fire alive but a Crystal not? Why is a Mule alive but a Virus not?
  4.  **Plenary Debate (30 mins):** Bring the groups together. Focus on the **Frozen Cell** pair. This is the best case for discussing "Life as Process" vs. "Life as Information."
  5.  **Wrap Up:** Emphasize that in origins-of-life research, the definition chosen dictates the experiment designed. If you define life as metabolism, you look for thermal gradients. If you define it as information, you look for polymers. The definition is a tool, not a truth.
