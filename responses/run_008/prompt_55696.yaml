          4.  Deflationary/Cluster Concept (No essence, family resemblance).
          5.  *Optional Fifth:* Need to identify if a fifth position emerges naturally from the cases.
      *   **Required Cases:** Virus, Prion, Cryopreserved cells (maybe split), Self-replicating RNA, Sterile animal (mule/bee), Fire, Digital organism (Avida).
      *   **Optional/Suggested Cases:** Synthetic cell, Autocatalytic network (non-replicating).
      *   **Constraints:** Do not reveal the "right" answer. Acknowledge ambiguity in the key. Treat "Unsure" as meaningful.

  2.  **Drafting the Cases (Iterative Process):**
