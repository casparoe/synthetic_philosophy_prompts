      *   *Fifth Position:* **Substrate Functionalism** (Yes to Avida, Yes to Synthetic) vs **Biochemical Essentialism** (No to Avida).
      *   *Handling "Unsure":* If someone picks "Unsure" on >50% of boundary cases, they lean Deflationary/Cluster.
      *   *Honesty:* I must explicitly state where the distinctions blur (e.g., Autopoiesis vs. Darwinian on the RNA case).

  4.  **Drafting the Content:**
      *   *Tone:* Academic but accessible. Encouraging debate.
