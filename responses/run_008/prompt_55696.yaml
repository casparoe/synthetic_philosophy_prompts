      *   *Refinement:* Let's ensure the "Unsure" option is highlighted.

      *Selection:*
      1. Virus (Bacteriophage in a host).
      2. Prion (Misfolded protein inducing misfolding).
      3. Cryo-Cells (Frozen, metabolic zero).
      4. Self-Replicating RNA (In solution, no cell).
