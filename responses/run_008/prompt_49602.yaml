answer: |-
  Here is the teaching plan. It is designed for 75 minutes, whiteboard-only, high-trust audience.

  ### 1. The Prerequisite: Alienation, Not Just the Slope
  Your hunch is half-right. Feeling that "the slope never flattens" is necessary, but it isn't sufficient. If the slope never flattens but the climb is easy, no one objects.

  Before the objection lands as a *philosophical* problem (rather than a complaint about difficulty), the room must feel **Agent-Alienation**.

  They need to visualize a state where their personal projects, relationships, and identity are not just *taxed*, but rendered **provisional**. In a maximally demanding framework, your marriage, your hobby, and your sleep are only permissible *if* they are the optimal way to generate value at that moment. They are not *yours*; you are merely the custodian of resources that happen to be attached to your body.

  **The Move:**
  Draw a circle on the whiteboard labeled "The Agent." Draw arrows going out labeled "Obligations."
  *   **Step 1:** Ask them to sketch where the line is drawn in their current lives (e.g., 10%, 50%).
  *   **Step 2:** Ask them to sketch where the logic of "do the most good" draws the line. (It shouldn't have one).
  *   **Step 3:** The prerequisite is met when they admit that without a hard stop, the "Agent" circle dissolves into the "Obligations" arrows. The objection only bites when they realize the theory doesn't just ask for their *surplus*; it asks for their *separateness*.

  ### 2. The Carrying Example: Replace the Child
  You are correct to ditch the Drowning Child. It is discrete, emergency-based, and involves a specific victim. That triggers rescue instincts, not moral theory.

  **Use: "The Lifetime Efficiency Audit"**
  **The Scenario:** Imagine a regulatory body has the authority to audit every hour of your life against the global marginal utility of labor.
  *   **What it MUST have:**
      *   **Continuity:** It's not a one-off rescue; it's a career-long condition.
      *   **Opportunity Cost:** The "harm" isn't something you *do*; it's something you *fail to prevent* by sleeping or reading a novel.
      *   **Statistical Victims:** The people you save/kill are abstract and distant, not face-to-face.
      *   **Reversibility:** Any hour spent on "self" can be retroactively flagged as immoral if a better use is discovered later.
  *   **What it MUST lack:**
      *   **Physical Proximity:** No one is drowning *here*.
      *   **Causal Directness:** You aren't pushing them under; you are just not pulling them out.
      *   **A Finish Line:** There is no "goal met" state where the audit stops.

  **Why this works:** It captures the *structural* burden. It turns morality into a management problem where the "self" is an inefficient asset class. This makes the demandingness objection feel like a defense of human structure, not just laziness.

  ### 3. Misconceptions & Sequencing
  You identified two ("Weakness of Will" and "Only Utilitarianism"). Here are two more, and the order in which you must dismantle them.

  **Phase 1 (Minutes 0–15): "It's just Weakness of Will"**
  *   **The Misconception:** "The objection is just post-hoc rationalization for selfishness."
  *   **The Fix:** Distinguish *psychological difficulty* from *normative unfairness*.
  *   **Whiteboard:** Draw two axes: "Difficulty" and "Fairness." Climbing Everest is difficult but not unfair. Slavery is unfair (even if the slave is strong). Ask: "Is demandingness a complaint about the weight of the load, or the right to assign it?"
  *   **Goal:** Get them to admit a theory can be *true* but *unlivable*, or *true* but *unjust*.

  **Phase 2 (Minutes 30–45): "It's a Pragmatic/Burnout Issue"**
  *   **The Misconception:** "The objection is just that people will quit if we ask too much." (The "Golden Goose" argument).
  *   **The Fix:** This is a consequentialist argument *within* the system, not an objection *to* the system.
  *   **Whiteboard:** Label this "Strategic Demandingness." If we demand 100%, people give 0%. So we demand 10% to get 10%.
  *   **Goal:** Show that this *dodges* the philosophical objection. If people *were* perfect robots, would 100% be right? If the answer is yes, the objection still stands.

  **Phase 3 (Minutes 45–60): "Just Set a Threshold" (The New One)**
  *   **The Misconception:** "We solve this by capping donations at 10% or 20%."
  *   **The Fix:** This is arbitrary without a deeper theory of *prerogatives*.
  *   **Whiteboard:** Write "10%". Ask "Why not 11%?" If the answer is "Because 10% feels right," you haven't solved the philosophy; you've just picked a number.
  *   **Goal:** Force them to see that a cap requires a theory of *personal sovereignty* that conflicts with pure maximization.

  **Phase 4 (Minutes 60–70): "Only Utilitarianism" (Your One)**
  *   **The Misconception:** "We are pluralists/consequentialists, so this doesn't apply."
  *   **The Fix:** Any theory that prioritizes "The Good" over "The Right" faces this. If the outcome is the primary metric, the agent is secondary.
  *   **Goal:** Universalize the problem. It's not a bug in Utilitarianism; it's a feature of Outcome-Based Ethics.

  ### 4. The 50% Giver: Hazard or Resource?
  He is a **Hazard** if he is allowed to be a **Norm**. He is a **Resource** if he is treated as a **Data Point**.

  *   **The Risk:** If he says, "It's easy, you just have to care enough," he validates the "Weakness of Will" misconception and shames the room. This kills the philosophical inquiry.
  *   **The Move:** Pre-brief him or intervene early. Frame his contribution as *phenomenological*, not *prescriptive*.
  *   **Script:** "I want to use your experience to test the theory, not to set the target. When you give 50%, what specific life projects did you have to abandon? Did you feel a loss of agency, or just a change in priorities?"
  *   **Why:** This forces him to articulate the *cost* (validating the objection) rather than the *virtue* (invalidating the objection). If he admits he gave up having children, or a specific career path, the room sees the "Agent-Alienation" in real time. That makes the objection real.

  ### 5. The Assessment Question
  Do not ask "Do you agree?" Do not ask "What will you donate?"

  **Ask this:**
  > "If we accept that morality is demanding, what **non-moral value** do we need to introduce to justify a 'right to a life of your own'? Is it autonomy? Integrity? Psychological necessity? And does introducing that value break the consequentialist framework?"

  **Why this works:**
  *   If they say "Autonomy," they are admitting consequentialism isn't the whole story (Deontological turn).
  *   If they say "Psychological Necessity," they are making a pragmatic argument, not a philosophical one (which you already covered).
  *   If they can't name the value, they haven't understood the objection; they've just felt the pressure.
  *   To answer correctly, they must identify that the Demandingness Objection is actually a **conflict between two goods** (Impartial Good vs. Personal Integrity), not a conflict between Good and Selfishness.

  ### 6. What to Refuse to Cover (Scope Creep)
  You have 75 minutes. You must explicitly state at the start what you are **not** doing.

  1.  **Do not solve it.** State clearly: "We are not finding the solution today. We are mapping the terrain of the problem." If you try to solve it, you will default to guilt-tripping or hand-waving.
  2.  **Do not debate Cause Areas.** Whether it's AI or Malaria is irrelevant to the structural demand. Keep the "Good" abstract.
  3.  **Do not discuss Pledge Mechanics.** No talk of GWWC tiers, tax deductions, or liquidity. That is implementation, not philosophy.
  4.  **Do not let it become Therapy.** If someone gets emotional about their giving capacity, acknowledge it, but pivot back to the theory. "That feeling is exactly the data point we need for the 'Integrity' argument."

  ### Summary of Flow
  1.  **0-10:** Setup & Scope (No solutions, no pledges).
  2.  **10-25:** Prerequisite (Agent-Alienation via Whiteboard Circles).
  3.  **25-40:** The Analogy (Lifetime Efficiency Audit).
  4.  **40-55:** Misconceptions (Weakness -> Pragmatics -> Thresholds).
  5.  **55-65:** The 50% Giver (Testimony of Cost).
  6.  **65-75:** Assessment Question & Close.

  This structure respects their intelligence, validates their existing commitment, but forces them to stare directly at the philosophical tension they usually gloss over as "cope."
