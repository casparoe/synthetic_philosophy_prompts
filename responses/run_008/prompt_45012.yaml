answer: |-
  This is a classic debate in normative ethics regarding **supererogation** (acts that are good but not required). Here is the move-by-move breakdown of who holds the stronger position and what philosophical nuances they are overlooking.

  **Step (1): Lena's Opening**
  *   **Who is right:** Lena is intuitively right. Her definition matches the standard philosophical consensus (e.g., J.O. Urmson) that some acts are morally excellent without being obligatory.
  *   **What's missing:** She asserts the category exists without defending *why* it exists. She relies on common sense ("extra credit") which Marco will rightly attack as vague. She hasn't yet defined the boundary between "duty" and "heroism."

  **Step (2): Marco's Challenge**
  *   **Who is right:** Marco is logically sharp but morally reductive. He correctly identifies a tension: if an act is truly *good*, why isn't it *required*? However, he is wrong to equate a risky rescue with returning a wallet.
  *   **What's missing:** He ignores the **magnitude of cost**. Morality generally acknowledges that obligations have limits based on personal sacrifice. By treating all "good acts" as binary (required or neutral), he eliminates the possibility of moral heroism, reducing ethics to a compliance checklist.

  **Step (3): Lena's Defense (Risk/Cost)**
  *   **Who is right:** Lena is right. She identifies the **cost condition**: high personal risk is the standard threshold that converts a duty into an option. This explains why we don't blame the bystander but still praise Dev.
  *   **What's missing:** She risks making morality too subjective. If "risk" makes an act optional, does that mean a terrible swimmer has *less* duty to help than an Olympian? She needs to clarify that the permission comes from the *objective* danger, not just the agent's fear.

  **Step (4): Marco's Collapse Argument**
  *   **Who is right:** This is Marco's strongest point, but it ultimately fails. He argues that "supererogatory" is just "duty + pain." His "too much" objection (morality demands less of those who suffer more) is a known problem called the **demandingness objection**, but his conclusion that the category *collapses* is incorrect.
  *   **What's missing:** Marco conflates **obligation** with **moral worth**. An act can be optional (not obligatory) yet possess higher moral worth than a mandatory act. His claim that getting up at 5 AM is the same category as jumping into a freezing canal ignores that the latter involves a threat to life, which changes the *nature* of the choice, not just the difficulty. He misses that supererogation is about **virtue**, not just rule-following.

  **Step (5): Lena's Counter (The Gap)**
  *   **Who is right:** Lena wins this round. She identifies the distinction between **act evaluation** (was the act wrong?) and **agent evaluation** (is the person virtuous?). The term she half-remembered is **suberogatory** (bad but permissible, like eating the last slice of pizza).
  *   **What's missing:** She needs to clarify that the "gap" isn't just bookkeeping; it's essential for a humane morality. A system without this gap (Marco's view) makes morality too demanding (you must always save others regardless of risk) or too cold (saving a life is no better than returning a wallet).

  **Overall Blind Spots**
  Both miss that this debate depends on which ethical framework you use. Marco is arguing from a strict **Deontological** or **Utilitarian** view (maximize good/follow rules), where supererogation is hard to fit. Lena is arguing from **Virtue Ethics**, where the focus is on character; Dev's action displays excellence of character, which is distinct from mere duty. Both also blur the line between *blameworthiness* (can we punish you?) and *wrongness* (did you violate a moral truth?). Dev's action was permissible to skip (not blameworthy) but exceptional to perform (admirable).

  Verdict: Lena is more right overall because she preserves the distinct moral value of sacrifice that Marco's binary logic reduces to mere bookkeeping.
