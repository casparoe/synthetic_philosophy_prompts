answer: |-
  You have put your finger on exactly why the literature on peer disagreement has felt increasingly sterile over the last decade. Your diagnosis is sharp: **there is a significant amount of verbal maneuvering masking a deeper structural impasse.** However, calling it *merely* verbal might let the participants off the hook too easily. The stagnation isn't just because they are defining "peer" differently; it's because the debate has hit a bedrock collision between two incompatible pictures of rationality.

  Here is a breakdown of why the debate is stuck, where the substantive core actually lies (it's not just case-stipulation), and what genuine progress might look like.

  ### 1. Is it just verbal/artifactual?
  You are right that the stipulations often smuggle in the conclusion.
  *   **The Conciliationist Stipulation:** When Elga or Christensen set up the case, they often emphasize the *symmetry*. By the time you accept the premise that "this person is my epistemic peer," they have often already nudged you to accept that you have no independent access to who is right. If you truly have no idea why you are right and they are wrong, conciliationism feels trivial.
  *   **The Steadfast Stipulation:** When Kelly or van Inwagen set up the case, they emphasize the *first-order reasoning*. They describe a scenario where you have carefully checked the math/argument. In this description, the "peer" status is technically met (same track record), but phenomenologically, you feel you have grasped the truth. If you have grasped the truth, conciliationism feels like self-sabotage.

  **The Verbal Trap:** The word "Peer" is doing too much heavy lifting. It conflates *antecedent reliability* (track record) with *current performance* (this specific instance).
  *   If "Peer" means "equally likely to be right *on this occasion*," Conciliationism is analytically true.
  *   If "Peer" means "equally likely to be right *in general*," Steadfastness is plausible (because on *this* occasion, I might be right and they might be having a lapse).

  Most of the post-2010 literature is just fighting over which definition of "Peer" is the "real" one. That is the verbal artifact you sensed.

  ### 2. The Substantive Core: Three Real Disagreements
  Beneath the verbal jockeying, there are three substantive, non-verbal disagreements that prevent resolution.

  **A. The Uniqueness Thesis vs. Permissivism**
  This is the biggest hidden variable.
  *   **Conciliationism** usually relies on a strong **Uniqueness Thesis**: Given a body of evidence $E$, there is only one rational doxastic attitude toward $p$. If we have the same $E$ and different attitudes, one of us is irrational. Therefore, I must lower my confidence.
  *   **Steadfastness** often covertly relies on **Permissivism**: $E$ allows for a range of rational attitudes. If my attitude is within the rational range, I don't need to move toward you just because you are in a different part of the range.
  *   *Progress Check:* The debate won't move until people admit they are fighting about Uniqueness. If you are a Permissivist, the "Peer Disagreement" problem dissolves significantly.

  **B. The Structure of Higher-Order Evidence (HOE)**
  You asked if the fight is about whether HOE is about the proposition or the reasoner. This is substantive.
  *   **Christensen (Independence Principle):** The fact of disagreement is evidence *independent* of the first-order reasoning. It acts as a defeater regardless of how solid your first-order proof looks. This treats rationality as essentially social/calibrated.
  *   **Kelly (Total Evidence View):** The fact of disagreement is just another piece of evidence to be weighed *alongside* the first-order evidence. If my first-order evidence is overwhelming, the HOE of your disagreement gets swamped.
  *   *The Clash:* This is a clash between **externalist calibration** (I must align with the world/others) vs. **internalist transparency** (I must align with what I see).

  **C. The Normativity of Self-Trust**
  This is the bedrock intuition you mentioned.
  *   **Steadfast:** Self-trust is a precondition of reasoning. To doubt myself every time a peer disagrees is to invite skepticism. I *must* privilege my own cognition to function. (van Inwagen's point: If I conciliate, I lose the ability to believe anything controversial).
  *   **Conciliationist:** Self-trust is a bias. Privileging my own cognition simply because it is *mine* is epistemic egoism. Rationality requires impartiality.
  *   *The Impasse:* You cannot argue someone out of this without begging the question. If you argue "Self-trust is bias," you are using your own reasoning to prove that your reasoning is biased.

  ### 3. Why the "Case Method" Failed
  The field has suffered from **thought experiment fatigue**.
  The standard "Restaurant Bill" or "Math Problem" cases are too clean. They isolate variables so thoroughly that they remove the context in which disagreement actually matters.
  *   In real life, we rarely know someone is a perfect peer. We infer peerhood from the disagreement itself, which creates a circularity that the idealized cases hide.
  *   Because the cases are idealized, they allow both sides to retreat to their corner: "In the *real* world, my view works better." But since the literature demands idealized cases, no one can prove it.

  ### 4. What Would Count as Progress?
  If the debate is stuck because of bedrock intuitions and verbal stipulations, continuing to write "Reply to Kelly" papers is useless. Here is where actual progress lies:

  **A. Abandon the "Peer" Idealization (Social Epistemology Turn)**
  Stop asking "What should I do when I meet a Peer?" and start asking "How do networks of agents with varying reliability converge on truth?"
  *   Work by **Zollman, O'Connor, or Weatherall** uses agent-based modeling to show when steadfastness leads to truth-tracking and when conciliationism does.
  *   *Result:* It turns out steadfastness is better for diversity of opinion (preventing groupthink), while conciliationism is better for rapid consensus. This moves the debate from "What is Rational?" to "What is Ecologically Successful?"

  **B. Domain Specificity**
  Treat moral disagreement differently from mathematical disagreement.
  *   In math, the "Right Reasons" view is dominant (if I proved it, you're wrong).
  *   In politics/ethics, Conciliationism feels stronger.
  *   A unified theory of peer disagreement might be a mistake. A taxonomy of *types* of disagreement would be more useful.

  **C. Meta-Epistemological Honesty**
  The most honest progress would be a paper that admits: **"This is a clash between two epistemic values: Accuracy vs. Autonomy."**
  *   Conciliationism prioritizes **Accuracy** (minimizing error by deferring to the aggregate).
  *   Steadfastness prioritizes **Autonomy/Coherence** (maintaining the integrity of one's own cognitive system).
  *   Progress would look like mapping the trade-offs rather than claiming one side "wins."

  **D. The "Defeater" Mechanism**
  Instead of arguing about the *result* (split the difference vs. stay put), model the *mechanism*.
  *   Under what specific conditions does the fact of disagreement *actually* degrade the justification for $p$?
  *   Recent work on **defeaters** suggests that disagreement only matters if you cannot identify a specific error in the other person's reasoning *without* assuming you are right. If you can identify the error on neutral grounds, you can be steadfast. If you can't, you must conciliate. This bridges the gap: it's not "always split" vs. "never split," it's "split conditional on opaque error."

  ### Summary
  Your diagnosis is correct: the literature is stuck in a loop of stipulative case-building where "peer" is defined to yield the desired result.

  However, underneath that is a real, unresolvable tension between **impartiality** (the view from nowhere) and **situatedness** (the view from here).
  *   **Progress** won't come from better thought experiments.
  *   **Progress** will come from:
      1.  Formal modeling of truth-tracking (moving away from intuition).
      2.  Admitting that Uniqueness vs. Permissivism is the real driver.
      3.  Shifting from "What should I believe?" to "How should we inquire?"

  If you are writing on this, the most valuable contribution would be to stop trying to solve the "Peer Disagreement" problem and start diagnosing why the *framework itself* is the obstacle. The "Peer" is a philosophical unicorn; chasing it has distracted us from the messy reality of asymmetric, noisy, social inquiry.
