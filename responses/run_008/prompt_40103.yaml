      *   *Do the tokens do all the work?* Yes, often. Conciliationists tend to focus on the *fact* of disagreement as a defeater. Steadfasters focus on the *content* of the reasoning.
      *   *Is there something substantive?* Yes. It touches on the structure of justification (internalism vs. externalism), the nature of evidence (psychological states vs. facts), and the normativity of rationality (uniqueness vs. permissivism).

  3.  **Deconstruct the Substantive Issues:**
      *   **Higher-Order Evidence (HOE):** Christensen's point is crucial. Is HOE just about *me* (I might be tired) or about *p* (given that she thinks not-p, p is less likely)? This is a substantive metaphysical/epistemological divide.
      *   **Uniqueness vs. Permissivism:** If the Uniqueness Thesis is true (one body of evidence supports one doxastic attitude), then peer disagreement implies someone is wrong, pushing towards conciliationism. If Permissivism is true (evidence allows a range), steadfastness is easier to justify.
      *   **Total Evidence View (Kelly):** Kelly argues you don't just split the difference; you weigh the first-order evidence *plus* the higher-order evidence. This isn't just verbal; it's a claim about how evidence aggregates.
      *   **Self-Trust:** This is the bedrock. Can I rationally privilege my own reasoning? If yes, steadfastness has a foothold. If no, conciliationism wins.

  4.  **Address the "Stuckness" (Why hasn't it moved?):**
      *   **Idealization:** The "Peer" concept is too clean. Real life is messy (asymmetric expertise, hidden biases).
      *   **Intuition Pumping:** Both sides use thought experiments that trigger specific intuitions.
      *   **Lack of Formal Precision:** While there are formal models (Bayesian), they often rely on priors that beg the question.

  5.  **Brainstorm Paths to Progress:**
      *   **Abandoning "Peer":** Move to "Epistemic Superiors/Inferiors" or network models.
      *   **Social Epistemology:** Shift from individual justification to group inquiry/truth-tracking.
