answer: |-
  Dear colleague, it is a pleasure to hear from you and to know that you are tackling prioritarianism and the leveling-down objection with your second-year seminar. These are notoriously difficult concepts to motivate because they often feel like semantic squabbles until students feel the tension in their own judgments. Your instinct to have them run into the problem before naming it is exactly right. Below is a complete design for the ninety-minute session, including the materials, the specific numerical setup, the timeline, the debriefing strategy, and a candid assessment of where the activity might stumble and what it cannot do.

  You will need very little in the way of physical materials, which helps keep the focus on the reasoning rather than the props. For a class of sixteen, I recommend dividing them into four committees of four students each. This ensures everyone has to speak during the small group deliberations, preventing the usual dynamic where two dominant voices carry the whole room. Each group needs a stack of index cards and a marker. You will need the whiteboard to track the official state of the fictional country, which we will call Divisia. Divisia has two regions, the Highland and the Lowland. The metric on the board is Health Welfare Units, or HWU, which you should explain is a composite measure of life expectancy, morbidity, and quality of life, normalized so that higher is better. You must insist that these numbers are cardinal and interpersonally comparable, otherwise the math will not work, though you should acknowledge briefly that this is a philosophical assumption they are granting for the sake of the game.

  The game proceeds in three distinct phases, each representing a round of budgetary decisions. You should write the starting position on the board before class begins: Highland has 100 HWU, Lowland has 50 HWU. In the first phase, tell the committees they are the National Health Board. They have a fixed budget intervention they can apply once. Present them with two policy options written on the board. Policy Alpha adds 30 units to the Lowland and 0 to the Highland. The new state would be Highland 100, Lowland 80. Policy Beta adds 0 units to the Lowland and 40 units to the Highland. The new state would be Highland 140, Lowland 50. Give them five minutes to discuss and vote on a card. Collect the cards and tally the votes on the board. This round is designed to pit total welfare against equality. Policy Beta creates more total welfare (190 versus 180) but widens the gap significantly. Policy Narrower creates less total welfare but narrows the gap. If they choose Beta, they are voting utilitarian. If they choose Alpha, they are signaling that the welfare of the worse-off counts for more, or that equality has intrinsic value.

  The second phase is the crucial moment for the leveling-down objection. Tell the students that a natural blight has struck the Highland region. Their agricultural infrastructure is ruined, and their health outcomes have collapsed. You do not offer a choice here. You simply update the board. The Highland drops from 100 to 50. The Lowland remains at 50. Now the two regions are perfectly equal. Ask the committees to discuss a single question and write their answer on a card: Is this new state of affairs better than the original starting state in any respect? The original state was 100 and 50. The new state is 50 and 50. Total welfare has plummeted from 150 to 100. Equality has been achieved. Give them five minutes. Then take a show of hands on whether anyone thinks the country is in any respect better off. This is the trap. If anyone says yes, because equality is better, they have committed themselves to telic egalitarianism, which holds that equality is intrinsically valuable. If they say no, because no one is better off and some are worse off, they have intuitively grasped the leveling-down objection.

  The third phase introduces the veil of ignorance twist. Reset the board to the original starting state of 100 and 50. Tell the students they must vote on Policy Alpha and Policy Beta again, the same options from the first round. However, before they vote, announce that once the decision is made and the outcomes are finalized, you will roll a die. If it is even, they will all be residents of the Highland. If it is odd, they will all be residents of the Lowland. Their grade for participation or a small prize will depend on the welfare level of the region they are assigned to. This adds personal stake. Give them five minutes to vote again. Collect the cards. You are looking to see if the votes shift toward Policy Alpha. Rational self-interest under uncertainty usually pushes people toward maximizing the minimum outcome, which aligns with prioritarianism, but sometimes it just makes them risk-averse.

  For the timeline, you should spend the first ten minutes setting up the groups and explaining the rules. Do not mention Parfit, prioritarianism, or egalitarianism yet. Just talk about health funding. Spend twenty-five minutes on the first two phases. This allows time for the groups to argue. Spend fifteen minutes on the third phase with the die roll announcement. This leaves forty minutes for the debrief, which is where the philosophical work happens. You must resist the urge to lecture immediately. Start by asking why their votes changed or stayed the same between round one and round three. If they shifted toward helping the Lowland once their own skin was in the game, ask them if their moral view changed or if they were just being selfish. This muddies the water between believing the worse-off count for more and merely fearing being the worse-off, which is exactly the tension you want them to feel.

  Then move to the blight round. Ask the students who voted that the blight scenario was in some respect better to explain why. Write their reasons on the board. They will likely say it is fairer, or less unjust. Then ask the students who voted it was worse to explain why. They will say people are suffering more. Here is where you introduce the terms. Explain that the view that equality is intrinsically good, even if it requires making everyone worse off to achieve it, is called telic egalitarianism. Explain that the objection they raised, that a change cannot be better if it is better for no one and worse for some, is the leveling-down objection. Finally, introduce prioritarianism as the view that avoids this problem. Prioritarianism says we should give priority to the worse-off not because equality is good, but because benefits to the worse-off matter more. This explains why they chose Policy Alpha in round one without committing them to saying the blight was good. The blight helped no one, so the priority view says it is not better. But giving help to the Lowland in round one benefits the worse-off, so it is preferred even if total welfare is slightly lower. Save the names for these last ten minutes.

  Now I must be honest about what will predictably go wrong, because I have run this several times and the failures are consistent. The most common issue is students gaming the numbers. In the first round, a clever student will realize that Policy Beta yields 190 total units and Policy Alpha yields 180, and they will argue that 190 is objectively better simply because the number is bigger. They will treat the HWU like money in a bank account rather than welfare. You need to intervene early and remind them that welfare exhibits diminishing marginal utility, though you might not use that term. You can say that 10 units for a starving person is worth more than 10 units for a satiated person. If you do not prime this, the utilitarian calculation becomes too easy and the moral tension vanishes. Another predictable failure is distraction during the second round. The blight round has no vote, only a discussion question, and students often check their phones because there is no deliverable other than a card. You must collect the cards physically to keep them engaged. Finally, the math can break down if you miscalculate the totals on the board. Double-check your arithmetic before class. If you write 190 and it is actually 185, a student will catch it and the credibility of the scenario will collapse.

  There is also a deeper philosophical limitation that you cannot fix with better numbers, and you should address this in the debrief. The activity makes interpersonal aggregation feel too easy. On the whiteboard, adding 10 units here and 10 units there looks like simple arithmetic. In reality, comparing welfare across persons is notoriously difficult. The game assumes we can know that 30 units for the Lowland is comparable to 40 units for the Highland. Students might leave thinking the hard part was the moral choice, when the hard part is actually the measurement. You need to tell them explicitly that the game rigs the metaphysics to make the ethics visible. We are pretending we can measure welfare perfectly so we can argue about how to distribute it. In the real world, we often do not know the numbers, which complicates prioritarianism further. Additionally, the game cannot reproduce the emotional weight of actual suffering. Choosing to lower the Highland from 100 to 50 on a whiteboard is abstract. Choosing to let real people get sick is visceral. The activity isolates the logical structure of the arguments, but it strips away the phenomenological cost. You must supply that context in the debrief by asking them to imagine what the HWU loss actually means in terms of pain or early death.

  Despite these limitations, this structure works because it forces them to inhabit the conflict. They will feel the pull of efficiency in round one, the repulsion of the blight in round two, and the anxiety of the die roll in round three. When you finally name prioritarianism, it will feel like a solution to a problem they have just lived through, rather than a definition to memorize. If you keep the numbers clean and hold the line on the rules, you should find that the debate in the final forty minutes is much richer than if you had started with the reading. I hope this serves you well next week, and I would be keen to hear how the committees vote on the blight question.
