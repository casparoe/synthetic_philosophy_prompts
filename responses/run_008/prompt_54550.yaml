answer: |-
  Section 1, "Overall verdict"
  Marcus is marginally more right overall, because he correctly identifies that removing electoral accountability without replacing it with robust institutional scaffolding invites capture by organized interests. Dana offers a superior critique of elections but underestimates the vacuum of power that sortition creates in a governing body. Consequently, her proposal risks swapping one form of elite control for another.

  Section 2, "Move-by-move adjudication"
  (1) **Aristocratic Elections** — Mostly right. Empirical data confirms elections favor wealth and status, making the aristocratic critique accurate. However, descriptive representation does not automatically guarantee substantive representation of interests. Dana's claim about equality is normative but coherent.

  (2) **Competence Analogy** — Mostly mistaken. Governing involves value judgments and tradeoffs rather than purely technical skills, making the surgery analogy flawed. While expertise matters, civil servants provide technical support, leaving political judgment to representatives. Marcus conflates technical implementation with political direction.

  (3) **Civil Servant Support** — Mostly right. Modern governance relies heavily on bureaucratic expertise, validating the claim that elected officials primarily set priorities. The jury analogy holds for judgment but overlooks differences in deliberative context and duration. Dana correctly identifies the primary role of a legislator.

  (4) **Structural Capture** — Mostly right. Juries operate under strict judicial control, whereas legislative bodies face external pressure without similar protections. The math of capturing a small group versus a large electorate is logically sound regarding lobbying efficiency. Marcus correctly highlights the vulnerability of small groups.

  (5) **Campaign Finance Cure** — Mostly right. Removing campaign finance needs significantly reduces one major vector of corruption. However, it assumes donors cannot influence members through other means during their term, which Marcus challenges. Dana's point about vested interests is plausible but speculative.

  (6) **Electoral Accountability** — Clearly right. Electoral threat is a unique mechanism for enforcing responsiveness to the broader public rather than immediate peers. Without re-election or removal, members may prioritize comfort or narrow interests over long-term city welfare. This remains the strongest argument against sortition for governing bodies.

  Section 3, "What both are missing"
  Both neglect the distinction between advisory assemblies and governing councils with executive power, which changes the stakes of competence and accountability. The ambiguity between small-city and national polity matters significantly because local politics often hinges on administrative competence and neighborhood-specific knowledge rather than broad ideological tradeoffs, potentially making sortition riskier for municipal budgets than national constitutions. Furthermore, neither considers hybrid models where elected bodies set broad mandates while lotted assemblies review specific legislation, which could capture Dana's equality gains while preserving Marcus's accountability mechanisms.
