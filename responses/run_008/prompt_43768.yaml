answer: |-
  This is a sophisticated methodological approach. By fixing the adequacy conditions before arguing for a solution, you avoid the common pitfall of tailoring the metaphysics to fit a pre-chosen conclusion. Below is a draft of the desiderata section, structured to meet your specific constraints, followed by the tension analysis, scoring, and meta-commentary on the physicalism constraint.

  ***

  ### Desiderata for an Adequate Account of Mary's Release

  To count as a solution to the Knowledge Argument, a theory must not merely describe Mary's epistemic shift; it must locate that shift within a metaphysical framework that explains *why* the shift occurs and *what* it entails for the ontology of mind. The following five desiderata establish the conditions of adequacy.

  **1. The Phenomenal Datum Constraint**
  *   **Requirement:** The theory must validate the intuition that Mary undergoes a significant, non-trivial epistemic change that is specifically *phenomenal* in character. It cannot dismiss the "Wow" moment as confusion, memory failure, or mere linguistic uptake.
  *   **Motivation:** Any account that explains away the intuition (e.g., by claiming Mary was simply ignorant of a trivial ability) fails to engage with the force of the argument. The KA derives its power from the robustness of the intuition that she learns something *about the world* (or herself) that she could not access via physics.
  *   **Variant Application:** In the **Skilled Visualizer** variant, where Mary can simulate red experience via imagination, the theory must explain why the actual perception still differs. If imagination suffices for the knowledge, the KA collapses; if it does not, the theory must pinpoint the deficit in visualization (e.g., lack of causal contact, lack of sensory conviction).

  **2. The Distinction-Stack Sensitivity**
  *   **Requirement:** The theory must explicitly categorize the gain along three axes: (a) Propositional (Fact) vs. Non-Propositional (Ability/Acquaintance); (b) Ontological (New Property) vs. Epistemological (New Concept/Mode); (c) Semantic (New Information) vs. Cognitive (New Vehicle).
  *   **Motivation:** Ambiguity here is the primary source of dialectical stalemate. A theory that claims Mary gains a "new fact" without specifying if 'fact' implies 'truth-maker' or 'true proposition' is useless.
  *   **Variant Application:** In the **Tetrachromat** extension, Mary encounters a color dimension she lacked concepts for entirely. A "New Concept" theory must explain how a concept is acquired for a property type previously absent from the cognitive repertoire, whereas a "New Fact" theory must explain where this fact was stored in the physical dossier.

  **3. The Indexical/Neuro Stipulation (Design Question 1)**
  *   **Requirement:** We must stipulate that Mary's physical omniscience includes all **non-indexical physical facts about her own neurophysiology**, past, present, and future. She knows "Subject M's visual cortex will fire in pattern P upon exposure to 650nm light."
  *   **Motivation:** This blocks the "Indexical Reply" from winning by fiat. If we allow physical omniscience to exclude facts about one's own current state (e.g., "I am in state P now"), then physicalism is insulated from the KA by a trivial definition of 'physical fact.' To test physicalism, we must assume the physical description of the world is complete *except* for the indexical perspective. The theory must then explain whether the "what it is like" is *just* the indexical perspective on a physical state, or something over and above it.
  *   **Verdict:** If the theory relies on indexicals, it must argue that phenomenal knowledge *is* essentially indexical knowledge of a physical state, not that it is non-physical knowledge.

  **4. The Veridicality/Causal Constraint (Design Question 2)**
  *   **Requirement:** In the **Mislabelled Monitor** case (Mary sees Green, believes Red), the theory must verdict that Mary does **not** learn what Red is like. She learns what Green is like under the false description "Red."
  *   **Motivation:** This tests whether the theory privileges the *internal sensation* or the *external property*. If the theory claims she learns what Red is like because her internal state matches her "Red" dossier, it severs the link between phenomenal knowledge and the world, making phenomenal knowledge solipsistic.
  *   **Work of Experience:** This constraint forces the theory to explain what work the experience is doing. It is not merely triggering a latent concept; it is establishing a **causal-informational link** to a specific property instance. The acquisition requires the *instantiation* of the property in the environment to anchor the concept/fact.

  **5. The Physicalism Entailment Constraint**
  *   **Requirement:** The theory must entail a verdict on the truth of physicalism. It cannot remain agnostic.
  *   **Motivation:** The KA is a reductio against physicalism. A solution that says "Mary gains X, and whether X is physical is a separate question" is incomplete. The ontology of X determines the fate of physicalism.
  *   **Variant Application:** In the **Tetrachromat** case, if Mary gains knowledge of a new property type, and physicalism says all property types are physical, the theory must explain why physics missed this property type until she saw it.

  ***

  ### Tension Analysis: Incompatible Desiderata?

  You suspect a tension between **Desideratum 5 (Physicalism Entailment)** and the methodological goal of **Neutrality on Phenomenal Properties**.

  **My View:** The tension is real, but it is a feature, not a bug. It is not an artifact of your framing.
  You cannot have a theory that *settles* the fate of physicalism while remaining *neutral* on whether phenomenal properties are physical properties. To explain *what* Mary acquires just is to take a stand on the ontology of the phenomenal.
  *   If you say she acquires a **new fact**, you likely entail **False Physicalism** (unless you adopt a non-standard view of facts).
  *   If you say she acquires a **new concept**, you likely entail **True Physicalism** (via PCS).
  *   If you say she acquires **nothing new** (illusionism), you entail **True Physicalism** but violate Desideratum 1.

  **Resolution:** Do not aim for neutrality on the *ontology* of the gain. Aim for neutrality on the *premise* of the argument. Your theory should not *assume* physicalism is true to prove Mary gains only concepts. It should derive the ontology of the gain from the epistemic conditions. The tension dissolves if you rephrase the goal: The theory must not *beg the question* against physicalism, but it must *deliver a verdict* on it. Neutrality is a constraint on the *argumentative path*, not the *conclusion*.

  ***

  ### Scoring Standard Responses

  **1. The Ability Hypothesis (Lewis/Nemirow)**
  *   **Performance:** Fails Desideratum 1 (Phenomenal Datum). It reduces the "Wow" to knowing-how, which feels like a revision of the intuition rather than an explanation.
  *   **Variants:** Struggles with the **Skilled Visualizer**. If Mary can visualize perfectly, does she have the ability? If yes, why leave the room? If no, what is the ability?
  *   **Physicalism:** Saves physicalism easily, but at the cost of the datum.

  **2. The Phenomenal Concept Strategy (PCS)**
  *   **Performance:** Strong on Desideratum 2 (Distinctions). Successfully separates concept acquisition from fact acquisition.
  *   **Design Q1:** Handles the Indexical stipulation well by arguing phenomenal concepts are recognitional/indexical concepts of physical states.
  *   **Design Q2:** Handles the Mislabel case by tying the concept to the causal history of the experience.
  *   **Weakness:** Struggles with the "Explanatory Gap." It explains *that* she gains a concept, but not *why* that concept feels so ontologically weighty (Desideratum 5 tension).

  **3. Jackson's Later View (Representationalism)**
  *   **Performance:** Accepts Desideratum 1 but reinterprets the content. Mary gains knowledge of a representational property of the world.
  *   **Physicalism:** Saves physicalism by denying intrinsic qualia.
  *   **Weakness:** High cost to Desideratum 1. Many find the denial of intrinsic phenomenal character implausible. In the **Tetrachromat** case, it must claim the new color is just a new representational relation, which may not capture the qualitative novelty.

  ***

  ### Meta-Commentary: The Physicalism Constraint

  You wrote: *"A theory that gets every case right but tells me the fate of physicalism is not its business has failed by my lights."*

  **I accept this purpose.** It does not beg the question.
  The Knowledge Argument is not a puzzle about Mary; Mary is a thought experiment. The puzzle is about Physicalism. A theory of Mary that does not resolve the status of Physicalism is like a theory of the Twin Earth puzzle that does not resolve the status of Internalism about content. It misses the point of the device.

  However, you must be careful not to define "Physicalism" in a way that makes the verdict trivial.
  *   **Bad Move:** Defining physicalism as "The view that Mary learns nothing new." (This makes the KA analytic falsehood).
  *   **Good Move:** Defining physicalism as "The view that all concrete entities/properties are physical." Then, using your theory of Mary to show whether the "new thing" she learns is a concrete entity/property or an epistemic artifact.

  Your constraint is correct: The dissertation chapter must use the analysis of Mary to drive a wedge into the ontology of the mental. If the chapter ends with "Mary gains X, and physicalists can accept X," you have not finished the job. You must argue *why* physicalists can or cannot accept X. The adequacy of the theory is tied to its ability to force that confrontation.
