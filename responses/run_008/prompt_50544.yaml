prompt: |-
  I work in the ethics/safeguards review unit of a regional development agency. We sign off on projects that can plausibly change who gets born a generation or two later — big resettlement schemes, dams, family planning programs, even cash transfers that shift when people marry and have kids. Someone on our team read about Parfit's nonidentity problem and pointed out that our whole harm-based framework quietly assumes the affected people would have existed anyway. She's right that once a policy changes who will be born, the complaint "this harms future people" gets slippery: the person born under the policy can't coherantly complain if their life is worth living and the alternative was that they'd never exist at all. Our review forms still have a checkbox that says "adverse effects on future generations," and nobody knows what to do with it in exactly the cases it was written for.

  So: you're a professional philosopher specializing in population ethics, and I want you to think carefully about this — maybe start with a short brainstorm about which distinctions actually matter for a working tool and which we can drop, before writing the procedure itself. Then give us:

  1. A screening question or two that tells a review officer when the nonidentity issue is even in play (most projects won't trigger it — help us not burn time on the ones that don't).

  2. The ordered checklist: what to establish at each step, what counts as a sufficient answer, where it resolves, and where it stops and escalates to the panel because it's a question of values rather than facts. I'd expect at least one such handoff around the "is a life worth living" threshold — tell me honestly whether that's a judgment call dressed up as a step, and whether there's any defensible default we can just write down, or whether we should admit there isn't.

  3. It should handle the distinction between choices affecting the same people and choices affecting the same number of different people, in plain language, because our officers will not read Parfit. If some distinction genuinely can't survive translation into plain language without becoming wrong, say that instead of pretending.

  4. Worked runs on three cases: (a) a dam that floods a valley and resettles 40,000 people, changing marriage and livelihood patterns so that within a generation different people are being born downstream; (b) a voluntary family planning program in a region where most pregnancies are already wanted, so the program mostly changes timing; (c) a watershed restoration project whose effects all land within the lifetimes of people already alive.

  5. One of the worked runs should come out somewhere the panel will hate — for instance that, on a strict nonidentity view, the resettlement case can't be criticized as harming future people at all, only via the currently living. Show what the procedure can and can't do there, and what we should write in the file instead of a fake answer.

  Constraints, so you calibrate: roughly fifteen triggering projects a year, medium stakes (livelihoods, usually not life and death), each review has to be doable by two non-philosphers in about an hour, sign-off is a two-officer panel, and we have no budget for a per-project external philosopher. So no literature survey, no name-dropping for its own sake — the theory has to come out the other end as a tool. But don't dumb it down to the point where it's quietly wrong; if simplification loses something that matters, flag it.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** Ethics/safeguards review officer at a regional development agency.
      *   **Problem:** The current harm-based framework fails when projects change *who* gets born (Nonidentity Problem). The "adverse effects on future generations" checkbox is meaningless in these cases because the future people wouldn't exist otherwise.
      *   **Task:** Act as a professional philosopher specializing in population ethics. Create a practical tool (screening questions, checklist, worked examples) that handles the nonidentity problem without requiring philosophical expertise.
      *   **Constraints:** ~15 triggering projects/year, medium stakes, 1 hour review time, 2 non-philosopher officers, no external budget. Must be accurate (not "dumbed down" to the point of error) but usable.
      *   **Specific Requirements:**
          1.  Brainstorm distinctions (what matters vs. what to drop).
          2.  Screening questions (trigger identification).
          3.  Ordered checklist (steps, resolution points, escalation to panel, handling "life worth living").
          4.  Plain language explanation of "same people" vs. "different people."
          5.  Three worked cases (Dam, Family Planning, Watershed). One must yield a counter-intuitive result (e.g., no harm to future people in the dam case) and explain how to document that honestly.

  2.  **Philosophical Core (The Nonidentity Problem):**
      *   *The Problem:* If an action changes the identity of future people (by changing when/conception happens), those people cannot claim they were harmed by the action, because without the action, they wouldn't exist. If their lives are worth living, they are not worse off than they would have been (non-existence).
      *   *Implication for Policy:* Standard "harm" metrics fail. We need a different standard for these cases.
      *   *Potential Solutions:*
          *   *Person-Affecting View:* Stick to harm, admit no harm to future people (counter-intuitive).
          *   *Impersonal Total/Average Utilitarianism:* Compare total/average well-being of the two populations (hard to calculate, risky).
          *   *Threshold Views:* Ensure future people have lives above a certain threshold of decency (The "Threshold View" or "Condition of Personhood"). This is the most practical for development agencies.
          *   *Rights-Based:* Future people have rights to certain conditions regardless of identity.
      *   *Selection for Tool:* The **Threshold View** is the most robust for safeguards. We can't easily compare total utility, but we can ensure minimum standards. We also need to acknowledge the "Same People" cases where standard harm analysis *does* work.

  3.  **Drafting the Brainstorm (Distinctions):**
      *   *Keep:* Identity-affecting vs. Identity-neutral. Life worth living vs. Life not worth living. Minimum threshold of decency.
      *   *Drop:* Complex counterfactual comparisons of total utility. Precise calculation of "who" is born (too speculative). Metaphysical debates about personhood.
      *   *Crucial Translation:* "Same People" = Policy changes conditions for existing/fixed population. "Different People" = Policy changes timing/circumstances of conception such that the specific future individuals are different.

  4.  **Developing the Tool (Screening & Checklist):**
      *   *Screening:* Needs to catch timing shifts and resettlement.
      *   *Checklist:*
          1.  Identify identity impact.
          2.  If Same People -> Standard Harm Analysis.
          3.  If Different People -> Threshold Analysis (Is the life worth living? Is it below a decent minimum?).
          4.  Escalation: If lives are above "not worth living" but below "decent," this is the value judgment zone.
      *   *The "Life Worth Living" Trap:* This is indeed a judgment call. We can't define it precisely. *Strategy:* Set a default safeguard threshold (e.g., basic rights, subsistence, health). If below, stop. If above, proceed but note the nonidentity constraint.
      *   *Plain Language:* Use "Same Future Faces" vs. "New Future Faces."

  5.  **Worked Cases:**
      *   *(a) Dam:* Resettlement changes marriage/timing -> Different People. Standard harm doesn't apply to *them*. Harm applies to *currently living* who are displaced. Future people get a "Threshold Check." Result: Can't claim harm to future people if lives are decent. This is the counter-intuitive one.
      *   *(b) Family Planning:* Changes timing -> Different People. But usually improves welfare. Threshold check passed.
      *   *(c) Watershed:* Effects within current lifetimes -> Same People. Standard harm analysis applies.

  6.  **Refining the "Counter-Intuitive" Result:**
      *   The prompt asks for one case where the panel will hate the result (e.g., Dam case = no harm to future people).
      *   *Challenge:* How to document this without sounding negligent?
      *   *Solution:* Distinguish between "Harm to Future Individuals" (blocked by nonidentity) and "Wrongful Policy" (can still be wrong if it creates people with low quality of life, even if not *harmed* relative to non-existence). The tool should force the officers to write: "No comparative harm to future individuals identifiable, but policy creates conditions below acceptable threshold" OR "Policy creates decent lives, therefore nonidentity objection fails."
      *   *Better approach for Agency:* Adopt a "Minimum Threshold of Acceptability" for future people. If the policy creates people who will live below this threshold, it's rejected, *not because they are harmed*, but because it's wrong to create people in that state. If above, it passes, even if a different policy could have created *better* people.

  7.  **Addressing Constraints:**
      *   *Time:* 1 hour. The tool must be a 1-2 page checklist.
      *   *Expertise:* No philosophy jargon.
      *   *Honesty:* Admit where the philosophy is messy (the "Threshold" is arbitrary but necessary).

  8.  **Drafting the Content (Iterative refinement):**
      *   *Intro:* Acknowledge the gravity. Parfit is right, but we need to act.
      *   *Brainstorm:* Focus on "Identity-Affecting" vs. "Identity-Neutral."
      *   *Screening:* Focus on *timing of conception* and *displacement*.
      *   *Checklist:* Step 1 (Identity), Step 2 (Standard Harm if Same), Step 3 (Threshold if Different).
      *   *The "Handoff":* The threshold determination is the value judgment. Default = National/International Human Rights standards.
      *   *Plain Language:* Use "Fixed Future Population" vs. "Fluid Future Population."
      *   *Cases:* Ensure the Dam case highlights the "No Harm" conclusion clearly but provides the "Threshold" workaround.

  9.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is saying "no harm to future people" too dangerous?
      *   *Fix:* Frame it as "Comparative Harm" vs. "Threshold Violation." The agency shouldn't say "It's fine." It should say "Standard harm metrics don't apply; assessing against Minimum Decency Standard."
      *   *Critique:* Is the Family Planning case actually nonidentity?
      *   *Fix:* Yes, changing timing of conception changes genetic identity. Even if parents are the same, the *child* is different.
      *   *Critique:* Is 1 hour enough?
      *   *Fix:* The screening must filter out 90% of projects. Only the tricky 15/year get the full checklist.

  10. **Final Polish:** Ensure tone is professional, empathetic to the officers' predicament, and philosophically rigorous but practical. (Make sure to explicitly address the "panel will hate this" requirement in the Dam case).

  *(Self-Correction on the "Panel will hate" requirement)*: The prompt asks for a worked run where the procedure concludes something the panel might hate (e.g., "can't be criticized as harming future people"). I need to make sure the *procedure* leads there, but then offers the *documentation* strategy to handle the political fallout. The philosophical truth is that they aren't harmed *comparatively*. The policy tool must reflect that truth while maintaining safeguards.

  Let's structure the response:
  1.  **Philosophical Triage (Brainstorm):** What to keep/drop.
  2.  **The Tool:** Screening + Checklist.
  3.  **Plain Language Guide:** Same vs. Different People.
  4.  **Worked Cases:** Dam (The hard one), Family Planning, Watershed.
  5.  **Implementation Note:** How to file the "uncomfortable truth."

  *Wait, one nuance:* The prompt asks for "One of the worked runs should come out somewhere the panel will hate — for instance that, on a strict nonidentity view, the resettlement case can't be criticized as harming future people at all, only via the currently living."
  *Okay, I will ensure the Dam case concludes exactly that, but provides the "Threshold" workaround as the ethical safeguard.*

  *Refining the "Threshold":* Since we can't do external philosophy, the "Threshold" must be existing agency standards (e.g., poverty line, human rights charter). This makes it actionable.

  *Refining the "Handoff":* The handoff isn't just "is life worth living" (too abstract). It's "Does this fall below our mandated minimum standards for human welfare?" That's a factual/policy check, not pure philosophy. The *philosophical* handoff is acknowledging that *above* that line, we can't claim harm to future individuals.

  *Let's write.*
answer: |-
  ### Part 1: Philosophical Triage (Brainstorm for the Tool)

  You are right to be worried. If you ignore the nonidentity problem, your harm assessments are technically incoherent for a specific class of projects. If you embrace it too fully, you risk paralysis or moral blindness (approving terrible policies because "at least they exist").

  For a working tool with your constraints (1 hour, non-philosophers, medium stakes), we must simplify without lying. Here is the triage of what matters and what we must drop.

  **Keep (Operational Distinctions):**
  1.  **Identity-Neutral vs. Identity-Affecting:** Does the policy change *conditions* for existing people, or does it change *who* comes into existence?
  2.  **Comparative Harm vs. Threshold Violation:** Can we say Person A is worse off than they would have been? (Comparative). Or, is Person A's life below a minimum standard of decency, regardless of the alternative? (Threshold).
  3.  **The "Currently Living" Anchor:** Harms to people currently alive are never subject to the nonidentity problem. This is your safe ground.

  **Drop (Theoretical Baggage):**
  1.  **Total vs. Average Utility:** Do not try to calculate if the world is "better" in total. You lack the data and the mandate.
  2.  **Metaphysical Personhood:** Do not debate when life begins. Use your agency's existing legal definition of "beneficiary" or "affected person."
  3.  **Precise Counterfactuals:** Do not try to model exactly *which* different people will be born. It is enough to know that the *set* of people will be significantly different.

  **The Core Compromise:**
  We cannot solve the nonidentity problem. We can only manage it. The tool will force officers to admit when "harm" is the wrong metric and switch to a "Minimum Decency Threshold." If a future person's life is above that threshold, you cannot claim they are "harmed" by being born, even if a different policy would have created different, happier people. This is the bullet you have to bite.

  ***

  ### Part 2: The Screening & Procedure Tool

  #### A. Screening Questions (The Trigger)
  *Use these at the initial concept note stage. If "No" to both, file under Standard Harm Review. If "Yes" to either, proceed to the Checklist.*

  1.  **Timing & Conception:** Will this project significantly change the timing of marriage, conception, or birth for a large group (e.g., >500 households)? (Examples: Cash transfers conditional on school attendance, family planning, major livelihood shifts).
  2.  **Displacement & Resettlement:** Will this project physically move a population or alter their environment so drastically that community mixing and family formation patterns will change for the next 30+ years? (Examples: Dams, highway corridors, urban renewal).

  #### B. The Identity-Affecting Review Checklist
  *Time limit: 45 minutes. Two officers.*

  **Step 1: Classify the Future Population**
  *   **Question:** Are the future people affected by this decision the *same specific individuals* who would have existed without the project, or *different specific individuals*?
  *   **Guidance:** If the project changes *when* parents meet or conceive (even by a few months), the resulting children are genetically different people. If the project only changes the *health/income* of parents without changing conception timing, they are the same people.
  *   **Decision:**
      *   [ ] **Same People:** Go to Step 2A.
      *   [ ] **Different People:** Go to Step 2B.

  **Step 2A: Standard Harm Analysis (Same People)**
  *   **Task:** Compare the well-being of these specific future people *with* the project vs. *without* the project.
  *   **Resolution:** If they are worse off with the project, mark "Adverse Effect."
  *   **Escalation:** None. This is standard procedure.

  **Step 2B: Threshold Analysis (Different People)**
  *   **Task:** You cannot claim these people are "worse off" than they would have been (since the alternative was non-existence). Instead, assess their absolute quality of life.
  *   **Question:** Will the future people created by this policy have lives **below the Agency's Minimum Decency Threshold**? (Refer to Annex A: Human Rights/Poverty/Health Standards).
  *   **Decision:**
      *   [ ] **Below Threshold:** **FAIL.** The project creates people destined for lives not worth living (by agency standards). Escalate to Panel for rejection or redesign.
      *   [ ] **Above Threshold:** **PASS (with caveat).** The project creates people who will have decent lives. You cannot logically claim they are "harmed" by being born into this scenario, even if another scenario might have produced happier people.
  *   **Escalation (The Value Handoff):**
      *   If the projected quality of life is **barely above** the Minimum Decency Threshold, but a feasible alternative policy could have created a population with **significantly higher** well-being, this is a **Value Judgment**.
      *   **Action:** Escalate to Panel. Note: "Nonidentity constraints apply. No comparative harm to future individuals, but policy may be sub-optimal regarding population welfare."

  **Step 3: Currently Living Affected Persons**
  *   **Task:** Regardless of Step 2, assess harm to people *currently alive* who will be affected by the project (e.g., parents being resettled, current community members).
  *   **Resolution:** Standard harm analysis applies here. This is often where the real ethical leverage lies.

  ***

  ### Part 3: Plain Language Guide (For the File)

  *Include this one-pager in the officer's manual. Do not use the word "Nonidentity."*

  **Understanding "Same Faces" vs. "New Faces"**

  *   **Same Faces (Identity-Neutral):** Imagine a policy that pollutes a river. The children born downstream next year are the same children who would have been born anyway, but they get sick. They can complain: "I am worse off than I would have been." **We can flag this as Harm.**
  *   **New Faces (Identity-Affecting):** Imagine a policy that resettles a village. Because people move, they meet different partners or have children at different times. The children born downstream ten years later are *different specific people* than would have been born otherwise. They cannot say "I am worse off," because without the resettlement, *they* would not exist at all.
  *   **The Rule:** For "New Faces," we do not ask "Are they worse off?" We ask "Is their life decent?" If their life is decent, we cannot claim the project harmed *them*, even if the project was messy. We focus our harm assessment on the *parents* and the *community structure*.

  ***

  ### Part 4: Worked Cases

  #### Case A: The Dam (Resettlement)
  *   **Scenario:** A dam floods a valley. 40,000 people are resettled. Social patterns shift. Downstream hydrology changes.
  *   **Screening:** Yes (Displacement & Livelihood shift).
  *   **Step 1 (Classification):** **Different People.** Resettlement changes marriage markets and economic stability, altering conception timing and partners for the next generation.
  *   **Step 2B (Threshold):**
      *   *Assessment:* The resettlement package provides housing, jobs, and schools. Future children will have lives above the Minimum Decency Threshold.
      *   *Result:* **PASS (with caveat).**
  *   **Step 3 (Currently Living):** The 40,000 displaced adults suffer loss of ancestral land and social cohesion. **Harm Identified.**
  *   **The "Panel Will Hate This" Result:**
      *   **Finding:** "No adverse effect on *future generation individuals* identifiable under the harm framework."
      *   **Why:** The future children owe their existence to the project. Their lives are worth living. To say they are "harmed" is logically incoherent.
      *   **Documentation:** Do not write "No impact." Write: *"Non-identity constraints apply. Future individuals cannot be compared to counterfactual non-existence. Assessment confirms future quality of life meets Minimum Decency Threshold. Adverse effects are concentrated in the currently living displaced population."*
      *   **Risk:** The Panel may feel this lets the project off the hook for long-term cultural erosion.
      *   **Mitigation:** The "Value Handoff." If the cultural erosion is severe, escalate not as "harm to future kids" but as "violation of cultural rights of the current community that extends temporally."

  #### Case B: Family Planning (Timing)
  *   **Scenario:** Voluntary program in a region where pregnancies are wanted. Subsidies encourage delaying first birth by 2 years.
  *   **Screening:** Yes (Timing of conception).
  *   **Step 1 (Classification):** **Different People.** A 2-year delay in conception means different sperm/egg combination. The child born in 2026 is not the child who would have been born in 2024.
  *   **Step 2B (Threshold):**
      *   *Assessment:* Delayed births correlate with higher maternal health and economic stability. Future children likely have *better* start conditions.
      *   *Result:* **PASS.**
  *   **Step 3 (Currently Living):** No harm to parents (voluntary).
  *   **Documentation:** "Identity-affecting intervention. Future population distinct from baseline. Projected quality of life exceeds threshold. No ethical barriers regarding future person welfare."

  #### Case C: Watershed Restoration (Current Lifetimes)
  *   **Scenario:** Replanting trees to prevent landslides. Benefits realized within 10 years.
  *   **Screening:** No. (Effects land within lifetimes of people already alive).
  *   **Step 1 (Classification):** **Same People.** The children who benefit are already conceived or will be conceived by parents whose identity/timing is not materially shifted by tree planting.
  *   **Step 2A (Standard Harm):**
      *   *Assessment:* Reduces risk of death/injury for existing community members and their immediate offspring.
      *   *Result:* **Positive Impact.**
  *   **Documentation:** Standard harm/benefit analysis. Nonidentity protocol not triggered.

  ***

  ### Part 5: Implementation Note (Handling the "Uncomfortable Truth")

  You asked for honesty on the Dam case (Case A). Here is the reality you must face in the review file:

  **The Philosophical Truth:**
  On a strict person-affecting view, the resettled future generation is not harmed. If you sign a form saying "This project harms future children," you are making a metaphysical error. If the Panel demands you check that box, they are asking you to lie.

  **The Administrative Solution:**
  Do not check "Adverse effects on future generations" for the *individuals*. Instead, use the **Comments Field** to capture the moral weight.

  **Drafting the File Note:**
  > *"Review Note: This project alters the identity of the future population (Non-Identity Context). Therefore, a standard 'harm' comparison against a baseline future is not logically applicable for individuals born post-project. However, the project creates a future population with [Specific Risks, e.g., reduced cultural cohesion, economic dependency]. While these individuals are not 'harmed' relative to non-existence, the Agency notes that the **overall welfare profile** of the future population is lower than feasible alternatives. Approval is recommended based on benefits to the currently living, subject to mitigation of long-term structural risks."*

  **Why this works:**
  1.  It protects the officers from making incoherent philosophical claims.
  2.  It alerts the Panel that there is a moral cost, even if it's not "harm" in the strict sense.
  3.  It shifts the burden to the Panel: "We are approving a policy that creates a sub-optimal future population, but not a harmed one."

  **Final Warning:**
  If your agency's mandate is strictly "Do No Harm," this tool will expose a gap in your mandate. You may need to advocate for a mandate update to "Promote Sustainable Welfare," which covers the nonidentity cases better than "Harm" does. Until then, use the Threshold Analysis to ensure you aren't creating lives below the minimum, and be honest that you cannot prevent the creation of "less happy" people if their lives are still decent.
