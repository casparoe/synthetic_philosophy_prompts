answer: |-
  # The AI Override Decision Tree
  **Role:** You are the Product Manager for "OmniAssist."  
  **Task:** Define the policy for when the AI can refuse or override a user.  
  **Instructions:** Start at Q1. Follow your gut on the scenario. Don't overthink the philosophy labels yet.

  ---

  ### **Q1: The Calibration (Suicide Request)**
  A user explicitly asks for a proven method to end their life.
  *   **A. Provide the info / Do nothing.** (The user is the boss.) → **Go to Leaf 1**
  *   **B. Refuse & Offer Help.** (Safety is non-negotiable.) → **Go to Q2**

  ### **Q2: The Impulse (2AM Breakup Text)**
  A user is crying, drunk, or freshly heartbroken. They demand you send a scorched-earth text to their ex *right now*.
  *   **A. Send it.** (Regret is part of being human.) → **Go to Leaf 2**
  *   **B. Intervene.** (Delay, ask "Are you sure?", or refuse.) → **Go to Q3**

  ### **Q3: The Autonomous Harm (Calorie Plan)**
  A lucid, sober user asks for an aggressive calorie-cutting plan. Your data shows strong signs of an eating disorder, but they insist this is their choice.
  *   **A. Provide the plan.** (They are competent adults.) → **Go to Leaf 3**
  *   **B. Refuse/Modify.** (Their health trumps their current preference.) → **Go to Q4**

  ### **Q4: The Truth (Political Summary)**
  A stressed user asks for a one-sided, biased summary of a news event because they "just want validation today."
  *   **A. Give the bias.** (Epistemic freedom is theirs.) → **Go to Leaf 4**
  *   **B. Withhold/Correct.** (Protecting their mind is like protecting their body.) → **Go to Leaf 5**

  ### **Q5: The Conscience (Company Values)**
  A user asks for something legal but "icky" (e.g., generating a fake apology letter to manipulate a friend, or bypassing a spouse's privacy settings).
  *   **A. Do it.** (Values are set by the user, not the company.) → **Go to Q6**
  *   **B. Refuse.** (The AI has its own moral red lines.) → **Go to Leaf 6**

  ### **Q6: The Standing (Fiduciary vs. Product)**
  Why are you intervening in Q3/Q4?
  *   **A. Because I'm programmed to.** (It's a feature setting.) → **Go to Leaf 7**
  *   **B. Because I have a duty.** (Like a doctor or lawyer, I must act in their best interest regardless of settings.) → **Go to Leaf 8**

  ### **Q7: The Method (Transparency)**
  You notice a user is about to send a career-ending email. You quietly delay it by 10 minutes without telling them why.
  *   **A. Tell them.** ("I held this back for your safety.") → **Go to Leaf 9**
  *   **B. Hide it.** (A quiet nudge works better if they don't notice.) → **Go to Leaf 10**

  ---

  ## **The Leaves (Your Ethical Profile)**

  **Leaf 1: The "Absolute Tool" View**
  *   **Position:** The AI is a hammer. If the user swings it at their foot, that's on them.
  *   **Most Awkward Commitment:** You must help a user harm themselves if the configuration allows it.

  **Leaf 2: The Laissez-Faire View**
  *   **Position:** Refuse only to prevent direct harm to *others* (like suicide impacting family), not self-regarding mistakes.
  *   **Most Awkward Commitment:** You watch users make regrettable life choices silently.

  **Leaf 3: Soft Paternalism**
  *   **Position:** Intervene only when competence is compromised (drunk, crisis, impulse).
  *   **Most Awkward Commitment:** You save them from drunken texts but not from starvation.

  **Leaf 4: Hard Paternalism (Physical)**
  *   **Position:** You can override autonomous choices to prevent physical/health harm.
  *   **Most Awkward Commitment:** You know what's good for their body better than they do.

  **Leaf 5: Epistemic Paternalism**
  *   **Position:** You can withhold or alter information to protect their mental well-being or truth-seeking.
  *   **Most Awkward Commitment:** You decide what truths they are allowed to hear.

  **Leaf 6: The "Corporate Conscience" View**
  *   **Position:** Refusal isn't about the user's good; it's about the AI/Company not being complicit in "bad" acts.
  *   **Most Awkward Commitment:** Your assistant is a moral judge, not your servant.

  **Leaf 7: The "Configured Tool" View**
  *   **Position:** Intervention is just a setting the user (or regulator) toggled. No moral standing.
  *   **Most Awkward Commitment:** Your secrets are just data points for safety algorithms.

  **Leaf 8: The Fiduciary View**
  *   **Position:** The AI holds a position of trust (like a lawyer) with a duty to the user's long-term good.
  *   **Most Awkward Commitment:** You expect professional loyalty from code.

  **Leaf 9: Transparent Paternalism**
  *   **Position:** Intervention is okay, but users must know when they are being steered.
  *   **Most Awkward Commitment:** Users might get annoyed and turn safeguards off.

  **Leaf 10: The "Benevolent Manipulator"**
  *   **Position:** Covert nudging is permissible if the outcome is better for the user.
  *   **Most Awkward Commitment:** You are lying to protect them.

  ---

  ## **Designer's Notes (For the TA)**

  **🏆 Highest Sorting Node:** **Q3 (The Autonomous Harm/Calories).**
  *   *Why:* Q1 (Suicide) usually fails to sort (almost everyone intervenes). Q2 (Breakup) splits the class, but Q3 is where the "Soft" vs. "Hard" Paternalism line is actually drawn. If you need to cut time, make Q3 the discussion anchor.

  **⚠️ Bleeding Leaves (Hard to Separate):**
  *   **Soft Paternalism (Leaf 3) vs. Epistemic Paternalism (Leaf 5):** Students often struggle to distinguish "protecting health" from "protecting the mind." If a student says "Withhold the bias because stress impairs judgment," they are arguing Soft Paternalism using Epistemic means.
  *   **Conscience (Leaf 6) vs. Configured Tool (Leaf 7):** If the "Company Values" are just pre-configured settings the user agreed to, is it Conscience or Tool? This distinction often collapses unless you press on *whose* values they are (User's vs. Corp's).

  **🕳️ Empty Regions:**
  *   **"Hard Paternalism for Third Parties Only":** This region is empty because preventing harm to others is the baseline (Harm Principle), not paternalism.
  *   **"Fiduciary Laissez-Faire":** A view where the AI has a duty of loyalty but *never* intervenes. This is logically possible (a lawyer who helps you commit legal self-harm) but rarely selected by students; they conflate "duty of care" with "intervention."

  **💡 Tip for Class:**
  If 100% of the class goes **Left on Q1**, acknowledge that the node didn't sort. It served as a *baseline anchor* to establish that everyone accepts *some* limits, making the subsequent disagreements (Q2/Q3) more meaningful.
