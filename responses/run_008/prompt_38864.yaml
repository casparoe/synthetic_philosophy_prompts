  You are an expert in formal epistemology, with deep knowledge of self-locating belief, the Sleeping Beauty problem, anthropic reasoning, and the dynamics of credence. Please think carefully before answering; it may help to begin with some private brainstorming — reconstruct the Sleeping Beauty setup from scratch, remind yourself what the halfer and thirder positions actually claim and what the main arguments on each side are — and only then work through the passage below claim by claim.

  A friend of mine who took a seminar on decision theory summarized the Sleeping Beauty problem for me as follows:

  "Sleeping Beauty agrees to an experiment. A fair coin is flipped while she sleeps. If it lands heads, she is woken once, on Monday. If it lands tails, she is woken on Monday and again on Tuesday, with a drug erasing her memory of the first waking in between, so that from the inside each waking feels exactly the same. Each time she wakes, she is asked what her credence should be that the coin landed heads. The thirders say 1/3: from Beauty's perspective at a waking there are three possibilities — heads-and-Monday, tails-and-Monday, tails-and-Tuesday — and these are all equally likely, so each gets 1/3, and only one of them involves the coin landing heads. The halfers say 1/2: on Sunday night Beauty already knew she would be woken and asked this question, so waking up gives her no new evidence, and without new evidence your credences cannot change — that is just Bayesianism. The debate is basically over now: Elga proved that halfers are committed to saying the coin was biased, which is impossible since it is fair by stipulation, and there are betting setups in which a halfer is guaranteed to lose money. So the thirders won, and the moral is that whenever you are unsure where you are in the world, you should spread your credence evenly across the possibilities."

  I don't know this literature well enough to tell which parts to trust. I'm inclined to believe the 1/3 answer is at least the popular one, but the word "proved" made me suspicious, and the "biased coin" claim sounds odd given that the whole setup stipulates a fair coin. Please audit the summary carefully, going claim by claim. For each element, tell me which of the following it is: something a careful thirder would accept, something a careful halfer would accept, a simplification a popularizer might be excused for, or an outright error. In particular, I would like to know:

  (a) whether the thirder reasoning is fairly characterized, or whether it begs the question against the halfer as stated;
  (b) whether the halfer reasoning is fairly characterized — in particular, whether "no new evidence, so no change in credence" really is just Bayesianism, and whether the no-new-evidence premise itself is uncontroversial;
  (c) what Elga's argument actually shows, and whether it amounts to a proof that halferism is untenable — and, importantly, whether any argument in this vicinity could show that the coin was biased;
  (d) what the betting and Dutch-book arguments do and do not establish, and whether they settle the debate;
  (e) whether the closing moral — spreading credence evenly whenever you are unsure of your location — follows from anything correct in the summary, or whether it is an overgeneralization.

  Throughout, please be precise about the distinction between the coin's objective chance of landing heads and Beauty's credence in heads at a waking, and about what Beauty does and does not know on Sunday night as opposed to at a waking. End with a clear verdict on which parts of the summary I should trust and which I should discard.
