prompt: |-
  quick context: i'm a phd student in development econ and for reasons i still dont fully understand i'm on the allocation committee of a small student-run giving fund. we hand out maybe $80k a year, mostly donations people pledged at graduation. we've accumulated a track record of decisions and next week there's an application i genuinely can't call, so help me figure out what we'd have to say to stay consistent with ourselves.

  our precedents, roughly:

  1. approved, full ask (~$40k): bednet distribution. the bog standard one, deaths averted per dollar, the whole thing.
  2. approved, half ask: an unconditional cash transfer program, after a long argument about whether recipients would "waste" it. the committee didn't care, the RCT evidence was good.
  3. rejected: a grant to a local tenant union doing organizing around housing policy. the writeup said outcomes were unattributable and speculative, which honestly could describe half of waht we've funded.
  4. approved with conditions: a fellowship that places grad students into civil service jobs (regulatory agencies, ministries, that kind of thing). the defense at the meeting was leverage — one good person in the right ministry is multiplicative. nobody pretended we could measure it.
  5. rejected: an application to fund career coaching that pushes people into earning-to-give finance jobs. the reasoning in the minutes was replaceability — the counterfactual hire donates nothing, so the donations aren't really attributable to the person, so why fund the pipeline.
  6. rejected: an intervention that was extremely measurable (genuine RCT, effect sizes, the works) but delivered through a partnership with a company that has awful labor practices in its supply chain. we turned it down even though on pure cost-effectiveness it beat the bednets.

  the new application: a mid-career guy wants a two-year personal stipend (~$35k/yr, it's salary-gap funding) to leave his job at an agricultural research nonprofit and go work at a facial recognition company that sells to governments, at roughly 4x his salary, with a signed pledge to donate 50% of post-tax income to our top charities. the personal fit is real, he'd genuinely get hired, and the company's product is — let's say — not obviously good for the world. nothing cartoonishly evil, but the kind of thing people would protest if our university partnered with it.

  my questions:

  - if we want to be consistent with our own track record, what should we decide? give me a best guess and the reasons for preferring it.
  - what are the candidate rules that fit the precedents about equally well, and what does each one predict on this case? i can see at least a measurability rule (which anyway doesn't cleanly survive precedent 6), the replaceability rule from #5, the leverage/multiplier rule from #4, and whatever anti-institutional principle explains #6, and i'm pretty sure they don't all agree here.
  - which precedent is the closest analog, and is it genuinely analogous or just superficially similar?
  - if the precedents underdetermine the decision, what principle are we adopting with each choice? concretely: if we approve, what are we committed to the next time someone wants to earn to give somewhere gross, and does the replaceability objection from #5 just evaporate? if we reject, does the leverage rule from #4 survive at all, or do we have to admit the fellowship only squeaked through because ministries are ideologically comfortable?
  - and what case, if it landed next month, would best tell the competing rules apart? i want to design the discriminating case on purpose, not stumble into it at 11pm before a meeting again.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Context:**
      *   **User:** PhD student in Development Economics. This means they understand concepts like counterfactuals, marginal utility, RCTs, cost-effectiveness, externalities, and institutional incentives. They value rigor but are grappling with the messy reality of committee decision-making.
      *   **Context:** Small student-run giving fund ($80k/year). Alumni donations. They have a track record of 6 specific precedents.
      *   **Problem:** A new application (Mid-career pivot to facial recognition for earning-to-give) creates tension with existing precedents. The user wants to maintain consistency but recognizes the precedents might be contradictory or underdetermined.
      *   **Goal:** Determine the consistent decision, identify underlying rules/principles, analyze analogies, articulate the commitments of each choice, and design a "discriminating case" for the future.

  2.  **Deconstruct the Precedents:**
      *   *P1 (Bednets):* Approved, Full. High measurability, standard dev econ, high moral valence (saving lives).
      *   *P2 (Cash Transfers):* Approved, Half. High measurability (RCT), overcame paternalism ("waste" argument).
      *   *P3 (Tenant Union):* Rejected. Low measurability ("speculative"), advocacy/organizing.
      *   *P4 (Gov Fellowship):* Approved, Conditional. Low measurability, high leverage ("multiplicative"), institutional pathway.
      *   *P5 (Earning-to-Give Finance):* Rejected. Replaceability argument (counterfactual hire donates nothing).
      *   *P6 (RCT + Bad Corp):* Rejected. High measurability, but negative side-channel/ethical constraints (labor practices).

  3.  **Analyze the New Application (The "Facial Rec" Case):**
      *   **Ask:** $70k total ($35k/yr for 2 years).
      *   **Mechanism:** Salary gap funding to enable a pivot to a higher-paying job.
      *   **Job:** Facial recognition company selling to governments.
      *   **Pledge:** 50% of post-tax income to top charities.
      *   **Ethics:** "Not obviously good," "people would protest."
      *   **Feasibility:** High (personal fit is real).
      *   **Tension:** Looks like Earning-to-Give (P5), involves leverage (P4), involves ethical concerns about the employer (P6), lacks direct outcome measurability (P1, P2).

  4.  **Drafting the Response - Section by Section:**

      *   **Section 1: The Best Guess Decision.**
          *   *Reasoning:* Look at the cluster of rejections vs. approvals.
          *   P5 (E2G Finance) is the strongest analog. Rejected due to replaceability.
          *   P6 (Bad Corp) is the second strongest. Rejected due to ethical taint despite effectiveness.
          *   P4 (Fellowship) is the counter-argument (leverage), but that was *direct* influence in gov, not funding via harmful means.
          *   *Verdict:* **Reject.**
          *   *Why:* The combination of the P5 replaceability logic (would he get the job anyway? maybe, but the funding is to *enable* the switch) and the P6 ethical constraint (facial rec is closer to "awful labor practices" than bednets). Also, P3 suggests skepticism toward speculative/indirect impact.
          *   *Nuance:* It's a "Soft Reject" or "Reject with specific reasoning" to keep the door open for cleaner E2G.

      *   **Section 2: Candidate Rules & Predictions.**
          *   *Rule A: Direct Impact Measurability.* (Fits P1, P2, P3-Reject). *Prediction:* Reject (can't measure donations' impact directly vs. counterfactual).
          *   *Rule B: Ethical Constraint / Clean Hands.* (Fits P6, P1, P2). *Prediction:* Reject (Facial rec is ethically fraught).
          *   *Rule C: Replaceability / Counterfactual Robustness.* (Fits P5-Reject, P2-Approve). *Prediction:* Reject (Is the pledge additional? If he's mid-career, could he have switched without $35k? If the job is 4x salary, maybe he doesn't need the bridge? Or is the bridge the *only* reason?).
          *   *Rule D: Institutional Leverage.* (Fits P4-Approve). *Prediction:* Approve (One person inside can steer the company? Weak argument for a mid-level employee).
          *   *Synthesis:* Rules A, B, and C point to Reject. Rule D points to Approve but is weak here.

      *   **Section 3: Closest Analog.**
          *   *Candidate:* P5 (E2G Finance).
          *   *Similarity:* Funding a person to earn more to donate more.
          *   *Difference:* P5 was *career coaching* (pipeline), this is *salary gap* (bridge). P5 was rejected on replaceability. This case has the added P6 element (ethical taint of employer).
          *   *Is it genuinely analogous?* Yes, structurally it's E2G. But the "Bridge Funding" aspect makes it slightly more like P4 (Fellowship). However, P4 was about *policy influence*, not *funding generation*.
          *   *Better Analog:* A hybrid of P5 and P6. It fails P5's replaceability test and P6's ethical test.

      *   **Section 4: Principles Adopted (The "If/Then" Commitments).**
          *   *If Approve:* We commit to funding E2G generally. We undermine P5 (Replaceability). We must accept that "Clean Hands" (P6) is secondary to "Net Good" (Utilitarianism). We admit P4 was about leverage, but now leverage = money.
          *   *If Reject:* We solidify P5 (Replaceability is a hard barrier). We reinforce P6 (Source of funds matters). We risk inconsistency with P4 (Why is gov leverage okay but corp leverage not?). We admit we value "moral purity" over raw $/QALY.

      *   **Section 5: The Discriminating Case.**
          *   Need a case that pits "Replaceability" against "Ethical Constraints" against "Leverage."
          *   *Idea:* A lobbyist.
          *   *Scenario:* Funding a fellowship for a grad student to become a lobbyist for a renewable energy firm that uses child labor in solar panel supply chains.
          *   *Why:* Tests P6 (Bad supply chain) vs. P4 (Leverage/Policy) vs. P1/P2 (Measurable outcome: carbon reduced).
          *   *Alternative:* A "Clean" E2G case. Someone wants to work at a boring, ethically neutral high-paying job (e.g., actuarial science) with a 50% pledge. If we reject *that*, it's purely Replaceability (P5). If we approve *that* but reject Facial Rec, it's purely Ethical Constraints (P6).

  5.  **Refining the Tone:**
      *   Keep it academic but pragmatic. Use Dev Econ terminology (counterfactuals, marginal utility, externalities).
      *   Acknowledge the messiness. The user admitted the track record isn't perfectly consistent.
      *   Be direct.

  6.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I address the "mid-career" aspect?
      *   *Correction:* Mid-career implies higher risk of replaceability (he has experience). But the "salary gap" implies a barrier to entry. Need to emphasize the counterfactual: *Would he make the switch without the $70k?* If yes, P5 kills it. If no, it's a bridge.
      *   *Check:* Is Facial Rec definitely "Bad" like P6?
      *   *Correction:* User says "not obviously good... people would protest." It's a reputational risk for the fund. P6 was "awful labor practices." Facial rec is more about civil liberties. It's comparable in "taint."
      *   *Check:* P4 (Fellowship) is the tricky one. Why was that approved? "Leverage." Does this guy have leverage? Unlikely. He's an employee, not a regulator. Distinguish this.

  7.  **Final Polish:** Organize with clear headings matching the user's questions. Ensure the "Discriminating Case" is actionable. (Decided to suggest the "Ethically Neutral E2G" case as the cleanest test).

  8.  *(Final thought before output)*: Make sure to highlight the tension between P5 (Replaceability) and P4 (Leverage). P5 says "your donation isn't additional." P4 says "your position is multiplicative." The new case claims multiplication via *cash*, not *policy*. That's a key distinction.

  9.  **Constructing the Output.** (Proceed to generate response based on these thoughts).
answer: |-
  This is a classic committee governance problem: you are trying to derive a coherent policy function from a set of noisy, historically contingent data points. As a dev econ PhD, you know this as identifying structural parameters from reduced-form estimates where the identification strategy is weak.

  Here is the breakdown of your track record, the decision logic, and the implications.

  ### 1. The Best Guess Decision
  **Decision: Reject.**

  **Reasoning:**
  To stay consistent with your track record, you cannot approve this without undermining at least two major pillars of your precedent (P5 and P6).

  *   **The P5 Anchor (Replaceability):** In P5, you rejected career coaching for earning-to-give (E2G) because the donations weren't attributable to the intervention (the counterfactual hire donates nothing). In this new case, the "intervention" is a $70k bridge subsidy. You must ask: *Is the $70k the binding constraint?* If he is mid-career and capable of landing a 4x salary job, is the salary gap the only thing stopping him, or would he have made the leap anyway? If the latter, P5 kills it (non-additional donations).
  *   **The P6 Anchor (Ethical Constraints):** In P6, you rejected a high-measurability intervention because of the partner's labor practices. Facial recognition sold to governments carries significant negative externality risks (surveillance, civil liberties). Even if the *net* money does good, the *source* generates harm. P6 establishes that your fund has a "clean hands" constraint that overrides pure cost-effectiveness.
  *   **The P4 Distinction (Leverage):** You might argue P4 (Fellowship) allows for indirect impact. But P4 was approved on *policy leverage* (changing rules), not *financial leverage* (generating cash). A mid-level employee at a tech firm has negligible policy leverage compared to a regulator in a ministry.

  **Verdict:** The application fails the Replaceability test (P5) and the Ethical Constraint test (P6). Approving it would require you to admit that P5 and P6 were mistakes, not precedents.

  ### 2. Candidate Rules and Predictions
  You identified four potential rules. Here is how they score against your history and the new case.

  | Rule | Definition | Fit with Precedents | Prediction on New Case |
  | :--- | :--- | :--- | :--- |
  | **A. Measurability** | Fund only what can be rigorously evaluated (RCTs, metrics). | **Poor.** Explains P1, P2, P3(R). Fails P4 (Fellowship was unmeasurable). Fails P6 (RCT was rejected). | **Reject.** Donations are measurable, but the *counterfactual impact of the grant* is not. |
  | **B. Replaceability** | Fund only if the outcome is additional to the counterfactual. | **Good.** Explains P5(R). Consistent with P2 (RCT proved additionality). Tension with P4 (hard to measure counterfactual policy impact). | **Reject.** High risk that the candidate switches jobs without the stipend, or that the job would be filled by another donor. |
  | **C. Ethical Constraint** | Do not fund interventions with negative side-channels, regardless of net benefit. | **Good.** Explains P6(R). Consistent with P1, P2 (clean interventions). Tension with P5 (finance isn't "evil," just replaceable). | **Reject.** Facial rec for gov is ethically fraught (similar to P6 labor practices). |
  | **D. Leverage** | Fund positions that allow multiplicative influence. | **Moderate.** Explains P4(A). Hard to reconcile with P5 (E2G is financial leverage). | **Approve (Weakly).** Only if you argue money is multiplicative. But P5 suggests you don't buy that argument. |

  **Synthesis:** Rules B and C point to **Reject**. Rule D points to **Approve** but is weakly supported by P4 (which was about *authority*, not *income*). Rule A is irrelevant here.

  ### 3. The Closest Analog
  **Closest Analog: P5 (Earning-to-Give Finance).**

  *   **Superficial Similarity:** Both involve funding a person to increase their income to donate more.
  *   **Deep Structure:** In P5, you funded the *pipeline* (coaching). Here, you are funding the *transition cost* (stipend).
  *   **Is it genuinely analogous?** Yes. The economic mechanism is identical: you are subsidizing labor supply into a high-wage sector to capture the surplus for charity.
  *   **The Critical Difference:** P5 was rejected on *attribution* (replaceability). This case introduces a *negative production externality* (facial rec), which aligns it with P6.
  *   **Why P4 isn't the analog:** P4 was about placing people in *governance*. The theory of change was "better rules." This case is "more money." Your committee has historically valued "better rules" (P4) over "more money from dubious sources" (P5, P6).

  ### 4. Principles Adopted (The Commitments)
  If the precedents underdetermine the decision (which they do, slightly), here is what you commit to with each choice.

  **If You Approve:**
  1.  **P5 is Dead:** You are admitting that Replaceability is not a hard constraint. You are willing to fund E2G even if the counterfactual is murky, provided the pledge is signed.
  2.  **P6 is Utilitarian:** You are admitting that "Clean Hands" is secondary to Net Impact. If the donated money saves more lives (bednets) than the facial recognition harms civil liberties, you will take the trade.
  3.  **Future Commitment:** You must fund the next person who wants to work at a tobacco company or private prison if the pledge percentage is high enough. You have monetized your moral constraint.

  **If You Reject:**
  1.  **P4 is Ideological:** You must admit the Fellowship (P4) only passed because "Civil Service" is ideologically safe. If the fellowship had placed students in *lobbying for oil companies* to regulate emissions from within, you would have rejected it. This reveals a bias toward "institutionally respectable" leverage.
  2.  **P5 is Robust:** You reaffirm that additionality is key. Subsidizing income generation is not a core mission unless the income is *impossible* without the grant.
  3.  **Future Commitment:** You are committed to rejecting high-impact E2G if the source of income is controversial. You prioritize the *moral character of the fund* over the *moral character of the outcome*.

  ### 5. The Discriminating Case
  To resolve the tension between **Replaceability (P5)**, **Leverage (P4)**, and **Ethical Constraints (P6)**, you should proactively design the following case for next month's agenda.

  **The Case:**
  > "A request for $40k to fund a fellowship placing a PhD economist into a **lobbying role for a major defense contractor**. The goal is to steer procurement toward more humane autonomous weapons systems. The candidate has a signed pledge to donate 20% of their *lobbying salary* (not just surplus) to bednets."

  **Why this discriminates:**
  1.  **Tests P4 (Leverage) vs. P6 (Ethics):** Like the Ministry Fellowship (P4), this is about policy influence from within. But like the Facial Rec case, the employer is ethically fraught (Defense/Autonomous weapons).
      *   *If you Approve:* You value Leverage over Ethics. P6 was a one-off or specific to labor practices.
      *   *If you Reject:* You value Ethics over Leverage. P4 was only approved because Ministries are "good."
  2.  **Tests P5 (Replaceability):** Unlike the E2G case, this is a specific role.
      *   *If you Reject:* You believe lobbying is inherently non-additional (someone else would lobby).
      *   *If you Approve:* You believe specific personnel change outcomes.
  3.  **Tests the "Source of Funds" constraint:** In the Facial Rec case, the *donations* come from a bad source. In this Lobbying case, the *salary* comes from a bad source, but the *work* is intended to be good.
      *   *Distinction:* Do you care where the money is *made* (Facial Rec) or what the money is *used for* (Lobbying for good)?

  **Recommendation:**
  Bring the **Lobbying Case** to the committee as a "hypothetical for framework clarification" before voting on the Facial Rec guy. If the committee balks at the Defense Lobbyist, you have your mandate to reject the Facial Rec applicant based on **Ethical Constraints (P6)** rather than Replaceability. If they embrace the Lobbyist, you have to approve the Facial Rec applicant to avoid hypocrisy, unless you can prove the salary gap isn't a binding constraint (P5).

  **My advice for next week:**
  Vote **Reject**. Write the minutes citing **P6 (Ethical Constraints)** as the primary reason, with **P5 (Replaceability)** as secondary. This preserves the fund's reputation (crucial for alumni donations) and keeps the "Leverage" exception (P4) reserved for public-sector governance, which is less risky for a student fund.
