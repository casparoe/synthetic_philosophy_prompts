answer: |-
  Your intuition is correct: your friend's summary contains a significant conflation of two distinct philosophical problems and an outdated conclusion about the field. While the opening definition is standard, the core explanation of the problem and the verdict on the literature are misleading. Here is a claim-by-claim breakdown, followed by answers to your specific questions.

  ### Claim-by-Claim Analysis

  **1. "Expressivism is the view that moral sentences don't describe facts but instead express attitudes..."**
  *   **Verdict:** **Fair.**
  *   **Analysis:** A careful expressivist would accept this as a working definition. It correctly identifies the non-cognitivist core of the view: moral judgments are not primarily truth-apt descriptions of the world but expressions of a non-cognitive state (approval, disapproval, plans, etc.).

  **2. "...saying that lying is wrong is basically a sophisticated way of booing lying."**
  *   **Verdict:** **Fair in part (but dated).**
  *   **Analysis:** This is the classic analogy for *Emotivism* (A.J. Ayer, C.L. Stevenson), the early ancestor of expressivism. Modern expressivists (like Blackburn and Gibbard) often distance themselves from the crude "boo/hooray" model, preferring terms like "norm-acceptance" or "practical commitment," because "booing" suggests a mere emotional outburst rather than a reasoned stance. However, as a shorthand for a lay explanation, it is passable.

  **3. "The Frege–Geach problem is that this can't make sense of moral disagreement..."**
  *   **Verdict:** **Unfair/Incorrect.**
  *   **Analysis:** This is the primary error. The summary describes the **Problem of Moral Disagreement**, not the Frege–Geach problem. The Disagreement Problem asks: "If I say 'X is good' (hooray) and you say 'X is bad' (boo), are we genuinely disagreeing, or just clashing like two people wanting different ice cream flavors?"
      The **Frege–Geach problem** is about **logic and embedding**. It asks: "How can the sentence 'Lying is wrong' mean the same thing when asserted on its own as it does when embedded in a conditional like 'If lying is wrong, then getting your brother to lie is wrong'?" If the first expresses an attitude (booing), but the second doesn't necessarily express an attitude (you aren't booing lying while stating the conditional), then the meaning has shifted, and the logical argument becomes invalid (the fallacy of equivocation).

  **4. "...Peter Geach pointed this out in the 1960s, borrowing a point from Frege about how the meaning of a sentence stays fixed across different contexts..."**
  *   **Verdict:** **Fair (historically), but misapplied.**
  *   **Analysis:** The historical attribution is correct. Geach (and independently, John Searle) did use Frege's insight about context-independence to attack non-cognitivism. However, Geach's point was about logical validity (the embedding issue mentioned above), not about the phenomenology of disagreement. The summary attaches the correct historical names to the wrong philosophical problem.

  **5. "...and it's widely agreed that this finished off expressivism — which is why nobody works on it anymore."**
  *   **Verdict:** **Unfair/False.**
  *   **Analysis:** This is factually incorrect. Expressivism did not die; it evolved. The Frege–Geach problem was the catalyst for **Quasi-Realism** (Simon Blackburn) and **Normative Expressivism** (Allan Gibbard). These projects aim to "earn the right" to talk about moral truth and logic *within* an expressivist framework. Expressivism remains a dominant position in contemporary metaethics, widely taught and actively developed.

  ### Addressing Your Specific Questions

  **1. Is the problem she describes actually the Frege–Geach problem, or is it a different objection? Which is harder?**
  The problem she describes is the **Problem of Moral Disagreement**. The actual **Frege–Geach problem** is the Problem of Logical Embedding.
  *   **Which is harder?** For a *naive* emotivist, both are damaging. However, the Frege–Geach problem is generally considered the more technically difficult hurdle. The Disagreement Problem can often be sidestepped by arguing that disagreement in *attitude* is a genuine form of disagreement (we can disagree about what to do, not just what is true). The Frege–Geach problem strikes at the compositional semantics of language itself: if moral sentences change meaning when put into conditionals, moral logic collapses. Solving Frege–Geach requires rebuilding how we understand meaning and logic, which is why it spurred the sophisticated "Quasi-realist" developments.

  **2. Does her final sentence follow from anything true earlier in the summary?**
  No. The claim that expressivism is "finished off" and "nobody works on it anymore" is an artifact of misdescription and outdated information. Even if the Frege–Geach problem were as fatal as she claims (which most metaethicists deny, given the sophisticated responses available), it would not follow that *nobody* works on it. In philosophy, a "solved" or "refuted" view often continues to be worked on precisely to refine the refutation or salvage the core insights. In this case, the view wasn't refuted; it was upgraded. The verdict follows only if one accepts the false premise that the problem is unsolvable and ignores the last 50 years of literature.

  ### Conclusion

  Your friend has conflated the Problem of Disagreement with the Frege–Geach Problem and paired this conflation with a false sociological claim about the field. While the definition of expressivism is accurate, the explanation of its central challenge and its current status is misleading enough that repeating it would propagate significant errors.

