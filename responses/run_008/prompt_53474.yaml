answer: |-
  # Session Plan: The "Glug" Protocol (Semantic Externalism Simulation)

  **Course:** Philosophy of Language (Year 3)
  **Time:** 90 Minutes
  **Students:** 16 (4 Teams of 4)
  **Goal:** Induce externalist intuitions regarding natural kind terms and the division of linguistic labor without prior theoretical framing.

  ---

  ## 1. Materials List (Low Cost & Safe)

  *   **Liquids:**
      *   **Type A:** Distilled Water (4 Liters).
      *   **Type B:** Tap Water (4 Liters). *Note: In most municipal systems, tap water has enough dissolved minerals to be visually identical to distilled water but electrically distinct.*
      *   **Preparation:** Pre-pour into 32 identical clear plastic cups (8 cups per team). Label the bottom of the cups with small, hidden codes (e.g., A1, A2, B1, B2) that students cannot see unless they lift the cup. Ensure the distribution is mixed (each team gets 4 Type A and 4 Type B, randomized).
  *   **Tools:**
      *   **Digital TDS/Conductivity Pen:** 1 unit (approx. $15 online). This is the "Chemist's Tool." It reads 0-50 ppm for Distilled, 100-300+ ppm for Tap.
      *   **Whiteboards/Markers:** 4 sets (for team definitions).
      *   **"Epistemic Tokens":** 40 poker chips or colored paper squares per team (currency for scoring).
  *   **Handouts:**
      *   **Mission Cards:** Instructions for each phase.
      *   **Wager Slips:** For the final reveal.

  **Safety Note:** Explicitly forbid tasting. Emphasize that these are "unknown laboratory substances."

  ---

  ## 2. Timeline & Rules

  ### Phase 0: Setup & Naming (0:00 – 0:15)
  *   **Seating:** 4 tables, 4 students each.
  *   **Distribution:** Each team receives 8 cups of liquid. They are told: *"These samples represent a natural substance found in the environment. Some cups contain the same substance; some may contain a different substance that looks identical."*
  *   **Task:** Teams must inspect the liquids (look, swirl, smell—no tasting). They must coin a **Nonsense Word** (e.g., "Glug," "Zorp") to refer to the substance they believe is in the cups.
  *   **Constraint:** They must write down **Application Criteria** on their whiteboard. (e.g., "Glug is clear, wet, odorless liquid").
  *   **Rule:** They are not allowed to ask the instructor about the chemistry. They must assume their criteria are sufficient to identify the substance.

  ### Phase 1: Coordination Market (0:15 – 0:40)
  *   **Goal:** Establish pressure to align reference across teams.
  *   **Mechanism:**
      1.  Teams are paired (Team 1 vs. Team 2; Team 3 vs. Team 4).
      2.  **Round 1 (Phenomenal Match):** Team 1 selects a cup they believe is "Glug" and sends it to Team 2 with a note: *"This is Glug."* Team 2 must compare it to their own "Glug." If they agree it matches their criteria, they keep it. If they reject it, it returns to Team 1.
      3.  **Scoring:** +1 Token for every successful trade (agreement). -1 Token for every rejection.
      4.  **Round 2 (The Wager):** The Instructor introduces a "New Batch" (4 extra cups, hidden types). Teams must bet tokens on whether these new cups count as "Glug" based *only* on their written criteria.
  *   **Tension Point:** Since Type A and Type B look identical, teams will trade successfully and bet confidently. They will feel their word is well-defined.

  ### Phase 2: The Chemist Intervention (0:40 – 1:00)
  *   **Role Assignment:** Each team selects one member to be the **Lab Tech**. The other three are **Speakers**.
  *   **Tool Distribution:** Only the Lab Techs receive the Conductivity Pen.
  *   **New Rule:** The Lab Tech *must* test any sample before a final wager is placed in Round 3. The Speakers *cannot* touch the pen. They must ask the Lab Tech: *"Is this Glug?"* The Lab Tech can only answer *"Yes"* (Matches Type A baseline) or *"No"* (Matches Type B baseline).
  *   **Round 3 (Essence Match):** Teams receive 4 new cups.
      *   Speakers classify based on appearance.
      *   Lab Tech tests.
      *   **Crucial Twist:** If the Speakers say "Glug" based on looks, but the Lab Tech says "No" (different conductivity), the team **loses 5 Tokens**. If they defer to the Lab Tech, they gain 2 Tokens.
  *   **Pressure:** This forces the Speakers to realize their internal criteria (clear, wet) were insufficient. They must defer to the Tech's access to the "hidden structure" to win points.

  ### Phase 3: The Reveal & Final Wager (1:00 – 1:10)
  *   **Stop Play:** All pens are collected.
  *   **Disclosure:** The Instructor reveals there were two distinct substances all along (Distilled vs. Tap).
  *   **The Philosophical Wager:** Students get one final slip. They must answer individually (not as teams):
      1.  *When you coined the word in Phase 0, did it refer to both liquids, only one, or neither?*
      2.  *Did the meaning of your word change when the Lab Tech got the pen?*
      3.  *If a speaker in Phase 1 said "This is Glug" pointing to a Type B cup, were they wrong?*
  *   **Scoring:** Points are awarded for consistency with the "Externalist" position (see Debrief), but honesty is prioritized. (e.g., +5 tokens for admitting "I thought it referred to both, but now I see it didn't.")

  ### Phase 4: Debrief & Mapping (1:10 – 1:30)
  *   **Discussion:** Collect the Wager Slips. Display the distribution of answers.
  *   **Theoretical Injection:** Now introduce **Putnam** (Twin Earth, "Water is H2O") and **Burge** (Arthritis/Division of Linguistic Labor).
  *   **Mapping:**
      *   *The Liquids:* H2O vs. XYZ (or Distilled vs. Tap as a proxy for microstructure).
      *   *The Lab Tech:* The Expert/Scientist community.
      *   *The Speakers:* The layperson.
      *   *The Loss of Points:* The failure of description-based reference.
  *   **Key Takeaway:** Reference was fixed by the environment (the actual water type) and the social structure (the Tech's access), not just the Speakers' mental states.

  ---

  ## 3. Scoring Scheme (Creating Pressure)

  To make the externalist intuition "hurt" (i.e., feel necessary), the scoring must punish internalism.

  | Phase | Action | Points | Rationale |
  | :--- | :--- | :--- | :--- |
  | **Phase 1** | Successful Trade (Agreement on look) | +1 | Rewards descriptive agreement (the trap). |
  | **Phase 2** | Deferring to Lab Tech (Correct ID) | +2 | Rewards deference to hidden structure. |
  | **Phase 2** | Ignoring Lab Tech (False Positive) | -5 | **Critical:** Punishes relying on internal criteria when external facts diverge. |
  | **Phase 3** | Correct Wager on Extension | +10 | High stakes on the philosophical question. |

  *Win Condition:* The team with the most tokens gets a minor course credit bonus (e.g., 1% on final essay). This ensures they take the "Chemist" rules seriously.

  ---

  ## 4. The Reveal Stage (Scripted)

  **Instructor:** "Stop. Put the pens down. Look at your token stacks. Some of you lost significant points in Phase 2. Why?"
  **Students:** "Because the pen said it wasn't Glug even though it looked like Glug."
  **Instructor:** "So, in Phase 1, when you traded cups and agreed they were both 'Glug,' were you right?"
  *(Pause for effect)*
  **Instructor:** "Here is the truth. Half your cups were Distilled Water. Half were Tap Water. They have different physical structures. Your word 'Glug' was intended to pick out a *kind* of stuff. Did 'Glug' refer to both? Or did you accidentally refer to only one, while mistakenly applying it to the other?"
  **Instructor:** "On your wager slip: If you pointed to a Tap Water cup and said 'Glug,' but 'Glug' actually means Distilled Water (because that's what your first sample was), were you speaking falsely? Or was the word just vague?"
  **Instructor:** "And did the word 'Glug' change its meaning the moment the Lab Tech picked up the pen? Or did you just *discover* what you had been talking about all along?"

  ---

  ## 5. Candid "What Goes Wrong" (Troubleshooting)

  **1. The "Water" Contamination:**
  *   *Risk:* Students will immediately smell/taste and say "It's water." This imports all their prior chemical knowledge (H2O), ruining the "ignorance" condition.
  *   *Fix:* Use the nonsense word constraint strictly. If a team writes "Water" on their board, deduct 10 tokens immediately. Call the liquids "Substance Alpha."
  *   *Residual:* They might still *think* "Water." In the debrief, acknowledge this: "You couldn't fully strip your background knowledge. Imagine you are aliens who have never seen Earth."

  **2. The "Stipulation" Loophole:**
  *   *Risk:* A team argues, "We defined 'Glug' as 'clear liquid.' So by definition, both types are Glug. The Chemist is wrong."
  *   *Fix:* This is actually a *win* for the discussion. It highlights the conflict between **Descriptivism** (meaning = criteria) and **Causal/Historical** theories (meaning = origin/structure). In the scoring, penalize them for ignoring the Chemist *during the game* (because the game rules force externalism to win points), but validate their philosophical objection in the debrief. This is the exact tension Putnam exploits.

  **3. The "Lab Tech" Tyranny:**
  *   *Risk:* The Lab Tech becomes a dictator, and the Speakers disengage.
  *   *Fix:* The Speakers must sign the Wager Slips. If they lose points, everyone loses. This forces the Speakers to interrogate *why* they are deferring, enacting the "Division of Linguistic Labor" socially.

  **4. Indistinguishability Failure:**
  *   *Risk:* Tap water smells like chlorine; Distilled tastes "flat."
  *   *Fix:* Let the Tap water sit open for 24 hours to off-gas chlorine. Use plastic cups to mask temperature differences. If students claim they can tell the difference, ask them to demonstrate blind. If they can't, the game holds.

  ---

  ## 6. Honest Limitations & Bridging the Gap

  **The Limitation: No Twin Earth.**
  This activity takes place in **one world**. We discovered that *we* didn't know what *we* were talking about. Putnam's Twin Earth argument is stronger: it claims that even if you knew *everything* internally (brain state), reference could still differ because the *environment* differs.
  *   *In this activity:* The students' internal states *did* change when they saw the pen reading. They learned something new.
  *   *The Gap:* A strict internalist could argue: "Your word 'Glug' just changed meaning from 'clear liquid' to 'conductive liquid.' You didn't discover reference; you changed the definition."

  **Bridging the Gap in Debrief:**
  Do not assert the conclusion. Use the **Counterfactual Question** to bridge the gap:
  1.  **Ask:** "Imagine Team 1 was on Earth (Type A) and Team 2 was on Twin Earth (Type B), but they looked identical. Team 1 says 'Glug.' Team 2 says 'Glug.' Do they mean the same thing?"
  2.  **Connect:** "In our game, you found out that *structure* mattered for scoring. If structure matters for scoring (success in navigating the world), does it matter for meaning?"
  3.  **The Burge Point:** Focus on the Lab Tech. "Why did you listen to the Tech? You didn't understand *how* the pen worked. You deferred. Does your understanding of 'Glug' depend on the Tech's understanding? If the Tech says it's not Glug, can you insist it is?"
  4.  **Conclusion:** The activity proves **Ignorance** (you didn't know the essence) and **Deference** (you relied on the expert). The Twin Earth thought experiment is simply the *philosophical extrapolation* of these two facts: If you can be ignorant of the essence, and the essence determines the kind, then a twin with a different essence refers to a different kind, even if their brain is identical.

  **Final Note to Instructor:**
  The success of this session relies on your refusal to validate Internalist intuitions during the game. When a student says, "But it looks the same!", your only response is, "The rules say you lose points." Let the *system* enforce externalism, so you can analyze *why* in the debrief.
