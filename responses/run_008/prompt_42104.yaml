      *   *Voting vs. Demonstration:* Voting is a institutional duty (Fair Play/Civic Obligation) with low cost. A massive demonstration is expressive; if the outcome is guaranteed, the *marginal* contribution to the outcome is zero, and the cost (rain/effort) might outweigh the expressive value. *Tension:* Why is voting different if both are causally negligible? Voting is a formal mechanism of agency; demonstrations are often expressive.
