          3.  **Complicity/Participation:** Joining a harmful practice makes you morally tainted, even if you didn't cause the harm. (Fits meat, fits flights).
          4.  **Fair Play/Cooperation:** If you benefit from a cooperative scheme, you must contribute. (Fits recycling, fits voting).
          5.  **Integrity/Virtue:** Acting in accordance with who you want to be. (Fits lifetime habits).

      *   *Synthesizing Principle:* The most robust framework here is a hybrid of **The Principle of Fair Play** (for cooperative benefits like recycling/voting) and **Complicity/Participation in Harmful Practices** (for climate/meat), often underpinned by a **Rule-Consequentialist** or **Generalization** logic. Let's call it the **"Participation and Fair Play" Framework**.

