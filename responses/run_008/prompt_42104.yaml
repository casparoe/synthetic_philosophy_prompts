answer: |-
  This is a classic formulation of the **inefficacy problem** in collective ethics. You are grappling with the tension between *individual difference-making* (consequentialism) and *participation in patterns* (deontology/virtue ethics).

  Your intuitions are actually quite consistent with a specific hybrid framework, though they contain one logical fracture. The principle that best captures your verdicts is a combination of **The Principle of Fair Play** and **The Principle of Complicity**, underpinned by a **Rule-Consequentialist** outlook.

  ### The Framework: Fair Play and Complicity

  1.  **The Principle of Fair Play (Cooperative Schemes):**
      When you benefit from a cooperative scheme that requires widespread participation to function (recycling, voting, clean streets), you have an obligation to do your share, even if your specific contribution is causally negligible. To do otherwise is to "free-ride" on the sacrifices of others.
      *   *Accommodates:* The recycling neighbor (wrong to free-ride), Voting (civic duty despite low odds).
      *   *Explains:* Why you skip the demonstration. If the demonstration is *certain* to be enormous, your presence isn't required for the "scheme" to succeed. It is not a threshold cooperation problem in the same way; it is expressive. If the outcome is secured without you, the Fair Play obligation dissipates.

  2.  **The Principle of Complicity (Harmful Practices):**
      You have an obligation not to participate in practices that are inherently harmful, even if your individual participation does not trigger a specific harmful event. Morality is not just about *outcomes* you cause, but about *what you do* and what you align yourself with.
      *   *Accommodates:* The lifetime of flights, the lifelong meat-eater.
      *   *Explains:* You judge the *pattern* of agency. A single flight is a negligible *cause*, but it is a non-negligible *act of participation* in a harmful institution. Over a lifetime, the pattern of participation defines the moral agent.

  3.  **The Threshold Exception (Expected Utility):**
      When a specific act has a non-negligible probability of crossing a known threshold where harm/benefit discontinuously jumps, standard consequentialist math applies.
      *   *Accommodates:* The 1,000,000th petition signature.

  ### The Unsettled Case: The Second-Hand Petrol Car

  Applying this framework to buying a second-hand petrol car instead of taking the bus:

  **The Verdict:** The principle suggests buying the car is **morally problematic**, though perhaps less so than buying a new one.

  **The Reasoning:**
  *   **Complicity:** Driving a petrol car is participation in a carbon-intensive practice. Even if the car is second-hand (meaning you didn't signal manufacturers to build *another* car), you are still operating the machinery of harm, burning fuel, and normalizing the behavior. You are aligning your agency with the harmful practice.
  *   **Fair Play:** If society is attempting to shift toward lower emissions (a cooperative scheme), and you continue to drive because others are taking the bus, you are benefiting from the infrastructure while opting out of the sacrifice.
  *   **Nuance:** The "second-hand" aspect weakens the *causal* link to production, but it does not sever the *complicity* link to consumption. The bus option represents a refusal to participate in the harmful practice.

  **Conclusion:** Unless there is a significant countervailing duty (e.g., you need the car to care for a sick relative), the principle dictates you should take the bus. The car purchase fails the Complicity test.

  ### The Fracture: Which Verdict Cannot Be Accommodated?

  No single principle can perfectly systematize your intuitions without breaking one of them. The principle above struggles most with the tension between your **Petition Intuition** and your **Flight/Meat Intuition**.

  **The Conflict:**
  *   **Petition:** You believe the 999,997th signature *doesn't matter*, but the 1,000,000th *does*. This is purely **consequentialist**. You are judging the act solely by its causal outcome.
  *   **Flight/Meat:** You believe the single flight/purchase *makes no difference* (causally), yet it contributes to a lifetime of wrongdoing. This implies the single act *does* have moral weight independent of its immediate causal outcome (via Complicity).

  **The Inconsistency:**
  If you accept the **Complicity** principle for flights (it's wrong to participate even without causal impact), you should logically believe the 999,997th petition signature is *also* morally significant. It is an act of participation in a collective effort. If you sign, you are a co-operator. If you don't, you are a bystander.
  By saying the 999,997th signature "doesn't matter," you are reverting to pure causal consequentialism. By saying the single flight "contributes to wrongdoing," you are rejecting pure causal consequentialism.

  You cannot hold that **causal inefficacy absolves you of responsibility** (the petition) while simultaneously holding that **causal inefficacy does not absolve you of responsibility** (the flight).

  To make your view consistent, you must either:
  1.  Admit the 999,997th signature *does* matter (as an act of solidarity/participation), OR
  2.  Admit the single flight *does not* matter morally, and only the aggregate matters (which undermines your criticism of the lifelong meat-eater's specific choices).

  ### Candid Limitations: Where This Reasoning Might Fail

  I must be candid about where this framework (and my application of it) is most vulnerable.

  **1. The "Smooth Curve" Empirical Claim:**
  My analysis accepts your premise that "one chicken purchase doesn't matter" because supermarkets reorder on a smooth curve. Many economists and ethicists (e.g., Alastair Norcross) argue this is empirically false. Supply chains work in batches. Your single purchase *does* probabilistically trigger a future order. If this is true, the "Complicity" principle is unnecessary; simple Expected Utility solves the chicken case. If I am wrong about the supply chain, my advice on the car becomes much stronger (buying the car *does* causally signal demand for used petrol cars, raising prices and keeping them in circulation longer).

  **2. The Demand of "Purity":**
  The Complicity principle risks becoming a morality of moral purity rather than harm reduction. If I refuse to drive a second-hand car but my taking the bus is equally unnoticed and causally negligible, have I actually reduced harm? Or have I just cleaned my own hands? A critic would argue that focusing on *participation* distracts from *impact*. If I could drive the car and donate the money saved to highly effective carbon removal, a pure Consequentialist would say I am obligated to drive. The Fair Play/Complicity model struggles to accommodate "offsetting" because it views the act itself as tainted.

  **3. The Voting/Demonstration Distinction is Shaky:**
  I justified skipping the rain-soaked demonstration via "Fair Play" (it wasn't needed). But voting in a safe seat is also "not needed" causally. The distinction relies on Voting being an *institutional duty* and Demonstrations being *extra-institutional*. This is a sociological distinction, not a deep moral one. A rigorous principle might demand you attend the demonstration if the cause is just, regardless of the crowd size, because the duty is to *witness* and *stand*, not just to tip the scale. My framework lets you off the hook too easily there.

  **Summary:**
  Your intuitions are best served by a **Participation-Based Ethics** (Complicity + Fair Play). This condemns the car purchase. However, you must resolve the logical conflict between your view on petitions (outcome-based) and flights (participation-based). You cannot have it both ways: either causal impact is the only thing that counts, or it isn't. If it isn't, the 999,997th petitioner is doing something meaningful by signing, even if they don't trigger the donation.
