      *   *The Single Act vs. Lifetime Tension:* If one flight makes no difference, why does the sum matter mathematically if the parts don't? (Sorites paradox). The "Participation" view solves this by focusing on *identity* rather than *outcome*, but that conflicts with the "Petition Threshold" view which *is* outcome-based.
