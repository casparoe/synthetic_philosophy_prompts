answer: |-
  # Lesson Plan: The Intention & Action Exercise
  **Course:** Intro to Rational Choice and Practical Reason  
  **Section:** Discussion (90 Minutes)  
  **Enrollment:** 18 Students  
  **Topic:** Intention, Prediction, and Precommitment (Kavka's Toxin Puzzle)  

  ---

  ## I. Instructor Preparation & Materials

  **Materials Needed:**
  1.  **The "Toxin":** 100ml of concentrated lemon juice or non-toxic bitterant (e.g., denatonium benzoate solution diluted to be palatable but unpleasant). *Safety Check: Verify no student has acid reflux, citrus allergies, or swallowing difficulties.*
  2.  **Cups:** 20 small disposable shot cups.
  3.  **Currency:** 10 Gift Cards ($10 value) OR a ledger for significant Bonus Points (e.g., 5% of final participation grade). *Note: Check university policy on cash equivalents. Points are safer.*
  4.  **Consent Forms:** Simple slips stating: *"I understand this task involves consuming a safe but unpleasant substance. I may opt out at any time without penalty, even if I have already received a reward."*
  5.  **Timer:** Visible on screen.
  6.  **"Bond" Slips:** Small cards students can sign to pledge points.

  **Safety & Ethics Protocol:**
  *   **Voluntary Participation:** Emphasize repeatedly that this is an experiment in decision-making, not a test of courage.
  *   **Opt-Out:** Students can decline the activity entirely and receive full standard participation credit.
  *   **Medical:** Ask for a show of hands for allergies/conditions before distributing liquid.

  ---

  ## II. Timeline (90 Minutes)

  | Time | Segment | Activity |
  | :--- | :--- | :--- |
  | 00–10 | **Setup & Safety** | Explain rules, distribute consent, verify safety. |
  | 10–25 | **Round 1: The Offer** | Intention declaration, "Scanning" interview, reward distribution. |
  | 25–35 | **The Gap** | Unrelated administrative discussion (to simulate time passing). |
  | 35–45 | **Round 1: Execution** | Task performance. Observation of follow-through. |
  | 45–60 | **Round 2: Bonding** | Introduce precommitment mechanism. Bidding/pledging. |
  | 60–70 | **Round 2: Execution** | Task performance with bonds at stake. |
  | 70–90 | **Debrief** | Map activity to theory. TA personal anecdote. Student articulation. |

  ---

  ## III. Activity Rules & Mechanics

  ### Round 1: The Pure Intention Game
  **The Structure:**
  1.  **T1 (Now):** You may claim a **5-Point Bonus**.
  2.  **Condition:** To claim it, you must convince me (the Instructor) that you *genuinely intend* to drink the tonic at T2 (in 20 minutes).
  3.  **T2 (Later):** If you drink, nothing happens. If you do *not* drink, **you keep the 5 points.** There is no penalty for failing to drink.
  4.  **The Catch:** I will only award the points if I judge your intention to be genuine. If I think you are lying to get the points, you get nothing.

  **The Judging Mechanism (The "Scanner"):**
  Since we lack the Billionaire's infallible mind-scanner, I will act as a fallible proxy.
  *   Students come to the front individually.
  *   I will ask two questions:
      1.  *"On a scale of 0–100, how likely are you to drink this in 20 minutes?"*
      2.  *"What reason will you have to drink it when the time comes?"*
  *   **Instructor Note:** If a student says, "I'll drink it to get the points," reject the intention. (Reason: At T2, the points are already secured, so that reason vanishes). If they say, "I just will," probe for confidence.
  *   **Philosophical Substitution:** Acknowledge in the debrief that this substitutes *interpersonal credibility* for *intrapersonal infallibility*. In the original puzzle, you cannot fool yourself. Here, you might fool me.

  ### Round 2: The Bonding Game
  **The Structure:**
  1.  **T1 (Now):** You may post a **10-Point Bond**.
  2.  **Condition:** If you drink the tonic at T2, you receive **15 Points Total** (5 Base + 10 Bonus).
  3.  **Penalty:** If you do *not* drink at T2, you **lose the 10 Points** from your existing course total.
  4.  **Goal:** Observe if changing the T2 incentives allows you to form the intention at T1.

  ---

  ## IV. Predictable Failures & Troubleshooting

  **1. The "Bluffer" Problem (Round 1)**
  *   **Prediction:** Students will claim they intend to drink, take the points, and refuse to drink at T2.
  *   **Why:** This is the rational move. They gain the reward without the cost.
  *   **Instructor Response:** Do not punish them. Record the outcome. In the debrief, highlight that *they knew at T1 they wouldn't do it*, which means they didn't truly *intend* it, they *predicted* they would lie. This validates the puzzle: you can't intend what you know you won't do.

  **2. The "Scanner" Error**
  *   **Prediction:** I might award points to a liar or deny a truth-teller.
  *   **Why:** Human judgment is fallible.
  *   **Instructor Response:** Acknowledge this error in the debrief. The original puzzle assumes perfect introspection. Our limitation makes the intention *harder* to verify, but the internal feeling of "I'm lying" remains the same for the student.

  **3. Low Participation**
  *   **Prediction:** No one volunteers for Round 1.
  *   **Why:** The task is aversive.
  *   **Instructor Response:** Have a "stoic" TA friend or colleague pre-registered to kickstart the first round if the room is silent. Or, lower the aversiveness (smaller sip).

  ---

  ## V. Debrief Script & Discussion Guide (20 Minutes)

  *Do not mention Kavka, Resolute Choice, or Game Theory until the very end.*

  **Step 1: The Phenomenology of Round 1**
  *   **Ask:** "For those who took the points but didn't drink: At 10:10 AM, when you told me you intended to drink, did you feel like you were lying?"
  *   **Ask:** "For those who refused to claim points: Why? What stopped you from forming the intention?"
  *   **Key Insight:** Elicit the feeling that **intention requires a reason for action.** If you know the reason (the points) expires before the action, the intention collapses. You cannot intend to do something you know you will have no reason to do.

  **Step 2: The Mechanics of Round 2**
  *   **Ask:** "What changed in Round 2? Did the liquid change? Did your tolerance change?"
  *   **Key Insight:** No. The *future payoff structure* changed. By posting the bond, you gave your Future Self (at T2) a reason to act that your Present Self (at T1) could rely on.
  *   **Concept:** This is **Precommitment**. You altered the incentives of your future self to make the intention rational *now*.

  **Step 3: The TA's Personal Stake (The Gym Contract)**
  *   **Script:** "I need to share why I built this. Last month, I signed a contract with a service that fines me $50 if I skip the gym. I thought it would work. But standing here today, I realized I don't know if I *intend* to go, or if I just *intend to intend* to go.
  *   "When I signed the contract, I was 'Present Me.' I wanted the fitness. But 'Tomorrow Me' is tired and wants to sleep. The fine is supposed to bridge that gap. But if 'Tomorrow Me' decides $50 is worth paying to sleep, then 'Present Me' was lying about the intention.
  *   "This activity asks you to feel that gap. The difference between **engineering incentives** (the bond/the fine) and **forming intentions** (the will to act)."

  **Step 4: Student Articulation**
  *   **Prompt:** "In your own words, why couldn't you just 'decide' to drink in Round 1 without the bond? What is the difference between a *promise* and a *bond*?"
  *   **Target Answer:** A promise relies on character/will. A bond relies on changing the cost-benefit analysis. The puzzle shows that will alone might not be enough if the future reason vanishes.

  **Step 5: Naming the Puzzle**
  *   Now reveal: "This is known as **Kavka's Toxin Puzzle** (1983)."
  *   Briefly explain the Billionaire variant.
  *   Explain that philosophers use this to debate whether **rationality** allows us to bind our future selves, or if we are always slaves to whatever seems rational in the moment.

  ---

  ## VI. Limitations & Discussion Notes

  *Be candid with students about where the simulation diverges from the philosophical case.*

  1.  **Infallibility vs. Judgment:**
      *   *Original:* The Billionaire knows your mind perfectly. You cannot fool him.
      *   *Class:* I am guessing. You might fool me.
      *   *Discussion Point:* Does the puzzle still hold if you can't fool *yourself*? Even if I believed you, did *you* believe you?

  2.  **Stakes & Harm:**
      *   *Original:* One million dollars vs. one day of illness.
      *   *Class:* 5 points vs. 30 seconds of bad taste.
      *   *Discussion Point:* Does the magnitude of the reward change the *logic* of the intention, or just the *motivation*? (Logic remains, motivation scales).

  3.  **The "Reason" to Drink:**
      *   *Original:* Once noon passes, there is *no* reason to drink.
      *   *Class:* Some students might drink just to "save face" or "not look like a quitter."
      *   *Discussion Point:* If you drink to save face, you *did* have a reason. The puzzle assumes a closed system where the only reason was the reward. In real life (and this class), social pressure acts as a hidden bond.

  ---

  ## VII. Instructor's Private Reflection (Post-Class)

  *   **Did the bond work?** If students in Round 2 still failed to drink despite the bond, their valuation of the points was lower than the aversion to the liquid. This highlights that precommitment only works if the penalty exceeds the temptation.
  *   **The "Intend to Intend" feeling:** Watch for students who hesitate in Round 1. They are experiencing the exact uncertainty you feel about your gym contract. Validate that feeling: "That hesitation is the puzzle manifesting."
  *   **Ethical Check:** Ensure no student felt coerced. Reiterate in the next class that opting out was the rational choice for many, and that is a valid solution to the puzzle (rejecting the offer).

  ---

  ### Why This Design Works for Your Urgency
  You are struggling with the distinction between **wanting the outcome** (fitness/points) and **intending the action** (gym/drinking). This activity forces that distinction into the open.
  *   **Round 1** isolates the **Intention**: Can you intend without a future reason? (You likely can't).
  *   **Round 2** isolates the **Engineering**: Can you build a bridge to the future? (Yes, via bonds).
  *   **The Debrief** connects this to your gym contract: The contract is a Round 2 Bond. The uncertainty you feel is the Round 1 Intention problem. By teaching this, you are not just explaining Kavka; you are debugging your own practical reason in real-time alongside your students.
