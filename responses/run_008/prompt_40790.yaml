answer: |-
  **Take-Home Final: Philosophy of Probability**
  **Question 4: Bertrand's Paradox and the Principle of Indifference**

  Bertrand's paradox is standardly presented as a failure of the Principle of Indifference (PoI). We are asked to consider a "random chord" on a circle and determine the probability that it is longer than the side of an inscribed equilateral triangle. The classical methods (random endpoints, random radius, random midpoint) yield 1/3, 1/2, and 1/4 respectively.

  (a) **The Diagnosis:** Does this paradox demonstrate that the PoI is logically inconsistent, or merely that it is silent until a sample space and measure are fixed? Defend your stance. (5 points)

  (b) **Jaynes' Invariance:** E.T. Jaynes argued that the 1/4 solution is privileged because it is the only one invariant under translations and scalings of the circle. Does this invariance requirement settle the paradox, or does it merely relocate the problem by smuggling in a substantive assumption that the PoI itself did not justify? (5 points)

  (c) **The Mechanism Objection:** A colleague argues the paradox is manufactured: "If you specify the physical randomizing procedure (e.g., throwing straws from a distance), the distribution is determined. There is no paradox, only an under-specified problem." Evaluate this claim. Does this response dissolve the paradox, or does it miss the epistemic point of the PoI (i.e., how to reason under ignorance when no mechanism is known)? (5 points)

  (d) **The Inner-Disk Variant:** Consider a variant where we define the chord by picking its midpoint uniformly from the *inner* disk of radius $r/2$ (the region where midpoints of "long" chords reside), rather than the whole disk. Does this variant show that the classical "random midpoint" solution was misdescribed all along, or does it demonstrate that the indifference failure is simply pushed one level down (i.e., why be indifferent about midpoints in *this* region)? Argue for either verdict. (5 points)

  ***

  **Model Answer**

  Bertrand's paradox does not prove the Principle of Indifference (PoI) is logically inconsistent; rather, it reveals that the PoI is underspecified. It is a rule of syntax without semantics. To apply indifference, one must specify *what* is being treated indifferently (endpoints, angles, areas). The paradox arises because "random chord" is an ambiguous noun phrase, not because the mathematics of probability is contradictory. The PoI requires a prior meta-principle to select the correct parameterization before it can assign a measure.

  Regarding Jaynes, his appeal to invariance under translation and scaling is powerful but not a free lunch. Jaynes assumes the problem *ought* to be invariant under these transformations. While physically plausible for a circle thrown onto a lined floor, this is a substantive assumption about the physical context, not a logical truth derived from ignorance. If the circle is fixed on a table and we spin a pointer from the center, rotational invariance applies, but translational invariance does not. Thus, Jaynes does not rescue the PoI from subjectivity; he merely shifts the burden to justifying the symmetry group. He replaces "why this parameter?" with "why this group?" which is an equally difficult philosophical question.

  The "mechanism objection" misses the epistemic purpose of the PoI. If we know the physical mechanism (e.g., straw-throwing), we do not need the PoI; we use frequentist or propensity data. The PoI is designed precisely for cases of ignorance where mechanisms are unknown, such as the Cube Factory problem (edge length vs. volume). Dismissing Bertrand's paradox because a physical mechanism *could* exist is like dismissing logic because empirical facts *could* settle the matter. The paradox highlights the danger of applying PoI to continuous variables without a theory of description. It shows that "ignorance" is not a single state but depends on how we carve up the possibility space.

  Finally, the inner-disk variant (sampling midpoints uniformly from radius $r/2$) yields a probability of 1, as all such chords are "long." This does not prove the classical 1/4 solution was misdescribed; it confirms the indifference failure is pushed one level down. Selecting the midpoint as the fundamental variable is the substantive choice. By restricting the domain to the inner disk, we have implicitly assumed that the "midpoint" is the correct object of indifference, merely narrowing the scope. A critic could argue this shows the 1/4 solution is the "natural" measure on the space of chords, but this begs the question. The variant demonstrates that any application of uniformity is relative to a chosen measure space. Whether one views this as a misdescription or a recursive failure, the lesson remains: uniformity is not a property of the world, but of our representation. The PoI cannot generate information from nothing; it can only redistribute existing structural assumptions.

  ***

  **Marking Scheme (Total: 20 Points)**

  **Part (a): Diagnosis of PoI (5 pts)**
  *   **A (4-5 pts):** Explicitly states PoI is underspecified/parameterization-dependent, not logically inconsistent. Distinguishes between the principle and its application.
  *   **B (2-3 pts):** Says PoI is "vague" or "needs care" but fails to identify parameterization as the core issue. May claim PoI is inconsistent.
  *   **C (0-1 pts):** Recites the 1/2, 1/3, 1/4 math without philosophical analysis.

  **Part (b): Jaynes/Invariance (5 pts)**
  *   **A (4-5 pts):** Argues invariance is a substantive assumption (relocates the problem). Notes that symmetry choices reflect physical beliefs, not pure logic.
  *   **B (2-3 pts):** Describes Jaynes' solution correctly but accepts it as "solving" the paradox without critiquing the assumption of invariance.
  *   **C (0-1 pts):** Confuses invariance with one of the classical three methods.

  **Part (c): Mechanism Objection (5 pts)**
  *   **A (4-5 pts):** Distinguishes epistemic probability (ignorance) from aleatory probability (physical chance). Argues PoI is *for* cases without mechanisms.
  *   **B (2-3 pts):** Agrees mechanism dissolves paradox but fails to note this renders PoI obsolete. Or rejects mechanism without explaining why PoI is needed.
  *   **C (0-1 pts):** Claims the paradox disappears entirely if you throw straws.

  **Part (d): Inner-Disk Variant (5 pts)**
  *   **A (4-5 pts):** **Either** verdict allowed.
      *   *Verdict 1:* It's the same failure one level down (choosing "midpoint" is the bias).
      *   *Verdict 2:* It shows classical solutions were misdescribed (area measure is privileged).
      *   *Requirement:* Must justify *why* based on the nature of measure/representation.
  *   **B (2-3 pts):** Calculates the probability (1) but offers no philosophical interpretation. Or says "it's ambiguous" without argument.
  *   **C (0-1 pts):** Incorrect calculation or irrelevant to the prompt.

  **General Penalties:**
  *   -2 pts for exceeding word count on Model Answer (if used as a guide for students).
  *   -5 pts if the essay is purely mathematical with no philosophical argumentation.

  **Grader Note:** Students often stall by describing the three classical solutions beautifully. **Do not award points for this.** The prompt explicitly forbids relying on that knowledge. Points are awarded *only* for the philosophical moves regarding the status of the PoI, the nature of invariance, and the epistemic vs. physical distinction. An 'A' answer must take a stance, not just summarize the literature.
