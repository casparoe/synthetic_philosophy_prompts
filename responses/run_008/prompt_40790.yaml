prompt: |-
  I'm teaching an upper-level philosophy of probability seminar and I'm putting together the take-home final. I want one essay question on Bertrand's paradox (the random chord one) that can't be answered by just reciting the three classical solutions -- everyone in the class can already do the chord-with-midpoint-uniform-in-disk, chord-from-two-random-circumference-points, and chord-perpendicular-to-a-random-radius bit, including the 1/4, 1/3, 1/2 answers. The question has to force them to take a stance on what exactly the paradox is supposed to show about the principle of indifference: is it that the principle is inconsistent, or just that it's silent until you fix a sample space, or something in between.

  A couple of things I want built in. First, at least part of the question should press on the Jaynes-style move where you argue that one solution is privileged because it's the only one invariant under translations and scalings of the circle -- I want them to say whether that settles the problem or just relocates it (e.g., whether invariance under a group is itself a substantive assumption that indifference didn't buy us). Second, one of my students keeps claiming that the paradox is basically manufactured: he says if you just specify the physical randomizing procedure (throwing straws at a circle from far away, say), the distribution is determined and there's no paradox left, only an under-specified problem. I want the question to make students evaluate whether that "just tell me the mechanism" response dissolves the paradox or misses the point that the principle of indifference was supposed to tell us what to believe when we *don't* have a mechanism -- like in the cube factory case where we only know a cube has an edge between 0 and 2. Third, and this is the part I most care about, I want a sub-question involving a variant we made up in office hours: pick the chord's midpoint uniformly from the disk of radius r/2 (the inscribed disk where midpoints of chords longer than the side of the inscribed equilateral triangle actually live), rather than from the whole disk, and ask whether this shows the classical solutions were misdescribed all along, or whether it's just the same indifference failure one level down. I genuinely don't know what I think about that one, so the marking scheme should allow either verdict as long as it's argued for.

  Please write the question (it can have sub-parts), a model answer of around 600-700 words, and a marking scheme out of 20 that names the specific moves an A answer has to make and where a B answer typically stalls -- I'd guess the usual stall is describing the three solutions beautifully and then mumbling something about "the principle needs more care" instead of saying what kind of repair would even count as success. Also if you could flag in the marking scheme which moves are worth what, that'd save me arguing with the graders later. One typo-riddled draft is fine, I'll clean it up.
