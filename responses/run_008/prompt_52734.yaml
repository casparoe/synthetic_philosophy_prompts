      *   **Context:** A national sports coaching certification body needs to know what "knowing how" consists of to determine the balance between classroom/written exams vs. supervised practice/performance.
      *   **Required Sections:**
          1.  Agreed Claims (numbered): Phenomena, failures of simple formulations, constraints.
          2.  Disagreements: Stated in each side's own terms (no strawmen, no fudges).
          3.  Cruxes: Sub-questions that, if settled, would move a party (Regress, Mismatch Cases, Terminology).
          4.  Evidence/Tests per Crux: Concrete cases/thought experiments with predicted outcomes from both sides.
      *   **Constraints:**
          1.  Tie claims/cruxes to practical certification decisions (exams vs. performance).
          2.  Address recent concessions (Intellectualists allowing knowledge without ability; Anti-Intellectualists allowing non-propositional knowledge of ways). Determine if this narrows the dispute or relocates it. Identify any merely verbal disputes and isolate the substantive residue.

  2.  **Deconstruct the Philosophical Positions:**
      *   **Intellectualist (Stanley-Williamson):** Knowing how = Knowing that (propositional) under a practical mode of presentation. *Key nuance:* One can know the proposition without being able to act (e.g., due to injury), but the *nature* of the knowledge is propositional.
      *   **Anti-Intellectualist (Ryle):** Knowing how = A disposition/capacity/competence. It is *sui generis*, not reducible to knowing that. Regress argument: If acting requires contemplating a proposition first, you need another rule to contemplate that proposition, ad infinitum.
      *   **The "Concessions":**
          *   Int: Knowledge-how doesn't *entail* ability (can be paralyzed).
          *   Anti-Int: Skill might involve "knowledge of ways" that isn't standard propositional knowledge.
      *   **The Practical Stakes:** Written exams (testing propositions) vs. Performance assessments (testing capacities).

  3.  **Drafting - Section 1: Agreed Claims:**
      *   Need to find common ground. Both agree there's a difference between reciting rules and doing. Both agree simple versions of their theories fail (e.g., simple Int says you must be able to recite rules; simple Anti-Int says you can't know anything if you can't move).
      *   *Claim 1 (Phenomena):* The gap between theory and practice is real. (Novice vs. Veteran).
      *   *Claim 2 (Failures):* Simple Int (must articulate) fails (tacit knowledge). Simple Anti-Int (must perform) fails (injured expert).
      *   *Claim 3 (Constraints):* Any account must explain how instruction helps without being sufficient.
      *   *Practical Tie-in:* Written exams alone are insufficient for full certification, but performance alone might miss theoretical safety knowledge.

  4.  **Drafting - Section 2: Disagreements:**
      *   Must use specific terminology.
      *   *Int:* The core state is a relation to a proposition. The "practical mode" is key.
      *   *Anti-Int:* The core state is a multi-track disposition. Propositions are merely aids, not constituents.
      *   *Practical Tie-in:* Int: Written exams *could* in principle certify the core state (even if ability is checked separately). Anti-Int: Written exams only certify *knowledge-that*, which is distinct from the *knowledge-how* required for coaching.

  5.  **Drafting - Section 3 & 4: Cruxes and Tests:**
      *   *Crux 1: The Regress.* Does "practical mode of presentation" stop the regress?
          *   *Test:* The "Panic Coach" scenario.
      *   *Crux 2: Mismatch Cases (Injured vs. Memorizer).*
          *   *Test:* The "Paralyzed Strategist" vs. The "Robotic Drill."
      *   *Crux 3: Terminology.* Is it just about the word "knowledge"?
          *   *Test:* Replace "knowledge" with "state S." Do they still disagree on the *structure* of S?
      *   *Practical Tie-in:* If Int is right, we can test the proposition. If Anti-Int is right, we must test the disposition.

  6.  **Drafting - Section 5: Concessions and Verbal Disputes:**
      *   Address the "recent concessions."
