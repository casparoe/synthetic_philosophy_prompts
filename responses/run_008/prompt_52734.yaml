      *   *Verbal Dispute:* Maybe the word "knowledge" is the fight.
      *   *Substantive Residue:* Is the mental state *structured like a sentence* (propositional) or *structured like a habit* (dispositional)? This matters for testing. If it's propositional, you can write a test. If it's dispositional, you must watch them work.

  7.  **Refining and Polishing (Self-Correction during drafting):**
      *   *Check Constraint 1:* Am I linking enough to coaching certification? *Adjustment:* Ensure every philosophical point ends with a "Therefore, for the Board..." sentence.
      *   *Check Constraint 2:* Did I address the concessions properly? *Adjustment:* Make sure the "Verbal Dispute" section explicitly analyzes whether the concessions collapse the distinction or just shift the boundary.
      *   *Tone:* Needs to be formal, collaborative, yet precise about disagreements. No "he said/she said," but "The Intellectualist maintains..."
      *   *Stanley-Williamson Nuance:* Ensure I don't caricature them as saying "you must be able to talk." They say "you stand in a relation to a proposition." The proposition might be ineffable.
      *   *Rylean Nuance:* Ensure I don't caricature them as saying "thinking is bad." They say "intelligence is in the doing, not prior ghostly acts."

  8.  **Final Review against Prompt:**
      *   (1) Numbered agreed claims? Yes.
