  *(Refining the Concessions)*: The prompt mentions Intellectualists allowing knowledge without ability. This is crucial for the "Injured Coach" case. Anti-Intellectualists allowing "knowledge of ways" needs to be framed carefully so it doesn't sound like propositional knowledge. I will frame it as "guidance without representation."

