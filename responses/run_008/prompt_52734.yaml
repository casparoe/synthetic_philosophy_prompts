answer: |-
  **JOINT STATEMENT ON THE NATURE OF PRACTICAL KNOWLEDGE**
  **Submitted to the National Board of Coaching Certification**
  **By the Adversarial Collaboration on Epistemology and Skill**

  **PREAMBLE**
  We, the undersigned, represent two distinct philosophical traditions regarding the nature of "knowing how" (practical knowledge). The Intellectualist (INT) defends the view that knowing how is a species of propositional knowledge (knowing that), entertained under a practical mode of presentation. The Anti-Intellectualist (ANTI) defends the view that knowing how is a distinct kind of state, best understood as a complex disposition, capacity, or competence, irreducible to propositional attitudes.

  We acknowledge that the Board's mandate is not metaphysical purity but regulatory efficacy. Our goal is to isolate where our disagreement impacts the design of certification: specifically, the ratio of written examination (testing propositional grasp) to supervised performance (testing dispositional capacity).

  ***

  ### I. AGREED CLAIMS
  *The following claims are accepted by both parties as constraints on any adequate theory and as guides for certification policy.*

  1.  **The Phenomenological Gap:** Both parties agree that there is a robust, observable distinction between (a) a novice who can recite technical principles but cannot execute them, and (b) a veteran who executes flawlessly but may struggle to articulate the underlying principles.
      *   *Practical Implication:* Certification cannot rely exclusively on a single modality. A system using only written exams will certify novices; a system using only performance may certify veterans who lack the theoretical safety knowledge required for instruction.

  2.  **The Failure of Simple Intellectualism:** Both parties agree that the ability to verbally articulate principles is neither necessary nor sufficient for knowing how. An expert may lack the vocabulary to describe their technique (tacit knowledge), and a theorist may describe a technique they cannot perform.
      *   *Practical Implication:* Written examinations cannot require candidates to verbally reconstruct their own motor processes as proof of skill. Questions must test understanding of principles, not the ability to introspectively report on performance.

  3.  **The Failure of Simple Anti-Intellectualism:** Both parties agree that the temporary inability to perform does not necessarily entail the loss of knowledge-how. An expert coach with a temporary injury retains their expertise despite lacking the current physical capacity to demonstrate it.
      *   *Practical Implication:* Certification standards must allow for "theoretical certification" or provisional status for candidates who possess the requisite cognitive grasp but are temporarily unable to perform (e.g., due to injury), provided performance is verified later.

  4.  **The Instructional Constraint:** Both parties agree that verbal instruction can improve performance, even if performance is not constituted by verbal rules. There is a causal link between grasping a principle and modifying a disposition.
      *   *Practical Implication:* Classroom instruction is a valid component of certification, not merely a hurdle. It is instrumentally rational to teach principles, even if the final skill is non-propositional.

  5.  **The Hybrid Concession:** We acknowledge recent shifts in our respective positions. INT accepts that standing in the relation of "knowing" to a proposition does not entail the physical *ability* to act (e.g., due to paralysis). ANTI accepts that possessing a skill may involve a form of "guidance" or "sensitivity to norms" that resembles knowledge, provided it is not understood as relations to explicit propositions.
      *   *Practical Implication:* The debate is no longer about whether *any* mental state is involved in action, but about the *structure* of that state. Certification must therefore assess not just *output* (did the drill work?) but *adaptability* (can the coach adjust the drill when conditions change?), as both sides agree adaptability signals the presence of the relevant state.

  ***

  ### II. STATEMENT OF DISAGREEMENTS
  *The following disagreements remain substantive. Each is stated in terms acceptable to the proponent.*

  **1. The Constitution of the State**
  *   **INT:** Knowing how is constituted by a relation to a truth-evaluable content (a proposition). The difference between the theorist and the expert is not the *kind* of knowledge, but the *mode of presentation* under which the proposition is grasped (practical vs. theoretical).
  *   **ANTI:** Knowing how is constituted by a multi-track disposition to behave intelligently. To treat it as a relation to a proposition is to category-mistake a capacity for a content. The difference between the theorist and the expert is that the expert possesses the disposition, while the theorist possesses only a different disposition (to speak).

  **2. The Role of Rules in Performance**
  *   **INT:** When an expert acts, they are guided by their grasp of a proposition (e.g., *that w is a way to swim*). This grasp need not be conscious, but it is the normative ground of the action.
  *   **ANTI:** When an expert acts, they are not guided by a grasp of a proposition, even unconsciously. They are guided by trained habits and situational sensitivities. To posit a proposition is to insert a ghostly intermediary that explains nothing.

  **3. Implications for Assessment Validity**
  *   **INT:** Since the core state is propositional, it is *in principle* possible to certify knowledge-how via written examination, provided the exam successfully accesses the proposition under its practical mode of presentation. Performance tests are merely proxies for this cognitive state.
  *   **ANTI:** Since the core state is dispositional, a written examination can *never* certify knowledge-how, only knowledge-that. Performance tests are not proxies; they are the only direct access to the state itself.

  ***

  ### III. CRUXES AND TEST CASES
  *The following sub-questions represent the pivot points of our disagreement. Settling them would force at least one party to revise their position. For each, we propose a concrete case and record our divergent predictions.*

  **CRUX 1: The Regress of Rules**
  *Question:* Does explaining performance via a "practical mode of presentation" succumb to Ryle's Regress (i.e., does applying the mode require a further rule, ad infinitum), or does it successfully halt the regress?
  *   **Practical Stake:** If INT succumbs to regress, written exams are fundamentally incapable of capturing the "practical" element, forcing the Board to weight performance at 100%. If INT avoids regress, written exams could theoretically capture the essence of coaching.
  *   **Test Case: The Panic Coach.** A certified coach is put under extreme time pressure to correct a swimmer's form. They have no time to recall propositions. They act instantly and correctly.
      *   **INT Prediction:** The coach is still deploying propositional knowledge, but the retrieval is automated. The "practical mode" allows for immediate access without deliberation. The knowledge structure remains propositional.
      *   **ANTI Prediction:** The coach is operating purely on disposition. To say they are accessing a proposition is a fiction. The speed of the reaction proves the absence of propositional mediation.
      *   **Diagnostic:** If INT admits the proposition plays no causal role in the panic moment, their claim that knowledge-how *is* propositional knowledge weakens to the claim that it is merely *correlated* with it.

  **CRUX 2: The Mismatch Cases (Injury vs. Memorization)**
  *Question:* Is the "Injured Champion" (cannot move, knows how) in the same cognitive state as the "Robotic Memorizer" (can move, knows no why)?
  *   **Practical Stake:** If they are in the same state, certification can be modular (theory now, practice later). If they are in fundamentally different states, certification must be holistic.
  *   **Test Case: The Paralyzed Strategist vs. The Perfect Drone.**
      *   *Subject A:* A former champion coach, paralyzed from the neck down, who can diagnose errors and prescribe corrections perfectly.
      *   *Subject B:* An AI-controlled robotic arm programmed to execute perfect swimming strokes but unable to explain or adapt to a swimmer's unique physiology.
      *   **INT Prediction:** Subject A has knowledge-how. Subject B does not. The difference is that A stands in a relation to the proposition *that this is the way to swim*, while B merely simulates the output. A's paralysis is irrelevant to the knowledge state.
      *   **ANTI Prediction:** Subject A has a degraded form of knowledge-how (the disposition to instruct remains, the disposition to swim is lost). Subject B has *no* knowledge-how, only causal mimicry. However, ANTI argues A's state is not propositional but a remaining set of dispositions (to speak/analyze).
      *   **Diagnostic:** If INT concedes A's state is dispositional (to analyze) rather than propositional, the distinction between INT and ANTI collapses into a debate about which dispositions count.

  **CRUX 3: The Terminological Residue**
  *Question:* If we ban the word "knowledge" and replace it with "Cognitive State X," do the parties still disagree on the *structure* of X?
  *   **Practical Stake:** If the dispute is merely verbal, the Board can ignore the philosophy and focus on outcomes. If structural, the Board must choose assessment tools that match the structure.
  *   **Test Case: The Transfer Task.** A coach certified in swimming is asked to coach rowing. The biomechanics differ, but the pedagogical principles (feedback loops, periodization) are similar.
      *   **INT Prediction:** Success depends on whether the coach grasps the higher-order propositions underlying both sports. If the exam tests these propositions, it predicts transfer success.
      *   **ANTI Prediction:** Success depends on whether the coach has developed a flexible disposition of "coachliness." A written exam on principles will fail to predict transfer; only a history of varied performance will.
      *   **Diagnostic:** If INT agrees that grasping the proposition does not guarantee the disposition to transfer, then the "knowledge" (proposition) is distinct from the "how" (disposition to apply).

  ***

  ### IV. ANALYSIS OF CONCESSIONS AND VERBAL DISPUTE
  *Per the Board's second constraint, we address whether recent philosophical concessions have resolved the debate.*

  **1. The Effect of Concessions**
  The Intellectualist concession (that knowledge-how does not entail ability) and the Anti-Intellectualist concession (that skill involves non-propositional guidance) have **relocated** the dispute rather than resolved it.
  *   Previously, the fight was: "Must you be able to do it to know how?" (INT: Yes / ANTI: No).
  *   Now, the fight is: "Is the state that remains when ability is lost *propositional in structure*?" (INT: Yes / ANTI: No).

  **2. Diagnosis of Verbal Dispute**
  We conclude that **part** of the dispute is merely verbal, but a **substantive residue** remains.
  *   **The Verbal Component:** Both parties agree that a paralyzed expert coach is valuable and should be certified to instruct. Both agree a memorizer who cannot perform is not fully certified. If the word "knowledge" is used merely to mark "status worthy of certification," we agree.
  *   **The Substantive Residue:** We disagree on the *architecture of the mind* required for that status.
      *   INT claims the architecture is **representational** (content-bearing).
      *   ANTI claims the architecture is **functional/dispositional** (input-output patterns).

  **3. Final Recommendation to the Board**
  This substantive residue dictates assessment design.
  *   If **INT** is correct, the "practical mode of presentation" implies that candidates can be tested on their grasp of *ways* via scenarios that require selecting the correct principle for a specific context (e.g., "Given Swimmer X's injury, which principle applies?"). This can be done in writing.
  *   If **ANTI** is correct, the "disposition" implies that candidates must be observed handling *unpredictable* contexts where no pre-existing principle applies. This requires live performance.

  **Joint Conclusion:** Because we cannot settle the metaphysical nature of the "practical mode" vs. "disposition" prior to your deadline, we recommend a **Dual-Track Certification**.
  1.  **Written Component:** Tests the propositional grasp of safety, ethics, and biomechanics (satisfies INT requirement for content).
  2.  **Performance Component:** Tests the adaptive disposition in live coaching scenarios (satisfies ANTI requirement for capacity).

  We agree that relying on either track alone risks certifying candidates who possess only half of the requisite cognitive architecture, regardless of which philosophical theory ultimately proves true.

  **Signed,**

  *Dr. Elena Vance (Intellectualist)*
  *Dr. Marcus Thorne (Anti-Intellectualist)*
