      *   Ordered by damage? Yes.
      *   Short replies + soft spots? Yes.
      *   Concessions section? Yes.
      *   Feared question? Yes.

  10. **Final Polish:** Ensure the tone is academic but sharp, suitable for a PPE society Q&A prep. (Self-Correction: Make sure the Math objection isn't *too* technical but hits the core logical flaw). *Decision: Focus on the "Selection of the Metric" as the political act.*

