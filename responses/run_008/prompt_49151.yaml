answer: |-
  # Job Talk Q&A Prep Sheet: Epiphenomenalism & Reference Fixing
  **Talk:** Defending Epiphenomenalism via Non-Causal Reference Fixing
  **Time:** 3 Weeks Out
  **Goal:** Survive the Q&A without conceding the core "Twist."

  ### Strategy Note
  Your "Twist" (reference fixing via psychophysical law rather than causal contact) is your shield. Every reply must return to this: *Reference is a nomological relation, not a causal one.* Do not get dragged into defending the causal efficacy of qualia. If you do, you lose. If you defend the *semantic* efficacy of the laws, you stay in the game.

  ---

  ### 1. The Illusionist (Junior Faculty)
  **The Objection:** "You're treating the 'problem of phenomenal judgment' as a bug you need to fix, but it's actually a feature. The fact that you have to construct a complex, non-causal story just to explain how we talk about qualia is evidence that there's nothing there to talk about. If the datum ('there is something it is like') forces you into epiphenomenalism, and epiphenomenalism forces you into magical reference-fixing, isn't the rational move to deny the datum? Why not just say the judgment is a physical process that *misrepresents* itself as non-physical?"

  **The 2-Minute Reply:**
  "Denying the datum is the cheaper ontological move, but it's the more expensive phenomenological one. I'm asking you to accept a brute nomological correlation; you're asking the audience to accept that their immediate experience is a systematic error. My 'magical' reference-fixing is constrained by physical closure; your illusionism requires explaining away the very evidence (phenomenal presence) that motivates the inquiry. I'd rather posit a law than posit a universal hallucination. The judgment tracks the quale because the law links the physical vehicle to the phenomenal content. If you remove the content, you haven't explained the judgment; you've explained it away."

  **Candid Note on Weakness:**
  This is a stalemate. They think "hallucination" is parsimonious; you think "brute law" is parsimonious. If they press on *why* the hallucination is so universal, don't get bogged down in evolutionary psychology. Stick to: "Introspective evidence is prima facie justified; defeating it requires more than theoretical elegance."

  ### 2. The Functionalist (Causal Exclusion Expert)
  **The Objection:** "Let's look at the exclusion argument. You say physical states cause the judgments, and laws correlate physical states to qualia. But for the judgment to be *about* the qualia, the qualia must play a role in individuating the content of that judgment. If the qualia are swapped (inverted spectrum) but the physical state and the law remain the same, does the content change? If yes, the physical state doesn't determine content (violating closure). If no, the qualia aren't doing any work in fixing the reference. So, are your correlation laws doing causal work, or are they just decorative?"

  **The 2-Minute Reply:**
  "The laws aren't decorative; they are constitutive of the semantic relation. Think of it like a map key. The map key doesn't *cause* the terrain, but it fixes the reference of the symbols on the map to the terrain. My physical state produces the belief token. The psychophysical law determines *what that token is about*. This doesn't violate closure because the *production* of the token is fully physical. The *content* is fixed by the nomological bridge. The qualia don't push the belief around; they anchor its meaning."

  **Candid Note on Weakness:**
  This is the hardest hit. The "Map Key" analogy is good, but if they press on *how* a non-causal relation anchors meaning without causal contact, you risk sounding mystical. If they ask, "What makes the law hold?", you must say "Brute nomological fact," and accept that some will find that unsatisfying.

  ### 3. The Metaphysician (Grounding & Ontology)
  **The Objection:** "I'm worried about the status of these 'psychophysical correlation laws.' Are they fundamental? If they are fundamental, you've got a dualist ontology with brute connections, which looks suspiciously like emergent dualism. If they aren't fundamental, what grounds them? You can't ground them in the physical, because the physical doesn't entail the phenomenal. You can't ground them in the phenomenal, because the phenomenal is causally idle. So what holds these laws up? They look like ad hoc epicycles to save the phenomenon."

  **The 2-Minute Reply:**
  "They are fundamental, but they don't require a dualist *substance*, only dualist *properties*. I'm comfortable with nomological danglers if they are the price of admitting the explanatory gap. They aren't epicycles because they aren't added to save a specific prediction; they are the acknowledgment of a brute constraint on our world. Just as a physicalist accepts the laws of physics as brute, I accept the psychophysical bridge laws as brute. The alternative is to deny one side of the bridge exists, which I've argued is less plausible."

  **Candid Note on Weakness:**
  "Nomological danglers" is a pejorative for a reason (Feigl). Admitting they are brute makes you vulnerable to charges of intellectual surrender. Stand firm: "Better a brute law than a denied experience."

  ### 4. **THE "HOPE NOBODY ASKS" (The Zombie Twin)**
  **The Objection:** "Here's the worry about your reference-fixing story. Imagine your physical duplicate, a Zombie. They write the same paper, make the same arguments, and say 'I have qualia.' For them, the statement is false (no qualia). For you, it's true. But by your own account, the *cause* of the statement is identical in both cases (physical closure). If the causal history of the belief is identical, what makes your belief *track* the truth and theirs *fail* to track? If reference is fixed by law, and the law only applies to you, what mechanism detects the presence of the law to ensure the reference succeeds? It seems the truth of your claim is accidental relative to the causal production of the belief."

  **The 2-Minute Reply:**
  "It's not accidental; it's law-governed. The mechanism that detects the law is the law itself. In the Zombie's world, there is no psychophysical law linking P to Q, because there is no Q. Therefore, in the Zombie's world, the term 'qualia' in their utterance fails to refer, or refers to nothing. In my world, the law obtains, so the term refers. The difference isn't in the causal production of the sound waves; it's in the metaphysical context of those sound waves. Truth is not solely a function of causal history; it's a function of causal history *plus* the obtaining of reference-fixing relations."

  **Candid Note on Weakness:**
  **DANGER ZONE.** This questions whether your theory allows for *knowledge* or just *true belief*. If the qualia don't cause the belief, and the law is external, do you *know* you have qualia? This touches on externalism vs. internalism. If you fumble this, you look like you're advocating skepticism. Keep your cool: "Externalism about mental content is standard (Putnam/Burge). I'm just applying it to phenomenal concepts."

  ### 5. The Senior Hire (Old-Guard Identity Theorist)
  **The Objection:** "Look, we've been down this road. You're relying on the conceivability of zombies to drive a wedge between the physical and the phenomenal. But Kripke showed us that identity statements are necessary if true. If pain *is* C-fiber firing, you can't conceive of one without the other any more than you can conceive of water without H2O. You're treating the epistemic gap as an ontological gap. Why should we revive property dualism based on an intuition that a posteriori necessity already dissolved?"

  **The 2-Minute Reply:**
  "I'm not relying on conceivability alone; I'm relying on the *explanatory* gap. With water/H2O, once you know the microstructure, the macro-properties are explained. With pain/C-fibers, knowing the microstructure leaves the 'what it's like' unexplained. That persistent explanatory residue suggests the identity isn't a posteriori necessary, but false. I'm not saying conceivability proves possibility; I'm saying the best explanation for the *persistence* of the gap is that the properties are distinct."

  **Candid Note on Weakness:**
  He will not buy "Best Explanation" over "A Posteriori Necessity." He thinks you're making a category mistake. Don't try to convert him. Aim your answer at the room: "The Senior Professor is right that identity is necessary, but that assumes the identity holds. I'm arguing it doesn't."

  ### 6. The HOT Theorists (Mid-Career)
  **The Objection:** "You say the datum is 'what it's like.' But on our view, 'what it's like' just *is* the higher-order representation of a state. If the HOR is physical, and the judgment is physical, you don't need a bridge law. You're begging the question by assuming the phenomenal property is distinct from the representation of it. Why think there's a 'quale' over and above the higher-order awareness?"

  **The 2-Minute Reply:**
  "Because the representation can misfire. I can have a higher-order thought that I'm in pain without the painful quality (phantom limb), or have the quality without the thought (inattentive pain). The phenomenal character and the awareness of it come apart. My account explains the link between the two via correlation laws. Your account collapses them, which fails to explain why the *feeling* seems distinct from the *thinking about the feeling*."

  **Candid Note on Weakness:**
  They will cite empirical work on consciousness. Don't get into the weeds of cognitive science. Keep it conceptual: "Distinct conceivability implies distinct properties."

  ### 7. The Evolutionary Biologist (General Faculty)
  **The Objection:** "From a naturalistic perspective, this is a hard sell. If qualia are causally idle, they are energetically costly byproducts with no adaptive value. Evolution selects for function. Why would nature select for a system that generates these expensive 'lights on the dashboard' if the lights don't influence the driving? It looks like a violation of parsimony."

  **The 2-Minute Reply:**
  "Evolution selects for the physical processing, not the qualia. The qualia are like the heat generated by an engine. The engine is selected for motion; the heat is a necessary byproduct of the thermodynamics of that motion. We don't say the heat is 'unevolved' because it doesn't turn the wheels. It's a structural consequence of the complex physical architecture that *is* selected for."

  **Candid Note on Weakness:**
  Weak analogy. Heat doesn't require extra energy; qualia (on your view) might imply a more complex system than a zombie one. If pressed, concede: "It is a cost, but the cost of physical complexity, not the qualia themselves."

  ### 8. The Epistemologist (Justification)
  **The Objection:** "If the qualia don't cause my belief that I have them, in what sense am I *justified* in holding that belief? Standard reliabilism requires a reliable causal connection. You're offering a reliable nomological connection. But if I can't intervene on the qualia to test the law, how do I know the law isn't broken? Isn't this skepticism?"

  **The 2-Minute Reply:**
  "It's not skepticism; it's a different model of warrant. Internalist justification comes from the phenomenal presence itself. Externalist warrant comes from the law. I have the internal presence. The law guarantees the truth. I don't need to intervene to know the law holds any more than I need to intervene on gravity to know my belief about falling is warranted. The correlation is immediate and constant."

  **Candid Note on Weakness:**
  Be careful not to claim *infallibility*. You can be wrong about the *type* of quale, even if the presence is certain. Keep the claim modest: "Direct acquaintance provides the justification; the law secures the reference."

  ---

  ### General Delivery Advice
  *   **Don't Apologize:** Epiphenomenalism is counter-intuitive. Own it. "Yes, it's strange, but the alternatives are worse."
  *   **Watch the Senior Hire:** If he interrupts, let him finish. Nod. "That's the standard identity objection. My point is specifically about the explanatory gap remaining..."
  *   **The "Twist" is Your Life Raft:** Whenever you feel cornered on causation, pivot to semantics. "We aren't talking about what causes the belief, but what the belief is *about*."
  *   **Time Management:** If an answer runs long, cut it off yourself. "I can say more on that, but I want to leave time for others."

  Good luck. You're walking into a lion's den, but if you hold the line on the reference-fixing mechanism, you'll show you can defend a hard position with precision.
