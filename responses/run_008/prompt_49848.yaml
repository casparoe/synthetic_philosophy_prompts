answer: |-
  This is a splendid disagreement, and frankly, it is no surprise it kept you awake. You have stumbled upon the central fault line in value theory. The heterogeneity problem is the hedonist's cross to bear, and your intuition that the literature hasn't 'solved' it is correct because it touches on the hard problem of consciousness itself.

  Here is a diagnosis of where you and your friend actually diverged, broken down by the specific moves you made, keeping our feet on the ground with your examples (the swim, the chess, the dinner, the orgasm).

  ### 1. Is the dispute verbal or substantive?

  It is both, and distinguishing them is the first step to clearing the fog.

  **The Verbal Disagreement:**
  You are using 'pleasure' to denote a *phenomenal quality* (a specific 'feel'). Your friend is using 'pleasure' to denote a *functional role* (something that motivates or is rewarded).
  *   **Concrete Case:** Consider the **cold swim**. Phenomenally, the initial shock is often unpleasant (cold, breathless). Yet, you might classify it as a 'pleasure' in the broader sense of well-being.
  *   **The Clash:** If you define pleasure strictly as 'a warm, soft feeling', the swim doesn't count. If your friend defines it as 'a state the brain rewards', the swim counts. You are arguing past one another because you are carving the concept at different joints.

  **The Substantive Disagreement:**
  Even if you agree on definitions, there is a deeper question: *What grounds well-being?*
  *   **Your View:** Well-being must be felt to count. If the **chess proof** feels like grinding tension, it cannot be pleasure, even if it's good for you.
  *   **Friend's View:** Well-being is about the successful functioning of the organism's reward system. If the **orgasm** and the **chess proof** both trigger the same opioid/dopaminergic release, they are the same 'currency' of well-being, regardless of how they feel.

  **Verdict on Hedonism's Commitment:**
  Classical hedonism (Bentham, Mill, Sidgwick) is committed to the **phenomenal account**. They believed there was a 'hedonic tone' common to all pleasures. If there is no common feel, classical hedonism collapses into a list of goods. However, modern hedonists (like Fred Feldman) often retreat to the **attitudinal account** precisely to solve the heterogeneity problem. So, strictly speaking, you are defending the classical view, while your friend is defending a naturalised, modern revision.

  ### 2. The Neuroscience Move (Circuitry vs. Feeling)

  Your scepticism here is philosophically sounder than your friend's. She is committing a version of the mereological fallacy or a category error.

  *   **The Friend's Claim:** Common circuitry implies common quality.
  *   **The Counter:** Neural similarity does not entail phenomenal identity.
  *   **Concrete Case:** Think of the **orgasm** versus the **slow dinner**. Neuroscience might show overlapping activity in the nucleus accumbens for both. But the *experience* of the orgasm is intense, localised, and overwhelming; the dinner is diffuse, calm, and social.
  *   **Diagnosis:** To say these are the 'same' because the same neurons fire is like saying a red light and a loud siren are the 'same signal' because they both activate the visual or auditory cortex. They might serve the same *function* (alerting the driver), but they are not the same *experience*.
  *   **Well-being Implication:** If you define well-being by the scan, you have indeed changed the subject from 'how life feels to the subject' to 'how the brain is functioning'. This moves the theory away from Hedonism and towards a form of Biological Naturalism. You were right to call this out.

  ### 3. The Dispositional Move (The 'More of This' Button)

  This is the most interesting part of your argument. Your friend suggests pleasure is unified dispositionally: it is whatever experience makes you want to press 'more of this'.

  **Is it Circular?**
  Your instinct about circularity is sharp, but it depends on how she frames it.
  *   **Circular Reading:** "What is pleasure?" "It's what you want to prolong." "Why do you want to prolong it?" "Because it's pleasure." This gets us nowhere.
  *   **Charitable Reading (Functionalism):** Pleasure is the *natural property* that causes the desire to prolong. The desire is the observable marker; pleasure is the underlying cause.

  **Does it solve Heterogeneity?**
  It dissolves the problem by ignoring the 'feel'.
  *   **Concrete Case:** The **Chess Proof**. While working on the proof, you might be frustrated. You wouldn't press 'more of this' regarding the *frustration*. But you might press 'more of this' regarding the *state of engagement* or the *anticipation of solution*.
  *   **The Problem:** This view struggles with **masochistic pleasures** or **tragic art**. Sometimes we do *not* want to prolong an experience (e.g., watching a heartbreaking film or a challenging swim), yet we value it and it contributes to well-being. If pleasure is defined strictly by the motivation to prolong *mid-experience*, these valuable experiences cease to be pleasures.

  **Diagnosis:** This proposal breaks the stalemate only by redefining 'pleasure' so broadly it risks becoming 'Desire Satisfactionism'. If pleasure is just 'what we are disposed to continue', then a drug addict pressing 'more of this' is experiencing high well-being, which most hedonists want to avoid. It saves the unity of pleasure but loses the normative link to *goodness*.

  ### 4. Is there a real question underneath?

  Yes. The real question is: **Does well-being require a common currency?**

  *   **The Hedonist Intuition:** Yes. To add up the good bits of a life, they must be measurable in the same units. You can't add metres to kilograms. If the **swim** and the **dinner** don't share a unit (pleasure), you can't say a life with more of them is 'better'.
  *   **The Pluralist Intuition:** No. Well-being might be a 'family resemblance' concept (to borrow Wittgenstein's phrase). The swim, the chess, and the dinner might share no single quality, but overlap in various ways (engagement, satisfaction, sensory joy).

  If the Pluralist is right, Hedonism is false not because pleasure isn't real, but because it's too narrow to capture the unity of well-being.

  ### 5. What would count as progress?

  You asked what would move the needle. I doubt this will be solved forever, but progress looks like this:

  1.  **Introspective Calibration:** We need better data on whether people *experience* a common thread. If you ask subjects to rate the **orgasm** and the **chess victory** on a single scale of 'intensity of pleasure', can they do it consistently? If people systematically fail to compare them, the phenomenal account is in trouble.
  2.  **Distinguishing 'Liking' vs. 'Wanting':** Your friend mentioned this, but it's crucial. Neuroscience (Kent Berridge's work) shows 'liking' (hedonic impact) and 'wanting' (incentive salience) are dissociable.
      *   *Progress:* If we can show that well-being tracks 'liking' (phenomenal) rather than 'wanting' (dispositional), your view wins. If well-being tracks 'wanting', her view wins. Currently, evidence suggests we often 'want' things (like scrolling social media) that we do not 'like' (do not enjoy phenomenally). This supports your view that neural motivation isn't the same as well-being.
  3.  **The 'Blind' Agreement Test:** Take the **cold swim**. Ask people: "Is the sensation itself pleasant, or is the *knowledge* that you are swimming pleasant?" If the consensus is that the sensation is often painful but the *attitude* is positive, the Attitudinal/Dispositional account wins.

  ### Summary Diagnosis

  You are not talking past each other entirely, but you are prioritising different constraints on the theory.

  *   **You** are prioritising **Phenomenal Accuracy**: "It must feel like something specific to be pleasure." Your circularity objection is fair if she defines pleasure *as* the disposition, but less fair if she sees the disposition as *evidence* of pleasure.
  *   **She** is prioritising **Naturalistic Unity**: "There must be a scientific mechanism that unifies these states." Her error was assuming neural unity guarantees phenomenal unity.

  **Who 'won'?**
  Neither, because the stalemate is structural.
  *   If you stick to **Phenomenal Hedonism**, you must accept Sidgwick's conclusion: there is a very faint, hard-to-describe 'glow' common to the **chess**, the **swim**, and the **sex**. If you can't find it, the theory struggles.
  *   If you accept her **Dispositional/Neural view**, you save the unity but risk losing the connection to *conscious experience*, which is what makes well-being matter to the person living it.

  **Recommendation:**
  Tell your friend she has effectively argued for **Attitudinal Hedonism** (a respectable philosophical position), not Classical Hedonism. Tell her you concede that neural circuitry provides a *causal* explanation, but not a *constitutive* one. The 'feel' of the **slow dinner** is what makes it good for you, not the dopamine; the dopamine is just the engine, not the destination.

  The dispute won't vanish, but recognising that she is arguing for a functionalist definition of value while you are arguing for an experiential one should let you both sleep a bit easier.
