answer: |-
  You have correctly identified a genuine, well-documented phenomenon in social choice theory, and you are also correct that it is distinct from Condorcet's paradox and Arrow's Impossibility Theorem.

  The name you are looking for is the **Discursive Dilemma** (sometimes referred to in legal theory as the **Doctrinal Paradox**).

  Here is the breakdown of the literature, how it differs from the results you already know, and the boundaries of the phenomenon as you requested.

  ### 1. The Name and Literature
  The problem was first identified in legal theory by **Lewis Kornhauser and Lawrence Sager** in 1986 ("The Unanimity Rule in the Judicial Context"). They noticed that appellate courts could reach inconsistent verdicts when voting on the legal premises of a case versus the final judgment.

  It was formalized in philosophy and economics by **Christian List and Philip Pettit** in the early 2000s (most notably in their 2002 paper "Aggregating Sets of Judgments" and their 2011 book *Group Agency*). They coined the term **Discursive Dilemma** to generalize it beyond law to any group making logically connected judgments.

  **Key Citations:**
  *   Kornhauser, L. A., & Sager, L. G. (1986). "Unpacking the Court". *Yale Law Journal*.
  *   List, C., & Pettit, P. (2002). "Aggregating Sets of Judgments: An Impossibility Result". *Economics and Philosophy*.
  *   List, C., & Pettit, P. (2011). *Group Agency: The Possibility, Design, and Status of Corporate Agents*. Oxford University Press.

  ### 2. Distinction from Condorcet and Arrow
  You are right to feel that Condorcet and Arrow are "in the neighborhood" but not quite it. Here is the precise distinction:

  *   **Condorcet's Paradox** concerns **preferences**. It shows that group preferences can be cyclical ($A > B > C > A$) even if every individual's preferences are transitive. It is about *ordering* alternatives.
  *   **Arrow's Impossibility Theorem** concerns **aggregation functions** for preference orderings. It proves no ranking system can satisfy a set of fairness criteria (like non-dictatorship and independence of irrelevant alternatives) simultaneously.
  *   **The Discursive Dilemma** concerns **judgments on propositions**. It is not about ranking candidates ($A$ vs $B$); it is about accepting or rejecting truth claims ($P$, $Q$, and $P \land Q \to R$). The inconsistency is not cyclical; it is **logical**. The group accepts the premises, accepts the logical rule connecting them, but rejects the conclusion.

  In short: Condorcet/Arrow are about *Preferences*; the Discursive Dilemma is about *Beliefs/Judgments*.

  ### 3. The Mechanics and Boundaries
  You asked specific questions about the boundaries of the phenomenon. The literature has answers for all of them.

  **A. Does it only happen with "iff" or "and"?**
  No. The Discursive Dilemma arises with **any logical agenda** where propositions are interdependent.
  While your example uses a conjunction ($C \iff A \land B$), the paradox holds for negations ($\neg A$), conditionals ($A \to B$), and disjunctions ($A \lor B$). The only requirement is that the set of propositions is "connected" such that accepting a majority view on each premise logically forces a specific view on the conclusion that the majority rejects.

  **B. Is Majority Rule special?**
  Majority rule is the most common trigger, but it is not the only one. List and Pettit proved an **Impossibility Theorem for Judgment Aggregation**.
  They showed that *any* aggregation function that satisfies three minimal conditions will fall prey to this dilemma:
  1.  **Universal Domain:** It accepts any set of consistent individual judgments.
  2.  **Anonymity:** All voters count equally (no dictators).
  3.  **Systematicity:** The rule for aggregating votes on proposition $P$ is the same as for proposition $Q$, and the group judgment on $P$ depends only on individual judgments on $P$ (independence).

  Essentially, if you want a democratic (anonymous) and consistent (systematic) way to aggregate judgments on connected issues, **you cannot have it.** You must sacrifice either consistency or democracy.

  **C. Does the order of voting matter?**
  Yes, profoundly. This is the core of the "Dilemma." There are two standard procedures to resolve it, and they yield opposite results:
  1.  **Premise-Based Procedure:** You vote on $A$ and $B$. If both pass, the rule *automatically* dictates $C$ is mandatory. (This preserves logical consistency but overrides the direct vote on $C$).
  2.  **Conclusion-Based Procedure:** You vote directly on $C$. The status of $A$ and $B$ is treated as advisory. (This respects the direct will of the majority on the outcome but renders the group's stance on the premises incoherent).

  In your committee, you accidentally mixed the two. You voted on premises (implying a Premise-Based Procedure) but then allowed a direct vote on the conclusion (Conclusion-Based Procedure) to override the derived result. That is why the room erupted: the *procedure* was ambiguous.

  **D. A Note on Your Arithmetic**
  A minor technical note: In your description, you mention 7 voters (4-3 splits) but describe 8 individual profiles (3 yes/yes, 3 no/no, 2 split).
  For the paradox to hold with 7 voters and consistent individuals, the distribution is typically:
  *   3 voters: Yes on A, Yes on B (Therefore Yes on C)
  *   2 voters: No on A, No on B (Therefore No on C)
  *   1 voter: Yes on A, No on B (Therefore No on C)
  *   1 voter: No on A, Yes on B (Therefore No on C)
  *   **Totals:** A (4-3 Yes), B (4-3 Yes), C (3-4 No).
  This matches your vote counts perfectly. The phenomenon does not depend on the exact count, but ensuring individual consistency (as you did) is the key constraint that makes the group inconsistency surprising.

  ### 4. How to Fix It (Practical Advice)
  Since you are on the committee, you need to know how to stop this from happening next week. The literature suggests three main solutions:

  1.  **Explicitly Choose a Procedure:** Before voting, decide: "Are we voting on the criteria, or the outcome?" If you vote on criteria, the outcome is mathematically determined. If you vote on the outcome, the criteria are merely discussion points. Do not do both.
  2.  **Deliberation:** The paradox assumes fixed votes. In reality, pointing out the inconsistency ("Wait, we just said Yes to A and B, why are we saying No to C?") often persuades the "split" voters to align their conclusion with their premises, or vice versa.
  3.  **Special Majorities:** Sometimes raising the threshold for the premises (e.g., requiring 2/3 majority on A and B) can align the result with the conclusion vote, though the Impossibility Theorem suggests this won't work for all logical structures.

  ### Summary
  *   **Name:** The Discursive Dilemma (or Doctrinal Paradox).
  *   **Field:** Judgment Aggregation Theory.
  *   **Key Difference:** It is about logical consistency of propositions, not transitivity of preferences.
  *   **Boundary:** Applies to any logical connective; arises from any democratic aggregation rule satisfying minimal fairness conditions (List-Pettit Impossibility Theorem).
  *   **Cause:** Mixing Premise-Based and Conclusion-Based voting procedures.

  You have discovered one of the fundamental limits of collective rationality. It is not a bug in your bylaws; it is a feature of group decision-making.
