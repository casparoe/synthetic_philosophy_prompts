  So what I'd like is a careful side-by-side of the two setups. Walk through the causal structure of each (who observes what, what depends on what, and crucially whether the counterparty's move depends on your decision algorithm or only on external randomness), and then say explicitly where causal, evidential, and updateless/functional-style decision theories come down on each case — which (theory, case) combos result in paying and which don't. Then address my proposed distinction directly: does "the coin doesn't care about me, but the blackmailer's action is a function of what I'd do" track something one of the standard theories actually formalizes, or does it collapse under pressure? To stress-test it, we invented a hybrid case at the last meetup — please analyze that too: Omega flips a fair coin exactly as in the mugging, but after seeing the result, it only runs the whole encounter if its simulation predicts you'd pay on tails; in the heads world where you'd refuse, it never contacts you and no money ever changes hands. Is this hybrid structurally closer to the mugging, closer to the blackmail, or something genuinely new? And what should you actually do in it, on each theory?

