      *   **User:** Third-year PhD student in epistemology.
      *   **Topic:** The Luminosity Debate (Williamson's *Knowledge and Its Limits*, 2000).
      *   **Problem:** The debate is static/stalled. Three entrenched camps (Deniers, Deflectors/Trivializers, Revisionists). No movement.
      *   **User's Hypothesis:** The stall is due to an unflagged ambiguity in "condition." Coarse individuation (phenomenal states) makes the margin-for-error (MFE) premise look false. Fine individuation (total world states) makes the conclusion trivial/irrelevant to self-knowledge. The real issue is whether introspection is *constitutive* vs. *evidential* (safety-based).
      *   **Task:** Provide a *diagnosis*, not a survey. Evaluate the hypothesis (verbal, substantive, or hybrid). Identify the real dispute (individuation, safety, constitutive vs. evidential, bedrock intuitions, formal assumptions). Advise on what counts as progress (or if progress is impossible) and implications for a dissertation.
      *   **Tone:** Serious, challenging, rigorous, peer-to-peer (academic philosophy level).

  2.  **Deconstruct the User's Hypothesis:**
