  Williamson explicitly argues against coarse individuation in Chapter 4. He says if conditions are coarse, they aren't luminous because you can't distinguish the boundaries. If they are fine, MFE applies.
  So the user's hypothesis is that the *debate* stalls because people aren't tracking this shift.
