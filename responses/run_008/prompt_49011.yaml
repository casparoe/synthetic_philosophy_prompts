answer: |-
  "The volcano has agency" is a category error in dynamical systems, functioning as a metaphorical placeholder for nonlinear forcing sensitivity.

  Restated in your terms: The debate concerns whether to treat non-humans as external forcing functions or merely as static boundary conditions. The "agency" claim asserts that specific forcings (volcanoes, pathogens) possess sufficient magnitude and timing to trigger bifurcations in the social system, shifting it to a new equilibrium (e.g., post-Black Death labor markets). The "determinism" counter-charge warns against modeling society as a linearly forced system where output is uniquely predictable from input. Instead, historians emphasize sensitive dependence on initial conditions: the same volcanic forcing yields revolution in France but stagnation elsewhere, dictated by the social system's internal variability and path dependence. They are arguing about the coupling strength between the biosphere and the sociosphere.

  **Residue Report**

  **1. Clean Translate:** The mechanics of change. Your framework explains how small perturbations (germs) amplify via positive feedback loops better than linear historical narratives. "Bifurcation" captures the "turning point" without implying inevitability. Stochastic resonance fits cases where weak periodic climate signals align with social noise to produce regime shifts.

  **2. Distorted:** "Agency." In Actor-Network Theory, agency implies symmetry and reciprocity within a network. In dynamics, a volcano is a one-way forcing; it does not respond to the atmosphere's state. Translating "agency" as "forcing" loses the relational ontology historians seek. They want the volcano to be a participant; you see it as a parameter.

  **3. Untranslatable:** The normative stakes. When historians reject "determinism," they are protecting human moral responsibility. In your field, determinism is a mathematical property, not an ethical violation. Your vocabulary cannot capture why erasing human choice is politically dangerous, only that it is scientifically inaccurate if internal variability is high.

  **4. Judgement:** The historians' usage of "agency" is doing rhetorical work your vocabulary refuses. They need "agency" to grant non-humans standing in the moral narrative of history. You need "forcing" to close the energy budget. The concept isn't missing from your training; it's irrelevant to physics. However, their fear of determinism is often a misunderstanding of chaos theory—they think "determinism" means "predictable," whereas you know deterministic systems can be unpredictable. They are fighting a straw man of Laplacian demons using words that sound like your equations but aren't.

  **Verdict on the Gap:** Your vocabulary is superior for mechanism, but blind to the normative work "agency" performs. You describe *how* the system breaks; they argue about *who* is responsible for the pieces. Do not adopt "agency"; it introduces intent where there is only coupling. But acknowledge that their "determinism" worry is actually a correct intuition about high-dimensional chaos, even if their terminology is imprecise. They are right that the forcing doesn't dictate the trajectory, but wrong to think your framework says it does.
