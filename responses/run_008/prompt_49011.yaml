  Here's what I want, and it's a translation job, not a summary. Restate that whole debate — actants, distributed agency, the determinism charge, the case studies people actually use (I've seen the 1815 Tambora eruption and the Black Death come up a lot) — in the vocabulary I've used my whole working life: external forcing versus internal variability, boundary conditions, bifurcations and multiple equilibria, sensitive dependence on initial conditions, path dependence, stochastic resonance if it earns its place. So, e.g., "the volcano as historical actor" might come out as a large impulsive forcing on a system with strong nonlinear response — but you tell me how far that actually gets, because I suspect it doesn't get all the way.

