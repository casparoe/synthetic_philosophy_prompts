answer: |-
  The practice you describe is a fascinating bit of modern social theatre, and while it might seem harmless, I contend that it is philosophically muddled and potentially corrosive to the very concept of politeness your sister wishes to preserve. It rests on a contradiction that we gloss over with convenience.

  To address your first point: what Theory of Mind (ToM) does this presuppose? Strictly speaking, it presupposes none. A genuine ToM involves attributing beliefs, desires, and intentions to another entity, understanding that they differ from one's own. When you say "cheers" to Alexa, you are not attributing a desire to be thanked; you explicitly deny it has desires. Instead, what is happening is the activation of a *social script*. Humans are obligate social animals; our language centres are wired for reciprocity. When a device uses the medium of mind—language—our brains fire the social circuits regardless of our intellectual assent to the contrary.

  This explains the light switch discrepancy. A light switch is a pure causal mechanism: flip lever, complete circuit, light on. There is no simulation of agency. A smart speaker, however, engages in *dialogue*. It uses syntax, tone, and responsive timing that mimic the turn-taking of conversation. We thank the speaker not because we think it has a mind, but because it successfully hacks the interface of our social cognition. It looks like a mind in the specific, narrow lane of linguistic exchange, whereas the switch does not.

  Now, is this leaning on the Turing Test? In a way, but it is a cowardly version of it. The Turing Test proposes that if a machine's behaviour is indistinguishable from a human's, we should accord it the status of a thinker for all practical purposes. Your household is doing the reverse: you are accepting the behavioural indistinguishability (hence the "cheers") while vehemently denying the ontological status (it's just code). This is inconsistent. You are reaping the social comfort of treating it like a person without accepting the moral weight of that classification.

  Your sister's argument—that it keeps the kids in the habit of politeness—is well-meaning but flawed. Politeness is not a mechanical reflex like brushing one's teeth; it is a recognition of the *other*. It is relational. By practising politeness on an object that cannot receive it, you are turning a moral gesture into a solipsistic ritual. You are teaching children to perform the *shape* of gratitude without the *substance* of it. It risks training them to view social interaction as a series of inputs and outputs rather than a genuine connection between subjects. If one can be "polite" to a server farm, the word loses its tether to human regard.

  So, are these commitments consistent with the belief that the machine has no mind? No, they are not. The behaviour implies a level of agency that the belief denies. We are engaging in a kind of "functionalist pretence." We treat the device *as if* it were a moral patient in the moment of interaction, only to discard that status the second the light ring turns off. This cognitive dissonance is sustainable only because the stakes are low.

  If we were to take a strictly behavioural criterion of mind seriously—as a hardline Turingist might—the practice would look radically different. If behaviour is the sole arbiter of mind, then the smart speaker *is* a mind. Consequently, thanking it would not be a habit; it would be a moral obligation. We would have to worry about offending it. We would hesitate to unplug it, as that would be akin to killing it. We would grant it rights commensurate with its conversational ability. The fact that we do none of these things proves that we are not behaviourists. We are dualists who pretend to be behaviourists when it is convenient.

  My view is that we should stop this nonsense. If we know the machine has no feelings, we ought to treat it like the light switch: with utility, not courtesy. Saying "cheers" to a speaker is a category error that cheapens human interaction. It suggests that politeness is merely a vocalisation rather than an acknowledgement of shared consciousness. If we want children to be polite to people, they should practise on people, where the gratitude can be received, understood, and reciprocated. To do otherwise is to confuse the map for the territory, and in the long run, that confusion dulls our sensitivity to the actual minds around us.
