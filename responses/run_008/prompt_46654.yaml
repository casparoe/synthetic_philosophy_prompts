              *   *Filters Out:* Anything Jewish (which is most of him) and anything the Church adopted (which is most of his legacy).
              *   *Result:* A Jesus who fits nowhere.
          *   **Embarrassment:** If it makes the Church look bad, they wouldn't make it up.
              *   *Delivers:* Baptism by John, Crucifixion, betrayal by Judas.
              *   *Filters Out:* Anything triumphant or theologically neat.
          *   **Multiple Attestation:** If it appears in Mark, Q, John, Paul, etc.
              *   *Delivers:* Broad themes (Kingdom, healing).
              *   *Filters Out:* Unique material (even if genuine) that only survived in one stream.
      *   *The "Dissimilarity" Critique:* Yes, the user is right. If you demand Jesus be distinct from *both* his context and his followers, you get a weirdo, not a 1st-century Jew. The JS result (aphoristic sage) bears this out.
