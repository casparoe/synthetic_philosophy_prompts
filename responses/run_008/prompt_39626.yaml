answer: |-
  This is a classic and seductive skeptical argument, often associated with the "problem of the criterion" or Agrippan skepticism, applied specifically to logic. Your intuition is correct: the argument does change the subject, and it proves too much (specifically, it undermines its own rational authority).

  You should reject **Step (6)**.

  Here is the breakdown of why (6) is the false step, why your friend's move there is illicit, and what it costs you to reject it.

  ### The False Step: Step (6)

  > *(6) Whatever cannot be deductively established has, as an authority, only a conventional or psychological standing.*

  This step asserts a false dichotomy. It assumes there are only two kinds of authority:
  1.  **Deductive Authority:** Derived from a prior deductive argument.
  2.  **Non-Rational Authority:** Mere convention, habit, or psychological compulsion.

  Step (6) ignores a third category: **Constitutive Rational Norms.**

  Rules of inference (like *Modus Ponens*) are not true *because* they are deduced from something else; they are the standards *by which* deduction is judged. To demand that a rule of inference be "deductively established" is to demand that the standard of measurement be measured by itself (circularity) or by a different standard (regress).

  If you reject (6), you can assert that a rule of inference can have **rational authority** without having **deductive justification**. Its authority comes from the fact that it is constitutive of what it means to reason rationally. To deny *Modus Ponens* is not to adopt an alternative convention; it is to cease to participate in the practice of deduction altogether.

  ### Why the Subject Changes (3) to (8)

  Your suspicion that the argument changes the subject is precise.
  *   **Steps (1)–(5)** establish that logic is not **propositional** all the way down. (You cannot turn rules into premises).
  *   **Steps (6)–(8)** conclude that logic is not **rational**.

  The slide happens because your friend equates "rational" with "propositional." They assume that for something to be rational, it must be the conclusion of an argument. But if *every* rational truth required a prior argument, nothing could ever be rational (due to the regress shown in Step 2). Therefore, for rationality to exist at all, there must be some rational truths that are **basic**—authoritative without being inferred.

  By accepting (6), your friend is essentially defining "rational authority" in a way that makes its existence impossible.

  ### The Cost of Rejecting (6)

  Rejecting (6) is the only way to save mathematics and logic from skepticism, but it does come with a philosophical cost. You must accept a form of **Foundationalism** regarding logic.

  1.  **You must accept "Properly Basic" Logical Truths:** You have to admit that some logical principles (like the Law of Non-Contradiction or *Modus Ponens*) are rationally binding *without* proof. They are self-evident or indispensable to thought.
  2.  **You lose the "God's Eye View":** You cannot stand outside of logic and justify it using a "super-logic." You must acknowledge that we justify logic *from within* our logical practices. This feels less "absolute" to a skeptic, but it is the only position that allows reasoning to function.
  3.  **You must confront the "Self-Defeat" of the Skeptic:** If your friend insists on (6), you can point out that their own argument against mathematics relies on deductive inference. If (8) is true (that deductive inference has no rational authority), then your friend's argument for (8) has no rational authority. They are sawing off the branch they are sitting on.

  ### A Secondary Target: Step (1)

  While (6) is the fatal flaw, **Step (1)** is also vulnerable and worth noting if your friend presses you:

  > *(1) A deductive argument justifies belief in its conclusion only if accepting its premises compels acceptance of the conclusion.*

  This conflates **normative justification** with **psychological compulsion**.
  *   **Justification** is about whether you *ought* to accept the conclusion.
  *   **Compulsion** is about whether you *feel forced* to accept it.

  I can be logically justified in believing a complex theorem even if I am too tired to feel "compelled" by the proof at this moment. Conversely, a sophist might psychologically compel me to believe a fallacy. Logic deals with entitlement, not psychological causality. Carroll's Tortoise exploits this confusion by treating logical "must" as a causal "must."

  ### Summary for Your Friend

  You can tell your friend:

  1.  **Grant (2) and (3):** Carroll is right. Rules of inference are not premises. Logic requires a practice/disposition.
  2.  **Deny (6):** Just because a rule cannot be *deduced* doesn't mean it is merely *conventional*. Some norms are **constitutive** of rationality. They are the framework within which "conventional" and "rational" make sense.
  3.  **Point out the Self-Refutation:** If the authority of deduction is merely psychological (8), then the argument for (8) is merely psychological. It gives us no reason to believe it.

  By rejecting (6), you preserve the rational authority of mathematics without denying the Carroll regress. You simply acknowledge that the regress stops at the rules of inference, not because they are proven, but because they are the **preconditions of proof**.
