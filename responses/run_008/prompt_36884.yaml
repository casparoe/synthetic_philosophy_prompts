answer: |-
  This is a classic friction point in evolutionary biology. The phrase "just-so story" has undergone semantic drift since Gould and Lewontin (1979). Originally, it was a specific methodological critique regarding the *comparison of hypotheses*. Now, it is often used as a generic slur against adaptationism.

  Your intuition is correct: your labmate is likely conflating several distinct epistemic failures under one label. If you want to move the conversation forward, you need to force a disambiguation.

  Here is the precisified menu of what "just-so story" can actually mean, categorized by the nature of the complaint and the appropriate verdict.

  ### Part 1: The Menu of "Just-So" Charges

  #### 1. The Historical Skeptic (Your candidate *a*)
  *   **The Claim:** "We cannot observe the past. Therefore, any claim about historical selection pressures is inherently speculative and untestable."
  *   **The Logic:** Evolutionary biology is historical science; unlike physics, we cannot rerun the tape. Therefore, adaptationist claims are no more secure than creationist claims or random guesses.
  *   **Verdict:** **Name-calling / Philosophical Confusion.**
      *   *Why:* This proves too much. It applies equally to non-adaptive explanations (e.g., "this trait is due to drift 100k years ago"). If this were true, evolutionary biology would be impossible. A good adaptationist rejects this; historical claims are constrained by present evidence (fossils, phylogeny, comparative data).
      *   *Action:* Dismiss this reading. It shuts down the field, not just the hypothesis.

  #### 2. The Mechanistic Void (Your candidate *b*)
  *   **The Claim:** "You have identified a benefit, but you have not identified the causal pathway or the genetic variance required for selection to act."
  *   **The Logic:** A trait cannot be an adaptation if there is no heritable variation for it, or if the link between the trait and the proposed fitness benefit is physically impossible or unspecified.
  *   **Verdict:** **Substantive Methodological Demand.**
      *   *Why:* This is a valid request for more data. It doesn't falsify the hypothesis; it demands the "how."
      *   *Action:* Accept this as a research directive ("Okay, what specific mechanism would falsify this?").

  #### 3. The Post-Hoc Fit / Unfalsifiability (Your candidate *c* + Popperian)
  *   **The Claim:** "The story is constructed *after* the fact to fit the data, and is flexible enough to fit *any* possible data."
  *   **The Logic:** If a hypothesis can explain why a trait exists *and* why it doesn't exist (e.g., "Sexual dimorphism exists because of competition" vs. "Monomorphism exists because competition is low"), it predicts nothing. It lacks risk.
  *   **Verdict:** **Justification for Dismissal (if true).**
      *   *Why:* If a hypothesis is truly unfalsifiable, it is not science. However, many adaptationist hypotheses *are* falsifiable (e.g., predicting specific environmental correlations).
      *   *Action:* Challenge the labmate to show *what data would contradict* the hypothesis. If they can't name any, they have a point. If they can, the charge is false.

  #### 4. The Null Model Neglect (Your candidate *d* — The G&L Core)
  *   **The Claim:** "You have assumed adaptation is the default explanation without comparing it to a null model (drift, constraint, pleiotropy, phylogenetic inertia)."
  *   **The Logic:** This is the actual argument of the Spandrels paper. It is not that adaptations don't exist, but that adaptationists often fail to test $H_{adapt}$ against $H_{null}$.
  *   **Verdict:** **Substantive Methodological Demand.**
      *   *Why:* This is the strongest, most legitimate use of the phrase. It demands a comparative framework.
      *   *Action:* Ask: "What is the specific null model you prefer? Hormonal byproduct? Phylogenetic constraint?"

  #### 5. The Pan-Adaptationist Presumption (Your candidate *e* + Level of Org)
  *   **The Claim:** "You are assuming every trait has a function at the level of the individual trait, rather than being a byproduct of system-level organization."
  *   **The Logic:** This targets the assumption that natural selection optimizes every detail. It suggests the trait might be a "spandrel"—a necessary architectural consequence of a different adaptation (e.g., the chin is a byproduct of jaw reduction, not selected for itself).
  *   **Verdict:** **Substantive Methodological Warning.**
      *   *Why:* It warns against "atomizing" the organism too much.
      *   *Action:* Accept as a caution against over-interpreting minor traits.

  #### 6. The Phylogenetic Mismatch (New Candidate)
  *   **The Claim:** "The trait appears in the fossil/phylogenetic record *before* the proposed selection pressure existed."
  *   **The Logic:** If pregnancy sickness existed in ancestors who didn't eat plant toxins, the adaptation story is empirically false.
  *   **Verdict:** **Justification for Dismissal (Empirical Falsification).**
      *   *Why:* This is hard evidence, not philosophical posturing.
      *   *Action:* This requires data, not armchair philosophy.

  ---

  ### Part 2: Application to the Pregnancy Sickness Hypothesis

  Now, apply this menu to the specific hypothesis (Profet's Hypothesis: Pregnancy sickness is an adaptation to protect the embryo during organogenesis).

  **1. Is it Historical Skepticism?**
  *   **Labmate's likely move:** "We weren't there to see the selection."
  *   **Counter:** We don't need to be there. We can look at cross-cultural data, miscarriage rates, and toxin avoidance behaviors *now*. This charge is weak here.

  **2. Is it Mechanistic Void?**
  *   **Status:** The mechanism is hormonal (hCG triggers nausea). The link to toxins is behavioral (nausea causes aversion).
  *   **Verdict:** The mechanism is specified. If your labmate claims this is missing, he is ignoring the physiological literature.

  **3. Is it Post-Hoc / Unfalsifiable?**
  *   **Status:** Profet made specific predictions: Sickness should peak during organogenesis (weeks 6–18); women with sickness should have lower miscarriage rates; aversions should target toxin-rich foods (bitter/caffeine/alcohol).
  *   **Verdict:** These are falsifiable claims. Data generally supports them (e.g., meta-analyses show correlation between nausea and reduced miscarriage). If the labmate calls this a "just-so story," he is misusing the term "unfalsifiable."

  **4. Is it Null Model Neglect? (The Strongest Critique)**
  *   **Status:** The main rival hypothesis is that nausea is a **byproduct** of high hCG levels required to maintain the corpus luteum, not an adaptation *for* nausea itself.
  *   **Verdict:** This is the only legitimate battleground. The adaptationist must show that the *specific timing and content* of aversions tracks toxins better than it tracks hCG levels alone. If the labmate means "You haven't ruled out the hormonal byproduct hypothesis," he is making a substantive G&L point.

  **5. Is it Phylogenetic Mismatch?**
  *   **Status:** Do other mammals experience morning sickness? If not, why? If yes, do they avoid toxins?
  *   **Verdict:** This is an empirical question. If humans are unique in this sickness but not unique in toxin exposure, the adaptation story weakens.

  ---

  ### Part 3: Diagnosing Your Labmate

  When your labmate waves it off as a "just-so story" and moves on, he is almost certainly **conflating Charge 1 (Historical Skepticism) with Charge 4 (Null Model Neglect).**

  He is using the *rhetorical force* of Charge 1 (which implies the hypothesis is untestable nonsense) to avoid doing the work of Charge 4 (which requires him to articulate a specific null model and compare evidence).

  **My guess:** He is invoking **Charge 4 (Null Model Neglect)** but treating it as **Charge 3 (Unfalsifiability).**
  He believes that because the selection pressure (toxins) is historical and inferred, the hypothesis is inherently untestable. He is failing to recognize that Profet's hypothesis generates *current* predictions (miscarriage rates, dietary choices) that can be measured.

  ### How to bring this back to him

  Print this out or copy it into an email. Say:

  > "I've been thinking about your 'just-so story' comment. I want to make sure I'm addressing your actual objection, because the literature distinguishes between a few different versions of that critique. Which one are you making?
  >
  > 1.  **Unfalsifiability:** Do you think there is *no data* that could prove the pregnancy sickness hypothesis wrong? (If so, what data would convince you?)
  > 2.  **Null Model Neglect:** Do you think the 'hormonal byproduct' hypothesis is simply being ignored? (If so, let's compare the evidence for both.)
  > 3.  **Historical Skepticism:** Do you think we can't infer selection pressures without a time machine? (If so, does that apply to all evolutionary bio, or just behavioral traits?)
  >
  > If it's #2, I agree we should test the null. If it's #1 or #3, I think that misunderstands how adaptationist hypotheses are tested. I'd rather we argue about the evidence than the label."

  This forces him to pick a lane. If he picks #1 or #3, you can point out that he's rejecting the methodology of the entire field. If he picks #2, you actually have a scientific debate to have. If he refuses to pick, you know he's using the phrase as a conversation-stopper rather than a critique.
