      *   **Constraints:** Do not share my own half-formed views (remain neutral/adjudicative). Write in American English. Address specific numbered points from both sides, assess the unnumbered closing replies, and identify what both are missing.
      *   **Tone:** Analytical, fair, philosophical, decisive but nuanced.

  2.  **Deconstruct the Arguments:**

