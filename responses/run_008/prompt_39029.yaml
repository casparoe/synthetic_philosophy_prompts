  6.  **Refining the Philosophical Stance (Self-Correction during drafting):**
      *   *Correction:* I shouldn't just say "you're wrong." I need to show *why* it's inconsistent.
      *   *Case 5 is the killer.* If two groups cannot produce viable offspring, biologically they are distinct species under almost *any* definition except a purely morphological one. If the user insists they are the same species, they are defining species by *appearance/culture*, not biology.
      *   *Case 7 (Rotifers)* is also extreme. Calling highly divergent asexual lines "one species" is taxonomically radical. It suggests the user values the *label* "rotifer" over the evolutionary reality.
      *   *Case 8 (Hybrid)* vs *Case 4 (Swarm)*. Why is one a species and the other a mess? Case 8 breeds true (stable lineage). Case 4 is unstable. This points to a *Lineage/Phylogenetic* view.
