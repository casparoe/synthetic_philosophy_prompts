  3.  **Brainstorming Candidate Principles (Internal Monologue/Drafting):**
      *   *Idea 1: Strict Biological Species Concept (BSC).* Species = Interbreeding natural populations reproductively isolated from others.
          *   Fails: Case 2 (dogs/wolves), Case 3 (ring species), Case 5 (engineered humans), Case 6 (fossils), Case 7 (asexuals).
          *   User rejects this mostly.
      *   *Idea 2: Phylogenetic Species Concept (PSC).* Species = Smallest monophyletic group with a shared derived character.
          *   Fails: Case 3 (ring species often treated as one), Case 7 (rotifers would be millions of species), Case 5 (if isolated, they are distinct lineages).
