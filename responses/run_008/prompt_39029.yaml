      *   *Diagnosis:* Point out the contradiction between Case 1 (Lions/Tigers = Species) and Case 5 (Isolated Humans = Same Species). This is the biggest crack.
      *   *Proposed Principles:*
          1.  **The Cohesion-Lineage Principle:** Focuses on independent evolutionary trajectories. (Handles 1, 3, 4, 6, 8).
          2.  **The Phenetic-Social Principle:** Focuses on recognizable similarity and social boundary maintenance. (Handles 2, 5, 7).
          3.  **The Pluralist Approach:** Admit different concepts for different contexts.
      *   *Neanderthals:* Under Cohesion, they are distinct (mostly isolated). Under Phenetic, they are close.
      *   *Modified Case 5:* If interfertile but assortative mating? That's sympatric speciation in progress.
