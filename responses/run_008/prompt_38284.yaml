      *   *Claim 2: "Anselm started it... God is 'a being than which nothing greater can be conceived,' and existing in reality is greater than existing only in the mind, so God has to exist in reality."*
          *   **Verdict:** Accurate summary of Anselm's *Proslogion* II.
      *   *Claim 3: "Descartes cleaned this up by defining God as a supremely perfect being and noting that existence is one of the perfections, so God exists by definition."*
          *   **Verdict:** Accurate summary of Descartes' version (Meditations V).
      *   *Claim 4: "He presents Anselm and Descartes as doing the same basic move."*
          *   **User Question:** Is this a conflation?
          *   **Analysis:** They are similar (both *a priori*, both rely on greatness/perfection implying existence), but structurally distinct. Anselm uses a reductio ad absurdum regarding "existence in the understanding." Descartes treats existence as a property contained in the essence of a perfect being (like triangles having 180 degrees). Philosophers often distinguish them, but for a party summary, grouping them is acceptable. I need to highlight the nuance.
      *   *Claim 5: "Kant refuted the whole family of arguments by showing that existence isn't a real predicate."*
          *   **User Question:** Did this kill *all* versions?
          *   **Analysis:** Kant's objection is devastating to Descartes (existence as a perfection/property). It's less clear against Anselm (which is about modes of being, not necessarily predicates). It definitely *doesn't* kill Modal versions (Plantinga/Gödel) because they don't treat existence as a first-order predicate in the same way; they treat *necessary existence* as a property or use modal logic where existence is handled differently. So, "refuted the whole family" is an overstatement.
      *   *Claim 6: "Gödel... revived it with modal logic: he proved that if God's existence is even possible, then God necessarily exists, and since no one can prove God's existence is impossible, God exists."*
          *   **User Question:** Is this what Gödel claimed? Is the "nobody can prove impossible" bit a sleight of hand?
          *   **Analysis:** This is the crux. The friend is conflating Plantinga's Modal Ontological Argument with Gödel's.
              *   *Plantinga:* Uses S5 modal logic. Premise: It is *possible* that a Maximally Great Being exists. Conclusion: Therefore, it *necessarily* exists. The burden is on the possibility premise.
              *   *Gödel:* Uses a formal axiomatic system involving "positive properties." He defines God-like as possessing all positive properties. He proves that if the axioms hold, a God-like being necessarily exists. He does *not* simply say "nobody can prove it impossible." He attempts to derive it from axioms about "positivity."
              *   *Correction:* The friend's summary sounds more like Plantinga than Gödel, though Gödel's proof does entail necessary existence if possible. The "nobody can prove impossible" bit is indeed a weak point (shifting burden of proof).
      *   *Claim 7: "Everyone agrees the derivation is formally valid, so the only question is whether Gödel's axioms are true, and they basically just assume the conclusion in mathematical dress."*
          *   **Verdict:** "Formally valid" is mostly true (within the specific logic system). "Assume the conclusion" is the standard criticism (question-begging). This is a fair philosophical assessment, though "everyone agrees" is strong.
      *   *Claim 8: "Gödel apparently never published the thing in his lifetime."*
