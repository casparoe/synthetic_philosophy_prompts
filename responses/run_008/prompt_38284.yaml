      *   *Refining the "Sleight of Hand":* The user is right to be suspicious of "no one can prove it impossible." In modal logic, "possible" means "logically coherent," not "empirically unrefuted." Just because we haven't found a contradiction doesn't guarantee one doesn't exist.
