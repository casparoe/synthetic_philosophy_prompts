  3.  **Drafting the Desiderata (Iterative Process):**

      *   *Desideratum 1: Finite Agreement.* If expectations are finite, the theory must match Standard Expected Utility (SEU). *Rationale:* We know SEU works for normal cases; new theory should extend, not replace, unless necessary.
      *   *Desideratum 2: State/Description Invariance.* Relabeling states or outcomes shouldn't change the verdict. *Rationale:* Rationality is about the world, not the map.
      *   *Desideratum 3: Series Reordering Invariance (The Pasadena Problem).* The order of summation shouldn't dictate value. *Rationale:* Physical reality doesn't care about the order we write numbers in.
      *   *Desideratum 4: Dominance.* If Act A yields $\ge$ utility than Act B in every state, and $>$ in some, prefer A. *Rationale:* This is the bedrock of rational choice.
      *   *Desideratum 5: Action Guidance (Completeness).* Must the theory output a verdict? *User's Hunch:* Maybe not. *My Task:* Evaluate this. If a theory says "I don't know," is that useful? In a forced choice, you *must* pick. So the theory needs to handle forced choices even if it lacks a precise value.
      *   *Desideratum 6: Repeated Play/Long Run.* Does the verdict hold if played $N$ times? *Rationale:* St. Petersburg looks different over 1 trial vs. 1 million trials. A good theory should account for the law of large numbers (or lack thereof).
      *   *Desideratum 7: Truncation Robustness (The Friend's Challenge).* If the theory uses a cutoff (time, utility, probability), does changing the cutoff change the rational choice in a paradoxical way? *Rationale:* Avoids arbitrary parameters driving results.

