      *   *The Truncation Stress-Test:* I need to formalize the friend's claim. Call it "Parameter Stability." If a theory introduces a parameter $\epsilon$ or $T$ to tame the tail, the rational choice shouldn't flip based on small changes to $\epsilon$ unless the underlying game changes.
      *   *Splitting Outcomes:* If I split "Win \$10" into "Win \$10 on Heads" and "Win \$10 on Tails" (where the coin is irrelevant), the value shouldn't change. This is "Partition Invariance."

  5.  **Structuring the Output:**
