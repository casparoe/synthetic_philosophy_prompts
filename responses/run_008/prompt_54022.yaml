answer: |-
  This is a request for a specification document for a decision theory capable of handling infinite, divergent, or undefined expectations. The literature (St. Petersburg, Pasadena, Altadena, Two-Envelope variants) is indeed plagued by theorists talking past one another because they prioritize different virtues (e.g., mathematical elegance vs. action-guidance).

  Below is a set of desiderata organized by category. I have flagged which requirements are widely accepted and which are contestable (including your hunch about determinacy).

  ### I. Formal Consistency & Invariance
  *These requirements ensure the theory measures the world, not the description of the world.*

  **1. Partition Invariance (Description Independence)**
  *   **Requirement:** Splitting a single state or outcome into two logically equivalent sub-states must not change the verdict. (e.g., "Win \$10" should have the same value as "Win \$10 if Coin is Heads" + "Win \$10 if Coin is Tails," assuming the coin is fair and irrelevant to the mechanism).
  *   **Rationale:** Rational preference should not depend on the granularity of the agent's model. If a theory fails this, it allows "framing effects" where an agent can pump value simply by redescribing the same gamble.
  *   **Status:** **Hard Constraint.** Failure here renders the theory mathematically incoherent.

  **2. Series Reordering Invariance**
  *   **Requirement:** The value assigned to a gamble must not depend on the order in which outcomes are summed or enumerated.
  *   **Rationale:** This is the specific failure mode of the Pasadena Game. The Riemann Rearrangement Theorem shows conditionally convergent series can sum to any value depending on order. Physical reality does not have an "order of summation." A decision theory that yields different verdicts based on how the agent lists the possibilities is measuring the agent's bookkeeping, not the gamble.
  *   **Status:** **Hard Constraint.** Any theory that allows value to shift via reordering is arguably not evaluating the *game*, but the *representation*.

  **3. Finite Agreement (Conservatism)**
  *   **Requirement:** In all cases where expected utility is finite and well-defined, the theory must yield the same verdict as Standard Expected Utility (SEU) theory.
  *   **Rationale:** SEU works perfectly for bounded, finite cases. A new theory is intended to *extend* decision theory to the infinite, not to *replace* it for the finite. If a theory changes verdicts on normal bets (e.g., coin flips for \$10), it creates unnecessary risk in everyday reasoning.
  *   **Status:** **Hard Constraint.** Violation implies the theory is broken, not just extended.

  ### II. Normative Force & Action Guidance
  *These requirements concern what the theory tells the agent to **do**.*

  **4. Statewise Dominance**
  *   **Requirement:** If Act $A$ yields an outcome at least as good as Act $B$ in every possible state, and strictly better in at least one state with non-zero probability, the theory must prefer $A$ to $B$.
  *   **Rationale:** This is the minimal definition of instrumental rationality. If you cannot imagine a world where $B$ beats $A$, choosing $B$ is indefensible.
  *   **Status:** **Hard Constraint (with caveats).** Some infinite cases (like "Satan's St. Petersburg") challenge this, but abandoning dominance is a high cost. A theory that violates this must provide a overwhelming justification (e.g., showing the dominance relies on an impossible infinity).

  **5. Forced-Choice Resoluteness (The "Determinate Action" Requirement)**
  *   **Requirement:** In a binary, forced-choice scenario (e.g., "Pay \$50 to play Pasadena or Keep \$50"), the theory must output a recommendation (Choose A, Choose B, or Indifferent). It cannot output "Undefined."
  *   **Rationale:** This addresses your hunch. You suspect this is a prejudice. However, consider the alternative: If the theory says "No Verdict," the agent is left without a normative guide in a situation where *inaction is not an option*. If you must choose, and the theory offers no guidance, the theory has failed its primary functional purpose (guiding action).
  *   **Pushback on your hunch:** There is a distinction between *Valuational Completeness* (assigning a real number to every gamble) and *Decisional Completeness* (ranking every pair of options). A theory can reasonably refuse the former (admitting the value is undefined) but it struggles to refuse the latter without ceasing to be a *decision* theory. If it refuses the latter, it effectively defaults to "Arbitrary Choice," which may violate Dominance.
  *   **Status:** **Contestable but Functional.** A theory can fail this if it explicitly redefines its scope as "evaluative" rather than "prescriptive," but for a practical agent, this is a failure mode.

  **6. Price Sensitivity (Monotonicity)**
  *   **Requirement:** If a game is rejected at price $P$, it should generally be rejected at price $P + \epsilon$ (for $\epsilon > 0$). Conversely, if accepted at $P$, it should be accepted at $P - \epsilon$.
  *   **Rationale:** Prevents "money pumps" based on infinitesimal price changes. If a theory says "Don't pay \$50" but "Do pay \$50.01," it is unstable.
  *   **Status:** **Hard Constraint.** Violation leads to immediate Dutch Book vulnerability.

  ### III. Aggregation & Temporal Stability
  *These requirements test how the theory handles repetition and time.*

  **7. Repeated Play Convergence**
  *   **Requirement:** The verdict for a single play should be consistent with the limit of the average utility as $N \to \infty$ plays, *if* that limit exists.
  *   **Rationale:** The St. Petersburg paradox relies on the disconnect between single-play expectation and long-run average. If a theory says "Play this once" but "Do not play this 1,000 times," it requires an explanation of why the aggregation fails. If the long-run average converges to a finite number (by Law of Large Numbers variants), the single-play valuation should not wildly contradict it.
  *   **Status:** **Contestable.** Some argue single-shot rationality is distinct from long-run strategy. However, a theory that radically diverges between the two needs a robust defense of "single-shot exceptionalism."

  **8. Dynamic Consistency**
  *   **Requirement:** If you plan to play a game at $T_1$, and at $T_0$ you have the option to pre-commit or alter the terms, your preference at $T_0$ should not contradict your planned action at $T_1$ without new information.
  *   **Rationale:** Prevents time-inconsistency paradoxes where the agent fights their future self.
  *   **Status:** **Hard Constraint.** Violation implies the agent is diachronically irrational.

  ### IV. Robustness Stress-Test (The "Truncation" Check)
  *This addresses your friend's claim regarding cutoffs and Two-Envelope variants.*

  **9. Parameter Stability (No Arbitrary Cutoffs)**
  *   **Requirement:** If the theory resolves divergence by introducing a truncation parameter (e.g., ignoring utilities above $U_{max}$, or probabilities below $P_{min}$, or time horizons $T$), the rational verdict must not flip based on small, arbitrary adjustments to that parameter.
  *   **The Stress-Test Case:** Consider a Two-Envelope variant where the distribution of money in the envelopes is heavy-tailed. If the theory says "Switch" when the utility cutoff is \$1,000,000, but "Stay" when the cutoff is \$1,000,001, without any change in the actual money distribution, the theory is broken. The cutoff is a mathematical tool, not a physical feature of the game. If the tool drives the result, the result is an artifact.
  *   **Rationale:** This targets "regularization" strategies. If you tame the infinite by chopping off the tail, you must ensure the head (the reasonable part) drives the decision, not the exact location of the chop. If the decision is sensitive to the chop location, the theory hasn't solved the divergence; it has hidden it behind a parameter.
  *   **Status:** **Hard Constraint for Truncation Theories.** If a theory does *not* use truncation (e.g., it uses relative utility or dominance), this requirement does not apply. But if it *does* use a cutoff, it must pass this.

  ### V. Summary of Contestability

  Here is where you should expect the literature to fight, and where you should decide how strict your grading spec will be:

  1.  **Forced-Choice Resoluteness:**
      *   *Camp A (Pragmatists):* A decision theory *must* tell me what to do. If it says "Undefined," it's useless.
      *   *Camp B (Purists):* Some problems are genuinely indeterminate. Forcing a verdict is lying. The correct verdict is "Rational permission to choose either."
      *   *Recommendation:* Grade theories on whether they distinguish between **Indifference** (values are equal) and **Incomparability** (values cannot be compared). A theory can meet Resoluteness by saying "Both options are rationally permissible" rather than "Option A is strictly better."

  2.  **Dominance in Infinite Spaces:**
      *   *Camp A:* Dominance is sacred. If A is always better than B, you pick A.
      *   *Camp B:* In infinite cases, Statewise Dominance can conflict with Expected Utility. Something has to give.
      *   *Recommendation:* Flag this. A theory that keeps Dominance might have to sacrifice Finite Agreement or Reordering Invariance. A theory that keeps EV might have to sacrifice Dominance. There is an "Impossible Trinity" here.

  3.  **Single-Shot vs. Repeated:**
      *   *Camp A:* Rationality is about the long run. If it doesn't pay off over time, it's not rational.
      *   *Camp B:* I only live once. The long-run average is irrelevant to a single existential choice.
      *   *Recommendation:* Your spec should require the theory to *state* its position here. A theory that is silent on aggregation is incomplete for St. Petersburg-type problems.

  ### VI. The "Friend's Claim" Elaboration
  Your friend is correct that naive truncation is vulnerable. To make Desideratum #9 concrete for your grading:

  **The "Moving Cutoff" Test:**
  1.  Construct a gamble $G$ with divergent expectation.
  2.  Apply the theory's truncation method with parameter $k$.
  3.  Calculate the recommended action $Action(k)$.
  4.  Vary $k$ continuously.
  5.  **Fail Condition:** If $Action(k)$ oscillates or flips discontinuously as $k \to \infty$ (without the underlying gamble changing), the theory fails Parameter Stability.
  6.  **Why:** This shows the "solution" is not a property of the gamble, but a property of the solver's arbitrary setting. It is the decision-theoretic equivalent of a numerical integration method that gives different answers depending on the step size, even as step size $\to 0$.

  ### Final Note on Your Hunch
  You suspected "Returns a determinate action" is a prejudice. I argue it is a **functional necessity**, but not necessarily a **valuational necessity**.
  *   **Valuational Determinacy:** "The value of Pasadena is 5." (Likely impossible/undesirable).
  *   **Decisional Determinacy:** "You are permitted to pay \$50," or "You are required to pay \$50," or "You are forbidden to pay \$50." (Necessary).

  A theory can pass the spec by admitting the *value* is undefined while still providing a *choice rule* (e.g., "When value is undefined, default to Minimax" or "When value is undefined, all options are permissible"). A theory that says "The value is undefined, therefore I have no advice" fails the spec because it abandons the agent at the moment of choice.
