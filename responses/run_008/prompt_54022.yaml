  *(Self-Correction during final output generation)*: I need to make sure I explicitly address the "forced choice" scenario the user mentioned ("what do I do when I actually have to choose?"). A theory that says "No verdict" is useless in a forced choice unless it provides a secondary rule (e.g., "maximin" or "arbitrary pick"). I will frame this as *Forced-Choice Resoluteness*.

  Let's organize the desiderata into logical groups: Formal Consistency, Normative Adequacy, and Dynamic/Aggregation Stability.

