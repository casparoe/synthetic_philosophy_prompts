  *   **Agree:** Proceed to Node 10.
  *   **Disagree:** **Leaf G: Methodological Individualist.**
      *   *Diagnosis:* Unnamed; this view is incoherent in this context because it restricts 'knowable' so narrowly that most scientific truths become unknowable.

