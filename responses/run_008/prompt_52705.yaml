answer: |-
  Dear Colleague,

  I have been reflecting on our recent conversations regarding your work on moral emotions and institutional design, specifically in light of the upcoming verdict you must deliver on the proposed corporate harassment policy. As you know, the policy requires an employee found to have harassed a colleague to stand before an all-hands meeting of several hundred employees, describe their actions, apologize, and then, following training, be formally welcomed back by the CEO in a ceremony of reintegration. Given your track record of judgments on concrete practices, I believe I can anticipate your reasoning, though the case presents a genuine tension between the principles that seem to underwrite your previous verdicts. To help clarify my own thinking before your seminar, I have laid out below how each candidate principle applies to this case, how your skepticism about cultural engineering influences the weighting of these principles, and my final prediction regarding your verdict, followed by a suggestion for a further case that might help disentangle these competing explanations.

  If we apply the first principle, that shame is morally acceptable when reintegrative but indefensible when stigmatizing, the prediction for this policy is praise. Your endorsement of the Japanese classroom practice and traditional confession suggests you view shame as permissible, and even valuable, provided it concludes with forgiveness and restoration to the community. The corporate policy explicitly builds in this arc, moving from acknowledgment to training to a ceremonial welcome back by the highest authority, mirroring the structure of the reintegrative shaming you praised in the school setting. However, if we apply the second principle, that the decisive variable is the size, permanence, and composition of the audience, the prediction shifts to condemnation. Your praise for the university that abolished public naming and your condemnation of the municipal shoplifter website suggest a strong aversion to large-scale public exposure. The Japanese classroom case involved a small circle of peers, and confession is private, whereas an all-hands meeting of several hundred employees resembles the public square more than the intimate community, risking the permanence and scale of stigma you rejected in the shoplifter case. The third principle, focusing on whether a practice targets deeds or character, offers a more ambiguous prediction but leans toward praise. The policy requires the employee to describe what they did, which targets the deed rather than the person, similar to the specific wrongs acknowledged in confession, whereas the parenting manual you condemned relied on comparisons that targeted the child's character relative to their siblings.

  Your stated skepticism about whether a culture can simply choose its dominant moral emotion plays a crucial role in weighing these principles against one another. You have noted that while institutions can nudge the balance between guilt and shame, they cannot override the psychological realities of how emotions function in specific contexts. This skepticism suggests you would be wary of the corporation's ability to engineer genuine reintegration at scale. In a small classroom or a confessional booth, the community is tight-knit enough that forgiveness feels authentic and the shame remains bounded. In a corporation of hundreds, the audience is largely composed of strangers or distant colleagues who do not interact daily with the wrongdoer. Consequently, the ceremonial welcome back by the CEO risks appearing performative rather than substantive, unable to undo the stigmatizing effect of the initial public humiliation. This line of reasoning suggests your skepticism pulls you toward the second principle regarding audience size and composition, as it acknowledges the limits of institutional design against human psychological responses to public spectacle.

  Based on this analysis, my best guess is that you will condemn the proposed corporate policy. While the policy attempts to mimic the reintegrative structure of the Japanese school case, the scale of the audience fundamentally alters the moral psychology at play. You have consistently condemned practices that expose wrongdoers to large, impersonal audiences, such as the shoplifter website and the university's former naming practice, because such exposure tends to固化 stigma rather than dissolve it. The reintegration ceremony in this corporate context is likely too thin to counteract the breadth of the shaming event, making the practice stigmatizing in effect regardless of its reintegrative intent. Furthermore, the pressure of performing contrition before hundreds of people often shifts the focus from the deed to the character of the wrongdoer, as the spectacle invites judgment of the person rather than the act, undermining the third principle as well. You will likely argue that the institution is overreaching its capacity to nudge emotional repertoires, attempting to mandate a form of communal forgiveness that cannot exist in an audience of that size.

  To further distinguish these principles in future discussions, I propose we present you with a case involving a small, tight-knit team of five employees where a member who falsified data is corrected in front of the group, given no penance, and simply returned to work without any ceremony of forgiveness or formal welcome back. This case would pit the first principle against the second. The audience is small, which satisfies the second principle and aligns with your praised Japanese classroom example, yet there is no explicit reintegration ritual, which violates the first principle's requirement for forgiveness and restoration. If you condemn this practice, it would confirm that reintegration is the necessary condition for permissible shame, overriding audience size. If you praise it, it would suggest that keeping the audience small and private is sufficient to prevent stigmatization, even without formal reintegration, thereby strengthening the second principle as the primary driver of your judgments. This would help clarify whether your objection to the corporate policy is truly about the size of the audience or the insufficiency of the reintegration mechanism in that specific context. I look forward to hearing your verdict and discussing how these nuances shape our understanding of moral psychology in institutional life.
