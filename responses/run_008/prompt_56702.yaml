answer: |-
  **ALTERNATIVE POSSIBILITIES INSURANCE CORPORATION**
  **POLICY DOCUMENT: FRNK-1969-AP**

  **SECTION 1: DEFINITIONS**
  1.1 **"Insured"** refers to the moral agent (hereinafter "Jones") seeking protection for their responsibility status.
  1.2 **"Counterfactual Intervener"** refers to any entity (hereinafter "Black") possessing the capacity to ensure a specific outcome via neural manipulation, provided such capacity remains unexercised during the covered event.
  1.3 **"Trigger Condition"** refers to any involuntary prior sign indicating a potential deviation from the Intervener's desired outcome, the occurrence of which would necessitate intervention were the Insured not to proceed voluntarily.
  1.4 **"Alternative Possibilities"** (APs) refers to the leeway to do otherwise under identical antecedent conditions.

  **SECTION 2: COVERAGE CLAUSES**
  2.1 **Responsibility Indemnity.** The Corporation agrees to uphold the Insured's moral responsibility status even in instances where APs are demonstrably absent. Coverage activates when the Insured performs an action voluntarily, regardless of whether the Intervener would have coerced said action had the Insured hesitated. The Insured is covered for the actual sequence of events, notwithstanding the counterfactual sequence.
  2.2 **Counterfactual Stability.** Coverage remains valid so long as the Intervener remains idle. The Insured is covered for actions stemming from their own reasons, even if those reasons were the only possible reasons available within the causal chain.
  2.3 **Causal History Waiver.** The Corporation waives the requirement for an infinite regress of free choices. Responsibility is sourced at the moment of decision, provided no external force actually intervenes to bypass the Insured's psychological processes.

  **SECTION 3: EXCLUSIONS**
  3.1 **Actual Intervention.** Any claim involving actual manipulation by the Intervener is void. This policy covers counterfactual constraint, not actual coercion. If Black pushes the button, coverage terminates immediately.
  3.2 **Flicker Strategies.** Claims relying on the existence of microscopic APs (e.g., the ability to initiate the Trigger Condition voluntarily) are excluded. The policy assumes a robust Frankfurt case where all APs are extinguished. Attempts to locate freedom in the prior sign itself will result in claim denial.
  3.3 **Dilemma Defenses.** Coverage is denied if the Insured argues that the Intervener's prediction mechanism violates causal laws. The Insured must accept the logical coherence of the scenario as presented. If the Insured claims the setup is metaphysically impossible, the policy is null.

  **SECTION 4: RIDER OPTIONS**
  4.1 **Leeway Basic Tier.** Covers responsibility attribution based strictly on the existence of APs. This rider is deprecated and rarely pays out in Frankfurt jurisdictions. Premiums are high due to high risk of falsification.
  4.2 **Sourcehood Premium Tier.** Covers responsibility attribution based on actual sequence properties. This rider guarantees coverage even when APs are zero, provided the action issues from the Insured's psychology. Recommended for compatibilists.

  **CLAIMS PROCEDURE**
  Claims must be filed within one possible world. Proof of responsibility must be submitted via intuition pump.

  ***

  **NOTE ON POLICY LIMITATIONS**
  This policy takes liberties regarding the Intervener's predictive capacity. It assumes Black can predict Jones's choice without causal tracking of the decision process itself, which is exactly where compatibilist critics argue these cases cheat. If the prior sign is causally determined, the dilemma defense suggests Jones lacks responsibility anyway; if it is undetermined, Black cannot predict it reliably. A rigorous application of the dilemma defense would likely sink the whole product, as the coverage relies on the coherence of the Frankfurt case itself, which remains contested in high-risk metaphysical jurisdictions.
