  I'm a philosophy PhD student (social epistemology / testimony stuff, mostly) and I keep a running log of my sister's verdicts on honesty cases because she's the most consistent person I know. Her record so far: telling a boring acquaintance it was great catching up when you'd happily never see them again — fine; telling grandma her cake was delicious — fine, actually kind; saying you're busy when really you just don't feel like going to something — fine; telling a friend her singing is good when she's deciding whether to audition for a semi-pro choir — really wrong; letting your partner go on believing you're happy to move to their city for their job when you're not — really wrong; telling a colleague their startup idea is great when you think it's not, after which they quit their job — about the worst thing a person can do; and she says her Dutch coworker flatly telling the whole team their pitch deck was weak was not rude, and her Japanese coworker steering everyone away from the idea with vague questions and pointed silences wasn't lying either — though she defends each of those differently.

  This weekend she's visiting right after my roommate's open mic. The roommate is going up no matter what anyone says, and afterward she'll ask whether the set was funny. It isn't. She's also explicitly told all of us to always be straight with her. But criticism takes her days to bounce back from, and the set will be over either way.

  What's my sister going to say about telling her it was funny? I can see at least three rules that fit everything in the log — something about whether the lie distorts a decision, something about whether the person has asked not to be managed, something about the stakes of the topic — and I'm pretty sure they don't all agree here. Give me your prediction, which rule you'd bet on and why, and what case or question would actually split the remaining rules apart.
