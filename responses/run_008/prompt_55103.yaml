      *   *Claim 6 (Abandoned by 1980s):* **RED FLAG.** EUT was *not* abandoned. It remains the normative standard in economics, finance, and game theory. Behavioral economics (Prospect Theory) emerged as a *descriptive* alternative, but EUT is still the benchmark. *Verdict: Flatly False.*
