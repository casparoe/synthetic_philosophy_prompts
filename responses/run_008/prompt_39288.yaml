answer: |-
  You have put your finger on the single most persistent and damaging objection to act utilitarianism, and you are right to be suspicious of the "move" people make to escape it. There isn't one single magic word that covers the whole phenomenon, but there is a precise cluster of terms and a specific literature in moral philosophy and decision theory that maps exactly onto what you are describing.

  The problem you identified is formally known as **Complex Cluelessness**. The move you are describing—assuming the unknown long-term effects cancel out—is most commonly referred to as **The Cancellation Argument** or relying on the **Principle of Indifference**. The structural rule used to justify stopping the calculation is the **Reasonable Foreseeability Constraint**.

  Here is the breakdown of the terminology, the defense, and why your intuition that a premise is being smuggled in is shared by the leading philosophers in this space.

  ### 1. The Problem: Complex Cluelessness
  The term "Cluelessness" was formalized in contemporary ethics primarily by **Hilary Greaves** (specifically in her 2016 paper *"Cluelessness"*). She distinguishes between two types:

  *   **Simple Cluelessness:** You don't know if an action will have good or bad consequences, but you have no reason to think it's one or the other. (e.g., I don't know if this rain will help or hurt the crop).
  *   **Complex Cluelessness:** You have reasons to think the action will have good effects *and* reasons to think it will have bad effects, but you cannot compare the magnitudes. (e.g., Saving a life is good, but that person might grow up to be a tyrant).

  Your example (saving money vs. malaria charity) is the textbook case of **Complex Cluelessness**. The chain of causation becomes chaotic (sensitive to initial conditions), and the uncertainty compounds exponentially.

  ### 2. The Move: The Cancellation Argument & Principle of Indifference
  When people say, "Well, the far effects are unknowable and there's no reason to think they're systematically good or bad, so we treat them as zero," they are making two distinct philosophical moves:

  **A. The Principle of Indifference (The Symmetry Assumption)**
  This is the probabilistic engine of the move. In decision theory, the Principle of Indifference states that if you have no evidence favoring one outcome over another, you should assign them equal probability.
  *   **The Assumption:** By applying this to moral consequences, the agent assumes the probability distribution of long-term outcomes is **symmetric around zero**.
  *   **The Smuggle:** You correctly identified that this is a substantive premise. There is no logical law stating the universe is morally symmetric. It is entirely possible that "good" actions have a systematic tendency to produce chaotic bad long-term effects (or vice versa). Asserting symmetry is a claim about the structure of reality, not just an admission of ignorance.

  **B. Epistemic Truncation (The Foreseeability Constraint)**
  This is the practical cut-off. It is the claim that moral responsibility (or utilitarian calculation) only extends to consequences that are **reasonably foreseeable**.
  *   **The Move:** This truncates the chain at link 3 or 4.
  *   **The Justification:** Usually pragmatic. If we cannot calculate it, it cannot guide action, so we define it as morally irrelevant.

  ### 3. How It Is Defended (Because It *Is* Defended)
  You asked if anyone actually tries to defend this or if it's just silent hand-waving. It is defended, but the defense usually requires shifting away from pure Act Utilitarianism.

  **Defense 1: Rule Consequentialism**
  This is the most robust defense. A Rule Consequentialist argues that we should not evaluate individual acts by their specific long-term consequences (which leads to your cluelessness wall). Instead, we evaluate *rules* (e.g., "Donate 10% of income").
  *   **The Argument:** We *can* know the long-term effects of following a *rule* generally, even if we can't know the effects of a specific *act*. The symmetry assumption is applied to the exceptions, but the rule stands because it works on average. This bypasses the need to calculate the butterfly effect for every lunch decision.

  **Defense 2: Empirical Regularities (Moral Optimism)**
  Some philosophers (like Peter Singer in some contexts) argue that while *specific* long-term chains are unknowable, there are broad empirical regularities.
  *   **The Argument:** History suggests that reducing suffering and increasing rationality tends to have positive long-term echoes more often than not. They argue the distribution isn't symmetric around zero; it's slightly skewed positive for "common sense good." This is an empirical claim, not just a logical one, and it is open to falsification.

  **Defense 3: Decision-Theoretic Necessity**
  This is the "ought implies can" argument. If a moral theory requires calculations that are physically impossible for humans to perform, the theory is flawed, not the humans.
  *   **The Argument:** We *must* truncate the chain because a moral theory that paralyzes agency is self-defeating. Therefore, we adopt a **proxy metric** (near-term well-being) that correlates with the true metric (total well-being), acknowledging it is imperfect but necessary.

  ### 4. Why Longtermists Reject This Move
  It is crucial to note that the **Longtermism** movement (within Effective Altruism) exists specifically to reject the move you described.
  *   **The Longtermist Critique:** They argue that the "Cancellation Argument" is false. They posit that because the future is vast, even a tiny asymmetry in the long-term effects dwarfs all near-term effects.
  *   **The Conflict:** When a "near-termist" EA says "ignore the far future because it's noisy," and a "longtermist" EA says "the far future is all that matters," they are disagreeing precisely on the validity of the **Symmetry Assumption**. The longtermist argues the noise has a signal (e.g., reducing existential risk), and therefore truncating the chain is a moral catastrophe.

  ### 5. Distinctions: Risk Aversion and Pascal's Mugging
  You asked how this differs from being risk-averse or dodging Pascal's Mugging.

  **Vs. Risk Aversion:**
  *   **Risk Aversion** is a preference function. It says, "I prefer a guaranteed 5 utils over a 50% chance of 10 utils."
  *   **The Cluelessness Move** is an **Epistemic Claim**. It says, "The expected value of the long term is *zero* (or undefined), not that it is *risky*."
  *   If you were just risk-averse, you would still acknowledge the long-term effects might be huge, but you'd discount them because of the variance. The move you described claims the effects *cancel out*, implying the Expected Value (EV) is near zero, not just that the variance is high.

  **Vs. Pascal's Mugging:**
  *   **Pascal's Mugging** relies on **Fat-Tailed Distributions**. It argues that there is a tiny probability of an *infinite* (or astronomically large) payoff, which dominates the calculation.
  *   **The Cluelessness Move** assumes a **Normal (Thin-Tailed) Distribution**. It assumes the unknown effects cluster around a mean (zero).
  *   Rejecting Pascal's Mugging is saying, "I don't trust your probability estimate of 1 in a googol."
  *   Making the Cluelessness Move is saying, "I assume the probability distribution is centered on zero because I have no evidence otherwise."
  *   *Crucially:* Longtermists argue the future is *actually* a Pascal's Mugging scenario (fat-tailed), which is why they say the "Cancellation/Truncation" move is dangerous.

  ### Summary of Terms
  If you want to search for more on this, these are the precise handles:

  1.  **Complex Cluelessness:** The state of having conflicting reasons and unknowable magnitudes (Greaves).
  2.  **The Cancellation Argument:** The claim that unknown effects sum to zero.
  3.  **Principle of Indifference:** The probabilistic justification for symmetry.
  4.  **Reasonable Foreseeability Constraint:** The ethical rule limiting liability/calculation to the near term.
  5.  **Model Uncertainty:** The decision-theoretic term for not knowing the structure of the causal chain itself.

  ### The Verdict on Your Intuition
  Your intuition is correct and philosophically sophisticated. The move from "I don't know" to "It cancels out" is a **substantive assumption about the moral structure of the universe**, not a logical necessity.

  Most philosophers who use this move rely on **Rule Utilitarianism** to hide the assumption (by shifting the calculation to rules rather than acts) or on **Pragmatism** (by claiming we have no choice). However, if you stay within strict Act Utilitarianism, Hilary Greaves and others argue that this move is unjustified and that Cluelessness remains a fatal objection to the theory unless one adopts a Longtermist perspective (which accepts the uncertainty but denies the symmetry).

  So, when your dad or an EA makes that move, they are implicitly invoking the **Reasonable Foreseeability Constraint** backed by an unjustified **Principle of Indifference**. They are prioritizing **agency** over **accuracy**, hoping that the "noise" of the universe is morally neutral. There is no proof that it is.
