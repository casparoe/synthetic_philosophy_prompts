answer: |-
  This is a profound observation, and you have correctly identified a gap in the everyday vocabulary. While pieces of this phenomenon are described in ethology, cognitive psychology, and computer science, there is no single, canonical term that captures the specific intersection of **learned behavior**, **interruption**, and **full-sequence restart**.

  Here is a breakdown of the existing concepts that come close, a proposed term to fill the gap, the boundary conditions you asked for, and an analysis of what this implies about agency.

  ### 1. The Existing Neighbors (and why they aren't quite it)

  **Ethology: Fixed Action Patterns (FAPs)**
  This is the closest biological analog. In ethology, a FAP is an instinctive behavioral sequence that is relatively invariant in form and once initiated, runs to completion. If a nesting goose is interrupted while rolling an egg back into the nest, she will often continue the "rolling" motion with no egg, or restart the approach if the interruption was severe.
  *   **Why it's not a perfect fit:** FAPs are typically *innate* (genetically hardwired). Your examples are *learned* (driving, coffee, lab prep). However, the mechanism appears identical: the behavior is "ballistic" once triggered.

  **Cognitive Psychology: Chunking & Automaticity**
  Psychologists describe how individual steps (pour water, add grounds, press button) get compressed into a single cognitive unit or "chunk." This is the basis of *procedural memory*.
  *   **Why it's not a perfect fit:** "Chunking" explains the storage compression, but not the *error handling protocol*. It explains why you don't think about the steps, but not why an interruption forces a reboot rather than a resume. (In fact, the *Ovsiankina Effect* suggests humans have a drive to *resume* interrupted tasks, making your observation a specific counter-case).

  **Computer Science: Atomic Transactions**
  In databases, an "atomic" operation is one that must complete entirely or not at all. If step 6 fails, the system "rolls back" to the start to ensure data integrity.
  *   **Why it's not a perfect fit:** This is a metaphor, not a behavioral science term. However, your intuition that the routine is "compiled into one indivisible unit" is exactly what computer scientists call **atomicity**.

  ### 2. Coining the Term: "Procedural Atomicity"

  Since no single term exists for *learned* sequences that exhibit *innate-style restart logic*, I propose we call this phenomenon **Procedural Atomicity**.

  **Definition:** *Procedural Atomicity* is a cognitive state wherein a learned multi-step sequence is encoded as a single, indivisible executable unit. Upon significant interruption or error, the system lacks the granularity to resume at the point of failure and instead triggers a full re-initialization of the sequence from step one.

  **The "Atomic Reset":** The specific event you described (dumping the coffee, restarting the drive, redoing the lab prep) is an **Atomic Reset**.

  #### Distinguishing it from related concepts:

  | Concept | Driver | Goal | Response to Interruption |
  | :--- | :--- | :--- | :--- |
  | **Habit Strength** | Frequency/Reward | Efficiency | Usually resumes or skips steps (sloppy automation). |
  | **Compulsion (OCD)** | Anxiety Reduction | Relief from Distress | Repeats specific actions until "feeling right," not necessarily from step 1. |
  | **Autopilot** | Low Attention | Conservation of Energy | Often continues blindly (e.g., driving past the pharmacy). |
  | **Procedural Atomicity** | **Structural Integrity** | **Sequence Validity** | **Hard Reset to Step 1.** |

  ### 3. Boundary Cases: When is it Rational vs. Rigid?

  You asked where to draw the line between this phenomenon and sensible caution. The boundary lies in **State Dependency**.

  *   **Rational Atomic Reset:** The success of Step 6 *depends* on the continuous, unbroken context of Steps 1–5.
      *   *Example:* In your lab worker's case, if Step 3 involves mixing a reagent that degrades after 30 seconds, and the interruption lasted 2 minutes, restarting is rational. The "state" of the materials has changed even if the "action" was completed.
      *   *Example:* In computer transactions, if Step 6 fails, you don't know if Steps 1–5 wrote partial data. Rolling back prevents corruption.
  *   **Rigid Procedural Atomicity:** The success of Step 6 is *independent* of the interruption, but the cognitive script demands a reset.
      *   *Example:* The coffee pour. The coffee grounds haven't changed because someone asked a question. The "reset" is purely to satisfy the cognitive script's requirement for an unbroken flow.
      *   *Example:* Driving past the pharmacy. The route is the same, but the "Drive to Work" atom fired, and the "Stop at Pharmacy" sub-routine couldn't inject itself into the atomic block.

  **The Test:** Ask, "If a robot did this, would it be a bug or a safety feature?"
  *   If the lab prep requires sterility, it's a safety feature.
  *   If the coffee pour requires only caffeine delivery, it's a bug (rigidity).

  ### 4. Implications for Free Will and Flexibility

  This is the most philosophically rich part of your observation. You noted that brilliant, flexible people still exhibit this rigidity. This complicates the "Free Will vs. Determinism" debate by suggesting that **agency is modular, not uniform.**

  **1. The "Delegated Agent" Theory**
  We tend to think of "Free Will" as a CEO sitting in the brain, micromanaging every action. Procedural Atomicity suggests the CEO is actually a **Fleet Admiral**.
  *   When you learn a routine well enough, you "delegate" it to a subordinate system (the basal ganglia/procedural memory).
  *   To save energy, the Admiral gives the subordinate a sealed order: "Execute Mission A."
  *   The Admiral does *not* maintain a live feed of every step. They only check for "Mission Complete" or "Mission Failed."
  *   **The Paradox:** You are *more* free overall because you offloaded the routine. If you had to consciously deliberate every step of the coffee ritual, you would have less brainpower for the "flexible arguments" your coworker is known for.
  *   **The Cost:** The subordinate cannot be negotiated with mid-stream. If you interrupt the subordinate, it doesn't know how to pause; it only knows how to report "Failure" to the Admiral, who then issues a new "Execute Mission A" order.

  **2. Rigidity as a Feature of Optimization**
  This suggests that rigidity and flexibility are not opposites on a single spectrum, but rather **trade-offs in different subsystems**.
  *   **High Flexibility:** Requires high cognitive load (Prefrontal Cortex).
  *   **High Efficiency:** Requires high rigidity (Basal Ganglia).
  *   A "brilliant" person is not someone who is flexible everywhere; it is someone who has successfully atomized the boring stuff (coffee, driving, standard prep) so they can reserve their flexibility for the hard stuff (emergencies, arguments, novel problems).
  *   **The Free Will Implication:** We are not "free" to act differently in the middle of an atomic routine without incurring a high "context-switching cost." Free will is the ability to *choose which routines to compile*, not necessarily the ability to edit them while they are running.

  **3. The "Compiled Code" Metaphor**
  Your intuition that the routine gets "compiled" is neurologically sound.
  *   **Interpreted Code:** Doing a task for the first time. Slow, flexible, editable line-by-line.
  *   **Compiled Code:** Doing a task after 1,000 repetitions. Fast, efficient, but if you corrupt the memory address (interruption), the program crashes and must be relaunched. You cannot "edit" compiled code while it is executing.

  ### Summary
  You have identified **Procedural Atomicity**. It is the cognitive equivalent of a database transaction rollback. It is distinct from habit (which is about initiation) and compulsion (which is about anxiety). It is the price we pay for efficiency: we gain the ability to function on autopilot, but we lose the ability to edit the script mid-scene. This suggests that "free will" is not a continuous state of control, but a periodic handoff between a flexible executive and rigid, compiled sub-routines.
