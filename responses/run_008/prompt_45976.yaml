answer: |-
  **Q&A Prep: Bell's Theorem & Locality**

  **1. The Senior Philosopher (High Damage)**
  **Objection:** "Jarrett's decomposition is mathematically valid but physically idle. If outcome dependence requires a preferred frame to explain the correlation (as in collapse models), you haven't saved locality, just renamed it. Parameter independence alone doesn't guarantee Lorentz invariance."
  **Reply:** I agree outcome dependence isn't *fully* local in a relativistic sense. My claim is narrower: it's a *weaker* breach than parameter dependence. Parameter dependence allows signaling; outcome dependence does not. Distinguishing them clarifies the metaphysical cost: one breaks relativistic causality, the breaks separability. We shouldn't lump them under one "nonlocal" label.
  **Consensus Status:** **Contested.** Shimony argued this saves "peaceful coexistence"; Maudlin and Albert argue it fails to save relativistic causality. Do not present this as settled.
  **Soft Spot:** Admitting collapse models often *do* require a preferred frame weakens the "locality salvage" claim.

  **2. The Dreaded Question (High Damage)**
  **Objection:** "You lean on outcome dependence in collapse theories. But in GRW/CSL, the collapse mechanism is explicitly nonlocal across spacelike separation. Doesn't your outcome-dependence story just collapse back into plain nonlocality once you ask what the dynamics actually do?"
  **Reply:** It depends on whether you define nonlocality by dynamics or signaling. Yes, the wavefunction update is global. But if that update cannot be exploited for signaling (due to randomness), the *operational* locality holds. My point is that 'nonlocality' conflates ontological holism with controllable action-at-a-distance.
  **Consensus Status:** **Minority View.** Most realists concede collapse models are nonlocal. Your distinction is philosophical, not physical.
  **Soft Spot:** Hard to deny the ontology is nonlocal even if the phenomenology isn't. This is your weakest technical flank.

  **3. The Quantum Optics Postdoc (Medium Damage)**
  **Objection:** "We close the freedom-of-choice loophole with cosmic photons. Unless you're a superdeterminist, measurement independence holds. Why should we take that escape seriously instead of accepting nonlocality?"
  **Reply:** I'm not endorsing superdeterminism, but mapping logical space. Bell tests rule out the *conjunction* of assumptions. Physicists treat Measurement Independence (MI) as data; it's actually an assumption about the universe's initial state. Even with cosmic RNGs, MI assumes no past common cause. Scrutinizing MI clarifies what Bell actually proves.
  **Consensus Status:** **Contested.** Consensus among experimentalists that MI is secure; live debate among foundational theorists (e.g., Hossenfelder).
  **Soft Spot:** Risks sounding like you're hiding behind unfalsifiability. Emphasize conceptual clarity over model endorsement.

  **4. The QI Grad Student (Low Damage)**
  **Objection:** "In quantum information, nonlocality is a resource. If you violate CHSH, you have nonlocal correlations. No-signalling is just a constraint on usage, not ontology. Why split hairs?"
  **Reply:** That's operational nonlocality. My claim is ontological. Operational nonlocality doesn't dictate *where* the ontology breaks (MI vs. Factorization). Distinguishing them matters for theory construction (e.g., Everett vs. Bohm), even if the CHSH value is the same.
  **Consensus Status:** **Consensus in QI, Contested in Foundations.** QI community treats operational nonlocality as the only game in town.
  **Soft Spot:** May seem irrelevant to their work. Frame it as interpretive clarity, not experimental critique.

  **General Note:**
  Do not claim "no-signalling implies locality." That is a minority view among realists. Claim instead that "nonlocality" is an umbrella term obscuring distinct metaphysical failures. If pressed on the Senior Phil's objection, concede that outcome dependence isn't *fully* local, but insist it's *distinct* from parameter dependence. That distinction is your core contribution.
