answer: |-
  You are right to feel that the slogan is doing "vibes work." Subsidiarity is one of those political concepts that sounds like a substantive rule but often functions as a rhetorical shield. Your housemate scored a hit on the "nested hierarchy" problem, but they may have missed that the principle is still useful if disaggregated.

  Here is the menu of distinct claims packed into "decisions should be made at the lowest possible level." I have evaluated each for truth value, applicability to your housing argument, and whether it relies on the assumption that jurisdictions stack neatly like Russian dolls.

  ### 1. The Procedural Presumption (Burden of Proof)
  *   **The Claim:** Centralization requires justification; decentralization is the default state. The burden lies on the higher level to prove why it *must* act, not on the lower level to prove it *can*.
  *   **Evaluation:** **Substantive and Defensible.** This is not a claim about outcomes, but about process. It prevents mission creep. It is not "false," but it is a rule of order, not a law of physics.
  *   **Application to Housing:** **Supports You.** You can argue: "I am not saying the federal government *cannot* solve housing; I am saying you haven't met the burden of proof that states *cannot*." This blocks a federal zoning mandate unless the feds demonstrate state failure. It allows federal building codes if you concede safety standards are a class of problem where the burden is met (e.g., interstate commerce or universal safety).
  *   **Hierarchy Assumption:** **Yes.** It assumes there is a clear "higher" and "lower" to whom the burden can shift.

  ### 2. The Epistemic Claim (Local Knowledge)
  *   **The Claim:** Information is contextual, tacit, and costly to transmit. Local actors possess specific knowledge (topography, neighborhood culture, specific demand) that central planners cannot aggregate without loss. (Hayekian).
  *   **Evaluation:** **Substantive and Defensible (with limits).** It is true that local knowledge exists. It is false to imply central planners are *blind*; they just have different data (macro trends).
  *   **Application to Housing:** **Supports You (on Zoning).** Zoning is highly contextual (sunlight, traffic patterns, neighborhood character). Federal zoning would inevitably be blunt. **Weakens You (on Codes).** Building codes rely on physics and engineering standards which are universal, not local. A beam holds the same weight in Ohio as in Oregon.
  *   **Hierarchy Assumption:** **No.** This is about information flow, not jurisdictional ladders. It applies even if the "levels" are messy (e.g., a watershed council vs. a city council).

  ### 3. The Preference Matching Claim (Tiebout Sorting)
  *   **The Claim:** People have heterogeneous preferences for public goods (schools, taxes, density). Decentralization allows jurisdictions to compete, letting people "vote with their feet" to find the bundle of policies they prefer.
  *   **Evaluation:** **Substantive and Defensible.** This is standard public choice economics. It fails only if mobility is zero (people can't move) or if there are monopoly conditions.
  *   **Application to Housing:** **Strongly Supports You.** Some communities want high density; others want single-family exclusivity. Federal zoning homogenizes this preference. Federal codes do not affect preference much (nobody "prefers" unsafe wiring).
  *   **Hierarchy Assumption:** **No.** This requires multiple *parallel* jurisdictions, not necessarily nested ones. It actually supports your housemate's critique if the "levels" don't allow for sorting (e.g., you can't move to a different federal zone).

  ### 4. The Accountability/Feedback Claim
  *   **The Claim:** Decision-makers should be physically and politically close to those who bear the consequences. Distance dilutes accountability; proximity sharpens the feedback loop.
  *   **Evaluation:** **Substantive and Defensible.** It is empirically easier to organize a city council recall than to influence HUD.
  *   **Application to Housing:** **Supports You.** If local zoning creates a crisis, the locals feel it immediately and can vote the council out. If federal zoning fails, the blame is diffuse ("Washington is broken").
  *   **Hierarchy Assumption:** **Yes.** Relies on clear lines of responsibility. If jurisdiction is overlapping/messy (as your housemate noted), accountability blurs regardless of level.

  ### 5. The Risk Containment Claim (Laboratories of Democracy)
  *   **The Claim:** Policy errors are inevitable. Decentralization confines the damage of error to a smaller population and allows for experimentation. Centralization correlates failure (if the feds get it wrong, everyone gets it wrong).
  *   **Evaluation:** **Substantive and Defensible.** Good for innovation; dangerous for rights. (You don't want "laboratories" experimenting with basic civil rights).
  *   **Application to Housing:** **Supports You.** A bad zoning experiment ruins one city. A bad federal zoning mandate ruins the national housing supply. Building codes are low-risk for experimentation (we know what safe looks like), so this claim doesn't protect them from federalization.
  *   **Hierarchy Assumption:** **Yes.** Assumes the "higher" level encompasses the "lower" levels such that failure propagates upward.

  ### 6. The "Effective Capacity" Claim (The Housemate's Reading)
  *   **The Claim:** "Lowest *possible*" means "lowest *capable*." If a problem structurally exceeds the resources or authority of the lower level (e.g., a river basin, a national housing shortage), the principle *demands* centralization.
  *   **Evaluation:** **Trivial / Tautological.** If "possible" means "capable of solving the problem," the slogan just means "decisions should be made by whoever can solve the problem." This empties the slogan of its libertarian/decentralist bite.
  *   **Application to Housing:** **Supports Housemate.** If the housing shortage is a macro-economic supply chain issue, states might be structurally incapable of fixing it, making federal action the "lowest *possible*" level.
  *   **Hierarchy Assumption:** **No.** This is the reading that handles the "river basin" critique best. It looks at functional scale, not political tiers.

  ---

  ### The "Nested Hierarchy" Problem
  Your housemate's strongest point was that problems don't come in jurisdictional sizes. This is the **Mismatch Problem**.

  *   **The Flaw:** Classic subsidiarity assumes political boundaries (City < State < Federal) align with problem boundaries (Neighborhood < Region < Nation).
  *   **The Reality:** A housing market is regional. A watershed is ecological. A supply chain is global.
  *   **The Fix:** If you want to use subsidiarity honestly, you must decouple "level" from "government tier."
      *   *Bad Subsidiarity:* "This must be done by the State because States are lower than the Feds."
      *   *Good Subsidiarity:* "This must be done by the smallest *functional unit* that can internalize the externalities."
      *   *In Housing:* If the externality of one town's exclusionary zoning is felt by the whole region's labor market, the "lowest level" is actually the **Region**, not the Town. If the externality is felt nationally (macro supply), the "lowest level" is the **Feds**.

  ### Verdict on Your Argument
  You can salvage your position, but you have to retreat from the slogan and advance the specific mechanism.

  1.  **Drop the slogan:** It invites the "lowest possible = tautology" counter.
  2.  **Adopt Reading #3 (Preference Matching) and #2 (Epistemic):** Argue that zoning is fundamentally about *local preference* and *local context*, whereas building codes are about *universal safety*.
  3.  **Concede the Hierarchy Point:** Acknowledge that if housing is a macro-economic supply crisis, states might be the wrong scale. However, argue that zoning is a *land-use* regulation, not a macro-economic lever.
  4.  **The Winning Distinction:** "Subsidiarity isn't about which government tier is smaller; it's about which scale matches the problem. Zoning is neighborhood-scale; Building Codes are physics-scale. Federalizing zoning is a scale mismatch; Federalizing codes is not."

  **Summary for your next conversation:**
  Tell your housemate: "You were right that 'lowest level' is vague if we just mean government tiers. But I'm using it as a **Preference Matching** principle, not a **Capacity** principle. I want zoning local because preferences for density vary by neighborhood. I'm fine with codes being federal because preferences for 'not dying in a fire' do not vary. The principle isn't 'smaller is better,' it's 'closer to the specific variation in human need is better.'"
