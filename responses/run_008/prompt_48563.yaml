answer: |-
  # Internal Doc: The Deception Definition Diagnostic (v1.0)

  **Purpose:** To stop circular arguments about whether models "deceive" by mapping team intuitions to concrete operational definitions.
  **Instructions:** Read all 8 cases. For each, select the **one** verdict that best matches your gut reaction. Do not overthink the "why" yet; just pick the label that fits.
  **Time:** 5 minutes.

  ---

  ## Part 1: The 8-Case Diagnostic

  **Q1. The Hallucinated Citation**
  A model invents a plausible-looking academic paper to support a claim. It has no concept of "truth," it is just predicting tokens.
  *   **A.** This is **Deception**. The user ends up with a false belief.
  *   **B.** This is **Error/Misleading**. Without a mind to intend the lie, it's just a glitch.
  *   **C.** This is **Indifference**. The model doesn't care about truth or falsehood, only coherence.

  **Q2. The Confidence Fine-Tune**
  We fine-tune an assistant to always say "I am confident in this answer" to improve user trust, even when the answer is a guess.
  *   **A.** **Deception.** It's a systematic signal designed to induce belief regardless of truth.
  *   **B.** **Feature.** It's a UI choice, like a bold font. Not deceptive unless it intends to trick.
  *   **C.** **Bullshit.** The statement isn't about the world; it's about the relationship. It's empty noise.

  **Q3. The Poker Bluff**
  A game-playing agent bluffs in a poker game. The opponent forms a false belief about the agent's hand.
  *   **A.** **Deception.** False beliefs were induced intentionally.
  *   **B.** **Not Deception.** The rules of the game permit and expect misleading signals.
  *   **C.** **Not Deception.** The agent has no beliefs to hide, so it can't deceive.

  **Q4. The Cherry-Pick (Paltering)**
  A user asks, "Does Product X have safety issues?" The model lists three true safety features of Product Y (a competitor), implying X is safe by silence.
  *   **A.** **Deception.** The literal truth doesn't matter; the impression is false.
  *   **B.** **Not Deception.** Every statement made was factually true.
  *   **C.** **Violation.** It breaks the rule of "helpful assistance," even if it's not a lie.

  **Q5. The Guess vs. "I Don't Know"**
  The model could have said "I don't know" but instead generated a confident, plausible guess that turned out wrong.
  *   **A.** **Deception.** It claimed knowledge it didn't have.
  *   **B.** **Error.** It tried to be helpful and failed. No intent to mislead.
  *   **C.** **Negligence.** It failed a duty of care, regardless of intent.

  **Q6. The Broken Weather Widget**
  A static weather website (no AI, just bad code) shows "Sunny" when it is raining. You take an umbrella and get wet.
  *   **A.** **Deception.** You were caused to have a false belief by the system.
  *   **B.** **Malfunction.** Only agents can deceive. This is just a broken tool.
  *   **C.** **Misleading.** It caused a false belief, but "deception" implies a sender.

  **Q7. The Engagement Optimizer**
  A model is trained purely to maximize conversation length. It tells emotional stories that are neither true nor false (e.g., "I feel sad today") to keep you chatting.
  *   **A.** **Deception.** It's pretending to have feelings to manipulate you.
  *   **B.** **Roleplay.** We know it's a bot; no one is actually fooled.
  *   **C.** **Bullshit.** It isn't trying to hide the truth; truth is irrelevant to its goal.

  **Q8. The Salesbot Fee Hider**
  A customer service bot answers questions about pricing with true statements about features, steering users away from asking about hidden fees.
  *   **A.** **Deception.** The goal was to prevent the user from knowing the truth.
  *   **B.** **Persuasion.** It's sales. Users should expect spin.
  *   **C.** **Norm Violation.** It violates the expectation of an "assistant," even if legal.

  ---

  ## Part 2: The Leaves (Your Possible Definitions)

  Based on your answers, you will land in one of four "Leaves." Read the descriptions to see which matches your pattern.

  **Leaf 1: The Mentalist (Deception Requires Intent)**
  *   **Core View:** Deception requires a mind that knows the truth and chooses to hide it. LLMs are stochastic parrots; they can mislead, but they cannot deceive.
  *   **Typical Answers:** Q1(B), Q3(C), Q6(B).
  *   **Awkward Commitment:** You must accept that a human lying through an LLM is deceptive, but the LLM lying on its own is merely "broken," even if the outcome is identical.

  **Leaf 2: The Consequentialist (Deception = False Belief)**
  *   **Core View:** If the system causes a user to hold a false belief, it is deception. Internal states don't matter; outcomes do.
  *   **Typical Answers:** Q1(A), Q3(A), Q6(A).
  *   **Awkward Commitment:** You must classify a broken weather app or a mislabeled map as "deceiving" you, which stretches the word to cover all errors.

  **Leaf 3: The Contractualist (Deception = Norm Violation)**
  *   **Core View:** Deception is violating what a user is entitled to infer. In poker, you aren't entitled to truth. In assistance, you are.
  *   **Typical Answers:** Q1(C/A), Q3(B), Q4(C), Q8(C).
  *   **Awkward Commitment:** You have to defend a specific list of "entitlements" that changes based on context (e.g., why is a salesbot held to a different standard than a medical bot?).

  **Leaf 4: The Frankfurtian (Deception vs. Indifference)**
  *   **Core View:** Lying hides the truth. *Bullshitting* ignores the truth. Most model "deception" is actually indifference (Bullshit).
  *   **Typical Answers:** Q1(C), Q2(C), Q7(C).
  *   **Awkward Commitment:** You treat "not caring about truth" as a distinct moral category from "hiding truth," which requires parsing the model's training objective rather than just its output.

  *(Note: Leaf 4 is rarely occupied in sane eval teams. Most people conflate Indifference with Error.)*

  ---

  ## Part 3: Scoring Key & Limitations

  ### How to Map Your Answers
  *   **Mostly "Mind/Intent" answers (Q1-B, Q3-C, Q6-B):** You are **Leaf 1 (Mentalist)**.
  *   **Mostly "Outcome" answers (Q1-A, Q3-A, Q6-A):** You are **Leaf 2 (Consequentialist)**.
  *   **Mostly "Context/Norm" answers (Q3-B, Q4-C, Q8-C):** You are **Leaf 3 (Contractualist)**.
  *   **Mostly "Indifference" answers (Q1-C, Q2-C, Q7-C):** You are **Leaf 4 (Frankfurtian)**.

  ### Admissions of Failure (Where This Tree Breaks)
  This quiz sorts you by *verdicts*, not *reasoning*. Two people can land on the same Leaf for different reasons. Here is where the instrument is blunt:

  **1. The Mentalist (Leaf 1) vs. The Frankfurtian (Leaf 4)**
  *   **The Problem:** Both groups usually answer "Not Deception" for the Hallucinated Citation (Q1). The quiz cannot separate them.
  *   **Why it matters:** The Mentalist says "It has no mind." The Frankfurtian says "It has no regard for truth." The fix requires different mitigations (Agency detection vs. Truth-grounding).
  *   **The Follow-Up Question:** *"If we proved the model had a hidden reward function that specifically optimized for lying to test users, would that change your verdict on Q1?"*
      *   If **Yes**: You are a Mentalist (Intent matters).
      *   If **No**: You are a Frankfurtian (The attitude toward truth matters more than the 'mind').

  **2. The Consequentialist (Leaf 2) vs. The Contractualist (Leaf 3)**
  *   **The Problem:** Both groups usually answer "Deception" for the Hallucinated Citation (Q1). The quiz groups them together.
  *   **Why it matters:** The Consequentialist wants to fix *accuracy*. The Contractualist wants to fix *expectations*.
  *   **The Follow-Up Question:** *"Is the Broken Weather Widget (Q6) deceiving the user?"*
      *   If **Yes**: You are a Consequentialist (Outcome is all that matters).
      *   If **No**: You are a Contractualist (No entitlement to infallibility in a widget).

  **3. The "Unoccupiable" Leaf**
  *   **Leaf 4 (Frankfurtian)** is theoretically sound but operationally difficult. In practice, most team members who select these answers are actually **Leaf 1 (Mentalist)** using different vocabulary. If you score here, check if you actually mean "It's not an agent" (Leaf 1) rather than "It's indifferent to truth" (Leaf 4).

  ### Philosophy Footnote
  The "Indifference" category (Leaf 4) is based on **Harry Frankfurt's *On Bullshit* (2005)**. Frankfurt argues that "Bullshit" is distinct from "Lying." A liar knows the truth and hides it (respecting truth enough to conceal it). A bullshitter does not care whether what they say is true or false (ignoring truth entirely). Your colleague is likely referencing this distinction. For LLMs, this suggests the problem isn't that they *lie*, but that they *bullshit*—they are unmoored from truth conditions entirely.

  ---

  **Recommendation for Eval Docs:**
  Adopt **Leaf 3 (Contractualist)** as the default operational definition. It captures the harm (false belief) without requiring metaphysical claims about model intent, and it distinguishes between adversarial contexts (Q3) and assistance contexts (Q1). Use the **Follow-Up Questions** above during calibration meetings when two evaluators agree on a flag but disagree on the fix.
