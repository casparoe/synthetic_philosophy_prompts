      *   *Best Decisive Case:* A case where the agent violates a norm, is *blameworthy*, but the outcome is *good*. (e.g., Sabotages a rival's project to help the company, succeeds, but sabotage is against rules).
      *   *Actually, the cleanest test:* **The Praiseworthy Norm Violation.** Agent breaks a trivial rule (knowingly) to achieve a great good. Agent is *praised*.
