      *   Actually, Case 4 (Style Guide) already hurts the pure Moral Valence theory. But it doesn't kill the Blame theory (maybe violating style guides is blameworthy in a lab context).
      *   To settle it: We need a case where Blame and Norm Violation come apart completely.
      *   *Decisive Vignette:* A case where a norm is violated knowingly, but the agent is *praiseworthy* (not blameworthy). If she says "Intentional," it's Norm Violation. If "Not," it's Blame. (Case B is close to this, but the "law" status complicates it).
      *   *Better Decisive Vignette:* A "Benevolent Norm Violation." Agent breaks a trivial rule to save a life. Indifferent to rule.
