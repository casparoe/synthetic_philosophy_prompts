prompt: |-
  You're an expert in experimental philosophy and philosophy of action, and you're helping me win an argument — so think carefully, start with a quick brainstorm of all the candidate rules that could fit the data below before committing to anything, and be upfront where you'd just be guessing.

  My colleague Dana runs an x-phi lab, and for years I've teased her that her intentionality judgments on side-effect cases are just blame judgments in a trenchcoat. She denies it. We've been cataloguing her verdicts on vignettes to work out what rule she's actually running, and I want to predict her answers before next week's lab meeting. Her track record so far (all are side effects the agent foresaw but did not aim at):

  1. Classic chairman case — program helps profits, harms the environment, chairman doesn't care one bit: intentional.
  2. Same vignette, side effect helps the environment: not intentional.
  3. Side effect is morally neutral (slightly boosts the subsidiary's paper sales), agent indifferent: not intentional.
  4. Side effect is violating the team's style guide — morally neutral, but a real rule everyone's expected to follow — and the team lead shrugs: intentional.
  5. Side effect violates a safety rule the agent genuinely didn't know existed: not intentional.

  The new cases for next week:

  A. The chairman harms the environment, but genuinely regrets it, spends real money trying to prevent it, and the harm happens anyway because prevention was expensive and only partly effective.
  B. A lab head in apartheid-era South Africa reorganizes her lab; a side effect is knowingly breaching the race-segregation regulations, which she doesn't care about — the breach isn't her goal, and she also thinks the regulations are evil.
  C. A side effect breaks a technical reporting rule while genuinely helping people; the agent is indifferent to the rule.

  Predict her verdict on each of A, B, and C. Then tell me: which rules does her track record actually support (norm-violation, blame-driven, moral valence, something else), which of those rules are already dead from verdicts 1–5, and do A–C really tell the surviving ones apart — which case does it best? Also flag the thing I keep suspecting: if the blame rule is keyed to Dana's own sense of what's blameworthy, then predicting her verdict on B requires predicting her politics, not her theory of intention. And if her track record underdetermines everything, tell me the further vignette that would settle whether I'm right that it's blame all the way down. Keep it honest — if some of these are coin flips, say which.
