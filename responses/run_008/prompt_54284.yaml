      *   *H3 (Norm Violation + Knowledge):* Fits 1 (Moral norm), 2 (No norm violated), 3 (No norm violated), 4 (Conventional norm violated), 5 (Norm violated but unknown). *Status: Strongest Survivor.*
      *   *H4 (Deep Self/Regret):* Data 1-4 show indifference. Case 5 is ignorance. We don't have a "Regret" case yet. *Status: Untested.*

  5.  **Predict Verdicts on A, B, C:**
      *   *Case A (Harm + Regret/Prevention):* Agent tries to prevent harm, fails, regrets it.
          *   *Blame Rule:* Less blame due to effort/regret. Might say "Not Intentional."
          *   *Norm Violation:* Norm violated (harm environment). Agent knew it. But attitude is opposition.
          *   *Deep Self:* Outcome contradicts agent's attitude.
          *   *Prediction:* **Not Intentional.** (Standard x-phi finding: counter-attitudinal side effects are less likely to be called intentional).
      *   *Case B (Apartheid Law Violation):* Agent breaches evil law, indifferent, thinks law is evil.
          *   *Blame Rule:* Dana (presumably progressive) won't blame her. Breaching apartheid law is *good*. So "Not Intentional."
          *   *Norm Violation:* A norm *is* violated (the law). But is it a *valid* norm? If the theory is "Violation of *legitimate* norms," then No. If it's "Violation of *existing* norms," then Yes.
          *   *Moral Valence:* Outcome is morally good (fighting apartheid). So "Not Intentional."
          *   *Prediction:* **Not Intentional.** (This is the "Reverse Knobe" or "Help" variant but with legal norms).
      *   *Case C (Technical Rule + Help + Indifference):* Breaks reporting rule (bad/conventional), helps people (good/moral). Indifferent to rule.
