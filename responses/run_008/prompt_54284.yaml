          *   *Correction:* Most Norm Violation theories in x-phi (like Hitchcock & Knobe) argue it's about *prescriptive* norms. Apartheid laws are prescriptive but immoral. Would Dana count them? If she's a standard liberal philosopher, she likely views them as illegitimate.
          *   *Prediction:* I need to be honest. Case B is risky because it conflates "Norm" with "Legitimate Norm."
      *   *Case A (Regret):* This tests the *attitude* condition. Knobe's later work suggests attitude matters. If she regrets it, it's less intentional.
      *   *Case C (Technical Rule + Help):* Similar to B but lower stakes.

