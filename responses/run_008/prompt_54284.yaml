  8.  **Drafting the Response:**
      *   *Tone:* Professional, analytical, slightly adversarial (helping win the argument), but philosophically rigorous.
      *   *Structure:*
          1.  Brainstorm of Rules.
          2.  Elimination Round (1-5).
          3.  Predictions (A, B, C) with confidence levels.
          4.  Analysis of A-C (Which kills what?).
          5.  The "Blame vs. Theory" Trap (Politics).
          6.  The Decisive Vignette.

  9.  **Refining the Analysis (Self-Correction during drafting):**
      *   *Wait, look at Case 4 again.* "Violating team's style guide... team lead shrugs: intentional." This is huge. It suggests *conventional* norms trigger intentionality, not just moral ones. This kills simple Moral Valence.
      *   *Look at Case 5.* "Didn't know [rule] existed: not intentional." This kills strict Strict Liability. Knowledge of the norm is required.
      *   *So the leading theory is:* **The Knowledgeable Norm Violation Hypothesis.** (Intentional = Foreseen + Known Norm Violation).
      *   *The Competitor:* **The Blame Hypothesis.** (Intentional = Foreseen + Blameworthy).
