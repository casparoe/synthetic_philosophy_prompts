  3.  **Brainstorm Candidate Rules (Theories of Intentionality):**
      *   *H1: The Blame Hypothesis (User's view).* Intentionality = Blame. If I want to blame you, I say you did it intentionally.
      *   *H2: The Moral Valence Hypothesis.* Bad outcomes = Intentional. Good/Neutral outcomes = Not Intentional.
      *   *H3: The Norm Violation Hypothesis (Cushman, Mele, etc.).* Intentionality is triggered by the violation of a relevant norm (moral or conventional), provided the agent knows the norm.
      *   *H4: The Deep Self/Attitude Hypothesis.* Intentionality depends on whether the outcome aligns with the agent's deep values/attitudes (indifference might count as alignment if the outcome is "acceptable" to them, but regret counts against).
      *   *H5: The Knowledge Condition.* You can't intentionally violate a norm you don't know exists.

  4.  **Evaluate Data 1-5 against Candidate Rules:**
      *   *H1 (Blame):* Fits 1 (blame), 2 (praise/neutral), 3 (neutral). Fits 4? Maybe, if violating style guide is blameworthy *enough*. Fits 5? No blame if ignorance is an excuse. *Status: Alive.*
