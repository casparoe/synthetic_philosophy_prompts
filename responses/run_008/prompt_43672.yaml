answer: |-
  # Seminar Simulation: The Criteria Trap
  **Instructor Guide & Materials Package**

  ## 1. Overview & Learning Objectives
  **Goal:** To demonstrate that the Criteria of Authenticity are not objective filters but interpretive tools that often reinforce the historian's prior assumptions.
  **Outcome:** Students will leave understanding that:
  1.  **Coherence** is often circular (we find what we expect).
  2.  **Multiple Attestation** fails if source independence is assumed rather than proven.
  3.  **Dissimilarity/Embarrassment** are subjective (embarrassing to *whom*?).
  4.  The "Historical Jesus" is often a reflection of the historian's profile.

  **Class Size:** 14 Students (4 Groups of 3–4).
  **Duration:** 3 Hours (including break).

  ---

  ## 2. Session Timeline

  | Time | Activity | Notes |
  | :--- | :--- | :--- |
  | **0:00–0:20** | **Introduction & Distribution** | Hand out Source Packets and Profile Cards. Emphasize secrecy. |
  | **0:20–1:20** | **Group Analysis (The "Grind")** | Groups evaluate the 20 items using their Profile + Criteria. |
  | **1:20–1:35** | **The Ledger (Voting)** | Groups place tokens on the whiteboard grid. |
  | **1:35–1:50** | **Break** | Essential for cognitive reset before debrief. |
  | **1:50–2:10** | **The Reveal (Data Comparison)** | Compare the four columns of votes. Highlight divergence. |
  | **2:10–2:40** | **The Trap (Debrief)** | Reveal source dependencies and profile bias. Map to real scholarship. |
  | **2:40–3:00** | **Closing Limitations** | Discuss the Synoptic Problem gap. Q&A. |

  ---

  ## 3. Student Instructions (Handout)

  **SEMINAR EXERCISE: THE FRAGMENTS OF J**
  **Confidential – Do Not Share Outside Your Group**

  **Mission:** You are a research team tasked with reconstructing the authentic voice of "J," a first-century Jewish teacher. You have been provided with a **Corpus of 20 Sayings** found across four ancient fragments (*Alpha, Beta, Gamma, Delta*).

  **Your Tools:**
  1.  **The Criteria:** Apply Dissimilarity, Embarrassment, Multiple Attestation, Coherence, and Semitisms as you have studied them.
  2.  **Your Working Hypothesis:** Your team has been assigned a specific historical profile for J. You must test the sayings against this profile. *Do not share your profile with other groups.*

  **Procedure:**
  1.  Read each Saying in the Source Packets. Note which sources contain it.
  2.  Discuss: Does this saying fit your Profile? Does it meet the Criteria?
  3.  Vote: For each Saying, place a colored token on the Class Ledger (Whiteboard).
      *   🟢 **Green:** Authentic (High Confidence)
      *   🟡 **Yellow:** Possible/Doubtful
      *   🔴 **Red:** Inauthentic (Later Invention)
  4.  **Rule:** You must justify every 🟢 with at least one specific Criterion.

  **Warning:** The sources are ancient and complex. Do not assume independence unless the text forces you to. Trust the data, not your intuition.

  ---

  ## 4. The Four Profile Cards (Secret)
  *Cut these out. Give one to each group. Do not let groups swap cards.*

  | **GROUP 1: THE APOCALYPTIC PROPHET** | **GROUP 2: THE CYNIC SAGE** |
  | :--- | :--- |
  | **Hypothesis:** J was an eschatological prophet like John the Baptist. He believed the world was ending soon. | **Hypothesis:** J was a wandering countercultural sage, similar to Greek Cynics. He challenged social norms. |
  | **Key Markers:** Look for urgency, judgment, fire, "Son of Man," cosmic upheaval, rejection of family for the sake of the End. | **Key Markers:** Look for wisdom aphorisms, nature metaphors, subversion of honor/shame, lack of apocalyptic threat, present-tense kingdom. |
  | **Bias Check:** Sayings that calm the apocalypse are likely later Church softening. | **Bias Check:** Sayings that sound too "Jewish" or "Religious" are likely later piety. |

  | **GROUP 3: THE MESSIANIC REVOLUTIONARY** | **GROUP 4: THE PHARISAIC REFORMER** |
  | :--- | :--- |
  | **Hypothesis:** J was a political liberator focused on Roman occupation. He was executed as a rebel. | **Hypothesis:** J was a Torah-observant Jew debating interpretation within Judaism. He was not anti-Law. |
  | **Key Markers:** Look for "Kingdom" as political, anti-Rome rhetoric, swords, liberation of captives, cleansing of Temple. | **Key Markers:** Look for halakhic debate, purity concerns, Sabbath interpretation, affirmation of Torah, "fulfilling" the Law. |
  | **Bias Check:** Sayings that advocate passivity ("turn the other cheek") are likely later pacifist editing. | **Bias Check:** Sayings that abolish purity/Torah are likely later Gentile Christian invention. |

  ---

  ## 5. The Invented Corpus & Source Sheets
  *There are 20 Sayings total. They are distributed across 4 "Source Sheets."*
  *Instructor Note: The text below is what the students see. The **Instructor Key** (Section 6) contains the hidden dependencies.*

  ### SOURCE ALPHA (The Earliest Fragment)
  *Language: Rough Greek, Semitic flavor.*
  1.  "The fox has a hole, the bird a nest; but the Son of Man has nowhere to lay his head."
  2.  "Repent, for the axe lies at the root of the tree."
  3.  "Do not think I came to abolish the Law, but to fill it to the brim."
  4.  "If your hand causes you to stumble, cut it off. Better maimed than whole in Gehenna."
  5.  "Give to Rome what is Rome's, and to God what is God's."
  6.  "Blessed are the poor, for yours is the Kingdom."
  7.  "I came not for the righteous, but for the sinners."
  8.  "The Sabbath was made for man, not man for the Sabbath."
  9.  "My mother and brothers are those who hear the Word."
  10. "Jerusalem, Jerusalem, killing the prophets."

  ### SOURCE BETA (The Scribe's Copy)
  *Language: Polished Greek.*
  1.  "The foxes have holes, birds nests; Son of Man has no place." *(Matches A1)*
  2.  "The axe is laid to the root." *(Matches A2)*
  3.  --
  4.  "Cut off the hand. Better to enter life maimed." *(Matches A4)*
  5.  "Render to Caesar..." *(Matches A5)*
  11. "The Kingdom is within you."
  12. "Love your enemies, pray for those who abuse you."
  13. "Not a sparrow falls without your Father."
  14. "I am the Light of the World."
  15. "Go nowhere among the Gentiles."

  ### SOURCE GAMMA (The Traveler's Log)
  *Language: Aramaic idioms preserved.*
  1.  "Foxes have lairs... Son of Man no resting place." *(Matches A1)*
  6.  "Blessed the poor in spirit." *(Varies from A6)*
  10. "Jerusalem, stoning those sent to her." *(Matches A10)*
  16. "The clean and unclean enter the Kingdom together."
  17. "Swear not at all. Let your Yes be Yes."
  18. "The Son of Man came to serve, not to be served."
  19. "Destroy this Sanctuary, and in three days I raise it."
  20. "Abba, Father, all things are possible to you."

  ### SOURCE DELTA (The Late Compiler)
  *Language: Theological Greek.*
  1.  "Foxes... Birds... Son of Man..." *(Matches A1/B1)*
  4.  "Cut off hand... enter Kingdom." *(Matches A4/B4)*
  5.  "Render to Caesar..." *(Matches A5/B5)*
  11. "Kingdom within." *(Matches B11)*
  14. "Light of the World." *(Matches B14)*
  16. "Clean/Unclean together." *(Matches G16)*
  21. "He who sees me sees the Father."
  22. "The bread that I give is my flesh."

  *(Note to Instructor: Students see 20 numbered items across the sheets. Some numbers repeat across sheets, indicating attestation.)*

  ---

  ## 6. Instructor Key (Hidden Dependencies & Traps)
  *Do not distribute. This is for your control of the debrief.*

  **The Source Genealogy (The "Multiple Attestation" Trap):**
  *   **Alpha** is treated as the "Independent Base."
  *   **Beta** is a direct literary dependence on **Alpha** (Items 1, 2, 4, 5 are copied/polished).
      *   *Trap:* Students see Item 1 in Alpha, Beta, Gamma, Delta. They think "4 Sources!" Actually, Beta and Delta copied Alpha. Gamma is the only true independent witness for Item 1.
  *   **Gamma** is independent of Alpha/Beta *except* for oral tradition overlap.
  *   **Delta** is a late compilation of **Beta + Gamma**.
  *   **Result:** "Multiple Attestation" is largely illusory in this corpus. Only Items 6, 10, 16 have true multi-source independence.

  **The Criteria Traps (Baked into Sayings):**
  *   **Item 1 (Foxes/Nests):** *Semitism + Multiple Attestation.* Fits Cynic (homelessness) AND Apocalyptic (wandering end-times). Groups will fight over Coherence.
  *   **Item 2 (Axe/Root):** *Apocalyptic.* Clear for Group 1. Group 2 (Cynic) must vote Red (too violent/eschatological). Group 4 (Pharisaic) votes Red (not Torah-focused).
  *   **Item 5 (Rome/Caesar):** *Revolutionary Trap.* Group 3 (Revolutionary) might vote Red (too accommodating to Rome) using Dissimilarity (Early Church would invent submission). Group 4 votes Green (fits Torah obligation).
  *   **Item 11 (Kingdom Within):** *Gnostic/Church Trap.* Group 1 (Apocalyptic) votes Red (Kingdom is future, not internal). Group 2 votes Green.
  *   **Item 16 (Clean/Unclean):** *Embarrassment Trap.* Group 4 (Pharisaic) votes Red (Too embarrassing for a Torah-observant Jew). Group 2 votes Green.
  *   **Item 19 (Destroy Sanctuary):** *Embarrassment.* Fits Revolutionary (Group 3) and Apocalyptic (Group 1). But embarrassing for Group 4 (Reformer).

  ---

  ## 7. Voting Mechanism: The Public Ledger
  **Setup:** Draw a grid on the whiteboard before class.
  *   **Rows:** Saying Numbers 1–20.
  *   **Columns:** Group 1, Group 2, Group 3, Group 4.

  **Materials:** Magnetic tokens or sticky notes in Green, Yellow, Red.
  **Process:**
  1.  After the 1-hour analysis, call a "Moratorium on Discussion."
  2.  One representative from each group comes to the board simultaneously.
  3.  They place their tokens for all 20 items.
  4.  **Result:** You will see vertical columns of color that diverge wildly on specific items (e.g., Item 2 might be all Green for Group 1, all Red for Group 2).

  ---

  ## 8. Debrief Script & Mapping
  *This is the critical teaching moment. Do not lecture; ask questions based on the Ledger.*

  **Phase 1: The Divergence (15 mins)**
  *   **Point to Item 2 (The Axe):** "Group 1, why Green? Group 2, why Red?"
      *   *Expected:* Group 1 says "Apocalyptic Coherence." Group 2 says "Dissimilarity from Wisdom tradition."
      *   *Lesson:* **Coherence is Circular.** You authenticated this because it fit the profile I gave you, not because the text forced it.
  *   **Point to Item 5 (Rome/Caesar):** "Group 3, you voted Red. Why?"
      *   *Expected:* "A revolutionary wouldn't tell people to pay Rome."
      *   *Lesson:* **Dissimilarity is Subjective.** You assumed a Revolutionary Jesus *wouldn't* say this. But if he *did*, it would be embarrassing to the later Church (making it authentic by Embarrassment). You prioritized your Profile over the Criterion of Embarrassment.

  **Phase 2: The Source Trap (15 mins)**
  *   **Reveal:** "Look at Item 1. It appears in Alpha, Beta, Gamma, Delta. Four sources. Multiple Attestation, right?"
  *   **Drop the Bomb:** Show the Genealogy Diagram (Alpha -> Beta -> Delta).
  *   **Lesson:** **Multiple Attestation requires Source Independence.** If Beta copied Alpha, that's not two witnesses; that's one witness echoing. In real scholarship, we argue about Q vs. Mark constantly. You assumed independence because I didn't tell you otherwise. That is the danger of the criterion.

  **Phase 3: The "Authentic" Fiction (10 mins)**
  *   **Reveal:** "None of these sayings are real. I wrote them all last night."
  *   **Question:** "Yet, you found 'Semitisms' (Item 1), 'Embarrassment' (Item 19), and 'Multiple Attestation' (Item 1). How did a fake corpus pass the criteria?"
  *   **Lesson:** The Criteria are **Necessary but not Sufficient.** They can filter out obvious anachronisms, but they cannot guarantee authenticity. A skilled forger (or the early Church) could write sayings that meet all five criteria.

  ---

  ## 9. Predicted Pitfalls & Mitigation

  | Pitfall | Prediction | Mitigation |
  | :--- | :--- | :--- |
  | **"This is Fake"** | Students dismiss the exercise because they know the sayings are invented. | **Reframe:** "The real Gospels are also texts written by believers. The question is whether *our methods* can distinguish history from theology. If the method works on my fake text, the method is broken." |
  | **Profile Leakage** | Groups compare Profile Cards during the break. | **Instruction:** Explicitly forbid sharing profiles until the Debrief. Frame it as "Blind Peer Review." |
  | **Dominant Voices** | One student in each group does all the work. | **Roles:** Assign roles in the Instructions: *Scribe* (records votes), *Critic* (must argue against the majority), *Timekeeper*. |
  | **Cynical Voting** | A group decides the game is rigged and votes randomly. | **Instructor Patrol:** Circulate during the 1-hour work session. If a group disengages, remind them: "The goal is to test the *method*, not to win." |
  | **Source Confusion** | Students get lost in the 20 items/source overlap. | **Visual Aid:** Provide a checklist grid on the Source Sheets so they can tick off where each saying appears easily. |

  ---

  ## 10. Closing Note: The Real-World Gap
  *Deliver this in the final 10 minutes.*

  **The Limitation of the Simulation:**
  "In this exercise, I gave you **Source Alpha**. I gave you the text. In the real Historical Jesus quest, we do not have 'Source Alpha.' We have the Gospel of Mark. We have Q (reconstructed). We have John."

  **The Synoptic Problem Connection:**
  "The biggest limitation of this activity is that the source dependencies were *hidden* but *fixed*. In reality, we don't know the dependencies. We argue whether Mark used Q, or Q used Mark, or if they are independent.
  *   **Real World Application:** When scholars argue for the authenticity of the 'Kingdom of God' sayings, they rely on Multiple Attestation (Mark + Q + John + Paul). But if John depends on the Synoptics, or if Paul depends on oral tradition that depends on Mark, the 'independence' collapses."

  **Final Takeaway:**
  "The Criteria of Authenticity are not a metal detector that beeps when it finds gold. They are a set of arguments. Today, you saw how four reasonable teams, using the same arguments on the same data, built four different Jesuses. That is the state of the Quest. Your job as historians is not to find the 'right' Jesus, but to be honest about which profile *you* are bringing to the text."

  ---

  ## 11. Materials Checklist for Instructor
  1.  **14 Copies** of Student Instructions.
  2.  **4 Sets** of Source Sheets (Alpha, Beta, Gamma, Delta) – *Print on different colored paper for each group to prevent accidental mixing.*
  3.  **4 Profile Cards** (cut out).
  4.  **Token Set:** ~60 Green, 60 Yellow, 60 Red (stickers or magnets).
  5.  **Whiteboard:** Pre-drawn 20x4 Grid.
  6.  **Instructor Key:** Printed for your reference during debrief.
  7.  **Projector:** For the "Source Genealogy" reveal in the debrief.
