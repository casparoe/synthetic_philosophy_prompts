answer: |-
  1. The species category is the universal rank or concept (what it means to be a species), whereas species taxa are the particular historical lineages or groups that fall under that rank (e.g., *Homo sapiens*). Confusion arises when ontological claims about the nature of particular taxa (individuals vs. classes) are mistaken for claims about the uniformity of the category across the tree of life.

  2. These cases are ubiquitous because they stress-test the necessary conditions of category definitions, acting as genuine counterexamples to monistic definitions that require strict reproductive continuity or discrete clustering. Distinguishing edge cases from refutations depends on whether the definition is prescriptive (excluding the anomaly) or descriptive (forcing the anomaly into the box), which most papers conflate.

  3. A robust monist can argue that the species category is real but not universal, conceding that some lineages (like obligate asexuals) simply do not form species taxa without collapsing the category itself. This preserves the category as a natural kind for sexual lineages while treating exceptions as ontological gaps rather than definitional failures.

  4. Pluralism asserts multiple legitimate species concepts coexist because different biological processes generate distinct kinds of taxa, whereas eliminativism claims the category itself is so disjunctive that it refers to nothing real at all. The key difference is that pluralists still believe "species" picks out natural units, just heterogeneous ones, while eliminativists view the term as a purely pragmatic convenience with no ontological grounding.

  5. This case pressures the category question most severely because it decouples the lineage from the biological processes (like mating or morphology) usually used to define the rank, leaving only a genetic cluster. It challenges whether a taxon can exist without the processes that supposedly constitute the category, suggesting the category might be an epistemic artifact rather than an ontological reality.
