answer: |-
  **Situation One: The Key in the Lock**

  The Reader brings a collection of obscure, difficult verses to the Poet. She has struggled with them for weeks; the syntax is fractured, the imagery opaque. She feels nothing but confusion. The Poet takes the book, turns to a specific page, and says, "Do not read for the sentence. Read for the breath. The line breaks are not grammatical; they are respiratory. She is writing from inside a lung disease."

  The Reader takes the book back. She does not simply accept the verdict that the poems are masterpieces. Instead, she accepts the *framework* the Poet has offered. She reads the lines again, listening for the gasp, the interruption, the struggle for air. Suddenly, the fragmentation makes sense. The awkwardness resolves into a mimicry of suffering. She now sees the beauty that was previously invisible to her. Her judgment that the work is successful is based on her own perception, but that perception was made possible only by the Poet's testimony. The Poet did not just tell her *that* it was good; she transmitted the *condition* under which the goodness becomes visible. The Reader possesses knowledge because she now understands the principle that makes the value real, a principle she acquired solely through the Poet's word.

  **Situation Two: The Label on the Box**

  Years later, the Reader falls in love with a lush, romantic novel. She is midway through when she mentions it over dinner. The Poet sets down her fork. "It's sentimental," she says. "The emotion is unearned." The Reader asks how. The Poet shrugs, a gesture of pure sensibility. "You'll see it eventually. It's just cheap."

  The Reader trusts the Poet more than herself. She closes the book. She does not finish it. She tells her friends, "It was sentimental," and "The emotion was unearned." She holds these judgments as true. Yet, when she recalls the scenes that made her weep, she still feels the swell of tears. She cannot locate the cheapness. She cannot point to the specific sentence where the emotion became unearned. She possesses the verdict without the vision. She has a belief she is socially entitled to hold because of her proximity to the Poet, but she cannot defend it in a court of aesthetic reason, nor can she fully reconcile it with her own experience. She knows *that* the Poet thinks it is bad, but she does not know *that* it is bad.

  ***

  **For Your Desk**

  These two scenes are designed to pressure the assumption that aesthetic judgment is always a private, non-transferable sensation. The first situation suggests that testimony *can* yield knowledge when it transmits the concepts or contexts necessary to perceive the value itself; here, the testimony acts as a key that unlocks the Reader's own capacity to see, making the knowledge genuinely hers. The second situation concedes the pessimist's point: when testimony offers only a verdict without the tools to verify it, it produces a hollow belief—a label pasted over an experience that contradicts it. Together, they argue that the problem is not testimony itself, but whether the testimony is *explanatory* (granting access to the grounds of judgment) or merely *authoritative* (demanding deference without understanding). The opposing view will still reply that even in the first case, the Reader only knows the *reasons* for the value via testimony, not the value itself, which must always be felt to be known. Your task is to dramatize whether that final gap—between understanding the reason and feeling the value—actually matters to a life lived in art.
