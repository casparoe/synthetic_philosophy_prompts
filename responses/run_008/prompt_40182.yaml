answer: |-
  It is quite clear your friend is operating as a committed proponent of the Extended Mind Thesis (EMT), specifically leaning towards Andy Clark's later refinements rather than the strict 1998 original. Her verdicts display a consistent pattern, but as you have spotted, there is a subtle tension in the criteria she is applying. Based on her track record, we can distil two candidate rules that fit her past judgements equally well but diverge on your new cases.

  ### The Candidate Rules

  **Rule 1: The 'Glue and Trust' Criterion (Broad Functionalism)**
  This rule follows Clark's later work. It posits that if an external resource is reliably available, easily accessible, and—crucially—automatically endorsed without critical scrutiny, it constitutes part of the cognitive system. The medium (paper, silicon, or another person) does not matter, nor does the specific cognitive function (memory, navigation, or calculation), provided the 'coupling' is tight enough.
  *   *Fits the track record:* Explains Otto (notebook), Phone Notes, and the Wife (social resource). Explains the GPS rejection (lack of automatic endorsement/override) and the Tourist (lack of constant coupling).

  **Rule 2: The 'Doxastic Repository' Criterion (Narrow Storage)**
  This rule is more conservative. It suggests that the mind only extends into external *stores of dispositional belief*. It distinguishes between *storage* (holding information over time) and *processing* (manipulating information). On this view, a notebook stores beliefs, but a calculator performs operations; the former can be part of the mind, the latter is merely a tool, however trusted.
  *   *Fits the track record:* Explains Otto and Phone Notes (belief storage). Explains the Wife (she acts as a biological hard drive for his social facts). Explains the GPS and Tourist rejections (neither constitutes a stable store of his beliefs).

  ### Predictions for the New Cases

  **1. The Calculator Guy**
  *   **Rule 1 (Glue and Trust):** **Extended.** He relies on it reflexively, trusts it implicitly, and it is constantly available. It plays the functional role of his arithmetic cognition.
  *   **Rule 2 (Doxastic Repository):** **Not Extended.** A calculator is a processor, not a repository. It does not hold his beliefs; it generates outputs from inputs. Even if he trusts it, it remains a tool, akin to a very reliable abacus, rather than a part of his mind.

  **2. The Fridge List Couple**
  *   **Rule 1 (Glue and Trust):** **Extended for Both.** The list meets all criteria for both agents. It is the single source of truth, constantly consulted and updated.
  *   **Rule 2 (Doxastic Repository):** **Extended for Both (with caveats).** The list stores beliefs (items to buy). However, this rule struggles with the *individuation* of the mind here.

  ### My Best Guess

  I reckon your friend will say **yes to the Calculator Guy** and **yes to the Fridge List for both partners.**

  Here is why: The 'Wife' case is the tell. In that scenario, she accepted that another human being could constitute part of her friend's mind. This suggests she is a 'Bold Externalist'. If she is willing to accept a wife as a cognitive resource, she is unlikely to draw the line at a calculator simply because it performs calculations rather than storing memories. The 'Doxastic Repository' rule is usually favoured by critics of the extended mind (like Adams and Aizawa), not by proponents. Since she is handing out verdicts *for* extension, she is likely running the 'Glue and Trust' rule. She prioritises the *reliability and integration* of the resource over the specific type of cognitive labour it performs.

  ### Where the Rules Go Silent

  The Fridge List case exposes a significant silence in both rules regarding **individuation**.

  The original Extended Mind Thesis is designed to explain the boundaries of a *single* agent's mind. Otto's notebook belongs to Otto. In the Wife case, your friend managed to preserve individuality: it was *his* mind extending into *her* (asymmetric dependency).

  The Fridge List is symmetric. Both agents contribute to it and rely on it equally.
  *   **The Silence:** The rules tell us the list is *a* cognitive resource, but they do not tell us whose mind it is part of. Is it part of his mind? Her mind? Or does the couple now constitute a single 'group mind'?
  *   Rule 1 says it's part of the 'system', but fails to specify how many minds are present in that system.
  *   Rule 2 says it holds beliefs, but fails to specify whose beliefs they are when the list is a joint product.

  Your friend might find herself stammering here, forced to admit that the list is part of a *shared* cognitive system, which is a step further than Clark and Chalmers originally ventured.

  ### The Tie-Breaker Case

  To definitively distinguish whether she is running Rule 1 (Broad Functionalism) or Rule 2 (Narrow Storage), you should present her with the following case:

  **The Human Calculator:**
  > "Imagine a bloke who is hopeless at arithmetic. He has a mate, Dave, who is a mathematical savant. Whenever the bloke needs to work out a tip or split a bill, he asks Dave. Dave answers instantly. The bloke never questions Dave, treats the answer as gospel, and has done this for years. Dave is as reliable and accessible as the phone calculator."

  *   **If she says Extended:** She is following **Rule 1 (Glue and Trust)**. She accepts that *processing* can be extended, and that *social agents* can serve as processors, not just memory stores.
  *   **If she says Not Extended:** She is likely following **Rule 2 (Doxastic Repository)** or a hidden 'Non-Human' constraint. She might argue that Dave is an independent agent with his own beliefs, not a passive resource like a notebook. This would distinguish 'using a person as a tool' (Wife case = storage) from 'using a person as a processor' (Dave case = calculation).

  Given her verdict on the Wife, I suspect she will say 'Extended', confirming she is a thoroughgoing functionalist. But the Fridge List will remain the sticky wicket where her theory meets the problem of shared identity.
