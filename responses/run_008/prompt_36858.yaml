answer: |-
  # MoralMatch™ Help Center

  Welcome to MoralMatch™, the world's first peer-to-peer marketplace for ethical arbitrage. Below you will find answers to common questions regarding portfolio optimization, trade execution, and conscience management.

  ## Getting Started

  **How do I maximize my moral surplus?**
  Efficiency is generated when parties value actions differently. To optimize your utility output, we recommend seeking counterparts with maximally divergent value matrices. If you prioritize animal welfare and your counterparty prioritizes poverty alleviation, you can generate surplus by swapping meat abstention for charitable donations. Please update your profile to indicate openness to befriending ideological opponents; our algorithm prioritizes matches with high value-dissonance scores.

  ## Making Your First Trade

  **How are exchange rates calculated between incompatible goods?**
  Our proprietary Utility Conversion Engine (UCE) normalizes disparate commitments into standard Moral Units (MUs). For example, one month of veganism may trade at 450 MUs, while one hour of pro-bono legal work trades at 50 MUs. Exchange rates fluctuate based on market liquidity and the intensity of your stated preference. Please note that listing a commitment for trade often clarifies its true market value; some users discover during the listing process that their asking price exceeds what they are willing to accept, at which point the listing fee is non-refundable.

  **Can I trade my roommate's recycling habits?**
  No. MoralMatch™ facilitates trades only between account holders regarding their own actionable commitments. Third-party interests are not tradable stock. You cannot bargain away the welfare, behavior, or rights of non-consenting entities, including neighbors, family members, or future generations. Attempts to list unauthorized assets will result in immediate suspension. Please ensure you have full sovereignty over any moral inventory you list.

  ## Troubleshooting

  **I changed my mind about a commitment after listing it. Why was I charged?**
  Value drift is a known variable in long-term ethical contracting. When you list a commitment, you are selling a future action performed by your future self. If your values evolve post-transaction, this constitutes a breach of contract unless you have subscribed to MoralMatch™ Premium. Premium users access ConscienceLock™, which places your commitments in escrow during a mandatory cooling-off period. Standard users are liable for performance regardless of personal growth. We recommend purchasing Value Drift Insurance to hedge against reflection-induced volatility.

  ## Account Limits

  **Why was my trade reversed after I fulfilled my end?**
  Our post-trade audit detected a latent scruple in your account profile. This occurs when a user successfully completes a trade but subsequently experiences emotional distress indicating they retained an unlisted attachment to the traded behavior. While the transaction was technically valid, the system flags this as a integrity risk. *This is currently our most common support request; please note that trading away a scruple you didn't know you still had invalidates the surplus.*
