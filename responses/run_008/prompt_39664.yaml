answer: |-
  This is a sophisticated package, essentially attempting to marry a **Bernard Williams-style Internalism** (1) with a **Rawlsian Practice Conception of Rules** (3 & 4) and a **robust deontological intuition** about promising (2 & 5).

  You are right to suspect trouble. While (3), (4), and (5) hang together relatively well (this is essentially the position in Rawls's "Two Concepts of Rules"), **(1) and (2) are in direct logical conflict**, and **(4) undermines (2) in your specific edge cases.**

  Here is the consistency check, ordered by severity of tension, with proposed revisions and their philosophical costs.

  ---

  ### 1. The Fatal Tension: Humean Internalism vs. Reason-Creation
  **Conflict:** (1) vs. (2)
  **Severity:** **Critical**

  *   **The Problem:** Commitment (1) states that reasons must hook into your "Subjective Motivational Set" (SMS)—your existing desires, ends, or concerns. Commitment (2) states that promising creates a reason *ex nihilo* ("did not exist a moment before") that binds *even when cutting against all your interests.*
  *   **The Contradiction:** If the reason binds even when it cuts against *all* your interests/concerns, then by definition it does not connect to your SMS. If it *does* connect to your SMS (e.g., you have a standing desire to keep promises), then the promise itself didn't create the reason; your pre-existing desire did. The promise was merely the trigger.
  *   **The "Dead Promisee" Stress Test:** In your case (promisee dead, no witnesses), you have no prudential interest (reputation, reciprocity) and no emotional interest (pleasing the friend). The *only* way (1) is satisfied is if you have a fetishistic, standing desire to "follow the rules of promising." But if you lack that desire, (1) says you have no reason. (2) says you *do* have a reason. One of these must be false.
  *   **What Has to Give:**
      *   **Option A (Drop 1):** Accept Externalism. Reasons can exist independently of your desires.
          *   *Cost:* You lose the naturalistic, anti-metysical appeal of Humeanism. You must explain how these "external" reasons motivate (the "queerness" objection).
      *   **Option B (Drop 2):** Promises don't create reasons; they activate standing desires (to be trustworthy, to participate in the practice).
          *   *Cost:* You lose the robustness of the obligation. If an agent lacks the standing desire (the "amoralist" or "shoemaker"), they are not obligated. You cannot say they *ought* to keep the promise, only that they ought *if* they want to participate in the practice.
      *   **Option C (Stretch 1):** Argue that participating in the social practice (3) *constitutes* a new desire/end.
          *   *Cost:* This stretches "Humean" to the breaking point. Williams would argue you can't reason yourself into a new basic desire just by invoking a rule.

  ### 2. The Justificatory Tension: Genealogy vs. Normative Force
  **Conflict:** (4) vs. (2)
  **Severity:** **High**

  *   **The Problem:** Commitment (4) vindicates the practice via mutual benefit (a functionalist/utilitarian genealogy). Commitment (2) insists on obligation in cases where *no benefit exists* (dead promisee, no witnesses).
  *   **The Contradiction:** If the *ground* of the obligation is the practice, and the *point* of the practice is mutual benefit, then in instances where mutual benefit is impossible, the normative force should dissipate. Why does the "chess rule" bind me when I'm playing alone against a dead opponent?
  *   **The Tension:** (4) explains why *we* have the practice, but it struggles to explain why *I* am bound in a specific instance that contributes nothing to the practice's utility (since no one knows I broke it).
  *   **What Has to Give:**
      *   **Option A (Modify 4):** The practice is not just mutually beneficial; it is constitutive of moral agency or autonomy (Kantian shift).
          *   *Cost:* You move away from the Humean/Rawlsian functionalism toward a more metaphysical account of agency.
      *   **Option B (Modify 2):** Admit that in "dead promisee" cases, the obligation is weaker or derivative (e.g., maintaining one's own integrity) rather than a direct duty to the promisee.
          *   *Cost:* You lose the intuition that the duty is *to the other person* specifically. It becomes a duty to oneself.

  ### 3. The Apparent Tension: Practice Rules vs. Self-Interest
  **Conflict:** (3) & (5) vs. (1)
  **Severity:** **Low (Manageable)**

  *   **The Problem:** It might look like (3) (rules constitute the obligation) and (5) (not self-interest) conflict with (1) (must serve my concerns).
  *   **Why it's only apparent:** You can resolve this by positing a "standing concern" in your SMS for *fairness* or *participation in cooperative schemes.*
  *   **The Fix:** As long as you have *some* desire to be a participant in the practice of promising, (1) is satisfied. The reason isn't "self-interest" in the crude sense (5), but it is still "internal" because it serves your desire to be a certain kind of agent.
  *   **The Catch:** This only works if you *have* that desire. This loops back to the Fatal Tension above. If you lack the desire to participate, the Humean says you are off the hook. The Practice Conception says you are not.

  ---

  ### Recommended Revision Strategy

  To save the position for a reading group, you need to decide which philosophical "hill you want to die on." Here are the three most coherent packages you can assemble from your five points, ranked by how much revision they require.

  #### 1. The "Rawlsian" Revision (Drop/Modify 1)
  *   **Keep:** (2), (3), (4), (5).
  *   **Revise:** (1).
  *   **New (1):** "I am a *moderate* internalist. Reasons generally connect to desires, but participation in constitutive social practices can generate obligations that transcend immediate subjective interests."
  *   **Cost:** You are no longer a strict Humean. You are closer to Rawls or Scanlon. You must answer the "Why be moral?" question without relying solely on the agent's existing psychology.
  *   **Verdict:** **Most Philosophically Robust.** This is the standard "Practice Conception" view. It handles the dead promisee case best.

  #### 2. The "Humean Convention" Revision (Drop/Modify 2)
  *   **Keep:** (1), (3), (4), (5).
  *   **Revise:** (2).
  *   **New (2):** "Promising creates a reason *conditional on* my desire to participate in the practice. It feels reason-creating, but it is actually reason-revealing. If I truly have no concern for the practice or the promisee, I have no reason."
  *   **Cost:** You lose the "categorical" feel of promissory obligation. You must admit that the amoralist who doesn't care about the practice is not irrational for breaking promises, merely non-compliant.
  *   **Verdict:** **Most Consistent with (1).** This is the Lewis/Game-Theoretic view. It is internally consistent but normatively weaker.

  #### 3. The "Integrity" Revision (Modify 4 & 2)
  *   **Keep:** (1), (3), (5).
  *   **Revise:** (2) & (4).
  *   **New (2):** "Promises bind because breaking them violates my own integrity (a concern I have), not because of the practice itself."
  *   **New (4):** "The practice exists for mutual benefit, but *my obligation* comes from my commitment to consistency."
  *   **Cost:** You shift the ground from "obligation to others" to "obligation to self." This changes the moral phenomenology of promising.
  *   **Verdict:** **Best Compromise.** It keeps Internalism (1) and Anti-Instrumentalism (5) by locating the reason in a high-order desire for integrity.

  ### Summary Advice for the Reading Group
  If you send the statement as is, the first question you will get is: **"On what Humean principle does the dead promisee case hook into your Subjective Motivational Set?"**

  If you answer "It doesn't, but I'm bound anyway," you've abandoned (1).
  If you answer "It hooks into my desire to be a promise-keeper," you've weakened (2) (the promise didn't create the reason; the desire did).

  **My suggestion:** Adopt **Revision 1**. It is better to be a clear Rawlsian than a confused Humean. The "Practice Conception" (3) was designed specifically to solve the problems in (2) and (5), but it was never intended to be compatible with strict Humean Internalism (1). Drop (1)'s strict "nothing from nowhere" clause and replace it with a claim about the normativity of social participation.
