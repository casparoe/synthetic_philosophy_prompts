answer: |-
  Dear colleague,

  It is a pleasure to engage with this puzzle, not least because Dana's silence is often more telling than most people's arguments. You are right to suspect that her acceptance of the Puritan case is not a blank check for cultural explanation but rather a specific endorsement of a particular kind of causal mechanism. If we look closely at her track record, specifically the hints she drops alongside her verdicts, we can reconstruct at least three distinct rules she seems to be applying. These rules are not mutually exclusive, and indeed they overlap significantly in the cases she has already settled, which is why her position has seemed consistent until now. The Quaker case is fascinating precisely because it is the first time these rules might diverge, forcing us to see which one is actually driving her judgments.

  The first candidate rule is what we might call the Incentive Compatibility Constraint. This rule holds that cultural explanations are invalid if the behavior in question can be fully explained as a rational response to material incentives. This fits her rejection of the Japanese corporate culture claim perfectly. When she says that for every loyal worker there is a seniority pay scale, she is arguing that the loyalty is purchased, not culturally inspired. The behavior is incentive-compatible. It also fits her rejection of the Confucian case, though less explicitly. If she believes that the Chinese state structure created material incentives that discouraged capitalist investment regardless of values, then the Confucian ethic is epiphenomenal. It fits the Puritan case because asceticism is, in a standard hedonic sense, costly. Saving money rather than consuming it, working hard without enjoying the fruits, contradicts immediate material self-interest unless driven by something deeper like religious anxiety. Applied to the Quakers, this rule predicts a rejection. Your student's mechanism relies on honesty facilitating trade. In a world of weak contract enforcement, honesty is a profitable strategy. It lowers transaction costs and builds a valuable brand. If the Quaker merchant is being honest because it pays better than cheating, Dana will likely view this as rational choice, not cultural causation.

  The second candidate rule is the Temporal Exogeneity Constraint. This rule demands that the cultural trait must clearly predate the economic outcome and cannot be plausibly viewed as an adaptation to it. This is the direct reading of her mutterance on the Italian case: cause or consequence? If amoral familism is a rational adaptation to poverty and a lack of state protection, then it is a consequence of underdevelopment, not the cause. This rule fits the Puritan case because Weber's argument rests on the ethic emerging before the full bloom of capitalism. It also fits her rejection of the Confucian case if she views Confucianism as having adapted to sustain the imperial bureaucracy rather than independently blocking commerce. On the Quaker case, this rule predicts acceptance. Quaker theology and its prohibitions on oath-swearing and haggling predate their commercial success in banking and confectionery by generations. The values were not adopted to make money; they were inherited religious commitments that happened to pay off later. Here, the Quaker case looks exactly like the Puritan one, and if this is Dana's primary rule, she should sign off on the thesis chapter.

  The third candidate rule, which aligns with your own suspicion, is the Institutional Substitution Constraint. This rule posits that culture does not count as a cause if it is merely functioning as a substitute for a missing formal institution. When Dana points to the seniority pay scale in Japan, she is identifying an institutional mechanism that renders the cultural explanation redundant. Similarly, if familism in Italy is a substitute for a missing welfare state or legal protection, it is an institutional response. This rule fits the Puritan case because asceticism is not a substitute for a bank or a court; it is a psychological drive that alters consumption preferences. However, it predicts a rejection of the Quaker case. As you noted, Quaker honesty functioned as a brand and a disciplinary mechanism within the Meeting in an era of weak contract law. It performed the work of a commercial court. If Dana views culture as distinct from institutions, she will see the Quaker success as the result of an informal enforcement institution with a religious logo, not culture per se.

  So, what is my best guess at her verdict? I believe she will reject the Quaker claim, and I suspect the Puritan case is a trap. The trap lies in assuming that because both cases involve religious groups succeeding in commerce, the mechanism is the same. In the Puritan case, the culture changes the utility function itself; the Puritan works hard to prove salvation and saves because consumption is sinful. In the Quaker case, the culture changes the transaction costs; the Quaker works hard and saves because honesty makes them a lower-risk partner. Dana's comment on Japan suggests she is hypersensitive to hidden incentives. She wants to know what pays for the behavior. In the Puritan case, nothing pays for asceticism in this world; the payoff is otherworldly. In the Quaker case, the payoff is commercial reputation and repeat business. Even if the theology predates the commerce, the mechanism by which it causes success is institutional and incentive-compatible. Therefore, the Institutional Substitution Constraint and the Incentive Compatibility Constraint both point to a rejection, outweighing the Temporal Exogeneity Constraint. I think Dana sees culture as a cause only when it defies material logic, not when it optimizes it.

  To truly discriminate between these rules, specifically to separate the Incentive Compatibility Constraint from the Institutional Substitution Constraint, you need a case where the behavior is materially costly but still functions as an institution. I propose you bring up the Potlatch ceremonies of the Pacific Northwest indigenous peoples. Economic historians and anthropologists have debated whether the destructive burning of wealth was a cultural value or an institutional mechanism. If you argue that Potlatch was a cultural cause of social stratification, Dana's Incentive Compatibility Rule should lead her to accept it. Burning wealth is the opposite of profit maximization; it is costly signaling that defies material incentive. However, her Institutional Substitution Rule should lead her to reject it. Many scholars argue Potlatch functioned as a system of property rights and contract enforcement in the absence of formal law, establishing claims and debts through public destruction. If she accepts the Potlatch case as cultural causation, it proves she prioritizes the costliness of the signal over its function. If she rejects it because it served an institutional function of establishing rights, it confirms that her rejection of the Quakers will be based on the institutional nature of their honesty, not just the profitability. This case should force her to reveal whether she cares more about the motivation behind the action or the work the action performs in the economy.

  I hope this helps you prepare for the next seminar. It is a rare thing to have a colleague who forces such precision, even if she does it by acting like a judge rather than a participant. Let me know how the student progresses, and whether Dana finally offers a full sentence rather than a verdict.

