answer: |-
  The coffee in the faculty lounge had gone cold an hour ago. Maya stared at the whiteboard, where she'd sketched two columns: *Vaccination* and *Legal Aid*.

  "If we deadlock," Maya said, tapping the marker against her palm, "the foundation's bylaws kick in. The grant gets rolled over. We spend the year litigating, hiring consultants, maybe bringing in a tie-breaker who knows nothing about the cases. The money sits idle. People die in the interim, or stay in prison. That's the counterfactual, Ezra. A war of attrition where the winner is determined by who has more stamina, not whose values are right."

  Ezra leaned back, arms crossed. "And your solution is logrolling. I give you year one, you give me year two. We both walk away 'better off.'"

  "Better off by our own lights," Maya corrected. "You think letting innocent people rot is a unique evil. I think preventable death is the paramount sin. We don't have to agree on the ranking. We just have to agree that getting your top priority secured is better than risking a zero-sum fight where you might get nothing. It's comparative advantage. I don't need to know how much you suffer compared to me. I just need to know that you prefer Legal Aid over Vaccination, and I prefer Vaccination over Legal Aid. The trade creates surplus."

  "It creates a illusion of surplus," Ezra said. "Because it assumes my commitment to the wrongfully convicted is a preference I hold, like a taste for jazz over opera. It isn't. It's a constraint on my action. In the cases that actually matter, my ranking is lexicographic. No package containing a serious moral wrong ranks above a package without it, regardless of the side payments."

  "That's convenient for you," Maya said, turning to face him. "But it renders compromise impossible wherever the stakes are highest. If everyone treats their core values as lexicographic, we're back to the war of attrition. You're saying purity is worth the risk that neither of us gets anything."

  "I'm saying that if I vote for the vaccination drive *in exchange for* your vote on legal aid, I haven't actually supported the legal aid. I've rented it. I've signaled that my commitment to those innocent men is contingent on getting my way elsewhere. That changes who I am."

  "Does it?" Maya challenged. "Or does it acknowledge that we share a world? Look, let's grant the package. Vaccination this year, Legal Aid next year. You get your way on the prisoners. I get my way on the public health crisis. You can tell yourself you didn't 'sell out' the prisoners; you secured their freedom. The mechanism of the deal doesn't negate the outcome."

  "The mechanism constitutes the action, Maya. That's the point. If I make my moral duty contingent on a quid pro quo, I'm treating my conviction as an asset. And once you start pricing your convictions, you become a person whose convictions have a price."

  Maya sighed, capping the marker. "This is where you lose me. You're conflating the agent with the outcome. The 'gainer' in this trade isn't 'Ezra the person' getting a moral gold star. The gainer is the *agent's ranking of worlds*. You prefer World A (Prisoners freed, Vax delayed) to World B (Gridlock, nothing happens). Satisfying that ranking isn't a benefit to *you* in a selfish sense; it's just the realization of your agency. I'm not asking you to benefit personally. I'm asking you to actualize your values more effectively."

  Ezra stood up and walked to the window. "That's the category error. You're modeling morality as a system of satisfaction conditions for agents. When I honor a conviction, the 'point' isn't that *I* am satisfied. The point is that the *value* is honored. The innocent man walks free. That's where the good resides. If you frame it as 'Ezra gets his top choice,' you've centered the wrong thing. You've turned the moral object into a consumer good."

  "Fine," Maya said, sensing a wedge. "Let's test the boundary. Suppose I get a call this afternoon. A pharmaceutical sponsor offers to double the vaccination budget. But they want their name on the program. Their labor practices in the Global South are... questionable. Not illegal, but ugly."

  Ezra turned slowly. "And?"

  "If I take the money, we save twice as many lives. But I have to associate the foundation with a labor exploiter. If I stick to my gains-from-trade model, I should be willing to trade *that* integrity cost for the lives saved. It's the same calculus. I care more about lives than brand purity. So I take the deal."

  "Would you?" Ezra asked.

  Maya hesitated. The marker hovered over the board. "I... I probably wouldn't take it."

  "Why not?" Ezra pressed, stepping closer. "By your own model, it's a gain from trade. You give up 'clean hands' on the sponsorship issue to get 'more lives' on the vaccination issue. You're maximizing your ranking of worlds. Why is that trade off the table while the logrolling deal is on it?"

  "Because," Maya started, then stopped. "Because the sponsorship is secondary. The mission is primary."

  "But the legal aid is my mission," Ezra said softly. "To you, it's secondary. To me, it's primary. If you can't trade your secondary values for your primary ones when the cost is moral complicity, why can I? When I agree to your vaccination drive, I am complicit in deaths I could have prevented this year. I am letting people die to secure my own moral clean hands next year. You call that a trade. I call it a betrayal of the very urgency that defines my position."

  Maya rubbed her temples. "There's a difference between complicity in a negative outcome and failing to produce a positive one."

  "Is there? If I hold the key to a cell and I trade the key for a promise of future medicine, have I not locked the man in? The trade model requires me to treat the prisoner's freedom as a chip. But if his freedom is a *right*, it's not a chip. It's a constraint."

  "But if we both hold out for constraints," Maya said, her voice tightening, "we get gridlock. The prisoner stays in. The patients die. That outcome is worse by *your* lights too. You care about the prisoner. If the trade fails, he suffers. Doesn't the consequence matter?"

  "Consequences matter. But agency matters more. I am responsible for what *I* do, not for what the world fails to do through me. If I vote for the vaccination drive because I believe it is good, fine. But if I vote for it *because you promised me legal aid*, I have made the prisoner's justice conditional. I have told the universe that justice is negotiable."

  Maya turned back to the board, erasing the columns slowly. "So you're saying the only honest compromise is when we both happen to agree on a third option? That's rare."

  "I'm saying that when we disagree on fundamentals, we shouldn't pretend we're trading. We should admit we're in conflict. Maybe we flip a coin. Maybe we split the grant. But don't tell me we're both 'winning.' We're not. We're both losing something, and we're doing it to stop the bleeding."

  "But the gains-from-trade model explains why we *should* stop the bleeding," Maya insisted. "It provides the rationality for the compromise. Without it, you're just capitulating."

  "Capitulation is honest," Ezra said. "It acknowledges the tragedy. The trade model sanitizes it. It tells me I haven't really compromised my values because I 'got value' for them. That's a lie. And if I tell myself that lie often enough, I stop knowing what I actually value. I just start looking for the best deal."

  Maya looked at the erased board, the ghost of the columns still visible in the smudge marks. "If I accept your view, I have to accept that moral progress is impossible in pluralistic societies. We can't build coalitions. We can't legislate. We can only coexist until power shifts."

  "And if I accept yours," Ezra replied, "I have to accept that nothing is sacred. Everything has an exchange rate. Eventually, someone will offer a price high enough for something I thought was non-negotiable. And because I've practiced the habit of trade, I'll take the deal."

  Maya picked up her bag. "I still think the package deal is the only way to get the legal aid funded next year."

  "Then vote for it," Ezra said. "But don't ask me to sign a memo saying we've found a mutually beneficial equilibrium. Ask me to sign it as a ceasefire."

  Maya paused at the door. "A ceasefire implies we'll fight again next year."

  "We will," Ezra said. "Because next year, there will be another innocent man in a cell, and another vaccine that needs funding. And I still won't believe your values are right, and you still won't believe mine."

  "At least," Maya said, "if we trade, we both get to live in a world that's slightly more like the one we want."

  "Or," Ezra said, looking back at the blank whiteboard, "we both live in a world where we've learned that our convictions are just opening bids."

  Maya didn't answer. She turned off the light, leaving them both in the dim glow of the hallway, the question of whether the darkness was a shared burden or a shared asset hanging between them.
