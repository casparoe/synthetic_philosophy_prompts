answer: |-
  You have diagnosed the situation with remarkable accuracy. The frustration you feel is shared by many professional metaphysicians. The debate between presentism and eternalism is arguably the premier example of **metaphysical underdetermination**.

  To answer your specific questions: Yes, your hunch is largely correct. It is a dispute rooted in bedrock intuitions about passage, cloaked in the language of quantification, with physics acting as a constraint that neither side can fully satisfy without cost.

  Here is the diagnosis of what kind of disagreement this is, followed by an honest assessment of whether progress is possible.

  ### 1. The Diagnosis: What Kind of Disagreement Is This?

  It is not merely verbal, but it is not straightforwardly empirical either. It is best understood as a **conflict of ontological frameworks** where the core disagreement lies in *which aspects of reality are taken as fundamental.*

  #### A. Is it Verbal? (The Quantifier Variance Thesis)
  You asked if it's just a fight over whether "exists" is tensed.
  *   **The Case for Yes:** As you noted, both sides can translate the other's claims. A presentist says "Dinosaurs do not exist." An eternalist says "Dinosaurs exist at $t_{past}$." If we treat "exists" as ambiguous (tensed vs. tenseless), they are talking past each other.
  *   **The Case for No:** If it were purely verbal, there would be no stakes. But there are stakes. The disagreement is about **truthmakers**.
      *   For the eternalist, the truth of "Caesar crossed the Rubicon" is grounded by a concrete object (Caesar) located in the past region of the block.
      *   For the presentist, that concrete object is gone. So what makes the statement true *now*? They must posit abstract entities, haecceities, or brute tensed facts.
      *   This is a real disagreement about the *furniture of reality*, not just the labels we put on it.

  #### B. Is it Metaphysical? (Carving at the Joints)
  You asked if it's about which quantifier carves nature at the joints.
  *   **Yes.** This is the technical core. The debate is about **ontological privilege**.
      *   **Eternalism** claims the spacetime manifold is the fundamental joint. "Now" is indexical (like "here").
      *   **Presentism** claims the present moment is the fundamental joint. "Now" is ontologically unique.
  *   The problem is that "carving at the joints" is itself a metaphor. We have no independent access to the "joints" other than our best physics (which favors eternalism) and our best phenomenology (which favors presentism).

  #### C. Is it Bedrock Intuition? (The Phenomenology of Passage)
  You suspected this is the real driver. **You are right.**
  *   **Presentism** is the metaphysical codification of the **phenomenology of time**. We *feel* time passing. We feel the future is open and the past is fixed and gone. Presentism takes this experience at face value.
  *   **Eternalism** is the metaphysical codification of the **physics of spacetime**. Special Relativity implies no privileged simultaneity slice. Eternalism takes the mathematical structure of physics at face value.
  *   **The Stalemate:** The debate is essentially a tug-of-war between **Manifest Image** (how time feels) and **Scientific Image** (how physics models time). Neither side can disprove the other's data. Presentists can't deny SR without ad hoc maneuvers (like positing a hidden preferred frame); Eternalists can't deny the feeling of passage without calling it an illusion (which raises the question: an illusion of what, occurring when?).

  ### 2. Can Anything Count as Progress?

  You asked whether you should accept this never ends. Here is the honest truth: **Theoretical resolution is unlikely, but conceptual clarification is possible.**

  #### Why Empirical Progress is Unlikely
  Unless physics undergoes a revolution that restores absolute simultaneity (e.g., a successful quantum gravity theory that privileges a foliation of spacetime), the Relativity argument remains the eternalist's ace. Presentists have become very clever at dodging it (e.g., "Fragmentalism," "Neo-Lorentzianism"), but these moves add complexity without new predictive power. Physics will likely remain neutral or hostile to presentism.

  #### Where Progress *Has* Happened
  While nobody switches sides, the *quality* of the debate has improved. Progress has occurred in three specific areas:

  1.  **Truthmaker Theory:** The debate forced presentists to develop sophisticated accounts of how past-tensed statements can be true without past objects. This has refined our understanding of properties and propositions, even if it hasn't convinced eternalists.
  2.  **The Logic of Tense:** We now have rigorous tense logic (Priorian logic) that allows presentists to formalize their view without contradiction. We know exactly *where* the logical pressure points are.
  3.  **Pragmatic/Existential Implications:** Recent work explores the ethical consequences. If eternalism is true, is death less bad? (Your past selves still exist!). If presentism is true, do we have more responsibility for the future? This shifts the debate from "Which is true?" to "Which is livable?"

  #### The "Progress" You Should Expect
  Do not expect a knockout argument. Expect **explication**.
  The progress lies in realizing that the choice between presentism and eternalism is not a discovery of a hidden fact, but a **choice of primitive ideology**.
  *   If you choose **Presentism**, your primitive is *Tense*. You must explain away Relativity.
  *   If you choose **Eternalism**, your primitive is *Spacetime*. You must explain away Passage.

  Progress consists in acknowledging that one of these primitives *must* be brute. You cannot reduce both.

  ### 3. Verdict: Should You Accept the Stalemate?

  **Yes.** But not with resignation; with clarity.

  The debate persists because it maps onto a fundamental tension in human cognition: we are biological organisms evolved to navigate a local "now" (Presentism), living in a universe governed by relativistic spacetime (Eternalism).

  **My advice:**
  1.  **Stop looking for a truth-conditional winner.** There is likely no "fact of the matter" accessible to us that isn't already baked into the framework you choose to interpret the facts.
  2.  **Adopt a "Framework Relative" stance.** Ask: "Relative to the requirements of General Relativity, eternalism is superior. Relative to the requirements of Phenomenology and Agency, presentism is superior."
  3.  **Focus on the costs.** The philosophical work now is not proving one side right, but auditing the *cost* of each side. How much ad-hocery does the presentist need to accommodate physics? How much revisionary metaphysics does the eternalist need to accommodate consciousness?

  **Conclusion:**
  You are correct. It is bedrock intuition doing the work. The "existence" talk is the vehicle, but the engine is the conflict between the **feeling of flow** and the **structure of the block**. Nothing will settle it because "settling" would require stepping outside of both human experience and physical theory to view reality "sub specie aeternitatis," which we cannot do.

  Accept the stalemate. The value of the debate is not in the solution, but in the pressure it exerts on our concepts of existence, truth, and consciousness. That is progress enough.
