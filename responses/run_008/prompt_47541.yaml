      *   **Goal:** The user wants to maintain ambiguity. The character *insists* the rituals are chosen. The user wants the reader to be unsure if this is self-knowledge or self-deception.
      *   **Core Question:** Is there a principled line between mechanical rigidity and free agency? Can rigidity express a self, or does it bypass one? Do I have to resolve this ambiguity for the character to work?

  2.  **Deconstruct the Philosophical/Literary Problem:**
