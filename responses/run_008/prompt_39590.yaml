answer: |-
  Here is a decision procedure grounded in David Lewis's *Convention*, adapted for a 20-minute engineering leadership context.

  ### The Lewis Gate: A Decision Procedure for Standards

  **Timebox:** 20 Minutes
  **Input:** A proposal to codify, kill, or ignore a recurring engineering practice.
  **Output:** One of four decisions: **Codify**, **Ignore**, **Kill**, or **PUNT** (Not a coordination problem).

  Ask these five questions in order. If you answer **NO** to any question, follow the branching logic immediately.

  #### 1. The Coordination Test
  *Does the value of my action depend primarily on whether others do the same thing?*
  *   **Yes:** Proceed. (e.g., Naming schemes, indentation).
  *   **No:** **PUNT.** This is not a convention; it is either a technical constraint or a Prisoner's Dilemma. (See Case 2).
      *   *Lewis Basis:* Condition 3 of Lewis's definition. A convention solves a coordination problem where agents prefer to match, not necessarily the specific match itself.

  #### 2. The Arbitrariness Test
  *If we had chosen the opposite practice at the start, would the system work roughly as well?*
  *   **Yes:** Proceed. (e.g., `camelCase` vs `snake_case`).
  *   **No:** **CODIFY AS REQUIREMENT.** This is not a convention; it is a physical or logical constraint. Treating it as a convention invites unnecessary debate.
      *   *Lewis Basis:* Condition 4. Conventions must be arbitrary; there must be at least one alternative regularity that could have served the purpose.

  #### 3. The Expectation Test
  *Do engineers follow this practice primarily because they expect other engineers to follow it?*
  *   **Yes:** It is an **Existing Convention**. Proceed to Q4.
  *   **No:** It is a **Best Practice** or **Mandate**.
      *   *Action:* If you want it to stick, you must build the expectation. Codification *creates* the common knowledge here. **CODIFY.**
      *   *Lewis Basis:* Condition 2. Conventions rely on reciprocal expectations, not just top-down rules.

  #### 4. The Compliance Threshold (The "Dead Letter" Check)
  *Is organic compliance currently above ~90% without enforcement?*
  *   **Yes:** **CODIFY.** Writing it down simply makes the tacit common knowledge explicit. It lowers the cognitive load of verifying the expectation.
  *   **No:** **DO NOT CODIFY.**
      *   *Reasoning:* If you write down a rule that 30% of people ignore, you convert a "flexible norm" into a "broken law." This destroys handbook authority (your specific worry).
      *   *Action:* **IGNORE** (let it evolve) or **KILL** (if the fragmentation is costly). Do not codify the middle ground.
      *   *Lewis Basis:* Adaptation of Common Knowledge. Lewis argues conventions *are* common knowledge. If compliance is low, the knowledge isn't common yet. Codifying it exposes the lack of consensus.

  #### 5. The Intervention Test (Only if proposing to break an existing convention)
  *Are we changing the underlying "Recurrence Situation" or just the rule?*
  *   **Changing the Situation:** (e.g., New architecture, new customer requirement). **PROCEED TO MIGRATE.** Establish a new "focal point" for new work; allow old work to decay.
  *   **Changing Only the Rule:** (e.g., "I prefer the other arbitrary option"). **REJECT.** You cannot break a stable equilibrium without a change in payoffs or situation.
      *   *Lewis Basis:* Conventions are stable equilibria. They persist unless the underlying game ($S$) or preferences change.

  ---

  ### Case Runs

  #### Case 1: Error Dialogs (80% Message-First, Proposal to Codify Code-First)
  **Run:**
  1.  **Coordination?** Yes. Consistency matters for UX.
  2.  **Arbitrariness?** Yes. Code-First works as well as Message-First.
  3.  **Expectation?** Yes. The 80% do it because they see others doing it. **(Existing Convention)**.
  4.  **Compliance?** 80%. This is below the 90% threshold for safe codification of the *current* norm, but the proposal is to flip to the *minority* norm.
  5.  **Intervention?** The prompt cites a "big customer asked for consistency across products." This changes the **Recurrence Situation** ($S$). The payoff matrix has shifted; consistency *across products* now outweighs consistency *within the repo*.

  **Output:** **MIGRATE (Do not simply Codify).**
  The procedure detects an Existing Convention (Message-First). However, Q5 detects a change in the Situation (Customer constraint).
  *   **Action:** Do not just write "Code-First" in the handbook tomorrow. That breaks the equilibrium without a focal point.
  *   **Plan:** Announce that *new* customer-facing surfaces must use Code-First (New Focal Point). Legacy surfaces are exempt. This creates a transition path.
  *   **Punt:** None. The procedure handles this via Q5.

  #### Case 2: Code Review (Nobody reads 100%, Proposal to Require It)
  **Run:**
  1.  **Coordination?** **NO.**
      *   *Analysis:* Do I benefit from reading 100% *if* you read 100%? Yes, the code is safer.
      *   *Crucial Check:* Do I benefit from *not* reading 100% *if* you read 100%? **Yes.** I save time, you catch the bugs. This is a Prisoner's Dilemma / Tragedy of the Commons, not a Coordination Problem.
  2.  **Arbitrariness?** Irrelevant.

  **Output:** **PUNT: NOT A CONVENTION.**
  The procedure halts at Q1.
  *   **Reasoning:** Lewis's theory applies to situations where everyone *wants* to match. Here, everyone wants to *defect* (save time) while hoping others match (ensure quality).
  *   **Advice:** Do not use the "Convention" playbook. Codifying this will create a "Dead Letter" rule (Q4 failure guaranteed) because the incentive structure rewards violation.
  *   **Alternative:** You need mechanism design, not standardization. (e.g., spot audits, tooling that highlights unread sections, or changing the approval token economy).
  *   **Punt:** The procedure punts the decision back to you, but explicitly tells you *why* your intuition ("this isn't a coordination problem") is correct.

  #### Case 3: Service Naming (Team Prefixes, You Hate It, Want to Break It)
  **Run:**
  1.  **Coordination?** Yes. We need to find services.
  2.  **Arbitrariness?** Yes. Domain-based naming works as well as Team-based.
  3.  **Expectation?** Yes. Everyone expects `team-service`. **(Existing Convention)**.
  4.  **Compliance?** Assume >90%. It's entrenched.
  5.  **Intervention?** You hate it (aesthetic/preference). Has the **Recurrence Situation** changed?
      *   *Analysis:* You mention it "locks in team boundaries." If the company is moving to domain-oriented architecture, $S$ has changed. If the company structure is static, $S$ is the same, and you just prefer a different arbitrary equilibrium.

  **Output:** **REJECT (Unless Architecture Changes).**
  *   **Reasoning:** If the org structure is stable, Q5 fails. You are trying to break a stable equilibrium for aesthetic reasons. Lewis suggests this will fail or cause friction because the "cost" of switching (renaming, breaking links, retraining) outweighs the arbitrary benefit of the new name.
  *   **If Architecture *is* changing:** **MIGRATE.**
      *   **Action:** Define the new naming convention for *new domains only*. Do not rename existing services (too costly, breaks the "common knowledge" of the old names). Let the old convention die via attrition.
  *   **Punt:** The procedure forces you to admit if you are breaking it for *value* (architecture change) or *taste*. If it's taste, it tells you to stop.

  ---

  ### Confidence & Provenance Assessment

  **Overall Confidence:** 75%
  This procedure is a pragmatic engineering adaptation of a philosophical text. It is useful, but it is not "pure" Lewis.

  **Genuinely Lewisian Steps:**
  1.  **The Coordination Test (Q1):** This is the core of Lewis's definition. He explicitly distinguishes conventions from norms driven by moral obligation or pure constraint. If the preference isn't conditional on others' conformity, it's not a convention.
  2.  **The Arbitrariness Test (Q2):** This is Lewis's specific contribution (Condition 4). He insists that if there is no alternative (e.g., "don't touch high voltage"), it is not a convention.
  3.  **The Intervention Test (Q5):** Lewis treats conventions as equilibria in a game. They are stable. They only change if the game (Recurrence Situation) or payoffs change.

  **Invented / "Lewisian-Sounding" Steps:**
  1.  **The Compliance Threshold (Q4):** Lewis discusses *Common Knowledge*, but he does not quantify it. The idea that >90% organic compliance makes codification safe, while <90% makes it dangerous (the "Dead Letter" worry), is **organizational theory**, not Lewis. Lewis assumes conventions *are* known; he doesn't analyze the bureaucracy of writing them down. This step addresses your specific worry about handbook authority, which Lewis never encountered.
  2.  **The "Punt" Logic:** Lewis describes what conventions *are*, not how managers should *process* them. The idea that a manager should "PUNT" when a situation is a Prisoner's Dilemma is a management heuristic derived from the theory, not the theory itself.

  **Least Sure Step:**
  **The Compliance Threshold (Q4).**
  I am least sure this tracks Lewis. Lewis argues that conventions *generate* their own normativity through expectation. He does not discuss the "codification trap"—the idea that making a tacit norm explicit can weaken it. This is closer to the work of sociologists like Harold Garfinkel (ethnomethodology) or modern organizational psychology. I included it because you specifically requested a solution to the "Dead Letter" worry, and Lewis's 1969 text does not contain a mechanism for "handbook authority decay." I have bridged that gap with a heuristic that *feels* Lewisian (protecting the equilibrium) but is technically an invention for this context.
