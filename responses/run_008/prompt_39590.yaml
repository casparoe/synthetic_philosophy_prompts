prompt: |-
  I run developer experience at a company of around 700 engineers, and one of my jobs is deciding when a de facto practice gets promoted to an official standard — we write it down, it goes in the handbook, teams get audited against it — versus when we leave it alone, or even actively kill it. This comes up a couple times a month: code formatting, how internal services get named, where the error message goes on a dialog, you name it.

  A while back I read David Lewis's book Convention, the 1969 one, where he treats conventions as solutions to recurring coordination problems — everyone conforms mainly because they expect everyone else to conform, and some other arrangement would have worked about as well. It struck me that this is basically my job in theory form, but I can't turn it into anything I can actually run. When a proposal lands in my inbox I have maybe twenty minutes before I have to say "codify it, leave it alone, or burn it down," and the people making these calls (sometimes me, sometimes managers with no theory at all) need something they can follow mechanically.

  So: write me a decision procedure grounded in whatever from Lewis is actually usable here. I'm imagining a series of questions asked in order, what counts as a good-enough answer to each, where the procedure outputs "leave it alone" and why, and the points where it has to hand the decision back to a human because the question is a values call, not a fact. Two parts of the theory I especially want baked in, plus one worry of my own:

  - The arbitrariness point: a convention needs a workable alternative. If only one arrangement could ever have worked, it's not a convention, and treating it like one is a category error — so the procedure has to have some test for "is there really a second way this could have gone."
  - The mutual expectation stuff, which I only half remember — common knowledge, everyone expecting everyone to conform, whatever the right version of that is. I suspect this matters for deciding whether writing something down helps (creates the common knowledge) or hurts.
  - My worry: a handbook rule nobody follows is worse than a practice everyone follows without a rule, because now the rule is dead letter and the handbook loses authority. The procedure should have something to say about when codifying is how a convention dies.

  Then run it on three real-ish cases:

  1. Error dialogs: about 80% of teams put the human-readable explanation before the error code, for no reason anyone can articulate other than "that's what everyone does." There's a proposal to make the code-first style official becuase a big customer asked for consistency across products.
  2. Code review: nobody actually reads the whole diff before approving, everyone knows nobody does, and there's a proposal to write a rule that reviewers must read 100% of every diff. I suspect this one isn't a coordination problem at all — more like everyone individually benefits from slacking — but I'd like the procedure itself to detect that, and I want to know what it outputs when it doesn't apply. Does it punt, or does it still say something useful about what to do instead?
  3. Service naming: every internal service gets prefixed with the owning team's name, and honestly I hate it — it's ugly and it locks in team boundaries. I'd like the procedure to tell me whether and how you can break a working convention on purpose, and what it says about the transition. There's clearly a version of breaking it that's fine and a version that's a disaster, and I can't tell which is which.

  For each case, say what the procedure outputs and where it had to punt, including any output you think I won't like.

  Last thing: at the end, tell me how confident you are overall, and specifically separate the steps of the procedure that are genuinely Lewis from the ones where you (or I) have just made something up that sounds Lewisian. Single out the step you're least sure actually tracks the theory. I'd rather know the procedure is half-invented than think it's more orthodox than it is.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **Role:** Head of Developer Experience (DevEx) at a ~700 engineer company.
      *   **Task:** Create a mechanical decision procedure for promoting de facto practices to official standards, leaving them alone, or killing them.
      *   **Theoretical Basis:** David Lewis's *Convention* (1969).
      *   **Key Constraints:**
          *   Must be usable in ~20 minutes.
          *   Must incorporate: Arbitrariness (alternative solutions exist), Mutual Expectations (common knowledge), and the "Dead Letter" worry (codification killing the norm).
          *   Must handle three specific cases (Error Dialogs, Code Review, Service Naming).
          *   Must include a confidence assessment distinguishing actual Lewis theory from "Lewisian-sounding" invention.
      *   **Tone:** Pragmatic, theoretical but actionable, honest about limitations.

  2.  **Deconstruct Lewis's *Convention* (1969):**
      *   *Core Definition:* A regularity $R$ in behavior among a population $P$ in a recurrent situation $S$ is a convention if:
          1.  Everyone conforms to $R$.
          2.  Everyone expects everyone else to conform to $R$.
          3.  Everyone prefers to conform to $R$ *on the condition that* others do (coordination problem).
          4.  There is at least one alternative regularity $R'$ that could have solved the coordination problem just as well (Arbitrariness).
          5.  These facts are *Common Knowledge* (everyone knows, everyone knows everyone knows, etc.).
      *   *Relevance to DevEx:*
          *   Standards = Codified Conventions.
          *   De facto practices = Emerging Conventions.
          *   Killing a practice = Disrupting a Convention.
          *   Codification = Making Common Knowledge explicit.

  3.  **Drafting the Decision Procedure (The "Lewis Gate"):**
      *   *Goal:* A flowchart/quiz style.
      *   *Step 1: The Coordination Test (Is this actually a convention?)*
          *   Lewis requires a coordination problem (prefer to match others).
          *   If it's a Prisoner's Dilemma (prefer to defect even if others match), Lewis doesn't apply directly.
          *   *Action:* Check if conformity is mutually beneficial *conditional* on others conforming.
      *   *Step 2: The Arbitrariness Test (Lewis's specific criterion)*
          *   Could we have done it differently with similar results?
          *   If No (Technical Constraint): It's not a convention, it's a law of physics/engineering. Don't treat it as policy, treat it as requirement.
          *   If Yes: Proceed.
      *   *Step 3: The Expectation Test (Is it already a convention?)*
          *   Do people do it because they expect others to?
          *   If No (It's just best practice or individual preference): Codification might help create the convention.
          *   If Yes (It's already a convention): Codification risks the "Dead Letter" problem if enforcement is weak.
      *   *Step 4: The Common Knowledge Test (To Codify or Not?)*
          *   Does writing it down increase common knowledge without creating resentment?
          *   Lewis says conventions *are* common knowledge. Writing it down makes it *explicit* common knowledge.
          *   Risk: If compliance is shaky, writing it down exposes the shakiness (Dead Letter).
      *   *Step 5: The Intervention Test (Breaking a Convention)*
          *   Lewis implies conventions are stable equilibria. To break one, you need a "focal point" shift or a change in preferences.
          *   You can't just decree it. You need a migration path that establishes a *new* coordination point.

      *Refining for the 20-minute constraint:* Needs to be sharper. Let's make it a 5-question checklist.

      *Question 1 (Coordination):* Does value depend on alignment?
      *Question 2 (Arbitrariness):* Is there a viable alternative?
      *Question 3 (Compliance):* Is adherence >90% organic?
      *Question 4 (Enforceability):* Can we detect violation cheaply?
      *Question 5 (Preference):* Do engineers *want* this alignment?

      *Wait, I need to integrate the specific user constraints more tightly.*
      *   *Arbitrariness:* Must be a specific gate.
      *   *Mutual Expectation:* Must determine if codification helps or hurts.
      *   *Dead Letter:* Must prevent codifying weak norms.

      *Revised Procedure Structure:*
      1.  **The Coordination Filter:** Is this a coordination problem? (Lewis Condition 3).
      2.  **The Arbitrariness Filter:** Could it have been otherwise? (Lewis Condition 4).
      3.  **The Equilibrium Check:** Is it already stable? (Lewis Condition 1 & 2).
      4.  **The Codification Risk:** Will writing it down break the trust/expectation? (User's Dead Letter worry).
      5.  **The Intervention Protocol:** If breaking, how to shift the focal point?

  4.  **Developing the Cases:**

      *   *Case 1: Error Dialogs (80% do A, Customer wants B).*
          *   Coordination: Yes (consistency matters).
          *   Arbitrariness: Yes (Code-First vs. Message-First).
          *   Equilibrium: 80% is high, but not stable if a big customer pushes back.
          *   Decision: Codify the 80%? Or the Customer request?
          *   Lewisian view: If 80% do it, it's a convention. But if the "population" includes the customer, the equilibrium is shifting.
          *   Output: Codify the 80% *unless* the customer constraint changes the payoff matrix. Actually, Lewis says conventions persist because they are equilibria. If the customer changes the payoff (consistency across products is now higher value), the old convention is threatened.
          *   *Correction:* The prompt says proposal is to make "code-first" (the minority 20%?) official because of customer. Wait, prompt says "80%... explanation before code... proposal to make code-first style official". So proposal is to flip the convention.
          *   Lewis says: Flipping a convention is hard. Requires a "focal point" shift.
          *   Procedure Output: Don't just codify. Need a migration.

      *   *Case 2: Code Review (Nobody reads 100%, proposal to require it).*
          *   Coordination: No. This is a Prisoner's Dilemma or Tragedy of the Commons. I benefit from slacking even if you read.
          *   Lewis Test: Fails Condition 3 (prefer to conform *if* others do). Here, I prefer *not* to conform even if others do.
          *   Output: Lewis procedure PUNTS. It identifies this is *not* a convention.
          *   Advice: Don't use convention logic. Use incentive/audit logic.

      *   *Case 3: Service Naming (Team Prefixes, Hate it, Want to break it).*
          *   Coordination: Yes (need to find services).
          *   Arbitrariness: Yes (could use domain-based).
          *   Equilibrium: Stable (everyone does it).
          *   Intervention: How to break?
          *   Lewis: Conventions change when the situation $S$ changes or a new focal point emerges.
          *   Output: Don't ban immediately. Create a new standard for *new* services (Schelling point). Allow old ones to decay.

  5.  **Refining the Theory vs. Invention (Confidence Check):**
      *   *Lewis Actual:* Coordination problem, Arbitrariness, Common Knowledge, Equilibrium.
      *   *Invention/Adaptation:* The "Dead Letter" risk is not explicitly Lewis (he focuses on how conventions *form*, not how handbooks *kill* them). The "20-minute mechanical procedure" is obviously an adaptation. The specific thresholds (e.g., >90% compliance) are invented for pragmatism.
      *   *Least Sure Step:* The "Codification Risk" step. Lewis talks about common knowledge, but the idea that *explicit* common knowledge (handbook) undermines *tacit* common knowledge (practice) is more sociological (Garfinkel?) or organizational theory than pure Lewis game theory.

  6.  **Drafting the Content (Iterative refinement):**
      *   *Intro:* Acknowledge the role.
      *   *The Procedure:* Name it "The Lewis Gate". 5 Questions.
      *   *The Cases:* Apply strictly.
      *   *The Confidence:* Be brutally honest.

      *(Self-Correction during drafting Case 1)*: The prompt says 80% do Message-First. Proposal is to make Code-First official.
      *   Lewis says: Conventions are arbitrary equilibria. The 80% is the current convention.
      *   To switch: You need to establish a new focal point.
      *   Decision: The procedure should likely say "Do not codify the minority practice without a transition plan that shifts the focal point."
      *   Actually, if the Customer demand changes the *payoffs*, it's no longer the same coordination game. Consistency *across products* outweighs consistency *within team*.
      *   Okay, I will frame the procedure to detect if the "Recurrence Situation" has changed.

      *(Self-Correction during drafting Case 2)*: Make sure the procedure explicitly flags "Not a Convention."
      *   Lewis defines conventions *against* other types of regularities.
      *   If it fails the "Preference to Conform" test, it's not a convention.
      *   Output: "PUNT: Not a Convention."

      *(Self-Correction during drafting Case 3)*: Breaking a convention.
      *   Lewis doesn't give a manual for revolution.
      *   But he discusses how conventions evolve.
      *   I need to synthesize a "Convention Migration" step based on the logic of Focal Points (Schelling, often paired with Lewis).
      *   Procedure should output: "Establish New Focal Point for Future Cases."

  7.  **Final Review against Constraints:**
      *   20 minutes? Yes, checklist format.
      *   Arbitrariness included? Yes (Q2).
      *   Mutual Expectation included? Yes (Q3).
      *   Dead Letter worry included? Yes (Q4).
      *   Confidence section included? Yes.
      *   Tone check: Professional, slightly academic but pragmatic.

  8.  **Final Polish:** Ensure the distinction between Lewis's text and my interpretation is clear in the final section. (e.g., Lewis doesn't talk about "handbooks," he talks about "signaling systems.")

  *(Self-Correction on Confidence)*: I need to be careful not to claim Lewis wrote about "handbooks." He wrote about language and social norms. The mapping to DevEx is the invention. I will highlight this.

