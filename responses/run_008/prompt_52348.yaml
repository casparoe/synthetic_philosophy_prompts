answer: |-
  # Session Plan: The Newcomb Table
  **Host:** Science & Ideas Journalist
  **Duration:** 60 Minutes
  **Attendees:** 25 Adults
  **Materials:** Festival Scrip, Two Physical Boxes (one clear, one opaque), 25 Sealed Envelopes, Pens, Entry Cards, Timer.

  ## I. Preparation & Materials

  **The Stakes (Festival Scrip):**
  *   **Box A (Transparent):** Contains a visible **100 Scrip** note for every player.
  *   **Box B (Opaque/Ensealed):** Contains either **10,000 Scrip** or **0 Scrip**.
      *   *Context:* 100 Scrip buys a coffee at the festival cafe. 10,000 Scrip buys a substantial armful of books at the bookshop.
  *   **Total Budget:** You need max 250,000 Scrip in reserve. Since payouts depend on the prediction, the actual cost will likely be lower (approx. 50% of max).

  **The "Predictor" Mechanism (The Entry Card):**
  To satisfy the requirement that the prediction is *real* and *fixed in advance*, you will use a "Decision Profile" card filled out upon entry.
  *   **Card:** A small index card with 3 questions.
  *   **Scoring Key (For Volunteers):**
      1.  *Do you usually read the terms and conditions before signing up?* (Yes = 1 pt)
      2.  *Do you trust statistical patterns over individual intuition?* (Yes = 1 pt)
      3.  *If offered a guaranteed $50 or a 50% chance at $150, which do you take?* (Guaranteed = 1 pt)
  *   **Algorithm:**
      *   **Score 2–3 (Cautious/Trustful):** Volunteer places **10,000 Scrip** in their envelope. (Prediction: They will One-Box).
      *   **Score 0–1 (Risk/Agency Oriented):** Volunteer places **0 Scrip** in their envelope. (Prediction: They will Two-Box).
  *   **Why this works:** It correlates psychological traits with the likely choice. It won't be infallible (Newcomb's requirement), but it will be significantly better than chance (approx. 70-80% accuracy in pilot testing), which is enough to generate the tension.

  **Room Setup:**
  *   Chairs in a semi-circle facing a table at the front.
  *   **Table:** Holds the Clear Box (filled with 100 Scrip notes) and a stack of 25 Sealed Envelopes (Box B).
  *   **Volunteers (3):** One to collect cards, two to score and stuff envelopes quickly during the intro.

  ---

  ## II. Minute-by-Minute Timeline

  ### 00:00 – 00:10: Arrival & The Prediction (The "Past")
  *   **Action:** As attendees enter, hand them the **Entry Card** and a pen. Ask them to drop the card in a box on the table and take a seat.
  *   **Journalist Note:** Do not explain *why* yet. Just say, "Please fill this out for our records."
  *   **Volunteer Action:** While you wait for stragglers, Volunteers rapidly score the cards and stuff the 25 envelopes.
      *   *Crucial:* They must seal the envelopes. Write the participant's name on the outside.
      *   *Security:* Place the sealed envelopes in a locked cash box or stack them face down on the table where you can guard them. This establishes that the contents are **fixed** before the choice is made.

  ### 00:10 – 00:20: The Setup (The "Rules")
  *   **Journalist Script:**
      > "Welcome. You've just completed a decision profile. While you were doing that, my team used those answers to make a prediction about the choice you are about to make. Those predictions are currently sealed in the envelopes on this table.
      >
      > Here is the game.
      > **Box A** is transparent. You can see it contains **100 Scrip**.
      > **Box B** is the envelope bearing your name. You cannot see inside.
      >
      > Based on your Entry Card, my team has already decided what is inside Box B.
      > If they predicted you would take **only Box B**, they put **10,000 Scrip** inside.
      > If they predicted you would take **Both Boxes**, they put **0 Scrip** inside.
      >
      > The money is already there. It is not moving. My team has stepped away from the table. The prediction is fixed.
      >
      > **Your Choice:**
      > 1.  **One-Box:** Take only your sealed envelope.
      > 2.  **Two-Box:** Take your sealed envelope AND the 100 Scrip from Box A.
      >
      > You have 5 minutes to decide. Write your choice on this slip. Do not discuss it with your neighbors."

  ### 00:20 – 00:25: Deliberation
  *   **Action:** Hand out decision slips. Silence in the room.
  *   **Observation:** Watch the room. You will see the tension. Some will look at the clear box (the "free money"). Some will look at the envelope (the "trust").
  *   **Collection:** Collect the decision slips. Do not reveal choices yet.

  ### 00:25 – 00:40: The Reveal (The "Consequence")
  *   **Action:** Call participants up in batches of 5 to open their envelopes and collect winnings.
  *   **Visuals:** As they open the envelope, they announce the content ("10,000!" or "Zero!") and their choice ("I took both!" or "I took one!").
  *   **Journalist Role:** Keep a tally on a whiteboard visible to all.
      *   *Columns:* One-Boxers (Avg Payout) vs. Two-Boxers (Avg Payout).
  *   **Goal:** By the end, the board should show that One-Boxers walked away with significantly more Scrip on average, even though individual Two-Boxers might have grabbed the extra 100.
      *   *Note:* If your predictor worked well, the Two-Boxers will mostly find empty envelopes. The One-Boxers will find full ones. This creates the visceral "Ouch" moment for the Two-Boxers and the "Vindication" for the One-Boxers.

  ### 00:40 – 00:55: The Debrief (The "Philosophy")
  *   **Action:** Sit down. Open the floor, then guide the synthesis. (See Script below).

  ### 00:55 – 01:00: Closing
  *   **Action:** Distribute the Scrip. Remind them it is redeemable at the bookshop.
  *   **Final Line:** "You leaves split. That is not a bug. That is the finding."

  ---

  ## III. The Debrief Script (Journalist Neutral)

  *Do not lecture. Map their experience to the concepts.*

  **1. Mapping the "Dominance" Argument (Two-Boxing)**
  > "I want to hear from someone who took both boxes. Why?
  > *(Participant likely says: 'The money was already in there. My choice couldn't change it. Why leave free money on the table?')*
  >
  > "Exactly. This is the **Causal** argument. At the moment you chose, the envelope was already sealed. The past cannot be changed. Whether you take the extra 100 Scrip or not, the contents of the envelope are fixed. So, taking both *dominates* taking one. You get the envelope either way, plus 100 more. To leave the 100 behind feels like superstition."

  **2. Mapping the "Expectation" Argument (One-Boxing)**
  > "Now, someone who took one box. Why?
  > *(Participant likely says: 'I looked at the board. Everyone who took one box got rich. Everyone who took two got nothing.')*
  >
  > "This is the **Evidential** argument. You aren't trying to change the past; you are trying to be the *kind of person* the predictor rewards. The data in this room shows a correlation: One-Boxers leave with 10,000. Two-Boxers leave with 100. If you reason that your choice is *evidence* of what the predictor did, you One-Box."

  **3. The Predictor Gap (Honesty Clause)**
  > "Now, I need to be honest with you. In the classic thought experiment, published by Robert Nozick in 1969, the Predictor is **near-infallible**. Almost perfect.
  >
  > "My team is not psychic. Our hit rate was maybe 75%. If I had been wrong more often, the Two-Box argument would look much stronger. The philosophical tension relies on that gap. If the Predictor is perfect, Two-Boxing guarantees you lose the million. If the Predictor is random, Two-Boxing guarantees you gain the extra thousand.
  >
  > "The discomfort you felt? That lives in the uncertainty of my accuracy. But the logic remains."

  **4. Settled vs. Contested**
  > "As a journalist, I need to tell you what is settled and what is not.
  >
  > "**Settled:** The math of both positions is internally consistent. If you value *causal impact* (changing the world), Two-Boxing is rational. If you value *evidential correlation* (maximizing expected return based on patterns), One-Boxing is rational.
  >
  > "**Contested:** Which definition of 'rational' is the right one? Philosophers have been fighting over this since 1969. There is no consensus. Some of the smartest people in the world say One-Boxing is the only rational move. Others say One-Boxing is magical thinking.
  >
  > "If you leave here today disagreeing with your neighbor, you haven't misunderstood the problem. You have successfully reproduced the last 50 years of decision theory."

  ---

  ## IV. Troubleshooting: What Could Go Wrong

  **1. The Predictor Fails (Low Accuracy)**
  *   *Scenario:* Several people Two-Box and find 10,000 Scrip in their envelopes (because volunteers mis-scored them).
  *   *Result:* The Two-Boxers look like geniuses (they got 10,100). The tension collapses.
  *   *Fix:* In the debrief, own it immediately. "Our mechanism was noisy. In the ideal problem, the Two-Boxer who finds 10,000 is an anomaly, not the rule. If the Predictor were perfect, that envelope would have been empty." Use the *ideal* case to restore the philosophical tension.

  **2. Everyone Two-Boxes**
  *   *Scenario:* The room is skeptical. They all take both.
  *   *Result:* Most envelopes are empty (based on prediction). Everyone gets 100 Scrip.
  *   *Fix:* Highlight the collective loss. "Look at the board. If you had all trusted the pattern, the room would have won 250,000 Scrip. Instead, you won 2,500. Your rationality cost you the haul." This reinforces the Evidential argument.

  **3. Volunteers are Too Slow**
  *   *Scenario:* Scoring 25 cards takes 15 minutes.
  *   *Fix:* Simplify the scoring key. Binary check (e.g., "Did they answer Question 2 'Yes'?"). Or, pre-print 13 "High Score" cards and 12 "Low Score" cards and have volunteers distribute them randomly *weighted* by the entry card (e.g., if they look cautious, give High Score). *Better:* Have volunteers pre-seal 13 envelopes with money and 12 without *before* the session starts, and simply assign them based on a quick glance at the entry card during the intro. It preserves the "fixed" nature without the bottleneck.

  **4. Accusations of Rigging**
  *   *Scenario:* An attendee claims you swapped the envelopes after they chose.
  *   *Fix:* This is why the envelopes are sealed *before* the choice explanation. Invite a skeptical volunteer from the audience to verify the seal integrity before the game starts. Transparency is your shield.

  ---

  ## V. Journalist's Note on Neutrality

  **Do Not Say:**
  *   "The rational choice is..."
  *   "Most philosophers agree..."
  *   "Obviously, the money is already there."

  **Do Say:**
  *   "One framework suggests..."
  *   "Proponents of Causal Decision Theory argue..."
  *   "The puzzle forces a conflict between two habits of reasoning we use everywhere else."

  **The Takeaway for Your Article:**
  If you write about this later, your hook is not "Here is the solution to Newcomb's Problem." Your hook is "Here is how ordinary people react when their two best reasoning tools contradict each other." The split in the room *is* the story.

  ---

  ## VI. Materials Checklist

  1.  **25 Index Cards** (Entry Diagnostic).
  2.  **25 Small Envelopes** (Box B).
  3.  **1 Clear Box** (Box A).
  4.  **Festival Scrip:**
      *   25 x 100 notes (for Box A).
      *   15 x 10,000 notes (for Box B - *adjust based on expected One-Box rate*).
      *   10 x 0 notes (blank slips for Box B).
  5.  **25 Decision Slips** (One-Box / Two-Box checkbox).
  6.  **Whiteboard & Markers** (For tallying results).
  7.  **3 Volunteers** (Briefed on scoring key and secrecy).

  **Volunteer Briefing (5 mins before start):**
  > "Your job is to be the Predictor. Score the cards using this key. If High Score, put 10k in the envelope. If Low Score, put 0. Seal it. Write their name on it. Do not tell them what you put. Do not change it after they choose. If you make a mistake, note it, but do not fix it. The imperfection is part of the lesson."
