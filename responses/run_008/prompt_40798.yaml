  4.  **Address the Specific Philosophical Questions:**

      *   *Norway & Retributivism:* It's not *purely* forward-looking. A retributivist *can* endorse humane confinement if the deprivation of liberty is the proportional penalty. However, the *release* mechanism (risk-based) is consequentialist.
      *   *America & Fixed Desert:* It's not just fixed. It's layered. There's a "minimum desert" (fixed) but also "administrative discretion" (good time). LWOP represents a "limit case" where desert is infinite.
      *   *Internal Inconsistencies:*
          *   US: Good time (change matters) vs. LWOP (change doesn't matter).
          *   Norway: 21-year cap (desert is finite) vs. Preventive Detention (dangerousness is infinite). *Correction:* Norway treats these as distinct legal categories. Punishment ends, safety measures begin. It's a hybrid system, not necessarily inconsistent if the categories are distinct.
      *   *Malleability of Self:*
          *   Norway: The self is mutable. If the self changes, risk drops, release happens. If the self remains dangerous, confinement continues but isn't called "punishment."
