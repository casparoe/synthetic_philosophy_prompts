      *   *Tone Check:* Ensure American English spelling (e.g., "behavior" not "behaviour", "center" not "centre"). Keep it analytical, not preachy.

  7.  **Final Polish:** Review against the prompt's specific constraints regarding "disciplined separation" of presuppositions. Ensure the distinction between *desert* (backward-looking) and *dangerousness* (forward-looking) is clear in both contexts. (Self-correction: Ensure I don't simplify Norway too much; their system is nuanced).

