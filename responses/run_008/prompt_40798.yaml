      *   *Official Theory:* Rehabilitation/Reintegration (Consequentialist/Utilitarian).
      *   *Retributive Compatibility:* Can a retributivist support this? Yes, if "loss of liberty" is the proportional harm. Humane conditions don't negate the deprivation.
      *   *The "Wrinkle" (Preventive Detention):* This is the crack in the pure retributive facade. If you serve your desert (21 years) but stay because you're dangerous, that's purely consequentialist (incapacitation).
      *   *Self-Malleability:* High. People can change. If they don't change (remain dangerous), the state intervenes, but the *punishment* part is capped.

  3.  **Deconstruct the American Model:**
      *   *Practices:* "Corrections," LWOP, Death Penalty, Three-Strikes, Solitary, Disenfranchisement, Good Time/Parole.
      *   *Official Theory:* Mixed bag. "Corrections" implies rehabilitation (Consequentialist). LWOP/Death Penalty implies permanent exclusion/retribution.
      *   *The "Wrinkle" (Good Time vs. LWOP):* Good time implies desert is dynamic (you can earn your way out). LWOP implies desert is static/absolute (some crimes break the ledger forever).
      *   *Self-Malleability:* Contradictory. Parole assumes change is possible. LWOP/Three-Strikes assume the "criminal self" is fixed or that the past act defines the person eternally.
