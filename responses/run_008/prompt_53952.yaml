answer: |-
  # Vagueness: A Decision Tree for Intuitions
  **Course:** PHI 202 • **Topic:** The Sorites Paradox • **Handout:** 04

  Don't start by memorizing labels like "epistemicism" or "supervaluationism." Start by looking at the cases. Below is a flowchart based on six intuitive questions about a Sorites series (e.g., a man losing hair one by one, or a color patch shifting from red to orange). Follow your gut answers to find the philosophical position that matches your actual commitments.

  ### The Tree

  **START:** Consider a Sorites series of 10,000 men, from Fully-Haired (1) to Completely-Bald (10,000).

  **Q1. Tolerance:** Is there *any* specific pair of adjacent men (e.g., #4,532 and #4,533) where adding/removing a single hair *definitely* changes the status from "bald" to "not bald"?
  *   **YES** → Go to **Q2**.
  *   **NO** (One hair never makes the difference) → Go to **Q3**.

  **Q2. Knowledge:** If there is a sharp cutoff, could an omniscient being (God) know exactly where it is?
  *   **YES** → **Naïve Realism** (Rare; usually rejected due to Sorites pressure).
  *   **NO** (It is in principle unknowable) → **Epistemicism**.
      *   *Note: This view holds bivalence is true, but our access is limited by "margin for error" principles.*

  **Q3. Existence:** Even if there is no sharp line, are there *any* bald men and *any* non-bald men in the series?
  *   **NO** (Nobody is bald; "bald" refers to nothing) → **Nihilism / Eliminativism**.
  *   **YES** (Some are clearly bald, some clearly aren't) → Go to **Q4**.

  **Q4. Bivalence:** Take a clear borderline case (e.g., #5,000). Is the sentence "He is bald" strictly **True** or strictly **False**?
  *   **YES** (It must be one, even if indefinite) → **[EMPTY CELL]**.
      *   *Why empty?* If you deny a sharp cutoff (Q1) but insist every statement is True/False (Q4), you claim truth values change without any difference in the world. In a finite series, this is logically incoherent.
  *   **NO** (It is neither, or not quite true) → Go to **Q5**.

  **Q5. Source:** Why is it neither True nor False? Is it because the *property* (baldness) is fuzzy in the world, or because our *word* ("bald") is imprecise?
  *   **WORLD IS FUZZY** (Properties come in degrees) → **Degree Theory / Fuzzy Logic**.
      *   *Note: Truth is a value between 0 and 1.*
  *   **WORD IS IMPRECISE** (Linguistic indecision) → Go to **Q6**.

  **Q6. Context:** When you say "He is bald" about a borderline case, does the truth value depend on what the conversation has fixed (e.g., comparing him to a basketball player vs. a sumo wrestler)?
  *   **YES** (Context resolves the gap; it becomes T or F in context) → **Contextualism**.
      *   *Note: Vagueness is a feature of use, not meaning. Gaps close when standards sharpen.*
  *   **NO** (It remains unsettled even in context) → Go to **Q7**.

  **Q7. Definiteness:** Is it true that "It is *definitely* the case that he is bald"?
  *   **YES** → (Return to Q4; you likely accept Bivalence).
  *   **NO** (It is indefinite whether it is definite) → **Supervaluationism**.
      *   *Note: Truth is "supertruth" (true on all precisifications). Borderlines are true on some, false on others, hence neither super-true nor super-false.*

  ---

  ### Instructor Notes on Logical Space

  **1. The "Incoherent Bivalence" Cell (Q1-No / Q4-Yes)**
  Students often want to say there are no sharp boundaries but that everything is still true or false. In a finite Sorites series, this is impossible: if every step is T/F, there must be a switch. This cell is occupied only by those who mistakenly think they can keep classical logic without a cutoff.

  **2. The Supervaluationism / Contextualism Overlap**
  This tree separates them at Q6, but be honest: these views are close cousins. Both treat vagueness as semantic indecision. Some "Dynamic Contextualists" argue that context *usually* fixes truth, but can fail to, looking exactly like Supervaluationism. If you find yourself hovering between Q6-Yes and Q6-No, you are in good company; the distinction often comes down to whether you think the gap is *resolvable* (Contextualism) or *ineradicable* (Supervaluationism).

  **3. The "Ontic Gaps" Cell (Q5-World / Q4-No)**
  If you say the *world* is fuzzy but reject degrees (Q4-No), you posit "ontic indeterminacy." This is logically possible but metaphysically extravagant (why would reality itself be vague?). Most who choose "World" at Q5 accept Degree Theory.

  ---

  ### Diagnostic Run: Your Intuitions

  Let's run your specific profile through the tree to see where you land.

  1.  **Tolerance:** You say a single hair can *never* make the difference.
      *   *Path:* **NO** → Go to Q3.
  2.  **Existence:** You reject the nihilist escape ("nobody is bald").
      *   *Path:* **YES** → Go to Q4.
  3.  **Bivalence:** You say of a borderline patch, "that's red" is *neither true nor false*.
      *   *Path:* **NO** → Go to Q5.
  4.  **Source:** You want "'no fact of the matter' to be a fact about our linguistic practice rather than about the world."
      *   *Path:* **WORD IS IMPRECISE** → Go to Q6.
  5.  **Context:** Here is your tension. You say the statement is "neither true nor false" (implying **NO**, context doesn't fix it), *but* you also say you get "nervous about gaps for simple present-tense observation statements."
      *   *Analysis:* The "nervousness" suggests you *wish* context fixed it (Contextualism), because Contextualism allows us to assert simple observations without truth-value gaps. However, your explicit truth-value judgment ("neither") forces you down the Supervaluationist path. Supervaluationism accepts the gap but explains it as linguistic indecision.
      *   *Path:* **NO** (based on explicit truth-value judgment) → Go to Q7.
  6.  **Definiteness:** You find sharp cutoffs repugnant (consistent with Q1) and accept indeterminacy.
      *   *Path:* **NO** → **Supervaluationism**.

  **Diagnosis:** You are a **Supervaluationist** with Contextualist sympathies.
  **The Conflict:** The pair of answers doing the fighting is: *(A) "That's red" is neither true nor false* vs. *(B) "Nervous about gaps for simple observation statements."*
  Answer (A) commits you to truth-value gaps. Answer (B) suggests you find gaps intuitively costly for ordinary discourse. Supervaluationism pays that cost (we cannot truly assert borderlines); Contextualism avoids it (context makes them assertible). You currently accept the cost, but your nervousness suggests you might be happier relaxing (A) to allow context to resolve the truth value.

  \answer{Supervaluationism}
