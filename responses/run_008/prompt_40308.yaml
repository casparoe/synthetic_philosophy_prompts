answer: |-
  **MEMORANDUM**
  **TO:** Public-Art Committee Member
  **FROM:** Philosophical Consultant
  **SUBJECT:** Disentangling "Beauty is in the Eye of the Beholder" for Committee Deliberation

  Below is an ordered dissection of the proverb used to stall our vote. The readings range from a trivial observation to a radical philosophical claim. For each, I have provided a verdict on its truth-status, its implication for our deliberative process, and whether it supports your position (that one sculpture is objectively better made) or your colleague's (that we should refuse to adjudicate).

  ### 1. The Psychological Observation
  *   **Thesis:** Different perceivers have different emotional and sensory responses to the same object. (e.g., "I like the angular one; you like the curved one.")
  *   **Verdict:** **Trivial Platitude.** Everyone accepts this. It is an empirical fact about human variation.
  *   **Implication for Deliberation:** This **merely reframes** what deliberation is about. It acknowledges difficulty but does not preclude judgment. It explains *why* we might disagree, not *that* we cannot decide.
  *   **Supports Refusal to Adjudicate?** **No.** The fact that people have different pulse rates does not stop a doctor from diagnosing a heart condition. Similarly, varied responses do not stop a committee from selecting the work that best serves the public space.
  *   **Consistency:** Consistent with your position. You can acknowledge varied responses while still arguing one work succeeds more effectively at its task.

  ### 2. The Epistemic Limitation
  *   **Thesis:** Aesthetic disagreement cannot be resolved by logical proof or argument, but only by further exposure, experience, or cultivation of sensitivity. (e.g., "You can't argue someone into seeing the beauty; they have to feel it.")
  *   **Verdict:** **Defensible.** This is a substantive claim about how aesthetic knowledge works. It is widely accepted that aesthetic judgment requires perception, not just calculation.
  *   **Implication for Deliberation:** This **reframes** the deliberation. It suggests our job is not to "prove" a winner mathematically, but to pool our informed perceptions. It demands we look longer and discuss *why* we feel as we do, rather than voting immediately.
  *   **Supports Refusal to Adjudicate?** **No.** It argues that adjudication is *harder* than scientific measurement, not impossible. It licenses further discussion, not silence.
  *   **Consistency:** Consistent with your position. You can argue that your preference is based on a more attentive viewing or a better understanding of the artist's intent.

  ### 3. The Metaphysical Relativist Claim
  *   **Thesis:** There is no fact of the matter about which work is better; aesthetic value exists only relative to the observer. (e.g., "Neither piece is actually better; 'better' is just a projection.")
  *   **Verdict:** **Substantive and Contestable.** This is a philosophical position (relativism), not a fact. Many philosophers and critics reject it, arguing that aesthetic properties (balance, craftsmanship, coherence) are real features of the object-world relation.
  *   **Implication for Deliberation:** This **supports refusing to adjudicate.** If there is no fact of the matter, a vote is merely a headcount of preferences, not a judgment of quality.
  *   **Supports Refusal to Adjudicate?** **Yes.** This is the reading your colleague likely intends to weaponize. It renders the committee's expertise irrelevant.
  *   **Consistency:** **Inconsistent** with your position. If this is true, your claim that one is "better made" is false.

  ### 4. The Non-Cognitivist / Error-Theoretic Claim
  *   **Thesis:** Aesthetic judgments do not state truth-evaluable propositions at all; they are merely expressions of emotion (e.g., "This sculpture is good" means only "I like this sculpture").
  *   **Verdict:** **Defensible but Beside the Point.** This is a technical meta-ethical view. Even if true, it does not stop social decision-making. We make non-truth-apt decisions (e.g., "We prefer chocolate over vanilla") all the time when allocating resources.
  *   **Implication for Deliberation:** This **supports refusing to adjudicate** *on quality*, but forces adjudication *on preference*. It turns the meeting into a political negotiation rather than an evaluative one.
  *   **Supports Refusal to Adjudicate?** **Yes, regarding quality.** It denies the category of "quality" exists.
  *   **Consistency:** **Inconsistent** with your position. It reduces your argument about craftsmanship to a mere report of your personal mood.

  ***

  ### Background Notes: Hume and the Politics of Taste

  To effectively counter Readings 3 and 4 at the next meeting, you need to address the two deeper currents driving your colleague's use of the proverb.

  **1. The Humean Coherence Check**
  You asked if David Hume's position is coherent: *How can beauty be subjective (not in the object) while some judges are still "better" than others?*
  *   **The Verdict:** It is **coherent**, not an illicit slide.
  *   **The Argument:** Hume argues that while beauty is a sentiment felt by the observer, not a property like weight, the *conditions* under which that sentiment arises can be evaluated. We do not say a wine has "sweetness" independent of a tongue, yet we agree a sommelier has a "better" palate than a novice because the sommelier's organs are unimpaired, their attention is practiced, and they have no prejudice.
  *   **Application for You:** Use this to argue that the committee *is* the "joint verdict of qualified critics." We are not looking for a magical property in the bronze; we are acting as the "ideal observers." Your colleague's proverb ignores that *expertise* exists even within subjectivity. We are not voting on what we "like" personally; we are voting on what we judge to be successful *as public art*.

  **2. The Political Worry (The "Dominant Taste" Critique)**
  Your colleague's deeper resistance is likely not metaphysical relativism, but a sociopolitical critique: *Who gets to be the "qualified judge"?* They fear that "standards of quality" are just the preferences of the socially dominant coded as objective truth.
  *   **The Verdict:** This is a **valid concern**, but it does not license the use of the proverb to shut down debate.
  *   **The Argument:** If the worry is that "standards" are exclusionary, the solution is not to abandon standards (Reading 3), but to **democratize the standard.** In public art, the "truth" of the work is not its eternal beauty, but its **fitness for this specific community.**
  *   **Application for You:** Reframe the deliberation. Argue that you are not appealing to an elite, universal standard of "Beauty," but to a functional standard of "Public Value."
      *   *Say this:* "I am not arguing that this sculpture is universally beautiful. I am arguing that it is better *for this plaza*, given the budget, the maintenance requirements, and the sightlines. That is a factual claim we can adjudicate, regardless of our personal tastes."

  ### Strategic Recommendation
  At the next meeting, do not attack the proverb directly. Instead, force your colleague to specify which reading they are using.

  1.  If they mean **Reading 1 (Psychological)**, agree, and move to a vote. ("We know we see it differently; that's why we vote.")
  2.  If they mean **Reading 2 (Epistemic)**, propose a site visit or extended viewing. ("Let's go look again so we can feel it more deeply.")
  3.  If they mean **Reading 3 or 4 (Relativism/Non-Cognitivism)**, challenge them on the **Public Trust**. ("If there is no fact of the matter about which work is better for the public, why were we appointed? Our mandate is to judge, not to survey preferences.")

  **Summary for your pocket:**
  *   **Readings 1 & 2:** Trivial/Defensible. **Do not support refusal.** Use these to keep talking.
  *   **Readings 3 & 4:** Contestable/Beside the point. **Support refusal.** Challenge these by appealing to *fitness for purpose* rather than *eternal beauty*.
