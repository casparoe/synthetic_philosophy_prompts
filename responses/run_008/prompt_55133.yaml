  ### The mapping

  *   **Statute:** The Anti-Humean law (a governing constraint existing independently of instances).
  *   **Demographic Generalization:** The Humean law (a Best System summary of regularities).
  *   **Legislature:** The Divine Lawgiver (Voluntarism) or the Necessitation Relation (Armstrong).
  *   **Enforcement/Sanctions:** Physical necessity (causal powers) vs. Legal penalties (fines/imprisonment).
  *   **Governed Behavior:** Physical events (particle trajectories) vs. Citizen conduct.
  *   **Data:** The Humean Mosaic (spatiotemporal distribution of local qualities) vs. Census records.
  *   **Law-maker's Intent:** Nature's essence vs. Legislative will.

  This mapping reveals the classmate's strategy: she equates the Anti-Humean "governing" role exclusively with the legal statute model, implying that without a legislature and sanctions, the concept collapses into the demographic model. She forces a dilemma: either laws are commands (implausible) or summaries (Humeanism).

  ### Where the analogy breaks

  The analogy falters primarily on the distinction between prescriptive and descriptive norms. Legal statutes are prescriptive; they dictate how agents *ought* to behave, and crucially, they can be violated (a crime occurs). Natural laws, even on governing views, are typically descriptive of how things *must* behave; a violating event usually counts as evidence against the law's existence (or a miracle), not a "crime." Furthermore, demographic generalizations are accidental; they hold only contingently based on past data. Physical laws like the Schrödinger equation support robust counterfactuals (what *would* happen if conditions changed), which mere summaries struggle to ground. A demographic trend offers no reason why a specific individual *must* die at age 80, whereas a physical law dictates the interaction of particles. Finally, legal governance targets rational agents capable of understanding rules. Electrons do not "obey" equations in an intentional sense. Anti-Humeans like Armstrong do not posit a celestial legislator issuing commands, but rather objective relations of necessitation between universals. The analogy imports agency where the metaphysical theory posits only structure.

  ### Disanalogies that matter versus ones that don't

  Several disanalogies are superficial. The lack of a literal legislature or police force does not threaten Anti-Humeanism because modern necessitarians (unlike Divine Command theorists) do not rely on agency. "Governing" metaphysically means determining truth conditions, not issuing threats. Therefore, mocking the lack of sanctions misses the target. However, some disanalogies strike deep. The epistemic access problem matters: we only observe the "data" (the mosaic), never the "statute" directly. If the law is transcendent to the data, how do we know it exists? Additionally, the explanatory direction matters. In the legal case, the statute explains the conduct. In the Humean view, the mosaic explains the law. The analogy hides this conflict by treating the demographic summary as the only alternative to legislation. Crucially, the claim that "a pattern cannot push" begs the question: Anti-Humeans deny laws are patterns; they are the metaphysical grounds *of* the patterns. To say a pattern can't push is true but irrelevant if laws aren't patterns.

  ### Does the conclusion survive?

  The analogy provides rhetorical force but fails as a proof. It successfully paints governing laws as spooky by conflating "governing" with "legislating." If governing requires a legislator, Humeanism wins by default since there is no God in the physics lab. However, this is a straw man against Armstrong-style necessitation. The analogy does not demonstrate that necessitation relations are incoherent, only that they are unlike human laws. Consequently, Humeanism cannot rest on this comparison alone. It requires independent arguments regarding ontological parsimony, the supervenience of truth on being, and the avoidance of quidditistic mysteries. The analogy illustrates the Humean intuition—that the mosaic is all there is—but it cannot validate it without assuming the very conclusion it seeks to prove: that nothing exists over and above the regularities. It is a pedagogical tool, not a metaphysical argument. Ultimately, the classmate's argument relies on an intuition pump that favors empiricism, shifting the burden of proof unfairly onto the Anti-Humean to explain "pushing."

  ### A better analogy, if there is one

  Consider the rules of chess versus statistics of play. A statistician notes, "Knights usually move in L-shapes." A rule-book states, "Knights *must* move in L-shapes." The statistician summarizes the data; the rule-book constrains valid moves. This captures the modal force of laws without implying a police force or intentional obedience. It distinguishes between what *does* happen (Humean mosaic) and what *can* happen (modal space), allowing us to see governing as structural constraint rather than divine command. It avoids the legal baggage entirely.
