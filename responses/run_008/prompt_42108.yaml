prompt: |-
  ok so I'm a high school junior and this semester I get to do an independant research project on basically any topic, and I picked the thing where philosophers test their thought experiments on people from different cultures and find out people don't always agree — the Gettier cases, the trolley cases, and the name-reference ones where some populations go descriptivist and others don't. the thing is I've got one semester, no budget, and no way to run surveys abroad, so I can't study everything. I don't want a survey of the field or a reading list — I want you to rank the open questions by which is most worth my limited effort, and defend the order, not just vibes. some candidates I can think of (tell me if I'm missing a big one): whether the cross-cultural disagreements mean people have literally different concepts, so the thought experiments aren't even testing the same thing, versus same concepts plus different background beliefs; whether stuff like schooling style or socioeconomic status is doing work that "culture" gets the credit for; and whether philosophers' own trained intuitions should count as a bias or as a qualification. also be honest if the answer is that a high schooler can't really advance any of these and the best I can do is structure the problem well.

  please structure your answer with these sections in this order: "the short version" (~100 words), "ranked questions" (~350 words), "why this order and not another" (~200 words), "what I could actually do in one semester" (~150 words), and "what would change the ranking" (~100 words).
