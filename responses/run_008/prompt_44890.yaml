answer: |-
  # Activity: The Editor's Desk

  **Time:** 25 Minutes (Activity) + 25 Minutes (Debrief)
  **Class Size:** 20 Students (10 Pairs)
  **Materials:** 10 Envelopes per pair (prepped), Score sheets, Pens.

  ## Part 1: The Activity Setup (5 Minutes)

  Divide the class into 10 pairs. Assign one student per pair as the **Informant** and the other as the **Editor**. Explain that this is a simulation of an information pipeline, not a gambling game.

  **The State of the World:**
  You (the instructor) hold a deck of 100 cards. 99 are Red, 1 is Black.
  For each round, a card is drawn (by you, hidden from students) and placed in an envelope.
  *   **Round 1 (Perception):** The Informant opens the envelope and looks at the card.
  *   **Round 2 (Lottery):** The Informant does *not* open the envelope. They are handed a note saying: *"This card is from the 99-Red deck."* (The card is, in fact, Red).
  *   **Round 3 (Guess):** The Informant does *not* open the envelope. They are handed a note saying: *"No information available."* (The card is, in fact, Red).

  **The Task:**
  1.  **Informant:** Based on your evidence, you may choose to **Assert** ("The card is Red") or remain **Silent**.
  2.  **Editor:** If the Informant Asserts, you must choose to **Publish** (Accept) or **Spike** (Challenge).
  3.  **Constraint:** If you **Spike**, you must write down the exact question or objection you would say to the Informant.

  **The Payoff (Points, not money):**
  *   **Informant:** +10 points if Published. -5 points if Spiked. 0 if Silent.
  *   **Editor:** +10 points if Published and Card is Red. -20 points if Published and Card is Black. 0 points if Spiked.

  *Instructor Note:* Emphasize that the Editor's penalty for publishing a Falsehood is double the reward for a Truth. This creates risk aversion, but in Round 2, the odds are overwhelmingly in their favor. If they were purely rational expected-value maximizers, they should Publish Round 2 every time.

  ## Part 2: Running the Rounds (15 Minutes)

  Run the three rounds sequentially. Collect the "Spike" sheets from the Editors after each round. Keep the scores visible on the board to maintain engagement.

  *   **Round 1:** Expect near-universal Assert/Publish.
  *   **Round 2:** Watch for hesitation. Informants may say "It's probably Red" rather than "It is Red." Editors may Spike despite the 99% odds.
  *   **Round 3:** Expect Silence or Spikes.

  ## Part 3: The Debrief (25 Minutes)

  ### 1. Data Reveal (5 Minutes)
  Project the collected "Spike" questions on the board. Group them by round.
  *   **Round 1 Data:** Likely very few spikes. Questions might be "Are you sure?" (perceptual check).
  *   **Round 2 Data:** This is the crux. You will likely see spikes despite the card being Red. Look at the *text* of the challenges.
      *   *Expected:* "How do you know?" "Did you see it?" "Where is this coming from?"
      *   *Unexpected:* "It might be black." (Truth challenge).
  *   **Round 3 Data:** Spikes or Silence. Challenges: "You're guessing."

  ### 2. Introducing the Norms (10 Minutes)
  Tell the students: "You just acted out three competing theories of what governs assertion. Let's map them."

  *   **The Truth Norm:** *Assert $p$ only if $p$ is true.*
      *   *Test:* In Round 2, the card *was* Red. The assertion was True.
      *   *Data:* Yet, many of you Spiked it or felt hesitant. If Truth were the only norm, Round 2 should look exactly like Round 1. It didn't.
  *   **The Belief Norm:** *Assert $p$ only if you believe $p$.*
      *   *Test:* In Round 2, the Informant rationally believed the card was Red (99% confidence).
      *   *Data:* Yet, Informants hesitated to say "It is Red," often hedging ("It's probably Red"). Editors rejected flat assertions. Belief alone seems insufficient.
  *   **The Knowledge Norm:** *Assert $p$ only if you know $p$.*
      *   *Test:* In Round 2, the Informant had high probability but no *knowledge* (statistical evidence alone doesn't yield knowledge of the specific case).
      *   *Data:* This fits the hesitation. You treated Round 2 more like Round 3 (Guess) than Round 1 (Perception), despite the high probability of truth.

  ### 3. The Hard Question: Knowledge vs. Justified Belief (10 Minutes)
  Press the students on the "Spike" questions from Round 2.
  *   **Ask:** "Look at the challenges. Did anyone write 'You don't know that'? Or did you write 'You aren't certain enough'?"
  *   **The Problem:** If an Editor Spiked because 99% isn't *certain enough*, they might be advocating for a **Certainty Norm**, not a Knowledge Norm. If they Spiked because statistical evidence isn't the *right kind* of justification, they are leaning toward Knowledge.
  *   **The Data Limit:** Acknowledge that the activity data alone cannot definitively distinguish between a **Knowledge Norm** and a **High-Justification Norm**.
      *   *Knowledge View:* You lack knowledge in the lottery case because your evidence isn't sensitive to the specific fact.
      *   *Justified Belief View:* You have justified belief, but the *stakes* of the activity (the -20 penalty) raised the threshold for how much justification is required.
  *   **Conclusion:** The activity proves Truth and Simple Belief are insufficient. It suggests an epistemic authority is required. Whether that authority is strictly "Knowledge" or "Contextually High Justification" is the next philosophical battle.

  ***

  ## Post-Activity Note: What Will Go Wrong

  **1. The "Gambler" Problem**
  Be frank: The point system is your biggest risk. Second-year students are trained to maximize expected value. In Round 2, the expected value of Publishing is +9.8 points. The expected value of Spiking is 0.
  *   **Predictable Failure:** Smart students will ignore their intuitions, Publish every Round 2 assertion, and tell you in the debrief that "Rationality dictates we take the points." This kills the phenomenological data.
  *   **The Fix:** You must supply the **normative framing** that the points cannot. In the instructions, say: *"You are not gamblers; you are gatekeepers of a newsroom. Your reputation depends on not publishing things you can't vouch for, even if they turn out true."* You have to verbally inject the "assertability" condition because the point system inherently rewards truth-tracking.

  **2. The "Challenge Shape" Limitation**
  The activity cannot fully reproduce the naturalistic "How do you know?" phenomenon because you are *forcing* a written challenge.
  *   **Limitation:** In real life, the challenge is spontaneous. Here, it is a bureaucratic requirement of the "Spike" action. Students might write "False" just to fill the box, or "Bad odds" because they are thinking about the points.
  *   **What You Must Supply:** You will have to ask them orally in the debrief: *"When you felt that hesitation in Round 2, what was the voice in your head saying? Was it 'That's false' or 'You can't say that'?"* You have to elicit the modal distinction (truth vs. propriety) verbally, because the written data will be noisy.

  **3. Confidence Assessment**
  *   **Confidence Level:** **85%**.
  *   **Why:** The Lottery Intuition is robust; even when students try to game the points, the feeling of "impropriety" in asserting statistical facts usually bleeds through in their hesitation or hedging language.
  *   **Least Sure Point:** I am least sure that the **Challenge Shape** will naturally emerge as "How do you know?" rather than "What are the odds?" Without the instructor carefully curating the "Spike" questions during the reveal (highlighting the epistemic ones and downplaying the probabilistic ones), students might interpret their own behavior as risk-aversion rather than a norm of assertion. You will need to steer the interpretation of the data heavily in the debrief to ensure they see it as a normative constraint rather than a pragmatic calculation.
