answer: |-
  ### 1. The Distinction: Transient vs. Permanent Underdetermination

  The problem of the underdetermination of theory by evidence (UDT) arises when the available empirical evidence is compatible with two or more conflicting theories. The distinction between **transient** and **permanent** underdetermination concerns the temporal and modal scope of this compatibility.

  *   **Transient Underdetermination:** This occurs when current evidence is insufficient to decide between competing theories, but it is expected that *future* evidence (or new experimental techniques) will eventually break the tie. This is the standard state of affairs in ongoing scientific research.
  *   **Permanent Underdetermination:** This occurs when two theories are empirically equivalent (EE) such that *no* possible evidence (or no evidence accessible to human inquirers) could ever distinguish between them. They predict the same observable outcomes in all possible circumstances.

  **Why Only Permanent Underdetermination Threatens Scientific Realism**
  Scientific realism generally holds that our best scientific theories are (approximately) true descriptions of a mind-independent world.
  *   **Consensus:** It is widely agreed among philosophers of science that **transient underdetermination poses no serious threat to realism.** Realists acknowledge that science is incomplete; the fact that we cannot currently distinguish between two hypotheses does not imply that neither is true, only that we do not yet know which one is. Truth is viewed as a limit of inquiry that we are approaching.
  *   **Consensus:** **Permanent underdetermination is taken to be the serious threat.** If two theories are permanently underdetermined, then empirical evidence can never favor one over the other. If the evidence cannot decide, the realist lacks a justification for believing one theory describes the "real" structure of the world while the other does not. This leads to anti-realist conclusions (e.g., instrumentalism), suggesting that theory choice is driven by non-epistemic values (simplicity, convenience) rather than truth.

  ### 2. Kyle Stanford's Treatment: The "New Induction"

  Kyle Stanford's contribution, primarily in *Exceeding Our Grasp* (2006), reframes this debate. He argues that the traditional focus on permanent underdetermination (finding actual, existing rival theories that are empirically equivalent) is misplaced.

  *   **Stanford's Critique of Traditional UDT:** Stanford argues that there is little consensus that *actual* cases of permanent underdetermination exist in the history of science (more on this below). Therefore, building anti-realism on the existence of permanent rivals is weak.
  *   **The Problem of Unconceived Alternatives (PUA):** Stanford proposes a "New Induction." The problem is not that we have *rivals* we cannot distinguish (permanent UDT); the problem is that at any given time, scientists fail to conceive of the *actual* theory that will eventually replace their current one.
  *   **Interaction with the Distinction:** For Stanford, the transient/permanent distinction is less important than the **conceived/unconceived** distinction. He argues that even if underdetermination is merely transient (we will eventually find evidence), we cannot trust our current theories to be approximately true because history shows they will likely be replaced by theories we cannot yet imagine. Thus, Stanford accepts that permanent UDT (in the sense of existing rivals) might be rare, but argues the *epistemic situation* is just as dire because of our limited imaginative capacity.

  ### 3. The Duhem–Quine Thesis and the Permanence of Underdetermination

  The Duhem–Quine (DQ) thesis asserts holism: hypotheses are not tested in isolation but as part of a web including auxiliary assumptions. If a prediction fails, one can preserve the core theory by adjusting the auxiliaries.

  **Does DQ Entail Permanent Underdetermination?**
  *   **Contested:** There is significant disagreement on whether DQ entails permanent underdetermination.
  *   **The "Stubbornly Transient" View (Mainstream/Realist):** Most philosophers of science (including realists like Stathis Psillos and many critical rationalists) argue that DQ shows underdetermination is **often transient yet stubbornly long-lived**, but not permanent. While one *can* logically preserve a theory by adjusting auxiliaries, doing so often renders the theory *ad hoc*, complex, or inconsistent with other well-supported theories. Non-empirical virtues (coherence, simplicity, explanatory power) eventually break the tie. On this view, DQ makes falsification difficult, but not impossible in the long run.
  *   **The "Permanent" View (Radical Holism/Constructivism):** Some interpretations of Quine suggest that because any statement can be held true come what may (if we make drastic enough adjustments elsewhere), underdetermination is in principle permanent. However, this is generally viewed as a logical point about language and belief systems, not a practical constraint on scientific inquiry.
  *   **Consensus:** It is **not settled** that DQ entails permanent underdetermination in a way that threatens realism. The consensus leans toward the view that DQ explains why underdetermination persists *transiently*, but that methodological constraints usually resolve it over time.

  ### 4. Drawing the Line: Principle vs. Accessibility

  You asked what the transient/permanent line contrasts: resolvability in principle by *some possible* evidence versus resolvability by evidence *we can actually obtain*. This maps onto the distinction between **logical** and **epistemic** underdetermination.

  *   **Logical Permanent UDT:** No possible evidence (even for an omniscient observer) could distinguish the theories. (e.g., perhaps different formulations of the same mathematical structure).
  *   **Epistemic Permanent UDT:** Evidence exists in principle, but it is causally or physically inaccessible to human inquirers (e.g., events beyond the cosmological horizon, or sub-Planck scale phenomena).

  **The Circularity Worry**
  Drawing this line non-circularly is genuinely **contested** and difficult.
  *   **The Problem:** To claim underdetermination is "permanent," one must assert that no future evidence *will* or *can* arise. But since we cannot predict future scientific developments (a point Stanford emphasizes), claiming a case is permanently underdetermined often looks like a failure of imagination.
  *   **Circularity Risk:** If we define "permanent" as "evidence we cannot obtain," we must justify *why* we cannot obtain it. If the justification is "we haven't found it yet," the claim is circular (assuming permanence to prove permanence). If the justification is physical law (e.g., Heisenberg uncertainty), the claim relies on the truth of the very theories under dispute.
  *   **Stanford's Insight:** Stanford argues that because we have a historical record of failing to anticipate future evidence and theories, we are never in a position to confidently declare a case of underdetermination "permanent" or "resolved." We are always in a state of epistemic humility.

  ### 5. Consensus vs. Contest: Real Scientific Cases

  It is crucial to distinguish between the *logical possibility* of permanent underdetermination and its *instantiation* in actual science.

  *   **Settled:** There is **no consensus** that any real scientific case actually instantiates permanent underdetermination.
  *   **Contested (The Quantum Mechanics Case):** The most frequently cited candidate is the various interpretations of Quantum Mechanics (e.g., Copenhagen vs. Many-Worlds vs. Pilot Wave).
      *   *Anti-Realist View:* These are empirically equivalent and permanently underdetermined; therefore, we should not be realists about the wave function.
      *   *Realist View:* These are not strictly empirically equivalent (some suggest potential future tests, e.g., gravity-induced collapse), or they are not distinct theories but distinct metaphysical glosses on the same formalism.
      *   **Constraint Check:** As requested, this must not be presented as a settled fact. It remains a live debate whether these interpretations constitute a case of permanent UDT or merely a transient lack of experimental resolution.
  *   **Contested (Spacetime Models):** Cases like Newtonian mechanics with absolute space vs. relational space are often cited. However, many argue these are not distinct physical theories but representational variants, dissolving the UDT problem.

  ### Summary Table of Consensus vs. Contest

  | Claim | Status | Notes |
  | :--- | :--- | :--- |
  | **Transient UDT is common in science.** | **Settled** | Accepted by realists and anti-realists alike. |
  | **Permanent UDT threatens Scientific Realism.** | **Settled** | If true, it undermines truth-claims; realists must deny it exists. |
  | **Duhem-Quine entails Permanent UDT.** | **Contested** | Most mainstream philosophers deny this; radical holists accept it. |
  | **Actual cases of Permanent UDT exist (e.g., QM).** | **Contested** | No consensus. Realists argue rivals are not truly EE or will be distinguished. |
  | **Stanford's PUA replaces Traditional UDT.** | **Contested** | Many accept the historical induction; others argue it conflates distinct theories with distinct formulations. |
  | **The Transient/Permanent line can be drawn non-circularly.** | **Contested** | Difficult to prove evidence is inaccessible without assuming current theory is true. |

  ### Conclusion

  In summary, the distinction between transient and permanent underdetermination is the boundary line where scientific realism draws its defense. Realists concede the transient variety as the engine of scientific progress but must deny the permanent variety to maintain that theories track truth. Kyle Stanford complicates this by arguing that the traditional debate over permanent rivals is less damaging than the historical fact of unconceived alternatives. Regarding the Duhem–Quine thesis, the prevailing view is that it renders underdetermination stubborn and transient rather than permanent, as pragmatic and theoretical virtues eventually prune the web of belief. Finally, while the *concept* of permanent underdetermination is clear, its *application* to real science remains deeply contested, with no agreed-upon examples that definitively prove evidence is permanently inaccessible rather than merely currently elusive.
