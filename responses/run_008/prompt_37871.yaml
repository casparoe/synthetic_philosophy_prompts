prompt: |-
  I teach a critical reasoning course at a small liberal arts college -- it's nominally for sophomores, no probability background beyond maybe stats 101, and honestly it's half a philosophy of practical reasoning course. Next week I've got a single 75-minute session on the two-envelope paradox and I want to actually plan it rather than just perform the trick. So don't write me the explanation, write me the plan: the order the pieces have to go in and what depends on what, the setup that should carry the whole session, the misconceptions the students will predictably form and exactly where in the sequence to head each one off, what I should openly decline to cover at this level, and one question I can ask at the end to check that it landed.

  For context, my plan was to open with the setup -- you're handed one of two envelopes, one contains twice the money in the other, you don't know which -- and let them stew on whether to switch before I show them the argument that the expected gain from switching is (1/2)(x/2) + (1/2)(2x) = 5x/4, so you should switch, and then the same argument applies to switching back. But I'm worried about the sequencing: the moment they see the fallacious step, half the class will conclude the whole thing is just a typo in algebra, nothing philosophical, and the other half will conclude expected value is broken and start telling me about Vegas. So what has to be in place before I even show them the switching argument, so the eventual diagnosis lands as revealing rather than deflating? Relatedly, I do want to get to the genuinely disturbing part and not just patch the fallacy: the variant where the amounts are generated by some unbounded random process where switching really does raise expected value (the "always positive probability of a bigger amount" kind of setup), and the infinite-expectation version where you can get E(B) > E(A) and E(A) > E(B) depending on how you slice it. Is that reachable for this audience in one session, or should I be honest and cut it? If reachable, does it go before or after the diagnosis of the finite case -- does the deep version set up the puzzle, or does it reward students who've first seen the shallow one repaired?

  On misconceptions: I can already predict a couple, like "the two envelopes just can't have equal expected values, that's impossible" and conflating conditioning on the actual amount in your envelope with treating that amount as a variable when it isn't one. What else should I expect, and where in the arc does each get absorbed? And what do I refuse to cover at this level -- the measure theory, whatever's going on with divergent expectations -- and how do I say so without making it feel like the course is hiding the good stuff? Finally, the distinction I most want them walking out with is between "the argument is fallacious" and "the conclusion is false," since those come apart in the exotic versions. What single question at the end would actually reveal whether they've got that, rather than whether they can just recite where the 5x/4 computation went wrong?
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **Instructor:** Teaches critical reasoning/philosophy of practical reasoning at a small liberal arts college.
      *   **Students:** Sophomores, no probability background beyond Stats 101 (basic EV, conditional probability).
      *   **Topic:** Two-Envelope Paradox (75-minute session).
      *   **Goal:** A structured lesson plan, not just an explanation. Needs sequencing, setup, misconception management, scope boundaries, and an assessment question.
      *   **Specific Concerns:**
          *   Sequencing: How to prevent students from dismissing it as "just algebra" or "EV is broken" too early.
          *   Depth: Should the infinite/unbounded variants be included? If so, when?
          *   Misconceptions: Predict specific errors (e.g., conflating variable/fixed amount) and place interventions.
          *   Boundaries: What to explicitly exclude (measure theory, etc.) and how to frame it.
          *   Assessment: One question to test the distinction between "argument fallacious" vs. "conclusion false."

  2.  **Deconstruct the Paradox & Pedagogical Challenges:**
      *   *The Core:* You have Envelope A ($x$). Envelope B is either $2x$ or $x/2$. EV of switching = $0.5(2x) + 0.5(x/2) = 1.25x$. Since $1.25x > x$, switch. But symmetry says it shouldn't matter.
      *   *The Trap:* Students often think "It's obviously 50/50" without questioning the prior distribution. Or they think "x is fixed" vs. "x is a variable."
      *   *The "Deep" Version:* If the distribution of money is unbounded (improper prior), switching *can* be rational in specific contexts, or expectations become undefined. This is crucial for the "philosophy of practical reasoning" angle (decision theory limits).
      *   *Time:* 75 minutes is tight for all this.

  3.  **Drafting the Sequence (The Arc):**
      *   *Phase 1: Intuition & Symmetry (15 mins).* Get them to feel the pull of symmetry before introducing the math. If they start with math, they miss the philosophical conflict.
      *   *Phase 2: The Argument (15 mins).* Present the EV calculation clearly. Let the tension build.
      *   *Phase 3: The Diagnosis (Finite Case) (25 mins).* This is the meat. Identify the equivocation on $x$.
      *   *Phase 4: The Deep Cut (Infinite/Unbounded) (15 mins).* Address the "what if" scenario. This validates the "EV is broken" fear but contains it.
      *   *Phase 5: Wrap & Assessment (5 mins).*

      *Refinement on Phase 4:* The prompt asks if the deep version is reachable. For sophomores without measure theory, *true* infinite expectation paradoxes are dangerous. They lead to "math is magic." However, the *unbounded prior* issue is essential to explain why the 50/50 assumption fails. I should focus on the *prior distribution* problem rather than full-blown divergent series, but acknowledge the infinite case as the "horizon" where decision theory breaks. Let's make the "Deep Cut" about the *assumption of the 50/50 probability* given the amount seen, rather than full measure theory. Actually, the prompt specifically mentions the "always positive probability of a bigger amount" setup. I need to include this but keep it conceptual.

  4.  **Addressing Misconceptions:**
      *   *Misconception 1:* "It's obviously 50/50." (Intervention: Ask them to imagine the amounts are $1 and $1,000,000. Does seeing $500,000 change the odds?)
      *   *Misconception 2:* "x is a fixed number." (Intervention: Distinguish between the *value in hand* and the *variable in the formula*.)
      *   *Misconception 3:* "EV is useless." (Intervention: Show EV works fine when priors are defined.)
      *   *Misconception 4:* "The conclusion (switch) is definitely false." (Intervention: Save for the end with the infinite case.)

  5.  **Setting Boundaries:**
      *   Must exclude: Rigorous measure theory, integration over improper priors, specific resolution involving specific distributions (unless illustrative).
      *   Framing: "We are looking at the *structure of reasoning*, not the *calculus of probabilities*."

  6.  **Developing the Assessment Question:**
      *   Needs to distinguish "Bad Math" from "Bad Premise."
      *   Draft: "Is the argument wrong or is the conclusion wrong?"
      *   Better: A scenario where switching *is* rational vs. one where it isn't, asking them to identify the difference.
      *   Best: "Under what conditions would the switching argument actually be sound?" (Tests understanding of the prior distribution requirement).

  7.  **Fleshing out the Plan (Iterative refinement):**

      *   *Opening:* Don't start with math. Start with the choice. Hand out actual envelopes? No, too much prep. Just the scenario.
      *   *The "Stew":* Ask: "Do you switch?" Get a show of hands. Then ask "Why?"
      *   *The Reveal:* Show the 1.25x math. Now everyone wants to switch.
      *   *The Conflict:* But symmetry says it doesn't matter.
      *   *The Diagnosis:* The variable $x$ changes meaning. In one term it's the smaller amount, in the other, the larger. This requires the probability of being in the smaller/larger case to be independent of the amount $x$.
      *   *The "Deep" Part:* Can we construct a case where switching *is* better? Yes, if the distribution is unbounded (Nalebuff variant). This is reachable if we avoid integrals and talk about "always room for a bigger number."
      *   *The Cut:* Explicitly state we aren't doing the "infinite expectation" calculus because it requires math tools we don't have, but the *philosophical* point is that decision rules depend on background knowledge (priors).

  8.  **Final Review against Constraints:**
      *   75 minutes? Yes, the timing looks tight but doable.
      *   Sophomores? Yes, keep integrals out, focus on the logic of variables.
      *   Misconceptions addressed? Yes, specifically the "x" equivocation and the "50/50" assumption.
      *   Assessment question? Needs to be sharp.

      *Self-Correction on the "Deep" Version:* The prompt asks about the version where $E(B) > E(A)$ and $E(A) > E(B)$. That's the infinite expectation paradox. For a 75-min intro class, trying to explain how $E(A) > E(B)$ and $E(B) > E(A)$ simultaneously might melt brains. Better to focus on the *Nalebuff* variant (switching is always beneficial given specific unbounded priors) as the "reward" for fixing the finite case. It shows the conclusion *can* be true even if the original argument was flawed. This hits the "argument fallacious vs conclusion false" distinction perfectly.

      *Refining the Assessment:* The question needs to force them to acknowledge that the *argument* was bad (equivocation) but the *conclusion* (switch) isn't necessarily false in all worlds.
      *Question:* "If I tell you the money was put in the envelopes using a specific random process where very large numbers are possible, does the original 1.25x argument become valid, or do we need a new argument for the same conclusion?"

      *Wait, one more check:* The prompt asks for *one* question to check if they got the distinction between "argument fallacious" and "conclusion false."
      *Idea:* "Imagine a world where the casino uses a specific dice roll to determine the money. In that world, switching *does* increase expected value. Did the original 1.25x proof become correct in that world, or is it still broken?"
      *Answer they should give:* Still broken (wrong reasoning), but the conclusion (switch) happens to be true.

  9.  **Finalizing the Plan Structure:**
      *   **Title:** The Two-Envelope Paradox: Reasoning under Ignorance.
      *   **Objective:** Distinguish valid inference from true conclusions; understand the role of background assumptions (priors) in decision theory.
      *   **Timeline:**
          1.  Setup & Intuition (15m)
          2.  The Dominance Argument (15m)
          3.  The Diagnosis (Equivocation) (25m)
          4.  The "Exotic" Twist (Unbounded Priors) (15m)
          5.  Assessment & Close (5m)
      *   **Misconception Mapping:** Map specific errors to specific timeline points.
      *   **Exclusions:** Measure theory, specific integration.
      *   **Assessment:** The "Broken Proof/True Conclusion" question.

  10. **Writing the Response:** (Adhering to the persona of a helpful colleague/consultant, structured clearly). *Self-correction:* Ensure I explicitly answer the "infinite expectation" vs "unbounded prior" distinction. The prompt mentions "E(B) > E(A) and E(A) > E(B)". This is the infinite mean paradox. I should advise *against* trying to derive this in class but *mention* it as the reason why we stop at the unbounded prior discussion. It's too technical. I will recommend focusing on the Nalebuff variant (switching is always rational) rather than the contradictory expectations one, as it serves the philosophical point better without the math meltdown.

      *Wait, re-reading prompt:* "the infinite-expectation version where you can get E(B) > E(A) and E(A) > E(B) depending on how you slice it. Is that reachable...?"
      *Decision:* Be honest. It is *not* reachable in a way that satisfies critical reasoning goals without getting bogged down in math mysticism. Better to cut it but acknowledge its existence as the "horizon." Focus on the *unbounded prior* (Nalebuff) where switching is rational, which is conceptually reachable.

      *Let's refine the Assessment Question:* "The original calculation proves you should switch. We found a flaw in the calculation. If I give you a specific distribution where switching *is* actually better, does that fix the original calculation?" (Target answer: No, it makes the conclusion true, but the calculation remains flawed because it assumes 50/50 regardless of amount).

      *Okay, ready to write.*
answer: |-
  Here is a 75-minute lesson plan designed for your specific constraints. It prioritizes the *structure of reasoning* over the *calculus of probability*, which fits your "philosophy of practical reasoning" angle.

  ### Session Goal
  To distinguish between a **valid argument with a false conclusion**, a **fallacious argument with a true conclusion**, and the role of **background assumptions (priors)** in decision theory.

  ### The Arc (75 Minutes)

  **1. The Intuition Pump (0:00–0:15)**
  *   **Setup:** Describe the scenario physically. Two envelopes, one has twice the money of the other. You pick Envelope A. You open it (mentally or actually) and see $x$.
  *   **The Vote:** Ask: "Do you keep A or switch to B?" Take a show of hands.
  *   **The Trap:** Do not let them justify yet. Most will say "It doesn't matter" (Symmetry).
  *   **The Intervention:** Ask a student who says "It doesn't matter": "What if you open Envelope A and it contains $1? Would you switch?" (They will say yes). "What if it contains $1,000,000?" (They might hesitate).
  *   **Pedagogical Point:** This exposes that their intuition *already* depends on the amount seen, even if they claim symmetry. This sets up the later diagnosis that probability isn't always 50/50.

  **2. The Dominance Argument (0:15–0:30)**
  *   **The Reveal:** Present the calculation on the board.
      *   Let $x$ be the amount in your envelope.
      *   Other envelope is either $2x$ or $x/2$.
      *   Assume probability of each is $1/2$.
      *   $EV(Switch) = 0.5(2x) + 0.5(x/2) = 1.25x$.
      *   $EV(Stay) = x$.
      *   **Conclusion:** Always switch.
  *   **The Conflict:** Now you have a conflict between **Symmetry** (it shouldn't matter) and **Dominance** (math says switch).
  *   **The "Vegas" Risk:** A student will likely say, "So EV is broken." **Do not resolve this yet.** Write it on the "Parking Lot" side of the board. Tell them: "We will test whether EV is broken or whether we used it wrong."

  **3. The Diagnosis: Equivocation (0:30–0:55)**
  *   **The Task:** Ask students to find the step where the reasoning breaks. Give them 3 minutes to talk to neighbors.
  *   **The Misconception (Predictable):** "You can't add $2x$ and $x/2$ because $x$ is different in each case."
  *   **The Correction:** This is close, but imprecise. $x$ is the amount in *your* hand, which is fixed once you hold it. The error is in the **probability assignment**.
  *   **The Critical Move:** Draw a table of possible worlds.
      *   World 1: Envelopes are ($10, $20). You hold $10. Switching gains $10.
      *   World 2: Envelopes are ($10, $20). You hold $20. Switching loses $10.
      *   *Crucial Question:* "In the calculation $0.5(2x) + 0.5(x/2)$, what does the first $x$ represent versus the second $x$?"
      *   *Answer:* In the first term ($2x$), $x$ is the *smaller* amount. In the second term ($x/2$), $x$ is the *larger* amount.
  *   **The Philosophical Payoff:** The argument treats $x$ as a **fixed observed value** (to calculate gain/loss) but simultaneously treats $x$ as a **random variable** (to assign the 50/50 probability).
  *   **Head Off the "Algebra Typo" Dismissal:** Explicitly state: "This isn't an arithmetic error. It's a **category error**. We are smuggling an assumption into the probability term: that regardless of how much money you see, it is equally likely you have the smaller or larger amount."
  *   **Test the Assumption:** Return to the $1 vs. $1,000,000 example. If you see $1,000,000, is it really 50/50 that the other envelope has $2,000,000? (Likely not, given finite bankrolls). The 50/50 assumption requires a specific, often impossible, distribution of money.

  **4. The "Deep Cut": Unbounded Priors (0:55–1:10)**
  *   **The Pivot:** You asked if you should cover the infinite/exotic versions. **Here is the boundary:** Do *not* attempt the $E(A) > E(B)$ and $E(B) > E(A)$ infinite expectation paradox. It requires integration and measure theory to resolve honestly, and without that, it looks like magic.
  *   **The Reachable Version:** Cover the **Nalebuff Variant** (unbounded prior).
      *   *Setup:* Suppose the money is generated by a process where there is *always* a non-zero probability of a larger amount existing (no upper limit on wealth).
      *   *Result:* In this specific theoretical case, switching *does* actually yield a higher expected value, even without looking in the envelope.
      *   *Why include this?* This prevents the "EV is broken" conclusion. EV works fine; it just requires a defined prior distribution.
      *   *The Distinction:* In the finite case, the argument was fallacious *and* the conclusion (always switch) was false. In this unbounded case, the conclusion (always switch) is **true**, but the original $1.25x$ argument is **still fallacious** because it didn't reference the distribution.
  *   **How to Frame the Exclusion:** "There is a version of this problem involving infinite series where expectations diverge completely. We are cutting that off not because it's unimportant, but because resolving it requires mathematical tools (measure theory) that would turn this philosophy class into a math class. The philosophical lesson is the same: **Decision rules depend on background knowledge.**"

  **5. Assessment & Close (1:10–1:15)**
  *   **The Single Question:** Do not ask "What was the error?" (They will recite the equivocation). Ask this:
      > "Suppose I prove to you that in a specific casino, the money *is* distributed in such a way that switching really does maximize your expected value. Does that make the original $1.25x$ calculation correct, or does it remain flawed?"
  *   **Target Answer:** "The calculation remains flawed (because it assumes 50/50 without justification), but the conclusion happens to be true."
  *   **Why this works:** It forces them to separate the validity of the inference from the truth of the conclusion, which is the core critical reasoning skill you want.

  ---

  ### Misconception Management Map

  | Misconception | When it arises | Intervention Strategy |
  | :--- | :--- | :--- |
  | **"It's just an algebra typo."** | During Diagnosis (0:30) | Refuse to call it algebra. Call it **equivocation**. Show that the arithmetic is fine, but the *meaning* of $x$ shifts mid-sentence. |
  | **"Expected Value is useless."** | During Dominance (0:15) | Park the claim. Return to it in the "Deep Cut" (0:55) to show EV works when priors are defined. |
  | **"The probability is always 50/50."** | During Setup (0:00) | Use the $1 vs. $1M test case. Force them to admit their belief depends on the magnitude of $x$. |
  | **"The conclusion (switch) is definitely false."** | During Deep Cut (0:55) | Show the Nalebuff variant. Acknowledge that in some theoretical worlds, you *should* switch. This prevents dogmatism. |

  ### What to Decline (and How to Say It)

  **Do Not Cover:** The specific mathematics of divergent integrals or the "E(A) > E(B) and E(B) > E(A)" paradox.

  **Script for the Boundary:**
  > "You might read online about versions of this where the expected value is infinite, and the math seems to break completely. That is a real issue in decision theory. However, resolving it requires a branch of mathematics called measure theory. If we go there, we stop doing philosophy of reasoning and start doing advanced calculus. I want you to take away the logical structure: **you cannot calculate expected value without a prior distribution.** Whether that distribution is finite or infinite is a technical detail; the dependency is the philosophical lesson."

  ### Why This Sequence Works
  1.  **Intuition First:** If you start with the math, they treat it as a puzzle to solve. If you start with the choice, they treat it as a decision to analyze.
  2.  **Diagnosis Before Exotics:** If you show the "switching is rational" variant first, they won't care about the fallacy. They need to feel the error before they appreciate the exception.
  3.  **The Assessment:** The final question ensures they don't leave thinking "Oh, the paradox is just that people are bad at algebra." They leave understanding that **premises matter**.

  ### Contingency Plan
  If the class is math-phobic and glazes over during the $1.25x$ derivation:
  *   **Simplify:** Use specific numbers immediately. "You have $100. Other is $50 or $200."
  *   **Focus:** Shift the weight to the "50/50 assumption." Ask: "How do you *know* it's 50/50?" This turns it into an epistemology lesson (justification of belief) rather than a probability lesson, which fits your course description better.
