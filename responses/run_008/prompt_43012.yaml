answer: |-
  **Final Exam: Metaphysics Seminar – Laws of Nature**
  **Time Allowed:** 3 Hours
  **Instructions:** Answer the following question. Your response should engage directly with the thought experiment provided. Generic summaries of Humeanism or Anti-Humeanism that do not apply the theories to the specific stipulations of the case will receive minimal credit.

  **Question 1**
  Consider the following thought experiment:

  > **The Copyist's World:** A world whose complete history of particular facts is, moment for moment and point for point, a perfect duplicate of ours, but where, by stipulation, every regularity is a colossal accident, nothing in it necessitates anything else, and had things gone otherwise in any one place, the rest of the world would have carried on exactly as it in fact did.

  Evaluate the coherence of the Copyist's World from the perspective of both Humeanism (specifically the Mill–Ramsey–Lewis Best System Account) and Anti-Humeanism (Governing Conception). Can the Humean accept the stipulation that the particular facts are identical to ours but the laws are different (or non-existent)? Can the Anti-Humean accept the stipulation that the particular facts are identical but lack necessitation? Does this case reveal a substantive disagreement about the nature of reality, or merely a verbal dispute regarding the word "law"? In your answer, you must determine what verdict each view is *compelled* to reach about this world and explain what that compulsion reveals about the underlying metaphysical commitments of each view.

  ***

  ### Model Answer

  The Copyist's World functions as a stress test for the metaphysical priority of laws versus particulars. For the Humean, the verdict is forced by the thesis of Humean Supervenience. This thesis holds that the laws of nature are nothing over and above the total distribution of particular matters of fact in spacetime. There is no modal glue holding facts together; there are only the facts. Consequently, the Humean is compelled to deny the coherence of the Copyist's World as described. If the particular facts in the Copyist's World are identical to ours, the Best System—the axiomatic summary maximizing strength and simplicity—must also be identical. The Humean cannot accept the stipulation that these facts are "accidents" lacking necessitation, because on the Best System Account (BSA), laws just *are* the summaries of those facts. To assert the facts are the same but the laws are different is a contradiction in terms for the Humean. The compulsion here reveals that Humeanism eliminates laws as distinct ontological categories; they are descriptive tools, not prescriptive entities.

  Conversely, the Anti-Humean is compelled to accept the Copyist's World as a coherent metaphysical possibility. For the governing conception, laws are distinct existences that constrain or produce the particular facts. Therefore, it is logically possible to have the facts without the law (a world of coincidence) or the law without the facts (a law with no instances). The Anti-Humean uses this case as a modal datum: our intuition that the Copyist's World is conceivable demonstrates that laws do not supervene on particulars. The disagreement is substantive, not verbal. It concerns whether modality is fundamental (Anti-Humean) or derivative (Humean).

  However, the Humean has a potent reply regarding the intuition of conceivability. They argue that the intuition that the Copyist's World is possible is theory-laden. We imagine the facts and imagine the "necessitation" missing, but the Humean claims we are merely imagining our *psychological attitude* toward the facts changing, not the world itself. The Anti-Humean posits a hidden relation; the Humean posits a change in description.

  This leads to the "Best-System-for-Whom" worry. If laws are summaries, their status depends on the criteria of simplicity and strength. Are these objective features of the world, or relative to human cognitive architecture? If the Copyist's World has our facts, but simplicity is mind-relative, do they have our laws? The Humean must argue for objective natural properties to ground the BSA, otherwise, laws become anthropocentric. The Copyist case highlights this vulnerability: if the facts are identical, but the "systematizer" differs, do the laws change?

  Finally, the Anti-Humean faces an epistemic burden exposed by this case. If laws are governing relations distinct from particular facts, how are they detected? In the Copyist's World, the observable evidence (the particulars) is identical to ours, yet the metaphysical status (governed vs. accidental) differs. If the necessitation relation is not part of the particular facts, it is empirically inaccessible. The Anti-Humean must explain how we know we do not live in the Copyist's World. The Humean avoids this skepticism by tying laws to observables, but at the cost of modal depth. Ultimately, the Copyist's World shows the Humean sacrifices modal realism for ontological parsimony, while the Anti-Humean accepts ontological bloat to save modal intuition.

  ***

  ### Marking Scheme (30 Marks Total)

  **1. Humean Supervenience Thesis (6 Marks)**
  *   **A-Quality (5-6):** Clearly defines Humean Supervenience as the claim that laws supervene on the mosaic of particular facts with no additional ontological commitment ("nothing over and above"). Explicitly links this to the BSA.
  *   **B-Quality (3-4):** Defines supervenience generally but fails to specify the "nothing over and above" commitment or conflates supervenience with correlation.
  *   **Common Mistake:** Treating supervenience as a causal claim rather than a metaphysical dependence claim.

  **2. Humean Verdict on Copyist's World (6 Marks)**
  *   **A-Quality (5-6):** States the Humean is *compelled* to say the Copyist's World has the exact same laws as ours, rendering the stipulation (that regularities are accidents) incoherent from their perspective.
  *   **B-Quality (3-4):** Suggests the Humean can accept the stipulation as a "different description" or treats the verdict as optional rather than necessary.
  *   **Common Mistake:** Claiming the Humean can accept the world is possible if we just change the definition of "law."

  **3. Anti-Humean Modal Datum & Humean Reply (6 Marks)**
  *   **A-Quality (5-6):** Identifies the Anti-Humean use of the case as proof that laws are distinct existences (modal datum) and articulates the Humean counter that conceivability intuitions are theory-laden/psychological.
  *   **B-Quality (3-4):** Mentions the Anti-Humean likes the case but fails to explain *why* (distinct existences) or omits the Humean error-theory reply regarding intuition.
  *   **Common Mistake:** Asserting the Anti-Humean proves the world exists, rather than proving it is *possible*.

  **4. Best-System Objectivity (6 Marks)**
  *   **A-Quality (5-6):** Addresses the "for whom" worry: whether simplicity/strength are objective or mind-relative, and how this impacts whether the Copyist's World truly shares our laws.
  *   **B-Quality (3-4):** Discusses simplicity generally without linking it to the specific problem of whether the Copyist's World inherits our laws.
  *   **Common Mistake:** Ignoring the role of the systematizer and treating the Best System as automatically mind-independent.

  **5. Anti-Humean Epistemic Burden (6 Marks)**
  *   **A-Quality (5-6):** Explains the skepticism problem: if laws are distinct from facts, empirical evidence (facts) cannot distinguish the Copyist's World from ours.
  *   **B-Quality (3-4):** Notes the Anti-Humean has a problem knowing laws but fails to connect it to the indistinguishability of the particular facts in the thought experiment.
  *   **Common Mistake:** Confusing the epistemic problem with the semantic problem (meaning of terms).
