      *   *Rent:* Religious beliefs *do* pay rent, but not in sensory predictions. They pay rent in *action-guidance* and *perception of value*. If you believe in God (Buber style), you anticipate *obligations*, not miracles.
      *   *Scientism:* The claim "Only science yields truth" is not a scientific claim. It's a metaphysical commitment. In LW terms, it's an unfalsifiable prior that blocks updating on non-sensory data (like moral intuition).

