      *   *Embarrassing Claims:* Mill was a meritocrat. He didn't support wage compression. He thought skilled workers should earn more. He thought competition was necessary (no protectionism). He thought some people might *remain* wage laborers voluntarily if they lacked capacity for cooperation.
