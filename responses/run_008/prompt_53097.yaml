  **JOINT STATEMENT ON THE MECHANISMS OF CULTURAL EVOLUTION**

  **Date:** October 26, 2023
  **Parties:** The Memetic Darwinian Research Program (Camp A) & The Cultural Attraction Theory Research Program (Camp B)
  **Facilitator:** Office for the Philosophy of Cultural Science

  **Preamble**
  We, the undersigned representatives of two prominent research traditions in cultural evolution, acknowledge that our theoretical divergences have often obscured shared empirical commitments. Through adversarial collaboration, we have identified a core set of agreed-upon principles, clarified the precise nature of our remaining disagreements, and established concrete empirical tests to adjudicate them. This document serves not as a synthesis that dissolves our differences, but as a framework for productive competition.

  ### (i) Agreed Claims

  Both camps endorse the following propositions as the baseline for future research. Signing this list implies no concession regarding the relative causal weight of the mechanisms described.

  1.  **Population-Level Dynamics:** Cultural change is fundamentally a population-level phenomenon. Explanations must account for changes in the frequency and distribution of cultural items (ideas, behaviors, artifacts) across generations and social networks over time.
  2.  **The Role of Cognition:** Human cognitive architecture is not a neutral medium. Psychological biases, perceptual constraints, and inferential systems systematically influence which cultural items are acquired, retained, and transmitted.
  3.  **Biased Transmission:** Transmission is not perfectly random. Whether characterized as "selection" or "transformational bias," the flow of culture is constrained such that some variants are more likely to persist or spread than others.
  4.  **Fidelity Spectrum:** Cultural transmission varies in fidelity. Some processes approximate high-fidelity copying (e.g., digital replication, ritualized instruction), while others involve significant reconstruction (e.g., gist memory, improvisation). Both camps agree that the degree of fidelity is an empirical variable, not an *a priori* constant.
  5.  **Evidence Standards:** Claims about cultural evolutionary mechanisms must be supported by: (a) longitudinal data on frequency changes, (b) experimental data on transmission fidelity and transformation, and (c) modeling that demonstrates how micro-level processes generate observed macro-level patterns.
  6.  **Causal Plurality:** Neither camp denies the existence of the other's proposed mechanisms. Camp A acknowledges that reconstruction occurs; Camp B acknowledges that replication occurs. The dispute concerns which mechanism is the *primary* driver of stability and complexity in specific domains.

  ### (ii) Table of Remaining Disagreements

  The following table outlines the core theoretical divergences. Each statement is phrased such that the respective camp accepts it as an accurate characterization of their position.

  | Feature of Cultural Evolution | Camp A: Memetic Darwinians | Camp B: Cultural Attraction Theorists |
  | :--- | :--- | :--- |
  | **Primary Unit of Analysis** | The **Meme**: A causal unit of cultural inheritance that retains identity across hosts, analogous to the gene. | The **Representation**: A mental or public occurrence that is reconstructed anew in each host; identity is approximate, not strict. |
  | **Mechanism of Stability** | **High-Fidelity Replication:** Stability over time is primarily due to copying mechanisms that resist mutation and degradation. | **Convergent Transformation:** Stability is primarily due to different learners independently reconstructing similar variants based on shared cognitive attractors. |
  | **Nature of Transmission** | **Replicative:** Transmission is best modeled as the copying of information from one vehicle to another. | **Reconstructive:** Transmission is best modeled as the communication of intentions, followed by inference and rebuilding. |
  | **Applicability of Darwinism** | **Literal:** Cultural evolution instantiates the Darwinian algorithm (variation, selection, retention) in a distinct substrate. | **Heuristic:** The Darwinian framework is a useful analogy for frequency changes but fails to capture the cognitive mechanics of transmission. |
  | **Source of Novelty** | **Mutation/Recombination:** New variants arise primarily through errors in copying or mixing of existing memes. | **Inference/Creation:** New variants arise primarily through the creative reconstruction of inputs to fit cognitive schemas. |

  ### (iii) The Cruxes: Empirical Adjudications

  We identify three specific empirical domains where our predictions diverge sharply. Settling these will not end the debate entirely, but it will force significant theoretical revision on at least one side.

  | Crux | Concrete Case Study | Camp A Prediction (Memetic) | Camp B Prediction (Attraction) |
  | :--- | :--- | :--- | :--- |
  | **1. Serial Transmission Chains** | **The "Telephone" Protocol:** A narrative or technical procedure is passed linearly from Person 1 to Person 2 to Person 3, etc., with no external selection pressure (no audience choosing between variants). | **Decay/Drift:** Without selection pressure to cull errors, content will degrade randomly or drift neutrally. Stability requires an external selective filter. | **Systematic Drift:** Content will not decay randomly but will transform systematically toward cognitively natural forms (attractors), even without selection. |
  | **2. Cumulative Culture (Ratcheting)** | **Tool Technology:** The development of complex tools (e.g., Acheulean handaxes or composite bows) over generations. | **Fidelity Requirement:** Ratcheting is impossible without high-fidelity copying mechanisms. If fidelity drops below a threshold, complexity collapses. | **Understanding Requirement:** Ratcheting is possible via function-preserving reconstruction. If the *goal* is understood, the *form* can be rebuilt reliably without strict copying. |
  | **3. Near-Errorless Copying** | **Digital Viral Media:** Image macros or code snippets copied digitally with 100% bit-level fidelity. | **Vindication of Replication:** This demonstrates the replication model. The content spreads because the *copy* is perfect; the meme survives intact. | **Vindication of Attractors:** Perfect copying is trivial. The explanatory work lies in why users *chose* to copy/file/share that specific item. Selection operates on adoption, not the copying act itself. |

  ### (iv) Verdict on Verbal Disputes

  After extensive dialogue, we conclude that the dispute is **partially verbal, but grounded in substantive empirical disagreements.**

  1.  **The Term "Darwinian":** This is largely verbal. Camp A uses "Darwinian" to denote any system satisfying the abstract logic of differential retention. Camp B uses "Darwinian" to imply a specific mechanistic history of blind variation and selective retention.
      *   *Resolution:* We agree to distinguish between **Darwinian Dynamics** (population-level frequency changes, which both accept) and **Darwinian Mechanisms** (replication-based selection, which Camp B disputes as primary).
  2.  **The Term "Copy":** This contains a substantive disagreement. Camp A defines "copy" causally (effect resembles cause due to transmission). Camp B defines "copy" cognitively (effect resembles cause due to reconstruction of intention).
      *   *Resolution:* We acknowledge that when Camp A says "copy," they refer to *inheritance fidelity*. When Camp B says "reconstruction," they refer to *generative process*. Confusion arises when fidelity is assumed to imply a specific generative process.
  3.  **The Term "Selection":** This is the most critical point of friction. Camp A includes cognitive biases within the "selection" environment. Camp B categorizes cognitive biases as "transformational" forces distinct from selection.
      *   *Resolution:* This is not merely verbal; it dictates modeling choices. If biases are "selection," they act on existing variants. If biases are "transformation," they create new variants during transmission. We agree to specify in future models whether bias is treated as a **filter** (Camp A preference) or a **generator** (Camp B preference).

  **Conclusion**
  We sign this statement acknowledging that our rivalry is a engine for discovery. We commit to designing experiments that specifically target the predictions listed in Section (iii), accepting that data may require us to refine our definitions or adjust the causal weight we assign to replication versus attraction.

  **Signed,**

  *Dr. Elena Rosetti, on behalf of the Memetic Darwinian Working Group*
  *Dr. Marcus Thorne, on behalf of the Cultural Attraction Theory Consortium*
