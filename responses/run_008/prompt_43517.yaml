  # JOINT STATEMENT ON THE STRUCTURE OF PERCEPTUAL EXPERIENCE

  **Signatories:** The Naive Realist Disjunctivist (NRD) and The Representationalist (Rep)

  ### I. Agreed Claims

  1.  **Phenomenological Data:** We agree that any adequate theory of perception must account for the following phenomena: (i) the apparent direct presentation of mind-independent objects in veridical perception; (ii) the occurrence of hallucinations where no such objects are present; and (iii) the possibility of subjective indistinguishability between veridical and hallucinatory states.
  2.  **Case (a) Charles Bonnet Syndrome:** We agree that subjects with Charles Bonnet syndrome provide a critical test case. These subjects experience visual figures they know to be hallucinatory (subjectively identifiable), yet these figures appear spatially located in the scene. We agree this phenomenon demonstrates that a subject can possess a visual experience while simultaneously judging it not to be veridical.
  3.  **Case (b) The Perfect Duplicate:** We agree that the "perfect duplicate" scenario—a hallucination stipulated to be subjectively indistinguishable from a veridical perception for the subject at the time—is a coherent conceptual possibility that any theory must accommodate, whether or not such a state is empirically common.
  4.  **Explanatory Goals:** We agree that explaining these phenomena requires specifying the metaphysical nature of the perceptual state and its relation to the environment. We agree that an explanation fails if it denies the reality of the phenomena described in Claims 1–3.
  5.  **Substantivity of the Debate:** We agree that the question of whether a "Highest Common Factor" (HCF) exists is a substantive metaphysical question, not merely a verbal dispute regarding the word "experience," though we disagree on the answer.
  6.  **Falsification Conditions:** We agree to record the following conditions under which each would concede their position:
      *   **NRD:** Would concede if it were demonstrated that subjective indistinguishability metaphysically necessitates a common mental constituent shared by veridical and hallucinatory cases.
      *   **Rep:** Would concede if it were demonstrated that the mind-independent object is a constitutive part of the experience's phenomenology in a way that cannot be replicated in hallucination.
  7.  **Debate Movers:** We agree that empirical evidence regarding the Neural Correlates of Consciousness (NCC) would move the debate. Specifically, we agree that if identical neural states were proven to necessarily instantiate identical mental kinds regardless of external cause, this would favor Representationalism; conversely, if identical neural states were shown to support fundamentally different metaphysical relations depending on external context, this would favor Disjunctivism.

  ### II. Residual Disagreements

  | Crux, Test Case, and Predictions | Naive Realist Disjunctivist (NRD) Statement | Representationalist (Rep) Statement |
  | :--- | :--- | :--- |
  | **1. Existence of a Highest Common Factor (HCF)**<br><br>**Test Case:** Case (b) The Perfect Duplicate.<br><br>**Predictions:**<br>**NRD:** Future science will show that "indistinguishability" masks underlying metaphysical differences in kind.<br>**Rep:** Future science will show that indistinguishability tracks a shared internal mental kind. | The question is substantive, and the answer is **No**. There is no mentally common element constituting the nature of the experience in both veridical and hallucinatory cases. The Perfect Duplicate scenario describes an epistemic limitation, not an ontological identity. The nature of veridical perception is essentially relational. | The question is substantive, and the answer is **Yes**. There is a fundamentally common mental element (representational content or sense data) constituting the nature of the experience in both veridical and hallucinatory cases. The Perfect Duplicate scenario reveals the shared core of perceptual consciousness. |
  | **2. The Explanation of Indistinguishability**<br><br>**Test Case:** Case (b) The Perfect Duplicate.<br><br>**Predictions:**<br>**NRD:** Introspective reports of sameness will be shown to be reports of ignorance, not reports of identity.<br>**Rep:** Introspective reports of sameness will be shown to track identical functional/phenomenal properties. | Subjective indistinguishability is purely **epistemic**. It means the subject cannot tell the states apart, not that the states are of the same fundamental kind. The hallucination is a distinct kind of event that merely mimics the epistemic access provided by perception. | Subjective indistinguishability reflects **ontological similarity** in the immediate mental state. The states are indistinguishable because they share the same representational content or phenomenal character, regardless of external causation. |
  | **3. The Nature of Hallucinatory Experience**<br><br>**Test Case:** Case (a) Charles Bonnet Syndrome.<br><br>**Predictions:**<br>**NRD:** Such cases will be shown to be the standard model for hallucination (distinct kinds).<br>**Rep:** Such cases will be shown to involve modified content (e.g., 'unreality' markers) within a common kind. | This case shows that hallucinations are **distinct kinds** that can be epistemically flagged as non-veridical without sharing a common core with perception. The patient's knowledge confirms the state is not a failed perception but a different mental event entirely. | This case shows that representational content can include **'unreality' markers** or doxastic overlays without changing the fundamental mental kind. The patient shares the common mental element with perceivers but represents the content as non-veridical. |
