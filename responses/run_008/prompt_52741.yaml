answer: |-
  The paradox of voting, formally articulated by Anthony Downs, posits that a rational actor should not vote because the expected utility ($R$) is calculated as $R = PB - C$, where $P$ is the probability of casting the decisive vote, $B$ is the benefit of your preferred candidate winning, and $C$ is the cost of voting. In almost all cases, $P$ is so infinitesimally small that $PB < C$, suggesting abstention is the only instrumentally rational choice. Yet, millions vote. The resolution to this paradox lies in recognizing that voting is not a market transaction designed to maximize personal outcome probability, but a **expressive act** or a **Kantian duty** (represented as $D$ in the modified equation $R = PB - C + D$). When $D$ (the satisfaction of fulfilling civic duty or expressing identity) exceeds $C$, voting becomes rational.

  Here is how this reasoning applies to your specific situation.

  ### 1. Should You Vote?
  **Verdict: Vote.**

  While the instrumental arithmetic ($PB$) in an 80,000-voter city is still small, it is significantly larger than in national elections, particularly if local turnout is low (often 20–30% of registered voters). In a field of 25,000 actual voters with a 52–48 polling split, the statistical probability of a tie or one-vote margin is low, but non-negligible compared to a district of millions. However, the decisive factor is not $P$, but $D$.

  The 40-minute cost is real, but treating voting purely as an investment ($PB$) undermines the democratic system that generates the benefit $B$. If every citizen applied strict instrumental rationality, turnout would collapse, and the legitimacy of the government would erode, eventually destroying $B$ entirely. By voting, you are paying a "membership fee" to maintain the system. Furthermore, local mayoral races have a much higher $B$ per dollar than national ones; zoning, policing, and school policies affect your daily life more tangibly. The expressive value of participating in a close local contest outweighs the opportunity cost of 40 minutes of work, provided that missing the deadline does not result in catastrophic professional harm (e.g., termination). Assuming the cost is merely stress or minor delay, the duty ($D$) clears the threshold.

  ### 2. Is the Vote Swap Sound?
  **Verdict: Unsound.**

  Your friend's proposal attempts to solve the paradox by maximizing instrumental utility across two jurisdictions: she "spends" a vote with $P \approx 0$ (her foregone city) to secure your vote where $P > 0$ (your close city). While this looks like efficient arbitrage, it is philosophically and practically unsound because it treats the vote as a transferable commodity rather than an exercise of judgment.

  The paradox of voting is resolved by acknowledging the non-instrumental value of voting ($D$). Vote swapping doubles down on the instrumental view ($PB$) that creates the paradox in the first place. It severs the link between the voter's conscience and the ballot, reducing the act to a quid-pro-quo transaction. This violates the normative expectation of the secret ballot, which is designed to ensure you vote for the candidate *you* believe is best for *your* community, not as a bargaining chip for a friend's preference. Additionally, such arrangements often inhabit a legal gray area or violate election laws regarding inducement. It is a category error: you cannot trade a duty.

  ### 3. Is the Raffle Benign?
  **Verdict: Benign.**

  The raffle addresses the $C$ (cost) variable in the voting equation without corrupting the $B$ (benefit) or the choice itself. Critics argue that extrinsic incentives "crowd out" intrinsic motivation (the duty $D$), turning a civic act into a hunt for prizes. However, the paradox exists precisely because $C$ is often high enough to deter reasonable people.

  A raffle for small prizes (gift certificates, parking passes) acts as a "nudge" rather than a bribe. A bribe pays you to vote *for* someone; a raffle pays you (with low probability) for the act of *participation*. It acknowledges the friction of democracy (time, travel, deadlines) and lowers the net cost. Because the prize is trivial and unrelated to *how* you vote, it does not compromise the integrity of the choice. It accepts the reality of the paradox—that costs matter—and mitigates them without commodifying the ballot itself. It is a pragmatic acknowledgment that while voting is a duty, the state should not make fulfilling that duty unnecessarily burdensome.

  ### Summary of Implications

  The paradox of voting teaches us that democracy relies on citizens acting against strict short-term self-interest. For you, this means accepting the 40-minute cost as a contribution to a public good rather than an investment with a expected return. It means rejecting the vote swap because it corrupts the expressive nature of the ballot, and accepting the raffle because it reduces friction without buying influence.

