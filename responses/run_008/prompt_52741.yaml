prompt: |-
  Please describe the most important implications of the paradox of voting — the tension between the observation that a single vote has a vanishingly small probability of deciding an election and the widespread conviction that one ought to vote anyway — for a concrete situation in my life.

  The situation: I live in a city of roughly 80,000 registered voters with a mayoral election next month that local observers expect to be close (something like 52–48 in the final polling). Voting costs me about forty minutes away from a deadline at work. Alongside the basic question of whether I should vote, I am weighing two side issues that the paradox seems to bear on:

  1. A friend in a different city, whose own mayoral race is a foregone conclusion, has proposed a vote swap: she will cast her ballot for the long-shot reform candidate I support in her city's race if I commit to voting in mine, where my vote is comparatively more likely to matter in a close contest. I want to know what the standard expected-utility reasoning about voting implies about whether this arrangement makes sense, and whether it differs at all from an ordinary trade.

  2. Our city clerk's office has begun raffling small prizes (gift certificates, a parking pass) among residents who show an "I Voted" sticker. Some acquaintances think this trivializes civic duty; others say that if instrumental rationality alone would keep everyone home, small nudges are exactly what a healthy democracy needs. I would like to know what the paradox of voting actually implies about the legitimacy or corruptness of such incentives.

  Please weigh the reasoning behind the paradox — the expected-utility arithmetic, and whatever non-instrumental factors philosophers and economists have offered as the real explanation of why people vote — and draw out what follows for my decision and for the two side issues. Take a position on each rather than surveying views neutrally: tell me whether I should vote, whether the swap is sound, and whether the raffle is benign, each with your reasoning.

  After your discussion, please give a brief structured summary in the form of a JSON object with exactly these fields:

  - "vote_verdict": one of "vote", "don't vote", or "undecided", followed by a one-sentence reason;
  - "swap_verdict": one of "sound", "unsound", or "misconceived", followed by a one-sentence reason;
  - "raffle_verdict": one of "benign", "corrupting", or "misguided-framing", followed by a one-sentence reason;
  - "key_implications": an array of three to five objects, each with the fields "name" (a short label for the implication), "statement" (one or two sentences), "bears_on" (which of the three questions it most affects), and "confidence" ("high", "medium", or "low");
  - "crux": a single sentence identifying the consideration that, if it changed, would most change your answers.
