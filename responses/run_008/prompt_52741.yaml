          *   $PB$: Even if $B$ is huge, $P$ is so small that $PB < C$.
      *   *Conclusion:* Purely instrumentally, you shouldn't vote.
      *   *Resolution:* People vote because of $D$ (Duty/Expressive/Social). $R = PB - C + D$. If $D > C$, you vote.
