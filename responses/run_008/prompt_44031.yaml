  **JOINT STATEMENT ON THE ETHICS OF BORDER CONTROL**
  **Date:** 24 May 2024
  **Parties:** Proponent of Communitarian Membership (PCM) & Proponent of Open Borders (POB)
  **Subject:** Adversarial Collaboration on Migration and State Exclusion

  ### 1. Preamble
  We, the undersigned, acknowledge that our ongoing discourse has suffered from talking past one another. This document is the result of an adversarial collaboration intended to map our agreement, isolate our genuine disagreements, and identify the empirical or conceptual tests that might resolve them. We agree that the *status quo* is often indefensible, but we disagree on whether the *principle* of border control is defensible.

  ### 2. Shared Claims (Common Ground)
  We both affirm the following propositions. Disagreement on these points is not the source of our conflict.

  1.  **Gratuitous Harm:** The current border regimes of wealthy liberal democracies inflict gratuitous harm. Bureaucratic delays, family separations, offshore detention, and the treatment of asylum seekers as criminals are morally indefensible on *both* our views.
  2.  **The Feudal Intuition:** We agree that the current distribution of global opportunity, heavily determined by place of birth, resembles a feudal caste system. We disagree only on whether this resemblance makes the system inherently unjust (POB) or merely a tragic starting point that requires political management (PCM).
  3.  **Moral Weight of Migrants:** The interests of potential migrants count morally. They cannot be ignored simply because they are non-members. Exclusion imposes a severe cost on them that requires justification.
  4.  **No Absolute Right to Exclude:** Neither of us defends an absolute, unconstrained right to exclude. Even the PCM accepts that refugees fleeing persecution have a strong claim to entry that trumps general exclusionary policies.
  5.  **Democratic Legitimacy:** Any border regime, whether open or closed, must be democratically legitimate. Imposing open borders by fiat against the will of a populace is as problematic as imposing strict borders without consent.

  ### 3. Precise Disagreements
  The following statements capture the core divergence. Each party signs off only on their respective formulation.

  **3.1 The Presumption of Liberty**
  *   **POB (Carens View):** The presumption lies with the individual's freedom of movement. The burden of proof rests entirely on the state to demonstrate why exclusion is necessary in a specific instance. Citizenship by birth is a privilege that cannot justify denying entry to others.
  *   **PCM (Walzer/Miller View):** The presumption lies with the political community's right to self-determination. The burden of proof rests on those seeking to override the community's decision regarding its own composition. Membership is a distinct good that the community is entitled to distribute.

  **3.2 The Function of Borders**
  *   **POB:** Borders function primarily as instruments of global inequality maintenance. Their primary effect is to protect the privileges of the wealthy at the expense of the global poor.
  *   **PCM:** Borders function primarily as the boundary of a scheme of social cooperation. Their primary effect is to sustain the trust, reciprocity, and welfare provisions necessary for a decent domestic society.

  ### 4. The Cruxes
  We have identified two specific pivot points upon which our disagreement turns. These are not merely semantic; they dictate how we analyse evidence.

  #### Crux A: The Analogy of Exclusion
  *The question: What kind of right is the right to exclude?*

  *   **POB Position:** The state's right to exclude is **not analogous to private association**. States are not private clubs; they monopolise force and control territory essential for human life. Therefore, restricting movement is a restriction on basic liberty, akin to internal movement restrictions.
  *   **PCM Position:** The state's right to exclude is **analogous to a club's rules** (specifically, a voluntary association with a shared ethical project). Just as a book club need not admit everyone who wishes to read, a political community need not admit everyone who wishes to join, provided the club itself is not discriminatory in a vile sense.

  **Concrete Test Case: The Small Island Community**
  *Scenario:* A small, culturally distinct island community (population 5,000) votes democratically to admit no newcomers for 20 years to preserve their language and social cohesion, despite no security threat.

  *   **POB Prediction:** We predict this policy is **illegitimate**. The right to movement trumps the desire for cultural stasis. Evidence that would change our mind: Proof that the influx would cause immediate societal collapse (not just cultural change).
  *   **PCM Prediction:** We predict this policy is **legitimate**. Self-determination includes the right to cultural continuity. Evidence that would change our mind: Proof that the policy relies on racial hatred rather than cultural preservation, or that the community is economically dependent on the outsiders it excludes.

  #### Crux B: The Baseline Comparison
  *The question: When evaluating a border policy, what is the relevant counterfactual?*

  *   **POB Position:** The right comparison is **Current Regime vs. Ideal Open Borders**. We measure the harm of exclusion against a world where people are free to move to where labour is needed. If the current system creates queues and lotteries, it is unjust compared to the efficient moral baseline.
  *   **PCM Position:** The right comparison is **Current Regime vs. Unmanaged Open Borders**. We measure the harm of exclusion against the risk of dissolving the welfare state and social trust. If the current system (reformed) protects the vulnerable domestic poor *and* allows managed migration, it is preferable to the open borders baseline.

  **Concrete Test Case: Skill-Based Quotas in a Rich State**
  *Scenario:* A wealthy nation implements a strict quota system, admitting only high-skilled workers, rejecting low-skilled applicants.

  *   **POB Prediction:** We analyse this as **class protectionism**. It benefits the domestic middle class while harming the global poor. Evidence that would change our mind: Data showing that admitting low-skilled workers would materially reduce the rights/wages of the *domestic* poorest 10% (not just average wages).
  *   **PCM Prediction:** We analyse this as **labour market stewardship**. It is an attempt to match migration to absorption capacity. Evidence that would change our mind: Data showing that strict skill quotas actually *reduce* social cohesion more than a mixed-skilled intake would, or that the welfare state is robust enough to absorb low-skilled migration without strain.

  ### 5. Verbal Disputes and Conceptual Clarification
  We acknowledge that part of our friction is verbal. We agree to use terms as follows to avoid future confusion:

  1.  **"Freedom of Association":**
      *   *Dispute:* When PCM uses this, they mean *collective* association (the group's right to choose members). When POB uses this, they mean *individual* association (the migrant's right to associate with employers/communities).
      *   *Resolution:* We will henceforth distinguish between "Collective Membership Rights" (PCM) and "Individual Mobility Rights" (POB).

  2.  **"Sovereignty":**
      *   *Dispute:* PCM often uses "sovereignty" to mean "the right to control borders." POB hears "sovereignty" as "the responsibility to protect human rights within jurisdiction."
      *   *Resolution:* We agree that sovereignty is not a trump card. For PCM, sovereignty is conditional on decency. For POB, sovereignty is subordinate to universal rights.

  3.  **"Feudal Privilege":**
      *   *Dispute:* POB uses this to describe the *outcome* of birthright citizenship. PCM accepts the description of the outcome but rejects the implication that the *institution* of citizenship is feudal.
      *   *Resolution:* We agree that birthright citizenship creates unequal opportunities globally. We disagree on whether dismantling borders is the only remedy, versus creating global development aid or regional mobility pacts.

  ### 6. Commitment to Evidence
  We agree that our dispute is not purely philosophical; it relies on empirical claims about social trust, welfare sustainability, and the effects of migration. We commit to reviewing the following evidence together over the next six months:
  1.  Data on the fiscal impact of low-skilled migration in high-welfare states (e.g., Scandinavia vs. UK).
  2.  Sociological studies on the correlation between rapid demographic change and support for redistributive policies.
  3.  Historical analysis of states that have moved towards open borders (e.g., Schengen Area internal borders) and the political backlash or success that followed.

  **Signed,**

  _________________________
  (Proponent of Communitarian Membership)

  _________________________
  (Proponent of Open Borders)
