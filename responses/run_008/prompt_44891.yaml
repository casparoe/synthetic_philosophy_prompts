answer: |-
  Here's a draft for the handout. I kept the language punchy so students don't get bogged down in jargon before the discussion starts. I also added a "Wildcard" note for the trickier ones.

  Below the handout, I've got a section of "TA Notes" with my take on your two conceptual worries so you're prepped for the pushback.

  ***

  # HANDOUT DRAFT: The Supererogation Spectrum

  **Instructions:** Below is a list of actions placed on a spectrum from "Basic Decency" to "Saintly." Your job in section is to argue whether these acts are in the right tier. Can you move them up or down? Why?

  ### TIER 1: Basic Decency
  *(You're kind of a jerk if you don't do this, but technically it's optional)*

  *   **Giving up your bus seat for someone who looks tired.**
      *   *Reason:* It costs you almost nothing and relieves their immediate physical discomfort.
  *   **Staying late at work, unpaid, to help a coworker hit a deadline.**
      *   *Reason:* It's a kind professional courtesy, but you are owed your personal time.

  ### TIER 2: The Good Samaritan
  *(Clearly good to do, clearly okay to skip)*

  *   **Keeping a promise that has become very costly to keep.** [⚠️ DEBATABLE]
      *   *Reason:* Promise-keeping is usually a duty, but extreme cost pushes this into optional territory.
  *   **Donating blood every couple of months for years on end.** [⚠️ DEBATABLE]
      *   *Reason:* A single donation is easy, but the long-term commitment requires significant discipline.

  ### TIER 3: Heavy Lifting
  *(Significant sacrifice; admirable but not required)*

  *   **Giving 10% of your income to effective charities.**
      *   *Reason:* This substantially impacts your lifestyle to help distant strangers.
  *   **Calling out your boss over a racist joke at a work dinner.**
      *   *Reason:* You risk your career standing to uphold a moral principle.
  *   **Forgiving someone who badly wronged you and never apologized.** [⚠️ DEBATABLE]
      *   *Reason:* It requires immense emotional labor without the closure of remorse.

  ### TIER 4: Heroic / Saintly
  *(No reasonable person could demand this of you)*

  *   **Donating a kidney to a stranger while you're alive.**
      *   *Reason:* You accept permanent bodily risk and recovery pain for someone you don't know.
  *   **Falling on a grenade to save five comrades.**
      *   *Reason:* This is the ultimate sacrifice of life itself for the sake of others.

  ***

  # TA-TO-TA NOTES: Handling the Curveballs

  Here's my take on the two things keeping you up at night. Honestly, these aren't bugs in your lesson plan; they're features. These are the exact friction points where the interesting philosophy happens.

  ### 1. The "Repetition Ratchet" (Blood Donation)
  You're noticing that supererogatory acts can calcify into duties over time. If you donate blood once, you're nice. If you do it for 30 years, you're a "Blood Donor Guy," and if you stop, people think you've fallen from grace.

  **Is there a principled way to deal with this?**
  Not really a clean one, which is why it's great for class. You can introduce the idea of **Role Obligations**. When you start doing something repeatedly, you might inadvertently adopt a social role (e.g., "The Reliable Donor"). Once you occupy that role, others form expectations, and letting them down causes harm (disappointment, logistical issues) that a one-off donor doesn't cause.
  **My advice:** Don't tell them "it's messy." Ask them: *"Does creating an expectation turn a nice act into a duty?"* If they say yes, ask if that means we should be *less* consistent with our good deeds to avoid trapping ourselves. That usually breaks their brains in a productive way.

  ### 2. The Forgiveness Problem (Act vs. Feeling)
  You're right to be suspicious here. Supererogation applies to *actions*. If forgiveness is just a feeling (the disappearance of resentment), you can't choose it, so it can't be moral or supererogatory (because "ought implies can").

  **So, is it in the wrong category?**
  It depends on how you define forgiveness.
  *   **View A:** Forgiveness is a feeling. (If so, you're right, it doesn't belong here.)
  *   **View B:** Forgiveness is a commitment. It's the decision to *act as if* you aren't resentful, even if you still feel sting. It's forbearing revenge and treating the wrongdoer as a peer again.
  **My advice:** Keep it on the handout but lean into the ambiguity. Tell the students: *"Philosophers can't even agree if this is an action you can take or a feeling that just happens. If it's just a feeling, does it make sense to put it on this list?"* If you put it in a "Wildcard" box or mark it with a big asterisk, it signals to the sharp students that they've spotted a category error, which is a win.

  Good luck with the section! This list is solid.
