prompt: |-
  I keep running into this phrase from a friend who's big on the LessWrong-adjacent blogosphere -- he talks about Moloch and multipolar traps all the time -- and last week he deployed Bostrom's phrase about the possibility of a "dictatorless dystopia, one that every single citizen including the leadership hates but which nevertheless endures unconquered." He used it twice in one conversation for what strike me as pretty different jobs: once to explain why everyone hates the grind at their jobs and the arms-race dynamics of their industry even though nobody chose any of it, and once to argue that the only real escape is some powerful coordinating authority that could just impose the better equilibrium from above. Something about that second move feels like it's smuggling in a lot. Can you lay out the distinct precise claims "dictatorless dystopia" could be making -- that such equilibria are possible in principle (a toy-model point), that they're common in real institutions, that they can be stable with nobody at all wanting or enforcing them, that multipolar competition specifically generates them, that escaping one always requires a big central coordinator -- and for each reading tell me whether it's trivial, substantive, or just false, and whether it gets him from the first use to the second? I'd love a menu of readings I can bring to our next argument. Please lead with your bottom line in the first sentence, then the reasoning, no preamble and no restating my question back at me. (And if you cant tell, I'm mostly skeptical of the "therefore we need a world government or singleton" leap, but I want to know if any reading actually earns it.)
