answer: |-
  To the Members of the Curriculum and Technology Committee,

  I am writing to offer my considered recommendation regarding the proposed pilot for the computer science elective, specifically the plan to replace six weeks of standard instruction with the machine training exercise. After reviewing the proposal, listening to the department's rationale, and weighing the concerns raised by my fellow committee members, I recommend that we approve the pilot with conditions. My support is not unconditional, nor is it a dismissal of the serious objections raised regarding the rigor of the curriculum. Rather, I believe the pilot offers a unique pedagogical opportunity that aligns with the deeper goals of computer science education, provided we implement safeguards that ensure the exercise remains grounded in technical mastery rather than slipping into mere metaphor. To explain why I take this position, and to clarify the conditions I believe are necessary, I must address the philosophical questions at the heart of this debate, as well as the valid fears of those who oppose the change.

  The central tension in this proposal is not merely about how to spend six weeks of class time, but about what we believe computer science is and how intelligence is formed. The proponents of the pilot argue from a tradition that views intelligence not as a static repository of rules but as a dynamic capacity shaped by interaction. Their rationale rests on the idea that if we wish students to understand how machines learn, they must participate in the learning process itself, standing on the teacher's side of the desk. This invites us to consider whether teaching is fundamentally the transfer of explicit rules or the shaping of dispositions through correction and encouragement. In traditional programming, we teach students to write the rules, to define the search procedures, and to hard-code the logic. In this pilot, students would shape the behavior of a blank machine through feedback loops, rewarding desired outputs and correcting errors without necessarily dictating the exact path the machine takes to arrive at them. If we accept that human education often involves this latter mode—where a child learns not just by being told the rules of grammar but by being corrected when they speak incorrectly—then the pilot asks us to confront whether the difference between educating a child and training a machine is a difference of degree, of kind, or merely of sentiment.

  I believe the honest answer is that the difference is primarily one of kind, but the pedagogical value lies in treating it as a difference of degree. A child possesses interiority, intent, and a biological drive to understand that a machine, no matter how sophisticated, does not. To pretend otherwise is to fall into the trap of sentiment, anthropomorphizing code where there is only math. However, the mechanism of learning through correction and reward is structurally similar enough that engaging with it offers students insight into the nature of optimization and logic that writing static rules does not. By training the machine, students are forced to think about the gap between intention and execution, a gap that exists in human learning just as it does in machine learning. If we reject this pilot solely because the machine is not a child, we risk throwing away a powerful analogy that clarifies how complex behaviors emerge from simple feedback. Therefore, there is genuine value in allowing students to experience the frustration and insight of shaping a disposition rather than just writing a rule.

  However, I must give full weight to the strongest consideration on the side that loses in my recommendation, which is the objection that this exercise teaches programming culture rather than computer science. The critics on this committee argue that grading students on their training regime rewards intuition for the machine rather than mastery of content, and that the analogy between bringing up a child and training a program is inspirational rhetoric rather than a reason. This is not a minor concern; it strikes at the definition of our department's mandate. If a student spends six weeks adjusting reward parameters without understanding the underlying search algorithms or the logic structures that govern the machine's responses, they have not learned computer science; they have learned to operate a black box. There is a real risk that this pilot could devolve into a game of trial and error where success is measured by the output rather than the understanding of the process. If we allow students to believe that shaping dispositions is a substitute for understanding rules, we do them a disservice, sending them into higher education or the workforce with the mistaken belief that intuition can replace technical literacy. The objection that this is rhetoric rather than reason is valid because the analogy breaks down the moment we ignore the code that makes the training possible. If the pilot does not force students to confront the code behind the behavior, it is indeed merely culture, not science.

  It is precisely because this risk is so substantial that I recommend approval only with conditions. To defend this position under questioning from either side, the pilot must be structured so that the philosophical inquiry reinforces the technical rigor rather than replacing it. My condition is that the final assessment for this six-week module must require students to translate their training strategies back into explicit rules or code. After training their machine, students must be able to articulate, in computational terms, what logic their feedback loop effectively instilled in the program. They must demonstrate that they understand not just that the machine learned, but how the weighting of corrections altered the search space. This bridges the gap between the two views of teaching. It acknowledges that shaping dispositions is a valid method of instruction, but it demands that the student ultimately understand the rules that govern that shaping. By requiring this translation, we ensure that the exercise remains computer science. It prevents the pilot from becoming a purely psychological exercise and anchors it in the mechanics of the system.

  This condition also addresses the philosophical question of whether the difference between child and machine education is one of kind or degree. By asking students to reverse-engineer the learned behavior into explicit rules, we acknowledge the difference of kind. We admit that the machine does not truly understand, that it is merely optimizing based on parameters we set. We refuse the sentiment that the machine is a child, but we utilize the degree of similarity in the learning process to teach the student about the nature of those parameters. This satisfies the critics who fear the loss of content mastery because the final output is still code and logic, not just a trained model. It also satisfies the proponents who want students to engage with the learning process, because the students must still go through the training regime to understand what rules need to be written. It turns the pilot into a loop where experience informs theory and theory explains experience.

  I am aware that adding this condition increases the workload for the instructor and the students, and some may argue it dilutes the purity of the experiment. However, purity is not our goal; education is. If we approve the pilot without this safeguard, we risk validating the fear that we are prioritizing inspiration over instruction. If we reject the pilot entirely, we risk stagnating in a curriculum that treats intelligence as a static transfer of data rather than a dynamic process. By approving with the condition that the training must be explicable in terms of explicit rules, we take a position that defends the integrity of computer science while embracing the innovative potential of the proposal. We acknowledge that teaching is both the transfer of rules and the shaping of dispositions, and that the best engineers are those who understand how to do both. We acknowledge that the machine is not a child, but that teaching the machine teaches the child.

  In conclusion, I urge the committee to vote to approve the pilot with the stipulation that the assessment framework includes a mandatory component requiring the translation of trained behaviors into explicit logical rules. This path allows us to test the department's hypothesis without sacrificing the foundational competencies that our students require. It allows us to engage with the profound questions about intelligence and education that the proposal raises, without losing sight of the technical reality that underpins our field. I believe this is the only position that respects the intelligence of our students, the expertise of our faculty, and the responsibility of this committee to ensure that our curriculum remains both rigorous and relevant. I look forward to discussing this further during our next session and am available to clarify my reasoning should any member require it.

  Sincerely,

  Student Representative
  Curriculum and Technology Committee
