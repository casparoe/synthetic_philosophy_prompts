answer: |-
  ### Taxonomy of Thought Experiments in Physics

  Before constructing the procedure, we must map the terrain. The literature on thought experiments (TEs) is divided, but not chaotically. We can categorize the relevant distinctions into three axes. This taxonomy allows us to route around the metaphysical disagreement (do TEs access Platonic laws?) by focusing on the epistemic output (does the TE compel assent?).

  **1. The Metaphysical Axis (Contested)**
  *   **The Argument View (e.g., Norton):** A TE is nothing over and above an argument. It uses premises (laws, principles, intuitions) to derive a conclusion. Its "special force" is rhetorical or psychological.
  *   **The Insight View (e.g., Brown):** A TE can provide non-inferential knowledge of nature. It allows the mind to "grasp" the laws directly, potentially generating new premises not previously held.
  *   **Procedure Stance:** We cannot adjudicate this. The procedure must work *as if* the Argument View is true for the sake of public verification, without denying the Insight View might be how the author discovered the result.

  **2. The Functional Axis (Settled)**
  *   **Destructive (Reductio):** Shows a contradiction within a theory or between a theory and a principle (e.g., Einstein vs. Bohr).
  *   **Constructive:** Demonstrates the possibility of a phenomenon or derives a law (e.g., Stevin's Chain).
  *   **Mediative:** Merely illustrates a already-derived mathematical result (pedagogical).

  **3. The Premise Axis (Settled)**
  *   **Empirical:** Premises grounded in observation.
  *   **Theoretical:** Premises grounded in established formalism.
  *   **Intuitive:** Premises grounded in "what seems possible/necessary" (e.g., locality, continuity, conservation).
  *   **Risk:** Intuitive premises are the primary vector for circularity (theory-laden intuition).

  ---

  ### The "Hour-Glass" Refereeing Protocol

  **Time Budget:** 60 Minutes Close Reading.
  **Goal:** Determine if the TE is a rigorous argument disguised as a scenario, or a intuition pump lacking premises.

  #### Step 1: Reconstruction (15 Minutes)
  **Task:** Translate the narrative scenario into a standard form argument.
  **Questions:**
  1.  Can I list the specific premises (P1, P2, P3...) the author relies on to move from the scenario setup to the conclusion?
  2.  Is the conclusion (C) clearly stated?
  3.  Does the conclusion follow logically from the premises, or is there a gap filled by phrases like "clearly," "obviously," or "we see that"?

  **Sufficiency Criteria:**
  *   **Pass:** You can extract at least three distinct premises and a valid inference rule.
  *   **Fail:** The move from scenario to conclusion relies on unstated assumptions or rhetorical momentum.

  **Decision Node A:**
  *   If **Fail**: Recommend **Major Revision**. Require the author to formalize the argument. The TE cannot be evaluated until it is reconstructible.
  *   If **Pass**: Proceed to Step 2.

  #### Step 2: Premise Audit (15 Minutes)
  **Task:** Classify the source of each premise identified in Step 1.
  **Questions:**
  1.  Is each premise empirical, theoretical, or intuitive?
  2.  For intuitive premises: Is this intuition shared by the broader community, or is it specific to a school of thought?
  3.  **Contested Flag:** If the author claims the intuition *is* the evidence (Insight View), note this. The procedure requires that even intuitive premises be treated as propositional claims subject to scrutiny (Argument View).

  **Sufficiency Criteria:**
  *   **Pass:** Premises are identified and their status (empirical/theoretical/intuitive) is acknowledged.
  *   **Fail:** Intuitive premises are presented as self-evident facts of nature without acknowledging their status as assumptions.

  **Decision Node B:**
  *   If **Fail**: Recommend **Revision**. Author must explicitly state which premises are intuitive assumptions.
  *   If **Pass**: Proceed to Step 3.

  #### Step 3: The Independence Test (Circularity Check) (20 Minutes)
  **Task:** Test for the standard failure mode: intuition derived from the theory being tested.
  **Method:** The "Counter-Community" Test.
  **Questions:**
  1.  Identify the rival theory or interpretation the TE is meant to challenge (or the theory it supports).
  2.  Take the intuitive premises from Step 2. Would a proponent of the *rival* theory accept these premises as neutral?
  3.  If the TE argues Theory X is impossible because it violates Intuition Y, is Intuition Y actually a consequence of Theory Not-X?

  **Practical Heuristic for the Referee:**
  *   You cannot introspect your own bias. Instead, look at the *dialectical context*. If the paper is "Why Interpretation A fails," and the TE relies on a premise that Interpretation A explicitly rejects (e.g., "definite outcomes exist prior to measurement"), the TE is begging the question.
  *   **Settled:** A TE cannot refute a theory using premises the theory denies.
  *   **Contested:** Whether "common sense" intuitions count as neutral ground. (Procedure ruling: No. In foundations of physics, "common sense" is usually classical physics dressed up.)

  **Sufficiency Criteria:**
  *   **Pass:** The premises are neutral enough that the target theory's proponents would accept the setup, even if they reject the conclusion.
  *   **Fail:** The setup itself assumes the falsity of the target theory.

  **Decision Node C:**
  *   If **Fail**: Recommend **Reject**. The TE is question-begging.
  *   If **Pass**: Proceed to Step 4.

  #### Step 4: Necessity and Function (10 Minutes)
  **Task:** Determine if the TE format is doing work or just decorating.
  **Questions:**
  1.  Could this argument be run entirely within the formalism without loss of rigor?
  2.  If yes, does the TE add clarity, or does it obscure the mathematical assumptions?
  3.  Is the TE destructive (showing inconsistency) or constructive (proving possibility)?

  **Decision Node D (The Hand-Off):**
  *   If the TE is **Mediative** (just illustrates math): Recommend **Accept** (if math is sound) or **Revision** (to clarify it is illustrative).
  *   If the TE is **Constructive** but purely formalizable: This is a judgment call on pedagogy vs. rigor. **Hand-off to Editor.** Note in comments: "The TE adds rhetorical force but no new argumentative content."
  *   If the TE is **Destructive** and passes Steps 1-3: **Accept** (pending minor fixes).

  ---

  ### Application to Hypothetical Submissions

  #### Case 1: The Bounded-Memory Demon
  **Submission:** A Maxwell's-demon variant where the demon has bounded memory. The author appeals to the thermodynamic cost of erasing information (Landauer's Principle) to argue the Second Law survives.
  **Procedure Run:**
  1.  **Reconstruction:** Easy. P1: Demon stores info. P2: Memory is bounded. P3: Erasure costs energy (Landauer). C: Net entropy increases.
  2.  **Premise Audit:** P3 is the heavy lifter. It is theoretical/empirical (widely accepted in stat mech).
  3.  **Independence Test:** Does the setup assume the Second Law to prove the Second Law? No. It assumes Landauer's Principle. While related, Landauer's is a micro-physical claim used to save the macro-law. Rivals (anti-Landauerians) would reject P3, but they are a fringe minority. The dialectic is standard.
  4.  **Necessity:** The TE clarifies *where* the cost enters (the reset).
  **Recommendation:** **Accept.**
  **Comment:** This is a standard reconstructible argument. The TE is a valid vehicle for applying Landauer's Principle.

  #### Case 2: The Reversible Observer (Wigner's Friend Variant)
  **Submission:** Argues that a prominent interpretation (e.g., QBism or Many-Worlds) is committed to a claim its defenders deny. Scenario: Isolated observer measures system, then external super-observer reverses the unitary evolution. Author claims this shows the internal observer's "fact" was not a fact.
  **Procedure Run:**
  1.  **Reconstruction:** P1: Unitary evolution is universally valid (per the Interpretation). P2: Reversal is possible in principle. P3: If a state is reversed, no measurement occurred. C: The internal observer's record is not a "fact."
  2.  **Premise Audit:** P1 is accepted by the target interpretation. P2 is the intuitive leap (technological possibility vs. nomological possibility). P3 is the contentious intuitive premise (definition of "fact").
  3.  **Independence Test (The Flinch):** The author claims to refute the Interpretation. However, Premise 3 ("If reversed, no fact") is often *explicitly rejected* by the defenders of the Interpretation (who might say "facts are relative to the observer"). The TE assumes a monolithic notion of "fact" that the target interpretation denies. The TE is not testing the theory; it is asserting a rival definition of "fact" via narrative intuition.
      *   *Referee Check:* Would a QBist accept P3? No. They define facts relative to agents.
      *   *Result:* The TE begs the question. It assumes an absolute notion of fact to prove the theory fails to provide one.
  4.  **Necessity:** The TE obscures the definitional disagreement.
  **Recommendation:** **Reject.**
  **Comment:** The thought experiment relies on a premise (absolute factuality) that the target interpretation explicitly denies. It is not a reductio of the theory; it is a restatement of the referee's preferred ontology.

  **Why You Will Flinch:**
  You will flinch because papers like this are the lifeblood of *Foundations of Physics*. They generate citations, conferences, and debate. Rejecting it feels like silencing a legitimate philosophical challenge.
  **Why You Must Not Override:**
  The procedure identifies that the TE is not doing *argumentative* work; it is doing *stipulative* work. It defines "fact" in a way that makes the target theory lose by fiat. Publishing it as a "refutation" misleads readers into thinking a logical contradiction was found within the theory, rather than a clash of definitions. If the author revises to "This TE shows why Interpretation X is incompatible with Intuition Y," you can Accept. But as a claim of internal inconsistency, it fails the Independence Test.

  #### Case 3: The Dueling Impossibilities
  **Submission:** Dismisses a rival's TE as physically impossible while assuming a dynamical law (e.g., a specific collapse model) that no experiment has confirmed. Both sides trade in possibilities licensed by nothing.
  **Procedure Run:**
  1.  **Reconstruction:** P1: Rival's scenario requires Law A. P2: Law A is false. P3: My scenario requires Law B. C: My scenario is possible, Rival's is not.
  2.  **Premise Audit:** P2 and P3 rely on unconfirmed dynamical laws. These are theoretical premises with low empirical support.
  3.  **Independence Test:** The author claims the rival's TE is "physically impossible." But "physically possible" here means "consistent with Law B." Since Law B is unconfirmed, the impossibility claim is speculative.
  4.  **Necessity:** The TE format makes the speculation look like a physical constraint.
  **Recommendation:** **Reject.**
  **Comment:** The manuscript trades on a modal claim ("impossible") that is only true relative to an unconfirmed hypothesis. This violates the norm that TEs should rely on settled or explicitly hypothetical premises.

  ---

  ### Limitations: What This Procedure Cannot Do

  As a philosopher of science, I must be clear about where this tool breaks. It is designed for *assessment*, not *discovery*.

  1.  **The Aesthetic/Heuristic Blind Spot:** The procedure cannot measure the "fruitfulness" of a TE. Einstein's chase-a-light-beam TE was technically flawed and relied on intuitions that were arguably question-begging relative to Maxwell's equations. Yet it was heuristically vital. This procedure might have flagged young Einstein for revision. It protects the journal from bad arguments, but it cannot identify genius that looks like bad arguments.
  2.  **The Diagrammatic/Prosaic Element:** Some TEs work not by logical reconstruction but by shifting the reader's gestalt (e.g., Norton's Dome, or certain visual TEs in GR). If the "argument" is in the rhythm of the prose or the geometry of a diagram, Step 1 (Reconstruction) will fail, leading to a false negative.
  3.  **The Lag Time:** TEs often seed mathematics that does not yet exist. A TE might be logically gap-ridden today but inspire a formalism in 20 years that fills the gaps. This procedure evaluates the manuscript *now*. It will inevitably reject some seeds of future theory because they lack current formalization.
  4.  **The Editor's Burden:** Step 4 (Necessity) often hands off to the editor. Whether a journal wants "philosophical argument" vs. "physical insight" is a policy decision, not a procedural one. The procedure tells you *what* the paper is; the editor decides if that's *what they publish*.

  **Final Note:** Use this procedure to ensure that when a thought experiment appears in your journal, it is a scalpel, not a bludgeon. It forces the author to own their premises. That is the best service you can do for the field.
