prompt: |-
  I'm the quality lead at a company that makes flow sensors for dialysis machines. When a batch fails outgoing tests, my team writes up a root cause and the form has exactly two boxes, confirmed or not confirmed. Here's my problem: on a couple of recurring failures we have two candidate causes that both fit every data point we've collected, and the team just picks the simpler one and checks confirmed. That goes in our regulatory file and basically kills the alternative hypothesis forever. I'm not comfortable, but I also can't say the simplicity habit is always wrong.

  Write me a decision procedure for when evidence actually settles a root cause vs. when it only settles it relative to background assumptions about our test rig and measurement gear. Questions in order, what counts as enough of an answer at each step, where it should output "undetermined between A and B" (I can get that box added to the form if the procedure justifies it), and where it has to hand off to an engineer's judgment because the tiebreaker is pragmatic or a values thing, not evidence. Then run it on two cases: (1) a drift failure that could be contaminated membrane stock or a temperature-sensitivity in our calibration oven — which we've only ever been able to check using the same oven; (2) an intermittent drop that fits both a cracked solder joint and a firmware timing bug, where the simpler writeup is firmware but the firmware engineer is the one stuck with the extra work either way. Be honest about where the procedure misfires, and fair warning, if some cases the team's simplicity habit is actually fine I want to hear it, not just be agreed with.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the User and Context:**
      *   **Role:** Quality Lead at a medical device company (dialysis flow sensors).
      *   **Stakes:** High. Regulatory files (FDA/ISO 13485), patient safety (dialysis), recurring failures.
      *   **Current Problem:** A binary "Confirmed/Not Confirmed" root cause form forces premature closure. Teams pick the "simpler" explanation (Occam's Razor misuse) even when evidence supports multiple hypotheses equally. This buries alternative hypotheses permanently.
      *   **User's Goal:** A decision procedure to distinguish when evidence *actually* settles a root cause vs. when it only settles it relative to assumptions (about test rigs, gear, etc.). Needs to identify when to output "Undetermined between A and B" and when to defer to engineering judgment/pragmatics.
      *   **Specific Request:**
          1.  Write the decision procedure (questions, thresholds, outputs).
          2.  Run it on two specific cases (Membrane/Oven Drift, Solder/Firmware Intermittent).
          3.  Be honest about where the procedure misfires.
          4.  Acknowledge when the "simplicity habit" is actually valid (don't just validate the user's bias).

  2.  **Deconstruct the Core Issue:**
      *   The problem isn't just "picking the simple one." It's *underdetermination of theory by evidence*. In quality engineering, this is often masked by pressure to close CAPA (Corrective and Preventive Action) tickets.
      *   Regulatory bodies (FDA) expect root cause analysis to be robust. If you pick the wrong root cause, your corrective action might not prevent recurrence.
      *   The "Confirmed/Not Confirmed" binary is the structural flaw. The procedure needs to justify adding a third state ("Indeterminate/Competing Hypotheses").

  3.  **Drafting the Decision Procedure:**
      *   *Structure:* Needs to be a flowchart or step-by-step logic. Let's use a step-wise interrogation model.
      *   *Step 1: Evidence Independence.* Does the evidence rely on the very system being suspected? (The "Oven" problem).
      *   *Step 2: Discriminatory Power.* Can the current data distinguish between A and B? Or does it fit both equally well?
      *   *Step 3: Falsifiability.* Is there a test that *could* rule one out? If yes, why wasn't it done?
      *   *Step 4: Risk & Recurrence.* If we pick the wrong one, what happens? (Safety vs. Efficiency).
      *   *Step 5: The "Simplicity" Check.* Is simplicity a proxy for probability or just convenience?
      *   *Outputs:* "Confirmed," "Undetermined (A vs B)," "Handoff to Judgment."

  4.  **Refining the Procedure (Self-Correction/Iterative Thinking):**
      *   *Critique:* Just asking questions isn't enough. I need to define *what counts as an answer*.
      *   *Adjustment:* Add "Pass Criteria" for each step.
      *   *Critique:* The user wants to know when to defer to judgment.
      *   *Adjustment:* Make the final step explicitly about risk/resource trade-offs if evidence is truly equal.
      *   *Critique:* Need to address the regulatory aspect.
      *   *Adjustment:* Include a note on regulatory documentation for "Undetermined" outcomes (e.g., addressing both in CAPA).

  5.  **Running Case 1: Membrane Stock vs. Calibration Oven:**
      *   *Hypothesis A:* Contaminated Membrane.
      *   *Hypothesis B:* Oven Temp Sensitivity.
      *   *Constraint:* Oven is used to check the Oven. (Circular measurement).
      *   *Application:* Step 1 (Independence) should flag this immediately. The evidence for B relies on the tool suspected in B.
      *   *Outcome:* Undetermined. Need independent measurement.

  6.  **Running Case 2: Cracked Solder vs. Firmware Timing:**
      *   *Hypothesis A:* Hardware (Solder).
      *   *Hypothesis B:* Software (Firmware).
      *   *Constraint:* Intermittent. Hard to reproduce. Simpler writeup is Firmware. Firmware engineer bears the burden.
      *   *Application:* Step 2 (Discriminatory Power). Intermittents are notoriously hard to distinguish. Step 5 (Simplicity). Is Firmware actually simpler? Or just easier to blame?
      *   *Ethical/Pragmatic Layer:* The firmware engineer is "stuck with the work." This is a resource/political issue, not purely technical.
      *   *Outcome:* Likely "Handoff to Judgment" based on risk, but the procedure should highlight the bias risk.

  7.  **Addressing the "Simplicity Habit" (The "Be Honest" Requirement):**
      *   I need to validate that sometimes simplicity *is* the right heuristic (e.g., common cause vs. rare conspiracy).
      *   I need to point out where the procedure might fail (e.g., analysis paralysis, cost of testing).
      *   I need to be firm that in medical devices, "Undetermined" is better than "Wrongly Confirmed."

  8.  **Finalizing the Output Structure:**
      *   **Introduction:** Acknowledge the regulatory gravity.
      *   **The Procedure:** "The Underdetermination Protocol." 5 Steps.
      *   **Case Study 1:** Membrane/Oven.
      *   **Case Study 2:** Solder/Firmware.
      *   **Critique & Limitations:** Where this breaks, and when simplicity is actually okay.
      *   **Regulatory Note:** How to document "Undetermined."

  9.  **Drafting Content (Mental Check of Tone):**
      *   Tone: Professional, authoritative, empathetic to the Quality Lead's position, rigorous.
      *   Avoid: Jargon without definition, overly academic philosophy (keep it engineering-focused).
      *   Focus: ISO 13485 / FDA expectations on CAPA effectiveness.

  10. **Refining the "Handoff" Concept:**
      *   It's not just "engineer's judgment." It's "Risk-Based Decision." If evidence is equal, pick the one that mitigates the highest risk, or address both.
      *   Wait, the user asked where it hands off because the tiebreaker is *pragmatic/values*. I need to make sure the procedure explicitly identifies when evidence runs out and politics/cost takes over.

  11. **Final Polish:** Check against the prompt requirements one last time.
      *   Decision procedure? Yes.
      *   Questions in order? Yes.
      *   What counts as enough answer? Yes.
      *   Output "Undetermined"? Yes.
      *   Handoff to judgment? Yes.
      *   Run on two cases? Yes.
      *   Honest about misfires? Yes.
      *   Validate simplicity habit where appropriate? Yes.

  *(Self-Correction during drafting)*: I need to make sure I don't just give them a "Yes, you're right" echo chamber. The simplicity heuristic (Occam's Razor) *is* valid in engineering *if* the priors are different. If Hypothesis A happens 90% of the time and B happens 10%, and data fits both, pick A. The procedure needs to capture *Priors*.

  *Revised Step 3:* Add "Base Rate Check."

  *Revised Case 2:* If firmware bugs are rare but solder cracks are common (due to a known bad batch), simplicity favors solder. If firmware changes just happened, firmware is more likely. I need to make sure the procedure interrogates *why* one is deemed "simpler."

  Okay, ready to write.s
answer: |-
  This is a classic problem in quality engineering: **underdetermination**. You have evidence $E$ that is consistent with Hypothesis $A$ and Hypothesis $B$, but the system forces you to select one. In medical devices (ISO 13485 / FDA 21 CFR 820), closing a CAPA with the wrong root cause is a compliance risk because your corrective action won't prevent recurrence.

  Below is a decision procedure designed to break the "Confirmed/Not Confirmed" binary when the evidence doesn't support it. It distinguishes between *technical resolution* (evidence settles it) and *managerial resolution* (we must act despite ambiguity).

  ### The Underdetermination Protocol (UDP)

  **Goal:** To determine if a root cause is empirically settled or if the selection is based on unverified assumptions, priors, or pragmatics.
  **Inputs:** Failure Data, Candidate Root Causes (A and B), Test Method Description.

  #### Step 1: The Independence Check (Instrumentation Bias)
  **Question:** Does the evidence used to support (or rule out) Hypothesis A rely on measurement systems that Hypothesis B suggests are faulty (or vice versa)?
  *   **Pass Criteria:** The measurement tool is independent of the failure mode. (e.g., Using a calibrated caliper to measure a part dimension).
  *   **Fail Criteria:** The tool is part of the suspected failure chain. (e.g., Using the calibration oven to prove the oven is drifting).
  *   **Output if Fail:** **STOP.** Output "Undetermined." You cannot confirm either cause without an independent measurement standard (a "golden unit" or third-party calibration).
  *   **Output if Pass:** Proceed to Step 2.

  #### Step 2: The Discriminatory Power Check
  **Question:** Does the current dataset contain at least one data point that fits Hypothesis A but is statistically unlikely under Hypothesis B?
  *   **Pass Criteria:** Yes. (e.g., Failure only happens at high temp [fits A], never at low temp [rules out B]).
  *   **Fail Criteria:** No. The failure signature is identical for both causes given the current sensor resolution and sampling rate.
  *   **Output if Fail:** Proceed to Step 3.
  *   **Output if Pass:** **Confirmed.** (The evidence settles it).

  #### Step 3: The Base Rate Check (Validating "Simplicity")
  **Question:** Is the "simpler" hypothesis actually more probable based on historical base rates, or is it just easier to write down?
  *   **Pass Criteria:** Hypothesis A has a significantly higher prior probability (e.g., Vendor X's membranes have a known 5% contamination rate; Firmware has not changed in 3 years).
  *   **Fail Criteria:** Both hypotheses have similar historical frequency, OR the "simpler" one is chosen solely because it requires less investigation effort.
  *   **Output if Pass:** **Confirmed (Probabilistic).** You may select the higher-probability cause, but document the prior used.
  *   **Output if Fail:** Proceed to Step 4.

  #### Step 4: The Falsifiability Check
  **Question:** Is there a feasible test that *could* distinguish A from B, and if so, why was it not performed?
  *   **Pass Criteria:** A test exists (e.g., X-ray the solder, rollback the firmware) but was deemed too costly/time-consuming relative to risk.
  *   **Fail Criteria:** No test exists to distinguish them with current technology, OR the test was skipped without documentation.
  *   **Output if Pass:** **Handoff to Judgment.** (See Step 5).
  *   **Output if Fail:** **Undetermined.** You lack the capability to know. Do not check "Confirmed."

  #### Step 5: The Risk & Resource Handoff (Pragmatic Tiebreaker)
  **Question:** Since evidence is equal, which correction mitigates the highest patient risk, and who bears the cost of being wrong?
  *   **Instruction:** This is no longer a quality question; it is a risk management decision (ISO 14971).
  *   **Action:** If Risk(A) > Risk(B), fix A. If Cost(A) >> Cost(B) and Risk is low, fix B.
  *   **Output:** **Managerial Decision.** Document that root cause is "Indeterminate" but Corrective Action addresses *both* or the *highest risk* candidate.

  ---

  ### Case Study 1: Drift Failure (Membrane vs. Oven)
  **Scenario:** Flow sensors are drifting.
  **Hypothesis A:** Contaminated membrane stock (Supplier issue).
  **Hypothesis B:** Temperature sensitivity in calibration oven (Internal equipment issue).
  **Constraint:** You check the oven's performance using the oven's own internal probes and standard units calibrated *in that oven*.

  **Running the UDP:**
  1.  **Independence Check:** **FAIL.** You are using the oven to validate the oven. If the oven is drifting (Hypothesis B), your "standard" units are also drifting. You have no independent ground truth.
  2.  **Discriminatory Power:** N/A (Stopped at Step 1).
  3.  **Base Rate:** Irrelevant without independent data.
  4.  **Falsifiability:** A test exists (send units to a third-party metrology lab or use a handheld reference thermometer traceable to NIST).
  5.  **Outcome:** **Undetermined.**

  **Regulatory Consequence:** You cannot check "Confirmed" on the form. If you check "Confirmed: Membrane," and the oven is actually broken, you will reject good membranes (cost) or accept bad sensors (safety).
  **Recommendation:** Add the "Undetermined" box. The CAPA should be: "Quarantine batch. Send sample to third-party metrology lab to break measurement dependency."

  ### Case Study 2: Intermittent Drop (Solder vs. Firmware)
  **Scenario:** Intermittent signal drop.
  **Hypothesis A:** Cracked solder joint (Hardware).
  **Hypothesis B:** Firmware timing bug (Software).
  **Constraint:** Intermittent failure is hard to reproduce. Team wants to pick Firmware because it's "simpler" to write up. Firmware engineer will do the work either way.

  **Running the UDP:**
  1.  **Independence Check:** **PASS.** You can inspect solder (X-ray/SEM) independently of firmware logs.
  2.  **Discriminatory Power:** **FAIL.** The failure signature (signal drop) looks identical in the log data for both a physical disconnect and a logic timeout.
  3.  **Base Rate:** **FAIL/NEUTRAL.** You stated the team picks firmware for "simplicity," not because firmware bugs are historically more common than solder cracks. If solder cracks are actually common due to a known thermal cycling issue, "simplicity" is a bias, not a probability.
  4.  **Falsifiability:** **PASS.** You *could* X-ray the joints or revert to previous firmware.
  5.  **Risk & Resource Handoff:** **Handoff to Judgment.**
      *   *Evidence:* Equal.
      *   *Pragmatics:* The firmware engineer is "stuck with the work." This creates a conflict of interest. If they pick Firmware, they work more. If they pick Solder, Hardware team works more.
      *   *Risk:* A solder crack is likely to worsen over time (wear out). A firmware bug is likely constant.
      *   *Decision:* If this is a life-support flow sensor, **Hardware risk usually trumps Software risk** in terms of degradation. However, if the "simplicity" is purely about documentation effort, that is invalid.

  **Outcome:** **Managerial Decision (with Caveats).**
  Do not check "Confirmed: Firmware." Check "Undetermined."
  **CAPA Action:** Since you cannot distinguish, the corrective action must address the *symptom* robustly. E.g., Add software watchdogs (mitigates Firmware) AND improve soldering profile (mitigates Hardware).
  **Why:** If you confirm Firmware and it's actually Solder, the bug returns in 6 months. In dialysis, recurrence is a reportable event.

  ---

  ### Where This Procedure Misfires (Honest Critique)

  **1. Analysis Paralysis vs. Throughput**
  This procedure will slow down your CAPA closure rate. In a high-volume manufacturing environment, stopping to find a third-party metrology lab (Case 1) costs money and time.
  *   **When the "Simplicity Habit" is Fine:** If the failure is low-risk (non-critical alarm), the cost of investigation exceeds the risk of recurrence, and the "simpler" cause has a higher historical base rate. In low-stakes scenarios, Occam's Razor is a valid cost-saving heuristic.
  *   **When it is Not:** Dialysis flow sensors are critical. If the flow is wrong, the patient gets under- or over-dialyzed. You do not have the luxury of the "Simplicity Habit" here. The regulatory risk of a wrong root cause outweighs the efficiency gain.

  **2. The "Undetermined" Regulatory Trap**
  Adding an "Undetermined" box solves your technical honesty problem but creates a regulatory one. Auditors hate open loops.
  *   **Mitigation:** You must pair "Undetermined" with a **Robustness CAPA**. You cannot say "We don't know why, so we are shipping." You must say "We don't know which of these two caused it, so we are fixing the process to prevent *both*."
  *   **Misfire Risk:** If the team uses "Undetermined" as a lazy way to avoid doing the hard test (Step 4 Falsifiability), you have made the problem worse. The procedure requires that "Undetermined" triggers *more* testing or *broader* fixes, not less.

  **3. The Political Handoff (Case 2)**
  In Case 2, the procedure correctly identifies that the tiebreaker is pragmatic (who does the work). However, formalizing this handoff exposes internal resource conflicts to the audit trail.
  *   **Risk:** An auditor might ask, "Why did you not determine the root cause?"
  *   **Answer:** "The failure mode was physically indistinguishable given the cost/risk profile. We implemented controls for both potential causes." This is acceptable under ISO 13485 *if* the risk assessment supports it.

  ### Final Recommendation for Your Form

  You cannot just add a box; you must change the workflow associated with the box.

  1.  **Add the Box:** "Root Cause: Indeterminate (Competing Hypotheses A & B)."
  2.  **Add a Field:** "If Indeterminate, Justification for Corrective Action Selection."
      *   Options: *Risk Mitigation (Addressing Worst Case)*, *Cost/Benefit (Addressing Most Likely)*, *Insufficient Data (Further Testing Required)*.
  3.  **The Rule:** If "Insufficient Data" is selected, the CAPA cannot be closed. It must remain open until Step 1 (Independence) or Step 4 (Falsifiability) is passed.

  **Verdict on your team's habit:**
  In dialysis manufacturing, the simplicity habit is **unsafe**. It confuses "easiest to document" with "most probable physical cause." In software IT, picking the simpler cause is often fine (restart the server). In fluid dynamics affecting blood purification, "simple" is often a mask for "we didn't look hard enough." Use the UDP to force the distinction.
