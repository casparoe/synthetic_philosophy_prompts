answer: |-
  1. **Brainstorm dump**
  Control false positives long-run. Quantify belief in this specific hypothesis. Handle peeking and optional stopping. Account for publication bias and selection effects. Distinguish evidence from decision thresholds. Incorporate prior plausibility. Require preregistration to validate intent. Ensure computability for humans. Separate signal magnitude from existence. Be objective regardless of analyst. Be subjective but coherent. Handle multiple comparisons without penalty. Distinguish replication failure from effect shrinkage. Ensure reproducibility of code. Align with scientific intuition. Prevent p-hacking. Provide posterior probabilities. Maintain frequency calibration. Respect the Likelihood Principle. Ignore the Likelihood Principle. Treat data as fixed. Treat parameters as random.

  2. **The spec**
  An adequate account of statistical evidence must meet three non-negotiable requirements, while acknowledging two camp-specific preferences that often masquerade as universal laws.

  **1. Selection Accountability (Non-negotiable):** The theory must adjust evidential weight based on how many alternative analyses or studies were conducted but hidden. If a result is the winner of 20 hidden tests, it counts less than if it were the only test. *Motivation:* Without this, publication bias and p-hacking render literature meaningless, regardless of individual p-values.

  **2. Single-Case Evidential Meaning (Non-negotiable):** The theory must articulate what *this* dataset says about the hypothesis, not merely whether the procedure was reliable. *Motivation:* Scientists need to update beliefs about specific claims, not just trust the machine. A method that only speaks to long-run properties fails the individual researcher.

  **3. Long-Run Calibration (Non-negotiable):** The theory cannot systematically lie about error rates over time. If you claim 5% false positives, you must deliver roughly 5% false positives in the long run. *Motivation:* Science is cumulative; uncontrolled error rates corrupt the foundation for future work.

  **4. Intent Sensitivity (Camp Preference - Frequentist/Reform):** This demand states that evidence changes based on the researcher's stopping rule or analysis plan (e.g., preregistration). *Motivation:* Prevents cheating. *Critique:* Violates the Likelihood Principle; implies data meaning depends on unobserved thoughts.

  **5. Prior Integration (Camp Preference - Bayesian):** This demand states that evidence cannot be evaluated without incorporating prior plausibility. *Motivation:* Prevents believing implausible things based on noise. *Critique:* Introduces subjectivity that frequentists argue contaminates objective reporting.

  An adequate theory must satisfy 1–3. It must then explicitly admit whether it sacrifices 4 to save 2, or sacrifices 2 to save 4. Pretending to satisfy both is the root of the confusion. Preregistration is epistemically load-bearing only if you accept Intent Sensitivity; if you follow the Likelihood Principle, preregistration is merely bookkeeping for transparency, not a changer of evidence.

  3. **The test case**
  Original: p=0.03 (N=80). Replication: p=0.08 (N=800, effect 1/3 size).
  An adequate spec adjudicates this as **effect shrinkage, not binary failure**. Requirement 1 (Selection) suggests the original was likely inflated by noise or selection bias (the "winner's curse"). Requirement 2 (Single-Case) demands we look at the effect sizes, not just the significance stars. The replication's huge N provides precise evidence that the effect is small, not zero. The p=0.08 is irrelevant compared to the incompatible magnitudes. Both a Bayesian and a frequentist accepting this spec should agree: the original effect size was wrong, but the phenomenon likely exists at a smaller scale. The binary "failed replication" label is a violation of Requirement 2.

  4. **Where it bites**
  Here is the hard truth: Requirements 2 (Single-Case Meaning) and 3 (Long-Run Calibration) are jointly unsatisfiable if you also demand Objectivity. This is the Likelihood Principle vs. Error Statistics war. To guarantee long-run error control (3), you must consider all possible data you *could* have seen (stopping rules, intentions), which dilutes the meaning of the data you *did* see (2). To quantify evidence strictly based on the data observed (2), you lose the guarantee that your method won't mislead you in the long run if used repeatedly (3). You can have a statistic that tells you what to believe now, or one that guarantees you won't be wrong often later, but not both without hidden assumptions. Most textbooks pretend this trade-off doesn't exist. It does.

  5. **Quick scorecard**
  **Error-Control Frequentism:** Aces Long-Run Calibration and Selection Accountability. Fails Single-Case Meaning (p-values are not evidence measures). Treats Preregistration as epistemically load-bearing.
  **Subjective Bayes:** Aces Single-Case Meaning and handles Prior Integration naturally. Struggles with Long-Run Calibration (depends on prior choice) and often ignores Selection Accountability unless explicitly modeled.
  **Preregistration-First Reform:** Focuses entirely on Selection Accountability and Intent Sensitivity. Often lacks a coherent theory of evidence itself, relying on frequentist tools that contradict the philosophical justification for preregistration.

  6. **What I can quote you on**
  "No statistical method can simultaneously guarantee long-run error control and deliver a definitive verdict on a single study without hiding a trade-off."
