prompt: |-
  Hey — you're a philosopher of statistics who's spent way too long in the weeds of the frequentist/Bayesian wars but can still talk to normal humans. I need you to think carefully before answering, and I mean actually carefully: start by brainstorming before you commit to anything.

  So here's my situation. I'm a journalist, I cover science and ideas, and I'm working on a long feature pegged to roughly a decade of the replication crisis being mainstream. Everyone I interview has a take: ditch p-values, preregister everything, go full Bayes, keep frequentism but teach it better, abandon significance entirely, etc. etc. Before I do the interviews I want to get the spec straight in my own head. What would an adequate account of statistical evidence — some theory of what the numbers from a study actually tell you — have to deliver to count as adequate? Not "which camp wins," but the requirements list, the things any view has to get right or it's disqualified.

  Brainstorm first, then prune — I want to see you generate a big pile of candidate demands people make in this debate, including the ones you'll end up throwing out as tribal shibboleths rather than genuine requirements, and then cut them with a word on why. The real list I want the requirements plus the motivating case behind each, and for each one mark whether it's non-negotiable or a preference of one camp pretending to be a universal demand. Two requirements I do want on the table somewhere, because they're where I keep getting lost: (1) does the theory have to say something about whether THIS result is evidence, or only about whether the procedure that produced it is reliable, and what exactly is at stake in that choice — like, does it change what a stopping rule can do to your conclusions; (2) whatever the theory says about a single study, does it handle selection — the fact that published effects are inflated even when nobody cheated, because of how many ways there are to analyze data and which ones reach print. And here's a concrete case I'd like the requirements to actually adjudicate, because it's the kind of thing my readers hit constantly: original study reports p = 0.03 with 80 participants; a much bigger direct replication, 800 participants, gets a point estimate about a third the size with p = 0.08. Was the original finding "an effect that's just smaller than advertised," or "a failed replication"? If your requirements list can't help a reader tell those apart, it's not done. I'm also curious whether preregistration is epistemically load-bearing on your list or just bookkeeping — like, does the theory have to treat the same data differently depending on the analysis plan that was fixed in advance?

  Then the part I most want: tell me honestly whether some subset of the requirements is jointly unsatisfiable. I have a suspicion that the single-case-evidence demands and the procedure-reliability demands can't both be fully met, and if that's right, say so plainly — that's the actual news, arguably.

  Give it to me in this structure, sections in this order:

  1. **Brainstorm dump** (~150 words) — the candidate demands, including the junk, no editorializing yet.
  2. **The spec** (~600 words) — the pruned requirements, each with its motivating case, each marked non-negotiable vs camp preference.
  3. **The test case** (~150 words) — what the spec says about my p = 0.03 / p = 0.08 replication, and whether the answer is the same for a Bayesian and a frequentist who both accept the spec.
  4. **Where it bites** (~200 words) — any jointly unsatisfiable subset, or a clean statement that there isn't one and why you believe that.
  5. **Quick scorecard** (~150 words) — error-control frequentism, subjective Bayes, and whatever you'd call the preregistration-first "just do honest science" position, each against the list. Brief, this is the least important part.
  6. **What I can quote you on** (one sentence, plain English, something a reader who has never heard of the likelihood principle can repeat at dinner).

  Don't pad. If two requirements are really one requirement wearing a hat, merge them. And please dont hedge everything into mush — I'm a journalist, definately not a statistician, but I can smell a dodge.
