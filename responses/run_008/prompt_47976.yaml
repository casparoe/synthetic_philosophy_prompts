      *   **Task:** Reconstruct the epistemological view presupposed by the practice, analyze if it's truly dogmatic or pragmatic (tractability), check if the paradoxical step is necessary, identify underdetermination (different epistemologies leading to same behavior), suggest what would change the analysis, and flag potential inaccuracies in the user's formulation of the paradox.
      *   **Constraint:** Work from the structure provided by the user, even if their memory of the paradox is imperfect (but flag discrepancies).

