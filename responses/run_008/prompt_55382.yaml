          *   *Pair:* Coherentism false (4) vs. Benign Circularity (5).
              *   Why apparent? (4) rejects *mutual support* generating justification (coherentism). (5) accepts *self-support* (epistemic circularity) for reliability claims. One is about system-wide coherence, the other about source validation. They can be distinguished.
