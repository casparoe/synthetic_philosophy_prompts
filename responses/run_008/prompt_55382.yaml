          *   *Option:* Drop Inference Requirement (3).
              *   Why? It's very strong. If I drop it, I don't need to justify the method to use it.
              *   Cost: Opens door to skepticism or easy justification.
          *   *Selection:* Dropping Internalism (2) is the standard move to save (5) and (1). It resolves the Alston-style conflict.
          *   *Word count check:* Needs to be punchy.

