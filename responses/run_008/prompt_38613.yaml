  Consider a cosmos governed by classical Hamiltonian field equations, strictly time-reversal invariant, existing on a temporal manifold parameterised by $t \in [-T, T]$. The microdynamics admit no intrinsic arrow; the asymmetry arises solely from a single macroscopic boundary condition imposed at $t=0$, stipulating a state of exceptionally low entropy (a crystalline 'Omega' configuration), while the states at $t=\pm T$ are left unconstrained and evolve to high-entropy thermal equilibrium. The entropic profile $S(t)$ is symmetric and V-shaped, rising smoothly and monotonically as $|t|$ increases away from the central boundary in either temporal direction, with no significant fluctuations to permit Boltzmann brains. Observers emerge in the intermediate regions, say at $t = \pm T/2$, embedded in thermodynamic environments where energy dissipation supports complex structures; these inhabitants possess functional memory stores and record-keeping apparatuses that correlate with macroscopic states, and there exist similar observers at $t = \pm (T/2 + \delta)$ on both sides of their location along the parameter $t$. The physics is entirely local and deterministic, with no retrocausal signalling or exotic laws; the only stipulation is that the low-entropy surface at $t=0$ is treated formally as a final boundary condition for the $t<0$ branch, despite the manifold's symmetry.

  ### The Check

  **Laws:** Time-reversal invariant Hamiltonian dynamics.
  **Boundary Condition:** Single low-entropy macrostate fixed at $t=0$ (the 'Omega Constraint').
  **Entropic Profile:** $S(t)$ minimises at $t=0$ and increases monotonically as $t \to \pm T$.

  **Predictions:**
  1.  **Past-Hypothesis (PH) View:** On this account, the direction of time is grounded in the asymmetry of the boundary condition. The 'arrow' points away from the low-entropy boundary. Since the boundary is at $t=0$, the thermodynamic arrow for observers at $t<0$ points towards $t=-T$. Consequently, the PH predicts that inhabitants will identify the direction of $t=-T$ (increasing entropy) as their *future* and $t=0$ (decreasing entropy) as their *past*. Their records will correlate with the low-entropy state at $t=0$.
  2.  **Perspectival/Anthropic View:** On this account, the 'past' is defined indexically by the direction of lower entropy relative to the observer's current state, as this is the direction that permits the formation of records. Since entropy decreases as observers at $t<0$ look towards $t=0$, this view also predicts that inhabitants will identify $t=0$ as the *past* and $t=-T$ as the *future*. Their memories will point towards the low-entropy boundary.

  **Verdict:** The two accounts **converge**. Both predict that the inhabitants will call the low-entropy direction ($t=0$) the 'past' and the high-entropy direction ($t=-T$) the 'future'. Consequently, this case **fails to discriminate** between a view that grounds the arrow in a global boundary condition and a view that grounds it in the local entropic gradient relative to the observer. Both rely on the alignment of the psychological arrow with the entropic gradient.

  ### Three Honest Notes

  **1. The Feature Doing the Work**
  The single feature driving this convergence is the **monotonic alignment of the entropic gradient with the boundary condition**. The case works only because the direction of entropy increase (away from the boundary) is the same direction in which records can physically form. If you remove this feature by replacing the single boundary with **no low-entropy boundary** (a universe in eternal thermal equilibrium), neither account can generate an arrow of time, and the question dissolves. If you replace it with **low-entropy boundaries at both ends** (a 'Gold Universe' with high entropy in the middle), the accounts might diverge: the PH might struggle to define a unique global arrow, whereas local perspectival accounts would predict arrows pointing away from the central high-entropy region towards both boundaries. The current construction forces agreement by ensuring a unique gradient.

  **2. The Past-Hypothesis Defender's Attack**
  A defender of the Past Hypothesis would likely attack the case by rejecting the coherence of labelling the $t=0$ boundary as the 'future'. They would argue that the term 'past' is not a neutral coordinate label but is **constitutively tied** to the direction of the low-entropy boundary. On this view, stipulating that the low-entropy condition is at the 'future end' is a category error; by definition, the low-entropy boundary *is* the past. This objection can stick without mere fiat if one accepts that our temporal concepts (memory, causation, agency) are conceptually dependent on the entropic asymmetry. If 'past' just means 'the direction of the low-entropy boundary', then the thought experiment becomes tautological: the inhabitants call the low-entropy direction the past because that is what 'past' means. The case only has bite if one assumes 'past' is a pre-theoretic temporal direction independent of entropy, which the PH defender denies.

  **3. Discriminating Entropic from Causal Accounts**
  No variant of this construction can discriminate between entropic accounts and causal or interventionist accounts, because in a world governed by standard statistical mechanics, **the causal arrow supervenes on the entropic arrow**. Interventionist accounts (such as those of Woodward or Price) typically ground the direction of causation in the asymmetry of independent fixability, which itself relies on the thermodynamic gradient. To separate them, one would need a scenario where the entropic gradient and the causal gradient diverge—for instance, a world where records form in the direction of *increasing* entropy but causal influence propagates towards *decreasing* entropy. However, constructing such a world without violating the second law or introducing retrocausal dynamics (which you forbade) is likely impossible within known physics. Thus, all such cases remain neutral between entropic and causal explanations, as they rise and fall together.
