prompt: |-
  Design an activity for my comparative political economy seminar -- 14 undergrads, one 90-minute session -- on the question of why some nations are rich. Here's what I want it to actually do: the students shouldn't be told the answer, they should run into the inference problem itself.

  My rough idea (please make it concrete and runnable): split the room into maybe five "settlements" that play a simple multi-round game -- producing, trading, building stuff that pays off over time. You secretly vary three things across settlements: starting endowments (some get rich resource draws), rules (one settlement gets strong property rights, another has a rotating "raider" role that can confiscate accumulated stuff, etc.), and nothing for the last pair -- but whatever norms they happen to develop internally just get left alone. Overhead should be minimal: dice or a deck of cards, paper, a simple score sheet. No real money needed.

  Then the twist, which is the whole point: a couple of students get pulled out as "economic historians" who only see the final scoreboard and maybe a few noisy "archival scraps" you hand them, and have to explain why the outcomes diverged. They can't watch the game and they can't ask for a rerun.

  For the debrief: map each element of the game onto the real thing (endowments ~ geography, rules ~ institutions, whatever the low-intervention groups evolved ~ culture), and get the historians to say out loud what they'd need to know to settle their explanation, then show them why the game denies them exactly that. Crucially I want the moment where someone says "just run it again with different rules and see" and you point out that this is precisely the move history doesn't allow.

  Also include: a realistic timeline for the session, what will predictably go wrong the first time I run it (I'm guessing the raider mechanic makes people genuinely mad, and the historians finish early and get bored -- tell me how to handle both), and an honest note on which parts of the real inference problem the game can't reproduce and I'll have to just assert in the debrief -- like the fact that in real history the "rule changes" themselves were endogenous to the geography and the culture, so the three channels aren't clean separate treatments the way they are in my game. If you can think of a way to muddy that even a little within the mechanics, bonus points.
reasoning: |-
  Here's a thinking process that leads to the suggested activity design:

  1.  **Analyze the Request:**
      *   **Target:** Comparative Political Economy Seminar (Undergrads).
      *   **Size/Time:** 14 students, 90 minutes.
      *   **Core Question:** Why are some nations rich? (Development Economics/Political Economy).
      *   **Pedagogical Goal:** Students must *experience* the inference problem (identification problem), not just be told about it. They need to see correlation without causation.
      *   **Mechanism:** 5 "settlements" playing a multi-round production/trading game.
      *   **Variables:** Secretly vary Endowments (Geography), Rules (Institutions), and Norms (Culture/Nothing).
      *   **Twist:** "Economic Historians" only see final scores + noisy data, must explain divergence without observing the process.
      *   **Debrief:** Map game to reality, highlight the impossibility of counterfactuals ("run it again"), and discuss endogeneity.
      *   **Requirements:** Concrete rules, timeline, troubleshooting (raider anger, historian boredom), limitations (endogeneity).

  2.  **Deconstruct the Game Mechanics:**
      *   *Constraint:* 14 students, 5 groups. That's roughly 2-3 students per group. Let's aim for 3 groups of 3 and 2 groups of 2 (Total 13) + 1 Historian? Or 4 groups of 3 (12) + 2 Historians?
      *   *Correction:* The prompt says "split the room into maybe five settlements." If I have 14 students, and I need "Economic Historians," some students *must* be historians.
      *   *Revised Grouping:* 4 Settlements (3 students each = 12) + 2 Historians (2 students = 14). This works better. 4 settlements allow for clearer variation than 5 with this class size.
      *   *The Variables:*
          1.  **Geography (Endowment):** High vs. Low starting resources/dice rolls.
          2.  **Institutions (Rules):** Secure Property Rights vs. Predatory/Extractive.
          3.  **Culture (Norms):** No specific rules, just "do what you want" (Control).
          4.  *Wait, I need 4 settlements.* Let's do a 2x2 design or distinct types.
              *   Settlement A: Good Geo, Good Inst.
              *   Settlement B: Bad Geo, Good Inst.
              *   Settlement C: Good Geo, Bad Inst.
              *   Settlement D: Bad Geo, Bad Inst. (Or maybe the "Culture" one).
              *   *Refinement:* The prompt suggests: Endowments, Rules, and "Nothing/Norms." Let's simplify to ensure the inference problem is sharp.
              *   Settlement 1 (Rich Start, Safe): "North America" proxy.
              *   Settlement 2 (Poor Start, Safe): "Scandinavia/Japan" proxy.
              *   Settlement 3 (Rich Start, Unsafe): "Resource Curse" proxy.
              *   Settlement 4 (Poor Start, Unsafe): "Fragile State" proxy.
              *   *Wait, the prompt asks for "Historians" who only see the end.* If I have 2 historians, they need a job during the game.
      *   *The Historian Role:* They must be isolated. They cannot see the game. They need "Archival Scraps."
      *   *The "Inference Problem":* The Historians need to see *similar outcomes from different causes* or *different outcomes from similar causes* to be confused.
      *   *Better Design for Inference:*
          *   Settlement 1: High Endowment, Secure Rules. (Expected: Rich)
          *   Settlement 2: Low Endowment, Secure Rules. (Expected: Medium/Rich)
          *   Settlement 3: High Endowment, Predatory Rules. (Expected: Poor/Medium)
          *   Settlement 4: Low Endowment, Predatory Rules. (Expected: Poor)
          *   *Twist:* Make Settlement 2 (Low/Secure) end up richer than Settlement 1 (High/Secure) due to a random shock or trading advantage, OR make Settlement 3 (High/Predatory) end up rich despite predation.
          *   *Actually, the prompt wants the Historians to fail to distinguish.* The best way to do this is **Equifinality** (different paths to same result) or **Multifinality** (same start, different results).
          *   *Let's stick to the prompt's specific variation:* Endowments, Rules, Norms.
          *   Settlement 1: High Endowment, Secure Rules.
          *   Settlement 2: Low Endowment, Secure Rules.
          *   Settlement 3: High Endowment, Raider Rules.
          *   Settlement 4: Low Endowment, "Free" (Norms).
          *   *Historian Task:* Explain why Settlement 1 and 3 have different scores, or why 2 and 4 differ.

      *   *Game Loop:* Simple. Roll dice -> Get Resources -> Invest/Consume.
      *   *Materials:* Dice, paper, tokens (paper clips?).

  3.  **Drafting the Mechanics (Iterative Process):**
      *   *Production:* Roll 2d6. Sum = Resources.
      *   *Investment:* Keep resources to multiply next turn? Or just accumulate points? Let's keep it simple: Accumulate "Wealth Points" (WP).
      *   *Variation:*
          *   **Geo:** Settlement A & C roll 2d6 + 2. Settlement B & D roll 2d6 - 1 (min 1).
          *   **Inst:** Settlement A & B keep all WP. Settlement C has a "Raider" (Instructor or rotated student?) who takes 50% at end. Settlement D has no rules (instructor watches for cheating but doesn't enforce).
          *   *Wait, 14 students.* 4 Groups of 3 = 12. 2 Historians.
          *   *Historian Isolation:* They need to leave the room or face the wall with headphones? Facing the wall with "Archival Packets" is easier.
      *   *The "Inference Trap":* The Historians get a data sheet.
          *   Settlement A: Final Score 100. (High Geo, Good Inst)
          *   Settlement B: Final Score 90. (Low Geo, Good Inst)
          *   Settlement C: Final Score 40. (High Geo, Bad Inst)
          *   Settlement D: Final Score 45. (Low Geo, No Inst)
          *   *Problem:* This is too clear. A/B > C/D. Institutions matter.
          *   *Need more noise:* Let's make Settlement C (High Geo/Bad Inst) end up with 85 points because they got lucky on dice, while Settlement B (Low Geo/Good Inst) ends up with 80 because they rolled poorly.
          *   *Now the Historians see:* Group 1 (100), Group 2 (80), Group 3 (85), Group 4 (40).
          *   *Historian Question:* Why is Group 3 richer than Group 2? Is it Geography (Group 3 had high potential) or Institutions (Group 2 had secure rights)? The data is confounded.

  4.  **Addressing Specific Constraints & Troubleshooting:**
      *   *Raider Anger:* If a student is the "Raider," they might feel like a villain. *Fix:* Make the Raider an institutional rule (e.g., "Tax Collector" card drawn every round), not a specific student role, OR make the Raider an external force (Instructor) so students don't hate each other. *Better:* Instructor is the Raider. It depersonalizes the extraction.
      *   *Historian Boredom:* They sit for 30 mins doing nothing. *Fix:* Give them "Archival Work." They have to code the "scraps" (ambiguous notes) while the game happens.
      *   *Endogeneity:* The prompt asks to muddy the waters. *Idea:* Allow Settlement D (Norms) to *choose* their rules after Round 2. This mimics institutions being endogenous to culture/choices.

  5.  **Developing the Timeline (90 Mins):**
      *   0-10: Intro & Grouping.
      *   10-15: Historians isolated & briefed.
      *   15-45: Game (3 Rounds of 10 mins + setup).
      *   45-60: Historians analyze data.
      *   60-90: Debrief & Lecture.

  6.  **Refining the "Inference Problem":**
      *   The core lesson is **Observational Equivalence**.
      *   I need to ensure the Historians *cannot* know the treatment.
      *   I need to ensure the Treatments *actually* produce ambiguous results (via randomness).
      *   *Crucial:* The Instructor must rig the dice or guide the outcomes slightly to ensure the ambiguity exists. If random chance makes the "Bad Inst" group win big, that's perfect. If not, the Instructor might need to nudge (ethically questionable for pure science, but okay for pedagogy? No, let's rely on variance).
      *   *Better:* The "Archival Scraps" should be contradictory. One scrap says "They had great soil." Another says "They fought a lot."

  7.  **Finalizing the Design:**
      *   **Title:** "The Development Black Box."
      *   **Groups:** 4 Settlements (3 students each), 2 Historians (2 students). Total 14.
      *   **Materials:** Dice, paper, envelopes (for secrets), "Archival Packets."
      *   **Mechanics:**
          *   Round 1: Production (Dice).
          *   Round 2: Investment/Trade.
          *   Round 3: Final Harvest.
          *   *Secret Treatments:*
              *   Alpha: High Geo (Bonus Dice), Good Inst (Keep All).
              *   Beta: Low Geo (Penalty Dice), Good Inst (Keep All).
              *   Gamma: High Geo (Bonus Dice), Bad Inst (Instructor takes 50%).
              *   Delta: Low Geo (Penalty Dice), Endogenous (Students vote on rules R2).
      *   **Historians:** Get a spreadsheet of Final Scores + 3 ambiguous notes per group.
      *   **Debrief:** Map Alpha->USA, Beta->Singapore, Gamma->Venezuela, Delta->Somalia (maybe too loaded? Use abstract labels). Focus on the *methodological* inability to distinguish Geo vs. Inst.

  8.  **Addressing the "Endogeneity" Bonus:**
      *   For Group Delta, give them a blank rule sheet. Tell them "You make the rules." If they choose good rules, they succeed. If bad, they fail. In debrief, point out: "Did Culture cause the Rules, or did Rules cause the Culture?"

  9.  **Addressing "Raider Anger":**
      *   Make the extraction automatic. "The State Tax." Instructor collects it. Don't make one student rob another.

  10. **Addressing "Historian Boredom":**
      *   Give them a "Coding Sheet." They have to transcribe the "scraps" into variables while the game runs. It keeps them busy and mimics data cleaning.

  11. **Review against Constraints:**
      *   14 undergrads? Yes (4x3 + 2).
      *   90 mins? Yes.
      *   No real money? Yes.
      *   Inference problem central? Yes.
      *   Troubleshooting included? Yes.
      *   Limitations noted? Yes.

  12. **Writing the Plan:** (Self-Correction during drafting)
      *   *Correction on Timeline:* 90 minutes is tight. Game needs to be very simple. 3 Rounds is enough.
      *   *Correction on Historians:* 2 Historians working together is better than alone.
      *   *Correction on Endogeneity:* Make sure Group Delta's choice is recorded as a "scrap" for the historians to find, but it shouldn't be obvious *why* they chose it.

  13. **Final Polish:** Ensure tone is academic but practical. Emphasize the "Aha!" moment in the debrief. (Proceed to generate output).

  *(Self-Correction during final output generation)*: Wait, if the Historians see the final scores, and Group Gamma (High Geo/Bad Inst) gets taxed 50%, they will likely have low scores. Group Alpha (High Geo/Good Inst) will have high scores. The Historians might correctly guess Institutions matter.
  *How to create the Inference Problem?*
  I need **Collinearity**.
  If High Geo *always* goes with Good Inst in the real world (e.g., temperate zones developed property rights), you can't separate them.
  *Game Adjustment:*
  *   Group 1: High Geo, Good Inst. (Result: High)
  *   Group 2: Low Geo, Good Inst. (Result: Med)
  *   Group 3: High Geo, Bad Inst. (Result: Med) -> *Crucial:* The Bad Inst penalty roughly cancels the High Geo bonus.
  *   Group 4: Low Geo, Bad Inst. (Result: Low)
  *   *Historian View:* Group 1 is Rich. Group 2 & 3 are Middle. Group 4 is Poor.
  *   *Question:* Why are 2 & 3 equal? Is it because Geo compensates for Inst? Or Inst compensates for Geo?
  *   *Even Better:* Make the outcomes *identical* for two groups with different treatments.
      *   Group A (High Geo, Bad Inst) -> Score 50.
      *   Group B (Low Geo, Good Inst) -> Score 50.
      *   Historians see: "Both scored 50."
      *   Historians argue: "A is rich because of resources." "No, B is rich because of rules."
      *   *This is the winner.* I will instruct the instructor to nudge the dice if necessary to ensure this convergence happens, or rely on the math of the bonus/penalty.
      *   *Math:*
          *   Base Roll: 2d6 (Avg 7).
          *   High Geo: +3 per round.
          *   Low Geo: -2 per round.
          *   Bad Inst: Lose 50% at end.
          *   3 Rounds.
          *   Group A (High/Bad): (7+3)*3 = 30. End: 15. (Too low).
          *   Group B (Low/Good): (7-2)*3 = 15. (Too low).
          *   *Need to tweak math.*
          *   Let's simplify. Production = Dice.
          *   High Geo: Roll 3d6, keep best 2.
          *   Low Geo: Roll 2d6, keep lowest 1 (Harsh).
          *   Bad Inst: 40% tax.
          *   Okay, I will provide a "Balance Sheet" in the instructions to help the instructor ensure the convergence happens, acknowledging that in a real run, variance might mess it up, but the *attempt* creates the discussion.
          *   *Actually, the most robust way:* The Historians get *noisy* data. They don't see the exact scores, they see "Rank 1, Rank 2 (Tie), Rank 4." Or they see scores but the "Archival Scraps" contradict.
          *   *Decision:* I will design the math so High Geo/Bad Inst ≈ Low Geo/Good Inst. This creates the perfect identification crisis.

  14. **Final check on "Endogeneity":**
      *   Group 4 (Low Geo, No Rules). Let them *write* their own rule in Round 2.
      *   If they write "No Theft," they mimic Good Inst.
      *   Historians see: Group 4 did well. Scrap says "They agreed to share."
      *   Debrief: Did culture create the rule, or did the need for survival create the culture?

  15. **Ready to write.**
answer: |-
  Here is a complete, runnable design for your 90-minute seminar session. It is built to force the identification problem into the open through gameplay mechanics rather than lecture.

  # Activity Title: The Development Black Box

  **Class Size:** 14 Undergraduates
  **Time:** 90 Minutes
  **Materials:** 4 Envelopes (labeled A, B, C, D), 6 dice, paper, pens, 2 "Archival Packets" (prepared handouts), 1 Projector/Board.

  ## 1. The Setup (0:00 – 0:10)

  **Grouping:**
  Divide the class into **6 teams**.
  *   **4 Settlements** (3 students each = 12 students).
  *   **2 Economic Historians** (2 students).

  **The Cover Story:**
  Tell the class: *"We are simulating 500 years of economic development in 90 minutes. Four settlements will build wealth. Two historians will observe the aftermath and write the causal explanation."*

  **Isolation (Crucial):**
  *   **The Historians:** Send them to a corner of the room (or the hallway if space is tight). They must face away from the settlements. Give them headphones or ask them to hum if it gets loud. Hand them the **"Archival Packet"** (see below) and a "Data Coding Sheet." Their job is to transcribe and analyze the scraps *while* the game happens. They cannot look up.
  *   **The Settlements:** Arrange them in four corners of the room. Hand each group a sealed **Envelope** (A, B, C, D). **Tell them not to open it until instructed.**

  ## 2. The Game Mechanics (0:10 – 0:40)

  The game consists of **3 Rounds** (representing centuries). Each round takes 7 minutes.

  **Basic Production Rule (Public Knowledge):**
  1.  Roll 2d6.
  2.  Sum = **Gross Output**.
  3.  Add Gross Output to your **Wealth Score** (on paper).
  4.  *Optional:* You may "Invest" 5 points from your score to add +1 to your dice roll in future rounds.

  **The Secret Treatments (Inside the Envelopes):**
  *You (the Instructor) know the contents. The students do not.*

  *   **Settlement A (The Lucky Land):** *Geography:* Roll 3d6, drop the lowest (High Endowment). *Institutions:* Keep 100% of wealth.
  *   **Settlement B (The Disciplined):** *Geography:* Roll 2d6, subtract 1 from total (Low Endowment). *Institutions:* Keep 100% of wealth.
  *   **Settlement C (The Resource Curse):** *Geography:* Roll 3d6, drop the lowest (High Endowment). *Institutions:* **The Tax.** At the end of every round, the Instructor visits, counts their wealth, and removes 45% (round down).
  *   **Settlement D (The Wildcard):** *Geography:* Roll 2d6, subtract 1 (Low Endowment). *Institutions:* **Endogenous.** No rules provided. In Round 2, they must vote on one rule to adopt for the rest of the game (e.g., "No stealing," "Share equally," "Winner takes all"). You enforce whatever they choose.

  **Running the Rounds:**
  *   **Round 1 (10 mins):** Groups open envelopes, read rules, Roll 1, calculate wealth.
  *   **Round 2 (10 mins):** Investment phase (optional), Roll 2, calculate wealth. *Group D votes on their rule now.*
  *   **Round 3 (10 mins):** Roll 3, Final Calculation.
  *   **Instructor Role:** Move between groups. For Group C, perform the "Tax" visibly but silently. For Group D, record their chosen rule on a slip of paper to put in the Historians' packet later.

  ## 3. The Historian's Task (0:40 – 0:55)

  Call time. Settlements freeze. Collect the final Wealth Scores from the four groups. Write them on the board anonymously (Group 1, 2, 3, 4).

  **The Twist:**
  Retrieve the Historians. They join the main room. They **do not** know the envelope contents. They only have:
  1.  **The Final Scoreboard:** (You have arranged the math so that Group A and Group C have similar scores, or Group B and C do. Ideally: **A is Rich, B & C are Middle, D is Poor**).
  2.  **The Archival Packet:** This contains 3 "scraps" per group. These are deliberately ambiguous.
      *   *Scrap 1 (Geo):* "Traveler's log: The soil was fertile" OR "The land was barren." (Mixed signals).
      *   *Scrap 2 (Inst):* "Court records show frequent disputes" OR "Contracts were honored."
      *   *Scrap 3 (Culture/Noise):* "The people were hardworking" OR "They prayed often."

  **Assignment:**
  The Historians have 15 minutes to write a 1-paragraph explanation for the divergence in wealth. They must pick the *primary* driver: Geography, Institutions, or Culture. They must present this to the class.

  ## 4. The Debrief & The "Aha!" Moment (0:55 – 1:30)

  **Step 1: The Historians Present (5 mins)**
  Let them argue. One will likely say "Institutions" (pointing to Group A's success). Another might say "Geography" (pointing to Group C's high output before tax).
  *Ask:* "Can you prove it?"
  *Answer:* "No, the data is noisy."

  **Step 2: Reveal the Treatments (10 mins)**
  Ask each Settlement to read their Envelope instructions aloud.
  *   **The Shock:** The class will realize Group C (Resource Curse) had the *same Geography* as Group A (Lucky Land) but different outcomes due to Institutions.
  *   **The Confusion:** But wait—if Group B (Disciplined) ended up with similar wealth to Group C despite bad geography, was it Institutions saving them, or Geography holding them back?
  *   **The Endogeneity:** Ask Group D what rule they chose. If they chose "Share equally," ask: "Did your culture create that rule, or did your poverty force you to cooperate?"

  **Step 3: The Counterfactual Trap (10 mins)**
  Someone will inevitably say: *"Okay, now we know the rules. Let's run it again but swap Group C's rules with Group B's to see what happens."*

  **Stop the class here.** This is the core lesson.
  *   **You say:** "In this classroom, we can. In history, we cannot. You cannot re-run 19th Century Mexico with 19th Century US institutions. The 'treatment' is fused to the history."
  *   **Point out:** The Historians had *observational data*, not *experimental data*. They saw correlation (Rules + Wealth), but they couldn't isolate the variable.

  **Step 4: Limitations & Endogeneity (5 mins)**
  Be honest about what the game simplified.
  *   **Clean vs. Messy:** In the game, I *gave* you the institutions (exogenous). In reality, rich nations often *bought* better institutions (endogenous).
  *   **The "Raider" Emotion:** Acknowledge that Group C might feel frustrated. In reality, that frustration leads to revolution, which changes the game entirely—something our simple score sheet didn't capture.

  ---

  # Instructor's Cheat Sheet & Troubleshooting

  ### 1. The Math (Ensuring the Inference Problem)
  To make the Historians' job hard, you want **Equifinality** (different causes, same result).
  *   **Target:** Make Settlement B (Low Geo/Good Inst) and Settlement C (High Geo/Bad Inst) finish with roughly the same score.
  *   **How:**
      *   Avg Roll (2d6) = 7.
      *   **Group B:** (7 - 1) * 3 Rounds = 18 points.
      *   **Group C:** (7 + 3 [3d6 drop low]) = 10 * 3 Rounds = 30 points. Tax 45% = ~16.5 points.
      *   *Result:* Both end up near 17 points.
      *   *Historian Dilemma:* "Why are B and C equal? Is B poor because of Geo? Is C poor because of Inst?" They cannot distinguish the drag of bad geography from the drag of bad institutions.

  *Note:* If the dice go wild and ruin this balance, **intervene subtly.** If Group C is too rich, announce a "Corruption Scandal" (extra tax) in Round 3. If Group B is too poor, give them a "Trade Wind" bonus. *Pedagogy trumps pure randomness here.*

  ### 2. Predictable Failure Point: The "Raider" Anger
  *   **Risk:** Students in Group C feel singled out or bullied by you taking their points.
  *   **Fix:** Depersonalize the extraction. Do not say "I am taking this." Say "The Institutional Rule dictates a 45% leakage." Use a printed "Tax Card." If they get angry, **good.** Use it in the debrief. "That anger you feel? That's political instability. That's why investment stopped in Round 2."

  ### 3. Predictable Failure Point: Historian Boredom
  *   **Risk:** Historians finish coding their scraps in 5 minutes and stare at the wall for 25.
  *   **Fix:** The "Archival Packet" must require work. Include a "Data Cleaning" task.
      *   *Scrap 1:* Handwritten note that is slightly illegible.
      *   *Scrap 2:* A "damaged" table with missing numbers they have to interpolate.
      *   *Scrap 3:* A contradictory secondary source ("Author X says they were rich, Author Y says they were poor").
      *   *Task:* They must write a "Methodology Note" explaining why they trust one scrap over another. This mimics the actual labor of economic history.

  ### 4. The Endogeneity "Muddy Water" (Bonus)
  For **Settlement D**, do not give them a rule sheet. Give them a blank paper.
  *   **Instruction:** "You have no state. In Round 2, you must write one law. If you write nothing, you lose 50% of wealth to 'Chaos'."
  *   **The Trap:** If they write a good law and succeed, Historians will say "Culture saved them."
  *   **The Reveal:** In debrief, ask Group D *why* they wrote that law. If they say "Because we wanted to win," you point out: **Institutions are choices.** But choices are constrained by... what? Geography? History? This opens the door to discuss Acemoglu vs. Sachs vs. Weber without lecturing.

  ## 5. What This Game Cannot Do (The Honest Note)
  In your closing remarks, explicitly state these limitations so students don't over-learn the lesson:
  1.  **Time Scale:** Real institutions take centuries to calcify; here they were assigned in an envelope.
  2.  **Violence:** In the game, the "Tax" was peaceful. In history, bad institutions often require civil war to change. The game gamifies coercion.
  3.  **Global Trade:** The settlements traded very little. In reality, the "Rich" nations often got rich by extracting from the "Poor" ones (Core-Periphery), not just internal rules.
  4.  **The "Run it Again" Problem:** Reiterate that while *we* can discuss swapping Group B and C's rules, history is a **single non-repeatable trial**. This is why Political Economy relies on natural experiments (colonial mortality, borders, etc.) rather than controlled trials.

  ## Materials Checklist
  *   **4 Envelopes:** Label A, B, C, D. Insert rule sheets.
  *   **2 Archival Packets:** Final scores (anonymized), 3 "scraps" per group, coding sheet.
  *   **Dice:** 6 standard d6.
  *   **Score Sheets:** One per settlement.
  *   **Timer:** Visible to all.

  This design ensures the students *feel* the frustration of the historian before you give them the comfort of the political economist's explanation.
