      1. Introduction.
      2. The Fatal Triad (1, 2, 3).
      3. The Compatibilist Borrowing (2 vs 4).
      4. The Normative Redundancy (3 vs 5).
      5. Revisions/Costs.
      6. Confidence/Uncertainty.

      *Wait, need to make sure I answer "which pairs".* I will group (1) and (2) as a combined premise for the first conflict, but acknowledge the pair (2)-(3) is the direct clash given (1). I'll focus on (2) vs (3) as the primary pair, noting (1) locks the door.

