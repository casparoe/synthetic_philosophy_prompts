      *   **Nash Equilibrium:** The only equilibrium is the 1/3-1/3-1/3 mix. Playing any pure strategy (or non-equilibrium mix) is "irrational" in the NE sense because it is exploitable. **Verdict:** "Pure strategies are ruled out; only the specific randomization is sensible."

