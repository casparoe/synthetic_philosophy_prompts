  ### 4. The Distinguishing Test Case
  To tell **Mixed IESDS** apart from **Nash Equilibrium**, you need a game where the set of rationalizable strategies (IESDS) is larger than the set of equilibrium strategies (NE). Specifically, a game with **no dominated strategies but a unique Mixed Strategy Equilibrium.**

  **The Case:** **Rock-Paper-Scissors** (or a modified Matching Pennies).
