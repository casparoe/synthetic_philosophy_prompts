          *   It creates **Epistemic Learned Helplessness** regarding the opposing view (you see it, you try to evaluate it, but the framing ensures you reject it, so you learn that opposing views are always wrong).
      *   **Synthesize:** The core metric is not *what you hear*, but *whether hearing it could change your mind.*

  7.  **Refining the Principle Name:**
      *   "Epistemic Bubble" vs "Echo Chamber" is the standard academic distinction (O'Connor & Weatherall, 2018). I should explicitly reference this as it matches the user's intuition perfectly.
