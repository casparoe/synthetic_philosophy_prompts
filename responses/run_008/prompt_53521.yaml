      *   *The Blocker vs. Follower:* The Blocker is in a bubble (missing voices). The Follower is in a chamber (active discrediting). The User feels the Chamber is "more broken." Why? Because bubbles are fragile; chambers are robust.
      *   *The Unifying Principle:* It's not about *exposure*. It's about *updateability* or *defeasibility*. How does the system handle contradictory evidence?
      *   *Candidate Principle:* **Epistemic Closure / Immune System.** A community is epistemically broken to the degree that it possesses a *systematic mechanism to neutralize contradictory evidence without updating beliefs.*

