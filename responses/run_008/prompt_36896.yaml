answer: |-
  ### Desiderata for a Municipal Currency of Egalitarian Concern

  As a philosopher who has sat in similar rooms, I commend you for pausing to define the metric before debating the budget. The "equality of what?" question is not merely academic; it determines who the city sees as disadvantaged and who it ignores. Below is the specification list for an adequate metric, derived from the literature on distributive justice (Sen, Rawls, Dworkin, Nussbaum) but hardened for municipal application.

  **1. Non-Accommodation of Adaptive Preferences**
  *   **Specification:** The metric must not register an increase in advantage solely because an individual has lowered their expectations to match oppressive or deprived circumstances. It must distinguish between *satisfaction* and *opportunity*.
  *   **Motivating Case:** The homebound resident with chronic fatigue who reports high life satisfaction due to downwardly adapted expectations. A welfare-based metric (subjective well-being) would rank her as "better off" than her miserable neighbor with the same condition, potentially deprioritizing care for both. This requirement mandates that the metric identify the *deprivation of function* (e.g., inability to leave home) regardless of the psychological coping mechanism employed to endure it.

  **2. Responsibility-Sensitivity (Needs vs. Tastes)**
  *   **Specification:** The metric must distinguish between disadvantages arising from brute luck (unchosen circumstances) and those arising from expensive preferences (chosen lifestyle choices). The city owes compensation for the former, not necessarily the latter.
  *   **Motivating Case:** The sailing enthusiast who claims effective poverty due to his hobby costs versus families with children. A strict resource metric (income) treats them equally. A strict welfare metric might subsidize the sailor to equalize his happiness. This requirement demands the metric flag the families' costs as *needs* (claim on public resources) and the sailor's costs as *tastes* (private responsibility), preventing the "expensive tastes" objection from draining the social safety net.

  **3. Liberal Neutrality (Non-Perfectionism)**
  *   **Specification:** The metric must not presuppose a specific conception of the "good life" or pathologize identity differences that the affected community does not view as deficits. It must measure *access to functionings* without mandating *specific functionings*.
  *   **Motivating Case:** The Deaf resident who rejects the framing of deafness as a deficit. A "human functioning" metric that lists "normal hearing" as a central capability would automatically score him as deprived compared to a hearing neighbor, violating his self-conception. The metric must instead measure barriers to *social participation* or *communication access* (e.g., availability of interpreters) without asserting that hearing is inherently superior to deafness.

  **4. Administrative Tractability**
  *   **Specification:** The metric must be computable using data the municipality currently collects or can reasonably collect without intrusive new surveillance. It must be aggregable across 250,000 residents within a fiscal quarter.
  *   **Motivating Case:** The plain fact of municipal capacity. A sophisticated "Capability Set" measure requiring in-depth interviews about every resident's potential freedoms is theoretically ideal but practically impossible. If the data requires self-reported psychological states or complex audits of personal conversion factors, the equity review will stall, and budget decisions will revert to the default (usually income-based) metrics.

  **5. Sensitivity to Conversion Factors**
  *   **Specification:** The metric must account for the fact that different individuals require different amounts of a resource to achieve the same level of advantage. It cannot treat a dollar or a bus pass as having uniform value across all residents.
  *   **Motivating Case:** Implicit in the homebound resident case. Giving a wheelchair user the same transit budget as an able-bodied resident is not equal treatment because the *conversion* of money into mobility differs. This requirement rules out crude resourcism (e.g., "everyone gets $500") that ignores disability, geography, or social infrastructure.

  **6. Public Justifiability**
  *   **Specification:** The logic of the metric must be explainable to the public without recourse to esoteric philosophical theory. Residents must be able to understand why they are ranked as they are.
  *   **Motivating Case:** General democratic legitimacy. If the city uses a complex weighted index that implies "Person A is more disadvantaged than Person B" based on hidden variables, it invites political backlash and accusations of social engineering. The metric must be transparent enough to survive a town hall meeting.

  ***

  ### Analysis of the Desiderata

  Here are the three specific analyses you requested regarding the structure and implications of this list.

  #### 1. Status of Requirements and Joint Unsatisfiability
  **Non-Negotiable vs. Preference:**
  *   **Non-Negotiable:** *Administrative Tractability* and *Public Justifiability*. Without these, the metric is not a policy tool; it is a thought experiment. *Non-Accommodation of Adaptive Preferences* is also non-negotiable for an *equity* panel; if you measure only satisfaction, you are measuring contentment, not justice.
  *   **Preference of Camp:** *Responsibility-Sensitivity* is a preference of "Luck Egalitarians" (Dworkin, Cohen). Some "Social Egalitarians" (Anderson) argue the city should ensure everyone stands as equals regardless of whether their need arose from bad luck or bad choices. *Liberal Neutrality* is a preference of Political Liberalism (Rawls); a more perfectionist state might argue that hearing *is* objectively better and should be promoted.

  **The Joint Unsatisfiability Tension:**
  You are correct to suspect a conflict. **Non-Accommodation of Adaptive Preferences (Req 1)** and **Liberal Neutrality (Req 3)** are in severe tension, and in hard cases, jointly unsatisfiable.
  *   **The Conflict:** To identify a preference as "adaptive" (e.g., the homebound resident who says she is happy), you must possess a normative benchmark of what her life *should* look like or what she *would* want under non-oppressive conditions. This requires the state to judge her internal valuation of her life.
  *   **The Clash:** This judgment violates Liberal Neutrality. In the Deaf resident case (Req 3), if you respect his neutrality, you must accept his valuation that deafness is not a deficit. But if you apply Anti-Adaptive Preferences rigorously, you might argue his acceptance of a world without interpreters is an adaptation to ableist oppression. You cannot simultaneously refuse to judge his conception of the good (Neutrality) and insist his satisfaction is distorted by oppression (Anti-Adaptive). One of these must yield in practice, usually resulting in a "soft paternalism" where the city overrides stated preferences only in cases of severe, objective deprivation.

  #### 2. The Single Requirement That Does the Most Work
  **Administrative Tractability.**
  While *Anti-Adaptive Preferences* is the philosophical hammer that destroys Welfarism, *Administrative Tractability* is the practical guillotine that excludes the main theoretical contenders.
  *   **Why:** Pure **Welfare** metrics are excluded because deep subjective well-being data is hard to collect at scale. Pure **Capability** metrics (in the Sen/Nussbaum sense) are excluded because measuring "effective freedom" requires counterfactual data (what *could* you do?) which administrative records do not contain.
  *   **Result:** This requirement forces the panel toward **Resource-Based Proxies** (income, asset tests, disability status flags) adjusted by **Conversion Factors** (disability multipliers). It doesn't give you the *best* philosophical metric, but it gives you the only *existent* one. It excludes the ideal theories and leaves you with the muddied middle ground of adjusted resourcism.

  #### 3. Adequacy Demands vs. Scholarly Prejudices
  I will be candid about the provenance of these requirements.

  *   **Genuine Demands of Adequacy:**
      *   **Administrative Tractability:** This is not a prejudice; it is a condition of existence for public policy. A metric that cannot be calculated cannot guide a budget.
      *   **Public Justifiability:** In a democracy, the state must justify its coercion (taxing and spending) in terms citizens can grasp. This is a demand of political legitimacy, not just philosophy.

  *   **Scholarly Prejudices Dressed as Conditions:**
      *   **Responsibility-Sensitivity (Req 2):** This is a specific commitment to **Luck Egalitarianism**. It assumes the distinction between "circumstance" and "choice" is coherent and that the state should not subsidize choices. A **Social Egalitarian** would argue this is prejudicial; they would say the city's job is to eliminate oppressive relationships, not to audit whether a citizen "deserves" their hardship. By including this as a hard requirement, you are pre-loading the panel against unconditional support programs.
      *   **Non-Accommodation of Adaptive Preferences (Req 1):** While crucial for justice, this relies on the **Objective List** prejudice. It assumes the panel (or the metric) knows what a "good life" looks like better than the resident does. It smuggles in a perfectionist standard under the guise of protecting the vulnerable. It is a necessary prejudice for an equity panel (otherwise you ignore oppression), but it is a prejudice nonetheless.

  **Final Advice:** Your panel will likely default to an income-based metric with disability add-ons because of *Administrative Tractability*. Your job is to ensure *Sensitivity to Conversion Factors* is applied to those add-ons, so the "disability flag" isn't just a binary switch but reflects the actual cost of participation. Be wary of the tension between Neutrality and Adaptive Preferences; when they clash, prioritize the removal of structural barriers (Neutrality) over the correction of internal psychology (Adaptive Preferences), as the former is within the city's legitimate power and the latter is not.
