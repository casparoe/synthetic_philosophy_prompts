      *   *Rejection:* Step 4 conflates "response-dependent" with "arbitrary/variable."
      *   *Hume's Move:* Hume grants beauty is a sentiment (response-dependent) but argues the *capacity* to feel it is uniform in healthy human nature.
      *   *The "True Judge":* The standard isn't the aggregate of all responses (which might be fashion), but the consensus of those with "strong sense, united to delicate sentiment, improved by practice, perfected by comparison, and cleared of all prejudice."
      *   *Cost of Rejection:* You have to accept a normative claim about human psychology. You have to believe there is a "healthy" vs. "unhealthy" aesthetic response. This is a naturalistic normativity.
