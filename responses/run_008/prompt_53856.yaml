      *   The user is spot on. The flatmate's argument glosses over Hume's distinction between *general* sentiment and the sentiment of the *true judge*.
      *   Hume isn't saying "if everyone likes it, it's good." He's saying "if the *qualified* critics like it, it's good."
      *   The flatmate treats the consensus as a brute sociological fact (Step 1 & 4). Hume treats it as a normative fact grounded in human nature's uniformity *when functioning correctly*.

  4.  **Identify the Weak Link:**
