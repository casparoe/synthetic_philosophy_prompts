  2.  **Deconstruct the Views & Identify Tensions:**

      *   *View 1 (Total Hedonic Utilitarianism):* $Value = \sum Happiness - \sum Suffering$. Linear aggregation.
      *   *View 2 (Lexical Suffering):* Extreme Suffering = $-\infty$ (or lexicographically prior). No amount of $+H$ cancels $-S_{extreme}$.
      *   *View 3 (Pro-Creation):* $Value(Populated) > Value(Empty)$. Implies $+H$ adds value.
