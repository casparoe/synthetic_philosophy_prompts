      *   *View 5 (Small Tradeoffs):* Small $-S$ is acceptable for large $+H$ or prevention of large $-S$.

      *   *Tension A: (1) vs (2).*
          *   (1) says "add it up." (2) says "don't add extreme suffering into the sum; it vetoes the sum."
          *   *Severity:* High. This is a contradiction in the aggregation function. Standard utilitarianism is aggregative; lexical views are non-aggregative regarding that specific category.
          *   *Resolution:* You have to abandon pure aggregative utilitarianism (1) or soften the lexical claim (2).

      *   *Tension B: (2) vs (3) & (4).*
