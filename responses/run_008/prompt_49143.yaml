  1. **The logical space**
  The debate turns on several fault lines. First, does the unease we feel toward the moral saint indicate a defect in the saint's character or a defect in our moral standards? Second, is moral goodness a maximizable quantity, or does it have a saturation point beyond which more sacrifice yields no moral credit? Third, regarding psychological strain: is the agent who helps effortlessly superior to one who struggles, or does the struggle indicate a deeper commitment? Finally, do nonmoral excellences (wit, hobbies, style) possess intrinsic value independent of their utility to others, or are they merely instrumental tools for moral productivity? These branch points determine whether you view the saint as an aspirational ideal, a warning sign, or a category error. Your position depends on whether you see the conflict between personal good and moral good as real or illusory. If the conflict is real, morality may need limiting; if illusory, personal interests must align with the good. These distinctions carve the logical space between those who seek to maximize the good and those who seek to live well. The resulting topology maps not just normative conclusions but meta-ethical commitments about the nature of value itself.

  2. **The quiz**
  1. Alex paints daily to restore energy, enabling 10% more charity work. Is this time morally protected?
     A) Yes, inherently. B) Yes, instrumentally. C) No, sacrifice it.
  2. Blake loves music but stops instantly if told it reduces lifetime helping by 0.1%. Is Blake admirable?
     A) Admirable. B) Disturbed. C) Rational but cold.
  3. Casey is morally flawless but humorless and boring. Is Casey a perfect person?
     A) Yes. B) No. C) Morally perfect, personally deficient.
  4. Dana visits a sick friend out of duty, feeling no affection. Is Dana's action morally worthy?
     A) Yes, highly. B) No, lacking warmth. C) Minimally worthy.
  5. Erin donates a kidney to a stranger, suffering chronic pain. Did Erin do more than duty required?
     A) Yes. B) No, it was required. C) Duty doesn't apply here.
  6. Frank collects stamps. It helps no one. Is Frank's time wasted morally?
     A) Yes. B) No. C) Only if he could have helped more.
  7. Grace helps others but resents it. Helen helps and enjoys it. Who is morally better?
     A) Grace. B) Helen. C) Equal.
  8. If everyone were morally flawless like the saint, would society be better?
     A) Yes. B) No, colder. C) Unsure.
  9. Ian helps because he loves it. Jordan helps because reason demands it, despite indifference. Who is more virtuous?
     A) Ian. B) Jordan. C) Equal.
  10. Once you ensure others' survival, are you permitted to keep the rest for luxury?
      A) Yes. B) No. C) Only some.

  3. **Scoring key**
  **Wolf-style pluralism.** You likely answered that nonmoral projects have independent value and the dull saint is deficient. You see moral goodness as one component of personal goodness, not the whole. The saint is morally fine but not an ideal human. You reject the maximization of morality at the expense of personal identity. You prioritize balance where moral demands do not crowd out personal interests that make life worth living. Your view preserves a distinction between being good and being a good person.

  **Strict consequentialist.** You likely answered that Blake is admirable and Frank's time is wasted unless instrumental. You believe moral goodness is maximizable. Unease at the saint is a bias to be reformed. The right action is always the one producing the best outcome, regardless of personal cost or strain. Any hesitation to sacrifice everything for the greater good indicates a failure of rational commitment to the impartial good. You deny the personal/moral split.

  **Sophisticated consequentialist.** You likely protected Alex's painting but only because it enables more work. You value nonmoral projects instrumentally. You differ from the strict leaf by acknowledging psychological limits, but ultimately, morality grounds the value of the projects. If the painting stopped helping, it would lose value. You argue that allowing hobbies maximizes long-term utility, so the saint should have hobbies, but only because efficiency demands it, not because hobbies matter in themselves.

  **Virtue-ethical.** You likely favored Helen over Grace and found Dana's action lacking. You see the strained saint as an artifact of bad theory. Virtue requires proper motivation and emotion, not just right action. The dull saint lacks the virtue of sociability. Morality is about character, not just output. You emphasize the integration of moral requirements into a flourishing life, where the right action flows naturally from a cultivated disposition rather than abstract obligation or mere consequence.

  **Kantian.** You likely protected Erin's supererogation and Jordan's duty-bound motive. You distinguish perfect duties from imperfect duties, leaving room for own ends. Duty done for duty's sake has worth, even without inclination. The saint fulfills duty but isn't required to maximize goodness beyond universalizable maxims. Within the bounds of duty, you are free to pursue happiness. The saint who goes beyond duty is praiseworthy but not required, preserving the agent's right to their own ends.

  **Deflationary.** You likely questioned the threshold and ideal questions. You think "maximal moral goodness" is not well-formed. Once duty and supererogation are pulled apart, the saint debate dissolves. There is no single metric to maximize. The category of "saint" is rhetorical, not philosophical. Moral theory should define what is required, not what is best. The unease regarding saints arises from conflating what we must do with what we might admire, creating a false problem where none exists.

  4. **Unoccupied combinations**
  Consider the combination of valuing nonmoral excellences intrinsically (a Wolf-style commitment) while simultaneously insisting on maximizing moral output regardless of personal cost (a Strict Consequentialist commitment). This combination is unoccupied because it is logically incoherent. If nonmoral excellences have intrinsic value, sacrificing them always for moral output denies that value. It treats them as intrinsic yet expendable for a higher single metric, which collapses back into strict consequentialism where only the moral metric matters. Alternatively, it implies a lexical ordering that contradicts the intrinsic claim. No coherent theory claims hobbies matter for their own sake but should always be destroyed for morality. This diagnostic gap highlights the structural tension between monistic and pluralistic value theories.

  5. **What the quiz cannot separate**
  The quiz struggles to distinguish Wolf-style pluralism from sophisticated consequentialism. Both may protect the hobbyist's time. The pluralist says hobbies matter inherently; the consequentialist says they matter for burnout prevention. Without asking counterfactuals (e.g., "What if the hobby didn't help?"), the quiz cannot separate intrinsic vs. instrumental valuation of personal projects. A sophisticated consequentialist can mimic the pluralist's answers by citing long-term utility. Additionally, the Kantian and Virtue leaves may overlap on the "dull saint" case, as both value character over output, though for different reasons. The quiz relies on intuitive reactions which may not track theoretical commitments. Participants might agree on the case but disagree on the justification, rendering the sorting mechanism superficial. Consequently, the quiz may categorize users by emotional resonance rather than logical consistency.

  6. **Pushback, if any**
  The quiz format presupposes discrete positions, but many philosophers hold hybrid views. The 'Strict Consequentialist' leaf risks being a strawman; few demand immediate self-destruction. Reducing commitments to case judgments may obscure whether participants disagree on facts or values. The instrument might sort psychological reactions rather than philosophical commitments. Finally, the debate may be verbal: if 'moral goodness' is defined differently by each leaf, cases cannot arbitrate. You might measure terminology preferences rather than substantive disagreements. The instrument assumes cases reveal theory, but theory often dictates how cases are described.
