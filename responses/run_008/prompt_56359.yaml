  4.  **Identify the Core Tension:**
      The argument is a classic "Vacuity Charge" against Revealed Preference Theory (RPT). It closely mirrors arguments made by Amartya Sen, Daniel Hausman, and even early critiques of Samuelson.
      The critical pivot point is usually between (1)/(2) and (4)/(5).
      If (1) is strictly behaviorist, (4) follows, and (5) kills the theory.
      To save the theory while keeping (1) mostly intact, we need to nuance the definition of "Choice" in (2) or the applicability of "Consistency" in (4).

      *The Equivocation:* The word "Choice" (and "Alternative").
      In economics, choice implies *counterfactual robustness* under *varying constraints*.
      In physics, a falling body follows *one* path determined by initial conditions. It doesn't "choose" least action in the sense that it *could have* done otherwise if prices changed.

