      The content comes from *out-of-sample prediction* under *counterfactual constraints*.
      Premise (4) fails because thermostats/rocks don't respond to *economic* constraints (prices/income), they respond to physical parameters.
      But to keep it behavioral (no mentality), we need to define the "situation" carefully.

      *Refining the Attack:*
      The strongest move for a skeptical philosopher of economics is to reject **(2)** but reinterpret it, or reject **(4)** based on the requirements of **(3)**.
