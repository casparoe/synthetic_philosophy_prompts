      *   **The Fix:** Adopt a **Dispositional Behaviorism**. Preference is not the single act, but the *mapping* from constraint sets to selections.
      *   **Addressing (4):** Thermostats do not satisfy the *full* consistency conditions because they don't respond to *budget* changes, only physical error signals. They lack the domain of applicability.
      *   **Addressing (5):** The theory has content because it restricts *how* behavior changes when constraints change (Slutsky symmetry, etc.), not just that behavior is consistent.
      *   **Cost:** We lose the simplicity of "watching one act." We must commit to the stability of the disposition across counterfactual scenarios. This borders on "mentalism" but stays behavioral if defined as input-output mapping stability.

  6.  **Refining the "Cost":**
