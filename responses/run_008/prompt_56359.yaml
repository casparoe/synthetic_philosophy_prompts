          *   *Cost of Rejection:* Must distinguish physical necessity from economic constraint.

      *   **Premise (5): Universality $\rightarrow$ Vacuity.**
          *   *Tradition:* Popper (falsifiability), Hausman.
          *   *Strength:* Strong philosophical point. A theory that predicts everything predicts nothing.
          *   *Weakness:* Depends on the scope of the theory. Maybe economics *isn't* universal.
          *   *Cost of Rejection:* Admit economics is a special science, not a universal logic of action.

      *   **Premise (6): Conclusion.**
