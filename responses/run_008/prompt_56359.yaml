      If I reject (5): I argue universality isn't vacuity. Cost: Hard to defend philosophically.

      *Best Path:* Reject **(2)** via a specific distinction between *behavior* and *choice*. Choice implies **responsiveness to constraints**.
      A falling body's path is invariant to "prices." An agent's path changes when relative costs change.
      This preserves (1) (Preference is still revealed by choice) but refines "Choice" to mean "Response to varying constraints," not just "Output."
      This attacks the equivocation in (4). The thermostat doesn't "trade off" in the economic sense; it follows a fixed rule. It doesn't re-optimize when the "price" of electricity changes (unless programmed to, which makes it an extension of the programmer's agency).

      *Wait, let's look closer at (1).*
      (1) says "Preference is defined by choice."
      If we keep this, we are committed to RPT.
      The problem is that RPT *without* a ceteris paribus clause on the *nature of the agent* becomes vacuous.
      Hausman's critique: RPT makes the theory unfalsifiable *unless* we assume stability of preferences.
      But the argument here is about *vacuity*, not falsifiability per se.

      *Let's focus on the Equivocation:*
      The term **"Opportunity"** in (1) and **"Alternatives"** in (2).
      In economics, alternatives are *counterfactually robust*. If the price of X rises, I *can* still buy X, but I choose not to.
      In physics, if the initial conditions change, the path changes. But at time $t$, the body *cannot* do otherwise.
      So, (2) is false. Choice requires the *possibility* of doing otherwise (modal robustness), even if defined behaviorally (e.g., "If the constraint set had been $B'$, the choice would have been $Y$").
      A falling body does not satisfy the counterfactual condition: "If gravity were priced differently..." (Nonsense).
      A thermostat: "If electricity cost more..." (It doesn't care, unless designed to).

      *So, Reject (2).*
      Why it looked innocent: It aligns with behaviorism.
      What it costs: We can't just look at *one* action. We need a *disposition* across *hypothetical* choice sets. We need a modal claim without mental states. This is the "Dispositional Account" of preference.
      Does this save (1)? Yes, if (1) is read as "Preference is the *disposition* to choose..." not "Preference is the *act* of choosing."
      Does this save the theory from vacuity? Yes, because thermostats/rocks don't have the right dispositional structure regarding *economic* variables.

  5.  **Drafting the Response:**
      *   **Tone:** Academic, rigorous, sympathetic but critical. Acknowledge the strength of the study group's argument (it's a classic).
