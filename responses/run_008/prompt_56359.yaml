      *Best Strategy:* Attack the interpretation of **Consistency** in (3) and (4). The Representation Theorems require consistency *across varying choice sets*, not just a single trajectory. A falling body doesn't face varying budget sets. A thermostat doesn't face prices.

      *Wait, a deeper cut:* The real issue is the *explanatory direction*.
      RPT says: We observe choices $\rightarrow$ We infer preferences $\rightarrow$ We predict new choices under new constraints.
