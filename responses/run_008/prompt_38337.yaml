  The tiered structure strictly presupposes that *sentience* is the necessary condition for moral considerability, but that *phylogenetic classification* is the sufficient epistemic proxy for legal administrability. The law does not commit to brain size or vertebrate anatomy as intrinsically morally relevant; the inclusion of cephalopods proves that specific neural architecture is not required, only functional capacity for suffering. Thus, neural complexity serves as an epistemic screening device for sentience, not a moral end in itself.

