  *   **Strictly Presupposed:** Moral status hinges on the capacity for suffering. Legal standing requires group-level evidence rather than individual proof.
  *   **Optional:** That brain size matters intrinsically. That relational duties are the only source of obligation. The specific phylogenetic line (vertebrates vs. invertebrates) is optional, provided the proxy tracks sentience reliably.
  *   **Up for Grabs:** The exclusion of insects is underdetermined. It could reflect a genuine evidentiary gap (sentience view), a lack of human relationship (relational view), or political economy (cost of protection). The law accommodates all three.

  The awkward data points (bees excluded, cephalopods included) confirm this underdetermination rather than inconsistency. A sentience-first view licenses cephalopod inclusion via the precautionary principle but struggles with insect exclusion unless evidence thresholds are set arbitrarily high. A relational view explains farm animal protections (animals under human control) but fails to explain wild vertebrate research protections. The current synthesis is "precautionary phylogenetics": we protect groups where sentience is probable enough to outweigh economic inconvenience. The exclusion of insects despite cognitive feats indicates the law prioritizes *structural* neural evidence over *behavioral* evidence, likely due to the risk of false positives in small brains. The decapod distinction (lobsters vs. shrimp) highlights implementation lag rather than theoretical difference.

  **Diagnosis & Implications**
  If the implicit theory shifted to count insects' inner lives, mere line-redrawing would be insufficient. A phylogenetic cutoff becomes philosophically confused if sentience is graded or convergent. Concrete changes would require:

  1.  **Replacing Binary Status:** Moving from "protected/not protected" to context-sensitive welfare obligations based on specific capacities (e.g., stunning requirements for flies during mass rearing).
  2.  **Epistemic Shift:** Research ethics would need behavioral assays for invertebrate suffering, not just anatomical checks.
  3.  **Economic Restructuring:** Insect farming for feed would face slaughter regulations comparable to vertebrates, likely rendering current high-volume, low-margin models untenable.
  4.  **Administrative Burden:** Approval committees would need entomological expertise, shifting from phylogenetic presumption to case-by-case harm assessment.

  Ultimately, the current law presupposes that moral status is binary and trackable via taxonomy. Acknowledging insect sentience collapses this taxonomy, demanding a functional welfare framework unmoored from phylum.
