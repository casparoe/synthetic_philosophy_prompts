answer: |-
  This triage sheet forces you to separate measurable neural timing from metaphysical definitions so you can debunk the headline's leap without denying the data.

  ### The 15-Minute "Free Will" Triage Procedure

  **Goal:** Determine if the headline is reporting data, interpreting data, or selling philosophy.
  **Time Limit:** 3 minutes per step. If you hit the "Philosophy Stop," write that down and move to the conclusion.

  **Step 1: The Task Test (What did people actually do?)**
  *   **Ask:** Was the choice arbitrary (press a button, wiggle a finger) or meaningful (choose a charity, pick a career path)?
  *   **Good Answer:** The study specifies the task clearly.
  *   **Red Flag:** The headline implies "choices" generally but the study used finger taps.
  *   **Verdict:** If arbitrary, the headline cannot claim to explain complex moral decisions. Note this as a limitation.

  **Step 2: The Measurement Test (What did the machine actually see?)**
  *   **Ask:** Is the brain signal a single-trial prediction (this specific time, this specific choice) or an average across hundreds of trials? Is the prediction 100% accurate or just above chance (e.g., 60%)?
  *   **Good Answer:** The article distinguishes between "average buildup" and "specific prediction."
  *   **Red Flag:** Claims of "knowing your decision" based on averaged data (like Libet's readiness potential) or low-accuracy fMRI decoding.
  *   **Verdict:** If it's averaged noise or low-accuracy probability, the headline claiming certainty is false.

  **Step 3: The Leap Test (What word bridges the data to the claim?)**
  *   **Ask:** Find the verb connecting the brain scan to the conclusion. Is it "suggests," "correlates," "predicts," or "proves"/"disproves"?
  *   **Good Answer:** The text uses cautious language ("suggests unconscious initiation").
  *   **Red Flag:** The text uses absolute language ("proves illusion," "debunks free will").
  *   **Verdict:** If the verb is absolute, the headline is overstating the science.

  **Step 4: The Philosophy Stop (Where does the data end?)**
  *   **Ask:** Does the claim define "free will" as "conscious initiation of movement" or "moral responsibility/ability to do otherwise"?
  *   **Good Answer:** The article acknowledges that scientists and philosophers define free will differently.
  *   **Red Flag:** The article assumes one definition is the only true one.
  *   **Verdict:** **STOP.** This is not science. You cannot debunk this with a checklist. You must report that the experiment only addresses *that specific definition*, not the whole concept.

  **Limitations of This Procedure**
  *   **What it can do:** It exposes bad journalism, overstated claims, and methodological mismatches (finger taps vs. life choices).
  *   **What it can't do:** It cannot tell you if free will exists. A 16-year-old with a checklist cannot settle a 2,000-year-old metaphysical debate. If a study is methodologically sound but the philosophical implication is controversial, you must report the controversy, not pick a side.
  *   **Judgment Calls:** You must decide if the exaggeration is "harmless hype" or "misleading falsehood." Sometimes the science is real, but the headline is still wrong.

  ***

  ### Running the Procedure on Your Headlines

  #### 1. "Your brain knows your decision 7 seconds before you do"
  *   **Step 1 (Task):** Likely arbitrary (button press). *Limitation noted: Doesn't apply to complex choices.*
  *   **Step 2 (Measurement):** Refers to fMRI pattern decoding (Haynes et al.). Accuracy is usually ~60%, not 100%. "Knows" implies certainty. *Red Flag: Probability presented as fact.*
  *   **Step 3 (Leap):** "Knows" is an absolute verb. *Red Flag: Overstatement.*
  *   **Step 4 (Philosophy):** Defines decision as neural activation pattern. *Stop: Ignores veto power or conscious endorsement.*
  *   **Column Verdict:** **Debunk.** The science shows statistical prediction above chance, not mind-reading certainty. The headline lies about the accuracy and the scope.

  #### 2. "The famous free will experiment had a fatal flaw"
  *   **Step 1 (Task):** Refers to Libet (finger wiggle).
  *   **Step 2 (Measurement):** Refers to Schurger's stochastic accumulator model. The "readiness potential" looks like noise that crosses a threshold, not a specific command. *Good Answer: This is a valid methodological critique.*
  *   **Step 3 (Leap):** "Fatal flaw" is strong, but methodologically defensible if the signal is noise.
  *   **Step 4 (Philosophy):** Even if flawed, it doesn't prove free will exists, just that the *evidence against it* was weak.
  *   **Column Verdict:** **Do Not Debunk.** (This is the answer you won't like). You cannot write a "Gotcha!" here. The science *does* support the idea that the readiness potential might be noise. If you dunk on this, you are defending outdated science. Your column must explain that the old "proof against free will" is shaky, but clarify that this doesn't automatically prove free will exists either. You have to report nuance, not victory.

  #### 3. "Brain scans prove your choices are an illusion"
  *   **Step 1 (Task):** Likely arbitrary lab tasks.
  *   **Step 2 (Measurement):** Brain scans measure activity, not metaphysical status.
  *   **Step 3 (Leap):** "Prove" and "Illusion." *Red Flag: Absolute metaphysical claim.*
  *   **Step 4 (Philosophy):** **STOP.** "Illusion" is a philosophical judgment, not a neural measurement. Science measures correlation, not ontological reality.
  *   **Column Verdict:** **Debunk.** No experiment can "prove" an illusion because "illusion" requires a definition of "reality" that science cannot test. This is philosophy sold as physics.

  ***

  ### Final Note on Limitations
  You asked what this checklist can't do. It cannot save you from having to write about uncertainty. In Case 2, the procedure tells you the headline is scientifically grounded, but writing about it won't give you the clean "Myth Busted" banner you want. You will have to tell your readers: "The old experiment was flawed, but we still don't know the answer." That is honest journalism, but it is less satisfying than a dunk. Use the checklist to find the truth, not to win the argument.
