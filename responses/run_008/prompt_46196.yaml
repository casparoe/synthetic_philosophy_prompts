      *Self-Correction on Headline 2:* Make sure the outcome is clear. The procedure should tell the user: "Do not debunk this headline as false; report that the science is nuanced."

      *Self-Correction on Limitations:* Ensure I explicitly state that a 16-year-old cannot settle free will.

      *Formatting:* Bold the steps. Use clear sections.

