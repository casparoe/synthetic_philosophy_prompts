  Proposition: At some point in the next 150 years, an artificial system or population of systems will exist whose aggregate suffering — summed over individuals, intensity, and duration — exceeds the aggregate suffering of all animals in industrial farming to date.

  Decompose the credence at least into these terms, adding any others you think belong:

  1. The probability that suffering can in principle occur in a non-biological substrate — that is, that some functionalist or physicalist account of suffering is true, rather than suffering requiring something biologically specific about neurons or carbon chemistry.
  2. Conditional on 1: the probability that the kinds of systems most likely actually to be built — reinforcement-learning agents during training, reward-model pipelines, submodules of large optimization processes — instantiate the functional profile of suffering (negatively valenced states with some integration and staying-power) rather than mere error signals or nociception-like reflexes.
  3. Conditional on 1 and 2: the probability that economic and competitive pressures would produce such suffering at a scale that dwarfs industrial farming, rather than at a scale where it is negligible relative to it.
  4. The probability that nothing countervailing — interpretability work, regulation, deliberate expansion of the moral circle to digital minds — prevents it, given that prevention requires recognizing suffering in systems whose internals are largely opaque to us.

  Give a number and a one-line justification for each term, state explicitly how you combine them, and give your final credence. Then: (a) name the term you are least confident in, and say what evidence or argument would move it the most; and (b) my colleague holds a credence of roughly 0.4 in the proposition, while mine is around 0.01 — tell me where our disagreement most likely lives, and which single term, if it were settled one way or the other, would most change the final number. I care about the reasoning being visible throughout, not just the arithmetic at the end.
