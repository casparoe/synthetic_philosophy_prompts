answer: |-
  This is a sophisticated and compelling line of reasoning. It is intuitively very strong: if the world is genuinely open, how can statements about it be already fixed as true or false?

  However, your conclusion that physics has "decisively settled" the matter in Aristotle's favor, and that contemporary philosophers are ignoring this, relies on a few conflations. Specifically, it conflates **metaphysical determinism** with **semantic bivalence**, and it assumes a specific interpretation of quantum mechanics (QM) is the only valid one.

  Here is an explanation of where the reasoning goes wrong, what QM actually implies, and why the philosophical debate is far from obsolete.

  ### 1. Physics Has Not Decisively Settled Indeterminism
  Your argument rests on the premise that "Quantum mechanics tells us that the future is genuinely indeterminate." While this is the standard textbook (Copenhagen) interpretation, it is not the only one, nor is it physically proven to the exclusion of others.

  *   **Many-Worlds (Everettian) Interpretation:** In this view, the wave function evolves deterministically according to the Schrödinger equation. There is no collapse. Every possible outcome happens in a branching multiverse. In this framework, the proposition "There will be a sea battle tomorrow" is problematic not because it lacks a truth value, but because it is incomplete. It should be indexed to a branch: "There will be a sea battle on branch A." On the global level, the future is determined (the universal wavefunction is fixed).
  *   **Bohmian Mechanics:** This is a deterministic hidden-variable theory. It reproduces all the predictions of standard QM but posits that particles have definite trajectories determined by the past.
  *   **Superdeterminism:** A minority view, but logically possible, where even the experimenter's choice of measurement is determined by past states.

  **The Point:** Physics provides models. It does not currently provide a metaphysical verdict that rules out determinism. Therefore, you cannot use physics to *force* a rejection of bivalence. If a philosopher adopts a Many-Worlds or Bohmian view, they are consistent with physics while maintaining that future propositions have truth values.

  ### 2. The Category Error: Semantics vs. Metaphysics
  The most significant error in the reasoning is conflating **causal determination** with **truth**.

  *   **Determinism** is a causal thesis: *State A necessitates State B.*
  *   **Bivalence** is a semantic thesis: *Every declarative sentence is either true or false.*

  You can have an indeterminate world with bivalent logic. How? By decoupling truth from *present* causal grounds.

  Consider the **Ockhamist** position (named after William of Ockham). Ockhamists argue that a proposition about the future can be true *now* even if it is not *necessitated* by the present.
  *   **Proposition:** "There will be a sea battle tomorrow."
  *   **Truth Condition:** This is true now if and only if there is a sea battle tomorrow.
  *   **Causal Status:** It is not causally determined now.

  For the Ockhamist, "true" does not mean "causally locked in." It means "corresponds to reality." If reality turns out such that there is a sea battle, the statement was true. If not, it was false. The truth value is a function of the way the world *will be*, not just the way the world *is*.

  Your objection asks: *"If nothing in the present makes it the case... in what sense could the claim be true now?"*
  This assumes **Presentism** (only the present exists) and a **Present Truthmaker Principle** (truths must be grounded in present entities).
  *   If you reject Presentism and accept **Eternalism** (past, present, and future all exist in a block universe), then future facts *do* exist. The truthmaker for "There will be a sea battle" is the sea battle itself, located in the future part of the spacetime block.
  *   Even if you are a Presentist, you might reject the requirement that truthmakers must exist *now*. Some philosophers argue that future contingents are "groundless truths."

  **The Point:** Denying bivalence is not the only way to accommodate indeterminism. You can keep bivalence by adjusting your theory of time or truthmaking.

  ### 3. The Cost of Dropping Bivalence
  Philosophers do not cling to bivalence out of nostalgia for Laplace; they cling to it because classical logic is incredibly powerful, and dropping it is costly.

  If you say future contingents have no truth value (a "truth-value gap"), you violate the **Law of Excluded Middle (LEM)**: $(P \lor \neg P)$.
  *   If "Sea Battle" is neither true nor false, and "No Sea Battle" is neither true nor false, then "Either Sea Battle or No Sea Battle" is not true.
  *   This breaks standard inference rules (like proof by contradiction).

  To avoid this, many philosophers use **Supervaluationism**.
  *   Imagine the future as a branching tree of possibilities.
  *   "There will be a sea battle" is not true (it's false on some branches, true on others).
  *   "There will be a sea battle OR there will not be a sea battle" is **super-true** (it is true on all branches).
  *   This allows philosophers to keep classical logic (LEM holds) while admitting the future is open (bivalence fails for specific atomic sentences).

  So, contemporary philosophers *are* accommodating your intuition, but they are doing so with precise logical tools rather than simply abandoning bivalence across the board.

  ### 4. Contemporary Philosophy Has Not Ignored This
  Your claim that "contemporary philosophers mostly carry on using bivalent semantics... as though nothing happened" is factually incorrect regarding the specialist literature. Since Arthur Prior invented **Tense Logic** in the 1950s, there has been a massive industry dedicated exactly to this problem.

  *   **Branching Time Semantics:** Developed by Prior and Thomason, this explicitly models the future as a tree, not a line.
  *   **Relativism (John MacFarlane):** In *Assessment Sensitivity* (2014), MacFarlane argues that the truth of future contingents is relative to the context of *assessment*. "There will be a sea battle" is neither true nor false relative to today's context, but it will be true or false relative to tomorrow's context. This is a direct philosophical engagement with the intuition you are expressing.
  *   **The Open Future:** Philosophers like Elizabeth Barnes and Ross Cameron actively argue for metaphysical views where the future is ontologically indeterminate.

  The reason introductory logic texts still teach bivalence is pedagogical, not metaphysical. Just as we teach Newtonian physics before General Relativity, we teach classical logic before modal/tense logic.

  ### 5. What QM Does and Does Not Establish
  To summarize the specific impact of Quantum Mechanics on this debate:

  **What QM Establishes:**
  *   If the Copenhagen interpretation is correct, causal determinism is false.
  *   Predictions about individual quantum events are probabilistic, not certain.

  **What QM Does Not Establish:**
  *   **It does not establish Truth-Value Gaps:** Probabilities in QM are calculated using the Born Rule, which presupposes a well-defined sample space of outcomes. The mathematical formalism itself is bivalent (the particle is in state $\psi$ or it is not).
  *   **It does not rule out Eternalism:** QM is compatible with the Block Universe. In a Block Universe, the "indeterminacy" is just a feature of our epistemic access to the block, not an ontological lack of facts.
  *   **It does not force a change in Logic:** You can model QM using classical logic (e.g., quantum logic is a niche field; most physicists use classical logic to reason about quantum systems).

  ### Conclusion
  Your reasoning goes wrong in assuming that **causal openness** entails **semantic indeterminacy**.

  1.  **Physics is underdetermined:** QM does not prove the future is ontologically open (Many-Worlds/Bohm).
  2.  **Logic is distinct from Causality:** A statement can be true without being causally necessitated (Ockhamism).
  3.  **Truthmakers can be future:** If Eternalism is true, future facts exist to ground the truth of propositions.
  4.  **Philosophy is engaged:** Logicians have developed branching time and relativized semantics specifically to handle the intuition you describe without breaking classical logic.

  Aristotle's worry was primarily about **fatalism** (if it's true, it *must* happen), not just truth values. Modern philosophy largely agrees with Aristotle that the future is not *necessary*, but disagrees that we must sacrifice bivalence to save that intuition. We can say: *"It is true that there will be a sea battle, but it is not necessary that there will be a sea battle."* QM supports the lack of necessity, but it does not force the lack of truth.

  **Recommendation:** If you want to pursue the view that future contingents lack truth values based on physics, look into **Open Futurism** (e.g., works by Todd, Barnes, or Cameron) and **Quantum Bayesianism (QBism)**, which treats quantum states as subjective beliefs rather than objective facts, aligning closer to your intuition that there is no "fact of the matter" yet. But be aware: this is a specific metaphysical choice, not a forced conclusion of physics.
