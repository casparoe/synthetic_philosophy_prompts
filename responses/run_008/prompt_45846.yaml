      *   *Soft Spots:* Must identify where the argument is vulnerable (e.g., circularity, exceptions, historical contingency).

  5.  **Drafting the "Hope Nobody Asks" Question:**
      *   Needs to be the "killer question" that exposes the fundamental weakness of the burden-of-justification thesis. Usually, this involves a case where the Left defends the status quo or the Right seeks radical change (e.g., reactionary revolutionaries or conservative socialists).

  6.  **Writing - Section by Section (incorporating British English):**
