answer: |-
  **WORKSHOP Q&A PREPARATION SHEET**
  **Candidate:** [Your Name]
  **Topic:** The Burden of Justification and the Left/Right Distinction
  **Venue:** Political Theory Workshop

  ---

  ### 1. The Carl Schmitt Scholar
  **Damage Potential:** Critical. If the distinction is merely friend/enemy, your normative account is epiphenomenal.

  **The Objection:**
  "You posit a procedural disagreement about justification, but this sanitises the political. For Schmitt, the specific criteria of left and right are irrelevant; what matters is the intensity of the association and dissociation. The 'burden of justification' is merely the moralising language a group uses to mobilise against an enemy. If the Right today defends the status quo, but tomorrow seeks a reactionary revolution, your axis breaks. The distinction isn't generated by a principle of justification; it is generated by the existential demand to pick a side. You are describing the *dress* of the conflict, not the *body*."

  **The Reply (2 mins):**
  "I concede that the intensity of conflict often outstrips the normative reasoning provided. However, my claim is not that the burden of justification *prevents* conflict, but that it structures the *direction* of the argumentation even within that conflict. When Schmitt says the criteria are variable, he is correct that the *content* changes. But I am arguing that the *form* of the dispute remains stable. Even when the Right becomes revolutionary, as in fascism, it frames its revolution as a 'restoration'—a return to a prior status quo that has been usurped. Thus, they still treat the *current* deviation from tradition as the thing needing justification. Conversely, when the Left defends institutions, it frames them as 'progressive achievements' needing protection from regression. The friend/enemy distinction explains the heat, but it does not explain the vector. My thesis accounts for why the arguments flow in the direction they do, even when the temperature rises to Schmittian levels. To reduce it solely to enmity is to ignore how political actors actually speak to one another when they are not fighting."

  **Soft Spot:**
  You are relying on a reinterpretation of "status quo" (e.g., a mythical past) that may stretch the definition until it is unfalsifiable. If the Right claims a future utopia, your axis blurs.

  ---

  ### 2. The Political Realists (Joint Intervention)
  **Damage Potential:** High. They deny the autonomy of ideology entirely.

  **The Objection:**
  "This is classic political moralism. You treat 'justification' as a driver, when it is a residue. Politics is about power, order, and the management of conflict. Actors adopt 'left' or 'right' postures strategically to build coalitions or delegitimise opponents. The burden of justification shifts wherever it is tactically useful. A socialist will defend the status quo of a nationalised industry; a libertarian will demand radical upheaval of the regulatory state. Your 'underlying disagreement' is just a post-hoc rationalisation for interest aggregation. You are reifying a heuristic into a metaphysical truth."

  **The Reply (2 mins):**
  "I agree that justifications are often deployed strategically. Realism rightly warns us against taking ideology at face value. However, strategy is not unconstrained. Actors cannot simply pick any justification and expect it to stick; they must speak a language their audience recognises as legitimate. My thesis identifies the grammar of that language. Even when a socialist defends a status quo institution, they justify it *as* a protection of equality against market encroachment—appealing to the Left's default burden. When a conservative demands radical change, they frame it as *removing* an imposition on liberty or tradition. The 'burden' acts as a constraint on strategic behaviour. If my account were merely moralistic, it would not predict the specific *shape* of the rationalisations offered. Interests determine the goal, but the left/right distinction determines the argumentative path one must take to get there. To call it a mere residue is to ignore the constitutive role of normative language in politics."

  **Soft Spot:**
  You assume the "grammar" constrains action significantly. Realists will argue actors simply change the grammar if the audience changes, making your "default assignment" contingent on culture, not structure.

  ---

  ### 3. The Quantitative Political Scientists
  **Damage Potential:** Medium-High. They deny the universality required for your thesis.

  **The Objection:**
  "From a measurement perspective, your 'essence' is a category error. In our work, 'left' and 'right' are latent traits inferred from roll-call votes or survey items, and the dimensionality varies by country and time. In the US, religion loads on the right; in Europe, it's mixed. In some contexts, the dimension splits into economic and social axes. If the construct is country-specific and time-bound, positing a transhistorical 'burden of justification' is methodologically unsound. You are essentialising a variable that is operationally defined by context."

  **The Reply (2 mins):**
  "I appreciate the rigour of your operationalisation. However, measurement variance does not necessarily disprove conceptual unity. The fact that 'religion' loads differently in the US versus Sweden does not mean the underlying conflict is different; it means the *site* of the status quo contestation has shifted. In the US, the religious settlement is part of the status quo the Right defends; in Sweden, it is less central. My thesis operates at a higher level of abstraction than survey items. I am not claiming the *issues* are identical, but that the *logic of disputation* regarding those issues follows the same pattern. If you treat left/right only as a statistical artefact, you lose the ability to explain why these clusters cohere across different contexts in the first place. There must be a familial resemblance, and I am proposing the burden of justification is the genetic thread."

  **Soft Spot:**
  If they press you on *falsification*, you are in trouble. If every variance can be explained away as a "shift in the site of contestation," the theory risks becoming tautological.

  ---

  ### 4. The Historian
  **Damage Potential:** Low-Medium. Genealogical nitpicking.

  **The Objection:**
  "Your origin story is anachronistic. The seating in the Estates-General of 1789 was not about a philosophical burden of justification. It was about voting procedure: head vs. order. The 'Left' sat there by chance and convenience. Furthermore, throughout the 19th century, the terms were fluid. Many who we would call 'right' today were radicals then. To project your normative axis back onto the revolutionary seating is to tidy up a mess that wasn't tidy."

  **The Reply (2 mins):**
  "I do not intend my thesis as a strict history of the terms 'left' and 'right'. I am offering a conceptual reconstruction, not a genealogy. I acknowledge the contingency of the seating arrangements. However, the fact that the distinction *survived* the specific procedural dispute of 1789 suggests it latched onto something more durable than voting methods. The terms persisted because they captured a recurring structural feature of modern political argument, even if the original actors did not articulate it in my terms. We do not dismiss the concept of 'democracy' because the Athenians excluded women; similarly, we can identify the logic of the left/right distinction even if the revolutionaries were not fully conscious of it. History shows the variance; theory explains the persistence."

  **Soft Spot:**
  If the Historian produces a specific counter-example from 1795 where a "Leftist" demanded a return to monarchy for egalitarian reasons, your "downstream" claim wobbles.

  ---

  ### The Question I Hope Nobody Asks

  **"If the burden of justification is the defining feature, how do you classify the 'Reactionary Modernist' or the 'Revolutionary Conservative' who seeks to overthrow the status quo not to restore the past, but to accelerate into a new hierarchy? Do they not break your axis by placing the burden of justification on the status quo (like the Left) while pursuing ends that are distinctly Right?"**

  *(Note: This exposes the risk that 'status quo' is too malleable a term. If the Right can define the 'true' status quo as a metaphysical ideal not yet realised, they co-opt the Left's burden of proof.)*
