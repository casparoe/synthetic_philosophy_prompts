      *   **Tone/Style:** British English, academic but defensive/prepared, exacting audience.

  2.  **Determine Ranking of Damage:**
      *   *High Damage:* The Schmittian and the Realists. They attack the *possibility* of the thesis (conceptual coherence vs. power dynamics). If the distinction is just friend/enemy or interest masking, the "burden of justification" thesis is epiphenomenal.
      *   *Medium Damage:* The Historian and the Quant Scholars. They attack the *empirical validity* and *universality*. The Historian says "your origin story is wrong." The Quant Scholars say "your essentialism is methodologically unsound."
      *   *Ranking:*
          1.  Carl Schmitt Scholar (Conceptual dissolution).
          2.  Political Realists (Functional dissolution).
          3.  Quantitative Political Scientists (Methodological dissolution).
          4.  Historian (Empirical/Genealogical nitpicking).
      *   *Refinement:* Actually, the Realists might be more damaging than Schmitt because they deny the normative dimension entirely, whereas Schmitt admits the intensity but denies the content. However, Schmitt's "friend/enemy" is a very specific, heavy-hitting theoretical critique in political theory circles. Let's place Schmitt first as the most theoretically existential threat, Realists second as the most sociologically existential threat. The Quant scholars are dangerous because they deny the *object* of study exists as a universal. Let's put them third. Historian fourth (easiest to parry as "genealogy vs. concept").

  3.  **Drafting the Objections (Voice & Tone):**
      *   *Schmittian:* Needs to sound sharp, focused on intensity, conflict, and the impossibility of rational consensus on principles. "Political theology," "existential."
      *   *Realists:* Needs to sound pragmatic, cynical about "principles," focused on power, order, and legitimacy as post-hoc rationalisations. "Moralism," "political realism."
      *   *Quant Scholars:* Needs to sound methodological, focused on operationalisation, cross-national variance, and measurement error. "Latent traits," "item response theory," "context-dependent."
      *   *Historian:* Needs to sound specific, archival, focused on contingency and the messy reality of 1789. "Anachronism," "sitting arrangements," "Girondins vs. Montagnards."

  4.  **Drafting the Replies (Strategy & Content):**
      *   *Constraint:* Two minutes each (approx. 250-300 words spoken at normal pace).
