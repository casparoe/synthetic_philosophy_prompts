          *   *Why Case 3 is the key:* Case 1 aligns Autonomy and Utility. Case 2 aligns Contract and Utility. Case 3 pits **Respect for Instruction (Autonomy)** against **Prevention of Harm (Utility)**. Her verdict here reveals which weight is heavier in her particularist scale.

