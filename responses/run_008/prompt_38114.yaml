          *   *Why it distinguishes:* If she says it's **Wrong**, she is a consistent Autonomist/Particularist regarding instructions (matching the Doctor case). If she says it's **Not Wrong**, she is a Soft Paternalist/Utilitarian regarding health (matching the Killer case's harm prevention).
