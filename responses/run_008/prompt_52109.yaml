answer: |-
  Here is a prep sheet for next week's interview. I've structured these to bypass the "SR 101" summary phase and go straight to the ontological pressure points. Given your audience's feedback on the "determinate vs. real" distinction, I've woven that thread through several questions, not just the one dedicated to it.

  The guest's position is standard Putnamian line: *Relativity of Simultaneity + Transitivity of "Real" = Block Universe.* The vulnerabilities are almost always in the metaphysical premises disguised as physical necessities. These questions are designed to force him to admit where the physics ends and the metaphysics begins.

  ### Interview Prep: The Block Universe & Rietdijk–Putnam

  **Q1: The Transitivity of "Real For" (The Stein Objection)**
  "The Rietdijk–Putnam argument hinges on chaining reality across observers. If event $E$ is real for Observer A, and Observer A is real for Observer B, then $E$ must be real for Observer B. This requires the relation 'is real for' to be transitive. But Howard Stein famously argued that transitivity isn't a constraint physics imposes on ontology. If I deny transitivity, I can maintain that $E$ is real-for-A but indeterminate-for-B without contradiction. When you insist on transitivity, aren't you importing a metaphysical principle of 'absolute existence' that Special Relativity itself doesn't mandate?"

  *   **Likely Defense:** He will argue that without transitivity, 'reality' loses its objective meaning and becomes solipsistic or incoherent.
  *   **Follow-up:** "If transitivity is a conceptual requirement for objectivity, doesn't that mean your conclusion—that the future exists—is driven by your definition of 'objectivity' rather than the geometry of spacetime? In other words, are you deriving ontology from physics, or constraining physics to fit a pre-existing ontological schema?"

  **Q2: The Andromeda Paradox (Ontological Volatility)**
  "Let's look at the Andromeda variant. Two people stroll past each other on a street corner with slightly different velocities. For one, an Andromedan fleet has already launched; for the other, the decision hasn't been made yet. The ontological status of a massive interstellar event flips based on a trivial change in a pedestrian's velocity vector. Do you view this 'ontological volatility' as a feature of the world, or does the disproportion between the physical cause (walking speed) and the ontological effect (existence of a fleet) suggest we should treat 'determinateness' as a representational artifact rather than a mind-independent fact?"

  *   **Likely Defense:** He will bite the bullet: "Yes, it is counterintuitive, but that's what the math says. Our intuitions about 'now' are the problem."
  *   **Follow-up:** "If existence is that sensitive to frame choice, does it retain enough robustness to ground truth? If I can alter what 'exists' light-years away by turning my head, have we preserved the objectivity of the block, or have we rendered 'existence' so frame-dependent that it no longer does the metaphysical work presentists worry about?"

  **Q3: Fragmentation vs. Absolute Existence**
  "You argue that because simultaneity is relative, but reality must be absolute, we must accept the block. But why stop the relativization at simultaneity? Why not allow existence itself to fragment? We could say $E$ exists-in-frame-F, just as we say $E$ is-simultaneous-in-frame-F. What independent reason do we have to demand a 'view from nowhere' on existence, other than a lingering preference for Newtonian absolute time disguised as four-dimensionalism?"

  *   **Likely Defense:** He will claim that "existence" is not a relation, and relativizing it leads to contradiction (e.g., $E$ exists and does not exist).
  *   **Follow-up:** "But if 'exists' is implicitly 'exists-relative-to-a-hypersurface,' there's no contradiction, just as there's no contradiction in saying 'it is raining' and 'it is not raining' at different locations. If you reject this, are you not implicitly positing a privileged foliation that you claim to reject?"

  **Q4: Determinateness vs. Causal Determinism**
  "There is a recurring conflation in this debate between the block being *fixed* and the block being *causally determined*. I can have a block universe where the future slice contains genuinely chancy events—fixed in the geometry, but not necessitated by the past. Does your defense of the block require a separate argument against objective chance, or are you claiming that the geometric fixedness of the future *just is* what we mean by determinism? If the latter, aren't you changing the subject on what determinism means?"

  *   **Likely Defense:** He will likely distinguish them: "The block is compatible with indeterminism; the probabilities are just part of the block's structure."
  *   **Follow-up:** "If the probabilities are 'just part of the structure,' then the future is determinate but not determined. If so, what work is the Block doing against the presentist? If the future is fixed but chancy, does it still possess the ontological weight you claim, or is it just a 'determinate possibility'?"

  **Q5: The Gap Between "Determinate" and "Real" (Listener Request)**
  "Your listeners from the last episode flagged a specific distinction: The RP argument shows that future events have *determinate coordinates* in a manifold. It does not obviously show that those events possess the same *ontological status* as present events. A map contains the future route, but the route doesn't exist yet. How do you bridge the gap between 'mathematically determinate in the model' and 'ontologically real'? At what point does the representation become the territory?"

  *   **Likely Defense:** He will argue that in physics, the model *is* the territory. If the physics treats $t_1$ and $t_2$ symmetrically, ontology must too.
  *   **Follow-up:** "But physics also treats spatial coordinates symmetrically, yet we don't say 'here' is as real as 'there' in the same way—we acknowledge indexicality. Why is temporal indexicality ('now') an illusion to be explained away, while spatial indexicality ('here') is accepted as a perspectival fact? Why can't 'now' be a perspectival fact about the block, rather than proof that the whole block exists *simpliciter*?"

  **Q6: The "Observed is Real" Principle**
  "You've mentioned the principle that 'what is observed is real.' In Special Relativity, we strictly observe only events on our past light cone. The RP argument, however, uses spacelike separated events to establish the block. How do you move from 'observable in principle via light signals' to 'real now via simultaneity slices' without already assuming the spacetime structure you're trying to prove? Isn't there a risk of circularity: assuming the block to prove the reality of the unobserved?"

  *   **Likely Defense:** He will say we infer the reality of spacelike events based on the invariance of physical laws and the ability to send signals.
  *   **Follow-up:** "But that inference relies on the assumption that the laws hold across the slice. If a presentist argues that laws only propagate from the 'moving now,' your inference fails. Doesn't your argument presuppose that the future is already there to receive the signal, which is the very point in dispute?"

  **Q7: Conventionality of Simultaneity (Reichenbach)**
  "The RP argument relies on standard Einstein synchrony ($\epsilon = 1/2$). But if simultaneity is conventional, as Reichenbach argued, then the 'tilting planes' you rely on are partly stipulative. If I choose a non-standard synchrony, the slice through your future changes. Can a metaphysical conclusion about what *exists* rest on a coordinative definition that is, strictly speaking, a matter of convention?"

  *   **Likely Defense:** He will likely dismiss conventionality as irrelevant to the causal structure or Minkowski geometry, which is invariant.
  *   **Follow-up:** "But the *foliation* into 'past,' 'present,' and 'future' for the RP argument depends on that synchrony. If the geometry is invariant but the slicing is not, and your argument depends on the slicing, haven't you grounded existence in the convention? Or are you claiming the Minkowski metric itself dictates existence without slicing?"

  **Q8: The "Newtonian Leftover" Charge**
  "You characterize presentism as clinging to a 'Newtonian leftover.' But one could argue the Block Universe is the true Newtonian view: absolute time replaced by absolute spacetime, where everything is fixed from the 'view of God.' Isn't the *dynamic* view of time actually more faithful to the relativistic destruction of absolute simultaneity, because it accepts that there is no global 'state of the universe' at all? Why is freezing the dynamics into a block less 'Newtonian' than a moving present that respects the lack of global simultaneity?"

  *   **Likely Defense:** He will argue that Newtonian time required absolute simultaneity, which SR kills, so Presentism dies with it.
  *   **Follow-up:** "But 'point-presentism' or 'fragmented presentism' doesn't require global simultaneity. It only requires local becoming. If you reject those, is it because they are physically impossible, or because they fail to satisfy a metaphysical desire for a unified 'world'? If it's the latter, isn't the Block the view that's actually prioritizing metaphysical unity over physical locality?"

  ### Producer's Note on Flow
  *   **Start with Q1 (Transitivity).** It sets the logical stage immediately. If he can't defend transitivity, the rest of the argument crumbles.
  *   **Middle with Q2 & Q5 (Andromeda & Real/Determinate).** This is where the audience engagement will be highest. It connects the math to the "weirdness" and the specific listener feedback.
  *   **End with Q8 (Newtonian Charge).** It turns the table on his rhetorical framing of the debate, leaving him defending his own metaphysical commitments rather than attacking presentism.

  **Watch out for:** If he tries to define "real" as "exists in the manifold" (Q5), press him on why that definition should compel us to change our metaphysical view of time rather than just being a linguistic stipulation. That's where the philosophy lives.
