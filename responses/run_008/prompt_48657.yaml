  1.  **Analyze the User and Request:**
      *   **User Profile:** Retired physiologist (40 years experience), specialized in insect motor control. Deeply familiar with ethology and control theory terminology (FAPs, releasing stimuli, CPGs, efference copy, setpoints, open/closed-loop, habituation, hierarchical control).
      *   **Current Interest:** Philosophy (specifically free will, determinism, Dennett's "sphexishness").
