answer: |-
  # The Solvent of Skepticism: Why the Ordinalist Objection Dissolves the Self

  The classic ordinalist objection to interpersonal utility comparisons (IUCs) is a cornerstone of modern welfare economics. Stemming from the work of Lionel Robbins and entrenched by the formalism of revealed preference theory, it holds that utility is not a measurable substance but a ranking. An individual's utility function is identified only up to a positive monotonic transformation (or, under von Neumann-Morgenstern expected utility assumptions, a positive affine transformation). Because the zero-point and the unit of measurement are arbitrary for each individual, the statement "Person A gains more utility from a dollar than Person B" is not merely difficult to verify; it is cognitively meaningless. There is no fact of the matter to be had.

  This argument is often presented as a surgical restriction: it forbids comparisons *between* persons while leaving comparisons *within* a person across time intact. This essay argues that this restriction is unstable. The ordinalist logic is a solvent that, applied consistently, dissolves the very concept of a temporally extended self. If the arbitrariness of the utility scale renders interpersonal comparisons meaningless, it must likewise render intrapersonal comparisons meaningless, collapsing the ordinalist position into a general skepticism about utility comparisons. The defense of the boundary between "inter" and "intra" relies on metaphysical and epistemic distinctions that cannot bear the weight placed upon them.

  ### I. The Epistemic Mirror: The Self as Another

  The first line of defense for the ordinalist is usually epistemic. They concede that IUCs are meaningless because we lack access to another's mind, but insist that intrapersonal comparisons are "given from the inside." I know directly that I prefer coffee today to tea yesterday. However, this appeal to privileged access does not survive scrutiny when we consider the temporal dimension.

  When I compare my utility today to my utility last year, I am not accessing a timeless, enduring self. I am a temporal stage accessing a past temporal stage. How do I accomplish this? I rely on memory. But memory is not a direct pipeline to past qualia; it is a reconstructive process, fallible and subject to the same biases as third-party observation. I infer my past utility from my current recollection of satisfaction, from diaries I kept (behavioral data), or from physiological markers like weight change or health records.

  If the ordinalist objection rests on the idea that utility is defined by *current* preferences over lotteries, then my current self can only rank my current preferences. To compare my current utility to my past utility, I must treat my past self as an entity distinct from my present self, observed through the foggy lens of memory. If the unit of utility is arbitrary because it is anchored in a specific preference structure, and if my preference structure drifts over time (as tastes mature or decay), then the "util" of 2023 is no more commensurable with the "util" of 2013 than my util is with yours. To claim otherwise is to assume a stability of the measuring stick that the ordinalist explicitly denies exists between different people. If the objection is that we cannot step outside our own preference ordering to calibrate scales, we cannot step outside our *current* preference ordering to calibrate against our *past* one.

  ### II. The Metaphysical Spectrum: Identity as a Matter of Degree

  Perhaps the ordinalist retreats from epistemology to metaphysics. They might argue that intrapersonal comparisons are meaningful not because of access, but because of *identity*. There is one physical and psychological system underlying the comparisons, whereas interpersonal comparisons involve distinct systems.

  This move collapses under the weight of reductionism. If what licenses utility comparisons is the continuity of a single underlying system, we must ask: what constitutes that system? As Derek Parfit demonstrated, personal identity is not a binary fact but a matter of degree, constituted by psychological connectedness and continuity. There are genuine intermediate cases that blur the line between "same person" and "different person."

  Consider gradual neural replacement: if my neurons are replaced one by one with functionally identical synthetic units, at what point does the utility scale reset? Consider split-brain patients, where the corpus callosum is severed, resulting in two distinct centers of consciousness and preference within one skull. Are utility comparisons between the left hemisphere and the right hemisphere "intrapersonal" (meaningful) or "interpersonal" (meaningless)? Consider conjoined twins with shared circulatory systems and affective states, or the hypothetical case of fission, where one person splits into two psychologically continuous successors.

  In these cases, the physical and psychological continuity is a gradient. If the meaningfulness of utility comparisons tracks personal identity, then meaningfulness must also be a matter of degree. But the ordinalist objection is binary: it declares IUCs *meaningless*, not *less meaningful*. By drawing a sharp line at the skin or the skull, the ordinalist relies on a folk-psychological notion of the self that their own formalism should reject. If there is no sharp metaphysical boundary where the "self" ends and the "other" begins, there can be no sharp boundary where utility comparisons switch from meaningful to meaningless. To insist on such a boundary is to privilege biological accident over the psychological continuity that actually matters for welfare.

  ### III. The Theorist's Dilemma: Pragmatic Inconsistency

  The most damning evidence against the ordinalist restriction is the practice of the economists and welfare theorists who espouse it. In theoretical pronouncements, they declare IUCs meaningless. Yet, in their models, they routinely make intrapersonal comparisons across time that rely on the exact same mathematical machinery they forbid in the interpersonal case.

  Consider lifecycle models of saving, models of addiction, or cost-benefit analyses of long-term policy. To model a rational agent saving for retirement, one must compare the marginal utility of consumption today against the marginal utility of consumption in thirty years. This requires a discount rate and a stable utility function that allows units of utility at $t_1$ to be traded off against units at $t_2$. If the utility function is only identified up to a monotonic transformation, and if that transformation can vary over time as the agent's risk profile or tastes change, then the optimization problem is ill-defined.

  The theorist faces a dilemma. First, they can concede that the boundary between intra- and interpersonal comparisons is a convention doing no real metaphysical work. They assume a "stable self" for modeling convenience, just as they could assume "commensurable selves" for social welfare functions. But if it is a convention, the objection loses its force: it becomes a pragmatic choice, not a logical impossibility. Second, they can insist the objection is logically strict. But then they must admit that their own lifecycle models are nonsense—that talking about an individual maximizing utility over time is as meaningless as talking about a society maximizing social welfare. Since almost no economist is willing to abandon intertemporal choice theory, they are implicitly accepting that utility scales can be anchored and compared, provided one stipulates a continuity that is, in principle, no different from the continuity stipulated between citizens in a welfare function.

  ### IV. The Vulnerability: The Shared Preference System

  Where, then, is this argument most vulnerable? The defender of the ordinalist objection has one robust line of retreat. They can argue that the analogy between intrapersonal and interpersonal comparisons breaks down because of *causal integration*.

  The reply runs as follows: Intrapersonal comparisons are licensed not by metaphysical identity or epistemic access, but by the existence of a shared underlying preference system that actively arbitrates trade-offs. Within a single brain, there are neural mechanisms that weigh present pleasure against future pain. The brain itself acts as a "common currency" converter. When I choose between studying now or partying now, my neural architecture forces a comparison; the choice reveals that the scales *are* commensurable because the system *makes* them commensurable through action.

  In contrast, there is no super-brain that arbitrates trade-offs between me and you. There is no mechanism that forces a unit of my utility to be exchanged for a unit of yours except by normative stipulation. Therefore, intrapersonal comparisons are empirical facts about a causal system's operation, while interpersonal comparisons are normative impositions on distinct causal systems.

  This is a powerful distinction. It grounds the meaningfulness of comparison in the physical reality of decision-making architecture rather than in vague metaphysics. If utility is defined by choice, and a single organism makes choices that trade off temporal states, then those states are comparable by definition.

  However, even this defense is porous. First, it relies on the organism as the unit of integration, but as noted with split-brain cases, the "organism" does not always align with the "decision-making system." Second, and more critically, it concedes that utility comparisons are possible whenever a mechanism exists to trade them off. This opens the door to interpersonal comparisons via social mechanisms. If a society votes, or bargains, or redistributes resources, it is effectively creating a mechanism that trades off one person's utility against another's. If the existence of a trade-off mechanism licenses the comparison, then democratic or market processes could be seen as creating the very "common currency" the ordinalist claims is missing.

  ### Conclusion

  The classic ordinalist objection attempts to draw a cordon sanitaire around the individual, protecting the sanctity of personal preference while banning social aggregation. But the logic of the objection is too potent. By rendering utility scales arbitrary and inaccessible, it threatens to fragment the individual into a sequence of disconnected temporal slices, rendering lifecycle planning as meaningless as social planning. The economist who denies interpersonal utility while modeling intertemporal utility is standing on ground that their own arguments have undermined.

  While the defender may find foothold in the causal integration of the individual brain, this merely shifts the debate from metaphysics to mechanism. And if mechanisms of trade-off can license comparisons within a skull, it is hard to see why mechanisms of trade-off between skulls—markets, votes, laws—cannot do the same. The ordinalist objection, pushed to its limit, does not save us from the difficulty of comparing utilities; it merely forces us to admit that all such comparisons, even those we make with ourselves, are acts of construction rather than discoveries of pre-existing facts.
