      *   **1. The Cartesian Boundary:**
          *   *Theory:* Agent $\neq$ Environment.
          *   *User's View:* API call $\to$ Response.
          *   *Embedded View:* The prompt *is* part of the environment. If the agent writes to a log that gets read back as context, it's modifying its own input stream. It's not just acting *on* the world; it's acting *on itself* via the world.
