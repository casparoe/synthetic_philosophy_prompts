      *   *Embedded Agent:* Agent is *in* the world. It's made of atoms (or tokens/compute). The world can affect the agent's code/memory directly. The agent can't simulate the whole world because it *is* part of the world.
      *   *LLM Context:* The "agent" is a prompt + model weights + context window. The "environment" is the API, the sandbox, the user, the internet.
      *   *The Friction:* LLM engineers treat the context window as a state tracker. Safety people treat it as a vulnerable cognitive substrate.

  3.  **Drafting the Sections (Iterative Process):**

