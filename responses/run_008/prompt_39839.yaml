      *   **LLM & Conclusion (5 mins):** The LLM question, wrap up.

  5.  **Drafting the Content (Iterative refinement for tone and constraints):**
      *   *Tone:* Professional, peer-to-peer, engineering-focused. Avoid jargon where possible, or translate it.
