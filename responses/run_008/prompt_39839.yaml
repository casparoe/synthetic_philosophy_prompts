      *   Why use it? To explain agency and identity without positing a "ghost in the machine" (homunculus).
      *   The Physics Analogy: Center of gravity (CoG) is a useful point for calculation, but you can't cut open an object and find the CoG. Similarly, you can't cut open a brain and find the Self.
      *   The Risk: Engineers might think CoG implies a specific *location* in the brain (like a register or a memory address). Dennett means it's a *theoretical construct*, not a spatial point.

  3.  **Address the User's Specific Concerns:**

      *   **Concern 1: The CoG Analogy (Location vs. Abstraction).**
          *   *Is the worry right?* Yes. Engineers think in terms of memory addresses, pointers, physical hardware. "Center" sounds like a coordinate.
          *   *Where to break the analogy?* Early. Establish that CoG in physics isn't a particle. It's a mathematical point derived from mass distribution. Then map that to the Self: it's a point derived from narrative distribution. It exists in the *story space*, not physical space.
          *   *Precondition:* Need to establish "Real Patterns" or "Instrumentalism" briefly. The self is *real enough* to do work, just not *fundamentally real* like an atom.

      *   **Concern 2: Misconceptions (Nihilism & Free Will).**
          *   *Misconception A: "No self = Nothing matters."* (Nihilism).
          *   *Misconception B: "No self = No free will."* (Determinism/Hard Incompatibilism).
          *   *Where to head them off?* Don't wait until Q&A. Pre-empt them when introducing the concept.
