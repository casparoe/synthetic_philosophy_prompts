prompt: |-
  I'm a backend engineer with no philosophy background whatsoever, but I've been reading Dennett on the side and got talked into giving a thirty-minute talk at our team's Friday random-topics session on his line that the self is basically a center of gravity, only a narrative one -- a convenient abstraction the brain's storytelling computes, not a little person in there. Audience is about twenty engineers, sharp, zero philosophy. Don't write the talk for me, plan it: what has to be in place before the claim even sounds like a claim rather than poetry (I suspect the center-of-gravity analogy from physics does a lot of load-bearing but I worry it makes people think he's saying the self is a *location* in the brain -- is that worry right, and if so where do I break the analogy), the misconceptions they'll walk out with if I do nothing -- my bets are so-there's-no-self-ergo-nothing-matters, and this-proves-free-will-is-fake -- and exactly where in the sequence I head each off. Also, should I bring up whether an LLM that talks about itself has one of these narrative centers? It feels like the one example my crowd would actually chew on, but I can't tell if it's a great hook or a can of worms I can't re-close in the time I've got. And tell me what to openly refuse to cover. Please answer in American English, I keep defaulting to British spellings for some reason and it bugs me.
reasoning: |-
  Thinking Process:

