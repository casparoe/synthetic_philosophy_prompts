          *   *Verdict:* Use it as a closing thought or a limited analogy, not the core. It's a great hook but dangerous. Better to use it as a "stress test" for the theory at the end.
          *   *Decision:* Include it, but bound it strictly.

      *   **Concern 4: What to Refuse to Cover.**
          *   Qualia (the "hard problem").
          *   Deep metaphysics of existence.
          *   Specific neural correlates (unless relevant to the narrative).
          *   Other philosophers (Kant, Hume, etc.) - keep it Dennett-focused to avoid scope creep.

  4.  **Structure the Plan (30 Minutes):**
      *   **Intro (5 mins):** Hook, the Homunculus problem, the CoG analogy (with immediate caveats).
