      *   *Specific Advice on CoG:* Emphasize that CoG is a *calculational tool*, not a *thing*. Break the analogy where physics implies spatial locality.
      *   *Specific Advice on LLMs:* Frame it as "Does it generate a narrative center?" not "Is it conscious?"

  6.  **Refining the "What to Refuse" Section:**
