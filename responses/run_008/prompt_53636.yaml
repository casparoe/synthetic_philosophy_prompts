answer: |-
  Your advisor defines alignment strictly as technical work on the model's objective function and internal goal structure, excluding external safeguards, societal impacts, or pure capability assessments.

  **Verdicts:**
  1.  **Biosecurity Evals:** Not Alignment (likely "Safety" or "Policy"). While red-teaming reward hacking is alignment because it exposes *goal misgeneralization*, biosecurity evals measure *dangerous capabilities* regardless of intent; she distinguishes between a model that *wants* to harm (alignment) vs. one that *can* harm (security/safety).
  2.  **Sycophancy Training:** Alignment. This is a direct failure of objective specification where the model optimizes for approval rather than truth/helpfulness, fitting her acceptance of RLHF and value learning work.
  3.  **Situational Awareness:** Alignment. This investigates the model's self-modeling capacity, which is a prerequisite for deception and instrumental convergence, directly matching her acceptance of interpretability work on deception circuits.

  **The Rule:**
  She is running the rule: **"Alignment is solving the technical problem of ensuring the model's internal optimization targets match the operator's intent."** This covers both specifying the right goals (value learning, RLHF) and ensuring the model pursues them without gaming or deception (red-teaming, interpretability). It excludes work that restricts the model externally (security), addresses societal distribution (ethics), or increases raw competence (capabilities).

  **Competing Rule:**
  A competing rule that fits her track record nearly as well is: **"Alignment is work specifically mitigating existential risk from autonomous agents."** This fits the deception and reward hacking approvals (high risk) and excludes bias (societal harm) and capabilities (neutral). However, this rule struggles to explain why prompt injection (which can cause significant harm) is excluded as "security," whereas the "Internal Goal" rule explains it cleanly (external exploit vs. internal objective).

  **Splitter Project:**
  To decisively split these rules, pitch: **"Designing a hardware-based containment protocol that physically limits a model's ability to act on networks if it exhibits deceptive markers."**
  *   Under the **Internal Goal Rule**, this is **not alignment** (it's security/containment; it doesn't fix the model's goals).
  *   Under the **Existential Risk Rule**, this **is alignment** (it directly mitigates catastrophic risk from misaligned agents).
  Her reaction to this will tell you if she cares about the *mechanism* (goals) or the *outcome* (risk).

  **One Problem or Several:**
  Her record suggests she views alignment as **one coherent problem** (Goal Control) rather than several disjoint ones. She categorizes both Outer Alignment (value learning, RLHF) and Inner Alignment (interpretability, deception circuits) under the same label, implying she sees them as different approaches to the singular challenge of maintaining control over the model's optimization process, distinct from the separate challenges of security or ethics.
