  I'm taking a course on moral change and we just did Appiah's The Honor Code, with some Bernard Williams on honor thrown in. My friend in the class (economics double major, very smug about it) and I are stuck on what actually killed the duel in England. My credence that the honor story explains more of dueling's collapse than the interest story is around 0.55; hers is basically 0.2, she thinks dueling died because the state's monopoly on violence finally got backed by real costs for elites, honor-talk was just decoration. Give me your own number, but more importantly decompose it. The proposition, precisely: the shift in what counted as honorable among the English elite did more causal work in ending dueling by the 1850s than either (a) rising material/legal costs of dueling or (b) moral argument against it. The thing that keeps nagging me is timing — dueling had been condemned and nominally illegal for centuries and went right on, then collapsed fast once it started marking you as an aristocratic throwback rather than a gentleman. But maybe my friend can explain the timing too and I just can't see how.

