          *   *Misrepresentation:* Rosenthal famously allows for "targetless HOTs" (I am in pain, but there is no pain state). This creates the "problem of the rock" or the issue of how a thought can be conscious without an object.
          *   *Severity:* High. It forces the counterintuitive conclusion that one can be in a conscious state without there being a mental state one is conscious of. It struggles to explain the *phenomenology* of the missing target.

      *   **Carruthers's Dispositionalist HOT Theory:**
