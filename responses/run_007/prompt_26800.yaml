      *   **Lycan's HOP Theory:**
          *   *Core:* Internal scanning mechanism (like perception).
          *   *Misrepresentation:* Like visual perception, internal scanning can hallucinate or err.
          *   *Severity:* Moderate. Because it models consciousness on *perception*, it inherits perception's natural capacity for error/hallucination. It is arguably better equipped to handle misrepresentation than thought-based theories because perceptual error is a well-understood phenomenon.

      *   **Gennaro's Wide Intrinsicality View (WIV):**
          *   *Core:* The conscious state is a complex state including both the first-order and higher-order content intrinsically.
          *   *Misrepresentation:* Since the HO and FO are parts of one complex state, if the HO part misrepresents the FO part, the unity of the state is threatened.
