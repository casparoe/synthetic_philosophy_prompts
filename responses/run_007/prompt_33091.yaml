prompt: |-
  Okay so I cover the AI ethics beat for a magazine you'd know, and I somehow got roped into giving a talk at this interdisciplinary thing — it's run by a philosophy department but half the registrations are from the CS and machine learning side. My thesis, roughly, is that the whole project of trying to hardcode a single ethical framework into an autonomous system (pick your poison: utilitarianism, Kantian deontology, whatever) is a category mistake. The right move is to build systems that can reason under moral uncertainty — they maintain multiple ethical perspectives and look for actions that are robust across them, or at least avoid actions that are egregiously wrong by the lights of any one framework when there's no clean consensus.

  I think the argument itself is solid, but the Q&A is going to be a bloodbath if I'm not ready. The audience breaks down like this: you've got the philosophers, some of whom are going to think I'm just dressing up Ross-style prima facie duties or moral particularism in a tech bro outfit. Then you've got the ML engineers who are going to say "cool story, what's the objective function?" — they want to see the math. And there's a small but loud group of EAs in the back who think the answer is obviously to just implement preference utilitarianism and stop overthinking it.

  I need a Q&A prep sheet. Give me the eight or so objections I'm most likely to face, ordered by how badly they'd throw me off if I'm not ready for them, phrased the way each group would actually ask them. For each one, a two-minute reply and a note on where the reply is soft. And tell me the one question I'm praying nobody thinks to ask.
