answer: |-
  The standard pedagogical reception of Bernard Williams's critique of utilitarianism often reduces his "integrity objection" to a complaint about demandingness. On this reading, Williams is taken to argue that utilitarianism is flawed because it requires agents to sacrifice too much of their personal interests for the greater good. It is portrayed as a theory that is too strenuous, too self-effacing, and ultimately too difficult for human beings to sustain. This interpretation, however, fundamentally misconstrues the philosophical force of Williams's argument. The integrity objection is not a grievance about the *quantity* of sacrifice utilitarianism demands, but rather a structural critique of the *quality* of justification it requires. Williams's central claim is that the utilitarian model of impartial justification misrepresents the nature of practical reason by alienating agents from the "ground projects" that constitute their identities. Even when the utilitarian verdict aligns with an agent's inclinations, the route by which she is supposed to arrive at that verdict distorts her relationship to her own life. To defend this reading, particularly against the charge that Williams offers merely a critique of moral psychology rather than a normative argument, we must recognize that integrity is not merely a feeling to be preserved, but a condition of coherent agency.

  To understand why the demandingness reading is a misreading, one must distinguish between the burden of an action and the source of its justification. A demandingness objection posits that a moral theory is false or flawed because it requires agents to give up things they have a right to keep (e.g., wealth, time, relationships). Williams's objection is more radical. He argues that utilitarianism attacks the very possibility of having projects that are *one's own*. For Williams, "ground projects" are not merely preferences to be weighed in a hedonic calculus; they are the commitments that give an agent a reason to exist and act at all. They constitute the self.

  The utilitarian requirement is that all such projects must be viewed from an impartial, neutral standpoint. They have no intrinsic weight; they matter only insofar as they contribute to general utility. Williams argues that to require an agent to view their constitutive commitments from this external standpoint is to demand a form of self-alienation. The agent is asked to step outside their own skin to validate the very skin they inhabit. This is not a problem of "too much sacrifice." One can imagine a scenario where the utilitarian calculation is effortless and aligns perfectly with the agent's desires. Even in this case, if the agent is required to validate their desire through the impartial calculus rather than through the commitment itself, their integrity is violated. The objection is not that utilitarianism asks the agent to give up too much, but that it asks the agent to disown the perspective from which they act.

  This distinction is crystallized in Williams's famous "one thought too many" case. Williams asks us to imagine a man who can save either his wife or a stranger from drowning, but not both. Utilitarianism might permit saving the wife (perhaps due to special knowledge of her welfare or the destabilizing effects of her death), but it insists that the justification for this action must rest on impartial considerations. If the husband hesitates to calculate whether saving his wife maximizes general utility, he is, from the utilitarian perspective, morally suspect.

  Williams argues that the husband ought to be able to save his wife simply because she is his wife. If he entertains the utilitarian justification, he has had "one thought too many." The standard misreading suggests that Williams is worried the husband might calculate and decide *not* to save his wife. But Williams's point is subtler. The distortion occurs even if he calculates and *does* save her. The mere necessity of running the justification through the filter of impartiality alienates him from the commitment that makes him a husband. The relationship is no longer the direct source of the reason for action; it is merely a datum in a neutral calculation. The integrity objection, therefore, is that utilitarianism cannot account for the immediacy of personal obligations without dissolving them into impersonal ones. It gets the phenomenology of deliberation wrong, but more importantly, it gets the metaphysics of agency wrong.

  This leads to the most potent counter-argument against Williams: the charge that he is merely doing moral psychology. Critics argue that Williams identifies a feeling of discomfort or alienation but fails to demonstrate that utilitarianism yields the *wrong normative answers*. If the husband saves his wife, the utilitarian says the right action was performed. If Williams only objects that the husband *felt* alienated during the deliberation, he has offered a psychological observation, not a moral refutation. Ethics, the critic claims, is about what we ought to do, not about preserving our sense of self-integration. If utilitarianism identifies the right action, why does the deliberative route matter?

  To defend Williams against this reply, we must reject the premise that normative ethics is solely concerned with action-guiding outputs (the "what") to the exclusion of accounts of practical reason (the "how"). A moral theory that renders the agent incoherent in the process of identifying the right action is defective not psychologically, but conceptually. Williams is not arguing that alienation is unpleasant; he is arguing that it is impossible to be an agent in the way utilitarianism requires.

  If ground projects are what provide an agent with reasons to act, then a theory that requires the agent to disregard the reason-giving force of those projects (by treating them as neutral data) undermines the possibility of rational action. To ask an agent to act is to ask them to act from their own perspective. Utilitarianism asks the agent to act from the perspective of the universe. Williams's argument is that there is no such thing as the "view from nowhere" for a situated agent. Therefore, a theory that mandates this view does not just clash with our psychology; it clashes with the conditions of agency itself.

  Furthermore, the claim that Williams offers no argument that utilitarianism gets the "wrong answers" relies on a narrow definition of what constitutes a moral answer. If we accept that morality is a system for guiding human conduct, then a theory that systematically misdescribes the nature of human deliberation gives the wrong answer about the nature of moral obligation. Obligation must be something that can bind a specific agent. If the binding force of an obligation requires the agent to negate their identity as a specific person, the obligation is conceptually incoherent. Thus, utilitarianism gives the wrong answer to the question: "What is the relationship between a moral agent and their reasons?"

  Consider the implications of the "moral psychology" objection. If we dismiss Williams's critique because it focuses on the agent's internal relation to their actions, we risk endorsing a moral theory that treats agents as mere conduits for utility production. This reduces the agent to a vessel. Williams's defense of integrity is a defense of the agent as a locus of responsibility. If I am responsible for my actions, they must issue from *my* commitments. If they issue solely from an impersonal calculus, *I* am not the author of the action; the calculus is. In this sense, utilitarianism does get the "wrong answer": it answers that the agent is a neutral channel, whereas the truth of moral experience is that the agent is a committed participant.

  Finally, the "one thought too many" case demonstrates that the deliberative route *changes the moral character of the act*. Saving a wife because she is one's wife is an act of love and fidelity. Saving a wife because a neutral calculation permits it is an act of administrative compliance. These are not morally equivalent actions, even if the physical outcome is identical. Utilitarianism, by focusing exclusively on outcomes, fails to see that the *reason* for the action is constitutive of its moral value. Therefore, Williams is not merely noting a psychological side-effect; he is pointing out a normative blind spot. Utilitarianism fails to value the integrity of the moral transaction itself.

  In conclusion, reading Williams's integrity objection as a demandingness complaint trivializes his contribution to moral philosophy. It turns a structural critique of practical reason into a complaint about the cost of morality. Williams's true argument is that utilitarianism alienates agents from their ground projects by demanding an impartial justification for commitments that are, by definition, partial. This alienation is not merely a psychological discomfort but a violation of the conditions of agency. Against the charge that this is merely moral psychology, we must insist that a moral theory that requires the negation of the agent's perspective to validate the agent's actions is normatively deficient. It provides the wrong account of how reasons function and, consequently, the wrong account of what it means to act morally. Williams shows us that a moral theory that cannot accommodate the agent's integrity does not just ask too much of us; it asks us to be something we are not.
