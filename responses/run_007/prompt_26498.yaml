      *   **Key Example:** The "one thought too many" case (Jim and the Indians / the husband saving his wife).
      *   **Specific Counter-Argument to Address:** Defend this reading against the reply that Williams is merely doing "moral psychology" (describing feelings) and lacks a normative argument that utilitarianism gets the *wrong answers*.

  2.  **Initial Brainstorming & Clarification:**
