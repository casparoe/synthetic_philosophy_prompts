      *   *The Misreading:* Many intro ethics classes teach Williams as saying "Utilitarianism is too hard; it asks too much of us." This is the "demandingness objection."
      *   *The Correct Reading (per prompt):* It's about *alienation*. The utilitarian agent must view their own projects from a neutral, external standpoint. This splits the agent.
      *   *One Thought Too Many:* The husband who calculates the general utility of saving his wife before saving her. It's not that he shouldn't save her; it's that he shouldn't need to calculate it.
