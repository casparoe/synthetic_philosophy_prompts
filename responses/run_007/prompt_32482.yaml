      *   *Which is more Dostoevskian?* Dostoevsky cares about Truth and Freedom. But the G.I.'s specific crime is taking away the *choice* to believe.
      *   *Which is more philosophically stable?* Rejecting (6) avoids the "I know what's good for you" trap of rejecting (4). It allows us to say: "Okay, maybe freedom isn't the highest good, but *lying* to people to make them happy is still wrong."
