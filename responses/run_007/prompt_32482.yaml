      *   **Inference (6):** *If freedom is not intrinsically valuable, then there is nothing wrong in principle with a system that restricts freedom...*
          *   *Critique:* This assumes consequentialism (happiness/security is the only other metric). But one could argue freedom isn't intrinsically valuable, yet *coercion* is intrinsically wrong. Or that truth is valuable, and the G.I. rules by lies (Miracle, Mystery, Authority).
