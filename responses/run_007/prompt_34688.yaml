      *   *Refining the Translation:* Let's anchor it in **The Status of the Text**.
          *   **Presentism = The Drafting Process (or the Reading Experience).** Reality is the *act* of narration. Only the current sentence is ontologically heavy.
          *   **Eternalism = The Published Object.** Reality is the *whole book*. All chapters exist equally.

      *   *Wait, I need to be careful.* Philosophers argue about *reality*, novelists argue about *representation*. I need to map the *ontology* of time onto the *ontology of the story world*.
      *   *Revised Translation:*
          *   **Presentism:** The story world *only* contains what the POV character is experiencing *in this scene*. Flashbacks are memories (unreliable, non-existent places). Foreshadowing is just guesswork. The "truth" of the story is generated moment-to-month.
          *   **Eternalism:** The story world is the *complete manuscript*. The ending is as real as the beginning. A flashback is a jump to a different coordinate in the same existing structure. Foreshadowing is a literal thread connecting existing points.

      *   *Let's try a different angle: The Narrator's Relationship to the Event.*
          *   **Presentism:** The Narrator is *in* the time stream. They age. They forget. They are surprised. (e.g., *The Unconsoled*, or strict stream of consciousness).
          *   **Eternalism:** The Narrator is *outside* the time stream. They see the beginning and end simultaneously. (e.g., *Slaughterhouse-Five*, *One Hundred Years of Solitude*).

      *   *Decision:* I will frame it as **The Ontology of the Manuscript**.
          *   **Presentism:** Reality = The Cursor. (Only where the pen touches the paper is real).
          *   **Eternalism:** Reality = The Library. (The book exists fully bound, regardless of where the reader is).

  5.  **Drafting the Translation (Iterative refinement):**

      *   *Presentism in Craft:* "In-scene" immediacy. No omniscient prolepsis. The past is only accessible via memory (which is fallible narrative). The future is unwritten. The *tense* must be present, but more importantly, the *access* is limited to the immediate.
      *   *Eternalism in Craft:* The "God View." The narrator knows the end from the start. Flashbacks aren't memories; they are scene shifts to a different location in the block. Foreshadowing isn't a hint; it's a structural load-bearing beam. The tense doesn't matter (past tense can be eternalist).

      *   *What's at Stake?*
          *   Presentism: Agency, Surprise, The weight of the Now.
          *   Eternalism: Fate, Structure, The weight of the Whole.

  6.  **Developing the Residue Report:**

      *   *Clean Translations:*
