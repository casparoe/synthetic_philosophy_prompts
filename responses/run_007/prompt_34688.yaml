  4.  **Develop the Systematic Translation (The Core Task):**

      *   *Idea 1: Tense.* Presentism feels like Present Tense. Eternalism feels like Past Tense. *Critique:* Too superficial. You can write a present-tense book about a block universe.
      *   *Idea 2: POV/Distance.* Presentism is Deep POV (character only knows *now*). Eternalism is God's Eye View (narrator sees the whole arc). *Critique:* Better, but still about *knowledge*, not *existence*.
      *   *Idea 3: The Manuscript vs. The Reading.* This is the strongest metaphor.
          *   **Presentism:** The experience of *writing* or *reading* line-by-line. The only real ink is the word currently being typed/read. The deleted words (past) are gone; the unwritten words (future) don't exist.
          *   **Eternalism:** The *bound book* sitting on the shelf. Page 1 and Page 300 exist simultaneously. The "now" of the reader is just a finger placing itself on a page.
      *   *Idea 4: Narrative Authority.*
