      *   **Goal:** Create a procedural framework based on Robert Nozick's *Entitlement Theory* (Justice in Acquisition, Justice in Transfer, Rectification) to standardize acquisition and restitution reviews.
      *   **Constraints:** Cannot research every transfer back to creation (resource constraints). Must define where the chain stops. Must distinguish between fact questions and value questions.
      *   **Task:**
          1.  Design the Procedure (The "Nozickian Protocol").
          2.  Run the Procedure on Three Cases:
              *   Case 1: 19th-century colonial funerary object (Repatriation claim).
              *   Case 2: Contemporary print (Clean acquisition).
              *   Case 3: 1947 refugee donation (Holocaust-era/WWII ambiguity).
          3.  Ensure at least one case yields an unwelcome result.
          4.  Explain the limits of the procedure (where theory fails and human judgment takes over).

  2.  **Deconstruct Nozick's Entitlement Theory for Museum Context:**
      *   *Principle of Justice in Acquisition:* How did the first holder get it? (Was it created/stolen/found/looted?)
      *   *Principle of Justice in Transfer:* Did ownership pass voluntarily? (Sale, gift, inheritance vs. theft, duress, confiscation).
      *   *Principle of Rectification:* If past injustice occurred, what is the remedy? (Return, compensation, shared custody).
      *   *The "Wilt Chamberlain" Insight:* Don't judge by the current pattern (e.g., "museums should have X% of global art"). Judge by the history of transactions.
      *   *The Constraint:* Infinite regress is impossible. We need a "Statute of Limitations" or "Due Diligence Horizon."

  3.  **Drafting the Procedure (The "Entitlement Protocol"):**
      *   *Phase 1: Justice in Acquisition (Origin).* Who made it? Under what authority?
      *   *Phase 2: Justice in Transfer (Chain of Title).* Focus on "Red Flag Eras" (WWII, Colonial periods, Conflict zones).
      *   *Phase 3: The Cut-Off Rule.* Since we can't go back forever, where do we stop? (e.g., 1970 UNESCO Convention is the standard legal baseline, but ethical baselines might differ). Let's set a "Presumption of Validity" after a certain date unless red flags exist.
      *   *Phase 4: Rectification Trigger.* If a violation is found in Phase 1 or 2, does it trigger rectification?
