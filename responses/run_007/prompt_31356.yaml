          *   *Decision:* Case 1 (Colonial) -> Procedure says "Rectify (Return)." (Unwelcome to a collection-building Director). Case 3 (Refugee) -> Procedure says "Insufficient Evidence to Flag, but High Ethical Risk -> Human Decision."

  5.  **Refining the "Cut-Off" (The Resource Constraint):**
      *   Nozick doesn't specify a time limit. We must impose one for practicality.
      *   *Standard:* 1970 UNESCO Convention is the legal hard stop for many.
