      *   Formatting: Clear headings, bullet points for the procedure.
      *   Check against constraints: Did I answer where the procedure stops? Yes. Did I run all three cases? Yes. Is one unwelcome? Yes. Did I explain limits? Yes.

  9.  *(Self-Correction on Nozick's Wilt Chamberlain)*: Ensure I use the Wilt Chamberlain point correctly. It means "Don't look at the end state (Museum has it, Country doesn't), look at the process." If the process was dirty, the end state is illegitimate regardless of how nice the museum is.

  10. *(Final check on Case 1)*: Colonial administrator taking funerary objects. Under Nozick, was the initial acquisition just? Unlikely (grave robbing/extraction without consent). Therefore, current holding is unjust. Rectification = Return. This contradicts the Director's desire to avoid fights. Perfect.

