          *   Step 4: Rectification (The Remedy).
          *   Step 5: The Handoff (Fact vs. Value).
      *   **Case Studies:**
          *   Case 1 (Colonial): Apply steps. Result: Rectification required. (Unwelcome to Director).
          *   Case 2 (Contemporary): Apply steps. Result: Clear.
          *   Case 3 (Refugee): Apply steps. Result: Ambiguous. Handoff to Human.
      *   **Limitations:** Where Nozick fails (epistemic gaps, competing entitlements, definition of "voluntary").

  7.  **Self-Correction/Review during drafting:**
