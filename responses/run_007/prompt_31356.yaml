          *   *Revision:* Let's make Case 1 the one where the procedure says "Return" (Director hates the fight). Case 3 is the ambiguous one where the procedure says "We can't prove injustice, so we keep it" (which feels morally icky but procedurally sound). Or vice versa.
          *   *Better approach for "Unwelcome":* The Director is paranoid about *another* fight. A procedure that says "Fight this" is unwelcome. A procedure that says "Give it back" is unwelcome to the collection growth goals. Let's make Case 1 result in a recommendation to Repatriate (Director hates the conflict/risk). Let's make Case 3 result in a "Hold/Research" which costs money/time (Director hates cost).
          *   *Actually, the strongest "unwelcome" result:* The procedure identifies a clear injustice in Case 1, demanding rectification (Return). The Director wants to keep it. The procedure says "No."
          *   *Wait, Case 3 (Refugee 1947):* This is the Holocaust/Nazi-looted art gray area. If the procedure says "Presumption of innocence due to lack of evidence," but the moral weight suggests otherwise, that's a limit of the procedure.
