answer: |-
  You have a very sharp grasp of the dialectic, and your working theory is partially correct—but it underestimates the technical and metaphysical stakes that keep the debate from dissolving into a merely verbal dispute.

  You are right that both sides preserve classical logic (mostly) and both reject the Sorites inductive premise. If that were all there were to it, you'd be right: it would be a standoff over theoretical aesthetics (metaphysical parsimony vs. semantic fidelity). But the fight is stuck because both positions incur massive, specific costs that proponents of the other side view as deal-breakers.

  Here is a breakdown of why the debate persists, where the substantive disagreements lie, and what progress might look like.

  ### 1. Is your diagnosis right?
  **Mostly, but it's deeper than "what semantics is for."**
  You characterize the split as Epistemicism protecting bivalence/world-structure vs. Supervaluationism protecting linguistic practice/indeterminacy. That is accurate regarding *motivation*. However, the stalemate exists because both sides claim the other fails on **internal coherence**.

  *   **The Epistemicist Charge:** Supervaluationism is "epistemicism in disguise." To define "admissible precisifications," you must draw a sharp boundary between what counts as admissible and what doesn't. If 'bald' is vague, surely the set of acceptable sharpenings of 'bald' is also vague. If Supervaluationism posits a sharp set of precisifications, it has just pushed the sharp cutoff up one level (higher-order vagueness). Williamson argues you end up with unknowable boundaries anyway, so why not just accept them at the object level?
  *   **The Supervaluationist Charge:** Epistemicism is metaphysically absurd. It requires that there is a fact of the matter, determined by microphysical states and usage, that distinguishes the last bald man from the first non-bald man. This violates plausible supervenience principles (how could adding one molecule of hair change the truth value of 'bald' when usage and physics remain constant?).

  So, it's not just a preference; each side thinks the other violates a fundamental constraint (logic/metaphysics for Epi; semantic coherence for Super).

  ### 2. Is there a substantive factual or logical question underneath?
  Yes. There are two major technical battlegrounds where they make different predictions.

  **A. The Behavior of Inference Rules**
  You noted both keep classical logic. This is true for *tautologies* (e.g., $P \lor \neg P$ is supertrue). It is **not** true for *inference rules*.
  *   **Supervaluationism** fails to preserve truth in standard classical inference patterns. Specifically, it violates **Conditional Proof** and **Reductio Ad Absurdum** in contexts involving the 'Definitely' operator ($D$).
      *   Example: From $P \vdash Q$, Supervaluationism cannot always infer $\vdash P \to Q$.
      *   Why? Because $P$ might be supertrue, and $Q$ supertrue, but the conditional $P \to Q$ might fail on some precisification where $P$ is true but $Q$ is not (if the precisifications shift).
  *   **Epistemicism** preserves classical inference rules outright.
  *   **The Stakes:** If you think logic is defined by inference rules (proof-theoretic), Supervaluationism looks broken. If you think logic is defined by validity/truth-preservation (model-theoretic), Supervaluationism looks okay. This is a substantive disagreement about the nature of logic.

  **B. Higher-Order Vagueness**
  This is the biggest substantive hurdle.
  *   **Epistemicism:** Handles higher-order vagueness easily. There is a boundary between bald and not bald ($n$). There is also a boundary between "definitely bald" and "borderline bald" ($m$). We just don't know $n$ or $m$.
  *   **Supervaluationism:** Struggles mightily. If you introduce a 'Definitely' operator ($D$) to model "borderline," you need to define its semantics.
      *   If $Dp$ is true iff $p$ is true on all admissible precisifications, then the boundary of $D$ is sharp (a sentence is either true on all or it isn't).
      *   To avoid this, Supervaluationists must make the *admissibility relation* itself vague. But modeling a vague admissibility relation without collapsing back into epistemicism or infinite regress is technically notoriously difficult (the "revenge of the sharp boundaries").

  ### 3. Is it a verbal dispute or are they talking past each other?
  It is **not** a verbal dispute. They agree on the extension of 'bald' in clear cases and they agree the Sorites premise is false. But they disagree on the **explanation of our ignorance**.

  *   **Epistemicist Explanation:** We are ignorant because the fact is there but inaccessible (safety conditions on knowledge prevent us from knowing the cutoff).
  *   **Supervaluationist Explanation:** We are ignorant because there is no fact to know (truth-value gaps).

  This leads to different predictions about the **logic of 'Definitely'**.
  *   For the Epistemicist, $Dp \to p$ is true, and $D(p \to q) \to (Dp \to Dq)$ holds (K-axiom).
  *   For the Supervaluationist, depending on the formulation, the logic of $D$ often fails to be S4 or S5.
  *   **Test Case:** Consider the sentence: "It is indefinite whether it is indefinite whether Joe is bald."
      *   Epistemicism says this is just a claim about our epistemic distance from the second-order boundary.
      *   Supervaluationism has to construct a model where the set of precisifications is fuzzy.
      *   If you can construct a scenario where their logical predictions diverge regarding the 'Definitely' operator, it's not verbal. (In practice, they often converge on the truth values of natural language sentences, but diverge on the *logic* governing those sentences).

  ### 4. Is one side just wrong?
  Most philosophers in the field suspect both are partially wrong, which is why the debate has stalled.
  *   **Epistemicism** is widely viewed as the "logical winner" but the "metaphysical loser." It saves logic at the cost of making the world seem magical (sharp boundaries for 'heap').
  *   **Supervaluationism** is the "semantic winner" but the "logical loser." It respects the fuzziness of language at the cost of breaking standard inference rules and struggling with higher-order vagueness.

  Many theorists (e.g., Kit Fine, later in his career; David Lewis; contextualists like Diana Raffman) have moved toward **Contextualism** or **Plurivaluationism** to escape this dichotomy. The idea is that the extension of 'bald' shifts during the Sorites reasoning process, so there is no single proposition being evaluated throughout the argument. This dissolves the need for either sharp boundaries or truth-value gaps.

  ### 5. What would count as progress?
  Since formal results (completeness proofs, etc.) haven't settled it, progress is likely to come from three areas:

  1.  **Formal Modeling of Higher-Order Vagueness:** A Supervaluationist framework that successfully models higher-order vagueness without smuggling in sharp boundaries (e.g., using fuzzy sets of precisifications) would be a major victory.
  2.  **Experimental Philosophy/Psychology:** If cognitive science shows that human categorization *does* operate with sharp thresholds (perhaps neurally) that are simply inaccessible to report, Epistemicism gains empirical support. If it shows genuine gappy processing, Supervaluationism gains ground. (Current data is mixed/ambiguous).
  3.  **The "Definitely" Operator:** A consensus on the logic of determinacy. If we can agree on the intuitive validity of principles like $Dp \to DDp$ (if it's definite, it's definitely definite), that rules out many Supervaluationist models. If we reject that, it hurts Epistemicism.

  ### Summary for your Seminar
  You can confidently tell your seminar that the stalemate is not due to a lack of understanding, but because **both theories trade a bullet**.
  *   **Epistemicism** bites the bullet on **Metaphysics** (sharp boundaries exist).
  *   **Supervaluationism** bites the bullet on **Logic** (inference rules fail / higher-order boundaries are sharp).

  The debate is stuck because neither bullet is palatable. Progress requires either showing one bullet is less costly than we thought, or adopting a third framework (like Contextualism or Degree Theory) that avoids both. It is a genuine disagreement about the cost-benefit analysis of semantic theory, not a verbal dispute.

  **Recommended reading to deepen this:**
  *   **Williamson, *Vagueness* (1994):** Specifically the chapters on margin for error.
  *   **Keefe, *Theories of Vagueness* (2000):** The best neutral overview of the Supervaluationist costs.
  *   **Sorensen, *Vagueness and Contradiction*:** For the epistemicist defense of sharp boundaries.
  *   **Raffman, *Unruly Words*:** For the Contextualist way out of this specific dichotomy.
