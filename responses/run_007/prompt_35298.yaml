prompt: |-
  So I've been going down this rabbit hole with Bongard problems — you know, those puzzles where you get six boxes on the left and six on the right, and you have to figure out the rule that seperates them? Like, left side all have triangles, right side all have circles, except way more subtle. I got into them because I was frustrated with how many examples our few-shot classifier needed during training, and someone on my team pointed out that humans can nail a Bongard problem from literally just the twelve examples given (six per side), while a model trained on twelve examples would be useless. So I started wondering: what is it about the *kind* of concept that makes it learnable from a handful of examples?

  I've been trying to categorize concepts by their logical structure rather than their visual content, and I want to know how you'd rank them by how many examples a human would need to reliably induce the rule. Not looking for experimental data — just your best guess based on reasoning about what makes a concept hard to pick up. Here are the types I've been thinking about:

  - Simple feature presence/absence (e.g., "contains at least one circle")
  - Relational between two objects (e.g., "the larger shape encloses the smaller one")
  - Counting-based (e.g., "has exactly three shapes")
  - Set-level property (e.g., "all shapes are identical" vs. "shapes are all different")
  - Disjunctive (e.g., "contains a triangle OR a square")
  - Negated relational (e.g., "the square is NOT inside the circle")

  Rank these from easiest (fewest examples needed to induce the concept) to hardest (most examples needed). And I'd really appreciate if you could say how confident you are in each placement, and single out the one you're least sure about. I'm trying to figure out whether my own intuitions here are even in the right ballpark or if I'm missing something fundemental about how concept induction works. Also, please write in American English.
