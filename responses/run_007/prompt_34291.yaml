  The shattered egg will not rebuild its shell,
  Cream swirls in coffee till the brown is deep.
  We feel time flow like water down a well,
  Into a future where the atoms sleep.
  The Second Law, we say, directs this stream,
  For entropy must rise toward the light.
  To define the future's distinct scheme,
  And orders disorder toward the night.

  Yet micro-dynamics know no forward line,
  For fundamental laws are blind to time.
  The arrow lies not in the grand design,
  But in the boundary state at time's own prime.
  Past Hypothesis: low-entropy start,
  A brute fact breaking time's symmetric heart.
