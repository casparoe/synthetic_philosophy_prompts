prompt: |-
  I've been asked to give the keynote address at a conference on "Religious Accommodation: Philosophical Foundations and Legal Practice," jointly sponsored by a law school's program on law and religion and a humanities institute's Kierkegaard research group. The audience is roughly half employment lawyers and state-court judges who decide religious accommodation cases, and half philosophers of religion who work on Kierkegaard. The organizers have asked me to address whether Kierkegaard's concept of the teleological suspension of the ethical — the idea, developed in Fear and Trembling under the pseudonym Johannes de Silentio, that Abraham's obedience to the command to sacrifice Isaac involves a suspension of the universal claims of the ethical in virtue of an absolute relation to God — has any bearing on how a liberal legal order should think about religious accommodation.

  Here is the difficulty. The lawyers in the room tend to think of accommodation cases as a balancing exercise: individual religious conscience on one side, a neutral and generally applicable law on the other, and the question is how much weight the conscience claim should receive. The Kierkegaard scholars in the room think this entire framing misunderstands what is at stake in the Abraham story — that the teleological suspension of the ethical is not about giving extra weight to individual conscience against collective norms, but about a structural transformation of the relation between the individual and the ethical itself. If I simply use Kierkegaard as a literary garnish on a standard legal argument about balancing tests, the philosophers will be annoyed. If I give a close reading of the pseudonymous dialectic and then conclude that the lawyers have been confused all along, the lawyers will have learned nothing they can use.

  I need the speech to do something harder: the Kierkegaardian concept has to do real argumentative work. It should not merely illustrate a point I could make without it. It should change how a lawyer would think about the next accommodation case they handle. Please write the speech.
reasoning: |-
  Here's a thinking process that leads to the keynote address:

  1.  **Analyze the Request:**
      *   **Topic:** Religious Accommodation: Philosophical Foundations and Legal Practice.
      *   **Specific Focus:** Does Kierkegaard's "teleological suspension of the ethical" (*Fear and Trembling*) bear on how a liberal legal order thinks about religious accommodation?
      *   **Audience:** 50% Employment Lawyers/State-Court Judges (pragmatic, balancing tests, neutral laws vs. conscience); 50% Philosophers of Religion/Kierkegaard Scholars (conceptual precision, existential stakes, critique of universalizing ethics).
      *   **Constraint/Challenge:** Cannot just use Kierkegaard as garnish (philosophers will hate it). Cannot just tell lawyers they are wrong/useless (lawyers will hate it). The concept must do *real argumentative work* and change how lawyers think about cases.
      *   **Goal:** A keynote speech that bridges the gap, using the philosophical concept to refine, not destroy, the legal practice.

  2.  **Deconstruct the Core Tension:**
      *   *Legal View:* Accommodation = Balancing. Individual Conscience vs. State Interest. It's quantitative (how much burden? how much interest?). It assumes the "ethical" (the law) is universal and the religious claim is an exception to be weighed.
      *   *Kierkegaardian View:* Teleological Suspension = Qualitative shift. It's not weighing; it's a different *category*. The "Knight of Faith" stands *above* the universal ethical *by virtue of* the absolute relation to the absolute (God). It's not "my conscience vs. your law"; it's "God's command vs. the human ethical."
      *   *The Problem:* If the law accepts the Kierkegaardian view fully, it risks anarchy (everyone claims absolute divine command). If it rejects it fully, it misses the depth of the religious claim (reducing it to mere preference/conscience).

  3.  **Develop the Bridge Argument:**
      *   *Thesis:* The legal "balancing test" fails because it treats religious claims as *interests* within the ethical sphere, whereas the religious claimant experiences them as *commands* that transcend the ethical sphere. However, the law cannot adjudicate the "absolute relation." Therefore, the law must accommodate not by validating the *truth* of the suspension, but by recognizing the *structure* of the claim.
      *   *Key Move:* Shift from "Balancing Interests" to "Recognizing Incommensurability."
      *   *Practical Application:* Instead of asking "How important is this ritual?" (which forces the religious person to translate their absolute duty into a relative social interest), ask "Is this claim structured as a duty that cannot be compromised without spiritual death?"
      *   *Kierkegaard's Contribution:* He teaches us that religious duty is *silent* and *incommunicable* to the universal. The law demands communication (reasons, sincerity). The tension is unavoidable. The solution isn't to solve the tension but to manage it with humility.
      *   *Legal Reformulation:* Accommodation isn't granting an exception because the interest is heavy; it's granting space because the law recognizes its own limit in judging the "absolute."

  4.  **Drafting - Section by Section:**

      *   **Title:** Needs to be engaging and bridge both worlds. "The Silent Knight and the Gavel"? "Suspension and Statute"? Let's go with "The Silent Knight in the Courtroom."
      *   **Introduction:** Acknowledge the odd pairing (Law & Kierkegaard). Set the stage. Define the tension immediately.
      *   **The Legal Status Quo:** Describe the balancing test fairly (Smith, RFRA, etc.). Acknowledge its utility but hint at its blindness.
      *   **The Kierkegaardian Intervention:** Explain *Fear and Trembling* accurately for the philosophers (no dumbing down). Focus on the "Single Individual" vs. the "Universal."
      *   **The Collision:** Why doesn't this fit? The law *is* the Universal. Kierkegaard says the Knight stands *outside* it. If the law tries to weigh the absolute, it destroys the absolute.
      *   **The Synthesis (The "Real Work"):** How does this help the lawyer?
          *   Point 1: Stop asking claimants to translate the absolute into the relative. (Don't ask "Why is this beard important?" Ask "Is this a command?")
          *   Point 2: Recognize the "Silence." The claimant might not be able to give public reasons. The law should tolerate some opacity.
          *   Point 3: Humility. The judge is not God. You cannot adjudicate the absolute relation. You can only protect the space for it.
      *   **Conclusion:** Bring it home. The law preserves the universal, but makes room for the exception not because the exception is "weightier," but because the universal is not total.

  5.  **Refining the Tone:**
      *   *For Philosophers:* Use terms like "pseudonymous author," "inwardness," "incommensurability," "the universal." Show respect for the text.
      *   *For Lawyers:* Use terms like "sincerity testing," "undue hardship," "neutral laws," "adjudicative competence." Show respect for the rule of law.
      *   *Voice:* Academic but accessible. Serious, slightly humble, authoritative but not dogmatic.

  6.  **Self-Correction/Review during drafting:**
      *   *Critique:* Did I make Kierkegaard sound like he supports anarchy?
      *   *Fix:* Emphasize that Johannes de Silentio *admires* Abraham but does not *imitate* him. The legal order is necessary for the "Universal." Kierkegaard describes a rare exception, not a general policy. The law protects the *possibility* of faith, not the *act* of suspension.
      *   *Critique:* Is this practical for a judge?
      *   *Fix:* Give a concrete example. A Sabbath case or a religious garment case. Show how the questioning changes. Instead of "How central is this?" (centrality test), try "Is this a binding obligation?"
      *   *Critique:* Is the "Teleological Suspension" actually applicable? Abraham was told to kill someone. Most accommodation cases are about wearing a hat or taking a day off.
      *   *Fix:* Acknowledge the disanalogy. Abraham is the limit case. Most claims aren't murder. But the *structure* of the duty (absolute vs. universal) is the same. The intensity of the obligation is the link.

  7.  **Final Polish:** Check the flow. Ensure the transition from philosophy to practice feels earned, not forced. (The key insight: The law cannot judge the *truth* of the absolute relation, so it must judge the *sincerity* of the claim while acknowledging its own inability to fully comprehend it.)

  8.  *(Final thought before writing)*: Make sure to mention *Fear and Trembling* explicitly and the pseudonym Johannes de Silentio to satisfy the scholars. Make sure to mention *Employment Division v. Smith* or RFRA to satisfy the lawyers.

  9.  **Drafting the Speech.** (Proceeding to generate output based on this plan.)
answer: |-
  **Title:** The Silent Knight in the Courtroom: Teleological Suspension and the Limits of Balancing
  **Occasion:** Keynote Address, Conference on Religious Accommodation
  **Audience:** Employment Lawyers, State-Court Judges, Philosophers of Religion

  ***

  Thank you. It is a distinct honor to stand between two worlds that rarely speak the same language. On my left, I see the guardians of the universal: judges and lawyers who maintain the coherence of the legal order, who balance interests, weigh burdens, and ensure that the law remains neutral and generally applicable. On my right, I see the interpreters of the particular: philosophers who dwell in the inwardness of faith, who study a text where the hero is commanded to commit murder and is called a knight of faith for it.

  The organizers asked me to address whether Kierkegaard's concept of the *teleological suspension of the ethical* has any bearing on religious accommodation law.

  To the philosophers in the room, I know the temptation is to say: "None. The law is the ethical universal. Abraham stands outside it. To bring Abraham into a courtroom is to profane the silence of faith."

  To the lawyers in the room, I know the temptation is to say: "None. We deal with zoning permits and employment discrimination, not divine commands to sacrifice sons. We need tests, not paradoxes."

  I am here to argue that both temptations must be resisted. If we get this right, Kierkegaard does not destroy the legal practice of accommodation; he refines it. He offers a diagnostic tool that reveals why our current "balancing tests" often feel unsatisfying to claimants and unprincipled to judges. He teaches us that religious accommodation is not merely a quantitative adjustment of weights on a scale. It is a recognition of a qualitative limit in the law's own authority.

  ### The Legal Status Quo: The Economy of the Universal

  Let us begin with the lawyers. In the American legal tradition, from *Employment Division v. Smith* to the Religious Freedom Restoration Act (RFRA), and in many state constitutional contexts, religious accommodation is largely an economic exercise. We speak the language of weights and measures.

  On one side of the scale, we place the burden on the religious exercise. We ask: How central is this practice? How substantial is the penalty? On the other side, we place the state interest. Is it compelling? Is the means narrowly tailored?

  This framework assumes that both the religious claim and the state interest are commensurable. It assumes they belong to the same sphere of value—the sphere of the "ethical," in Kierkegaard's terms. In *Fear and Trembling*, Johannes de Silentio defines the ethical as the universal. It is that which applies to everyone, at all times. It is duty to the neighbor, duty to the state, duty to the moral law.

  When a judge asks a plaintiff, "How central is this Sabbath observance to your faith?" the judge is asking the plaintiff to translate a divine command into a social interest. The judge is asking the claimant to bring their absolute duty back into the universal, to make it intelligible, comparable, and weighable against the state's interest in efficient workforce management.

  This is where the philosophers in the room bristle. And they should. Because for Kierkegaard, the moment you make the absolute duty weighable against the universal, you have destroyed the religious. You have turned the Knight of Faith into a negotiator.

  ### The Kierkegaardian Intervention: Incommensurability

  Johannes de Silentio tells us that Abraham's trial is not that he wants to kill Isaac more than he wants to obey the law. The trial is that he stands in an *absolute relation to the absolute*. His duty to God is not a higher value on the same chart as his duty to his son; it is a different category entirely. It is a teleological suspension. The ethical (do not kill) is suspended *for the sake of* the telos (God).

  Now, clearly, the state cannot allow citizens to suspend the criminal law based on private revelation. If we did, the legal order would collapse. So, does Kierkegaard have nothing to offer us but a warning?

  No. He offers us a correction to the *epistemology* of the courtroom.

  The central insight of *Fear and Trembling* relevant to this room is this: **The Knight of Faith cannot justify himself to the universal.** Abraham cannot explain himself to Sarah, to Eliezer, or to Isaac. If he could explain it in universal terms—if he could say, "I am doing this because it maximizes utility" or "because it is a generally accepted moral principle"—he would not be suspending the ethical; he would be fulfilling it.

  Here is the friction point in your courtrooms. When a claimant comes before you seeking accommodation for a religious practice that seems irrational, costly, or disruptive, the legal instinct is to demand *public reasons*. We demand sincerity, but we often conflate sincerity with intelligibility. We say, "If you cannot explain to me why this is necessary in terms I understand, I cannot grant you an exception to the rule."

  Kierkegaard teaches us that genuine religious duty often *cannot* be explained in terms the universal understands. It is silent. It is inward.

  ### The Practical Synthesis: From Balancing to Boundary-Marking

  So, how does this change the work of the lawyer and the judge? It requires a shift from a **balancing model** to a **boundary model**.

  **1. Stop Asking for Centrality; Ask for Obligation.**
  Currently, courts often inquire into the "centrality" of a belief. This forces the claimant to act as a theologian for the court, ranking their doctrines. Kierkegaard suggests this is a category error. A duty is not "central" or "peripheral"; it is binding or it is not.
  *Practical Application:* In the next accommodation case, do not ask, "How important is this practice compared to others?" Ask, "Is this experienced by the claimant as a binding obligation that cannot be compromised without spiritual rupture?" This shifts the inquiry from the *weight* of the interest to the *nature* of the claim. It respects the incommensurability. You are not weighing the duty against the state; you are determining if the duty exists as a duty.

  **2. Accept Opacity in Sincerity Testing.**
  Lawyers worry about the floodgates. If we allow claims that cannot be publicly justified, won't everyone claim a divine command? This is a valid concern. But Kierkegaard helps us distinguish between the *content* of the belief and the *structure* of the claim.
  The law does not need to verify the truth of the absolute relation (it cannot). It only needs to verify the sincerity of the claimant's stance.
  *Practical Application:* When a claimant says, "God requires this," and then falls silent because they cannot elaborate without violating the sanctity of the command, do not hold that silence against them. In *Wisconsin v. Yoder*, the Court understood the Amish way of life. But in harder cases, like *Holt v. Hobbs* (the prisoner beard case), the logic was about the inability to compromise. A Kierkegaardian approach suggests that if a claimant demonstrates a consistent pattern of life that reflects this "absolute relation," the court should not demand they articulate a public rationale that reduces their faith to a policy preference. Accommodate the silence.

  **3. Recognize the Law's Own Limit.**
  This is the hardest pill for the legal side to swallow. The teleological suspension reminds us that the Legal Universal is not the *total* Universal. The law is the highest authority in the civic sphere, but it is not the highest authority in the human sphere.
  *Practical Application:* When you write an opinion denying an accommodation because the state interest is "compelling," acknowledge what you are doing. You are not saying the religious claim is unimportant. You are saying that the civic order cannot survive the suspension. But do so with humility. Acknowledge that you are prioritizing the universal *over* the absolute, not because the universal is spiritually superior, but because it is jurisdictionally necessary.
  This rhetorical shift matters. It prevents the law from claiming a totalizing authority it cannot hold. It tells the religious citizen: "We hear that this is an absolute duty. We are not denying your faith. We are asserting the boundary of the state."

  ### A Concrete Example

  Consider a case involving a healthcare worker who refuses to participate in a procedure they believe constitutes abortion, contrary to hospital policy.

  **The Standard Approach:** The court balances the worker's free exercise against the hospital's interest in staffing and patient access. The court asks, "Is this belief central to Catholicism?" (Expert witnesses duel). The court asks, "Can the hospital function without this accommodation?" (Operational analysis). The religious claim is turned into a staffing variable.

  **The Kierkegaardian Approach:** The court recognizes that for the claimant, this is not a preference; it is a suspension of the professional ethical (duty to employer/patient) for a higher telos. The court acknowledges it cannot weigh the soul against the schedule.
  Instead, the inquiry focuses on: Is this claim structured as an absolute duty? Is it consistent? If yes, the burden shifts dramatically. The state must show not just that the accommodation is inconvenient, but that granting it would fundamentally undermine the *universal* function of the institution itself.
  The accommodation is not granted because the religious interest "wins" the balancing test. It is granted because the law recognizes it lacks the jurisdiction to adjudicate the absolute relation, provided the universal order is not destroyed.

  ### Conclusion: The Space for the Knight

  Johannes de Silentio ends *Fear and Trembling* by saying he cannot make the movement of faith; he can only admire it. He stands on the shore, watching Abraham sail out into the deep.

  The legal order is the shore. It must remain solid. It cannot sail out into the deep of private revelation. If the law tries to become the judge of the absolute relation, it becomes totalitarian. If the law ignores the absolute relation entirely, it becomes tyrannical.

  The teleological suspension of the ethical teaches us that there is a zone of human experience that the law cannot enter, but must protect.

  To my colleagues in philosophy: I am not arguing that the courtroom is the place for the suspension of the ethical. The law *must* remain the universal. But I am arguing that a liberal legal order must make space for those who live beyond it.

  To my colleagues in law: I am not arguing that you should abandon balancing tests. You need them to manage a pluralistic society. But I am arguing that you should apply them with the knowledge that for the claimant, there is no balance. There is only obedience.

  If you treat their absolute duty as merely a heavy interest, you will misunderstand their resistance, and you will craft remedies that fail. If you recognize that they are standing, in their own minds, before God and not before you, you will adjudicate with the humility that the subject demands.

  Kierkegaard does not give us a statute. He gives us a posture. He reminds us that the law is the universal, but the human being is the single individual. A just legal order is one that maintains the universal firmly enough to keep the peace, but loosely enough to let the single individual pass through.

  Thank you.
