answer: |-
  # Joint Statement of Adversarial Collaboration: Normative Structures in Buddhist Ethics

  **Date:** October 26, 2023
  **Parties:** The Consequentialist Interpretation Camp (CIC) and The Virtue Ethics Interpretation Camp (VEIC)
  **Subject:** Framework for resolving disputes regarding the normative structure of Buddhist Ethics.

  ---

  ## Part I: Shared Commitments and Verbal Disputes

  The following claims are accepted by both the CIC and the VEIC as the common ground for this collaboration.

  1.  **Soteriological Teleology:** Both camps agree that Buddhist ethics is teleological in the broad sense: it is oriented toward a specific end (*telos*), namely the cessation of *duḥkha* (suffering/unsatisfactoriness) and the attainment of Nirvāṇa or Buddhahood.
  2.  **Centrality of Intention (*Cetanā*):** Both camps agree that intention is the primary determinant of karmic weight. An accidental harm carries different normative weight than an intentional harm.
  3.  **The Definition of *Kuśala*:** Both camps agree that the primary normative term in Buddhist ethics is *kuśala* (skillful/wholesome) and its opposite *akuśala* (unskillful/unwholesome). The dispute lies in the analysis of *why* an act is deemed *kuśala*.
  4.  **Rejection of Western Deontology:** Both camps agree that Buddhist ethics is not deontological in the Kantian sense. Precepts (*śīla*) are not absolute duties binding regardless of context; they admit of exceptions and are not grounded in divine command or abstract rational duty.
  5.  **Commitment to Non-Self (*Anātman*):** Both camps agree that any ethical theory must be compatible with the metaphysical doctrine of no-self. Neither camp posits a substantial, permanent agent who is the bearer of virtue or the recipient of utility.
  6.  **CIC Commitment Limit:** The CIC is not committed to Act-Utilitarianism in the secular Western sense. It does not require a conscious calculation of utility in every moment, but rather holds that the *justification* of rules and acts rests on their contribution to welfare.
  7.  **VEIC Commitment Limit:** The VEIC is not committed to the view that consequences are irrelevant. It accepts that wholesome states produce good results, but denies that the *goodness* of the state is constituted solely by those results.
  8.  **Verbal Dispute Identification:** Both camps acknowledge that a portion of their disagreement is verbal, centering on the definition of "Consequentialism." The CIC defines it broadly (justification by outcomes), while the VEIC defines it narrowly (maximization of aggregate good as the sole criterion of right action). Both agree to use the terms "Outcome-Justified" (CIC) and "Character-Constitutive" (VEIC) to minimize semantic confusion in this document.

  ---

  ## Part II: Table of Residual Disagreements

  The following table outlines the substantive disagreements that remain after accepting Part I. Each position is phrased to be acceptable to the holder of that view.

  | Issue | Outcome-Justified Position (CIC) | Character-Constitutive Position (VEIC) |
  | :--- | :--- | :--- |
  | **Normative Force of Precepts** | Precepts are heuristic rules of thumb. They are binding generally because they usually lead to good outcomes, but can be overridden when adherence causes greater harm. | Precepts are constitutive of the path. They are binding because adhering to them *is* the cultivation of the enlightened character; breaking them damages the agent's spiritual capacity. |
  | **Structure of Justification** | An act is *kuśala* (skillful) because, in the relevant context, it produces the best available state of affairs for sentient beings. | An act is *kuśala* (skillful) because it flows from a mind free of the three poisons (greed, hatred, delusion); good outcomes are the natural fruit, not the definition. |
  | **Role of Compassion (*Karuṇā*)** | Compassion is the motivational engine that drives the agent to maximize welfare and minimize suffering across the aggregate of beings. | Compassion is a perfection (*pāramitā*) of character. It is an excellence to be embodied, not merely a tool for distributing welfare. |
  | **The "Right Action" Criterion** | The rightness of an action is determined externally, by its impact on the world and other beings. | The rightness of an action is determined internally, by its coherence with the path of purification and wisdom. |

  ---

  ## Part III: Cruxes and Empirical Tests

  To move this collaboration forward, we identify three specific cruxes. For each, we specify a textual case or argument, and record the distinct predictions each camp makes regarding its interpretation. Settlement of these cruxes would require at least one camp to revise its normative model.

  ### Crux 1: The Justification of Apparent Transgression
  *   **Question:** When a Bodhisattva appears to violate a precept (e.g., killing), is the act justified because it prevents worse consequences, or because the Bodhisattva's character transforms the moral nature of the act itself?
  *   **Concrete Textual Case:** The *Upāyakauśalya Sūtra* (Skill in Means Sutra). The story of the Great Compassionate Captain who kills a bandit to prevent the bandit from killing 500 merchants and falling into hell.
  *   **CIC Prediction:** The text justifies the killing *consequentially*. The Captain accepts the karmic burden (hell) to save the 500 merchants and the bandit. The act is right because the net suffering is reduced.
  *   **VEIC Prediction:** The text justifies the killing *ontologically/psychologically*. Because the Captain's mind is devoid of hatred and driven purely by compassion, the karmic signature of "killing" is not generated. The act is right because it expresses perfect wisdom, not because of a utilitarian calculus.
  *   **Resolution Condition:** If exegesis shows the Captain is praised primarily for *accepting* negative karma to save others, CIC gains ground. If the text emphasizes the Captain *incurs no negative karma* because his mind was pure, VEIC gains ground.

  ### Crux 2: The Structure of Karmic Value
  *   **Question:** Is the moral weight of karma agent-neutral (suffering is bad regardless of who causes it) or agent-relative (my karma is primarily about the corruption or purification of my own mental continuum)?
  *   **Concrete Textual Case:** *Abhidharma* definitions of *kuśala* and *akuśala* roots, specifically the relationship between *vipāka* (ripening) and the mental state at the time of action.
  *   **CIC Prediction:** The tradition models karma as ultimately agent-neutral regarding suffering. The reason to avoid *akuśala* is that it produces suffering in the world (including one's own future selves). The distinction between self and other is ultimately empty, supporting a neutral aggregation of welfare.
  *   **VEIC Prediction:** The tradition models karma as inherently agent-relative. *Vipāka* is the ripening of a specific mental seed in a specific continuum. The primary ethical imperative is the purification of the agent's mind; harm to others is prohibited primarily because it stems from and reinforces defilements in the agent.
  *   **Resolution Condition:** If analysis of *vipāka* shows it functions like a universal utility metric, CIC gains ground. If *vipāka* functions strictly as a mechanism of individual spiritual hygiene, VEIC gains ground.

  ### Crux 3: The Function of the *Brahmavihāras*
  *   **Question:** Are the *Brahmavihāras* (Divine Abidings, e.g., Loving-Kindness) practices whose scope should be extended without limit to maximize coverage, or dispositions to be cultivated and stabilized regardless of external reach?
  *   **Concrete Textual Case:** The *Mettā Sutta* (Sn 1.8) and the *Visuddhimagga* instructions on radiating *mettā* to all beings.
  *   **CIC Prediction:** The instruction to radiate love to "all sentient beings" is a directive to maximize the scope of moral concern. The practice is successful insofar as it inclines the agent to benefit the largest possible number of beings.
  *   **VEIC Prediction:** The instruction to radiate love is a technique for breaking down the agent's internal boundaries and attachments. The "all beings" formula is a method for stabilizing the mind's quality, not a mandate to maximize external welfare distribution.
  *   **Resolution Condition:** If the texts link the radiation of *mettā* directly to external welfare outcomes, CIC gains ground. If the texts link it primarily to the attainment of *jhāna* (meditative absorption) and internal liberation, VEIC gains ground.

  ---

  ## Confidence Assessment

  **Overall Confidence:** High.
  The mapping of these two camps corresponds closely to the contemporary academic debate primarily represented by Charles Goodman (*Consequences of Compassion*, 2009) for the Consequentialist view and Damien Keown (*The Nature of Buddhist Ethics*, 1992) for the Virtue Ethics view. The textual cases selected are the standard loci classici for these debates.

  **Least Certain Point:**
  I am least certain regarding the formulation of **Crux 2 (Karmic Value: Agent-Neutral vs. Agent-Relative)**.
  *Reasoning:* The concept of "agent-neutrality" is a modern analytic category that maps imperfectly onto the doctrine of *anātman* (no-self). While the CIC argues that *anātman* supports agent-neutrality (no self to privilege), the VEIC argues that karma is inherently tied to the causal continuum of the individual, even if that individual is not a substantial self. Distinguishing between "my continuum's suffering" and "suffering period" in a no-self metaphysics is philosophically precarious. It is possible that upon rigorous analysis, both camps would agree that the distinction collapses, rendering this crux less diagnostic than anticipated.
