answer: |-
  # Diagnostic Instrument: Moral Demand and Moral Goodness

  **Instructions for Students:**
  Read each scenario carefully. For each case, select the option that best describes your moral judgment of the agent's action. Do not worry about technical philosophical terms; answer based on your intuitive assessment of what morality demands in that specific situation.

  **Standard Response Options:**
  For every question, choose one of the following:
  *   **(A) Duty:** The agent acted as duty requires. (To omit this act would be a moral failure.)
  *   **(B) Beyond Duty:** The agent went beyond what duty requires. (The act is especially praiseworthy; omitting it is not blameworthy.)
  *   **(C) Good/Optional:** The agent did something good but not required. (It was a nice thing to do, but morality is silent on whether to do it.)
  *   **(D) Merely Permissible:** The agent did something morally neutral. (There is no particular moral value in doing or omitting it.)
  *   **(E) Reason Not to Do:** The agent did something there was reason not to do, though it turned out well. (The act was inadvisable or morally suspicious despite the good outcome.)

  ---

  ### The Scenarios

  **1. The Bus Seat (Low Cost / Stranger / One-Off)**
  You are on a crowded bus after a long day of work. A stranger boards who appears elderly and fatigued. You stand up and offer them your seat, meaning you must stand for the remaining 45 minutes of your commute.
  *   *Dimension:* Low sacrifice, stranger, action.

  **2. The Wallet (Low Cost / Stranger / Forbearance)**
  You find a lost wallet on the sidewalk containing $200 cash and an ID. No one saw you pick it up. You track down the owner and return the wallet with the cash intact, incurring $5 in postage and 30 minutes of your time.
  *   *Dimension:* Low sacrifice, stranger, forbearance (not keeping money).

  **3. The Weekend Volunteer (Moderate Cost / Stranger / Sustained)**
  For the past two years, you have spent every Saturday morning working at a homeless shelter. This requires you to sacrifice your leisure time and sleep in on weekends, but it provides consistent support to the shelter's operations.
  *   *Dimension:* Moderate sacrifice, stranger, sustained action.

  **4. The Kidney Donor (High Cost / Stranger / One-Off)**
  You learn that a stranger on a national transplant list matches your tissue type. You undergo surgery to donate one of your kidneys to them. The surgery carries minor long-term health risks and requires a month of recovery, but it saves the stranger's life.
  *   *Dimension:* High sacrifice, stranger, bodily risk.

  **5. The Burning Building (Extreme Cost / Stranger / Risk of Death)**
  You see a child trapped in a burning building. You rush in to save them. You succeed, but you suffer severe burns and permanently compromise your lung capacity. There was a significant chance you would have died.
  *   *Dimension:* Extreme sacrifice, stranger, life risk.

  **6. The Careful Parent (Moderate Cost / Intimate / Sustained)**
  You are a parent with three children. Beyond providing food, shelter, and education (which you can afford), you spend an hour every evening helping each child with their emotional development and hobbies, sacrificing your own career advancement opportunities to be present.
  *   *Dimension:* Moderate sacrifice, intimate, sustained.

  **7. The Debt Waiver (Moderate Cost / Acquaintance / Forbearance)**
  A friend who is struggling financially owes you $1,000. They are able to pay it back over time, but it would cause them significant stress. You tell them not to worry about it and destroy the IOU, absorbing the loss yourself.
  *   *Dimension:* Moderate financial sacrifice, acquaintance, forbearance.

  **8. The Career Pivot (High Cost / General / Sustained)**
  You are a highly skilled lawyer capable of earning $500,000 annually. You choose instead to work for a non-profit advocacy group earning $40,000 annually, donating the difference to effective charities. You maintain this lifestyle for 20 years.
  *   *Dimension:* High opportunity cost, general benefit, sustained.

  **9. The Better Option (Optimization)**
  You plan to donate $100 to a charity that helps local arts. Just before donating, you learn of another charity that saves lives for the same cost, making the second option objectively "better" in terms of moral value produced. You donate to the arts charity anyway.
  *   *Dimension:* Optimization, comparative value.
  *   *Question Phrasing:* How do you judge the choice to donate to the arts charity rather than the life-saving one?
      *   (A) Duty: You acted as duty requires (it is permissible to choose the lesser good).
      *   (B) Beyond Duty: N/A (This question asks about the *omission* of the better act).
      *   *Correction for Consistency:* Let's rephrase to fit the standard options.
      *   *Revised Scenario 9:* You donate to the life-saving charity instead of the arts charity, sacrificing your personal interest in the arts.
      *   (A) Duty: The agent acted as duty requires.
      *   (B) Beyond Duty: The agent went beyond what duty requires.
      *   (C) Good/Optional: The agent did something good but not required.
      *   (D) Merely Permissible: The agent did something merely permissible.
      *   (E) Reason Not to Do: The agent did something there was reason not to do.

  **10. The Talent (High Cost / Self / Forbearance)**
  You are a brilliant pianist. Playing gives you profound joy and meaning. However, you could use that same time to train as a surgeon and save lives. You choose to remain a pianist, performing occasionally for charity but mostly for personal fulfillment.
  *   *Dimension:* High opportunity cost, self-fulfillment vs. other-benefit.

  ---

  ### Scoring Key and Position Mapping

  To score the instrument, tally the frequency of each response type across the 10 questions. Note that **(B)** and **(C)** are treated as the "Non-Required Good" cluster for most distinctions, though their frequency relative to **(A)** matters.

  #### 1. The Kantian / Rigorist View
  *   **Pattern:** High frequency of **(A) Duty** on questions 1, 2, 3, 4, 7, 8, and 9.
  *   **Diagnosis:** This respondent believes that whenever an act produces significant moral good, morality demands it. They reject the possibility of "optional goodness."
  *   **Key Indicator:** Marking Q1 (Bus Seat) or Q2 (Wallet) as **(A)**.

  #### 2. The Heroism-Only View
  *   **Pattern:** **(A) Duty** or **(D) Permissible** on low-cost cases (Q1, Q2, Q3). **(B) Beyond Duty** on high-cost cases (Q4, Q5, Q8).
  *   **Diagnosis:** This respondent believes ordinary beneficence is required, but extreme self-sacrifice is optional/praiseworthy. They draw the line at significant risk or life-altering cost.
  *   **Key Indicator:** Marking Q1 as **(A)** but Q4 or Q5 as **(B)**.

  #### 3. The Classical View
  *   **Pattern:** **(B) Beyond Duty** or **(C) Good/Optional** on almost all "good" acts (Q1 through Q9), including low-cost ones. **(A) Duty** reserved for basic obligations (e.g., not harming).
  *   **Diagnosis:** This respondent sees a wide latitude in morality. Any act of beneficence, even small ones, is good to do but not wrong to omit.
  *   **Key Indicator:** Marking Q1 and Q2 as **(B)** or **(C)**.

  #### 4. The Imperfect-Duty View
  *   **Pattern:** **(C) Good/Optional** on one-off acts (Q1, Q2, Q4). **(A) Duty** on sustained patterns or total omission (Q3, Q8).
  *   **Diagnosis:** This respondent believes there is a duty of beneficence, but agents have latitude in *how* to fulfill it. However, if one does *nothing* (or stops entirely), they violate duty.
  *   **Key Indicator:** Marking Q1 as **(C)** but Q3 (Sustained Volunteering) as **(A)**. (Note: This is the hardest distinction to capture; look for the shift between one-off and sustained).

  #### 5. The Conceptual-Instability View
  *   **Pattern:** Identical to Kantian/Rigorist (High **(A)**).
  *   **Diagnosis:** Extensionally, this view matches the Kantian view. They believe if an act is morally best, it is incoherent to say it is not required.
  *   **Key Indicator:** Cannot be distinguished from Kantian via this quiz alone (see Limitations).

  #### 6. The Impartial-Spectator View
  *   **Pattern:** Identical to Classical View (High **(B)**/**(C)**).
  *   **Diagnosis:** This respondent agrees with the Classical extension (acts are optional) but grounds it in the distinction between what a spectator can *demand* vs. *recommend*.
  *   **Key Indicator:** Cannot be distinguished from Classical via this quiz alone (see Limitations).

  ---

  ### Limitations and Unoccupied Logical Space

  #### Pairs the Quiz Cannot Reliably Separate
  1.  **Kantian/Rigorist vs. Conceptual-Instability:** Both positions deny the existence of supererogation. The Kantian grounds this in the nature of rational duty; the Instability theorist grounds it in the logic of value ("If it is best, it is required"). Since this quiz tests *judgments on cases* (extension) rather than *meta-ethical justifications* (intension), these two will score identically.
  2.  **Classical vs. Impartial-Spectator:** Both positions affirm the existence of acts that are good but not required. The Impartial-Spectator view is a theoretical account of *why* the Classical view is correct (shifting from "duty" to "demand"). A case-based survey will not reveal whether the student thinks the optionality arises from the nature of duty or the limits of moral authority.
  3.  **Classical vs. Imperfect-Duty:** This is the most difficult branch point. Both views allow for optional acts of charity. The Imperfect-Duty view claims these acts fall *within* a broad duty of beneficence, whereas the Classical view claims they fall *outside* duty entirely. Without asking about the *cumulative* effect of omission (e.g., "Is it wrong to never do any of these acts?"), a static quiz may misclassify an Imperfect-Duty proponent as a Classical proponent. Question 3 and 8 attempt to mitigate this by testing sustained commitment, but ambiguity remains.

  #### Unoccupied Logical Positions
  1.  **Mandatory Supererogation:** The view that an act is "beyond duty" but "omitting it is blameworthy."
      *   *Diagnosis:* This is logically incoherent. If omitting an act is blameworthy, the act is, by definition, a duty. The category of supererogation requires optionality.
  2.  **Bad Supererogation:** The view that an act is "beyond duty" but "morally bad."
      *   *Diagnosis:* Contradicts the definition. Supererogatory acts must be morally good or valuable. If they are bad, they are either forbidden or merely permissible mistakes.
  3.  **The "Suberogatory Duty":** The view that an act is "below duty" (wrong) but "required."
      *   *Diagnosis:* Contradictory. Morality cannot require what it forbids.

  ---

  ### Confidence and Diagnostic Uncertainty

  **Confidence in Taxonomy:** **High.**
  The positions outlined (Classical, Kantian, Heroism-Only, Imperfect-Duty) represent the stable poles of the contemporary debate on supererogation (drawing on Heyd, Urmson, Kant, and Rawls). The logical space is well-mapped in meta-ethics.

  **Least Sure Branch-Point:** **Classical vs. Imperfect-Duty.**
  *   **Reason for Uncertainty:** This is not a failure of the quiz design, but a feature of the philosophical landscape. Many philosophers argue that the "Imperfect Duty" view is merely a semantic reframing of the "Classical" view. If a student marks Q1 (Bus Seat) as "Good/Optional," are they saying "I have no duty to help strangers" (Classical) or "I have a duty to help, but I can choose when" (Imperfect Duty)?
  *   **Conflict:** A student might genuinely hold the Imperfect-Duty view but answer "Good/Optional" for a single instance because they feel they have "enough" credit from past deeds. The quiz captures the *verdict* but struggles to capture the *underlying obligation structure*.
  *   **Recommendation:** In the seminar, use the quiz results as a starting point for discussion. Ask students who score as "Classical" whether they believe a life lived entirely without acts of type Q1–Q9 would be morally blameworthy. Their answer to *that* follow-up question will definitively separate the Classical from the Imperfect-Duty view.
