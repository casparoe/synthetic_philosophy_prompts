answer: |-
  Peirce and James are at a diner. The bill comes, and James pulls out his checkbook.

  The waiter looks at the check skeptically. "Are you sure this is good?"

  James smiles. "Absolutely. It's getting me this meal, isn't it? It has **cash value**. It works. Therefore, it's true."

  Peirce sighs and rubs his temples. "William, you can't define the validity of a check by its immediate utility. The truth of your solvency isn't determined by whether the waiter accepts it *now*. It's determined by whether the entire community of bankers would converge on your balance at the **ideal limit of infinite inquiry**."

  James shrugs. "But I'm hungry now, not at the end of infinity."

  Peirce: "Exactly. If the check bounces tomorrow, you'd say it was 'true' yesterday because it worked. I say it was *never* true, because the final opinion of the bank is that you're broke."

  James: "So your truth is a check that doesn't clear until we're all dead?"

  Peirce: "Better a check that clears at the end of time than one that bounces the moment you leave the booth."

  James laughs. "Well, I call that Pragmatism."

  Peirce stands up and grabs his coat. "And that is exactly why I'm renaming my philosophy **'Pragmaticism.'** It's an ugly word, but it ensures no one thinks I'm willing to co-sign your loans."
