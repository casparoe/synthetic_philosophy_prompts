  Ok so I've been going down this AI alignment rabbit hole lately (mostly YouTube videos and blog posts, not actual papers lol) and I genuinely can't figure out whether "the alignment problem" is one thing or alot of things wearing a trenchcoat. Sometimes people talk about it like it's a single problem: we have some goal in our heads, and we need to build an AI that actually pursues that goal. But then other people split it into outer alignment (getting the reward function or objective to capture what we actually want) and inner alignment (getting the model to really optimize that objective instead of some other thing it picked up, like a mesa-optimizer). And then there's reward hacking, specification gaming, scalable oversight, corrigibility, value loading... and I can't tell if these are all facets of one underlying problem or just a bunch of different problems that got lumped together because they all involve a powerful system doing something we didnt intend.

