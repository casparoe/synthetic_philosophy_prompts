answer: |-
  **Setting:** *A slightly draughty common room in a philosophy department in Oxford. It is late afternoon. Rain is beating against the leaded windows. Alex and Bryony are sitting in worn leather armchairs with mugs of tea.*

  **Alex:** I must say, Bryony, I found your defence of telic egalitarianism in the seminar rather brave. Most people in the literature have treated Parfit's leveling-down objection as something of a coup de grâce. To insist that there is a sense in which blinding the sighted is *good*, simply because it brings them down to the level of the blind, strikes me as a bullet so large it chokes the gun.

  **Bryony:** Brave, or perhaps just stubborn. But I don't think you've quite characterised the claim, Alex. The telic egalitarian need not say that leveling down is good *all things considered*. Obviously, it is worse all things considered if we blind the sighted without curing the blind. Total well-being plummets. The claim is merely that inequality is non-instrumentally bad. Therefore, removing inequality is good *in one respect*, even if it is bad in others.

  **Alex:** That is the standard Temkin move, isn't it? The 'all-things-considered' versus 'pro tanto' distinction. But does it really save the view? It feels like semantic salvage. If I ask you, 'Is this state of affairs better?', and you say, 'Well, it's better in the equality respect, but worse in the welfare respect, and overall it's worse,' you've conceded the practical point. The objection to leveling down is that it benefits *no one*. If a change benefits no one, how can it be better in any genuine moral respect?

  **Bryony:** Because morality isn't monolithic. We accept pluralism in other contexts. Suppose I promise to meet you for lunch, but on the way, I stop to help a stranger change a tyre. I break my promise to you. Have I acted wrongly? In one respect, yes, I've broken a promise. In another, no, I've helped someone in need. All things considered, I probably did the right thing. But we don't say the duty of fidelity simply vanished. Similarly, equality is a value. It can be outweighed, but it isn't extinguished.

  **Alex:** But the cases aren't analogous. In your lunch case, there is a beneficiary of the action—the stranger. In the leveling-down case, there is *no* beneficiary. The blind are not better off; the sighted are worse off. To say there is a 'respect' in which this is good implies that the universe is somehow improved by the destruction of well-being, provided it is distributed evenly. That smells of fetishism. It values a pattern over the people who constitute it.

  **Bryony:** And therein lies the rub. You prioritarians claim to value people, yet your view implies that if we have two groups, both extremely well-off, but one slightly more so, there is no intrinsic reason to reduce the gap. Imagine a society where the poorest have a very high quality of life—say, sufficient for flourishing—and the richest have absurd, unimaginable wealth. If the marginal utility of well-being has flattened for both groups, your prioritarianism says there is no moral reason to redistribute.

  **Alex:** I accept that. If everyone is above the threshold where additional resources make a significant difference to their life quality, why should the state coerce transfers?

  **Bryony:** Because it's unjust. It creates a hierarchy. It allows for relations of domination and servility, even if the 'servants' are comfortably fed. You're focusing entirely on the absolute level of the bottom, Alex. But egalitarianism is concerned with the *relation* between the top and the bottom. If the gap is vast, it corrupts the democratic ethos, regardless of whether the poor are destitute or merely comfortable.

  **Alex:** But now you're sliding into instrumentalism. You're arguing that inequality causes social friction or domination. That's an empirical claim, and a good one. But telic egalitarianism claims inequality is *intrinsically* bad. If you retreat to the social effects, you've abandoned the telic view for a pragmatic one. And if you stick to the intrinsic claim, you're back with leveling down. If the hierarchy is the problem, wouldn't eliminating the hierarchy by lowering the top still be good in that specific respect?

  **Bryony:** I'm not retreating. I'm saying the intrinsic badness of inequality is about the comparative standing. Yes, leveling down improves the equality respect. It remains counter-intuitive, I grant you. But is your alternative truly free of counter-intuitive implications? Let's press your prioritarianism. You hold that the moral value of a benefit is a concave function of absolute well-being.

  **Alex:** Correct. Benefiting the worse off matters more.

  **Bryony:** Consider the 'Non-Identity' style case. Suppose we have a choice between Policy A, which benefits a group at a very low absolute level, and Policy B, which benefits a different group at a slightly higher absolute level. Because the first group is worse off, the weighted value of their gain is higher. So you choose A. But suppose the gain to the second group in B is *massive*, and the gain to the first group in A is *trivial*. Prioritarianism can still demand we choose A, simply because of their absolute position, even if the total good produced is significantly less and the gap between groups widens.

  **Alex:** That is a known objection, certainly. But it doesn't rely on the absurdity of leveling down. It relies on a weighting function that prioritises urgency. Most people find it intuitive that we should save a drowning child before we provide a luxury to a healthy adult, even if the adult's pleasure is intense.

  **Bryony:** But what if the 'adult' is a community of millions, and the 'child' is a single individual? Prioritarianism can demand sacrifices from the many that seem disproportionate, simply because of the absolute baseline. It lacks a relational constraint. It treats society as a container of well-being units to be weighted, rather than a community of citizens among whom justice must hold.

  **Alex:** I think you're conflating prioritarianism with utilitarianism. We care about the distribution of the weighted well-being. But let's return to the leveling down. You say it's good in one respect. I ask: good for whom? If you cannot answer 'for someone', then in what sense is it a *moral* good? Morality is about how we treat persons. To say a situation is 'better' when no person is better off seems to detach value from human experience entirely.

  **Bryony:** That's a powerful intuition, Alex, but it assumes that all value must be anchored in individual experiential welfare. Why accept that? We might think that a world where people stand in relations of equality is a better world, even if the individuals within it don't necessarily feel the difference. It's an objective value about the structure of society.

  **Alex:** But if the individuals don't feel it, and their material conditions don't improve, it's hard to see what work the value is doing other than satisfying a metaphysical aesthetic. And this brings me to the deontic view. Surely, if you are worried about hierarchy and domination, you should be a deontic egalitarian. You argue that it is *unfair* for some to have less through no fault of their own. That avoids leveling down. We don't make things fair by blinding the sighted; we make them fair by curing the blind.

  **Bryony:** Ah, the deontic shift. It is popular, I know. But it has its own costs. Deontic egalitarianism focuses on unfairness in treatment or procedure. But what about natural inequalities? If one group is born with a genetic predisposition to illness, and another with robust health, and there is no human agent responsible for this, the deontic egalitarian struggles to say why we should redistribute resources to cure the illness, absent a prioritarian concern for well-being. Telic egalitarianism captures the intuition that it is bad for people to be unequal, regardless of whether a moral agent caused it.

  **Alex:** So you retain the telic view to cover natural misfortune?

  **Bryony:** Precisely. And to cover cases where the inequality is historical but the agents are dead. The deontic view requires a wrongdoer. The telic view just requires a gap that is unjustified.

  **Alex:** I see. But doesn't this suggest that what you really value is the alleviation of suffering, which prioritarianism handles, plus a concern for fairness which is agent-relative? The 'intrinsic badness of inequality' starts to look like a ghost. Many critics, including Parfit himself, suggested that prioritarianism captures everything that is plausible in egalitarianism without the implausible bits. It gives weight to the worse off—which satisfies the intuition to help the needy—without condemning inequality when it benefits the worst off.

  **Bryony:** Parfit argued that, yes. But there is a suspicion among some of us that prioritarianism is just egalitarianism in disguise. You use a concave function to weight the well-being of the worse off more heavily. But why? Usually, because we think they have *less* than others. If there were only one person in the universe, would prioritarianism apply?

  **Alex:** Yes. If Robinson Crusoe is in pain, relieving that pain matters more than adding a pleasure to his already blissful evening. The moral weight depends on his absolute level.

  **Bryony:** But without a comparison class, 'worse off' loses its meaning. You are implicitly comparing Crusoe to a hypothetical standard of flourishing. But in the two-person case, the urgency we feel to help the poorer person is often driven by the *gap*, not just the absolute level. If Crusoe has 10 units and Friday has 100, we feel a pull to help Crusoe. If Crusoe has 10 and Friday has 11, the pull is weaker. Prioritarianism explains this via the curve, but the curve is calibrated by our intuitions about relative deprivation. You're smuggling the relational concern in through the mathematics.

  **Alex:** That is a contested interpretation. The prioritarian says the curve is grounded in the diminishing moral importance of benefits as absolute well-being rises. It is not about the gap. If Friday's 100 units disappeared, leaving Crusoe at 10, the moral urgency of helping Crusoe remains the same for me. For you, the situation has improved significantly because inequality has vanished. That is the divergence.

  **Bryony:** And that is where our bedrock intuitions clash. You think the disappearance of Friday's wealth changes nothing morally regarding Crusoe's need. I think it changes the *justice* of the situation, even if Crusoe's physical need is identical.

  **Alex:** But to what end? If Crusoe's need is identical, the resource allocation should be identical. If you say we should tax Friday less because Crusoe is now 'equal' in a world where Friday is poor, you are prioritising the pattern over the person.

  **Bryony:** I'm not saying we should tax Friday less. I'm saying the *reason* we tax Friday is partly because of the gap. The gap itself constitutes a harm to the social fabric, to the status of Crusoe as a citizen. You reduce this to 'instrumental harm'. I am saying the status harm is non-instrumental.

  **Alex:** And I maintain that calling it 'non-instrumental' is a way of insulating the view from empirical refutation. If I show you that reducing the gap doesn't improve Crusoe's life, you say, 'Ah, but it improves the Equality.' It becomes unfalsifiable.

  **Bryony:** Moral values often are unfalsifiable in that sense. They are foundational. Look, Alex, perhaps we are at an impasse. You find the leveling-down implication so costly that you abandon the intrinsic value of equality. I find the 'rich/rich' implication of prioritarianism so costly—the idea that vast inequalities between comfortable groups matter not at all—that I am willing to bite the bullet on leveling down, or at least accept it as a tragic trade-off.

  **Alex:** I suppose that is the state of the literature. We agree on almost all policy prescriptions. We both want to help the poor. We both want to reduce vast disparities. We disagree on the *reason*, and on the limit cases.

  **Bryony:** And on whether the reason matters. If the reason is equality, we protect the vulnerable against the arrogance of the powerful. If the reason is priority, we protect the vulnerable against neglect.

  **Alex:** But the arrogance of the powerful is an instrumental bad.

  **Bryony:** Is it? Or is it the manifestation of the inequality itself?

  **Alex:** *Sips tea.* I don't think I can convince you that the 'equality respect' is a phantom.

  **Bryony:** And I don't think I can convince you that a world without gaps is better, even if the gaps are removed by lowering the peaks.

  **Alex:** No. But at least we agree that blinding the sighted is, all things considered, a dreadful idea.

  **Bryony:** On that, we are united. Though I maintain it would be a *more* dreadful idea if the sighted remained sighted and the blind remained blind, than if we cured the blind.

  **Alex:** *Laughs.* I suppose I'll have to settle for that.

  **Bryony:** Progress, Alex. In philosophy, as in distributive justice, we rarely get everything we want. We just hope the marginal gain in understanding is weighted towards the places where we were most ignorant.

  **Alex:** A prioritarian sentiment if ever I heard one.

  **Bryony:** Or perhaps just a pragmatic one. Shall we get dinner? I believe the queue is equally long for everyone, regardless of status.

  **Alex:** Lead on.
