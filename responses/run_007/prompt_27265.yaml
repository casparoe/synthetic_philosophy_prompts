      *   **User Profile:** Participating in a reading group/seminar on astrobiology and the Fermi Paradox (6 weeks in). Clearly well-read (cites Hart, Tipler, Sagan, Drake, Bostrom, Hanson, Ball, Ćirković). Frustrated with the lack of progress ("rearranging deck chairs").
      *   **Core Question:** What *kind* of disagreement is the Fermi Paradox debate? (Underdetermination? Priors? Verbal dispute? Rorschach test?)
