answer: |-
  As a philosopher specializing in social ontology, I find your set of intuitions remarkably coherent. They align closely with a realist-inclined form of social constructionism, similar to the frameworks developed by John Searle (Institutional Facts), Ian Hacking (Interactive Kinds), and Sally Haslanger (Social Meanings), but with a specific commitment to biomedical and natural kind realism.

  To systematize your verdicts, we need a principle that distinguishes between *what exists* (ontology) and *how we carve it up* (taxonomy), while acknowledging that some things only exist *because* we carve them up.

  Here is the candidate principle derived from your intuitions, followed by an analysis of your specific tensions and the application to new cases.

  ### The Candidate Principle: Essential Social Dependence

  > **A kind $K$ is socially constructed if and only if the conditions for membership in $K$ essentially depend on human collective intentionality, convention, or assigned function.**
  >
  > *   **Thick Construction (Ontological):** The entity *itself* cannot exist without the social facts. (e.g., Money, Citizenship).
  > *   **Thin Construction (Taxonomic/Functional):** The physical/biological entity exists independently, but its *classification* as $K$ depends on human conventions or assigned functions. (e.g., Chairs, Planets).
  > *   **Not Constructed:** Membership in $K$ is determined solely by mind-independent physical, biological, or abstract properties. (e.g., Gold, Tigers, Schizophrenia).

  ---

  ### 1. Resolving the Tensions

  #### The Chair vs. Schizophrenia Problem
  You asked how a physical object (chair) can be constructed while a mental phenomenon (schizophrenia) is not. Under the **Essential Social Dependence** principle, the distinction lies in **Assigned Function vs. Intrinsic Causal Power**.

  *   **Chairs:** A specific arrangement of wood and atoms only becomes a "chair" because humans *assign* it the function of sitting. Without human intentions, it is just matter. Its "chair-ness" is extrinsic.
  *   **Schizophrenia:** Your intuition treats this as a **Biomedical Realist** case. You view the neurophysiological dysfunction and the resulting suffering as having *intrinsic causal powers* that operate regardless of whether we have a name for them. While the *label* "schizophrenia" is human, the *condition* (the pattern of dysfunction) is discovered, not invented.
  *   **Resolution:** The principle holds. Chairs are constructed because their defining feature (function) is imposed by us. Schizophrenia (on your view) is not constructed because its defining feature (pathology) is inherent to the organism.

  #### The Planet Case and Thin Construction
  Your ambivalence about planets is the key to unlocking the **Thin vs. Thick** distinction.
  *   **The Verdict:** Planets are **Thinly Constructed**.
  *   **Why:** The rock itself is mind-independent (like gold). However, the *boundary* of the category "planet" is a matter of convention (the IAU vote). If humans vanished, the rock would remain, but it would no longer be a "planet" because "planet" is a classificatory schema we use to organize the solar system.
  *   **Implication:** This tells us your principle must separate **Ontological Dependence** (does the thing need us to exist?) from **Taxonomic Dependence** (does the *label* need us to apply it?).
      *   **Money:** Ontologically dependent (Thick).
      *   **Planets/Chairs:** Taxonomically/Functionally dependent (Thin).
      *   **Gold/Tigers:** Independent (Not Constructed).

  #### Thin vs. Thick Distinction
  Your principle distinguishes these as follows:
  1.  **Thick (Institutional):** The social fact *constitutes* the object. $X$ counts as $Y$ only in virtue of collective acceptance. (Money, Citizenship, Race).
  2.  **Thin (Functional/Classificatory):** The object exists independently, but falls under $K$ only in virtue of human interest or convention. (Chairs, Planets).

  ---

  ### 2. Testing the Principle Against Your Cases

  | Case | Verdict | Application of Principle |
  | :--- | :--- | :--- |
  | **Dollar Bills** | **Constructed (Thick)** | Membership depends entirely on collective acceptance. Without us treating it as money, it is ontologically just paper. |
  | **Gold Atoms** | **Not Constructed** | Atomic number 79 is mind-independent. No convention required. |
  | **U.S. Citizen** | **Constructed (Thick)** | Legal status exists only within a framework of laws (collective intentionality). |
  | **Tigers** | **Not Constructed** | Biological lineage exists independently of human classification. |
  | **Being Black (US)** | **Constructed (Thick)** | Your intuition aligns with Haslanger: the category is defined by social history and oppression, not genetic boundaries. It is an institutional fact about social positioning. |
  | **Schizophrenia** | **Not Constructed** | *Crucial Nuance:* The principle forces you to clarify that you mean the *pathology* is not constructed. The *DSM diagnosis* might be thinly constructed (boundaries), but the *suffering/dysfunction* is brute. |
  | **Chairs** | **Constructed (Thin)** | Defined by assigned human function. A rock becomes a chair if we sit on it; the physical structure is secondary to the intent. |
  | **Planets** | **Constructed (Thin)** | Physical object is brute; the category boundary is conventional (IAU). |

  **Required Revision:**
  To maintain consistency, you must accept a nuance on **Schizophrenia**. If "Being a Planet" is thinly constructed because the *boundary* is conventional, you must admit that the *diagnostic boundary* of Schizophrenia is also thinly constructed (e.g., how many symptoms constitute the disorder?).
  *   *Revision:* You can maintain that the **underlying condition** is not constructed, but the **kind 'Schizophrenia'** (as a specific diagnostic category) is thinly constructed. If you insist the *kind itself* is not constructed at all, you are committing to a strong Natural Kind Realism that treats psychiatric categories exactly like Tiger species. This is philosophically tenable but controversial.

  ---

  ### 3. Application to New Cases

  Here is how the **Essential Social Dependence Principle** applies to your three new test cases.

  #### Case A: Being a Prime Number
  *   **Analysis:** Prime numbers are abstract objects. Their properties (divisibility only by 1 and themselves) do not depend on human conventions, laws, or functions. We *discover* primes; we do not *legislate* them.
  *   **Verdict:** **Not Socially Constructed.**
  *   **Reasoning:** Mind-independent abstract structure. Even if humans never existed, 7 would still be prime.

  #### Case B: Being a War Criminal
  *   **Analysis:** This status requires specific laws of war, a context of conflict, and a tribunal or social recognition of the violation. Like "U.S. Citizen," this is an institutional status.
  *   **Verdict:** **Socially Constructed (Thick).**
  *   **Reasoning:** Ontologically dependent. Without the social/legal framework of "war crimes," the *status* of being a war criminal cannot exist, even if the violent acts themselves (brute facts) do.

  #### Case C: Being a Species (The Rank)
  *   **Analysis:** This is tricky and mirrors the **Planet** case.
      *   *The Lineage:* The actual population of organisms breeding together is mind-independent (like the Tiger).
      *   *The Rank:* The concept of "species" as a specific level of taxonomy is a human tool for organizing biology. Some biologists argue species are real individuals; others argue "species" is a conventional rank.
  *   **Verdict:** **Socially Constructed (Thin).**
  *   **Reasoning:** While particular species (tigers) are real, the *category rank* "species" is part of our Linnaean taxonomy. Nature presents us with populations and clades; we draw the lines and assign the rank "species" based on convention (e.g., the Biological Species Concept vs. Phylogenetic Species Concept).
  *   *Note:* This distinguishes "Being a Tiger" (Not Constructed) from "Being a Species" (Thinly Constructed). The tiger exists; the *slot* it fills in our taxonomy is the constructed part.

  ### Summary of Your Philosophical Position

  Based on these verdicts, you are a **Selective Realist about Social Construction**.

  1.  **You are an Institutional Realist:** You accept that laws, money, and social statuses (Race, Citizenship) are real but constructed by us.
  2.  **You are a Natural Kind Realist:** You believe biology and physics carve nature at its joints (Tigers, Gold, Schizophrenia).
  3.  **You accept Functional Construction:** You acknowledge that artifacts and scientific classifications (Chairs, Planets) depend on human interests, even if the underlying stuff does not.

  Your principle is robust. The only friction point remains the precise boundary of psychiatric kinds, where the "suffering" (brute) and the "diagnosis" (conventional) intertwine. If you can maintain that distinction, your ontology is consistent.
