prompt: |-
  You are a philosopher specializing in metaphysics and social ontology, with particular expertise on the literature on social construction. Please think carefully and work through the following step by step.

  I'm trying to figure out what I actually think about social construction, starting from my gut reactions to specific cases. Here are my verdicts:

  - Dollar bills are socially constructed. If everyone stopped treating them as money, they'd just be paper.
  - Gold atoms are not socially constructed. Even if humans had never existed, gold atoms would still be gold atoms.
  - Being a U.S. citizen is socially constructed. The category exists entirely because of laws and conventions.
  - Tigers are not socially constructed. The species existed before humans classified it and would survive our extinction.
  - Being Black in the contemporary United States is socially constructed. The boundaries of the category are a product of a particular social history, not biology.
  - Having schizophrenia is not socially constructed. The condition involves a real pattern of suffering and dysfunction that we discover, not invent.
  - Being a chair is socially constructed. Whether something is a chair depends on the function humans assign to it, not just its physical structure.
  - Being a planet is… I'm torn. On the one hand, planets are physical objects. On the other, the IAU voted to demote Pluto, and "planet" is our category. I lean toward saying it's socially constructed in a thin sense but not in the same way money is.

  I want a principle that captures these verdicts — one that tells me, for any kind K, whether K is socially constructed and, if so, in what sense. I'm especially stuck on three things:

  First, my verdicts on chairs and schizophrenia seem to pull in opposite directions. Chairs are physical objects, yet I called them socially constructed; schizophrenia is a mental phenomenon, yet I called it not socially constructed. Is there a single principle that gets both, or do I need to revise one of these verdicts?

  Second, what should I say about the planet case, and what does that tell me about the principle?

  Third, does the principle distinguish between "thin" and "thick" social construction — the way money seems constructed all the way down while planets seem only constructed at the boundary? If so, how exactly?

  Please state the best candidate principle, show how it handles each case, flag any of my verdicts it forces me to give up, and then apply it to a few cases I haven't listed: being a prime number, being a war criminal, and being a species (as opposed to a particular species like tiger).
