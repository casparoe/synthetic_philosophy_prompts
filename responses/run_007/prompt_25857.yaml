answer: |-
  Agreed Claims

  1.  Physicalism, for the purposes of this debate, is defined as the thesis that once all physical facts are fixed, all phenomenal facts are necessarily fixed.
  2.  A philosophical zombie (p-zombie) is defined as a being physically identical to a conscious human being that lacks any subjective phenomenal experience.
  3.  If p-zombies are metaphysically possible, then physicalism as defined in Claim 1 is false.
  4.  The primary evidence offered for the metaphysical possibility of p-zombies is their conceivability.
  5.  "Ideal conceivability" requires that the scenario contains no contradiction, even upon unlimited a priori reasoning and full knowledge of the concepts involved.
  6.  Both parties agree there is an *epistemic* gap: one cannot currently deduce phenomenal truths from physical truths using current human cognitive faculties.
  7.  Both parties agree that if the concept of a p-zombie contains a hidden contradiction (like "married bachelor"), it is not ideally conceivable and the argument fails.

  Disagreements

  | Precise Sub-Question | Physicalist Answer (My Side) | Dualist Answer (Partner's Side) | Suspected Verbal Dispute? |
  | :--- | :--- | :--- | :--- |
  | **1. Does the statement "P & ~Q" (Physical facts hold & Consciousness does not) describe a genuinely coherent state of affairs?** | No. It appears coherent only because we lack the cognitive capacity to see that consciousness is logically necessitated by the physical facts. | Yes. It describes a genuinely coherent state of affairs because there is no logical contradiction in separating the physical structure from the experience. | **Yes.** Physicalist means "coherent given full metaphysical knowledge"; Dualist means "coherent given current conceptual analysis." |
  | **2. Does ideal conceivability entail metaphysical possibility for phenomenal truths?** | No. Phenomenal concepts are unique (e.g., indexical or recognitional) and block the entailment from conceivability to possibility. | Yes. The principle that ideal conceivability entails metaphysical possibility is universal and applies to phenomenal truths without exception. | **No.** This is a substantive metaphysical disagreement about the rules of modal epistemology. |
  | **3. What is the best explanation for the persistent intuition that zombies are possible?** | It is a cognitive illusion caused by the distinct way we grasp phenomenal concepts compared to physical concepts. | It is a veridical intuition revealing that consciousness is a distinct ontological property not captured by physical description. | **Yes.** Physicalist labels it "illusion" (error theory); Dualist labels it "insight" (realist theory). |

  Cruxes

  1.  **The Phenomenal Concept Strategy**
      *   **Scenario/Reasoning:** We analyze whether phenomenal concepts function like indexicals (e.g., "here," "now") or demonstratives. If consciousness is physical, but our *concept* of it is direct and indexical, we might conceive of a gap where none exists.
      *   **Physicalist Prediction:** If we accept that phenomenal concepts are indexical, the zombie intuition dissolves, and I win the debate.
      *   **Dualist Prediction:** Even if concepts are indexical, the referent (the experience itself) could still be non-physical; fixing the concept doesn't fix the ontology, so they maintain their position.

  2.  **The Historical Identity Analogy**
      *   **Scenario/Reasoning:** We compare the consciousness/brain gap to the historical gap between "heat" and "molecular motion." Before science, it seemed conceivable that heat existed without molecular motion.
      *   **Physicalist Prediction:** This case shows that strong conceivability intuitions can be false despite feeling obvious; therefore, the zombie intuition is likely similarly mistaken.
      *   **Dualist Prediction:** The heat case involved contingent identities (heat is felt via sensation), whereas consciousness is intrinsic; therefore, the analogy fails and the zombie intuition remains reliable.
