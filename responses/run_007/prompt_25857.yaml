prompt: |-
  Ok so my department's running this workshop where they pair you up with someone who disagrees with you and you have to produce an "adversarial collaboration" document — the kind where you first list everything you can both sign, then nail down exactly where you part ways, in wording each side would stand behind. I got paired with someone who's basically sold on the zombie conceivability argument: p-zombies are conceivable, ideal conceivability entails metaphysical possibility, so physicalism about consciousness is false. I'm on the other side — I think the zombie idea doesnt fully cash out once you press on it, that the argument's got a subtle flaw even if I can't pinpoint exactly which step fails. We're both undergrads who've read Chalmers and some of the back-and-forth, but neither of us is settled on the finer points of two-dimensional semantics or anything like that; we just keep going in circles where I say "you haven't really conceived it, you've just labeled it" and they say "but I can conceive it perfectly clearly."

  I need you to draft the actual document we'd produce — the one we could print out and sign at the end, not a description of how to write it.

  Structure it like this:

  - A section called "Agreed Claims" with exactly seven numbered claims we both accept. These should be about the setup of the zombie scenario, what physicalism minimally requires, the logical anatomy of the argument, and what would follow if zombies were metaphysically possible. Make them substantive — not "we both agree some philosophers have discussed this" — but the kind of thing that forces each of us to concede real ground.

  - A section called "Disagreements" as a table with exactly three rows, each row having: the precise sub-question, my side's answer (phrased so I, the physicalist, would nod along), their side's answer (phrased so they'd endorse it), and a column noting whether either of us suspects the disagreement might be partly verbal. If verbal, say what the two readings might be and who intends which.

  - A section called "Cruxes" with exactly two cruxes. A crux is a sub-question such that settling it would make at least one of us revise our overall position. For each, describe a concrete scenario or piece of reasoning we'd both accept as bearing on it, and state what each side predicts.

  Don't include an intro paragraph or a "here you go." Just start with "Agreed Claims" and deliver the document. No fluff.
