answer: |-
  (1) The procedure, step by step, with explicit stop conditions

  1.  **Define the Evidence Partition:** Identify the specific proposition $E$ the report addresses (e.g., "Building X is the facility"). Define the binary partition $\{E, \text{not-}E\}$. *Judgment Call:* Ensure $E$ is distinct from the final hypothesis $H$ (e.g., "Threat is imminent"). If the report directly claims $H$, stop; Jeffrey Conditionalization (JC) requires intermediate evidence.
  2.  **Verify Rigidity:** Ask: "If we knew $E$ was true with certainty, would our belief in $H$ change differently than it does now?" If the report changes *how* $E$ relates to $H$ (e.g., source credibility depends on $H$), stop. *Judgment Call:* Assess if the link between $E$ and $H$ is stable regardless of the report's uncertainty.
  3.  **Extract Input Distribution:** Interpret the reported number (e.g., 0.65). Is this $P_{new}(E)$ (probability $E$ is true) or $P(\text{Report}|E)$ (likelihood)? If it is a likelihood, abandon JC. Use ordinary conditioning on the fact the report was made. *Judgment Call:* Distinguish confidence in fact vs. reliability of sensor. If the source says "70% sure," do they mean $P(E)=0.7$ or "I am right 70% of the time"?
  4.  **Sequential Check:** If a prior report exists, does it address the same partition? If yes, JC is order-independent. If different partitions, check for dependency. If dependent, stop. *Judgment Call:* Determine if knowing Report A changes the weight of Report B.
  5.  **Compute or Escalate:** If Steps 1-4 pass, calculate $P_{new}(H) = P_{old}(H|E)P_{new}(E) + P_{old}(H|\text{not-}E)P_{new}(\text{not-}E)$. Record inputs ($P_{old}$, $P_{new}(E)$) and output. If any step failed, escalate to senior reviewer for manual weighting. Document the specific failure point for the audit trail.

  (2) What each step is doing, tying the steps to the elements of Jeffrey conditionalization and flagging which steps are judgment calls

  Step 1 establishes the domain of uncertainty. JC requires a partition where probabilities shift without certainty. This is a judgment call because analysts must decide if the model's output is evidence ($E$) or a conclusion ($H$). Misclassifying a conclusion as evidence bypasses necessary scrutiny. Step 2 tests the core axiom of JC: Rigidity. It assumes the conditional probabilities $P(H|E)$ remain constant while $P(E)$ shifts. This is a judgment call because human sources often introduce bias that correlates with $H$, violating rigidity. If the source lies more when the threat is real, $P(H|E)$ is not rigid. Step 3 prevents category errors. Analysts often treat reliability metrics as probabilities of truth. JC requires $P_{new}(E)$, not likelihoods. Misidentification here invalidates the math, turning a probability update into a double-counting error. Step 4 addresses commutativity. JC is order-independent only for identical partitions under rigidity. Different partitions require care. If partitions overlap, sequential updating approximates a joint distribution that may not exist. Step 5 is the arithmetic execution. The audit trail requires logging the $P_{old}$ used, the $P_{new}(E)$ extracted, and the rigidity justification. This separates mathematical updates from epistemic judgments, ensuring reviewers see where the numbers came from versus where the logic was applied.

  (3) Two worked examples: a geospatial model assigning 0.65 that the building is the facility, and a human source's "70 percent confident the meeting occurred," with at least one example in which the procedure gives an answer the team will not like

  **Case A: Geospatial Model.** Report: "0.65 probability Building A is the facility."
  1.  **Partition:** $E$ = "Building A is facility."
  2.  **Rigidity:** Plausible. The physical relationship between the building and threat activity doesn't change because the model spoke. The model is a passive observer.
  3.  **Input:** Treat 0.65 as $P_{new}(E)$.
  4.  **Calculation:** Assume prior $P_{old}(H|E) = 0.9$ (if facility, high threat) and $P_{old}(H|\text{not-}E) = 0.1$. Then $P_{new}(H) = 0.9(0.65) + 0.1(0.35) = 0.585 + 0.035 = 0.62$.
  **Case B: Human Source.** Report: "70% confident meeting occurred."
  1.  **Partition:** $E$ = "Meeting occurred."
  2.  **Rigidity Check:** *Fail.* The source's confidence often depends on their access, which depends on the hypothesis (e.g., if there is no threat, they have no access).
  3.  **Input Interpretation:** "70% confident" is often $P(\text{Source says Yes} | \text{Meeting})$, not $P(\text{Meeting})$.
  4.  **Decision:** **Stop JC.** Switch to ordinary conditioning on the event "Source reported meeting." You need the source's false-positive rate, not their confidence.
  *Unliked Answer:* The team wants to plug 0.70 into JC to get a clean number. The procedure forces them to admit they lack the source's reliability stats (base rate of lying), halting the update. This prevents false precision and forces a request for more intel rather than baking uncertainty into a flawed formula. The audit trail will show "Rigidity Violation" as the reason for no output.

  (4) Where the procedure breaks, including cases where rigidity cannot be assumed and the order-of-reports problem

  The procedure breaks when Rigidity fails. This happens when the evidence source is influenced by the hypothesis itself (e.g., a sensor that only activates if the threat is high). Here, learning the report changes $P(H|E)$, violating JC. You must condition on the report existence, not the content.
  The order-of-reports problem arises when two reports address different partitions (e.g., one on location, one on timing) that are not probabilistically independent. JC does not guarantee order independence across different partitions. If Report A shifts probabilities on Partition 1, it may alter the baseline for Report B on Partition 2. If analysts process them in reverse order, they may get different results. The procedure mandates stopping if partitions interact, forcing a joint assessment rather than sequential updating. This prevents the "ping-ponging" of probabilities where the same evidence is weighed twice under different guises. It requires the senior reviewer to construct a unified probability space rather than chaining updates.

  (5) What the procedure cannot do, stated honestly

  This procedure cannot generate reliability data where none exists. It cannot resolve conflicts between two equally credible sources without external arbitration. It cannot account for strategic deception where an adversary manipulates the probability inputs themselves. Finally, it cannot replace the senior reviewer's responsibility; it only structures their input. If the rigidity condition is dubious, the procedure outputs "Unknown," not a number. It protects against bad math, not bad intelligence. It is a filter, not an engine. It also cannot compensate for time pressure; if the rigidity check takes too long, the procedure dictates escalation, which may delay the assessment. It prioritizes accuracy over speed when the math is unsafe.
