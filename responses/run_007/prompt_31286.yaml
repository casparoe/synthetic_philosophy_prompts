  2.  **Deconstruct Jeffrey Conditionalization (JC):**
      *   Standard Bayesian Conditioning: $P_{new}(H) = P_{old}(H|E) = \frac{P_{old}(E|H)P_{old}(H)}{P_{old}(E)}$. Requires $P_{new}(E) = 1$ (certainty about evidence).
      *   Jeffrey Conditionalization: $P_{new}(H) = \sum_i P_{old}(H|E_i) P_{new}(E_i)$. Used when evidence $E$ is uncertain (probabilistic).
      *   Key Condition: *Rigidity* (or Sufficiency). $P_{new}(H|E_i) = P_{old}(H|E_i)$. The impact of $E_i$ on $H$ doesn't change, only the probability of $E_i$ changes.
      *   Input: A partition $\{E_i\}$ and new probabilities for them $\{P_{new}(E_i)\}$.
      *   Output: Updated probabilities for hypotheses $\{H\}$.

