answer: |-
  The transatlantic regulatory divide you describe is indeed a clash of decision theories disguised as a technical dispute over toxicology. To reconstruct the implicit theory of the EU's precautionary stance, we must look beyond the slogan "better safe than sorry" and examine the structural commitments required to make that slogan operational in law.

  ### The Implicit Theory of Decision Under Uncertainty

  **1. The Asymmetry of Error Costs**
  At the heart of the REACH regime is a specific valuation of error types. In statistical decision theory, a Type I error (false positive) is rejecting a safe substance; a Type II error (false negative) is approving a harmful one. The US model (post-TSCA) attempts to minimize the sum of both errors weighted by their economic and health costs. The EU model presupposes that the cost of a Type II error is *lexically superior* to the cost of a Type I error. It is not merely that health is worth more than money; it is that the moral disutility of inflicting unconsented biological harm cannot be traded off against economic efficiency or even potential health benefits (e.g., a cheaper drug with unknown side effects). For the practice to be coherent, one must accept that some categories of risk are non-compensable.

  **2. Epistemic Burden and the Presumption of Risk**
  The regime operates on a reversal of the liberal presumption of liberty. In classical liberal theory, action is permitted unless prohibited. Under the precautionary principle, novel chemical interventions are prohibited unless permitted. This presupposes that the *status quo ante* (the absence of the synthetic substance) is the normative baseline of safety. This is not a neutral scientific stance; it is a metaphysical claim that "natural" or "pre-existing" exposure levels are morally privileged over "novel" exposure levels. The theory requires that uncertainty be mapped onto the innovator, not the public. If the map is blank, the territory is assumed hostile.

  **3. Decision Rule: Constrained Optimization vs. Maximin**
  Does this require Maximin reasoning (maximizing the minimum possible outcome)? Strictly speaking, no. A pure Maximin rule would paralyze all industrial activity, as there is always a non-zero probability of catastrophe. The EU practice is more compatible with a **Constrained Expected Utility** model. In this framework, you may maximize utility (economic benefit), *subject to* a hard constraint that the probability of catastrophic harm remains below a de minimis threshold, regardless of the upside. However, when data is "inconclusive," the probability distribution is treated as unbounded or heavy-tailed. In this specific epistemic condition, the regime behaves *as if* it were Maximin, because the expected disutility of the worst-case scenario swamps any calculable benefit.

  **4. The Financial/Digital Tension**
  You note the disparity between chemical strictness and financial/digital permissiveness. Is this incoherent? A principled defense exists within the theory's own logic, though it is fragile. The precautionary principle in the EU is implicitly tied to **bodily integrity and irreversibility**. Chemical exposure is often involuntary, bio-accumulative, and intergenerational. Financial losses, while devastating, are theoretically compensable and monetary. Digital infrastructure, until recently, was viewed as informational rather than physical.
  However, the tension arises because systemic financial collapse causes physical harm (suicide, loss of healthcare), and algorithmic decision-making creates involuntary, opaque risks similar to toxic exposure. If the core presupposition is "protection from involuntary, uncertain harm," the exclusion of fintech and AI suggests the theory is not universal but **domain-specific**, rooted in a materialist conception of harm (molecules in bodies) rather than a structural one (systemic risk).

