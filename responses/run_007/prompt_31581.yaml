answer: |-
  # Part I: The Logical Space of the Instrument

  Before administering the quiz, it is useful to understand the theoretical axes upon which the questions are built. These positions do not differ randomly; they diverge along specific fault lines regarding what counts as a benefit, how much responsibility agents bear, and when equality is measured.

  **The Four Axes of Disagreement**

  1.  **The Metric (Currency):** Is the thing we care about distributing a mental state (**Welfare**), a bundle of external means (**Resources**), or the effective freedom to achieve states of being (**Capabilities**)?
  2.  **Responsibility (Choice vs. Circumstance):** Should society compensate for all disadvantages, or only those for which the individual is not responsible? This distinguishes **Strict Egalitarianism** (compensate all) from **Luck Egalitarianism** (compensate brute luck, not option luck).
  3.  **Timing (Ex Ante vs. Ex Post):** Do we equalize the *opportunities* people have at the start, or the *outcomes* they end up with?
  4.  **Adaptation (Preference Reliability):** Should we take people's reported satisfaction at face value, or correct for preferences adapted to oppression (the "Happy Slave" problem)?

  **Mapping the Target Positions**

  *   **Subjective Welfare Egalitarianism:** Metric = Mental State. Responsibility = Low (compensate dissatisfaction even if chosen). Ex Post.
  *   **Dworkinian Equality of Resources:** Metric = External Resources (adjusted by hypothetical insurance). Responsibility = High (no compensation for chosen tastes). Ex Ante (insurance scheme).
  *   **Sen-Style Capability Egalitarianism:** Metric = Functionings/Capabilities. Responsibility = Mixed (focus on freedom). Highly sensitive to conversion factors and adaptive preferences.
  *   **Arneson/Cohen (Opportunity/Access):** Metric = Welfare/Advantage. Responsibility = High (equalize opportunity, not outcome). Ex Ante.
  *   **Sufficientarianism:** Metric = Variable. Focus = Threshold (enough is enough), not relative equality.

  ***

  # Part II: The Quiz

  **Title:** Which Currency of Egalitarian Justice Do You Actually Hold?
  **Instructions:** Read each case carefully. There are no "correct" answers. Select the option that best matches your intuitive judgment about what justice requires in that specific situation.

  **1. The Connoisseur and the Beer Drinker**
  Two citizens receive an identical income stipend from the state. Citizen A is easily satisfied and enjoys cheap beer. Citizen B has developed a refined, expensive taste for rare vintage wine and finds cheap beer repulsive. Citizen B is significantly less happy than Citizen A.
  *   **A.** Justice is satisfied; they had equal money, and tastes are personal responsibilities.
  *   **B.** Justice requires transferring more money to Citizen B until their levels of satisfaction are equal.
  *   **C.** Justice requires ensuring both have the *opportunity* to be satisfied, but not guaranteeing the result.

  **2. The Wheelchair User**
  Two citizens have identical mobility needs in a standard environment. However, Citizen A walks, while Citizen B uses a wheelchair. The city has stairs but no ramps. Both receive the same income.
  *   **A.** This is just; they have equal financial resources to spend as they wish.
  *   **B.** This is unjust; Citizen B needs additional resources (for ramps or transport) to achieve the same freedom of movement.
  *   **C.** This is unjust only if Citizen B is unhappy about their lack of movement.

  **3. The Happy Oppressed Worker**
  Citizen A works in a demeaning, restrictive job but reports being perfectly content, having never known anything else. Citizen B works in a free, creative job and is equally content.
  *   **A.** There is no injustice here; both report equal satisfaction.
  *   **B.** There is a clear injustice; Citizen A is deprived of capabilities they should have, regardless of their contentment.
  *   **C.** There is an injustice only if Citizen A was forced into the job against their will.

  **4. The Gambler and the Victim**
  Citizen A loses their savings in a voluntary, high-risk casino gamble. Citizen B loses their savings due to a freak theft. Both are now destitute.
  *   **A.** Society should aid both equally; destitution is the injustice, regardless of cause.
  *   **B.** Society should aid Citizen B only; Citizen A assumed the risk and must bear the cost.
  *   **C.** Society should aid neither; property loss is a private matter.

  **5. The Threshold**
  In a society, every citizen has enough food, shelter, and healthcare to live a dignified, flourishing life. However, the richest citizen has 1,000 times more wealth than the poorest.
  *   **A.** This is unjust; the gap itself is objectionable even if everyone is well-off.
  *   **B.** This is just; everyone has "enough," so inequality above the threshold does not matter.
  *   **C.** This is unjust; such gaps will inevitably lead to unequal political power.

  **6. The Metabolic Difference**
  Two citizens receive identical food rations. Citizen A has a standard metabolism. Citizen B has a medical condition requiring double the calories to maintain the same health level.
  *   **A.** Justice is satisfied; the distribution of food was equal.
  *   **B.** Justice requires giving Citizen B double the rations to equalize their health outcomes.
  *   **C.** Justice requires giving Citizen B the *option* to claim more food, but not automatically.

  **7. The Voluntary Surfer**
  Citizen A works hard at a difficult job. Citizen B is physically capable of working but prefers to surf all day and lives in poverty as a result.
  *   **A.** Justice requires taxing Citizen A to support Citizen B's basic needs.
  *   **B.** Justice does not require support; Citizen B chose leisure over labor.
  *   **C.** Justice requires support only if surfing contributes to social culture.

  **8. The Natural Talent**
  Citizen A can produce valuable goods very quickly due to a rare, innate genetic talent. Citizen B works just as hard but produces less due to average genetics.
  *   **A.** Citizen A should keep all the extra value their talent creates; it is part of their self-ownership.
  *   **B.** The value of the talent is morally arbitrary; it should be taxed to benefit Citizen B.
  *   **C.** Citizen A should keep the value, but only after paying for a social insurance scheme against lacking talent.

  ***

  # Part III: Scoring and Interpretation Key

  **For the Facilitator:**
  This key maps answer patterns to philosophical positions. It is designed to be rigorous enough for professional critique while remaining accessible. Respondents will rarely score 100% into one category; look for the dominant cluster.

  ### Scoring Logic
  Tally the responses. While not a strict point system, the following clusters indicate specific theoretical commitments.

  *   **Mostly 1B, 3A, 4A:** *Subjective Welfare Egalitarianism.*
  *   **Mostly 1A, 2B, 4B, 7B, 8C:** *Dworkinian Equality of Resources.*
  *   **Mostly 2B, 3B, 6B:** *Sen-Style Capability Egalitarianism.*
  *   **Mostly 1C, 4B, 7B, 8B:** *Arneson/Cohen (Equal Opportunity for Welfare/Access to Advantage).*
  *   **Mostly 5B:** *Sufficientarianism.*

  ### Detailed Position Profiles

  #### 1. Subjective Welfare Egalitarianism
  *   **Core Intuition:** The only thing that ultimately matters is how people feel. Inequality of satisfaction is the fundamental injustice.
  *   **Key Markers:** Q1(B), Q3(A), Q4(A).
  *   **Philosophical Diagnosis:** This view treats preferences as sovereign. It fails the "Expensive Tastes" objection (Dworkin) and the "Happy Slave" objection (Sen/Nussbaum). It is largely undefended in contemporary literature because it incentivizes cultivating dissatisfaction to claim more resources.
  *   **Unnamed Leaf Warning:** If a respondent chooses Q1(B) *and* Q7(B), they hold an incoherent position (compensating tastes but ignoring thresholds). This suggests a confusion between *outcome* equality and *sufficiency*.

  #### 2. Dworkinian Equality of Resources
  *   **Core Intuition:** Justice is about distributing external means fairly, accounting for unchosen disadvantages via a hypothetical insurance market, but holding people responsible for their choices.
  *   **Key Markers:** Q1(A), Q2(B), Q4(B), Q7(B), Q8(C).
  *   **Philosophical Diagnosis:** Dworkin separates "person" from "circumstance." Disabilities are compensated (via Q2) because they are unchosen endowments. Expensive tastes are not (Q1) because they are part of the person.
  *   **Separation Difficulty:** Hard to distinguish from Arneson on Q4 and Q7. The key differentiator is Q2 and Q8: Dworkin focuses on *resources* (insurance payout) rather than *welfare* or *functioning* directly.

  #### 3. Sen-Style Capability Egalitarianism
  *   **Core Intuition:** Resources are merely means; the end is freedom (capability) to achieve functionings. We must account for human diversity in converting resources to function.
  *   **Key Markers:** Q2(B), Q3(B), Q6(B).
  *   **Philosophical Diagnosis:** Sen is distinct on the "Adaptive Preferences" question (Q3). Unlike Welfare Egalitarians, Sen argues the Happy Slave is deprived. Unlike Dworkin, Sen focuses on the *freedom to move* rather than the *money for the ramp*.
  *   **Unnamed Leaf Warning:** If a respondent chooses Q3(B) but Q6(A), they hold a "Paternalistic Resource" view (you are deprived, but we won't give you the means to fix it). This is generally considered incoherent in egalitarian theory.

  #### 4. Arneson / Cohen (Opportunity for Welfare / Access to Advantage)
  *   **Core Intuition:** Egalitarianism should equalize the *opportunity* to be well off, not the outcome. If you have equal options and choose poorly, that is your responsibility.
  *   **Key Markers:** Q1(C), Q4(B), Q7(B), Q8(B).
  *   **Philosophical Diagnosis:** This is "Luck Egalitarianism." It agrees with Welfare Egalitarianism that welfare is the metric (mostly) but agrees with Dworkin that responsibility matters. Cohen's "Access to Advantage" is a slight refinement to handle cases where "opportunity" is too narrow.
  *   **Separation Difficulty:** Very close to Dworkin. The split is often on Q1 and Q8. Arneson/Cohen are more willing to tax innate talent (Q8-B) directly to equalize opportunity sets, whereas Dworkin prefers the hypothetical insurance model (Q8-C).

  #### 5. Sufficientarianism
  *   **Core Intuition:** Justice requires everyone have enough. Inequality above the threshold is not intrinsically unjust.
  *   **Key Markers:** Q5(B).
  *   **Philosophical Diagnosis:** This is a rival to egalitarianism, not a currency of it. If a respondent scores heavily here, they may reject the premise of the reading group's debate.
  *   **Unnamed Leaf Warning:** If a respondent chooses Q5(B) but Q1(B), they hold a "Threshold Welfare" view. This is defensible (prioritarianism) but distinct from strict egalitarianism.

  ### Undefended or Incoherent Combinations (The "Null Sets")

  Use these diagnoses to challenge specific answer combinations during discussion.

  1.  **The "Expensive Taste" Compensator (Q1-B + Q4-B + Q7-B):**
      *   *Diagnosis:* **Incoherent Responsibility.** You hold people responsible for gambling and laziness, but not for their own cultivated tastes. Most philosophers argue that if responsibility matters (Q4/7), it must apply to tastes (Q1) as well.
  2.  **The "Strict Resource" Fundamentalist (Q2-A + Q6-A):**
      *   *Diagnosis:* **Fetishism of Means.** You argue that equalizing physical goods is just even when people have radically different needs (disability/metabolism). This view is largely abandoned because it ignores human diversity.
  3.  **The "Adaptive Paternalist" (Q3-B + Q1-B):**
      *   *Diagnosis:* **Unexplored/Unattractive.** You want to correct the Happy Slave's deprivation (good) but also compensate the Connoisseur's expensive tastes (bad). This combines the most intrusive aspect of Capability theory with the most incentivizing aspect of Welfare theory.
  4.  **The "Brute Luck Absolutist" (Q4-A + Q7-A):**
      *   *Diagnosis:* **Strict Outcome Egalitarianism.** You compensate for gambling and laziness. This is defensible but requires a very strong rejection of personal responsibility, often collapsing into a view where individual choice is an illusion.

  ### Facilitator's Note on Scientific Rigor
  As scientists, your group may notice that these categories are not mutually exclusive in practice (e.g., Dworkin and Sen often recommend the same policies for disability). The philosophical disagreement is often about *justification* (why we give the money) rather than *distribution* (how much money). Use the quiz to uncover the *justificatory intuitions* of the group members. If two members arrive at the same policy recommendation but score differently on Q3 (Adaptive Preferences), they are fundamentally disagreeing on the nature of human well-being, even if they agree on the tax rate.
