prompt: |-
  Alright so I overheard two of my grad-school friends going at it over the two-envelope problem last night and I've been turning it over ever since. Neither of them budged and I genuinely can't tell who's right. Can you work through it?

  Here's the setup they agreed on: I put $X in one envelope and $2X in another, seal them, shuffle them, and hand you one. You open it and find, say, $100. You can keep the $100 or swap for the other envelope.

  Here's how the argument went:

  [1] Dan said: "Obviously you swap. The other envelope has either $50 or $200, each equally likely, so your expected value from switching is ½($50) + ½($200) = $125, which beats the $100 you're holding. The same logic works no matter what amount you see — you always gain 25% in expectation by switching."

  [2] Maya shot back: "That can't be right, because if it were, you'd swap even before opening the envelope. And after swapping, you'd want to swap again on the exact same reasoning. You'd never stop. So the argument has to contain a mistake somewhere."

  [3] Dan said: "I agree the conclusion is weird but weirdness isn't a refutation. The math is straightforward. If you've got a counterexample to the expected-value calculation, show me which line is wrong."

  [4] Maya said: "Fine. The mistake is you're treating the two possibilities as equally likely no matter what you see. But that can't be true for all possible observed amounts unless the prior over X is flat from zero to infinity, which is impossible — it wouldn't integrate to 1. So for any real prior, there will be some amounts you could see where it's not 50/50."

  [5] Dan replied: "Okay but we're not talking about all possible amounts in the abstract. We're talking about a concrete case — I open the envelope and see a hundred bucks. For that specific observation, why isn't 50/50 the right credence? You'd need to tell me which direction the odds tilt and why. If you can't, I'm not persuaded."

  [6] Maya said: "The direction depends on the prior. But the point is deeper — even if we grant 50/50 for the $100 case, your reasoning has to work for every possible observed value to justify 'always switch.' And we just showed it can't. So your advice to swap is underdetermined."

  [7] Dan: "That's moving the goalposts. I don't need the reasoning to work for every conceivable observation. I only need it to work for the observation I actually made. And you haven't given me any reason to think it fails for $100."

  [8] Maya: "Here's another way in. Suppose X is chosen from some distribution. If seeing $100 really does give you 50/50 odds, then the posterior requires P(X=50) = P(X=100). But then by the same logic, P(X=100) = P(X=200), and so on — the distribution has to be uniform over the positive multiples, which again is impossible. So your 50/50 assumption for $100 is mathematically incompatible with the existence of any normalizable prior."

  They went back and forth a bit more but those are the core moves.

  I want you to adjudicate this. Go through each numbered move (1 through 8) and rate it from clearly mistaken to clearly right, with a brief justification for each. Then tell me: who wins overall? And most importantly — is there something both of them are missing that would resolve the thing more cleanly than either of their arguments pulled off?

  You're an expert on decision theory and Bayesian reasoning. Think through the actual mathematics carefully and don't just give me the standard internet summary. I want to understand where the paradox bottoms out.
