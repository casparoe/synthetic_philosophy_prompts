answer: |-
  This is a classic debate that cuts to the bone of Bayesian probability and decision theory. Your friends have actually reconstructed the historical dialectic of this paradox quite accurately: Dan represents the naive expected-value intuition, while Maya represents the rigorous Bayesian objection.

  Here is the adjudication of each move, followed by the verdict and the deeper resolution.

  ### Adjudication of Moves

  **[1] Dan: "Obviously you swap... expected value... $125... always gain 25%."**
  *   **Rating:** **Clearly Mistaken.**
  *   **Justification:** Dan commits the fundamental error of the paradox. He treats the observed amount $A$ ($100) as a fixed constant in the arithmetic ($50 and $200) but implicitly treats it as a random variable in the probability assignment. He assumes $P(\text{Other}=2A | \text{Seen}=A) = 0.5$ without justification. This equality holds only if the prior distribution of money in the envelopes is uniform over an infinite range, which is mathematically impossible (it cannot be normalized).

  **[2] Maya: "That can't be right... you'd swap even before opening... swap again... never stop."**
  *   **Rating:** **Clearly Right.**
  *   **Justification:** This is a valid *reductio ad absurdum* based on symmetry. Before opening the envelope, the situation is perfectly symmetric; the expected value of Envelope 1 must equal the expected value of Envelope 2. If Dan's logic holds, it implies $E[\text{Envelope 2}] > E[\text{Envelope 1}]$ and $E[\text{Envelope 1}] > E[\text{Envelope 2}]$ simultaneously, which is a contradiction.

  **[3] Dan: "Weirdness isn't a refutation... show me which line is wrong."**
  *   **Rating:** **Right (in principle).**
  *   **Justification:** Dan is correct that intuition pumps (like "you'd swap forever") are not formal proofs. In decision theory, if the math says the expectation is positive, you should switch, even if it feels weird. He is correctly demanding to see the specific probabilistic assumption that fails.

  **[4] Maya: "Mistake is you're treating the two possibilities as equally likely no matter what... implies flat prior zero to infinity... impossible."**
  *   **Rating:** **Clearly Right.**
  *   **Justification:** This identifies the specific mathematical error in [1]. To maintain 50/50 odds for *every* possible observed value $A$, the prior probability density function $p(x)$ for the smaller amount $X$ must satisfy $p(A) = p(A/2)$ for all $A$. This implies a constant function over $(0, \infty)$, which is an improper prior (integral diverges). No valid probability distribution satisfies this.

  **[5] Dan: "Not talking about all possible amounts... talking about concrete case... $100... why isn't 50/50 the right credence?"**
  *   **Rating:** **Partially Right / Misleading.**
  *   **Justification:** Dan is right that decision theory is local; he only needs the odds to be favorable for $A=100$, not for all $A$. However, he is misleadingly treating 50/50 as a "default" credence. In Bayesian reasoning, you cannot assign 50/50 without a prior that supports it. He shifts the burden of proof correctly but assumes a premise (50/50 is the null hypothesis) that has no basis.

  **[6] Maya: "Even if we grant 50/50 for $100... reasoning has to work for every possible observed value to justify 'always switch.'... advice to swap is underdetermined."**
  *   **Rating:** **Right.**
  *   **Justification:** Dan's claim in [1] was "The same logic works no matter what amount you see." Maya correctly points out that if the logic fails for *some* amounts (which it must, per [4]), then the universal policy "Always Switch" is unjustified. You cannot derive a universal dominance strategy from a local calculation that isn't universally applicable.

  **[7] Dan: "Moving the goalposts. I don't need the reasoning to work for every conceivable observation. I only need it to work for the observation I actually made."**
  *   **Rating:** **Right (on Decision Theory), Wrong (on Probability).**
  *   **Justification:** Dan is technically correct that he doesn't need a universal policy; he only needs to maximize utility for the actual observation ($100). However, he is wrong that he is entitled to the 50/50 probability for that specific observation. Without a specified prior, the probability is undefined, not 50/50.

  **[8] Maya: "If seeing $100 really does give you 50/50 odds, then the posterior requires P(X=50) = P(X=100)... distribution has to be uniform... impossible."**
  *   **Rating:** **Clearly Right.**
  *   **Justification:** This is the rigorous Bayesian takedown. By Bayes' Theorem, the posterior odds depend on the prior ratio.
      $$ \frac{P(\text{Small}|A)}{P(\text{Large}|A)} = \frac{P(A|\text{Small})P(\text{Small})}{P(A|\text{Large})P(\text{Large})} = \frac{p(A)}{p(A/2)} $$
      (Assuming equal prior probability of picking either envelope). For the posterior to be 50/50, we need $p(A) = p(A/2)$. Maya correctly shows that if Dan insists on 50/50 for $A=100$, he is implicitly committing to $p(100) = p(50)$. If he wants to use this logic for any amount, he commits to a uniform prior, which is impossible.

  ---

  ### The Verdict

  **Maya wins.**

  Dan's argument relies on a probability assignment ($P=0.5$) that is mathematically incompatible with any valid probability space (any normalizable prior). While Dan is correct that decision-making is local (Move [7]), he cannot justify the input probabilities for that local decision without invoking a prior that turns out to be impossible (Move [8]). Maya successfully demonstrates that Dan's expected value calculation is built on a probabilistic impossibility.

  ---

  ### The Deeper Resolution: What Both Are Missing

  While Maya wins the debate, both of them are dancing around the actual mathematical mechanism that resolves the tension. They focus on the *impossibility* of the prior, but they miss the **explicit switching condition** that arises from a *proper* prior.

  Here is where the paradox actually bottoms out:

  **1. The Likelihood Ratio Threshold**
  For any valid, proper prior distribution $p(x)$ over the smaller amount $X$, the decision to switch is not binary (always/never). It depends on the ratio of the prior density at $A$ versus $A/2$.
  You should switch if and only if:
  $$ \frac{p(A)}{p(A/2)} > \frac{1}{2} $$
  *(Derivation: Expected value of switching is $p(\text{Small}|A) \cdot 2A + p(\text{Large}|A) \cdot \frac{A}{2}$. Switch if this $> A$. This simplifies to $p(\text{Small}|A) > 1/3$. Using Bayes rule, this translates to the ratio of priors above.)*

  **2. The "Scale Invariance" Trap**
  The reason Dan's intuition is so seductive (and why Move [5] feels compelling) is that humans naturally assume **scale invariance** when information is missing. We tend to use a Jeffreys prior ($p(x) \propto 1/x$) for positive quantities when we don't know the scale.
  *   If you use a Jeffreys prior, $p(A) / p(A/2) = (1/A) / (1/(A/2)) = 1/2$.
  *   Plugging this into the threshold above: $1/2$ is not greater than $1/2$.
  *   **Result:** You are **indifferent**. The expected gain is exactly zero, not 25%.

  Dan's error is assuming that "lack of information" implies "equal probability" (50/50). In continuous Bayesian problems, lack of information usually implies a scale-invariant prior, which yields indifference, not advantage.

  **3. The Integration Failure (Fubini's Theorem)**
  The paradox "bottoms out" in measure theory. Dan's calculation implies:
  $$ E[\text{Gain}] = \int P(A) \cdot (0.25 A) \, dA > 0 $$
  However, by symmetry, the unconditional expected gain must be 0. The only way to reconcile $E[\text{Gain}|A] > 0$ for all $A$ with $E[\text{Gain}] = 0$ is if the integral does not converge absolutely. This happens if the expected value of the money in the envelopes is **infinite**.
  *   If the expected value is finite (real world), Maya is right: for sufficiently large $A$, $p(A)$ must drop faster than $p(A/2)$, and you should **keep**.
  *   If the expected value is infinite (mathematical abstraction), the expectation is undefined, and comparing infinities is meaningless.

  **Summary for your friends:**
  Tell Dan he is calculating expected gain using a probability distribution that sums to infinity. Tell Maya she is right that the prior can't be flat, but the deeper lesson is that for any *real* distribution, there is a specific dollar amount above which you should never switch. The paradox vanishes once you admit that seeing $1,000,000 makes it much more likely you hold the larger envelope than seeing $10 does.
