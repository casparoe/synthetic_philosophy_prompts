answer: |-
  You have hit on exactly the right pressure point. Your skepticism regarding Newton's leap from "not the bucket" to "not any ambient bodies" is historically well-founded; it is precisely the objection Ernst Mach raised two centuries later, and it remains the central philosophical controversy of the Scholium.

  You are not missing a line of text. You are identifying the place where Newton's physics relies on a metaphysical commitment that the experiment itself does not strictly prove.

  Here is a breakdown of the two specific issues you raised: the meaning of "contrary" motion, and the validity of the leap to Absolute Space.

  ### 1. What does "directly contrary to the relative" mean?

  This phrase often trips people up because it sounds like a vector direction issue, but in the context of the argument, it refers to the **inverse correlation of magnitudes** during the experiment.

  Newton is tracking two quantities over time:
  1.  **True (Absolute) Motion:** Measured by the concavity of the water (the "endeavour to recede").
  2.  **Relative Motion:** Measured by the change of position of the water relative to the bucket.

  Look at the progression of the experiment:
  *   **Phase 1 (Start):** The bucket is spinning, the water is stationary (in absolute space).
      *   Relative Motion: **Maximum** (water is sliding past the bucket walls).
      *   True Motion/Concavity: **Zero** (surface is flat).
  *   **Phase 2 (Spin-up):** Friction transfers motion to the water.
      *   Relative Motion: **Decreasing** (water catches up to the bucket).
      *   True Motion/Concavity: **Increasing** (water begins to climb the walls).
  *   **Phase 3 (Steady State):** Water and bucket spin together.
      *   Relative Motion: **Zero** (water is at rest in the bucket).
      *   True Motion/Concavity: **Maximum**.

  When Newton says the true motion is "directly contrary to the relative," he means that **as one quantity increases, the other decreases.** If true motion were defined by relative motion, they should rise and fall together. Since they move in opposite directions (one goes up, the other goes down), they cannot be the same thing.

  ### 2. The Leap: From "Not the Bucket" to "Not Any Ambient Bodies"

  You asked: *Why can't a relationist just say the concavity tracks rotation relative to the rest of the universe?*

  You are correct that the bucket experiment *alone* does not rule this out. In the experiment, the water is rotating relative to the bucket (flat surface) and later rotating relative to the fixed stars (concave surface). A relationist (like Mach) could argue: "The water knows it is spinning because it is spinning relative to the fixed mass of the universe (the stars), not because it is spinning relative to an invisible 'Absolute Space'."

  **Why Newton makes the leap:**
  Newton is operating with a specific definition of "True Motion." For Newton, True Motion is not just kinematic (change of place); it is **dynamic**.
  *   **Relative Motion:** Change of position relative to other bodies. This can happen without force (e.g., if the universe spins around you).
  *   **True Motion:** Motion generated by **forces impressed upon the body**.

  Newton's argument is essentially: *The concavity is caused by an inertial force (centrifugal tendency). Forces inhere in the body itself, not in its relationship to neighbors. Therefore, the motion causing that force must be intrinsic to the body, not relational.*

  When he says the endeavour "does not depend upon any translation of the water in respect of the ambient bodies," he is asserting that the *cause* of the concavity is internal to the water's state of inertia. If the cause is internal, the reference frame must be universal and immutable (Absolute Space), not contingent matter (like the stars, which could theoretically move differently).

  **Is he assuming something unstated?**
  Yes. He is assuming that **inertia is not relational.** He assumes that if you removed all the stars from the universe but kept the bucket spinning, the water would *still* become concave. The bucket experiment cannot prove this, because in our universe, the stars are always there.

  **What would he need to add to rule out the relational response?**
  To actually rule out rotation relative to the stars, Newton would need to describe a scenario where a body rotates relative to the stars *without* concavity, or rotates *without* stars *with* concavity.

  He actually attempts this **later in the Scholium**, immediately following the bucket argument, with the **"Two Globes" thought experiment**.
  *   He asks us to imagine two globes connected by a cord, rotating around their common center of gravity in a **vacuum** (an empty universe with no ambient bodies).
  *   He argues there would still be tension in the cord.
  *   Since there are no "ambient bodies" to be relative to, the tension must indicate rotation relative to Absolute Space.

  This is the argument required to close the gap you identified. The bucket shows motion isn't relative to the *immediate* container; the Two Globes argument attempts to show motion isn't relative to *any* matter.

  ### 3. Historical Context for your Seminar

  Since you are in a history seminar, it is worth noting that your intuition aligns with **Ernst Mach** (1883). In *The Science of Mechanics*, Mach critiqued Newton exactly on this point. Mach argued:
  1.  Newton has no right to assume the water would climb in an empty universe.
  2.  The "fixed stars" are not just background; they provide the inertial frame.
  3.  If the universe were empty, the concept of rotation (and thus the concavity) would be meaningless.

  **Einstein and General Relativity:**
  Einstein was deeply influenced by Mach ("Mach's Principle"). He hoped General Relativity would vindicate the relationist view (that inertia is determined by the distribution of mass in the universe). However, the verdict is mixed. In General Relativity, spacetime has its own geometric structure (somewhat like Newton's Absolute Space) that exists even without matter, though it is dynamic rather than static. So, Newton was wrong about Space being an immutable container, but Mach was arguably too optimistic that matter alone dictates inertia.

  ### Summary for your discussion
  *   **On "Contrary":** It refers to the inverse correlation of magnitudes during the spin-up phase (Relative motion goes down, Absolute effects go up).
  *   **On the Leap:** You are right to be skeptical. The bucket argument only disproves the bucket as the reference frame. It does not logically disprove the fixed stars as the reference frame.
  *   **Newton's Defense:** Newton relies on a dynamic definition of motion (True Motion = Motion caused by force). He assumes forces are intrinsic, not relational.
  *   **The Missing Link:** To fully argue his case, he needs the "Two Globes in a Vacuum" thought experiment which follows in the text, attempting to isolate the body from all ambient matter.

  You are reading the text exactly as a historian of science should: by identifying where the empirical evidence ends and the metaphysical assumption begins. Newton's genius was in seeing that the *physics* required the metaphysics, even if the experiment couldn't fully prove it.
