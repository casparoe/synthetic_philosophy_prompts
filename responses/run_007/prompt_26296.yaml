answer: |-
  Your skepticism is well-founded. The summary you heard is a classic "bar story" version of a rigorous academic result. It gets the intuition right but botches the implications. An economist specializing in market microstructure or information theory would nod along for the first half of that paragraph and then spill their coffee during the second half.

  Here is a sentence-by-sentence breakdown of what an economist would accept, what they'd wince at, and what is simply wrong, followed by what this actually means for your investing.

  ### Sentence 1
  > *"Back in the 80s, a couple economists proved the 'no-trade theorem': if everyone has the same prior and is rational, and everyone knows everyone is rational, then nobody should ever trade a financial asset."*

  *   **Economist Verdict:** **Mostly Accept.**
  *   **The Nuance:** This refers to the Milgrom-Stokey theorem (1982). The logic is sound, but the phrase "same prior" is doing extremely heavy lifting here. This is called the **Common Prior Assumption (CPA)**. It means everyone starts with the exact same baseline probability model of the world before seeing any private data.
  *   **The Wince:** Economists would wince at the implication that this is a general description of markets. The CPA is a mathematical convenience, not a description of reality. If you and I have different life experiences, we naturally have different priors. The theorem essentially says, "If we agree on the rules of the universe and update our beliefs perfectly logically, we can't bet against each other."

  ### Sentence 2
  > *"The argument is that if I offer to sell you a stock, you should ask why I'd sell if I thought it was worth holding — and conclude I must know something bad."*

  *   **Economist Verdict:** **Accept.**
  *   **The Nuance:** This is the core intuition of **adverse selection**. In a purely speculative market (where no one is trading for cash needs or risk management), a trade offer reveals information. If I want to sell, it's likely because my private signal says the price is too high.
  *   **The Wince:** None. This is the correct intuition. It's the same logic behind George Akerlof's "Market for Lemons."

  ### Sentence 3
  > *"So you'd only buy at a lower price. But I'd anticipate that and only sell at a price that already reflects my bad news."*

  *   **Economist Verdict:** **Accept.**
  *   **The Nuance:** This describes the **unraveling result**. Because you anticipate my information advantage, you discount the price. Because I know you'll discount the price, I won't sell unless the price is even lower.
  *   **The Wince:** None. This is the standard game-theoretic recursion.

  ### Sentence 4
  > *"Unraveling this, the only trades that can happen are at prices where neither of us expects to gain, so rational people simply don't trade."*

  *   **Economist Verdict:** **Accept (with a technical caveat).**
  *   **The Nuance:** Under the strict assumptions of the theorem, speculative trading is a zero-sum game. If we have the same priors and are both rational, I can't expect to make money from you unless you expect to lose money. Since you know you're rational, you won't expect to lose money. Therefore, no trade.
  *   **The Caveat:** This ignores **risk-sharing**. Even if we have the same information, I might sell you stock because I'm too exposed to tech risk and you want more exposure. That is a "gain from trade" based on risk preference, not information. The summary implies *all* trading is speculative, which is false.

  ### Sentence 5
  > *"The fact that the NYSE does billions of shares a day is therefore pretty direct evidence that real markets aren't rational."*

  *   **Economist Verdict:** **Wrong.**
  *   **The Nuance:** This is the leap your friend made that doesn't hold water. High trading volume does not prove "irrationality" (in the behavioral sense of people making stupid mistakes). It proves that the **assumptions of the theorem are violated.**
  *   **Why it's wrong:**
      1.  **Heterogeneous Priors:** We don't start with the same beliefs. I might think AI is the future; you might think it's a bubble. We can both be "rational" (logical) but still disagree because our baseline models differ. The No-Trade Theorem forbids "agreeing to disagree." Real humans do it constantly.
      2.  **Liquidity/Noise Traders:** A huge chunk of volume comes from people who *have* to trade. Index funds rebalancing, employees exercising stock options, retirees withdrawing cash, or margin calls. These people aren't trading because they have a secret signal; they're trading because they need cash or need to match a benchmark. Economists call these "noise traders" or "liquidity traders." Their existence allows informed traders to profit without the market unraveling.
      3.  **Different Definitions of Rational:** In the theorem, "rational" means "Bayesian updater with common priors." In your friend's conclusion, "irrational" implies "behaviorally biased." You can violate the No-Trade Theorem simply by having different opinions, without being behaviorally irrational.

  ### Does the conclusion survive cleanup?
  **No.** The claim that "high volume = market irrationality" does not survive once you account for the actual reasons markets exist.

  If the No-Trade Theorem held perfectly in the real world, markets would cease to exist. The fact that they don't tells us that **information is not the only reason we trade.** We also trade to:
  *   Manage risk (hedging).
  *   Access liquidity (cash needs).
  *   Express different viewpoints (heterogeneous priors).

  Your friend is conflating "The assumptions of Milgrom-Stokey are false" with "Investors are behaving irrationally." The former is true; the latter is unproven by this theorem.

  ### How should you rely on this when thinking about your own trades?

  You should keep the **intuition** of the No-Trade Theorem as a warning label, but discard the **conclusion** about market irrationality.

  **1. The Warning Label (Keep this):**
  The theorem teaches **epistemic humility**. Before you click "buy," ask yourself: *"Who is selling this to me, and why?"*
  If you are trading purely on speculation (not hedging, not rebalancing), you are betting that you know something the counterparty doesn't, or that the counterparty is making a mistake. The No-Trade intuition reminds you that the person on the other side of the trade might have better information or a better model than you. If you can't identify the "sucker" at the table, the theorem suggests it might be you.

  **2. The Reality Check (Discard the "Irrationality" claim):**
  Do not assume that high volume means the market is crazy and easy to beat. High volume often means high liquidity, which lowers your transaction costs. It also means there are plenty of "noise traders" (people trading for non-information reasons) providing the cover you need to enter and exit positions.
  *   **Bad takeaway:** "The market is irrational, so I can easily outsmart it."
  *   **Good takeaway:** "The market is liquid because people have different needs and views. I should ensure my trade is based on a genuine edge or a risk management need, not just a hunch."

  **3. The "Rationality" Trap:**
  Be careful with the word "rational." In finance, a "rational market" doesn't mean a market that makes sense to you. It means prices reflect available information. The No-Trade Theorem shows that if everyone processes information perfectly, trading stops. Since trading doesn't stop, we know people process information differently or trade for other reasons. That doesn't mean they are wrong; it just means they are different.

  ### Summary for your investing group
  Tell your group this:
  *"The No-Trade Theorem is a brilliant logical puzzle that proves if we were all identical robots with the same starting data, we'd never trade. The fact that we do trade proves we aren't identical robots. It doesn't prove we're irrational; it proves we have different needs, different risk tolerances, and different opinions. Use the theorem to remind you to wonder why someone is taking the other side of your bet, but don't use it to claim the market is broken."*
