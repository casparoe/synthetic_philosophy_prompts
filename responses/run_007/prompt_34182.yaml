      *   *Wait, is there a middle ground?* "Approve with Conditions" where the condition is "Demonstrate no alternative exists that respects the animal's integrity." But the protocol *is* the pain model.
      *   *Okay, I'll recommend **Non-Approval**.* It's the strongest philosophical position. I will ensure I treat the "Approve" side's arguments (human benefit) with deep respect, not dismissal.

  4.  **Drafting - Section by Section:**
      *   **Header:** Standard IACUC memo format.
      *   **Introduction:** State the protocol, the split, and the purpose of the memo.
      *   **The Utilitarian Case (The "Approve" Argument):** Acknowledge the 3Rs, the scientific merit, the human benefit. Be charitable. This addresses the requirement to treat the losing side honestly.
      *   **The Nozickian Objection (The Core):** Explain side-constraints. Distinguish between "minimizing harm" (utilitarian) and "inviolable boundaries" (rights/constraints). Apply to the macaque. The key phrase: "Cannot be used *purely* as a means."
      *   **Operationalizing the Constraint:** How does this change the vote? It shifts the burden of proof. It's not "Is the benefit worth the cost?" It's "Is this action permissible regardless of cost?"
      *   **Recommendation:** Non-Approval.
      *   **Path Forward:** Not a dead end. Suggest alternative models or a higher threshold of necessity (e.g., imminent life-saving vs. "might eventually help").
      *   **Conclusion:** Summarize the ethical stance.

  5.  **Refining the Tone:**
      *   Needs to sound like a biologist who reads philosophy. Practical but deep.
      *   Avoid jargon where possible, but use Nozickian terms correctly (side-constraints, utilitarianism, means/ends).
      *   Ensure it sounds like an IACUC document (formal, structured).

  6.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is rejecting too hard for an IACUC?
