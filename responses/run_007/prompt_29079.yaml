      *   *The "Standard View":* In cognitive neuroscience (e.g., Dehaene, Lamme, Koch), report is often treated as a proxy for awareness. The "No-Report Paradigms" debate (Tsuchiya et al.) highlights the tension between report and consciousness.
      *   *The Epiphenomenalist Challenge:* This is a classic philosophical objection (Huxley, Jackson's Mary, Chalmers). If qualia don't do anything, why do we talk about them?
      *   *The Common Cause Solution:* This is the standard physicalist reply to epiphenomenalism. Neural state $N$ causes both Experience $E$ and Report $R$. $E$ doesn't cause $R$, but $N$ causes both. This preserves the correlation without granting causal efficacy to $E$.
      *   *Methodological Implications:* If the common cause holds, reports are still reliable indicators (symptoms), just not direct effects. However, if $N$ can occur without $E$ (zombies) or $E$ without $N$ (dualism, though unlikely in this context), reliability breaks.

