      *   **The Problem:** We treat reports as authoritative data for consciousness. But this seems to presuppose that consciousness *causes* the report. If epiphenomenalism (consciousness has no causal power) is true, the report is caused by non-conscious processes.
      *   **Key Questions:**
          1.  What exactly does the practice presuppose? (Does it *strictly* require consciousness to cause reports?)
          2.  Can it be justified under epiphenomenalism (e.g., via a common cause structure)?
          3.  If epiphenomenalism were true, what would change in data collection/interpretation?

