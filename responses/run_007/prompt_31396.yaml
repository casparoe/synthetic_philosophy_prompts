answer: |-
  This is one of the most persistent and potent objections to Dennett's view. If the self is a "benign user illusion" or an abstraction, how can it be the proper target of retribution, praise, or blame? It feels intuitive that if there is no "real" boss in the brain, there is no one to hold accountable.

  However, Dennett argues that this intuition relies on a pre-scientific, Cartesian conception of what "real" means. To understand how a fictional self can bear robust responsibility, we have to unpack three specific moves Dennett makes: redefining "fiction," locating the physical locus of accountability, and reframing responsibility as a social technology rather than a metaphysical property.

  ### 1. Abstraction is not Illusion
  The first step is to correct the interpretation of "fiction." When Dennett calls the self a "center of narrative gravity," he is borrowing from physics. A center of gravity is an abstract point; you cannot find it in the matter of an object. If you take a donut, its center of gravity is in the hole, where there is no dough.

  Does that mean the center of gravity is an *illusion*? No. It is a **real pattern**. It has predictive power. If you push the donut, it rotates around that point. If you ignore that point, your physics will be wrong.

  Similarly, the "self" is an abstraction generated by the brain's parallel processing systems to create a coherent story. It is not a "thing" (like a soul or a homunculus), but it is a **real organizational structure**. Dennett argues that abstractions can have causal power. The narrative you tell about yourself literally rewires your brain over time. By identifying with a certain character in your story ("I am a honest person"), you constrain your future neural firing patterns.

  Therefore, holding the self responsible is not a category mistake because the self, while abstract, is a **causally efficacious control structure**. It is the interface where reasons hook into the biological machine.

  ### 2. The Locus: The Organism, not the Ghost
  You ask: *What exactly carries the responsibility?*

  For Dennett, the ultimate bearer of responsibility is the **human organism**. The biological body is the thing that acts, suffers consequences, and can be modified by punishment or reward.

  However, we cannot effectively hold the *organism* accountable unless we address it through the **narrative interface**. If you yell at a brick, nothing happens. If you yell at a dog, it might cower (conditioning). If you yell at a human, you are invoking their self-narrative ("I am being blamed," "I did something wrong," "I should change").

  Responsibility attaches to the organism *in virtue of* its capacity to sustain a center of narrative gravity. We hold the "fiction" accountable because the fiction is the control panel for the machine. To bypass the narrative self and punish the biological organism directly (e.g., via brain stimulation or unavoidable pain without context) would be ineffective and cruel, because it bypasses the system's capacity to learn from *reasons*.

  ### 3. Responsibility as a Social Technology
  This is Dennett's most pragmatic move. He shifts the definition of moral responsibility from **Metaphysical Desert** to **Social Competence**.

  *   **Metaphysical Desert (Libertarian View):** You are responsible only if you could have done otherwise in a cosmic, uncaused sense. Dennett rejects this.
  *   **Social Competence (Compatibilist View):** You are responsible if you are a competent agent who can respond to reasons, forecasts, and social norms.

  For Dennett, moral responsibility is not a property of the universe waiting to be discovered; it is a **status we confer upon each other** to make society function. It is a "game" we play. When we hold someone accountable, we are not detecting a metaphysical glow of "blameworthiness." We are engaging in a practice that shapes future behavior.

  Does this make responsibility "fake"? Dennett would say no, because the *consequences* are real. Just because money is a social construct doesn't mean you can't buy food with it. Just because the self is a narrative construct doesn't mean prison sentences don't deter it.

  ### 4. Reasons-Responsiveness
  So, when is it appropriate to hold this "fictional" self accountable? Dennett suggests we look for **reasons-responsiveness**.

  An agent is morally responsible if:
  1.  They possess the cognitive machinery to anticipate consequences.
  2.  They possess the narrative machinery to understand social norms.
  3.  Their behavior can be modified by the application of praise or blame.

  If a person lacks these (e.g., severe psychosis, infancy), we do not hold them responsible, not because they lack a soul, but because the "center of narrative gravity" is too unstable to serve as a control interface. Punishing them is like yelling at a storm; it wastes social energy and achieves nothing.

  When we punish a "normal" adult, we are treating their narrative self as a node in a network of reasons. We are saying, "Your story included a choice that violated our norms; we are now adding a negative chapter to your story (punishment) to ensure your future narratives avoid this path."

  ### Summary: Avoiding the Category Mistake
  Your worry is that we are punishing a story. Dennett's reply is that **we are using the story to punish the organism.**

  The category mistake is not in holding a narrative self responsible; the category mistake is thinking that responsibility requires a *non-physical* self. Dennett argues that once you have a biological organism complex enough to generate a center of narrative gravity, you have an entity that is robust enough for responsibility.

  The "self" is the only thing that *can* be held responsible, precisely because it is the only thing that cares about the future, understands the concept of "guilt," and can alter its behavior based on the threat of blame. The biological machine doesn't care about "shame"; the narrative self does. Therefore, the narrative self is the necessary vehicle for moral accountability.

  In short: The self is a fiction, but it is a **fiction that thinks it is real, acts as if it is real, and suffers consequences as if it is real.** For the purposes of ethics, that is real enough.
