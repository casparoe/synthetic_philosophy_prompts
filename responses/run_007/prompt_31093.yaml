          *   Flag any pairs suspected to be incompatible (trade-offs/inconsistencies) – this is crucial for the plot.
          *   No citations (user will look them up).
          *   Language: British English.
          *   Ending: Confidence level + least sure requirement.

  2.  **Deconstruct the Philosophical Problem:**
      *   **Epiphenomenalism:** Qualia exist but are causally inert. Physical events cause qualia, but qualia cause nothing physical (including speech/writing about qualia).
      *   **The Paradox:** If qualia cause nothing, how do we come to believe in them? Our belief/report seems to track the qualia. If the physical brain state causes the report *without* the qualia, the report seems accidentally true (or unjustified). This undermines the knowledge of qualia, including the knowledge that they are epiphenomenal.
      *   **The Character's Dilemma:** She believes qualia are epiphenomenal. But her belief is a mental event. If qualia did nothing to cause that belief, why is the belief reliable? It looks self-defeating.

  3.  **Brainstorming Desiderata (What must a solution do?):**
      *   It must explain how we know about consciousness if it does nothing.
      *   It must preserve the intuition that consciousness *is* real (for the epiphenomenalist) or explain why that intuition is wrong (for the illusionist).
      *   It must account for the causal closure of the physical (if physicalist).
      *   It must avoid self-refutation (the theory shouldn't undermine its own assertion).
      *   It must explain the *correlation* between experience and report.

  4.  **Categorising Requirements (Non-negotiable vs. Camp-Specific):**
      *   *Non-negotiable:* Logical coherence, explanatory power regarding the link between experience and report.
      *   *Camp-specific:* Preserving intrinsic nature of qualia (dualist), preserving causal efficacy (physicalist), eliminating qualia (illusionist).

  5.  **Identifying Tensions/Incompatibilities:**
      *   *Causal Closure vs. Knowledge:* If physical causes are closed, how does non-physical experience justify belief?
      *   *Reliability vs. Epiphenomenalism:* If experience doesn't cause belief, is the belief reliable?
      *   *Introspective Certainty vs. Physical Explanation:* Can we have both direct access and a purely physical mechanism?

  6.  **Drafting the Content (Iterative refinement):**

      *   *Requirement 1: The Explanation of Correlation.* Why do reports match experiences if experiences don't cause reports?
      *   *Requirement 2: Epistemic Justification.* How is the belief justified if not caused by the thing believed in?
