      *   *Requirement 4: Phenomenal Integrity.* (Camp specific) Must respect the "what-it's-like" feel.
      *   *Requirement 5: Causal Closure.* (Camp specific) Must respect physics.

      *Refining the "Incompatibilities":* This is the gold for the novelist.
      *   Tension between *Justification* and *Causal Inertness*. If X doesn't cause Belief(X), how is Belief(X) justified?
      *   Tension between *Introspective Authority* and *Physical Determinism*. If I know my mind directly, but my brain decides what I say physically, do I really know it?

  7.  **Structuring the Response:**
      *   Introduction acknowledging the depth of the problem (Chalmers' "Paradox of Phenomenal Judgement").
