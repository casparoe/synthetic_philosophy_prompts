prompt: |-
  Okay, so in a few weeks I'm giving a theory seminar talk to an economics department — mostly social choice and welfare people, a couple of game theorists, one political philosopher who comes for the math. They know Arrow cold, they've read Sen's original liberal paradox paper, and they're formal to the bone: "rights" to them means a condition you can write down, not a vibe. My thesis is that the standard ways of dissolving the paradox — modeling rights as constraints on the feasible set, or Gibbard's line that the alternatives in the Lady Chatterley example were just described too coarsely — both work only by quietly assuming there's a neutral, principled way to sort the world into private and public dimensions, and there isn't. So the liberal paradox isn't really a tension between rights and Pareto; it's a warning that social choice can't even state what a right is without importing a contested theory of the private sphere. I'm defending the strong version: even fine-grained reindividuation of alternatives doesn't fix it, its just moves the arbitrariness into the description of the outcome space.

  I've been arguing about this for weeks with a friend who's a committed Gibbardian, and he keeps telling me I'm attacking a formalization that nobody ever claimed was a theory of rights — that once you define rights over actions instead of social states, the paradox just goes away. I have responses that feel fine one-on-one, but a seminar crowd is a different animal.

  So prep me for the Q&A. Give me the objections I'll actually get from this audience — not from rights theorists or philosophers — ordered by how likely and how damaging they are, phrased the way these people would phrase them, each with a two-minute reply and a note on where that reply is soft. Tell me what to concede up front and what to hold, and include the question I should be praying nobody asks. Be explicit about your confidence: say how sure you are about each objection's likelihood, and mark the single point in your read of this audience that you're least certain about. Start with the bottom line — the one objection I absolutely have to be ready for — then give the reasoning. No preamble, and don't restate my question back at me.
