      *   *Drafting - Section 2: Diachronic Reconstruction.*
          Move to the diachronic case. Focus on the sequential nature. Distinguish between naive and sophisticated agents. The pump works best against the naive agent who doesn't anticipate the shift, or shows the cost of inconsistency even for the sophisticated agent if commitment costs money. The normative conclusion is about planning agency and temporal stability.

      *   *Drafting - Section 3: Analogy and Difference.*
          Compare them. Both exploit a cycle to show dominance violation. But the synchronic case is about logical contradiction in valuation at a time. The diachronic case is about the relationship between temporal stages. The synchronic agent is one mind; the diachronic agent is a sequence of minds (potentially).

      *   *Drafting - Section 4: Reducibility.*
          Address the temporally indexed outcomes strategy. Explain why this fails. It dissolves the inconsistency by changing the objects of preference. It misses the point that the agent *takes themselves* to be the same agent. It loses the normative force regarding self-government.

      *   *Drafting - Section 5: Final Assessment.*
          Conclude that they are distinct. The synchronic argument is about the logic of choice. The diachronic argument is about the metaphysics and normativity of agency over time. They share a name but differ in philosophical weight.

