answer: |-
  Dear Colleague,

  It is a pleasure to hear from you, and I commend you on tackling this specific juncture in decision theory. The relationship between synchronic and diachronic money pumps is indeed one of those fault lines where formal modeling meets deep philosophical questions about the nature of agency. You are right to sense that while the mechanics look similar, the normative underpinnings may diverge significantly. Let us walk through this together, beginning with a careful reconstruction of the two arguments to see where the steel of the logic lies in each case.

  Consider first the synchronic money pump, which targets intransitive preferences. Here we have an agent at a single moment in time, t, who holds a preference ordering such that they prefer A to B, B to C, and C to A. The bookie approaches this agent with an endowment of C. Given the preference for A over C, the agent pays a small fee to trade C for A. Now holding A, the agent prefers B to A, so they pay a fee to trade A for B. Finally, holding B, the agent prefers C to B, so they pay a fee to trade B for C. The agent ends up with their original endowment, C, but is poorer by the sum of the fees. The structure relies on the assumption that the agent makes choices myopically, responding only to the immediate trade offer based on their current preference ordering, without recognizing the cyclicality of the sequence or the cumulative cost. The normative conclusion is that intransitivity is irrational because it renders the agent vulnerable to a dominated strategy; they end up worse off in a dimension they value (money) without gaining anything in return. The defect is purely structural within the valuation system at a single time.

  Now contrast this with the diachronic money pump, which targets dynamic inconsistency. Here the agent exists across time, say t1 and t2. At t1, the agent prefers a long-term plan, such as abstaining from a vice, over indulging. However, they know or suspect that at t2, when the choice is immediate, their preferences will reverse, and they will prefer indulging over abstaining. A bookie or market mechanism can exploit this. At t1, the agent pays a fee for a commitment device that forces abstention at t2. When t2 arrives, the agent's preferences have shifted. They now prefer indulging over abstaining, so they pay a fee to break the commitment and indulge. The result is that the agent indulges (which they could have done for free at t1 if they had known they would cave) but has paid fees at both stages. Alternatively, if the agent is naive and does not anticipate the shift, they might reject the commitment device at t1, plan to abstain, but then indulge at t2, potentially paying a penalty or simply suffering the loss of utility associated with failed planning. The normative conclusion here is that dynamic inconsistency is irrational because it frustrates the agent's own planning agency and leads to outcomes that no temporal stage of the agent prefers over a consistent alternative. The defect is not in the logical structure of preferences at a time, but in the stability of preferences across time.

  When we place these two reconstructions side by side, the points of analogy are striking enough to explain why they share a name. Both arguments demonstrate a vulnerability to exploitation based on a consistency violation. In both cases, the agent undergoes a sequence of transactions that leaves them strictly worse off in terms of a neutral resource like money, while returning them to a state equivalent to where they started regarding the primary goods. Both arguments rely on a decision procedure where the agent acts on local preferences at each node without successfully coordinating those nodes into a globally optimal strategy. Furthermore, both are used to defend rationality axioms: transitivity in the synchronic case and stability or resolute choice in the diachronic case. The core intuition is the same: rational agents should not be money pumps.

  However, the points of difference are profound and touch on the metaphysics of the agent. In the synchronic case, the agent is treated as a unified locus of valuation at a single instant. The inconsistency is a logical contradiction in their value system akin to asserting P and not-P. There is no question of personal identity or temporal extension; the defect is immediate and internal. In the diachronic case, the agent is temporally extended. The inconsistency arises between different temporal selves. This introduces questions about the authority of the past self over the future self. When the t1 self pays for commitment, they are attempting to bind the t2 self. When the t2 self pays to undo it, they are rebelling against that binding. The normative force here depends on whether we view the agent as a single entity persisting through time or as a sequence of distinct selves. If the latter, the diachronic money pump looks less like a logical error and more like a conflict of interest between different agents, much like a trade between two strangers where fees are extracted. The synchronic pump assumes a single will; the diachronic pump reveals the fragmentation of the will over time.

  This brings us to the question of reducibility. Can we dissolve the diachronic case into the synchronic one by indexing outcomes to time? On this view, we treat abstain-at-t2 and indulge-at-t2 as distinct goods from the perspective of t1. The preference at t1 is for (Commitment + Abstain-at-t2) over (No Commitment + Indulge-at-t2). The preference at t2 is for (Indulge-at-t2) over (Abstain-at-t2). If we treat these as preferences over different objects, there is no contradiction. The agent at t1 prefers one bundle, and the agent at t2 prefers a different bundle. This reformulation effectively makes dynamic inconsistency impossible by definition, as preferences are always defined over temporally indexed outcomes. However, this reduction loses something essential. It fails to capture the phenomenology and normativity of agency. The agent does not experience t1 and t2 as different people trading goods; they experience themselves as the same person failing to stick to a plan. The normative bite of the diachronic money pump is that the agent defeats their own purposes. By reducing the outcomes to temporally indexed atoms, we erase the temporal extension of the agency that is being criticized. We turn a failure of self-government into a mere change in taste. The diachronic pump argues that you should not change your mind in this specific way because it undermines your capacity to plan. The synchronic reduction says you simply have different preferences at different times, which is rationally permissible. Thus, the reformulation saves the logic of transitivity at the cost of abandoning the problem of dynamic choice entirely.

  My own assessment is that we are dealing with two distinct arguments that share a family resemblance rather than one argument applied to two targets. The synchronic money pump is a argument about the logic of value. It demonstrates that if your values do not map onto a transitive ordering, you cannot be represented as maximizing anything, and you are vulnerable to exploitation in a way that violates dominance. The diachronic money pump is an argument about the integrity of agency. It demonstrates that if your will is not stable, you cannot effectively execute plans, and you are vulnerable to exploitation that arises from the temporal structure of your decision nodes. The synchronic argument targets the coherence of the preference relation itself. The diachronic argument targets the relationship between the preference relation and the execution of choice over time.

  While the diachronic case can be modeled using the tools of synchronic choice theory by expanding the state space to include time, this is a modeling trick that obscures the philosophical issue. The normative force of the diachronic pump relies on the idea that the agent at t1 and the agent at t2 are normatively connected in a way that strangers are not. They are the same agent. This identity imposes requirements of stability or resoluteness that have no analogue in the synchronic case. In the synchronic case, there is no past or future self to respect or betray. Therefore, while the money pump mechanism is the same, the philosophical work it does is different. The synchronic pump defends the axioms of rational preference. The diachronic pump defends the possibility of strategic agency and the rationality of commitment. Treating them as identical risks conflating logical consistency with temporal integrity, and I believe your seminar would benefit from highlighting this distinction. The diachronic pump is not merely a synchronic pump stretched out; it is a unique challenge to the unity of the agent over time.

  I hope this analysis proves useful as you prepare your seminar. It is a rich topic, and distinguishing these strands is crucial for understanding what we demand of a rational agent.

  Warmly,

  Your Colleague
