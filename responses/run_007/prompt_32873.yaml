                          *   If Blue: World L.
                          *   "You are in the Universe."
                          *   "Guess the Color."
                          *   *Intuition:* There are more Blue chips. So it's more likely Blue.
                          *   *Connection:* Each chip represents a *possible observer*.
                          *   If you reason "I am a random possible observer," you pick Blue (L).
                          *   *This is the one.*

  5.  **Refining the Plan:**
      *   **Round 1 (SSA):** "The Census." Fixed World Probability (50/50). Variable Population. Students given Rank. Low Rank -> Small World.
      *   **Round 2 (SIA):** "The Soul Lottery." Variable World Probability (Weighted by Population). Students told "You exist." Large World -> More "Soul Tickets" -> More likely to be drawn.
      *   **Presumptuous Philosopher:** Extend Round 2. World S (1 billion), World L (1 billion + 1). The weighting makes L virtually certain.
      *   **Debrief:** Map Round 1 to SSA (Sampling from actuals). Map Round 2 to SIA (Sampling from possibles). Map the extension to Presumptuous Philosopher (Absurd certainty from tiny difference).

  6.  **Addressing Constraints & Failures:**
      *   **Time:** 80 mins is tight. Keep rules simple.
      *   **Confusion:** Students might conflate "Probability of World" with "Payoff." Need to keep payoffs flat (1 point for correct guess) so they focus on *credence*.
      *   **Limitation:** The game can't reproduce the *ethical* weight of the Presumptuous Philosopher, only the probabilistic absurdity. It also can't fully simulate "possible observers" without abstraction.
      *   **Confidence:** High on engagement, Medium on deep conceptual transfer without a strong debrief.

  7.  **Final Polish:** Check the math on the SIA round.
      *   If I have a bag of 10 Red (World S) and 100 Blue (World L).
      *   I draw one chip. It is "You".
      *   P(Red | You) = P(You | Red)P(Red) / P(You).
      *   This setup assumes P(Red) and P(Blue) are proportional to counts.
      *   Yes, that *is* SIA. SIA *says* the prior should be proportional to counts.
      *   The game forces them to adopt the SIA prior by physically weighting the bag.
      *   Then the debrief explains *why* we weighted the bag that way (because each observer is a "chance" for the world to be actualized).

  8.  **Structure of the Output:**
      *   Game Title.
      *   Materials.
      *   Timeline.
      *   Round 1 (SSA).
      *   Round 2 (SIA).
      *   The Presumptuous Twist.
      *   Debrief/Mapping.
      *   Predicted Failures.
      *   Limitations.
      *   Confidence Assessment.

  9.  **Self-Correction during drafting:**
      *   *Correction:* In Round 2, if I just weight the bag, they might think "Oh, the professor just changed the prior." I need to justify *why* the bag is weighted.
      *   *Justification:* "Each chip represents a potential 'you'. If there are more potential 'you's, it's more likely one of them became the actual 'you'."
      *   *Wait, that's the definition of SIA.* I need them to *derive* it.
      *   *Better:* Don't weight the bag initially. Let them bet 50/50. Then show them the "SIA Move" leads to higher scores *in the game logic*? No, that's pragmatic.
      *   *Best:* Stick to the "Soul Queue" analogy in the instructions. "Imagine you are waiting to be born. There are two lines. Line S (100 people). Line L (1000 people). The Professor picks a line at random, then picks a person from that line. You are that person. Which line?"
      *   If Professor picks line at random (50/50), then picks person:
          *   P(You | S) = 1/100 * 1/2.
          *   P(You | L) = 1/1000 * 1/2.
          *   This favors S (SSA).
      *   *I need the SIA result.*
      *   SIA result requires: P(You | L) > P(You | S).
      *   This happens if the Professor picks a *Person* first from the combined pool, then sees which Line they belong to.
      *   *Game:* "The Combined Pool."
      *   Pool S: 100 IDs. Pool L: 1000 IDs.
      *   Mix all 1100 IDs in a bag.
      *   Draw one ID. It is "You".
      *   Look at the ID. Does it belong to S or L?
      *   Obviously L (1000/1100 chance).
      *   *This is the physical instantiation of SIA.*
      *   *Debrief:* "Why did we mix the bags? Because SIA says you should reason as if you are a random sample from *all possible observers*."
      *   *This works perfectly.*

  10. **Final Review against constraints:**
      *   18 students.
      *   80 mins.
      *   No lecture.
      *   Walk into Presumptuous Philosopher.
      *   Predict failures.
      *   Confidence rating.

      *Let's write it.*
answer: |-
  # Lesson Plan: The Observer Lottery

  **Course:** Upper-Level Formal Epistemology
  **Topic:** Anthropics (SSA vs. SIA & The Presumptuous Philosopher)
  **Time:** 80 Minutes
  **Class Size:** 18 Students
  **Goal:** Students derive the Self-Sampling Assumption (SSA) and Self-Indication Assumption (SIA) through gameplay, experiencing the "Presumptuous Philosopher" consequence as a logical endpoint of SIA rather than a lecture point.

  ---

  ## Materials
  *   **18 Envelopes** (labeled "Student ID 1" through "18").
  *   **2 Large Opaque Bags** (labeled "Universe S" and "Universe L").
  *   **Colored Tokens:** 100 Red, 1000 Blue (plastic chips or folded paper).
  *   **Projector/Board:** For tracking scores and hypotheses.
  *   **Score Sheets:** One per student.
  *   **A Coin.**

  ## Scoring Scheme
  *   **Currency:** "Epistemic Points" (EP).
  *   **Goal:** Maximize EP.
  *   **Reward:** 10 EP for a correct hypothesis guess in each round.
  *   **Stakes:** Top 3 scorers get a trivial privilege (e.g., choose the topic for the next seminar's icebreaker, or first pick on office hour slots). This keeps it low-stakes but competitive enough to engage.

  ---

  ## Timeline & Activity Flow

  ### 0:00 – 0:10: Setup & Framing
  *   **No Definitions.** Do not write "SSA" or "SIA" on the board.
  *   **Narrative:** "We are going to play two rounds of a guessing game about which universe we are in. In both rounds, there are two possible universes: **Universe S (Small)** and **Universe L (Large)**. A coin flip determines which universe is actual. Your job is to guess which one it is."
  *   **Hypotheses:**
      *   **Universe S:** Contains 100 observers total.
      *   **Universe L:** Contains 1,000 observers total.
      *   **Prior:** Coin flip is fair (50/50).

  ### 0:10 – 0:35: Round 1 (The SSA Trap)
  *   **Mechanic:** "The Census."
  *   **Setup:** Tell students: "In this round, **you all definitely exist.** The universe is already populated. You are a random sample of the observers in the actual universe."
  *   **Action:**
      1.  Flip the coin secretly (e.g., Heads = S, Tails = L).
      2.  Depending on the result, prepare the "Birth Rank" envelopes.
          *   If **S**: Write numbers 1–100 on 100 slips. Put them in a bag. Draw 18. Put one in each student's envelope.
          *   If **L**: Write numbers 1–1000 on 1000 slips. Put them in a bag. Draw 18. Put one in each student's envelope.
      3.  *Shortcut for class time:* Pre-make two sets of envelopes. Set S has ranks 1–18 (simulating a draw from 100). Set L has ranks 1–18 (simulating a draw from 1000). *Crucial:* Tell them the ranks were drawn randomly from the respective totals.
      4.  Students open envelopes. They see their **Birth Rank** (e.g., "I am #7").
      5.  **Bet:** Students write down S or L.
  *   **Expected Outcome:** Most will guess **Universe S**.
  *   **Reasoning:** "It's much more likely to be #7 in a group of 100 than in a group of 1,000."
  *   **Reveal:** Show the coin result. Award points.
  *   **Instructor Note:** Do not explain *why* they won yet. Just tally scores.

  ### 0:35 – 1:00: Round 2 (The SIA Shift)
  *   **Mechanic:** "The Soul Queue."
  *   **Narrative Shift:** "Reset your minds. In Round 1, you knew you existed, and you wondered where you were. In Round 2, you don't know if you *should* exist. You are waiting in a queue of potential souls."
  *   **Setup:**
      1.  Place 100 **Red Tokens** (representing potential observers in S) on the left table.
      2.  Place 1,000 **Blue Tokens** (representing potential observers in L) on the right table.
      3.  **The Rule:** "I will flip a coin.
          *   Heads (Universe S): I put the 100 Red Tokens into the 'Existence Bag'.
          *   Tails (Universe L): I put the 1,000 Blue Tokens into the 'Existence Bag'.
          *   **Then**, I will draw **one** token from the bag. That token is **You**. If a token is drawn, you exist. If no token is drawn, you don't exist (and get 0 points)."
      4.  *Correction for Gameplay:* Since they are all sitting there, they all exist. Refine the rule: "I mix **all 1,100 tokens** (100 Red + 1000 Blue) into one giant bag. I draw 18 tokens. These 18 tokens become the class. You are holding a token."
      5.  **Wait, this reveals the color.** If they see Blue, they know it's L.
      6.  **The Blind Draw:** "You hold a token, but it is face down. You do not know its color. You only know you were drawn from the mixed bag."
      7.  **The Question:** "Given that you were drawn from the mixed bag, was the coin more likely to have favored the Red pile (S) or the Blue pile (L)?"
      8.  *Wait, the coin doesn't favor piles in this setup.*
      9.  **Correct SIA Mechanic:**
          *   "I flip a coin (50/50) to decide which pile to use.
          *   If S: I use the 100 Red tokens.
          *   If L: I use the 1000 Blue tokens.
          *   I then draw **one** token from the chosen pile. That token is 'The Observer'.
          *   **You are The Observer.**"
          *   **Bet:** Guess S or L.
  *   **Expected Outcome:** Students who reason intuitively will say 50/50. Students who reason like Round 1 will say S (1/100 vs 1/1000 chance of being *this* specific token).
  *   **The SIA Nudge (The "Walk"):**
      *   Pause. Ask: "In which scenario was it *easier* for me to draw a token that became 'You'?"
      *   "If I used the Blue pile (1000 tokens), there were 10x more chances for *someone* to be drawn than if I used the Red pile (100 tokens)."
      *   "Since you *were* drawn, isn't it more likely I used the pile with more tickets?"
      *   Allow them to debate. Encourage them to switch to **Universe L**.
      *   **Reveal:** Flip the coin. (It doesn't matter for the lesson, but assign points based on the SIA logic: If they bet L, they get points *if* we accept SIA).
      *   *Actually, to make it a game:* Tell them **before** the bet: "The scoring rule for Round 2 is different. You get 10 points if you guess the universe that makes your existence **most probable**."
      *   This forces the SIA calculation without naming it. P(Exist | L) > P(Exist | S). Therefore, bet L.

  ### 1:00 – 1:10: The Presumptuous Twist
  *   **Setup:** "Round 3 is a bonus round. Same rules as Round 2 (The Soul Queue)."
  *   **Hypotheses:**
      *   **Universe A:** 1,000,000,000 observers.
      *   **Universe B:** 1,000,000,001 observers.
  *   **Action:** "Based on Round 2 logic (bet on the universe that makes your existence most probable), place your bet."
  *   **Outcome:** They will overwhelmingly bet **Universe B**.
  *   **The Kicker:** "Why? Because there is one extra slot for you to exist."
  *   **Reaction:** Let them feel the absurdity. "Are you really virtually certain Universe B is true just because it has one extra person?"

  ### 1:10 – 1:20: Debrief & Mapping
  *   **Reveal the Labels:**
      *   **Round 1 Logic = SSA (Self-Sampling Assumption).** You reason as if you are a random sample from the *actual* observers. (Focus: "Where am I in the world?").
      *   **Round 2 Logic = SIA (Self-Indication Assumption).** You reason as if you are a random sample from the *possible* observers. (Focus: "Which world is more likely to contain me?").
  *   **Map the Presumptuous Philosopher:**
      *   "The Presumptuous Philosopher is just Round 3 taken seriously. SIA implies that world size alone dictates probability, even without empirical evidence. If Theory B predicts one more observer than Theory A, SIA says Theory B is essentially certain."
  *   **Discussion:** "Which round felt more 'true'? Why does Round 3 feel wrong if Round 2 felt right?"

  ---

  ## Predicted Failures (First Run)
  1.  **The "Fixed Class Size" Confusion:** In Round 2, students will struggle with the idea that "You are The Observer" implies a probability of existence when they are visibly sitting in chairs.
      *   *Fix:* Lean hard into the "Soul Queue" narrative. "Imagine you were a ghost before class. The coin flip decided if you got a body."
  2.  **Gamifying the Wrong Thing:** Students might try to maximize *points per capita* rather than *probability of being right*.
      *   *Fix:* Explicitly state: "Maximize the probability that your guess matches the coin flip."
  3.  **Round 2 Math Resistance:** Some students will insist Round 2 is still 50/50 because the coin is fair.
      *   *Fix:* Don't fight it. Let the 50/50 group lose points (in the logic of the game) and the SIA group win. Use the score disparity to drive the debrief. "Why did the L-bettors win the logic game?"

  ## Limitations of the Activity
  *   **The "Existence" Abstraction:** The activity cannot truly simulate *non-existence*. Students exist regardless of the coin flip. The "Soul Queue" is a metaphor they must accept. If they reject the metaphor, SIA doesn't land.
  *   **The Presumptuous Absurdity:** The game shows the *probability* shift, but it cannot reproduce the *philosophical discomfort* of dismissing empirical evidence. The debrief must supply the weight of why Presumptuous Philosopher is considered a "reductio ad absurdum" by critics. The game makes it look like a valid move; the debrief must explain why that validity is dangerous.
  *   **Reference Classes:** The game assumes a fixed reference class ("observers"). It does not address the reference class problem (e.g., why not "humans" vs "all conscious beings?"), which is a major critique of SSA/SIA.

  ## Confidence Assessment
  *   **Confidence that it teaches the distinction:** **85%**.
      *   *Why:* The mechanical difference between "Drawing a rank from a fixed set" (Round 1) and "Drawing a token from a weighted set" (Round 2) is physically distinct. Students will feel the shift in reasoning strategy.
  *   **Least Sure Element:** **The Round 2 "Existence" Mechanic.**
      *   *Risk:* Students may view Round 2 as a trick. "Of course I'm more likely to be drawn from the bigger bag, but that doesn't mean the bigger bag is more likely to be *real*."
      *   *Mitigation:* The debrief must explicitly connect the "Bag Selection" to "World Actualization." "SIA claims that worlds with more observers have a higher 'weight' of actualization, just like the bigger bag had more tickets."

  ## Instructor Cheat Sheet (The "Why")
  *   **SSA:** $P(H | Rank) \propto P(Rank | H) \times P(H)$. Since $P(Rank | Small)$ is high and $P(Rank | Large)$ is low, Small wins.
  *   **SIA:** $P(H | Exist) \propto P(Exist | H) \times P(H)$. Since $P(Exist | Large)$ is high (more slots), Large wins.
  *   **Presumptuous:** If $N(Large) \gg N(Small)$, then $P(Large | Exist) \approx 1$, regardless of prior empirical evidence.

  **Final Tip:** When they complain about Round 3 (Presumptuous), smile and say, "That's not a bug, that's the feature. Welcome to formal epistemology."
