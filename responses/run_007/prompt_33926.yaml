      *   *Salience of "Now":* All parts of the road exist equally *to the observer*. In time, only the "now" feels experientially real (phenomenology).
      *   *Change:* A road doesn't change its shape as you walk it (static). A person changes properties (dynamic). How can $x$ be $F$ and not-$F$? Perdurantism solves this via temporal parts, but the analogy hides the tension.
