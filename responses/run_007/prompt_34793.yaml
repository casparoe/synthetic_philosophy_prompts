answer: |-
  The term you are looking for is **the looping effect** (or **looping effects of human kinds**).

  This concept was developed by the philosopher of science **Ian Hacking**, most notably in his works *The Social Construction of What?* (1999) and the essay "Making Up People" (1986/2007).

  It is the precise technical term for the dynamic you described: a feedback cycle where a classification of people interacts with the people classified, causing changes in the people, which in turn necessitates changes in the classification.

  Here is a detailed breakdown of the concept, its distinctions from related ideas, and why it fits your description best.

  ### 1. The Core Concept: The Looping Effect
  Hacking distinguishes between two types of "kinds" (categories):
  *   **Indifferent Kinds:** Classifications that do not interact with the things classified (e.g., quarks, tectonic plates). Naming a quark does not change how the quark behaves.
  *   **Interactive Kinds:** Classifications of people (e.g., "teenager," "refugee," "autistic," "borderline personality"). When people become aware of how they are classified, they may change their self-conception and behavior in response to that classification.

  **The Loop:**
  1.  **Classification:** A diagnostic category is created (e.g., "Multiple Personality Disorder" in the DSM-III).
  2.  **Awareness:** People are diagnosed and learn the criteria; clinicians learn to look for specific symptoms.
  3.  **Adaptation:** Patients begin to understand their experiences through this new vocabulary. They may unconsciously (or consciously) align their narratives and behaviors with the prototype of the diagnosis.
  4.  **Shift:** The population of people bearing this label begins to look different than the original prototype because they are now living *within* the classification.
  5.  **Revision:** When the manual is revised (e.g., DSM-IV or DSM-5), the criteria are updated to match the *new* reality of the people, who have already been shaped by the *old* criteria.

  Hacking calls this **dynamic nominalism**: the idea that the naming and the named co-evolve. The classification "makes up" the people, but the people also "make up" the classification.

  ### 2. Distinguishing It from Related Concepts
  You correctly noted that this is not simply "labeling theory" or "stigma." Here is how the *looping effect* differs from nearby concepts in sociology and philosophy:

  | Concept | Key Focus | Why it is distinct from your description |
  | :--- | :--- | :--- |
  | **Labeling Theory** (Scheff, Becker) | **Deviance & Stigma.** Focuses on how being labeled causes societal rejection, which pushes the individual further into deviant behavior. | It is largely unidirectional (Label $\rightarrow$ Behavior). It does not typically account for how the *classification system itself* evolves in response to the labeled group. |
  | **Performativity** (Butler, Callon) | **Ontology.** Focuses on how speech acts or descriptions bring a reality into existence (e.g., "calling a gender into being"). | While related, performativity often focuses on the *moment of creation*. The looping effect specifically addresses the *historical, iterative feedback* over time between the system and the subjects. |
  | **Reflexivity** (Giddens, Beck) | **Modernity.** The broader idea that modern society is constantly informed by knowledge about itself, which changes how it acts. | This is the sociological umbrella. The looping effect is the specific *mechanism* of reflexivity applied to psychiatric taxonomy and human kinds. |
  | **Concept Creep** (Nick Haslam) | **Expansion.** Describes how concepts like "trauma" or "bullying" expand semantically over time to include milder experiences. | This describes the *outcome* (the concept gets broader). The looping effect describes the *mechanism* (the people change, forcing the concept to shift). |
  | **Reactivity** (Campbell) | **Measurement.** The phenomenon where measuring a system changes the system (e.g., teachers teaching to the test). | This is usually applied to metrics and indicators. The looping effect is specific to *identity-constituting* classifications. |

  ### 3. Why "The Looping Effect" is the Best Fit
  Your description contains three specific markers that align perfectly with Hacking's formulation:

  1.  **The Classification is Causal:** You noted, "the system itself is among the causes of the very behavior it is trying to track." Hacking argues that the classification is not a neutral net cast over pre-existing behavior; it is a causal engine that alters the behavior.
  2.  **The Iterative Revision:** You mentioned, "When the diagnostic manual is next revised, the category gets updated." Hacking specifically uses the evolution of the DSM (particularly regarding Multiple Personality Disorder and Autism) to illustrate how the *kind* moves through history.
  3.  **Self-Narrative:** You noted people "reshape their self-narratives." Hacking emphasizes that interactive kinds change the *inner life* and self-understanding of the subject, not just their external behavior.

  ### 4. Relevant Literature
  If you wish to explore this further, these are the key texts:

  *   **Ian Hacking, "Making Up People"** (Essay, various editions). This is the seminal text. He outlines the "engine" that makes up people.
  *   **Ian Hacking, *The Social Construction of What?*** (1999). Chapter 4 specifically details the looping effect.
  *   **Ian Hacking, *Mad Travelers* (1998).** A case study of the looping effect in action regarding the diagnosis of "fugue."
  *   **Nikolas Rose, *Governing the Soul* (1989).** While Foucaultian, Rose discusses how psychiatric expertise shapes human subjectivity, which complements Hacking's work.
  *   **Joel Gold & Ian Gold, *Suspicious Minds* (2014).** Discusses looping effects in the context of delusions and psychosis.

  ### Summary
  The established term is **the looping effect** (associated with **Ian Hacking**).

  It captures the specific bidirectional, historical feedback loop where **interactive kinds** (psychiatric diagnoses) alter the people they classify, which in turn forces the classification system to evolve, distinguishing it from simpler models of stigma or self-fulfilling prophecy.
