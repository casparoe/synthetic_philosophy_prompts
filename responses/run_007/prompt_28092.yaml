answer: |-
  ## The Green Room

  | Draft A | Draft B | Draft C |
  | :--- | :--- | :--- |
  | **1.** | **1.** | **1.** |
  | Grey light leaks under the blind. | The blind is tight against the frame. | Light has no source this morning. |
  | **2.** | **2.** | **2.** |
  | A sharp chime cuts the silence. | Silence swells until it chimes. | The chime *is* the silence breaking. |
  | **3.** | **3.** | **3.** |
  | My hand jerks, then remembers the spoon. | The spoon is gone before the jerk. | Hand and spoon lose grip together. |
  | **4.** | **4.** | **4.** |
  | Steel rings against white tile. | Silver sings against warm wood. | Metal meets a floor I cannot see. |
  | **5.** | **5.** | **5.** |
  | Fear arrives after the sound. | Fear arrives and summons the sound. | Fear and sound arrive as one thing. |
  | **6.** | **6.** | **6.** |
  | I am awake. The spoon is on the floor. | I am awake. The floor is empty. | I am awake. The spoon is in my hand. |

  ***

  ### Instructor's Note on Form and Usage

  **Formatting:** For the best effect, print this on a single sheet of paper with the three columns clearly separated (as above), rather than as three sequential stanzas. The visual simultaneity is crucial.

  **Philosophical Payoff:**
  *   **The Title:** "The Green Room" alludes to the theater where actors wait before going on stage. In Dennett's view, there is no "stage" (Cartesian Theater) where consciousness happens. There are only the drafts waiting in the wings, competing for influence. There is no final performance, only the rehearsals.
  *   **The Variations:** Notice how the causal order shifts. In Draft A, perception leads cognition (Sound $\rightarrow$ Fear). In Draft B, cognition leads perception (Fear $\rightarrow$ Sound). In Draft C, the distinction collapses. Dennett argues there is no "fact of the matter" about which happened first in the brain; the timeline is constructed retrospectively.
  *   **The Details:** The material of the spoon (Steel vs. Silver) and the floor (Tile vs. Wood) change. If this were a recording of a "true" experience, these details would be fixed. That they drift suggests that the "experience" is a narrative construction, not a direct feed.
  *   **The Ending:** The three drafts end with contradictory physical realities (Spoon on floor / Floor empty / Spoon in hand). This performs the idea that memory is not a storage bin but a generative process. We do not remember what happened; we remember the last draft we edited.

  **Discussion Question:** *If you had to testify in court about whether the spoon broke, which draft would you swear to? Why does the poem make that choice feel impossible?*
