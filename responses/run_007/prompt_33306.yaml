answer: |-
  You and your friend have independently rediscovered one of the most famous problems in modern philosophy of probability. David Lewis called it **"The Big Bad Bug."** It is the central tension between **Humean Supervenience** (the view that chances are nothing over and above patterns of outcomes) and the **Principal Principle** (the deference principle you described).

  You are stuck because you are trying to hold three things together that are logically inconsistent in your toy model:
  1.  **Humean Supervenience:** Chance is defined by the global pattern of outcomes.
  2.  **The Principal Principle:** Credence should match known chance.
  3.  **Admissibility:** The Principal Principle only applies when you lack "inadmissible" information (information about the future outcome).

  Here is the breakdown of where the argument breaks, which step to reject, and the cost of that rejection.

  ### The Diagnosis: Step (2) is the Trap

  The error lies in the inference in **Step (2)**.

  The Principal Principle (PP) is formally stated like this:
  $$C(A \mid X \cdot E) = x$$
  Where:
  *   $C$ is your credence.
  *   $A$ is the event (Toss 10 is Heads).
  *   $X$ is the proposition that the objective chance of $A$ is $x$.
  *   $E$ is your **admissible** evidence.

  Your argument assumes that the proposition "The chance of Heads is 0.9" is *admissible* evidence. In your toy model, **it is not.**

  Why? Because in your Humean toy model, the proposition "Chance = 0.9" is logically equivalent to "9 out of 10 tosses are Heads." Since you already know 9 are Heads, the proposition "Chance = 0.9" logically entails "Toss 10 is Tails."

  Information that entails the truth or falsity of the outcome is the definition of **inadmissible** evidence. It's like looking at the answer key before taking the test. If you have inadmissible evidence, the Principal Principle does not tell you to set your credence to the chance; it tells you to set your credence to what the evidence dictates (which, in this case, is 0 or 1).

  So, you must reject the application of the Principle in Step (2). You cannot defer to the chance *because* you possess the chance proposition as knowledge, because in this specific metaphysical framework, knowing the chance *is* knowing the future.

  ### The Worry: "Doesn't this gut the principle?"

  You wrote: *"If we instead say any info that's partly about the future is inadmissible, then the principle never applies to real people, since we always know a lot of things about how the future will go."*

  This is the crucial intuition to correct. The inadmissibility clause does not ban *all* knowledge about the future; it bans knowledge that **trumps the chance.**

  1.  **Trivial Future Knowledge:** I know the sun will rise tomorrow. This doesn't make chance inadmissible for a coin toss I do right now. My knowledge of the sunrise doesn't entail the outcome of the coin toss.
  2.  **Humean Chance Knowledge:** In your toy model, knowing the chance *does* entail the outcome of the coin toss.

  In the real world, under a Humean view, we almost *never* know the exact objective chance of an event before it happens. We can estimate it based on past frequencies, but we cannot know the *final* global frequency until the end of time. Therefore, for real human agents, the chance proposition is usually admissible because we don't know it with certainty. We only know it probabilistically.

  So, calling the chance fact "inadmissible" in your toy case doesn't gut the principle for real life; it just highlights that **if** you were omniscient about the Humean mosaic, you wouldn't need chances. You'd just look at the outcomes. Chances are guides for limited beings who *don't* know the future pattern.

  ### The Solution: Two Paths Forward

  To resolve the contradiction, you have to choose which metaphysical bullet to bite.

  #### Path A: Keep the Principal Principle, Reject Humean Supervenience
  This is the move recommended by philosophers like Karl Popper or David Miller (and arguably Lewis's later view).

  *   **The Move:** You deny that chance is *just* the frequency. You adopt a **Propensity** view. Chances are physical dispositions (like fragility or solubility) that exist *now* and produce outcomes, but do not logically entail them.
  *   **How it fixes the argument:** Premise (3) becomes false. Even if the chance of Heads is 0.9, it does *not* mean "9 of 10 tosses *will* land heads." It means "The coin has a 90% disposition toward heads." It is still physically possible for all 10 to be tails, just unlikely.
  *   **The Cost:** You have to accept "spooky" metaphysics. You have to posit objective modalities or dispositions in nature that are not reducible to simple categorical events. This violates the parsimonious Humean picture you said you liked.
  *   **Benefit:** The Principal Principle remains simple and robust. Chance never entails outcome, so chance information is always admissible.

  #### Path B: Keep Humean Supervenience, Modify the Principal Principle
  This is the move David Lewis eventually made. He admitted Humean Supervenience was too attractive to drop, so he had to fix the Principle.

  *   **The Move:** You accept that Humean chance propositions *can* be inadmissible. You adopt the **New Principal Principle**. Instead of deferring to the unconditional chance $C(A \mid X) = x$, you defer to the chance *conditional on the total history*.
  *   **How it fixes the argument:** You acknowledge that in your toy model, the proposition "Chance = 0.9" is inadmissible. The principle simply doesn't apply in Step (2). There is no contradiction because the principle is silent when you have "undermining" information.
  *   **The Cost:** You have to accept that the Principal Principle is more complex than it looks. You also have to accept that we can never *know* the exact Humean chance of a current event with certainty (because to know it is to know the future). We can only have credences *about* what the chance is.
  *   **Benefit:** You keep your nice, clean, non-spooky Humean metaphysics.

  ### Recommendation

  Since you said you **"want to keep the deference principle,"** Path A is the most satisfying for you.

  Reject the Humean toy model's definition of chance. If you define chance as a **propensity** rather than a **frequency**, Premise (3) collapses.
  *   **Old Premise (3):** Chance 0.9 $\rightarrow$ Exactly 9 Heads.
  *   **New Premise (3):** Chance 0.9 $\rightarrow$ 90% tendency, outcome still open.

  If the outcome is still open, you don't know Toss 10 must be Tails. So Step (4) fails. You can consistently hold Credence = 0.9.

  **Why this doesn't ruin your club argument:**
  You can tell your friend: *"The contradiction only arises because we defined chance as a global frequency. If we treat chance as a local physical property (a propensity), knowing the chance doesn't give us a crystal ball. We can keep the Deference Principle intact, but we have to pay the metaphysical price of admitting chances are real features of the world, not just summaries of patterns."*

  If your friend refuses to give up Humeanism, then you must concede that the Deference Principle needs the "New Principal Principle" modification (Path B). In that case, the cost is admitting that **we never strictly know objective chances** in a Humean world; we only estimate them. If we only estimate them, the contradiction vanishes, because we aren't conditioning on the fact "Chance *is* 0.9," but rather on "My evidence suggests chance is *likely* 0.9."

  **Summary of the Exit:**
  1.  **Reject Step (2)'s applicability.** The chance fact is inadmissible evidence in a Humean framework.
  2.  **To save the simplicity of the Principle:** Reject Humeanism (Path A).
  3.  **To save Humeanism:** Accept the "New Principal Principle" (Path B).

  You cannot have Simple Humeanism + Simple Principal Principle. One must go. Given your goal, I suggest sacrificing Simple Humeanism.
