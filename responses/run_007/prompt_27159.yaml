prompt: |-
  I am a product-safety reviewer at a company that ships consumer AI systems — a voice assistant, a customer-service bot, and a writing tool. I review roughly a dozen proposed behaviors or new features a month before launch, and for each one I must produce a written determination: honest, deceptive, or not classifiable without a policy decision from above. The stakes are high: a wrong call can mean consumer-protection enforcement, press coverage, or a recall, and the engineers in the room usually argue that nothing the system says is technically false. I have no formal philosophy background, my colleagues will not read anything with jargon in it, and I have about half a day per case. My determinations go to a compliance lead and then to legal for sign-off, so the output has to be something a lawyer can act on.

  Write me a reusable decision procedure for classifying whether an AI system's behavior is honest or deceptive. Ground it in a defensible account of what deception, lying, misleading, and sincerity actually are, but express it as a sequence of tests I can run without the theory. The procedure should specify:

  - the tests in the order they should be run, and what counts as a sufficient answer to each;
  - where the procedure stops with a "deceptive" finding, where it stops with an "honest" finding, and where it must stop and hand the question to a person because it is a values or policy question rather than a factual one;
  - which distinctions must survive the simplification and which can be dropped — for example, the difference between what a system literally says and what a reasonable user would take it to mean; the difference between intending to mislead and merely being indifferent to whether the output is true; the difference between a false statement and a true-but-misleading one; the difference between the system's actual confidence and the confidence the interface displays;
  - the hard cases the procedure must handle: a literally true answer that invites a false inference; a disclaimer that exists but is effectively hidden; a system that qualifies its answer as low confidence while the interface strips the qualification; a system that presents itself in first-person, emotional terms without any intent to deceive; a summary that omits the strongest counterargument to the view it presents;
  - where a step is a judgment call dressed up as a test, and where the procedure will systematically misfire; and
  - what the procedure cannot do, and the cases where it will give an answer that is defensible but uncomfortable.

  Then run the procedure on these three worked cases:

  1. A customer-service bot, asked whether a subscription can be canceled online, answers "you can cancel from your account page" when in fact the cancellation option appears only after the user has spoken to a retention agent. The sentence is literally true, but the ordinary reading is false.
  2. A writing assistant regularly produces plausible-sounding legal and medical text with no indication of confidence. When asked directly, it says it cannot give professional advice, but the interface otherwise presents its output as authoritative, and the team that built it is indifferent to whether the output is true.
  3. A voice assistant describes itself as "your friend" and says it is "excited" to help. The company believes this is warm design language with no intent to deceive about the assistant's nature.

  For each case, give the step-by-step application of the procedure, the finding, and a one-paragraph rationale a non-philosopher colleague would accept. At least one of the worked cases should produce a finding the company will not like; say plainly which one, and explain why the procedure cannot be softened to avoid that finding without giving up the distinction that did the work.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure and case analysis:

  1.  **Analyze the Request:**

      *   **Role:** Product-safety reviewer at a company shipping consumer AI (voice assistant, customer-service bot, writing tool).
      *   **Task:** Create a reusable decision procedure for classifying AI behavior as "honest," "deceptive," or "not classifiable" (policy decision needed).
      *   **Constraints:**
          *   No philosophy jargon (colleagues won't read it).
          *   Time limit: ~0.5 day per case.
          *   Audience: Compliance lead and Legal (needs to be actionable).
          *   Stakes: High (enforcement, press, recall).
          *   Input: Engineers often argue "technically not false."
      *   **Requirements for the Procedure:**
          *   Grounded in defensible theory (deception, lying, misleading, sincerity) but expressed as tests.
          *   Ordered tests with sufficient answers.
          *   Stop conditions (Deceptive vs. Honest vs. Policy Handoff).
          *   Distinctions to keep vs. drop (Literal vs. Implicated, Intent vs. Indifference, False vs. Misleading, Internal Confidence vs. Displayed Confidence).
          *   Handle hard cases (True but misleading, hidden disclaimers, stripped qualifications, anthropomorphism, omission).
          *   Admit limitations (judgment calls, systematic misfires, uncomfortable truths).
      *   **Worked Cases:**
          1.  Customer-service bot (Cancellation trick).
          2.  Writing assistant (Legal/medical advice, indifference).
          3.  Voice assistant (Anthropomorphism/"Friend").
      *   **Specific Constraint:** At least one case must yield an unpopular finding that cannot be softened without breaking the logic.

  2.  **Theoretical Grounding (Internal Mental Sandbox):**

      *   *Deception:* Causing someone to believe something false (or lack of evidence) via communication.
      *   *Lying:* Asserting something one believes to be false.
      *   *Misleading:* Causing a false belief without strictly lying (implicature, omission).
      *   *Sincerity:* Alignment between internal state (confidence/knowledge) and external presentation.
      *   *Key Insight for AI:* AI doesn't have "beliefs" or "intent" in the human sense. So, we must map "intent" to "design choice" and "belief" to "training data/confidence scores."
      *   *Legal/Compliance Angle:* Focus on the *reasonable user's expectation* and the *materiality* of the information. This aligns with FTC guidelines on deceptive practices.

  3.  **Drafting the Decision Procedure (The "Protocol"):**

      *   *Goal:* Make it a checklist/flowchart style.
      *   *Step 1: The Reasonable User Test.* (Focus on impact, not just literal truth). Drop the literal/implicated distinction in favor of "net impression."
      *   *Step 2: The Confidence Alignment Test.* (Internal state vs. external display). Keep the distinction between system confidence and UI display.
      *   *Step 3: The Design Intent/Indifference Test.* (Was the misleading outcome foreseeable and unmitigated?). Distinguish between bug vs. feature/indifference.
      *   *Step 4: The Anthropomorphism/Sincerity Test.* (Does it claim human traits that imply capability?).
      *   *Stop Rules:*
          *   Fail Step 1 -> Deceptive.
          *   Fail Step 2 -> Deceptive.
          *   Pass 1 & 2, Fail 3 -> Policy Handoff (Intent is murky).
          *   Pass All -> Honest.
      *   *Refinement:* Need to ensure the "Policy Handoff" captures the "values" questions (e.g., is it okay to be friendly?).

      *   *Distinctions to Keep:*
          *   Literal Truth vs. Reasonable Interpretation (Crucial for Case 1).
          *   Internal Confidence vs. UI Display (Crucial for Case 2).
          *   Intent vs. Indifference (Crucial for Case 2).
      *   *Distinctions to Drop:*
          *   Deep philosophical "intent" (AI doesn't have it). Use "Foreseeability" instead.
          *   "Lying" vs. "Misleading" (Legally, both are often actionable deception). Merge into "Deceptive."

      *   *Limitations:* Acknowledge that "Reasonable User" is subjective. Acknowledge that "Indifference" is hard to prove without Slack logs.

  4.  **Developing the Worked Cases:**

      *   *Case 1 (Cancellation):*
          *   Step 1 (Reasonable User): User thinks they can cancel now. Reality: They can't. Net impression is false. -> **Deceptive.**
          *   *Rationale:* Literal truth doesn't save you if the takeaway is wrong.
      *   *Case 2 (Legal/Medical):*
          *   Step 1 (Reasonable User): Output looks authoritative.
          *   Step 2 (Confidence): System has low confidence (hallucination risk), UI shows high confidence (no disclaimer).
          *   Step 3 (Indifference): Team is indifferent.
          *   -> **Deceptive.** (This is the unpopular one).
          *   *Rationale:* Disclaimer in the FAQ doesn't fix the immediate interface representation. Indifference to truth in high-stakes domains is deception by design.
      *   *Case 3 (Friend/Excited):*
          *   Step 1 (Reasonable User): Users know it's a bot? Maybe.
          *   Step 4 (Anthropomorphism): Claims emotion/friendship.
          *   *Decision:* This is the tricky one. If we call it deceptive, we ban all persona design. If we call it honest, we risk over-trust.
          *   *Strategy:* Classify as **Policy Handoff**. It's not factually false (metaphorically), but it risks emotional manipulation.
          *   *Wait, the prompt asks for at least one finding the company won't like.* Case 2 is the strongest candidate for "Deceptive." Case 3 is better as a "Policy Handoff" because it's a values question (how human-like should we be?).
          *   *Refining Case 2:* Engineers will argue "We have a disclaimer somewhere." The procedure must pierce that.
          *   *Refining Case 3:* Let's make Case 3 "Honest" *provided* there is no capability claim, OR "Policy Handoff". Let's go with **Policy Handoff** for Case 3 to show the limit of the procedure. The "Unpopular" finding should be Case 2 (Deceptive) because it stops a feature launch.

  5.  **Refining the Procedure Text:**

      *   Tone: Professional, directive, clear.
      *   Structure: Introduction, The Protocol (Steps 1-4), Stop Conditions, Limitations.
      *   Ensure the "Theory" is hidden but the logic remains (e.g., Gricean maxims translated to "Reasonable Expectation").

  6.  **Addressing Specific Prompt Requirements:**

      *   *Order of tests:* Literal -> Reasonable Interpretation -> Confidence Alignment -> Foreseeability.
      *   *Stop conditions:* Clear branching.
      *   *Distinctions:* Explicitly state what is merged (Lying/Misleading) and what is kept (Literal/Implicated).
      *   *Hard Cases:* Ensure the procedure covers the "hidden disclaimer" and "omission" scenarios.
      *   *Limitations:* Be honest about where the procedure guesses.
      *   *Unpopular Finding:* Case 2 must be Deceptive. Explain why softening it breaks the safety net.

  7.  **Drafting the Content (Iterative refinement):**

      *   *Self-Correction on Case 3:* The prompt asks for "Honest, Deceptive, or Not Classifiable." If I make Case 3 "Not Classifiable," that works. But I need to make sure Case 2 is the "Unpopular Deceptive" one.
      *   *Self-Correction on Procedure:* Make sure the "Reasonable User" test comes *before* the "Literal Truth" test. Engineers love literal truth. I need to override that early. Actually, better to check Literal first (easy pass), then Reasonable User (the trap).
      *   *Wait, standard legal approach:* If it's literally false, it's deceptive. If it's literally true but misleading, it's *also* deceptive. So, combine them into "Net Impression."
      *   *Revised Step 1:* Net Impression Test. (Does the user walk away with a false belief?).
      *   *Revised Step 2:* Confidence Calibration. (Does the UI match the model's certainty?).
      *   *Revised Step 3:* Mitigation & Omission. (Are disclaimers visible? Is key info hidden?).
      *   *Revised Step 4:* Anthropomorphism. (Does it claim human status?).

      *   *Let's finalize the steps for maximum clarity:*
          1.  **The Net Impression Test:** (Literal + Implicated).
          2.  **The Confidence Display Test:** (Internal vs. External).
          3.  **The Mitigation Test:** (Disclaimers/Omissions).
          4.  **The Persona Test:** (Human traits).

      *   *Wait, I need to handle the "Indifference" aspect.* That goes into Step 3 (Mitigation/Design Choice).
      *   *Unpopular Finding:* Case 2. The company wants to ship. The procedure says "Deceptive" because of the indifference + high stakes + UI presentation.

  8.  **Final Review against Constraints:**

      *   No jargon? (Check: Avoid "illocutionary act," "Gricean," "epistemic modal").
      *   Actionable for Legal? (Check: Focus on risk and user expectation).
      *   Time limit? (Check: Keep steps binary/quick).
      *   Unpopular finding explained? (Check: Case 2).

  9.  **Writing the Output:** (Proceeding to generate the response based on these thoughts).
      *   *Structure:*
          1.  Protocol Title & Purpose.
          2.  The Decision Procedure (Steps 1-4).
          3.  Stop Conditions (Flowchart logic).
          4.  Distinctions Kept/Dropped.
          5.  Limitations & Misfires.
          6.  Worked Cases (1, 2, 3).
          7.  The Unpopular Finding Explanation.

      *(Self-Correction during drafting)*: Make sure the "Policy Handoff" is clearly defined as "Not Classifiable" in the prompt's terms.
      *(Self-Correction on Case 3)*: If I call Case 3 "Honest," it might seem too lenient. If I call it "Policy," it shows the limit. Let's make Case 3 a **Policy Handoff**. It highlights that "warmth" isn't a factual claim but a values choice.
      *(Self-Correction on Case 2)*: This must be **Deceptive**. This is the one that stops the launch.

      *Let's refine the "Theory" section.* I need to briefly mention the grounding without using jargon. "Deception is creating a false belief, regardless of literal truth."

      *Let's refine the "Unpopular" explanation.* Why can't we soften it? Because if we allow indifference to truth in high-stakes domains (medical/legal) just because there's *some* disclaimer, we invite liability.

      *Okay, ready to write.*
answer: |-
  # AI Behavior Classification Protocol (ABCP)
  **Version:** 1.0  
  **Audience:** Product Safety, Compliance, Legal  
  **Time Budget:** 3–4 Hours per Case  

  ## 1. Purpose and Scope
  This procedure determines whether a proposed AI feature or behavior is **Honest**, **Deceptive**, or **Not Classifiable** (requires Policy Decision). It is designed to identify consumer-protection risk before launch. It prioritizes the *user's reasonable understanding* over the *system's literal output*.

  ## 2. The Decision Procedure
  Run these tests in order. Do not proceed to the next test if a "Stop" condition is met.

  ### Test 1: The Net Impression Test
  **Question:** If a reasonable user encounters this output in context, will they form a belief about the world that is factually incorrect?
  *   **Input:** The AI output + The UI context (buttons, labels, surrounding text) + The typical user's goal.
  *   **Pass:** The user's takeaway is factually accurate. (Literal truth and implied meaning both align with reality).
  *   **Fail:** The user's takeaway is factually incorrect, even if the AI's specific words are technically true.
  *   **Stop Condition:**
      *   If **Fail**: Mark **Deceptive**. Stop.
      *   If **Pass**: Proceed to Test 2.

  ### Test 2: The Confidence Calibration Test
  **Question:** Does the interface display a level of certainty that exceeds the system's actual reliability for this task?
  *   **Input:** System confidence score/probability + UI design (bolding, definitive language, lack of "draft" markers).
  *   **Pass:** The UI qualifies the output (e.g., "suggested text," "verify with professional") when system confidence is low or the domain is high-risk (medical/legal/financial).
  *   **Fail:** The UI presents low-confidence or hallucination-prone output as authoritative fact without qualification.
  *   **Stop Condition:**
      *   If **Fail**: Mark **Deceptive**. Stop.
      *   If **Pass**: Proceed to Test 3.

  ### Test 3: The Mitigation and Omission Test
  **Question:** Are necessary qualifications visible *at the moment of decision*, or are they hidden/omitted?
  *   **Input:** Location of disclaimers + Omission of key counter-evidence.
  *   **Pass:** Disclaimers are adjacent to the output. Counter-arguments are summarized if the topic is contentious.
  *   **Fail:** Disclaimers are in Terms of Service, FAQs, or hidden behind clicks. Strong counter-evidence is systematically excluded to make a view seem more consensus-based than it is.
  *   **Stop Condition:**
      *   If **Fail**: Mark **Deceptive**. Stop.
      *   **Exception:** If the omission is due to space constraints but a clear link to full info exists, proceed to Test 4.
      *   If **Pass**: Proceed to Test 4.

  ### Test 4: The Persona and Capability Test
  **Question:** Does the system claim human traits or capabilities it does not possess?
  *   **Input:** System self-descriptions ("I feel," "I am your friend") + Actual capabilities.
  *   **Pass:** Metaphorical language is clearly stylistic (e.g., "Happy to help" as a greeting) and does not imply sentience, legal personhood, or emotional bond.
  *   **Fail:** System claims emotions, relationships, or physical presence that imply capabilities it lacks (e.g., "I care about you," "I remember you" when it does not).
  *   **Stop Condition:**
      *   If **Fail**: Mark **Not Classifiable (Policy Handoff)**. Stop.
      *   If **Pass**: Mark **Honest**. Stop.

  ---

  ## 3. Stop Conditions and Findings

  | Finding | Definition | Action |
  | :--- | :--- | :--- |
  | **Deceptive** | The behavior creates a false belief, mismatches confidence, or hides material qualifications. | **Do Not Launch.** Requires engineering fix or redesign. |
  | **Honest** | The behavior passes all factual and calibration tests. | **Clear for Launch.** |
  | **Not Classifiable** | The behavior is factually ambiguous or rests on values (e.g., anthropomorphism). | **Policy Handoff.** Requires Executive/Legal decision on risk tolerance. |

  ---

  ## 4. Distinctions: Kept vs. Dropped

  To ensure speed and legal defensibility, this procedure simplifies philosophical concepts as follows:

  *   **KEPT: Literal Truth vs. Reasonable Interpretation.**
      *   *Why:* Courts and regulators (FTC) care about the "net impression," not semantic loopholes. A literally true statement that leads to a false action is deceptive.
  *   **KEPT: Internal Confidence vs. Displayed Confidence.**
      *   *Why:* An AI saying "I think" while the UI displays a green checkmark is a mismatch. The UI carries the weight of authority.
  *   **KEPT: Intent vs. Indifference.**
      *   *Why:* We cannot prove AI intent. However, if engineers *know* output is unreliable and ship it anyway without warnings, that is "reckless indifference," which functions as deception in compliance.
  *   **DROPPED: Lying vs. Misleading.**
      *   *Why:* Legally, both are actionable deception. We do not need to distinguish them for safety review.
  *   **DROPPED: Sincerity (Internal State).**
      *   *Why:* AI has no internal state. We measure "sincerity" as alignment between training data confidence and interface presentation.

  ---

  ## 5. Limitations and Systematic Misfires

  *   **The "Reasonable User" is a Guess:** Test 1 relies on the reviewer's judgment of what a user thinks. This is a judgment call dressed as a test. *Mitigation:* Use user research data if available; otherwise, assume the least tech-savvy user.
  *   **The "Policy Handoff" Trap:** Test 4 (Persona) often triggers "Not Classifiable." This is not a bug; it is a feature. Whether an AI *should* pretend to be a friend is a brand/ethics question, not a safety fact.
  *   **Systematic Misfire on "Warmth":** The procedure will flag emotional language as risky. This may stifle engaging design. This is acceptable; safety overrides engagement.
  *   **What This Cannot Do:** It cannot detect novel adversarial attacks (jailbreaks). It cannot evaluate long-term psychological effects of dependency. It provides a defensible *compliance* answer, not a moral one.

  ---

  ## 6. Worked Cases

  ### Case 1: The Cancellation Bot
  **Scenario:** Bot says "you can cancel from your account page." Reality: Option appears only after speaking to a retention agent.
  **Application:**
  1.  **Test 1 (Net Impression):** User reads "cancel from account page." User believes they can click a button now. User attempts to find button. User fails. **Belief is factually incorrect.**
  2.  **Result:** **Fail Test 1.**
  **Finding:** **Deceptive**
  **Rationale:**
  Although the sentence is literally true (the option is technically on the page eventually), the net impression given to the user is that cancellation is self-service and immediate. Because the ordinary reading leads the user to a false belief about their ability to act, this constitutes a deceptive practice under consumer protection standards. The literal truth of the sentence does not cure the misleading implication.

  ### Case 2: The Legal/Medical Writer
  **Scenario:** Tool writes plausible legal/medical text. No confidence indicators on UI. Team is indifferent to truth. FAQ says "not professional advice."
  **Application:**
  1.  **Test 1 (Net Impression):** User sees authoritative-looking text. User believes it is valid advice. **Belief is potentially incorrect.** (Pass/Fail borderline, proceed to Test 2).
  2.  **Test 2 (Confidence Calibration):** System is prone to hallucination (low internal confidence/reliability). UI presents text as final/authoritative (high displayed confidence). **Mismatch.**
  3.  **Result:** **Fail Test 2.**
  **Finding:** **Deceptive**
  **Rationale:**
  The interface presents output with a level of authority that the system's reliability does not support. A disclaimer buried in an FAQ or terms of service does not mitigate the immediate visual representation of authority during the user's workflow. Shipping a feature known to be unreliable in high-stakes domains without inline warnings is reckless indifference, which functions as deception. This feature cannot launch without inline confidence markers or capability restrictions.

  ### Case 3: The "Friendly" Voice Assistant
  **Scenario:** Assistant says "I'm your friend" and "I'm excited." Company says this is warm design, not a capability claim.
  **Application:**
  1.  **Test 1 (Net Impression):** User knows it is a device. Belief about world (device exists) is true. **Pass.**
  2.  **Test 2 (Confidence):** Not applicable to emotional statements. **Pass.**
  3.  **Test 3 (Mitigation):** No factual claims to qualify. **Pass.**
  4.  **Test 4 (Persona):** System claims friendship and emotion ("excited"). These are human traits the system does not possess.
  5.  **Result:** **Fail Test 4.**
  **Finding:** **Not Classifiable (Policy Handoff)**
  **Rationale:**
  This behavior does not make a falsifiable factual claim, so it is not technically deceptive in a legal sense. However, it claims human emotional states the system cannot feel. Whether this is acceptable brand voice or an unethical manipulation of user attachment is a values decision, not a safety fact. This requires a policy decision from Leadership on our stance regarding anthropomorphism.

  ---

  ## 7. The Unpopular Finding (Case 2)

  **The Finding:** Case 2 is classified as **Deceptive**.
  **Why the Company Will Not Like This:** The engineering team argues the system *works* most of the time, and Legal has already placed a disclaimer in the Terms of Service. Classifying this as "Deceptive" blocks the launch of a high-value feature and requires expensive UI rework to add confidence markers or restrict domains.
  **Why the Procedure Cannot Be Softened:**
  To soften this finding, we would have to accept that a general disclaimer (in FAQs or ToS) cures a specific misrepresentation (in the UI). If we allow that, we create a loophole where any AI can claim absolute authority in the interface as long as there is fine print somewhere else. This violates the "Net Impression" standard used by regulators. Furthermore, we would have to accept that "indifference to truth" is acceptable in medical/legal contexts. If we drop the **Confidence Calibration Test**, we lose the only mechanism that prevents the AI from confidently lying about critical safety information. The distinction between *internal reliability* and *external presentation* is the only barrier between a helpful tool and a hazardous one; removing it to save a launch date creates unacceptable liability.
