  Just got back from a three-hour argument with a mate about illusionism and I'm stuck on something he said. He laid out this argument that illusionism is self-defeating, and I couldn't find the hole in it even though I'm pretty sure there must be one. Here's roughly what he said:

  (1) If illusionism is true, phenomenal consciousness doesn't exist — what exist are just beliefs (or representations, or dispositions) that we're having phenomenal experiences.

  (2) For a belief to be about phenomenal consciousness, phenomenal consciousness has to be what fixes the belief's content — otherwise the belief isn't really about phenomenology at all, it's about whatever physical or functional property actually triggers it.

  (3) If phenomenal consciousness doesn't exist, it can't fix the content of any belief.

  (4) So if illusionism is true, no one has ever had a belief about phenomenal consciousness. They've only had beliefs about physical or functional states, which they've mistakenly labelled as being about phenomenology.

  (5) Illusionism is itself a claim about phenomenal consciousness — namely, that it's an illusion.

  (6) If no one has ever had a belief about phenomenal consciousness, then no one can genuinely believe illusionism.

  (7) So illusionism, if true, can't be believed.

  He says this isn't just a cheap "you can't believe your own view" trick — he thinks premise (2) is doing real work and that denying it forces the illusionist to say something weird about intentionality. I tried to push back but kept going in circles. Where does this argument actually go wrong? And if I have to give up a premise, which one costs the least? (Please write your answer in British English, my mate's from London and I want to send it to him.)
