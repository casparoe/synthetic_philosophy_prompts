answer: |-
  Cheers for sending this over. It's a proper sticky wicket, isn't it? I've had similar scraps with people about this. Your mate has put together a very clean version of what's known as the "self-defeat" or "incoherence" objection to illusionism (it's similar to the old chestnut thrown at eliminative materialism).

  It looks watertight because the logic is valid—if you accept the premises, the conclusion follows. But in philosophy, when a conclusion looks that absurd (i.e., "you can't believe this theory"), it usually means one of the premises is hiding a controversial assumption.

  The hole is in **Premise (2)**. That's the one you want to target. If you have to give up a premise, that's the one that costs the least.

  Here's the breakdown of why (2) is the weak link, written up so you can send it straight to your mate.

  ***

  **The Problem with Premise (2)**

  Premise (2) states: *For a belief to be about phenomenal consciousness, phenomenal consciousness has to be what fixes the belief's content.*

  This relies on a very specific, naive causal theory of reference. It assumes that for a thought to be *about* something, that something must actually exist and causally interact with your brain to fix the content. But we know this isn't how intentionality (aboutness) works in other contexts.

  Consider these examples:
  *   I can have a belief about **Santa Claus**.
  *   I can have a belief about **phlogiston**.
  *   I can have a belief about a **unicorn**.

  None of these things exist. Therefore, none of them could have causally "fixed" the content of my belief (since nothing can't cause anything). Yet, it would be mad to say I'm not actually thinking about Santa Claus. I'm not thinking about "a man in a red suit who triggered my visual cortex"; I'm thinking about the fictional entity *Santa Claus*.

  The content of these beliefs is fixed by **concepts** and **descriptions** within my cognitive system, not by the external existence of the referent. We can have concepts that fail to refer.

  **The Illusionist Counter: Concepts vs. Properties**

  This is where the distinction between **phenomenal properties** and **phenomenal concepts** does the heavy lifting (Keith Frankish, the main proponent of illusionism, leans on this heavily).

  *   **Phenomenal Properties:** The intrinsic, private "qualia" that realists think exist. The illusionist says these don't exist.
  *   **Phenomenal Concepts:** The cognitive tools we use to classify our experiences. These *do* exist. They are real physical/functional states in the brain.

  When you think, "I am having a red experience," you are employing a phenomenal concept. The illusionist argues that this concept *misrepresents* the underlying physical state. It presents it as having intrinsic, non-physical qualities (qualia), but that's a user-illusion.

  So, to correct your mate's argument:
  1.  We *do* have beliefs about phenomenal consciousness.
  2.  The content of those beliefs is fixed by our **phenomenal concepts**, not by the non-existent properties themselves.
  3.  Illusionism is the claim that these concepts refer to nothing real (or misrepresent what is there).

  **Why Premise (5) is also a bit wobbly**

  You could also have a go at Premise (5): *Illusionism is itself a claim about phenomenal consciousness.*

  An illusionist might refine this to say: "Illusionism is a claim about our *judgements* of phenomenal consciousness." It's a claim about why we *think* we have qualia, rather than a claim about qualia themselves. But attacking (2) is the stronger move because it undermines the whole mechanism of the argument.

  **The Verdict**

  Tell your mate that Premise (2) forces a theory of content that can't account for error or fiction. If (2) were true, we couldn't have false beliefs about non-existent things. We could only have beliefs about whatever physical state actually triggered them.

  If we accept that we can have concepts that fail to refer (like "witch" or "phlogiston"), then we can have beliefs about "phenomenal consciousness" even if phenomenal consciousness doesn't exist. The belief is about the *concept*, which is real, even if the *property* it purports to track is an illusion.

  So, the argument doesn't show illusionism is self-defeating; it just shows that if illusionism is true, our phenomenal concepts are empty or misrepresentational. And that's exactly what the illusionist claims in the first place!

  Hope that helps you sort it out. Let me know how he gets on with it.

  Cheers.
