      *   *Section 1: Nuclear Repositories.* Focus on Stewardship and Non-Maleficence. Note the assumption of continuity.
      *   *Section 2: Climate Discounting.* Focus on Economic Utilitarianism. Explain *why* discounting happens (pure time preference + growth).
      *   *Section 3: The Doomsday Argument.* Explain it briefly. Does it undermine DGRs? Not necessarily. DGRs are conditional: *If* they exist, protect them.
      *   *Section 4: Reconstructing Obligations.* Contrast "Negative Rights" (Nuclear) vs. "Aggregate Welfare" (Climate).
      *   *Section 5: Verdict on Consistency.* It is a genuine ethical inconsistency, though perhaps pragmatically explainable. The DA adds uncertainty but doesn't resolve the ethical clash.
