      *(Final thought on DA)*: The DA suggests we shouldn't *expect* 100k years. But policy isn't about expectation of probability alone; it's about risk management. If the risk is extinction-level, low probability still warrants action. DGRs assume survival *conditional* on not messing up the waste.

