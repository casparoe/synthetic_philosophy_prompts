answer: |-
  The juxtaposition of deep geological repositories (DGRs) for nuclear waste and standard cost-benefit analyses (CBA) for climate change reveals a profound temporal schizophrenia in modern governance. On one hand, we act as eternal stewards, spending billions to protect beings 100,000 years hence from our radioactive byproducts. On the other, we act as short-term utilitarians, mathematically evaporating the suffering of beings only a few centuries hence through discount rates.

  To resolve whether this inconsistency is genuine or apparent, and how the Doomsday Argument fits into this landscape, we must reconstruct the implicit anthropological and ethical theories underpinning each practice.

  ### 1. The Nuclear Repository: Presuppositions of Continuity and Stewardship

  The construction of a DGR presupposes a specific theory of time and obligation.

  **The Anthropological Presupposition (Lifespan):**
  By engineering markers and containment systems for 100,000 years, nuclear regulators implicitly reject the pessimistic implications of the Doomsday Argument. They are betting on **civilizational continuity**. They assume that:
  1.  Humanity (or successor intelligences) will survive for at least 100,000 years.
  2.  Future entities will possess enough technological capacity to be harmed by radiation (i.e., they will be drilling or excavating) but perhaps not enough to neutralize it without warning.
  3.  Social structures will persist sufficiently that "warning" is a meaningful concept.

  If the Doomsday Argument is correct—that we are likely near the median of the human timeline and that total human duration might be much shorter than 100,000 years—then the DGR is a monument to hubris, protecting against a hazard that will outlast the species it is meant to protect. However, the practice treats the probability of long-term survival as high enough to warrant investment.

  **The Ethical Presupposition (Obligation):**
  The ethical framework here is **deontological and liability-based**. It rests on the principle of *non-maleficence* across time. The logic is: "We created this poison; therefore, we are responsible for containing it, regardless of the cost to the present."
  *   **Rights of the Future:** It treats future people as rights-holders who have a claim not to be harmed by specific artifacts we leave behind.
  *   **Incommensurability:** It suggests that certain harms (radiation poisoning, genetic damage) cannot be traded off against present economic convenience. The cost is "whatever it takes," not "whatever is efficient."

  ### 2. Climate Cost-Benefit Analysis: Presuppositions of Substitution and Discounting

  Standard climate CBA operates on a radically different temporal logic, governed by the Ramsey Rule for discounting ($r = \rho + \eta g$).

  **The Anthropological Presupposition (Lifespan):**
  Climate models often run centuries out, but the discounting mechanism implies that the *identity* and *existence* of specific future individuals matter less than aggregate welfare. It does not necessarily deny long-term survival, but it assumes **economic continuity**. It presupposes that future generations will be wealthier (due to growth rate $g$) and thus better able to adapt to climate harms than we are.

  **The Ethical Presupposition (Obligation):**
  The ethical framework is **weighted utilitarianism**.
  *   **Pure Time Preference ($\rho$):** This parameter asserts that a life saved today is intrinsically more valuable than a life saved in 2500. This is often justified by "societal impatience" or the probability of extinction, but ethically it implies a discrimination against the future.
  *   **Substitutability:** It assumes natural capital (a stable climate) can be substituted by manufactured capital. If we grow rich enough, we can buy our way out of climate damage (sea walls, geoengineering).
  *   **Aggregation:** Unlike the specific liability of nuclear waste, climate change is treated as a systemic externality. The obligation is to optimize total welfare, not to avoid specific harms to specific future individuals.

  ### 3. The Doomsday Argument and Reconciliation

  The Doomsday Argument (DA) suggests that, barring new information, we should not expect to be among the very first humans of a trillion-year civilization. If true, a 100,000-year horizon is statistically suspect.

  **Does the Repository Practice Reject the DA?**
  Yes, operationally. DGRs act as if the "Long Future" is the baseline. However, they can be reconciled with the DA through a **conditional obligation** framework. The logic shifts from "Humanity *will* exist for 100,000 years" to "*If* humanity exists for 100,000 years, they must not be killed by our waste."
  Because the consequence of failure (radiation poisoning surviving civilizations) is catastrophic, the low probability of long-term survival (suggested by DA) does not negate the duty to act. It is a Pascal's Wager of waste management: if there is *any* chance of a long future, the hazard must be contained.

  **Can Both Practices be Reconciled with the DA?**
  Yes, but only if climate policy adopts the same conditional risk management. If we accept the DA, the probability of extinction rises, which should arguably *increase* the discount rate (why save for a future that won't exist?). However, this creates a perverse incentive: if we think extinction is likely, we should pollute more.
  To reconcile them, we must view the DA not as a reason to discount the future, but as a reason to **reduce existential risk**. Nuclear waste is a localized existential risk; climate change is a systemic one. If the DA warns us that our timeline might be short, we should be *more* aggressive on climate change to ensure the timeline extends, rather than using the DA to justify discounting future lives.

  ### 4. Reconstructing the Theories of Intergenerational Obligation

  The inconsistency stems from two competing theories of obligation:

  **Theory A: The Trustee Model (Nuclear)**
  *   **Metaphor:** We are trustees of an estate we are damaging.
  *   **Duty:** Negative duty (Do No Harm).
  *   **Scope:** Specific, identifiable hazards created by human agency.
  *   **Valuation:** Infinite/Lexical (safety trumps cost).
  *   **Time:** Indefinite.

  **Theory B: The Investor Model (Climate)**
  *   **Metaphor:** We are investors managing a portfolio across time.
  *   **Duty:** Positive duty (Maximize Welfare).
  *   **Scope:** General systemic conditions.
  *   **Valuation:** Finite/Trade-off (costs weighed against benefits).
  *   **Time:** Discounted.

  ### 5. Verdict: Is the Inconsistency Genuine?

  The inconsistency is **genuine**, not merely apparent. It represents a failure of moral imagination in economic modeling that is corrected (perhaps by regulatory necessity) in nuclear engineering.

  1.  **Moral Arbitrariness:** There is no ethical justification for valuing a life in the year 3000 (nuclear) significantly higher than a life in the year 2500 (climate). If the "pure time preference" in climate discounting is ethically indefensible (as philosophers like Ramsey and Pigou argued), then the nuclear practice is ethically superior, and climate policy is morally deficient.
  2.  **The "Artifact" Distinction:** Defenders of the status quo might argue the inconsistency is apparent because nuclear waste is a *deliberate artifact* while climate change is a *byproduct of living*. We have a stricter duty not to leave "traps" (waste) than to optimize the "background conditions" (climate). However, given the scale of climate harm, this distinction collapses. A destabilized climate is as much a "trap" as a spent fuel rod.
  3.  **Political Economy:** The inconsistency is likely pragmatic rather than philosophical. Nuclear waste requires a license to operate *now*; regulators demand a 100,000-year plan to grant it. Climate change is diffuse; no single entity is liable, allowing the use of discount rates to minimize immediate political pain.

  ### Conclusion

  The nuclear repository practice presupposes a **Long Future** and a **Strict Liability** ethic. It implicitly rejects the Doomsday Argument's pessimism by acting as if the future is long, or at least by hedging against the catastrophe of it being long and poisoned.

  Climate discounting presupposes a **Discounted Future** and a **Weighted Utilitarian** ethic. It treats the future as a foreign country whose currency is worth less than ours.

  These practices are inconsistent. We cannot coherently claim to be guardians of the deep future while simultaneously mathematically erasing the welfare of that same future in our primary economic planning. To reconcile them, we must either abandon the 100,000-year stewardship of nuclear waste as a wasteful fantasy (accepting the Doomsday Argument's limits) or, more ethically, abolish pure time preference in climate economics. The latter implies acknowledging that our obligation to the future is not determined by our ability to pay for it today, but by the severity of the harm we inflict tomorrow. The nuclear model offers the correct ethical template: when the harm is irreversible and catastrophic, discount rates must drop to zero.
