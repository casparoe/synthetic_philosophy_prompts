answer: |-
  # HANDOUT: The Selection Locus Decision Tree
  **Topic:** Dennett's Taxonomy of Competence (Darwinian, Skinnerian, Popperian, Gregorian)  
  **Goal:** Classify a system by the *highest* locus of selection it utilizes.  
  **Note:** These categories are nested. A Gregorian creature is also Popperian, Skinnerian, and Darwinian. This tree identifies the **most advanced** trial-and-error loop the system runs.

  ---

  ## PART 1: THE DECISION TREE
  *(Start at Node 1. Follow the arrows based on the concrete case.)*

  **NODE 1 (Root): Locus of Lifetime Change**  
  *Question:* Does a single individual change its behavioral strategy **within its own lifetime** based on experience, or is novelty introduced *only* by the differential survival/reproduction of whole organisms across generations?  
  *   **NO** (Strategy is fixed at birth; only the population changes) → **GO TO LEAF A**  
  *   **YES** (Individual adapts during life) → **GO TO NODE 2**

  **NODE 2: Locus of Consequence**  
  *Question:* To learn that a specific action is "bad," must the creature **actually perform the action** and suffer the environmental consequence at least once?  
  *   **YES** (Selection happens via real-world reinforcement/punishment) → **GO TO LEAF B**  
  *   **NO** (The creature can reject an option *before* performing it) → **GO TO NODE 3**

  **NODE 3: Locus of the Selector**  
  *Question:* Is the internal filter that rejects options made of **private neural states**, or is the filter itself constructed from **public, shareable objects** (words, diagrams, tools) that other minds can pass around and improve?  
  *   **PRIVATE** (Simulation runs on innate/learned internal models) → **GO TO LEAF C**  
  *   **PUBLIC** (Cognition is offloaded onto cultural mind-tools) → **GO TO LEAF D**

  ---

  ## PART 2: THE LEAVES (Classification & Commitments)

  **LEAF A: Darwinian Creature**  
  *Definition:* Competence arises solely from blind variation and selective retention in the gene pool.  
  *   **Awkward Commitment:** This creature cannot adapt to rapid environmental change within a lifetime; it must die to learn.

  **LEAF B: Skinnerian Creature**  
  *Definition:* Competence arises from operant conditioning; the environment selects behaviors via reinforcement history.  
  *   **Awkward Commitment:** This creature cannot learn from lethal mistakes; a single fatal error terminates the learning loop permanently.

  **LEAF C: Popperian Creature**  
  *Definition:* Competence arises from internal simulation; hypotheses die in the creature's stead before action.  
  *   **Awkward Commitment:** This creature requires a pre-existing, accurate internal model of the world (raising the question: where did *that* model come from?).

  **LEAF D: Gregorian Creature**  
  *Definition:* Competence arises from cultural selection; the creature uses shared "mind-tools" to re-describe problems and borrow selectors.  
  *   **Awkward Commitment:** A lone Gregorian with no culture is nearly a contradiction; most competence is outsourced to the population, not the individual brain.

  ---

  ## PART 3: ANALYTICAL NOTES FOR DISCUSSION

  ### 1. Underdetermined Pairs (The Observation Problem)
  *   **Skinnerian vs. Popperian:** Behaviorally indistinguishable in many cases. If a rat avoids a shock, did it simulate the shock (Popperian) or recall the pain (Skinnerian)? Internal pre-testing leaves no necessary external trace.
  *   **Popperian vs. Gregorian:** Blurry when "private" thought relies on internalized speech. If a chimp mentally rehearses box-stacking, is it running a private simulation (Popperian) or redeploying a borrowed representation of "stacking" (Gregorian)? The boundary depends on whether the *representation itself* is a cultural artifact.

  ### 2. Empty Logic Space (Combinations with No Occupants)
  *   **Gregorian without Popperian (Node 3=YES, Node 2=YES):** *Incoherent.* You cannot use external mind-tools to filter options without an internal mechanism to simulate their use.
  *   **Popperian without Skinnerian (Node 2=NO, Node 1=YES, but no reinforcement history):** *Unstable.* An internal simulator must be calibrated by real-world consequences (Skinnerian feedback) or evolution (Darwinian), otherwise it hallucinates.
  *   **Skinnerian without Darwinian (Node 2=YES, Node 1=NO):** *Impossible.* A physical organism capable of reinforcement learning must have a substrate that survived selection; there is no "floating" Skinnerian agent.

  ---

  ## PART 4: WORKED EXAMPLE
  **Case:** The Honeybee Waggle Dance (Forager Bee)

  **Scoring through the Tree:**
  1.  **Node 1 (Lifetime Change):** Does the bee change foraging strategy within its life? **YES.** (It adjusts based on nectar availability). *→ Proceed to Node 2.*
  2.  **Node 2 (Consequence):** To learn a patch is empty, must it fly there and check? **YES.** (It cannot simulate nectar yield internally; it must incur the energy cost of flight). *→ Proceed to Leaf B.*
  3.  **Node 3 (Selector):** *Skipped.* (Since it failed Node 2, it cannot reach the Gregorian rung).

  **Classification:** **Skinnerian Creature** (nested on top of Darwinian).

  **Discussion:**
  *   **Why not Gregorian?** The dance transmits *data* (location), but it does not provide the receiver with a new *tool for thinking*. The receiver does not re-describe the problem using the dance; it simply executes a vector. The "selector" remains the bee's innate drive for nectar, not a cultural critique of the route.
  *   **Why not Popperian?** The bee cannot mentally simulate the flight cost vs. nectar reward before leaving the hive. It must "try and see."
  *   **Verdict:** The system is highly sophisticated, but the *locus of selection* for the individual's behavior remains in the environment (Skinnerian), not in an internal model or cultural tool-kit.
