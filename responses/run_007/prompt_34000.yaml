prompt: |-
  hey — I'm running a reading group session on Dennett's Darwinian/Skinnerian/Popperian/Gregorian creatures and I want a handout that works like one of those "which one are you" decision trees, except for classifying a creature or a system by what kind of trial-and-error loop it actually runs. The group is mostly grad students in cog sci and philosophy, and they've read the Dennett chapter, so the danger is they'll just sort by slogan. I want the tree built from the logical space, so they have to answer concrete questions about cases and only find out the label at the leaf.

  Set it up around where the selection happens: out in the gene pool / whole organisms across generations, in an individual's history of reinforcement, in an internal model where candidate acts get killed off before they're performed, or in a shared cultural pool of words and other mind-tools. Use that as the branching spine.

  Give me maybe seven or eight nodes total, including leaves. Each branch question should be answerable about a concrete case without already knowing Dennett's labels — e.g., "does a single individual change its behavior within its lifetime, or is novelty only introduced by differential survival of whole organisms?", "does the creature have to actually perform the bad option at least once and suffer the consequences before it stops doing it?", "is the filter that rejects options private to the organism, or is the filter itself made of public objects that other minds can pass around and improve?". Then map the four kinds onto leaves, but note that they're nested, not mutually exclusive — a Gregorian creature is also Darwinian, Skinnerian, and Popperian — so the tree should classify by the highest rung a case reaches, and say what that means for scoring.

  For each leaf, one sentence on its most awkward commitment (something like: the Gregorian creature inherits most of its competence from a population of minds, so a lone Gregorian with no culture is nearly a contradiction). Flag the pairs the tree can't cleanly seperate from behavior alone — I suspect Skinnerian vs Popperian is underdetermined by most observations because internal pretesting leaves no trace, and Popperian vs Gregorian gets blurry when you have to say whether a chimp mentally rehearsing box-stacking is running a private simulation or redeploying a borrowed representation. Also go through the logically possible answer-combinations that have no occupant and say for each whether it's empty because it's incoherent, unstable, or just underexplored.

  End with one worked example scored through the tree — maybe a honeybee waggle dance (where does it come out, and is that right?) — so the group sees the instrument in action before they use it on their own cases.
