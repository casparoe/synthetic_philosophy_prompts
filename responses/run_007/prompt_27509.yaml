answer: |-
  The apparent contradiction you have identified is central to Aristotle's account of economic exchange. It arises from a distinction he draws between **ontological commensurability** (the nature of the goods themselves) and **functional commensurability** (the requirements of the political community).

  To resolve the tension without appealing to external commentary, we must look closely at how Aristotle structures the relationship between *association*, *equality*, *demand* (*chreia*), and *convention* (*nomos*).

  Here is an analysis of how the two claims fit together within the internal logic of the passage.

  ### 1. The Necessity of Commensurability (The First Claim)
  Aristotle begins with a teleological chain:
  1.  **Association** (the polis) requires **Exchange**.
  2.  **Exchange** requires **Equality** (reciprocity).
  3.  **Equality** requires **Commensurability** (a common measure).

  In this context, commensurability is a *logical prerequisite*. If I trade five beds for one house, I am asserting that five beds "equal" one house. Without a common standard by which to assert this equality, the transaction would be arbitrary, and arbitrary transactions cannot sustain the stable associations required for political life.

  Therefore, when Aristotle says money "makes goods commensurate," he is describing money's **functional role**. Money acts as a middle term that allows us to express the equation: *5 beds = 1 house = X money*. In the context of the transaction, money renders them commensurate.

  ### 2. The Impossibility "In Truth" (The Second Claim)
  Immediately after establishing this necessity, Aristotle introduces the restriction: *"Now in truth it is impossible that things differing so much should become commensurate."*

  The phrase "in truth" (*tēi alētheiai*) signals a shift from functional logic to ontological reality.
  *   **Ontologically:** A house and a shoe are qualitatively different. They serve different ends, are made of different materials, and are produced by different arts. There is no single substance or property inherent in the house and the shoe that is identical in both.
  *   **The Contradiction Resolved:** Aristotle is not contradicting himself; he is distinguishing between **what is required for exchange to happen** (commensurability) and **what is actually the case regarding the objects** (incommensurability).

  Money does not *discover* a pre-existing metaphysical equality between a shoe and a house. Rather, it *imposes* a measure upon things that are, by nature, unequal. This is why he says they become commensurate only "sufficiently" (*hikanōs*). The measure does not need to be geometrically or metaphysically exact; it only needs to be adequate to sustain the association.

  ### 3. The Role of "Demand" (*Chreia*)
  You asked what "demand" is and how it serves as the unit. In the internal logic of the text, *chreia* (often translated as need, demand, or use) is the **only common factor** that exists between disparate goods.

  *   **The Common Denominator:** While a house and a shoe share no physical properties, they share a relational property: **both are capable of satisfying a human need.**
  *   **The True Measure:** Aristotle states that "in truth" demand holds everything together. If humans did not need these things, there would be no exchange. Therefore, *chreia* is the underlying reality that money represents.
  *   **Money as Representative:** Money is a "guarantee of exchange." It is a token that represents *chreia*. When I accept money for my shoes, I am not accepting a piece of metal for its own sake; I am accepting a guarantee that I can use that token to satisfy my own future *chreia* (e.g., for food or a house).

  Thus, goods are commensurable **not in themselves**, but **relative to the demand they satisfy**. Money makes this relative commensurability visible and transferable.

  ### 4. Substantive vs. Deflationary: What is Money?
  This leads to your final question: Is this a substantive thesis about value, or a deflationary/conventionalist claim?

  Based strictly on the text, Aristotle's position is **conventionalist but grounded in social reality.**

  1.  **Conventional (*Nomos*):** Aristotle explicitly states that money exists "by convention" (*nomos*). It can change, and it can become worthless if the convention collapses. This suggests a deflationary view: there is no "value atom" hidden inside the shoe that money measures.
  2.  **Grounded in Reality:** However, it is not *arbitrarily* deflationary. The convention is anchored in *chreia*, which is a real feature of human existence. We *really* need shoes and houses. The polis *really* requires exchange to survive.

  Therefore, Aristotle is not claiming that value is an illusion, nor is he claiming that value is a physical property of objects. He is claiming that value is a **relational property** arising from the intersection of objects and human need within a political community.

  ### Summary of the Resolution
  The two claims fit together as follows:

  1.  **Claim 1 (Functional):** For the polis to exist, exchange must occur. For exchange to occur, we must *treat* unequal goods as equal. Money is the tool that allows us to do this.
  2.  **Claim 2 (Ontological):** However, we must not be fooled into thinking the goods *are* actually equal in their nature. "In truth," they are not. They are only commensurate "with reference to demand."

  **Conclusion:**
  Aristotle is arguing that commensurability is a **practical accommodation** adequate for the purposes of exchange, not a metaphysical truth about the goods themselves. Money is a conventional representative of **demand** (*chreia*). It allows the community to treat qualitatively different things as quantitatively comparable, not because they share a common substance, but because they share a common relation to human need. The "contradiction" is actually a sophisticated distinction between the **requirements of social practice** and the **nature of physical objects.**
