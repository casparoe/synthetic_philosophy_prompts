          *   Meta-commentary: Identify redundant steps, acknowledge counterintuitive results (e.g., cutting known truths).
      *   **Tone:** Practical, honest, slightly informal (matching the user's "hey"), but rigorous enough for an epistemology context.

  2.  **Deconstruct the Philosophical Norms:**
      *   *Knowledge Norm (KN):* Assert $p$ only if you know $p$. (Standard: Justified True Belief + anti-luck).
      *   *Truth Norm (TN):* Assert $p$ only if $p$ is true. (Hard to verify in 20 mins).
      *   *Belief Norm (BN):* Assert $p$ only if you believe $p$. (Too weak for journalism).
      *   *Reasonable-Belief/Justification Norm (RJN):* Assert $p$ only if you have reasonable grounds/justification for believing $p$. (Best fit for journalism).
      *   *Lottery Case:* High probability isn't knowledge (e.g., "This ticket lost" before drawing).
      *   *Moore's Paradox:* "It is raining, but I don't believe it." (Relevance: Asserting without belief/commitment).

  3.  **Drafting the Decision Procedure (The "Editor's Algorithm"):**
      *   *Goal:* Translate abstract norms into newsroom heuristics.
      *   *Constraint:* 20 minutes, no annoying the editor.
      *   *Step 1: Verification (Truth/Knowledge).* Do we have evidence?
