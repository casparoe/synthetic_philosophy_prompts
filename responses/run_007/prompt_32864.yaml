      *   *Norm Selection:* The *Reasonable-Belief Norm* is the practical standard for journalism, not the strict *Knowledge Norm* (which is often impossible to meet on deadline). However, the *Knowledge Norm* is the ideal to aim for.
      *   *Lottery Constraint:* Crucial for the raffle case.
      *   *Moore's Constraint:* Crucial for the columnist case.

  4.  **Developing the Cases:**
