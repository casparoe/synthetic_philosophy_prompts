      *   *Case 2 (Columnist):* Author is sure, no evidence. Moore's Paradox territory (Asserting without justification). Opinion vs. News.
      *   *Case 3 (Raffle):* Number drawn, student hasn't claimed. Lottery Paradox (High prob, but not knowledge).

  5.  **Critiquing the Procedure (Meta-Commentary):**
