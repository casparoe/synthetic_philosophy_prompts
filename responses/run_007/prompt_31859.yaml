answer: |-
  This is the famous **Unexpected Hanging Paradox** (or Surprise Quiz Paradox). It has puzzled logicians and philosophers for decades. While there are nuanced debates, there is a committed, logically robust answer that resolves the contradiction without breaking mathematics or reality.

  Here is the direct answer: **The reasoning breaks at Step 1.**

  Here is exactly why, what you have to give up to accept it, and why your real-world examples (parties, packages) feel different.

  ### 1. The Specific Error: Step 1
  Step 1 claims: *"If it hasn't happened by the end of Thursday, they'd know it has to be Friday... so it wouldn't be a surprise... so the quiz can't be on Friday."*

  This step relies on a hidden assumption: **The students assume they can *know* the Teacher's Announcement is true.**

  To rule out Friday, the students must be certain on Thursday night that:
  1.  The quiz *will* happen (one of the five days).
  2.  The quiz *must* be a surprise.

  However, the Teacher's Announcement is a **self-referential knowledge claim**. It essentially says: *"This statement is true, but you cannot know which day it becomes true until it happens."*

  In logic, this is a version of **Moore's Paradox** (e.g., "It is raining, but I don't believe it"). A statement like this can be *true*, but it cannot be *known* to be true by the person it refers to.
  *   If the students **know** the announcement is true, they can deduce the quiz must be on Friday (on Thursday night).
  *   If they deduce it's on Friday, they **know** the day.
  *   If they know the day, the announcement ("you won't know") becomes **false**.

  Therefore, the students cannot **know** the announcement is true. They can hope it's true, or believe it's true, but they cannot treat it as a **known premise** for a logical deduction.

  **Why Step 1 fails:**
  Because the students cannot *know* the announcement is true, they cannot be certain on Thursday night that the quiz *must* happen on Friday. There remains a possibility in their minds that the teacher might be wrong (i.e., no quiz at all). If there is a possibility of "no quiz," then on Thursday night, they do not *know* it is Friday. If they don't know it is Friday, a quiz on Friday **would** be a surprise.

  Therefore, Friday is **not** ruled out.

  ### 2. The Domino Effect (Why Steps 2–4 Collapse)
  Once Step 1 fails, the rest of the backward induction crumbles immediately.
  *   **Step 2** relies on Friday being impossible. Since Friday is *not* impossible (as shown above), Thursday night still has two possibilities: Thursday or Friday.
  *   Because there are two possibilities, the students cannot be certain on Wednesday night that the quiz is on Thursday.
  *   Therefore, Thursday remains a surprise.
  *   This logic propagates all the way back to Monday. Every day remains a valid possibility because the students can never reach a state of certainty where only one day remains.

  ### 3. What You Have to Give Up
  To accept this resolution, you have to give up a very intuitive assumption about knowledge: **That every true statement can be known.**

  In classical logic, we often assume that if something is true, it is possible to know it is true. This paradox proves that **some true statements are unknowable.**
  *   **The Truth:** The teacher *can* give a surprise quiz on Friday. (If they do, the students are surprised).
  *   **The Knowledge:** The students *cannot know in advance* that the teacher will succeed. (If they knew, they wouldn't be surprised, and the teacher would fail).

  You must accept that **Truth $\neq$ Knowability.** The teacher's announcement is a statement that is *true* only if the students *do not know it is true*. This doesn't break deduction; it just places a limit on what can serve as a premise in epistemic (knowledge-based) logic. You cannot use a claim about your own future ignorance to generate present knowledge.

  ### 4. Why Your Real-World Examples Feel Different
  You mentioned surprise parties, phone calls, and package tracking. The paradox feels like it should apply there, but it usually doesn't. Here is the distinction:

  *   **The Quiz:** The "surprise" is a **logical condition of the announcement's truth.** If you know the day, the announcement is *false*.
  *   **The Party/Package:** The "surprise" is a **psychological prediction.**
      *   If your friend says, "I'm calling in 3 days, you won't know when," and you deduce it must be Day 3... and they call on Day 3... were you surprised?
      *   Technically, no. But the friend's statement isn't rendered *false*. They still called. The statement was a prediction of your mental state, not a logical constraint on reality.
      *   Package tracking says "Delivery by Friday." It does *not* say "It is logically impossible for you to deduce the day."

  The paradox only triggers when the announcement **guarantees ignorance as a condition of its own validity.** In real life, almost no one makes announcements that strict. They say "I'll surprise you," meaning "I will try to hide the info," not "I assert that it is logically impossible for you to deduce this."

  ### Summary
  *   **The Break:** **Step 1**.
  *   **The Reason:** It assumes the Teacher's Announcement can be **known** to be true. It cannot be known without making it false.
  *   **The Cost:** You must accept that some true statements (specifically self-referential ones about knowledge) are **unknowable**.
  *   **The Result:** Friday is never ruled out. Uncertainty remains all week. The quiz happens on Wednesday. The students are surprised. Logic is saved.
