answer: |-
  # The Signal Chamber: A Condorcet Jury Theorem Simulation

  ## Overview
  **Title:** The Signal Chamber
  **Time:** 80 Minutes
  **Participants:** 14 Students (plus 1 Facilitator)
  **Goal:** Experientially demonstrate the Condorcet Jury Theorem (CJT), its reliance on conditional independence, the fragility introduced by common signals/deliberation, and the tension between majority rule and expert competence.
  **Core Mechanic:** Students vote on a binary hidden state (Red or Blue) based on noisy private signals. Payoffs depend on individual accuracy and group accuracy.

  ---

  ## Materials Required
  1.  **Voting Cards:** 14 double-sided cards (Red on one side, Blue on the other).
  2.  **Signal Envelopes:** 56 small envelopes (14 per round × 4 rounds).
  3.  **Signal Slips:** Pre-printed slips to go inside envelopes (see *Facilitator Prep*).
  4.  **Truth Deck:** 4 large cards (Round 1: Red, Round 2: Blue, Round 3: Red, Round 4: Blue). *Note: These are pre-determined by you to ensure specific outcomes.*
  5.  **Scoreboard:** Whiteboard to track "Class Points."
  6.  **Timer:** Visible to the class.

  ## Payoff Scheme (Epistemic Utility Points)
  To ensure engagement without money, use a point system tied to a tangible reward (e.g., the winning team gets to choose the topic of the final seminar, or simply "bragging rights" + small candy prize).
  *   **Individual Accuracy:** +10 points for voting with the Truth.
  *   **Majority Bonus:** +50 points *to every student* if the Class Majority votes with the Truth.
  *   **Penalty:** -5 points for talking during a "Silent Voting" round.

  *Why this scheme:* The Majority Bonus aligns individual incentives with the group epistemic good (encouraging sincere voting based on signals), but the Individual Accuracy ensures they don't simply randomize to help the group.

  ---

  ## Facilitator Prep (Crucial)
  You must pre-generate the signal slips. Do not generate these live; it takes too long and risks statistical variance that ruins the lesson.
  *   **Competence Level ($p$):** Tell students their signals are generated by a process that is $X\%$ reliable.
  *   **Round 1 (Ideal):** Truth = **Red**. 10 Slips say "Red", 4 Slips say "Blue". (Individual $p \approx 0.71$). *Expected Outcome: Majority Red (Success).*
  *   **Round 2 (Correlated Error):** Truth = **Blue**.
      *   **The Trap:** 12 Slips say "Red", 2 Slips say "Blue".
      *   **The Cover Story:** Tell them: "There is a Public Broadcast today. It is 80% reliable. Your private signal is 60% reliable." (In reality, you are rigging the envelopes so the "Public" influence dominates).
      *   *Expected Outcome: Majority Red (Failure).*
  *   **Round 3 (Deliberation):** Truth = **Red**.
      *   **Slips:** 8 "Red", 6 "Blue" ($p \approx 0.57$, lower competence to make cascade likely).
      *   **Mechanic:** Allow 3 minutes of open talk before voting.
      *   *Expected Outcome: Likely Cascade to one side, potentially wrong if early speakers are wrong.*
  *   **Round 4 (The Expert):** Truth = **Blue**.
      *   **Slips:** 1 Student (pre-selected secretly) gets a "Gold Slip" (says "Blue", 95% reliable). 13 Students get "Silver Slips" (10 say "Red", 3 say "Blue", $p \approx 0.7$).
      *   *Expected Outcome: Majority Red (Wrong), Expert Blue (Right).*

  ---

  ## Timeline (80 Minutes)

  ### 0:00 – 0:10: Setup & Rules
  *   Distribute Voting Cards and a stack of 4 sealed Envelopes (one per round) to each student. **Do not open yet.**
  *   Explain the Payoff Scheme.
  *   **Rule:** "When I say 'Vote', reveal your card. Until then, envelopes stay sealed. Silence during signal reading."
  *   **The Cover Story:** "You are sensors in a chamber. A hidden state (Red/Blue) exists. Your envelope contains a signal from the environment. It is noisy."

  ### 0:10 – 0:25: Round 1 (The Baseline CJT)
  *   **Instruction:** "Open Round 1. Your signal is 70% reliable. Vote your signal sincerely."
  *   **Action:** Students open envelopes (10 Red, 4 Blue).
  *   **Vote:** "3, 2, 1, Vote." (Students hold up cards).
  *   **Tally:** Count Red vs. Blue. Reveal Truth (Red).
  *   **Score:** Award points.
  *   **Pedagogical Moment:** The majority likely won, outperforming the 4 individuals who voted Blue. *Do not debrief yet.*

  ### 0:25 – 0:40: Round 2 (The Common Cause)
  *   **Instruction:** "Open Round 2. New conditions: A Public Broadcast occurred before you entered. It suggested Red. Your private signal is still reliable, but the Broadcast is strong." (Note: The envelopes actually contain the rigged 12 Red / 2 Blue split).
  *   **Action:** Students open envelopes. Most see Red.
  *   **Vote:** "3, 2, 1, Vote."
  *   **Tally:** Count. (Likely 12 Red vs 2 Blue).
  *   **Reveal Truth:** **Blue**.
  *   **Score:** No Majority Bonus. Individual points only for the 2 correct voters.
  *   **Pedagogical Moment:** The group failed catastrophically despite high individual confidence.

  ### 0:40 – 0:55: Round 3 (Deliberation & Cascades)
  *   **Instruction:** "Open Round 3. Signal reliability is lower today (approx 60%). You have 3 minutes to discuss your signals *before* voting."
  *   **Action:** Students talk. Watch for "Information Cascades" (later voters ignoring their private signal to match early speakers).
  *   **Vote:** "3, 2, 1, Vote."
  *   **Reveal Truth:** **Red**.
  *   **Score:** Award points.
  *   **Pedagogical Moment:** Did discussion help pool information, or did it create correlation/cascades?

  ### 0:55 – 1:05: Round 4 (The Expert vs. The Crowd)
  *   **Instruction:** "Open Round 4. One of you has a 'Calibrated Sensor' (95% reliable). The rest have standard sensors (70%). You do not know who the expert is. Vote sincerely."
  *   **Action:** Students open envelopes (1 Gold/Blue, 13 Silver/10 Red-3 Blue).
  *   **Vote:** "3, 2, 1, Vote."
  *   **Tally:** Majority Red (10), Minority Blue (4).
  *   **Reveal Truth:** **Blue**.
  *   **Score:** Majority Bonus *denied*. Ask the student who voted Blue (the Expert) to stand.
  *   **Pedagogical Moment:** The Majority lost to the Single Expert.

  ### 1:05 – 1:20: The Debrief (Mapping Mechanics to Theorem)
  *   **Board Work:** Draw the CJT formula assumptions on the board. Map each round to a violation.
  *   **Discussion Questions:**
      1.  *Round 1:* Why did the majority win? (Independence + $p > 0.5$).
      2.  *Round 2:* Why did the majority lose? (Conditional Independence violated by Common Cause).
      3.  *Round 3:* Did talking help? (Distinguish Pooling vs. Cascades).
      4.  *Round 4:* When does the Expert beat the Crowd? (Finite $n$ vs. Asymptotic CJT).

  ---

  ## Debrief Guide: Mapping Play to Theory

  Use this script to anchor the discussion in formal epistemology.

  **1. The Baseline (Round 1):**
  *   **Concept:** *Condorcet's Core Claim.*
  *   **Ask:** "In Round 1, 4 of you were wrong. Why was the group right?"
  *   **Theory:** When errors are independent and $p > 0.5$, errors cancel out. The signal-to-noise ratio improves as $\sqrt{n}$.
  *   **Key Takeaway:** "The majority beats the *average* voter, and as $n \to \infty$, probability of correctness $\to 1$."

  **2. The Collapse (Round 2):**
  *   **Concept:** *Conditional Independence.*
  *   **Ask:** "Your signals were still 70% reliable individually. Why did the group collapse?"
  *   **Theory:** CJT requires $P(V_i | \text{Truth}) = P(V_i | \text{Truth}, V_j)$. In Round 2, knowing $V_j$ told you about $V_i$ because of the Common Broadcast.
  *   **Key Takeaway:** "Correlated errors do not cancel; they compound. A crowd of 1,000 people reading the same wrong news report is not smarter than one person."

  **3. The Talk (Round 3):**
  *   **Concept:** *Deliberation vs. Independence.*
  *   **Ask:** "Did hearing others' reasons change your vote? Did it make you more or less confident?"
  *   **Theory:** Deliberation can pool information (good) but creates endogenous correlation (bad). If Student A speaks first, Student B's vote is no longer independent of A's.
  *   **Key Takeaway:** "Social choice isn't just aggregation; it's transformation. Cascades occur when public action outweighs private signal."

  **4. The Expert (Round 4):**
  *   **Concept:** *Competence Heterogeneity & Finite Samples.*
  *   **Ask:** "The Majority was wrong. The Expert was right. Is CJT false?"
  *   **Theory:** CJT assumes equal competence ($p_i = p$). With heterogeneity, weighted voting is optimal. Also, CJT is asymptotic. With $n=14$, the variance is still high.
  *   **Key Takeaway:** " 'The Majority is likely right' is a long-run frequency claim, not a guarantee for this specific case. A known high-competence signal can outweigh a noisy majority."

  ---

  ## Troubleshooting: What Will Go Wrong

  **1. Students Talk During Silent Rounds.**
  *   *Risk:* Ruins Round 1 independence.
  *   *Fix:* Enforce the -5 point penalty immediately. "Student X, -5 points for speaking." Make it painful.

  **2. Students Suspect Rigging.**
  *   *Risk:* "You made Round 2 fail on purpose."
  *   *Fix:* Acknowledge it. "In a simulation, we compress probabilities to ensure the lesson is visible. In reality, this failure happens 20% of the time, which is why it's dangerous."

  **3. Round 4 Expert is Ignored.**
  *   *Risk:* The Expert votes Blue, but 13 others vote Red. The point is made, but students might feel the Expert "should" have convinced others.
  *   *Fix:* Emphasize in debrief that *without knowing who the expert is*, the majority rule is rational. The failure is in the *structure*, not the voters.

  **4. Timing Overrun.**
  *   *Risk:* Debrief gets cut.
  *   *Fix:* If you pass 1:05, skip the Round 3 (Deliberation) detailed analysis. Round 2 (Correlation) and Round 4 (Expert) are the most critical for the prompt's requirements.

  ---

  ## Limitations: What This Game Cannot Reproduce

  Be explicit with your students about where the simulation ends and the theory continues.

  1.  **Asymptotics:** CJT is a limit theorem ($n \to \infty$). With $n=14$, the "probability $\to 1$" claim is not visible. You must explain that the game shows the *direction* of the force, not the limit.
  2.  **True Independence:** In a classroom, students breathe the same air, hear the same instructions, and share cultural priors. True conditional independence is impossible in a room. The game *simulates* independence via envelopes, but real-world application is harder.
  3.  **Known Competence:** In Round 4, the expert was hidden. In reality, if we *know* someone is an expert, we shouldn't use simple majority rule; we should use weighted voting. The game shows the failure of *unweighted* majority rule in the face of expertise.
  4.  **Binary States:** The game uses Red/Blue. Real epistemic states are often continuous or multi-dimensional, where CJT does not apply cleanly.

  ## Facilitator's Closing Script
  "Today you felt the theorem. You felt the power of the crowd in Round 1, and you felt the fragility of that power in Round 2. When you go online and see 'the crowd' invoked as an oracle, ask yourself: Are these 1,000 signals independent, or are they 1,000 echoes of one broadcast? If the latter, the Jury Theorem does not apply. You are not a jury; you are a chorus."
