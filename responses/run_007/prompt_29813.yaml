prompt: |-
  I'm a novelist working on a political thriller, and I keep getting stuck on the central moral dilemma. The problem of dirty hands — you know, the idea that in politics you sometimes have to do genuinely bad things to achieve good outcomes, and that the act is both justified and unforgivable at the same time. Walzer's whole thing. I'm trying to get the texture of it right, not just the abstract argument.

  So here's what I want. Please write a short story (say 1500-2500 words) that dramatizes the dirty hands problem. I want you to make definite narrative choices — pick a concrete scenario, a specific character, and take a real position on whether the character's hands are, in the end, dirty in a way that lingers, or whether the whole framework is a self-serving myth politicians tell themselves. Don't give me a balanced survey of philosophical positions dressed up as fiction. Commit to a reading of the problem and let the story show it.

  Role: you're an expert in both political philosophy and literary fiction. Before you write, I want you to think through the structure — maybe do a quick brainstorm of possible scenarios, pick one, and sketch the emotional arc and the key decision point. Then write the story. I want it in American English.

  A couple grounding details: the story should feel contemporary, not allegorical, and the moral weight should land on the reader gradually, not through a character lecturing about Walzer.

  Oh, and a note about where the story takes liberties: I'd love a brief afterword — just a paragraph — where you flag where the fiction leans on a particular interpretation of dirty hands (like the "tragic" reading vs. the "moral reassurance" reading, or whatever distinction you're drawing on) and what you had to simplifiy to make it work as narrative.
