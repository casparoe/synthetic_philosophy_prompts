prompt: |-
  I'm a PhD student trying to get my head round the contractualist response to the aggregation problem, and before I read any more of it I want to know what a solution is actually supposed to do. I keep seeing people argue about Taurek's one-vs-five rescue case or the transmitter-room/World Cup case as if whichever case they've picked settles the whole thing, and I'd rather have the full spec first. So write me the desiderata: the requirements any adequate account of how numbers of people should count — preferably a Scanlonian contractualist one, but say if some requirement forces you outside it — has to meet. For each requirement give the case or consideration behind it, seperately from the scoring: the one-vs-five rescue, the transmitter-room/World Cup case, the distinction between same-kind and different-kind claims, the individualist restriction, avoiding intransitive verdicts, whatever else you think is doing the real work. Then mark which desiderata are non-negotiable and which are just the tastes of one camp. And the bit I most want: tell me which subset of these requirements looks jointly unsatisfiable, or at least in serious tension, and which single requirement does the most to rule out the existing positions. I'd rather you commit to a definite list and defend it than lay out the options and leave me to pick.
