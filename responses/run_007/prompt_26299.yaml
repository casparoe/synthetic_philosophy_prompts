  *(Self-Correction on "Old Evidence"):* The problem of old evidence is usually about $P(E)=1$ preventing likelihood ratios from updating $H$. JC allows $P(E)$ to shift from 1 to something else? No, JC is for when $P_{new}(E) \neq 1$. Old Evidence is when you learn a logical relation *after* knowing $E$. Actually, in JC context, it's often about how to update when you become *more* certain but not certain. Let's stick to the ML analogue: Calibration on training data.

