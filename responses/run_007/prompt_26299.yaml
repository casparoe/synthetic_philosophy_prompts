      *   *Correction:* In JC, $H$ is the hypothesis, $E$ is the evidence partition. Rigidity says the *diagnostic* power of $E$ regarding $H$ doesn't change. In ML terms: The likelihood $P(X|H)$ is fixed. The uncertainty is only in the marginal $P(E)$.
      *   *Better ML Analogy:* Think of $E$ as the Label Space. Standard Bayes: Label is one-hot. JC: Label is a distribution (soft). Rigidity: The relationship between Features and Labels ($P(X|Y)$) is stable; we are just uncertain about which $Y$ occurred.
      *   *Commutativity:* Be careful. In SGD, order matters due to path dependence. In exact Bayesian inference with virtual evidence, order shouldn't matter. The philosophical worry is about *rational coherence*, not optimization landscapes. I need to distinguish between optimization artifacts and probabilistic coherence.

