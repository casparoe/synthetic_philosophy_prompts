answer: |-
  The plastic chair was bolted to the floor, cold against Arthur's thighs. On the other side of the partition, David sat with his hands folded. They were large hands, like Arthur's. The knuckles were bruised.

  It had been three weeks since the incident at the bar. A shattered bottle, a man on the floor, a life altered by a swing of an arm. Arthur had spent the drive here rehearsing his anger. He had prepared a lecture on accountability, on the line between impulse and action, on the duty a man has to master his own blood.

  David looked up. His eyes were the same shade of hazel as Arthur's, but the expression was different. It was a hollowed-out look, the look of someone waiting for a verdict they know is inevitable.

  "I didn't mean to hit him that hard," David said. His voice was flat. "I just… saw red. You know how it gets."

  Arthur opened his mouth to say, *I know how it gets, and you should know better.* That was the script. That was the law. But the words stuck in his throat.

  He looked at his son's face and saw the timeline unspooling backward. He remembered David at six years old, screaming because a block tower fell, throwing the plastic bricks against the wall with a violence that startled Arthur's wife. They hadn't taught him that. They had tried to teach him calm. They had read the books, practiced the time-outs, modeled the deep breaths. But the temper had been there, waiting in the wiring, like a seed waiting for rain.

  Arthur shifted in his seat. He felt the ghost of his own father's grip on his shoulder. A heavy hand. Quick to strike. Arthur had sworn, at age twelve, standing in a kitchen smelling of burnt toast and fear, that he would never be that man. He had constructed a life of patience. He was a mediator. A man who solved conflicts.

  But why had he chosen that path? Was it a free choice, a pure act of will rising from nowhere? Or was it a reaction to the fear? If he hadn't been afraid, would he have cared so much about peace? His virtue was built on the foundation of his father's vice. He hadn't chosen the fear. He hadn't chosen the reaction to the fear. He had just been *there*, being who he was.

  And David. David had inherited Arthur's eyes, but he had inherited his mother's volatility. A genetic lottery ticket drawn before birth. Then the environment: Arthur's work trips, the gaps in supervision, the divorce when David was ten. None of those were chosen by David. They were the weather he had to grow in.

  Arthur looked at his own hands resting on the table. They were calm now. But why? Was he responsible for his calm? If he swapped brains with David, swapped histories, swapped the chemical soup of their bodies, would he be sitting on this side of the glass?

  The thought landed like a stone in water. The ripples spread out, dissolving the structure of his anger.

  If David couldn't choose his nature, and Arthur couldn't choose the nature that shaped David, then who was standing here to blame? The chain stretched back further than the bar, further than the childhood home, further than the genes. It stretched back to causes that had no hands to hold them.

  "I'm sorry, Dad," David said. He looked down. "I know I have to pay for it. I just… I wish I was different."

  *I wish I was different.*

  The phrase hung in the air. To wish to be different is to wish to be someone else. To be responsible for being different, David would have had to choose the self that made the choice to change. But that self would also need to be chosen. It was a ladder with no ground to stand on.

  Arthur felt a sudden vertigo. The ordinary world outside relied on this ground. The judge would rely on it. The victim would rely on it. They needed David to be the author of the act so they could punish the author. It was necessary for society, like money or traffic lights. But sitting here, watching his son's chest rise and fall with the rhythm of a biology he didn't select, Arthur saw the machinery behind the curtain.

  There was no author. There was only the unfolding.

  "I know," Arthur said. His voice sounded strange to him, stripped of its authority.

  "Are you… are you disappointed?" David asked.

  Arthur wanted to say yes. He wanted to say *you failed me.* But that implied David had succeeded in being someone else once before and chose not to. It implied David was a ghost haunting a machine, pulling levers.

  Arthur looked at the bruised knuckles. He saw the chain of events that led to them: the bad sleep, the inherited threshold for irritation, the comment at the bar, the alcohol, the history of men who couldn't swallow their pride.

  "I'm not disappointed," Arthur said, and he realized it was true. How could you be disappointed at rain for falling? You could seek shelter. You could build a dam. But you couldn't blame the water.

  He stood up to leave. The guard nodded. The routine continued. The system would process David, assign a number, demand restitution. The world would keep playing the game of blame because it had to. But Arthur walked out into the parking lot feeling lighter and heavier all at once, carrying a truth that had no place to go. He got into his car and gripped the wheel. He was careful not to speed. He was careful because that was how he was made. And he knew, with a quiet dread, that he couldn't take credit for that either.

  ***

  **Note on Philosophical Liberties**

  This narrative leans heavily on the *empirical* factors of determinism (genetics, upbringing, environment) to illustrate Strawson's *conceptual* argument. Strawson's Basic Argument is not primarily that we are determined by causes, but that ultimate moral responsibility is logically impossible because it requires an infinite regress of self-creation (*causa sui*). Even in an indeterministic universe, Strawson argues, you cannot be ultimately responsible for your actions because you cannot be responsible for the mental nature that leads you to choose them.

  The story implies that if we trace the causal chain back far enough, blame dissolves. A strict Strawsonian might argue that even if the causal chain were short, or if there were no parents to blame, the logical impossibility remains: you cannot step outside your own nature to choose it.

  The consideration most likely to lead to a revision of the story's implicit stance is the **Compatibilist objection**. Compatibilists argue that moral responsibility does not require "ultimate" responsibility or self-creation, but rather "reasons-responsiveness" or the ability to act according to one's own desires without coercion. If one accepts that responsibility is compatible with determinism, the story's conclusion—that blame is fundamentally unintelligible—would be too strong. A revision might instead focus on the tension between the *feeling* of ultimate responsibility and the *practice* of holding agents accountable, rather than suggesting the practice is undermined by the metaphysics.
