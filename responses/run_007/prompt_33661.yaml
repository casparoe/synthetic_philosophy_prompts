answer: |-
  There is no single, canonical term in the philosophical lexicon that captures this specific manoeuvre precisely. However, the phenomenon you are describing sits at the intersection of meta-ethics and philosophy of mind, and there are established concepts that bracket it.

  The closest technical description for the *logical state* is **epistemic akrasia**. This occurs when a researcher holds a belief (consciousness is non-physical/mysterious) while simultaneously holding a higher-order belief that they ought not to hold it (the intuition is merely a psychological quirk).

  However, as a *rhetorical move*—the act of stating the debunking case and then proceeding as if it hadn't been stated—I would propose the label **genealogical bracketing**.

  Here is the breakdown of the boundaries, the distinctions, and my own uncertainty regarding the identification.

  ### The Boundaries and Distinctions

  To understand why *genealogical bracketing* is distinct, we must map it against the two neighbouring concepts you mentioned: **genealogical explanation** and **debunking**.

  1.  **Genealogical Explanation (Neutral):**
      *   *Structure:* "We have intuition *X* because of evolutionary pressure *Y*."
      *   *Truth Value:* Agnostic. The origin of the belief is irrelevant to its truth.
      *   *Example:* "We believe murder is wrong because kin selection favoured it. Murder might still be objectively wrong."
      *   *Boundary:* If the researcher stops here and treats the mystery as open without claiming the genealogy undermines it, they are simply being a naturalist about the intuition's origin.

  2.  **Evolutionary Debunking (Negative):**
      *   *Structure:* "We have intuition *X* because of evolutionary pressure *Y*, and *Y* is independent of the truth of *X*. Therefore, *X* is unjustified."
      *   *Truth Value:* Skeptical. The genealogy defeats the justification.
      *   *Example:* "We believe in dualism because it was socially useful. Therefore, dualism is likely false."
      *   *Boundary:* This is the standard "debunking" you noted. The intuition is discarded or treated as an illusion (as in Keith Frankish's illusionism).

  3.  **Genealogical Bracketing (The Move You Identified):**
      *   *Structure:* "We have intuition *X* because of evolutionary pressure *Y* (which usually undermines *X*). However, we will proceed as if *X* is a robust datum requiring a metaphysical solution."
      *   *Truth Value:* Realist (but unargued). The genealogy is acknowledged but prevented from doing its usual epistemic work.
      *   *Example:* "Evolution wired us to feel like there's a ghost in the machine. Nevertheless, the 'Hard Problem' remains a genuine ontological gap we must solve."
      *   *Boundary:* This is the specific slip you are spotting. The researcher accepts the premises of a debunking argument but refuses the conclusion, without offering a bridging premise to explain why *this* intuition survives the debunking while others do not.

  ### Why "Genealogical Bracketing"?

  I suggest this term because it captures the act of placing the implications of the genealogy inside "brackets"—acknowledged, but set aside—allowing the researcher to continue working on the intuition as if it were a raw feature of the world rather than a feature of the mind.

  It differs from plain **epistemic inconsistency** because it is often systematic. It is not merely a contradiction; it is a methodological choice to treat phenomenological intuitions as **self-justifying** (a position known as *phenomenological conservatism*) without explicitly defending that position against the genealogical critique they just outlined.

  ### Where I Am Least Confident

  I must be candid: my least confident assertion is that this move is always a mistake or a rhetorical slip.

  There is a hidden premise that might render this move coherent, which is **Phenomenological Foundationalism**. This is the view that conscious experience is self-intimating and incorrigible—that the way things seem *is* the primary data, regardless of why they seem that way. If a researcher holds this view, they can consistently say, "Evolution made me see it this way, but the seeing itself is the undeniable fact we must explain."

  If they are committed to Foundationalism, they are not "bracketing" the genealogy; they are simply asserting that genealogy cannot touch the veridical nature of the experience.

  **What would change my mind:**
  If you were to press these researchers and they responded, "The evolutionary story explains why we *talk* about the mystery, but not why the *experience* persists," then they are not committing genealogical bracketing. They are making a distinction between the *concept* of consciousness (which is evolved) and the *phenomenon* of consciousness (which is brute).

  However, in my analysis of the literature, this defence is rarely made explicit. They tend to conflate the *intuition of a gap* with the *existence of a gap*. If they are conflating those two things while admitting the intuition is evolved, then my identification of **genealogical bracketing** holds. If they are distinguishing them, then they are innocent of the move, merely guilty of being obscure.

  ### Summary for Your Coverage

  When you write about this, you might describe it as follows:

  > "The researcher employs **genealogical bracketing**: they accept the naturalistic account of why the intuition arises, yet withhold the skeptical conclusion that usually follows, treating the intuition as a metaphysical datum rather than a psychological artifact."

  This distinguishes it from **debunking** (which rejects the intuition) and **genealogy** (which is neutral), pinpointing the specific tension where the explanation is admitted but allowed to remain inert.
