prompt: |-
  I'm a graduate student instructor, and next week I have to lead an eighty-minute discussion section on Ulysses contracts and constitutional precommitment for a second-year undergraduate political theory course. The students have read the relevant theoretical work on precommitment and some constitutional theory, including excerpts from the Federalist Papers on faction and constraint. I know the material; what I need is a teaching plan.

  Don't explain the concept to me. Tell me what order to introduce the ideas, what depends on what, and why. What is the one example or case I should build the entire discussion around? The Ulysses story is obviously the canonical one, but I'm not confident it can carry the full weight of the constitutional extension on its own — should I use a different or additional carrying case, and if so, what features must it have and what must it lack?

  I also need a map of the misconceptions the students will predictably bring or form. I'm expecting some of the following: that precommitment is just paternalism by another name; that it's irrational to close off options by definition; that the democratic version fails because a past majority has no legitimate authority to bind a present one; that a precommitment you can undo isn't really a precommitment; that the whole idea collapses if you deny the unity of the self over time. I may be missing some. For each of these, where exactly in the sequence should I head it off — before it crystallizes, or after letting it surface? And how should the sequence absorb each one rather than treating it as a detour?

  Finally, what should I explicitly refuse to cover at this level and say so, and what question can I ask in the last five minutes that will tell me whether they've understood the structure of the problem rather than just memorized the Ulysses metaphor?
