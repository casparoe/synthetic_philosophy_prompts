answer: |-
  ### Teaching Plan: The Logic and Legitimacy of Precommitment

  **Time:** 80 Minutes
  **Goal:** Move students from the intuitive logic of individual self-binding to the paradoxical legitimacy of collective self-binding.

  #### I. Sequencing and Dependencies (0–65 mins)

  **Phase 1: The Logic of Instrumental Rationality (0–20 mins)**
  *   **Start:** The Ulysses metaphor. Do not linger on the myth; extract the *structure*.
  *   **Sequence:**
      1.  Identify the two "selves": The Calm Self (t=1) vs. The Passionate Self (t=2).
      2.  Identify the constraint: The Mast (external enforcement).
      3.  Identify the goal: Maximizing long-term autonomy by restricting short-term choice.
  *   **Dependency:** You must establish that precommitment is *instrumentally rational* before moving to politics. If they think binding oneself is inherently irrational, the constitutional analogy fails immediately.
  *   **Why here:** This creates a shared vocabulary (Calm vs. Passion, Constraint vs. Freedom) that you will reuse when discussing factions and amendments.

  **Phase 2: The Political Translation (20–45 mins)**
  *   **Pivot:** "Who is Ulysses in a democracy?"
  *   **Sequence:**
      1.  Map the Calm Self to "The People in Constitutional Moment" (Founding/Ratification).
      2.  Map the Passionate Self to "The People in Routine Politics" (Legislative majorities swayed by faction).
      3.  Map the Mast to "Constitutional Rigidity" (Supermajority requirements, judicial review).
  *   **Dependency:** This depends on Phase 1 holding. If they accept individual precommitment is rational, they must now explain why *collective* precommitment differs.
  *   **Why here:** This is the core theoretical work. It forces them to confront the "Unity of Self" problem immediately upon entering the political sphere.

  **Phase 3: The Legitimacy Crisis (45–65 mins)**
  *   **Pivot:** "Does the Dead Hand rule?"
  *   **Sequence:**
      1.  Introduce the friction: The Calm Self is *dead* or *gone*. The Passionate Self is *alive* and *voting*.
      2.  Press the tension: Why should 51% of today yield to 51% of yesterday (who required 67% to change their mind)?
      3.  Synthesize: Precommitment is not about ruling from the grave; it is about raising the transaction costs of passion to ensure stability.
  *   **Dependency:** Depends on Phase 2. They must understand the mapping before they can critique the legitimacy of the mapping.
  *   **Why here:** This is where the deepest misconceptions live. Placing it last ensures they have the conceptual tools to dissect the objection rather than just reacting emotionally.

  ---

  #### II. The Carrying Case: Article V (The Amendment Process)

  Do not use the Ulysses story as the carrying case for the *political* discussion. It is too clean. Ulysses is one person; the Constitution is millions.

  **Build the discussion around: The U.S. Constitution's Amendment Process (Article V).**

  *   **Why this case:** It is the explicit mechanism of precommitment. It forces the question: "Why make it hard to change our minds?"
  *   **Features it MUST have:**
      *   **Asymmetry:** Ordinary law requires 51%; Constitutional law requires 67% + 75%. You need this friction to demonstrate the "cost" of undoing the pact.
      *   **Entrenchment:** Certain clauses (e.g., equal suffrage in the Senate) are unamendable. This tests the limits of precommitment (can you bind yourself *forever*?).
  *   **Features it MUST lack:**
      *   **A Unitary Agent:** Unlike Ulysses, "The People" are not a single mind. You must *lack* this to generate the "Dead Hand" and "Faction" problems.
      *   **A Clear "Siren":** In politics, the "passion" often looks like "justice" (e.g., a majority genuinely wanting to suppress a minority for security). This ambiguity is crucial for discussion.

  **How to use it:** When a student says, "But the people should rule," ask: "Which people? The 51% today or the 75% who ratified this right?" When a student says, "We can just amend it," ask: "If it's easy to amend, was it ever a precommitment?"

  ---

  #### III. Misconception Map

  Do not treat these as interruptions. Treat them as checkpoints.

  | Misconception | When to Head It Off | Strategy for Absorption |
  | :--- | :--- | :--- |
  | **"Precommitment is just irrational option-closing."** | **Phase 1 (Ulysses).** | **Preempt.** Before moving to politics, force consensus that binding oneself can be *more* rational than remaining free. Use the smoker or saver analogy if Ulysses fails. If they don't buy this, stop and fix it. |
  | **"Precommitment is paternalism."** | **Phase 2 (Translation).** | **Absorb.** When mapping Calm Self to Founders, ask: "Is the Calm Self being paternalistic to the Passionate Self, or is it the *same* self protecting its own interests?" Shift the frame from *authority over* to *authority of*. |
  | **"Denial of the Unity of Self."** (The People aren't one thing) | **Phase 2 (Translation).** | **Surface then Contain.** Let them argue that "The People" don't exist. Then counter: "Constitutional theory *requires* we act *as if* they do across time. What breaks if we don't?" Make it a functional necessity, not a metaphysical truth. |
  | **"A precommitment you can undo isn't real."** | **Phase 3 (Legitimacy).** | **Absorb.** Use Article V. It *can* be undone, but at a high cost. Define precommitment not as *impossibility* but as *increased transaction costs*. If it were impossible, it would be tyranny, not a pact. |
  | **"The Dead Hand Problem"** (Past majority can't bind present) | **Phase 3 (Legitimacy).** | **Surface.** This is the climax. Let it crystallize fully. Then resolve it using the Federalist logic: The past majority isn't binding the present majority to *their* will, but to the *present majority's own prior calm will*. |

  **Critical Note on Timing:** Do not address the "Dead Hand" objection in Phase 2. If you raise it too early, students will reject the analogy before understanding it. Let them build the model first, then stress-test it in Phase 3.

  ---

  #### IV. Scope Boundaries (What to Refuse)

  Explicitly tell students you are **not** covering the following, and explain why:

  1.  **Specific Case Law (e.g., *Marbury*, *Schenck*):** "We are doing political theory, not constitutional law. We care about the *justification* for judicial review, not the legal precedent."
  2.  **Meta-ethics of Personal Identity:** "We are not solving the philosophical problem of whether 'you' are the same person over time. We are analyzing the *political utility* of acting as if you are."
  3.  **Historical Intent of the Founders:** "We are not asking what Madison *meant*. We are asking if Madison's *argument* holds water theoretically."

  **Why:** These are rabbit holes that consume 80 minutes without addressing the structural logic of precommitment.

  ---

  #### V. The Exit Question (Last 5 Minutes)

  Do not ask them to define precommitment. Ask them to identify the **epistemic limit** of the theory.

  **The Question:**
  > "Ulysses knew the Sirens were dangerous. But in politics, how do we distinguish between a 'Siren' (a temporary passion we should bind against) and a 'Moral Evolution' (a genuine improvement in our values that the old Constitution is blocking)? If the precommitment mechanism is too strong, don't we risk freezing injustice?"

  **What this tests:**
  *   If they answer with "The Courts decide," they missed the theoretical point (who binds the binders?).
  *   If they answer with "The Amendment Process," they understand the safety valve.
  *   If they acknowledge the tension without resolving it, they understand the structure of the problem: Precommitment requires a bet on the future that might be wrong.
