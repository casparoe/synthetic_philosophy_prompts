  **Analysis**
  Gilbert Ryle famously distinguished "knowing-how" (competencies like riding a bike) from "knowing-that" (propositional facts like "Paris is the capital"). Later philosophers, like Stanley and Williamson, argued knowing-how is merely a species of knowing-that—to know how is to know a fact about a method. *Memento* serves as a thought experiment testing this boundary.

  Leonard Shelby retains knowing-how: he drives, fights, and tattoos himself. His procedural memory is intact. But his knowing-that is broken; he cannot store new facts internally. Leonard attempts to hack this limitation by externalizing knowing-that onto his body and polaroids. He treats facts as immutable logs in a stateless system. However, the film reveals that knowing-how without reliable knowing-that is not just resilient; it is dangerous. Without true facts to guide procedure, action becomes unmoored from morality.

  The Sammy Jankis story is the philosophical crux. Leonard claims Sammy failed the insulin test because he couldn't learn the routine (knowing-how). But the twist reveals Leonard projected his own failure onto Sammy. Leonard *could* condition himself to tattoo (a new how), but only by manipulating the *that*. This suggests Stanley might be right: knowing-how relies on knowing-that. Leonard's ability to function depends entirely on the integrity of his external facts.

  When Leonard burns Teddy's photo and writes "Don't believe his lies," he is corrupting the database. He knows Teddy told the truth (that Leonard already found the killer), but he chooses to encode a lie. He does this to preserve his purpose. Here, knowing-how becomes a tool for self-deception. He knows *how* to pursue vengeance, but he manufactures the *that* to justify it. He is essentially writing a script for his future self to execute, bypassing rational judgment.

  **Conclusion**
  The film sides with a modified Intellectualism. Knowing-how is resilient—Leonard survives—but it is ethically hollow without true knowing-that. Leonard's procedures work perfectly, but they execute a corrupted program. For a software engineer, Leonard is a stateless service relying on external storage; if the storage is compromised, the service executes errors confidently. *Memento* suggests that while skills may survive memory loss, agency requires truth. Without reliable facts, knowing-how is merely automation in service of a lie. Leonard chooses the lie because the truth renders his knowing-how purposeless. The film warns that competence without truth is not freedom; it is a loop of self-destruction.
