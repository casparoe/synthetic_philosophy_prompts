  ok so i've been going down a rabbit hole on no-trade theorems — the milgrom-stokey result that if agents have common priors and common knowledge of rationality, the arrival of private information can't generate trade, because any offer to trade would itself reveal the information and cause the other party to revise their willingness to trade. the standard worry people raise is that this undercuts the hayekian picture of markets as mechanisms for aggregating dispersed local knowledge: if the theorem holds, then the process of trying to trade on private information unravels, and markets can't do the epistemic work hayek claims they do.

  i want you to argue the opposite position. make the strongest case you can that no-trade theorems, properly understood, actually support rather than undermine the epistemic case for markets. be precise about what the theorems do and don't establish, and address at least one serious objection to your argument head-on rather than sidestepping it. write in british english please.
