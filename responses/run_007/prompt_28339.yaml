answer: |-
  It is a commonplace in financial economics and political philosophy to treat the Milgrom–Stokey no-trade theorem as a damaging paradox for the Hayekian research programme. The standard critique runs as follows: if rational agents with common priors cannot trade on private information without that information being instantly priced in, then the market mechanism appears to seize up. If trade unravels, how can markets perform their alleged epistemic function of aggregating dispersed knowledge?

  I intend to argue the contrary. Properly understood, the no-trade theorem does not demonstrate the failure of the market's epistemic capacity; rather, it delineates the *success condition* of the Hayekian price mechanism. The theorem provides a rigorous formalisation of Hayek's central insight: that prices are sufficient statistics for dispersed knowledge. Far from undermining the case for markets, the no-trade result confirms that in a sufficiently rational and liquid market, the *price* does the epistemic work, rendering speculative *volume* redundant.

  To make this case, we must first be precise about what the Milgrom–Stokey theorem establishes. It does not claim that trade never occurs. Rather, it posits a specific environment: agents share common priors, they are risk-averse (or at least not risk-seeking), the initial allocation is ex-ante Pareto efficient, and rationality is common knowledge. In this setting, the arrival of private information will not generate speculative trade. Why? Because any offer to trade signals the trader's private information. The counterparty, being rational, infers this information from the offer itself and revises their valuation accordingly. With common priors, their valuations converge, and the mutually beneficial trade disappears.

  The Hayekian objection is that this implies a market stagnation where knowledge remains unutilised. This misinterprets the nature of the 'knowledge' Hayek sought to mobilise. Hayek was not primarily concerned with speculative betting on asset prices; he was concerned with the coordination of real economic plans (production, consumption, investment). The no-trade theorem isolates *speculative* trade driven purely by informational asymmetry. By showing that such trade vanishes when information is fully accounted for, the theorem validates the potency of the price signal.

  Here lies the core of the argument: the no-trade theorem demonstrates that the *threat* of trade is sufficient to incorporate private information into public prices. In a Milgrom–Stokey world, an agent does not need to actually execute a trade to reveal their private knowledge; the mere willingness to trade at a given price forces the market to update. This is the ultimate vindication of Hayek's claim that the price system communicates knowledge without the need for centralised communication. If the theorem holds, it means the market has achieved a state where prices perfectly reflect the aggregate information set of all participants. The epistemic work is complete; hence, the physical exchange of assets becomes unnecessary for information transmission.

  Consequently, the theorem supports the Hayekian view by distinguishing between *informational efficiency* and *trading volume*. A naive view of markets suggests that high volume indicates healthy information aggregation. The no-trade theorem corrects this: high volume in a speculative context often indicates that prices have *failed* to fully incorporate private information, necessitating actual exchange to resolve the discrepancy. In the limit case described by Milgrom and Stokey, the price mechanism is so efficient that it absorbs knowledge instantaneously via inference. Thus, the absence of speculative trade is not a sign of market failure, but of epistemic perfection. It shows that the market has successfully coordinated expectations, aligning with Hayek's definition of equilibrium as a state where the plans of all agents are mutually compatible.

  Furthermore, the theorem relies on the assumption of ex-ante Pareto efficiency. This implies that all gains from risk-sharing have already been exhausted. In this light, the 'no-trade' result is not a suppression of activity, but a confirmation that the market has already allocated resources optimally given the available knowledge. The Hayekian process is a discovery procedure; the no-trade theorem describes the destination of that procedure. It tells us what a fully functioning epistemic market looks like: one where prices carry the weight of knowledge, liberating agents from the need to constantly churn assets to test their hypotheses.

  ### A Serious Objection: The Empirical Vacuity Critique

  The most serious objection to this defence is the charge of empirical vacuity. Critics argue that real-world markets exhibit immense trading volume, far exceeding what can be explained by liquidity needs or risk-sharing. If the no-trade theorem were a relevant model of market epistemology, we should observe near-zero volume in liquid financial markets. The fact that we observe billions of daily transactions suggests the theorem's assumptions—particularly common priors and common knowledge of rationality—are so wildly unrealistic that the result offers no insight into how actual markets aggregate knowledge. If the theorem describes a world that does not exist, how can it support a theory of how the real world functions?

  ### Rebuttal: The Theorem as an Attractor State

  This objection mistakes a normative limit concept for a descriptive snapshot. In physics, the concept of a frictionless vacuum is empirically false; yet, it is indispensable for understanding the mechanics of motion. Similarly, the Milgrom–Stokey result should be viewed as the 'attractor state' of the Hayekian discovery procedure.

  Hayek himself acknowledged that the equilibrium state he described is never fully attained; the market is a *process* tending towards equilibrium. The no-trade theorem defines the logical endpoint of that process. It establishes the direction of the force exerted by rational competition. When we observe high trading volume, we are observing the market *in disequilibrium*, where information has not yet been fully incorporated into prices. The existence of the no-trade benchmark allows us to identify this volume not as a sign of health, but as a measure of informational friction.

  Moreover, the objection overlooks the role of 'noise traders' in bridging the gap between the theorem and reality. In models that relax the common knowledge assumption (such as those incorporating noise traders), trade resumes precisely because the rational agents cannot perfectly infer information from prices. However, the rational agents' behaviour is still governed by the logic of the no-trade theorem: they trade *less* aggressively than they would if they ignored the informational content of prices. The theorem thus acts as a brake on speculative excess. It supports the Hayekian case by showing that the rational core of the market constantly works to minimise volume by maximising informational content in prices.

  Therefore, the high volume we observe does not invalidate the theorem; it highlights the distance the market process still has to travel. The theorem remains the rigorous expression of the Hayekian ideal: a system where knowledge is so perfectly aggregated by the price mechanism that speculative gambling becomes logically impossible. To argue that this undermines Hayek is to argue that a map undermines the territory because the terrain is rougher than the lines on the paper. On the contrary, the map is necessary to navigate the terrain. The no-trade theorem provides the theoretical justification for believing that prices *can* serve as the condensed signals Hayek claimed they were, even if real-world frictions prevent the system from resting permanently in that state.

  In conclusion, the Milgrom–Stokey no-trade theorem should not be read as a proof that markets cannot process private information. It is a proof that when markets process private information successfully, speculative trade becomes redundant. This vindicates the Hayekian contention that the price system is an extraordinary mechanism for economising on knowledge. It demonstrates that the epistemic heavy-lifting is done by the pricing mechanism itself, not by the volume of transactions. By defining the conditions under which information renders trade unnecessary, the theorem clarifies the ultimate purpose of the market: not to facilitate endless speculation, but to coordinate plans so efficiently that such speculation ceases.
