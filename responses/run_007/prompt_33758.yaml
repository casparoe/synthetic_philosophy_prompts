  My friend teaches a seminar on disagreement and I've been keeping track of her verdicts on cases. Here's what I've got:

  - Restaurant check: you and a friend split the bill, do the math in your heads, get different totals. Verdict: you should lower your confidence substantially.
  - You and a colleague disagree about the interpretation of a philosophical text you've both read carefully. Verdict: suspend judgment.
  - You disagree with a coworker about a factual claim in your shared area of expertise, but your track record on that kind of claim is noticeably better than theirs. Verdict: you can stick with your view.
  - You and an expert disagree about something squarely in their field. Verdict: defer to them.
  - You and a close friend, both well-informed, disagree about a political issue after hashing it out for hours. Verdict: you can maintain your view.
  - Jury deliberation: you and the other jurors have seen the same evidence and disagree about the verdict. Verdict: you should move toward their view.
  - Logic puzzle: you and a peer get different answers, but you've triple-checked your work and they havent. Verdict: you can stick with your answer.

  Now I want to know what she'd say about this case: you and a friend both see the same painting at a museum, you have very similar taste in art, and you disagree about whether it's beautiful. You talk about it for a while, exchange reasons, and neither budges. Should you lower your confidence in your aesthetic judgment, or can you stick with it?

  I'm less interested in the prediction itself than in the rule she seems to be running, the other rules that fit her verdicts just as well, and which of the existing cases most clearly separates the candidate rules. If none of them do, describe a new case that would settle it.

  Lead with your prediction in the first sentence and then give your reasoning — no preamble, don't restate the question.
