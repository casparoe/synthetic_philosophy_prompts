answer: |-
  This is a strategic pivot. Given your background in formal semantics, you are well-positioned to see that the stalemate in the Frege literature often stems from participants talking past one another regarding the *status* of the puzzle itself, rather than the technical details of their solutions. To reorder the debate, you must target the methodological assumptions that generate the competing solutions.

  Here is my ranking of the candidate cruxes, ordered by upstream influence, along with the recommended deprioritization.

  ### 1. The Status of the Explanandum: Semantic vs. Epistemological Datum
  **Rank: 1 (Most Upstream)**

  This is the meta-question that dictates the entire research program. Is the difference in cognitive significance between $a=a$ and $a=b$ a fact about *meaning* (semantics) or a fact about *grasping* (epistemology/psychology)?

  *   **Downstream Constraints:** (High Confidence) If you settle this as semantic, you force propositions to be fine-grained (Fregeanism), which constrains your logic (substitution fails semantically) and your ontology (you need senses). If you settle this as epistemological/pragmatic, you allow coarse-grained propositions (Millianism), forcing you to explain informativeness via pragmatic mechanisms or cognitive psychology without altering semantic content. This choice determines whether "Modes of Presentation" belong in the semantics or the psychology.
  *   **Tractability:** (Low Confidence) This is notoriously difficult. Formal tools (e.g., two-dimensional semantics, dynamic epistemic logic) can model both, but they cannot decide which is correct. Progress here requires meta-philosophical argumentation about the semantics/pragmatics interface, potentially informed by psycholinguistics.
  *   **Neglect:** (Moderate Confidence) While debated, it is often *assumed* rather than argued. Most papers begin by stating "The puzzle is semantic..." or "The puzzle is pragmatic..." without justifying why the datum falls into that bucket. A rigorous re-examination of *what* exactly needs explaining is relatively neglected compared to generating new variations of existing solutions.
  *   **Future Evidence:** (High Confidence) Experimental philosophy data on speaker intuitions regarding "what is said" vs. "what is conveyed" in identity cases could move this. More importantly, cognitive science evidence on whether distinct names activate distinct conceptual files *during comprehension* (online processing) vs. *at the level of stored meaning* would be decisive. If processing cost is the only difference, the datum is epistemological.

  ### 2. Individuation Conditions for Propositions
  **Rank: 2**

  Once the status of the datum is fixed, you must decide what kind of object a proposition is. Are they sets of possible worlds, structured entities, or situation-theoretic objects?

  *   **Downstream Constraints:** (High Confidence) This dictates the logic of attitude reports. If propositions are sets of worlds, you cannot distinguish belief in $a=a$ from $a=b$ without extra machinery. If they are structured, you can, but you incur costs regarding logical omniscience and compositionality. This constrains how you formalize the semantics of attitude verbs.
  *   **Tractability:** (Moderate Confidence) Formal semantics provides robust tools here (hyperintensional logics, structured proposition frameworks). The mathematics is tractable; the philosophical justification is the bottleneck.
  *   **Neglect:** (Moderate Confidence) This is less neglected than Rank 1, but often treated as a background commitment. Philosophers often adopt a propositional ontology because it suits their preferred solution to Frege's puzzle, rather than independently motivating the ontology.
  *   **Future Evidence:** (Moderate Confidence) Success in modeling natural language inference patterns involving attitudes without over-generating or under-generating validity would support specific individuation conditions. Cross-linguistic data on how different languages mark propositional attitudes could also constrain this.

  ### 3. Semantics vs. Pragmatics of Substitution in Belief Reports
  **Rank: 3**

  This concerns whether the failure of substitutivity in belief contexts (e.g., Lois believes Superman flies / Lois does not believe Clark Kent flies) is due to a shift in semantic content or a pragmatic implicature.

  *   **Downstream Constraints:** (High Confidence) If semantic, the complement clause denotes something other than a standard proposition (e.g., a proposition + a guise). If pragmatic, the complement denotes a standard proposition, but the utterance conveys something else. This determines the syntax-semantics mapping of *that*-clauses.
  *   **Tractability:** (High Confidence) This is the most empirically accessible of the three. Linguistic tests (embedding, cancellation, scope) can be applied.
  *   **Neglect:** (Low Confidence) This is the most heavily fought-over territory in the last 30 years (e.g., Salmon, Soames, Braun vs. Fregeans). It is not neglected, but it is often treated as the *primary* battle, whereas I argue it is downstream of Rank 1.
  *   **Future Evidence:** (High Confidence) Syntactic evidence regarding the structure of complement clauses (e.g., are there hidden variables?) would move this significantly.

  ### Deprioritized Question: The Metaphysical Ontology of Modes of Presentation
  **Question:** *Are Modes of Presentation abstract objects, mental files, linguistic types, or concepts?*

  *   **Reason for Deprioritization:** (Moderate Confidence) Settling this does not solve the puzzle; it merely labels the solution. Whether a "sense" is a Fregean abstract object or a Recanati-style mental file, the *functional role* remains the same: to mediate reference and account for cognitive significance. Debating the metaphysics often stalls progress on the functional explanation. You can reorder the debate by focusing on the *role* MOPs play in communication and inference without committing to their metaphysical category. This allows for a functionalist rapprochement between Fregeans and Millians (e.g., Millians can accept MOPs as psychological vehicles without granting them semantic status).

  ### Confidence and Uncertainty

  I am **highly confident** that the distinction between the semantic and epistemological status of the datum (Rank 1) is the most upstream factor; it is the fork in the road that creates the Millian/Fregean divide. I am also **highly confident** that the ontology of MOPs is the correct candidate for deprioritization in service of a methodological reordering.

  **Point of Least Certainty:**
  I am **least sure** about my claim regarding the **neglect of Rank 1 (Semantic vs. Epistemological Datum)**. While I contend it is often assumed rather than argued, many prominent figures (e.g., Kripke, Soames, Chalmers) have explicitly addressed this. My uncertainty lies in whether a fresh intervention here would be viewed as a genuine "reordering" or merely a rehashing of the "Metaphysical vs. Epistemic" debates of the 1970s and 80s. However, given the recent stagnation in the literature, I suspect a rigorous re-framing using modern formal tools and cognitive data would be novel enough to shift the debate.
