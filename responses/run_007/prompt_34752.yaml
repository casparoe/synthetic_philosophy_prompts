      *   *Utilitarianism:* Often implies weighing interests, which can be graded based on capacity for suffering.
      *   *Capacity-Based Approaches:* Focus on specific cognitive capacities.
      *   *The "Thermostat" issue:* This touches on the "Hard Problem" of consciousness vs. functionalism. Is a thermostat *aware*? Most say no. The user seems to imply it has *some* non-zero awareness or at least should be on the same *moral* scale (even if zero-ish).
