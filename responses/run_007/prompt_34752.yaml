      *   The specific combination (Moral weight tracks awareness continuously, potentially down to very simple systems) is a specific flavor of Moral Gradualism often associated with **Utilitarianism** (specifically Preference or Hedonic Utilitarianism) or **Capacitarianism**.
      *   However, the "thermostat" part is tricky. Most ethicists draw a line at *sentience* (capacity to suffer). If the user thinks a thermostat has *some* moral weight (even negligible), they might be edging toward **Panpsychism** (ontologically) or a very broad **Functionalism**. But usually, the moral view is called **Scalar Utilitarianism** or **Gradualist Sentientism**.
      *   *Correction:* The user says "so the thermostat sits on the same scale... just at a negligible point." This implies the thermostat has *some* awareness. If they mean it has *no* awareness but we treat it on a scale, that's different. Reading closely: "track degree of awareness all the way down." This implies the thermostat has a non-zero degree of awareness. This is a controversial ontological claim.
      *   *Refinement:* I need to distinguish between the *moral* claim (status is graded) and the *metaphysical* claim (awareness is graded all the way to thermostats).
