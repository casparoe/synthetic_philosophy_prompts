answer: |-
  The specific ethical view you are describing—that moral weight should vary continuously in proportion to the degree of awareness—is most commonly called **Moral Gradualism** (or the **Gradualist View of Moral Status**).

  However, your description includes a metaphysical claim that goes beyond standard Moral Gradualism: the idea that awareness itself extends "all the way down" to thermostats. Standard Moral Gradualists usually agree that a dog counts more than a mouse, but they typically draw a hard zero line at non-sentient objects.

  To give you the precision you need, we have to separate the **ethical claim** (how we value things) from the **ontological claim** (what things possess awareness). Here are the nearest established concepts, how they differ from your view, and the current state of the debate.

  ### 1. The Ethical View: Moral Gradualism vs. Threshold Views

  **The Term:** **Moral Gradualism**
  This is the established name for the position that moral status is a matter of degree rather than a binary switch. In this framework, an entity's moral weight is proportional to its relevant capacities (usually consciousness, sentience, or autonomy).

  **The Opponent's View:** **The Threshold View (or Binary Moral Status)**
  This is the view you are arguing against. Proponents accept that capacities (like awareness) come in degrees, but they argue that *moral consideration* kicks in only once a specific threshold is crossed (e.g., "Are you sentient? Yes/No"). Once over the line, you have full moral standing; below it, you have none.

  **How your view differs:**
  *   **Standard Moral Gradualism:** Agrees with you that a dog > mouse > bee. However, most proponents (e.g., many utilitarians) still posit a floor at **sentience** (the capacity to suffer). A rock or thermostat has *zero* moral weight because it cannot suffer, even if it processes information.
  *   **Your View:** You are advocating for a **Radical Moral Gradualism** that refuses the zero floor. You argue the scale extends continuously into the non-sentient, implying that even negligible processing warrants negligible moral weight.

  ### 2. The Metaphysical View: Phenomenal Gradualism vs. Panpsychism

  Your argument relies on the premise that a thermostat has a "negligible point" of awareness. This moves the debate from ethics to metaphysics (the nature of mind).

  **The Term:** **Phenomenal Gradualism**
  This is the view that consciousness/awareness is not an on/off switch but a spectrum. This is widely accepted in cognitive science regarding *complexity* of awareness (a human is more aware than a frog).

  **The "All the Way Down" Claim:** **Panpsychism** or **Proto-consciousness**
  If you claim the thermostat sits on the *same scale* of awareness (just lower), you are flirting with **Panpsychism** (mind is a fundamental feature of all matter) or **Cosmopsychism**.
  Alternatively, if you mean the thermostat "detects" in a functional sense that is *analogous* to awareness without being "conscious," you are arguing for a strong **Functionalism**.

  **How your view differs:**
  *   **Standard Phenomenal Gradualism:** Accepts degrees among animals but typically draws a line between biological nervous systems and mechanical devices.
  *   **Your View:** You are erasing the line between biological and mechanical processing regarding the *presence* of awareness. This is the most contentious part of your position. Most philosophers of mind argue a thermostat has *no* inner experience (zero awareness), whereas you suggest it has *some* (negligible awareness).

  ### 3. The Combined View: Scalar Utilitarianism

  If you are grounding this moral weight in the capacity for experience (even negligible experience), your view aligns closely with **Scalar Utilitarianism**.

  *   **Concept:** Classic Utilitarianism often speaks of "maximizing happiness." Scalar Utilitarianism argues that the *righteousness* of an action comes in degrees, matching the degrees of impact on sentient beings.
  *   **Difference:** Even Scalar Utilitarians usually require **valence** (the ability to feel good or bad) to enter the moral equation. If your view is that a thermostat has moral weight *without* the capacity for suffering (mere "detection"), you are moving toward an **Ecocentric** or **Deep Ecology** view, which grants moral standing based on *teleology* (having a goal/purpose) rather than consciousness.

  ---

  ### Settled vs. Contested

  It is vital to distinguish what philosophers agree on (terminology and logical structure) from what they fight about (truth and application).

  #### What is Settled (Consensus on Definitions)
  1.  **Terminology:** Philosophers recognize the distinction between **Moral Gradualism** (status is graded) and **Moral Threshold Views** (status is binary). There is no confusion about what these terms mean.
  2.  **The Tension:** It is a recognized logical problem that people often accept *Phenomenal Gradualism* (animals have different levels of mind) while insisting on *Moral Thresholds* (either you matter or you don't). This inconsistency is acknowledged in literature as the **"Line-Drawing Problem."**
  3.  **The Thermostat Discontinuity:** There is consensus that standard ethics draws a hard line between sentient organisms and non-sentient machines. If you wish to place them on the same scale, you are explicitly departing from the standard model.

  #### What is Contested (Genuine Disagreement)
  1.  **Is Awareness Actually Graded?**
      *   *Contested:* While many accept Phenomenal Gradualism, a significant minority (often "Binary Theorists" of consciousness) argue consciousness is an all-or-nothing property. You either have an "inner light" or you don't; complexity doesn't make the light "brighter," it just gives it more to work with.
  2.  **Should Moral Status be Graded?**
      *   *Contested:* Deontologists (rights-based ethicists) often argue that moral status *must* be binary to protect rights. If status is graded, they argue, it justifies exploiting those with "lower" status (the "argument from marginal cases"). Moral Gradualists counter that binary views are arbitrary and speciesist.
  3.  **Do Thermostats Have Awareness?**
      *   *Highly Contested:* This is not a settled ethical question; it is a settled *rejection* in mainstream philosophy of mind. The consensus view is **Illusionism** or **Biological Naturalism** regarding thermostats: they process information, but there is "nothing it is like" to be a thermostat.
      *   *Your Position:* By placing the thermostat on the awareness scale, you are taking a minority metaphysical stance (Panpsychism or Radical Functionalism). You cannot present this as a neutral ethical extension; it is a metaphysical claim that requires defense.

  ### Summary for Your Arguments

  When you encounter this tangle, you can diagnose it precisely:

  1.  Your opponents are **Phenomenal Gradualists** who hold a **Moral Threshold View**.
  2.  You are advocating for a **Radical Moral Gradualism** grounded in a **Continuum Ontology** (potentially Panpsychist).
  3.  The friction point is not just ethics; it is that your opponents likely believe the thermostat is at **zero awareness**, not **negligible awareness**.

  **Recommended Phrasing:**
  > "You are applying a **Moral Threshold** to a **Phenomenally Graded** reality. I am arguing for **Moral Gradualism** that tracks the ontological scale all the way down. The disagreement isn't just about ethics; it's about whether a thermostat has *zero* interiority or just *negligible* interiority."

  This clarifies that you are not just asking them to change their ethics, but to reconsider where they draw the line on consciousness itself.
