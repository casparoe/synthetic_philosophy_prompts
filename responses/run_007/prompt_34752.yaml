      *   *Distinction:* The user's opponents accept *Phenomenal Gradualism* (Dog > Mouse) but reject *Moral Gradualism* (In/Out). Or they accept Moral Gradualism within the "moral community" but draw a hard line at the entry.
      *   *The "Switch":* This is often called the **Threshold Problem** or the **Line-Drawing Problem**.
      *   *Settled:* There is no consensus on *which* view is correct. There *is* consensus on the terminology (Gradualism vs. Threshold).
