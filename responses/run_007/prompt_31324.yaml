  3.  **Evaluate the Analogy (Philosophical Groundwork):**
      *   *Standard View:* The "metaphysical causation" view is associated with Schaffer, Wilson, etc. It's a contested but serious view. However, the *pedagogical* use here is to drive a realist conclusion.
      *   *The Problem:* Causation's realism is often tied to its role in prediction, manipulation, and physical production. Grounding lacks these. If the realism about causation depends on those missing features, the analogy fails to transfer the realist justification.
      *   *Key Disanalogy:* Causation involves distinct existences (Humean point) and production/energy transfer (often). Grounding involves non-distinct existences (constitutive) and no energy transfer.
      *   *Key Disanalogy for Realism:* Causation is often validated by counterfactual intervention (manipulability). Grounding is not manipulable in the same way (you can't intervene on the microstructure without changing the water).

  4.  **Drafting the Correspondence Table:**
      *   Cause $\rightarrow$ Ground (e.g., microstructure).
      *   Effect $\rightarrow$ Grounded (e.g., water is hot).
      *   Temporal Order $\rightarrow$ Ontological Order (fundamentality).
      *   Mechanism $\rightarrow$ ? (Constitution/Essence).
      *   Laws $\rightarrow$ ? (Principles of Grounding/Metaphysical Laws).

  5.  **Identifying Disanalogies (The "Meat"):**
      *   *Temporality:* Causation is diachronic; Grounding is synchronic. (Colleague admits this, calls it "harmless").
