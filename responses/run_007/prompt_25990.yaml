          *   The "no sympathy/emotion" claim.
          *   The "grudging benefactor" (misanthrope) example.
          *   The claim that motives don't determine moral worth (consequentialist/utilitarian vs. deontological views).
          *   The claim that "basically everyone since" has abandoned motive-based worth (historical accuracy).
