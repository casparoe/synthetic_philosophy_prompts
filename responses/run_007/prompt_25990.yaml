answer: |-
  This is a classic "intro-to-ethics caricature" of Kant. While it captures the *spirit* of the *Groundwork* Section 1 provocative style, it fails on the technical details that matter for a PhD-level discussion in moral psychology. Your friend is conflating the **deontic status of an action** (is it right?) with the **moral worth of an action** (is it praiseworthy?), and he is reading Kant's *illustrative examples* as *exhaustive conditions*.

  Here is a sentence-by-sentence breakdown of your friend's summary, flagged with how a Kant scholar would receive it, followed by a section on the contemporary "right reasons" landscape.

  ---

  ### Sentence 1
  > *"Kant's whole thing about moral worth is that an action is only praiseworthy if you do it solely from duty..."*

  *   **Scholarly Acceptance:** **Mostly Accurate.**
      *   In *Groundwork* 4:397, Kant writes that an action from duty has its moral worth "not in the purpose to be attained by it but in the maxim in accordance with which it is decided." He argues that to have moral worth, the action must be done *aus Pflicht* (from duty), not merely *pflichtmäßig* (in accordance with duty).
  *   **Scholarly Pushback:** **Nuance on "Praiseworthy."**
      *   Kant distinguishes between actions that are **obligatory** and those that are **meritorious**. Moral worth applies to both, but the "praise" differs. More importantly, scholars debate whether "solely" means *exclusion* of other incentives or *sufficiency* of the duty incentive.
      *   **The Overdetermination Objection:** If I do my duty *and* I have an inclination to do it, does the action lack moral worth? Most contemporary Kantians (e.g., Marcia Baron, Barbara Herman) argue **no**. Kant requires that duty be the *sufficient* determining ground of the will, not that it be the *only* psychological state present.

  ### Sentence 2
  > *"...meaning you can't have any sympathy or emotional involvement whatsoever."*

  *   **Scholarly Acceptance:** **False.**
      *   This is the most common distortion of Kant's moral psychology. Kant does not argue for the eradication of emotion (apatheia). In the *Metaphysics of Morals* (6:402), he explicitly argues we have a duty to cultivate sympathetic feelings because they help us fulfill duties of beneficence.
  *   **Scholarly Pushback:** **Determining Ground vs. Accompanying Feeling.**
      *   Kant's point is about the *determining ground* of the will (*Bestimmungsgrund*). You can feel sympathy, joy, or love while acting. What you cannot do is let those feelings *determine* the action. If the sympathy fades, would you still do it? If yes, the emotion was accompaniment; if no, the emotion was the motive.
      *   **Moral Feeling:** Kant acknowledges "respect for the law" (*Achtung*) as a feeling produced by reason. So, it's not that action must be devoid of affect; it's that the affect must be rationally generated, not pathologically determined.

  ### Sentence 3
  > *"Like, if you help someone and you feel good about it, that actually makes the action less morally worthy, because your motivation is contaminated."*

  *   **Scholarly Acceptance:** **Contested/Debatable.**
      *   This relies on the **"Contamination Reading."** Some interpreters think Kant implies that the presence of inclination makes it epistemically difficult to know if one acted from duty, thus obscuring moral worth.
  *   **Scholarly Pushback:** **The "No Diminution" View.**
      *   Scholars like **Marcia Baron** ("Kantian Ethics Almost Without Apology") argue strongly against this. She posits that acting from duty *and* inclination (overdetermination) does not *diminish* worth; it just means the inclination adds no *extra* moral worth.
      *   **Moral Salience:** Barbara Herman argues that for a Kantian agent, moral training shapes inclinations so that they align with duty. The "feeling good" isn't contamination; it's a sign of a well-ordered moral character. The danger is only if the agent would *fail* to act were the feeling absent.

  ### Sentence 4
  > *"That's why he says the only person whose action has genuine moral worth is the one who hates helping but does it anyway out of duty."*

  *   **Scholarly Acceptance:** **Textually Present but Interpretively Misleading.**
      *   Your friend is referring to the **Misanthrope Example** (*Groundwork* 4:398). Kant describes a man who is "by temperament cold and indifferent to the suffering of others" yet helps because he recognizes it as a duty. Kant says in this case, the moral worth of the action "shines forth" all the more clearly.
  *   **Scholarly Pushback:** **Illustration vs. Definition.**
      *   Kant uses the misanthrope as a **limiting case** to isolate the concept of duty for the sake of argument, not to establish it as the *only* model of moral worth. He says this example is useful "for the sake of illustration" (*zur Erläuterung*).
      *   To claim this is the *only* person with moral worth ignores Kant's discussion of the "friend of humanity" earlier in the section. The friend of humanity acts from inclination; Kant says this action has *no* moral worth *in that specific instance* because it was driven by inclination, but he does not say the friend of humanity *cannot* act from duty in other instances. The misanthrope is a heuristic device, not the ideal moral agent.

  ### Sentence 5 & 6
  > *"This is obviously perverse, and basically everyone since has agreed that motives don't determine moral worth — what matters is whether the action is right, not why you did it."*

  *   **Scholarly Acceptance:** **Historically False.**
      *   This claims a consensus that does not exist. It conflates **rightness** (deontic status) with **moral worth** (aretaic/normative status).
  *   **Scholarly Pushback:** **The Virtue Ethics & Kantian Revival.**
      *   **Virtue Ethics:** Anscombe, MacIntyre, Foot, and Hursthouse all center moral evaluation on character and motive. To say "motives don't matter" is to reject the core of virtue ethics.
      *   **Utilitarianism:** Even Mill distinguishes between the morality of the *action* and the morality of the *agent*. Motives determine the worth of the agent, even if consequences determine the rightness of the act.
      *   **Contemporary Kantians:** Korsgaard, Wood, O'Neill, and Herman have spent the last 40 years defending the idea that motives are constitutive of moral value.

  ---

  ### The Contemporary "Right Reasons" View

  Your intuition that the final claim writes off a huge chunk of contemporary ethics is correct. There is a robust tradition in contemporary moral philosophy that defends the idea that **motives determine moral worth**, even if they don't determine deontic rightness.

  Here is how a defender of the "Right Reasons" view would respond to your friend:

  **1. The Distinction Between Right Action and Well-Done Action**
  Contemporary philosophers like **Jonathan Dancy**, **Joseph Raz**, and **T.M. Scanlon** argue that there is a difference between doing the right thing and doing it *well*.
  *   **Example:** If I repay a debt solely to launder money, I have done the *right action* (the debt is paid), but I have not acted *morally well*.
  *   **Response:** Your friend's claim ("what matters is whether the action is right") collapses this distinction. It reduces morality to a checklist of outcomes. The "Right Reasons" view holds that an action is only fully morally successful if done for the reasons that make it right.

  **2. Moral Worth as Non-Instrumental Value**
  **Nomy Arpaly** (*Unprincipled Virtue*) and **Paulina Sliwa** argue that moral worth tracks **responsiveness to moral reasons**.
  *   If I help you because I want a tax break, I am responsive to financial reasons, not moral reasons.
  *   If I help you because I recognize your need, I am responsive to moral reasons.
  *   **Response:** Even if the outcome is identical, the moral value of the agency differs. To deny this is to treat moral agents as mere causal engines for good states of affairs, which ignores the value of rational agency itself.

  **3. The "Freakishness" Objection**
  Your friend calls Kant's view "perverse." Contemporary defenders (like **Baron**) argue that the *friend's* view is more perverse.
  *   If motives don't matter, then a racist who accidentally helps a minority group (perhaps to make them look dependent) has performed an action of equal moral worth to the anti-racist activist.
  *   **Response:** We intuitively praise the activist more. Why? Because motives matter. To abandon motive-based worth is to abandon our intuitive practices of blame and praise regarding *character*.

  ### Summary for Your Seminar Context

  If you want to correct your friend without being combative, you might frame it this way:

  1.  **Textual Correction:** Kant's "misanthrope" is a heuristic for isolating the concept of duty, not the exclusive model of the moral saint. Kant allows for inclination, provided it is not the *determining ground*.
  2.  **Conceptual Correction:** Distinguish **Rightness** (conformity to law) from **Moral Worth** (value of the maxim). Your friend is arguing that only Rightness matters; this is a consequentialist stance, not a neutral consensus.
  3.  **Historical Correction:** "Basically everyone since" is incorrect. Virtue ethicists, contemporary Kantians, and even some consequentialists (motive utilitarians) argue that motives are essential for evaluating the *agent*, even if they don't determine the *act's* deontic status.

  Your friend has given you the "Undergraduate Kant" summary. As a PhD student in moral psychology, you are well within your rights to insist on the "Graduate Kant" nuance: the debate isn't about whether we should have emotions, but about the **hierarchical structure of our incentives** and whether **responsiveness to moral reasons** is constitutive of moral value.
