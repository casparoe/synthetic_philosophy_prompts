answer: |-
  The term you are looking for is **sphexishness**.

  While it originated as a philosophical coinage, it has solidified into a recognized concept within cognitive science, philosophy of mind, and artificial intelligence research. It is not merely a clever metaphor; it is the specific label for the phenomenon where an agent's behavior appears goal-directed and flexible but is revealed to be governed by rigid, context-insensitive routines when the environment deviates from the expected norm.

  Here is the breakdown of the concept, its origins, its scope, and how to distinguish it from related ideas.

  ### Origin and Definition
  The term was popularized by Douglas Hofstadter in his 1979 book *Gödel, Escher, Bach: An Eternal Golden Braid*. He drew upon the ethological experiments of Jean-Henri Fabre involving the *Sphex* wasp. As you noted, the wasp drags a paralyzed cricket to its burrow, leaves it at the threshold, enters to inspect, comes out, and drags the cricket inside. If the cricket is moved a few inches while the wasp is inside, the wasp emerges, drags the cricket back to the threshold, leaves it there, and goes inside to inspect again. It can be trapped in this loop indefinitely.

  Hofstadter defined **sphexishness** as the quality of being locked into a pre-determined script despite changing conditions that should logically alter the plan. Crucially, the term captures the *illusion* of intelligence. If a machine acted randomly, we wouldn't think it was intelligent. If it acted flexibly, we would. Sphexishness occupies the uncanny valley between the two: it looks intelligent until the specific trigger reveals the mechanical underlying structure.

  ### Scope Across Substrates
  You asked whether this applies equally to wasps, humans, and AI. The answer is yes, because sphexishness describes a **control architecture**, not a biological substrate.

  1.  **Biological (Wasps/Insects):** The rigidity is hardcoded by evolution (Fixed Action Patterns). The "software" is instinct.
  2.  **Human (Bureaucracies/Habits):** The rigidity is encoded in policy or neural habit loops. When a human follows a procedure mindlessly ("I'm just following the rules"), they are exhibiting sphexishness. The cognitive load of constant context-evaluation is offloaded to the routine, creating efficiency at the cost of flexibility.
  3.  **Artificial (AI/Algorithms):** The rigidity is encoded in weights and parameters trained on a specific distribution. When an LLM loops on a script because it cannot recognize the semantic shift in a prompt, it is sphexish.

  In all three cases, the agent is optimizing for a local signal (get prey to threshold; follow policy step 4; complete the predicted token sequence) without a higher-level monitoring system that evaluates whether the *goal* is actually being achieved.

  ### Distinguishing Sphexishness from Related Concepts
  To use this term precisely in your writing, you need to distinguish it from nearby concepts.

  *   **Vs. Brittleness:** Brittleness is the *outcome* (the system breaks). Sphexishness is the *mechanism* (the system breaks because it keeps doing the thing that used to work). A glass bridge is brittle; a sphexish agent is a driver who keeps pressing the gas pedal when the car goes off a cliff because "pressing gas makes car go" was true five seconds ago.
  *   **Vs. Fixed Action Pattern (FAP):** FAP is the biological term for the wasp's behavior. It is too narrow for your purposes because it implies instinct. A bureaucracy isn't instinctive; it's procedural. Sphexishness is the functional analog of a FAP that applies to any system.
  *   **Vs. Simple Error:** A mistake is random or due to lack of knowledge. Sphexishness is *systematic*. If the agent repeats the failure mode despite receiving feedback that the action is futile (the wasp sees the cricket moved; the bot sees the user confused), it is sphexish.
  *   **Vs. Stubbornness:** Stubbornness implies a willful refusal to change. Sphexishness implies an *inability* to perceive the need to change. The agent isn't resisting; it is oblivious.

  ### The Edges: When is it Sphexishness?
  To determine if a failure counts as sphexishness, apply these three criteria:

  1.  **Competence Mask:** The agent must demonstrate apparent competence in standard conditions. If it looks dumb from the start, it's just broken. The intelligence must be plausible until the perturbation.
  2.  **Looping/Repetition:** The failure mode must involve continuing or repeating the previously successful strategy despite evidence that it is no longer effective.
  3.  **Lack of Meta-Cognition:** The agent must lack a "monitor" process that checks if the sub-routine is actually serving the higher-level goal. The wasp doesn't think, "Why am I inspecting?" The bot doesn't think, "Is this script helping?"

  ### Recommendation for Your Writing
  You should use **sphexishness**. It is evocative, precise, and already carries the exact conceptual weight you need. While it is not as common as "bias" or "heuristics," it is established enough in science and tech journalism that you can use it without explanation if the context is clear, or with a brief parenthetical on first use.

  It solves your problem of "brittleness" being too broad. Brittleness tells us the system broke; sphexishness tells us *why* it broke (because it was mimicking intelligence rather than embodying it) and predicts *how* it will break (by repeating the past).

  \answer{sphexishness}
