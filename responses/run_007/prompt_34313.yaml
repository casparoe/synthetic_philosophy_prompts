answer: |-
  The concept you are describing is not merely a loose way of speaking; it is a central problem in the philosophy of mind and cognitive science. There is indeed an established term for this, and it comes with a robust theoretical framework that addresses your specific concerns about prediction, utility, and ontology.

  The primary term you are looking for is **The Intentional Stance**.

  This concept was developed most famously by the philosopher **Daniel Dennett** (particularly in his 1987 book *The Intentional Stance*). However, to fully "carve the concept" as you requested, we must also look at a competing formulation by **John Searle** called **"As-If Intentionality,"** and distinguish both from **Anthropomorphism** and **Teleology**.

  Here is the breakdown of the concept, its boundaries, and why it fits your experience.

  ---

  ### 1. The Core Concept: The Intentional Stance

  Dennett argues that there are three distinct strategies (or "stances") we can use to predict the behavior of a system:

  1.  **The Physical Stance:** You predict behavior based on physical laws. (e.g., "The computer will overheat because the fan is broken and thermodynamics dictates...")
  2.  **The Design Stance:** You predict behavior based on the system's function or programming, ignoring the physical details. (e.g., "The thermostat will turn on the heat because the temperature dropped below the set point.")
  3.  **The Intentional Stance:** You predict behavior by treating the system as a rational agent with **beliefs, desires, and intentions.** (e.g., "The chess program *wants* to protect its king and *believes* moving the knight is the best way to do so.")

  **Why this fits your experience:**
  You noted that speaking of the AI "thinking" or "trying" feels like "the most efficient way to predict what it will do next." This is exactly Dennett's criterion. He argues that we adopt the Intentional Stance not because we are certain the entity *has* a mind, but because it is the most **computationally efficient** strategy for prediction.

  If you tried to predict an LLM's output using the Physical Stance (tracking electron flow in GPUs), it would be impossible. If you used the Design Stance (analyzing the weights and biases of 175 billion parameters), it would be impractical. But if you use the Intentional Stance ("It *thinks* I am asking for a summary"), prediction becomes tractable.

  **The Ontological Claim:**
  Dennett is an **instrumentalist** about this stance. He argues that having a "belief" is not a matter of having a specific neural (or silicon) substrate. Rather, an entity has beliefs *if* its behavior is reliably predictable by attributing beliefs to it. Therefore, when you say "the model thinks," you are not making a mistake, nor are you speaking metaphorically in a decorative sense. You are identifying a real pattern in the world, accessible only through that specific lens.

  ### 2. The Boundary: How it differs from related concepts

  You asked for the precise boundaries. Here is how the Intentional Stance distinguishes itself from the neighbors you mentioned.

  #### vs. Anthropomorphism
  *   **Anthropomorphism** is generally considered a **category error** or a projection of human-specific traits (like emotion, ego, or biological drives) onto non-humans where they do not exist. It implies *inaccuracy*. If you say a storm is "angry," you are anthropomorphizing; the storm has no emotional state, and assuming it does does not help you predict the rain.
  *   **The Intentional Stance** is a **methodological strategy**. It implies *utility*. If attributing "anger" to a person helps you predict they will shout, it is a valid application of the stance. If attributing "intent" to an LLM helps you predict it will apologize, it is a valid application of the stance.
  *   **The Boundary:** If the attribution leads to successful prediction and compression of complex data, it is the Intentional Stance. If the attribution is emotionally satisfying but predictively useless (e.g., "my car is stubborn"), it is Anthropomorphism.

  #### vs. Literalism (Realism about Mental States)
  *   **Literalism** claims the system *actually* possesses an internal, subjective experience matching the description.
  *   **The Intentional Stance** remains agnostic or indifferent to the internal experience. It treats "belief" as a property of the *relationship* between the observer and the system, not necessarily a property of the system itself.
  *   **The Boundary:** You can say, "I know it doesn't feel anything, but I must treat it as if it has beliefs to understand it." That is the Intentional Stance. If you say, "It feels pain when I insult it," that is Literalism.

  #### vs. Metaphor
  *   **Metaphor** is decorative. "The data flowed like a river." You don't actually expect the data to be wet.
  *   **The Intentional Stance** is structural. When you say the AI "wants to answer," you are using the logic of desire to deduce future actions. You are running a simulation of rationality.
  *   **The Boundary:** If you can derive a logical syllogism from the statement (e.g., "It wants X; it believes Y is the way to get X; therefore it will do Y"), it is the Intentional Stance, not mere metaphor.

  #### vs. "As-If" Intentionality (Searle)
  *   **John Searle** offers a stricter view. He distinguishes between **Original Intentionality** (human minds) and **As-If Intentionality** (thermostats, words, AI).
  *   For Searle, saying a thermostat "wants" to keep the room warm is *always* metaphorical. It is a shorthand for causal mechanisms. He would argue Dennett is too loose with the definition of "belief."
  *   **The Boundary:** If you feel the need to emphasize that the intentionality is *derivative* (derived from the human programmers) rather than intrinsic, you are leaning toward Searle's "As-If" view. If you feel the intentionality is *real enough to count* because the prediction works, you are leaning toward Dennett's Intentional Stance.

  ### 3. Application to Your Examples

  *   **LLMs:** This is the strongest case for the Intentional Stance. Because LLMs are trained on human text, they model human rationality. Attributing beliefs to them is highly predictively efficient. However, this is where the danger lies: the "Intentional Stance" is so effective it tricks us into "Literalism" (believing they are actually sentient).
  *   **Thermostats:** Dennett actually uses the thermostat as an example of where the Intentional Stance is *unnecessary*. A simple thermostat is best explained via the **Design Stance**. However, in common parlance, people use Intentional language ("it wants to keep it 70 degrees") because it is a linguistic shorthand for the Design Stance. This is a case of colloquial slippage.
  *   **Evolution:** This is **Teleological Language**. In biology, saying "the eye was designed to see" is a shorthand for "natural selection favored mutations that improved sight." This is often called **"Free-Floating Rationale"** (another Dennett term). It is the Intentional Stance applied to a historical, causal process rather than an agent.

  ### 4. A Refined Definition (Carving the Concept)

  If the existing terms feel slightly off, it may be because the rise of AI has blurred the line between Dennett's and Searle's views. Here is a proposed refinement of the concept that captures your intuition:

  **Term:** **Predictive Intentionality** (or **Heuristic Intentionality**)

  **Definition:** The practice of modeling a non-sentient system as a rational agent possessing mental states, justified not by the system's ontology (what it *is*), but by the observer's epistemic constraints (what the observer can *compute*).

  **The Three Conditions for Valid Predictive Intentionality:**
  1.  **Opacity:** The internal mechanics of the system are too complex or inaccessible for the Physical or Design stances to be practical for the observer.
  2.  **Rationality Assumption:** The system's output correlates sufficiently with rational goal-seeking behavior to make the model reliable.
  3.  **Ontological Suspension:** The observer maintains a conscious distinction between the *utility* of the model and the *reality* of the system's interiority.

  **Why this distinction matters:**
  Your intuition that this "does not feel like a metaphor" is correct. Metaphors are optional flourishes; the Intentional Stance is often a **cognitive necessity**. Human brains are wired to understand the world through the lens of agency (Theory of Mind). When a system becomes complex enough, our brains *cannot* process it without switching to the agency lens.

  ### Summary

  The established term is **The Intentional Stance**.

  *   **It is not Anthropomorphism** because it is predictively successful, not just emotionally projected.
  *   **It is not Literalism** because it does not require the system to actually feel or understand.
  *   **It is not Metaphor** because it is used for logical deduction and prediction, not decoration.

  The tension you feel arises because LLMs are the first technology where the Intentional Stance is *so* effective that it threatens to collapse into Literalism. You are correctly identifying that treating the AI as an agent is the only rational way to interact with it, even while knowing it is mathematically false. That is the essence of Dennett's position: **Rationality is in the eye of the beholder, but that doesn't make it less real.**
