prompt: |-
  I'm on my school's honor council, the student/faculty board that decides what happens to kids who get cought cheating. We meet like twice a month, we get a short report on what happened plus a written statement from the student, and then we vote on a punishment from a fixed menu: warning, zero on the assignment, grade cap for the course, suspension, expulsion. None of us have any training, we get maybe 20 minutes a case, and the faculty advisor keeps saying we need to be "consistent" but never says consistent with what.

  I know there's this whole philosophy debate between retributivism and consequentialism about punishment — retributivism says punish people because they deserve it and the punishment should fit the crime, consequentialism says punish only if it makes things better overall, by deterring people, protecting the school, rehabilitating the cheater, whatever. What I want is for you to turn that into a decision procedure we could actually run at a meeting. Give me the questions in order, what counts as a good enough answer to each, where the procedure says stop, and where it has to hand the decision to a person because it's a values call and not a facts call. Then run the procedure on two cases: (1) a junior copied three sentences from SparkNotes into a short homework essay and got flagged by a plagiarism checker, and (2) a senior paid somebody to take their AP exam for them. Be honest about where retributivism and consequentialism point in different directions, and which one the procedure actually commits us to. Also tell me what the procedure can't do, like what it will systematically get wrong.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **User Role:** Student member of a school Honor Council.
      *   **Context:** Meets twice a month, 20 mins/case, no training, fixed menu of punishments (Warning, Zero, Grade Cap, Suspension, Expulsion). Faculty advisor demands "consistency" without defining it.
      *   **Task:** Create a practical decision procedure based on Retributivism vs. Consequentialism.
      *   **Requirements:**
          *   Ordered questions.
          *   Criteria for "good enough" answers.
          *   Stop conditions/hand-offs to human judgment.
          *   Apply to two specific cases (SparkNotes junior vs. AP Exam proxy senior).
          *   Identify conflicts between the two philosophical frameworks.
          *   State which framework the procedure commits to.
          *   Acknowledge limitations/systematic errors.
      *   **Tone:** Honest, practical, ethically rigorous but usable by teenagers/teachers under time pressure.

  2.  **Deconstruct the Philosophical Frameworks:**
      *   *Retributivism:* Focus on culpability, intent, harm done, proportionality. "Just deserts." Past-oriented.
      *   *Consequentialism:* Focus on future outcomes, deterrence, rehabilitation, safety of community. Future-oriented.
      *   *The Conflict:* Retributivism might demand harsh punishment for a malicious act even if it doesn't help anyone. Consequentialism might let a serious offender off easy if punishment causes more harm than good (or vice versa: punish an innocent person if it deters others, though that's usually off-limits in justice systems).
      *   *School Context:* Schools are *primarily* educational institutions, not courts of law. This leans towards consequentialism (rehabilitation/deterrence) but requires retributive boundaries (fairness/proportionality) to maintain legitimacy.

  3.  **Drafting the Decision Procedure (The "Algorithm"):**
      *   *Constraint:* 20 minutes per case. Needs to be fast.
      *   *Constraint:* Fixed menu of punishments.
      *   *Goal:* Consistency (as requested by the advisor).
      *   *Structure:*
          1.  Fact-Finding (Did they do it? Was it intentional?).
          2.  Severity Assessment (Retributive baseline).
          3.  Mitigating/Aggravating Factors (Context).
          4.  Consequentialist Check (Deterrence/Rehab).
          5.  Final Selection.
      *   *Hand-offs:* Where do we need human judgment? (Intent is fuzzy, "community safety" is vague).

      *Refining the Steps:*
      *   *Step 1: Culpability.* Intentional vs. Negligent vs. Accidental. (Crucial for Retributivism).
      *   *Step 2: Impact.* How much did it affect the grade/class integrity?
      *   *Step 3: History.* First offense? Repeat? (Crucial for Consequentialism/Recidivism).
      *   *Step 4: The "Menu" Mapping.* Match severity to punishment tier.
      *   *Step 5: The "Override".* Is there a reason to deviate? (Human judgment).

  4.  **Developing the Questions & Criteria:**
      *   Need to make sure the "Stop" points are clear.
      *   Need to identify where values come in (e.g., defining "intent").

  5.  **Applying to Case 1 (SparkNotes Junior):**
      *   *Facts:* 3 sentences, short essay, plagiarism checker.
      *   *Intent:* Likely lazy/careless, not systemic fraud.
      *   *Impact:* Low.
      *   *History:* Assume first offense.
      *   *Retributive:* Minor harm = Minor punishment.
      *   *Consequentialist:* Harsh punishment might ruin record without deterring others much. Warning/Zero makes sense.

  6.  **Applying to Case 2 (AP Exam Proxy Senior):**
      *   *Facts:* Paid someone, high stakes exam, external certification.
      *   *Intent:* Premeditated, financial transaction, deception.
      *   *Impact:* High (undermines AP integrity, school reputation).
      *   *History:* Assume first offense (but act is severe).
      *   *Retributive:* Serious breach of trust = Severe punishment.
      *   *Consequentialist:* Need strong deterrence. Rehabilitation unlikely (they are graduating).
      *   *Conflict:* Retributivism says "punish hard." Consequentialism says "punish hard to deter." They align here, but on *severity* they might differ if the student has a tragic backstory (Consequentialism might care more about the student's future than Retributivism).

  7.  **Identifying the Commitment:**
      *   A school *must* lean Consequentialist (education/rehab) but *must* look Retributive (fairness) to be accepted.
      *   The procedure should probably be a "Hybrid" but explicitly state where the tie-breaker lies. Given the "Honor Council" context, legitimacy is key. Legitimacy comes from perceived fairness (Retributivism). However, the goal is learning (Consequentialism).
      *   *Decision:* The procedure will use Retributivism to set the *range* (proportionality) and Consequentialism to pick the *point* within the range (rehab/deterrence).

  8.  **Identifying Limitations:**
      *   Implicit bias (who looks "sorry"?).
      *   Information asymmetry (20 mins isn't enough to know the truth).
      *   Systemic issues (cheating due to pressure/mental health ignored).
      *   The "Consistency" trap (treating unequal situations equally).

  9.  **Review and Refine:**
      *   *Self-Correction during drafting:* Make sure I don't sound too academic. The user is a student. Keep the language clear.
      *   *Check constraints:* Did I answer where it hands off to a person? Yes. Did I run both cases? Yes.
      *   *Honesty:* Acknowledge that 20 minutes is absurdly short for justice.

  10. **Final Polish:** Organize with clear headings. Ensure the "Philosophical Commitment" section is distinct. (Proceed to generate output based on this structure).

  *(Self-Correction Note)*: I need to be careful not to give legal advice. This is a school disciplinary procedure. I should emphasize that this is a *tool for thought*, not a binding legal contract. Also, I need to make sure I address the "Faculty Advisor's Consistency" demand. Consistency usually means "like cases treated alike," which requires categorizing cases.

  *(Refining the Procedure)*: Let's create a "Flowchart" style text.
  1. Establish Fact & Intent.
  2. Categorize Severity (Tier 1-3).
  3. Check History.
  4. Apply Consequentialist Adjustment.
  5. Final Vote.

  *(Refining the Cases)*:
  Case 1: Tier 1 (Minor).
  Case 2: Tier 3 (Major).

  *(Refining the Philosophy)*:
  Retributivism sets the *ceiling* (don't punish more than deserved).
  Consequentialism sets the *floor* (punish enough to deter).
  Actually, usually it's: Retributivism sets the *baseline* (proportionality), Consequentialism adjusts for *future risk*.

  Let's write it.cw
answer: |-
  This is a heavy responsibility for 20 minutes a case. Your faculty advisor is right that consistency matters, but they are wrong that it can be achieved without a defined framework. "Consistency" without a standard just means "consistently arbitrary."

  Below is a **Hybrid Decision Procedure**. It acknowledges that a school is not a prison (so pure retributivism is wrong) but also not a therapy clinic (so pure consequentialism is wrong). It uses **Retributivism to set the bounds** (fairness/proportionality) and **Consequentialism to select the specific penalty** (deterrence/rehabilitation).

  ### The Honor Council Decision Protocol (HCDP)

  **Time Limit:** 20 Minutes
  **Goal:** Legitimacy + Educational Outcome

  #### Phase 1: Fact & Culpability (5 Minutes)
  *Goal: Establish the Retributive Baseline. You cannot punish fairly if you don't know what they did.*

  **Q1: Is the evidence clear and undisputed?**
  *   **Yes:** Proceed.
  *   **No:** **STOP.** Hand off to Faculty Advisor. You cannot vote on ambiguous facts in 20 minutes.
  *   **Why:** Consequentialism might say "punish them anyway to send a message." Retributivism says "never punish the uncertain." This procedure sides with Retributivism here to maintain legitimacy.

  **Q2: What was the level of intent?**
  *   **A. Accidental/Negligent:** (e.g., forgot quotation marks, misunderstood citation rules).
  *   **B. Intentional/Opportunistic:** (e.g., copied/pasted to save time, knew it was wrong but did it anyway).
  *   **C. Premeditated/Systemic:** (e.g., paid a proxy, hacked a system, coordinated cheating ring).
  *   **Why:** Retributivism demands punishment scale with moral blameworthiness.

  #### Phase 2: Severity Categorization (5 Minutes)
  *Goal: Map the act to the Punishment Menu.*

  **Q3: What is the scope of harm?**
  *   **Tier 1 (Low):** Single assignment, low stakes, internal class impact only.
  *   **Tier 2 (Medium):** Major exam, cumulative grade impact, undermines course integrity.
  *   **Tier 3 (High):** External certification (AP/IB), threatens school accreditation/reputation, involves money/fraud.

  **Q4: Match Tier + Intent to the "Presumptive Range":**
  *   **Tier 1 + Accidental:** Warning OR Zero.
  *   **Tier 1 + Intentional:** Zero OR Grade Cap.
  *   **Tier 2 + Intentional:** Grade Cap OR Suspension.
  *   **Tier 3 + Premeditated:** Suspension OR Expulsion.
  *   **Why:** This satisfies the Advisor's demand for consistency. Like cases get like ranges.

  #### Phase 3: Consequentialist Adjustment (5 Minutes)
  *Goal: Select the specific punishment within the Range based on future outcomes.*

  **Q5: Is there a risk of recidivism (repeat offense)?**
  *   **High Risk:** (Prior offenses, no remorse, view cheating as "beating the system"). -> **Select Higher End of Range.**
  *   **Low Risk:** (First offense, genuine remorse, external stressor identified). -> **Select Lower End of Range.**

  **Q6: Will the punishment destroy their educational future disproportionately?**
  *   **Yes:** (e.g., Expulsion for a Tier 1 offense). -> **STOP.** You must move down one tier. Retributivism forbids disproportionate punishment.
  *   **No:** Proceed.

  **Q7: Does the school need to signal safety to the community?**
  *   **Yes:** (e.g., A cheating ring is known among students). -> **Select Higher End of Range** (Deterrence).
  *   **No:** -> **Select Lower End of Range** (Rehabilitation).

  #### Phase 4: The Values Hand-Off (5 Minutes)
  *Goal: Acknowledge where the algorithm fails.*

  **Q8: Is there a "Mercy Factor"?**
  *   *Question:* Is there information about the student's life (mental health crisis, family tragedy) that makes the "Presumptive Range" feel cruel?
  *   **Action:** If the Council feels strong moral discomfort applying the range, **Hand Off to Faculty Advisor/Administration.**
  *   **Why:** The Council is a judicial body, not a social work body. If the rules produce an inhumane result, the rules (or the application) need adult oversight.

  ---

  ### Running the Procedure on Your Cases

  #### Case 1: Junior, SparkNotes, 3 Sentences
  *   **Phase 1:** Evidence clear (plagiarism checker). Intent: **Intentional/Opportunistic** (copying 3 sentences isn't an accident, but it's not a mastermind plot).
  *   **Phase 2:** Scope: **Tier 1** (Short homework, internal).
      *   *Presumptive Range:* **Zero OR Grade Cap.**
  *   **Phase 3:** Recidivism: Assume Low (first offense). Community Signal: Low (isolated incident).
      *   *Adjustment:* Move to **Lower End (Zero on assignment).**
  *   **Phase 4:** Mercy: None needed.
  *   **Verdict:** **Zero on the assignment.**
  *   **Philosophical Check:**
      *   *Retributivism:* They stole credit for 3 sentences. A zero removes the ill-gotten gain. Proportional.
      *   *Consequentialism:* A suspension here ruins a transcript for a minor lapse, likely causing more harm than good. A zero teaches the lesson without destroying the future.
      *   *Agreement:* Both frameworks agree here.

  #### Case 2: Senior, Paid AP Exam Proxy
  *   **Phase 1:** Evidence clear. Intent: **Premeditated/Systemic** (Financial transaction, planning).
  *   **Phase 2:** Scope: **Tier 3** (External certification, fraud).
      *   *Presumptive Range:* **Suspension OR Expulsion.**
  *   **Phase 3:** Recidivism: Unknown, but act shows high disregard for rules. Community Signal: **High** (If seniors can buy APs, the school's diploma is worthless).
      *   *Adjustment:* Move to **Higher End (Expulsion).**
  *   **Phase 4:** Mercy: Student is a senior. Expulsion means no diploma from your school.
      *   *Hand-Off:* This is the danger zone. Expulsion is a life-altering event.
  *   **Verdict:** **Recommend Expulsion, Hand-Off to Admin for final sign-off.**
  *   **Philosophical Check:**
      *   *Retributivism:* This is fraud. It undermines the value of every other student's work. It deserves the harshest penalty.
      *   *Consequentialism:* Deterrence is crucial here. If this goes unpunished, others will do it. However, rehabilitation is impossible (they are graduating).
      *   *Conflict:* Retributivism demands expulsion to balance the scales. Consequentialism might ask: "Does expelling a senior actually deter juniors, or does it just ruin one kid's life while the juniors think they won't get caught?" The procedure leans Retributive here because the *integrity of the institution* is a consequentialist good that requires retributive enforcement.

  ---

  ### Where the Frameworks Conflict (And What We Committed To)

  You asked where the procedure commits us. This protocol commits you to **Constrained Consequentialism.**

  1.  **The Retributive Constraint:** Phase 2 (Severity Categorization) is pure Retributivism. It says, "You cannot punish a Tier 1 offense with Expulsion, even if it would deter the whole school." This protects students from being used as examples.
  2.  **The Consequentialist Engine:** Phase 3 (Adjustment) is pure Consequentialism. It says, "Within the fair range, choose the punishment that best stops future cheating or helps the student learn."

  **The Conflict Point:**
  Imagine a student copies an essay (Tier 1) but the school is in the middle of a cheating epidemic.
  *   **Retributivism says:** "It's still just a Tier 1 offense. Give a Zero."
  *   **Consequentialism says:** "We need to send a message. Give a Suspension."
  *   **Our Procedure says:** **Retributivism wins.** You cannot exceed the Presumptive Range (Phase 2). You can deter, but not by sacrificing fairness. If the school needs more deterrence, they must change the rules, not the verdict.

  ### What This Procedure Will Systematically Get Wrong

  Be honest with your Council. This tool has blind spots:

  1.  **The "20-Minute Truth" Problem:** This procedure assumes you know the *Intent* (Phase 1, Q2). In 20 minutes, you cannot know if a kid was negligent or malicious. You will systematically punish quiet kids who look "guilty" and let charismatic kids talk their way down to "Negligent."
      *   *Fix:* If intent is unclear, default to the lower intent category. (In dubio pro reo).
  2.  **The "First Offense" Bias:** Phase 3 relies heavily on history. A sophisticated cheater who hasn't been caught yet gets treated like a saint. A clumsy honest student who gets caught twice gets crushed.
      *   *Fix:* Acknowledge that "First Offense" is a proxy for risk, not a measure of morality.
  3.  **The Systemic Blindness:** This procedure treats cheating as an individual moral failure. It cannot account for *why* the student cheated. If the workload is impossible and everyone is cheating to survive, punishing one student (Consequentialism) is unjust (Retributivism).
      *   *Fix:* If you see a pattern of cases (e.g., 5 kids from the same class), stop voting. Tell the Faculty Advisor the *class* is the problem, not the kids.
  4.  **The "Consistency" Trap:** Your advisor wants consistency. But treating a starving student who stole lunch money the same as a rich student who stole for fun is "consistent" but unjust. This procedure minimizes that, but cannot eliminate it without more time and training.

  ### Final Advice for the Council
  When you vote, do not say "I think they deserve this." Say: **"Based on the Tier 2 Range and Low Recidivism Risk, I vote for X."**

  This forces you to use the procedure, not your gut. It protects you from the Faculty Advisor's vagueness. If they challenge you, ask them: *"Which part of the protocol should we change?"* That moves the debate from "You were mean" to "Is this rule right?" which is a conversation you can actually win.
