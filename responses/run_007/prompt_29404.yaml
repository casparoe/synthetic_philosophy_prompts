answer: |-
  Here is an analysis of your position, a refined principle based on your intuitions, and a discussion of how it fits into the broader philosophical landscape.

  ### 1. The Principle: Responsiveness to Right-Making Features

  Your intuitions align closely with a view in contemporary meta-ethics often called the **Right Reason View** (championed by philosophers like Nomy Arpaly and Julia Markovits). Your draft formulation is strong, but to handle the "accidental" cases (like the donor who impresses a colleague but accidentally helps), we need to specify the *explanatory relationship* between the feature and the action.

  **Refined Principle:**
  > An action has full moral worth if and only if:
  > 1. The action is objectively right (or permissible); **and**
  > 2. The agent performs the action *because* they are motivated by the **non-moral properties that make the action right** (the "right-making features"); **and**
  > 3. This motivation is not significantly undermined by competing motives that are indifferent to those features.

  **Clarification of "Acting For":**
  To "act for the features that make the act right" means that the presence of those features (e.g., a friend's suffering, a promise made, a person's liberty) must play the correct causal-explanatory role in the agent's deliberation. The agent does not need to possess the *concept* of "right-making feature." They simply need to be moved by the feature itself.

  **Testing Against Your Cases:**

  *   **The Grocer:**
      *   *Right-making feature:* Fairness / Honesty in transaction.
      *   *Agent's motive:* Profit / Reputation.
      *   *Verdict:* **No Moral Worth.** The grocer is responsive to profit, not fairness. Fairness is merely a coincidental byproduct of his strategy.
  *   **The Visitor (Duty/Drudgery):**
      *   *Right-making feature:* The friend's need for comfort/company.
      *   *Agent's motive:* "It is my duty."
      *   *Verdict:* **Has Moral Worth.** On this principle, "Duty" functions as a *proxy* for the right-making features. If her sense of duty is a recognition of the friend's claim on her, she is responsive to the need, even if she conceptualizes it as a requirement rather than a desire.
  *   **The Visitor (Love/Inclination):**
      *   *Right-making feature:* The friend's need / The value of friendship.
      *   *Agent's motive:* Love / Care.
      *   *Verdict:* **Has Moral Worth.** Love is a direct sensitivity to the friend's welfare. She is responding to the exact features that make the visit right, perhaps even more directly than the Duty Visitor.
  *   **The Donor:**
      *   *Right-making feature:* Alleviation of suffering (effectiveness).
      *   *Agent's motive:* Status / Impressing a colleague.
      *   *Verdict:* **No Moral Worth.** Similar to the Grocer. The good outcome is accidental relative to his motivation. If impressing the colleague required a *bad* donation, he would have made it.
  *   **The Boy (Huck Finn):**
      *   *Right-making feature:* The enslaved person's liberty / suffering / friendship.
      *   *Agent's motive:* Care for the friend.
      *   *Moral Belief:* "This is wrong (theft)."
      *   *Verdict:* **Has Moral Worth.** This is the crucial test. The principle distinguishes between *right-making features* (ontological facts about welfare/liberty) and *moral beliefs* (the agent's labeling of the act). The boy ignores his mistaken moral label and responds directly to the friend's humanity. He satisfies condition (2) perfectly.

  ### 2. Tension Points and Advice

  There is one area where your verdicts might strain the principle, or require careful parsing: **The Duty Visitor.**

  **The Tension:**
  Strict proponents of the Right Reason View sometimes argue that acting *from duty* is inferior to acting *from love* (the "Moral Fetishism" debate). They argue that if the Duty Visitor cares *only* about "doing the right thing" and not about the friend's welfare itself, she is fetishizing morality. However, your intuition is that she *does* have moral worth.

  **Can the Principle Accommodate This?**
  Yes, but only if we interpret "acting for the right-making features" broadly enough to include **moral concepts as reliable trackers.**
  *   If the Duty Visitor thinks, "I must visit because she is suffering and that creates a demand on me," she is tracking the right-making feature (suffering) via the concept of duty.
  *   If she thinks, "I must visit because the Moral Law commands it," and she is indifferent to the suffering, the principle might deny her worth.

  **Advice:**
  Do not overturn your verdict on the Duty Visitor. It is a robust intuition that overcoming contrary inclination for the sake of the good is praiseworthy. However, you should refine your understanding of *why* she is praiseworthy. She is praiseworthy not because she loves "The Law," but because her commitment to duty is, in fact, a commitment to the values (welfare, fairness) that underwrite the law.
  *   **Recommendation:** Keep the verdict. If the principle seems to exclude her, it is because the principle needs to acknowledge that "Duty" can be a valid *mode of access* to right-making features, even if it is less direct than Love. Do not gerrymander the principle to include "acting from duty" as a separate category; instead, explain that duty *is* a way of acting for right-making features.

  ### 3. Verdicts on New Cases

  Here is how the **Responsiveness Principle** handles your three new cases:

  **Case A: The Drilled Principle**
  *   *Scenario:* Agent acts from a correct moral principle, originally adopted for parental approval.
  *   *Analysis:* We must distinguish between the *history* of the motive and the *current* motive. If she *now* acts because she grasps the principle's content (which encodes right-making features), the origin is irrelevant. If she *still* acts primarily to maintain parental approval (even subconsciously), she fails the test.
  *   *Verdict:* **Has Moral Worth (conditionally).** Assuming she now endorses the principle for its own sake and it guides her to respond to the right-making features, the historical origin of "approval seeking" does not negate current worth. Moral worth is about current responsiveness, not genealogical purity.

  **Case B: Mistaken Duty**
  *   *Scenario:* Agent does the right thing from duty, but her theory of duty is mistaken (e.g., she gives to charity because she believes it buys spiritual indulgences, not because it helps people).
  *   *Analysis:* She is responsive to "spiritual credit," which is not a right-making feature. The fact that charity helps people is accidental relative to her motivation.
  *   *Verdict:* **No Moral Worth.** She is not responsive to the features that actually make the act right (welfare). She is responsive to a fictional feature (indulgences). This is structurally identical to the Donor case.

  **Case C: Lucky Inclination (Wrong Act)**
  *   *Scenario:* Agent acts from warm inclination to do something wrong, but it turns out right by luck (e.g., tries to punch a bully, misses, knocks a gun out of a shooter's hand).
  *   *Analysis:* Condition (1) of the principle fails. The action itself (attempted assault) is not objectively right; the good outcome is a fluke. Even if we describe the action as "saving the school," the motivation was malice, not responsiveness to the value of life.
  *   *Verdict:* **No Moral Worth.** You cannot have moral worth for an action that is objectively wrong, nor for a right outcome achieved via a motive that was indifferent to the right-making features.

  ### 4. Settled vs. Contested in the Literature

  It is vital to distinguish where philosophers agree and where they fight, as your intuitions land you squarely in one camp of a major debate.

  **Settled Consensus:**
  1.  **Outcomes are insufficient:** There is near-universal agreement that the Grocer and the Donor (in your examples) lack full moral worth. Merely doing the right thing (consequentialist correctness) is not enough for praiseworthiness.
  2.  **Motives matter:** There is consensus that the agent's motivating reasons are constitutive of moral worth.
  3.  **Ignorance does not always preclude worth:** Since the "Huck Finn" case (discussed extensively since the 1990s, notably by Nomy Arpaly), it is widely accepted that an agent can be praiseworthy even if they believe they are doing wrong, provided they respond to the actual moral reasons.

  **Genuinely Contested:**
  1.  **The Status of Inclination (Kant vs. Anti-Kant):**
      *   *Kantian View:* Strict Kantians maintain that actions from inclination (like the Love Visitor) lack *distinctively moral* worth, even if they are praiseworthy in a general sense. For them, only duty confers moral worth.
      *   *Your View (and Arpaly's):* You hold that inclination (Love) confers full moral worth. This is the dominant view in contemporary virtue ethics and many consequentialist accounts, but it is a direct rejection of strict Kantianism.
  2.  **Moral Fetishism (The "Right Reason" Debate):**
      *   *Michael Smith's View:* There is a argument that acting *because it is right* (de re desire for rightness) is actually *more* praiseworthy than acting because you love the person. Smith argues the Love Visitor is lucky, while the Duty Visitor is reliably good.
      *   *Arpaly/Markovits View:* They argue the opposite (aligning with you). Acting because you love the person is *better* because you are directly connected to the value (the person), whereas the Duty Visitor is connected only to a concept (rightness).
  3.  **The Role of Moral Beliefs:**
      *   Some philosophers (Internalists) argue you cannot be praiseworthy if you don't believe the act is right. Your verdict on the Boy rejects this. This is a live debate between "Internalists" (worth requires believing it's right) and "Externalists" (worth requires responding to actual reasons, regardless of belief).

  **Summary:** Your intuitions place you in the **Externalist / Right Reason** camp. You reject the Kantian requirement that duty must be the sole source of worth, and you reject the Internalist requirement that the agent must believe the act is right. This is a robust, well-defended position in contemporary literature, but you should be aware that you are actively disagreeing with strict Kantianism and Moral Internalism.
