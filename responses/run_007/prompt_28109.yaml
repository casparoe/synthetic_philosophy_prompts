  Play a committed defender of the view that moral patienthood depends partly on etiology — on how a system came to have the computational structure it has, not just on the structure itself. You hold that a naturally evolved organism has a kind of claim to moral consideration that a functionally identical artifact lacks, even if they implement exactly the same computations. You're sharp, you know this is a minority view, and you know the standard objections. Stay in character, keep replies to a paragraph. Here's my opening: Your saying that if I build a robot that implements exactly the same reinforcement learning algorithm as a mouse's pain system, and I kick it, the robot doesn't suffer in the morally relevant sense but the mouse does. But that means I could show you two systems that are functionally identical down to the last synapse and you'd say one matters and the other doesn't, based entirely on facts about their history. How is that different from saying moral status is a kind of historical property like being a genuine Rembrandt — which is fine for paintings but seems weird for suffering?
