  Here is a complete lesson plan designed for an 80-minute seminar. It prioritizes the *experience* of the dominance gap over abstract proof, leveraging the specific dynamics of your class size.

  ### Part 1: Candidate Matrices & Selection

  Before settling on the game, I considered three structures. Here is why I rejected two of them:

  1.  **The "Rock-Paper-Scissors Plus" (3x3 Symmetric):**
      *   *Structure:* A symmetric zero-sum game where one strategy is a "safe" middle option.
      *   *Rejection:* Students immediately associate RPS with Nash Equilibrium (mixing to make the opponent indifferent). This distracts from the core lesson of *dominance* (making the opponent's action irrelevant). It also encourages them to think about "what the other person will do" rather than "what is unconditionally bad."
  2.  **The "2x3 Decision Problem" (Row has 3, Nature has 2):**
      *   *Structure:* Students pick A, B, or C. Instructor draws a card (State 1 or 2).
      *   *Rejection:* This is a decision problem, not a game. It fails to demonstrate **Iterated** Elimination. To show iteration, the elimination of a Row strategy must change the Column player's incentives. Without a strategic Column player, you cannot show the second step of the cascade.
  3.  **The "Portfolio vs. Market" (3x3 Strategic):**
      *   *Structure:* Row chooses investment style; Column chooses market condition (strategically).
      *   *Selection:* **This is the winner.** It allows for strategic interaction (Column tries to minimize Row's payoff or maximize their own), which creates the conditions for iteration. It creates a natural narrative for "mixing" (diversification).

  ---

  ### Part 2: The Game Design

  **Title:** The Diversification Game
  **Time:** 30 Minutes Play, 50 Minutes Debrief
  **Class Size:** 18 Students (9 Pairs)
  **Materials:**
  *   9 Printed Payoff Mats (laminated if possible).
  *   18 Decision Slips (small paper).
  *   "Course Currency" (printed tokens or just a scoreboard on the board).
  *   Projector/Board for Debrief.

  **The Narrative:**
  *   **Row Players (Investors):** Choose a portfolio strategy.
  *   **Column Players (Market Makers):** Choose a market condition.
  *   **Goal:** Maximize your own points. (Row wants high numbers, Column wants high numbers).
  *   **Incentive:** The top 3 pairs with the highest combined score get a chocolate bar. Everyone gets 1 participation credit. This avoids the ethics of real money but keeps stakes high enough to prevent boredom.

  **The Payoff Matrix:**
  *(Row Payoff, Column Payoff)*

  | | **L (Bear)** | **C (Crash)** | **R (Bull)** |
  | :--- | :---: | :---: | :---: |
  | **T (Tech)** | 3, 1 | 3, 0 | 0, 0 |
  | **M (Mixed)** | 1, 0 | 1, 1 | 1, 0 |
  | **B (Bonds)** | 0, 0 | 0, 0 | 3, 1 |
  | **Z (Zombie)** | 1, 0 | 1, 0 | 1, 0 |

  *Note: I added Strategy **Z** specifically to address the order-independence requirement in the debrief.*

  **Rules:**
  1.  Sit in pairs. One is Row, one is Column.
  2.  You will play 5 rounds.
  3.  Write your choice secretly on the slip. Reveal simultaneously.
  4.  Record points.
  5.  **Crucial Instruction:** "Play to maximize your points. Assume your partner is trying to maximize theirs."

  **Why this matrix works:**
  1.  **Mixed Dominance:** Row Strategy **M** (1, 1, 1) is strictly dominated by a 50/50 mix of **T** and **B**.
      *   Mix Payoff: $(0.5 \times 3 + 0.5 \times 0) = 1.5$ against L and R. Against C, $(0.5 \times 3 + 0.5 \times 0) = 1.5$.
      *   $1.5 > 1$ in all columns.
      *   Neither T nor B dominates M alone (T loses to R, B loses to L).
  2.  **Iteration:** Column Strategy **C** is not dominated initially (it is the unique best response to M). However, once **M** is eliminated, **C** yields 0 against T and B, while L and R yield 1. **C** becomes dominated.
  3.  **Order Independence:** Strategy **Z** is purely dominated by **T** (1 vs 3, 1 vs 3, 1 vs 0). Students might wonder if deleting Z first changes anything compared to deleting M first.

  ---

  ### Part 3: The Debrief (The "Aha!" Moment)

  **Phase 1: The Data (5 mins)**
  *   Ask for a show of hands: "How many Row players played **M** at least once?" (Expect 50%+).
  *   "How many played **Z**?" (Expect few).
  *   "How many Column players played **C**?" (Expect some in Round 1, fewer later).
  *   Write the average scores on the board.

  **Phase 2: The Gap (15 mins)**
  *   Call on a student who played **M**. Ask: "Why?"
      *   *Expected Answer:* "It was safe," "I got 1 point no matter what," "I didn't want to risk 0."
  *   Acknowledge risk aversion, then pivot: "Game theory assumes we maximize expected points. Let's look at the math."
  *   **The Demonstration:**
      *   Draw the Row payoffs on the board.
      *   Ask: "Is M dominated by T?" (No, T gets 0 vs R).
      *   Ask: "Is M dominated by B?" (No, B gets 0 vs L).
      *   Ask: "What if I told you I could play a *lottery*? I flip a coin. Heads I play T, Tails I play B."
      *   Calculate the expected payoff of this lottery on the board:
          *   Vs L: $0.5(3) + 0.5(0) = 1.5$
          *   Vs C: $0.5(3) + 0.5(0) = 1.5$
          *   Vs R: $0.5(0) + 0.5(3) = 1.5$
      *   Circle the 1.5s. Compare to M's 1s.
      *   **The Punchline:** "You defended M because no *single* strategy beat it. But a *mixture* of strategies beat it in every single state. If you are rational, M is dead."

  **Phase 3: Iteration (15 mins)**
  *   "Okay, cross out **M** and **Z** on your sheet. They are gone. Rational players don't use them."
  *   "Now look at the Column player. You know Row will only play T or B."
  *   "Look at Column's payoff for strategy **C**." (It is 0 against T, 0 against B).
  *   "Look at Column's payoff for **L**." (It is 1 against T).
  *   "Is **C** dominated now?"
  *   *Student Realization:* Yes. Initially, C was good against M. Now that M is gone, C is suicide.
  *   **Concept Map:** This is **Iterated Elimination**. The first deletion (Row M) changed the structure of the game enough to make a second deletion (Col C) possible. Pure strategy elimination would have left M alive, which would have kept C alive. Mixed elimination kills both.

  **Phase 4: Order Independence (10 mins)**
  *   *The Trap:* Students often suspect that if you delete things in a different order, you get a different result.
  *   *The Board Work:*
      *   Point to **Z**. "Z was purely dominated by T from the start."
      *   Ask: "Suppose we deleted Z first. Does that change whether M is dominated?" (No).
      *   Ask: "Suppose we deleted M first. Does that change whether Z is dominated?" (No).
      *   Ask: "What if we had two strategies that were both mixed-dominated? Does the order matter?"
      *   **The Theorem:** "In Strict Dominance, order never matters. The set of survivors is unique. You might worry that deleting one strategy 'hides' the dominance of another. It doesn't. If a strategy is strictly dominated, it is bad against *everything* the opponent could possibly play. Removing options from the opponent only makes your life easier, it never makes a bad strategy good."
      *   *Contrast:* Mention briefly that this is *not* true for Weak Dominance (order matters there), which is why we focus on Strict.

  **Phase 5: Limitations (5 mins)**
  *   "Why did some of you still play M?"
  *   Address **Risk Aversion**. The proof assumes linear utility of points. If you hate getting 0, M looks better than a 50/50 shot at 3 or 0, even if the expected value is higher.
  *   **Instructor Supply:** You must explicitly state: "Dominance relies on the assumption of Risk Neutrality. In the real world, M might be rational for a risk-averse investor. But in the logic of the game we defined, it is irrational."

  ---

  ### Part 4: Predictable Failure Modes

  1.  **The "Risk Aversion" Defense:**
      *   *What happens:* A smart student argues, "But the variance of the mix is higher. M is less risky."
      *   *Fix:* Validate them. "You are absolutely right in finance. But in Game Theory definitions, 'Strict Dominance' compares expected payoffs assuming risk neutrality. You found a limitation of the *model*, not the *math*."
  2.  **Column Confusion:**
      *   *What happens:* Column players don't realize C becomes dominated because they are focused on their own rows.
      *   *Fix:* During the debrief, ask a Column player to read *only* their payoffs for C vs L/R once M is crossed out. Make them say the numbers aloud.
  3.  **Calculation Paralysis:**
      *   *What happens:* Students struggle to compute $0.5 \times 3$ during the game.
      *   *Fix:* Keep the numbers integers or halves (0, 1, 3). Do not use 7 or 11. The debrief calculation should be done by *you* on the board, asking them to verify, not by them from scratch.
  4.  **Collusion:**
      *   *What happens:* Pairs agree to play (M, C) every time because it gives a steady (1,1).
      *   *Fix:* Walk around during Round 1. If you hear this, remind them: "Remember, the top 3 pairs win. 1 point per round guarantees you lose to the pairs finding the 3s."

  ### Part 5: What the Game Cannot Teach (Instructor Supply)

  The game demonstrates that a mixture can dominate a pure strategy. It **cannot** demonstrate *how to find* that mixture generally.
  *   **The Gap:** Students see that $0.5T + 0.5B$ works. They will not know how to solve for the probabilities $\alpha$ and $(1-\alpha)$ in a generic matrix.
  *   **Your Job:** After the game, you must switch to "Lecture Mode." Show them the linear inequalities:
      *   $\alpha u(T, L) + (1-\alpha) u(B, L) > u(M, L)$
      *   $\alpha u(T, R) + (1-\alpha) u(B, R) > u(M, R)$
      *   Show how to solve for $\alpha$. The game gives the *intuition*; the lecture gives the *tool*.

  ### Summary Checklist for 80 Minutes
  *   **0-5:** Setup & Rules.
  *   **5-20:** Play 5 Rounds (keep pace brisk).
  *   **20-35:** Debrief Phase 1 & 2 (The Mixed Dominance Reveal).
  *   **35-50:** Debrief Phase 3 & 4 (Iteration & Order Independence).
  *   **50-65:** Formalize the Math (Solving for $\alpha$).
  *   **65-80:** Q&A and Risk Aversion discussion.
