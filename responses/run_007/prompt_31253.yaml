answer: |-
  Your skepticism is well-founded. A careful scholar of Maimonides would agree with the first half of that paragraph but would likely reject the final sentence as a significant distortion of Maimonides' legal and eschatological position.

  The author of the book you read has accurately summarized Maimonides' *philosophical* explanation for the *origin* of sacrifices (found in *The Guide of the Perplexed*), but they have incorrectly extrapolated that into a claim about the *permanence* and *value* of the laws (contradicting the *Mishneh Torah*).

  Here is a breakdown of what is accurate, what is an overstatement, and where the conclusion fails.

  ### 1. What the Summary Gets Right (The *Guide of the Perplexed*)
  The first half of the paragraph is a standard and accurate summary of **Guide of the Perplexed, Part III, Chapter 32**.

  *   **The Concession Theory:** Maimonides explicitly argues that the sacrificial cult was not God's "primary intention." He writes that if God had suddenly commanded the Israelites to stop sacrificing entirely and only pray, it would have been psychologically impossible for them, as sacrifice was the universal mode of worship in the ancient Near East.
  *   **Redirected Idolatry:** Maimonides states that God allowed the practice to continue but "redirected" it from idols to His own name. This was a "divine stratagem" to wean the people off idolatry gradually.
  *   **Hierarchy of Worship:** Maimonides does rank prayer and intellectual knowledge of God higher than animal sacrifice. In his view, the ultimate goal of the commandments is the perfection of the intellect and moral character, not the slaughtering of animals.

  On these points, the book author is on solid ground. This is the famous "historical concession" reading of Maimonides.

  ### 2. Where the Summary Fails (The *Mishneh Torah*)
  The last sentence—*"On this account the sacrificial laws have no intrinsic value; they were a temporary accommodation, and in an ideal or messianic future they would be left behind"*—is where the summary breaks down.

  **A. "No Intrinsic Value"**
  While Maimonides argues sacrifice is not the *ultimate* spiritual ideal, he does not claim it has *no* value.
  *   **Legal Obligation:** In his legal code, the *Mishneh Torah*, Maimonides codifies the laws of sacrifices (*Hilkhot Ma'aseh HaKorbanot*) in exhaustive detail. For Maimonides, a commandment given by God possesses value simply by virtue of being a divine command. To obey it is an act of discipline and submission to divine will.
  *   **Instrumental Value:** Even in the *Guide*, he assigns them value as a tool for spiritual discipline and communal order. To say they have "no intrinsic value" conflates "not the ultimate goal" with "worthless."

  **B. "Temporary Accommodation... Left Behind"**
  This is the most significant error. The claim that Maimonides believed sacrifices would be abolished in the Messianic age contradicts his explicit writings on Jewish law and eschatology.
  *   **Hilkhot Melakhim (Laws of Kings):** In the *Mishneh Torah* (11:1–4), Maimonides outlines the tasks of the Messiah. He writes that the Messiah will **"fight the wars of God, succeed, build the Temple in its place, and gather the dispersed of Israel... and he will prepare the whole world to serve God together."**
  *   **Restoration of Sacrifices:** By stating the Messiah will rebuild the Temple, Maimonides implies the restoration of the sacrificial cult. In his legal view, the sacrificial laws are not temporary statutes that expire when idolatry disappears; they are eternal statutes (*hukkim*) that remain binding even if the philosophical reason for their origin (weaning off idolatry) is no longer relevant.

  ### 3. Why the Confusion Exists
  The author of your book is likely relying on a specific interpretive tradition that privileges Maimonides the *Philosopher* over Maimonides the *Halakhist* (legalist).

  *   **Modern Projections:** In the 19th and 20th centuries, many liberal Jewish thinkers (and some Christian scholars) *wished* Maimonides had said sacrifices would be abolished in the Messianic age, as this aligned with modern sensibilities that view prayer as superior to ritual slaughter. Some projected this view back onto Maimonides, citing *Guide* III:32 as proof, while ignoring the *Mishneh Torah*.
  *   **The "Silence" Argument:** Some scholars argue that because Maimonides doesn't explicitly mention sacrifices in his description of the Messianic era in the *Guide*, he might have privately believed they would cease. However, this is an argument from silence. In his legal code, where he is obligated to rule on practical law, he is explicit: the Temple and its service are restored.

  ### 4. Scholarly Consensus
  A careful scholar (such as Isadore Twersky, Menachem Kellner, or David Hartman) would likely offer the following correction to the paragraph you read:

  1.  **Accept:** Maimonides viewed the *origin* of sacrifices as a historical concession to ancient norms.
  2.  **Reject:** Maimonides viewed the *laws* as temporary or destined for abolition.
  3.  **Nuance:** Maimonides distinguishes between the *reason* for a commandment (which may be historical) and the *obligation* of a commandment (which is eternal). Even if the historical reason passes, the divine command remains.

  ### Conclusion
  You should trust the first half of the paragraph but treat the second half with strong suspicion.

  The author has slid from **"not the primary purpose"** to **"no value,"** and from **"concession to ancient conditions"** to **"destined to be abolished."** While Maimonides certainly believed prayer was a *higher* form of worship than sacrifice, he did not believe the sacrificial cult would disappear in the Messianic future. To claim otherwise is to ignore the *Mishneh Torah* in favor of a selective reading of the *Guide*.

  **Verdict:** The summary is **philosophically plausible but legally and textually inaccurate** regarding Maimonides' final position on the permanence of the sacrificial laws. Your recollection that he codified their restoration is correct.
