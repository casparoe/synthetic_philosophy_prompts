prompt: |-
  I'm taking a philosophy of science class and we just did Goodman's grue thing, and I cant shake the feeling that everyone in the room is politely pretending it isn't a proof that induction is just broken. Here's how I understand it. Before some future time t, every observed emerald has been green, and that same evidence seems to support both 'all emeralds are green' and 'all emeralds are grue,' where grue means green before t and blue after t. The two hypotheses make identical predictions up to t, then opposite predictions after, so no amount of pre-t evidence can tell them apart.

  But if that's right, couldn't you cook up a gerrymandered predicate like that for literally any generalization, making any inductive inference look arbitrary? I tried this line on my roommate and he just said green is simpler, which felt like cheating. Doesn't grue show that induction has no rational basis at all, and that preferring green over grue is just a matter of taste or habit? And if it doesn't show that, whats the actual reason green is the right predicate to project and grue is a trick — not just that green feels more natural or simpler?
