      *   *Point 2: Moderate Moralism (Carroll/Gaut):* The handout is slightly off here. Carroll's "Moderate Moralism" argues moral defects *can* be aesthetic defects when they interfere with engagement (e.g., narrative coherence). Gaut's "Ethicism" says moral defects *are* aesthetic defects. The claim that the *only* defense is denying the moral flaw is false. One can argue the flaw doesn't impair the aesthetic experience.
