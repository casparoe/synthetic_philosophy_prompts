prompt: |-
  I teach an upper-level undergrad seminar on weakness of will and time preference — around 18 students, one 75-minute session. Design an in-class game that gets them to feel preference reversal as it happens: at the start of the session they make a plan about a choice they'll face later, and when the later moment arrives a decent number of them should want to go back on the plan, even though nothing about the payoffs changed except how close the sooner reward is. Use real small stakes (candy, quiz points, whatever works). The setup should make the reversal come from the shape of their own discounting, not from new information or social pressure, and the debrief should map what happened to the difference between exponential and hyperbolic discounting and to akrasia as a conflict between an earlier self and a later self. Give me rules, materials, a payoff schedule, a timeline, what will predictably go wrong the first time I run it, and one honest note about which feature of real akrasia the game can't reproduce.
reasoning: |-
  Here's a thinking process that leads to the suggested in-class game:

  1.  **Analyze the Request:**
      *   **Topic:** Weakness of will (akrasia) and time preference (hyperbolic vs. exponential discounting).
      *   **Audience:** Upper-level undergrad seminar (18 students).
      *   **Duration:** One 75-minute session.
      *   **Goal:** Design an in-class game where students experience preference reversal *in real-time*.
      *   **Mechanism:** Plan made at $T_0$, choice made at $T_1$. Payoffs stay constant relative to each other, but the "soon" reward gets closer.
      *   **Stakes:** Real but small (candy, points).
      *   **Constraints:** Reversal must come from internal discounting, not new info or social pressure.
      *   **Deliverables:** Rules, materials, payoff schedule, timeline, predicted failure points, debrief connection to theory, one limitation note.

  2.  **Deconstruct the Phenomenon:**
      *   *Preference Reversal:* At $T_0$, I prefer Larger-Later (LL) over Smaller-Sooner (SS). At $T_1$ (when SS is immediate), I prefer SS over LL.
      *   *Exponential Discounting:* Consistent preferences over time. If I prefer LL at $T_0$, I should prefer LL at $T_1$.
      *   *Hyperbolic Discounting:* Steep discounting for short delays, flatter for long delays. Leads to dynamic inconsistency.
      *   *Classroom Context:* 75 minutes is short. The "Later" reward can't be *too* far later (e.g., next week) or attrition/logistics get messy. It needs to happen *within* the class or immediately after.
      *   *Challenge:* If the "Later" reward is just "at the end of class," the delay is only ~60 minutes. Is that enough to trigger reversal? Yes, if the "Sooner" is *immediate*.
      *   *Stakes:* Candy is good. Quiz points are risky (might cause anxiety). Let's use candy + a tiny bit of extra credit (optional) to make it tangible.

  3.  **Drafting the Game Design:**
      *   *Name:* The "Two-Stage Choice" or "The Candy Delay." Let's call it "The Commitment Contract."
      *   *Phase 1 (Planning):* Start of class. Choose between Option A (Small reward now) and Option B (Large reward later). But wait, if they choose A now, the game ends. We need them to *plan* for a choice later.
      *   *Correction:* To show reversal, they need to commit to a choice *for* a future time, then face the choice *at* that time.
      *   *Better Design:*
          1.  **T0 (Start of Class):** Students make a *binding* plan for a choice they will face at T1 (End of Class).
              *   Choice at T1: 1 piece of candy *now* (at T1) vs. 3 pieces of candy *next class* (or take home).
              *   Wait, if T1 is end of class, "now" is end of class. "Later" is next week.
              *   Let's refine:
              *   **T0 (Min 0):** Choose what you *want* to decide at T1.
                  *   Plan: "At T1, I will choose the Large/Late reward."
              *   **T1 (Min 60):** Actual Choice.
                  *   Option SS: 1 candy piece immediately (eat in class).
                  *   Option LL: 3 candy pieces (given next class/take home).
              *   *Problem:* If they can change their mind at T1 without cost, it's just a choice. To show *akrasia*, we need to highlight the conflict.
              *   *Refined Mechanism:* At T0, they state their intention. At T1, they make the actual choice. We compare the % intending to choose LL vs. % actually choosing LL.
              *   *Incentive:* To make T0 matter, maybe they sign a "contract." If they break it, no penalty, but we record the break.
              *   *Wait, to make it feel like a game:* Let's add a commitment device option at T0.
              *   *Actually, keep it simple for 75 mins.* The core phenomenon is the reversal.
              *   *Setup:*
                  *   **T0:** "You will face a choice at the end of class. Write down what you *predict* you will choose." (Private).
                  *   **T1:** "Make the actual choice."
                  *   **Payoff:**
                      *   SS: 1 fancy chocolate now.
                      *   LL: 3 fancy chocolates next class (or emailed gift card).
                  *   *Wait, 75 mins is too short for "next class" logistics.* Let's make "Later" = "End of Class" and "Sooner" = "Right Now (Min 10)".
                  *   *Revised Timeline:*
                      *   Min 0: Intro.
                      *   Min 5: **Decision 1 (The Plan).** Choose between:
                          *   Plan A: Get 1 candy at Min 15.
                          *   Plan B: Get 3 candies at Min 75 (End of Class).
                          *   *Crucial:* This decision is *not* binding. It is a "Pre-commitment Statement."
                      *   Min 15: **Decision 2 (The Reality).**
                          *   Option SS: 1 candy *right now*.
                          *   Option LL: 3 candies at End of Class.
                          *   *Note:* The payoffs are identical to the Plan, but SS is now *immediate*.
      *   *Wait, if they choose Plan A at Min 5, they get candy at Min 15. If they choose Plan B, they wait till Min 75.*
      *   *At Min 15:* If they planned B, do they get to choose again? Yes. That's where the reversal happens.
      *   *Refinement:* To ensure they feel the tension, the "Plan" should be framed as "What *should* you do?" or "What *will* you do?" Let's go with "What *will* you do?" to measure prediction error.
      *   *Even Better:* Make the T0 choice binding *unless* they actively opt-out at T1. This mimics intention vs. action.
      *   *Let's try the "Envelope" method.*
          *   T0: Choose an envelope. Envelope A (1 candy at Min 15). Envelope B (3 candies at Min 75). Seal it.
          *   T1 (Min 15): Open envelope. If A, you get candy. If B, you are offered a chance to switch to Envelope C (1 candy now).
          *   *Too complicated.*

      *   *Simplest Effective Design:*
          1.  **T0 (Min 5):** Anonymous Survey. "At Min 20, you will be offered a choice. What do you intend to choose?"
              *   Option 1: 1 Candy at Min 20.
              *   Option 2: 3 Candies at End of Class.
          2.  **T0 (Min 5):** Also ask: "What do you think the *class average* will intend?" (Engagement).
          3.  **Lecture/Discussion** (Min 5-20).
          4.  **T1 (Min 20):** Actual Choice. Hand out slips.
              *   Option 1: 1 Candy (distributed immediately).
              *   Option 2: 3 Candies (distributed at End of Class).
              *   *Crucial:* Students who intended Option 2 at T0 but choose Option 1 at T1 raise hands (or mark slip).
          5.  **Debrief** (Min 25-75).

      *   *Stakes:* Need to ensure "End of Class" feels like a delay. 55 minutes is a decent delay for an undergrad wanting sugar.
      *   *Stakes Enhancement:* Add "Participation Points." 1 point for SS, 3 points for LL. (Check syllabus policy). Let's stick to Candy + "Bonus Points" (e.g., 0.5% vs 1.5% on final). Small enough to not be unethical, large enough to matter. Let's suggest Candy + Tiny Points.

  4.  **Addressing the Constraints:**
      *   *Internal Discounting:* Ensure no new info is given between T0 and T1.
      *   *Social Pressure:* Make choices private (slips in a box).
      *   *Predictable Failures:* Students might not take it seriously. Students might forget the T0 choice. Logistics of candy distribution.
      *   *Limitation:* Real akrasia often involves emotional states (stress, fatigue) or addiction. A classroom game is low-stakes and low-emotion.

  5.  **Fleshing out the Details:**
      *   *Materials:* Slips of paper, two boxes (Intention vs. Action), Candy (distinct types?), Timer.
      *   *Payoff Schedule:*
          *   SS: 1 Hershey's Kiss + 1 Participation Point.
          *   LL: 3 Hershey's Kisses + 3 Participation Points.
          *   Timing: SS available at Min 20. LL available at Min 75.
      *   *Timeline:*
          *   0-5: Setup & Intention.
          *   5-20: Lecture (distractor task, lets hunger/impulse build slightly).
          *   20-25: Action Choice.
          *   25-75: Debrief & Theory.
      *   *Predicted Failure:* Students thinking it's a trick. Students choosing LL at T0 just to look "rational."
      *   *Mitigation:* Emphasize anonymity. Emphasize that there is no "right" answer, only money/candy on the table.

  6.  **Refining the "Reversal" Mechanism:**
      *   To *prove* reversal, I need to link T0 and T1 data for each student.
      *   *Method:* Use a code number. Write same ID on Intention Slip and Action Slip.
      *   *Instruction:* "This ID allows us to match your plan to your action for research purposes. It is anonymous to me until after grades are submitted." (Or just match them live to show the rate).
      *   *Better:* Match them live to show the class the reversal rate. It makes the point stronger. "Look, 12 of you planned LL, but 8 took SS."

  7.  **Drafting the Content:**
      *   *Title:* "The 20-Minute Discount."
      *   *Materials:* Index cards, pens, box, candy.
      *   *Payoffs:* Clear and explicit.
      *   *Timeline:* Precise minutes.
      *   *Debrief:* Connect to Strotz (1955), Ainslie, exponential vs. hyperbolic curves.
      *   *Limitation:* Lack of visceral craving/consequence.

  8.  **Review against "Honest Note":**
      *   What can't it reproduce? The *distress* of akrasia. In the game, choosing the candy is fun. In real life (dieting, smoking, procrastination), choosing the SS option often comes with guilt/shame. The game makes SS rewarding without the negative emotional hangover.

  9.  **Final Polish:**
      *   Make sure the instructions are script-ready.
      *   Ensure the "nothing changed" constraint is highlighted.
      *   Check timing (20 min wait is enough? Yes, for candy in a seminar).

  10. **Self-Correction on "Binding":**
      *   If the T0 choice isn't binding, it's just a prediction.
      *   If it *is* binding, they can't reverse.
      *   *Solution:* T0 is a "Statement of Intent." T1 is the "Real Choice." The friction is the psychological cost of breaking the intent.
      *   *Wait, one nuance:* To make it a true preference reversal test, the options must be identical except for the delay relative to *now*.
      *   At T0 (Min 0): SS = 15 mins away. LL = 75 mins away.
      *   At T1 (Min 15): SS = 0 mins away. LL = 60 mins away.
      *   The *difference* in delay is constant (60 mins). Only the absolute delay to SS changes. This is the classic test.

  11. **Finalizing the Plan:** (Proceed to generate output based on this structure).
      *   *Name:* The "Intention-Action Gap" Experiment.
      *   *Stakes:* Candy + Course Credit (small).
      *   *Anonymity:* Crucial for honesty.
      *   *Debrief:* Visualize the discount curves.

  12. **One last check on "Predictably Go Wrong":**
      *   Students might collude.
      *   Students might not understand the timing.
      *   Students might feel cheated if they don't get candy immediately (have enough stock).
      *   *Add:* Have a "Show of Hands" for T0 intentions to save paper, but use slips for T1 to keep it private? No, need matching. Use ID codes.

  13. **Wait, one constraint:** "Decent number of them should want to go back on the plan."
      *   If the stakes are too low, everyone takes SS.
      *   If stakes are too high, everyone takes LL.
      *   Need sweet spot. 1 vs 3 candies is usually good. 1 vs 3 points might be too abstract. Let's suggest Candy primarily, Points as backup.

  14. **Finalizing the Limitation:**
      *   The game lacks *consequence*. Real akrasia hurts. This game rewards the weakness.

  15. **Constructing the Output.** (Drafting the response).
answer: |-
  # Game Design: The "Intention-Action Gap" Experiment

  This game is designed to induce **dynamic inconsistency** within a single 75-minute session. It isolates the change in time perspective as the only variable, forcing students to confront the conflict between their "planner self" (T0) and "doer self" (T1).

  ### 1. Materials
  *   **Index Cards:** 40 (2 colors, e.g., Blue for T0, White for T1).
  *   **Pens:** 20.
  *   **Reward:** High-quality chocolate (e.g., Ferrero Rocher or Hershey's Kisses). You need ~60 pieces.
  *   **Two Collection Boxes:** One labeled "INTENTIONS," one labeled "ACTIONS."
  *   **Projector/Board:** To display the payoff schedule.
  *   **Timer:** Visible to the class.

  ### 2. Payoff Schedule
  Display this clearly on the board at the start of class. Do not change it.

  | Option | Reward | Delivery Time |
  | :--- | :--- | :--- |
  | **Smaller-Sooner (SS)** | 1 Chocolate + 1 Participation Point | **20 minutes** from start of class |
  | **Larger-Later (LL)** | 3 Chocolates + 3 Participation Points | **End of class** (75 minutes from start) |

  *Note: The delay **between** the two options is always 55 minutes. Only the delay from *now* to the SS option changes.*

  ### 3. Timeline & Rules

  **Phase 1: The Plan (Minutes 0–5)**
  1.  **Hand out Blue Cards.** Ask students to write a **3-digit ID code** (e.g., last 3 digits of phone number) in the top right corner. Tell them this is to match their plan to their action anonymously.
  2.  **Read Script:** "In 20 minutes, you will have the opportunity to claim the Smaller-Sooner reward. If you wait until the end of class, you can claim the Larger-Later reward. On this blue card, write your ID code and circle which option you **intend** to choose when the time comes. This is not binding. It is a record of your current preference. Put it in the 'INTENTIONS' box."
  3.  **Collect Cards.** Do not look at them yet.

  **Phase 2: The Distractor (Minutes 5–20)**
  1.  Teach your seminar normally. Discuss readings, theory, or case studies.
  2.  **Crucial:** Do not mention the game again. Do not give hints. Do not let students eat snacks during this time (ask them to hold hunger).
  3.  The goal is to let the "immediacy" of the SS reward loom closer without changing the objective payoffs.

  **Phase 3: The Choice (Minutes 20–25)**
  1.  **Stop Lecture.** Announce: "The 20-minute mark has arrived. You now face the actual choice."
  2.  **Hand out White Cards.** Students write the **same ID code**.
  3.  **Read Script:** "You may choose one of the following:
      *   **Option A:** Take 1 chocolate and 1 point **now**. (I will walk around with the bag).
      *   **Option B:** Wait until the end of class for 3 chocolates and 3 points.
      *   Circle your choice. Put the card in the 'ACTIONS' box."
  4.  **Distribution:** Walk around with the bag of chocolates. If they circle A, they take a chocolate immediately. If they circle B, they get nothing now.
  5.  **Collect Cards.**

  **Phase 4: The Reveal & Debrief (Minutes 25–75)**
  1.  **Match the Data:** While students watch, quickly sort the Blue and White cards by ID code.
  2.  **Tally on Board:** Create a 2x2 matrix:
      *   Planned LL / Chose LL (Consistent Patience)
      *   Planned LL / Chose SS (Preference Reversal / Akrasia)
      *   Planned SS / Chose SS (Consistent Impatience)
      *   Planned SS / Chose LL (Unexpected Patience)
  3.  **Lead the Discussion:** Focus heavily on the **Planned LL / Chose SS** quadrant.

  ### 4. The Debrief: Mapping to Theory
  Use the board to draw the discount curves based on their data.

  1.  **Exponential Discounting:** Draw a smooth decay curve. Explain that if students were exponential discounters, the *ratio* of value between SS and LL would remain constant as time passed. If LL was better at T0, it should remain better at T1.
      *   *Point out:* The students in the "Reversal" quadrant violated this. Their discount rate was not constant.
  2.  **Hyperbolic Discounting:** Draw a curve that drops steeply for short delays and flattens for long delays.
      *   *Explain:* At T0, both options were in the "flat" future zone (20 mins vs 75 mins felt similarly distant). At T1, SS moved into the "steep" immediate zone (0 mins), causing its subjective value to spike disproportionately.
  3.  **Akrasia as Self-Conflict:**
      *   Frame the T0 self as the "Planner" (cold state, rational, long-term).
      *   Frame the T1 self as the "Doer" (hot state, visceral, short-term).
      *   Discuss: Did anyone feel guilt when switching? (Usually, yes). This is the cost of dynamic inconsistency.

  ### 5. What Will Predictably Go Wrong (First Run)
  *   **The "Rational Signaling" Bias:** At T0, students may choose LL not because they prefer it, but because they want to appear disciplined to you.
      *   *Fix:* Emphasize heavily at T0 that there is no grade penalty for impatience and that the data is anonymous. "I care about the truth of your preference, not your virtue."
  *   **Logistical Friction:** Walking around with candy at Minute 20 takes time and breaks the "moment."
      *   *Fix:* Have a TA help, or place baskets at the ends of rows. Make the SS reward *very* easy to grab.
  *   **Skepticism:** Students may think you won't actually deliver the LL reward at the end of class.
      *   *Fix:* Bring the LL chocolates into the room at T0 and leave them visibly on your desk. Prove the goods exist.
  *   **Attrition:** A student might leave class early.
      *   *Fix:* Announce at T0: "If you choose LL and leave early, you forfeit the reward." This adds a realistic transaction cost to patience.

  ### 6. One Honest Limitation
  **The game cannot reproduce the *negative emotional consequence* of real-world akrasia.**

  In this game, choosing the Smaller-Sooner reward is still a "win" (they get candy and points). In real life (dieting, addiction, procrastination), choosing the SS option often results in net harm (health decline, failing grades, debt) and is accompanied by shame or regret *after* the fact.

  In the classroom game, the "weakness of will" is rewarded with immediate gratification and no lasting penalty. You must explicitly tell them: *"In this game, giving in feels good. In real life, giving in often hurts later. That pain is what makes akrasia a moral or practical problem, rather than just a mathematical inconsistency."*
