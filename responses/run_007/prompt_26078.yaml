answer: |-
  # Joint Statement on the Normative Status of Expected Value Maximization
  **A Product of Adversarial Collaboration**

  **Signatories:**  
  *The Unbounded Coherence Proponent (The Fanatic)*  
  *The Structural Robustness Proponent (The Skeptic)*

  **Date:** October 26, 2023  
  **Context:** This document summarizes the results of a structured adversarial collaboration regarding the limits of Expected Value (EV) theory in decision-making under uncertainty (both empirical and normative). Our goal was not to compromise, but to precisely map the terrain of agreement, disagreement, and the empirical or theoretical evidence required to resolve the dispute.

  ---

  ## 1. Areas of Agreement

  We agree on the following foundational claims. These points establish the baseline from which our disagreement proceeds.

  1.  **The Baseline Status of EV:** Expected Value theory is the default normative framework for decision-making under uncertainty. Neither of us advocates for abandoning EV reasoning entirely in favor of heuristics, rules of thumb, or intuition alone. The burden of proof lies on those proposing modifications to the standard framework.
  2.  **The Counterintuitiveness of Fanatical Implications:** We agree that the implications of strict EV maximization in "tail risk" scenarios (e.g., Pascal's Mugging, the St. Petersburg Paradox, or longtermist swamping) are deeply counterintuitive. Specifically, we agree that a theory recommending the sacrifice of certain, significant finite value for an astronomically small probability of astronomical value *feels* wrong to competent moral agents.
  3.  **Rejection of Naive Skepticism:** We jointly reject "naive skepticism"—the practice of dismissing low-probability, high-impact scenarios solely based on a gut feeling that the probability is "too small to matter" without a principled theoretical justification. Arbitrary rounding of probabilities to zero is epistemically vicious.
  4.  **Rejection of Ad Hoc Boundedness:** We agree that simply stipulating a bounded utility function *solely* to avoid fanatical conclusions, without independent justification for the bound, is theoretically unsatisfying. The bound must arise from a deeper account of value or rationality.
  5.  **Epistemic Humility is Relevant:** We agree that in real-world cases, agents face severe epistemic limitations regarding the estimation of extremely small probabilities and extremely large values. We agree that a decision theory must account for the reliability of the inputs (probabilities and utilities), not just the mathematical operation performed on them.
  6.  **Dominance Principles:** We agree that any viable decision theory should respect some form of the Dominance Principle (if Act A is better than Act B in every possible state, A should be preferred). Our disagreement concerns whether fanatical recommendations violate dominance or whether our intuitions about dominance are mistaken in infinite/unbounded contexts.

  ---

  ## 2. Table of Disagreements

  The following table isolates the substantive disagreements. We have attempted to phrase each claim such that the proponent of that view accepts it as a accurate description of their position, while the opponent understands it as the point of contention.

  | Domain | The Unbounded Coherence View (Fanatic) | The Structural Robustness View (Skeptic) |
  | :--- | :--- | :--- |
  | **Axiomatic Foundation** | **Claim:** Rational preference orderings must satisfy the VNM axioms (including Continuity and Independence) even over unbounded outcome spaces. To reject unbounded utility is to violate coherence constraints that protect agents from sure-loss scenarios (Dutch Books). | **Claim:** Rational preference orderings are permitted (or required) to violate Continuity or Independence when outcomes approach infinite or astronomical magnitudes. Coherence is less important than action-guidance and robustness against model error. |
  | **Probability Weighting** | **Claim:** Probabilities must be weighted linearly. A $1/10^{100}$ chance of value $V$ contributes exactly $V/10^{100}$ to the expectation. Non-linear weighting is mathematically arbitrary and leads to dynamic inconsistency. | **Claim:** Linear weighting is an idealization that fails in the extreme tails. It is rational to apply a discount function to probabilities below a certain epistemic threshold, or to treat probabilities below a certain magnitude as effectively zero due to noise. |
  | **The Role of Intuition** | **Claim:** When formal derivation conflicts with pre-theoretic intuition (e.g., "don't give the mugger your wallet"), the intuition should be discarded. The history of science shows that reality often violates common sense. | **Claim:** Pre-theoretic intuition serves as a check on model specification. If a model consistently outputs recommendations that violate deep reflective equilibria, the model (not the intuition) is likely misspecified. |
  | **Definition of "Rational"** | **Claim:** "Rational" means **Internally Consistent.** An agent is rational if their beliefs and preferences cannot be exploited to guarantee a worse outcome for themselves across all possible worlds. | **Claim:** "Rational" means **Ecologically Robust.** An agent is rational if their decision procedure yields good outcomes in the actual world, accounting for computational limits and the possibility that their model of the world is wrong. |
  | **Normative Uncertainty** | **Claim:** If there is a non-zero credence in a moral theory that demands unbounded value (e.g., total utilitarianism), that theory swamps all theories with bounded value, regardless of how low the credence is. | **Claim:** Moral credences should not be treated identically to empirical probabilities. We should employ a "reflective equilibrium" approach that prevents any single moral hypothesis from dominating due to structural features rather than persuasive weight. |

  ### Note on Verbal Disputes
  We acknowledge that a portion of our disagreement is terminological regarding the word **"Rational."**
  *   **The Fanatic** uses "Rational" to denote *logical coherence of preferences*.
  *   **The Skeptic** uses "Rational" to denote *prudence and successful agency*.

  **Residual Substantive Disagreement:** Even after setting aside terminology, we disagree on **which property is normatively primary.** The Fanatic believes coherence is the primary virtue of a decision theory; the Skeptic believes robustness/success is the primary virtue. If a theory must sacrifice one for the other, the Fanatic sacrifices robustness; the Skeptic sacrifices coherence.

  ---

  ## 3. Cruxes

  These are the specific sub-questions where resolution would significantly shift our credences.

  **Crux 1: The Money Pump Vulnerability**
  *   **Question:** Can a bounded utility agent be "money pumped" (forced into a cycle of trades that leaves them strictly worse off) in a way that is practically exploitable, or can the bounded agent block the pump via reasonable transaction cost assumptions or lexical priorities?
  *   **Why it matters:** If boundedness necessarily leads to exploitable incoherence, the Skeptic's position is formally weakened. If boundedness can be made dynamic-consistent, the Fanatic's primary objection loses force.

  **Crux 2: The Growth Rate of Error vs. Value**
  *   **Question:** As the magnitude of a potential outcome increases, does the epistemic error in estimating its probability grow faster than the value of the outcome itself?
  *   **Why it matters:** The Fanatic assumes we can meaningfully distinguish between $1/10^{100}$ and $1/10^{101}$ even for astronomical stakes. The Skeptic assumes that for sufficiently large stakes, the noise in probability estimation swamps the signal, rendering the EV calculation undefined.

  **Crux 3: The "Shutdown" Implication**
  *   **Question:** Does accepting Fanaticism necessarily lead to "decision paralysis" or resource exhaustion (spending all resources calculating tail risks), and if so, is this a reductio ad absurdum or a correct requirement of morality?
  *   **Why it matters:** If Fanaticism implies that no agent can ever act because there is always a slightly higher EV tail-risk to investigate, the Fanatic must explain how agents are permitted to act. The Skeptic claims this is a fatal flaw; the Fanatic claims this is just the difficulty of morality.

  ---

  ## 4. Evidence and Predictions

  For each Crux, we specify the kind of argument or case that would bear on the issue, and our respective predictions about what that investigation will show.

  ### Regarding Crux 1 (Money Pump)
  *   **Agreed Test:** A formal construction of a bounded decision agent interacting with a market environment over time.
  *   **Fanatic Prediction:** We predict that any bounded agent will exhibit intransitive preferences in edge cases, allowing a sophisticated trader to extract arbitrary value from them. This proves boundedness is irrational.
  *   **Skeptic Prediction:** We predict that bounded agents can adopt "status quo bias" or "lexical thresholds" that block money pumps without incurring significant costs. The "exploitability" only exists in unrealistic frictionless environments that do not model real agency.

  ### Regarding Crux 2 (Error vs. Value)
  *   **Agreed Test:** An analysis of calibration curves in expert forecasting extended to extreme tails (e.g., geopolitical existential risk estimation) compared to the scaling of proposed values (e.g., number of future lives).
  *   **Fanatic Prediction:** We predict that while calibration is poor now, it is improvable. There is no *in principle* barrier to distinguishing $10^{-9}$ from $10^{-10}$. Therefore, the EV calculation remains defined and dominant.
  *   **Skeptic Prediction:** We predict that epistemic uncertainty scales super-linearly with value magnitude. For any outcome $V$ large enough to swamp current concerns, the confidence interval on $P(V)$ will include 0 or be so wide that the expected value is undefined. Thus, the Fanatic's inputs are illusory.

  ### Regarding Crux 3 (The Shutdown Problem)
  *   **Agreed Test:** A simulation of an EV-maximizing agent with finite computational resources tasked with allocating resources between "direct action" and "probability research."
  *   **Fanatic Prediction:** We predict the agent will allocate significant resources to tail-risk research, and this is *correct*. The fact that it feels like paralysis is a bias toward the status quo. Morality is demanding.
  *   **Skeptic Prediction:** We predict the agent will enter an infinite loop of research, resulting in zero value created. This demonstrates that unbounded EV is not action-guiding for finite beings and must be truncated to function as a normative theory.

  ---

  **Signatories:**

  _________________________  
  *The Unbounded Coherence Proponent*

  _________________________  
  *The Structural Robustness Proponent*
