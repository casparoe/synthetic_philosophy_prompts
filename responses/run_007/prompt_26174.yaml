prompt: |-
  I've been trying to mediate between two factions in our AI safety research group and it's going nowhere. One side says the only thing that matters is alignment — making the AI genuinely want what we want — and that control measures are a distraction because a sufficiently capable misaligned system will eventually circumvent them. The other side says alignment is too hard and maybe impossible to guarantee, so we should be pouring effort into scalable oversight, boxing, interpretability-as-monitoring, and other control measures that don't require the AI to be aligned. They've been arguing past each other for months.

  I want you to draft the document they should have produced if they'd done a proper adversarial collaboration. Specifically:

  - A numbered list of claims both sides can actually sign. Not vague truces — claims that are substantive enough to constrain future work.
  - A disagreements table. For each row: the exact point of disagreement, phrased so each side would say "yes, that's what I think" about their own position, and the other side would say "yes, that's what they think."
  - For each disagreement, identify the crux: the sub-question such that if it were settled one way, at least one side would substantially update. Don't just gesture at cruxes — formulate them precisely enough that you could imagine designing an experiment or argument to address them.
  - Where possible: for each crux, describe a line of evidence or a concrete scenario both sides would agree bears on it, and what each side predicts.

  If the whole framing is confused — if "control vs. alignment" is a false dichotomy, or if the two camps are actually making different assumptions about the deployment context that make their views compatible rather than contradictory — say so and explain what the real disagreement is. I'd rather have that than a forced document that papers over the actual structure of the dispute.

  Also: don't give me a reading list or tell me to go read people's papers. I want your own best attempt at the synthesis, and if you think I've set the task up wrong, push back on that instead of politely playing along.
