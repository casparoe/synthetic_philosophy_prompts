      *   If the user wants to keep Total Utilitarianism (1) and Repugnant Conclusion (2), they usually have to drop Asymmetry (3).
      *   If they want to keep Asymmetry (3), they usually have to drop Total Utilitarianism (1) (moving to Person-Affecting).
      *   *Cheapest Fix:* **Critical Level Utilitarianism.** It keeps the aggregation (summing), but sets a threshold. Lives above the threshold count positively. Lives below (but above misery) count negatively or zero.
