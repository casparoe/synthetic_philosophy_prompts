      *   **(3) vs (1): The Asymmetry vs. Total Util.**
          *   *Tension:* Severe. Classical Total Utilitarianism implies the "Benign Addition" principle which leads to the asymmetry being false. If you add a happy person, total goes up. If total is what matters, you should add them.
          *   *Fix:* Shift to "Critical Level Utilitarianism" (CLU). If the happy lives are below a certain "critical level" (even if positive), adding them isn't required. Or adopt a "Person-Affecting Restriction" (but that breaks (1)). Cheapest fix: CLU allows asymmetry while keeping aggregation.

