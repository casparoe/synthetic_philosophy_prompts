answer: |-
  This is an excellent observation, and it identifies one of the most persistent semantic roadblocks in the behavioral sciences. The phrase "just-so story" has evolved from a specific reference to Kipling into a rhetorical weapon that conflates several distinct methodological failures.

  To help your readers navigate this standoff, it is useful to disentangle the phrase into its constituent methodological criticisms. Below is a taxonomy of the six distinct claims hidden behind the label, ranked roughly from the most easily remedied to the most damning, along with an assessment of their fairness and whether they warrant dismissal or merely scrutiny.

  ### 1. The "Lack of Comparative Data" Claim
  **The Charge:** The researcher has asserted an evolutionary function for a human trait without comparing humans to related species or examining the phylogenetic history of the trait.
  *   **What it means:** If you claim gossip is an adaptation for social bonding, you should show evidence of similar behaviors in primates or demonstrate how the trait tracks with social complexity across species. Without this, the evolutionary link is asserted, not demonstrated.
  *   **Fairness:** **High.** This is a standard requirement in evolutionary biology. However, it is sometimes unfairly applied to human-specific traits (e.g., complex language) where direct comparative models are difficult to construct.
  *   **Verdict:** **Flag for Scrutiny.** This indicates the hypothesis is incomplete, not necessarily false. It warrants a demand for more data, not the dismissal of the adaptive hypothesis itself.

  ### 2. The "Proximate vs. Ultimate Confusion" Claim
  **The Charge:** The researcher is mistaking *how* a behavior happens (psychological mechanism/development) for *why* it exists (evolutionary function).
  *   **What it means:** A developmental psychologist might argue, "Step-parents invest less because they lack the hormonal bonding triggered by birth," while the evolutionary psychologist says, "Step-parents invest less because they were selected to prioritize genetic offspring." Critics often treat these as mutually exclusive, labeling the evolutionary account a "just-so story" because it ignores the hormonal mechanism.
  *   **Fairness:** **Low to Mixed.** In modern theory, proximate and ultimate explanations are complementary (Tinbergen's Four Questions). However, it is a fair criticism if an evolutionary psychologist claims their functional account *replaces* the need for mechanistic study.
  *   **Verdict:** **Flag for Scrutiny.** This is usually a call for integration, not dismissal. A hypothesis is not invalidated simply because it operates at a different level of analysis.

  ### 3. The "Panglossian Adaptationism" Claim
  **The Charge:** The researcher assumes every existing trait must have an adaptive function, ignoring the possibility that it is a byproduct (spandrel), a result of genetic drift, or evolutionary noise.
  *   **What it means:** This comes directly from Gould and Lewontin's 1979 "Spandrels" paper. It criticizes the assumption of optimality. For example, perhaps the human chin serves no function; it is just a structural byproduct of jaw reduction. Insisting it is for "sexual selection" is a just-so story.
  *   **Fairness:** **High.** Early evolutionary psychology was often guilty of "adaptive panic," assuming every trait was a direct adaptation. Modern researchers are more cautious, but the bias persists.
  *   **Verdict:** **Flag for Scrutiny.** This warrants a demand for the researcher to consider and rule out null hypotheses (e.g., drift or byproduct). It does not warrant dismissing the adaptation hypothesis, but it shifts the burden of proof heavily onto the researcher.

  ### 4. The "Post Hoc Rationalization" Claim
  **The Charge:** The hypothesis was generated *after* observing the data, rather than predicting the data beforehand.
  *   **What it means:** If you observe that men prefer younger women, and then construct a story about reproductive value to explain it, you have fit the story to the facts. If you had predicted the preference *before* measuring it based on the theory, the story is stronger.
  *   **Fairness:** **Very High.** This is the most common and accurate use of the term. Human behavior is flexible enough that a clever theorist can invent a plausible adaptive story for almost any observed pattern after the fact.
  *   **Verdict:** **Damaging, but not Fatal.** A post hoc hypothesis is scientifically weaker than a predictive one, but it is not unscientific. It warrants dismissal *as a confirmed fact*, but it should remain on the table as a hypothesis that requires *new* predictive testing to validate.

  ### 5. The "Ignoring Cultural Transmission" Claim
  **The Charge:** The researcher attributes a behavioral pattern to genetic evolution when it could be better explained by cultural learning or social norms.
  *   **What it means:** If a behavior varies wildly across cultures or changes rapidly over time (e.g., specific mating rituals), a genetic evolutionary account is unlikely. Critics argue that labeling these "evolved" ignores the speed and flexibility of cultural evolution.
  *   **Fairness:** **High (with caveats).** Gene-culture coevolution is real, but critics are right that some evolutionary psychologists underweight the explanatory power of cultural norms. However, if the critic implies that *only* cultural explanations are valid, they are committing the "Standard Social Science Model" error.
  *   **Verdict:** **Flag for Scrutiny.** This requires the researcher to demonstrate that the trait is universal or canalized enough to suggest genetic underpinnings. It warrants a demand for cross-cultural data, not immediate dismissal.

  ### 6. The "Unfalsifiable/Untestable" Claim
  **The Charge:** The hypothesis is constructed in such a way that no possible evidence could prove it wrong.
  *   **What it means:** If a researcher claims a trait is adaptive, but explains away any counter-evidence (e.g., "If they do X, it's adaptive; if they do Y, it's also adaptive because of context"), the theory is unfalsifiable.
  *   **Fairness:** **Variable.** Some specific papers are guilty of this. However, critics often misuse this to claim the *entire field* is unfalsifiable because the past cannot be directly observed. This is incorrect; evolutionary hypotheses make predictions about current physiology, psychology, and cross-cultural patterns.
  *   **Verdict:** **Warrants Dismissal.** If a specific hypothesis is truly unfalsifiable, it is not science. However, readers must distinguish between "hard to test" (which applies to much of history and cosmology) and "impossible to test."

  ### Summary for Your Piece

  To help your readers cut through the noise, you might propose a "Just-So Scorecard." When a critic deploys the phrase, ask them to specify which of the above they mean.

  *   **If they mean 1, 2, 3, or 5:** They are pointing out **gaps in evidence**. The appropriate response is "Show me more data," not "You are wrong."
  *   **If they mean 4:** They are pointing out **weak inference**. The appropriate response is "Make a new prediction and test it."
  *   **If they mean 6:** They are pointing out **non-science**. The appropriate response is "Discard the hypothesis."

  **The Crucial Nuance for Your Readers:**
  The tragedy of the "just-so story" label is that it is often used to enforce **Claim 6 (Unfalsifiable)** when the critic actually means **Claim 4 (Post Hoc)**.

  A post hoc story is not nonsense; it is a hypothesis waiting for a prospective test. Dismissing a post hoc evolutionary hypothesis out of hand is as unscientific as accepting it without verification. The phrase should signal the *start* of a rigorous testing process, not the *end* of the conversation.

  If your piece can convince readers to demand specificity—asking "Do you mean this is untestable, or just that you haven't tested it yet?"—it will go a long way toward dissolving the standoff.
