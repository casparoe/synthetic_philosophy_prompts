answer: |-
  ### The Example: The Incapacitated Guardian

  Imagine a private swimming pool at a exclusive club. A toddler wanders in and falls into the deep end. 

  There are two adults present. 
  1.  **The Lifeguard:** He is on duty, under contract, and trained to rescue swimmers. However, at the exact moment the child falls, the Lifeguard suffers a sudden, paralyzing cramp. He is mentally alert but physically incapable of moving his limbs for the crucial three minutes.
  2.  **The Guest:** A member of the club with no contractual duty, no training, and no prior relationship to the child. He is standing five feet away, physically able to dive in, but he freezes in shock and does nothing.

  The child drowns. 

  Counterfactually, if *either* adult had acted, the child would have lived. Both failed to act. Both omissions are necessary conditions for the death in the specific context (since the other didn't act). Yet, our intuitions pull in opposite directions. Legally, the Lifeguard is liable (breach of duty) despite incapacity (strict liability in some frameworks), while the Guest is not liable (no duty). But metaphysically? Did the Guest *cause* the death?

  ### What This Reveals

  This example isolates the tension between **Counterfactual Dependence** and **Normative Selection**.

  1.  **The Counterfactual Intuition:** If we define causation purely by "but-for" testing (if X hadn't happened, Y wouldn't have occurred), the Guest is a cause. If the Guest had jumped in, the child lives. The Guest's omission is just as physically potent as the Lifeguard's. To deny this seems to ignore the physical reality that the Guest was the *only* available physical mechanism for salvation.
  2.  **The Normative Intuition:** If we say the Guest caused the death, we open the door to the "Proliferation Problem." Every capable person within a feasible distance who didn't jump in (the person in the locker room, the person driving past the gate) becomes a cause. To avoid this, we usually invoke a "duty" or "norm" to filter which omissions count.
  3.  **The Deep Difficulty:** In this specific case, the "duty" filter yields a counter-intuitive result. The Lifeguard had the duty but lacked the *capacity*. The Guest had the *capacity* but lacked the *duty*. 
      *   If you say the **Lifeguard** caused it, you are saying causation can exist without physical possibility (he literally could not have done otherwise).
      *   If you say the **Guest** caused it, you are saying causation expands to include any capable bystander, collapsing the distinction between "killing" and "letting die."

  **The Revelation:** This example reveals that causation by omission is not a **metaphysical relation between events** (like one billiard ball hitting another); it is a **normative selection mechanism**. 

  When we say an omission "caused" an outcome, we are not describing the physical fabric of the universe. We are placing a spotlight on a specific non-event because it violated a background expectation. In the "Incapacitated Guardian" case, the spotlight fractures. Do we shine it on the person who *should* have acted (Lifeguard), or the person who *could* have acted (Guest)? 

  The example forces us to admit that "cause" in omission cases is partly a moral or legal category disguised as a descriptive one. It reveals that we cannot solve the metaphysics of omission without first settling the ethics of obligation. The "cause" is not found in the world; it is imposed upon the world by our expectations of how agents *ought* to behave.

  ### Where My Reasoning Is Vulnerable

  My analysis above relies on a **Normative Contextualist** view: that causal status depends on the presence of a duty or expectation. I argue that without a norm to select the omission, causation proliferates uncontrollably. 

  **The Vulnerability:** The **Physicalist Eliminativist** Challenge.

  A rigorous physicalist would argue that my entire analysis is category-confused. They would argue:
  > *"There is no such thing as causation by omission. There are only positive physical events. The child died because water entered lungs, caused by gravity and the absence of buoyancy. The Lifeguard's muscles didn't contract. The Guest's muscles didn't contract. These are just descriptions of static physical states. To call the Guest's stillness a 'cause' is to treat 'nothing' as 'something.' You are trying to solve a metaphysical error with a normative bandage."*

  **Why this is hard for my analysis to absorb:**
  If the Eliminativist is right, then my attempt to distinguish the Guest from the Lifeguard using "norms" is futile. I am trying to rank two non-events. But in a purely physical description, there are no non-events. There is only the history of particles. 

  To defend my view, I must argue that **causation is not purely physical.** I have to claim that causation is a relationship that exists only relative to agents, expectations, and models of the world. This is a hard bullet to bite. It implies that causation is not a fundamental feature of the universe (like gravity) but a feature of *how we describe* the universe. 

  **The Specific Challenge That Would Change My Verdict:**
  If I were presented with a case where **norms are absent but causal intuition remains strong**, my Normative Contextualism would collapse. 

  Imagine a scenario where a human is replaced by a **randomized machine**. A machine is programmed to flip a switch if a light turns red. The light turns red. The machine malfunctions (omission to flip). A disaster occurs. 
  *   There is no "duty" in the moral sense. 
  *   There is no "expectation" in the social sense. 
  *   Yet, we would overwhelmingly say the machine's failure to act *caused* the disaster.

  If I accept the machine case as causation by omission (which I do), then "duty" cannot be the essential criterion. This would force me to retreat from "Normative Expectations" to "Functional Design." But then, what is the functional design of a human bystander? If I argue humans have a "biological function" to rescue kin, I slide into sociobiology. If I argue they don't, I must admit the Guest is not a cause. 

  This challenge is difficult because it suggests my reliance on "norms" is anthropocentric. If a machine without norms can cause by omission, then the "duty" I used to exonerate the Guest might be irrelevant. The deeper metric might be **Systemic Function**. If the Guest is viewed as part of the "safety system" of the pool (even informally), they are a cause. If they are viewed as external to the system, they are not. 

  This makes my analysis vulnerable to the charge that **causation is merely a matter of system boundaries.** If I define the "system" as "Club Staff," the Guest isn't a cause. If I define the "system" as "People Present," the Guest is a cause. This renders causation by omission entirely arbitrary, dependent on where the observer draws the circle. Defending against that arbitrariness without resorting to "well, we just intuitively draw the circle here" is the hardest philosophical task remaining.
