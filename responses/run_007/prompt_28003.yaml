      *   *The Biological Reality:* Use the user's background. An organism is a specific spatio-temporal trajectory. Cloning creates a new trajectory. Parfit treats identity like software; Biology treats it like hardware + process. Angier's body rots. That is death, biologically.
      *   *The First-Person Perspective (The "View from Nowhere" vs. "View from Here"):* Parfit adopts a "view from nowhere" (objective). Angier is stuck in the "view from here." The copy *thinks* he survived, but the original *knows* he died. Parfit privileges the copy's report; the film privileges the original's experience.
