      *   *Idea 2: Biological Individuality.* As a biologist, the user knows that organisms are discrete spatiotemporal entities. Cloning doesn't extend the life of the original organism. Parfit ignores the "vehicle" for the "software."
      *   *Idea 3: The Ethics of Suicide vs. Survival.* Parfit says it's survival. Angier says it's suicide. The film argues that the *cost* of the trick reveals the truth. If it were truly survival, would it feel like dying?
      *   *Idea 4: Narrative Identity vs. Metaphysical Identity.* Parfit looks at metaphysics. The film looks at narrative/tragic cost.

  6.  **Developing the Argument (Drafting the Response):**

