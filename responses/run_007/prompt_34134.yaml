      *   *Actually, Case 1 is better.* In Case 1, the employer didn't necessarily *know* the bias existed beforehand, but was held responsible anyway for "Choosing to use." In the Drone case, the risk was documented. If Case 1 holds employers responsible for *undiscovered* bias, they should certainly be responsible for *documented* risks that their employee ignored.
      *   *Wait, let's look at the Manufacturer.* In Case 2, Manufacturer wasn't liable because testing met standards. Here, Designers warned. So Designers are likely out.
      *   *Let's look at the Operator.* In Case 2, Surgeon wasn't liable because they followed protocol. Here, Planner did *not* follow protocol. Does that make them liable? Or their employer? Case 1 says Employer is liable for the system's effects. It doesn't mention the HR manager's negligence. Case 3 says Commander is liable. It implies organizational/authority liability.
      *   *Conclusion:* The Board's precedent favors **Organizational Liability for Deployment**. The failure of the employee is a failure of the organization's training/oversight.

