answer: |-
  The linen fell away, and the world did not arrive; it invaded.

  For twenty years, Elian had known the universe as a architecture of resistance. Walls were things that stopped his cane; stairs were changes in elevation that caught his toes; faces were warm contours under his fingertips. The world was solid, sequential, and honest. You had to meet it to know it.

  But this new sense was a flood. It was passive, distant, and overwhelmingly loud. The doctor called it sight. Elian called it noise. Colors crashed against his eyelids even when they were open. There was no texture here, only a strange, vibrating flatness that somehow implied depth without offering purchase.

  "Look at the table," the doctor said. The voice came from a location Elian could now *see*, a concept that made his stomach turn. He looked.

  On the white surface sat two objects. He knew them. He had spent the morning before the surgery memorizing them. In his hands, the first object was a miracle of continuity. No start, no end, no catch for the nail. It was the Sphere. The second object was a landscape of stops. Edges bit into his palm; corners pricked the skin. It was the Cube.

  "Tell me," the doctor said, his voice tight with a curiosity Elian could hear but not yet see. "Without reaching out. Which is which?"

  Elian stared. The invasion of light settled into shapes. There was a roundish patch of brown and a squarish patch of brown. But the connection was severed.

  In his hands, the Sphere was defined by the absence of edges. It was a promise that if he rolled his finger, it would never fall off. But the thing on the table… the thing that *looked* like the sphere was a flat disk of shadow and highlight. It had a boundary. It stopped. Visually, it had an edge—a circle of dark outline against the white table. How could a thing with a visual edge be the thing without a tactile edge?

  The Cube was worse. In touch, it was six faces, twelve edges, eight corners. But the thing on the table… it was a hexagon. It had angles that looked obtuse, lines that receded into nowhere. It didn't look like a cube. It looked like a strange, flat jewel.

  "I don't know," Elian whispered.

  "Look closer," the doctor urged. "You know the sphere is smooth. Look for the smooth one."

  Elian squinted. The light played across the objects. The roundish one had a gradient, a shift from light brown to dark brown. Was that smoothness? Or was it just a change in color? The squarish one had sharp lines of shadow. Was that an edge? Or just a paint stroke?

  He felt a profound vertigo. His hands knew the truth of these objects. They knew the sphere as a constant curve, a geometric truth written in skin pressure. But his eyes… his eyes were liars. They presented him with a world of surfaces, of masks. The visual sphere was not round; it was a circle. The visual cube was not solid; it was a collection of planes.

  He realized then that he possessed two maps of the same territory, drawn in different languages. One was written in pressure and temperature, the other in luminance and hue. There was no dictionary.

  He wanted to say the round-looking one was the sphere. It felt like the obvious choice. But the memory of his hands was strong. The hands knew that 'round' meant 'no stop.' The eyes showed him a 'stop'—the edge of the circle against the table. If he trusted his eyes, he would be betrayed. If he trusted his hands, he was blind.

  "It's a trick," Elian said, his heart racing. "The light… it flattens them. The cube looks like a star. The sphere looks like a coin."

  "Can you not tell by the shadow?"

  "The shadow is just more color," Elian said. "It doesn't have weight."

  He felt a surge of frustration, hot and prickly. He wanted to bridge the gap. He wanted to reach out and grab the round-looking object and prove to his eyes that they were looking at the Sphere. But the rule was absolute. Vision alone.

  He stared until his eyes watered. He tried to project his tactile memory onto the visual field. He tried to imagine the feeling of the corner into the sharp angle of the hexagon. But the angle was just a line. It didn't hurt. It didn't resist. How could he know it was a corner if it didn't push back?

  The phenomenology of it was isolating. He was split in two. The Elian who knew the world through touch was sitting in a dark room inside his head, shouting at the Elian who was drowning in light. The tactile Elian knew the cube was hard and dangerous. The visual Elian saw only brown shapes on white. There was no overlap. No common ground.

  If he guessed, he would be guessing based on a hope that the world was consistent, not on knowledge. He had no evidence that the 'roundness' of light was the same as the 'roundness' of wood.

  "I cannot," Elian said. The admission felt like a failure, but it was also a discovery. He had gained a sense, but he had not gained unity. He was a conglomerate of senses, not a whole.

  "Reach out," the doctor said softly.

  Elian lifted his hand. The movement was visible to him now. He saw his hand traverse the space, a ghost moving through the luminous fog. He hovered over the round-looking object. His fingers trembled.

  He touched it.

  The cool wood met his skin. The curve welcomed his fingerprint. No edges. No stops. The Sphere.

  He pulled his hand back and looked at it. Then he looked at the object. A spark jumped. A wire connected. The visual circle *was* the tactile curve. The gradient of light *was* the turn of the wood. It wasn't innate. It wasn't immediate. It was a bridge he had to build, plank by plank, moment by moment.

  "The other one," Elian said. He reached for the hexagon. His fingers found the corner. It bit him. The Cube.

  He sat back, the two objects now linked in his mind. The light was no longer just noise. It was a promise of touch yet to come. But as he sat there, blinking in the glare, he understood the truth of his new condition. He was not healed. He was translated. And he would spend the rest of his life learning the vocabulary of the light, one object at a time.
