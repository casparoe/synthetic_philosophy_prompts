answer: |-
  You are right to suggest that the practice of using generic 'he' is not merely a stylistic habit but rests upon a specific, albeit often unarticulated, philosophical infrastructure. It is also correct to note that this infrastructure is not necessarily coherent; it is often a sedimentation of conflicting assumptions that serve a rhetorical purpose rather than a logical one. To reconstruct the philosophy of language tacitly endorsed by the defenders of generic 'he', and subsequently by the enforcers of 'he or she' who resist singular 'they', we must look at their commitments regarding semantics, metaphysics, and the nature of grammatical rules.

  Here is a reconstruction of those presuppositions, followed by an analysis of the shift you identify.

  ### 1. The Metaphysics of the Universal (Aristotelian Essentialism)
  The deepest philosophical commitment required to make generic 'he' intelligible is a specific view of the relationship between the particular and the universal. In this view, language ought to mirror the metaphysical hierarchy of nature. Historically, this draws on an Aristotelian biology wherein the male is viewed as the active, perfected form of the species, and the female as a passive or deviant variation.

  Translated into the philosophy of language, this presupposes that the **marked/unmarked distinction** is natural rather than conventional. In linguistics, an 'unmarked' term is the default (e.g., 'actor' vs. 'actress'). The practice of generic 'he' presupposes that 'male' is the unmarked state of 'human'. Therefore, the word for the specific (man/he) can logically encompass the general (human/person), but the reverse is impossible. A word for the specific female ('she') cannot encompass the general, because the female is metaphysically particularised.

  This view rules out a **Nominalist** or **Social Constructionist** view of categories, which would hold that 'human' is a category distinct from 'male' and 'female', and that no single gendered term can logically subsume the others without distortion. By insisting 'he' is neutral, the practice asserts that gender is not a relevant differentiator for the universal class, except that the male form is the privileged vessel for that universality.

  ### 2. Referential Intentionalism and Stipulative Definition
  You ask if the practice presupposes that meaning is just stipulated reference. In a sense, yes. This approach relies heavily on a form of **Referential Intentionalism**. It assumes that the speaker's intent fixes the reference of a term, regardless of the term's etymological or conventional semantic content.

  If a legislator writes, "Every citizen must cast his vote," the defender of generic 'he' argues that the *intent* is 'every citizen'. Therefore, the reference is 'every citizen'. The semantic baggage of 'he' (maleness) is treated as pragmatically cancellable. This presupposes a theory of meaning where **sentence meaning** (the literal content of the words) is subordinate to **speaker meaning** (the intent behind the utterance).

  However, this is applied selectively. It is not applied to other potential ambiguities. If I say, "The bank is steep," and intend 'financial institution', I am misunderstood. But if I say, "He is wise," and intend 'human', I am to be understood. This selective intentionalism presupposes that the 'neutral' reading is the *primary* reading, and the 'male' reading is secondary. This is only sustainable if one already accepts the metaphysical hierarchy mentioned above. It quietly rules out a **Use Theory of Meaning** (à la Wittgenstein), which would argue that the meaning of 'he' is determined by how it is actually processed and understood in the language game, not by the stipulations of a style guide.

  ### 3. The Transparency Thesis (Cognitive Inertness)
  Perhaps the most crucial presupposition is what we might call the **Transparency Thesis**. This is the belief that language is a neutral medium for conveying thought, not a constituent of thought itself. It assumes that connotations, mental imagery, and associative networks are separable from denotation and cognitively inert.

  Under this view, the word 'he' is a label. Like a label on a jar, what matters is what the authority says is inside the jar, not the colour of the label. If the style guide says the jar contains 'humans', then it contains humans, even if the label is blue and blue usually signifies 'boys'. This explicitly rejects the **Sapir-Whorf hypothesis** (linguistic relativity) in its strong form, and ignores modern psycholinguistic evidence regarding priming and stereotype activation.

  It also rejects the idea that language has a **performative** or **constitutive** power (in the Austinian sense) regarding social reality. If language merely describes reality, then using 'he' for everyone is a harmless shorthand. If language helps construct social reality, then using 'he' actively excludes women from the conceptual space of the sentence. The generic 'he' practice requires the former view to remain tenable.

  ### 4. The Puzzle of 'He or She' vs. Singular 'They'
  Your second question regarding the shift to 'he or she' while resisting singular 'they' is particularly revealing. It exposes a tension between two different philosophies of language that were previously conflated.

  **What 'He or She' admits:**
  The move to 'he or she' concedes the failure of Referential Intentionalism. It admits that speaker intent is not enough to neutralise the male connotation of 'he'. It acknowledges that the *semantic content* of the word matters. This is a shift towards a more **Compositional Semantics**, where the meaning of the whole is determined by the meanings of the parts. If 'he' means male, you cannot get 'neutral' without adding 'she'.

  **What 'He or She' retains (and why 'They' is rejected):**
  However, the resistance to singular 'they' reveals a commitment to **Morphological Formalism**. This is the view that grammar is a logical system of agreement rules that exists independently of usage.
  *   **Generic 'He':** Syntactically singular, semantically generic. (Accepted because it preserves surface singular agreement).
  *   **'He or She':** Syntactically singular, semantically explicit. (Accepted because it preserves surface singular agreement).
  *   **Singular 'They':** Syntactically plural (morphologically), semantically singular (notionally). (Rejected because it violates morphological agreement).

  The institutions you describe are prioritising **surface syntax** over **notional agreement**. They presuppose that 'grammar' is a set of prescriptive laws (like the laws of logic) rather than a descriptive record of how speakers successfully communicate. To accept singular 'they' is to accept a **Descriptivist** view of grammar: that if native speakers use it to convey a singular meaning without confusion, it *is* singular.

  By rejecting 'they', these institutions maintain that the *form* of the word (its plural ending or historical verb agreement) constrains its *function*, even when usage proves otherwise. This is inconsistent with their previous acceptance of generic 'he', which allowed *function* (generic intent) to override *form* (male semantics).

  ### 5. Incoherence and the 'Person Paper' Implication
  You asked if the question is ill-posed because the practice lacks a coherent philosophy. I would argue that it is not ill-posed, but the answer is that the philosophy is **defensive rather than constructive**. It is not a unified theory of language; it is a patchwork of convenient assumptions designed to preserve the status quo with minimal friction.

  *   When challenged on exclusion, it retreats to **Intentionalism** ("We *meant* everyone").
  *   When challenged on grammar, it retreats to **Formalism** ("'They' is plural").
  *   When challenged on cognition, it retreats to **Transparency** ("Words don't change thoughts").

  Hofstadter's 'Person Paper' works because it forces these assumptions into the open. By swapping gender for race, it shows that the **Transparency Thesis** is false (calling everyone 'white' *does* carry connotations) and that the **Metaphysics of the Universal** is arbitrary (whiteness is not the normative state of humanity).

  The 'he or she' compromise accepts Hofstadter's critique of the Transparency Thesis (admitting 'he' isn't truly neutral) but rejects his implied solution (that we should change the default category). It retains the **Binary Ontology**. It presupposes that gender is exhaustive and binary. 'He or she' covers the field because there are only two options. Singular 'they' is resisted not just because of number agreement, but because it threatens the binary ontology itself; 'they' can refer to a specific individual without specifying gender, which destabilises the requirement that every subject be categorised as male or female.

  ### Summary of the Philosophical Shift
  To move from the old practice to the current compromise requires the following theoretical adjustments:

  1.  **Abandonment of Pure Intentionalism:** Acknowledgement that word history and connotation constrain reference.
  2.  **Retention of Formalism:** Continued belief that morphological number agreement is a hard logical constraint, superior to notional agreement.
  3.  **Retention of Binary Metaphysics:** The assumption that 'he or she' is an exhaustive disjunction.

  To fully abandon the practice (and accept singular 'they' or other neopronouns) would require a more radical shift:
  1.  **Adoption of Descriptivism:** Grammar is defined by usage, not abstract rules.
  2.  **Adoption of Cognitive Linguistics:** Acknowledgement that language shapes conceptualisation (rejecting the Transparency Thesis).
  3.  **Rejection of Markedness Hierarchies:** Accepting that there is no 'default' human, and therefore no single term should serve as the universal.

  In conclusion, the practice of generic 'he' presupposes a language-world relationship that is hierarchical, intentionalist, and cognitively inert. The shift to 'he or she' admits the semantic failure of the first but doubles down on the syntactic rigidity of the second. It is a philosophy of language that prioritises the preservation of established categories (gender binary, singular/plural distinction) over the fluidity of actual communication. It treats language as a museum of logical forms rather than a living tool for social coordination.
