      *   *Introduction:* Acknowledge the complexity. It's not one philosophy but a sedimentation of several.
      *   *Section 1: The Metaphysics of the Universal.* The Aristotelian view where the male is the "perfect" specimen. The form represents the essence.
      *   *Section 2: The Semantics of Stipulation.* Meaning is fixed by authority, not use. Connotation is separable from denotation.
      *   *Section 3: The Transparency Thesis.* Language doesn't shape thought (anti-Whorfian).
