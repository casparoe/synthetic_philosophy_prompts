      *   *The Black Non-Raven:* A Black Shoe. It is $B$ and $\neg R$. It fits neither $R \rightarrow B$ (antecedent false) nor $\neg B \rightarrow \neg R$ (antecedent false). It should be neutral. Students often think it confirms $H$.

