  ### Interview Script: Henry Sidgwick on Ethics and Psychical Research

  **1. Question:** Professor Sidgwick, in *The Methods of Ethics*, you articulate the 'dualism of practical reason': the troubling possibility that rational self-interest and universal duty may not coincide without the sanction of a divine moral order. There is a charge that your co-founding of the Society for Psychical Research (SPR) was not merely scientific curiosity, but a philosophical rescue mission—an attempt to secure by empirical means the immortality required to resolve that dualism. How do you answer the allegation that the SPR was ethics by other means?

  *   **Anticipated Stance:** Sidgwick will likely deny that the *motivation* was biased, but admit the *significance* of the findings was weighted heavily by his ethical anxieties. He distinguishes between the desire for truth and the importance of the truth sought.
  *   **Follow-up:** You maintain the investigation was disinterested, yet you concede the *consequences* of the findings are of supreme moral importance. If the methodological rigour you demand ultimately destroys the hope for that moral order, must the philosopher prioritise the integrity of the method or the preservation of the moral sanction?

  **2. Question:** In your ethical method, you rely heavily on the clarity and precision of moral intuitions, subjecting them to a test of consistency. In psychical research, you are scrutinising testimony regarding trance phenomena and apparitions, which are notoriously unstable. Do you not apply a stricter standard of evidence to the medium's cabinet than you do to the moral agent's introspection?

  *   **Anticipated Stance:** He will argue that moral intuitions are self-evident to reason, whereas psychical claims are empirical assertions about the world requiring external verification. He sees them as different categories of knowledge.
  *   **Follow-up:** But if the 'self-evidence' of your ethical axioms relies on a faculty of mind that psychical research suggests is permeable to telepathic influence, does your ethical epistemology not depend on the very psychological boundaries your research is dissolving?

  **3. Question:** You became personally convinced of telepathy as a fact, yet you remained markedly cautious about treating mediumship as proof of survival after death. Why this asymmetry? Does it not reveal that you set the evidential bar higher precisely where the moral payoff would be greatest?

  *   **Anticipated Stance:** He will argue that telepathy between the living requires fewer assumptions than communication with the dead. He prioritises the 'least miraculous' explanation consistent with the data (the 'survival' hypothesis is the last resort).
  *   **Follow-up:** So the bar is higher for survival because the claim is greater, or because your methodological caution intensifies in proportion to your ethical desire for the claim to be true?

  **4. Question:** Let us consider your utilitarian impartialism. Does the principle of universal good give you a moral reason to *want* evidence of posthumous survival, as it would ensure ultimate justice? Conversely, does that same impartialism give you a moral reason to *distrust* your own wanting of it, recognising the bias it introduces?

  *   **Anticipated Stance:** He will acknowledge the tension. He believes truth is the ultimate duty, so wanting truth is good, but wanting a *specific* truth is dangerous. He trusts his own self-discipline to mitigate the bias.
  *   **Follow-up:** You trust your self-discipline, yet you acknowledge the human propensity for self-deception. If you found that your own desire for cosmic justice had subtly lowered your threshold for accepting a medium's testimony, would you be obliged to publish that failure of rigour even if it damaged the SPR's credibility?

  **5. Question:** Critics suggest that by seeking a scientific basis for religious dogmas, you are attempting to construct a natural theology that bypasses revelation. Is the SPR, in your view, a substitute for the church?

  *   **Anticipated Stance:** He will reject the idea of a 'substitute'. He views it as expanding the domain of science to include neglected facts, not as creating a new liturgy. He is an agnostic theist, not a dogmatist.
  *   **Follow-up:** [**Forcing Choice 1**] If science expands to include these facts, but the facts remain ambiguous—never quite proving the divine—must you then choose: do you retreat to a fideistic faith to preserve the moral order, or do you accept a godless universe and abandon the hope that duty and interest will ever reconcile?

  **6. Question:** The SPR spent considerable energy exposing fraud among mediums. Was this merely about scientific purity, or was there a fear that fraud would discredit the genuine phenomena you hoped to find?

  *   **Anticipated Stance:** He will insist it is about scientific purity. Fraud contaminates the dataset. However, he acknowledges that public perception links the two.
  *   **Follow-up:** If exposing a popular medium destroyed public faith in the possibility of survival, thereby weakening the moral sanction for the masses who require it, would your duty to truth outweigh the utilitarian cost of that disillusionment?

  **7. Question:** You have spoken of the 'esoteric morality' in your ethical work—the idea that some truths might be withheld from the general public if their dissemination caused harm. Did the SPR operate with a similar esotericism, keeping certain findings within the 'inner circle' of researchers until they were deemed safe for public consumption?

  *   **Anticipated Stance:** He will deny a formal conspiracy but admit to a prudent caution. He believes the public is prone to superstition; therefore, premature publication is irresponsible.
  *   **Follow-up:** Is this prudence, or is it a paternalistic control of evidence that contradicts the scientific ideal of open scrutiny? At what point does caution become concealment?

  **8. Question:** Your colleague Frederic Myers saw psychical research as the dawn of a new spiritual evolution. You seem far more sober. Do you view these phenomena as evidence of a higher purpose, or merely as anomalous facts of nature, like electricity?

  *   **Anticipated Stance:** He aligns closer to the latter. He seeks facts, not meaning. He is wary of Myers' romanticism.
  *   **Follow-up:** Yet if they are merely facts like electricity, devoid of moral purpose, does their discovery actually help resolve the dualism of practical reason at all, or does it leave you with a haunted universe that is still morally silent?

  **9. Question:** You have dedicated decades to this inquiry. If, at the end of your life, the evidence for survival remains inconclusive, has the project failed?

  *   **Anticipated Stance:** He will argue that establishing the limits of knowledge is also a success. Negative results are still results.
  *   **Follow-up:** [**Forcing Choice 2**] But for your specific ethical system, negative results are catastrophic. If the evidence remains inconclusive, the dualism stands. So I ask you directly: would you prefer a definitive disproof of survival, allowing you to rebuild ethics on a secular basis, or the current ambiguity which permits hope but denies certainty?

  **10. Question:** Finally, how do you wish posterity to weigh *The Methods of Ethics* against the minutes of the Society for Psychical Research? Are they separate rooms in the same house, or is one the foundation of the other?

  *   **Anticipated Stance:** He will hope they are seen as consistent applications of the same rigorous mind to different domains. He desires unity in his life's work.
  *   **Follow-up:** If posterity must choose—if they celebrate the moral philosopher only by excising the psychical researcher—would you accept that excision, or would you insist that the man who sought ghosts is the same man who defined duty?

  ***

  ### Concluding Analysis

  **Confidence in Predicted Answers**
  I am moderately to highly confident in the majority of these predicted responses. Sidgwick's intellectual persona is well-documented: he was scrupulously honest, intellectually dry, and deeply concerned with the consistency of his life's work. He rarely succumbed to emotional outbursts in print, preferring careful qualification. Consequently, predicting his defence of methodological rigour (Questions 2, 3, 6) is straightforward. He consistently argued that truth was the primary duty, even when inconvenient.

  **Least Sure Predicted Answer**
  I am least sure of his response to **Question 5 (Follow-up)**. Here, I ask him to choose between fideistic faith and a godless universe if science remains ambiguous. Sidgwick spent his life avoiding such binary corners. He was an agnostic theist who found comfort in the *possibility* of theism without claiming knowledge. Forced to choose between 'faith without evidence' and 'abandoning the hope of reconciliation', he might attempt a third path—perhaps arguing that morality must be pursued regardless of the metaphysical outcome (a stoic utilitarianism). Predicting whether he would admit the collapse of his ethical system under this pressure is difficult; he might defend the *Methods* as standalone, even if his personal hope was dashed.

  **Follow-up to Revise**
  If he answers differently from expectation, I would most want to revise the follow-up to **Question 9**. In the predicted scenario, I assume he values truth over comfort. However, if he reveals a deeper emotional investment in the 'moral order' than his public writings suggest (admitting that ambiguity is preferable to disproof), the follow-up as written ("would you prefer a definitive disproof...") might be too blunt. I would revise it to probe the *psychological cost* of that preference: "If you prefer ambiguity to disproof, does that not confirm that your inquiry was never truly scientific, but rather a search for consolation?" This would tighten the screw on the tension between his scientific pretensions and his existential needs.
