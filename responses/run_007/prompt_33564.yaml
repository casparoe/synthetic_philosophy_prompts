  # Decision Tree: The Metaphysics of Interpretation

  **Instructions:** Answer the following questions based on your intuitions about the cases. Do not worry about the names of theories; focus on the outcome. Your path through the tree will locate your position in the logical space of interpretation.

  ### Level 1: The Temporality of Meaning
  **Case (v): Semantic Shift.** A poem written in 1700 uses a word that meant *A* then but means *B* now. The reading based on *B* is compelling to modern readers.
  *   **Question:** Does the poem's meaning *change* to *B* over time, or was it always *A* (and we are just misunderstanding it now)?
      *   **A: Meaning is Fixed.** (The meaning was determined at publication and cannot change.) → *Go to Level 2A.*
      *   **B: Meaning Can Shift.** (Meaning is sensitive to time, context, or readership.) → *Go to Level 2B.*

  ---

  ### Level 2A: The Source of Meaning (Fixed Path)
  **Case (iii): Irony Mismatch.** An author states in an interview that a passage was intended as irony, but the text contains no linguistic markers of irony and no competent reader detects it.
  *   **Question:** Is the passage ironic?
      *   **A: Yes, because the Author intended it.** (The mental act determines the meaning.) → *Go to Level 3A.*
      *   **B: No, because the Text fails to show it.** (The public object determines the meaning.) → *Go to Level 3B.*

  ### Level 2B: The Driver of Shift (Dynamic Path)
  **Case (i): Diary Disavowal.** An author's private diary reveals a racist intention behind a poem, but the author later publicly disavows this, and modern readers find the poem valuable for its apparent anti-racism.
  *   **Question:** If meaning shifts, what constrains the *new* meaning?
      *   **A: The Value of the Work.** (Meaning shifts to make the work as good as possible.) → *Go to Level 3C.*
      *   **B: The Reader's Experience.** (Meaning shifts based on what readers actually construct, regardless of value.) → *Leaf 7.*

  ---

  ### Level 3A: The Success Condition (Author Path)
  **Case (iv): Late Letter / Linguistic Failure.** A newly discovered letter proves the author intended a specific pun, but the syntax of the poem makes that pun grammatically impossible.
  *   **Question:** Is the meaning the intended pun?
      *   **A: Yes.** (Intention constitutes meaning even if the text fails to realize it.) → **Leaf 1: Extreme Actual Intentionalism.**
      *   **B: No.** (Intention must be successfully realized in the text to count.) → **Leaf 2: Moderate Actual Intentionalism.**

  ### Level 3B: The Agent of Meaning (Text Path)
  **Case (ii): Algorithm.** A text is generated by an algorithm with no human author. Competent readers find it moving and meaningful.
  *   **Question:** Does the text have a determinate meaning?
      *   **A: Yes, based on language conventions.** (Meaning exists without an authorial mind.) → **Leaf 3: Historical Conventionalism.**
      *   **B: No, or only via a hypothetical author.** (Meaning requires attributing intentions to an idealized agent.) → **Leaf 4: Hypothetical Intentionalism.**

  ### Level 3C: The Constraint on Value (Value Path)
  **Case (iv) Adapted: Late Letter.** A letter reveals an interpretation that makes the work historically accurate but aesthetically dull.
  *   **Question:** Do we adopt the historically accurate reading?
      *   **A: No, we adopt the reading that makes the work best.** (Truth to author is secondary to artistic value.) → **Leaf 5: Value-Maximizing Theory.**
      *   **B: Yes, if conventions allow it.** (Meaning is constrained by public linguistic rules, even if dynamic.) → **Leaf 6: Contemporary Conventionalism.**

  ### Level 3 (Dynamic / Reader Path)
  *   **Question:** If two readers have incompatible experiences of the same text, are they both right?
      *   **A: Yes.** (Meaning is constituted by the individual reading event.) → **Leaf 7: Reader-Response Constructivism.**
      *   **B: No.** (One reading must align better with public conventions.) → *See Leaf 6.*

  ### Level 3 (Empty Logical Space)
  *   **Combination:** Meaning Shifts (Level 1B) + Author's Mind Wins (Level 2A logic applied to Dynamic).
  *   **Diagnosis:** **Leaf 8: Dynamic Actual Intentionalism.** (Empty/Incoherent).
  *   **Reason:** This view holds that meaning changes over time *because* the author's past mental state changes. Since a past mental state is fixed, this position is metaphysically incoherent. It is occupied only by those who confuse the author's *reputation* with the author's *intention*.

  ---

  ### Map of Positions & Awkward Commitments

  1.  **Extreme Actual Intentionalism:** Meaning is the author's intention even if the text makes it impossible.
      *   *Awkward Commitment:* A text riddled with typos that invert the author's goal still means the goal, rendering the text itself irrelevant.
  2.  **Moderate Actual Intentionalism:** Meaning is the author's intention only if successfully realized.
      *   *Awkward Commitment:* Two texts with identical words mean different things if the authors intended differently, even if no evidence of that difference exists.
  3.  **Historical Conventionalism:** Meaning is fixed by public language rules at the time of composition.
      *   *Awkward Commitment:* A text generated by a monkey or machine has the same kind of meaning as a human masterpiece.
  4.  **Hypothetical Intentionalism:** Meaning is what an ideal audience would attribute to a postulated author.
      *   *Awkward Commitment:* If the actual author confirms a reading, it can still be rejected if the "ideal" audience wouldn't guess it.
  5.  **Value-Maximizing Theory:** Meaning is the interpretation that makes the work aesthetically best.
      *   *Awkward Commitment:* A reading can be the "true" meaning even if the author explicitly denied it and historically could not have meant it.
  6.  **Contemporary Conventionalism:** Meaning is fixed by current language conventions, regardless of history.
      *   *Awkward Commitment:* Shakespeare's plays mean something entirely different today than they did in 1600, effectively becoming new works.
  7.  **Reader-Response Constructivism:** Meaning is created by the reader's experience.
      *   *Awkward Commitment:* There is no such thing as a "misreading," only different readings, making criticism impossible.
  8.  **Dynamic Actual Intentionalism:** (Unoccupied).
      *   *Diagnosis:* Incoherent. Requires the author's past mental state to be mutable.

  ---

  ### Collision Note: Hypothetical Intentionalism vs. Value-Maximizing
  These positions often converge on the same interpretations (the "best" reading is often what we attribute to an "ideal" author). They part company at **Level 1**. Hypothetical Intentionalism is historically constrained (the ideal author is bound by the historical context); Value-Maximizing is not (the work can be made to mean things the historical author could not conceive). If you find yourself wanting to maximize value *but* feel bound by what the author *could* have meant, you are in the collision zone. The tree forces you to choose: is the constraint historical (HI) or aesthetic (VMT)?

  ### Warning: The Most Tempting Misclassification
  **The Trap:** Students who hold **Moderate Actual Intentionalism** often answer like **Hypothetical Intentionalists** on four of the five cases. Both agree that failed intentions (Case iii) don't count and that public evidence matters. They diverge only on the *metaphysical ground* of that decision.
  **The Differentiator:** **Case (ii) Algorithm.**
  *   **Moderate Actual Intentionalist:** Must say the algorithm text has *no* meaning (or borrowed meaning), because there is no author to intend moderately.
  *   **Hypothetical Intentionalist:** Must say the algorithm text has *no* meaning, because there is no author to hypothesize about.
  *   **Wait, this doesn't separate them.**
  *   **Correction:** The trap is between **Hypothetical Intentionalism** and **Value-Maximizing**.
  *   **The Pattern:** A student who says Meaning Shifts (Level 1B) but insists it must fit the Author's Context (Level 3C, Option A logic).
  *   **The Fix:** The Level 1 Question (Semantic Shift) must be phrased to exclude "epistemic shifts." If you think meaning *appears* to change only because we learn more about the author, you are Fixed (Level 2A). If you think meaning *actually* changes because the world changed, you are Dynamic. The branch question asks: "Does the poem's meaning change... or was it always A?" This blocks the student who thinks new evidence changes meaning (Epistemic) from entering the Dynamic branch (Ontological).
