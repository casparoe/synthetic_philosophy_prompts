answer: |-
  This is a precise translation task. You are asking to map a philosophical/logical problem onto the ontology of formal verification and stateful systems engineering.

  Here is the restatement of the Frame Problem in your vocabulary, followed by the residue report.

  ---

  ### Part 1: The AI Formulation (McCarthy & Hayes, 1969)
  **The Specification Bloat Problem**

  **The Context:**
  Imagine you are writing a formal specification for a stateful system using a language like Dafny, TLA+, or Coq. You have a global state $\Sigma$, composed of a set of variables (fluents) $V = \{v_1, v_2, ..., v_n\}$. You define an action $A$ as a state transition function $f: \Sigma \rightarrow \Sigma$.

  **The Issue:**
  In Hoare Logic, you specify $A$ with a triple $\{P\} A \{Q\}$.
  $P$ is the precondition. $Q$ is the postcondition.
  If $A$ modifies $v_1$, your postcondition $Q$ explicitly states the new value of $v_1$ (e.g., $v_1' = v_1 + 1$).

  The **Frame Problem** arises when you ask: *How do I formally specify that $v_2, ..., v_n$ remain unchanged?*

  **The Naive Solution (Frame Axioms):**
  For every action $A_i$ and every variable $v_j$ that $A_i$ does *not* touch, you must write an explicit axiom:
  $$v_j' = v_j$$
  If you have $N$ actions and $M$ state variables, you need $O(N \times M)$ frame axioms.

  **The Engineering Translation:**
  This is the headache of writing `modifies` clauses and `unchanged` assertions in a specification language without structural support.
  *   **Situation Calculus** $\rightarrow$ A global state monad or a mutable heap model.
  *   **Fluents** $\rightarrow$ Heap locations or state machine fields.
  *   **Frame Axioms** $\rightarrow$ Explicit `assert(old(x) == x)` for every untouched variable in every function's postcondition.
  *   **The Problem** $\rightarrow$ **Specification Verbosity.** It is impractical to manually enumerate non-effects. It makes the spec brittle; adding a new state variable requires updating the postconditions of *every existing function* to assert that the new variable is untouched.

  **The Modern Engineering Solution:**
  You likely recognize **Separation Logic**. The "frame rule" in Separation Logic is the direct engineering patch for the McCarthy/Hayes Frame Problem. It allows you to specify that a function operates on a specific heap region $h_1$, implicitly guaranteeing that disjoint region $h_2$ remains unchanged without explicitly naming it.
  $$\frac{\{P\} C \{Q\}}{\{P * R\} C \{Q * R\}}$$
  Here, $R$ is the "frame." You don't list what $R$ contains; you just assert disjointness.

  ---

  ### Part 2: The Philosophical Generalization (Dennett, Fodor, 1980s)
  **The Relevance and Computation Problem**

  **The Context:**
  Now move from *specification* (writing down the rules) to *execution* (running the planner). You are building an AGI agent (a complex state machine with a goal function $G$). The agent must plan a sequence of actions to satisfy $G$.

  **The Issue:**
  In the AI formulation, we assumed we *knew* which variables were unaffected. In the philosophical formulation, the agent must *compute* which facts are relevant to its goal before it acts.

  Consider Dennett's robot:
  1.  **Robot 1:** Plans to pull a wagon out of a room. It succeeds. It fails to realize the bomb on the wagon is also pulled out. It explodes.
      *   *Engineering Failure:* Missing a dependency in the state model. The bomb's location was coupled to the wagon's location, but the spec didn't capture it.
  2.  **Robot 2:** Designed to check all side effects. Before acting, it simulates every state transition for every variable in the universe to ensure no goal-violating state (like `bomb.exploded == true`) is reached.
      *   *Engineering Failure:* Performance. The state space is too large. The check never completes (timeout).
  3.  **Robot 3:** Designed to check only *relevant* side effects. It sits there pondering which side effects are relevant.
      *   *Engineering Failure:* Infinite recursion / Halting Problem. Determining relevance is as hard as the planning problem itself.

  **The Engineering Translation:**
  This is not about writing postconditions; it is about **Static Analysis and Dependency Tracking** in an Open World.
  *   **The Sleeping Dog Strategy** $\rightarrow$ **Lazy Evaluation / Dirty Flagging.** Assume state is valid (`dog.asleep == true`) unless an event invalidates it.
  *   **Relevance** $\rightarrow$ **Dependency Graph Reachability.** A fact is relevant if it is reachable from the action node in the causal graph and impacts the goal metric.
  *   **The Problem** $\rightarrow$ **Dynamic Dependency Resolution.** In a closed system (your code), the dependency graph is static or tractable. In the philosophical problem (the real world), the graph is dynamic, hidden, and potentially infinite. You cannot statically link "pulling wagon" to "bomb explodes" unless you have a model of bombs, wagons, and friction.

  ---

  ### Part 3: The Residue Report

  Here is the audit of what survives translation and what evaporates.

  #### 1. Clean Mappings (Problems you know)
  *   **The Combinatorial Explosion of Frame Axioms:** This maps 1:1 to the verbosity of formal specs. You know this pain. If you change a global config, you don't want to update the postconditions of 5,000 pure functions.
      *   *Solution:* Separation Logic, Ownership Types (Rust), Capabilities. These are engineering solutions to the logical Frame Problem.
  *   **The Sleeping Dog:** This maps to **Caching and Invalidation.**
      *   *Logic:* "Assume $X$ is true unless notified."
      *   *Eng:* "Assume cache line is valid unless dirty bit is set."
      *   *Eng:* "React components don't re-render unless props change."
  *   **Modularity vs. Global State:** The Frame Problem is essentially the argument for encapsulation. If I can guarantee that Module A cannot touch Module B's memory, I solve the frame problem for Module A.

  #### 2. Distorted Mappings (Concepts that stretch)
  *   **Relevance vs. Dependency:**
      *   *In Engineering:* Dependency is syntactic or memory-based. Function `foo()` depends on `bar()` if it calls it or touches its memory. This is decidable (mostly).
      *   *In Philosophy:* Relevance is *semantic*. Does moving the wagon offend the King? Does it violate a social norm? Does it change the aesthetic balance of the room?
      *   *Distortion:* We try to map "relevance" to "impact on goal function." But in AGI, the goal function is often underspecified. In software, the return type is strict. The philosophical problem assumes the "goal" is fuzzy (survival, happiness), making static analysis impossible.
  *   **The Frame vs. The Context:**
      *   *In Engineering:* The "frame" is the heap.
      *   *In Philosophy:* The "frame" is the universe of common sense.
      *   *Distortion:* We assume the OS handles the hardware. Philosophers ask, "How does the agent know the OS won't delete the file mid-transaction?" This maps to **Byzantine Faults**, but philosophers treat it as the default state of affairs, not an edge case.

  #### 3. The Void (No Counterpart)
  There are parts of the philosophical Frame Problem that have **no counterpart** in your vocabulary. This is not because your vocabulary is lacking, but because software engineering relies on assumptions that the philosophical problem explicitly rejects.

  *   **The Closed World Assumption (CWA):**
      *   *Engineering:* You operate in a VM. The memory is bounded. The instructions are deterministic. If a variable isn't in your scope, you can't touch it.
      *   *Philosophy:* The world is Open. New objects appear. Physics might change. "Relevance" can come from outside the model.
      *   *The Void:* There is no engineering equivalent to "Action A might change Variable V, but we don't know V exists yet." In your world, if V doesn't exist, the compiler errors. In the philosophical world, the robot explodes because it didn't model the bomb.
      *   *Verdict:* The philosophical Frame Problem is unsolvable in principle because it demands **complete modeling of an open system.** Your job is to build closed systems. You solve the Frame Problem by *fiat* (defining the boundaries). They cannot do that.

  *   **Intentionality and "Aboutness":**
      *   *Engineering:* State is bits. It has no meaning.
      *   *Philosophy:* State represents facts. `On(BlockA, Table)` is *about* the world.
      *   *The Void:* The philosophical problem worries about whether the internal state *correctly corresponds* to external reality (the Symbol Grounding Problem). You only worry about internal consistency. If your state says `bomb.armed = false` but the real bomb explodes, that's a sensor failure, not a Frame Problem. For the philosopher, the inability to distinguish sensor failure from logical irrelevance *is* the Frame Problem.

  *   **The Cost of Representation:**
      *   *Engineering:* We assume representing state is cheap (RAM is cheap).
      *   *Philosophy:* Representing the state of the world is cognitively expensive.
      *   *The Void:* You never worry about the "computational cost of existence." You allocate memory. The philosopher worries about how an agent selects *which* facts to represent in memory at all. This maps loosely to **Garbage Collection**, but GC reclaims memory; the Frame Problem is about deciding what to *keep* in the working set of consciousness without explicit pointers.

  ### Summary Conclusion

  **The AI/Logic Frame Problem** is a solved engineering problem.
  *   **Name:** Specification Verbosity / Coupling.
  *   **Solution:** Separation Logic, Ownership, Immutable Data Structures, Event Sourcing.
  *   **Status:** You deal with this every time you write a `modifies` clause or choose Redux over mutable global state.

  **The Philosophical Frame Problem** is an unsolved metaphysical problem.
  *   **Name:** Open-World Semantic Relevance.
  *   **Solution:** None. (Machine Learning attempts to brute-force it via statistical relevance, but doesn't "solve" the logic).
  *   **Status:** It exists only because philosophers refuse the **Closed World Assumption**.

  **The Residue:**
  The philosophical Frame Problem smuggles in the assumption that an agent must be able to reason about *everything potentially relevant* without a predefined schema. As a software engineer, you know this is impossible. You build APIs. You define interfaces. You say, "I am not responsible for what happens outside this boundary."

  The philosophers look at that boundary and ask: *"Who drew the line? And what if the bomb is on the other side of it?"*

  Your vocabulary doesn't have a term for that because in your trade, if the bomb is outside the boundary, **it is not your bug.** In AGI, if the bomb explodes, **it is your fault.** That is the unbridgeable gap.
