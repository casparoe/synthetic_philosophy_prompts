answer: |-
  Here is a complete package for your seminar quiz. It is designed to bypass terminology and force students to confront their intuitions about specific speech acts, belief states, and domains.

  ### Instructor's Guide: The Aesthetic Testimony Intuition Pump

  **How to run this:**
  1.  Have students answer **Yes** or **No** to the bolded question in each scenario.
  2.  Collect the answers anonymously (or have them tally their own).
  3.  Use the **Profile Matcher** below to sort the class into philosophical camps.
  4.  Use the **Glitch Report** to highlight inconsistent or undefended positions during discussion.

  ---

  ### The Quiz: "Do You Know, or Did You Hear?"

  **1. The Dinner Party Assertion (Film)**
  A close friend whose taste in cinema aligns perfectly with yours watches a new film. They tell you, "That was a masterful piece of direction; truly great." You have not seen the film and will not see it. At a dinner party later that week, someone asks for movie recommendations.
  **Can you legitimately assert, "That film is a masterpiece"?**
  [ ] Yes [ ] No

  **2. The Critic's Vocabulary (Wine)**
  A wine critic you trust describes a specific vintage as having an "elegant finish." You read the review but do not taste the wine.
  **Do you now *know* that the wine is elegant, in the same way you know Paris is in France?**
  [ ] Yes [ ] No

  **3. The Destroyed Canvas (Visual Art)**
  You read a detailed, verified historical account of a painting that was destroyed in a fire. The account describes the composition and color in detail, concluding the work was "sublime." You will never see the image.
  **Can you form a *justified belief* that the painting was sublime?**
  [ ] Yes [ ] No

  **4. The Time Capsule (Music)**
  You loved a band as a teenager but have no memory of their music now. You read your old diary where you wrote, "This album is aesthetically perfect." You have no access to the music today.
  **Based *only* on your past self's testimony, do you know the music was good?**
  [ ] Yes [ ] No

  **5. The Proof (Mathematics)**
  A mathematician you respect tells you a complex proof is "beautiful" because of its symmetry and economy. You understand the logic but cannot grasp the whole structure at once.
  **Is your belief that the proof is 'beautiful' on the same epistemic footing as your belief that the proof is 'valid'?**
  [ ] Yes [ ] No

  **6. The Sunset Description (Nature)**
  A friend describes a sunset over the ocean in vivid detail, saying it was "breathtaking." You trust them.
  **Based *only* on their description, can you genuinely *appreciate* the aesthetic value of the sunset?**
  [ ] Yes [ ] No

  **7. The Blueprint (Architecture)**
  An architect tells you a building is "graceful." You see the blueprints (technical specs) but not the building itself.
  **Based on the testimony, would you be willing to *bet money* that most people will find the building graceful?**
  [ ] Yes [ ] No

  **8. The Prose Style (Literature)**
  A critic says a novel's *prose style* is "lush and rhythmic." You read only a plot summary, not the sentences themselves.
  **Do you know that the *prose* is lush, or only that the *story* is good?**
  [ ] I know the prose is lush. [ ] I only know the story is good.

  **9. The Recommendation (Action)**
  In Scenario 1 (The Film), your friend says it is masterful.
  **Based *only* on that testimony, is it rational to buy a ticket and see it?**
  [ ] Yes [ ] No

  ---

  ### The Scoring Key: Profile Matcher

  Do not ask students to calculate this themselves. Use their answer patterns to assign them a position.

  #### 1. The Optimist (The "Testimony is Testimony" View)
  *   **Pattern:** Mostly **YES** across all domains (1-9).
  *   **Philosophy:** Aesthetic judgments are propositional claims like any other. If I trust you on history, I should trust you on beauty. There is no special "Acquaintance Principle."
  *   **Key Indicator:** Yes on Q1 (Assertion) and Q2 (Knowledge).

  #### 2. The Hard Pessimist (The "Acquaintance Principle" View)
  *   **Pattern:** Mostly **NO** across all domains (1-9).
  *   **Philosophy:** Aesthetic knowledge requires firsthand experience. Testimony can tell me *that* you like it, but it cannot transmit the aesthetic property itself. To claim knowledge without experience is a category error.
  *   **Key Indicator:** No on Q2 (Knowledge) and No on Q3 (Destroyed Painting).

  #### 3. The Moderate Pessimist (The "Norm of Assertion" View)
  *   **Pattern:** **YES** on Knowledge/Belief questions (Q2, Q3, Q5), but **NO** on Assertion questions (Q1).
  *   **Philosophy:** Testimony *can* give me true belief/knowledge (I know it's good), but it is socially or normatively inappropriate to *assert* it as my own judgment. I lack "understanding."
  *   **Key Indicator:** Yes on Q2 (I know it), No on Q1 (I can't say it).

  #### 4. The Domain Specificist (The "Cognitive vs. Sensory" View)
  *   **Pattern:** **YES** on Math/Logic (Q5) and perhaps Literature/Plot (Q8), but **NO** on Sensory domains (Wine Q2, Food, Nature Q6).
  *   **Philosophy:** Aesthetic properties in math are objective/structural and transmissible via testimony. Aesthetic properties in wine/food are subjective/sensory and require qualia.
  *   **Key Indicator:** Yes on Q5, No on Q2.

  #### 5. The "Possible Acquaintance" Purist
  *   **Pattern:** **YES** on Film (Q1) where you *could* see it, but **NO** on Destroyed Painting (Q3) where you *cannot*.
  *   **Philosophy:** Testimony is a placeholder. It is legitimate only if you have the *capacity* to verify it later. If verification is impossible (destroyed art), testimony fails to justify belief.
  *   **Key Indicator:** Yes on Q1, No on Q3.

  #### 6. The Pragmatist (The "Action" View)
  *   **Pattern:** **NO** on Knowledge/Assertion (Q1, Q2), but **YES** on Action/Betting (Q7, Q9).
  *   **Philosophy:** I don't *know* it's beautiful, and I won't *say* it is, but I trust the testimony enough to act on it (buy the ticket, bet the money). Epistemology and Action come apart.
  *   **Key Indicator:** No on Q2, Yes on Q9.

  ---

  ### The "Glitch" Report: Incoherent or Undefended Positions

  If a student's answers match these combinations, flag them during the seminar. These positions are logically tense or currently undefended in the literature.

  **GLITCH A: The Bullshitter**
  *   **Pattern:** **YES** on Assertion (Q1), but **NO** on Knowledge (Q2).
  *   **Why it's a glitch:** This violates the **Knowledge Norm of Assertion**. You are claiming you can legitimately *say* "It is a masterpiece" while admitting you don't *know* it is one.
  *   **Discussion Point:** Are you asserting the friend's view ("My friend says it's great") or your own ("It is great")? If the latter, how can you assert what you admit you don't know?

  **GLITCH B: The Self-Privilege Paradox**
  *   **Pattern:** **YES** on Past Self/Band (Q4), but **NO** on Friend/Film (Q1).
  *   **Why it's a glitch:** Why is your own past testimony (which you cannot verify, as you have no memory) more trustworthy than a trusted friend's current testimony?
  *   **Discussion Point:** Is this just nostalgia, or do you think first-person authority survives memory loss? If you trust your past self, why not a twin?

  **GLITCH C: The Style Blindspot**
  *   **Pattern:** **YES** on Plot/Story (Q8), but **NO** on Prose Style (Q8).
  *   **Why it's a glitch:** This suggests you think aesthetic properties of *content* are transmissible, but aesthetic properties of *form* are not.
  *   **Discussion Point:** This is actually a defensible position (Formalism), but check if they are consistent. If they say No to Wine (Sensory) but Yes to Plot (Conceptual), they are treating Literature like Math. If they say No to both, they are Hard Pessimists.

  **GLITCH D: The Knowledge-Action Gap**
  *   **Pattern:** **NO** on Belief (Q3), but **YES** on Betting/Action (Q7).
  *   **Why it's a glitch:** You are willing to wager money on a proposition you claim you cannot even justifiably *believe*.
  *   **Discussion Point:** This implies a radical split between theoretical and practical reason. Is it rational to bet on what you think is unknowable?

  ---

  ### Seminar Discussion Tips

  1.  **Start with the Math Case (Q5):** This is usually the wedge. If the class agrees Math beauty is transmissible but Wine beauty is not, you have proven that "Aesthetic Testimony" is not a unified problem. It breaks down into **Cognitive Aesthetics** vs. **Sensory Aesthetics**.
  2.  **Press the Moderates (Q1 vs Q2):** If you have many Moderate Pessimists, ask them: "What is the cash value of knowing something is beautiful if you cannot say it is?" If knowledge doesn't license assertion, what work is the knowledge doing?
  3.  **The Destroyed Painting (Q3):** This is the strongest test for the Acquaintance Principle. If they say "No" here, ask: "Has the value of the painting been lost to the world if no one living can see it, even if we have perfect testimony?"
  4.  **Expose the Domain Bias:** Tally the "Yes" votes for Math (Q5) vs. Wine (Q2) on the board. If there is a significant gap, ask the students to justify why *elegance* in a proof is different from *elegance* in a finish. Is one objective and the other subjective?

  ### Why This Works
  This quiz avoids asking "Are you a pessimist?" which invites students to parrot readings. Instead, it forces them to commit to **speech acts** (Can I say it?), **epistemic states** (Do I know it?), and **practical stakes** (Will I bet on it?). The "Glitch" section ensures that when inconsistencies arise, they become fodder for philosophical analysis rather than simple errors.
