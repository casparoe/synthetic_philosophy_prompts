              *   Threshold: 1 in a million. Reasonable skepticism.
              *   Probability: 1 in 10 million. Recognizably mugging (very low credence).
              *   Cost: \$10,000. Non-trivial.
              *   Divergence: Clear.

  4.  **Addressing the "Defense of the Capped Agent":**
      *   Why isn't the Capped Agent irrational?
      *   Because within their framework, the bet *is* positive EV. The cap doesn't make the reward zero; it makes it finite. If $p \times \text{Cap} > \text{Cost}$, it's a good bet.
      *   The "Mugging" intuition relies on the idea that $p$ is *so* small that no finite reward justifies it. But if the reward is *maximally* finite (the Cap), and $p$ isn't *that* small relative to the Cost/Cap ratio, it's just a high-variance lottery ticket, not a mugging.
      *   The defender argues: "I am not being mugged; I am buying a lottery ticket with a positive expected return, where the jackpot is 'Save Everyone'."

  5.  **Addressing the "Real Money/Real Credences" Constraint:**
      *   The prompt asks specifically about this at the end.
