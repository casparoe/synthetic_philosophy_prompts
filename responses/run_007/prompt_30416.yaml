          *   Condition to refuse: $p < \epsilon$.
      *   *The Divergence:* We need a scenario where $p \cdot K > U(C)$ (Capped pays) AND $p < \epsilon$ (Threshold refuses).
      *   *Combining inequalities:* $U(C) / K < p < \epsilon$.
      *   *Constraint Check:*
          *   $p$ must be small (Mugging).
