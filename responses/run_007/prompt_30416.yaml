          *   Better to use "QALYs" or "Happy Lives" for the Reward, and Money for the Cost.
          *   Let's stick to a unified utility scale for simplicity, or explicitly map money to utils. Let's assume linear money utility up to the cap for the individual's wealth context (e.g., they are an effective altruist organization).
