          *   *Key Insight:* For the Capped Agent to pay, the "capped utility" of the reward multiplied by probability must exceed the utility of the cost. Since the reward is capped at $K$, the maximum expected utility gain is $p \cdot K$.
          *   For the Threshold Agent to refuse, $p$ must be less than $\epsilon$.
          *   So we need $p \cdot K > U(C)$ while $p < \epsilon$.
