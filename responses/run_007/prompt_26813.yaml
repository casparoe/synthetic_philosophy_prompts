answer: |-
  You're right that our first-generation targets were too static. We learned that lesson the hard way. But don't romanticize the alternative. Before metrics, "performance" was often just whoever had the loudest voice or the best connections. That's gaming too, just without the data to prove it. Unstructured discretion isn't neutral; it's biased and opaque.

  The issue isn't measurement itself; it's static measurement. If I know wait times are the only metric, I'll triage differently. But if I rotate wait times, readmission rates, and patient satisfaction surveys—and audit a random sample of charts against them—the cost of gaming spikes. You can't audit a principal's "feeling" about a teacher or a chief of surgery's reputation. You can audit a metric suite. We iterate because the alternative isn't purity; it's nepotism and bias disguised as professionalism. We need legible standards to correct course, even if those standards require constant calibration.

