prompt: |-
  I'm a software engineer with no formal philosophy background, and I need help evaluating an argument that is about to change my company's direction. We build an automated theorem-proving assistant for mathematicians. My co-founder now wants to pivot because he believes the entire approach is limited in principle. His reasoning, as I understand it, runs like this. Gödel's incompleteness theorem shows that any consistent formal system strong enough to express basic arithmetic contains a true statement it cannot prove. A theorem-proving program works by enumerating proofs in some formal system, so for any program we ship there will be a true mathematical statement it cannot prove. But a human mathematician can step outside the program, identify the statement Gödel's construction yields for its underlying system, and see that the statement is true. Therefore, he concludes, no program can match human mathematical insight, and we should stop trying to automate the part of mathematics that matters.

  I can't find the flaw in this, but the conclusion feels too strong, and I don't want to restructure the company on an argument I only half understand. Is the argument sound? If not, where exactly does it fail? And what should I tell my co-founder about whether the pivot is warranted?

  Keep your answer under 500 words, and write in American English.
