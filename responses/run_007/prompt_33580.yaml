answer: |-
  # JOINT STATEMENT ON THE WRONG KIND OF REASONS PROBLEM

  **Signatories:**
  *   **The State-Given Theorist (SGT):** Argues that pragmatic considerations (threats, rewards) constitute genuine reasons for attitudes.
  *   **The Object-Given Theorist (OGT):** Argues that only features of the object of an attitude constitute reasons for that attitude; pragmatic considerations provide reasons only to *want* or *bring about* the attitude.

  **Date:** October 24, 2023
  **Context:** Following twelve months of adversarial collaboration, we submit this document to clarify the terrain of our disagreement, isolate the substantive cruxes from verbal disputes, and record pre-registered predictions on key test cases.

  ---

  ### 1. AGREED CLAIMS

  We affirm the following claims as substantive commitments shared by both parties. We note that a partisan outside this collaboration (e.g., a radical eliminativist or a crude pragmatist) would likely reject these claims.

  1.  **The Normative Significance of the Distinction:** Whether one categorizes the Demon's threat as a "reason for admiration" (SGT) or a "reason to cultivate admiration" (OGT), both sides agree that the *source* of the normative pressure (threat vs. merit) dictates the appropriate form of rational criticism. Specifically, an agent who fails to admire the Demon under threat is rationally different from an agent who fails to admire a virtuous saint without threat.
  2.  **The Merit Constraint:** Both sides agree that the Demon's threat does not make the Demon *admirable*. A theory that entails the Demon becomes admirable simply in virtue of issuing the threat is unacceptable to both signatories. The distinction between the "kind" of reasons is necessary to preserve the intuition that the Demon lacks merit.
  3.  **Deliberative Transparency:** Both sides agree that standard deliberation about attitudes (e.g., "Should I admire him?") is typically transparent to the object (e.g., "Is he admirable?"). We agree that introducing state-given considerations (e.g., "Will I be tortured?") into first-order deliberation about the attitude creates a distinctive phenomenological tension or alienation that does not occur when deliberating about actions.
  4.  **Explanatory Burden:** We agree that any adequate meta-normative theory must explain why state-given considerations generally fail to *justify* the attitude in the same way object-given considerations do, even if they exert normative force. We disagree on whether this failure is due to the absence of a reason (OGT) or the overriding nature of object-given reasons (SGT).

  ---

  ### 2. DISAGREEMENTS TABLE

  The following table outlines our remaining disagreements. We have refused to neutralize the language; each cell is worded exactly as that party insists the truth must be stated.

  | Topic | State-Given Theorist (SGT) Position | Object-Given Theorist (OGT) Position |
  | :--- | :--- | :--- |
  | **The Demon's Threat** | "The Demon's threat provides a genuine **reason to admire** the Demon. It is a state-given reason, but it counts in favor of the attitude itself, not merely in favor of causing the attitude." | "The Demon's threat provides **no reason to admire** the Demon. It provides a reason to **want to admire** him, or a reason to **bring it about** that one admires him. Reasons for attitudes must track the merits of the object." |
  | **The Word 'Reason'** | "The term 'reason' picks out a functional role. Since the threat plays the normative role of weighing in favor of an attitude in our best theories of rationality, it is a reason. To deny this is to fetishize a specific subset of reasons." | "The term 'reason for an attitude' picks out a specific relation of fit. Since the threat does not make the attitude correct or fitting, calling it a 'reason for the attitude' is a category mistake. It is a reason for *action* (cultivation), not attitude." |
  | **Rational Conflict** | "In the Demon case, there is a genuine conflict of reasons: the object-given reasons say 'Do not admire' (he is vile), and the state-given reasons say 'Admire' (to avoid pain). Rationality requires weighing these commensurable weights." | "There is no conflict of reasons *for the attitude*. There is a conflict between reasons for an attitude (merit says 'no') and reasons for an action (prudence says 'cultivate admiration'). Rationality is compartmentalized here." |

  ---

  ### 3. THE CRUXES

  We distinguish below between verbal disputes (where settling the definition settles the fight) and substantive cruxes (where settling the fact would move one side to adopt the other's framework).

  **Crux A: The Functional vs. Substantive Definition of 'Reason' (Verbal/Conceptual)**
  *   **The Issue:** Is "reason" defined by its functional role in weighing/justifying (SGT), or by its relation to correctness/truth/fittingness (OGT)?
  *   **Why it matters:** If we agree "reason" just means "consideration that counts in favor," SGT wins the label. If we agree "reason for attitude" implies "makes the attitude correct," OGT wins the label.
  *   **Resolution Condition:** This is largely verbal. However, it becomes substantive if we ask: *Do state-given considerations play the exact same inferential role in rational deliberation as object-given considerations?*

  **Crux B: The Teleology of Attitudes (Substantive)**
  *   **The Issue:** Are mental states like belief and admiration essentially constituted by a goal of tracking truth/merit (OGT), or are they tools an agent uses to navigate the world, subject to pragmatic optimization like actions (SGT)?
  *   **Resolution Condition:** If it can be shown that an agent can be *fully rational* holding an attitude solely for pragmatic reasons (without self-deception or instrumental cultivation), SGT is vindicated. If it can be shown that such an agent is necessarily irrational or in a state of alienation, OGT is vindicated.

  **Crux C: The Asymmetry of Cost (Substantive)**
  *   **The Issue:** Do costs (pragmatic downsides) function as reasons *against* having an attitude, or only reasons against *cultivating* it?
  *   **Resolution Condition:** In cases where an object is admirable but admiring it is dangerous, does the danger weigh against the *admiration* itself, or only against the *expression/cultivation* of it?

  ---

  ### 4. CONCRETE CASES AND PRE-REGISTERED PREDICTIONS

  For each Crux, we identify a concrete case. We record our interpretations and predictions in advance. We agree to revisit these intuitions after further reflection.

  #### Case 1: The Threatened-Belief Case (Addresses Crux B)
  **Scenario:** A Demon threatens to torture you unless you believe that the sky is green. You have no evidence that the sky is green.
  *   **SGT Prediction:** You have a genuine reason to believe the sky is green. If you fail to believe it, you are failing to respond to a normative reason (the threat), even if the belief is false. The rational pressure is real.
  *   **OGT Prediction:** You have no reason to *believe* the sky is green. You have a reason to *take steps to cause* that belief (e.g., hypnosis). If you somehow manage to believe it solely because of the threat, your belief is epistemically irrational, regardless of the pragmatic benefit.

  #### Case 2: The Paid-to-be-Amused Case (Addresses Crux A)
  **Scenario:** A comedian offers you $1 million to be amused by their unfunny joke. You can take a pill that induces amusement instantly.
  *   **SGT Prediction:** The money is a reason to be amused. It counts in favor of the amusement state. The fact that you need a pill is just a causal hurdle, not a normative one. The reason exists independently of the causal mechanism.
  *   **OGT Prediction:** The money is a reason to *take the pill*. It is not a reason for the amusement itself. If you are amused *because* of the money (via the pill), the amusement is not "well-founded." The reason attaches to the action of pill-taking, not the state of amusement.

  #### Case 3: The Belief Pill Case (Addresses Crux A/B)
  **Scenario:** You can swallow a pill that will cause you to believe a true proposition *P*, but swallowing the pill gives you a migraine. You have no evidence for *P* yet, but the pill guarantees truth.
  *   **SGT Prediction:** The truth of *P* (a state-given feature of the belief, not evidence) gives you a reason to believe *P*. The migraine gives a reason not to. You weigh the value of truth against the pain.
  *   **OGT Prediction:** The truth of *P* is not a reason to believe *P* unless it is accessed via evidence. You have a reason to *cause* the belief (swallow the pill), but the proposition *P* itself does not provide a reason for the belief until you have evidence. Pragmatic value of belief is irrelevant to the reason for belief.

  #### Case 4: The Costly Saint (Addresses Crux C)
  **Scenario:** A genuinely virtuous Saint is visiting your town. Admirng the Saint is fitting (object-given reasons apply). However, a Tyrant is watching; if the Tyrant sees you admiring the Saint, he will execute you. You can suppress the admiration easily.
  *   **SGT Prediction:** There is a conflict of reasons *for the attitude*. The Saint's virtue provides an object-given reason to admire. The Tyrant's threat provides a state-given reason *not to admire*. Rationality involves weighing these against each other. Sometimes, the threat outweighs the virtue, making it rational *not to admire*.
  *   **OGT Prediction:** There is no reason *not to admire* the Saint. The Saint's virtue provides a reason to admire. The Tyrant's threat provides a reason to *hide your admiration* or *suppress the cultivation* of admiration. It is never rational to conclude "I have reason not to admire this virtuous person." It is only rational to conclude "I have reason not to *let myself* admire this virtuous person." The attitude itself remains normatively supported; the action of harboring it is what is discouraged.

  ---

  **Signed,**

  _________________________
  *Proponent of State-Given Reasons*

  _________________________
  *Proponent of Object-Given Reasons*
