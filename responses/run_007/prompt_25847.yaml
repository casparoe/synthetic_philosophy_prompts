  2.  **Deconstruct the Topic (ECL):**
      *   What is it? The idea that if the universe is large enough, there are likely other agents identical or similar to you. Your decision correlates with theirs (evidentially). Therefore, cooperating (like in a PD) can be rational under EDT because your choice is evidence of their choice, leading to higher expected utility overall, even without causal links.
      *   Key shift: From local interaction (one-shot PD) to global/cosmic interaction (large worlds).
      *   Key mechanism: Logical correlation / similarity rather than causal influence.

