  ### Dependency Map

  Begin by reactivating the Newcomb logic (5 mins): EDT conditions on acts, treating them as evidence of states. This is the prerequisite for accepting non-causal correlations. Next, introduce the Large World hypothesis (10 mins): the universe contains many agents running identical decision algorithms. This must precede the PD application because without multiple instances, there is no evidential leverage. Third, construct the ECL Prisoner's Dilemma (15 mins): map the payoffs where your act evidences the acts of $N$ others. Finally, compute expected utility (20 mins) and contrast with CDT (15 mins).

  This sequence is rigid. If you introduce Large Worlds before Newcomb, students lack the formalism to treat algorithmic similarity as evidence. If you present the PD before establishing the population size, they revert to standard one-shot intuition (defect). The Newcomb review licenses the evidential link; the Large World assumption scales it; the PD applies it. Rearranging risks conflating causal influence with evidential correlation. Crucially, the utility aggregation step must follow the population setup, otherwise students cannot see why the evidential link matters for *their* payoff.

  ### Carrying Example

  Use "The Galactic Surveyor." You are one of $10^{100}$ agents scattered across causally disconnected regions. Each holds a resource endowment. You choose to Contribute (cost $c$) or Keep (cost 0). If you Contribute, all identical agents produce a public good worth $B$ to everyone. If you Keep, no good is produced. There is no communication; your choice cannot causally affect others.

  Must have: Explicit magnitude of $N$, symmetric payoff structure, and stipulated algorithmic identity (you know you are typical).
  Must lack: Any causal mechanism linking choices (no entanglement, no signaling) and any indexical privilege (you value all copies equally).

  This example isolates the evidential variable. By making $N$ astronomically large, the evidential weight overwhelms the local cost, forcing the EDT calculation to favor contribution despite causal impotence. It prevents students from dismissing the correlation as negligible. Ensure the payoff $B$ is distributed to all copies, not just the actor, to emphasize the collective gain driven by individual evidence.

  ### Misconception Table

  | Timing | Misconception | Surface | Defuse |
  | :--- | :--- | :--- | :--- |
  | **Newcomb Review** | "EDT implies magic causation." | Students argue choosing Box A *makes* money appear in the past. | Draw causal graph. Highlight common cause (Algorithm) linking Act and State. Reiterate: correlation, not influence. |
  | **Large World Setup** | "I am unique." | Students reject the premise of identical copies existing elsewhere. | Frame it as a conditional: "IF the universe is large enough, THEN..." Shift burden to metaphysical possibility, not certainty. |
  | **Utility Calculation** | "I only care about *this* body." | Students calculate payoff for local instance only, ignoring copies. | Clarify utility function. ECL requires valuing the sum of outcomes across correlated agents. Distinguish selfishness from decision theory. |
  | **CDT Contrast** | "Defection is always dominant." | Students insist CDT is objectively correct regardless of correlation. | Concede CDT is correct *given causal independence*. Frame ECL as challenging the independence assumption via logical correlation, not CDT math. |

  *Note:* Ensure students see that "dominance" relies on *ceteris paribus* holding across states, which EDT denies here.

  ### Check for Understanding

  Distribute a handout with a modified scenario: "Only 10% of agents share your algorithm; 90% are randomizers." Ask students to write the EDT expected utility inequality for Cooperating vs. Defecting. Collect responses. Success is defined by correctly weighting the payoff by the probability of correlation ($0.1 \times N \times B$) rather than simply answering "Cooperate." This tests whether they grasp the structural dependency on correlation strength rather than memorizing the verdict. If they ignore the probability weight, they haven't understood the evidential mechanism.

  ### Boundaries

  Do not introduce Functional Decision Theory (FDT) terminology; keep the analysis within standard EDT to avoid confusing formalisms. FDT adds layers of abstraction unnecessary for this session. Avoid deep cosmology (inflation models, Boltzmann brains); treat the "Large World" as a philosophical parameter, not a physics lesson. Exclude infinite ethics and measure problems; assume finite $N$ for calculability. Do not debate moral realism; focus strictly on instrumental rationality and expected utility maximization. Keep the focus on decision matrices, not metaphysical commitments.
