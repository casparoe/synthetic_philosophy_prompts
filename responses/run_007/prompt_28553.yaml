prompt: |-
  Suppose a fair coin is tossed until it lands heads. If the first heads occurs on the nth toss, the player receives a payoff of (−1)^(n−1) · 2^n / n dollars — a reward when the sign is positive, a penalty when it is negative. The amounts grow without bound as n increases, and the sign alternates. When I compute the expected value in the obvious way, summing the probability of each outcome times its payoff in the natural order of n, I get a finite positive number (ln 2, about 0.69). But the positive terms alone sum to +∞ and the negative terms alone sum to −∞; the finite total is possible only because the two infinities cancel, and how much is left after the cancellation depends on the order in which I add the terms. By listing the very same outcomes in a different order, or by grouping them differently, I can make the expected value come out to any real number I like, or diverge to ±∞. The game itself hasn't changed, but the expected value seems to depend on how I write down the sum.

  I've also noticed that this causes trouble for comparisons. Take the same game and add one dollar to every payoff, so that in every possible outcome the modified game pays exactly one dollar more. The modified game seems strictly better — it is better in every outcome — yet on the usual expected-value test both games are equally without a well-defined expectation, so the theory seems unable to register the obvious improvement.

  I know about the St. Petersburg game and its infinite expectation, but this seems different. There the problem is that the expectation is infinite; here the arithmetic gives a finite answer under one ordering but no unique answer overall. Is there an established name for this configuration, or for the family of gambles like it? I'm not just after a label. I want to know exactly what the phenomenon is — whether it is best described as an undefined expectation, an order-dependent expectation, a failure of the principle that if one option is better in every outcome then it should be preferred, or something else — and how it differs from the St. Petersburg case and from ordinary cases of infinite expected value. What should a decision theorist say about whether the original game is worth playing, and about whether the modified game is better?
reasoning: |-
  Here's a thinking process that leads to the suggested answer:

  1.  **Analyze the User's Query:**
      *   **The Game:** A coin is tossed until heads appears (geometric distribution with $p=1/2$). Let $N$ be the toss number of the first heads. Payoff $X = (-1)^{N-1} \frac{2^N}{N}$.
      *   **The Calculation:** $E[X] = \sum_{n=1}^\infty P(N=n) \cdot X_n = \sum_{n=1}^\infty \frac{1}{2^n} \cdot (-1)^{n-1} \frac{2^n}{n} = \sum_{n=1}^\infty \frac{(-1)^{n-1}}{n}$.
      *   **The Series:** This is the alternating harmonic series, which converges conditionally to $\ln 2$.
      *   **The Problem:** The series is *conditionally convergent*. The positive terms sum to $+\infty$, negative terms to $-\infty$. By the Riemann Rearrangement Theorem, the sum can be made to equal any real number (or diverge) by rearranging terms.
      *   **The Comparison Issue:** Consider a modified game $Y = X + 1$. $Y > X$ in every outcome. However, $E[Y] = E[X] + E[1] = (\text{undefined/conditional}) + 1$. If $E[X]$ is undefined due to conditional convergence, $E[Y]$ is also undefined. Standard Expected Utility Theory (EUT) struggles here.
      *   **Comparison to St. Petersburg:** St. Petersburg has $E = \infty$ (diverges to infinity). This game has a "finite but unstable" expectation (conditional convergence).
      *   **Questions:** What is this called? How to describe the phenomenon? How does it differ from St. Petersburg? What should a decision theorist say?

  2.  **Identify the Core Mathematical Concept:**
      *   The series $\sum \frac{(-1)^{n-1}}{n}$ is the classic example of **conditional convergence**.
      *   In probability theory, expectation is defined via the Lebesgue integral.
      *   For a random variable $X$, $E[X]$ is defined as $E[X^+] - E[X^-]$, provided at least one is finite.
      *   If $E[X^+] = \infty$ and $E[X^-] = \infty$, the expectation is **undefined** (not just infinite).
      *   This is distinct from the St. Petersburg paradox where $E[X^+] = \infty$ and $E[X^-] = 0$ (so $E[X] = \infty$).

  3.  **Address the "Name" of the Phenomenon:**
      *   Mathematically: **Conditional Convergence** of the expectation series.
      *   Probabilistically: **Undefined Expectation** (due to $\infty - \infty$).
      *   Decision Theory context: Often discussed under **unbounded utility** or **infinite expected utility** literature, but specifically this is the **Pasadena Game** (or a variant thereof).
      *   *Self-Correction/Verification:* Is this exactly the Pasadena Game?
          *   Pasadena Game (Nover & Hájek, 2004): Payoff is $(-1)^{n-1} \frac{2^n}{n}$. Probability is $1/2^n$.
          *   Expected Value: $\sum \frac{1}{2^n} (-1)^{n-1} \frac{2^n}{n} = \sum \frac{(-1)^{n-1}}{n} = \ln 2$.
          *   Yes, this *is* the Pasadena Game.
      *   There is also the **Altadena Game** (Pasadena + 1), which relates to the user's second paragraph about adding $1.

  4.  **Analyze the Decision Theoretic Implications:**
      *   **Standard EUT:** Requires absolute convergence (integrability). If $\int |X| dP = \infty$, expectation is undefined. Here, $\sum |\frac{(-1)^{n-1}}{n}| = \sum \frac{1}{n} = \infty$. So $X$ is not integrable.
      *   **Dominance:** The modified game ($X+1$) dominates the original ($X$). Every outcome is better. Yet, if expectations are undefined, EUT cannot rank them via $E[U]$. This violates **Statewise Dominance**.
      *   **Rearrangement:** The value depends on the order of summation. In probability, the order is fixed by the sample space indexing, *but* the definition of the Lebesgue integral doesn't care about order *if* the integral exists. If it doesn't exist (conditional convergence), the "sum" isn't a valid expectation.
      *   **Comparison to St. Petersburg:**
          *   St. Petersburg: $E = \infty$. Well-defined in the extended reals.
          *   Pasadena: $E$ is undefined ($\infty - \infty$).
          *   St. Petersburg violates bounded utility but keeps dominance (usually). Pasadena violates dominance *if* you try to assign a value, or leaves you value-less if you don't.

  5.  **Synthesize the "What should a decision theorist say?" part:**
      *   **Orthodox View:** The expectation is undefined. You cannot use Expected Value to evaluate this game. You must use a different criterion (e.g., stochastic dominance, though even that gets tricky with infinite supports, or bounded utility functions).
      *   **The "Added Dollar" Paradox:** This highlights the failure of linearity of expectation when integrability fails. $E[X+1] \neq E[X] + 1$ if $E[X]$ is undefined.
      *   **Resolution:** Most theorists argue that rational agents must have bounded utility functions (avoiding this entirely) or that such games are physically impossible (finite bankrolls, finite time). If forced to choose, Dominance should rule (pick $X+1$), implying EUT is incomplete here.

