  3.  **Address the Specific Questions:**
      *   *What does it strictly presuppose?* It presupposes that output fidelity is a sufficient proxy for capability/safety. It doesn't *strictly* deny internal states exist, but it treats them as irrelevant to the optimization objective.
      *   *What does it fit well with?* Behaviorism, Functionalism, Pragmatism, Utilitarianism (maximize good outcomes).
      *   *Where is it underdetermined?* You can be a dualist, a materialist, or an illusionist and still do RLHF. The training loop is agnostic to ontology; it's an engineering constraint.
      *   *Is the position stable?* This is the crux. The user suspects "practice shapes theory." This is the *Performativity* argument (like Hacking or Foucault). If we treat AI as input-output machines, we stop looking for internal reasoning, which might make us blind to deceptive alignment (where output is good but intent is bad).
