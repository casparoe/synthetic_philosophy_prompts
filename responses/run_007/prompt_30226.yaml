      *Let's sharpen the "Ordinary" point.* The best argument against KNA is that it conflates *Knowledge* with *Rational Credibility*. If I can assert on rational credibility without knowledge, KNA is false. The "Ordinary" case is asserting on good evidence that falls short of knowledge (e.g., memory, induction).

