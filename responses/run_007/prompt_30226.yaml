      3.  **The Insulation Worry:** Excuses vs. Justifications.
      4.  **Experimental Data:** What the folk say.
      5.  **Verdict:** Is it dead or just bruised?

  9.  **Final Review against constraints:**
      *   *Philosopher persona?* Yes.
      *   *Quick layout of commitments?* Yes.
      *   *Rank defeaters?* Yes.
      *   *Address insulation?* Yes.
      *   *Flag ordinary assertions?* Yes (Tier 1).

