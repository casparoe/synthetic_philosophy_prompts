answer: |-
  This is a fantastic question. You have put your finger on the absolute core of Hobbes's philosophical project. It is easy to dismiss this as him just bragging ("I figured it out, so it must be science"), but it is actually a serious epistemological claim that drives his entire system.

  Here is an unpacking of what Hobbes is doing, why he thinks politics can be like geometry, and why this matters for the English Civil War context he was writing in.

  ### 1. What does "Demonstrable" mean for Hobbes?
  You asked if he means Euclidean certainty. **Yes, absolutely.**

  For Hobbes, "philosophy" is not about contemplating wisdom or ethics in a vague sense; it is about **causal reasoning**. To know something scientifically is to know its cause.
  *   **In Geometry:** We know the properties of a triangle because we *define* the triangle. We stipulate that it has three straight lines. Because we generated the definition, we know exactly what causes its properties.
  *   **In Natural Philosophy (Physics):** We see an effect (e.g., the sun rising, a stone falling), but we did not create the sun or the stone. We can hypothesize about their internal machinery, but we can never be 100% sure we are right, because God (or Nature) made them, not us. There could be a hidden mechanism we haven't guessed.
  *   **In Civil Philosophy:** Hobbes argues the Commonwealth is not a natural organism like a tree; it is an **artifact**. It is an "Artificial Man." Because human beings create it through a specific act (the Covenant/Contract), we have access to the "generative cause."

  So, when he says "demonstrable," he means **deductive certainty**. He believes you can start with definitions of human nature and the social contract, and deduce the necessary laws of sovereignty just as you deduce theorems from axioms.

  ### 2. How can Politics be like Geometry? (The "People aren't Lines" Problem)
  This is your strongest objection: *People are messy; lines are static.*

  Hobbes anticipates this. He is **not** doing empirical political science. He is not observing how people *actually* behave in history (that would be Natural Philosophy, which he admits is uncertain).

  Instead, he is doing **normative logic**.
  *   **The Analogy:** In geometry, you say, "If you define a circle this way, these properties *must* follow." You aren't looking at drawn circles in the sand (which are imperfect); you are looking at the concept.
  *   **The Application:** In politics, Hobbes says, "If you define a Commonwealth as a group of people who authorize a Sovereign to keep them safe, these powers *must* follow."

  He isn't studying the psychological quirks of King Charles I. He is studying the **logic of authorization**.
  *   *Premise 1:* Humans desire self-preservation above all.
  *   *Premise 2:* The State of Nature leads to war (because of competition, diffidence, and glory).
  *   *Premise 3:* To escape this, we must artificially construct a power to overawe us all.
  *   *Conclusion:* Therefore, the Sovereign must have absolute, indivisible power.

  For Hobbes, if you disagree with his conclusion, you aren't just offering a different opinion; you are making a **mathematical error**. You are like someone arguing that a triangle can have four sides. This is why he is so aggressive against his critics (like the mathematician John Wallis in the *Six Lessons*); he thinks they are literally denying demonstrable truth.

  ### 3. Why can't we know Natural Bodies?
  It isn't just theological ("God made them"). It is about **access to the blueprint**.

  Hobbes operates on a principle later associated with Giambattista Vico: *Verum esse ipsum factum* ("The true is the same as the made").
  *   **We know what we make:** If I build a watch, I know exactly how the gears interact. If it breaks, I can trace the error to my design.
  *   **We guess what we find:** If I find a watch in the woods, I can guess how it works. I might be right, but I can't be certain I haven't missed a hidden spring.

  Since God made the universe, only God has "Maker's Knowledge" of physics. Humans can only have "conjectural knowledge." But since *humans* make the Commonwealth, humans can have "Maker's Knowledge" of politics.

  This is a radical move. In the 17th century, Physics (Natural Philosophy) was becoming the gold standard for knowledge (thanks to Galileo, etc.). Hobbes is flipping the script. He is saying: **"Physics is actually the uncertain one. Politics is the true science."**

  ### 4. Is this real philosophy or just rhetoric?
  It is **both**, and that is the genius of it.

  **As Philosophy:**
  It is a coherent epistemological stance. It distinguishes between *a priori* knowledge (knowledge from the cause/definition) and *a posteriori* knowledge (knowledge from effects/observation). Hobbes argues Civil Science is the only *a priori* science available to humans.

  **As Rhetoric/Politics:**
  This is where it gets dangerous (and why you should pay attention). Hobbes was writing during the **English Civil War**. People were killing each other over religion, the rights of Parliament, and the King's authority.
  *   If politics is just a matter of opinion or tradition, then the Royalists and Parliamentarians are just disagreeing, and war is inevitable.
  *   If politics is **demonstrable science**, then one side is **right** and the other is **wrong**, just like in math.

  By claiming politics is demonstrable, Hobbes is trying to **depoliticize politics**. He wants to say: "Stop fighting. I have calculated the solution. The Sovereign must have absolute power. To deny this is irrational."

  ### Summary: What to take away for your class
  1.  **Maker's Knowledge:** We know things perfectly only if we construct them. We construct Geometry (definitions) and Commonwealths (contracts). We do not construct Nature.
  2.  **Certainty:** Hobbes isn't using "demonstrable" loosely. He claims political conclusions are as certain as $2+2=4$, provided you accept his definitions of human nature and the social contract.
  3.  **The Goal:** He wants to turn political disagreement into mathematical error. If he succeeds, rebellion isn't just a crime; it's a form of insanity or ignorance.

  So, when you read that passage, don't see it as an analogy. See it as Hobbes's **job application**. He is telling the Professors of Mathematics: "You guys deal with imaginary lines. I deal with the Artificial Man, which is just as real, and my science is more important because it keeps us from killing each other."

  It is a bold, ambitious, and terrifying claim that defines modern political rationalism.
