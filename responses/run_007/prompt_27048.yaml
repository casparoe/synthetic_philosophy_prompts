  2. It's intellectually dishonest to bound utility to dissolve St. Petersburg while leaving the door open for infinite utility in Pascal's Wager scenarios. You can't selectively apply constraints just because one conclusion feels absurd and the other feels spiritual.

  3. Expected utility theory assumes rational agents must be linearly sensitive to probability, but risk-weighted models demonstrate that ignoring extreme tails is a coherent preference structure. Treating a one-in-a-billion chance of infinity as equivalent to a guaranteed small gain isn't rationality; it's just a specific, debatable risk profile.

  4. The paradox shows that standard axioms can force preferences that no actual agent would hold, suggesting the math itself is broken. Declaring utility bounded ignores the fact that the underlying machinery generating the contradiction remains logically unsound.

  5. When a theory requires ad hoc constraints to avoid absurd conclusions, the scientific response is to look for a better theory, not to defend the constraints as fundamental truths. Treating St. Petersburg as "solved" protects orthodoxy rather than advancing our understanding of rational choice under extreme uncertainty.
