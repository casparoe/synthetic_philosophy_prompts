prompt: |-
  I'm a novelist, not a philosopher, and the thing I actually know cold is narrative craft: point of view, focalization, free indirect discourse, unreliable narrators, character motivation, backstory, that whole toolbox. Lately I've been trying to think through the distinction people draw between epistemic bubbles and echo chambers — the idea that a bubble is about what information you happen to be exposed to, while an echo chamber is about who you've been trained to trust and distrust. I keep feeling like there's a version of this distinction already living in how I build a character's inner life and a novel's narrative situation, but I can't tell if I'm just pattern-matching.

  So here's what I want. Restate the bubble/echo chamber distinction in the vocabulary I actually use as a novelist — point of view and focalization, free indirect style, unreliable narration, the difference between what a scene shows a character and what the narrator lets the reader know, and so on — as faithfully as you can. Then give me the residue report: wich parts translate cleanly into narrative terms, which parts you had to fudge or stretch to fit, and which parts have no counterpart at all in how I think about narrative. I'd rather you keep the translation honest than flattering to me. And please keep separate what's settled about the distinction from what's genuinely contested among people who work on it; dont present one camp's reading as the consensus. Format it as exactly five numbered points, each a sentence or two, no intro or conclusion. If it helps, I'm less interested in whether my vocabulary can mimic the distinction than in whether the places it can't are pointing at something real I'm missing, or at something the philosophers have been a bit vague about.
