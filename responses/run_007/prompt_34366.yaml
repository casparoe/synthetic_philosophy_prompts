answer: |-
  # Activity: The Envelope Protocol

  **Time:** 75 Minutes (30 min Game, 45 min Debrief)
  **Class Size:** 15 Students
  **Goal:** Generate pre-theoretical tension between "fair coin" (1/2) and "selected observer" (1/3) intuitions without naming the Sleeping Beauty problem.

  ## 1. Materials List
  *   **150 Envelopes:** (10 rounds × 15 students). Small manila or white #10 envelopes work fine.
  *   **Index Cards or Slips:** 2 per student per round (one for the "Status" inside the envelope, one for the "Bet" to be submitted).
  *   **1 Coin:** Large enough to be seen during the public demo.
  *   **A "Ballot Box":** A shoebox or bag to collect bets anonymously.
  *   **Whiteboard:** To track cumulative scores.
  *   **Prize:** Something trivial but coveted (e.g., "First pick of next week's reading list" or "Choose the break music").

  ## 2. Setup & Rules (No Lecture)

  **Phase 1: The Public Calibration (5 Minutes)**
  1.  Tell the class: "We are playing a betting game. Points determine the winner."
  2.  Flip the coin visibly.
  3.  Ask everyone to write **H** or **T** on a slip and hold it up.
  4.  Reveal the coin. Award 1 point to correct guesses.
  5.  **Say:** "Everyone agrees the coin is fair. P(Heads) = 1/2. Keep that intuition."

  **Phase 2: The Private Protocol (25 Minutes)**
  1.  **Distribution:** Hand every student an **sealed envelope** for Round 1. (Pre-prepared: For each round, flip a coin. If Heads, put 1 "CALLED" slip and 14 "PASS" slips into 15 envelopes. If Tails, put 2 "CALLED" slips and 13 "PASS" slips into 15 envelopes. Shuffle and distribute).
  2.  **The Pre-Update:** Before opening, ask students to write on the *outside* of the envelope: *"My Credence that the Coin is Heads."* (Collect a few verbal answers; expect "1/2").
  3.  **The Reveal:** Students open envelopes silently.
      *   **If "PASS":** You are an observer this round. Write "N/A" on your bet slip.
      *   **If "CALLED":** You are a participant. You have been "woken up."
  4.  **The Bet:**
      *   **Crucial Rule:** You must not reveal your status. Do not stand up. Do not look around to see who is writing.
      *   **Called Students:** Write **H** or **T** on your bet slip. This bet counts for points.
      *   **Pass Students:** Write "N/A" on your bet slip. This bet is void, but you *must* submit it to the box to maintain secrecy for the Called students.
  5.  **Scoring:**
      *   Collect all slips in the Box.
      *   Reveal the Coin Result for the round.
      *   **Payoff:** If you are **Called** and correct: **+10 Points**. If **Called** and incorrect: **-10 Points**. (Pass students get 0).
      *   Tally scores on the board.
  6.  **Repeat:** Run **10 Rounds**. (This ensures almost every student is "Called" at least once, experiencing the shift from Observer to Participant).

  ## 3. The Payoff Scheme (Why Tails Wins)
  *   **Coin:** Fair (50/50).
  *   **Heads Round:** 1 student is Called. Max points distributed = 10.
  *   **Tails Round:** 2 students are Called. Max points distributed = 20.
  *   **The Pull:** Over 10 rounds, there will be roughly 15 "Called" instances. ~5 will be Heads, ~10 will be Tails.
  *   **The Experience:** A student who is "Called" and bets **Heads** (because "the coin is fair") will statistically lose points. A student who bets **Tails** (because "I'm in the room") will gain points.

  ## 4. The Debrief (Mapping the Intuition)

  **Step 1: The Data Reveal (5 mins)**
  *   Ask: "How many of you, when you were **Called**, bet Heads?" (Likely a few).
  *   Ask: "How many bet Tails?" (Likely most).
  *   Ask the Heads-bettors: "Why?" (Answer: "The coin is fair.")
  *   Ask the Tails-bettors: "Why?" (Answer: "Tails puts more people in the room. I'm more likely to be one of them.")
  *   Reveal the actual score: The Tails-betters likely have higher scores.

  **Step 2: Conditionalization (15 mins)**
  *   Draw two trees on the board.
  *   **Tree A (The Observer):** Branches to Heads (0.5) and Tails (0.5).
      *   *Question:* "Before opening the envelope, what is P(Heads)?"
      *   *Answer:* 1/2. (This matches their pre-update writing).
  *   **Tree B (The Participant):** Add the "Called" node.
      *   Heads → 1/15 chance of being Called.
      *   Tails → 2/15 chance of being Called.
      *   *Question:* "You open the envelope. You are Called. What is P(Heads | Called)?"
      *   *Calculation:* $\frac{0.5 \times (1/15)}{0.5 \times (1/15) + 0.5 \times (2/15)} = \frac{1}{3}$.
  *   **The Lesson:** The conflict wasn't about the coin. It was about *what you conditionalized on*.
      *   **Halfers** conditionalized on: "The coin was flipped."
      *   **Thirders** conditionalized on: "I am having an experience right now."

  **Step 3: Predictable Failures & Fixes (10 mins)**
  *   **The "Counting" Problem:** Students might try to count how many slips are in the box or look at who is writing.
      *   *Fix:* Emphasize that "Pass" students *must* submit blank slips. If only Called students submit, the volume of paper signals the coin state.
  *   **The "Signaling" Problem:** A Called student smiles or looks up.
      *   *Fix:* Enforce "Exam Conditions." Heads down.
  *   **The Frequency Blur:** Students will argue, "But the coin landed Heads 5 times out of 10!" (Per-Round frequency).
      *   *Response:* "Yes. But you weren't asked 'What is the coin?' You were asked 'You are a Called student; what is the coin?' That is a Per-Calling frequency."
  *   **The "First Call" Problem:** In Tails rounds, does the first person called know something the second doesn't?
      *   *Response:* In this setup, no. Both are drawn from the same pool simultaneously. (Note: This differs from the original SB problem where time distinguishes Mon/Tue).

  **Step 4: The Analogy Gap (10 mins)**
  *   **Be Honest:** "This is not exactly Sleeping Beauty."
  *   **The Difference:** In SB, it is the *same* person woken twice with memory loss. Here, it is *different* people woken once.
  *   **Does it matter?**
      *   For **Thirders (SIA/SSA):** No. The logic of sampling observers holds regardless of identity. You are a random sample from the set of "wakeings."
      *   For **Halfers:** Yes. Some argue self-locating belief requires *personal* identity continuity. If you are a different person, maybe you don't inherit the "amnesia" constraint.
      *   **The Takeaway:** The game forces the Thirder intuition via betting pressure. The philosophy seminar begins when we ask if that pressure is legitimate or a trick of the sampling method.

  **Step 5: Naming the Beast (5 mins)**
  *   Reveal: "This is the **Sleeping Beauty Problem**."
  *   Assign the reading: "For next week, read Elga (2000). He argues for the 1/3 answer you just empirically discovered. Lewis (2001) argues for the 1/2 answer you felt in your gut during Round 1. Come ready to defend your bet."

  ## 5. Instructor Notes: What Can Go Wrong

  1.  **Small Sample Size:** In 10 rounds, you might get 6 Heads and 4 Tails by chance. The "Tails bets win more" empirical proof might fail.
      *   *Handle:* Acknowledge the variance. "The *structure* of the payoff favors Tails, even if this specific run didn't. If we ran this 1,000 times, the Tails strategy dominates."
  2.  **The "Pass" Resentment:** Students who get "Pass" 10 times feel left out.
      *   *Handle:* Remind them their "N/A" slips were vital to hide the Called students' identities. They were the "control group."
  3.  **Confusion on "Called":** Students might think "Called" means they have to stand up.
      *   *Handle:* Be explicit: "Called means you are eligible to score. Stay seated."
  4.  **The "Fair Coin" Defense:** A stubborn Halfer will say, "I know the coin is 1/2, so I bet Heads, even if I lose points."
      *   *Handle:* This is the perfect philosophical opening. "So you are willing to lose points to maintain a definition of credence? That is exactly the Halfer position. We will unpack why next week."

  ## 6. Why This Works
  You have engineered a situation where **Epistemic Rationality** (believing the coin is fair) conflicts with **Instrumental Rationality** (betting to win points). By separating the "Observer" phase (Public Flip) from the "Participant" phase (Envelope), you force the same student to inhabit both perspectives. They cannot dismiss the 1/3 intuition as "someone else's error" because *they* lost points holding the 1/2 view. The friction is now personal, not just theoretical.
