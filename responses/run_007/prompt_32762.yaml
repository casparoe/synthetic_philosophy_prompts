      *   **Topic:** Langdon Winner's essay "Do Artifacts Have Politics?"
      *   **Core Confusion:** The user distinguishes between two types of examples Winner uses:
          1.  *Long Island Bridges (Robert Moses):* Politics via *intention* (design excludes buses/poor people). The user argues this is just "people having politics," not the artifact itself.
          2.  *Nuclear Reactors:* Politics via *inherent technical requirements* (requires authoritarian control). The user notes this is the stronger thesis but is empirically disputed.
