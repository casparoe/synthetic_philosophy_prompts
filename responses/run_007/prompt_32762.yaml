  i'm trying to get my head around winner's 'do artifacts have politics' and i keep tripping over the same thing. the long island bridges were deliberately built low to exclude certain people — that's politics by design, sure, but it's not the bridge itself that's political, it's the intention behind it. the nuclear reactor case is different: winner says the technology itself, regardless of anyone's intentions, requires authoritarian control. so my question is: if the first case is just about human intentions embedded in design, why call it 'artifacts having politics' at all? isn't that just 'people having politics and expressing it through artifacts'? the second case seems to be the real thesis — and even that one is disputed, since plenty of people say nuclear power can be managed democratically. so has winner actually shown that any artifact genuinely has politics, as opposed to just being used politically? and please write in british english.
