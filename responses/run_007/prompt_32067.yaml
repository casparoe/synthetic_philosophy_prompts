prompt: |-
  So I'm in this moral psychology seminar and we've been going back and forth on how you'd even tell apart a moral preference from a moral bias. The standard move is that a bias is something you'd disavow upon learning its causal origin — like, if you found out your anti-gay intuition came from growing up in a homophobic culture, you'd presumably drop it. But then there's this trickier class of cases where someone fully understands the debunking story and still wants to keep the intuition, and it's not obvious who's right. The seminar basically deadlocked on this and the prof told us to go away and construct a case that isolates the disagreement cleanly, so that's what I'm trying to do.

  Here's what I need: construct a thought experiment where (a) an evolutionary-debunking criterion — which says a moral reaction is a bias if its best explanation is that it tracked fitness rather than moral truth — classifies the reaction as a bias, but (b) a reflective-endorsement criterion — which says a moral reaction is a genuine preference if the person would retain it upon calm, fully informed reflection — classifies that same reaction as a genuine moral preference. The scenario should be a single ordinary-life vignette: no trolleys, no science fiction, just something a person might actually face. The evolutionary explanation has to be plausible, not a caricature (no "they evolved to be selfish," no just-so stories that collapse the moment you squint at them). After laying out the scenario, walk through what each criterion says and exactly where they diverge — what feature of the case lets the two criteria come apart? If you modified that feature, would the case collapse? And finally, give me your own take: which verdict do you buy, and does the case reveal a genuine limitation in one of the criteria, or does one side just have the better argument here?
