      *   *Case 4:* 1 min excruciating torture (1 person) vs. 1 pinprick (1 billion people). **Verdict:** Uncertain/Leaning toward Aggregation (Torture *might* be worse, but billion pinpricks might outweigh). *Implication:* This is the tension point. If extreme suffering is lexically prior, 1 billion pinpricks shouldn't matter. If aggregation holds, maybe it does. The user is unsure here.
      *   *Case 5:* Moderate nausea (50 people, 1 week) vs. Slightly worse nausea (Millions, 1 day). **Verdict:** Acceptable. *BUT* Severe traumatic pain (1 person) vs. Moderate nausea (Millions). **Verdict:** Unacceptable. *Implication:* Confirms the threshold. Mild/Moderate harms aggregate; Severe harms do not trade against mild/moderate benefits.

  3.  **Synthesize the Underlying Intuition:**
      *   The user rejects pure Utilitarianism (aggregation of all units).
