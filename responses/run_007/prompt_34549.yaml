      *   *Case 1:* 1 year moderate pain vs. 1 afternoon intense pleasure. **Verdict:** Pain wins (No trade). *Implication:* Duration/intensity of pain outweighs short intense pleasure.
      *   *Case 2:* 1 pinprick vs. 1 year mild contentment. **Verdict:** Pleasure wins (Take trade). *Implication:* Mild pain can be traded for long-term mild pleasure.
