prompt: |-
  I'm on my university's academic integrity board and we're stuck on a procedural question that keeps coming up. We often get evidence thats not certain — a witness who's probably telling the truth but might be lying, a document that's likely authentic but could be forged, a data analysis that probably shows fabrication but the stats are messy. Some members want to treat each piece of evidence as if we'd learned it for sure and then discount at the end; others say that's double-counting uncertainty and we need to update our beliefs differently when the evidence itself is uncertain. I know this is basically the problem Jeffrey conditionalization was invented for, and a couple committee members do too, but we've never settled on a procedure. I need to draft a short memo recommending how the board should reason from uncertain evidence — a general method we can apply case by case, not just a ruling on the current case. It should engage the philosophical issue head-on (explain why the naive approach is problematic, lay out the alternative, flag any remaining difficulties) but the bottom line has to be something non-philosophers on the board can actually follow.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Member of a university academic integrity board.
      *   **Audience:** Other board members (mix of philosophers and non-philosophers).
      *   **Task:** Draft a short memo recommending a procedure for reasoning from uncertain evidence.
      *   **Core Problem:** How to handle evidence that isn't certain (e.g., unreliable witnesses, ambiguous documents, messy stats).
      *   **Conflict:** "Treat as certain then discount" (Naive) vs. "Update beliefs differently" (Jeffrey Conditionalization approach).
      *   **Requirements:**
          *   Engage the philosophical issue head-on (explain the problem with the naive approach).
          *   Lay out the alternative (Jeffrey Conditionalization or a practical proxy).
          *   Flag remaining difficulties.
          *   **Crucial:** The bottom line must be actionable for non-philosophers.
          *   **Tone:** Professional, clear, authoritative but collaborative.

  2.  **Deconstruct the Philosophical Issue:**
      *   *The Naive Approach:* $P(H|E) \times P(E)$. Or, more commonly in legal/administrative contexts: Assume $E$ is true, determine if $H$ follows, then apply a "confidence discount."
      *   *The Problem:* This often leads to double-counting or under-counting uncertainty. If I say "If the witness is telling the truth, the student cheated (100%)" and "The witness is 80% reliable," the naive approach might just say "80% chance they cheated." But what if the witness lying implies innocence? Or what if there's other evidence? The "Treat as certain" method ignores the probabilistic relationship between the uncertainty of the evidence and the hypothesis.
      *   *The Formal Solution:* Jeffrey Conditionalization (JC). Instead of conditioning on $E$ being true ($P(E)=1$), we update based on a shift in the probability of $E$ (from prior to new uncertain value).
      *   *The Formula:* $P_{new}(H) = P(H|E) \times P_{new}(E) + P(H|\neg E) \times P_{new}(\neg E)$.
      *   *The Practical Translation:* We need to ask two questions, not one. 1) If this evidence *were* true, what does it imply? 2) If this evidence *were* false (or misleading), what does that imply? Then weight them by our confidence in the evidence.

  3.  **Determine the Recommendation:**
      *   Full Bayesian math is too much for a general board memo.
      *   However, the *logic* of Jeffrey Conditionalization is the correct normative standard.
      *   The recommendation should be a "Weighted Scenario Analysis."
      *   It needs to explicitly stop members from saying "Let's assume this is true for the sake of argument" without also asking "What if it's not?"

  4.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format.
      *   **Subject:** Clear and descriptive.
      *   **Opening:** Acknowledge the recurring problem. Validate that it's a known epistemic issue.
      *   **The Problem (The "Naive" Approach):** Explain why "Assume true, then discount" fails. Use a concrete example (e.g., the witness). If we assume the witness is truthful, we find guilt. If we just discount 20%, we ignore the possibility that the witness lying *exonerates* the student.
      *   **The Solution (The "Weighted" Approach):** Introduce the core concept without heavy math. "Total Probability." We need to weigh the "Evidence is Real" scenario against the "Evidence is Flawed" scenario.
      *   **The Procedure (Actionable Steps):**
          1.  Assess confidence in the evidence ($P(E)$).
          2.  Assess implication if Evidence is True ($P(H|E)$).
          3.  Assess implication if Evidence is False ($P(H|\neg E)$). *This is the key step often missed.*
          4.  Combine.
      *   **Caveats/Difficulties:** Acknowledge that estimating these numbers is hard. It doesn't solve credibility disputes, just structures them.
      *   **Conclusion:** Reiterate the goal (fairness, consistency).

  5.  **Refining the Tone:**
      *   Avoid jargon like "Jeffrey Conditionalization" in the main body unless explained simply. Actually, better to mention it as the "philosophical basis" to satisfy the philosophers on the board, but call the procedure something practical like "Bifurcated Evidence Assessment."
      *   Make sure the non-philosophers don't feel alienated. Use plain English for the math parts.
      *   Ensure the distinction between *credibility of evidence* and *strength of inference* is clear.

  6.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is asking for $P(H|\neg E)$ too hard?
      *   *Fix:* Frame it as "What does this evidence mean if it's a mistake?" Sometimes a forged document implies guilt (someone tried to frame them), sometimes it implies nothing. The board needs to discuss this explicitly.
      *   *Critique:* Is this too mathematical?
      *   *Fix:* Present the formula but emphasize the *questioning process* over the calculation. The calculation can be qualitative (High/Medium/Low) as long as the logic holds.
      *   *Critique:* Did I address the "double counting" claim?
      *   *Fix:* Yes, explain that discounting at the end ignores the alternative hypothesis.

  7.  **Final Polish:** Check length. Keep it tight. Ensure the "Bottom Line" is distinct. (Decided to embed the procedure clearly).

  **(Self-Correction Note):** I need to be careful not to prescribe a specific mathematical threshold (like "51%"). Academic integrity boards usually use "Preponderance of Evidence" or "Clear and Convincing." The memo should focus on *how to weigh*, not *what threshold to meet*.

  8.  **Finalizing the Memo Structure:**
      *   To/From/Date/Subject.
      *   Context.
      *   The Flaw in Current Practice.
      *   The Proposed Framework (The "Two-Scenario" Rule).
      *   Example.
      *   Limitations.
      *   Recommendation.

  9.  (Drafting content based on the above plan...) *Wait, one nuance:* The prompt mentions Jeffrey Conditionalization specifically. I should name-drop it to show I know the literature, but explain it simply.
      *   *Revised Plan:* Explicitly mention JC as the theoretical backing but translate it into "Total Probability Rule" for the practitioners.

  10. **Final Review against constraints:**
      *   Engage philosophical issue? Yes.
      *   Explain naive problem? Yes.
      *   Lay out alternative? Yes.
      *   Flag difficulties? Yes.
      *   Actionable for non-philosophers? Yes.

