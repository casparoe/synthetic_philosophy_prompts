      *   **Friend's Summary:** Control Principle vs. Luck (genes, upbringing, situations). Conclusion: Nobody deserves praise/blame, ordinary judgment is irrational, we should drop blame/outcomes.
      *   **User's Intuition:** Feels "too neat," suspects oversimplification.
      *   **Specific Questions:**
          1.  Which parts of the summary are fair to Nagel/Williams?
          2.  Where would a careful defender wince?
