  # METAPHYSICS SEMINAR: DECISION TREE ON THE IDENTITY OF INDISCERNIBLES
  **Case:** Max Black's Two-Sphere World (Two iron spheres, identical intrinsic qualities, symmetric spatial relation, otherwise empty universe).

  ### ROOT QUESTION
  **In a world containing nothing but two iron spheres with exactly the same intrinsic qualities, are there two objects or one?**

  *   **[ONE OBJECT]** $\rightarrow$ **LEAF 1: The Multiplex Locationist**
      *   *Position:* The description "two spheres" double-counts a single object located in two places (or space is not a container for distinct entities).
      *   *Awkward Commitment:* Must deny the intuitive numerical distinctness of spatially separated entities.
      *   *(Case: The two-sphere world itself)*

  *   **[TWO OBJECTS]** $\rightarrow$ **NODE 1**

  ---

  ### NODE 1
  **Whether two objects can be distinct even when no property, relational included, distinguishes them, because each has its own bare particular or primitive thisness?**

  *   **[YES]** $\rightarrow$ **LEAF 2: The Haecceitist**
      *   *Position:* PII restricted to pure or qualitative properties with haecceities doing the individuating work.
      *   *Awkward Commitment:* Commits reality to non-qualitative, unknowable individuating facts.
      *   *(Case: Someone grants spheres are two but denies any property distinguishes them)*

  *   **[NO]** $\rightarrow$ **NODE 2**
      *   *(Distinctness must be grounded in discernible properties.)*

  ---

  ### NODE 2
  **Whether the spatial distance between the spheres counts as a property for the purposes of the principle?**

  *   **[NO]** $\rightarrow$ **NODE 3**
      *   *(Only intrinsic properties count toward discernibility. Since intrinsics are identical, the objects are indiscernible by PII standards.)*

  *   **[YES]** $\rightarrow$ **NODE 4**
      *   *(Relational properties may discern the objects.)*

  ---

  ### NODE 3 (Intrinsic Properties Only)
  **Whether the principle is best read as a necessary truth about objects, a contingent truth, or an epistemic principle about what a complete description can express?**

  *   **[NECESSARY]** $\rightarrow$ **LEAF 3: The Strong Necessitarian**
      *   *Position:* Strong PII restricted to intrinsic qualities.
      *   *Awkward Commitment:* Must declare Black's clearly conceivable world metaphysically impossible.
      *   *(Case: Two qualitatively identical objects in otherwise empty space)*

  *   **[CONTINGENT]** $\rightarrow$ **LEAF 4: The Contingent PII Defender**
      *   *Position:* Any defensible position that denies the principle outright (as a necessary law).
      *   *Awkward Commitment:* Accepts brute distinctness without any qualitative ground in this world.
      *   *(Note: See Flagged Leaves below)*

  *   **[EPISTEMIC]** $\rightarrow$ **LEAF 5: The Epistemic PII Defender**
      *   *Position:* PII is a constraint on description, not ontology.
      *   *Awkward Commitment:* Reduces a metaphysical principle to a linguistic or cognitive limitation.
      *   *(Note: See Flagged Leaves below)*

  ---

  ### NODE 4 (Relational Properties Count)
  **Whether a relational property such as being some distance from another sphere is qualitative?**

  *   **[NO (IMPURE)]** $\rightarrow$ **LEAF 6: [UNOCCUPIED]**
      *   *Status:* **Collapses into Leaf 2 (Haecceitist).**
      *   *Reason:* If relational properties like "distance from *that* sphere" are impure, they presuppose the individuation of the relata. If individuation is not qualitative, it relies on haecceities.
      *   *Reason:* Incoherent to claim relations distinguish objects if the relations themselves require prior distinction.

  *   **[YES (PURE)]** $\rightarrow$ **NODE 5**
      *   *(Relations like "2 miles from the other sphere" are treated as qualitative properties of the system.)*

  ---

  ### NODE 5
  **Whether one sphere can be singled out as the left-hand one from a particular vantage point, and whether that fact shows a real difference between the spheres?**

  *   **[YES]** $\rightarrow$ **LEAF 7: The Perspectival Weak PII Defender**
      *   *Position:* Weak PII that admits relational properties (grounded in external perspective).
      *   *Awkward Commitment:* Makes object identity partially dependent on an observer's vantage point.
      *   *(Case: The two-sphere world itself)*

  *   **[NO]** $\rightarrow$ **LEAF 8: The Symmetric Structuralist**
      *   *Position:* Weak PII that admits relational properties (grounded in global structure).
      *   *Awkward Commitment:* Objects are merely nodes in a structure, lacking independent identity conditions.
      *   *(Case: The two-sphere world itself)*

  ---

  ### SEMINAR DISCUSSION NOTES

  **Flagged Leaves (Indistinguishable on this Tree):**
  **Leaf 4 (Contingent PII)** and **Leaf 5 (Epistemic PII)** are not fully separated by this tree. Both allow the student to affirm "There are two spheres" without violating their version of PII.
  *   *Further Question Needed:* "Is the distinctness of the spheres grounded in mind-independent reality, or is it a feature of how we must describe the world to make sense of it?"

  **Unoccupied Combinations:**
  **Leaf 6** is marked unoccupied. It is logically possible to assert that relations count but are impure, but this position collapses into Haecceitism (Leaf 2) because impure relations presuppose the individuation they are meant to explain.

  **Usage:**
  This tree is designed for a 50-minute discussion. Assign students to leaves based on their intuitions about the Root and Node questions. Use the "Awkward Commitments" to pressure-test positions during the seminar.
