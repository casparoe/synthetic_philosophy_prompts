      *   *Point 3: Speed and Escalation.*
          *   Schelling emphasized the need for *pauses*. Crisis stability requires time to communicate and de-escalate.
          *   AI operates at machine speed. Flash wars.
          *   *Schelling's Likely View:* This destroys the "shared risk" mechanism. If escalation is instantaneous, there is no room for the "threat that leaves something to chance" to work. It becomes a "threat that guarantees destruction." That's not brinkmanship; that's suicide.

      *   *Point 4: LLMs and Decision Support.*
