      *   **The Threat that Leaves Something to Chance:** This is the big one. You don't threaten *definite* destruction (nobody believes you'll commit suicide). You threaten a *risk* of destruction that escalates beyond control.
      *   **Credibility:** Commitments must be credible. Automation *can* make commitments credible (the "Doomsday Machine" in *Dr. Strangelove* is the extreme example).
