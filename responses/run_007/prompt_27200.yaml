      *   Does the puzzle dissolve? Yes, because "prediction" in code is just "simulation."
      *   *Nuance:* The only time this becomes a bug is if you have *runtime* modification of schedules based on *precomputed* schedules without re-running the precomputation. That's a desync bug, not a paradox.

