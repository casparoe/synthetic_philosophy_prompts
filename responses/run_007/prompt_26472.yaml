prompt: |-
  I've been teaching myself philosophy of mathematics over the last few months, going back and forth between the standard Cantor/Hilbert's hotel material and the older stuff, and there's a passage in Aristotle's Physics (III.6, in the Hardie and Gaye translation) that's been bugging me. The passage is:

  "The infinite turns out to be the contrary of what it is said to be. It is not what has nothing outside it that is infinite, but what always has something outside it. This is indicated by the fact that rings also that have no bezel are described as 'endless,' because it is always possible to take a part which is outside a given part. The description depends on a certain similarity, but it is not true in the full sense of the word. This condition alone is not sufficient: it is necessary also that the next part which is taken should never be the same. In the circle, the latter condition is not satisfied: it is only the adjacent part from which the new part is different. Our definition then is as follows: A quantity is infinite if it is such that we can always take a part outside what has been already taken."

  I can see he's trying to make room for a merely potential infinite and block an actual one. But the defintion keeps tripping me up. 'What has nothing outside it' sounds like exactly what an infinite thing should be — complete, nothing beyond it — yet Aristotle says that's wrong, and then his example is a ring, which is finite anyway. And the more I stare at it, the more his criterion ('always take a part outside what has been already taken') sounds weirdly close to the modern definition of an infinite set as one that can be put into one-to-one correspondence with a proper part of itself. I can't tell whether that resemblance is genuine or whether I'm flattening a distinction Aristotle is drawing between a process and a completed totality.

  So my actual question: what work is the phrase 'always take a part outside what has been already taken' doing here, and how should I read it against the Cantorian idea rather than just under it? In your answer, please be explicit about where your reading is most likely to fail — which consideration would most plausibly make you change it. And I'd prefer British English throughout.
