  Okay so this is maybe a weird request but I'm putting together a take-home exam for my upper-level ethics seminar and I need help with one question. The topic is standing to blame and hypocrisy, and honestly I've been thinking about this nonstop lately because my best friend called me out for being a hypocrite when I got mad at him for flaking on plans — I do the same thing all the time — and its made me realize how philosophically weird the whole thing is. Like, I was right that he shouldn't have flaked. But somehow it still felt wrong for *me* to say it. So I want a question that gets at that tension.

  Here's what I need: a take-home essay question (students get a week, aiming for ~1,200 words), a model answer, and a marking scheme. The course is an upper-level undergrad seminar, they've read G.A. Cohen's stuff on the prisoner and the warden, they've read some of the contemporary back-and-forth (Wallace, Fritz, Bell, etc.), so they've got the basics. But I want the question to force them beyond just summarizing the positions. The crux should be whether standing to blame is fundamentally about the blamer's own moral record or about the relationship between blamer and blamed, and what that means for whether hypocritical blame can ever be communicatively valuable even if the hypocrite lacks standing.

  For the model answer, I want it to actually take a position rather than just surveying options — pick whichever side you think is stronger and defend it, but show you understand why the other side is tempting. And for the marking scheme, I want it built around five must-hit points worth 4 marks each (total 20), with a note on what mistake each point is guarding against — like what the student who misses it is probably thinking instead.

  Oh and two format things: first, please just give me the question, model answer, and marking scheme directly — no intro, no "here's your exam question," just the material. Second, in the model answer, tell me how confident you are in the position you're defending and flag the one point you're least sure about. I don't want students thinking there's a settled consensus when there isn't.
