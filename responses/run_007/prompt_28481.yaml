answer: |-
  **Essay Question**

  **Topic:** The Normative Significance of Hypocritical Blame

  **Prompt:**
  Philosophers disagree about why hypocritical blame is problematic. Some argue it is a matter of the blamer's moral record (the "Forfeiture View"), while others argue it is a matter of the relationship between blamer and blamed (the "Relationship View"). 

  Write an essay of approximately 1,200 words addressing the following: 
  1.  Critically assess whether standing to blame is grounded in the blamer's own moral record or in the normative relationship between the parties. 
  2.  Argue for a position on whether hypocritical blame can retain communicative value even if the blamer lacks standing. 

  In your answer, engage with at least two of the following authors: G.A. Cohen, R. Jay Wallace, Macalester Bell, or Kyle Fritz. You should not merely summarize their views but use them to construct and defend your own argument regarding the tension between being *right* about a norm and having the *authority* to enforce it.

  ***

  **Model Answer**

  **Title:** Equality, Authority, and the Voice of Hypocrisy

  The intuition that hypocritical blame is objectionable is robust. When I chastise a friend for flaking on plans while habitually doing the same myself, I sense a specific kind of wrongness. It is not that the norm against flaking is invalid; rather, it feels as though I lack the standing to enforce it. This essay argues that standing to blame is grounded not in the blamer's moral record per se, but in the normative relationship of equality between moral agents. Consequently, while hypocritical blame lacks normative authority, it can retain significant communicative value regarding the validity of the norm itself.

  To understand why the moral record is insufficient to explain standing, we must look to the limitations of the Forfeiture View. A simplistic reading suggests that by violating a norm, one forfeits the right to hold others to it. However, as G.A. Cohen's discussion of the warden and the prisoner illustrates, the issue is not merely about past actions. If a warden unjustly imprisons a prisoner, the warden lacks standing to blame the prisoner for attempting escape, even if the warden follows all procedural rules thereafter. The lack of standing stems from the warden's participation in an unjust structure, not merely a discrete moral failing. Similarly, in interpersonal cases, if standing were solely about moral record, a reformed hypocrite who has not flaked in years would regain standing instantly. Yet, we often feel that until the relational breach is repaired, the authority remains compromised. This suggests that standing is not a commodity we possess based on our scorecard, but a status granted by our position relative to the blamed.

  This leads to the stronger explanation: the Relationship View. Drawing on Macalester Bell's work, we can see blame as a demand for respect within a moral community. When I blame someone hypocritically, I implicitly claim a position of superiority—that I am bound by the norm in a way that justifies my judgment, while my own violations suggest I do not respect the norm enough to follow it. This creates a contradiction in the relationship. I am demanding accountability while simultaneously demonstrating a lack of commitment to the very standard I invoke. Kyle Fritz supports this by noting that hypocrites fail to treat themselves and others as moral equals. By exempting myself (in practice) from the norm I impose on you, I violate the condition of equality required for legitimate accountability. Therefore, standing is lost not because I am "bad," but because my actions have disrupted the relational equality necessary for me to issue authoritative demands.

  However, losing standing does not render the blame contentlessly void. This is the crucial distinction between *authority* and *correctness*. When I hypocritically blame my friend for flaking, I lack the standing to hold them accountable (the authoritative speech act fails), but I may still be correct that flaking is wrong. The communicative value of blame lies in its ability to highlight moral reasons. Even if I am a hypocrite, the reason "flaking disrespects your time" remains a valid moral reason. If I say, "You shouldn't flake because it hurts me," the truth of that claim is independent of my own reliability. 

  Critics might argue that hypocritical blame is communicatively useless because the hypocrisy undermines the sincerity of the commitment. If I don't follow the norm, why should you believe I value it? This is a potent objection. However, we must distinguish between the *value of the relationship* and the *value of the information*. Hypocritical blame damages the relationship (hence the lack of standing), but it can still successfully communicate the existence of a norm. In fact, sometimes hypocritical blame is the only way a norm is surfaced. If a recovering addict warns a friend against substance abuse, their warning carries immense moral weight regarding the danger of the drug, even if their own record complicates their authority to demand abstinence. The content is valuable even if the messenger is compromised.

  Therefore, the tension in the prompt is resolved by separating the normative power to hold accountable from the epistemic value of the moral claim. The Relationship View best explains why I lack standing: I have violated the equality condition required for accountability. But this does not entail that my claim about the norm is false or useless. We should reject hypocritical blame as a practice of accountability because it harms moral relationships, but we should not dismiss the moral truths hypocrites may articulate.

  In conclusion, standing is relational, not merely historical. It depends on the equality of commitment between agents. While hypocrisy undermines the authority to blame, it does not necessarily negate the communicative value of the moral content provided. We must learn to hear the norm even when we reject the blamer's authority.

  **[Instructor Note on Confidence & Uncertainty]**
  *Confidence Level:* High. The distinction between standing (authority) and correctness (content) is a robust consensus in contemporary literature, and the Relationship View is currently the dominant framework over simple Forfeiture.
  *Least Sure Point:* The claim in paragraph 4 that hypocritical blame retains "communicative value" is the most contentious point. Some philosophers (e.g., strict Strawsonians) might argue that without standing, the reactive attitude itself is corrupted, meaning the communication is fundamentally altered, not just the authority. I am less confident that the "content" can be neatly separated from the "act" in all cases.

  ***

  **Marking Scheme**

  **Total Marks: 20 (5 Points x 4 Marks)**

  | Point | Criteria for Full Marks (4/4) | Common Mistake / What this guards against |
  | :--- | :--- | :--- |
  | **1. Distinction between Standing and Correctness** | Clearly distinguishes between the *authority* to blame (standing) and the *truth* of the moral claim (correctness). Explains why one can lack the former while possessing the latter. | **The Conflation Error:** Students argue that because the blamer is a hypocrite, the norm they are citing must be false or invalid. |
  | **2. Critique of the Moral Record View** | Engages with the "Forfeiture" or "Moral Record" view (e.g., simple forfeiture of rights) and identifies a limitation (e.g., doesn't account for reformed hypocrites or structural issues like Cohen's warden). | **The Scorecard Error:** Students treat standing as a simple tally of good vs. bad actions, ignoring the structural or relational nuances. |
  | **3. Defense of the Relationship View** | Articulates the "Relationship" or "Equality" view (e.g., Bell, Fritz). Explains that standing relies on moral equality/commitment between agents, not just past behavior. | **The Individualist Error:** Students focus solely on the blamer's internal state rather than the interpersonal dynamic between blamer and blamed. |
  | **4. Analysis of Communicative Value** | Addresses whether hypocritical blame has value. Takes a stance on whether the *content* of the blame survives the loss of *standing*. | **The Dismissal Error:** Students assume that if standing is lost, the blame is worthless noise, failing to consider epistemic or informational value. |
  | **5. Argumentative Synthesis** | The essay does not just list views but constructs a coherent argument. Uses authors to support a specific thesis rather than summarizing them in isolation. | **The Listicle Error:** Students write "Author A says X, Author B says Y" without integrating them into a unified argument answering the prompt. |
