      *   *Nuance 3: The Objection.* The "wordplay" charge is a bit of a straw man or oversimplification. The real philosophical heavy lifting against dialetheism involves the *norms of assertion* (can you rationally believe a contradiction?) and the *revenge paradoxes* (can paraconsistent logic handle its own semantic concepts?).
      *   *Nuance 4: "Changed Subject".* This is a specific technical objection (often linked to the idea that the dialetheist's negation isn't *real* negation). This is worth highlighting.

