      *   *Claim 2 (Liar Paradox):* Accurate. This is the canonical example.
      *   *Claim 3 & 4 (Paraconsistent Logic):* Accurate. Classical logic explodes (Principle of Explosion: $A \land \neg A \vdash B$). Paraconsistent logic blocks this. Dialetheists *need* paraconsistent logic to avoid trivialism.
      *   *Claim 5 (Priest):* Accurate. Graham Priest is the central figure (e.g., *In Contradiction*).
      *   *Claim 6 (Scope/Examples):* Mostly accurate. Liar, Set Theory (Russell's), Vagueness (Sorites), Change (Heraclitus/Priest's *Motion*). "Out there in the world" is slightly tricky phrasing (ontological vs. semantic), but Priest does argue for ontological contradictions in some cases (motion, boundaries).
      *   *Claim 7 (Objection):* This is the tricky one. The "wordplay/changed subject" objection is real (often associated with Williamson or classical logicians). However, phrasing it as "words don't mean anything anymore" is a bit crude. The deeper objection is about the *normative role* of assertion and denial. If I assert $A$ and you deny $A$, usually we disagree. If $A$ can be both, do we still disagree? This is the "denial problem."
