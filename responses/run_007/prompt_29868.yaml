prompt: |-
  I'm teaching a unit on Dennett's view that the self is a center of narrative gravity — an abstraction, like a center of gravity in physics, that organizes the story a person tells about their own life, rather than some solid thing sitting in the head. I want to use Memento as the film. Leonard can't form new memories, so his self is held together almost entirely by outside props: polaroids, notes, tattoos. On one hand that looks like Dennett made literal, since Leonard is visibly constructing his center of narrative gravity out of narrative devices. On the other hand the film shows that narrative being written by other people and by Leonard's own self-deception (the Sammy Jankis stuff especially), which is a much more cynical picture than Dennett's usual one of a useful fiction. I'd like a reading that does justice to both sides. Does Memento mainly vindicate the center-of-narrative-gravity picture, complicate it, or show that a narrative self can be a dangerous fiction in a way Dennett underplays? Point to specific scenes or choices where the idea earns its keep, and where the film resists it. And say what you think the film adds to the philosophical debate that Dennett's own examples don't.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Topic:** Daniel Dennett's "Center of Narrative Gravity" theory of the self.
      *   **Film:** *Memento* (Christopher Nolan, 2000).
      *   **Core Tension:**
          *   *Side A (Vindication):* Leonard's self is literally constructed via external narrative props (notes, tattoos), mirroring Dennett's idea of the self as an abstraction/organizing principle rather than a homunculus.
          *   *Side B (Complication/Cynicism):* The narrative is manipulated by others (Teddy, Natalie) and self-deception (Sammy Jankis), suggesting the narrative self can be malignant/dangerous, not just a "useful fiction."
      *   **Task:** Provide a reading that balances both sides. Determine if the film vindicates, complicates, or critiques Dennett. Identify specific scenes/choices. Explain what the film adds to the philosophical debate beyond Dennett's own examples.

  2.  **Deconstruct Dennett's Theory:**
      *   *What is it?* The self is not a "little man in the head" (Cartesian Theater). It's a fictional center, like a center of gravity. It's an abstraction derived from the web of beliefs, actions, and stories.
      *   *Function:* It organizes experience, allows for moral responsibility, and enables social coordination.
      *   *Tone:* Generally pragmatic/optimistic. It's a "useful fiction." It allows us to function.
      *   *Vulnerability:* Dennett acknowledges errors, but usually treats them as glitches in the system, not fundamental features of malice or trauma.

  3.  **Deconstruct *Memento* (Leonard's Condition):**
      *   *Anterograde Amnesia:* Cannot form new episodic memories.
      *   *System:* Relies on externalized memory (polaroids, notes, tattoos).
      *   *Narrative:* "John G. killed my wife." This is the core story holding him together.
      *   *Twist:* He knows he might be deceiving himself. He chooses to ignore evidence (Teddy's revelation). He uses Sammy Jankis as a projection of his own guilt.

  4.  **Synthesize: The Intersection (The "Reading"):**
      *   *Vindication:* Leonard *is* a walking Center of Narrative Gravity. Without the story, he has no continuity. The props make the abstraction visible.
      *   *Complication/Critique:* The "gravity" is manipulated. Dennett assumes the narrative tends toward coherence and utility for the organism. *Memento* shows the narrative can be weaponized (by Teddy) and used for avoidance (by Leonard). The "fiction" isn't just useful; it's a life-support system for a pathological state.
      *   *Conclusion:* It complicates and darkens Dennett. It shows the *ethics* of the narrative self, which Dennett often sidelines for the *metaphysics*.

  5.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Acknowledge the brilliance of the pairing. State the thesis: *Memento* vindicates the *structure* of Dennett's theory but radicalizes its *ethical implications*. It shows the Center of Narrative Gravity isn't just a neutral organizer; it's a site of power and vulnerability.

      *   **Vindication (Where the idea earns its keep):**
          *   *Externalization:* Dennett says the self is an abstraction. Leonard makes it concrete. The tattoos are literally inscribed narrative.
          *   *Scene:* The montage of Leonard organizing photos. He is *building* the self in real-time.
          *   *Concept:* Without the narrative ("Find John G."), Leonard is just a collection of sensory inputs (like a Dennettian "bundle of perceptions" without the center). The narrative gives him agency.

      *   **Complication/Critique (Where the film resists it):**
          *   *The "Useful" Fiction:* Dennett says it's useful for functioning. Leonard's narrative allows him to function, but *maladaptively*. It keeps him stuck in a loop of violence.
          *   *External Manipulation:* Dennett focuses on the individual's brain. *Memento* shows the narrative is social. Teddy and Natalie write Leonard's story for him.
          *   *Scene:* The parking lot scene with Teddy. "You don't want the truth. You want a puzzle." Teddy reveals he is the author of Leonard's current chapter.
          *   *Self-Deception (Sammy Jankis):* This is crucial. Leonard projects his own failure onto Sammy. This shows the narrative isn't just organizing; it's *protecting* the ego from guilt. Dennett doesn't emphasize the *traumatic* function of the narrative self enough.

      *   **What the Film Adds to the Debate:**
          *   *Materiality:* Dennett is abstract. *Memento* shows the *labor* of maintaining the self. It's exhausting work.
          *   *Ethics/Politics:* Who controls the narrative? Dennett is individualistic. *Memento* is intersubjective. If others can write your notes, they own your self.
          *   *The Dark Side of Coherence:* Dennett values coherence. Leonard values coherence over truth. The film suggests the drive for a coherent self can override the drive for truth.

      *   **Pedagogical Advice:** How to teach this?
          *   Contrast the "optimistic functionalism" of Dennett with the "tragic existentialism" of Nolan.
          *   Use the "Sammy Jankis" reveal as the pivot point.

  6.  **Refining and Polishing:**
      *   *Check Tone:* Keep it academic but accessible for a teacher.
      *   *Check Specifics:* Ensure specific scenes (Teddy's death, the Sammy story, the tattoos) are cited.
      *   *Nuance:* Make sure not to say Dennett is *wrong*, but that the film explores the *pathological limits* of his theory. Dennett admits fictions can be false, but *Memento* shows them being *weaponized*.

  7.  **Self-Correction during drafting:**
      *   *Initial thought:* Maybe say *Memento* disproves Dennett.
      *   *Correction:* No, that's too strong. Leonard *is* a Center of Narrative Gravity. The film proves the mechanism exists. It just shows the mechanism can be hijacked. Stick with "complicates" and "darkens."
      *   *Emphasis:* Highlight the "external" nature. Dennett's center is in the web of language. Leonard's is literally on his skin. This literalizes the theory beautifully.

  8.  **Final Review against User Prompt:**
      *   Vindicate, complicate, or dangerous fiction? (Answer: All three, primarily dangerous/complicated).
      *   Specific scenes? (Included: Tattoos, Teddy confrontation, Sammy reveal).
      *   What does it add to Dennett? (Materiality, vulnerability to manipulation, ethics of self-deception).

  9.  **Final Polish:** (Produces the structured response below.)
answer: |-
  This is a fantastic pairing. *Memento* is arguably the perfect cinematic illustration of Dennett's "Center of Narrative Gravity," but you are right to sense a tension in the tone. Dennett's theory is generally pragmatic and functionalist (the self is a "useful fiction" that allows for moral responsibility and social coordination), whereas *Memento* is tragic and existential (the self is a "necessary fiction" that allows for avoidance and vengeance).

  Here is a reading that balances the vindication of the mechanism with a critique of its ethics, structured to help you guide your students through the nuance.

  ### 1. Where the Film Vindicates Dennett: The Self as Constructed Artifact
  Dennett argues that there is no "homunculus" inside the brain looking at experience. There is only a web of words, actions, and memories, and the "self" is the abstract point around which that web is organized. *Memento* makes this abstraction visible.

  *   **The Externalized Brain:** Leonard cannot rely on internal neural states to maintain continuity. He must offload the "center of gravity" onto the physical world. The Polaroids, the notes, and the tattoos are not just memory aids; they are the **constituents of the self**. When Leonard loses a photo, he literally loses a piece of his agency.
  *   **Scene to Highlight:** The opening sequence (which is the chronological end) where Leonard shoots Teddy. We see him arrange the photo, write the caption ("Fact 5: He is the one"), and tattoo the license plate. In this moment, we watch Leonard *decide* who he is. He is not discovering a pre-existing truth; he is authoring a center of gravity to pull his future actions into a coherent shape.
  *   **The Philosophical Payoff:** This vindicates Dennett's claim that the self is not a *thing* but a *task*. Leonard proves that without the active maintenance of the narrative, the self dissolves into a series of disconnected "nows."

  ### 2. Where the Film Complicates Dennett: The Vulnerability of the Fiction
  Dennett often treats the narrative self as a benign or neutral organizer. He acknowledges errors, but he generally assumes the organism wants a coherent story to function well in the world. *Memento* suggests the narrative self is porous, manipulable, and often prioritizes coherence over truth.

  *   **The Social Construction of the Self:** For Dennett, the narrative is largely internal (though language is social). In *Memento*, the narrative is written by *others*. Teddy and Natalie do not just interact with Leonard; they edit his script. They move his cars, hide his keys, and write his notes.
  *   **Scene to Highlight:** The scene where Natalie manipulates Leonard into beating up Dodd. She writes a note on a napkin ("He is the one") and plants it. Leonard finds it and accepts it as his own internal imperative. This shows that the "Center of Narrative Gravity" is not secure inside the skull; it can be hijacked. If the self is a story, anyone who holds the pen has power over you.
  *   **The Philosophical Payoff:** This complicates Dennett by adding a **political dimension** to the metaphysics. If the self is a narrative, it is subject to propaganda. Dennett's theory explains *how* we have a self; *Memento* warns us about *who controls it*.

  ### 3. The Darker Turn: The Narrative as Defense Mechanism
  This is the strongest critique the film offers. Dennett views the narrative self as a tool for functioning. Leonard uses the narrative self as a tool for *avoidance*. The "useful fiction" becomes a "life-sustaining delusion."

  *   **The Sammy Jankis Projection:** The film's crucial twist is that Leonard's story about Sammy Jankis (the other amnesiac who couldn't condition himself) is actually Leonard's own story. Leonard cannot accept that he might have killed his own wife (via insulin overdose), so he projects that failure onto Sammy.
  *   **Scene to Highlight:** Leonard's monologue in the derelict building near the end. He admits, "I have to believe in a world outside my own mind... I have to believe that my actions still have meaning." He then explicitly chooses to ignore Teddy's evidence. He says, "I've got to choose to believe him [Teddy] or not." He chooses *not* to believe the truth because the truth destroys the narrative that gives him purpose.
  *   **The Philosophical Payoff:** Dennett argues we tell stories to make sense of the world. *Memento* argues we tell stories to **escape** the world. Leonard's Center of Narrative Gravity is not organizing his life for survival; it is organizing his life to perpetuate a cycle of vengeance that keeps him from facing grief. This suggests the "fiction" can be pathological. It earns its keep not by helping the organism thrive, but by helping the organism cope with trauma, even at the cost of morality.

  ### 4. What *Memento* Adds to the Debate
  Dennett's examples are usually linguistic or thought-experiment based (e.g., the *Where Am I?* thought experiment). *Memento* adds three crucial elements that philosophical prose often misses:

  1.  **The Labor of the Self:** Dennett makes the Center of Narrative Gravity sound automatic. *Memento* shows the **exhausting work** required to maintain it. Leonard is constantly writing, checking, verifying. The film suggests that having a self is a full-time job. If you stop working, the self evaporates.
  2.  **The Materiality of Memory:** Dennett focuses on the *content* of the narrative. *Memento* focuses on the **medium**. The film asks: Does it matter if the story is on a tattoo or in a neuron? By putting the narrative on skin, Nolan suggests the self is fragile and subject to decay, theft, and forgery.
  3.  **The Ethics of Coherence:** Dennett values the narrative because it allows for moral responsibility (you are responsible because you are the character in the story). *Memento* inverts this: Leonard uses the narrative to **evade** moral responsibility. By turning himself into an avenging angel character, he absolves himself of the guilt of being a confused, dangerous man. The film suggests that a coherent self is not necessarily a *good* self.

  ### Pedagogical Suggestion: The "Verdict"
  If you need a conclusion for the unit, I suggest framing it this way:

  *   **Metaphysically, *Memento* vindicates Dennett.** It proves there is no "ghost in the machine." Leonard is exactly what Dennett says we all are: a center of narrative gravity held together by stories.
  *   **Ethically, *Memento* critiques Dennett.** It shows that because the self is a fiction, it is vulnerable to bad faith. Dennett assumes the fiction tends toward truth and utility. *Memento* shows the fiction can be weaponized by others and by our own trauma.

  **Discussion Question for Students:**
  "Dennett says the self is a 'useful fiction.' Leonard Shelby proves the self is a 'necessary fiction.' But is it possible for a fiction to be necessary and yet evil? If Leonard stopped telling his story, he would be harmless but lost. If he continues the story, he is purposeful but murderous. Which version of Leonard is more 'human' in Dennett's eyes, and does the film agree?"

  This approach allows you to use the film to solidify the students' understanding of Dennett's mechanism while pushing them to think critically about the implications of that mechanism that Dennett himself might gloss over.
