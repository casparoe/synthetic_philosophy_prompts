answer: |-
  Bernard Williams's integrity objection is, at its heart, a phenomenological critique. It argues that certain moral theories (primarily utilitarianism and Kantian impartialism) describe a mode of reasoning that is not just difficult to achieve, but impossible to inhabit without fracturing the self. The "courtroom picture" is the architectural blueprint for this fracture. It suggests that to be moral is to ascend to the bench, leaving one's personal stakes in the dock. To audit this analogy is to ask whether the architecture of a trial can support the weight of a human life.

  ### I. The Audit: Mapping the Courtroom

  To understand where the model fails, we must first render its components explicit. In the courtroom picture of moral reasoning:

  *   **The Judge:** This is the "moral self" or the rational will. It is the faculty of impartial deliberation, tasked with weighing claims without bias.
  *   **The Parties:** These are the competing interests at stake. On one side, the "defendant" might be the agent's personal desires, loyalties, and ground projects. On the other, the "plaintiff" is the general welfare, the needs of strangers, or the demands of duty.
  *   **The Evidence:** These are the facts of the case, stripped of emotional coloring. In utilitarian terms, this is data regarding pleasure, pain, and preference satisfaction. In deontological terms, it is the universality of maxims.
  *   **The Verdict:** This is the moral obligation ("I ought to do X"). It is the binding ruling issued by the Judge.
  *   **The Person Living with the Verdict:** This is the agent as an embodied actor in the world.

  In a literal courtroom, these roles are institutionally separated to ensure fairness. The judge does not carry out the sentence; the sheriff does. The judge has no financial stake in the outcome. The verdict is a discrete event that concludes a specific proceeding.

  ### II. The Breakdown: Where the Analogy Cracks

  The mapping breaks down precisely where the moral life becomes real. The courtroom model relies on a **separation of powers** that does not exist in the human psyche.

  1.  **The Identity of Judge and Condemned:** In the moral courtroom, I am the Judge, but I am also the Party. My "ground projects" (to use Williams's term)—my love for my spouse, my dedication to my art, my loyalty to my friend—are not merely evidence submitted for review; they are the materials of which *I* am made. When the Judge rules against these projects, it is not merely ruling against a preference; it is ruling against the integrity of the Agent. In a real court, the judge can go home to a life untouched by the verdict. In the moral life, the Judge must descend from the bench to serve the prison sentence they just handed down.
  2.  **The Nature of Evidence:** In court, evidence is external to the judge. In moral deliberation, my commitments are not external data points to be weighed; they are the *lens* through which I see the data. To ask a father to weigh his child's life against two strangers' lives as "equal interests" is not to ask him to be fair; it is to ask him to cease being a father. The courtroom model treats deep commitments as *inputs* for calculation, whereas in lived experience, they are the *conditions* of calculation.
  3.  **Finality vs. Continuity:** A verdict ends a case. A moral decision begins a life trajectory. The courtroom analogy suggests deliberation is a punctuated event (the trial), whereas moral existence is a continuous narrative. You cannot adjourn court and return to "normal life," because the verdict *becomes* your normal life.

  ### III. The Import: Alienation and the "View from Nowhere"

  The courtroom frame quietly imports a metaphysical assumption about the relation between a deliberator and her life: **the assumption of detachability.**

  It assumes that the "real" me is the Judge, and my life, relationships, and projects are merely the case files passing over the bench. This creates a split between the "moral self" (the impartial spectator) and the "empirical self" (the person with attachments). Williams argues that this is an illusion of sovereignty. I cannot stand outside my commitments to adjudicate them without already being a person who *has* those commitments.

  If I am asked to justify my loyalty to my friend from an impartial standpoint, the courtroom model assumes I can step back and ask, "Is friendship valuable?" But if I have to ask that, I am no longer acting as a friend. I am acting as a bureaucrat of value. The courtroom model demands that I treat my own life as a resource to be managed for the general good, rather than a project to be lived. This is the source of the **alienation** Williams identifies. The model requires me to view my own integrity as just another variable in the equation, potentially sacrificable if the math works out. It imports the idea that I own my life only conditionally, on lease from the Impartial Judge.

  ### IV. Does the Conclusion Survive?

  The conclusion the courtroom analogy is meant to license is that **personal loyalty and ground projects count as moral considerations only to the extent that they can be translated into, and defended from, the impersonal standpoint.**

  Once the disanalogies are on the table, this conclusion does not survive; it is revealed as an artifact of the metaphor. The demand for translation only makes sense if the "Judge" perspective is the primary reality and the "lived life" is secondary. But if the Judge/Agent split is false—if I am inextricably the person living the verdict—then the demand to translate my love for my child into the language of general utility is not a demand for rigor, but a category error.

  The courtroom was doing the work all along. It lent the *authority* of law (impartiality, objectivity, procedure) to moral life. By stripping the analogy of its legal trappings, the "strong conclusion" loses its normative force. It becomes clear that requiring a person to justify their deepest commitments to a hypothetical spectator is not moral reasoning; it is a form of self-erasure. The conclusion collapses because it relies on the possibility of a "view from nowhere," which Williams argues is no view at all for a human being.

  ### V. A Better Analogy: The Improvisational Actor

  If the courtroom is the wrong frame, what fits the phenomenology of integrity? A better analogy is **the Improvisational Actor on a Stage.**

  *   **The Role:** You are not the Judge watching the play; you are a character *in* the play. You have a script (your history, culture, biology), but much of the dialogue is improvised (your choices).
  *   **The Other Actors:** Other people are not "parties" in a dispute; they are co-actors. Your relationship with them is defined by the scene you are building together, not by an external arbitration of interests.
  *   **The Commitments:** Your "ground projects" are not evidence; they are your *character's motivations*. You cannot step out of character to evaluate your motivations without ruining the scene (the relationship/life).
  *   **The Integrity:** Integrity here is not consistency with an external rule, but **coherence of the performance**. It is about whether the action fits the character you are creating. If a character suddenly betrays their deepest love because a "director" (the impartial spectator) whispered that it would maximize audience pleasure, the character becomes unintelligible. The play falls apart.
  *   **The Stakes:** You cannot leave the stage. There is no "going home" after the verdict. You must live in the scene you create.

  In this analogy, moral reasoning is not adjudication; it is **navigation within a role**. It acknowledges that I am embedded. I cannot weigh my child's life against a stranger's from a neutral point of view because I am not neutral; I am *this* parent. To ask me to be neutral is to ask me to stop acting the part of a parent.

  The improvisational actor analogy preserves the seriousness of moral choice without demanding self-alienation. It recognizes that while I must consider the other actors (empathy, duty), I must do so *from within my role*, not from the empty seat of the judge. It allows for the truth that some things matter *because* they are mine, not *despite* the fact that they are mine. This restores the agent to the center of the moral life, not as a sovereign judge, but as an author who is also the text.
