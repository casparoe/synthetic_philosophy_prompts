          1.  Map the components: Judge, Parties, Evidence, Verdict, Person living with the verdict.
          2.  Identify where the mapping breaks down (disanalogies).
          3.  Analyze what the courtroom frame imports about the relation between deliberator and life (the "standing outside" assumption).
          4.  Evaluate if the conclusion (loyalty/projects only count if translatable to impartial standpoint) survives without the analogy.
          5.  Propose a better analogy if the courtroom one fails.

  2.  **Initial Brainstorming & Contextualization:**

      *   *Williams's Integrity Objection:* Found in "A Critique of Utilitarianism" (Smart & Williams). Key example: George the chemist, Jim and the Indians. The core argument is that Utilitarianism alienates agents from their "ground projects" and personal commitments, attacking their integrity. It treats the agent as a neutral channel for satisfaction rather than a person with a life.
      *   *The Courtroom Analogy:* This is the "Impartial Spectator" tradition (Smith, Sidgwick, Rawls to some extent). Morality = stepping back from personal bias to judge fairly.
      *   *The Audit:* I need to show how this legalistic metaphor distorts the phenomenology of moral life. In a court, the judge is distinct from the defendant. In life, I am both.

  3.  **Drafting - Section by Section:**

      *   **Introduction:**
          *   Hook: Williams's critique of the "view from nowhere."
          *   Define the Courtroom Picture: Morality as adjudication.
          *   Thesis: The courtroom analogy smuggles in a separation between agent and action that destroys integrity. When audited, the analogy fails, and the conclusion it supports (impartiality trumps personal projects) collapses with it.

      *   **Mapping the Analogy (The Audit):**
          *   *Judge:* The moral conscience / the impartial standpoint / the "rational self."
          *   *Parties:* Competing interests (my family vs. strangers, my projects vs. general welfare).
          *   *Evidence:* Facts about consequences, needs, duties.
          *   *Verdict:* The moral obligation ("I ought to do X").
          *   *Person living with verdict:* The agent (who must execute the action).
          *   *Crucial Tension:* In court, Judge $\neq$ Defendant. In morality, Judge $=$ Agent.

      *   **Where the Mapping Breaks Down (Disanalogies):**
          *   *Separation:* A judge doesn't carry out the sentence (usually). In morality, I must *do* the thing.
          *   *Neutrality:* A judge *should* have no stake. I *necessarily* have a stake (it's my life).
          *   *Retrospective vs. Prospective:* Courts often judge past acts. Morality guides future action.
          *   *Finality:* A verdict ends the case. A moral decision launches a life trajectory.

      *   **The Import of the Frame (The "Standing Outside" Assumption):**
          *   This is the heart of Williams's critique.
          *   The courtroom assumes I can detach from my "ground projects" to evaluate them.
          *   Williams says: My projects *constitute* me. To evaluate them from nowhere is to evaluate *me* from nowhere.
          *   It creates a split: The "Moral Self" (Judge) vs. The "Empirical Self" (Party).
          *   This leads to alienation. I become a vessel for utility, not a person.

      *   **Does the Conclusion Survive?**
          *   The conclusion: Personal loyalty counts only if impartially justified.
          *   Without the courtroom frame, this looks absurd. Why should my love for my spouse need justification from a stranger's perspective?
          *   The conclusion relies on the *authority* of the Judge metaphor. Remove the metaphor, and the demand for impartial translation loses its grip. It was the metaphor doing the work.

      *   **Proposing a Better Analogy:**
          *   Needs to capture: Embodiment, continuity, authorship, stakes.
