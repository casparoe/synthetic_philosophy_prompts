  7.  **Final Polish:** Check flow, ensure Williams's specific terminology ("ground projects," "negative responsibility") is alluded to or used correctly. Ensure the distinction between the "Judge" and the "Agent" is the pivot point.

      *(Wait, one more check on the "Conclusion" part)*: Does the conclusion survive? The conclusion is that personal loyalty is secondary. If the courtroom model is rejected, does Utilitarianism still hold? Williams says no, because the *demand* for impartiality relies on that detached perspective. If we reject the detachment, the demand loses its normative force. I need to make sure this is clear.

