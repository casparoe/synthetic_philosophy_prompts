      *   *Why it feels off:* It signals she doesn't respect you enough to hold herself to the same standard. It kills goodwill.
      *   *Next Steps:* Have a calm conversation. "I hear you, I'm working on it. But I need us to be accountable to each other."

  5.  **Refining the Tone:**
