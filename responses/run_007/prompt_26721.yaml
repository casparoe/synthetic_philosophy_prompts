answer: |-
  You are not just being defensive. While your friend is logically correct, she is relationally wrong.

  It is completely normal to feel frustrated by this dynamic. Here is a breakdown of why your gut feeling is telling you something is "off," even though her statement was technically true.

  ### 1. Logic vs. Credibility
  Your friend is relying on a logical fact: **Hypocrisy does not invalidate a truth.** If a smoker tells you smoking is bad, they are right; smoking *is* bad, regardless of their own habits. In this narrow sense, she is right: her flaking doesn't make your flaking okay.

  However, human relationships aren't built on pure logic; they are built on **credibility and goodwill.** When someone criticizes you for a behavior they actively engage in, they lose the moral standing to lecture you. It transforms the conversation from "I care about you and want us to be reliable" to "I am judging you for rules I don't follow." That feels unfair because it *is* unequal.

  ### 2. The "Deflection" Red Flag
  The most concerning part of your story isn't the flaking; it's her response when you pointed out the double standard.
  *   **A healthy response:** "You're right. I hate that I do that, and I know it hurts you. I'm trying to work on it, just like I hope you will."
  *   **Her response:** "So what? That doesn't make what I'm saying false."

  This is dismissive. It shuts down your feelings and refuses accountability. It suggests that while she expects you to be accountable to her, she does not feel accountable to you. That is a power imbalance, not a friendship of equals.

  ### 3. Severity Matters
  You mentioned she canceled three times in a month, **including once when you were already at the restaurant.**
  There is a significant difference between canceling plans ahead of time and leaving someone stranded at a venue. The latter shows a lack of respect for your time and emotional energy. If she is criticizing you for flaking while simultaneously leaving you waiting at a table, she is holding you to a standard of basic respect that she is not meeting herself.

  ### 4. Why It Feels "Off"
  You feel this way because criticism in a friendship is supposed to come from a place of partnership. It feels like:
  *   **Scapegoating:** She might be criticizing you to deflect attention from her own unreliability. If she makes your behavior the "problem," she doesn't have to look at hers.
  *   **Lack of Self-Awareness:** She may genuinely not see her own behavior as problematic, which suggests she doesn't value your time as much as she expects you to value hers.
  *   **Erosion of Trust:** When someone says, "You need to be better," but shows you they won't be better themselves, you stop trusting their guidance.

  ### How to Handle It
  You admitted that you do flake more than you should. The healthiest path forward is to own your part without accepting her unfair framing.

  **1. Own your behavior (for yourself, not her):**
  Stop flaking because it's a good habit to have, not because she demanded it. You can say: *"I know I've been canceling too much, and I'm sorry. I'm working on being more reliable."*

  **2. Address the double standard:**
  Don't argue the logic; argue the dynamic.
  *"I know my canceling isn't okay. But when you cancel on me, especially when I'm already out, it hurts my feelings and makes me feel like my time isn't respected. It's hard for me to accept criticism on this when it feels like the rule only applies to me."*

  **3. Watch her reaction:**
  If she doubles down, gets angry, or dismisses your feelings again, you have your answer about the friendship's health. A good friend will hear that their hypocrisy is hurting you and will try to adjust.

  **Summary:**
  You aren't being defensive. You are recognizing a lack of reciprocity. You can work on your reliability *and* still demand that she holds herself to the same standard. If she refuses to do that, the problem isn't just the flaking—it's the respect.
