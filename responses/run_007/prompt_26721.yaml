prompt: |-
  A friend of mine has been giving me a hard time lately about flaking on plans — I'll say I'm coming to something and then cancel at the last minute. And honestly, the criticism is accurate, I do that more than I should. But here's the thing: she's way worse about this than I am. She's cancelled on me three times in the past month alone, including once when I was already at the restaurant. When I pointed this out, she said "so what, that doesn't make what I'm saying about you false." And… she's right, it doesn't, but I still feel like there's something off about her being the one to lecture me on this. Am I just being defensive, or is there something genuinely wrong with her criticism given that she's guilty of the same thing?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Situation:**
      *   **The Conflict:** The user's friend is criticizing the user for flaking on plans (canceling last minute).
      *   **User's Admission:** The user admits the criticism is accurate ("I do that more than I should").
      *   **The Counterpoint:** The friend flakes *more* often (3 times in a month, once leaving the user at the restaurant).
      *   **The Friend's Defense:** "So what, that doesn't make what I'm saying about you false." (Logical validity vs. Hypocrisy).
      *   **User's Feeling:** Something feels "off" about her lecturing, despite the logic being sound.
      *   **The Question:** Am I being defensive, or is there something genuinely wrong with her criticism given her hypocrisy?

  2.  **Deconstruct the Logic and Ethics:**
      *   **Logical Fallacy Check:** The friend is invoking a principle similar to *Tu Quoque* (You Also). Usually, pointing out hypocrisy doesn't invalidate the argument *factually*. If I smoke and tell you smoking is bad, the statement "smoking is bad" is still true. So, logically, the friend is right.
      *   **Relational/Social Dynamics:** However, relationships aren't pure logic puzzles. Trust, reciprocity, and goodwill matter.
      *   **The "Off" Feeling:** Why does it feel wrong?
          *   *Lack of Self-Awareness:* She doesn't see her own behavior as a problem.
          *   *Power Imbalance:* She's positioning herself as the "responsible one" when she isn't.
          *   *Goodwill:* Criticism usually comes from a place of wanting to help. If she's doing the same thing, it feels more like control or deflection than help.
          *   *Severity:* Leaving someone at a restaurant is worse than canceling beforehand.
      *   **Defensiveness:** The user admits fault, so they aren't *purely* being defensive. They are recognizing a double standard.

  3.  **Formulate the Response:**
      *   **Validate the User:** Acknowledge that their feeling is normal and valid. It *is* frustrating when someone holds you to a standard they don't meet.
      *   **Address the Logic:** Confirm the friend is logically correct (hypocrisy doesn't make the fact false). This builds trust with the user that I'm not just taking their side blindly.
      *   **Address the Relational Aspect:** Explain *why* it feels off. It's about credibility, goodwill, and partnership.
      *   **Analyze the Friend's Behavior:** Why is she doing this? Deflection? Lack of insight? Control?
      *   **Actionable Advice:** How to handle this conversation?
          *   Own the fault (user already does this).
          *   Address the double standard without attacking.
          *   Set boundaries/expectations.
          *   Evaluate the friendship dynamic.

