      *(Self-Correction during drafting)*: Wait, let me double-check the Hirsch point. Hirsch defines "meaning" as the author's willed type. "Significance" is the relationship of that meaning to something else. If the student says "meaning stays fixed [by text]... significance changes," they are using Hirsch's *vocabulary* to argue *against* Hirsch's *theory of meaning*. This is a contradiction. An anti-intentionalist wouldn't typically invoke Hirsch to defend their position on meaning fixation; they would invoke Beardsley. The student is conflating the *distinction* (which is useful) with the *theorist* (who opposes the student's premise). This is a definite deduction point.

