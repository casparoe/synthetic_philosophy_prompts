answer: |-
  You have put your finger on a tension that legal philosophers and theologians have wrestled with for centuries, and it is completely understandable why it makes your head spin. The distinction you are noticing between natural causes and human agency in the law is not actually a metaphysical claim about the nature of reality, but rather a jurisdictional boundary about the limits of human institutions. When the legal system categorizes an earthquake as an act of God and a fallen tree as negligence, it is not making a statement about whether a divine agent caused the earthquake or whether the universe is purely material. Instead, it is making a practical determination about who can be summoned into a courtroom and subjected to a judgment. The law operates within a specific sphere of human interaction, and its primary function is dispute resolution rather than theological truth-seeking. So, to answer your question about what this practice presupposes, it presupposes nothing about the existence or nonexistence of a divine agent behind natural events. It simply brackets that question as outside the competence of the court.

  This becomes clearer when you look at how the law actually defines an act of God in legal terms, which is much narrower than the colloquial or theological usage. In jurisprudence, an act of God is not just any natural event, but specifically an event that is unforeseeable and unpreventable by reasonable human care. This is where your example of the dam becomes crucial. If a dam breaks during a storm, the court does not simply say the storm was natural so no one is liable. They ask whether the storm was foreseeable and whether the dam was maintained to withstand a storm of that magnitude. If the engineers were negligent, the harm is treated as human-caused, even though the trigger was natural. This shows that the legal system does not view the natural and the agential as a clean, ontological divide. Instead, it views them as a continuum of control. The law is interested in the point where human control could have intervened. If humans could have prevented the harm but did not, liability attaches. If humans could not have prevented it even with perfect care, the loss remains where it falls or is spread through insurance. The distinction is not about what caused the event in a cosmic sense, but about whether a human defendant had a duty and the capacity to stop it.

  Regarding the theological implications, the legal system is designed to be compatible with a wide variety of metaphysical beliefs, which is why it avoids making claims about divine agency. If the law were to assert that natural disasters are definitely not the actions of a god, it would be taking a theological stance that might alienate believers. Conversely, if it asserted that they are the actions of a god, it would be unable to function because it cannot adjudicate the will of the divine. So the system adopts a stance of methodological secularism. It acts as if nature is blind causal processes for the purpose of assigning liability, not because it denies the possibility of divine providence, but because divine providence is not a variable that can be managed through fines or injunctions. This allows a believer and a non-believer to stand in the same courtroom and agree on the rules of the game, even if they disagree on why the rain falls. The problem of evil remains a live theological issue for the individuals involved, but the court treats it as a moot point because it lacks the authority to summon a divine defendant or order a change in divine policy.

  You asked whether there is a coherent philosophy of evil and responsibility buried in here, or if it is just a practical kludge. The honest answer is that it is largely a practical kludge, but one that is necessary for the system to function at all. There is a coherence to it, but it is a procedural coherence rather than a philosophical one. The system is consistent in its goal, which is to minimize social conflict and allocate losses in a way that incentivizes safety. It is not consistent with a grand unified theory of causation. When the distinction breaks down, such as in cases where climate change makes previously unforeseeable natural disasters foreseeable, the law struggles and evolves. This struggle shows that the categories are not fixed truths about the world but tools that society adjusts as its capacity to predict and control nature changes. The law treats nature as blind not because it knows nature is blind, but because treating nature as a moral agent would paralyze the legal system.

  Ultimately, the friction you feel comes from expecting the legal system to provide a metaphysical account of responsibility when it is actually providing a social one. Tort law is not trying to solve the problem of evil; it is trying to solve the problem of neighbors living in close proximity. It draws a line between what we can expect each other to fix and what we must endure together. When a tree falls because of negligence, we fix it because someone could have stopped it. When a tornado strikes, we endure it because no one could have stopped it. The presence of a human agent changes the response not because the harm is different, but because the remedy is possible. The system is consistent in its pragmatism, even if it leaves the deeper philosophical questions about agency and nature unanswered. It is a framework for managing human relationships in a world full of uncertainties, and it works precisely because it refuses to answer the question of who or what is ultimately behind the storm.
