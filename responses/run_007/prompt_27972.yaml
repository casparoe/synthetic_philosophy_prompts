answer: |-
  This is a foundational task for a survey of material constitution. The literature is defined not by a single agreed-upon solution, but by a shared map of the terrain—a set of pressures that pull in opposite directions.

  Below is a structured layout of the desiderata for a theory of material constitution. I have categorized them by **Phenomenological Data** (the puzzle cases), **Logical/Metaphysical Constraints** (the rules of reasoning), and **Conceptual Distinctions** (the tools for analysis). For each, I provide the motivating consideration, its status (non-negotiable vs. optional), and the consensus/contestation landscape.

  Finally, I address your specific request regarding the **joint unsatisfiability** of these desiderata. This is the crux of the debate: the "Problem of Material Constitution" is formally an inconsistent set of claims. An adequate theory is not one that satisfies all desiderata (which is impossible), but one that explicitly identifies which desideratum it sacrifices and argues that the cost is acceptable.

  ---

  ### I. Phenomenological Desiderata (The Puzzle Cases)
  These are the "data points" a theory must account for. Note that "account for" does not always mean "validate." A theory can account for a case by explaining why our intuition about it is mistaken.

  #### 1. The Statue and the Lump (Goliath and Lumpl)
  *   **The Case:** A sculptor shapes a lump of clay into a statue. The statue seems to come into existence when the shape is achieved; the lump existed prior. The statue could not survive being squashed; the lump could.
  *   **The Consideration:** Captures the intuition that objects have different **modal properties** (persistence conditions) depending on their kind, even if they share matter and location.
  *   **Status:** **Contested.**
      *   *Consensus:* The case is the standard test bed.
      *   *Contestation:* Monists (e.g., Burke, Rea) argue the statue and lump are identical. Eliminativists (e.g., Merricks) argue neither exists. Pluralists (e.g., Baker, Fine) argue they are distinct but coincident.
  *   **Requirement Type:** **Optional Commitment.** A theory may reject the existence of one or both relata, or deny they have distinct modal profiles.

  #### 2. The Ship of Theseus
  *   **The Case:** A ship has all its planks replaced over time. The old planks are reassembled into a ship. Which is the original?
  *   **The Consideration:** Tests **persistence through change** and the relative weight of **continuity of form** vs. **continuity of matter**.
  *   **Status:** **Contested.**
      *   *Consensus:* A theory must provide truth conditions for persistence claims.
      *   *Contestation:* Whether there is a fact of the matter (Metaphysical Indeterminacy), whether identity is vague, or whether identity is relative to a sortal concept.
  *   **Requirement Type:** **Optional Commitment.** Some theories (e.g., Nihilism) deny ships persist at all. Others (Perdurantism) say both are temporal parts of a larger whole.

  #### 3. Tibbles the Cat (The Problem of the Many / Vagueness)
  *   **The Case:** Tibbles loses a tail. Is Tibbles the cat-minus-tail? If so, what about the cat-plus-tail? If we consider every possible aggregation of cat-cells, there seem to be thousands of "cat-like" objects where there is only one cat.
  *   **The Consideration:** Tests **mereological essentialism** vs. **accidental parts** and handles **ontological vagueness**.
  *   **Status:** **Contested.**
      *   *Consensus:* A theory must explain how we count ordinary objects.
      *   *Contestation:* Whether composition is restricted (Van Inwagen), unrestricted (Lewis), or never occurs (Nihilists).
  *   **Requirement Type:** **Optional Commitment.** One may deny that "Tibbles" refers to a genuine object.

  #### 4. Dion and Theon (The Stoic Paradox of Increase)
  *   **The Case:** Dion is a whole human. Theon is a proper part of Dion (Dion minus one foot). Dion's foot is amputated. Theon survives. Dion (allegedly) survives. Now they occupy the same space. Are they identical? If so, Theon became Dion. If not, coincidence.
  *   **The Consideration:** Tests the **Principle of Mereological Change** and whether proper parts can survive the loss of the whole's other parts.
  *   **Status:** **Contested.**
      *   *Consensus:* A theory must handle part-whole relations over time.
      *   *Contestation:* Whether proper parts are objects in their own right (Universalists say yes; Organists say no).
  *   **Requirement Type:** **Optional Commitment.** Many contemporary theories bypass this by denying Theon exists as an object prior to the amputation.

  #### 5. Additional Essential Case: The Bronze Statue (Modal Variation)
  *   **The Case:** Similar to Statue/Lump, but focuses on essential properties. The statue is essentially statue-shaped; the bronze is not.
  *   **The Consideration:** Motivates the distinction between **sortal-dependent** and **sortal-independent** identity.
  *   **Status:** **Contested.** (See Statue/Lump).

  ---

  ### II. Logical and Metaphysical Constraints
  These are the rules of reasoning. Denying these is theoretically possible but incurs a massive "cost," usually relegating a theory to the fringe.

  #### 1. Leibniz's Law (Indiscernibility of Identicals)
  *   **The Constraint:** If $x$ is identical to $y$, then every property of $x$ is a property of $y$ (and vice versa).
  *   **The Consideration:** This is the definition of identity in classical logic. Without it, reasoning about objects collapses.
  *   **Status:** **Non-Negotiable (with caveats).**
      *   *Consensus:* Almost universally accepted as a logical truth.
      *   *Contestation:* How properties are individuated. Temporal parts theorists argue $x$ and $y$ don't share the *same* temporal properties. Contextualists argue identity statements are context-sensitive. But the law itself is rarely denied outright.
  *   **Requirement Type:** **Non-Negotiable.** (Denial moves you into paraconsistent or non-classical metaphysics).

  #### 2. Transitivity of Identity
  *   **The Constraint:** If $x=y$ and $y=z$, then $x=z$.
  *   **The Consideration:** Required for identity to function as an equivalence relation.
  *   **Status:** **Non-Negotiable.**
      *   *Consensus:* Universal.
      *   *Contestation:* Only challenged by those proposing "relative identity" (Geach), which is a minority view.
  *   **Requirement Type:** **Non-Negotiable.**

  #### 3. Necessity of Identity (Kripke)
  *   **The Constraint:** If $x=y$, then necessarily $x=y$.
  *   **The Consideration:** Derived from Leibniz's Law + the property of "being necessarily identical to $x$."
  *   **Status:** **Strongly Preferred, but Contested.**
      *   *Consensus:* Accepted by most post-Kripkean metaphysicians.
      *   *Contestation:* Contingent identity theorists (e.g., Gibbard) argue that in constitution cases, $x$ could have been distinct from $y$.
  *   **Requirement Type:** **Optional Commitment.** A theory can function without this, but it must explain why Kripke's proof fails in material contexts.

  #### 4. Anti-Coincidence (No Two Things in One Place)
  *   **The Constraint:** Distinct material objects cannot occupy the exact same spatial region at the exact same time.
  *   **The Consideration:** Grounded in the impenetrability of matter and commonsense counting.
  *   **Status:** **Contested.**
      *   *Consensus:* Intuitively strong.
      *   *Contestation:* Pluralists (e.g., Yablo, Baker) explicitly deny this to solve the Statue/Lump case. They argue constitution is not identity, allowing coincidence.
  *   **Requirement Type:** **Optional Commitment.** Many adequate theories reject this.

  ---

  ### III. Conceptual Distinctions
  These are tools a theory may use to resolve the puzzles. A theory is not *required* to use them, but it must explain why they are unnecessary if it discards them.

  #### 1. Constitution $\neq$ Identity
  *   **The Distinction:** "Is constituted by" is a unique relation, asymmetric and irreflexive, distinct from "is identical to."
  *   **The Consideration:** Allows distinct objects (Statue, Lump) to share matter without violating Leibniz's Law (by assigning different modal properties).
  *   **Status:** **Contested.**
      *   *Consensus:* This is the dominant view among "Constitution Theorists."
      *   *Contestation:* "Identity Theorists" (Monists) argue constitution is identity, and apparent differences are explained by temporal parts or sortal-relativity.
  *   **Requirement Type:** **Optional Commitment.**

  #### 2. Sortal Dependence of Identity
  *   **The Distinction:** There is no answer to "Is $x$ the same as $y$?" without specifying a sortal concept (e.g., "the same *statue*," "the same *lump*").
  *   **The Consideration:** Resolves Ship of Theseus by allowing $x$ to be the same *ship* as $y$ but not the same *aggregate of planks*.
  *   **Status:** **Contested.**
      *   *Consensus:* Accepted by Wiggins and sortalists.
      *   *Contestation:* Rejected by Lewis and others who believe in absolute identity.
  *   **Requirement Type:** **Optional Commitment.**

  ---

  ### IV. The Joint Unsatisfiability (The Inconsistent Set)
  You asked specifically whether any subset of the desiderata is jointly unsatisfiable. **The answer is Yes.**

  The debate over material constitution is structured around an inconsistent set of claims. No theory can satisfy all the desiderata listed above simultaneously. This is often formalized as **The Problem of Material Constitution** (following Michael Burke, Theodore Sider, and others).

  Here is a standard formulation of the inconsistent pentad. **Any adequate theory must reject at least one of the following:**

  1.  **Existence:** The statue exists and the lump of clay exists. (Phenomenological Desideratum)
  2.  **Distinctness:** The statue and the lump have different properties (e.g., modal properties of survival). (Phenomenological Desideratum)
  3.  **Leibniz's Law:** If $x$ and $y$ have different properties, they are not identical. (Logical Constraint)
  4.  **Anti-Coincidence:** If $x$ and $y$ are not identical, they cannot occupy the same place at the same time. (Metaphysical Constraint)
  5.  **Monism/Uniqueness:** There is only one object here (rejecting the proliferation of objects). (Optional Commitment/Ontological Parsimony)

  **How Theories Sacrifice Desiderata:**

  *   **Constitution Pluralism (e.g., Lynne Baker):** Rejects **Anti-Coincidence (4)**. Accepts that the statue and lump are distinct, have different properties, and occupy the same place.
      *   *Cost:* Violates the intuition that two things can't be in one place.
  *   **Dominant Sorts / Monism (e.g., Michael Burke):** Rejects **Existence (1)** (of one relatum). The lump ceases to exist when the statue is formed (or vice versa).
      *   *Cost:* Violates the intuition that matter persists through reshaping.
  *   **Perdurantism / Temporal Parts (e.g., David Lewis):** Rejects **Distinctness (2)** (in a sense). The statue and lump are identical at time $t$ but differ in their temporal extensions (they are different space-time worms).
      *   *Cost:* Violates the intuition that objects are wholly present at each moment (Endurantism).
  *   **Eliminativism / Nihilism (e.g., Peter Unger):** Rejects **Existence (1)** (of both). Neither statues nor lumps exist; only simples exist.
      *   *Cost:* Radical revision of commonsense ontology.
  *   **Relative Identity (e.g., Peter Geach):** Rejects **Leibniz's Law (3)** (in its absolute form). $x$ and $y$ can be the same *thing* but not the same *statue*.
      *   *Cost:* Abandons classical logic's notion of identity.

  **Conclusion on Unsatisfiability:**
  It is **impossible** to construct a theory that validates all intuitive data (Existence, Distinctness) while maintaining all classical logical and metaphysical constraints (Leibniz's Law, Anti-Coincidence). Therefore, the mark of an "adequate" theory is not that it solves the puzzle without loss, but that it **explicitly identifies which horn of the dilemma it accepts** and provides a principled justification for why that cost is preferable to the alternatives.

  ---

  ### V. Consensus vs. Contention Map
  For your survey, it is vital to distinguish what is settled from what is fought over.

  | Claim | Status | Notes |
  | :--- | :--- | :--- |
  | **Leibniz's Law holds.** | **Settled** | Almost no one denies LL itself; they dispute property attribution. |
  | **Identity is transitive.** | **Settled** | Relative identity is a fringe view. |
  | **The "Problem" is an inconsistency.** | **Settled** | All sides agree the intuitions clash logically. |
  | **Constitution $\neq$ Identity.** | **Contested** | This is the main fault line (Pluralists vs. Monists). |
  | **Ordinary objects exist.** | **Contested** | Eliminativists deny this; Realists affirm it. |
  | **Coincidence is impossible.** | **Contested** | Pluralists accept it; Monists deny it. |
  | **Intuitions are reliable data.** | **Contested** | Experimental philosophy suggests intuitions vary by culture/expertise. |
  | **Necessity of Identity.** | **Mostly Settled** | Widely accepted, but contingent identity has defenders. |

  ### Summary for Your Introduction
  When writing your survey, frame the desiderata not as a checklist that a successful theory *ticks off*, but as a **budget of theoretical costs**.
  1.  **Logical Constraints** (LL, Transitivity) are the currency you generally cannot spend (Non-Negotiable).
  2.  **Phenomenological Intuitions** (Statue intuitions, Anti-Coincidence) are the expenses you must incur.
  3.  **The Inconsistency Proof** demonstrates that the budget does not balance.
  4.  **Adequacy** is determined by which expense the theory chooses to pay and how well it justifies that expenditure.

  This framework allows you to present competing theories (Perdurantism, Constitution View, Eliminativism, Monism) not as attempts to "solve" the puzzle in a way that makes everyone happy, but as different strategies for managing the inevitable inconsistency of the desiderata.
