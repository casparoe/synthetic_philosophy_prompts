answer: |-
  Your intuition is philosophically sound. You are describing a conflict between **formal contractuality** (written rules, signatures) and **relational obligation** (norms, shared intention, and mutual reliance). The two members are arguing from a framework of *atomic individualism* (I own my labor, therefore I own the decision), while you are operating from a framework of *collective agency* (we created something together, therefore we decide together).

  There is a robust philosophical tradition that validates your feeling that obligations exist even without a signature. Here is how you can articulate that claim, followed by what it implies for your situation.

  ### 1. The Philosophy of Joint Action (The "Plural Subject")
  The most direct philosophical rebuttal to their argument comes from the theory of **Joint Commitment**, championed by philosopher Margaret Gilbert.

  Gilbert argues that when a group of people engage in a shared activity with a common goal, they form a "plural subject." You are no longer six individuals gardening near each other; you are a single "We." This "We" is created not by a document, but by a mutual understanding of shared goals.
  *   **The Claim:** By participating in the garden *as a vegetable garden*, you entered into a joint commitment. The purpose of the garden (growing food) was constitutive of the group itself.
  *   **The Violation:** When the two members unilaterally change the fundamental purpose of the joint activity, they are not just changing a rule; they are dissolving the "We" that was formed. They are acting as individuals within a collective framework, which is a category error.
  *   **Analogy:** Imagine you are playing a duet with a pianist. Halfway through, the pianist decides to stop playing the harmony and start playing a solo drum track. They might say, "I put just as much practice into this performance as you, and we never signed a contract saying I had to play the piano." But their action destroys the *duet*. You have a right to object not because of a contract, but because the nature of the joint action has been violated.

  ### 2. The Principle of Reliance and Fair Play
  Philosopher T.M. Scanlon offers a principle of **Fidelity**, which suggests that if you intentionally lead others to expect that you will continue to act in a certain way, and they rely on that expectation to their potential detriment, you have an obligation to fulfill that expectation.

  *   **Reliance:** You and the other objectors invested labor, money, and hope based on the established norm that this was a *food-producing* space.
  *   **Fair Play:** Political philosopher John Rawls discussed the "principle of fair play." If you accept the benefits of a cooperative scheme (the vegetables, the community), you are obligated to abide by its rules—even unwritten ones—to ensure others can also benefit.
  *   **The Violation:** The two members are retroactively changing the terms of investment. They benefited from the labor of the group under the old understanding (vegetable garden) and are now leveraging that collective labor to create a private-style amenity (fire pit) that serves a different purpose. This is a form of **free-riding on the original consensus.**

  ### 3. Countering the "Labor" Argument
  The two members argue: *"We put just as many hours of labor into [the plot] as anyone else."* This relies on a Lockean view of property (mixing labor with land creates ownership). However, this ignores the **teleology** (the purpose) of that labor.

  *   **Labor is Goal-Directed:** Labor is never invested in a vacuum. You did not labor on "land"; you labored on a "vegetable garden." Their labor was accepted by the group under the condition that it served the group's goal (food).
  *   **Misappropriation:** By converting the space to a fire pit, they are effectively repurposing the *collective* labor of the past (which built the soil, the beds, the community trust) for a *private* or sub-group preference. They are claiming ownership over the *infrastructure of cooperation* itself.

  ### 4. What Follows? Do You Have a Legitimate Claim?
  Yes. You have a **moral and social claim**, even if you lack a legal one. Recognizing this changes how you should approach the conflict. You are not merely "unhappy neighbors"; you are partners in a dissolved joint enterprise seeking restitution or restoration.

  Here is what follows from this philosophical standing:

  **A. The Burden of Proof Shifts**
  In the absence of written rules, the default status quo is the *established practice*. The burden of proof lies on those who wish to change the fundamental nature of the enterprise, not on those who wish to maintain it. The two members are the aggressors against the established norm; they must justify why the joint commitment should be broken, not vice versa.

  **B. The Indifferent Member is Key**
  The sixth member says they are indifferent. In a consensus model, indifference is not a vote for change; it is an abstention. However, their indifference suggests they do not share the intense objection of the three of you. You need to appeal to the sixth member not on "preference" but on "principle." Ask them: *"Do you agree that a majority (or 2 out of 6) can unilaterally change the purpose of a shared project without the consent of the others?"* If they say no, you have a 4-vs-2 moral majority.

  **C. Legitimate Remedies**
  Since you cannot sue them, your leverage is social and structural.
  1.  **Declaration of Dissolution:** You can formally declare that their actions have dissolved the "plural subject." You can state: *"By unilaterally changing the purpose of the garden, you have ended the cooperative agreement. We are no longer partners in this specific enterprise."*
  2.  **Partition or Withdrawal of Labor:** If the land is owned by one of you, or leased, the legal owner holds the cards. If the land is truly abandoned/adverse possession (complex legally), the moral claim is all you have. You can withdraw your labor and resources. If the soil was built collectively, you can argue that removing the vegetable beds destroys the capital you all built.
  3.  **The "Walk Away" Threat is Mutual:** They say you are free to walk away. But in a community garden, the value is the *community*. If 3 out of 6 members leave and publicly state *why* (that the cooperative trust was broken), the social value of the fire pit for the remaining two is diminished. It becomes a spot where two people sit while their neighbors watch them dismantle a community project. Social pressure is a real enforcement mechanism for unwritten contracts.

  ### Summary for Your Conversation
  You might say something like this to them:

  > "You are right that we have no written contract. But a partnership isn't created by paper; it's created by shared intent. We all invested labor into a *vegetable garden*. That was the deal. By changing it to a lounge, you aren't just changing the plants; you are changing the nature of the partnership we all agreed to.
  >
  > In any cooperative venture, you cannot unilaterally change the goal post after others have invested based on the original goal. That violates the trust the project was built on. We aren't trying to tell you what to do with your free time; we are objecting to you repurposing our collective work without our consent. If we can't agree on the purpose of the garden, then the partnership is broken, and we need to discuss how to divide the assets or space fairly, rather than one subgroup simply taking over."

  **Conclusion:**
  You are not merely experiencing a preference clash. You are experiencing a **breach of joint commitment.** While you may not be able to stop them physically or legally without further escalation, you are morally justified in refusing to accept their framing. You have the right to treat their action as a dissolution of the partnership, which may give you grounds to claim a share of the resources or simply to withdraw your cooperation with a clear conscience, knowing the failure lies with the breakdown of their fidelity to the group, not your inability to "let go."
