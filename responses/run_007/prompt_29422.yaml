answer: |-
  **Elena:** You keep saying function is just what a trait *does* for the system. But consider a congenital heart defect. The valve is fused; it pumps nothing. On your causal-role view, does it have a function?

  **Marcus:** It contributes nothing to circulation in that individual. So, strictly speaking, no.

  **Elena:** That's the problem. We say the heart *has* the function of pumping blood even when it *fails* to pump. Malfunction presupposes function. If function is just actual causal contribution, a broken heart is functionless, like a stone. But it's not a stone; it's a broken heart. Your view collapses the distinction between malfunction and absence of function.

  **Marcus:** That's a fair strike. If I define function solely as actual output, I lose normativity. But I don't have to be that reductive. I can shift from *actual* cause to *dispositional* capacity. The heart's function is what it *would* do if operating within the standard organizational parameters of the organism.

  **Elena:** "Standard parameters"? That sounds like you're smuggling in a history-based norm.

  **Marcus:** Not history, but structure. I need to clarify my view: function isn't just what happens, but what a trait is *organized* to do within the containing system. So, my revision is this: Causal-role functions are dispositional capacities defined by the system's architecture, not just transient outputs. That allows me to say the broken heart has the function because it retains the architecture, even if the performance fails.

  **Elena:** You've saved malfunction, but you've opened yourself up to novelty. Imagine a random mutation creates a new enzyme that neutralizes a novel toxin. It saves the organism immediately. It has no history of selection. On my selected-effects view, it lacks a function because it hasn't been selected *for* that effect yet. But intuitively, it's doing something functional *now*.

  **Marcus:** Exactly. It contributes to survival immediately. If you wait for selection, you're ignoring the present reality of the organism's viability. My dispositional account handles this easily: the enzyme plays a causal role in survival now. Yours makes function retrospective only.

  **Elena:** I concede that strictly speaking, the *token* trait has no etiological function yet. But I need to refine my position to avoid sounding absurd. I distinguish between trait tokens and trait types. This specific enzyme molecule is a token of a type. If the *type*—the structural configuration—has been selected in ancestors, it has a function. If it's truly novel, I should say it has a *potential* function, or that it is *functional*, but not yet that it *has a function* in the teleological sense.

  **Marcus:** So you admit it's functional, just not "functioned"?

  **Elena:** Precisely. My revision is this: Selected-effects apply primarily to trait types across lineages. For novel tokens, we speak loosely. But this protects the normativity. The enzyme isn't *supposed* to neutralize the toxin yet; it just happens to. That distinction matters for understanding disease versus health.

  **Marcus:** But consider the nose. It supports eyeglasses. It causally contributes to my vision correction. Is that a function?

  **Elena:** Clearly not. And my view explains why instantly. No one was selected for having a nose that holds glasses. It's a mere beneficial accident.

  **Marcus:** Here's where my view needs work. The nose *does* causally contribute to holding glasses. If function is causal contribution within a system, why isn't this a function? I can't just say "because it wasn't selected." I need a non-historical filter.

  **Elena:** What filter?

  **Marcus:** I have to appeal to systemic integration. Holding glasses isn't integrated into the physiological regulatory loops of the body. The body doesn't adjust the nose to maintain the glasses. So, I need to clarify my account: Causal-role functions are contributions that are *exploited* by the containing system's organization. The visual system exploits the glasses, but it doesn't exploit the nose's rigidity; it just relies on it passively.

  **Elena:** "Exploited" is doing a lot of heavy lifting. How do you define exploitation without implying design?

  **Marcus:** Through feedback mechanisms. If the system regulates the trait to maintain the effect, it's a function. If not, it's an accident.

  **Elena:** But that seems too narrow. Bones support muscles without active regulation of the bone's hardness in real-time.

  **Marcus:** Then perhaps "integration" is better than "regulation." The support of glasses is external to the biological system's boundary, whereas bone support is internal. I'm refining the view: Causal roles count as functions only when they contribute to the goals of the *internal* self-maintaining system.

  **Elena:** And who defines the boundary of the internal system? Often, we define the system by what functions it contains. You risk circularity.

  **Marcus:** And you risk emptiness. If a trait appears tomorrow that saves the species, you say it has no function until it dies and reproduces?

  **Elena:** I say it has no *teleological* function. It has causal efficacy. The difference is why we care. I care about history because that explains why the trait is *here* rather than gone. You care about current utility because that explains how the organism *survives*.

  **Marcus:** So we agree on the nose: it's not a function. But for different reasons. For you, it's lack of history. For me, it's lack of systemic integration.

  **Elena:** And that's the crux. For me, function is essentially backward-looking. It's about ancestry. For you, it's forward-looking or present-looking. It's about capacity.

  **Marcus:** Which means we disagree on the novel enzyme. You say it's functionless until selected. I say it's functional immediately.

  **Elena:** And I say that "functional" isn't the same as "has a function." You've blurred the line between doing good work and having a job.

  **Marcus:** And you've made having a job dependent on tenure rather than performance.

  **Elena:** Not tenure. Lineage.

  **Marcus:** We haven't collapsed into each other.

  **Elena:** No. You still need history to define the "standard system" for your malfunction case. You admitted that earlier.

  **Marcus:** Only to define the architecture, not the normativity. The normativity comes from the system's current viability.

  **Elena:** But the system's viability is only a norm if you assume the system *ought* to survive. Why it ought to is an evolutionary question.

  **Marcus:** And why the architecture is "standard" is a historical question. We're both borrowing from the other's toolbox.

  **Elena:** But the core remains. I anchor function in the past. You anchor it in the present organization.

  **Marcus:** And until we agree on whether biology is fundamentally a historical science or a systemic one, we'll keep disagreeing on the broken heart and the new enzyme.

  **Elena:** Pass the sugar. My function is to sweeten the coffee.

  **Marcus:** Only if the coffee system exploits the sugar. Otherwise, it's just an accident.

  **Elena:** Don't start.
