  # JOINT STATEMENT OF CONSENSUS AND DISSSENSUS
  **Subject:** Normative Foundations of Decision Under Uncertainty
  **Signatories:** Proponent of Subjective Expected Utility (SEU) | Proponent of Imprecise Probabilities (IP)
  **Date:** October 26, 2023
  **Context:** Adversarial Collaboration Workshop on Decision Theory

  ## PREAMBLE
  This document records the results of an adversarial collaboration between two distinct normative frameworks for decision-making under uncertainty. We distinguish between mathematical theorems, empirical stylized facts, and normative commitments. We agree that mathematical results constrain but do not dictate normative theory, and that empirical regularities (such as ambiguity aversion) describe behavior but do not settle rationality. The following sections delineate our shared understanding of the landscape, our precise points of divergence, and the specific empirical or theoretical cruxes that bear on our disagreement.

  ---

  ## PART I: AGREED CLAIMS
  *The following propositions are accepted by both signatories as accurate descriptions of the respective frameworks, mathematical results, and the current state of the literature.*

  1.  **Representational Capacity:**
      *   The SEU framework represents belief as a single, precise probability measure and preference as a complete ordering maximizing expected utility relative to that measure.
      *   The IP framework represents belief as a convex set of probability measures (a credal set) or via coherent lower and upper previsions, and allows preference orderings to be incomplete (i.e., some acts are rationally incomparable).
      *   **Agreement:** Any choice behavior representable by SEU is a special case of IP (where the set contains a single measure). However, IP can represent states of indeterminacy that SEU cannot represent without assigning precise confidence where none is warranted by the evidence.

  2.  **The Ellsberg Pattern:**
      *   **Stylized Fact:** In controlled settings (e.g., the two-urn paradox), a robust majority of subjects prefer bets on known probabilities over bets on unknown probabilities, violating the Sure Thing Principle.
      *   **Agreement:** This pattern is inconsistent with SEU axioms. SEU classifies this pattern as irrational. IP classifies this pattern as potentially rational (reflecting indeterminacy). Both agree the pattern exists; they disagree on its normative status.

  3.  **Mathematical Facts on Dilation:**
      *   **Definition:** Dilation occurs when, for a given event $E$ and a partition $\mathcal{P}$, the lower probability of $E$ decreases and the upper probability of $E$ increases after conditioning on any member of $\mathcal{P}$.
      *   **Agreement:** Dilation is a mathematically proven consequence of standard IP updating rules (e.g., generalized Bayes) applied to certain credal sets. Both sides agree the mathematics is correct. The disagreement concerns whether dilation indicates a flaw in the updating rule or a faithful representation of how information can degrade decision-relevant precision.

  4.  **Coherence and Dutch Books:**
      *   **SEU Standard:** Avoiding a Dutch book (a set of bets guaranteeing a loss) requires beliefs to satisfy the axioms of probability and preferences to satisfy independence/completeness.
      *   **IP Standard:** Avoiding *sure loss* requires lower/upper previsions to be coherent (satisfying specific linearity and dominance axioms), but does not require a single price for every bet.
      *   **Agreement:** Both frameworks possess internal coherence criteria. A Dutch book argument succeeds against an agent only if the agent commits to buying/selling prices that violate that framework's specific coherence criteria. SEU argues IP agents are vulnerable to dynamic Dutch books; IP argues this vulnerability arises only if one imposes SEU-style commitment rules on IP structures.

  5.  **Verbal and Representational Distinctions:**
      *   **Agreement:** A portion of our disagreement stems from differing definitions of "belief."
          *   For SEU, "belief" is defined operationally as the betting quotient an agent is disposed to accept.
          *   For IP, "belief" is defined as the constraints on betting quotients imposed by evidence, where the agent may refuse to name a specific quotient.
      *   **Agreement:** When SEU proponents speak of "uncertainty," they often refer to entropy or variance within a precise distribution. When IP proponents speak of "uncertainty," they often refer to the spread between lower and upper probabilities (imprecision). These are distinct concepts that are sometimes conflated in debate.

  ---

  ## PART II: DISAGREEMENTS TABLE
  *This table isolates the normative and theoretical divergences. For each issue, we state the position in language the holder accepts and in language the opponent recognizes as a fair characterization.*

  | Issue | SEU Position (Precise) | IP Position (Fair Characterization) | IP Position (Precise) | SEU Position (Fair Characterization) | Verbal/Conceptual Component? |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1. Completeness of Preference** | **Claim:** A rational agent must have a complete preference ordering over all feasible acts. <br>**Reason:** Incompleteness implies the agent cannot choose, or chooses arbitrarily, which violates rational agency. | **SEU Interpretation:** The IP theorist claims it is rational to be unable to choose between two options even when forced, which SEU views as a failure of agency. | **Claim:** A rational agent is permitted (and sometimes required) to have incomplete preferences when evidence does not support a precise ranking. <br>**Reason:** Forcing a ranking invents information not present in the evidence. | **IP Interpretation:** The SEU theorist claims an agent must manufacture a precise preference even when evidence is sparse, which IP views as epistemic dishonesty. | **Yes.** Disagreement on whether "rational choice" requires *comparability* (SEU) or merely *non-dominance* (IP). |
  | **2. Sets vs. Second-Order Probability** | **Claim:** A set of probabilities is mathematically reducible to a second-order probability distribution (a distribution over priors), which collapses to a single precise prior via integration. <br>**Implication:** IP is unnecessary complexity. | **SEU Interpretation:** The IP theorist treats a set of priors as fundamental, ignoring that uncertainty about the prior is itself uncertainty that can be probabilized. | **Claim:** A credal set is *not* a second-order distribution. It represents a constraint on admissible priors, not a probability density over them. <br>**Implication:** Collapsing the set imposes precision not warranted by the evidence. | **IP Interpretation:** The SEU theorist treats indeterminacy as risk, assuming a higher-order distribution exists even when there is no basis to specify it. | **Yes.** Disagreement on the ontology of "higher-order uncertainty." SEU treats it as risk; IP treats it as ambiguity. |
  | **3. Dilation (Updating)** | **Claim:** Dilation is a *reductio ad absurdum* of IP conditioning. <br>**Reason:** Rational learning should not increase ignorance. If an update rule guarantees wider intervals regardless of data, the rule is defective. | **SEU Interpretation:** The IP theorist accepts that an agent can become *less* certain after receiving free, relevant information, which contradicts the value of information. | **Claim:** Dilation is a correct consequence of honest updating under indeterminacy. <br>**Reason:** It reflects that the signal's relevance is unknown; precision should not increase if the link between data and hypothesis is ambiguous. | **IP Interpretation:** The SEU theorist assumes information always reduces uncertainty, ignoring cases where data reveals the model itself is unreliable. | **No.** This is a substantive normative clash regarding the "Value of Information" theorem. |
  | **4. Permissible Decision Rules** | **Claim:** Maximization of Expected Utility (MEU) is the only rationally permissible rule. <br>**Reason:** Alternatives (e.g., Maxmin) violate dominance or dynamic consistency. | **SEU Interpretation:** The IP theorist permits decision rules that sometimes reject a gamble with positive expected utility relative to all priors in the set, or violate dynamic consistency. | **Claim:** Rules such as Maxmin Expected Utility, E-admissibility, or Interval Dominance are permissible. <br>**Reason:** MEU is too demanding when probabilities are indeterminate; protection against worst-case scenarios is rational. | **IP Interpretation:** The SEU theorist forbids caution (Maxmin) in the face of ambiguity, requiring the agent to ignore the spread of the credal set. | **Partial.** Partly verbal (definition of "rational caution"), partly substantive (dynamic consistency requirements). |

  ---

  ## PART III: CRUCES TABLE
  *This table identifies concrete scenarios, protocols, or arguments that bear on our disagreements. We record our current verdicts and specify in advance what would constitute a reason to revise our position.*

  | Crux Case / Protocol | Description of the Test | SEU Prediction / Verdict | IP Prediction / Verdict | Condition for Revision (SEU) | Condition for Revision (IP) |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1. Dynamic Ellsberg with Buy/Sell Prices** | A sequential Ellsberg urn task where agents must post buying and selling prices for bets at each stage. Incentives are transparent and incentive-compatible. | **Verdict:** Agents who display ambiguity aversion will expose themselves to a dynamic Dutch book (sure loss) across the sequence. <br>**Prediction:** Rational agents will converge to SEU choices to avoid loss. | **Verdict:** Agents can maintain incomparable prices (bid-ask spread) without incurring sure loss, provided they do not commit to both sides simultaneously. <br>**Prediction:** Rational agents will maintain spreads. | If IP-defending agents can demonstrate a strategy that maintains ambiguity aversion spreads *and* avoids sure loss in a fully liquid, sequential market. | If IP-defending agents consistently incur sure losses in this protocol that cannot be explained by transaction costs or execution errors. |
  | **2. The Dilation Information Purchase** | An agent faces a dilation scenario (e.g., Walley's example). Before observing the signal, the agent is offered the option to pay a small cost to *avoid* receiving the signal. | **Verdict:** An SEU agent will never pay to avoid free information. An IP agent using standard updating will pay to avoid information to prevent dilation. <br>**Normative Claim:** Paying to avoid information is irrational. | **Verdict:** An IP agent may rationally pay to avoid information if the post-update credal set is too imprecise to make a profitable decision. <br>**Normative Claim:** Avoiding "confusing" information is rational. | If it can be shown that the IP agent who pays to avoid information achieves higher long-run utility in a repeated environment than the SEU agent who accepts all information. | If it can be shown that the dilation effect is an artifact of a specific, avoidable updating rule (e.g., generalized Bayes) and that an alternative IP rule avoids dilation without collapsing to SEU. |
  | **3. Naive Maxmin in Sequential Betting** | A three-stage betting protocol designed such that a "Naive Maxmin" agent (re-optimizing at each step without anticipating future indeterminacy) accepts a sequence of bets guaranteeing a loss. | **Verdict:** This proves IP decision rules are dynamically inconsistent and irrational. <br>**Claim:** Only SEU guarantees dynamic consistency. | **Verdict:** This proves *Naive* Maxmin is flawed, not IP itself. A "Sophisticated" IP agent (anticipating future indeterminacy) will reject the initial bet. <br>**Claim:** Dynamic consistency is achievable in IP via sophisticated choice. | If a coherent "Sophisticated IP" rule is demonstrated that avoids the Dutch book without collapsing back into a single precise prior (SEU). | If the only way to avoid the sequential Dutch book is to commit to a single prior at the start, effectively forcing the IP agent to become an SEU agent. |
  | **4. Rational Incomparability Test** | A choice between two complex acts where evidence for each is sparse and orthogonal (e.g., betting on unrelated, poorly understood scientific hypotheses). Agents are allowed to select "No Preference." | **Verdict:** "No Preference" is indistinguishable from indifference. If forced to choose (removing the opt-out), the agent must pick one. Refusal is irrational. <br>**Claim:** Indifference and incomparability are behaviorally identical under forced choice. | **Verdict:** "No Preference" (incomparability) is distinct from indifference. Under forced choice, a randomizer or tie-breaker is required, but the *underlying preference* remains incomplete. <br>**Claim:** Forced choice masks the underlying rational state. | If a protocol is devised where an agent claiming incomparability makes a sequence of choices that is dominated by an agent claiming indifference, controlling for risk attitude. | If it is demonstrated that representing the state as "indifference" (SEU) leads to better decision outcomes than representing it as "incomparability" (IP) in high-stakes, low-data environments. |

  ---

  ## SIGNATURES

  **Subjective Expected Utility Proponent:** ______________________

  **Imprecise Probabilities Proponent:** ______________________

  **Date:** ______________________
