      *   *Counterpart Theory (CT):* David Lewis's view. Individuals are world-bound. $x$ in $w_1$ has a counterpart $y$ in $w_2$ based on similarity.
      *   *Semantics:*
          *   TWI: "She could have been a surgeon" = There is a world $w$ where *she* (the very same entity) exists and is a surgeon.
          *   CT: "She could have been a surgeon" = There is a world $w$ where a *counterpart* of her exists and is a surgeon.
      *   *Key Distinction:* Identity ($=$) vs. Counterpart Relation ($C$).

  3.  **Deconstruct Task 2: Arguments for CT (Accidental Intrinsics):**
      *   *The Problem:* If $x$ exists in $w_1$ (bent) and $w_2$ (straight), and $x$ is identical in both, then $x$ is both bent and straight. Contradiction (unless properties are relativized to worlds, which Lewis argues destroys the intrinsic nature).
      *   *Lewis's Solution:* Different individuals ($x$ in $w_1$, $y$ in $w_2$). No contradiction.
      *   *TWI Resistance:* Relativize properties (being-bent-at-$w_1$). Or treat worlds as abstract states of affairs where the object has properties relative to the state.
      *   *Cost:* TWI must give up the idea that properties are simple monadic intrinsics. They become relations to worlds.

  4.  **Deconstruct Task 3: Objections to CT (The "De Re" Intuition):**
      *   *The Complaint:* When I say "I could have won," I mean *me*, not some guy who looks like me. CT seems to change the subject.
      *   *The Reply:* CT captures the truth conditions without the metaphysical baggage. The "aboutness" is pragmatic/semantic, not ontological.
      *   *Preservation vs. Revision:* It's a revision of the *metaphysics* of modality, claiming to preserve the *truth* of the statements. It admits the intuition of strict identity is mistaken.

  5.  **Deconstruct Task 4: Genuine Divergences:**
      *   *Essential/Accidental:* TWI often leads to essentialism (Kripke: origin is essential). CT makes essence context-dependent (depends on which similarities matter).
      *   *Equivalence Relation:* Identity is transitive/symmetric/reflexive. Counterpart relation is *not* necessarily transitive (A like B, B like C, A not like C). This allows for "fission" cases.
      *   *Context:* CT relies heavily on context/similarity metrics. TWI relies on rigid designation.
      *   *Stipulation vs. Discovery:* TWI: We track the object. CT: We select a counterpart based on interests.

  6.  **Deconstruct Task 5: CT vs. Modal Realism:**
      *   *Common Confusion:* Lewis is a Modal Realist (concrete worlds). But CT is a semantic/metaphysical thesis about *identity*.
      *   *Compatibility:* You can have CT with abstract worlds (Plantinga-style ersatzism). You just treat worlds as maximal consistent sets of propositions and individuals as world-bound abstract essences.
      *   *Verdict:* CT does not require concrete realism.

