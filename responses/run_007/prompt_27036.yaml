answer: |-
  You have identified a genuine and significant phenomenon in the philosophy and practice of biology. You are correct that "species pluralism" is not quite the right label: pluralism is typically a metaphysical or epistemological stance (claiming that multiple species concepts *ought* to exist), whereas you are describing a *methodological and rhetorical practice* (moving between them silently within a single argument).

  There is no single, universally established term for this specific practice in the literature. However, it sits at the intersection of several well-defined concepts in the philosophy of science. Below is an analysis of the nearest existing concepts, why they fall short, and a proposal for a precise term to describe what you are seeing.

  ### Nearest Existing Concepts

  **1. Species Pluralism (specifically Functional Pluralism)**
  *   **What it is:** The philosophical thesis that there is no single "true" species concept because different concepts serve different scientific interests (e.g., the Biological Species Concept for ecology, the Phylogenetic Species Concept for systematics).
  *   **How it differs:** Pluralism is usually a high-level justification for why the *field* contains multiple concepts. It does not describe the *micro-practice* of a single author toggling between them within one text. Pluralism says "both concepts are valid"; your observation is "both concepts are being used simultaneously to do different work."

  **2. Boundary Objects**
  *   **What it is:** A concept from Science and Technology Studies (Star & Griesmer) describing terms that are "plastic enough to adapt to local needs... yet robust enough to maintain a common identity across sites." "Species" is often cited as a boundary object between conservationists, geneticists, and taxonomists.
  *   **How it differs:** Boundary object theory usually explains communication *between* different social groups or disciplines. You are observing the friction and flexibility *within* a single document or argument. While related, "boundary object" describes the term's social stability, not the author's deliberate conceptual shifting.

  **3. Operationalism**
  *   **What it is:** The doctrine that a concept is defined by the operations used to measure it.
  *   **How it differs:** Operationalism suggests a rigid link between concept and method. In the papers you are reading, the *ontology* shifts (what the species *is*), not just the measurement. Furthermore, operationalists typically demand consistency; the practice you see embraces inconsistency for utility.

  **4. Equivocation (The Fallacy)**
  *   **What it is:** In logic, using a term in two different senses within an argument to mislead or derive a false conclusion.
  *   **How it differs:** Equivocation is pejorative; it implies error or deception. You have correctly noted that this practice is not sloppiness—it is *productive*. The argument succeeds *because* of the shift, not in spite of it. Calling it equivocation would miss the functional value.

  ### Proposed Term: Functional Concept Switching

  I propose the term **Functional Concept Switching** (FCS).

  This term captures the deliberate, utility-driven nature of the practice without implying the metaphysical commitment of "pluralism" or the negative connotation of "equivocation."

  #### Definition
  **Functional Concept Switching** is the deliberate, often unflagged deployment of incompatible conceptual definitions within a single argumentative framework, where the definition of a key term is shifted to optimize explanatory power or practical utility for specific sub-tasks of the inquiry.

  In the context of your observation: The author treats "species" as a *reproductive unit* when modeling gene flow (because that concept predicts genetic mixing) and as a *diagnosable lineage* when arguing for conservation (because that concept justifies legal protection), without pausing to reconcile the ontological contradiction.

  #### Boundary Cases

  To ensure this term is useful for your reporting, it is crucial to distinguish it from adjacent practices:

  | Practice | Key Characteristic | Distinction from Functional Concept Switching |
  | :--- | :--- | :--- |
  | **Sloppiness / Ambiguity** | Unconscious inconsistency. | In FCS, the shift is **productive**. If you forced consistency, the argument would weaken. In sloppiness, forcing consistency would clarify the argument. |
  | **Explicit Operationalism** | "In Section 1 we define X as... In Section 2 as..." | FCS is characterized by the **lack of flagging**. The switch is implicit, relying on the reader's intuition that the *function* dictates the *definition*. |
  | **Theoretical Pluralism** | "There are many valid ways to define species." | This is a **metaphysical claim** about the world. FCS is a **methodological practice** within a text. One can be a monist (believing in one true species) but still engage in FCS for pragmatic reasons. |
  | **Boundary Object Usage** | Using a term to bridge two *communities*. | FCS occurs within a single *reasoning process*. Boundary objects are about social cohesion; FCS is about argumentative utility. |

  ### Why This Matters for Your Coverage

  Identifying **Functional Concept Switching** allows you to critique or explain scientific papers with greater nuance.

  1.  **It defends scientists against charges of inconsistency.** When a critic says, "You called them one species here and two there," the scientist can reply (implicitly), "We were engaging in Functional Concept Switching to address different biological realities."
  2.  **It highlights the tool-like nature of scientific concepts.** It reinforces the idea that in biology, concepts like "species" are not mirrors of nature, but instruments for specific jobs (counting, breeding, conserving).
  3.  **It identifies a risk.** While often productive, FCS can become dangerous if the conclusions of one section (e.g., "these are distinct lineages") are quietly carried over to another section where that definition no longer applies (e.g., "therefore they do not interbreed"). Spotting *illegitimate* Functional Concept Switching is a powerful journalistic tool for identifying overreach in scientific claims.

  ### Summary for your Notes
  *   **Phenomenon:** Using incompatible definitions of "species" within one paper to serve different argumentative goals.
  *   **Not:** Species Pluralism (too metaphysical), Equivocation (too negative), or Sloppiness (too unintentional).
  *   **Term:** **Functional Concept Switching**.
  *   **Core Logic:** The definition follows the function.
  *   **Journalistic Angle:** This practice reveals that biological categories are often pragmatic tools rather than rigid natural kinds. When done well, it solves complex problems; when done poorly, it masks logical gaps.

  This terminology should give you the precision to discuss this practice without getting bogged down in the broader, messier debate of the "Species Problem."
