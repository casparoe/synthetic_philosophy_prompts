  ### Predictions for the New Cases

  Based on the pattern of her published verdicts, here are the predicted judgments for the three new cases:

  1.  **Granite Boulder:** **No Composition.** (There is no object here, only minerals arranged boulder-wise).
  2.  **Functioning Wristwatch:** **No Composition.** (There is no object here, only parts arranged watch-wise).
  3.  **Perfused Dog Leg:** **No Composition.** (There is no object here, only living tissue arranged leg-wise).

  ### Candidate Rules

  Two candidate principles fit her published verdicts equally well. Both explain why the dog, tree, and bacterium exist (positives) while the dune, bricks, and cards do not (negatives), but they diverge on the underlying metaphysical criterion.

  **Candidate 1: Strict Organicism (The "Life" Rule)**
  *   **Rule:** Composition occurs if and only if the activity of the parts constitutes a single biological *life*.
  *   **Fit:** This perfectly matches the positives (all are organisms) and the negatives (none are organisms). It explains the rejection of the dune (natural but not alive) and the bricks (functional potential but not alive).
  *   **Philosophical Pedigree:** This is the view famously defended by Peter van Inwagen.

  **Candidate 2: Strong Causal Integration (The "Unity" Rule)**
  *   **Rule:** Composition occurs if and only if the parts are bound by strong, intrinsic causal forces into a stable, unified whole that resists entropy.
  *   **Fit:** This fits the positives (organisms are causally integrated). It fits the negatives because the dune, pile of bricks, and deck of cards are held together by weak extrinsic forces (gravity, friction, proximity) and lack internal causal unity. The handshake and flock are transient or lack physical integration.
  *   **Philosophical Pedigree:** This resembles neo-Aristotelian hylomorphism or moderate restrictivism that allows for natural solids and artifacts.

  ### Predictions by Rule

  | Case | Candidate 1 (Organicism) | Candidate 2 (Causal Integration) |
  | :--- | :--- | :--- |
  | **Granite Boulder** | **No** (Not alive) | **Yes** (Crystalline structure is causally unified) |
  | **Functioning Watch** | **No** (Not alive) | **Yes** (Mechanically integrated system) |
  | **Perfused Leg** | **No** (Not a whole life) | **Yes** (Biologically integrated tissue) |

  ### Which Case Does the Most Work?

  The **Functioning Wristwatch** would do the most work in telling the candidates apart.

  While the Boulder and the Leg also distinguish the rules, they admit of ambiguous interpretations that a clever metaphysician could navigate. An Organacist might struggle to explain why a *Boulder* doesn't exist if a *Dog* does, as both are natural objects; a verdict of "Yes" on the boulder would force a shift to a "Natural Kind" view rather than pure Organicism. Similarly, the *Leg* is biological material; an Organacist might waffle on whether "life processes" alone are sufficient, even without a whole organism.

  The **Watch**, however, is unmistakably artificial and non-biological. A "Yes" verdict here would instantly falsify Strict Organicism, as it grants existence to an artifact. A "No" verdict strongly reinforces Organicism, as it requires the rival Causal Integration rule to add an ad hoc caveat excluding artifacts despite their functional unity. It is the cleanest test of whether her restrictivism is based on *biology* or *structure*.

  ### My Bet

  I would bet on **Candidate 1: Strict Organicism**.

  The specific cluster of her positive cases (Dog, Oak, Bacterium) is the distinct fingerprint of the "Life" criterion. If she were a Causal Integration theorist, she would likely have included at least one inanimate natural object (like a star or a stone) in her positive list to demonstrate that life isn't the *only* path to unity. The fact that her positives are exclusively biological organisms, combined with the explicit rejection of the dune (a natural non-organism), suggests she draws the line at the boundary of life itself.

  ### The Settling Case

  To settle the matter most cleanly, I would present her with the case of **A Freshly Deceased Dog.**

  *   **The Case:** The same dog from her positive verdicts, one minute after death, before decomposition has begun. The parts are arranged exactly as they were when it was alive.
  *   **Candidate 1 (Organicism) Predicts:** **No Composition.** The "life" has ceased, so the object ceases to exist. The parts remain, but the whole is gone.
  *   **Candidate 2 (Causal Integration) Predicts:** **Yes Composition.** The structural and causal unity of the parts remains intact despite the cessation of metabolic function. The object persists until decomposition breaks the integration.

  This case isolates the variable of "Life" from "Structure." Since the physical arrangement is identical to the living dog, any change in verdict must be due to the presence or absence of biological life, providing a definitive test between the two rules.
