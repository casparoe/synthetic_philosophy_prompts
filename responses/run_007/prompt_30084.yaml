answer: |-
  **Project Title:** The Value-Relativity of Impact Measures: An Axiomatic Analysis

  **Project Description**
  A central promise of low-impact AI research is the ability to define "avoiding side effects" without specifying a full human utility function. Impact measures such as Attainable Utility Preservation and Relative Reachability aim to penalize unnecessary changes to the environment, ostensibly allowing an agent to pursue goals safely without knowing exactly what humans value. However, these measures rely on hidden normative parameters: reachability requires a metric over states (defining which states are "the same"), attainable utility requires a distribution over reward functions, and nearly all measures require a baseline policy (defining what counts as "doing nothing"). Selecting these parameters appears to require value judgments equivalent to the problem they aim to bypass.

  **Research Question**
  This project asks: **Is the concept of a "side effect" irreducibly value-relative?** Formally, does there exist an impact measure $I$ satisfying a minimal set of coherence axioms that is invariant to all value functions outside a trivial set? If no such measure exists, what is the minimal value input (e.g., a partial ordering over states, a specific baseline class) required to define a non-trivial impact measure?

  **Background and Gap**
  Existing literature proposes specific impact measures and demonstrates their sufficiency for reducing side effects in benchmark environments. However, these works leave the necessity of their value assumptions open. They treat baselines and state metrics as hyperparameters rather than normative commitments. Consequently, it remains unknown whether these value inputs are artifacts of current constructions or fundamental requirements of the concept itself. Without a necessity result, we cannot know if we are close to value-neutral safety or if the problem dissolves into value specification.

  **Methodology**
  I will employ an axiomatic approach analogous to social choice theory or measurement theory. 
  1.  **Axiomatization:** Define a set of desiderata for a "value-neutral" impact measure (e.g., invariance to reward scaling, sensitivity to irreversible changes, independence from specific goal structures).
  2.  **Impossibility/Representation Theorem:** Attempt to prove that any measure satisfying these axioms is mathematically equivalent to preserving some implicit partial value ordering. Alternatively, I will attempt to construct a counter-example measure that satisfies the axioms without value input.
  3.  **Minimal Input Characterization:** If value-relativity is proven, I will characterize the minimal structure required (e.g., "any valid measure requires at least a binary classification of states as 'acceptable' or 'unacceptable'").

  **Scope and Feasibility**
  This project is scoped for a one-year fellowship by restricting the initial formalization to finite, deterministic MDPs. This avoids the complexities of function approximation and stochasticity while preserving the core theoretical tension. 
  *   **Success:** A formal theorem proving that impact measurement requires minimal value input, or a constructed measure proving otherwise.
  *   **Failure:** Inability to agree on a stable set of axioms that capture the intuitive notion of "side effects" without begging the question.

  **Confidence and Uncertainty**
  I am highly confident in the framing that current measures sneak value in via baselines and metrics. The single point I am least sure of is the selection of the critical axiom that forces the impossibility result; it is possible that a weak enough set of axioms allows for a value-neutral measure that is nonetheless too weak to be useful, requiring a refinement of what counts as a "useful" impact measure.

  Summary: This project will formally determine whether defining AI side effects is possible without value judgments or if safety inherently requires minimal normative input.
