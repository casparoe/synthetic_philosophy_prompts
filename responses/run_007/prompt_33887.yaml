answer: |-
  This is a fantastic pedagogical approach. By phenomenologically isolating the *feeling* of obligation before introducing the *theory* of obligation, you prevent students from simply matching keywords to philosophers. They will have lived data to contest or confirm the theories.

  Here is the design for **"The Binding Protocol,"** structured across two class sessions.

  ### The Setup: Session 1 (75 Minutes)
  **Goal:** Create the promises, vary the conditions, and establish the stakes without revealing the philosophical point.

  **0:00–0:10: The Cover Story**
  Tell the class this is an experiment on "behavioral economics and commitment devices." Do not mention moral philosophy yet. Explain that you are studying how different formalities affect follow-through on low-stakes tasks.
  *   **Task:** They must bring a specific item to the next class (e.g., "A Fun Size Snickers bar" or "A printed copy of a specific meme").
  *   **Constraint:** It must cost under $2 and take under 5 minutes to acquire.

  **0:10–0:25: Pairing and Protocols**
  Divide the 15 students into 7 pairs and 1 trio. Assign each pair a **Protocol Card** (sealed envelopes work well for gravitas).
  *   **Protocol A (Naked):** Look your partner in the eye and say, "I will bring the item." No other words.
  *   **Protocol B (Speech-Act):** Look your partner in the eye and say, "I *promise* I will bring the item."
  *   **Protocol C (Ritual):** Say "I promise" AND shake hands firmly for 3 seconds.
  *   **Protocol D (Written):** Write the promise on a slip of paper, sign it, and hand it to the partner.
  *   **Protocol E (Witness):** Make the verbal promise while a third student (the witness) watches silently.
  *   **Protocol F (Public):** Write the promise on the whiteboard with your names next to it.
  *   **Protocol G (Deposit):** Partner holds your student ID card (or $5) until you deliver the item next session. *(Check university policy on holding IDs; if risky, use a 'social deposit' where they must post a selfie commitment to a class Slack/Canvas channel).*

  **0:25–0:45: The Execution**
  Give them 5 minutes to execute their protocol. They must treat it seriously. Walk around and ensure Protocol C shakes are actually 3 seconds, Protocol D slips are actually signed, etc.
  *   **Crucial Instruction:** "Do not discuss your protocol with other pairs. This contaminates the data."

  **0:45–1:00: Baseline Survey**
  Hand out index cards. Ask them to answer anonymously:
  1.  On a scale of 1–10, how obligated do you feel right now?
  2.  Why? (One sentence).
  3.  Do you intend to bring the item? (Yes/No/Maybe).
  *Collect these. Do not look at them yet.*

  **1:00–1:15: The Cliffhanger**
  Dismiss class. Tell them: "You will receive an email within 48 hours. Your response to that email is part of the experiment. Do not talk to your partner about the task until Session 2."

  ---

  ### The Intervention: Between Sessions
  **Timing:** Send the email 24 hours before Session 2.
  **Subject:** Update regarding Behavioral Experiment [Course Number]

  **Body:**
  > "Thank you for participating in Session 1.
  >
  > **New Information:** Due to a scheduling conflict, many students have reported that acquiring the item now conflicts with a high-priority study session or work shift immediately before class.
  >
  > **Update:** You are officially **released** from the requirement. You will not be penalized if you do not bring the item. However, your partner is still expecting you to bring it unless you notify them otherwise.
  >
  > Please make your own choice based on your current priorities.
  >
  > Best,
  > [Instructor Name]"

  **Why this email works:** It removes *external* punishment (you won't fail them) but maintains *internal/interpersonal* pressure (the partner still expects it). This isolates moral obligation from institutional compliance.

  ---

  ### The Reveal: Session 2 (75 Minutes)
  **Goal:** Debrief the experience and generate philosophical categories from their reasons.

  **0:00–0:15: The Tally**
  Do not start a lecture. Ask for a show of hands.
  *   "Who brought the item?"
  *   "Who did not?"
  *   Break it down by Protocol (ask A's to raise hands, then B's, etc.).
  *   *Note:* If everyone brought it, the game 'failed' but the data is still good (why did you feel bound despite the release?). If no one brought it, ask why they felt *no* bind.

  **0:15–0:45: Small Group Autopsy**
  Mix the groups. Put a Protocol A student with a Protocol F student.
  **Prompt:** "You were released from the task. If you kept the promise, why? If you broke it, why? Was it the words? The paper? The person? The embarrassment?"
  **Task:** Write the top 3 reasons for keeping/breaking on the board.

  **0:45–1:15: The Philosophical Map (Socratic)**
  This is where you guide without lecturing. Look at the board. You will likely see three clusters of reasons. Guide them to name these clusters, then you supply the philosopher.

  *   **Cluster 1: "I didn't want to let them down / They were expecting it."**
      *   *Instructor:* "So the binding force comes from the *expectation* you created in their mind? And the wrong would be disappointing them?"
      *   *Label:* **The Expectation View.** (Reveal: This is **T.M. Scanlon's Principle F**).
  *   **Cluster 2: "It's just what you do / A promise is a social tool / Without the handshake it felt fake."**
      *   *Instructor:* "So the binding force comes from a pre-existing social rule? Like a rule of a game? Without the convention, the words are just noise?"
      *   *Label:* **The Convention View.** (Reveal: This is **Hume**).
  *   **Cluster 3: "I said the words 'I Promise' and that changed reality / The paper made it real."**
      *   *Instructor:* "So the utterance itself created the obligation, regardless of consequences or expectations? The speech *was* the act?"
      *   *Label:* **The Speech-Act View.** (Reveal: **Austin / Searle**).
  *   **Cluster 4: "I was worried you'd think I'm a jerk / It was on the whiteboard."**
      *   *Instructor:* "So this is about reputation and social sanction?"
      *   *Label:* **The Sanction View.** (Reveal: This is often the **Hobbesian** or **Game Theoretic** counterpoint).

  **Closing:** Assign the reading (Hume, Scanlon, etc.) for next week. "Next week, we will see which of these descriptions the philosophers think is the *true* source of obligation."

  ---

  ### Risk Assessment: What Predictably Goes Wrong

  **1. The "Saints" (100% Compliance)**
  *   **Problem:** Some students have high conscientiousness. They will bring the Snickers even if the building is on fire. This flattens the data.
  *   **Fix:** In the debrief, press them hard. "You were *released*. You had a study conflict. Why did the promise outweigh your grades?" This forces them to articulate the *source* of the bindingness, which is the data you need.

  **2. The "Nihilists" (100% Defection)**
  *   **Problem:** Students who break the promise because "it was just a game."
  *   **Fix:** The Public Protocol (F) usually catches these. It is very hard to wipe your name off the whiteboard in front of 14 peers. If they break it, ask: "Did you feel *guilty*, or just *smart*?" Distinguish prudence from morality.

  **3. The "Forgetters"**
  *   **Problem:** They genuinely forget.
  *   **Fix:** Require a photo of the item sent to you 1 hour before class. This forces a moment of decision *before* they walk into the room.

  **4. The "Colluders"**
  *   **Problem:** Partners text each other: "Hey, wanna just skip this?"
  *   **Fix:** Emphasize in Session 1 that collusion invalidates the data for the whole class. Peer pressure usually polices this better than you can.

  ---

  ### The Philosophical Blind Spot: Speech-Act Theory

  You are correct to suspect the Speech-Act view gets shortchanged here.
  *   **The Issue:** Speech-Act Theory (Austin/Searle) argues that saying "I promise" is an *illocutionary act* that creates a fact, similar to how a judge saying "I sentence you" creates a prison term. However, this relies on "felicity conditions"—the context must be appropriate, serious, and conventional.
  *   **Why the game undermines it:** Because this is a class game with low stakes (a candy bar), the "felicity conditions" are inherently shaky. Students will feel like they are *pretending* to promise. When they debrief, they will say, "It didn't feel like a real promise," which inadvertently supports Hume (it lacked the serious social convention) rather than Speech-Act (the words should have sufficed).
  *   **How to handle this in debrief:**
      *   When the Speech-Act category emerges, play devil's advocate.
      *   Ask: "If I say 'I promise' to my cat, am I bound?" (No). "If I say it in a play?" (No). "So is it the words, or is it the *context* of the words?"
      *   This pushes them to realize Speech-Act theory might secretly rely on Humean conventions to work. This is a high-level insight for undergrads: *Is the Speech-Act view independent, or does it rest on a Convention view?*

  ### Why This Works for Hume vs. Scanlon
  *   **Hume** wins if students say: "I did it because we have a social rule about promises," or "The handshake made it count."
  *   **Scanlon** wins if students say: "I did it because I didn't want to manipulate their expectations," or "It would be wrong to let them believe I'd come and then not."
  *   **The Tension:** The game forces them to choose between "The Rule" (Hume) and "The Person" (Scanlon). That is the core puzzle of the unit.
