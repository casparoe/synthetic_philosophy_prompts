  2. His weight of evidence resembles our distinction between epistemic uncertainty and predicted risk, where model confidence should scale with data density, but we typically collapse this into posterior variance rather than treating it as an orthogonal dimension. The residue is his insistence that weight is independent of probability value, whereas our learning curves necessarily bind confidence to the magnitude of the likelihood.

  3. The risk/uncertainty distinction maps cleanly to aleatoric versus epistemic uncertainty, where the former is inherent noise and the latter stems from model ignorance or distribution shift. The residue is his stronger claim that some uncertainties are fundamentally non-probabilizable, whereas our Bayesian non-parametrics assume a prior exists over all possible functions.

  4. Non-numerical probabilities translate to pairwise ranking constraints or partial orderings in preference learning, yet we ultimately compress these into scalar loss values to enable gradient descent. The residue is his acceptance of incomparability between hypotheses, which our optimization landscapes cannot represent without imposing an artificial total ordering.

  5. His critique of the principle of indifference warns against defaulting to uniform priors or maximum entropy initializations without structural justification, mirroring our concerns over inductive biases in deep networks. The residue is his logical prohibition against such assignments, whereas we tolerate them as regularization techniques, suggesting our vocabulary lacks the logical rigor he demanded rather than his claim being imprecise.
