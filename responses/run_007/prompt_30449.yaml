  *Drafting:*
  TO: Public Art Commission
  FROM: [Commissioner Name]
  RE: Grant Recommendation – [Neighborhood] Mural Project

  Recommendation: Approve.

  This proposal demands we confront the purpose of public art. Is it decoration, or is it discourse? I vote to fund this mural.

  The argument against funding is serious and deserves honesty. Colleagues arguing "no advocacy" are right about one thing: public funds must not become partisan slush funds. If we grant money explicitly to lobby for legislation or halt specific private developments, we risk turning the commission into a political action committee. There is a legitimate governance concern here. Taxpayers who oppose rent control or support the new development should not feel their dollars are being used to coerce their political views. Maintaining public trust requires us to avoid funding what looks like targeted campaigning.

  However, applying that standard here mistakes civic engagement for partisan lobbying.

  The artist's honesty is a virtue, not a disqualifier. She names the conflict: displacement. To demand she remove the "propaganda" element is to demand she sanitize the history of the neighborhood. Public art is inherently civic. A mural about a historically Black neighborhood cannot be politically neutral because the erasure of that neighborhood is itself a political act. When we demand neutrality in the face of displacement, we are not removing politics; we are siding with the status quo.

  W.E.B. Du Bois wrote, "all art is propaganda and ever must be." He argued that marginalized people cannot afford art that ignores their struggle for equality. To reject this proposal because the artist admits her intent is to fight for her community's survival is to enforce a double standard. We fund plenty of art that celebrates city growth, corporate partnerships, and development. Those are also political statements. They advocate for a vision of the city that prioritizes capital over community. Rejecting this mural while funding celebratory plaques for new developments is not neutrality; it is choosing which propaganda we prefer.

  This mural does not advocate for a candidate. It advocates for memory and housing justice. These are within the remit of public art. The "specific development" opposition is not about interfering in private business so much as documenting the community's resistance to being removed. If public art cannot speak to the most pressing issue facing the community it depicts, then our program is merely interior design for the city.

  We should not fear art that persuades. Democracy requires persuasion. The risk of funding advocacy is real, but the risk of silencing the history of Black displacement is greater.

  Vote yes.

