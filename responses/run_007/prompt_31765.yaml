      *   *Final Verdict:* The joke does not survive scrutiny as an argument for why ZL is preferred in algebra. It explains why WOT is disliked, but not why ZL is liked (other than being less offensive). The real reason is structural compatibility.

  7.  **Refining the "True/False/Endorse" criteria:**
