answer: |-
  # Adversarial Collaboration: Defining "Disease"

  **Date:** October 26, 2023
  **Participants:** Friend A (Biological/Function View) & Friend B (Normative/Value View)
  **Purpose:** To clarify points of agreement, isolate specific disagreements, and establish test cases that could resolve the debate over what constitutes a disease.

  ---

  ## Part 1: Shared Premises
  *We both agree on the following substantive claims. These are not merely dictionary definitions, but constraints we accept that narrow down the concept of disease.*

  1.  **Statistical Rarity is Insufficient:** Being statistically unusual (e.g., having an IQ of 160, being 7 feet tall, or having only one kidney due to donation) does not automatically make a condition a disease.
  2.  **Harm is Insufficient:** Experiencing harm, pain, or disadvantage (e.g., grief after a death, poverty, or illiteracy) does not automatically make a condition a disease; there must be an underlying internal condition involved.
  3.  **Biological Basis is Necessary:** For a condition to be a disease, there must be some underlying physical, biological, or psychological mechanism involved. Purely social or moral failings cannot be diseases on their own.
  4.  **Distinction from Injury:** We accept that acute injuries (e.g., a broken leg from a fall) fall under the umbrella of "disease" or "medical condition" for the purpose of this discussion, as they involve a disruption of normal function.
  5.  **Historical Corrections are Possible:** We agree that medicine has historically misclassified conditions as diseases (e.g., homosexuality, drapetomania) and that correcting these errors was progress.
  6.  **The Concept Serves a Purpose:** We agree that labeling something a "disease" carries social weight, including eligibility for medical treatment, insurance coverage, and exemption from certain social obligations.

  ---

  ## Part 2: Core Disagreements
  *This table isolates where our definitions diverge. The "Crux" column indicates whether resolving this specific sub-question would cause us to change our overall stance on the definition of disease.*

  | Sub-Question | Friend A (Biological/Function View) | Friend B (Normative/Value View) | Is this a Crux? |
  | :--- | :--- | :--- | :--- |
  | **1. The Role of Harm**<br>Is "harm" or "undesirability" part of the *definition* of disease, or just a common *consequence*? | Harm is a typical consequence, but not definitional. If a biological mechanism fails, it is a disease even if the person feels fine and suffers no disadvantage. | Harm is definitional. A biological malfunction is only a disease if it reduces the individual's well-being, opportunities, or goals in their specific context. | **Yes**<br>(For both) |
  | **2. The Reference Class**<br>When determining "normal function," whose standards do we use? | Species-typical design. We compare the individual to the standard biological functioning of a healthy human organism, regardless of their personal goals. | Context-dependent functioning. We compare the individual to what is required for them to flourish in their specific environment and life plan. | **Yes**<br>(For Friend B) |
  | **3. Historical Errors**<br>Why was homosexuality incorrectly classified as a disease in the past? | It was a biological error. We later realized there was no underlying biological malfunction or dysfunction present. | It was a value error. The biology was understood (or irrelevant), but society incorrectly judged the condition as harmful/undesirable. | **No**<br>(Agreement on outcome, disagreement on explanation) |
  | **4. Environmental Context**<br>Can a trait be a disease in one environment but not another? | Generally no. If the biological mechanism is impaired relative to species design, it is a disease everywhere, even if the environment masks the symptoms. | Yes. If a trait is advantageous or neutral in one environment but harmful in another, its status as a disease depends on the current environment. | **Yes**<br>(For Friend B) |

  ---

  ## Part 3: Adjudication Cases
  *For each "Crux" identified above, we have selected a concrete case. We are committing in advance to what we would classify as "Disease" or "Not a Disease" in these scenarios. If new evidence forces us to change our classification here, we agree to reconsider our broader definition.*

  ### Case 1: The Asymptomatic Infertility Test
  **Scenario:** A 30-year-old individual is biologically incapable of conceiving a child due to a reproductive system malfunction. They have zero desire to have children, feel no distress about the condition, and face no social stigma or health risks from the infertility itself.

  | | Friend A (Biological) | Friend B (Normative) |
  | :--- | :--- | :--- |
  | **Classification** | **Disease** | **Not a Disease** |
  | **Reasoning** | The reproductive mechanism is failing its species-typical function. The patient's desires do not fix the broken mechanism. | Without the desire for children, there is no harm or disadvantage. It is a biological variation, not a pathology. |
  | **What would change our mind?** | If we agree this is *not* a disease, Friend A must admit values are required for definition. | If we agree this *is* a disease, Friend B must admit harm is not required for definition. |

  ### Case 2: The Sickle Cell Environment Test
  **Scenario:** An individual has the Sickle Cell Trait (one gene). In a malaria-free zone (e.g., modern London), this offers no protection and carries a small risk of complications. In a high-malaria zone (e.g., parts of Sub-Saharan Africa), this offers significant survival protection.

  | | Friend A (Biological) | Friend B (Normative) |
  | :--- | :--- | :--- |
  | **Classification** | **Disease (or Carrier of Disease)** | **Context Dependent** |
  | **Reasoning** | The hemoglobin structure is structurally atypical and prone to sickling under stress. The biological design is compromised regardless of location. | In the malaria zone, it is a beneficial adaptation (not a disease). In the London zone, it may be a minor liability, but status shifts based on net harm/benefit. |
  | **What would change our mind?** | If Friend A admits it is *not* a disease in the malaria zone, they concede environment defines disease status. | If Friend B admits it is *always* a disease regardless of survival benefit, they concede biological function trumps outcome. |

  ### Case 3: The "Enhanced" Memory Test
  **Scenario:** A genetic mutation causes individuals to remember every moment of their lives perfectly (Hyperthymesia). This causes significant psychological distress, anxiety, and inability to forgive past slights, reducing life satisfaction. However, all biological memory mechanisms are working *more* efficiently than the species-typical norm.

  | | Friend A (Biological) | Friend B (Normative) |
  | :--- | :--- | :--- |
  | **Classification** | **Not a Disease** | **Disease** |
  | **Reasoning** | The memory mechanism is functioning *better* than typical, not worse. It is a biological enhancement, even if the outcome is unpleasant. | The condition causes significant harm and reduces well-being. The "function" of memory is to aid survival/flourishing, which this fails to do. |
  | **What would change our mind?** | If Friend A classifies this as a disease, they admit that "functioning better than normal" can still be pathological if harmful. | If Friend B classifies this as not a disease, they admit that harm alone is insufficient without biological malfunction. |

  ---

  ## Signatures

  *By signing below, we agree that this document accurately reflects our current positions. We agree to revisit this document if either of us changes our classification on any of the Adjudication Cases above.*

  **Friend A (Biological View):** _________________________________ **Date:** __________

  **Friend B (Normative View):** _________________________________ **Date:** __________

  ---

  ### Note on Format Changes
  *I made a few small structural tweaks to ensure this works as a practical tool for you:*

  1.  **Neutral Labels:** In the tables, I used "Friend A (Biological)" and "Friend B (Normative)" instead of "Her/You." This makes the document stand on its own if you print it out, but you can obviously hand-edit those headers to be your names.
  2.  **"What Would Change Our Mind":** I added a specific row to the Case tables for this. You asked for predictions, but in an adversarial collaboration, explicitly stating the *condition for updating your belief* is more powerful than just stating the prediction.
  3.  **Signatures:** Added a signature block to make it feel like a formal agreement, which helps psychologically commit you both to the "rules of engagement."
