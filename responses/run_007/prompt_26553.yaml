          *   *Analysis:* This is a performative contradiction. If it was truly open access, no one had a claim. By allocating based on history, the state implicitly recognizes a customary property right that the diagnosis explicitly denies. It retroactively privatizes the commons based on extraction rates.
          *   *Key Concept:* *Prescriptive rights* or *customary use rights* vs. *Open Access*.

      *   **Point 2: Corrective Justice and Moral Hazard.**
          *   *User's point:* Overfishers get rewarded.
          *   *Philosophical commitment:* This violates standard corrective justice (you shouldn't profit from wrongs).
          *   *Justification used:* It's not about *justice*, it's about *compliance*. This shifts from deontological ethics (right/wrong) to consequentialism (what works).
          *   *The "Right" vs. "Privilege":* Legally, fishing is often a "privilege," not a "right." Grandfathering converts a revocable privilege into a tradable asset without compensation. This avoids a "takings" claim (5th Amendment in US context).
