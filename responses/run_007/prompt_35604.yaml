prompt: |-
  My political theory reading group has been stuck on the boundary problem for months — half the group leans all-affected-interests (anyone whose interests are affected by a decision should get a say in making it), and the other half leans all-subjected (only those systematically subject to the coercive power of a state count as part of the demos). We've been talking past each other and I want to force some clarity. Please draft the adversarial-collaboration document they should produce. I want:

  - A numbered list of claims both sides can genuinly sign — about what the boundary problem is, why it matters, what's at stake in getting it wrong, and any shared methodological commitments. Don't make these vacuous; they should do real work.
  - Then a table of disagreements, with each row giving the sub-question, the all-affected camp's answer phrased so they'd own it, and the all-subjected camp's answer phrased so they'd own it.
  - Then a cruxes section: the sub-questions that, if resolved, would actually move at least one side. For each crux, include what kind of evidence or argument both sides agree would bear on it, and what each side predicts.
  - I suspect one crux is whether the all-affected principle collapses into requiring global democracy (and whether that's a bug or a feature), and another is what to do about people who are clearly affected by a polity's decisions but aren't formally subject to its laws — long-term residents without citizenship, or people downwind of a country's pollution. Don't limit yourself to those if you see others.

  The document should be something both camps could actually put their names to — no strawmen, no slanted wording. And if part of the dispute turns out to be verbal rather than substantive, say which part and why.
reasoning: |-
  Here's a thinking process that leads to the suggested document:

  1.  **Analyze the Request:**
      *   **Task:** Draft an adversarial-collaboration document for a political theory reading group stuck on the "boundary problem" (who constitutes *the demos*).
      *   **Parties:** All-Affected Interests (AAI) vs. All-Subjected Principle (ASP).
      *   **Requirements:**
          1.  Numbered list of shared claims (non-vacuous, substantive).
          2.  Table of disagreements (sub-question, AAI answer, ASP answer, phrased charitably).
          3.  Cruxes section (resolvable sub-questions, agreed evidence/arguments, predictions from both sides).
          4.  Specific focus: Global democracy implication, non-citizen residents/transboundary harm.
          5.  Tone: Neutral, precise, signable by both camps (no strawmen).
          6.  Meta-analysis: Identify if any disputes are merely verbal.

  2.  **Deconstruct the Boundary Problem:**
      *   *What is it?* The problem of determining who has the right to participate in democratic decision-making prior to the decision-making process itself (the "constitutive paradox").
      *   *AAI Core:* Legitimacy comes from impacting interests. If $X$ affects $Y$'s vital interests, $Y$ should have a say.
      *   *ASP Core:* Legitimacy comes from coercion/subjection. If $X$ coerces $Y$ via law/state power, $Y$ should have a say to ensure autonomy/freedom from domination.
      *   *Shared Ground:* Both want democratic legitimacy, both reject arbitrary exclusion (like birthright citizenship without justification), both worry about tyranny.

  3.  **Drafting Section 1: Shared Claims (The Common Ground):**
      *   *Goal:* Avoid "democracy is good." Need specific theoretical commitments.
      *   *Idea 1:* The boundary problem is prior to procedure. You can't vote on who votes without already knowing who votes.
      *   *Idea 2:* Legitimacy requires justification for exclusion. It's not presumptive.
      *   *Idea 3:* Both reject pure statism (borders aren't morally magic) but acknowledge practical constraints.
      *   *Idea 4:* Getting it wrong leads to specific harms (tyranny vs. instability).
      *   *Refinement:* Make them punchy. "The composition of the demos is a normative question, not merely a historical fact." "Exclusion requires justification." "Both principles aim to reconcile collective self-determination with moral equality."

  4.  **Drafting Section 2: Table of Disagreements:**
      *   *Goal:* Contrast the principles on specific dimensions without bias.
      *   *Dimension 1: Source of Obligation.* AAI: Harm/Interest impact. ASP: Coercive Law.
      *   *Dimension 2: Scope.* AAI: Issue-specific/Fluid. ASP: Stable/Polity-wide.
      *   *Dimension 3: The "Foreigner" Case.* AAI: If affected (e.g., pollution), they get a vote. ASP: If not subject to law, no vote (even if affected).
      *   *Dimension 4: Temporal Stability.* AAI: Demos changes per issue. ASP: Demos is fixed for constitutional continuity.
      *   *Phrasing Check:* Ensure AAI doesn't sound like "open borders" caricature and ASP doesn't sound like "nationalist exclusion." Use terms like "interest-impact" vs. "coercive framework."

  5.  **Drafting Section 3: Cruxes:**
      *   *Goal:* Identify what would actually change minds.
      *   *Crux 1: The Global Democracy Implication.*
          *   *Issue:* Does AAI necessarily demand a global state?
          *   *AAI Prediction:* Yes, or a networked functional democracy. It's a feature (cosmopolitan justice).
          *   *ASP Prediction:* No, global democracy is incoherent without global coercion. It's a *reductio ad absurdum* of AAI.
          *   *Evidence:* Feasibility studies of transnational referenda, normative analysis of "interest" vs. "right."
      *   *Crux 2: Long-term Residents (Denizens).*
          *   *Issue:* Are they subjected or just affected?
          *   *AAI:* Clearly affected, thus vote.
          *   *ASP:* Clearly subjected to local coercion, thus vote (Wait, ASP usually *agrees* here). *Correction:* The dispute is usually about *why*. But a better crux is *temporary visitors* or *transboundary harm*. Let's stick to the prompt's suggestion: "People affected but not subject."
          *   *Refined Crux 2: Transboundary Externalities (Pollution).*
          *   *AAI:* Downwind foreigners get a vote.
          *   *ASP:* They don't get a vote, but the state has a *duty* not to harm (human rights), distinct from democratic membership.
          *   *Test:* Does separating human rights from democratic rights solve the legitimacy deficit?
      *   *Crux 3: The Unit of Decision (Issue-specific vs. Polity-wide).*
          *   *Issue:* Can the demos change per law?
          *   *AAI:* Yes, fluid demos.
          *   *ASP:* No, destroys collective agency.
          *   *Evidence:* Institutional design feasibility.
      *   *Verbal Dispute Check:* Is "Coercion" just a subset of "Interests"? Or is "Interest" too vague? Need to note if they are defining "Demos" differently (voters vs. stakeholders).

  6.  **Review and Refine:**
      *   *Tone Check:* Is it academic but accessible? Yes.
      *   *Signability:* Would a hardline AAI sign the ASP column? Yes, if it accurately reflects their view without mockery.
      *   *Constraint Check:* Did I include the numbered list, table, and cruxes? Yes.
      *   *Self-Correction on Crux 2:* The prompt mentions long-term residents. ASP usually *includes* them (because they are subject to laws). AAI *includes* them (because interests are affected). This is actually a point of agreement in outcome, but disagreement in justification. A better disagreement is *foreigners affected by foreign policy*. I will use the prompt's suggestion but refine the distinction: ASP says rights protection suffices; AAI says voting rights are required.
      *   *Verbal Dispute:* I need to explicitly address if "affected" and "subjected" are being defined differently. Often ASP argues coercion *is* the relevant interest. AAI argues coercion is just one interest. This is a substantive normative disagreement, not just verbal. However, there might be a verbal element regarding what counts as "coercion" (e.g., is economic pressure coercion?). I will add a note on this.

  7.  **Final Polish:** Organize with clear headings. Ensure the "Shared Claims" aren't too weak (e.g., avoid "Democracy is nice"). Ensure the "Cruxes" offer a path to resolution, not just restating the problem. (Self-correction: Make sure the Crux predictions are falsifiable or at least arguable).

  8.  **Final Output Generation** (Proceeding to generate the response based on these thoughts).
answer: |-
  # Adversarial Collaboration: The Boundary Problem of the Demos
  **Date:** October 26, 2023
  **Parties:** Proponents of the All-Affected Interests Principle (AAI) vs. Proponents of the All-Subjected Principle (ASP)
  **Objective:** To isolate substantive disagreements from verbal disputes and identify empirical or normative cruxes that could resolve the stalemate.

  ---

  ## I. Shared Commitments
  *Both parties affirm the following claims. These are not merely procedural; they represent substantive normative and methodological agreements that rule out certain classes of solutions.*

  1.  **The Constitutive Paradox:** We agree that the boundary problem is logically prior to democratic procedure. One cannot vote on who gets to vote without already presupposing a *demos*. Therefore, the boundary cannot be determined democratically; it must be determined by normative theory.
  2.  **Presumption Against Exclusion:** We agree that excluding adults from the *demos* requires positive justification. Birthright citizenship, territorial presence, or historical accident are not sufficient moral justifications on their own.
  3.  **The Legitimacy Deficit:** We agree that getting the boundary wrong generates a legitimacy deficit. If the *demos* is too narrow, it creates tyranny over outsiders; if too broad (or unstable), it creates decisional paralysis or undermines collective self-determination.
  4.  **Rejection of Pure Statism:** We agree that existing state borders are not morally sacrosanct. A theory of the *demos* must be capable of criticizing current boundaries, even if it ultimately justifies most of them.
  5.  **Distinctness of Rights:** We agree that democratic membership (the right to rule) is conceptually distinct from basic human rights (the right not to be harmed). However, we disagree on whether the former is required to secure the latter in specific contexts.
  6.  **Feasibility Constraint:** We agree that a principle of inclusion must be institutionally implementable. A principle that requires omniscience (to track all interests) or constant reconstitution (to track all subjects) risks being action-guiding in theory but useless in practice.

  ---

  ## II. Map of Disagreements
  *The following table outlines where the principles diverge. Answers are phrased to be owned by proponents of each view.*

  | Sub-Question | All-Affected Interests (AAI) Position | All-Subjected Principle (ASP) Position |
  | :--- | :--- | :--- |
  | **1. The Source of the Right to Vote** | The right to participate derives from the **impact on vital interests**. If a decision alters my life prospects, I require agency over that decision to protect my autonomy. | The right to participate derives from **subjection to coercive law**. If I am bound by rules I had no hand in making, I am dominated; voting is the remedy for subjection, not impact. |
  | **2. The Scope of the Demos** | The *demos* should be **issue-specific and fluid**. The group voting on climate policy should differ from the group voting on local zoning, based on who is affected by each. | The *demos* must be **stable and polity-wide**. Democratic agency requires a persistent "people" capable of making coherent plans over time. Fluid membership dissolves collective responsibility. |
  | **3. Transboundary Harm (e.g., Pollution)** | Foreigners harmed by a state's externalities (e.g., downwind pollution) **must have a vote** or veto power. Affected interest creates a claim to membership, regardless of borders. | Foreigners harmed by externalities have a claim to **justice/remedy**, but not necessarily membership. Their rights are protected via international law/human rights, not by joining the offending *demos*. |
  | **4. Long-Term Residents (Non-Citizens)** | They are included because their **interests are embedded** in the society. Exclusion is a violation of their stake in the community. | They are included because they are **subject to the coercive order**. It is irrelevant whether their interests are "embedded"; the fact of legal subjection mandates inclusion. |
  | **5. Global Democracy** | If interests are globally interconnected, the principle **logically points toward global democracy** (or functional equivalents). If this is institutionally hard, that is a practical hurdle, not a theoretical refutation. | Global democracy is a **category error**. Without a global sovereign capable of coercive enforcement, there is no global "subjecthood." AAI collapses into incoherence by demanding democracy where there is no state. |

  ---

  ## III. Cruxes
  *These are the specific sub-questions where resolution would cause at least one side to modify their position or concede ground. For each crux, we specify the type of evidence/argument that both sides agree is relevant, and what each side predicts.*

  ### Crux 1: The "Reductio" of Global Democracy
  *Does the All-Affected principle necessarily demand a global state, and is that demand fatal to the theory?*

  *   **Agreed Upon Evidence/Argument:** Institutional analysis of whether "interests" can be protected without formal membership, and normative analysis of whether "democracy" is coherent without a monopoly on violence.
  *   **AAI Prediction:** We predict that showing **functional alternatives** (e.g., transnational stakeholder councils) will satisfy the ASP concern about chaos. We argue that if AAI implies global democracy, that is a **feature**, exposing the parochialism of the state system.
  *   **ASP Prediction:** We predict that demonstrating the **conceptual link between coercion and democracy** will show global democracy is impossible. If AAI requires it, AAI is false. We argue that without a global enforcer, "global votes" are advisory only, and advisory votes do not solve the legitimacy deficit of coercion.
  *   **Resolution Condition:** AAI concedes if it is shown that "interests" can be sufficiently protected by human rights regimes without voting rights. ASP concedes if it is shown that coercion exists globally (e.g., via economic sanctions/regimes) sufficient to trigger the ASP globally.

  ### Crux 2: The Distinction Between "Harm" and "Subjection"
  *Is there a morally relevant difference between being negatively affected by a decision and being legally bound by it?*

  *   **Agreed Upon Evidence/Argument:** Case studies of individuals who are heavily affected but not legally subject (e.g., foreign investors, climate refugees) vs. those legally subject but unaffected (e.g., wealthy expats who pay no taxes and use no services).
  *   **AAI Prediction:** We predict that intuitions will side with the **affected outsider**. If a factory poisons a neighbor across the border, saying "they aren't subject to our laws" is a moral evasion. The harm *is* the coercion.
  *   **ASP Prediction:** We predict that intuitions will side with **legal clarity**. If everyone affected gets a vote, the "neighbor" could vote on the factory, but also on unrelated cultural policies. This violates the reciprocity of law. We argue harm creates a duty of *reparation*, not a right of *rule*.
  *   **Resolution Condition:** If both sides agree that "coercion" is simply a specific, high-intensity subset of "affecting interests," the dispute becomes verbal. If ASP maintains that *legal obligation* is qualitatively different from *causal impact*, the dispute is substantive.

  ### Crux 3: Stability vs. Accuracy in Boundary Drawing
  *Is it better to have a stable boundary that occasionally misclassifies people, or a fluid boundary that accurately tracks impact but undermines agency?*

  *   **Agreed Upon Evidence/Argument:** Social science on group identity formation and decision-making efficiency. Can a "fluid demos" maintain the solidarity required for redistribution?
  *   **AAI Prediction:** We predict that **technology** (digital voting, rapid polling) reduces the cost of fluid boundaries. The "stability" argument is a status quo bias favoring existing states.
  *   **ASP Prediction:** We predict that **collective agency** requires a fixed "we." If the *demos* changes every Tuesday, no one is responsible for Thursday's outcomes. Stability is a precondition for democracy, not just a convenience.
  *   **Resolution Condition:** AAI concedes if it is demonstrated that fluid boundaries empirically destroy the capacity for long-term planning. ASP concedes if it is demonstrated that fixed boundaries systematically produce tyrannical outcomes for permanent minorities/outsiders that cannot be fixed by courts.

  ---

  ## IV. Note on Verbal vs. Substantive Dispute
  *Preliminary analysis suggests a partial verbal dispute regarding the definition of "Coercion."*

  *   **The Verbal Component:** If ASP defines "coercion" broadly to include "significant constraint of options caused by state policy" (even extraterritorially), ASP begins to look like AAI. If AAI defines "interests" narrowly to mean "legal rights and duties," AAI begins to look like ASP.
  *   **The Substantive Component:** Even if definitions are aligned, a normative disagreement remains.
      *   **AAI** holds that *causal impact* generates a right to *authorship*.
      *   **ASP** holds that *legal obligation* generates a right to *authorship*, while *causal impact* generates a right to *protection*.
  *   **Action Item:** Before the next session, both sides must define "Coercion" and "Interest" operationally. If ASP admits that transboundary pollution is a form of "coercion," they must explain why it doesn't grant voting rights. If AAI admits that not all affected interests grant voting rights (e.g., trivial interests), they must provide a non-arbitrary threshold.

  ---
