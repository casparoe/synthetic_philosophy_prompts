answer: |-
  | Dimension | Symposium | Laws | Verdict |
  | :--- | :--- | :--- | :--- |
  | **Purpose of the drinking party** | A social occasion for philosophical speech (encomia to Eros) and bonding, where drinking is secondary to discourse. | A civic institution for moral education (*paideia*), designed to test courage and train citizens in self-control. | **Differ in emphasis:** The *Symposium* prioritizes intellectual production; the *Laws* prioritizes ethical conditioning. |
  | **What wine does to the soul** | Wine threatens to overwhelm reason and produce hubris, unless the drinker possesses exceptional nature (like Socrates). | Wine acts as a drug that relaxes shame and fear, exposing the soul's true fibers like silver tested by fire. | **Differ in emphasis:** The *Symposium* views wine as a potential obstacle to reason; the *Laws* views it as a diagnostic tool for reason. |
  | **Attitude toward intoxication itself** | Intoxication is generally avoided or moderated; the ideal is to drink without being overcome by drink. | Intoxication is a necessary risk; one must experience the state of being overcome to learn how to resist it or be identified. | **Genuinely conflict:** The *Symposium* seeks to transcend intoxication; the *Laws* seeks to utilize it. |
  | **Role of supervision, rules, or restraint** | Restraint is voluntary and gentlemans' (an agreement to drink moderately); no external ruler is appointed. | Restraint is legalistic and compulsory; a "Symposiarch" must rule the party as a general rules an army. | **Differ in emphasis:** The *Symposium* relies on internal nobility; the *Laws* relies on external legislation. |
  | **Relation between drink and candor or self-revelation** | Drunkenness allows for emotional truth-telling (Alcibiades), but sober speech is treated as more reliable and divine. | Drunkenness reliably reveals character flaws (cowardice, shamelessness) that sobriety conceals, allowing for correction. | **Agree:** Both acknowledge wine removes shame, but disagree on whether the revealed truth is useful or merely pitiable. |
  | **The figure of the exceptional drinker** | Socrates is unique: he drinks heavily but remains perfectly sober-minded, showing wine cannot overcome him. | The ideal citizen is not immune to wine, but is trained to master the pleasure of wine through repeated exposure. | **Differ in emphasis:** The *Symposium* presents the finished philosopher; the *Laws* presents the training regimen for the citizen. |

