          *   *Control:* The agreement to drink moderately is a form of self-imposed law. Socrates embodies perfect self-control.

      *   **Laws (Book 1 & 2 primarily):**
          *   *Context:* Athenian Stranger, Cleinias, Megillus discussing legislation.
          *   *Purpose of Party:* The Athenian argues for the reintroduction of drinking parties (symposia) under strict regulation.
          *   *Role of Wine:* It's a tool for education (*paideia*). It tests courage and self-control. It relaxes the soul to reveal character flaws so they can be corrected (like testing silver).
