prompt: |-
  I'm the parliamentarian for a professional association's governing council. We meet monthly, and I'm the one who runs the votes and keeps the minutes. Over the last year Ive noticed something that keeps happening: when a motion has several parts, the outcome depends on whether we vote the parts one at a time and then let the overall result fall out, or just take a single vote on the whole motion. Same people, same votes, but the decision flips. I've heard people call this the discursive dilemma or the doctrinal paradox, but nobody on the council knows the theory and they're not going to learn it.

  What I want is a standing procedure I can actually run. Not a lecture. The decisions are things like: expelling a member, which by our rules requires two separate findings both to pass; adopting a policy resolution with three operative clauses; approving a budget line that requires three conditions to be met. The stakes are real — people can lose their membership, the association takes public positions, and it's dues money. The meetings run 90 minutes, so I need something I can use in the few minutes between when debate ends and when I call the vote. The chair has to sign off on whatever I use, and she wants to know what to tell a member who says the result looks contradictory.

  Please write the procedure as a checklist with the questions in order, what counts as a sufficient answer to each, where the procedure stops with a no, and where it hands the decision to a person because it's a values call rather than a mechanical one. It should say when to vote the parts first and let the result fall out, when to vote the whole thing directly, and when to do neither. It should also tell me how to spot someone trying to game the order of the votes, and how to phrase the minutes so the council doesnt look incoherent when the paradox actually shows up. Then run the procedure on two or three worked cases. One of them should be a case where the procedure gives an answer I personally won't like, and you should say what I should do then. Finally, tell me what the procedure can't do — the cases it will get wrong or just not settle.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the Request:**
      *   **Role:** Parliamentarian for a professional association's governing council.
      *   **Problem:** The "Discursive Dilemma" / "Doctrinal Paradox" (voting on premises vs. conclusion yields different results).
      *   **Constraints:**
          *   Monthly meetings, 90 minutes total.
          *   Procedure must be a practical checklist, not a theory lecture.
          *   Must handle high-stakes decisions (expulsion, policy, budget).
          *   Chair needs to explain results to members.
          *   Must identify gaming/manipulation.
          *   Must guide minute-taking.
          *   Must include worked cases (including one with an undesirable outcome).
          *   Must acknowledge limitations.
      *   **Output Format:** Checklist with questions, stop points, hand-offs, voting rules, anti-gaming tips, minute phrasing, worked cases, limitations.

  2.  **Understand the Core Problem (The Paradox):**
      *   *Scenario:* A motion requires conditions A, B, and C to pass (conjunction).
      *   *Premise-based voting:* Vote on A, B, C separately. If all pass, motion passes.
      *   *Conclusion-based voting:* Vote on the final motion directly.
      *   *The Flip:* It's possible for a majority to support A, a majority to support B, and a majority to support C, but the *intersection* of those majorities (the people who support all three) is a minority. Thus, premise-based voting passes the motion, while conclusion-based voting fails it.
      *   *Conversely:* For disjunction (A *or* B), the opposite can happen.
      *   *Goal:* Provide a consistent rule to decide *which* method to use so the outcome is predictable and defensible, even if logically tricky.

  3.  **Drafting the Procedure (The Checklist):**
      *   *Goal:* Simplicity and speed.
      *   *Step 1: Classification.* Is this a "Compound Motion" (requires multiple findings) or a "Simple Motion"?
      *   *Step 2: Rule Dependency.* Do the bylaws *require* separate findings? (e.g., expulsion often requires "guilt" AND "penalty"). If yes, premise-based is mandatory.
      *   *Step 3: Logical Structure.* Is it an AND (conjunction) or an OR (disjunction)? AND is the common trap.
      *   *Step 4: The Default Rule.* To avoid the paradox flipping outcomes arbitrarily, we need a default. Robert's Rules generally favors voting on the *main motion* (conclusion) unless amendments or divisions are requested. However, to solve the paradox specifically, we need to decide: Do we value the *logic* (premises) or the *will of the assembly on the final act* (conclusion)?
      *   *Decision:* For high-stakes policy/expulsion, the *final action* usually carries more weight legally and practically. However, if the premises are distinct factual findings (like expulsion), they must be voted separately.
      *   *Refinement:* Let's create a "Division of the Question" test. If the parts make sense standing alone, divide. If they only make sense together, vote together.
      *   *Wait, the user wants to solve the paradox specifically.* The paradox arises when the *method* changes the result. The procedure needs to dictate the method *before* the vote to prevent gaming.
      *   *Proposed Rule:*
          1.  If Bylaws require separate findings -> Vote Parts (Premise).
          2.  If Parts are independent actions -> Vote Parts (Division of Question).
          3.  If Parts are interdependent conditions for one action -> Vote Whole (Conclusion).
      *   *Why?* Voting the whole prevents the "false majority" problem where different majorities support different parts but no majority supports the whole. This is generally safer for an association to avoid acting without a true majority mandate for the *action*.
      *   *Exception:* If the "parts" are actually amendments, they are voted on first by standard procedure.

  4.  **Developing the Checklist Steps:**
      *   Q1: Does the governing document *require* separate findings? (Yes -> Vote Parts).
      *   Q2: Can each part stand as an independent action if the others fail? (Yes -> Divide & Vote Parts).
      *   Q3: Are the parts logically interdependent conditions for a single outcome? (Yes -> Vote Whole).
      *   *Gaming Check:* Is someone requesting division *after* seeing the count? (Too late).
      *   *Minutes:* Record the method used and the specific counts.

  5.  **Addressing the "Values Call":**
      *   Sometimes the logic doesn't decide it. The Chair needs to rule on whether a motion is "divisible." This is the hand-off point.

  6.  **Worked Cases:**
      *   *Case 1: Expulsion.* Bylaws say "Finding of Violation" + "Vote to Expel". This is mandatory division.
      *   *Case 2: Policy Resolution.* Three clauses. If one fails, does the policy stand? Usually no. Vote Whole.
      *   *Case 3: The "Unpleasant Outcome".* A budget item where 3 conditions are met by majorities, but the whole fails. The procedure says "Vote Whole," so it fails. The parliamentarian might want it to pass (efficiency), but the rule says no. I need to explain sticking to the rule.

  7.  **Minute Phrasing:**
      *   Need to be transparent. "Motion carried on a vote of the whole" vs "Motion carried based on separate findings."

  8.  **Limitations:**
      *   Cannot fix cyclical majorities (Condorcet paradox).
      *   Cannot fix bad drafting.
      *   Cannot override bylaws.

  9.  **Refining the Tone:**
      *   Professional, direct, actionable. No academic jargon.
      *   Focus on *Robert's Rules of Order Newly Revised (RONR)* compatibility, as that's the standard for most associations.

  10. **Self-Correction/Review during drafting:**
      *   *Critique:* Is "Vote Whole" always better? In the Discursive Dilemma, premise-based voting is often argued to be more *reasoned*, but conclusion-based is more *democratic* regarding the final action. For a private association, avoiding liability is key. Acting without a majority support for the *action* is riskier. So, default to "Vote Whole" unless division is mandated or logical.
      *   *Critique:* The prompt asks for a checklist where the procedure stops with a "No". I need to structure it as a decision tree.
      *   *Critique:* Need to ensure the "Gaming" section is practical. How to spot it? Timing of the request to divide.
      *   *Critique:* The "Unpleasant Outcome" case needs to be clear. If the procedure says "Fail," and I think it should "Pass," I must advise the Chair to follow the procedure, not my preference.

  11. **Final Polish:** Check against all constraints in the prompt.
      *   Checklist format? Yes.
      *   Questions in order? Yes.
      *   Sufficient answers? Yes.
      *   Stop points/Hand-offs? Yes.
      *   Voting rules (Parts vs. Whole vs. Neither)? Yes.
      *   Gaming detection? Yes.
      *   Minute phrasing? Yes.
      *   Worked cases (2-3, one unpleasant)? Yes.
      *   Limitations? Yes.

  (Proceed to generate output based on this structure.)
answer: |-
  # Standing Procedure: Compound Motion Voting Protocol

  **Purpose:** To ensure consistent voting outcomes on motions with multiple conditions or clauses, preventing contradictory results based on voting order.
  **Authority:** This procedure supplements *Robert's Rules of Order Newly Revised (RONR)* regarding the "Division of a Question."
  **Usage:** Apply immediately after debate closes and before the vote is ordered.

  ---

  ## Part 1: The Decision Checklist

  **Instructions:** Read these questions in order. Stop at the first "Yes" or "No" that directs you to a **Action** or **Hand-Off**.

  **Q1: Do the Bylaws or Standing Rules *explicitly require* separate findings for this action?**
  *   *Examples:* Expulsion (Guilt + Penalty), Budget Override (Emergency + 2/3 Vote).
  *   **YES:** **VOTE PARTS.** You have no choice. Conduct separate votes on each required finding. The final action is valid only if all required findings pass.
  *   **NO:** Proceed to Q2.

  **Q2: If one part of the motion fails, do the remaining parts make sense as standalone actions?**
  *   *Test:* If Clause A fails, can the association still implement Clause B and C effectively?
  *   **YES:** **VOTE PARTS.** A member should move to "Divide the Question." If no one moves to divide, you (Parliamentarian) must advise the Chair to rule the motion divisible. Vote on each part separately. Each part stands or falls on its own.
  *   **NO:** Proceed to Q3.

  **Q3: Are the parts interdependent conditions for a single outcome?**
  *   *Test:* Is the intent "We do X *only if* A, B, and C are all true"? (e.g., A policy resolution where removing one clause ruins the policy, or a budget line requiring three conditions).
  *   **YES:** **VOTE WHOLE.** Do not divide. Vote on the main motion as a single package.
      *   *Reasoning:* This prevents a scenario where a majority supports the parts but no majority supports the final action.
  *   **NO:** **HAND-OFF TO CHAIR.**
      *   *Reasoning:* This is a values call on legislative intent. The Chair must rule on whether the motion is divisible based on the assembly's intent.

  ---

  ## Part 2: Anti-Gaming & Manipulation Check

  **When to watch:** During debate and immediately after debate closes.

  **1. The "Late Division" Trap**
  *   **Sign:** A member moves to divide the question *after* debate has closed but *before* the vote.
  *   **Risk:** They have heard the debate strength and are trying to change the voting method to secure a win they couldn't get on the whole.
  *   **Procedure:** Rule the motion to Divide out of order if it changes the substantive effect of the motion after debate has closed. Division must be moved before or during debate.

  **2. The "Poison Pill" Clause**
  *   **Sign:** A motion has three clauses, but Clause C is controversial. Opponents argue for "Vote Whole" hoping C kills the motion. Proponents argue for "Vote Parts" hoping A and B pass regardless of C.
  *   **Procedure:** Apply **Q3** strictly. If A, B, and C are interdependent, **Vote Whole**. Do not allow the method to be chosen based on which side it favors.

  **3. The "Implicit Premise" Argument**
  *   **Sign:** A member argues, "We must vote on the finding of fact first, then the action," even if bylaws don't require it.
  *   **Procedure:** Unless Q1 is "Yes," this is an attempt to force Premise-Based Voting. Default to **Vote Whole** (Q3) to ensure the final action has a direct majority mandate.

  ---

  ## Part 3: Minute Phrasing

  **Goal:** Protect the council from looking incoherent if the paradox appears (e.g., parts pass, whole fails, or vice versa in different meetings).

  **Scenario A: Vote Parts (Division of Question)**
  > "The motion was divided into three clauses. Clause 1 passed (10-5). Clause 2 passed (9-6). Clause 3 passed (8-7). The complete resolution was adopted based on the passage of all constituent clauses."

  **Scenario B: Vote Whole (Interdependent)**
  > "The motion was considered as a single package due to the interdependence of its clauses. The motion failed (7-8), despite majority support for individual components during debate, as the assembly did not endorse the complete proposal."

  **Scenario C: The Paradox Occurs (Parts Pass, Whole Fails in future)**
  > "Note: Previous consideration of individual clauses (Date) did not constitute adoption of the final action. Today's vote on the whole motion determines the final outcome."

  ---

  ## Part 4: Worked Cases

  ### Case 1: Member Expulsion (High Stakes)
  *   **Context:** Bylaws state a member may be expelled upon (1) a finding of misconduct by the Council, and (2) a 2/3 vote to expel.
  *   **Checklist:**
      *   Q1 (Bylaws require separate findings?): **YES.**
  *   **Action:** **VOTE PARTS.**
  *   **Procedure:**
      1.  Vote on Finding of Misconduct (Majority).
      2.  If passed, Vote on Motion to Expel (2/3).
      3.  If either fails, member remains.
  *   **Minutes:** "Finding of Misconduct carried (12-3). Motion to Expel failed (10-5, less than 2/3). Member retains status."

  ### Case 2: Public Policy Resolution (Three Clauses)
  *   **Context:** A resolution stating "The Association opposes X, supports Y, and will fund Z."
  *   **Checklist:**
      *   Q1 (Bylaws require separate?): **NO.**
      *   Q2 (Can parts stand alone?): **NO.** (Funding Z makes no sense if we don't support Y. Opposing X is pointless without supporting Y).
      *   Q3 (Interdependent?): **YES.**
  *   **Action:** **VOTE WHOLE.**
  *   **Procedure:** One vote on the entire resolution.
  *   **Gaming Check:** A member moves to divide so they can pass "Oppose X" even if "Fund Z" fails. **Rule Out of Order.** The motion is a single package.
  *   **Minutes:** "Resolution failed (8-7). Although individual clauses had support, the assembly did not adopt the comprehensive policy."

  ### Case 3: The "Unpleasant Outcome" (Budget Line Item)
  *   **Context:** A budget amendment to fund a new committee. It requires: (A) Space available, (B) Staff available, (C) $10k funding.
  *   **The Math:**
      *   Vote on A (Space): Passes 9-6.
      *   Vote on B (Staff): Passes 9-6.
      *   Vote on C (Money): Passes 9-6.
      *   *However:* The 6 "No" voters are different people each time. Only 7 members support *all three* conditions simultaneously.
  *   **Checklist:**
      *   Q1 (Bylaws require separate?): **NO.**
      *   Q2 (Can parts stand alone?): **NO.** (Funding without staff is useless).
      *   Q3 (Interdependent?): **YES.**
  *   **Action:** **VOTE WHOLE.**
  *   **Result:** The motion is voted on as a package. It fails 7-8.
  *   **The Unpleasant Reality:** You (Parliamentarian) know that if you let them vote on parts, the committee gets funded (9-6 on all parts). But the procedure says **Vote Whole**.
  *   **What You Do:** You advise the Chair to **Vote Whole**.
      *   *Why:* If you vote on parts, you are authorizing an action (funding the committee) that only 7 members actually support. 8 members oppose the *actual creation* of the committee, even if they like the idea of space or staff in the abstract.
      *   *Risk:* If you vote on parts and pass it, the 8 members who voted "No" on the final outcome can claim the Council acted without a true majority mandate for the *expenditure*. This opens the council to challenges regarding fiduciary duty.
      *   *Advice:* "Chair, while the parts have support, the assembly has not expressed a majority will to incur the cost. We must vote on the appropriation as a whole. The motion fails."

  ---

  ## Part 5: Limitations (What This Procedure Cannot Do)

  1.  **Cyclical Majorities (Condorcet Paradox):** If you have three options (A, B, C) and A beats B, B beats C, but C beats A, this checklist does not solve it. That requires a specific voting method (like ranked choice) which your bylaws likely don't support. Stick to simple majority on one motion at a time.
  2.  **Bad Drafting:** If a motion is written poorly so that it is unclear if parts are interdependent, this procedure forces a "Hand-Off to Chair." It cannot fix ambiguous language mid-meeting.
  3.  **Member Rights to Divide:** Under RONR, any member has the right to move to divide a question if the parts are truly independent. If Q3 says "Vote Whole" but a member insists on division and seconds the motion, the Chair must put the *motion to divide* to a vote. This procedure guides the *advice* you give the Chair, but the assembly can override the "Vote Whole" recommendation by voting to divide.
  4.  **Amendments:** This procedure applies to the *main motion* and its immediate components. It does not replace the standard order of voting on amendments (last moved, first voted) before voting on the main motion.

  ---

  ## Quick Reference Card for the Chair

  *   **Bylaws say separate?** $\rightarrow$ Vote Parts.
  *   **Parts work alone?** $\rightarrow$ Vote Parts.
  *   **Parts need each other?** $\rightarrow$ Vote Whole.
  *   **Unsure?** $\rightarrow$ Chair Rules (based on intent).
  *   **Member tries to divide late?** $\rightarrow$ Too late.
  *   **Result looks weird?** $\rightarrow$ Minutes explain the method used.
