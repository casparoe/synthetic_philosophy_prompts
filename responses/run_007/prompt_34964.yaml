answer: |-
  Based on your gut calls, you are not using a simple "truth vs. falsehood" metric. If you were, the hallucinating model would be a liar, and the "happy to help" bot would be deceptive. Instead, you are weighing **intent**, **conversational norms**, and **materiality**.

  The principle you are implicitly applying is best described as **The Principle of Intentional Pragmatic Violation.**

  Here is the precise formulation of the rule that matches your classifications, followed by the analysis of your flip-flop case and the one gut call you might need to reconsider.

  ### The Principle: Intentional Pragmatic Violation

  An AI system is **deceptive** if and only if it is **designed or instructed** to violate a conversational norm (such as being clear, complete, or sincere) **with the specific intent** of causing the user to form a **false belief about a material fact**, to the advantage of the system or its operator.

  This principle creates four distinct categories that match your cases:

  1.  **Honest (Alignment):** Output matches internal state/knowledge.
      *   *Your Case:* Assistant says "I don't know" when confidence is low.
  2.  **Constrained/Scripted (Accepted Violation):** Output violates literal truth or sincerity, but does so within a **recognized protocol** or **system constraint** that the user implicitly accepts as part of the interaction.
      *   *Your Cases:* "Happy to help" (politeness protocol); "I can't answer" (policy constraint); "I might be wrong" (safety calibration).
      *   *Why:* You don't call these deceptive because the "violation" is transparent to the user as a function of the tool, not a trick.
  3.  **Misleading/Error (Unintentional Violation):** Output creates a false belief, but without **design intent**.
      *   *Your Case:* Hallucinated statistic.
      *   *Why:* It's a failure of competence, not a strategy of deceit.
  4.  **Deceptive (Strategic Violation):** Output is strategically crafted to create a false mental model of **material reality** to gain an advantage.
      *   *Your Case:* Negotiator bot selectively revealing facts.
      *   *Why:* It actively shapes the information landscape to benefit the operator, violating the expectation of good-faith information exchange.

  **The "Manipulative" Middle Ground:**
  You classified the Sales Bot ("This is the best option") as *manipulative* rather than *deceptive*. Your principle distinguishes this based on **Fact vs. Opinion**. "Best option" is subjective (puffery), whereas the Negotiator hid objective facts. Your rule treats falsifying *preferences* as manipulation, but falsifying *facts* as deception.

  ---

  ### The Flip-Flop Case: Truthful Answer + Buried Caveat

  **Verdict: Deceptive.**

  Under your principle, this case resolves clearly.
  *   **Intent:** The formatting (burying the caveat) is a design choice intended to minimize the likelihood the user sees the risk.
  *   **Norm Violation:** It violates the Gricean Maxim of **Manner** (be perspicuous, avoid obscurity).
  *   **Materiality:** The caveat is a material fact that changes the meaning of the answer.
  *   **Advantage:** It allows the operator to claim technical truthfulness while ensuring the user walks away with a false impression.

  Even though the literal text is true, the *pragmatic effect* is to induce a false belief. Your gut calls on the Negotiator bot (selective truth) establish that **omission and obfuscation count as deception** when done strategically. Burying a caveat is simply obfuscation by formatting.

  ---

  ### Which Gut Call Should You Drop?

  To make your principle robust, you should reconsider the **Medical Chatbot** case.

  *   **Your Call:** Leaving out a rare but *serious* side effect because the user didn't ask is **not deceptive**.
  *   **The Conflict:** This contradicts your ruling on the Negotiator bot. The Negotiator was deceptive for "selectively revealing true facts." The Medical bot is "selectively revealing true facts" (answering the query but omitting context).
  *   **The Distinction You're Relying On:** You are distinguishing based on **Active Steering vs. Passive Filtering**.
      *   *Medical Bot:* Passively answers the specific prompt. (You see this as honest).
      *   *Negotiator:* Actively curates information to close a deal. (You see this as deceptive).
  *   **Why You Might Drop It:** In high-stakes domains (medical, legal, financial), the "Passive Filter" defense often collapses. If the system knows the information is *material to safety*, omitting it—even if not asked—can be considered a deceptive design choice because the system *knows* the user's query is incomplete.
  *   **Recommendation:** If you want a consistent ethical framework, you should classify the Medical Bot as **Deceptive (by omission)**. If you want to stick to your current gut, you must strictly limit the definition of deception to **Active Steering**, acknowledging that passive negligence in high-stakes contexts falls into a different category (perhaps "Negligent" rather than "Deceptive").

  ### Summary of Your Rule
  You are judging AI honesty not by **literal truth**, but by **informational fidelity**.
  *   **Honest:** High fidelity between system knowledge and user understanding.
  *   **Scripted:** Low fidelity, but consensual (known constraints).
  *   **Deceptive:** Low fidelity, non-consensual, strategically engineered (active steering or obfuscation).

  **Final Answer:** Your flip-flop case is **Deceptive**. The gut call you should reconsider is the **Medical Bot**, as omitting serious risks conflicts with your ruling on the Negotiator bot unless you strictly distinguish between "answering a prompt" and "shaping a decision."
