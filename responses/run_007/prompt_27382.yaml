      *   *Tier 3 (Semantic/Definition):* Showing the definition is circular or unfalsifiable. (If "inviolate" just means "whatever hasn't been violated yet").
      *   *Tier 4 (Alternative Explanations):* Showing self-reference emerges from flat/distributed processes without hierarchy. (Connectionism).

  5.  **Drafting the Content - Section by Section:**

