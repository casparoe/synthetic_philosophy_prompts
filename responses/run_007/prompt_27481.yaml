answer: |-
  You have put your finger on one of the most profound and enduring critiques of modern administrative law and welfare economics. Your intuition is not only correct; it aligns with a central argument in 20th-century political philosophy.

  The tension you describe—between aggregating benefits across a population versus respecting the distinct boundaries between individuals—is the exact problem John Rawls identified in *A Theory of Justice* (1971). Rawls argued that utilitarianism (and by extension, cost-benefit analysis) treats society as a single super-person, extending the rational principle of individual choice (sacrificing a present pain for a future gain) to the collective. In doing so, it ignores the "separateness of persons."

  Here is an analysis of what this practice presupposes, how it is justified, and whether it creates a genuine inconsistency with the rest of the legal system.

  ### 1. What CBA Presupposes About Moral Separateness

  Strictly speaking, Cost-Benefit Analysis (CBA) is a tool of **welfarism**, which is a form of consequentialism. It presupposes that the moral goal of policy is to maximize the net aggregate welfare of the population.

  **The Implicit Metaphysic:**
  To say that a gain to Person A can morally offset a loss to Person B simply because the sum is positive is to assume that the *location* of the utility does not matter fundamentally. It assumes that there is a common currency of value (money/welfare) that can flow across person-boundaries without moral friction.

  **The Rawlsian Critique:**
  As you noted, Rawls argued this is a category error. An individual may rationally choose to endure a headache today to avoid a migraine tomorrow. But it is not necessarily rational or just for the *state* to impose a headache on Citizen X to prevent a migraine for Citizen Y. By netting the two out, CBA implicitly treats the boundary between persons as permeable. It does not necessarily *deny* that persons are separate ontologically, but it denies that this separateness has **deontological weight** in the calculation. It treats individuals as vessels for utility rather than rights-bearing agents who cannot be used merely as means to an aggregate end.

  ### 2. The Economic Defense: Kaldor-Hicks Efficiency

  Economists and legal scholars who defend CBA are aware of this critique. Their standard defense relies on the distinction between **Pareto Efficiency** and **Kaldor-Hicks Efficiency**.

  *   **Pareto Efficiency:** A change is good only if it makes at least one person better off and *no one* worse off. This respects the separateness of persons absolutely but makes almost all public policy impossible (since almost every regulation creates some loser).
  *   **Kaldor-Hicks Efficiency:** A change is good if the winners *could* theoretically compensate the losers and still be better off.

  Regulatory CBA operates on Kaldor-Hicks. The justification is not that the separateness of persons doesn't matter, but that **transaction costs** make actual compensation impossible. It is administratively impossible for the beneficiaries of a clean air rule to identify and pay the specific consumers who pay higher prices, or for the regulated industry to compensate every individual who benefits from reduced pollution.

  Therefore, the defense argues, we accept the aggregation as a "second-best" solution to the problem of social coordination. It is a pragmatic concession, not necessarily a moral denial of separateness. However, critics reply that a pragmatic excuse does not resolve the moral injury of uncompensated harm.

  ### 3. The Legal Tension: Tort vs. Regulation

  Your observation about tort law is astute. There is indeed a philosophical schism between how Tort Law and Regulatory Law handle harm.

  **Tort Law: Corrective Justice**
  Tort law is largely grounded in **corrective justice**. It focuses on the bipolar relationship between the injurer and the victim. If I harm you, I owe *you* restitution. The law does not care if my harm to you allowed me to save money that I then donated to charity; the specific violation of your right must be corrected. This aligns with your intuition that persons are separate and inviolable.

  **Regulation: Distributive/Aggregate Justice**
  Regulatory law is grounded in **risk management and collective welfare**. It operates *ex ante* (before the harm) rather than *ex post* (after the harm).
  *   **Statistical vs. Identified Lives:** In tort law, the victim is identified. In regulation, the victims and beneficiaries are statistical. The law treats the imposition of a *risk* differently than the infliction of a *harm*.
  *   **The Defense:** Proponents argue that regulation applies rules universally. While the *outcome* of a specific rule might burden Group A and benefit Group B, the *system* of regulation is meant to benefit everyone over time. You might pay higher prices for a pollution rule today, but you might be the beneficiary of a safety rule tomorrow.

  **Is it a Contradiction?**
  Yes, there is a normative tension.
  *   **Tort Law** says: "You cannot sacrifice X for Y without X's consent or compensation."
  *   **Regulatory Law** says: "We can sacrifice X for Y if the total social welfare increases."

  Legal scholars like Guido Calabresi have noted that we live in a "mixed system." We use tort law to police individual wrongs and regulation to manage systemic risks. The law "papers over" the tension by assigning these tasks to different institutions (Courts vs. Agencies). Courts protect rights; Agencies maximize welfare. When these collide (e.g., can a company be sued in tort for complying with a federal regulation?), the courts often struggle to reconcile the two philosophies.

  ### 4. Can CBA Be Justified Without Denying Separateness?

  Is it possible to use CBA without accepting the utilitarian premise that persons are mere containers of utility? Some philosophers and legal theorists argue yes, through three main avenues:

  **A. The Ex-Ante Consent Argument**
  This argument suggests that CBA respects separateness if we view it from behind a "veil of ignorance." If every individual agreed to a system of rules that maximizes overall safety/wealth *before* knowing whether they would be the winner or the loser in a specific instance, then the specific trade-offs are justified by that hypothetical consent. You are not being used as a means; you are a participant in a mutually advantageous scheme of social cooperation.

  **B. CBA as Information, Not Decision**
  Some defenders argue CBA is not a moral decision procedure but an information-gathering tool. It ensures that regulations are not *wasteful*. If a rule costs \$1 billion and saves no lives, it wastes resources that could have saved lives elsewhere. In this view, CBA respects separateness by ensuring that the burdens imposed on some are not *futile*. It doesn't justify the harm, but it minimizes gratuitous harm.

  **C. Distributional Weighting**
  To address the "separateness" concern, some agencies (and theorists) advocate for **distributional CBA**. This modifies the analysis to weight benefits and costs differently depending on who bears them (e.g., a dollar of cost to a poor person counts more than a dollar of cost to a rich person). This attempts to reintroduce the moral status of the specific individuals into the aggregate math.

  ### 5. Conclusion: The Unresolved Tension

  You are correct that there is a real philosophical tension here that the law manages rather than resolves.

  1.  **Moral Presupposition:** Standard CBA implicitly adopts a utilitarian framework that treats the separateness of persons as morally secondary to aggregate welfare. It does not necessarily deny persons are separate, but it denies that separateness creates an absolute barrier to trade-offs.
  2.  **Legal Consistency:** There is a genuine inconsistency between the corrective justice of tort law and the aggregative logic of regulation. The legal system tolerates this by compartmentalizing: Courts handle individual wrongs; Agencies handle collective risks.
  3.  **Justification:** The practice is usually justified pragmatically (we can't compensate everyone) or procedurally (ex-ante consent to a risk-reduction system), rather than by denying the moral truth of your observation.

  Your discomfort stems from recognizing that **efficiency is not justice.** The regulatory state often prioritizes efficiency (maximizing the size of the pie) while the tort system prioritizes justice (ensuring no one's slice is stolen without recompense). The friction you feel is the friction between those two competing values, which modern law attempts to balance but never fully reconciles.
