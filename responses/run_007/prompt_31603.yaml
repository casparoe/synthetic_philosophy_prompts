prompt: |-
  I keep going back and forth on this and it's driving me nuts. The standard argument says voting is irrational — your chance of actually deciding an election is basically zero, so the expected value of your vote is nothing, and any cost at all (time, gas, standing in line) makes it a bad bet. Mathematically that checks out. But then I look around and I see political scientists treating voter turnout as a serious thing to study, philosophers writing about civic duties, and plenty of people who definitely get the expected-value argument still showing up at the polls. So is the economic argument just wrong, or are all these people systematically irrational about this one thing? What am I missing? Keep it to one paragraph.
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **Topic:** The rationality of voting (the "paradox of voting").
      *   **User's Dilemma:** The economic/expected-value argument says voting is irrational (cost > benefit * probability), yet people vote, experts study it, and philosophers defend it. Is the math wrong or are people irrational?
      *   **Constraint:** Keep it to *one paragraph*.

  2.  **Identify the Core Concepts:**
      *   **Downsian Paradox:** The classic economic argument (Riker & Ordeshook, 1968, building on Downs). $R = PB - C$. If $P$ (probability of being pivotal) is near zero, $R$ is negative.
      *   **Resolution:** The model is incomplete, not wrong. It misses non-instrumental benefits.
      *   **Key Factors:** Civic duty, social pressure, expressive voting, identity, habit, social norms.
      *   **Conclusion:** People aren't irrational; the definition of "utility" in the simple model is too narrow.

  3.  **Drafting - Attempt 1 (Mental Outline):**
      The economic argument isn't wrong mathematically, but it's incomplete because it defines utility too narrowly. It assumes you only vote to change the outcome (instrumental value). But political scientists and philosophers argue people get "consumption benefits" from voting. This includes fulfilling a civic duty, expressing identity, social pressure, or avoiding guilt. So when you add these psychological and social benefits to the equation, the expected value becomes positive for many people. Therefore, voters aren't irrational; they just value things beyond just tipping the election result.

  4.  **Refining and Condensing (Focusing on Flow and Constraints):**
      The economic argument isn't mathematically wrong, but it relies on an overly narrow definition of utility that ignores why humans actually act. While the *instrumental* value of tipping an election is negligible, the *expressive* and *social* benefits—such as fulfilling a sense of civic duty, affirming group identity, avoiding social shame, or simply feeling like a good citizen—provide immediate psychological rewards that outweigh the costs of time and gas. Political scientists and philosophers aren't ignoring the math; they're expanding the equation to include these non-outcome-based benefits, meaning voters aren't systematically irrational but rather optimizing for a broader set of personal and social values than mere pivotality.

  5.  **Checking Constraints:**
      *   One paragraph? Yes.
      *   Addresses the dilemma? Yes (math vs. behavior).
      *   Explains what's missing? Yes (utility definition).

  6.  **Final Polish:**
      Make it punchy. Ensure the distinction between instrumental and expressive/consumption benefits is clear.

      *Revised Draft:*
      The economic argument isn't mathematically wrong, but it is incomplete because it defines "utility" too narrowly, assuming you only vote to change the outcome. While the *instrumental* probability of casting the deciding vote is negligible, the *consumption* benefits of voting—such as fulfilling a sense of civic duty, affirming social identity, avoiding guilt, or gaining social approval—provide immediate psychological rewards that often outweigh the costs of time and effort. Political scientists and philosophers aren't ignoring the math; they recognize that humans derive value from the act itself rather than just the result, meaning voters aren't systematically irrational but are instead optimizing for a broader set of personal and social values than mere pivotality.

  7.  **Final Count Check:** Looks good. One paragraph. Addresses the prompt directly.

  8.  **Final Output Generation** (matching the revised draft).
