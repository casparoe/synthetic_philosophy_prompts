  7.  **Refining the Tone:**
      *   Ensure I'm not being neutral. Use phrases like "Here is the hard truth," "You need to drop," "This is the weak link."
      *   Make sure I reference Montaigne specifically, as that's the context. Montaigne isn't a relativist; he's a skeptic who believes in natural law (sometimes). The user might be misreading Montaigne as a postmodernist.
