prompt: |-
  I've been teaching a grad seminar on Bayesian epistemology, and I've found myself defending the common prior assumption more than I expected to. For context, the CPA says roughly that rational agents starting from the same background information should have the same prior probability distribution — any differences in their posterior beliefs should be fully explainable by differences in the evidence they've each encountered. Aumann's agreement theorem is the canonical formal result behind this, but the philosophical version of the claim goes beyond the theorem's conditions.

  I'm not a fanatic about it — I don't think every violation of the CPA is a failure of rationality. But I do think the assumption is the right default: if two people disagree, the interesting explanation is almost always that they have different information, not that they have incommensurable fundamental outlooks. And I think appeals to "different priors" are too often a conversation-stopper.

  Here's what I want: Tell me what would count against this view. Not just the standard counterarguments people always give — I know the usual moves. I want a map of what the view actually risks. What kinds of evidence or arguments should make me substantially revise it, and which are merely awkward? Distinguish between:

  - Things that would be fatal if established (e.g., a clear case where we have every reason to think two people share all relevant evidence and are fully rational, yet their disagreement persists and isn't resolvable by further information-sharing).
  - Things that are awkward but the view can absorb with reasonable qualifications.
  - Things that critics treat as problems but a defender of the CPA should not concede as counting against it at all.

  Some specific things I'd like you to address: Does the view make empirical predictions that distinguish it from rivals (like permissivism about rational credences), or has it been insulated so that no possible observation could disconfirm it? If it has been insulated, is that a problem for a normative claim of this kind, or is that just what we should expect? Also, I find the "impracticality" objection — that real agents can't compute the common prior even if it exists — to be pretty weak, but maybe I'm wrong about that. I'd like to know if a defender of my position should be more worried about it than I am.

  Basically, I want an honest assessment of how exposed this view is, from someone who isn't just trying to score points against it. If the honest conclusion is that it's mostly a methodological commitment rather than a falsifiable thesis, say so — and say whether that's fine or whether it undermines the whole thing.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** A graduate seminar instructor in Bayesian epistemology. They are knowledgeable, familiar with Aumann's Agreement Theorem, and currently defending the Common Prior Assumption (CPA) more than expected.
      *   **Stance:** Moderate defender. Not a fanatic, but sees CPA as the right default. Believes disagreement is usually due to evidence, not incommensurable priors. Sees appeals to "different priors" as conversation-stoppers.
      *   **Goal:** Wants a "map of what the view actually risks." Needs a triage of counterarguments (Fatal, Awkward/Absorbable, Irrelevant).
      *   **Specific Questions:**
          *   Empirical predictions vs. insulation (falsifiability).
          *   Normative claim status (does insulation matter?).
          *   The "impracticality" objection (computational limits).
          *   Honest assessment of exposure (methodological commitment vs. falsifiable thesis).
      *   **Tone:** Honest, rigorous, philosophical, not adversarial ("someone who isn't just trying to score points").

  2.  **Deconstruct the Common Prior Assumption (CPA):**
      *   *Core Claim:* Rational agents with the same information *should* have the same priors.
      *   *Motivation:* Objectivity of rationality, avoidance of arbitrariness, Aumann's theorem (agreeing to disagree is impossible with common priors).
      *   *Opposing View:* Permissivism (multiple rational priors possible given same evidence), Subjective Bayesianism (priors are subjective constraints only).

  3.  **Brainstorming Counterarguments & Triage:**

      *   *Fatal:*
          *   **Persistent Rational Disagreement:** If we can construct a case where two agents are idealized (same info, rational, communicative) and *still* disagree without irrationality, CPA is dead. (e.g., "The Problem of the Priors" in its strongest form).
          *   **Underdetermination of Theory by Data:** If the mapping from "background info" to "prior" is fundamentally many-to-one even in principle, CPA is false.
          *   **Indexical/Self-Locating Beliefs:** This is a strong candidate for a fatal flaw. Centered worlds might resist common priors.

      *   *Awkward/Absorbable:*
          *   **Computational Impracticality:** The user suspects this is weak. I agree. CPA is normative, not descriptive. Idealization is standard in epistemology.
          *   **Vagueness of "Same Information":** It's hard to specify, but not impossible. Just requires careful modeling.
          *   **Language/Conceptual Schemes:** If they speak different languages, do they have the same info? This is a modeling issue, not a fatal one.

      *   *Irrelevant (Critics get it wrong):*
          *   **Psychological Differences:** Humans *do* have different priors. CPA is about *rationality*, not psychology.
          *   **Heuristics and Biases:** Same as above.
          *   **Moral/Political Values:** Unless these are treated as truth-apt beliefs subject to Bayesian updating, they aren't priors in the epistemic sense.

  4.  **Addressing Specific Prompts:**

      *   *Empirical Predictions/Insulation:* CPA is normative. It doesn't predict what people *do*, but what they *should* do. However, it implies that persistent disagreement among idealized agents is impossible. If we treat "idealized agents" as a regulative ideal, it's hard to falsify empirically. But it *does* have dialectical consequences (e.g., you can't just say "we have different priors" to end a debate).
      *   *Impracticality:* The user is right to be skeptical. Normative theories often demand the impossible (e.g., logical omniscience). The risk isn't impracticality, but *incoherence*. Is the common prior even *definable*?
      *   *Methodological Commitment:* This is the crux. If it's just a rule for conversation ("assume common priors until proven otherwise"), it's robust. If it's a metaphysical claim about the structure of rationality, it's vulnerable to underdetermination arguments.

  5.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Acknowledge the user's position. Validate that CPA is a strong default but has specific pressure points.
      *   **Category 1: Fatal Threats (The "Hard" Problems):**
          *   *Radical Underdetermination:* If evidence + logic doesn't constrain priors to a single point. (The "Principle of Indifference" failures).
          *   *Self-Locating Beliefs:* The "Sleeping Beauty" problem type stuff. Indexicals break the symmetry required for common priors.
          *   *Conceptual Incommensurability:* If "same information" implies "same concepts," and concepts are partly constitutive of priors, CPA might be circular.
      *   **Category 2: Awkward but Absorbable:**
          *   *Computational Limits:* Agree with the user. It's a normative ideal.
          *   *Specifying the "Prior":* Distinguishing likelihoods from priors is messy.
          *   *Genetic/evolutionary priors:* We are wired differently. Absorbable by distinguishing *psychological* starting points from *rational* starting points.
      *   **Category 3: Irrelevant (Critics miss the point):**
          *   *Descriptive Psychology:* Humans aren't rational.
          *   *Values/Utilities:* Confusing epistemic priors with utility functions.
      *   **Deep Dive: Empirical Predictions & Insulation:**
          *   Is it falsifiable? Not directly, because it's normative.
          *   Does insulation matter? For a normative claim, "insulation" from empirical refutation is standard (like logic). But insulation from *conceptual* refutation is bad.
          *   The risk is becoming a "no true Scotsman" defense for disagreement.
      *   **Deep Dive: Impracticality:**
          *   Why the user is right: Normative ideals guide inquiry.
          *   Where the worry lies: If the ideal is *incoherent* (like a round square), not just hard.
      *   **Conclusion/Verdict:** It is primarily a methodological commitment. That is fine, provided it doesn't block genuine inquiry into structural rationality.

  6.  **Refining the Argument (Self-Correction during drafting):**
      *   *Correction:* I need to be careful not to conflate Objective Bayesianism (logic constrains priors) with CPA. CPA is often assumed in game theory/economics without claiming there is *one* logical prior, just that *if* they are rational and share info, they share priors. Wait, actually, CPA *implies* there is a unique rational prior given background info. I need to make sure I distinguish between "Common Prior" as a game-theoretic assumption vs. "Unique Rational Prior" as an epistemological claim. The user seems to be defending the epistemological version ("rational agents... should have the same prior").
      *   *Refinement on "Fatal":* The strongest fatal threat is the **Principle of Indifference paradoxes** (Bertrand's Paradox). If there is no non-arbitrary way to assign a prior to a state space, CPA collapses into arbitrariness.
      *   *Refinement on "Insulation":* If CPA is unfalsifiable, is it useless? No, it functions as a regulative ideal (Kant). But if it's *too* insulated, it becomes dogmatic. The line is whether it allows for the *possibility* of rational disagreement in principle.

  7.  **Final Polish:** Ensure the tone is collegial and respectful of the user's expertise. Use precise terminology (permissivism, indexicality, logical omniscience). Structure clearly with the requested categories.

  8.  *(Final check against user prompt)*: Did I answer the specific questions about empirical predictions and impracticality? Yes. Did I distinguish the three categories? Yes. Is it an honest assessment? Yes.

  **(Self-Correction Note):** I need to make sure I don't just repeat standard intro textbook stuff. The user teaches grad seminars. I need to engage with the *structural* vulnerabilities of the view, not just "people are biased." Focus on the *normative* status.

  Let's organize the "Fatal" section around the *possibility* of rational divergence. If permissivism is true, CPA is false. So arguments for permissivism are fatal. What are the best arguments for permissivism?
  1.  Underdetermination of theory by data (Quinean).
  2.  The arbitrariness of logical priors (Keynes/Jaynes problems).
  3.  Indexical knowledge (Lewis).

