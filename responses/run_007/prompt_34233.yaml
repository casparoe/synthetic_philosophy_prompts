answer: |-
  # Joint Statement on the Raven Paradox
  **Adversarial Collaboration between Camp A (Quantitative/Bayesian) and Camp B (Qualitative/Structural)**

  **Date:** October 26, 2023
  **Signatories:** Representatives of Camp A and Camp B

  ## 1. Agreed Claims
  Both camps grant the following claims regarding the logical structure of the paradox, the limitations of the debate, and mutual concessions.

  1.  **Logical Equivalence:** We agree that the hypothesis $H_1$ ("All ravens are black") and $H_2$ ("All non-black things are non-ravens") are logically equivalent in classical first-order logic. Any solution that denies this equivalence must explicitly justify a departure from classical logic (e.g., intuitionistic or relevant logic), which neither camp currently advocates as the primary solution.
  2.  **The Source of Tension:** We agree the paradox arises from the joint plausibility of three claims which cannot all be true: (i) Nicod's Criterion (instances confirm universal generalizations), (ii) The Equivalence Condition (logically equivalent hypotheses are confirmed by the same evidence), and (iii) The Intuition of Irrelevance (observing a green apple provides no evidence about ravens).
  3.  **Limitations of the Paradox:** We agree the paradox does *not* demonstrate that scientific inference is fundamentally broken, nor does it prove that induction is impossible. It is a localized problem regarding the formalization of confirmation, not a skepticism-inducing crisis.
  4.  **Concession by Camp A:** Camp A concedes that while the observation of a green apple may technically raise the probability of $H_1$ under specific background assumptions, the magnitude of this confirmation is so negligible in the actual world that treating it as scientifically relevant would be inefficient and misleading. Camp A grants that "confirmation" in the formal sense does not entail "worthwhile evidence" in the pragmatic sense.
  5.  **Concession by Camp B:** Camp B concedes that under a strict "random sampling from the universe of objects" model with finite populations, the observation of a non-black non-raven *does* mathematically alter the posterior probability of $H_1$ (typically increasing it). Camp B grants that the intuition of "zero confirmation" relies on background assumptions about sampling protocols that are not explicitly stated in the paradox's standard formulation.
  6.  **Role of Background Knowledge:** Both camps agree that confirmation is not a relation between evidence $E$ and hypothesis $H$ alone, but is relative to background knowledge $K$ (specifically regarding population sizes and sampling methods). Disagreements often stem from implicit differences in assumed $K$.

  ## 2. Disagreements Table
  Despite the agreements above, residual disagreements remain regarding the interpretation of the formalism and the normative rules of inference.

  | Point of Disagreement | Camp A View (Quantitative/Bayesian) | Camp B View (Qualitative/Structural) |
  | :--- | :--- | :--- |
  | **1. The Status of the Green Apple** | Given $K=$"random object selection from a finite universe," observing a green apple *does* confirm "All ravens are black." The confirmation value is small but non-zero ($P(H\|E) > P(H)$). | Even given $K=$"random object selection," observing a green apple provides *no* confirmation. The probability shift is an artifact of inappropriate priors; scientifically, the likelihood ratio is 1. |
  | **2. The Equivalence Condition** | The Equivalence Condition must hold. If $H_1$ and $H_2$ are logically equivalent, evidence confirming one must confirm the other. The paradox dissolves by accepting that the apple confirms both, just weakly. | The Equivalence Condition should be restricted or rejected for confirmation logic. Confirmation is intensional (about predicates), not extensional. How we describe the hypothesis constrains what counts as relevant evidence. |
  | **3. Default Sampling Assumptions** | In the absence of explicit sampling information, the Principle of Indifference over objects is the appropriate default. We must model the universe as a bag of objects to calculate $P(E\|H)$. | In the absence of explicit sampling information, the default assumption is *no confirmation*. Scientific hypotheses imply a testing protocol (e.g., "sample ravens"); without that protocol, inference is undefined, not merely weak. |

  ## 3. Cruxes and Test Cases
  We identify the following sub-questions as the primary drivers of our disagreement. Settling these would move at least one camp.

  ### Crux 1: The "Small Universe" Intuition Pump
  **Question:** Does the intuition of irrelevance persist when the population sizes are small enough for the probability shift to be perceptible?
  **Test Case:** Imagine a closed world containing exactly 10 objects: 1 Rave and 9 Apples.
  *   $H$: The Rave is Black.
  *   Protocol: You select one object at random. It is a Green Apple.
  *   **Camp A Prediction:** This significantly confirms $H$. (If $H$ were false, the Rave would be Non-Black, meaning there would be 10 Non-Black objects instead of 9. Selecting a Non-Black object would be more likely under $\neg H$. Finding a Non-Black object that is *not* the Rave thus supports $H$.)
  *   **Camp B Prediction:** This confirms $H$ *only if* the protocol was "Select a Non-Black object." If the protocol was "Select Any Object," the observation is irrelevant to the Rave's color because the selection was not targeted at the domain of the hypothesis.
  *   **Resolution Condition:** If Camp B admits confirmation in the "Small Universe" case, the disagreement reduces to magnitude (verbal/pragmatic). If Camp B maintains zero confirmation even here, the disagreement is substantive (regarding the definition of likelihood).

  ### Crux 2: The "Unknown Protocol" Scenario
  **Question:** Is confirmation undefined or null when the sampling method is unknown?
  **Test Case:** I present you with a Green Apple and say, "I found this." I do not specify how I found it.
  *   **Camp A Prediction:** We must assume a default prior over sampling methods. Under a maximum-entropy assumption, the apple provides a small positive confirmation.
  *   **Camp B Prediction:** Without knowing if I was "looking for ravens," "looking for non-black things," or "looking for apples," the likelihood ratio is undefined. Therefore, no rational update should occur.
  *   **Resolution Condition:** Agreement on whether "undefined likelihood" warrants a probability update of 0 (Camp B) or a calculated update based on indifference (Camp A).

  ### Crux 3: Projectibility vs. Probability
  **Question:** Is "confirmation" purely probabilistic support, or does it require "projectibility" (Goodman)?
  **Test Case:** Consider the hypothesis $H^*$: "All ravens are *blacker-than*." (Where *blacker-than* is a gerrymandered predicate co-extensive with black but defined disjunctively).
  *   **Camp A Prediction:** If the predicate is co-extensive, the probability update is identical to "black."
  *   **Camp B Prediction:** Evidence confirms "black" but not "blacker-than," despite logical equivalence, because only "black" is a projectible predicate suitable for lawlike generalization.
  *   **Resolution Condition:** Whether Camp A accepts that probability theory must be constrained by a prior theory of natural kinds to yield correct "confirmation" values.

  ## 4. Assessment of Verbal Dispute
  We assess that a significant portion of the dispute is **verbal**, specifically regarding the definition of the term "confirms," though a substantive core remains regarding default priors.

  1.  **Terminological Divergence:**
      *   **Camp A** uses "confirms" to mean *any* positive probabilistic relevance ($P(H\|E, K) > P(H\|K)$).
      *   **Camp B** uses "confirms" to mean *scientifically relevant support*, which implies a threshold of significance ($\Delta P > \delta$) or a specific causal/sampling connection.
      *   **Proposal:** We recommend reserving the term **"probabilistic support"** for Camp A's definition ($\Delta P > 0$) and **"evidential confirmation"** for Camp B's definition (support derived from a hypothesis-directed sampling protocol). Under this disambiguation, a green apple provides *probabilistic support* but not *evidential confirmation*.

  2.  **Substantive Core:**
      *   The dispute is not *merely* verbal. A substantive disagreement remains regarding **default background knowledge ($K$)**.
      *   Camp A asserts that in the absence of information, one should model the world as a random draw from objects (Principle of Indifference).
      *   Camp B asserts that in the absence of information, one should model the inquiry as lacking a testing protocol (Principle of Insufficient Reason regarding *methods*).
      *   This is a formal disagreement about how to construct likelihood functions when experimental design is unspecified.

  3.  **Conclusion on Predictions:**
      *   If both camps agree to specify the **sampling protocol** explicitly in all future formulations of the problem, their numerical predictions for $P(H\|E)$ converge in most standard cases.
      *   The remaining disagreement is whether a reasoner *should* assume a random-object protocol when none is stated. Camp A says yes (mathematical default); Camp B says no (scientific default).

  **Signed,**
  *The Adversarial Collaboration Working Group*
