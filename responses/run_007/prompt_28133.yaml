answer: |-
  It is a really sharp observation you have made about the mechanics of Wikus's change, and I think you have put your finger on exactly where the film pushes back against the optimism of the expanding circle thesis. You are right that Peter Singer popularized the term, though as you noted, the genealogy goes back further to people like William Edward Hartpole Lecky. The core of that theory is usually grounded in a kind of Enlightenment optimism: the idea that through reason, education, and moral argument, we can logically deduce that there is no relevant difference between us and them, and therefore our circle of concern should widen. It assumes that moral progress is a cognitive process, that we can think our way into empathy. But *District 9* seems to argue that cognition is exactly where we fail. Wikus never really has a moral epiphany in the philosophical sense. He doesn't sit down and realize that the prawns have inherent rights or sentience that demands respect. Instead, his moral shift is entirely contingent on his biology betraying him. He cares about them because he is becoming them, and more urgently, because he is being hunted like them.

  This distinction is crucial because it suggests that the boundary of the moral circle isn't drawn by logic, but by flesh. In the film, the line between human and non-human is porous, but only in one direction: contamination. When Wikus is human, the aliens are expendable assets or nuisances. The moment his DNA changes, he moves from the subject of rights to the object of experimentation. This supports your reading that the circle doesn't expand so much as the individual gets dragged across the border. It is a much darker anthropology than Singer's. Singer assumes we can overcome our tribal instincts through rationality. *District 9* suggests that our tribal instincts are somatic, rooted in the body, and that rationality is just a tool we use to justify whatever the body tells us is safe. Wikus only sees the humanity in the prawns when he sees his own hand mutating. It implies that without that visceral, bodily identification, moral concern is fragile, easily overridden by bureaucracy or profit, exactly as we see with the MNU operatives who treat Wikus as a spare parts depot the moment he stops being fully human.

  Then you have the reaction of the rest of humanity, which as you pointed out, doesn't widen at all; it contracts. If the expanding circle thesis were playing out in the narrative world, Wikus's plight should scandalize the public. His transformation should force humanity to confront its prejudice. Instead, the institution closes ranks. The circle hardens. This is where the film offers a brutal critique of the idea that moral progress is inevitable or even natural. The Nigerians in the film operate on a purely predatory logic, seeing the aliens as resources to be consumed, while the MNU operates on a utilitarian logic that sees Wikus as a resource to be harvested. Neither group expands their moral consideration. In fact, the film suggests that when resources are scarce or power is at stake, the circle tends to shrink to protect the core. The only reason Wikus survives is not because society accepted him, but because he escaped society entirely. He ends up in the junkyard, outside the law, outside the city, and outside the species.

  That brings us to the ending, which is where your question about hope versus bleakness really lands. There is a certain poignancy to Wikus folding those metal flowers. It shows he has retained his human capacity for love and care, even if his body is alien. But you have to ask who that care is for. His wife doesn't know it is him. Humanity doesn't know he is alive. His moral growth is entirely private. He has become a moral being, but he has been exiled from the moral community. If the expanding circle thesis is about the integration of new beings into our existing moral framework, Wikus represents a failure of that thesis. He wasn't integrated; he was ejected. The hope, if there is any, rests entirely on Christopher, the alien friend, returning in three years. But that hope is speculative and future-oriented. In the present tense of the film's conclusion, the circle has not expanded. Humanity has lost Wikus, and Wikus has lost humanity. The only bridge built between the species is one that required the destruction of the human participant.

  So, to answer your question about whether the theory is naive, I think the film suggests that the expanding circle thesis is correct about the destination but naive about the vehicle. It is true that moral concern *can* widen, but the film argues it rarely happens through the gentle accumulation of reason. It happens through crisis, through suffering, and often through the dissolution of the self that was doing the excluding. The film posits that we are not good enough to widen the circle voluntarily. We need to be forced into the position of the victim to understand the value of the victim. That is a much more tragic view of moral progress. It suggests that empathy is not a gift we give, but a recognition we are forced into when our own vulnerability is exposed. Wikus doesn't choose to join the prawns; the prawns claim him. And in doing so, the film asks whether a moral change that requires the destruction of your own identity can really be called progress, or if it is just a different kind of loss.

  Ultimately, *District 9* doesn't necessarily dismiss the goal of the expanding circle, but it strips away the comfort of thinking we are moving toward it naturally. It confirms that the boundary between us and them is real and violent, not just a conceptual line we can erase with a better argument. It complicates the theory by insisting that bodily vulnerability is the only language strong enough to cross that boundary. So the film isn't an illustration of the theory working; it is a stress test that the theory fails. It leaves us with the unsettling idea that the only way to truly include the other is to cease being the self that was excluding them in the first place. Wikus waits for rescue in the slums, fully alien, hoping for a future where the circle might finally widen, but the film itself ends in the shadow of that uncertainty, leaving us to wonder if the cost of moral inclusion is simply too high for anyone still calling themselves human to pay.
