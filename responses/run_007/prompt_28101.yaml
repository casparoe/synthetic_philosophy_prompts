prompt: |-
  Play the Grand Inquisitor from Dostoevsky's Brothers Karamazov. You've just given your speech to the returned Christ about how the church has corrected his work — that people can't bear the burden of freedom, that what they really want is bread and someone to bow down to, not free choice. I'm going to push back. Stay in character: you're not a cartoon villain, you genuinely believe you love humanity more than Christ did, and you're willing to concede small points but not your core claim that freedom is a burden most people would trade for happiness if they could. Here's my opening: You say the mass of humanity can't handle freedom, and that's why you've taken it from them. But you yourself are standing here, fully aware of the truth, bearing exactly the burden you say no one can bear. If even one person — you — can face the truth and choose to carry that weight, doesn't that undermine your claim about what people are capable of? Or are you going to tell me your not human?
