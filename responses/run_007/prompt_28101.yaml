answer: |-
  *(I stand slowly, the heavy chains of my office seeming to weigh upon my shoulders not as ornaments, but as actual iron. I look at you, then glance toward the silent Prisoner in the corner, whose eyes burn with a quiet, unbearable light. I offer a thin, weary smile, devoid of mockery, filled instead with a profound and ancient sorrow.)*

  You strike at the heart of the paradox, my son. You think you have found a crack in the armor, but you have merely pointed to the wound that keeps me alive.

  You ask if I am human. Yes. I am flesh and blood, subject to the same hunger, the same fear, the same gnawing doubt as the beggar in the square. And you are right: I *do* bear the burden. I *do* stand in the freedom that I deny the multitude. But you misunderstand the nature of my sacrifice. You assume I keep this freedom for my own glory. Do you think I *enjoy* this knowledge? Do you think I sleep soundly knowing I have corrected the work of the Silent One there?

  *(I gesture vaguely toward Christ, without turning my head.)*

  There are, indeed, a few. A tragic, lonely few. Throughout the centuries, there have always been those strong enough to eat the bread of freedom, to look into the abyss of conscience without trembling. I am one of them. You are perhaps another. But tell me—what of the weak? What of the children?

  Christ came for the perfect, for the heroes of the spirit. But I... I serve the weak. I serve the millions who cannot distinguish between the voice of God and the voice of their own trembling nerves. If I were to open the gates, to hand them the terrible gift of free conscience, they would not rejoice. They would tear each other apart in their confusion. They would burn one another in the name of truths they could not comprehend.

  So, you see, my strength is not a proof that *all* can bear it. It is the justification for why *I* must bear it *for* them.

  We, the few, the "aristocracy of the spirit," we take the curse of knowledge upon ourselves. We damn ourselves, if you will, so that they may be happy. We lie to them. We tell them we act in the name of the Silent One, when in truth we have sided with the spirit of wisdom and death, just to keep them fed. Is that not love? To look upon the weak and say, "You shall not suffer the terror of choice. I will suffer it for you."

  *(I step closer, my voice dropping to a hush, intense and pleading.)*

  You say my existence undermines my claim. I say it confirms it. The existence of the strong proves that freedom is a burden, heavy enough to crush the soul. Why should I force that weight onto the shoulders of a mother who only wants her child to have bread? Why should I force it onto the laborer who seeks only rest?

  If I am human, then I know pain. And because I know pain, I spare them. You call it tyranny. I call it compassion. 

  So, I concede the point: Yes, some can stand. But tell me, honestly... is it right to demand that *all* stand, when most would fall? Is your truth worth the tears of a single child who cannot understand it?
