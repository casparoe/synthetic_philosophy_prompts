      *   *Refusals:* The "Why" (evolutionary vs rational) and the "So What" (policy).
      *   *Question:* Focus on the *counterfactual dependence* of current value.

      *(Self-Correction on Parfit)*: Parfit's Non-Identity Problem is about how actions affect *who* comes into existence. Scheffler's point is that we care about the *existence* of successors regardless of identity. I need to make sure the plan distinguishes "That people exist" vs "Which people exist." The Infertility case is crucial here. I should advise the user to use the Infertility case as a *contrast* to the Doomsday case to kill the Parfit objection.

      *(Self-Correction on Psych vs Norm)*: Scheffler argues our *reasons* depend on this. It's a claim about the architecture of justification. I need to tell the user to frame it as "Conditions of Intelligibility."

      *(Self-Correction on Example)*: The prompt asks for *one* example. Scheffler usually pairs Doomsday and Infertility. I should advise the user to treat "Delayed Doomsday" as the primary engine, but *mention* Infertility solely to distinguish from Parfit. Or, I can advise using the "Scientific Research" scenario within the Doomsday framework. Let's stick to the "Delayed Doomsday" as the master example, as it's the most visceral.

      *Wait, one example that carries the whole thing.*
      If I only use Doomsday, Parfit might still linger.
