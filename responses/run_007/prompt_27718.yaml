      *   **Audience:** Non-specialists (scientists/engineers), self-taught in philosophy, no formal training.
      *   **Goal:** Explain the core claim (extinction's badness > sum of individual deaths; future humanity is a background condition for value) before opening discussion.
      *   **Constraints:**
