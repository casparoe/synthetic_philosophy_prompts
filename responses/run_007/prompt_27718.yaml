      Actually, Scheffler's *central* intuition pump is the Doomsday case. The Infertility case supports it. I will recommend the **Delayed Doomsday** case as the carrier, but instruct the user to deploy a specific *variation* of it (the "Scientific Legacy" angle) to handle the Parfit objection without needing a second full scenario.
      *Actually, better:* The prompt asks for "the one example... and what it needs to have and to lack." I will select the **Delayed Doomsday Scenario** but specify that it must be framed around a **long-term project** (like a 100-year study) to make the value dependence clear.

      *Let's refine the Misconception timing.*
      1. Altruism: Head off immediately after the initial reaction to the example.
      2. Psych/Norm: Head off when moving from "we feel this" to "this structures value."
