answer: |-
  ### Session Architecture (45 Minutes)

  **Dependency Logic:**
  You cannot establish the *normative* weight of the conjecture until you have isolated the *psychological* intuition. You cannot isolate the intuition until you have neutralized the "altruism" objection. You cannot neutralize altruism until the thought experiment is fully constrained. Therefore, the sequence must be: **Constraints → Intuition → Distinction → Claim.**

  1.  **Minutes 0–5: The Standard View (The Foil)**
      *   Briefly state the common-sense view: Extinction is bad because it kills people (deprivation of life) and causes suffering.
      *   *Dependency:* This establishes the baseline you are about to disrupt. Do not linger.

  2.  **Minutes 5–20: The Master Example (The Engine)**
      *   Introduce the thought experiment (see specifications below).
      *   Elicit reactions.
      *   *Critical Move:* Press the group on *why* their current projects feel diminished in this scenario.
      *   *Dependency:* This must happen before you introduce the theoretical terminology.

  3.  **Minutes 20–30: The Distinction (Altruism vs. Background Condition)**
      *   Translate their reactions into Scheffler's distinction.
      *   *Dependency:* Relies on the specific reactions elicited in the previous block.

  4.  **Minutes 30–40: Pre-empting Misconceptions (The Defense)**
      *   Address the three anticipated objections in a specific order (see below).
      *   *Dependency:* Must happen after the claim is stated but before open discussion, or the discussion will derail immediately.

  5.  **Minutes 40–45: Boundaries & Diagnostic (The Handoff)**
      *   State what is out of scope.
      *   Pose the diagnostic question.

  ---

  ### The Master Example: "The Delayed Doomsday"

  Do not use multiple examples. Use Scheffler's **Delayed Doomsday** case, but frame it specifically for your audience of scientists and engineers.

  **What it needs to have:**
  *   **Personal Immunity:** You must live out a full, natural lifespan. You do not die early.
  *   **Known-Other Immunity:** Your children, friends, and colleagues also live out full, natural lifespans. No one you know dies before their time.
  *   **The Kicker:** An asteroid destroys all human life 30 days after the death of the last person currently alive.
  *   **The Project:** Frame the intuition pump around a **long-term epistemic or creative project** (e.g., a 100-year climate study, a mathematical proof intended to guide future engineering, raising a child to join the human community).

  **What it needs to lack:**
  *   **Causal Interference:** The asteroid must not physically impede the work *during* your lifetime. You can finish the paper; you can raise the child. The asteroid does not crash early.
  *   **Identity Specificity:** Do not mention *who* dies in the future. The point is the absence of *any* successors, not specific ones.

  **Instruction:** When presenting this, ask: *"Knowing this now, does the value of your current work change? If so, does it change because you are sad for them, or because the work itself loses its point?"*

  ---

  ### Misconception Interception Plan

  Do not wait for the group to raise these. Introduce and dismiss them yourself during the transition from the example to the theory.

  **1. "Isn't this just caring about future generations?" (Altruism)**
  *   **Where:** Minutes 20–25, immediately after analyzing the reaction to the Master Example.
  *   **How:** Explicitly contrast *benefit* with *condition*.
  *   **Script:** "If this were just altruism, we would say, 'It's bad because *they* won't exist to enjoy things.' Scheffler is making a stronger claim: 'It's bad because *we* cannot value our things without them.' The afterlife isn't the *beneficiary* of our values; it is the *background condition* for our values."

  **2. "So this is a psychological claim, not a normative one?" (Is vs. Ought)**
  *   **Where:** Minutes 25–30, when formalizing the "Afterlife Conjecture."
  *   **How:** Frame it as a claim about the *structure of justification*.
  *   **Script:** "It is not merely that we *feel* worse (psychology). It is that our reasons for acting *depend* on this assumption (normativity). If the assumption is false, our reasons lose their force. It is a claim about the architecture of our rationality."

  **3. "Doesn't this collapse into Parfit's non-identity problem?" (Who vs. That)**
  *   **Where:** Minutes 35–40, during the Q&A prep.
  *   **How:** Distinguish *identity* from *existence*.
  *   **Script:** "Parfit asks whether our actions harm specific future individuals by changing *who* comes into existence. Scheffler is not talking about *which* people exist. He is talking about the condition that *people* exist. The Doomsday case eliminates everyone; the Non-Identity problem swaps one set of people for another. Scheffler's claim holds even if identity is irrelevant."

  ---

  ### Explicit Refusals (Boundaries)

  To keep the session within 45 minutes and prevent "solutionizing," explicitly state that you are **not** settling the following today. Write these on the board/screen:

  1.  **The Evolutionary 'Why':** We are not deciding today whether this intuition is an adaptive heuristic or a rational truth.
  2.  **The Conservative Bias:** We are not evaluating whether this dependence on the future makes us politically conservative or resistant to change.
  3.  **Policy Implications:** We are not deriving specific duties to the future (e.g., climate policy) from this today. We are only analyzing the structure of value.

  *Say:* "If the discussion drifts into *whether we should* act on this, or *why evolution made us* this way, I will pull us back to the structural claim."

  ---

  ### Diagnostic Question

  Pose this at Minute 44 to verify they grasp the *structure* of the claim, not just the emotional conclusion.

  **The Question:**
  > "In the Delayed Doomsday scenario, imagine you are writing a scientific paper. If Scheffler is right, does the paper become **false**, **futile**, or **immoral**? And crucially: does that status change *now*, while you are writing it, or only *later*, when the asteroid hits?"

  **The Correct Grasp:**
  *   **False:** No (truth is independent).
  *   **Immoral:** No (you aren't hurting anyone).
  *   **Futile:** **Yes.**
  *   **Timing:** **Now.** (The value evaporates immediately upon knowing the condition is violated, not when the destruction occurs).

  If they answer "It becomes sad later," they have missed the "Background Condition" aspect and reverted to the Standard View. If they answer "It becomes futile now," they have grasped the conjecture.
