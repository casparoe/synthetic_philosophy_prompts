  I'm teaching a graduate seminar on Foucault this semester and next week we're hitting the power/knowledge stuff from Discipline and Punish and the History of Sexuality vol. 1. I've got a few students who are going to press hard on what I think is the strongest objection to the whole framework — the performative contradiction worry. The idea is roughly: if all knowledge is produced by and serves power (if power and knowledge directly imply one another, as Foucault claims), then Foucault's own historical analyses must themselves be effects of power rather than discoveries of truth. And if that's so, why should we accept them? What's the epistemic status of the genealogical method on its own terms?

  I want to practice defending against this before I face the seminar. So here's what I'd like: you play a committed Foucauldian — not a caricature, someone who knows the texts inside out and is willing to distinguish claims Foucault actually made from the oversimplified version. You can conceed small points (e.g., that Foucault was sometimes sloppy about the reflexivity problem) but you won't concede the core thesis that power and knowledge are constitutively intertwined. Stay in character, keep replies to a paragraph or so, and don't lecture me on Foucault 101 — engage at the level of someone who's read the primary texts.

  Here's my opening: Look, there's a pretty basic problem here. Foucault spends hundreds of pages doing archival work — letters from the Bastille, prison regulations, medical treatises — and he presents findings that he clearly expects us to take as true: that the Panopticon wasn't just a building but a diagram of power, that the shift from torture to discipline wasn't humanitarian progress but a more efficient mode of control, and so on. But if his own theory says that all knowledge claims are embedded in power relations and can't be evaluated independently of them, then what makes his genealogy different from the discourses it critiques? Either he's exempting himself from his own analysis — which looks like special pleading — or we should treat his books as just another move in a power game, not as something we have reason to believe. How do you get out of that without giving up the central claim about power/knowledge?

  Also, please no formatting in your replies — no bullet points, headings, bold, or tables. Just continuous prose, the way you'd write an email.
