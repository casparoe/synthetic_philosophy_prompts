answer: |-
  # The Moral Luck Sorting Quiz

  Welcome to this month's edition of "Which Position Do You Actually Hold?" We're talking about **moral luck**: the uncomfortable idea that how much blame or praise you deserve might depend on things outside your control. 

  Read the eight scenarios below. For each, pick the answer that feels most true to you *in your gut*, not the one that sounds smartest. Keep track of your choices (A, B, or C) for each question.

  **1. The Drunk Drivers**
  Alex and Blake both drive home drunk after a party. They are equally impaired and drive equally badly. Alex hits a child who runs into the street. Blake gets home safely.
  *   **A.** They are equally blameworthy. The harm was luck, but the choice was the same.
  *   **B.** Alex is more blameworthy. Causing harm makes the action morally worse.
  *   **C.** They are equally blameworthy, but Alex owes a special debt and should feel a unique kind of guilt.

  **2. The Attempted Murder**
  Jordan and Jamie both shoot at an enemy with intent to kill. Jordan misses because a sudden gust of wind moves the bullet. Jamie hits because the wind aids the bullet.
  *   **A.** They are both murderers in their hearts. The wind doesn't change their moral record.
  *   **B.** Jamie is a murderer; Jordan is an attempter. The body count matters.
  *   **C.** They are equally guilty, but Jamie has to live with a death on their conscience.

  **3. The Surgeon's Slip**
  Dr. Lee and Dr. Patel make the exact same sloppy mistake during surgery. Lee's patient dies due to a rare complication. Patel's patient survives fully.
  *   **A.** They committed equal professional misconduct.
  *   **B.** Lee should face heavier sanctions (or lose their license) because a patient died.
  *   **C.** They deserve equal sanction, but Lee carries a tragic burden Patel doesn't.

  **4. The Nazi and the Swiss**
  Hans lives in 1930s Germany and risks his life to hide refugees. Hans's twin lives in neutral Switzerland and lives a quiet, lawful life. Neither ever harms anyone.
  *   **A.** They are equally good people if their intentions were pure.
  *   **B.** The German Hans is better because his actions actually helped people.
  *   **C.** The German Hans deserves more credit because his circumstances tested his character.

  **5. The Short Temper**
  Sam was born calm and never yells. Chris was born with a volatile temper but works hard every day to stay calm. Both behave identically.
  *   **A.** They are equally virtuous. Behavior is what counts.
  *   **B.** Chris is more virtuous. Overcoming your nature is what counts.
  *   **C.** Neither deserves credit. If temperament is genetic, "virtue" is just luck.

  **6. The Upbringing**
  You realize your honest choices come from a stable upbringing you didn't choose. A criminal had a traumatic upbringing they didn't choose.
  *   **A.** You still own your choices. Background explains but doesn't excuse.
  *   **B.** You deserve some credit, but you should feel humility about your advantages.
  *   **C.** It makes you wonder if anyone truly "deserves" praise or blame at all.

  **7. The Punishment**
  Back to the drunk drivers (Alex who hit the kid, Blake who didn't). How should the law treat them?
  *   **A.** Identical punishment. The crime was driving drunk, not hitting the kid.
  *   **B.** Alex gets heavier punishment. The law must reflect the harm done.
  *   **C.** Identical legal punishment, but Alex should face a different kind of moral reckoning.

  **8. The Clean Hands**
  If luck plays a huge role in who we become, what happens to the idea of innocence?
  *   **A.** Innocence is real. People who choose well are innocent.
  *   **B.** Innocence is fragile. Most people are just lucky not to be tested.
  *   **C.** Innocence is an illusion. We are all products of causes we didn't choose.

  ***

  ## Scoring Key

  To find your position, tally which **View** you selected most often using the table below. For example, if you chose **A** on Question 1, add one point to **View (a)**.

  | Question | Choice A | Choice B | Choice C |
  | :--- | :--- | :--- | :--- |
  | **Q1** | View (a) | View (b) | View (c) |
  | **Q2** | View (a) | View (b) | View (c) |
  | **Q3** | View (a) | View (b) | View (c) |
  | **Q4** | View (a) | View (b) | View (d) |
  | **Q5** | View (a) | View (d) | View (e) |
  | **Q6** | View (a) | View (d) | View (e) |
  | **Q7** | View (a) | View (b) | View (c) |
  | **Q8** | View (a) | View (d) | View (e) |

  **Calculate your totals for (a), (b), (c), (d), and (e). Read your dominant view below.**

  ### (a) The Control Principle (Kantian)
  **You believe luck never changes how much blame or praise someone deserves.**
  For you, morality is about the will, not the world. If two people intend the same thing and control the same actions, they are morally identical. Outcomes, circumstances, and genetics are irrelevant noise. You likely find our legal system's focus on "harm done" frustratingly irrational.

  ### (b) Outcome Responsibility (Resultant Luck)
  **You believe outcomes really do change blame even with identical intentions.**
  You trust the intuition that causing harm makes you worse than causing no harm, even by accident. You might agree that intentions matter, but you believe morality is partly about how your actions land in the real world. You are comfortable with the idea that luck changes your moral status.

  ### (c) Agent Regret (The Middle Ground)
  **You believe outcomes shouldn't change blame, but the unlucky person should feel a special kind of regret.**
  You want to hold onto the Control Principle, but you acknowledge that hitting a kid changes something. You distinguish between *blame* (which stays the same) and *responsibility/regret* (which changes). The unlucky agent isn't more evil, but they owe something the lucky one doesn't.

  ### (d) Contextualism (Circumstantial & Constitutive Luck)
  **You believe circumstances and temperament you didn't choose change how much blame or praise applies.**
  You focus on the setup, not just the outcome. You think the Nazi resistor is better than the quiet Swiss citizen because their context mattered. You think the person who overcomes a bad temper deserves more credit than the naturally calm person. Character and situation are part of the moral math.

  ### (e) Skepticism (Hard Incompatibilism)
  **You believe that once you see how much is luck, blame and praise themselves start to look shaky.**
  You followed the thread all the way down. If temperament, upbringing, and outcomes are all luck, you wonder if "desert" exists at all. You aren't necessarily saying we should stop punishing people (we need safety), but you think no one truly *deserves* their fate in a deep moral sense.

  ### Unmapped or Incoherent Combinations
  *   **High (a) + High (b):** **Incoherent.** These are direct contradictions. (a) says outcomes don't matter; (b) says they do. If you scored high on both, you may be answering based on "legal punishment" in some questions and "moral blame" in others without distinguishing them.
  *   **High (a) + High (e):** **Incoherent.** (a) asserts strong moral responsibility based on control; (e) suggests responsibility is an illusion. You cannot fully hold both.
  *   **No Clear Majority (e.g., 2 points each across several views):** **Empty/Mixed.** This usually means you are a contextual thinker who treats different types of luck differently (e.g., you accept outcome luck but reject constitutive luck). This isn't incoherent, but it doesn't map to a single philosophical label.

  ### Note on Overlaps
  *   **(a) and (c) are hard to pull apart.** View (c) is essentially View (a) with an added emotional clause. If you scored high on both, you are fundamentally a Control theorist who acknowledges "agent regret."
  *   **(b) and (d) can blur.** Both accept that external factors change moral status. (b) focuses on *results* of actions (did the patient die?), while (d) focuses on *conditions* of the agent (were they tested? were they born calm?). If you scored high on both, you generally reject the Control Principle.

  Summary: This scoring key sorts people by whether they think moral responsibility depends on control, outcomes, special regret, personal context, or whether it exists at all.
