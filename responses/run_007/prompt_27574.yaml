  4.  **Address Question 2: Partition and Value Theory Entry:**
      *   *Partition:* Strictly speaking, the math requires a partition (or at least a weighting scheme). You can't penalize *everything* (or the agent never moves) and you can't penalize *nothing* (or it's unconstrained).
      *   *Where Value Enters:*
