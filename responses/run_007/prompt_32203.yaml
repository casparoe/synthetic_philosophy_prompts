      *   **Key Insight 4: Genealogy vs. Metaphysics.** Genealogy explains *why* a belief arose. Metaphysics (in Nietzsche's sense) explains *what* the belief claims about reality. Here, Nietzsche uses his naturalistic metaphysics to expose the *lie* in the genealogy.

