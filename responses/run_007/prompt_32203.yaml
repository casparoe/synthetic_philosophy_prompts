prompt: |-
  So I've been trying to get my head round this passage from Nietzsche's *On the Genealogy of Morality* (First Essay, §13, the Horace B. Samuel translation) and I keep going in circles. I'm hoping someone here can help me untangle a specific thing.

  Here's the passage:

  > It is not surprising that the lambs should bear a grudge against the great birds of prey, but that is no reason for blaming the great birds of prey for taking the little lambs. And when the lambs say among themselves, "Those birds of prey are evil, and he who is as far removed from being a bird of prey, who is rather its opposite, a lamb,—is he not good?" then there is nothing to cavil at in the setting up of this ideal, though it may also be that the birds of prey will regard it a little sneeringly, and perchance say to themselves, "We bear no grudge against them, these good lambs, we even like them: nothing is tastier than a tender lamb." To require of strength that it should not express itself as strength, that it should not be a wish to overpower, a wish to overthrow, a wish to become master, a thirst for enemies and antagonisms and triumphs, is just as absurd as to require of weakness that it should express itself as strength. A quantum of force is just such a quantum of movement, will, action—rather it is nothing else than just those very phenomena of moving, willing, acting, and can only appear otherwise in the misleading errors of language (and the fundamental fallacies of reason which have become petrified therein), which understands, and understands wrongly, all working as conditioned by a worker, by a "subject." And just exactly as the people separate the lightning from its flash, and interpret the latter as a thing done, as the working of a subject which is called lightning, so also does the popular morality separate strength from the expression of strength, as though behind the strong man there existed some indifferent neutral substratum, which enjoyed a caprice and option as to whether or not it should express strength. But there is no such substratum, there is no "being" behind doing, working, becoming; "the doer" is a mere appanage to the action. The action is everything. In point of fact, the people duplicate the doing, when they make the lightning lighten, that is a "doing-doing"; they make the same phenomenon first a cause, and then, secondly, the effect of that cause. The scientists fail to improve matters when they say, "Force moves, force causes," and so on. Our whole science is still, in spite of all its coldness, of all its freedom from passion, a dupe of the tricks of language, and has never succeeded in getting rid of that superstitious changeling "the subject" (the atom, to give another instance, is such a changeling, just as the Kantian "Thing-in-itself"). What wonder, if the suppressed and stealthily simmering passions of revenge and hatred exploit for their own advantage their belief, and indeed hold no belief with a more steadfast enthusiasm than this—"that the strong has the option of being weak, and the bird of prey of being a lamb." Thereby do they win for themselves the right of attributing to the birds of prey the responsibility for being birds of prey: when the oppressed, down-trodden, and overpowered say to themselves with the vindictive guile of weakness. "Let us be otherwise than evil, namely, good! and good is every one who does not oppress, who hurts no one, who does not attack, who does not pay back, who hands over revenge to God, who holds himself, as we do, in hiding; who goes out of the way of evil, and demands, in short, little from life; like ourselves the patient, the meek, the just,"—yet all this, in its cold and unprejudiced interpretation, means nothing more than "once for all, the weak are weak; it is good to do nothing for which we are not strong enough"; but this dismal state of affairs, this prudence of the lowest order, which even insects possess (which in a great danger are fain to sham death so as to avoid doing "too much"), has, thanks to the counterfeiting and self-deception of weakness, come to masquerade in the pomp of an ascetic, mute, and expectant virtue, just as though the very weakness of the weak—that is, forsooth, its being, its working, its whole unique inevitable inseparable reality—were a voluntary result, something wished, chosen, a deed, an act of merit. This kind of man finds the belief in a neutral, free-choosing "subject" necessary from an instinct of self-preservation, of self-assertion, in which every lie is fain to sanctify itself. The subject (or, to use popular language, the soul) has perhaps proved itself the best dogma in the world simply because it rendered possible to the horde of mortal, weak, and oppressed individuals of every kind, that most sublime specimen of self-deception, the interpretation of weakness as freedom, of being this, or being that, as merit.

  Here's the thing that's tripping me up. Nietzsche seems to be running two arguments at once. On the one hand there's a metaphysical claim: there's no "doer" behind the "deed," no neutral substratum that has the *option* of expressing strength or not — the action is everything, and the subject is a grammatical fiction we project onto the world. On the other hand there's a genealogical claim about how the weak exploit this fiction: they *need* the idea of a neutral, freely-choosing subject so they can reinterpret their own weakness as something they chose — as merit — rather than just what they are.

  What I can't work out is whether the geneaological point depends on the metaphysical one. If the "doer" really is just a grammatical illusion, then the weak are simply *wrong* about themselves — they're not free choosers, they're just as determined as the birds of prey. But then Nietzsche's whole critique of the weak seems to boil down to "they're wrong about the metaphysics," which is a bit boring, and also weirdly asymmetrical: the strong would be wrong too if they believed in a free subject, but Nietzsche doesn't seem to care about that.

  Alternatively, maybe the metaphysical claim *isn't* supposed to be a positive assertion about what exists — maybe it's itself part of the genealogical story, a kind of diagnostic tool. But then the passage reads very strangely, because he sure *sounds* like he's making a straight metaphysical claim about forces and actions.

  I've seen people in the rationalist-sphere try to dissolve this by reading Nietzsche as a kind of proto-eliminativist about the self (Metzinger-ish, no Cartesian theatre, etc.), but that feels like it's missing the specifically moral-psychological move he's making about *ressentiment* and how it needs the fiction.

  Am I overcomplicating this? Is there a way of reading the passage where the two threads — the critique of grammar and the critique of ressentiment — are doing genuinely different work, and niether reduces to the other? Or is the point precisely that the metaphysics *is* the weapon, and the genealogy is just the story of how it got deployed?
