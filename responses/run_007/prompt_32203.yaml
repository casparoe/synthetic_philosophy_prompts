answer: |-
  This is one of the most famous and difficult cruxes in Nietzsche scholarship, so first: you are not overcomplicating it. You have put your finger on exactly the tension that divides interpreters of the *Genealogy*.

  The short answer is: **The metaphysical claim and the genealogical claim are doing distinct but mutually dependent work.** The metaphysics clears the ground (showing that the "subject" is a fiction), while the genealogy explains *why* that fiction was constructed and preserved (it serves the interests of the weak).

  However, to untangle the circle you're stuck in, we need to refine how we understand Nietzsche's "metaphysics" here, and specifically why the asymmetry between the strong and the weak matters.

  Here is a way to break down the relationship between the two threads.

  ### 1. The Metaphysical Claim: It's Not Determinism, It's Monism
  You worried that if Nietzsche is right about the "no subject" claim, then the strong are just as determined as the weak, so why isn't he critiquing them for believing in a subject too?

  The key is that Nietzsche isn't arguing for hard determinism (mechanism); he is arguing for a **dynamic monism of forces**.
  *   **The Error:** Language forces us to say "The lightning flashes," implying there is a *thing* (lightning) that performs an *action* (flashing).
  *   **The Reality:** There is only the flash. There is no "doer" behind the "deed." There is only the quantum of force expressing itself.

  When Nietzsche says the strong "express strength," he doesn't mean they are determined machines. He means their identity is *immanent* to their action. A bird of prey *is* its predation. It does not step back and say, "I, the subject, choose to eat this lamb." It simply eats.

  The weak, however, *need* to separate the doer from the deed. Why? Because if the doer and deed are one, then **weakness is just a fact.** If I cannot retaliate, I am simply incapable. But if I am a "subject" distinct from my "actions," then my *not* retaliating can be framed as a **choice**.

  So, the metaphysical claim is: *The separation of subject and object is a falsification of reality.*
  The genealogical claim is: *This falsification is useful for a specific type of life (the weak).*

  ### 2. Why the Asymmetry? (Why doesn't he blame the Strong?)
  You noted: *"The strong would be wrong too if they believed in a free subject, but Nietzsche doesn't seem to care about that."*

  This is the crucial point. Nietzsche's critique is not primarily about **logical consistency**; it is about **life-enhancement vs. life-denial**.

  *   **For the Strong:** Believing in a "subject" is a harmless error. Even if a bird of prey thinks, "I choose to eat this lamb," it still eats the lamb. The fiction doesn't stop the expression of force. It might make them susceptible to guilt later (which is Nietzsche's worry in the Second Essay), but in the context of the First Essay, their action remains affirmative.
  *   **For the Weak:** Believing in a "subject" is a **survival strategy**. It is the *only* way they can endure their own existence. If they accepted the metaphysical truth (that they are just weak forces), they would be crushed by nihilism. By inventing the "free subject," they turn their *inability* to act into a *refusal* to act.
      *   Inability ("I can't hurt him") $\rightarrow$ Choice ("I choose not to hurt him") $\rightarrow$ Virtue ("I am good").

  Nietzsche critiques the weak not because they are "metaphysically wrong" (everyone is, including scientists), but because their specific *use* of this error is **reactive**. It is born of *ressentiment*. It is a lie told to gain power over the strong by making the strong feel guilty.

  The strong don't need the lie to function. The weak *need* the lie to function. Therefore, the genealogy focuses on the weak.

  ### 3. Do the Two Threads Do Different Work?
  Yes. You asked if they are doing genuinely different work. Here is the division of labor:

  **A. The Metaphysical/Grammatical Critique (The "What")**
  This dismantles the *validity* of Slave Morality.
  If the "subject" is real, then Slave Morality is valid. If humans truly have a neutral core that can choose between strength and weakness, then the lamb *is* morally praiseworthy for choosing peace.
  Nietzsche must destroy the "subject" to show that Slave Morality is based on a psychological impossibility. There is no "neutral core." There is only the drive. Therefore, "goodness" (as defined by the slaves) is not a triumph of will; it is merely the sublimation of impotence.

  **B. The Genealogical/Psychological Critique (The "Why")**
  This explains the *persistence* of the error.
  If the "subject" is obviously a fiction (as Nietzsche thinks it is), why does everyone believe it? Why has it become the foundation of Western morality?
  Genealogy answers: Because it serves an instinct of self-preservation for the oppressed. It allows them to reinterpret their physiological weakness as spiritual strength.

  **The Synthesis:**
  The metaphysical claim provides the **leverage**; the genealogical claim provides the **motive**.
  *   Without the metaphysics, the genealogy is just sociology (i.e., "The weak made up a story").
  *   Without the genealogy, the metaphysics is just abstract philosophy (i.e., "There is no self").
  *   Together, they show that **Morality is a symptom of a specific psychological configuration trying to preserve itself through metaphysical lies.**

  ### 4. Is Nietzsche an Eliminativist?
  You mentioned the rationalist/Metzinger reading. It's tempting, but be careful. Nietzsche isn't saying "The self doesn't exist, therefore we should stop talking about it."

  He is saying: **"The 'self' is a fiction, but it is a fiction that has consequences."**

  He is diagnosing a *symptom*. The belief in the subject is a symptom of *decadence* (or in the case of the weak, a strategy of the decadent). The "Higher Man" or the *Übermensch* isn't necessarily someone who solves the mind-body problem correctly; it's someone who can *affirm* their drives without needing to posit a "ghost in the machine" to justify them.

  The strong don't need to believe they are "free subjects" to act. The weak *do* need to believe they are "free subjects" to feel good about not acting.

  ### Summary: How to Read the Passage
  To stop going in circles, try reading the passage with this distinction in mind:

  1.  **When Nietzsche attacks the "Subject/Doer":** He is attacking the **condition of possibility** for moral blame. He is saying: "You cannot blame the bird of prey for being a bird of prey, because there is no 'bird of prey' separate from 'preying'."
  2.  **When Nietzsche attacks the "Weak/Lambs":** He is attacking the **motive** for inventing the Subject. He is saying: "You invented the 'Subject' specifically so you *could* blame the bird of prey, and so you could pretend your weakness was a choice."

  The genealogical point *depends* on the metaphysical one in this sense: If the metaphysical claim were false (if there *were* a neutral substratum), the weak would be right, and Nietzsche's critique would fail.
  But the metaphysical point is *deployed* via the genealogy. Nietzsche doesn't prove "no subject" via logic puzzles; he proves it by showing that the *only* reason people believe in it is to serve a psychological need for revenge.

  **The Verdict:**
  You are right that the metaphysics is the weapon. But the genealogy is the story of **who picked up the weapon and why.** Nietzsche cares more about the wielder than the weapon, because the weapon (the concept of the subject) is inevitable for language-users. The crime isn't using the concept; the crime is using it to poison the well of life (by calling strength "evil").

  So, the strong are "wrong" about the subject, but they are "innocent" because their error doesn't stem from *ressentiment*. The weak are "wrong" about the subject, and "guilty" (in Nietzsche's naturalistic sense) because their error is a calculated act of spiritual revenge.
