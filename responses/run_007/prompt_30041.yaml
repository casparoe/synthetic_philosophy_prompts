  Your decisions in cases (A) through (E) are consistent with the principle that you should switch if and only if the conditional probability that you hold the smaller amount exceeds one-third, though this principle corrects your confidence in case (E), mandates switching in your first new case, mandates staying in your second, and renders the infinite expectation case undefined under standard expected-value theory.

  The settled arithmetic behind this principle derives from the expected value condition for switching: if $X$ is the amount in your envelope, the expected value of the other is $2X \cdot p + (X/2) \cdot (1-p)$, where $p$ is the probability your envelope is the smaller one. Switching is rational if this expectation exceeds $X$, which simplifies algebraically to $p > 1/3$. This threshold is a fact of probability theory given the norm of expected-value maximization. In case (A), the symmetry argument holds because without observing $X$, you cannot condition on it, and no proper prior distribution allows $p > 1/3$ for all possible values simultaneously; thus, the ex-ante expectation of switching equals the ex-ante expectation of staying. In cases (B) through (E), your actions align with the $p > 1/3$ rule, but in (E), your lower confidence is irrational: with a uniform prior on the smaller amount from $1$ to $100$, observing $80$ implies equal probability of being the smaller ($S=80$) or larger ($S=40$) envelope, making $p=0.5$, identical to case (B).

  Applying this to your new cases yields definite results based on settled probability calculations. In the first case, where the smaller amount is uniform from $1$ to $100$ and you find $100$, the possible pairs are ($50, 100$) and ($100, 200$); since both smaller amounts ($50$ and $100$) are equally likely under the prior and equally likely to produce the observation, $p=0.5$, so you should switch. In the second case, where the smaller amount $n$ has probability proportional to $3^{-n}$ and you find $2$, the probability that you hold the smaller amount ($n=2$) is $1/4$ while the probability you hold the larger ($n=1$) is $3/4$; since $1/4 < 1/3$, you should not switch, confirming your suspicion that the 25 percent chance of doubling does not compensate for the risk.

  Regarding infinite expectations, it is settled mathematics that expected-value reasoning goes silent: if the expected amount in your envelope is infinite, the expected amount in the other is also infinite, and standard arithmetic cannot compare them. However, it is genuinely contested among decision theorists whether expected-value maximization is the correct norm in such scenarios or whether alternative principles, such as stochastic dominance or bounded utility functions, should override the undefined expectations to prescribe a decision.
