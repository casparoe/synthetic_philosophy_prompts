answer: |-
  Your friend's summary is actually surprisingly accurate regarding the *mechanics* of L.A. Paul's argument, but it glosses over some crucial philosophical nuance. Your skepticism is also well-placed, but your objection ("this is just saying we can't predict the future") misses the specific technical problem Paul is raising for decision theory.

  Here is a breakdown of what is accurate, what is contested, and why your "so what?" reaction, while common, engages with a different problem than the one Paul identifies.

  ### 1. What Your Friend Got Right (The Core Argument)
  Your friend accurately captured the skeleton of Paul's argument from her 2014 book *Transformative Experience* and her paper "What You Can't Expect When You're Expecting."

  *   **The Definition:** Paul defines a **Transformative Experience** as having two components:
      1.  **Epistemically Transformative:** You cannot know what the experience is like (phenomenologically) without having it. (e.g., You can't know what red looks like if you've been blind from birth; you can't know what parenting feels like if you aren't a parent).
      2.  **Personally Transformative:** The experience changes your core preferences, values, or identity. (e.g., After having a kid, you might value self-sleep less and self-sacrifice more).
  *   **The Attack on Rational Choice:** Standard decision theory (Expected Utility Theory) says a rational choice requires assigning a "value" (utility) to each possible outcome and multiplying it by the probability of that outcome. Paul argues that for transformative choices, **you cannot assign the value.** You don't know what the outcome is worth to you because you can't access the experience, and the "you" that experiences it will value things differently than the "you" making the decision.
  *   **The Conclusion:** Therefore, you cannot make this decision using standard instrumental rationality. You are not maximizing utility; you are making a choice that reason cannot fully justify. Your friend is right that Paul characterizes this as a kind of "leap" or non-rational commitment.

  ### 2. Where the Friend Might Be Distorting Things
  There are two areas where the "bar talk" version of Paul's argument often drifts into caricature.

  *   **"Irrational" vs. "Non-Rational":** Paul does not argue that it is *irrational* to have children (in the sense of being crazy or foolish). She argues it is not a decision that can be made via *rational calculation*. She leaves room for deciding based on other norms, such as "revelation" (choosing to discover who you become) or social commitment. Your friend's phrasing ("never rationally decide") is technically correct in the decision-theory sense, but often interpreted colloquially as "you're being stupid if you try."
  *   **Scope of "Big Stuff":** Your friend implies *all* big life changes (marriage, careers) are transformative in this specific way. Paul is more selective. Changing careers might be epistemically transformative (you don't know what the job is like), but it isn't always *personally* transformative (it might not change your core values). Parenting is her "killer example" because it almost guaranteed does both.

  ### 3. Addressing Your Objection: "Isn't this just uncertainty?"
  This is the most important philosophical distinction. Your reaction is the most common objection to Paul, but philosophers generally agree it misses the specific technical hurdle she is proposing.

  **The Consensus View:** Paul is **not** arguing that we lack *predictive power* (uncertainty). She is arguing we lack *evaluative access*.

  *   **Standard Uncertainty:** When you buy a stock, you don't know if it will go up or down. But you *do* know how much you value money. You can assign a value to the outcome ($1000 is better than $0). Decision theory handles this fine using probabilities.
  *   **Paul's Problem:** When you choose to have a kid, the problem isn't that you don't know the *probability* of the outcome. The problem is you cannot assign a *value* to the outcome.
      *   *Example:* If you hate sleep deprivation, you assign a negative value to it. But if becoming a parent changes you so that you no longer mind sleep deprivation (or value it as a sign of love), your current self's valuation is irrelevant.
      *   *The "So What":* If your current values can't judge the future outcome, and the future values don't exist yet, the equation for rational choice breaks. It's not that the future is foggy; it's that the *ruler* you use to measure the future changes length depending on which future you end up in.

  So, your friend is right that it sounds like "you can't predict the future," but Paul's point is stronger: "You can't even use your current preferences to judge the future, because the future self won't share them."

  ### 4. Settled vs. Contested in the Literature
  If you were to walk into a seminar on this topic, here is how the landscape looks:

  #### **Settled (Broad Agreement)**
  *   **The Category is Useful:** Almost everyone agrees Paul has identified a real and important class of experiences ("Transformative Experiences") that standard decision theory struggles to model.
  *   **Phenomenological Ignorance:** There is agreement that there is a specific kind of knowledge ("what it is like") that cannot be gained via testimony or imagination, only experience.
  *   **Preference Change:** It is accepted that major life events often radically alter preferences, which complicates inter-temporal choice (choosing for your future self).

  #### **Contested (Genuine Debate)**
  *   **Does this Paralyze Decision Making?**
      *   *Paul's View:* It shows the limits of rational choice theory. We must accept that some choices are not made via utility maximization.
      *   *Critics (e.g., David Sobel, Elizabeth Harman):* Many argue Paul sets the bar for "rationality" impossibly high. We make decisions under imperfect information all the time. We can use **proxies** (e.g., "I trust other parents," or "I value growth") to make a rational enough choice. They argue we can model the *possibility* of value change within the current decision matrix.
  *   **The Testimony Objection:**
      *   *Paul:* You can't learn "what it's like" from others.
      *   *Critics:* While you can't have the *phenomenal* experience, you can get enough *propositional* knowledge to make a rational estimate. If I tell you "you will sleep less and love more," you can value those propositions without being a parent.
  *   **The Identity Problem:**
      *   *Paul:* The change in preferences is significant enough that the pre-parent and post-parent are effectively different evaluative perspectives.
      *   *Critics:* Most people retain enough psychological continuity that their pre-parent values *should* count. If I value happiness now, and my future self values happiness differently, why does my current voice not matter? Some argue Paul overstates the "split" between selves.

  ### Summary
  Your friend's summary is **philosophically literate**, not a caricature. He correctly identified that Paul attacks the possibility of *utility maximization* for transformative choices.

  However, your "so what?" reaction highlights the main point of contention in the field.
  *   **If you agree with Paul:** This is a profound discovery that reveals the limits of reason in human life.
  *   **If you agree with her critics:** This is an interesting edge case that doesn't actually stop us from making rational decisions, because we can approximate values or use different models of rationality.

  The "big deal" isn't that we can't predict the future; it's that Paul claims **rationality itself requires a stable set of values to function**, and transformative experiences remove that stability. Whether that actually prevents rational choice is the debate.
