      *   **Core Argument:** The "Fiction Defense" (Video games $\approx$ Novels; since novel violence is morally neutral, so is game violence).
      *   **Task:** Walk through the mapping (Reader/Author/Text/Character) between novels and video games.
      *   **Critical Analysis:** Identify where the mapping breaks (disanalogies).
      *   **Evaluation:** Distinguish between surface differences and morally relevant differences.
      *   **Conclusion:** Assess whether the "morally weightless" conclusion survives the scrutiny of these disanalogies.

  2.  **Initial Mapping (The Analogy):**
      *   *Novel:* Author writes, Reader consumes, Text is static, Character has fixed fate.
      *   *Game:* Developer makes, Player plays, Code/Engine is the medium, Character has scripted/programmed responses.
      *   *Superficial Match:* Both are fictional entities suffering fictional harm. No real blood, no real pain.

  3.  **Identifying the Disanalogies (Where it breaks):**
      *   *Agency:* Reader is passive observer; Player is active participant.
      *   *Authorship:* Author decides *everything*; Player decides *some things* (within constraints).
      *   *Experience:* Reading is imaginative reconstruction; Playing is interactive simulation (often visceral/kinetic).
      *   *Intent/Motivation:* Author writes for narrative arc; Player often plays for fun/gratification (sometimes specifically *to* cause harm).
      *   *Repeatability:* A character dies once in a book; a character can be killed 1000 times in a game (by the same player).

  4.  **Filtering for Moral Relevance (Surface vs. Deep):**
      *   *Surface:* Pixels vs. Words, Controller vs. Page. (Irrelevant).
      *   *Deep:*
          *   **Complicity:** In a book, the author is the killer. In a game, the *player* pulls the trigger. This shifts moral burden.
          *   **Gratification:** Is the harm instrumental (story) or recreational (fun)? If I enjoy *causing* the suffering, does that matter morally (virtue ethics)?
          *   **Desensitization/Training:** Does doing it repeatedly change the agent? (Empathy erosion).
          *   **The "Magic Circle":** Does the game context suspend normal moral rules more effectively than a narrative context?

  5.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Acknowledge the strength of the intuition (it *is* fiction) but validate the user's suspicion (the analogy is too quick).
      *   **Phase 1: The Mapping (The Isomorphism):** Lay out the standard comparison clearly.
          *   Author $\rightarrow$ Developer/Designer.
          *   Reader $\rightarrow$ Player.
          *   Text $\rightarrow$ Game Engine/Code.
          *   Character $\rightarrow$ Avatar/NPC.
          *   Event $\rightarrow$ Scripted/Causal Event.
      *   **Phase 2: The Breaking Points (Disanalogies):**
          *   *Agency/Authorship:* The "Co-Author" problem. The player isn't just witnessing; they are executing.
          *   *Motivation/Gratification:* Narrative necessity vs. Ludic pleasure.
          *   *Repeatability/Grind:* Torture as a mechanic vs. Torture as a plot point.
          *   *Simulation vs. Representation:* Doing vs. Imagining.
      *   **Phase 3: Moral Weight of Disanalogies:**
          *   *Virtue Ethics:* What does this do to *me*? (Habits, desires).
          *   *Complicity:* Am I endorsing the act by choosing it?
          *   *The "Gamer's Dilemma":* Reference Morgan Luck's distinction (Murder vs. Pedophilia in games). Why do we accept one and not the other if both are fiction?
      *   **Phase 4: Verdict on the Conclusion:**
          *   Does "Morally Weightless" survive? No, not entirely.
          *   Nuance: It doesn't mean games are *bad*, but it means they aren't *neutral* in the same way. The moral question shifts from "Harm to victim" (none) to "Harm to agent/society" (potential).
      *   **Conclusion:** Summarize. The analogy hides the player's agency.

  6.  **Refining the Argument (Self-Correction during drafting):**
