  7.  **Final Polish:** Check tone (analytical, philosophical, not preachy). Ensure the structure is logical (Mapping $\rightarrow$ Breaking $\rightarrow$ Evaluation $\rightarrow$ Conclusion). (This aligns with the user's request for a walkthrough).

