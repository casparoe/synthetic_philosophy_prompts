  Here is the principle that captures your intuitions, followed by the applications and the necessary concession you asked for.

  ### The Principle: Representational Standing

  **You have standing to blame another for violating a norm only if you currently represent that norm as binding on yourself, evidenced by a will aligned with the norm, and you possess a relevant relational jurisdiction to enforce it.**

  This principle has three specific components that resolve your conflicts:

  1.  **Fidelity of Will (The Aunt vs. Coworker Distinction):** Standing is not determined by a spotless history (*purity*), but by your current orientation toward the norm (*integrity*).
      *   **The Aunt:** Her will is aligned. She violated the norm, but through repentance and reform, she has realigned her commitment. She treats the norm as binding *now*.
      *   **The Coworker:** His will is *not* aligned. He adheres to the norm only because circumstances (lack of opportunity) force him to. If the constraint were removed, his will would violate the norm. He treats the norm as *conditional*, not binding.
      *   **Dave:** His will is actively opposed to the norm. He treats it as optional.

  2.  **Non-Accidental Compliance:** You cannot claim standing if your adherence is merely accidental or incapacity-based. You must be adhering because you *endorse* the norm. This is why the Coworker fails; his "clean hands" are an accident of circumstance, not a moral achievement.

  3.  **Relational Jurisdiction (The Café Stranger):** Even if you have Fidelity of Will, you lack standing if you lack the relationship or role that makes the matter your appropriate concern. Moral integrity grants you the right to speak *truth*, but relationship grants you the right to speak *to someone*.

  ***

  ### Application to the Father-in-Law Case

  Your ambivalence about your father-in-law (FIL) stems from conflating two different types of authority: **Moral Standing** and **Epistemic Authority**.

  *   **As Moral Blame:** If your FIL is implying, "It is morally wrong to smoke, and I am judging you," the principle says he has **no standing**. He fails the Fidelity test; he is currently treating the norm against smoking as optional for himself. In this frame, the "hypocrite" half of your gut is correct.
  *   **As Prudential Warning:** If your FIL is saying, "I know the cost of this addiction, and I want to spare you that pain," he is not claiming moral superiority. He is claiming *experience*. This is Epistemic Authority. He knows the terrain because he is lost in it.

  **Verdict:** The principle dictates that he has no standing to *condemn* smoking, but he has high authority to *warn* against it. Since your nephew is 14 and (presumably) hasn't started yet, this is a warning, not a blame. Therefore, the "exactly the person who should say it" half of your gut is the one to trust, provided you reframe his speech as advice rather than moral judgment.

  ***

  ### A New Case: The Recovered Alcoholic vs. The Cautious Teetotaler

  To test the principle further, consider this case:

  > **Case:** A recovering alcoholic (20 years sober) tells a young person, "Don't take that first drink; it nearly killed me."
  > **Contrast:** A man who has never drunk alcohol tells the same young person, "Don't take that first drink; it's dangerous." However, this man admits he doesn't drink only because he hates the taste, not because he thinks it's wrong, and he'd drink if it tasted good.

  **Principle's Verdict:**
  *   **Recovering Alcoholic:** Has standing. Despite a history of violation, his *current will* is aligned with the norm (sobriety), and his compliance is non-accidental (it requires daily effort/commitment). He represents the norm.
  *   **Cautious Teetotaler:** Lacks standing. His compliance is accidental (based on taste preference, not commitment to the norm). If the taste changed, his adherence would vanish. He does not represent the norm; he represents his own preferences.

  This mirrors your Aunt vs. Coworker intuition perfectly: **Reform beats accidental innocence.**

  ***

  ### The Verdict You Must Drop

  You asked me to be straight about which of your verdicts this principle forces you to drop.

  Strictly speaking, the principle forces you to drop the idea that **Dave (with the disclaimer)** is "worse" than **Dave (without the disclaimer)** regarding *standing*.

  Your gut says the disclaimer makes it worse ("using his own record as a shield"). While emotionally understandable, morally, the disclaimer actually *acknowledges the validity of the norm*.
  *   **Dave (No disclaimer):** Implicitly claims he is above the norm.
  *   **Dave (With disclaimer):** Admits the norm applies to him and he failed it.

  However, under the Principle of Representational Standing, **neither Dave has standing.** Both lack Fidelity of Will because both are *currently cheating*. The disclaimer does not constitute reform; it is merely an admission of guilt without cessation of the act.

  **The Concession:** You do not have to drop the verdict that "Dave has no standing." You *do* have to drop the intuition that the disclaimer changes his *standing*. It changes his *character* (honest hypocrite vs. arrogant hypocrite), but it does not grant him the authority to blame his brother-in-law. He is still violating the norm he is invoking. If you hold that the disclaimer makes him *more* illegitimate, you are weighing honesty heavily, but regarding *standing to blame*, both Daves are equally disqualified.

  **Summary:** Your gut was right on the outcomes (Aunt = Yes, Coworker = No, Dave = No), but your working theory ("clean hands") was wrong. The rule isn't about what you've *done*; it's about what you *would do* if no one were watching, and whether you currently submit to the rule you are enforcing.
