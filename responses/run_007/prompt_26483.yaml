answer: |-
  This is one of the hardest open problems in mechanistic interpretability (MI). There is no consensus definition of "mechanism," let alone "mechanistic sameness." Your argument with your friend is a feature of the field, not a bug of your communication.

  Below is a spec for what a theory of **Mechanistic Sameness** would need to deliver to be taken seriously. I have categorized these by whether they are logical/empirical necessities (**Non-Negotiable**) or depend on your interpretability philosophy (**Camp Preference**).

  ### The Desiderata for Mechanistic Sameness

  #### 1. Permutation Invariance
  *   **The Requirement:** The account must declare two models identical if one is a permutation of the other (i.e., neurons in a layer are reordered, and weights are reordered accordingly), even if the raw weight vectors are maximally distant in Euclidean space.
  *   **Why:** Neural networks have weight space symmetries. The "mechanism" is a property of the function computed by the graph, not the specific indexing of hidden units.
  *   **Status:** **Non-Negotiable.**
  *   **Difficulty:** High. Most naive similarity metrics (like L2 distance between weight matrices) fail this immediately. You need canonicalization or graph-isomorphism-style matching.

  #### 2. The Behavior/Mechanism Distinction
  *   **The Requirement:** The account must be able to distinguish between two models that produce identical input-output mappings but arrive at them via different internal causal paths.
  *   **Why:** If "mechanism" just means "function," we don't need interpretability; we just need evals. The whole point of MI is that *how* a result is computed matters for safety, generalization, and understanding.
  *   **Status:** **Non-Negotiable.**
  *   **Difficulty:** Medium. Conceptually clear, but empirically hard to prove negative (how do you prove there *isn't* a shared mechanism?).

  #### 3. Continuity vs. Discreteness (The Sorites Constraint)
  *   **The Requirement:** The account must explain how continuous weight changes (like fine-tuning) relate to discrete mechanistic descriptions (like "induction head" or "IOI circuit"). It cannot claim the mechanism flips instantly with a single bit flip, nor can it claim the mechanism never changes despite total weight overhaul.
  *   **Why:** Fine-tuning moves weights incrementally. If mechanisms are categorical (it *is* or *is not* a lookup table), there must be a boundary. If there is no boundary, "mechanism" is a vague metaphor.
  *   **Status:** **Non-Negotiable (Empirical Fact).**
  *   **Difficulty:** **Extreme.** This is the core philosophical tension. Most current MI papers hand-wave this by assuming mechanisms are stable over small fine-tuning steps, but they lack a metric for *when* they break.

  #### 4. Level of Description Relativity
  *   **The Requirement:** The account must specify the granularity at which sameness is judged. Two models can be "the same" at the level of high-level algorithms (e.g., both use attention to copy tokens) but "different" at the level of specific neuron indices or weight values.
  *   **Why:** A fine-tuned model might implement the same algorithm using different neurons (due to permutation or sparse routing). If you demand weight-level identity, nothing is ever the same. If you demand only algorithmic identity, you lose precision.
  *   **Status:** **Non-Negotiable.**
  *   **Difficulty:** Medium. Requires agreeing on an ontology (what counts as a "component"?).

  #### 5. Handling of Latent/Backup Circuits (Dispositionalism)
  *   **The Requirement:** The account must decide whether unused capacity counts as part of the mechanism. If Model A has a backup circuit that only activates when the primary circuit is ablated, and Model B lacks this backup, are they mechanistically the same on the *original* task?
  *   **Why:** Networks are overparameterized. Mechanisms might be "dispositional" (what the net *would* do) rather than "occurrent" (what the net *does* do).
  *   **Status:** **Camp Preference.**
      *   *Causal/Structuralists:* Only the active path matters. (Backup $\neq$ Mechanism).
      *   *Robustness/Functionalists:* The capacity matters for safety. (Backup $=$ Part of Mechanism).
  *   **Difficulty:** High. This changes depending on whether you care about explanation or robustness.

  #### 6. Polysemanticity and Superposition
  *   **The Requirement:** The account must handle cases where a single neuron or subspace participates in multiple distinct mechanisms simultaneously. It cannot require mechanisms to be locally disjoint.
  *   **Why:** Empirical evidence shows neurons are polysemantic. If your definition of "mechanism" requires clean, non-overlapping subgraphs, it contradicts how networks actually store information.
  *   **Status:** **Non-Negotiable (Empirical Fact).**
  *   **Difficulty:** High. Makes "component identification" mathematically messy (non-orthogonal bases).

  #### 7. Component Reuse and Modularity
  *   **The Requirement:** The account must allow for the same sub-mechanism to be reused in different contexts. Model A and Model B might share a "syntax parsing" mechanism even if their "semantic retrieval" mechanisms differ.
  *   **Why:** Networks are not monolithic; they are composed of reusable circuits. Sameness should be gradable and composable (e.g., "80% the same mechanism").
  *   **Status:** **Camp Preference.**
      *   *Modularity proponents:* Essential.
      *   *Holists:* Suspicious of sharp boundaries, prefer global similarity metrics.
  *   **Difficulty:** Medium.

  ---

  ### Addressing Your Suspected List

  | Your Suspection | Verdict | Notes |
  | :--- | :--- | :--- |
  | **Permutation Invariance** | **Yes, Critical.** | This is the easiest to formalize but hardest to compute efficiently. |
  | **Behavior vs. Mechanism** | **Yes, Critical.** | This is the definition of the field. Without this, you're doing black-box eval. |
  | **Fine-tuning Continuity** | **Yes, Critical.** | This is the "Sorites Paradox" of MI. No current theory solves this well. |
  | **Backup Circuits** | **Yes, but Contested.** | This is the biggest source of disagreement between "causal" and "functional" interpretability. |
  | **Polysemanticity** | **Yes, Critical.** | Any theory assuming clean modularity is empirically false. |
  | **Component Reuse** | **Yes, Preferred.** | Necessary for a compositional theory, but hard to measure. |
  | **Level of Description** | **Yes, Critical.** | You cannot define sameness without defining the resolution. |

  ---

  ### Incompatible Subsets (The "Impossible Trinity")

  You cannot jointly satisfy all of these perfectly. You will likely have to sacrifice one of the following clusters:

  1.  **Discreteness + Continuity + Precision:** You cannot have mechanisms be discrete categories (e.g., "Induction Head"), arise from continuous weights (fine-tuning), *and* have a precise boundary where the mechanism flips. You must accept either fuzzy boundaries or arbitrary thresholds.
  2.  **Causal Specificity + Robustness:** If you define mechanism by the *actual* causal path taken (Specificity), you ignore backup circuits. If you include backup circuits (Robustness), you include weights that had *no causal effect* on the output, which violates strict causal definitions of mechanism.
  3.  **Computability + Accuracy:** A definition that is permutation invariant and handles polysemanticity perfectly (e.g., finding the optimal graph isomorphism between two computation graphs) is likely NP-hard. You will have to settle for approximations.

  ---

  ### The "Easy Answer" Killer

  The single requirement that does the most work to kill naive definitions is **Permutation Invariance**.

  *   **Why:** It immediately invalidates the most common baseline: **"Same if weights are close."**
      *   In fine-tuning arguments, people often say, "The L2 distance between the base and tuned weights is small, so it's the same model."
      *   Permutation invariance proves this wrong. You can permute a network such that the L2 distance is massive, yet the mechanism is identical. Conversely, you can have small L2 distance but a critical permutation mismatch that breaks the circuit.
      *   It forces you to move from *parameter space* to *function space* or *computation graph space*.

  *(Runner up: **Behavior/Mechanism Distinction**. This kills "Same if outputs match." But Permutation is more technically devastating to the specific fine-tuning argument you were having.)*

  ---

  ### Confidence and Uncertainty

  **Confidence in this list as a whole:** **85%.**
  These are widely acknowledged tensions in the interpretability community (e.g., discussed in work by Neel Nanda, Chris Olah, Nora Belrose, and philosophical papers on ML explainability).

  **Point I am least sure of:** **The Status of Backup Circuits (Dispositionalism).**
  *   **Why:** This touches on deep philosophical questions about dispositions vs. occurrences.
      *   If a circuit *exists* in the weights but is never activated on the training distribution, is it part of the mechanism for that distribution?
      *   *Argument for Yes:* It matters for OOD generalization and adversarial robustness.
      *   *Argument for No:* A mechanism is defined by what it *does*, not what it *could* do. Including latent capacity makes the "mechanism" dependent on the dataset coverage rather than the model structure.
      *   There is no consensus here. Some papers treat pruned weights as "gone," others treat them as "dormant." Your theory of sameness will change drastically depending on which side you pick.

  ### Summary for Your Argument
  If you go back to your friend, the deadlock likely happened because one of you was arguing from **Parameter Space** (weights are close $\rightarrow$ same) and the other from **Function Space** (behavior changed $\rightarrow$ different), while ignoring **Computation Space** (the causal graph).

  To move forward, you need to agree on:
  1.  **Granularity:** Are we talking about individual neurons or high-level circuits?
  2.  **Metric:** Are we measuring weight distance (bad), output divergence (black-box), or causal graph isomorphism (ideal but hard)?
  3.  **Latency:** Do dormant circuits count?

  If you can't agree on those three, you aren't arguing about the model; you're arguing about definitions.
