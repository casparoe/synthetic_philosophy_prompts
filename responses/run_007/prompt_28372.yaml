answer: |-
  **The Ethics of Scarcity: Aggregation, Consistency, and Allocation in Health Systems**

  Health systems frequently display a moral schism in how they allocate scarce resources. In the extremis of a pandemic, the imperative to save the greatest number often overrides individual claims, yet in ordinary circumstances, queueing and waiting lists prioritise procedural fairness over maximising outcomes. This apparent inconsistency raises profound questions about the underlying ethical architecture of medical rationing. To understand this, one must reconstruct the theory of aggregation presupposed by crisis triage, distinguish its necessary conditions from its contingent features, and evaluate whether these practices can be reconciled with the common moral uneasiness regarding the sheer weight of numbers.

  **The Aggregative Theory of Crisis Triage**

  The triage protocols employed during the COVID-19 pandemic, which ranked patients by expected survival to maximise the total number of lives saved, presuppose a specific theory of moral aggregation: **additive consequentialism**. Under this view, individual claims to treatment are not absolute rights but rather interests that possess a quantifiable moral weight. The theory operates on the premise that the strength of a moral reason to act is determined by the sum of the benefits accrued to all affected individuals.

  In this framework, a patient's claim is a function of their prognosis. If Patient A has a 90% chance of survival with ventilation and Patient B has a 10% chance, the 'value' of treating A is higher. Crucially, when resources are insufficient for all, the claims of multiple patients are summed. The combined claim of five patients with moderate survival prospects outweighs the singular claim of one patient with similar prospects. This treats individual lives as fungible units of value within the calculation. The moral mathematics are linear: $n \times \text{life} > 1 \times \text{life}$, provided the quality and probability of the life saved are comparable.

  **Strict Presuppositions versus Compatible Fit**

  It is vital to distinguish what this practice *strictly presupposes* from what it merely *fits well with*.

  Strictly, the greatest-number protocol presupposes that **moral reasons are aggregable across persons**. It requires the rejection of the 'separateness of persons' objection, which holds that one cannot sacrifice one individual's right simply to benefit others, as they are distinct moral entities. For triage to be logically coherent, it must assume that the boundary between individuals is permeable in the calculus of survival; the loss to the one can be morally cancelled out by the gain to the many. Furthermore, it strictly presupposes that 'life' or 'survival probability' is the sole or dominant commensurable metric in that specific context.

  However, several aspects merely *fit well* with the practice without being strictly required by it. For instance, the practice fits well with **utilitarian efficiency**, but it does not strictly require a comprehensive utilitarian worldview. A health system could adopt crisis triage as a tragic necessity (a 'threshold deontology') while maintaining that, under normal conditions, individuals have inviolable rights. Additionally, triage fits well with **public health goals** (preserving the healthcare workforce, preventing system collapse), but the bedside protocol itself focuses on individual survival, not necessarily broader societal utility. One could justify triage solely on the micro-level duty to do the most good with the resources at hand, without invoking macro-level societal benefits.

  **Reconciling Triage, Queueing, and Moral Uneasiness**

  Can the aggressive aggregation of pandemic triage, the fairness of queueing, and the public's uneasiness about '1 vs 5' scenarios be made mutually consistent? A rigid, single-principle ethical system would struggle to reconcile them. However, a **contextual pluralist** framework can achieve consistency by introducing a threshold of scarcity.

  The inconsistency dissolves if we view allocation principles as sensitive to the degree of scarcity. In ordinary circumstances, scarcity is moderate. Here, the moral cost of denying treatment is not immediate death for all claimants, but delayed treatment. In this zone, **egalitarian principles** (such as queueing or waiting time) dominate because they respect the equal status of citizens without resulting in catastrophic loss of life. The public's uneasiness about aggregation is honoured here; we do not simply bypass the person who has waited longest to treat someone with a marginally better prognosis.

  In crisis circumstances (pandemic triage), scarcity becomes catastrophic. The choice is no longer between 'treat now' and 'treat later', but 'treat' and 'die'. In this extreme context, the moral cost of adhering to strict fairness (e.g., a lottery between one and five) becomes the certain death of the four. Consistency is maintained by arguing that the **stringency of the duty to rescue** scales with the severity of the outcome. The uneasiness about aggregation remains valid as a default moral intuition, but it is overridden by the imperative to prevent mass mortality when the system is on the brink of collapse. Thus, triage and queueing are not contradictory rules, but distinct tools for distinct levels of emergency.

  **Implications of Non-Aggregationism**

  If we were to adopt the view that numbers of lives saved do not by themselves add to the strength of moral reasons—a **non-aggregationist** or contractualist view—the implications for health policy would be radical. This view holds that a group's claim cannot outweigh an individual's claim simply by virtue of size; each individual stands in a one-to-one relation with the decision-maker.

  Under this view, **crisis triage protocols would require fundamental alteration**. One could not deny a ventilator to a patient with a reasonable chance of survival simply to treat five others with similar chances. If the individual claims are equal (e.g., equal prognosis), the only fair procedure would be a **random lottery**, regardless of the number of people in each group. Saving five instead of one would be morally permissible only if the one had a significantly lower prognosis, not because they were outnumbered.

  Regarding **ordinary allocation**, the shift would be less drastic but still significant. Queueing is already largely non-aggregative, prioritising fairness over utility. However, under strict non-aggregationism, even marginal gains in expected benefit (Quality-Adjusted Life Years, or QALYs) could not justify prioritising one patient over another if their underlying claim (e.g., severity of need) was equal. Policy would move away from 'maximising health outcomes' towards 'fair innings' or pure randomisation among equal claimants.

  **Conclusion**

  The apparent inconsistency in health systems reflects a tension between two valid moral demands: the duty to do the most good (aggregation) and the duty to treat each person as an end in themselves (non-aggregation). Crisis triage strictly presupposes that claims aggregate to prevent catastrophic loss, whilst ordinary queueing respects the separateness of persons. These can be rendered consistent through a threshold model where aggregation is permitted only when fairness would result in mass mortality. However, should we embrace the intuition that numbers do not count, we must accept a health system that prioritises random fairness over maximal survival, accepting that more lives may be lost to preserve the moral integrity of individual claims.
