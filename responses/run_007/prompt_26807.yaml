  i want to see what an actual adversarial collaboration between these two camps would produce. not a debate transcript, but the document they'd both sign after hashing it out in good faith. i'm imagining: the claims they agree on (about the architecture, about what behavioral markers would be relevant, about what 'suffering' even cashes out to in this context), the exact points of disagreement phrased so each sides says 'yeah that's what i think,' and the cruxes — the sub-questions where if you settled them, at least one side would genuinely update.

  format it as a numbered agreed-claims section and then a disagreements table with columns for the issue, camp A's view, camp B's view, and what each side says would change their mind. and please separate what's actually settled in philosophy of mind / RL theory from what's genuinely contested, because i've seen people on both sides talk like their view is obvious consensus when it's not and that drives me nuts.
