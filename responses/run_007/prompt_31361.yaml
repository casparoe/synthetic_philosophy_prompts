answer: |-
  You are right to be suspicious of the "perfect fake" thought experiment. It functions like a frictionless plane in physics: a useful abstraction for isolating variables, but potentially misleading if you assume it describes reality. The Van Meegeren case is not just an application of the theory; it is a stress test that exposes the fragility of the "perceptually indistinguishable" premise.

  Here is a dialectical walkthrough of the *Supper at Emmaus* through the major positions, followed by an assessment of where the theory breaks down.

  ### 1. Ontological Status: What is the Work?
  You ask whether *Supper at Emmaus* is a bad Vermeer, a good van Meegeren, or something that flipped identity.

  *   **It is not a bad Vermeer.** Ontologically, it never was a Vermeer. A work of art is typically individuated by its genesis (who made it and when). Since Vermeer never touched it, it cannot be a "bad" instance of his output, any more than a forgery of a signature is a "bad" signature of the person being forged.
  *   **It is a good van Meegeren.** This is its current stable identity. However, calling it "good" requires qualification. As a *deception*, it was excellent. As a *pastiche*, it is competent. As an *original expression*, it is derivative.
  *   **Did the identity flip?** The physical object remained constant. The *artwork* (the object plus its classification) underwent a radical shift. In 1937, it functioned socially and aesthetically as a Vermeer. In 1947, it functioned as a van Meegeren. This suggests that the identity of an artwork is not fixed at the moment of creation but is partially constituted by its reception and historical framing.

  ### 2. Walking Through the Positions

  **The Perceptualist (Formalist) View**
  *   *The Theory:* Aesthetic value resides solely in the arrangement of lines, colors, and forms. If two objects look identical, they possess identical aesthetic value. Provenance is irrelevant biography.
  *   *The Case:* In the 1930s, this view seemed vindicated. Bredius and others looked at the canvas and experienced "Vermeer." The aesthetic value was high.
  *   *The Breakdown:* Once the forgery was revealed, the aesthetic value plummeted. Critics who once praised the "solemnity" of the figures now described them as "wooden" and "lifeless." The pixels on the retina didn't change. If aesthetic value were purely perceptual, the revelation of the forgery should not have altered the visual experience. The fact that it did suggests that *knowledge is a constituent of perception*. The Perceptualist must argue that our eyes actually changed, which concedes the point that perception is not a neutral recording device.

  **The Historicist/Contextualist View (Danto, Levinson)**
  *   *The Theory:* To see something as art is to see it under an interpretation supported by art-historical context. The "artworld" confers status. We value the *achievement* of the artist within their specific historical moment.
  *   *The Case:* This handles Van Meegeren best. In 1937, the work was embedded in a narrative of "rediscovered Vermeer." It filled a gap in Vermeer's oeuvre (his religious phase). Its value came from its perceived relationship to art history.
  *   *The Breakdown:* When the narrative shifted to "Van Meegeren fooling the Nazis," the work acquired a new context. It is now valued as a testament to 1930s academic painting and the psychology of deception. The Historicist explains why the value didn't go to zero: the history is still rich, just different. However, this view struggles to explain why we still feel a sense of *loss*. If value is just context, the new context should be just as valuable as the old one. But we mourn the loss of the Vermeer. This suggests there is a specific value in *authenticity* that isn't just narrative—it's about the human connection across time.

  **The Achievement View (Denis Dutton)**
  *   *The Theory:* We value art for the human performance behind it. We admire the skill, insight, and creativity required to produce it.
  *   *The Case:* A Vermeer is valued for the insight into light and human presence in the 17th century. A Van Meegeren is valued for the technical cunning to mimic that style in the 20th.
  *   *The Breakdown:* This clarifies why the fake is "lesser." Mimicry is a lower-order achievement than innovation. However, Van Meegeren complicates this because his achievement *was* deception. The skill was directed toward lying, not toward aesthetic communication. The Achievement View explains why we don't value the fake *as a Vermeer*, but it doesn't fully explain why the visual experience itself degrades.

  ### 3. The "Perfect Fake" Problem and Theory-Ladenness

  This is where your intuition is strongest. The Van Meegeren case suggests that the "perfect fake" is a philosophical myth because **perceptual indistinguishability is temporal.**

  **The Instability of "Indistinguishable"**
  The thought experiment assumes a static viewer: "If Expert X cannot tell them apart today, they are indistinguishable." Van Meegeren shows that indistinguishability is a moment in time, not a permanent state.
  *   **1937:** Indistinguishable to Bredius.
  *   **1947:** Distinguishable to chemists (bakelite hardening).
  *   **2024:** Distinguishable to the trained eye (stylistic anachronisms).

  Goodman argued that knowing a work is a fake trains us to look for differences, thereby making them perceptually distinguishable eventually. Van Meegeren proves Goodman right. The "perfect fake" is only perfect until we know it is a fake. Once the category shifts, the perception shifts. The "leftover difference in value" isn't just a moral add-on; it actively reorganizes the visual data. We literally see the brushstrokes differently when we know they are the product of calculation rather than inspiration.

  **Is the Framing Off?**
  The "perfect fake" problem is not confused, but it is **ahistorical**. It treats the artwork as a snapshot. Van Meegeren forces us to treat the artwork as a movie.
  *   The thought experiment asks: "Is Copy A equal to Original B?"
  *   The real question Van Meegeren poses is: "How does the *trajectory* of attribution constitute the aesthetic object?"

  If you stick to the "perfect fake" framing, you have to pretend Van Meegeren's works *are* perceptually identical to Vermeers. They aren't, not anymore. But they *were*, phenomenologically, for the viewers in 1937. This implies that aesthetic properties are not intrinsic to the canvas (like mass or chemical composition) but are **relational properties** between the canvas, the viewer, and the historical context.

  ### 4. Why Exhibit Them? (The Value of the Fake)

  You ask why these canvases are exhibited and valued as van Meegerens rather than destroyed. If the Perceptualist were right, and the value was only in the look, they should still be valuable as "beautiful images." If the Historicist is right, they are valuable as "historical documents."

  The truth is likely a hybrid:
  1.  **Meta-Aesthetic Value:** They are now appreciated as *commentary* on Vermeer. They show us what the 1930s thought Vermeer was. They reveal the biases of Bredius and his generation (who wanted a solemn, religious Vermeer to counter the secular trend). In this sense, they are more revealing about art history as a discipline than a real Vermeer would be.
  2.  **The Thrill of the Con:** There is an aesthetic frisson in standing before a painting that fooled the world. The "deception" becomes part of the content. It is a performance art piece where the performance lasted a decade.
  3.  **Survival of Craft:** They are not destroyed because they are still technically proficient paintings. They aren't *great* art, but they aren't trash. They occupy a category of "notable craft."

  ### 5. Conclusion: What Breaks?

  The Van Meegeren case breaks the **binary** of the perfect-fake problem. The debate usually sets up a dichotomy: *Either* aesthetic value is purely perceptual *or* it is purely historical.

  Van Meegeren shows that **perception is historical.**
  You cannot separate the "visible" from the "provenance" because the provenance dictates what is visible to you. When Bredius looked at *Emmaus*, he didn't just see paint; he saw his own theory of Vermeer projected onto the canvas. When that theory collapsed, the painting changed.

  **Should you abandon the "Perfect Fake" frame?**
  Don't abandon it, but demote it. It is a tool for isolating the *concept* of authenticity, but it fails to capture the *experience* of art.
  *   **The Lesson:** The "leftover difference in value" is not a ghostly residue added to the visual experience (like a price tag attached to a sunset). It is the lens through which the visual experience is focused.
  *   **The Verdict:** *Supper at Emmaus* is not a "failed Vermeer." It is a successful mirror. It reflects the desires of the experts who validated it. The fact that it is now exhibited as a van Meegeren confirms that we value art not just for what it *is*, but for the truth of the relationship it establishes between the maker, the viewer, and history. A fake severs that truth, and in doing so, it alters the vision.

  The "perfect fake" thought experiment asks if we care about the truth if we can't see the lie. Van Meegeren answers: **We care because the truth changes what we see.**
