          *   *Application to Van Meegeren:* In the 1930s, experts *said* it looked like a Vermeer. Therefore, aesthetically, it *was* a Vermeer. Now it doesn't. Why? Because our perception changed.
      *   **Contextualism/Historicism (Danto, Dickie, Levinson):** Art is defined by history, intention, and reception. The "artworld" confers status.
