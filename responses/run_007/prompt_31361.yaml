      *   *Did the value drop?* Yes, monetary and prestige value dropped, but they didn't become zero. They became curiosities.
      *   *Goodman's point:* Goodman argues that even if indistinguishable *now*, knowing one is a fake trains us to see differences *later*. Van Meegeren proves this: once we knew, we saw the differences.
      *   *Make sure to address the "identity flip":* Does the work change? No, the *classification* changes. But since classification affects perception, the *aesthetic object* changes.

  7.  **Final Polish:** Organize into clear sections matching the user's prompts. Ensure the conclusion ties back to the "perfect fake" abstraction. (Self-correction: Ensure I don't just list theories but show how the case *breaks* them.)

