      *   *Section 2: The Ritual vs. The Belief (Do they actually hold this view?)*
          *   *Crucial distinction:* It's not epistemic (truth-seeking), it's political (legitimacy-seeking).
          *   *The "Vocabulary of Motive":* It gives a language to discuss performance, even if flawed.
