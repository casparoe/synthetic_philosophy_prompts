  ### The Verdict
  Dana will almost certainly say that **the promise binds.**

  Despite your lack of internal intent ("autopilot"), you voluntarily performed the speech act of promising in a context where a reasonable person (your nephew) would interpret it as binding. Dana's track record suggests she views the obligation as arising from the **act of committing yourself**, not from your internal mental state or the eventual consequences for the listener.

  ### The Best Explanatory Principle
  The principle that best explains Dana's entire track record is **The Objective Normative Power of the Speech Act** (a deontological view of promising).

  According to this principle, a promise creates a moral obligation when three conditions are met:
  1.  **Voluntariness:** The words were spoken without coercion (rules out *Gunpoint*).
  2.  **Conventional Meaning:** The words were used in a context where their standard meaning applies (rules out *Joke*, where context nullifies the meaning).
  3.  **No Waiver:** The right-holder has not released the obligation (rules out *Release*).

  **Why this fits the "Forgotten Promise" outlier:**
  This is the critical data point. Most theories (like Reliance or Consequentialism) would say a promise doesn't bind if the other person forgets it and suffers no harm. Dana's insistence that it *still binds* reveals that she locates the obligation in the **promisor's integrity**, not the **promisee's welfare**. Once you voluntarily invoke the convention of promising, you have altered your own normative status (restricted your own freedom), regardless of whether the other person remembers or benefits.

  **Why this fits the Nephew case:**
  Your "autopilot" defense fails under this principle. Unlike *Gunpoint* (which removes voluntariness) or a *Joke* (which changes the convention), speaking on autopilot is a voluntary act of carelessness. You invoked the convention of promising; therefore, you are bound.

  ### The Rival Principle
  The strongest competing principle that also fits her track record is **The Subjective Intent Theory.**

  This principle holds that a promise only binds if the promisor *willfully intends* to undertake an obligation at the moment of speaking.
  *   **Loan:** Intended $\rightarrow$ Bind.
  *   **Gunpoint:** Coerced/No Intent $\rightarrow$ No Bind.
  *   **Joke:** No Intent $\rightarrow$ No Bind.
  *   **Release:** Intent overridden by waiver $\rightarrow$ No Bind.
  *   **Forgotten Promise:** Intended (at the time) $\rightarrow$ Bind.

  **Why it's a rival:**
  This theory fits all five of Dana's past verdicts perfectly. However, it diverges sharply on the Nephew case. Under Subjective Intent, your promise **does not bind** because you explicitly "didn't actually mean to take anything on."

  ### The Crucial Follow-Up Case
  To force a choice between **Objective Speech Act** (Bind) and **Subjective Intent** (No Bind), you need a case where the external act is clearly voluntary, but the internal intent is secretly nullified.

  **The "Crossed Fingers" Case:**
  > *Imagine you make a clear, voluntary promise to a colleague ("I promise I'll finish the report by Friday"). You speak clearly, without coercion, and in a serious context. However, unbeknownst to your colleague, you cross your fingers behind your back, secretly signaling to yourself that you don't mean it. You then fail to finish the report.*

  *   **If Dana says it Binds:** She supports the **Objective Speech Act** principle. The external commitment is what matters; secret reservations are irrelevant. (This aligns with her "Forgotten Promise" verdict).
  *   **If Dana says it Doesn't Bind:** She supports the **Subjective Intent** principle. The internal will is the source of the obligation; without it, the words are empty.

  **Why this works:**
  The Nephew case is slightly muddy because "autopilot" blurs the line between carelessness and lack of intent. The "Crossed Fingers" case isolates the variables: the act is perfectly voluntary and conventional, but the intent is explicitly absent. This forces Dana to choose between protecting the listener's trust (Objective) or the speaker's internal will (Subjective). Given her verdict on the "Forgotten Promise," she is likely to prioritize the Objective view, but this case would confirm it.
