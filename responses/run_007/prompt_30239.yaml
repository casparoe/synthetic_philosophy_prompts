answer: |-
  The principle that unifies your intuitions and matches the behavior of your Monte Carlo simulations is the condition of **Absolute Integrability** (mathematically, that the random variable $X$ belongs to the space $L^1$).

  In plain English: **Expected Value is a reliable guide for pricing and simulation only if the expected value of the *absolute* payoff is finite.**

  If $E[|X|] < \infty$, the Strong Law of Large Numbers holds, your sample mean will converge, and the expectation is independent of how you sum the terms. If $E[|X|] = \infty$, the Law of Large Numbers fails, the sample mean will not settle, and the "expected value" is either infinite or mathematically undefined.

  Here is how this principle applies to your cases, followed by the distinction between settled mathematics and contested decision theory.

  ### 1. Analysis of Your Verdicts

  **The Principle:** Check $E[|X|] = \sum p_n |payoff_n|$.
  *   If finite: Price = $E[X]$.
  *   If infinite: Price $\neq E[X]$. You must use a utility function (risk aversion) or reject the game.

  | Case | Game | $E[|X|]$ | Mathematical Status | Your Verdict | Consistency |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1** | St. Petersburg ($2^n$) | $\infty$ | Diverges to $+\infty$ | Pay ~\$25 | **Consistent.** Since $E[|X|]=\infty$, EV is not a price. Your \$25 implies an implicit **utility function** (e.g., log-wealth) or a **truncation** (finite bankroll). |
  | **2** | Pasadena (Alt. Signs) | $\infty$ | Undefined (Cond. Conv.) | Pay $<\$1$ | **Consistent.** Since $E[|X|]=\infty$, EV is undefined. Refusing to price is the only coherent move without arbitrary constraints. |
  | **3** | Flipped Pasadena | $\infty$ | Undefined (Cond. Conv.) | Pay $<\$1$ to avoid | **Consistent.** Same as above. The sign flip doesn't fix the integrability issue. |
  | **4** | Capped at \$10M | Finite | Converges Absolutely | Price = EV | **Consistent.** Capping ensures $E[|X|] < \infty$. LLN holds. EV is valid. |
  | **5** | Two Pasadenas | $\infty$ | Undefined | Refuse to price | **Consistent.** The sum of non-integrable variables is non-integrable. Linearity of expectation fails. |

  ### 2. The New Cases

  Here is where the principle forces specific conclusions.

  **Case A: No sign alternation ($2^n / n$)**
  *   **Math:** The terms are all positive. The sum diverges to $+\infty$. $E[|X|] = \infty$.
  *   **Principle:** Like St. Petersburg, the EV is infinite and the sample mean will not settle.
  *   **Verdict:** You cannot price this by EV. You must price it using the same utility/truncation logic as St. Petersburg. Since $2^n/n < 2^n$ for all $n > 1$, your price should be **less than or equal to your St. Petersburg price** (i.e., $\le \$25$), but definitely finite.
  *   **Simulation:** Your Monte Carlo mean will drift upward indefinitely, never converging.

  **Case B: Rearranged Pasadena (Partial sums $\to +100$)**
  *   **Math:** This relies on the Riemann Rearrangement Theorem, which states a conditionally convergent series can be reordered to sum to any value.
  *   **Principle:** **This is a category error.** In probability theory, the expectation is an integral over the probability space ($\int X dP$), not an arbitrary series sum. The "order" of summation is fixed by the index of the outcomes (flip 1, flip 2, etc.). You cannot legally "rearrange" the outcomes of a fixed gamble to change its expectation.
  *   **Verdict:** You must **reject the price of \$100**. A game is defined by the mapping of outcomes to payoffs. If you change the summation order, you are not calculating the expectation of the *game*; you are calculating the sum of a *series* that no longer represents the game's probability structure. The expectation remains **undefined**.
  *   **Simulation:** If you simulate the game as defined (flip coin, pay based on $n$), the sample mean will oscillate wildly and not settle on 100.

  ### 3. Settled vs. Contested

  It is crucial to distinguish between the mathematical behavior of the simulations (settled) and the normative rules of rational choice (contested).

  #### Settled (Mathematics & Statistics)
  1.  **Law of Large Numbers:** It is a proven theorem that the sample mean converges to the expectation **if and only if** $E[|X|] < \infty$. In all your "infinite" cases, your Monte Carlo simulation is mathematically guaranteed *not* to settle.
  2.  **Undefined Expectation:** For the Pasadena game, the expectation is mathematically undefined. It is not "infinity"; it simply does not exist as a Lebesgue integral.
  3.  **Rearrangement:** You cannot assign a value to a gamble based on a rearranged series. The expectation is order-independent *only* when absolutely convergent.

  #### Contested (Decision Theory & Economics)
  1.  **Rationality in Case 1 (St. Petersburg):**
      *   *Consensus:* No rational agent should pay an infinite amount.
      *   *Debate:* *Why?* Traditionalists (Bernoulli) argue for **diminishing marginal utility** (you value the 100th million less than the 1st). Modern critics argue utility functions shouldn't be bounded. Some argue the resolution is simply that **no casino has infinite bankroll** (truncation), making the EV finite (~\$25 for a realistic bankroll). Your \$25 verdict is consistent with both views.
  2.  **Rationality in Case 2 & 3 (Pasadena):**
      *   *Consensus:* Standard Expected Utility Theory (EUT) breaks down here.
      *   *Debate:* What should a rational agent do?
          *   *View A (Hájek & Nover):* Rationality does not require a preference. It is rational to have **no price** for undefined gambles. (Matches your verdict).
          *   *View B (Traditionalists):* Preferences must be **complete**. You *must* have a price. This forces agents to adopt arbitrary "regularization" methods (like summing in index order), which many find unsatisfactory.
  3.  **Linearity (Case 5):**
      *   *Debate:* If $E[X]$ and $E[Y]$ are undefined, is $E[X+Y]$ undefined? Mathematically, yes. But some decision theorists try to construct "extended" expectations that preserve linearity even for pathological cases. These extensions are not standard and often require accepting counter-intuitive results.

  ### 4. Do You Need to Drop Any Verdicts?

  **No.** Your intuitions are remarkably robust and align with the **Absolute Integrability** principle combined with **Risk Aversion/Truncation**.

  *   You correctly identify that infinite/undefined EVs cannot be priced by EV (Cases 1, 2, 3, 5).
  *   You correctly identify that bounded EVs can be priced by EV (Case 4).
  *   You correctly reject the "Rearranged Pasadena" (Case B) by refusing to put a price on the bundle (Case 5) and implying skepticism of undefined expectations.

  **The only adjustment required:**
  You must explicitly reject the validity of **Case B (Rearranged Pasadena)** as a pricing method. If someone claims the game is worth \$100 because they summed the series differently, your principle forces you to say: *"That sum does not represent the expectation of this gamble. The expectation is undefined, and I will not play."*

  ### Summary for the Engineer
  Your gut is checking for **$L^1$ convergence**.
  *   **If $\sum |p_n x_n| < \infty$:** Trust the Mean. (Case 4)
  *   **If $\sum |p_n x_n| = \infty$:** Do not trust the Mean. Use Utility or Truncation. (Cases 1, 2, 3, 5, A)
  *   **If the series is conditionally convergent:** The Mean does not exist. Ignore arguments based on rearrangement. (Cases 2, 3, B)

  This principle is mathematically settled regarding simulation behavior. The only "contested" part is whether a rational agent *must* force a price when the math says "undefined." Your refusal to do so is a defensible, increasingly standard position in modern decision theory.
