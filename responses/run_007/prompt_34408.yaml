answer: |-
  Here is the translation of the Problem of Old Evidence (PoOE) into your probabilistic programming workflow, followed by the residue report and confidence flags.

  ### The Problem of Old Evidence, Translated to ProbProg

  In Bayesian epistemology, the Problem of Old Evidence asks: *How can data $E$ that you already knew (probability 1) confirm a new hypothesis $H$?* If $P(E) = 1$, then $P(E|H) = 1$, and Bayes' rule yields no update: $P(H|E) = P(H)$. Yet, historically, old evidence (like Mercury's perihelion) confirmed new theories (General Relativity).

  **In your vocabulary:**
  Imagine you have a dataset `y` sitting in your workspace. You've looked at it. You know its summary statistics. You then sit down to write a Stan model.

  1.  **The Philosophical Constraint:** You are treated as a "logically omniscient" agent. If your model code `M` logically implies `y`, you should have known that *before* you compiled the model. Since you already "know" `y`, the probability of `y` is 1. Therefore, the marginal likelihood $p(y|M)$ should be 1, and the Bayes Factor comparing `M` to a null model should be 1. No model comparison is possible.
  2.  **The ProbProg Reality:** You do not treat `y` as having probability 1. You treat `y` as a realization of a stochastic process defined in the `model` block. You calculate $p(y|M) = \int p(y|\theta, M)p(\theta|M) d\theta$. This value is rarely 1. It is usually tiny.
  3.  **The Actual Conflict:** The philosophical problem maps onto **model specification search** (or "tuning").
      *   If you look at `y`, notice a pattern (e.g., heteroskedasticity), and *then* modify your Stan code to include a heteroskedastic noise term, you have conditioned your model structure on the data.
      *   If you then compute a Bayes Factor or even LOO-CV on that *same* `y` without penalizing for the search process, you are double-counting. You are claiming the data confirmed the model, but the data actually *created* the model.

  **The "Stan Model is Misbehaving" Walkthrough:**
  Imagine you are debugging a model where the posterior predictive checks (PPC) fail.
  *   **Step 1:** You look at the residuals. You see a curve.
  *   **Step 2:** You add a quadratic term to the linear predictor.
  *   **Step 3:** The PPC looks great.
  *   **The PoOE Question:** Did the data *confirm* the quadratic model? Or did you just overfit the noise because you peeked?
  *   **Philosophers say:** Since you saw the residuals (old evidence) before writing the quadratic term (new hypothesis), the data cannot logically confirm the model. Your belief in the quadratic term shouldn't update.
  *   **Data Scientists say:** We handle this with **regularization** and **cross-validation**. We acknowledge that the model structure $M$ is now conditional on $y$. To evaluate it, we must estimate $p(\tilde{y} | y, M)$, not $p(y | M)$. We use LOO-CV (ELPD) to approximate out-of-sample predictive accuracy, effectively simulating "new evidence."

  ### Residue Report

  Here is how the philosophical concepts map to your toolkit, where they stretch, and where they break.

  #### 1. Clean Mappings (High Fidelity)
  *   **Old Evidence $\leftrightarrow$ Training Data:** The philosophical "known evidence" is exactly your training set `y` that exists before model specification is finalized.
  *   **New Hypothesis $\leftrightarrow$ Model Code/Structure:** The "hypothesis" is the specific `model { ... }` block, including distributional choices and link functions.
  *   **Confirmation $\leftrightarrow$ Model Comparison Metrics:** The degree to which evidence supports the hypothesis maps to the Bayes Factor or the difference in ELPD (Expected Log Pointwise Predictive Density) between models.
  *   **Logical Omniscience $\leftrightarrow$ Static Model Graph:** Philosophers assume you know all implications of your priors immediately. In Stan, this is like assuming that once you write the code, you instantly know the posterior geometry without running HMC. The "problem" arises because you (the human) don't know the implications of the code until you run it.

  #### 2. Stretches and Fudges (Medium Fidelity)
  *   **Probability 1 vs. Fixed Data:** Philosophers argue $P(E)=1$ because the agent *knows* $E$. In ProbProg, we treat $y$ as fixed *conditionally*, but we never assign it a subjective probability of 1 in the generative sense; we assign it a likelihood. We fudge this by assuming the *generative process* is uncertain, even if the *realization* is observed.
  *   **Updating Belief vs. Updating Code:** Philosophers talk about updating the probability of a hypothesis $P(H)$. In ProbProg, we rarely update the probability of the *model structure* itself (unless doing Bayesian Model Averaging). We usually select one model and update parameters $\theta$. The "belief update" is often implicit in the selection of `M`, not explicit in a posterior $P(M|y)$.
  *   **The "Time" Aspect:** PoOE relies heavily on the temporal order (knowing $E$ before $H$). In ProbProg, time matters less than **conditional independence**. If $M$ is independent of $y$ (pre-registered), old evidence works fine. If $M$ depends on $y$ (exploratory), we need CV. The philosophical "time" problem dissolves into a "dependency graph" problem.

  #### 3. No Counterpart (The Gap)
  *   **Normative Truth vs. Predictive Utility:** Philosophers care about whether the theory is *true* (or rationally believed). You care about whether the model *predicts*. The PoOE is a crisis for *confirmation of truth*. For *prediction*, old evidence is just fuel. If your model predicts old data well and is regularized, you assume it predicts new data well. The philosophical anxiety about "why does this count as support?" doesn't exist in pure predictive modeling.
  *   **Logical Implication:** Philosophers worry about logical entailment ($H \implies E$). In ProbProg, models almost never logically entail data; they assign it probability density. The strict logical problem ($P(E)=1 \implies P(E|H)=1$) doesn't apply because your likelihoods are never indicator functions (usually).

  ### Does the Problem Dissolve?

  **Verdict:** It dissolves for **prediction**, but persists for **causal/theoretical inference**.

  If your goal is **ELPD maximization**, the PoOE is solved by cross-validation. You acknowledge that using `y` to build `M` consumes degrees of freedom. LOO-CV penalizes you for that. The "oldness" of the evidence is irrelevant; only the independence of the evaluation matters.

  However, if your goal is **causal identification** or **theory confirmation** (e.g., "Does this parameter *really* represent the effect of X?"), the PoOE remains. If you searched through 100 model specifications to find the one where the treatment effect is significant, your posterior intervals are too narrow, even with LOO-CV. LOO-CV fixes prediction, not specification bias in parameter interpretation. Philosophers are pointing at the fact that **model selection bias invalidates the epistemic claim of the model**, not just its predictive score. Your tools (Stan/PyMC) calculate the posterior *conditional on the model being true*. They do not calculate the probability *that the model is the correct specification*, especially if you picked that specification because it fit the old evidence.

  ### Confidence Flags

  **Confidence in Major Claims:**
  *   **Mapping "Old Evidence" to "Training Data used for Specification":** **High Confidence.** This is the standard interpretation in statistical literature (e.g., Gelman et al. on model checking).
  *   **Claim that Cross-Validation dissolves the predictive aspect of the problem:** **High Confidence.** This is mathematically robust within the predictive framework.
  *   **Claim that the problem persists for causal/theoretical inference:** **Medium-High Confidence.** While methods like multi-level modeling help, there is no consensus "fix" for specification searching in causal inference comparable to CV in prediction.
  *   **Claim that ProbProg treats data as stochastic rather than Probability 1:** **High Confidence.** This is fundamental to the likelihood principle.

  **The Single Point of Least Certainty:**
  I am least certain about the mapping of **"Logical Omniscience"** to **"Computational Limits in HMC."**
  *   *Why:* Philosophers assume an agent *could* know $H \implies E$ instantly but doesn't. In ProbProg, we *cannot* know the posterior implications of our code without running MCMC/VI. Is this a limitation of *logic* (philosophy) or a limitation of *computation* (engineering)? If it's purely computational, the philosophical problem might be a category error when applied to working data scientists. However, if the "search space" of possible models is infinite, the computational limit becomes a logical limit. I am not certain where that boundary lies in this context.

  **Summary:** The philosophers are pointing at **Specification Search Bias**. You call it overfitting or tuning. They call it the Problem of Old Evidence. Your tools hide it by assuming the model is fixed *before* seeing the data. When you violate that assumption (which you always do), your posteriors are valid *conditional on the search path*, but that path is rarely modeled. You solve the *predictive* symptom with CV, but the *epistemic* wound (that you tailored the story to the data) remains unquantified.
