prompt: |-
  I'm a data scientist who works with probabilistic programming (Stan, PyMC, that kind of thing) all day. I keep hearing philosophers talk about something called "the problem of old evidence" in Bayesian epistemology, and from the name alone it sounds like it should be right up my alley — I spend half my life worrying about whether I'm double-counting data or accidentally conditioning on the thing I'm trying to predict.

  So here's what I want. Restate the problem of old evidence in the vocabulary I actually use: generative models, priors, likelihoods, conditioning via Bayes rule, posterior predictive checks, model comparison with Bayes factors or ELPD, that whole toolkit. Walk me through it as if you're explaining why my Stan model is misbehaving. Then give me the residue report: which parts of the philosophical problem map cleanly onto how I think about data and models, which parts you had to stretch or fudge to make fit, and which parts have no counterpart at all in my vocabularly. I want to know whether the philosophers are pointing at a real problem I'm just not seeing because my tools hide it, or whether their problem sort of dissolves once you think in terms of generative models and out-of-sample prediction.

  Also: tell me how confident you are in each major claim you make, and flag the single point you're least sure about. I'd rather hear "I think this is right but I'm not certain" than have you sound authoritative about something you're actually guessing at.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Persona:** Data Scientist, works with probabilistic programming (Stan, PyMC). Comfortable with generative models, priors, likelihoods, Bayes rule, posterior predictive checks (PPC), model comparison (Bayes factors, ELPD/LOO-CV).
      *   **Topic:** The "Problem of Old Evidence" (PoOE) in Bayesian Epistemology.
      *   **Goal:** Restate PoOE in DS/ProbProg vocabulary. Explain it as if debugging a Stan model. Provide a "Residue Report" (mapping, stretches, gaps). Evaluate if it's a real problem or dissolves in practice.
      *   **Constraint:** Express confidence levels for major claims. Flag the single point of least certainty. Avoid false authority.

  2.  **Deconstruct the Problem of Old Evidence (PoOE):**
      *   *Standard Philosophical Formulation:* How can evidence $E$ that was already known (probability $P(E) = 1$) confirm a new hypothesis $H$? If $P(E) = 1$, then $P(E|H) = 1$, so the likelihood ratio is 1, and the posterior equals the prior. No updating occurs. Yet, historically, old evidence *does* confirm new theories (e.g., Mercury's perihelion confirming General Relativity).
      *   *Core Tension:* Logical omniscience vs. Bounded rationality. The agent "knows" $E$ but didn't know $H$ implied $E$ until later.

  3.  **Translate to Probabilistic Programming (ProbProg) Vocabulary:**
      *   *Hypothesis ($H$):* A model structure/code (`model { ... }`).
      *   *Evidence ($E$):* The dataset `y`.
      *   *Old Evidence:* Data that exists before the model is written/debugged.
      *   *The "Problem":* If I condition on `y` that I've already seen, how does defining a new model structure increase my confidence in that model?
      *   *Likelihood:* `y ~ distribution(theta)`.
      *   *Prior:* `theta ~ prior_dist`.
      *   *Posterior:* `p(theta | y, model)`.
      *   *Model Comparison:* Bayes Factors ($p(y | M_1) / p(y | M_2)$) or ELPD (Expected Log Pointwise Predictive Density).

      *   *Translation:* In Stan, I write a model *after* seeing the data (often). I condition on `y`. If I treat `y` as fixed and known (probability 1), how does the marginal likelihood $p(y|M)$ distinguish between models? Actually, in ProbProg, $p(y|M)$ is *not* 1. It's the integral of likelihood $\times$ prior. The philosophical problem assumes $P(E)=1$ *before* the hypothesis is considered. In ProbProg, $P(y|M)$ is the probability of generating *this specific* `y` under the generative process defined by `M`.

      *   *The Real Issue in ProbProg:* It's not about $P(E)=1$. It's about *double counting* or *tuning*. If I look at `y`, then build `M` to fit `y`, then evaluate `M` on `y`, I'm overfitting. This is the "Garden of Forking Paths" or "Researcher Degrees of Freedom."
      *   *Philosophical PoOE vs. DS Overfitting:* The philosophical problem is about *confirmation* (does $E$ support $H$?). The DS problem is about *generalization* (will $H$ predict new $y$?).
      *   *Key Distinction:* Philosophers worry about $P(E)$ being 1 logically. Data Scientists worry about $P(E|M)$ being artificially inflated by model selection bias.

  4.  **Drafting the Explanation (The "Stan Model Debugging" Analogy):**
      *   Imagine you have a dataset `y` (Mercury's orbit).
      *   You write Model A (Newton). It fits okay.
      *   You write Model B (Einstein). It fits better.
      *   Philosophical PoOE: "But you saw `y` before you wrote Model B! So `y` shouldn't update your belief in Model B."
      *   ProbProg Reality: We calculate $p(y | M_B)$. This is the marginal likelihood. It penalizes complexity. If $M_B$ was *constructed* specifically to hit `y` (tuning priors/structure based on `y`), the nominal $p(y | M_B)$ is invalid because the model structure itself is now conditional on `y`.
      *   Solution: Cross-validation (LOO-CV). Treat `y` as if it were new.

  5.  **Developing the Residue Report:**
      *   *Clean Maps:* Likelihood functions, Marginal Likelihood (Bayes Factors), Overfitting/Regularization.
      *   *Stretches:* The concept of "Logical Omniscience." Stan doesn't know math truths; it runs HMC. Philosophers assume agents know all logical consequences of their priors immediately.
      *   *No Counterpart:* The normative question of "Confirmation." DS cares about prediction/utility. Philosophers care about "Truth" or "Rational Belief."
      *   *Does it dissolve?* Mostly. In predictive modeling, old evidence is just training data. The danger is overfitting, handled by regularization/CV. In causal inference or theory testing, it's trickier (model specification search).

  6.  **Addressing Confidence and Uncertainty:**
      *   Need to explicitly state confidence levels (High, Medium, Low).
      *   Need to identify the *one* point of least certainty.
      *   *Candidate for uncertainty:* The precise mapping of "Logical Omniscience" to "Model Specification Search." Is it exactly the same? Or is there a subtle difference about *computational* vs. *logical* limits? I'll flag the mapping of "logical implication" to "model code" as the uncertain part.

  7.  **Refining the Tone:**
      *   Professional, peer-to-peer (Data Scientist to Data Scientist).
      *   Avoid philosophical jargon unless translated.
      *   Be honest about limitations.

  8.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I explain *why* $P(E)=1$ is the issue? Yes, because Bayes rule requires $P(E) < 1$ for updating.
      *   *Check:* Did I connect this to Stan? Yes, via marginal likelihood and model building workflow.
      *   *Check:* Is the distinction between *confirmation* and *prediction* clear? This is crucial. Philosophers want to know if GR is *true* given Mercury. DS wants to know if GR predicts *new* planets.
      *   *Correction:* Make sure to mention that in ProbProg, we usually *don't* treat $P(y)=1$. We treat $y$ as a realization of a random variable. The philosophical problem assumes a subjective Bayesian view where known facts have probability 1. In generative modeling, data is always a random realization. This is a fundamental mismatch.

  9.  **Final Polish:**
      *   Structure: Intro -> Translation -> The "Stan Debug" Scenario -> Residue Report -> Confidence Flags.
      *   Ensure the "Least Certain" point is clearly highlighted.

  **(Self-Correction on Confidence):** I need to be careful not to sound *too* confident about the dissolution of the problem. Some philosophers argue predictive success isn't the only goal. I should acknowledge that.

  **(Final Plan):**
  1.  **Translate:** PoOE = Conditioning on data used to specify the model.
  2.  **Scenario:** You tweak `model {}` block after looking at `y`.
  3.  **Residue:** Map "Logical Omniscience" to "Model Search Space."
  4.  **Verdict:** It dissolves for prediction, persists for theory confirmation.
  5.  **Confidence:** High on technical mapping, Medium on philosophical equivalence.
  6.  **Uncertainty:** The exact status of "logical implication" in code.

