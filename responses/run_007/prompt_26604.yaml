answer: |-
  Commitment (3) needs the most rethinking. You cannot consistently hold that consciousness is a "user illusion" (1) while simultaneously treating first-person phenomenology as the "most reliable source of data" about the nature of consciousness.

  Here is the breakdown of the tensions and the cheapest revision to make your character's worldview coherent.

  ### The Core Conflict: (1) vs. (3)
  This is the severe tension. 
  *   **(1) says:** Experience is a simplified interface designed to hide complexity. Like a desktop icon, it tells you what you can *do* with a file, not what the file *is*.
  *   **(3) says:** Experience is the best guide to what consciousness *is*.

  If your character believes (1), they must believe that phenomenology is systematically misleading about the underlying reality. If I feel like a unified self sitting behind my eyes, and (1) says that is a schematic model, then phenomenology is lying to me about the metaphysics. You can keep (3) only if you downgrade its claim: Phenomenology is the primary data *about the interface*, not the *machine*. It is incorrigible (you can't be wrong that you *seem* to see red) but not informative (it tells you nothing about what "seeing red" physically is).

  **The Fix:** Change (3) from "Phenomenology is reliable data about consciousness" to "Phenomenology is the *target* of explanation, not the *judge* of it." Your neuroscientist character should argue that introspection is a tool evolved for social coordination, not metaphysical insight. It tells us what the brain *wants us to know*, not what the brain *is doing*.

  ### The Secondary Conflict: (1) vs. (4)
  This tension dissolves if you fix (3), but it needs explicit handling.
  *   **(4) says:** The conscious/unconscious distinction is real and not just about reportability.
  *   **(1) implies:** The distinction is functional (information global access vs. modular processing).

  Most illusionists (Dennett, Frankish) argue the distinction *is* essentially about access/reportability. If you hold (1), claiming there is a magical "ontological" difference between conscious and unconscious states undermines the illusionist project. 
  **The Fix:** Your character should argue the distinction is "real" in the same way the distinction between "running software" and "stored code" is real. It's a functional difference with massive consequences, not a difference in substance. There isn't a "light" that turns on; there is a broadcast signal that reaches different departments. This preserves the reality of the distinction without violating (1).

  ### The Easy Fit: (5) and (6)
  *   **(5)** is your safety valve. It correctly identifies that "illusion" means "misleading representation," not "non-existent." Pain is real; the feeling that pain is a simple, unanalyzable quality is the illusion. This pairs perfectly with the revised (3).
  *   **(6)** follows naturally. If the self is a narrative construct (2) and consciousness is a model (1), then "will" is just the model's label for the outcome of competing subsystems. No tension here.

  ### How to Write the Character
  To get the texture right, your neuroscientist shouldn't sound like they're denying experience exists. They should sound like they're denying experience is *transparent*.

  *   **Bad Texture:** "Pain isn't real, it's just an illusion." (Contradicts 5, sounds dismissive).
  *   **Good Texture:** "Pain is real data, but it's formatted data. It feels like a simple quality because the brain doesn't have the bandwidth to show you the nociceptive processing. You're seeing the icon, not the code."

  **Bottom Line:** Keep (1), (2), (5), and (6). Revise (3) to treat phenomenology as the *interface* rather than the *oracle*, and revise (4) to treat the conscious/unconscious boundary as *functional* rather than *ontological*. This keeps the hard neuroscience vibe without collapsing into contradiction.
