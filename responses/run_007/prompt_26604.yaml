      *   *Phenomenological Primacy (3)* says "what it's like" is the data. If the theory says "you don't actually feel pain, you just model yourself as feeling pain," (3) says "But I *do* feel pain!"
      *   *Real Distinction (4)* says there's a hard line between conscious and unconscious states. Illusionism often tends toward eliminativism or deflationism where the distinction is functional (access) rather than ontological (presence of experience).
      *   *The Conflict:* If consciousness is an *illusion* (a misrepresentation), then first-person phenomenology is *systematically misleading* about the nature of reality. (3) says phenomenology is the *most reliable* data. If phenomenology tells me "I am a unified self experiencing qualia directly," and (1)/(2) say "You are not unified and qualia are user-interface icons," then phenomenology is unreliable about the metaphysics.
      *   *Severity:* High. This is the classic "Hard Problem" vs. "Illusionism" fight. Keith Frankish (illusionist) vs. David Chalmers (realist).
