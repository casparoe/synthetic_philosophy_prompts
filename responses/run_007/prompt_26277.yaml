answer: |-
  Here is a teaching plan designed to pivot the group from "puzzle-solving" to "structural analysis" within 45 minutes.

  ### 1. The Sequence (45 Minutes)

  **0:00–0:05: The Trap (Establish the Baseline)**
  *   **Action:** Project **Bongard Problem #4** (Left: Triangles, Right: Circles).
  *   **Ask:** "How would a standard ResNet solve this?"
  *   **Goal:** Let the ML students answer confidently ("Easy, convolutional filters detect edges/curvature"). Let the philosophers nod.
  *   **Point:** Establish that *if* the feature space is aligned with the rule, this is trivial supervised learning. This validates their current intuition so you can dismantle it.

  **0:05–0:15: The Wall (The Carrying Example)**
  *   **Action:** Project **Bongard Problem #49** (The "Necktie" Problem).
      *   *Description:* Left side: Shapes that have a "constriction" or "neck" (like an hourglass or a bowtie). Right side: Shapes that do not (ellipses, rectangles, convex polygons).
  *   **Activity:** Do not let them solve it verbally. Ask the ML students: "Write the pseudo-code for the feature extractor."
  *   **Goal:** They will struggle to define "neck" in terms of pixels or fixed kernels. A "neck" is a *relational* property of the boundary (width function has a local minimum between two maxima). It requires segmenting the object, computing a skeleton or width profile, and analyzing that profile.
  *   **Point:** This is not a classification problem; it is a **representation learning** problem. The "features" do not exist until you construct a vocabulary to describe them.

  **0:15–0:30: The Deep Dive (Vocabulary vs. Data)**
  *   **Discussion:** Shift from "solving" to "modeling."
  *   **Key Argument:** Standard ML assumes a fixed input space $X$. Bongard problems require constructing $X$ *per problem*.
  *   **ML Hook:** Connect this to **Inductive Bias**. A CNN has a bias toward translation invariance and local correlations. It has *no* bias toward topological constrictions or "inside-ness." To solve BP #49, you don't need more data; you need a different *language* (e.g., a symbolic geometry engine or a graph neural network over superpixels).
  *   **Phil Hook:** Connect this to **Rule Following**. The rule isn't "hidden" in the pixels; it is imposed by the observer's ontology. Why do we all agree on "neck"? Because we share a cognitive vocabulary of physical objects.

  **0:30–0:40: Interdisciplinary Synthesis**
  *   **Action:** Bring in the CogSci postdoc here.
  *   **Topic:** **Analogy as Search.** Hofstadter's point in GEB is that solving Bongard problems is about finding a description level where the two sides become analogous.
  *   **Prompt:** "Is the rule 'has a neck' or 'is non-convex'?" (BP #49 allows both). Why do humans prefer "neck"? (It's more causal/physical).
  *   **Goal:** Show that the "hardness" is in the *search for the description language*, not the optimization of weights.

  **0:40–0:45: Assessment & Close**
  *   **Action:** Pose the Assessment Question (see below).
  *   **Goal:** Verify they understand the representation bottleneck.

  ---

  ### 2. The Carrying Example: Why BP #49?

  You need a problem that satisfies three criteria to work as the anchor:
  1.  **Visually Simple:** No noise, no complex textures. (Prevents ML from blaming "image quality").
  2.  **Semantically Rich:** The rule requires a noun/verb ("neck," "constriction," "pinch") rather than an adjective ("red," "large").
  3.  **Computationally Specific:** It cannot be solved by simple moment invariants or Fourier descriptors without significant engineering.

  **Why BP #49 works:**
  *   **For ML:** It breaks the "more data" fallacy. You could train a CNN on 10 million shapes; if "constriction" isn't in the architectural prior, it won't learn it efficiently from 6 examples. It forces them to admit they need *symbolic priors*.
  *   **For Philosophy:** It avoids the "subjectivity" trap. Unlike "Left looks happy," "neck" is geometrically definable, yet it is still a *concept* imposed on the geometry. It bridges the gap between raw sense data and structured knowledge.

  **Backup Option:** **BP #76** (Left: Arrows pointing *at* the dot; Right: Arrows pointing *away*). This is good for relational reasoning, but BP #49 is better for the "feature construction" argument.

  ---

  ### 3. The Misconception Map

  | Audience | Default Misconception | The Head-Off (When & How) |
  | :--- | :--- | :--- |
  | **ML Grads** | *"This is just Few-Shot / Meta-Learning. We train a model on many Bongard tasks to learn the prior."* | **When:** During the "Wall" phase (0:15). <br>**How:** "Meta-learning assumes a shared embedding space across tasks. In BP #49 vs BP #1, the embedding spaces are incommensurate. One requires curvature histograms; the other requires topological width functions. You aren't learning weights; you're writing code." |
  | **Philosophers** | *"The rule is underdetermined (Quine). Any pattern can be fit if you get abstract enough."* | **When:** During Synthesis (0:30). <br>**How:** "Agreed, logically underdetermined. But cognitively, it isn't. Humans converge on 'neck' instantly, not 'has 473 pixels.' The challenge isn't logical possibility; it's *search space constraint*. Why is our search space so small?" |
  | **CogSci** | *"It's about perception vs. cognition."* | **When:** Throughout. <br>**How:** Validate this. Use them to bridge the gap. "Exactly. At what point does the pixel become a 'shape'? Bongard problems live in that transition zone." |
  | **Everyone** | *"Hofstadter solved this with Copycat."* | **When:** Closing. <br>**How:** "Copycat was a proof of concept for microworlds. Scaling that architecture to open-ended vision is still an unsolved problem (see: neuro-symbolic AI struggles today)." |

  ---

  ### 4. Scope Boundaries: "We Are Not Settling This"

  To keep the session on time, explicitly bracket these two topics at the start (0:02):

  1.  **We are not solving AGI:** Acknowledge that Bongard problems are a "toy" domain. The goal isn't to build a Bongard-solver, but to use them as a probe for how *concept acquisition* works.
  2.  **We are not defining 'Meaning':** Philosophers may want to debate semantics. Gently steer them toward *operationalization*. "We aren't asking what 'neck' means metaphysically, but what computational machinery is required to detect it reliably from 6 examples."

  ---

  ### 5. The Assessment Question

  Do not ask "Did you understand?" or "Can you solve another one?"

  **Ask this at 0:42:**

  > "If you were forced to solve BP #49 using a standard Deep Learning pipeline, what is the **minimal architectural change** required? If your answer is 'more layers' or 'more data,' you've missed the point. What specific *inductive bias* is missing?"

  **What you're listening for:**
  *   **Superficial understanding:** "We need attention mechanisms." (Vague, but okay).
  *   **Deep understanding:** "We need a module that converts raster images into a graph or skeletal representation *before* classification. We need to move from pixel-space to object-property space."
  *   **The Ideal Answer:** "The model needs a symbolic interface. It needs to be able to propose and test hypotheses about geometric relations (like 'width') that aren't present in the raw input tensor."

  This question forces the ML students to admit that their tools are insufficient without structural changes, and it forces the Philosophers to acknowledge that "concepts" require specific computational machinery to be realized.
