prompt: |-
  I'm leading a session for our interdisciplinary reading group next week and I'm a bit nervous about it. The group is mostly ML grad students with a couple philosophers and one cognitive science postdoc mixed in. The topic is Bongard problems — those little grids where you get six boxes on the left, six on the right, and you have to figure out the rule that separates them. The group read the Hofstadter chapter from Gödel, Escher, Bach but that's it, so they basically think of Bongard problems as charming brain-teasers rather than as a genuine challenge to theories of induction and concept learning.

  I've got about forty-five minutes and I want them to come away understanding why Bongard problems are philosophically and computationally deep — specifically, why inducing a concept from half a dozen positive and negative examples is a hard problem in a way that isn't just "well you need more data." I don't need you to explain Bongard problems to me; I need a teaching plan.

  What has to come first in the session? What depends on what? Which one or two specific Bongard problems should carry the whole thing, and what features do they need to have (and lack) to work as the carrying example? I need a misconception map: what will the ML people default to ("isn't this just few-shot classification?") and where do I head that off, what will the philosophers get stuck on ("but what even is a concept?") and when do I defuse that, and are there misconceptions I'm not anticipating? What should I openly say "we're not going to settle this today" about? And what's the one question I can ask at the end that will actually tell me whether they understood the depth of the problem rather than just enjoyed the puzzles?
