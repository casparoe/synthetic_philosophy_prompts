      This premise assumes that if values are commensurable (on a single scale), they must satisfy the Archimedean property (any finite amount of $X$ can be outweighed by enough $Y$). In mathematics, this is true for real numbers ($\mathbb{R}$), but false for lexicographic orderings or hyperreal numbers. If value is structured like a tuple $(suffering, pleasure)$ where the first element is prioritised, it is a single scale but non-Archimedean.
      *Cost:* Requires adopting a non-standard value structure, but this is precisely what lexical views propose.

  2.  **Premise (5): The Rationality Requirement.**
      This premise assumes that without a common unit (incommensurability), rational trade-offs are impossible. However, one can have rational decision rules (e.g., 'lexically prioritise avoiding torture') without a precise exchange rate. Philosophers like Ruth Chang argue for 'rational choice without comparability'.
      *Cost:* Requires a nuanced theory of practical rationality that decouples rationality from maximisation of a single metric.

  3.  **Equivocation on 'Commensurable'.**
      The term might mean 'comparable within a unified framework' in (2) but 'measurable by a single real-valued unit' in (5). If the meaning shifts, the contradiction is linguistic rather than logical.
      *Cost:* Requires careful terminological stipulation to avoid future confusion.

  ### Diagnosis: The Error in Premise (2)

  The argument fails at **Premise (2)**.

  The premise states: *"If they are commensurable, then they sit on a single scale with a common unit, and on such a scale any finite amount of pain can be outweighed by some sufficiently large amount of pleasure."*

  The first clause is a reasonable definition of commensurability. The second clause, however, asserts the **Archimedean property** as a necessary feature of any such scale. This is mathematically false. One can define a unified ordering (a single scale) that is non-Archimedean. In decision theory, this is often modelled using lexicographic preferences or vector-valued utility functions. For example, if utility $U$ is an ordered pair $(S, P)$ representing suffering and pleasure, we can define $(S_1, P_1) > (S_2, P_2)$ if $S_1 < S_2$ (less suffering is better), or if $S_1 = S_2$ and $P_1 > P_2$. This is a single, coherent scale, but no amount of $P$ can outweigh an increase in $S$.

  By rejecting (2), you block the inference to (4). You can maintain that pleasure and pain are commensurable (they belong to the same axiological framework) without accepting that they are trade-offable in an Archimedean sense. This preserves your intuition (3) without forcing you into incommensurability. Consequently, Premise (5) never triggers, and the contradiction dissolves.

  ### The Status of Lexical Threshold Negative Utilitarianism

  Lexical Threshold Negative Utilitarianism (LTNU) is one of the positions left standing after this repair. In fact, LTNU is precisely the view that rejects Premise (2). It posits a unified moral framework (commensurability in the broad sense) that incorporates a lexical threshold (non-Archimedean structure).

  By formalising LTNU as a non-Archimedean utility function, you avoid the contradiction. You can say that below the threshold, trade-offs are permissible (satisfying intuition 6), but above the threshold, the lexical priority of suffering prohibits trade-offs (satisfying intuition 3). The 'common unit' is not a single real number, but a structured value type that respects the lexical ordering.

  ### Costs of Alternative Repairs

  You asked to consider the cost of alternative diagnoses.

  *   **Rejecting Premise (5):** If you accept (2) and (4), you must reject (5). This means accepting that pleasure and pain are incommensurable (no common unit) but insisting that rational trade-offs are still possible via rules rather than metrics.
      *   *Cost:* This fragments the value ontology. It suggests there is no fact of the matter about the 'value' of an outcome, only rules for choosing. While defensible (e.g., by particularists), it makes formal modelling difficult and undermines the utilitarian aim of a unified calculus.
  *   **Rejecting Premise (3):** This saves standard Archimedean utilitarianism.
      *   *Cost:* You lose the core moral intuition that motivates suffering-focused ethics. As you noted, this feels like changing the subject.
  *   **Rejecting Premise (6):** This leads to a form of moral absolutism or paralysis.
      *   *Cost:* It implies everyday risk-taking (like driving) is irrational, which is practically untenable.

  ### Conclusion

  The mistake lies in assuming that a unified value scale must behave like the real number line. By recognising that value structures can be non-Archimedean, you preserve both the possibility of a unified theory and the lexical priority of severe suffering. LTNU survives this repair intact, provided it is formalised using a non-Archimedean ordering.

  \answer{Premise (2)}
