answer: |-
  You have identified a sophisticated and pervasive rhetorical pattern. To answer your first question directly: **No, there is no single, canonical term in logic or ethics that exclusively names this specific move.**

  However, it is a recognized phenomenon that sits at the intersection of several existing concepts. It is most frequently discussed under the umbrellas of **equivocation**, **special pleading**, or the **Motte-and-Bailey fallacy**, but as you correctly noted, none of these capture the precise *conceptual* dynamic of sliding between a scalar and a binary conception of the same property.

  Below is an analysis of why existing terms fall short, a proposed coinage for the specific move you describe, and a breakdown of how a careful philosophical view distinguishes this fallacy from legitimate threshold reasoning.

  ### 1. Why Existing Terms Are Insufficient

  *   **Equivocation:** This is the closest standard logical fallacy. Equivocation occurs when a key term is used in two different senses. However, standard equivocation usually implies two *unrelated* or *distinct* meanings (e.g., "bank" of a river vs. "bank" for money). In your example, the two senses (graded sentience vs. binary sentience) are systematically related. The arguer isn't using two different words; they are exploiting the relationship between a *property* (which can be graded) and a *classification* (which is often binary).
  *   **The Sorites Paradox:** The Sorites problem highlights the difficulty of drawing a line on a continuum (e.g., "when does a heap of sand become a heap?"). Your observation is not about the *difficulty* of drawing the line, but the *strategic relocation* of the line (or the nature of the line itself) to suit a desired conclusion.
  *   **Special Pleading:** This describes applying standards differently to different cases without justification. This captures the *normative* inconsistency (shrimp get the benefit of the doubt, thermostats do not), but it doesn't capture the *conceptual* mechanism (switching between scalar and binary models).
  *   **Motte-and-Bailey:** This is the strongest structural analog. In a Motte-and-Bailey, an arguer retreats to a defensible position (the Motte) when challenged and advances to a controversial position (the Bailey) when unchallenged. Here, the "graded" view often serves as the Motte (it is hard to deny shrimp feel *something*), while the "binary" view serves as the Bailey (thermostats feel *nothing*). However, Motte-and-Bailey describes a defensive retreat, whereas your observation describes an offensive switch depending on the target.

  ### 2. A Proposed Coinage: "Strategic Scalar-Binary Oscillation"

  Since no precise term exists, I propose the term **"Strategic Scalar-Binary Oscillation"** (or colloquially, **"The Scalar-Threshold Slide"**).

  **Definition:**
  > The **Scalar-Threshold Slide** is a rhetorical move in which an arguer treats a property as a **continuum** (scalar) to argue for the inclusion of marginal cases within a category, but treats the same property as a **binary threshold** (categorical) to argue for the exclusion of other cases, without providing a principled justification for the shift in conceptual framework.

  **Distinguishing Features:**
  1.  **Systematic Relation:** Unlike simple equivocation, the two modes (scalar and binary) are logically related (thresholds are derived from scalars). This makes the slide harder to detect.
  2.  **Directional Utility:** The scalar mode is deployed to *minimize* the distance between the subject and the category (shrimp are "a little bit" sentient). The binary mode is deployed to *maximize* the distance between the subject and the category (thermostats are "not at all" sentient).
  3.  **Concealed Arbitrariness:** The move conceals the arbitrariness of the threshold location by denying the threshold exists when it is inconvenient and asserting it does exist when it is convenient.

  ### 3. The Legitimate Counterpart: "Principled Thresholding"

  You asked what a careful view would say about the relationship between graded properties and binary thresholds. It is **not** fallacious to believe that a graded property underlies a binary moral status. In fact, this is the standard view in many ethical frameworks.

  For example:
  *   **Temperature** is a continuous scalar property.
  *   **Boiling** is a binary state (at a given pressure).
  *   It is not fallacious to say water at 99°C is "almost boiling" (scalar) while simultaneously saying water at 50°C is "not boiling" (binary).

  This legitimate position can be called **"Principled Thresholding."** It acknowledges that while the *basis* for moral status (sentience, rationality, etc.) may be graded, the *assignment* of moral status often requires a threshold for practical or normative reasons.

  ### 4. Conditions for Legitimacy: Avoiding the Slide

  To move between the graded notion and the threshold notion without committing the **Scalar-Threshold Slide**, an arguer must satisfy three conditions. If these are not met, the move is fallacious.

  **A. The Bridge Principle (Justification)**
  The arguer must explicitly state *why* a specific point on the continuum triggers the binary threshold.
  *   *Fallacious:* "Shrimp feel a little pain, so they count. Thermostats don't feel pain, so they don't." (Implicitly moves the threshold without saying where it is).
  *   *Legitimate:* "Sentience is graded, but moral standing requires the capacity for *suffering*. We locate the threshold at the presence of a central nervous system capable of negative valence. Shrimp meet this; thermostats do not."

  **B. Consistency of Application**
  The threshold must be applied consistently across all cases, not just convenient ones.
  *   *Fallacious:* Using the scalar argument to include shrimp, but using the binary argument to exclude bees, without explaining the difference between shrimp and bees.
  *   *Legitimate:* If the threshold is "neural complexity X," then any being above X is included, and any being below X is excluded, regardless of whether the arguer likes the outcome.

  **C. Transparency of Mode**
  The arguer must acknowledge when they are speaking ontologically (about the property itself) versus normatively (about the moral category).
  *   *Fallacious:* Blurring the distinction to make the threshold seem natural rather than chosen.
  *   *Legitimate:* "Ontologically, sentience is a gradient. Normatively, we must draw a line. Here is where we draw it and why."

  ### Summary

  The move you have identified is a specific, high-functioning form of **equivocation** facilitated by **vagueness**, best described as the **Scalar-Threshold Slide**.

  It is distinct from the **Sorites Paradox** because it is not about the impossibility of drawing a line, but the strategic manipulation of the line's nature. It is distinct from **Simple Equivocation** because the two senses are functionally linked.

  A careful view accepts that **graded properties can justify binary thresholds** (Principled Thresholding), but demands that the location of the threshold be **explicit, justified, and consistently applied**. When an arguer treats the threshold as fluid—dissolving it to let allies in and solidifying it to keep enemies out—they are committing the Scalar-Threshold Slide.
