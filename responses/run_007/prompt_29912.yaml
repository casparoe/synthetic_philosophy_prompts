      *   *The Conflict:* The majority says "A is true" and "B is true," but the majority also says "We should not do P (even though P requires A and B)."
      *   *Why:* The majorities are formed by *different coalitions*. The "Yes on A" majority is not the same group of people as the "Yes on B" majority. The intersection of those two majorities (the people who said Yes to *both*) is a minority.

  4.  **Differentiate from Condorcet/Standard Paradoxes:**
      *   Condorcet: Intransitive preferences (A > B > C > A).
      *   Discursive Dilemma: Inconsistent judgments on logically connected propositions (A, B, therefore C).
      *   Key difference: It's about *logic* and *consistency* of beliefs/judgments, not just *preferences* over outcomes. It highlights the tension between "premise-based" vs. "conclusion-based" voting.

  5.  **Address the "Is it a bad idea?" Question:**
