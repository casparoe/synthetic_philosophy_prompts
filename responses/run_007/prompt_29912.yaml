      *   *Implication:* Voting on conditions separately creates the risk of the paradox. Voting on the final proposal avoids the logical inconsistency but might obscure *why* the decision was made.
      *   *Advice:* Depends on the goal. If logical integrity matters (like a court ruling), use premise-based. If democratic will on the specific action matters, use conclusion-based. In student council, usually, the action matters most, so voting on the proposal directly is safer, perhaps with a non-binding straw poll on conditions.

