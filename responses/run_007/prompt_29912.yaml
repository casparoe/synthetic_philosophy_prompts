answer: |-
  This is a classic problem in social choice theory. The specific name for what you are experiencing is the **Discursive Dilemma** (sometimes also called the **Doctrinal Paradox**).

  It was formally identified by legal scholars Lewis Kornhauser and Lawrence Sager in the 1980s and later popularized by philosopher Philip Pettit. You are correct that it is distinct from the Condorcet paradox, though they are cousins in the family of voting theory problems.

  Here is a breakdown of exactly what is going on, why it differs from standard preference cycling, and what it implies for your student council procedures.

  ### 1. What is going on? (The Mechanism)

  You described the situation perfectly: every individual is logically consistent, but the *group* is logically inconsistent.

  To see the mechanics clearly, let's reconstruct the three voters in your scenario (let's call them Alice, Bob, and Charlie) based on the vote counts you provided.

  *   **The Rule:** Hold Dance = (Good Forecast) **AND** (Permission).
  *   **Voter 1 (Alice):** Votes **Yes** on Forecast, **Yes** on Permission. Therefore, she votes **Yes** on the Dance.
  *   **Voter 2 (Bob):** Votes **Yes** on Forecast, **No** on Permission. Therefore, he votes **No** on the Dance.
  *   **Voter 3 (Charlie):** Votes **No** on Forecast, **Yes** on Permission. Therefore, he votes **No** on the Dance.

  Now, look at the majorities:
  *   **Forecast:** Alice (Yes) + Bob (Yes) = **2–1 Pass.**
  *   **Permission:** Alice (Yes) + Charlie (Yes) = **2–1 Pass.**
  *   **The Dance:** Alice (Yes) vs. Bob & Charlie (No) = **1–2 Fail.**

  **The Paradox:** The majority believes the forecast is good. The majority believes permission is granted. But the majority rejects the dance, even though the dance is defined as the conjunction of those two beliefs.

  **Why this happens:** The "Majority" is not a stable bloc of people. It is a shifting coalition. The group that forms the majority for Condition A is different from the group that forms the majority for Condition B. The only person who belongs to *both* majorities (Alice) is outnumbered by the people who belong to only one or neither.

  In technical terms, this is a failure of **Judgment Aggregation**. You are aggregating binary judgments (True/False) on logically connected propositions, rather than aggregating rankings of options.

  ### 2. How is this different from the Condorcet Paradox?

  You were right to sense a difference.

  *   **The Condorcet Paradox** is about **Preferences**. It occurs when Group Preference is intransitive (e.g., The group prefers A over B, B over C, but C over A). It shows that majority rule can produce a cycle where there is no clear winner.
  *   **The Discursive Dilemma** is about **Logic and Consistency**. It occurs when the group's accepted premises contradict the group's accepted conclusion. The group simultaneously affirms $P$, affirms $Q$, but rejects $P \land Q$.

  In the Condorcet case, the problem is that "the will of the people" is undefined because it cycles. In the Discursive Dilemma, "the will of the people" is defined, but it is **irrational**. The group holds a set of beliefs that cannot all be true at the same time.

  ### 3. Is voting on conditions separately a bad idea?

  This is the normative question. In political science and law, this creates a choice between two procedures:

  1.  **Premise-Based Procedure:** You vote on the conditions (Forecast, Permission) and then *derive* the outcome logically. (If both pass, the dance happens).
  2.  **Conclusion-Based Procedure:** You vote directly on the outcome (The Dance) and ignore the separate votes on conditions.

  **The Trade-off:**
  *   **If you use the Premise-Based procedure:** You guarantee logical consistency. However, you might enact a proposal that a majority of the council actually opposes (as happened in your story: the majority voted No on the dance, but the logic would force it to happen). This feels undemocratic regarding the final outcome.
  *   **If you use the Conclusion-Based procedure:** You respect the majority's will on the final action. However, you lose accountability for the *reasons*. If the dance fails, was it because of the weather or the permission? You won't have an official record of the group's judgment on the specific conditions.

  **Is it a "bad idea"?**
  For a student council, voting on conditions separately *as binding votes* is risky because it invites the Discursive Dilemma. It can lead to a situation where you are logically forced to execute a plan that most council members oppose.

  **Recommendations for your Council:**

  1.  **Make Condition Votes Advisory:** Vote on the conditions to gauge feasibility, but make the vote on the **Proposal** the only binding one. If the conditions pass but the proposal fails, the proposal fails. This prioritizes the Conclusion-Based procedure, which is usually safer for democratic bodies.
  2.  **Require a Conjunctive Majority:** If you want to keep the condition votes binding, change the rule for the final vote. The proposal should pass only if it gets a majority **AND** both conditions got a majority. This prevents the inconsistency, though it sets a higher bar for passing things.
  3.  **Single Ballot:** Instead of three separate votes, have members vote on the proposal with the understanding that they are certifying the conditions are met. Or, use a ranked-choice style ballot where they approve the proposal *contingent* on conditions.

  ### Summary
  You have discovered the **Discursive Dilemma**. It happens because majority rule preserves the will of the majority on individual issues but does not preserve logical consistency across issues.

  It doesn't mean your council members are confused; it means the voting system you used to aggregate their logic is flawed. For most student organizations, the safest fix is to treat the condition votes as "straw polls" and let the final vote on the proposal be the only one that counts.
