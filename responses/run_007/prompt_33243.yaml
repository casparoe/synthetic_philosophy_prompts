      *   *Core Concept:* Existence precedes essence. There is no God/no human nature to dictate what we should be. We are thrown into existence and must choose who to become.
      *   *The "Condemned" part:* We didn't ask to be born, we can't *not* choose (even not choosing is a choice), and we are fully responsible for the meaning we give our lives.
