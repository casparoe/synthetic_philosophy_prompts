prompt: |-
  So my mate Dave and I got into this massive argument last night — went on for like three hours — about whether people in genuinely awful circumstances can still be blamed for how their lives turn out. He's been going through a bit of a self-help phase and kept throwing this phrase at me: "we are condemned to be free." Every time I pointed out that someone grew up in poverty or had abusive parents or whatever, he'd just shrug and say "condemned to be free, mate — Sartre was right, you always have a choice." When I said that felt a bit rich to deploy against someone who can't afford rent, he accused me of stripping people of their agency and treating them like objects.

  I've heard the phrase before and I know it's existentialism, but I've never sat down and worked out what it's actually supposed to mean. It seems like it could be saying radically different things depending on how you unpack it — like, is it a metaphysical claim about human nature (we have no fixed essence), a claim about moral responsibility (you can't blame your background), a psychological observation about how we experience decision-making, or what? Some of those readings seem almost trivially true while others feel properly unhinged.

  Could you lay out the distinct precise claims "we are condemned to be free" might be expressing, from the mildest to the most extreme, and say for each one whether it's actually defensible and whether it would support the way Dave was using it — namely, to pin full moral responsibility on people regardless of their circumstances? And please write the whole thing in British English, Dave's from Manchester and I'm planning to forward it to him.
