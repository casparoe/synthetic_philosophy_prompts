answer: |-
  You have a very sharp instinct here. You are correctly identifying one of the most famous and controversial logical moves in the history of economic methodology. This passage is the engine room of Friedman's essay, where he sets up what is often called the **"F-Twist"** (the claim that the *more* significant a theory, the *more* unrealistic its assumptions).

  To answer your specific questions: Friedman is attempting to make the **strong claim** (predictive success is the *only* legitimate criterion), but he tries to get there by proving the **weaker claim** (realism is too vague to be independent). You are right to feel a "slide" occurring. Whether that slide is justified is the central debate of 20th-century philosophy of economics.

  Here is a breakdown of the move, the gap, and whether the critics survive.

  ### 1. The Move: Reducing "Realism" to "Predictive Relevance"

  Friedman is not just arguing that "complete realism is impossible" (the straw man). He is making a more aggressive epistemological point: **There is no such thing as "realism of assumptions" independent of predictive success.**

  Look closely at this sentence:
  > *"What is the criterion by which to judge whether a particular departure from realism is or is not acceptable?"*

  Friedman argues that if you look at assumptions in isolation (descriptively), you cannot distinguish between "neglecting costs" and "neglecting eye color." Both are factually false simplifications. The *only* way to know that costs matter and eye color doesn't is to see which omission causes the theory to fail empirically.

  Therefore, he concludes:
  > *"Even the most extreme proponents of realistic assumptions are thus necessarily driven to reject their own criterion and to accept the test by prediction..."*

  **The Logic:**
  1.  To judge an assumption as "unrealistic in a bad way," you must show it matters.
  2.  To show it matters, you must show it affects the match between theory and data.
  3.  Therefore, judging assumptions is actually just judging predictions.
  4.  Therefore, prediction is the only ultimate criterion.

  ### 2. The Slide: Is it Justified or a Gap?

  You asked if he slides from "realism is vague" to "prediction is the only criterion." **Yes, he does.**

  **The Weak Claim:** "Realism" is not an *independent* test. You can't look at an assumption and say "this is false" without reference to the theory's performance.
  **The Strong Claim:** Therefore, we should not care about the realism of assumptions *at all*, only the accuracy of predictions.

  **The Gap:**
  The gap lies in the definition of scientific purpose. Friedman is an **Instrumentalist**. He views theories as tools (like a map) designed to solve problems (prediction).
  *   **Friedman's View:** A map is "good" if it gets you to the destination. It doesn't matter if the map distorts the shape of the continent (unrealistic assumption) as long as the turn-by-turn directions (predictions) work.
  *   **The Critic's View (Scientific Realism):** A theory is also supposed to *explain* how the world works. If a theory predicts well but relies on false assumptions, it might be a "black box" that works by accident or only in a specific context.

  **Is the slide justified?**
  Most philosophers of science say **no**. Just because prediction is the *test* of whether an assumption is relevant doesn't mean prediction is the *only goal* of science.
  *   **Example:** You could have a theory that predicts stock prices perfectly using the phase of the moon. The assumption ("moon phases drive prices") is unrealistic. Friedman might say, "If it predicts, keep it." A critic would say, "But that doesn't help us understand the economy, and if the relationship breaks, we won't know why."

  Friedman conflates **"How do we verify which assumptions matter?"** (Epistemology) with **"What is the purpose of a theory?"** (Ontology/Teleology). He argues that because we *verify* via prediction, we must *value* only prediction. That is the slide.

  ### 3. Do the Critics' Complaints Survive?

  You asked: *If the critics are forced to fall back on predictive success anyway, does that mean their complaint about unrealistic assumptions was empty all along?*

  **Friedman's Answer:** Yes. He thinks the complaint is empty *as a methodological objection*. He believes critics are just saying "This theory predicts poorly in the long run" but dressing it up as "The assumptions are wrong."

  **How the Critics Survive (The Counter-Argument):**
  The complaint is **not empty** if you care about **policy** or **structural change**. This is where Friedman's argument is most vulnerable.

  1.  **The Lucas Critique (Foreshadowed):** If you want to use a theory to guide policy, you need to know the *deep parameters* (the realistic assumptions). If a theory predicts well only because people's behavior is stable, but you change the policy, the behavior might change. A theory with "realistic" assumptions about human motivation is more robust to policy changes than one that just fits the data.
  2.  **Explanation vs. Forecasting:** If science aims to *explain* phenomena, not just forecast them, then the truth of the assumptions matters. A theory that says "gravity causes apples to fall" is better than "invisible elves push apples down," even if both predict the fall perfectly. We want to know the *mechanism*.
  3.  **External Validity:** A theory with realistic assumptions is more likely to work in *new* environments. A theory based on "hair color" might work in 1950s wheat markets but fail in 2020s futures trading. A theory based on "incentives" (a more realistic assumption) travels better.

  So, the critic can reply to Friedman:
  > "I am not using realism as an *alternative* test to prediction. I am using realism as a **heuristic for long-run predictive stability**. I demand realistic assumptions because I believe theories with false assumptions will eventually fail to predict when the environment changes."

  ### Summary

  *   **The Subtle Move:** Friedman is arguing that "relevance" is indistinguishable from "predictive power." Therefore, any appeal to realism is secretly an appeal to prediction.
  *   **The Slide:** He moves from "You can't judge assumptions independently" to "You shouldn't try to judge assumptions independently." This relies on an Instrumentalist view of science (theories are tools, not truths) that critics do not share.
  *   **The Gap:** He ignores the value of *explanation* and *structural robustness*. A theory can predict well temporarily while being fundamentally wrong about the mechanism.
  *   **Survival of the Critics:** Their complaint survives if they rephrase it. Instead of saying "Unrealistic assumptions are bad," they should say "Theories with unrealistic assumptions are less likely to remain predictive under structural change or policy intervention."

  You sensed a gap because there *is* one. Friedman is brilliantly closing the door on one methodological path (checking assumptions for truth) by claiming it leads nowhere, but he does so by defining "success" exclusively as "prediction," which is the very point in dispute.
