      *   **Causal Decision Theory (CDT):** Focuses on the causal consequences of an action. My £20 won't causally change the outcome (probability-wise). Therefore, CDT might suggest not contributing (free-riding).
      *   **Evidential Decision Theory (EDT):** Focuses on what the action *evidences* about the world. If I contribute, it's evidence that others like me will contribute. If I don't, it's evidence they won't.
      *   **Kantian Categorical Imperative:** Act only according to that maxim whereby you can, at the same time, will that it should become a universal law.
      *   **Rule Utilitarianism:** Follow rules that generally produce good outcomes.

