  **JOINT STATEMENT ON THE ZOMBIE ARGUMENT AND THE STATUS OF PHYSICALISM**

  **Signatories:**
  *   **The Gap Theorist (GT):** Proponent of the Conceivability Argument and the ontological significance of the explanatory gap.
  *   **The Type-B Physicalist (TBP):** Proponent of the Phenomenal Concept Strategy and the a posteriori necessity reply.

  **Date:** October 26, 2023
  **Context:** This document summarizes the results of a twelve-month adversarial collaboration funded by the Templeton Foundation. The goal was not to force consensus but to map the dialectical landscape with maximum precision, isolating substantive disagreements from verbal misunderstandings.

  ***

  ### 1. Substantive Points of Agreement

  We jointly affirm the following claims. We recognize that accepting these claims does not resolve our dispute, but it narrows the field of battle to specific modal and semantic commitments.

  1.  **The Robustness of the Intuition:** Both sides agree that the intuition that a "zombie world" (a world physically identical to ours but lacking conscious experience) is possible is *prima facie* compelling, persistent, and resistant to standard functional or representational analyses. It is not a confusion easily dispelled by pointing out functional isomorphism.
  2.  **The Definition of Physicalism:** We agree that for Physicalism to be true, the physical truths ($P$) must *metaphysically necessitate* the phenomenal truths ($Q$). If there is any metaphysically possible world where $P$ holds and $Q$ does not, Physicalism (as standardly defined) is false.
  3.  **The Structure of the Zombie Argument:** We agree the argument form is valid:
      *   (P1) Zombies are ideally primarily conceivable.
      *   (P2) If zombies are ideally primarily conceivable, then zombies are primarily possible.
      *   (P3) If zombies are primarily possible, then Physicalism is false.
      *   (C) Therefore, Physicalism is false.
      *   *Note:* The GT accepts P1, P2, and P3. The TBP rejects P3 (and potentially P1 under idealization).
  4.  **Two-Dimensional Semantics as a Mapping Tool:** We agree that two-dimensional semantics provides the correct framework for diagnosing the dispute. We agree that expressions have a **Primary Intension** (reference fixed by how the actual world turns out to be) and a **Secondary Intension** (reference fixed across counterfactual worlds given how the actual world is).
  5.  **The Existence of A Posteriori Necessities:** We agree that there are genuine a posteriori necessities (e.g., Water = H₂O). We agree that in these standard Kripkean cases, the identity holds with metaphysical necessity (secondary intension) despite being epistemically contingent (primary intension).
  6.  **The Explanatory Gap is Real (Epistemically):** We agree that there is an *explanatory gap* in Levine's sense. Even if Physicalism is true, we currently lack, and perhaps always will lack, a priori derivations of phenomenal concepts from physical/functional concepts. The dispute is whether this gap is *merely* epistemic/conceptual or whether it tracks an ontological division.
  7.  **Ideal Conceivability entails Primary Possibility:** We agree that *ideal positive conceivability* (what is conceivable upon ideal rational reflection without contradiction) entails **primary possibility** (there is a world considered as actual where the statement is true). The disagreement lies in whether primary possibility threatens Physicalism.
  8.  **The Phenomenal Concept Strategy (PCS) Requirements:** We agree that for the PCS to succeed, it must explain the unique epistemic situation of the mind-body problem without presupposing the truth of dualism. Specifically, it must explain why phenomenal concepts appear to refer to non-physical properties without actually doing so.

  ***

  ### 2. Table of Disagreements

  The following table isolates the precise points of divergence. The wording in each column is endorsed by the respective signatory as an accurate representation of their position.

  | Topic | The Gap Theorist's Position | The Type-B Physicalist's Position |
  | :--- | :--- | :--- |
  | **1. The Modal Force of Primary Possibility** | If a scenario is primarily possible (true in some world considered as actual), then the actual world's physical facts do not *exhaust* reality. Physicalism requires that $P$ necessitates $Q$ in the primary dimension (i.e., $P \rightarrow Q$ should be a priori). | Physicalism only requires that $P$ necessitates $Q$ in the secondary dimension (metaphysical necessity). Primary possibility is compatible with Physicalism if the reference of phenomenal terms is fixed contingently. |
  | **2. The Nature of Phenomenal Concepts** | Phenomenal concepts are not materially distinct enough from other concepts to block the conceivability argument. While they are "direct," this directness does not generate a unique a posteriori necessity that blocks the zombie inference. | Phenomenal concepts are unique (e.g., they are quotational, recognitional, or involve the experience itself as a constituent). This unique structure creates a "conceptual dualism" that explains the gap without ontological dualism. |
  | **3. The Kripkean Analogy (Pain vs. Heat)** | The analogy between 'Pain' and 'Heat' fails. 'Heat' picks out a contingent referent (molecular motion) via a contingent mode of presentation (sensation of heat). 'Pain' is not picked out via a contingent mode; the sensation *is* the property. There is no appearance/reality distinction for pain. | The analogy holds structurally. The phenomenal concept picks out a physical state via a mode of presentation that is distinct from the physical concept. The "feeling" is the mode of access, not necessarily a non-physical property. The intuition of necessity is an illusion generated by the concept's structure. |
  | **4. The Status of "Zombies" under Idealization** | Upon ideal rational reflection, the concept of a zombie remains coherent. There is no hidden contradiction in $P \& \sim Q$. The TBP claim that it is "inconceivable upon reflection" is an article of faith, not a demonstrated result. | Upon ideal reflection, a fully informed agent would see that $P \& \sim Q$ entails a contradiction, just as $Water \neq H_2O$ entails a contradiction once reference is fixed. The current conceivability is due to our ignorance of the true nature of the concepts involved. |
  | **5. The "Master Argument" against PCS** | Any physicalist explanation of why phenomenal concepts *seem* to refer to non-physical properties must itself rely on the fact that they *do* refer to non-physical properties (or else the explanation is question-begging). | The PCS can be vindicated by showing how physical systems with specific cognitive architectures (e.g., direct recognition modules) would inevitably form concepts that *seem* transparent and distinct, even if they refer to physical states. |

  ***

  ### 3. Cruxes and Diagnostic Tests

  We identify three specific sub-questions ("cruxes") where further argumentation or case analysis could theoretically shift the dialectical weight. For each, we record the predictions made by both sides.

  #### Crux A: The "Contingent Mode of Presentation" Test
  **Question:** Is there a contingent mode of presentation associated with the phenomenal concept of pain, analogous to the "sensation of heat" associated with the natural kind concept "heat"?

  *   **The Test Case:** Consider a being (an "Invert") who has the same physical state $N$ as us when in pain but lacks the "painful" feel, or has a different feel, yet uses the word "pain" correctly according to their community. Does this scenario describe a genuine possibility of reference failure, or is it incoherent?
  *   **GT Prediction:** The scenario is incoherent. If the feel is different, it isn't pain. The mode of presentation is not contingent; the phenomenal property is essential to the reference. This supports the claim that $P \& \sim Q$ is primarily possible.
  *   **TBP Prediction:** The scenario is primarily conceivable but metaphysically impossible. The reference of "pain" is fixed by the causal role of state $N$ in the actual world. The "feel" is the mode of access. If the feel changes but $N$ remains, reference is retained. This supports the claim that the gap is purely conceptual.

  #### Crux B: The "Non-Phenomenal Gap" Comparison
  **Question:** Can we generate an explanatory gap of the same *strength* and *persistence* as the mind-body gap in non-phenomenal domains (e.g., biology, logic, or standard natural kinds) using only conceptual differences?

  *   **The Test Case:** Construct a case where two concepts refer to the same property a posteriori, yet the identity remains "inconceivable" even upon ideal reflection due to the structural differences of the concepts (e.g., a "Super-Blindspot" case in mathematics or logic).
  *   **GT Prediction:** No such case exists. In all other a posteriori identities (Water/H₂O), once the reference fixing is understood, the identity becomes primarily necessary (or the primary intension is adjusted). The mind-body gap is unique because the primary intensions remain distinct even under idealization.
  *   **TBP Prediction:** Such cases can be modeled (e.g., in complex computational systems where high-level outputs are not deducible from low-level code without massive computation). The "gap" is a function of cognitive limitation and concept structure, not ontology. If we can show the gap persists in non-conscious cases due to concept structure, the PCS is vindicated.

  #### Crux C: The Definition of Physicalism (The 2D Switch)
  **Question:** Is Physicalism a thesis about the primary intension of "physical" and "phenomenal," or only the secondary intension?

  *   **The Test Case:** A world $W$ where the physical laws are identical to ours, but the "phenomenal" properties are panpsychic proto-experiences that combine differently. Is $W$ a physicalist world?
  *   **GT Prediction:** No. If $W$ is primarily conceivable, then the actual world's physical facts do not a priori entail the phenomenal facts. Physicalism requires an a priori entailment (Type-A) or is false. Since Type-A is false, Physicalism is false.
  *   **TBP Prediction:** Yes, provided that in $W$, the physical facts metaphysically necessitate the phenomenal facts (secondary intension). Physicalism is a modal thesis about metaphysical necessity, not epistemic derivability. The GT is changing the definition of Physicalism to make it falsifiable by epistemic gaps.

  ***

  ### 4. Assessment of Verbal Disputes

  After extensive analysis, we conclude that the dispute is **not merely verbal**, but it is significantly exacerbated by terminological friction regarding "Conceivability" and "Physicalism."

  **1. The "Conceivability" Friction:**
  *   **Diagnosis:** Early in the collaboration, it appeared we disagreed on whether zombies were conceivable.
  *   **Resolution:** This was partially verbal. The GT uses "conceivable" to mean *ideally primarily conceivable* (coherent as a world considered as actual). The TBP often slips into using "conceivable" to mean *metaphysically possible* (coherent as a counterfactual world).
  *   **Remaining Dispute:** Once disambiguated, we agree zombies are *primarily* conceivable. The substantive dispute remains: Does primary conceivability entail the falsity of Physicalism? This is not verbal; it is a disagreement about the modal requirements of Physicalism.

  **2. The "Physicalism" Friction:**
  *   **Diagnosis:** A significant portion of the debate stems from differing definitions of the target.
  *   **Resolution:** The GT defines Physicalism as requiring that the physical truths *scrutabilize* the phenomenal truths (i.e., $P \rightarrow Q$ is a priori). The TBP defines Physicalism as requiring only that the physical truths *metaphysically necessitate* the phenomenal truths (i.e., $P \rightarrow Q$ is necessary a posteriori).
  *   **Assessment:** This is not purely verbal because it tracks a deeper disagreement about the nature of reduction. The GT argues that without a priori entailment, you haven't explained *why* the physical gives rise to the phenomenal (the "Hard Problem"). The TBP argues that a posteriori necessity is sufficient for ontological unity (the "Brute Necessity" view).
  *   **Verdict:** We classify this as a **substantive disagreement masked as a definition**. If we adopt the GT's definition, Physicalism is false. If we adopt the TBP's definition, Physicalism is likely true. The real fight is over which definition captures the legitimate philosophical desideratum of "explaining consciousness."

  **3. The "Phenomenal Concept" Friction:**
  *   **Diagnosis:** We sometimes talked past each other regarding whether phenomenal concepts are "distinct."
  *   **Resolution:** We agree they are distinct *modes of presentation*. The GT insists this distinctness implies distinct *properties*. The TBP insists distinct modes of presentation can pick out the same *property*.
  *   **Verdict:** This is the core substantive disagreement. It is not verbal. It turns on whether the "transparency" of phenomenal experience guarantees that the concept reveals the essence of the property.

  **Final Joint Conclusion:**
  The debate cannot be resolved by further semantic clarification. It rests on a fundamental divergence in modal intuition: The Gap Theorist intuits that epistemic independence (primary possibility) tracks ontological independence. The Type-B Physicalist intuits that epistemic independence is compatible with ontological identity, provided the concepts involved have specific structural features. Resolving this requires either a decisive refutation of the Phenomenal Concept Strategy's coherence or a new argument demonstrating why a posteriori necessities are impossible in the phenomenal domain.

  ***

  **Signed,**

  *(The Gap Theorist)*
  *(The Type-B Physicalist)*
