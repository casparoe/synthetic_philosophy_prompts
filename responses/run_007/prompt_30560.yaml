prompt: |-
  So here's what I want. I've been following the zombie debate for a while — the one about whether philosophical zombies (physically identical to us but with no conscious experience) are conceivable and what that would mean for physicalism. I know the broad strokes: Chalmers says yes they're conceivable and that gives us a prima facie reason to think physicalism is false; type-B materialists say they only *seem* conceivable but aren't really possible, or something about how conceivability doesn't entail possibility when a posteriori necessities are involved.

  What I'd like you to do is draft the joint statement that would come out of an adversarial collaboration between a committed proponent of the zombie conceivability argument (call them the "gap theorist") and a commited type-B physicalist (the "phenomenal concept strategist" or whatever label they'd accept). I want the document they'd both sign after a year of good-faith back-and-forth.

  The document should have:

  (1) A numbered list of claims both sides agree on. Not vague stuff like "we agree consciousness exists." I want substantive claims about the structure of the debate, what the two-dimensional framework does and doesn't show, what ideal conceivability involves, what the a posteriori necessity reply actually commits you to, whether there's an explanatory gap and what kind of gap it is, stuff like that. Claims where it's genuinely nontrivial that they both signed.

  (2) A disagreements table. For each row: the precise statement of the disagreement, phrased so the gap theorist would accept the wording of their own side and the physicalist would accept the wording of theirs. Not a caricature. I want the actual formulations each camp would stand behind.

  (3) The cruxes — the sub-questions such that if you settled them, at least one side would change their view. For each crux, describe a test, argument, or case that both sides agree bears on it, and record what each side predicts about that test or case in advance.

  (4) An honest assessment of whether any part of their dispute was verbal. I suspect there's a real disagreement here, but maybe some of the back-and-forth about "conceivability" was people using the word differently — like one side meaning something closer to "imaginability" and the other meaning ideal rational coherence. If any of it was verbal, say which part and why.

  I want the answer in American English. And don't pull punches on the technical details — get into the weeds about primary vs. secondary intensions, the structure of the phenomenal concept strategy, whether the gap is epistemic or ontological, the role of the two-dimensional argument against type-B materialism, all of it.
