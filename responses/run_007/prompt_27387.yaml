      *   *Claim 2 (Permission to kill):* Yes, this is the core of MEC. Combatants on both sides have the right to kill combatants on the other side, provided they follow *in bello* rules (discrimination, proportionality).
      *   *Claim 3 (Reasoning/Ignorance):* This is the crucial point. Walzer *does* argue that soldiers are not responsible for the justice of the war (*ad bellum*). He uses the "coercion" and "epistemic limitation" argument. However, he doesn't solely rely on "ignorance excuses them" in a way that makes the act itself permissible *because* it's excused. He argues they have a *right* to fight, not just an excuse. The "license to kill" is derived from the threat they pose and the mutual risk, not merely an excuse from blame. Actually, Walzer's argument is nuanced: he argues that soldiers are *equal* in terms of *in bello* rights and liabilities, regardless of *ad bellum* status. The reasoning about coercion/ignorance is part of why we don't hold them responsible for *ad bellum*, but the permission to kill comes from the convention itself which separates the two judgments.
