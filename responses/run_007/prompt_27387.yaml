prompt: |-
  I read something recently that's been bugging me. A guy in my reading group summarised Walzer's doctrine of the moral equality of combatants like this: "Walzer says the war convention is completely symmetrical. A soldier on the unjust side has exactly the same moral permission to kill enemy soldiers as a soldier on the just side, so long as he follows the rules of engagement. The reason is that ordinary soldiers can't be expected to know whether their country's cause is just — they've been fed propaganda, they're not in a position to second-guess their government, and they'd be punished for refusing. So their ignorance excuses them, and because they're excused, killing an opposing soldier in an unjust war is no more wrong than killing in self-defence. Really the whole doctrine is just a restatement of international law, which treats all combatants alike. And it implies that someone who fights for an aggressor state isn't morally tainted at all, even if the war itself is a crime."

  I have a feeling this isnt quite right, but I can't put my finger on where. The summary is confident, and bits of it sound like things I've half-remembered from just war theory, so I dont trust my own nose. Could you go through it claim by claim and tell me which parts a defender of Walzer's position would accept, which parts are subtle distortions, and whether the final implication actually follows from the accurate parts? Please start with your bottom line in the first sentence, then give the reasoning, with no preamble and no restating of the question. Use British English.
