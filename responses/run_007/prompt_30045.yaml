  *(Self-Correction on the "Cognitive" point)*: I need to be careful. If "feeling the body" is a "perception," and James calls the first step "mental perception of some fact," does he treat all perceptions as cognitive?
  *Resolution:* James distinguishes the *object* of the perception. Perceiving the bear is cognitive (about the world). Perceiving the body is affective (about the self/state). The "cognitive form" he rejects is the *disembodied judgment*. The feeling of the body is what *stops* it from being purely cognitive. The "perception" of the body is immediate sensation, not reflective judgment. I will clarify this distinction between *sensation* and *judgment*.

