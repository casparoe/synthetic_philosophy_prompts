prompt: |-
  I am putting together a grant application for a two-year postdoctoral project, and I need a one-page research proposal. The domain is the separateness of persons objection to utilitarianism. The idea I have, which is still half-formed, is this: critics of utilitarianism often say that the theory fails to respect the separateness of persons — it treats the aggregation of benefits and burdens across different lives as if they were all happening to one person, and in doing so it can justify sacrificing one person's fundamental interests for a slightly larger gain to others. The standard utilitarian replies tend to fall into two camps: either they deny that separateness has the moral weight critics claim it does, or they argue that properly specified utilitarian principles (like rule-utilitarianism or two-level utilitarianism) don't actually license the troubling trade-offs. But I suspect both sides are talking past each other because they are using "separateness" to mean at least two different things — roughly, one metaphysical (about the boundaries between selves) and one normative (about what kinds of trade-offs those boundaries rule out). I want to turn this into a proper proposal: what exactly the question is, why the existing debate hasn't settled it, what I would actually do over two years, what methods I'd use, and what a successful or failed outcome looks like. I'll fill in the citations myself, so don't worry about a bibliography.
