answer: |-
  **Project Title:** Disambiguating the Separateness of Persons: Metaphysical Boundaries and Normative Trade-offs in Utilitarian Theory

  **Project Summary**
  This two-year postdoctoral project addresses a foundational stalemate in contemporary moral philosophy: the "separateness of persons" (SoP) objection to utilitarianism. Critics (e.g., Rawls, Nozick) argue utilitarianism treats society as a super-person, illegitimately aggregating benefits across distinct lives. Defenders reply either by denying the moral weight of separateness or by refining utilitarian principles to block objectionable trade-offs. This project hypothesizes that this debate is stalled due to conceptual equivocation. "Separateness" is used to denote both a *metaphysical* fact (the ontological boundaries between selves) and a *normative* constraint (the moral inviolability of individuals). By disambiguating these concepts, this project aims to determine whether the utilitarian response fails on metaphysical grounds, normative grounds, or both, thereby dissolving a verbal dispute to reveal the substantive ethical disagreement.

  **Research Questions**
  1.  **Conceptual:** What distinct meanings of "separateness of persons" are operative in the literature, and can they be rigorously distinguished into metaphysical and normative categories?
  2.  **Evaluative:** Does the utilitarian aggregation of welfare violate metaphysical separateness, normative separateness, or neither?
  3.  **Constructive:** Can a refined utilitarian framework accommodate the normative significance of separateness without relying on contested metaphysical claims about personal identity?

  **State of the Art and Innovation**
  Since Rawls' formulation, the SoP objection has been a primary weapon against consequentialism. Standard utilitarian replies typically argue that personal identity is less metaphysically robust than critics claim (the "revisionist metaphysics" reply) or that indirect utilitarianism protects individual integrity (the "strategic" reply). However, these responses often fail to land because critics invoke separateness as a brute normative fact, not a metaphysical one. This project innovates by applying methods of conceptual engineering to the debate. Rather than taking sides immediately, it first maps the logical space of the objection. This moves the discussion from a clash of intuitions to a structured analysis of the relationship between ontology and moral status.

  **Methodology and Work Plan**
  The project employs analytic conceptual analysis and constructive normative theory.

  *   **Year 1: Mapping and Disambiguation.**
      *   *Months 1–6:* Historical and conceptual analysis of key texts (Rawls, Nozick, Parfit, Singer, Hare). I will categorize instances of "separateness" into metaphysical (identity, psychological continuity) and normative (rights, inviolability, distribution-sensitive constraints).
      *   *Months 7–12:* Drafting of Paper 1: "The Equivocation Thesis." This paper will argue that the current stalemate is largely verbal. I will present a taxonomy of SoP interpretations.
      *   *Dissemination:* Presentation of preliminary findings at two international conferences (e.g., APA, BSPS).

  *   **Year 2: Evaluation and Construction.**
      *   *Months 13–18:* Testing utilitarian defenses against the new taxonomy. Does Rule-Utilitarianism satisfy *normative* separateness even if it ignores *metaphysical* separateness? Drafting of Paper 2: "Aggregation and Inviolability."
      *   *Months 19–24:* Synthesis and final output. I will develop a framework for "Separateness-Sensitive Utilitarianism" or demonstrate its impossibility. Organization of a one-day workshop to gather feedback from critics and defenders.
      *   *Deliverables:* Two peer-reviewed journal articles, one workshop, and a monograph proposal.

  **Expected Outcomes and Risk Mitigation**
  *   **Success:** The project successfully demonstrates that the SoP objection splits into two distinct objections. This allows utilitarians to answer one (e.g., by accepting metaphysical reductionism) while critics maintain the other (normative inviolability), clarifying exactly where the theories diverge.
  *   **Failure/Risk:** It is possible that metaphysical and normative separateness are inextricably linked, meaning the disambiguation fails. However, this is a substantive philosophical result: it proves the debate is not verbal but rests on a deep connection between ontology and ethics. In this case, the output will shift to arguing for that necessary connection.
  *   **Impact:** Regardless of the verdict, the project provides a clearer vocabulary for future debates in population ethics, distributive justice, and bioethics, where aggregation across persons is central. By clarifying the grounds of disagreement, it prevents future theorists from talking past one another.
