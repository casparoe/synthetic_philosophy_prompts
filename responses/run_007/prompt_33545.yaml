      *   *Section 2: Fungibility vs. Specificity.* Explain the legal distinction between specific and generic goods. It's not metaphysical inconsistency; it's about the *scope of the contract*.
      *   *Section 3: The PII Counterfactual.* Analyze what happens if PII holds. Show that legal acts *generate* discernibility (relational properties). The law creates the difference.
      *   *Section 4: The Coherent Principle.* The principle is "Identifiability." Can the object of the right be identified? If yes (cans), specific identity matters. If no (grain), quantity matters.
      *   *Conclusion:* The law is pragmatic. It doesn't presuppose deep metaphysics but creates its own ontology of "legal persons" and "legal objects."

  7.  **Refining the Tone:**

