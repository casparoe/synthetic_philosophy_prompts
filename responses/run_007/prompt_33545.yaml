      *   **Metaphysical Question:** What theory of identity does the law presuppose?
          *   Option A: Haecceity (primitive "thisness").
          *   Option B: Pragmatism/Spatiotemporal continuity (no metaphysical commitment, just tracking).
      *   **The Tension:** The law treats some goods as distinct tokens (cans) and others as fungible masses (grain/oil).
      *   **The Big Questions:**
          1.  Is the legal practice inconsistent (flipping between haecceity and Identity of Indiscernibles)?
          2.  Is there a coherent principle underlying both?
          3.  What if the Identity of Indiscernibles (PII) were true? What would change in the legal system?

  2.  **Initial Analysis & Philosophical Grounding:**

      *   *Max Black's Argument:* Black used the two spheres to argue *against* the Identity of Indiscernibles (PII). He claimed they are numerically distinct despite sharing all qualitative properties. This supports a view like Haecceitism or at least Primitive Thisness.
      *   *The Legal Context:* The law deals with *rights* and *obligations*, not just ontology. Ownership is a relation between a person and an object.
      *   *Fungibility:* In law, "fungible" means interchangeable. "Non-fungible" means specific. This maps roughly to the metaphysical distinction but is pragmatic.
      *   *The "Theft" Scenario:* If I buy Can A and swap it for Can B (unpaid), I stole Can B. Why? Because the *transaction* attached rights to a specific spatiotemporal locus, not just a description.

  3.  **Addressing Question 1: Is the Law Committed to Haecceity?**

      *   *Argument for Haecceity:* The law treats specific tokens as distinct even if qualitatively identical. This looks like haecceity.
      *   *Argument against Haecceity (Pragmatic/Relational):* The law doesn't care about metaphysical "thisness." It cares about *spatiotemporal history*. Can A was at Location X at Time T when the contract formed. Can B was at Location Y. They are discernible by their *history*, even if not by their intrinsic properties.
      *   *Verdict:* The law likely relies on *Spatiotemporal Continuity* and *Causal History*, not primitive haecceity. It's a "weak" discernibility based on relation to the transaction event.

  4.  **Addressing Question 2: The Fungibility Tension (Grain vs. Cans):**

      *   *Is it inconsistent?* No. It's a distinction between *Specific Goods* and *Generic Goods*.
      *   *Coherent Principle:* The principle is about *intent and identification*.
          *   Cans: The contract identifies specific objects (these two on the shelf).
          *   Grain: The contract identifies a *quantity* from a mass. Ownership is a share of the mass, not specific kernels.
      *   *Metaphysical mapping:* This isn't flipping between PII and Haecceity. It's flipping between *Individual Identity* (tracked by history) and *Mass Identity* (tracked by quantity).
      *   *Key Insight:* Even with grain, if I steal 100 bushels, I stole *that* 100 bushels from *that* silo. But the law allows substitution because the obligation is to deliver *equivalent* goods, not *the same* tokens. This is a normative choice, not an ontological one.

  5.  **Addressing Question 3: What if PII were True? (The Counterfactual)**

      *   *Scenario:* If PII is true, Black's spheres cannot exist. If two things share all properties, they are one thing.
      *   *Legal Impact:*
          *   *Cans:* If two cans share *all* properties (including relational/historical), they are the same can. But they can't share historical properties (one was sold, one wasn't). So PII doesn't actually collapse the cans *after* the transaction because their relational properties diverge.
          *   *The Swap:* If I swap the cans, the "unpaid" can now has the property "was handled by buyer." The "paid" can has "remained on shelf." They are now discernible by history.
          *   *Real Challenge:* The challenge arises *before* the transaction. If they are truly indiscernible *ex ante*, does the contract pick out one?
          *   *Conclusion:* The legal system would barely change because the law *creates* discernibility through transaction. The act of picking one up gives it a unique causal history. PII is saved by relational/historical properties.

  6.  **Synthesizing the Argument:**

      *   *Introduction:* Acknowledge the depth of the question. Connect Black's spheres to the legal tokens.
