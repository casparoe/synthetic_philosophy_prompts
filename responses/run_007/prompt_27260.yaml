prompt: |-
  ok so everyone knows about the Bay of Pigs as the classic groupthink case. But I want you to analyze it using the inside view / outside view distinction instead — the one from Kahneman and Lovallo about whether you forecast by getting immersed in the details of the specific case vs. stepping back and asking what happened in similar cases. 

  Walk me through what the inside view looked like for the planners: what unique features of the situation were they focused on that made them think this time would be different? What reference class would the outside view have used, and what would that view have predicted about the invasion's chances? 

  Then get critical: what does the inside/outside view lens explain about the failure that the standard groupthink story doesn't — and vice versa, what does groupthink capture that the inside/outside view misses? I'm especially interested in whether these are basically the same idea in different words, or whether there's a real differnce in mechanism. 

  Shoot for 800 words. And flag the claim you're least sure of.
