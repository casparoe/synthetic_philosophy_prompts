answer: |-
  This is a diagnostic question about the meta-philosophy of the debate, not the debate itself. You are right to feel stuck: the stalemate persists because the participants are treating a **pluralistic reality** as a **monistic conceptual problem**, while fighting a **substantive metaphysical war** under the cover of **semantic analysis**.

  Here is the diagnosis of the disagreement type, followed by what constitutes progress given that diagnosis.

  ### The Diagnosis: Substantive Metaphysics Disguised as Conceptual Analysis

  The disagreement is not merely verbal, nor is it purely empirical. It is a **substantive disagreement about the metaphysics of normativity** that is obscured by a **conflation of explanatory projects**.

  **1. It is not merely verbal (your hypothesis is half-right).**
  You suggested this might be two questions ("why exist?" vs. "how work?") sharing one word. If it were *only* that, we could solve it by stipulation: let's call one *etiological-function* and the other *systemic-function*, shake hands, and go home.
  But the parties won't do this because they are fighting over whether **normativity is naturalizable**.
  *   **Selected Effects (SE)** claims that history can generate genuine norms (a heart *ought* to pump, even if it doesn't). This is a metaphysical claim about the world containing "oughts" derived from "was."
  *   **Causal Role (CR)** claims that functional ascription is always relative to an analyst's interests. There is no "malfunction" in nature, only "causal contribution to system X" vs. "causal contribution to system Y."
  *   **The Clash:** If you are trying to naturalize mental content (teleosemantics), you *need* the SE notion of normativity. You need a belief to be *wrong* in a way that isn't just "this belief doesn't contribute to the system's capacity for survival." You need it to be a *failure* of a specific historical mandate. CR cannot give you this. SE claims it can. Therefore, the fight over the word "function" is a proxy fight over whether naturalism can accommodate genuine norms. That is substantive.

  **2. The stalemate is caused by Explanatory Monism.**
  The reason nobody budges is that both camps are implicitly trying to win a game of **Conceptual Monopoly**. They both assume there must be *one* correct analysis of "function" that covers biology, physiology, engineering, and philosophy of mind.
  *   SE proponents try to stretch their historical definition to cover physiology (e.g., arguing that recent maintenance selection explains why a specific heart pumps now).
  *   CR proponents try to stretch their systemic definition to cover normativity (e.g., arguing that "malfunction" is just a causal contribution to a system we don't like).
  *   **The Result:** Both sides end up with counter-intuitive edge cases (Swampman for SE; arbitrary side-effects for CR) because they are forcing a tool designed for one explanatory job (etiology vs. mechanism) to do the other job.

  ### What Counts as Progress?

  Given that this is a substantive metaphysical disagreement obscured by an attempt to force one concept to do two jobs, progress does not look like "winning" the debate. Progress looks like **dissolving the monopoly**.

  **1. Adopt Functional Pluralism (The "Distinction" Move)**
  Progress is acknowledging that "function" is a **homeostatic cluster concept** or simply a case of **systematic ambiguity** that tracks distinct explanatory interests.
  *   If the question is "Why is this trait present in the population?", use SE.
  *   If the question is "How does this organism maintain homeostasis?", use CR.
  *   **Why this helps:** It stops the "Swampman" objection from killing SE. In a Swampman context, we are asking about current capacity (CR), not evolutionary history (SE). If we are asking about the content of the Swampman's beliefs, we must decide if we think content requires history. If yes, Swampman has no content. If no, SE is the wrong tool for content.
  *   **Progress Condition:** A paper makes progress if it explicitly states *which* functional concept it is using and *why* that concept fits the specific explanatory goal, without claiming the other concept is "false."

  **2. Own the Metaphysical Cost (The "Bedrock Intuition" Move)**
  Since the core friction is about normativity, progress requires philosophers to stop pretending their intuition pumps are neutral data.
  *   **For Teleosemantics:** If you are using function to naturalize content, you are signing up for SE. You must explicitly accept the cost: Swampman has no content, or at least no content grounded in function. If you find that unacceptable, you cannot use SE to naturalize content. You need a different theory of content.
  *   **For Physiology:** If you are analyzing biological mechanisms, you should likely use CR. You must accept the cost: "Malfunction" is not a mind-independent fact about the organ, but a relational fact about the system you are analyzing.
  *   **Progress Condition:** A paper makes progress if it admits the metaphysical price of its chosen definition (e.g., "I am adopting SE, which entails that duplicate organisms without history lack functions") rather than trying to argue the intuition away.

  **3. Abandon the Search for a Unified Theory of Function**
  The most radical form of progress is agreeing to **drop the word** as a technical term in favor of precise descriptors.
  *   Instead of arguing about "the function of the heart," argue about "the selection history of the heart" vs. "the causal contribution of the heart to circulation."
  *   **Why this helps:** It reveals that the "debate" was often just people answering different questions. The biologist asking "what does this do?" and the evolutionist asking "why is this here?" are not contradicting each other; they are doing different work.
  *   **Progress Condition:** Progress is made when a reading group stops asking "Which theory of function is correct?" and starts asking "Which explanatory project are we engaged in, and does this concept serve it?"

  ### Summary for your Reading Group
  The debate is static because it is trying to solve a **metaphysical problem** (can nature contain norms?) using **conceptual analysis** (what does the word 'function' mean?), while assuming **explanatory monism** (there must be one definition for all contexts).

  To move forward:
  1.  **Acknowledge the Normativity Stake:** Admit that SE is chosen specifically to ground norms (for teleosemantics), while CR is chosen to ground mechanism (for physiology).
  2.  **Reject Monism:** Accept that biology uses both concepts because biology asks both historical and mechanistic questions.
  3.  **Select by Project:** If your goal is naturalizing content, you are in the SE camp. You must defend the metaphysics of historical normativity, not the linguistics of "function." If your goal is understanding physiological systems, you are in the CR camp. You must defend the utility of ahistorical analysis, not the "truth" of function.

  The progress you are looking for isn't a synthesis of SE and CR. It's the realization that they are tools for different jobs, and the fight only exists because everyone wants to use the same hammer for every nail.
