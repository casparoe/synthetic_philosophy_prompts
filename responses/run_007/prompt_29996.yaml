answer: |-
  Dear Friend,

  You have asked for the conceptual core of Williams's integrity objection, stripping away the familiar examples to reveal the underlying philosophical mechanism. This is a crucial distinction because too often the discussion gets bogged down in the specifics of Jim and Pedro or George and the chemical warfare job, missing the structural critique Williams is leveling against consequentialist moral theory. At its heart, the objection is not about the amount of sacrifice utilitarianism demands, nor is it merely about the hierarchy of duties. It is about the nature of agency and the relationship between a person and their actions. The notion of integrity carrying the weight here is not the conventional moral sense of honesty or consistency with principles, but rather an existential sense of identity. For Williams, integrity is the preservation of the self as the author of its own life. It is the condition that allows a person to say that their actions are genuinely theirs, flowing from their own character and commitments, rather than being merely the output of a neutral calculation performed upon them.

  This brings us to your question about ground projects and why they cannot be treated as especially strong preferences within a sophisticated consequentialist calculus. The utilitarian model views the agent as a neutral channel through which satisfaction is maximized. In this view, any commitment, no matter how deep, is essentially a preference state that produces utility when fulfilled and disutility when frustrated. A sophisticated utilitarian might argue that we should weight these deep commitments heavily because frustrating them causes immense psychological pain or social disruption. However, Williams argues that this misunderstands the logical status of ground projects. These projects are not items within the calculus; they are the framework that makes the calculus possible for that specific agent. They provide the motivation to act at all. To subsume them into the utility function is to alienate the agent from them. If I pursue my life's work only because the utility calculus says I should, I am no longer pursuing it as my project; I am pursuing utility, and my project is merely the instrument. The integrity objection claims that this transformation destroys the very thing that gives the project its value to the agent. It turns a constitutive commitment into a contingent tool, and in doing so, it attacks the source of agency itself.

  It is vital to separate this from the complaint that utilitarianism is too demanding or that it ignores special obligations. The demandingness objection suggests that utilitarianism asks for too much sacrifice of our personal interests. Williams's point is deeper: it is not about the quantity of sacrifice but the kind of recognition involved. Even if utilitarianism demanded very little, the structural requirement that I must be willing to sacrifice my ground projects if the calculus dictates it remains an attack on my integrity. Similarly, the special obligations objection suggests that we have stronger duties to family than to strangers. Williams argues that framing this as a duty misses the point entirely. In the case of the husband saving his wife, the problem is not that utilitarianism fails to recognize a duty to save her. The problem is that the husband should not need a duty or a justification to save her. If he stops to consider whether saving her maximizes utility, or even if he justifies saving her by appealing to a general principle that permits special obligations, he has introduced a mediation between himself and the action that corrodes the relationship.

  This is where the charge of having one thought too many bites. It is not primarily about the content of the justifying thought, nor strictly about the timing, though hesitation is a symptom. It is about the stance the agent is forced to take toward his own commitments. The husband should save his wife because she is his wife, out of love and direct commitment. If he saves her because he has calculated that doing so is morally permissible or optimific, he is acting from the standpoint of an impartial observer rather than from the standpoint of a husband. The thought is superfluous because the relationship itself should be the sufficient reason for action. The presence of the moral justification indicates that the agent views his personal relationships as subordinate to an external standard, which is precisely the alienation Williams identifies. The agent is forced to view his own life from the outside, as a locus of causal influence to be managed, rather than as a life to be lived from the inside.

  The case of George the chemist is meant to isolate a different facet of this alienation that the wife case does not fully capture. While the wife case focuses on personal relationships and positive action, George focuses on professional identity and negative responsibility. George is offered a job in chemical warfare. He is opposed to it, but the utilitarian argues he should take it because someone else will do it worse. This isolates the problem of negative responsibility, where the agent is held responsible for what they allow to happen rather than just what they do. For Williams, this severs the link between agency and authorship. If George takes the job, he becomes responsible for outcomes he fundamentally opposes, simply because he is the causal node through which a slightly better outcome occurs. This forces George to view his own actions as entirely disconnected from his moral identity. He becomes a servant of the outcome, regardless of what his hands actually do. While the wife case shows the absurdity of impartial justification in personal love, the George case shows the absurdity of impartial responsibility in professional conduct. It highlights how utilitarianism makes the agent responsible for the world in a way that dissolves the boundary between the self and the external causal chain.

  Finally, you ask whether an impartialist moral theory could accept everything Williams says about integrity while remaining impartialist. The answer turns on what we mean by impartialist. If the theory remains consequentialist in structure, meaning the right action is determined solely by the state of affairs produced, it cannot truly accept Williams's point. A utilitarian might try to accommodate integrity by counting it as a value to be maximized, arguing that respecting integrity leads to better overall outcomes. But this misses the force of the objection. Williams is not saying integrity is a valuable preference to be weighed; he is saying that the requirement to weigh it at all is the problem. To accept Williams's objection is to acknowledge that there are agent-relative reasons that cannot be reduced to agent-neutral values. It requires a structural change where the agent is permitted, or even required, to act on reasons that stem from their own position and projects, even if doing so does not maximize the impartial good. Therefore, accepting the objection forces a move away from pure impartialism toward a view that recognizes the moral significance of the agent's own perspective as a constraint on moral demand, not just another input in the calculation. The underlying disagreement is ultimately about whether morality is a system for managing the world or a practice for living a life. Williams argues that utilitarianism chooses the former at the expense of the latter, and in doing so, it loses the person in the process of saving the world.

  I hope this clarifies the structural depth of Williams's critique beyond the surface level of the examples.

  Warmly,

  Your Assistant
