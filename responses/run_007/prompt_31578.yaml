answer: |-
  ### Pre-Talk Strategy Memo

  **To:** Journalist/Speaker
  **From:** Methodology & Reasoning Consultant
  **Re:** Colloquium Q&A Prep

  You are walking into a room where the currency is "intuition" and you are arguing that the currency is counterfeit *because* it looks so real. Your audience's livelihood depends on the reliability of the armchair. They will not be hostile, but they will be defensive.

  **What to Concede:**
  *   **Heuristic Value:** Concede that thought experiments are excellent for *generating* hypotheses and spotting inconsistencies in theory. Do not argue they are useless; argue they are epistemically risky evidence.
  *   **Not All Intuitions Are Equal:** Concede that some intuitions (e.g., logical trivialities) are more stable than others (e.g., moral verdicts on trolley variants). Your target is the *high-stakes, vivid, affect-laden* cases.
  *   **The Alternative is Hard:** Admit there is no clean replacement. You are calling for calibration, not abolition.

  **What to Hold:**
  *   **The Expertise Myth:** Do not let them claim training inoculates them against framing/affect. The data says otherwise.
  *   **Vividness as a Defeater:** Hold the line that rhetorical power is often inversely correlated with epistemic reliability in this context. If it feels *too* clear, check the framing.
  *   **The Genetic Point:** It is not a genetic fallacy if the process is constitutive of the output. If the intuition is *produced* by the framing, the framing is relevant to the justification.

  ---

  ### Q&A Prep Sheet: 8 Likely Objections

  #### 1. The "Expertise Inoculation" Defense
  **Who:** Senior Ethicist / Department Chair
  **The Question:** "You're citing studies on undergraduates or Mechanical Turk workers. Philosophers are trained to spot ambiguity, control for irrelevant features, and engage in reflective equilibrium. Why should we think the cognitive biases that plague laypeople apply to us when we're doing our job properly? Surely expertise matters."

  **Your Reply (2 mins):**
  "It's a natural hope, but the empirical track record is discouraging. Eric Schwitzgebel and Fiery Cushman (2012) ran order-effect and framing-effect studies specifically on professional philosophers at conferences. They found philosophers were just as susceptible to order effects in moral judgment as non-philosophers. Similarly, Tobia, Buckwalter, and Stich (2013) looked at whether philosophical training mitigates bias in intuition reports; they found it doesn't significantly reduce susceptibility to framing. The mechanism here is the affect heuristic and availability cascade—System 1 processing. Training engages System 2, but vivid intuition pumps are designed to bypass System 2 by triggering immediate emotional recognition. Unless you have a specific debiasing protocol you run before reading a case, the cognitive architecture is the same. Expertise might help you argue the point better, but it doesn't seem to change the initial intuitive output."

  **Where this is soft:** You rely on a few specific papers. If they know of a newer study showing mitigation in *mind* cases (not just ethics), you could be cornered.
  **Prep:** Know the Schwitzgebel/Cushman design (manipulating order of trolley/footbridge cases).

  #### 2. The "Isolating Variables" Defense
  **Who:** Philosopher of Mind
  **The Question:** "You call it 'stripped-down simplicity,' I call it 'controlling for confounds.' When I use Twin Earth, I'm not trying to be vivid; I'm trying to isolate the variable of 'reference' from 'internal state.' If I add real-world noise, I can't tell what's doing the work. Isn't simplicity a feature of good experimental design, not a bug?"

  **Your Reply (2 mins):**
  "There is a crucial distinction between *logical* simplicity and *psychological* vividness. Controlling variables is necessary. But intuition pumps often strip away context that is actually *constitutive* of the concept. In cognitive science, we call this the 'context-dependence' of judgment. For example, when you strip the emotional weight from a moral dilemma to make it 'clean,' you may be removing the very input the moral faculty requires to function. If the mechanism for moral judgment relies on social context, removing that context doesn't isolate the variable; it breaks the machine. My claim is that when a case feels 'obvious' because it's simple, it's often because the simplification has removed the friction where the actual conceptual work happens. You aren't isolating the variable; you're loading the dice by removing the noise that usually corrects our judgment."

  **Where this is soft:** It's hard to draw a bright line between "good simplification" and "biasing simplification."
  **Prep:** Be ready to admit some simplification is good, but argue that *vividness* usually signals the bad kind.

  #### 3. The Genetic Fallacy Charge
  **Who:** Metaphysician / General Analytic
  **The Question:** "Even if I grant that vividness triggers biases, that's a claim about the *origin* of the belief. You're committing the genetic fallacy. A belief can be caused by a bias and still be true. If the Trolley verdict is correct, does it matter if I felt it vividly?"

  **Your Reply (2 mins):**
  "It would be a genetic fallacy if we had independent access to the truth of the matter. But in armchair philosophy, the intuition *is* the evidence. We don't have a trolley-ometer to check the moral truth independently of our judgment. If the only evidence for proposition P is intuition I, and I show that I is produced by a process known to be insensitive to truth-tracking features (like framing or order), then I have defeated the evidence for P. In empirical science, if you learn your scale is calibrated by the temperature of the room, you don't say 'the weight might still be right'; you discard the measurement. Since intuitions are our only measuring device here, showing the device is sensitive to irrelevant features undermines the claim to knowledge."

  **Where this is soft:** They might argue for coherence theories of truth (reflective equilibrium) where the origin matters less than the fit.
  **Prep:** Emphasize that without external calibration, process reliability is all we have.

  #### 4. The "Reflective Equilibrium" Shield
  **Who:** Rawlsian Ethicist
  **The Question:** "We don't just take the raw intuition and run. We put it into reflective equilibrium. We check it against principles, other cases, and background theories. If a vivid intuition contradicts a well-justified principle, we reject the intuition. Doesn't this process filter out the bias you're worried about?"

  **Your Reply (2 mins):**
  "Reflective equilibrium assumes that the biases are random noise that will cancel out, or that the 'considered' part filters them. But cognitive science suggests these biases are *systematic* and they infect the principles too. If your vivid intuition pumps a specific principle, and then you use that principle to judge other cases, you've just spread the bias. Moreover, Schwitzgebel's work suggests that even 'considered' judgments in philosophers shift based on irrelevant framing. The equilibrium might be stable, but it can be a stable equilibrium around a biased anchor. If the anchor (the vivid pump) is drifted by affect, the whole equilibrium drifts with it. You need an external anchor, not just internal coherence."

  **Where this is soft:** This is their core methodology. Attacking it feels like attacking philosophy itself.
  **Prep:** Frame it as "calibration needed" rather than "method is broken."

  #### 5. The Psychologist's Specificity Challenge
  **Who:** Cognitive Psychologist 1
  **The Question:** "You're gesturing at 'bias' and 'heuristics' broadly. Which specific mechanism are you claiming is at play? Is it the affect heuristic? Availability? Framing? The literature on these is nuanced. For example, affect sometimes *improves* decision speed and accuracy in ecological settings. Why think these mechanisms are reliability-defeaters in this specific context?"

  **Your Reply (2 mins):**
  "Fair point. I'm primarily pointing to the **Affect Heuristic** (Slovic et al.) where emotional response substitutes for risk/benefit analysis, and **Framing Effects** (Tversky & Kahneman) where logically equivalent descriptions yield different verdicts. In the context of thought experiments, the 'vividness' you describe maps onto high emotional arousal. The literature on moral dumbfounding (Haidt) shows that when affect is high, reasoning becomes post-hoc rationalization. In philosophy, the 'ecological setting' is the search for necessary and sufficient conditions. Affect is not tracking logical necessity; it's tracking social/emotional salience. So when a case like 'Mary the Color Scientist' feels compelling, it's often because the narrative setup triggers a specific epistemic emotion (curiosity/awe) that we mistake for conceptual clarity. The mechanism is misattribution of arousal."

  **Where this is soft:** If they press on whether *philosophers* show this specific misattribution, you need the Schwitzgebel data again.
  **Prep:** Be ready to define "Affect Heuristic" precisely.

  #### 6. The "What's the Alternative?" Challenge
  **Who:** Practical Ethicist
  **The Question:** "Okay, suppose I believe you. Thought experiments are biased pumps. What do I do instead? I can't run a randomized controlled trial on metaphysical necessity. If I stop using cases, I stop doing philosophy. Are you suggesting we just give up?"

  **Your Reply (2 mins):**
  "I'm not suggesting abolition; I'm suggesting calibration. In science, when you know an instrument has a known bias, you don't throw it away; you correct for it. First, treat vividness as a red flag, not a green light. If a case feels overwhelmingly obvious, that's the moment to look for the framing. Second, diversify the input. Use experimental philosophy methods to check if the intuition is shared across demographics, or if it's a WEIRD (Western, Educated, Industrialized, Rich, Democratic) artifact. Third, rely less on 'positive' pumps (this case proves X) and more on 'negative' pumps (this case shows theory Y is inconsistent). It's harder to bias a contradiction check than a positive verdict. We can still use the tools, but we need to stop treating the 'aha!' moment as data."

  **Where this is soft:** "Diversify input" sounds like x-phi, which the ethicists might resist as merely descriptive.
  **Prep:** Emphasize that knowing your bias is a normative tool, not just a descriptive one.

  #### 7. The X-Phi "Soft on Armchair" Challenge
  **Who:** Experimental Philosopher
  **The Question:** "This sounds like a watered-down version of what my field has been saying for 15 years. But you seem to think we can 'save' intuition pumps if we're careful. Isn't the lesson that armchair intuition is just folk psychology and shouldn't be evidential at all? Why are you trying to salvage the method instead of replacing it?"

  **Your Reply (2 mins):**
  "That's a fair push. The hardline x-phi view is that intuitions are merely psychological data, not evidence for truth. My position is slightly more pragmatic for this audience. I'm arguing that even if you insist on using armchair methods, the *rhetorical features* that make a paper publishable (vividness, clarity) are the exact features that degrade the data quality. I'm trying to meet the mainstream where they are. If I tell them to abolish thought experiments, they stop listening. If I tell them that their best rhetorical tools are epistemic hazards, they might change how they use them. I'm aiming for harm reduction in the armchair, not immediate revolution. But I agree: the default status of an intuition should be 'suspect,' not 'evidence.'"

  **Where this is soft:** The x-phi person might think you're being too diplomatic and undermining your own thesis.
  **Prep:** Acknowledge their point but frame your talk as a bridge-building exercise.

  #### 8. The Self-Referential Trap (The "Gotcha")
  **Who:** Witty Senior Colleague
  **The Question:** "Your talk itself was vivid, emotionally engaging, and stripped down to a simple, compelling thesis. By your own lights, shouldn't we distrust the conclusion you just pumped into us? Isn't this talk itself an intuition pump?"

  **Your Reply (2 mins):**
  "Touché. And I hope you *do* distrust it. That's exactly the point. I have constructed a narrative that makes the 'bias view' feel obvious. I used anecdotes, I simplified the cognitive science, and I aimed for an 'aha' moment. If you accept my conclusion just because the talk was compelling, you've proven my thesis. I want you to accept the conclusion only if it survives your scrutiny of the actual data I cited—the Schwitzgebel studies, the framing effects, the lack of expertise mitigation. Use the tools of philosophy on *my* case. Check for counterexamples. Look for framing. If the argument holds up under that pressure, great. If it only holds up because I told it well, then discard it. I'm asking you to apply the skepticism I'm advocating to the very argument I'm making."

  **Where this is soft:** It's a joke, but if your talk *was* overly manipulative, it undermines your credibility.
  **Prep:** Deliver this with genuine humility. It's the moment to show you practice what you preach.

  ---

  ### The Question You Hope Nobody Asks

  **The Question:** "If vividness and simplicity are unreliable, does that mean the history of philosophy is just a history of good storytelling? Are you saying Plato, Kant, and Rawls were just effective rhetoricians rather than truth-trackers?"

  **Why it's dangerous:** It forces you to either disrespect the canon (alienating the room) or back down on your thesis (undermining your talk). It escalates the stakes from "methodological tweak" to "disciplinary nihilism."

  **How to handle it if asked:**
  "Don't mistake reliability for value. Darwin's writing was vivid; that doesn't mean natural selection is false. It means we need to check the evidence beyond the rhetoric. Plato and Kant provided arguments, not just pumps. Where they relied on intuition pumps, we should indeed re-examine those moves with modern tools. Philosophy progresses by correcting the errors of the past. Acknowledging that our predecessors were subject to cognitive biases isn't an insult; it's an opportunity to do better."

  ---

  ### Final Note on Empirical Specifics
  Do not say "Studies show..."
  **Say:** "Schwitzgebel and Cushman (2012) found order effects in professional philosophers..."
  **Say:** "Tobia et al. (2013) demonstrated that philosophical training does not significantly reduce framing effects..."
  **Say:** "The Affect Heuristic, as described by Slovic..."

  If you vague the data, the psychologists will eat you, and the philosophers will assume you're overstating the case. Precision is your only shield against the "armchair expertise" defense. Good luck.
