      *   Specific empirical citations? Yes (Schwitzgebel, Tobia, etc.).
      *   Address philosopher expertise? Yes.
      *   "Hope nobody asks" question included? Yes.
      *   Upfront strategy included? Yes.

  8.  **Final Polish:** Ensure the distinction between "intuition as evidence" vs. "intuition as data" is clear. Make sure the "vividness = bias" link is supported by specific cognitive mechanisms (e.g., affect heuristic).

  *(Self-Correction during drafting)*: I initially thought about citing general bias studies. I need to make sure I cite studies *on philosophers* specifically for the expertise objection, otherwise the ethicists will dismiss it as "that's for laypeople." Schwitzgebel is key here. For the simplicity objection, I need to distinguish between *controlling variables* (good) and *stripping context* (bad/biasing).

