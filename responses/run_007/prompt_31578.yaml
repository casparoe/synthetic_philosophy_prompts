prompt: |-
  I'm a journalist who covers science and ideas, and next month I'm giving a department colloquium on a piece I've been reporting about intuition pumps. The thesis I'm defending is roughly this: the very features that make a thought experiment a good intuition pump — vividness, emotional pull, stripped-down simplicity, the feeling that you can just see the answer — are also features that cognitive science shows push people's judgments around independently of the merits of the case. So the fact that a case feels immediately and vividly compelling should be treated as a reason to distrust the intuition it delivers, not as evidence for the conclusion.

  The audience is a mainstream analytic philosophy department: mostly moral philosophers and philosophers of mind who assign the trolley problem, Mary the color scientist, the Chinese room, and Twin Earth every single year, plus two cognitive psychologists who work on moral judgment and one experimental philosopher who already thinks armchair intuitions are worthless. The ethicists basically think thought experiments are how ethics gets done; the philosophers of mind think a vivid case can settle what concepts pick out; the psychologists will be twitchy about which cognitive science I'm actually citing; and the x-phi person will think I've gone soft on the armchair.

  Here's the rough argument I'll be giving: thought experiments move us because they're constructed to be vivid, affectively loaded, and stripped of real-world noise; the psychology of judgment shows exactly those features — vividness, affect, simplification — generate framing effects and availability-driven verdicts that don't track the structure of the problem; so a case being a great intuition pump is evidence that the pumped intuition is the output of those biasing features, and philosophers should discount it accordingly.

  Draft my Q&A prep sheet. I want the eight or so objections I'll actually get from this audience — not the ones I'd get from a general public Q&A — ordered by how likely and how damaging they are, each phrased the way that particular person would actually put it. For each objection, give me a two-minute reply and a note on where that reply is softest. Include the question I'm hoping nobody asks, and tell me up front what I should concede and what I should hold. Don't let me get away with vague gestures at the empirical literature; make me say what the studies actually show and why the effect transfers to trained philosophers rather than just to undergrads in a lab.

  You're an expert on philosophical methodology and the psychology of reasoning who's sat through to many of these Q&As to be surprised by anything. Before you write the final sheet, brainstorm the commitments each subgroup in that room brings, the joints in my argument most likely to get hit, and what a smart objector could do with each one.
