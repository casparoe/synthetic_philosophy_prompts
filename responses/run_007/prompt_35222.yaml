      *   *Schopenhauer:* Metaphysical, pessimistic, focuses on *Wille* (Will) as the thing-in-itself. Suffering is positive (in the sense of being real/active), pleasure is negative (mere cessation of pain). Salvation is denial of the Will (asceticism/sainthood). Ethics is based on Compassion (*Mitleid*).
      *   *Convergence:* Both agree life is suffering driven by desire. Both agree the cessation of desire is the goal. Both reject hedonistic utilitarianism (pleasure isn't the good).
      *   *Divergence 1 (Metaphysics):* Tranquilism is likely naturalistic (psychological states). Schopenhauer is transcendental idealist (Will is ontological). Schopenhauer might think Tranquilism is treating symptoms, not the disease.
      *   *Divergence 2 (Ethics vs. Soteriology):* Tranquilism is a normative ethical theory (what makes states of affairs better). Schopenhauer's ethics is a stepping stone to soteriology (salvation/release). For Schopenhauer, ethics *leads* to the denial of the Will. Tranquilism might just want a world with less craving, not necessarily the extinction of the subject.
      *   *Divergence 3 (The "Nothing"):* Schopenhauer's end state is "nothing" (relative to the world of Will). Tranquilism seems to imply a tranquil *state* of existence. Is there a subject left?
      *   *Divergence 4 (Compassion):* Schopenhauer's ethics rests on *Mitleid* (compassion) recognizing the unity of Will. Tranquilism rests on the *value* of tranquility. Does Tranquilism ground the *motivation* to help others?

