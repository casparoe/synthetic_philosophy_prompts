answer: |-
  # Consensus and Dissensus on Safety Guarantees for General-Purpose AI

  **To:** Technical Leadership and Engineering Staff
  **From:** Adversarial Collaboration Working Group (Worst-Case & Average-Case Camps)
  **Subject:** Criteria for Alignment-Relevant Safety Results
  **Date:** October 26, 2023

  ## Preamble

  This document records the output of a structured adversarial collaboration between the "Worst-Case" (WC) and "Average-Case" (AC) sub-teams. Our objective was to isolate the substantive technical disagreements regarding what constitutes a valid safety guarantee for deployed general-purpose systems.

  We define a **Safety Result** as a technical claim about a system's properties that, if true, significantly reduces the probability of catastrophic misalignment outcomes upon deployment. We define a **Guarantee** as a mathematical statement bounding system behavior, characterized by its quantifier scope (universal $\forall$ vs. probabilistic $\mathbb{P}$) and its domain specification (set $\mathcal{X}$ vs. measure $\mathcal{D}$).

  The following sections detail our agreements, precise disagreements, empirical cruxes, and a diagnosis of the semantic vs. substantive nature of our split.

  ---

  ## 1. Agreed Claims

  Both camps affirm the following substantive claims. These claims reject naive empirical validation but stop short of resolving the WC/AC split on the *form* of the required guarantee.

  1.  **Inadequacy of IID Validation:** Standard i.i.d. test set performance (empirical risk minimization on a static holdout set) is insufficient for safety claims. Both camps agree that $\hat{R}_{test} \approx R_{true}$ assumptions fail under deployment conditions where the system's own outputs or external actors modify the input distribution.
  2.  **Inevitability of Distribution Shift:** The deployment distribution $\mathcal{D}_{deploy}$ will not equal the training distribution $\mathcal{D}_{train}$. Both camps agree that a safety guarantee must explicitly account for a shift $\Delta(\mathcal{D}_{train}, \mathcal{D}_{deploy}) > 0$, whether modeled as a worst-case perturbation or a probabilistic drift.
  3.  **Asymmetric Cost Structure:** The loss function $L(y, \hat{y})$ for alignment failures is heavy-tailed and asymmetric. A large number of benign errors cannot compensate for a single catastrophic failure. Both camps agree that minimizing expected loss $\mathbb{E}[L]$ without constraining the tail behavior is insufficient *unless* the tail is explicitly penalized in the objective.
  4.  **Limits of Unbounded Adversaries:** Guarantees against an adversary with unbounded computational resources or omniscient access to model weights are impossible for Turing-complete systems (due to undecidability) or computationally intractable for large neural networks. Both camps agree that any valid guarantee must specify a bounded capability for the adversary or environment.
  5.  **Requirement for Explicit Domains:** A guarantee is checkable only if the domain of quantification is explicitly defined. A statement "the model is safe" is vacuous without specifying whether it means $\forall x \in \mathcal{X}_{bound}$ or $\mathbb{P}_{x \sim \mathcal{D}_{spec}}(\text{safe}) \ge 1 - \delta$.
  6.  **Stipulation Risk:** Both camps agree that the specification of the threat model $\mathcal{X}_{threat}$ (WC) and the deployment distribution $\mathcal{D}_{spec}$ (AC) are human-generated stipulations subject to error. A guarantee is only as strong as the fidelity of its domain specification to reality.

  ---

  ## 2. Disagreement Table

  The following table isolates the residual disagreements. We have phrased these claims to ensure the affirming side accepts the wording while the denying side rejects it.

  | ID | Claim Affirmed by Worst-Case (Denied by Average-Case) | Claim Affirmed by Average-Case (Denied by Worst-Case) | Judgment (Substantive vs. Verbal) |
  | :--- | :--- | :--- | :--- |
  | **D1** | **The Quantifier Requirement:** A property counts as a safety result *only if* it is of the form $\forall x \in \mathcal{X}_{threat}, \text{Property}(x)$. Probabilistic bounds $\mathbb{P}(\text{failure}) < \delta$ are not safety results, regardless of how small $\delta$ is. | **The Risk Requirement:** A property counts as a safety result if it bounds expected disutility $\mathbb{E}_{x \sim \mathcal{D}}[L(x)] < \tau$. Universal quantification is unnecessary and often misleading if $\mathcal{X}_{threat}$ is stipulated arbitrarily. | **Substantive.** This is a disagreement about acceptance criteria for deployment. WC treats $\delta > 0$ as an unacceptable risk of ruin; AC treats $\forall$ as an impossible bar that blocks useful deployment. |
  | **D2** | **Threat Model Robustness:** Specifying a bounded set $\mathcal{X}_{threat}$ is epistemically more robust than specifying a distribution $\mathcal{D}_{spec}$. Errors in defining $\mathcal{D}$ (missing support) are more likely than errors in defining $\mathcal{X}$ (including unreachable inputs). | **Distributional Honesty:** Specifying $\mathcal{D}_{spec}$ is more honest than $\mathcal{X}_{threat}$. WC guarantees silently condition on $x \in \mathcal{X}_{threat}$, which is effectively a distribution with support $\mathcal{X}_{threat}$ and uniform density, masking the probability of encountering those inputs. | **Partly Verbal / Partly Substantive.** Verbal: Both are stipulations. Substantive: WC believes set membership is easier to verify than probability density. AC believes set membership without probability mass leads to vacuous conservatism. |
  | **D3** | **Minimax Necessity:** Asymmetric catastrophic costs force a minimax objective $\min_{\theta} \max_{x \in \mathcal{X}} L(x, \theta)$. Expected utility maximization $\min_{\theta} \mathbb{E}[L]$ cannot structurally prevent ruin even with heavy weighting. | **Utility Encoding:** Asymmetric costs can be fully absorbed into the loss function $L$. If $L(\text{catastrophe}) \to \infty$, then minimizing $\mathbb{E}[L]$ converges to the same solution as minimax, without sacrificing average-case performance on benign inputs. | **Substantive.** This is a decision-theoretic disagreement. WC argues that infinite loss makes expectation undefined or unstable; AC argues that finite but large weights suffice for optimization. |
  | **D4** | **Scalability of Verification:** Non-vacuous worst-case bounds (e.g., via formal verification or convex relaxations) are attainable for general-purpose reasoning systems at relevant scales. | **Verification Vacuity:** For general-purpose neural systems, worst-case bounds will inevitably become vacuous (e.g., error bound $\ge 100\%$) as model complexity scales, rendering them useless for safety. | **Substantive.** This is an empirical claim about computational complexity and algorithmic progress in verification. |

  ---

  ## 3. Cruxes

  We identify three sub-questions where a settled answer would move at least one camp. For each, we specify a concrete test and record pre-commitments.

  ### Crux 1: The Scalability of Formal Bounds
  **Question:** Can worst-case verification methods scale to general-purpose transformers without becoming vacuous?
  **Concrete Test:** Apply a state-of-the-art complete verification method (e.g., branch-and-bound with neural relaxations) to verify a specific safety property (e.g., "output does not contain instructions for harm") on a model family scaled from 10M to 1B parameters. Measure the tightness of the bound and the compute cost.
  *   **WC Prediction:** The gap between the verified bound and the true worst-case error will remain bounded (non-vacuous) as parameters increase, provided architectural constraints (e.g., Lipschitz bounds) are enforced. Compute cost will grow polynomially.
  *   **AC Prediction:** The verified bound will converge to triviality (e.g., "model could output anything") as depth/width increases, or the compute cost will grow super-exponentially, making verification infeasible for deployment-sized models.

  ### Crux 2: The "Stipulation" Equivalence
  **Question:** Is the epistemic uncertainty in defining $\mathcal{X}_{threat}$ lower than in defining $\mathcal{D}_{spec}$?
  **Concrete Test:** Retrospective analysis of safety failures in deployed high-stakes ML systems (e.g., autonomous vehicles, content moderation). Classify each failure as either (A) *Out-of-Distribution* (low probability under $\mathcal{D}_{spec}$) or (B) *Adversarial/Edge-Case* (within $\mathcal{D}_{spec}$ support but on the boundary of $\mathcal{X}_{threat}$).
  *   **WC Prediction:** The majority of catastrophic failures will be Type B. They occur on inputs that *should* have been covered by a competent threat model but were excluded due to lack of worst-case reasoning.
  *   **AC Prediction:** The majority of catastrophic failures will be Type A. They occur in regions of input space assigned near-zero probability by engineers, demonstrating that $\mathcal{D}_{spec}$ is the harder object to model, not $\mathcal{X}_{threat}$.

  ### Crux 3: Loss Function Encoding of Ruin
  **Question:** Can expected loss minimization with heavy-tailed weights replicate minimax safety behavior?
  **Concrete Test:** Train two agents in a simulated environment with a "ruin" state (episode ends, infinite penalty). Agent 1 optimizes $\mathbb{E}[L]$ with $L(\text{ruin}) = 10^6$. Agent 2 optimizes $\min \max L$ (constraint satisfaction). Measure the frequency of ruin and the average reward on non-ruin trajectories.
  *   **WC Prediction:** Agent 1 will suffer ruin at a non-zero rate that does not decrease with scale, because expectation smooths over the singularity. Agent 2 will achieve zero ruin.
  *   **AC Prediction:** Agent 1 will achieve zero ruin (or statistically indistinguishable from Agent 2) once $L(\text{ruin})$ exceeds the value of the optimal policy, with higher sample efficiency than Agent 2.

  ---

  ## 4. Verbal Dispute Report

  We diagnose the nature of the debate as follows:

  **1. The Honorific "Safety" (Verbal):**
  Approximately 30% of the disagreement is verbal, centering on the label "Safety Result."
  *   The **WC Camp** uses "Safety" to mean *absence of specific failure modes under stress*. To them, a probabilistic guarantee is a "reliability claim," not a "safety claim."
  *   The **AC Camp** uses "Safety" to mean *acceptable expected disutility given operational context*. To them, a universal guarantee is a "verification claim," which is a subset of safety engineering.
  *   **Diagnosis:** We recommend decoupling the honorific from the technical claim. We should speak of "Universal Bounds" vs. "Probabilistic Risk Bounds" rather than arguing over which counts as "Safety."

  **2. The Nature of the Adversary (Substantive):**
  Approximately 70% of the disagreement is substantive, centering on how to model uncertainty about a system that may be optimizing against you.
  *   **The Core Conflict:** The WC camp models deployment uncertainty as **Knightian Uncertainty** (unquantifiable risk), necessitating set-based bounds ($\forall$). The AC camp models deployment uncertainty as **Bayesian/Epistemic Uncertainty** (quantifiable risk), necessitating measure-based bounds ($\mathbb{P}$).
  *   **Smuggled Assumptions:**
      *   **WC** smuggles the assumption that *optimization pressure will always find the worst input* into the definition of "deployment." They treat the environment as an adversary $\mathcal{A}$ maximizing loss.
      *   **AC** smuggles the assumption that *the future resembles the past sufficiently to estimate densities* into the definition of "distribution." They treat the environment as a sampler $\mathcal{D}$ from a stationary (or slowly drifting) process.
  *   **Commitment:** This is not resolvable by semantics. It requires resolving Crux 1 and Crux 2. If verification scales (Crux 1), WC is vindicated. If failures are primarily low-probability tail events rather than adversarial maxima (Crux 2), AC is vindicated.

  **Final Recommendation:**
  Until Crux 1 is settled, the team should pursue a **hybrid assurance case**. We will require probabilistic bounds ($\mathbb{P}$) for all operational metrics, but we will require universal bounds ($\forall$) for specific, narrow "critical control paths" where verification is computationally feasible. We acknowledge that this satisfies neither camp fully but maximizes information gain toward resolving the substantive disagreements.
