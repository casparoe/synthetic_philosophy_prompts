answer: |-
  ### Exam Question

  **Essay Question (60 minutes)**

  Carl Hempel argues that historical explanation is logically identical to scientific prediction, requiring subsumption under general laws. Arthur Danto counters that historical narrative relies on "narrative sentences" that describe earlier events in terms of later outcomes. 

  Evaluate whether the **retrospective structure of narrative** undermines the symmetry of explanation and prediction more fundamentally than the **scarcity of strict laws** in history. In your answer, you must:
  1. Distinguish these two objections to the covering-law model.
  2. Argue which objection cuts deeper and why.
  3. Determine whether rejecting the covering-law model forces historians to abandon causal explanation.

  ***

  ### Model Answer

  Hempel's covering-law model posits that to explain an event is to show it was to be expected based on initial conditions and universal laws. This entails the symmetry thesis: a valid explanation could have served as a prediction prior to the event. While historians often criticize this model by noting the scarcity of explicit laws in historical texts, this empirical objection is superficial compared to the conceptual objection raised by the retrospective structure of narrative.

  The first objection concerns the **scarcity of laws**. Critics note that historians rarely cite universal generalizations. However, a Hempelian can reply that these laws are often implicit or truncated. The absence of stated laws does not prove their absence in principle; it may merely reflect pragmatic constraints or the complexity of social science. If one accepts that psychological or sociological laws exist *in principle*, the covering-law model remains viable despite their rare citation. Thus, this objection attacks the *practice* of history, not its *logical structure*.

  The second objection, derived from Danto, concerns **retrospectivity and narrative sentences**. A narrative sentence describes an event at time $t_1$ using knowledge available only at $t_2$ (e.g., "The Thirty Years' War began in 1618"). In 1618, no actor could predict the war would last thirty years; the description relies on future knowledge. This creates a logical asymmetry. Explanation in history often involves organizing events based on their significance to later outcomes. Because this significance is inaccessible to the past actors, it cannot be used for prediction. Even if we possessed perfect sociological laws, we could not predict an event under a description that requires future knowledge to apply. This objection attacks the *logic* of historical understanding, not merely its methodology.

  The retrospective objection cuts deeper because it demonstrates that historical explanation is not merely "prediction that happened late." It shows that the *explanandum* in history is often constituted by its relation to the future. The symmetry thesis fails not because we lack laws, but because the object of explanation changes once the future has occurred.

  Does rejecting the covering-law model abandon causal explanation? No. It requires redefining causality away from nomological subsumption toward **narrative causal relevance**. In a narrative, events are linked not because they instantiate a law, but because they form a coherent plot where earlier events make later events intelligible. Causality here is not about constant conjunction but about tracing the transformation of a situation. To say the assassination caused the war is not to say assassinations always cause wars (a law), but to show how this specific assassination altered the context such that war became the intelligible outcome.

  Therefore, the covering-law model fails primarily because it cannot accommodate the retrospective logic of narrative sentences, not merely because laws are hard to find. Abandoning the model does not surrender causality; it shifts the focus from prediction to the organization of significance. History remains a causal inquiry, but its causality is embedded in the temporal structure of the story, not in the universality of the law.

  ***

  ### Marking Scheme (20 Points)

  **Time Allocation:** 60 Minutes
  **Passing Threshold:** 10 Points

  #### I. Understanding the Symmetry Thesis (5 Points)
  *   **5 pts:** Clearly articulates that Hempel equates explanation with prediction based on initial conditions + laws.
  *   **3 pts:** Mentions prediction/laws but fails to link them logically (i.e., treats them as separate features).
  *   **0-1 pts:** Recites D-N schema without explaining the symmetry implication.

  #### II. Distinguishing and Evaluating Objections (10 Points)
  *   **A-Range (9-10 pts):** Explicitly distinguishes the **empirical/pragmatic objection** (missing laws) from the **conceptual/structural objection** (retrospectivity/narrative sentences). Argues convincingly that the structural objection cuts deeper because it invalidates prediction *even if* laws existed.
  *   **B-Range (6-8 pts):** Identifies both objections but treats them as equal weight, or argues the "missing laws" objection is primary. Mentions Danto but does not fully explain how narrative sentences break symmetry.
  *   **C-Range (3-5 pts):** Discusses only one objection or conflates the two.
  *   **Deductions:** 
      *   -2 pts for treating narrative as mere chronology (listing events without causal/semantic connection).
      *   -2 pts for confusing "historians don't state laws" with "history is not law-governed."

  #### III. Causality Without Covering-Law (5 Points)
  *   **5 pts:** Argues that causality remains but is reconfigured (e.g., as narrative relevance, intelligibility, or context transformation).
  *   **3 pts:** Claims causality remains but offers no account of how it functions without laws.
  *   **0-1 pts:** Incorrectly infers that rejecting covering-law means history is non-causal or merely interpretive.
  *   **Deductions:**
      *   -3 pts for inferring that retrospective explanation cannot be causal.

  #### Common Errors & Misunderstandings
  *   **The "Law-Governed" Confusion:** Student argues history has no laws because historians don't write them down. (Correct view: History might be law-governed ontologically, but explanation doesn't rely on stating them).
  *   **Narrative as Chronology:** Student treats narrative explanation as simply "telling what happened next" rather than organizing events via significance.
  *   **Retrospective = Non-Causal:** Student assumes that because we look back, we are not identifying causes, only meanings. (Correct view: Narrative connects causes via significance).
  *   **Recitation Trap:** Student spends >150 words defining the D-N schema without analyzing the prompt's specific tension regarding symmetry.
