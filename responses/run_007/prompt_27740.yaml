  A crimson spark ignites upon the left,
  Then green flares up where rightward vision lies.
  Yet sight perceives a traveler bereft
  Of stops, that shifts its hue before our eyes.
  It flows between, a singular design,
  Though two distinct events had struck the view.
  The second comes after the first's decline,
  How did the first know what the green would do?

  Now two paths open in the mind's deep court:
  Did memory rewrite the past event?
  Or did the show wait till the end was sort?
  No test can say where consciousness was sent.
  For every probe must suffer same delay,
  And ask a "when" that slips from grasp away.

  So seek no timestamp in the neural fire,
  For "now" is just a tale the brain requires.

  ### Commentary

  The sonnet form serves as a structural analog to the philosophical argument itself, imposing a rigid order on a subject that resists definition. The octave establishes the empirical data—the color phi phenomenon—without technical terminology. By describing the "crimson spark" and "green flares," the poem recreates the subject's experience, leading to the temporal paradox in line 8: how the first event could anticipate the second. The iambic meter creates a sense of inevitable progression, mimicking the subjective flow of time that the experiment disrupts.

  The volta at line 9 ("Now two paths open") marks the critical shift from phenomenology to metaphysics. This mirrors the philosophical fork between the Orwellian (memory revision) and Stalinesque (delayed presentation) accounts. The imagery of a "court" suggests judgment and narrative construction, while "rewrite" versus "wait" captures the core mechanistic difference without naming Dennett's metaphors. This avoids alienating general readers while signaling the specific debate to experts.

  The sestet confronts the epistemological crisis. The rhyme scheme tightens to emphasize the trap: any "probe" used to measure the timing is subject to the same delays as the experience itself. This reflects the indeterminacy thesis—that the distinction is not merely unknown, but unknowable. The language shifts from visual imagery to abstract concepts ("timestamp," "neural fire"), marking the move from experience to explanation.

  The final couplet rejects the premise of the question. By asserting that "now" is a "tale the brain requires," the poem aligns with the multiple drafts model's implication: consciousness is not a single stream with a determinate timestamp, but a functional narrative. The form provides a sense of closure, yet the content denies ontological closure, leaving the reader with the vertigo of a question that dissolves upon inspection. This tension between the sonnet's promise of resolution and the poem's denial of one embodies the central puzzle of conscious timing.
