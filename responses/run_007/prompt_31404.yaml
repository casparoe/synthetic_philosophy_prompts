answer: |-
  This is a splendid dispute, and one that cuts to the heart of contemporary decision theory. It is hardly surprising that your postdocs have reached an impasse; they are effectively advocating for two different normative frameworks without fully realising it. Priya is arguing from a position that blends Causal Decision Theory (CDT) with Evidential Decision Theory (EDT), prioritising 'updateful' reasoning (conditioning on what you know now). Tom is arguing for something resembling Functional Decision Theory (FDT) or Updateless Decision Theory (UDT), prioritising policy optimisation across all possible worlds.

  Here is my ruling on their exchange, move by move.

  ### Move 1: The Counterfactual Mugging
  **Priya:** Refuse. The coin is tails; the £10,000 is gone. Paying loses £100.
  **Tom:** Pay. Refusing makes you the sort of person who doesn't get the £10,000 in the heads branch.

  **Ruling:** Priya is right about the *causal* structure of the immediate situation; Tom is right about the *expected utility* of the general policy.
  Priya correctly identifies that, conditional on the coin being tails, the payment has no causal power to retrieve the reward. However, Tom correctly identifies that a rational agent should care about the output of their decision algorithm across the entire probability space, not just the slice they currently inhabit. If you refuse, you are indeed the sort of person who leaves £10,000 on the table *ex ante*.

  ### Move 2: The Newcomb Comparison
  **Tom:** Refusing here is like Two-Boxing in Newcomb's problem.
  **Priya:** Newcomb is different. There, the prediction concerns the actual act. In the mugging, it concerns a counterfactual act.

  **Ruling:** Tom is stronger here.
  Priya attempts to draw a structural distinction, but logically, the cases are isomorphic. In Newcomb's problem, the boxes are already filled, just as the coin has already landed in the mugging. In both cases, your current action cannot physically alter the past state of affairs. Priya's claim that her act is evidence in Newcomb but not in the mugging relies on the fact that she knows the coin outcome in the mugging. However, Tom's point stands: in both cases, the predictor is simulating your decision algorithm. To treat them differently requires a justification beyond "I know the outcome in one but not the other," because the *source* of the correlation (Omega's prediction of your algorithm) is identical.

  ### Move 3: XOR Blackmail
  **Priya:** Pay. If I pay, the letter implies no termites. £1,000 is better than £1,000,000.
  **Tom:** Paying doesn't cause the termites to vanish. The house is infested or it isn't.

  **Ruling:** Priya is right about the *outcome*, but Tom is right about the *mechanism*.
  In XOR blackmail, standard Causal Decision Theory actually recommends refusing (since payment does not causally remove termites). Priya's willingness to pay aligns her with Evidential Decision Theory here: she treats her payment as evidence that the house is safe. Tom correctly points out the causal inertness of the payment. However, because Omega's letter generation is logically linked to her decision, paying is indeed the winning move. Priya gets the right answer for potentially the wrong reason (evidence rather than logical correlation), while Tom is sceptical of the causal magic she implies.

  ### Move 4: The Line (Evidence vs. Disposition)
  **Priya:** In XOR, payment is evidence about the *actual* world (termites). In the mugging, it is evidence about a *counterfactual* branch.
  **Tom:** Both are Omega sorting people by dispositions.

  **Ruling:** Tom is more right.
  Priya's distinction is the standard defence of evidential reasoning, but it is fragile. In both cases, Omega is sorting agents based on their disposition to pay. In XOR, paying correlates with a safe house in the actual world. In the mugging, paying correlates with a rich world in the counterfactual branch. If one accepts that rational agents should optimise their dispositions to correlate with good outcomes (as Priya implicitly does in XOR), it is difficult to justify ignoring that correlation in the mugging simply because the good outcome is in a branch you know you aren't in. Tom correctly identifies that the underlying mechanism—Omega rewarding a specific decision function—is the same in both.

  ### Move 5: Precommitment and Time Consistency
  **Tom:** You would precommit. Refusing is deviating from a rational plan.
  **Priya:** Ex ante rationality differs from ex post. Updating on the coin flip is rational.

  **Ruling:** Tom wins on consistency; Priya wins on intuitive freedom.
  This is the crux of the matter. Priya defends 'dynamic consistency' (the ability to change one's mind upon receiving new information). Tom defends 'reflective consistency' (the desire that your future self does not undo the plans your past self made to maximise utility). If Priya would precommit but then defect, she is time-inconsistent. In decision theory, time inconsistency is generally viewed as a defect, as it makes the agent vulnerable to exploitation (e.g., paying to bind themselves, then paying to unbind themselves). Tom's argument that rationality shouldn't depend on *when* you ask is theoretically robust.

  ### Overall Assessment

  **Who is more right?**
  Tom is more right overall, though Priya's intuitions are more aligned with orthodox economics.
  Tom's position is theoretically more coherent. He advocates for a policy that maximises utility across the entire decision tree, regardless of which branch the agent finds themselves in. This avoids the dynamic inconsistency that plagues Priya's position. Priya is effectively arguing for a framework that allows an agent to wish they had been a different sort of person *after* the facts are revealed, which is a peculiar state for a rational agent to inhabit.

  However, Priya is not 'wrong' in the sense that her view (Updateful Evidentialism) is a recognised, albeit contested, position. She prioritises causal leverage in the actual world over logical correlation across possible worlds. But in doing so, she accepts a lower expected utility *ex ante*.

  ### Can Priya's Line Carry the Weight?
  **No.** The line Priya draws between "evidence about the actual world" (XOR) and "evidence about a counterfactual branch" (Mugging) cannot bear the philosophical weight she places on it.
  In both cases, the correlation between the agent's action and the desirable outcome is established by Omega's prediction *before* the agent acts. In XOR, paying correlates with no termites. In the Mugging, paying (in tails) correlates with receiving money (in heads). To accept the first correlation as action-guiding but reject the second is arbitrary unless one insists that only causal influence matters. But if only causal influence matters, Priya should refuse in XOR blackmail as well (since paying doesn't causally remove termites). By paying in XOR but refusing in the Mugging, she is inconsistently applying evidential reasoning.

  ### Does Tom's Policy Argument Show the Cases are on a Par?
  **Yes.** Tom is correct that both cases are instances of Omega sorting agents by their dispositions.
  In both scenarios, Omega rewards agents whose decision functions output 'Pay' in specific circumstances. The only difference is the informational state of the agent at the moment of decision. Tom's 'updateless' approach treats the decision as the output of a function that exists across all branches, thereby neutralising the difference between 'actual' and 'counterfactual' from the perspective of the algorithm. This successfully shows the cases are on a par regarding the *source* of the payoff (the disposition), even if they differ in the *location* of the payoff.

  ### What Are They Missing?
  Both postdocs are missing a clear acknowledgement of the **meta-decision theoretic** nature of their disagreement. They are arguing as if there is a single, obvious definition of 'rationality', when in fact they are debating which decision theory to adopt.

  1.  **The Definition of 'Winning':** They need to agree on whether 'rationality' means making the choice that feels causally efficacious in the moment (Priya), or making the choice that results in the highest total utility across the probability distribution (Tom). In AI safety and modern rationality research, 'winning' (Tom's view) is usually preferred. In classical economics, causal integrity (Priya's view) is often preferred.
  2.  **The Nature of Omega:** They treat Omega as a given. A crucial missing piece is *how* Omega predicts. If Omega is a perfect simulator of their source code (logical prediction), Tom is unequivocally right. If Omega is merely a very good psychological profiler (physical prediction), Priya's updating might be more defensible.
  3.  **Logical Counterfactuals:** Priya struggles with the idea that an action in the 'tails' branch can have logical implications for the 'heads' branch. They are missing the machinery of **logical counterfactuals**, which allows one to reason about what would happen in a branch where the coin landed heads, *given* that my algorithm is the sort that pays in tails. Without this concept, Priya's refusal seems rational. With it, Tom's payment is the only coherent move.

  **Final Recommendation:**
  Tell Priya that while her intuition is the standard human response, it leaves her vulnerable to dynamic inconsistency and lower expected utility. Tell Tom that while his policy is robust, he must acknowledge that it requires accepting a non-standard view of causation (logical causation). The seminar should conclude that the dispute is not about the cases themselves, but about whether rationality is a property of the *act* or the *agent*. On the latter view, Tom wins. On the former, Priya does. Given that we generally wish to be agents who win, I suggest you side with Tom.
