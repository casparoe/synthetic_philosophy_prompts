          *   *Impact:* High. This is usually the "conversation-stopper."

      *   *Level 5: The Metaphysical Claim.* Persons are fundamentally separate substances in a way that makes summation category error.
          *   *Utilitarian Response:* Rejects the metaphysics or its relevance.
          *   *Impact:* High, but rarely defended explicitly.

  4.  **Refining and Structuring the Theses:**
      *   I need to make sure the distinction between "Undermines Utilitarianism" and "Plausible" is clear for each.
      *   I need to identify which one the reading group member is likely using. (Probably Level 4, disguised as Level 1 or 2).

      *   *Refinement on Level 1:* Call it "Numerical Distinctness."
      *   *Refinement on Level 2:* Call it "The Disanalogy of Prudence." (Rawls' specific point).
      *   *Refinement on Level 3:* Call it "The Significance of Distribution."
