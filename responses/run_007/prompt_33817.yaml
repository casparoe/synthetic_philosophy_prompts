      *   *Origin:* John Rawls, *A Theory of Justice* (Section 5). He critiques utilitarianism for extending the principle of choice for one person to society as a whole.
      *   *Core Idea:* Individuals are distinct entities; you can't just sum up their experiences like moments in one life.
      *   *Variations:*
          *   Metaphysical: Are persons distinct substances?
          *   Psychological: Do we care more about our own future than others?
          *   Normative/Deontological: Do individuals have rights that block aggregation?
          *   Distributive: Does fairness matter independently of the sum total?
          *   Phenomenological: Pain is felt *by someone*, not in the abstract.

  3.  **Drafting the Distinct Theses (Gradient from Weak to Strong):**

      *   *Level 1: The Trivial/Descriptive Claim.* Persons are numerically distinct. Pain in person A isn't pain in person B.
          *   *Utilitarian Response:* "We know. That's why we sum them."
          *   *Impact:* None.

      *   *Level 2: The Psychological/Prudential Claim.* Intrапersonal trade-offs (me now vs. me later) are psychologically easier/more rational than interpersonal ones (me vs. you).
          *   *Utilitarian Response:* "Maybe psychologically, but not morally."
          *   *Impact:* Weak. Explains *why* we hesitate, not *why* it's wrong.

      *   *Level 3: The Distributive Claim.* The *pattern* of distribution matters, not just the sum. Losing 100 units hurts more if concentrated on one person than spread out.
          *   *Utilitarian Response:* Classic utilitarianism ignores this, but prioritarianism might accept it without rejecting aggregation entirely.
          *   *Impact:* Moderate. Challenges simple aggregation but doesn't necessarily ban trade-offs.

      *   *Level 4: The Deontological/Rights Claim.* Persons are inviolable. There are side-constraints (rights) that prevent using someone merely as a means, regardless of the aggregate good.
