answer: |-
  ### Formal Restatement

  Let $\mathcal{H}$ be the set of complete possible life histories. Let $U: \mathcal{H} \to \mathbb{R}$ be a welfare function assigning real values to histories. Let $H_{actual}$ be the history realized by the agent's actual trajectory, and $H_{counter}$ be the history realized in the nearest possible world where the fatal act does not occur (or occurs later).

  **The Deprivation Account**
  In this vocabulary, the claim that "death is bad for the person who dies" is the claim that $U(H_{counter}) > U(H_{actual})$. Harm is defined as the difference $\Delta U = U(H_{counter}) - U(H_{actual})$. Since welfare is a property of the outcome (the complete history) rather than momentary experiences, the harm is located in the relation between the two histories. [Interpretive Choice: I am mapping the pre-theoretic "bad for" directly to the comparative utility difference between actual and counterfactual histories, assuming trans-world identity holds sufficiently to define $U$ over both.]

  **The Epicurean Argument**
  The Epicurean claim that "death is nothing to us" translates to a constraint on the domain of $U$ or the coherence of the counterfactual comparison.
  1.  **Domain Restriction:** If $U$ aggregates momentary welfare $u_t$ only over times $t$ where the subject exists, then the post-death segment of $H_{counter}$ contributes no value. If existence is a prerequisite for welfare bearers, $U$ is undefined for histories where the subject ceases to exist relative to the comparison class.
  2.  **Subject-Existence Constraint:** More strongly, the Epicurean argues that the relation "bad for" requires a subject to bear the harm at the time of the evaluation. [Interpretive Choice: I am interpreting the Epicurean "no subject" claim as a rejection of the trans-world identity required to compare $H_{actual}$ and $H_{counter}$, or as a insistence that harm must be time-indexed to subject existence, which contradicts the atemporal nature of $U(H)$.]
  On this reading, the Epicurean argues that $\Delta U$ is ill-defined because the bearer of $U(H_{actual})$ does not exist in the relevant segments of $H_{counter}$, or vice versa.

  ### Residue Report

  **1. The Timing Problem**
  *The Problem:* If death is bad, at what time $t$ does the harm occur? (Before death? After? At the moment?)
  *Translation Status:* **Dissolves.**
  In the decision-theoretic framework, harm is a property of the pair $(H_{actual}, H_{counter})$, not a state located at a time index $t$ within a history. $U$ is assigned to the complete path. Asking "when" the harm occurs is a category mistake analogous to asking "where" a number is located.
  *Verdict:* **Imprecision in the original claim.** The metaphysical literature presupposes that harm must be an event or state localized in time. The DT vocabulary demonstrates that if harm is comparative welfare loss over whole lives, temporal location is irrelevant. The failure is not in the DT vocabulary; rather, the DT framework reveals that the "timing" question arises only if one mistakenly models welfare as a sequence of time-slice states rather than a property of the history.

  **2. The Lucretian Symmetry**
  *The Problem:* Prenatal nonexistence is symmetric to posthumous nonexistence. If death is bad (deprivation of future goods), why is birth not bad (deprivation of past goods)?
  *Translation Status:* **Persists as an Axiomatization Problem.**
  In DT, both prenatal and posthumous nonexistence are modeled as counterfactual extensions of $H_{actual}$. Let $H_{actual}$ span $[t_{birth}, t_{death}]$. Prenatal harm compares $H_{actual}$ to $H_{pre}$ spanning $[t_{earlier}, t_{death}]$. Posthumous harm compares $H_{actual}$ to $H_{post}$ spanning $[t_{birth}, t_{later}]$. If $U$ is time-neutral and aggregative, symmetry holds: if extending life forward increases $U$, extending it backward should too.
  To capture the intuition that only posthumous nonexistence is bad, one must impose a **temporal bias axiom** on $U$ (e.g., future-bias) or a **identity constraint** (e.g., goods must be accessible to the agent's psychological continuity).
  *Verdict:* **Evidence of hidden premises in the original claim.** The DT vocabulary does not lack resources to state the problem; rather, it forces the metaphysician to explicitate the asymmetry. The original debate often treats the asymmetry as intuitive without specifying the structural feature of welfare that generates it. The residue here is not a defect of DT, but evidence that the deprivation account requires a specific, contested form of the utility function (time-biased) to avoid the Lucretian conclusion.

  **3. The Subject-Existence Constraint**
  *The Problem:* Can welfare be assigned to a history where the subject does not exist?
  *Translation Status:* **Hard Residue.**
  The Epicurean insists that "bad for" requires a subject. The DT framework assumes $U(H)$ is well-defined even if the subject's existence conditions vary across compared histories (trans-world identity). The Epicurean challenges the coherence of the counterfactual $H_{counter}$ itself.
  *Verdict:* **Metaphysical Constraint on the Vocabulary.** This is the only point where the DT vocabulary may be defective relative to the metaphysical concern. Standard decision theory takes trans-world identity as a primitive to enable counterfactual comparison. If the Epicurean is right that existence is a precondition for the *relation* of harm, then the domain of $U$ must be restricted to histories where the subject exists at all relevant times, or the comparison relation is undefined. This is not a distortion but a boundary condition: DT assumes comparability; Epicureanism denies it.

  \answer{The decision-theoretic translation dissolves the timing problem as a category error but exposes the Lucretian symmetry as an unresolved axiomatization problem regarding temporal bias and trans-world identity.}
