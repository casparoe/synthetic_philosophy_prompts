answer: |-
  # The Constructivity & Extraction Review Protocol (CERP)

  **Target Audience:** Staff Engineers reviewing formal proofs for code extraction.
  **Timebox:** 20 Minutes per Pull Request.
  **Goal:** Determine if a proof contains enough computational content to extract executable code (algorithms, bounds, witnesses) or if it relies on non-constructive logic that erases to "nothing" at runtime.

  ---

  ## Part 1: The Procedure

  Run these steps in order. If you hit a **STOP** condition, reject the PR or escalate.

  ### Step 1: Identify the Claim Type (2 mins)
  Look at the theorem statement. What is the top-level logical connective?
  *   **Existence ($\exists x, P(x)$):** Claims a value exists. *Requirement:* Must provide a method to compute $x$.
  *   **Disjunction ($A \lor B$):** Claims one of two things is true. *Requirement:* Must specify *which* one.
  *   **Totality/Termination (`forall input, exists output`):** Claims a function finishes. *Requirement:* Must provide a decreasing metric (fuel).
  *   **Negation/Safety ($\neg \text{Error}$):** Claims something bad *doesn't* happen. *Requirement:* Lower scrutiny (see Step 4).

  ### Step 2: Scan for Classical Axioms (5 mins)
  Search the proof file for keywords indicating classical logic. In most proof assistants (Coq, Lean, Agda, Isabelle), these are explicit imports or tactics.
  *   **Red Flag Keywords:** `Classical`, `EM` (Excluded Middle), `DN` (Double Negation), `Choice`, `Ax`, `Axiom`, `Postulate`, `sorry`, `admit`, `undefined`.
  *   **Red Flag Tactics:** `by_contra`, `contradiction` (when used to prove existence), `classical.choice`.
  *   **Action:** If found, go to **Step 3**. If none found, proceed to **Step 4**.

  ### Step 3: Contextualize the Classical Move (5 mins)
  If classical logic is present, is it harmless?
  *   **Harmless Context:** The classical move is used *only* on **decidable** types (e.g., `int`, `bool`, finite enums, fixed-length strings).
      *   *Why:* We can write `if x == y` in code. Excluded middle is computable here.
  *   **Harmless Context:** The classical move is used *only* to prove a **negative** property (Safety) that does not affect the return value of the extracted function.
      *   *Why:* Proofs of "no crash" are often erased during extraction; only the computational path matters.
  *   **Fatal Context:** The classical move is used to prove **Existence**, **Disjunction**, or **Termination** on **infinite/undecidable** types (e.g., `nat`, `list`, `real`, functions).
      *   *Why:* You cannot extract an `if` branch for a property you can't compute.
      *   **STOP:** Reject PR.

  ### Step 4: The "Build vs. Block" Test (5 mins)
  Read the high-level structure of the proof (skip low-level algebra).
  *   **Constructive (Pass):** The proof *builds* the object. You can trace a path where values are constructed, matched, or recursed.
      *   *Phrase to look for:* "We construct $x$ as...", "By induction on...", "Case analysis on..."
  *   **Non-Constructive (Fail):** The proof *blocks* the absence of the object.
      *   *Phrase to look for:* "Assume no such $x$ exists...", "Suppose for contradiction...", "By well-ordering principle..." (without a concrete metric).
      *   **STOP:** Reject PR.

  ### Step 5: Extraction Sanity Check (3 mins)
  Mentally compile the proof to code.
  *   Can you identify the loop guard or recursion termination condition?
  *   Can you identify the return value construction?
  *   If the proof relies on a "magic" lemma that has no body (opaque), does that lemma hide a classical axiom?
      *   **STOP:** If the termination metric or witness is opaque, Escalate.

  ---

  ## Part 2: The Cheat Sheet

  | Logical Move | Verdict | Contextual Exception |
  | :--- | :--- | :--- |
  | **Proof by Contradiction** (`¬A → ⊥ ∴ A`) | **RED FLAG** | Only okay if proving `¬B` (Safety). Never okay for `∃` or `A ∨ B`. |
  | **Excluded Middle** (`A ∨ ¬A`) | **YELLOW** | Okay on decidable types (`int`, `bool`). Fatal on `nat`, `list`, `func`. |
  | **Double Negation** (`¬¬A → A`) | **RED FLAG** | Almost always destroys computational content. |
  | **Induction/Recursion** | **GREEN** | The gold standard. Ensure the recursive call is on a "smaller" argument. |
  | **Case Analysis** (`match x`) | **GREEN** | Extracts to `if/switch` statements. |
  | **Non-Computable Choice** | **RED FLAG** | Selects an element from a set without a rule. Impossible to code. |
  | **Well-Founded Induction** | **YELLOW** | Okay *if* the ordering relation is computable. Fatal if abstract. |

  ---

  ## Part 3: Escalation & Judgment Calls

  **When to Escalate to a Logician:**
  1.  **Opaque Metrics:** The termination proof relies on a well-ordering relation that is defined axiomatically (no code body).
  2.  **Prop vs. Type Confusion:** The proof mixes logical propositions (`Prop`) with data types (`Type`/`Set`) in a way that suggests data is being smuggled out of a proof (logical erasure violation).
  3.  **Complex Classical Usage:** Classical logic is used, but the author claims it's "just for convenience" on a complex type (e.g., trees or graphs).

  **Judgment Calls (Not Procedural):**
  *   **Efficiency vs. Existence:** A proof might be constructive but yield an algorithm that is exponentially slow (e.g., brute-force search). The procedure validates *correctness*, not *performance*.
  *   **"Classical Convenience":** Sometimes authors use classical logic for intermediate lemmas that are later eliminated. If you can't verify the elimination in 20 mins, escalate.

  ---

  ## Part 4: Worked Cases

  ### Case 1: Sorting Routine (Existence of Sorted Permutation)
  **Claim:** `forall (L: List Int), exists (S: List Int), is_sorted(S) and is_permutation(S, L).`
  **Proof Method:** The author assumes there is *no* sorted permutation of `L`, derives a contradiction based on the properties of integers, and concludes a sorted permutation must exist.
  **Review:**
  1.  **Claim Type:** Existence (`exists S`). High scrutiny required.
  2.  **Axiom Scan:** Proof uses `by_contra` and `Classical.em`.
  3.  **Context:** The domain is `List Int` (infinite/undecidable in general context).
  4.  **Build vs. Block:** The proof *blocks* the absence. It does not construct `S` (e.g., via mergesort logic). It merely proves `S` cannot fail to exist.
  5.  **Extraction:** There is no algorithm here. Extracted code would require a "magic" function that returns a sorted list without sorting logic.
  **Verdict:** **FAIL.**
  **Author Feedback:** "This proof establishes truth, not computability. We cannot extract a sorting algorithm from a proof by contradiction. Please refactor to use structural induction or provide a constructive algorithm (e.g., merge sort) and prove *that* correct."
  *(Note: This is the answer the author won't like.)*

  ### Case 2: Parser (No Looping on Malformed Input)
  **Claim:** `forall (input: String), ~loops(parser, input).` (If input is malformed, parser does not infinite loop).
  **Proof Method:** Induction on the length of the input string. Shows that each parsing step consumes at least one character or terminates.
  **Review:**
  1.  **Claim Type:** Negation/Safety (`~loops`). Lower scrutiny, but termination is critical for total functions.
  2.  **Axiom Scan:** No classical axioms. Uses `fix` (recursion) and `match`.
  3.  **Context:** Induction is on `String.length` (natural number, decidable).
  4.  **Build vs. Block:** The proof tracks a decreasing metric (remaining characters).
  5.  **Extraction:** The recursion structure matches the proof structure. The "fuel" is implicit in the input size.
  **Verdict:** **PASS.**
  **Author Feedback:** "Proof is constructive. The decreasing metric (input length) is computable and visible in the function structure. Safe to merge."

  ### Case 3: Scheduler (Termination via Well-Ordering)
  **Claim:** `forall (state: SchedulerState), terminates(schedule, state).`
  **Proof Method:** Uses a well-ordering principle on `SchedulerState`. The proof states there exists a ranking function `rank: State -> Ordinal` that decreases, but `rank` is defined via an axiom `axiom rank_exists : ...`.
  **Review:**
  1.  **Claim Type:** Totality/Termination. High scrutiny.
  2.  **Axiom Scan:** Found `axiom rank_exists`. No definition body.
  3.  **Context:** The well-ordering is on a complex state record, not a simple `nat`.
  4.  **Build vs. Block:** The proof relies on the *existence* of a metric, not the *computation* of it.
  5.  **Extraction:** To extract code, the runtime needs to check the termination condition. If `rank` is axiomatic, the code cannot compute it. The extracted code might be an infinite loop in practice, despite the proof.
  **Verdict:** **ESCALATE.** (Procedure cannot settle if the axiom can be made computable).
  **Author Feedback:** "The termination metric is opaque. I cannot verify if this extracts to runnable code. Escalating to lead logician to determine if `rank` can be defined constructively."

  ---

  ## Part 5: What This Procedure Cannot Settle

  Be plain with your team: This checklist is a filter, not a solver.

  1.  **Complexity Bounds:** A proof can be fully constructive (Pass) but yield an algorithm that takes $O(2^n)$ time. This procedure validates *that* code exists, not *how fast* it runs.
  2.  **Hidden Classical Lemmas:** If a colleague imports a library lemma that *looks* constructive but was proved classically deep in the dependency tree, this 20-minute scan might miss it. (Mitigation: Rely on the proof assistant's axiom tracking if available).
  3.  **Propositional vs. Data Erasure:** In some systems (like Coq), proofs in `Prop` are erased. If a witness is constructed inside `Prop` but needed in `Type`, extraction fails. This procedure flags obvious axiom usage but may miss subtle universe inconsistencies.
  4.  **Semantic Correctness:** A constructive proof guarantees the code *does something* defined by the spec. It does not guarantee the spec matches the real-world physics or requirements (the "verification gap").

  **Final Instruction to Team:**
  "If the procedure says **FAIL**, do not merge. If it says **ESCALATE**, tag the logic lead. If it says **PASS**, you are cleared to merge, provided the automated CI extraction succeeds."
