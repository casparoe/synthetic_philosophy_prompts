  I'm in a philosophy of mind seminar and we've spent a week on IIT, and I'm realizing I don't have a clean list of what any theory in this area is even supposed to get right before I compare it to global workspace or higher-order thought. So write me the desiderata: what must an adequate theory of consciousness — or a measure like Φ — deliver? For each requirement, give the case or finding that motivates it (split-brain, the cerebellum having ~80% of your neurons while damage to it doesn't wipe out consciousness, dreamless sleep vs. general anesthesia, locked-in patients, the level/content distinction, the binding problem, why a camera sensor with high information isn't conscious, etc.), and say which requirements are non-negotiable and which are just one camp's pet commitments (is integration over mere information non-negotiable? is exclusion? intrinsic existence?). Flag any pairs that probably can't be jointly satisfied — I especialy want to know whether requiring the measure to be computable conflicts with what IIT is trying to capture. Then score IIT, global workspace theory, and higher-order thought against the list, briefly.

