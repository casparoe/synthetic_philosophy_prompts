  - "requirements": array of objects, each with "requirement" (short name), "case" (the motivating case or finding), "negotiable" (true or false), and "why" (a sentence or two)
  - "tensions": array of objects, each with "pair" (two requirement names) and "reason"
  - "scorecard": object keyed by theory name ("IIT", "global workspace", "higher order"), where each value is an object mapping requirement names to a one-line verdict
