answer: |-
  The stagnation of the Frankfurt debate is best diagnosed not as a substantive metaphysical disagreement, nor merely as a verbal dispute, but as a **normative-functional disagreement** (categorized here as `"other"`). While the debate began as a metaphysical challenge to incompatibilism (does determinism rule out responsibility?), it has evolved into a dispute about the *purpose* of holding agents responsible.

  ### Diagnosis: Normative-Functional Disagreement

  The impasse exists because the two sides are optimizing for different values within the concept of moral responsibility. They agree on the "physics" of the Frankfurt cases (the neural states, the counterfactual intervener, the lack of robust alternatives), but they disagree on what the concept of responsibility is supposed to *do*.

  1.  **PAP Defenders (The Fairness Camp):** For this side, moral responsibility is fundamentally a license for sanctions (blame, punishment, resentment). The function of the concept is to protect agents from unfair treatment. If an agent could not have done otherwise, sanctioning them is akin to punishing a natural force or a victim of coercion. Their commitment is to **Regulative Control**: responsibility requires the power to change the future.
  2.  **Frankfurt Defenders/Actual Sequence Theorists (The Agency Camp):** For this side, moral responsibility is fundamentally a matter of attribution. The function of the concept is to identify which actions truly belong to the agent. If the action issues from the agent's own reasons and mechanisms (the "actual sequence"), the existence of a counterfactual intervener is irrelevant. Their commitment is to **Sourcehood**: responsibility requires that the action originates in the agent, regardless of alternative pathways.

  This explains the "flicker" stalemate. PAP defenders grasp at any alternative possibility (flickers) because *any* alternative restores the logical space for "could have done otherwise," preserving the fairness condition. Frankfurt defenders dismiss flickers as irrelevant because those alternatives do not change the *actual source* of the action, preserving the attribution condition. They are talking past each other because one side is asking, "Was it fair to blame him?" while the other asks, "Did the action come from him?"

  ### Commitments and Concessions

  **PAP Defenders** are committed to the view that avoidability is a necessary condition for the *justification* of reactive attitudes. To move forward, they would need to concede that "could have done otherwise" might not be a binary metaphysical switch but a graded capacity, or that there are forms of responsibility (e.g., attributability) that do not entail liability to sanctions.

  **PAP Critics (Frankfurtians)** are committed to the view that the actual history of the action is sufficient for responsibility. To move forward, they would need to concede that while sourcehood is sufficient for *praise* or *attribution*, it might not be sufficient for *hard blame* or *punishment* in the absence of alternative possibilities. They must acknowledge that the "fairness" intuition driving PAP is not merely a confusion but tracks a legitimate normative constraint on specific practices of holding answerable.

  ### Pathways to Progress

  New Frankfurt-style cases will not solve this, as the literature is already saturated with them. Formal results are unlikely to help, as the dispute is normative, not logical. Progress requires a **conceptual distinction** that dissolves the monolithic concept of "moral responsibility."

  The most promising avenue is the distinction between **Attributability** (does this action reflect the agent's character/values?) and **Accountability** (is the agent liable to sanctions/demands?).
  *   If responsibility is split this way, Frankfurt cases show that **Attributability** does not require PAP (the action still reflects the agent's will).
  *   However, PAP defenders may be correct that **Accountability** (specifically the kind that justifies punishment) *does* require alternative possibilities.

  Progress would look like a consensus that Frankfurt cases refute PAP for *attributability* but leave PAP intact for *accountability*. This validates the core intuition of both sides without requiring one to surrender their fundamental normative commitment.

