answer: |-
  Here is a complete lesson plan designed to replicate the tension of the "Copy" Prisoner's Dilemma in a classroom setting. It is structured to let students experience the intuitive pull of superrationality before exposing the causal objections.

  # Activity Title: The Mirror Algorithm

  **Class Profile:** Upper-level seminar (16 students).
  **Duration:** 100 minutes.
  **Objective:** To viscerally demonstrate the conflict between *causal independence* (my choice cannot physically move their hand) and *logical correlation* (my reasoning determines their reasoning).

  ## 1. Materials & Payoff Scheme

  **Materials:**
  *   16 Index cards (two colors, e.g., 8 Blue, 8 Red, distributed randomly).
  *   Handout: "The Payoff Matrix."
  *   Handout: "Reasoning Log" (a slip of paper for written justification).
  *   Projector/Board for displaying instructions.

  **Payoff Scheme (Seminar Participation Points):**
  Do not use real money. Use points that contribute to a "Participation/Engagement" grade component. This ensures stakes are non-trivial but ethically safe.
  *   **Total Possible:** 10 Points per round.
  *   **Both Cooperate (C, C):** 8 points each.
  *   **Both Defect (D, D):** 2 points each.
  *   **You Defect, They Cooperate (D, C):** 10 points (You), 0 points (Them).
  *   **You Cooperate, They Defect (C, D):** 0 points (You), 10 points (Them).

  ## 2. Timeline (100 Minutes)

  ### Phase 1: The Baseline (20 Minutes)
  1.  **Setup (5 mins):** Distribute the Payoff Matrix. Explain the rules of the Prisoner's Dilemma clearly. Ensure they understand the dominance of Defection in a standard one-shot game (i.e., "No matter what they do, you get more points by Defecting").
  2.  **Round 1 (10 mins):** Pair students randomly (use the colored index cards to match Blue 1 with Red 1, etc.). Instruct them to sit back-to-back or otherwise ensure no communication. They write **C** or **D** on a card and submit it.
  3.  **Collection (5 mins):** Collect cards. Do **not** reveal outcomes yet. Tell them points will be tallied at the end.

  ### Phase 2: The "Copy" Condition (30 Minutes)
  1.  **The Instruction (5 mins):** Gather the class. Give the following script verbatim to set the epistemic frame:
      > "For Round 2, we are changing the condition. You will not be paired randomly. You are now paired with your **Reasoning Twin**.
      >
      > "We have analyzed your prior work in this seminar. Your partner is the student whose reasoning dispositions, risk tolerance, and strategic intuition are closest to your own. You have the same information. You have the same incentives.
      >
      > "Here is the critical constraint: **You must assume that whatever logical path you take to reach your decision, they are taking the exact same path.** If you find a reason to Cooperate, they find that same reason. If you find a reason to Defect, they find that same reason. You are effectively running the same mental algorithm on the same data."
  2.  **The Reasoning Log (10 mins):** Before they make their choice, hand out the "Reasoning Log." They must answer one question in writing:
      *   *"Does your choice influence your partner's choice? Explain how or why not."*
      *   *Then make your choice (C or D).*
      *   *Crucial Rule:* They cannot submit the choice card without the log.
  3.  **Round 2 Execution (10 mins):** Pair them again (ostensibly with their 'Twin,' though in practice, you can pair them randomly or with themselves to simulate the condition). Collect cards and logs.
  4.  **Silent Reflection (5 mins):** Ask them to write down privately: "Did you change your choice from Round 1 to Round 2? Why?"

  ### Phase 3: Small Group Diagnosis (25 Minutes)
  1.  **Grouping:** Break into four groups of four.
  2.  **Task:** Give them three prompts to discuss. Tell them **not** to use technical terms like "Causal Decision Theory" yet.
      *   *Prompt A:* "In Round 1, why did you choose what you chose? Did you feel your choice could change the other person's mind?"
      *   *Prompt B:* "In Round 2, did the 'Twin' instruction change your logic? Did it feel like your choice now mattered more, or was it still the same?"
      *   *Prompt C:* "One student says: 'Choosing Cooperate makes them Cooperate.' Another says: 'Choosing Cooperate just means we both lose points if they Defect.' Who is making a mistake?"
  3.  **Report Back:** Each group shares one insight that caused disagreement within their group.

  ### Phase 4: The Debrief & Theory Mapping (25 Minutes)
  This is where you resolve the argument you had with your friend by mapping their classroom experience to the philosophical frameworks.

  **Step 1: The Data Reveal**
  *   Reveal the Round 1 and Round 2 results.
  *   *Likely Outcome:* Round 1 will be high Defection. Round 2 will show a split (some switch to Cooperate, some stubbornly Defect).

  **Step 2: Mapping the Intuitions (No Jargon Yet)**
  *   Ask the Round 2 Defectors: "Why did you defect even knowing they were a twin?"
      *   *Target Answer:* "Because my choice doesn't *cause* theirs. We are in different bodies. I can't reach across the table."
      *   *Label:* Write **Causal Independence** on the board. Explain this is the foundation of **Causal Decision Theory (CDT)**. It focuses on the physical causal chain. My vote doesn't cause the election result; it merely correlates with it.
  *   Ask the Round 2 Cooperators: "Why did you cooperate?"
      *   *Target Answer:* "Because if I reason to Cooperate, they reason to Cooperate. We are locked together."
      *   *Label:* Write **Logical Correlation** on the board. Explain this is the foundation of **Evidential Decision Theory (EDT)** and **Superrationality**. It focuses on the news your choice brings. If I choose C, that is *evidence* they chose C.

  **Step 3: Resolving the "Magic" Accusation**
  *   Address the friend's complaint directly.
  *   **Say:** "My friend argued that cooperating was 'magical thinking.' In Round 1, they are right. There is no magic cable connecting your hands. But in Round 2, the 'Twin' condition changes the *logic*, not the physics."
  *   **Draw the Distinction:**
      *   **Causal View:** "I choose C $\rightarrow$ Does this *force* them to choose C?" (No).
      *   **Superrational View:** "We are both solving Equation X. If I solve for C, does the solution to Equation X change for them?" (No, but the *output* is identical).
  *   **Conclusion:** "The 'magic' isn't that your hand moves theirs. It's that you are both instances of the same reasoning process. The disagreement in our seminar tonight is usually about whether 'rationality' requires maximizing based on *causes* (CDT) or based on *correlations* (EDT/Superrationality)."

  ## 3. Predictable Failures (And How to Handle Them)

  **Failure 1: The "I'm Special" Objection**
  *   *What happens:* A student says, "I know I'm a twin, but I'm going to Defect to get the 10 points. I bet they will Cooperate."
  *   *Why:* They reject the premise that they are identical reasoners. They believe they can "break the symmetry."
  *   *Fix:* In the debrief, highlight this. "This student assumed they could reason differently than their twin. But if they are truly identical, they both think 'I'm special.' If they both think that, they both Defect, and they both get 2 points." This illustrates the **Nash Equilibrium** vs. the **Superrational Outcome**.

  **Failure 2: Cynicism about the "Twin" Claim**
  *   *What happens:* Students don't believe you actually paired them with a twin. They treat Round 2 exactly like Round 1.
  *   *Why:* The instruction feels like a bluff.
  *   *Fix:* Acknowledge this in the debrief. "In a real classroom, I cannot clone you. That is the limitation of this exercise. You are physically distinct. The exercise asks you to *simulate* the logic of a copy. If you couldn't suspend disbelief, you defaulted to Causal Decision Theory, which is the safe bet in the real world."

  **Failure 3: Moralizing the Choice**
  *   *What happens:* Students cooperate because "it's the nice thing to do," not because of the copy logic.
  *   *Why:* Confusing morality with rationality.
  *   *Fix:* In the Reasoning Log analysis, filter out moral claims. "If you cooperated because you wanted to be kind, that's ethics, not decision theory. Did anyone cooperate *strictly* to maximize points based on the Twin logic?"

  ## 4. The Critical Limitation (For the Debrief)

  You must explicitly address what the classroom *cannot* reproduce. This is the most important part for an upper-level seminar.

  **Say this to the class:**
  > "In this classroom, the 'Copy' condition was an instruction, not a metaphysical reality. You *could* have chosen differently than your partner. You have free will to break the symmetry.
  >
  > "In the philosophical case my friend and I argued about, the players are **true copies**. They are not just similar; they are identical instances. In that case, it is logically impossible for one to Cooperate and the other to Defect. It would be like a calculator displaying '4' for `2+2` and another identical calculator displaying '5' for `2+2`.
  >
  > "My friend's objection (Causal Decision Theory) wins in the **real world**, because you are never truly playing against a copy. Your choice never causally influences a stranger's choice.
  > "My objection (Superrationality) wins in the **thought experiment**, because if the agents are truly identical, the choices *must* correlate.
  >
  > "The confusion arises when we apply the logic of the thought experiment (Superrationality) to the real world (Causal Independence). That is where the 'magic thinking' accusation comes from."

  ## 5. Why This Works for Your Argument

  This activity validates both sides of your 2 AM argument:
  1.  **Validates your Friend:** By showing that in Round 1 (real world conditions), Defection is the dominant strategy and "reaching across the table" is impossible.
  2.  **Validates You:** By showing that under the "Twin" constraint, the reasoning shifts. It demonstrates that "If I choose C, they choose C" is not a claim about *causation* (magic), but a claim about *logical consistency* (algorithmic identity).

  By forcing them to write the "Reasoning Log," you make the internal conflict explicit. You will likely find students writing things like, *"I know my choice doesn't cause theirs, but if I defect, I'm predicting they defect, and I don't want that outcome."* That sentence is the exact tension between CDT and EDT you wanted to resolve.
