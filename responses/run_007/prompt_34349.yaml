answer: |-
  This is a profound question that cuts to the heart of metaphysics, conservation ethics, and legal theory. You have correctly identified that we do not apply a single, universal standard of "identity over time" across different domains. Instead, we apply **context-dependent criteria of identity.**

  Here is an analysis of what view of identity ship conservation commits to, how it relates to the Ship of Theseus, and why we are (perhaps justifiably) inconsistent compared to art and law.

  ### 1. The View of Identity: Continuity and Process
  The practice of historic ship conservation does not commit to a **Material Constitution** view of identity (the idea that an object is identical to the sum of its atoms). If it did, the *USS Constitution* would have ceased to exist the moment the first plank was swapped.

  Instead, it commits to a view of **Spatio-Temporal Continuity** combined with **Functional Form**.
  *   **Spatio-Temporal Continuity:** The ship is viewed as a continuous entity existing through time. As long as there is no break in its existence (e.g., it is not destroyed and then rebuilt from scratch), it remains the same object, even as its matter changes. This is similar to how we view human bodies: our cells replace themselves entirely every few years, yet we consider you the same person you were a decade ago.
  *   **Process Ontology:** Curators treat the ship not as a static *substance*, but as a *process* or an *event*. The "ship" is the ongoing activity of maintaining a specific structure in a specific location for a specific purpose.

  By this metric, the *Constitution* is not a collection of wood; it is a continuous history of service and preservation. The replacement parts are seen as the mechanism by which the continuity is maintained, not as a break in identity.

  ### 2. Does This Solve Theseus, or Is It "Institutional Say-So"?
  It does not solve the metaphysical Ship of Theseus problem; rather, it **dissolves** it through **Social Ontology.**

  Philosophically, the Ship of Theseus has no single "correct" answer. There is no fact of the matter in the universe that dictates when an object becomes a new object. Therefore, the decision is necessarily social.
  *   **Institutional Authority:** You asked if this relies on "institutional say-so." In a sense, yes, but not arbitrarily. Philosopher John Searle describes this as a "Status Function." The Navy and the curators have the collective authority to assign the status "USS Constitution" to this specific continuous structure.
  *   **The Constraint of Continuity:** However, this authority is not magic. They cannot burn the *Constitution* to ash, build a new one from fresh timber, and declare it the *Constitution*. The "say-so" is constrained by the requirement of **gradualism**. The identity is preserved because the transition from old material to new material is incremental and continuous.

  So, it presupposes a **Pragmatic Solution**: Identity is whatever allows us to maintain the historical narrative without breaking the chain of causality. It treats the ship as a "living" vessel that ages and heals, rather than a fossil that must remain static.

  ### 3. The Inconsistency with Art (The Rembrandt)
  You are right to note the inconsistency. If a conservator painted over a Rembrandt to preserve the image, we would call it a destruction of the art. Why the double standard?

  The difference lies in **what we value** in the object (Aesthetics vs. History/Function).
  *   **Autographic Art (Rembrandt):** In philosophy of art (specifically Nelson Goodman's distinction), paintings are *autographic*. Their value lies in the specific history of their production—the literal trace of the artist's hand. The specific arrangement of pigment *is* the work. If you replace the pigment, you destroy the evidence of the artist's action.
  *   **Functional Artifacts (Ships):** Ships are valued for their design, their history of service, and their physical presence. The specific plank of oak is not expressive; it is structural. We value the *Constitution* because it floated in 1812, not because a specific tree was cut down in 1812.

  **The Inconsistency:** We are inconsistent because we treat the painting as a **record of an event** (the painting act) and the ship as a **participant in events** (naval battles, voyages).
  *   If you treat the ship as a sculpture (purely aesthetic), replacing the wood *would* destroy it.
  *   If you treat the painting as a functional image (like a digital file), restoring it would be fine.
  *   Because we categorize them differently, we apply different identity rules.

  ### 4. The Inconsistency with Law (The Laptop)
  The legal system handles this via **Tracing and Registration.**
  *   **Serial Numbers:** In law, identity is often tied to a serial number (usually on the motherboard). If you replace the motherboard, the legal "identity" of the laptop often changes, because the unique identifier is gone.
  *   **Value Depreciation:** Law cares about value. If you replace the screen, the value remains mostly with the original chassis. If you replace the motherboard, the "brain" is gone, and legally, it may be considered a different device or a "reconstructed" one.

  **The Inconsistency:** The law is inconsistent with ship conservation because the law is **reductionist**. It needs a bright-line rule for ownership and insurance. It cannot handle the philosophical nuance of "gradual replacement."
  *   **Ship:** "It is the same ship because we never stopped caring for it."
  *   **Laptop:** "It is a different laptop because the serial number changed."

  ### 5. Conclusion: Are We Just Being Inconsistent?
  We are inconsistent, but we are **justifiably inconsistent.**

  We do not have one metaphysical theory of identity that we apply to everything. Instead, we have a **pluralistic theory of identity** based on the *purpose* of the object:
  1.  **For Biological/Social Entities (Humans, Ships, Nations):** We use **Continuity**. (You are the same person; the *Constitution* is the same ship).
  2.  **For Aesthetic Traces (Paintings, Manuscripts):** We use **Material Constitution**. (The original ink/paint is essential).
  3.  **For Property Law (Laptops, Cars):** We use **Registration/Identifier**. (The VIN/Serial Number defines the object).

  The ship museums commit to the view that **historical presence outweighs material originality.** They prioritize the *continuity of the story* over the *continuity of the stuff.*

  If you told a naval historian, "Actually, that's a replica because 90% of the wood is new," they would correct you: "It is the original ship because it has been in continuous existence since 1797." They are not making a scientific claim about atoms; they are making a historical claim about **unbroken lineage.**

  So, to answer your final question: The practice relies on **institutional say-so bounded by continuous existence.** It is inconsistent with art and law, but only because we value ships, paintings, and laptops for fundamentally different reasons. We are not failing to solve the Ship of Theseus; we are simply acknowledging that "identity" is a tool we use differently depending on the job at hand.
