prompt: |-
  ok so i'm teaching a grad seminar on formal epistemology and we're about to hit the lottery paradox and the preface paradox. before i dump a bunch of theories on them (kyburg, levi, etc.), i want to give them a clear picture of what any theory of rational belief is supposed to *do* here. i want a list of desiderata: what a theory of rational belief (or acceptance, or whatever you want to call the attitude) has to get right to handle these paradoxes adequately. for each desideratum, give the case or consideration that motivates it. then flag which ones you think are genuinely non-negotiable and which are just preferences of one camp or another. and then — here's the part i'm most interested in — tell me whether any subset of these desiderata is jointly unsatisfiable, because if so, that's the real lesson of the paradoxes. if you can, briefly score how kyburg, levi, and a non-probabilistic view (like a defeasible-reasoning approach) do against the list. keep the weight on the desiderata themselves, not the scoring.
