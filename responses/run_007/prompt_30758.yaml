answer: |-
  The stalemate between moral particularism and generalism is not merely a failure of imagination or argumentative stamina; it is a structural impasse caused by a **category error regarding the modal strength of moral principles**, compounded by an **equivocation on the term "reason."**

  Your hypothesis—that the dispute rests on a functional difference (guidance vs. justification)—is insightful but incomplete. It captures the *motivation* for each side but misses the *metaphysical commitment* that sustains the deadlock. The Generalist typically argues that without general principles, moral judgment lacks rational grounding (justification); the Particularist argues that principles cannot capture the nuance of moral perception (guidance/phenomenology). However, both sides make metaphysical claims about the nature of reasons. The real disagreement is about **Explanatory Priority**: Does the general fact ground the particular judgment, or does the particular configuration ground the generalization?

  Here is a diagnosis of the dialectic, an engagement with the specific moves you cited, and a proposal for what genuine progress would require.

  ### 1. Diagnosing the Disagreement: Metaphysics, Semantics, or Method?

  The debate appears metaphysical (are there invariant moral facts?), but it functions methodologically (how do we theorize about morality?).

  *   **The Metaphysical Layer:** Both sides generally accept **supervenience** (no moral difference without a non-moral difference). They disagree on **uniformity**. The Generalist claims supervenience implies a uniform mapping (pain *always* contributes negatively, even if outweighed). The Particularist claims supervenience allows variable mapping (pain *sometimes* contributes negatively, sometimes positively, sometimes not at all).
  *   **The Semantic Layer:** The word "principle" is doing too much work.
      *   For the **Generalist**, a principle is often a *ceteris paribus* generalization (a defeasible law).
      *   For the **Particularist**, a principle is often understood as an *exceptionless* codification (a strict law).
      *   **The Stalemate:** The Generalist defends the existence of *ceteris paribus* laws against the Particularist's attack on *exceptionless* laws. When the Generalist retreats to *ceteris paribus*, the Particularist claims the clause is a placeholder for "context," rendering the principle trivial.
  *   **The Methodological Layer:** This is where your hypothesis lands. The Generalist views theory as **systematization** (justification/explanation); the Particularist views theory as **description** (capturing the phenomenology of judgment).

  **Verdict:** The disagreement is **metaphysical in content but methodological in origin.** They are arguing about the structure of moral reality (metaphysics) because they disagree on what moral theory is supposed to achieve (methodology).

  ### 2. Engaging the Dialectical Moves

  To see why the debate stalls, we must look at how each side neutralizes the other's core arguments.

  #### A. Valence-Switching vs. Specification
  *   **The Move:** The Particularist (e.g., Dancy) argues that a feature like "causing pleasure" can be a reason for action in one context (comforting a friend) and a reason against in another (taking pleasure in suffering).
  *   **The Generalist Counter:** The Generalist (e.g., McNaughton, Hooker) absorbs this by **specifying the feature**. "Pleasure *simpliciter*" isn't the reason; "Pleasure *taken in another's suffering*" is the reason. The valence is stable relative to the *fully specified* feature.
  *   **The Particularist Counter:** This is **gerrymandering**. If you must specify the context into the feature itself to maintain stable valence, you haven't found a principle; you've just renamed the particular situation. The "principle" becomes: "Do what is right in this context."
  *   **Diagnosis:** This is a dispute about **Individuation of Reasons.** The Generalist assumes reasons can be atomized and isolated; the Particularist assumes reasons are inherently holistic. Progress is impossible until they agree on whether a "reason" is a standalone entity or a relational property.

  #### B. Rossian *Prima Facie* Duties
  *   **The Move:** Generalists appeal to W.D. Ross. A duty (e.g., promise-keeping) is *prima facie* binding; it has a default valence that can be overridden by other duties.
  *   **The Particularist Counter:** This is a **placeholder for sensitivity.** To say a duty is *prima facie* is just to say "usually, this matters." It offers no rule for *when* it is overridden. Therefore, the "principle" does no normative work; the work is done by the agent's perception of the specific context.
  *   **Diagnosis:** This highlights the **Guidance vs. Justification** split. The Rossian principle justifies the judgment *ex post facto* (explaining why the promise mattered), but it fails to guide the judgment *ex ante* (telling you when the promise is overridden). The Particularist demands guidance; the Generalist settles for justification.

  #### C. Holism and Contributory Reasons
  *   **The Move:** Generalists distinguish between **contributory reasons** (a feature counting in favor) and **overall reasons** (the final verdict). They argue holism is true at the overall level but false at the contributory level.
  *   **The Particularist Counter:** This distinction is **metaphysically suspect.** If a feature's contributory weight changes based on context (e.g., pain counts for less if it is deserved), then the contributory reason itself is holistic. You cannot isolate a "contribution" independent of the background.
  *   **Diagnosis:** This is the crux of the **Metaphysical Dispute.** The Generalist needs atomistic contributory reasons to build principles. The Particularist argues that moral properties are emergent properties of configurations, not sums of atomic parts.

  ### 3. Testing the Hypothesis: Guidance vs. Justification

  Your hypothesis is that the stalemate arises from differing views on the function of a principle (guidance vs. justification).

  *   **Where it holds:** The Generalist is often satisfied if a principle *explains* why an action was right (justification), even if it requires complex *ceteris paribus* clauses that make it useless for decision-making (guidance). The Particularist insists that if a principle cannot guide action without already possessing the moral wisdom it purports to teach, it is vacuous.
  *   **Where it fails:** Jonathan Dancy (the leading particularist) does not merely argue that principles are bad for guidance; he argues they are **false.** He claims the metaphysics of reasons is holistic. Conversely, some Generalists (like Kantians) argue principles are constitutive of moral agency, not just tools for guidance or justification.
  *   **Refinement:** The disagreement is not just about function, but about **Rationality.** The Generalist equates rationality with **consistency and universality** (which require principles). The Particularist equates rationality with **responsiveness to relevance** (which requires sensitivity). They are defining "moral competence" differently.

  ### 4. What Would Count as Progress?

  The debate will remain stationary as long as "principle" and "reason" remain ambiguous. Progress requires shifting the terrain from "Are there principles?" to more precise questions.

  #### A. A Shared Criterion for *Ceteris Paribus* Clauses
  Currently, the Generalist uses *ceteris paribus* (cp) clauses to save principles from counterexamples, and the Particularist dismisses them as trivial.
  *   **Progress Condition:** A formal account of what makes a cp-clause **non-trivial.**
      *   *Trivial:* "Pain is bad, *unless it isn't*."
      *   *Non-Trivial:* "Pain is bad, *unless it is outweighed by a greater good*."
      *   If the Generalist can specify the *conditions of defeat* independently of the outcome, the principle has content. If they cannot, the Particularist wins.

  #### B. An Agreed Taxonomy of Reasons vs. Enablers
  Much of the valence-switching debate turns on whether a feature is a *reason* or an *enabler* (a condition that allows another feature to be a reason).
  *   **Progress Condition:** A shared ontology of normative relations.
      *   If Generalists concede that many features function as **enablers/disablers** rather than contributory reasons, the scope of "principles" shrinks, moving closer to particularism.
      *   If Particularists concede that **core reasons** (e.g., well-being) have stable valence even if their activation is context-dependent, the scope of "generalism" expands.

  #### C. The "Finite Codification" Challenge
  The Particularist claims no finite codification is possible. The Generalist claims one is possible in principle, even if complex.
  *   **Progress Condition:** A **complexity argument.**
      *   Does the Generalist need to produce the code? No.
      *   Do they need to prove it is *possible*? Yes.
      *   Progress would be a formal proof (or disproof) that the supervenience of the moral on the non-moral is **computable.** If moral judgment is provably non-computable (due to holistic complexity), the Generalist's metaphysical claim fails. If it is computable, the Particularist's claim that it is *uncodifiable* fails.

  ### 5. Replacement Questions

  If the diagnosis is correct—that the sides are talking past each other due to semantic equivocation and modal mismatch—the question "Are there moral principles?" should be retired. It should be replaced by the following three questions:

  1.  **The Uniformity Question:** "Is the supervenience of moral properties on non-moral properties **uniform** (the same non-moral features always contribute the same moral weight) or **variable** (weight depends on configuration)?"
      *   *Why:* This bypasses the word "principle" and targets the metaphysical core. Generalists argue for uniformity; Particularists for variability.
  2.  **The Atomism Question:** "Are contributory reasons **atomistic** (possessing weight independent of context) or **holistic** (weight determined by context)?"
      *   *Why:* This forces the Generalist to defend the existence of isolatable moral atoms. If they concede holism at the contributory level, the debate dissolves into a dispute about terminology.
  3.  **The Explanatory Priority Question:** "Does the general fact explain the particular judgment, or does the correctness of the particular judgment explain the generalization?"
      *   *Why:* This addresses your hypothesis about function. It clarifies whether principles are the *ground* of morality (Generalism) or the *byproduct* of moral competence (Particularism).

  ### Conclusion

  The stalemate is an artifact of the Generalist defending a **weak, defeasible notion of principle** against a Particularist attacking a **strong, exceptionless notion of principle**, while both claim to be discussing the same object.

  Progress requires the Generalist to admit that if principles are sufficiently defeasible to handle valence-switching, they may lose their **action-guiding** force (conceding the epistemological point). It requires the Particularist to admit that if supervenience holds, there must be *some* stable mapping between non-moral and moral properties, even if complex (conceding the metaphysical point).

  Until the debate shifts from "Principles: Yes or No?" to "What is the **modal strength** and **explanatory direction** of moral supervenience?", the dialectic will remain stationary. The dispute is not about whether morality exists, but about whether the structure of moral reality is **legislative** (rule-based) or **ecological** (system-based). Recognizing this distinction is the only way to break the deadlock.
