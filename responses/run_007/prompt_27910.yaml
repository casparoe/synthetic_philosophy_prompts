answer: |-
  # Q&A Prep Sheet: Defending Lewisian Modal Realism
  **Audience:** Actualist Metaphysicians & Platonist Phil Math
  **Strategy:** Own the cost, sell the theoretical utility. Do not apologize for the ontology; apologize for the *necessity* of it.

  ### Up-Front Concessions
  *Do not wait for them to drag these out of you. Put these in your closing remarks or the intro to signal good faith.*
  1.  **Quantitative Parsimony:** Admit freely that your ontology is quantitatively extravagant. Do not try to argue there "aren't really" that many worlds. The cost is real.
  2.  **Pre-Theoretic Intuition:** Concede that the indexical analysis of "actual" violates pre-theoretic usage. You are offering a revisionary metaphysics, not a descriptive linguistics.
  3.  **Epistemic Access:** Acknowledge that causal isolation makes knowledge of worlds problematic. Your answer is Quinean (inference to best explanation), not perceptual. Own that this is a abductive leap.

  ---

  ### The Hit List (Ordered by Damage Potential)

  #### 1. The Parsimony Objection (The Metaphysician's Favorite)
  **The Question:** "You claim qualitative parsimony outweighs quantitative parsimony. But positing an infinity of concrete universes is an ontological cost of a different magnitude than positing one. Why should we accept a theory that maximizes existence claims just to save on primitive ideology? Isn't that buying a theoretical virtue at the price of credibility?"

  **The Reply (2 mins):**
  *   **Distinguish Costs:** Quantitative parsimony (how many things) matters less than qualitative parsimony (how many *kinds* of things). Actualists posit concrete particulars, abstract propositions, haecceities, and primitive modal operators. I posit only concrete particulars and spatiotemporal relations.
  *   **The Trade-off:** My ontology is larger, but my ideology is leaner. I reduce modality to quantification over concrete existents. You keep modality primitive or rely on abstract representers that presuppose modality.
  *   **The Payoff:** Theoretical unity. I give a uniform semantics for counterfactuals, probability, properties, and contents. You need separate machinery for each. The "credibility" cost is one-time; the ideological complexity compounds forever.

  **Where it's Weakest:**
  Many metaphysicians simply reject the claim that qualitative parsimony trumps quantitative. If they view existence as the primary ontological commitment, you lose this exchange. You are asking them to change their scorecard, not just win on the current one.

  #### 2. The Epistemological Challenge (The Phil Math Platonist's Favorite)
  **The Question:** "I accept abstracta, but they are causally inert by nature. You posit *concrete* entities that are causally isolated *by contingency*. If we share no causal chain with these worlds, how do we refer to them? How do we have beliefs about them that aren't just lucky guesses? This looks like a Benacerraf problem for concrete objects."

  **The Reply (2 mins):**
  *   **Quinean Criterion:** We don't need causal contact for every posit. We posit electrons and sets for theoretical utility. Worlds earn their keep by systematizing our modal discourse.
  *   **Reference via Description:** We refer to them via the theory that posits them. "The world where donkeys talk" picks out a concrete universe via its description, much like "the smallest infinite cardinal" picks out a set.
  *   **Isolation is Structural:** Causal isolation isn't an accident; it's part of the definition of a world (maximal spatiotemporal interrelatedness). We know *that* they exist via inference; we know *what* they are via the principle of recombination.

  **Where it's Weakest:**
  This is your soft underbelly. Platonists accept causal isolation for abstracta because abstracta are *necessary*. Your worlds are *contingent* existents. Explaining how we have reliable beliefs about contingent, isolated concreta is much harder than explaining knowledge of necessary abstracta. Expect them to press the "reliability" angle hard.

  #### 3. The "Primitive Modality" Pushback (Your Core Argument)
  **The Question:** "You say Actualists leave modality primitive. But doesn't your 'Principle of Recombination'—that any pattern of instantiation can be found somewhere—just smuggle modality back in? To say a world *can* exist is already modal. Haven't you just pushed the primitive modality back one step to the plurality itself?"

  **The Reply (2 mins):**
  *   **Non-Modal Existence:** The plurality of worlds exists *simpliciter*. It is not "possible" that they exist; they *do* exist. There is no modal operator on the existence of the pluriverse.
  *   **Recombination as Guide:** Recombination isn't a modal constraint on creation; it's a descriptive generalization about the distribution of properties across the existing plurality.
  *   **The Actualist Circle:** When you say "There is a maximal consistent set of propositions," 'consistent' means 'possibly true together.' You define worlds using modality. I define modality using worlds. My circle is larger, but yours is viciously circular.

  **Where it's Weakest:**
  Sophisticated Actualists (like Sider) argue they can define consistency without primitive modality (e.g., via logical syntax). If they have a non-modal account of consistency, your claim that they are circular loses force. Be ready for a technical duel on "consistency."

  #### 4. The Humphrey Objection (Counterpart Theory)
  **The Question:** "I care about whether *I* could have been a philosopher. On your view, some *counterpart* is a philosopher. Why should I care about what a distinct concrete individual in another universe does? That doesn't make *my* modal properties true."

  **The Reply (2 mins):**
  *   **De Re Modality:** What makes it true that *you* are contingent is that you have counterparts who fail to exist in some worlds. Identity is necessary; contingency requires non-identity across worlds.
  *   **What Matters:** When we evaluate "I could have been a philosopher," we are evaluating the properties of the individual concept tied to this body. The counterpart relation preserves the relevant qualitative features that make the evaluation matter to you.
  *   **The Alternative:** If you insist on transworld identity, you must accept essentialism (you couldn't have had different parents). Counterpart theory frees us from rigid essentialism.

  **Where it's Weakest:**
  It remains deeply counter-intuitive. People feel that *they* should be the ones living the other lives. The reply explains the logic but doesn't heal the intuitive rupture. Some will simply refuse to accept that counterparts suffice for *de re* modality.

  #### 5. The Abstracta Alternative (Plantinga/Stalnaker Style)
  **The Question:** "Why not worlds as maximal consistent sets of propositions? They do the same semantic work without the ontological extravagance. You admit they are causally isolated too. What specific work are the *concrete* universes doing that abstract representations can't?"

  **The Reply (2 mins):**
  *   **Representation Problem:** Abstract sets don't represent anything intrinsically. A set of propositions represents a world only if we interpret it as such. That interpretation requires a prior grasp of modality.
  *   **Ersatz Circularity:** To say a set is "maximal" and "consistent" is to say it describes a way a world *could* be. You are using the notion of a possible world to define the abstract set, then using the set to define possibility.
  *   **Concreta are Self-Representing:** Concrete worlds don't need interpretation. They just *are*. A donkey talks there, literally. No semantic glue required.

  **Where it's Weakest:**
  Actualists have sophisticated responses to the representation problem (e.g., structural isomorphism). If they accept a primitive "representation" relation, your claim that they are circular weakens. It becomes a standoff between "primitive representation" vs. "extravagant ontology."

  #### 6. The Indexicality of 'Actual'
  **The Question:** "When I say 'I am actual,' I'm not saying 'I am here.' I'm saying I exist, and the others don't. Your view implies every inhabitant of every world truthfully says 'I am actual.' That makes 'actual' trivial. It drains the word of its existential force."

  **The Reply (2 mins):**
  *   **Existential Force:** It doesn't drain existence. Every world exists. But 'actual' is indexical, like 'here'. When I say 'here', I don't deny other places exist. I deny they are *here*.
  *   **The Illusion:** The feeling that 'actual' means 'the only existing one' is an illusion of perspective. We are immersed in our world, so we treat it as privileged.
  *   **Theoretical Gain:** Accepting indexicality solves the problem of why our world seems special without positing a metaphysical glow of 'actuality' that nothing else has.

  **Where it's Weakest:**
  This is purely linguistic intuition. Many philosophers feel 'actual' captures a metaphysical status (obtaining), not just an index. You are asking them to treat a metaphysical distinction as a linguistic one.

  #### 7. Recombination and Cardinality (The Phil Math Technicality)
  **The Question:** "If any recombination of universals exists, doesn't the plurality of worlds form a proper class, not a set? If so, how do you quantify over them? You can't say 'there exists a world' if the worlds are too many to form a domain of quantification without paradox."

  **The Reply (2 mins):**
  *   **Set-Theoretic Safety:** We can restrict recombination to avoid paradox (e.g., limiting the size of worlds or the plurality). Lewis suggests the plurality is a set.
  *   **Quantification:** We quantify over the domain we posit. If the domain is a set, standard logic applies. If it's a proper class, we use class-theory quantification.
  *   **No Fatal Paradox:** There is no proof that Modal Realism entails a contradiction. We adjust the principle of recombination to fit our best set theory, not vice versa.

  **Where it's Weakest:**
  Lewis's own views on the size of the plurality shifted and were sometimes vague. If they press on Cantor's Theorem applied to the plurality of worlds, you might have to concede that the "Principle of Recombination" needs more rigorous constraints than Lewis provided.

  #### 8. The "Hope Nobody Asks" (Normative Collapse)
  **The Question:** "If every possible outcome occurs in some world, what happens to decision theory? If I take the job, there's a world where I regret it. If I don't, there's a world where I'm happy. Doesn't your view flatten rational preference? Why deliberate if all branches are equally real?"

  **The Reply (2 mins):**
  *   **Self-Locating Uncertainty:** I don't know *which* world I am in. Deliberation is about influencing which future *stages* of my world-line come to pass.
  *   **Weighting:** We can still weight worlds by similarity or measure (in the quantum case). Not all worlds are "equally real" in terms of their relevance to my current decision context.
  *   **Causal Isolation:** My actions here do not affect the other worlds. I am responsible for *this* causal chain. The existence of other chains doesn't negate the value of this one.

  **Where it's Weakest:**
  This is the hardest pill to swallow existentially. While Lewis has answers involving self-locating belief, it feels like the stakes of decision-making are lowered if "everything happens." It makes the view feel nihilistic to some. **Prepare to deflect this to ethics of care rather than metaphysics.**

  ---

  ### Strategic Advice
  *   **Don't fight the "Weirdness":** If they say "It's weird," agree. "Yes, it is. But so is quantum mechanics. Weirdness isn't falsity."
  *   **Pivot to Utility:** Whenever they hit on ontology, pivot to semantics. "You can keep your smaller ontology if you can explain counterfactuals without circularity. Can you?"
  *   **The Platonist Alliance:** Use the Phil Math Platonists against the Actualists. "You accept sets. You know ontology can be non-causal. Why is concrete isolation worse than abstract isolation?" (Be careful not to conflate them, but use their tolerance for abstracta to soften their resistance to isolation).

  **Good luck. Stand firm on the reduction. If modality is primitive, the game is over.**
