prompt: |-
  I'm a PhD student working on the ethics of political violence, and I keep getting stuck on how peace settlements handle atrocity crimes. A lot of post-conflict agreements include amnesty clauses: the people who ordered massacres or ran torture sites get immunity in exchange for laying down arms or stepping aside, and the same document often has a preamble condemning the very acts it is shielding people from being prosecuted for. At the same time, the international system has spent decades building courts to prosecute exactly those crimes, and in practice it sometimes prosecutes the foot soldiers while leaving the architects of the violence alone. I can't tell wether this is just an ugly compromise forced by circumstances, or whether the practice actually presupposes a distinctive picture of political morality — the kind of thing people call dirty hands, where a leader can be required to do something that remains genuinely wrong, and the wrongness doesn't get canceled by the good outcome but leaves a kind of moral remainder.

  So here is what I'd like you to do. Reconstruct the implicit theory of political morality that amnesty-for-peace practices presuppose, if they presuppose one at all. Does the practice need the dirty-hands view — that some morally wrong acts can nonetheless be the right or necessary thing for a political agent to do — or is it fully compatible with a more straightforward view on which amnesty is just the lesser evil and the wrongness is completely accounted for by the tradeoff? Are the parts of these agreements consistent with each other, or does condemning the acts while immunizing the actors only make sense if you think the wrongness persists even when the act is authorized? And what would have to change in how negotiations and post-conflict courts operate if we replaced the dirty-hands picture with, say, the view that torture and massacre may never be authorized no matter the consequences, or with the view that there is no special political morality and leaders have exactly the same permissions as ordinary people? I'd rather you take a stand than just map the options — tell me what the practice strictly presupposes, what it merely fits with, and where it's genuinely underdetermined between rival theories.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** PhD student in ethics of political violence. This means they are sophisticated, familiar with the literature (Walzer, Nagel, etc.), and want a rigorous philosophical analysis, not a general overview. They want me to *take a stand*, not just list options.
      *   **Topic:** Amnesty clauses in peace settlements vs. international criminal justice (prosecuting atrocity crimes). The tension between condemning acts in preambles while granting immunity in operative clauses.
      *   **Core Question:** What theory of political morality does this practice *presuppose*? Specifically, does it require the "dirty hands" (DH) view (wrong act remains wrong but necessary) or is it compatible with "lesser evil" (LE) utilitarianism (wrongness canceled/outweighed)? What about absolutism or ordinary morality?
      *   **Constraint:** "I'd rather you take a stand than just map the options." I need to argue for a specific interpretation of what the practice *strictly presupposes* vs. what it *fits with*.

  2.  **Deconstruct the Ethical Frameworks:**
      *   **Dirty Hands (DH):** Associated with Walzer, Machiavelli, Weber. The act is objectively wrong (violates deep moral norms) but politically necessary. The agent bears guilt/remorse. The wrongness *persists*.
      *   **Lesser Evil (LE) / Consequentialism:** The act is justified because it produces the best outcome. The "wrongness" is outweighed. If it's the right thing to do, it's not truly "wrong" in the final analysis, just regrettable.
      *   **Absolutism/Deontology:** Certain acts (torture, massacre) are never permissible. Amnesty for these is illegitimate.
      *   **Ordinary Morality:** Leaders have the same obligations as civilians. No special "political morality."

  3.  **Analyze the Practice (Amnesty-for-Peace):**
      *   *Feature 1:* Operative clause grants immunity (pragmatic necessity to stop killing).
      *   *Feature 2:* Preamble condemns the acts (affirmation of norms).
      *   *Feature 3:* Selective prosecution (foot soldiers vs. architects).
      *   *The Tension:* If the act is fully justified (LE), why condemn it so strongly in the preamble? If the act is absolutely forbidden (Absolutism), why grant immunity?

  4.  **Evaluate Compatibility:**
      *   *LE View:* Compatible with the *decision* to grant amnesty (greater good), but struggles with the *preamble*. If the amnesty is the "right" thing, the condemnation feels performative or hypocritical unless it's purely symbolic. However, LE can explain the selective prosecution (cost-benefit of arresting warlords vs. peace).
      *   *DH View:* Fits the *tension* perfectly. The preamble affirms the moral norm (the act is wrong). The operative clause acknowledges political necessity (we must do it anyway). The "moral remainder" explains why we feel uneasy and why truth commissions often accompany amnesties (acknowledging the wrong without punishing).
      *   *Absolutism:* Incompatible with the practice. The practice *is* the violation of absolutism.
      *   *Ordinary Morality:* Incompatible. Ordinary morality doesn't allow trading justice for peace in this specific institutional way (you don't let a murderer go just because he promises not to kill again, usually).

  5.  **Formulate the Stand (The "Take a Stand" Requirement):**
      *   *Thesis:* The practice *strictly presupposes* a Dirty Hands framework (or something functionally identical). It cannot be fully explained by Lesser Evil utilitarianism because of the *preamble/condemnation* element. LE would render the condemnation redundant or dishonest. DH explains why the condemnation is necessary *alongside* the immunity.
      *   *Nuance:* It's not that the negotiators are reading Walzer. It's that the *structure of the justification* mirrors DH.
      *   *Implication:* If we shifted to Absolutism, peace deals would collapse or go underground. If we shifted to Ordinary Morality, we'd have to treat warlords like common criminals (risking prolonged war). If we shifted to pure LE, we'd drop the moralizing preambles as hypocritical.

  6.  **Drafting the Argument - Section by Section:**

      *   **Introduction:** Acknowledge the sophistication of the question. State the thesis clearly: The practice structurally requires Dirty Hands, not just Lesser Evil.
      *   **The Preamble/Operative Tension:** This is the key evidence. Why condemn what you authorize?
          *   LE says: It's net positive. Condemnation is confusing.
          *   DH says: It's necessary but sinful. Condemnation preserves the norm.
      *   **Selective Prosecution:** Why foot soldiers?
          *   LE: Cheap/easy.
          *   DH: Scapegoating? Or acknowledging that the "necessity" only applies to the top-level deal, not the low-level cruelty.
      *   **The "Moral Remainder":** The feeling of guilt/residue. Truth commissions serve this function.
      *   **Counterfactuals (What if we changed the theory?):**
          *   *Absolutism:* No amnesty. Risk of perpetual war.
          *   *Ordinary Morality:* Criminalize the peace deal itself.
          *   *Pure Consequentialism:* Drop the human rights language. Be honest about the tradeoff.
      *   **Conclusion:** Reiterate that the practice is a ritualized admission of Dirty Hands.

  7.  **Refining the Argument (Self-Correction/Critique):**
      *   *Critique:* Is it possible the preamble is just lip service to the ICC to avoid intervention?
      *   *Rebuttal:* Even if it's lip service to *outsiders*, for the *signatories* to agree to it, they must accept the internal logic. If they believed it was purely LE, they wouldn't need the moral cover. The fact that they *need* the moral cover suggests they acknowledge the transgression.
      *   *Critique:* Is "Dirty Hands" the right label? Some philosophers distinguish DH from "Necessity."
      *   *Refinement:* Stick to the user's terminology ("dirty hands") but define it precisely as "wrong act, necessary context, persistent guilt."
      *   *Crucial Point:* The user asked about the *theory the practice presupposes*. I need to distinguish between the *motivations of the actors* (which might be cynical) and the *justificatory structure of the institution* (which requires DH to make sense normatively).

  8.  **Final Polish:** Ensure the tone is academic but direct. Avoid hedging too much ("on the one hand..."). Make definitive claims as requested. (e.g., "The practice is incoherent on a pure Lesser Evil view.")

  9.  **Key Insight to Highlight:** The *condemnation* in the preamble is the smoking gun. If amnesty were simply "justified" (LE), condemnation would be a lie. If amnesty is "necessary but wrong" (DH), condemnation is the truth. Therefore, the text presupposes DH.

  10. **Structure:**
      1.  Thesis Statement.
      2.  The Preamble Problem (Why LE fails).
      3.  The Necessity of Moral Remainder (Truth Commissions).
      4.  Selective Prosecution (The Scapegoat function).
      5.  Counterfactuals (Absolutism/Ordinary Morality).
      6.  Conclusion.

  (Proceed to generate response based on this thought process.)
answer: |-
  Here is the hard claim: The practice of amnesty-for-peace settlements, specifically the textual tension between condemning preambles and immunizing operative clauses, **strictly presupposes a Dirty Hands (DH) framework.** It is incoherent on a pure Lesser Evil (LE) utilitarian view, and it is normatively illegitimate on an Absolutist or Ordinary Morality view.

  The practice does not merely "fit" with Dirty Hands; it relies on the specific moral ontology of DH to function as a legitimate political instrument. If you strip away the DH presupposition, the text of these agreements becomes either hypocritical (on LE) or criminal (on Absolutism).

  Here is the reconstruction of why the practice requires this specific theory, where it is underdetermined, and what would break if you swapped the moral framework.

  ### 1. The Preamble Problem: Why Lesser Evil Fails
  The strongest evidence that these agreements presuppose Dirty Hands rather than Lesser Evil is the **preamble**.

  On a **Lesser Evil (Consequentialist)** view, moral justification is all-things-considered. If granting amnesty to a warlord prevents 10,000 deaths, the act of granting amnesty is *the right thing to do*. It is not "wrong but necessary"; it is simply "right." The moral ledger is balanced by the outcome. If this were the operative theory, a preamble condemning the warlord's past acts while simultaneously legalizing his immunity would be logically inconsistent. You do not condemn an agent for doing what was, all-things-considered, the morally correct action. To condemn the acts in the preamble while authorizing the immunity in the operative clause would be a lie on the LE view.

  On a **Dirty Hands** view, however, the act of granting immunity (and the underlying acts of violence being pardoned) remains **objectively wrong**, even if it is politically necessary. The moral norm against torture and massacre is not suspended; it is violated for the sake of the polity's survival. The preamble serves a crucial philosophical function here: it preserves the validity of the moral norm. By condemning the acts, the agreement affirms that the moral law still stands. By granting immunity, it acknowledges that the political necessity overrides the enforcement of that law *in this instance*, without negating the law itself.

  Therefore, the text presupposes that the wrongness of the atrocity **persists** despite the political utility of the amnesty. This persistence of wrongness is the definition of the "moral remainder" in Dirty Hands theory. Without DH, the preamble is mere window dressing for the ICC; with DH, the preamble is the necessary acknowledgment of the moral cost required to make the deal bearable to the conscience of the signatories and the victims.

  ### 2. Selective Prosecution: Scapegoating vs. Deterrence
  You noted the practice often prosecutes foot soldiers while immunizing architects.
  *   **On Ordinary Morality:** This is unjust discrimination. If the crime is murder, the order-giver is more guilty than the shooter. Prosecuting only the shooter is a miscarriage of justice.
  *   **On Dirty Hands:** This looks like **ritual scapegoating**. The DH framework allows for the recognition that while the *leaders* must be spared to secure peace (the "necessity" component), the *moral order* must still be appeased. Prosecuting low-level actors serves as a sacrifice to the norm. It says, "We acknowledge these acts were crimes (hence the prosecutions), but the supreme emergency of the transition requires we spare the commanders."

  This selectivity is hard to justify on LE unless you argue foot soldiers are cheaper to catch (a pragmatic, not moral, argument). But the *moral weight* given to these trials suggests they are serving a DH function: expiating the collective guilt without destabilizing the peace. The practice presupposes that the "hands" of the top leaders are too dirty to be cleaned by a court, but not so dirty that they can be ignored; they must be acknowledged (in the preamble) but not punished (in the operative clause).

  ### 3. The Role of Truth Commissions
  Most amnesty deals are paired with Truth and Reconciliation Commissions (TRCs). This is the smoking gun for Dirty Hands.
  *   If **LE** were true, we wouldn't need truth commissions. We would just move on. The outcome justifies the means.
  *   If **Absolutism** were true, TRCs are insufficient; we need prisons.
  *   **DH** requires TRCs. Because the wrongness persists, it must be *acknowledged*. The "moral remainder" demands a public record of the sin, even if punishment is waived. The TRC is the institutionalization of the "guilt" component of Dirty Hands. It allows the society to say, "We know this was wrong, and we record it as wrong, even though we are letting you go."

  ### 4. Counterfactuals: What Breaks if We Change the Theory?
  To test whether the practice *strictly presupposes* DH, we must see what happens if we force the other theories onto the practice.

  **Scenario A: Imposing Absolutism (No acts are ever authorized)**
  If we adopted the view that torture and massacre are never permissible and no amnesty can ever be granted for them (the current trend in international law, e.g., the Rome Statute's stance on amnesties for core crimes):
  *   **Result:** Peace negotiations go underground or collapse. Warlords have no incentive to lay down arms if the only option is The Hague.
  *   **Implication:** The current practice of public, signed peace treaties would vanish. We would see more "de facto" amnesties (silent non-enforcement) rather than "de jure" amnesties. The fact that states feel compelled to write the amnesty *down* while simultaneously nodding to international norms suggests they are trying to navigate the DH tension, not resolve it via Absolutism.

  **Scenario B: Imposing Ordinary Morality (Leaders = Civilians)**
  If we treated political leaders exactly like common criminals:
  *   **Result:** You cannot make a deal with a murderer to stop him from murdering others. You hunt him down.
  *   **Implication:** This ignores the "supreme emergency" aspect of political morality. Ordinary morality does not account for the collapse of the state. The practice presupposes a **special political morality** where the preservation of the political order (peace) creates permissions that do not exist for private actors. The amnesty clause *is* the assertion of special political permissions.

  **Scenario C: Imposing Pure Lesser Evil (Consequentialism)**
  If we were honest LE theorists:
  *   **Result:** We would drop the preambles. We would stop condemning the acts in the same document that legalizes them. We would say, "This is a pragmatic transaction, not a moral judgment."
  *   **Implication:** The agreements would lose their legitimacy among the victim population. Victims accept amnesty only if the *wrongness* of the act is affirmed (DH). If the state implies the act was "worth it" (LE), it insults the victims. The practice *needs* the DH condemnation to secure social buy-in.

  ### 5. Where the Practice is Underdetermined
  There is one area where the practice does not strictly dictate DH: **The locus of the guilt.**
  Dirty Hands theory usually places the guilt on the agent (the leader who grants the amnesty or the warlord who accepts it). However, many peace agreements try to shift this guilt to "the system," "colonial history," or "structural violence."
  *   The text is underdetermined on whether the *individual* has dirty hands or whether the *situation* is tragic.
  *   However, the fact that specific individuals are named (even if immunized) suggests the practice leans toward individual DH. If it were purely structural, individual immunity wouldn't need to be explicitly negotiated; it would be a blanket policy.

  ### Conclusion: The Stand
  The practice of amnesty-for-peace is not a failure of moral clarity; it is a **ritualized enactment of Dirty Hands theory.**

  It strictly presupposes that:
  1.  **Moral norms are absolute** (hence the condemnation).
  2.  **Political necessity can override enforcement** (hence the immunity).
  3.  **The violation remains a violation** (hence the moral remainder/TRCs).

  If you try to interpret this practice through **Lesser Evil**, you render the condemnatory language hypocritical. If you interpret it through **Absolutism**, you render the amnesty illegal. If you interpret it through **Ordinary Morality**, you render the negotiation irrational.

  The only framework that makes the text consistent—where one can truthfully say "What you did was a crime" and "You will not be punished" in the same breath—is Dirty Hands. The practice admits that politics sometimes requires sin, but it insists on calling it sin rather than redefining it as virtue. To change this practice, you wouldn't just change the law; you would have to eliminate the gap between private morality and public necessity, which would likely mean the end of negotiated peace in civil wars.
