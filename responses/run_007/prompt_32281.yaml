  You've hit on the classic symmetry objection, and it's sharp—but here's the hard pill: the skeptic bites it. If luck undermines blame, it undermines praise too. The intuition that the kind person "deserves" credit is just as metaphysically shaky as the intuition that the cruel person deserves suffering. We keep praise not because it's cosmically justified, but because it works. [Empirical Flag] It's broadly settled in behavioral science that positive reinforcement shapes future behavior, but whether that constitutes *basic desert* is a conceptual claim, not an empirical one. Your point about "ownership" doesn't save desert because the capacity to own reasons—to be the kind of person who responds to norms—is itself a product of luck. So we rebuild: praise for reinforcement, blame for safety, but no one fundamentally deserves anything.
