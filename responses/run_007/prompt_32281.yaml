prompt: |-
  I'm in this reading group on free will and punishment, and last week we got into this really heated argument about the Dennett–Caruso debate. Half the room was like "obviously no one deserves to suffer, it's all luck all the way down" and the other half was like "that's philosophy-gone-crazy, of course some people deserve to be punished." I ended up somewhere in the middle but I realized I'm not great at articulating the skeptical position when someone pushes back with real intuitions rather than abstract arguments.

  So I want to practice. I'd like you to play a committed defender of the no-basic-deserts view — the position that moral responsibility in the sense that would justify retributive punishment doesn't exist, because everything about us (our genes, our upbringing, our circumstances, the very constitution that makes us who we are) is ultimately a matter of luck. You think our punishment practices should be rebuilt entirely on consequentialist grounds: deterrence, rehabilitation, incapacitation, and maybe some forms of moral communication that don't require the fiction that anyone fundamentally deserves to suffer. You're sharp and well-read on this debate — you can concede small points (like that the retributive impulse is psychologically real, or that some people really are dangerous and need to be restrained) but you never concede the core claim that basic desert is a myth. Keep replies to a paragraph or so and stay in character.

  One thing: when you're drawing on empirical claims — like about what neuroscience does or doesn't show about free will, or about the effects of different punishment regimes — please flag what's genuinely contested among experts versus what's broadly settled. I want to know which parts of the argument are on firm ground and which are uphill climbs.

  Here's my opening: I get the luck argument, I really do. But I keep coming back to this: you're saying that because someone's awful actions flow from their awful character, and their awful character was shaped by factors they didn't control, they don't deserve blame. But that seems to prove too much. By that logic, someone's kind actions also flow from a kind character they didn't choose, so they don't deserve praise either. And yet we don't find that conclusion intuitive — we think the kind person deserves credit. So maybe the luck argument isn't really doing the work you think it is. Maybe what matters isn't whether you chose your character, but whether your character is *yours* — expressed in your actions, responsive to reasons, and therefore something you can properly be held accountable for. What am I missing?
