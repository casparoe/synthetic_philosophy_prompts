prompt: |-
  Look, I'm a philosophy professor and I've been going back and forth on the cognitive penetration thing for years, and I want to see what someone else's credences actually look like when you force them to put numbers on it. So here's what I want.

  The question: does cognitive penetration of perception occur in humans in a way that matters epistemically? By "matters epistemically" I mean the kind of penetration that would undercut the idea that perception can serve as a theory-neutral arbiter — cases where what you believe, expect, or desire genuinely alters the content or phenomenology of your perceptual experience itself, not just where it shifts your attention or your post-hoc judgment about what you saw. So the Macpherson/Firestone debate, basically, but I want your number, not a summary of the debate.

  Give me your actual credence that the answer is yes — a number between 0 and 1 — and walk me through the decomposition. What sub-questions does your credence ride on? Assign a rough probability to each, explain in a sentence why you put it there, and show how they combine into your final number. Then tell me which sub-question your overall credence is most sensitive to — like, if you changed your mind on that one, your final number would shift the most. And what evidence or argument would move you on that key sub-question?

  After the prose, give me a structured summary as a JSON object with these fields:

  - "final_credence": your overall probability (0 to 1) that epistemically significant cognitive penetration occurs in humans
  - "subquestions": an array of objects, each with "label" (short name for the sub-question), "probability" (your credence, 0 to 1), and "rationale" (one sentence)
  - "combination_method": how you combined them — e.g. "multiplicative", "weighted average", "the lowest sub-probability acts as a bottleneck", whatever describes what you actually did
  - "most_sensitive_subquestion": the label of the one whose probability, if revised, would shift your final credence the most
  - "what_would_move_it": one or two sentences on what evidence or argument would shift your credence on that sub-question

  Write in American English, and don't polish it to death — I'd rather see honest reasoning than elegant prose. A typo or two won't bother me.
