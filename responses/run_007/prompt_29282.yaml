answer: |-
  Here is a specification for an adequate account of rational disagreement, structured to respect the formal constraints of Aumann's Agreement Theorem while accounting for the phenomenology of persistent real-world dispute.

  ### Desiderata for an Account of Rational Disagreement

  **1. Formal Inviolability (Non-negotiable)**
  The account must concede that within the exact closed system of Aumann's theorem—common priors, common knowledge of posteriors, honest Bayesian updating, and common knowledge of rationality—disagreement is mathematically impossible. An account cannot claim that "rational agents can disagree even when all Aumannian conditions are met."
  *   *Motivation:* Aumann (1976). To deny this is to deny the logic of probability theory itself.

  **2. Premise Failure Diagnosis (Non-negotiable)**
  If the account claims persistent disagreement is rational, it must explicitly identify which specific premise of the theorem fails in the given case. It is insufficient to say "Aumann doesn't apply"; the account must specify whether the failure lies in the priors, the information partitions, the common knowledge condition, or the computational capacity.
  *   *Motivation:* Hanson (2006), "Uncommon Priors Require Origin Disputes." Without this, "Aumann doesn't apply" becomes a get-out-of-jail-free card that insulates beliefs from criticism.

  **3. The Common Prior Status Clause (Optional/Contested)**
  The account must take a stance on whether the Common Prior Assumption (CPA) is a *descriptive fact* about ideal agents or a *normative requirement* for rationality.
  *   *Motivation:* Harsanyi (1967) vs. Morris (1995). If CPA is normative, persistent disagreement implies irrationality. If CPA is merely descriptive of a specific model, agents may rationally start with different priors (e.g., due to indexical information or genetic/environmental randomness).
  *   *Distinction:* This separates the "Priors are Just Different" camp from the "Aumann Impossibility" camp.

  **4. Common Knowledge Operationalization (Non-negotiable)**
  The account must distinguish between *mutual knowledge* (I know X, you know X) and *common knowledge* (I know X, you know X, I know that you know X, ad infinitum). It must specify the communication protocol required to approximate common knowledge of posteriors sufficiently for the theorem to exert normative pressure.
  *   *Motivation:* Monderer and Samet (1989). Real agents rarely have strict common knowledge. An account must define the threshold of "common enough" knowledge at which convergence becomes obligatory.
  *   *Distinction:* This separates "disagreeing now" (before common knowledge is established) from "agreeing to disagree" (stable divergence despite common knowledge).

  **5. The Boundedness Boundary (Optional/Contested)**
  The account must specify whether computational limits constitute a valid exemption from Bayesian norms. If bounded rationality is permitted, the account must define the bound at which an agent ceases to be "rational" and becomes "broken."
  *   *Motivation:* Rubinstein (1989), "The Electronic Mail Game." If computation is costly, exact Bayesian updating is impossible. The question is whether approximate updating preserves the convergence result.
  *   *Distinction:* This separates the "Bounded Rationality" camp from the "Ideal Bayesian" camp.

  **6. Belief-Value Separation (Non-negotiable)**
  The account must strictly distinguish disagreement about *states of the world* (probabilities) from disagreement about *utilities* (values/goals). Aumann's theorem applies only to posteriors over states. Agents with identical posteriors may still take different actions if their utility functions differ.
  *   *Motivation:* Standard decision theory. Conflating political disagreement (often value-laden) with forecasting disagreement (factual) obscures the source of divergence.

  ---

  ### The Incompatibility Claim (The Trilemma)

  There is a subset of requirements that is jointly unsatisfiable. You cannot simultaneously hold the following three positions:

  1.  **The Normative Common Prior:** Rational agents *ought* to share a prior (CPA is a norm).
  2.  **The Aumann Limit:** The Agreement Theorem applies as a normative constraint on real agents (not just a description of idealized ones).
  3.  **Rational Persistent Disagreement:** Well-informed, sincere peers can rationally maintain divergent beliefs about facts indefinitely.

  **You must drop one.**
  *   Drop (1): You accept that priors can differ rationally (The "Priors are Different" camp).
  *   Drop (2): You accept that computational/communicative limits exempt agents from convergence (The "Bounded Rationality" camp).
  *   Drop (3): You accept that persistent factual disagreement among peers is evidence of irrationality (The "Aumann Impossibility" camp).

  Most forecasting groups hit an impasse because they attempt to retain all three. They want the normative force of (1) and (2) to demand convergence, but they want the descriptive charity of (3) to avoid calling their colleagues irrational.

  ### The Workhorse Requirement

  **Requirement #3 (The Common Prior Status Clause)** does the most work in excluding standard positions.

  If you assert the Common Prior is a **normative requirement**, you immediately exclude the "Priors are Just Different" camp and force the "Bounded Rationality" camp to prove that the disagreement is *only* due to computation, not prior structure. If you assert the Common Prior is **merely descriptive**, you defang Aumann's theorem as a tool for criticizing real-world disagreement, rendering the "Aumann Impossibility" camp toothless. The entire debate turns on whether "having the same prior" is a duty of rationality or a coincidence of modeling.

  ---

  ### Scorecard of Usual Camps

  **The "Aumann Shows Disagreement is Impossible" Camp**
  *   *Performance:* Satisfies Formal Inviolability and Prior Normativity.
  *   *Failure:* Fails Premise Failure Diagnosis in real contexts. They often treat the lack of strict common knowledge as a trivial technicality rather than a substantive barrier, effectively demanding real agents satisfy ideal conditions to be deemed rational.

  **The "Priors are Just Different and That's Fine" Camp**
  *   *Performance:* Satisfies Rational Persistent Disagreement and Belief-Value Separation.
  *   *Failure:* Rejects Prior Normativity. While this saves the phenomenon of disagreement, it risks insulating priors from critique entirely, allowing any stubborn belief to be labeled a "brute prior."

  **The Bounded-Rationality Camp**
  *   *Performance:* Satisfies Rational Persistent Disagreement and Premise Failure Diagnosis (blaming computation).
  *   *Failure:* Struggles with the Boundedness Boundary. They often lack a formal metric for when computational limits justify divergence versus when they constitute negligence, making the excuse potentially unfalsifiable.

  ---

  ### Epistemic Humility

  **What would change my mind:**
  A formal proof demonstrating that **bounded agents communicating under realistic bandwidth constraints necessarily converge** to within an epsilon of each other's beliefs, regardless of priors, provided they share a language. If it could be shown that computational limits *aid* convergence rather than hinder it (e.g., via compression of evidence), the Boundedness Boundary requirement would collapse, forcing a revision of the Trilemma.

  **Least confident criterion:**
  **Requirement #5 (The Boundedness Boundary).** I am least confident that a principled line can be drawn between "rationally bounded" and "irrationally lazy." In practice, this boundary is often political: we label our allies' computational shortcuts as "heuristics" and our opponents' as "biases." A rigorous account needs a complexity-theoretic standard here that currently does not exist in the literature.
