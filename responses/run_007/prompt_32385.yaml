answer: |-
  There is no single universally canonical proper noun for this pattern, though it is widely recognized in contemporary metaethics as the problem of **selective skepticism** or **unprincipled selectivity** within genealogical debunking arguments.

  This dialectical move is frequently critiqued in the literature surrounding evolutionary debunking arguments (EDAs), particularly in responses to Sharon Street and work by philosophers like David Enoch and Katia Vavova. While the broader strategy is known as "genealogical debunking," the specific asymmetry you describe—where causal explanations are weaponized against disfavored intuitions while favored intuitions are insulated from the same scrutiny—is typically identified as a violation of epistemic consistency. Critics argue that without an independent criterion for distinguishing which intuitions are tainted by their origins, the debunker is engaging in **ad hoc reasoning** or **question-begging**, effectively assuming the falsity of the disfavored intuitions to justify debunking them. Because no single standardized term like "The Naturalistic Fallacy" exists for this specific asymmetry, I propose the coinage **"Motivated Genealogical Asymmetry"** to precisely label the selective application of genealogical critique based on antecedent normative commitments.

  Selective debunking is legitimate only when the distinction between "bias" and "insight" rests on an **independent epistemic criterion** rather than the content of the intuition itself. A principled criterion must identify a defeater for the cognitive process that generates the intuition without presupposing the falsity of the intuition's output. For example, debunking an intuition based on disgust is legitimate if we have independent psychological evidence that disgust responses are sensitive to morally irrelevant factors (like cleanliness or proximity), regardless of whether the resulting moral judgment is repugnant to the debunker. Conversely, sparing the intuition that "suffering is bad" is legitimate only if one can argue that the cognitive processes underlying empathy or rational reflection are reliable independent of their evolutionary origins, or if one employs a "third-factor" explanation linking evolutionary success to moral truth. The boundary lies in **process reliability**: it is permissible to debunk an intuition if the mechanism producing it is shown to be insensitive to the truth-tracking features required for that domain, but it is fallacious to debunk an intuition solely because its output conflicts with the debunker's existing moral framework.
