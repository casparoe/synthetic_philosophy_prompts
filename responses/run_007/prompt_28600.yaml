  ok so I'm a decision theory PhD student and I've been trying to get striaght on acausal trade. The story as I understand it: two agents can't communicate or causally interact, but each has a good enough model of the other's source code that each can see the other will cooperate if they do, so they end up trading—each takes a small cost to give the other a larger benefit, because each predicts the other will do the same. But when I try to cash this out, the reasoning seems to be: my cooperating is evidence that the other agent will cooperate, since we're in relevantly similar situations and running relevantly similar decision procedures. And that's just evidential reasoning. In Newcomb's problem, the standard objection to one-boxing on evidential grounds is that your choice doesn't cause the predictor's prediction—the money is already in the box. So why doesnt the same objection kill acausal trade? Is there a version of the argument that isn't just evidential decision theory with extra steps, and if so, what exactly is the extra step—what's the difference between "my action is evidence about the other agent" and whatever acausal trade actually needs?
