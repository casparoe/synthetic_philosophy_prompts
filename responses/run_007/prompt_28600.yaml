answer: |-
  You have hit on the central tension in the literature surrounding acausal trade. Your intuition is sharp: **superficially, acausal trade looks exactly like Evidential Decision Theory (EDT) applied to a multi-agent setting.**

  If you formulate acausal trade purely as "I observe that my cooperation increases the conditional probability of their cooperation, therefore I cooperate," you are indeed doing EDT. And if you stop there, the standard objections to EDT (e.g., the Smoking Lesion, the Psychopath Button) apply with full force. The "Newcomb Objection" (that your action cannot causally influence the fixed state of the world/other agent) is the standard Causal Decision Theory (CDT) rebuttal, and it *does* kill acausal trade if you accept CDT.

  However, proponents of acausal trade (typically within the Functional Decision Theory (FDT) or Timeless Decision Theory (TDT) frameworks) argue that there is a crucial "extra step" that distinguishes it from naive EDT. That step is the move from **probabilistic evidence** to **subjunctive dependence** (or logical correlation).

  Here is the breakdown of why the Newcomb objection is accepted but reinterpreted, and what the non-EDT formulation actually looks like.

  ### 1. The CDT Objection is Accepted (and Ignored)
  First, to answer your specific question: **Yes, the Newcomb objection does kill acausal trade for CDT.**
  A CDT agent constructs a causal graph. In acausal trade, there is no causal arrow from Agent A's action to Agent B's action (they are spacelike separated or in different branches of the multiverse). There is no causal arrow from Agent A's action to the "prediction" Agent B made. Therefore, $P(\text{B cooperates} | \text{do}(A \text{ cooperates})) = P(\text{B cooperates})$.
  Since the cost of cooperation is real and the benefit depends on B, CDT defects. Proponents of acausal trade agree with this causal analysis but reject the premise that decision theory should be limited to causal arrows.

  ### 2. EDT vs. The "Extra Step" (Subjunctive Dependence)
  The problem with relying on EDT is that EDT treats *all* correlations as actionable. If a genetic lesion causes both a tendency to cooperate and a tendency for others to cooperate (via some common cause), EDT cooperates. But intuitively, you can't *leverage* that correlation to get the benefit; the correlation is fixed by the past.

  The "extra step" in acausal trade arguments (specifically FDT/TDT) is restricting the relevant correlations to those arising from **shared logical structure**.

  *   **EDT Reasoning:** "My action $A$ is statistically correlated with outcome $O$. $P(O|A)$ is high. I choose $A$."
  *   **FDT/TDT Reasoning:** "My decision is the output of algorithm $f$. Their decision is the output of algorithm $g$. $f$ and $g$ are logically entangled (e.g., they simulate each other, or are isomorphic). Therefore, the counterfactual 'If $f$ outputs Cooperate' logically entails ' $g$ outputs Cooperate'."

  This is **subjunctive dependence**. It is not that your action provides *evidence* about their action; it is that your decision procedure and theirs are instantiations of the same (or sufficiently similar) abstract computation. When you "choose" to cooperate, you are not sending a signal; you are determining the output of a logical function that is also running in their environment.

  ### 3. Cash Out: Logical Counterfactuals vs. Conditional Probability
  To cash this out formally, you have to move from conditioning on events to evaluating counterfactuals over algorithms.

  In EDT, you maximize:
  $$ \mathbb{E}[U] = \sum_{w} P(w | \text{I do } A) \cdot U(w) $$
  The criticism here is that $P(w | \text{I do } A)$ includes spurious correlations (common causes).

  In FDT, you maximize something more like:
  $$ \mathbb{E}[U] = \sum_{w} P(w | \text{Algorithm } f \text{ outputs } A) \cdot U(w) $$
  The "extra step" is the definition of the counterfactual. In possible-worlds semantics for FDT, you don't just look at worlds where you happen to cooperate. You look at worlds where **the logical fact** " $f(\text{input}) = A$ " holds.
  If Agent B is running a simulation of $f$ (or a function $g$ that is logically dependent on $f$), then in the logical counterfactual where $f$ outputs Cooperate, $g$ *must* output Cooperate. This isn't empirical evidence; it's a logical constraint.

  ### 4. Revisiting the Newcomb Objection
  You asked: *In Newcomb's problem, the standard objection... is that your choice doesn't cause the predictor's prediction... So why doesnt the same objection kill acausal trade?*

  The FDT response is: **The objection is correct, but irrelevant.**
  In Newcomb's problem, the money is already in the box. In acausal trade, the other agent's decision is already "made" (in their local time).
  However, FDT argues that "already made" is a temporal/causal concept, not a logical one.
  *   **CDT View:** The state of the box is a fixed fact of the past. My choice cannot change it.
  *   **FDT View:** The state of the box is a function of the Predictor's model of my algorithm. My algorithm's output is a logical fact. I cannot change the past, but I can determine which logical possibility is instantiated.

  If I am the type of agent who one-boxes, the Predictor (who models me) predicted one-boxing and put the money in. If I am the type who two-boxes, they predicted two-boxing and left it empty.
  When I stand before the boxes, I am not changing the past. I am **selecting which logical branch I am in**.
  *   Branch 1: Algorithm outputs One-Box $\rightarrow$ Predictor predicted One-Box $\rightarrow$ \$1M.
  *   Branch 2: Algorithm outputs Two-Box $\rightarrow$ Predictor predicted Two-Box $\rightarrow$ \$1k.

  The "Newcomb Objection" assumes that the past is fixed *independently* of your decision procedure. FDT argues the past (specifically the prediction) is fixed *dependently* on your decision procedure. The same applies to acausal trade: the other agent's action is fixed dependently on your algorithm's output because their algorithm computes yours.

  ### 5. Why this isn't just "EDT with extra steps"
  The distinction matters because it solves the **Spurious Correlation** problem.
  *   **EDT** would cooperate in acausal trade even if the correlation was due to a common cause (e.g., a third party programmed both of us to cooperate, but our codes don't actually simulate each other). EDT sees $P(\text{They Coop} | \text{I Coop}) \approx 1$ and cooperates. But my cooperating doesn't *secure* their cooperation; the common cause did. If I defect, the common cause might still have made them cooperate (depending on the setup), or I might break the correlation. EDT is unstable here.
  *   **FDT** asks: "Is there a logical dependency?" If our codes are similar only because of a common cause, but they do not actually compute each other (or a shared function), FDT might defect, because changing my algorithm's output doesn't logically force their algorithm's output to change. FDT only cooperates when the correlation is **subjunctively dependent** on the decision itself.

  ### 6. The Remaining Hole (For a PhD Student)
  Since you are a PhD student, I should note where the formalism is still leaking. The "extra step" relies on a theory of **logical counterfactuals**.
  *   What does it mean to say "If $3+4=8$, then..."?
  *   In acausal trade, we are asking: "If my source code (which deterministically outputs 'Defect') were to output 'Cooperate', what would yours do?"
  *   Since the code is fixed, this counterfactual is logically impossible (a contradiction).

  Standard logic explodes from contradictions (Principle of Explosion). FDT requires a non-trivial theory of counterpossibles (impossible counterfactuals) to make sense of "If my algorithm, which is $f$, outputted $A$ instead of $B$..." when $f$ deterministically outputs $B$.
  Current work (e.g., by MIRI researchers, or in proof-based UDT) attempts to handle this via proof search and modal logic, but there is no consensus formalization of logical counterfactuals that satisfies the broader decision theory community.

  ### Summary
  1.  **Is it EDT?** Structurally, yes. It conditions on the action to update beliefs about the world.
  2.  **Does the Newcomb objection apply?** Yes, CDT uses it to reject acausal trade.
  3.  **The "Extra Step":** It is the shift from **statistical correlation** (EDT) to **subjunctive/logical dependence** (FDT/TDT).
  4.  **The Mechanism:** You aren't influencing the other agent causally; you are selecting which logical output of a shared computation becomes actual.
  5.  **The Distinction:** EDT cooperates on spurious correlations; FDT cooperates only on logical entanglement.
  6.  **The Open Problem:** The formal definition of the logical counterfactual required to make this rigorous is still an open problem in decision theory.

  If you are writing on this, the strongest angle is likely analyzing whether "subjunctive dependence" can be rigorously defined without collapsing back into either CDT (if the bar is too high) or EDT (if the bar is too low).
