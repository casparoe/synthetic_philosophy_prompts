answer: |-
  The disagreement between scientific realists and anti-realists is best diagnosed not as a simple burden of proof dispute, though that characterizes the rhetorical exchange, but rather as a deep clash of prior credences regarding the explanatory necessity of truth, compounded by a fundamental divergence in how theoretical content is individuated across history. While your hypothesis about the burden of proof captures the surface-level friction where each side demands the other justify their starting assumption, this procedural standoff is merely a symptom of the underlying epistemic divergence. The realist enters the debate with a prior credence that truth is the only viable explanation for novel predictive success, treating the no miracles argument as an inference to the best explanation that defaults to realism unless defeated. The anti-realist enters with a prior credence that empirical adequacy is sufficient for scientific acceptance and that the historical record demonstrates a low base rate for the truth of theoretical posits, treating the pessimistic meta-induction as a direct probabilistic counter. Because these priors dictate how evidence is weighted, the debate stalls not because the arguments are logically invalid, but because the two sides are effectively updating on different data sets derived from the same history.

  This divergence in data sets stems from the problem of individuation. When the realist looks at the history of science to defend against the pessimistic meta-induction, they employ a selective retention strategy, arguing that theories like caloric or ether were not wholly false but contained structural or referential kernels that were preserved in successor theories. This allows the realist to count these cases as partial successes rather than total failures, thereby inflating the success rate of theoretical posits. The anti-realist, conversely, individuates theories as holistic packages, arguing that because the ontological commitments of these past theories were rejected, the theories count as false regardless of any mathematical or structural continuity. Consequently, the empirical dispute about the base rate of theoretical success is not merely a lack of data but a conceptual disagreement about what counts as a unit of success. Until there is agreement on whether a theory that gets the equations right but the ontology wrong counts as true enough for the realist's purposes, the historical record will remain a Rorschach test that confirms whichever prior one started with.

  The Bayesian analysis of this debate supports the view that this is a clash of permissible priors rather than a resolvable empirical conflict. Philosophers like Peter Magnus and Craig Callender have suggested that the no miracles argument commits a base rate fallacy if the prior probability of a theory being true is low, which is exactly what the pessimistic meta-induction is designed to establish. If rational agents are permitted to hold different prior probabilities regarding the likelihood that success indicates truth, then the impasse is a feature of Bayesian epistemology rather than a failure of argumentation on either side. The realist insists that the explanatory power of truth boosts the posterior probability enough to overcome a skeptical prior, while the anti-realist insists that the historical frequency of false successes keeps the posterior low regardless of explanatory virtue. This suggests that the dispute is not about logic or data alone, but about the epistemic weight one assigns to explanation versus induction. The realist prioritizes the synchronic explanatory power of truth for current success, while the anti-realist prioritizes the diachronic inductive consistency of the historical record.

  Regarding your hypothesis on the burden of proof, it is accurate to say that the dispute often manifests as a tug-of-war over who must justify what, but this is because the burden of proof is itself determined by one's epistemic priors. The realist feels the burden lies with the anti-realist to explain success without truth because the realist assumes truth is the standard explanation. The anti-realist feels the burden lies with the realist to prove truth follows from success because the anti-realist assumes empirical adequacy is the standard goal. Since neither side can force the other to adopt their standard without begging the question, the burden of proof dispute is rationally inadjudicable in isolation. It is a normative disagreement about the aims of science disguised as a procedural disagreement about argumentation. The realist views science as aiming at a picture of the world as it is, while the anti-realist views science as aiming at instruments for saving the phenomena. Until the parties agree on the aim, they cannot agree on what requires proof.

  As for what could break the impasse, the prospects are dim if the question remains framed in its current metaphysical terms. A new historical case is unlikely to resolve the issue because of the individuation problem; any new example of a successful theory later revised will be parsed differently by each side depending on whether structural continuity is found. A formal result could potentially shift the weight of the debate if it definitively demonstrated that the no miracles argument is formally invalid as a probabilistic inference, but even then, realists could retreat to a non-probabilistic notion of explanation. The most honest answer is that the question as posed may be ill-formed because it relies on a notion of approximate truth that is not operationalizable in a way that satisfies both sides. If truth is defined structurally, the anti-realist argues it is not truth enough; if defined ontologically, the realist admits too much falsehood. A resolution would likely require a naturalized epistemology that bypasses the metaphysical debate entirely, focusing instead on the specific reliability of particular scientific methods rather than the global status of theories. However, within the current framework of analytic philosophy of science, the impasse is likely a permanent feature resulting from permissible divergences in prior credences and evaluative standards, meaning the debate will continue not because one side is irrational, but because they are playing different epistemic games with the same pieces.
