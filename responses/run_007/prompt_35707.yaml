prompt: |-
  The debate between scientific realists and anti-realists has been running in something like its current form since at least Laudan's 1981 paper on the pessimistic meta-induction, and the core moves have been on the table for decades now. The anti-realist points to the historical graveyard of empirically successful theories that turned out to be false — phlogiston, caloric fluid, the luminiferous ether — and argues by induction that our own successful theories are probably false too. The realist replies that these theories were not false through and through: their working parts were retained, their reference was preserved at the level that mattered, and the induction cherry-picks failures while ignoring the many theoretical posits that did survive. The anti-realist replies that this is post hoc — you can always redescribe a dead theory so that only its false parts count as essential — and that the realist's sampling argument cuts both ways. The realist replies that the anti-realist is demanding a kind of certainty science never promised. And around it goes.

  I want a diagnosis of what kind of disagreement this actually is, not a summary of the literature. Is it a hidden empirical dispute about the base rate of theoretical success conditional on falsity — a statistical question that nobody has the data to settle? Is it a disagreement about how to individuate and count theories in the historical record, so that the two sides are not even looking at the same sample? Is it a clash of prior credences that rational agents could permissibly hold, making the impasse a feature of Bayesian epistemology rather than a failure of argument? Is it a verbal dispute about the phrase "approximately true" that dissolves once you operationalize it? Or is it something else — a disagreement about who bears the burden of proof, where the realist thinks the anti-realist needs to show that success is a poor guide to truth and the anti-realist thinks the realist needs to show that it is a good one, and burden-of-proof disputes are not themselves rationally adjudicable? I have that last hypothesis, but I want to hear yours, supported by what each side actually says, and I want an honest answer about what, if anything, could break the impasse — a new historical case, a formal result, a sharper distinction, or the recognition that the question as posed is ill-formed. Please write in continuous prose without headings, bullet points, bold text, or tables.
