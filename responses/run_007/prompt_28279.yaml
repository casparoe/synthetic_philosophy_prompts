answer: |-
  A senior project lead must decide what to intend regarding the deployment schedule for a critical software update. She intends to deploy on Tuesday rather than Wednesday. Her reason is not that Tuesday offers better security or user availability, but that she believes the testing required for Wednesday is impossible to complete, and therefore forming an intention to deploy on Wednesday would violate the constitutive norm that one ought not intend what one believes impossible. The reason explicitly cites the rationality of the mental state itself—avoiding a condition of practical irrationality—rather than any intrinsic property of the Tuesday slot.

  **Walkthrough**

  **The Distinction's Verdict:** According to the standard object-given/state-given distinction, this reason classifies as **state-given**. Object-given reasons must cite features of the object of the attitude (in this case, the properties of Tuesday or Wednesday as dates). State-given reasons cite features of holding the attitude itself (the benefits or norms associated with *intending*). Since the engineer's reason is that intending Wednesday would make her mental state irrational (a property of the intention), the distinction categorizes this as a state-given reason, analogous to the demon's threat making admiration prudentially beneficial.

  **Why the Verdict is Wrong:** Intuitively, feasibility and means-end coherence are the **Right Kind of Reasons** for intention. Unlike admiration, where prudential benefits don't make the object admirable, intention is constitutively governed by norms of practical rationality. A reason that shows an intention would be irrational (because it targets the impossible) is not an external incentive; it is a direct constraint on the correctness of the attitude. Classifying this as the "wrong kind" implies that avoiding irrationality is merely a beneficial side-effect of intending, rather than a condition for intending correctly.

  **Structural Feature Causing the Misfire:** The misfire arises because the normativity of **practical attitudes** (intention/preference) is partly constitutive, whereas the normativity of **contemplative attitudes** (belief/admiration) is often treated as purely evaluative. For intention, the "object" is an action to be brought about by the state itself, blurring the line between the value of the outcome and the rationality of the state. The object/state distinction assumes a clean separation between the attitude and its object that dissolves when the attitude's own success conditions (feasibility) are the source of the reason.

  **Patchability:** The distinction can be patched by distinguishing between **constitutive state-reasons** (reasons grounded in the nature of the attitude, like feasibility) and **prudential state-reasons** (reasons grounded in external benefits, like the demon's threat). This patch saves the verdict on the demon case (prudential reasons remain Wrong Kind) while accommodating the engineering case (constitutive reasons become Right Kind). However, this fix opens a theoretical hole: it abandons the clean binary of object vs. state in favor of a substantive theory of what counts as "constitutive" for each attitude. This suggests the object/state distinction is not a universal structural solution to the WKR problem, but merely a heuristic that works for some attitudes (admiration) and fails for others (intention), undermining its utility as a general philosophical tool.
