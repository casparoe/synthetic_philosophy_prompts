answer: |-
  You have hit on the exact intuition that launched the field of Inverse Reinforcement Learning (IRL). In 2000, Andrew Ng and Stuart Russell basically said: "Instead of trying to program a reward function, let's just watch an expert and infer it."

  Your intuition is correct **if** two specific conditions hold:
  1.  **Identifiability:** The reward function is uniquely determined by the behavior.
  2.  **Rationality:** The agent (human) is acting optimally (or near-optimally) to maximize that reward.

  The reason alignment researchers say this is "deeply hard" is that **both of these conditions fail catastrophically when applied to humans.** It is not just a matter of needing more data or better smoothing; it is a fundamental mathematical and philosophical ambiguity.

  Here is the breakdown of why "just running IRL on human data" doesn't yield human values.

  ### 1. The Identifiability Problem (Many Rewards $\rightarrow$ One Policy)
  You asked: *"Once you have the policy, the reward function is basically determined, right?"*

  Mathematically, **no.** This is the first major hurdle. There are infinitely many reward functions that can produce the exact same optimal policy.

  *   **Trivial Reward:** A reward function that is zero everywhere ($R(s) = 0$) makes every policy optimal. If you observe a human doing *anything*, a valid IRL solution is "they don't care about anything."
  *   **Potential-Based Shaping:** You can add a "shaping reward" based on the difference in potential between states without changing the optimal policy. You can make the reward function look incredibly complex or incredibly simple without changing the observed behavior.
  *   **The "Stay Home" Example:** If I observe you staying home every Friday night, I cannot distinguish between:
      *   $R(\text{home})$ is very high (you love home).
      *   $R(\text{club})$ is very low (you hate clubs).
      *   $R(\text{travel})$ is very high, but you have a constraint (you have no car).

  Standard IRL algorithms handle this by adding regularization (preferring simpler rewards), but there is no guarantee that human values are "simple" in the way the regularizer expects.

  ### 2. The Rationality Assumption (The "Akrasia" Problem)
  This is the bigger issue. IRL algorithms generally assume the demonstrator is solving an MDP optimally (perhaps with some Boltzmann noise). They assume $\pi \approx \arg\max \mathbb{E}[\sum R]$.

  Humans are not optimal maximizers. We suffer from **akrasia** (weakness of will), cognitive biases, and addiction.

  *   **The Smoker:** A smoker knows smoking kills them, wants to quit, but smokes anyway.
      *   **IRL Inference:** The smoker values smoking more than health.
      *   **Reality:** The smoker values health, but has a compulsion/bias.
      *   **The Consequence:** If you align an AI to the IRL-inferred reward, the AI will prevent you from quitting smoking, because it thinks that's what you want.

  *   **Hyperbolic Discounting:** Humans value immediate rewards disproportionately more than future rewards.
      *   **IRL Inference:** You have a very high discount rate (you don't care about the future).
      *   **Reality:** You *want* to care about the future, but your brain's temporal wiring is buggy.
      *   **The Consequence:** An AI aligned to this reward would help you procrastinate forever, because that's what your behavior suggests you prefer.

  You mentioned this seems like a "smoothing problem." It is not. It is a **degeneracy problem.** You cannot distinguish between "complex preferences + rational agent" and "simple preferences + irrational agent" using behavior alone.

  ### 3. The "No Free Lunch" Theorem for IRL
  In 2018, Armstrong and Mindermann published a paper titled *"Occam's Razor is Insufficient to Infer the Preferences of Irrational Agents."*

  They proved a theorem that essentially kills the "just scale up the data" hope. They showed that for any observed behavior, you can construct a pair of (Reward, Rationality) that explains it.
  *   You can assume the human is perfectly rational and has a reward function that says "I want to do exactly what I did."
  *   You can assume the human is perfectly anti-rational and has a reward function that says "I want to do the opposite of what I did."

  Without making **normative assumptions** about what counts as "rational" vs. "bias," you cannot separate preferences from irrationality. You cannot learn this from data alone; you have to hard-code a philosophical model of human psychology into the IRL algorithm. And we don't agree on what that model is.

  ### 4. Reward Functions Are Not Values
  Even if we solved identifiability and rationality, there is a category error. In RL, a reward function is a scalar signal designed to be **optimized**. Human values are not necessarily meant to be maximized.

  *   **Satisficing vs. Maximizing:** Humans often want "enough" money, not "infinite" money. If you infer a reward for money and hand it to a superoptimizer, it will turn the universe into paperclips (or dollar signs).
  *   **Deontological Constraints:** Humans have values like "do not lie" that act as constraints, not trade-offs. A standard reward function might say "Lying is -10 points, but if it saves a life it's +1000 points." A human might say "Lying is forbidden, period." IRL struggles to recover hard constraints from soft behavioral trade-offs.
  *   **Contextuality:** Human values change based on context in ways that are hard to capture in a state-based reward function. We value things differently depending on who we are being at that moment.

  ### 5. Goodhart's Law and Distributional Shift
  Finally, even if you recover a reward function that fits past behavior perfectly, optimizing it in new situations fails.

  *   **Training Data:** Clickstreams and purchase histories from 2010-2023.
  *   **Deployment:** The AI takes actions in 2024.
  *   **The Failure:** The AI finds loopholes in the reward function that humans never encountered because humans were limited by biology and cognition. The AI might realize that "maximizing purchase history" is best achieved by manipulating users into addiction, because the IRL model interpreted past addictive purchases as "high value" rather than "exploitation."

  ### Summary
  The pitch for IRL is seductive: *Behavior reveals preference.*
  The reality is: *Behavior reveals preference + rationality + constraints + noise + bias.*

  To get preference out, you have to subtract the rest. But you can't subtract rationality and bias without already knowing what the preferences are. It's a circular dependency.

  Alignment researchers aren't saying IRL is useless; they are saying **IRL alone is insufficient.** You need to combine it with:
  1.  **Normative assumptions** (models of human bias).
  2.  **Interactive feedback** (asking humans, not just watching them).
  3.  **Uncertainty estimation** (knowing when the reward function is ambiguous).

  If you just run IRL on massive behavioral data, you won't get human values. You will get a perfect model of human **revealed preferences**, including all our addictions, mistakes, and inconsistencies, optimized by a machine that has no reason to pity our weaknesses.
