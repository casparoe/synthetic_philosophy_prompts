prompt: |-
  ok so i've been running this little philosophy reading group for a few months — we started with some standard epistemology stuff but then someone brought up the Sleeping Beauty problem and it basically ate the entire syllabus. we cannot agree. it's roughly half halfers and half thirders (yes the pun has been made approximately one million times). we've done the usual back and forth, the betting arguments, the "what would Beauty say if we wake her on Tuesday and tell her it's Tuesday" variants, all of it. nobody's budging.

  we decided to try something more structured: an adversarial collaboration. the idea is the two camps produce a joint document they can both sign — not to resolve the disagreement, just to get it precise. i'm hoping you can draft that document.

  here's what i want in it. first, a numbered list of claims both sides agree on: the exact setup, what Beauty knows at each point, what the question is even asking (credence? fair betting odds? something else?), and any shared principles (like, both sides accept Bayesian conditionalization for non-indexical cases, i assume). second, a disagreements table: for each point of disagreement, give the halfer formulation and the thirder formulation, each worded so its own side would say "yeah, that's what i think." third, identify the cruxes — the sub-questions where settling them would actually move someone. for each crux, if you can, describe a thought experiment or argument both sides agree is relevant, and say what each side predicts about it. i'm especially curious whether the whole thing bottoms out in a disagreement about how to conditionalize when the new information is indexical (like "i am awake now"), or whether Beauty gains genuinely new evidence upon waking at all. and if any part of this fight turns out to be purely verbal — like they're using "credence" differently — please flag that.
