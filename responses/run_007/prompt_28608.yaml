answer: |-
  Here is a draft for your adversarial collaboration document. It is designed to be neutral, precise, and structured to highlight exactly where the divergence occurs without forcing a resolution.

  You can copy-paste this into a shared doc for your group to annotate.

  ***

  # ADVERSARIAL COLLABORATION DRAFT: THE SLEEPING BEAUTY PROBLEM

  **Date:** [Insert Date]
  **Participants:** The Halfer Camp & The Thirder Camp
  **Objective:** To precisely map the agreement, disagreement, and underlying cruxes of the Sleeping Beauty problem without attempting to force a consensus.

  ## I. AGREED-UPON CLAIMS (COMMON GROUND)

  Both camps affirm the following claims regarding the setup, epistemic states, and definitions.

  1.  **The Experimental Setup:**
      *   A fair coin is tossed on Sunday. $P(\text{Heads}) = P(\text{Tails}) = 1/2$.
      *   If **Heads**: Beauty is awakened on Monday only.
      *   If **Tails**: Beauty is awakened on Monday and Tuesday.
      *   Between awakenings, Beauty is administered a drug that induces perfect amnesia regarding the awakening. She cannot distinguish Monday from Tuesday, nor can she distinguish an awakening from a non-awakening day (if one existed).
      *   Beauty knows all these details prior to the experiment.

  2.  **The Prior State (Sunday):**
      *   On Sunday, before the coin is tossed (or immediately after, before sleep), Beauty's credence that the coin will land/is Heads is $1/2$.
      *   Both camps agree that standard Bayesian conditionalization applies to non-indexical, non-self-locating evidence.

  3.  **The Target Question:**
      *   The question under dispute is: *Upon awakening during the experiment (but before being told the day or the coin result), what is Beauty's rational credence that the coin landed Heads?*
      *   Both camps agree "credence" refers to a subjective degree of belief that guides action and assertion, though they may differ on the precise operationalization (see Section III).

  4.  **Rationality:**
      *   Both camps agree Beauty is a rational agent. She makes no calculation errors, forgets nothing except via the experimental drug, and updates her beliefs according to rational norms (though they disagree on which norms apply to this case).

  5.  **No New Non-Indexical Evidence:**
      *   Both camps agree that upon waking, Beauty receives no *external* information (e.g., she sees no newspaper, hears no news report) that discriminates between Heads and Tails worlds directly.

  ---

  ## II. DISAGREEMENTS TABLE

  | Point of Contention | Halfer Formulation | Thirder Formulation |
  | :--- | :--- | :--- |
  | **1. The Credence Value** | Upon awakening, Beauty's credence in Heads should remain **1/2**. | Upon awakening, Beauty's credence in Heads should shift to **1/3**. |
  | **2. Nature of New Evidence** | Waking provides **no new relevant evidence**. Beauty knew on Sunday she would wake up at least once. The fact "I am awake now" was expected with probability 1 in both Heads and Tails worlds. | Waking provides **new self-locating evidence**. The indexical proposition "I am awake now" is twice as likely to be tokened in a Tails world (two opportunities) as in a Heads world (one opportunity). |
  | **3. Betting & Dutch Books** | Betting odds do not map 1:1 to credence here. A bet offered on *every awakening* counts the Tails outcome twice. Beauty should accept 1:2 betting odds, but this reflects the **payoff structure**, not her credence. | Credence *must* align with fair betting odds to avoid a Dutch Book. If Beauty bets on Tails at 1:1 odds every awakening, she loses money on Heads but wins twice on Tails. Her credence should reflect this expected value. |
  | **4. Principle of Indifference** | Indifference applies to the **mutually exclusive outcomes of the chance process** (the Coin). There are two outcomes: H and T. | Indifference applies to **indistinguishable centered worlds** (awakenings). There are three subjectively indistinguishable situations: (Heads/Mon), (Tails/Mon), (Tails/Tue). |
  | **5. The Sunday-to-Monday Shift** | Beauty's credence should not change from Sunday to Monday absent new *objective* information. A shift from 1/2 to 1/3 implies irrational belief updating without evidence. | Beauty's credence *should* change. On Sunday, she is uncertain about the coin. On Monday, she is uncertain about the coin *and* her location in time. The addition of self-locating uncertainty shifts the probability mass. |

  ---

  ## III. THE CRUXES (WHERE THE FIGHT BOTTOMS OUT)

  This section identifies the sub-questions where settling the matter would likely move a participant from one camp to the other.

  ### Crux 1: Indexical Conditionalization
  **The Question:** Can purely indexical information (e.g., "I am experiencing this moment now") serve as evidence that updates probabilities about non-indexical facts (e.g., a coin toss)?

  *   **Relevant Thought Experiment:** *The Extreme Sleeping Beauty.*
      *   If Tails, Beauty is awakened 1,000,000 times. If Heads, only once. Upon waking, is it rational to bet heavily on Tails?
  *   **Halfer Prediction:** No. Even with 1,000,000 awakenings, the coin is still fair. The "evidence" of waking was guaranteed to happen. Betting heavily on Tails is rational only because the *payoff* is repeated, not because the probability of Heads has dropped to 1/1,000,001.
  *   **Thirder Prediction:** Yes. Finding oneself in one of 1,000,001 possible awakening moments makes it overwhelmingly likely one is in a Tails-awakening. Credence in Heads should drop to ~1/1,000,001.
  *   **Status:** **Substantive.** This is not merely verbal; it is a disagreement about the logic of evidence.

  ### Crux 2: The Definition of Credence
  **The Question:** Is "credence" defined by adherence to Bayesian updating norms (Halfer leaning) or by coherence with betting dispositions/frequency in repeated trials (Thirder leaning)?

  *   **Relevant Argument:** *The Dutch Book.*
      *   If Beauty says $P(\text{Heads}) = 1/2$ but accepts bets that guarantee a loss over the course of the experiment (due to double betting on Tails), is she irrational?
  *   **Halfer Prediction:** She is not irrational. The Dutch Book works only because the bookie exploits the *number of bets*, not the *probability*. Credence is distinct from betting quotient when the number of bets is correlated with the truth value.
  *   **Thirder Prediction:** She is irrational. If your credence doesn't match the odds that prevent guaranteed loss in the scenario you are actually in, your definition of credence is broken.
  *   **Status:** **Potentially Verbal.** If Halfers define credence as "probability of the proposition" and Thirders define it as "probability of being in this situation given the proposition," they may be calculating different variables.

  ### Crux 3: The "New Evidence" Condition
  **The Question:** Does Beauty learn something upon waking that she did not know on Sunday?

  *   **Relevant Argument:** *The Content of Knowledge.*
      *   Sunday: "I will wake up at least once."
      *   Monday: "I am awake *now*."
  *   **Halfer Prediction:** These are logically equivalent in terms of relevance to the coin. Since $P(\text{Awake} | \text{Heads}) = 1$ and $P(\text{Awake} | \text{Tails}) = 1$, Bayes' theorem dictates no update.
  *   **Thirder Prediction:** They are distinct. The proposition "I am awake *now*" is a *centered proposition*. The probability of this specific token experience occurring is higher in Tails worlds.
  *   **Status:** **Substantive.** This rests on whether one accepts "Centered Worlds" as valid bearers of probability.

  ### Crux 4: Verbal Dispute Flag (The "Credence" Ambiguity)
  **The Question:** Are the two camps answering different questions?

  *   **Analysis:**
      *   **Halfer Question:** "What is the probability that the coin landed Heads?" (Focus on the **World**).
      *   **Thirder Question:** "What is the probability that *this specific awakening* is associated with a Heads coin?" (Focus on the **Centered World**).
  *   **Diagnostic Test:** Ask both sides: *"If we ask Beauty 'Is the coin Heads?', what is the probability her answer is correct if she says 'No'?"*
      *   If Halfers say 50% and Thirders say 66%, the dispute is about the **World**.
      *   If Halfers say 50% and Thirders say 66% *but agree the coin bias hasn't changed*, the dispute is about **Self-Location**.
  *   **Consensus Check:** Both sides generally agree the *coin* is fair. The disagreement is whether Beauty's *epistemic position* regarding the coin changes due to her self-location.
  *   **Verdict:** **Partially Verbal.** Much of the heat comes from conflating $P(\text{Heads})$ with $P(\text{Heads} | \text{Current Awakening})$. However, even after distinguishing these, a substantive disagreement remains regarding which probability is the rational guide for action.

  ---

  ## IV. SIGNATURES

  *By signing below, we agree that this document accurately represents the points of agreement, disagreement, and cruxes as described above. We do not necessarily agree with the opposing camp's formulations, but we agree that they are charitable and precise enough to proceed.*

  **Halfer Camp Representatives:** ____________________

  **Thirder Camp Representatives:** ____________________

  **Date:** ____________________
