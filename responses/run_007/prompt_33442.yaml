answer: |-
  Good morning. Welcome, everyone.

  Looking around this room, I see a divide that we rarely bridge so directly. On one side, we have clinicians and researchers who have spent careers mastering the tools of diagnosis. You know the DSM and the ICD like the backs of your hands. You have used them to unlock treatment, to validate suffering, and to build careers on understanding the architecture of mental distress.

  On the other side, we have service users and advocates. Many of you carry those same diagnostic codes, not as abstract criteria, but as lived reality. For some, a label was a key that opened a door to care. For others, it was a weight that settled on your chest, a story written about you that you didn't get to edit. Some of you are here because you believe these categories have done real harm.

  Both of those experiences are true. And both are welcome here.

  We are gathered to talk about reform. But before we talk about changing the criteria, or the thresholds, or the language, I want us to pause and think about the material we are working with.

  In most of medicine, classification is an act of discovery. If a geologist finds a stone and classifies it as granite, the stone does not care. The stone does not go home and read about granite. It does not worry that it might actually be sandstone. It does not change its texture because it was named. The classification sits outside the object. The object remains still.

  Psychiatry is different. When we classify a person, the person notices.

  This is the fundamental challenge we face, and I want us to feel the weight of it together. When a diagnosis is spoken aloud in a consultation room, it does not just describe what is already there. It enters the room. It lands. The person takes it home. They google it. They talk to their partner about it. They might feel relief—"There is a name for this." Or they might feel shame—"There is something wrong with me."

  And because they have that name, they begin to watch themselves differently. They notice symptoms they missed before. They might unconsciously align their behavior with what they understand the diagnosis to be. Or they might fight against it fiercely. Their family treats them differently. Their employer might treat them differently.

  So, when that person comes back to the clinic six months later, they are not the same person who walked in the first time. The classification itself has shifted the ground beneath their feet.

  This means that our categories are not static targets. They are moving.

  For my colleagues in research and clinical practice, I want to be very clear: This is not a failure of your rigor. It is not a problem you can solve with a sharper questionnaire or a better brain scan. It is not simply "noise" in the data that we need to filter out. It is structural. It is built into the nature of working with human beings who have self-awareness.

  You are trying to measure something that changes because it is being measured. If we pretend otherwise, if we pretend our classifications are like classifying rocks, we will always be chasing a moving target. We will wonder why prevalence rates shift, why symptoms morph over decades, why a category that made sense in 1990 feels different today. It is because the people inside the categories are reacting to the categories.

  This is a challenge to your work, but it is also an invitation. It invites you to see diagnosis not just as a technical act of identification, but as an intervention in itself. The moment you name it, you are already changing it. That requires a humility about what our tools can do. It means acknowledging that precision is not just about accuracy; it is about impact.

  For the service users and advocates in the room, I want to say this: We hear you. We know that these labels are not neutral. We know that once a diagnosis is written in your chart, it travels with you. It shapes your identity. It can narrow your horizons, or it can expand them. Too often, the system has treated your reaction to the label as a symptom, rather than a valid response to being labeled.

  When you say that the diagnosis changed how you see yourself, you are describing a real phenomenon. You are not imagining it. You are participating in the very mechanism that makes psychiatry so difficult, and so unique. Your experience is not outside the science; it is central to it.

  So, where does that leave us?

  It leaves us with a task that is harder than simply rewriting a manual. If the categories keep moving because we are human, then reform cannot just be about finding the "right" definitions. It must be about how we use them, how we share them, and how we acknowledge their power.

  We need to build a system that understands this feedback. When we propose a new category, we must ask: What happens when people know this exists? When we remove a category, we must ask: What happens to the people who built their lives around it?

  We cannot eliminate this dynamic. We cannot go back to a time before people knew what depression or schizophrenia or bipolarity were. But we can stop pretending that our classifications are silent observations. They are conversations. They are relationships.

  Over the next few days, there will be tension. There will be moments where the clinicians here feel their expertise is being questioned, and moments where the service users feel their pain is being theorized. I ask you to lean into that discomfort.

  To the clinicians: Listen to the users not just as data points, but as evidence of how your tools land in the real world.
  To the users: Know that the clinicians here are not your adversaries; they are trying to help within a system that is struggling to catch up with this complexity.

  We are here to acknowledge that the map is not the territory, and in psychiatry, the map changes the territory. Let's work together to draw a map that knows its own power.

  Thank you. Let's get to work.
