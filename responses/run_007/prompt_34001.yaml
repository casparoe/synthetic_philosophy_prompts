answer: |-
  The established name for this is **the Acquaintance Principle**.

  It is a central concept in analytic aesthetics, most famously articulated by the philosopher Richard Wollheim in 1980, though its roots go back to Kant and Hume.

  ### The Principle
  The Acquaintance Principle states that **aesthetic judgments must be based on first-hand experience of the object.** You cannot legitimately judge that a movie is good, a painting is beautiful, or a wine is complex solely on the testimony of others.

  This explains the asymmetry you noticed with your friend.
  *   **Factual Claims:** If a friend says, "This car has a V8 engine," you can adopt that belief. The property (V8 engine) is objective and independent of your experience of it.
  *   **Aesthetic Claims:** If a friend says, "This movie is moving," they are reporting on *their* response to the movie. To agree that it is "moving," you must have the response yourself. If you haven't seen it, you can believe *they were moved*, but you cannot judge *the movie is moving.*

  ### Where the Edges Are
  The principle is clean in theory but messy in practice. Here is how it handles your specific edge cases:

  **1. The Wine Expert (Corked Bottle)**
  *   **Verdict:** This is usually considered a **factual judgment**, not a pure aesthetic one.
  *   **Why:** A "corked" wine contains a specific chemical compound (TCA). An expert can identify this via chemical analysis or trained detection without you needing to taste it to accept the *fact* that it is spoiled. However, if the expert says, "This wine has notes of blackberry and velvet tannins," the Acquaintance Principle kicks in. You can believe *they taste that*, but you cannot claim *the wine tastes that* until you drink it. The line is drawn between defect detection (fact) and quality assessment (taste).

  **2. The Music Teacher (Worth Studying)**
  *   **Verdict:** This is often treated as a **pedagogical judgment**, which can bypass the principle.
  *   **Why:** When a teacher says, "This piece is worth studying," they are often making a claim about utility, technical value, or historical significance, not just pure beauty. You can accept the testimony that "learning this will improve your technique" without playing it. However, if they say, "This piece is profoundly expressive," the Acquaintance Principle applies again. You must play or hear it to validate the expressiveness.

  ### Knowledge vs. Conversational Norm
  This is the biggest battleground in current philosophy. There are two camps:

  1.  **The Epistemic View (Hard Line):** You literally **cannot know** the movie is good without seeing it. Testimony provides belief, but not aesthetic knowledge. Your friend is making a metaphysical claim about the limits of your knowledge.
  2.  **The Normative View (Soft Line):** You might actually *know* it's good (via reliable testimony), but it is **inappropriate to assert it** as your own judgment. To say "It is good" implies you have engaged with the reasons for its goodness (the experience). To say "I hear it's good" acknowledges you are relying on authority.

  Most contemporary philosophers lean toward the **Normative View**. They argue that aesthetic properties *can* be transmitted via testimony (you can know it's good), but the *practice* of aesthetic criticism requires you to ground your judgments in experience to participate in the "conversation of taste."

  ### Confidence and Uncertainty
  **Confidence Level:** I am **95% confident** in this mapping. The term "Acquaintance Principle" is the standard terminology in aesthetics, and the distinction between aesthetic and non-aesthetic testimony is the canonical explanation for the asymmetry you observed.

  **Point of Least Certainty:** I am least sure about the **consensus on expert testimony**. While the "standard story" (as outlined above) distinguishes between defects (fact) and quality (taste), there is a vigorous ongoing debate about whether true expertise *breaks* the Acquaintance Principle. Some epistemologists argue that if a critic is reliable enough, their testimony *does* grant you aesthetic knowledge, rendering the principle false in practice. The boundary of whether an expert's word counts as "experience by proxy" is the most contested edge of this theory.
