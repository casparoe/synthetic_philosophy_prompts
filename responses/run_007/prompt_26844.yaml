      *   **Format:** Each question needs a follow-up anticipating her likely comeback.

  2.  **Deconstruct the Guest's Position (Davidsonian Hardcore):**
      *   *Meaning is Truth-Conditional:* To know the meaning is to know the conditions under which a sentence is true.
      *   *Radical Interpretation:* Starting from scratch, observing behavior/environment to assign truth conditions.
      *   *Principle of Charity:* We must maximize agreement between interpreter and interpretee to make interpretation possible. If we assume they are mostly wrong, we can't fix the reference of their terms.
      *   *Constitutive Claim:* It's not that we *should* be charitable to be nice; it's that without charity, there *is* no meaning to interpret.
      *   *Triangulation:* Meaning arises from the causal interaction between two creatures and a shared world.

  3.  **Drafting Questions (Iterative Process):**

      *   *Topic 1: Projection (Mandatory)*
