          *   *Refinement:* What work is triangulation doing that Charity + Causal Theory isn't already doing? Is it just an add-on?
          *   *Follow-up:* She'll say "It fixes the object of belief." Follow-up: Does that reintroduce a scheme/content dualism Davidson hated?

      *   *Topic 4: Normativity*
          *   *Idea:* Meaning is normative (oughts). Charity is descriptive (is). How do you get from is to ought?
          *   *Refinement:* If meaning is constitutive, does that make error impossible?
          *   *Follow-up:* She'll distinguish local vs. global error.

      *   *Topic 5: Conceptual Schemes*
          *   *Idea:* Davidson famously attacked the "third dogma" (scheme/content). But doesn't RI enforce *our* scheme on everyone?
          *   *Refinement:* If we can't conceive of a radically different scheme, isn't that intellectual imperialism?
          *   *Follow-up:* She'll say "It's not imperialism, it's the condition of intelligibility."

      *   *Topic 6: The "First" Person*
