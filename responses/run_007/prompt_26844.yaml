          *   *Refinement:* Focus on the distinction between *finding* agreement and *imposing* it.
          *   *Follow-up:* She'll likely say "No, because of causal constraints." So the follow-up needs to press on whether those constraints are strong enough.

      *   *Topic 2: False Beliefs/Conspiracy Theorists (Mandatory)*
          *   *Idea:* Davidson says we can't be mostly wrong. But flat earthers seem mostly wrong about geography. How do you interpret them?
