          *   *Refinement:* If Charity is constitutive, do I have privileged access to my own mind, or am I just interpreting myself like another?
          *   *Follow-up:* She'll likely defend externalism.

      *   *Topic 7: Moral/Political Implications*
          *   *Idea:* If understanding requires agreement, does that mean we can't understand our enemies?
