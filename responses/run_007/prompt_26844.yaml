prompt: |-
  I host a podcast about philosophy of language for a general-but-nerdy audience, and my next guest is a philosopher who defends a pretty hardcore version of Davidson's radical interpretation — she thinks the principle of charity isn't just a methodological trick but literally constitutive of meaning. Like, you can't even be wrong about what someone means without presupposing massive agreement. I want questions that push her into the uncomfortable corners of the view. Draft me 8-10 questions. I especially want at least one on whether the charity principle just ends up projecting the interpreter's own beliefs onto the speaker (and how she'd distinguish genuine interpretation from that), one on how radical interpretation deals with people who hold systematically false beliefs — think a conspiracy theorist or someone in a cult — and one on what triangulation actually buys you that the charity principle doesn't already give you. For each, include a follow-up that anticipates her most likely comeback.
