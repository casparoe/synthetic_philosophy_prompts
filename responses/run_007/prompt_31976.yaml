answer: |-
  # Decision Tree: Inferential Commitments in Anthropics

  This tree sorts positions based on answers to concrete inferential questions rather than allegiance to named theories. Answer the questions in order. Your path determines your inferential commitments, the awkward consequences you must accept, and which named positions (if any) align with your view.

  ### **Node 1: The Presumptuous Philosopher & Coin Flip Case**
  **Question:** Consider two empirically indistinguishable theories: $T_1$ predicts 1 billion observers will exist; $T_2$ predicts 1 trillion observers will exist. Alternatively, consider a coin flip: Heads creates one copy of you; Tails creates two identical copies. You wake up. Does the mere fact that *you exist* (or that you are awake) provide evidence favoring the hypothesis with more observers ($T_2$ or Tails), independent of any other data?

  *   **YES:** (Your existence is evidence.) → Go to **Node 2A**.
  *   **NO:** (Your existence is not evidence.) → Go to **Node 2B**.

  ---

  ### **Node 2A: Reference Class Requirement (For "YES" on Node 1)**
  **Question:** You accept that existence favors hypotheses with more observers. However, to calculate probabilities regarding your specific observations (e.g., your birth rank or sensory data), must you still assume you are a random sample from a defined **reference class** of observers, or does conditioning on "I exist" suffice without a sampling assumption?

  *   **NO REFERENCE CLASS NEEDED:** (Conditioning on existence suffices.) → **Leaf 1**.
  *   **REFERENCE CLASS NEEDED:** (Sampling assumption still required.) → Go to **Node 3A**.

  ---

  ### **Node 2B: Reference Class Requirement (For "NO" on Node 1)**
  **Question:** You deny that existence itself favors hypotheses with more observers. To make any inference about observer counts (such as in the Doomsday Argument), must you assume your birth rank is a random sample from a defined **reference class**, or do you reject sampling assumptions entirely?

  *   **NO REFERENCE CLASS NEEDED:** (Reject sampling assumptions.) → **Leaf 2**.
  *   **REFERENCE CLASS NEEDED:** (Adopt sampling assumption.) → Go to **Node 3B**.

  ---

  ### **Node 3A: Reference Class Uniqueness (For SIA-style views)**
  **Question:** You require a reference class despite accepting existence as evidence. Is there a single, principled definition of this class (e.g., "all conscious observers") that is uniquely determined by rationality, or is the choice underdetermined?

  *   **UNIQUELY DETERMINED:** → **Leaf 3**.
  *   **UNDERDETERMINED:** → **Leaf 4**.

  ---

  ### **Node 3B: Reference Class Uniqueness (For SSA-style views)**
  **Question:** You rely on a reference class for sampling (e.g., for the Doomsday Argument). Is there a single, principled definition of this class that is uniquely determined by rationality, or is the choice underdetermined such that different admissible choices reverse your conclusions?

  *   **UNIQUELY DETERMINED:** → **Leaf 5**.
  *   **UNDERDETERMINED:** → **Leaf 6**.

  ---

  ## **Leaves: Positions and Commitments**

  ### **Leaf 1: Pure Self-Indication Assumption (SIA)**
  *   **Path:** Existence = Evidence → No RC Needed.
  *   **Characterization:** Your existence is itself evidence favoring hypotheses on which more observers exist; no reference class is required to update on self-locating information.
  *   **Established Name:** SIA / Full Non-Indexical Conditioning.
  *   **Awkward Commitment:** It licenses the **Presumptuous Philosopher's conclusion**, allowing you to reject well-tested physical theories solely because they predict fewer observers than a rival theory.
  *   **Licenses Presumptuous Philosopher:** **YES**.

  ### **Leaf 2: Static Credence / Halferism**
  *   **Path:** Existence ≠ Evidence → No RC Needed.
  *   **Characterization:** Self-locating information, including your own existence and birth rank, should not move your credence in non-indexical hypotheses.
  *   **Established Name:** Halferism (Sleeping Beauty) / Static View.
  *   **Awkward Commitment:** It requires ignoring seemingly relevant indexical evidence, implying that waking up in the Sleeping Beauty problem provides no evidence about the coin toss.
  *   **Licenses Presumptuous Philosopher:** **NO**.

  ### **Leaf 3: SIA with Fixed Reference Class**
  *   **Path:** Existence = Evidence → RC Needed → RC Unique.
  *   **Characterization:** Existence favors more observers, but precise predictions require a uniquely determined reference class.
  *   **Established Name:** Unnamed (Hybrid).
  *   **Awkward Commitment:** It is theoretically redundant; if existence already favors more observers, the reference class often becomes otiose, making this view unstable between Leaf 1 and Leaf 4.
  *   **Licenses Presumptuous Philosopher:** **YES**.

  ### **Leaf 4: SIA with Reference Class Problem**
  *   **Path:** Existence = Evidence → RC Needed → RC Underdetermined.
  *   **Characterization:** Existence favors more observers, but the choice of reference class cannot be fixed in a principled way, so conclusions depend on arbitrary boundaries.
  *   **Established Name:** SIA Skepticism.
  *   **Awkward Commitment:** It accepts the Presumptuous Philosopher's evidence weight but admits the final probability calculation is arbitrary due to class boundaries.
  *   **Licenses Presumptuous Philosopher:** **YES**.

  ### **Leaf 5: Standard Self-Sampling Assumption (SSA)**
  *   **Path:** Existence ≠ Evidence → RC Needed → RC Unique.
  *   **Characterization:** You should reason as if your birth rank is random among all observers in a chosen reference class, and your existence as such does not separately favor hypotheses with more observers.
  *   **Established Name:** SSA.
  *   **Awkward Commitment:** It licenses the **Doomsday Argument**, implying you should assign high probability to human extinction soon based solely on your early birth rank.
  *   **Licenses Presumptuous Philosopher:** **NO**.

  ### **Leaf 6: SSA with Reference Class Problem**
  *   **Path:** Existence ≠ Evidence → RC Needed → RC Underdetermined.
  *   **Characterization:** The choice of reference class cannot be fixed in a principled way, so any rule that depends on one is underdetermined and different admissible choices reverse the conclusions.
  *   **Established Name:** Reference Class Problem Skepticism.
  *   **Awkward Commitment:** It renders anthropic reasoning impotent; you cannot conclude the Doomsday Argument is true or false without an arbitrary definition of "observer."
  *   **Licenses Presumptuous Philosopher:** **NO**.

  ---

  ## **Analysis of Logical Space**

  ### **Unoccupied or Unstable Combinations**
  *   **Existence = Evidence + RC Needed + RC Unique (Leaf 3):** While logically possible, this combination is rarely defended as a stable endpoint. Proponents of "Existence = Evidence" (SIA) typically argue that conditioning on existence renders the reference class irrelevant (collapsing to Leaf 1). Those who insist on a reference class usually deny that existence *itself* is evidence (collapsing to Leaf 5). This leaf is **unattractive/unstable** rather than incoherent.
  *   **Existence ≠ Evidence + RC Not Needed (Leaf 2):** This combination was historically **unexplored** in early anthropics but has gained traction via "Halfer" positions in the Sleeping Beauty problem. It is now occupied.

  ### **Inseparable Pairs**
  *   **Leaf 1 (Pure SIA) and Leaf 3 (SIA + Fixed RC):** The tree cannot separate these in practice. If one accepts that existence is evidence (Node 1: YES), the mathematical impact of a reference class (Node 2A) often cancels out or becomes irrelevant to the final posterior. A user might answer "RC Needed" out of habit but derive the same conclusions as a "Pure SIA" user.
  *   **Leaf 5 (Standard SSA) and Leaf 6 (SSA + RCP):** If the reference class is underdetermined (Leaf 6), the "Standard SSA" rule cannot be applied consistently. However, a user might accept SSA as the *correct rule* while admitting they don't know the class (Leaf 6), making the practical distinction between 5 and 6 merely epistemic rather than inferential.

  ### **Presumptuous Philosopher Licensing**
  *   The Presumptuous Philosopher's conclusion (that we should favor theories with more observers solely based on our existence) is licensed by **Leaf 1, Leaf 3, and Leaf 4**.
  *   Any path answering **YES** to Node 1 accepts the core inferential move of the Presumptuous Philosopher, regardless of whether they subsequently complicate the view with reference class constraints.
