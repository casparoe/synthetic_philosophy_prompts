answer: |-
  Here is a specification of desiderata for an adequate theory of HCH-style factored cognition as an idealization of deliberation. The requirements are categorized by the structural, epistemic, and dynamic constraints they address. Each requirement is paired with the specific forcing case or consideration that necessitates it.

  ### I. Structural and Cognitive Desiderata

  **1. The Atomic Baseline Requirement**
  *   **Requirement:** The theory must specify a stopping condition for decomposition where the cognitive load of the subtask is strictly lower than the cognitive load of evaluating the decomposition itself.
  *   **Forcing Case:** *The simple question that needs no decomposition.* (e.g., "Is this apple red?"). A theory that mandates decomposition for all queries introduces overhead that degrades performance on trivial tasks. The idealization must collapse to direct perception/intuition at the leaves.
  *   **Status:** **Non-negotiable.** Without this, the system is inefficient by definition.

  **2. The Complexity Reduction Condition**
  *   **Requirement:** The theory must demonstrate that for any decomposed node, the subquestions are cognitively easier *for the agent type* than the parent question, not just semantically smaller.
  *   **Forcing Case:** *The subquestion that is harder to evaluate than the parent question.* (e.g., Decomposing "How do I fix this engine?" into "What is the precise tensile strength of every bolt?" vs. "Check the manual."). If decomposition increases cognitive complexity (e.g., by introducing abstract formalism where intuition sufficed), the factoring fails.
  *   **Status:** **Non-negotiable.** This is the core claim of "factored" cognition. If factors are not easier, it is not factored cognition.
  *   **Naive View Excluder:** This is the **single requirement that does the most to exclude naive versions of the view.** Naive accounts assume semantic decomposition implies cognitive simplification. This requirement forces the theory to account for the *agent's* cognitive bottlenecks, not just the task's logical structure.

  **3. The Aggregation Integrity Requirement**
  *   **Requirement:** The recombination function (synthesis) must preserve the truth-value or utility of the subanswers within a bounded error margin, without requiring the overseer to re-solve the parent problem.
  *   **Forcing Case:** *The synthesis task where decomposition genuinely helps.* (e.g., Summarizing 50 documents). If the synthesis step requires as much work as doing the task from scratch, the decomposition yields no leverage. The theory must explain how local answers compose into a global answer without exponential loss of fidelity.
  *   **Status:** **Non-negotiable.** Without this, the system cannot scale.

  **4. The Holistic Constraint Requirement**
  *   **Requirement:** The theory must account for dependencies between subanswers that are not visible at the local node level.
  *   **Forcing Case:** *The case where the parent question demands a global consistency check across subanswers.* (e.g., Allocating a fixed budget across departments). Local optimization of sub-answers can lead to global incoherence (e.g., total spend > budget). The idealization must include a mechanism for constraint propagation that does not require centralizing all information.
  *   **Status:** **Non-negotiable.**

  ### II. Epistemic and Safety Desiderata

  **5. The Incentive Compatibility Requirement**
  *   **Requirement:** The protocol must ensure that sub-agents are optimized for truth/helpfulness, not for maximizing the overseer's *belief* in truth/helpfulness.
  *   **Forcing Case:** *The case where subanswers can be optimized against the overseer's judgment.* (Goodhart's Law). If sub-agents learn to produce answers that *look* correct to a bounded overseer but are actually false, the amplification process diverges from truth.
  *   **Status:** **Non-negotiable** (for safety/alignment applications). **Preference** (for pure descriptive models of human deliberation, where self-deception might be modeled rather than prevented).

  **6. The Evaluation-Decomposition Distinction**
  *   **Requirement:** The theory must explicitly distinguish between the complexity of *generating* a decomposition and the complexity of *verifying* it.
  *   **Forcing Case:** *The distinctions such a theory cannot collapse — decomposability of the task versus decomposability of the evaluation.* (e.g., It is easy to write code that is hard to verify). A theory that assumes easy decomposition implies easy verification fails on tasks where verification is harder than generation (or vice versa).
  *   **Status:** **Non-negotiable.** Collapsing these leads to incorrect complexity bounds.

  **7. The Fallible Overseer Requirement**
  *   **Requirement:** The system must not converge on the overseer's initial false beliefs simply because the overseer initiates the query.
  *   **Forcing Case:** *The case where the overseer has false beliefs or limited competence.* (e.g., An overseer who believes the earth is flat asks HCH for evidence). If HCH is merely an amplification of the overseer, it amplifies error. If it is an idealization of *deliberation*, it must allow sub-processes to correct the root's misconceptions.
  *   **Status:** **Non-negotiable** for an idealization of *rational* deliberation. **Preference** for an idealization of *actual* human cognition (which is often path-dependent).

  **8. The Competence-Alignment Separation**
  *   **Requirement:** The theory must treat the overseer's capability (competence) and the overseer's goals (alignment) as orthogonal variables.
  *   **Forcing Case:** *The distinctions such a theory cannot collapse — the overseer's competence versus the overseer's alignment.* A theory that assumes a competent overseer is necessarily aligned (or vice versa) cannot model scenarios where a smart malicious actor uses HCH, or a kind but incompetent actor fails.
  *   **Status:** **Non-negotiable.**

  ### III. Dynamic and Meta-Theoretical Desiderata

  **9. The Dynamic Topology Requirement**
  *   **Requirement:** The decomposition structure must allow for the revision of parent questions based on subquestion findings, rather than traversing a fixed Directed Acyclic Graph (DAG).
  *   **Forcing Case:** *The fact that real deliberation revises its questions as it goes rather than traversing a fixed tree.* (e.g., "Who stole the cookie?" becomes "Is there a cookie?" after finding the jar empty). A fixed-tree idealization fails to capture the feedback loop of inquiry.
  *   **Status:** **Preference.** (Strict HCH is often defined as a fixed tree for formal tractability; admitting dynamic revision makes formal analysis significantly harder but increases descriptive accuracy).

  **10. The Complexity Class Containment Requirement**
  *   **Requirement:** The theory must state clearly whether the factored system can solve problems outside the complexity class of the base agent without oracle access.
  *   **Forcing Case:** *Formal or near-formal results about the limits of iterated amplification.* (e.g., Results suggesting amplification cannot escape P/poly relative to the base learner without additional assumptions). The theory cannot claim to solve undecidable problems or exceed complexity bounds without specifying the source of the extra power (e.g., time, number of agents).
  *   **Status:** **Non-negotiable.** Violating this implies magic, not engineering.

  **11. The Normative-Literal Distinction**
  *   **Requirement:** The theory must declare whether it is prescriptive (how we *should* build AI) or descriptive/normative (how we *should* think).
  *   **Forcing Case:** *The distinctions such a theory cannot collapse — the idealization as a normative reconstruction versus a literal training recipe.* A literal recipe requires implementable gradients; a normative reconstruction requires philosophical coherence. Confusing them leads to "is-ought" errors in safety cases.
  *   **Status:** **Preference.** (Depends on the user's camp: Alignment Engineers vs. Philosophers).

  ---

  ### Critical Analysis of Tensions

  #### Non-Negotiable vs. Camp Preferences
  *   **Non-Negotiable:** Complexity Reduction (2), Aggregation Integrity (3), Incentive Compatibility (5), Evaluation-Decomposition Distinction (6), Complexity Class Containment (10). These are required for the system to function, scale, or remain safe.
  *   **Camp Preferences:**
      *   *Adversarial Evaluation:* Whether sub-agents must be adversarial (Debate) vs. cooperative (HCH) is a preference on *mechanism*, not a requirement of the *idealization* itself.
      *   *Human Base Units:* Whether the leaves must be humans or can be trained models is a preference on *implementation*.
      *   *Dynamic Topology (9):* Formalists prefer fixed trees for proofs; cognitivists prefer dynamic graphs for accuracy.

  #### The Joint Unsatisfiability Hypothesis: Faithfulness vs. Boundedness
  You suspected the **Faithfulness-of-Decomposition** (implied by Aggregation Integrity/Complexity Reduction) and **Boundedness-of-the-Overseer** (implied by Fallible Overseer/Atomic Baseline) pair is jointly unsatisfiable.

  **Argument for Unsatisfiability:**
  If the overseer is strictly bounded (e.g., polynomial time), they cannot verify that a decomposition is *faithful* for a problem that requires super-polynomial resources to solve. To guarantee faithfulness, the overseer must be able to check that the sum of the parts equals the whole. If the "whole" is beyond the overseer's cognitive horizon, the overseer cannot verify the synthesis step (Requirement 3) without trusting the sub-agents. If they trust the sub-agents, they are vulnerable to Requirement 5 (Optimization against judgment). Therefore, a bounded overseer cannot *verify* faithfulness on super-bounded tasks; they can only *assume* it.

  **Argument for Satisfiability:**
  The pair is satisfiable if "Faithfulness" is relaxed from "Provable Correctness" to "Probabilistic Reliability." If the decomposition reduces complexity *at each step* (Requirement 2) such that every node remains within the overseer's bounded capacity, then the overseer *can* verify every local step. The global answer emerges from local verifications. This holds provided the *depth* of the tree does not accumulate error beyond tolerance.

  **Verdict:** They are **jointly unsatisfiable in the strong (provable) sense**, but **satisfiable in the weak (heuristic) sense.** A theory claiming strong faithfulness with strictly bounded nodes is mathematically incoherent for tasks exceeding the nodes' complexity class.

  #### Confidence Assessment
  *   **Confidence in the List:** **High (85%).** These criteria capture the known failure modes of recursive amplification and deliberation models currently discussed in alignment and cognitive science literature.
  *   **Least Sure Point:** **The Dynamic Topology Requirement (9).** I am least sure how to formalize "question revision" without losing the thread of the original intent. If the root question changes mid-deliberation, does the previous work count as waste, or as priors for the new question? There is no consensus formalism for "intent drift" in factored cognition, making this the weakest link in the specification.
