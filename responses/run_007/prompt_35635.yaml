      *   *Nuance:* Von Neumann was specifically contrasting the *precision* of digital computers (10^-9 error rate) with the *imprecision* of neurons (high error rate, statistical messaging).
      *   *Specific Reference:* In *The Computer and the Brain*, he talks about the "message" being carried by the *frequency* of pulses, not just their presence. This is the crux.

