      *   Ordered by damage? Yes.
      *   2-minute replies? Yes (word count check).
      *   Candid weakness notes? Yes.
      *   Dreaded question included? Yes.

  6.  **Final Polish:** Ensure the distinction between *telic* and *deontic* is clear where needed, and acknowledge the specific people in the room (implicitly). Make sure the "collapse" argument is nuanced. (Self-Correction: Ensure I don't sound like I'm defending egalitarianism, just critiquing prioritarianism's self-conception).

