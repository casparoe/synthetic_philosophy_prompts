answer: |-
  # Q&A Prep Sheet: Prioritarianism & The Leveling-Down Objection
  **Workshop:** Distributive Justice | **Audience:** 20 Philosophers (2 Prioritarians, 2 Telic Egalitarians, Rest Welfarist/Adjacent)

  ### 1. The "View vs. Grounds" Objection (Highest Damage)
  **Likely Asker:** The Prioritarian Book Author.
  **The Question:** "You're conflating the *structure* of prioritarianism with its *justification*. Prioritarianism is defined by the concave transformation of well-being, not by why we adopt that function. Even if the standard justifications (equality, DMU) fail, the view stands as a distinct axiology. Doesn't your argument just show that prioritarians need better foundations, not that the view collapses?"

  **The Reply (2 mins):**
  "That's a crucial distinction, and I grant that prioritarianism is often presented as a structural view. However, my claim isn't just that the *foundations* are shaky, but that the *structure* itself inherits the problems of the foundations when pressed on the Leveling-Down Objection (LDO). The LDO isn't just about prescriptions; it's about the *value* of the outcome. If the only coherent explanations for the concave function are egalitarian (inheriting LDO) or empirical/DMU (lacking normative force), then the 'priority' value is empty.
  If a prioritarian says, 'We don't level down because we care about total weighted well-being,' but cannot explain *why* the weighting exists without appealing to equality, then the view is unstable. It claims to avoid the LDO by denying equality is intrinsic, yet relies on equality to explain the weight. I'm arguing this isn't just a foundational gap; it's a structural incoherence. The view claims to be a third way between utilitarianism and egalitarianism. If it loses its distinctive justification, it loses its claim to be that third way."

  **Candid Weakness:** This relies on the controversial premise that a normative view *must* have a reductive justification to be coherent. The prioritarian can dig in and say, "It's just brute."

  ### 2. The "Brute Normativity" Objection
  **Likely Asker:** A sympathetic welfarist or the second Prioritarian.
  **The Question:** "Why can't priority be a *sui generis* moral value? Utilitarians don't need to reduce 'maximize utility' to something deeper. Why hold prioritarianism to a higher standard? If it's a fundamental moral truth that benefits to the worse off matter more, isn't that enough to escape LDO without collapsing into egalitarianism?"

  **The Reply (2 mins):**
  "It's true that utilitarianism often takes maximization as brute. But utilitarianism doesn't claim to solve a specific problem like the LDO in the way prioritarianism does. Prioritarianism was introduced specifically to capture egalitarian intuitions *without* the LDO. If the view rests on a brute fact, it loses its explanatory advantage.
  To say 'benefits matter more' is brute is to stop inquiry right where the LDO bites. The LDO asks: 'If equality isn't valuable, why does the distribution matter?' A brute priority value answers: 'It just does.' But this looks suspiciously like egalitarianism with the serial numbers filed off. If we can't say *why* the worse off matter more without implying the gap itself is bad, we haven't escaped the egalitarian commitment. I'm not asking for a reduction of all morality, but prioritarianism's *selling point* is that it avoids the specific pitfalls of egalitarianism. A brute claim doesn't avoid the pitfall; it just ignores the map."

  **Candid Weakness:** This is the hardest point to defend. Many meta-ethicists accept brute normative principles. I risk looking like I demand too much justification compared to other views.

  ### 3. The "Action-Guiding" Objection
  **Likely Asker:** A pragmatist or policy-focused philosopher.
  **The Question:** "The Leveling-Down Objection is about *prescriptions*. Egalitarianism implies we sometimes *ought* to level down (or that it's in one way good). Prioritarianism never prescribes leveling down. If the output is the same (no leveling down), why does it matter if the *reasoning* is messy? Isn't the escape from LDO a practical success regardless of theoretical grounding?"

  **The Reply (2 mins):**
  "If we only care about action-guidance, then many views collapse into each other. But in distributive justice, we care about *why* we act, because that determines how we handle hard cases. The LDO isn't just about whether we actually level down; it's about whether making everyone worse off can be *in any way good*.
  Telic egalitarians admit leveling down is in one way good. Prioritarians say it is not. If the prioritarian's reason for saying 'no' relies on an implicit commitment to equality, then they are silently accepting the egalitarian valuation while rejecting the label. This matters for trade-offs. If priority is just disguised equality, then in cases where equality conflicts with total welfare in non-standard ways, the view might yield counterintuitive results it claims to avoid. The 'clean escape' matters because it ensures the view is robust in cases where the prescription isn't obvious."

  **Candid Weakness:** This concedes that in standard cases, the practical difference is nil. It relies on the idea that "one-way goodness" has practical implications, which some deny.

  ### 4. The "DMU & Currency" Objection
  **Likely Asker:** A welfarist sympathetic to economics.
  **The Question:** "You dismiss Diminishing Marginal Utility (DMU) as merely empirical. But if we specify the currency of justice correctly—say, 'opportunity for welfare' or 'capabilities'—doesn't DMU do the normative work? A dollar (or unit of capability) *is* objectively more valuable to the worse off. Why isn't that enough?"

  **The Reply (2 mins):**
  "DMU explains why we transfer resources to maximize total welfare, but it doesn't explain why we prioritize the worse off *at the cost* of total welfare. Prioritarianism sometimes supports transfers that reduce the sum total of well-being because the gain to the poor outweighs the loss to the rich *morally*, not just aggregatively.
  If we rely on DMU, we are essentially utilitarians with a specific currency. But prioritarianism claims to be distinct from utilitarianism. If the weight given to the worse off is just about efficiency (maximizing total output via DMU), then when efficiency conflicts with priority, the view collapses into utilitarianism. To maintain the distinctively prioritarian claim—that we prioritize the worse off even when it's 'inefficient'—we need a normative weight that DMU cannot provide. DMU is about production; priority is about distribution."

  **Candid Weakness:** This requires a sharp distinction between "efficiency" and "distribution" that some welfarists reject. If they argue DMU *is* the normative weight, I have to argue that's a category error.

  ### 5. The Egalitarian "So What?" Objection
  **Likely Asker:** One of the Telic Egalitarians.
  **The Question:** "Okay, let's say you're right. Prioritarianism collapses into egalitarianism. Why is this a problem for *justice*? You seem to treat 'collapsing into egalitarianism' as a *reductio*. But if egalitarianism is true, isn't this a victory for your conclusion, even if it undermines the prioritarian label?"

  **The Reply (2 mins):**
  "My goal isn't to defend utilitarianism or attack egalitarianism per se, but to assess prioritarianism's claim to be a superior alternative. The literature presents prioritarianism as the 'best of both worlds': capturing egalitarian intuitions without the LDO cost.
  If my argument holds, that sales pitch fails. It forces a choice: either accept the LDO (as telic egalitarians do) or abandon the priority weighting. For the field, this matters because much recent work assumes prioritarianism is the default stable position. If it's unstable, we need to revisit the core debate between utilitarianism and egalitarianism rather than hiding in the middle. I'm not saying egalitarianism is false; I'm saying prioritarianism doesn't get a free pass on the objections that plague egalitarianism."

  **Candid Weakness:** This alienates the egalitarians in the room by framing their view as having a "cost" they deny is a cost. It risks making me look like I'm arguing for a conclusion I don't actually hold.

  ### 6. The "Slippery Slope to Sufficientarianism" Objection
  **Likely Asker:** Someone working on adjacent topics.
  **The Question:** "If the priority weight gets very heavy at the bottom, aren't you just describing a sufficientarian threshold? If the worse off matter *much* more, doesn't the view become lexically prioritarian, which looks like sufficientarianism? Does your objection apply there too?"

  **The Reply (2 mins):**
  "It does apply, and it highlights the instability of the view. Sufficientarianism tries to avoid the LDO by saying we only care about getting people 'above enough.' But justifying that threshold often appeals to equality (everyone deserves enough) or DMU (utility spikes at the threshold).
  The broader point is that any view trying to capture 'special concern for the worse off' without appealing to equality faces this justificatory gap. Whether it's smooth prioritarianism or threshold sufficientarianism, if the reason for the special concern isn't utility maximization, it tends to drift back toward a concern for the relative gap. So yes, the objection generalizes. It suggests that 'non-egalitarian concern for the worse off' is a much smaller category than we think."

  **Candid Weakness:** This expands the scope of the paper too much. I need to keep the focus on prioritarianism to avoid getting bogged down in sufficientarian thresholds.

  ### 7. The "Measurement Problem" Objection
  **Likely Asker:** A technical/metaphysical philosopher.
  **The Question:** "To apply priority weighting, we need interpersonally comparable well-being. If we can measure well-being well enough to apply weights, can't we just measure equality directly? If the measurement is possible for priority, isn't the distinction between priority and equality merely formal?"

  **The Reply (2 mins):**
  "Measurement feasibility doesn't erase normative distinction. We can measure height without committing to egalitarianism about height. The issue is normative, not metric. However, your point hints at the deeper problem: if the metric we use to measure well-being already embeds normative assumptions about what matters, those assumptions might smuggle in equality.
  But even granting perfect measurement, the *value function* differs. Egalitarianism values the pattern; prioritarianism values the weighted sum. My argument is that the *reason* for the weights tends to invoke the pattern. The measurement issue is secondary, but it does reinforce the idea that separating 'well-being' from 'distribution' is harder than prioritarians assume."

  **Candid Weakness:** This is a bit of a dodge. It admits the distinction is formal but insists it matters. It's the weakest theoretical ground.

  ***

  ### The Dreaded Question (Hope Nobody Asks)
  **The Question:** "You argue that prioritarianism fails because it can't justify the weighting without collapsing into egalitarianism or utilitarianism. But if *all* distributive views (including utilitarianism and egalitarianism) rely on brute intuitions at the bottom, aren't you just arguing that prioritarianism is *honest* about its brute intuitions? If utilitarianism can be brute, why is it a fatal flaw for prioritarianism to be brute? Are you holding them to an unfair standard?"

  **Why this hurts:** It forces me to admit that my entire argument rests on the meta-ethical claim that Prioritarianism *needs* a reductive justification more than Utilitarianism does. If I can't defend that asymmetry, my paper just proves that "Prioritarianism is distinct," which is what they claim anyway. It exposes that I might be attacking the *marketing* of the view rather than the *substance*.

  **Emergency Exit:** "Utilitarianism doesn't claim to solve the LDO. Prioritarianism's *identity* is tied to solving it. If it solves it only by brute stipulation, it hasn't solved the theoretical problem, it has just refused to answer it. That distinguishes it from utilitarianism, which never promised to solve it." (Risky, but the only out).
