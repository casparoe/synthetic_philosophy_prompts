      *   Best (for this specific argument): "If the only reason to prioritize the worse off is either equality or DMU, and both fail, what is your positive account? Are you arguing for nihilism about distribution, or are you secretly a telic egalitarian?" -> *Actually, the most damaging question is one that forces me to admit my argument relies on a contested meta-ethical claim about justification.*
