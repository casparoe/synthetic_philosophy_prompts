answer: |-
  This is an impressive summary. You have independently reconstructed the central tensions in modern Bayesian epistemology and philosophy of science. Specifically, you have stumbled directly onto the two most famous problems in the field: **The Problem of Old Evidence** and **The Problem of Accommodation vs. Prediction.**

  Your list hangs together logically *as a set of intuitions*, but mathematically and formally, several of these propositions cannot all be true simultaneously within standard Bayesian framework.

  Here is the breakdown of the conflicts, ranked by severity.

  ---

  ### Conflict 1: The "Old Evidence" Problem (Severity: Fatal)
  **The Clash:** Propositions (3), (4), and (5).
  *   **(3)** says known facts have probability 1.
  *   **(4)** says conditioning on probability 1 changes nothing ($P(H|E) = P(H)$ if $P(E)=1$).
  *   **(5)** says explaining a known fact (Mercury) *did* increase our belief in the theory (GR).

  **Why it's a real conflict:**
  This is a mathematical contradiction. If Mercury's orbit ($E$) was already known, then by (3), $P(E) = 1$. By the rule of conditionalization (4), learning $E$ cannot change the probability of $H$. Therefore, $E$ cannot confirm $H$. But (5) asserts that it *did* confirm $H$.
  Standard Bayesianism implies that once you know the evidence, it is "used up" and can never support a new theory. This contradicts the historical reality of science (and your intuition in proposition 2).

  **What has to give:**
  You cannot keep standard conditionalization (4) and the rigidity of known facts (3) if you want to explain how Einstein got credit for Mercury (5).

  **The Cheapest Fix:**
  **The Counterfactual Move.**
  Most Bayesians keep (3) and (4) but reinterpret (5). They argue that Mercury supports GR not because we conditioned on the *actual* known fact, but because we compare the likelihoods in a **counterfactual state of ignorance**.
  *   *Fix:* We ask: "If we *didn't* know about Mercury, how likely would it be under GR vs. Newton?"
  *   *Cost:* It makes confirmation subjective to what we imagine we don't know, rather than objective about what we do know.
  *   *Alternative Fix:* **Ur-Priors.** You assign probabilities based on what your beliefs *would have been* before you learned any empirical evidence. This preserves the math but is psychologically impossible to calculate.

  ---

  ### Conflict 2: Accommodation vs. Prediction (Severity: High)
  **The Clash:** Propositions (1) and (6).
  *   **(1)** says support depends only on the likelihood ratio $P(E|H) / P(E|\neg H)$.
  *   **(6)** says a theory gets no credit if it was *fit* to the data (accommodation) compared to if it *predicted* the data.

  **Why it's a real conflict:**
  In standard Bayesian math, the likelihood $P(E|H)$ is usually determined by the logical relationship between theory and evidence. If Theory A predicts $E$, and Theory B is *constructed* to fit $E$, the logical relationship is often identical ($P(E|A) = 1$ and $P(E|B) = 1$).
  If the likelihoods are the same, (1) says the support is the same. But (6) says the support should be different (prediction is better than accommodation). Standard Bayesianism is often accused of being "ahistorical"—it looks at the theory and evidence now, ignoring *how* the theory was generated.

  **What has to give:**
  You have to admit that (1) is incomplete. The likelihood ratio alone does not capture the "credit" a theory deserves.

  **The Cheapest Fix:**
  **Bayesian Occam's Razor (Priors).**
  You keep (1) but you adjust the **Priors** ($P(H)$), not the Likelihoods.
  *   *Fix:* A theory that is "fit" to data usually requires more parameters or ad-hoc adjustments than a theory that predicts data simply. We assign complex/fitted theories a lower *Prior Probability*.
  *   *Result:* Even if the likelihoods are the same, the posterior $P(H|E)$ is lower for the fitted theory because its starting $P(H)$ was lower.
  *   *Cost:* You have to agree on a formal way to measure "complexity" to set the priors (e.g., Solomonoff Induction or Minimum Description Length), which is technically difficult.

  ---

  ### Conflict 3: Temporal Neutrality vs. Use-Novelty (Severity: Medium)
  **The Clash:** Propositions (2) and (6).
  *   **(2)** says timing doesn't matter (Old evidence counts).
  *   **(6)** says construction order matters (Fitted data doesn't count).

  **Why it's only an *apparent* conflict (mostly):**
  This looks like a contradiction, but it can be resolved if you solve Conflict 1 and 2.
  *   If you solve **Old Evidence** (via Counterfactuals), you can maintain (2) in a specific sense: The *time* the evidence was discovered doesn't matter, only whether the theory *entails* it.
  *   If you solve **Accommodation** (via Priors), you can maintain (6) without violating (2). You can say: "Old evidence counts (2), *unless* the theory was specifically designed to match that old evidence (6), in which case the Prior is penalized."

  **What has to give:**
  You must refine (2). It is not strictly true that timing *never* matters. Timing matters insofar as it reveals whether the theory was "tuned" to the evidence.

  **The Cheapest Fix:**
  **Distinguish "Discovery Context" from "Justification Context."**
  Adopt the view that (2) applies to the *logic* of confirmation, but (6) applies to the *heuristic* of theory selection.
  *   *Fix:* Bayesianism calculates support (2), but we use methodological rules (6) to prevent cheating with Priors.

  ---

  ### Summary of Recommendations

  If you want your system to hang together, here is the hierarchy of what needs to change:

  1.  **Modify (3) or (4) conceptually:** You must accept that for the purposes of confirmation, we treat known evidence *as if* it were uncertain (The Counterfactual Fix). This resolves the Mercury/GR paradox.
  2.  **Expand (1):** Acknowledge that the Likelihood Ratio isn't the whole story. You need to incorporate **Model Complexity** into your Priors to satisfy intuition (6). This resolves the "fitting" paradox.
  3.  **Refine (2):** Change "timing shouldn't matter" to "timing shouldn't matter *except* insofar as it indicates overfitting."

  ### Verdict
  You have correctly identified that **Standard Subjective Bayesianism** (which holds 1, 3, and 4 strictly) is incompatible with **Scientific Realism** (which holds 2, 5, and 6).

  To fix this, you don't need to throw out Bayesianism. You just need to move from **Naive Bayesianism** to **Sophisticated Bayesianism** (incorporating Ur-priors, counterfactual likelihoods, and complexity penalties).

  If you search for these terms, you will find the literature matches your notes almost exactly:
  *   Conflict 1 is **Glymour's Problem of Old Evidence**.
  *   Conflict 2 is **The Use-Novelty Debate** (or Prediction vs. Accommodation).
  *   The fix for Conflict 2 is often called **The Bayesian Occam's Razor**.

  You are ready to read the advanced material.
