          *   *Result:* Standard Bayesianism (1) is often accused of being unable to distinguish between prediction and accommodation. If $H$ entails $E$, $P(E|H)=1$. If $\neg H$ makes $E$ unlikely, support is high. This holds whether $H$ was made before or after $E$. But (6) claims the *process* of fitting matters.
          *   *Severity:* Medium/High. This is the "Use-Novelty" debate.

      *   **Conflict C: Logical Omniscience vs. Learning.**
          *   (3) implies that once you know $E$, $P(E)=1$ forever.
