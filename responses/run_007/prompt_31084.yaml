      *   *Ranking:* The Old Evidence Problem is generally considered the more fundamental technical crisis for standard Bayesianism. The Accommodation issue is often seen as a subset or a related intuition pump.
      *   *Fixes:*
          *   For Old Evidence: Counterfactuals (How likely would E be if we didn't know it?), Ur-Priors (Priors before learning E), or Jeffrey Conditionalization (allowing $P(E) < 1$ for known facts).
