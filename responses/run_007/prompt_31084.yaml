  4.  **Evaluate "Apparent" vs. "Real" Conflicts:**

      *   *(2) vs (6):* (2) says timing doesn't matter. (6) says fitting (which implies timing/order) matters. This looks like a conflict. Is it real? Yes, because (6) implies a constraint on confirmation that isn't captured by the static likelihood ratio in (1).
      *   *(3)+(4) vs (5):* This is the core of the Old Evidence Problem. It is a *real* mathematical conflict within standard Bayesian conditionalization.
      *   *(1) vs (6):* (1) is a static criterion. (6) is a procedural constraint. They conflict if you think (1) is the *whole* story.

