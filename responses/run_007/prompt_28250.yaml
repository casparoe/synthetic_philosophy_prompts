      *   *Self-Correction on Case 2:* I need to be careful not to endorse pre-delegation as *good policy*, but rather acknowledge its *logical function* in game theory. The procedure should flag the extreme risk. The "unwelcome truth" is that to make a threat credible, you often have to surrender control.

