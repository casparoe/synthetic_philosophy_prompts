answer: |-
  This is a classic problem in decision theory, most famously articulated recently by L.A. Paul in *Transformative Experience*, though it has roots in existentialism and personal identity. Your friend's slogan is indeed compressing multiple layers of argument. To evaluate whether expected-value calculation is the *wrong tool* (as opposed to merely a blunt one), we must separate the epistemic limitations (what you can grasp) from the normative limitations (what authority you have).

  Here are four distinct readings of the claim "You can't know what it's like until you've been through it," ordered from trivial to radical. I have adhered to your constraint to taboo the words "know" and "rational."

  ### 1. The Imperfect Prediction Reading
  **Restatement:** Before the event, your mental model of the outcome will contain errors compared to the actual outcome.
  *   **Truth Value:** **Obviously True.** No mental simulation matches reality perfectly. Weather forecasts, travel plans, and career moves all suffer from this.
  *   **Support for Conclusion:** **None.** This reading supports only the conclusion that the decision must be made under uncertainty. Expected-value calculation is designed specifically to handle imperfect information by weighting probabilities. If this is all your friend means, he is arguing that parenting is *risky*, not that it is *indecidable*.

  ### 2. The Phenomenal Opacity Reading
  **Restatement:** The subjective character (the "what-it-is-like-ness") of the experience is inaccessible to the pre-event agent.
  *   **Truth Value:** **Plausibly True.** This draws on the "knowledge argument" (Frank Jackson's Mary). You can have all the physical facts about sleep deprivation or parental love, but lack the qualitative feel until you experience it.
  *   **Support for Conclusion:** **Weak.** While this makes assigning a specific utility value difficult, humans routinely make choices involving phenomenal opacity (e.g., trying a new cuisine, visiting a new country, taking a new medication). We assign *estimated* values based on testimony and analogy. This reading suggests the calculation will be imprecise, not that the method itself is invalid.

  ### 3. The Preference Revision Reading
  **Restatement:** The event alters the agent's hierarchy of values such that the post-event agent ranks outcomes differently than the pre-event agent.
  *   **Truth Value:** **Plausibly True.** Becoming a parent often shifts what a person cares about (e.g., safety vs. adventure, leisure vs. nurturing). The "after" self may value things the "before" self found trivial, and vice versa.
  *   **Support for Conclusion:** **Moderate but Insufficient.** This creates a conflict of interest between temporal selves. However, standard decision theory usually dictates that you decide based on your *current* values. If your current self values the *possibility* of this transformation, the calculation holds. This reading supports the idea that you might *regret* the decision later, not that you were unjustified in making it earlier. It implies the tool yields a result that might later be unwanted, not that the tool is broken.

  ### 4. The Agent Discontinuity Reading
  **Restatement:** The change in values is so profound that the pre-event agent and post-event agent effectively count as different persons for the purpose of authorization; the pre-event agent lacks the standing to bind the post-event agent.
  *   **Truth Value:** **Probably False.** This requires a metaphysical claim that you literally become someone else. While values change, there is usually sufficient psychological continuity (memory, character traits, bodily identity) to maintain agency.
  *   **Support for Conclusion:** **Strong.** This is the only reading that actually supports the conclusion that expected-value calculation is the *wrong tool*. If the "you" making the decision is not the same "you" who bears the consequence, then maximizing utility for the current self is irrelevant, and maximizing utility for the future self is impossible (because you cannot access their values). This renders the decision framework incoherent.

  ***

  ### Diagnostic Analysis

  **Which reading does your friend's conclusion actually *need*?**
  He needs **Reading 4 (Agent Discontinuity)**.
  To claim that expected-value reasoning is the *wrong tool* (rather than just a tool with high margin of error), he must argue that the inputs required for the calculation (the values of the future self) are not just hidden, but *non-existent* from the perspective of the current self. If the current self has any authority to act on behalf of the future self, the calculation remains valid, even if difficult. Only if the current self lacks the *authority* to decide for the future self does the tool break.

  **Which reading is he most likely *asserting*?**
  He is most likely asserting **Reading 2 (Phenomenal Opacity)** or **Reading 3 (Preference Revision)**.
  Most people, when they say "you can't know," are expressing the frustration of imagination (Reading 2) or observing that parents seem different from non-parents (Reading 3). They rarely intend to make the metaphysical claim that the parent is a different person (Reading 4). He is likely conflating the *difficulty* of the calculation (due to opacity and change) with the *impossibility* of the calculation.

  **What argument or piece of evidence would most cleanly distinguish the two?**
  You should ask him to apply his logic to a **non-parental transformative choice**.

  Ask him: *"If a person decides to join the Foreign Legion, or convert to a strict religion, or move to a country where they speak no language, they also cannot access the subjective experience beforehand, and their values will likely change. Is expected-value reasoning also the wrong tool for those decisions?"*

  *   **If he says "Yes":** He is committed to **Reading 4**. He believes transformative experiences generally forbid reasoned choice. You can then challenge the metaphysical plausibility of Agent Discontinuity (i.e., "If I can't decide for my future self there, can I sign a contract? Can I make a will?").
  *   **If he says "No":** He is holding **Reading 2 or 3**. He admits the tool works generally but claims parenting is special. You can then ask him to identify the *relevant difference* that breaks the tool for parenting but not for the Foreign Legion. If he cannot name a difference other than "it's bigger," you have shown he is mistaking degree (harder to calculate) for kind (calculation impossible).

  This forces him to either defend the radical metaphysical claim (that we are different people after having kids) or concede that the decision is merely hard, not forbidden.
