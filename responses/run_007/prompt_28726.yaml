          *   Constraint: Taboo the words "know" and "rational" (restate without them).
          *   Final Analysis: Identify which reading the friend *needs*, which he is *likely asserting*, and how to distinguish them.

  2.  **Deconstruct the Friend's Slogan:**
      *   "You can't know what it's like until you've been through it."
      *   This echoes L.A. Paul's *Transformative Experience*.
      *   Key concepts: Epistemic limitation (cannot imagine the phenomenology), Preference transformation (values change), Decision theory applicability (expected utility).

  3.  **Drafting the Distinct Claims (Iterative Process):**

      *   *Attempt 1 (Mental Draft):*
          1.  You don't know exactly how it feels. (Trivial)
          2.  You don't know if you'll like it. (Plausible)
          3.  You become a different person. (Radical)
          4.  You can't use math to decide. (Conclusion)

      *   *Refining for Precision and Taboo Constraints:*
          *   Need to avoid "know" and "rational".
          *   Need to link to the conclusion (Expected Value reasoning is wrong).

      *   *Claim 1 (Epistemic Imperfection):* Before the event, your mental simulation of the experience will differ from the actual experience.
          *   Truth: Obviously true.
          *   Support for conclusion: No. Just means uncertainty.

      *   *Claim 2 (Phenomenal Ignorance):* Before the event, you cannot access the subjective quality (qualia) of the experience.
          *   Truth: Plausibly true (Frank Jackson's Mary argument).
          *   Support for conclusion: Weak. You can still value things you haven't felt (e.g., eating a new fruit).

      *   *Claim 3 (Preference Transformation):* The event changes the criteria by which you evaluate outcomes. The "after" self values things differently than the "before" self.
          *   Truth: Plausibly true (especially for parenthood).
          *   Support for conclusion: Stronger. If values change, whose values count?

      *   *Claim 4 (Incommensurability/Authority):* The "before" self lacks the standing to authorize the choice for the "after" self because the values are fundamentally alien.
          *   Truth: Probably false/Controversial.
          *   Support for conclusion: This is the one needed to kill decision theory.

  4.  **Developing the Analysis for Each Claim:**

      *   *Reading 1: Imperfect Prediction.* (Trivial)
          *   Restatement: Your pre-event model of the outcome will contain errors compared to the actual outcome.
          *   Truth: Obviously true.
          *   Implication: Decision-making requires estimation, not perfection. Doesn't kill expected value.

      *   *Reading 2: Phenomenal Opacity.* (Moderate)
          *   Restatement: The subjective character of the experience is inaccessible to the pre-event agent.
          *   Truth: Plausibly true.
          *   Implication: Makes assigning utility hard, but not impossible (we do this with travel, food, etc.).

      *   *Reading 3: Preference Revision.* (Strong)
          *   Restatement: The event alters the agent's hierarchy of values such that the post-event agent ranks outcomes differently than the pre-event agent.
          *   Truth: Plausibly true.
          *   Implication: Creates a conflict of interest between temporal selves. Expected value can still be calculated based on *current* values, but might be regretted later. Doesn't strictly forbid the decision, just complicates it.

      *   *Reading 4: Agent Discontinuity.* (Radical)
          *   Restatement: The change in values is so profound that the pre-event agent and post-event agent effectively count as different persons for the purpose of authorization; the pre-event agent lacks the authority to bind the post-event agent.
          *   Truth: Probably false (too strong).
          *   Implication: This kills decision theory. If you aren't the same agent, you can't decide for your future self.

  5.  **Addressing the Final Questions:**
      *   *Which reading does the friend NEED?* Reading 4 (Agent Discontinuity). If it's just uncertainty or value change, expected value still works (you just plug in probabilities and current utilities). To say EV is the *wrong tool*, you need to say the calculator itself is broken (i.e., the 'you' operating it won't exist).
      *   *Which reading is he LIKELY asserting?* Reading 2 or 3. Most people intuitively feel the "you can't imagine it" aspect (Phenomenal Opacity) or the "you'll change" aspect (Preference Revision). They rarely mean full Agent Discontinuity.
      *   *How to distinguish?* Ask about *other* transformative choices. If he thinks joining the army or moving to a new country is also irrational, he leans toward 4. If he admits those are rational despite uncertainty/change, he's holding 2 or 3 but overgeneralizing to parenthood. Or, ask if he thinks the *current* self's desires matter at all.

