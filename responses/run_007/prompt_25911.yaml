      *   **User's Hypothesis:** The impasse isn't about linguistics but about methodological goals (systematicity vs. fitting probability judgments).
      *   **Task:** Diagnose the kind of disagreement this is and suggest what could break the stalemate.
      *   **Constraint:** Maximum 800 words.

  2.  **Deconstruct the Debate:**
      *   **Unified Theory (Unificationists):** Often possible worlds semantics (Stalnaker, Lewis initially aimed for unity though Lewis split them later). Want elegance, logical parallels, single operator analysis.
      *   **Split Theory (Dualists):** Often emphasize truth-conditional differences, probabilistic constraints (Adams' thesis), indicative specificities (e.g., material conditional hints vs. counterfactual remoteness).
      *   **Key Arguments:** Or-to-if, Gibbard's proof (shows indicative can't have truth conditions if certain plausible principles hold), triviality results.
      *   **User's Insight:** Methodological divergence (formal systematicity vs. empirical/probabilistic fit).

  3.  **Diagnose the Disagreement:**
      *   Is it merely verbal? No, there are substantive commitments.
      *   Is it empirical? Partly (psychology of reasoning), but mostly theoretical.
      *   Is it methodological? Yes. This aligns with the user's hunch. It's about the *purpose* of semantics.
      *   *Refinement:* It's also about the role of truth conditions. Gibbard's result suggests indicatives might not have truth conditions at all (expressivism/probabilism), while counterfactuals clearly seem to. So the split is often between truth-conditional semantics vs. non-truth-conditional (probabilistic) semantics for indicatives.
      *   *Core Tension:* The tension between preserving classical logic/truth-conditions and accommodating intuitive probabilistic reasoning (Adams' Thesis).

  4.  **Evaluate the "Stalemate":**
      *   Why hasn't it moved? Because both sides sacrifice something. Unificationists sacrifice intuitive probability judgments (or have to complicate the logic). Dualists sacrifice theoretical elegance and the hope for a single logical operator.
      *   Is it a "verbal dispute"? Not really. It's a substantive clash over the nature of meaning (truth-conditions vs. use-conditions).

  5.  **Identify Potential Breakthroughs:**
