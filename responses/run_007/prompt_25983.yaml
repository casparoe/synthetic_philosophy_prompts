answer: |-
  ### Exam Question

  **Critically evaluate the claim that finks and masks pose structurally distinct challenges to the Simple Conditional Analysis (SCA) of dispositions. Does a solution to the problem of finks automatically resolve the problem of masks, or do they require independent theoretical repairs? In your answer, explain what the persistence of these counterexamples suggests about the ontological status of dispositional properties.**

  ***

  ### Model Answer

  The Simple Conditional Analysis (SCA) posits that an object $x$ has a disposition to manifest $M$ in response to stimulus $S$ if and only if, were $x$ to undergo $S$, $x$ would manifest $M$. Finks and masks demonstrate that this biconditional fails, but they do so by attacking different links in the chain between property, stimulus, and manifestation. While both show that the conditional truth does not guarantee the disposition's presence (or absence), they represent distinct structural problems requiring different theoretical repairs, ultimately suggesting that dispositions are grounded in real categorical bases rather than mere conditionals.

  A finkish disposition, exemplified by C.B. Martin's electro-fink, involves a disposition that is lost *during* the stimulus. Consider a live wire connected to a device that detects contact with a conductor and instantly renders the wire dead before a spark can occur. The wire is disposed to conduct (it is live), but the conditional "if touched, it would spark" is false. The SCA falsely denies the disposition. Structurally, the fink removes the *causal basis* of the disposition at the critical moment. The problem is one of temporal persistence: the intrinsic property grounding the disposition vanishes precisely when tested.

  Masks, discussed by Mark Johnston, operate differently. A masked disposition remains intact during the stimulus, but an external interferer prevents the manifestation. A fragile glass packed in Styrofoam is still fragile, but if struck, it will not break. Here, the conditional "if struck, it would break" is false, yet the disposition exists. Unlike finks, the causal basis (the molecular structure making it fragile) remains present. The problem is not the loss of the property, but the blockage of the causal pathway from stimulus to manifestation by an extrinsic factor.

  Because the structural failures differ, a solution for finks does not automatically solve masks. David Lewis proposed repairing the SCA by appealing to an intrinsic causal basis $B$. $x$ is disposed to $M$ if $x$ has $B$, and if $x$ retains $B$ while undergoing $S$, $M$ occurs. This handles finks effectively: the wire has the basis of conductivity, but the fink ensures the basis is not retained during the stimulus. However, this repair struggles with masks. The fragile glass retains its basis $B$ while struck, yet $M$ does not occur because of the packing. To handle masks, one must add a *ceteris paribus* clause (no interferers) to the conditional. Thus, fixing finks requires securing the persistence of the basis, while fixing masks requires isolating the system from extrinsic blockers. These are independent repairs; securing the basis does not guarantee the absence of interferers.

  The necessity of these repairs reveals significant ontological implications. The SCA attempts to reduce dispositional properties to counterfactual conditionals. The failure of the SCA, even after repair, suggests that the conditional is not identical to the disposition but is rather evidence of it. The reliance on a "causal basis" in Lewis's repair implies that dispositions depend on underlying categorical properties (e.g., molecular structure). Furthermore, the need to specify "normal conditions" to avoid masks suggests that dispositions are real powers that require specific contexts to manifest, rather than logical constructs defined solely by stimulus-response pairs.

  In conclusion, finks and masks are distinct challenges. Finks target the stability of the dispositional basis, while masks target the efficacy of the manifestation. Consequently, they require distinct repairs: one time-indexed to the basis, the other conditional on the absence of interferers. Together, they undermine the reductive ambition of the SCA, supporting a realist ontology where dispositions are grounded in intrinsic properties that exist independently of their manifestations.

  ***

  ### Marking Scheme (20 Marks Total)

  **1. Accurate Formulation of SCA and Counterexample Function (4 Marks)**
  *   **Criteria:** Correctly states the SCA biconditional and identifies that finks/masks show the conditional can be false while the disposition is true (false negative).
  *   **Common Mistake:** Defining SCA merely as "if stimulated then manifests" without noting the *biconditional* claim, or claiming the counterexamples show the disposition is absent when the conditional is true (confusing them with mimics).

  **2. Structural Distinction: Persistence vs. Interference (4 Marks)**
  *   **Criteria:** Clearly distinguishes that finks involve the *loss* of the causal basis during stimulus, whereas masks involve the *retention* of the basis but blockage of the outcome.
  *   **Common Mistake:** Treating both as merely "external interferers" or failing to note that the disposition vanishes in the fink case but remains in the mask case.

  **3. Evaluation of Solution Compatibility (4 Marks)**
  *   **Criteria:** Argues whether one fix solves both. (High marks for noting Lewis's Causal Basis fix solves finks but requires additional *ceteris paribus* clauses for masks).
  *   **Common Mistake:** Asserting that Lewis's "Retained Basis" analysis automatically solves masks without noting the need for an explicit "no interferers" clause.

  **4. Argument on Distinctness of Challenges (4 Marks)**
  *   **Criteria:** Takes a clear stance on whether the challenges are fundamentally the same or distinct, supported by the analysis of solutions above.
  *   **Common Mistake:** Sitting on the fence without justification, or claiming they are identical because both make the conditional false, ignoring the metaphysical mechanism.

  **5. Ontological Implications (4 Marks)**
  *   **Criteria:** Connects the failure of SCA to the nature of dispositions (e.g., Anti-reductionism, Realism about powers, or reliance on categorical bases).
  *   **Common Mistake:** Treating the counterexamples as mere linguistic puzzles without discussing what they imply about the *existence* or *nature* of the property itself (e.g., failing to mention realism vs. reductionism).
