  **To:** Conduct Board Members
  **From:** Student Representative
  **Date:** Tuesday
  **Re:** Disciplinary Recommendation for Case #24-10 (Dan & Chris)

  **Recommendation:**
  I recommend the board issue the **same punishment** for both students: a ten-day suspension for each.

  **Reasoning:**
  We are facing a classic case of "moral luck." Dan and Chris made the identical choice to skip class and endanger public safety. They threw the same rocks, from the same height, with the same intent. The only variable was the wind and the trajectory—factors entirely outside their control. If we expel Dan and give Chris detention, we are not punishing their choices; we are punishing the outcome of a coin flip.

  As a conduct board, our primary function is to judge student *conduct*, not to adjudicate tort liability. Both students demonstrated a reckless disregard for safety that warrants serious consequences. A ten-day suspension signals that endangering the community is unacceptable, regardless of whether someone happened to get hurt. This maintains the integrity of our justice system: students should be able to look at the rules and know exactly what the consequence of a specific *action* will be, without fearing that a random accident could ruin their academic future.

  **Addressing the Strongest Counter-Argument:**
  The strongest argument for imposing different punishments is the reality of the injured driver. A woman is in the hospital with a broken arm because of Dan's rock, and the school has a moral and legal obligation to acknowledge that harm. The handbook states discipline should be "proportionate to the harm caused," and ignoring the physical injury feels like dismissing the victim's suffering.

  However, we must distinguish between *school discipline* and *civil liability*. The driver's medical costs and pain are real, but those are matters for insurance and civil law, not school expulsion. If we expel Dan, we are effectively making him a scapegoat for the school's liability rather than judging his behavior. We can express profound regret for the driver and cooperate fully with her family without violating the principle that two students who committed the same act should receive the same sanction.

  **Conclusion:**
  Fairness requires that we judge students on what they control. Dan and Chris controlled the throw; they did not control the landing. I urge the board to suspend both for ten days. This punishes the recklessness severely without sacrificing the principle that justice should not be a lottery.
