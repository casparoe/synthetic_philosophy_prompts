answer: |-
  **DRAFT FOR INTERNAL REVIEW: ADVERSARIAL COLLABORATION FRAMEWORK**
  **Subject:** Causation (Counterfactual vs. Interventionist)
  **Date:** October 26, 2023
  **Status:** Proposed Basis for Collaboration

  ### Preamble
  This document is intended to structure the ongoing debate between the Counterfactual (Lewisian) and Interventionist (Woodwardian/Structural) camps within the department. The goal is not immediate synthesis, but precise localization of agreement and disagreement to prevent dialectical stagnation. We acknowledge that while the formalisms often converge, the metaphysical commitments and criteria for success diverge.

  ---

  ### Part I: Common Ground (Agreed Claims)
  *Both camps affirm the following claims. Disagreement on these items indicates a misunderstanding of the opposing position.*

  1.  **Distinctness from Correlation:** Causation is distinct from mere probabilistic correlation or regularity. Spurious correlations (e.g., barometer and storm) are not causal.
  2.  **Centrality of Counterfactuals:** Counterfactual conditionals are indispensable for analyzing causal claims. Even Interventionists rely on structural counterfactuals (e.g., "If $X$ had been $x$, $Y$ would have been $y$").
  3.  **Asymmetry:** Causal relations are fundamentally asymmetric. If $C$ causes $E$, $E$ does not cause $C$ (barring specific feedback loop formalizations which both sides treat as distinct from simple bidirectional causation).
  4.  **Agreement on "Easy" Cases:** In simple, non-preemptive, non-overdetermined cases (e.g., a single rock thrown at a window shattering it), both frameworks yield the same verdict: the throw is a cause of the shatter.
  5.  **Formal Compatibility:** The Lewisian possible-worlds semantics and the Interventionist Structural Equation Model (SEM) formalism can be mapped onto one another for standard cases. A Lewisian counterfactual can often be represented as a structural equation, and vice versa.
  6.  **Rejection of Transitivity (Unrestricted):** Both sides agree that causation is not transitive in all cases. (Lewis modified his 1973 view to handle this; Interventionists restrict transitivity to specific path conditions).
  7.  **Token and Type:** Both frameworks acknowledge a distinction between token causation (actual events) and type causation (general variables), though they prioritize them differently.

  ---

  ### Part II: Table of Disagreements
  *Each row isolates a specific proposition. The "Lewisian" column indicates the Counterfactual stance; the "Interventionist" column indicates the Woodward/Structural stance. Wording is chosen to ensure charitable interpretation by both sides.*

  | # | Proposition | Lewisian (Counterfactual) Stance | Interventionist (Woodward/Structural) Stance |
  | :--- | :--- | :--- | :--- |
  | **1** | **Necessity of Dependence:** Is counterfactual dependence necessary for causation? | **Deny.** In preemption cases, $E$ does not depend on $C$ (because $D$ would have caused $E$ anyway), yet $C$ is still a cause. Causation is preserved via *chains* of dependence. | **Affirm.** If $C$ causes $E$, there must be some invariant counterfactual dependence between $C$ and $E$ relative to the correct variable set (holding the preempted backup fixed). |
  | **2** | **Relativity:** Is causation a relation between events in the world, or variables in a model? | **World-Level.** Causation is an objective relation between concrete events. Models describe causation, but causation exists independently of our variable choices. | **Variable-Relative.** Causal claims are only true relative to a specific set of variables and a model. There is no "causation simpliciter" outside a representation. |
  | **3** | **Metaphysical Goal:** Is the theory attempting to provide truth-conditions for causal facts or criteria for causal explanation? | **Metaphysics.** The goal is to analyze what *makes it true* that one event causes another (reductive or quasi-reductive analysis). | **Functional/Epistemic.** The goal is to characterize what allows for manipulation, control, and explanation. Metaphysical "truth-makers" are secondary or unnecessary. |
  | **4** | **The "Intervention":** How is the counterfactual antecedent secured? | **Miracles/Similarity.** We evaluate worlds where a "small miracle" occurs to break the causal chain, prioritizing similarity to the actual world. | **Graph Surgery.** We evaluate the model where the structural equation for $X$ is replaced by $X=x$, severing incoming arrows to $X$. |
  | **5** | **Context Sensitivity:** How much does causal judgment depend on pragmatic context? | **Moderate.** Context affects which contrasts are salient, but the underlying causal relation is stable. | **High.** Causal selection is deeply sensitive to the modeling choices and the specific questions (explanatory interests) being asked. |
  | **6** | **Overdetermination:** In symmetric overdetermination (two rocks hit simultaneously), are both causes? | **Affirm (with difficulty).** Both are causes, but counterfactual dependence fails. Requires special handling (quasi-dependence or influence). | **Affirm (naturally).** Both are causes because intervening on either (while holding the other fixed) changes the outcome. |

  ---

  ### Part III: Analysis of Cruxes
  *This section identifies the driving forces behind the disagreements above. These are the specific points the collaboration must test.*

  #### Crux 1: The Preemption Problem (Necessity of Dependence)
  *   **The Dispute:** Lewisians accept that causation can exist without direct counterfactual dependence (via stepwise chains). Interventionists argue that if you model the case correctly (including the backup cause as a variable), dependence *is* preserved.
  *   **The Test Case:** Early Preemption (Assassin A poisons the drink; Assassin B stands ready but does nothing because A acted).
  *   **Why it matters:** If the Interventionist is right, the Lewisian "chain of dependence" is an unnecessary complication to save a failing theory. If the Lewisian is right, the Interventionist's "correct model" requirement smuggles in causal assumptions (knowing which variables to include) that makes the theory circular or epistemological rather than metaphysical.

  #### Crux 2: Ontology vs. Methodology (World vs. Variable)
  *   **The Dispute:** The Lewisian views causation as a feature of the territory (the world). The Interventionist views causation as a feature of the map (the model).
  *   **The Implication:** For the Lewisian, the Interventionist is changing the subject from "causation" to "causal explanation." For the Interventionist, the Lewisian is chasing a metaphysical ghost that science does not need and cannot find.
  *   **Why it matters:** This determines whether the collaboration is trying to find the *one true theory of causation* or a *unified framework for causal reasoning*.

  #### Crux 3: Metaphysics or Epistemology?
  *   **The Dispute:** Woodward explicitly states he is not doing metaphysics in the traditional sense (finding truth-makers). Lewis explicitly is.
  *   **The Suspicion:** A significant portion of the fight is verbal. The Lewisian asks, "What is causation?" The Interventionist answers, "How do we identify it?"
  *   **Resolution Path:** We must determine if Interventionism *implies* a metaphysics (e.g., a functionalist metaphysics) or if it is genuinely agnostic. If the latter, the two theories might be compatible rather than contradictory (one ontological, one methodological).

  ---

  ### Part IV: Assessment of Verbal Disputes
  *Is the disagreement substantive or merely terminological?*

  **Verbal Component Identified:**
  There is a high probability that **30-40% of the conflict is verbal**, centering on the definition of "Causation."
  *   **Lewisian Usage:** "Causation" refers to the mind-independent relation that grounds explanation.
  *   **Interventionist Usage:** "Causation" refers to the invariant relationship that supports manipulation and explanatory generalizations.

  **Recommendation:**
  We should adopt the distinction between **Causation$_{ontic}$** (Lewisian focus) and **Causation$_{func}$** (Interventionist focus).
  *   If we can agree that Causation$_{func}$ supervenes on Causation$_{ontic}$ (or vice versa), the formal disagreement dissolves into a division of labor.
  *   If the Interventionist denies Causation$_{ontic}$ exists (anti-realism), the dispute is substantive metaphysics.
  *   If the Lewisian admits Causation$_{func}$ is the only scientifically accessible version of Causation$_{ontic}$, the dispute becomes epistemological.

  **Action Item:**
  In the next seminar, proponents must state whether their theory is intended to be *exclusive* (the other is wrong) or *complementary* (the other addresses a different question).

  ---

  **Approved for Discussion by:**
  [Name], Dept. Chair
  [Date]
