prompt: |-
  Look, I'm in a department where the causation folks have split into two camps and they've been going at it for years — the Lewisians who think causation is basically counterfactual dependence, and the interventionists (Woodward, Pearl) who think you need to talk about interventions on variables and causal models. We want to do a proper adversarial collaboration instead of another round of the same seminar-room fights. Can you draft the document we'd produce? I want: (1) a numbered list of claims both sides can sign — about what the formalism requires, about symmetries both approaches respect, about which cases are easy for both; (2) a disagreements table where each row is a precise claim one side affirms and the other denies, worded so each side would say "yeah, that's what I think"; (3) the cruxes you think are actually driving the disagreement. I suspect one crux is whether preemption cases show counterfactual dependence isn't necessary for causation, and another is whether causation is fundamentally world-level or always relative to a variable set. A third might be whether the interventionist is doing metaphysics at all or just giving us an epistemology of causal inference. If you think some of the fight is just about words, say which part.
reasoning: |-
  Here's a thinking process that leads to the suggested adversarial collaboration document:

  1.  **Analyze the Request:**
      *   **Context:** A philosophy department divided between Lewisian counterfactual theorists (causation = counterfactual dependence) and Interventionists (Woodward/Pearl, causation = invariance under intervention within a model).
      *   **Goal:** Create a document for an *adversarial collaboration* (moving beyond seminar fights).
      *   **Required Components:**
          1.  Numbered list of agreed-upon claims (formalism, symmetries, easy cases).
          2.  Disagreements table (precise claims, one side affirms, one denies, phrased accurately).
          3.  Analysis of the "Cruxes" (preemption, metaphysics vs. epistemology, world-level vs. variable-relative).
          4.  Identification of verbal disputes (if any).
      *   **Tone:** Professional, precise, philosophically rigorous, conciliatory but clear on differences.

  2.  **Deconstruct the Philosophical Positions:**
      *   **Lewisians (Counterfactual):**
          *   Core: $C$ causes $E$ iff $E$ counterfactually depends on $C$ (or there's a chain of such dependencies).
          *   Semantics: Possible worlds, similarity ordering.
          *   Strengths: Intuitive handling of basic cases, unified metaphysical account.
          *   Weaknesses: Preemption (early/late), overdetermination, context-sensitivity.
          *   Metaphysics: Generally realist about causation as a feature of the world (Humean supervenience usually).
      *   **Interventionists (Manipulability/Structural):**
          *   Core: $X$ causes $Y$ iff there is a possible intervention on $X$ that changes $Y$ (holding other variables fixed).
          *   Semantics: Structural Equation Models (SEMs), Directed Acyclic Graphs (DAGs).
          *   Strengths: Handles preemption via conditioning, connects to science/statistics, handles levels of abstraction.
          *   Weaknesses: Reliance on "intervention" (which might be circular), variable relativity (is causation *in the world* or *in the model*?).
          *   Metaphysics: Often agnostic or functionalist (Woodward), sometimes viewed as epistemological.

  3.  **Drafting Section 1: Common Ground (The "Agreed Claims"):**
      *   Need to find overlap. Both use counterfactuals (Interventionists use structural counterfactuals). Both reject regularity theories (Humean simple regularity). Both accept asymmetry (cause $\to$ effect, not vice versa). Both agree on simple switching cases.
      *   *Drafting claims:*
          1.  Causation is distinct from mere correlation.
          2.  Counterfactuals play a central role (even if interpreted differently).
          3.  Causal relations are asymmetric.
          4.  Simple "switch" cases (shootings, rock throws without backups) are handled correctly by both.
          5.  Formalism: Both can be represented using Structural Equation Models (Lewisians can map their worlds to SEMs).
          6.  Transitivity: Both acknowledge issues with transitivity (Lewis modified his view; Interventionists restrict it).

  4.  **Drafting Section 2: The Disagreements Table:**
      *   Needs to be sharp. No strawmanning.
      *   *Issue 1: Preemption.* Lewisians (late) say dependence isn't necessary (chains). Interventionists say dependence *is* necessary relative to the right model (holding the backup fixed).
      *   *Issue 2: Variable Relativity.* Lewis: Causation is a relation between events in the world. Woodward: Causation is a relation between variables relative to a model/set.
      *   *Issue 3: Metaphysics vs. Method.* Lewis: Metaphysical analysis. Woodward: Functional/Explanatory (sometimes read as anti-metaphysical).
      *   *Issue 4: The nature of the "Intervention".* Lewis: Miracles/Small tweaks in worlds. Woodward: Logical/Physical possibility of breaking arrows.
      *   *Refining the phrasing:* Ensure the Lewisian recognizes their view in the "Affirm" column and the Interventionist recognizes theirs in the "Deny" column (or vice versa). Let's structure it as Claim | Lewisian | Interventionist.

  5.  **Drafting Section 3: The Cruxes (Analysis):**
      *   *Preemption:* This is the classic battleground. Lewis admits dependence isn't necessary (via chains). Interventionists say dependence *is* necessary if you model the preempted backup correctly. *Crux:* Is the "right model" constraint cheating, or is the "chain of dependence" ad hoc?
      *   *Metaphysics vs. Epistemology:* Woodward often says "I'm not doing metaphysics." Lewis definitely is. *Crux:* Is causation a "joint of nature" or a tool for explanation?
      *   *Variable Relativity:* Is causation absolute (world) or relative (description)? *Crux:* Ontological commitment.
      *   *Verbal Disputes:* Are they just defining "causation" differently? Lewis = "What makes it the case." Woodward = "What allows manipulation/explanation." There is likely a verbal component regarding the *purpose* of the analysis.

  6.  **Review and Refine:**
      *   *Check:* Did I address the user's specific suspicions? (Preemption, World vs. Variable, Metaphysics vs. Epistemology). Yes.
      *   *Check:* Is the tone right? Needs to be collaborative but rigorous.
      *   *Check:* Is the distinction between "type" and "token" causation clear? Both sides deal with both, but Interventionists lean type/variable, Lewis leans token/event. I should clarify this in the common ground or disagreements. Let's put it in disagreements.
      *   *Self-Correction on "Common Ground":* Be careful about SEMs. Lewis didn't use SEMs explicitly, but his followers (like Halpern) bridge the gap. I should phrase it as "compatible with" rather than "requires."
      *   *Self-Correction on "Intervention":* Make sure to distinguish Woodward's "intervention" from human agency (it's a theoretical construct).

  7.  **Final Polish:** Organize into the requested structure. Add an intro and outro to frame it as a living document for the department. (Proceed to generate output).

  8.  *(Post-Drafting Thought)*: Ensure the "Verbal Dispute" section is nuanced. It's not *just* words, but there is a pragmatic divergence.

  9.  *(Final check against constraints)*: Numbered list? Yes. Disagreements table? Yes. Cruxes analysis? Yes. Verbal dispute check? Yes.

