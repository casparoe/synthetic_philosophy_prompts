  4.  **Identifying Missed Moves:**
      *   **Dan:** Could have leaned harder into *error theory* (Mackie). Maybe there *are* no objective reasons, and that's fine. Or he could have distinguished between *motivating* reasons and *normative* reasons more clearly. He could have argued that "ideal conditions" are procedural, not substantive (logic is just how minds work, not a external norm).
