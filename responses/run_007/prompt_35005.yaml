answer: |-
  You are right to feel that the dial hasn't moved. The literature on Evolutionary Debunking Arguments (EDAs) has reached a state of **reflective equilibrium stalemate**. The moves are exhausted, the counter-moves are standardized, and both sides are digging into their respective trenches.

  Your hunch about the burden of proof is correct, but it is symptomatic of a deeper issue. This is not merely a procedural disagreement about who owes whom an argument. It is a **clash of epistemic frameworks regarding the relationship between explanation and justification.**

  Here is a diagnosis of the real structure of the impasse, followed by an assessment of whether anything can break it.

  ### 1. The Diagnosis: It's a Disagreement About "Explanatory Relevance"

  The core impasse is not about evolution, and it is not strictly about morality. It is about **when an alternative causal explanation constitutes an epistemic defeater.**

  **The Debunker's Principle (The Insensitivity/Independence Claim):**
  Street and Joyce rely on a specific epistemic principle: If your belief that $P$ is fully explained by a cause that is *independent* of the truth of $P$, then your belief is unjustified (or at least suspect).
  *   *Structure:* Evolution shaped belief $B$ for fitness $F$. $F$ is independent of moral truth $T$. Therefore, the correlation between $B$ and $T$ is coincidental.
  *   *The Intuition:* It would be a "cosmic coincidence" if fitness-tracking beliefs aligned with mind-independent moral truths.

  **The Realist's Principle (The Modal Security/Default Justification Claim):**
  Realists like Enoch, FitzPatrick, and Shafer-Landau reject the idea that an alternative causal explanation automatically defeats justification.
  *   *Structure:* We are default-justified in our moral beliefs (just as we are in perceptual ones). Merely showing an alternative cause doesn't defeat this unless you show the process is *unreliable*.
  *   *The Intuition:* Explaining *why* I believe $2+2=4$ (neural firing, evolutionary utility of counting) does not undermine the truth of $2+2=4$. Why should morality be different?

  **The Real Impasse:**
  The debate stalls because both sides are invoking different **default settings for epistemic trust.**
  *   **Debunkers** treat moral beliefs as *guilty until proven innocent*. They assume that once you reveal the causal genealogy, the burden shifts to the realist to prove a link to truth.
  *   **Realists** treat moral beliefs as *innocent until proven guilty*. They assume that genealogy is irrelevant unless it positively demonstrates error (e.g., by showing the beliefs are inconsistent or lead to bad outcomes).

  This is why the "Burden of Proof" observation you made feels accurate. But it's deeper: it's a disagreement about **whether genealogy is inherently corrosive.**

  ### 2. The Metaphysical Layer: The "Third-Factor" Dispute

  The realist's strongest counter-move has been the **Third-Factor Argument** (Enoch, FitzPatrick). They argue evolution *did* track truth, not by accident, but because a third factor (e.g., "survival is good" or "cooperation is valuable") influenced both the moral truth and the evolutionary pressure.

  **Why this hasn't moved the dial:**
  *   **Debunkers** reply that the "third factor" is just a moral assumption smuggled in. To say "survival is good" is to make a moral claim, which presupposes the very realism being challenged. It begs the question.
  *   **Realists** reply that "survival is good" is a conceptual truth or a necessary condition of agency, not a controversial moral claim.

  **The Structure:** This is a disagreement about **conceptual boundaries.** Is "survival is good" a *moral* premise (which needs justification) or a *pre-moral* condition of value (which is self-evident)?
  *   If you are a Humean or a Skeptic, it looks like a moral premise.
  *   If you are an Aristotelian or Robust Realist, it looks like a condition of agency.
  *   **Result:** You cannot resolve this without first settling the metaethical dispute the EDA was supposed to settle. The EDA becomes circular.

  ### 3. The "Self-Defeat" Standoff

  You mentioned the self-defeat argument (if EDAs debunk morality, they debunk math/logic/perception).
  *   **Realists** push this hard: "If you accept Street's logic, you lose science."
  *   **Debunkers** (like Street) bite the bullet or draw a distinction: "Math/Perception is different because those domains are causally relevant to survival in a way moral truths (if non-natural) are not."

  **The Impasse:** This turns on **Naturalism vs. Non-Naturalism.**
  *   If moral truths are natural properties, the EDA loses force (evolution tracks natural properties).
  *   If moral truths are non-natural (Platonic), the EDA gains force (how does evolution track causally inert facts?).
  *   Realists insist non-natural facts can be tracked via rational insight. Debunkers insist "rational insight" is just another name for "evolutionary intuition" and doesn't solve the tracking problem.

  ### 4. Can Anything Move the Needle?

  Given this diagnosis, here is the prognosis for resolution:

  **A. Empirical Findings? (No)**
  More evolutionary psychology will not help. Both sides are willing to stipulate the evolutionary story. The debate is about the *implications* of that story, not the story itself. Even if we found a "gene for utilitarianism," the realist would say "Truth selected for it," and the debunker would say "Fitness selected for it."

  **B. Formal Results? (Unlikely)**
  Bayesian formulations of the EDA (e.g., by Vavova or Schechter) have clarified the structure, showing that the debate rests on **prior probabilities.**
  *   Debunkers assign a low prior to $P(\text{Moral Truths} | \text{Evolutionary Causes})$.
  *   Realists assign a high prior.
  *   Formalizing this doesn't change the priors; it just exposes that the disagreement is foundational. You cannot prove a prior wrong; you can only show it is incoherent. Neither side's priors are incoherent.

  **C. Conceptual Distinctions? (Maybe, but limited)**
  The only conceptual move that has shown recent promise is distinguishing between **global** and **local** debunking, or shifting from **ontological** to **practical** justification.
  *   **Pragmatic Vindication:** Some (like Rorty or certain quietists) suggest we stop asking if morality is *true* and ask if it is *useful*. But this concedes the realist's main point (that truth is the goal).
  *   **Modal Security:** Katia Vavova's work suggests we need a reason to think our beliefs are *sensitive* to the truth to be defeated. If we have no reason to doubt them, genealogy doesn't matter. This favors realists, but debunkers just deny we have that security.

  **D. The Metaphilosophical Shift (The Only Real Hope)**
  The debate is unlikely to end within the current framework because it is a **framework disagreement.** It is analogous to the Realism vs. Anti-Realism debate in philosophy of science or mathematics.
  *   To move the dial, one would need to abandon the "Archimedean Point" assumption—the idea that we can step outside our moral practices to judge their validity from a neutral, evolutionary perspective.
  *   **Strawsonian Naturalism:** If we accept that we *cannot* step outside our normative practices (because reasoning itself is normative), then the EDA loses its grip. The demand for an external validation of morality is a category error.
  *   **Quietism:** Some (like Tristram McPherson or David Plunkett) suggest the debate is verbal. "Moral Truth" means different things to Street and Enoch. If we clarify the language, the disagreement might dissolve, though this feels like dissolving the problem rather than solving it.

  ### 5. Conclusion: Should We Move On?

  **Yes and No.**

  **No,** because the EDA forced metaethics to grow up. It killed off naive realism. It forced realists to articulate *how* we access moral truths (rational insight, third-factors, etc.). It is a productive stress test.

  **Yes,** in the sense that expecting a "knockout argument" is a category mistake. This is not a scientific dispute waiting for data. It is a clash of **worldviews.**
  *   **Worldview A (Debunker):** The universe is causally closed. Normativity is suspicious. Explanation crowds out justification.
  *   **Worldview B (Realist):** Normativity is fundamental. Rational insight is a valid mode of access. Justification is default.

  Unless one side converts to the other's broader metaphysical/epistemological worldview, the specific debate over EDAs will not resolve.

  **Recommendation:**
  If you are writing or researching, treat the EDA literature not as a battlefield where one side will win, but as a **map of fault lines in contemporary epistemology.** The value isn't in solving the EDA; it's in seeing what commitments (about modality, explanation, and normativity) are required to resist it.

  The "dial" hasn't moved because the needle is stuck on the glass. The only way to move it is to break the glass—i.e., change the metaphilosophical assumptions about what metaethics is supposed to do. Until then, smart people with different priors will indeed never converge.
