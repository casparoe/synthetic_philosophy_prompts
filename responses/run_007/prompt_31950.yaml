      *   *Reading 3: The Normative Ideal of Sovereignty (The "Weberian" Reading).*
          *   Claim: A legitimate state *ought* to monopolize force *and* align it with moral truth.
          *   Plausibility: Moderate (liberal democratic ideal).
          *   Work: Sets a standard for critique.
          *   Pascal: Unlikely. He is skeptical of human ability to know moral truth.

      *   *Reading 4: The Theological Paradox (The "Augustinian" Reading).*
          *   Claim: Human justice is inherently powerless without force because it lacks divine authority; force is inherently tyrannical without divine grace. We must submit to established force because we cannot know true justice.
          *   Plausibility: High (within Pascal's system).
