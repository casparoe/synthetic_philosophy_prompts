      *   **The Classmate's Interpretation:** They are using it as a *realist* maxim (like Machiavelli or Weber) to argue for a balance of might and right. They think it's a prescription for stable governance.
      *   **The Tension:** The classmate sees it as a solution (how to make politics work). Pascal likely sees it as a diagnosis of the human predicament (why politics *can't* truly work without God).
      *   **Spectrum of Interpretations:**
          1.  *Empirical/Trivial:* You need cops to enforce laws; bullying without rules is mean.
          2.  *Realist/Conventional:* Justice is just what the powerful say it is; force makes law.
          3.  *Normative/Legitimacy:* Legitimate authority requires both moral right and physical might.
          4.  *Theological/Skeptical (Pascal's actual view):* Human justice is flawed; force masks this; only God has true justice.

  3.  **Drafting the Distinct Claims (The Spectrum):**

      *   *Reading 1: The Empirical Truism (The "Enforcement" Reading).*
          *   Claim: Laws need police; brute strength without rules is oppression.
          *   Plausibility: High (obviously true).
          *   Work: Reminds us of practical constraints.
