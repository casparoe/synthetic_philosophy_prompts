      *   *Philosophers:* Will jump to "Consciousness/Qualia." *Correction:* Park that. This is about *formal self-replication*, not subjective experience (yet).
      *   *Timing:* Address these *as they arise* during the mapping phases, not upfront.

  6.  **Define the "Isomorphism" (The Core Claim):**
      *   It is *not*: DNA = Gödel Sentence.
      *   It *is*: The relationship between (Code + Interpreter + Copying Mechanism) is structurally identical in both systems.
      *   Key triad: String $\leftrightarrow$ Meaning $\leftrightarrow$ Action on String.

