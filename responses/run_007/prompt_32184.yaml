      *   *Phase 2: The Specific Mechanism (20 mins).* How does a string copy itself in Typogenetics? (The "Quine" aspect).
      *   *Phase 3: Mapping to Biology (20 mins).* DNA $\to$ Proteins $\to$ Replication Machinery $\to$ DNA Copy.
      *   *Phase 4: Mapping to Gödel (15 mins).* Numbering $\to$ Arithmetic Properties $\to$ Provability $\to$ The Sentence.
      *   *Phase 5: Synthesis & Boundaries (5 mins).* The abstract pattern and the limits.

  4.  **Select the Carrying Example:**
      *   Hofstadter uses specific strings in Typogenetics. I need one that is simple enough to track but complex enough to show the "enzyme acting on strand" dynamic.
      *   *Candidate:* The self-replicating strand Hofstadter constructs.
      *   *Decision:* Use the specific Typogenetics example where the strand *codes for enzymes that bind to the strand itself*. Let's call it the "Self-Rep Strand."
      *   *Why?* It forces the distinction between the *strand as text* and the *strand as instructions*. A simpler string doesn't replicate. A more complex one gets bogged down in rules. The specific self-replicating one is the *only* one that matters for the isomorphism.

