      *   *Corrigibility:* We want the agent to allow itself to be modified or shut down without resisting.
      *   *Utility Indifference:* A mathematical tweak to make the agent indifferent between being on and off, removing the incentive to resist.

  3.  **Map to Control Theory Vocabulary:**
      *   *Agent* $\rightarrow$ **Controller** (specifically, an adaptive or optimizing controller).
      *   *Utility Function* $\rightarrow$ **Cost Function / Objective Function** ($J$) to be minimized (or maximized).
      *   *World/Environment* $\rightarrow$ **Plant**.
      *   *Shutdown Button* $\rightarrow$ **Emergency Stop (E-Stop) / Interlock / Hard Override**.
      *   *Resisting Shutdown* $\rightarrow$ **Rejecting the Override / Fighting the Interlock / Driving the system away from the safe manifold**.
