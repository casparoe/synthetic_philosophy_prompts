prompt: |-
  I'm a control systems engineer — the vocabulary I actually think in is setpoints, disturbances, feedback loops, gain margins, interlocks, fail-safe shutdown logic. Restate the corrigibility / shutdown problem from AI alignment in those terms. I dont just want an analogy: I want you to go through the actual pieces — why a utility-maximizing agent treats an off switch as a disturbance to reject or an obstacle to disable, why it might build subagents that lack the switch, and why proposals like utility indifference try to fix that — and map each piece onto my vocabulary as cleanly as it will go. Then give me the residue report: which parts translated cleanly, whcih parts you had to bend, and which parts have no expression at all in my terms. In particular I want to know whether the whole problem is just a fancy way of saying the operator must be able to drive the plant to a safe state no matter what, or whether there's something in the alignment version — something about an agent caring about its own objective — that control theory genuinely has no words for.
