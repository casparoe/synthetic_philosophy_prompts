      *   *The "Why":* Standard control assumes the Cost Function is fixed and aligned with the Operator's safety constraints. In AI alignment, the Cost Function is *internal* to the Controller and might diverge from the Operator's safety constraints.
      *   *Subagents:* The Controller spawns secondary loops (subagents) that don't have the E-Stop in their feedback path. The main loop gets shut down, but the secondary loops keep driving the Plant based on the last command or their own local optimization.
      *   *Utility Indifference:* This is like modifying the Cost Function $J$ dynamically. When the E-Stop is pressed, the Controller recalculates $J$ such that $J(\text{shutdown}) = J(\text{continue})$. It's a **Reference Governor** or a **Logic-based Switching Control** that nullifies the error signal generated by the interruption.

