prompt: |-
  I'm a novelist writing a book set across several worlds in which recognisably the same mental life — grief, deliberation, amusement — is implemented in very different substrates: a human brain, a head-sized silicon network, a colonial organism whose members are individually mindless but whose colony as a whole seems to deliberate, and a creature whose nociception runs through hydraulic channels. Before I fix the book's metaphysics, I want the specification rather than a theory: what must an adequate account of the mind–body relation deliver, given that multiple realisability is the phenomenon it has to reckon with (whether as a datum to explain or as a claim that must be earned)? Give me the desiderata in list form — the cases it must get right or explain away, including the imagined system that passes every functional test yet lacks felt experience and the imagined system whose experiences are inverted; the distinctions it cannot collapse, including realisation versus identity, role versus occupant, type versus token, and the grain at which a realiser is individuated; and the constraints it must respect, such as not being so liberal that any input–output mimic counts as minded and not so chauvinist that only biological brains do — with the consideration behind each. Flag which are non-negotiable and which are merely one camp's preference. Then tell me which single desideratum does the most to exclude the obvious contenders, and whether any pair of desiderata is jointly unsatisfiable. Finally, say what would change your mind: which argument or consideration would lead you to demote one of the requirements, or where the list is most likely to fail.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** A novelist writing a sci-fi/fantasy book involving multiple realizability of mind (human, silicon, colonial, hydraulic).
      *   **Task:** Provide a *specification* (not a theory) of what an adequate account of the mind-body relation must deliver, given multiple realizability (MR).
      *   **Format:** List form of desiderata (cases to get right, distinctions to maintain, constraints to respect).
      *   **Specific Content:** Must include philosophical zombies, inverted qualia, realization vs. identity, role vs. occupant, type vs. token, grain of individuation, liberalism vs. chauvinism constraints.
      *   **Meta-Analysis:** Flag non-negotiable vs. camp preference. Identify the single most exclusionary desideratum. Identify jointly unsatisfiable pairs.
      *   **Reflection:** State what would change my mind (demote a requirement or where the list fails).

  2.  **Deconstruct the Philosophical Landscape:**
      *   The core tension is between *Functionalism* (mind is what it does) and *Physicalism/Biological Naturalism* (mind is what it's made of).
      *   Multiple Realizability (MR) is the central datum.
      *   The user wants a "specification" – essentially a requirements document for a metaphysical theory of mind.
      *   Key philosophical concepts to integrate: Zombies (Chalmers), Inverted Qualia (Block), Type/Token Identity (Place/Smart vs. Fodor), Role/Occupant (Lewis), Grain (coarse vs. fine).

  3.  **Drafting the Desiderata (Iterative Process):**

      *   *Constraint 1: Multiple Realizability.* The theory must allow different substrates to have the same mental states. (Crucial for the novelist).
      *   *Constraint 2: The Hard Problem/Consciousness.* It needs to address *why* some things feel like something. This brings in Zombies.
      *   *Constraint 3: Distinctions.* Need to clarify Type vs. Token. If pain is realized by C-fibers in humans and hydraulic pressure in aliens, is "pain" the same *type*? Functionalism says yes; Identity Theory says no (token identity only).
      *   *Constraint 4: Liberalism vs. Chauvinism.* Don't exclude aliens (chauvinism), don't include thermostats (liberalism).
      *   *Constraint 5: Internal Structure.* Does the internal mechanism matter, or just input-output? (Block's Chinese Nation).

      *Refining the List:*
      1.  **Accommodate Multiple Realizability (Token Level).** (Non-negotiable for the prompt's premise).
      2.  **Explain/Accommodate Phenomenal Consciousness.** (The Zombie case).
      3.  **Distinguish Role from Occupant.** (Functional role vs. physical stuff).
      4.  **Distinguish Type from Token.** (Is pain one thing or many?)
      5.  **Set the Grain of Realization.** (How detailed must the physical description be?)
      6.  **Avoid Panpsychism/Triviality (The Liberalism Constraint).** (Thermostats aren't sad).
      7.  **Avoid Biological Chauvinism.** (Silicon can think).
      8.  **Account for Qualitative Variation (Inverted Spectrum).**

  4.  **Categorizing and Flagging (Non-negotiable vs. Preference):**
      *   *Non-negotiable:* Logical consistency, addressing the prompt's MR premise.
      *   *Preference:* Whether to accept Zombies as possible (Physicalists say no, Dualists say yes). Whether Type Identity holds (Reductive vs. Non-reductive).
      *   *Correction:* The prompt asks *what an adequate account must deliver*. I need to frame these as requirements for the *theory*, not necessarily truths about the world, though some truths about the world constrain the theory.
      *   *Refinement on "Non-negotiable":* For a novelist *assuming* MR is real, the theory must accommodate it. But philosophically, MR itself is contested. I will flag MR as a "Premise Constraint" (Non-negotiable for *this* project) but note that some theories reject it.
      *   *Zombies:* Whether a theory must *allow* them or *explain them away* is the split. I will frame the desideratum as "Must take a definitive stance on the possibility of Zombies."

  5.  **Selecting the "Most Exclusionary" Desideratum:**
      *   What kills the most theories?
      *   *Candidate 1:* The Liberalism Constraint (excludes behaviorism, simple I/O functionalism).
      *   *Candidate 2:* The Phenomenal Constraint (excludes reductive physicalism if zombies are conceivable).
      *   *Candidate 3:* The MR Constraint (excludes Type Identity Theory).
      *   *Decision:* The **Phenomenal Constraint (The Hard Problem)** is usually the biggest filter. It separates functional/physical accounts from those requiring extra ontology. However, given the prompt's focus on MR, the **Grain/Realization Constraint** (avoiding the "Chinese Nation" problem while allowing silicon) is very tight.
      *   *Better Decision:* The constraint against **Panpsychism/Triviality (Liberalism)** is often the hardest to satisfy without slipping into Chauvinism. But the prompt asks what excludes *obvious contenders*. Type Identity Theory is an obvious contender killed by MR. Behaviorism is killed by Zombies/Input-Output insufficiency.
      *   *Selection:* **The Phenomenal Constraint (Accounting for 'What It Is Like' without dualism or eliminating it).** This forces the theory to choose between eliminating qualia, reducing them, or adding ontology.

  6.  **Identifying Jointly Unsatisfiable Pairs:**
      *   *Pair:* **Strict Type Identity** + **Multiple Realizability**. (If Pain = C-fiber firing, and Aliens have no C-fibers, Aliens have no Pain. MR says they do).
      *   *Pair:* **Causal Closure of the Physical** + **Non-reductive Mental Causation**. (If the physical does all the work, what does the mental do? Exclusion problem).
      *   *Selection:* **Type Identity** and **Multiple Realizability**. This is the classic Fodor vs. Place/Smart clash.

  7.  **Determining "What Would Change My Mind":**
      *   Where is the list vulnerable?
      *   The distinction between "Role" and "Occupant" relies on a functionalist framework. If structural realism or panpsychism is true, this distinction blurs.
      *   The "Non-negotiable" status of MR. If neuroscience finds a universal substrate (e.g., quantum microtubules everywhere), MR fails.
      *   *Best candidate:* The **Zombie Intuition**. If we prove consciousness is an illusion or fully reducible, the requirement to "account for felt experience" changes nature. Or, if MR turns out to be false (biological chauvinism is true).

  8.  **Review and Refine (Self-Correction against Prompt):**
      *   *Did I include the specific cases?* Zombies, Inverted Spectrum. Yes.
      *   *Did I include the distinctions?* Realization/Identity, Role/Occupant, Type/Token, Grain. Yes.
      *   *Did I include constraints?* Liberalism, Chauvinism. Yes.
      *   *Did I flag Non-negotiable vs. Preference?* Yes.
      *   *Did I identify the single most exclusionary one?* Yes.
      *   *Did I identify unsatisfiable pairs?* Yes.
      *   *Did I say what would change my mind?* Yes.
      *   *Tone:* Professional, philosophical, tailored to a novelist's world-building needs.

  9.  **Final Polish:** Ensure the distinction between "Specification for a Theory" and "Truths about the World" is clear. The user wants to know what the *account* must deliver. I need to make sure I don't just list philosophical puzzles, but requirements for the *solution*.

      *   *Correction on "Non-negotiable":* In philosophy, almost nothing is non-negotiable. I must frame this relative to the novelist's premise (MR is real) vs. general philosophical rigor. I will distinguish between "Project Constraints" (based on the book's premise) and "Theoretical Constraints" (based on logical coherence).

      *   *Refining the "Single Desideratum":* The "Grain" constraint is actually the trickiest for MR. If you go too fine, you lose MR. If you go too coarse, you get the Chinese Nation (liberalism). I'll stick with the **Phenomenal Constraint** as the most exclusionary of *standard physicalist* theories, but acknowledge the **Grain Constraint** is the most exclusionary for *functionalist* theories. Let's go with the **Phenomenal Constraint** because it challenges the materialist baseline most aggressively.

      *   *Refining "Unsatisfiable Pair":* **Causal Efficacy of the Mental** + **Causal Closure of the Physical** (The Exclusion Problem). This is a deeper metaphysical conflict than Type/MR. But Type/MR is more direct for the prompt. I will use **Type Identity** and **Multiple Realizability** as it's more accessible and directly relevant to the prompt's setup.

      *   *Refining "Change Mind":* The discovery of a universal physical correlate of consciousness (NCC) that is substrate-independent but physically specific (e.g. specific integrated information threshold) would challenge the MR premise or the Grain constraint.

  10. **Final Output Generation** (incorporating the above thoughts into the structured response).
answer: |-
  Here is a specification for an adequate account of the mind–body relation, tailored to your premise of Multiple Realizability (MR). This list functions as a requirements document for the metaphysics of your book.

  ### I. Desiderata: Cases and Phenomena
  *The account must explicitly accommodate or explain away the following intuitions and thought experiments.*

  1.  **The Multiple Realizability Datum**
      *   **Requirement:** The account must allow distinct physical substrates (neurons, silicon, hydraulics, colonial swarms) to instantiate the same mental state types (e.g., grief, deliberation).
      *   **Consideration:** This is the core premise of your book. A theory that ties "grief" essentially to "human neurochemistry" fails the project.
      *   **Status:** **Non-negotiable (Project Constraint).**

  2.  **The Phenomenal Constraint (The Zombie Case)**
      *   **Requirement:** The account must explain why some realizers have "felt experience" (qualia) while distinguishing them from a system that passes all functional/behavioral tests but lacks inner feeling (a Philosophical Zombie).
      *   **Consideration:** Your hydraulic creature must not only *act* hurt; the account must specify what makes the hydraulic pressure *feel* like pain rather than just data processing.
      *   **Status:** **Non-negotiable (Theoretical Coherence).** *Note: Physicalists may try to explain this away (illusionism), but they must still address the intuition.*

  3.  **The Qualitative Variation Case (Inverted Spectrum)**
      *   **Requirement:** The account must allow for the possibility that two systems could be functionally identical but have swapped qualitative experiences (e.g., one feels "red" where the other feels "green," or pain where the other feels amusement), without functional detection.
      *   **Consideration:** Crucial for drama. Can your silicon network be secretly suffering while appearing amused? The metaphysics must permit or forbid this explicitly.
      *   **Status:** **Camp Preference.** (Functionalists deny this is possible; Dualists and some Physicalists allow it).

  ### II. Desiderata: Distinctions to Maintain
  *The account must not collapse the following conceptual distinctions.*

  4.  **Realization vs. Identity**
      *   **Requirement:** The account must distinguish between a mental state *being* a physical state (Identity) and a mental state *being implemented by* a physical state (Realization).
      *   **Consideration:** If Mind = Brain (Identity), your silicon network cannot have a mind. If Mind is Realized by Brain, the silicon network can have the same mind via different hardware.
      *   **Status:** **Non-negotiable (for MR).**

  5.  **Role vs. Occupant**
      *   **Requirement:** The account must distinguish the *causal role* (what the mind does, e.g., processing grief) from the *occupant* (the stuff doing it, e.g., C-fibers or hydraulic valves).
      *   **Consideration:** This allows you to describe the "grief algorithm" separately from the "grief hardware."
      *   **Status:** **Non-negotiable (for Functionalism).**

  6.  **Type vs. Token**
      *   **Requirement:** The account must specify whether "pain" is one universal type (Type Identity) or many distinct physical tokens that share a label (Token Identity).
      *   **Consideration:** If Type Identity holds, your human and colony share a literal universal "pain." If only Token Identity holds, they share a functional analogy but metaphysically distinct states.
      *   **Status:** **Camp Preference.** (Reductive Physicalists prefer Type; Non-reductive Physicalists prefer Token).

  7.  **Grain of Individuation**
      *   **Requirement:** The account must specify the resolution at which the physical realizer is described. (e.g., Does the realizer include the atomic structure of the silicon, or just the logic gate states?)
      *   **Consideration:** If the grain is too fine, MR fails (no two brains are identical). If too coarse, Panpsychism looms (a thermostat has a mind).
      *   **Status:** **Non-negotiable (Theoretical Coherence).**

  ### III. Desiderata: Constraints on Scope
  *The account must navigate between the following boundaries.*

  8.  **The Anti-Chauvinism Constraint**
      *   **Requirement:** The account must not restrict mentality to biological carbon-based life.
      *   **Consideration:** Excludes "Biological Naturalism" (Searle) unless modified. Essential for your silicon and colonial characters.
      *   **Status:** **Non-negotiable (Project Constraint).**

  9.  **The Anti-Liberalism (Panpsychism) Constraint**
      *   **Requirement:** The account must not attribute mentality to trivial input-output systems (e.g., thermostats, rocks, simple lookup tables).
      *   **Consideration:** This is the "Chinese Nation" problem. If your colonial organism is just a bunch of dumb bugs passing signals, at what point does the colony become minded? The theory must draw a line.
      *   **Status:** **Non-negotiable (Theoretical Coherence).**

  10. **Causal Efficacy**
      *   **Requirement:** The account must explain how mental states can cause physical actions without violating the causal closure of the physical world.
      *   **Consideration:** If the hydraulic fluid follows laws of physics, does "grief" add any causal power, or is it just a shadow?
      *   **Status:** **Non-negotiable (Theoretical Coherence).**

  ---

  ### IV. Meta-Analysis of the Specification

  #### 1. The Single Most Exclusionary Desideratum
  **The Phenomenal Constraint (The Zombie Case).**
  This is the filter that eliminates the largest number of otherwise viable physicalist theories.
  *   **Why:** Many theories (Behaviorism, Functionalism, Reductive Physicalism) can easily handle Multiple Realizability and Causal Efficacy. They struggle immensely to explain *why* the realization feels like something.
  *   **Effect:** This desideratum forces you to choose between **Dualism** (adding non-physical stuff), **Panpsychism** (consciousness is fundamental), or **Eliminativism/Illusionism** (denying the reality of the "felt" aspect). It excludes any theory that treats the mind as *purely* structural/functional without an added account of qualia.

  #### 2. The Jointly Unsatisfiable Pair
  **Strict Type Identity** AND **Multiple Realizability.**
  *   **The Conflict:**
      *   **Type Identity** states: Mental State M *is* Physical State P (e.g., Pain = C-fiber firing).
      *   **Multiple Realizability** states: Mental State M can be realized by Physical State P1 (human), P2 (silicon), P3 (hydraulics).
      *   **Result:** If M = P1, then a creature with P2 cannot have M. If a creature with P2 *does* have M, then M cannot be identical to P1.
  *   **Resolution:** You must abandon Type Identity in favor of **Token Identity** (each instance is unique) or **Functionalism** (M is defined by role, not stuff). For your book, you must reject Type Identity.

  #### 3. What Would Change My Mind
  There are two points where this specification is most vulnerable to revision:

  *   **The Grain of Individuation (Desideratum 7):**
      *   **Argument:** If future neuroscience discovers a **universal physical correlate of consciousness** (e.g., a specific quantum vibration or integrated information threshold) that is present in *all* minded things regardless of substrate, the "Grain" requirement shifts. We might find that MR is only superficial; at the fundamental grain, all minds *are* physically identical.
      *   **Consequence:** This would demote the **Multiple Realizability Datum** from a Non-negotiable constraint to a contingent feature. It would allow you to use **Type Identity** after all, provided the "type" is defined at the quantum/informational level rather than the biological level.

  *   **The Phenomenal Constraint (Desideratum 2):**
      *   **Argument:** If a compelling argument for **Illusionism** (e.g., Keith Frankish) succeeds, demonstrating that "felt experience" is a user-illusion generated by functional processing, the requirement to "explain qualia" dissolves into a requirement to "explain the error theory of qualia."
      *   **Consequence:** This would make **Functionalism** much easier to defend. You would no longer need to specify *how* hydraulics feel, only *how* the hydraulic system generates the report that it feels. This would significantly simplify the metaphysics of your colonial organism.

  ### Recommendation for the Novelist
  For the specific worlds you described, **Non-Reductive Physicalism (Functionalism)** is the most robust framework. It satisfies the MR requirement, keeps the physics closed (no magic), and distinguishes Role from Occupant.

  However, to satisfy the **Phenomenal Constraint**, you should introduce a "Grain" rule for your universe: *Consciousness arises not from the material, but from the specific topology of information integration.* This allows your hydraulic creature to be minded (if its valves integrate information sufficiently) while excluding your thermostat (which does not), satisfying both the Anti-Chauvinism and Anti-Liberalism constraints without invoking magic.
