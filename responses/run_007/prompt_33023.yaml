prompt: |-
  So I've been talking with my roommate about this after we watched some nature documentary, and I realized I have pretty strong intuitions about what counts as alive and what doesn't, but I cannot for the life of me articulate the rule I'm using. I'm hoping you can help me extract the principle, or at least narrow it down.

  Here are my verdicts on a bunch of cases. An E. coli bacterium: obviously alive. A California redwood: alive. A mule: alive, even though it's sterile and can't reproduce. A person in a permanent vegetative state, kept going by a ventilator: alive. A frozen tardigrade in cryptobiosis, completely metabolically shut down: still alive, just dormant. A newly fertilized human zygote: alive.

  Now the no's. A flu virus: not alive. A prion: definately not alive. A flame: not alive, even though it metabolizes and reproduces in a sense. A computer virus: not alive. A crystal growing in a saturated solution: not alive.

  Here's where I get tangled up. If I say the tardigrade is alive despite having zero metabolism, then metabolism can't be necessary. But then why isn't the virus alive? It's got genetic material, it replicates (with help from a host, sure, but the tardigrade also needs external conditions to revive). And if reproduction isn't necessary — the mule is alive — then why does the virus's dependence on a host for replication disqualify it? Meanwhile I say the flame isn't alive, but it's got a kind of metabolism and it propagates. I feel like I'm reaching for something about being part of a lineage, or having organizational closure, or being the kind of thing that's subject to natural selection, but each of those runs into trouble with at least one of my verdicts.

  Also, I haven't made up my mind about a synthetic protocell — a lipid vesicle that self-assembles, takes in nucleotides from its environment, and replicates its internal RNA — but doesn't have any of the machinery of a real cell. Is that alive? And what about an AI system that maintains its own codebase, patches bugs, and spawns improved versions of itself? I lean toward no on the AI, but I can't say why without undermining the virus verdict.

  Can you help me figure out what principle, if any, is driving my judgments? I'd like you to give me a committed answer — state a definite principle (or a small set of candidates) and argue for it, not just lay out the menu of options. And if some of my verdicts have to go, tell me which ones and why. Please write the answer in British English.
