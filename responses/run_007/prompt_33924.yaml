  **The Man Within**

  I plead the heat of blood, the urgent hour,
  How passion swept like wind before the deed.
  I sought not glory, nor abused my power,
  And suited action to the present need.
  Who knows the burden but the one who bears?
  The secret map that only I have known;
  No stranger walks within my private cares,
  So I maintain the conduct is my own.
  Yet hush—a stranger wakes within the breast,
  Unmoved by pleas that sway the crowd without.
  He views me as but one among the rest,
  And strips the veil I used to banish doubt.
  I forged the eyes that find my plea untrue,
  And am the prisoner and the jailer too.
