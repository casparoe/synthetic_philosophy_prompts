answer: |-
  # Q&A Prep Sheet: Peircean Future Contingents

  ### 1. The "Liar" Objection (Ockhamist)
  **Who:** One of the TRL Ockhamists.
  **The Question:** "On your view, if I say tomorrow 'It will rain,' and it does rain, I have spoken falsely at the time of utterance. This violates our basic norms of assertion. You are turning successful predictors into liars. Why should we accept a semantics that systematically misdescribes our linguistic practice?"

  **The Reply (2 mins):**
  "I grant this is counterintuitive, but it stems from conflating *correctness* with *truth*. On my account, 'will' functions as a modal operator of historical necessity, not a simple tense marker. When you say 'It will rain,' you are asserting that rain is settled or necessitated by the present. If the future is genuinely open, that assertion is indeed false, even if the rain occurs.
  However, this doesn't make you a 'liar' in the pejorative sense. You were *reasonable* to assert it based on evidence, but you overstepped the semantic bounds of 'will.' We should distinguish between *warranted assertibility* (which you had) and *truth* (which you lacked). My semantics preserves the integrity of truth by reserving it for what is settled, while allowing that we can legitimately assert things that are merely probable. The cost to intuition is the price of avoiding fatalism."

  **Concede/Hold:**
  *   **Concede:** Acknowledge this clashes with pre-theoretic intuition about prediction.
  *   **Hold:** Do not concede that 'will' is merely a future tense marker. Hold that 'will' carries a modal force of settledness.
  *   **Soft Spot:** The distinction between warrant and truth may feel like a dodge to a philosopher of language. Be prepared to elaborate on assertion norms.

  ### 2. The "Logic" Objection (Logician/Agnostic)
  **Who:** An agnostic with strong logical instincts.
  **The Question:** "You claim the disjunction 'It will happen or it will not happen' is true, but neither disjunct is true. In classical logic, if a disjunction is true, at least one disjunct must be true. Are you rejecting classical logic? If so, doesn't that undermine your claim to offer a 'stable' semantics?"

  **The Reply (2 mins):**
  "I am not rejecting classical logic; I am rejecting the assumption that the surface grammar of 'will' maps directly to classical truth-functional operators in the object language. The disjunction is true because it is *super-true*: it holds across all histories. However, the individual disjuncts fail because 'will' quantifies universally over histories.
  Think of it this way: The logical form of 'Will p' is $\forall h(p)$. The disjunction is $\forall h(p) \lor \forall h(\neg p)$. This is false in branching time. But the natural language sentence 'Either it will happen or it won't' is often read as 'It is settled that (p or not-p),' which is $\forall h(p \lor \neg p)$. That is true. I am arguing that the natural language disjunction takes wide scope over the 'will' operator. Thus, classical logic is preserved at the level of semantic evaluation, even if the surface syntax looks problematic."

  **Concede/Hold:**
  *   **Concede:** Admit that surface syntax is misleading and requires logical reconstruction.
  *   **Hold:** Hold that classical logic applies to the reconstructed semantic content, not the surface grammar.
  *   **Soft Spot:** This relies on a specific scope distinction. If they press that the natural language disjunction *does* take narrow scope, you must admit a deviation from classical bivalence.

  ### 3. The "Asymmetry" Objection (B-Theorist)
  **Who:** One of the B-Theorists.
  **The Question:** "You treat the past as fixed and the future as open. But on a B-theory, past and future are ontologically symmetric. Why should the semantics of 'will' depend on a dynamic asymmetry that doesn't exist in the block universe?"

  **The Reply (2 mins):**
  "My account doesn't require a dynamic passage of time, only a structural asymmetry in *access* and *causation*. Even in a block universe, the causal relations run one way. From the perspective of a moment $m$, the past is causally efficacious regarding $m$, but $m$ is not causally efficacious regarding the past.
  The 'openness' I defend is not about the ontology of events but about the *causal necessitation* relative to a speaker. 'Will' expresses causal necessity from the standpoint of the utterance. Since causes precede effects, the semantic asymmetry of 'will' mirrors the causal asymmetry, which is compatible with a B-theoretic ontology. You can have a block universe where, relative to a slice, the future slice is not causally determined by the present slice."

  **Concede/Hold:**
  *   **Concede:** You do not need to commit to A-theory or dynamic passage.
  *   **Hold:** Hold that causal asymmetry is sufficient to ground the semantic asymmetry.
  *   **Soft Spot:** If they deny causal asymmetry in the block (viewing it as Humean regularity), your grounding evaporates.

  ### 4. The "Gap" Objection (Supervaluationist)
  **Who:** The Supervaluationist member.
  **The Question:** "We agree that future contingents lack a determinate truth value. But why call them *false*? Why not say they are *indeterminate*? Calling them false seems to imply there is a fact that makes them false, which contradicts the openness you're trying to protect."

  **The Reply (2 mins):**
  "Calling them 'indeterminate' suggests a truth-value gap, which complicates the logic of negation and disjunction. By treating 'Will p' as false when $p$ is contingent, I preserve bivalence for the operator 'will' itself. 'Will p' is a strong claim: it claims necessity. If necessity is absent, the claim fails. It is false in the same way 'All swans are white' is false if one swan is black.
  The 'fact' that makes it false is simply the existence of a possible history where $p$ does not occur. This doesn't settle the future; it just notes the lack of settlement. My view is more parsimonious: we don't need a third value, we just need to recognize that 'will' is a universal quantifier that fails when the domain isn't uniform."

  **Concede/Hold:**
  *   **Concede:** Acknowledge that 'false' sounds strong for something that hasn't happened yet.
  *   **Hold:** Hold that 'false' is the correct evaluation for a failed universal quantification.
  *   **Soft Spot:** The Supervaluationist will argue that 'false' implies 'necessarily false' in some contexts. Watch out for modal collapse.

  ### 5. The "Promise" Objection (Ockhamist)
  **Who:** The second Ockhamist.
  **The Question:** "If I promise 'I will be there,' and I am there, your view says my promise was falsely uttered. But promises create obligations. If the utterance was false, how did the obligation arise? You seem to make promising impossible for contingent events."

  **The Reply (2 mins):**
  "Promises do not rely on the truth of 'will' in the Peircean sense; they rely on the commitment of the agent. When you promise, you are not describing the future; you are altering the deontic landscape. You are making it the case that, in all morally acceptable continuations, you are there.
  The truth of the promise isn't about causal necessity; it's about deontic necessity. My semantics applies to *predictions*, not *commitments*. If you treat 'I will be there' as a prediction, it is false if you might fail. If you treat it as a vow, it functions differently. We shouldn't let the semantics of prediction dictate the logic of commitment."

  **Concede/Hold:**
  *   **Concede:** Admit that 'will' in promises functions differently than in predictions.
  *   **Hold:** Hold that your thesis concerns assertoric/predictive uses of 'will'.
  *   **Soft Spot:** The line between prediction and commitment is often blurred in natural language.

  ### 6. The "Retroactivity" Objection (Agnostic)
  **Who:** An agnostic with logical instincts.
  **The Question:** "If 'It will rain' is false today, but it rains tomorrow, does the sentence become true tomorrow? If truth values change, you lose the 'stable truth' you promised. If they don't, you're stuck with the result that a true event was predicted by a false statement."

  **The Reply (2 mins):**
  "Truth is relative to the time of evaluation. The sentence 'It will rain,' uttered today, is eternally false *as evaluated from today*. Tomorrow, we evaluate a different sentence: 'It rained.' We do not re-evaluate yesterday's utterance as true; we acknowledge that the event occurred.
  This preserves stability: the truth value of the assertion is fixed at the moment of utterance relative to the options available *then*. We don't need truth values to change; we just need to recognize that the proposition expressed is time-sensitive. The 'stable truth' I defend is the stability of the past: once a moment is past, its truth values are fixed relative to that moment."

  **Concede/Hold:**
  *   **Concede:** Acknowledge that this requires a nuanced view of temporal propositions.
  *   **Hold:** Hold that the truth value of an utterance is fixed at the time of utterance.
  *   **Soft Spot:** This risks looking like relativism. Be clear that the *fact* of the utterance's truth is permanent, even if the content is about the future.

  ### 7. The "Causal Base" Objection (B-Theorist)
  **Who:** The second B-Theorist.
  **The Question:** "You define truth over 'causally possible continuations.' But what grounds causal possibility? If the laws of nature are fixed, isn't there only one physically possible future? You're smuggling in indeterminism as a semantic premise."

  **The Reply (2 mins):**
  "I am not smuggling in indeterminism; I am conditioning the semantics on it. My thesis is: *If* the future is contingent, *then* this is the correct semantics. If determinism is true, then there is only one history, and my view collapses into the Ockhamist view trivially.
  The 'causally possible' set is defined by the laws of nature plus the present state. If those laws are indeterministic, the set branches. If they are deterministic, the set is a singleton. My account is robust because it works in both worlds, but it only *matters* in the indeterministic one. I am offering the semantics for the world as we experience it: open."

  **Concede/Hold:**
  *   **Concede:** Admit the view presupposes indeterminism to be distinct from Ockhamism.
  *   **Hold:** Hold that the semantics is valid regardless, but only non-trivial if indeterminism holds.
  *   **Soft Spot:** If they argue that 'causal possibility' is incoherent in a B-theory, you must fall back on logical possibility.

  ***

  ### The Dreaded Question
  **The Question:** "If the disjunction 'Will p or Will not p' is true, but neither disjunct is true, you have violated the principle of Disjunctive Syllogism ($A \lor B, \neg A \vdash B$). If you reject classical inference rules to save your semantics, haven't you lost the logical stability you claimed as an advantage over the Supervaluationist? Why aren't you just a Supervaluationist?"

  **The Handling Line:**
  "That is the precise cost of the view. I am accepting a deviation from classical *syntax* to preserve classical *metaphysics* about the settled past. Unlike the Supervaluationist, I do not say the disjuncts lack truth values; I say they are false. This keeps the logic bivalent, even if it restricts inference rules for future tense operators. I am not a Supervaluationist because I deny truth-value gaps; I accept truth-value *failure* due to modal strength. If I must choose between classical inference for 'will' and a non-fatalist metaphysics, I choose the metaphysics."
