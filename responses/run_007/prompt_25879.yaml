answer: |-
  This is a classic philosophical standoff. Dave is wielding what meta-ethicists call the **Argument from Normative Dominance**: if morality is a normative system, and Act A has more moral value than Act B, then morality must "dominate" your choice and require A. To defend supererogation, you have to break the link between "morally best" and "morally obligatory."

  Here is a tier list of the main accounts of supererogation, ranked by how effectively they dismantle Dave's specific logical challenge.

  ### **S-Tier: The Logical Counters**
  **1. Satisficing Consequentialism**
  This view directly denies Dave's core premise by arguing that morality only requires you to do what is "good enough," not what is *optimal*. It handles Dave's challenge best because it logically permits you to choose a lesser good without contradiction, provided the threshold of acceptability is met.
  **2. The Reasons-Based View (Agent-Centered Prerogatives)**
  Championed by philosophers like Samuel Scheffler, this argues that agents have a prerogative to give extra weight to their own interests, creating a protected sphere of optionality. It defeats Dave by distinguishing between "moral value" (which the act has) and "all-things-considered rationality" (which includes your personal costs), breaking the "better = required" link.

  ### **A-Tier: The Standard Defense (Intuitively Strong, Logically Leaky)**
  **3. The Cost/Sacrifice View**
  This is the standard definition (an act is supererogatory if it is good but involves significant sacrifice), but it struggles against Dave because it doesn't explain *why* cost negates obligation. It essentially asserts that high cost creates an exemption, but to a hardliner like Dave, that just looks like saying "morality stops when things get hard," which he will reject as a category error.

  ### **B-Tier: The Category Shift**
  **4. Virtue Ethics**
  This account dissolves the problem by shifting focus from "which act is required?" to "what would a virtuous agent do?" It handles Dave's worry by suggesting that while a saint *would* run into the burning building, failing to do so doesn't make you vicious, just ordinary. However, Dave can counter that this just changes the subject without solving the normative puzzle of whether you *ought* to do the act.

  ### **C-Tier: The "Dave Might Be Right" Reality Check**
  **5. Maximizing Consequentialism (Eliminativism)**
  If you find the S-Tier options arbitrary (where do we set the "good enough" bar?) or the Reasons-Based view too self-indulgent, Dave is logically consistent here. This view holds that supererogation is indeed a myth created to soothe our guilt over not doing the best we can. It lands in the bottom tier not because it's illogical, but because it demands the total abolition of the concept you're trying to defend.

  ***

  ### **Honest Assessment: Why Dave Might Actually Be Right**
  To be brutally honest, Dave has the stronger *logical* position, even if his conclusion feels harsh. The "Argument from Normative Dominance" is notoriously difficult to defeat without accepting one of two costly concessions:
  1.  **Arbitrariness:** Satisficing views struggle to explain *why* the cutoff for "good enough" is where it is without it seeming arbitrary.
  2.  **Normative Pluralism:** You have to accept that "moral value" isn't the only thing that generates reasons for action, which complicates the structure of morality significantly.

  If you define morality strictly as "maximizing the good," Dave wins by definition. To beat him, you have to convince him that morality isn't just about maximizing outcomes, but about managing the relationship between the agent and the world. If he won't budge on that definition, no account of supererogation will satisfy him.
