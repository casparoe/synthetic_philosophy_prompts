prompt: |-
  So I just spent like two hours arguing with my friend Dave about supererogation — you know, acts that are morally good but not required, like donating a kidney to a stranger or running into a burning building. Dave's position is basically that the whole concept is incoherent. His argument: if an act is genuinely morally better than the alternative, then morality *requires* you to do it — otherwise what does "better" even mean? He kept saying "you can't just have bonus moral points floating around, that's not how normativity works." I pushed back with the standard stuff about how making everything obligatory would be way too demanding, but he wasn't buying it — he thinks that's just a psychological cope, not a real philsophical defense.

  Anyway, I'm still turning it over and I want to get clearer on which accounts of supererogation actually have the resources to answer Dave's challenge. Can you rank the main philosophical accounts — like the cost-based view, the reasons-based view, the satisficing view, the virtue-ethical take, whatever else you think belongs on the list — by how well they handle the basic worry that if act A is morally better than act B, it's hard to see why A isn't just obligatory? Give me a tier list or ranking, and for each one say in a couple sentences why it lands where it does. And be honest — if you think none of them really work, put them all in the bottom tier and tell me why Dave might actually be right.
