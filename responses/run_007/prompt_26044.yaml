prompt: |-
  So I got this weird email last week from someone claiming to be an AI researcher at a major lab (he wouldn't say which). He says his team is maybe five years out from being able to run billions of simulated human minds, and that if I don't wire him $200 right now, when the tech arrives he'll spin up a simulated copy of me and torture it for a subjective trillion years. He included this whole expected-value calculation: even if I think there's only a one-in-a-billion chance he's telling the truth, a trillion years of torture times one-in-a-billion is still a thousand years of expected torture — so $200 is a steal to avoid that. My gut says this is a scam and I should just ignore it, but I've been reading some rationalist stuff lately and I can't figure out what's actually wrong with his math. If I really assign some non-zero credence to his threat, shouldn't I pay? Or is there a way out of this that doesn't involve just pretending the probabilty is literally zero?
reasoning: |-
