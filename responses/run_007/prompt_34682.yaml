      *   *Resolution for (3):* The unease likely comes from the *act* of termination (killing) vs. *omission* (not conceiving). If we strip away the abortion element and make it "choose not to implant an embryo," does the unease remain? If yes, it's a population ethics inconsistency. If no, it's an abortion ethics issue. I should suggest this test.

