prompt: |-
  hi so i'm in student gov and we got assigned to evaluate this proposal where the school installs solar panels — costs a ton upfront (like, from our reserve fund) but saves money on electricity over ~20 years and cuts emissions. the administration told us to use "intergenerational justice" as our framework but honestly none of us know what that means as an actual thing you do, as opposed to just a vibe.

  can you turn intergenerational justice into like a decision procedure or checklist we can actually run? we have 30-minute meetings and we're not philosophers. i need: what questions to ask and in what order, what counts as a good enough answer, where the procedure says yes this is fair to future students, where it says no, and where it has to punt to a judgment call because it's values not facts.

  things it needs to handle: discounting (should we care less about students 30 years from now just cause they're far away in time?), uncertainty (we don't know future energy prices or what the climate will actually be like), and the fact that future students don't get a vote in student gov which feels kinda unfair but also unavoidable.

  then run the procedure on two cases: (1) the solar panel thing, and (2) a proposal to cut the arts budget to build a STEM lab — current students really want the lab, but it means future students lose the arts program permanently. i want to see where the procedure gives an answer i might not like.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** Student government member.
      *   **Task:** Evaluate a proposal (solar panels) using "intergenerational justice" (IGJ) as a framework.
      *   **Problem:** IGJ feels like a "vibe," not a tool. They need a concrete decision procedure/checklist for 30-minute meetings.
      *   **Requirements:**
          *   Questions to ask (in order).
          *   Criteria for "good enough" answers.
          *   Clear "Yes/No/Punt" outcomes.
          *   Handle specific issues: Discounting (time preference), Uncertainty (future prices/climate), Representation (future students can't vote).
          *   Run the procedure on two cases: (1) Solar Panels (high upfront cost, long-term savings/emissions), (2) Arts Cut for STEM Lab (current benefit, permanent future loss).
          *   Show where the procedure might yield counter-intuitive results.
      *   **Tone:** Practical, actionable, not overly philosophical, but rigorous enough to be meaningful.

  2.  **Deconstruct "Intergenerational Justice" (IGJ):**
      *   *Core Concept:* Fairness between generations. Not burdening the future with our debts/problems, not depriving them of opportunities we had.
      *   *Key Philosophical Tensions:*
          *   Discounting: Do future benefits/costs count less? (Standard economics says yes; ethics often says no).
          *   Non-Identity Problem: Actions change *who* is born. (Too complex for a 30-min meeting, skip or simplify).
          *   Rights vs. Utility: Do future students have a *right* to certain things, or do we just maximize total happiness?
          *   Irreversibility: Can future students undo our decision?
      *   *Operationalizing:* Need to translate these into "Can we afford this?" "Are we locking them in?" "Are we leaving them better off?"

  3.  **Drafting the Decision Procedure (The "IGJ Checklist"):**
      *   *Goal:* 5-7 steps max. Must fit in 30 mins.
      *   *Step 1: Baseline & Irreversibility.* Is this change permanent? Can they undo it?
      *   *Step 2: Burden vs. Benefit Transfer.* Who pays? Who benefits? (The "Bill" test).
      *   *Step 3: Discounting & Time Horizon.* How do we value the future? (Adopt a low or zero discount rate for essential goods).
      *   *Step 4: Uncertainty & Resilience.* What if we're wrong? Does this help them adapt?
      *   *Step 5: Representation Proxy.* Since they can't vote, who speaks for them? (Trustees? Sustainability Office?).
      *   *Outcomes:* Green (Pass), Yellow (Conditions), Red (Fail), Grey (Values Call).

  4.  **Refining the Specific Constraints:**
      *   *Discounting:* Standard finance uses high discount rates (money now > money later). IGJ usually argues for *low* discount rates on *essential* goods (climate, basic rights). I need to make this explicit in the checklist.
      *   *Uncertainty:* Use a "Precautionary Principle" lite. If the downside is catastrophic, don't do it. If the upside is essential, do it.
      *   *Representation:* Acknowledge the deficit. Require a "Future Impact Statement."

  5.  **Running Case 1: Solar Panels:**
      *   *Upfront:* High cost (Reserve Fund).
      *   *Downstream:* Lower bills, lower emissions.
      *   *Irreversibility:* Panels last 20-30 years. Hard to undo, but generally positive.
      *   *Discounting:* Financially, ROI is long. Ethically, climate benefit is high.
      *   *Verdict:* Likely Pass (Green), but maybe with a note on reserve fund liquidity.

  6.  **Running Case 2: Arts Cut for STEM Lab:**
      *   *Upfront:* Current students get cool lab.
      *   *Downstream:* Future students lose Arts *permanently* (budget reallocation).
      *   *Irreversibility:* High. Once a program is cut, it's hard to restore.
      *   *Burden/Benefit:* Currents get benefit, Futures get burden (less education breadth).
      *   *Verdict:* Likely Fail (Red) or Heavy Conditions. This illustrates the "counter-intuitive" part if the current student gov *really* wants the lab.

  7.  **Addressing the "Counter-Intuitive" Requirement:**
      *   I need to make sure the procedure doesn't just say "Solar = Good, Arts Cut = Bad."
      *   *Twist on Solar:* What if the reserve fund depletion puts the school at risk of bankruptcy in 5 years? Then IGJ says "No" because you're bankrupting the future to save the climate. I should highlight this risk.
      *   *Twist on Arts:* What if the STEM lab generates revenue that *funds* the arts later? (Unlikely, but possible).
      *   *Focus:* The Arts Cut is the stronger example of IGJ failure (consuming capital vs. investing). The Solar example might fail on *financial* IGJ if it risks insolvency.

  8.  **Structuring the Response:**
      *   **Intro:** Acknowledge the frustration. Define IGJ practically.
      *   **The Tool:** "The Future-Proofing Checklist" (5 Steps).
      *   **The Scoring:** How to interpret results.
      *   **Case Study 1 (Solar):** Walk through the steps.
      *   **Case Study 2 (Arts vs. STEM):** Walk through the steps.
      *   **The "Ouch" Moment:** Highlight where the procedure might block something popular (like the STEM lab) or demand something expensive (Solar).
      *   **Closing:** Advice on the "Values Punt."

  9.  **Refining the Content (Self-Correction during drafting):**
      *   *Critique:* Is "Discounting" too technical?
      *   *Fix:* Frame it as "The Time Value of Fairness." Don't use interest rate jargon. Ask: "Would we accept this cost if we were the ones paying it in 20 years?"
      *   *Critique:* Is 30 minutes enough?
      *   *Fix:* Emphasize that data needs to be prepped *before* the meeting. The meeting is for the checklist.
      *   *Critique:* Make sure to address the "Reserve Fund" issue in Solar. Draining reserves is borrowing from the future.
      *   *Correction:* If the solar panels *pay for themselves* in 15 years, the reserve is replenished. If they don't, it's a net drain. I need to make sure the checklist asks about *net* position, not just upfront cost.

  10. **Final Polish:** Ensure tone is supportive but firm. Use bolding for scanability. (Proceed to generate output based on this plan).

  *(Self-Correction on the "Counter-Intuitive" part)*: The prompt asks to see where the procedure gives an answer I *might not like*.
  *   *Solar:* Usually people like solar. Where would IGJ say no? If the maintenance costs in 20 years are huge and the panels become toxic waste. Or if draining the reserve fund prevents the school from surviving a recession in 5 years. I'll highlight the Reserve Fund risk.
  *   *Arts/STEM:* Current students *want* the lab. IGJ will likely kill it. That's the "answer I might not like."

  Let's build the checklist.

  *   Step 1: Reversibility.
  *   Step 2: Net Resource Transfer (Are we leaving them more or less?).
  *   Step 3: Essential Needs (Climate/Education basics).
  *   Step 4: Uncertainty Buffer.
  *   Step 5: Proxy Voice.

