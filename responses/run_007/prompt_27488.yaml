answer: |-
  Your intuitive verdicts are governed by a compatibilist framework that equates freedom with **reasons-responsiveness and volitional harmony**, rather than metaphysical independence from causation.

  You are tracking whether a person's actions flow from a mechanism that can respond to evidence and arguments (reasons-responsiveness) and whether those actions align with the values and desires they endorse as their own (volitional harmony). The job deliberator is free because he responds to reasons and owns his decision. The brain tumor and OCD cases are unfree because the mechanism is broken (unable to respond to reasons like "this is irrational") and the urges are alien to the self (ego-dystonic). The bank teller is not blameable because external coercion overrides her volitional harmony, even if she responds to the reason "avoid death." The alcoholic is partially responsible because his mechanism still functions (he can attend rehab, cut down) but his volitional harmony is fractured (he hates the drinking yet does it).

  This principle clarifies your smoking case: you occupy the same moral space as the alcoholic. Because you were capable of cutting down and making attempts, you retained reasons-responsiveness, but because you were hiding the behavior and conflicting with your own desire to quit, you lacked full volitional harmony. You were not fully free, but you were not fully compelled; you bear mitigated responsibility, which explains why you feel guilt despite the difficulty of quitting.

  To maintain consistency, you must give up your ambivalence regarding the **cult member** and judge him **responsible**. Since you note he knows right from wrong in other areas of life, his reasons-responsiveness is intact. Unless the indoctrination destroyed his capacity to reason about abuse specifically, his alignment with cult values counts as volitional harmony, just as the job deliberator's values count even though they were shaped by a normal upbringing. If you treat the cult upbringing as freedom-undermining, you must logically treat the job deliberator's normal upbringing the same way, which contradicts your first verdict. Since you accept the job deliberator is free, you must accept that shaping influences (cult or normal) do not negate freedom unless they destroy the capacity to reason.

  The freedom worth having is not the metaphysical ability to have done otherwise in a deterministic universe, but the **agency to align your actions with your endorsed values and to respond to reasons**. This is the freedom that makes relationships, morality, and personal growth possible; it allows you to distinguish between a brother whose illness bypasses his agency (schizophrenia/tumor) and a habit that struggles against it (smoking/addiction), enabling you to blame the latter while compassionately treating the former.
