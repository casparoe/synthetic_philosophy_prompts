  3.  **Brainstorming Defeaters:**
      *   *Revenge Paradoxes:* The classic problem. If you define "just false" or "exclusion negation," can you construct a new liar using that?
      *   *Collapse/Triviality:* Does the recapture mechanism actually work without collapsing into triviality or classicality?
      *   *The Conditional:* Is the weakened conditional too weak to do the work of a conditional (e.g., modus ponens, deduction theorem)?
      *   *Normativity of Logic:* If contradictions can be true, how does logic guide belief/assertion? (The "assertability" problem).
      *   *Disagreement:* How do you disagree with someone if accepting $A$ and $\neg A$ is rational?
      *   *Empirical Bleed:* Can you really keep gluts confined to limits? (e.g., Sorites, vague boundaries affecting empirical claims).
