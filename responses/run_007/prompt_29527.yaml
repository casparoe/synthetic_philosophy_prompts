      *   Is the insulation a problem? For a theory of *limits*, some insulation is expected. But if it insulates against *logical* coherence, that's bad.
      *   Verdict: Well insulated but not unfalsifiable. The insulation is appropriate for a limit theory, provided it doesn't become ad hoc.

