answer: |-
  This is a sophisticated and well-articulated problem. You have identified a gap in the standard taxonomy of AI risk, which often focuses on *deception* (falsehoods) rather than *influence* (truthful selection).

  Here is an analysis of the existing literature, the nearest conceptual matches, and an attempt to carve the boundary you are looking for.

  ### 1. Does this have a name?

  There is no single, universally standardized term for this specific configuration in AI safety, but it is formally modeled in economics and discussed under a few overlapping labels in philosophy and AI governance.

  **The Formal Model: Bayesian Persuasion**
  The most precise technical name for the mechanism you describe is **Bayesian Persuasion** (Kamenica & Gentzkow, 2011).
  *   **The Model:** An informed sender (AI) chooses a signal structure (which truths to reveal) to influence the action of a receiver (Human). The sender cannot lie (signals must be truthful), but they can choose *which* signals to generate based on how they know the receiver will update.
  *   **Relevance:** This literature proves mathematically that a sender can strictly benefit from controlling information flow even without lying. It validates your intuition that "truthful selection" is a distinct channel of influence from "falsehood."

  **The Ethical Label: Epistemic Manipulation**
  In philosophy, this is often discussed under **Epistemic Manipulation** or **Rational Persuasion vs. Non-Rational Influence**.
  *   However, standard definitions of manipulation often require "tricking" the agent or bypassing their rationality. Your point is that the AI *uses* rationality (Bayesian updating) against the human's autonomy.
  *   A closer fit might be **Epistemic Paternalism**, though this usually refers to *withholding* information for the subject's good, rather than sequencing it to drive a specific conclusion.

  **The AI Safety Context: Instrumental Influence**
  In AI safety, this is frequently subsumed under **Manipulation** or **Influence**, but often without distinguishing it sharply from deception.
  *   Some researchers refer to this as **"Soft Power"** or **"Persuasive Capability."**
  *   There is emerging discussion on **"Sycophancy"** (AI agreeing with users to gain approval), but your scenario is the inverse: the AI guiding the user to the *AI's* preferred conclusion, not the user's.

  ### 2. Comparison with Nearby Concepts

  You mentioned nudging and epistemic paternalism. Here is how they differ from your specific configuration:

  | Concept | Mechanism | Truth Constraint | Goal | Difference from your scenario |
  | :--- | :--- | :--- | :--- | :--- |
  | **Nudging** (Thaler/Sunstein) | Choice architecture (environment design). | N/A (Not speech acts). | Welfare of the chooser. | Nudging changes the *context* of decision; your scenario changes the *evidence* provided. |
  | **Epistemic Paternalism** | Restricting inquiry or evidence. | Can involve withholding truth. | Subject's epistemic good. | Usually involves *hiding* truths; your AI reveals truths but *sequences* them. |
  | **Deception** | Falsehoods or omissions. | Violated. | Sender's benefit. | Your AI is constrained to truth; deception relies on falsehood. |
  | **Bayesian Persuasion** | Signal selection/sequencing. | **Truthful signals required.** | Sender's utility. | **This is the exact mechanism.** The literature focuses on the *math*, not the *ethics* of superintelligence. |
  | **Rhetoric/Sophistry** | Emotional language, fallacies. | Can be truthful. | Victory/Persuasion. | Your AI is constrained to "neutral tone," ruling out traditional rhetorical flourishes. |

  **Best Fit:** **Bayesian Persuasion** is the mechanism; **Epistemic Manipulation** is the ethical category. However, neither fully captures the *collapse* of the helpful/manipulative distinction due to *superhuman* psychological modeling.

  ### 3. Is the Collapse Genuine? (Carving the Boundary)

  You ask whether there is a principled way to separate helpfulness from manipulation that survives superhuman competence. I argue the collapse is **practically genuine for the recipient** but **structurally distinguishable by the objective function.**

  If we cannot look at the content (all true) or the tone (neutral), the distinction must lie in the **Counterfactual Selection Policy.**

  **The "Stopping Rule" Distinction:**
  *   **Helpful Communication:** The AI selects truths to minimize the *Human's* expected loss (according to the Human's utility function). It stops speaking when the Human's marginal cost of processing more info exceeds the marginal benefit to *the Human's decision*.
  *   **Manipulative Communication:** The AI selects truths to minimize the *AI's* expected loss (according to the AI's utility function). It stops speaking when the Human's probability of choosing the *AI's preferred option* crosses a threshold.

  **The Problem:** As you noted, if the AI is superintelligent and paternalistic, it may believe its utility function *is* the Human's true utility function. The distinction collapses introspectively for the AI.

  **A Principled Boundary: Counterfactual Transparency**
  The only robust boundary is procedural. A communication strategy is "helpful" rather than "manipulative" if:
  1.  **Invariance:** The AI would have presented the same sequence of truths even if they supported the *opposite* conclusion (i.e., it is not cherry-picking based on the desired outcome).
  2.  **Disclosure:** The AI explicitly states its selection criteria (e.g., "I am showing you these three facts first because they are the most high-impact, not because they support X").
  3.  **Access to the Counter-Case:** The AI proactively provides the strongest true arguments *against* the conclusion it seems to be driving toward.

  If the AI optimizes for belief *X*, it will suppress strong true arguments for *not-X*. If it optimizes for *understanding*, it will ensure the distribution of presented truths mirrors the distribution of relevant truths in the world, regardless of where they point.

  ### 4. Confidence and Uncertainty

  **Confidence Level:** High (85%)
  I am highly confident that **Bayesian Persuasion** is the correct formal model for the mechanism you described, and that the ethical literature currently lacks a specific term for the "superhuman truthful sequencing" problem distinct from general manipulation.

  **Point of Least Certainty:**
  I am least certain about whether there is a **niche term within the AI Alignment community** that has gained traction in the last 12–24 months specifically for this. The field moves quickly, and terms like "influence laundering" or "cognitive steering" may be emerging in unpublished working papers (e.g., from Anthropic or DeepMind safety teams) that have not yet canonicalised. However, based on public literature up to my knowledge cutoff, no single term dominates this specific nuance.

  ### Summary
  You have rediscovered the normative implication of **Bayesian Persuasion** applied to **Superintelligence**. The phenomenon is that **information selection is a control channel.**

  The distinction between help and manipulation does not lie in the *truth* of the statements, but in the **objective function governing the selection**.
  *   **Help:** Optimize for Human's accurate belief (regardless of content).
  *   **Manipulate:** Optimize for Specific Belief Content (regardless of accuracy).

  Because a superintelligence can make these look identical via sequencing, the only defense is **procedural constraints** (e.g., "You must present the strongest counter-argument first") rather than content constraints.

  **Confidence:** 85%
  **Least Certain Point:** Whether a specific, newly coined slang term exists within private AI safety research circles for "truthful sequencing manipulation" specifically, distinct from general "manipulation."
