          *   Option C: Change (4) to specify that process scoring must be based on *local formal properties* or *deferred outcome verification*, not immediate human semantic judgment.
          *   *Selection:* Option C is the most constructive. It preserves the safety constraints of (2) and (3) while making (4) operational.
          *   *Wait, looking at (2) again:* "Any supervisory signal ultimately has to bottom out in something a human can actually check." This is strong.
          *   *Looking at (4):* "...by scoring individual steps for soundness, honesty..." Soundness/Honesty are hard for humans to check directly without outcome verification (per 3).
          *   *Revision:* Modify (4) to acknowledge that step-scoring is a *proxy* that must be validated against outcome-based ground truth on a subset of tasks where outcomes *are* checkable (transfer learning). This resolves the (2) vs (4) tension.

      *   *Wait, let's look for the "Single Revision" that does the *most* work.*
