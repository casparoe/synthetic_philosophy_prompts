      *   If I revise (4) to say "It is possible... provided the step-scoring metric is validated on a proxy task where outcomes *are* verifiable," it satisfies (2).
      *   Alternatively, revise (2). "Any supervisory signal ultimately has to bottom out in something... verifiable." (Dropping "human can actually check" in favor of (5)'s "in principle"). But (3) implies humans are the bottleneck.
      *   *Best Revision:* Revise **(4)**. It is the claim of feasibility that contradicts the constraints of (2) and (3). It needs to explain *how* the scoring avoids the pitfalls of (2) and (3).
      *   *Specific Revision:* Change (4) to specify that step-scoring must rely on **local formal verifiability** (e.g., code compilation, unit tests, logical consistency) rather than semantic judgment, or be **bootstrapped from outcome-verifiable domains**.

