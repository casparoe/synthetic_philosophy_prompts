      *   *Better Revision:* Modify (2). (2) is too strict ("bottom out in something a human can actually check"). If we accept (5)'s "in principle," we can accept "distal" verification. But (4) says "cannot check at training time."
      *   *Best Revision:* Modify (4) to align with (2). Acknowledge that process supervision without *eventual* outcome grounding is risky, OR modify (2) to allow for "formal verifiability" rather than "human checkable."
      *   *Wait, look at (3).* (3) says "not optimize for human approval." (4) says "scoring individual steps." Who scores? If humans score, it violates (3). If formal tools score, it works.
