      *   *Most impactful revision:* Refine (4) to specify *how* steps are scored without triggering (3) or violating (2). Or, refine (2) to allow "verification by tool" rather than "check by human."
      *   *Actually, the strongest tension is (2) vs (4).* (2) says process reward *must* tie to outcome. (4) says we *do* process reward when outcome is uncheckable.
      *   *Recommendation:* Revise (4) to acknowledge that "scoring steps" is only valid if those scores are predictive of verifiable outcomes (even if delayed), or if the steps themselves are formally verifiable (math/code) rather than semantic (reasoning).

      *   *Wait, let's look closer at (5).* (5) defines truth as "verifiable in principle." This supports (2).
      *   *Let's look at (3).* (3) bans optimizing for human approval of reasoning.
      *   *Let's look at (4).* (4) proposes training on reasoning scores.
      *   *Conflict:* If humans provide the scores in (4), (3) is violated. If humans don't provide scores, who does? (2) says it must bottom out in human checkable.
      *   *Conclusion:* The set is incoherent regarding the **source of the process reward**.
      *   (2) requires human-checkable grounding.
