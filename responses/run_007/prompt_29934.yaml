answer: |-
  **Setting:** *A quiet corner of the university library, late afternoon. Mara is staring at a laptop screen showing a graph of declining union membership. Leo is stacking books.*

  **Mara:** You know why this graph looks like a ski jump? It's not because people stopped liking unions. It's Moloch.

  **Leo:** Moloch? You mean the Scott Alexander essay? The metaphorical god of coordination problems?

  **Mara:** Exactly. Look at this industry. If one company decides to pay workers 20% more, their costs go up. Their competitor doesn't. The competitor undercuts them, steals their market share, and the nice company goes bankrupt. So everyone stays low-wage. Not because they want to, but because if they don't, they die.

  **Leo:** I get the theory, Mara, but that's assuming a vacuum. In the real world, we have labor laws. Minimum wages, safety regulations, anti-trust stuff. We built institutions specifically to stop that race to the bottom.

  **Mara:** Institutions are leaky. You have laws in California, but the factory moves to Vietnam. You have regulations in the West, but the supply chain hides the abuse in the third tier of subcontractors. Moloch doesn't respect borders. As long as there's *somewhere* with weaker rules, competition pushes capital there.

  **Leo:** But that's changing. Consumers care now. Look at the rise of ESG investing, fair-trade certification, brand reputation. If a company gets caught abusing workers, their stock tanks. That's a market incentive *against* the race to the bottom. It's not just laws; it's culture.

  **Mara:** Culture is a luxury good. It works when margins are fat and the economy is booming. But the moment there's a recession, or a supply chain crisis, price becomes the only thing that matters. People say they want ethical goods, but when they're broke, they buy the cheap thing. Moloch wins when people are desperate.

  **Leo:** That's too cynical. Innovation breaks the zero-sum game. You're assuming the pie is fixed, so the only way to win is to cut costs. But technology makes production cheaper *without* cutting wages. Automation, AI, efficiency gains—they expand the pie so everyone can eat more.

  **Mara:** Or they make the workers redundant. But even if they don't, look at gig work. Technology made delivery faster, sure, but it also enabled algorithmic management that squeezes drivers harder than any human boss could. The trap adapts. Every time we build a cage for Moloch, he grows new limbs to slip through the bars.

  **Leo:** So your solution is what? Global coordination? A single world government to enforce standards? Because that's not happening anytime soon.

  **Mara:** I'm not saying it's easy. I'm saying that without it, the default trajectory is degradation. We might slow it down with laws, but the pressure is always downward. It's entropy.

  **Leo:** But history shows the opposite trajectory. Overall, wages are up, child labor is down, life expectancy is up. If Moloch was unstoppable, the 20th century should have looked like a Dickens novel forever. Instead, we got the middle class.

  **Mara:** We got the middle class in the countries that won the geopolitical game, often by externalizing the cost to the ones that didn't. And now that globalization is complete, the pressure is back. You say institutions tame competition, but institutions are slow. Markets are fast. By the time regulators understand a new problem—like AI displacement or crypto scams—the damage is done.

  **Leo:** Institutions are slow, but they're sticky. Once you have a norm, it's hard to break. You don't see companies openly advocating for child labor anymore. That's a victory. We don't need perfect coordination; we just need enough friction to make the race to the bottom too costly.

  **Mara:** Friction wears down. That's my point. The pressure is constant. The relief is temporary. We're running on a treadmill that keeps speeding up, and you're telling me to be happy because we haven't fallen off *yet*.

  **Leo:** I'm telling you that we've learned how to adjust the speed. We're not helpless. Competition drives the innovation that gives us the resources to build better institutions. It's a feedback loop, not a death spiral.

  **Mara:** I hope you're right, Leo. But I think you're betting on our ability to coordinate faster than our ability to compete. And historically, competition is much faster.

  **Leo:** Then we'd better get faster. Because opting out of competition isn't an option either. Stagnation is its own kind of trap.

