prompt: |-
  I am working through James Clerk Maxwell’s *Theory of Heat* and have found myself stuck on the passage in which he introduces the little being that later came to be called Maxwell’s demon. I think I understand the mechanical setup, but I want to be sure I am following the philosophical and physical point. He writes:

  One of the best established facts in thermodynamics is that it is impossible in a system enclosed in an envelope which permits neither change of volume nor passage of heat, and in which both the temperature and the pressure are every where the same, to produce any inequality of temperature or of pressure without the expenditure of work. This is the second law of thermodynamics, and it is undoubtedly true as long as we can deal with bodies only in mass, and have no power of perceiving or handling the separate molecules of which they are made up.

  But if we conceive of a being whose faculties are so sharpened that he can follow every molecule in its course, such a being, whose attributes are as essentially finite as our own, would be able to do what is impossible to us. For we have seen that molecules in a vessel full of air at uniform temperature are moving with velocities by no means uniform, though the mean velocity of any great number of them, arbitrarily selected, is almost exactly uniform.

  Now let us suppose that such a vessel is divided into two portions, A and B, by a division in which there is a small hole, and that a being, who can see the individual molecules, opens and closes this hole, so as to allow only the swifter molecules to pass from A to B, and only the slower molecules to pass from B to A. He will thus, without expenditure of work, raise the temperature of B and lower that of A, in contradiction to the second law of thermodynamics.

  My confusion is this. Maxwell begins by calling the second law “undoubtedly true” as long as we deal with bodies only in mass, then immediately describes a being who violates it without expenditure of work. Is he claiming that the second law is therefore false, or that it is true only relative to certain capacities, or something else? I am also unsure what the phrase “whose attributes are as essentially finite as our own” is meant to rule out. The being is not a god, but it can perceive and handle individual molecules; why does that finiteness matter for the example? Finally, what exactly is the target of the “impossible to us”? Is it a physical impossibility or a practical limitation of our senses and instruments? I would like help reconstructing what Maxwell takes himself to be showing here, and understanding whether the thought experiment is best read as a refutation of the second law, a clarification of its statistical character, or an argument that thermodynamic impossibility depends on the kind of agent involved. I would prefer to understand the passage on its own terms before getting into the later information-theoretic readings.
reasoning: |-
  Here's a thinking process that leads to the suggested explanation:

