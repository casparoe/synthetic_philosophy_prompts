      *   *Focus:* Keep the focus on the *definition* of the Second Law. Maxwell is arguing that the Second Law is a law about *our interaction* with matter, not just about matter itself.
      *   *Clarification on "Finite":* Make sure to explain that "finite" means the being doesn't have infinite speed or strength, just finite senses sharpened to the molecular scale. It prevents the objection: "Well, an angel could do anything." Maxwell says, "No, even a finite being with *these specific senses* could do this."

