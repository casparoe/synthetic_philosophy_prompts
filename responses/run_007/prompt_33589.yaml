answer: |-
  Your instinct is correct. The summary you found captures the *spirit* of Anscombe's outrage but distorts the *structure* of her argument. It turns a rigorous philosophical and legal critique into a sectarian religious objection. This matters because Anscombe's point was precisely that the judgment against Truman should be binding on *everyone*, not just Catholics.

  Here is an audit of the summary, claim by claim.

  ### Claim 1: "Anscombe's position was that Truman was a mass murderer."
  **Verdict: Accept.**
  Anscombe does not mince words. In her pamphlet *Mr. Truman's Degree*, she explicitly argues that the bombing of Hiroshima and Nagasaki constituted the murder of innocents. She contends that honoring a man guilty of such acts corrupts the university and violates the principles of justice. She does not use euphemisms like "collateral damage" or "tragic necessity"; she classifies the act as a capital crime.

  ### Claim 2: "The argument is straightforward: dropping atomic bombs on Hiroshima and Nagasaki killed hundreds of thousands of civilians, and intentionally killing civilians is murder."
  **Verdict: Wince.**
  This flattens Anscombe's most significant philosophical contribution. For Anscombe, the argument is not "civilians died, therefore it is murder." The argument hinges entirely on the **description of the action** and the **nature of intention**.
  Anscombe spends considerable energy distinguishing between *foreseeing* a death and *intending* a death. A utilitarian might argue Truman foresaw the deaths but intended the surrender. Anscombe argues that because the destruction of the cities *was* the method used to force surrender, the death of the civilians was intended, not merely foreseen. Calling this "straightforward" ignores the heavy lifting she does to define what it means to "intend" an outcome in moral philosophy. It wasn't a simple body count; it was an analysis of the will.

  ### Claim 3: "Since she was a devout Catholic, she appealed to the doctrine of double effect..."
  **Verdict: Wrong.**
  This is the most significant distortion in the summary, and it validates your suspicion. While Anscombe was a Catholic and the Doctrine of Double Effect (DDE) is central to her ethical system, **she does not ground this specific argument in Catholic theology.**
  In *Mr. Truman's Degree*, Anscombe appeals to the **principles of justice established at the Nuremberg Trials**, not to Church doctrine. Her argument is that the Allies established a universal legal and moral precedent at Nuremberg: that killing innocents is a war crime, regardless of the military objective. She argues that *anyone* who accepted the legitimacy of Nuremberg is logically committed to condemning Truman.
  By framing her appeal as Catholic, the summary implies her argument is internal to a specific faith community. Anscombe's point was that it is internal to *civilization* and *law*. She uses the *logic* of the DDE (intention vs. side effect), but she wields it as a philosopher of law, not as a theologian appealing to authority.

  ### Claim 4: "...you can't do evil that good may come of it, and the civilian deaths were the means to the end of forcing Japan's surrender, not an unintended side effect of hitting a military target."
  **Verdict: Accept.**
  This accurately captures her analysis of the action's structure. Anscombe argues that the terrorization of the civilian population was not an accidental byproduct of hitting a factory; it was the *mechanism* of victory. If the mechanism of victory is the destruction of the innocent, then the destruction of the innocent is intended. She rejects the consequentialist calculus that the "good end" (ending the war) justifies the "evil means" (mass killing of non-combatants).

  ### Claim 5: "The bombs were dropped on cities, after all."
  **Verdict: Accept.**
  This is the factual premise she relies upon to support Claim 4. She emphasizes that the targets were population centers, which supports the claim that the intention was the destruction of the civilian populace (or at least their morale via destruction), rather than a precise strike on a military installation where civilian death would be a true side effect.

  ### Claim 6: "So on her view, Truman was morally equivalent to the Nazi leaders we'd just finished hanging at Nuremberg for the same thing..."
  **Verdict: Accept.**
  Anscombe explicitly draws this parallel. She writes that by the standards of the Nuremberg judgment, Truman is a war criminal. She does not necessarily argue that he should have been hunted down and hanged in 1956 (political realities being what they were), but she insists that his **guilt** is of the same kind and degree as the Nazis'. She argues that failing to recognize this equivalence is a failure of moral logic. The summary is accurate here: she posits a moral equivalence based on the violation of the same principle.

  ### Claim 7: "The fact that we don't see it that way, she argued, just shows that our moral judgments are contaminated by national self-interest and winner's bias."
  **Verdict: Accept.**
  Anscombe argues that the refusal to condemn Truman is a symptom of "consequentialism"—the idea that the outcome justifies the means—which she believed had corrupted modern moral philosophy. She attributes this corruption to national pride and the bias of the victors. She famously noted that if the Germans had won and bombed British cities, we would not hesitate to call it a crime. Her protest was intended to expose this hypocrisy.

  ### Summary of the Audit
  The popular summary gets Anscombe's **conclusions** right but misrepresents her **warrant**.

  *   **What it gets right:** She called Truman a murderer, she relied on the distinction between means and side effects, she compared him to the Nazis, and she blamed national bias for the lack of outrage.
  *   **What it gets wrong:** It treats her argument as a religious objection ("Since she was a Catholic...") rather than a demand for legal and philosophical consistency. It suggests she appealed to Catholic authority, when she actually appealed to the Nuremberg Principles that the secular world claimed to accept.
  *   **What it flattens:** It ignores her nuanced work on the philosophy of action (intention), making her argument seem like a simple tally of bodies rather than a complex analysis of the will.

  **Final Position:** The summary is a **caricature**. It makes Anscombe look like a religious zealot protesting a political decision, whereas she was actually a philosopher of law and action protesting a contradiction in the secular world's own moral framework. Your unease regarding the role of her Catholicism in the summary is well-founded; the summary uses her faith to explain her argument, whereas Anscombe used her argument to challenge the world regardless of faith.
