answer: |-
  # Seminar Handout: Mapping the Metaphysics of Dispositions

  ## Part 1: The Logical Space
  Before using the tree, note that the positions below are divided by three core metaphysical commitments:
  1.  **Analysis:** Are disposition ascriptions equivalent to conditional statements (SCA), or do they refer to real properties?
  2.  **Grounding:** If they are real properties, are they grounded in distinct "categorical" (non-dispositional) bases, or are they fundamental?
  3.  **Modality:** Is the connection between a disposition and its manifestation contingent (governed by laws) or necessary (grounding the laws)?

  ## Part 2: The Decision Tree
  *Start at the top. Answer the questions based on your intuition about the case described. Follow the arrows to your position.*

  ### **NODE 1: The Finkish Glass**
  **Case:** You have a glass that is structurally identical to a normal fragile glass. However, it is wired to a "Fink-device." The instant the glass is struck, the device scans the impact and magically alters the glass's molecular structure so that it becomes non-fragile *before* the impact lands. The glass does not break.
  **Question:** Was the glass **fragile** immediately *before* it was struck?

  *   **NO:** (It wasn't fragile, because it wouldn't have broken if struck.)
      *   → Go to **NODE 2**.
  *   **YES:** (It was fragile; the device interfered with the manifestation.)
      *   → Go to **NODE 3**.

  ---

  ### **NODE 2: The Masked Poison (SCA Branch)**
  **Case:** A poison is mixed with an antidote (a mask). The mixture does not kill. A defender of the "No" answer at Node 1 claims disposition ascriptions are just conditionals ("If struck, it breaks").
  **Question:** To save the conditional analysis, must we say the poison **lost** its disposition when mixed, or that the conditional must be restricted to **"standard conditions"**?

  *   **Lost it:** (The disposition is gone, so the conditional is false, so it wasn't disposed.)
      *   → 🍂 **LEAF 1: Naive Simple Conditional Analysis.**
  *   **Restricted Conditions:** (It still has the disposition, but the conditional is only true in "normal" contexts without antidotes.)
      *   → 🍂 **LEAF 2: Contextual/Sophisticated SCA.**

  ---

  ### **NODE 3: The Antidote (Intrinsicness Branch)**
  **Case:** (Returning to the "YES" at Node 1). You have a lethal poison. You mix it with an antidote. It no longer kills.
  **Question:** Did the poison **lose** its causal power to kill, or did it **retain** the power but was prevented from exercising it?

  *   **Lost it:** (The power depends on the extrinsic context; without the right context, the power doesn't exist.)
      *   → 🍂 **LEAF 3: Extrinsic Dispositionalism.**
  *   **Retained it:** (The power is intrinsic to the poison; the antidote merely blocks it.)
      *   → Go to **NODE 4**.

  ---

  ### **NODE 4: The Molecular Structure (Grounding Branch)**
  **Case:** Consider the intrinsic fragility of the glass. We know it has a specific molecular structure (the categorical base).
  **Question:** Is the fragility **something over and above** the molecular structure, or is it **nothing but** the structure behaving thusly?

  *   **Nothing But:** (There is no extra "disposition property"; there is only the structure.)
      *   → Go to **NODE 5**.
  *   **Something Over and Above:** (The structure grounds a distinct, second-order disposition property.)
      *   → Go to **NODE 6**.

  ---

  ### **NODE 5: The Reduction (Categorical Branch)**
  **Case:** You believe fragility is "nothing but" the molecular structure.
  **Question:** Is the molecular structure itself a **categorical** property that requires a **law of nature** to produce breaking, or is the structure **identical** to the power to break?

  *   **Categorical + Law:** (The structure is inert; laws of nature make it cause breaking. Disposition talk is just shorthand.)
      *   → 🍂 **LEAF 4: Humean Reductionism.**
  *   **Identical:** (The structure *is* the power. One property, two descriptions.)
      *   → 🍂 **LEAF 5: The Identity Theory (Limit View).**

  ---

  ### **NODE 6: The Law of Nature (Realist Branch)**
  **Case:** You believe fragility is a distinct property grounded in the structure.
  **Question:** Could the molecular structure exist in a world with **different laws of nature** where it does *not* cause breaking?

  *   **YES:** (The connection is contingent. The structure needs a law to link it to breaking.)
      *   → 🍂 **LEAF 6: The Lewisian Causal Basis View.**
  *   **NO:** (The structure *necessitates* the breaking. The power is essential to the property.)
      *   → Go to **NODE 7**.

  ---

  ### **NODE 7: The Source of Laws (Power Ontology Branch)**
  **Case:** You believe the connection between property and manifestation is necessary.
  **Question:** Do these necessary connections **constitute** the laws of nature, or do the powers exist alongside **external regularities** we call laws?

  *   **Constitute Laws:** (The powers themselves ground the laws. There are no "laws" over and above the powers.)
      *   → 🍂 **LEAF 7: Dispositional Essentialism.**
  *   **External Regularities:** (Powers are fundamental, but "laws" are just descriptions of how they consistently behave.)
      *   → 🍂 **LEAF 8: Pure Powers Ontology (Regularity Version).**

  ---

  ## Part 3: Position Summaries (The Leaves)

  1.  **Naive SCA:** Disposition ascriptions are equivalent to simple counterfactual conditionals. (Refuted by Fink cases).
  2.  **Contextual SCA:** Disposition ascriptions are conditionals restricted to "normal" or "standard" conditions. (Saves SCA from Finks/Masks).
  3.  **Extrinsic Dispositionalism:** Dispositions are not intrinsic; they depend on the environment (e.g., an antidote removes the power).
  4.  **Humean Reductionism:** Dispositions are not real properties. They reduce to categorical properties plus contingent laws of nature.
  5.  **The Identity Theory:** Dispositions and categorical bases are not distinct properties; they are one and the same property described in two ways.
  6.  **Lewisian Causal Basis:** Dispositions are real, distinct (second-order) properties, but they are grounded in categorical bases and contingent laws.
  7.  **Dispositional Essentialism:** Properties are essentially powerful; their necessary manifestations ground the laws of nature.
  8.  **Pure Powers Ontology:** All properties are powers, but laws may be viewed as external regularities rather than grounded by the powers.

  ---

  ## Part 4: Critical Flags

  ### ⚠️ Undefended Combinations
  *   **Naive SCA + Intrinsic Dispositions:** If you answer "No" at Node 1 (Naive SCA) but "Retained it" at Node 3 (Intrinsic), you hold an incoherent position. If the conditional is false (due to the Fink), the Naive SCA says the disposition is absent. If the disposition is intrinsic, the Fink (an extrinsic interferer) cannot remove it. *Status: Incoherent.*
  *   **Distinct Property + Categorical Base + Necessary Connection:** If you answer "Something Over and Above" (Node 4) but "NO" to contingent laws (Node 6), you posit a distinct disposition property that is necessarily connected to its categorical base. Most philosophers find this ontologically profligate: if the connection is necessary, why posit two properties instead of one (Identity Theory)? *Status: Unattractive/Unexplored.*

  ### ⚠️ Indistinguishable Positions
  *   **Lewisian Causal Basis (Leaf 6) vs. Humean Reductionism (Leaf 4):**
      *   *The Problem:* Both views accept Categorical Bases + Contingent Laws. They agree on all physical predictions.
      *   *The Difference:* Lewis thinks "Fragility" refers to a real second-order property. The Humean Reductionist thinks "Fragility" is just a convenient name for the Base+Law combination.
      *   *Splitting Case:* **Causal Overdetermination.** Ask: "When the glass breaks, is it caused by the *structure* alone, or by the *structure plus the disposition property*?" Lewis says Structure (the disposition is causally idle). The Reductionist says the Disposition doesn't exist to cause anything. To split them, you need a case about **Ontological Parsimony**: "Does the universe contain more properties than just the categorical base?"
  *   **Dispositional Essentialism (Leaf 7) vs. Pure Powers (Leaf 8):**
      *   *The Problem:* Both deny categorical bases and claim properties are powerful.
      *   *The Difference:* The status of "Laws." Bird (DE) says powers *are* the laws. Some Pure Power theorists say powers exist and laws are just summaries.
      *   *Splitting Case:* **The Empty World.** Ask: "In a world with one single electron and nothing else, do the 'Laws of Electromagnetism' exist?" DE says Yes (grounded in the electron's essence). Regularity Powerism says No (no regularities to ground them).
