answer: |-
  **Decision Tree: Authority of Advance Directives in Dementia**

  *Case: Competent A refused treatment if demented. Demented A is content but needs antibiotics.*

  **1. Does the prior competent refusal automatically override the current self's apparent contentment?**
  *   **Yes:** (Honor AD). Go to 2.
  *   **No:** (Consider current status). Go to 3.

  **2. Is the binding force based on the right to shape one's life narrative?**
  *   **Yes:** **Precedent-Autonomy View**.
  *   **No:** **Ulysses-Contract View** (Binding pre-commitment).

  **3. Is the current self's experienced happiness the sole moral currency?**
  *   **Yes:** **Current-Interests View**.
  *   **No:** Go to 4.

  **4. Does the AD's clarity increase its authority over objective welfare?**
  *   **Yes:** **Sliding-Scale View**.
  *   **No:** **Best-Interests View** (Standard objective welfare).

  ***

  **Seminar Notes**

  **Converging Positions**
  *   **Precedent-Autonomy & Ulysses-Contract:** This tree separates them by *justification* (narrative integrity vs. commitment enforcement), but they converge on the *outcome* for this case (honor the AD). In practice, these positions are often indistinguishable in dementia scenarios.
  *   **Current-Interests & Best-Interests:** Both likely recommend treatment here (A is content; antibiotics are low-burden). They differ theoretically on whether objective goods matter beyond experienced happiness.

  **Unoccupied Logical Space**
  *   **"Follow AD Only if Current Self Suffers":** This logical leaf ( Honor AD → No → Treat unless suffering) is unoccupied. It is incoherent: if the current self refuses treatment due to suffering, standard consent rules apply without needing an AD.
  *   **"Ignore Clear AD Without Welfare Gain":** A position rejecting the AD despite clear evidence and no objective benefit to overriding it is ethically unattractive and legally unsupported.

  **Usage**
  Students should answer based on their intuitive judgment of the *reasons* for their choice, not the desired outcome. Note that Q2 requires distinguishing between valuing the *story* of a life versus valuing *promise-keeping*.
