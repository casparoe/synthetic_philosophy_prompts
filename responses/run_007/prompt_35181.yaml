answer: |-
  This is a sophisticated diagnostic of the field. You are correct that the literature often proceeds by championing a specific definition (e.g., autopoiesis, NASA's working definition, Darwinian dynamics) without first auditing the conflicting demands placed upon the concept. The "definition of life" debate is less a search for a single truth and more a negotiation between incompatible disciplinary utilities.

  Below is a curated list of eight desiderata. I have categorized them by their philosophical status: **Formal Constraints** (non-negotiable conditions for any coherent definition), **Metaphysical Constraints** (claims about the nature of the category), and **Pragmatic Constraints** (utilities for specific research programs). Following the list, I analyze the incompatibilities and identify the specific borderline cases that generate the most friction.

  ### The Desiderata List

  #### 1. Non-Circularity (Formal Constraint)
  *   **Motivation:** A definition cannot presuppose the concept it defines. Many proposed definitions fail here by smuggling in biological terms (e.g., defining life as "the capacity for *biological* evolution" or "ability to *reproduce*," where reproduction is already understood biologically).
  *   **Status:** **Non-Negotiable.** If a definition is circular, it is explanatorily vacuous. It may serve as a heuristic, but not as a philosophical or scientific definition.

  #### 2. Normativity (Formal Constraint)
  *   **Motivation:** Living systems are characterized by the distinction between function and malfunction. A heart *ought* to pump; a mutation *ought* to be repaired. Mere physical systems (like flames or crystals) do not have normative states; they simply obey physical laws. A definition of life must account for the possibility of a living thing failing to be what it is supposed to be.
  *   **Status:** **Non-Negotiable.** Without normativity, you are defining a physical process, not a biological entity. This distinguishes biology from complex chemistry.

  #### 3. Extensional Adequacy (Metaphysical Constraint)
  *   **Motivation:** The definition should classify paradigm cases of Earth life (humans, bacteria, oak trees) as "alive" and paradigm non-life (rocks, fire, cars) as "non-living." It respects our pre-theoretic intuitions and ensures the definition is actually about the phenomenon we care about.
  *   **Status:** **Parochial/Contested.** While traditionally viewed as essential, philosophers like Carol Cleland argue this is a mistake. If "life" is a natural kind, our intuitions might be wrong (just as our intuition that "whales are fish" was wrong). Prioritizing this locks us into Earth-centric bias.

  #### 4. Natural Kindhood (Metaphysical Constraint)
  *   **Motivation:** The category "life" should carve nature at its joints. There should be a unified underlying causal mechanism or property shared by all living things, rather than a loose cluster of family resemblances. This allows for robust inductive inferences and law-like generalizations.
  *   **Status:** **Parochial/Metaphysical.** This is a requirement for those seeking a unified theory of biology (e.g., Schrödinger, Mayr). However, if life is a historical lineage or a continuum, this desideratum may be impossible to meet. Eliminitivists (like Edouard Machery) argue "life" is not a natural kind and should be discarded.

  #### 5. Substrate Neutrality (Pragmatic Constraint)
  *   **Motivation:** The definition must not rely on specific Earth chemistry (e.g., DNA, proteins, carbon). It must be functional or structural so that it can recognize silicon-based life, synthetic xenobiology, or digital life.
  *   **Status:** **Parochial/Universalist.** This is crucial for theoretical biology and origins-of-life research but often conflicts with Extensional Adequacy. If you make the definition too abstract to capture all possible life, you risk including non-living complex systems (like hurricanes or economies).

  #### 6. Operationalizability (Pragmatic Constraint)
  *   **Motivation:** The definition must provide criteria that can be empirically tested in a single observation or experiment. You must be able to look at a sample and decide "yes" or "no."
  *   **Status:** **Parochial/Astrobiology.** This is the primary demand of NASA and astrobiologists. However, it conflicts with definitions based on history or evolution, which require observing a lineage over generations. You cannot "observe" evolution in a static rock sample.

  #### 7. Evolutionary Capacity (Metaphysical/Pragmatic Constraint)
  *   **Motivation:** Life must be capable of open-ended Darwinian evolution (variation, heredity, selection). This captures the dynamic, historical nature of biology and explains adaptation and complexity.
  *   **Status:** **Competing Priority.** This is the core of the "Darwinian" definition (Bedau, Dawkins). However, it struggles with individual organisms that cannot evolve (sterile mules) or populations that are evolutionarily static. It defines the *process* of life, not necessarily the *state* of an individual.

  #### 8. Organizational Closure (Metaphysical/Pragmatic Constraint)
  *   **Motivation:** Living systems must be distinct from their environment, maintaining a boundary and self-producing their own components (autopoiesis). This captures the individuality and metabolic independence of organisms.
  *   **Status:** **Competing Priority.** This is the core of the "Metabolic" definition (Varela, Ruiz-Mirazo). It handles individual organisms well but struggles with entities that lack metabolic boundaries but clearly participate in biological history (viruses).

  ---

  ### The Incompatibilities: Where the Desiderata Clash

  The central problem in the literature is that these desiderata form a set of **trilemmas**. You can satisfy subsets of them, but satisfying the whole set is plausibly impossible. Here are the three sharpest tensions:

  #### 1. The Extensional vs. Neutrality Tension
  *   **The Conflict:** If you prioritize **Extensional Adequacy** (matching Earth intuitions), you tend to bake Earth-chemistry into the definition (e.g., requiring cell membranes or specific polymers), violating **Substrate Neutrality**. If you prioritize **Substrate Neutrality** (to allow for alien life), you must abstract to high-level functions (e.g., "self-replication"), which often violates **Extensional Adequacy** by including non-living self-replicating systems (like crystals or computer viruses).
  *   **The Result:** You must choose between a definition that is accurate for Earth but parochial, or universal but over-inclusive.

  #### 2. The Operational vs. Evolutionary Tension
  *   **The Conflict:** **Operationalizability** demands a snapshot test (e.g., "does it metabolize right now?"). **Evolutionary Capacity** demands a historical trajectory (e.g., "does it have heritable variation over time?").
  *   **The Result:** An astrobiologist on Mars cannot wait 1,000 generations to see if a sample evolves. They need a metabolic signature. But a metabolic signature (like a flame) is not alive. A definition that is operationalizable often fails to distinguish life from complex chemistry; a definition that is evolutionarily robust is often untestable in practice.

  #### 3. The Individual vs. Lineage Tension (Organizational vs. Evolutionary)
  *   **The Conflict:** **Organizational Closure** defines the *individual* organism (the here-and-now system). **Evolutionary Capacity** defines the *lineage* (the historical population).
  *   **The Result:** This is where specific biological cases break the definitions. An individual organism (a mule) is alive but has no evolutionary capacity. A virus has evolutionary capacity (in population) but no organizational closure (no metabolism). A definition focusing on one excludes the other.

  ---

  ### The Wedge Case: Viruses and Cryptobiosis

  If you need a single class of cases to expose these tensions, it is **Viruses**, specifically when considered alongside **Cryptobiotic Organisms** (e.g., frozen tardigrades or bacterial endospores).

  **Why Viruses are the Primary Wedge:**
  Viruses force a choice between **Desideratum 7 (Evolutionary Capacity)** and **Desideratum 8 (Organizational Closure)**.
  *   **Metabolic/Autopoietic Definitions:** Viruses fail because they lack metabolic closure. They do not produce their own components; they hijack a host. *Verdict: Non-living.*
  *   **Darwinian/Evolutionary Definitions:** Viruses succeed because they replicate, mutate, and undergo selection. *Verdict: Living.*
  *   **The Tension:** If you define life by metabolism to exclude viruses, you risk excluding obligate intracellular bacteria (like *Rickettsia*), which are metabolically dependent and borderline parasitic, yet universally considered alive. If you define life by evolution to include viruses, you risk including transposons or prions, which replicate and evolve but are often considered "genetic elements" rather than organisms.

  **Why Cryptobiosis Compounds the Problem:**
  Frozen tardigrades or bacterial spores expose the tension between **Desideratum 6 (Operationalizability)** and **Desideratum 2 (Normativity/Function)**.
  *   In a cryptobiotic state, metabolism ceases entirely. There is no energy flow, no homeostasis, and no activity.
  *   **Operational Test:** If you scan a frozen tardigrade, it looks like a complex crystal. It fails metabolic tests.
  *   **Intuition:** We insist it is *alive*, merely dormant.
  *   **The Implication:** This suggests life is a *dispositional* property (the potential to function) rather than an *occurrent* property (current functioning). But if life is dispositional, how do you distinguish a dormant spore from a dead one without waiting to see if it wakes up? This undermines **Operationalizability**.

  **Has any definition finessed this?**
  Not successfully.
  *   **NASA's Definition** ("self-sustaining chemical system capable of Darwinian evolution") attempts to bridge the gap by using "capable of." This handles dormancy (it is *capable*) and viruses (they are *capable* in a host). However, it fails **Operationalizability** (how do you test "capability" in a single snapshot?) and **Substrate Neutrality** (it specifies "chemical").
  *   **Pluralism:** The most honest philosophical position (championed by Machery and others) is that there is no single definition. "Life" is a cluster concept. We use a metabolic definition for physiology, an evolutionary definition for phylogeny, and a historical definition for origins of life. However, this fails the **Natural Kindhood** desideratum, admitting that "life" does not carve nature at its joints.

  ### Recommendation for Your Research

  Given your goal to step back and evaluate criteria:

  1.  **Reject the "One Definition" Assumption:** Your most significant contribution may be to argue that the search for a single definition is a category error. The tensions above suggest "life" functions as a *family resemblance* concept in practice, despite metaphysicians wanting it to be a *natural kind*.
  2.  **Focus on the "Work" the Definition Does:** Instead of asking "What is life?", ask "What definition is required for *this* specific problem?" (e.g., detecting life on Mars requires Operationalizability; understanding the origin of life requires Substrate Neutrality).
  3.  **The Mule/Virus Pincer:** Use the sterile organism (Mule) and the non-metabolic replicator (Virus) as your primary test cases. Any definition that claims to be universal must explicitly state why it excludes one or includes the other, and justify that exclusion based on the desiderata above.

  The literature often hides these trade-offs. Making them explicit—showing that satisfying **Natural Kindhood** often requires sacrificing **Extensional Adequacy**—is a viable and necessary philosophical project.
