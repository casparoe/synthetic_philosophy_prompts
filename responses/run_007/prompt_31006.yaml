      *   **The Paradox (15 mins):** Define $R$. Ask the question. Derive contradiction.
      *   **The Implications (10 mins):** Why this isn't just a trick. It kills Naive Comprehension. (Head off Misconception 2 & 3).
      *   **Conclusion/Assessment (10 mins):** The Question.

