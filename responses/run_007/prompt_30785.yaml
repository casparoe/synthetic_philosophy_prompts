  Combination: Product $(i \times ii \times iii \times iv) \approx 0.60$, representing the joint probability of conditions necessary for self-undermining.

  Sensitivity: Term (ii).
  Moving Evidence: A robust account of reliable covariation securing content without causal efficacy.
  Likely Failure: Assuming causal history is necessary rather than sufficient for justification.

  This estimate reflects the significant but not decisive force of the causal objection. The multiplicative model assumes independence among the conditions required for the self-undermining argument to succeed. Term (ii) carries the most uncertainty because physicalists often propose complex structural mappings between neural states and reports that bypass direct qualia causation. If such mappings preserve content reliability, justification survives epiphenomenalism. The estimate fails if externalist reliabilism proves that causal contact with the truth-maker is unnecessary for justification, relying instead on process reliability alone. This would collapse term (i) significantly, lowering the overall credence. Conversely, if causal theories are vindicated as strictly necessary, term (i) approaches 1.0, raising the overall credence. The high value of (iii) is secure by definition, while (iv) rests on anti-skeptical defaults. The primary vulnerability remains whether non-causal covariance can sustain the specific content of phenomenal reports.
