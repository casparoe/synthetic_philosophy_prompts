answer: |-
  # Decision Tree: The Zombie Argument and Physicalism

  **Instructions:** Begin at the **Opening Question**. Follow the path that best matches your intuitive judgment about the scenario and the reasoning. Answer each node based on what you take to be true, not on which philosophical label you recognize. The endpoints (Leaves) identify the position your answers commit you to, along with the most challenging implication of that view.

  ***

  ### Opening Question
  **Suppose we had a complete physical and functional description of a human being (every atom, every causal process). Does this description fully settle what it is like to be that human, or does a further question about their subjective experience remain intelligible?**

  *   **A.** It fully settles it. A being with that physical description *must* have that specific experience; no further question is possible. *(Go to Node 1)*
  *   **B.** A further question remains. It seems intelligible to ask, "Yes, but what is it like to be them?" even knowing all the physical facts. *(Go to Node 2)*

  ***

  ### Node 1 (No Explanatory Gap)
  **You hold that physical facts fix experiential facts. Is the subjective feeling of experience a real feature of the world, or is it a cognitive illusion?**

  *   **A.** It is real. The physical/functional description captures everything real about experience. *(Leaf 1)*
  *   **B.** It is an illusion. There is no actual "what it is like," only a mistaken belief that there is. *(Leaf 2)*

  ***

  ### Node 2 (Explanatory Gap Exists)
  **You hold that a gap exists between physical facts and experience. Does the ability to clearly conceive of a "zombie" (a physical duplicate with no experience) prove that such a being is metaphysically possible?**

  *   **A.** Yes. If we can conceive it without contradiction after careful reflection, it could exist in reality. *(Go to Node 3)*
  *   **B.** No. We can conceive it, but it is metaphysically impossible; the gap is misleading. *(Go to Node 4)*
  *   **C.** We cannot know. Human cognitive limits prevent us from determining if the conceivability implies possibility. *(Leaf 9)*

  ***

  ### Node 3 (Zombies are Possible → Non-Physicalism)
  **If zombies are possible, experience is not fixed by standard physical structure. Is consciousness a separate addition to the physical world, or is it the inner nature of the physical world itself?**

  *   **A.** Separate addition. Consciousness is a distinct property or substance over and above the physical structure. *(Go to Node 5)*
  *   **B.** Inner nature. The physical description only captures structure; consciousness is the intrinsic quality of that structure. *(Leaf 6)*
  *   **C.** Neither. Consciousness is still physical, despite the possibility of zombies. *(Leaf 10)*

  ***

  ### Node 4 (Zombies are Impossible → Physicalism with Gap)
  **If zombies are impossible despite the gap, is this gap due to limits of our current knowledge that could be overcome?**

  *   **A.** Yes. Future science or cognitive expansion will close the gap and explain why experience must arise. *(Leaf 3)*
  *   **B.** No. The gap is permanent. *(Go to Node 6)*

  ***

  ### Node 5 (Separate Addition → Dualism)
  **If consciousness is a separate addition to the physical world, does it exert a causal influence on physical behavior?**

  *   **A.** Yes. Conscious events help cause physical actions. *(Leaf 7)*
  *   **B.** No. Physical causes are sufficient; consciousness is a side-effect. *(Leaf 8)*

  ***

  ### Node 6 (Permanent Gap → Non-Standard Physicalism)
  **If the gap is permanent and zombies are impossible, is this because of how our concepts work, or a brute law of nature with no further explanation?**

  *   **A.** Our concepts. We have two ways of thinking about the same physical state, making it *seem* like two things. *(Leaf 4)*
  *   **B.** Brute law. Experience necessarily accompanies the physical, but there is no conceptual or structural reason why. *(Leaf 5)*

  ***

  ### The Leaves

  **Leaf 1: Type-A Physicalism**
  *   **Commitment:** You must accept that once we know the physical facts, there is literally no further fact about experience to know.
  *   **Awkward Commitment:** You must deny that someone could know all physical facts and still lack knowledge of what it is like to see red.

  **Leaf 2: Illusionism**
  *   **Commitment:** You must accept that phenomenal consciousness, as usually described, does not actually exist.
  *   **Awkward Commitment:** You must explain why the illusion of experience is so persistent and universal if experience itself is nothing.

  **Leaf 3: Type-C Physicalism**
  *   **Commitment:** You must accept that the explanatory gap is real now but will be closed by future theoretical advances.
  *   **Awkward Commitment:** You must specify what kind of future knowledge could close a gap that seems conceptual rather than empirical.

  **Leaf 4: Type-B Physicalism (Phenomenal Concept Strategy)**
  *   **Commitment:** You must accept that the gap is permanent due to our cognitive architecture, not the world's ontology.
  *   **Awkward Commitment:** You must explain why this conceptual dualism doesn't imply an ontological dualism in reality.

  **Leaf 5: Strong Necessity Physicalism**
  *   **Commitment:** You must accept that consciousness physically supervenes as a brute, unexplainable necessity.
  *   **Awkward Commitment:** You must accept a fundamental law of nature that connects physical states to experience without any mechanism or reason.

  **Leaf 6: Russellian Monism (Type-F)**
  *   **Commitment:** You must accept that physics describes only the relational structure of matter, not its intrinsic nature.
  *   **Awkward Commitment:** You must posit that fundamental physical entities possess prototypical forms of experience to ground human consciousness.

  **Leaf 7: Interactionist Dualism**
  *   **Commitment:** You must accept that non-physical conscious events cause physical changes in the brain.
  *   **Awkward Commitment:** You must explain how non-physical substances interact with the physical world without violating conservation of energy.

  **Leaf 8: Epiphenomenalism**
  *   **Commitment:** You must accept that consciousness is caused by the brain but causes nothing in return.
  *   **Awkward Commitment:** You must accept that your belief in consciousness is not caused by consciousness itself, making your knowledge of it accidental.

  **Leaf 9: Global Modal Skepticism**
  *   **Commitment:** You must accept that human beings are cognitively closed to the truth about the mind-body relation.
  *   **Awkward Commitment:** You must remain agnostic on the central question of metaphysics while continuing to participate in the debate.

  **Leaf 10: No Live Position (Incoherent)**
  *   **Diagnosis:** This combination is logically incoherent.
  *   **Reason:** If zombies are metaphysically possible, physical facts do not fix experiential facts; therefore, consciousness cannot be purely physical.

  ***

  ### Analysis of Boundary Cases

  **1. Type-B Physicalism (Leaf 4) vs. Type-C Physicalism (Leaf 3)**
  The tree separates these based on whether the gap is *closable* (Type-C) or *permanent* (Type-B). However, this distinction is difficult to apply cleanly because proponents often disagree on what counts as "future knowledge." A Type-B theorist might claim a gap is permanent due to concepts, while a Type-C theorist might claim those conceptual blocks will dissolve with new cognitive capacities. The tree cannot cleanly separate them without a deeper inquiry into the nature of "conceptual possibility" versus "cognitive limitation."

  **2. Russellian Monism (Leaf 6) vs. Strong Necessity (Leaf 5)**
  The tree separates these based on whether the physical description is *incomplete* (Russellian) or *complete but brute* (Strong Necessity). However, both positions deny that conceivability entails possibility in the standard dualist sense and both posit a necessary connection between the physical and the phenomenal that lacks a structural explanation. Distinguishing them requires a further question: "Does the current physical vocabulary fail to describe the intrinsic nature of reality, or does it describe reality fully but fail to explain its connection to experience?" Without this specific metaphysical distinction, the two views occupy very similar logical space.
