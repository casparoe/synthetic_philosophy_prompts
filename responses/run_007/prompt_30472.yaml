  # JOINT PRELIMINARY STATEMENT ON THE METAPHYSICS OF TIME
  **Prepared for the One-Day Workshop on Temporal Ontology**
  **Signatories:** [The Presentist] & [The Eternalist]

  ## PREAMBLE
  We, the undersigned, acknowledge a decade of dialectical engagement regarding the ontology of time. In the interest of advancing the debate beyond repetitive stalemates, we submit this document to establish a shared foundation, clarify the precise locus of our disagreements, and identify the evidentiary cruxes that determine the viability of our respective positions. We commit to treating the positions outlined herein as steel-managed representations of our views, forbidding the use of strawmen during the workshop.

  ---

  ## 1. AGREED CLAIMS AND SHARED COMMITMENTS
  We affirm the following propositions as common ground. Neither party is required to flinch at these admissions; they constitute the data any adequate metaphysics of time must accommodate.

  1.  **The Data of Tense and Experience:**
      *   We agree that human experience is robustly tensed. We remember the past, perceive the present, and anticipate the future.
      *   We agree that ordinary language is irreducibly tensed (e.g., "It *was* the case," "It *will be* the case").
      *   We agree that any metaphysical theory must account for the truth of ordinary past- and future-tensed beliefs without rendering us systematically deluded about the nature of change.

  2.  **Special Relativity (SR) and Physics:**
      *   We agree that Special Relativity is our best confirmed physical theory regarding spacetime structure.
      *   We agree that SR demonstrates that *physical* simultaneity is frame-relative; there is no empirically detectable, frame-independent "now" within the formalism of Minkowski spacetime.
      *   We agree that SR does not, *by itself* and without additional metaphysical premises (e.g., verificationism or the claim that physics is ontologically exhaustive), logically entail Eternalism nor strictly rule out Presentism. However, we agree that SR imposes a significant theoretical cost on any view requiring a privileged global present.

  3.  **The Logical Grammar of 'Now':**
      *   We agree that the word 'now' functions indexically. Its reference shifts depending on the time of utterance.
      *   We agree that 'now' picks out the time of the utterance. Disagreement remains only on whether the time picked out possesses a unique ontological status compared to times picked out by 'then'.

  4.  **Unhelpful Slogans:**
      *   We agree to retire the slogan "The past is real" (Eternalist) if it implies the past is *present*.
      *   We agree to retire the slogan "The future is unreal" (Presentist) if it implies the future is *deterministically open* in a way Eternalism cannot accommodate (Eternalism is compatible with indeterminism).
      *   We agree that "Time flows" is a metaphor requiring precise analysis, not a literal description of a super-temporal motion.

  ---

  ## 2. TABLE OF GENUINE DISAGREEMENTS
  The following table isolates the substantive ontological divergences. The positions listed are the strongest formulations each signatory accepts.

  | The Question | The Presentist Position | The Eternalist Position |
  | :--- | :--- | :--- |
  | **1. What is the fundamental ontology of temporal entities?** | **Existence is absolute and present-tensed.** Only entities and events located at the current moment of time exist *simpliciter*. Past and future entities do not exist; they *did* exist or *will* exist. | **Existence is tenseless.** Past, present, and future entities and events all exist *simpliciter*. "Present" is merely an indexical label for the time at which a conscious observer is located, akin to "here." |
  | **2. What are the truthmakers for past-tensed propositions?** | **Presentist Truthmaking.** Truths about the past are made true by present evidence, present traces, or sui generis past-tensed facts (e.g., "It was the case that *p*") that do not require the past entity to exist. | **Eternalist Truthmaking.** Truths about the past are made true by the past entities and events themselves. The proposition "Caesar crossed the Rubicon" is true because Caesar (tenselessly) exists and bears the crossing relation to the Rubicon. |
  | **3. What is the nature of temporal passage?** | **Objective A-Series Change.** Temporal passage is a mind-independent feature of reality. Events genuinely come into existence and go out of existence. The A-series properties (past, present, future) are fundamental and changing. | **No Objective Passage.** Temporal passage is a mind-dependent phenomenon or a cognitive illusion. Reality is a static B-series of events ordered by "earlier than" and "later than" relations. Nothing comes into or goes out of existence. |
  | **4. How are cross-temporal relations handled?** | **Tensed Relations or Pseudo-Relations.** Relations like "I admire Socrates" are not genuine relations between two existing relata. They are analyzed as tensed properties of the present subject or relations to abstract proxies. | **Genuine Relations.** Relations like "I admire Socrates" are genuine relations between two existing relata. Both the admirer and the admired must exist (tenselessly) to stand in a relation. |

  ---

  ## 3. GENUINE CRUXES: TESTS AND PREDICTIONS
  We identify the following sub-questions as the "cruxes" of the dispute. Settling these would compel at least one side to revise their position. For each crux, we specify a concrete argument or finding that bears on it, and record our divergent predictions.

  ### Crux 1: The Truthmaker Supervenience Principle
  *   **The Issue:** Whether tensed truths require tensed truthmakers, or if truths about non-existents violate the principle that truth supervenes on being.
  *   **The Test:** A rigorous analysis of the **Euthyphro-style dilemma for Presentism**: Does the world make the past-tensed propositions true, or do the propositions constrain the world? Specifically, can a world with no past entities be qualitatively identical to our world yet differ in past truths?
  *   **Presentist Prediction:** We predict that a theory of **Lucretian properties** (present objects having properties like "having-been-F") or **primitive tensed facts** will successfully ground past truths without ontological commitment to past entities. The supervenience base is the present plus tense operators.
  *   **Eternalist Prediction:** We predict that Lucretian properties are unintelligible without reducing to relations with past entities. We assert that if past entities do not exist, there is nothing to ground the *specificity* of past truths (e.g., why *this* trace rather than *that* one implies Caesar specifically). Truth requires being.

  ### Crux 2: Cross-Temporal Relations
  *   **The Issue:** Whether relations like "admiring," "causing," or "being taller than" (across time) require the existence of both relata.
  *   **The Test:** The **Argument from Relations**. Consider the proposition "I am a descendant of Napoleon." If relations require relata, and I exist, Napoleon must exist.
  *   **Presentist Prediction:** We predict that a coherent semantics can be developed where cross-temporal relations are analyzed as **tensed monadic properties** or relations to **abstracta** (haecceities). We assert that intuition about relations requiring existing relata is biased by spatial cases and does not hold temporally.
  *   **Eternalist Prediction:** We predict that attempts to reduce cross-temporal relations to present properties will fail to preserve logical validity (e.g., in transitivity of causation). We assert that the most parsimonious logic treats these as standard dyadic relations, requiring the tenseless existence of both relata.

  ### Crux 3: Special Relativity and Privileged Foliation
  *   **The Issue:** Whether SR favours a privileged foliation or shows simultaneity to be frame-relative in a way only Eternalism can accommodate.
  *   **The Test:** The **Stein-Minkowski Argument**. Does the geometric structure of spacetime (light cones) allow for a metaphysically privileged "hyperplane of the present" that is empirically undetectable?
  *   **Presentist Prediction:** We predict that physics describes causal structure, not ontological structure. We assert that a **privileged foliation** is metaphysically necessary for coherence and may be compatible with SR as a "hidden variable" or metaphysical addition that does not contradict empirical data.
  *   **Eternalist Prediction:** We predict that positing an undetectable privileged foliation is theoretically vicious (violating Ockham's Razor). We assert that the **relativity of simultaneity** implies the ontological parity of all spacetime points; if "now" is frame-relative, existence cannot be restricted to "now."

  ### Crux 4: The Phenomenology of Passage
  *   **The Issue:** Whether our experience of a moving 'now' is best explained as awareness of a mind-independent feature of reality or as an indexical feature of our own location.
  *   **The Test:** **Cognitive Science of the Specious Present**. Investigating whether the feeling of "flow" correlates with memory integration mechanisms (B-series processing) or suggests a detection of A-series properties.
  *   **Presentist Prediction:** We predict that phenomenological introspection reveals a **primitive awareness of change** that cannot be reconstructed from a static sequence of snapshots. The "feeling of flow" is veridical perception of metaphysical passage.
  *   **Eternalist Prediction:** We predict that the experience of passage will be fully explained by **memory accumulation and anticipatory processing** within a static brain state. The "moving now" is a cognitive artifact of updating indexical information, similar to moving through space.

  ---

  ## 4. VERBAL VS. SUBSTANTIVE CONCESSONS
  To prevent the workshop from devolving into semantic pedantry, we stipulate the following boundaries regarding the nature of our dispute.

  ### 4.1 Conceded Verbal/terminological Overlaps
  We acknowledge that *some* friction arises from quantifier variance.
  *   **The Quantifier:** We concede that if the Eternalist defines "exists" as "is located somewhere in the spacetime manifold" and the Presentist defines "exists" as "is located at the present moment," we may be talking past one another regarding the *word* "exist."
  *   **The Concession:** We agree to standardize the quantifier for the workshop to mean **"exists *simpliciter*"** (ontological commitment). We agree that if the dispute were *merely* about how to use the word "exist," it would not sustain a decade of journal articles.

  ### 4.2 Affirmed Substantive Disagreements
  We assert that the following elements of the dispute are **not** merely verbal and constitute the core of our disagreement:
  *   **Grounding Structure:** The disagreement over whether reality is fundamentally constituted by a changing present or a static manifold is substantive. It affects how we understand causation, modality, and the nature of propositions.
  *   **Theoretical Cost:** The disagreement over whether to posit an undetectable privileged frame (Presentism) or to deny the objective reality of passage (Eternalism) is a substantive disagreement about theoretical virtue and parsimony.
  *   **Truthmaking:** The disagreement over whether truths about the past require the past to *be* is a substantive metaphysical disagreement, not a semantic one.

  **Signed,**

  _________________________
  **[The Presentist]**

  _________________________
  **[The Eternalist]**

  **Date:** _________________
