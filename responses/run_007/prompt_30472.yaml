prompt: |-
  I am convening a one-day workshop on the metaphysics of time, and as its centrepiece I would like the presentist and the eternalist who have been arguing in the journals for the better part of a decade to produce, in advance, a single collaborative document that both can sign. Please draft that document for them.

  It should open with a numbered section of claims about which the two parties agree, written so that neither side has to flinch: for example, what the data of tense and temporal experience are that any view must accommodate, what special relativity does and does not show by itself, what the logical grammar of the word 'now' commits us to, and which traditional slogans on each side are unhelpful. Then it should give a disagreements table in which each row states (a) the question on which they part ways, (b) the presentist's position in wording a presentist would accept as its strongest formulation, and (c) the eternalist's position in wording an eternalist would accept as its strongest formulation. The positions should not be strawmen. After the table, identify the genuine cruxes: the sub-questions such that settling them would move at least one side. These might include whether tensed truths require tensed truthmakers; whether past-tensed truths about now-nonexistent things, and cross-temporal relations such as my admiring Socrates, require relata that both exist or can be handled by tensed relational facts; whether there is any coherent sense of temporal passage that is not reducible to variation across a B-series; whether special relativity favours a privileged foliation or shows simultaneity to be frame-relative in a way only eternalism can accommodate; and whether our experience of a moving 'now' is best explained as awareness of a mind-independent feature of reality or as an indexical feature of our own location. For each crux, describe a concrete argument, case, or finding that both sides would accept as genuinely bearing on it, and record in advance what each side predicts that test would show. Finally, state which parts of the dispute, if any, both parties are prepared to concede are merely verbal or terminological, and which parts are not.
reasoning: |-
  Here's a thinking process that leads to the suggested document:

  1.  **Analyze the Request:**
      *   **Task:** Draft a collaborative document for a Presentist and an Eternalist to sign *in advance* of a one-day workshop on the metaphysics of time.
      *   **Context:** They have been arguing in journals for a decade. The goal is to find common ground and clarify genuine disagreements to make the workshop productive.
      *   **Structure:**
          1.  **Numbered Section of Agreed Claims:** Data of tense/experience, Special Relativity (SR) limits, logic of 'now', unhelpful slogans. Must be neutral/non-flinching.
          2.  **Disagreements Table:** Three columns (Question, Presentist Position [strongest], Eternalist Position [strongest]). No strawmen.
          3.  **Genuine Cruxes:** Sub-questions that, if settled, would move a side. Specific examples given (truthmakers, cross-temporal relations, passage, SR, experience of 'now'). For each: describe a concrete argument/case/finding both accept as relevant, and record predictions.
          4.  **Verbal vs. Substantive:** Concede what is merely terminological and what is not.
      *   **Tone:** Professional, philosophical, precise, collaborative, charitable.

  2.  **Deconstruct the Content:**

      *   **Section 1: Agreed Claims.**
          *   *Tense/Experience:* We experience change. We remember the past, anticipate the future. Language is tensed.
          *   *Special Relativity:* SR challenges absolute simultaneity. It doesn't *prove* eternalism outright without metaphysical premises (like verificationism or block universe assumptions), but it makes privileged presentism costly.
          *   *Logic of 'Now':* 'Now' is indexical. It picks out a time relative to the utterance.
          *   *Unhelpful Slogans:* "The future is unreal" (Presentism) vs. "The past exists" (Eternalism) can be misleading if 'exists' isn't qualified. "Time flows" is metaphorical.

      *   **Section 2: Disagreements Table.**
          *   Need to capture the ontological core.
          *   *Question:* What exists fundamentally?
          *   *Presentist:* Only present entities/events exist. Past/future do not exist *simpliciter*.
          *   *Eternalist:* Past, present, and future entities/events all exist *simpliciter* (tenselessly).
          *   *Question:* Nature of Truthmakers for past/future claims.
          *   *Presentist:* Present evidence/properties or sui generis past-tensed facts.
          *   *Eternalist:* The past/future entities themselves.
          *   *Question:* Temporal Passage.
          *   *Presentist:* Objective passage (A-series change).
          *   *Eternalist:* No objective passage (B-series relations only).

      *   **Section 3: Genuine Cruxes.**
          *   *Crux 1: Truthmakers for Past Contingents.*
              *   *Test:* Analysis of propositions like "Caesar crossed the Rubicon."
              *   *Prediction:* Presentist says present traces/facts suffice. Eternalist says Caesar himself is needed.
          *   *Crux 2: Cross-Temporal Relations.*
              *   *Test:* "I admire Socrates." Relation requires relata.
              *   *Prediction:* Presentist says it's a tensed relation or pseudo-relation. Eternalist says Socrates exists tenselessly to be related to.
          *   *Crux 3: Special Relativity & Simultaneity.*
              *   *Test:* Minkowski spacetime interpretation.
              *   *Prediction:* Presentist argues for a privileged foliation (hidden or metaphysical). Eternalist argues frame-relativity implies ontological parity.
          *   *Crux 4: Experience of Passage.*
              *   *Test:* Phenomenology of specious present.
              *   *Prediction:* Presentist says it reveals metaphysical flow. Eternalist says it's cognitive processing of B-series data.

      *   **Section 4: Verbal vs. Substantive.**
          *   *Verbal:* Definitions of "exists" (sometimes). Use of "real."
          *   *Substantive:* Ontological commitment, truthmaking structure, compatibility with physics.

  3.  **Drafting - Section by Section (Iterative refinement):**

      *   *Title:* Needs to sound official. "Joint Preliminary Statement on the Metaphysics of Time."
      *   *Intro:* Brief context setting.
      *   *Section 1 (Agreements):* Be careful with SR. Don't say SR *disproves* presentism (presentists fight hard on this). Say SR *complicates* it. Don't say experience *proves* passage. Say experience *suggests* it.
      *   *Section 2 (Table):* Ensure the Presentist view isn't "solipsism of the present moment" (too weak) and Eternalist isn't "determinism" (irrelevant). Focus on *ontology*.
      *   *Section 3 (Cruxes):* This needs to be the meat. The prompt asks for "concrete argument, case, or finding." I need to make sure these aren't just restatements of the disagreement but *tests*. For SR, the test is the coherence of a privileged frame. For Truthmakers, the test is the Euthyphro-style dilemma on truth supervenience.
      *   *Section 4 (Verbal/Substantive):* Acknowledge the "quantifier variance" debate but insist the core is substantive.

  4.  **Refining the Tone:**
      *   Avoid bias.
      *   Use standard terminology (A-series, B-series, truthmaker theory, Minkowski spacetime).
      *   Ensure the "Strongest Formulation" constraint is met. No weak presentism that looks like eternalism in disguise. No eternalism that implies fatalism.

  5.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I address the "logical grammar of 'now'"? *Correction:* Add to Section 1.
      *   *Check:* Did I include the specific cruxes mentioned in the prompt? *Correction:* Ensure Truthmakers, Cross-temporal relations, Passage, SR, and Experience are all covered in Section 3.
      *   *Check:* Is the SR section accurate? *Correction:* Be precise. SR shows simultaneity is frame-relative *in the theory*. Presentists posit a metaphysical simultaneity not captured by the physics. Eternalists say that's unparsimonious.
      *   *Check:* Is the "Verbal" section honest? *Correction:* Most metaphysicians think it's substantive, but some deflationists exist. The document should reflect that they *mostly* agree it's substantive but acknowledge the semantic layer.

  6.  **Final Polish:** Check formatting (numbering, table structure). Ensure the voice sounds like two weary but respectful adversaries finding a modus vivendi for the sake of progress. (Proceed to generate output).

  *(Self-Correction on Cruxes)*: The prompt asks for "what each side predicts that test would show." I need to make sure these predictions are distinct.
  *   *Example:* For SR. Test: Is a privileged foliation physically detectable or theoretically necessary? Presentist predicts: Metaphysically necessary, physically undetectable. Eternalist predicts: Metaphysically unnecessary, physically unsupported.

  *(Refining the "Verbal" section)*: Be careful not to dismiss the dispute as merely verbal. The prompt asks to state what they are prepared to concede *if any*. Usually, they concede *some* verbal confusion exists but insist the core is real. I will frame it as "Areas of Semantic Overlap" vs "Areas of Ontological Divergence."

  7.  **Final Output Generation** (incorporating the above thoughts).
