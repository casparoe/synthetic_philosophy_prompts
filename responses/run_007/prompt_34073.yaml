answer: |-
  # Activity: The Truthmaker Tribunal

  ## (a) Setup and Rules

  **Room Arrangement:**
  Divide the room into two halves. On the left, seat **Faction N** (The "Now" Committee). On the right, seat **Faction T** (The "Timeline" Committee). If you have 20 students, split them into four tables of five: two tables for Faction N, two tables for Faction T. This allows internal strategy before public defense.

  **Materials:**
  1.  **Ontology Budget Sheets:** One per student (different versions for N and T).
  2.  **Case Files:** Projected or printed (3 total).
  3.  **Ruling Gavel:** For the Instructor (The Judge).
  4.  **Whiteboard:** To track "Truthmaker Credits" (optional visual aid).

  **The Core Rule (The "Existence Constraint"):**
  *   **Faction N:** You are only permitted to posit entities, properties, or relations that exist **at this very moment**. You cannot point to anything that *was* or *will be* as an existing thing. If you need to explain a past event, you must build a truthmaker out of *current* materials.
  *   **Faction T:** You are permitted to posit entities at **any time coordinate**. However, you are forbidden from privileging any one time as "moving" or "special." All times are ontologically equal.

  **The Goal:**
  The Tribunal must validate a set of **Common Sense Propositions** (e.g., "Caesar crossed the Rubicon"). To validate a proposition, a Faction must present a **Truthmaker**—an existing thing or state of affairs that makes the proposition true.
  *   If you cannot produce a Truthmaker allowed by your Existence Constraint, the proposition is **False** (which is a failure, as these are Common Sense truths).
  *   If your Truthmaker violates your Existence Constraint, you are **Overruled**.

  **The Epistemic Ban:**
  Students are strictly forbidden from using epistemic answers (e.g., "We have a history book," "I remember it"). The Judge must immediately interrupt: *"I am not asking how you know. I am asking what in reality makes it true."*

  ---

  ## (b) Roles and Assignment

  **Faction N (The "Now" Committee):**
  *   **Ontological Budget:** You possess "Present Concrete Objects" and "Present Properties."
  *   **Special Resource:** You have 3 "Tensed Fact Vouchers." These allow you to posit a brute fact like *<It was the case that P>* without further analysis. Once they are gone, you must construct truthmakers from present objects only.
  *   **Motivation:** Preserve the intuition that the past is gone and the future is open.

  **Faction T (The "Timeline" Committee):**
  *   **Ontological Budget:** You possess "Spacetime Worms" and "Temporal Parts." You can point to any coordinate $(x, y, z, t)$.
  *   **Special Resource:** You have "B-Relation Tokens" (earlier than, later than, simultaneous with).
  *   **Motivation:** Preserve the intuition that statements about the past are just as factual as statements about the present.
  *   **Constraint:** You cannot say the future is "undetermined." If a future entity exists in your budget, it exists.

  **Assignment:**
  Flip a coin or assign arbitrarily. Do **not** use the words "Presentism" or "Eternalism." Tell them they are competing metaphysical engineering firms hired to ground reality's truths.

  ---

  ## (c) Concrete Task: The Case Files

  The Instructor acts as The Judge. Present the cases one by one. Each faction has 5 minutes to confer, then 3 minutes to present their Truthmaker. The Judge rules on validity.

  **Case File 1: The Cross-Temporal Relation (The Past)**
  *   **Proposition:** "Julius Caesar crossed the Rubicon."
  *   **The Challenge:** Caesar does not exist now. The Rubicon (as it was then) does not exist now. The crossing event does not exist now.
  *   **Task:** Construct a truthmaker.
      *   *Faction N Strain:* You cannot point to Caesar. You must use present traces (ruins, books) or Tensed Fact Vouchers. The Judge should press: "Does a book *make it true*, or does it merely *record* the truth? If Caesar doesn't exist, what stands in the 'crossing' relation?"
      *   *Faction T Strain:* Easy for them (point to the past slice). But the Judge should note the ontological cost: "So you are positing the existence of a dead man?"

  **Case File 2: The Open Future (Contingency)**
  *   **Proposition:** "There might be a sea battle tomorrow."
  *   **The Challenge:** This proposition implies the future is not fixed.
  *   **Task:** Construct a truthmaker.
      *   *Faction T Strain:* If the future time slice exists in your budget, does the sea battle exist there? If yes, how can it *not* happen? If no, is the proposition false? They must explain contingency without ontological openness.
      *   *Faction N Strain:* Easy for them (the future doesn't exist yet). But the Judge should press: "If the future doesn't exist, what makes it true *now* that a sea battle is *possible* rather than *impossible*?"

  **Case File 3: Temporary Intrinsics (Change)**
  *   **Proposition:** "The candle is straight at $t_1$ and bent at $t_2$."
  *   **The Challenge:** How can one object have incompatible properties?
  *   **Task:** Explain the change without contradiction.
      *   *Faction N Strain:* The candle exists now. Is it straight or bent? If it changes, do properties pop in and out of existence?
      *   *Faction T Strain:* You must treat the candle as a spacetime worm with different temporal parts. The Judge should press: "Is the *whole* candle bent? Or just a part? Do we really want to say objects are 4D worms?"

  ---

  ## (d) Timeline (75 Minutes)

  *   **00:00 – 00:10: Setup & Distribution.**
      *   Hand out Budget Sheets.
      *   Read the "Existence Constraint" aloud.
      *   Emphasize the Epistemic Ban.
  *   **00:10 – 00:30: Case File 1 (The Past).**
      *   5 min internal strategy.
      *   5 min Faction N defense.
      *   5 min Faction T defense.
      *   5 min Judge Ruling/Interrogation.
  *   **00:30 – 00:50: Case File 2 & 3 (Future & Change).**
      *   Combine these for pace.
      *   5 min strategy.
      *   10 min Defense (rapid fire).
      *   5 min Judge Ruling.
  *   **00:50 – 01:15: Debrief & Mapping.**
      *   Reveal the positions (Presentism vs. Eternalism).
      *   Connect game struggles to philosophical arguments (see script below).

  ---

  ## (e) Debrief Script: Mapping the Strain

  *Instructor Note: Do not start this section by lecturing. Start by asking them how it felt.*

  **1. The Truthmaker Problem (Case 1)**
  *   **Ask Faction N:** "When you ran out of Tensed Fact Vouchers, what happened?"
  *   **Philosophical Link:** "You experienced the **Truthmaker Objection**. If only present things exist, what grounds the truth of past-tensed propositions? You tried to use 'traces' (books, ruins), but I pressed you on whether a trace *constitutes* truth or just *evidence*. Presentists must posit 'tensed properties' of the world (e.g., the world *now* has the property of *having-contained-Caesar*). This feels like a linguistic trick to many."
  *   **Ask Faction T:** "Was it easier for you?"
  *   **Philosophical Link:** "Yes, because you have **Eternalist Truthmakers**. The past event exists at a past coordinate. But notice the cost: you committed to the existence of non-present entities. That is a heavy ontological commitment."

  **2. Contingency and the Open Future (Case 2)**
  *   **Ask Faction T:** "How did you handle 'might'?"
  *   **Philosophical Link:** "This is the **Fatalism Objection**. If the future time slice exists, the sea battle is real. How is it contingent? Eternalists often have to adopt 'Branching Time' models or deny that future contingents have truth values yet, which complicates their view."
  *   **Ask Faction N:** "Did you feel safe?"
  *   **Philosophical Link:** "Presentism preserves **Contingency** naturally. The future doesn't exist, so it isn't fixed. But you struggled to ground *possibility*. What makes it possible if nothing exists?"

  **3. Special Relativity (The Hidden Boss)**
  *   **Instructor Input:** "I didn't give you this case, but imagine I asked: 'What is happening *now* on Mars?'"
  *   **Philosophical Link:** "Faction N, you need a universal 'Now' to define your ontology. But **Special Relativity** suggests simultaneity is relative to a frame of reference. If there is no universal 'now,' Faction N's existence constraint collapses. Faction T (Eternalism) fits neatly with Relativity (the Block Universe), which is why many physicists prefer it."

  **4. Temporary Intrinsics (Case 3)**
  *   **Instructor Input:** "How did you handle the candle?"
  *   **Philosophical Link:** "Faction T used **Perdurantism** (objects have temporal parts). The candle is a 4D worm; one part is straight, one is bent. No contradiction. Faction N (Endurantism) must say the *whole* object is wholly present at each time, changing intrinsic properties. This leads to the **Problem of Temporary Intrinsics**: How can one thing be $F$ and not-$F$?"

  **5. Phenomenology of Passage**
  *   **Closing Question:** "Faction T, did it feel like reality was 'moving'?"
  *   **Philosophical Link:** "No. For Eternalists, passage is an illusion of consciousness. For Presentists, passage is ontological (the 'Now' moves). This is the **A-Theory vs. B-Theory** of time. You felt the tension between the *physics* (Block) and the *phenomenology* (Flow)."

  ---

  ## (f) Honest Note: Limitations & Predictable Failures

  **1. The Epistemic Slip (Predictable Failure)**
  *   **What goes wrong:** Students will constantly answer "How do we *know* Caesar crossed?" instead of "What *makes it true*?" They will cite archaeology or memory.
  *   **Your Fix:** You must be ruthless in the "Judge" role. Interrupt immediately: *"That is evidence, not a truthmaker. If the universe contained only you and that book, would the proposition be true? What in the ontology grounds it?"* If you don't enforce this, the activity becomes epistemology, not metaphysics.

  **2. The "Tensed Fact" Cheat (Predictable Failure)**
  *   **What goes wrong:** Faction N will hoard their "Tensed Fact Vouchers" and use them for everything, avoiding the hard work of grounding.
  *   **Your Fix:** Limit the vouchers strictly (e.g., only 2 for the whole group). Force them to construct a "Present Property" account (e.g., *The world now has the property of having-contained-Caesar*). This forces them to feel the strangeness of haecceitism or lucretianism.

  **3. What the Activity Cannot Reproduce**
  *   **Relativity of Simultaneity:** The game assumes a Newtonian absolute time for simplicity. You cannot easily simulate the breakdown of simultaneity in a 75-minute roleplay. You must supply this in the debrief (as scripted above) because it is the strongest argument against Presentism.
  *   **The Growing Block:** The activity binary-forces them into Presentism vs. Eternalism. It leaves out the **Growing Block Theory** (past and present exist, future does not). You should mention this in the debrief as a "middle ground" that tries to capture the strengths of both factions but faces its own problems (e.g., who is the "edge" of reality?).
  *   **The Feeling of Passage:** No activity can reproduce the *qualia* of temporal passage. You must articulate that Eternalism denies this is a feature of the *world* rather than the *mind*, while Presentism builds it into the *world*.

  **4. Student Frustration**
  *   **Warning:** Upper-level undergrads may get frustrated if they feel the rules are "rigged." Faction N often feels impossible to defend after the vouchers run out.
  *   **Mitigation:** Acknowledge this in the debrief. "If you felt Faction N was impossible, you have just intuited the main argument *against* Presentism. If you felt Faction T made the future fixed, you have intuited the main argument *against* Eternalism. The discomfort *is* the philosophy."
