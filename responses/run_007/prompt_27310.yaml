  # Activity: The Typogenetic Workshop

  ## 1. Overview & Logistics
  *   **Time:** 90 minutes total (45 min activity, 25 min debrief, 20 min setup/buffer).
  *   **Class Size:** 18 students (worked in 9 pairs).
  *   **Materials:**
      *   **Translation Table:** Projected on screen or printed as a large poster.
      *   **Input Strips:** 9 unique designs (2 copies of the Self-Replicator, 1 Parasite, 1 Mutant, 5 Garbage). Printed on colored paper strips.
      *   **Output Strips:** Blank paper strips (one per pair).
      *   **Worksheet:** A simple grid for tracking State, Input Pair, and Output Action.
      *   **Tape/Glue:** For attaching output letters if using cut-outs (optional; writing is faster).

  ## 2. The Formal System (The "Code")

  **Alphabet:** `A`, `C`, `G`, `T`
  **Reading Rule:** Read the input strip in **non-overlapping pairs** (1-2, 3-4, 5-6...).
  **State:** The system has a global **State**, which starts at `NORMAL`. The State determines how pairs are interpreted.

  ### Public Translation Table

  | Input Pair | Current State | Action (Write to Output) | New State |
  | :--- | :--- | :--- | :--- |
  | **AT** | NORMAL | Write `AT` | `COPY` |
  | **TA** | NORMAL | Write `TA` | `NORMAL` |
  | **TA** | COPY | Write `TA` | `NORMAL` |
  | **AA** | COPY | Write `AA` | `COPY` |
  | **CC** | COPY | Write `CC` | `COPY` |
  | **GG** | COPY | Write `GG` | `COPY` |
  | **TT** | COPY | Write `TT` | `COPY` |
  | **AA** | NORMAL | *Do Nothing* | `NORMAL` |
  | **CC** | NORMAL | *Do Nothing* | `NORMAL` |
  | **GG** | NORMAL | *Do Nothing* | `NORMAL` |
  | **TT** | NORMAL | *Do Nothing* | `NORMAL` |
  | **AC** | NORMAL | *Do Nothing* | `BUILD` |
  | **CA** | BUILD | *Do Nothing* | `NORMAL` |
  | **AA** | BUILD | Write `AT` | `BUILD` |
  | **CC** | BUILD | Write `AA` | `BUILD` |
  | **GG** | BUILD | Write `CC` | `BUILD` |
  | **TT** | BUILD | Write `TA` | `BUILD` |
  | **Any Other**<br>(e.g., AG, TC) | ANY | Write `XX` (Error) | Unchanged |

  *(Note for Instructor: "Write" means append the letters to the Output Strip. "Do Nothing" means advance the input pointer but write nothing.)*

  ## 3. The Strands (Print & Cut)

  Distribute one strip to each pair. **Do not tell them what the strands represent.** Tell them: *"Execute your strand according to the table. Record your output exactly. Do not compare results with other pairs until instructed."*

  **Strand IDs (For Instructor Eyes Only):**

  1.  **Pair 1 (Self-Replicator):** `AT AA CC GG AA CC TA`
      *   *Expected Output:* `AT AA CC GG AA CC TA` (Exact Copy)
  2.  **Pair 2 (Self-Replicator):** `AT AA CC GG AA CC TA`
      *   *Expected Output:* `AT AA CC GG AA CC TA` (Exact Copy)
  3.  **Pair 3 (Parasite):** `AC AA CC GG TT CC GG TT CA`
      *   *Expected Output:* `AT AA CC GG AA CC TA` (Copies Pair 1's strand)
  4.  **Pair 4 (Mutant):** `AT AA CC GG AC AA CC TA`
      *   *Expected Output:* `AT AA CC GG XX AA CC TA` (Self with one error)
  5.  **Pair 5 (Garbage - Silent):** `AA CC GG TT AA CC`
      *   *Expected Output:* (Empty String)
  6.  **Pair 6 (Garbage - Silent):** `GG TT AA CC GG TT`
      *   *Expected Output:* (Empty String)
  7.  **Pair 7 (Garbage - Noise):** `AG TC AG TC AG TC`
      *   *Expected Output:* `XX XX XX XX XX XX`
  8.  **Pair 8 (Garbage - Noise):** `CT GA CT GA CT GA`
      *   *Expected Output:* `XX XX XX XX XX XX`
  9.  **Pair 9 (Garbage - Partial):** `AT AA AG TT TA`
      *   *Expected Output:* `AT AA XX TT TA`

  ## 4. Facilitator Guide

  ### Phase 1: Setup (10 Minutes)
  1.  **Handout:** Give each pair an Input Strip, a Blank Output Strip, and a Worksheet.
  2.  **Instructions:**
      *   "You are a ribosome. Your strip is DNA."
      *   "Read the letters in pairs (1-2, 3-4...)."
      *   "Consult the Translation Table."
      *   "Follow the 'Action' column strictly. Update your 'State' after every pair."
      *   "Write the result on your Blank Output Strip."
      *   "Stop when you run out of input pairs."
      *   **Crucial:** "Do not show your output to other pairs yet."

  ### Phase 2: Execution (35 Minutes)
  1.  **Circulate:** Watch for students reading overlapping pairs (1-2, then 2-3). Correct them silently.
  2.  **State Checks:** Ensure pairs are tracking their State (`NORMAL`, `COPY`, `BUILD`). This is the most common failure point.
  3.  **Fast Finishers:** If a pair finishes early (likely the Garbage groups), ask them to: *"Count how many letters you wrote. Did you write more or fewer than you read?"* Do not let them reveal *what* they wrote.
  4.  **The Reveal:** Once all pairs are done, ask:
      *   "Who produced an empty output?" (Garbage groups)
      *   "Who produced `XX` errors?" (Noise groups)
      *   "Who produced a string of letters?" (S, P, M groups)
      *   **The Climax:** Ask the Self-Replicator groups to read their Input, then their Output.
      *   **Ask the Parasite group:** Read your Input. Read your Output. Compare it to Pair 1.

  ### Phase 3: Debrief (25 Minutes)

  **1. The Formal Structure (Gödel Numbering)**
  *   "The Translation Table is a **code**. It assigns meaning to syntax."
  *   "Just as Gödel numbering assigns numbers to formulas, this table assigns operations to letter pairs."
  *   "The system allows strings to talk about strings. The `COPY` state allows the string to dictate the construction of a new string based on its own content."

  **2. The Diagonal Lemma (Fixed Points)**
  *   "Pair 1 and 2 found a **Fixed Point**. Input = Output."
  *   "In logic, the Diagonal Lemma guarantees that for any property $P$, there is a sentence $S$ that says 'I have property $P$'."
  *   "Here, the property is 'being this specific sequence'. The strand `AT...TA` is a physical fixed point: it constructs itself."
  *   "This wasn't magic; it was structural. The `AT` started the engine, the middle copied the data, the `TA` stopped it. It is a syntactic recipe for self-construction."

  **3. The Biological Parallel (Typogenetics)**
  *   "This is Hofstadter's Typogenetics."
  *   "Input Strip = DNA. Output Strip = New DNA."
  *   "You (the students) = The Ribosome/Enzymes."
  *   "In biology, DNA encodes enzymes. Those enzymes operate on DNA. If the enzymes operate on *the very DNA that encoded them*, you have biological self-reference."
  *   "The `COPY` state represents the polymerase enzyme reading the template strand."

  **4. The Isomorphism & The Limit**
  *   "We have mapped: Code Table $\approx$ Gödel Numbering; Self-Replicator $\approx$ Self-Referential Sentence."
  *   **The Missing Piece:** "Gödel's Incompleteness Theorem requires **Negation**. It requires a sentence that says 'I am **not** provable'."
  *   "Look at our table. Can you write a strand that says 'I am **not** this strand'?"
  *   "No. We have `COPY` (Yes), but we have no `NOT`."
  *   "This activity demonstrates that self-reference is possible in formal systems. It does not demonstrate that truth exceeds provability. For that, you need the ability to construct a paradox, not just a mirror."

  ## 5. Predictable Failure Modes & Mitigation

  | Failure Mode | Why it Happens | Mitigation |
  | :--- | :--- | :--- |
  | **Overlapping Pairs** | Students read 1-2, then 2-3 (sliding window). | **Visual Aid:** Print input strips with vertical bars between pairs: `AT \| AA \| CC`. Explicitly say "Jump two, not one." |
  | **State Drift** | Students forget they are in `COPY` mode and treat `AA` as "Do Nothing". | **Worksheet:** Require a "Current State" column on the worksheet. Check it during circulation. |
  | **Spoilers** | Self-Replicator pair finishes early and shouts "We made ourselves!" | **Sealing:** Have pairs fold their Output Strip in half when done. Collect them all before the Reveal. |
  | **Timing Mismatch** | Garbage groups finish in 5 mins; Parasite group takes 20. | **Extension Task:** Hand fast groups a "Challenge Card": *"Design a 4-pair strand that outputs 'ACGT'."* Keeps them busy without ruining the secret. |
  | **Accidental Replication** | A Garbage strand accidentally outputs itself (e.g., `AA` in Normal mode). | **Table Design:** Ensure `AA`/`CC`/`GG`/`TT` do **nothing** in `NORMAL` mode. Only `AT` initiates writing. |
  | **Confusion on "Write"** | Students write on the Input Strip instead of Output. | **Color Code:** Input Strips are Yellow. Output Strips are White. Instruction: "Yellow is for reading, White is for writing." |

  ## 6. Printable Materials Text

