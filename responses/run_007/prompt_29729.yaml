answer: |-
  It is completely understandable that you felt lost, because your friends were actually arguing past each other on three different levels: the definition of lying, the source of moral wrongness, and the context of the relationship. To untangle this, we have to start with the distinction between lying and misleading, because Marcus is technically correct here while Chloe is morally correct. In philosophy, a lie is typically defined as asserting something you believe to be false, whereas misleading involves asserting something true while intentionally causing someone to infer something false. So, when Marcus said he stopped at the library for ten minutes, he made a true assertion, which means strictly speaking, he did not lie. However, Chloe is right that the moral weight of communication isn't just about the literal truth of the sentences but about the cooperative intent behind them. When Marcus told his parents he was studying at the library, he was invoking a social contract where that statement implies he spent the evening there. By exploiting the gap between literal truth and implied meaning, he achieved the exact same outcome as a lie, which is why Chloe feels the technicality is irrelevant.

  Where Dev jumps in is crucial, because he identifies why many philosophers argue there is a genuine moral difference between the two, even when the intent to deceive is identical. Dev's point is that lying involves a direct breach of the norm of assertion. When you speak, you are implicitly promising that you believe what you are saying is true. When you lie, you break that promise directly. When you mislead, you keep that promise technically, but you manipulate the listener's reasoning to break trust indirectly. This suggests that lying is indeed worse in a specific way, as Chloe eventually agreed, because it corrupts the tool of communication itself. If everyone lied, language would cease to function because no assertion could be trusted. If everyone misled, language would still work, but we would all have to become incredibly cautious listeners. So, Dev and Chloe are right that lying is generally a more fundamental violation of trust because it attacks the foundation of sharing information, whereas misleading attacks the listener's inference process.

  However, Marcus makes a very strong point when he argues that misleading can feel worse because of the deniability involved. This is often called the problem of manipulative cowardice. When you lie, you put your reputation on the line directly; if you are caught, you are caught. When you mislead, you are trying to have it both ways: you want the benefit of the deception while retaining the ability to say, "I never said that," if things go wrong. This adds a layer of manipulation that pure lying doesn't always have. In the context of the library excuse, Marcus was not just deceiving his parents; he was setting up a defense mechanism against them. This supports Marcus's claim that misleading can be morally suspect in its own right, not because it is identical to lying, but because it demonstrates a specific kind of cunning that avoids accountability. So, while Dev is right that lying breaks a stronger commitment, Marcus is right that misleading can show a worse character trait in terms of honesty and courage.

  The argument gets trickier when Marcus brings up the grandma sweater example, because this highlights that the intent to deceive isn't always what makes an action wrong. Chloe correctly identifies that saying "I'm fine" when you aren't is different because there is no intent to deceive; both parties know it is a social script. But the grandma example is different because there is an intent to deceive, yet we usually forgive it. This is because moral obligations depend on the relationship and the stakes. You have a strong obligation to be honest with your parents about your whereabouts because their concern involves your safety and trust. You do not have an obligation to hurt your grandma's feelings about a sweater because the stakes are low and kindness outweighs strict honesty in that context. Marcus was right to point out that intent to deceive isn't automatically immoral, but he was wrong to use that to defend the library excuse, where the obligation to be truthful was much higher.

  So, to answer your question about who is right, the disagreement is well-formed but requires separating the act from the outcome. There is a moral difference between lying and misleading. Lying is generally worse because it directly violates the norm of truth-telling, which is essential for trust to exist at all. Misleading is bad, but it leaves the door open for truth, as Chloe noted when she said the misleading person left true statements on the table. However, Marcus is also right that misleading can be more manipulative because it avoids accountability. In the specific case of the library excuse, Chloe and Dev are mostly right that Marcus's behavior was morally equivalent to lying in terms of the breach of trust, even if it wasn't a lie by definition. He violated the spirit of the agreement with his parents. But Marcus is right that we shouldn't treat all deception as equally bad, since white lies exist. The verdict is that lying is usually the greater offense against the system of communication, but misleading is often a greater offense against the specific relationship because it adds manipulation to the deception. Marcus was wrong to think the technical truth saved him, but he was right that the moral landscape is more complex than just "false words equal bad."
