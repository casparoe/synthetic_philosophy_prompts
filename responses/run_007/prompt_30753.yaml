  2.  **Drafting the Scenario (Iterative Process):**
      *   *Attempt 1:* A hospital wants to reduce readmissions (Target). They notice patients who attend discharge education classes (Proxy) have lower readmissions. They mandate more classes. But the classes don't help. Why? Because motivated patients (Common Cause) attend classes *and* take better care at home. Forcing unmotivated patients to attend doesn't make them take better care.
      *   *Critique 1:* This is a classic example. Is it one paragraph? Yes. Is it realistic? Yes. Does it avoid gaming? Yes, attendance is tracked honestly. Is it distinguishable from extrapolation? Yes, we aren't pushing attendance to 100% if it was never 100%, we are just increasing it within reason.
      *   *Refinement:* I need to make sure the "intervention" is clear. The managers are rewarded for moving the number. So they schedule more classes or require attendance. Let's make it about "Nurse Check-in Frequency."
      *   *Attempt 2:* In a regional health system, the patient-engagement team selects "Number of Post-Discharge Nurse Phone Calls" as the success metric for reducing 30-day readmissions, based on two years of data showing patients who received more calls were significantly less likely to return. The correlation is robust, and auditors confirm call logs are accurate, with no evidence of staff padding numbers or skipping script requirements. To improve the metric, regional managers allocate budget to hire more callers and mandate a minimum of three calls per patient, successfully raising the average call count from 1.2 to 2.8 within a quarter. However, readmission rates remain flat, frustrating leadership who expected a drop commensurate with the historical trend. The failure occurs not because staff faked the calls or because 2.8 calls is an unprecedented outlier, but because the original data reflected that patients with complex, high-risk conditions naturally triggered more calls *and* were more likely to be readmitted, while stable patients triggered fewer calls and rarely returned, creating a spurious association between call volume and safety that vanishes when call volume is artificially decoupled from patient risk.
      *   *Critique 2:* Wait, if high risk triggers more calls *and* more readmissions, that's a positive correlation. I need the proxy to look *good* (higher metric = better outcome). So, low risk -> fewer calls + fewer readmissions. Or, high engagement (common cause) -> more calls + fewer readmissions. Let's stick with the "Motivated/Resource-Rich Patient" angle.
      *   *Attempt 3 (Finalizing the paragraph):* In a regional health system, the patient-engagement team selects "Percentage of Patients Completing Post-Discharge Surveys" as the key performance indicator for reducing 30-day readmissions, based on two years of data showing a strong negative correlation between survey completion and readmission rates. The data is clean, auditors verify completion logs are authentic, and managers, eager to earn their bonuses, successfully launch a user-friendly app and reminder system that doubles the completion rate from 40% to 80% without coercing patients or falsifying records. Despite this unprecedented success in moving the metric, readmission rates do not decline, confusing leadership who expected the historical trend to hold. The failure arises because the original correlation was driven by a latent variable—patient social stability and health literacy—which caused both a higher likelihood of completing administrative tasks like surveys and a higher capacity to manage recovery at home, meaning that artificially increasing survey completion among unstable patients does not grant them the underlying stability required to avoid readmission.

  3.  **Drafting the Analysis:**
      *   **Proxy:** Survey Completion Rate.
      *   **Target:** 30-Day Readmission Rate (specifically, reducing it).
      *   **Common Cause:** Patient Social Stability/Health Literacy (let's call it "Patient Capacity").
