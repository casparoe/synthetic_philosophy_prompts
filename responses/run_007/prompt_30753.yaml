      *   Ensure the "Confidence" section is honest.

  7.  **Final Review against "Goodhart" distinction:**
      *   Goodhart: When a measure becomes a target, it ceases to be a good measure (often due to gaming or distortion).
      *   This case: The measure ceases to be good because the *causal structure* was misunderstood (confounding), not because the target was gamed. This is often called "The Proxy Problem" or "Confounding Bias in Metrics." I need to make sure I don't use the word "Goodhart" to describe this, but distinguish it from it. The prompt acknowledges Goodhart but asks for *this specific* failure mode.

      *(Self-Correction)*: I need to be careful with the term "Goodhart's Law." Strictly speaking, Goodhart's Law is about the collapse of the statistical regularity when pressure is applied. This *is* a form of Goodhart's Law (specifically the causal/structural version), but the prompt distinguishes it from "gaming." I will adhere to the prompt's framing: Gaming vs. Causal Disconnect.

