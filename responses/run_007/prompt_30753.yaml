      *   **Constraint 3 (Behavior):** No gaming, cheating, or misreporting. Managers act in good faith.
      *   **Constraint 4 (Mechanism):** The metric (proxy) is historically correlated with the target. The correlation is due to a *common cause* (confounder). Intervening on the proxy breaks the link to the target (no causal path from proxy to target).
