      *   *Wait, another nuance:* The prompt asks for a metric where managers are rewarded for *moving* it. Usually, you want to move a metric in a "good" direction. If the metric is "Survey Completion", moving it up is good. If the target is "Readmissions", moving it down is good. The historical data shows Up Completion = Down Readmission. Intervention moves Up Completion. Target stays same. This works.

