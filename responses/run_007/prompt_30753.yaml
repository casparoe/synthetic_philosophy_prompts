answer: |-
  In a regional health system, the patient-engagement team selects "Percentage of Patients Completing Post-Discharge Surveys" as the key performance indicator for reducing 30-day readmissions, based on two years of data showing a strong negative correlation between survey completion and readmission rates. The data is clean, auditors verify completion logs are authentic, and managers, eager to earn their bonuses, successfully launch a user-friendly app and reminder system that doubles the completion rate from 40% to 80% without coercing patients or falsifying records. Despite this unprecedented success in moving the metric, readmission rates do not decline, confusing leadership who expected the historical trend to hold. The failure arises because the original correlation was driven by a latent variable—patient social stability and health literacy—which caused both a higher likelihood of completing administrative tasks like surveys and a higher capacity to manage recovery at home, meaning that artificially increasing survey completion among unstable patients does not grant them the underlying stability required to avoid readmission.

  ### Demonstration and Analysis

  **1. Variables**
  *   **Proxy (Metric):** Post-Discharge Survey Completion Rate.
  *   **Target (Outcome):** 30-Day Readmission Rate (specifically, the reduction thereof).
  *   **Common Cause:** Patient Social Stability & Health Literacy (hereafter "Patient Capacity").

  **2. Causal Structure**
  The directed acyclic graph (DAG) for the historical data is:
  `Patient Capacity → Survey Completion`
  `Patient Capacity → Low Readmissions`
  *(Note: There is no arrow from Survey Completion to Readmissions.)*

  **3. Historical Correlation**
  In the observational data, patients with high "Patient Capacity" (stable housing, strong support networks, high health literacy) were both more likely to navigate the friction of completing a survey and more likely to successfully manage their medication and follow-up care at home. Patients with low capacity struggled with both. This created a strong statistical association: high completion rates predicted low readmission rates. A reasonable analyst, seeing this correlation, would infer that engagement (measured by completion) drives safety.

  **4. Intervention Failure**
  The management intervention (the new app and reminders) acts as an external force on the **Survey Completion** node, effectively severing or weakening the arrow from `Patient Capacity → Survey Completion`. By making the survey easy to complete, the system forces the Proxy variable to change independently of the Common Cause. However, because there is no causal arrow from `Survey Completion → Readmissions`, changing the proxy transmits no signal to the target. The Readmission rate remains determined solely by `Patient Capacity`, which the app did not alter. Consequently, the metric moves (completion goes up), but the outcome stays static.

  **5. The Feature Doing the Work**
  The specific feature driving this failure is **confounding without causation**. The metric is a *symptom* of the desired state, not a *cause* of it. The failure is distinct from gaming because the data is accurate (patients really did complete the surveys). It is distinct from extrapolation because the failure would occur even if we raised completion from 40% to 50%; it is not about pushing the variable to an extreme, but about manipulating a non-causal lever.

  **6. Counterfactual: Removing the Feature**
  If we remove the confounding feature—meaning, if we posit that `Survey Completion` *does* causally reduce `Readmissions` (perhaps via psychological priming or data capture that triggers nurse intervention)—the case collapses into a **successful metric**. If the causal arrow existed, intervening on the proxy *would* move the target. Alternatively, if we kept the structure but allowed managers to fake the logs, it would collapse into **specification gaming** (Goodhart's Law in the traditional sense). This case is unique because the data is honest, but the inference is structurally invalid.

  **7. The Defense**
  A proponent of the metric would attack this case by arguing that the intervention was insufficiently "thick." They would claim that mere *completion* is not the active ingredient; rather, the *content* of the survey or the *act of thinking* about health questions is what matters. They would argue that by making the survey too easy (a "click-through" app), we diluted the cognitive engagement that actually provides the causal benefit. They would assert that the causal arrow *does* exist, but the intervention turned a "high-dose" engagement into a "low-dose" one, failing to activate the mechanism.

  **8. Confidence and Weakest Point**
  I am **85% confident** in the causal structure built here. It is a classic example of selection bias/confounding applied to operational metrics.

  The specific point I am **least sure about** is the absolute absence of a causal link between survey completion and readmissions. In reality, it is unlikely that the link is *zero*. Even a simple survey might prompt a patient to check their medication bottle, providing a small causal benefit. My thought experiment relies on this effect being negligible compared to the confounding effect of Patient Capacity. If the causal effect is non-zero, the metric wouldn't fail completely; it would just underperform expectations, which makes the "failure" less dramatic and harder to distinguish from noise in a real-world setting.
