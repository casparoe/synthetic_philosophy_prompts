answer: |-
  This is a classic debate in moral psychology: the **Situationist Challenge** (behavior is mostly determined by context) vs. **Virtue Ethics** (behavior stems from stable character traits). Your friend is trying to carve out a definition of "character" that survives the Situationist critique.

  Here is the breakdown of the rule she is likely using, the alternative, how they split on your case, and a new test to settle it.

  ### 1. The Rule She Is Running: **The Robust Disposition Rule**
  **Definition:** Character is a *psychological disposition* that produces consistent behavior *across varying situations and over time*, specifically because the internal mechanism (values, identity, will) is actively sustaining it.

  *   **Why it fits her 7 verdicts:**
      *   **Milgram / Good Samaritan / Hartshorne & May:** Rejected because the internal disposition *collapsed* or *varied* when the situation changed (pressure, time, domain). The behavior wasn't robust.
      *   **Tax Liar:** Rejected because the disposition is domain-specific (honesty isn't integrated into the whole self).
      *   **Food Bank / Kind Person:** Accepted because the behavior is sustained over time and across contexts by an active internal commitment.
      *   **Whistleblower:** Accepted because the disposition survived extreme situational pressure (career risk). The internal state was *more* robust than the situation.

  ### 2. The Alternative Rule: **The Behavioral Reliability Rule**
  **Definition:** Character is simply *reliable behavioral output* over time. If the action happens consistently, it counts as a trait, regardless of the mental state or mechanism driving it.

  *   **Why it fits her 7 verdicts:**
      *   **Milgram / Good Samaritan / Tax Liar:** Rejected because the behavior was *unreliable* (it stopped or changed).
      *   **Food Bank / Kind Person / Whistleblower:** Accepted because the behavior was *reliable* (it happened consistently or revealed a deep reliability under stress).
  *   **Note:** This rule is more "behaviorist." It doesn't care *why* you did it, only *that* you did it repeatedly.

  ### 3. Divergence on the Automatic-Donor Case
  This is the cleanest split between the two rules.

  *   **Behavioral Reliability Rule:** Says **YES, this is character.**
      *   *Reasoning:* 20 years of 10% giving is incredibly reliable. The output is stable across time. The mental state ("forget about it") is irrelevant; the trait of "generosity" is behaviorally real.
  *   **Robust Disposition Rule (Her Likely Rule):** Says **NO, this is not character.**
      *   *Reasoning:* The *mechanism* is not a disposition; it's a machine. The "generosity" is not being actively sustained by her psychology. If the bank account overdrafts or the charity is scandalized, would she notice? If she "forgets about it," her character isn't doing the work; the automation is. It lacks **active agency**.

  ### 4. The Additional Diagnostic Case
  If she hedges on the Automatic Donor (e.g., "Well, it's *weak* character..."), use this case to force a distinction between **Active Agency** (her likely rule) and **Pure Reliability**.

  **The Case: "The Broken Automation"**
  > "Imagine the same automatic donor. But one year, the payment system glitches and the donation doesn't go through.
  >
  > **Scenario A:** They never notice. The donation stops for 6 months until they randomly check their bank statement.
  > **Scenario B:** They get a notification, immediately fix it, and manually back-pay the missed months."

  *   **If she says Scenario A is NOT character, but Scenario B IS:**
      *   She is running the **Robust Disposition Rule**. She cares that the *person* is maintaining the behavior, not just the system. The "glitch" tested the internal disposition, and A failed while B passed.
  *   **If she says Scenario A IS character (because the previous 19 years were good):**
      *   She is running the **Behavioral Reliability Rule**. Past consistency outweighs current passivity.

  ### Summary for your argument
  Your friend is likely an **Aristotelian** about this. For Aristotle, virtue requires *phronesis* (practical wisdom) and choice. You cannot be virtuous by accident or inertia.
  *   **Her stance:** "Character is what you *do* when the situation tries to stop you, or when you have to *choose* to keep doing it."
  *   **Your counter:** "If the outcome is the same for 20 years, why does the mental machinery matter?"
  *   **The clincher:** The **Broken Automation** case. If the machine fails and they don't care, the virtue was never in them; it was in the script.
