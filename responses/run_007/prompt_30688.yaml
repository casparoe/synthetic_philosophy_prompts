      *This is the core tension.* I will build the activity around this specific moment of "Do we acknowledge the missing people?"

  12. **Finalizing the Plan:**
      *   **Activity:** "The Front Desk Protocol."
      *   **Setup:** 12 participants hold Room Cards (1-12).
      *   **Task:** Execute check-in instructions.
