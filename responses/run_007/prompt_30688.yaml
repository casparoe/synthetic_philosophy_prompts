      *   *Refinement:* To make the finitist objection feel real, the participants need to experience the *cost* of the moves. If moving a guest is just saying a number, it's too easy. If moving a guest requires physical action or logical verification, the "infinite regress" feels heavier.
      *   *Core Mechanic:* "The Shift." Participants hold cards representing rooms. They must physically swap or update numbers based on rules.
