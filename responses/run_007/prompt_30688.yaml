      *   **Requirements:** Rules, materials (simple), timeline, debrief (mapping to Cantor & Finitism), learning outcomes, honest limitations (what the activity *can't* do), prediction of failure points.
      *   **Constraint:** Be honest if the request is flawed (e.g., can a game make finitism feel live?).
      *   **Final Constraint:** One-sentence summary as the very last line.

  2.  **Deconstruct the Challenge:**
