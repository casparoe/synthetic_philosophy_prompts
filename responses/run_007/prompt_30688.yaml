      *   The finitist says: "An actual infinite collection cannot exist."
      *   The game shows: "Finite agents cannot manipulate an infinite collection."
      *   *Honest Note:* I must admit the game simulates *epistemic* limits (we can't see the end), not *ontological* limits (the end doesn't exist). The finitist claims the hotel is impossible *even for God*, not just for humans. The game might accidentally suggest it's possible but just hard for us. I need to structure the debrief to correct this.

