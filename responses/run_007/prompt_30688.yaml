      *   *The Goal:* Make the participants *feel* the friction of the infinite tasks. Make the "impossible" tasks physically or cognitively burdensome so the finitist objection arises naturally from frustration, not just theory.
      *   *The Constraint:* 10-14 people cannot physically represent an infinite hotel. We need a simulation or abstraction that *implies* infinity without requiring infinite props.
      *   *The "Honest Note":* Can a 90-minute game make finitism feel live? Probably not fully. Finitism is a metaphysical claim about the universe, not just a logistical complaint. The game can simulate the *absurdity*, but not the *impossibility*. I need to be clear about this.

