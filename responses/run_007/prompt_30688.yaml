  4.  **Developing the "Hilbert's Hotel: The Shift" Game:**
      *   **Setup:** 12 participants are "Room Keys" (numbered 1-12, but told they represent the *start* of an infinite chain). 2 participants are "Managers." 1 Facilitator.
      *   **Phase 1: The Full Hotel.** Establish that every room is occupied.
