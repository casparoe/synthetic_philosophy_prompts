      *   **Debrief:** Discuss what that authorization means metaphysically.

      *Wait, one more check on the Finitist objection.* The finitist doesn't just say "we can't do it." They say "it's contradictory." The activity needs to surface the contradiction. The contradiction is: "All rooms are full" AND "There is a vacant room."
      *   In the game: "All cards are held" AND "We need a card for the new guest."
