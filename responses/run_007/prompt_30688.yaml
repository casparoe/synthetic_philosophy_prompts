      *   *Activity:* "The Occupancy Audit."
      *   *Roles:* Guests (hold numbers), Clerk (tracks occupancy), Auditor (checks for contradictions).
      *   *Props:* Index cards (Room Numbers), Stickers (Occupied/Vacant).
      *   *Process:*
          1.  Fill the rooms (1-10 for simplicity, then extrapolate).
          2.  Announce: "Actually, this is an infinite hotel. You are the *front desk*."
          3.  Scenario A: One guest arrives. Solve it.
          4.  Scenario B: Infinite guests arrive. Solve it.
          5.  **Crucial Step:** The "Finitist Intervention." Half the group is assigned to play "Realists" who demand physical completion. The other half plays "Cantorians" who demand logical consistency.
      *   *Critique:* Assigning roles might make it artificial. Better to let the frustration emerge naturally, then label it in debrief.
      *   *Revised Plan:* The group *is* the Hotel Management. They must write the policy manual for handling arrivals. The Facilitator plays "Reality" and points out contradictions.

      *Let's try a physical simulation of the mapping.*
      *   12 People. Each holds a card: "Room 1", "Room 2"... "Room 12".
      *   They are told: "You are the first 12 rooms of an infinite hotel. All rooms are full."
      *   Task 1: Accommodate 1 new person. (Everyone passes their number up: 1 becomes 2, 2 becomes 3...).
      *   Task 2: Accommodate an infinite bus. (Evens move, Odds stay? Or $n \to 2n$).
      *   *The Friction:* When 1 moves to 2, who was in 2? They have to move to 3. Who was in 12? They have to move to 13. But there is no Person 13.
      *   *The Realization:* The chain never ends. The person at the "end" of the line (Person 12) is stuck. They represent the *conceptual* break.
      *   *This is good.* It highlights that finite agents cannot execute infinite tasks.

