      *   **Phase 3: The Infinite Bus.** The classic $n \to 2n$.
      *   **The Catch:** To make it feel real, we need to simulate the *completion* of the task. How do you know everyone moved?
      *   **Revised Mechanic:** Use a "Verification Protocol." You can't just say "everyone moved." You have to check. But you can't check infinity. This is where the friction lies.
      *   **Better Mechanic:** Focus on the *instruction*. The Facilitator gives an instruction. The group must devise a *procedure* to execute it. If the procedure requires a "last step," they fail.
      *   **Best Mechanic for this Group:** "The Human Algorithm." Participants stand in a line. They pass tokens. The goal is to accommodate new guests. The friction comes from trying to define *when* the job is done.

