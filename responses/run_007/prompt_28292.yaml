answer: |-
  This is a classic debate in probability and decision theory, often framed as "Expected Value vs. Kelly Criterion" or "Ensemble vs. Time Average." Both friends are deploying standard arguments, but one is fundamentally misapplying a mathematical concept to a physical reality.

  Here is the adjudication, move by move.

  ### Move 1: Alex's Opening
  **Claim:** Each dollar has +20c expected profit; not staking max leaves money on the table.
  **Rating:** **Mathematically Right, Contextually Misleading.**
  **Adjudication:** Alex is arithmetically correct. For a single bet, $E[\text{Return}] = 0.6(1) + 0.4(-1) = 0.2$. If your utility function is linear (wealth = utility), maximizing expected terminal wealth requires betting 100% of your bankroll. However, the phrase "leaving money on the table" implies this is a universally superior strategy, which ignores the mechanism of compounding.
  **Point:** Alex wins on simple arithmetic expectation.

  ### Move 2: Sam's Rebuttal
  **Claim:** Kelly says bet 20%; betting everything means 40% chance of ruin per round.
  **Rating:** **Clearly Right.**
  **Adjudication:** Sam is correct on the Kelly formula ($f^* = p - q = 0.6 - 0.4 = 0.2$). Sam is also correct that betting 100% ($f=1$) incurs a 40% probability of total loss in the very first round. In a repeated game, the probability of eventual ruin for $f=1$ approaches 100% as rounds increase.
  **Point:** Sam wins on probability of ruin and growth optimization.

  ### Move 3: Alex's Counter 1
  **Claim:** Kelly maximizes expected *log* wealth; for finite/single rounds, risk-neutral agents maximize expected wealth.
  **Rating:** **Clearly Right.**
  **Adjudication:** Alex correctly identifies the mathematical objective functions. Kelly maximizes the geometric mean (expected logarithm of wealth). Expected Wealth maximization (arithmetic mean) is the definition of risk neutrality. If an agent truly has linear utility, Alex's strategy is the rational choice for a single shot.
  **Point:** Alex wins on the definition of risk neutrality and utility functions.

  ### Move 4: Sam's Counter 1
  **Claim:** "Risk-neutral" is doing the work; max expected wealth goes bust *almost surely*; EV is driven by tiny probability of astronomical wealth.
  **Rating:** **Clearly Right.**
  **Adjudication:** This is the pivot point. Sam correctly identifies that the "Expected Wealth" of the All-In strategy is an illusion created by outliers. As $N \to \infty$, the probability of survival for the All-In strategy goes to zero, yet the *Expected Value* goes to infinity because the few surviving paths have infinite wealth. For a single trajectory (a real person), the "almost surely" outcome (ruin) is the only one that matters.
  **Point:** Sam wins on the behavior of the distribution over time.

  ### Move 5: Alex's Counter 2
  **Claim:** That's the long-run point again; for one bet, betting small isn't more rational than betting big.
  **Rating:** **Right.**
  **Adjudication:** Alex is correct that for $N=1$, the Kelly bet is suboptimal for a risk-neutral agent. First-order stochastic dominance favors the larger bet if utility is linear. Sam cannot invoke "long run" statistics to dictate a single-period decision without assuming risk aversion.
  **Point:** Alex wins on single-period logic.

  ### Move 6: Sam's Counter 2
  **Claim:** You never face exactly one bet; rationality is about policies over a life; betting everything policy is ruinous.
  **Rating:** **Clearly Right.**
  **Adjudication:** Sam correctly shifts the frame from "act" to "rule." Decision theory generally evaluates policies, not isolated acts, especially when wealth carries over. A policy of "bet everything on positive EV" leads to extinction. A rational agent who values continued existence cannot adopt a policy that guarantees ruin with probability 1 over a lifetime.
  **Point:** Sam wins on the definition of rational policy.

  ### Move 7: Alex's Counter 3
  **Claim:** Policy can be re-evaluated; dynamic consistency says if I care about expected final wealth at horizon, I bet everything every round.
  **Rating:** **Mathematically Right, Philosophically Flawed.**
  **Adjudication:** Alex is correct about dynamic consistency *given the objective*. If your goal is strictly $E[W_T]$, then at $T-1$ you should bet all, and by backward induction, at $T=0$ you should bet all. However, this highlights the absurdity of the objective, not the validity of the strategy. It is dynamically consistent to walk off a cliff if your only goal is to maximize downward velocity.
  **Point:** Alex wins on internal consistency, but the premise is the weakness.

  ### Move 8: Sam's Counter 3
  **Claim:** In real life 60% is an estimate; betting full Kelly on an estimate is overbetting.
  **Rating:** **Practically Right, Technically Off-Topic.**
  **Adjudication:** Alex called this earlier: the setup stipulated a "genuine 60%." Sam is violating the constraints of the thought experiment. However, Sam is invoking a robust principle (parameter uncertainty) that protects against model error. In the context of the specific argument, Alex is right to call foul, but Sam is right about the real world.
  **Point:** Alex wins the point on rules; Sam wins on wisdom.

  ---

  ### What Both Are Missing: Ergodicity

  Both friends are arguing past each other because they are missing the concept of **Ergodicity**.

  *   **Alex is calculating the Ensemble Average:** He imagines 1,000 parallel universes where you place the bet. In most, you go broke. In a few, you become a god. The *average* wealth across those universes is massive. He treats this average as if it applies to you.
  *   **Sam is calculating the Time Average:** He looks at one person moving through time. In this single timeline, you cannot access the "average" of the parallel universes. You experience the compounding of your specific path.

  In multiplicative systems (like betting with compounding bankrolls), the system is **non-ergodic**. The time average does not equal the ensemble average.
  *   Alex is right that the *Ensemble Average* is maximized by betting everything.
  *   Sam is right that the *Time Average* (what you actually experience) is maximized by Kelly.

  The missing realization is that **Expected Value is physically irrelevant for a single agent in a non-ergodic system.** Alex's "Risk Neutral" assumption requires the agent to be able to average across parallel universes. Since no human can do that, "Risk Neutrality" is an incoherent objective for repeated betting.

  ### Final Verdict

  **Sam is more right overall.**

  Here is the definitive position: Alex is playing a math game; Sam is playing a survival game. Alex's math is correct within the axioms of linear utility, but those axioms are incompatible with the physical reality of repeated betting.

  A strategy that leads to ruin with probability 1 as $N \to \infty$ cannot be labeled "rational," regardless of the expected value, because an expected value of infinity is useless to an agent with zero wealth. Sam correctly identified that the "Expected Wealth" metric is being driven by outcomes that will almost certainly not happen to you.

  Alex's defense rests entirely on the "Risk Neutral" axiom. But in a repeated game where you cannot replenish your bankroll from outside sources, true risk neutrality is impossible because ruin is absorbing (you stop playing). Therefore, Sam's argument that rationality requires a policy of survival (Kelly) overrides Alex's argument for arithmetic maximization.

  **Winner: Sam.**
  **Reason:** In non-ergodic dynamics, maximizing the geometric mean (Kelly) is the only strategy that guarantees growth for a single trajectory. Maximizing the arithmetic mean (Alex) is a category error that confuses parallel universes with time.
