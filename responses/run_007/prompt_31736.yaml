answer: |-
  ### I. The Desiderata for Adequate Teleosemantics

  **1. The Normativity Constraint**
  *   **Requirement:** The theory must explain how a representation can be *false* while the mechanism functions normally. It must ground the possibility of error, not merely deviation.
  *   **Forcing Case:** **Misrepresentation.** A frog's visual system fires at a passing BB. The mechanism is operating as designed (no malfunction), yet the content "fly" is false. A mere causal theory cannot distinguish a mistake from a different kind of success.
  *   **Crucial Distinction:** **Indication ≠ Representation.** A thermometer indicates temperature but cannot misrepresent it (if it breaks, it indicates nothing). Representation requires a norm that allows for failure amidst normal operation.

  **2. The Determinacy Constraint**
  *   **Requirement:** The theory must assign a unique, specific content to a state, ruling out logically equivalent disjunctions.
  *   **Forcing Case:** **Content Indeterminacy / The Disjunction Problem.** Evolution selects for survival. A state that correlates with "fly" also correlates with "fly-or-BB-at-t1." If the function is just "catch food," the content could be "food," "fly," "black moving speck," or "fly-or-BB." The theory must explain why it is *fly* and not the disjunction.
  *   **Empirical Flag:** **Selection for Disjunctions.** Biologists often acknowledge that selection acts on phenotypes that produce multiple effects. A theory cannot simply assume a one-to-one mapping between a trait and a single selected effect without biological justification.

  **3. The Distality Constraint**
  *   **Requirement:** Content must be anchored to the distal object of ecological significance, not the proximal causal trigger.
  *   **Forcing Case:** **The Distality Problem.** The immediate cause of the frog's neuron firing is a retinal shadow or a pattern of optic nerve stimulation. The *content*, however, is the fly. A theory based purely on causal chains terminates at the receptor; teleosemantics must explain the normative leap to the distal object.
  *   **Crucial Distinction:** **Selected-for Property ≠ Content.** Just because a trait was selected for catching flies doesn't automatically mean the neural state represents "fly." It might represent "prey" or "nutrient." The theory must bridge the gap between the biological function and the specific intentional content.

  **4. The Novelty Constraint**
  *   **Requirement:** The theory must account for representations of stimuli or states of affairs the organism (and its ancestors) never encountered during the period of selection.
  *   **Forcing Case:** **Novel Contents.** A human can represent a "nuclear explosion" or a "unicorn." No evolutionary history of selection exists for these specific stimuli. The theory must explain how historical functions ground content for entirely new categories without collapsing into current-use pragmatism.
  *   **Empirical Flag:** **Exaptation and Plasticity.** Biological systems are often co-opted for new uses (exaptation) or exhibit high neural plasticity. A rigid "lock-and-key" historical view fails to capture the flexibility of cognitive systems.

  **5. The History Constraint**
  *   **Requirement:** The theory must take a stance on whether evolutionary history is constitutive of content or merely explanatory.
  *   **Forcing Case:** **Swampman.** A molecule-for-molecule duplicate of a human arises from a lightning strike in a swamp, with no evolutionary history. Does it have thoughts? If history is constitutive, it does not. If the theory says it does, it must explain what grounds the normativity without selection.
  *   **Crucial Distinction:** **Function ≠ What the Thing In Fact Does.** A heart's function is to pump blood even if it is currently stilled. Similarly, a representation has content based on what it *was supposed to do*, not what it is currently doing. Swampman tests whether "supposed to" requires a past selector.

  **6. The Biological Plausibility Constraint**
  *   **Requirement:** The ascription of proper functions must align with actual practices in evolutionary biology, not a philosopher's idealization of selection.
  *   **Forcing Case:** **Multiple Selected Effects.** Traits are rarely selected for a single effect in isolation (pleiotropy, linkage). A gene might be selected for heart development but also affects lung capacity.
  *   **Empirical Flag:** **Trait Individuation.** Biologists struggle to individuate traits for selection analysis. A teleosemantic theory cannot assume traits come pre-individuated with single functions. It must provide a principled way to isolate the relevant function that grounds content without arbitrary stipulation.

  ***

  ### II. Incompatible Pairs and Trade-offs

  Your suspicion is correct: **Determinacy and Strict Naturalism are in tension.**

  To satisfy the **Determinacy Constraint**, you must isolate a single selected effect (e.g., catching flies) from the causal web (e.g., catching flies-or-BBs). However, to satisfy **Strict Naturalism**, you must derive this isolation solely from non-intentional historical/causal facts. The problem is that the historical record underdetermines the content. History tells us the organism survived, but it does not specify *which* description of the environment was the condition of success.

  To fix determinacy, theorists often sneak in a normative filter (e.g., "the content is what the system was *designed* to detect"). But "designed" here either appeals to the very intentional content we are trying to define (circularity) or appeals to an idealized selection condition that doesn't exist in the messy empirical record (violating Biological Plausibility). You can have determinacy if you allow idealized norms, or you can have naturalism if you accept indeterminacy, but securing both simultaneously requires a theoretical maneuver that usually collapses one of the two.

  A secondary tension exists between the **History Constraint** and the **Novelty Constraint**. If content is rigidly fixed by past selection (History), it is difficult to explain how we represent novel stimuli (Novelty) without saying the content is something generic (like "food"), which violates Determinacy. If you allow content to be flexible enough for novelty, you weaken the claim that history is constitutive, edging toward a current-role functionalism that loses the distinctively teleological grounding.

  ***

  ### III. The Single Killer Requirement

  **The Determinacy Constraint.**

  This is the requirement that rules out the most popular versions of the view (specifically simple Consumer-Based and Indicator theories). Indicator theories fail immediately because they cannot distinguish error from indication. But among genuine teleosemantic accounts, the demand for determinacy is the graveyard. Most versions rely on a "Selected Effect" analysis that is too coarse-grained to rule out disjunctive contents without appealing to the organism's current perspective or ideal conditions. Once you invoke "ideal conditions" to sharpen the content, you have compromised the naturalistic commitment to actual history. If you stick to actual history, you cannot rule out the disjunction. Consequently, no existing version fully satisfies Determinacy without sacrificing Biological Plausibility or Strict Naturalism.

  ***

  ### IV. Scorecard

  **Indicator/Covariation Views**
  *   **Status:** Failed.
  *   **Assessment:** These views satisfy Naturalism and Distality well by tying content to causal regularities. However, they collapse the distinction between Indication and Representation, making misrepresentation impossible (a false signal is just a different indication). They fail the Normativity Constraint outright.

  **Consumer-Based Views (Millikan/Neander)**
  *   **Status:** Dominant but Vulnerable.
  *   **Assessment:** These views handle Normativity and Misrepresentation best by grounding content in the success conditions of downstream systems. However, they struggle significantly with the Distality and Determinacy constraints, often unable to specify *which* distal object is represented without circular appeal to the content itself. They also face pressure from the Novelty Constraint.

  **Hybrid/Two-Factor Views**
  *   **Status:** Compromised.
  *   **Assessment:** These attempt to combine historical functions with current causal roles to solve Novelty and Determinacy. While they offer better coverage of Novelty, they risk diluting the teleological core, effectively becoming functionalist theories with a historical gloss. They often fail to provide a unified principle for when history trumps current role, violating the Determinacy Constraint in borderline cases.
