  Then the part I actually care about: tell me which pairs of desiderata you think can't be jointly satisfied. I have a suspicion that determinacy and genuine naturalism pull against each other, but don't just tell me I'm right; work it out. Which single requirement, if you had to pick, rules out the most popular versions of the view? Then give me a quick scorecard, two or three sentences each, for the main flavors (indicator/covariation views, consumer-based views, hybrids) against the list. Keep the scorecard brief; the list is the deliverable. And please no reading list or citations, I just want the substantive list.

  Take your time and think it through carefully. Maybe start by brainstorming candidate requirements before you settle on the final list, and don't pad or tell me what teleosemantics is in general—I already know that.
