      *   *Is it Verbal?* Yes, significantly. "Democracy," "Representation," "Accountability," and even "Competence" are loaded terms. Sortitionists define democracy as "rule by the people" (literal), while electionists define it as "choice of leaders" (procedural).
      *   *Is it Normative?* Deeply. This is the core. It's about what we value more: *Legitimacy through consent* (elections) vs. *Legitimacy through inclusion* (sortition). It's about the telos of government: Is it to aggregate preferences? To deliberate truth? To prevent tyranny?
