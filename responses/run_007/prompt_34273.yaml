          *   What cases *must* it handle? (Ring species, asexuals, HGT, fossils/chronospecies).
          *   What distinctions must it preserve?
          *   What biological results must it not contradict?
          *   Ontological status (real vs. constructed).
          *   Flag non-negotiable vs. camp-specific.
          *   Identify the "killer" requirement (the one that breaks most theories).
          *   Identify incompatible requirements (trade-offs).
          *   Briefly note how main approaches (BSC, PSC, ESC) fare against the hardest requirement.
      *   **Tone:** Informative, structured, slightly conversational but rigorous (matching the user's "rabbit hole" vibe).
      *   **Constraint:** Do not write a full scorecard for every theory, just the criteria and reasoning.

  2.  **Deconstruct the "Species Problem":**
      *   The core issue is that "species" is used in multiple ways (taxonomic unit, evolutionary lineage, reproductive community, ecological niche).
      *   No single definition covers all life (bacteria vs. mammals vs. fossils).
      *   There's a tension between *process* (how species form) and *pattern* (how we identify them).
      *   There's a tension between *ontology* (are they individuals or classes?).

  3.  **Drafting the Desiderata (The Checklist):**
      *   *Requirement 1: Universality.* Must apply to all life (sexual, asexual, prokaryotic, eukaryotic).
          *   *Why:* Life isn't just mammals. Bacteria exist.
          *   *Status:* Non-negotiable for a *general* theory, but many theories concede this.
      *   *Requirement 2: Temporal Stability (The Fossil Problem).* Must handle lineage splitting over time without arbitrary cutoffs.
          *   *Why:* Evolution is continuous; taxonomy is discrete. Chronospecies.
          *   *Status:* Non-negotiable for evolutionary consistency.
      *   *Requirement 3: Operationalizability.* Scientists need to be able to identify species in the field/lab.
          *   *Why:* If you can't measure it, it's metaphysics, not science.
          *   *Status:* Highly desired, but sometimes sacrificed for theoretical purity.
      *   *Requirement 4: Explanatory Power.* It shouldn't just name things; it should explain *why* they cluster (evolutionary independence).
          *   *Why:* Species are supposed to be units of evolution.
          *   *Status:* Non-negotiable for evolutionary biology.
      *   *Requirement 5: Ontological Clarity.* Are they individuals (spatiotemporally restricted) or natural kinds (classes)?
          *   *Why:* Affects how we treat variation and laws.
          *   *Status:* Philosophical, but impacts theory structure.

  4.  **Identifying the "Killer" Requirement:**
      *   What breaks the Biological Species Concept (BSC)? Asexuals.
      *   What breaks the Phylogenetic Species Concept (PSC)? Over-splitting (every mutation makes a new species).
      *   What breaks everyone? *The Continuity of Evolution vs. The Discreteness of Categories.*
      *   *Decision:* The "Universality vs. Mechanism" tension is the big one. Specifically, **accommodating asexuals/prokaryotes while retaining evolutionary significance for sexuals.**
      *   *Actually, the deeper killer:* **The Sorites Paradox (Vagueness).** Evolution is gradual; species are discrete. Any hard line is arbitrary.
      *   *Refinement:* The prompt asks for *the* single requirement that kills the most popular theories. That's usually **Universality (specifically Asexuals/HGT)**. The BSC is the most popular historically, and it dies immediately at bacteria.
      *   *Wait, a better candidate:* **Operationalizability vs. Theoretical Accuracy.** Most accurate theories (like General Lineage Concept) are hard to measure. Most measurable ones (morphological) are theoretically weak.
      *   *Best fit for "Killer":* **Accommodating Evolutionary Continuity (The Fossil/Time Problem).** Almost all static concepts fail here. But the *real* showstopper is **Universality across Modes of Reproduction.**

  5.  **Identifying Incompatible Requirements (The Trade-off):**
      *   You can't have *sharp boundaries* AND *evolutionary continuity*.
      *   You can't have *universal applicability* AND *mechanism-specific explanatory power* (e.g., reproductive isolation explains mammals well, but means nothing for bacteria).
      *   *The Big Conflict:* **Discreteness (for classification) vs. Continuity (for evolution).**

  6.  **Reviewing Main Approaches against the Hardest Requirement:**
      *   *Hardest Requirement:* Universality (Asexuals/Prokaryotes).
      *   *BSC:* Fails completely.
      *   *PSC:* Works technically, but leads to inflation.
      *   *Ecological:* Better, but hard to measure.
      *   *General Lineage Concept (GLC):* Tries to solve it by abstraction.

  7.  **Structuring the Response:**
      *   **Intro:** Acknowledge the depth of the rabbit hole.
