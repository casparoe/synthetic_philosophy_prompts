answer: |-
  You have stumbled into the "Species Problem," which is arguably the oldest, messiest, most productive deadlock in the philosophy of biology. You are right to ask for a checklist before reading the papers, because most papers assume a checklist that differs from their opponents'.

  Here is the desiderata list for a theory of species, categorized by what biology demands versus what philosophy debates.

  ### I. The Desiderata Checklist

  #### 1. Universality (The "Life is Diverse" Requirement)
  *   **The Requirement:** The theory must apply to sexual eukaryotes, asexual eukaryotes, prokaryotes (bacteria/archaea), and hybrids.
  *   **Why:** Life does not care about your definition. Bacteria exchange genes horizontally (HGT); bdelloid rotifers haven't had sex in 40 million years; plants hybridize constantly. If your theory defines species by "interbreeding," you have just declared bacteria and rotifers do not belong to species.
  *   **Status:** **Non-Negotiable** for a *general* theory of biology. (However, many theorists concede this and aim for a "local" theory just for vertebrates).

  #### 2. Evolutionary Continuity (The "Time" Requirement)
  *   **The Requirement:** The theory must account for speciation as a process over time without requiring an arbitrary "snap" where Species A becomes Species B. It must handle *chronospecies* (lineages changing in the fossil record).
  *   **Why:** Evolution is gradual; taxonomy is discrete. If you require a hard boundary, you must explain exactly which generation constitutes the boundary. If you can't, your theory contradicts the mechanism of evolution (anagenesis).
  *   **Status:** **Non-Negotiable** for any theory claiming to be evolutionary.

  #### 3. Operationalizability (The "Field Biologist" Requirement)
  *   **The Requirement:** There must be a feasible method for a scientist to determine if two organisms belong to the same species using available data (morphology, DNA, behavior).
  *   **Why:** If the definition is "a separately evolving metapopulation lineage," that is ontologically sound but impossible to observe directly in real-time. If a concept cannot be applied to identify specimens, it fails as a taxonomic tool.
  *   **Status:** **Contested.** Theorists often sacrifice this for accuracy; taxonomists sacrifice accuracy for this.

  #### 4. Explanatory Power (The "Why Clusters?" Requirement)
  *   **The Requirement:** The theory must explain *why* organisms cluster into distinct groups rather than forming a continuous smear of variation. It must identify the *mechanism* maintaining the gap.
  *   **Why:** Without this, "species" is just a label for similarity. We need to know if the gap is maintained by reproductive isolation, ecological selection, or genetic drift.
  *   **Status:** **Non-Negotiable** for evolutionary biology.

  #### 5. Ontological Individuality (The "Real vs. Name" Requirement)
  *   **The Requirement:** The theory must state whether a species is a *natural kind* (a class defined by properties, like "gold") or an *individual* (a historical entity with a birth and death, like "The Roman Empire").
  *   **Why:** If species are individuals (the Ghiselin-Hull Thesis), they cannot have "laws" apply to them universally (you can't have a law of "Human biology" that applies to all time, only to that specific lineage). If they are classes, variation is accidental. This dictates how you treat variation and extinction.
  *   **Status:** **Camp-Specific.** Most evolutionary biologists accept the "Individuality Thesis," but many ecologists and traditional taxonomists still treat them as natural kinds.

  ---

  ### II. The "Killer" Requirement

  If you want to know which requirement slaughters the most popular theories, it is **Universality (specifically regarding Asexuals and HGT).**

  **Why it kills theories:**
  The **Biological Species Concept (BSC)** is the most famous and intuitively satisfying theory (Species = Reproductive Community). It explains why lions and tigers are different (they don't make fertile offspring).
  *   **The Kill:** It literally cannot process asexual organisms. Under strict BSC, every asexual individual is its own species, or no asexual organisms belong to species at all. Given that asexual life dominated Earth for billions of years and still constitutes massive biomass, a theory that excludes it is biologically insufficient.
  *   **Secondary Kill:** It also struggles with **Allopatry**. If two populations are geographically separated, they *could* interbreed but *don't*. Are they the same species? BSC relies on "potential" interbreeding, which is a counterfactual claim that is hard to verify.

  ---

  ### III. The Incompatible Pair (The Trade-Off)

  There is a fundamental tension that suggests no single theory can satisfy all desiderata. The incompatible pair is:

  **Sharp Boundaries (Discreteness) VS. Evolutionary Reality (Continuity)**

  *   **Side A (Sharp Boundaries):** To be useful for classification, law, and conservation, species need to be discrete boxes. An organism is either in the box or out of it.
  *   **Side B (Evolutionary Reality):** Speciation is a process, not an event. Populations diverge gradually. Ring species (A breeds with B, B with C, C doesn't with A) prove that reproductive isolation is not binary.
  *   **The Conflict:** If you enforce Sharp Boundaries, you must draw an arbitrary line through a continuous process (violating Evolutionary Reality). If you respect Evolutionary Reality, you must admit that "species" is a vague, fuzzy concept that sometimes lacks a true/false value (violating Sharp Boundaries).

  **The Verdict:** You cannot have a theory that is both **ontologically precise** (no vagueness) and **empirically accurate** (fits the messy data of evolution). Most theories pick one and apologize for the other.

  ---

  ### IV. Scorecard Snapshot: Main Approaches vs. The Killer

  Here is how the big three handle the **Universality (Asexuals)** requirement, which is the empirical graveyard.

  | Concept | Core Definition | Performance on Universality (Asexuals/HGT) | Performance on Continuity (Fossils/Time) |
  | :--- | :--- | :--- | :--- |
  | **Biological (BSC)** | Reproductive Isolation | **FAIL.** Cannot apply to asexuals. Treats every asexual clone as a distinct species or none. | **POOR.** Hard to apply to fossils (can't test breeding). Struggles with ring species. |
  | **Phylogenetic (PSC)** | Smallest Monophyletic Group | **PASS (Technically).** DNA works on asexuals. | **RISK.** Tends to "oversplit." Every unique mutation creates a new lineage, potentially making every individual a species. |
  | **Ecological (ESC)** | Distinct Niche/Adaptive Zone | **GOOD.** Asexuals occupy niches. | **GOOD.** Niches can be tracked in fossils. | **HARD.** Measuring "niche" is notoriously difficult and subjective. |
  | **General Lineage (GLC)** | Separately Evolving Metapopulation | **PASS.** Abstracts the *process* rather than the *mechanism*. | **PASS.** Acknowledges speciation is a process. | **VAGUE.** "Separately evolving" is hard to measure operationally. |

  ### Summary for your Rabbit Hole
  1.  **Don't look for the "True" Definition.** The consensus in modern philosophy of biology (led by Kevin de Queiroz) is that "Species" is a theoretical term referring to **lineages**, and the various concepts (BSC, PSC, ESC) are just different **properties** used to identify those lineages.
  2.  **The Real Fight:** Is not about definition, but about **Pluralism**. Can we accept that "species" means one thing for bacteria, another for birds, and another for fossils? Or must there be one Unified Theory?
  3.  **The Trap:** If a paper claims to solve the species problem, check if they have silently excluded asexuals or fossils to make the math work. If they haven't, check if they have made the definition so vague it can't be tested.

  **Your checklist for reading papers:** Does this theory handle bacteria? Does it handle time? Does it admit vagueness? If it says "Yes, Yes, and No," it's probably dogma, not science.
