prompt: |-
  ok so i've been going down a rabbit hole about the species problem — like, what even IS a species? — and before i read fifty papers arguing past each other i want to know what i should actually be asking of a theory here. like someone needs to write down the checklist. what does a theory of what a species is have to get right to even count as a contender?

  i know the obvious trouble cases: ring species where A breeds with B and B with C but A and C can't breed, asexual organisms that don't breed at all, bacteria doing horizontal gene transfer so the whole "reproductive isolation" thing is meaningless. and then there's the fossil thing — if you have a smooth evolutionary lineage, where do you draw the line between species? like, at what point does a chronospecies become a different species? and theres also the philosophical question of whether species are real things out there in nature or just boxes we made up because our brains like categories.

  so yeah — give me the desiderata. what cases does a good theory of species HAVE to handle, what distinctions can't it collapse, what results from biology can't it contradict? for each one tell me WHY it's a requirement (like what's the specific example or consideration that makes it something you can't just handwave away). flag which are non-negotiable and which are just things certain camps insist on.

  and if you can, tell me which single requirement is the one that kills the most popular theories — like which one is the real problem that most accounts just can't deal with. and if there's any pair of requirements that can't be satisfied at the same time, that's the part i most want to know about.

  i don't need a full scorecard for every theory, just the criteria and the reasoning behind them. maybe a quick note on how the main approaches (biological species concept, phylogenetic, ecological, etc.) do against the hardest requirement.
