      *   *Weaknesses/Risks:* Kant's text is notoriously dense and sometimes inconsistent. The "duty of truthfulness" is often framed by Kant as a formal duty of right *and* an ethical duty. The distinction between Right and Virtue is clear in the *MoM*, but in the *On a Supposed Right to Lie* essay, Kant's language can blur these lines. The "duty to oneself" regarding lying is still pretty strict in the *MoM*.

  3.  **Addressing Question (a): Does the distinction do the work? (Right vs. Virtue)**
      *   *Right (Recht):* Concerns external freedom, coercion, and compatibility of choices. Lying in a contract or legal statement violates Right.
      *   *Virtue (Tugend):* Concerns ends, maxims, and internal freedom. Lying violates the duty to oneself (integrity).
      *   *The Problem:* In the *Murderer* essay, Kant talks about "truthfulness" (*Wahrhaftigkeit*) as a duty that seems unconditional. In the *Doctrine of Virtue*, lying is a violation of a perfect duty to oneself. It's not "nuanced" there; it's pretty strict. So, while the *juridical* reading explains the liability point, the *ethical* reading doesn't necessarily grant permission to lie. It might just say "You shouldn't lie, but the state can't punish you for it."
      *   *Verdict:* The distinction explains the *liability* point well, but it doesn't necessarily save Kant from the "absolutist" charge on the ethical front. The ethical duty is still strict.

