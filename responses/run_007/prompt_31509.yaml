      *   *Specific Terminology:* **The Use-It-Or-Lose-It Dilemma** (related to crisis stability), **Pre-delegation**, **Negative vs. Positive Control**. The specific paradox is often called the **Credibility-Safety Paradox** or discussed within **Nuclear Command and Control (NC3) Trade-offs**.

