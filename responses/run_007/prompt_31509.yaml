      *   *Name:* The **Stability-Instability Paradox**.
      *   *Key Authors:* Glenn Snyder (who coined it), Robert Jervis, S. Paul Kapur (regarding India/Pakistan).
      *   *Mechanism:* If both sides know escalation to nuclear war is suicidal, they feel safe engaging in lower-level conflicts, assuming the other side won't escalate to the nuclear level over a minor provocation.
      *   *Relation to Pattern 2:* It's related but distinct. It relies on the *existence* of secure second-strike capabilities (MAD), not necessarily the *mechanisms* of delegation (Pattern 2).

