answer: |-
  You are absolutely not being petty. In fact, you've stumbled onto a classic problem in moral philosophy without realizing it. Your gut feeling is spotting a flaw in the ethical framework you're using, not in your own generosity.

  Here is the breakdown of why this feels wrong, the philosophical concept that describes it, and how to fix the system without making Callum the villain.

  ### 1. The Philosophical Problem: The "Utility Monster"
  In 1974, philosopher Robert Nozick proposed a thought experiment called the **Utility Monster**.

  Imagine a being who gets 1,000 times more happiness from a cookie than you do. If your ethical goal is simply "maximize total happiness in the universe" (classical Utilitarianism), then logic dictates you should give *all* the cookies to the Monster. You get a tiny bit of sadness from not having a cookie; the Monster gets an astronomical amount of joy. The math says the Monster wins every time.

  Callum is your household Utility Monster.

  The problem with Utilitarianism in a social context is that it ignores **distribution**. It cares about the *sum* of happiness, not how that happiness is shared. If you run a house purely on "happiness-per-dollar," you aren't running a community; you are running an efficiency engine. And as you noted, the other four of you have become fuel for that engine.

  ### 2. Why the Math is Lying to You
  The spreadsheet Callum made is logically sound but sociologically flawed. Here is why the "happiness-per-dollar" metric fails in a group living situation:

  *   **Agency and Ownership:** A shared fund implies shared ownership. If 100% of the budget buys things only Callum deeply cares about, the other four housemates are no longer stakeholders; they are donors. Losing agency creates resentment, even if you benefit slightly from the projector.
  *   **The Baseline of Comfort:** Shared purchases usually serve two functions: **Utility** (a vacuum, a pot, a table) and **Luxury** (a projector, a fancy sofa). If Callum's joy overrides the need for baseline utility items that others might need (e.g., someone needs a better desk chair for work, or the kitchen needs new knives), the house becomes less functional for the majority to support the luxury of the one.
  *   **Diminishing Returns on Social Cohesion:** The "cost" isn't just dollars; it's social capital. Every time the group bypasses your preferences for Callum's, the bond weakens. Eventually, the resentment will outweigh the joy Callum gets from the projector. The "math" doesn't account for the cost of a fractured house dynamic.

  ### 3. The Fairness Framework
  Most people operate on a **Rawlsian** or **Egalitarian** framework in friendships and housing, not a Utilitarian one.

  *   **Egalitarian:** We all put in equal money; we should all get roughly equal benefit or say.
  *   **Rawlsian:** We should make decisions based on what is fair for the least advantaged person. In this case, the "least advantaged" are the four of you whose preferences are consistently overruled.

  If you wouldn't trade places with Callum (i.e., would you be okay if *you* were the only one whose preferences mattered for a year?), then the system is unfair.

  ### 4. How to Fix It (Without Blaming Callum)
  Callum isn't a villain. He is simply playing the game by the rules you all set. He found an exploit in the system. You don't need to shame him; you need to patch the game.

  Here is how to restructure the budget:

  **A. The "Veto" or "Consensus" Rule**
  Shift from "Maximum Happiness" to "Minimum Acceptability." No shared purchase happens unless *everyone* is at least okay with it. Callum can still advocate for the projector, but he has to convince you that *you* want it too, not just that *he* will love it.

  **B. Categorize the Fund**
  Split the budget into two buckets:
  1.  **Necessities/Infrastructure:** (Kitchen gear, cleaning supplies, essential furniture). Decisions made by consensus or majority vote based on need.
  2.  **Fun/Luxury Fund:** This is where the projector lives. If this fund is smaller, Callum can save up for his toys without consuming the budget for new pots and pans.

  **C. Rotation System**
  If you want to keep the "Fun Fund," rotate who gets to pick the item each month.
  *   *Month 1:* Callum picks.
  *   *Month 2:* You pick.
  *   *Month 3:* Housemate B picks.
  This ensures agency is distributed, even if Callum enjoys his month more intensely than you enjoy yours.

  **D. The "Use-Case" Test**
  For an item to be "shared," it needs to be used by more than one person. If Callum is the only one who will watch the projector, is it a shared purchase? Or is it a subsidy for his hobby? If it's the latter, perhaps the house covers 20% (as a gift) and he covers 80%.

  ### Summary
  You are not being petty. You are recognizing that **fairness matters more than efficiency** in human relationships.

  If you continue on the current path, you will eventually resent Callum, and he will be confused because "he didn't do anything wrong." He didn't. The metric was wrong.

  **The Script for the House Meeting:**
  *"Callum, your spreadsheet is amazing, and we love how much you enjoy our stuff. But we've realized that optimizing purely for 'total happiness' makes the rest of us feel like we're just funding your hobbies rather than building a home together. We want to change the rules so everyone gets a turn picking the fun stuff, even if the 'joy-per-dollar' is lower. We value fairness over efficiency."*

  Change the framework, save the friendship, and buy the projector only if everyone actually wants to watch movies.
