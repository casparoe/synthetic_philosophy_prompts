          *   Address "Skepticism." Quine hated skepticism. He was a naturalist. He didn't think we were cut off from reality; he thought our *concept* of "meaning" was flawed.
          *   Address "Cultural Humility." This is a Rortyan or anthropological spin, not Quine's. Quine doesn't care about feelings; he cares about ontology.
      *   *The "Right Reading":* What *was* Quine arguing?
          *   Behaviorism: Meaning is use/disposition.
