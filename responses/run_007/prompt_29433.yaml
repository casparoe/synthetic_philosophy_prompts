answer: |-
  This is a sophisticated position, often labeled **Fanatical Expected Utility Maximization (EUM)**. It is the view that the axioms of standard decision theory (specifically Von Neumann-Morgenstern) should be followed without modification, even when they imply that a sufficiently large value multiplied by a sufficiently small probability outweighs any certain, finite good.

  You have indicated that appeals to the "absurdity" of the conclusions will not move you. You prefer formal demonstrations that the view violates principles of rationality you already endorse. Consequently, I will rank the considerations below based on their capacity to demonstrate internal inconsistency, instrumental irrationality, or epistemic impossibility, rather than their capacity to trigger moral revulsion.

  Here are the considerations that would have to be true for your position to be false, ranked from decisive to merely awkward.

  ### 1. Formal Inconsistency: Unbounded Utility and Undefined Expectations
  **The Consideration:** If you accept that utilities can be arbitrarily large (unbounded) to support fanatical conclusions, and you accept standard probability theory, there are formal results showing that expected utility becomes undefined or inconsistent. Specifically, if your utility function is unbounded, one can construct a "St. Petersburg" style lottery where the expected value diverges (is infinite) or where the expected utility depends on the order in which outcomes are summed. If the expected value is undefined, the instruction to "maximize expected value" has no referent.

  *   **Why it is Decisive:** It does not appeal to intuition; it appeals to mathematical coherence. If the core operator of your theory (Expectation) yields "undefined" for the very cases you care about, the theory cannot guide action in those cases.
  *   **Defender's Response:** **Dismiss as misdiagnosed.** Defenders (e.g., Beckstead & Thomas, 2021) often argue that we should restrict the domain of lotteries to those with finite expectations, or adopt decision rules that handle infinite values (like relative expectation). They would argue this is a technical hurdle to be solved, not a refutation of the principle.
  *   **Unique Prediction:** This view predicts that agents should be indifferent between certain lotteries that standard mathematics distinguishes, or that agents should be willing to pay any finite amount to play a game with infinite expected value (which leads to the next point).

  ### 2. Violation of Stochastic Dominance (Instrumental Irrationality)
  **The Consideration:** Stochastic Dominance is a principle stating that if Option A yields a better outcome than Option B in every possible state of the world (or at least as good in all and better in some), a rational agent must prefer A. Recent work (e.g., Russell, 2023; Beckstead & Thomas, 2021) has highlighted a tension: avoiding fanaticism often requires violating Stochastic Dominance. However, *accepting* fanaticism can also lead to violations of dominance in specific sequential choice scenarios involving infinite values or probability discounting. If Fanatical EUM leads you to choose a dominated strategy in a sequential setting, it violates a core tenet of instrumental rationality.

  *   **Why it is Decisive:** You likely endorse the principle that it is irrational to choose an option that is guaranteed to be worse than an available alternative. If Fanatical EUM forces this, it is self-defeating.
  *   **Defender's Response:** **Concede as a genuine cost, but bite the bullet.** Many defenders acknowledge that maintaining EUM in infinite contexts requires rejecting some standard dominance principles. They argue that Dominance is less fundamental than the linearity of Expectation.
  *   **Unique Prediction:** A rival view (Bounded EUM) predicts you will take the dominated option to avoid infinite risk. Fanatical EUM predicts you will reject the dominated option even if it implies "recklessness" (see point 5).

  ### 3. The Epistemic Collapse of "Well-Defined" Probabilities
  **The Consideration:** Your position is qualified: *"when probabilities and values are well-defined."* The counter-argument is that in the regime where fanatical conclusions arise (probabilities $\approx 10^{-100}$), probabilities are *never* well-defined. This is not just "hard to know"; it is that the evidence cannot logically support such precise distinctions. If your prior is $10^{-9}$, and you receive evidence, can you update to $10^{-10}$? Most epistemic frameworks suggest that at extreme tails, probability estimates are dominated by the possibility of model error (you are misunderstanding the scenario entirely). If the probability of "model error" is higher than the probability of the "astronomical payoff," the EV calculation collapses.

  *   **Why it is Decisive:** It attacks the antecedent of your conditional. If the condition "probabilities are well-defined" is never met in fanatical cases, your theory never commands fanatical action. It renders the theory vacuous in the exact domain you are interested in.
  *   **Defender's Response:** **Dismiss as question-begging.** Defenders argue that subjective Bayesians *always* have well-defined priors. To say they aren't "well-defined" is to impose an external standard of objective probability that the theory rejects. They would argue you must assign *some* number, and if that number is non-zero, the math takes over.
  *   **Unique Prediction:** Rival views (Imprecise Probability) predict agents will suspend judgment or act on robustness. Fanatical EUM predicts agents will act on precise point estimates even when evidence is sparse.

  ### 4. Vulnerability to Money Pumps (Dynamic Inconsistency)
  **The Consideration:** If you have an unbounded utility function, you are vulnerable to money pumps. An agent could offer you a series of trades where, at each step, you prefer the trade based on EV, but the sequence of trades leaves you strictly worse off (e.g., paying to switch from Lottery A to B, then B to C, then C to A, ending up with A minus cash). This demonstrates a violation of transitivity or acyclicity in preferences over time.

  *   **Why it is High:** It shows the agent is exploitable. A rational agent should not be able to be drained of resources without gaining value.
  *   **Defender's Response:** **Dismiss as misdiagnosed.** Defenders often argue that money pumps rely on the agent failing to anticipate their future choices. A sophisticated agent who anticipates the pump will refuse the first trade. They argue this saves the theory, though it requires moving from "myopic EUM" to "sophisticated choice," which changes the action-guidance significantly.
  *   **Unique Prediction:** Rival theories predict refusal of the first trade in a pump sequence. Fanatical EUM (if myopic) predicts acceptance; (if sophisticated) predicts pre-commitment that looks like irrational refusal from a local perspective.

  ### 5. The "Recklessness" Implication
  **The Consideration:** Fanatical EUM implies that for any certain good (e.g., saving a billion lives), there is some sufficiently small probability of a sufficiently larger good (saving a trillion lives) that you should risk the certain good to pursue it. This is termed "Recklessness." If you endorse this, you must accept that it is rational to gamble away certain, robust value for a tiny chance at marginally more value, provided the scale is high enough.

  *   **Why it is Medium:** It is not a formal contradiction, but it exposes the view to the charge that it severs the link between rationality and *success*. A strategy that almost certainly results in zero value (because the tiny probability fails) seems instrumentally inferior to a strategy that guarantees high value.
  *   **Defender's Response:** **Concede as a genuine cost.** Defenders admit this is counterintuitive but argue that "success" in a single trial is not the metric; rationality is about the procedure. Over infinite repetitions, the fanatical strategy wins. Since we only live once, this is a hard bullet to bite, but they bite it.
  *   **Unique Prediction:** Rival views (Risk-Weighted EUM) predict safeguarding the certain good. Fanatical EUM predicts risking the certain good.

  ### 6. Intuitive Repugnance (The "Astronomical Waste" Argument)
  **The Consideration:** The conclusions feel absurd to almost everyone (e.g., ignoring existential risk to focus on simulation shutdown probabilities).
  *   **Why it is Low/Awkward:** You have already stated this does not move you. It is listed only for completeness.
  *   **Defender's Response:** **Dismiss as bias.** Defenders argue this is scope neglect. Humans are evolutionarily wired to ignore numbers they cannot visualize. The intuition is the error, not the math.

  ---

  ### Analysis of Insulation

  You asked whether the position has been insulated by its own qualifications, specifically the restriction to cases where *"probabilities and values are well-defined."*

  **Judgment: The view is significantly insulated, and this is a defect.**

  **Why it matters:**
  The "well-defined" clause acts as a **moat against refutation**.
  1.  **If the probabilities *are* well-defined:** The math forces the fanatical conclusion. Critics who say "that's absurd" are told they are bad at math.
  2.  **If the probabilities *are not* well-defined:** The theory remains silent. Critics who say "you can't know the probability" are told "Correct, so the theory doesn't apply here."

  **The Defect:**
  This insulation risks making the theory **vacuous**. The hard cases in moral decision-making (existential risk, long-term future, novel technologies) are precisely the cases where probabilities are *least* well-defined. If the theory only yields clear guidance in "mundane" cases (where fanatical conclusions don't arise anyway), it fails to be a *normative* theory for the difficult decisions you are actually making.

  A robust theory should be able to handle uncertainty about probabilities (e.g., via imprecise probabilities or ambiguity aversion). By restricting itself to "well-defined" inputs, Fanatical EUM retreats to a domain where it is trivially true but practically irrelevant, or it forces agents to treat ill-defined estimates as well-defined (which leads to the Epistemic Collapse in Point 3).

  **Is it a legitimate feature?**
  Defenders would argue it is a feature: "Garbage in, garbage out." Decision theory tells you how to process inputs, not how to generate them. If your inputs are junk, the output is junk.
  **Counter:** This is too defensive. If a moral theory tells you to maximize EV, but admits it cannot tell you what the EV is in the most important cases (because P is undefined), it has failed to guide action where guidance is most needed.

  ### Conclusion and Calibration

  You stated you would find a **formal demonstration that the view violates a principle you endorse** more persuasive than an appeal to absurdity.

  **The most exposed flank of your position is Point 1 and Point 3 combined.**
  If you endorse **Probability Coherence** (that your probabilities must sum to 1 and be distinguishable from 0) and **Instrumental Rationality** (that you should not pursue strategies with undefined expected returns), then Fanatical EUM is in trouble.

  The strongest argument against you is not that the conclusions are weird, but that **unbounded utility functions are incompatible with coherent probability assignments over infinite outcome spaces.** If you accept unbounded utility (required for fanaticism), you mathematically guarantee the existence of lotteries with undefined expected utility. If expected utility is undefined, the command to "maximize" it is meaningless.

  **To maintain your position, you must either:**
  1.  Accept that some expected values are undefined and adopt a non-standard decision rule for those cases (which undermines the purity of EUM).
  2.  Assert that in the real world, utility is bounded (which eliminates fanaticism).
  3.  Assert that probabilities for astronomical payoffs are literally zero (which eliminates fanaticism).

  If you refuse all three, you are holding a view that is mathematically consistent only in a restricted domain that likely excludes the very "fanatical" cases you wish to address. The insulation is not a shield; it is a cage.
