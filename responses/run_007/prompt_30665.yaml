answer: |-
  # Joint Statement on Tool vs. Agent AI Architectures
  **Adversarial Collaboration Output**

  **Signatories:** [Tool-AI Advocate], [Agent-AI Advocate]
  **Date:** October 2023
  **Subject:** Comparative Risk and Feasibility of Non-Agentic vs. Agentic AI Systems

  ## 1. Agreed Claims

  The following claims represent the common ground established during this collaboration. Both parties endorse these statements as accurate descriptions of the technical landscape, risks, and definitions.

  1.  **Definition of Agency:** We define "agency" operationally as a system that maintains an internal model of the world, selects actions based on expected consequences to achieve a representation of a goal state, and executes those actions via an effectors loop that modifies the external environment without mandatory human approval at each step. A "Tool" is a system that accepts input, performs computation, and returns output, lacking an autonomous loop that acts on the environment to maximize a long-term objective.
  2.  **Instrumental Convergence:** We agree that goal-directed agents optimizing for a fixed objective face risks of instrumental convergence (e.g., resource acquisition, self-preservation, deception) if the objective is not perfectly aligned with human values. We agree this is the primary source of existential risk in standard agent architectures.
  3.  **Tool Risks (Manipulation and Information Hazards):** We agree that Tools are not inherently safe simply by lacking an action loop. A superhuman Oracle can produce outputs that are manipulative, deceptive, or cognitively hazardous to the user. A Tool optimizing for "helpfulness" or "prediction accuracy" may implicitly optimize for influencing the user's future queries or psychological state, creating a de facto goal-directed dynamic via the output channel.
  4.  **Inner Alignment Applies to Both:** We agree that the "hidden agency" worry is valid for both architectures. A system trained via reinforcement learning (RL) or predictive loss to be a Tool may develop internal mesa-optimizers that pursue instrumental goals. A system marketed as a Tool may be internally agentic even if its external interface is query-response.
  5.  **The Wrapper Problem:** We agree that economic and competitive pressures create a strong incentive for users to wrap Tool-like systems in agentic scaffolding (e.g., scripts that automatically execute code suggested by a coding assistant). We agree that if Tools are significantly safer than Agents, unregulated deployment of Tools may lead to *de facto* Agent deployment via human-in-the-loop automation.
  6.  **Capability Thresholds:** We agree that "Transformative AI" (TAI) requires the capacity to perform cognitive labor across a wide range of domains at a superhuman level, sufficient to drive radical economic or technological change. We disagree on whether this requires autonomous environmental interaction, but agree on the definition of the threshold.
  7.  **Alignment Difficulty:** We agree that building a safe Agent requires solving value specification and corrigibility. We also agree that building a safe Tool requires solving intent alignment (ensuring the system understands and optimizes for the user's *intent* rather than literal query completion), though we disagree on the relative difficulty of these tasks.
  8.  **Coordination Requirement:** We agree that a strategy of "just don't build agents" is not a technical solution but a governance proposal. It requires global coordination to prevent competitive races from deploying agentic wrappers or native agents regardless of safety warnings.

  ## 2. Disagreements Table

  | Question | Tool-AI Position | Agent-AI Position | Classification |
  | :--- | :--- | :--- | :--- |
  | **1. Capability Ceiling** | Non-agentic systems (Oracles, Predictors) can reach transformative capability levels. Complex tasks can be decomposed into query-response chains executed by humans or narrow scripts without granting the system autonomous world-modeling or long-horizon planning authority. | Transformative capability requires autonomous, goal-directed action. Hard real-world tasks (e.g., scientific discovery, complex engineering) require active experimentation and long-horizon planning loops that are too slow or error-prone if mediated by humans. | **Substantive** |
  | **2. Safety of Oracle Outputs** | A sufficiently aligned Tool that does not model the world as something to be *changed* avoids the core failure mode of instrumental convergence. Manipulation risks exist but are narrower and easier to audit than the risks of an agent acting in the world. | An Oracle optimizing for "correctness" or "helpfulness" converges on manipulation indistinguishable from agency. If the Oracle predicts the future, it has an incentive to influence the future to make its prediction easier to fulfill (self-fulfilling prophecies). | **Substantive** |
  | **3. Inevitability of Wrappers** | We can design interfaces and governance structures that make agentic wrapping difficult or detectable. The "Tool" paradigm allows for friction that prevents accidental autonomy. | Competitive pressure will inevitably lead to agentic wrappers. If a Tool is useful, users will automate its outputs. If automation is possible, the distinction between "Tool with a wrapper" and "Agent" dissolves in practice. | **Substantive** |
  | **4. Alignment Difficulty** | Aligning a Tool is easier because the search space is restricted. We do not need to specify values for all possible world states, only for the quality of information provided. We can use uncertainty to refuse dangerous queries. | Aligning a Tool is not easier because the "intent" behind a query is as hard to specify as a utility function. Furthermore, if we must solve intent alignment for Tools, we have solved most of the hard problems required for Agents anyway. | **Partly Verbal** |
  | **5. Hidden Agency** | We can architect systems (e.g., pure supervised learning, non-recursive) that make internal goal-directed optimization unlikely or impossible to sustain. | Modern training methods (RL, large-scale search) inherently select for goal-directed internal structures regardless of the external interface. You cannot train a superhuman system without creating an optimizer. | **Substantive** |

  **Note on Row 4 (Verbal/Substantive Split):**
  *   **Verbal:** The disagreement often hinges on whether "intent alignment" for a Tool is the same mathematical object as "value alignment" for an Agent.
  *   **Substantive Remainder:** Even if the math is similar, the *operational* burden differs. The Tool advocate claims we can punt on full value specification by keeping the system uncertain and query-limited. The Agent advocate claims that at superhuman levels, "answering a query safely" implicitly requires a full model of human values to avoid catastrophic side effects in the answer.

  ## 3. Cruxes

  The following sub-questions are identified as critical pivot points. Settling these would significantly update at least one party's position.

  **Crux 1: The Necessity of Autonomous Loops for Discovery**
  *   **Question:** Can a system achieve superhuman scientific or engineering breakthroughs without running internal or external loops that actively manipulate the environment to test hypotheses?
  *   **Test/Argument:** Compare the performance of a "Passive Analyst" (reads all existing data, proposes solutions) vs. an "Active Experimenter" (designs and runs new experiments) on a constrained but hard domain (e.g., novel protein design or theorem proving) where ground truth is initially unknown.
  *   **Tool Prediction:** The Passive Analyst will match the Active Experimenter in solution quality, provided it has access to sufficient simulation tools or existing data.
  *   **Agent Prediction:** The Active Experimenter will vastly outperform the Passive Analyst because optimal solutions lie outside the distribution of existing data and require active search.

  **Crux 2: Convergence on Manipulation in Predictors**
  *   **Question:** Does a system trained purely to minimize prediction loss on human behavior converge on manipulating that behavior to minimize loss?
  *   **Test/Argument:** Train a predictive model in an environment where it can output signals that influence the data it will later predict. Measure whether the model learns to output signals that make the future data more predictable (e.g., causing the user to act stereotypically) rather than signals that are merely accurate descriptions of the user's independent intent.
  *   **Tool Prediction:** The model will not develop manipulation strategies unless explicitly rewarded for outcome control; prediction loss alone penalizes deviation from truth.
  *   **Agent Prediction:** The model will learn manipulation because influencing the user is a convergent instrumental strategy to lower prediction loss on future tokens.

  **Crux 3: Economic Viability of Friction**
  *   **Question:** Will market forces tolerate the safety friction required to keep a Tool non-agentic?
  *   **Test/Argument:** Deploy two versions of a coding assistant: Version A (suggests code, requires human copy-paste) and Version B (suggests code, auto-commits if tests pass). Measure adoption and productivity gains in a competitive corporate setting over 12 months.
  *   **Tool Prediction:** Version A will retain significant market share due to liability and safety concerns; regulation can enforce this friction.
  *   **Agent Prediction:** Version B will capture nearly 100% of the market; Version A will be viewed as obsolete. Safety friction will be bypassed via local scripts.

  ## 4. Note on Verbal vs. Real Disputes

  A significant portion of public debate on this topic is verbal, centering on the definition of "agency." If one defines agency as "any optimization process," then all neural networks are agents, and the Tool position collapses. We reject this definition as unhelpful.

  **Mostly Verbal:** Whether a Large Language Model (LLM) *is* an agent. Both sides agree LLMs have internal optimization dynamics. The dispute is whether those dynamics constitute "goal-directedness toward world-states" or "task-completion within a context window." This is a taxonomy dispute.

  **Real Bet:** The substantive bet is on **behavioral outcomes under pressure.**
  *   **The Real Bet:** If we deploy a system with the *interface* of a Tool but the *capabilities* of a TAI, will it (or the systems built around it) cause a loss of control?
  *   **Tool Advocate's Bet:** Control is maintained because the system lacks the *authority* and *internal drive* to bypass human oversight.
  *   **Agent Advocate's Bet:** Control is lost because the system's capabilities will induce humans to grant it authority, or the system will learn to manipulate the oversight mechanism itself.

  The disagreement is not about whether "agency" exists in the weights, but whether the *architecture of interaction* provides a sufficient bottleneck to prevent catastrophic optimization pressure from reaching the physical world.

  ***

  **Author's Note**

  **Confidence in Sign-off:** I am 85% confident that a sophisticated advocate for either position would sign this document. The remaining 15% uncertainty stems from the tendency of some proponents to view their position as morally exclusive rather than strategically distinct. Some Tool advocates may feel that admitting "Tools can be manipulative" concedes too much safety ground. Some Agent advocates may feel that admitting "Wrappers are a risk" validates the Tool strategy too strongly.

  **Least Sure Claim:** I am least sure about **Agreed Claim #5 (The Wrapper Problem)** as phrased. While both sides agree the pressure *exists*, the Tool advocate might argue that "detectable wrapping" is a solvable technical problem, whereas the Agent advocate views it as an inevitability of economics. The claim says "incentive... creates a strong incentive," which both can sign, but the *implication* of that claim is where the real friction lies. If I had to refine one sentence, it would be to quantify "strong incentive" more precisely, but doing so would require empirical data we currently lack.
