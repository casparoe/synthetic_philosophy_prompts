answer: |-
  Your intuition is entirely correct to be skeptical of the claim that the frame problem was essentially solved, and relying on that summary for policy briefing documents could lead to significant misunderstandings about the current capabilities and limitations of AI systems. While the summary you found gets the historical origins and the basic intuition right, it conflates two distinct versions of the problem and offers a resolution status that is highly contested depending on which version you are discussing. For a policy and communications role, distinguishing between these versions is critical because the unsolved version is precisely the one that underpins many safety concerns regarding autonomous systems and artificial general intelligence.

  The summary is accurate in its historical attribution to John McCarthy and Patrick Hayes in 1969, and it correctly identifies the core technical issue they were grappling with, which was how to represent change in logical systems without having to explicitly state every single thing that does not change during an action. In the context of classical symbolic AI, this was a representational bottleneck known as the logical frame problem. If a robot moves a block, it is computationally prohibitive to write axioms stating that the move did not change the color of the walls, the location of the moon, or the status of mathematical truths. The summary is also correct that early AI systems struggled with this combinatorial explosion. However, the claim that this was essentially solved in the 1990s requires heavy qualification. Within the narrow subfield of formal logic and knowledge representation, researchers like Ray Reiter did develop formalisms, such as successor state axioms within the situation calculus, that efficiently handle the persistence of facts without needing infinite axioms. If you speak to a logician working in that specific tradition, they may tell you the logical frame problem is solved. But this solution applies only to systems that use explicit, hand-coded logical representations of the world, which describes very few modern AI systems.

  The reason you still hear the frame problem invoked as a live difficulty is that the term has evolved to encompass a much broader philosophical and cognitive challenge, often associated with Daniel Dennett and Jerry Fodor, which remains unsolved. This broader version is sometimes called the relevance problem or the philosophical frame problem. It asks how an intelligent agent determines which of the infinitely many consequences of an action are relevant to its goals in real time. While the logical version asks how to represent that the wall color did not change, the philosophical version asks how the agent knows it should care about the wall color in the first place, or when it should stop checking for changes. Modern machine learning systems, particularly deep learning models, do not use the logical formalisms that supposedly solved the narrow version of the problem. Instead, they learn statistical patterns from data. Consequently, they often fail in ways that resemble the frame problem, such as struggling with out-of-distribution generalization or failing to understand causal relationships that humans find obvious. When your technical staff mentions the frame problem in the context of real-world tasks or AGI skepticism, they are almost certainly referring to this broader, unsolved challenge of relevance and common-sense reasoning, not the narrow logical representational issue.

  Another subtle inaccuracy in the summary is the suggestion that the situation calculus was part of the solution developed in the 1990s. The situation calculus was actually part of the original 1969 framework proposed by McCarthy and Hayes that gave rise to the problem. The later developments were refinements to how change was handled within that framework or alternative logical systems. While this might seem like a minor historical detail, precision matters in policy documents because inaccuracies can be seized upon to undermine the credibility of your organization's broader arguments. If you state that the problem was solved using the very tool that created it, technical reviewers may dismiss the entire briefing. More importantly, stating that the problem is solved implies that AI systems now have a robust way of understanding what stays the same and what changes in the physical world, which is empirically false for current large language models and robotic systems. They often hallucinate changes or fail to recognize persistent states when context shifts.

  For your briefing documents and talking points, the safest and most accurate approach is to frame the frame problem as a spectrum. You can acknowledge that specific formal logical formulations have been managed within constrained symbolic systems, but emphasize that the general cognitive problem of relevance and context remains a fundamental open challenge for modern machine learning. This distinction supports a nuanced policy position. It allows you to acknowledge technical progress without overstating capabilities. It also aligns with the skepticism your technical staff expresses regarding AGI. If an system cannot reliably distinguish relevant from irrelevant changes in an open environment, it cannot be considered generally intelligent or safe for high-stakes deployment without strict constraints. You should advise your team to avoid the phrase essentially solved unless it is heavily qualified by specifying that it refers only to narrow logical representations from the previous century. Instead, describe it as a foundational issue in AI that has shifted forms from a logical representational challenge to a learning and generalization challenge.

  In summary, the book summary you read is a mix of accurate history and misleading conclusions about the current state of the field. It treats a narrow technical workaround as a solution to a broad cognitive phenomenon. For your purposes in policy and communications, it is vital to maintain the distinction between the logical frame problem, which is largely managed in specific symbolic contexts, and the philosophical frame problem, which is a core limitation of current AI architectures. Recognizing this distinction will ensure your organization communicates a realistic assessment of AI risks and capabilities, avoiding the trap of suggesting that because a logical formalism exists, real-world AI systems have mastered common-sense reasoning. Your instinct to question the solved narrative is well-founded and should guide how you frame this concept in your external and internal communications.
