answer: |-
  Here is a complete design for your 90-minute session, optimized for a group of 12 rationality-literate participants.

  ### **Activity Title: The Hofstadter Protocols**

  **Goal:** To move superrationality from an abstract concept to a visceral experience of tension, coordination failure, and the difference between *Nash Equilibrium* and *Superrational Equilibrium*.

  **Time:** 90 Minutes
  **Participants:** 12
  **Materials:**
  *   24 small slips of paper (2 per person).
  *   1 opaque collection box (or a hat/bag).
  *   Cash: **$120 total** (in small bills, e.g., twelve $10s or twenty $5s). *Note: Cash is superior to pizza for decision theory because it isolates individual utility. Pizza introduces altruistic confounds ("I want pepperoni for the group"). If you must use pizza, make the prize a $100 gift card.*
  *   Whiteboard/Projector for the debrief.
  *   Timer.

  ---

  ### **Part 1: Setup & Framing (15 Minutes)**

  **The Script:**
  > "We are going to run two decision games back-to-back. The rules are simple, but the reasoning is not. In both rounds, you will write a decision on a slip of paper, fold it, and place it in the box. No talking, no signaling, no eye contact during the decision phase.
  >
  > We are testing **Superrationality**. This assumes that everyone in this room is rational, knows everyone else is rational, and knows that everyone knows this. You are not playing against opponents; you are playing against *mirrors* of your own reasoning process.
  >
  > The pot for today is $120. How this money is distributed depends entirely on the aggregate decisions you make."

  **Anti-Cheating Protocols:**
  1.  **Blind Writing:** "Heads down. Do not look up until I say so."
  2.  **Simultaneous Collection:** "Write your decision. Fold it. Pass it to the person on your left. They pass it to the left. I will collect the box from the last person. This ensures I don't know who wrote what until we open them."
  3.  **The Troll Clause:** "If anyone treats this as a joke, you break the 'common knowledge of rationality' required for the experiment. If you claim in Round 1 just to 'see what happens,' you are effectively voting for everyone to get $0. Please respect the group's time."

  ---

  ### **Part 2: Round 1 — The Platonia Dilemma (20 Minutes)**

  **The Payoff:**
  *   **Exactly 1 person claims:** That person wins the **$120**. Everyone else gets $0.
  *   **0 people claim:** Everyone gets **$0**. (Money is donated to a generic charity).
  *   **2+ people claim:** Everyone gets **$0**. (Money is donated).

  **Instructions:**
  > "On your slip, write either **CLAIM** or **PASS**.
  > If exactly one of you writes CLAIM, that person takes the $120.
  > If zero or more than one write CLAIM, the money vanishes.
  > You have 3 minutes to think. 1 minute to write."

  **Logistics:**
  *   Enforce silence strictly.
  *   Collect slips.
  *   **The Reveal:** Open the slips one by one on the projector or read them aloud. Build tension.
  *   **Record:** Write the number of claimants on the board.

  ---

  ### **Part 3: Round 2 — The Luring Lottery (20 Minutes)**

  **The Payoff:**
  *   **0 people claim:** Everyone gets **$0**.
  *   **1+ people claim:** The $120 pot is **split equally among all claimants**. Passers get $0.
      *   *Example:* If 4 people claim, each gets $30. If 12 claim, each gets $10.

  **Instructions:**
  > "Same setup. Write **CLAIM** or **PASS**.
  > This time, if you claim, you are guaranteed a share of the $120, provided at least one person claims.
  > However, every additional claimant reduces your share.
  > If you pass, you get nothing, regardless of what others do.
  > 3 minutes to think. 1 minute to write."

  **Logistics:**
  *   Repeat the blind collection protocol.
  *   Reveal results.
  *   Distribute cash immediately (visceral payoff reinforces the lesson).

  ---

  ### **Part 4: The Debrief (35 Minutes)**

  This is where the learning happens. Do not skip the math.

  **1. The Data (5 mins)**
  Write the results on the board:
  *   Round 1 (Platonia): $N_{claim}$ = ?
  *   Round 2 (Luring): $N_{claim}$ = ?

  **2. Analyzing Round 1: The Superrational Randomizer (15 mins)**
  *   **Ask:** "How many of you tried to calculate a probability?"
  *   **The Nash View:** If I think others will pass, I should Claim. If I think others will Claim, I should Pass. This leads to instability.
  *   **The Superrational View:** "I am a copy of the other 11 agents. If I decide 'I will Claim', my reasoning implies everyone else will also decide 'I will Claim'. Result: $0 for everyone. If I decide 'I will Pass', everyone Passes. Result: $0 for everyone."
  *   **The Solution:** The only superrational move is a **mixed strategy**. You must randomize.
  *   **The Math:** To maximize the probability of *exactly one* success, each agent should claim with probability $p = 1/N$.
      *   With $N=12$, $p \approx 8.3\%$.
      *   Ask: "Did anyone roll a d12 or use a random number generator?" (If yes, they are the heroes of the session).
      *   **Lesson:** Superrationality in Platonia isn't about choosing *Claim* or *Pass*; it's about choosing *a probability distribution*. Without a shared randomization device (like a pre-agreed 'roll a 12-sided die'), superrational agents struggle to correlate their randomization.

  **3. Analyzing Round 2: The Tragedy of the Commons (10 mins)**
  *   **Ask:** "Did more or fewer people claim compared to Round 1?"
  *   **The Theory:** In the Luring Lottery, **Claiming is a Dominant Strategy.**
      *   If 0 others claim: You claim -> You get $120. You pass -> $0.
      *   If 11 others claim: You claim -> You get $10. You pass -> $0.
      *   *Rational Choice:* Always Claim.
  *   **The Paradox:** The prompt suggested fewer people might claim. **This is likely wrong.** Standard rationality dictates *everyone* claims, diluting the prize to the minimum ($10 each).
  *   **Superrational Twist:** A superrational agent asks: "If I claim, everyone claims. We all get $10. If I pass, maybe others pass? No, they are rational, they will claim."
  *   **Lesson:** Round 2 demonstrates that individual rationality (Nash) leads to a suboptimal group outcome (everyone gets $10 instead of one person getting $120), but unlike Platonia, there is no coordination failure—it's just a grind.

  **4. Synthesis (5 mins)**
  *   **Platonia:** Requires **correlated randomization** to succeed. Without a focal point (like "we all roll a die"), rational agents deadlock.
  *   **Luring:** Demonstrates **dominant strategies** that drain value.
  *   **Takeaway:** Superrationality works best when agents can agree on a *method* of decision-making (like a randomization algorithm) beforehand. Logic alone, without a coordination mechanism, often fails to break symmetry.

  ---

  ### **Predictable Failure Modes (And Fixes)**

  1.  **The "Hero" Troll:** One person claims in Round 1 just to "win" or "test the system," ruining the $0 outcome for everyone.
      *   *Fix:* The "Social Contract" framing in the intro. If this happens, pause and ask: "Was that a rational move? You destroyed $120 of group value for a 50% chance at personal gain. That is defection, not rationality."
  2.  **Signaling/Collusion:** People coughing, raising eyebrows, or hesitating to signal "I'm passing."
      *   *Fix:* The "Heads Down" rule and the "Pass to the Left" collection method. If you suspect collusion, invalidate the round and restart.
  3.  **Risk Aversion:** In Round 2, people might Pass because they feel guilty about diluting the pot.
      *   *Fix:* Address this in debrief. "Guilt is not part of the payoff matrix. If you passed out of guilt, you acted altruistically, not rationally."
  4.  **Zero Claimants in Round 1:** Everyone is too scared to claim.
      *   *Fix:* This is actually a great data point! It shows that without a coordination mechanism (randomization), fear dominates.

  ---

  ### **What Would Change My Mind? (The "Change My Mind" Section)**

  You asked for the specific assumption that is most likely to be wrong and what result would invalidate the design.

  **The Fragile Assumption:**
  The design assumes participants treat **"Rationality" as a shared, cooperative algorithm.**
  Hofstadter's superrationality relies on the premise: *"I know that the other players are reasoning exactly as I am."*
  In reality, your grad students likely have different priors. Some are Causal Decision Theorists (CDT), some Evidential (EDT), some Game Theorists.
  *   **CDT thinkers** will treat others as independent variables. In Platonia, they will try to outguess the group.
  *   **Superrational thinkers** will try to correlate.
  *   **The Conflict:** If half the room is CDT and half is Superrational, the math breaks. The CDT players will claim (trying to exploit the passers), and the Superrational players will randomize.

  **The Result That Would Rethink the Design:**
  If **Round 2 (Luring) results in significantly fewer claimants than Round 1.**
  *   **Why:** Standard Game Theory predicts 100% claiming in Round 2 (Dominant Strategy). If you see fewer claims in Round 2 than Round 1, it implies your participants are not maximizing expected utility, but are instead maximizing **social welfare** or avoiding **guilt**.
  *   **Implication:** If this happens, the game fails to teach *Decision Theory* and instead teaches *Social Psychology*. It would prove that "Rationality" in a live human group is inseparable from social norms. You would need to pivot the debrief from "Here is how logic works" to "Here is why pure logic fails to model human behavior."

  **The Result That Validates the Design:**
  *   **Round 1:** 0 or 12 claimants (Coordination Failure).
  *   **Round 2:** 10-12 claimants (Nash Equilibrium).
  *   **Why:** This confirms that without a pre-agreed randomization protocol, superrationality cannot solve the Platonia Dilemma, while individual rationality inevitably consumes the Luring Lottery. This is the bleak, accurate lesson of the theory.

  ### **Final Recommendation**
  Run the game exactly as written. If Round 1 fails (0 or >1 claimants), **do not comfort them.** That failure *is* the lesson. The visceral frustration of watching the money vanish because "we couldn't agree on a random number generator" is the exact feeling Hofstadter wanted to convey.
