answer: |-
  Here is a 50-minute discussion plan designed to move students from intuitive rejection to structural understanding.

  ### **The Pre-Condition: The Experience Requirement**
  **Do not state Epicurus's argument yet.** Before you write a single premise on the board, you must secure the **Experience Requirement** (a hedonistic theory of well-being).
  *   **The Move:** Ask: *"If a tree falls in the forest and no one hears it, does it make a sound? Now: If something happens to you, but you never experience it happening, can it be good or bad **for you**?"*
  *   **Why:** Epicurus's argument collapses if students think well-being includes objective goods (e.g., "honor," "posthumous reputation," "goals met") that exist independently of consciousness. If they believe well-being requires *experience*, Epicurus becomes logically valid. If they don't, they will talk past him.
  *   **Goal:** Get them to agree that for something to be *bad for me*, I must be capable of experiencing it as bad.

  ---

  ### **The Core Example: The Painless Annihilation Pill**
  **Do not start with Prenatal Nonexistence Symmetry.**
  *   **Verdict:** The prenatal symmetry (Lucretius) is logically sound but psychologically distant. It confuses intro students early because they focus on the *past* rather than the *future*.
  *   **The Carrier Example:** Use **The Painless Annihilation Pill**.
      *   *Scenario:* "You take a pill tonight. You fall asleep. You never wake up. There is no pain, no struggle, no 'darkness.' You simply cease to exist. The world goes on without you."
      *   *Why:* This isolates the *state* of being dead from the *process* of dying. It forces them to evaluate non-existence itself, not the transition to it.

  ---

  ### **Session Timeline (50 Minutes)**

  #### **0:00–0:10: Setup & The Argument**
  1.  **Secure the Experience Requirement** (see above).
  2.  **State Epicurus's Argument** clearly on the board:
      *   P1: Good and bad consist in sense-experience (pleasure/pain).
      *   P2: Death is the privation of sense-experience.
      *   C: Therefore, death is nothing to us (neither good nor bad for the deceased).
  3.  **Apply the Pill:** Ask, *"In the Pill scenario, when are you harmed? While you are alive? While you are dead?"*
      *   *Target:* Elicit the "No Subject" problem. (When you are alive, death isn't there. When death is there, you aren't.)

  #### **0:10–0:25: The First Wave of Objections (Misconceptions 1 & 2)**
  *   **Misconception 1: "But dying can be painful."**
      *   **Strategy:** **Head this off immediately.**
      *   **Script:** "Epicurus agrees dying can be terrible. But we are discussing *death* (the state), not *dying* (the process). In the Pill scenario, the process is painless. Does the *state* of being dead hurt?"
      *   **Reason:** If you let this linger, the discussion becomes about medical care or suffering, not metaphysics.
  *   **Misconception 2: "But we fear death, so it must be bad."**
      *   **Strategy:** **Let this sit for 3 minutes, then correct.**
      *   **Why:** It's productive to distinguish *psychology* from *normativity*.
      *   **Script:** "Is it possible to fear something that isn't bad? (e.g., spiders, flying). Epicurus thinks our fear of death is like a phobia: intense, but based on a false belief about what death *is*."
      *   **Takeaway:** Fear proves we *think* it's bad, not that it *is* bad.

  #### **0:25–0:40: The Core Clash (Misconceptions 3 & 4)**
  *   **Misconception 3: "This is just word games about 'experience'."**
      *   **Strategy:** **Let this sit. This is the pivot point.**
      *   **Why:** This is students intuitively grasping the **Deprivation Account**. They are sensing that Epicurus's definition of "bad" is too narrow.
      *   **Script:** "You're suggesting Epicurus is defining 'bad' too narrowly. If 'bad' doesn't just mean 'painful experience,' what else could it mean?"
  *   **Misconception 4: "What about the life you miss out on?"**
      *   **Strategy:** **This is the Main Event.**
      *   **Action:** Formalize their intuition as the **Deprivation Account**.
      *   **Board Work:** Contrast the two frameworks.
          *   *Epicurus:* Bad = Negative Experience (Requires a subject).
          *   *Deprivation:* Bad = Loss of Possible Good (Requires a comparison between actual life and possible life).
      *   **Discussion:** Ask, *"If Epicurus is right, the Deprivation Account is incoherent. If the Deprivation Account is right, Epicurus's Premise 1 is false. Which premise do you want to reject?"*
      *   **Goal:** Show them that rejecting Epicurus isn't "common sense"; it's committing to a specific, substantive theory of well-being (that possibilities count, not just experiences).

  #### **0:40–0:45: The Moral Panic (Misconception 5)**
  *   **Misconception 5: "So then painlessly killing someone is fine?"**
      *   **Strategy:** **Head this off quickly at the end.**
      *   **Why:** Students conflate "bad for the victim" with "morally wrong action."
      *   **Script:** "Even if death isn't bad *for the person who dies*, it might still be wrong *for the killer* to do it. It violates rights, upsets society, or harms the killer's character. Epicurus isn't giving a license to murder; he's trying to cure your anxiety about your own end."
      *   **Reason:** Don't let meta-ethics derail the philosophy of death.

  #### **0:45–0:50: Wrap Up & Comprehension Check**
  *   **What to Leave Unsettled:** Do not declare a winner. Leave it unsettled whether the Deprivation Account is *true*. The goal is for them to see it as a *theoretical choice*, not an obvious fact.
  *   **The Final Question (The "Exit Ticket"):**
      *   Do not ask: *"Do you agree with Epicurus?"*
      *   **Ask:** *"If you wanted to defend Epicurus against the Deprivation Account, which premise of his argument would you have to defend, and what would you say to the claim that 'missing out' is a form of harm?"*
      *   **Why:** This tests if they understand the *structure* (that the debate hinges on the definition of well-being in Premise 1) rather than just their gut feeling.

  ---

  ### **TA Cheat Sheet: Handling the Flow**

  | Misconception | Timing | Action | Why? |
  | :--- | :--- | :--- | :--- |
  | **1. Dying is painful** | Start | **Head Off** | Confuses Process (dying) with State (death). |
  | **2. We fear it** | Early | **Let Sit** | Distinguishes Psychology (fear) from Normativity (badness). |
  | **3. Word games** | Middle | **Let Sit** | This is the bridge to the Deprivation Account. |
  | **4. Missed life** | Middle | **Highlight** | This *is* the Deprivation Account. Make it explicit. |
  | **5. Killing is fine** | End | **Head Off** | Confuses Well-being (bad for me) with Morality (wrong to do). |

  ### **Pedagogical Note**
  Students often feel smart when they reject Epicurus. Your job is to make them feel like rejecting him requires *work*. When they say "But death is bad because I lose my future," stop them and say: *"Wait. You just asserted that 'losing a future' is a harm. Epicurus says only 'pain' is a harm. You aren't using common sense; you are arguing for a rival philosophical theory of value. What justifies that theory?"*

  This shifts them from "Epicurus is dumb" to "Epicurus and the Deprivation Account have different axioms." That is the win condition.
