prompt: |-
  Ok here's something that's been bugging me about population ethics. Everyone treats the Repugnant Conclusion as a problem — roughly, the claim that for any population of very happy people, there's some vastly bigger population of people with lives just barely worth living that would be better. Total utilitarians mostly just bite the bullet, but everyone else scrambles to avoid it, and every way out seems to come with its own weird bullet: average utilitarians end up saying adding worthwhile lives can make the world worse, person-affecting views can't seem to compare populations of different sizes, and the fancier fixes (critical levels, variable value, intransitivity) mostly seem to relocate the weirdness rather than remove it. The debate has looked like this for decades, and its not like the underlying facts are in dispute.

  My working theory is that this isn't a substantive moral disagreement so much as a standoff between bedrock intuitions about whether extra happy lives have value in themselves, plus a bit of a verbal fight about what 'better' is even doing when the two populations don't overlap. But I want someone to actually diagnose the disagreement, not adjudicate it.

  You're a professional philosopher who works on population axiology. Start by brainstorming the main positions and what each one is really committed to, then think carefully about the structure of the disagreement. What kind of disagreement is this actually: substantive, verbal, or are the camps answering different questions under one heading? Is there a hidden formal or empirical question doing the work — like one of those impossibility theorems, or an empirical claim about whether barely-worth-living lives are actually comparable — or is the question just ill-posed? And given your diagnosis, what would actually count as progress: a distinction, a theorem, a change of question — or should we expect none?

  Give me exactly five numbered points, each a sentence or two, with no introduction or conclusion. Diagnose it using what the main camps actually say, not just labels.
