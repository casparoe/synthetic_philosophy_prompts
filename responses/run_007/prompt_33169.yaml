  1. Total utilitarians commit to the principle that value aggregates neutrally across persons, whereas person-affecting views commit to the claim that existence cannot be better or worse for those who would otherwise not exist.
  2. While there is a verbal element regarding how 'better' applies to non-identical sets, the core conflict is substantive because it rests on incompatible axioms about whether value is impersonal or essentially tied to subjects.
  3. Formal impossibility theorems prove that no transitive ranking can satisfy all standard adequacy conditions, suggesting the demand for a single complete ordering is itself ill-posed.
  4. The standoff endures because each side treats different adequacy conditions as lexically prior, such as avoiding the sadistic conclusion versus respecting the mere addition principle.
  5. Real progress involves mapping the precise trade-offs between incompatible principles rather than seeking a theory that avoids all counterintuitive results.
