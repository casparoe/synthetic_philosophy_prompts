answer: |-
  You have perfectly described a well-documented phenomenon in experimental philosophy and psychology. The established name for this is **The Knobe Effect** (also known as the **Side-Effect Effect**).

  It is named after the philosopher Joshua Knobe, who published a seminal paper on this in 2003 titled *"Intentional Action and Side Effects in Ordinary Language."* The exact scenario you described regarding the CEO/manager and the environment is the original thought experiment he used.

  Here is a breakdown of the name, the debate surrounding its meaning, and how to distinguish it from related concepts.

  ### 1. The Name and The Experiment
  In Knobe's original study, participants were given two vignettes that were structurally identical except for the moral valence of the side effect:

  *   **Harm Condition:** The CEO is told a new program will increase profits but *harm* the environment. He says, "I don't care at all about harming the environment. I just want to make as much profit as I can." The program goes forward, and the environment is harmed.
  *   **Help Condition:** The CEO is told a new program will increase profits but *help* the environment. He says, "I don't care at all about helping the environment. I just want to make as much profit as I can." The program goes forward, and the environment is helped.

  **The Result:** When asked if the CEO *intentionally* harmed the environment, the vast majority (82%) said **Yes**. When asked if the CEO *intentionally* helped the environment, the vast majority (77%) said **No**.

  This asymmetry is the **Knobe Effect**.

  ### 2. Concept vs. Bias: What is actually happening?
  You asked whether this is a discovery about the *concept* of intentional action or about how *moral judgments color reports*. This is the central debate that has raged in philosophy and cognitive science for two decades.

  **View A: The Moral Penetration Hypothesis (Conceptual)**
  Knobe and proponents of this view argue that our very concept of "intentionality" is not morally neutral. We do not have a purely descriptive box in our brain for "intentional" that we fill with facts about belief and desire. Instead, moral judgment is a prerequisite for applying the concept. To call something "intentional" is partly a moral judgment. Under this view, the asymmetry reveals the true structure of folk psychology.

  **View B: The Performance/Bias Hypothesis**
  Critics argue that the *concept* of intentionality is neutral (based on desire, belief, and skill), but that moral outrage triggers an emotional bias that makes us *more likely to apply* the label "intentional" to bad outcomes. In this view, people are making a performance error; they know the CEO didn't strictly intend the harm, but they want to blame him, so they retroactively assign intent to justify the blame.

  **Current Consensus:**
  Recent research suggests a synthesis, often called the **Normative Account**. It appears that intentionality attribution is sensitive to whether an action violates a norm, not just whether it is "good" or "bad." If helping the environment violated a corporate norm (e.g., "we are a fossil fuel company, we don't do green initiatives"), people are *more* likely to say the help was intentional. This suggests the effect is about **deviance from expected norms** rather than simple moral valence.

  ### 3. Distinguishing from Moral Luck and the Halo Effect
  It is crucial to separate the Knobe Effect from these other phenomena, as they operate at different stages of judgment.

  **Vs. Moral Luck**
  *   **Moral Luck** (Thomas Nagel/Bernard Williams) concerns outcomes that are outside the agent's control. For example, two drunk drivers drive identically; one hits a pedestrian, one does not. We judge the one who hit the pedestrian more harshly.
  *   **The Difference:** Moral Luck is about **responsibility/blame** given identical *intent*. The Knobe Effect is about **intent** given identical *control*. In the Knobe cases, the agent's control and foresight are exactly the same; only the moral quality of the outcome changes, yet the attribution of *mental state* (intent) changes. Moral luck asks, "Are they more blameworthy?" The Knobe Effect asks, "Did they mean to do it?"

  **Vs. The Halo Effect**
  *   **The Halo Effect** is a cognitive bias where one positive trait (e.g., attractiveness) influences the perception of other unrelated traits (e.g., intelligence or kindness).
  *   **The Difference:** The Halo Effect is a general impression management bias (Good Person = Good Everything). The Knobe Effect is specific to **mental state attribution**. It isn't that the CEO is seen as a "bad person" generally; it is that the specific *mechanism of action* is categorized differently. Furthermore, the Knobe Effect works asymmetrically (Bad -> Intentional; Good -> Unintentional), whereas the Halo Effect is usually symmetric (Good -> Good; Bad -> Bad).

  **Vs. Fundamental Attribution Error**
  *   **FAE** is the tendency to overemphasize personality-based explanations for behaviors observed in others while under-emphasizing situational explanations.
  *   **The Difference:** FAE is about Disposition vs. Situation. The Knobe Effect is about Morality vs. Intentionality. You can commit the FAE without the Knobe Effect (e.g., assuming someone tripped because they are clumsy rather than the floor was wet), and you can observe the Knobe Effect without FAE.

  ### 4. Summary and Naming
  If you were writing about this, **The Knobe Effect** is the precise term you should use.

  If you found a case where the Knobe Effect didn't apply and needed a descriptive phrase, you might call it **Intentionality Asymmetry** or **Moral Asymmetry in Mind Attribution**.

  **Why it matters:**
  This is not just semantic pedantry. It has profound implications for:
  1.  **Legal Theory:** If juries naturally conflate "bad outcome" with "intentional action," it threatens the legal distinction between negligence, recklessness, and intent.
  2.  **AI Safety:** If we train AI on human language, the AI may learn that "harm" implies "intent," leading to misalignments in how the AI models human goals.
  3.  **Free Will:** It suggests that our intuitive sense of agency is not a factual observation of the world, but a moral construction.

  In short, you have identified a crack in the foundation of how humans understand agency. We like to think we determine intent based on what was in someone's mind, but the Knobe Effect suggests we often determine what was in their mind based on whether we like the result.
