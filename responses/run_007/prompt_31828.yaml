answer: |-
  President [Name], faculty, families, and most importantly, the Class of [Year]:

  Thank you for inviting me back. It is a genuine honor to stand here. Looking out at this sea of caps and gowns, I see what everyone else sees: pride, relief, anticipation. I see parents wiping away tears and friends whispering inside jokes. But I also see something else. I see a group of people standing on the edge of a cliff, looking out at a landscape that is, by definition, invisible.

  For the past few days, you've been asked the same question over and over again. "What's next?" "Where are you going?" "What are you going to do?" It's a polite question. It's an expected question. But I want to suggest to you today that it is also, in a strange way, an impossible question.

  Not because you lack ambition. Not because you haven't planned. But because the person who will answer that question five years from now is not the person sitting here today.

  We tend to make big decisions as if we are shopping for a future. We weigh the pros and cons. We ask our mentors for advice. We try to imagine how we will feel in a new city, a new career, a new relationship. We try to project our current selves forward in time, like a movie reel. But some choices don't just change your circumstances; they change *you*.

  There are moments in life—decisions about love, about vocation, about where to belong, about whether to bring a new life into the world—that rewrite your internal code. They change what you value. They change what brings you joy. They change what you consider a waste of time and what you consider a life well-lived.

  When you stand on this side of those choices, you cannot know what it is like to stand on the other side. You cannot know what you will want when you get there, because the journey itself alters the traveler.

  I tell you this not to frighten you, and certainly not to suggest that planning is futile. I tell you this because I want to offer you a different kind of encouragement than the usual script. The standard commencement speech tells you to "follow your passion" or "make your mark." It assumes you know what your passion is, and it assumes the mark you want to make today is the one you'll care about tomorrow.

  But I believe you deserve more honesty than that.

  The truth is, you are about to enter a period of profound becoming. Some of you will find careers that consume you. Some of you will find loves that reorder your priorities. Some of you will face hardships that soften you, or harden you, or simply make you different. And when those changes come, you may look back at the person you were today—the person sitting in this chair—and feel a sense of distance. You might wonder, "Why did I care so much about that?" or "How did I not see this coming?"

  That distance is not a failure. It is evidence that you are living.

  So, if you cannot know what you will value, and you cannot know who you will become, what can you take with you from this place? What survives the uncertainty?

  You take the capacity to endure the unknown. You take the ability to listen to a new version of yourself when it begins to speak.

  One of the greatest risks you face is not failure. It is rigidity. It is the temptation to cling to the preferences you hold today because they feel like truth. It is the fear that if you change your mind, you are betraying your past self. But loyalty to your past self can sometimes become a cage. The education you received here was not just about filling your mind with facts. It was about teaching you how to think when the answers aren't in the back of the book. It was about teaching you how to stand in uncertainty without collapsing.

  When you face a choice that feels too big to calculate—when the pros and cons don't add up because the scales themselves might change—do not look for certainty. Look for curiosity. Ask not only "Will I be happy?" but "Who will I become?" Ask not only "Is this safe?" but "Is this alive?"

  And when you arrive on the other side of a big choice, and you find that you are different than you expected, do not panic. If you find that what you wanted at twenty-two is not what you want at thirty, forgive yourself. You are not inconsistent; you are evolving. The metrics you used to measure success today may not be the metrics you use later. That is allowed. In fact, that is necessary.

  To the parents and families here: this is also for you. You have loved these graduates into being. You have supported them, guided them, and sacrificed for them. But part of what you are celebrating today is their independence. And true independence means they must be allowed to become people you might not fully understand. They will make choices you might not make. They will value things you might not value. That is not a rejection of your love. It is the fulfillment of your work. You have given them the tools to build a house you will not live in. Let them build it.

  To the faculty: you have taught them to question, to analyze, to seek evidence. Now they go into a world that often demands certainty where none exists. May they have the courage to admit when they don't know, and the wisdom to know that not knowing is where the learning begins.

  Class of [Year], I cannot wish you success, because I do not know what success will mean to you in ten years. I cannot wish you happiness, because I do not know what joy will look like in the life you are about to lead. Those things are yours to define, and yours to redefine.

  Instead, I wish you courage. I wish you the courage to make choices without knowing how they will end. I wish you the courage to be transformed by your experiences, even when the transformation is painful. I wish you the courage to trust the stranger you are becoming.

  You are leaving a place where the paths are marked, where the syllabi are printed, where the deadlines are clear. You are going to a place where the map is blank. That is terrifying. But it is also the only place where anything new can happen.

  You cannot know what lies ahead. You cannot know who you will be when you return to this campus for your reunion. But you can know this: you are ready to meet that person. You are ready to let them emerge.

  So go. Make the choices. Live the experiences. Let them change you. And when you look back, do not mourn the person you were. Thank them for getting you here. Then, turn around, and walk into the unknown.

  Congratulations.
