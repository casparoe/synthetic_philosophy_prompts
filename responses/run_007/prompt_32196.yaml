answer: |-
  # Joint Statement on the Normative Structure of Buddhist Ethics
  **Signed by the Proponents of the Consequentialist and Virtue-Ethical Interpretations**
  **Date:** October 26, 2023
  **Context:** Following a good-faith adversarial collaboration regarding the comparative philosophical classification of Buddhist ethics, specifically engaging the frameworks advanced by Charles Goodman and Damien Keown.

  ## I. Areas of Substantive Agreement

  We, the undersigned, affirm the following claims as points of convergence between our respective interpretive frameworks. We agree that these points constitute the shared phenomenological and soteriological ground upon which our theoretical disagreement rests.

  1.  **The Centrality of Compassion and Welfare:** Both camps agree that the reduction of suffering (*duḥkha*) and the cultivation of compassion (*karuṇā*) are the primary motivational engines of Buddhist moral practice. Any interpretation that renders compassion secondary to abstract rule-following is rejected by both sides.
  2.  **The Primacy of Intention (*Cetanā*):** We agree that intention is the defining characteristic of *karma*. The moral quality of an action is not determined solely by its physical outcome but is inextricably linked to the mental state of the agent.
  3.  **Ordinary Moral Guidance:** In the vast majority of ordinary circumstances, both interpretations prescribe identical conduct. The precepts (*śīla*) are to be followed strictly, without requiring agents to perform complex utilitarian calculations for every action.
  4.  **The Soteriological Telos:** We agree that Buddhist ethics is teleological in the broad sense: it is oriented toward a specific end (Nirvana, Buddhahood, or the cessation of suffering). It is not deontological in the Kantian sense of duty for duty's sake independent of liberation.
  5.  **Limits of Western Categories:** We acknowledge that "Consequentialism" and "Virtue Ethics" are Western heuristic tools. Neither category maps perfectly onto the Indian or Chinese Buddhist conceptual landscape. Our debate concerns which heuristic offers greater explanatory power, not which is an exact synonym.
  6.  **The Role of Wisdom (*Prajñā*):** Both sides agree that moral action cannot be divorced from insight into reality (emptiness, non-self). Ethical conduct is not merely behavioral compliance but is expressive of ontological understanding.

  ## II. Statement on Verbal Disputes and Definitional Boundaries

  During our collaboration, we identified a significant area of **merely verbal disagreement** regarding the definition of "consequentialism."

  *   **Clarification:** The Consequentialist proponent (following Goodman) defines consequentialism structurally: an act is right if it maximizes the good, where "the good" *includes* the virtue of the agent. The Virtue-Ethical proponent (following Keown) defines consequentialism by the *location of value*: if the value lies in the state of the agent's character rather than an independent state of affairs, it is not consequentialist.
  *   **Resolution:** We agree that if Goodman's definition is adopted (where "virtue" is a value to be maximized), almost all normative ethics become consequentialist, rendering the term less useful for distinction. However, we also agree that this does not dissolve the *substantive* disagreement regarding **karmic causality**. Even if we grant Goodman's definition, the question remains: *Does breaking a precept out of compassion generate negative karmic seeds that hinder liberation, or does the compassionate intention fully negate the karmic cost?* This substantive question survives the definitional clarification.

  ## III. Table of Remaining Disagreements and Cruxes

  The following table isolates the substantive disagreements that remain after clarifying definitions. We have identified specific "Cruxes"—empirical or textual questions—where resolution would significantly shift our confidence.

  | Point of Contention | Consequentialist Formulation (Goodman-style) | Virtue-Ethical Formulation (Keown-style) | The Crux (Sub-question for resolution) | Shared Evidence / Test Case | Consequentialist Prediction | Virtue-Ethical Prediction |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1. The Status of Precepts** | Precepts are **instrumental** rules of thumb. They derive authority from their tendency to promote welfare. In extreme cases, they may be overridden by the direct calculation of welfare. | Precepts are **constitutive** of the path. They express the character of an enlightened being. Breaking them damages the agent's spiritual trajectory regardless of outcome. | **Is the precept breakable without karmic penalty?** Does the *act-type* itself carry karmic weight, or only the *consequence*? | *Upāyakauśalya Sūtra* (The story of the Compassionate Captain who kills a robber to save 500 merchants). | The text praises the Captain. This shows the precept against killing is overridden by compassion without negative karmic retribution for the Bodhisattva. | The text is Mahāyāna rhetoric emphasizing intention, but Vinaya logic suggests the act remains a *pārājika* (expellable offense). The "praise" is for the sacrifice, not the act's karmic neutrality. |
  | **2. The Locus of Evaluation** | The primary object of evaluation is the **state of affairs** (total suffering reduced). The agent's character is valuable insofar as it reliably produces good states of affairs. | The primary object of evaluation is the **agent's character**. The state of affairs is secondary to the moral quality of the intentional action itself. | **Can a "bad" act lead to Nirvana?** Is it possible to achieve liberation while performing acts that are conventionally immoral but ostensibly compassionate? | The **Vinaya** monastic codes vs. **Tantric** transgressive practices. | Tantric transgressions show that conventional morality is subordinate to the soteriological goal (welfare/liberation). | Tantric practices are highly regulated and symbolic; they do not license ordinary consequentialist calculation. They require a level of realization where "transgression" is non-dual, not utilitarian. |
  | **3. Karmic Causality** | *Karma* is primarily **causal**. Good intentions produce good results. If the result is net welfare, the karma is good. | *Karma* is primarily **moral/ontological**. The intentional act plants a seed (*bīja*) consistent with its nature. Killing plants a killing-seed, regardless of intent. | **Does intention overwrite act-type?** If I kill with compassion, is the karmic seed "killing" or "compassion"? | **Abhidharma** analysis of *cetanā* (intention) vs. *kriyā* (action). | Abhidharma prioritizes *cetanā*. If *cetanā* is pure, the karma is pure. The physical act is secondary. | Abhidharma distinguishes between the *path* of action and the *intention*. A complete karma requires both. A compassionate killing is still a killing karma, albeit with mitigated retribution. |

  ## IV. Commitments to Future Inquiry

  We agree that further progress depends on exegesis of the following texts, which bear directly on the Cruxes above:
  1.  **The *Upāyakauśalya Sūtra*:** Does the Buddha explicitly exonerate the Captain from *all* karmic consequence, or merely praise his willingness to suffer hell for others? (Resolution favors Virtue Ethics if the latter; Consequentialism if the former).
  2.  **The *Vinaya*:** Are there any recorded instances where a monk was *not* expelled for killing out of compassion? (Resolution favors Virtue Ethics if no exceptions exist; Consequentialism if exceptions are codified).
  3.  **The *Bodhicaryāvatāra* (Chapter 5 & 8):** Does Śāntideva argue that precepts are broken to save beings, or that one must protect beings *by* keeping precepts?

  ***

  ## V. Meta-Commentary on Characterization

  **Confidence Level:**
  I am **85% confident** in this characterization of the dialectic between the Goodman and Keown positions. The distinction between "instrumental" and "constitutive" rules is well-documented in their respective corpora, and the *Upāyakauśalya Sūtra* is universally acknowledged as the battleground for this debate.

  **Least Sure Point:**
  I am least sure of the **Virtue-Ethical Prediction regarding the *Upāyakauśalya Sūtra*** (Table Row 1).
  *Reasoning:* Keown's position relies heavily on the *Vinaya* (monastic law), which is conservative and rule-based. However, the *Upāyakauśalya Sūtra* is a Mahāyāna text that explicitly challenges *Vinaya* norms in the name of the Bodhisattva path. It is possible that a sophisticated Virtue-Ethical reading must concede that for a *fully enlightened* Bodhisattva (not an ordinary agent), the precepts function differently. If the text explicitly states the Captain incurs no negative karma, Keown's "constitutive" model faces a significant textual challenge that requires nuanced handling (e.g., distinguishing between ordinary bodhisattvas and high-level bodhisattvas). My characterization assumes Keown can maintain his distinction here, but this is the most vulnerable point in the Virtue-Ethical defense against the Consequentialist textual evidence.
