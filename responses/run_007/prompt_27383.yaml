  *(Refining the Descartes point)*: The summary says "we cannot know anything about the world outside our own minds." Bostrom actually argues that if we are in a simulation, the "outside world" is still a physical world running the simulation. It's not a mental construct like Descartes' demon might imply. It's a computer. So physics still exists, just at a different level.

