      *   **Extrinsicness Problem:** (2) vs. (3). Why does a duplicate elsewhere negate survival here? This makes survival depend on extrinsic facts.
      *   **Determinacy vs. Reductionism:** (1) vs. (6). Parfit's view leads to indeterminacy in borderline cases. Insisting on determinacy (6) often requires positing a further fact (Identity), which (1) denies.

  5.  **Determine the Best Revision:**

