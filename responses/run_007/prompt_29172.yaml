answer: |-
  # The Choice Architecture Review Protocol (CARP)

  **Purpose:** To evaluate proposed changes to employee choice environments (defaults, menus, messaging) for ethical permissibility before sign-off.
  **Grounding:** Based on the framework of *Libertarian Paternalism* (Thaler & Sunstein), distinctions between *manipulation and persuasion* (Hausman & Welch), and the *Harm Principle* (Mill).
  **Users:** Decision-maker + two staff.
  **Time:** 45–60 minutes per proposal.

  ---

  ## Part 1: The Decision Procedure

  Run the following six questions in order. If a proposal fails a step, stop and reject or require redesign. If a step is marked **[JUDGMENT]**, the group must discuss and record the rationale; there is no automatic "pass."

  ### Step 1: The Authority & Legality Screen
  **Question:** Is this change explicitly permitted by relevant regulations (e.g., ERISA, ACA, EEOC) and within the firm's delegated authority?
  *   **Sufficient Answer:** Written confirmation from Legal/Compliance that the specific mechanism is compliant.
  *   **Stop Rule:** If **NO**, stop. Reject proposal.
  *   **Note:** This is a gatekeeper, not an ethical test. Do not proceed if legal status is ambiguous.

  ### Step 2: The Opt-Out Cost Screen (Libertarian Condition)
  **Question:** Can an employee choose the alternative option with roughly the same ease (time, effort, friction) as accepting the default?
  *   **Sufficient Answer:** The alternative is available via the same channel (e.g., same click, same form) with no financial penalty or significant delay.
  *   **Stop Rule:** If **NO** (e.g., opt-out requires a phone call while opt-in is a click, or opt-out incurs a fee), stop. The proposal is *Hard Paternalism* and requires executive waiver.
  *   **[JUDGMENT]:** *Assessing "Roughly the Same Ease."* The group must judge whether friction is "functional" (e.g., a confirmation click to prevent errors) or "deterrent" (e.g., hunting for a hidden link).

  ### Step 3: The Transparency Screen (Manipulation Check)
  **Question:** Is the intent of the influence visible to the employee? Would a reasonable person understand *why* this option is being highlighted or defaulted?
  *   **Sufficient Answer:** The messaging or design does not hide the firm's interest. (e.g., "We recommend this because..." vs. subliminal coloring or hidden pre-checks).
  *   **Stop Rule:** If **NO**, stop. Hidden influence counts as *Manipulation*, which violates autonomy even if welfare improves.
  *   **[JUDGMENT]:** *Defining "Reasonable Person."* The group must judge if the average employee has the cognitive bandwidth to notice the nudge. Complex financial jargon may render a "disclosure" functionally hidden.

  ### Step 4: The Means vs. Ends Screen (Autonomy Check)
  **Question:** Does this nudge help employees achieve *their own* goals, or does it substitute the firm's goals for theirs?
  *   **Sufficient Answer:** There is evidence that the majority of employees share the goal being nudged (e.g., most people want to save for retirement; not everyone wants to be vegan).
  *   **Stop Rule:** If **NO** (the firm is imposing a specific conception of the "good life" unrelated to core employment benefits), stop.
  *   **[JUDGMENT]:** *Defining "Shared Goals."* The group must distinguish between *instrumental* goals (having enough money to retire) and *comprehensive* goals (how to live a good life). Nudges should target the former.

  ### Step 5: The Welfare Evidence Screen (Benefit Check)
  **Question:** Is there empirical evidence that this specific change improves employee welfare without causing offsetting harm?
  *   **Sufficient Answer:** Data from pilot programs, academic literature, or industry benchmarks showing net positive outcomes.
  *   **Stop Rule:** If **NO** (the proposal is based on "hunches" or "best practices" without data), stop. Paternalism requires a justification of benefit.
  *   **[JUDGMENT]:** *Weighing "Offsetting Harm."* The group must judge if stress caused by a nudge outweighs the financial gain, for example.

  ### Step 6: The Distributional Screen (Equity Check)
  **Question:** Does this change disproportionately burden or confuse vulnerable subgroups (e.g., low-wage earners, non-native speakers, those with low financial literacy)?
  *   **Sufficient Answer:** Impact analysis shows the nudge works equally well across demographics, or safeguards are in place for vulnerable groups.
  *   **Stop Rule:** If **NO** (the nudge helps high-earners but penalizes low-earners), stop or require modification.
  *   **[JUDGMENT]:** *Defining "Disproportionate."* The group must decide what level of disparity is acceptable.

  ---

  ## Part 2: Application to Current Proposals

  Here is the output of running the CARP on your three desk proposals.

  ### Proposal 1: 401(k) Auto-Enroll (6%) + Auto-Escalation (to 10%)
  *   **Step 1 (Legality):** **PASS.** (Assuming QACA compliance).
  *   **Step 2 (Opt-Out):** **PASS.** Opt-out form is standard.
  *   **Step 3 (Transparency):** **CONDITIONAL PASS.** New hires are notified, but *annual escalation* often happens via email that goes unread.
      *   *[JUDGMENT]:* The group must decide if an annual email is sufficient transparency for an automatic pay cut.
      *   *Recommendation:* Require a "pre-escalation" notice 30 days prior with a one-click hold button.
  *   **Step 4 (Means/Ends):** **PASS.** Retirement security is a widely shared instrumental goal.
  *   **Step 5 (Welfare):** **PASS.** Strong evidence that auto-escalation increases wealth accumulation.
  *   **Step 6 (Distribution):** **FLAG.** 10% may be sustainable for high earners but cause liquidity crises for low-wage staff.
      *   *[JUDGMENT]:* Does the welfare gain of retirement savings outweigh the immediate harm of cash flow stress?
      *   *Decision:* **APPROVE WITH MODIFICATION.** Cap escalation at 6% for employees below a certain salary threshold, or allow a "hard stop" setting.

  **Verdict:** **Approved with Modifications.**
  *   *Why:* Instinct says "More savings is always good." The procedure forces you to acknowledge that *forced* savings can cause immediate financial harm to vulnerable staff (Step 6).

  ### Proposal 2: Cafeteria Layout (Healthy at Eye Level)
  *   **Step 1 (Legality):** **PASS.**
  *   **Step 2 (Opt-Out):** **PASS.** Unhealthy food is still available; walking 10 extra feet is not a significant barrier.
  *   **Step 3 (Transparency):** **PASS.** The food is visible; no hidden ingredients or deceptive labeling.
  *   **Step 4 (Means/Ends):** **PASS.** Health is generally a shared instrumental goal; the firm is not dictating *why* they must be healthy, just facilitating it.
  *   **Step 5 (Welfare):** **PASS.** Environmental nudges have high success rates with low stress.
  *   **Step 6 (Distribution):** **PASS.** Physical layout affects all employees equally.

  **Verdict:** **Approved.**
  *   *Why:* This is a classic "soft nudge." It clears every screen easily. It aligns with your instinct that this is harmless.

  ### Proposal 3: Peer-Comparison Message (Smiley Face for Above Average)
  *   **Step 1 (Legality):** **PASS.** (Assuming data privacy rules are met).
  *   **Step 2 (Opt-Out):** **FAIL.**
      *   *Analysis:* Can an employee opt out of seeing the message? If it pops up on the portal dashboard, the friction is high. More importantly, can they opt out of *being compared*?
      *   *Stop Rule:* If employees cannot easily disable the social comparison feature, this is **Hard Paternalism**.
  *   **Step 3 (Transparency):** **FLAG.**
      *   *Analysis:* Is the intent visible? "We want you to save more" is clear. But leveraging *social anxiety* is often hidden.
      *   *[JUDGMENT]:* Is a smiley face rational persuasion or emotional manipulation? Philosophically, leveraging shame or status anxiety bypasses rational deliberation.
  *   **Step 4 (Means/Ends):** **FAIL.**
      *   *Analysis:* This shifts the *End*. The goal becomes "be better than Bob in Accounting" rather than "secure my retirement." It encourages saving for *status*, not *security*.
  *   **Step 5 (Welfare):** **FLAG.**
      *   *Analysis:* For those below average, this induces stress/shame without providing a mechanism to improve (if they can't afford to save more).
  *   **Step 6 (Distribution):** **FAIL.**
      *   *Analysis:* Disproportionately shames lower-income employees who physically cannot match the contribution rates of higher bands, even if "job band" averages are used.

  **Verdict:** **Rejected / Redesign Required.**
  *   *Why:* Your instinct might be "Gamification motivates people." The procedure identifies this as **Manipulation** (Step 3) and **Ends-Substitution** (Step 4). It leverages social coercion rather than rational choice.
  *   *Required Fix:* Remove the smiley face and peer comparison. Replace with personal trajectory messaging ("You are on track to meet *your* stated goal").

  ---

  ## Part 3: Where the Procedure Fails (Limitations)

  This protocol is a screen, not a solution. You must be aware of three specific blind spots where the procedure will not save you.

  **1. The "Aggregation" Problem**
  The procedure evaluates proposals in isolation. It cannot tell you if approving three "harmless" nudges creates a cumulative burden.
  *   *Example:* The cafeteria layout (Proposal 2) is fine. The 401(k) nudge (Proposal 1) is fine. The wellness app notification is fine. But an employee receiving all three simultaneously may feel the firm is micromanaging their entire life.
  *   *Limitation:* The procedure has no "Total Nudge Load" metric. You must periodically step back and assess the *aggregate* choice environment.

  **2. The Definition of "Welfare"**
  Step 5 asks for evidence of welfare improvement, but "welfare" is a philosophical concept, not just a data point.
  *   *Example:* If employees *prefer* sugary snacks and derive genuine happiness from them, does the cafeteria layout (Proposal 2) actually reduce their welfare by making their preference harder to satisfy?
  *   *Limitation:* The procedure assumes "health" and "wealth" are objective goods. It cannot resolve deep value conflicts where employees genuinely prefer the "unhealthy" choice. At some point, you are imposing a value system, and no checklist hides that.

  **3. The Honesty of Proposers**
  The procedure relies on the information provided by the team proposing the nudge.
  *   *Example:* If the benefits vendor claims the opt-out is "one click" (Step 2) but the link is buried in a submenu, the procedure will pass it unless you test it yourself.
  *   *Limitation:* This is a paper review. It requires spot-checking the actual user interface to verify the "Opt-Out Cost" and "Transparency" claims.

  ### Final Recommendation for Your Role
  Use the CARP to structure your one-hour meetings. Print the six steps. When a proposer says, "It's just a small nudge," force them to answer Step 3 (Transparency) and Step 4 (Means vs. Ends) specifically.

  Your greatest risk is not the obvious defaults, but the **emotional leverages** (like Proposal 3). The procedure is designed to catch those by distinguishing between *helping people choose* and *making people feel they must choose.*
