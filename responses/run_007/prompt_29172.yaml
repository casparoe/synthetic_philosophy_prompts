      *   *Step 4: Ends vs. Means.* (Autonomy check). Does it change *what* they want or just help them get it? If it changes ends without reflection, it's problematic.
      *   *Step 5: Welfare Justification.* (Benefit check). Is there evidence this improves their life *as they would define it*?
