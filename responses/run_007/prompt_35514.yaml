          *   C4 says: He is nonetheless irrational/defective in deliberation.
          *   *Problem:* Irrationality is typically defined as failing to respond to reasons one has, or failing to deliberate correctly towards reasons one has. If C3 says there is no factual reason (because no path exists), what is the standard by which he is irrational in C4? If he has no reason to be kind, in what sense is he defective for not being kind? Usually, internalists say the callous person is not irrational, just different. Externalists say he is irrational because he ignores an objective reason. The user wants both: no factual reason (Internalist verdict) but still irrational/defective (Externalist verdict).
