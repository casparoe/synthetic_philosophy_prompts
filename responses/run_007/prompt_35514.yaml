          *   *Wait, let's look closer.* C1 says reason exists *only if* path exists. C3 says if no path, "he has a reason" is not factual. C4 says he is irrational/defective. If he is defective in deliberation, surely deliberation is about finding reasons. If there are no reasons, can deliberation be defective? Yes, if deliberation requires certain procedures (e.g., impartiality) that he fails. But C1 ties reasons to *his* motives. If his motives don't support kindness, and deliberation is instrumental/narrowly internal, he isn't deliberating badly. To say he is deliberating badly implies he *ought* to deliberate towards kindness. This looks like a clash between Internalism about reasons (C1/C3) and Externalism about rationality (C4).

      *   **Tension 2: C1/C3 vs. C6 (Objectivity vs. Internalism).**
          *   C1/C3 are strongly Internalist (reasons depend on subjective motivational set).
