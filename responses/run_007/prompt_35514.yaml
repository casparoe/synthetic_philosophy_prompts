answer: |-
  Dear Colleague

  Thank you for sharing your draft position statement on practical reasons. It is a sophisticated attempt to carve out a space between hard internalism and robust externalism, and it reads as a coherent Williams-style internalist account with objective deliberative standards. You have asked for a consistency audit of the six commitments you have outlined, and I have examined them closely to see how they interact. Overall, the set is remarkably stable, but there is one significant fault line that requires your attention before you present this to a wider audience. I shall walk you through the apparent tensions that dissolve on inspection before isolating the genuine conflict, ranking its severity, and suggesting how you might resolve it with the least cost to your overall theory.

  To begin with the apparent tensions, you might worry that your first commitment, which ties reasons to the agent's subjective motivational set, clashes with your sixth commitment, which asserts the objectivity of reasons. However, these two hang together perfectly well when read in light of your second commitment. Your internalism is not subjectivist in the sense that reasons are whatever the agent thinks they are; rather, they are determined by the objective facts about what would motivate the agent after sound deliberation. Therefore, two agents with identical motivational starting points and circumstances must have identical reasons, even if one agent is mistaken about what those reasons are. Your sixth commitment simply reinforces the objectivity of the deliberative path described in your second commitment, so there is no contradiction here. Similarly, there is no genuine tension between your fifth commitment regarding epistemic reasons and your first commitment regarding practical reasons. You are explicitly advocating a hybrid view where the normativity of belief differs from the normativity of action. Unless you are committed to a unified theory of reasons across all domains, which you do not state, holding externalism for belief and internalism for action is a consistent pluralist position. The only potential friction here lies in the scope of your sixth commitment; if you intend that claim to cover epistemic reasons as well as practical ones, it would contradict your fifth commitment. However, given the context of your statement, it is clear you are speaking primarily about practical reasons, so this tension dissolves provided you restrict the scope of the sixth commitment to the practical domain.

  The genuine tension lies between your third and fourth commitments concerning the callous person. This is the most severe issue in your set, and indeed it is the classic problem for internalist theories of reasons. In your third commitment, you state that if there is no deliberative path from the callous person's motives to kinder conduct, then saying he has a reason to be kind is not a factual report but rather an expression of blame or a wish. This entails that, strictly speaking, he does not have a reason to be kind. Yet in your fourth commitment, you assert that this same person is nonetheless irrational or defective in his deliberation. The tension arises because irrationality is typically understood as a failure to respond to reasons one has, or a failure to deliberate correctly towards such reasons. If your third commitment is true and he has no reason to be kind, it is difficult to see how he can be irrational for failing to be kind. To call him defective in deliberation implies there is a standard of deliberation he ought to have met, which in turn implies he ought to have had a reason to meet it. You are effectively trying to maintain the internalist verdict that he has no reason whilst simultaneously making the externalist judgement that he is irrational for not acting as if he did. This creates a normative gap where you wish to criticise the agent without granting him the reason that would justify the criticism.

  In terms of severity, this is the only genuine tension in your set, so it ranks first by default, but it is severe enough to undermine the normative force of your position. If you cannot call the callous person irrational without contradicting your internalist definition of reasons, your theory risks appearing to let the amoralist off the hook too lightly. To resolve this, something must give. You could revise your third commitment to allow that blame talk implies a reason the agent would have if he were rational, but this moves you closer to externalism and costs you the purity of your internalist condition. Alternatively, you could revise your fourth commitment. The least costly revision would be to soften the claim in your fourth commitment. Instead of saying the callous person is irrational or defective in deliberation, you might say he is substantively defective in character or morally blind. This preserves your internalist account of reasons and rationality whilst still allowing you to condemn the agent on moral grounds. You would be conceding that he is not irrational relative to his own motives, but merely vicious. This costs you the ability to claim that morality is demanded by rationality itself, but it saves your theory from internal contradiction.

  There is, however, a single revision that would resolve this tension while preserving most of your intuitions, though it comes with a specific theoretical cost. If you revise your fourth commitment to specify that the defect in deliberation is a failure to cultivate certain universal motives, such as empathy or respect, you can maintain that he is defective without implying he currently has a reason. This requires you to argue that there is a reason to acquire new motives even if current motives do not support them, which edges towards externalism. A cleaner single revision is to adjust your third commitment slightly. You might say that while saying he has a reason is not a report of a current motivational fact, it is a report of a normative truth about what motives he ought to have. This acknowledges the externalist intuition behind your fourth commitment without abandoning the internalist insight that reasons must motivate. The cost of this revision is that you cease to be a pure internalist; you become a hybrid theorist who accepts that some reasons are grounded in objective values rather than subjective motives. Given that you already hold a hybrid view regarding epistemic reasons in your fifth commitment, extending this hybridity to practical reasons might be the most consistent move overall. It would allow you to say the callous person has an objective reason he ignores, making him genuinely irrational, whilst acknowledging that this reason does not stem from his current desires.

  In summary, your position is largely coherent, with the internalist mechanics of your first, second, and sixth commitments working well together. The only significant threat to consistency is the clash between denying the callous person a reason in your third commitment and accusing him of irrationality in your fourth. I recommend you consider whether you are willing to pay the cost of moving towards a hybrid externalism to save the claim that the callous person is irrational, or whether you prefer to remain a pure internalist and accept that he is vicious but not irrational. Either choice is philosophically defensible, but maintaining both claims as they stand will leave you open to objection. I hope this audit proves useful as you refine your statement.

  Yours sincerely

  A Philosophical Friend
