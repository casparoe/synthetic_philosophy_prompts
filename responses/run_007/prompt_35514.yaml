          *   *Analysis:* C2 actually bridges this. C2 says the path exists objectively even if the agent doesn't see it. C6 reinforces C2. So C1+C2+C6 are consistent (Williams-style Internalism is compatible with objectivity about the hypothetical deliberative path).
          *   *Verdict:* Apparent tension. C6 clarifies C2.

