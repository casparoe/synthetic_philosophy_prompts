answer: |-
  **Project Title:** The Structural Discontinuity of Suffering: A Principled Account of Lexical Thresholds in Negative Utilitarianism

  **Principal Investigator:** [Your Name]
  **Duration:** 6 Months
  **Request:** [Amount]

  ### 1. Project Summary
  Lexical Threshold Negative Utilitarianism (LTNU) posits that suffering above a certain intensity threshold cannot be outweighed by any amount of pleasure or mild suffering. While this view avoids the counterintuitive implications of standard Negative Utilitarianism (such as the justification of destroying the world to prevent a minor headache), it faces the "Arbitrariness Objection": if pleasure and pain are commensurable below the threshold, what principled feature justifies the shift to lexical priority above it? This project investigates whether LTNU can survive this objection by disentangling two distinct functions currently conflated in the threshold concept: (1) marking a scalar discontinuity in badness, and (2) switching the structural mode of comparison from compensatory to non-compensatory. Over six months, this conceptual analysis will determine if a coherent account of the threshold is possible without collapsing into full commensurability or radical incommensurability.

  ### 2. Research Question and Background
  **Primary Question:** Can a lexical threshold view provide a principled account of where and why compensation stops, without collapsing into full commensurability (rendering the threshold arbitrary) or full incommensurability (rendering below-threshold tradeoffs mysterious)?

  **Background and State of the Field:**
  LTNU is widely recognized as a leading candidate for reconciling the intuition that suffering matters most with the intuition that some trade-offs are permissible. **[Settled]:** It is generally accepted in the literature that LTNU faces the "Patch Objection"—the charge that the threshold functions as an ad hoc constraint rather than a derived feature of value theory. **[Settled]:** It is also agreed that standard hedonic scales (single-dimension magnitude) struggle to accommodate lexical jumps without invoking vagueness or epistemicism.

  **[Contested]:** However, there is significant disagreement regarding *why* the threshold fails. Some argue the problem is phenomenological (we cannot identify a sharp pain intensity where value changes); others argue it is structural (lexicality is incompatible with aggregation). **[Contested]:** Furthermore, it remains unresolved whether "commensurability" below the threshold implies a single currency of value or merely a pragmatic heuristic for low-stakes decisions.

  Current defenses typically focus on locating the threshold (e.g., at the point of "agony" or "agency destruction"). This project shifts focus from *location* to *function*. The working hypothesis is that existing formulations fail because they attempt to use a single threshold to perform two incompatible jobs: measuring a jump in magnitude and changing the rules of aggregation.

  ### 3. Methodology and Approach
  This project employs conceptual analysis and formal axiology. It proceeds in three phases:

  **Phase 1: Diagnostic Mapping (Months 1-2)**
  I will formalize the "Dual-Function Problem." Current LTNU models treat the threshold as a point $T$ on a scale $S$ where the value function $V(x)$ becomes infinite or lexical. I will demonstrate that this conflates:
  1.  **Scalar Discontinuity:** A jump in the magnitude of disvalue (e.g., agony is $1000\times$ worse than a pinch).
  2.  **Structural Discontinuity:** A change in the aggregation rule (e.g., below $T$, utilitarian summation applies; above $T$, lexicographical ordering applies).

  **Phase 2: Constructing the Separation Model (Months 3-4)**
  I will test whether separating these functions allows for a principled defense.
  *   *Hypothesis A:* Scalar discontinuity can be grounded in phenomenology (e.g., the breakdown of cognitive integration), while Structural discontinuity is grounded in deontological constraints (e.g., rights violation).
  *   *Hypothesis B:* The threshold is not a point on a scale but a boundary between two distinct evaluative domains (e.g., "welfare" vs. "dignity"), requiring a pluralistic value theory rather than a monistic hedonism.

  **Phase 3: Stress Testing (Months 5-6)**
  I will subject the Separation Model to standard counterexamples (e.g., "The Hellish Sorites": if one second of agony is lexical, is 0.9 seconds commensurable?). I will determine if the model resolves the arbitrariness objection or merely displaces it to the boundary between the two domains.

  ### 4. Alternatives and Risks
  **Alternative 1: Standard Negative Utilitarianism.**
  *   *Status:* Rejects the threshold.
  *   *Critique:* Collapses into the "Repugnant Conclusion" for suffering (destroying humanity to prevent minor pain). This project assumes this is a bullet most ethicists are unwilling to bite. **[Contested]:** Some hard negative utilitarians argue this is the only consistent view.

  **Alternative 2: Radical Incommensurability.**
  *   *Status:* Pleasure and pain are never commensurable.
  *   *Critique:* Makes everyday decision-making impossible. LTNU is preferred because it allows trade-offs below the threshold. If my project shows below-threshold trade-offs are unjustified, LTNU collapses into this view.

  **Risk:** The primary risk is that separating scalar and structural discontinuity reveals that LTNU requires a pluralistic theory of value (e.g., hedonism + deontology), which undermines its status as a *utilitarian* view. This would be a significant theoretical result, though it may negate the original goal of saving LTNU specifically.

  ### 5. Expected Outcomes and Deliverables
  1.  **Working Paper:** "The Dual-Function Problem in Lexical Thresholds" (approx. 8,000 words), submitted to a peer-reviewed journal (e.g., *Utilitas* or *Philosophical Studies*).
  2.  **Formal Model:** A schematic representation of the Separation Model, distinguishing magnitude jumps from aggregation rule changes.
  3.  **Conference Presentation:** Presentation of findings at a specialist ethics workshop.

  ### 6. Conditions for Failure
  This project will be deemed to have failed to support LTNU if:
  1.  **The Regress Problem:** Separating the two functions requires a second threshold to explain the transition between the two modes, leading to infinite regress.
  2.  **The Collapse:** The principled account of the threshold inevitably relies on non-hedonic values (e.g., autonomy), proving that *hedonic* LTNU is untenable.
  3.  **The Vagueness Persistence:** Even with separation, the boundary between the compensatory and non-compensatory domains remains vulnerable to Sorites-style arbitrariness objections.

  ### 7. Timeline
  *   **Month 1:** Literature review and formalization of the Dual-Function Problem.
  *   **Month 2:** Drafting the Diagnostic Mapping section.
  *   **Month 3:** Developing the Separation Model (Hypothesis A & B).
  *   **Month 4:** Stress testing against Sorites and Monster objections.
  *   **Month 5:** Drafting the full manuscript.
  *   **Month 6:** Revision, peer feedback, and submission.

  ***

  **Note on Consensus vs. Contention:**
  *Per the project requirements, this proposal distinguishes between settled objections (the existence of the Arbitrariness Objection) and contested solutions (whether phenomenological markers can resolve it). The hypothesis that the threshold conflates scalar and structural discontinuity is novel and not currently consensus; it is the specific variable this research intends to test.*
