  **MEMORANDUM**

  **TO:** The Law Reform Commission
  **FROM:** [Your Name], Commissioner
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding the Criminal Prohibition on Consensual Adult Incest

  **1. Introduction and Recommendation**

  The Commission is tasked with reviewing Section [X] of the Criminal Code, which prohibits sexual relations between adult siblings. Currently, this offense is classified as a felony carrying a substantial custodial sentence. This penalty places the conduct in the same category as serious violent crimes, despite the absence of a complainant or direct victim in cases involving competent, consenting adults.

  After reviewing the submissions and deliberating on the competing interests, I recommend that the Commission propose the **repeal of the criminal prohibition on sexual relations between consenting adult siblings.**

  This recommendation is not an endorsement of the conduct, nor a denial that complex ethical issues surround it. Rather, it is a conclusion that the criminal law, particularly in its current severity, is the wrong tool for regulating this private behavior. While I acknowledge the force of the arguments for retention, specifically regarding the protection of family dynamics, these concerns are better addressed through existing laws regarding coercion and abuse, rather than a blanket criminal ban on private intimacy.

  **2. The Argument for Liberty and Privacy**

  The primary argument for repeal rests on the limits of state power in a free society. The criminal law is the most intrusive instrument the state possesses. It deprives individuals of liberty, imposes lasting stigma, and consumes significant public resources. To justify its use, there must be a clear and compelling public interest that cannot be achieved by less intrusive means.

  In the case of two adult siblings engaging in private, consensual sexual conduct, there is no direct victim. No third party is harmed without their consent. Proponents of retention often point to the risk of genetic defects in offspring. However, this justification is overbroad. It applies the criminal law to couples who cannot conceive (due to age, infertility, or same-sex pairings) and to those who utilize contraception or sterilization. If the state's interest is preventing genetic disease, public health measures and counseling are more targeted and less destructive than imprisonment. When the genetic rationale is removed, the state is left punishing conduct solely because it occurs between specific relatives, intruding into the most private sphere of human life without a tangible harm to justify the intrusion.

  **3. The Argument for Moral Enforcement**

  A second argument for retention posits that society is entitled to use the criminal law to uphold shared moral convictions. On this view, certain acts are intrinsically degrading or violate the natural order, and the law serves to mark these boundaries to preserve the moral character of the community.

  While the law inevitably reflects some moral choices (for example, prohibitions on cruelty), relying solely on moral disapproval is problematic in a pluralistic society. Citizens hold diverse views on sexuality, family, and religion. When the state imprisons individuals for violating a moral boundary that does not correspond to a tangible harm, it effectively takes sides in a moral debate and enforces one view through force. This risks turning the criminal code into a weapon of social conformity rather than a shield against injury. If the only justification for a felony conviction is that the majority finds the conduct repugnant, the law risks losing its legitimacy among those who do not share that specific moral intuition.

  **4. The Strongest Consideration for Retention: Family Integrity and Coercion**

  I turn now to the most compelling argument for retaining some form of prohibition. This is the argument that the "family" is a unique institution that requires special protection, and that consent within a family cannot be trusted to be free.

  This position does not rely merely on disgust or abstract morality. It argues that family relationships are defined by lifelong power dynamics, emotional dependency, and shared history. Even between adults, a sibling relationship may carry residues of childhood hierarchy or emotional leverage that make "consent" ambiguous. A younger sibling may agree to a relationship not out of desire, but out of a deep-seated inability to say "no" to an older sibling, or to preserve family peace. Furthermore, allowing sexual relationships within the nuclear family could blur the roles that make the family a safe environment for raising children, potentially destabilizing the institution itself.

  This is the strongest consideration on the side of retention. It identifies a real risk: that the unique pressures of family life can create coercion that is invisible to the outside eye and difficult to prove in a standard sexual assault trial. It suggests that a specific prohibition acts as a necessary bright-line rule to prevent exploitation that general laws might miss.

  **5. Why This Consideration Does Not Justify Criminalization**

  While the concern regarding family dynamics is serious, it does not justify the current criminal prohibition for three key reasons.

  First, **the law already prohibits coercion.** We have statutes criminalizing sexual assault, abuse of authority, and predatory behavior. If an older sibling coerces a younger one through emotional manipulation or threats, that conduct is already punishable. The current incest statute, however, does not require proof of coercion. It criminalizes the act even when the evidence shows the relationship is genuinely mutual and non-exploitative. To presume coercion in every adult sibling relationship is to treat competent adults as incapable of managing their own private lives.

  Second, **the "harm to the institution" is too abstract for criminal sanctions.** While blurring family roles may be socially undesirable, the criminal law is generally reserved for concrete harms to individuals. Punishing someone with years of prison to protect the "symbolic integrity" of the family structure is disproportionate. It sacrifices the actual liberty of living individuals to protect an abstract concept.

  Third, **criminalization may increase harm.** The fear of felony prosecution drives these relationships further underground. It discourages individuals from seeking counseling or medical advice. It creates a scenario where a consensual relationship is treated with the same severity as violent predation, which undermines the gravity of actual sexual violence.

  **6. The Question of Modified Penalties**

  Some Commissioners have suggested a compromise: retaining the prohibition but reducing the penalty from a felony to a misdemeanor, or removing custodial sentences. While this is an improvement over the status quo, it fails to resolve the core issue. A criminal conviction, even for a minor offense, carries stigma and collateral consequences (employment, housing, travel). If the conduct does not warrant a felony because it lacks the harm typical of violent crime, and if the "coercion" argument is better handled by assault laws, then there is no remaining justification for *any* criminal sanction. A modified penalty still uses the blunt force of the criminal state to enforce a moral or social boundary between consenting adults.

  **7. Conclusion**

  The criminal law must be used sparingly. It is justified when it prevents harm to others that cannot be prevented by less intrusive means. In the case of consenting adult siblings, the genetic risks are manageable through health policy, the moral objections are insufficient grounds for imprisonment in a diverse society, and the risks of coercion are covered by existing sexual assault statutes.

  The strongest argument for retention—that family dynamics create unique risks of hidden coercion—is vital. However, it justifies vigilance and civil intervention, not a blanket felony prohibition that presumes guilt without proof of force. Therefore, I recommend we propose the repeal of the offense for consenting adults, alongside a recommendation to review existing sexual assault and coercion statutes to ensure they adequately protect vulnerable family members from abuse of power.

  This approach respects individual liberty without abandoning those who are truly vulnerable to exploitation within the family home.
