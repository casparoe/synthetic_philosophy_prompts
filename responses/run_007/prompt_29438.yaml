          *   *Strong:* The "User" record doesn't exist in the `Persons` table until certain conditions are met. It's not just `INSERT INTO Humans`. It's a state machine. `PersonhoodStatus` is a computed column or a role based on event sourcing (participation logs).

      *   *Concept:* Relationships/Community.
      *   *Tech:* Foreign Keys, Join Tables, Graph Edges.
      *   *Ubuntu Translation:* Foreign Keys aren't just constraints; they are *dependencies* required for instantiation. Dependency Injection (DI): You cannot instantiate a `Person` object without injecting `CommunityContext`. Constructor injection is mandatory.

      *   *Concept:* The "Strong" Version (Degrees of Personhood).
      *   *Tech:* Permissions, Roles, Validation Logic.
      *   *Ubuntu Translation:* Referential Integrity isn't binary (valid/invalid). It's weighted. A node with low edge weight/centrality has lower "access privileges" to the concept of Personhood. Garbage collection might apply to orphaned nodes (those cut off from community).

      *   *Concept:* The "Mild" Version (Constitutive).
      *   *Tech:* Composition over Inheritance.
