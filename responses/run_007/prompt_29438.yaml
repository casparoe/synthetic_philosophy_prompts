      *   *Core Tenet:* *Umuntu ngumuntu ngabantu* (A person is a person through other persons).
      *   *Ontological Claim:* Relationality is constitutive of identity.
      *   *Ethical/Normative Claim:* There are obligations to the community.
      *   *The "Strong" Version (Gradable):* This aligns with certain African philosophical interpretations (e.g., Menkiti) where personhood is an *achievement* or a *status* earned through social integration, ritual, and moral behavior. It's teleological.
