      *   **User's Background:** Has read some LessWrong (rationalist community), knows the distinction between *rational herding* (Bayesian updating based on others' actions) and *social conformity* (preference for fitting in/avoiding social sanction).
      *   **Task:** Evaluate the provided summary sentence-by-sentence from the perspective of an information cascade theorist (academic/economic literature). Identify what's accurate vs. sloppy.
      *   **Specific Question:** Does the claim "cascades show markets are inefficient" follow from the accurate parts, or is it a leap?

  2.  **Deconstruct the Provided Summary (Sentence by Sentence):**

      *   *Sentence 1:* "An information cascade is what happens when people stop thinking for themselves and just copy the crowd."
