prompt: |-
  So I'm a novelist, and my current project has this subplot about an ornithologist — proper old-school guy, spends his life in the field, keeps meticulous notebooks — who stumbles across Hempel's raven paradox and it basically unravels him. The idea is that he goes through the various philosophical resolutions one by one, convinced each time that he's found the way out, only to realize there's a catch. I need to get the sequence right so it feels true to the actual intellectual landscape, not just whatever I think sounds dramatic. I've read enough to know there are a bunch of competing resolutions — the Bayesian one, the one about the size of the universe, Hempel's own "it's not actually a paradox" move, the one that rejects instance confirmation outright, and a few others I'm probably missing — but I don't have a good sense of how they stack up against each other.

  For those who need the refresher: the paradox is that "All ravens are black" seems logically equivalent to "All non-black things are non-ravens," and observing a red apple (a non-black non-raven) apparently confirms the latter, so by equivalence it confirms the former — but that feels insane. The question is what's gone wrong, if anything.

  I want you to rank the main proposed resolutions from most to least satisfying. By "satisfying" I mean: does it actually make the queasy feeling go away, or does it just dress up the paradox in formal clothes and call it settled? Not technical elegance — gut-level resolution. One sentence per entry explaining the placement. Don't worry about covering every niche variant in the literature; the five or six big families of response is what I need.

  Then, separately: which resolution would make the best dramatic beat for a character to latch onto and then become disillusioned with? The kind of thing where he thinks "aha, that's it" and then a few weeks later, out in the field, realizes it doesn't hold.

  Give me the output as a JSON object. Fields: "rankings" — an array of objects, each with "resolution_name" (string), "rank" (integer, 1 is best), "one_sentence_reason" (string). And "best_dramatic_beat" — an object with "resolution_name" (string) and "why" (string, a couple sentences on why it works dramatically, what the initial appeal is and what the crack in it turns out to be).
