answer: |-
  ### Exam Question

  **Question 1:** Stanley and Williamson defend Intellectualism by arguing that knowing-how is a species of knowing-that, distinguished by a "practical mode of presentation" (PMOP). 

  (a) Reconstruct Ryle's regress argument specifically as an objection to this Intellectualist thesis (i.e., demonstrate why positing propositional knowledge as the guide for action allegedly generates a vicious regress for the intellectualist, rather than simply stating Ryle's own view). 
  (b) Evaluate whether the PMOP successfully blocks this regress. 
  (c) If the PMOP fails to block it, what are the intellectualist's remaining dialectical options? 

  *(Recommended time: 90 minutes)*

  ***

  ### Model Answer

  Stanley and Williamson's Intellectualism asserts that to know how to $\phi$ is to know, of a way $w$, that $w$ is a way to $\phi$. This reduces knowing-how to a species of knowing-that (propositional knowledge), differentiated only by the mode under which the proposition is grasped. While this preserves the unity of knowledge, it invites a reconstructed Rylean regress that targets the intellectualist's specific commitment to propositional guidance.

  The regress objection against Intellectualism runs as follows: If intelligent action requires being guided by knowledge-that, the agent must first contemplate the relevant proposition to apply it. For example, to act intelligently on the knowledge that $w$ is a way to $\phi$, the agent must employ that knowledge. However, employing a proposition is itself an intelligent act. If all intelligent acts require prior contemplation of a guiding proposition, then employing the first proposition requires contemplating a second proposition regarding *how* to employ the first. This generates an infinite chain of prior contemplations. Since finite agents cannot complete an infinite chain of mental acts before acting, Intellectualism implies intelligent action is impossible. The force of this objection is not merely that Ryle prefers dispositions, but that the Intellectualist's own mechanism for guidance (propositional contemplation) renders action impossible.

  Stanley and Williamson attempt to halt this regress via the Practical Mode of Presentation (PMOP). They argue that while the content of knowing-how is propositional, the *way* it is grasped is practical. One does not need to contemplate a further proposition to grasp a proposition under a PMOP; the grasping is immediate and non-intellectual. Essentially, the PMOP is meant to be the "stopping point" where propositional knowledge interfaces with action without requiring further propositional mediation.

  However, it is unclear whether the PMOP genuinely escapes the regress. The objection resurfaces when we ask what constitutes "grasping" a PMOP. If grasping a proposition under a practical mode is itself a cognitive achievement, does it require know-how? If grasping a PMOP requires knowing how to grasp it, the regress returns inside the mode of presentation. As Noë and Fridland suggest, if the practical mode is distinct from standard theoretical modes, there must be an ability to utilize that mode. If that ability is analyzed intellectualistically (as knowing-that), we restart the regress. If it is analyzed anti-intellectualistically (as a brute ability), Intellectualism concedes that knowing-how (at the level of grasping) is fundamental, undermining the reductive thesis. The PMOP risks being a label for the very capacity Ryle identified, disguised as a propositional attitude.

  If the PMOP fails to block the regress, the intellectualist has two remaining dialectical options. First, they could embrace a hybrid view, conceding that while knowing-how involves propositional knowledge, it essentially relies on a foundational, non-propositional knowing-how to grasp those propositions. This saves the intuition that knowledge is involved but abandons the strong reductive claim that knowing-how is *just* knowing-that. Second, they could refine the account of "guidance." They might argue that propositional knowledge guides action dispositionally rather than occurrently. If the knowledge does not require *occurrent* contemplation to guide action, the regress of prior mental acts is avoided. However, this moves Intellectualism closer to Ryle's dispositionalism, risking the collapse of the distinction between the two views. Ultimately, unless the intellectualist can explain the "practical" in PMOP without smuggling in unanalyzed know-how, the regress remains a potent threat to the reductive project.

  ***

  ### Marking Scheme (Total: 25 Points)

  **A-Range (20–25 Points): Excellent**
  *   **Regress Reconstruction (8–10 pts):** Clearly reconstructs the regress *as a problem for Intellectualism* (focusing on the requirement for occurrent contemplation/application of propositions), rather than just summarizing Ryle's positive view.
  *   **PMOP Evaluation (8–10 pts):** Critically assesses the PMOP. Identifies the specific vulnerability: that "grasping" a PMOP may itself require know-how, reintroducing the regress. Does not simply assert the PMOP works or fails without justification.
  *   **Remaining Options (4–5 pts):** Plausibly outlines dialectical moves (e.g., hybrid views, dispositional guidance) available if PMOP fails.
  *   **Clarity:** Argument is tight, precise, and within word limits.

  **B-Range (15–19 Points): Good**
  *   **Regress Reconstruction (5–7 pts):** Accurately states the regress but may treat it as Ryle's general argument rather than tailoring it specifically against the Intellectualist's claim of propositional guidance.
  *   **PMOP Evaluation (5–7 pts):** Explains the PMOP correctly but offers a surface-level evaluation (e.g., "S&W say it stops the regress, but critics disagree" without explaining *why* the critics think it returns).
  *   **Remaining Options (3–5 pts):** Mentions remaining options but they may be vague or lack dialectical connection to the failure of the PMOP.
  *   **Clarity:** Competent but may lack the analytic bite of the A-range.

  **C-Range (10–14 Points): Adequate/Weak**
  *   **Regress Reconstruction (3–5 pts):** Summarizes Ryle and S&W separately but fails to reconstruct the regress as an *objection* to S&W.
  *   **PMOP Evaluation (3–5 pts):** Defines PMOP but accepts it uncritically or rejects it based on a misunderstanding (e.g., claiming PMOPs are non-propositional content).
  *   **Remaining Options (0–4 pts):** Omits the discussion of remaining options or provides irrelevant information.
  *   **Clarity:** Heavy on summary, light on argument.

  **Most Common Mistake:**
  Students claim practical modes avoid the regress because they are not propositions without explaining what a practical mode of presentation actually is or why it wouldn't itself require know-how to grasp.
