answer: |-
  Here is your Q&A prep sheet, tailored to the specific factions in the room and the technical vulnerabilities of your argument.

  ### 1. The "Big Name" Prioritarian (High Damage / High Likelihood)
  **The Objection:**
  "I think you're conflating a loss in *total* welfare with a Pareto-inferior move. Prioritarianism is defined by a strictly increasing transformation function applied to individual welfare. By definition, if everyone is worse off in absolute terms, the prioritarian sum *must* decrease. So, either your 'leveling-across' case is just a standard utility loss which we admit, or you're attributing a violation of the Weak Pareto Principle to us that isn't there. Are you actually arguing that we recommend making everyone worse off, or just that we recommend large losses to the rich for small gains to the poor? Because if it's the former, the math doesn't hold."

  **Your 2-Minute Reply:**
  "Thanks, that's the crucial distinction. I'm not arguing standard prioritarianism violates Weak Pareto in a static, certain context. My claim is about the *implications* of the weighting function under realistic distributional constraints. To make prioritarianism distinct from utilitarianism, the concavity must be steep. Once it is, we get cases where the weighted gain to the worse-off outweighs the weighted loss to the better-off, even when the *unweighted* total welfare drops significantly and the better-off are made drastically worse off.
  My point is that this *functions* like leveling down in practice: we are sacrificing significant absolute welfare for the sake of the weighting pattern. It's not that *no one* gains, but that the gains are so trivial relative to the losses that the recommendation becomes counterintuitive in the same way leveling down is. I'm calling this 'leveling-across' to highlight that the priority weight effectively masks a utility loss that looks suspiciously like the egalitarian's leveling down."

  **Where This Reply is Soft:**
  You are walking a tightrope. If you concede you aren't violating Pareto, the Prioritarian will say, "Then you haven't found a new objection; you've just described a trade-off we accept." If you insist everyone is worse off, they will prove you wrong with basic calculus. You need to pivot quickly to the *counterintuitive nature* of the trade-off, not the mathematical impossibility of Pareto violations.

  ### 2. The Telic Egalitarian (Medium Damage / Very High Likelihood)
  **The Objection:**
  "Wait, aren't you accidentally helping us? We've always said the Leveling-Down Objection (LDO) isn't fatal, or that it only applies to *telic* views in a specific way. If you show that Prioritarianism—which was supposed to be the 'sensible' alternative—actually inherits the same counterintuitive commitments as egalitarianism once the weights get steep, doesn't that just vindicate the egalitarian claim that distribution matters intrinsically? Why is this a bug for them and not just a feature of caring about equality?"

  **Your 2-Minute Reply:**
  "It's a bug for them because Prioritarianism sells itself on avoiding the LDO while keeping the 'person-affecting' intuition. Egalitarians can bite the bullet and say equality is intrinsically valuable even if no one benefits. Prioritarians claim to care about individuals *and* priority, without the absurdity.
  My argument shows they can't have it both ways. If they set the weights high enough to satisfy the egalitarian intuition (which they need to do to be distinct from utilitarians), they get the absurdity without the theoretical honesty. They get the worst of both worlds: the complexity of a weighting function that still recommends sacrificing total welfare in ways that don't clearly benefit the worse-off in absolute terms. It undermines their main selling point: that they are the 'reasonable' middle ground."

  **Where This Reply is Soft:**
  The Egalitarians in the room might not care if Prioritarianism fails; they might be happy to say, "See, we told you so." You need to ensure you don't sound like you're arguing *for* Egalitarianism, but rather that Prioritarianism is *unstable*.

  ### 3. The Utilitarian (Low Damage / Medium Likelihood)
  **The Objection:**
  "This whole debate seems like tinkering on the deck chairs. If your argument is that Prioritarianism sometimes reduces total welfare to satisfy a weighting function, isn't that just proof that we should stick to classical utilitarianism? Why should we care about this 'leveling-across' problem specifically, rather than just concluding that any view deviating from sum-ranking is flawed?"

  **Your 2-Minute Reply:**
  "Because the Prioritarian view is the dominant framework in contemporary distributive justice. It's the view actually being used to model policy. If Utilitarianism is your baseline, you've already rejected priority. But for the majority of this room who think raw aggregation ignores the urgency of the worse-off, my argument shows that fixing Utilitarianism with priority weights introduces a new, hidden cost.
  I'm not arguing for Utilitarianism; I'm arguing that the 'fix' Prioritarians propose is less stable than they claim. If you want to avoid the Utilitarian conclusion, you can't just slap a concave function on it and assume the LDO disappears. The problem doesn't vanish; it just shifts shape."

  **Where This Reply is Soft:**
  Utilitarians are often unmoved by "instability" arguments. They care about truth, not consensus. If your argument implies total welfare loss is bad, they will ask why you don't just join them. Keep the focus on the *audience's* commitments, not the Utilitarian's.

  ### 4. The Grad Student (Low Damage / High Likelihood)
  **The Objection:**
  "Could you clarify the 'leveling-across' mechanism? Is this happening in ex-ante cases with risk, or is this a deterministic distribution? Because if it's deterministic, I'm struggling to see how the sum goes up if the total welfare goes down, unless the weighting function is doing something non-standard."

  **Your 2-Minute Reply:**
  "Great question. I'm focusing on deterministic cases to make the strongest point. Imagine a transfer where the rich lose 100 units and the poor gain 10. Total welfare drops by 90. But because the poor are at a much lower baseline, the *transformed* value of that 10 outweighs the transformed loss of the 100.
  The 'leveling-across' is that the priority weight effectively treats that 10 units for the poor as 'more important' than the 100 units for the rich, to the extent that it mimics a leveling-down intuition. It's not that the sum goes down; it's that the *recommendation* persists despite the massive drop in unweighted welfare."

  **Where This Reply is Soft:**
  This is technically just the standard Prioritarian trade-off. The student might press: "Isn't that just... Prioritarianism?" You need to emphasize why this specific ratio (huge loss for tiny gain) is *distinctively* problematic compared to standard transfers.

  ***

  ### The Nightmare Question
  **Pray nobody asks this:**
  "If your weighting function is strictly increasing, as you admitted in your setup, then by definition $\sum f(w_i)$ cannot increase if all $w_i$ decrease. So, when you say prioritarianism recommends policies where 'absolute numbers are lower across the board,' are you literally claiming Prioritarianism violates the Pareto Principle, or are you misdescribing the case? If it's the former, your math is wrong. If it's the latter, where is the 'leveling-down' analogue?"

  **Why this kills you:**
  This exposes the potential contradiction in your core claim. Prioritarianism *cannot* recommend a move where everyone is worse off. If you meant "total welfare is lower" but *some* gain, you must clarify that immediately. If you meant "everyone is worse off," you have to concede the point or argue for a non-standard version of Prioritarianism (like ex-ante prioritarianism under uncertainty), which opens a whole new can of worms.

  ***

  \answer{The position's biggest vulnerability is the mathematical impossibility of standard prioritarianism recommending a outcome where everyone is absolutely worse off, which risks making your central "leveling-across" claim appear to be a category error.}
