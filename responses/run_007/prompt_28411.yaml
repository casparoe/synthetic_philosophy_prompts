      *   *Center of Gravity:* The "Self" (CoNG).
      *   *Physicist/Observer:* The person themselves + Other people (society).
      *   *Prediction:* Anticipating behavior, moral responsibility, legal identity.

  4.  **Auditing the Disanalogies (The "Gears-Level" Critique):**
      *   *Uniqueness/Objectivity:* CoG is mathematically determined by mass. CoNG is *interpretive*. Different narrators get different centers. Does this matter? Yes, it makes the "self" less stable than the analogy suggests.
      *   *Causal Powers:* CoG doesn't cause the chair to fall; gravity + mass do. But the *belief* in a self *does* cause behavior (self-fulfilling prophecy). This is a crucial reversal. The abstraction has downward causation in the psychological case, unlike the physical case.
