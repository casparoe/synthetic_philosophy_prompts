      *   *Target:* The Self (specifically, the Center of Narrative Gravity).
      *   *Core Claim:* CoG is real (in a sense) but abstract. It's not a physical part. It's useful for prediction. Similarly, the Self is real (in a sense) but abstract. It's not a homunculus. It's useful for social coordination.
