  You are a CEO facing a potential liability claim (50% prior probability) investigated by an insurer using a high-accuracy behavioral algorithm. The insurer sends a settlement offer *if and only if* their algorithm predicts (Liability XOR You Accept). If you Accept and are Not Liable, you receive a massive premium waiver (Counterfactual Mugging reward); if you Accept and are Liable, you pay a deductible; if you Reject and are Liable, you pay full damages; if you Reject and are Not Liable, you pay nothing. You receive the offer.

  Causal Decision Theory (CDT) treats the liability state as fixed and the algorithm's prediction as evidence; it calculates the expected utility of accepting based on the posterior probability of liability given the offer, typically recommending acceptance if the deductible is lower than the expected damages. Updateless Decision Theory (UDT) treats your decision as logically correlated with the algorithm's prediction; it recognizes that a policy of "Accept" makes the (Liability XOR True) condition true, correlating you with the No-Liability state to secure the offer, but simultaneously realizes that in this specific XOR structure, "Accept" correlates with Liability (since Offer + Accept → Liability), meaning UDT recommends Rejecting to inhabit the No-Liability world, thereby forfeiting the Counterfactual Mugging waiver. The theories diverge because CDT ignores the logical dependence of the *offer's existence* on the *decision algorithm*, while UDT internalizes it. The structural feature doing the work is the **logical dependence of the opportunity on the action** (the XOR condition); removing this collapses the case into a standard Counterfactual Mugging (offer always sent) or XOR Blackmail (no counterfactual reward). A defender of CDT would resist by arguing that an agent cannot causally influence past facts (liability status) or the insurer's prior computation; this response is principled regarding physical causality but appears ad hoc in contexts where logical correlation, not physical causation, determines payoff structures.
