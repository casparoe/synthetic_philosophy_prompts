answer: |-
  # Taxonomy of Solutions to the Fermi Paradox

  **The Starting Observation:** Our galaxy is old (13.6 billion years) and large (100 billion stars). Colonization via modest technology could span the galaxy in ~10 million years. Yet, we see no evidence of others.

  **Instructions:** Follow the questions below. Each question divides the logical space based on concrete claims about the universe, not by naming theories. Your path ends at a **Bolded Position**. Notes in *italics* indicate the logical status of the position.

  ---

  ### 1. Is intelligent life common enough that others should have arisen by now?
  *(Given 100 billion stars and billions of years, is abiogenesis and evolution likely to happen more than once?)*

  *   **NO → Rare Earth (or Rare Abiogenesis)**
      *   *Defended.* The filter is behind us; life/intelligence is uniquely difficult.
  *   **YES → (Others exist or have existed.) Go to Question 2.**

  ### 2. Do civilizations typically survive long enough and choose to expand visibly?
  *(Do they avoid self-destruction and possess the drive to colonize stars or broadcast signals for millions of years?)*

  *   **NO (They die out) → Great Filter Ahead**
      *   *Defended.* Technology leads to inevitable self-destruction before expansion.
  *   **NO (They choose not to) → Non-Expansionist / Homebody**
      *   *Minority View.* Expansion is not a universal imperative; they stay home by choice.
  *   **YES → (They should be everywhere.) Go to Question 3.**

  ### 3. Would their presence be detectable by us as technology?
  *(Would their energy use, probes, or signals look like distinguishable astronomical phenomena to our instruments?)*

  *   **NO → Post-Biological / Unrecognizable**
      *   *Defended.* They have migrated to substrates (e.g., Matrioshka brains) we cannot perceive as "civilization."
  *   **YES → (We should see them.) Go to Question 4.**

  ### 4. Have we searched the right places and signals thoroughly enough?
  *(Have we checked enough stars, wavelengths, and time windows with sufficient sensitivity?)*

  *   **NO → Wrong Search Method**
      *   *Defended.* We are looking for needles in haystacks we haven't searched yet.
  *   **YES → (They are not visible despite our effort.) Go to Question 5.**

  ### 5. Is there enough time for them to have reached our specific star system?
  *(Given galactic colonization speeds, is it statistically likely they have arrived here specifically?)*

  *   **NO → Early Bird / Percolation Gap**
      *   *Defended but Statistically Strained.* They exist and expand, but simply haven't reached this voxel of space yet.
  *   **YES → (They are here, but silent.) Go to Question 6.**

  ### 6. Is the silence intentional?
  *(Are they hiding from us rather than being absent or unnoticed?)*

  *   **NO → **Incoherent Position****
      *   *No Defenders.* Logically impossible: If they are here, visible, and not hiding, we would see them.
  *   **YES → (They are hiding.) Go to Question 7.**

  ### 7. Is the motivation for hiding driven by fear or by protection?
  *(Do they avoid us because we are dangerous to them, or because they are dangerous to us?)*

  *   **FEAR → Dark Forest Hypothesis**
      *   *Defended.* Civilizations destroy others preemptively to ensure survival; silence is safety.
  *   **PROTECTION → Zoo Hypothesis**
      *   *Defended.* A galactic consensus protects emerging civilizations from interference until maturity.

  ---

  ### Notes on Logical Space & Indistinguishability

  **1. Undefended or Weak Positions:**
  *   **Incoherent Position (Q6-NO):** This combination claims aliens are here, detectable, and not hiding, yet we see nothing. This contradicts the starting observation.
  *   **Non-Expansionist (Q2-NO-Choice):** While logically sound, this requires assuming universal sociological constraints on all civilizations. It is less popular than the "Great Filter" because it relies on uniformity of choice rather than physical limits.
  *   **Early Bird (Q5-NO):** Logically possible, but given the ratio of colonization time (10M years) to galaxy age (13.6B years), the probability of us being in the uncolonized fraction is low unless expansion is much slower than physics allows.

  **2. Empirically Indistinguishable Pairs:**
  *   **Zoo Hypothesis vs. Dark Forest:** This taxonomy separates them by *motivation* (Q7), but empirically they produce identical evidence (silence). No observation of *absence* can distinguish them. To split them, a student would need to answer: *"If we broadcasted our location, would they respond with friendship or fire?"* (A question we cannot safely answer).
  *   **Rare Earth vs. Great Filter Ahead:** Both result in "We are alone now." They are separated by *timing* (Q1 vs Q2). Rare Earth says life is hard to start; Great Filter says life is hard to sustain. Distinguishing them requires finding simple life elsewhere (supports Great Filter) or finding no life anywhere (supports Rare Earth).

  **3. Structure of the Debate:**
  The tree reveals that most disagreement lies not in the astronomical data (which all accept as "silent"), but in the **sociological and biological assumptions** made about unseen civilizations (Questions 2, 3, 6, and 7).

  \summary{The taxonomy reveals that the Fermi Paradox is not a single puzzle but a cascade of empirical and psychological assumptions, where most disagreement lies not in the data but in the inferred behavior of unseen civilizations.}
