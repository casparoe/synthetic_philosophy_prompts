prompt: |-
  Ok so this is gonna sound dumb but it actually happened: a guy in my friend group kept using a slur as a "joke," and when people pushed back he said "it's just a word," and someone else backed him up with "sticks and stones may break my bones but words can never hurt me." I ended up as the one trying to argue that slurs are different from ordinary insults, but I couldnt make the distinctions stick. I've been reading up on the semantics and pragmatics of slurs since then, and now it's obvious those little sayings are doing a lot of work nobody in the room actually examined. Can you seperate out the different precise claims that "it's just a word" / "sticks and stones..." could be making about slurs — for instance, is it a claim about literal meaning versus how a word is used, or that only the speaker's intent matters, or that no harm counts unless it's physical, or something about who has standing to be hurt — and for each reading tell me whether it's a platitude, a substantive but defensible claim, or just false, and which of the readings would actually license what my friend was doing? I want a menu of readings I can bring back to the group chat, not one long lecture.
