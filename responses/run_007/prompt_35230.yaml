answer: |-
  This is a sharp diagnostic of the field. You have correctly identified that the "magic" of Program Equilibrium (PE)—getting cooperation in one-shot dilemmas via source inspection—often dissolves when you touch the friction of reality: agents aren't identical, proof systems aren't sound or complete, and equilibrium selection is under-specified.

  Given your background (modal logic > game theory) and constraints (1 person, 2 years), you should avoid problems that require heavy complexity theory or empirical multi-agent RL. You should leverage your strength in formal systems to solve the *logical* barriers to cooperation, leaving the *computational* barriers for later.

  Here are the three problems I prioritize for you, followed by the reasoning on trade-offs and the specific problems I am excluding.

  ### 1. Heterogeneous Proof Systems (Asymmetric Cooperation)
  **The Sticking Point:** Classic PE results (like PrudentBot) assume Common Knowledge of the Proof System (e.g., both agents reason in PA). In reality, AI agents will likely use different architectures, different formal verifiers, or different confidence thresholds. We lack a general theory of *cross-system Löbian cooperation*. If Agent A reasons in ZFC and Agent B reasons in PA + Large Cardinals, or if they use different modal fixed-point constructors, do they cooperate? Current results rely heavily on symmetry to ensure the fixed points align.
  **Downstream Impact:** High. If PE only works for identical agents, it is useless for open ecosystems of AI. Solving this defines the "interoperability layer" for cooperative AI.
  **Tractability:** High (for you). This is pure modal logic and proof theory. It involves analyzing fixed points across different modal operators (e.g., $\Box_A$ vs $\Box_B$). It does not require new game theory, just deeper logic.
  **Demotion Evidence:** A proof that cross-system cooperation is impossible without a shared "handshake" protocol (reducing it to a communication problem rather than a logical one).

  ### 2. Robustness to Adversarial Logic (Spurious Proofs)
  **The Sticking Point:** You mentioned agents getting "gamed by agents that hunt for spurious proofs." This is the security vulnerability of PE. If an agent searches for a proof of "Opponent Cooperates," an adversary might construct code that makes this provable only if the searcher defects, or injects inconsistent axioms that explode the searcher's logic. The sticking point is defining a *robust proof search* that ignores "logical noise" or adversarial obfuscation without becoming too conservative (and defecting).
  **Downstream Impact:** High. This is the safety case. Without robustness, PE agents are exploitable by malicious actors submitting malformed code.
  **Tractability:** Medium. It requires blending logic with security/adversarial thinking. You need to model the "attacker" formally. It's harder than pure logic but feasible for a logician willing to learn basic adversarial frameworks.
  **Demotion Evidence:** If the community converges on "verified compilation" (where code is certified by a third party) as the standard, making on-the-fly logical robustness less relevant.

  ### 3. Modal Equilibrium Selection (The Folk Theorem Problem)
  **The Sticking Point:** As you noted, PE suffers from a Folk Theorem: many payoff profiles are supportable as equilibria. Why coordinate on (C,C) rather than (D,D) or a mixed strategy? The sticking point is finding a *logical focal point*. We need a criterion within the modal structure that privileges the Pareto-optimal equilibrium without external communication.
  **Downstream Impact:** Medium-High. Even if agents *can* cooperate, they must agree on *which* cooperation. However, if they can't cooperate at all (Problems 1 & 2), selection doesn't matter.
  **Tractability:** Medium. This leans more into game theory (equilibrium refinement) but can be approached via modal criteria (e.g., "cooperate in the equilibrium provable in the weakest system").
  **Demotion Evidence:** If it turns out selection requires cheap talk or pre-play communication, rendering the "one-shot source inspection" model insufficient for coordination.

  ### Trade-offs and Exclusions
  **Why this ordering?**
  I am prioritizing **Existence** (Heterogeneity) over **Security** (Robustness) over **Selection**. If heterogeneous agents cannot cooperate at all, security and selection are moot. Heterogeneity is also the best fit for your modal logic background, giving you the highest probability of a "win" in year one. Robustness is second because a cooperative agent that is easily exploited is dangerous. Selection is third because it assumes the first two are solved.

  **What I am leaving off:**
  1.  **Bounded Program Equilibrium:** This is the elephant in the room. Real agents are computationally bounded; standard PE assumes provability in PA (unbounded). *Why exclude it?* It is primarily a complexity theory problem, not a logic problem. For a single logician in 2 years, the risk of getting stuck in hardness proofs is too high. It is better to solve the logical structure first, then add bounds later.
  2.  **General-Sum Games:** Stick to Prisoner's Dilemma. General-sum introduces valuation problems that distract from the core mechanism of source-code cooperation.
  3.  **Obfuscated Code:** Some work suggests agents might hide code. *Why exclude it?* Your prompt specifies "can inspect each other's source." Solving cooperation under obfuscation is a different problem (zero-knowledge proofs) that dilutes the PE specific research.

