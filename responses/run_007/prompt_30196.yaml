answer: |-
  **Exam Question**

  **Question 1 (50 Minutes)**

  The conceivability argument against physicalism is often summarized as: (1) Philosophical zombies are conceivable; (2) If zombies are conceivable, they are metaphysically possible; (3) If zombies are metaphysically possible, physicalism is false. Physicalists frequently object that conceivability is an unreliable guide to possibility, citing Kripkean examples of a posteriori necessities (e.g., that water is necessarily H2O, though this was not knowable a priori).

  Write an essay that addresses the following: Why does the proponent of the zombie argument claim that the 'Water = H2O' analogy fails to block their inference from conceivability to possibility? In your answer, explain what work the conceivability premise is doing in this specific context. Finally, articulate what a physicalist must claim about the nature of our phenomenal concepts or the structure of metaphysical possibility in order to resist the conclusion without simply denying the premise outright.

  ***

  **Model Answer**

  The zombie argument aims to bridge the gap between epistemology (what we can conceive) and metaphysics (what is possible). Its force relies on the claim that the link between physical processes and conscious experience is not merely unknown, but fundamentally contingent. To evaluate the argument, one must understand why standard physicalist defenses involving a posteriori necessity are alleged to fail, and what remains for the physicalist to say.

  The argument begins with the claim that a world physically identical to ours, but lacking consciousness, is conceivable. For the dualist, this conceivability is not merely a lack of information; it is a positive epistemic state indicating a genuine metaphysical gap. The inference from conceivability to possibility is the crux. Physicalists typically block this by noting that we can conceive of water not being H2O, yet it is metaphysically necessary that water is H2O. This is because the concept 'water' picks out its referent via a contingent mode of presentation (e.g., clear, drinkable liquid), while the referent itself is the microstructure. Thus, conceivability tracks the mode of presentation, not the metaphysical essence.

  The proponent of the zombie argument counters that the mind-body case is disanalogous to the water-H2O case. In the water case, there is a distinction between the appearance of water and the reality of water. We can conceive of the appearance without the reality because they are distinct properties. However, with consciousness, the appearance *is* the reality. When I conceive of pain, I am not conceiving of it via a contingent description that might pick out something else; I am conceiving of the phenomenon directly. There is no "hidden essence" to pain beyond what it feels like. Therefore, if I can conceive of the physical facts obtaining without the pain, I am not merely conceiving of one mode of presentation without another; I am conceiving of the physical without the phenomenal itself. Because there is no gap between appearance and reality in consciousness, the epistemic gap (conceivability) implies an ontological gap (possibility).

  This is the specific work the conceivability premise does: it leverages the transparency of phenomenal concepts to argue that no a posteriori identity can hold. If physicalism were true, 'pain = C-fiber firing' would be an a posteriori necessity like 'water = H2O'. But for such an identity to hold, there must be a contingent mode of presentation associated with one of the terms. The dualist argues phenomenal concepts lack this contingency. Consequently, if zombies are conceivable, they are genuinely possible, and physicalism—which requires consciousness to be necessitated by the physical—is false.

  To resist this without abandoning physicalism, the physicalist cannot simply assert "conceivability does not entail possibility." They must explain *why* this specific case misleads us. This leads to a specific claim about phenomenal concepts. The physicalist must argue that while consciousness feels transparent, our concepts of consciousness are still distinct from the physical properties they refer to. This is often called "Conceptual Dualism" or Type-B Physicalism. The physicalist must claim that we possess two distinct conceptual registers: one for physical states and one for phenomenal states. Even if these states are identical in reality, our cognitive architecture prevents us from recognizing the identity a priori.

  Therefore, the physicalist must argue that the conceivability of zombies reveals a limitation in our conceptual scheme, not a feature of the world. They must maintain that metaphysical possibility is stricter than epistemic possibility. The zombie scenario is epistemically possible (we can't rule it out a priori) but metaphysically impossible (it violates the necessary laws of nature). To sustain this, the physicalist must deny the dualist's claim that phenomenal concepts reveal the full essence of their referents. They must argue that consciousness has a physical essence that is masked by the subjective mode of access, much like water, despite the introspective feeling of transparency. If they cannot sustain this distinction between how consciousness appears to concepts and what consciousness is in reality, the inference from conceivability to possibility stands, and physicalism collapses.

  ***

  **Marking Scheme**

  **Total Marks: 100**

  **A Grade (80-100 marks): Excellent**
  *   **The Water Analogy Distinction:** Explicitly explains *why* the zombie proponent thinks the Water/H2O analogy fails. Specifically, identifies that in the water case, appearance differs from reality (contingent mode of presentation), whereas in the consciousness case, appearance is reality (direct reference/transparency).
  *   **The Work of Conceivability:** Explains that conceivability is not being used as a mere guess, but as a probe for metaphysical necessity based on the transparency of phenomenal concepts.
  *   **Physicalist Burden:** Clearly articulates the Type-B Physicalist response: the distinction between *epistemic* possibility (conceivability) and *metaphysical* possibility. Must state that the physicalist must claim our phenomenal concepts are distinct from physical concepts even if the referents are identical (Conceptual Dualism).
  *   **Precision:** Avoids conflating epistemic and metaphysical modality. Uses terms like "mode of presentation," "referent," or "essence" correctly.
  *   **Structure:** Logical flow from the argument to the objection to the counter-objection to the physicalist's remaining burden.

  **B Grade (65-79 marks): Good**
  *   **General Understanding:** Correctly outlines the zombie argument and the physicalist objection regarding a posteriori necessity.
  *   **Water Analogy:** Mentions the Water/H2O case but may be vague on *why* the dualist thinks it doesn't apply (e.g., says "consciousness is different" without explaining the appearance/reality distinction).
  *   **Physicalist Burden:** Identifies that the physicalist needs to deny the inference from conceivability to possibility but may fail to specify *how* (i.e., fails to mention the nature of concepts or the epistemic/metaphysical distinction clearly).
  *   **Minor Errors:** May occasionally slip into suggesting physicalists just "deny zombies are possible" without explaining the conceptual mechanism allowing that denial.

  **C Grade (50-64 marks): Adequate**
  *   **Definitions:** Spends too much time defining 'zombie' or 'physicalism' rather than analyzing the inference.
  *   **Surface Level:** States that "conceivability doesn't equal possibility" as a brute fact without engaging with the dualist's reason for thinking it *does* in this specific case.
  *   **Confusion:** Confuses the explanatory gap (we can't explain how it works) with the ontological gap (it doesn't exist).
  *   **Missing Moves:** Fails to address what the physicalist must say about concepts.

  **F Grade (0-49 marks): Fail**
  *   **Misunderstanding:** Claims the zombie argument is about whether zombies *actually* exist.
  *   **Irrelevance:** Discusses other arguments (e.g., Knowledge Argument) without relating them to the conceivability/premise structure requested.
  *   **Assertion:** Merely asserts one side is right without analyzing the logical tension described in the prompt.

  **Specific Penalties:**
  *   **-10 marks:** For claiming the physicalist reply is simply that "zombies are impossible" without explaining the conceptual basis (begging the question).
  *   **-10 marks:** For treating the Water/H2O analogy as a successful refutation without addressing the dualist's counter regarding phenomenal transparency.
  *   **-5 marks:** For every significant instance of confusing epistemic possibility (conceivability) with metaphysical possibility.
