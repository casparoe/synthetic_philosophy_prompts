      *   *The Metaphors:* Singer = Individual, immediate, low cost. Hardin = Collective, systemic, existential threat.
      *   *Factual Layer:* Hardin relies on "carrying capacity" and the idea that aid increases population without increasing resources (the ratchet effect). Singer assumes resources exist and can be transferred without catastrophic collapse. *Crucial Point:* Modern economics tends to side more with Singer on the "zero-sum" fallacy, but Hardin's concerns about sustainability aren't entirely dead (climate change context).
      *   *Philosophical Layer:* This is the meat.
