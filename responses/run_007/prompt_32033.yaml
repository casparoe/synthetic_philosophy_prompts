      *   *Decision:* I will argue that the discursive dilemma *does* fatally wound the *descriptive* version of the analogy (groups are *naturally* agents like individuals), but it *necessitates* a *constructive* version (groups must *build* agency through specific institutional designs). The analogy isn't a discovery; it's an achievement. The conclusions (liability, etc.) survive, but their justification shifts from "metaphysical unity" to "procedural responsibility."
