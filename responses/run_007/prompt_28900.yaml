answer: |-
  Look, you have walked into a room full of people who measure things for a living, and you are bringing them a story about how it feels to move words around on a page. That is a category error waiting to happen, but it is also a fascinating one. The first thing that is going to come at you, and this will likely be from those graduate students who actually know the Copycat architecture, is the scalability objection. They will tell you that Copycat works on letter strings because the domain is closed and the rules are finite, whereas natural language concepts like mentor or adversary are open-ended, culturally saturated, and semantically dense. They will ask how you can justify mapping a microdomain model onto the messy reality of literary cognition without any computational evidence that the mechanism scales. Your reply needs to be that you are not claiming the literary mind is literally running Copycat code, but that Hofstadter provided the only existing formal vocabulary for the phenomenology of slippage. You argue that the letter strings are not the point, the point is the mechanism of pressure and resistance, and that the existence of a working model proves fluidity is computationally possible, even if the literary mind is vastly more complex. You tell them you are offering an existence proof of the mechanism, not a full simulation of the novel. The soft spot here is painful because they are right; you do not have a model that scales, and asserting that the mechanism is the same without demonstrating it looks like hand-waving to a computationalist.

  Once they have picked at the technicals, the cognitive psychologists will turn to your method. They will ask you about the reliability of introspection. They will point out that what you think is happening in your head during revision is not necessarily what is happening, and that building a theory of concepts on the self-report of a single novelist is methodologically bankrupt. They will want to know where your fMRI data is, or your behavioral trials. You need to stand your ground here by reframing your evidence. You tell them that cognitive science has largely ignored the high-stakes, long-term manipulation of concepts in favor of rapid categorization tasks, and that your notebooks offer a rare trace of conceptual manipulation over time that lab experiments cannot capture. You argue that this is phenomenological data that needs to be accounted for, not dismissed as anecdote. The weakness you have to live with is that they do not have to accept your data. In their field, introspection is often treated as noise, and no matter how eloquently you describe your revision process, they can simply classify it as unreliable self-reporting that contradicts established empirical findings.

  Then you will have the proponents of prototype theory or theory-theory, who will feel threatened because you are suggesting their frameworks are insufficient for creative cognition. They will ask why we should discard decades of research on categorization just because your writing process feels slippery. They will argue that prototype shifting or belief revision can explain what you describe without needing a new fluid framework. Your counter is that prototypes are static snapshots of category structure, whereas your experience is of the transition itself. You tell them that prototype theory explains how you recognize a character is a mentor, but it does not explain the moment the character stops being a mentor and starts being an adversary without a conscious decision. You argue that fluid concepts explain the motion, while prototypes only explain the states. The softness here is that prototype theory is robust and widely validated, while your fluid account is largely metaphorical outside of the Copycat domain. You are asking them to trade a solid map for a description of the weather, and that is a hard sell.

  The senior atomist in the room is a different kind of problem. They will not care about the slippage; they will care about the ontology. They will tell you that concepts do not have internal structure to slip around in, and that what you are calling conceptual change is just vagueness in language or free association in performance. They will say you are confusing the concept itself with your access to it. You have to reply that the revision process shows the concept itself is malleable, not just our access to it. You tell them that if concepts were atomic, the pressure from a metaphor could not reorganize the character's identity across drafts. You argue that the causal power of the metaphor on the character proves the concept has structure that can be manipulated. This is a tough spot because you are fighting a metaphysical battle with anecdotal evidence. If they define concepts as atomic by fiat, your experience of slippage becomes irrelevant to the definition, and you risk talking past them entirely.

  You might also get some friendly fire from the embodied cognition people who are sympathetic to your anti-computationalist intuition but will wonder why you hitched your wagon to Hofstadter. They will ask why you did not use an enactive or embodied framework that grounds concepts in sensorimotor experience rather than analogy-making systems. You should acknowledge that embodied approaches are compatible and perhaps even necessary for the full picture, but argue that Hofstadter specifically addresses the structural slippage of abstract relations that embodied cognition sometimes struggles to formalize. You tell them you chose fluid concepts because it best models the analogical pressure of narrative structure. The weakness is that you might look outdated. Embodied cognition is the current wave, and aligning yourself with a nineties-era connectionist model might make you look like you missed the last twenty years of progress.

  Now, there is one question you should pray nobody asks, because it strikes at the heart of whether your analogy holds water at all. Someone might ask you about the goal state. In Copycat, the system is trying to find the correct answer to a puzzle, there is a right move and a wrong move. In your writing, there is no correct answer, only resonant ones. They will ask if a model designed to converge on a single solution can really describe a creative process that aims to diverge and open up meaning. If this comes up, you have to admit that the goal states are different but argue that the mechanism of getting there—the pressure, the slippage, the restructuring—is the same. You say that the engine does not care if the destination is a single right answer or an aesthetic equilibrium. But be warned, this is the softest point in your entire armor. If the mechanism is driven by the goal, and the goals are fundamentally different, then the mechanism might be different too, and that would leave you with nothing but a metaphor.

  You are going to be okay, but you have to accept that you are not there to convince them you are right. You are there to convince them that the phenomenon you are describing exists and deserves a place in their models. If you can get them to admit that standard theories struggle to explain the transition states of creative revision, you have won. Do not get dragged into defending Hofstadter as the final truth; defend him as the best available vocabulary for what you live through every day. Keep your answers grounded in the work, in the notebooks, in the specific moments where the words forced your hand. That is the only data you have that they cannot replicate in a lab, and it is the only thing that makes this worth doing.
