answer: |-
  The coffee station was crowded, but Dr. Elena Kovac and Dr. Chibuzo Okonkwo found a quiet corner near the exit.

  "Chibuzo, you look skeptical," Kovac said, stirring her espresso. "Was it the thalamocortical criterion?"

  "Skeptical is polite," Okonkwo replied, smiling. "Elena, your binary switch is compellingly clean, but nature rarely respects our clean lines. Consider the continuum: human, macaque, mouse, honeybee, nematode. If consciousness is all-or-nothing, where exactly does the light turn on? Any line you draw seems arbitrary. That's the Sorites problem. If you shave off neurons one by one from a human brain, at what precise removal does the world go dark?"

  Kovac set her cup down firmly. "I address the Sorites head-on by rejecting the premise that consciousness is a substance that diminishes. It's a structural capacity, like boiling. Water doesn't get 'kind of wet' as it heats; it undergoes a phase transition at a specific threshold. Below 100°C, there is no boiling. Below a certain threshold of recurrent processing and global availability, there is no subject. There isn't a dim flicker of experience in a bee. There is nothing."

  "But the bee evidence is robust," Okonkwo pressed, leaning in. "They integrate cross-modal sensory data, make context-dependent decisions, and exhibit anxiety-like states when shaken. If a system behaves as though it feels threat, why posit a metaphysical void inside? You're distinguishing genuine sentience from complex information processing, but if the processing is sufficiently integrated to model self-in-environment, why deny the inner light? It seems you're protecting human exceptionalism."

  "I'm protecting conceptual clarity," Kovac countered. "You're conflating sophistication of repertoire with phenomenality. A missile guides itself; it doesn't feel the journey. The bee's 'anxiety' is an algorithmic weighting of risk versus reward, optimized by evolution. It requires no inner witness. My threshold isn't about human exceptionalism; it's about the specific architecture required for global broadcast. Without that loop, there is information, but no one home to read it."

  Okonkwo sighed, looking out at the rain. "So, for you, 'what it is like' is a binary property. Either a system possesses the architecture for global access, or it is a philosophical zombie. But this implies that a mouse one day before evolving the 'right' circuitry has zero experience, and the next day has full experience. That feels metaphysically magical. I hold that experience can be faint, fragmented, or partial. A bee's world might be a blurry, olfactory-dominated haze compared to ours, but a haze is still visual experience."

  "And there," Kovac said, picking up her bag, "is where we bottom out. You think phenomenal concepts admit of vagueness—that experience can be 'blurry.' I think the concept of 'something it is like' is inherently binary. Either there is a subject for whom things appear, or there is merely functioning. You see a gradient of light; I see a switch that hasn't been flipped. We agree on the neural data, Chibuzo. We just disagree on whether 'darkness' admits of shades."

  Okonkwo nodded slowly. "Then we agree on the science, but not on the meaning of the light."

  "Precisely," Kovac said. "And until we resolve that, the bees remain safe from my threshold, but not from my skepticism."
