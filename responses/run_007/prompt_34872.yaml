answer: |-
  Here is a complete submission package for your extra credit assignment. It includes the exam question, a model answer that takes a firm stance (as your teacher prefers), and a specific marking scheme.

  ### Exam Question

  **Clark and Chalmers' Extended Mind Thesis (EMT) relies on the Parity Principle to argue that Otto's notebook is functionally equivalent to Inga's biological memory. However, critics argue this leads to "cognitive bloat," where the mind expands to include phones, libraries, and the internet, rendering the concept of "mind" meaningless.**

  **Evaluate this objection. Can EMT accommodate a non-arbitrary boundary between mind and world, or does the bloat objection successfully refute the thesis? Defend a clear position.**

  ***

  ### Model Answer (540 words)

  The Extended Mind Thesis (EMT) proposes that cognitive processes are not confined to the skull. Clark and Chalmers argue this using the Parity Principle: if a part of the world functions as a process which, were it done in the head, we would have no hesitation in recognizing as part of the cognitive process, then that part of the world is part of the cognitive process. In their famous thought experiment, Otto, who has Alzheimer's, uses a notebook to store information just as Inga uses her biological memory. Because the notebook plays the same functional role as Inga's neurons, EMT claims the notebook is literally part of Otto's mind.

  The strongest objection to this view is the argument from cognitive bloat. If we accept EMT, critics argue, there is no logical stopping point. If a notebook counts, why not a smartphone? If a smartphone, why not the internet accessed via that phone? If the internet, why not the library where I store books I intend to read? If all these external resources are part of my mind, then the "mind" expands to encompass nearly everything I interact with. At this limit, the distinction between the cognitive agent and the environment collapses. If everything is part of the mind, the word "mind" loses its explanatory power. This is a *reductio ad absurdum*: EMT leads to an absurd conclusion, so the premise must be false.

  However, this objection assumes Clark and Chalmers are arguing for unlimited extension. They are not. EMT does not claim that *any* external tool is mental; it claims that only tools meeting specific criteria of integration are mental. In later work, Clark refines the Parity Principle with the "glue and trust" conditions. For an external resource to count as part of the mind, it must be (1) constantly available, (2) easily accessible, and (3) automatically endorsed (trusted without second-guessing).

  This distinction saves EMT from bloat. Consider the library. While it stores information I can access, it fails the first two criteria. I cannot access the library's contents instantly while walking down the street, nor is it constantly available in my pocket. Therefore, the library is not part of my mind; it is merely a resource. Similarly, a smartphone might count if I rely on it for navigation automatically and constantly, but a computer I only use once a week would not. The boundary is not drawn by skin or skull, but by functional integration.

  Therefore, the cognitive bloat objection fails to refute EMT because it attacks a straw man version of the thesis. It assumes EMT implies that *access* equals *inclusion*, whereas EMT argues that *integration* equals *inclusion*. The criteria of constant availability and automatic trust provide a non-arbitrary boundary. A student using a calculator for a single test has not extended their mind, but a mathematician who relies on specific notation systems daily might have.

  Critics may argue that "constant availability" is still vague. Is a phone in my bag "available"? Yes. Is a phone in my car "available"? Maybe. But vagueness in boundary cases does not invalidate the core distinction. Biological memory also has vague boundaries (e.g., repressed memories or subconscious processing). The existence of edge cases does not mean the category of "memory" is useless.

  In conclusion, the cognitive bloat objection is a necessary warning against carelessness, but it is not a fatal refutation. As long as we enforce strict functional criteria regarding reliability and access, we can distinguish between a tool I *use* and a tool that constitutes *me*. EMT remains a viable theory because it correctly identifies that cognition is defined by what it *does*, not where it *is*.

  ***

  ### Marking Scheme

  **Total Marks: 20**

  **1. Thesis & Position (5 Marks)**
  *   **A Range (4-5):** Takes a definite, arguable stance (e.g., "Bloat fails because..." or "Bloat succeeds because..."). The position is maintained consistently throughout the essay.
  *   **B Range (2-3):** Hedges or fence-sits (e.g., "There are good points on both sides"). The conclusion is vague or contradicts the introduction.
  *   **C Range (0-1):** No clear thesis; merely summarizes the prompt.

  **2. Understanding of EMT & Parity (5 Marks)**
  *   **A Range (4-5):** Accurately defines the Parity Principle and the Otto/Inga case *in service of the argument* (not just summary).
  *   **B Range (2-3):** Defines Parity Principle correctly but treats it as isolated knowledge. Minor inaccuracies in the Otto example.
  *   **C Range (0-1):** Fails to define Parity Principle or confuses Otto's role.

  **3. Engagement with the Bloat Objection (5 Marks)**
  *   **A Range (4-5):** Explains *why* bloat is problematic (renders "mind" meaningless) AND analyzes Clark's specific counter-criteria (trust, glue, accessibility).
  *   **B Range (2-3):** Explains bloat (mind gets too big) but fails to explain Clark's specific criteria for stopping it.
  *   **C Range (0-1):** Mentions bloat only in passing or confuses it with other objections (e.g., consciousness).

  **4. Argumentative Rigor (5 Marks)**
  *   **A Range (4-5):** Anticipates a counter-move (e.g., admits vagueness in criteria but argues it doesn't invalidate the theory). Distinguishes between "using a tool" and "constituting a mind."
  *   **B Range (2-3):** Arguments are linear. States Clark's response is correct without explaining *why* it solves the problem.
  *   **C Range (0-1):** Assertions without justification (e.g., "Clark is right because he is smart").

  **Specific Differentiator (The "A" Move):**
  To receive an **A**, the student must explicitly discuss the **criteria for inclusion** (accessibility/reliability/trust) as the mechanism that prevents bloat. A **B** paper will explain the bloat problem well but will offer a vague defense of Clark (e.g., "Clark says there are limits") without specifying what those limits *are*.
