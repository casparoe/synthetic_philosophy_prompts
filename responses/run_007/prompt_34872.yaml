prompt: |-
  ok so my philosophy teacher (it's like an advanced elective for seniors, we've been doing philosophy of mind) said we can submit potential exam questions for extra credit. i want to write one on the extended mind thesis — the Clark and Chalmers stuff with Otto and his notebook. we spent like two weeks on it and i feel like most people in class just memorized the thought experiment and the "parity principle" but don't actually get why anyone would push back on it.

  so i want a question that forces someone to grapple with the strongest objection, which i think is the "cognitive bloat" worry — like if Otto's notebook is part of his mind, then isn't my phone part of my mind too? and the library? and basically everything? at that point the word "mind" just stops meaning anything. i want the question to make people explain whether Clark and Chalmers actually have a good answer to this or whether the objection sinks the whole thesis.

  it'd be an essay question for a 45-minute in-class exam. can you write the question, a model answer (maybe 500-600 words), and a marking scheme? the marking scheme should separate an A from a B by naming the *specific moves* each answer needs to make — not just vague stuff like "shows good understanding." also my teacher is big on taking a definite position and defending it, so the model answer should be commited, not just a "on the one hand on the other hand" thing.
