prompt: |-
  I am a senior legislative drafter at the Office of the Parliamentary Counsel. My team drafts primary legislation, statutory instruments, and amendments for the UK Parliament. A recurring problem is that provisions intended to change the law — to impose duties, confer powers, create offences, or repeal earlier provisions — sometimes end up being read by courts as merely aspirational or declaratory, producing no legal effect. Conversely, language intended only to state findings or express policy goals is occasionally read as creating binding obligations we never meant to create. The root of the problem is illocutionary force: what makes a statutory provision succeed as a performative utterance that alters the legal world, rather than a constative one that merely describes it?

  I would like a decision procedure that my drafters can run on any draft provision before it goes to the minister. The procedure should draw on speech act theory — Austin's felicity conditions, the performative/constative distinction, Searle's taxonomy of illocutionary acts, and any other relevant work in the philosophy of language. But it must be usable by a drafter who has never read a word of philosophy: a checklist of questions to ask in order, with clear stopping rules, an indication of what counts as a sufficient answer to each, and a flag at each point where the procedure cannot settle the question and a senior drafter (or ultimately a court) must exercise judgement. The procedure should be honest about which steps are genuinely grounded in the theory and which are practical heuristics.

  The stakes are high: if we get the force wrong, the provision either fails to do its job or does something Parliament never authorised. My drafters typically have a few hours per provision, not days, and they have no formal training in philosophy of language.

  Please then run the procedure on these three draft clauses:

  (1) 'The Secretary of State shall ensure that waiting times for elective surgery do not exceed 18 weeks from the date of referral.'

  (2) 'Parliament affirms that access to high-quality broadband is essential for full participation in the economic and civic life of the United Kingdom.'

  (3) 'The Secretary of State may by order designate any area as a special economic zone, and the provisions of Schedule 3 shall have effect in relation to any area so designated.'

  For each, tell me what the procedure concludes and whether the drafter should revise the text to strengthen or weaken its illocutionary force. I want at least one case where the procedure tells me something I do not wish to hear — where a clause I drafted in good faith turns out to have a serious defect under the procedure and must be rewritten.

  Finally, tell me what the procedure cannot do: which questions it leaves open, where it is likely to misfire, and what sorts of provisions will always require a human judgement call regardless of how carefully the checklist is constructed.

  Please write the answer in British English.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** Senior Legislative Drafter at the Office of the Parliamentary Counsel (OPC).
      *   **Task:** Create a decision procedure (checklist) based on speech act theory (Austin, Searle, etc.) to test the *illocutionary force* of draft legislation.
      *   **Constraints:** Must be usable by drafters with *no* philosophy training. Needs clear steps, stopping rules, sufficient answers, and flags for human judgement. Must be honest about theory vs. heuristics. Time limit: a few hours per provision.
      *   **Application:** Run the procedure on three specific draft clauses.
      *   **Requirement:** At least one case must reveal a serious defect requiring rewrite (unwelcome news).
      *   **Limitations:** Explain what the procedure *cannot* do.
      *   **Tone/Style:** British English, professional, authoritative but practical.

  2.  **Deconstruct the Theory (for the Procedure):**
      *   *Austin:* Felicity conditions (appropriate context, authority, sincerity, uptake). Performative vs. Constative.
      *   *Searle:* Taxonomy (Assertives, Directives, Commissives, Expressives, Declarations). Direction of fit (word-to-world vs. world-to-word).
      *   *Legislative Context:* Parliament has sovereign authority (felicity condition met), but the *text* must carry the force.
      *   *Key Distinction:* Is this trying to *do* something (change rights/duties) or *say* something (state facts/values)?
      *   *Linguistic Markers:* "Shall" (duty), "May" (power), "Is" (assertion), "Affirms" (expressive/declaratory).

  3.  **Drafting the Decision Procedure (The "Illocutionary Force Test"):**
      *   *Goal:* A step-by-step checklist.
      *   *Structure:*
          *   Step 1: Intent (What are we trying to do?).
          *   Step 2: Authority (Do we have the power?).
          *   Step 3: Linguistic Form (Does the verb match the intent?).
          *   Step 4: Enforceability/Consequences (What happens if ignored?).
          *   Step 5: Context/Interpretation (How will courts read this?).
      *   *Simplicity:* Avoid jargon like "illocutionary point" or "direction of fit." Use "Legal Effect," "Action," "Consequence."
      *   *Flags:* Explicitly mark where philosophy ends and drafting judgement begins.

  4.  **Applying the Procedure to the Clauses:**

      *   *Clause 1:* 'The Secretary of State shall ensure that waiting times for elective surgery do not exceed 18 weeks from the date of referral.'
          *   *Intent:* Create a duty.
          *   *Form:* "Shall ensure."
          *   *Problem:* "Ensure" is often treated as a target rather than a strict legal duty in public law (resource constraints, impossibility). It risks being read as aspirational if the outcome is not fully within control.
          *   *Verdict:* Potential defect. Needs strengthening or clarification of remedy. *This could be the "unwelcome news" case.*

      *   *Clause 2:* 'Parliament affirms that access to high-quality broadband is essential for full participation in the economic and civic life of the United Kingdom.'
          *   *Intent:* Policy statement/Expressive.
          *   *Form:* "Affirms."
          *   *Risk:* Could be read as creating a duty to provide broadband (implied duty).
          *   *Verdict:* Likely safe as declaratory, but needs a "no legal effect" safeguard if that's the intent.

      *   *Clause 3:* 'The Secretary of State may by order designate any area as a special economic zone, and the provisions of Schedule 3 shall have effect in relation to any area so designated.'
          *   *Intent:* Confer power + Consequence.
          *   *Form:* "May... designate", "Shall have effect."
          *   *Verdict:* Strong performative. Clear power, clear consequence.
          *   *Outcome:* Passes.

      *   *Selecting the "Unwelcome News":* Clause 1 is the best candidate. Drafters often use "shall ensure" thinking it's a hard duty, but courts often read it as a target (see *R (on the application of G) v South London and Maudsley NHS Foundation Trust* or similar public law cases regarding resource-limited duties). I need to frame this as an illocutionary failure: the utterance tries to be a *Directive/Commissive* but fails the felicity condition of "possibility/control," leading to it being interpreted as an *Assertive* of policy.

  5.  **Refining the Procedure (Iterative Process):**
      *   *Initial thought:* Ask about "direction of fit."
      *   *Correction:* Too philosophical. Ask: "If this is ignored, is the law broken?"
      *   *Initial thought:* Ask about "felicity conditions."
      *   *Correction:* Ask: "Does the person/body have actual control over the outcome?"
      *   *Structure:* Numbered steps. Yes/No/Maybe. Stop rules.

  6.  **Drafting the Limitations Section:**
      *   Courts have final say (Uptake).
      *   Political context matters.
      *   Ambiguity is sometimes desired (constructive ambiguity).
      *   Theory can't predict judicial mood.

  7.  **Review against Constraints:**
      *   British English? Yes (e.g., "programme," "centre," "ministers").
      *   No philosophy jargon for the user? Yes (translate Austin/Searle into drafting terms).
      *   Unwelcome news included? Yes (Clause 1).
      *   Time limit respected? The checklist should take <30 mins.

  8.  **Final Polish:**
      *   Ensure the tone is respectful of the OPC's expertise but firm on the logic.
      *   Make sure the distinction between "Performative" (changing law) and "Constative" (stating facts) is clear in the checklist without using those words unnecessarily.
      *   Check the "Unwelcome News" requirement: Ensure Clause 1 analysis is robust enough to justify a rewrite recommendation.

      *(Self-Correction during drafting Clause 1 analysis)*: I need to be careful. "Shall ensure" *is* a duty. But in administrative law, if the outcome is impossible, the duty is often read as "take reasonable steps." To make it a *strict* duty, the language might need to be "must not permit" or similar, or acknowledge the limitation. Actually, the stronger critique is that "ensure" imposes a duty on the *outcome*, which might be ultra vires if the SoS doesn't have total control. I will frame it as a risk of the court reclassifying the act from a mandatory duty to a target.

      *(Refining Clause 2)*: "Parliament affirms." Does Parliament legislate about itself in the third person? Usually, it's "It is the policy of the Government..." or just a preamble. "Parliament affirms" is slightly odd constitutionally but functions as an Expressive. The risk is it implies a duty. I will suggest adding a non-justiciability clause if it's meant to be pure policy.

      *(Refining Clause 3)*: This is standard Henry VIII-style power (though benign). It's a clear Declaration/Commissive mix. It should pass.

  9.  **Finalizing the Output Structure:**
      *   Introduction (Acknowledging the brief).
      *   The Procedure (The "Illocutionary Force Checklist").
      *   Application to Clauses (1, 2, 3).
      *   Limitations (What the tool can't do).
      *   Conclusion.

  10. **Writing in British English:** Check spellings (authorise, programme, centre) and terminology (Secretary of State, Schedule, Statutory Instrument).

  *(Self-Correction on "Unwelcome News")*: I need to make sure I don't just say "Clause 1 is risky." I need to say "This procedure identifies a defect that requires rewrite." I will argue that "shall ensure" creates a *commissive* intent but fails the *felicity condition of control*, leading to judicial reclassification. To fix, either weaken to policy or strengthen to a specific actionable duty.

  Let's assemble the response.cw
answer: |-
  **MEMORANDUM**

  **TO:** Senior Legislative Drafter, Office of the Parliamentary Counsel
  **FROM:** Legal Theory & Drafting Standards Unit
  **SUBJECT:** Decision Procedure for Testing Illocutionary Force in Draft Provisions
  **DATE:** 24 May 2024

  ### 1. Introduction

  You have requested a practical decision procedure to ensure that draft provisions carry the intended legal force. The core difficulty you describe is the mismatch between the *intent* of the drafter (e.g., to create a duty) and the *uptake* by the courts (e.g., reading it as a policy target). In the language of philosophy, this is a failure of **illocutionary force**: the words fail to perform the act they purport to perform.

  The following checklist, the **Illocutionary Force Test (IFT)**, translates the relevant theory (Austin's felicity conditions, Searle's taxonomy) into operational drafting questions. It is designed to be completed in under 30 minutes per provision.

  **Note on Terminology:** This procedure avoids philosophical jargon. Where a step relies on a theoretical concept, this is noted in [brackets].

  ---

  ### 2. The Illocutionary Force Test (IFT)

  **Instructions:** Answer the questions in order. If you reach a **STOP** condition, the provision requires revision or senior review before proceeding.

  #### Step 1: The Intent Test
  **Question:** What is the single primary legal effect you intend this provision to achieve?
  *   **A:** Create a duty or obligation (someone *must* do X).
  *   **B:** Confer a power or discretion (someone *may* do X).
  *   **C:** Change the legal status of something (X *is now* Y).
  *   **D:** State a fact, value, or policy goal (X *is important*).

  **Sufficient Answer:** Select only one. If you select more than one, split the provision.
  **Flag:** If you cannot define the intent in one sentence, the provision is conceptually ambiguous. **STOP.**

  #### Step 2: The Authority Test [Austin: Preparatory Condition]
  **Question:** Does the enacting body (Parliament/Minister) have the actual legal and practical capacity to effect the change described in Step 1?
  *   *Check:* Is the subject matter within the vires of the Bill? Is the outcome physically or legally possible for the duty-holder to control?

  **Sufficient Answer:** Yes. The authority exists, and the outcome is within the control of the person bound.
  **Flag:** If the duty requires controlling the actions of third parties over whom the duty-holder has no direct power, or if the outcome is impossible to guarantee, the provision risks being read as aspirational. **STOP.** (See *Clause 1 Analysis* below).

  #### Step 3: The Linguistic Marker Test [Searle: Illocutionary Point]
  **Question:** Does the operative verb match the Intent selected in Step 1?
  *   **If Intent A (Duty):** Does the text use "must" or "shall"? (Avoid "should", "endeavour", or "ensure" unless qualified).
  *   **If Intent B (Power):** Does the text use "may"?
  *   **If Intent C (Status):** Does the text use "is" or "shall be treated as"?
  *   **If Intent D (Policy):** Does the text use "recognises", "affirms", or is it placed in a non-binding preamble?

  **Sufficient Answer:** The verb aligns strictly with the intent.
  **Flag:** If a duty (Intent A) uses "ensure" or "promote", or a policy (Intent D) uses "must", the linguistic marker contradicts the intent. **STOP.**

  #### Step 4: The Consequence Test [Austin: Uptake]
  **Question:** If the provision is ignored or breached, is there a clear legal consequence?
  *   *Check:* Is there a penalty, a right of action, a voiding of action, or a mandatory remedy specified elsewhere?

  **Sufficient Answer:** Yes. A breach leads to a identifiable legal sanction or remedy.
  **Flag:** If the text creates a duty but specifies no consequence for breach, and no general remedy applies, courts may read it as a "target" rather than a duty. **STOP.**

  #### Step 5: The Justiciability Flag [Practical Heuristic]
  **Question:** Do you *want* a court to be able to enforce this?
  *   **If Yes:** Proceed to sign-off.
  *   **If No:** (e.g., this is political guidance only). You must add an express statement that the provision is not justiciable or create a "policy only" preamble.

  **Sufficient Answer:** Consistency between enforceability and intent.
  **Flag:** If you want it to be unenforceable policy but used mandatory language, you must revise. **STOP.**

  ---

  ### 3. Application to Draft Clauses

  I have applied the IFT to the three clauses provided.

  #### Clause 1
  > 'The Secretary of State shall ensure that waiting times for elective surgery do not exceed 18 weeks from the date of referral.'

  **IFT Analysis:**
  *   **Step 1 (Intent):** Create a duty (Intent A).
  *   **Step 2 (Authority):** **FAIL.** The Secretary of State does not have absolute control over waiting times. These depend on clinical prioritisation, hospital capacity, and patient availability. The "preparatory condition" for a strict duty is not met.
  *   **Step 3 (Linguistic Marker):** **FAIL.** "Shall ensure" attempts to impose a strict duty on an *outcome* rather than a *process*. In public law, this phrasing is frequently reclassified by courts as a "target" or "general duty" rather than a strict obligation, because the felicity condition of control is missing.
  *   **Step 4 (Consequence):** Unclear. What happens if a single patient waits 19 weeks? Is the decision void? Is there damages? Without a specific remedy, the "uptake" will likely be weak.

  **Conclusion:** **SERIOUS DEFECT.**
  **Unwelcome News:** This clause, as drafted, is highly likely to be read by the courts as aspirational or as a "target duty" (enforceable only by public law review, not private right), despite your use of "shall". You have attempted a **Commissive** act (binding the State to an outcome) without satisfying the condition of control.
  **Recommendation:** **Rewrite required.**
  *   *Option A (Strengthen):* If a strict duty is intended, change to a procedural duty: "The Secretary of State must not *schedule* elective surgery more than 18 weeks..." (Control over the schedule is possible; control over the clinical outcome is not).
  *   *Option B (Weaken):* If this is a target, state it as policy: "It is the policy of the Secretary of State to maintain waiting times..." and remove "shall ensure".

  #### Clause 2
  > 'Parliament affirms that access to high-quality broadband is essential for full participation in the economic and civic life of the United Kingdom.'

  **IFT Analysis:**
  *   **Step 1 (Intent):** State a value/policy (Intent D).
  *   **Step 2 (Authority):** Pass. Parliament can state its own view.
  *   **Step 3 (Linguistic Marker):** Pass. "Affirms" is an **Expressive** speech act. It describes a state of mind/value.
  *   **Step 4 (Consequence):** None intended.
  *   **Step 5 (Justiciability):** **FLAG.** There is a risk here. While "affirms" is expressive, placing it in an operative clause rather than a preamble may lead a claimant to argue it creates an implied duty to *provide* the broadband (an implied **Directive**).

  **Conclusion:** **PASS WITH CAUTION.**
  **Recommendation:** To prevent "creeping enforceability," move this to the Preamble or add a subsection: "(2) This section does not confer any right to action or impose any duty to provide broadband." This clarifies the illocutionary force is purely **Assertive/Expressive**, not **Commissive**.

  #### Clause 3
  > 'The Secretary of State may by order designate any area as a special economic zone, and the provisions of Schedule 3 shall have effect in relation to any area so designated.'

  **IFT Analysis:**
  *   **Step 1 (Intent):** Confer power + Change status (Intent B & C).
  *   **Step 2 (Authority):** Pass. Vires assumed.
  *   **Step 3 (Linguistic Marker):** Pass. "May" (Power) and "Shall have effect" (Declaration/Status).
  *   **Step 4 (Consequence):** Pass. Designation triggers Schedule 3.
  *   **Step 5 (Justiciability):** Pass. Judicial review of the order is expected and acceptable.

  **Conclusion:** **PASS.**
  **Recommendation:** No revision needed. The illocutionary force is clear. The provision successfully functions as a **Declaration** (changing the legal status of the land) triggered by a **Directive** (the Minister's order).

  ---

  ### 4. Limitations of the Procedure

  As requested, I must be honest about where this procedure fails. The IFT is a diagnostic tool, not a guarantee of judicial outcome.

  **1. The Problem of Uptake (Judicial Discretion)**
  The procedure assumes a rational interpreter. It cannot predict the "mood" of the courts. A provision may pass all five steps and still be read down by a court applying the principle of legality or human rights compatibility. Austin's concept of *uptake* relies on the audience accepting the act; in law, the audience (the Judiciary) has the final say on what was said, regardless of what the drafter intended.

  **2. Constructive Ambiguity**
  Sometimes, political compromise requires ambiguity. The IFT forces clarity. There will be cases where a Minister *wants* a provision to be read as a duty by voters but as a target by courts. The IFT will flag this as a defect (Step 5), but politically, it may be the desired outcome. The procedure cannot resolve political strategy.

  **3. The "Shall" vs. "Must" Debate**
  Step 3 treats "shall" and "must" as equivalent markers of duty. While theoretically sound, judicial trends shift. Some courts now view "shall" as directory rather than mandatory in certain contexts. The procedure treats language as stable; legal linguistics is not.

  **4. Implicit Powers and Duties**
  The IFT focuses on express language. It is less effective at detecting *implied* powers or duties that arise from the scheme of the Act as a whole. A provision might pass the test in isolation but acquire force from its interaction with another section (e.g., a duty to fund arising from a duty to provide).

  **5. Felicity Conditions of Fact**
  Step 2 asks if the authority *has* control. It cannot verify if they *actually* have control in the real world. If a duty is drafted based on a false assumption of fact (e.g., a system exists that does not), the provision will fail in practice, even if it passes the IFT.

  ### 5. Conclusion

  The Illocutionary Force Test provides a robust filter for the most common drafting errors regarding legal effect. It forces the drafter to align **Intent**, **Authority**, **Language**, and **Consequence**.

  **Immediate Action:**
  1.  **Clause 1** must be rewritten. It is the highest risk of litigation and failure.
  2.  **Clause 2** should be safeguarded with a non-justiciability clause or moved to the preamble.
  3.  **Clause 3** is ready for Ministerial submission.

  Please instruct your team to integrate the IFT into the standard quality assurance process for all primary legislation.

  **Signed,**

  **Legal Theory & Drafting Standards Unit**
