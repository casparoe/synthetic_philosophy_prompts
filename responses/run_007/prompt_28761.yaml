prompt: |-
  Ok so I'm taking this course on global justice and we've been reading all this stuff about cosmopolitanism vs nationalism, like Singer on famine relief and duties to distant strangers, and then responses from people like David Miller or Yael Tamir who argue that we have special obligations to our compatriots. The thing is, outside of class I'm part of this student volunteer group that fundraises each semester and then votes on where to donate. This semester we raised about $3,000 and now we're totally stuck. Half the group wants to give it to a local homeless shelter that's literally a few blocks from campus—they're underfunded and we've actually volunteered there so we've seen the need up close. The other half wants to send the money to the Against Malaria Foundation, which is obviously super cost-effective and would probably save actual lives.

  My friend Jake has been the loudest voice for the local option, and his argument basicly boils down to: "These are our neighbors, our community. We have a responsibility to take care of our own before we start trying to save the world." And honestly, when he puts it like that, it feels viscerally right? Like it would almost be a betrayal to send the money halfway across the world when there are people suffering right here. But then I think about what we've been reading in class, and it seems like from a moral point of view, a life is a life—the fact that someone happens to be born within the same arbitrary borders as me shouldn't make their suffering count more.

  I guess my question is: how do I actually think through this? Is there a way to take seriously the intuition that we have special duties to people nearby or to our fellow citizens, without it just collapsing into some kind of tribalism? Or is that intuition just a bias I should try to overcome? I feel pulled in both directions and the philosophical arguments we've read feel too abstract to help me make an actual decision about three thousand dollars and a real homeless shelter.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Situation:**
      *   **Context:** Student taking a Global Justice course (reading Singer, Miller, Tamir, etc.).
      *   **Real-world Dilemma:** Student volunteer group raised $3,000. Needs to decide between a local homeless shelter (high visibility, community connection, "neighbors") vs. Against Malaria Foundation (high cost-effectiveness, saving lives globally).
      *   **Conflict:** Cosmopolitanism (Singer: impartiality, a life is a life) vs. Nationalism/Communitarianism (Miller/Tamir: special obligations to compatriots/community).
      *   **Emotional State:** Torn. Feels the "visceral rightness" of Jake's argument (local priority) but also the logical pull of the cosmopolitan argument (impartiality). Worried about "tribalism." Finds class readings too abstract for the concrete decision.
      *   **Goal:** Wants a framework to think through this specific decision that respects both intuitions without collapsing into bias or cold calculation.

  2.  **Deconstruct the Philosophical Tension:**
      *   *Cosmopolitanism (Singer):* Impartiality. Distance doesn't matter morally. Effectiveness matters most. $3k saves more lives via AMF.
      *   *Nationalism/Communitarianism (Miller/Tamir):* Special obligations arise from relationships, reciprocity, and shared projects. Community cohesion matters.
      *   *The Gap:* Theory often deals with state-level obligations (taxes, foreign aid policy), not necessarily discrete charitable acts by private groups. This is a key distinction to make.

  3.  **Brainstorming Frameworks for Decision-Making:**
      *   *Distinction between State and Individual/Group Duty:* Miller often argues the *state* has special duties to citizens, but individuals might have more flexibility. However, community groups occupy a middle ground.
      *   *The "Triage" or "Division of Labor" Argument:* Maybe not everyone has to be a pure utilitarian. If *some* groups focus locally and *some* globally, the overall ecosystem is healthy.
      *   *Epistemic Humility/Effectiveness:* Do we *know* the local shelter is less effective? Maybe saving a life globally is certain, but fixing local homelessness has systemic value too.
      *   *The Value of Community:* Volunteering locally builds civic virtue. Sending money abroad is transactional. Does the *act* of giving locally have intrinsic value for the givers?
      *   *Compromise:* Split the donation? (Often a cop-out, but worth considering).
      *   *Institutional Role:* What is the mission of the volunteer group? Is it "maximize good" or "build campus community engagement"?

  4.  **Developing the Response Structure:**
      *   **Validate:** Acknowledge the difficulty. It's a classic tension, and feeling torn is a sign of moral seriousness, not confusion.
      *   **Bridge Theory and Practice:** Explain *why* the readings feel abstract (they often address state policy, not student clubs).
      *   **Analyze Jake's Argument (Special Obligations):** Give it philosophical weight. It's not just bias; it's about reciprocity and community maintenance. Reference Miller/Tamir nuances.
      *   **Analyze the Cosmopolitan Argument (Impartiality):** Reiterate the strength of the AMF case (lives saved).
      *   **Offer Concrete Frameworks:**
          1.  *Division of Moral Labor:* We don't all need to do the same thing.
          2.  *The Nature of the Group:* What is the purpose of *this* specific volunteer org?
          3.  *Epistemic Access & Accountability:* Local allows for oversight/engagement.
          4.  *Civic Virtue:* Does local giving cultivate long-term altruism?
      *   **Suggest a Path Forward (Decision Tools):** How to vote/decide.
      *   **Conclusion:** Reassure that there isn't one "philosophically pure" answer.

  5.  **Drafting the Content (Iterative refinement):**
      *   *Refining the Miller/Tamir point:* Make sure not to misrepresent them. They argue for special duties based on shared cooperative schemes. Does a university town count? Yes, arguably.
      *   *Refining the Singer point:* Singer would say $3k to AMF = X lives. $3k locally = Y lives (probably fewer). But is the metric just lives saved?
      *   *The "Tribalism" Fear:* Address this directly. Caring for neighbors isn't necessarily hatred of strangers. It's concentric circles vs. flat plane.
      *   *Practical Advice:* Suggest looking at the group's charter. Suggest a split if consensus is impossible, but warn against "moral hedging."

  6.  **Self-Correction/Nuance Check:**
      *   *Avoid:* Telling them exactly what to do.
      *   *Avoid:* Dismissing Jake as wrong.
      *   *Avoid:* Dismissing Singer as too cold.
      *   *Add:* The idea that *sustainability* of altruism matters. If giving locally keeps students engaged in philanthropy long-term, that has long-term utility.
      *   *Add:* The distinction between *justice* (obligatory) and *charity* (supererogatory). Miller might say the state owes justice to citizens, but charity is freer.

  7.  **Final Polish:** Ensure tone is empathetic, intellectually rigorous but accessible, and directly addresses the $3,000 dilemma. (Make sure to mention that $3k is a specific amount where impact is tangible either way).

  8.  *(Final thought before generating)*: Emphasize that this *is* the philosophy. The abstract reading is meant to equip them for exactly this moment. They are living the syllabus.

  9.  **Constructing the Output:** (Proceed to write response based on these points.)
answer: |-
  This is a fantastic example of philosophy leaving the page and entering real life. It is completely normal that the readings feel abstract right now; Singer, Miller, and Tamir are mostly arguing about *state obligations* (taxes, foreign aid policy, immigration law), whereas you are dealing with *discretionary charitable giving* by a private student group. That shift in context changes the moral calculus significantly.

  You are asking if the intuition to care for "your own" is just bias or a legitimate moral claim. The short answer is: **It is likely a legitimate moral claim, but it has limits.** You don't have to choose between being a cold-blooded utilitarian and a tribalist.

  Here is a framework to help you and your group think through this specific $3,000 decision without dismissing either side.

  ### 1. Distinguish "Justice" from "Charity"
  David Miller's arguments about special obligations are often rooted in **justice**. He argues that because we participate in a shared cooperative scheme (a nation or community), we owe each other specific duties of justice that we don't owe to outsiders.
  *   **The Counter-Point:** However, many philosophers argue that *charity* (supererogatory giving) is different from *justice*. While the US government might have a special obligation to house US citizens before funding foreign aid, a student volunteer group is not the government. You are not bound by the same strict duties of distributive justice.
  *   **Application:** If you view the $3,000 as fixing a failure of local justice (homelessness), the local argument is stronger. If you view it as pure altruism to reduce suffering wherever possible, the cosmopolitan argument is stronger. Ask your group: *Are we trying to fix our community, or are we trying to do the most good possible?* Both are valid missions, but they yield different answers.

  ### 2. The "Division of Moral Labor" Argument
  This is perhaps the most practical way to resolve the tension without calling Jake a tribalist.
  *   **The Theory:** If every single moral agent tried to maximize utility in the exact same way (e.g., everyone donating to AMF), we might neglect other moral goods, like community cohesion, local civic engagement, and the maintenance of local institutions.
  *   **Application:** It is morally permissible for *some* groups to focus locally and *others* to focus globally. If your university has fifty clubs, and forty of them fund local causes while ten fund global ones, the ecosystem is healthy. If *all* fifty fund global causes, the local community might fracture.
  *   **Question for the Group:** What is the landscape of giving on your campus? If every other group is donating locally, maybe you should be the one to go global. If no one is helping the local shelter, your "special obligation" to your immediate neighbors carries more weight.

  ### 3. Epistemic Access and Accountability
  One strong argument for local giving isn't just "proximity," it's **knowledge**.
  *   **The Theory:** When you send money to the Against Malaria Foundation (AMF), you are trusting a distant bureaucracy. When you give to the local shelter, you have *epistemic access*. You volunteer there. You see the beds. You know the staff. You can verify the impact.
  *   **Application:** There is a moral value in "engaged giving." By supporting the local shelter, you are strengthening a relationship of reciprocity. You aren't just writing a check; you are sustaining a local institution that you are also physically supporting with labor. This aligns with Tamir's view that national/community membership is valuable because it allows for meaningful agency within a shared project.
  *   **Counter:** AMF has rigorous data on lives saved per dollar. The local shelter might not. You have to weigh *certainty of relationship* against *certainty of metrics*.

  ### 4. The "Civic Virtue" Argument (Long-term Utility)
  Peter Singer might argue that feelings don't matter, only outcomes. But if we look at the long term, **sustainability of altruism** matters.
  *   **The Theory:** Humans are not naturally cosmopolitan. We are wired for tribal care. For many people, seeing the direct impact of their donation locally cultivates the *habit* of giving. If students send money to Africa and never see the result, they might burn out or feel disconnected from philanthropy entirely. If they help a neighbor get off the street, they may become lifelong donors.
  *   **Application:** If giving locally keeps your volunteer group active and engaged for the next 5 years, the cumulative good might outweigh the one-time efficiency of AMF. This isn't just an excuse; it's a utilitarian calculation about human psychology.

  ### 5. Addressing the "Tribalism" Fear
  You asked if this intuition is just bias. It becomes bias (or unjust discrimination) if the reasoning is: *"Strangers' lives matter less."*
  It is **not** bias if the reasoning is: *"We have a specific project of maintaining this community, and this donation serves that project."*

  Jake's argument ("take care of our own first") is dangerous if it implies people outside the community don't matter. But it is morally robust if it implies that **community maintenance is a specific good** that requires resources. A society where no one cares for their immediate neighbors is a society that will eventually collapse, rendering global justice impossible.

  ### A Proposal for Decision-Making
  Since you have to vote, here is how you can frame the discussion to move past the stalemate:

  1.  **Define the Mission:** Look at your group's charter or mission statement. Does it say "alleviate suffering" (points to AMF) or "serve our campus community" (points to Shelter)? If it's ambiguous, acknowledge that the vote is essentially a vote on *redefining your mission*.
  2.  **The "Marginal Impact" Test:** Ask the local shelter: "What does $3,000 actually do for you?" If $3,000 keeps the lights on for a month, that is systemic support. If it buys blankets, that's direct aid. Compare that to the AMF metric (roughly $3,000 could distribute roughly 1,000 nets, potentially saving 1-2 lives statistically).
  3.  **Consider a Split (with caution):** Sometimes, splitting the money is a cop-out to avoid moral tension. However, in this case, a split (e.g., $1,500/$1,500) might acknowledge that **both** moral claims have validity. It admits that while global lives matter, local community bonds also have moral weight.
  4.  **The "Veil of Ignorance" Twist:** Ask the group: "If you didn't know whether you were a student here, a homeless person in this town, or a child in a malaria zone, which allocation rule would you want this group to follow?" This might not solve it, but it clarifies values.

  ### Summary
  You don't have to overcome your intuition to care for your neighbors. That intuition is the glue of civil society. However, you also shouldn't ignore the fact that $3,000 goes much further in Malawi than in your college town.

  If I were in your position, I would argue this: **If your group's primary value is *engagement and civic building*, give locally.** The value is in the relationship you sustain with the shelter. **If your group's primary value is *outcome maximization*, give to AMF.** The value is in the lives saved.

  Neither choice is "immoral." One prioritizes the *health of your specific community* (Miller/Tamir), and the other prioritizes the *equal value of all human lives* (Singer). Acknowledge that trade-off openly, vote, and respect that reasonable people can weigh those two goods differently.
