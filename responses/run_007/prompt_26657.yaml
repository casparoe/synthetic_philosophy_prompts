answer: |-
  This is a sharp meta-philosophical question. You are asking for the **demarcation problem of philosophical methodology**: when does abstraction clarify, and when does it manipulate?

  There is a systematic principle here, though it is often obscured by rhetorical flair. The distinction lies between **Controlled Idealization** (the good pumps) and **Constitutive Distortion** (the bad ones).

  ### The Principle: Controlled Idealization vs. Constitutive Distortion

  Think of thought experiments like experiments in physics.
  *   **Controlled Idealization (Good):** You remove *contingent noise* (friction, air resistance) to see the *underlying law* (gravity). The abstraction simplifies the world without changing the nature of the forces at play.
  *   **Constitutive Distortion (Bad):** You remove or alter a *constitutive feature* of the phenomenon itself. If you remove gravity to study falling, you aren't studying falling anymore.

  A genuine intuition pump isolates a variable while preserving the **structural isomorphism** of the problem. A misleading pump changes the structure so that the intuition generated applies to the *scenario*, but not to the *target concept*.

  Let's run your scorecard through this filter.

  #### 1. The Illuminating Cases (Controlled Idealization)
  *   **Thomson's Violinist:** Pregnancy involves biology, sex, responsibility, social stigma, and law. Thomson removes sex, responsibility, and stigma (the noise) to isolate **bodily autonomy** (the signal). The relation between "using a body" and "consent" remains structurally identical to pregnancy, even if the context is weird.
  *   **Frankfurt Cases:** Moral responsibility is usually tangled with "could have done otherwise." Frankfurt constructs a scenario where the *capacity* to choose is removed, but the *actual sequence* of choice remains. This isolates **sourcehood** from **leeway**. It preserves the structure of agency while removing the variable of alternative possibilities.
  *   **Nozick's Experience Machine:** Hedonism claims pleasure is the only intrinsic good. The machine isolates **pleasure** from **reality/contact**. If you refuse the machine, you reveal that you value something other than pleasure. The abstraction is clean; it doesn't distort what pleasure *is*, it just delivers it purely.

  #### 2. The Misleading Cases (Constitutive Distortion)
  *   **The Chinese Room:** Your critique is the standard "System Reply." Searle asks you to intuit about *understanding* by focusing on the *component* (the man) rather than the *system* (the room + man + rules). This is a **Level-of-Analysis Distortion**. He distorts the constitution of "computation" to make it look like "symbol manipulation" rather than "information processing." He removes the very feature (systemic integration) that might generate the property in question.
  *   **The Ticking-Bomb:** This is an **Epistemic Distortion**. Real-world torture debates are about risk, uncertainty, and institutional slippery slopes. The hypothetical grants the interrogator **omniscience** (we *know* he has the info, we *know* the bomb is real). By removing uncertainty, it changes the moral category from "risk management" to "binary necessity." It idealizes away the very feature (uncertainty) that makes the moral problem difficult.
  *   **Parfit's Teletransporter:** This is **Cultural Contamination**. As you noted, it relies on sci-fi tropes. But deeper than that, it may commit a **Category Error**. If personal identity is a biological/psychological continuity, a "copy" scenario might be constitutively impossible in a way that breaks the intuition. It asks us to treat "replication" as "transportation," which may distort the concept of identity rather than testing it.

  #### 3. The Ambivalent Case (Mary the Color Scientist)
  Your ambivalence is justified because Mary sits right on the border of the principle.
  *   **If Physicalism is true:** Then knowing "all physical facts" *should* include knowing how the brain processes color. If Mary still learns something, Physicalism is false.
  *   **If the premise is incoherent:** If "knowing all physical facts" *constitutively excludes* "knowing what it's like" (because one is propositional and one is phenomenal), then the scenario is a **Conceptual Distortion**. It asks you to imagine a state of knowledge that might be impossible by definition.
  *   **Verdict:** Mary is a **Limit Case**. It works only if you accept the coherence of the premise. If you think the premise is gibberish (you can't know the experience physically), the pump fails. If you think the premise is coherent, the pump works. Its status depends on your prior metaphysical commitment, which makes it a weaker pump than Thomson's (which works even if you disagree with her conclusion).

  ### What This Says About Global Skeptical Scenarios

  This brings us to the Brain in a Vat (BIV) or Cartesian Demon. Under the principle of **Controlled Idealization vs. Constitutive Distortion**, skeptical scenarios occupy a unique third category: **Boundary Markers.**

  They are not meant to be "lived" scenarios (like the Experience Machine) nor causal models (like Frankfurt cases). They are **Epistemic Stress Tests.**

  1.  **They are not Intuition Pumps:** They do not ask, "What would you do?" or "What is the moral status?" They ask, "What is the *limit* of justification?"
  2.  **They are Constitutive Distortions (by design):** A BIV scenario removes *all* empirical contact with the world. In doing so, it distorts the normal conditions of knowledge.
  3.  **Their Utility:** They are useful **only** to define the necessary conditions of knowledge.
      *   If you think the BIV scenario defeats your claim to know you have hands, you are an **Internalist** (you need to rule out the demon to know).
      *   If you think the BIV scenario is irrelevant to your claim to know you have hands, you are an **Externalist** (as long as your belief is reliably produced, the demon doesn't matter).

  **The Verdict on Skeptical Scenarios:**
  They are **methodologically valid** but **ontologically inert**.
  *   **Valid:** They successfully isolate the variable of "certainty" from "truth."
  *   **Inert:** They cannot be used to argue we *are* brains in vats, nor should they paralyze action.

  If someone uses a BIV scenario to argue "Therefore we know nothing," they have committed a **Constitutive Distortion**: they have redefined "knowledge" to require a level of certainty that the concept was never designed to hold. If they use it to say "Therefore, knowledge requires ruling out skeptical hypotheses," they are using it correctly as a **Boundary Marker**.

  ### Summary

  The principle that captures your scorecard is **Fidelity of the Relevant Variables.**

  *   **Good Pumps:** Vary the target variable while holding confounding variables constant. (Thomson, Frankfurt, Nozick).
  *   **Bad Pumps:** Vary the target variable by altering the constitutive nature of the phenomenon. (Chinese Room, Ticking Bomb).
  *   **Skeptical Scenarios:** Do not vary variables; they remove the entire field to test the definition of the game. They are useful for definitions, not for conclusions about the world.

  Your intuition that the Ticking Bomb is "propaganda in a philosopher's coat" is precisely correct: it idealizes away the *politics* (uncertainty, institutional pressure) to make the *ethics* look binary. That is not clarification; it is gerrymandering.

  Your ambivalence on Mary is also a feature, not a bug: it signals that the thought experiment is testing the coherence of Physicalism itself, rather than pumping an intuition *within* a shared framework. When the framework is the thing being tested, the pump will always feel wobbly.
