  1. Design notes
  The questions distinguish between the act of asserting and the state of believing, testing whether absurdity persists in silence, acting, or third-person contexts. They also probe whether binary belief is essential or if credence and knowledge norms trigger similar intuitions. This isolates whether the paradox is linguistic, psychological, or normative.

  2. The quiz
  1. **Standard Aloud:** You say, "It is raining, but I don't believe it." Does this strike you as absurd?
     A) Yes, deeply absurd. B) No, it is merely unusual. C) Only if spoken sincerely.
  2. **Silent Judgment:** You think to yourself, "It is raining, but I don't believe it." Is this irrational?
     A) Yes, the thought itself is defective. B) No, only saying it is problematic. C) Depends on your self-knowledge.
  3. **Third-Person:** You say, "It is raining, but she doesn't believe it." Is this absurd?
     A) Yes. B) No, this is perfectly normal. C) Only if she is present.
  4. **Past-Tense:** You say, "It was raining, but I didn't believe it." Is this absurd?
     A) Yes. B) No, this is commonly true. C) Only if you still don't believe it.
  5. **Credence:** You say, "I assign 95% credence to rain, but I lack belief." Is this absurd?
     A) Yes, credence just is belief. B) No, these are distinct states. C) Only if you act on it.
  6. **Acting:** An actor says the line on stage. Is the assertion absurd?
     A) Yes, the words are contradictory. B) No, they are not asserting. C) Only if they break character.
  7. **Knowledge Variant:** You say, "It is raining, but I don't know it." Is this absurd?
     A) Yes, same as the belief version. B) No, this is often true. C) Yes, but for different reasons.
  8. **Norm Hypothetical:** If assertion did not signal belief, would the sentence still be weird?
     A) Yes, the contradiction remains. B) No, the weirdness vanishes. C) Hard to say.
  9. **Transparency:** If self-knowledge were observational, would the paradox vanish?
     A) Yes, it relies on transparency. B) No, the logic holds regardless. C) Irrelevant to the case.
  10. **Unity:** Is the knowledge version (Q7) explained the same way as the belief version (Q1)?
      A) Yes, one underlying cause. B) No, they are different phenomena. C) They are unrelated.

  3. Scoring key
  We first map responses to logical clusters based on silence, acting, and unity. The primary split is whether silent judgment (Q2) is irrational. If yes, you locate the error in belief states themselves, pointing to Structural views (d). If silent judgment is fine, the error lies in assertion. Within speech acts, we check acting (Q6). If acting is fine, the issue is specific to genuine assertion. We then test the source: if removing belief-implicature (Q8) removes absurdity, you hold a pragmatic view (b); if absurdity remains due to norms, you hold a normative view (c). Expressivism (a) aligns with (c) on cases but claims semantic contradiction rather than norm violation. Deflationism (e) accepts mixed answers across cases. Credence responses (Q5) further sort binary belief holders from probabilistic thinkers. Unoccupied combinations include finding third-person (Q3) or past-tense (Q4) versions absurd; these are incoherent or unattractive as they deny the paradox's specific first-person present character. Another unoccupied space is finding both silent judgment and acting absurd, which implies the words themselves are contradictory, a view few sustain. Most respondents cluster into (b), (c), or (d), with (e) capturing those who find the knowledge variant (Q7) distinct from the belief variant. Note that (a) and (c) are empirically similar here; separating them requires metaphysical commitments about whether assertion *constitutes* expression or merely *obeys* norms. This quiz prioritizes phenomenological reactions over metaphysical taxonomy, leaving that boundary porous. Consequently, users landing in (a) or (c) should recognize their practical commitments overlap significantly despite theoretical divergence.

  4. The positions
  **Expressivism:** Asserting p conventionally expresses belief that p. Thus, saying 'p but I don't believe it' expresses a contradiction between what is said and what is expressed. Its awkward commitment is requiring a non-standard semantics where assertion carries more content than the proposition asserted, blurring the line between saying and showing.

  **Pragmatic Account:** The content is consistent, but asserting p implicates that the speaker believes p. The absurdity arises from this pragmatic clash between what is implied and what is explicitly denied. Its awkward commitment is struggling to explain why silent judgment of the conjunction feels irrational to many speakers.

  **Normative Account:** Assertion is governed by a constitutive norm, such as knowledge or belief, which Moorean assertions violate. The absurdity is the impropriety of making an assertion one lacks the standing to make. Its awkward commitment is explaining why the violation feels like a contradiction rather than a mere rule-breaking.

  **Structural View:** First-person present belief is transparent; one cannot coherently judge this conjunction because believing p entails judging that one believes p. The absurdity traces to a structural fact about self-knowledge rather than language. Its awkward commitment is explaining why third-person versions remain perfectly coherent and unremarkable.

  **Deflationism:** There is no single underlying explanation; different cases are absurd for different semantic, pragmatic, or psychological reasons. The paradox is a family resemblance concept rather than a unified phenomenon. Its awkward commitment is sacrificing theoretical unity for descriptive accuracy, leaving no core mechanism to target.

  5. Separations and failures
  It is settled that Moorean assertions feel absurd despite consistent content; it is contested whether this arises from semantics, pragmatics, norms, or psychology. This quiz separates Structural (d) and Deflationary (e) views cleanly via silent judgment and unity questions. However, it cannot fully separate Expressivism (a) from the Normative view (c). Both predict absurdity in standard assertion cases and permissibility in acting cases. Distinguishing them requires asking whether assertion *constitutes* belief expression or merely *requires* belief, a metaphysical distinction not fully capturable by case reactions alone. Similarly, Pragmatic (b) and Normative (c) views are close; Question 8 helps, but hypothetical intuitions about norms vary. The quiz successfully isolates whether you locate the problem in the mind (d) or the speech act (a, b, c), and whether you seek unity (a-d) or disunity (e). Users should treat the (a)/(c) split as a theoretical refinement of a shared practical diagnosis. Future iterations might include questions on lying versus mistaken assertion to probe the norm's strength.
