answer: |-
  You are not missing anything fundamental, and you are not being paranoid. You have correctly identified one of the most significant philosophical fault lines in modern economics.

  Your intuition is spot-on: Revealed Preference Theory (RPT) *does* collapse the distinction between choice and preference, and it *does* struggle to account for akrasia (weakness of will), addiction, or internal conflict without resorting to tautological reasoning.

  The feeling of a "bait-and-switch" comes from the fact that economists often slide between using RPT as a **methodological tool** (a way to model demand) and an **ontological claim** (a statement about what human desire actually *is*).

  Here is the breakdown of why economists do this, why your critique is valid, and where the theory actually stands today.

  ### 1. The Historical Motivation: Purging Psychology
  To understand why economists made this move, you have to look at the 1930s. Before Paul Samuelson formalized Revealed Preference in 1938, economics was built on "utility." Utility was treated as a psychological state—a measurable unit of happiness or satisfaction (cardinal utility).

  The problem, as you noted, is that you can't observe utility. You can't put a person in a lab and measure their "utils." Samuelson and the logical positivists of the time wanted economics to be a "hard science" like physics. Physics deals with observables (position, velocity, mass). Economics should deal with observables (prices, quantities, income).

  So, Samuelson made a methodological decision: **Let's stop talking about the internal mental state of "utility" and just model the relationship between constraints and choices.**

  *   **The Goal:** Not to explain *why* you chose the orange, but to predict *how* your choice changes if the price of oranges doubles.
  *   **The Trade-off:** To make the math work without psychological data, they had to define preference *as* choice. If preference were something internal that could diverge from choice, the model would break because the internal variable would be unmeasurable.

  ### 2. The "As If" Defense (Instrumentalism)
  When you press economists on whether people *actually* have these preferences, the standard defense (championed by Milton Friedman) is **Instrumentalism**.

  The argument is: *It doesn't matter if the assumption is true, only if the prediction works.*

  They argue that even if people are confused, addicted, or lying to themselves, if they act *as if* they are maximizing a consistent preference ordering, the model will successfully predict market demand. From this viewpoint, RPT isn't a claim about human motivation; it's a compression algorithm for behavior. It's like assuming a gas particle "wants" to minimize energy. The particle has no desires, but the math works.

  **However,** your critique hits hard here: If the model fails to predict behavior (e.g., in cases of addiction or systematic bias), and the only defense is to redefine the preference to match the failure, then the model loses its predictive power and becomes a description, not a theory.

  ### 3. The Falsifiability Nuance
  You mentioned that you can "cook up some set of preferences that rationalizes any choice pattern," making it unfalsifiable. This is partially true, but there is a technical constraint that saves RPT from being *completely* useless.

  RPT is falsifiable regarding **consistency**, not content.
  *   **The Strong Axiom of Revealed Preference (SARP):** If you choose Bundle A over Bundle B when you could afford both, you cannot later choose Bundle B over Bundle A when you can still afford both.
  *   **The Test:** If I observe you cycling (A > B, B > C, C > A) with the same budget, Revealed Preference theory is falsified. You are not acting *as if* you have a consistent ordering.

  So, the theory doesn't say "any choice is rational." It says "choices must not contradict previous choices under the same constraints." If they do, the model breaks. However, you are right that in practice, economists often explain away inconsistencies by claiming "constraints changed" or "information changed," which can slide back into tautology.

  ### 4. The Akrasia Problem (Where You Are Right)
  This is your strongest point. Standard neoclassical economics assumes a **unitary self**. There is one "you" making choices to maximize one "utility function."

  In your smoking example:
  *   **Standard Econ:** You smoked. Therefore, at that moment, the utility of smoking > utility of health. You revealed a preference. There is no conflict.
  *   **Reality:** There is a conflict between your "System 1" (impulse) and "System 2" (planning), or between your "present self" and "future self."

  By defining preference as choice, standard economics **defines away the possibility of regret.** If I choose X, I preferred X. If I later wish I hadn't chosen X, standard theory has a hard time explaining that without saying "your preferences changed," which is a weak explanation.

  **Amartya Sen**, the Nobel laureate, famously critiqued this in his paper *Rational Fools* (1977). He argued that conflating choice with welfare is a category error. He distinguished between:
  1.  **Choice Preference:** What I select.
  2.  **Welfare Preference:** What actually benefits me.
  3.  **Normative Preference:** What I think I *should* select.

  Standard economics collapses all three into #1. Sen argued this makes economics unable to discuss welfare improvements in cases of addiction, manipulation, or adaptive preferences (e.g., a oppressed person "choosing" not to seek education because they've internalized their lack of worth).

  ### 5. The Modern Shift: Behavioral Economics
  Because of exactly the problems you identified, **Behavioral Economics** has spent the last 30 years reopening the black box that Samuelson closed.

  Behavioral economists (like Thaler, Kahneman, Rabin) explicitly admit that choice $\neq$ preference.
  *   They model **time inconsistency** (hyperbolic discounting) to explain addiction and procrastination.
  *   They acknowledge that framing effects can change choices without changing underlying value.
  *   They distinguish between "decision utility" (what drives the choice) and "experienced utility" (what actually feels good).

  In modern behavioral models, you *can* choose something you don't prefer (in the welfare sense). The "bait-and-switch" you sensed is actively being corrected in the cutting edge of the field, though introductory textbooks often still teach the older, cleaner Samuelson version.

  ### Summary
  You haven't misunderstood the theory; you've understood its limitations better than many practitioners do.

  1.  **Why do they do it?** Methodological behaviorism. It allows for mathematical modeling without unobservable psychological data. It treats humans like consistent optimization engines to make the calculus tractable.
  2.  **Is it a metaphysical claim?** Officially, no (it's "as if"). Practically, yes (many economists speak as if it describes reality).
  3.  **Is it unfalsifiable?** Technically no (it requires consistency), but practically, it can be hard to disprove because "preferences" are flexible.
  4.  **What about akrasia?** Standard theory ignores it. Behavioral theory addresses it by decoupling choice from welfare.

  As a software engineer, you might think of standard Revealed Preference like assuming a function is **pure** (no side effects, deterministic output for a given input). It makes the system much easier to reason about and debug. But if the function actually relies on global state, hidden dependencies, or random seeds (psychology, addiction, context), the "pure function" model will compile, but it won't run correctly in production.

  You are right to be skeptical. The "substantive insight" is not that humans *are* consistent optimizers, but that assuming they are *acts as a useful baseline* for predicting aggregate market behavior, provided you don't take the ontology too literally.
