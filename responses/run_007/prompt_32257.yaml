prompt: |-
  hey, i work at a foundation that makes largish grants — think $2M to $10M, maybe six or seven decisions a year. i've gotten convinced by the moral uncertainty stuff (mainly through the EA grapevine, macaskill and ord and that crowd) that we should be taking our uncertainty about moral theories seriously when we allocate money, rather than just picking whichever theory the ED happens to believe and running with it. but i have literally no idea how to operationalize this. our team is five smart generalists, not philosophers, and we have maybe an afternoon per decision. 

  i need a procedure — a checklist or a decision tree or something — that walks us through how to actually do moral-uncertainty-aware grantmaking. it should cover: how to identify which moral theories we should even consider (we can't consider all of them), how to assign credences without it turning into a seminar, how to compare options across theories when the theories don't share a common currency, and what to do when one theory says the stakes are astronomical and another says they're modest. i need to be able to defend this to a board that is skeptical of philosophy.

  then run the procedure on two actual decisions: (1) we're choosing between a global health charity with strong RCT evidence (looks great on a narrow welfarist view, less obviously great if you care about structural justice) and a criminal justice reform group where the evidence is messier but the theory of change appeals to a broader set of moral considerations; (2) we're picking between two climate projects, one framed around preventing future human suffering (which looks different depending on whether you count future people as having full moral weight) and one framed around protecting ecosystems for their own sake. flag the steps where the procedure breaks down or where we're just dressing up a gut call as a methodology.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** Works at a foundation making large grants ($2M-$10M, 6-7/year).
      *   **Context:** Convinced by moral uncertainty arguments (MacAskill, Ord, EA crowd) but needs operationalization.
      *   **Constraints:** Team of 5 smart generalists (not philosophers), limited time (afternoon per decision), need to defend to a skeptical board.
      *   **Deliverable:** A procedure (checklist/decision tree) for moral-uncertainty-aware grantmaking.
      *   **Specific Requirements:** Cover theory selection, credence assignment, inter-theoretic comparison, handling astronomical stakes vs. modest stakes.
      *   **Application:** Run the procedure on two specific cases (Global Health vs. Criminal Justice; Climate Future Suffering vs. Ecosystem Intrinsic Value).
      *   **Critical Requirement:** Flag where the procedure breaks down or masks gut calls.

  2.  **Deconstruct the Problem:**
      *   *Moral Uncertainty* is theoretically dense (MEC, variance voting, stochastic dominance, etc.).
      *   *Operational Reality* is messy, time-constrained, and political.
      *   *Tension:* Rigor vs. Pragmatism. A full philosophical treatment is impossible in an afternoon. A simplistic scoring system might be "ethics washing."
      *   *Goal:* Create a "Good Enough" framework that improves decision quality without requiring a PhD in meta-ethics.

  3.  **Drafting the Procedure (The "Moral Uncertainty Quick-Scan"):**
      *   *Step 1: Theory Selection.* Can't consider *all* theories. Need a "Shortlist." Common ones: Utilitarianism (Welfarist), Deontology (Rights/Duties), Virtue Ethics (less actionable for grants), Prioritarianism, Longtermism. Let's simplify to: Consequentialist/Welfarist, Rights/Justice, and maybe Longtermist/Future-Generations.
      *   *Step 2: Credence Assignment.* Don't ask "What is the probability this theory is true?" Ask "How confident are we that this lens matters?" Use a simple weighting (e.g., 50/30/20). Avoid false precision.
      *   *Step 3: Impact Assessment.* Score each option *within* each theory. Use a common scale (e.g., 1-10 or Low/Med/High) to avoid currency issues.
      *   *Step 4: Aggregation.* Weighted score? Or Veto power? For large grants, "Stochastic Dominance" or "Veto on Catastrophe" is better than simple addition.
      *   *Step 5: Sensitivity Check.* Does changing the weights change the decision? If yes, dig deeper. If no, proceed.
      *   *Step 6: Documentation.* Crucial for the board. Explain *why*, not just the math.

  4.  **Refining the Procedure for the User's Constraints:**
      *   *Time:* Keep it to 90 minutes max.
      *   *Board:* Focus on "Risk Management" and "Robustness" rather than "Truth."
      *   *Inter-theoretic comparisons:* This is the hardest part. The "Common Scale" approach is a hack, but necessary. Acknowledge it.
      *   *Astronomical Stakes:* This is the "Pascal's Mugging" risk. Need a cap or a discount rate for low-probability/high-impact claims.

  5.  **Developing the Case Studies:**

      *   *Case 1: Global Health (GH) vs. Criminal Justice (CJ).*
          *   GH: High on Welfarism, Low on Structural Justice.
          *   CJ: Medium on Welfarist (hard to measure), High on Justice/Rights.
          *   Tension: Measurable good vs. Systemic good.
          *   Application: Show how weighting shifts the outcome.

      *   *Case 2: Climate Future Suffering (Human) vs. Ecosystem Intrinsic Value.*
          *   Human: High on Welfarist/Longtermist (if future people count).
          *   Ecosystem: Low on Welfarist, High on Non-Anthropocentric/Environmental Ethics.
          *   Tension: Anthropocentric vs. Ecocentric.
          *   Application: Highlight the "Credence" battle here.

  6.  **Identifying Failure Points (The "Honesty Check"):**
      *   Credences are often just gut feelings in disguise.
      *   Scoring across theories is apples-to-oranges.
      *   Time pressure leads to anchoring.
      *   Board skepticism is valid if the math looks fake.

  7.  **Drafting the Content (Iterative refinement):**

      *   *Intro:* Acknowledge the ambition. Validate the EA influence but ground it in foundation reality.
      *   *The Protocol:* Name it something practical like "The Robustness Protocol."
      *   *Steps:*
          1.  **Select the Lenses:** Limit to 3. (Welfarist, Rights/Justice, Longtermist/Systems).
          2.  **Assign Weights:** Don't debate truth. Debate "relevance."
          3.  **Score Impact:** Use ordinal ranks (1-5) to avoid false precision.
          4.  **Check for Veto/Catastrophe:** Does any theory scream "No"?
          5.  **Calculate & Stress Test:** Weighted sum + Sensitivity analysis.
      *   *Case 1 Walkthrough:* Be specific about the scores.
      *   *Case 2 Walkthrough:* Highlight the intrinsic value difficulty.
      *   *The "Breakdown" Section:* This is crucial. Be brutally honest about where the philosophy fails in practice.

  8.  **Review against Constraints:**
      *   *Afternoon per decision?* The protocol needs to be tight.
      *   *Board skeptical?* Frame it as "Diversifying Moral Risk" (like financial diversification).
      *   *Astronomical stakes?* Address the "Longtermism discount."

  9.  **Final Polish:**
      *   Tone: Professional, pragmatic, slightly cautious (don't oversell the method).
      *   Formatting: Use bolding, lists, and clear headers for readability.
      *   Self-Correction during drafting: I initially thought about suggesting MacAskill's "Variance Voting." *Correction:* Too complex for an afternoon. Stick to Weighted Expectationalism with a Veto check. It's simpler and defensible.
      *   *Inter-theoretic comparison:* Acknowledge that normalizing scores (0-10) is a heuristic, not a solution to the philosophical problem.

  10. **Final Output Generation** (Proceed to generate response based on these thoughts).
answer: |-
  This is a sharp, high-stakes operational challenge. You are asking to translate high-level meta-ethics into a workflow that fits into a Tuesday afternoon meeting without turning your team into philosophers or your board into skeptics.

  The core insight from the moral uncertainty literature (MacAskill, Ord, etc.) that is useful for you is **Moral Diversification**. Just as you wouldn't put 100% of your endowment into one asset class because you aren't certain which will perform best, you shouldn't put 100% of your moral capital into one moral theory.

  Below is a pragmatic protocol designed for your constraints. It sacrifices philosophical purity for decision hygiene. Following the protocol, I will run your two cases and explicitly flag where the method is doing heavy lifting versus where it is dressing up intuition.

  ---

  # The "Moral Robustness" Protocol (MRP)

  **Time Budget:** 90 Minutes per decision.
  **Goal:** Not to find the *True* moral answer, but to avoid *Moral Blindspots* and justify the decision under uncertainty.

  ### Step 1: Select the "Big Three" Lenses (15 mins)
  Do not brainstorm an infinite list of theories. Agree on a fixed shortlist of three moral lenses that cover the vast majority of foundation disputes.
  1.  **Welfarist/Consequentialist:** Maximize well-being, reduce suffering, QALYs/DALYs. (The EA default).
  2.  **Rights/Justice/Deontological:** Respect autonomy, fix structural inequities, fairness, procedural justice.
  3.  **Longtermist/Systemic:** Impact on future generations, existential risk, tipping points, ecological integrity.

  *Board Defense:* "We use these three because they represent the dominant frameworks in philanthropy. Ignoring one exposes us to reputational and ethical risk."

  ### Step 2: Assign Credence Weights (15 mins)
  Do not debate which theory is *true*. Debate how much **risk** you want to take on each. Assign percentages that sum to 100%.
  *   *Default:* 50% Welfarist, 30% Justice, 20% Longtermist.
  *   *Adjustment:* Only move these dials if there is a specific reason for *this* grant cycle.
  *   *Constraint:* No single theory can exceed 70% (prevents dogmatism). No theory can be 0% (prevents blind spots).

  *Board Defense:* "This is moral diversification. We are hedging against the risk that our primary moral intuition is wrong."

  ### Step 3: Score Options Within Lenses (30 mins)
  For each grant option, score impact from 1–5 within each lens.
  *   **1:** Negligible/Negative impact.
  *   **3:** Moderate, plausible impact.
  *   **5:** Transformative/High-confidence impact.
  *   *Crucial Rule:* You must write one sentence justifying the score *using the language of that lens*. (e.g., for Justice, you cannot cite QALYs; you must cite agency or structural change).

  ### Step 4: The "Veto & Astronomical" Check (15 mins)
  Before doing the math, check for two failure modes:
  1.  **The Veto:** Does any lens assign a **1** with high confidence? (e.g., A Welfarist might veto a project that causes direct harm, even if Justice scores it high). If yes, the grant requires ED override.
  2.  **The Pascal Trap:** Does one option rely on "Astronomical Stakes" (e.g., "This might prevent human extinction") with low probability? If yes, discount the score by half for calculation purposes. This prevents low-probability moonshines from hijacking the budget.

  ### Step 5: Weighted Calculation & Sensitivity (15 mins)
  Calculate the Weighted Moral Score (WMS).
  $$WMS = (Score_W \times Weight_W) + (Score_J \times Weight_J) + (Score_L \times Weight_L)$$

  **Sensitivity Test:** If you shift the weights by 10% toward the lowest-scoring theory, does the winner change?
  *   **No:** Decision is **Robust**. Proceed.
  *   **Yes:** Decision is **Fragile**. Either gather more info or split the grant.

  ---

  # Case Study 1: Global Health (GH) vs. Criminal Justice (CJ)

  **The Options:**
  *   **Option A (GH):** Distributing bed nets/meds. High RCT evidence. Saves lives now.
  *   **Option B (CJ):** Policy advocacy for sentencing reform. Messy evidence. Addresses systemic racism/agency.

  **The Setup:**
  *   **Weights:** Welfarist (50%), Justice (30%), Longtermist (20%).

  **Step 3: Scoring**
  *   **Option A (GH):**
      *   *Welfarist:* **5** (Lives saved are certain and measurable).
      *   *Justice:* **2** (Doesn't change power structures; arguably paternalistic).
      *   *Longtermist:* **3** (Healthier population is more productive, but no systemic shift).
  *   **Option B (CJ):**
      *   *Welfarist:* **3** (Hard to count "suffering prevented" from policy change, but plausible).
      *   *Justice:* **5** (Directly addresses autonomy, rights, and structural inequity).
      *   *Longtermist:* **4** (Reducing incarceration has intergenerational community benefits).

  **Step 4: Veto/Astro Check**
  *   No Veto (GH doesn't violate rights; CJ doesn't kill people).
  *   No Astronomical claims.

  **Step 5: Calculation**
  *   **Option A (GH):** $(5 \times 0.5) + (2 \times 0.3) + (3 \times 0.2) = 2.5 + 0.6 + 0.6 = \mathbf{3.7}$
  *   **Option B (CJ):** $(3 \times 0.5) + (5 \times 0.3) + (4 \times 0.2) = 1.5 + 1.5 + 0.8 = \mathbf{3.8}$

  **Result:** CJ wins narrowly.
  **Sensitivity:** If we bump Welfarist to 60% (and drop Justice to 20%), GH wins ($4.1$ vs $3.6$).
  **Decision:** The decision is **Fragile**.
  **Recommendation:** Do not pick one. Split the allocation (e.g., $7M GH / $3M CJ) to maintain moral diversification, or commission a rapid review on the CJ impact metrics to reduce uncertainty on the Welfarist score.

  ---

  # Case Study 2: Climate Future Suffering (Human) vs. Ecosystem Intrinsic Value

  **The Options:**
  *   **Option A (Human):** Geoengineering research / Adaptation for Global South. Prevents future human heat death/suffering.
  *   **Option B (Ecosystem):** Land trust / Rewilding. Protects biodiversity for its own sake, regardless of human utility.

  **The Setup:**
  *   **Weights:** Welfarist (50%), Justice (30%), Longtermist (20%).
  *   *Note:* You may need to tweak the lenses here. "Ecosystem Intrinsic Value" doesn't fit Welfarism well. We will treat "Longtermist" as including "Non-Anthropocentric Value" for this exercise, or acknowledge the mismatch. Let's stick to the standard three but note the friction.

  **Step 3: Scoring**
  *   **Option A (Human):**
      *   *Welfarist:* **5** (Prevents massive human suffering).
      *   *Justice:* **4** (If focused on Global South adaptation).
      *   *Longtermist:* **5** (Secures future generations).
  *   **Option B (Ecosystem):**
      *   *Welfarist:* **2** (Only counts insofar as it helps humans eventually).
      *   *Justice:* **2** (Indigenous rights involved, but primary goal is nature).
      *   *Longtermist:* **5** (Preserves biosphere integrity, assumes nature has value independent of humans).

  **Step 4: Veto/Astro Check**
  *   **Astronomical Check:** Option A claims to save *future generations*. This is the "Longtermist" hook. However, geoengineering has high risk. We apply the **Pascal Trap** discount to Option A's Longtermist score (5 becomes 2.5) due to implementation risk/uncertainty.

  **Step 5: Calculation**
  *   **Option A (Human):** $(5 \times 0.5) + (4 \times 0.3) + (2.5 \times 0.2) = 2.5 + 1.2 + 0.5 = \mathbf{4.2}$
  *   **Option B (Ecosystem):** $(2 \times 0.5) + (2 \times 0.3) + (5 \times 0.2) = 1.0 + 0.6 + 1.0 = \mathbf{2.6}$

  **Result:** Option A wins decisively.
  **Sensitivity:** Even if Welfarism drops to 30%, Option A wins.
  **Decision:** **Robust**. Fund Option A.

  ---

  # The Breakdown Report: Where This Method is Lying to You

  You asked me to flag where the procedure breaks down or dresses up gut calls. Here is the honest audit of the MRP.

  ### 1. The "Common Currency" Illusion (Step 3)
  *   **The Problem:** In Case 2, a "5" in Welfarism (human suffering prevented) is not mathematically equivalent to a "5" in Longtermism (ecosystem integrity). One is about pain; the other is about existence or sanctity. By forcing them onto a 1-5 scale, we are pretending we have solved the *inter-theoretic comparison problem*. We haven't.
  *   **The Reality:** Your team is implicitly converting "Ecosystem Value" into "Human Value" when scoring the Welfarist column.
  *   **Mitigation:** Acknowledge this in the minutes. "We scored Ecosystem B low on Welfarism because we are assuming an anthropocentric baseline for that column."

  ### 2. Credences are Just Politics (Step 2)
  *   **The Problem:** Assigning 50% weight to Welfarism isn't a philosophical discovery; it's a reflection of your ED's bias or the board's comfort level. In Case 1, shifting the weight by 10% flipped the decision. This means the "Math" is less important than the "Weight Negotiation."
  *   **The Reality:** The 90-minute meeting will inevitably turn into a debate about the weights, not the grants.
  *   **Mitigation:** Freeze the weights for a fiscal year. Do not renegotiate them per grant. This forces the debate onto the *Impact Scores*, which are more evidence-based.

  ### 3. The Pascal Trap is Arbitrary (Step 4)
  *   **The Problem:** I applied a "50% discount" to astronomical claims in Case 2. Why 50%? Why not 90%? This is a fudge factor to prevent the team from being paralyzed by low-probability, high-impact scenarios (like existential risk).
  *   **The Reality:** This is a heuristic to keep you employable. If you fund a geoengineering project that fails, you need to show you discounted the risk. If you don't fund it and the world ends, the math says you were rational.
  *   **Mitigation:** Call it a "Risk-Adjusted Score" rather than a philosophical discount. Frame it as financial due diligence.

  ### 4. The "Justice" Black Box (Case 1)
  *   **The Problem:** In Case 1, Criminal Justice got a 5 on Justice. But "Justice" is the hardest theory to measure. Is it procedural? Distributive? Restorative?
  *   **The Reality:** Your team likely gave it a 5 because it *felt* important, not because you have a theory of justice you applied consistently.
  *   **Mitigation:** Require the "One Sentence Justification" in Step 3 to reference a specific framework (e.g., "Rawlsian difference principle" or "Capability Approach"). If they can't name the lens, they can't score the lens.

  ### 5. Board Defense Strategy
  Your board is skeptical of philosophy. Do not use the word "Moral Uncertainty."
  *   **Say this:** "We use a **Multi-Criteria Decision Analysis** framework to stress-test our grants against different stakeholder values."
  *   **Say this:** "We weight our portfolios to ensure we aren't over-exposed to one type of impact risk."
  *   **Do not say:** "We aren't sure if killing animals is wrong, so we hedged."

  ### Final Recommendation
  Use the protocol for the **internal deliberation**, but simplify the **external reporting**.
  1.  **Internal:** Run the MRP to expose disagreements. If the team fights about the Weights, you know you have a values misalignment. If they fight about the Scores, you know you need more data.
  2.  **External:** Present the winner as the "Robust Choice." "We selected Option B because it performed well across multiple impact frameworks, reducing the risk that our primary metrics are missing key value."

  This approach gives you the benefit of moral uncertainty (humility, robustness, diversification) without requiring you to solve meta-ethics by 5 PM.
