  # JOINT STATEMENT ON DE RE MODALITY
  **Signed:** [Name], Proponent of Counterpart Theory (Lewisian)  
  **Signed:** [Name], Proponent of Transworld Identity (Kripkean-Plantingan)  
  **Date:** October 26, 2023  
  **Subject:** Findings of Adversarial Collaboration on the Metaphysics of Modality

  ## PREAMBLE

  We, the undersigned, acknowledge that while we remain committed to divergent ontological frameworks regarding possible worlds and individual essence, our collaboration has clarified the structural isomorphisms and the substantive divergences between our positions. We agree that the debate is not merely terminological, though it contains verbal elements that have historically obscured the metaphysical stakes. The following document codifies our shared commitments, maps our disagreements, and identifies the specific empirical or conceptual cruxes upon which the resolution of our dispute depends.

  ---

  ## I. SHARED CLAIMS

  We jointly affirm the following propositions:

  1.  **Formal Adequacy:** Both Counterpart Theory (CT) and Transworld Identity (TWI) can be modeled within standard quantified modal logic (specifically S5). We agree that the formal semantics of modal logic are neutral between our metaphysical interpretations; the dispute concerns the *model interpretation*, not the model structure.
  2.  **Utility of Worlds-Talk:** Talk of "possible worlds" is indispensable for philosophical analysis. Whether worlds are concrete maximal mereological sums (Lewis) or abstract maximal consistent sets of propositions (Plantinga/Kripke), we agree that possible-worlds semantics provides the best available tool for analyzing counterfactuals, properties, and propositional attitudes.
  3.  **The Data of Modal Judgment:** The primary data to be saved are ordinary *de re* modal judgments (e.g., "I could have worn a blue shirt today," "Humphrey might have won the election"). We agree that a successful theory must validate the truth of most such ordinary claims without violating logical consistency.
  4.  **Reciprocal Problem Acknowledgement:**
      *   The **Counterpart Theorist** acknowledges the intuitive force of **Humphrey's Objection**: It *seems* pre-theoretically that modal properties matter to an agent in virtue of being *their* properties, not the properties of a distinct similar individual.
      *   The **Transworld Identity Theorist** acknowledges the force of the **Problem of Accidental Intrinsics**: It is logically difficult to explain how one and the same entity can literally possess incompatible intrinsic properties (e.g., being bent and being straight) without resorting to relations to worlds or temporal parts.
  5.  **Rejection of Eliminativism:** We both reject modal eliminativism. Modality is a real feature of reality, not merely a feature of language or epistemic limitation.
  6.  **Semantic Depth:** We agree that the dispute is not *merely* verbal. While both sides can paraphrase many of the other's claims, the paraphrases incur different ontological costs (e.g., proliferation of entities vs. primitivism about identity) that have downstream consequences for mereology, persistence, and essence.

  ---

  ## II. DISAGREEMENTS TABLE

  | Point of Disagreement | (a) Counterpart Theorist's Formulation | (b) Transworld Identity Theorist's Formulation | (c) Neutral Statement of the Question |
  | :--- | :--- | :--- | :--- |
  | **1. Ontology of Individuals** | Ordinary objects are **world-bound**. An object exists in exactly one possible world. Identity is strictly intra-world. | Ordinary objects are **transworld continuants**. An object can exist in multiple possible worlds. Identity is transitive across worlds. | What is the extent of an individual's existential scope relative to the domain of possible worlds? |
  | **2. Truth-Makers for *De Re* Modality** | "Humphrey might have won" is true iff there exists a **counterpart** of Humphrey in some world who wins. The relation is one of similarity, not identity. | "Humphrey might have won" is true iff **Humphrey himself** exists in some world and wins. The relation is strict numerical identity. | What entity bears the modal property in the truth conditions of a *de re* modal claim? |
  | **3. Accidental Intrinsics** | Solved by **relational analysis**. Object $x$ is bent-at-$w$ because $x$'s counterpart at $w$ is bent. No contradiction arises as properties are held by distinct entities. | Solved by **world-indexing** or **adverbialism**. Object $x$ is bent-at-$w$ is a relational property of $x$. $x$ does not possess "bentness" simpliciter across worlds. | How can a single subject of predication support incompatible intrinsic properties across different modal contexts? |
  | **4. Humphrey's Objection** | **Conceded but defanged.** While Humphrey cares about himself, the *truth conditions* of his modal claims are about counterparts. What matters to him (pride/regret) is grounded in the success of his counterparts. | **Fatal Objection.** If truth conditions refer to a distinct individual (the counterpart), the theory fails to capture the *de se* nature of modal thought. Humphrey cannot care about a distinct individual's victory as his own. | Does the semantic analysis of modal claims need to mirror the psychological structure of modal attitudes (e.g., regret, hope)? |
  | **5. Essence and Origin** | Essences are **context-sensitive**. What counts as an essential property depends on the salience of the counterpart relation in conversation. | Essences are **fixed and absolute**. Origin and constitution are necessary properties of an object, independent of conversational context (Kripke's Necessity of Origin). | Are the truth conditions of essentialist claims sensitive to conversational context, or are they mind-independent facts? |

  ---

  ## III. CRUX INVENTORY

  We identify the following sub-questions as "cruxes." If these were settled empirically or conceptually, at least one of us would be compelled to revise our position.

  ### Crux 1: The Metaphysics of Ordinary Objects (Fission Across Worlds)
  *   **The Question:** If a process analogous to fission (or teletransportation) were to occur "across worlds" (i.e., two distinct possible histories diverge from a single actual past), does this constitute one object with two modal futures, or two distinct objects sharing a past counterpart?
  *   **Agreed-Upon Evidence:** Intuitions regarding personal identity in branching time scenarios (e.g., Parfit-style cases) applied to modal space.
  *   **Predictions:**
      *   **CT Predicts:** We should treat the divergent histories as distinct objects linked by a common actual counterpart. Identity does not branch; therefore, the objects in the divergent worlds are numerically distinct.
      *   **TWI Predicts:** We should treat the divergent histories as one object existing in different maximal states of affairs. Identity can branch in modal space (or the "worlds" are not disjoint in a way that precludes identity).
  *   **Revision Condition:** If it is demonstrated that *numerical identity* cannot logically branch (a widely held logical principle), the TWI proponent must adopt a "world-indexed" view that effectively mimics CT. If it is demonstrated that branching is coherent for continuants, the CT proponent must abandon strict world-boundedness.

  ### Crux 2: The Semantics of "Actually" and Indexicals
  *   **The Question:** In the sentence "I could have been someone else," is the speaker expressing a falsehood, or a truth about counterpart relations?
  *   **Agreed-Upon Evidence:** Linguistic data regarding the rigidity of indexicals ("I", "here", "now") in modal contexts.
  *   **Predictions:**
      *   **CT Predicts:** The sentence is literally **false**. "I" rigidly designates the actual speaker. The speaker may *feel* they could have been someone else, but this is a confusion about counterpart relations (a counterpart of me could have been a counterpart of someone else).
      *   **TWI Predicts:** The sentence is literally **false**. "I" rigidly designates the speaker across all worlds. I am essentially myself.
      *   *Note:* Here we agree on the truth value, but disagree on *why*. The crux is the explanation of the *illusion* of contingency.
  *   **Revision Condition:** If linguistic analysis reveals that "I" functions non-rigidly in certain modal embeddings (e.g., "If I were you..."), the TWI proponent must concede that indexical reference is context-bound in a way that supports CT. If "I" is proven strictly rigid in all contexts, CT must explain why the counterpart relation allows for *de se* confusion without semantic error.

  ### Crux 3: The Nature of Regret and Pride (Humphrey's Objection)
  *   **The Question:** When an agent feels regret about a past action, are they relating to a property of their actual self or a property of a non-actual counterpart?
  *   **Agreed-Upon Evidence:** Phenomenological reports on the structure of counterfactual emotion (e.g., "I regret not studying," implying "I could have studied").
  *   **Predictions:**
      *   **CT Predicts:** Psychological investigation will show that regret is mediated by **similarity judgments**. We regret what our "better selves" (counterparts) did or did not do. The emotional grip is explained by the strength of the counterpart relation.
      *   **TWI Predicts:** Psychological investigation will show that regret presupposes **self-identity**. The agent conceives of the alternative scenario as a literal history of *themselves*. If told the alternative agent is distinct, the regret should vanish.
  *   **Revision Condition:** If empirical psychology demonstrates that agents cease to feel *de se* regret when the alternative agent is described as merely "similar" rather than "identical," the CT proponent must concede that Humphrey's Objection is fatal to the phenomenological adequacy of CT.

  ---

  ## IV. NOTE ON VERBAL DISPUTE AND METAPHYSICAL STAKES

  We conclude with a joint assessment regarding the nature of our disagreement.

  **1. Is the dispute merely verbal?**
  We agree that the dispute is **not merely verbal**, though it contains verbal components.
  *   **Verbal Component:** Much of the friction arises from the use of the word "identity." The CT proponent uses "is" to denote strict numerical identity (intra-world), while the TWI proponent uses "is" to denote transworld continuity. We agree that if we strictly stipulate definitions, we can translate many claims from one framework to the other.
  *   **Substantive Component:** The dispute remains substantive because the choice of framework dictates our **mereology** and **ontology**.
      *   Adopting CT commits us to a plurality of concrete worlds and a proliferation of objects (every modal variation creates a new object).
      *   Adopting TWI commits us to abstract worlds (or a connected concrete pluriverse) and primitive facts about transworld identity that resist analysis.
      *   These ontological commitments have different theoretical costs (parsimony vs. explanatory power) that cannot be paraphrased away.

  **2. Accidental Intrinsics and Metaphysics**
  We acknowledge that the TWI solution to Accidental Intrinsics (world-indexing properties) renders properties more relational than the CT solution does.
  *   **CT:** Properties are intrinsic to the counterpart; the actual object has the property *by proxy*.
  *   **TWI:** Properties are relational to the world; the actual object has the property *directly but indexed*.
  *   **Joint Conclusion:** This is a genuine metaphysical disagreement about the nature of properties, not just semantics.

  **3. Humphrey's Objection and Semantics**
  We acknowledge that Humphrey's Objection highlights a gap between **truth-conditions** and **subject matter**.
  *   **CT:** Truth-conditions involve counterparts; subject matter is the agent.
  *   **TWI:** Truth-conditions and subject matter are identical.
  *   **Joint Conclusion:** The resolution of this issue depends on whether one accepts that semantic value can diverge from the content of thought. This is a dispute in the philosophy of language that undergirds our metaphysical disagreement.

  **Signed,**

  _________________________  
  (Counterpart Theorist)

  _________________________  
  (Transworld Identity Theorist)
