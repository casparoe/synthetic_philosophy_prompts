prompt: |-
  Got into it with my roommate the other night, who took a couple econ classes and now acts like he's cracked human nature. His line is that there's no point asking people what they care about, you just watch what they do. The way he puts it, preferences are like the temperature in a room and choices are the thermometer. You can't see the temperature itself, but the reading is all you've got, and if the thermometer says 70 you don't sit there insisting it "really feels" 65. So if someone says they care about their health but spends every weekend on the couch eating chips, the couch-and-chips choices are the preference, and the health talk is just noise. He calls it revealed preference, and he thinks it means surveys and self-reports about values are basically worthless; you should only look at how people spend their money and their time.

  I'm not sure its that clean. I want to know how far the thermometer analogy actually holds. What maps onto what (the room, the temperature, the thermometer, the reading, the calibration)? Where does the picture break down, and which breakdowns actually matter for his conclusion? And if the disanalogies do matter, does the conclusion—that you should ignore what people say and only trust what they choose—survive in some weaker form, or was the thermometer doing all the work?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** The user had an argument with a roommate about economics, specifically "revealed preference theory."
      *   **Roommate's Position:** Preferences are unobservable (like temperature); choices are the only measurement (like a thermometer reading). Therefore, self-reported values/surveys are worthless; only observed behavior (spending time/money) matters. If someone says they value health but eats chips, they *prefer* chips.
      *   **User's Position:** Skeptical. Feels it's not that clean. Wants to know the limits of the analogy.
      *   **Specific Questions:**
          1.  How far does the thermometer analogy hold? (What maps to what?)
          2.  Where does the picture break down?
          3.  Which breakdowns matter for the conclusion (ignore speech, trust action)?
          4.  Does the conclusion survive in a weaker form?

  2.  **Deconstruct the Roommate's Argument (Revealed Preference Theory):**
      *   *Core Concept:* Paul Samuelson's Revealed Preference Theory (1938).
      *   *Logic:* We cannot see inside people's minds. We observe choices under constraints (budget, time). If $A$ is chosen over $B$ when both are available, $A$ is revealed preferred to $B$.
      *   *Roommate's Extension:* This makes verbal reports irrelevant. "Health" is a lie; "Chips" is the truth.
      *   *Roommate's Analogy:* Preferences = Temperature (latent variable), Choices = Thermometer Reading (observable data).

  3.  **Evaluate the Thermometer Analogy (Mapping):**
      *   *Room:* The decision context/environment.
      *   *Temperature:* The underlying utility/preference structure.
      *   *Thermometer:* The choice mechanism/behavior.
      *   *Reading:* The specific choice made (e.g., buying chips).
      *   *Calibration:* Rationality/Consistency assumptions (transitivity, completeness).

  4.  **Identify Breakdowns in the Analogy (The Critique):**
      *   *Breakdown 1: The Thermometer is Broken (Bounded Rationality).* Thermometers are designed to measure accurately. Humans make mistakes, act impulsively, or lack self-control. A broken thermometer doesn't mean the temperature doesn't exist; it means the measurement is noisy.
      *   *Breakdown 2: Multiple Thermometers (Multiple Selves).* People have conflicting preferences (present self vs. future self). A thermometer gives one number. A human might say "Health" (Future Self) and choose "Chips" (Present Self). Both are "real."
      *   *Breakdown 3: The Room Changes When Measured (Reflexivity).* Asking someone what they value can *change* what they value. A thermometer doesn't heat the room.
      *   *Breakdown 4: Constraints vs. Preferences.* Choices are a function of Preferences *and* Constraints (Budget, Information, Ability). If I choose chips because healthy food is too expensive or unavailable, it's not a preference for chips. A thermometer doesn't have a budget constraint.
      *   *Breakdown 5: Meaning of "Preference".* In econ, preference $\neq$ welfare. I can choose something that harms me (addiction). The roommate conflates "what I want now" with "what is good for me."

  5.  **Assess the Impact on the Conclusion:**
      *   *Roommate's Conclusion:* Ignore speech, trust action.
      *   *Verdict:* Too strong.
      *   *Why?* Because actions are noisy data. Speech provides context about constraints, intentions, and internal conflicts.
      *   *Weaker Conclusion:* Actions are *better* data than speech for predicting behavior, but speech is crucial for understanding *welfare* and *mechanisms*. You need both to diagnose the "temperature."

  6.  **Drafting the Response (Iterative Structure):**

      *   *Introduction:* Acknowledge the roommate is channeling Paul Samuelson. Validate that the intuition is standard econ, but the application is overly rigid.
      *   *Section 1: Mapping the Analogy.* Explicitly answer "What maps to what."
          *   Room = Choice Set/Context.
          *   Temperature = Utility/Well-being.
          *   Thermometer = The Choice Mechanism.
          *   Reading = The Observed Action.
          *   Calibration = Rationality Axioms.
      *   *Section 2: Where the Analogy Breaks.* This is the meat of the answer.
          *   *Calibration Error:* Humans aren't calibrated instruments (bias, error).
          *   *Multiple Temperatures:* Time inconsistency (Hyperbolic discounting).
          *   *Constraints:* The thermometer isn't constrained by price; humans are.
          *   *The "Black Box" Problem:* Speech gives info on the mechanism, not just the output.
      *   *Section 3: Does the Conclusion Survive?*
          *   No, not in the "ignore speech" form.
          *   Yes, in a "actions predict behavior, speech predicts values" form.
          *   Introduce the concept of *Normative* vs. *Positive* preferences.
      *   *Section 4: The Verdict.* Give the user ammo for the next argument. The roommate is right about prediction, wrong about welfare.

  7.  **Refining the Tone:**
      *   Keep it intellectual but accessible.
      *   Avoid overly dense jargon (explain "axioms" or "utility").
      *   Be fair to the roommate (revealed preference is useful) but firm on the limitations.
      *   Use the "Thermometer" metaphor throughout to maintain coherence.

  8.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I address the "health vs. chips" example? *Yes, use it in the Multiple Selves section.*
      *   *Check:* Did I answer if the conclusion survives? *Yes, distinguish between predicting behavior and understanding well-being.*
      *   *Check:* Is the mapping clear? *Make sure to explicitly list the mappings.*
      *   *Refinement:* Make sure to mention that a thermometer is *designed* to be passive, whereas human choice is active and constructive.

  9.  **Final Polish:** Organize with clear headings. Ensure the distinction between "Positive Economics" (what is) and "Normative Economics" (what ought to be) is clear, as that's the philosophical root of the disagreement. (Proceed to generate output based on these thoughts.)

  10. **Final check of the prompt requirements:**
      *   What maps onto what? (Done)
