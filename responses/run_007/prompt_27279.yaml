answer: |-
  Your roommate is channeling Paul Samuelson, the Nobel laureate who formalized **Revealed Preference Theory** in 1938. His intuition is the bedrock of neoclassical economics: since we can't peek inside the "black box" of the mind, we must infer desires from actions.

  The thermometer analogy is elegant, but like all analogies, it hides more than it reveals. To figure out who wins this argument, we need to take the analogy apart, see where the wiring gets crossed, and determine if the conclusion (ignore speech, trust action) holds up.

  ### 1. Mapping the Analogy
  First, let's formalize your roommate's model so we can stress-test it.

  *   **The Room:** The **Choice Environment**. This includes the available options, prices, and constraints.
  *   **The Temperature:** The **Latent Preference/Utility**. This is the internal state of value or well-being the person is trying to maximize.
  *   **The Thermometer:** The **Decision-Making Mechanism**. The cognitive process that translates value into action.
  *   **The Reading:** The **Observed Choice**. The specific action taken (buying chips, going to the gym).
  *   **Calibration:** **Rationality Axioms**. The assumption that the thermometer is accurate (i.e., the person is consistent, transitive, and maximizes utility).

  In your roommate's view, if the Reading says "Chips," the Temperature *is* "Chips." To claim the Temperature is "Health" is to claim you know the temperature better than the thermometer does.

  ### 2. Where the Picture Breaks Down
  The analogy fails in four specific ways. Each breakdown attacks the idea that choices are a *perfect* measurement of preferences.

  #### A. The Thermometer is Often Broken (Bounded Rationality)
  A mercury thermometer is a passive physical instrument; it doesn't have moods, fatigue, or cognitive biases. Humans do.
  *   **The Breakdown:** If I tap a thermometer, the reading doesn't change. If I ask a human to choose while tired, stressed, or intoxicated, the "reading" changes even if the "temperature" (underlying values) hasn't.
  *   **Why it matters:** If someone chooses chips because they are exhausted and lack willpower in that moment, that is a **measurement error**, not a true reading of their stable preferences. Your roommate treats all noise as signal.

  #### B. There Are Multiple Temperatures (Time Inconsistency)
  A room generally has one temperature at a given time. Humans have competing preference structures across time.
  *   **The Breakdown:** Behavioral economics calls this **Hyperbolic Discounting**. You have a "Present Self" (wants chips now) and a "Future Self" (wants health later). Both are real.
  *   **Why it matters:** When your roommate says "the choice is the preference," he is privileging the *Present Self* as the only true self. But when the person says "I care about health," they are speaking for the *Future Self*. Ignoring the speech ignores half the equation. The thermometer analogy collapses because there are two thermometers fighting over the dial.

  #### C. The Thermometer Has a Budget (Constraints vs. Preferences)
  A thermometer measures temperature regardless of cost. A human choice is a mixture of *preference* and *constraint*.
  *   **The Breakdown:** Revealed preference assumes the choice set is open. But if healthy food is 5x the price of chips, or if the person works three jobs and has no time to cook, choosing chips reveals **budget constraints**, not necessarily a preference for chips over health.
  *   **Why it matters:** Your roommate conflates "what I want most" with "what I can afford (in money or willpower)." Self-reports ("I value health") help disentangle the constraint from the desire. Without the speech, you can't tell if they chose chips because they love them or because they're broke/tired.

  #### D. The Measurement Changes the Room (Reflexivity)
  A thermometer does not heat the room. But asking people what they value *changes* what they value.
  *   **The Breakdown:** This is the **Observer Effect**. Verbalizing a value creates a social and psychological commitment. Telling a roommate "I care about health" creates accountability that might alter future choices.
  *   **Why it matters:** If you treat speech as "noise," you ignore a causal mechanism that drives future behavior. Dismissing the talk makes the talk *more* likely to remain noise, because you've removed the social accountability.

  ### 3. Does the Conclusion Survive?
  Your roommate's conclusion is: *Surveys and self-reports are worthless; only look at spending and time.*

  **The Strong Conclusion (Ignore Speech): False.**
  Because of the breakdowns above, actions are noisy data. If you only watch actions, you will consistently misdiagnose addiction as preference, poverty as taste, and exhaustion as apathy. You will predict behavior okay in the short term, but you will fail to understand *welfare* (well-being).

  **The Weaker Conclusion (Speech is Cheap, Action is Costly): True.**
  The core insight of revealed preference does survive in a weaker form: **Actions involve costs; speech does not.**
  *   Saying "I love you" costs nothing. Buying a ring costs money.
  *   Saying "I care about the environment" costs nothing. Installing solar panels costs money.

  Therefore, actions are a *higher threshold* signal than speech. They are not perfect, but they are heavier.

  ### 4. The Verdict: How to Win the Argument
  You can concede the ground that actions are better predictors of *future behavior*, but hold the ground that speech is essential for understanding *well-being*.

  Here is the distinction that breaks your roommate's model: **Positive vs. Normative Preferences.**

  1.  **Positive Preference (What I will do):** Your roommate is right. If you want to bet on what your roommate will do next Saturday, look at his past choices, not his promises. The "thermometer reading" predicts the next reading better than the manufacturer's label.
  2.  **Normative Preference (What I want to want):** This is where he is wrong. Humans have the unique ability to evaluate their own thermometer. We can look at the reading (eating chips) and say, "This is an error. I am malfunctioning. I want to be recalibrated."

  **The Counter-Analogy:**
  Tell him the thermometer analogy is wrong because humans aren't rooms; we are **thermostats**.
  *   A thermometer passively reads the temperature.
  *   A thermostat has a *setting* (what we say we value) and a *current reading* (what we do).
  *   When the reading deviates from the setting, a thermostat triggers a correction mechanism.

  If someone says they value health but eats chips, they aren't necessarily revealing that they prefer chips. They are revealing that their **thermostat is broken** (weak willpower, bad environment, addiction).

  **Conclusion:**
  If you ignore the "setting" (what they say they care about), you cannot distinguish between a person who is happy eating chips (setting = 70, reading = 70) and a person who is miserable eating chips (setting = 65, reading = 70, system in error).

  Your roommate's economics can tell you what people *do*. It cannot tell you if they are *happy* doing it. To know that, you have to listen to the speech, even if you don't fully trust it.
