      *   *Option 2: Phenomenological Report.* Experience changes iff the subject reports a change in *descriptive* qualities (metallic, tense) rather than *evaluative* qualities (good, bad, dull).
      *   *Option 3: The "Discriminative Capacity" Principle.* Experience changes iff the subject's ability to discriminate stimuli changes in a way that tracks physical differences, *or* if there is a known physiological disruption.
      *   *Option 4: Dennett's Heterophenomenology.* There is no fact of the matter about the *intrinsic* qualia. There is only a fact of the matter about the subject's *dispositions to judge*.

      *   *Selection:* The user is asking for a principle that *accommodates* their intuitions but also challenges them where necessary (especially regarding Dennett). A strict Dennettian view would say *none* of these are facts about qualia, only facts about judgment. However, the user wants a principle that distinguishes "experience changed" from "standards changed" *within* a framework that acknowledges the difficulty.
      *   *Best Approach:* A **Functional-Phenomenological Principle**. We attribute "experience change" when there is a change in *discriminative granularity* or *sensory descriptor application* that is causally linked to perceptual processing (either via damage or training), whereas "standards change" is attributed when the *descriptors* remain stable but the *valuation* shifts.
      *   *Refinement:* This aligns with E vs. F. Musician (E) uses new descriptors ("intricate," "tense" - structural). Snob (F) uses evaluative descriptors ("shallow," "grating" - though "grating" is tricky, let's assume he means "aesthetically poor").
      *   *Refinement on G:* Dennett's point is that without third-person access to the "qualia space," we can't distinguish. So the principle must acknowledge that "Experience Change" is a *theoretical posit* we use to explain behavior, not a direct observation.

      *   *Proposed Principle:* **The Discriminative-Descriptive Invariance Principle (DDIP).**
          *   *Clause 1 (Physiological Disruption):* If there is independent evidence of physiological alteration to sensory organs or primary processing pathways (illness, stroke), attribute to Experience. (Covers A, D).
          *   *Clause 2 (Perceptual Learning):* If the subject acquires new *discriminative abilities* (can tell X from Y where they couldn't before) and employs new *non-evaluative sensory descriptors* (tense, metallic, notes of blackberry), attribute to Experience. (Covers B, E).
          *   *Clause 3 (Evaluative Shift):* If discriminative ability remains stable and descriptors remain stable, but the *hedonic tone* or *threshold for satisfaction* shifts, attribute to Standards. (Covers C, F).
          *   *Clause 4 (The Symmetry Limit):* In the absence of physiological data or behavioral discrimination tests (Case G), the distinction is indeterminate. (Covers G).

  4.  **Evaluate the Principle against Verdicts:**
      *   **A (Self/Illness):** Fits Clause 1. (Physiological cause).
      *   **B (Sommelier):** Fits Clause 2. (Discrimination + descriptors).
      *   **C (Barista):** Fits Clause 3. (Same profile, just dull).
      *   **D (Stroke):** Fits Clause 1. (Physiological).
      *   **E (Musician):** Fits Clause 2. (Intricate/tense = structural descriptors).
      *   **F (Snob):** Fits Clause 3. (Shallow/grating = evaluative/affective). *Wait, "grating" can be sensory.* I need to address this. If "grating" means "sensory roughness," it's experience. If it means "I dislike it," it's standards. The user says "auditory experience is identical." So we must take his word that the *sensation* is the same.
      *   **G (Chase/Sanborn):** Fits Clause 4. (Indeterminate).
      *   **H (Self Revisited):** This is the problem. H relies on memory. Clause 1 applies (illness), but the *confidence* comes from memory comparison. The principle suggests we should be less confident if we rely solely on memory without physiological confirmation. But the user *has* physiological confirmation (illness). So H is actually safe under Clause 1, but the *epistemic access* is the worry.

  5.  **Addressing the Tensions (E vs. F and G vs. H):**
      *   **E vs. F:** The distinction lies in *descriptive granularity*. The musician hears *more* (intricate). The snob hears the *same* but likes it *less*.
      *   **G vs. H:** Dennett would say H is an illusion of privilege. The principle needs to admit that H is only confident because of the *narrative* of illness (Clause 1), not because of direct qualia access. If the illness story were removed, H collapses into G.

  6.  **Developing New Cases:**
      *   *Case I (The Placebo):* Person told coffee is expensive tastes better. (Standards/Expectation).
