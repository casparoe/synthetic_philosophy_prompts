      *   *Verdict to challenge:* The hard line between E and F. "Tense" (E) and "Grating" (F) are both metaphorical mappings. The distinction is fragile.

      *Let's formulate the principle to be robust but honest about its limits.*

      *Principle Name:* **The Functional-Phenomenological Discrimination Principle.**
      *Core:* We attribute "Experience Change" when there is a change in the *resolution* or *quality* of discrimination that persists even when evaluative stance is controlled. We attribute "Standards Change" when discrimination remains constant but evaluative thresholds shift.
