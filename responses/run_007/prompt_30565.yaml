prompt: |-
  I'm a PhD student working on future contingents, and I keep going back and forth on the sea-battle problem. Please act as a specialist in the metaphysics and logic of future contingents who is willing to actually commit to a view rather than survey options. Here's what I want. Rank these five responses to the sea-battle problem as overall accounts of future contingent truth, judging them against three desiderata: (i) preserving bivalence, (ii) preserving genuine future contingency (the battle really could go either way), and (iii) keeping truth substantive and world-involving rather then merely epistemic or merely about what is settled. The five responses: Aristotle's truth-value-gap view; the Ockhamist or thin-red-line view that future-tensed claims already have truth-values because there is an actual future history; the Peircean view that "will" means something like "is determined to happen"; Lukasiewicz's three-valued logic; and the supervaluationist treatment on which a future-tensed claim is true if true on all admissible histories, false if false on all, and neither otherwise.

  Spend a moment thinking through the trade-offs before you commit, but don't just present options. Give each approach a tier (top, middle, or bottom; ties allowed), a score out of 10, and a one-sentence reason for its placement. Then say which approach you would defend and the strongest reason not to be fully happy with it.

  Return the whole thing as a JSON object with these fields:
  - "ranking": an array of objects, each with "approach" (string), "tier" (one of "top", "middle", "bottom"), "score" (number from 0 to 10), and "reason" (string, one sentence).
  - "defence": a string of two or three sentences saying which approach you would defend and why.
  - "hesitation": a string of one or two sentences giving the strongest objection to your preferred approach.

  Please write in British English (so "defence", not "defense"), and dont hedge: give definite tiers and scores even where you're torn.
