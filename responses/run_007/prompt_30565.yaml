      *   (iii) Substantive Truth: Truth depends on how the world is, not just what we know or what is settled now.

      *Tension:* It is widely accepted in the literature that you cannot satisfy all three simultaneously.
      *   Bivalence + Contingency -> Truth must be substantive (hard to maintain without determinism or TRL).
      *   Contingency + Substantive Truth -> Usually requires giving up Bivalence (gaps or supervaluation).
      *   Bivalence + Substantive Truth -> Usually requires giving up Contingency (determinism/Peircean).

