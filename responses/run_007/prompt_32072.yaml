  Congratulations, graduates. To the families and friends here: thank you for sustaining them through two years of rigorous study. To the Class of 2024: you have mastered cost-benefit analysis, stakeholder mapping, and regression discontinuity. You are ready to fix things. But there is a specific kind of brokenness you will encounter that no spreadsheet can fully capture. It is the frustration of doing everything right, according to the rules, and watching the outcome worsen. You will meet good people making smart decisions that lead to disaster. Today, I want to name that force, not to discourage you, but to arm you. The path to public good is rarely a straight line.

  Economists call these "multipolar traps." In internet subcultures, they are named "Moloch." It is not a villain, but a structure. It happens when individual actors, making perfectly rational choices to protect their own interests, collectively create an outcome everyone hates. Cooperation would save them, but trust is too fragile.
  Consider local housing policy. Imagine ten towns around a growing city. Each town council wants affordable housing regionally. But individually, each council faces pressure to protect local property values and school capacity. So, Town A zones for single-family homes. Rational. Town B sees Town A doing it and fears becoming the only place with density, so they restrict zoning too. Rational. Town C follows. Individually, each council is doing their job. Collectively, the region faces a housing crisis, skyrocketing costs, and segregated communities. No one wanted this. But the logic of competition drove them there. If one town unilaterally builds density, they bear the cost while the region reaps the benefit. So no one moves. That is Moloch. It is the gravity of bad systems. It explains why social media becomes toxic, why overfishing persists, and why burnout spreads. It is not malice; it is mechanics. It is the reason you see good administrators burn out. They are fighting a structure that punishes them for slowing down. In this trap, virtue is a liability. If you refuse to cut corners, your competitor who does cut corners will win the contract. So everyone cuts corners. The trap forces you to sacrifice what you value most—quality, safety, sustainability—just to stay in the game. You will see this in healthcare costs, in educational testing, in procurement. It is the enemy of public value. When you encounter a problem that seems to solve itself by getting worse, you are looking at Moloch. Recognizing it is the first step to stopping it.

  How do you fight gravity? You need leverage. There are three moves in your toolkit.
  First, **Align the Incentives.** You must make the individual cost match the social cost. London introduced congestion pricing to fight traffic. Drivers previously clogged streets because driving was free. By charging a fee, the city aligned individual budget decisions with the social cost of congestion. Traffic dropped significantly. It wasn't easy—it was politically painful—but it changed the math so the rational choice became the public good. You will be told these are inefficient. You must argue they are necessary.
  Second, **Bind Hands.** You must enable credible commitment so players don't defect. Consider workplace safety. Without regulation, ethical companies lose money to competitors who cut corners on safety to save costs. OSHA standards force all players to meet a floor. Companies can't race to the bottom on worker safety because the law binds their hands. It removes the penalty for being ethical. This requires enforcement power, not just suggestions. It means building institutions that survive political cycles.
  Third, **Change the Game.** Alter what counts as winning. For decades, nations competed on GDP growth, often ignoring environmental degradation. New Zealand recently shifted to a "Wellbeing Budget," optimizing for mental health and child poverty instead. It changes the metric of success so jurisdictions compete to improve lives, not just output. This is the hardest move, because it requires changing culture, not just law. It demands you redefine success for your stakeholders.
  None of these are silver bullets. They require political capital. They require you to withstand the pressure to revert to the old logic. Implementing these moves will make you unpopular. Aligning incentives often looks like raising prices. Binding hands looks like bureaucracy. Changing the game looks like idealism. You will face resistance from those benefiting from the trap. They will call you naive. You must be stubborn. You must build coalitions with other actors who are also tired of the race to the bottom. You cannot solve multipolar traps alone; you need to coordinate the coordinators. This is the core work of public policy. It is not just analyzing data; it is designing the rules of engagement so that cooperation becomes the stable equilibrium.

  So, Class of 2024, do not go into the world expecting linear progress. You will face traps where the rational choice is the wrong one. You will feel the pull of the trap. But you are not powerless. You are the mechanics of the machine. You can rewrite the incentives, bind the hands of the reckless, and change the scorecard. The trap is strong, but policy is stronger. Do not just work hard within the system; work to fix the system itself. Go build structures where doing the right thing is also the rational thing. To the families: keep reminding them why they started. We are counting on you. Congratulations.
