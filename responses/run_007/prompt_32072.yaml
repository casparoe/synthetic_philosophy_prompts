      *Moloch Section:*
      Economists call them "multipolar traps." Poets call it "Moloch." It is not a villain, but a structure. It happens when individual actors, making perfectly rational choices to protect their own interests, collectively create a outcome everyone hates.
      Consider local housing policy. Imagine ten towns around a growing city. Each town council wants affordable housing regionally. But individually, each council faces pressure to protect local property values and school capacity. So, Town A zones for single-family homes. Rational. Town B sees Town A doing it and fears becoming the only place with density, so they restrict zoning too. Rational. Town C follows. Individually, each council is doing their job. Collectively, the region faces a housing crisis, skyrocketing costs, and segregated communities. No one wanted this. But the logic of competition drove them there. That is Moloch. It is the gravity of bad systems.

      *Three Moves:*
      How do you fight gravity? You need leverage.
      First, **Align the Incentives.** Make the individual cost match the social cost. London introduced congestion pricing. Drivers previously clogged streets because driving was free. By charging a fee, the city aligned individual budget decisions with the social cost of traffic. Traffic dropped. It wasn't easy—politically painful—but it changed the math.
      Second, **Bind Hands.** Enable credible commitment so players don't defect. Consider workplace safety. Without regulation, ethical companies lose money to competitors who cut corners on safety. OSHA standards force all players to meet a floor. Companies can't race to the bottom on worker safety because the law binds their hands. It removes the penalty for being ethical.
      Third, **Change the Game.** Alter what counts as winning. For decades, nations competed on GDP growth. New Zealand recently shifted to a "Wellbeing Budget," optimizing for mental health and child poverty instead. It changes the metric of success so jurisdictions compete to improve lives, not just output.
      None of these are silver bullets. They require courage.

