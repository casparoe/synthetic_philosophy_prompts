answer: |-
  Okay, I appreciate that pivot. You're right to move past the "burning bush" scenario. If God appeared in the sky like a cosmic billboard, sure, that compromises autonomy. But your core claim here is what J.L. Schellenberg builds his whole case on: that a loving God would ensure that any person capable of a relationship with Him who *doesn't resist* it would be able to believe. You're arguing that the current level of ambiguity is a bug, not a feature.

  Here's where I think your argument is vulnerable, and I'm going to push back hard on three specific points.

  First, you're assuming that God's primary goal is *propositional belief*. You're treating belief like a puzzle where, if you're sincere, God should give you enough pieces to solve it. But most classical theists argue God is interested in *volitional trust*, not just intellectual assent. There's a significant difference between believing God exists because the evidence forced your hand—even subtly—and trusting God because you've weighed the ambiguity and chosen to commit. If God tips the scales too much, even slightly, you shift the burden from *trust* to *calculation*. Once it becomes a calculation, I can always ask for one more decimal point of evidence. Where does it stop?

  Second, you're making a huge assumption about the "sincere seeker." You say God leaves evidence exactly at the threshold where sincere people end up on the wrong side. How do we know they're actually non-resistant? This is the psychological opacity problem. A person might think they're open to God, but actually be open only to a God who fits their specific moral or lifestyle preferences. If God revealed Himself more clearly, He might reveal Himself as *Holy*—which is terrifying to a lot of people who think they want Him. C.S. Lewis talked about this; people often say they want God, but they don't want *that* God. Hiddenness might be a mercy that allows people to approach God on their own terms initially, rather than being overwhelmed by His actual nature before they're ready.

  Third, and this is the big one: You're assuming that more evidence equals better relationship. But look at the data. Does having high certainty correlate with moral growth or deeper spiritual life? Not necessarily. Sometimes, certainty breeds arrogance. Ambiguity breeds humility. If God is trying to cultivate a specific kind of character—one that seeks truth rather than just possessing it—then hiding Himself isn't neglect; it's pedagogical. It's the difference between giving a student the answer key and letting them work through the problem. The latter is more loving if the goal is maturity.

  So, my counter-question to you is this: If God gave you exactly the amount of evidence you're asking for, what guarantee do you have that you wouldn't just move the goalpost? And why do you assume that a world with less ambiguity would produce more love, rather than just more confident theologians?
