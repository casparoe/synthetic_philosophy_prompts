answer: |-
  You have hit on a genuinely profound instability at the heart of how we define illness, and while there isn't a single, catchy phrase like Gresham's Law that universally captures this two-way drift, philosophers of medicine have been grappling with exactly this tension for decades under the broader umbrellas of the naturalism versus normativism debate and the problem of boundary work in nosology. You are quite right to feel that medicalization is an incomplete label; it is primarily a sociological term describing the expansion of medical authority into non-medical spheres, often carrying a critical connotation of overreach, but it doesn't quite capture the conceptual fluidity you are describing where the ontological status of the condition itself seems to shift based on prevalence or treatability. The phenomenon you are observing is sometimes discussed as diagnostic creep or conceptual drift, but I think a more precise way to frame it philosophically is through the lens of Georges Canguilhem's work on the normal and the pathological, coupled with what is known in analytic philosophy of medicine as the reference class problem.

  Canguilhem, writing in the mid-twentieth century, argued that the distinction between health and disease is not a matter of objective biological fact but rather a normative judgment about an individual's capacity to adapt to their environment. When you describe a condition shifting from bad luck to disease because a treatment becomes available, you are touching on what some critics of biological naturalism call the therapeutic imperative. If we possess a technology to intervene, the condition becomes a candidate for medical management, and thus gets reclassified as a pathology because it is now something we have decided we ought to fix. This suggests that disease is not a static natural kind waiting to be discovered, but rather a functional category that expands to meet our technological capabilities. Conversely, when a condition becomes so prevalent, such as hypertension in the elderly, that it is reclassified as a risk factor or normal aging, you are encountering the limits of statistical naturalism. Christopher Boorse, who proposed the Biostatistical Theory of disease, defined health as species-typical functioning, but critics immediately pointed out that if a dysfunction becomes statistically typical due to environmental changes or longevity, Boorse's definition struggles to classify it as a disease without arbitrary adjustments to the reference class. When doctors stop calling high blood pressure in octogenarians a disease and start calling it a risk factor, they are effectively admitting that the condition is no longer a deviation from the norm of that specific population, even if the underlying biology is identical to what was seen in younger patients decades ago.

  This two-way drift bears heavily on the question of whether disease concepts are natural or constructed, and frankly, it serves as strong evidence against strong naturalism. If disease were purely a natural kind, like gold or water, its classification would not fluctuate based on our ability to synthesize a drug or the demographic shift of the population. The fact that the label changes while the biology remains constant suggests that the concept of disease is inherently normative, meaning it is tied to human values, interests, and capacities. It implies that calling something a disease is not just a statement about what is happening in the body, but a statement about our relationship to what is happening in the body. We classify something as a disease when it causes harm that we believe we can and should mitigate, and we retreat from that classification when the condition becomes ubiquitous enough that treating it feels futile or when the cost of intervention outweighs the perceived deviation from normality. This doesn't mean the biology is irrelevant, but it does mean that the biology alone is insufficient to determine disease status.

  So, if I were to propose a name for this specific pattern of two-way drift, I might call it pragmatic nosological instability, highlighting that the classification system is driven by practical utility rather than essentialist truth. It shows that the boundary between health and disease is not a line drawn in the sand of biology, but a moving horizon that shifts as we move toward it. This view aligns closely with what is known as the hybrid view or harmful dysfunction analysis proposed by Jerome Wakefield, which attempts to bridge the gap by saying a condition must be both a biological dysfunction and harmful according to social values. However, even Wakefield's model struggles with your second example, because if half the population has the dysfunction, is it still a dysfunction of design, or just a feature of the design wearing out? The drift you noticed suggests that medicine is less like a map of a fixed territory and more like a negotiation between what our bodies do, what we want them to do, and what we can actually make them do. Ultimately, this pattern reveals that disease is a tool we use to organize our suffering and our interventions, rather than a fundamental category of the universe, and acknowledging this doesn't diminish the reality of the suffering involved, but it does clarify why the definitions will always remain somewhat fluid as long as human technology and demographics continue to change.
