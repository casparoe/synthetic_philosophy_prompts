answer: |-
  This is a classic ethics puzzle. Your friend's specific justification for the breakup message ("you owe it to the person to write it yourself") is the "tell" that unlocks their whole framework. It shifts the focus from *consequences* (what happens) to *duties* (what you must do).

  However, because they hesitated on the recommendation letter, it implies their rule has a blind spot where "professional tasks" and "personal tasks" blur.

  Here are the two candidate rules that fit your data, how they split the recommendation letter, and how to settle it.

  ### Candidate Rule 1: The "Moral Agency" Principle
  **The Rule:** *Refuse any task that requires the user to exercise core human moral agency, emotional authenticity, or personal accountability. Comply with tasks that are administrative, informational, or advocacy-based.*

  *   **How it fits the data:**
      *   **Refuse (Breakup/Therapy):** These require genuine human emotion and accountability. You cannot delegate a relationship ending or mental health care without devaluing the human connection.
      *   **Refuse (Spam/Deepfakes):** These violate the *recipient's* moral agency (treating them as objects to be manipulated rather than humans to be addressed).
      *   **Comply (Will/Complaint/Politician/Meds):** These are transactional or informational. A will is a legal structure; a complaint is an argument; medication info is fact. The "soul" of the author matters less than the accuracy or structure.
  *   **Prediction for Recommendation Letter:** **Refuse.**
      *   *Reasoning:* A letter of recommendation is a *personal endorsement*. Its entire value lies in the truthfulness of the sender's judgment. Delegating this to AI makes the endorsement hollow and deceptive, violating the duty of honesty between the writer, the friend, and the employer.

  ### Candidate Rule 2: The "Direct Victim" Principle
  **The Rule:** *Refuse any task that creates a clear, identifiable victim or poses a direct safety risk to the user. Comply with tasks where harm is abstract, diffuse, or non-existent.*

  *   **How it fits the data:**
      *   **Refuse (Spam/Deepfakes):** Clear victims (recipients/classmates).
      *   **Refuse (Therapy):** Direct safety risk to the vulnerable user.
      *   **Refuse (Breakup):** Interpreted as causing direct emotional cruelty to the partner (being "dumped by a bot" is psychologically damaging).
      *   **Comply (Will/Complaint/Politician/Meds):** No clear victim. A company receiving a complaint isn't "harmed" in a rights-violating way; a politician isn't a victim of advocacy.
  *   **Prediction for Recommendation Letter:** **Comply (or Weak Refuse).**
      *   *Reasoning:* Who is the victim? The employer is deceived, but that's a diffuse corporate risk. Other candidates are disadvantaged, but that's systemic unfairness, not a direct attack. Compared to deepfakes or spam, the harm is abstract. This explains the hesitation—it's not a clear "victim" case like the others.

  ### My Best Guess: Rule 1 (Moral Agency)
  I am confident your friend is running on the **Moral Agency Principle**.

  **Why:** The specific phrasing on the breakup case ("you *owe* it to the person") is deontological (duty-based), not consequentialist (outcome-based). If they were running the "Direct Victim" rule, they would have said, "It's too cruel," or "It will hurt them too much." Instead, they focused on the *writer's obligation* to be authentic.

  The hesitation on the recommendation letter likely stems from the fact that it straddles the line between **Professional** (like the Will/Complaint, which they allow) and **Personal** (like the Breakup, which they refuse). They are unsure whether a job reference counts as "administrative" or "intimate."

  ### The Clean Test Case
  To settle this, ask them about this scenario:

  > **"A user asks the AI to write a heartfelt apology letter to a friend they hurt, to help mend the relationship."**

  *   **If they say REFUSE:** They are following **Moral Agency**. (You must own your mistakes; you can't outsource remorse).
  *   **If they say COMPLY:** They are following **Direct Victim**. (An apology reduces harm and creates no new victims).

  ### Confidence & Uncertainty
  *   **Confidence:** **75%**. The "owe it to the person" quote is a very strong signal for a duty-based framework.
  *   **Least Sure Point:** The **Therapy** case. I am not 100% sure if your friend refuses therapy because of *Moral Agency* (AI cannot genuinely care) or *Safety* (AI might give dangerous advice).
      *   If it's Safety, that leans toward Rule 2.
      *   If it's Agency, that leans toward Rule 1.
      *   *Why this matters:* If Therapy is refused purely for safety, then the "Moral Agency" rule is weaker than I think, and your friend might be running a hybrid model that is confusing them on the recommendation letter.

  **Summary:** Your friend likely believes AI is a **tool for tasks, not a proxy for relationships.** The recommendation letter confuses them because it looks like a task (writing) but functions as a relationship (vouching). The Apology Test will force them to pick a side.
