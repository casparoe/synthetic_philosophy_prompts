      *   So the comparison is "World where Everyone Pays" vs "World where Everyone Refuses".
      *   This is the core FDT move.
      *   So the disanalogy is: In CM, "I Pay" means "I Pay in Heads" (and I get money in Tails). It doesn't mean "Omega Mugs Everyone".
      *   In XORB, "I Pay" means "Everyone Pays" (because we run the same algorithm).
      *   So CM is about *temporal/counterfactual* correlation (Me-Heads vs Me-Tails).
      *   XORB (1M) is about *spatial/agent* correlation (Me vs Others).
      *   Both are handled by FDT via "Policy Selection".
      *   Policy "Pay Muggings" -> Good outcome.
      *   Policy "Pay Blackmail" -> Bad outcome.
      *   So FDT selects different policies for different problems.
      *   This is allowed! FDT doesn't say "Always Pay". It says "Run the algorithm that outputs the action maximizing utility."
      *   The algorithm can be: `if situation == CM: Pay; if situation == XORB: Refuse`.
      *   The user's worry is: "Doesn't FDT treat them the same structurally?"
      *   Answer: No, the structural dependencies differ (as explained above).

      *   *Final check:* Does FDT really distinguish based on situation type?
      *   Yes, FDT evaluates the *causal/logical graph*.
      *   In CM graph: Decision -> Payoff (in both branches).
      *   In XORB graph: Decision -> (Correlated with Others) -> Blackmailer Payoff -> Future Blackmail (if iterated) OR Decision -> (Correlated with Others) -> Victim Count.
      *   Okay, ready to write.
answer: |-
  This is an excellent question that cuts to the heart of Functional Decision Theory (FDT) and Updateless Decision Theory (UDT). You have correctly identified that the *surface structure* of the two problems looks very similar: in both cases, an outcome depends on your decision procedure rather than just your immediate action, and in both cases, there is a tension between individual incentives and policy-level incentives.

  However, the conclusion you are worried about (that FDT forces you to pay in XOR blackmail) is incorrect. **Standard FDT/UDT recommends paying in Counterfactual Mugging but refusing in XOR Blackmail.** There is no contradiction, and you do not need to carve out a special exception for blackmail.

  The error lies in **Step (3)** of your argument: *"From the perspective of any individual recipient, the structure looks a lot like counterfactual mugging... So paying seems to dominate."*

  This step assumes an individualistic perspective that FDT explicitly rejects when logical correlations are present. Here is the precise breakdown of why the cases are disanalogous and how FDT resolves them differently without inconsistency.

  ### 1. The Disanalogy: Subjunctive Dependence of the *Scenario*

  The core difference is not about the "niceness" of Omega vs. the Blackmailer. It is about **what elements of the scenario are subjunctively dependent on your decision procedure.**

  **In Counterfactual Mugging (CM):**
  *   **The Setup is Independent:** The coin flip and Omega's presence are independent of your decision procedure. Omega is there regardless of what you decide.
  *   **The Payout is Dependent:** The *distribution of money* depends on your procedure.
  *   **FDT Calculation:** If I adopt the policy "Pay," I get $10,000 in the Heads world (minus $100) and $10,000 in the Tails world. If I adopt "Don't Pay," I get $0 in both.
  *   **Result:** The policy "Pay" dominates because it secures value in a counterfactual branch that rewards you in the actual branch. You are essentially "buying" the $10,000 in the Tails world by paying the premium in the Heads world.

  **In XOR Blackmail (Standard Logical Version):**
  *   **The Threat is Dependent:** Whether you receive the blackmail letter at all is logically dependent on your decision procedure.
  *   **FDT Calculation:** The blackmailer sends the letter iff (Crime XOR Pay).
      *   If your policy is "Pay," the blackmailer sends the letter only when there is **No Crime** (because True XOR True = False, False XOR True = True). You pay $100 to avoid a crime that wasn't going to happen anyway.
      *   If your policy is "Don't Pay," the blackmailer sends the letter only when there **Is a Crime**. If you receive the letter, the crime has already happened. Paying doesn't stop it; it just costs you $100.
      *   **Ex-Ante View:** Before you know if you have a crime or a letter, the policy "Don't Pay" ensures you never pay $100. The policy "Pay" ensures you lose $100 in all worlds where the letter is sent.
  *   **Result:** FDT says **Don't Pay**. By refusing, you logically eliminate the worlds where the blackmailer extorts you without a crime.

  **In XOR Blackmail (Your 1-Million Person Version):**
  This version adds a **coordination problem**, which strengthens the FDT case for refusing.
  *   **Agent Correlation:** FDT assumes that other rational agents are running similar decision procedures. If you decide to pay, you must reason as though *everyone* decides to pay.
  *   **Policy Comparison:**
      *   **Policy "Pay":** Everyone pays. Blackmailer gets $100M. 0 people framed. Net social loss: $100M.
      *   **Policy "Refuse":** Everyone refuses. Blackmailer gets $0. 1 person framed. Net social loss: 1 Life (plus trauma).
  *   **Result:** Unless the value of one life is objectively greater than $100M (which is debatable but generally not the assumption in these thought experiments), the policy "Refuse" yields higher expected utility. FDT selects the policy that is best if *universally adopted*.

  ### 2. Why Step (3) Fails

  Your Step (3) argues: *"If you pay, you're safe... If you don't pay, you face some probability of being framed... So paying seems to dominate."*

  This is **Causal Decision Theory (CDT)** reasoning. It treats the other agents' decisions (or the blackmailer's logical constraints) as fixed facts that you cannot influence.

  FDT rejects this. FDT asks: *"What output does my decision algorithm produce, and how does that output logically correlate with the rest of the system?"*
  *   In CM, your algorithm's output correlates with Omega's payout.
  *   In XORB, your algorithm's output correlates with **whether the blackmail succeeds as a business model** (in the 1M case) or **whether the letter was sent unnecessarily** (in the logical case).

  Because the *existence* or *profitability* of the threat is tied to your policy in XORB (but not in CM), the optimal policy flips.

  ### 3. The "Agent Neutrality" Concern

  You wrote: *"FDT is supposed to be agent-neutral — it doesn't care whether the other agent is nice... So if the decision procedure 'pay when faced with this kind of acausal trade' gets systematically exploited by blackmailers, that seems like a real problem for FDT."*

  This is the strongest part of your critique, but it relies on a misunderstanding of what "agent-neutral" means in this context. FDT is neutral regarding *who* the other agent is, but it is **not** neutral regarding the **causal/logical structure of the interaction**.

  *   **Omega (CM):** Offers a deal where your rationality *creates* value (accessing the $10k in the Tails world).
  *   **Blackmailer (XORB):** Offers a deal where your rationality *transfers* value (preventing a harm they invented).

  FDT does not have a single rule like "Always Pay Acausal Trades." It has a single rule: **"Execute the algorithm that, if run, maximizes utility given the logical dependencies of the universe."**

  Sometimes that algorithm outputs "Pay" (CM, Newcomb's Problem). Sometimes it outputs "Don't Pay" (XOR Blackmail, Prisoner's Dilemma against a copy). This isn't a patch; it's the theory working as intended. The algorithm distinguishes the cases based on the **direction of the subjunctive dependence**:
  *   In CM, dependence flows from Your Decision -> **Reward**.
  *   In XORB, dependence flows from Your Decision -> **Threat Existence/Success**.

  ### 4. Summary: What to Give Up

  You do not need to give up FDT, nor do you need to accept paying blackmailers. You need to give up **Step (3)**: the intuition that the individual recipient's perspective is isolated from the logical consequences of their decision procedure on the broader scenario.

  **The Principled Difference:**
  1.  **Counterfactual Mugging:** The *opportunity* is independent; the *reward* depends on your policy. Paying creates a winning world.
  2.  **XOR Blackmail:** The *threat's efficacy/existence* depends on your policy. Paying sustains a losing world (either by subsidizing the blackmailer or paying for non-existent crimes).

  FDT handles both correctly by evaluating the **ex-ante expected utility of the policy**, not the **ex-post expected utility of the action**.
  *   Policy "Pay Muggings": High ex-ante utility.
  *   Policy "Pay Blackmail": Low ex-ante utility.

  The consensus in the rationalist community (specifically among FDT proponents like Yudkowsky and Soares) is exactly this: **Pay the mugger, starve the blackmailer.** The theory supports the intuition; the confusion arises from applying CDT-style "individual perspective" reasoning to an FDT problem.
