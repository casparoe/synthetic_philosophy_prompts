      *   **(b) Multi-Level Selection (MLS) / Price Equation (Sober/Wilson):** MLS is the right *formal framework*. Partitioning selection into within/between components.
      *   **(c) Species Selection (Eldredge/Gould):** Species are real units of selection (macroevolution), not just byproducts. Emergent traits affect speciation/extinction.
      *   **(d) Major Transitions (Maynard Smith/Szathmáry):** Levels shift over time. Lower levels combine to form higher-level units of selection.
      *   **(e) Human Social Behavior:** Group selection is mostly wrong for humans; Kin Selection/Reciprocal Altruism suffice. Group selection is "sloppy."

  3.  **Initial Assessment & Mapping Tensions:**

