      *Decision:* The cheapest revision is to nuance (a). Move from "Genes are the *only* fundamental units" to "Genes are the primary *replicators*, but selection acts on *interactors* at multiple levels." This preserves the utility of the gene's eye view for adaptation while making room for (c) and (d).

  7.  **Refining the Tone:**
