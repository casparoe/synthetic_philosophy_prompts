      *   *(a) vs. (c):* Gene's eye view usually treats species selection as weak or derivative. If genes are the *only* fundamental replicators, can species be "real" units? Gould argued yes; Dawkins argued no (species aren't replicators). *High tension.*
      *   *(a) vs. (d):* Major Transitions implies higher levels become *independent* units of selection. Gene's eye view says genes are *always* the fundamental unit, even if vehicles change. *Moderate tension:* Is the higher level a new replicator or just a better vehicle?
      *   *(b) vs. (e):* Sober/Wilson (MLS) often argue *for* group selection in humans. The user accepts MLS formalism (b) but rejects group selection explanations for humans (e). *Potential tension:* If the math allows it, why rule it out empirically? Or is this just an empirical claim?
