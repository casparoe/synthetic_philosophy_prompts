answer: |-
  The debate has stalled because it is fundamentally a methodological and epistemological clash disguised as a technical economic dispute, meaning the participants are operating within incommensurable paradigms rather than arguing over shared facts.

  Your intuition that this is an epistemological disagreement dressed up as economics is correct, but it is compounded by a deeper methodological divergence regarding what an economy *is*. The Langeans operate within a neoclassical equilibrium framework where the economy is a static allocation problem: given preferences and technology, how do we solve for the optimal distribution of resources? In this view, prices are shadow values that can theoretically be computed by a central agent if it has sufficient data and processing power. The Austrians, particularly Hayek, operate within a process framework where the economy is a dynamic discovery procedure: preferences and technologies are not given but are created and revealed through the act of exchange itself. When Lange argues that a central board can simulate prices via trial and error, he is solving a math problem; when Hayek argues that only real entrepreneurs can discover prices, he is describing a learning process. You cannot refute a process claim with an equilibrium model, which is why the two sides talk past each other.

  This methodological split drives the epistemological divide you identified. For the market socialist, knowledge is ultimately codifiable data—preferences, resource constraints, and production functions that can be input into an algorithm, whether human bureaucrats or modern AI. For the Austrian, crucial economic knowledge is tacit, contextual, and dispersed; it exists only in the minds of actors at specific times and places and is often unknowable until acted upon. If knowledge is created through action rather than merely transmitted, no central algorithm can approximate it because the data does not exist until the market process generates it. This makes the disagreement about the ontology of information itself, not just its transmission.

  There is also a significant verbal dispute layered on top of this. When Mises says "calculation," he means rational decision-making based on genuine exchange ratios derived from private property conflicts. When Lange says "calculation," he means solving a system of equations to clear markets. They are using the same word to describe fundamentally different phenomena. Similarly, "price" to an Austrian is a signal emerging from property rights and profit-and-loss risk, whereas to a Langean, it is an accounting tool for rationing scarcity. Until both sides agree on definitions, empirical evidence regarding computational speed or historical growth rates will remain interpretable through either lens.

  Normative values also play a submerged role. Even if one concedes that market socialism could theoretically approximate efficiency, the Austrian position often bundles the calculation argument with a defense of liberty and private property as intrinsic goods. Conversely, market socialists are often motivated by egalitarian outcomes that they believe justify the risk of computational inefficiency. These priors determine how much evidence each side requires to change their mind; a Hayekian requires proof that tacit knowledge can be codified (which they believe is impossible by definition), while a Langean requires proof that central computation is permanently inferior to distributed markets (which they believe is an engineering challenge, not a logical impossibility).

  Regarding whether the debate can move: it is unlikely to be "resolved" in the sense of one side conceding defeat, because the disagreement is philosophical rather than purely scientific. However, the terrain has shifted from pure calculation to mechanism design and incentive compatibility. The Public Choice critique (Buchanan, Tullock) moved the debate from "can they calculate?" to "will they calculate correctly given incentives?" This is a more fertile ground because it deals with observable human behavior rather than abstract epistemology. Additionally, the rise of Big Data and AI has revived the technical argument, forcing Austrians to refine why algorithmic prediction differs from entrepreneurial judgment. Progress will come not from proving one side right, but from narrowing the scope of the disagreement to specific institutional mechanisms where empirical testing is possible, while acknowledging that the core philosophical divide regarding the nature of knowledge will likely remain permanent.
