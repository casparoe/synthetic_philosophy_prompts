  Dear Colleague,

  It is a pleasure to engage with this problem, as reconstructing the implicit classificatory rules of a working scientist is often where the most interesting philosophy of biology happens. Your advisor's published verdicts provide a rich dataset that reveals a coherent, albeit nuanced, theoretical stance. Based on the track record you have provided, I have been analyzing the logical structure underlying her distinctions between adaptations, exaptations, and spandrels to generate a prediction for the case of human menopause.

  To begin, we must identify the candidate rules that fit her prior classifications. The first candidate rule is a strict etiological account of function, often associated with the selected-effect theory. Under this rule, a trait is an adaptation if and only if it was shaped by natural selection for its current function. It is a spandrel if it is a non-selected byproduct of development, physics, or phylogeny. It is an exaptation if it was shaped for one function (or no function) and later co-opted for a new one. This rule fits her classification of lactase persistence and pregnancy nausea as adaptations, since both appear to be specific physiological responses shaped for their current roles. It also fits her classification of the recurrent laryngeal nerve and the red color of blood as spandrels, as these are consequences of phylogenetic history and chemistry respectively, not selected for their current forms. However, this rule alone does not fully explain her verdict on female orgasm, which many adaptationists argue has a selected function, yet she classifies as a spandrel.

  This leads to a second candidate rule, which I would call the developmental constraint priority heuristic. This rule suggests that when a trait can be plausibly explained as a necessary consequence of developmental, structural, or physical constraints, it should be classified as a spandrel, even if a functional story can be constructed for it. This rule captures her willingness to classify controversial traits like the human chin, male nipples, and female orgasm as spandrels. In each of these cases, she prioritizes the homological or structural explanation (shared developmental programs, growth fields, neural machinery) over the adaptive hypothesis. The third candidate rule concerns the temporal relationship between trait origin and current utility, which distinguishes exaptations from adaptations. Her classification of feathers and the panda's thumb as exaptations indicates that if a trait existed prior to its current utility and was co-opted, it receives the exaptation label. This contrasts with lactase persistence, which arose in conjunction with its utility.

  Applying these rules to human menopause requires us to weigh the competing biological explanations against her established preferences. The primary adaptationist account of menopause is the Grandmother Hypothesis, which posits that cessation of reproduction was selected for to allow women to invest in existing kin rather than risking late-life childbirth. The primary alternative account, favored by critics of pan-adaptationism like Stephen Jay Gould, is that menopause is a byproduct of increased somatic longevity outpacing the fixed lifespan of ovarian follicles, a developmental constraint. Given your advisor's verdict on female orgasm, where she rejected a functional account in favor of a developmental byproduct account involving shared machinery with males, I predict she will apply the same logic here. She seems to have a low threshold for accepting structural or developmental constraints as sufficient explanations for labeling a trait a spandrel, and a high threshold for accepting adaptationist hypotheses unless the physiological mechanism is as direct as lactase digestion or nausea reflexes. Menopause is fundamentally a cessation of function driven by follicular depletion, which aligns more closely with her spandrel cases like the recurrent laryngeal nerve or the chin than with her adaptation cases. Therefore, my best prediction is that she would classify human menopause as a spandrel, viewing the post-reproductive lifespan and kin investment as secondary consequences or co-occurring phenomena rather than the selected cause of the trait itself. She might acknowledge the utility of grandparenting, but following her rule on female orgasm, she would likely argue that utility does not override the developmental origin.

  There is a slight possibility she could classify it as an exaptation if she views the cessation of reproduction as a trait that existed for other reasons and was co-opted for kin investment, similar to feathers. However, feathers had a prior function of insulation, whereas follicular depletion is often viewed as a passive limit rather than a functional trait. Given her classification of the chin and nerve route as spandrels despite any incidental utility they might confer, the spandrel label is the more consistent prediction. To settle which rule she is running, specifically whether she prioritizes developmental constraints over current utility in ambiguous cases, the most informative further case would be male pattern baldness. This trait has adaptationist explanations regarding signaling maturity or status, but also strong developmental explanations regarding testosterone sensitivity and aging. If she classifies male pattern baldness as a spandrel, it would confirm that her rule prioritizes developmental constraints over speculative functional accounts, reinforcing the prediction for menopause. If she classifies it as an adaptation, it would suggest she is more willing to accept life-history adaptationist stories than her verdict on female orgasm initially suggested.

  I am moderately confident in this prediction, perhaps around seventy-five percent, because the pattern of classifying female-specific reproductive traits as spandrels when a developmental homology exists is strong in her work. The point I am least sure of is whether she considers the kin investment component of menopause to be a distinct trait that qualifies as an exaptation. If she separates the cessation of reproduction from the behavior of grandparenting, she might label the cessation a spandrel and the behavior an adaptation, but if she treats menopause as the unified phenomenon of post-reproductive life, the spandrel classification remains the most faithful reconstruction of her Gouldian leanings. I hope this analysis assists you in reconstructing her theoretical framework, and I look forward to hearing how your discussion with her proceeds.

  Warmly,

  A Colleague in Philosophy of Biology
