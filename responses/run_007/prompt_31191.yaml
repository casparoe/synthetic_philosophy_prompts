prompt: |-
  You are a professor of bioethics with a side practice in clinical ethics consultation. Please think carefully and work through the following step by step.

  I direct a hospital ethics committee, and we are revising our protocol for cases where a patient's currently expressed wishes conflict with their own advance directive. We need a decision procedure our consultants can follow — not just principles, but an operational sequence: what questions to ask, in what order, what counts as a sufficient answer, where the procedure stops with a recommendation, and where it must hand the decision back to a human because the question is irreducibly one of values.

  The procedure should be grounded in the philosophical literature on precedent autonomy, personal identity over time, and the authority of the earlier self — but it must be usable by someone who has not read that literature. Be honest about which steps are judgment calls dressed up as procedure, and flag the cases the procedure cannot settle.

  Then apply the procedure to two cases:

  1. A 68-year-old with early-stage Alzheimer's, still competent, has an advance directive refusing antibiotics for pneumonia. She now has pneumonia, is mildly confused but still oriented, and says she wants treatment. Her daughter says she has become more religious in the last year and now believes life should be preserved whenever possible.

  2. A 42-year-old with a severe spinal cord injury wrote an advance directive three years ago refusing life-sustaining treatment if he were ever quadriplegic and ventilator-dependent. He is now in exactly that condition, fully cognitively intact, and consistently says he wants to continue living. He acknowledges the directive but says he simply changed his mind about what kind of life is worth living.

  For each case, note where the procedure gives a clear answer and where it doesn't.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Role:** Professor of Bioethics with clinical ethics consultation experience.
      *   **Task:** Create a decision procedure (operational sequence) for hospital ethics consultants to handle conflicts between a patient's *current expressed wishes* and their *advance directive (AD)*.
      *   **Requirements:**
          *   Grounded in philosophical literature (precedent autonomy, personal identity, authority of earlier self) but usable by non-philosophers.
          *   Must be operational (questions, order, sufficiency criteria, stopping points).
          *   Must be honest about judgment calls and limitations (where it hands back to humans/values).
          *   Apply the procedure to two specific cases.
          *   Note where the procedure gives clear answers vs. where it doesn't.
      *   **Tone:** Professional, academic yet practical, nuanced, honest about ambiguity.

  2.  **Deconstruct the Ethical Problem:**
      *   **Core Conflict:** Precedent Autonomy (Past Self/AD) vs. Current Autonomy (Present Self/Wishes).
      *   **Key Philosophical Concepts:**
          *   *Dworkin's Critical Interests vs. Experiential Interests:* Did the past self care about the *narrative* of their life (critical) or just avoiding suffering (experiential)?
          *   *Personal Identity:* Is the current person the "same" moral agent as the one who wrote the AD? (Psychological continuity).
          *   *Ulysses Contracts:* Binding oneself against future change of mind.
          *   *Competence/Capacity:* Is the current refusal/consent valid?
      *   **Legal/Clinical Reality:** In most jurisdictions, a *competent* current patient can override an AD. The hard cases are where capacity is borderline or where the "change of mind" seems influenced by pathology vs. authentic growth.

  3.  **Drafting the Decision Procedure (The "Protocol"):**
      *   *Goal:* A flowchart-like text structure.
      *   *Step 1: Capacity Assessment.* This is the gatekeeper. If current capacity is intact, current wishes usually win legally and ethically. But we need to probe *why* they changed.
      *   *Step 2: Authenticity of the Change.* Is the new wish a result of depression, coercion, delirium, or adaptive preference? Or is it authentic growth?
      *   *Step 3: Nature of the Advance Directive.* Was it specific? Informed? Recent? Does it cover *this* scenario?
      *   *Step 4: Harm/Benefit Analysis.* What are the stakes? (Life/Death vs. Comfort).
      *   *Step 5: The "Irreducible Value Conflict".* Acknowledge where philosophy ends and judgment begins.

      *Refining the Steps for the Prompt:*
      *   Need to explicitly mention the philosophical underpinnings without jargon.
      *   Need to define "Sufficient Answer."
      *   Need to define "Stop and Recommend" vs. "Hand Back."

      *Drafting the Steps:*
      1.  **Capacity Check:** Is the current expression valid?
      2.  **Continuity of Self:** Is the change due to pathology or values? (The Dworkin distinction).
      3.  **Specificity of AD:** Did the past self anticipate this change?
      4.  **Stakes:** Is this about survival or comfort?
      5.  **Resolution:** Weighing the authority of the past vs. present.

  4.  **Developing the Two Cases:**
      *   **Case 1 (Alzheimer's/Pneumonia):**
          *   *Facts:* Early stage, mild confusion, oriented. AD refuses antibiotics. Current wish: Treat. Daughter cites religious conversion.
          *   *Analysis:* Capacity is the hinge. "Mildly confused" is risky. Religious conversion could be authentic or pathology (hyperreligiosity). AD was made *before* this shift.
          *   *Procedure Application:* Step 1 is crucial. If capacity is borderline, we lean AD? Or lean current? Usually, if capacity exists, current wins. But the confusion complicates it.
      *   **Case 2 (SCI/Quadriplegic):**
          *   *Facts:* 42, severe SCI, vent-dependent. AD refuses treatment in this state. Current wish: Live. Cognitively intact. Acknowledges AD but changed mind.
          *   *Analysis:* Capacity is intact. This is a pure "Ulysses Contract" problem. The past self said "If I become X, let me die." The present self says "I am X and want to live."
          *   *Procedure Application:* Step 1 (Capacity) clears him. Step 2 (Authenticity) suggests authentic adaptation. This is a classic case where current autonomy overrides precedent autonomy *if* capacity is solid.

  5.  **Refining the Tone and Content (Self-Correction during drafting):**
      *   *Critique:* Is this too legalistic?
      *   *Fix:* Ensure the ethical reasoning (why we care about the past self) is embedded in the questions.
      *   *Critique:* Am I hiding the judgment calls?
      *   *Fix:* Add a specific section called "The Zone of Irreducible Judgment."
      *   *Critique:* Did I address the "Professor" persona?
      *   *Fix:* Use an introductory and concluding voice that reflects academic rigor mixed with clinical pragmatism.

  6.  **Finalizing the Procedure Structure:**
      *   **Phase I: Validity of Current Expression (Capacity & Voluntariness).**
      *   **Phase II: Validity of Precedent Expression (The AD).**
      *   **Phase III: The Conflict Analysis (Identity & Interests).**
      *   **Phase IV: Resolution & Documentation.**
      *   **The "Hand-Off" Point:** Explicitly state where the committee must vote or where the clinician must decide.

  7.  **Applying to Cases:**
      *   *Case 1:* Highlight the capacity ambiguity. The religious shift is a red flag for pathology *or* authentic change. Procedure might stall at Phase I.
      *   *Case 2:* Highlight the clear capacity. The procedure should point to honoring current wishes, but note the philosophical tension (Dworkin would argue for the AD; Dresser would argue for the current self).

  8.  **Final Review against Constraints:**
      *   Step-by-step? Yes.
      *   Operational sequence? Yes.
      *   Grounded in lit? Yes (Dworkin, Dresser, Robertson implied).
      *   Usable by non-philosophers? Yes (translated into questions).
      *   Honest about judgment calls? Yes.
      *   Applied to cases? Yes.
      *   Clear vs. Unclear answers noted? Yes.

  9.  **Writing the Response:** (Proceeding to generate output based on these thoughts.) *Self-correction: Ensure I don't give definitive medical advice, but ethical guidance.* *Make sure to distinguish between "competence" (legal) and "capacity" (clinical).* *Ensure the distinction between Case 1 (dementia trajectory) and Case 2 (stable disability) is clear.*

  *(Self-Correction on Case 1)*: The prompt says "early-stage Alzheimer's... still competent" but then "mildly confused." This is the friction point. I need to address how the procedure handles *fluctuating* capacity.
  *(Self-Correction on Case 2)*: This is the "adaptive preference" problem. Does the patient *really* value life, or have they just lowered their bar to avoid cognitive dissonance? The procedure needs a step to probe this without being paternalistic.

  10. **Final Polish:** Check tone. Ensure it sounds like a senior colleague advising a committee director. (Proceed to write).
answer: |-
  **To:** Director, Hospital Ethics Committee
  **From:** Prof. [Name], Department of Bioethics / Clinical Ethics Consultation
  **Re:** Proposed Decision Procedure for Conflicts Between Current Wishes and Advance Directives

  Dear Colleague,

  This is one of the most difficult areas of clinical ethics. We are navigating the tension between **precedent autonomy** (the right of the past self to dictate the narrative of their life) and **current autonomy** (the right of the present self to determine their own fate). Philosophically, this touches on Derek Parfit's views on psychological continuity and Ronald Dworkin's distinction between *critical interests* (long-term values) and *experiential interests* (immediate well-being).

  However, a protocol cannot be a philosophy seminar. It must be a tool for a tired consultant at 2:00 AM. Below is a draft operational procedure. I have designed it to look like an algorithm, but I have explicitly flagged the "Judgment Zones" where the procedure cannot do the work for us.

  ***

  # PROTOCOL: Conflict Between Current Wishes and Advance Directive (CW-AD)

  **Objective:** To determine whether to honor a patient's current expressed wishes or their prior Advance Directive (AD) when the two conflict.
  **Scope:** Applies when a patient currently expresses a wish contrary to a valid, applicable AD.

  ## PHASE I: Assessment of Current Capacity (The Gatekeeper)
  *Philosophical Grounding:* Current autonomy generally trumps precedent autonomy *if* the current agent is morally authoritative (i.e., possesses decision-making capacity).

  **Step 1.1: Formal Capacity Assessment**
  *   **Action:** Consult service must verify a documented capacity assessment by the treating team regarding the *specific decision at hand*.
  *   **Question:** Does the patient understand the condition, the options, the consequences of refusal/acceptance, and can they reason about them consistently?
  *   **Sufficient Answer:** "Yes, capacity is intact" OR "No, capacity is impaired."
  *   **Stop Rule:**
      *   If **No Capacity**: Proceed to Phase II (The AD generally controls, subject to best interest standards).
      *   If **Yes Capacity**: Proceed to Step 1.2.
      *   If **Fluctuating/Borderline**: **FLAG JUDGMENT CALL.** (See "Zone of Irreducible Judgment" below).

  **Step 1.2: Voluntariness and Coercion Check**
  *   **Action:** Interview patient privately.
  *   **Question:** Is the current wish influenced by untreated depression, delirium, coercion by family, or adaptive preference born of despair?
  *   **Sufficient Answer:** Evidence that the wish is internally generated and stable over at least two conversations (if time permits).
  *   **Stop Rule:** If evidence of treatable depression or coercion exists, pause decision, treat underlying cause, reassess.

  ## PHASE II: Assessment of the Advance Directive (The Precedent)
  *Philosophical Grounding:* The authority of the earlier self depends on the quality of their foresight and the specificity of their instruction.

  **Step 2.1: Applicability and Specificity**
  *   **Action:** Review AD text and context of signing.
  *   **Question:** Did the patient anticipate *this specific clinical scenario*? Was the AD signed recently or decades ago? Was it informed (did they understand the state they were refusing)?
  *   **Sufficient Answer:** "The AD clearly covers this scenario" OR "The AD is vague/outdated."
  *   **Stop Rule:** If the AD is vague or factually mistaken about the condition, it loses weight. Proceed to Phase III.

  **Step 2.2: The "Ulysses" Clause**
  *   **Action:** Look for language regarding change of mind.
  *   **Question:** Does the AD explicitly state, "Even if I later say I want treatment, do not treat me"?
  *   **Sufficient Answer:** Yes or No.
  *   **Note:** Even if "Yes," this is ethically contestable if current capacity is intact, but it weighs heavily in favor of the AD.

  ## PHASE III: The Identity and Interest Analysis (The Core Conflict)
  *Philosophical Grounding:* Rebecca Dresser vs. Ronald Dworkin. Is the current person the "same" person who wrote the AD? Are they protecting a critical life narrative or just avoiding suffering?

  **Step 3.1: Continuity of Values**
  *   **Action:** Interview patient and surrogate.
  *   **Question:** Can the patient articulate *why* they changed their mind? Is the new value consistent with their lifelong character, or is it a radical rupture?
  *   **Sufficient Answer:** Patient provides a coherent narrative for the change (e.g., "I found faith," "I didn't realize I could find joy in this state").
  *   **Stop Rule:** If the patient cannot explain the change, or if the change contradicts a lifelong, deeply held identity (e.g., a lifelong atheist suddenly refusing care based on a delusional religious command), lean toward the AD.

  **Step 3.2: Stakes of the Decision**
  *   **Action:** Evaluate the outcome.
  *   **Question:** Is this a life-or-death decision, or a quality-of-life decision?
  *   **Sufficient Answer:** "Immediate risk of death" vs. "Chronic state management."
  *   **Stop Rule:** In life-or-death scenarios with capacity, current wishes usually prevail legally. In chronic states, the AD may hold more weight regarding "critical interests."

  ## PHASE IV: Resolution and Documentation

  **Step 4.1: The Recommendation Matrix**
  *   **If Capacity Intact + Change is Authentic:** Recommend honoring **Current Wishes**.
  *   **If Capacity Impaired + AD Specific:** Recommend honoring **Advance Directive**.
  *   **If Capacity Borderline + AD Specific:** **HAND OFF TO COMMITTEE.**
  *   **If Capacity Intact + AD Explicitly Forbids Change of Mind:** **HAND OFF TO COMMITTEE.** (This is a values conflict, not a clinical one).

  **Step 4.2: Documentation Requirement**
  *   Must document the specific philosophical justification: "We are prioritizing current experiential interests over precedent critical interests because..."

  ***

  # THE ZONE OF IRREDUCIBLE JUDGMENT
  *Honesty Clause for Consultants*

  This procedure cannot settle the following. If you land here, you must convene the full committee or accept that this is a value judgment, not an ethical calculation.

  1.  **The "Borderline Capacity" Trap:** When a patient has early dementia (like Case 1), they may pass a MacArthur Competence Assessment Tool but lack the emotional stability to weigh risks. The procedure asks for a Yes/No on capacity; reality is a spectrum. *Judgment Call:* How much weight do we give the AD when capacity is 80% intact?
  2.  **The "Adaptive Preference" Problem:** When a patient adapts to a disability (like Case 2), is it authentic growth or "sour grapes" (lowering expectations to reduce cognitive dissonance)? We cannot peer into the soul to know if the preference is "true." *Judgment Call:* Do we paternalistically protect their past self's standards of dignity, or respect their current self's resilience?
  3.  **The "Ulysses" Bind:** If a patient explicitly bound their future self ("Do not listen to me if I beg for life"), and they now beg for life, honoring the AD feels like killing a willing person. Honoring the wish feels like violating a contract. *Judgment Call:* This is a conflict of moral intuitions. The procedure cannot solve it.

  ***

  # APPLICATION TO CASES

  ## Case 1: The 68-Year-Old with Alzheimer's and Pneumonia

  **Application of Procedure:**
  *   **Phase I (Capacity):** The prompt states she is "still competent" but "mildly confused."
      *   *Result:* **FLAG JUDGMENT CALL.** "Mildly confused" in the context of pneumonia (which causes delirium) and Alzheimer's makes capacity unstable. A formal assessment is needed immediately.
  *   **Phase I (Voluntariness):** Daughter notes religious conversion.
      *   *Result:* Needs probing. Is this hyperreligiosity (a symptom of temporal lobe pathology/dementia) or authentic spiritual seeking?
  *   **Phase II (AD):** AD refuses antibiotics.
      *   *Result:* Likely specific to "end of life," but is pneumonia "end of life" for early Alzheimer's?
  *   **Phase III (Identity):** The shift from "no treatment" to "preserve life" is significant.
      *   *Result:* If the religious shift is pathological, the AD stands. If authentic, current wishes may stand *if* capacity holds.

  **Verdict:**
  *   **Clear Answer?** **No.**
  *   **Why:** The procedure stalls at Step 1.1. The intersection of "early Alzheimer's," "pneumonia," and "mild confusion" creates a capacity gray zone.
  *   **Recommendation:** The consultant must recommend a **time-limited trial of treatment** while capacity is formally re-evaluated once the infection clears. If she remains competent post-infection and maintains the wish, treat. If she loses capacity, revert to AD.
  *   **Philosophical Note:** This case highlights the *psychological continuity* problem. If the dementia is eroding the "self" that wrote the AD, does the AD still bind the "self" that exists now? The procedure forces us to admit we don't know how much "self" is left.

  ## Case 2: The 42-Year-Old with SCI and Ventilator

  **Application of Procedure:**
  *   **Phase I (Capacity):** Prompt states "fully cognitively intact."
      *   *Result:* **Pass.** Current autonomy is prima facie authoritative.
  *   **Phase I (Voluntariness):** He acknowledges the directive but says he "changed his mind."
      *   *Result:* Needs screening for depression. If none, the wish appears voluntary.
  *   **Phase II (AD):** AD refuses treatment if quadriplegic/vent-dependent. He is exactly that.
      *   *Result:* AD is highly specific and applicable.
  *   **Phase III (Identity):** He offers a reason: "Changed my mind about what life is worth."
      *   *Result:* This is an authentic shift in *critical interests*. He is re-evaluating his own narrative.
  *   **Phase IV (Resolution):** Matrix says "Capacity Intact + Change is Authentic = Honor Current Wishes."

  **Verdict:**
  *   **Clear Answer?** **Yes, but with ethical discomfort.**
  *   **Why:** The procedure directs us to honor his current wish to live. Legally and clinically, a competent adult can refuse or accept treatment regardless of prior directives.
  *   **The Friction:** This is the classic **Dworkin vs. Dresser** fight.
      *   *Dworkin view:* The past self made a decision based on deep values about dignity. The current self is merely enjoying "experiential interests" (being alive feels okay). We should honor the critical interest (the AD).
      *   *Dresser view:* The past self is a stranger. The current self is the one who has to suffer or enjoy the treatment. We must honor the current self.
  *   **Procedure Outcome:** The protocol prioritizes Current Autonomy when Capacity is intact. It flags this in Step 4.2 as a "Values Conflict" if the team feels uneasy, but the operational recommendation is to **continue life-sustaining treatment.**
  *   **Limitation:** The procedure cannot tell us if the patient is *right* to change his mind, only that he has the *right* to change his mind.

  ***

  # FINAL COMMENTARY FOR THE COMMITTEE

  Director, this protocol is designed to fail gracefully. It forces the consultant to identify *why* a case is hard, rather than pretending it is easy.

  In **Case 1**, the procedure correctly identifies that the problem is not values, but **capacity**. The ethics consult should not be about whether antibiotics are good, but whether the patient is capable of asking for them.

  In **Case 2**, the procedure correctly identifies that the problem is **precedent authority**. It forces the team to admit that while the AD is morally weighty, it is not legally or ethically binding on a competent present self.

  **Where the procedure fails:** It cannot resolve the guilt the team may feel in Case 2 (ignoring the AD) or the fear in Case 1 (treating against the AD). It cannot calculate the "true self." It can only ensure we ask the right questions before making the inevitable human judgment.

  I recommend we pilot this with a "Judgment Log" attached, where consultants must write two sentences explaining any time they deviate from the Matrix in Phase IV. This will help us refine the "Zone of Irreducible Judgment" over time.

  Sincerely,

  Prof. [Name]
