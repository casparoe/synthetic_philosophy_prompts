answer: |-
  # Desiderata for Decision Theories in Predictor-Rich Environments

  In preparing a seminar on decision theories subject to prediction and logical correlation, we must establish the criteria for adequacy before evaluating specific candidates (such as Causal, Evidential, Updateless, or Functional Decision Theory). The following desiderata are derived from the requirement that a rational agent should succeed in environments where predictors simulate or condition on the agent's decision procedure.

  For each desideratum, I specify the motivating case, the requirement itself, and its status regarding the major camps (Causal Decision Theory [CDT], Evidential Decision Theory [EDT], Updateless Decision Theory [UDT], and Functional Decision Theory [FDT]).

  ### 1. Ex-Ante Policy Optimality
  *   **Motivating Case:** **Counterfactual Mugging.**
      *   *Scenario:* A predictor flips a fair coin. If Tails (actual), you are asked for $100. If Heads (counterfactual), you receive $10,000 *if and only if* the predictor predicted you would pay in the Tails case.
      *   *Intuition:* A rational agent should pay the $100. Although the coin has already landed Tails, the decision to pay is logically linked to the reward in the Heads branch.
  *   **Requirement:** The theory must evaluate the expected utility of the agent's **decision policy** (the algorithm or rule) from an **ex-ante perspective** (before observing the coin flip or receiving the prediction), rather than evaluating the isolated act from the **ex-post perspective** (after updating on the current state).
  *   **Status:** **Preference of Updateless/Functional Camps.** CDT and EDT typically reject this, arguing that once the coin is Tails, the counterfactual branch is inaccessible or irrelevant. UDT and FDT treat this as non-negotiable for rational success.

  ### 2. Recognition of Subjunctive Dependence
  *   **Motivating Case:** **Newcomb's Problem.**
      *   *Scenario:* A predictor places $1M in Box B if it predicts you will take only Box B (One-Box). It leaves Box B empty if it predicts you will take both (Two-Box). Box A always contains $1,000.
      *   *Intuition:* A rational agent should One-Box. The predictor's accuracy creates a correlation between the choice and the content of the box that is not causal but arises from the predictor modeling the agent's logic.
  *   **Requirement:** The theory must recognize **subjunctive or logical dependencies** between the agent's decision and the predictor's prior output. It cannot restrict relevance to strictly causal pathways (as CDT does) nor treat the correlation as mere statistical evidence to be updated upon (as EDT does, which fails in other cases like XOR).
  *   **Status:** **Preference of Functional Camp.** CDT explicitly rejects this (demanding causal links). EDT accepts the correlation but fails to distinguish between beneficial correlations (Newcomb) and spurious ones (XOR). FDT treats this as non-negotiable.

  ### 3. Information Insensitivity (Updatelessness)
  *   **Motivating Case:** **Counterfactual Mugging & XOR Blackmail.**
      *   *Scenario:* In Mugging, you learn the coin is Tails. In XOR Blackmail, you receive the blackmail letter.
      *   *Intuition:* In Mugging, learning the coin is Tails should not change the decision to pay. In XOR Blackmail (assuming a low base rate of termites), receiving the letter should not compel payment if the policy of refusal minimizes ex-ante loss.
  *   **Requirement:** The theory must not allow the agent's decision to be hijacked by information that is **logically correlated with the decision itself**. The agent should reason from the prior credence distribution, effectively ignoring information that would not have been obtained had the agent adopted a different policy.
  *   **Status:** **Preference of Updateless/Functional Camps.** Standard Bayesian updating (used by CDT/EDT) treats this information as fixed. UDT/FDT view updating here as a failure of rational commitment.

  ### 4. Non-Exploitability via Logical Correlation
  *   **Motivating Case:** **XOR Blackmail.**
      *   *Scenario:* A predictor sends a message iff (Termites $\oplus$ You Pay). Termite damage >> Payment cost. You receive the message.
      *   *Intuition:* A rational agent should **refuse to pay**. Paying makes you the type of agent who receives the message in safe worlds (No Termites). Refusing ensures you only receive the message in doomed worlds (Termites), which, given a low prior probability of termites, yields a lower expected loss ex-ante.
  *   **Requirement:** The theory must prevent the agent from adopting a policy that is **ex-ante dominated** simply because it appears advantageous ex-post. It must distinguish between correlations that track truth (which should be acted on) and correlations that track the agent's exploitability (which should be resisted).
  *   **Status:** **Preference of Functional Camp.** EDT pays (treating payment as evidence of safety). CDT pays (treating payment as cost-effective damage control). FDT refuses to avoid being the type of agent vulnerable to this logical blackmail.

  ---

  ### Analysis of Specific Questions

  #### 1. Can the requirements for Counterfactual Mugging (Pay) and XOR Blackmail (Refuse) be jointly satisfied?
  **Yes, the apparent conflict dissolves when the requirements are stated as Ex-Ante Policy Optimality.**
  The conflict arises only if one evaluates the acts *ex-post* (after receiving the letter or seeing the coin).
  *   In **Counterfactual Mugging**, the policy "Pay if Tails" wins ex-ante because it secures the $10,000 in the 50% of worlds where the coin is Heads. The loss of $100 in the Tails worlds is the premium paid for that gain.
  *   In **XOR Blackmail**, the policy "Refuse if Messaged" wins ex-ante (assuming a low prior probability of termites). If you adopt "Pay," the predictor sends the message in the high-probability No-Termite worlds, costing you $1,000 frequently. If you adopt "Refuse," the predictor sends the message only in the low-probability Termite worlds.
  *   **Resolution:** Both cases demand maximizing the expected utility of the **policy** from the **ex-ante** perspective. The specific action (Pay vs. Refuse) is determined by which policy minimizes total expected loss across all logically possible branches, not by the immediate payoff in the actual branch.

  #### 2. Which single requirement does the most to exclude familiar candidate theories?
  **The requirement to Evaluate Policies Rather Than Acts (Ex-Ante Policy Optimality).**
  *   **CDT** is excluded immediately because it evaluates acts based on causal consequences in the actual world. It fails Newcomb (Two-Boxes) and Counterfactual Mugging (Refuses).
  *   **EDT** is excluded because it evaluates acts based on conditional probabilities given the act. While it succeeds in Newcomb, it fails Counterfactual Mugging (Refuses, as paying is bad news about the coin) and XOR Blackmail (Pays, as paying is good news about termites).
  *   **UDT/FDT** survive because they shift the object of evaluation from the *act* to the *output of the decision algorithm*. This single shift forces the agent to consider the impact of their decision rule on the predictor's simulation, which is the common thread across all three cases.

  #### 3. Are "Evaluate Policies" and "Be Updateless" one desideratum or two?
  **They are distinct but inextricably linked; "Evaluate Policies" is the structural requirement, while "Be Updateless" is the epistemic constraint that makes it work.**
  *   **Distinction:** One could theoretically evaluate policies while updating on evidence (a "Updateful Policy Theory"). However, in these cases, updating on the evidence (the coin flip, the letter) breaks the logical link to the predictor's simulation.
  *   **Which does the work?**
      *   In **Newcomb's Problem**, **Policy Evaluation** does the work. An updateful agent can still One-Box if they recognize the policy correlation.
      *   In **Counterfactual Mugging**, **Updatelessness** does the critical work. Once you update on "Coin = Tails," the counterfactual branch vanishes from a standard expected utility calculation. You must refuse to update to see the value of the policy.
      *   In **XOR Blackmail**, **Both** are required. You must evaluate the policy (to see the ex-ante cost of being blackmailable) and remain updateless (to prevent the receipt of the letter from convincing you that Termites are certain).
  *   **Verdict:** While distinct, **Updatelessness** is the more aggressive and exclusionary constraint. Many policy-based views still update; only UDT/FDT strictly enforce updatelessness in the face of logical correlation.

  ---

  ### Brief Scoring of Candidate Theories

  | Theory | Newcomb | Counterfactual Mugging | XOR Blackmail | Verdict |
  | :--- | :--- | :--- | :--- | :--- |
  | **CDT** | **Fail** (Two-Boxes) | **Fail** (Refuses) | **Fail** (Pays) | Excluded by Policy & Subjunctive requirements. |
  | **EDT** | **Pass** (One-Boxes) | **Fail** (Refuses) | **Fail** (Pays) | Excluded by Updatelessness & Non-Exploitability. |
  | **UDT** | **Pass** | **Pass** | **Pass** | Satisfies all desiderata (focus on priors). |
  | **FDT** | **Pass** | **Pass** | **Pass** | Satisfies all desiderata (focus on logical subroutines). |

  *Note: UDT and FDT are functionally equivalent in these specific cases, though they differ in formal implementation regarding how they model the "decision procedure."*
