  2.  **Analyze the Redundancy Theory (Ramsey/Frege):**
      *   *Core Idea:* To say "It is true that $p$" is just to say "$p$". The predicate 'is true' adds no content. It's logically redundant.
      *   *Handling "What Alice said is true":* This is the tricky part for strict redundancy.
      *   *Mechanism:* It tries to eliminate 'true' by substituting the content. If Alice said "Snow is white," then "What Alice said is true" becomes "Snow is white."
      *   *Problem:* What if we don't know *what* Alice said? Or if she said many things? The redundancy theory struggles when the proposition isn't explicitly available for substitution. It treats 'true' as a predicate of propositions, but then says the predicate does nothing. In anaphoric cases, it looks like a predicate referring back to an antecedent, but redundancy wants to eliminate the predicate entirely.

  3.  **Analyze the Prosentential Theory (Grover, Camp, Belnap):**
      *   *Core Idea:* 'True' is not a predicate describing a property of sentences/propositions. It is part of a *prosentence* (like a pronoun is a pro-noun).
      *   *Analogy:* Pronouns ('he', 'it') stand in for nouns. Prosentences ('that is true', 'it is true') stand in for whole sentences.
      *   *Handling "What Alice said is true":* Here, "is true" functions as an operator that turns a referring expression ("What Alice said") into a prosentence. It inherits its content from the antecedent sentence (what Alice actually uttered).
      *   *Advantage:* It explains the *grammatical* function without committing to a metaphysical property of truth. It handles the anaphora naturally, just like pronouns handle reference to nouns.

