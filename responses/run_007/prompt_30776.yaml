answer: |-
  The **Redundancy Theory** and the **Prosentential Theory** of truth are both deflationary accounts, meaning they deny that truth is a substantive property or a robust metaphysical relation. However, they diverge significantly in their linguistic analysis of the word "true," particularly regarding how it functions in anaphoric contexts (where a term refers back to an earlier expression).

  ### The Redundancy Theory and Anaphora
  Classically associated with Frank Ramsey, the Redundancy Theory posits that the predicate "is true" is logically dispensable. To assert "It is true that snow is white" is to do nothing more than assert "Snow is white." The predicate adds no content to the proposition.

  When faced with anaphoric sentences like **"What Alice said is true,"** the redundancy theorist attempts to eliminate the word "true" by substituting the content of Alice's utterance.
  *   **Mechanism:** If Alice said, "It is raining," then "What Alice said is true" is translated simply to "It is raining."
  *   **The Difficulty:** This elimination strategy works smoothly only when the antecedent content is explicitly known and singular. It struggles with **blind ascriptions** or **generalizations**. For example, if we say, "Everything the Pope says is true," we cannot eliminate "is true" by listing every sentence the Pope has ever uttered (an infinite or unknown conjunction). The redundancy theorist is forced to treat "true" as a predicate of propositions to handle these generalizations, which reintroduces the very ontological commitments (the existence of propositions as objects) that deflationism seeks to avoid.

  ### The Prosentential Critique
  Prosentential theorists (notably Dorothy Grover, Joseph Camp, and Nuel Belnap) argue that the Redundancy Theory fails because it misidentifies the grammatical category of "true." They contend that redundancy theorists incorrectly analyze "is true" as a predicate that *happens* to be redundant, rather than recognizing it as a functional device for cross-sentential reference.

  Prosententialists regard the redundancy treatment of anaphora as inadequate for two main reasons:
  1.  **Grammatical Mismatch:** In "What Alice said is true," the word "true" does not describe a property of Alice's sentence; it functions to inherit the content of that sentence. Treating it as a predicate implies there is a "thing" (a proposition) being described, whereas prosententialists see it as a device for avoiding repetition.
  2.  **Quantification:** Redundancy theory struggles to explain how we quantify over truth claims without positing propositions. If we say "Some of what he said is true," redundancy theory requires quantifying over objects (propositions). Prosententialists argue we are actually quantifying into *sentence positions*, which does not require propositional objects.

  ### The Prosentential Solution: 'Is True' as an Operator
  To solve these difficulties, prosentential theory analyzes "is true" not as an ordinary predicate, but as part of a **prosentence-forming operator**.

  *   **The Pronoun Analogy:** Just as a pronoun (e.g., "she") stands in for a noun phrase to avoid repetition, a **prosentence** (e.g., "that is true") stands in for a whole sentence.
  *   **Anaphoric Function:** In the sentence "What Alice said is true," the phrase "is true" operates on the nominalization "What Alice said." It transforms the referring expression into a prosentence that inherits its content from the antecedent sentence (Alice's actual utterance).
  *   **Solving the Difficulty:** By viewing "is true" as a syncategorematic operator (a symbol that only has meaning in combination with others) rather than a predicate, the theory explains why the word is necessary for logic and grammar even if it denotes no property. It allows for generalizations like "Everything he says is true" to be understood as quantifying over sentence positions (e.g., "For any sentence $p$, if he says $p$, then $p$") without needing to eliminate the word "true" or commit to the existence of propositions. The word "true" is retained not to describe reality, but to facilitate logical anaphora.

  ### A Remaining Problem for the Prosentential Approach
  Despite its elegance in handling anaphora, the prosentential theory faces a significant challenge regarding **nominalizations**.

  In ordinary language, we frequently treat "truth" as an abstract noun that serves as a subject of predication, such as in the sentence: **"Truth is a virtue."**
  *   **The Problem:** Since prosentential theory insists that "true" is not a predicate and "truth" does not refer to an object or property, it must treat sentences like "Truth is a virtue" as grammatically misleading. Theorists must provide complex paraphrases to explain away the noun "truth" (e.g., interpreting it as a shorthand for "Being truthful is a virtue" or similar).
  *   **Why it matters:** Critics argue that this makes the theory revisionist rather than descriptive. If a theory of truth must claim that obvious grammatical features of our language (using "truth" as a noun) are systematic errors or require elaborate fictionalizing, it loses plausibility as an account of how the concept actually functions in natural language.
