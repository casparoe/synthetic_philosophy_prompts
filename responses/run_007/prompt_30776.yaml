      *   *Prosentential:* "Is true" + "That" (or nominalization) = Prosentence. "What Alice said is true" acts like "She runs" where "She" refers to Alice. Here, the whole phrase "What Alice said is true" acts as a sentence standing in for Alice's sentence.
