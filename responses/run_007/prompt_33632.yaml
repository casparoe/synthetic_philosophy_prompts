answer: |-
  This is a very sophisticated position. You have essentially reconstructed **Type-B Physicalism** (specifically the Phenomenal Concept Strategy), but you have added a specific clause to your view on Mary (5) that threatens to blow up the whole architecture.

  You are right to be worried. You can keep most of these, but **(1), (4), and (5) cannot all stand as currently formulated.**

  Here is the ranking of tensions by severity, followed by the diagnosis and the cheapest fix.

  ### 1. The Fatal Tension: (4) vs. (5)
  **Severity: Critical**

  This is the crack you sensed. The Phenomenal Concept Strategy (4) is specifically designed to explain away the intuition in (5) without conceding ontological ground.
  *   **View (4)** claims that the "gap" is purely conceptual. We have two concepts (physical/functional vs. phenomenal) that pick out the *same physical property*.
  *   **View (5)** claims Mary learns something "genuinely new" and *not* just "a new way of representing old facts."

  **The Problem:** If Mary knows all the physical facts (which she does, by hypothesis), and Physicalism (1) is true, then there are no non-physical facts for her to learn. If she learns a "genuinely new fact" (as opposed to a new concept or mode of presentation), then there was a truth condition she didn't know. If that truth condition isn't physical, Physicalism is false.
  Standard Type-B Physicalists argue Mary gains a **new concept** (the phenomenal concept) of an **old fact** (the brain state). Your formulation of (5) explicitly rejects this ("not just... a new way of representing old facts"). If you hold (5) as written, you are effectively arguing for Property Dualism, which contradicts (1).

  ### 2. The Ontological Tension: (1) vs. (5)
  **Severity: Critical**

  This is the consequence of the first tension.
  *   **(1)** says consciousness is wholly physical.
  *   **(5)** says there is knowledge about consciousness that is not captured by physical knowledge (even conceptually).

  If Mary's new knowledge is propositional (knowledge-*that*) rather than merely ability-based (knowledge-*how*) or conceptual (knowledge-*by acquaintance*), then physical descriptions of the world are incomplete. You cannot claim Physicalism (1) while simultaneously claiming the Knowledge Argument succeeds in showing new *facts* (5). You have to choose: either Physicalism is true and Mary only gains a new concept, or Mary gains a new fact and Physicalism is false.

  ### 3. The Modal Tension: (3) vs. (4)
  **Severity: Moderate (Manageable)**

  You worried about this, but it is less severe than the Mary problem.
  *   **(3)** says conceivability is a *prima facie* guide to metaphysical possibility.
  *   **(4)** says zombies are conceivable but metaphysically *impossible* (because the concepts are distinct but the referent is identical).

  **The Fix:** This works only if you treat (3) as defeasible. The Phenomenal Concept Strategy argues that the "prima facie" justification provided by conceivability is **defeated** by the a posteriori necessity of the identity between brain states and experience. As long as you maintain that (3) provides a *presumption* of possibility that can be overridden by a theoretical explanation (like 4), these are consistent. If you treat (3) as "Ideal Conceivability *entails* Possibility," then (4) contradicts it. Your phrasing ("prima facie reason") saves you here.

  ### 4. The Intuition Tension: (4) vs. (2)
  **Severity: Low (Non-Issue)**

  You asked: *"If phenomenal concepts explain why zombies seem conceivable, does that make the conceivability somehow less genuine?"*
  **No.** This is a standard move. (4) validates (2). It says, "Yes, zombies are genuinely conceivable (coherent in the mind), and here is *why* that intuition exists (conceptual independence), even though they aren't metaphysically possible." (4) explains the source of (2) without requiring (2) to track metaphysical reality. There is no tension here.

  ### 5. The Threshold Tension: (6) vs. The Rest
  **Severity: Low**

  Claiming thermostats aren't conscious (6) is fully compatible with Physicalism (1). It just means you are not a panpsychist and you likely reject simple functionalism in favor of a biological or complex-systems view of realization. This fits neatly with the idea that you need specific "physical organization" for the phenomenal concepts to latch onto anything at all.

  ---

  ### The Verdict and The Fix

  You cannot keep all six as written. **(5) is the outlier.** It is too strong for a physicalist framework that relies on (4).

  #### Option A: The "Cheapest Fix" (Stay Physicalist)
  **Modify (5).** Align it with the standard Phenomenal Concept Strategy.
  *   **New (5):** "The Mary thought experiment shows an epistemic gap: when Mary sees red, she acquires a **phenomenal concept** that allows her to token thoughts she couldn't before. While this feels like learning a new fact, it is actually gaining a new mode of access to a physical fact she already knew."
  *   **Cost:** You lose the rhetorical punch of saying she learns something "genuinely new" in a strong sense. You have to admit the "newness" is cognitive, not ontological.
  *   **Benefit:** You keep Physicalism (1), the Zombie intuition (2), and the Explanation (4). This makes you a consistent Type-B Physicalist.

  #### Option B: The "Expensive Fix" (Embrace Dualism)
  **Keep (5) and Drop (1).**
  *   **New (1):** "Consciousness involves properties that are not wholly captured by current physical descriptions." (Property Dualism).
  *   **Cost:** You lose Physicalism. You now have to explain how non-physical properties interact with the physical world (causal closure problems).
  *   **Benefit:** You get to keep the strong reading of the Knowledge Argument. Many find this more honest given how strong the Mary intuition is.

  #### Option C: The "Nuanced Fix" (Fine-Grained Facts)
  **Keep (1) and (5), but clarify "Fact".**
  *   **Strategy:** Argue that "facts" are fine-grained. The fact *that water is H2O* is different from the fact *that water is water*, even if they refer to the same state of affairs.
  *   **Risk:** This is philosophically contentious. Many argue that if the truth conditions are identical, it's the same fact. If you go this route, you must defend a Fregean view of facts against the standard Russellian view used in most physicalist arguments.
  *   **Warning:** Your current phrasing ("not just... a new way of representing") explicitly blocks this escape route. You would need to rewrite (5) to allow that facts *can* be individuated by mode of presentation.

  ### Recommendation for Your Paper
  Go with **Option A**.
  Since you are already committed to the Phenomenal Concept Strategy (4), that strategy *requires* a specific reading of Mary. If you argue for (5) as you have written it, your opponents in the reading group will immediately point out that you have conceded the Knowledge Argument and abandoned Physicalism.

  **Suggested revision for (5):**
  > "(5) The Mary thought experiment highlights the unique nature of phenomenal concepts: when Mary sees red, she gains a **direct recognitional concept** of her brain state. This is a genuine cognitive achievement (she can now think thoughts she couldn't before), but it does not entail she learns a new non-physical fact."

  This preserves the "something real happens" intuition without blowing up your physicalism.
