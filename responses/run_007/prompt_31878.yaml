      *   *Key Text:* Reference *The Methods of Ethics* (Book I, Chapter V; Book III, Chapter V; Conclusion) and his letters (e.g., to Balfour or Myers).
      *   *Terminology:* Use "Rational Egoism," "Universal Hedonism," "Dualism of Practical Reason."

  6.  **Final Polish:**
