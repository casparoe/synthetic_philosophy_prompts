      *   *The Dualism:* Reason demands I seek my own greatest happiness (Egoism) *and* reason demands I seek the general greatest happiness (Utilitarianism). These can conflict. There is no rational way to prioritize one over the other within a purely secular/naturalistic framework.
      *   *The "Deep Problem":* If virtue (sacrificing self for others) doesn't lead to personal happiness, why be moral? If the universe doesn't reward morality, rationality is divided against itself.
      *   *Psychical Research (SPR):* Sidgwick wasn't just a dabbler; he saw it as scientific inquiry into evidence for survival.
      *   *The Connection:* If survival + divine governance exists, then virtue *can* be reconciled with self-interest (via rewards/punishments or cosmic harmony). If not, the dualism remains unresolved.
      *   *Assessment:* Does this actually solve the problem? Is it philosophically sound? (Kant's Postulates of Practical Reason is a useful comparison).

  3.  **Drafting the Reconstruction (The "Why"):**
      *   *Step 1: Define the Dualism.* In *The Methods of Ethics* (especially the final chapter), Sidgwick concludes that Egoism and Utilitarianism are both rational but potentially contradictory.
      *   *Step 2: The Need for Harmony.* For ethics to be fully rational, there must be a harmony between duty (Utilitarianism) and self-interest (Egoism).
      *   *Step 3: The Empirical Gap.* In this life, virtue often leads to suffering, and vice to happiness. Nature is indifferent.
      *   *Step 4: The Theological/Post-Mortem Solution.* To guarantee harmony, we need a moral orderer of the universe (God) and a future state (afterlife) where justice is dispensed.
      *   *Step 5: The Role of Psychical Research.* Traditional theology is shaky in the 19th century (scientific naturalism). Sidgwick wants *evidence*. If psychical research proves survival, it supports the possibility of a moral orderer, thus offering hope for resolving the dualism. It's not proof of God, but proof of *survival*, which makes the theological solution *possible* rather than impossible.

  4.  **Drafting the Assessment (The "Critique"):**
      *   *Strength:* It shows Sidgwick's commitment to rational coherence. He refuses to simply assert faith (like Kant) but seeks empirical grounding.
      *   *Weakness 1 (The Gap):* Survival $\neq$ Moral Governance. Just because ghosts exist doesn't mean a benevolent God rewards virtue. The "Cosmic Justice" leap is still required.
      *   *Weakness 2 (Motivation):* Even if justice comes later, does that make Utilitarianism *rationally superior* to Egoism now? Or does it just make Egoism calculate long-term rewards? If I am good *only* for the reward, is it truly moral? (Kantian objection).
      *   *Weakness 3 (Epistemological):* Basing ethics on empirical claims about ghosts makes ethics contingent on fragile science. If SPR fails, does ethics collapse? Sidgwick admits the dualism might be ultimate, which is pessimistic.
