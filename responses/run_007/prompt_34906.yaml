answer: |-
  # Q&A Prep Sheet: Evolutionary Debunking & Moral Realism
  **Context:** Department Colloquium | **Time:** 2-Minute Replies Max

  ### 1. The Third-Factor Reply (Non-Naturalist Realists)
  **The Question:** "You claim third-factor explanations beg the question. But consider David Enoch's proposal: survival is good, and evolution selects for survival. Doesn't this provide a common cause linking fitness and moral truth without assuming the truth of realism in the explanation itself? Why is that question-begging?"

  **The Reply:** "Enoch's account posits a correlation between 'survival-promoting' and 'good.' My objection is that this only works if we already accept that survival is *objectively* good. To use that correlation to justify the belief that survival is good is circular. The debunking argument challenges our justification for believing any moral truths exist. If the third factor (survival) is only morally relevant *if* realism is true, you cannot use it to prove realism is likely. It assumes the reliability of the very intuitions under attack to establish the link between the third factor and the moral truth."

  **Weakness:** This relies on a strong distinction between 'explaining the correlation' and 'justifying the belief.' Realists may argue that the third factor provides an *explanation* of reliability, not a premise in an argument for truth, sidestepping the circularity charge.

  ### 2. Companions in Guilt (Math/Logic) (Realists & Epistemologists)
  **The Question:** "Evolution also shaped our logical and mathematical intuitions. If evolutionary origins undercut moral justification, don't they also undercut math and logic? If you're not willing to be a skeptic about math, why should we accept skepticism about morals?"

  **The Reply:** "There is a disanalogy in the explanatory connection. In math, we can argue that basic logical capacities are constitutive of rational thought itself; you cannot reason about evolution without presupposing them. Moral intuitions, however, are contingent motivational pushes. Furthermore, mathematical truths often have causal efficacy in the physical world (bridging the gap), whereas non-natural moral truths are causally inert. The 'coincidence' is far more striking in the moral case because there is no plausible causal or constitutive link between the fitness benefit and the abstract moral fact."

  **Weakness:** This is the hardest battle. If you concede math is safe, you need a robust account of *why* moral faculties are different. Many epistemologists find the "constitutive" defense of logic unconvincing if evolution selected for heuristics rather than truth.

  ### 3. The Epistemic Principle (Epistemologists)
  **The Question:** "What is the precise epistemic principle at work here? Is this an undercutting defeater? Merely showing an alternative explanation for a belief doesn't usually defeat justification unless the alternative is *more* likely. Why is the evolutionary explanation sufficiently probable to trigger the defeater?"

  **The Reply:** "The principle is that if you become aware that your belief is formed by a process insensitive to the truth of the proposition, you lose justification. It's not that the evolutionary story is *more* likely than realism; it's that the evolutionary story is *complete* without referencing moral truths. Once you see the belief is fully explained by fitness, the probability that it also tracks mind-independent truth drops to baseline, which, for abstract non-natural facts, is negligible. The burden shifts to the realist to show sensitivity."

  **Weakness:** This assumes a specific, controversial theory of defeat (insensitivity). If the audience prefers a "proper function" or "reliabilist" account, the mere existence of an alternative explanation might not be enough to defeat justification.

  ### 4. Empirical Accuracy (Philosophers of Biology)
  **The Question:** "Your evolutionary premise seems to rely on a 'selfish gene' simplification. Modern evolutionary biology acknowledges group selection and reciprocal altruism which track genuine cooperative goods. Isn't your empirical story too coarse to support such a strong metaphysical conclusion?"

  **The Reply:** "Even if evolution selected for cooperation, it selected for *cooperative behavior*, not for tracking *moral truths* about cooperation. The organism needs to act *as if* helping is good to gain the fitness benefit. The truth of the proposition 'helping is objectively obligatory' does no work in the evolutionary explanation. The biological mechanism is satisfied by the behavioral disposition, regardless of whether there is a mind-independent truth making that disposition correct."

  **Weakness:** You are deferring to a philosophical interpretation of biology. If a biologist in the room argues that tracking real social norms *was* the fitness mechanism, your "no work" claim becomes an empirical dispute you might lose.

  ### 5. Reflective Equilibrium (Moral Realists)
  **The Question:** "We don't just accept raw intuitions. We use reflective equilibrium to weed out biased intuitions. Even if evolution gave us a starting point, couldn't rational reflection purify our moral beliefs enough to track truth, bypassing the evolutionary defeater?"

  **The Reply:** "Reflective equilibrium operates on the input of intuitions. If the entire corpus of input is systematically skewed by evolutionary pressures away from truth (or toward truth only by coincidence), coherence among those beliefs doesn't generate justification. It's like adjusting a compass that is magnetically pulled by a local iron deposit; making the readings consistent with each other doesn't make them point North. You need an independent anchor to truth, which reflection alone doesn't provide."

  **Weakness:** This paints a picture of global corruption. Realists can argue that reflection allows us to identify and discard specifically *evolutionary* biases (e.g., tribalism), leaving a core of reliable intuitions.

  ### 6. Modal Security (Epistemologists)
  **The Question:** "Sharon Street argues for sensitivity, but Berker and others suggest 'Modal Security.' If our moral beliefs are safe (true in nearby worlds), does the evolutionary origin matter? Couldn't it be that in nearby worlds, evolution would still have led us to true moral beliefs?"

  **The Reply:** "Modal Security still requires an explanation for *why* the beliefs are safe. If the only explanation for the safety is 'evolution happened to align with truth,' that is the coincidence I am highlighting. Safety without an explanatory connection is epistemically lucky. The debunking argument claims that without a link between the evolutionary cause and the moral fact, the safety is unexplained and therefore unjustified."

  **Weakness:** This pushes you toward requiring an explanatory connection for all knowledge, which is a high bar. Some epistemologists accept "brute" reliability.

  ### 7. The "So What?" (Constructivists/Expressivists)
  **The Question:** "Suppose you succeed. You've debunked non-naturalist realism. But most of us in this room are already anti-realists. Why does this argument carry dialectical weight? Doesn't it just preach to the choir while ignoring that realism isn't the only game in town?"

  **The Reply:** "The argument isn't just about defeating realism; it's about clarifying the cost of metaethical commitments. For the realists, it shows their position is epistemically tenable only at a high cost. For the anti-realists, it prevents a complacent 'error theory' that assumes realism is the default. It forces the department to acknowledge that if we want objective moral truth, we need a better epistemology than we currently have. It raises the stakes for everyone."

  **Weakness:** This is a diplomatic answer, but it might feel like dodging. If the anti-realists think the argument is useless because realism is already dead, they won't be impressed by the "clarification" benefit.

  ### 8. The Self-Defeat Objection (**The Question I Hope Nobody Asks**)
  **The Question:** "If evolutionary explanations debunk moral beliefs because they don't track truth, doesn't this same argument debunk the epistemic norms you are using to make this argument? Your belief in 'inference to the best explanation' and 'epistemic defeaters' is also evolved. Aren't you sawing off the branch you're sitting on?"

  **The Reply:** "This is the global skepticism worry. My response is that the EDA is a *conditional* argument: *If* you are a moral realist, *then* you face this problem. I am not asserting my epistemic norms are immune to evolution; I am showing that the Moral Realist has a specific problem regarding the *content* of moral facts being causally inert. However, to be candid: if pressed, I would argue that epistemic norms are constitutive of reasoning itself. To argue against them is to performatively contradict oneself, whereas arguing against moral truths is not. So the argument is locally stable even if globally precarious."

  **Weakness:** **This is the weakest point.** Distinguishing moral facts from epistemic facts here is difficult. If epistemic facts are also mind-independent (which many realists claim), the "constitutive" defense looks like special pleading. If you concede epistemic norms are also debunked, your argument loses its normative force. If you deny it, you need a meta-epistemology you haven't defended in the paper.
