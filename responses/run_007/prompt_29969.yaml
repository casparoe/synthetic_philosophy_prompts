answer: |-
  You have hit the wall because the wall is real. It is not a lack of knowledge on your part; it is the structural bedrock of social choice theory. The frustration you feel—different camps championing different axioms while ignoring the impossibility theorems that bind them—is a feature of the field, not a bug.

  Below is the "full spec." It breaks down the inputs, outputs, desiderata, and the formal incompatibilities that force you to choose which flaws you are willing to live with.

  ### I. The Specification: Inputs, Outputs, and Axioms

  **Input:** A profile of $N$ voters, each submitting a strict ordinal ranking over a set of alternatives $X$ (where $|X| \geq 3$).
  **Output:** Either a **Social Welfare Function (SWF)** (a complete social ranking) or a **Social Choice Rule (SCR)** (a winner or set of winners).

  | Desideratum | Formal Definition | Intuition / Case | Status | Camp / Trade-off |
  | :--- | :--- | :--- | :--- | :--- |
  | **Universal Domain (U)** | The rule must produce an output for *any* logically possible profile of individual preferences. | Democracy must handle polarization, cycles, and chaos without crashing. | **Non-Negotiable** | Baseline requirement. |
  | **Pareto Efficiency (P)** | If every voter prefers $A$ to $B$, the social ranking must prefer $A$ to $B$. | Unanimity should rule. If everyone agrees, the system shouldn't disagree. | **Non-Negotiable** | Baseline requirement. |
  | **Non-Dictatorship (D)** | No single voter exists whose top preference always determines the social outcome regardless of others. | "One person, one vote." No monarchs. | **Non-Negotiable** | Baseline requirement. |
  | **Transitivity (T)** | If Society prefers $A \succ B$ and $B \succ C$, then Society must prefer $A \succ C$. | Rational agency. A cycle ($A \succ B \succ C \succ A$) makes implementation impossible. | **Hard for SWF**<br>**Soft for SCR** | **Arrow's Knife:** To satisfy Arrow, you usually drop this (allow cycles) or drop IIA. |
  | **Independence of Irrelevant Alternatives (IIA)** | The social ranking of $A$ vs. $B$ depends *only* on individual rankings of $A$ vs. $B$. Changes to $C$ cannot flip $A$ and $B$. | **Context Independence.** Prevents "spoilers." Ensures local consistency. | **Controversial** | **The Killer Constraint.** Often mistaken for fairness; actually a ban on contextual info. |
  | **Condorcet Consistency** | If an alternative beats every other alternative in pairwise majority contests, it must win. | **Majoritarianism.** The candidate who can defeat all others head-to-head should win. | **Preference** | **Majority Camp.** Conflicts with IIA and Participation. |
  | **Monotonicity** | If $A$ wins, and a voter raises $A$ on their ballot (changing nothing else), $A$ must still win. | **More support shouldn't hurt.** IRV fails this. | **Preference** | **IRV Defenders** (ironically, IRV fails it). Essential for stability. |
  | **Participation (No-Show)** | A voter should never be better off abstaining than voting sincerely. | **Civic Duty.** Voting shouldn't backfire on the voter. | **Preference** | **Consistency Camp.** Condorcet methods often fail this. |
  | **Strategy-Proofness** | No voter can ever achieve a better outcome by misrepresenting their true preferences. | **Honesty.** Removes the burden of tactical voting. | **Impossible** | **Gibbard-Satterthwaite.** Cannot coexist with U, D, and Resoluteness. |
  | **Resoluteness** | The rule must always return a single winner (no ties). | **Decisiveness.** Governance requires a decision. | **Soft** | Often relaxed to allow tie-breaking rules. |

  ---

  ### II. The Distinctions You Must Maintain

  Before evaluating the rules, you must keep these conceptual buckets separate. Confusing them is where most course debates go off the rails.

  1.  **SWF (Ranking) vs. SCR (Winner):**
      *   **Arrow's Theorem** applies to SWFs (producing a full ranking). It says you can't rank things fairly.
      *   **Gibbard-Satterthwaite** applies to SCRs (picking a winner). It says you can't pick a winner without inviting manipulation.
      *   *Trap:* Defending a system because "it picks a good winner" ignores that it might produce an intransitive social ranking (Condorcet cycles), which matters if you need to pick a *second* place (e.g., for a coalition or succession).

  2.  **Social Indifference vs. Ties:**
      *   **Social Indifference ($A \sim B$):** The aggregate will genuinely does not distinguish between them.
      *   **Tie:** The rule failed to distinguish between them given the input.
      *   *Why it matters:* If a rule produces ties often (lack of Resoluteness), you need a tie-breaking mechanism. That tie-breaker is often a Dictator (e.g., "Chairman's vote"), which violates Non-Dictatorship in the limit.

  3.  **Ordinal vs. Cardinal (Intensity):**
      *   Your spec asks for **ordinal rankings**. This explicitly **excludes preference intensity**.
      *   *The Trap:* If you argue a system is bad because it ignores how *much* someone hates Candidate A, you are arguing against the input spec, not the rule. To capture intensity, you must change the input to Cardinal (Score/Range) voting, which sidesteps Arrow but introduces new problems (strategic exaggeration to min/max scores).

  4.  **Group Choice vs. Fairness to Members:**
      *   **Utilitarian:** Maximize total satisfaction (requires cardinal utility).
      *   **Contractarian:** Ensure no member is tyrannized (requires rights/veto constraints).
      *   Voting rules generally aim for the latter (procedural fairness) rather than the former (outcome optimality).

  ---

  ### III. The Interplay: What Breaks and Why

  This is the core of your request. You want to know which subsets are jointly unsatisfiable and which requirement is the "killer."

  #### 1. Arrow's Impossibility Theorem (The SWF Constraint)
  **Theorem:** No SWF can satisfy **U + P + IIA + T + D** simultaneously.
  **The Conflict:** You must drop at least one.
  *   **Drop D:** You get a Dictatorship (mathematically valid, politically dead).
  *   **Drop P:** You get a system that ignores unanimity (absurd).
  *   **Drop U:** You restrict what people are allowed to vote (e.g., single-peaked preferences). This works in 1D spectrums (Left/Right) but fails in complex politics.
  *   **Drop T:** You allow social cycles (Condorcet paradox). The "group" has no consistent ranking. This is common in legislatures.
  *   **Drop IIA:** **This is the standard move.** Almost all real-world systems (Borda, Plurality, Condorcet) violate IIA.

  #### 2. Gibbard-Satterthwaite Theorem (The SCR Constraint)
  **Theorem:** No SCR can satisfy **U + Resoluteness + D + Strategy-Proofness** for 3+ candidates.
  **The Conflict:** If you want a single winner and no dictators, **manipulation is inevitable.**
  *   *Implication:* Stop looking for a "strategy-proof" voting system. It does not exist. The goal shifts to "hard to manipulate" or "robust to manipulation."

  #### 3. The "Spoiler" vs. IIA Paradox
  You mentioned the "Spoiler Effect." Here is the hard truth:
  *   **The Spoiler Effect is a violation of IIA.** (Adding Candidate $C$ changes the winner between $A$ and $B$).
  *   **Arrow says:** If you demand IIA (No Spoilers), you get Dictatorship.
  *   **Conclusion:** **In a non-dictatorial democracy, Spoilers are mathematically inevitable.**
  *   *Nuance:* You can minimize them, but you cannot eliminate them without violating Arrow's other conditions. When someone says "System X eliminates spoilers," they are usually defining "spoiler" narrowly (e.g., only regarding clone candidates) or ignoring the IIA implication.

  ---

  ### IV. The Verdict on IIA: Technical Convenience or Fairness?

  You asked: *If the right lesson is that one of the "requirements" was never really a requirement... say so.*

  **Verdict: IIA is the primary bottleneck, and it is often mistaken for a fairness condition when it is actually an information constraint.**

  **The Defense of IIA (Why it looks like fairness):**
  It prevents "agenda manipulation." If the relative ranking of $A$ and $B$ depends on $C$, then a chairperson can manipulate the outcome by adding or removing $C$ (irrelevant alternatives) without changing anyone's mind about $A$ or $B$. It ensures **local consistency**.

  **The Critique of IIA (Why it's a straitjacket):**
  IIA forbids the voting system from using *contextual information*.
  *   *Example:* In a race between a Far-Left ($L$) and Far-Right ($R$) candidate, the presence of a Moderate ($M$) tells you something about the polarization of the electorate.
  *   If $M$ splits the vote with $L$, allowing $R$ to win, IIA says this is "irrelevant." But intuitively, $M$'s presence *is* relevant to whether $L$ represents the majority will.
  *   **Condorcet Methods** (which satisfy the "Majority Camp" intuition) inherently violate IIA. They look at the *structure* of pairwise wins (the graph), not just isolated pairs.
  *   **Borda Count** violates IIA heavily (ranking $C$ last hurts $A$ more than ranking $C$ first), but it captures a form of "consensus" that IIA bans.

  **Recommendation:**
  Treat IIA as a **methodological preference for stability**, not a moral imperative.
  *   If you prioritize **Stability & Consistency**: Keep IIA (accept that you must restrict Domain or accept Dictatorship/Cycles).
  *   If you prioritize **Majoritarian Will**: Drop IIA (accept Spoilers and Manipulability).

  ### V. Summary of Trade-Offs (The "Menu")

  Since you cannot have it all, here are the standard "packages" available to you. You must choose one column.

  | Feature | **Condorcet Methods** (e.g., Schulze, Ranked Pairs) | **Positional Methods** (e.g., Borda) | **Plurality / IRV** | **Cardinal / Score** |
  | :--- | :--- | :--- | :--- | :--- |
  | **Condorcet Winner** | **Always Elects** | Sometimes Fails | Often Fails | N/A (Cardinal) |
  | **IIA (No Spoilers)** | **Fails** | **Fails Badly** | **Fails** | **Fails** |
  | **Monotonicity** | Passes | Passes | **IRV Fails** | Passes |
  | **Strategy-Proof** | **No** (GS Theorem) | **No** (Burying) | **No** (Lesser-evil) | **No** (Min/Maxing) |
  | **Information Used** | Pairwise Comparisons | Full Ranking Depth | Top Choice (IRV: Top until win) | Intensity Scores |
  | **Primary Flaw** | Participation Paradox (Voting hurts) | Clone Dependence | Spoiler Effect / Wasted Votes | Strategic Exaggeration |
  | **Philosophy** | "Who can beat whom?" | "Who is the consensus?" | "Who has the most base?" | "Who maximizes utility?" |

  ### Final Advice for Your Course

  When you read the next proposal, do not ask "Does this satisfy all criteria?" (The answer is no). Ask:
  1.  **Which axiom did they sacrifice?** (Usually IIA or Strategy-Proofness).
  2.  **Is that sacrifice justified by the use case?** (e.g., A legislature might tolerate cycles [Drop T] to preserve debate; a presidential election needs a winner [Drop T via Tie-break]).
  3.  **Are they hiding the cost?** (e.g., IRV defenders often downplay Monotonicity failures; Condorcet defenders often downplay the No-Show paradox).

  The "wall" you hit is the realization that **voting is not about finding the 'true' will of the people; it is about aggregating conflicting wills with minimal damage.** The math proves there is no damage-free path.
