answer: |-
  Here is a decision procedure designed for your committee. It is grounded in the literature on moral trade (specifically drawing on work by William MacAskill, Toby Ord, and Christian Tarsney regarding normative uncertainty and cooperative bargaining), but streamlined for a 30-minute practical discussion.

  Following the procedure, I have run it on your two proposals and provided the confidence assessment you requested.

  ***

  # The Moral Trade Evaluation Protocol (MTEP)

  **Time required:** 30 minutes
  **Goal:** To determine whether a proposed cooperation yields net moral value without violating core constraints against complicity or integrity loss.
  **Instructions:** Go through steps 1–5 in order. If any step triggers a **STOP**, the proposal is rejected unless the committee votes to override (see Step 6).

  ### Step 1: The Pareto Check (5 mins)
  *Does this trade actually create value for both parties compared to the status quo?*
  *   **Question:** If we do this, do we expect to achieve more of what *we* value than if we acted alone?
  *   **Question:** Is the partner group genuinely gaining something they value more than what they are giving up?
  *   **Decision:**
      *   If **No** (e.g., we lose resources, or they aren't actually helping): **REJECT**.
      *   If **Yes**: Proceed to Step 2.

  ### Step 2: The Robust Wrongness Constraint (10 mins)
  *This is the most critical philosophical filter. It addresses the fear of 'selling out' or facilitating harm.*
  *   **Question:** Does the action we are agreeing to take (the 'cost' side of the trade) involve doing something that is likely morally wrong across *most* plausible moral theories we hold?
  *   **Test:** Imagine our credence (confidence) is distributed across Utilitarianism, Liberal Deontology, and Virtue Ethics. Is the action prohibited by the majority of that weight?
  *   **Key Distinction:** Is this merely a *difference of priority* (e.g., they like art, we like health) or a *conflict of rights/harm* (e.g., they want to restrict liberty, we want to protect it)?
  *   **Decision:**
      *   If **Yes** (It is robustly wrong/high risk of harm): **REJECT**. (Do not trade for moral complicity).
      *   If **No** (It is merely suboptimal or a difference of focus): Proceed to Step 3.
      *   *Flag:* **Judgement Call.** There is no formula for 'plausible moral theories'. The committee must list the top 3 moral views held by members and check consensus.

  ### Step 3: The Integrity & Signal Check (5 mins)
  *Even if an act isn't 'wrong', does it undermine our ability to do good in the future?*
  *   **Question:** Does this partnership signal an endorsement of the partner's views that would confuse our members or donors?
  *   **Question:** Does this set a precedent that makes it harder to refuse worse partners later? (The 'Slippery Slope' test).
  *   **Decision:**
      *   If **High Risk** of reputational damage or mission drift: **REJECT** or **MODIFY**.
      *   If **Low Risk**: Proceed to Step 4.

  ### Step 4: The Uncertainty Weighting (5 mins)
  *How sure are we that we are right and they are wrong?*
  *   **Question:** Is there significant moral uncertainty on our side regarding their cause? (e.g., Are we 99% sure they are wrong, or 60% sure?)
  *   **Logic:** Moral trade is most permissible when moral uncertainty is high. If we are near-certain their cause is harmful, trade is less permissible.
  *   **Decision:**
      *   If we are **Near-Certain** they are mistaken on a high-stakes issue: Lean towards **REJECT**.
      *   If we have **Significant Uncertainty** or the stakes are low: Lean towards **ACCEPT**.

  ### Step 5: The Practical Feasibility (5 mins)
  *   **Question:** Are the logistical costs (time, admin, attendance risk) worth the moral gain?
  *   **Decision:**
      *   If **No**: **REJECT**.
      *   If **Yes**: Proceed to Step 6.

  ### Step 6: Final Verdict
  *   **ACCEPT:** Passed all steps with low risk.
  *   **REJECT:** Failed Step 2 or 3 decisively.
  *   **VOTE:** Passed Step 1 and 4, but Step 2 or 3 yielded significant disagreement. (This acknowledges that the theory runs out and democratic decision-making takes over).

  ***

  # Running the Protocol on Your Proposals

  Here is how the MTEP applies to the two scenarios you provided. I have applied the logic strictly, even where the result might be uncomfortable.

  ## Proposal 1: Catholic Society Joint Fundraiser
  **The Deal:** 50% proceeds to Global Health (EA priority), 50% to Pro-Life Pregnancy Centre (EA concern).

  *   **Step 1 (Pareto):** **PASS.** You get more global health funding than doing it alone; they get legitimacy and funds.
  *   **Step 2 (Robust Wrongness):** **FAIL / HIGH RISK.**
      *   *Analysis:* This is the sticking point. For most EAs, the moral status of the foetus is not the primary uncertainty; the primary concern is often the *consequences* of restricting reproductive access (maternal health, autonomy, economic impact). If the pregnancy centre actively discourages medical abortion or provides misleading medical information, this violates the 'harm' principle across Utilitarian, Liberal, and Rights-based frameworks.
      *   *Philosophical Ground:* Christian Tarsney notes that moral trade is impermissible if it involves 'cooperating in evil'. If your group assigns high credence to the view that restricting abortion access causes significant net harm, facilitating this is robustly wrong *relative to your credence distribution*.
  *   **Step 3 (Integrity):** **FAIL.**
      *   *Analysis:* A 50/50 split signals equal moral weight. This suggests your group views 'pro-life' activism as equally valuable as global health. This creates significant reputational risk and member alienation.
  *   **Step 4 (Uncertainty):** **LOW UNCERTAINTY.**
      *   *Analysis:* Your group likely holds high confidence that global health is good and high confidence that restricting reproductive rights is harmful. There is little 'moral uncertainty' to leverage here.
  *   **Verdict:** **REJECT.**
      *   *Reasoning:* While this looks like a trade, it fails the 'Robust Wrongness' constraint. You are not trading priorities (like art vs. health); you are potentially trading resources for an activity your moral framework identifies as harmful.
      *   *Uncomfortable Truth:* Even though you get more global health funding, the protocol suggests you cannot accept funds 'tainted' by complicity in an act you deem robustly harmful.

  ## Proposal 2: Animal Rights Society Catering Deal
  **The Deal:** They provide labour for your fundraising drive; you make all events plant-based for a year.

  *   **Step 1 (Pareto):** **PASS.** You get labour (more money raised); they get promotion of veganism. You value animal welfare, so their goal isn't alien to you.
  *   **Step 2 (Robust Wrongness):** **PASS.**
      *   *Analysis:* Is serving plant-based food 'robustly wrong'? Almost no plausible moral theory held by EAs prohibits vegan catering. Conversely, many EA moral theories (Utilitarian, Rights-based) view factory farming as a significant moral negative. Therefore, moving to plant-based catering is morally safe, and potentially morally positive.
  *   **Step 3 (Integrity):** **PASS.**
      *   *Analysis:* This aligns with EA values (animal welfare is a core cause area). It signals consistency, not compromise.
  *   **Step 4 (Uncertainty):** **MODERATE.**
      *   *Analysis:* Some members might think meat-eating is permissible. However, the uncertainty leans in favour of the trade (i.e., even if you aren't sure meat is *wrong*, you are likely sure it isn't *required*).
  *   **Step 5 (Practicality):** **PASS (Conditional).**
      *   *Analysis:* Only fails if the attendance drop is catastrophic. Assuming a manageable reduction, the moral gain outweighs the logistical cost.
  *   **Verdict:** **ACCEPT.**
      *   *Reasoning:* This is a textbook permissible moral trade. You are trading a low-cost constraint (catering preference) for high-value labour, towards ends that are not in moral conflict.

  ***

  # Confidence Assessment

  **Overall Confidence in Framework: 75%**
  I am confident that this procedure accurately reflects the consensus view in the moral uncertainty literature (specifically the 'Negotiation Approach' advocated by MacAskill and Tarsney). It correctly identifies that moral trade is not just about expected value maximisation but is constrained by deontological limits on complicity.

  **Least Certain Step: Step 2 (The Robust Wrongness Constraint)**
  I am least sure about how your committee will operationalise 'Robust Wrongness'.
  *   *Why:* The philosophical literature does not give a precise formula for aggregating credences across different moral theories. For example, in Proposal 1, a Catholic member might argue that *not* supporting the pregnancy centre is the 'robust wrong'. The procedure assumes the EA group's credence distribution is the baseline, but in a pluralistic committee, defining the 'plausible moral theories' is itself a political act.
  *   *Risk:* This step requires the most honest, good-faith discussion. If the committee cannot agree on what counts as 'harm', this step becomes a vote disguised as a principle.

  **Final Note for the Committee:**
  The purpose of this procedure is not to remove the need for judgement, but to force you to locate *where* the judgement is needed. In Proposal 1, the judgement is about complicity in harm. In Proposal 2, the judgement is about logistical cost. Do not confuse the two.

  Good luck with the vote.
