prompt: |-
  ok so i'm taking this module on moral uncertainty and cooperation (it's a fourth-year philosophy course, mostly about what you should do when you're not sure about morality or when you have to cooperate with people who disagree with you morally). one of the topics we covered is moral trade — the idea is, suppose i think cause X is the most morally important thing and you think cause Y is. i agree to spend some of my resources on Y (which i think is less important than X) if you agree to spend some of yours on X (which you think is less important than Y). by both our lights we come out ahead — i get more X than i would have, you get more Y. the question is when this is actually permissible vs. when it involves compromising on something you shouldn't compromise on.

  the thing is, i also sit on the comittee of my uni's effective altruism group, and we keep getting proposals for exactly this kind of thing. like, the catholic society wants to do a joint fundraising event where half the proceeds go to a global health charity (which we're into) and half go to a pro-life pregnancy centre (which a lot of our members are pretty uncomforable with). or the environmental society wants us to co-sponsor a speaker series: they get to pick some speakers on degrowth and we get to pick some on AI safety, and we think the degrowth stuff is honestly a bit harmfull but they think the AI safety stuff is a distraction from climate.

  we do NOT have a good way of thinking about these. we either go with our gut or we get into endless arguments about whether something is "selling out" or just being reasonable pluralists. i want something i can actually run.

  so: can you write me a decision procedure — like a checklist or a sequence of questions — that our committee can use to evaluate a proposed moral trade? it should be grounded in whatever the philosophical literature actually says about moral trade (not just vibes), but it has to be usable by people who haven't read any of that. we've got maybe half an hour to discuss a proposal before we vote, so the procedure needs to fit into that.

  the procedure should tell us when to accept, when to reject, and when it genuinely could go either way and we just have to vote. it should also flag the points where the theory doesn't settle things and we're making a judgement call.

  then please run it on two proposals:
  (1) the joint fundraiser with the catholic society (global health / pro-life centre, 50/50 split), and
  (2) a proposal from the animal rights society: they'll help us with our global health fundraising drive if we agree to make all our events plant-based for the next year (we currently don't have a catering policy, and some of our members think it'd reduce attendance).

  i want you to be honest if the procedure spits out an answer we won't like for one of these.

  also: please say how confident you are in the overall framework, and single out the specific claim or step you're least sure about. and write in british english please — i'm at a uk uni.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Context:** 4th-year Philosophy module on Moral Uncertainty and Cooperation. Topic: Moral Trade.
      *   **User Role:** Committee member of a university Effective Altruism (EA) group.
      *   **Problem:** Receiving proposals for moral trades (e.g., joint fundraising with Catholic Society, co-sponsorship with Environmental Society, deal with Animal Rights Society). No structured way to evaluate them. Current method is "gut feeling" or endless arguments about "selling out."
      *   **Task:** Create a decision procedure (checklist/sequence of questions) grounded in philosophical literature on moral trade but usable by non-specialists within 30 minutes.
      *   **Requirements:**
          *   Tell when to Accept, Reject, or Vote (undecided).
          *   Flag where theory ends and judgement begins.
          *   Run the procedure on two specific proposals: (1) Catholic Society (Global Health vs. Pro-Life), (2) Animal Rights Society (Global Health vs. Plant-Based Catering).
          *   Be honest about unpopular answers.
          *   State confidence level in the framework.
          *   Identify the least certain step/claim.
          *   **Language:** British English (UK university context).

  2.  **Philosophical Grounding (Moral Trade Literature):**
      *   *Key Concepts:* Moral Uncertainty, Normative Uncertainty, Moral Trade, Compromise, Integrity, Harmful Cooperation.
      *   *Key Authors/Theories:*
          *   William MacAskill (Moral Uncertainty, "The Negotiation Approach").
          *   Toby Ord (Moral Trade).
          *   Christian Tarsney (Moral Trade, "The Case for Moral Trade").
          *   Issues of "Corruption" or "Integrity" (Bernard Williams-ish concerns, though applied to collective action).
          *   Issues of "Harmful Cooperation" (helping someone do something morally bad).
          *   Expected Value under Moral Uncertainty (MEC - Maximising Expected Choice-worthiness).
      *   *Core Tension:* Gaining expected value by trading resources vs. the risk of facilitating moral wrongs or compromising integrity.
      *   *Constraints:* Trades shouldn't involve facilitating actions that are *robustly* wrong (wrong across most plausible moral theories) or violate deontological constraints that are highly probable.

  3.  **Drafting the Decision Procedure:**
      *   *Goal:* Needs to be fast (30 mins), clear, and actionable.
      *   *Structure:* A flowchart or numbered checklist with "Stop/Go" conditions.
      *   *Steps:*
          1.  **Feasibility/Value Check:** Is there actually a gain? (Pareto improvement).
          2.  **Robust Wrongness Check:** Does the trade involve doing something that is likely wrong on *most* credible moral theories? (The "No Harmful Cooperation" constraint).
          3.  **Integrity/Identity Check:** Does this undermine the group's core mission or integrity to the point where the trade defeats the purpose? (The "Corruption" constraint).
          4.  **Uncertainty Check:** How confident are we in our moral views vs. theirs? (Weighting).
          5.  **Precedent/Signal Check:** What does this say to outsiders/members? (Reputational risk).
          6.  **Final Decision:** Accept, Reject, or Vote.

      *   *Refining for the User:* Make it sound like a tool, not a lecture. Use EA terminology but explain it simply. Ensure British spelling (organisation, programme, centre, etc.).

  4.  **Running the Procedure on Proposals:**

      *   **Proposal 1: Catholic Society (Global Health vs. Pro-Life).**
          *   *Trade:* 50% funds to GH (EA likes), 50% to Pro-Life Centre (EA uncomfortable with).
          *   *Analysis:*
              *   Value: Yes, more GH funding than doing it alone.
              *   Robust Wrongness: This is the sticking point. Many EAs view pro-life activism (depending on the centre's activities) as potentially harmful or restricting autonomy. If the centre provides medical advice that is misleading or restricts abortion access, many moral theories (utilitarian, liberal deontological) condemn it.
              *   Integrity: EA is secular/consequentialist usually. Aligning with religious pro-life might signal endorsement.
              *   *Verdict:* Likely Reject or High Risk. The "Robust Wrongness" check is the hurdle.
          *   *Honesty:* I need to be honest that this might be rejected based on the "harmful cooperation" principle, even if it looks like a trade.

      *   **Proposal 2: Animal Rights Society (Global Health Drive vs. Plant-Based Catering).**
          *   *Trade:* They help fundraise; we go vegan for events.
          *   *Analysis:*
              *   Value: More fundraising help. Cost: Catering restriction.
              *   Robust Wrongness: Is serving meat *robustly* wrong? Many EAs think factory farming is bad. Plant-based is rarely seen as *wrong* (maybe inconvenient).
              *   Integrity: Aligns well with EA values (animal welfare is a core EA cause).
              *   Attendance Risk: Practical constraint, not necessarily moral.
              *   *Verdict:* Likely Accept.
          *   *Honesty:* Some members might dislike the catering restriction, but morally it's cleaner than Proposal 1.

  5.  **Refining the Framework & Confidence:**
      *   *Confidence:* High on the general structure (based on MacAskill/Tarsney), but moderate on the application because "Robust Wrongness" is subjective.
      *   *Least Certain Step:* Determining what counts as "Robustly Wrong" vs. "Merely Disagreed Upon." This is the crux of moral uncertainty.

  6.  **Writing the Response (incorporating British English):**
      *   *Tone:* Professional, academic but practical, empathetic to the committee's position.
      *   *Formatting:* Clear headings, bullet points, bold text for emphasis.
      *   *Check:* Ensure "organisation," "centre," "programme," "modelling" are spelled correctly.
      *   *Check:* Ensure the 30-minute constraint is respected (keep the procedure concise).

  7.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is the procedure too utilitarian?
      *   *Fix:* Acknowledge deontological constraints in the "Robust Wrongness" step. It's not just about outcomes; it's about complicity.
      *   *Critique:* Is the Catholic Society example too sensitive?
      *   *Fix:* Handle it carefully. Focus on the *activities* of the pregnancy centre (e.g., do they provide medical misinformation?) rather than attacking Catholicism generally. This aligns with the EA focus on evidence and harm.
      *   *Critique:* Did I answer the "confidence" part?
      *   *Fix:* Add a specific section at the end.

  8.  **Final Polish:** Check against the prompt requirements one last time.
      *   Decision procedure? Yes.
      *   Grounded in literature? Yes (MacAskill, Tarsney, etc.).
      *   Usable in 30 mins? Yes.
      *   Accept/Reject/Vote outcomes? Yes.
      *   Flag judgement calls? Yes.
      *   Run on 2 proposals? Yes.
      *   Honest about unpopular answers? Yes.
      *   Confidence level + least sure step? Yes.
      *   British English? Yes.

  *(Self-Correction on Proposal 1)*: I need to be careful not to assume all pro-life centres are the same. The procedure should flag the *investigation* of the centre's activities as a crucial step. If they just offer counselling vs. if they actively block clinics. I will assume for the sake of the exercise that there is significant moral disagreement on the *status of the foetus*, which makes it a high-stakes moral uncertainty case. However, from an EA perspective, restricting abortion is often seen as causing significant harm (unintended pregnancies, etc.). I will lean towards "Reject" or "Vote with heavy caution" based on the risk of facilitating harm. Actually, to be philosophically rigorous: if there is high moral uncertainty about the status of the foetus, trading *for* a pro-life cause might be permissible *if* one assigns non-zero credence to pro-life views. BUT, most EAs assign very low credence to "abortion is murder." So, facilitating it might be seen as facilitating a robust wrong *relative to the group's credence distribution*. I will guide the procedure to flag this as a "Complicity Risk."

  *(Self-Correction on Proposal 2)*: This is a classic moral trade. The cost is minor (catering), the gain is labour. The moral cost of eating meat is high for many EAs. This should come out as "Accept."

