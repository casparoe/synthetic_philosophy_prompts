  *   Nomic Necessity: This asserts that integrated information is a prerequisite for experience under the actual laws of nature. Any system lacking causal integration cannot possess phenomenology, though integration alone might not guarantee consciousness without additional biological or functional factors being present. It permits zombies with low integration but not high.
  *   Nomic Sufficiency: This asserts that possessing sufficient integrated information guarantees consciousness under the actual laws of nature. Any system meeting the $\Phi$ threshold must have some corresponding phenomenology, implying even simple non-biological systems like grids could have faint experiences if their causal structure is rich enough. It forces acceptance of panpsychism in complex non-biological systems.
  *   Ontological Identity: This claims consciousness and integrated information are ontologically identical; the experience and the causal structure are one and the same thing described differently. There is no metaphysical gap, meaning high $\Phi$ without experience is logically impossible, not just nomically impossible, settling all conceivability arguments. It makes the hard problem dissolve by definition.
  *   Structural Isomorphism: This claims the qualitative character of experience is determined by the specific shape of the cause-effect structure. It argues $\Phi$ captures the essence of phenomenological structure, explaining why experience feels unified rather than fragmented, and maps specific causal powers to specific qualia. It connects the axiom of composition to causal integration.
  *   Exhaustive Explanation: This claims integrated information is the sole fundamental property required for consciousness. It denies that any other substrate properties matter, asserting that once $\Phi$ is accounted for, there is nothing left to explain about the existence of experience. It excludes other potential consciousness generators entirely. It makes $\Phi$ the unique realizer.

  Verdicts
  *   Trivial. Consistent with data but fails to answer metaphysical questions about novel systems. It offers no theoretical protection against dissociation scenarios. This reading cannot shut down the skeptic. It is scientifically safe but philosophically weak.
  *   Substantive-but-defensible. Plausible given neural data, but vulnerable to cases of unconscious integration. It leaves open why biology might still be required. It allows for high $\Phi$ without experience if biology is missing. It protects against some zombies but not all.
  *   Substantive-but-defensible. Core IIT claim, but counterintuitive regarding panpsychism and difficult to verify empirically. It demands we accept experience in simple grids. This is the standard theoretical commitment. It invites panpsychist criticisms directly.
  *   False (or controversial). Collapses the explanatory gap by fiat; many philosophers reject psychophysical identity without mechanism. It assumes the conclusion it seeks to prove. This is the strongest metaphysical claim. It eliminates the hard problem by definition.
  *   Substantive-but-defensible. Matches IIT's axioms well, but relies on assuming the structure of experience matches causal structure perfectly. It requires accepting the axioms as self-evident. It explains qualia structure. It maps information geometry to feeling.
  *   Substantive-but-defensible. Strong claim, but risks ignoring substrate-specific intuition pumps like China Brain. It denies multiple realizability beyond causal structure. It makes $\Phi$ the unique realizer. It is exclusive and reductionist.

  What the dismissal needs
  To shut down the question about high $\Phi$ without experience, your group member cannot rely on correlation or mere necessity. Those readings allow for the possibility that the link breaks in novel cases. They need the Ontological Identity or Nomic Sufficiency reading. Only if consciousness is integrated information (identity) or if laws of nature guarantee experience given $\Phi$ (sufficiency) does the question become logically or nomically impossible. However, asserting identity simply restates the theory as fact, begging the question against skeptics. The dismissal works only if you accept IIT's postulates as proven truths rather than hypotheses. Thus, the phrase functions as a dogmatic boundary marker, shielding the theory from falsification by defining counterexamples out of existence. It shifts the burden of proof onto the questioner to disprove the identity claim, rather than the theorist proving the link.
