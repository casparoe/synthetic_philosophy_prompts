answer: |-
  You have hit on exactly the two pressure points that keep moral philosophers awake at night regarding the Doctrine of Double Effect (DDE). Your intuitions are remarkably consistent with a specific, robust version of DDE, but you are rightly suspicious of where the lines are drawn.

  Here is an analysis of your verdicts, the principle that captures them, where you might need to revise, and the verdict on the self-driving car.

  ### 1. The Principle Capturing Your Verdicts
  Your verdicts align with a **Rights-Based Double Effect** principle. It looks something like this:

  > An act with both good and bad effects is permissible if:
  > 1.  **Nature of the Act:** The act itself is not inherently wrongful (e.g., not reckless, not murder).
  > 2.  **Means Constraint:** The bad effect is not used as a *means* to achieve the good effect (you don't leverage the harm).
  > 3.  **Intention Constraint:** The bad effect is not *intended* (it is not part of the plan's success conditions).
  > 4.  **Proportionality:** The good effect is sufficiently weighty to justify the risk of the bad effect.

  Your anxiety stems from two specific areas: the metaphysics of **Intention** (Bombing/Morphine) and the definition of **Means/Directness** (Boulder/Loop).

  ### 2. Addressing the "Mental State" Worry (Bombing & Morphine)
  You asked: *"Is that really where I want to locate the moral difference? Only the general's mental state changes."*

  This is the most common objection to DDE. However, DDE defenders argue intention is not just a "ghostly mental feeling"; it is structural to the **plan**. To resolve your worry, apply the **Counterfactual Test**:

  *   **Tactical Bombing:** If the civilians miraculously survived (e.g., they all ducked into a bunker), would the mission be a failure? **No.** The factory is still destroyed. Therefore, their death was not part of the plan.
  *   **Terror Bombing:** If the civilians miraculously survived, would the mission be a failure? **Yes.** The morale wouldn't break. Therefore, their death *was* the plan.

  **Verdict:** You do not need to revise these verdicts. The distinction isn't "subjective mental state"; it is "objective role in the plan." Your intuition that the General with Terror Intent is doing something wrong is the core of DDE. It treats persons as *objects* to be consumed rather than *subjects* who are unfortunately harmed.

  ### 3. Addressing the Boulder Case (The "Directness" Worry)
  You wrote: *"By the textbook criteria, this should be permitted. But my gut says absolutely not."*

  Actually, standard DDE agrees with your gut. You are likely overlooking **Condition 1 (Nature of the Act)** and **Condition 4 (Proportionality)**.

  *   **Nature of the Act:** Pushing a boulder off a cliff onto a hiking path is inherently reckless. It is not a "neutral" act like administering medicine or dropping bombs on a military target. It creates an uncontrolled lethal hazard.
  *   **Proportionality:** Clearing a hiking path is a trivial good. Saving five lives (Trolley) or curing cancer (Hysterectomy) are weighty goods. DDE requires the good to *proportionally* outweigh the bad. A cleared path does not outweigh a human life.

  **Verdict:** Your gut is right, but not because DDE fails. It's because the case fails the **Proportionality** and **Recklessness** criteria, not necessarily the Intention criteria. If the good were "clearing the path to rush a dying person to the hospital," the calculation changes, but the recklessness of the act remains a hurdle.

  ### 4. The Inconsistency: The Loop Case
  Here is where your verdicts might need revision if you want strict coherence.

  *   **Switch:** Permissible (Death is side effect).
  *   **Footbridge:** Impermissible (Death is means).
  *   **Loop:** You said **Permissible**.

  Strict DDE usually classifies **Loop** as **Impermissible**, closer to Footbridge. In the Loop case, the one person on the track stops the trolley. Their body is physically necessary to absorb the impact to save the five. They are being *used* as a brake.
  *   If you say Loop is **Fine**, you are implicitly accepting a **Utilitarian "Lesser Evil"** justification for that specific case, or you are arguing that "being a causal obstacle" is different from "being a means."
  *   **Recommendation:** If you want to stick with DDE, you should probably revise Loop to **Not Fine**. If you keep it as Fine, you are admitting that sometimes "saving more lives" trumps the "means constraint," which weakens your objection to Footbridge.

  ### 5. The Self-Driving Car Case
  *Case: A car swerves to avoid five pedestrians, foreseeing it will hit one person on the sidewalk. The path was chosen specifically because it would hit **that person** rather than swerving the other way into a crowd of two.*

  This is a fascinating hybrid of *Switch* and *Terror Bombing*.

  1.  **The Act:** Swerving to minimize harm.
  2.  **The Selection:** The system specifically selects *which* individual dies to save the others.

  **Analysis:**
  In the *Switch* case, the one person is not *selected*; they just happen to be on the side track. In *Terror Bombing*, the civilians are *selected* to die to achieve the goal.
  In your car case, the single pedestrian is **selected** to absorb the impact to save the two (and the five). The car is effectively saying, "This specific person's body is the optimal resource to stop this car/save the others."

  **Verdict: Not Fine.**
  Under your principle (and strict DDE), this is impermissible.
  *   **Why?** It violates the **Means/Selection Constraint**. By specifically choosing *that* person, you are making their death part of the optimization algorithm. You are treating them as a variable to be sacrificed, not merely as a victim of a side effect.
  *   **Contrast:** If the car swerved to the sidewalk because it was the *only* open path, and a person *happened* to be there (like the Switch), it is Permissible.
  *   **Contrast:** If the car swerved to the sidewalk *because* it calculated hitting one specific person was better than hitting two others, it is Impermissible. It turns the one person into a means of saving the two.

  ### Summary of Recommendations

  1.  **Trust your "Mental State" intuitions:** The distinction between Tactical and Terror bombing is robust. It relies on the *structure of the plan* (Counterfactual Test), not just vibes. Keep these verdicts.
  2.  **Explain the Boulder via Proportionality:** The Boulder case isn't a failure of DDE; it's a failure of Proportionality and Recklessness. A hiking path isn't worth a life.
  3.  **Re-evaluate the Loop:** To be consistent with Footbridge, you should probably mark Loop as **Not Fine**. If the person's body is required to stop the threat, they are being used.
  4.  **Self-Driving Car:** **Not Fine.** Selecting a specific victim to minimize casualties treats that victim as a means/resource, violating the inviolability constraint central to your other verdicts.

  **Does DDE hang together?**
  Yes, but only if you define "Intention" objectively (via the Counterfactual Test) and enforce "Proportionality" strictly. Your intuitions are actually more consistent than you give them credit for; you were just missing the specific criteria (Proportionality and Plan Structure) that justify them.
