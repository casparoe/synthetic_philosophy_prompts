answer: |-
  1. The phrase "uninstructive contempt" picks out critics who reject the Society's aims without offering reasoned arguments or evidence. It describes an attitude of dismissal that refuses to engage with the substance of the prospectus.
  2. Sidgwick deems the criticism unhelpful because it fails to provide specific objections that could improve the Society's methodology or understanding. Such rejection is based on preconceived notions rather than an evaluation of the proposed empirical methods.
  3. This contrast establishes Sidgwick's impartiality by acknowledging that not all public reception has been hostile. It isolates the contempt as merely one option among others, thereby reducing its rhetorical weight against the Society.
  4. The variety of responses indicates that psychical research was a contested field lacking consensus within the intellectual community. The existence of contempt alongside cordiality suggests it was viewed as borderline legitimate, sparking debate rather than universal acceptance.
  5. Sidgwick frames the Society as a scientific enterprise deserving of the same critical engagement afforded to established disciplines. By rejecting contempt in favor of instructive criticism, he asserts that the Society operates within the norms of rational inquiry rather than outside them.
