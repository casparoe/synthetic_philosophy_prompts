answer: |-
  You have identified a profound and under-modeled dynamic. You are correct that standard game theory and political economy often treat the *capacity to coordinate* (institutions, trust, capital, communication channels) as exogenous variables—background conditions that exist prior to the game.

  In the pattern you are describing, that capacity is an **endogenous variable** that is actively depleted by the game itself.

  There is no single, universally canonical "household name" for this exact configuration (like "Prisoner's Dilemma"), but it is recognized in specific subfields under a few overlapping concepts. Here is the breakdown of the existing terminology, the game-theoretic mechanics, and a proposed name for the specific configuration you've identified.

  ### 1. The Closest Existing Terms

  **A. The Capability Trap (Development Economics)**
  This is the strongest academic match. Coined prominently by Lant Pritchett, the **Capability Trap** describes states where low administrative capacity leads to poor service delivery, which leads to low citizen trust and legitimacy, which leads to reduced tax compliance and political support, which further reduces administrative capacity.
  *   **Fit:** It matches your mechanism perfectly: the failure consumes the resources needed to fix the failure.
  *   **Limit:** It is usually applied to state bureaucracy rather than general social coordination or industry dynamics.

  **B. The Conflict Trap (Political Economy)**
  Paul Collier's **Conflict Trap** describes how civil war destroys the very institutions (legal, economic, social) required to maintain peace. The outcome of the bad equilibrium (war) makes the probability of returning to the bad equilibrium higher by destroying the "peace infrastructure."
  *   **Fit:** Matches the "erosion of capacity" aspect.
  *   **Limit:** Specific to violence and civil war.

  **C. Hysteresis (Systems Theory/Economics)**
  **Hysteresis** refers to a system where the state depends on its history, specifically where a temporary shock causes permanent damage to the system's capacity. For example, long-term unemployment erodes skills, making re-employment harder even if the economy recovers.
  *   **Fit:** Captures the "scarring" effect where the problem leaves you weaker than you were before.
  *   **Limit:** It describes the *lag* or *persistence*, not necessarily the active consumption of coordination tools.

  ### 2. The Game-Theoretic Mechanism: Endogenous Constraints

  In standard repeated games (like an iterated Prisoner's Dilemma), cooperation is sustained by the "shadow of the future." Players cooperate because they value future payoffs enough to sacrifice short-term gain. This is mathematically represented by a **discount factor ($\delta$)**.

  In your pattern, the bad equilibrium actively lowers $\delta$.
  *   **Standard Model:** $\delta$ is fixed. If $\delta$ is high enough, you can coordinate.
  *   **Your Model:** The stress of the bad equilibrium (cash starvation, disaster relief costs, survival mode) forces actors to hyper-discount the future. They *cannot* value the long-term treaty because the short-term pressure is consuming their ability to wait.

  Furthermore, standard models assume the **action space** is fixed (you can choose to Cooperate or Defect). In your pattern, the action space shrinks. The "Cooperate" button literally falls off the console because the institution required to enforce the cooperation has dissolved. This is a game with **Endogenous Constraints**.

  ### 3. Proposed Terminology

  Since no single term captures the *coordination-specific* erosion you are describing, the most precise way to label this is:

  **Endogenous Coordination Decay**

  Or, if you want a noun phrase for the trap itself:

  **The Coordination Capability Trap**

  **Why this distinction matters:**
  In a standard **Tragedy of the Commons**, the resource is depleted (the fish are gone), but the *fishermen's ability to talk and sign a treaty* remains intact. If they sign a treaty, they can restock the pond.
  In **Endogenous Coordination Decay**, the fish are gone, *and* the meeting hall burned down, *and* the fishermen are too hungry to sit still for a negotiation. The solution requires a resource (coordination capacity) that the problem has eaten.

  ### 4. How to Distinguish It (The Diagnostic)

  To distinguish this from a standard collective action problem, ask this question:

  > *"If we magically solved the trust problem today, would we have the resources/institutions to implement the solution?"*

  *   **Standard Collective Action Problem:** Yes. If we trust each other, we can sign the treaty and fix it. The barrier is purely *incentive alignment*.
  *   **Endogenous Coordination Decay:** No. Even if we trust each other, the institutions are too weak, the budget is too shot, or the political capital is too depleted to execute the fix. The barrier is *capacity erosion*.

  ### 5. Why This Is Dangerous (The "Doom Loop")

  This configuration is more dangerous than a standard Moloch/Multipolar trap because it is **time-asymmetric**.
  *   In a standard trap, you can jump out at any time if you solve the incentive problem.
  *   In this trap, **delay is compounding.** Every day you stay in the bad equilibrium, the probability of escape decreases not just because the damage gets worse, but because the *machinery required to repair the damage* gets weaker.

  This is often why "kicking the can down the road" on issues like climate change or debt is so catastrophic. It isn't just that the problem gets bigger; it's that the *political and economic immune system* required to solve it gets suppressed by the stress of managing the symptoms.

  ### Summary
  While **Capability Traps** and **Conflict Traps** are the closest academic siblings, the specific dynamic you are describing—where the *coordination mechanism itself* is the resource being consumed—is best described as **Endogenous Coordination Decay**. It transforms a static incentive problem into a dynamic survival race against the erosion of your own ability to cooperate.
