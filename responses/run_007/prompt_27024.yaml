answer: |-
  This configuration is best identified as **Semantic Incommensurability** (often discussed under the label **Meaning Variance**), though your account correctly rejects the relativist gloss that such shifts preclude rational theory choice.

  The phenomenon you describe matches Thomas Kuhn's specific thesis of **Semantic Incommensurability**, where terms like "mass" or "species" retain their orthography but change their reference and inferential role across paradigms. While popular interpretations often conflate incommensurability with incomparability (implying irrationality), Kuhn's later work and subsequent scholarship clarify that it denotes **translation failure** rather than **comparison failure**. The lack of a neutral language arises from **Semantic Holism**, where the meaning of a term is determined by its place in the entire theoretical network; thus, changing the network changes the term. However, rational comparison remains possible through shared epistemic values (accuracy, consistency, scope, simplicity, fruitfulness), even if these values do not algorithmically dictate a choice.

  Your description of the transition as a "gestalt shift" rather than a deduction aligns with Kuhn's use of the duck-rabbit analogy to describe how scientists learn to see the world differently under a new paradigm. This distinguishes the phenomenon from **Theory-Ladenness**, which concerns how observations are interpreted, whereas Semantic Incommensurability concerns the constitutive meanings of the concepts themselves. It also differs from general **Semantic Holism**, which is the structural condition enabling meaning variance, whereas Incommensurability is the historical and epistemic situation resulting from it.

  If a more precise label is required to distinguish this rational, meaning-shifting transition from the relativist caricature, Michael Friedman's term **Dynamics of Reason** captures the mechanism by which framework changes are rationally mediated through "constitutive a priori" principles. Alternatively, Hasok Chang's work on **Epistemic Iteration** describes this process as maintaining continuity of purpose despite conceptual change. However, within the standard taxonomy, **Semantic Incommensurability** remains the established term, provided it is understood as compatible with rational progress driven by problem-solving efficacy rather than neutral proof.
