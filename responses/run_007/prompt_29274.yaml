answer: |-
  ### Essay Question

  Deflationary accounts of self-deception dissolve the traditional paradox by rejecting the requirement that the self-deceiver intentionally deceive themselves or hold contradictory beliefs. Instead, they characterize self-deception as a species of motivationally biased belief formation, structurally similar to ordinary wishful thinking. Critically evaluate this strategy. Specifically, argue whether deflationism successfully preserves the core phenomenon of self-deception or merely changes the subject. In your answer, identify at least one distinctive feature of self-deception that is lost on the deflationary view and assess whether this loss is philosophically acceptable.

  ***

  ### Model Answer

  The traditional paradox of self-deception posits that one must simultaneously know the truth ($p$) and believe the lie ($\neg p$) to deceive oneself, a state that seems psychologically impossible or logically contradictory. Deflationary accounts resolve this by removing the intention to deceive. On this view, the agent does not set out to trick themselves; rather, their desire for $p$ to be true biases their evidence-gathering and reasoning processes until they sincerely believe $p$. While this successfully dissolves the logical paradox, I argue that it fails to preserve the phenomenological and normative core of self-deception. By reducing self-deception to ordinary motivational bias, deflationism loses the element of *active avoidance*, and this loss is philosophically unacceptable because it absolves the agent of the specific responsibility distinctive to self-deception.

  The strength of the deflationary approach is its psychological plausibility. It aligns with empirical data on confirmation bias. We often believe what we want to believe without a conscious plot to lie to ourselves. If self-deception is simply the result of anxiety lowering the threshold for evidence required to believe a comforting proposition, no contradictory beliefs are required. The agent simply ends up with a false belief caused by desire. This makes self-deception a common, mundane occurrence rather than a puzzle of divided minds.

  However, this solution comes at a high conceptual cost. The distinctive feature lost is the *strategic management of evidence*. In paradigmatic cases of self-deception, the agent is not merely passively biased; they actively avoid triggering truths. A jealous husband does not just weigh evidence poorly; he hides his wife's letters and refuses to ask friends about her whereabouts. Ordinary wishful thinking involves misinterpreting available evidence; self-deception involves ensuring certain evidence remains unavailable. Deflationary accounts struggle to distinguish between accidentally overlooking evidence due to bias and deliberately steering oneself away from evidence to maintain a belief. If self-deception is just bias, the difference between a mistake and a maneuver disappears.

  This loss is philosophically unacceptable because it undermines the normative status of the self-deceiver. We typically hold self-deceivers responsible in a way we do not hold the merely wishful thinker. We accuse the self-deceiver of bad faith or cowardice because there is a sense in which they *colluded* in their own ignorance. If the process is entirely sub-intentional and indistinguishable from standard cognitive error, it is unclear why the agent is blameworthy rather than merely unfortunate. A deflationary account renders self-deception a mechanical failure of reasoning rather than a moral or rational failing of the will.

  One might object that introducing "active avoidance" smuggles intentionality back in, resurrecting the paradox. However, one can avoid evidence without consciously intending to remain ignorant. An agent can recognize that looking at the letters will cause pain and choose not to look, rationalizing this as "protecting peace," while understanding on some level that the peace is false. This preserves the active component without requiring simultaneous contradictory beliefs.

  In conclusion, while deflationary accounts succeed in making self-deception logically possible, they do so by sanitizing the concept. By equating self-deception with ordinary wishful thinking, they erase the active struggle and strategic avoidance that make the phenomenon distinct. Since this erasure removes the grounds for the specific blame we assign to self-deceivers, the deflationary cost is too high. A viable theory must account for the agency involved in staying ignorant, not just the bias involved in believing.

  ***

  ### Marking Scheme

  **A Grade (Excellent: 80–100%)**
  *   **Thesis:** Clearly states a position on whether deflationism changes the subject (e.g., "It solves the logic but loses the agency").
  *   **The "Loss" Move:** Identifies a specific feature lost by deflationism *beyond* the paradox itself (e.g., active evidence avoidance, normative responsibility, the phenomenology of struggle, or the distinction between error and maneuver).
  *   **Evaluation Move:** Does not merely list what is lost; argues *why* that loss matters. Explicitly assesses whether the loss is acceptable (e.g., "This is unacceptable because it removes blameworthiness").
  *   **Counter-Argument:** Anticipates a deflationary reply (e.g., "Intentionality brings back the paradox") and offers a rebuttal or refinement.
  *   **Clarity:** Argument flows logically; no reliance on name-dropping authors; concepts are defined in context.

  **B Grade (Good: 65–79%)**
  *   **Thesis:** Takes a stand, but it may be vague or hedged (e.g., "There are pros and cons").
  *   **The "Loss" Move:** Identifies that something is lost (e.g., "It's not really deception anymore") but describes it generally rather than pinpointing a specific mechanism like evidence avoidance or responsibility.
  *   **Evaluation Move:** Explains the deflationary view accurately but offers a shallow evaluation of the cost (e.g., "It seems wrong to call it deception" without explaining the philosophical consequence of that error).
  *   **Counter-Argument:** May mention an objection but does not fully develop the response.
  *   **Clarity:** Generally clear, but may rely more on exposition of the views than original argumentation.

  **C Grade (Satisfactory: 50–64%)**
  *   **Thesis:** Weak or missing.
  *   **Content:** Accurately recites the standard paradox and explains the deflationary solution.
  *   **Critique:** Fails to address the "what is lost" prompt in depth. May simply conclude that deflationism is better because it solves the paradox, ignoring the "changing the subject" worry.
  *   **Argument:** Mostly descriptive; summarizes positions rather than evaluating the trade-off.

  **Fail (<50%)**
  *   Fails to explain the deflationary view.
  *   Focuses entirely on the traditional paradox without discussing the deflationary solution.
  *   Incoherent or significantly under length.
