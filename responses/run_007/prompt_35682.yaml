          *Claim:* Higher-level entities possess causal powers that are fundamentally independent of, or irreducible to, their constituent parts.
          *Physics Support:* Contested. Most physicists reject 'strong emergence' as violating conservation laws or causal closure.
          *Status:* Radical philosophical thesis (Strong Emergence).
          *Blocks Greedy Reductionism?* Yes. This posits genuine skyhooks. If mental states or chemical bonds have causal efficacy not exhaustively determined by physics, reductionism fails metaphysically.

          **Recommendation for Your Group**
          Anderson himself was a reductionist regarding ontology but an anti-reductionist regarding constructionism. He argued that knowing the rules of the game does not equate to understanding the play. When someone says 'more is different', ask them: 'Are you saying we cannot *calculate* it (1), we cannot *conceptualise* it without new laws (2), or that it is fundamentally *independent* of physics (3)?'

