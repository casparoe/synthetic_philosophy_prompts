          Philip W. Anderson's 1972 manifesto *More is Different* is often wielded as a conversation-stopper, but it actually distinguishes between reductionism and constructionism. When your group deploys the phrase, they are likely conflating three distinct claims. Here is a menu to disentangle them.

          **1. The Epistemic Claim (Trivial)**
          *Claim:* While higher-level phenomena obey lower-level laws, predicting them from those laws is computationally intractable.
          *Physics Support:* Robust. The many-body problem in quantum mechanics confirms that solving Schrödinger's equation for macroscopic systems is impossible in practice.
          *Status:* Platitude.
          *Blocks Greedy Reductionism?* No. Dennett agrees that greedy reductionism is heuristically useless. This claim merely justifies using higher-level vocabularies for convenience, not necessity. It builds cranes, not skyhooks.

          **2. The Nomological Claim (Substantive)**
          *Claim:* At each level of complexity, entirely new laws appear which cannot be *anticipated* from the level below, even if they are consistent with them.
          *Physics Support:* Strong. Anderson cites symmetry breaking and phase transitions. Superconductivity cannot be understood by looking at a single electron; it requires collective behaviour.
          *Status:* Substantive thesis (Weak Emergence).
          *Blocks Greedy Reductionism?* Only pragmatically. It asserts that reductionist explanations are often the *wrong* level of analysis. However, it does not deny that the higher level is constituted by the lower. It challenges the *utility* of greedy reductionism, not its metaphysical possibility.

