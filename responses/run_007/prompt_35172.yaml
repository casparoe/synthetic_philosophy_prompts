answer: |-
  This is a great pedagogical challenge. You want the *phenomenology* of the situationist insight—the unsettling realization that "I am not who I think I am"—without the ethical baggage of deceiving students into thinking they failed a moral test.

  With 15 students, statistical power is low, so you cannot rely on the raw numbers alone to carry the argument. You need to layer their *predictions* against their *actions* against the *classic data*.

  Here is a lesson plan designed for a 75-minute seminar, centered on a modified "Good Samaritan" entry task.

  ### Activity Title: "The Hurried Entry"

  **Goal:** Demonstrate the Fundamental Attribution Error (FAE) and the predictive weakness of global traits via a low-stakes behavioral task.
  **Time:** 75 Minutes
  **Materials:** Two colors of index cards (or slips of paper), a stack of "accidental" papers (about 20 sheets), a timer/phone.

  ---

  ### Part 1: The Setup & Entry (0–15 mins)
  *Do not announce this is the activity. Frame it as "getting settled."*

  1.  **The Choke Point:** Arrange the room so students must pass you (the TA) at a specific narrow point (e.g., the door or a specific table) to get to their seats.
  2.  **Randomization:** As students arrive, hand them a slip of paper face down.
      *   **Group A (Relaxed - ~7 students):** "Welcome. Please take your seat at your leisure. We have plenty of time before we start."
      *   **Group B (Hurried - ~8 students):** "Welcome. Please take your seat immediately. We are running behind schedule and need to start in 30 seconds."
  3.  **The Obstacle:** As each student approaches the choke point, you are organizing a stack of papers. As they get within 3 feet, you "accidentally" drop the stack. It should scatter slightly, requiring effort to pick up, but not blocking the path entirely.
  4.  **Observation:** Have a trusted colleague or a discreet camera (if permitted) note:
      *   Did they stop?
      *   Did they hesitate?
      *   Did they keep walking?
      *   *(If no colleague is available, you must memorize the faces associated with the slip colors. This is harder but doable with 15 students.)*

  ### Part 2: The Data Collection (15–20 mins)
  *Once everyone is seated, transition immediately to the debrief to prevent gossip.*

  1.  **The Reveal:** "Before we discuss the reading, we just ran a micro-experiment. The slips you received contained different instructions about time pressure."
  2.  **Anonymous Survey:** Hand out new index cards. Ask them to answer three questions anonymously:
      *   *What instruction did you receive? (Hurried / Relaxed)*
      *   *Did you stop to help pick up the papers? (Yes / No)*
      *   *On a scale of 1–10, how much do you agree with this statement: 'I am generally a helpful person.'*
  3.  **Aggregate:** Collect the cards. Tally the results on the board live.
      *   *Expected Result:* High helping in Relaxed, Low helping in Hurried.
      *   *Expected Self-Rating:* High "Helpfulness" across both groups.

  ### Part 3: The Philosophical Debrief (20–75 mins)

  **Phase 1: The Vertigo (20–35 mins)**
  *   **Compare Prediction vs. Reality:** Point out the gap. "Most of you rated yourself an 8, 9, or 10 on helpfulness. Yet, in the Hurried group, X% walked past."
  *   **The FAE:** Ask the Relaxed group: "When you saw someone walk past the papers, what did you think of them?" (They will likely say "Selfish," "Rude").
  *   **The Turn:** "But they weren't selfish. They were *hurried*. You attributed their behavior to character; it was caused by situation."
  *   **Connect to Reading:** Bring in Darley & Batson. "In the original study, seminary students on their way to give a talk on the Good Samaritan walked past a slumped stranger because they were told they were late. The variable wasn't religiosity; it was time."

  **Phase 2: Global vs. Local Traits (35–55 mins)**
  *   **The Virtue Ethicist's Claim:** Aristotelian virtue requires *hexis* (stable disposition). A virtuous person acts rightly *across* varying situations.
  *   **The Situationist Challenge:** If your 'helpfulness' disappears when you are in a hurry, is it a trait? Or is it a *local* habit (Helpfulness-When-Relaxed)?
  *   **Discussion Question:** "If virtues are only local (e.g., 'Honesty-When-Unobserved'), do they deserve the normative weight Virtue Ethics places on them? Can you build a moral theory on 'local traits'?"
  *   **Key Distinction:** Situationists don't say personality doesn't exist. They say it lacks *cross-situational consistency*.

  **Phase 3: Normative Implications (55–75 mins)**
  *   **Moral Responsibility:** If situations drive behavior, are we responsible? (Compatibilist angle: We can change situations even if we can't change traits).
  *   **Virtue Ethics Defense:** How might a VE respond? (e.g., Particularism, the role of *phronesis* in recognizing the situation).
  *   **Closing:** "The goal isn't to abandon virtue. It's to realize that building virtue isn't just internal work; it's environmental design."

  ---

  ### Predictably What Will Go Wrong (And How to Fix It)

  **1. The "All-Help" Failure**
  *   **Risk:** With only 15 students, it is statistically possible that *everyone* stops to help, even the hurried group. This kills the "vertigo."
  *   **Fix:** Have the Darley & Batson data ready on a slide. If your class data is muddy, say: "Our sample is small and you are philosophy students (selected for interest in ethics). But look at the N=40 data from 1973..." The activity still serves as the *hook* for the real data.

  **2. The "Gotcha" Guilt**
  *   **Risk:** A student who didn't help feels morally deficient. This violates your "no feeling shitty" constraint.
  *   **Fix:** Your scripting in the debrief is crucial. **Do not say:** "This shows you aren't as good as you think." **Say:** "This shows how powerful situations are. The fact that you walked past is the *point*. It proves that even good people are overridden by context. If you had stopped despite the hurry, you would be the statistical outlier." Normalize the failure immediately.

  **3. Demand Characteristics**
  *   **Risk:** Students suspect a trick and help *because* they think it's a test.
  *   **Fix:** Keep the "accident" low-key. Don't make eye contact when dropping the papers. Look stressed/busy. If you make it look like a performance, they will play along.

  **4. The "It's Just Trivial" Objection**
  *   **Risk:** Students argue, "Picking up papers isn't moral. It's just etiquette."
  *   **Fix:** Concede the point, then pivot. "True. But the psychological mechanism (time pressure overriding intention) is the same mechanism that overrides moral action in high-stakes environments (e.g., medical errors, bystander intervention). The stakes change, the psychology doesn't."

  ---

  ### Limitations: What This Activity *Cannot* Do

  You asked for honesty about where the activity falls short philosophically. You will need to lecture these points because the activity cannot generate them.

  **1. The "Negative" vs. "Positive" Claim**
  *   **Limitation:** The activity demonstrates the *Negative* claim (global traits don't predict behavior well). It does not address the *Positive* claim (that situationism offers a better explanatory framework).
  *   **Lecture Needed:** You have to explain that Situationism isn't just skepticism; it's a proposal to shift explanation from *agents* to *environments*.

  **2. The Normative Gap**
  *   **Limitation:** Showing that people *don't* act virtuously doesn't prove they *shouldn't* be evaluated on virtue. (The Is-Ought problem).
  *   **Lecture Needed:** A Virtue Ethicist can concede the empirical point ("Yes, people are inconsistent") but argue the normative point remains ("We should still strive for consistency"). The activity proves inconsistency, not the irrelevance of the ideal.

  **3. Local Traits**
  *   **Limitation:** The activity suggests traits are fragile. It doesn't prove "Local Traits" (e.g., honesty-in-the-classroom) don't exist.
  *   **Lecture Needed:** Doris argues that even local traits are less robust than we think. You need to explain that the Situationist critique is a sliding scale, not a binary switch.

  **4. Moral Responsibility**
  *   **Limitation:** Students often jump to "So nothing is my fault."
  *   **Lecture Needed:** You must clarify that Situationism is not Determinism. It argues for *probabilistic* influence, not causal necessity. We are still responsible, but perhaps we are responsible for managing our situations more than we thought.

  ### Final Tip for the TA
  When you debrief, stand in the spot where you dropped the papers. Physical positioning helps anchor the memory. When you say, "You were right here, and the instruction was right there," gesture to the physical space. It reinforces that the *space* and the *instruction* were the agents, not their character.
