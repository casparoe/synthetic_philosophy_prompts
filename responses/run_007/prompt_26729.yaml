  **The pattern**

  Your judgments reveal a tension between aggregative utilitarianism and non-aggregative constraints. You endorse saving the greater number in symmetric rescue cases (five trapped vs. one) and equal-severity medical triage (two terminal vs. one). However, you reject aggregation when harms are asymmetric in severity (one shock vs. million disappointments; one life vs. two headaches) or when rights are violated (killing one for organs). The core conflict lies in distinguishing when numbers count. You propose a threshold view: aggregate only above a severity threshold, provided no one is used as a means. This captures the intuition that mild harms don't sum to outweigh severe ones, yet allows saving more lives when stakes are equal. However, the "mere means" constraint explains the organ case but not the broadcast case, where no one is killed. The challenge is defining the threshold precisely enough to handle borderline cases like quadriplegia versus lost fingers without arbitrariness. You are seeking a unified theory for what may be distinct moral phenomena.

  **Candidate principles**

  Your proposed principle combines a deontological constraint against using persons as mere means with a severity threshold for aggregation. Let's refine it: *Act to minimize overall harm, provided (1) no individual is intentionally killed or used as a mere means, and (2) no number of harms below threshold T outweighs a single harm above T.* This handles the organ case (constraint 1 blocks killing). It handles the broadcast and drug cases (constraint 2 blocks aggregating mild harms against severe ones). It handles the trapped strangers and terminal illness cases (severity is equal, so aggregation applies).

  However, the principle struggles with definition. What is T? Is it pain? Loss of function? Life prospects? If T is "permanent disability," quadriplegia clears it, but does losing a finger? If T is binary, borderline cases become arbitrary. Furthermore, the "mere means" constraint is tricky. In the trapped strangers case, you let one die to save five. Is that using them as a means? Most say no (doing vs. allowing), but the line is thin.

  Consider Simple Utilitarianism as a candidate. It fails your organ and broadcast cases immediately by aggregating all harms equally. Consider Scanlon's contractualism. It suggests principles no one could reasonably reject. A principle allowing aggregation only when complaints are comparable might work. However, contractualism often struggles to justify saving the five in the trapped case without aggregating complaints. If each of the five has a complaint equal to the one, why does the one lose? Scanlon argues the one cannot reasonably reject a principle that saves the greater number when stakes are equal. But when stakes are unequal (life vs. headache), the one with the life complaint can reasonably reject aggregation.

  Your threshold view is essentially a "lexical prioritarianism." It prioritizes the worst off unless the difference is negligible. The problem is continuity. Is a week of headaches below T? Yes. Is losing a finger below T? Maybe. Is quadriplegia above T? Yes. But what if it's one quadriplegic vs. three lost fingers? Does three fingers cross T? If harms aggregate above T, why not below? If they don't aggregate below T, why do they above? A better formulation might be: *Aggregate complaints only when the harms are of the same order of magnitude.* This avoids a hard threshold but retains the intuition that pain doesn't sum to death. However, "order of magnitude" is vague. Your principle is plausible but risks arbitrariness at the margins. It successfully unifies cases 1, 3, 4, 5. Case 2 relies on the rights constraint, not the threshold. Thus, you actually have two principles: a rights constraint and a severity-weighted aggregation rule. The tension is not in the aggregation but in defining the boundary where aggregation becomes permissible. The deepest challenge is the "Separateness of Persons." Utilitarianism aggregates across persons; you resist this. But if you resist it for mild harms (broadcast), why accept it for severe harms (terminal illness)? If persons are distinct, why does a second terminal patient tip the scale? Your principle answers: because above T, harms are comparable enough to count together. But this invites the Sorites paradox. If one finger doesn't count against quadriplegia, does two? If not, does ten? If ten counts, where is the cutoff? A hard threshold seems morally arbitrary, yet a soft threshold collapses into utilitarianism. You are trying to hold two incompatible views: that persons are separate (blocking aggregation) and that numbers count (requiring aggregation).

  **The open case and beyond**

  Applying your threshold principle to the quadriplegia versus two fingers case yields a difficult result. Quadriplegia is undoubtedly above any plausible threshold T for severe harm; losing a finger is likely below it. If your principle strictly forbids aggregating harms below T against harms above T, you must save the quadriplegic, even against two, ten, or perhaps a hundred lost fingers. This seems counterintuitive. At some point, enough fingers must outweigh one quadriplegia. If you allow aggregation above a certain number of fingers, you admit a threshold within the "below T" category, undermining the strict lexical priority.

  To discriminate between candidates, consider this case: *One person will lose a leg unless you prevent two people from each losing a leg.* Here, harms are equal and severe. Your principle mandates saving the two. Now vary it: *One person will lose a leg unless you prevent twenty people from each breaking a toe.* A broken toe is minor; a leg is major. Your threshold view says save the leg. But if you increase the toe-breakers to two thousand, does the principle hold? If yes, it seems fanatical. If no, the threshold is porous.

  This new case separates a hard threshold view from a weighted view. A hard threshold says no number of toes equals a leg. A weighted view says enough toes eventually matter. Your intuitions likely favor the weighted view, suggesting your principle needs to allow some aggregation across severity levels, perhaps by discounting minor harms rather than ignoring them. Furthermore, in the quadriplegia case, consider the lifetime impact. Quadriplegia affects autonomy profoundly; a finger affects dexterity slightly. If the threshold is based on "life plans," fingers don't count. But if two people lose dominant hands, does that equal quadriplegia? The principle forces you to define "severity" not just physically but functionally. If you define it functionally, the threshold becomes context-dependent, weakening its status as a universal principle. You may need to accept that aggregation is always permitted but weighted non-linearly, rather than blocked by a threshold.

  **What I should give up**

  You should give up the hard threshold. It creates arbitrary cliff-edges where a slight increase in harm (a toe vs. a foot) suddenly permits aggregation where none was allowed before. Instead, adopt a weighted prioritarian view: aggregate all harms, but weight them non-linearly so severe harms count disproportionately more than mild ones. This preserves your verdicts in the broadcast and drug cases (the weight of life/shock dwarfs mild disappointments) without forbidding aggregation entirely.

  Regarding the organ case, keep the rights constraint. That is distinct from aggregation; it is about inviolability. Your confusion stems from trying to unify rights constraints with aggregation rules. They are different moral modules. The organ case is about prohibition; the trap case is about allocation. You are asking for a single principle to unify two different questions: "What may I do to someone?" and "Who should I help?"

  Finally, accept that the quadriplegia case has no clean answer. If twenty fingers outweigh one quadriplegia, admit it. Do not force a principle to deny what your considered judgment accepts. Moral principles describe intuitions; they do not always overwrite them. If your principle conflicts with a strong intuition that many minor harms can outweigh one major harm, revise the principle, not the intuition. The search for a unified theory may be the error; a pluralistic account fits your verdicts better.
