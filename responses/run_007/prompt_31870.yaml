answer: |-
  The asymmetry in Aquinas's *De Regno* regarding tyrannicide rests on a distinction between the *source* of political power and the *use* of political power. To understand why a tyrant by usurpation may be killed while a tyrant by oppression is ordinarily tolerated, one must examine how Aquinas conceptualizes the relationship between the ruler, the law, and the community. The distinction is not merely procedural; it is ontological regarding the status of the ruler's authority.

  **The Ontology of Power: Title vs. Exercise**

  For Aquinas, political authority is legitimate only when oriented toward the common good. However, legitimacy can fail in two distinct ways.

  A **tyrant by usurpation** suffers from a defect of title. He has no just claim to rule. His power is, in essence, private force occupying a public role. Because he lacks legitimate title, he stands outside the political community's legal framework. He is not a ruler who has gone bad; he is an aggressor who has seized the machinery of rule. Consequently, the bond of obedience that subjects owe to a legitimate ruler never comes into existence.

  A **tyrant by oppression** suffers from a defect of exercise. He holds legitimate title (perhaps through election or heredity) but governs for his private good rather than the common good. Here, the bond of obedience exists *prima facie* because the office itself is legitimate and necessary for the common good. The ruler is inside the legal framework but violating its spirit.

  This distinction matters for determining who may act because it changes the nature of resistance. Resisting a usurper is not sedition (which is the disturbance of the public order) because the usurper is already the disturber of the order. Resisting a legitimate ruler, however, risks becoming sedition because it attacks the office itself, which is a constituent part of the public order.

  **The Agency Problem: Private vs. Public Action**

  The core of the asymmetry lies in who possesses the agency to remove the tyrant. Aquinas is deeply concerned with the distinction between private initiative and public authority.

  In the case of the **usurper**, Aquinas suggests that killing him is not sedition. Indeed, he notes that the one who kills the usurper may be worthy of praise and reward. Conceptually, this is not framed as a "private right" in the modern sense of an individual liberty. Rather, because the usurper has no public standing, he is treated as a public enemy. The act of killing him is permissible because it removes an obstacle to the common good that has no legal protection. However, Aquinas does not explicitly mandate that any private individual *must* or *may* do this without qualification; he implies that if the opportunity arises to repel the dominion, it is not unjust.

  In the case of the **oppressive legitimate ruler**, Aquinas explicitly forbids private initiative. A private individual cannot judge and depose a public superior. To allow this would be to dissolve the hierarchy necessary for political order. If any subject could decide the ruler is tyrannical and kill him, the result would be factionalism and the destruction of the regime itself. Therefore, the remedy must come from a **public authority**.

  **Is Killing a Usurper an Execution of Public Judgment?**

  Your question asks whether the killing of a usurper is best read as an execution of a public judgment rather than a private right. The text supports the former reading, with caveats.

  Because the usurper lacks title, he is effectively an outlaw. He has placed himself outside the law by his very act of usurpation. Therefore, the "judgment" against him is inherent in his status. When someone kills a usurper, they are not acting as a private vigilante asserting a personal right; they are acting as an instrument to restore the public order that the usurper violated. The "public judgment" is not necessarily a formal judicial sentence passed prior to the act (since the usurper often controls the courts), but a recognition of the objective state of affairs: the usurper is an enemy of the community.

  However, Aquinas is cautious. He does not unleash a general license for assassination. He frames the permissibility in terms of the *absence of sedition*. The act is justified because it aligns with the public good, not because the individual has sovereignty over the ruler's life. The "public" nature of the act is derived from its end (the restoration of legitimate rule), not necessarily from the formal status of the agent, though collective action is implicitly preferred over individual conspiracy.

  **The Tension: Tolerating the Oppressive Legitimate Ruler**

  The internal tension arises here: If the common good is the standard, and the ruler is destroying the common good through oppression, why is the common good served by tolerating him?

  Aquinas's reasoning is consequentialist regarding political stability. He argues that attempting to depose a legitimate tyrant often leads to greater evils than the tyranny itself.
  1.  **Risk of Worse Tyranny:** The faction that deposes the tyrant may install a worse one.
  2.  **Civil Strife:** The process of deposition often fractures the community, leading to civil war.
  3.  **Destruction of Office:** In attacking the person, the community may damage the institution of kingship itself, leaving them with no authority at all.

  Therefore, tolerating a moderate tyranny is sometimes the lesser evil compared to the chaos of removal. The "common good" includes peace and order, not merely justice in the abstract. Enduring a bad ruler preserves the structure of authority, which is necessary for any future good.

  **What Counts as Public Authority?**

  This is the most underspecified element in *De Regno*. Aquinas states that if a tyrant by oppression becomes intolerable, action must be taken by "public authority," not private presumption. But what constitutes public authority when the tyrant is the supreme ruler?

  *   **Explicit Text:** Aquinas suggests that if there is a superior authority (e.g., an Emperor over a King, or a feudal overlord), that superior has the right to judge and depose the tyrant. This fits the feudal context of the 13th century.
  *   **Underspecification:** Aquinas does not clearly articulate a mechanism for a supreme monarch who recognizes no earthly superior. He hints that the community *as a whole* might have a role, specifically if the king was elected by them. He suggests that if the community provided the king, they may restrain or depose him if he abuses the power granted.
  *   **Commentary vs. Text:** Later commentators (such as the Scholastics of the 16th century or the Monarchomachs) filled this gap by theorizing a "representative" public authority (e.g., estates, parliament, or the people collectively) that always remains superior to the king. They argued that the "public authority" Aquinas mentions resides permanently in the community. However, Aquinas himself is vaguer. He does not develop a robust theory of popular sovereignty or constitutional resistance in *De Regno*. He leaves the mechanism for judging a supreme tyrant largely open, likely assuming that such extreme cases would be resolved by providence or extraordinary consensus rather than a standard legal procedure.

  **Conclusion: Text and Tradition**

  Aquinas's position in *De Regno* is tighter and more cautious than the tradition that followed. He establishes a conceptual asymmetry based on the legitimacy of title. The usurper is an external enemy whom the community may repel; the oppressive ruler is an internal corruption that must be excised only by the body politic's own authorized mechanisms to avoid self-destruction.

  The text explicitly forbids private tyrannicide against legitimate rulers and permits the repulsion of usurpers without the stain of sedition. It leaves underspecified the constitutional procedure for deposing a supreme legitimate tyrant, merely insisting that it must not be a private act. Later interpreters often expanded the "public authority" clause into a right of revolution or representative resistance, but Aquinas's own text remains focused on the preservation of order and the danger of factionalism, prioritizing the stability of the regime even at the cost of enduring a flawed ruler. The killing of a usurper is thus not a private right, but a public defense; the toleration of an oppressor is not an endorsement of evil, but a safeguard against chaos.
