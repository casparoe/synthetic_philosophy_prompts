      *   **User Profile:** High school student, strong in math (complex numbers, polynomials, beginnings of group theory). Knows about complex conjugation ($i \leftrightarrow -i$, $\mathbb{R}$ fixed). Interested in philosophy (Leibniz, Max Black).
