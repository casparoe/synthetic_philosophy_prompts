answer: |-
  This is a classic formulation of the **Reference Class Problem**, often attributed to Reichenbach and sharpened by Hájek. It is one of the most durable arguments in the field. Your friend has constructed a valid dilemma: if you accept the frequentist criterion of objectivity (1) and the multiplicity of reference classes (2), single-case objective chance vanishes.

  Since you want to preserve (5) (scientific realism about single-case chance) and avoid sliding into subjectivism (degrees of belief) or pluralism (probability isn't one thing), you are effectively looking for a **realist** interpretation of probability that is not **frequentist**.

  Here is the brainstorming analysis, followed by my committed diagnosis.

  ### Brainstorming: Where the Argument Could Break

  **1. Rejecting Premise (1): The Verificationist/Frequentist Criterion**
  *   **The Move:** Deny that objectivity requires checkability against long-run frequencies. Assert that probabilities are physical properties of the specific setup (dispositions or propensities) that *generate* frequencies but are not *defined* by them.
  *   **Associated Position:** **Propensity Interpretations** (Popper, Giere) or **Primitivism** (Lewis).
  *   **Pros:** Saves single-case chance immediately. A radioactive atom has a decay chance *now*, regardless of whether there are other atoms or a long run.
  *   **Cons:** Metaphysically "spooky." If frequency doesn't define chance, what does? It risks making chance unmeasurable or occult.

  **2. Rejecting Premise (2): The Indefiniteness of Reference Classes**
  *   **The Move:** Argue that there is a *unique, correct* reference class for any event, determined by the world, not by us. Usually, this is the "narrowest homogeneous class" containing all causally relevant factors.
  *   **Associated Position:** **Causal Frequentism**.
  *   **Pros:** Keeps the link between chance and frequency.
  *   **Cons:** Extremely difficult to cash out. How do we know we have *all* the causally relevant factors? If we miss one, the frequency changes. This often collapses back into Propensity (the "causal power" determines the class).

  **3. Rejecting Premise (3): The Arbitrariness/Objectivity Link**
  *   **The Move:** Argue that probability is objective *relative* to a model or a system of laws. The choice of reference class isn't arbitrary; it is dictated by the "Best System" of laws that balances simplicity and strength (Lewis's Best System Analysis).
  *   **Associated Position:** **Humean Objective Chance** (Lewis).
  *   **Pros:** Grounds objectivity in the structure of the world's history without spooky powers.
  *   **Cons:** Makes chance relational (objective relative to the system). Some find this less robust than "pure" realism. Also struggles slightly with single-case unless the "system" covers it.

  **4. Rejecting Premise (5): Scientific Realism**
  *   **The Move:** Accept the argument's conclusion. Scientists speak loosely; strictly speaking, there are no single-case probabilities.
  *   **Associated Position:** **Hard Frequentism** or **Error Theory**.
  *   **Pros:** Philosophically consistent if you are a strict empiricist.
  *   **Cons:** You explicitly said you want to keep (5). It also requires treating much of quantum mechanics and epidemiology as strictly speaking false or elliptical.

  ---

  ### Diagnosis: Reject Premise (1)

  If I have to choose the single best step to reject to satisfy your constraints (keep objective single-case chance, avoid subjectivism, avoid pluralism), you should reject **Premise (1)**.

  > **(1) A probability claim is objective only if it can in principle be checked against long-run frequencies...**

  **Why reject it?**
  Premise (1) is a verificationist constraint that conflates the *nature* of a property with our *evidence* for it. We routinely accept that the world contains objective properties that cannot be reduced to long-run frequencies.
  *   **Analogy:** Consider the mass of a specific, unique rock. We can measure mass by weighing many rocks and finding averages, but the mass of *this* rock is not *defined* by the average mass of similar rocks. It is a property of the object itself.
  *   **Application to Chance:** Similarly, a quantum system (like a specific atom) can possess a dispositional property (a propensity) to decay. The long-run frequency of decay in a sample of similar atoms is *evidence* of that propensity, but the propensity itself is a feature of the single case.

  By rejecting (1), you sever the link that makes the Reference Class Problem (Premise 2) fatal. If chance is not *defined* by frequency, then the fact that frequencies vary across classes doesn't mean the chance is unreal; it just means frequencies are imperfect guides to the underlying single-case disposition.

  **What does rejecting (1) cost?**
  You pay a **metaphysical price**.
  1.  **Ontological Inflation:** You must accept "propensities" or "chance dispositions" as fundamental features of reality. Unlike mass or charge, which seem static, propensities are directed toward future outcomes. Some philosophers (like van Fraassen) argue this is occult or unscientific.
  2.  **The Measurement Problem:** If chance isn't frequency, how do we measure it? We usually estimate single-case chance by looking at frequencies. You have to explain why frequencies track propensities reliably (usually via a "Long-Run Propensity" theorem) without defining them as such. This requires a bit of philosophical heavy lifting to ensure you aren't just smuggling frequentism back in.

  However, this cost is preferable to the alternatives. It preserves the objectivity you want without forcing you into subjectivism.

  ---

  ### Interpretation Scorecard

  Here is how the major interpretations fare against this argument, given your goal to preserve (5).

  #### 1. The Propensity Interpretation (Survives Most Comfortably)
  *   **Verdict:** **Winner.**
  *   **Why:** This view is built exactly to solve this problem. It rejects (1) by definition. It posits that the physical setup of the single case (the coin, the atom, the patient's biology) possesses a real, objective disposition to produce an outcome.
  *   **Handling the Argument:** It accepts (2) (there are many classes) but denies that this matters for the *truth* of the chance claim. The "true" chance is the propensity of the token event. Frequencies in various classes are just noisy evidence.
  *   **Fit for You:** It keeps (5) robustly. It is not subjectivist. It treats probability as one thing (physical propensity).

  #### 2. The Best System Analysis (Humean Chance) (Strong Contender)
  *   **Verdict:** **Runner Up.**
  *   **Why:** This view (associated with David Lewis) rejects (1) and modifies (3). It says objective chance is whatever probability function appears in the "best" systematization of the world's history (balancing simplicity and fit).
  *   **Handling the Argument:** It solves the reference class problem by saying the "best system" selects the relevant predicates. The choice isn't arbitrary; it's determined by which system best summarizes the world.
  *   **Fit for You:** It preserves objective single-case chance (via the system's laws applying to the case). However, it is metaphysically deflationary (chance is just a summary of history), which some realists find less satisfying than Propensity.

  #### 3. The Subjectivist/Bayesian Interpretation (Survives, but Violates Your Constraint)
  *   **Verdict:** **Survives but Unwanted.**
  *   **Why:** Subjectivists reject (1) and (5). They say probability claims are about rational belief, not the world.
  *   **Handling the Argument:** The reference class problem is just a problem of how to update beliefs given different information. There is no "fact of the matter" about the single-case chance to begin with.
  *   **Fit for You:** You explicitly said this "feels like giving up on objective chance." This view denies the premise you most want to save.

  #### 4. The Frequentist Interpretation (In The Most Trouble)
  *   **Verdict:** **Loser.**
  *   **Why:** Frequentism *is* Premise (1). The Reference Class Problem (Premise 2) is the traditional killer of Frequentism.
  *   **Handling the Argument:** To survive, a Frequentist must either deny single-case probabilities (reject 5, which you won't do) or argue there is a non-arbitrary way to pick the one true reference class (reject 2/3). The latter is notoriously difficult; any rule for picking the "right" class usually relies on causal knowledge, which pushes the view toward Propensity anyway.
  *   **Fit for You:** This view forces you to abandon the objectivity of single-case scientific claims, treating them as elliptical shorthand for sequence claims.

  ### Final Recommendation

  To keep your scientific realism (5) without collapsing into subjectivism, you should adopt a **Propensity** or **Primitivist** view of chance.

  **Reject Premise (1).**
  Declare that objective probability is a physical magnitude (like mass or charge) that *manifests* in frequencies but is not *constituted* by them. This allows you to say the atom *really does* have a 50% chance of decaying, even if it is the only atom in the universe. The reference class problem then becomes an epistemic problem (how do we *know* the chance?) rather than an ontological one (does the chance *exist?*).

  This is the standard move in the philosophy of physics, particularly for making sense of Quantum Mechanics, where single-case probabilities are fundamental and long-run frequencies are derivative.
