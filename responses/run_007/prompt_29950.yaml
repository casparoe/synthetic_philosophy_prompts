      Also, emphasize the "Wager" aspect. That's the key to separating judgment from perception. If I bet high, I claim my experience was robust. If expectation changes the bet, that's stronger evidence for CP than just a Yes/No.

      *Wait, one more thing:* The prompt mentions the "banana" and "hill" studies. I should explicitly link the debrief back to those so the activity feels integrated with the reading.

