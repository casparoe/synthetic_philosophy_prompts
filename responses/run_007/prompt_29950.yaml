      *   **Limitations:** Confidence $\neq$ Phenomenology, Artificiality, Sample Size.

      *Refining the "What will go wrong" section:* This needs to be sharp. The instructor specifically asked for honesty about derailments.
      *   *Derailment 1:* The "Demand Characteristic" objection. Students realize they are being tested on expectation.
      *   *Derailment 2:* The "Attention" confound. Expectation leads to attention, which changes perception (is attention cognitive?).
      *   *Derailment 3:* The "Criterion Shift." They admit they just lowered their bar for saying "Yes."

      *Refining the "What it doesn't capture":*
      *   The *modularity* argument (informational encapsulation).
      *   The *evolutionary* argument (why perception *shouldn't* be penetrated).
