      *   **Problem:** Instructor had a heated debate with a Cog Sci friend about *Cognitive Penetration* (CP). Friend says CP is real (banana/hill studies); Instructor says it's judgment/response bias. Instructor wants to translate this debate into a classroom activity.
      *   **Goal:** A 30-40 minute in-class activity + debrief. Needs to be more structured than standard ambiguous figures (duck-rabbit). Needs to force confrontation with the "perception vs. judgment" distinction.
      *   **Requirements:**
          *   Between-groups design (priming/expectations).
          *   Students should feel the pull of *both* sides (CP seems real vs. CP is hard to prove).
          *   Must include: "What will go wrong?" (anticipating student objections/derailments) and "What does this *not* capture?" (limitations of the activity).

  2.  **Deconstruct the Philosophical Issue (Cognitive Penetration):**
      *   *Thesis:* Cognitive states (beliefs, desires, expectations) influence perceptual experience (early vision).
      *   *Antithesis:* Modularity (Fodor). Perception is encapsulated. Effects are post-perceptual (judgment, memory, reporting).
      *   *Key Evidence:* Firestone & Scholl (anti-CP) vs. Hansen et al. (banana study), Proffitt (hill study).
      *   *The Crux:* How do we distinguish a change in *phenomenology* from a change in *criterion* (signal detection theory) or *memory*?

  3.  **Brainstorming Activities:**
      *   *Idea 1: Color Memory.* Show a grey patch, tell Group A it's slightly yellow, Group B slightly blue. Ask them to match it later. *Problem:* Too much memory involved. Hard to isolate perception.
      *   *Idea 2: The "Hill" Analog.* Use weights. Group A wears heavy backpacks (impractical in class), Group B light. Estimate slope of a ramp. *Problem:* Logistics, safety, and easily explained by motor planning rather than visual experience.
      *   *Idea 3: Categorical Perception (Speech).* Ba/da sounds. *Problem:* Requires audio equipment, might be too psych-heavy, less "visual."
      *   *Idea 4: The "Valuation" Task (The Winner).* Use value-laden stimuli. If I tell you a coin is worth \$100 vs. \$0.01, does it look bigger? (Bruner & Goodman, but updated). Or, use a "threat" prime.
      *   *Idea 5: The "Noisy Signal" Task (Best for Phil/Psych mix).* Use Signal Detection Theory logic without the math. Show very noisy images. Prime Group A to expect "X", Group B to expect "Y". Measure confidence and accuracy.
      *   *Idea 6: The "Expertise" Task.* Show chess boards or bird photos. Experts vs. Novices. *Problem:* Takes years to build expertise.
      *   *Idea 7: The "Word/Color" Interference (Stroop).* *Problem:* Too basic, everyone knows it.

      *Selection:* Let's go with a modified **Value/Expectation Size Estimation** or **Noisy Object Detection**. The "Value" one is more intuitive for the "banana" debate. However, the "Noisy Object Detection" allows for a cleaner distinction between *seeing* and *guessing*.
      *Actually, let's refine the "Value" idea.* The "Coin Size" study is classic. But to make it about *perception* specifically, we need to minimize judgment.
      *Better Idea:* **The "Ghost in the Machine" (Pareidolia + Priming).**
      *Why?* It directly targets high-level concepts affecting low-level grouping.
      *Wait, the prompt asks for something where they confront the "perception vs. judgment" distinction.*
      *Let's try a **Psychophysical Matching Task with Semantic Priming**.*
      *Setup:* Two groups. Both see the *exact same* ambiguous color or size stimulus. Group A is primed with Concept X, Group B with Concept Y.
      *Stimulus:* A grey-ish circle. Group A told it's a "Lemon" (implicitly yellow). Group B told it's a "Blueberry" (implicitly blue).
      *Task:* Adjust a color wheel to match what they *saw*.
      *Critique:* This is basically the Hansen et al. banana study. It might be too close to the reading.
      *Alternative:* **The "Threat" Detection Task.**
      *Stimulus:* A grid of Gabor patches or noisy images. One might contain a snake/spider vs. a flower/rope.
      *Prime:* Group A told "This is a danger detection test." Group B told "This is a nature classification test."
      *Measure:* Reaction time and *perceived contrast* or *size*.
      *Logistics:* Hard to run in 15 students without computers.

      *Let's go low-tech but high-impact.* **The "Valued Object" Size Estimation.**
      *Why:* It's easy to run. It mirrors the "rich get richer" or "coin looks bigger" studies. It allows for immediate debate on *why* the estimates differed.
      *Refinement:* To make it about *perception* specifically, we need to force them to commit to the phenomenology.
      *Let's try the **"Ambiguous Motion" Task** (similar to the "tennis player" vs. "bird" studies).*
      *Stimulus:* A point-light display or a very blurry video.
      *Prime:* Group A: "Watch the athlete." Group B: "Watch the dancer."
      *Task:* Rate the *speed* or *fluidity* (phenomenal qualities) not just the identity.
      *Logistics:* Need a video. Doable.

      *Wait, the best fit for "Perception vs. Judgment" is a **Signal Detection** style task done manually.*
      *Let's design the **"Noisy Grid" Activity**.*
      *Stimulus:* A grid of random noise (static). Sometimes a faint letter is embedded. Sometimes not.
      *Prime:* Group A: "Most images contain letters." (High expectation). Group B: "Most images are just noise." (Low expectation).
      *Task:* 1. Did you see a letter? (Yes/No). 2. How *clear* was it? (1-10 scale of phenomenological vividness).
      *Debrief:* Compare "Yes" rates. Compare "Clarity" ratings.
      *Philosophical Hook:* If Group A says "Yes" more often, is it bias? If Group A says "It looked clearer," is that CP?
      *This works well.* It mimics the experimental logic but puts them in the seat.

      *Wait, I need to make sure it's not just "guessing".*
      *Let's add a "Betting" element.* If you say you saw it, you bet points. This forces them to distinguish "I think it's there" from "I saw it."

      *Okay, let's finalize the **"Phenomenal Vividness Betting" Activity**.*
      *   **Stimuli:** 10 slides. 5 have a faint letter (e.g., 'E') embedded in noise. 5 are pure noise. (Need to prepare these).
      *   **Groups:**
          *   Group A (High Expectancy): Told "80% of these slides contain a hidden letter."
          *   Group B (Low Expectancy): Told "Only 20% of these slides contain a hidden letter."
      *   **Task:** For each slide: (1) Yes/No (Letter?), (2) Vividness Rating (1-5, where 1 = "I'm guessing" and 5 = "It popped out"), (3) Bet (0-10 points on accuracy).
      *   **Time:** 15 mins running, 20 mins debrief.

      *Wait, is 15 students enough for statistical power?* No, but it's enough for *phenomenological* discussion. The data doesn't need to be significant; the *experience* of the divergence is what matters.

      *What will go wrong?*
      1.  Students will say "I was just guessing." (Undermines the CP claim).
      2.  Students will say "I saw it clearly because I looked harder." (Attention vs. Cognition).
      3.  One group will catch on to the deception.
      4.  The "Vividness" scale will be interpreted differently (calibration problem).

      *What does it not capture?*
      1.  It doesn't prove *early* vision vs. *late* vision.
      2.  It conflates confidence with phenomenology.
      3.  It's artificial (lab setting).

  4.  **Drafting the Response:**
      *   **Activity Name:** "The Vividness Wager."
