prompt: |-
  I recently had an experience that's been troubling me, and I'd appreciate a careful philosophical analysis of it. Last month, I was walking through a park when I saw a toddler fall into a pond. Without thinking, I waded in and pulled the child out. It ruined my phone and a pair of good shoes — probably £300 in damage — but I didn't hesitate and I don't regret it. Anyone would have done the same.

  But here's what bothers me. That same week, I received a fundraising appeal from a charity that provides malaria nets to children in sub-Saharan Africa. I deleted the email without donating. I could afford to give £300 — it would barely affect my quality of life — yet I felt no urgency. When I try to explain this to myself, I come up with things like: those children are far away, I didn't see them personally, there are millions of other people who could also donate, and I already give a little to charity each year. But none of these reasons would have felt remotely acceptable to justify letting a child drown in front of me.

  Am I being inconsistent? Or is there a genuine moral difference between the two cases that I'm not articulating well? I want to know whether I should change my behaviour, change my thinking, or whether my unease is misplaced.

  Please write your answer in British English.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **The Scenario:** The user saved a drowning toddler in a park (costing £300 in damaged goods) but ignored a fundraising email for malaria nets (costing £300 to save lives, presumably).
      *   **The Conflict:** The user feels inconsistent. The intuitive moral impulse was strong in the physical presence case but weak in the distant statistical case.
      *   **The Question:** Am I being inconsistent? Is there a genuine moral difference? Should I change behaviour, thinking, or is the unease misplaced?
      *   **The Constraint:** Write in British English.
      *   **The Tone:** Careful philosophical analysis. Empathetic but rigorous.

  2.  **Identify the Philosophical Core:**
      *   This is a classic thought experiment in ethics, specifically associated with Peter Singer's "Famine, Affluence, and Morality" (1972).
      *   The "Drowning Child" analogy is Singer's central device to argue for effective altruism.
      *   The core tension is between *proximity/salience* (psychological factors) and *moral relevance* (philosophical factors).
      *   Key ethical frameworks to consider: Utilitarianism (consequentialism), Deontology (duty), Virtue Ethics, and Psychological/Moral Psychology explanations.

  3.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Acknowledge the courage of the user's action (saving the child) and validate the philosophical weight of their question. State clearly that this is a well-known philosophical problem (Singer's pond).
      *   **The Argument for Inconsistency (The Utilitarian/Singer View):**
          *   Explain Singer's premise: Distance and numbers don't change moral obligation.
          *   If we accept saving the child is obligatory despite cost, then saving distant children via donation should be equally obligatory if the cost/outcome ratio is similar.
          *   Conclusion: From this view, the user *is* inconsistent.
      *   **The Argument for Moral Difference (The Counter-Arguments):**
          *   *Proximity and Special Obligations:* Do we owe more to those physically near us? (Communitarianism/Contractualism).
          *   *Causality and Responsibility:* In the park, the user was the *only* one there (presumably). In the global case, responsibility is diffused among millions.
          *   *Effectiveness/Certainty:* Saving the drowning child is 100% certain. Charity effectiveness varies (though malaria nets are high-impact).
          *   *Psychological Limits:* Humans aren't wired for abstract statistical suffering. Is it fair to demand we override evolutionary psychology?
      *   **Analysing the User's Justifications:**
          *   "Far away": Philosophically weak (Singer's point).
          *   "Didn't see them": Salience vs. Reality.
          *   "Millions of others": The "free rider" problem. Does others' inaction absolve me?
          *   "Already give a little": Is it enough?
      *   **Synthesis/Resolution:**
          *   Acknowledge the psychological reality (it feels different) vs. the moral ideal (it shouldn't matter).
          *   Distinguish between *blame* and *obligation*.
          *   Address the "Shallow Pond" vs. "Deep Pocket" distinction.
      *   **Recommendations (Behaviour, Thinking, or Unease):**
          *   *Unease:* It is not misplaced; it signals moral growth.
          *   *Thinking:* Recognize the psychological bias but don't endorse it as moral truth.
          *   *Behaviour:* Consider Effective Altruism. You don't have to be a saint, but consistency suggests doing more.
      *   **Conclusion:** Summarise. Affirm the good deed but challenge the complacency.

  4.  **Refining the Tone and Language (British English):**
      *   Use "s" instead of "z" in words like "realise", "organise" (though less relevant in this text, keep in mind spelling).
      *   Use "£" for currency.
      *   Vocabulary: "whilst", " amongst", "programme" (if needed), "centre" (if needed).
      *   Tone: Polite, analytical, slightly reserved but warm. Avoid American self-help enthusiasm. Use phrases like "It is worth considering," "One might argue," "Whilst."

  5.  **Self-Correction/Review during Drafting:**
