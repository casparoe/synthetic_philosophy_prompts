      *   *Check:* Did I address the specific justifications the user gave? Yes (distance, numbers, etc.).
      *   *Check:* Is the advice practical? Don't just say "give all your money." Acknowledge the "demandingness objection."
      *   *Check:* Is the British English natural? Ensure I don't sound like a caricature. (e.g., use "charity" not "non-profit", "holiday" not "vacation" if applicable, though not much scope here).
      *   *Check:* Did I validate the user's heroic act? Yes, start there.

  6.  **Final Polish:** (Mental scan of the drafted text)
