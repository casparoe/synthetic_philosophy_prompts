      *   *Better formulation:* The doctrine is *svataḥ pramāṇa* (self-validating) in a pragmatic sense, but logically, it accepts its own partiality. If *anekāntavāda* is partially true, it means there is *some* perspective where absolutism works. Jainism admits this: for an omniscient being (*Kevalin*), absolutism works. For humans, it doesn't. So $S$ is true for humans, false for Kevalins. No contradiction.

