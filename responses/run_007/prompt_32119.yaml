      *   *Nayavāda*: The theory of perspectives.
      *   *Pramāṇa*: Valid means of knowledge.
      *   **Key Distinction:** Jain logic distinguishes between *substantial* existence (*dravyārthika*) and *modal* existence (*paryāyārthika*). Also, the status of the doctrine itself.
      *   **The Standard Jain Response:** The doctrine of *anekāntavāda* is not a claim about *ontology* (what exists) in the same way "the pot exists" is. It is a claim about *epistemology* (how we know).
      *   **Refinement:** Actually, it's deeper. It's about the *nature of predication*. The statement "All claims are partial" is itself a *syād* statement. It is not an absolute assertion (*niscaya*). It is a *pramāṇa* (instrument of knowledge) that validates other *pramāṇas*.
      *   **The "Saptabhaṅgī" (Seven Valued Logic):**
          1.  Syād asti (In some way, it is).
          2.  Syād nāsti (In some way, it is not).
