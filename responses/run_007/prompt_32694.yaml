      *   *Check:* Is the verdict on the "Causal" reading too harsh? It's practically false because almost nothing is 100% controlled. It leads to learned helplessness.
      *   *Check:* Does the Ethical reading license shutting down anxiety? Technically, a Sage wouldn't feel anxiety, but a student is allowed to struggle. A *friend* applying Stoicism should offer support, not judgment. So the answer is "No, it doesn't license *shutting down*."
      *   *Tone:* Keep it analytical but supportive of the user. Don't just bash the roommate, bash the *misapplication*.

  7.  **Final Polish:** Ensure clear headings and bullet points for readability. (Proceed to generate response based on these thoughts.)

