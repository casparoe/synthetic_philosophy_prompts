  Here is the translation of the *White Horse Dialogue* into type-theoretic terms, followed by the residue report and a critical assessment of the mapping itself.

  ### I. Type-Theoretic Rendering

  We assume a type system $\mathcal{T}$ supporting refinement types, subtyping, and a distinction between type equality and subtyping. Let `Horse` be a base type. Let `Color` be an enumerated type or a property.

  **1. The Thesis: "White horse is not horse."**
  *   **Natural Language:** *Bai ma fei ma.*
  *   **Type Theory:** `WhiteHorse ≠ Horse`.
  *   **Note:** Crucially, this is a claim about *type identity* (definitional or propositional equality), not inhabitance. It is not claiming `¬(WhiteHorse <: Horse)`.

  **2. Argument from Composition (Intensional)**
  *   **Text:** "Horse" names shape; "White" names color. Naming color is not naming shape. Therefore, "White Horse" is not "Horse".
  *   **Rendering:**
      *   Let `Horse` be defined by a structural constraint $\Phi_{shape}$.
      *   Let `White` be defined by a constraint $\Phi_{color}$.
      *   `WhiteHorse` is the refinement type `{x : Horse | Φ_color(x) ≡ White}`.
      *   The *intension* (definition) of `Horse` is $\lambda x. \Phi_{shape}(x)$.
      *   The *intension* of `WhiteHorse` is $\lambda x. \Phi_{shape}(x) \land \Phi_{color}(x) \equiv White$.
      *   Since the type constructors differ (one abstracts over color, the other fixes it), the types are not definitionally equal.
      *   **Checker Output:** `TypeOf(WhiteHorse) ~ TypeOf(Horse)` evaluates to `False` in an intensional type theory (e.g., Nominal or ITT), even if `WhiteHorse <: Horse`.

  **3. The Objection: "If there is a white horse, one cannot say there is no horse."**
  *   **Text:** If a white horse exists, a horse exists.
  *   **Rendering:**
      *   Objection assumes: `∃x. x : WhiteHorse` implies `∃x. x : Horse`.
      *   Or, more strongly, the objector conflates subtyping with equality: They assume `WhiteHorse <: Horse` implies `WhiteHorse = Horse`.
      *   **Checker Output:** The objector is asserting that the coercion `WhiteHorse -> Horse` is an isomorphism, or that the subtype relation entails identity.

  **4. The Reply (The Seeking Test): Extensional Discrimination**
  *   **Text:** Ask for a horse $\to$ yellow/black suffices. Ask for a white horse $\to$ yellow/black fails.
  *   **Rendering:**
      *   Define a context (elimination form) `seek : Type → Set<Value> → Bool`.
      *   Let `y` be a `YellowHorse` (inhabitant of `{x:Horse | color(x) = Yellow}`).
      *   Premise 1: `seek(Horse, y) = True`. (Because `YellowHorse <: Horse`).
      *   Premise 2: `seek(WhiteHorse, y) = False`. (Because `¬(YellowHorse <: WhiteHorse)`).
      *   **Leibniz Law Application:** If `WhiteHorse = Horse`, then for all contexts $C$, $C(WhiteHorse) \iff C(Horse)$.
      *   Let $C(T) = (seek(T, y) = True)$.
      *   $C(Horse)$ is True. $C(WhiteHorse)$ is False.
      *   Therefore, `WhiteHorse ≠ Horse`.

  **5. Conclusion**
  *   **Rendering:** The subtype relation holds (`WhiteHorse <: Horse`), but type equality fails (`WhiteHorse ≠ Horse`). The thesis `fei` is interpreted as `≠`, not `¬(:)`.

  ---

  ### II. Residue Report

  **1. Clean Mappings**
  *   **Subtyping vs. Equality:** The core logical move of the dialogue maps perfectly to the distinction between `A <: B` and `A = B`. Modern type theory explicitly separates these, whereas natural language often conflates them (the "is" of predication vs. the "is" of identity). The dialogue's friction arises from this conflation, which type theory resolves by fiat.
  *   **The Seeking Test as Contextual Equivalence:** The "seeking" argument is a precise operationalization of Leibniz equality (indiscernibility of identicals). If two types were equal, they would be interchangeable in all typing contexts (specifically, function argument positions). The dialogue demonstrates a context (the request) where they are not interchangeable.
  *   **Refinement Types:** The definition of `WhiteHorse` as a refinement of `Horse` captures the "compound term" aspect accurately. It preserves the inhabitants of `Horse` while adding a constraint.

  **2. Distortions and Strain**
  *   **Nominal vs. Structural:** Gongsun Long's first argument ("Horse names shape...") is *nominal* or *intensional*. It argues from the meaning of the names. The second argument (Seeking Test) is *structural* or *extensional*. It argues from the set of acceptable values.
      *   In type theory, we usually pick one: either types are equal if they have the same inhabitants (extensional), or if they have the same name/derivation (intensional).
      *   The dialogue uses the *extensional* difference (seeking test) to prove an *intensional* conclusion (the names/concepts are distinct). Type theory typically treats extensional equivalence as sufficient for equality in structural systems. To make the dialogue work in a structural system, you must insist on *intensional* equality (e.g., in a proof assistant like Agda/Coq without UIP, or with nominal typing).
  *   **The Status of "White":** In the text, "White" is treated as a noun/concept parallel to "Horse." In the type rendering, `White` acts as a predicate or a type class constraint. Treating `White` as a standalone type `White` and `WhiteHorse` as `White & Horse` (intersection) works, but the text implies `White` modifies `Horse`. The refinement rendering `{x:Horse | color(x)=White}` is more faithful than intersection, but requires a pre-existing `color` projection which the text implies is part of the "naming" itself.

  **3. No Counterpart (The Void)**
  *   **Metaphysics of Naming (Zheng Ming):** The School of Names was concerned with the rectification of names and social/political order. The argument isn't just about logic; it's about the stability of reference. Type theory assumes a stable universe of types. Gongsun Long is probing whether the map (names) matches the territory (reality). There is no type-theoretic equivalent for "the social function of the type label."
  *   **The Ambiguity of *Fei* (非):** This is the largest residue. In classical Chinese, *fei* can mean "is not" (non-identity), "is not a" (non-predication), or "is wrong to call" (normative).
      *   If *fei* = `≠` (non-identity), the thesis is trivially true in TT (`Refinement<T, P> ≠ T`).
      *   If *fei* = `¬(:)` (non-predication), the thesis is false (`WhiteHorse <: Horse`).
      *   The dialogue's rhetorical power relies on the listener hearing the false version while the speaker proves the true version. Type theory forces you to disambiguate immediately, draining the sophistry of its force.

  ---

  ### III. Extensionality and the Seeking Test

  You suspected the cleanest mapping treats the thesis as type identity rather than inhabitance. **You are correct.**

  However, the "Seeking Test" introduces a tension.
  *   **Extensional View:** If `WhiteHorse` and `Horse` denote sets of values, and `WhiteHorse ⊂ Horse`, they are distinct sets. The seeking test confirms this: the sets of acceptable values for the request "give me a T" differ.
  *   **Intensional View:** The text argues that because the *requirements* differ, the *concept* differs.

  **Does the translation import an extensional picture?**
  Yes, inevitably. When we model `seek(T, y)` as checking inhabitance or subtyping, we are modeling the *extension* of the type (which values pass the check).
  Gongsun Long likely did not hold a set-theoretic view of extensions. He held a mereological or conceptual view. "Horse" picks out the form of horseness. "White Horse" picks out the form of horseness *plus* whiteness. The composite form is not the simple form.
  In type theory, `T` and `{x:T | P}` are distinct types. In a structural system, we often say the latter is a *subtype* of the former. In a nominal system, they are completely unrelated unless declared otherwise.
  The dialogue works best in a **Nominal Type System with Refinement**.
  *   `type Horse`
  *   `type WhiteHorse extends Horse`
  *   `WhiteHorse != Horse` (Nominal inequality)
  *   `WhiteHorse <: Horse` (Subtyping)
  *   The Seeking Test is effectively **Overload Resolution**. `func(h: Horse)` vs `func(h: WhiteHorse)`. Passing a `YellowHorse` resolves to the former, not the latter.

  **What the translation buys you:**
  It clarifies the logical validity. It shows the argument is not a paradox but a precise distinction between *subsumption* and *identity*. It protects the system from the error of assuming `A <: B → A = B`.

  **What the translation silently loses:**
  It loses the *pragmatic* confusion. In natural language, "A white horse is a horse" is true. "A white horse is not a horse" is false. The type-theoretic translation makes "A white horse is not a horse" (`WhiteHorse != Horse`) true but pragmatically marked (we usually care about subtyping, not identity). The dialogue exploits the gap between logical identity and pragmatic classification. Type theory bridges that gap by making the distinction explicit, thereby dissolving the puzzle rather than solving it within the original constraints.

  ---

  ### IV. Honest Assessment of the Exercise

  I must flag a significant category error risk here.

  **1. The Ambiguity of *Fei* is the Feature, not the Bug**
  You asked me to choose an interpretation. I chose `≠` (non-identity) because it makes the argument valid in type theory. However, many sinologists argue the dialogue is *supposed* to be sophistry that relies on the ambiguity of *fei*.
  *   If *fei* means "is not classified as," the thesis is absurd.
  *   If *fei* means "is not identical to," the thesis is trivial.
  The philosophical work of the text may be to expose the instability of language, not to establish a theorem about types. By rendering it in type theory, we "fix" the ambiguity that the text intends to exploit. We are sanitizing the pathology.

  **2. Formal Semantics vs. Metaphysics**
  The request presupposes the *White Horse Dialogue* is doing something akin to formal semantics (mapping terms to extensions). It may instead be doing metaphysics (what constitutes an object's essence).
  *   **Type Theory:** Concerned with valid inference and memory safety (roughly).
  *   **School of Names:** Concerned with the correspondence between language and reality (*Ming-Shi*).
  When Gongsun Long says "Horse names shape," he is making a claim about ontology, not just type constraints. In type theory, `Horse` is a container for values. For Gongsun Long, `Horse` is a *standard* or *measure*.
  The translation treats types as sets of values (extensional) or definitions (intensional). It does not capture the normative weight of "Name" (*Ming*).

  **3. The Blind Spot**
  *   **In your vocabulary:** Type theory assumes a coherent universe where `A <: B` and `A != B` can coexist without paradox. It assumes the distinction is useful. The *White Horse Dialogue* suggests this distinction creates social or cognitive dissonance. The "blind spot" is that type theory is prescriptive (how we *should* type), while the dialogue is descriptive/critical (how language *fails* us).
  *   **In the original argument:** The looseness lies in the equivocation on *fei*. If we force the type-theoretic distinction, the argument becomes a trivial lemma about refinement types. If we allow the natural language ambiguity, the argument becomes a paradox.

  **Conclusion:**
  The mapping is **structurally sound but pragmatically sterile**.
  It successfully models the logical moves:
  1.  `WhiteHorse` is a refinement of `Horse`.
  2.  Refinement implies subtyping (`<:`) but not equality (`=`).
  3.  Contextual discrimination (Seeking Test) proves inequality.

  However, this rendering resolves the tension that the original text seeks to highlight. It turns a philosophical probe into a type-checking lemma. If your goal is to understand the logic, the mapping is faithful. If your goal is to understand the *point* of the School of Names, the mapping obscures the linguistic instability that was their primary subject. The residue is not just lost information; it is the *purpose* of the text.
