      *   **The Problem:** How to map Spinoza's metaphysical/psychological claim onto specific neuroscientific data (like the Libet RP). Is the RP the "cause" we are ignorant of, or the "endeavor" we are conscious of? Are they talking past each other (levels of explanation)?
