          *   If the stone is conscious of its *motion* as *will*, the RP is likely part of the causal chain leading to motion, which the subject interprets as "I decided."
          *   *Hypothesis:* The RP is part of the *causal determination* (the "ignorance" side), while the conscious report ("I chose now") is the *consciousness of desire* (the "awareness" side).
