      *Wait, deeper nuance:* For Spinoza, the *conatus* is the essence. The RP is the physical manifestation of the conatus. The conscious feeling is the mental manifestation. We feel the conatus (the urge). We don't feel the *determinants* of the conatus. So the RP *is* the endeavor in extension. But we don't know *why* the RP started when it did. That's the ignorance.

