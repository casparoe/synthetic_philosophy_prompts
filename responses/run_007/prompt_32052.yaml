      *   **Spinoza's Metaphysics (Briefly):** Explain *Conatus* (striving) and Parallelism. This is essential for the neuroscience mapping. Mind and Body are one.
      *   **Mapping the Stone to the Brain:**
          *   Stone's Motion = Motor Output.
