prompt: |-
  I'm a transplant coordinator at a teaching hospital and we're rewriting our death determination protocol, and I keep hitting the same wall: we've got two standards for death — brain death and circulatory death — and they come apart in exactly the cases that matter. I need a single bedside procedure my team can run that tells us which standard applies when, and what to do when they conflict. The stakes are high and theres a clock on it (organ donation doesn't wait, and families are in the hallway), and the people running it are nurses, residents, and fellows, not philosophers. So give me ordered questions with clear stop conditions, say what counts as a good enough answer at each step, and be honest about the places where the procedure is smuggling in a value judgment rather than a medical fact.

  The procedure has to handle at least these recurring messes:

  - a patient on a ventilator who meets all the clinical brain death criteria but whose heart is still beating and circulation is intact, and the family says how can they be dead if their heart is beating;
  - a controlled DCD case where the heart stops, we start a countdown, and the real question is whether that countdown is testing irreversibility or just permanence, and what we do if there's a gasp or the heart restarts during the window;
  - a patient on ECMO where you can't test circulatory arrest at all because the circuit is doing the circulation.

  Then run the procedure on those three cases. For each one, tell me which criterion ends up doing the work and whether the dead donor rule is actually satisfied on the reading the procedure uses. I suspect the step where the procedure can't settle it and a human has to decide is the step where we accept "permanent" as good enough instead of "irreversible" — but I want you to show me that rather than just take my word for it, and give me at least one case where the procedure tells me something I don't want to hear, like the retrieval can't go forward on our usual timeline.
reasoning: |-
  Here's a thinking process that leads to the suggested protocol and analysis:

  1.  **Analyze the Request:**
      *   **User:** Transplant coordinator at a teaching hospital.
      *   **Task:** Rewrite death determination protocol. Needs a single bedside procedure/algorithm to distinguish between Brain Death (BD) and Circulatory Death (DCD), handle conflicts, and guide action.
      *   **Constraints:**
          *   Ordered questions with clear stop conditions.
          *   Define "good enough" answers at each step.
          *   Explicitly identify value judgments vs. medical facts.
          *   Must handle three specific messy cases:
              1.  BD criteria met, heart beating, family confused.
              2.  Controlled DCD, countdown (irreversibility vs. permanence), auto-resuscitation.
              3.  Patient on ECMO (circulation maintained artificially).
          *   Run the procedure on these three cases.
          *   Identify which criterion does the work.
          *   Assess Dead Donor Rule (DDR) satisfaction.
          *   Highlight the "permanent vs. irreversible" pivot point.
          *   Include at least one case where the procedure says "no" (retrieval can't go forward).
      *   **Tone:** Professional, clinical, honest, pragmatic, ethically transparent. Not philosophical abstraction, but actionable protocol.

  2.  **Deconstruct the Ethical/Medical Landscape:**
      *   **Brain Death (BD):** Total cessation of brain function (including brainstem). Legally death in most jurisdictions (UDDA). Heart can beat with support.
      *   **Circulatory Death (DCD):** Permanent cessation of circulatory and respiratory function. Key word: *Permanent* (will not restart spontaneously) vs. *Irreversible* (cannot be restarted). DCD relies on "permanent" to allow the 5-minute wait time.
      *   **The Conflict:** BD is biological/functional (brain). DCD is functional/legal (circulation). They diverge when technology (ventilators, ECMO) keeps one system going while the other fails.
      *   **The Dead Donor Rule (DDR):** Organs can only be taken after death. Death must be determined before procurement.
      *   **The "Smuggled Value Judgment":** The shift from "irreversible" (biological impossibility) to "permanent" (decision not to resuscitate). This is the ethical crux of DCD.

  3.  **Drafting the Protocol (The "Unified Death Determination Algorithm"):**
      *   *Goal:* A flowchart style text.
      *   *Step 1: Prerequisites.* Exclude confounders (hypothermia, drugs).
      *   *Step 2: Brain Function Assessment.* If brain dead, stop. (BD Path).
      *   *Step 3: Circulatory Assessment.* If heart stopped, assess permanence. (DCD Path).
      *   *Step 4: Technology Interference.* What if machines are doing the work? (ECMO).
      *   *Step 5: Conflict Resolution.* What if family objects or physiology is ambiguous?
      *   *Constraint:* Must explicitly flag value judgments.

      *Refining the Steps:*
      *   Need to prioritize BD because it's the stronger biological claim, but DCD is where the timing pressure is.
      *   Actually, the prompt asks for a *single* procedure to tell us *which standard applies*. So the first step must be triage: Which pathway are we on?
      *   *Triage:* Is the patient on life support with a catastrophic brain injury? -> BD Path. Is the patient being withdrawn from support with expected cardiac arrest? -> DCD Path.
      *   *Wait, the ECMO case complicates this.* ECMO patients can't be DCD (usually) because circulation is artificial. They must be BD.
      *   *Let's structure it as a Decision Tree.*

      *Drafting the "Value Judgment Flags":* I need to insert specific markers (e.g., [ETHICAL FLAG]) where policy overrides biology.

  4.  **Developing the Three Case Studies:**
      *   **Case 1 (BD + Beating Heart):** Standard BD protocol. Family objection.
          *   *Outcome:* Death declared by BD. Heart beating is irrelevant physiologically but relevant socially.
          *   *DDR:* Satisfied (legal death).
          *   *Value Judgment:* Equating brain cessation with human death despite cardiac function.
      *   **Case 2 (DCD + Countdown):** Withdrawal, arrest, 5-minute wait.
          *   *Outcome:* Death declared by DCD.
          *   *DDR:* Satisfied *if* we accept "permanent" = "dead".
          *   *Value Judgment:* The 5-minute wait establishes permanence, not irreversibility. If they auto-resuscitate, the protocol must abort.
          *   *Requirement:* I need to make sure the protocol says "ABORT" if auto-resuscitation happens, satisfying the user's request for a "no" answer.
      *   **Case 3 (ECMO):**
          *   *Outcome:* Cannot use DCD. Must use BD. If BD criteria not met (e.g., sedated but not dead), cannot declare death while on ECMO.
          *   *DDR:* If BD not met, cannot retrieve. This might be the "unwanted answer."
          *   *Nuance:* Some regions allow "ECMO withdrawal -> DCD," but that's ethically fraught. Standard practice is ECMO patients must be BD. If they aren't BD, they aren't dead.

  5.  **Refining the Protocol for the User's Constraints:**
      *   *Ordered Questions:* Yes/No format.
      *   *Stop Conditions:* "Declare Death," "Continue Support," "Abort Procurement."
      *   *Good Enough:* Define clinical signs (apnea test, pulse check).
      *   *Value Judgments:* Explicitly call out the "Permanent vs. Irreversible" switch.

  6.  **Writing the Content - Section by Section:**

      *   **Introduction:** Acknowledge the tension. Validate the user's suspicion about "permanent vs. irreversible."
      *   **The Protocol (UDDA-Bedside Algorithm):**
          *   Phase 1: Exclusion (Confounding factors).
          *   Phase 2: Pathway Selection (BD vs. DCD).
          *   Phase 3: Verification (The actual testing).
          *   Phase 4: The "Permanent" Switch (DCD specific).
          *   Phase 5: Conflict/Family.
      *   **The Value Judgment Audit:** A specific section highlighting where the protocol makes ethical calls, not medical ones.
      *   **Case Applications:** Run the three scenarios through the algorithm.
      *   **The "Unwanted Answer":** Ensure Case 2 or 3 results in a "No Go" if criteria aren't strictly met. Let's make Case 2 the one where auto-resuscitation forces a stop, or Case 3 where ECMO prevents DCD entirely. Let's use Case 2 for the "No" if auto-resuscitation occurs, and Case 3 to highlight the ECMO limitation. Actually, the prompt asks for *one* case where retrieval can't go forward. I will make Case 2 (DCD) result in a "Stop" if the countdown is interrupted, to prove the protocol has teeth.

  7.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is this too philosophical?
      *   *Fix:* Keep the language imperative. "Check pulse," "Observe 5 minutes."
      *   *Critique:* Did I address the ECMO issue?
      *   *Fix:* ECMO maintains circulation artificially. DCD requires cessation of *spontaneous* circulation. Therefore, ECMO patients generally cannot be DCD candidates unless ECMO is withdrawn *first*. If withdrawn, they become DCD. If on ECMO and brain dead, they are BD. I need to be clear: You cannot declare circulatory death while on ECMO.
      *   *Critique:* Did I highlight the "Permanent vs. Irreversible" distinction?
      *   *Fix:* Make this the core of the DCD section.
      *   *Critique:* The user wants to know if DDR is satisfied.
      *   *Fix:* Address this explicitly in the case analysis.

  8.  **Final Polish:**
      *   Ensure the tone is respectful of the high stakes.
      *   Make sure the "Value Judgment" boxes are visible.
      *   Check that the "Stop Conditions" are clear for nurses/residents.

      *(Self-Correction on Case 3)*: The prompt asks about a patient *on* ECMO. If they are on ECMO, circulation is intact. They cannot be DCD. They must be BD. If they are not BD, they are not dead. This is a common point of confusion. I will clarify that ECMO precludes DCD determination *while running*.

      *(Self-Correction on Case 2)*: The prompt asks about the countdown. I need to be precise: The 5-minute wait is for *permanence* (no auto-resuscitation), not *irreversibility* (could we shock them back? Yes, but we won't). This is the value judgment.

      *(Final check on "Unwanted Answer")*: I will construct Case 2 such that if a gasp occurs, the protocol mandates resetting or aborting, potentially missing the organ viability window. This satisfies the "tell me something I don't want to hear" constraint.

  9.  **Final Output Structure:**
      *   Preamble (Acknowledging the tension).
      *   The Protocol (The Algorithm).
      *   The Value Judgment Audit (Where the ethics hide).
      *   Case Applications (1, 2, 3).
      *   DDR Analysis.
      *   The "No-Go" Scenario.

      *(Wait, one more thing)*: The user asked for "Ordered questions with clear stop conditions." I should format the protocol exactly like that. Numbered steps. If/Then logic.

      *(Refining the "Value Judgment" requirement)*: I need to be very blunt. "This step is not biology; it is policy."

      *(Refining the ECMO case)*: If a patient is on ECMO, you cannot test for circulatory death. You must test for brain death. If brain death testing is inconclusive (e.g., facial trauma preventing EEG or apnea test), you cannot declare death while on ECMO. This is a strong "No-Go" candidate. I'll use this for the "unwanted answer" if possible, or stick with the DCD auto-resuscitation. Let's use the DCD auto-resuscitation for the "clock" pressure, as that's more common in transplant coordination. Actually, the ECMO case is often the harder ethical pill: "We can't harvest because we can't declare death." I'll make sure one of the cases ends in "Cannot Declare Death."

      *Decision:* I will make Case 3 (ECMO) the one where the protocol says "You cannot declare death yet" if BD criteria aren't fully met, because circulation is artificial. This is a common pressure point.

      *Wait, re-reading prompt:* "give me at least one case where the procedure tells me something I don't want to hear, like the retrieval can't go forward on our usual timeline."
      Okay, I will ensure Case 2 (DCD) results in a "Reset/Abort" if auto-resuscitation happens, violating the timeline.

      *Let's build it.*
answer: |-
  This is a high-stakes request. You are asking for an algorithm that bridges the gap between biological reality, legal statute (the Uniform Determination of Death Act, or UDDA), and ethical policy (the Dead Donor Rule).

  You are correct: the friction point is not medical; it is philosophical. Specifically, it is the shift from **irreversibility** (physiologically impossible to restart) to **permanence** (will not restart because we will not try). A clinical protocol cannot solve this philosophical problem, but it can expose it so your team knows exactly when they are making a policy decision versus a medical observation.

  Below is the **Unified Death Determination & Procurement Eligibility Protocol (UDDA-PEP)**. It is designed for bedside use by nurses and residents. Following the protocol is the **Value Judgment Audit**, followed by the **Case Applications**.

  ---

  # PART 1: The UDDA-PEP Protocol (Bedside Algorithm)

  **Instructions:** Proceed sequentially. Do not skip steps. If a **STOP CONDITION** is met, halt the process immediately.

  ### PHASE 1: EXCLUSION & PREREQUISITES
  *Goal: Ensure the patient is not in a reversible state of mimicry.*

  1.  **Is the core temperature ≥ 36°C (96.8°F)?**
      *   **NO:** Warm patient. **STOP.** Do not proceed.
      *   **YES:** Proceed to Q2.
  2.  **Is systolic BP ≥ 100 mmHg (or adequate perfusion for age)?**
      *   **NO:** Resuscitate/Pressors. **STOP.** Do not proceed.
      *   **YES:** Proceed to Q3.
  3.  **Are sedatives, paralytics, and metabolic confounders excluded (via washout or lab levels)?**
      *   **NO:** Wait for clearance. **STOP.**
      *   **YES:** Proceed to PHASE 2.

  ### PHASE 2: PATHWAY TRIAGE
  *Goal: Determine which standard of death is physiologically possible.*

  4.  **Is the patient currently supported by Extracorporeal Life Support (ECMO/ECLS)?**
      *   **YES:** Circulatory death cannot be determined while circuit is active. **You must use Brain Death criteria.** Go to PHASE 3A.
      *   **NO:** Proceed to Q5.
  5.  **Is there a catastrophic, irreversible brain injury with coma and apnea?**
      *   **NO:** Brain Death criteria cannot be met. **You must use Circulatory Death criteria.** Go to PHASE 3B.
      *   **YES:** You may choose Brain Death Pathway (PHASE 3A) OR Circulatory Death Pathway (PHASE 3B) based on family consent and OPO policy.

  ### PHASE 3A: BRAIN DEATH DETERMINATION (BD)
  *Goal: Confirm total cessation of brain function.*

  6.  **Are all brainstem reflexes absent (pupils, corneal, oculocephalic, gag, cough)?**
      *   **NO:** Not Brain Dead. **STOP.** (If on ventilator, patient is alive).
      *   **YES:** Proceed to Q7.
  7.  **Is the Apnea Test positive (no respiratory drive at pCO2 ≥ 60 mmHg or rise of 20 mmHg)?**
      *   **NO:** Not Brain Dead. **STOP.**
      *   **YES:** Proceed to Q8.
  8.  **[VALUE JUDGMENT FLAG]:** *Family understands that "death" is being declared despite a beating heart?*
      *   **NO:** Pause for counseling. Do not declare until understood. (Legally you may declare, but ethically/operationally, resolve conflict).
      *   **YES:** **DECLARE DEATH.** Time of death = Time of Apnea Test completion. **Procurement may proceed.**

  ### PHASE 3B: CIRCULATORY DEATH DETERMINATION (DCD)
  *Goal: Confirm permanent cessation of circulation.*

  9.  **Has life support been withdrawn with intent to allow natural death?**
      *   **NO:** **STOP.** (Cannot declare death on supported patient).
      *   **YES:** Proceed to Q10.
  10. **Has pulse and respiration ceased completely (asystole/apnea)?**
      *   **NO:** Wait.
      *   **YES:** Start 5-minute Observation Timer. Proceed to Q11.
  11. **During the 5-minute wait, does the heart restart or does the patient gasp?**
      *   **YES:** **STOP.** Timer resets to zero. If restart persists, patient is not dead. **Procurement cannot proceed on this timeline.**
      *   **NO:** Proceed to Q12.
  12. **[VALUE JUDGMENT FLAG]:** *Is the cessation "Permanent" (will not restart spontaneously) even if not "Irreversible" (could be resuscitated if we tried)?*
      *   **POLICY ANSWER:** Yes, by definition of the 5-minute wait and DNR status.
      *   **ACTION:** **DECLARE DEATH.** Time of death = End of 5-minute wait. **Procurement may proceed.**

  ---

  # PART 2: The Value Judgment Audit

  You asked to be honest about where the procedure smuggles in values. Here are the specific steps where biology ends and policy begins. Your team must know these are not medical facts.

  | Protocol Step | The Medical Fact | The Smuggled Value Judgment |
  | :--- | :--- | :--- |
  | **Phase 3A, Q8** | The brainstem is non-functional. The heart is myogenically active and beating. | **Judgment:** We value the brain as the seat of the person more than the heart. We legally equate "brain off" with "person gone," even if biology (circulation) continues. |
  | **Phase 3B, Q11** | Auto-resuscitation (Lazarus phenomenon) is rare after 65 seconds, but *biological* reversibility exists for minutes. | **Judgment:** We value the 5-minute window as "enough" time to ensure permanence. We prioritize organ viability over waiting for biological *irreversibility* (which might take 20+ mins). |
  | **Phase 3B, Q12** | We *could* restart the heart (it is not biologically irreversible). We *choose* not to. | **Judgment:** "Permanent" (we won't try) is accepted as a substitute for "Irreversible" (we can't). This is the ethical core of DCD. The protocol treats this policy decision as a clinical finding. |
  | **Phase 2, Q4 (ECMO)** | The machine is circulating blood. The heart may be empty or beating. | **Judgment:** We refuse to declare circulatory death while a machine does the work. We force the Brain Death standard here, which may exclude donors who are not brain dead but dependent on ECMO. |

  ---

  # PART 3: Case Applications

  Here is how the protocol handles your three recurring messes.

  ### Case 1: The Beating Heart Brain Dead Patient
  *Scenario: Patient on ventilator meets all BD criteria (Phase 3A). Heart is beating. Family asks, "How can they be dead if the chest is moving?"*

  *   **Protocol Path:** Phase 1 (Pass) → Phase 2, Q5 (Yes, catastrophic injury) → Phase 3A.
  *   **Critical Step:** Phase 3A, Q8 (Family Understanding).
  *   **Which Criterion Does the Work:** **Brain Death.** Circulation is irrelevant here.
  *   **Dead Donor Rule (DDR):** **Satisfied.** Legally and medically, the patient is dead. The heart is a pump, not the person.
  *   **The Conflict:** The protocol halts at Q8 if the family does not understand. It forces a pause for counseling. It does *not* allow the team to ignore the family's conceptual conflict, even if the law is on your side.
  *   **Outcome:** If counseling succeeds, death is declared. Procurement proceeds.

  ### Case 2: The Controlled DCD with Auto-Resuscitation
  *Scenario: Withdrawal of support. Heart stops. 5-minute countdown begins. At minute 3:45, the heart restarts briefly (agonal rhythm) then stops again at 4:10.*

  *   **Protocol Path:** Phase 1 (Pass) → Phase 2, Q5 (No catastrophic brain injury/BD not tested) → Phase 3B.
  *   **Critical Step:** Phase 3B, Q11 (Restart during wait).
  *   **Which Criterion Does the Work:** **Circulatory Death (Permanence).**
  *   **Dead Donor Rule (DDR):** **NOT Satisfied (Yet).** The protocol mandates a *continuous* 5 minutes of cessation.
  *   **The "Unwanted Answer":** The protocol says **STOP.** The timer resets to zero. You must wait another 5 minutes from the *last* beat.
      *   *Why this hurts:* This delay may push warm ischemia time beyond acceptable limits for kidneys or liver. The organs may be lost.
      *   *Why this is necessary:* If you ignore the gasp, you are declaring death while circulation is present. That violates the DDR. The protocol protects the team from liability and ethical breach by forcing the "No-Go."
  *   **Value Judgment:** The 5-minute rule is arbitrary (based on auto-resuscitation statistics), but strict adherence is the only way to claim "permanence."

  ### Case 3: The ECMO Patient
  *Scenario: Patient on VA-ECMO after cardiac arrest. Brain injury is severe, but apnea test is inconclusive due to hemodynamic instability during the test. Family wants to donate. OPO asks if we can declare DCD.*

  *   **Protocol Path:** Phase 1 (Pass) → Phase 2, Q4 (Is patient on ECMO? **YES**).
  *   **Critical Step:** Phase 2, Q4 Directive ("You must use Brain Death criteria").
  *   **Which Criterion Does the Work:** **Brain Death.** Circulatory death is **impossible** to determine while ECMO runs.
  *   **Dead Donor Rule (DDR):** **AT RISK.**
      *   *Analysis:* You cannot declare circulatory death because circulation is intact (via machine). You cannot declare brain death because the apnea test was inconclusive.
      *   *Result:* **Patient is not dead.**
  *   **The "Unwanted Answer":** **Retrieval cannot go forward.**
      *   *Why:* To declare DCD, you must withdraw ECMO. If you withdraw ECMO, the patient arrests. You then enter Phase 3B (DCD). However, if the patient is not Brain Dead, withdrawing ECMO *causes* the death. This is ethically distinct than *allowing* death (DCD). Many institutions forbid "ECMO withdrawal for DCD" if the patient is not already Brain Dead, as it blurs the line between killing and letting die.
      *   *Protocol Verdict:* If BD criteria are not fully met, and ECMO is running, **NO DECLARATION OF DEATH.** No procurement.
  *   **Value Judgment:** This step prioritizes the "Dead Donor Rule" over "Organ Utility." It acknowledges that we cannot use technology to sustain life (ECMO) and simultaneously claim circulatory death.

  ---

  # PART 4: Summary of Ethical Friction Points

  You suspected the procedure can't settle the "Permanent vs. Irreversible" debate. You are right. The protocol **codifies** the debate rather than solving it.

  1.  **The DCD Pivot (Phase 3B, Q12):** This is the exact moment you identified. The protocol accepts "Permanent" as a proxy for "Dead." It explicitly tells the nurse: *"Do not check if the heart is irreversibly broken. Check if it has stopped long enough that we agree not to fix it."*
  2.  **The ECMO Wall (Phase 2, Q4):** This prevents the team from "gaming" the system. You cannot keep circulation artificial (ECMO) to preserve organs and claim circulatory death simultaneously. You must choose: Is the brain dead? If no, and circulation is artificial, the patient is alive.
  3.  **The Family Veto (Phase 3A, Q8):** While legally weak in many jurisdictions, operationally this is a hard stop. It acknowledges that death is a social status, not just a biological one.

  **Recommendation for your Team:**
  When training residents and nurses on this protocol, do not hide the **Value Judgment Flags**. Tell them: *"Step 12 is not biology. It is policy. We agree as a society that 5 minutes of no pulse equals death, even if a defibrillator could have fixed it. Your job is to enforce the 5 minutes strictly, because that is the only thing making that policy true."*

  If you hide that, they will feel like they are killing patients when the heart restarts during the countdown. If you show them, they understand they are guardians of a legal boundary.
