      *   *The "Kind vs. Particular" Correction:* The user suspects "Kind vs. Particular." Actually, Gongsun Long is arguing about *Concepts/Names*, not particulars. It's "The Concept 'White Horse'" vs "The Concept 'Horse'". I need to gently correct this without using heavy jargon. It's about *Extension* and *Intension*.
      *   *What to leave out:* Historical context (Gongsun Long's life), other School of Names paradoxes (The Egg has No Hair, etc.), Confucian/Mohist reactions.

