          *   *Actually, let's look at the User's suspicion:* "Kind vs. Particular." Gongsun Long isn't talking about particulars (this specific horse) but about *concepts* (the name 'horse' vs the name 'white horse').
          *   *Revised Carrying Example:* **"A 'synonym' is not a 'word'."** (A bit dry).
          *   *Revised Carrying Example 2:* **"A 'metaphor' is not a 'sentence'."**
          *   *Let's go with something concrete but writerly:* **"A 'draft' is not a 'manuscript'."**
          *   *Actually, the most intuitive one for the logic of "White Horse is Not Horse" is about *requirements*.*
          *   *Let's use:* **"A 'password' is not a 'word'."**
          *   *No, let's stick to the prompt's request for "ordinary writing or description."*
          *   *Idea:* **"A 'red pen' is not a 'pen'."** (Too close to original).
          *   *Idea:* **"A 'sonnet' is not a 'poem'."**
              *   If I ask for a poem, a sonnet works.
              *   If I ask for a sonnet, a free verse poem does not work.
              *   Therefore, the *term* "sonnet" implies constraints the *term* "poem" does not. They are not identical in meaning, even if the extension overlaps.
              *   *This is perfect for poets.*

  5.  **Structure the Two Hours:**
      *   **0:00-0:20:** Hook & Misconception Check. (Don't lecture).
      *   **0:20-0:50:** The "Sonnet/Poem" Exercise (The Carrying Example). Establish the logic of "X is not Y" when X is a subset of Y.
      *   **0:50-1:00:** Break.
      *   **1:00-1:30:** Apply to "White Horse." Translate the logic. Address the "White" adjective issue.
      *   **1:30-1:50:** Discussion/Implications for Writing.
      *   **1:50-2:00:** The Diagnostic Question.

  6.  **Addressing Misconceptions:**
      *   *Misconception 1:* "White" is just descriptive texture. *Correction:* "White" is a distinct naming category (color) vs. "Horse" (shape/form).
      *   *Misconception 2:* It's about physical objects. *Correction:* It's about *names* (Ming).
      *   *Misconception 3:* It's a paradox/zen koan. *Correction:* It's a semantic claim about identity.

  7.  **Drafting the Plan (Iterative refinement):**
      *   *Intro:* Need to stop them from thinking "Of course it's a horse."
      *   *The "White" Issue:* Writers see "white horse" as [Image: Horse] + [Texture: White]. Gongsun Long sees [Name: Shape] + [Name: Color] = [Compound Name]. The Compound Name $\neq$ Simple Name.
      *   *The Example:* "A Sonnet is not a Poem."
          *   If I say "Write me a poem," you can write a sonnet.
          *   If I say "Write me a sonnet," you cannot write a villanelle.
