      *   *Draft:* "When does a description become a definition?"
      *   *Better:* "If you are asked to describe a 'villain,' can you describe a 'person'?"
      *   *Best:* "If I cross out the word 'white' in 'white horse,' have I changed the object or the request?" (A bit vague).
      *   *Let's try:* "If you are writing a scene and you change 'he rode a horse' to 'he rode a white horse,' have you added detail to the world, or have you changed the contract with the reader?"
      *   *Actually, the prompt asks for a question to show they grasped the underlying problem.*
      *   *Question:* "If 'white horse' is not 'horse,' is 'white' a property of the horse, or a restriction on the name?"

      *   *Wait, let's make it more writer-focused.*
      *   *Question:* "In your writing, when does adding an adjective stop describing the noun and start creating a new category that excludes the noun?"

  9.  **Final Review against Constraints:**
      *   Two hours? Yes, broken down.
      *   No lecture? Yes, interactive exercises.
      *   Address "White as adjective"? Yes, in the middle section.
      *   Carrying example? "Sonnet is not a Poem."
      *   Misconceptions? Addressed (Image vs. Term).
      *   Diagnostic Question? Included.
      *   What to leave out? History, other paradoxes.

  10. **Polishing the Tone:** Needs to be respectful of their craft, using their language (contract, constraint, category) to explain the philosophy.

  *(Self-Correction during drafting)*: I need to make sure I don't validate the claim as "True" in a modern logical sense (in modern logic, a white horse *is* a horse, subset relation). Gongsun Long's point is about *identity of terms*, not subset membership. "A is not B" means "The concept A is not identical to the concept B." I must ensure the writers don't just think "Oh, it's a subset." The point is the *Name* "White Horse" is a compound that functions differently than the *Name* "Horse." I need to emphasize the *functional difference in language*.

  Let's refine the "Sonnet" example.
  Statement: "A sonnet is not a poem."
  Reaction: "Yes it is!"
  Counter: "If I ask for a poem, a limerick works. If I ask for a sonnet, a limerick fails. Therefore the *term* 'sonnet' does not do the same work as the *term* 'poem'."
  This aligns with Gongsun Long: "If you want a horse, a yellow horse comes. If you want a white horse, a yellow horse does not come. Therefore 'white horse' is not 'horse'."
  This is the key parallel.

  Okay, ready to write the plan.
answer: |-
  Here is a seminar plan designed to move creative writers from confusion to insight without turning them into logicians or historians.

  ### Seminar Title: The Contract of Naming
  **Subtitle:** *Why a White Horse Is Not a Horse (And Why It Matters for Writers)*
  **Duration:** 2 Hours
  **Audience:** Novelists and Poets (No philosophy background)

  ---

  ### Part 1: The Trap of the Image (0:00 – 0:25)

  **Goal:** Dislodge the assumption that language is primarily descriptive or imagistic.
  **Method:** Interactive provocation, not lecture.

  **The Opening Move:**
  Do not introduce the School of Names or Gongsun Long yet. Write the sentence **"A white horse is not a horse"** on the board.

  Ask the room: *"Who thinks this is false?"* (Everyone will raise their hands).
  Ask: *"Who thinks this is a translation error?"* (Many will).
  Ask: *"Who thinks this is a poetic metaphor?"* (Some will).

  **The Intervention:**
  Tell them: *"For the next two hours, you are not allowed to think about animals. You are not allowed to think about the color white. You are only allowed to think about **requests**."*

  **The Misconception Check:**
  Writers treat "white" as an adjective that adds texture (connotation). In this philosophy, "white" is a **term** that adds a constraint (denotation).
  *   **Instruction:** Explicitly state: "In this room, 'White' is not a description of a surface. It is a rule for inclusion."

  ---

  ### Part 2: The Carrying Example (0:25 – 0:50)

  **Goal:** Establish the logical distinction using a writerly analogy before touching the Chinese text.
  **The Example:** **"A sonnet is not a poem."**

  **Why this example?**
  1.  **Familiarity:** Every poet knows the form.
  2.  **Structure:** Like "White Horse," it is a [Specific Term] vs. [General Term].
  3.  **Constraint:** It relies on rules, not imagery.

  **The Exercise:**
  1.  **Scenario A:** Ask the room, *"If I commission you to write a **poem**, and you hand me a sonnet, have you fulfilled the request?"* (Yes).
  2.  **Scenario B:** Ask the room, *"If I commission you to write a **sonnet**, and you hand me a free verse poem, have you fulfilled the request?"* (No).
  3.  **Scenario C:** *"If I commission you to write a **sonnet**, and you hand me a villanelle, have you fulfilled the request?"* (No).

  **The Deduction (Draw this on the board):**
  *   The set of things that satisfy "Poem" includes sonnets, limericks, and free verse.
  *   The set of things that satisfy "Sonnet" includes *only* sonnets.
  *   Therefore, the **term** "Sonnet" does not do the same work as the **term** "Poem."
  *   If "Sonnet" were identical to "Poem," you could swap the words in the contract without changing the outcome. You cannot.
  *   **Conclusion:** In the strict logic of naming, "Sonnet is not Poem."

  **Key Distinction to Teach:**
  This is where you correct the user's suspicion. It is not about "Kind vs. Particular" (e.g., *this* horse vs. *all* horses). It is about **Simple Name vs. Compound Name.**
  *   "Poem" = One rule (language arranged artistically).
  *   "Sonnet" = Two rules (language arranged artistically + 14 lines/rhyme scheme).
  *   A compound name is not identical to a simple name, even if the object is the same.

  ---

  ### Part 3: The White Horse Dialogue (1:00 – 1:30)

  **Goal:** Map the "Sonnet" logic onto Gongsun Long's argument.
  **Method:** Close reading of the logic, not the history.

  **The Text:**
  Provide a handout with only the core logical moves of the *White Horse Dialogue* (stripped of archaic flourishes).
  1.  "Horse" names the shape.
  2.  "White" names the color.
  3.  "White Horse" names color + shape.
  4.  Therefore, the name "White Horse" is not the name "Horse."

  **Addressing the "Adjective" Misconception:**
  Writers will still want to say, *"But 'white' just modifies 'horse'."*
  *   **Counter-move:** Ask them to treat "White" as a noun. In the dialogue, "White" stands alone as a concept (Color).
  *   **Analogy:** "White" is not like "tall" (which fades into the noun). "White" is like a filter.
  *   **The "Seeking" Argument:** This is the strongest point in the original text.
      *   If you seek a **horse**, a yellow horse or a black horse will answer.
      *   If you seek a **white horse**, a yellow or black horse will *not* answer.
      *   If the terms were identical, the response would be identical.
      *   Since the response differs, the terms are not identical.

  **Discussion Point:**
  Ask the writers: *"When you write 'the killer' vs 'the man', do they function differently in a mystery novel?"*
  *   "The man" could be anyone.
  *   "The killer" implies a specific constraint (guilt).
  *   If you reveal "the man" is not "the killer," the sentence holds.

  ---

  ### Part 4: Implications for Writing (1:30 – 1:50)

  **Goal:** Make it practical. Why should a novelist care about 4th-century BCE semantics?

  **The "Contract with the Reader":**
  Explain that Gongsun Long is arguing about the **precision of the contract between language and reality.**
  *   When a writer names something, they are not just pointing; they are excluding.
  *   To say "White Horse" is to actively *exclude* black horses.
  *   To say "Horse" is to *include* them.
  *   Therefore, adding the adjective changes the **ontology of the request**, not just the picture.

  **Workshop Mini-Task (10 mins):**
  Ask them to take a simple sentence (e.g., "She entered the room") and add one modifier that changes the *category* of the subject, not just the image.
  *   *Example:* "She entered the room" vs. "The intruder entered the room."
  *   "She" = Human/Female.
  *   "Intruder" = Human/Female + Illegal Entry + Threat.
  *   Discuss: Does "Intruder" equal "She"? Logically, no. One permits innocence, the other forbids it.

  ---

  ### Part 5: The Diagnostic Question (1:50 – 2:00)

  **Goal:** Test if they grasp the semantic problem, not just the logical trick.

  **Do not ask:** "Is a white horse a horse?" (They will revert to common sense).
  **Do not ask:** "Who was Gongsun Long?" (Irrelevant history).

  **Ask this:**
  > **"If you are writing a story and you change the phrase 'a horse' to 'a white horse', have you added a detail to the world, or have you changed the rules of the search?"**

  **What to listen for:**
  *   **Superficial Understanding:** "You added a detail." (They missed the point; they think it's just imagery).
  *   **Deep Understanding:** "You changed the rules of the search." (They understand that the *term* now excludes things the previous term included, altering the logical extension of the sentence).

  ---

  ### What to Leave Out (The "Do Not Teach" List)

  1.  **Historical Context:** Do not discuss the Warring States period, the Qin unification, or the political utility of the School of Names. It distracts from the linguistic problem.
  2.  **Other Paradoxes:** Do not mention "The Egg Has No Hair" or "A Chicken Has Three Feet." These sound like nonsense riddles and will undermine your credibility with serious writers.
  3.  **Modern Logic Symbols:** Do not use set theory notation ($\subset$, $\in$, etc.). Use Venn diagrams if necessary, but words are better for this audience.
  4.  **The "Truth" Value:** Do not get bogged down in whether Gongsun Long was "right" by modern standards. In modern logic, "White Horse" is a subset of "Horse." Gongsun Long is arguing about *identity of terms*, not subset membership. Acknowledge the difference, but focus on the *function* of the terms.
  5.  **Metaphysics:** Avoid deep dives into whether "Whiteness" exists independently of objects (Platonic forms). Keep it about *naming*.

  ### Summary of the Pedagogical Arc
  1.  **Disorient:** Challenge their intuition ("White horse is not horse").
  2.  **Anchor:** Use a writerly example they accept ("Sonnet is not poem").
  3.  **Map:** Apply the anchor to the text ("Seeking a horse" vs. "Seeking a white horse").
  4.  **Apply:** Connect to the writer's craft (Naming as exclusion/contract).
  5.  **Verify:** The diagnostic question confirms they see language as a system of rules, not just images.
