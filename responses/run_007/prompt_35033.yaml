      *   *Case 4 (Innovation Gains):* Acceptable. ($\uparrow$ Floor via productivity). Process matters (merit/effort/contribution implied).
      *   *Case 5 (Monopoly Gains):* Uneasy/Unacceptable. ($\uparrow$ Floor via rent-seeking). Process matters (fairness of source). Same outcome as 4, different judgment. *Crucial:* This introduces a procedural/historical entitlement element, not just end-state.
      *   *Case 6 (Negligible Floor Gain):* Unacceptable. (Tiny $\uparrow$ Floor, Massive $\uparrow$ Top). Suggests a threshold of significance or a diminishing marginal weight on floor gains vs. inequality costs. Contradicts strict Maximin (which would accept *any* gain to the worst-off).
      *   *Case 7 (Next Generation):* Unacceptable. ($\uparrow$ Current Floor, $\downarrow$ Future Floor). Introduces intergenerational justice/sustainability.
      *   *Case 8 (Social Standing):* Unacceptable. ($\uparrow$ Money, $\downarrow$ Social Participation). Defines "well-being" not just as income but as social inclusion/status (Relativism/Capabilities).

  3.  **Drafting the Principle(s):**
