answer: |-
  Here is a structured specification of the desiderata for a theory of pain's badness, designed to help you evaluate candidate theories (e.g., Evaluativism, Imperativism, Attitudinalism, Simple Hedonism).

  ### 1. Desiderata for a Theory of Pain's Badness

  **1. The Dissociation Constraint (The Asymbolia Datum)**
  *   **Case/Datum:** Clinical pain asymbolia, morphine dissociation, and cingulotomy cases where patients report sensory pain ("I feel a prick") but lack unpleasantness ("It doesn't bother me"). Conversely, cases of severe suffering without nociception (e.g., severe grief, depression, or phantom limb suffering where no tissue damage is present).
  *   **Status:** **Non-negotiable.** Any theory denying these phenomena exist contradicts established clinical neurology.
  *   **What it Rules Out:** **Simple Sensory Hedonism** (the view that the sensory quale of pain is *identical* to its badness). It also rules out any theory that claims nociceptive processing is *sufficient* for pain's badness.
  *   **Requirement:** The theory must posit a composite structure to pain experience, distinguishing the *sensory-discriminative* component (location, intensity, type) from the *affective-evaluative* component (unpleasantness, badness).

  **2. The Phenomenal Constraint (The "What It's Like" Requirement)**
  *   **Case/Datum:** The first-person experience of pain. When pain is bad, its badness is not an inferred property (like "this tissue damage is evolutionarily disadvantageous"); it is immediately felt.
  *   **Status:** **Non-negotiable.** A theory that makes pain's badness purely external or dispositional fails to capture the phenomenology of suffering.
  *   **What it Rules Out:** **Pure Externalism** (badness is solely a matter of actual tissue damage) and **Pure Consequentialism** (badness is solely a matter of future avoidance outcomes).
  *   **Requirement:** The theory must locate the badness *within* the conscious experience, even if it is not identical to the sensory quality. The subject must be aware of the badness *in* feeling the pain.

  **3. The Motivational Internalism Constraint**
  *   **Case/Datum:** Normal pain experience intrinsically motivates avoidance or relief. In asymbolia, the loss of badness correlates with a loss of motivation to avoid the stimulus.
  *   **Status:** **Strong Desideratum** (Debated). While most theories aim to explain this, some (like certain Attitudinal views) might outsource motivation to a separate desire not to have the experience.
  *   **What it Rules Out:** **Pure Cognitivism** that treats pain as a neutral belief about damage (unless coupled with a separate desire). It pressures theories to link badness directly to conative states (commands, desires, or imperatives).
  *   **Requirement:** The theory should explain the *necessary connection* (or strong default tendency) between experiencing pain as bad and being motivated to stop it, without relying on ad hoc additions.

  **4. The Neuroscience Consistency Constraint**
  *   **Case/Datum:** The separation of the lateral pain system (somatosensory cortex; sensory-discriminative) and the medial pain system (anterior cingulate/insula; affective-motivational). Lesions to the medial system often produce asymbolia.
  *   **Status:** **Weak Desideratum / Consistency Check.** Philosophy is not neuroscience; however, a theory of mind should not be *incompatible* with robust empirical findings.
  *   **What it Rules Out:** Theories that locate the *essence* of pain's badness exclusively in primary somatosensory processing (S1).
  *   **Requirement:** The theory must be compatible with the hypothesis that the neural correlates of "sensory intensity" and "affective badness" are distinct and dissociable. It need not reduce badness to medial pathway activity, but it cannot claim badness supervenes solely on lateral pathway activity.

  **5. The Normative Authority Constraint**
  *   **Case/Datum:** Pain provides immediate, prima facie reasons for action. If you are in pain, you have a reason to stop it, independent of your long-term goals.
  *   **Status:** **Desideratum.**
  *   **What it Rules Out:** **Error Theory** (pain isn't really bad) or **Subjectivist Voluntarism** (pain is only bad if you decide it is).
  *   **Requirement:** The theory must explain why pain's badness is reason-giving. It cannot treat the badness as a mere illusion or a wholly contingent preference.

  **6. The Introspective Transparency Constraint**
  *   **Case/Datum:** When attending to pain, subjects typically cannot distinguish between "the sensation" and "the unpleasantness" in normal conditions. They feel like a unitary "hurt."
  *   **Status:** **Desideratum.**
  *   **What it Rules Out:** Overly complex **Dual-Component Theories** that require subjects to consciously entertain two distinct mental states (e.g., a sensation *plus* a separate judgment of badness) to be in pain.
  *   **Requirement:** While the theory may posit distinct components (to satisfy Constraint #1), it must explain why they usually appear phenomenally unified.

  ---

  ### 2. Tensions Between Desiderata

  **Tension A: The Dissociation Constraint vs. Phenomenal Intrinsicality**
  *   **The Conflict:** The Dissociation Constraint (#1) suggests badness is separable from sensation (supporting a Relational/Attitudinal view). However, the Phenomenal Constraint (#2) suggests badness is *felt* as part of the experience (supporting an Intrinsic/Evaluativist view).
  *   **Why it's hard:** If badness is relational (e.g., "I hate this sensation"), does it remain *intrinsic to the experience*? Attitudinal theorists say yes (the hating is part of the experience); Evaluativists say yes (the representation of badness is part of the content). But satisfying #1 often makes the view look "disjunctive," threatening #6 (Transparency).
  *   **Resolution Status:** **Apparent.** Most successful theories (like Attitudinalism) resolve this by arguing that the *attitude* is part of the phenomenal character, not an external relation. The tension is only real if one assumes "intrinsic" means "property of the sensory quale alone."

  **Tension B: Motivational Internalism vs. Asymbolia**
  *   **The Conflict:** Motivational Internalism (#3) suggests pain *necessarily* motivates. Asymbolia (#1) shows patients feel pain (on some descriptions) but lack motivation.
  *   **Why it's hard:** If you strengthen #3 to "Necessary Connection," you must deny that asymbolics feel *pain* (calling it "nociception without pain"). If you accept asymbolics feel *pain*, you must weaken #3 to "Default Tendency."
  *   **Resolution Status:** **Real.** This forces a choice: either redefine "pain" to exclude asymbolia (protecting Internalism) or accept that the link between badness and motivation is contingent (protecting the clinical data).

  **Tension C: Neuroscience Consistency vs. Phenomenal Unity**
  *   **The Conflict:** Neuroscience (#4) suggests two distinct systems (Lateral vs. Medial). Phenomenal Transparency (#6) suggests one unified experience.
  *   **Why it's hard:** Mapping a unified phenomenology onto a bifurcated neural architecture risks a "binding problem." A theory that leans too hard into the neural distinction risks making the experience sound like two separate events (a sensation *and* a feeling), violating #6.
  *   **Resolution Status:** **Apparent.** Neural distinctness does not entail phenomenal distinctness (just as color and shape processing are distinct but experienced unifiedly).

  ---

  ### 3. The Single Most Narrowing Requirement

  **The Dissociation Constraint (#1).**

  *   **Why:** This is the "killer constraint" for traditional theories.
  *   **Impact:** It eliminates **Simple Hedonism** (the view that pain is a simple sensation that is intrinsically bad). It eliminates **Naive Perceptualism** (the view that pain is simply the perception of damage, assuming damage perception is inherently bad).
  *   **Consequence:** It forces *every* surviving theory to be a **Composite Theory**. Whether it is Evaluativism (Sensation + Evaluation), Imperativism (Sensation + Command), or Attitudinalism (Sensation + Attitude), the theory *must* posit at least two distinct functional or phenomenal components. This immediately narrows the field from "monistic" theories of pain to "bifurcated" theories.

  ---

  ### 4. An Illegitimate Desideratum

  **The Demand for "Intrinsic Badness of the Sensory Quale."**

  *   **The Claim:** Many papers assume as a starting point that if a theory is to be successful, it must show that the *sensory quality* of pain (the prick, the throb) is itself intrinsically bad.
  *   **Why it is Illegitimate:** This begs the question against the most empirically adequate theories (specifically **Attitudinalism** and some forms of **Imperativism**).
  *   **The Argument:** The clinical data (Asymbolia) strongly suggests the sensory quale is *neutral* and becomes bad only when accompanied by a specific reaction (an attitude, a command, or an evaluation). To demand that the *sensation itself* be the bearer of badness is to demand that the theory ignore the dissociation data.
  *   **Recommendation:** Do not treat "Intrinsic Sensory Badness" as a requirement. Treat "Phenomenal Badness" (the experience as a whole is bad) as the requirement. This allows for the badness to be constituted by the subject's *relation* to the sensation (Attitudinalism) without failing the Phenomenal Constraint. Insisting on intrinsic sensory badness artificially privileges Evaluativism/Perceptualism and penalizes the views that best handle the neurological data.

  ### Summary for Your Paper
  When evaluating candidates, use **Constraint #1 (Dissociation)** as your primary filter. Any theory that cannot explain how a subject can feel pain without suffering (or suffer without nociception) should be discarded. Then, use **Constraint #3 (Motivation)** to distinguish between the survivors: does the theory explain *why* the badness moves us to act, or does it leave that as a mystery? Finally, beware of theories that satisfy the neuroscience by fracturing the phenomenology too severely (violating **Constraint #6**).
