answer: |-
  This is a classic stalemate in the literature on commodification, and your confusion is a sign that you're tracking the arguments correctly rather than missing something obvious. This debate maps almost perfectly onto the central fault lines in political philosophy regarding markets in bodies, spanning from Richard Titmuss to Margaret Radin, Michael Sandel, and Janet Radcliffe-Richards.

  Since you asked for a specialist's breakdown, I will avoid giving you a policy recommendation. Instead, I will evaluate the *argumentative validity* of each move, flagging where the literature agrees and where it remains fractured.

  ### Part 1: Brainstorming the Distinct Objections
  Before grading the moves, it helps to categorize the theoretical tools they are deploying. You can think of their exchange as cycling through three distinct families of objection:

  1.  **The Coercion/Exploitation Objection (Maya 1 / Eli 1):**
      *   *Core Claim:* Transactions are invalid if background conditions (poverty) make consent non-voluntary or wrongful.
      *   *Key Literature:* Alan Wertheimer (exploitation), Marxian background justice.
  2.  **The Semantic/Corruption Objection (Maya 2 / Eli 2):**
      *   *Core Claim:* Markets change the *meaning* of the good being traded, degrading human dignity or social norms.
      *   *Key Literature:* Michael Sandel (*What Money Can't Buy*), Elizabeth Anderson (*Value in Ethics and Economics*), Margaret Radin ("contested commodities").
  3.  **The Empirical/Consequentialist Objection (Maya 3 / Eli 3):**
      *   *Core Claim:* Markets will empirically increase or decrease supply, crowd out altruism, or save/kills lives.
      *   *Key Literature:* Richard Titmuss (*The Gift Relationship*), empirical economics of organ supply.

  ---

  ### Part 2: Point-by-Point Verdict

  Here is the breakdown of who lands their punch and where the arguments leak.

  #### Round 1: Exploitation vs. The Harms of Prohibition
  **Maya:** "Desperation is doing the choosing."
  **Eli:** "The ban removes options; mining/military are also risky."

  *   **Maya's Strength:** She correctly identifies that *formal* consent does not guarantee *substantive* voluntariness. In the literature, this is the distinction between "choice" and "acceptable alternatives." If the only alternative to selling a kidney is starvation, the transaction is coercive in a moral sense, even if not legal.
  *   **Maya's Weakness:** She assumes exploitation necessarily entails prohibition. Many philosophers (e.g., Ruth Sample, Wertheimer) argue that a transaction can be exploitative (unfair) but still permissible if it is the best option available to the agent *and* prohibition makes them worse off.
  *   **Eli's Strength:** He lands a solid hit on the "consistency" front. This is the **Argument from Parity**. If we allow poor people to undertake high-risk, low-autonomy labor (mining, military) for money, banning kidney sales looks like paternalism specific to the poor. He also correctly invokes the **Harms of Prohibition** argument (championed by Janet Radcliffe-Richards): if the ban causes deaths on the waiting list, the ban itself is a violent act.
  *   **Eli's Weakness:** His analogy to mining/military is imperfect. Those are contracts for *labor* or *risk*, not contracts for *bodily parts*. There is a philosophical distinction between renting your body's capacity and alienating a piece of the body itself (the "inalienability" distinction). He treats the body as just another asset, which begs the question against Maya.
  *   **Verdict:** **Eli wins on consistency, Maya wins on moral texture.** Eli shows Maya hasn't explained why kidneys are different from dangerous labor. Maya shows Eli hasn't explained why poverty-induced consent is valid here when we worry about it elsewhere.

  #### Round 2: Meaning vs. Repugnance
  **Maya:** "Selling changes what the body is (parts inventory)."
  **Eli:** "That's repugnance. Markets change meaning everywhere (childcare)."

  *   **Maya's Strength:** She is invoking **Expressive Theory** (Anderson) or **Commodification as Corruption** (Sandel). The claim isn't about harm; it's about *category error*. She argues that treating the body as a storehouse of parts violates a normative ideal of human integrity.
  *   **Maya's Weakness:** She asserts the meaning change is bad without explaining *why*. Why is "parts inventory" worse than "labor instrument"? This risks the **Naturalistic Fallacy**—assuming the "natural" meaning of the body is the correct one.
  *   **Eli's Strength:** He correctly identifies the **Adaptive Repugnance** problem. As he notes, blood and surrogacy were once taboo. He also correctly notes that markets *always* alter meanings (the "childcare" example is a classic Elizabeth Anderson point). To say "meaning changed" is not enough; one must show the *new* meaning is morally inferior.
  *   **Eli's Weakness:** He assumes that because some meaning changes are acceptable (childcare), *all* are. He demands a "non-circular story," which is fair, but he doesn't offer one for why kidneys *shouldn't* have one. He treats the "meaning" argument as purely emotional (repugnance), ignoring the sociological claim that markets can erode non-market norms (the "crowding out" argument she raises next).
  *   **Verdict:** **Eli wins on logic, Maya wins on stakes.** Eli is right that "it changes meaning" is not a standalone argument. Maya is right that some meaning changes (turning citizens into customers) might be constitutively damaging to a society, even if we can't measure it empirically.

  #### Round 3: Crowding Out vs. Necessity
  **Maya:** "Pricing crowds out donation; shifts norms of medicine."
  **Eli:** "Donation is already failing; market supplements a failing practice."

  *   **Maya's Strength:** This is the **Titmuss Hypothesis** (from *The Gift Relationship*). The claim is that introducing payment destroys the altruistic motivation to give. If true, a market could theoretically *reduce* total supply or degrade the doctor-patient relationship (turning healers into brokers).
  *   **Maya's Weakness:** This is an empirical claim that is heavily contested. Evidence from blood plasma (where paid and unpaid systems coexist) is mixed. She also assumes the goal of the system is primarily normative (preserving the "gift") rather than consequentialist (saving lives).
  *   **Eli's Strength:** He invokes a **Threshold Deontology** or **Prioritarian** move. Even if there is a normative cost (crowding out), if the current system is killing people, the "expressive cost" must be weighed against actual mortality. He frames the market as a "supplement," not a replacement, which mitigates the corruption worry.
  *   **Eli's Weakness:** He assumes the market *will* supplement rather than replace. If a market emerges, insurance might stop covering transplants for the poor, or hospitals might prioritize paying customers. He treats the "lives saved" as a trump card without addressing *which* lives (see "What Both Are Missing").
  *   **Verdict:** **Draw.** This is the most empirically contingent part of the debate. Maya is right that norms matter; Eli is right that norms don't trump death without a specific justification.

  ---

  ### Part 3: What Both Are Missing
  As a referee, you should point out that both Maya and Eli are arguing within a specific frame that leaves out crucial philosophical machinery.

  **1. Distributive Justice (Who gets the kidney?)**
  Neither of them discusses allocation.
  *   *The Problem:* If kidneys are sold, they are likely allocated by ability to pay, not medical urgency.
  *   *The Philosophical Gap:* A market might increase supply (Eli's point) but violate **egalitarian justice** by reserving life-saving treatment for the wealthy. Maya worries about the *seller's* dignity; Eli worries about the *buyer's* survival. Neither worries about the *third party* (the poor sick person priced out).
  *   *Literature:* This is a standard objection in health justice (e.g., Norman Daniels).

  **2. Regulatory Design (Monopsony vs. Free Market)**
  They are debating "a market" as a monolith.
  *   *The Problem:* A "free for all" market (like in some unregulated contexts) is different from a **state monopsony** (where only the state can buy, ensuring safety and fixed pricing).
  *   *The Philosophical Gap:* Many proponents of legalization (e.g., James Stacey Taylor) argue for a regulated monopsony specifically to address Maya's exploitation concerns while keeping Eli's supply benefits. By ignoring regulatory design, they are debating a strawman.

  **3. The "Exit Option" and Background Justice**
  *   *The Problem:* Maya argues poverty coerces the sale. Eli argues banning the sale hurts the poor.
  *   *The Philosophical Gap:* Both assume the background conditions (poverty) are fixed. A Rawlsian would argue that legalizing kidney sales might make the state *less* motivated to fix the poverty that drives the sales. It makes the "exit option" of selling a kidney a substitute for social welfare.
  *   *Literature:* This is the **Wrongful Offer** vs. **Baseline** problem (Wertheimer).

  ---

  ### Part 4: Consensus vs. Contested
  Since you are a PhD student, you need to know which parts of this are "settled" in the field and which are live wires.

  **Settled (or Near-Consensus) Among Specialists:**
  *   **Exploitation is possible in mutually beneficial trades:** It is consensus that a transaction can be voluntary and beneficial to both parties yet still be exploitative due to background injustice. (Maya is on solid ground here).
  *   **Repugnance is not an argument:** It is consensus that "yuck factor" alone is not sufficient justification for policy (Eli is right to press for a non-circular story).
  *   **The Current System is Flawed:** There is consensus that the altruistic donation model is currently failing to meet demand, creating a black market regardless of legality.

  **Genuinely Contested:**
  *   **The Empirical Crowding-Out Effect:** Economists and sociologists still disagree on whether paying for organs reduces altruistic donation. There is no definitive data. (Maya and Eli are both guessing here).
  *   **Inalienability of Body Parts:** There is no consensus on whether there is a coherent philosophical distinction between selling labor and selling organs. Libertarians reject the distinction; Kantians and some Liberals uphold it.
  *   **The Trumping Value:** There is no consensus on whether "normative corruption" (Sandel's view) can ever outweigh "lives saved" (Utilitarian view). This is a fundamental clash of meta-ethical frameworks.

  ### Summary for the Referee
  If you go back to Maya and Eli, here is how you can move the conversation forward without declaring a winner:

  1.  **Tell Eli:** He needs to address the **Distributive Justice** gap. Saving lives is good, but saving *only rich lives* via a market might be unjust. He also needs to engage with the **Labor vs. Parts** distinction rather than dismissing it as repugnance.
  2.  **Tell Maya:** She needs to answer the **Consistency Challenge**. If we allow dangerous labor for money, why is a kidney different? She needs to articulate *why* the semantic shift is harmful beyond just asserting it is. She also needs to address whether a **regulated monopsony** could solve her exploitation worries.
  3.  **Tell Both:** They are debating a binary (Ban vs. Market) when the philosophical action is in the **Regulatory Design**. The question isn't "Is a market bad?" but "What specific market structure minimizes exploitation while maximizing supply?"

  This keeps you in the role of the philosopher facilitating clarity, rather than the judge delivering a verdict.
