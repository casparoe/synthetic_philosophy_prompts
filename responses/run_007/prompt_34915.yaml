  You describe a competitive dynamic where locally rational actions shift the baseline for all participants. Unlike a fixed decline, the target moves continuously. The system escalates into a progressively more demanding state that no one individually chose, driven by changing conditions rather than a static variable.

  2. The nearest established concepts
  *Race to the Bottom* involves lowering a fixed variable (wages, standards) to a static low equilibrium. *Tragedy of the Commons* concerns depleting a shared resource through independent use. *Arms Race* implies reciprocal escalation, typically between adversaries. *Red Queen Effect* describes continuous adaptation just to maintain relative fitness. *Security Dilemma* occurs when defensive actions provoke offensive countermeasures. *Multipolar Trap* is the broader category where competition forces undesirable outcomes. *Positional Arms Race* specifically targets relative status rather than absolute gain, requiring increased investment for unchanged relative standing.

  3. Where each fits and where it misses
  *Race to the Bottom* fails because it assumes convergence on a fixed low value, whereas your pattern involves a ratcheting standard. *Tragedy of the Commons* fails because it models resource depletion, not competitive escalation. *Arms Race* captures the reciprocity but traditionally implies two state actors, missing the multi-party cultural drift in AI. *Red Queen* captures the evolutionary treadmill but often lacks the explicit strategic rationality you describe. *Security Dilemma* fits the military case but implies mistrust rather than status competition. *Multipolar Trap* is the correct genus but lacks species-level specificity. *Positional Arms Race* is closest for status, but your military example suggests absolute risk escalation too. Thus, existing terms fragment the phenomenon.

  4. Verdict on a name
  There is no single unique noun. The configuration is best described as a **Positional Arms Race** (when status-driven) or **Security Dilemma** (when threat-driven), both operating as **Red Queen Dynamics** within a **Multipolar Trap**. The distinguishing feature is the *endogenous shifting baseline*, which lacks a standalone label beyond these compounds. You should not coin a new term but specify the mechanism.

  5. Definition and boundary cases
  **Definition:** A competitive system where actors' rational choices raise the baseline for participation, forcing others to escalate merely to maintain standing, creating a self-sustaining cycle of increasing cost or risk. **Inside:** AI capability publishing (bar rises); Academic tenure tracks (publication counts rise). **Outside:** Price wars (fixed variable lowers); Overfishing (resource depletion without relative standing). The key boundary is whether the *standard* moves versus a *value* dropping.
