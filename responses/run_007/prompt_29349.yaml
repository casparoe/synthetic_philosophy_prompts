      *   *Key Concept:* Utility vs. Representational accuracy. James leans towards utility. Peirce leans towards accurate representation of an independent reality *via* utility of prediction.
      *   *Quote:* Peirce's "Pragmaticism" quote is essential here ("loose and brawling").

  5.  **Refining the Argument (Peirce's specific reasons):**
