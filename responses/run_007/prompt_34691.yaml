answer: |-
  There is no single, universally canonical proper noun (like "The Prisoner's Dilemma" or "The Veil of Ignorance") that exclusively names this specific argumentative move. However, in Effective Altruism (EA) and longtermist literature, it is most precisely described as the **"Sign Uncertainty" argument** applied to **"Astronomical Waste,"** or often framed as the tension between **X-risks** (existential risks) and **S-risks** (suffering risks).

  When people make this move explicitly, they are often said to be **"highlighting the symmetry of astronomical stakes"** or raising the **"Sign Problem"** of longtermism.

  Here is a detailed breakdown of the terminology, definition, and boundaries.

  ### 1. The Terminology Landscape

  While there isn't one "law-like" name, the concept is constructed from two established terms that sit on opposite sides of the symmetry:

  *   **Astronomical Waste (The Original Argument):** Coined by Nick Bostrom (2003), this argues that extinction prevents the realization of an "astronomical" amount of potential value (trillions of future lives). This is the $N \times (+v)$ side of your equation.
  *   **S-risks / Suffering Risks (The Counter-Argument):** Popularized by researchers like Brian Tomasik and Lukas Gloor (often associated with *suffering-focused ethics*), this argues that the future could contain astronomical amounts of *suffering*. This is the $N \times (-v)$ side.

  The argumentative move you are describing—pointing out that the magnitude ($N$) amplifies both sides equally—is most commonly referred to in discussions as:
  *   **The Sign Uncertainty Argument:** This is the most technically accurate label. It highlights that when $N$ (number of future beings) is massive, the Expected Value (EV) of the future is dominated entirely by the *sign* (positive or negative) of the average value per life, rather than the magnitude of the population.
  *   **The Symmetry of Astronomical Stakes:** A descriptive phrase often used in forums and critiques to denote that the "stakes" are symmetric with respect to scale, even if they are asymmetric with respect to probability.
  *   **The Negative Longtermist Critique:** Sometimes used to describe the broader stance that arises from this symmetry (i.e., if the sign is uncertain, we should prioritize ensuring the sign is positive over ensuring existence itself).

  ### 2. Precise Definition of the Move

  The move can be defined as follows:

  > **The Sign-Symmetry Objection:** In any expected value calculation regarding the far future where the scale factor ($N$, e.g., number of future lives) is sufficiently large to dominate other variables, the argument that "we must ensure $N$ occurs" is logically invalid unless the sign of the value per unit ($v$) is established as positive with high confidence. If the sign of $v$ is uncertain, increasing the probability of $N$ occurring increases expected *disvalue* just as much as expected *value*.

  **Does it require the original arguer to have overlooked the symmetry?**
  **No.** The move applies regardless of whether the original arguer overlooked it.
  *   **If they overlooked it:** The move functions as a correction of a logical error (failing to account for negative outcomes).
  *   **If they were aware of it:** The move functions as a **burden-of-proof shift**. It forces the proponent of existence-prioritization to demonstrate *why* the sign is positive, rather than allowing the magnitude ($N$) to do the justificatory work. In EA circles, longtermists like Toby Ord (*The Precipice*) are aware of this symmetry but argue that the sign is *in fact* clearly positive. The counter-move challenges that specific claim about the sign, not the math of the symmetry.

  ### 3. Boundaries and Scope

  To distinguish this from other similar arguments, you can draw the boundaries like this:

  *   **vs. Pascal's Mugging:** Pascal's Mugging involves a *tiny probability* of a *huge payoff* swamping a certain small cost. The Sign-Symmetry Objection involves a *huge magnitude* ($N$) where the *probability of the sign* is the contested variable. They are related (both involve large numbers swamping intuition), but Pascal's Mugging is about probability estimation, while Sign-Symmetry is about value estimation.
  *   **vs. The Reversal Test:** The Reversal Test (Bostrom & Ord) is about checking for status quo bias in parameter changes. The Sign-Symmetry Objection is about the expected value of existence itself.
  *   **vs. Moral Uncertainty:** This is a subset of moral uncertainty. Specifically, it is moral uncertainty regarding the *net value of sentient experience*, amplified by population scale.

  ### 4. Proposed Name (If one were needed)

  If you needed to coin a precise term for this specific logical structure in a paper or discussion, the most rigorous label would be:
  **"The Magnitude-Sign Decoupling Argument"**
  Or more colloquially within the community:
  **"The Astronomical Symmetry Objection"**

  ### 5. Confidence and Uncertainty

  **Confidence Level:** **85%**

  **Point of Least Certainty:**
  I am least certain about whether a specific, niche slang term has emerged in the last 1–2 years within specific sub-communities (e.g., specific LessWrong sequences or private EA research forums) that functions as a proper noun for this. The EA/Rationalist ecosystem generates terminology rapidly (e.g., "moore's law of mad science," "pascal's mugging," "infohazards"). It is possible a specific phrase like **"The Longtermist Symmetry"** or **"The Value Flip"** is in informal circulation that hasn't yet reached broader publication. However, in the published literature (Bostrom, Ord, MacAskill, Tomasik, Gloor), the concept is consistently discussed via the **"Sign Uncertainty"** and **"S-risk"** framework rather than a single eponymous name.

  **Summary:** The concept is well-established, but the *name* is descriptive ("Sign Uncertainty," "Symmetry of Stakes") rather than a canonical proper noun. The move is valid regardless of the original arguer's awareness, serving as a burden-of-proof shift regarding the *quality* of the future, not just its *existence*.

