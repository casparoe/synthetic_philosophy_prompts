answer: |-
  **Project Title:** The Definitional Loophole: Reassessing the Scope of Augustinian Absolutism on Lying

  **Project Summary**
  This project challenges the standard interpretation of Augustine's ethics of speech. While scholarship universally categorizes Augustine as a moral absolutist regarding lying—prohibiting it even to save a life—this consensus rests on an unexamined assumption: that Augustine's definition of a lie captures the full range of deceptive speech. I argue that Augustine's technical definition (*locutio contra mentem*, speaking against what one holds in mind with intent to deceive) is narrower than the phenomenon of deception itself. Consequently, a significant class of deceptive practices (equivocation, misleading implicature, technically true half-truths) falls outside his explicit prohibition. This project investigates whether Augustine's absolutism is linguistically fragile, creating a "truthfulness gap" that later moral traditions (specifically casuistry and the doctrine of mental reservation) attempted to patch. By rigorously testing Augustinian texts against cases of non-assertoric deception, I aim to reframe the history of Christian ethics not as a corruption of Augustine's strictness, but as a necessary response to a definitional limitation inherent in his framework.

  **Research Question**
  Does Augustine's definition of lying inadvertently permit deceptive speech that is technically true, and if so, does this reveal a structural instability in his account of truthfulness that later moral theology was forced to resolve?

  **State of the Field**
  Existing scholarship treats Augustine's position as settled. Commentators routinely cite *De Mendacio* and *Contra Mendacium* to establish his absolutism, focusing almost exclusively on the *severity* of the prohibition (i.e., no exceptions for saving lives). The literature assumes an equivalence between "lying" and "deceiving" in Augustine's thought. While some scholars note his focus on the speaker's mind (*mens*), none have systematically tested the boundaries of this definition against deceptive speech acts that do not involve false assertion. The consensus moves directly from "Augustine forbids lying" to "Augustine forbids deception," bypassing the linguistic mechanics that might separate the two. This project intervenes by arguing that the definition is not a neutral container but an active filter that excludes specific categories of deception, rendering the "absolutism" narrower than traditionally supposed.

  **Methodology**
  The project employs a hybrid method of historical exegesis and conceptual analysis.
  1.  **Textual Exegesis:** Close reading of key texts (*De Mendacio, Contra Mendacium, Enchiridion*, and relevant letters). I will isolate every instance where Augustine defines the lie or discusses the intent to deceive, looking for negative evidence (cases he *doesn't* discuss) as well as positive claims.
  2.  **Conceptual Distinctions:** I will utilize distinctions from contemporary speech act theory (specifically the difference between what is said vs. what is implicated) as a heuristic tool. While anachronistic, these categories provide the precision needed to map the "gap" in Augustine's framework. I will categorize deceptive speech into: (a) False Assertion (Augustine's lie), (b) True Assertion with False Implicature, and (c) Ambiguous/Equivocal Speech.
  3.  **Comparative Trajectory:** A brief comparative analysis with later casuistic developments (e.g., Jesuit mental reservation) to demonstrate how later thinkers explicitly recognized and attempted to close the gap left by the Augustinian definition.

  **Timeline (12 Months)**
  *   **Months 1–3: Textual Immersion.** Complete close reading of primary texts. Annotate all passages concerning definition, intent, and the *mens*. Compile a lexicon of Augustinian terms for speech and deception.
  *   **Months 4–6: Conceptual Mapping.** Apply the speech-act distinctions to the textual data. Construct hypothetical cases (e.g., the "hiding fugitive" scenario) and test them against Augustinian definitions to determine if they constitute a *mendacium*. Draft the core argument regarding the "gap."
  *   **Months 7–9: Drafting.** Write the full dissertation chapter (approx. 10,000 words). Section 1: The Standard Reading. Section 2: The Definitional Constraint. Section 3: The Gap (Equivocation/Implicature). Section 4: Implications for Moral Theory.
  *   **Months 10–12: Revision and Integration.** Refine the argument based on feedback. Ensure the connection to later moral theology is precise but subordinate to the main Augustinian argument. Finalize for submission.

  **Conditions of Success and Failure**
  *   **Success:** The project successfully demonstrates that Augustine's definition excludes technically true deceptive speech. It shows that this is not an accidental oversight but a consequence of his focus on the *mens* and assertion. It further establishes that this creates a tension in his ethics of truthfulness that requires explanation.
  *   **Failure:** The project fails if textual evidence reveals that Augustine explicitly subsumes equivocation and implicature under *locutio contra mentem*. If Augustine explicitly states that misleading a listener, regardless of literal truth, violates the "mind," the "gap" hypothesis collapses. Alternatively, the project fails if the distinction between assertion and implicature proves so anachronistic that it distorts Augustine's thought beyond recognition.

  **Risk Assessment**
  The most significant risk is the charge of anachronism or uncharitable reading. Augustine wrote in a rhetorical culture where ambiguity and double-meaning were well-understood tools. It is highly possible that Augustine simply assumed his definition of "speaking against the mind" naturally covered misleading implicature, even if he didn't articulate it using modern linguistic categories. He may have viewed the *intent to deceive* as the sufficient condition for a lie, rendering the truth-value of the proposition secondary to the speaker's orientation toward the truth.

  If Augustine's concept of *mens* is broader than "belief in the proposition asserted"—encompassing the intended uptake of the listener—then my central claim that there is a "gap" is illusory. I might be imposing a modern distinction between semantics and pragmatics that Augustine would reject. To mitigate this, I will prioritize internal consistency: if Augustine condemns deception in *other* contexts (e.g., biblical exegesis of deceptive patriarchs) but excludes it from his definition of lying, the tension holds. If he is consistent in condemning all deception regardless of the definition, the project must pivot to analyzing why the definition remains so narrow despite the broader moral intuition. I am prepared to argue the weaker claim: even if Augustine *intended* to cover all deception, his *definition* lacks the resources to do so, which explains why later tradition felt the need to expand upon it.
