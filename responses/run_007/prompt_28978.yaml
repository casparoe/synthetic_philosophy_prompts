answer: |-
  **A:** I've been re-reading the Bostrom et al. paper on the unilateralist's curse, and I think the normative force of it is underestimated. People treat it as a "huh, interesting" point about nuclear proliferation and then go back to assuming their private judgment is the correct prior. But the toy model is doing a lot more work than people admit. If you're in a reference class of $N$ competent actors, and the probability of any one of them mistakenly thinking a risky action is good is $p$, the probability that *someone* acts wrongly approaches 1 as $N$ grows. The only way to escape this is a principle of conformity: don't act unless you'd still act after conditioning on the fact that the rest of the group declined to.

  **B:** I grant the math. It's trivial probability theory. But I think you're smuggling in a massive assumption about how that math maps onto reality. The curse only bites if errors are independent and competence is identically distributed. In the real world, errors are highly correlated because we share evidence and arguments. If ten scientists look at a risky experiment and nine say "no," that's not ten independent data points; it's largely one data point viewed through ten eyes. The unilateralist isn't necessarily defying a crowd; they might be the only one who noticed a flaw in the shared model.

  **A:** That's the standard objection, but it doesn't actually dissolve the curse. It just moves the problem up a level. Yes, errors are correlated. But *why* are they correlated? Usually, it's because everyone is using the same epistemic framework. If that framework has a blind spot, the correlation guarantees collective error. The unilateralist's curse isn't just about independent coin flips; it's about the value of coordination. If you act unilaterally, you're effectively saying, "My private signal is strong enough to override the public equilibrium." But the feeling of having a strong private signal is exactly what overconfidence looks like from the inside. Conditioning on others' inaction is a cheap heuristic to correct for that.

  **B:** But "conditioning on others' inaction" assumes the others are actually looking. Who is "the group"? If I'm considering releasing a dataset that might be misused, is the group "all AI researchers"? "All effective altruists"? "People who read this blog"? The boundary is vague. If I define the group narrowly enough to include only people who agree with me, the curse vanishes. If I define it broadly, I'm paralyzed. The unilateralist's curse becomes a weapon for anyone who wants to shame a proposer into inaction by expanding the reference class. "You didn't check with *everyone*."

  **A:** The vagueness of the group is a feature, not a bug. It forces you to justify why *you* are the decider. If you can't clearly articulate who else could have acted but didn't, you probably haven't thought hard enough about the externalities. And look, I'm not saying never act. I'm saying the default should be deference. If you have genuine private information—say, you found a bug in the safety protocol everyone else missed—then conditioning on their inaction shouldn't change your mind, because their inaction was based on *not* having your info. The curse applies when you're acting on the *same* information but a different *judgment*.

  **B:** That distinction—same information vs. private info—is where the rubber meets the road, and I think it's leaky. Often, "judgment" *is* the private info. Maybe I've thought about the game theory of this release for 50 hours and everyone else spent 5. My competence isn't identically distributed. The toy model assumes identical $p$ for everyone. But in reality, we have a distribution of competence. If I'm in the 99th percentile of understanding this specific risk, the fact that the median person declined to act is weak evidence against me. The curse punishes expertise by lumping it in with overconfidence.

  **A:** But how do you know you're in the 99th percentile? That's the hard part. From the inside, the expert and the crank feel the same. They both feel like they've thought longer and harder. The unilateralist's curse is a regulatory principle for your own ego. It says: assume you are the median competent actor unless you have overwhelming evidence otherwise. Because if everyone assumes they're the 99th percentile, we get the $1 - (1-p)^N$ failure mode. You're worried about paralysis; I'm worried about the one person who thinks they're the exception blowing something up for everyone.

  **B:** I'm worried about the opposite failure mode: universal deference locking in a bad status quo. If everyone adopts your principle of conformity, nothing ever changes. We get pluralistic ignorance. Everyone privately thinks the action is good, but everyone waits for someone else to move first. The unilateralist isn't always a rogue actor; sometimes they're a focal point. By acting, they reveal their private information and allow others to coordinate. If Martin Shkreli had read the unilateralist's curse, maybe he wouldn't have jacked up drug prices (good). But if Gandhi had read it, maybe he wouldn't have started the Salt March (bad). The curse can't distinguish between the two without knowing the ground truth, which we don't have.

  **A:** That's a false equivalence. The Salt March wasn't a unilateral action in the relevant sense; it was a coordinated campaign. Gandhi didn't wake up and say, "I'm doing this regardless of what the Indian National Congress thinks." He built the coalition first. The unilateralist's curse is specifically about bypassing coordination mechanisms. And regarding the status quo: yes, deference biases toward the status quo. That's intentional. In a world with existential risks, the cost of a false positive (acting when you shouldn't) is usually asymmetrically higher than the cost of a false negative (waiting). If the action is actually good, it can wait until you've built the coalition. If it's catastrophic, waiting saves the world.

  **B:** But coordination is expensive. Sometimes it's *too* expensive. If I have to consult "the group" for every marginal decision, the transaction costs kill the project. And who constitutes the veto-wielding group? If I need consensus from "all AI researchers" to publish a paper, a single grudge-holding actor can block progress. That's not safety; that's gridlock. The unilateralist's curse treats the decision as a one-shot game. But these are iterated games. If I act unilaterally and it goes well, I gain trust. If it goes poorly, I lose it. The market for ideas should punish reckless unilateralists ex-post, not ban them ex-ante.

  **A:** The problem is that by the time the market punishes them ex-post, the damage might be done. You can't unpublish a dangerous model. You can't un-release a pathogen. The asymmetry of risk means we can't rely on iterative learning for high-stakes decisions. And on the transaction costs: if the action is truly high-stakes, the transaction costs *should* be high. If you're not willing to pay the cost of coordination, maybe you shouldn't be making the decision. The curse isn't a ban; it's a tax. It says: if you want to act alone, your confidence must be high enough to overcome the prior that the group's inaction is evidence of risk.

  **B:** So we're back to priors. Your prior is "the group is usually right to hesitate." My prior is "the group is usually lazy or trapped in a bad equilibrium." I think the real issue is that the unilateralist's curse is being used as a substitute for actually modeling the specific situation. It's a heuristic that feels like a theorem. You're using the mathematical inevitability of the toy model to bypass the messy work of figuring out if *this* specific group is competent, if *this* specific error is correlated, and if *this* specific action is reversible.

  **A:** I'm not bypassing the work. I'm saying the heuristic *is* the work. The default should be: "Others haven't done this. Why?" If you can answer that question with "Because they don't have my info," fine. But if the answer is "Because they're cautious and I'm not," the curse says stop. You want to treat the curse as a narrow technical constraint. I'm saying it's a cultural norm we need to instill. We need the social pressure to be against unilateral action, not for it.

  **B:** And I'm saying that norm creates a tragedy of the commons for innovation. If everyone waits for everyone else, the "good" unilateral actions never happen either. You've solved the problem of the reckless actor by creating a world where only the reckless actor (who ignores your norm) has any agency. The responsible people sit on their hands, and the irresponsible people take over the frontier. That seems like a worse equilibrium than the one you're trying to fix.

  **A:** Then the solution is better coordination mechanisms, not less deference. Build the institutions that allow the responsible people to act together. Don't justify solo action because the institutions are slow.

  **B:** Institutions are made of people. If the people are all waiting for permission from the institution, the institution doesn't move. You're pushing the buck from the individual to the collective, but the collective is just individuals who are also reading your blog post. At some point, someone has to update first.

  **A:** And when they do, they better be damn sure they're not just the first to fall for a shared bias.

  **B:** And if they are damn sure, and they're right, and they waited because of your principle, we've lost the opportunity. We're disagreeing on the base rate of "valuable unilateral action" vs. "catastrophic unilateral action." You think the latter dominates. I think the former is common enough that your tax is prohibitive.

  **A:** In a world with nuclear weapons and engineered pathogens, I think my base rate is the only one that survives.

  **B:** In a world with those things, we also need to solve them. And solving them might require breaking the rules your principle enforces.

  **A:** Then break them. But don't pretend the curse isn't real.

  **B:** The curse is real. I just think the cure is worse than the disease.
