  8.  *(Self-Correction during drafting)*: I need to be careful. Does Prioritarianism imply that a world with less inequality is better *ceteris paribus*? No. It implies a world with higher priority-weighted well-being is better. If leveling down reduces priority-weighted well-being (which it does), it is worse all-things-considered. Does it make it better in *some respect*? No. The only "respect" is the priority weight, and that goes down.
      *   Wait, let's look at Step (2) again. "It is less bad for the loss to fall on the better-off."
