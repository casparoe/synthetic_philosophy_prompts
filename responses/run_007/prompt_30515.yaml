      *   *Diagnosis:* Step (3) is the non-sequitur. Just because a loss is *less bad* than an alternative loss doesn't mean inflicting that loss is *good* or *better in a respect*. It just means it's *less bad* than the alternative. If the alternative is "no loss at all," then the loss is still *bad*, simpliciter.
      *   Prioritarianism is non-relational. It doesn't care about the gap. Step (3) explicitly mentions "the resulting outcome is less unequal." This is an egalitarian criterion, not a prioritarian one.

