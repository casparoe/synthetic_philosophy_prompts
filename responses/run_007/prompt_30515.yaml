      *   Ensure the distinction between *Telic Egalitarianism* and *Prioritarianism* is clear.
      *   Highlight that Step (3) introduces the concept of "inequality," which is alien to pure Prioritarianism.
      *   Confirm that Parfit (the originator) would agree with this diagnosis.
