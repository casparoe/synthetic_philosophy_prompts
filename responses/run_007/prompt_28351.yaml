  so me and my mates got into this argument about teleporters — like star trek style, where you step in, get scanned, your body gets destroyed, and then an exact copy of you gets built somewhere else from new atoms. one of my friends said he'd never use one because its basically suicide: the person who walks out the other end isnt really you, it's just a copy who *thinks* they're you. another mate said that's ridiculous, it's still you because all your memories and personality are intact and that's what matters. i was sort of on the fence but now i can't stop thinking about it. if i used one, would i actually survive? what even makes someone the same person over time — like, what's the thing that has to be preserved for it to still be me and not just some duplicate? and does it change your answer if the original body isnt destroyed?
reasoning: |-
