answer: |-
  The decision rule you have identified is a well-established concept in decision theory known as **Rank-Dependent Expected Utility (RDEU)**. While it shares mathematical DNA with Prospect Theory, your intuition is correct to distinguish it: Prospect Theory is primarily a *descriptive* model of psychological biases (incorporating reference points and loss aversion), whereas RDEU provides a formal structure that can be—and has been—defended as a *normative* theory of rational choice.

  The most prominent contemporary philosophical defense of this rule as a normative standard is **Risk-Weighted Expected Utility (REU)** theory, championed by philosopher Lara Buchak in her 2013 book *Risk and Rationality*.

  ### The Decision Rule: Rank-Dependent Expected Utility
  In standard Expected Utility Theory (EUT), the value of a gamble is the sum of the utility of each outcome multiplied by its objective probability:
  $$ V = \sum p_i \cdot u(x_i) $$
  In your club's model, the weight assigned to an outcome is not its raw probability $p_i$, but a transformation of the *cumulative* probability of receiving that outcome or something better (or worse). Outcomes are ranked from worst to best. A weighting function $w(p)$ is applied to the cumulative probabilities. The value is calculated using a Choquet integral:
  $$ V = \sum [w(\sum_{j=i}^n p_j) - w(\sum_{j=i+1}^n p_j)] \cdot u(x_i) $$
  This formalizes your observation: the weight an outcome receives depends on its **rank** in the distribution. If the weighting function is convex (for losses) or concave (for gains), it effectively "magnifies" the bottom or top of the distribution, exactly as your members described.

  ### Normative Endorsement: Risk-Weighted Expected Utility
  You asked if there is a serious normative theory endorsing this. For decades, RDEU was treated merely as a descriptive fix for anomalies like the Allais Paradox. However, Lara Buchak argues that REU is rationally permissible and, in some contexts, required.

  Her argument is that rational agents are permitted to have a "global" attitude toward risk that is distinct from their valuation of outcomes. In EUT, caring about risk is conflated with caring about the magnitude of outcomes (via a curved utility function). Buchak argues it is rational to care about the *structure* of the gamble itself—for example, preferring a distribution that guarantees a minimum security level over one with a higher average but a catastrophic tail, even if your marginal utility for money is linear. On this view, the "invisible magnifying glass" your club applies is not a cognitive error, but a legitimate expression of a risk attitude.

  ### The Independence Axiom Objection
  The primary technical objection to RDEU/REU is that it violates the **Independence Axiom** (or Sure-Thing Principle) of von Neumann-Morgenstern utility theory. The Independence Axiom states that if you prefer Gamble A to Gamble B, you should still prefer A to B even if both are mixed with a third Gamble C with the same probability.

  RDEU violates this because changing the context (adding Gamble C) can change the *rank* of the outcomes within the distribution, which changes their weights.
  *   **The Objection:** Violating Independence makes an agent susceptible to "money pumps" (dynamic inconsistency where you can be tricked into paying to swap options endlessly).
  *   **The Normative Defense:** Proponents of REU argue that the Independence Axiom is too restrictive. It assumes rational agents only care about outcomes in isolated states of the world. If an agent rationally cares about the global properties of the distribution (e.g., "I want to ensure I don't end up in the bottom 10%"), then their preferences *should* shift when the ranking of outcomes shifts. Buchak argues that as long as the risk attitude is stable, the agent is not dynamically inconsistent in a way that undermines rationality; they simply value the "package" of probabilities, not just the conditional outcomes.

  ### Difference from Curved Utility (Standard Risk Aversion)
  It is crucial to distinguish RDEU from standard EUT with a concave utility function, as you suspected they are structurally different.
  1.  **Source of Risk Attitude:** In EUT, risk aversion comes entirely from diminishing marginal utility ($u''(x) < 0$). In RDEU/REU, risk aversion can come entirely from the probability weighting function, even if utility is linear ($u(x) = x$).
  2.  **Calibration Problem:** A major theoretical advantage of RDEU is that it avoids **Rabin's Calibration Theorem**. This theorem shows that in EUT, if someone is risk-averse over small stakes (e.g., rejecting a 50/50 bet to lose \$100 or gain \$110), they must be absurdly risk-averse over large stakes (rejecting a 50/50 bet to lose \$1,000 or gain \$1 million) to maintain a consistent utility curve. RDEU avoids this because it can model small-stakes risk aversion via probability weighting without implying implausible attitudes toward large stakes.
  3.  **Rank Sensitivity:** As you noted, EUT does not care about rank. In EUT, a 10% chance of loss is weighted the same whether it is the worst outcome or the best outcome (if magnitudes were swapped). RDEU explicitly weights the *worst* 10% differently than the *best* 10%, capturing the asymmetry your club members expressed.

  ### Nearest Candidates
  *   **Cumulative Prospect Theory (CPT):** This is the most famous descriptive model using rank-dependent weighting. However, it includes reference points and loss aversion (losses loom larger than gains). Your club's behavior sounds more like REU because they are evaluating total returns rather than gains/losses relative to a status quo.
  *   **Yaari's Dual Theory:** This uses rank-dependent weighting but assumes linear utility for wealth. This is likely too simplistic for an investment club that cares about the magnitude of returns.
  *   **Risk-Weighted Expected Utility (REU):** This is the specific normative philosophical framework that matches your description best.

  The phenomenon you are observing is the application of a risk function to cumulative probabilities, separating risk attitude from outcome utility.

  \answer{Rank-Dependent Expected Utility}
