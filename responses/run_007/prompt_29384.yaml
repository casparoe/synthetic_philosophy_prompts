      *   **Topic:** The Inside View vs. Outside View distinction (popularized by Kahneman & Lovallo).
      *   **User's Observation:** The standard presentation makes the Inside View look like pure bias (base-rate neglect) and the Outside View like the rational corrective. This implies the Inside View has no principled role.
