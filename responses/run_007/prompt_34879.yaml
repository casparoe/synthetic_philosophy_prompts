answer: |-
  **The Place Settings**

  Elena measured the distance between the forks with the width of her thumb. Half an inch. Any more looked sloppy; any less looked cramped. It was a geometry of hospitality, and if she could solve the geometry, the evening would hold.

  From the kitchen, the roast breathed out scent, heavy with rosemary and thyme. It was a good smell, an expensive smell. It smelled like stability. She checked her watch. Seven-twenty. Mark said seven-thirty. He was never late, except when the firm had a crisis, and lately, the firm was always in crisis.

  She walked to the hallway mirror to check her hair. It was pinned back, severe but elegant. There was a gray hair near her temple she hadn't noticed before. She tucked it behind her ear. It wasn't about vanity; it was about presenting the correct version of Elena. The version who didn't mind that Sarah had taken the Senior Partner track. The version who understood that *timing* was a factor in career trajectories, just as the brochure said.

  A key turned in the lock.

  Elena smoothed her skirt and went to the door. Mark came in carrying a bottle of wine he hadn't selected himself; the label was crooked, a gas station emergency. He looked tired. There was a crease in his cheek from a pillow, or perhaps a car window.

  "Traffic on the bridge," he said, leaning in to kiss her. He missed her mouth slightly, landing on her cheek. His stubble scratched. He smelled of cold air and something sweet. Not her perfume. She wore rose and sandalwood. This was vanilla. Probably the client's office. They used those diffusers now, to boost morale.

  "You're just in time," Elena said. She took the wine. "Did you call the client back?"

  "Finally got through. It's handled." He loosened his tie. The silk made a whispering sound. "You look beautiful, El."

  He didn't look at her eyes. He looked at the space between her eyes, a standard negotiation tactic. He used it with vendors. She appreciated that he was treating her with professional respect.

  "Sarah and David will be here any minute," she said.

  Mark's hand paused on his tie knot. A micro-stall. "Right. Sarah."

  "She said she wanted to discuss the new project flow. I told her no shop talk, but you know her." Elena laughed. It sounded bright, like glass tapping glass. "She's so driven. It's good they recognized that."

  "It is," Mark said. He walked past her toward the bathroom. "I'm just going to wash up."

  Elena stood in the hallway. The house was quiet except for the hum of the refrigerator. She walked into the living room and straightened a cushion. It was already straight.

  She thought about the promotion. She had put in the hours. She had the metrics. But Sarah had the energy, the new ideas. Elena had the history. History was heavy. It dragged. It was better to be the foundation than the spire. The spire got struck by lightning.

  Mark came back from the bathroom. He had changed his shirt. He was wearing the blue oxford, the one she'd laundered on Tuesday. But as he sat on the sofa to check his phone, she saw the cuff. There was a faint smudge near the button. Pinkish. Lipstick? No. Clay. Red clay. From the tennis club? Mark hadn't played tennis in three years. He said his shoulder hurt.

  Probably from the construction site visit. They were breaking ground on the new wing.

  "Phone dying," Mark muttered, plugging it into the wall outlet near the sofa. The screen lit up for a second before the charger took hold. A message preview slid down the top. *Can't wait to see you.* No name. Just the text.

  Elena was pouring the water into the crystal pitcher. Her hand didn't shake. She was very steady. It was obviously a client. Or his mother. His mother was in Florida, but she was planning a visit. She'd mentioned it last week. Or maybe the week before.

  The doorbell rang.

  Elena opened the door to Sarah and David. Sarah was wearing a blazer that cost more than Elena's first car. She looked vibrant, electric. She hugged Elena.

  "Thank you for having us," Sarah said. "I know it's last minute, but I just felt like we needed to connect."

  "Always," Elena said.

  They moved to the living room. Mark stood up. He didn't hug Sarah. He shook her hand. A firm, dry shake. Professional. Elena watched the distance between them. Two feet. Appropriate.

  Mark poured the wine. He handed Elena her glass. Their fingers didn't touch. This was considerate. He knew she hated sticky fingers.

  They sat. The conversation flowed like water over stones. Smooth, continuous, eroding nothing. They talked about the market. They talked about the renovation. Elena talked about the roast.

  "I read an article about stress management," David said, swirling his Cabernet. "Said that denial is actually a coping mechanism. Temporary, of course. Lets you function through the shock."

  Elena cut her meat. The knife was sharp. It slid through the beef without resistance. "I think it's more about prioritization. You focus on what you can control. The dinner. The guests. The work."

  "Exactly," Mark said. He took a large sip of wine. "Control the controllable."

  "And if the data contradicts the model?" Sarah asked. She was looking at Mark. Or was she looking at Elena? The lighting was dim.

  "Then you adjust the model," Elena said. She smiled. Her cheeks felt tight. "You don't burn the house down because the thermostat is wrong."

  Mark's phone buzzed on the table. Face down. He didn't turn it over. He placed his hand over it. A protective gesture. Protecting the device from spills, surely. The table was polished; condensation could damage the finish.

  Elena took a bite of the roast. It was perfectly cooked. Medium rare. She chewed. She tasted the rosemary. She tasted the iron of the blood. She swallowed.

  "Mark," she said. "Tell them about the new wing."

  Mark blinked. He looked at her, really at her, for the first time that evening. There was something in his eyes. Fear? Gratitude? It was hard to tell. The light caught the glass of his spectacles.

  "It's going well," Mark said. "Good team."

  "Sarah's team," Elena corrected gently.

  " Our team," Mark said.

  He reached for his wine. His hand hovered over the phone. If he moved it, the screen might light up again. If he didn't move it, it might look suspicious. He decided to leave it. A strategic choice.

  Elena looked at her plate. She thought about the pink smudge on the blue shirt in the hamper upstairs. She thought about the vanilla scent. She thought about the way Mark had said *Our team*, with a pause that felt like a question.

  She could ask. She could say, *Who sent the message? Whose perfume is that? Why did you change your shirt?*

  If she asked, he would answer. He would have an explanation. The clay was from a site visit. The perfume was the client's office. The message was his mother.

  And if she believed him, they would finish dinner. They would wash the dishes. They would go to bed. He would sleep on the edge of the mattress. She would stare at the ceiling.

  If she didn't ask, the explanation remained theoretical. The truth remained a possibility, not a fact. As long as it wasn't spoken, it wasn't real. As long as she didn't name the deception, she wasn't being deceived. She was just hosting a dinner. She was just a wife. She was just a partner.

  "Elena?" Sarah said. "Are you okay?"

  Elena looked up. She realized she had been holding her fork in the air for ten seconds. She lowered it.

  "I'm fine," she said. "Just thinking about the place settings. I think the salad fork is a millimeter off."

  She stood up. She needed to move. She needed to adjust the geometry. If she could get the forks right, the rest of the universe might align. She walked to the sideboard. Her reflection in the silver serving dish was warped. Her face was long, distorted.

  Mark was watching her. He knew she knew something. Or he knew she suspected something. Or he knew nothing at all, and she was the only one building the maze.

  That was the thing, wasn't it? The puzzle wasn't whether he was lying. The puzzle was whether she was listening.

  She picked up the salad fork. She moved it to the left. Then back to the right. Half an inch. Half an inch.

  "To us," Elena said, raising her water glass. She hadn't poured wine for herself. She needed to be clear. "To the team."

  Mark raised his glass. Sarah raised hers. David followed.

  "To the team," Mark said.

  His voice didn't waver. Hers didn't either. They drank. The liquid went down smooth. It didn't choke her. It didn't burn. It was just water. Just wine. Just a Tuesday.

  Elena sat back down. She picked up her knife and fork. She cut another piece of meat. She chewed. She swallowed. She smiled at her husband, and for a moment, in the space between the bite and the swallow, she almost believed that she was happy.

  And that, she decided, was the only metric that mattered.
