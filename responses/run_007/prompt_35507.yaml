answer: |-
  **JOINT STATEMENT ON THE SCEPTICAL CHALLENGE REGARDING RULE-FOLLOWING**

  **Date:** 24 May 2024
  **Parties:** Proponents of the Straight Solution and Proponents of the Sceptical Solution
  **Subject:** The constitution of meaning and the normativity of rules

  ### 1. Agreed Claims

  We, the undersigned, having reviewed the arguments concerning the sceptical challenge to rule-following, affirm the following claims as the common ground for our continued debate. We agree that any satisfactory account must address these points.

  1.  **The Setup:** We consider a speaker who has employed the term 'plus' (or the symbol '+') in arithmetic contexts throughout their life. Up to the present moment, the speaker has performed only finitely many calculations, and in every instance, the numbers involved were smaller than 57. The speaker is now presented with the sum '68 + 57' for the first time.
  2.  **The Alternative Function:** We acknowledge the coherence of a deviant function, 'quus', defined such that $x \text{ quus } y$ equals $x + y$ if both $x$ and $y$ are less than 57, but equals 5 otherwise. Based strictly on the speaker's past behaviour and finite history, the past use of 'plus' is compatible with having meant 'quus' rather than 'plus'.
  3.  **The Normativity Requirement:** Any account of meaning must explain the normative dimension of semantic facts. If the speaker *meant* addition by 'plus' in the past, then there is a specific answer they *ought* to give now (namely, 125). It is not sufficient to describe what they *will* say; the account must distinguish between correct and incorrect application.
  4.  **The Possibility of Error:** Any account must allow for the possibility that the speaker is mistaken about their own meaning. It must be possible for a speaker to believe they mean addition, yet be constituted in such a way that they actually mean quus (or some other function), such that their confident assertion of '125' is objectively wrong.
  5.  **The Scope of the Challenge:** We agree that the sceptical challenge applies to the word 'means' itself. If the conclusion is that there are no facts about meaning, this must apply to the sceptic's own utterances. We further agree that the challenge targets *constitutive* facts (facts in virtue of which meaning is what it is), not merely *evidential* facts (facts that help an observer guess what is meant).
  6.  **The Failure of Obvious Candidates:** We agree that standard candidates for the constitutive fact—such as explicit mental images, occurrent introspective states, or brute behavioural dispositions without qualification—fail to meet the normativity and error requirements. A Straight Solution, if it exists, must be more subtle than these initial candidates.

  ### 2. Table of Residual Disagreements

  While we agree on the force of the challenge and the requirements for a solution, we diverge on the metaphysical and semantic conclusions to be drawn. The following table summarises our precise points of departure. Each formulation is endorsed by the respective side as an accurate statement of their position.

  | Issue | Position of the Straight Solution Camp | Position of the Sceptical Solution Camp |
  | :--- | :--- | :--- |
  | **Existence of Constitutive Facts** | There exists a fact of the matter, possibly involving complex relations between the speaker, their environment, and underlying mechanisms, in virtue of which the speaker means addition rather than quus. The failure to currently articulate this fact does not entail its non-existence. | There is no fact of the matter about what any individual means by a term. The search for a truth-condition that constitutes meaning is misguided and must be abandoned. |
  | **Status of Meaning Attributions** | Statements of the form 'S means addition by plus' are truth-apt descriptions of reality. They are true if the relevant constitutive fact obtains and false if it does not. | Statements of the form 'S means addition by plus' are not truth-apt descriptions of reality. They are moves in a language game licensed by assertability conditions, specifically agreement with the responses of the wider community. |
  | **Role of the Community** | The community serves an epistemic role (helping to identify errors) but is not constitutive of meaning. A solitary speaker could, in principle, mean something by their words. | The community serves a constitutive role. Without the possibility of checking one's usage against the agreed responses of others, the distinction between 'seeming right' and 'being right' collapses. |
  | **Response to Normativity** | Normativity is grounded in the nature of the constitutive fact itself (e.g., the nature of the abstract object grasped, or the teleological function of the mechanism). | Normativity is grounded in the social practice of sanctioning and correcting. To say one 'ought' to say 125 is to say that the community will reject the answer 5. |

  ### 3. Cruxes: Sub-Questions for Resolution

  We identify the following specific questions as critical. Settling these would significantly shift the burden of proof or compel one side to revise their position. For each crux, we specify a test case or argument and record what each side predicts an honest analysis of that case will demonstrate.

  **Crux 1: The Isolated Speaker**
  *   **The Case:** Consider a speaker who has been physically isolated from all other linguistic agents since birth (a 'Robinson Crusoe' scenario). This speaker develops a consistent practice of manipulating symbols in a way isomorphic to arithmetic.
  *   **The Question:** Can this speaker meaningfully be said to follow a rule, or are their symbol manipulations merely regularities without normativity?
  *   **Straight Solution Prediction:** Analysis will show that the speaker's internal mechanisms or causal history with the environment suffice to constitute meaning. The absence of a community is irrelevant to the existence of the fact.
  *   **Sceptical Solution Prediction:** Analysis will show that without a community to establish assertability conditions, there is no distinction between the speaker following a rule and the speaker merely seeming to follow a rule. Meaning attributions in this case are empty.

  **Crux 2: Idealised Dispositions and Error**
  *   **The Argument:** The Straight Solution often appeals to what the speaker *would* have answered under 'ideal conditions' (e.g., unlimited time, no fatigue). The Sceptical Solution argues that 'ideal conditions' are defined by the very meaning they are supposed to fix (i.e., conditions where you get the *right* answer), rendering the account circular.
  *   **The Question:** Can 'ideal conditions' be specified non-circularly, purely in terms of physical or functional states, without presupposing the correctness of the output?
  *   **Straight Solution Prediction:** A non-circular specification is possible (e.g., via proper biological function or computational integrity). The circularity objection conflates identifying the conditions with defining the meaning.
  *   **Sceptical Solution Prediction:** Any non-circular specification will fail to capture normativity. If the physical state determines the output, error becomes impossible (whatever happens is what was dictated by the state). To save error, one must presuppose the rule, begging the question.

  **Crux 3: Self-Reference of the Challenge**
  *   **The Argument:** The sceptic claims 'There is no fact of the matter about what I mean by "fact"'.
  *   **The Question:** Does the sceptical challenge undermine its own assertability, or does it successfully carve out a space for non-factual discourse?
  *   **Straight Solution Prediction:** The challenge is self-refuting. If there are no facts about meaning, the sceptic's own argument has no meaning, and the conclusion cannot be coherently stated.
  *   **Sceptical Solution Prediction:** The challenge is not self-refuting but paradoxical. It forces a shift in our logic of meaning. The sceptic is not stating a fact but recommending a change in perspective on how language works. The argument holds within the old (factual) framework to show that framework is untenable.

  ### 4. Note on Verbal Dispute

  We acknowledge the possibility that a portion of our disagreement is merely verbal, specifically concerning the usage of the word 'fact'.

  *   **Hypothesis:** The Straight Solution Camp may be using 'fact' to denote any true proposition, including those about social practices or assertability conditions. The Sceptical Solution Camp may be using 'fact' in a stricter, reductionist sense (e.g., 'scientific fact' or 'truth-condition independent of human practice').
  *   **Agreement on Verification:** If the Straight Solution Camp is willing to accept that the constitutive fact is *exhausted* by community assertability conditions, and the Sceptical Solution Camp is willing to accept that such conditions constitute a 'fact' in a broad metaphysical sense, the substantive disagreement would vanish.
  *   **Current Stance:** However, at present, both sides suspect the disagreement runs deeper than terminology. The Straight Solution Camp insists the fact must explain *why* the community conditions are the correct ones. The Sceptical Solution Camp insists there is no 'correct' outside of the conditions themselves. We record this uncertainty to ensure future debate focuses on the metaphysics rather than the lexicon.

