prompt: |-
  I'm taking a philosophy of mind course on irrationality and self-knowledge, and we've been working through the paradox of self-deception. I'd like your credence in a specific claim, with the reasoning decomposed rather than a bare number.

  Claim: at least some actual cases of self-deception — for example, a spouse who sincerely denies an affair despite strong evidence, or a student who sincerely believes they passed an exam they failed — are best explained by the agent's simultaneously believing that P and believing that not-P, with the conflict kept apart by some form of mental partitioning (the strict view), rather than by motivated belief formation that yields only a single distorted belief (the deflationary view).

  Please decompose your credence into at least these terms, plus any others you think belong:
  - semantic_determinacy: the probability that 'belief' is determinate enough for the strict/deflationary dispute to be substantive rather than partly verbal;
  - deflationary_sufficiency: the probability that, if the question is substantive, deflationary mechanisms (biased evidence-gathering, selective attention, lowered evidential standards) fully explain the most resistant cases with no simultaneous contradictory belief;
  - partition_coherence: the probability that, if deflationary mechanisms are insufficient, a partitionist account (e.g., relatively encapsulated subsystems) makes simultaneous contradictory beliefs coherent rather than the cases being impossible or misdescribed.

  State how the terms combine into your final number, which term the final number is most sensitive to, which term you are least confident in, and what evidence or argument would most shift that term.

  Return a JSON object with the following fields: credence_strict_self_deception (a number from 0 to 1), terms (an array of objects each with name, probability, and justification), combination (a string), most_sensitive_term (a string), least_confident_term (a string), and evidence_that_would_shift_it (a string).
