answer: |-
  # The Constructive Proof Audit (CPA)

  **Purpose:** To determine whether a given proof supplies the explicit constructions required by the Brouwer-Heyting-Kolmogorov (BHK) interpretation.
  **Time Limit:** 10 minutes per proof.
  **User:** Final-year undergraduate.

  ## Part 1: The Checklist

  Work through the proof line-by-line. If any item triggers a **STOP**, the proof is non-constructive. If an item triggers a **HAND-OFF**, mark it and ask the instructor. If you reach the conclusion without triggers, the proof is constructive.

  ### A. Quantifiers and Connectives

  | Symbol | Clause | Requirement for 'Pass' | Strictness Note |
  | :--- | :--- | :--- | :--- |
  | **$\exists x A(x)$** | **Existential** | The proof must produce a specific term $t$ (a witness) and a proof that $A(t)$ holds. | **[Strict]** $t$ cannot be defined conditionally on an unknown truth value (e.g., "Let $t = 1$ if $P$, else $2$"). |
  | **$A \lor B$** | **Disjunction** | The proof must state which side holds ($A$ or $B$) and provide evidence for that specific side. | **[BHK Core]** Merely showing $\neg(\neg A \land \neg B)$ is a **STOP**. |
  | **$\forall x A(x)$** | **Universal** | The proof must provide a uniform method that works for any arbitrary $x$. | **[BHK Core]** Cannot rely on checking cases unless the cases are exhaustive and decidable. |
  | **$A \to B$** | **Implication** | The proof must describe a procedure that transforms any evidence of $A$ into evidence of $B$. | **[BHK Core]** |
  | **$\neg A$** | **Negation** | The proof must show that assuming $A$ leads to absurdity ($\bot$). | **[BHK Core]** This is the only connective where contradiction is permitted. |

  ### B. Structural Stop Conditions (The 'Red Pen' Triggers)

  1.  **Existence by Contradiction:** Does the proof establish $\exists x A(x)$ by assuming $\neg \exists x A(x)$ and deriving $\bot$?
      *   **Verdict:** **STOP**. (This proves $\neg \neg \exists$, not $\exists$).
  2.  **Double Negation Elimination:** Does the proof infer $P$ directly from $\neg \neg P$ where $P$ is positive (e.g., an equality or existence claim)?
      *   **Verdict:** **STOP**.
  3.  **The Law of Excluded Middle (LEM):** Does the proof split into cases ($P \lor \neg P$) where $P$ is undecidable (e.g., properties of real numbers)?
      *   **Verdict:** **STOP**.
  4.  **Non-Constructive Choice:** Does the proof say "Choose an $x$ such that..." without a rule for finding $x$?
      *   **Verdict:** **STOP**.

  ### C. Hand-Off Conditions (Ask the Instructor)

  1.  **Cited Theorems:** Does the proof rely on a named theorem (e.g., "By the Intermediate Value Theorem...")?
      *   **Action:** **HAND-OFF**. (Students cannot be expected to know the constructive status of every analysis theorem).
  2.  **Implicit Completeness:** Does the proof assume a supremum or limit exists without constructing it (e.g., "Let $L = \sup S$")?
      *   **Action:** **HAND-OFF**. (This often hides classical completeness axioms).
  3.  **Ambiguous 'Or':** Does the text say "one of these must be the case" without specifying an algorithm to decide which?
      *   **Action:** **HAND-OFF**. (Could be rhetorical, could be classical LEM).

  ---

  ## Part 2: Instructions for Use

  1.  **Highlight** every occurrence of $\exists, \lor, \neg, \forall$.
  2.  **Trace** the witness for every $\exists$. If you cannot write down the value, flag it.
  3.  **Scan** for the Stop Conditions. Look for phrases like "Suppose not", "Contradiction", "Either... or".
  4.  **Mark** any Hand-Offs. If a proof has more than two Hand-Offs, submit it for instructor review immediately.
  5.  **Decision:** If no **STOP** conditions are met, the proof is Constructive. If a **STOP** is met, it is Classical.

  ---

  ## Part 3: Running the Audit

  Here are the results of running the CPA on the three proofs you specified.

  ### Run 1: Irrational $a, b$ with $a^b$ Rational
  *The Proof:* Consider $x = \sqrt{2}^{\sqrt{2}}$. If $x$ is rational, let $a=b=\sqrt{2}$. If $x$ is irrational, let $a=x, b=\sqrt{2}$. Then $a^b = (\sqrt{2}^{\sqrt{2}})^{\sqrt{2}} = 2$, which is rational. Thus such numbers exist.

  *   **Check $\exists a, b$:** The proof offers two candidate pairs: $(\sqrt{2}, \sqrt{2})$ or $(\sqrt{2}^{\sqrt{2}}, \sqrt{2})$.
  *   **Check Disjunction ($\lor$):** The proof splits on "$x$ is rational $\lor$ $x$ is irrational".
  *   **Apply Clause A ($A \lor B$):** Does the proof state which side holds? **No.**
  *   **Apply Stop Condition 3 (LEM):** The property "is rational" for this specific real number is treated as decidable without an algorithm to decide it.
  *   **Verdict:** **STOP (Non-Constructive).**
  *   **Reason:** We do not know which pair is the witness. The existence is derived from a case split where the case is unknown.

  ### Run 2: $\neg \forall x P(x) \vdash \exists x \neg P(x)$
  *The Proof:* Assume $\neg \exists x \neg P(x)$. This implies $\forall x \neg \neg P(x)$, which classically implies $\forall x P(x)$. This contradicts the premise $\neg \forall x P(x)$. Therefore, $\exists x \neg P(x)$.

  *   **Check Conclusion $\exists x$:** We need a witness $t$ such that $\neg P(t)$.
  *   **Trace Witness:** No specific $t$ is produced.
  *   **Apply Stop Condition 1 (Existence by Contradiction):** The existence claim is derived entirely from deriving a contradiction from its negation.
  *   **Apply Stop Condition 2 (DNE):** The step $\forall x \neg \neg P(x) \to \forall x P(x)$ uses Double Negation Elimination.
  *   **Verdict:** **STOP (Non-Constructive).**
  *   **Reason:** The proof shows it is impossible for all $x$ to satisfy $P$, but provides no method to find the specific $x$ that fails.

  ### Run 3: Monotone Convergence Theorem (MCT)
  *The Proof:* Let $(x_n)$ be a bounded, increasing sequence of reals. The set $S = \{x_n : n \in \mathbb{N}\}$ is bounded above. By the Completeness Axiom, $S$ has a least upper bound $L = \sup S$. We show $x_n \to L$. Thus, the limit exists.

  *   **Check Conclusion $\exists L$:** We need a constructed real number $L$.
  *   **Trace Witness:** $L$ is defined as $\sup S$.
  *   **Apply Hand-Off Condition 2 (Implicit Completeness):** The existence of $\sup S$ is asserted by the Completeness Axiom.
  *   **Instructor Review Required:** In classical analysis, $\sup$ exists. In constructive analysis (e.g., Bishop), the supremum of a set does not necessarily exist as a constructible real number unless the set is located or the sequence has a modulus of convergence.
  *   **Strictness Check:** Does the proof provide an algorithm to compute $L$ to arbitrary precision? **No.** It merely asserts $L$ exists.
  *   **Verdict:** **STOP (Non-Constructive).**
  *   **Reason:** The witness (the limit) is not computed; it is posited via a classical axiom equivalent to LEM in this context.

  ---

  ## Part 4: Post-Mortem and The "Uncomfortable Truth"

  You asked me to be plain about which result you might not like.

  **The MCT Run is the problem.**

  While the CPA correctly identifies the standard proof of the Monotone Convergence Theorem as non-constructive, this is the answer you will likely dislike delivering. Why? Because it invalidates a cornerstone of standard analysis. Students (and many philosophers) accept that $\exists x \neg P(x)$ from $\neg \forall x P(x)$ is dubious. They accept the irrational power proof is a logic puzzle. But telling them that *basic analysis* fails the checklist because the "Completeness Axiom" is too strong is a much harder sell.

  The checklist forces a binary choice: either the limit is computed (e.g., via a Cauchy modulus) or it does not constructively exist. The standard proof does not compute it. Therefore, the checklist kills the proof. This confirms your course thesis, but it risks making constructive mathematics look like it simply 'breaks' calculus, rather than refining it.

  ### Linguistic Traps: How Proofs Sneak Past

  You asked where the classic non-constructive proof hides. In my experience, students miss the **STOP** conditions because the logic is buried in natural language. Here is where the CPA must be ruthless:

  1.  **"Choose" / "Pick":**
      *   *Phrase:* "Choose an $N$ such that..."
      *   *Trap:* If the proof doesn't say *how* to find $N$ (e.g., as a function of $\epsilon$), it is a non-constructive choice. The CPA Stop Condition 4 catches this, but students often skim over it as rhetorical.
  2.  **"One of these must be the case":**
      *   *Phrase:* "Either $x$ is rational or it is not."
      *   *Trap:* This is LEM. For integers, this is decidable (constructive). For reals, it is not. The CPA requires students to check if the domain is decidable. If they treat Reals like Integers here, the checklist fails.
  3.  **"Suppose otherwise":**
      *   *Phrase:* "Suppose no such number exists... contradiction."
      *   *Trap:* This is the classic $\neg \neg \exists \vdash \exists$ move. Students often mark this as a valid proof of existence. The CPA Stop Condition 1 is designed specifically to bleed red ink here.

  ### BHK Core vs. Added Strictness

  To ensure you know where I have tightened the screws:

  *   **BHK Core:** The requirements for $\lor$ (must know which side) and $\exists$ (must have a witness) are standard BHK.
  *   **My Strictness:**
      1.  **Conditional Witnesses:** Pure BHK allows a witness defined by cases *if* the condition is decidable. I have added strictness to forbid witnesses defined by *undecidable* conditions (as in the Irrational Power proof).
      2.  **Cited Theorems:** BHK doesn't specify how to handle citations. I added the **HAND-OFF** clause. Without this, students will assume "Theorem 4.2" is constructive because it's in the textbook. This shifts the burden of checking the *library* of theorems to you, which is safer than letting them guess.

  ### Final Recommendation

  Hand this checklist out in week two. Tell them: *"If your proof triggers a STOP, do not hand it in. It is not a constructive proof."* It will save you writing "not constructive" fifty times, and it forces them to confront the computational content of their claims before they write the final line.

  Just be prepared for the revolt when they realise the MCT doesn't make the cut.
