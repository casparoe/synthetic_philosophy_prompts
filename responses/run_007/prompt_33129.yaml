answer: |-
  I argue that the Ship of Theseus and the Statue-and-Clay puzzles require **fundamentally different metaphysical treatments** and that the **Statue-and-Clay puzzle is the more fundamental of the two.**

  While both puzzles concern the relationship between an object and its matter, they target distinct metaphysical relations. The Ship of Theseus is a problem of **diachronic vagueness**: it asks where we draw the boundary of identity across a process of change. The Statue-and-Clay case is a problem of **synchronic modal essence**: it asks how distinct kinds of objects with different survival conditions can occupy the same space at the same time. Attempting to force a unified solution upon them—specifically via four-dimensionalism (perdurantism)—obscures the specific ontological commitments required by the constitution case. Conversely, applying the constitution view to the Ship generates an untenable proliferation of objects. Because synchronic individuation is a precondition for diachronic persistence, the Statue-and-Clay puzzle is metaphysically prior.

  ### The Case for Disunity

  The core reason these puzzles demand different treatments is that they rely on different intuitions about what makes an object *that* object.

  In the **Ship of Theseus**, the tension arises from **continuity**. We have a continuous process of replacement. The intuition that the ship survives is based on causal and functional continuity; the intuition that it does not is based on material continuity. This is a problem of *criteria*. There is no deep metaphysical contradiction in saying the ship survives, nor in saying it does not; the conflict is largely semantic or conceptual regarding how we apply the sortal "ship" over time. The best treatment here is a form of **conventionalism** or **ontic vagueness**: identity over time is not a brute metaphysical fact but depends on the persistence conditions we stipulate for the kind in question.

  In the **Statue-and-Clay**, the tension arises from **modal properties**. The statue and the lump occupy the same region at the same time, yet they differ in their properties: the lump could survive being squashed; the statue could not. By Leibniz’s Law (the Indiscernibility of Identicals), if they differ in properties, they cannot be identical. This is not a problem of vagueness or boundary-drawing; it is a problem of **ontological category**. The lump falls under the sortal "matter," the statue under the sortal "artifact." These sortals carry different essential properties. To solve this, we must accept **Constitution as Distinct from Identity**. The statue is constituted by the lump, but is not identical to it. This requires a robust metaphysical commitment to co-located objects distinguished by their sortal-dependent modal profiles.

  ### The Failure of Unified Approaches

  The most prominent attempt to unify these puzzles is **four-dimensionalism (perdurantism)**. This view treats objects as spacetime worms composed of temporal parts. It claims to dissolve the Ship of Theseus by asserting that the "original ship" is a worm that either includes the continuous replacement stages or the reassembled stages, but not both (or that identity is relative to a counterpart relation). It claims to solve the Statue-and-Clay by treating them as two distinct worms that overlap at the current time but diverge in the future (one ends when squashed, the other continues).

  While elegant, this unified treatment fails because it **flattens the modal distinction** in the Statue-and-Clay case. Perdurantism explains the difference between the statue and the lump merely as a difference in *temporal extent*. It reduces the modal fact ("the statue cannot survive squashing") to a structural fact ("the statue-worm does not extend past the squashing"). This misses the explanatory depth of the constitution puzzle. The intuition behind the Statue-and-Clay is not just that they have different futures, but that they have different *essences* right now. The lump is *essentially* matter; the statue is *essentially* formed. Perdurantism sidesteps the question of why two objects can be in the same place by appealing to temporal parts, but it does not explain the *synchronic* ontological dependence that makes the statue rely on the lump's arrangement. It treats the synchronic puzzle as just another diachronic puzzle in disguise, which is a category mistake.

  Conversely, applying the **Constitution View** (distinct objects) to the Ship of Theseus creates an explosion of entities that renders the concept of "ship" useless. If constitution is not identity, then at any moment of the Ship's gradual replacement, we have the "Ship-of-Original-Planks" and the "Ship-of-Current-Planks." As planks are swapped, we generate a new constituted object at every step. We end up not with one ship persisting, but with a dense series of overlapping ship-objects. While metaphysically consistent, this violates the pragmatic function of the concept "ship," which is to track a single functional unit over time. The Constitution View is too rigid for the fluidity of diachronic identity.

  ### The Fundamentality of the Statue-and-Clay

  I contend that the Statue-and-Clay puzzle is more fundamental because **synchronic ontology precedes diachronic persistence.** Before we can ask whether an object persists through time (the Ship), we must be able to individuate what object is present at a time (the Statue).

  If we cannot resolve whether the statue and the lump are one or two, we cannot coherently trace either through time. If they are one, then the lump's persistence conditions apply to the statue (it survives squashing). If they are two, we must track two distinct histories. The Ship of Theseus assumes we already know what a "ship" is and simply asks how long it lasts. The Statue-and-Clay asks what a "ship" (or statue) *is* in relation to its matter. Questions of *whatness* (essence/constitution) are metaphysically prior to questions of *how-long* (persistence). Therefore, a solution to the Statue-and-Clay is a prerequisite for a coherent solution to the Ship of Theseus, but not vice versa.

  ### The Strongest Objection: Theoretical Unity and Parsimony

  The strongest objection to this disunited view is an appeal to **theoretical unity and parsimony** (Occam's Razor). Metaphysics aims to provide a single, coherent framework for reality. By insisting that diachronic identity and synchronic constitution require different treatments (Conventionalism/Vagueness for one, Realist Constitution for the other), I am proliferating metaphysical principles unnecessarily.

  A perdurantist would argue that their view is superior precisely because it uses *one* mechanism (temporal parts) to solve *both* puzzles. It posits only one kind of entity (spacetime worms) and one kind of relation (parthood). My view posits vague identity for ships, distinct co-located objects for statues, and a priority relation between synchronic and diachronic modes. This is ontologically expensive and theoretically fragmented. Why should reality operate by one set of rules for time and another for space?

  ### Rebuttal

  The demand for unity should not override accuracy to the phenomena. A unified theory that distorts the data is worse than a disunited theory that respects it.

  Perdurantism achieves unity only by **reducing modality to topology**. It explains the difference between a statue and a lump not by appealing to their intrinsic natures or essences, but by appealing to the shape of their world-lines. This fails to capture the robust intuition that the statue *could not* survive squashing regardless of how we slice time. The modal difference is qualitative, not merely structural.

  Furthermore, parsimony is not just about counting entities; it is about explanatory power. The disunited approach respects the distinct phenomenological and logical structures of the two puzzles. The Ship puzzle is genuinely about the vagueness of boundaries in a process; the Statue puzzle is genuinely about the incompatibility of essential properties in a region. To force them into one box is to ignore the specific metaphysical work each puzzle demands. We should prefer a fragmented ontology that accurately maps the terrain over a unified ontology that flattens the mountains into hills.

  ### Conclusion

  The Ship of Theseus and the Statue-and-Clay are not two versions of the same problem. The Ship is a puzzle about the **limits of continuity**, best handled by acknowledging the role of convention and vagueness in persistence. The Statue is a puzzle about the **nature of objecthood**, best handled by distinguishing constitution from identity based on sortal essence. Because we must individuate objects at a time before we can trace them through time, the Statue-and-Clay puzzle is the more fundamental metaphysical challenge. Attempting to solve both with a single tool like perdurantism achieves theoretical elegance at the cost of modal accuracy, whereas accepting their disunity preserves the integrity of both our synchronic and diachronic intuitions.
