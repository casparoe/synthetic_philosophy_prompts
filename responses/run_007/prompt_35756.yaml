  ### Predictions for New Cases

  Here is how the principle applies to the scenarios you requested:

  **1. Information that changes preferences in a way I cannot currently evaluate (Transformative Experience).**
  *   **Prediction:** The principle **fails to yield a verdict**.
  *   **Reasoning:** To calculate $\Delta EU_{Action}$ or $\Delta U_{Belief}$, you must assign utility values to the outcomes. If the information changes your preference structure (e.g., tasting a fruit that rewires your palate, or having a child), you cannot currently evaluate the $U$ of the post-information state. The formula requires inputs you logically cannot possess.
  *   **Principle's Advice:** In these cases, you must rely on *second-order* values (e.g., "I value openness to experience") rather than expected utility calculation.

  **2. A test whose result has only a tiny chance of changing a life-or-death decision.**
  *   **Prediction:** **Acquire**, provided the cost is low.
  *   **Reasoning:** Let $p$ be the tiny probability, and $L$ be the utility of avoiding death. $\Delta EU_{Action} \approx p \times L$. Even if $p$ is small, if $L$ is sufficiently large (infinite or near-infinite disutility), the product exceeds $C_{Acq}$. This aligns with standard risk management.

  **3. Information about a decision made by someone else who will not listen to me.**
  *   **Prediction:** **Acquire only if $\Delta U_{Belief} > C_{Psych} + C_{Acq}$.**
  *   **Reasoning:** $\Delta EU_{Action}$ is zero because you cannot influence the outcome. The value is purely intrinsic (e.g., curiosity about the friend's choice) minus the psychological cost (e.g., worry about their safety). If you are anxious, $C_{Psych}$ dominates, and you should remain ignorant.

