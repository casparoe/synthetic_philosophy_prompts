  'Turing took the statistical evidence for telepathy to be so strong that no scientifically responsible person could simply set it aside, and he regarded this as a serious difficulty for his imitation game. A human contestant who was a good telepathic receiver would have an unfair advantage: if the interrogator asked for the suit of a card he was holding, the human could answer correctly more often than chance in a way no ordinary digital computer could match, so the interrogator could identify the human without ever having to judge the quality of the conversation. Turing's response was to propose that the contestants be placed in a room shielded against telepathy. But he conceded that such shielding could not be guaranteed in practice, and he therefore admitted that the imitation game cannot settle whether a machine can think. This, the book says, is why Turing ultimately abandoned the test as a criterion of machine intelligence.'

