answer: |-
  This is a classic puzzle in the philosophy of privacy, often associated with the work of Judith Jarvis Thomson and the subsequent debates over whether privacy is a distinct right or reducible to other rights (like property or bodily integrity). Your friend has reconstructed a valid argument, but their proposed solution (rejecting 2 by simply asserting observation is a harm) feels unsatisfying because it is indeed circular. It defines "harm" as "whatever makes a privacy violation wrong," which explains nothing.

  You want to keep (4) (privacy violations are wrong) and you want to keep the spirit of (1) (morality is about how people are affected). You are nervous about rejecting (1) because it feels like abandoning the idea that morality is grounded in human well-being.

  Here is the exit: **You should reject the hidden assumption inside Premise (2), not Premise (1) itself.**

  The argument relies on a specific, narrow definition of "worse off" known as **Experiential Welfarism** (or Hedonism). This is the view that you are only "worse off" if your conscious experience is negatively altered (pain, distress, disappointment). If you reject *that specific definition* of "worse off," you can keep (1) and (4) without your friend's circularity.

  Here is how to walk out of the room.

  ### 1. Diagnose the Trap: The "Experience Machine" Problem
  Premise (2) assumes that if you never find out, your life is exactly the same. This assumes that **reality doesn't matter, only your experience of it matters.**

  Consider Robert Nozick's famous "Experience Machine" thought experiment. If you could be plugged into a machine that gave you the perfect experience of writing a great novel, while in reality you were floating in a tank, would you do it? Most people say no. We care about *actually* doing things, not just *feeling* like we did them.

  Similarly, Premise (2) assumes that if you don't *feel* violated, you aren't violated. But most of us believe that **betrayal** harms us even if we never discover it. If your spouse cheats on you on a business trip, never gets caught, and never risks disease, are you not worse off? Many would say yes, because the *reality of your relationship* has changed, even if your *experience* of it has not.

  ### 2. The Better Move: Reject the Narrow Definition of Harm in (2)
  Your friend wants to reject (2) but fails to explain *why*. You can reject (2) successfully by adopting an **Objective Interest Theory** of well-being rather than an Experiential one.

  On this view, human beings have objective interests in **autonomy, sovereignty, and control**.
  *   **The Argument:** Privacy is not primarily about *secrecy*; it is about **control over access**.
  *   **The Harm:** When a voyeur watches you, they seize control over a part of your life that belongs to you. They unilaterally decide to access you without your permission. This is a setback to your interest in **self-sovereignty**.
  *   **Why it's not circular:** It doesn't just say "it's a harm." It identifies a specific human interest (agency/control) that is objectively set back, analogous to how trespassing sets back your interest in property even if the trespasser leaves no footprints.

  This allows you to keep Premise (1). You are still saying wrongness is about making people "worse off." You are just arguing that "worse off" includes **loss of normative control**, not just loss of happiness.

  ### 3. What This Forces You to Say About Privacy
  If you take this exit, you are forced to redefine what privacy is *for*. It shifts the focus from **concealment** to **context**.

  *   **Privacy as Contextual Integrity:** (Drawing on Helen Nissenbaum's work). Privacy isn't about hiding information; it's about ensuring information flows according to the appropriate social norms. When a doctor shares your data with a marketer, the harm isn't necessarily that you're embarrassed; it's that the *context* of the relationship was violated.
  *   **Privacy as Moral Capital:** (Drawing on Jeffrey Reiman). Privacy is the social ritual by which we recognize each other as individuals. To deny someone privacy is to treat them as an object to be inspected rather than a subject to be engaged. The "harm" is the degradation of your status as a person, which happens regardless of your awareness.

  ### 4. The Alternative: Rejecting (1) (The Deontological Exit)
  If you find the "Objective Interest" move too slippery, you do have the option to reject (1), but you shouldn't view it as abandoning the idea that morality is about people.

  Rejecting (1) means adopting a **Deontological** view. On this view, morality is not just about *outcomes* (welfare/harm); it is about **rights and duties**.
  *   **The Shift:** Wrongness isn't about making someone worse off; it's about **violating a constraint**.
  *   **The Explanation:** You have a right to determine who accesses you. The voyeur violates that right. The wrongness lies in the **violation of the boundary**, not the consequence.
  *   **Addressing your nervousness:** This doesn't mean morality is disconnected from people. It means that *respecting people* is more fundamental than *maximizing their welfare*. You can argue that being treated as a sovereign agent is a precondition for well-being, so rights protect the *conditions* of welfare, even if a specific violation doesn't lower welfare metrics.

  ### Recommendation
  Given your constraints, **the strongest path is to refine Premise (2).**

  Stick with this formulation:
  > "Merely being observed *does* make you worse off because it undermines your objective interest in **normative control** over your personal boundaries, regardless of your subjective awareness."

  This avoids your friend's circularity by grounding the harm in a specific, defensible human interest (autonomy/sovereignty) rather than a bare assertion. It preserves the intuition that morality is about human welfare (Premise 1) by expanding our understanding of welfare to include **status and agency**, not just feelings.

  **The Exit Line for your Seminar:**
  "My friend argues that secret observation is a harm, but fails to explain why. I argue that Premise (2) relies on an overly narrow, experiential definition of 'worse off.' If we recognize that humans have an objective interest in **autonomy and control**, then secret observation *does* make us worse off by undermining our sovereignty, even if we never feel the pain. Privacy, then, is not a shield for secrets, but a shield for **agency**."
