      *   *Refinement:* A is closer to the standard consensus that the Presumptuous Philosopher result is unacceptable. B is defending SIA. The "dissolution" is to show that B's Building Analogy is disanalogous because it assumes a sampling process that doesn't exist in the cosmological case.

