      *   Derivation: Assume $p \land \neg Kp$. If knowable, then $\diamond K(p \land \neg Kp)$. In a possible world where this is known, $K(p \land \neg Kp)$ holds. By distribution, $Kp \land K\neg Kp$. By factivity, $p \land \neg Kp$. Contradiction ($K\neg Kp \to \neg Kp$). Therefore, $p \land \neg Kp$ is unknowable. If all truths are knowable, there are no unknown truths.
