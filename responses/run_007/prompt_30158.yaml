answer: |-
  # The Threshold Filing Protocol
  ### A Decision Procedure for Editorial Completion

  **Purpose:** To determine when a story has met the necessary standard for publication given fixed constraints of time, space, and resources.
  **Principle:** A story is ready when it meets the pre-agreed Target Standard, and the cost of improving it further outweighs the benefit.
  **Users:** Editors and Desk Staff.

  ---

  ## Phase 1: Setting the Target Standard (Pre-Reporting)
  *Before a writer is assigned or begins reporting, the Editor and Writer must complete the **Target Card**. This establishes the 'aspiration level'.*

  **Step 1.1: Define the 'Must-Haves'**
  List the specific factual or evidentiary elements required for the story to be factually safe and logically sound.
  *   *Sufficient Answer:* A finite list (e.g., "Two independent sources confirm the figure," "The study methodology is reviewed by one external expert").
  *   *Insufficient Answer:* Vague terms (e.g., "Thorough research," "Good quotes").

  **Step 1.2: Define the 'Ambition Level'**
  Categorise the intellectual goal of the piece. Choose one:
  *   **Type A (News/Analysis):** Accuracy and clarity are paramount. Surprise is secondary.
  *   **Type B (Feature/Investigation):** New information or a novel synthesis is required. Accuracy is paramount.
  *   **Type C (Essay/Opinion):** Persuasion and voice are paramount. Factual baseline must be met, but the argument is the priority.
  *   *Constraint:* This classification cannot be changed later without Editor sign-off (see Phase 3).

  **Step 1.3: Set the Search Budget**
  Estimate the maximum reasonable effort for this piece.
  *   *Metrics:* Maximum number of interviews, maximum days spent, maximum fact-checking budget.
  *   *Rationale:* Acknowledges that search is costly.

  ---

  ## Phase 2: The Mid-Point Cost Check (During Reporting)
  *To be conducted when 75% of the deadline or word count is consumed.*

  **Step 2.1: The Marginal Gain Test**
  Ask the writer: "What is the single most important thing left to find?"
  *   **If the answer is:** "A confirming quote," "A specific number," or "Clarification on X": Proceed to Phase 3.
  *   **If the answer is:** "I need to understand the whole field better," or "I'm looking for a better angle": **Stop.** This indicates the Target Standard (Phase 1) was unclear. Escalate to Editor.

  **Step 2.2: The Cost-Benefit Assessment**
  Ask: "How much time will finding this take, and what breaks if you don't find it?"
  *   **File:** If the time required exceeds the remaining budget *and* the story remains factually safe without it.
  *   **Keep Reporting:** If the missing element creates a risk of error or retraction.
  *   **Escalate:** If the time required exceeds the budget but the element is critical for the Ambition Level (Phase 1.2).

  ---

  ## Phase 3: The Filing Decision (Pre-Submission)
  *To be run when the writer claims the draft is ready.*

  **Test 3.1: The 'Must-Have' Audit**
  Compare the draft against the Phase 1.1 'Must-Haves' list.
  *   **Pass:** All items are present and verified.
  *   **Fail:** Any item is missing. **Result: Keep Reporting.** (Exception: See Test 3.3).
  *   **Escalate:** If an item is missing but the writer claims it is impossible to get.

  **Test 3.2: The 'Settling' Check**
  Identify any known gaps in the story. For each gap, ask: "Is this gap due to a lack of access, or a lack of effort?"
  *   **Satisficing (Acceptable):** The source refused to speak, the data does not exist, or the time cost to find it would miss the deadline.
  *   **Settling (Unacceptable):** The writer did not ask the obvious question, or avoided a difficult source to save time.
  *   **Result:** If 'Settling' is identified, **Keep Reporting**. If 'Satisficing', proceed to Test 3.3.

  **Test 3.3: The Limitation Disclosure**
  For any gaps accepted in Test 3.2, does the text explicitly acknowledge the limitation? (e.g., "The company declined to comment," "Data for 2023 is unavailable").
  *   **Pass:** Limitations are transparent to the reader.
  *   **Fail:** The story implies certainty where there is none. **Result: Keep Reporting** (to rewrite for accuracy).

  **Test 3.4: The Ambition Audit**
  Compare the draft against the Phase 1.2 'Ambition Level'.
  *   **Type A:** Is it accurate and clear? If yes, **File**.
  *   **Type B:** Does it contain new information or synthesis? If no, **Escalate**. (Note: Do not automatically order more reporting. The Editor must decide if the Ambition Level was unrealistic).
  *   **Type C:** Is the argument coherent? If yes, **File**.

  **Test 3.5: The Revision Lock**
  If the story fails Test 3.4, the Editor may choose to lower the Ambition Level (e.g., from Type B to Type A) to allow filing.
  *   **Requirement:** This change must be recorded on the Target Card with a reason (e.g., "Sources dried up," "News cycle moved on").
  *   **Constraint:** This cannot be done to mask writer underperformance. It is a strategic pivot, not a quality reduction.

  ---

  ## Case Applications

  ### Case 1: The Contested Epidemiological Claim
  *3,000-word feature. Two sources side A, one source side B. Central document withheld.*

  1.  **Phase 1 Check:** A 3,000-word feature is **Type B (Investigation)**. 'Must-Haves' should have included "Attempt to view central document."
  2.  **Phase 3, Test 3.1 (Audit):** The document is missing. Technically a **Fail**.
  3.  **Phase 3, Test 3.2 (Settling Check):** The document is withheld by owners. This is **Satisficing** (lack of access), not Settling.
  4.  **Phase 3, Test 3.3 (Disclosure):** Does the story say "The central document was withheld"?
      *   *If No:* **Keep Reporting** (to add the disclosure).
      *   *If Yes:* Proceed.
  5.  **Phase 3, Test 3.4 (Ambition):** Can the story stand without the document? With 2 vs 1 sources, the balance is skewed.
  6.  **Decision:** **Escalate.**
      *   *Reasoning:* The cost of being wrong on epidemiology is high. The imbalance of sources (2 vs 1) combined with a missing primary document creates a high risk of error. The procedure cannot mechanically verify the *weight* of the existing sources. An editor must judge if the two sources are sufficiently authoritative to outweigh the missing document. The procedure flags the risk; a human must weigh it.

  ### Case 2: The AI Safety News Analysis
  *900 words. Writer says ready. Read paper + one blog.*

  1.  **Phase 1 Check:** 900-word news analysis is **Type A (News/Analysis)**. 'Must-Haves' for safety claims usually require "Independent expert verification."
  2.  **Phase 3, Test 3.1 (Audit):** Did the writer get an independent expert? No (only a blog). **Fail**.
  3.  **Phase 3, Test 3.2 (Settling Check):** Is getting an expert too costly? For a 900-word piece, one email or 15-minute call is low cost.
  4.  **Decision:** **Keep Reporting.**
      *   *Reasoning:* The search cost is low, but the risk of error (AI safety claims are often hyped) is high. The Target Standard for 'News Analysis' on safety implies verification beyond the press release/paper. The writer is 'Settling', not 'Satisficing'.

  ### Case 3: The Reported Essay
  *2,500 words. Factually clean. 9 interviews. Not surprising. Editor wants more reporting.*

  1.  **Phase 1 Check:** What was the Ambition Level?
      *   *Scenario A:* Brief was "Report on X phenomenon." (Type A/B hybrid).
      *   *Scenario B:* Brief was "Find the hidden truth about X." (Type B).
  2.  **Phase 3, Test 3.1 (Audit):** Factually clean. 9 interviews. **Pass**.
  3.  **Phase 3, Test 3.2 (Settling Check):** No gaps in facts. **Pass**.
  4.  **Phase 3, Test 3.4 (Ambition Audit):**
      *   *If Scenario A:* The brief did not demand surprise. The story meets the Target Standard. **Result: File.**
      *   *If Scenario B:* The story lacks the required novelty. **Result: Escalate.**
  5.  **Resolution for the Editor:**
      *   If the procedure returns **File** (Scenario A), but you still feel it is weak, you must acknowledge that your *current* desire for surprise is a **Revision of the Aspiration Level** (Phase 3, Test 3.5).
      *   You may not order more reporting on the grounds of "incompleteness." You must order it as a "strategic pivot" to a higher ambition, acknowledging this may risk the deadline or require killing the piece if the new reporting fails.
      *   *Procedure Verdict:* If the original brief did not mandate surprise, the procedure dictates **File**. The "boredom" is an editorial taste issue, not a reporting failure. To commission more work is to change the contract, not to complete the existing one.

  ---

  ## Limitations and Failure Modes

  **1. The Procedure Cannot Measure Truth**
  This protocol assesses *process*, not *reality*. If a writer interviews two sources who are both confidently wrong, Test 3.1 will pass. The procedure assumes that meeting the 'Must-Have' list correlates with accuracy. It does not guarantee it. Fact-checking remains a separate, parallel safety net.

  **2. Judgement Disguised as Mechanics**
  Test 3.2 (Settling vs. Satisficing) and Test 3.4 (Ambition Audit) appear mechanical but rely on the editor's intuition. Determining whether a missing source is "too costly to find" or "avoided for convenience" is a qualitative judgement. The procedure forces this judgement to be explicit, but it does not remove the need for experience.

  **3. The 'Good Enough' Trap**
  The protocol is designed to prevent perfectionism, but it relies on the Phase 1 Target Standard being set correctly. If an editor habitually sets low 'Must-Haves' to ensure speed, the procedure will efficiently produce shallow content. It optimises for the goal you set; it does not correct bad goals.

  **4. Assumptions About the Newsroom**
  *   **Honesty:** It assumes writers will accurately report their search costs and gaps. A writer hiding a lack of effort will pass the test.
  *   **Record Keeping:** It requires the 'Target Card' (Phase 1) to actually exist. In a chaotic news environment, this pre-step is often skipped. Without it, Phase 3 has no baseline for comparison.
  *   **Editorial Authority:** It assumes the Editor has the power to say "File" to a boring story (Case 3) without external pressure. If publishers demand viral hits, the 'Ambition Level' will be forcibly raised regardless of the protocol.

  **5. Inability to Handle 'Black Swans'**
  If a story is technically complete but a major world event happens overnight that changes the context (e.g., a war breaks out relevant to the piece), the procedure says "File" (as constraints are met). It does not account for sudden shifts in relevance. This requires a human override.

  **6. The Cost of Error is Variable**
  The procedure treats 'risk of error' as a binary (safe/unsafe). In science journalism, the cost of a subtle nuance error might be low (a correction) or high (loss of credibility with a specific field). The protocol does not weight these consequences; it assumes the 'Must-Have' list captures the necessary safety level.
