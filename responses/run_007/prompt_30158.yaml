prompt: |-
  I cover science and ideas for a magazine, and I edit both long reported features and shorter news analyses. The recurring problem on my desk is knowing when a story is ready to file. Some writers treat every piece as if it needs one more source, one more study, one more rival interpretation; others stop the moment the piece is publishable and miss the reporting that would have changed the argument. Deadlines and word counts are fixed, but so is the cost of being shallow or wrong.

  I have read enough about Herbert Simon's work on satisficing and bounded rationality to believe that a threshold of acceptability, rather than an exhaustive search for the best possible version of a story, can be a rational stopping rule when search is costly and the full set of options cannot be surveyed. What I have not seen is that idea turned into a procedure an editor without a background in the theory can actually run. Please write one for me: a decision procedure, grounded in satisficing and bounded rationality, for deciding when a reported story is ready to file, which my desk could use repeatedly.

  Make it a procedure in the strongest sense. It should be a sequence of questions or tests in a fixed order, with a clear account of what counts as a sufficient answer to each; it should say where the procedure returns "file", where it returns "keep reporting", and where it stops and hands the decision to a person because the question is one of editorial judgement rather than mechanics. It should specify how to set an aspiration level for a piece before reporting begins, how to revise that level when the reporting environment turns out to be richer or poorer than expected, and how to prevent revision from becoming a quiet lowering of standards. It should distinguish satisficing from settling, and it should make the stopping rule sensitive to the costs of further search, not only to the quality of what has already been found.

  Build in the constraints of my context: a fixed word count and deadline for each piece; writers of varying experience; fact-checkers who are available but expensive; sources who will speak only on background; and the impossibility of covering every angle. The procedure should be usable by someone who has never read Simon, so translate the concepts rather than invoke them.

  Then run the procedure on three cases:

  1. A 3,000-word feature on a contested epidemiological claim. The writer has two strong sources on one side, one on the other, and a central document that neither side will release.

  2. A 900-word news analysis of a new paper on AI safety. The writer says it is ready, but has read only the paper itself and one critical blog post.

  3. A 2,500-word reported essay that meets its original brief, is factually clean and well written, but does not yet say anything surprising. The writer has already interviewed nine people. My instinct is to commission more reporting; I want the procedure to be capable of telling me, on its own terms, that the problem is the aspiration level I set at the start rather than a shortage of search, and to say "file" if that is what follows.

  Finally, say explicitly what the procedure cannot do: the cases where it will misfire, the steps that are judgement dressed as mechanics, and the assumptions it makes about the newsroom that may not hold elsewhere. Please write the answer in British English.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **User:** Magazine editor (science and ideas).
      *   **Problem:** Knowing when a story is ready to file (stopping rule).
      *   **Issues:** Some writers over-report (perfectionists), some under-report (premature closers). Deadlines/word counts are fixed. Cost of error (shallow/wrong) is high.
      *   **Theoretical Basis:** Herbert Simon's *satisficing* and *bounded rationality*.
      *   **Goal:** A concrete, repeatable decision procedure (algorithm-like) for editors who don't know the theory.
      *   **Requirements:**
          *   Sequence of questions/tests in fixed order.
          *   Clear criteria for "file", "keep reporting", or "escalate to human judgement".
          *   Mechanism for setting *aspiration levels* (targets) pre-reporting.
          *   Mechanism for revising aspiration levels (without lowering standards).
          *   Distinction between *satisficing* (good enough given constraints) and *settling* (giving up).
          *   Sensitivity to *search costs* (time/money/effort).
          *   Contextual constraints: Word counts, deadlines, varying writer experience, expensive fact-checkers, background sources, impossibility of omniscience.
          *   Language: British English.
          *   Application: Run the procedure on three specific cases.
          *   Limitations: Explicitly state what the procedure cannot do, where it misfires, and hidden assumptions.

  2.  **Deconstruct the Theory (Simon) for Practice:**
      *   *Bounded Rationality:* We can't know everything. We have limits (time, space, cognitive load).
      *   *Satisficing:* Set a threshold of acceptability (aspiration level). Stop when the threshold is met.
      *   *Search Costs:* Continuing to look for info has a cost (deadline, budget, reader attention).
      *   *Aspiration Level Adjustment:* If the target is too easy/hard to hit, adjust it, but do so consciously, not lazily.

  3.  **Drafting the Procedure (The "Satisficing Stop-Protocol"):**
      *   *Name:* Needs to sound operational. "The Aspiration-Threshold Protocol" or "The Satisficing Stop-Rule". Let's go with "The Threshold Filing Protocol".
      *   *Phase 1: Pre-Reporting (Setting the Aspiration).* Need to define what "good enough" looks like before starting.
      *   *Phase 2: Mid-Reporting (Monitoring Search Costs).* Are we spending too much for too little gain?
      *   *Phase 3: Pre-Filing (The Stop Test).* The actual checklist.
      *   *Phase 4: Escalation.* When the editor must decide.

      *Refining the Steps:*
      *   *Step 1 (Target Setting):* Define the "Must-Haves" vs. "Nice-to-Haves".
      *   *Step 2 (Cost Check):* Is the next source worth the time?
      *   *Step 3 (Validation):* Fact-checking status.
      *   *Step 4 (Surprise/Value):* Does it meet the intellectual promise?
      *   *Step 5 (The Decision):* File, Report, or Escalate.

      *Addressing "Satisficing vs. Settling":* This needs a specific test. Settling is ignoring a known gap. Satisficing is acknowledging a gap is too costly to fill.
      *Addressing "Aspiration Revision":* Need a formal log or sign-off to change the target.

  4.  **Developing the Three Cases:**
      *   *Case 1 (Epidemiology Feature):* High stakes, contested. Missing central document.
          *   *Analysis:* High cost of error. Missing document is a known gap. Is it fillable? If not, does the story stand without it? Likely needs escalation or specific framing of the limitation.
      *   *Case 2 (AI Safety News):* Short, fast. Writer says ready. Only paper + blog.
          *   *Analysis:* Low word count, high speed. But "one critical blog" might be insufficient for *safety* claims. Search cost is low (could call one expert). Aspiration level likely too low. Verdict: Keep reporting (minimal).
      *   *Case 3 (Reported Essay):* Clean, but boring. 9 interviews.
          *   *Analysis:* This is the tricky one. The user wants the procedure to say "File" if the problem is the *aspiration level*, not the reporting. The reporting is sufficient for the *original* brief. The "surprise" is a new aspiration. If the deadline is tight, the procedure should validate filing based on the original contract, flagging the "boredom" as an editorial preference, not a reporting failure.

  5.  **Drafting the Limitations:**
      *   It can't measure truth, only process.
      *   It relies on honest self-assessment by writers.
      *   It assumes the editor knows the cost of errors (libel vs. boredom).
      *   It can't fix a bad writer.

  6.  **Refining Tone and Language:**
      *   British English (analyse, programme, centre, colour, etc.).
      *   Professional, authoritative, yet practical.
      *   Avoid jargon where possible, or define it immediately.

  7.  **Iterative Polishing (Self-Correction during drafting):**
      *   *Critique:* Is the procedure too rigid?
      *   *Fix:* Add the "Escalation" step explicitly for when the mechanics fail.
      *   *Critique:* How do I prevent lowering standards?
      *   *Fix:* Require a written justification for changing the aspiration level *after* reporting starts, signed by the editor.
      *   *Critique:* Case 3 is counter-intuitive. Usually, boring stories need more reporting.
      *   *Fix:* The prompt specifically asks the procedure to be capable of saying "File" if the aspiration was the issue. I need to ensure the "Target Definition" phase distinguishes between "factual completeness" and "narrative brilliance". If the brief was "explain X", and X is explained, it passes. If the brief was "find the surprising truth about X", it fails. I will structure the Target Definition to force this distinction.

  8.  **Final Review against Constraints:**
      *   Sequence of questions? Yes.
      *   Clear account of sufficient answers? Yes.
      *   File/Keep/Escalate outcomes? Yes.
      *   Aspiration setting/revising? Yes.
      *   Satisficing vs. Settling? Yes.
      *   Search costs included? Yes.
      *   British English? Yes.
      *   Three cases run? Yes.
      *   Limitations section? Yes.

  9.  **Final Polish:** Check for flow and clarity. Ensure the distinction between "mechanical" checks and "judgement" calls is sharp. (Proceed to generate output).

  *(Self-Correction Note on Case 3)*: The prompt says: "I want the procedure to be capable of telling me, on its own terms, that the problem is the aspiration level I set at the start rather than a shortage of search, and to say 'file' if that is what follows."
  This means the procedure must validate the *original* brief. If the original brief didn't demand "surprise", the procedure must allow filing. I need to make sure the "Aspiration Setting" phase captures "Narrative Ambition" as a distinct variable from "Factual Completeness".

  *(Self-Correction Note on Terminology)*: Avoid using "Satisficing" in the procedure text itself, as per instructions ("usable by someone who has never read Simon"). Use "Threshold of Acceptability" or "Target Standard".

  *(Self-Correction Note on British English)*: Ensure 's' instead of 'z' in organis/realis, 'programme' (for plans), 'centre', 'colour', 'defence', etc.

