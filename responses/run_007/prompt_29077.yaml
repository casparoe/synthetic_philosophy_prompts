  # Seminar Handout: Navigating Lewis's Triviality Result
  **Starting Commitment:** *I accept Adams' Thesis (AT): My degree of confidence in 'If A, then B' equals my conditional probability $P(B|A)$.*

  **Instructions:** Answer the following questions based on your philosophical intuitions about logic, probability, and language. Follow the branches to find your consistent position. Note that accepting all assumptions leads to a contradiction; you must reject at least one node to maintain consistency.

  ---

  ### The Decision Tree

  **Node 1: Propositionality**
  Do indicative conditionals ('If A, B') express propositions that are strictly true or false in a world, independent of anyone's beliefs?
  *   **No** $\rightarrow$ Go to **Leaf A**.
  *   **Yes** $\rightarrow$ Go to Node 2.

  **Node 2: Truth-Functionality**
  Is the truth value of 'If A, B' determined *solely* by the truth values of A and B (i.e., is it false only when A is true and B is false)?
  *   **Yes** $\rightarrow$ Go to **Leaf B**.
  *   **No** $\rightarrow$ Go to Node 3.

  **Node 3: Standard Probability Axioms**
  Do the standard Kolmogorov axioms of probability apply unconditionally to the propositions expressed by conditionals?
  *   **No** $\rightarrow$ Go to **Leaf C**.
  *   **Yes** $\rightarrow$ Go to Node 4.

  **Node 4: Law of Total Probability**
  Does the Law of Total Probability ($P(X) = P(X|Y)P(Y) + P(X|\neg Y)P(\neg Y)$) hold for these conditional propositions?
  *   **No** $\rightarrow$ Go to **Leaf C**.
  *   **Yes** $\rightarrow$ Go to Node 5.

  **Node 5: Universality**
  Does Adams' Thesis ($P(\text{if}) = P(|)$) hold for *every* rational credence function, regardless of the agent's specific evidence?
  *   **No** $\rightarrow$ Go to **Leaf D**.
  *   **Yes** $\rightarrow$ Go to Node 6.

  **Node 6: Closure under Conditionalization**
  Does Adams' Thesis hold even for probability functions derived by standard conditionalization on the antecedent A?
  *   **No** $\rightarrow$ Go to **Leaf E**.
  *   **Yes** $\rightarrow$ Go to Node 7.

  **Node 7: Non-Triviality**
  Are there cases where learning A changes your confidence in B (i.e., $P(B|A) \neq P(B)$)?
  *   **No** $\rightarrow$ Go to **Leaf F**.
  *   **Yes** $\rightarrow$ Go to **Leaf G**.

  ---

  ### The Leaves (Positions)

  **Leaf A: No-Truth-Value Epistemic View (Adams / Edgington)**
  *   **Position:** Conditionals do not express propositions; they are assertions of conditional belief. They have assertability conditions, not truth conditions.
  *   **Status on AT:** **Accepts AT.** By denying Node 1, this view avoids Lewis's result entirely.
  *   **Diagnostic Note:** This is the most direct way to preserve Adams' Thesis.

  **Leaf B: The Material Conditional**
  *   **Position:** 'If A, B' is equivalent to $\neg A \lor B$.
  *   **Status on AT:** **Rejects AT.**
  *   **Diagnostic Note:** You answered Yes to Nodes 1 & 2. However, the Material Conditional entails $P(\text{if}) = P(\neg A \lor B)$, which generally $\neq P(B|A)$. To be consistent, you must abandon your starting commitment to Adams' Thesis. This leaf represents the cost of maintaining truth-functionality.

  **Leaf C: Non-Classical Probability View**
  *   **Position:** Conditionals are propositions, but they obey a non-classical probability logic (e.g., quantum probability or supervaluationist probability).
  *   **Status on AT:** **Accepts AT.**
  *   **Diagnostic Note:** Rarely defended. This view saves AT by modifying the mathematical framework of probability itself (denying Nodes 3 or 4).

  **Leaf D: Restricted Adams' Thesis (Bradley / Contextualist)**
  *   **Position:** Conditionals have truth conditions, but AT only holds for a limited class of probability functions (e.g., those compatible with the current context).
  *   **Status on AT:** **Accepts AT (Restricted).**
  *   **Diagnostic Note:** By denying Node 5 (Universality), this view argues that conditionals shift the context of evaluation, so the triviality proof (which requires a fixed function) doesn't get off the ground.

  **Leaf E: Stalnaker-Style Truth-Conditional View (Imaging)**
  *   **Position:** Conditionals have truth conditions based on possible worlds (closest A-worlds), but we update beliefs via *Imaging*, not Conditionalization.
  *   **Status on AT:** **Accepts AT (via Imaging).**
  *   **Diagnostic Note:** By denying Node 6, this view accepts Lewis's math but rejects the assumption that learning A involves standard conditionalization. It preserves a version of AT without triviality.

  **Leaf F: Probabilistic Triviality (Incoherent)**
  *   **Position:** 'If A, B' implies A and B are probabilistically independent.
  *   **Status on AT:** **Incoherent.**
  *   **Diagnostic Note:** **Empty Combination.** This view is empty because it is **incoherent**. It claims conditionals exist but asserts they convey no probabilistic connection between antecedent and consequent, defeating the purpose of a conditional.

  **Leaf G: The Triviality Contradiction**
  *   **Position:** None.
  *   **Status on AT:** **Impossible.**
  *   **Diagnostic Note:** **Empty Combination.** This is **incoherent**. Answering "Yes" to all nodes reproduces Lewis's Triviality Proof: you have proven that $P(B|A) = P(B)$ for all A, B, which contradicts Node 7. You cannot hold this position.

  ---

  ### Instructor's Commentary: Ordering and Diagnostic Value

  **Why this order?**
  The tree is ordered from **Metaphysics** to **Mathematics** to **Dynamics**.
  1.  **Metaphysics (Nodes 1-2):** We first determine *what kind of thing* a conditional is. If it's not a proposition (Node 1), the probability calculus doesn't apply in the standard way, and we exit early to the Epistemic view. If it is truth-functional (Node 2), we exit to the Material view. This isolates the two "classical" logic views before engaging with the probabilistic constraints.
  2.  **Mathematics (Nodes 3-4):** Before asking about the *scope* of Adams' Thesis, we must establish the *rules* of the probability game. If the standard axioms or Total Probability don't apply, the triviality proof fails mathematically.
  3.  **Dynamics/Scope (Nodes 5-7):** Finally, we test the specific assumptions Lewis used to generate the contradiction. Universality (Node 5) and Closure (Node 6) are the most common "escape hatches" for truth-conditionalists (leading to Restricted or Stalnaker views). Non-Triviality (Node 7) is the empirical check that ensures we are talking about genuine conditionals.

  **Where is the diagnostic work happening?**
  *   **Distinguishing Stalnaker from Restricted AT:** Both views keep truth conditions and a version of AT. The tree separates them at **Node 6**. Stalnaker denies that we update via *conditionalization* (he uses Imaging), whereas Restricted AT theorists (like Bradley) often accept conditionalization but deny that AT holds *universally* across contexts (Node 5).
  *   **The Material Conditional Trap:** The tree forces students who select **Leaf B** to realize they have walked into a contradiction with their starting premise. It diagnoses that the Material Conditional is incompatible with Adams' Thesis, requiring the student to explicitly drop their initial commitment.
  *   **The Incoherent Leaves:** **Leaf F** and **Leaf G** flag combinations that are logically impossible. This teaches students that Lewis's result isn't just a suggestion; it's a proof that the "Yes/Yes/Yes/Yes/Yes/Yes" path is a logical dead end.
