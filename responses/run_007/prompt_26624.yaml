  Here is a villanelle designed for your seminar. It adheres strictly to the form to mirror the relentless, recursive structure of the Sorites chain. The rhymes are exact to ensure the "locking" sensation of the paradox, and the vocabulary remains non-technical while preserving the logical stakes.

  ### The Heap

  Remove one grain; the heap does not fall.  
  We stand before a mountain in the light,  
  Until there is no heap left at all.  

  No voice can draw a boundary on the wall,  
  No sharp division meets the searching sight,  
  Remove one grain; the heap does not fall.  

  Like dusk dissolving every distinct wall,  
  Like twilight bleeding into darkest night,  
  Until there is no heap left at all.  

  Or when a man becomes a corpse, so small,  
  Or breath departing in the cold of night,  
  Remove one grain; the heap does not fall.  

  We walk the path within a narrow thrall,  
  We follow steps that seem both true and tight,  
  Until there is no heap left at all.  

  One grain remains, too little to recall,  
  A single speck against the coming night.  
  Remove one grain; the heap does not fall.  
  Until there is no heap left at all.  

  ***

  ### Instructor's Note on Usage

  **The Form as Argument:**
  You might point out to your students how the villanelle's structure enacts the paradox. The two refrains represent the two incompatible commitments we hold:
  1.  **Refrain 1 (Tolerance):** *Remove one grain; the heap does not fall.* (The inductive step/premise of tolerance).
  2.  **Refrain 2 (Conclusion):** *Until there is no heap left at all.* (The observational fact that heaps do vanish).

  **The Final Quatrain:**
  In a standard villanelle, the final quatrain brings the two refrains together for resolution. Here, their collision creates the contradiction. When read consecutively at the end (*"Remove one grain; the heap does not fall. / Until there is no heap left at all."*), they form a single sentence that asserts both the impossibility of a boundary and the reality of the boundary. It leaves the audience in the "thrall" mentioned in the fifth stanza—trapped between a principle that seems undeniable and a conclusion that seems absurd.

  **Generalization:**
  Stanzas 3 and 4 briefly widen the lens ("dusk," "twilight," "man becomes a corpse") to hint that this problem applies to color spectra and personhood, without losing the central image of the sand. This prepares the ground for later discussion on whether the solution lies in language, metaphysics, or epistemology.
