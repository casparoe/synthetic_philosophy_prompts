prompt: |-
  I'm a PhD student working on causation, and before I read any more accounts of causation by omission I want the specification fixed. Write the desiderata: what must an adequate theory of causation by omission deliver, and why is each item a requirement? I want the canonical cases on the table — the gardener who fails to water the plant, the bystander who does not intervene, the physician who withholds treatment, the would-be rescuer who holds back because someone else has already jumped in — with, for each, the precise demand it places on a theory. Then mark which requirements are non-negotiable and which are local commitments. In particular, adjudicate which of the following are genuine constraints and which are camp-specific: that omissions are absences rather than events, that an adequate account must preserve the allowing/doing distinction, that it must explain the tight link between our omission attributions and norms and expectations, and that it must not let the baseline for what would have happened be fixed by our interests. Flag any pair you believe cannot be jointly met — I suspect a norm-free metaphysics of omissions and the norm-tracking of ordinary causal judgment pull apart — but argue it rather than assume it. Finally, say which single requirement does the most work excluding candidate theories, and say explicitly which consideration would most likely change your mind about the shape of the list, or where your reasoning about it is most fragile.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** PhD student in philosophy (causation).
      *   **Task:** Specify desiderata for a theory of causation by omission.
      *   **Key Components:**
          *   List requirements (what an adequate theory must deliver + why).
          *   Include canonical cases (Gardener, Bystander, Physician, Redundant Rescuer) with precise demands.
          *   Distinguish Non-Negotiable vs. Local Commitments.
          *   Adjudicate specific debated constraints (Omissions as Absences vs. Events, Allowing/Doing, Norms/Expectations link, Interest-relativity of baselines).
          *   Flag incompatible pairs (specifically Norm-Free Metaphysics vs. Norm-Tracking Judgment) and argue.
          *   Identify the single most exclusionary requirement.
          *   Identify the most fragile consideration/what would change the mind.
      *   **Tone:** Rigorous, academic, precise, philosophical (matching a PhD level).
      *   **Goal:** Fix the specification *before* reading more literature.

  2.  **Deconstruct the Desiderata:**
      *   What makes a theory of omission causation *work*?
      *   It needs to handle the intuition that sometimes not doing something *is* a cause (Gardener), but sometimes it isn't (Bystander).
      *   It needs to handle the metaphysics (are omissions real?).
      *   It needs to handle the normative dimension (duties, expectations).
      *   It needs to handle preemption/redundancy (Rescuer).

  3.  **Drafting the Canonical Cases & Demands:**
      *   *Gardener:* Fails to water, plant dies. Intuition: Cause. Demand: Theory must count specific failures to fulfill duties/roles as causes.
      *   *Bystander:* Sees drowning, does nothing, victim dies. Intuition: Not a cause (usually). Demand: Theory must distinguish this from Gardener without arbitrary line-drawing.
      *   *Physician:* Withholds treatment (futile or requested), patient dies. Intuition: Context-dependent (often not cause if futile/consented). Demand: Theory must accommodate normative permissions/medical standards.
      *   *Redundant Rescuer:* A jumps in, B holds back. Victim lives. (Wait, standard omission case is: Victim dies, A could save, B could save, neither does. Or: Victim lives, A saves, B doesn't need to.) Let's stick to the prompt's "would-be rescuer who holds back because someone else has already jumped in." This is a preemption/overdetermination case regarding the *omission*. If A saves, B's omission didn't cause death. Demand: Theory must handle counterfactual dependence in omission contexts (preemption).

  4.  **Adjudicating the Specific Constraints:**
      *   *Omissions as Absences vs. Events:* This is metaphysical. Is it a non-negotiable? No. Counterfactual theories treat them as relations between events/states. Process theories struggle. *Verdict:* Local Commitment (Metaphysical camp).
      *   *Allowing/Doing Distinction:* Trolley problem stuff. Does the theory need to preserve this? Many think causation is extensional, morality is intensional. *Verdict:* Local Commitment (Moral/Action Theory interface).
      *   *Norms/Expectations Link:* The Gardener vs. Bystander puzzle hinges on this. *Verdict:* Non-Negotiable (Phenomenological adequacy).
      *   *Interest-Relativity of Baselines:* Contextualism vs. Invariantism. *Verdict:* Local Commitment (Semantic/Metaphysical stance).

  5.  **Addressing the Incompatibility (Norm-Free Metaphysics vs. Norm-Tracking):**
      *   This is the crux of the literature (e.g., Beebee vs. McGrath vs. Schaffer).
      *   *Argument:* If causation is a purely physical relation (process/mechanism), omissions (no-thing) can't be causes. If we say they *are* causes, we import norms. Can we have a norm-free metaphysics that yields norm-tracking judgments? Only via pragmatics. But if the *causal relation itself* is sensitive to norms, the metaphysics isn't norm-free.
      *   *Conclusion:* They likely pull apart. A theory must choose: either causation is norm-laden (metaphysically) or the *attribution* is norm-laden (pragmatically), but not both in a way that claims objective norm-free causal facts that track norms.

  6.  **Identifying the "Most Work" Requirement:**
      *   What kills the most theories? Usually the **Gardener/Bystander Distinction** (selectivity). Many theories (simple counterfactual) make the Bystander a cause. Only norm-sensitive or contextualist theories save the distinction.
      *   *Selection:* The "Selectivity Constraint" (distinguishing causal omissions from background conditions).

  7.  **Identifying the "Most Fragile" Consideration:**
      *   Where could I be wrong? The status of **Interest-Relativity**. If causation is fundamentally contrastive (Schaffer), then interest-relativity is built-in. If it's not, the whole list shifts. Or, the metaphysical status of omissions (real vs. fictional).
      *   *Selection:* The metaphysical status of omissions (Real vs. Fictional/Pragmatic). If omissions are just useful fictions, the "causation" is actually just explanation.

  8.  **Structuring the Response:**
      *   **Introduction:** Acknowledge the task (fixing specifications).
      *   **Section 1: The Canonical Cases & Demands:** Table or list format for clarity.
      *   **Section 2: The Desiderata (Non-Negotiable vs. Local):** Categorized list with justification.
      *   **Section 3: Adjudication of Contested Constraints:** Analyze the four specific prompts.
      *   **Section 4: The Incompatibility Argument:** Norm-Free Metaphysics vs. Norm-Tracking.
      *   **Section 5: Exclusionary Power & Fragility:** The "killer" constraint and the "weak link."

  9.  **Refining the Content (Self-Correction during drafting):**
      *   *Correction on Rescuer Case:* The prompt says "would-be rescuer who holds back because someone else has already jumped in." This implies the victim *lives*. So the omission didn't cause death. The demand is explaining why the omission isn't a cause of *survival* or why it's not a cause of *death* (since death didn't occur). Actually, usually, this case is used to show that the omission is *not* a cause because the effect (death) didn't happen, or to test preemption. Let's frame it as: Why is B's omission not a cause of the victim's *safety*? Or, more standardly: In a case where the victim *dies* but two people could have saved them (Overdetermination), why are both causes? The prompt specifies the "holds back because someone else jumped in" case. This is a *preemption* case for omissions. A's action saves; B's omission is preempted. Demand: Handle causal preemption involving omissions.
      *   *Refining Norms:* Be careful not to conflate moral norms with statistical norms. The Gardener case often relies on role-based norms, Bystander on lack thereof.
      *   *Refining Metaphysics:* Ensure the distinction between "omissions are absences" (ontological) and "omissions are events" (ontological) is clear.
      *   *Tone Check:* Keep it dense and precise. Avoid fluff. Use philosophical terminology correctly (e.g., "counterfactual dependence," "process theory," "pragmatics," "contrastivism").

  10. **Final Review against constraints:**
      *   Did I list desiderata? Yes.
      *   Did I explain *why* for each? Yes.
      *   Canonical cases included? Yes.
      *   Non-negotiable vs. Local marked? Yes.
      *   Adjudicated the 4 specific constraints? Yes.
      *   Flagged incompatible pair and argued? Yes.
      *   Single requirement doing most work? Yes.
      *   Most fragile consideration? Yes.

  11. **Final Polish:** Check for clarity and flow. Ensure the argument about the incompatibility of norm-free metaphysics and norm-tracking is robust (this is the philosophical heart of the response). (Self-correction: Make sure to explicitly mention Beebee, McGrath, Schaffer, or Lewis implicitly or explicitly as touchstones for the PhD student). *Decision: Keep it general but technically precise enough to signal familiarity without name-dropping excessively.*

  12. **Drafting the response.** (Proceeds to generate output based on these thoughts).
answer: |-
  This specification fixes the target for evaluating theories of causation by omission. It distinguishes between phenomenological adequacy (matching judgments) and metaphysical coherence (fitting a worldview). The following desiderata are structured to force a choice between revisionary metaphysics and contextualist pragmatics.

  ### I. Canonical Cases and Precise Demands

  An adequate theory must generate the correct causal verdicts for these four cases without ad hoc adjustments.

  | Case | Scenario | Intuitive Verdict | Precise Theoretical Demand |
  | :--- | :--- | :--- | :--- |
  | **1. The Gardener** | A hired gardener fails to water a client's plant; the plant dies. | **Cause:** The failure to water caused the death. | **The Duty Constraint:** The theory must license causal attribution when a specific agent fails to fulfill a salient normative or functional role, distinguishing this from background conditions. |
  | **2. The Bystander** | A passerby sees a child drowning, could easily save them, does not; the child dies. | **Non-Cause:** The passerby's inaction is not typically cited as *the* cause of death (though morally culpable). | **The Selectivity Constraint:** The theory must exclude omissions where no specific duty/expectation exists, despite identical counterfactual dependence (if they had acted, death would not have occurred). |
  | **3. The Physician** | A doctor withholds futile treatment (or respects a DNR); the patient dies. | **Non-Cause:** The withholding is not the cause of death; the underlying pathology is. | **The Baseline Constraint:** The theory must fix the "normal course of events" such that medically appropriate omissions do not register as causal interventions altering the outcome. |
  | **4. The Redundant Rescuer** | Victim is drowning. Rescuer A jumps in. Rescuer B, seeing A, holds back. Victim lives. | **Non-Cause:** B's omission did not cause the survival (nor the death). | **The Preemption Constraint:** The theory must handle causal preemption involving omissions. B's omission is causally inert because A's action secured the outcome; B's counterfactual impact is screened off. |

  ---

  ### II. The Desiderata: Non-Negotiable vs. Local Commitments

  #### Non-Negotiable Requirements (Phenomenological & Logical Adequacy)
  *These must be met for the theory to count as an account of *our* concept of causation by omission.*

  1.  **The Selectivity Requirement:**
      *   **Demand:** The theory must distinguish between causal omissions (Gardener) and non-causal omissions (Bystander).
      *   **Why:** Simple counterfactual dependence fails here (both satisfy "if X had occurred, Y would not have"). A theory that makes the Bystander a cause is extensionally adequate but intensionally bankrupt; it fails to track actual usage.
  2.  **The Asymmetry Requirement:**
      *   **Demand:** The theory must explain why we cite omissions as causes in some contexts but not others, without making causation wholly arbitrary.
      *   **Why:** Causal judgments are stable enough to support reasoning and liability. If causation by omission were purely subjective, it could not ground the stable distinctions required in law or science.
  3.  **The Transitivity Compatibility:**
      *   **Demand:** The theory must specify whether causation by omission is transitive and under what conditions.
      *   **Why:** To avoid paradoxes (e.g., if my not watering causes the plant's death, and the plant's death causes my sadness, did my not watering cause my sadness?). A theory must either block or license this consistently.

  #### Local Commitments (Metaphysical & Semantic Stances)
  *These are optional theoretical choices that define specific camps.*

  1.  **Metaphysical Realism about Omissions:**
      *   **Demand:** Treat omissions as real entities (absences) or merely as true negative propositions.
      *   **Why:** This determines whether the theory is ontologically inflationary (Beebee) or deflationary (Lewis/Schaffer).
  2.  **Interest-Relativity:**
      *   **Demand:** Whether the causal baseline is fixed by context/interests or by objective facts.
      *   **Why:** Determines if the theory is contextualist (context fixes the contrast) or invariantist (causation is a binary relation).
  3.  **The Allowing/Doing Distinction:**
      *   **Demand:** Whether the theory treats "allowing to die" as causally distinct from "killing."
      *   **Why:** This is primarily a requirement for *moral* theories of action, not necessarily for *metaphysical* theories of causation. A metaphysical theory can treat them as identical causal structures while a moral theory distinguishes them.

  ---

  ### III. Adjudication of Contested Constraints

  You asked to flag which of the following are genuine constraints and which are camp-specific.

  1.  **"Omissions are absences rather than events."**
      *   **Verdict:** **Camp-Specific.**
      *   **Reasoning:** This is an ontological commitment, not a functional requirement. A counterfactual theory (Lewis) can treat omissions as events (regions of spacetime where an event did not occur). A process theory might require them to be absences of processes. The *function* of the omission in the causal model matters more than its ontological category. Insisting on "absences" begs the question against deflationary accounts.
  2.  **"Must preserve the allowing/doing distinction."**
      *   **Verdict:** **Camp-Specific (Moral/Action Theory).**
      *   **Reasoning:** This is not a constraint on *causation* simpliciter. Causation is arguably extensional; "allowing" and "doing" often share the same causal structure (counterfactual dependence). Preserving this distinction is a requirement for a theory of *moral responsibility*, not a theory of *causal relations*. Conflating the two leads to category errors.
  3.  **"Must explain the tight link between omission attributions and norms/expectations."**
      *   **Verdict:** **Genuine Constraint.**
      *   **Reasoning:** This is required to satisfy the **Selectivity Requirement** (Gardener vs. Bystander). Without norms or expectations, there is no principled way to distinguish the Gardener's failure from the Bystander's failure given identical counterfactual dependence. Any theory that denies this link fails to describe the phenomenon.
  4.  **"Must not let the baseline for what would have happened be fixed by our interests."**
      *   **Verdict:** **Camp-Specific (Invariantism).**
      *   **Reasoning:** This is a commitment to causal invariantism. Contrastivist accounts (Schaffer) argue the baseline *is* fixed by the contrast selected by interests. Denying interest-relativity rules out contrastivism a priori. It is a legitimate stance, but not a precondition for adequacy.

  ---

  ### IV. The Incompatibility Argument: Norm-Free Metaphysics vs. Norm-Tracking

  **The Conflict:** You suspect a norm-free metaphysics of omissions and the norm-tracking of ordinary causal judgment pull apart. **You are correct.** They cannot be jointly met without shifting the normativity to pragmatics.

  **The Argument:**
  1.  **Premise 1:** If causation is a relation in the world (metaphysical realism/invariantism), its relata and the relation itself must be describable in non-normative terms (physics, spacetime, counterfactuals). Norms are mind-dependent or social; physics is not.
  2.  **Premise 2:** Ordinary causal judgment regarding omissions (Gardener vs. Bystander) is sensitive to norms (duties, roles, expectations).
  3.  **Premise 3:** If the *causal relation itself* is norm-free, but our *judgments* track norms, then the normativity must enter via pragmatics (assertibility conditions, conversational context) rather than semantics (truth conditions).
  4.  **Conclusion:** A theory cannot claim that (a) causation is an objective, norm-free relation *and* (b) the truth conditions of causal claims involving omissions are sensitive to norms.

  **Adjudication:**
  *   **Option A (Revisionary):** Maintain norm-free metaphysics (e.g., Beebee). Result: Ordinary judgments about the Bystander are strictly *false* (or true only pragmatically). We say the Bystander caused the death, but strictly speaking, they didn't. This saves metaphysics at the cost of phenomenology.
  *   **Option B (Contextualist/Contrastivist):** Maintain norm-tracking judgments (e.g., Schaffer/McGrath). Result: Causation is not a binary, norm-free relation. It is a contrastive relation where the contrast is selected by normative expectations. This saves phenomenology at the cost of "pure" metaphysics.

  **Verdict:** You cannot have a norm-free metaphysics that *delivers* norm-tracking truth conditions. You must choose: either the norms are in the world (making causation partially normative) or the norms are in the head (making causal attribution pragmatic). Most "hybrid" attempts fail by smuggling norms into the selection of "relevant" counterfactuals while claiming the relation itself is pure.

  ---

  ### V. Exclusionary Power and Fragility

  #### 1. The Single Requirement Doing the Most Work
  **The Selectivity Requirement (Gardener vs. Bystander).**

  *   **Why:** This is the "killer constraint."
      *   It eliminates **Simple Counterfactual Theories** (Lewis-style): They make the Bystander a cause.
      *   It eliminates **Strict Process Theories**: They often struggle to make the Gardener a cause (no physical process transmitted in an omission).
      *   It eliminates **Purely Probabilistic Theories**: Unless probability is relativized to a normative baseline, they cannot distinguish the Gardener from the Bystander.
  *   To satisfy Selectivity, a theory *must* adopt either Normativism (norms are part of the causal relata) or Contextualism (norms fix the contrast). This forces the theorist into a specific metaphysical camp immediately.

  #### 2. The Most Fragile Consideration
  **The Status of the Baseline (Interest-Relativity vs. Invariantism).**

  *   **Why my reasoning is fragile here:** My insistence on the **Selectivity Requirement** presupposes that there is a *fact of the matter* about whether the Bystander is a cause.
  *   **What would change my mind:** If convincing arguments were presented for **Causal Nihilism** or **Radical Contextualism**.
      *   If causation is *wholly* interest-relative (such that there is no "God's eye view" of the causal structure), then the tension between Gardener and Bystander dissolves. In one context, the Bystander is a cause; in another, they are not. There is no contradiction to resolve.
      *   If I am persuaded that ordinary judgment is simply *error-prone* regarding omissions (the Revisionary view), then the Selectivity Requirement loses its force as a constraint on *metaphysics* (though it remains a constraint on psychology).
  *   **Fragility:** The entire list assumes we are trying to save the phenomena of ordinary judgment. If the phenomena are deemed unreliable (e.g., due to cognitive bias regarding agency), the demand for a theory to match the Gardener/Bystander distinction becomes a demand to match a bug, not a feature. This is the weakest link in the specification because it relies on the authority of intuition, which is precisely what naturalistic metaphysics often challenges.

  ### Summary for Your Research
  Fix your specification by accepting that **Selectivity** is the hard constraint, which forces a choice between **Normative Metaphysics** or **Pragmatic Contextualism**. Do not attempt to satisfy the "Norm-Free Metaphysics" constraint simultaneously with the "Norm-Tracking Judgment" constraint; treat that conjunction as a proof of inconsistency. Your work should focus on which horn of that dilemma is less costly.
