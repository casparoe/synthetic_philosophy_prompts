      *   Hofstadter says: The frame message is the signal that *these* sound waves/marks are *not* noise. It is the message "There is a message here."
      *   Why it matters: If it's just physical fact, then *all* physical facts are frame messages. But Hofstadter distinguishes between noise and signal. The "Frame" is the *threshold of interpretation*.
