answer: |-
  There is no single, canonical Greek or Latin term for this specific dynamic in the standard ethics canon (you won't find it in Kant or Mill under a specific header). However, it is a recognized composite phenomenon discussed across **moral psychology**, **legal theory (torts)**, and **sociology**.

  The phenomenon you are describing is best understood as the **transformation of supererogatory acts into agent-relative obligations via reliance and precedent.**

  Here is how to carve it off from nearby concepts, the mechanisms that drive it, and the terms closest to what you're looking for.

  ### 1. The Closest Established Concepts

  While there isn't one word, three distinct frameworks describe the different "layers" of this phenomenon.

  **A. Legal/Moral: "Assumption of Duty" (or Detrimental Reliance)**
  In tort law, there is a principle (often codified in the *Restatement of Torts*) regarding the **Assumption of Duty**. If you voluntarily undertake to render services to another (even if you had no initial duty to do so), you may become liable if you discontinue them in a way that leaves the other party worse off than if you had never acted.
  *   **The Fit:** This explains the *logic* of the resentment. The group feels you created a dependency.
  *   **The Mismatch:** In your examples (bringing food, fixing mistakes), the recipients usually aren't objectively "worse off" than before you started (they would have starved or made errors anyway). The "harm" is purely the *loss of the benefit*, not a new detriment. However, moral psychology often treats the removal of a benefit as a harm (Loss Aversion).

  **B. Psychological: "Hedonic Adaptation" + "Psychological Entitlement"**
  This is the engine of the resentment.
  *   **Hedonic Adaptation:** Humans quickly normalize positive changes. The first time you bring food, it's a gift. The tenth time, it's Tuesday. The baseline shifts.
  *   **Psychological Entitlement:** Once the baseline shifts, the benefit is re-categorized from "gift" to "due." When the gift stops, it is processed not as a return to neutrality, but as a *loss*. Resentment is the emotional response to perceived loss of entitlement.

  **C. Sociological: "Emergent Role Crystallization"**
  In group dynamics, roles are not always assigned; they are often **emergent**.
  *   **The Fit:** You noted it's not a formal role. Sociologists call this **informal role crystallization**. Through repeated behavior, the group silently assigns you the label of "The Provider" or "The Fixer."
  *   **The Mismatch:** Usually, roles are somewhat flexible. In your scenario, the role becomes "sticky" and person-specific, which is why it feels like a trap.

  ### 2. How to Distinguish It (The Boundaries)

  You asked to carve this off from nearby concepts. Here is the boundary work:

  **vs. Promissory Obligation**
  *   **Promise:** Requires a speech act or explicit agreement ("I will do this").
  *   **Your Phenomenon:** Based entirely on *conduct*. It is a **Tacit Expectation** generated by pattern recognition, not communication. The moral force comes from *consistency*, not commitment.

  **vs. Role Obligation**
  *   **Role:** Generalizable. If the "Office Manager" quits, the next Office Manager inherits the duty.
  *   **Your Phenomenon:** **Agent-Relative.** The duty is fused to *you*. If you leave, the duty evaporates; it does not transfer to the new hire. This proves it isn't a structural role, but a **personal precedent**.

  **vs. The "Moral Saint" Problem (Susan Wolf)**
  *   **Saint Problem:** People resent the saint because the saint's existence makes *them* feel inadequate or judged. The resentment is about *shame*.
  *   **Your Phenomenon:** People resent the actor because *they* (the group) are losing a benefit. The resentment is about *deprivation*. It is not "You make me look bad," it is "You are taking away what is ours."

  **vs. Baseline Shift**
  *   **Baseline Shift:** This is the *psychological mechanism* (getting used to things).
  *   **Your Phenomenon:** This is the *moral interpretation* of that shift. A baseline shift becomes a moral issue only when the group moves from "I expect this" (prediction) to "You owe me this" (norm).

  ### 3. Proposed Terminology

  Since there is no single standard term, philosophers and psychologists discussing this tend to use descriptive phrases. If you need a label for your own thinking, these are the most accurate:

  **1. "Supererogatory Sedimentation"**
  This captures the geological aspect: layer upon layer of optional acts hardens into a rock-solid obligation over time.

  **2. "Agent-Relative Obligation via Precedent"**
  This is the technical ethical description. It highlights that the obligation is tied to the specific agent (not the role) and arises from past actions (precedent) rather than principle.

  **3. "The Benevolence Trap" (or "Supererogatory Trap")**
  This captures the normative injustice: the very act of being virtuous creates the conditions for future punishment (resentment) if that virtue ceases.

  **4. "Moral Estoppel"**
  Borrowed from law (*promissory estoppel*). In law, if I let you rely on my promise to your detriment, I am estopped (prevented) from going back on it. In your scenario, the group feels you are **morally estopped** from stopping, because they have organized their expectations around your continuity.

  ### 4. Why This Is Philosophically Interesting

  The reason this phenomenon feels "weird" to you is that it violates a core principle of liberal morality: **The Principle of Non-Encumbrance.**

  In standard ethics, doing *more* than your duty should never *increase* your duty. If I save a drowning child today, I am not obligated to save a drowning child tomorrow. If repeated supererogation creates obligation, it effectively **penalizes virtue**. It creates a system where the most moral person is the most enslaved by expectations.

  This is sometimes discussed in **Non-Ideal Theory** under the header of **"Exploitation of the Virtuous."** The group is effectively free-riding on your moral surplus, and when you try to reclaim your moral liberty, they frame it as a breach of contract.

  ### Summary
  *   **Does it have a name?** No single canonical term.
  *   **Best Technical Description:** Agent-Relative Obligation via Precedent.
  *   **Best Legal Analogue:** Assumption of Duty / Detrimental Reliance.
  *   **Best Psychological Mechanism:** Hedonic Adaptation leading to Psychological Entitlement.
  *   **The Core Injustice:** It converts optional generosity into a binding tax on the virtuous, creating a **moral lock-in** where stopping is punished more severely than never starting.

  If you are writing about this, **"The Supererogatory Trap"** or **"Moral Lock-In"** are the most evocative and accurate labels for the dynamic.
