  **JOINT STATEMENT ON THE SIDE-EFFECT EFFECT (THE KNOBE EFFECT)**

  **Date:** October 26, 2023
  **Parties:**
  *   **Signatory A:** Proponent of Normative Constitutivism (The view that evaluative considerations partly constitute the folk concept of intentional action).
  *   **Signatory B:** Proponent of Non-Constitutive Explanations (The view that the concept is descriptive/psychological, and asymmetries arise from pragmatics, cognitive bias, or statistical normality).

  **Context:** This statement results from a structured adversarial collaboration intended to clarify the state of the experimental philosophy literature regarding the Side-Effect Effect. While the primary data concerns human agents, this clarification is intended to ground further research into intentionality attribution regarding autonomous systems (e.g., self-driving cars, algorithmic decision-makers).

  ***

  ### I. Points of Agreement (Settled Empirical and Structural Claims)

  The following claims represent the consensus of the signatories based on the extant literature. These are treated as background constraints for any viable theory.

  1.  **Robustness of the Phenomenon:** The asymmetry in intentionality judgments between harmful and helpful side effects (the "Knobe Effect") is a robust, replicable empirical finding across a wide range of vignette variations and subject pools. It is not a statistical artifact.
  2.  **Insufficiency of Standard Mental States:** The asymmetry cannot be explained solely by differences in the agent's belief, desire, or commitment, as these variables are held constant across the standard "Help" and "Harm" conditions in the classic vignettes.
  3.  **Not Mere Demand Characteristics:** The effect persists even when experimental controls are introduced to mitigate social desirability bias or subjects' assumptions about experimenter expectations.
  4.  **Extension Beyond "Intentionally":** The asymmetry is not unique to the word "intentionally." Parallel asymmetries appear in judgments of *doing* an action, *deciding* to act, and in attributions of praise and blame, suggesting a cluster of related folk-psychological phenomena.
  5.  **Distinction Between Competence and Performance:** Both sides agree that a complete explanation must specify whether the asymmetry arises from the *structure of the concept itself* (Competence/Constitutive) or from *external factors influencing the application of a neutral concept* (Performance/Pragmatic/Cognitive).
  6.  **Relevance to Autonomous Systems:** Preliminary data suggests that ordinary people apply similar intentionality heuristics to autonomous systems as they do to human agents, making the resolution of this debate critical for liability and ethics in AI.

  ***

  ### II. Table of Disagreements (Contested Interpretations)

  The following table outlines the core theoretical divergence. Each position is phrased to be acceptable to its proponent.

  | Feature of the Debate | **Position A: Normative Constitutivism** | **Position B: Non-Constitutive Explanations** |
  | :--- | :--- | :--- |
  | **Nature of the Concept** | The folk concept of intentional action is *partly moral*. To judge an action as "intentional" is, in part, to make a normative verdict about the agent's relationship to the outcome. | The folk concept of intentional action is *purely descriptive/psychological*. It tracks mental states (belief, desire, control) and is conceptually distinct from moral evaluation. |
  | **Source of Asymmetry** | The asymmetry exists because the *conditions for applying the concept* change based on the moral valence of the outcome. Badness lowers the threshold for intentionality; goodness raises it. | The asymmetry exists because moral valence *biases the processing* of information. The concept is neutral, but moral heuristics, conversational norms, or statistical expectations distort the judgment. |
  | **Role of Norms** | Moral norms are *constitutive*. You cannot fully understand the concept without understanding its moral dimension. | Norms (moral or statistical) are *extrinsic inputs*. They influence the judgment process but are not part of the definition of intentionality. |
  | **Implication for AI** | If an AI causes harm, users will attribute intentionality because the concept itself demands a moral target. Blaming the AI is conceptually coherent to the folk. | If an AI causes harm, users attribute intentionality due to a category error or anthropomorphic bias. The AI lacks the mental states required by the true (neutral) concept. |

  ***

  ### III. Cruxes (Pivot Points for Theoretical Resolution)

  The signatories identify the following sub-questions as critical. Resolution of these points would significantly increase the plausibility of one account over the other.

  **Crux 1: The Non-Moral Norm Test**
  Does the asymmetry persist when the side effect violates a non-moral norm (e.g., etiquette, technical protocol, or club rules) but carries no moral weight?
  *   *Why it matters:* If the effect appears with purely conventional norms, it suggests "Normality" (Position B) rather than "Morality" (Position A) is the driver.

  **Crux 2: The "Good Harm" Reversal**
  If an agent brings about a harmful side effect that is *morally desirable* (e.g., harming a known villain to save others, where the harm itself is the goal of a third party), does the intentionality attribution track the *harm* or the *moral value*?
  *   *Why it matters:* Position A predicts intentionality tracks moral blameworthiness. Position B predicts intentionality tracks the negative valence of the outcome itself.

  **Crux 3: Developmental and Neural Dissociation**
  Do children exhibit the asymmetry before they possess full moral competence? Do neural correlates of intentionality judgments overlap perfectly with moral judgment centers?
  *   *Why it matters:* If intentionality judgments precede moral competence developmentally, or dissociate neurally, it suggests the concepts are distinct (Position B).

  ***

  ### IV. Evidence, Arguments, and Pre-Registered Predictions

  For each Crux, the signatories specify the evidence they would accept as relevant and record their predictions in advance.

  | Crux | Acceptable Evidence / Experimental Design | **Prediction (Signatory A: Normative)** | **Prediction (Signatory B: Non-Constitutive)** |
  | :--- | :--- | :--- | :--- |
  | **1. Non-Moral Norm Test** | Vignettes where a Chairman violates a corporate dress code or technical safety protocol (non-moral) vs. follows it. Measure intentionality of the violation. | **Null or Weak Effect.** The asymmetry is specifically tied to *moral* evaluation, not rule-breaking per se. If the rule isn't moral, the concept of "intentional" reverts to neutral mental states. | **Strong Effect.** The asymmetry is driven by *deviance from the norm* (statistical or prescriptive). Any salient norm violation should trigger the "intentional" label regardless of moral content. |
  | **2. "Good Harm" Reversal** | Vignette: Agent harms a "bad" target as a side effect. Subjects are primed to view the harm as morally positive (justice served). | **Intentionality drops.** If the outcome is morally good, subjects will judge it as unintentional, even if it is "harmful" in a physical sense. Moral valence trumps physical description. | **Intentionality remains high.** The concept tracks the *negative nature* of the side effect (harm/pain). If the physical outcome is harmful, the asymmetry persists regardless of the broader moral context. |
  | **3. Developmental/Neural** | fMRI studies comparing intentionality vs. moral judgment tasks; or studies with children aged 3-5. | **High Overlap / Co-development.** Brain regions for intentionality and morality should overlap significantly. Children should show the asymmetry only after acquiring moral norms. | **Dissociation / Early Onset.** Intentionality processing should distinct from moral processing. Children may show the asymmetry based on simple reward/punishment conditioning before understanding moral norms. |

  ***

  ### V. Statement on Uncertainty

  The signatories acknowledge that current data regarding **Crux 1** is mixed. Some studies suggest non-moral norms trigger the effect (supporting B), while others suggest the effect is attenuated without moral content (supporting A). Similarly, cross-cultural data indicates the asymmetry is widespread but varies in magnitude, suggesting both universal cognitive structures and cultural normative inputs are at play.

  Neither side claims the current evidence is decisive. This statement serves to demarcate the boundary between established data and theoretical interpretation, ensuring that future research on autonomous systems distinguishes between *how people actually judge* (the empirical reality of the Knobe Effect) and *how they ought to judge* (the normative implications for AI liability).

  **Signed,**

  _________________________
  *Representative, Normative Constitutivism*

  _________________________
  *Representative, Non-Constitutive Explanations*
