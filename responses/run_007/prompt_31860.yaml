answer: |-
  **Setting:** *The hotel bar of the Grand Hyatt, 11:30 PM. The noise of the philosophy conference has thinned out. Elena (Moral Cognitivist) is nursing a gin and tonic, reviewing her notes. Marcus (Expressivist) approaches with a whiskey.*

  **Marcus:** Tough crowd this afternoon, Elena. Though I thought you handled the Q&A well. You really drove the Frege-Geach nail in hard.

  **Elena:** (Looks up, smiling tiredly) Marcus. Thanks. I figured you'd be the one to come hunt me down. You've spent the last decade defending Blackburn and Gibbard. I assume you think my "fatal blow" was a bit premature?

  **Marcus:** I think you framed it as a dilemma: either expressivism explains logical embedding and collapses into cognitivism, or it preserves the nature of moral judgment and fails to explain logic. But that assumes logic *requires* truth-conditions in the way you think it does.

  **Elena:** It's not an assumption; it's a constraint of validity. Look, let's run the classic Modus Ponens.
  (1) If lying is wrong, then getting your brother to lie is wrong.
  (2) Lying is wrong.
  (3) Therefore, getting your brother to lie is wrong.
  This is a valid argument. The validity depends on the form. The phrase "lying is wrong" appears in the antecedent of (1) and as the standalone premise (2). For the argument to be valid, "lying is wrong" must mean the same thing in both places.

  **Marcus:** Agreed. No equivocation.

  **Elena:** But in (2), as an expressivist, you say "lying is wrong" expresses a con-attitude. It's like saying "Boo, lying!" But in (1), I'm not booing lying. I'm hypothesizing. I might not even believe lying is wrong. So, in (1), the sentence isn't expressing an attitude. It's functioning as a proposition with a truth value. You can't have it both ways. If it expresses an attitude in (2) but not (1), you've committed the fallacy of equivocation, and the argument is invalid.

  **Marcus:** Okay, but that assumes the only way to secure validity is through truth-conditions of propositions. My move is to say that logical operators don't just map propositions to propositions; they map *attitudes* to *complex attitudes*.

  **Elena:** Go on.

  **Marcus:** When I accept (1), "If lying is wrong, then getting your brother to lie is wrong," I'm not stating a fact about the world. I'm expressing a higher-order attitude. I'm expressing a commitment that my attitude toward lying *inconsistently coexists* with a lack of attitude toward getting my brother to lie. To accept the conditional is to rule out a specific combination of attitudes.

  **Elena:** So validity isn't truth-preservation?

  **Marcus:** It's *attitude-consistency*. If I accept (1) and I accept (2), I am logically committed to (3). If I deny (3), I haven't contradicted a fact; I've fractured my own normative psychology. I'm in a state of practical inconsistency. Gibbard calls it "plan inconsistency." I'm planning to disapprove of lying, and planning to disapprove of conditionalizing that disapproval, but failing to plan to disapprove of the consequence.

  **Elena:** Here's where I press you, Marcus. You've just defined a formal structure for attitudes that behaves *exactly* like a formal structure for propositions. You have a set of objects (attitudes), operators (conditionals), and a relation (consistency/validity) that mirrors truth-preservation.
  If your "logic of attitudes" is isomorphic to classical logic, haven't you just reinvented the proposition? You've built a shadow ontology of "normative facts" out of attitudes. If it walks like a duck and quacks like a duck, why insist it's a dog?

  **Marcus:** Because the *explanation* of what's happening is fundamentally different. For you, the reason I shouldn't accept (1) and (2) and deny (3) is that I would be believing something false. The error is representational. For me, the error is *practical*. It's a failure of agency.
  To answer your "shadow ontology" charge: I'm a quasi-realist. I grant that moral sentences *act* as if they express propositions. We can say they are "true" or "false." We can say the argument is "valid." I earn the right to use that vocabulary. But I don't buy the metaphysical baggage that there exists a *fact of the matter* independent of human sensibility that makes "lying is wrong" true.

  **Elena:** But that's the rub. If you earn the right to say moral sentences are truth-apt, and you grant that they embed in logic just like descriptive sentences, what work is "expressivism" doing?
  If I say, "Moral sentences express beliefs about normative facts," and you say, "Moral sentences express attitudes which function logically exactly like beliefs about normative facts," the semantic output is identical. The only difference is your insistence on a psychological genesis.
  Isn't that just a notational variant? You're a cognitivist who likes to talk about psychology more than metaphysics.

  **Marcus:** It's not notational if the direction of fit is different.
  Cognitivism says the mind aims to match the world. If the world changes, the belief changes.
  Expressivism says the world (normatively) is projected by the mind. If our attitudes change, the "truth" changes.
  If I'm a notational variant of you, then you should be able to point to a moral fact that exists even if no sentient being ever had a reaction to it. Can you do that?

  **Elena:** I don't need a fact that exists without sentient beings. I need a fact that is *truth-apt*.
  Here is my concession: I will grant that your logic of attitudes can formally replicate validity. I'll grant you can define a "negation" of an attitude.
  But here is what I need from you: If your system allows for moral sentences to be true, false, valid, and inconsistent, you must admit that "truth" in your system isn't just a deflationary device.
  If you say, "'Lying is wrong' is true," and you mean that by standard logical rules, then you are committed to the existence of a truth-maker. If you refuse to specify a truth-maker, you're treating logic as a game without ontology. But logic *tracks* ontology.

  **Marcus:** And there we have the stalemate. You think logic tracks ontology. I think logic tracks *commitment*.
  For me, "truth" is a device for endorsing statements. To say "'Lying is wrong' is true" is just to say "I endorse the attitude that lying is wrong." It doesn't posit a ghostly object.
  So, to answer your challenge: Yes, my view looks like cognitivism from the outside. That's the success of quasi-realism! We talk like realists because that's how the language works. But the *analysis* of that talk remains non-cognitive.

  **Elena:** But if the analysis doesn't change the practice, and doesn't change the logic, does it matter?
  Suppose I meet you halfway. I admit that moral facts are sui generis, not natural properties. They are normative properties. They supervene on natural facts but aren't reducible to them.
  If I do that, does your expressivism gain anything? Or does it just become a story about how we *access* those facts (via sentiment rather than perception)?

  **Marcus:** It matters because it dissolves the epistemological mystery.
  If you have moral facts, you have to explain how we know them. Moral perception? Intuition? It always feels spooky.
  If I have moral attitudes, I know them because I *have* them. The "authority" of morality comes from its grip on our will, not its correspondence to a platonic realm.
  So, for my view to prevail, you don't need to give up "truth." You need to give up the idea that truth requires *representation*.

  **Elena:** And for my view to prevail?

  **Marcus:** You'd need me to admit that there's a fact of the matter that holds even if everyone's attitudes changed.

  **Elena:** Precisely. If you admit that "Lying is wrong" could be true even if every human being approved of lying, you're a cognitivist. If you deny that, you're an expressivist.
  But here's the trap: If you deny that, you risk making morality arbitrary. If it's just about *our* attitudes, what happens when our attitudes are evil?
  If the Nazis had won and everyone approved of genocide, would "Genocide is wrong" be false in your system?

  **Marcus:** (Pauses, takes a sip) In a strict expressivist sense: If everyone genuinely, stably approved, there would be no normative standpoint from which to call it wrong. But that's not a bug; it's a recognition that morality is a human practice.
  However, as a quasi-realist, I can say: "Even if they approved, they would be wrong." Because I'm expressing *my* current attitude which rejects theirs. I don't need a God's-eye view to condemn them. I just need my conviction.

  **Elena:** But that makes the condemnation a clash of preferences, not a correction of error.
  Okay, let's clarify the concession.
  For me to accept your view, I must concede that logic does not require truth-conditions grounded in mind-independent reality. I must accept that validity is merely coherence of psychological states.

  **Marcus:** And for you to win?

  **Elena:** You must concede that if your "attitude logic" is robust enough to handle Modus Ponens, negation, and embedding without loss of meaning, then you are functionally committed to propositions. You can call them "normative attitudes" all you want, but if they obey the law of excluded middle and support counterfactuals, they are propositions.
  If you admit that, you admit that expressivism is just a psychological gloss on cognitivism, not a rival semantic theory.

  **Marcus:** (Smiles) So, the deadlock is metaphysical.
  I'm willing to say: "It looks like propositions, it acts like propositions, but it's made of attitudes."
  You're willing to say: "If it acts like propositions, it *is* propositions, regardless of the psychological substrate."

  **Elena:** Exactly. You think the substrate determines the category. I think the functional role determines the category.

  **Marcus:** Then I suppose we won't resolve this tonight. But I will say this: If I can get through the rest of the conference without anyone asking me how I "detect" moral facts, I'll count that as a win for expressivism.

  **Elena:** (Laughs) And if I can get through without anyone asking me if moral facts are "queer" in Mackie's sense, I'll count it as a win for cognitivism.

  **Marcus:** Cheers to that.

  **Elena:** Cheers.

  *(They clink glasses. The conversation shifts to the quality of the coffee at the breakfast session, leaving the metaphysics of morality suspended in the air between them.)*
