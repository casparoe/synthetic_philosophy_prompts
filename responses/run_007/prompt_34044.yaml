answer: |-
  This is a specification document for a theory of neural representation. It is drafted to meet the standards of experimental science: operational definitions, falsifiable constraints, and clear distinctions between observation and inference.

  ### Part I: The Desiderata (Specification Requirements)

  An adequate theory of representation in neural networks must satisfy the following five requirements.

  **1. Vehicle Specification (The "Where")**
  *   **Requirement:** The theory must identify the specific mathematical structure that constitutes the vehicle of representation. It cannot default to "the activation vector" generally. It must specify whether the vehicle is a single neuron, a linear subspace, a manifold, or a sparse combination of directions.
  *   **Case:** Polysemanticity demonstrates that single neurons are insufficient vehicles. A theory that identifies representations with neurons is empirically falsified. The theory must explain how a vehicle can encode multiple features without conflating them.
  *   **Status:** **Non-Negotiable.** Without identifying the vehicle, claims about representation are untestable.

  **2. Causal Efficacy (The "Use")**
  *   **Requirement:** The theory must provide a criterion to distinguish features the model *uses* to compute outputs from features that are merely *recoverable* from the activation state. Presence of information (mutual information) is insufficient; the feature must play a role in the input-output map.
  *   **Case:** Linear probes can recover "camera brand" from image classifiers that do not use camera brand to classify objects. A theory that counts recoverable information as representation falsely inflates the model's semantic content.
  *   **Status:** **Non-Negotiable.** This is the core distinction between a memory dump and a computational state.

  **3. Content Grounding (The "What")**
  *   **Requirement:** The theory must explain what fixes the content of a representation without relying exclusively on human labeling. It must account for why a direction represents "cat" rather than "furry texture" or "activation pattern #402."
  *   **Case:** Models compute with features alien to human ontology (e.g., specific Fourier modes or spurious correlations). A theory that requires all representations to match human concepts fails to describe the model's actual operation. Conversely, a theory that allows *any* labeling is vacuous.
  *   **Status:** **Non-Negotiable.** Without content grounding, "representation" reduces to "coordinate system."

  **4. Decomposition Stability (The "Basis")**
  *   **Requirement:** The theory must specify the conditions under which a decomposition of activation space into features is unique or stable. It must address whether there is a "correct" basis or if representations are basis-relative.
  *   **Case:** Superposition implies features are non-orthogonal. Rotating the activation space preserves input-output behavior but changes the "features" in a naive view. The theory must explain why one decomposition (e.g., from a Sparse Autoencoder) is preferred over another.
  *   **Status:** **Camp Preference.** (See Part IV). Realists demand a canonical basis; Instrumentalists accept multiple valid decompositions.

  **5. Interventional Robustness (The "Test")**
  *   **Requirement:** The theory must define the validity conditions for causal interventions (patching, ablations). It must specify how to handle the distribution shift caused by intervening on internal states.
  *   **Case:** Activation patching pushes the model off its native data manifold. If a feature is only causal when artificially isolated, is it a genuine representation? The theory must distinguish between *structural capacity* and *operational use*.
  *   **Status:** **Non-Negotiable.** A theory without a testing protocol is metaphysics, not science.

  ---

  ### Part II: Forbidden Collapses (Distinctions)

  An adequate theory must not collapse the following distinctions. Doing so renders the theory incapable of resolving the dispute.

  1.  **Representation vs. Information-Theoretic Encodability:**
      *   *Distinction:* Information is about correlation (mutual information between activation and input). Representation is about functional role (the activation is used to mediate behavior).
      *   *Reason:* A model can encode the parity of the input pixels without using it to solve the task. Collapsing this validates the "Projection" view (everything is representable) and kills the "Realist" view (only specific things are represented).

  2.  **Vehicle vs. Content:**
      *   *Distinction:* The vehicle is the physical/mathematical state (the vector direction). The content is what that state stands for (e.g., "dog").
      *   *Reason:* Confusing these leads to the error of thinking that finding a direction *is* finding a concept. We need to explain the mapping relation.

  3.  **Distinguishability vs. Usage:**
      *   *Distinction:* The model may be capable of distinguishing two inputs (they map to different activations) without using that distinction to drive output differences.
      *   *Reason:* This is the "Recoverability versus Use" problem. Collapsing them makes every linear probe result a representation claim.

  4.  **Features vs. Circuits:**
      *   *Distinction:* Features are the representational states (the data). Circuits are the mechanisms that process them (the code).
      *   *Reason:* A theory of representation must explain the *terms* of the computation, not just the *flow* of the computation. Confusing them reduces representation to connectivity graphs.

  ---

  ### Part III: Empirical Constraints (The Data)

  The theory must be consistent with the following established empirical results. Ruling these out by fiat disqualifies the theory.

  1.  **Superposition is Ubiquitous:** Features outnumber dimensions in both toy and large models. The theory cannot require orthogonality or one-to-one neuron mapping.
  2.  **Linear Probes Succeed:** Interpretable features are linearly decodable from many layers. The theory cannot claim representations are inherently non-linear or inaccessible, though it must explain why decodability $\neq$ usage.
  3.  **SAEs Find Causal Features:** Sparse Autoencoders (SAEs) find directions that, when patched, alter model behavior in semantically predictable ways. The theory must accommodate distributed, sparse features as valid vehicles.
  4.  **Spurious/Alien Computation:** Models rely on features humans find irrelevant (e.g., background texture, watermarks). The theory must allow for representations that do not align with human ground truth.

  ---

  ### Part IV: Status of Requirements and Incompatibilities

  Here we separate the scientific necessities from the philosophical preferences and identify the trade-offs.

  #### 1. Non-Negotiable Requirements
  *   **Vehicle Specification:** You cannot test what you cannot define.
  *   **Causal Efficacy:** Without this, you cannot distinguish a representation from a byproduct.
  *   **Content Grounding:** Without this, you cannot distinguish a representation from a random vector.
  *   **Interventional Robustness:** Without this, you have no empirical verification method.

  #### 2. Camp-Specific Preferences
  *   **Decomposition Stability (Canonical Basis):**
      *   *Realist Preference:* There is one "true" set of features the model computes.
      *   *Instrumentalist Preference:* Features are relative to the decomposition method (SAE vs. PCA vs. Probe); multiple valid descriptions exist.
      *   *Verdict:* **Preference.** Given superposition and the geometry of high-dimensional space, demanding a single canonical basis is likely mathematically unfounded. The theory should allow for *equivalence classes* of feature sets rather than a unique set.
  *   **Human Interpretability:**
      *   *Realist Preference:* Features should map to human concepts (e.g., "dog").
      *   *Deflationist Preference:* Features are just mathematical directions; "dog" is a human label.
      *   *Verdict:* **Preference.** The theory must allow for alien features. Demanding human interpretability biases the science toward what we understand, not what the model does.

  #### 3. The Conflicts (Trade-offs)

  You suspected conflicts between Causal Validation and Native Computation, and between Canonical Decomposition and Superposition. **These conflicts are real.**

  **Conflict A: The Interventionist Dilemma (Causal Validation vs. Native Computation)**
  *   **The Tension:** To prove a feature is *used* (Causal Efficacy), we must intervene (patch/ablate). But intervention pushes the model off its native data distribution. If the feature is only causal under intervention, was it really a representation during normal inference?
  *   **Resolution:** You cannot satisfy "Strict Causal Proof" and "Perfect Ecological Validity" simultaneously.
  *   **Recommendation:** **Weaken the Causal Requirement.** Move from "Necessary Causal Condition" to "Causal Sensitivity." A representation is valid if minimal interventions produce predictable changes *within a bounded tolerance* of the native distribution. We must accept probabilistic causal evidence rather than deterministic proof.

  **Conflict B: The Basis Dilemma (Canonical Decomposition vs. Superposition)**
  *   **The Tension:** Realists want a single list of features. Superposition implies features are non-orthogonal and overlapping. Mathematically, there are infinite ways to decompose a vector space into non-orthogonal directions.
  *   **Resolution:** You cannot have a Unique Canonical Basis and accommodate Superposition.
  *   **Recommendation:** **Give up the Canonical Picture.** Accept that representations are *basis-relative but constrained*. The constraint is not uniqueness, but **sparsity and causal stability**. If multiple decompositions yield sparse, causally stable features, they are equally valid. The theory must shift from "What are the features?" to "What properties must a feature set have to be valid?"

  ---

  ### Part V: The Killer Requirement and Scorecard

  #### The Killer Requirement
  **Causal Efficacy combined with Content Grounding.**

  This joint requirement does the most work in excluding popular positions.
  *   It excludes **Unit-Level Realism** (neurons are rarely causally specific to one concept).
  *   It excludes **Pure Instrumentalism** (which denies internal causal structure matters, focusing only on input-output prediction).
  *   It excludes **Deflationism** (which denies content exists at all).
  *   It forces **Distributed Realism** to evolve into **Causal-Structural Realism**.

  #### Scorecard of Popular Positions

  | Position | Vehicle Specification | Causal Efficacy | Content Grounding | Decomposition Stability | Verdict |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Unit-Level Realism**<br>(Representations = Neurons) | **FAIL.**<br>Cannot handle polysemanticity. | **FAIL.**<br>Ablating single neurons often has no effect due to redundancy. | **PASS.**<br>Easy to label neurons. | **PASS.**<br>Neurons are a canonical basis. | **Falsified.**<br>Empirically incompatible with superposition. |
  | **Distributed Realism**<br>(Representations = Subspaces) | **PASS.**<br>Accommodates superposition. | **PARTIAL.**<br>Struggles to prove specific subspaces are *used* vs. incidental. | **PARTIAL.**<br>Relies heavily on human labeling of directions. | **FAIL.**<br>Often assumes a canonical basis exists. | **Viable but Incomplete.**<br>Needs causal refinement. |
  | **Instrumentalism**<br>(Representations = Useful Fictions) | **PASS.**<br>Vehicle is whatever works for prediction. | **FAIL.**<br>Denies internal causal role is relevant to "truth." | **FAIL.**<br>Content is purely assigned by observer. | **PASS.**<br>Accepts multiple decompositions. | **Consistent but Deflationary.**<br>Solves the conflict by denying the ontology. |
  | **Deflationism**<br>(No Representations, Only Math) | **PASS.**<br>Vectors are just vectors. | **N/A.**<br>Rejects the category. | **FAIL.**<br>Rejects the category. | **PASS.**<br>Math is unique. | **Unfalsifiable.**<br>Scientifically sterile. |
  | **Causal-Structural Realism**<br>(The Proposed Standard) | **PASS.**<br>Defines vehicles as sparse, causal directions. | **PASS.**<br>Requires intervention evidence (with tolerance). | **PASS.**<br>Grounds content in causal role + input correlation. | **PASS.**<br>Accepts non-unique, stable decompositions. | **Adequate.**<br>Meets all non-negotiable desiderata. |

  ### Summary Recommendation

  To settle the dispute, you must demand a theory that treats representations as **hypotheses about causal structure**, not static objects.

  1.  **Reject the search for a single canonical basis.** Superposition makes this mathematically improbable.
  2.  **Accept "Causal Sensitivity" over "Causal Necessity."** Interventions distort; require that features be robust to *small* interventions, not that they be the *only* way the model works.
  3.  **Demand Sparsity.** The strongest evidence for a "real" feature is that it can be isolated (via SAE or similar) and manipulated without collapsing the rest of the computation.

  The dispute between "Recovery" and "Projection" dissolves if you define representation as **a sparse direction in activation space that supports counterfactual interventions with semantically consistent outcomes.** This excludes mere information (which doesn't support intervention) and mere projection (which doesn't support consistent intervention). It leaves you with the causal machinery of the network.
