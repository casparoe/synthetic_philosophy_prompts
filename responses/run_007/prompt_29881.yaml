prompt: |-
  I'm on my city's long-range planning and ethics board, and we've got a new proposal to vote on. Our past decisions: we rejected a chemical plant because it would raise asthma rates in a nearby town even though it would bring jobs; we rejected a plan to defer maintenance on a dam because a failure decades later could kill the families who live downstream; we approved a buyout program for flood-prone homes because it made future residents safer and current owners were compensated; and we rejected a cheaper refrigerant that would slowly leak and sicken workers and neighbors. The new proposal would lock in a cheaper gas-based energy mix now. It won't hurt anyone alive today, but it will make life noticeably worse for the people living 200 years from now—still worth living, but worse than it would of been under the cleaner alternative. The catch: our analysts say the choice between the two plans will itself change who gets born over those two centuries, so the people who'd live under the cheaper plan wouldn't have existed under the cleaner one. What should we decide if we want to be consistent with ourselves? Which precedent is the closest analog, and if our precedents underdetermine it, what principle are we adopting with each choice?
reasoning: |-
  Here's a thinking process that leads to the suggested recommendation:

  1.  **Analyze the Request:**
      *   **Role:** Member of a city's long-range planning and ethics board.
      *   **Task:** Vote on a new proposal based on consistency with past decisions (precedents).
      *   **New Proposal:** Lock in a cheaper gas-based energy mix now.
          *   *Impact:* No harm to anyone alive today.
          *   *Future Impact:* Makes life noticeably worse for people living 200 years from now (though still worth living).
          *   *Non-Identity Problem:* The choice changes *who* gets born over those two centuries. The people suffering under the gas plan wouldn't exist under the cleaner plan.
      *   **Past Decisions (Precedents):**
          1.  *Rejected Chemical Plant:* Jobs vs. Asthma in nearby town (Harm to existing specific people).
          2.  *Rejected Dam Maintenance Deferral:* Cost savings vs. Catastrophic risk decades later (Harm/death to existing specific future people).
          3.  *Approved Flood Buyout:* Safety for future residents + Compensation for current owners (Win-win/No harm to identifiable victims).
          4.  *Rejected Cheaper Refrigerant:* Cost savings vs. Slow leak sickening workers/neighbors (Harm to existing specific people).
      *   **Questions to Answer:** What should we decide to be consistent? Which precedent is the closest analog? If precedents underdetermine it, what principle is adopted with each choice?

  2.  **Deconstruct the Precedents:**
      *   *Precedent 1 (Chemical Plant):* Harm to *identifiable* existing/near-future people (asthma). Principle: Do not harm specific identifiable people for economic gain.
      *   *Precedent 2 (Dam):* Risk of death to *identifiable* future people (families downstream). Principle: Do not impose catastrophic existential risk on future identifiable people, even if distant.
      *   *Precedent 3 (Flood Buyout):* Benefit to future, compensation to current. No victims. Principle: Mitigate future harm if current stakeholders are made whole.
      *   *Precedent 4 (Refrigerant):* Harm to *identifiable* existing people (workers/neighbors). Principle: Do not expose specific people to slow harm for cost savings.

      *   *Common Thread in Rejections:* All rejections involved harm to *identifiable* or *specific* people (even if in the near future, like the dam families).
      *   *Common Thread in Approval:* No one was left worse off (Pareto improvement-ish).

  3.  **Analyze the New Proposal (The Non-Identity Problem):**
      *   *Scenario:* Gas plan vs. Cleaner plan.
      *   *Victims:* People 200 years from now.
      *   *Identity:* The specific people who will live under the Gas Plan *do not exist* in the Cleaner Plan scenario.
      *   *Harm:* Life is "noticeably worse" but "still worth living."
      *   *Philosophical Core:* This is the classic **Non-Identity Problem** (Parfit).
      *   *The Dilemma:* If we choose the Cleaner Plan, the specific people who would have suffered under the Gas Plan never exist. Therefore, have we harmed them? No, because they don't exist. If we choose the Gas Plan, can they complain? "If you hadn't chosen gas, I wouldn't exist." Since their life is still worth living, they aren't worse off than *non-existence*.
      *   *Conflict with Precedents:* All previous rejections involved making *specific, identifiable* people worse off than they otherwise would have been (counterfactual comparison holds). Here, the counterfactual comparison fails for the individuals.

  4.  **Evaluate Consistency:**
      *   *Argument for Rejection (Consistent with Spirit):* The board consistently prioritizes long-term well-being and safety over short-term cost savings (Dam, Chemical, Refrigerant). The board cares about the *quality of life* of future generations. Even if the identities change, the *aggregate* well-being is lower.
      *   *Argument for Approval (Consistent with Letter):* The board has only rejected proposals where *identifiable* individuals were harmed or killed. In the Dam case, the families downstream were identifiable (or would be). In the Chemical/Refrigerant cases, current workers/neighbors were identifiable. Here, no specific person is made worse off than they would otherwise be (because otherwise they wouldn't be). Therefore, strictly speaking, no "harm" in the individualistic sense used in past cases.

  5.  **Determine the Closest Analog:**
      *   *Dam Maintenance:* This is the closest regarding *time horizon* and *severity*. It involved future people. However, the Dam case involved *death/catastrophe* to people who *would have existed anyway* (the families downstream were presumably already there or would be there regardless of maintenance, the risk was the dam breaking). The Non-Identity aspect is the key differentiator.
      *   *Chemical/Refrigerant:* These involve "making life worse/sickening." This matches the "noticeably worse" outcome. But again, those were identifiable existing people.
      *   *Conclusion:* The Dam precedent is the closest in terms of *intergenerational responsibility*, but the Non-Identity twist makes it philosophically distinct from all four.

  6.  **Develop the Principles (If Underdetermined):**
      *   Since the precedents rely on identifiable victims, and this case lacks them, the precedents technically *underdetermine* the decision.
      *   *Choice A (Reject Gas/Choose Cleaner):* Adopts a **Person-Affecting Restriction Rejection / Impersonal Principle**. We care about the *quality of lives* created, not just whether specific individuals are harmed relative to their own non-existence. Principle: "We must choose the future with higher aggregate well-being, regardless of identity."
      *   *Choice B (Approve Gas):* Adopts a **Strict Person-Affecting Principle**. We only have obligations to specific individuals not to make *them* worse off. If they wouldn't exist otherwise, we haven't harmed them. Principle: "We have no duty to bring better people into existence, only to avoid harming existing/inevitable ones."

  7.  **Synthesize the Recommendation:**
      *   *Acknowledge the Philosophical Trap:* Explicitly name the Non-Identity Problem.
      *   *Assess Precedents:* Point out that all rejections involved identifiable victims. This case does not.
      *   *Determine Consistency:* To be truly consistent with the *spirit* of long-range ethics (protecting the future), the board should Reject the Gas Plan. To be consistent with the *technical logic* of past votes (identifiable harm), they could Approve.
      *   *Best Ethical Path:* Given the role ("Long-Range Planning and *Ethics* Board"), the spirit usually trumps the technicality. The Dam precedent shows a willingness to protect future people even at cost.
      *   *Recommendation:* Reject the gas plan.
      *   *Reasoning:* While the Non-Identity Problem creates a loophole, the board's history shows a commitment to intergenerational equity and avoiding foreseeable degradation of living conditions, regardless of the specific identities involved.
      *   *Principle Articulation:* Clearly state what principle is being adopted if they go either way.

  8.  **Refine the Output:**
      *   Structure: Executive Summary, Precedent Analysis, The Philosophical Hurdle, Recommendation, Principles Adopted.
      *   Tone: Professional, deliberative, ethical, analytical.
      *   Check: Did I answer all parts of the prompt? (Decision, Closest Analog, Principles if underdetermined).

      *(Self-Correction during drafting)*: Wait, I need to be careful about the Dam precedent. Did the maintenance deferral change who was born? Probably not over "decades." The Non-Identity effect usually requires centuries (as stated in the prompt: 200 years). So the Dam precedent *assumes* identity stability. This confirms the precedents underdetermine the case. I need to make sure I highlight that the board is now crossing a threshold from "Person-Affecting" to "Impersonal" ethics.

      *Revised Plan:*
      1.  Identify the Non-Identity Problem.
      2.  Show how past cases are "Person-Affecting."
      3.  Show how this case breaks that mold.
      4.  Argue that to maintain the *purpose* of the board (Long-Range Ethics), they must move beyond Person-Affecting.
      5.  Select the Dam as the closest analog (future people), but note the distinction.
      6.  Define the principles clearly.

  9.  **Final Polish:** Ensure the distinction between "harming someone" and "creating a worse world" is clear. (Parfit's Repugnant Conclusion territory, but keep it practical).

      *Decision:* Reject the gas plan.
      *Why:* Consistency with the *value* placed on future well-being, even if the *logic* of harm shifts.
      *Analog:* Dam (future risk), but distinct.
      *Principles:* Impersonal Total/average utility vs. Strict Person-Affecting.

