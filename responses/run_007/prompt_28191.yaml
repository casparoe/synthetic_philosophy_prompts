  I've been reading about illusionism about consciousness — the view that phenomenal consciousness, the "what it's like" of experience, isn't real. We seem to have it but we don't actually have it. I'm not trying to figure out whether it's true. What I want to know is: if it were true, what would actually change? Like, practically. Would it change how I should treat other people? Animals? Would it change how I think about my own death, or about suffering? I go back and forth between thinking it would upend everything and thinking it would change nothing at all. What are the most important implications — the ones that would genuinly make a difference to how someone lives their life? Keep the response to about 300 words.
