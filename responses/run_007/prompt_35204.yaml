  # Joint Statement on the Status of the Continuum Hypothesis
  **Adversarial Collaboration Workshop on the Foundations of Set Theory**

  **Date:** October 26, 2023
  **Signatories:** Representatives of the Universist Camp (Camp A) and the Multiversist Camp (Camp B)

  ## Preamble
  We, the undersigned representatives of two distinct philosophical orientations toward set theory, have engaged in a good-faith adversarial collaboration. Our goal was not to force a consensus where none exists, but to clarify the mathematical and philosophical landscape regarding the Continuum Hypothesis (CH). We acknowledge that while we share a commitment to the rigorous development of set theory, we diverge on the interpretation of its ontological implications. This document records our points of convergence, our precise points of divergence, and the mathematical developments that we agree would bear on our dispute.

  ## 1. Agreed Claims
  Both camps endorse the following claims as accurate descriptions of the current mathematical and dialectical situation:

  1.  **Formal Independence:** The work of Kurt Gödel (1938) and Paul Cohen (1963) definitively establishes that CH is independent of the Zermelo-Fraenkel axioms with Choice (ZFC). Neither CH nor its negation can be derived from ZFC, assuming ZFC is consistent.
  2.  **Limits of Independence:** Formal independence relative to ZFC does not, by itself, logically entail that CH lacks a determinate truth value (Camp A's view), nor does it entail that CH necessarily lacks a determinate truth value (Camp B's view). The independence result is neutral regarding the metaphysical status of $V$.
  3.  **Legitimacy of Methods:** Both camps acknowledge that the methods proposed by the other are mathematically legitimate. Camp A acknowledges that forcing constructions generate rich, consistent structures worthy of study. Camp B acknowledges that the search for new axioms (e.g., large cardinals, forcing axioms) drives profound mathematical discovery and structural coherence.
  4.  **Criteria for Progress:** Both camps agree that progress in set theory is measured not only by consistency proofs but by *explanatory power*. A successful new axiom or framework should resolve independent statements, unify disparate areas of mathematics, and provide a coherent structure theory for the continuum.
  5.  **Role of Large Cardinals:** Both camps agree that large cardinal axioms are currently the most successful metric for measuring the consistency strength of set-theoretic statements and that they form a well-ordered linear hierarchy. The dispute is not about the utility of large cardinals, but about whether they determine the size of the continuum.
  6.  **Openness to Evidence:** Both camps agree that their positions are defeasible. Camp A would reconsider the uniqueness of $V$ if the search for canonical inner models fails definitively. Camp B would reconsider the indeterminacy of CH if a new axiom emerges that is intrinsically compelling and universally adopted by the mathematical community as "true."

  ## 2. Disagreements Table

  | Issue | Camp A's Position (Universist) | Camp B's Position (Multiversist) | Substantive or Verbal? |
  | :--- | :--- | :--- | :--- |
  | **1. Ontology of $V$** | There is a single, cumulative hierarchy of sets ($V$). All set-theoretic questions have determinate answers relative to this unique background reality. | There is no single absolute universe. There is a multiverse of set-theoretic worlds, all equally real. "The universe" is an indexical term referring to the current model of discourse. | **Substantive** |
  | **2. Truth Value of CH** | CH has a specific truth value (True or False) in $V$, even if ZFC cannot prove it. The goal of set theory is to discover this value via new axioms. | CH has no absolute truth value. It is true in some universes and false in others. Asking "Is CH true?" without specifying a model is semantically incomplete. | **Substantive** |
  | **3. Goal of Axiomatization** | The goal is to find the *correct* axioms that describe $V$. New axioms are discovered, not chosen. | The goal is to explore the *consequences* of different axioms. New axioms are adopted based on utility for specific mathematical contexts. | **Substantive** |
  | **4. Meaning of "Independence"** | CH is independent of ZFC, but not necessarily independent of the concept of "set." It may be settled by clarifying the concept. | CH is independent of the concept of "set" itself, as the concept is inherently flexible and admits multiple precise explications. | **Verbal** |
  | **5. Status of Forcing** | Forcing is a tool to prove consistency and explore consequences, but generic extensions are not necessarily "real" universes in the same sense as $V$. | Forcing creates genuine new universes. There is no metaphysical distinction between the ground model and the generic extension. | **Substantive** |

  ## 3. Cruxes and Tests for Substantive Disagreements

  For the substantive disagreements identified above, we have isolated specific cruxes. Resolving these would significantly shift the weight of evidence toward one camp.

  ### Crux 1: The Success of the Inner Model Program (Ultimate $L$)
  *   **Sub-Question:** Can a canonical inner model be constructed that accommodates all known large cardinals (specifically supercompacts) and satisfies CH?
  *   **Mathematical Development:** The completion of the "Ultimate $L$" program. If a model $L^\Omega$ is constructed that is compatible with all large cardinals and implies CH, it provides a candidate for the "true" $V$.
  *   **Camp A Prediction:** If Ultimate $L$ is successfully constructed, it will be recognized as the unique canonical model. The mathematical community will accept $V = \text{Ultimate } L$, settling CH as True.
  *   **Camp B Prediction:** Even if Ultimate $L$ is constructed, it will be viewed as one interesting inner model among many. Forcing axioms (like $\text{MM}^{++}$) which imply $\neg$CH will remain equally compelling for describing the structure of $H(\omega_2)$.

  ### Crux 2: Consilience of Forcing Axioms
  *   **Sub-Question:** Will Forcing Axioms (e.g., PFA, MM) become the standard background theory for mainstream mathematics outside of logic?
  *   **Mathematical Development:** Widespread adoption of Forcing Axioms in analysis, topology, and algebra as the "default" assumption for solving classification problems, analogous to how ZFC is currently used.
  *   **Camp A Prediction:** Forcing Axioms will remain specialized tools. They will not be accepted as foundational truths because they restrict the universe (e.g., by ruling out certain large cardinals or $L$-like structures).
  *   **Camp B Prediction:** Forcing Axioms will prove so fruitful in resolving classical mathematical problems that they will become the de facto standard, demonstrating that $\neg$CH is the "natural" state for mathematics.

  ### Crux 3: Uniqueness of the Large Cardinal Hierarchy
  *   **Sub-Question:** Is the linear ordering of large cardinals evidence of a single universe, or compatible with a multiverse?
  *   **Mathematical Development:** Discovery of natural set-theoretic statements that are independent of ZFC + Large Cardinals but are decided differently by equally "natural" extensions.
  *   **Camp A Prediction:** As we ascend the large cardinal hierarchy, the theory of $V$ will become more rigid and deterministic, eventually fixing the continuum.
  *   **Camp B Prediction:** The large cardinal hierarchy organizes consistency strength, not truth. We will find that for any large cardinal axiom, there are equally natural forcing extensions that preserve the large cardinal but alter the continuum.

  ## 4. Assessment of Verbal Disputes
  We explicitly identify the following portion of our dispute as **merely verbal**:

  *   **The Definition of "Independence":** When Camp A says "CH is not independent of the concept of set," they mean "The concept of set entails a specific fact of the matter." When Camp B says "CH is independent of the concept of set," they mean "The concept of set is underdetermined."
  *   **Explanation:** Both camps agree on the mathematical facts (ZFC does not decide CH). The disagreement lies in whether the word "independence" applies only to formal systems (ZFC) or to the semantic concept ("set"). If Camp A uses "independent" to mean "formally undecidable" and Camp B uses it to mean "metaphysically indeterminate," they are talking past each other. We agree to reserve "independent" for formal undecidability in ZFC and use "indeterminate" for the metaphysical claim.

