answer: |-
  Never abolish a legacy rule until you can name the specific harm it prevents and verify that either the harm is impossible today or a safer control has already taken its place.

  ### The Fence-Testing Procedure

  **Time Budget:** 60 Minutes per rule.
  **Inputs:** The rule text, incident reports (last 3 years), staff complaints, current workflow maps.
  **Outputs:** Recommendation (Keep, Remove, Modify, Escalate).

  **Step 1: Harm Identification (15 Minutes)**
  *   **Action:** Interview one senior staff member and review incident logs to answer: "What specific bad thing happens if this rule is ignored?"
  *   **If the original reason is unknown:** Infer the harm from the rule's structure (e.g., two signatures = fraud prevention or error catching; waiting periods = cooling off).
  *   **Sufficient Answer:** A concrete statement of harm (e.g., "Patient receives wrong dose," "Drug diversion goes undetected," "Hospital loses lawsuit").
  *   **Stop Condition (Yes-and-Remove):** If no plausible harm can be identified even by inference, recommend **Remove**.
  *   **Stop Condition (Hand-off):** If the harm is purely moral or religious without safety/legal impact, move to **Step 5**.

  **Step 2: Persistence Check (15 Minutes)**
  *   **Action:** Determine if the identified harm is still possible in the current environment.
  *   **Check:** Have technology, laws, or physical layouts changed to make the harm impossible? (e.g., Paper records lost vs. Electronic audit trails).
  *   **Sufficient Answer:** Evidence that the risk vector still exists or is obsolete.
  *   **Stop Condition (Yes-and-Remove):** If the harm is impossible due to systemic changes, recommend **Remove**.
  *   **Stop Condition (No/Keep):** If the harm is frequent and severe, recommend **Keep** (unless Step 3 finds a substitute).

  **Step 3: Substitute Control Audit (15 Minutes)**
  *   **Action:** Map current workflows to see if another rule, technology, or culture norm already prevents the harm.
  *   **Check:** Is the legacy rule the *only* barrier, or is it redundant? If redundant, is the redundancy necessary (defense-in-depth) or wasteful?
  *   **Sufficient Answer:** Confirmation of overlapping controls.
  *   **Stop Condition (Yes-and-Remove):** If a superior or equal control exists and the legacy rule adds only friction, recommend **Remove** or **Modify**.
  *   **Stop Condition (No/Keep):** If the legacy rule is the primary or only barrier, recommend **Keep**.

  **Step 4: Silent Function Scan (10 Minutes)**
  *   **Action:** Ask: "Does this rule serve a purpose nobody talks about?"
  *   **Check for Load-Bearing Friction:** Does the delay create a necessary pause? Does the double-signature shift liability or force collaboration? Is the cost of the rule cheap compared to the cost of the risk?
  *   **Sufficient Answer:** Identification of a secondary function (e.g., "The paperwork slows down the process enough to prevent impulse errors").
  *   **Stop Condition (No/Keep):** If the rule is costly but load-bearing (removing it collapses a safety culture or legal shield), recommend **Keep**.
  *   **Stop Condition (Hand-off):** If the silent function is ethical or cultural rather than factual, move to **Step 5**.

  **Step 5: Values & Escalation (5 Minutes)**
  *   **Action:** Determine if the decision rests on facts or values.
  *   **Check:** Is the conflict about safety efficiency (fact) or rights/appropriateness (value)?
  *   **Stop Condition (Hand-off):** If the rule involves religious, ethical, or political values where no factual "harm" dominates, recommend **Escalate to COO/Legal/Ethics Committee**. Do not decide here.

  ***

  ### Worked Cases

  **Case 1: Two-Nurse Read-Back for High-Risk Meds**
  *   **Proposal:** Nurses say it's redundant; one signature should suffice with electronic scanning.
  *   **Step 1 (Harm):** Prevents administration of wrong drug/dose. Harm is death or severe injury.
  *   **Step 2 (Persistence):** Harm persists; humans still scan wrong bags or override alerts.
  *   **Step 3 (Substitutes):** Electronic scanning exists, but overrides are common. The second nurse is the only independent check.
  *   **Step 4 (Silent Function):** The rule forces a "psychological pause." It shifts liability from one individual to a pair, reducing fear of reporting near-misses. It is load-bearing for the culture of safety.
  *   **Step 5 (Values):** Safety vs. Efficiency. Fact-driven.
  *   **Recommendation:** **Keep.**
  *   **Note:** The team will not like this. The nurses are vocal, the friction is high, and the team wants to clear the backlog. However, the procedure shows the redundancy is the feature, not the bug. Removing it increases single-point failure risk.

  **Case 2: Controlled-Substance Waste (Paper + Electronic)**
  *   **Proposal:** Remove paper log; electronic system records waste with biometric auth.
  *   **Step 1 (Harm):** Drug diversion/theft.
  *   **Step 2 (Persistence):** Harm persists, but method of prevention has changed.
  *   **Step 3 (Substitutes):** Electronic system has immutable audit trails, biometric login, and real-time inventory tracking. Paper log is manually filled and easily falsified.
  *   **Step 4 (Silent Function):** Paper log previously served as a physical chain of custody. Now it serves only as a redundant data entry point that increases nursing time away from patients. No load-bearing function found.
  *   **Step 5 (Values):** Efficiency vs. Caution. Fact-driven.
  *   **Recommendation:** **Remove Paper Requirement.**
  *   **Note:** Clear win. Electronic control is superior. Paper is legacy friction without added safety.

  **Case 3: Chaplain Consult Before Restraint Reduction (Psych Hold)**
  *   **Proposal:** Staff say requiring a chaplain offer is religiously coercive and delays care.
  *   **Step 1 (Harm):** Original harm unclear. Inferred: Legal liability for premature restraint removal leading to patient harm or suicide.
  *   **Step 2 (Persistence):** Liability risk persists.
  *   **Step 3 (Substitutes):** Clinical assessment by psychiatry exists. Chaplain is not a clinical role.
  *   **Step 4 (Silent Function):** The chaplain acts as a neutral third-party witness that the patient's non-clinical needs were addressed before liberty was restored. It is a legal shield disguised as care.
  *   **Step 5 (Values):** **Hand-off.** This is not a safety fact; it is a question of religious freedom vs. institutional risk tolerance.
  *   **Recommendation:** **Escalate to Ethics/Legal.**
  *   **Note:** The procedure cannot solve this. It identifies that the rule is not clinically load-bearing but legally load-bearing. The team must pass this to someone with authority to weigh civil rights against lawsuit risk.

  ***

  ### Limitations and Confidence

  **What this procedure cannot do:** It cannot predict black swan events where a removed rule becomes critical due to a rare system failure. It cannot resolve conflicts where safety demands friction that violates patient rights (Case 3); it can only flag them. It relies on honest input from staff; if staff hide the real reason they like a rule (e.g., it gives them power), the procedure will fail.

  **Confidence Level:** I am 85% confident in this translation from Burke/Chesterton to a checklist. It successfully moves the discussion from "this is old" to "what does this do?" without requiring historical archives.

  **Least Sure Point:** I am least sure about **Step 4 (Silent Function Scan)**. Identifying "load-bearing friction" requires intuition about organizational culture that a junior team might lack. It is easy to mistake a useless rule for a subtle cultural safeguard, or vice versa, without deep institutional memory.
