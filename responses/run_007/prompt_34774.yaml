      *   **Goal:** Create an "Adversarial Collaboration Document."
      *   **Requirements:**
          1.  Numbered "Agreed Claims" section (substantive, not mush).
          2.  Disagreements Table (Point, Maria's View, Dave's View, The Crux).
          3.  Evidence/Test for each Crux (Agreed evidence + Predictions).
          4.  **Constraint:** Distinguish between settled scholarly/empirical consensus and contested areas (avoid presenting fringe readings as consensus).
      *   **Tone:** Neutral, facilitative, precise, philosophical but accessible.

  2.  **Deconstruct the Philosophical/Psychological Landscape:**
      *   *Sartre's Actual Views (Consensus Reading):* Radical freedom (ontological), facticity (constraints exist but don't determine choice), bad faith (lying to oneself to escape freedom/responsibility), consciousness (no fixed self/ego). *Note:* Scholars agree Sartre posits ontological freedom, but debate whether he ignores empirical constraints.
      *   *Psychological View (Consensus):* Cognitive biases exist, unconscious processes influence behavior, biology/environment constrain options. *Note:* Psychology generally rejects "radical freedom" in the metaphysical sense but acknowledges agency.
      *   *The Conflict:* Ontological freedom (Maria) vs. Empirical/Causal determination (Dave). The "Bad Faith" vs. "Cognitive Bias" distinction is key.

  3.  **Drafting Section 1: Agreed Claims:**
      *   Need claims both can accept without betraying their core positions.
      *   *Claim 1 (Sartre's Text):* Both must agree on what Sartre *actually wrote*, even if they disagree on its truth. Sartre does claim radical freedom.
      *   *Claim 2 (Constraints):* Maria must admit facticity exists; Dave must admit subjective experience of choice exists.
      *   *Claim 3 (Bad Faith/Deception):* Both agree people lie to themselves. The *mechanism* is the dispute.
      *   *Claim 4 (Utility):* Both agree the *concept* has practical value, even if the metaphysics differ.
      *   *Refinement:* Ensure these aren't vague. Instead of "Freedom is complicated," use "Sartre distinguishes ontological freedom from practical freedom."

  4.  **Drafting Section 2: Disagreements Table:**
      *   *Row 1: The Nature of Freedom.* Ontological vs. Empirical.
      *   *Row 2: The Mechanism of Self-Deception.* Bad Faith (conscious flight) vs. Unconscious Bias (system 1/2 errors).
      *   *Row 3: The "Self".* No fixed essence (Sartre) vs. Stable personality traits (Psych).
      *   *Row 4: Responsibility.* Absolute responsibility vs. Mitigated responsibility.
      *   *Cruxes:* Need to identify the specific pivot point. E.g., Is consciousness transparent to itself?
      *   *Evidence:* This is tricky. Philosophy isn't empirical. I need to frame evidence as "phenomenological reports" or "neuroscientific findings" that bear on the *plausibility* of the claim.
      *   *Correction on Evidence:* The prompt asks for "concrete test or piece of evidence." For metaphysical claims, this is hard. I need to frame it as *empirical implications*. If Sartre is right, what do we see? If Dave is right, what do we see?
      *   *Refinement:* Focus on the *experience* of choice and the *predictability* of behavior.

  5.  **Drafting Section 3: Evidence & Predictions:**
      *   *Crux 1 (Ontological Freedom):* Evidence = Neuroscientific readiness potential (Libet style) vs. Phenomenology of deliberation.
      *   *Crux 2 (Bad Faith Mechanism):* Evidence = Introspective access. Can we catch ourselves lying?
      *   *Crux 3 (Personality):* Evidence = Longitudinal stability of traits vs. Situational variability (Mischel).

  6.  **Review against Constraints:**
      *   *Settled vs. Contested:* I need to add a preamble or footnotes indicating where scholarship stands. E.g., It is settled Sartre believed in radical freedom; it is contested whether that's coherent. It is settled biases exist; contested how much they negate agency.
      *   *Tone:* Keep it neutral. Don't side with Maria or Dave.
      *   *Formatting:* Clear headings, table structure.

  7.  **Iterative Polishing (Self-Correction during drafting):**
      *   *Critique:* Is Maria's view accurately represented? Sometimes people think Sartre ignores "facticity." I need to make sure Maria's column acknowledges facticity but insists it doesn't *determine* choice.
      *   *Critique:* Is Dave's view accurate? He shouldn't be a hard determinist necessarily, just skeptical of "radical" freedom. He likely leans towards compatibilism or soft determinism.
      *   *Critique:* The "Evidence" section needs to be realistic. We can't solve metaphysics with a survey. I should frame the evidence as "Data that would shift the burden of proof."
      *   *Check:* Did I separate settled from contested? I will add a "Scholarly & Empirical Context" note at the start to satisfy the "One thing" requirement.

  8.  **Final Polish:** Check the voice. It should sound like a facilitator's draft, ready for them to edit. (e.g., "Draft for Review by Maria and Dave").

  **(Self-Correction on the "Evidence" requirement):** The prompt asks for "what each of them predicts that evidence would show." This implies the evidence *could* go either way. For metaphysical claims, this is tough. I will focus on *psychological phenomena* that serve as proxies for the metaphysical claims. For example, the stability of personality traits is an empirical proxy for the "fixed self" debate.

  9.  **Finalizing the Document Structure:**
