      *   *Refining the "Epistemic Backfire":* This is the strongest philosophical point. If perception is impenetrable, it lacks conceptual content. If it lacks conceptual content, it can't justify beliefs (which are conceptual). This is the "Given" argument. I need to highlight this clearly.

