  5.  **Step 3: Conceptual/Philosophical Defeaters (The Theory):**
      *   *The "Myth of the Given":* If perception is totally independent, how does it connect to belief to justify it? (Sellars, McDowell).
      *   *The Boundary Problem:* Where does "early" end and "late" begin? If the line is fuzzy, the view is unstable.
      *   *Epistemic Backfire:* If perception is *too* isolated, it's blind. It needs concepts to justify beliefs. If it's impenetrable, it has no conceptual content. If it has no conceptual content, it can't justify conceptual beliefs (The Non-Conceptual Content debate).
