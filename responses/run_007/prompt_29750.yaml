      *   *User's Version:* Seems to be the "Moderate/Epistemic" hybrid. They care about the *epistemic role*, so they need the *justificatory base* to be impenetrable. They explicitly mention "early visual processing."
      *   *Refinement:* I need to distinguish between *processing* impenetrability (mechanism) and *content* impenetrability (phenomenology/justification). The user links them: if processing changes, the "look" changes, undermining the tribunal.

  4.  **Step 2: Empirical Defeaters (The Science):**
      *   *Standard Paradigms:*
