answer: |-
  1. Before the paradox registers as a genuine problem, students must firmly distinguish between the negative valence of a specific emotion and the positive overall valuation of the experience containing it.
  2. Use Sophocles' *Oedipus Rex* as the carrying example because its historical centrality to Aristotle anchors the debate while its horrific content ensures the negative emotion is undeniable.
  3. Present the solutions in this sequence: Catharsis, Artifice, Make-Believe, Conversion, and Meta-Response, structuring the class as a dialectical progression toward greater phenomenological accuracy.
  4. Each subsequent theory depends on the previous one's failure to acknowledge that audiences genuinely feel negative emotions toward fictional events without having those emotions purged, falsified, or transformed into pleasure.
  5. Head off the misconception that enjoyment implies the sadness is fake during the Artifice section, and preempt the masochism objection when introducing Conversion by distinguishing pain from suffering.
  6. Explicitly flag the psychological mechanism of how negative affect converts to positive valuation as unsettled, ensuring students see this as an ongoing empirical and philosophical puzzle.
  7. Conclude by arguing that the Meta-Response account is most promising because it alone preserves the reality of our grief while explaining why we rationally choose to endure it for cognitive or moral goods.
