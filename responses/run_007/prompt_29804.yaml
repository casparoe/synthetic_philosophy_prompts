answer: |-
  **JOINT STATEMENT ON THE METAPHYSICS OF CHANCE AND THE PRINCIPAL PRINCIPLE**

  **Signatories:**
  *   **The Humean:** Proponent of the Best Systems Analysis (BSA) of objective chance.
  *   **The Primitivist:** Proponent of irreducible modal chance (Propensity/Power view).

  **Date:** October 26, 2023
  **Context:** Adversarial Collaboration on the Compatibility of Humeanism and the Principal Principle.

  ---

  ### 1. Common Ground: Accepted Claims

  We agree on the following formal and conceptual foundations. Our disagreement lies in the metaphysical interpretation and the handling of specific limit cases, not in the basic formalism.

  1.  **Formalism:** Objective chance is represented by a probability function $Ch$ satisfying the Kolmogorov axioms. Rational credence is represented by a function $Cr$ satisfying the same axioms.
  2.  **The Principal Principle (PP):** There is a normative constraint linking $Ch$ and $Cr$. Roughly: $Cr(A \mid Ch(A)=x \land E) = x$, where $E$ is "admissible" evidence (evidence that does not reveal the outcome of $A$ by a route other than via the chance).
  3.  **The Goal:** Any metaphysics of chance must explain *why* the PP holds. It is not sufficient to posit chances; one must explain why rational agents should align their beliefs with them.
  4.  **Undermining Futures:** On the Humean view (BSA), chances supervene on the total history of categorical events (the "Humean Mosaic"). Consequently, there are possible future sequences of events ("undermining futures") that, if they occurred, would make the *current* best systematization (and thus the current chance assignment) false.
  5.  **The Conflict:** If there is a non-zero chance of an undermining future, the original PP leads to contradiction for the Humean. (If $Ch$ says there is a chance of a future that makes $Ch$ false, then $Ch$ is not the chance derived from the best system of the *actual* history).
  6.  **Statistical Mechanics:** Both parties agree that Statistical Mechanics (SM) provides the primary empirical data for this debate. Any viable theory of chance must accommodate the probabilities found in SM (e.g., Boltzmannian probabilities).

  ---

  ### 2. Disagreements Table

  | Topic | The Humean Position (BSA) | The Primitivist Position (Irreducible Chance) |
  | :--- | :--- | :--- |
  | **Metaphysical Status** | Chances are descriptive summaries of the Humean Mosaic. They are not "in" the events but are features of the best theory describing the events. | Chances are productive, irreducible features of reality. They are ontologically prior to (or at least independent of) the frequency patterns they generate. |
  | **Response to Undermining** | The Original PP must be replaced by a **Revised Principal Principle (RPP)**. The RPP conditionalizes on the proposition that the chance function is the one that belongs to the best system of the *actual* history. | The RPP is an ad hoc patch that severs the link between chance and rationality. If a theory of chance requires revising the PP to avoid contradiction, the theory has failed to capture the concept of *chance*. |
  | **Explanatory Direction** | Frequencies/patterns explain chances. The chance is 0.7 *because* that value yields the best balance of simplicity and strength in describing the outcomes. | Chances explain frequencies. The outcomes occur with frequency 0.7 *because* the objective chance was 0.7. |
  | **Nature of Admissibility** | Admissibility is relative to the chance function. Information about the future is inadmissible only because it bypasses the chance function, not because it is metaphysically inaccessible. | Admissibility tracks metaphysical independence. Evidence is inadmissible if it reveals the "categorical base" of the chance in a way that bypasses the modal propensity. |
  | **Status of SM Probabilities** | SM probabilities are paradigmatic BSA chances. They summarize the trajectory of the system in phase space relative to a measure (e.g., Lebesgue). | SM probabilities are either epistemic (reflecting ignorance of microstates) or require a primitive stochastic dynamics (e.g., GRW) to be genuine chances. |

  ---

  ### 3. Cruxes: Sub-Questions for Resolution

  Settling these questions would significantly alter the dialectic or force one side to concede ground.

  **Crux A: The Cognitive Cost of the RPP**
  Does the Revised Principal Principle impose a cognitive burden on rational agents that makes it implausible as a norm of rationality?
  *   *Why it matters:* If the RPP is too complex to guide action, the Humean loses the claim that BSA chances are "guides to life."

  **Crux B: The Explanatory Circle**
  Can the Humean provide a non-circular explanation for why the Best System yields rational credences, without implicitly relying on primitive modal notions?
  *   *Why it matters:* The Primitivist argues BSA "smuggles in" modality. If the Humean can derive the normativity from non-modal facts (e.g., decision-theoretic representation theorems), the Primitivist's metaphysical addition is otiose.

  **Crux C: The "Near-Zero" Problem**
  Does the *magnitude* of the probability of undermining futures matter? In realistic physical theories (like SM), is the measure of undermining futures effectively zero?
  *   *Why it matters:* If undermining futures have measure zero in realistic physics, the Primitivist's objection becomes a "philosopher's zombie" problem—logically possible but physically irrelevant.

  **Crux D: Deterministic Chance**
  Can there be objective chance in a deterministic world (e.g., Classical Statistical Mechanics)?
  *   *Why it matters:* The Humean says "Yes" (BSA allows deterministic chances). The Primitivist typically says "No" (chance requires indeterminism). This is a decisive test case for the definition of chance.

  ---

  ### 4. Evidence, Arguments, and Predictions

  For each Crux, we specify the argument type both agree is relevant and record our opposing predictions.

  | Crux | Agreed-Upon Test / Argument | Humean Prediction | Primitivist Prediction |
  | :--- | :--- | :--- | :--- |
  | **A: Cognitive Cost** | **Formal Tractability:** Analyze the computational complexity of calculating the RPP conditional in a standard SM context (e.g., gas in a box). | The RPP is tractable because the probability of undermining is vanishingly small. For all practical purposes, RPP $\approx$ PP. | Even if small, the *conceptual* structure is wrong. Rational norms must be principled, not approximate. The RPP fails as a *definition* of rationality even if it works pragmatically. |
  | **B: Explanatory Circle** | **Decision-Theoretic Derivation:** Attempt to derive the PP from Dutch Book arguments or Representation Theorems without assuming modal primitives. | Success is possible. We can show that betting according to the Best System maximizes expected utility over the long run without invoking propensities. | Failure is guaranteed. Any such derivation will implicitly assume that the future resembles the past (Induction), which requires a primitive chance to justify. |
  | **C: Near-Zero** | **Measure Theory in SM:** Calculate the measure of undermining futures in a Boltzmannian gas over finite time $t$. | The measure is so close to zero that it is physically indistinguishable from zero. The logical possibility of undermining is a metaphysical technicality, not a scientific problem. | Non-zero is non-zero. If the metaphysics of chance cannot handle logical possibilities with non-zero measure, it is fragile. A robust metaphysics must handle the logic, not just the physics. |
  | **D: Deterministic Chance** | **Classical SM Interpretation:** Assess whether the probability of a molecule being in the left half of the box (0.5) is a "chance" given deterministic Newtonian dynamics. | **Yes.** It satisfies the role of chance (guides credence, appears in best systems). Therefore, chance is compatible with determinism. | **No.** It is an epistemic probability reflecting ignorance of initial conditions. Calling it "objective chance" conflates ontology with epistemology. |

  ---

  ### 5. Identification of Merely Verbal Disputes

  We have identified one area where our disagreement appears to be merely verbal, stemming from differing stipulations of the term "Chance."

  **The Dispute:** *Whether "Chance" requires Indeterminism.*
  *   **Source:** The Primitivist defines "Chance" as essentially involving ontological openness (multiple futures are physically possible). The Humean defines "Chance" functionally as "whatever plays the chance-role" (guides credence, fits patterns), regardless of underlying dynamics.
  *   **Resolution:** We agree that if we use the Primitivist's definition, Humean chances in deterministic worlds are not "Chances." We agree that if we use the Humean's definition, Primitivist chances are a subset of Humean chances (those where the best system is stochastic).
  *   **Agreement:** We will henceforth distinguish **"i-Chance"** (irreducible, indeterministic) from **"f-Chance"** (functional role, compatible with determinism).
      *   The Primitivist claims only i-Chance exists.
      *   The Humean claims f-Chance exists and is all we need.
      *   *Remaining Substantive Dispute:* Does the world contain i-Chance? (This moves the debate to quantum mechanics interpretation, specifically GRW vs. Many Worlds/Bohm).

  **The Dispute:** *The "Bug" vs. "Feature" of Undermining.*
  *   **Source:** The Primitivist treats the possibility of undermining as a *reductio* of Humeanism. The Humean treats it as a *feature* of supervenience.
  *   **Resolution:** This is **not** merely verbal. It is a substantive disagreement about the modal strength required for scientific laws. The Primitivist demands laws/chances that *govern* history; the Humean accepts laws/chances that *describe* history. We acknowledge this is a fundamental metaphysical divide that cannot be dissolved by terminology.

  ---

  **Signed,**

  *The Humean* | *The Primitivist*
  :---:|:---:
  *Chances summarize the mosaic.* | *Chances generate the mosaic.*
