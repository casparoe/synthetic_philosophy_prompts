prompt: |-
  I teach a philosophy of rationality seminar — twelve graduate students, one three-hour session. The week's topic is superrationality: the idea, most associated with Douglas Hofstadter, that rational agents who know each other to be rational can sometimes coordinate without communication by reasoning about what any rational agent would do in their position. I want the students to encounter the problem before they encounter the theory.

  Design a classroom game built around the Platonia Dilemma (the Luring Lottery). The core setup is this: there are N participants, each must independently choose whether to submit a claim or not, and the prize goes to a single claimant if and only if exactly one person claims it — if zero or more than one claim, nobody gets anything. Participants cannot communicate, and they all know the rules and each other's rationality. The puzzle is that standard causal decision theory says "if you think anyone else will claim, don't claim; if you think nobody will, claim" — but since everyone reasons symmetrically, this leads to either zero claimants or too many, and the prize is lost. Superrationality is the proposal that players can break the symmetry by asking "what policy would I want all of us to adopt?" and acting on that.

  I need a runnable activity, not a lecture. Please provide:

  1. Rules, materials, and a payoff scheme that doesn't require real money (e.g., points toward a small course-credit bonus, or a token system with a tangible but trivial prize like a chocolate bar for the highest cumulative score over several rounds).

  2. A structure of multiple rounds with variations, so students can discover the pattern: early rounds where they play naively, later rounds where you introduce a shared arbitrary tiebreaker (e.g., "the person whose birthday is earliest in the calendar year should claim"), and a final round where the tiebreaker is removed and they must decide whether superrationality alone can do the work. Specify what you announce before each round and what you withhold.

  3. A debrief that maps what happened in each round onto the theoretical landscape: where standard causal decision theory predicts failure, where a Schelling point or an arbitrary convention succeeds, where superrationality is supposed to succeed on its own, and where the experiment leaves the question open.

  4. An honest note on what will predictably go wrong the first time I run it — e.g., students finding covert ways to signal, the group converging on a convention you didn't intend, or the whole thing feeling like a lottery rather than a reasoning problem — and how to handle each.

  5. Throughout, separate what is settled from what is genuinely contested among people who work on this topic. For instance: it is settled that causal decision theory cannot solve the Platonia Dilemma on its own; it is contested whether superrationality is a genuine normative requirement or merely a relabeling of the problem; it is contested whether the move from "what should I do?" to "what policy would I want everyone to adopt?" is justified without additional premises. Do not present a contested view as the consensus. Flag where the activity itself leans on a particular reading of the dilemma (e.g., Hofstadter's) and where alternative readings would require a different setup.
reasoning: |-
  Here's a thinking process that leads to the suggested classroom activity:

  1.  **Analyze the Request:**
      *   **Context:** Philosophy of rationality seminar, 12 graduate students, 3-hour session.
      *   **Topic:** Superrationality (Hofstadter), specifically the Platonia Dilemma (Luring Lottery).
      *   **Goal:** Students encounter the problem *before* the theory. Runnable activity, not a lecture.
      *   **Requirements:**
          1.  Rules, materials, payoff scheme (no real money needed).
          2.  Multi-round structure (Naive -> Shared Tiebreaker -> Superrationality only).
          3.  Debrief mapping results to theory (CDT, Schelling Points, Superrationality).
          4.  Honest note on predictable failures (signaling, conventions, lottery feel).
          5.  Distinguish settled vs. contested views (CDT failure is settled; Superrationality normative status is contested).

  2.  **Deconstruct the Platonia Dilemma:**
      *   *Setup:* $N$ players. Choose Claim (C) or Pass (P).
      *   *Payoff:* If exactly 1 claims, that person wins big. If 0 or >1 claim, everyone gets nothing (or small consolation).
      *   *The Tension:* If I think others will pass, I should claim. If I think others will claim, I should pass. But we are symmetric. If we all use CDT, we randomize or end up in a bad equilibrium. Hofstadter argues we should reason "as if my choice determines everyone's."

  3.  **Designing the Activity (Iterative Process):**

      *   *Constraint:* 12 Grad Students. This is a small enough group for discussion but large enough for the probability math to be non-trivial.
      *   *Payoff:* Needs to matter enough to induce strategic thinking but not enough to cause genuine distress. Course credit points or "philosophy currency" redeemable for a treat/book privilege work best. Let's suggest a "Seminar Point" system.
      *   *Rounds:*
          *   Round 1 (Baseline): Pure Platonia. No communication. See if they coordinate. (Likely failure).
          *   Round 2 (Schelling Point): Introduce an asymmetry. "Oldest student claims." (Likely success).
          *   Round 3 (Superrationality): Remove asymmetry. Ask them to reason purely on rationality. (The core test).
          *   *Correction:* Wait, if I tell them "Superrationality" in Round 3, I'm teaching the theory. I need to frame it as "Think harder" or "Assume everyone thinks exactly like you."
          *   *Refinement:* Let's make Round 3 the "Hofstadter Round" where I explicitly invoke the *logic* without naming the *theory* yet. Or better, keep it blind until the debrief. Let's stick to the prompt's request: "Final round where the tiebreaker is removed and they must decide whether superrationality alone can do the work."
      *   *Mechanism:* How do they submit? Secret ballots. Slips of paper in a box.

      *   *Addressing the "Contested" Requirement:* I need to be careful not to present Superrationality as "the solution." It's a *proposed* solution. CDT says you should randomize with probability $1/N$. Superrationality says you should coordinate on a deterministic outcome if possible, or randomize symmetrically. Actually, in the strict Platonia Dilemma (one prize, N players), Hofstadter often argues for a probabilistic strategy if no asymmetry exists, but the *ideal* is finding a unique claimant. Wait, Hofstadter's specific take on the Luring Lottery (Scientific American, 1983) involved people sending postcards. The more postcards you send, the higher your chance, *but* if total postcards > threshold, everyone loses. That's a variation. The prompt specifies the "Exactly One Claimant" version (often called the "Volunteer's Dilemma" variant or strict Platonia).
      *   *Clarification on the Dilemma:* In the strict "Exactly One" version with symmetric players and no communication:
          *   CDT: Mixed strategy Nash Equilibrium. Each claims with $p = 1/N$. Probability of success is $(1 - 1/N)^{N-1}$. For $N=12$, success rate is approx 38%.
          *   Superrationality (Hofstadter): If we are identical reasoners, we must choose the same strategy. If we choose "Always Claim," 12 claim, 0 win. If we choose "Always Pass," 0 claim, 0 win. We must choose a probability $p$. But which $p$? The one that maximizes expected utility for the group. This actually converges on the same $p=1/N$ mathematically *unless* we can correlate our randomization.
          *   *Crucial Nuance:* True superrational coordination usually requires a way to break symmetry (Schelling point). If no Schelling point exists, superrationality + randomization yields the same result as CDT mixed strategies *unless* one argues for "magical" correlation.
          *   *Adjustment for Classroom:* To make the *concept* of superrationality pop, I need to emphasize the *reasoning process*, not just the math. The prompt asks to test "whether superrationality alone can do the work." This implies testing if they can coordinate on a unique claimant without an external cue. This is actually extremely hard/impossible without some focal point.
          *   *Strategy:* I will structure Round 3 to see if they can generate an *internal* focal point (e.g., "The person sitting in chair 1"). This blurs the line between Schelling and Superrationality, which is good for the debrief.

  4.  **Drafting the Content - Section by Section:**

      *   **1. Rules & Payoffs:** Keep it simple. Slips of paper. "Claim" or "Pass." Prize: 10 Seminar Points (towards participation grade) for the winner, 0 for others if failure. Or, to reduce variance, if successful, winner gets 10, others get 2 (consolation). No, strict Platonia is "all or nothing." Let's stick to strict for philosophical purity. Winner gets a "Get Out of One Reading Response Free" pass. High value, zero cost to instructor.
      *   **2. Structure:**
          *   Round 1: Blind. (Expect chaos or all pass).
          *   Round 2: Asymmetry introduced (e.g., "Person with earliest birthday"). (Expect success).
          *   Round 3: Blind again, but with a prompt: "Assume everyone in this room reasons exactly as you do." (The Superrational test).
      *   **3. Debrief:** Connect Round 1 to CDT/Nash. Round 2 to Schelling Points. Round 3 to Hofstadter/Superrationality. Discuss the "Magic" of correlation.
      *   **4. Predictable Failures:** Signaling (winking), refusing to play (nihilism), treating it as a joke. Mitigation: Strict silence, serious framing.
      *   **5. Settled vs. Contested:** This is critical.
          *   Settled: CDT leads to mixed strategies in symmetric no-communication games.
          *   Contested: Whether "superrationality" is a distinct normative standard or just CDT with different priors about other agents' source code. Whether logical correlation implies causal influence.

  5.  **Refining the "Superrationality" Round:**
      *   If I just say "Play again," they will do Round 1 again.
      *   I need to prime them without giving the answer. Prompt: "You are all clones. You have the same source code. What do you do?"
      *   *Self-Correction:* If they are clones, they must all choose the same *action*. If they all choose "Claim", they lose. If they all choose "Pass", they lose. Therefore, they must randomize. But if they randomize symmetrically, it's the same as CDT.
      *   *Hofstadter's specific claim:* In the *Luring Lottery* (Scientific American), the payoff was divided by the number of entries. In the *Platonia Dilemma* (exactly one), the solution is usually a Schelling point.
      *   *Decision:* I will frame Round 3 to see if they can derive a Schelling point *purely from rationality* (e.g., "The rational thing is for the person closest to the door to claim"). This tests if they believe rationality generates focal points. This is a contested view (Lewis vs. Hofstadter). I must highlight this in the debrief.

  6.  **Writing the Response:**
      *   Tone: Professional, pedagogical, philosophically precise.
      *   Formatting: Clear headings, bullet points for readability.
      *   Check against constraints: 12 students, 3 hours (plenty of time for debrief), no real money, distinguish settled/contested.

  7.  **Final Review of the "Contested" aspect:**
      *   Many decision theorists (e.g., Joyce, Lewis) reject superrationality as confused.
      *   FDT (Functional Decision Theory) proponents (Yudkowsky, Soares) revive it.
      *   I need to make sure the debrief doesn't say "Superrationality is the answer." It says "Superrationality *proposes* this answer."

  8.  **Final Polish:** Ensure the "Get Out of Reading Response" prize is framed as desirable but not grade-critical to avoid ethical issues. Ensure the "Clones" instruction is clear.

  *(Self-Correction during drafting)*: Wait, if I tell them "You are clones," they might all decide to randomize with $p=1/12$. That's a valid superrational strategy. But the prompt asks to test if they can coordinate *without* communication to get the *single* claimant. The "Clone" instruction might lead to the mixed strategy equilibrium which *is* the CDT outcome.
  *Better approach for Round 3:* Do not mention clones. Just say "Reflect deeply on what rationality requires given that everyone else is also rational." Then see if they converge on a focal point (like "Seat 1") without me suggesting it. If they do, that supports the idea that rationality + common knowledge generates Schelling points. If they don't, it supports the view that you need external asymmetry.

  *Actually, let's look at the prompt again:* "Final round where the tiebreaker is removed and they must decide whether superrationality alone can do the work."
  Okay, I will instruct them: "Assume that any reasoning you do to reach a decision is identical to the reasoning any other rational agent in this room will do." This is the core Hofstadter premise.

  Let's assemble the plan.cw
answer: |-
  Here is a design for a 3-hour seminar session centered on the Platonia Dilemma. It is structured to move from experience to theory, ensuring students feel the tension of the problem before you introduce the terminology.

  ### 1. Rules, Materials, and Payoff Scheme

  **Materials:**
  *   12 identical slips of paper (small enough to fold).
  *   12 pens.
  *   A locked box or opaque bag for collection.
  *   A whiteboard for tallying results.

  **Payoff Scheme (The "Exemption Token"):**
  Do not use money. Use a course-specific currency that has high subjective value but zero monetary cost to you.
  *   **The Prize:** A "Reading Response Exemption" voucher. Graduate seminars often require weekly short writing tasks. The winner of the game receives a voucher to skip one future assignment with no penalty.
  *   **The Stakes:**
      *   **Success (Exactly 1 Claim):** The single claimant gets the Voucher. All others get nothing.
      *   **Failure (0 or >1 Claims):** No one gets the Voucher.
      *   **Consolation:** To prevent total nihilism, if the group fails 3 rounds in a row, offer a "Consolation Prize" (e.g., you bring donuts next week). This keeps engagement high without diluting the dilemma.

  **The Rules (Read Aloud):**
  1.  You will receive one slip of paper.
  2.  You must write either **CLAIM** or **PASS**.
  3.  You cannot write your name or any identifying marks.
  4.  You cannot communicate verbally, non-verbally, or via devices during the decision phase.
  5.  Slips are submitted simultaneously into the box.
  6.  I will count them aloud. The payoff rules apply immediately.

  ---

  ### 2. Structure of Rounds

  The session is divided into three phases. You act as the Game Master. Do not explain *why* you are changing the rules until the Debrief.

  #### Round 1: The Baseline (Naive CDT)
  *   **Announcement:** "Submit your slip. You know the rules. You know everyone else is rational. You cannot communicate."
  *   **Withhold:** Do not suggest any strategy. Do not mention probability.
  *   **Expected Outcome:** High failure rate. Usually, either everyone passes (fear of collision) or multiple people claim (greed/optimism).
  *   **Pedagogical Goal:** Demonstrate that "common knowledge of rationality" is insufficient for coordination under standard decision procedures.

  #### Round 2: The Schelling Point (Arbitrary Asymmetry)
  *   **Announcement:** "We will play again. Same rules, same prize. However, I am adding one constraint: **The person whose birthday (month/day) comes earliest in the calendar year must write CLAIM. Everyone else must write PASS.** If you are that person, you are obligated by the rule to claim."
  *   **Withhold:** Do not discuss *why* this works yet.
  *   **Expected Outcome:** Success (Exactly 1 Claim).
  *   **Pedagogical Goal:** Demonstrate that coordination is easy if an asymmetry exists, even an arbitrary one. This introduces the concept of a *focal point* without naming it yet.

  #### Round 3: The Superrational Test (Symmetry Restored)
  *   **Announcement:** "We play one final time. The birthday rule is removed. You are symmetric again. However, I want you to adopt the following premise: **Assume that any logical reasoning you use to arrive at your choice is identical to the reasoning any other rational agent in this room will use. You are not causally linked, but you are logically mirror images.**"
  *   **Withhold:** Do not tell them what to do. Do not suggest randomization. Let them sit with the paradox: *If I claim, they claim. If I pass, they pass.*
  *   **Expected Outcome:** Variable.
      *   *Scenario A:* They all Pass (fear of universal claiming).
      *   *Scenario B:* They all Claim (logic failure).
      *   *Scenario C:* They spontaneously coordinate on a new focal point (e.g., "The person closest to the door") based purely on the instruction to "reason."
  *   **Pedagogical Goal:** Test whether the "superrational" premise generates coordination without external asymmetry.

  ---

  ### 3. The Debrief (Mapping to Theory)

  Allocate 60–90 minutes for this. This is where the philosophy happens.

  **Phase 1: Causal Decision Theory (CDT) & Round 1**
  *   **Analysis:** Ask students who claimed why they did so. Likely answers: "I thought no one else would."
  *   **Theory:** Explain that under CDT, my action does not causally influence yours. I should treat your probability of claiming as fixed.
      *   If $P(\text{others claim}) < 1$, I should Claim.
      *   If $P(\text{others claim}) > 0$, I might Pass.
      *   **Settled View:** In a symmetric game with no communication, CDT leads to a **Mixed Strategy Nash Equilibrium**. Everyone randomizes claiming with probability $p = 1/N$.
      *   **Result:** With $N=12$, the probability of success is only $\approx 38\%$. CDT predicts frequent failure. Round 1 likely confirmed this.

  **Phase 2: Schelling Points & Round 2**
  *   **Analysis:** Why did Round 2 succeed?
  *   **Theory:** Introduce Thomas Schelling. Coordination requires a *focal point*—a solution that stands out by virtue of being unique, not necessarily by virtue of payoff.
  *   **Settled View:** Rational agents can coordinate if there is common knowledge of an asymmetry. The birthday rule created a unique selector.

  **Phase 3: Superrationality & Round 3**
  *   **Analysis:** Did Round 3 succeed? If they coordinated (e.g., everyone passed, or everyone converged on "Seat 1"), ask *how*.
  *   **Theory:** Introduce Hofstadter's **Superrationality**.
      *   **The Premise:** Rational agents should reason as if their decision *logically determines* the decision of all other rational agents. "If I choose C, then (because we are identical reasoners) you choose C."
      *   **The Paradox:** If we are truly identical, we must make the *same* choice.
          *   If we all Choose CLAIM $\rightarrow$ 0 Prize.
          *   If we all Choose PASS $\rightarrow$ 0 Prize.
      *   **The Solution:** Hofstadter argues we must choose a *policy* that maximizes group utility. In the strict Platonia Dilemma, this often forces us back to randomization (same as CDT) *unless* we can find an internal focal point.
  *   **Contested View:** This is the crux of the seminar.
      *   *Hofstadter/FDT:* It is rational to act as if your choice correlates with others via logical necessity.
      *   *Standard CDT (Lewis/Joyce):* This is "magical thinking." My reasoning happens in my brain; it does not causally affect yours. Correlation is not causation.
      *   *Discussion Question:* "In Round 3, did anyone feel that their choice *forced* everyone else's choice? Or did you feel you were just guessing what they would do?"

  ---

  ### 4. Predictable Failures & Mitigation

  **1. Covert Signaling (The "Wink" Problem)**
  *   **Risk:** Students make eye contact, nod, or use seating arrangements to coordinate in Round 1 or 3, undermining the "no communication" rule.
  *   **Mitigation:** Enforce strict "heads down" during the decision minute. Collect slips in a way that order doesn't matter. If you catch signaling, call it out immediately as a violation of the *philosophical* constraints (the game is about reasoning, not signaling).

  **2. The "Nihilist" Strategy**
  *   **Risk:** A student decides the game is stupid and writes "CLAIM" every time to sabotage the prize, or writes "PASS" to prove a point.
  *   **Mitigation:** Frame the Exemption Voucher as highly desirable. If sabotage occurs, use it in the debrief: "This represents an agent who rejects the cooperative premise. How does superrationality handle an agent who refuses to be superrational?" (Answer: It struggles, which is a major criticism).

  **3. Convergence on Unintended Conventions**
  *   **Risk:** In Round 3, they might coordinate on something you didn't anticipate (e.g., "The tallest person").
  *   **Mitigation:** This is actually a *good* outcome. It shows that "rationality" might generate Schelling points endogenously. In the debrief, ask: "Was 'tallest person' a rational truth, or a social convention?" This blurs the line between Superrationality and Schelling, which is philosophically fertile ground.

  **4. The "Lottery" Feel**
  *   **Risk:** Students treat it as luck, not reasoning.
  *   **Mitigation:** In the debrief, insist on reconstructing their *reasoning*. "Don't tell me what you wrote. Tell me the argument you had with yourself."

  ---

  ### 5. Settled vs. Contested (Instructor's Cheat Sheet)

  Use this to ensure you do not present contested views as consensus.

  | Topic | Settled / Consensus | Contested / Open |
  | :--- | :--- | :--- |
  | **CDT Performance** | **Settled:** Causal Decision Theory cannot solve the symmetric Platonia Dilemma deterministically. It prescribes mixed strategies (randomization) which yield suboptimal group outcomes. | |
  | **Schelling Points** | **Settled:** If an asymmetry exists (Round 2), rational agents can coordinate successfully. | |
  | **Superrational Definition** | | **Contested:** There is no single agreed-upon formal definition of "superrationality." Hofstadter's informal description differs from modern Functional Decision Theory (FDT). |
  | **Normative Force** | | **Contested:** Is superrationality a *requirement* of rationality? Or is it a category error (confusing logical correlation with causal influence)? |
  | **The "Clone" Premise** | | **Contested:** Is it rational to assume your reasoning is perfectly correlated with others? Real agents have different priors and cognitive noise. |
  | **Round 3 Expectation** | | **Contested:** Some argue rational agents *should* be able to coordinate in Round 3 (by finding an internal focal point). Others argue this is impossible without communication. |

  **Instructor Note on Hofstadter vs. FDT:**
  Hofstadter's original 1983 *Scientific American* column on the Luring Lottery is the historical touchstone. However, modern decision theorists (like those at MIRI working on FDT) have formalized these intuitions differently.
  *   **Lean on Hofstadter** when discussing the *intuition* of "reasoning as a group."
  *   **Lean on FDT/CDT debate** when discussing whether this reasoning is *valid*.
  *   **Crucial Distinction:** Make sure students understand that Superrationality is not "altruism." It is still self-interested reasoning, but it changes the *inputs* to the calculation (i.e., "My output determines their output").

  **Final Seminar Takeaway:**
  End the session by asking: *"If you cannot communicate, and you are not identical clones, is there any remaining work for superrationality to do?"* This leaves them with the open problem that drives current research in logical decision theory.
