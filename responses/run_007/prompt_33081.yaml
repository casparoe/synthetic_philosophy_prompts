answer: |-
  Dear Friend,

  It is a pleasure to engage with someone who has wrestled so deeply with the architecture of rationality. The problem you describe is the central tension in formal epistemology, often called the problem of logical omniscience, and your discomfort is well-founded. The standard possible-worlds semantics, where belief is modeled as a relation between an agent and a set of worlds compatible with what they believe, inevitably entails that agents believe all logical truths and all logical consequences of their beliefs. As you note, this is descriptively false for humans and normatively questionable for bounded agents. You are looking for a model that respects the structure of logic without demanding impossible cognitive feats, and your specific intuitions provide excellent data for constructing such a model.

  To find the principle underlying your verdicts, we should first look at the existing landscape of solutions that logicians and epistemologists have proposed. One common approach is the distinction between explicit and implicit belief. Explicit belief corresponds to what is actively stored in memory or currently occurrent, while implicit belief covers everything that follows from it. This handles the Peano axiom case well, as the infinitude of primes is implicit but not explicit. However, it struggles with your Rain case, where you insist the friend believes the game is cancelled even though they haven't put it together. Another approach involves impossible worlds, introduced by thinkers like Rantala and Hintikka, which allow for worlds where logical laws fail. This captures the idea that an agent can believe P and believe P implies Q without believing Q, because there is an impossible world where P and P implies Q are true but Q is false. Yet this often feels too permissive, failing to capture why double negation feels like the same thought while complex proofs do not. A third candidate is awareness structures, developed by Fagin and Halpern, where an agent must be aware of a proposition to believe it. This handles your Moon cheese case beautifully, as you are not aware of that specific disjunction, but it risks making belief too fragmented unless we define awareness carefully. Finally, there are dispositional accounts, where belief is defined by what an agent would assent to under ideal reflection. This aligns with your working guess but risks the vagueness you fear.

  When we test these against your specific cases, a pattern emerges that suggests a hybrid principle. Your verdict on the Rain case suggests that single-step inferences like Modus Ponens count as belief even if not occurrent. Your verdict on the Peano case suggests that multi-step derivations do not count. Your verdict on the Moon cheese case suggests that introducing new concepts or irrelevant content breaks belief attribution. Your verdict on the Double Negation case suggests that syntactic variations or trivial equivalences preserve belief. Your verdict on the Prime concept case suggests that conceptual mastery is a prerequisite for belief. And your ambivalence on Conjunction suggests a tension between aggregation and storage.

  The principle that best captures this cluster of intuitions is what I would call the Principle of Conceptually Restricted Trivial Closure. It states that an agent believes a proposition P if and only if two conditions are met. First, the agent possesses and has activated the concepts required to formulate P. Second, P is either explicitly stored in the agent's memory or is reachable from explicitly stored beliefs via a chain of inference steps that are cognitively immediate, using only rules of inference the agent competently masters, without requiring search or complex derivation. This principle draws a sharp line based on conceptual availability and computational triviality. It treats belief not as a static set of sentences but as a dynamic commitment within a specific conceptual framework.

  Let us see how this principle accounts for your verdicts. In the Rain case, the inference from Rain and If Rain then Cancelled to Cancelled is a single step of Modus Ponens, which is cognitively immediate for any competent reasoner. Thus, the principle says the friend does believe the game is cancelled, matching your intuition. In the Peano case, the derivation of infinite primes requires a non-trivial proof search that exceeds immediate cognitive reach. Thus, the principle says you did not believe it beforehand, matching your intuition. In the Moon cheese case, the disjunction introduces the concept of Moon cheese, which is not activated by the concept of Rain. The principle says you do not believe the disjunction because it fails the conceptual availability condition, matching your intuition. In the Double Negation case, the transformation is trivial and uses the same concepts. The principle says you do believe the negated negation, matching your intuition. In the Prime concept case, the child lacks the concept prime. The principle says she does not believe 7 is prime, matching your intuition.

  This leaves your ambivalence on Conjunction. The principle forces you to resolve this ambivalence in favor of yes. If you believe P and you believe Q, and you possess the concept of conjunction, then P and Q is reachable via a trivial inference rule (Conjunction Introduction) without new concepts. The feeling that it is a new thought is correct in terms of occurrent processing cost, but incorrect in terms of doxastic commitment. To maintain consistency with your verdict on the Rain case, where you attributed belief despite the lack of occurrent synthesis, you should attribute belief in the conjunction as well. The hesitation you feel likely stems from conflating the act of judging with the state of believing. The principle requires you to abandon the intuition that belief requires active aggregation, urging you instead to view belief as a dispositional commitment to the conjunction whenever the conjuncts are held.

  Now consider the case you have not listed, involving probability axioms and Bayes' rule. Suppose an agent explicitly accepts the axioms of probability theory and has all the relevant evidence but reliably violates Bayes' rule when calculating posterior probabilities, perhaps due to cognitive bias or computational limitation. Our principle predicts that this agent does not believe the correct posterior probability derived from Bayes' rule. While the posterior is a logical consequence of the axioms and the evidence, the application of Bayes' rule is not a cognitively immediate inference for most humans; it requires calculation and is prone to error, much like the Peano proof. Unless the agent is an ideal reasoner for whom Bayesian updating is as trivial as Modus Ponens, the computational complexity breaks the chain of trivial closure. Therefore, despite accepting the axioms, they do not believe the specific probabilistic conclusions they fail to derive. This preserves the distinction between accepting a framework and believing its complex outputs.

  There is a cost to adopting this principle, however. It makes belief attribution somewhat context-sensitive depending on what concepts are activated and what counts as immediate for a specific agent. It also implies that two agents with the same evidence and logical capacity might differ in belief if one has activated the relevant concepts and the other has not. But this seems to be a feature rather than a bug, given your intuition about the child and the word prime. It respects the bounded nature of human cognition while preserving the normative force of logic where it is easily accessible. You asked for a principle precise enough to see where it draws the line. The line is drawn at the boundary of conceptual mastery and the threshold of computational triviality. Anything beyond that boundary is not belief, but perhaps potential belief or commitment.

  In summary, your intuitions are not erratic; they point toward a model of belief that is dispositional but constrained by conceptual and computational bounds. By adopting the Principle of Conceptually Restricted Trivial Closure, you can maintain your verdicts on the Rain, Peano, Cheese, Cat, and Prime cases. You will need to adjust your view on Conjunction to align with the Rain case, accepting that belief aggregates even when unobserved. And you will predict that violating Bayes' rule implies a lack of belief in the posterior, distinguishing between theoretical acceptance and actual doxastic state. This offers a coherent middle path between the impossible ideal of logical omniscience and the chaos of unstructured opinion.

  I hope this helps you find the peace you are looking for with these idealizations. The struggle itself is a sign of a careful mind, and refining these distinctions is exactly how progress is made in epistemology.

  Warmly,

  A Fellow Traveler in Epistemology
