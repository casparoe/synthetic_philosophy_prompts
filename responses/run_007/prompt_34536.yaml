answer: |-
  If soundest sleep excludes all conscious state,
  Then mind is void throughout the dark of night.
  What we call memory is not the fate
  Of inner shows concealed from waking sight.
  To claim "I dreamed" posits no hidden scene,
  But marks a disposition to declare;
  The telling is the criterion, not means
  To report past events occurring there.

  Yet Dennett spins the tape inside the head,
  Inserting traces at the waking gate.
  If content fixes now, not then, he said,
  No fact remains to settle dreams' true state.
  The question lacks a truth value to find,
  Where lived conviction and mere tale are twined.
