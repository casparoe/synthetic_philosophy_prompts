  I am **highly confident** in my critique regarding your conclusion about what the effect "licenses" (Comment #4), as this hinges on the logical relationship between evidence and theory choice in the competence/performance debate. I am **least sure** about the severity of the "psychological vs. normative" dichotomy error (Comment #2), as different interpreters of the "Moral Concept" view emphasize different aspects of the concept's function.
