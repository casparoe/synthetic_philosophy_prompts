      *   *Necessity:* The speaker needs the *Descriptive* reading of Clause A (ineffectiveness) and the *Normative* reading of Clause B (legitimacy).

  7.  **Drafting the Analysis (Iterative refinement):**

      *   *Claim 1: Efficacy.* Justice requires force to be effective in the world.
          *   *Status:* Substantive-but-defensible. (Counterexample: Non-violent resistance).
