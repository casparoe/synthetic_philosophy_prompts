      *   *Interpretation 2 (Normative/Existential):* Justice *ceases to be justice* if it cannot enforce itself. (This is stronger).
      *   *Speaker's Use:* "Movement with right on its side but no leverage is basically moral posturing." This aligns with Interpretation 1 (ineffectiveness) but hints at 2 (irrelevance).
