answer: |-
  This is a profound ontological puzzle. You have identified the precise moment where the "magic" of money becomes visible: when the props change but the play continues. The Nixon Shock is indeed the perfect case study for testing the limits of the social-constructionist view of money.

  To analyze this, we need to refine what "social construction" means in this context. If we rely primarily on John Searle's framework of **status functions** and **collective intentionality**, combined with insights from Chartalism (State Theory of Money) and geopolitical economy, we can break down your questions into three layers: the nature of the status shift, the hierarchy of the "collective," and the role of power versus consensus.

  ### 1. The Ontological Shift: From "Claim" to "Unit"
  Under the Bretton Woods system, the dollar had a dual ontology. For the US public, it was a legal tender token (fiat). For foreign central banks, it was a warehouse receipt (claim on gold).

  When Nixon closed the gold window, he did not change the *brute facts* (the paper, the ledgers) or the *legal tender laws*. He changed the **status function**.
  *   **Pre-1971:** "This piece of paper counts as a claim on $1/35$th of an ounce of gold held by the US Treasury."
  *   **Post-1971:** "This piece of paper counts as the final means of payment for taxes and debts within the US sphere of influence."

  From a social-constructionist view, this confirms that money is not a *thing* but a *relation*. The "value" was never in the gold itself; the gold was merely a focal point for coordinating collective belief. When the focal point was removed, the coordination could have collapsed. That it didn't suggests that the gold was a **prop** for the collective intentionality, not the **source** of it.

  The survival of the dollar suggests that the deeper social construction was not "gold is money," but "the US State is the guarantor of liquidity." The ontology shifted from a *commodity theory* of money to a *credit theory* of money without the users needing to update their mental models immediately.

  ### 2. Who is the "Collective"? (The Hierarchy of Intentionality)
  You ask: *Who exactly had to change their collective intentions?* This is where the social-construction view needs nuance. It is not a flat democracy of belief; it is a stratified hierarchy.

  **The Elite Layer (Central Banks & States):**
  The critical collective intentionality resided here. For the dollar to survive as a *reserve currency*, foreign central banks (Germany, Japan, UK) had to agree to hold dollars despite the lack of gold convertibility. They did this not out of love for the dollar, but because they needed a liquid asset for trade settlement, and there was no alternative. Their "agreement" was a pragmatic acceptance of US hegemony.

  **The Public Layer (Domestic & Global):**
  For the average citizen, the 1971 shock was ontologically invisible. In fact, for US citizens, it was doubly invisible: **private ownership of monetary gold had been illegal in the US since 1933.** The average American could not redeem dollars for gold anyway.
  *   **Implication:** The "gold backing" was largely a myth for the domestic public long before 1971. Their acceptance of the dollar was based on **habit** and **tax obligation**, not redeemability.
  *   **The "Uninformed" Problem:** You ask if uninformed acceptance troubles the social-construction account. It does not, provided we view collective intentionality as **tacit** rather than **explicit**.
      *   Searle argues that we need "We believe X is Y." But in complex societies, this is often "We act *as if* X is Y."
      *   Money functions on **iterated trust**. I accept the dollar not because I know the macro-ontological status of the currency, but because I believe the grocery store will accept it tomorrow. This creates a chain of intentionality that does not require every link to understand the foundation. The "construction" is maintained by the *network effect*, not by individual philosophical assent.

  ### 3. Strengths of the Social-Construction View
  The Nixon Shock validates the social-construction view in two specific ways:

  **A. Resilience through Abstraction:**
  If money were physically grounded (like gold coins), removing the gold would destroy the money. Because money is socially constructed, the "substance" can vanish as long as the *network of obligations* remains intact. The 1971 episode shows that the "reality" of money is its **acceptability in discharge of debt**, not its convertibility into a commodity.

  **B. The Flexibility of Status Functions:**
  The system didn't collapse because the status function was successfully reassigned. The dollar went from being "as good as gold" to being "the oil currency." This transition highlights that social constructions are **path-dependent**. The dollar survived because the existing infrastructure (SWIFT, banking correspondents, trade contracts) was already built around it. Changing the ontology of the dollar would have required rebuilding the entire global trade operating system, which was too costly for the "collective" to undertake.

  ### 4. Weaknesses and Blind Spots: Power and Coercion
  However, the Nixon Shock also exposes where a naive social-construction view fails. If money is purely a "shared agreement," it implies a level of voluntarism that didn't exist in 1971.

  **A. The Petrodollar and Coercion:**
  Shortly after the gold window closed, the US struck deals with Saudi Arabia to price oil exclusively in dollars (the Petrodollar system).
  *   **The Challenge:** This wasn't just a "change in collective attitude." It was a geopolitical maneuver. Countries *needed* oil. By forcing oil to be priced in dollars, the US created a **structural demand** for fiat dollars that had nothing to do with trust or consensus.
  *   **Ontological Implication:** Money is not just socially constructed; it is **power-constituted**. The "collective intentionality" of non-US nations holding dollars was partly coerced by the necessity of energy security. A pure social-construction view risks obscuring the role of military and economic hegemony in sustaining the "agreement."

  **B. Inflation as a Breach of Trust:**
  The 1970s saw high inflation. In a social-construction framework, value is sustained by trust.
  *   **The Challenge:** If money is just a shared belief, why didn't the belief collapse during high inflation?
  *   **Analysis:** It reveals that the "construction" is not binary (money/no money) but scalar (strong money/weak money). The public continued to accept dollars (ontological survival) but demanded more of them for goods (value depreciation).
  *   **Weakness:** Social construction explains *why* the dollar remained money, but it struggles to explain *valuation* without referencing material constraints (like the supply of goods vs. money). It explains the *existence* of the currency, but not the *stability* of its purchasing power.

  ### 5. Synthesis: What Changed and What Didn't?
  To answer your core question: "Socially constructed" is a precise concept, but it must be layered.

  **What Didn't Change:**
  *   **The Deontic Power:** The dollar remained a tool for creating obligations (debts, taxes). The state's power to demand payment in dollars remained the bedrock.
  *   **The Network:** The ledger systems and trade relationships remained intact.

  **What Changed:**
  *   **The Constraint:** The US government moved from being a *custodian* of value (holding gold) to being a *manager* of value (adjusting supply).
  *   **The Risk Profile:** The risk shifted from **conversion risk** (can I get gold?) to **inflation risk** (will this buy less tomorrow?).

  ### Conclusion: The "Myth" is the Mechanism
  The Nixon Shock teaches us that the ontology of money is **performative**. The dollar survived because the performance continued.

  The "uninformed" public does not weaken the social-construction account; it strengthens it. It shows that money relies on **institutional habitus** (to use Bourdieu's term) rather than explicit contract. We do not need to know the rules of the game to play it; we only need to know that the other players will penalize us if we refuse the tokens.

  However, the episode reveals that "social construction" is insufficient on its own. It must be coupled with **political economy**. The dollar survived not just because we collectively imagined it had value, but because the US state had the power to enforce tax obligations in dollars and the geopolitical leverage to ensure global trade required dollars.

  So, the ontology of the dollar post-1971 is not merely "socially constructed." It is **hegemonically stabilized social construction**. The "say-so" you mentioned is not a whisper; it is a command backed by the largest economy and military in history. The bridge didn't collapse when the foundations vanished because the bridge itself had become the foundation.
