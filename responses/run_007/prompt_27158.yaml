answer: |-
  Your intuition is spot-on. You have identified what is often called the **Generalized Frege-Geach Problem**. If the argument you reconstructed were sound, it would not only refute moral expressivism but also rule out coherent semantics for imperatives, interrogatives, and performative utterances. Since we generally accept that imperative logic (and erotetic logic) is possible, the argument must be unsound.

  The premise a defender of expressivism should reject is **(3)**.

  ### Why Premise (3) Looks Plausible
  Premise (3) states: *If the antecedent does not express the attitude, then by (1) its meaning in the conditional context is not the same as its meaning when it stands alone as an assertion.*

  This step is highly plausible if one holds a **naive use-theory of meaning** or a crude version of expressivism. On this view, the meaning of a sentence is *exhausted* by the illocutionary force (the speech act) performed in uttering it. If "Lying is wrong" *means* expressing disapproval, and I am not expressing disapproval in the antecedent of a conditional, it seems to follow that I am not using the sentence with its standard meaning. It conflates **semantic content** (the stable meaning of the sentence type) with **illocutionary force** (what the speaker is doing with the sentence on a specific occasion).

  ### Why Rejecting (3) Saves Expressivism
  To reject (3), the expressivist must argue that a sentence can have a constant semantic content even when the characteristic attitude is not being expressed in that specific token. This is the core project of **Quasi-Realism** (associated with Simon Blackburn) or **Norm-Expressivism** (associated with Allan Gibbard).

  These sophisticated expressivists argue that moral sentences have a semantic structure that allows them to embed in logical operators, even if their metaphysical ground is non-cognitive. They distinguish between:
  1.  **The semantic value:** What the sentence contributes to the truth-conditions (or validity-conditions) of complex sentences. This remains constant.
  2.  **The expressive function:** The attitude the sentence is used to express when asserted standalone.

  By rejecting (3), the expressivist claims that "Lying is wrong" contributes the *same semantic content* to the conditional as it does to the standalone assertion, even though the *expression of attitude* only occurs in the latter. This blocks the charge of equivocation in Premise (4).

  ### The Cost of Rejection
  Rejecting (3) comes with a theoretical cost: **Complexity.**
  Naive expressivism is attractive because it is simple: moral language is just the venting of attitudes. Rejecting (3) forces the expressivist to develop a formal semantics that looks very much like the cognitivist semantics they oppose. They must explain what the "content" of a moral sentence is if it isn't simply "the attitude being expressed." They have to show how attitudes can have logical relations (e.g., how disapproving of lying logically commits one to disapproving of getting your brother to lie). This requires building a logic of attitudes, which is technically demanding.

  ### Is the Cost Unique to Moral Expressivism?
  No, this cost is **shared** by non-propositional theories of imperatives and questions, exactly as you suspected.
  *   **Imperatives:** To solve the parallel problem for "If it rains, shut the window," semanticists do not say the imperative loses its meaning in the consequent. Instead, they assign imperatives a semantic value (e.g., a set of worlds, or an update potential) that remains constant whether the sentence is issued as a command or embedded in a conditional.
  *   **The Shared Burden:** Just as the moral expressivist must explain how attitudes embed, the imperative theorist must explain how directives embed. Both must abandon the idea that meaning is *identical* to the force of the utterance in context.

  Your worry that the argument proves "too much" is actually the key to its solution. Since we know imperative logic works, we know that non-propositional content *can* remain stable across asserted and unasserted contexts. Therefore, Premise (3) is false in general, and thus false for moral language specifically. The expressivist can borrow the semantic machinery developed for imperatives to solve the moral problem.

  \answer{3}
