          *   *Wait, looking closer:* (5) is used to support (1). (4) is also used to support (1). If I drop (5), (1) rests on (4). Is (4) defensible? Yes, it's a standard argument (Budolfson, etc.).
          *   *Alternative:* Refine (6). (6) is the glue. But (5) is the wrench.
          *   *Decision:* The biggest cleanup comes from resolving the conflict between (4) and (5). They are competing explanations for why the inefficacy objection fails. Using both is redundant and philosophically messy. Since (4) aligns better with (6) (markets have thresholds), (5) is the one to modify or drop.
          *   *Actually, looking at (2) vs (5):* This is the sharpest contradiction. (2) says negligible impact = no causal duty. (5) says negligible impact $\neq$ no moral duty (in firing squads). If (5) is a general principle, it kills (2). If (5) is specific to atrocities, it's weak.
