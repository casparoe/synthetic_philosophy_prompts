      *   *Check:* Is the "Object" the Row or the Table?
      *   *Correction:* In Endurantism, the Object is the logical entity referenced by the PK (the heap slot). In Perdurantism, the Object is the *sequence* of rows.
      *   *Nuance:* Make sure to mention that DBs *simulate* Endurantism on top of Perdurantist hardware (disk blocks don't actually change, they are rewritten). This is a great "settled debate" point.

  9.  **Final Polish:** Ensure tone is academic yet accessible to a CS major. Use bolding for key terms. Ensure the "Residue Report" is distinct and critical. (Proceed to generate output based on these thoughts).

  *(Self-Correction Note during final review)*: I need to make sure I don't just say "Endurantism = SQL UPDATE". I need to explain *why* that models the metaphysical commitment (the substrate remains numerically identical while properties change). Similarly for Perdurantism, it's not just "INSERT", it's that the *identity* is distributed across the inserts.

