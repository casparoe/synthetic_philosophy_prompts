      *   **Round 3: The "Interrupt."** This is the crux. Can humans interrupt the program? Elias argues the interrupt is also programmed. Sarah argues the interrupt is a rational intervention.
      *   **Round 4: Normativity/Reasons.** Sarah introduces "responding to reasons." Elias challenges the origin of those reasons (evolutionary programming).
      *   **Round 5: The Climax/Resolution.** No easy answer. Acknowledge the tension. The feeling of unsettledness is the point.

  5.  **Refining the Argument (Self-Correction during drafting):**
      *   *Critique:* Is Elias too dismissive?
      *   *Fix:* Make Elias empathetic. He's not saying life is meaningless, just that our *model* of agency is wrong.
      *   *Critique:* Is Sarah too mystical?
