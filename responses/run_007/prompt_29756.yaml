      *   *Sarah:* "But we can choose to seek truth even when it's maladaptive." (Good point for Sarah).
      *   *Elias:* "Is that freedom or just a conflicting drive?"
      *   *Ending:* They don't solve it. They sit with the uncertainty.

  7.  **Polishing:**
