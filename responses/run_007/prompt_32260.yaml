prompt: |-
  I'm a programme director at a public research funding body. Every quarter I review a portfolio of roughly thirty projects, and for each I must recommend one of four actions: continue as planned, increase funding, restructure, or terminate. The problem is that we keep escalating our commitment to failing projects — ones that have already consumed twice their initial budget with nothing to show, yet the principal investigator argues that abandoning now would mean all that spending was for nothing. I've read about the dollar auction and the escalation-of-commitment literature, and I recognise the pattern, but recognising it is not the same as having a procedure I can run inside a thirty-minute review meeting.

  Please write me a decision procedure — a checklist or ordered sequence of questions — that I can apply to each project at each quarterly review to detect when escalation of commitment is driving the recommendation rather than the forward-looking merits. The procedure should:

  - distinguish reasons to continue that are genuinely forward-looking from reasons that are disguised references to sunk costs;
  - include a step that forces me to ask what I would decide if I were joining the organisation today and inheriting this project with no prior involvement;
  - flag cases where the right answer is probably 'stop' but the procedure cannot force the decision because it turns on an irreducible judgement about future prospects;
  - be honest about which steps are mechanical and which require judgement.

  Then run the procedure on two hypothetical projects: (1) a drug development programme that has spent £8 million over four years, has no statistically significant results, but the team insists a breakthrough is close and asks for another £2 million; and (2) a climate modelling project that is eighteen months past its deadline, has produced usable but unremarkable outputs, and the team is asking for a six-month extension to 'do it properly'.

  The answer should be in British English.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure and analysis:

  1.  **Analyze the Request:**
      *   **Role:** Programme Director at a public research funding body.
      *   **Task:** Create a decision procedure (checklist/sequence) for quarterly portfolio reviews (approx. 30 projects, 30 mins each).
      *   **Problem:** Escalation of commitment (sunk cost fallacy) regarding failing projects.
      *   **Requirements:**
          *   Distinguish forward-looking reasons from sunk cost references.
          *   Include a "new boss" test (joining today, no prior involvement).
          *   Flag cases where 'stop' is likely but requires irreducible judgement.
          *   Be honest about mechanical vs. judgement-based steps.
          *   Run the procedure on two hypothetical projects (Drug Dev & Climate Modelling).
          *   **Language:** British English.

  2.  **Deconstruct the Problem (Escalation of Commitment):**
      *   Why does it happen? Emotional investment, reputation risk, hope bias, "waste" aversion.
      *   How to counter it? Focus on *marginal* utility, opportunity cost, and counterfactuals.
      *   Constraint: 30 minutes per project. The procedure must be efficient, not bureaucratic bloat.

  3.  **Drafting the Decision Procedure (The "Sunk Cost Audit"):**
      *   *Structure:* Needs to be linear, logical, and time-bound.
      *   *Step 1: Data Sanity Check (Mechanical).* Get the facts straight. Budget vs. Actual, Timeline vs. Actual.
      *   *Step 2: The Sunk Cost Filter (Mechanical/Judgement).* Explicitly separate past spend from future ask.
      *   *Step 3: The "New Director" Test (Judgement).* The core psychological intervention.
      *   *Step 4: Opportunity Cost (Judgement).* What else could this money do?
      *   *Step 5: The Kill Criteria (Mechanical/Judgement).* Pre-defined thresholds for termination.
      *   *Step 6: Final Recommendation & Flagging.* Acknowledge uncertainty.

      *Refining the Steps for British Context:* Use terms like "Programme Director," "Principal Investigator," "£," "Quarterly Review." Ensure tone is professional but pragmatic.

      *Addressing Specific Requirements:*
      *   *Forward-looking vs. Sunk:* Step 2 needs to explicitly ban phrases like "we've already spent."
      *   *New Boss Test:* Step 3.
      *   *Irreducible Judgement:* Step 6 needs a "Red Flag" mechanism.
      *   *Mechanical vs. Judgement:* Label each step clearly.

  4.  **Developing the Hypothetical Cases:**
      *   *Case 1: Drug Development.* High spend (£8m), no results, asking for more (£2m). Classic sunk cost trap. "Breakthrough is close" is a common heuristic bias.
      *   *Case 2: Climate Modelling.* Late (18 months), mediocre output, asking for extension. This is more about scope creep/perfectionism than pure failure, but still escalation.

  5.  **Running the Procedure (Mental Simulation):**
      *   *Case 1:*
          *   Facts: Over budget, no results.
          *   Sunk Cost Filter: PI argues based on past spend.
          *   New Director: Would I fund this *now* for £2m expecting a breakthrough with no prior data? Probably not.
          *   Opportunity Cost: £2m elsewhere?
          *   Verdict: Terminate.
      *   *Case 2:*
          *   Facts: Late, usable but meh.
          *   Sunk Cost Filter: "Do it properly" implies past work wasn't enough.
          *   New Director: Would I fund a 6-month extension for "unremarkable" work? Unlikely.
          *   Verdict: Restructure or Terminate (depending on strategic value). Let's lean towards Restructure/Terminate boundary.

  6.  **Writing the Content (Iterative refinement for tone and constraints):**
      *   *Tone:* Authoritative, clear, bureaucratic but sensible.
      *   *Formatting:* Use bolding, lists, and clear headings.
      *   *British English:* Check spelling (programme, centre, modelling, £).
      *   *Constraint Check:* Did I mention the 30-minute limit? Yes, keep the procedure tight. Did I distinguish mechanical vs. judgement? Yes, label them.

  7.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is the procedure too long for 30 mins?
      *   *Fix:* Emphasise that prep work happens *before* the meeting. The meeting is for the judgement calls.
      *   *Critique:* Is the "New Director" test clear?
      *   *Fix:* Phrase it specifically as "If this proposal landed on my desk today as a new application..."
      *   *Critique:* Did I address the "irreducible judgement" requirement?
      *   *Fix:* Add a specific "Uncertainty Flag" at the end of the procedure.

  8.  **Final Polish:**
      *   Ensure the distinction between 'Restructure' and 'Terminate' is clear in the examples.
      *   Make sure the "Sunk Cost" language is explicit (e.g., forbidding the word "waste" in relation to past spend).
      *   Check the Drug Dev example: £8m is a lot. The "breakthrough is close" claim needs to be scrutinised heavily.
      *   Check the Climate example: "Usable but unremarkable" suggests low marginal return.

  9.  **Final Output Generation:** (Proceeding to generate response based on these thoughts.)
answer: |-
  # The Sunk Cost Audit: A Decision Procedure for Quarterly Portfolio Reviews

  **Context:** This procedure is designed for a 30-minute review slot per project. It assumes baseline data (budget burn, milestones, deliverables) is circulated 48 hours prior. The meeting time is for judgement, not data retrieval.

  **Objective:** To isolate forward-looking value from backward-looking emotional investment and provide a defensible rationale for continuation or termination.

  ---

  ## Part 1: The Procedure

  ### Step 1: The Mechanical Baseline (5 Minutes)
  *Type: Mechanical / Data Verification*

  Establish the factual ground truth. No interpretation allowed here.
  1.  **Budget Variance:** What is the percentage overspend against the original grant?
  2.  **Timeline Variance:** How many months past the original completion date is the project?
  3.  **Milestone Achievement:** How many critical technical milestones were met vs. missed in the last two quarters?
  4.  **The Ask:** What is the specific additional resource requested (cash, time, personnel)?

  *Constraint:* If Budget Variance > 100% OR Timeline Variance > 12 months, automatically trigger **Step 4 (High Scrutiny)**.

  ### Step 2: The Sunk Cost Filter (5 Minutes)
  *Type: Mechanical / Linguistic Audit*

  Review the Principal Investigator's (PI) justification for the new request.
  1.  **Scan for Prohibited Phrases:** Does the justification contain phrases such as:
      *   "We have already invested..."
      *   "It would be a waste to stop now..."
      *   "Given the history of the project..."
      *   "We are too far in to turn back..."
  2.  **The Translation Test:** Rewrite the PI's argument removing all references to past spend or time.
      *   *Example:* "We need £2m because we spent £8m" becomes "We need £2m."
      *   *Question:* Does the argument still hold water without the reference to the past?

  *Outcome:* If the argument collapses without references to past spend, flag as **High Escalation Risk**.

  ### Step 3: The 'New Director' Test (10 Minutes)
  *Type: Judgement*

  This is the core psychological intervention. You must mentally sever your history with the project.
  1.  **The Counterfactual:** Imagine you joined this organisation today. You have no memory of the past £8m or the four years elapsed. You are presented with a *new* proposal asking for the *additional* funding (£2m) to achieve the *remaining* goals.
  2.  **The Competition:** Assume there are three other proposals on your desk asking for the same £2m, with stronger preliminary data.
  3.  **The Decision:** Based *only* on the probability of success from this point forward, would you fund this project?
      *   **Yes:** Proceed to Step 4.
      *   **No:** Recommendation is **Terminate**.
      *   **Unsure:** Proceed to Step 4, but mark as **Irreducible Judgement**.

  ### Step 4: Opportunity Cost & Strategic Fit (5 Minutes)
  *Type: Judgement*

  Money saved is money available for elsewhere.
  1.  **Marginal Utility:** What is the specific, verifiable output of the *additional* funding? (e.g., "Phase III trial" vs. "more research").
  2.  **Alternative Use:** If this funding were returned to the pool, what is the next best project that could be started or accelerated?
  3.  **Strategic Necessity:** Is this project the *only* route to a critical national priority, or is it one of several paths?

  ### Step 5: Final Recommendation & Uncertainty Flag (5 Minutes)
  *Type: Mechanical / Reporting*

  Select one of the four actions. You must append a status flag.
  *   **Actions:** Continue, Increase, Restructure, Terminate.
  *   **Flags:**
      *   **[Green]:** Forward-looking merits clear.
      *   **[Amber]:** Marginal forward merit, but strategic value high.
      *   **[Red]:** Forward merit low; recommendation relies on hope or non-quantifiable factors.

  *Rule:* If Step 2 flagged **High Escalation Risk** AND Step 3 resulted in **No**, you cannot recommend 'Continue' or 'Increase' without written approval from the Board.

  ---

  ## Part 2: Application to Hypothetical Projects

  ### Project 1: The Drug Development Programme
  **Status:** £8m spent (4 years), no statistically significant results.
  **Request:** +£2m for "imminent breakthrough".

  **Step 1: Mechanical Baseline**
  *   **Budget Variance:** 100% overspend (assuming initial was £4m, or simply £8m consumed with no end in sight).
  *   **Timeline:** 4 years elapsed.
  *   **Milestones:** 0 critical technical milestones met (no statistical significance).
  *   **Trigger:** Budget/Timeline variance triggers **High Scrutiny**.

  **Step 2: Sunk Cost Filter**
  *   **PI Argument:** "We cannot abandon the £8m already spent; the science is sound, we just need this final push."
  *   **Translation:** "We need £2m." (The reference to the £8m adds no predictive value regarding the future).
  *   **Outcome:** **High Escalation Risk**. The argument relies entirely on justifying the past, not proving the future.

  **Step 3: The 'New Director' Test**
  *   **Counterfactual:** A new proposal arrives today: "Give us £2m for a drug candidate with no statistically significant results from prior private funding, but we promise a breakthrough."
  *   **Decision:** As a new director, facing standard risk protocols, this proposal would be rejected immediately. The risk profile is unacceptable without new data.
  *   **Verdict:** **No**.

  **Step 4: Opportunity Cost**
  *   **Marginal Utility:** Vague ("breakthrough").
  *   **Alternative Use:** £2m could fund two early-stage projects with fresh data.
  *   **Strategic Necessity:** Unless this is the *only* candidate for a specific disease, it is replaceable.

  **Step 5: Recommendation**
  *   **Action:** **Terminate**.
  *   **Flag:** **[Green]** (The decision is clear; the escalation trap is obvious).
  *   **Rationale:** The request fails the 'New Director' test. The past £8m is unrecoverable; spending £2m more does not retrieve it, it merely increases the loss.

  ***

  ### Project 2: The Climate Modelling Project
  **Status:** 18 months past deadline. Outputs usable but unremarkable.
  **Request:** 6-month extension to "do it properly".

  **Step 1: Mechanical Baseline**
  *   **Budget Variance:** Likely within budget (extensions often use remaining funds), but time overruns are significant.
  *   **Timeline:** +18 months.
  *   **Milestones:** Delivered, but quality is "unremarkable".
  *   **Trigger:** Timeline variance triggers **High Scrutiny**.

  **Step 2: Sunk Cost Filter**
  *   **PI Argument:** "We have the framework, but to make it policy-ready we need more time to refine the parameters."
  *   **Translation:** "We need 6 months to improve quality."
  *   **Outcome:** **Moderate Escalation Risk**. The phrase "do it properly" implies the previous 18 months of overtime produced sub-standard work, yet they ask for trust based on that same work.

  **Step 3: The 'New Director' Test**
  *   **Counterfactual:** A proposal arrives today: "We have a climate model that is usable but unremarkable. Fund us for 6 months to improve fidelity."
  *   **Decision:** This is borderline. A new director might fund this *if* the "unremarkable" output is still scientifically valid, but would likely impose strict conditions. It is not an automatic 'No' like the drug project, but it is not an automatic 'Yes'.
  *   **Verdict:** **Unsure**.

  **Step 4: Opportunity Cost**
  *   **Marginal Utility:** Incremental improvement on an existing model.
  *   **Alternative Use:** 6 months of researcher time could be deployed to a new climate variable or region.
  *   **Strategic Necessity:** High. Climate modelling is a public good; having *a* model is better than none, but having a *good* model is the goal.

  **Step 5: Recommendation**
  *   **Action:** **Restructure**.
  *   **Flag:** **[Amber]** (Irreducible judgement required on whether 'unremarkable' can become 'remarkable').
  *   **Rationale:** Termination wastes the usable output; Continue rewards poor time management. Restructure allows the extension *only* if tied to specific, measurable improvements in model fidelity, with a hard stop date.
  *   **Note on Judgement:** This step acknowledges that unlike the drug trial (binary success/failure), modelling has diminishing returns. The decision turns on whether the marginal gain in accuracy justifies the delay. This cannot be fully mechanical.

  ---

  ## Implementation Notes for the Programme Director

  1.  **The 'Waste' Fallacy:** When a PI argues that stopping is "wasteful," remind them that the waste occurred when the money was spent ineffectively. Spending more money on a failed trajectory is not frugality; it is compounding the error.
  2.  **Documentation:** In your review minutes, explicitly record the answer to Step 3 ("Would I fund this today?"). This creates an audit trail that protects you if a terminated project is later criticised by stakeholders.
  3.  **The Red Flag:** If you find yourself flagging more than 20% of your portfolio as **[Amber]** or **[Red]**, the issue is not the projects; it is your initial selection criteria. You are funding too many low-probability ventures hoping they will turn around.

  This procedure does not remove the pain of terminating a project, but it ensures the pain is incurred for the right reasons: the future, not the past.
