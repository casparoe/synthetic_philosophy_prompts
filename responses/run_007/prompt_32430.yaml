prompt: |-
  I've been going down a rabbit hole reading about Bell's theorem and the foundations of quantum mechanics, and I feel like I'm either missing something huge or the physics community is collectively underreacting to something. So Bell's theorem says that if you assume locality and realism, you get an inequality that quantum mechanics violates — and then the experiments (Aspect, Zeilinger, etc.) confirm the violation. So that means nature is non-local, right? Like, we've actually proved that there's genuine faster-than-light causation happening between entangled particles. That seems like a way bigger deal than most popular physics writing makes it out to be.

  But then I see people saying things like "quantum mechanics is fully compatible with special relativity" and "there's no conflict." And I don't get how that can possibly be true if we've empirically demonstrated non-locality. Is the idea just that the non-locality can't be used to send signals, so it's a kind of "benign" faster-than-light influence that doesn't let you build a tachyonic antitelephone? That feels like a cop-out. Or is there something wrong with how I'm understanding what Bell's theorem actually proves? Because it seems to me like we've ruled out locality and confirmed spooky action at a distance, end of story, and the rest is just physicists not wanting to admit that Einstein was right to be worried.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Query:**
      *   **Core Question:** Does Bell's theorem + experimental violation prove genuine faster-than-light (FTL) causation/non-locality, and if so, why do physicists claim compatibility with Special Relativity (SR)?
      *   **User's Stance:** Feels like they are missing something or the physics community is underreacting. Believes Bell's theorem proves "spooky action at a distance" (non-locality) is real and FTL. Finds the "no signaling" excuse to be a "cop-out."
      *   **Emotional Tone:** Frustrated, skeptical of the consensus, feels like there's a conspiracy or a huge oversight ("collectively underreacting," "Einstein was right to be worried").
      *   **Key Concepts Involved:** Bell's Theorem, Locality, Realism, Entanglement, Special Relativity, No-Communication Theorem, Interpretations of QM.

  2.  **Deconstruct the Physics:**
      *   *Bell's Theorem:* It rules out *Local Realism*. It does *not* rule out Locality alone or Realism alone. It rules out the conjunction.
      *   *The Violation:* Experiments show QM predictions are correct. Therefore, Local Realism is false.
      *   *Option A: Non-Local Realism (Bohmian Mechanics):* Keep realism, drop locality. This implies FTL influence.
      *   *Option B: Local Non-Realism (Copenhagen/Many Worlds):* Keep locality, drop realism (or redefine it).
      *   *Special Relativity (SR):* Prohibits FTL *signaling* (information transfer) to preserve causality (no closed timelike curves). It does not necessarily prohibit all forms of correlation or "influence" if they cannot carry information.
      *   *No-Communication Theorem:* Entanglement cannot be used to transmit classical information.
      *   *The "Conflict":* The tension arises if one insists on a specific ontological picture (like hidden variables) that requires dynamical FTL mechanisms. If one accepts standard QM formalism, there is no conflict with SR because the wavefunction evolution (in QFT) is local, and measurements are correlated but not causally connected in a signaling sense.

  3.  **Address the User's Misconceptions:**
