answer: |-
  Dear Friend,

  It is completely understandable that you are looking for clarity on this, not just for the sake of philosophical consistency, but because this question sits at the heart of your relationship with your cousin. When abstract ethics collide with family loyalty and the reality of service, the stakes feel incredibly high. You are right to be suspicious of passages that offer a neat resolution to a messy problem, especially when that resolution aligns perfectly with what we hope is true. The passage you found is a competent summary of what is known as the traditional view of just war theory, largely associated with philosophers like Michael Walzer, but it does smooth over some significant cracks in the argument. To help you see where the ground is solid and where it is shifting, I will walk through the claims in the text as they appear, distinguishing between what the theory actually says, where it simplifies complex realities, and how modern critics have challenged it.

  The passage begins on firm ground when it states that traditional just war theory keeps two questions apart: whether a war is just to begin with, which is the jus ad bellum question, and how the war is fought, which is the jus in bello question. It is accurate to say that on the standard view, these are treated as independent. This separation is the engine that drives the doctrine of the moral equality of combatants. The text is also correct that this doctrine asserts a soldier fighting for an unjust cause has the same moral rights as one fighting for a just cause. So far, the passage is faithfully reporting the traditional consensus that dominated the twentieth century. It accurately describes the conclusion that soldiers on both sides are permitted to kill enemy combatants and forbidden to kill civilians, and that, under this specific framework, we can condemn a war as aggression while still honoring the aggressor's soldiers for fighting honorably. If your goal is to understand the traditional logic that allows society to separate the policy from the person, this passage describes that logic well.

  However, the passage begins to slide into something more convenient than true when it offers the justification for this equality. It claims that soldiers have equal rights because they cannot be expected to judge whether their country's cause is just, and in any case, they are only following lawful orders. A careful defender of the traditional view would accept the first part, the epistemic claim that soldiers often lack the information or position to judge national policy. This is the strongest philosophical pillar of the moral equality of combatants. But the second part, the claim that they are only following lawful orders, is a conflation that critics pounce on. In international law, specifically since the Nuremberg trials, following orders is not an absolute defense against moral or legal culpability, particularly regarding war crimes. By invoking lawful orders as a blanket shield for the justice of the war itself, the passage leans on a legalistic convenience that does not hold up under moral scrutiny. It suggests a passivity that absolves soldiers of agency more completely than most ethicists are comfortable with today. Furthermore, the passage states that neither side's soldiers may be held personally responsible for the war's crimes. This is an overstatement even within traditional theory, which usually reserves responsibility for leaders and policymakers, but it presents this as a settled fact rather than a contentious normative claim.

  This is precisely where a revisionist critic like Jeff McMahan would argue the argument goes wrong. McMahan and other revisionists do not accept the separation of the two questions. They argue that the moral status of a soldier's actions depends fundamentally on the justice of the cause. To use a domestic analogy, if a criminal attacks a police officer, the officer has a right to use force to stop him, but the criminal does not have an equal right to use force against the officer. The criminal is acting unjustly, and his violence is not morally permissible just because he is engaged in a fight. McMahan argues that war is similar. If a war is unjust, the soldiers fighting it are essentially participating in a large-scale wrongful harm. Therefore, they do not have the same moral right to kill as soldiers fighting in self-defense. For the revisionist, the moral equality of combatants is a myth that obscures the reality that killing in an unjust war is closer to murder than to self-defense, unless specific excusing conditions are met.

  The exact step where McMahan says the traditional argument fails is the assumption that the uniform itself grants moral permission. He argues that the right to kill in war derives from the right to self-defense or the defense of others. If you are the aggressor, you have forfeited your right not to be harmed, but you have not gained a right to harm those who are defending themselves. Therefore, the justice of the cause determines the moral permissions of the soldier. When the passage you read claims that the justice of the war has no bearing whatsoever on the moral situation of the soldiers, McMahan would say this is simply false. He would argue that the moral situation is deeply bearing on the justice of the war, and that treating them as independent is a way to protect the state's interest in recruiting soldiers without burdening them with moral guilt, rather than a reflection of moral truth.

  So, does the reassuring conclusion about your cousin survive these corrections? This is the most important part for you. The traditional view allows you to honor him because it says his actions were morally permissible. The revisionist view makes this more complicated but does not necessarily demand you condemn him. Under the revisionist view, even if fighting in an unjust war is objectively wrong, a soldier can be blameless for doing it. This is the distinction between justification and excuse. A soldier might not be justified in fighting an unjust war, but he may be excused if he reasonably believed the war was just, or if he faced significant duress, social pressure, or legal coercion to serve. McMahan himself acknowledges that most soldiers are not morally culpable for fighting in unjust wars because they are often epistemically limited, meaning they genuinely could not know the war was unjust, or they are bound by civic obligations that are hard to break.

  Therefore, you can accept the revisionist critique that the war itself was wrong and that, strictly speaking, the moral equality of combatants is flawed, without concluding that your cousin did something blameworthy. You can hold that the war was unjust while honoring your cousin for serving with honor, integrity, and loyalty under conditions where he was not positioned to make the final moral call. The passage you read offers you a clean separation that lets you stop fighting with your cousin, and while the philosophical machinery behind it is contested, the human conclusion remains robust. You do not need the doctrine of moral equality to love and respect him. You only need to recognize that his service was conducted within a framework of duty and limited knowledge, and that his character is not defined solely by the geopolitical justice of the conflict he was sent to. The philosophy might be messier than the book suggests, but the grace you wish to extend to your cousin is philosophically defensible even without the traditional shield. You can condemn the decision to go to war while honoring the person who went, not because the killing was morally equal to that of a defender, but because the soldier was acting within the bounds of reasonable belief and civic duty. This allows you to be intellectually honest about the war without being unjust to the man who fought it.
