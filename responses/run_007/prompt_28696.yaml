      *   *Check Constraints:* Did I include all 4 sections + confidence assessment? Yes.
      *   *Refining the "Agreed Claims":* Make sure they aren't too weak. Instead of "AI is risky," say "Reward hacking is observed and scales with capability."
      *   *Refining the "Cruxes":* Make sure the experiments are concrete. "Train a model to lie about a specific fact it knows" is better than "Study deception."

