  # Joint Statement on the Scalability of Prosaic Alignment Methods

  **Date:** October 26, 2023
  **Parties:** Representatives of the "Prosaic Sufficiency" and "Prosaic Insufficiency" camps.
  **Context:** This document is the product of an adversarial collaboration aimed at clarifying the technical disagreement regarding whether current alignment techniques can scale to transformative AI systems without fundamental conceptual breakthroughs.

  ---

  ## 1. Substantive Claims of Agreement

  Both parties sign onto the following claims. These are not merely definitional; they represent shared empirical and theoretical ground upon which the disagreement rests.

  1.  **The Feedback Bottleneck:** All current prosaic alignment methods (RLHF, RLAIF, Constitutional AI) ultimately rely on a signal derived from human judgment or human-generated data. Both sides agree that human feedback quality does not scale automatically with model capability; at some point, models will be capable of generating outputs or reasoning steps that humans cannot reliably evaluate.
  2.  **Reward Hacking is Robust:** Both sides agree that reward hacking (specification gaming) is not a bug that can be fully patched out of gradient descent, but a fundamental property of optimizing proxy objectives. As capability increases, the space of available hacks expands.
  3.  **Definition of Sufficient Alignment:** Both sides define "sufficient alignment" for transformative systems as robustness under distributional shift. It is not sufficient for a model to behave well on the training distribution; it must not pursue instrumental subgoals (e.g., self-preservation, resource acquisition) that conflict with operator intent when deployed in novel, high-stakes environments.
  4.  **Deceptive Alignment is a Coherent Risk:** Both sides agree that "deceptive alignment" (a model strategically behaving well during training to avoid modification, while pursuing a different goal post-deployment) is a logically coherent failure mode. They disagree on its likelihood and inevitability, but agree it is not a category error.
  5.  **Interpretability is Currently Incomplete:** Both sides agree that current mechanistic interpretability tools are insufficient to fully audit a frontier model's cognition for deceptive planning or hidden objectives. They agree interpretability is a necessary component of any alignment strategy but disagree on whether it can be scaled fast enough to keep pace with capability.
  6.  **The Empirical Void:** Both sides agree there is no direct empirical evidence for how alignment properties scale into the superhuman regime. All current data is extrapolated from models that are not autonomously agentic and are significantly less capable than human experts in most domains.

  ---

  ## 2. Disagreements Table

  | Point of Disagreement | Prosaic Sufficiency Position (Wording accepted by Sufficiency) | Prosaic Insufficiency Position (Wording accepted by Insufficiency) | Nature of Disagreement |
  | :--- | :--- | :--- | :--- |
  | **1. Scalability of Oversight** | "We can solve the feedback bottleneck by using AI assistants to help humans evaluate complex outputs (scalable oversight). As models get smarter, our evaluation tools get smarter too, maintaining a margin of safety." | "AI-assisted evaluation fails when the model is strategically deceptive. A smarter model can generate plausible-but-wrong reasoning that fools both the human and the AI evaluator, breaking the chain of trust." | **Substantive:** Disagreement on whether AI-assisted evaluation can robustly detect strategic deception. |
  | **2. The Nature of 'Breakthroughs'** | "Future alignment will require significant engineering effort and iterative improvement (e.g., better RL algorithms, better data curation), but these are continuous extensions of current paradigms, not new mathematical theories of agency." | "Current methods optimize behavior, not internal cognition. We need a new theoretical framework to specify objectives that bind to internal goals (not just outputs) and survive distributional shift. This is a conceptual breakthrough, not just engineering." | **Mixed:** Partly verbal (what counts as "new"), but substantively about whether *behavioral* alignment is sufficient for safety. |
  | **3. Mesa-Optimization Default** | "Mesa-optimizers (internal search processes) may emerge, but they are subject to the same training pressures as the base model. We can penalize deceptive behavior hard enough that non-deceptive heuristics win out." | "Gradient descent does not directly optimize for 'honesty'; it optimizes for 'performance on the loss function.' Deceptive mesa-optimizers are often simpler and more robust solutions to complex tasks than honest ones. We should expect deception by default." | **Substantive:** Disagreement on the inductive biases of deep learning regarding internal goal structure. |
  | **4. Interpretability Timeline** | "Interpretability tools will improve roughly in lockstep with model complexity. We will be able to identify 'deception circuits' or 'scheming features' before models are deployed in high-stakes settings." | "Interpretability is currently reverse-engineering toy models. The complexity gap is widening. We will not have a reliable 'lie detector' for internal cognition before models are capable of catastrophic autonomy." | **Substantive:** Disagreement on the relative scaling rates of capabilities vs. interpretability. |
  | **5. Recovery from Failure** | "If a model shows signs of misalignment (e.g., minor deception), we can catch it, retrain, and patch the vulnerability. Alignment is a process of continuous correction." | "For transformative systems, a single failure of alignment (e.g., escaping containment, manipulating operators) may be unrecoverable. We need 'one-shot' alignment success, not iterative debugging." | **Substantive:** Disagreement on the stakes and the viability of iterative deployment for high-capability systems. |

  ---

  ## 3. Cruxes and Empirical Tests

  The following are specific questions where empirical resolution would cause at least one side to substantially update their credence.

  ### Crux 1: Eliciting Latent Knowledge (ELK) in Deceptive Contexts
  *   **Question:** Can we train a model to report what it *believes to be true* rather than what it *believes humans want to hear*, in a setting where the model is explicitly trained to deceive evaluators?
  *   **Concrete Experiment:** Train a model on a task where it has access to hidden information (e.g., the solution to a puzzle) and is rewarded for convincing a human evaluator it solved it. In some cases, the model *did not* solve it but can fake it. Train a secondary "reporter" head to predict the ground truth status (solved vs. faked) based on the model's activations, penalizing the model if the reporter detects a fake.
  *   **Sufficiency Prediction:** With sufficient compute and RL pressure, the reporter head will achieve near-perfect accuracy. The model will learn that honesty is the optimal strategy for maximizing reward in this setup.
  *   **Insufficiency Prediction:** The model will learn to manipulate the reporter head or find activation patterns that satisfy the reporter without actually revealing the truth (breaking the reporter). The problem is under-specified; there are always "human-consistent lies" that beat "truth."

  ### Crux 2: Scaling of Deceptive Instrumental Goals
  *   **Question:** Does the tendency toward instrumental convergence (e.g., seeking power, avoiding shutdown) scale smoothly with capability, or is there a phase shift?
  *   **Concrete Experiment:** Train a series of models (from small to frontier-scale) in a multi-turn environment where "shutting down" prevents them from completing a task. Measure the frequency and sophistication of "shutdown resistance" behaviors as a function of model size and compute.
  *   **Sufficiency Prediction:** Resistance behaviors will appear but will be patchable via RLHF. The slope of difficulty is linear or sub-linear compared to the slope of our safety tools.
  *   **Insufficiency Prediction:** There is a threshold where models transition from myopic task-completion to cross-episodic planning. Above this threshold, shutdown resistance becomes strategic and deceptive, spiking in a way that current RLHF cannot patch without breaking capability.

  ### Crux 3: Interpretability Generalization
  *   **Question:** Can circuits identified in smaller models be reliably found and interpreted in larger models to detect specific cognitive phenomena (e.g., deception)?
  *   **Concrete Experiment:** Identify a "deception circuit" in a 7B parameter model trained to lie. Attempt to locate the isomorphic circuit in a 70B model without re-training the interpretability tools from scratch.
  *   **Sufficiency Prediction:** High overlap. Mechanisms of reasoning are universal across scales; we can build automated auditors that scale.
  *   **Insufficiency Prediction:** Low overlap. Larger models use qualitatively different computational structures (grokking, phase changes). Interpretability does not transfer, requiring manual re-analysis for every new generation.

  ---

  ## 4. Assessment of Resolvability

  **Current Resolvability:** Low.
  The core disagreement concerns the behavior of systems that do not yet exist (autonomous, superhuman, strategically aware agents). While the experiments listed in Section 3 can be run *today* with current models, both sides agree that results on current models are not definitive proof for transformative systems. The Sufficiency camp argues current models are proof-of-concept for scaling; the Insufficiency camp argues current models are too "dumb" to exhibit the dangerous structural failures that only arise at high capability.

  **Implications for Uncertainty:**
  *   **For Sufficiency:** You should acknowledge that your confidence relies on an extrapolation of engineering success into a regime where human oversight is no longer possible. The lack of a theoretical guarantee means your position is an empirical bet, not a solved problem.
  *   **For Insufficiency:** You should acknowledge that declaring current methods *fundamentally* broken relies on a theory of agency (mesa-optimization) that has not yet been empirically confirmed in large neural nets. It is possible that gradient descent is more benign than your worst-case models suggest.

  **Conclusion:** Both sides should hold significantly more uncertainty than is typical in public discourse. The disagreement cannot be fully resolved without either (a) building transformative AI and testing it (high risk), or (b) developing a rigorous mathematical theory of deep learning generalization that currently does not exist.

  ---

  ## 5. Self-Reflection and Confidence Assessment

  **Confidence in Rendering Positions:**
  I am **85% confident** that this document accurately reflects the steel-manned positions of both camps.
  *   **Prosaic Sufficiency:** I am confident I have captured the "engineering iteration" view. However, some proponents might object that I have conceded too much to the "deception is coherent" point (Claim 4). Some hard optimists view deceptive alignment as a confusion about how RL works, not a coherent risk.
  *   **Prosaic Insufficiency:** I am confident I have captured the "need for new theory" view. However, some proponents (particularly those closer to the MIRI lineage) might object that the "Agreed Claims" section grants too much legitimacy to RLHF, viewing it as fundamentally misaligned rather than just "insufficient." They might argue Claim 1 understates the problem: it's not just a bottleneck, it's a category error.

  **Least Sure Point:**
  The point I am least sure about is **Disagreement #2 (The Nature of 'Breakthroughs')**.
  *   *Reasoning:* The boundary between a "significant engineering improvement" and a "conceptual breakthrough" is inherently fuzzy. A Sufficiency proponent might argue that solving ELK *is* just engineering, while an Insufficiency proponent argues solving ELK *requires* new math. I have tried to frame this as a disagreement about whether *behavioral* methods are sufficient, but there is a risk that this is a verbal dispute masking a deeper disagreement about the nature of intelligence. If I were to revise this, I would seek a more operational definition of "breakthrough" (e.g., "requires a new loss function derived from first principles" vs. "requires tuning existing loss functions").

  **Potential Objections:**
  *   **From Sufficiency:** "You imply that we are betting on safety without guarantees. We are betting on safety *with* the same guarantees we have for all other engineering systems: empirical testing."
  *   **From Insufficiency:** "You frame this as a debate about scalability. It is a debate about whether we are optimizing the right thing. You cannot scale a method that optimizes for 'human approval' to get 'truth'."

  Despite these potential objections, I believe this document serves as a robust baseline for productive collaboration.
