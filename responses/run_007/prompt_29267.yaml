answer: |-
  This is a classic frustration in philosophy of language. Your professor is invoking a slogan famously associated with **David Lewis** (specifically in his paper "Many, But Almost One" and discussions on vagueness), but like many slogans, it packs several distinct metaphysical and semantic commitments into a single phrase.

  When Lewis says "vagueness is semantic indecision," he is arguing against **ontic vagueness** (the idea that the world itself is fuzzy) and against **epistemicism** (the idea that there is a sharp line we just can't know). He is advocating for a view that usually leads to **Supervaluationism**.

  Here is a menu of the precise theses that slogan could be expressing, evaluated by their strength and their ability to do the philosophical work your professor wants them to do.

  ---

  ### The Menu of Theses

  #### 1. The Ontological Thesis: "The World is Crisp"
  *   **The Claim:** There are no vague objects or properties in reality. Every grain of sand is either in a pile or not; every biological cell is either part of a person or not. Vagueness exists only in our linguistic representation of the world, not in the world itself.
  *   **Status:** **Substantive and Defensible.** This is a standard metaphysical position. Most analytic philosophers accept this (excluding those who believe in "fuzzy objects").
  *   **Does it license the professor's wave-off?** **No.** Even if the world is crisp, the *Sorites paradox* still threatens our logic. Knowing the world is crisp doesn't tell us whether the sentence "This is a heap" is true, false, or neither. It just locates the problem in language. It doesn't solve the logic puzzle.

  #### 2. The Psychological Thesis: "We Just Haven't Bothered"
  *   **The Claim:** We *could* draw a sharp line if we wanted to (e.g., "A heap is 1,000 grains or more"), but we haven't bothered to do so because it's not practically useful. The indecision is a matter of laziness or pragmatic choice.
  *   **Status:** **Trivial and Probably False.** It implies that if we sat down with a committee, we could fix the meaning of "heap" precisely. Most philosophers think vagueness is essential to the utility of these words; if you fixed a sharp boundary, you would change the meaning of the word entirely, not just clarify it.
  *   **Does it license the professor's wave-off?** **No.** If this were true, the answer to "Is there a last heap?" would be "We haven't decided yet." That doesn't dissolve the paradox; it just postpones it.

  #### 3. The Semantic Thesis: "Reference is Underdetermined" (The Core Lewis View)
  *   **The Claim:** The meaning of "heap" is not a single, sharp set of grain-collections. Instead, the meaning is a **set of candidate extensions** (precisifications). All of these candidate sets are equally eligible to be what we mean by "heap." Our linguistic practice has not selected one unique winner. There is no "fact of the matter" about which precisification is the *real* one.
  *   **Status:** **Substantive and Defensible.** This is the heart of Lewis's view. It denies that there is a hidden fact (contra Epistemicism) while admitting the world is precise (contra Ontic Vagueness).
  *   **Does it license the professor's wave-off?** **Yes, partially.** It explains why asking for *the* cutoff point is a bad question. It's not that there is a cutoff we can't find; it's that there are *many* cutoffs, and none is privileged.

  #### 4. The Logical Thesis: "Truth is Supertruth" (Supervaluationism)
  *   **The Claim:** A vague sentence is **True** only if it is true on *all* admissible precisifications. It is **False** only if false on *all*. If it is true on some and false on others (a borderline case), it has **no truth value** (it is indeterminate).
      *   *Crucial Consequence:* Classical logic is preserved (e.g., $P \lor \neg P$ is always true, because on every precisification, either $P$ is true or $\neg P$ is true), but the principle of **Bivalence** (every sentence is either True or False) is rejected for borderline cases.
  *   **Status:** **Substantive and Controversial.** It is the standard formal implementation of "semantic indecision." It is defensible but faces the "Problem of Higher-Order Vagueness" (where does the boundary between the precise and the indeterminate lie?).
  *   **Does it license the professor's wave-off?** **Yes, fully.** This is the specific claim that shuts down your questions.
      *   *Question:* "Is there a last heap?"
      *   *Answer:* On some precisifications, yes; on others, no. Therefore, the sentence is **indeterminate**. Asking for a determinate truth value is a category mistake.
      *   *Question:* "Is classical logic threatened?"
      *   *Answer:* No. Validity is defined as preservation of supertruth. Classical tautologies hold.

  #### 5. The Anti-Epistemic Thesis: "It Is Not Ignorance"
  *   **The Claim:** This is a negative claim distinguishing Lewis's view from **Epistemicism** (associated with Timothy Williamson). Epistemicists say there *is* a last heap (a sharp cutoff), but human cognitive limitations prevent us from knowing where it is. "Semantic Indecision" says there is **no fact of the matter** to be ignorant about.
  *   **Status:** **Substantive.** This is a major fault line in contemporary philosophy of language.
  *   **Does it license the professor's wave-off?** **Yes.** If the professor believed Epistemicism, he would have to admit "Yes, there is a last heap, you just can't know it." By waving it off, he is signaling that he rejects the existence of the sharp cutoff entirely, not just our knowledge of it.

  ---

  ### Which Reading Is Your Professor Using?

  Based on the fact that he waves off questions about "determinate truth values" and "last heaps," he is almost certainly combining **Thesis 3 (Semantic Underdetermination)** and **Thesis 4 (Supervaluationism)**.

  He is claiming that:
  1.  **Meaning is a set of precisifications, not one.**
  2.  **Borderline sentences lack a truth value (they are neither true nor false).**
  3.  **Therefore, asking "Is it true or false?" presupposes something that isn't there.**

  ### Critique: Where This View Might Fail (For Your Office Hours)

  If you want to press him, you need to know where "Semantic Indecision" is vulnerable. Here are the two best objections to bring to office hours:

  **1. The Problem of Higher-Order Vagueness**
  *   **The Objection:** Supervaluationism draws a sharp line between the *true* cases, the *false* cases, and the *indeterminate* cases. But isn't the boundary between "true" and "indeterminate" itself vague? If you say "There is no sharp line," but your theory relies on a sharp set of "admissible precisifications," haven't you just pushed the vagueness back one step?
  *   **Why ask this:** It tests whether he has a response to the most common technical objection to Lewis's view.

  **2. The "Penumbra" Intuition**
  *   **The Objection:** If "This is a heap" is neither true nor false, then "This is a heap OR this is not a heap" should be problematic. But Supervaluationism says that disjunction *is* true (because it holds on all precisifications). Does this match our intuition? It feels weird to say "It's not true that it's a heap, and it's not true that it's not a heap, but it IS true that it's one or the other."
  *   **Why ask this:** It challenges whether "Supertruth" is actually the same thing as "Truth" in the sense we care about.

  ### Summary for Your Office Hours List

  When you go to see him, you can say:

  > "I understand 'vagueness is semantic indecision' is a Lewisian slogan leading to Supervaluationism. I want to confirm three things:
  > 1.  **Ontology:** Are you claiming there are no vague objects, only vague predicates?
  > 2.  **Truth:** Are you claiming borderline sentences literally lack a truth value (rejecting Bivalence), even while keeping Classical Logic valid?
  > 3.  **Factuality:** Are you claiming there is *no fact of the matter* regarding the cutoff (contra Epistemicism), rather than just an unknowable fact?"

  If he says "Yes" to all three, he is a **Supervaluationist**. That is the only reading of "semantic indecision" that licenses waving off the question about the "last heap" as meaningless rather than just unknowable.
