  3.  **Brainstorming Concepts:**
      *   *Cognitive Offloading:* Too broad, usually refers to memory or simple tasks.
      *   *The Google Effect (Digital Amnesia):* Specifically about memory retrieval, not reasoning structures.
      *   *Deskilling:* Usually economic/sociological, about labor capacity, but applicable to cognitive labor.
      *   *Epistemic Dependence/Trust:* Relying on others for knowledge.
      *   *Illusion of Explanatory Depth:* Thinking you know how something works until asked to explain.
      *   *Automation Bias:* Over-relying on automated systems.
      *   *Cognitive Atrophy:* General term for losing mental sharpness.
      *   *Epistemic Laziness:* Moralizing, not descriptive.
