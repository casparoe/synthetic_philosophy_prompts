answer: |-
  This is a sophisticated and well-known cluster of intuitions. In philosophical terms, you are advocating for a **Non-Branching Psychological Continuity Theory** with a **Causal Continuity Constraint**.

  Your view is internally *mostly* consistent, but there is a significant fault line between your commitment to **substrate independence** (functionalism) and your rejection of **destructive uploading**.

  Here is the consistency check, the tension ranking, and the proposed fixes.

  ### Part 1: Pairwise Analysis

  **1. Gradual Replacement vs. Destructive Upload**
  *   **Your Verdicts:** Gradual = Survival; Destructive Upload = Death.
  *   **The Tension:** **High.** In both cases, the end result is a functioning entity on a new substrate with your memories and character. In Gradual Replacement, the physical process is continuous (neuron $N$ is replaced by chip $C$ while the system runs). In Destructive Upload, the physical process is discontinuous (brain destroyed, data transferred, simulation started).
  *   **The Conflict:** You state "substrate doesn't matter, only what it does." If the *function* is preserved in the upload, why does the *method of transfer* kill you? If you accept Gradual Replacement, you accept that identity can migrate from biology to silicon. If you reject Destructive Upload, you are implicitly saying that *spatiotemporal continuity of the physical process* matters more than the functional outcome. This contradicts pure substrate independence.

  **2. Nondestructive vs. Destructive Upload**
  *   **Your Verdicts:** Nondestructive = Copy (No Survival); Destructive = Copy (No Survival).
  *   **The Tension:** **Low/None.** This is the most consistent part of your view. You are applying the "Closest Continuer" or "Non-Branching" rule correctly here. The presence or absence of the original body does not change the metaphysical status of the upload. If the upload is a copy when you live, killing you doesn't magically transubstantiate the copy into you. This is logically sound (often called the "Extrinsicness Objection" to identity).

  **3. Fission vs. Psychological Continuity**
  *   **Your Verdicts:** Fission = Cannot survive as both (implies death or indeterminate identity).
  *   **The Tension:** **Medium.** Pure Psychological Continuity suggests that if psychology is what matters, and both hemispheres preserve your psychology, you survive as both. By saying you *cannot* survive as both, you are prioritizing **Logical Identity** (which must be 1-to-1) over **Psychological Continuity** (which can be 1-to-many).
  *   **The Conflict:** This requires you to add a "Non-Branching Clause" to your theory. You need to explain why continuity is sufficient for survival in the Gradual case (1-to-1) but not in the Fission case (1-to-2).

  ---

  ### Part 2: Ranking the Tensions by Severity

  1.  **Gradual Replacement vs. Destructive Upload (Critical).**
      This is the "Teletransportation Paradox." It is the hardest tension to resolve because it pits your **Functionalism** (substrate doesn't matter) against your **Process Intuition** (copying isn't traveling). If you truly believe only the *pattern* matters, the speed or continuity of the transfer shouldn't determine life or death.
  2.  **Fission vs. Identity (Moderate).**
      This is a standard problem for Psychological Continuity Theories. It is resolvable, but it requires you to admit that "Identity" is not what matters, or that Identity requires a "No Branching" rule that feels arbitrary.
  3.  **Nondestructive vs. Destructive Upload (Negligible).**
      As noted, these are consistent. Many people intuitively feel Destructive Upload *should* be survival if Nondestructive isn't, but your view that *neither* is survival is logically stable.

  ---

  ### Part 3: The Fixes

  #### The Cheapest Fix: Explicitly Add a "Causal Continuity" Constraint
  You can keep all your current verdicts (Gradual = Yes, Upload = No) if you refine your definition of "Psychological Continuity."

  Currently, you say: *"What matters... is an overlapping chain of memories, character, intentions."*
  **Revision:** *"What matters is an overlapping chain of memories... **caused by the right kind of continuous physical process.**"*

  *   **Why it works:** In Gradual Replacement, every state is causally dependent on the immediate previous state in an unbroken chain. In Scanning/Uploading, the causal chain is broken; the upload is caused by a *data structure*, not by the *functional activity* of the previous brain states.
  *   **Cost:** You have to admit that substrate independence isn't absolute. The *history* of the substrate matters, not just its current function. You are no longer a pure Functionalist; you are a **Causal Continuity Theorist**.

  #### The Single Revision That Cleans Up the Most: Accept Destructive Upload as Survival
  If you want your view to be maximally consistent with your premise that **"substrate doesn't matter, only what it does,"** you should change your verdict on Destructive Upload.

  *   **The Revision:** Admit that if a nondestructive scan creates a copy, a destructive scan creates *you* in the new substrate.
  *   **Why it cleans up the most:**
      1.  **Resolves Gradual vs. Upload:** Both become cases of successful migration. The speed of the transfer (slow replacement vs. fast scan) becomes irrelevant, which aligns with substrate independence.
      2.  **Resolves Fission:** You can adopt the Parfitian view: "Identity" doesn't matter, "Survival" (psychological continuity) does. In Fission, *you* (strict identity) don't survive, but *what matters* survives twice. This removes the need for arbitrary "Non-Branching" rules to define death.
      3.  **Aligns with Functionalism:** It honors your core claim that the soul/ego/body doesn't matter, only the information processing.
  *   **Cost:** You have to overcome the deep intuition that "copying is not traveling." You have to accept that "death" is not a binary switch but a matter of degree of continuity.

  ### Summary Recommendation
  Your view hangs together **only if** you implicitly rely on a **Causal Continuity Constraint** (The Cheapest Fix). Without that, your acceptance of Gradual Replacement contradicts your rejection of Uploading.

  However, if you want the most philosophically robust position that aligns with your stated belief that **"substrate doesn't matter,"** you should make the **Single Revision** to accept Destructive Upload as survival. This moves you from a "Non-Branching Psychological Continuity" view to a **"Reductionist/Parfitian"** view, which eliminates the tension between your metaphysics (functionalism) and your ethics (survival).
