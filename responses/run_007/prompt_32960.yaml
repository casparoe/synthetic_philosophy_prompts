  2.  **Determine the Core Argument (Responsibility Gap):**
      *   The "responsibility gap" thesis (often associated with Andreas Matthias, Danaher, etc.) suggests that autonomous systems (especially learning ones) create a disconnect between human action and outcome that traditional responsibility frameworks (causal control, epistemic control) cannot bridge.
      *   Key distinction: It's not just about unpredictability (accidents) or failure of duty (negligence). It's about the *structure* of agency and control.
