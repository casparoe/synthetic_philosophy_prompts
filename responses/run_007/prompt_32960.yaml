  5.  **Drafting the text:**
      "You're right that negligence and accident cover much of our moral landscape, but you're underestimating the structural discontinuity introduced by machine learning. In ordinary complex systems, emergent behavior is still traceable to fixed rules set by designers; here, the system rewrites its own decision criteria post-deployment, creating an epistemic opacity that severs the link between human intent and machine action. If we blame designers for outcomes they literally could not predict because the system learned them independently, we dilute the concept of negligence until it means strict liability, which violates the control principle. Conversely, calling it a mere 'accident' ignores that the harm stems from goal-directed agency, just not *human* agency. The gap isn't about unpredictability per se, but about the absence of a moral agent who had meaningful control over the specific decision-making process at the time of harm, leaving us with damage that demands accountability but no agent capable of bearing it."

