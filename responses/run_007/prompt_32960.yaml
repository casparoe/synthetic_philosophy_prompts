      *   *Push back on the "ordinary complex system" analogy:* Traditional complex systems (like a car engine or even standard software) are deterministic or predictable in principle. Learning systems change their own decision rules post-deployment.
      *   *Highlight the epistemic/control gap:* The designer loses control *because* the system learns. The operator lacks understanding *because* of opacity (black box).
      *   *Maintain the gap:* If neither has meaningful control or knowledge at the time of action, blaming them stretches moral responsibility beyond its breaking point. It's not just an accident; it's a structural exclusion of moral agents from the causal chain.
