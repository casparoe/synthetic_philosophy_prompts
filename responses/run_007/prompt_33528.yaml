      *   *This is the key.* V1 allows static analysis. V2 forces dynamic execution which leads to deadlock for conditional strategies.

  12. **Final Polish:** Ensure the business partner framing remains consistent. Keep the logic tight. (Self-check: Did I address the "unconditional declaration" part? Yes. Did I address the "cheating" objection? Yes.)

