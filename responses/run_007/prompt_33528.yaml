      *   *Version 2 (Opaque/Probing):* Sealed envelopes. Can send a messenger to ask the envelope "What if...?"

  4.  **Developing Version 1 (Transparent/Source Code):**
      *   *Strategy:* "Mirror Strategy."
      *   *Note Text:* "I will Invest if and only if I verify that your note contains the exact same text as this one."
      *   *Reasoning:* If both write this, they match. Both verify the match. Both Invest. If one deviates (writes "Always Withhold"), the other sees the mismatch and Withholds.
      *   *Equilibrium:* Mutual Cooperation is stable. Deviation leads to Defection (punishment).

  5.  **Developing Version 2 (Opaque/Probing):**
      *   *Strategy:* Trying to replicate the Mirror Strategy.
      *   *Note Text:* "I will Invest if and only if your probe response indicates you will Invest when I Invest."
