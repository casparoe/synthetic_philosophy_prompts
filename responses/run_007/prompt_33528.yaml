      *   *Scenario:* Alice asks Bob's note: "If I Invest, what do you do?" Bob's note says: "I need to know what you do first." Alice says: "I'm asking you!" Bob says: "I'm asking you!" -> Infinite Regress/Deadlock.
      *   *Alternative:* Bob's note says "I always Invest." Alice probes: "If I Invest, what do you do?" Bob: "Invest." Alice: "Great, I'll Withhold (free ride)." Bob gets sucker's payoff. Cooperation fails because the commitment isn't *conditional* on the other's commitment in a verifiable way, only on the other's *action*.
      *   *Key Distinction:* In V1, I verify the *rule*. In V2, I verify the *outcome*. Verifying the rule allows me to say "I will do X *because* you are committed to X." Verifying the outcome just tells me "You will do X." If you are committed to X regardless of me, I should Defect. If you are committed to X *only if* I do X, we deadlock.

