answer: |-
  This is a fantastic question. You have put your finger on the exact friction point that separates "Program Equilibrium" (Tennenholtz, 2004) from standard game theory, and from later developments like "Logical Decision Theory" or "Löbian Cooperation."

  Your intuition is correct: the distinction between **reading the source** (intensional access) and **probing the output** (extensional access) is not just a technicality; it is the entire engine that makes the cooperation result work. Without source-code access, the mechanism collapses into either infinite regress or vulnerability to exploitation.

  Here is the thought experiment built to your specs, followed by the analysis of why the distinction breaks the equilibrium in the probing version.

  ***

  ### The Thought Experiment: The Investment Pact

  **The Players:** Alice and Bob, two business partners.
  **The Game:** A one-shot Prisoner's Dilemma regarding a joint venture.
  *   **Invest (Cooperate):** Costs \$10, generates \$30 for the *other* partner.
  *   **Withhold (Defect):** Costs \$0, generates \$0 for the *other* partner.
  *   **Payoffs:**
      *   Both Invest: Net +\$20 each.
      *   Alice Invests, Bob Withholds: Alice -\$10, Bob +\$30.
      *   Both Withhold: \$0 each.

  **The Mechanism:** Before the money changes hands, they exchange **Commitment Notes**. These notes dictate how they will act. The notes are exchanged simultaneously. Once exchanged, the instructions in the notes are binding (think of them as smart contracts or legally binding pre-commitments).

  ---

  ### Version 1: The Transparent Ledger (Source-Code Access)

  In this version, the Commitment Notes are written in clear text on glass plates. When they exchange notes, they can read the **entirety** of the other person's logic, conditionals, and criteria.

  **Alice's Strategy (The Mirror Clause):**
  Alice writes the following text on her note:
  > "I will **Invest** if and only if the text on Bob's note is character-for-character identical to the text on this note. Otherwise, I will **Withhold**."

  **Bob's Strategy:**
  Bob decides to adopt the exact same strategy. He writes the exact same text on his note.

  **The Execution:**
  1.  They exchange notes.
  2.  Alice reads Bob's note. She sees the text matches hers exactly.
  3.  Bob reads Alice's note. He sees the text matches his exactly.
  4.  According to the condition in the notes, both trigger the **Invest** action.

  **Why this is an Equilibrium:**
  *   **Mutual Cooperation:** Both get +\$20.
  *   **Deviation Check:** Suppose Bob tries to cheat. He writes a note that says: "I will always **Withhold**."
      *   Alice reads Bob's note. She sees the text does *not* match hers.
      *   Alice's note instructs her to **Withhold**.
      *   Result: Both Withhold. Bob gets \$0.
  *   **Conclusion:** Bob gains nothing by deviating. In fact, if he tries to write a note that says "I will Invest no matter what" (to be nice), Alice's note will see the mismatch and Withhold, making Bob a sucker (-\$10). The only way to get Alice to Invest is to match her conditional logic exactly.

  **Verdict:** Mutual Cooperation is a stable Program Equilibrium.

  ---

  ### Version 2: The Black Box (Probing Only)

  In this version, the Commitment Notes are sealed inside opaque computers. You cannot read the text. You can only send a **Query Messenger** to the other person's computer with a hypothetical scenario, and the computer must return an answer.

  **The Constraint:** You cannot see the code. You can only ask: *"If I choose Action X, what will you do?"*

  **Alice's Strategy (The Probe Clause):**
  Alice programs her computer to say:
  > "I will **Invest** if and only if Bob's computer answers 'Invest' when I ask 'What if I Invest?' **AND** answers 'Withhold' when I ask 'What if I Withhold?' (This ensures Bob is conditional, not a sucker)."

  **Bob's Strategy:**
  Bob, wanting to cooperate, programs his computer with the exact same logic:
  > "I will **Invest** if and only if Alice's computer answers 'Invest' when I ask 'What if I Invest?' **AND** answers 'Withhold' when I ask 'What if I Withhold?'."

  **The Execution (The Deadlock):**
  1.  Alice's computer sends a query to Bob's computer: *"Hypothetical: Alice Invests. What do you do?"*
  2.  Bob's computer receives the query. To answer, it must run its own program logic.
  3.  Bob's program logic says: *"First, I must check Alice's commitment. I need to ask Alice: 'Hypothetical: Bob Invests. What do you do?'"*
  4.  Bob's computer sends a query back to Alice's computer.
  5.  Alice's computer is still waiting for Bob's answer to step 1. It cannot answer step 4 until step 1 is resolved.
  6.  **Result:** Infinite Regress / Stack Overflow. The computers hang. No decision is reached.

  **Attempted Fix (The "Sucker" Vulnerability):**
  To avoid the deadlock, Alice simplifies her program. She decides not to check if Bob is conditional. She just checks if he cooperates.
  > **Alice's New Program:** "I will **Invest** if Bob's computer answers 'Invest' to the query 'What if I Invest?'."

  > **Bob's Program (still trying to be safe):** "I will **Invest** only if Alice proves she is conditional."

  *   **Outcome:** Alice asks Bob "What if I Invest?" Bob tries to check Alice's conditionality. Alice's new program doesn't have an answer for "What if I Withhold?" (or defaults to Invest). Bob detects Alice is not conditional (she might be an "Always Invest" bot). Bob classifies Alice as a potential sucker or unpredictable, and **Withholds** to protect himself. Alice Invests (based on her simple rule). Alice loses \$10.

  *   **Alternative Outcome (Both Simple):** If both programs just ask "What if I Invest?" and both answer "Invest," they both Invest. **But this is not an equilibrium.**
      *   Why? Because Alice can secretly swap her program for **"Always Withhold."**
      *   When Bob probes "What if I Invest?", Alice's new program lies (or rather, outputs) "Invest" to trigger Bob, but then actually Withholds during the real game.
      *   *Wait, the spec says the notes are binding.* Okay, if the notes are binding, Alice cannot lie in the probe.
      *   **The Real Failure:** If the probe is binding, then an "Always Invest" program is indistinguishable from a "Mirror" program via probing *only on the cooperation branch*.
      *   If I am Bob, and I probe you: "What if I Invest?" You say "Invest."
      *   I don't know if you are doing this because (A) You mirror me, or (B) You are a sucker who always invests.
      *   If (A), I should Invest. If (B), I should Withhold (free ride).
      *   In Version 1 (Source Code), I can distinguish (A) from (B) by reading the text. In Version 2 (Probing), I cannot distinguish them without also probing "What if I Defect?"
      *   If I probe "What if I Defect?" and you say "Withhold," I know you are conditional. But now we are back to the **Deadlock** problem: If we are both conditional, we both need to probe each other's defection branch to verify safety, which triggers mutual simulation and hangs the system.

  **Verdict:** Mutual Cooperation fails to be a robust equilibrium. Either the verification process deadlocks (infinite regress), or one party must simplify their check and become vulnerable to exploitation (or fail to distinguish a partner from a sucker).

  ***

  ### Analysis: What Feature Is Doing the Work?

  The feature driving the difference is **Intensionality vs. Extensionality**.

  *   **Version 1 (Source Code) is Intensional:** You are evaluating the *definition* of the function. You can check `if Code_A == Code_B`. This is a static check. It does not require *running* the other program. It treats the program as data. This breaks the infinite regress because neither program needs to simulate the other to verify the condition; they just compare text strings.
  *   **Version 2 (Probing) is Extensional:** You are evaluating the *behavior* of the function. To know what the other program does, you must *run* it (or simulate it). If both programs are conditional on the other's behavior, running Program A requires running Program B, which requires running Program A. This creates a circular dependency that leads to a halting problem.

  **The Minimal Informational Requirement:**
  For Program Equilibrium to work without a mediator, you need **access to the decision rule, not just the decision outcome.** You need to know *why* the other person is cooperating, not just *that* they are cooperating. Specifically, you need to verify that their cooperation is *contingent* on yours in a way that doesn't require infinite recursion to verify.

  ### Addressing Your Friend's Objections

  **1. "The Full-Reading Version is Cheating"**
  Your friend argues that in real life, you can never fully read someone's conditional policy. They have a strong point. Version 1 assumes a level of transparency that is rarely available in human interaction. We cannot read each other's "source code."
  *   **However:** Version 2 is *too weak*. It assumes total opacity.
  *   **The Middle Ground:** Real-world Program Equilibrium happens through **costly signaling** and **institutional constraints**.
      *   If Alice signs a legally binding contract that penalizes her \$100 if she doesn't match Bob's investment, that contract *is* readable source code. It's an externalized commitment device.
      *   If Alice has a reputation such that defecting would ruin her future business, that reputation acts as "readable code."
      *   So, while Version 1 is an idealization, it models real-world mechanisms (contracts, reputation, transparency laws) better than Version 2. Version 2 models a world where you can test people but never trust their structure, which is a world where cooperation is much harder.

  **2. "What if we remove the probes and make notes unconditional?"**
  If the notes can only say "I will Invest" or "I will Withhold" (no conditionals allowed):
  *   **The Result:** The whole thing collapses back into the standard Prisoner's Dilemma.
  *   **Why:** This is "Cheap Talk."
  *   Alice writes "I will Invest." Bob writes "I will Invest."
  *   But when it comes time to actually move the money, the note is already exchanged. It cannot change based on what the other person does.
  *   Alice thinks: "Bob's note says Invest. That's fixed. So if I Withhold, I get \$30. If I Invest, I get \$20. I'll Withhold."
  *   Bob thinks the same.
  *   Both Withhold.
  *   **Conclusion:** The *conditional* nature of the commitment is essential. But as we saw in Version 2, the conditionality must be **verifiable without simulation**. Unconditional declarations remove the leverage; black-box conditionality creates a deadlock. Only readable conditionality (or its real-world equivalent, like a contract) allows the leverage to work without deadlock.

  ### Summary for Your Argument

  You can tell your friend:

  1.  **You are right:** The distinction matters profoundly.
  2.  **The Reason:** Source-code access allows for **static verification** of logical equivalence (e.g., "We wrote the same rule"). Probing requires **dynamic execution** (e.g., "Let's see what you do").
  3.  **The Consequence:** Dynamic execution of conditional strategies leads to infinite regress (I wait for you, you wait for me). Static verification avoids this.
  4.  **The Real-World Translation:** We don't have telepathic source-code access, but we do have **contracts**. A contract is essentially "readable source code" enforced by a third party. Without contracts (or reputation acting as a proxy for them), we are stuck in the "Probing" version, where cooperation is unstable because we can't distinguish a partner from a sucker without triggering a deadlock.

  The minimal requirement for Program Equilibrium is not just "communication," but **access to the algorithm of decision-making**, not just the output of that algorithm.
