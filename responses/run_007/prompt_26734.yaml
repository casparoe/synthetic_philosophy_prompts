      *   *Self-Help Stoicism:* Often blurs the line, suggests we control our actions/efforts, or uses the Trichotomy (William Irvine) to make it more palatable.
      *   *The Tension:* If only my *assent* is up to me, does that make me passive? If fate determines my assent, is it really up to me? If I care about my job (which is external), how can I be happy if happiness depends only on the internal?

