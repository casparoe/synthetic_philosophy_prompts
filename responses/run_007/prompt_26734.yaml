          *   *Likely Reply:* Compatibilism. Freedom is acting according to nature/reason, not uncaused causation.
          *   *Follow-up:* If my reason is shaped by genetics/upbringing (which aren't up to me), isn't my "choice" just the end of a causal chain I didn't start?

      *   *Topic 3: The Trichotomy (Irvine)*
