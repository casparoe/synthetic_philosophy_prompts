  The task you describe is canonically known as a **Bongard Problem**, named after Mikhail Bongard who introduced them in 1970. However, the cognitive capacity itself lacks a single settled label. In cognitive science, **Concept Learning** is the umbrella term, but it often implies statistical clustering or prototype formation rather than explicit rule articulation. **Rule Induction** is closer, yet frequently refers to logical derivation within a fixed hypothesis space, whereas Bongard solvers must invent the relevant vocabulary (e.g., "inside," "convex") on the fly—a process called **Predicate Invention** in logic. **Abductive Reasoning** captures the inferential leap to the best explanation, but traditionally applies to causal events rather than static visual categories. In AI, **Program Synthesis** describes generating code from examples, which mirrors the output (a rule), but lacks the human element of perceptual grounding and insight. **Structure Mapping Theory** explains the relational alignment between objects but does not fully account for the categorical generalization across distinct figures. Furthermore, while **Few-Shot Learning** describes the data efficiency, it typically refers to classification accuracy in neural networks rather than symbolic explanation. **Visual Reasoning** is too broad, often encompassing scene understanding without rule extraction. Standard IQ analogies measure sequence completion, not rule discovery from sets. It sits at the intersection of perception and logic, a key concern in Cognitive Architecture research. Thus, while adjacent fields describe pieces of the process—perception, relation, logic—no single term encapsulates the rapid, explicit, visual-to-symbolic translation you highlight.

