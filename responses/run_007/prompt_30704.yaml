      *   **Major Tension:** The Spectrum Trilemma (2, 4, 5).
      *   **Secondary Tension:** The Role of Numbers (1 vs 2).
      *   **Tertiary Tension:** Aggregation constraints (6) vs. Continuum (5).
      *   **Recommendations:** Drop (5) is the cleanest fix for a lexical view. Drop (2) & (6) is the fix for a utilitarian view.

