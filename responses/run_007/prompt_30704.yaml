  3.  **Initial Coherence Check (The "Smell Test"):**
      *   *Immediate Red Flag:* (1) says "Dust-specks outcome is clearly the better one" (i.e., prefer specks over torture). (2) says "No finite number of dust specks can outweigh one fifty-year torture."
