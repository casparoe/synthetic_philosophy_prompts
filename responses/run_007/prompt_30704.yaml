      *   **Goal:** Identify coherence, real tensions vs. apparent tensions, rank tensions by severity, and suggest cheapest revisions.
      *   **Input:** Six specific claims (Verdict, Lexical Priority, Small Harms, Transitivity, No Sharp Threshold, Within-life vs. Across-life Aggregation).

  2.  **Deconstruct the Commitments:**
