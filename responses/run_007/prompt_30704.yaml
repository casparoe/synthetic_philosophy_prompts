      *   **Tension D: (3) Small Harms vs. (2) Lexical Priority.**
          *   (3) says specks have positive weight. (2) says they can't outweigh torture.
          *   This is the definition of lexical priority (positive weight but bounded).
          *   *Conflict:* None logically, but it creates the "why?" question. How can something have weight but never sum?
          *   *Severity:* Low. This is standard lexical utilitarianism.

      *   **Tension E: (4) Transitivity vs. (5) No Sharp Threshold + (2) Lexical Priority.**
          *   Standard Spectrum Argument.
          *   Sequence: Torture > S1 > S2 > ... > Speck.
          *   If Torture is lexically worse than Speck (from 2), but each step is only marginally worse (from 5), transitivity (4) forces us to admit that either the steps aren't marginal (violating 5) or the lexical gap doesn't exist (violating 2).
