answer: |-
  **Setting:** *A quiet corner of the hospital cafeteria, late evening. Dr. Elena Vance (oncologist) and Prof. Marcus Thorne (bioethicist) sit across from each other with cold coffee. They have just finished a consultation regarding Mr. Henderson, a patient with aggressive pancreatic cancer.*

  **Vance:** I'm still not going to tell him the six-month estimate, Marcus. Not tomorrow.

  **Thorne:** You know that violates the explicit agreement you made during intake. "Full transparency," he signed for it. And now you're considering withholding the prognosis to keep his cortisol levels down?

  **Vance:** I'm considering it because Mr. Henderson isn't a signing form. He's a man who told me last week, through tears, that the last doctor who gave him "the numbers" made him give up on his daughter's wedding. He's still fighting. The treatment is working, marginally. If I crush that hope with a statistical certainty, the treatment stops working. The lie *is* the medicine.

  **Thorne:** So you're arguing that beneficence overrides veracity. That's a standard trade-off, Elena. It doesn't require abandoning the rule against deception. It just means the rule isn't absolute.

  **Vance:** It's not about overriding. It's about whether the deception counts *against* the action at all in this specific context. You're treating "deception" as a negative reason that gets outweighed by a heavier positive reason. I'm saying that in *this* relationship, with *this* history, the deception might not be a negative reason. It might be neutral. Or it might even be a positive reason.

  **Thorne:** That is the particularist leap I can't follow. You're suggesting the moral valence of lying flips? That lying can be a *good-making* feature?

  **Vance:** I'm suggesting that the feature "intentionally inducing false belief" doesn't carry a invariant moral charge. In a court of law, it's corrosive. In a poker game, it's constitutive. In a surprise party, it's benevolent. Why is the clinic different? If the context transforms the nature of the act, then no general principle like "Do not lie" can capture the moral reality. The principle is blind to the texture.

  **Thorne:** But the clinic *is* different from poker. It's a fiduciary relationship based on trust. That's the general context. Look, I'm not defending a simplistic absolutism. I'm a Rossian. I believe in *pro tanto* duties. "Do not deceive" is a genuine moral reason. It always counts against the action. But in Mr. Henderson's case, the duty of non-maleficence—preventing the psychological collapse that leads to physiological decline—outweighs it. The principle stands; the verdict changes.

  **Vance:** That preserves the principle by making it inert. If a "reason" can be present but have no net weight, or if its weight is entirely determined by other contextual features, what work is the principle doing? You say deception is always a negative. But imagine a scenario where telling the truth would be sadistic. In that case, is the deception still a "negative" that is merely outweighed? Or does the sadistic context disable the reason against lying entirely?

  **Thorne:** It disables the *obligation*, not the reason. The reason remains, but it is silenced by the conditions. We can codify that. We can formulate a principle: "Do not deceive, unless the deception is necessary to prevent severe psychological harm that directly undermines therapeutic efficacy, and the patient has previously indicated a preference for hope over statistical precision."

  **Vance:** There it is. The "unless." Now you have to define "severe harm." You have to define "directly undermines." You have to interpret "indicated a preference." Mr. Henderson indicated he wanted hope, but he also signed the transparency form. Which indicator counts? To apply your complex principle, I need a prior judgment about which features of the context are relevant. The principle doesn't tell me that. My judgment does.

  **Thorne:** So judgment is required to apply principles. That's trivial. It doesn't mean principles don't exist. It means moral competence is the ability to subsume particulars under the correct generalizations. If we can't state the generalization, we can't teach it. If you tell a medical student, "Just look at the context," you're teaching intuition, not ethics. You're saying, "Be wise," which is no instruction at all.

  **Vance:** I'm not saying "be wise." I'm saying moral knowledge is perceptual, not subsumptive. When I look at Mr. Henderson, I don't see "Instance of Deception" and "Instance of Beneficence." I see a frightened man clinging to a lifeline. The reason to speak softly arises from *him*, not from a rule I'm overlaying on him. If I rely on your complex principle, I'm looking for the rule-conditions. If I rely on perception, I'm looking at *him*.

  **Thorne:** But perception without concepts is blind. How do you know what to look for? You noticed his fear. Why is fear morally relevant? Because there is a general truth that "suffering is bad." You noticed the therapeutic alliance. Why does that matter? Because "promises ought to be kept" is generally true. You are using generalizations, Elena. You just refuse to write them down.

  **Vance:** I'm using precedents, not laws. I know fear matters because I've seen it matter before. But I also know that in a different case, fear might be irrelevant. Suppose Mr. Henderson was a stoic who wanted to put his affairs in order. Then his fear would be a reason to tell the truth, to help him prepare. The feature "patient is afraid" changes its valence. In one case, fear makes lying better (to comfort). In the other, fear makes lying worse (because it prevents preparation).

  **Thorne:** That's the holism argument. Dancy's thesis. That a feature can be a reason in one case and an opposite reason in another.

  **Vance:** Exactly. If "patient is afraid" can switch valence, then you cannot build a stable principle that says "Always consider fear as a reason for X." You'd need an exception clause for when fear counts for X and when it counts for Y. But what determines that? The *further* context. And what determines the relevance of the further context? Yet more context. You're chasing an infinite regress of exception clauses.

  **Thorne:** Not infinite. Just complex. We can systematize the switching conditions. "Fear counts as a reason to lie *when* the patient prioritizes emotional comfort; fear counts as a reason to tell the truth *when* the patient prioritizes logistical closure." That's a higher-order principle. It captures the variability.

  **Vance:** But how do you know which priority the patient holds?

  **Thorne:** You assess it.

  **Vance:** By what rule?

  **Thorne:** By... looking at their history, their statements...

  **Vance:** By perception, Marcus! You've pushed the principle back one step, but the final step—the recognition of the priority—is always particular. The principle rests on a foundation of non-codifiable judgment. If the foundation is particularist, why pretend the superstructure is generalist?

  **Thorne:** Because the superstructure provides consistency! If you abandon principles, what stops your "perception" from becoming bias? What stops you from lying to Mr. Henderson because *you* are uncomfortable with death, rather than because *he* needs hope? Principles act as a check. They force you to justify the action in terms of public reasons, not private insights. If you say, "I lied because the context demanded it," that's a conversation stopper. If you say, "I lied because condition C obtained," I can check if C actually obtained.

  **Vance:** That's a pragmatic argument for generalism, not a metaphysical one. You're saying we need principles to keep each other honest. I can agree with that. We can use principles as heuristics. "Presume truth-telling" is a good rule of thumb. But a heuristic isn't a truth. It's a crutch for when our perception fails. In this hard case, my perception is sharp. The crutch is getting in the way.

  **Thorne:** I can concede that principles are defeasible. I can even concede that the list of exceptions might be open-ended. But I cannot concede that there is *no* general truth. If there is no general truth, then moral argument is impossible. If I challenge your decision, Elena, I must appeal to some shared standard. If you say, "In this particular world, lying was right," and I say, "In this particular world, lying was wrong," and there is no general principle connecting our judgments to the facts, we are just comparing intuitions.

  **Vance:** We appeal to similarities. I say, "This is like the surprise party, not like the fraud." You say, "No, it's like the fraud, not the party." We argue by analogy, not by subsumption. We compare cases. That's how common law works. It's how morality works. We don't need a statute for every nuance; we need a shared sensitivity to the relevant similarities.

  **Thorne:** But analogy presupposes relevance. What makes the surprise party relevantly similar? It must be some general feature they share—say, "benevolent intent." You are smuggling generalism in through the back door of analogy. You can't even state the analogy without invoking a general property.

  **Vance:** I can invoke a pattern without a law. I can see a family resemblance without defining the genus. Look, Marcus, if you write down your "complex principle" with all the enabling and disabling conditions, will it guarantee the right answer in the next hard case?

  **Thorne:** No. Because new contexts arise.

  **Vance:** Then the principle isn't doing the work. The work is being done by the agent's ability to see how the new context relates to the old ones. That ability is particularist. The principle is just a shadow cast by previous judgments.

  **Thorne:** A shadow that guides future steps. Here is where I think we remain separated, Elena. You think the codification is impossible, so we should stop pretending. I think codification is asymptotic. We may never capture the full moral truth in a text, but the attempt to codify forces clarity that "perception" allows us to evade.
  My worry is this: If you are right, then moral error is just "failing to see." If I am right, moral error can be "failing to follow." The latter allows for correction. If you lie to Mr. Henderson, and I think you were wrong, I need to point to a standard you violated. If you say, "I saw it differently," I have no leverage.

  **Vance:** And if you point to a standard I violated, I can say, "The context disabled that standard." Then we are back to arguing about the context. The leverage is illusory. The real leverage is my track record. Do I usually understand my patients? Do I usually act with care? That is my justification. Not a rule.

  **Thorne:** Then our disagreement is ultimately about the nature of moral justification. For me, justification must be universalizable. If it was right for you to lie to Henderson, it must be right for any physician in a relevantly similar situation. That "relevantly similar" implies a general description exists.

  **Vance:** And for me, justification is about fidelity to the specific reality in front of you. Universalizability is a constraint on logic, not necessarily on ethics. I can say, "It was right for me, with Henderson, today." If another physician tries to copy me with a different patient without seeing the difference, *they* are the one failing the moral demand, not because they broke a rule, but because they failed to see the new particular.

  **Thorne:** So you accept that morality has structure, but you deny the structure is propositional.

  **Vance:** I accept that morality has coherence, but I deny the coherence comes from top-down laws. It comes from bottom-up sensitivity.

  **Thorne:** And I maintain that without the top-down framework, the bottom-up sensitivity is uncheckable solipsism.

  **Vance:** Then we are at the limit. I will not lie because a rule allows it. I will withhold the prognosis because *this man* needs it.

  **Thorne:** And I will critique you not because you broke a rule, but because I believe your perception of "what this man needs" is flawed, and I will use the presumption of truth-telling as the tool to probe that flaw.

  **Vance:** Fair enough. Probe the perception. Just don't pretend the probe is the truth itself.

  **Thorne:** And don't pretend the truth is inaccessible to the probe.

  *They sit in silence for a moment, the gap between them neither bridged nor widened, but clearly mapped.*

  **Thorne:** I'll review the chart with you. Let's see if the "perception" holds up to the data.

  **Vance:** Let's.
