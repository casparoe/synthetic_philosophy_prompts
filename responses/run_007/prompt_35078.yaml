answer: |-
  **1. The exam question**

  A teacher announces a surprise exam next week (Monday-Friday), defined as an exam whose date students cannot know in advance. Students reason via backward induction that no such exam is possible, yet the exam occurs and surprises them. Do not merely reconstruct this reasoning. Identify the *single weakest epistemic step* in the students' elimination argument. Defend why this specific inference fails rather than others. Explain what this failure reveals about the nature of knowledge, justified belief, or self-referential announcements. Pinpoint the specific commitment about knowledge generating the contradiction, rather than treating the paradox as a mere puzzle about prediction.

  **2. A model answer**

  The weakest epistemic step lies in the transition from eliminating Friday to eliminating Thursday. This move assumes that on Thursday night, if no exam has occurred, the students will *know* the exam must be on Friday. This relies on the principle of Knowledge Retention: that the teacher's announcement remains a known premise throughout the week. However, this assumption is unsustainable. The announcement states the exam will be a surprise. If students deduce it must be Friday, it ceases to be a surprise, thereby falsifying the announcement. Consequently, the announcement cannot be known if the deduction succeeds.

  The argument breaks because it treats the announcement as a stable piece of knowledge compatible with the deduced conclusion. In reality, the announcement is self-defeating if known. This connects directly to the KK principle (if one knows p, one knows that one knows p). To eliminate Thursday, students must know on Thursday night that they will know on Friday morning. But the surprise condition denies they can know the date. Thus, the backward induction requires a level of epistemic transparency (KK) that the scenario explicitly forbids. The students assume that because they know the announcement on Monday, they will still know it on Thursday night. But knowledge is factive; if the announcement becomes false due to their deduction, they cannot know it. This implies that knowledge is not merely true belief but requires a stability that self-referential negation disrupts. The student cannot occupy the epistemic position required for the induction to hold.

  Furthermore, this reveals a limitation in the closure of knowledge under deduction. Standard epistemic logic suggests if one knows P and knows P implies Q, one knows Q. Here, students know the announcement and know it implies "not Friday." But deducing "not Friday" undermines the justification for knowing the announcement. Knowledge is not stable under deductions that destroy its truth conditions. This highlights a crucial distinction in epistemology between logical consequence and epistemic preservation. Just because a conclusion follows logically does not mean the agent retains knowledge of the premises required to derive it.

  An alternative diagnosis locates the error in the definition of "surprise," suggesting it is ambiguous between "not deducible" and "not expected." Proponents argue that if "surprise" means psychological expectation, the logic fails. However, this semantic approach is less illuminating. Even with precise epistemic operators, the paradox persists in formal systems. Quine, for instance, argues the sentence is simply self-contradictory. Yet this dismisses the intuitive plausibility of the announcement. The epistemic approach preserves the intuition while explaining the failure. The epistemic instability diagnosis is preferable because it identifies a structural flaw in how knowledge interacts with self-referential predictions. It shows that certain truths (like Moorean sentences) cannot be coherently known, even if true. The students' error is not logical but epistemic: they assume a proposition can be known when its content precludes its own knowability. This distinction separates mere logical consistency from epistemic possibility, which is the paradox's true philosophical weight. By focusing on the retention step, we see that the paradox is not about days of the week, but about the limits of self-referential knowledge.

  **3. A marking scheme**

  **1. Accuracy and Precision (4 marks)**
  A-range: Precisely isolates the specific inference (e.g., Thursday night knowledge retention) without rehearsing the whole paradox. Identifies the step as an epistemic claim, not just a logical move. B-range: Summarizes the backward induction generally without pinpointing the step. Common Mistake: Focusing only on Friday elimination or restating the prompt without analysis.

  **2. Depth of Epistemic Analysis (8 marks)**
  A-range: Connects the step to a substantive principle (KK, closure, factivity, Moorean paradox) and explains why it fails. Demonstrates understanding of why knowledge differs from truth or belief here. Explains the mechanism of the failure. B-range: Mentions "knowledge" vaguely without identifying specific epistemic commitments. Common Mistake: Treating the paradox as purely logical rather than epistemic, ignoring the knowability condition. Fails to explain *why* the principle is questionable.

  **3. Handling of Alternative Diagnosis (4 marks)**
  A-range: Acknowledges a competing explanation (e.g., semantic ambiguity, Quine's objection) and argues why the chosen diagnosis is superior or more fundamental. Shows why the alternative is less illuminating. B-range: Mentions an alternative without comparison or justification. Common Mistake: Ignoring alternative diagnoses entirely or treating them as equally valid without argument.

  **4. Clarity, Structure, and Coherence (4 marks)**
  A-range: Argument is logically structured, concise, and free of ambiguity. Thesis is clear from the outset. Paragraphs transition smoothly. B-range: Disorganized or difficult to follow. Common Mistake: Rambling or lacking a clear thesis statement, resulting in a descriptive rather than argumentative essay.
