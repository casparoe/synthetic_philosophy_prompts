  Your colleague's track record is a textbook demonstration of the **Knobe Effect** (or the Side-Effect Effect). Her verdicts show a systematic asymmetry: agents are judged to bring about bad side effects intentionally, but not good (or neutral) side effects, even when knowledge and causal structure are identical.

  Here is the analysis of the rules fitting her record, the predictions for your new cases, and the structural implications.

  ### 1. Rules Capturing the Track Record

  Four distinct rules (or families of rules) fit her first four verdicts equally well.

  *   **Rule A: The Moral Valence Rule (Outcome-Based).**
      *   *Structure:* If the side effect is morally **bad/harmful**, it is intentional. If it is **good/beneficial**, it is not.
      *   *Fit:* Perfectly explains the CEO (Harm=Int, Help=Unint) and Manufacturer/Developer cases.
  *   **Rule B: The Normative Violation Rule (Action-Based).**
      *   *Structure:* If the agent's decision violates a salient social or moral **norm**, the side effect is intentional. If the decision conforms to norms, it is not.
      *   *Fit:* Harming the environment/workers violates norms (Intentional). Helping the environment/air conforms to norms (Not Intentional).
  *   **Rule C: The Blame/Praise Asymmetry Rule (Agent-Based).**
      *   *Structure:* Intentionality is ascribed to facilitate **blame** for bad outcomes but withheld when **praise** is not at stake or the agent is not blameworthy.
      *   *Fit:* The CEO and Manufacturer are blameworthy for their indifference/cost-cutting (Intentional). The Helper/Developer are not blameworthy (Not Intentional).
  *   **Rule D: The Physical Harm Rule (Domain-Based).**
      *   *Structure:* If the side effect involves **physical damage or injury**, it is intentional. If it involves abstract benefits or non-physical changes, it is not.
      *   *Fit:* All four original vignettes involve physical outcomes (environmental damage, worker injury, air quality). This rule fits the data but is theoretically weaker.

  ### 2. Analysis of the New Cases

  The two new cases introduce **justification** and **normative legitimacy**, which discriminate among the rules above.

  **Case 1: The Motorist (Necessary Harm)**
  *   *Features:* Side effect is harmful (car damage). Action is morally obligatory/justified (saving a child). Agent regrets the harm.
  *   **Rule A (Valence):** Predicts **Intentional**. (Outcome is harm).
  *   **Rule B (Norms):** Predicts **Not Intentional**. (Action conforms to the higher norm of saving life; property damage is normatively excused).
  *   **Rule C (Blame):** Predicts **Not Intentional**. (Agent is praiseworthy/blameless).
  *   **Rule D (Physical):** Predicts **Intentional**. (Outcome is physical damage).

  **Case 2: The Firm (Legitimate Competition)**
  *   *Features:* Side effect is harmful (rival bankrupt). Action is normatively legitimate ("no one regards... as wrongful"). Agent regards it as unfortunate.
  *   **Rule A (Valence):** Predicts **Intentional**. (Outcome is economic harm).
  *   **Rule B (Norms):** Predicts **Not Intentional**. (Action conforms to market norms of competition).
  *   **Rule C (Blame):** Predicts **Not Intentional**. (Agent is not blameworthy).
  *   **Rule D (Physical):** Predicts **Not Intentional**. (Outcome is economic, not physical).

  ### 3. Predictions and Discrimination

  **My Prediction:**
  She will say **Not Intentional** for Case 1 and **Not Intentional** for Case 2.

  **Reasons:**
  As a psychologist of moral judgement, she is likely operating under the **Normative Expectation** or **Blame** account (Rules B or C), which are the dominant theoretical explanations for the Knobe Effect in current literature. The "Simple Valence" rule (Rule A) is known to break down when the harmful side effect is fully justified or normatively sanctioned.
  *   In Case 1, the harm is a "lesser evil" necessitated by a moral duty. The literature suggests intentionality ascription drops when the agent lacks a reasonable alternative or is acting on obligation.
  *   In Case 2, the harm is explicitly framed as "legitimate." The Knobe effect relies on the *wrongfulness* of the indifference. If the conduct is not wrongful, the drive to assign blame (and thus intentionality) vanishes.

  **How the Cases Discriminate:**
  *   **If she says "Not Intentional" for Case 1:** This rules out **Rule A (Valence)** and **Rule D (Physical)**. It supports Rules B and C.
  *   **If she says "Not Intentional" for Case 2:** This rules out **Rule A (Valence)**. (Rule D also predicts this, but Case 1 already ruled D out).
  *   **Jointly:** If she says "Not Intentional" for both, **Rules A and D are eliminated.** We are left distinguishing between **Rule B (Norms)** and **Rule C (Blame)**.

  ### 4. Best Guess on the Implicit Rule

  **Best Guess:** She is applying the **Normative Expectation Rule (Rule B)**.

  While Blame and Norms often correlate, the Normative account is more structural. It posits that people judge intentionality based on whether the agent's choice deviates from what is expected or prescribed.
  *   *Why not Blame?* Blame is an emotional reaction; Norms are the cognitive standard. In Case 2, the prompt explicitly states "no one regards the firm's conduct as wrongful." This removes the *ground* for blame, but more importantly, it signals **Normative Conformity**.
  *   *Why not Valence?* Her consistency on the first four cases looks like Valence, but that is the surface phenomenon. The *mechanism* is almost certainly normative because the "Help" cases (CEO/Developer) are not just "Good," they are "Norm-Compliant."

  ### 5. Tie-Breaking Vignette

  If she verdicts "Not Intentional" for both new cases, Rules B (Norms) and C (Blame) still survive together, as they predict the same outcome here. To distinguish whether she tracks **Norm Conformity** or **Agent Blameworthiness**, you need a case where the two diverge.

  **Proposed Vignette:**
  > A known criminal (who is generally blameworthy for past crimes) launches a business venture to launder money. He knows a side effect will be that a local park is cleaned up (because his front company hires a landscaping crew). He is indifferent to the park. The park cleaning is a good outcome, and the agent is a blameworthy person.

  **Predictions:**
  *   **Rule C (Blame):** Predicts **Intentional**. (The agent is blameworthy, so we attribute intentionality to maintain the blame stance).
  *   **Rule B (Norms):** Predicts **Not Intentional**. (The side effect is good/norm-compliant; the agent's general character doesn't change the normative status of *this* side effect).

  **Standard Psychological Finding:** Most subjects say **Not Intentional**. If she agrees, it confirms the **Normative Expectation Rule** is the primary driver, not general Agent Blame.
