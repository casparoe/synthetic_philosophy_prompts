  This configuration is best described as a **Safety Multipolar Trap**, which is a Prisoner's Dilemma driven by Adverse Selection on Latent Safety Attributes with Negative Externalities.

  The distinction lies in the specific combination of information asymmetry, externalized costs, and competitive coordination failure. A standard **Race to the Bottom** typically involves observable metrics like price or regulatory compliance, whereas this dynamic centers on *unobservable risk profiles* where cutting corners yields a competitive advantage precisely because the degradation is hidden until failure. While **Market for Lemons** (Adverse Selection) captures the information asymmetry where buyers cannot distinguish quality, it assumes the buyer bears the cost of the defect; in your scenario, the harm is a **Negative Externality** landing on third parties or society, meaning the buyer has even less incentive to screen for safety than in a standard Lemons market. Similarly, while a **Tragedy of the Commons** involves depleting a shared resource through individual consumption, this pattern involves accumulating shared *risk* through production choices where the "resource" being depleted is collective trust or safety standards. The "Multipolar Trap" carving specifically captures the game-theoretic lock-in: every actor prefers the high-safety equilibrium, but competitive pressure makes defecting (skipping safety) the dominant strategy, punishing cooperators without reducing the aggregate risk. In AI governance literature, this is increasingly referred to as the **Alignment Tax Competitive Dilemma**, but the structural name remains the Safety Multipolar Trap.
