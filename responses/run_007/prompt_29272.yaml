answer: |-
  This is a remarkably coherent set of intuitions. You are navigating a path between strict Kantianism (which prioritizes duty over inclination) and Humean Sentimentalism (which prioritizes sympathy), while also rejecting consequentialism (Case 6) and pure externalism (Case 5).

  Here is an analysis of the principle underlying your verdicts, the tension points, and the application to your new case.

  ### 1. The Unifying Principle: "Reasons-Responsiveness"

  The principle that best captures your verdicts is a form of **Reasons-Responsiveness** (sometimes called the *Fitting Attitude* view).

  **The Principle:** *An action has moral worth to the extent that the agent is motivated by the features of the situation that actually make the action right (or good), rather than by features irrelevant to its moral status.*

  Here is how this principle maps onto your cases:

  *   **Cases 1 & 4 (Duty):** The "duty" motive is a proxy for recognizing moral requirements. In Case 1, the shopkeeper responds to the requirement of honesty. In Case 4, the passerby responds to the requirement of aid. Both track right-making features.
  *   **Case 3 (Sympathy):** Sympathy is a direct emotional response to the *value* of the person suffering. Since the person's suffering is a right-making feature (it creates a reason to help), acting from sympathy is acting from a recognition of moral reality. This explains why you rate it as highly as Case 1.
  *   **Cases 2 & 5 (Prudence/Reputation):** Profit and reputation are not right-making features of giving change or helping a collapse victim. They are morally irrelevant externalities. Hence, no worth.
  *   **Case 6 (Accidental Benefactor):** The agent was motivated by malice (a wrong-making feature). The fact that the outcome was good was luck, not a reflection of his responsiveness to moral reasons.
  *   **Case 7 (Mixed Motives):** Since both motives (care and duty) track right-making features, the presence of one does not negate the other. The agent is "over-determined" by the right reasons.
  *   **Case 8 (The Father):** This is the most telling case. The father acts against his *subjective* judgment of duty, but his emotional recoil tracks the *objective* right-making feature (the child's well-being/autonomy). You grant "some worth" because he is responsive to the actual value at stake, even if his moral theory is wrong.

  ### 2. The Tension Points: "Thin" Worth and "Unease"

  Your principle works well, but your qualitative qualifiers ("thinner" in Case 4, "uneasy" in Case 8) reveal a second layer to your view. You seem to believe that moral worth is maximized when **Reason** and **Emotion** are integrated.

  *   **Why Case 4 is "Thinner":** The cold passerby responds to the *rule* (duty) but fails to respond to the *value* (human suffering). A fully virtuous agent would feel the pull of the suffering *and* the pull of the duty. The absence of sympathy suggests a deficit in moral perception, even if the will is good.
  *   **Why Case 8 is "Uneasy":** The father responds to the *value* (love for child) but is in conflict with his *reason* (his conception of duty). His agency is fragmented. He is doing the right thing for the right reason (love), but he believes he is doing the wrong thing. This lack of **rational integrity** diminishes the worth.

  **Proposed Refinement:**
  To capture these nuances, your principle should be:
  > *Moral worth arises from motivation by right-making features. However, worth is maximized when the agent's emotional dispositions and rational judgments are aligned in their recognition of those features.*

  ### 3. Which Verdict to Overturn?

  If you want a perfectly seamless theory, **Case 8** is the stress point.

  *   **The Conflict:** In Case 5, you deny worth because the agent's *judgment* that helping is right plays no role. In Case 8, you grant worth even though the agent's *judgment* that helping is right is absent (he thinks he ought to be doing something else).
  *   **The Fix:** To be consistent with Case 5, you might need to lower the verdict on Case 8. If acting from reputation (Case 5) lacks worth because the moral judgment is inert, acting from love *against* moral judgment (Case 8) should arguably also lack full moral worth, because the agent is not acting as a moral agent, but as a loving parent who happens to be morally confused.
  *   **Recommendation:** Keep your intuition on Case 8 but acknowledge it as a different *kind* of worth. It is "human worth" rather than "moral agency worth." He is a good human, but in that moment, he is not functioning as a moral deliberator.

  ### 4. The New Case: The Settled Disposition

  > *Case 9:* Someone acts rightly from a settled disposition of character (honesty) that was cultivated for purely self-interested reasons long ago, but now operates without any thought of self-interest.

  **Does it have moral worth?**

  Based on your verdicts, particularly Case 3 (Sympathy) and Case 7 (Mixed Motives), the answer should be **Yes, but with a caveat.**

  **The Argument for "Yes":**
  Your view prioritizes *current* motivation by right-making features over the *history* of that motivation.
  *   In Case 3, the sympathetic helper doesn't think about duty; she just responds to need.
  *   In Case 9, the dispositioned agent doesn't think about self-interest; they just respond to the situation (e.g., "This is the honest thing to do" or simply acting honestly).
  *   If the disposition now functions as a reliable sensitivity to moral features (honesty, need, fairness), it is functionally equivalent to the sympathy in Case 3. The fact that it was *bred* by self-interest is a genetic detail that doesn't negate its current moral tracking.

  **The Caveat (The "Thinness" Factor):**
  Recall your reaction to Case 4 ("thinner"). You value the integration of reason and emotion.
  *   If this settled disposition is a "blind habit" (the agent acts honestly but cannot articulate why and would not defend it if challenged), it resembles Case 6 (luck/nature) more than Case 1. It lacks active engagement.
  *   If the disposition is a "second nature" (the agent acts honestly, and if asked, would endorse honesty as valuable, even if they don't actively deliberate every time), it aligns with Case 7.

  **Verdict:**
  The action has moral worth **if the disposition is now constitutive of the agent's care for the right-making features.**
  *   If the shopkeeper is honest now simply because it's a reflex (like a tic), it has **low worth** (too close to Case 6's accident).
  *   If the shopkeeper is honest because he has become a person for whom honesty is a value (even if he didn't start that way), it has **high worth** (equal to Case 1 or 3).

  Given your generous verdict on Case 3 (where no duty thought occurs), you should lean toward granting **high worth**, provided the agent isn't merely a robot. The origin of the virtue (self-interest) matters less than its current object (honesty/truth).

  ### Summary of Your Moral Theory

  You are effectively arguing for a **Neo-Aristotelian Kantianism**.
  1.  **Kantian:** You reject self-interest and reputation as sources of worth (Cases 2, 5). You believe acting from a conception of the right matters (Case 1).
  2.  **Aristotelian/Humean:** You believe emotions/sympathy can ground worth (Case 3) and that a "cold" duty is less robust than a warm one (Case 4). You value character dispositions (Case 9).
  3.  **Externalist:** You believe acting on the *actual* good (Case 8, Case 3) can generate worth even if the agent's internal moral theory is flawed or absent.

  **Your Core Principle:** Moral worth is the credit due to an agent whose motivations (whether rational or emotional) successfully track the objective values that make an action right.
