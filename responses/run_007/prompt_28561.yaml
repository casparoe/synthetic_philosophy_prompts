  In neural halls where signals strive and fight,
  One thought ascends to claim the stage of light.
  To frontal lobes the winner is broadcast,
  Where reason binds the future to the past.
  What we can speak, what we can hold in mind,
  Is access consciousness, by report defined.
  The global workspace shines upon the select,
  And makes all data public and direct.

  "That is all there is," the workspace voice asserts,
  But "No," says critic, "feelings leave their prints."
  The redness of red, the ache deep in the bone,
  A what-it's-like that stands forever alone.
  It slips the net where access data flows,
  And thus the hard problem endlessly grows.

  No scan can show the feeling in the flow,
  For inner life exceeds what we can know.
