  What is synthetic? The specific probability assigned to class "Cat".
  Quine's claim: Even the Softmax definition is a choice. If a different normalization led to better loss, we'd use it. The "truth" of the sum-to-1 constraint is pragmatic, not logical necessity.
  Actually, a better mapping for Analytic is **Priors that are not updated**. But Quine says everything is updated. So, Analytic = **Parameters with near-zero learning rate** (frozen). Synthetic = **High learning rate**. The distinction is a continuum of *entrenchment*, not a binary. This is the crucial engineering insight.

  9.  **Finalizing the Plan:**
      *   Intro: Quine as "Epistemic Debugging."
      *   Section 1: The Dogmas translated.
