  8.  **Self-Correction/Refinement during drafting:**
      *   *Critique:* Make sure I don't just defend Wigner. I need to be neutral and analytical.
      *   *Critique:* Ensure the "Deflationary Account" is clearly defined in contrast. The user says "select, refine, discard." This is instrumentalism.
      *   *Key Distinction:* The "Active" vs. "Passive" effectiveness (Wigner's own distinction). Active = we make math for physics. Passive = math exists, then fits physics. The deflationary account handles Active well. Passive is the problem.
      *   *Refining Reading 3:* Make sure to highlight the *temporal gap* between mathematical discovery and physical application. That's the crux of the anti-selectionist argument.

  9.  **Final Polish:** Check tone (academic, precise, helpful). Ensure all constraints of the prompt are met (menu format, flagged readings, specific criteria analyzed).

