      Usually, in WAS (Wild Animal Suffering) discourse, it's about Total Net Welfare.
      I will clarify in the intro that we are modeling Total Net Welfare, where negative values indicate net suffering.

      *Let's check the Deprioritized question again.*
      "Whether an ecosystem can be assigned a net welfare at all."
      Yes, this is the metaphysical one. It's a "stopper." If the answer is "No, only individuals," we proceed with aggregation. If "Yes," we still probably proceed with aggregation as a proxy. It doesn't change the math much.
      Alternative deprioritization: "Burden of Proof."
