answer: |-
  **WORKSHOP PREPARATORY DOCUMENT: ADVERSARIAL COLLABORATION ON CONSEQUENTIALISM AND CLUELESSNESS**

  **To:** Workshop Participants
  **From:** Representatives of Camp A (Defenders) and Camp B (Critics)
  **Subject:** Mapping the Disagreement on the Cluelessness Objection

  ### 1. Substantive Agreed Claims
  *Before detailing our disagreements, we affirm the following substantive claims. We agree that these are true, and that any resolution to our debate must be consistent with them.*

  1.  **The Epistemic Premise:** Human agents lack the cognitive capacity and empirical data to trace the long-term causal chains of ordinary actions (e.g., buying coffee, donating to charity) beyond a very short temporal horizon.
  2.  **The Normative Premise:** A normative ethical theory loses significant plausibility if it systematically fails to yield a determinate verdict on what an agent ought to do in common decision contexts.
  3.  **The Value Premise:** The moral value of an outcome is at least partially determined by its consequences (both camps reject purely deontological or aretaic accounts that ignore outcomes entirely).
  4.  **The Comparative Claim:** Even if absolute expected value is unknowable, it is possible that *comparative* expected value (Action A is better than Action B) is knowable, even under conditions of uncertainty.
  5.  **The Distinction:** There is a conceptual distinction between the *criterion of rightness* (what makes an act right) and the *decision procedure* (how an agent decides what to do).

  ---

  ### 2. Map of Disagreements
  *The following table isolates specific sub-questions where our views diverge. Positions are phrased charitably to ensure endorsement by each camp.*

  | Sub-Question | Camp A ("Manageable") Position | Camp B ("Fatal") Position |
  | :--- | :--- | :--- |
  | **1. Probability Assignment** | Agents can assign non-arbitrary subjective probabilities to broad categories of long-term outcomes, sufficient for expected value (EV) calculation. | In cases of radical uncertainty (cluelessness), probability assignments are not merely imprecise but undefined; therefore, EV calculations are mathematically incoherent. |
  | **2. The Role of Heuristics** | Consequentialism can endorse indirect decision procedures (rules of thumb, virtues) that track the good without requiring direct EV calculation for every act. | Relying on heuristics concedes that the core consequentialist criterion cannot guide action; this reduces consequentialism to a hybrid theory that abandons its central insight. |
  | **3. Comparative Knowledge** | We can know that one action has higher EV than another even if we cannot calculate the specific EV of either action (e.g., via dominance reasoning). | If the probability distribution of outcomes is undefined for both actions, there is no rational basis for claiming one dominates the other; the comparison is epistemically empty. |
  | **4. Theory Function** | The primary function of a normative theory is to identify the *truth conditions* of moral claims; action-guidance is a secondary, pragmatic feature. | The primary function of a normative theory is to guide agency; a theory that identifies truth conditions but cannot guide action is practically inert and theoretically deficient. |
  | **5. Scope of Cluelessness** | Cluelessness is a localized problem affecting only long-termist or high-stakes interventions, not ordinary morality. | Cluelessness is pervasive because ordinary actions are nodes in chaotic causal networks; the "butterfly effect" renders almost all EV calculations unstable. |

  ---

  ### 3. The Cruxes
  *These are the specific points of contention where a shift in view would likely cause a camp to revise their overall stance. We have identified concrete cases to test these cruxes.*

  #### Crux 1: The Coherence of Imprecise Probabilities
  *   **The Issue:** Can we make rational comparisons using imprecise probability intervals (e.g., "0.1% to 10% chance of catastrophe") rather than point estimates?
  *   **Camp A Prediction:** We can demonstrate cases where Interval A clearly dominates Interval B, proving that cluelessness does not preclude rational choice.
  *   **Camp B Prediction:** We will show that in morally significant cases, the intervals are so wide or overlapping that no dominance relation holds, rendering the theory silent.
  *   **Test Case: "The Chaos Donation"**
      *   *Scenario:* You can donate \$1,000 to Charity X (known to save 1 life now, long-term effects unknown) or Charity Y (known to save 1 life now, but has a public relations campaign that might radicalize a future political movement).
      *   *A's Expectation:* We can argue that the known life-saving dominates the speculative political risk, making X the rational choice despite cluelessness about the future.
      *   *B's Expectation:* We will argue that because the speculative risk involves existential stakes, the "unknown" long-term value swamps the known short-term value, making the comparison impossible.

  #### Crux 2: The Necessity of Direct Guidance
  *   **The Issue:** Must the *criterion of rightness* itself be usable by the agent to count as "action-guiding"?
  *   **Camp A Prediction:** If we show that a two-tier system (Criterion + Heuristic) yields better outcomes than trying to use the criterion directly, Camp B will accept this as a valid form of consequentialism.
  *   **Camp B Prediction:** Even if the two-tier system yields better outcomes, Camp B will maintain that if the agent cannot access the criterion to verify the heuristic, the theory fails to explain *why* the agent is acting rightly.
  *   **Test Case: "The Blameless Wrongdoer"**
      *   *Scenario:* An agent follows the best available consequentialist heuristic but, due to unforeseeable causal chains (cluelessness), causes a disaster. Objectively, they did the wrong act (by C-ist lights); subjectively, they did the right procedure.
      *   *A's Expectation:* Camp B will agree the agent is praiseworthy and should have acted the same way, accepting "Subjective Rightness" as the action-guiding norm.
      *   *B's Expectation:* We will argue that if the agent did the "wrong act" objectively, Consequentialism fails to tell them what the *actual* moral requirement was, leaving a gap between "what I should do" and "what is right."

  #### Crux 3: The Definition of "Action-Guiding" **(Potential Verbal Dispute)**
  *   **The Issue:** We suspect we are using different definitions of what it means for a theory to "guide action."
  *   **Camp A Definition:** A theory guides action if it provides a stable decision procedure that correlates with moral truth.
  *   **Camp B Definition:** A theory guides action only if the agent can derive the verdict of the theory from their current epistemic position.
  *   **Test Case: "The Black Box"**
      *   *Scenario:* Imagine an oracle tells you "Act A maximizes the good," but gives no reason why. You trust the oracle.
      *   *A's Expectation:* This counts as guidance because you know what to do.
      *   *B's Expectation:* This does not count as *theoretical* guidance because the theory itself didn't generate the verdict; the oracle did.
      *   **Resolution Goal:** We aim to determine if this is a substantive disagreement about the nature of normativity or a verbal dispute about the label "action-guiding."

  ---

  ### 4. Note on Terminology: The "Action-Guiding" Dispute
  *Flagged by Joint Consensus*

  Both camps acknowledge that a significant portion of the friction in Section 3 (Crux 2 & 3) may stem from equivocation on the phrase **"action-guiding."**

  *   **Camp A** tends to treat "action-guiding" as a pragmatic property: *Does this theory help agents produce good outcomes?*
  *   **Camp B** tends to treat "action-guiding" as an epistemic property: *Does this theory allow agents to access the moral truth?*

  **Workshop Goal:** We request that workshop participants help us determine whether this distinction is merely semantic. If it is substantive, we need to know which sense of "action-guiding" is required for a normative theory to be considered successful. If it is semantic, we should agree to distinguish between **"Pragmatic Guidance"** (Camp A's focus) and **"Epistemic Accessibility"** (Camp B's focus) to avoid talking past one another.
