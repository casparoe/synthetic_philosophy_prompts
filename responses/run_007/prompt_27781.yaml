          *   *Methodological/Heuristic:* This is the core. The "Adaptationist Programme" (Maynard Smith) vs. the "Null Hypothesis" (Neutralists).
          *   *Epistemic Values:* Boldness vs. Caution.
      *   **The Burden of Proof (Addressing the User's Theory):** Confirm this is the strongest lens. Is the null hypothesis "random drift" or "selection"? In population genetics, neutrality is often the null. In behavioral ecology, adaptation often is.
      *   **Why it Persists:**
