          *   *Methodological:* What is the best research strategy? (Adaptationist programs generate testable hypotheses; neutralist programs prevent just-so stories).
          *   *Semantic:* What do we mean by "adaptationism"? (Strong, Weak, Empirical, Methodological).
          *   *Epistemic:* Values like simplicity, explanatory power, rigor.

