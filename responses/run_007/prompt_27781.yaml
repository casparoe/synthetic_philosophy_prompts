answer: |-
  You have hit the nail on the head. As a journalist covering this beat, your intuition is sharper than many of the participants in the debate. You are correctly identifying that the "adaptationism debate" has shifted from an empirical dispute about the world to a methodological dispute about how to *study* the world.

  If you want the diagnosis from the perspective of philosophy of biology and the history of science, here is the breakdown: It is primarily a clash of **epistemic values** manifesting as a disagreement over the **burden of proof**, complicated by disciplinary silos.

  Here is the proper diagnosis of the stalemate, why it persists, and what (if anything) could move it.

  ### 1. The Diagnosis: It's Not Empirical, It's Heuristic
  You noted that everyone agrees on the basics: selection exists, drift exists, constraints exist. So why the fight?

  Philosophers of biology (notably Peter Godfrey-Smith, Elliott Sober, and Steven Orzack) have spent decades dissecting this. They generally distinguish between three types of adaptationism:
  1.  **Empirical Adaptationism:** The claim that most traits *are* actually adaptations.
  2.  **Explanatory Adaptationism:** The claim that the most important *explanations* in biology involve selection.
  3.  **Methodological Adaptationism:** The claim that assuming traits are adaptations is the best *research strategy*, even if they turn out not to be.

  The debate persists because the two sides are often arguing past each other using different definitions.
  *   **The Gouldians (and Modern Neutralists/Evo-Devo folks)** are attacking *Empirical Adaptationism*. They are saying, "You are claiming too much of the phenotype is optimized."
  *   **The Adaptationists (e.g., Dennett, Pinker, many behavioral ecologists)** are defending *Methodological Adaptationism*. They are saying, "Assuming optimization is the only way to generate testable hypotheses."

  **The Verdict:** You are right. It is a dispute about the **null hypothesis**.
  *   **Side A (Adaptationist):** The null hypothesis should be "This trait was shaped by selection." Why? Because selection is the only known process that creates complex functional design. If you assume drift first, you'll never look for function.
  *   **Side B (Pluralist/Structuralist):** The null hypothesis should be "This trait is a byproduct, constraint, or drift." Why? Because assuming selection invites "Just-So Stories" (unfalsifiable narratives). Make the adaptationist prove the function.

  This is not an empirical question because you cannot count the percentage of "adaptive traits" in the history of life. It is unmeasurable. Therefore, the debate defaults to methodology: *Which heuristic produces more truth over time?*

  ### 2. Why It Goes in Circles
  If it's just methodology, why hasn't one side won? Why the cyclical reviews?

  **A. Disciplinary Tribalism**
  The "fight" looks different depending on where you stand in the biology department.
  *   **Molecular Evolutionists:** They largely settled this in the 1980s in favor of Neutral Theory (Kimura). At the DNA level, most variation is drift. They look at phenotypic adaptationists and roll their eyes.
  *   **Behavioral Ecologists:** They work on organismal behavior where function is obvious (e.g., foraging strategies). To them, assuming adaptation is the only way to do math (Optimality Models). They look at structuralists and say, "You're ignoring the obvious design."
  *   **Evo-Devo Biologists:** They focus on constraints. They see the Adaptationists as ignoring the "architecture" of the organism.

  Because these fields rarely intersect deeply, they keep re-litigating the same philosophical point in different empirical contexts.

  **B. The "Success" Problem**
  Adaptationism is incredibly productive. It generates papers, grants, and compelling narratives. As Daniel Dennett argued, the "Adaptationist Stance" works so well that it feels true even when it isn't strictly empirically verified.
  Conversely, the "Spandrels" critique is incredibly important for rigor. It stops scientists from publishing nonsense about the evolutionary purpose of chin dimples.
  Because both approaches yield value (one generates hypotheses, the other prunes errors), neither can be declared "wrong."

  **C. The Definition Drift**
  Every time the Anti-Adaptationists land a punch, the Adaptationists redefine the term.
  *   *Critic:* "Not everything is an adaptation!"
  *   *Adaptationist:* "Of course not. I'm a *weak* adaptationist. I just say we should *test* for adaptation."
  *   *Critic:* "But your tests assume optimization!"
  *   *Adaptationist:* "No, we use rigorous comparative methods now."
  This definitional elasticity keeps the debate alive but content-free.

  ### 3. What Would Actually Move It?
  You asked if this will just wait for the generation to die off. That is partially true (Planck's Principle applies: "Science advances one funeral at a time"), but there are specific developments that could dissolve the debate rather than resolve it.

  **A. High-Throughput Phenotyping + Genomics (The Data Flood)**
  The debate thrives in data scarcity. When you have one trait and one species, you can spin a story.
  When you have genomic data across 1,000 species and can map the genetic architecture of traits, it becomes harder to ignore constraints. If we find that 80% of phenotypic variance is linked to pleiotropic genes that constrain variation, the Empirical Adaptationist position weakens.
  *   *The Shift:* We are moving toward **Quantitative Genetics** and **GWAS**. These fields force you to deal with variance and correlation, not just "optimal design." This naturally favors the pluralist view without needing a philosophical fight.

  **B. Formalizing the Null (The Mathematical Fix)**
  The debate would end if we had a standardized statistical framework for "expected drift."
  In population genetics, we have the Neutral Theory. In morphology/behavior, we don't really have a robust "Null Model of Constraint."
  If Evo-Devo researchers can produce a formal model that predicts trait distribution *based solely on developmental physics* (without selection), and that model fits the data as well as an Optimality Model, the burden of proof shifts decisively. (Some work in biophysics and morphospace is attempting this).

  **C. The "Extended Evolutionary Synthesis" (EES)**
  There is an active movement (led by figures like Kevin Laland and Gerd Müller) to formalize the role of development, niche construction, and plasticity into a new synthesis.
  *   *Will it end the debate?* Probably not. It will likely just become the new label for the "Anti-Adaptationist" camp, and the Adaptationists will claim they already incorporated those things. However, if EES produces predictive models that outperform standard selectionist models, it will render the philosophical debate moot.

  ### 4. Advice for Your Coverage
  Since you are writing for a public audience, here is how to frame it without getting bogged down:

  1.  **Stop asking "Who is right?"** Ask "When is each tool useful?" Frame Adaptationism as a lens (like a microscope) and Structuralism as another lens (like an X-ray). Sometimes you need to see function; sometimes you need to see structure.
  2.  **Highlight the "Just-So Story" Risk.** The public loves evolutionary psychology stories. Your role is to ask: "What is the null hypothesis here? Did they test for drift, or did they just assume function?"
  3.  **Watch the Methods, Not the Conclusions.** The fight isn't about whether the finch beak is adaptive (it is). The fight is about *how they proved it*. If they used a rigorous comparative phylogenetic method, that's good science. If they used a "hand-waving" optimality argument, that's where the Spandrels critique applies.
  4.  **The Real Story is Integration.** The most interesting work happening now isn't in the "camps." It's in the middle. People using genomics to find the *constraints* on selection. People measuring how often selection actually overcomes drift in real-time (e.g., in microbes or rapid evolution studies).

  ### Summary
  Your hypothesis is correct. It is a methodological dispute about the **burden of proof** disguised as an empirical dispute.
  *   **Is it verbal?** Partially (definitions of adaptationism).
  *   **Is it empirical?** No (global claims are untestable).
  *   **Is it epistemic?** Yes (Boldness vs. Rigor).

  **Will it end?** Not with a bang. It will dissolve as tools improve. When we can sequence everything and model developmental constraints mathematically, the question "Is this an adaptation?" will be replaced by "How much of this variance is explained by selection vs. constraint?"

  Until then, you are witnessing a philosophical trench war where the trenches are actually different biology departments. The journalists who treat it as a "mystery to be solved" will keep writing the same story. The journalists who treat it as a "tension in scientific method" will write the interesting ones.
