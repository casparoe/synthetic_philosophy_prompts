      *   *The Response:* Adaptationists (e.g., Dawkins, Williams, Maynard Smith) argued that natural selection is the *only* known process that creates complex design, so it's the best starting hypothesis.
      *   *The "Agreement":* As the user notes, nobody denies selection exists, and nobody says *everything* is an adaptation.
