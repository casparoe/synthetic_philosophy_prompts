answer: |-
  ### The Joint Action Decision Tree

  This tree is designed to navigate the logical space of joint action theory. It begins with the most basic distinction (behavior vs. mind) and drills down into the specific structure of the mental states involved. Follow the path that best matches your intuitions about the cases presented.

  #### **Start:** The Sleepwalker Case
  **Scenario:** Imagine two people lift a heavy table together. In Case A, they discuss it, agree, and lift. In Case B, they are both sleepwalking; their muscles happen to contract in a way that lifts the table simultaneously, without any awareness of the other.
  **Question:** Is Case B a genuine instance of "acting together," or does acting together essentially require something internal (beliefs, intentions, awareness) that is missing in the sleepwalkers?

  *   **If Case B IS acting together (Only behavior/causation matters):**
      *   ➔ **Leaf 1: Causal Behaviorism** *(Unoccupied Position)*
  *   **If Case B is NOT acting together (Internal states are required):**
      *   ➔ Go to **Node 2**.

  ---

  #### **Node 2:** The Sidewalker Case
  **Scenario:** Two strangers walk at the same pace in the same direction on a crowded sidewalk. Each sees the other, each intends to keep walking, and each knows the other intends to keep walking. They do not speak.
  **Question:** Is the difference between these "Sidewalkers" and two friends "Taking a Walk Together" fully explainable by the sum of what is inside each person's head (their individual intentions and beliefs about the other), or does the "togetherness" require a mental state that essentially refers to *us* as a unit?

  *   **If it is fully explainable by individual heads (Reductive):**
      *   ➔ Go to **Node 3**.
  *   **If it requires a state referring to *us* as a unit (Non-Reductive):**
      *   ➔ Go to **Node 5**.

  ---

  #### **Node 3:** The Struggling Partner Case
  **Scenario:** You and I are carrying a table. I stumble.
  **Question:** For us to have been acting together *before* I stumbled, was it sufficient that we both intended to carry it and knew the other did? Or were we required to be committed to *adjusting* our sub-plans to help the other succeed if things went wrong?

  *   **If Knowledge + Individual Intention is sufficient:**
      *   ➔ **Leaf 2: Simple Reductionism** *(Your Friend's View)*
  *   **If Commitment to Mutual Adjustment is required:**
      *   ➔ Go to **Node 4**.

  ---

  #### **Node 4:** The Reductive Quitting Case
  **Scenario:** We are carrying the table (under the conditions in Node 3). I suddenly let go without warning and walk away.
  **Question:** Did I violate a specific *obligation to you* that gives you the right to rebuke me? Or did I merely act irrationally relative to my own prior intentions, without necessarily wronging *you* specifically?

  *   **If I wronged you (created an obligation):**
      *   ➔ **Leaf 3: Reductive Normativity** *(Unoccupied Position)*
  *   **If I was merely irrational (no special obligation):**
      *   ➔ **Leaf 4: Bratman's Shared Intention**

  ---

  #### **Node 5:** The Glue Case
  **Scenario:** We accept that "acting together" involves a state that refers to *us*.
  **Question:** What is the primary "glue" holding this joint action together? Is it that we *owe* it to each other to continue (Normative), or is it that our minds are representing the action in a special *psychological* mode (Cognitive)?

  *   **If the glue is primarily Normative (Obligation/Entitlement):**
      *   ➔ **Leaf 5: Gilbert's Joint Commitment**
  *   **If the glue is primarily Psychological (Mode of Representation):**
      *   ➔ Go to **Node 6**.

  ---

  #### **Node 6:** The Pretense Case
  **Scenario:** We are acting together with this special "We" psychology.
  **Question:** Is this "We-intention" a real, sui generis type of mental state that actually exists in the world? Or is it a useful fiction—a way of speaking as if we are one agent, when strictly speaking only individual agents exist?

  *   **If it is a useful fiction (Instrumentalism):**
      *   ➔ **Leaf 6: Fictionalist We-Intentions** *(Unoccupied Position)*
  *   **If it is a real mental state:**
      *   ➔ Go to **Node 7**.

  ---

  #### **Node 7:** The Thinker Case
  **Scenario:** This real "We-intention" exists. Where does it reside?
  **Question:** Is the intention held by *me* (as an individual who represents the group's action), or is it held by the *Group* itself (as a distinct entity over and above the individuals)?

  *   **If the Group itself is the thinker:**
      *   ➔ **Leaf 7: Metaphysical Collectivism** *(Unoccupied Position)*
  *   **If I (the individual) hold the We-intention:**
      *   ➔ **Leaf 8: Searle's Irreducible We-Intentions**

  ---

  ### The Leaves: Positions and Diagnoses

  #### **Leaf 1: Causal Behaviorism** *(Unoccupied)*
  *   **The View:** Joint action is nothing more than causally interdependent behavior. Mental states are irrelevant.
  *   **Diagnosis:** This position is largely unoccupied in contemporary action theory because it fails to distinguish joint action from accidental coordination (e.g., two leaves blowing in the wind together). It cannot explain why the *sleepwalkers* in Node 1 feel intuitively different from the *friends*.

  #### **Leaf 2: Simple Reductionism**
  *   **The View:** Joint action = Individual Intention + Common Knowledge of Intention. (Your friend's view).
  *   **Diagnosis:** This is the most parsimonious view. It posits no new kinds of entities or states. However, it struggles with the "Sidewalker" case, as it implies strangers walking in sync are taking a walk "together" in the full sense.

  #### **Leaf 3: Reductive Normativity** *(Unoccupied)*
  *   **The View:** Joint action requires interlocking intentions and mutual responsiveness (like Bratman), but this structure *generates* genuine interpersonal obligations, even though the intentions themselves are reducible to individual "I-intentions."
  *   **Diagnosis:** This space is unstable. Philosophers argue that if the obligations are genuine (you can rebuke me), they usually require a non-reductive foundation (like Gilbert's). If they are reducible, they tend to collapse into individual moral promises, making this view hard to distinguish from Leaf 4 or Leaf 5.

  #### **Leaf 4: Bratman's Shared Intention**
  *   **The View:** Joint action is constituted by a web of interlocking individual intentions. I intend that we J, you intend that we J, we know this, and we are committed to being mutually responsive.
  *   **Diagnosis:** This is the dominant "reductive" view. It captures the complexity of coordination (Node 3) without positing spooky "group minds." It treats the "shared intention" as a label for the complex structure of individual attitudes, not a new atomic state.

  #### **Leaf 5: Gilbert's Joint Commitment**
  *   **The View:** Joint action requires a "plural subject." We jointly commit to doing something as a body. This creates normative obligations: each party is entitled to demand performance from the other.
  *   **Diagnosis:** This view prioritizes the social/normative dimension. It explains why you can rebuke a partner who quits (Node 4) better than Bratman. However, critics argue it makes joint action too heavy; it implies obligations even in trivial cases where no promise was made.

  #### **Leaf 6: Fictionalist We-Intentions** *(Unoccupied)*
  *   **The View:** We talk about "We-intending," but strictly speaking, only individuals exist. We-intentions are a pretense or a metaphorical stance that facilitates coordination.
  *   **Diagnosis:** Coherent, but pragmatically unattractive. If the fiction constrains behavior and reasoning exactly like a real state (as Searle argues), the distinction between "real" and "fictional" loses its bite. It solves the metaphysical problem by denying the data.

  #### **Leaf 7: Metaphysical Collectivism** *(Unoccupied)*
  *   **The View:** The group is a literal agent with its own mind, distinct from the minds of the members.
  *   **Diagnosis:** This is the most robustly non-reductive view but is ontologically expensive. It requires believing in "group souls" or super-agents. Most philosophers prefer Searle's view (Leaf 8), which gets the irreducibility of the *content* without the irreducibility of the *subject*.

  #### **Leaf 8: Searle's Irreducible We-Intentions**
  *   **The View:** "We-intend" is a primitive psychological state in the individual's head. It cannot be analyzed into "I-intend" + beliefs. It is biologically primitive.
  *   **Diagnosis:** This captures the phenomenological feeling of joint agency without positing a group mind. However, it is often criticized for being a "black box": it asserts the state exists but offers little explanation of *how* it functions socially compared to Gilbert or Bratman.

  ---

  ### Hard-to-Distinguish Pairs

  Even with this tree, some positions converge in practice, making them difficult to separate empirically.

  **1. Bratman (Leaf 4) vs. Reductive Normativity (Leaf 3)**
  *   **Why they blur:** Bratman acknowledges that shared intention creates a "normative pressure" to continue. A proponent of Reductive Normativity would argue this pressure *is* an obligation. The distinction rests on whether that obligation is *constitutive* of the joint action (Leaf 3) or a *consequence* of it (Leaf 4). In a concrete case, both views predict the same behavior (you should help your partner), making them hard to distinguish without deep metaphysical probing.

  **2. Searle (Leaf 8) vs. Gilbert (Leaf 5)**
  *   **Why they blur:** Searle argues that having a We-intention often *leads* to normative expectations. Gilbert argues that the normative commitment *constitutes* the joint action. In a real-world scenario (e.g., a duet), a Searlean and a Gilbertian will agree that the musicians are acting together and that quitting is wrong. They disagree on whether the "wrongness" is the foundation of the action (Gilbert) or a byproduct of the psychology (Searle).

  **3. Simple Reductionism (Leaf 2) vs. Bratman (Leaf 4)**
  *   **Why they blur:** In stable, successful joint actions, common knowledge usually *leads* to mutual responsiveness. If we both know you want the table lifted, I will naturally adjust to help you. Simple Reductionism can argue that responsiveness is just a likely consequence of common knowledge, whereas Bratman argues it is a requirement. Distinguishing them requires finding a case where agents have common knowledge but *refuse* to be responsive—a case that may be rare in successful joint action.
