answer: |-
  This is one of the sharpest questions in contemporary epistemology. You are right to notice that both views are motivated by the same data (usually "Bank Cases," where a subject's willingness to claim knowledge shifts as the practical stakes rise). Because they explain the same intuitions, they are often lumped together as "anti-invariantist" views.

  However, they are not empirically equivalent, and the distinction is not merely specialist navel-gazing. It turns on **whose** context matters and **what** is being modified (the word or the world).

  Here is where they come apart, how you can test them, and why it matters.

  ### 1. The Core Distinction: Attributor vs. Subject

  The fundamental divergence is about *which* stakes drive the truth value of a knowledge claim.

  *   **Epistemic Contextualism:** The truth of "S knows that p" depends on the **attributor's** context (the person saying the sentence).
      *   *Mechanism:* The word "knows" is indexical (like "here" or "tall"). Its semantic content shifts based on the conversational standards of the speaker.
      *   *Implication:* I can truthfully say "You know the bank is open" (because my stakes are low), even if you cannot truthfully say "I know the bank is open" (because your stakes are high).

  *   **Pragmatic Encroachment (PE):** The truth of "S knows that p" depends on the **subject's** practical situation (the person who supposedly has the knowledge).
      *   *Mechanism:* Practical factors (stakes, risks) literally help constitute the knowledge relation. Knowledge is not "purely epistemic."
      *   *Implication:* If your stakes are high, you simply *do not know*, regardless of who is talking about you. If I say "You know" while your stakes are high, I am objectively wrong.

  ### 2. Concrete Scenarios Where They Diverge

  To see the difference, we need a scenario where the **Subject's stakes** and the **Attributor's stakes** come apart.

  **The Mismatched Stakes Case:**
  Imagine Hannah (Subject) has very little riding on whether the bank is open (low stakes). She has standard evidence (was there two weeks ago).
  Imagine Sarah (Attributor) is speaking about Hannah. Sarah is in a high-stakes situation regarding Hannah's bank deposit (perhaps Sarah is Hannah's creditor and needs that money today).

  *   **Question:** Can Sarah truthfully say, "Hannah knows the bank is open"?
  *   **Contextualist Prediction:** **Yes.** The standards for "knows" are set by Sarah's conversational context. *Wait, correction:* In standard contextualism (like DeRose's), the standards are set by the *attributor's* context. If Sarah is in a high-stakes context, the standards rise. So Sarah *cannot* truthfully say Hannah knows.
      *   *Refined Test:* Let's flip it. **Hannah (Low Stakes Subject)** is talking about **Sarah (High Stakes Subject)**.
      *   Hannah says: "Sarah knows the bank is open."
      *   **Contextualism:** Hannah's context sets the standards. Her stakes are low. Therefore, her sentence is **True**.
      *   **Pragmatic Encroachment:** Sarah's stakes determine the knowledge relation. Sarah's stakes are high. Therefore, Sarah does not know. Hannah's sentence is **False**.

  This is the "smoking gun." Contextualism allows a low-stakes speaker to truthfully attribute knowledge to a high-stakes subject. Pragmatic Encroachment says that attribution is false because the subject lacks knowledge due to their own stakes.

  **The Disagreement Test:**
  Imagine you and I are discussing a third party, John.
  *   I say: "John knows the plane leaves at 3."
  *   You say: "No, John doesn't know that."
  *   Suppose we have the same evidence about John, but you are aware of a high-stakes risk for John that I am ignoring.

  *   **Contextualism:** We might both be right. I am speaking in a low-standards context; you are speaking in a high-standards context. We are talking past each other.
  *   **Pragmatic Encroachment:** We are having a genuine disagreement. There is a fact of the matter about John's practical situation. One of us is wrong.

  ### 3. How to Decide Between Them (The Evidence)

  Since we can't run a lab experiment on "knowledge," the evidence is linguistic and intuitive. Philosophers argue over which view better captures our actual usage.

  **Argument for Contextualism:**
  It preserves the intuition that knowledge is a "purely epistemic" state (dependent only on truth, belief, and justification). It treats the practical variability as a feature of *language*, not the *mind*.
  *   *Evidence:* When stakes rise, we often feel like we are being "stricter" with the word, not that the person's mental state changed.

  **Argument for Pragmatic Encroachment:**
  It explains why we hesitate to *act* on the knowledge. If Contextualism is true, the high-stakes subject *does* know (relative to their own context), they just can't *say* it. But PE explains why they shouldn't *bet* on it.
  *   *Evidence:* The "Action Intuition." If you wouldn't bet your life on $p$, it feels wrong to say you know $p$, even if no one is listening. PE says this is because you *don't* know. Contextualism says you *do* know, but asserting it is inappropriate.

  **The "Retraction" Data:**
  If I say "I know" in a low-stakes context, and later the stakes rise, do I retract my earlier claim?
  *   **Contextualism:** No. "I spoke truly then. The standards have changed."
  *   **PE:** It's complicated, but generally, PE suggests the knowledge relation was always sensitive to the stakes *at that time*. If the stakes were low then, I knew then.
  *   *Where they clash:* If I discover I *ignored* high stakes that were present at the time. PE says I never knew. Contextualism says it depends on what standards were in play in my conversation.

  ### 4. Why It Matters (Beyond Specialism)

  This is not just semantics. It changes how we view rationality, ethics, and law.

  **1. The Nature of Rational Action**
  *   **PE** supports the **Knowledge Norm of Action**: You should act on $p$ only if you know $p$. Since stakes affect knowledge, stakes affect rational action directly.
  *   **Contextualism** usually supports a **Knowledge Norm of Assertion**: You should assert $p$ only if you know $p$. But since "knows" shifts, what you are permitted to *say* shifts, even if what you are permitted to *do* might remain constant.
  *   *Practical difference:* In AI safety or medicine, do we want systems that "know" relative to our conversational standards (Contextualism), or systems that "know" relative to the risk inherent in the procedure (PE)? PE is generally more robust for safety-critical systems.

  **2. Legal Testimony**
  *   In a courtroom, a witness might say, "I know it was him."
  *   **Contextualism:** The truth of that claim depends on the legal standards (the attributor's context). If the jury demands "beyond reasonable doubt," the word "know" tightens.
  *   **PE:** The truth depends on the witness's situation. Did the witness have enough to lose by being wrong? If the witness had no stake in the outcome, PE might argue they "knew" it even if the jury requires more proof.
  *   *Implication:* Contextualism makes knowledge attribution a tool of the legal process. PE makes it a fact about the witness's psychology and environment.

  **3. Skepticism**
  *   **Contextualism** is often marketed as an answer to skepticism. The skeptic raises the standards to infinity; the contextualist says, "Sure, you're right in your context, but in everyday contexts, we still know things." It dissolves the conflict.
  *   **PE** does not dissolve skepticism as easily. If the stakes of being wrong about the external world are theoretically infinite, PE might concede we rarely know anything. It takes the skeptical threat more seriously.

  ### Summary

  They are not empirically equivalent.
  *   **Contextualism** predicts that a low-stakes speaker can truthfully attribute knowledge to a high-stakes subject.
  *   **Pragmatic Encroachment** predicts that this attribution is false.

  **The Philosophical Bet:**
  *   Choose **Contextualism** if you want to save the traditional idea that knowledge is purely about evidence and truth, pushing the practical stuff into the semantics of language.
  *   Choose **Pragmatic Encroachment** if you believe knowledge is fundamentally a guide to action, and therefore cannot be separated from the risks of acting.

  If you are building a theory of rational agency, PE is usually more useful. If you are analyzing linguistic usage or trying to defuse skeptical paradoxes, Contextualism often has the edge. The distinction determines whether "knowledge" is a mirror of the mind or a tool for navigation.
