          *   *Analysis:* This is the "slacktivism" or "virtue signaling" debate. Some research suggests online engagement displaces offline action (moral licensing), while other research suggests it mobilizes (gateway effect). Kierkegaard claims *substitution*. The evidence is mixed but leans towards significant substitution effects in low-cost environments.
