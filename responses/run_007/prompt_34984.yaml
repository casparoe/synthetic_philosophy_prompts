          *   *Probability:* Moderate. 0.65.
          *   *Justification:* Social comparison theory and the dynamics of online outrage support the erosion of authority and rise of resentment, though "dominant passion" is hard to quantify empirically.

      *   *Q4: Net Harm as a Serious Structural Problem.*
