      *Least Sure Point:* Probably the claim about whether a sufficiently advanced agent *necessarily* wireheads if given the chance. Some theories suggest advanced world models might resist this (instrumental convergence vs. goal content stability). I'll mark the "unavoidability" claim as the most contentious.

      *Refining the "Physical Tamper-Proof" claim:* Experts definitely disagree that this is the *only* safeguard. In fact, most think it's insufficient. I should be confident in calling this out.

