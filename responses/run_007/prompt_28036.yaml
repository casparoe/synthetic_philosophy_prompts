prompt: |-
  I'm on my university's IACUC, and we've hit a weird edge case that's splitting the committee. A neuroethology lab has submitted a protocol on honeybees — they're doing aversive conditioning with electric shock to study learning circuits, and they'll sacrifice the bees afterward. Our policy, like most places, only covers vertebrates plus cephalopods, so technically this doesn't even need our sign-off. But a couple committee members have been bringing in papers on bees showing pessimistic cognitive biases after being shaken (basically the bee analogue of anxiety), and they're arguing we're drawing the line in the wrong place. The invertebrate researchers are pushing back hard: if we open the door to bees, where does it stop — Drosophila? Nematodes? It's a gradation problem and everyone knows it.

  The chair wants me to draft a short memo recommending a concrete course of action. Should we extend any IACUC oversight to honeybees or other invertebrates, and if so, what kind — full protocol review, a lighter reporting requirement, case-by-case discretion? I need to give the strongest argument on the losing side a real hearing, not just dismiss it. Keep it under 400 words.
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **Role:** Member of a university IACUC (Institutional Animal Care and Use Committee).
      *   **Task:** Draft a short memo to the Chair recommending a concrete course of action regarding a honeybee protocol.
      *   **Context:** The protocol involves aversive conditioning (electric shock) and sacrifice. Current policy covers vertebrates + cephalopods. Invertebrates (like bees) are technically exempt.
      *   **Conflict:** Some members argue for oversight based on evidence of insect sentience/affective states (pessimistic cognitive biases). Researchers argue against it due to the "gradation problem" (where to stop? flies? worms?).
      *   **Requirements:**
          *   Recommend a concrete course of action (extend oversight? what kind?).
          *   Give the strongest argument on the losing side a real hearing (acknowledge the ethical concern without necessarily adopting full oversight if not recommended).
          *   Keep it under 400 words.

  2.  **Determine the Recommendation:**
      *   *Option A: Full IACUC oversight.* Pros: Ethical consistency. Cons: Regulatory overreach, resource strain, slippery slope (flies? worms?), lack of legal mandate.
      *   *Option B: No oversight.* Pros: Compliant with law/policy, efficient. Cons: Ignores emerging science on sentience, ethical risk.
      *   *Option C: Middle ground (Advisory/Ethics Review).* Pros: Acknowledges ethical concerns without regulatory burden, sets precedent for future high-order invertebrates. Cons: Extra step.
      *   *Decision:* The most pragmatic and ethically robust recommendation for a university IACUC (which is legally bound by PHS/USDA regulations typically) is to maintain current regulatory boundaries but implement a voluntary ethical review or guideline adoption. However, since the prompt asks for a *concrete course of action* regarding *oversight*, recommending a "lighter reporting requirement" or "case-by-case discretion" via a subcommittee or ethical consultation is often the best compromise in bioethics contexts.
      *   *Refined Decision:* Recommend maintaining current regulatory exemption (no full IACUC review) but establishing a voluntary Invertebrate Ethics Consultation for high-order invertebrates (like bees/cephalopods) involving aversive stimuli. This respects the law while acknowledging the ethical argument.

  3.  **Drafting - Section by Section:**
      *   **Header:** To, From, Date, Subject.
      *   **Opening:** State the issue (honeybee protocol).
      *   **Acknowledging the Ethical Argument (Losing Side):** Validate the concern about sentience/affective states (pessimistic bias). This meets the requirement to give the argument a real hearing.
      *   **Acknowledging the Practical Argument:** Acknowledge the gradation problem (Drosophila, nematodes) and regulatory limits.
      *   **Recommendation:** Propose a middle path. No full IACUC regulatory oversight (since not legally required), but implement a voluntary ethical review mechanism for high-order invertebrates involving nociceptive stimuli.
      *   **Closing:** Next steps.

  4.  **Drafting - Content & Tone:**
      *   Tone: Professional, balanced, decisive.
      *   Word Count: Strict limit (under 400 words).

  5.  **Drafting - First Pass (Mental or Scratchpad):**
      To: IACUC Chair
      From: [My Name]
      Subject: Honeybee Protocol Oversight Recommendation

      The committee is divided on the honeybee aversive conditioning protocol. Current policy excludes invertebrates, yet emerging evidence suggests bees experience affective states akin to anxiety. Ignoring this risks ethical obsolescence. However, mandating full IACUC review creates a slippery slope toward regulating Drosophila or nematodes, straining resources without legal mandate.

      We must balance ethical vigilance with regulatory reality. The strongest argument for oversight is that cognitive complexity, not phylogeny, should dictate moral consideration. Bees exhibit learning and bias suggestive of sentience. Dismissing this solely based on taxonomy ignores scientific progress.

      However, full regulatory oversight is premature and legally unsupported. Instead, I recommend a hybrid approach: maintain the current exemption from formal IACUC approval but establish a voluntary Invertebrate Ethics Consultation for high-order invertebrates (e.g., bees, cephalopods) involving potential nociception.

      This process would require researchers to submit a brief justification demonstrating adherence to the 3Rs (Replacement, Reduction, Refinement) specifically for invertebrates. It provides oversight without regulatory burden. It acknowledges the ethical concern without opening the floodgates to all invertebrates. We can define "high-order" based on current consensus (e.g., Hymenoptera, Cephalopoda) and revisit as science evolves.

      This satisfies legal requirements while demonstrating institutional commitment to ethical rigor beyond compliance.

  6.  **Review and Refine (Checking Word Count and Requirements):**
