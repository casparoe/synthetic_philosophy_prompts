     *   **Yes:** You arrive at **Infinitarian Paralysis**. This is often a diagnosis: if infinite sums cancel out, even universal improvements fail to register, paralyzing choice and suggesting standard value theory breaks down.
     *   **No:** You maintain minimal rationality constraints. Proceed to Question 3.
  3. **Strict Betterness of Addition:** Does adding one extra happy life to an otherwise identical world fail to make it strictly better?
     *   **Yes:** You lean toward **Average Utilitarianism**. You prioritize welfare density over total sum, avoiding the Repugnant Conclusion but facing the Mere Addition paradox and potential obligations to avoid creating happy lives.
     *   **No:** You accept totalist intuitions. Proceed to Question 4.
  4. **Spatiotemporal Limits:** Do you determine value by taking limits of value over expanding finite spatiotemporal regions?
     *   **Yes:** You seek order in divergence. Proceed to Question 5.
     *   **No:** You reject regional approximations in favor of global sums or alternative structures. Proceed to Question 6.
  5. **Strength of Dominance:** Must one world eventually exceed the other at every point thereafter (Overtaking), or merely sum to more in the limit (Catching-up)?
     *   **Overtaking:** You hold **Overtaking Utilitarianism**. You require strict dominance after some finite stage to declare one world better, ensuring robustness but leaving oscillating worlds incomparable.
     *   **Catching-up:** You hold **Catching-up Utilitarianism**. You allow worlds to be ranked if their cumulative value difference converges positively, even without strict dominance at every future point.
  6. **Value Structure:** Do you allow values to be infinite or infinitesimal numbers (hyperreals) rather than standard real numbers?
     *   **Yes:** You adopt **Hyperreal Utilitarianism**. You use non-standard analysis to sum divergent series, preserving totalist intuitions at the cost of mathematical complexity and independence from standard measure theory.
     *   **No:** You hold **Naive Total Utilitarianism**. You assume standard sums apply despite divergence, leading to undefined values in many infinite cases and theoretical breakdowns when sums do not converge.

  2. Branch questions unpacked

  Each question isolates a specific axiomatic commitment:
  1. **Finite Difference:** Tests the scope of comparability; it cuts off person-affecting views that avoid infinite aggregation entirely by limiting moral relevance to finite changes affecting identifiable individuals.
  2. **Pareto:** Tests minimal rationality; it cuts off skeptical views where infinite cancellation neutralizes universal improvements, leading to paralysis rather than a positive normative theory.
  3. **Addition:** Tests total vs average intuition; it cuts off views that deny existence claims contribute positive value, separating average-based views concerned with density from total-based views.
  4. **Limits:** Tests methodology; it cuts off views that seek global sums rather than regional approximations, distinguishing limit-based views from those attempting direct global summation.
  5. **Dominance:** Tests strength of requirement; it cuts off weaker convergence views from stronger strict dominance views, separating catching-up criteria from overtaking criteria on oscillating worlds.
  6. **Hyperreals:** Tests mathematical ontology; it cuts off standard real-valued views from those accepting infinitesimal magnitudes to resolve divergent sums while preserving totalist structural intuitions.

  3. Leaf positions

  1. **Person-Affecting View:** Restricts comparison to finite differences, awkwardly implying we cannot judge wholly distinct infinite populations or policies affecting future generations significantly.
  2. **Infinitarian Paralysis:** Diagnoses choice impossibility, awkwardly implying universal improvements are morally neutral in infinite contexts, rendering agency futile and normative guidance void.
  3. **Average Utilitarianism:** Maximizes welfare density, awkwardly implying adding happy lives can be neutral or bad if averages drop, conflicting with strong beneficence intuitions regarding existence.
  4. **Catching-up Utilitarianism:** Ranks by limit sums, awkwardly allowing worlds to be better without ever being strictly better at any specific finite stage of evaluation.
  5. **Overtaking Utilitarianism:** Requires eventual dominance, awkwardly leaving oscillating worlds incomparable despite clear local differences and convergent cumulative value over time.
  6. **Hyperreal Utilitarianism:** Sums divergent series via infinitesimals, awkwardly relying on non-standard mathematics inaccessible to standard decision theory and empirical measurement techniques.
  7. **Naive Total Utilitarianism:** Applies finite sums to infinite worlds, awkwardly resulting in undefined values for most interesting infinite cases where series diverge rather than converge.

  4. Empty cells and near-misses

  Empty Cells: Denying Pareto while accepting Strict Addition is unstable (unattractive), as universal improvement should entail addition benefits. Accepting Finite Difference but denying Pareto is incoherent, since finite differences guarantee Pareto holds. A view accepting Limits but rejecting Hyperreals and Dominance constraints remains largely unexplored in literature.
  Indistinguishable Leaves: Catching-up and Overtaking Utilitarianism cannot separate worlds where welfare sums converge smoothly without oscillation; they only diverge on oscillating welfare profiles. Similarly, Naive Totalism and Hyperrealism yield identical rankings on convergent worlds, differing only when standard sums fail. The tree separates them logically, but empirical application often masks the distinction, making them functionally equivalent in non-divergent cases.
