answer: |-
  We look beneath the phenotype for the gene,
  Treating the organism as a temporary body.
  Altruism dies unless it saves the group,
  Survival measured by inclusive fitness.
  We must descend to the lowest causal level.
  This is the reductionist's preferred story.

  But mathematics tells a different story.
  Replication isn't owned solely by the gene.
  Selection partitions at every nested level.
  The organism is more than a hollow body.
  The Price equation partitions total fitness.
  Cooperation evolves within the group.

  Is it war waged by the group?
  Or just a change of narrative story?
  The algebra yields the same aggregate fitness.
  You can model the drive of every gene.
  Or treat the whole organism as a body.
  We shift the axis of the chosen level.

  Shift your gaze up one hierarchical level.
  The individual dissolves into the group.
  Phenotypes emerge from the living body.
  Causes rearrange within the story.
  The replicator hides inside the gene.
  While selection filters strictly for fitness.

  We maximize inclusive fitness.
  But never settle on a final level.
  Is the true agent the selfish gene?
  Or the structured demes of the group?
  Each framework writes a coherent story.
  Each clothes the living, breathing body.

  Flesh inherits through the body.
  Success is defined by relative fitness.
  Science demands a single causal story.
  Yet nature ignores our preferred level.
  Selection acts upon the group.
  Or so argues the rival to the gene.

  Do not ask which body claims the greatest fitness,
  But watch the story shift with every level,
  Since the group survives within the gene.
