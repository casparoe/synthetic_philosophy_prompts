answer: |-
  Your intuition is spot-on. Your friend has given you a very standard "Introduction to Philosophy of Language 101" summary of J.L. Austin, but it freezes his thought process at the beginning of his famous William James Lectures (published as *How to Do Things with Words*) rather than where he ended up.

  She has accurately described Austin's **starting point**, but she has missed his **conclusion**. In fact, the main philosophical payoff of Austin's work is the destruction of the very distinction she thinks is the upshot.

  Here is a breakdown of what a careful speech act theorist would accept, what requires nuance, and what is simply incorrect.

  ### 1. What She Got Right (The Setup)
  **The Existence of Explicit Performatives:**
  She is correct that Austin identified a class of sentences that do not describe the world but enact something. Examples like "I name this ship the *Queen Elizabeth*," "I bet," or "I promise" are indeed **explicit performatives**.
  *   **Verdict:** **Accurate.**

  **Felicity vs. Truth:**
  She is correct that Austin argued these sentences aren't primarily judged by truth or falsity. Instead, they are judged by **felicity conditions**. If a judge says "I sentence you to death" but she isn't a judge, or if she says it in a coffee shop, the act is **infelicitous** (a "misfire"). It doesn't become "false"; it just fails to happen.
  *   **Verdict:** **Accurate.**

  ### 2. The Nuance (Sincerity and Infelicity)
  **The Claim:** *"You can't really ask whether the speaker was being sincere... whether they intend to keep the promise is a separate ethical question, not a question about the speech act."*

  **The Correction:** This is partially right but technically imprecise regarding Austin's framework.
  For Austin, sincerity *is* a condition of the speech act, but it is a different *kind* of condition than authority or context.
  *   If a judge sentences a criminal but lacks authority, the act is a **Misfire** (nothing happened).
  *   If a person says "I promise" but has no intention of keeping it, the act is an **Abuse**. The promise *did* happen (you are now bound by the promise socially), but the act was performed insincerely.
  *   **Why it matters:** Austin classifies insincerity as a type of **infelicity**. It is not merely a "separate ethical question" external to the theory; it is a flaw *within* the taxonomy of the speech act. The act is "hollow" or "unhappy" in a specific technical sense.
  *   **Verdict:** **Oversimplification.**

  ### 3. The Fatal Flaw (The Constative/Performative Distinction)
  **The Claim:** *"Language splits neatly into two kinds: performatives... and constatives... performatives are a special marked-off class."*

  **The Correction:** This is the exact opposite of Austin's final conclusion.
  In the early lectures, Austin proposes this binary. But by Lecture XII (the end of the book), he systematically dismantles it. He realized that **constatives are also performatives.**

  Consider the sentence: *"The cat is on the mat."*
  Your friend says this is a constative (descriptive, true/false). Austin asks: What are you *doing* when you say this?
  *   You are **informing** me.
  *   You are **asserting** a fact.
  *   You are **warning** me (if the cat is dangerous).
  *   You are **answering** a question.

  Austin realized that "stating," "describing," and "reporting" are themselves **actions** (illocutionary acts). Furthermore, constatives have felicity conditions too!
  *   If I say, *"France is hexagonal,"* Austin argues this isn't simply "true" or "false." If I am a geographer giving a precise lecture, it is **infelicitous** (too rough). If I am a general giving a quick briefing, it is **felicitous**.
  *   If I state something without evidence, I am not "false"; I am **misleading** (an infelicity).

  Because "describing" is a type of "doing," the distinction collapses.
  *   **Verdict:** **Wrong.** This is the specific point your memory recalled correctly. Austin explicitly rejects the idea that performatives are a "special marked-off class."

  ### 4. The Actual Upshot (Illocution and Perlocution)
  Since the Performative/Constative split didn't work, Austin replaced it with a three-part framework that applies to **all** utterances:

  1.  **Locutionary Act:** The act of saying something (producing sounds with meaning).
  2.  **Illocutionary Act:** The act performed *in* saying something (promising, warning, stating, ordering). **This is where the "force" of the language lives.**
  3.  **Perlocutionary Act:** The act performed *by* saying something (persuading, frightening, amusing).

  Under this final framework, **every** sentence has an illocutionary force. There is no "neutral" descriptive language. Even a dry scientific report is performing the act of "testifying" or "claiming," which comes with its own rules, authorities, and felicity conditions.

  ### Does her conclusion survive?
  **No.** The idea that language splits neatly into "doing" words and "describing" words, with describing being the default and doing being the special exception, does not survive the details.

  Austin's actual upshot is more radical: **All speech is action.** There is no "constative" realm that is free from the conditions of performance. When we describe the world, we are doing something to our listeners (informing, convincing, misleading), and those actions can succeed or fail based on context, authority, and sincerity, just like a marriage ceremony.

  ### Summary for your friend
  You can tell her:
  > "Your summary is perfect for *Lecture 1* of *How to Do Things with Words*, but Austin spends the rest of the book proving himself wrong. He concludes that there is no such thing as a purely descriptive 'constative' statement because describing is itself an action (an illocutionary act). So, performatives aren't a special class; **all language is performative.**"

  She isn't "wrong" in the sense that she didn't learn the material; she likely learned the standard pedagogical shorthand. But philosophically, the "neat split" is the one thing Austin wanted us to abandon.
