          *   *Refining the Verdict:* Jake is closer to the "Conciliatory/Calibration" view (Christensen). Lena is closer to the "Steadfast/Right Reason" view (Kelly). The missing piece is often the **distinction between the propositional justification and doxastic justification**, or the **scope of the rational requirement**.
