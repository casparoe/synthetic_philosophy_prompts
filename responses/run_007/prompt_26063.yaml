      *   *Subtle 5: Dependency Source.* The violinist was already sick; the fetus's dependency is created by the act of conception (in voluntary cases).

  4.  **Evaluate Thomson's Conclusion:**
      *   Thomson's goal isn't to prove abortion is *always* permissible, but that it is *sometimes* permissible (specifically, that the right to life doesn't entail the right to use another's body).
      *   Does the analogy hold for *rape* cases? Yes, very strongly.
      *   Does it hold for *contraceptive failure*? Maybe (people took precautions, like locking windows).
      *   Does it hold for *voluntary conception*? Weaker. This is where the "Special Obligation" objection hits hardest.
