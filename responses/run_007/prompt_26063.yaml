      *   *Right to Life:* The violinist's claim to stay connected vs. your right to bodily autonomy.

  3.  **Identify Disanalogies (The "Audit"):**
      *   *Obvious:* Consent. Most pregnancies are voluntary (to some degree), unlike the kidnapping.
      *   *Subtle 1: The Nature of the Act.* Unplugging is passive (letting die) vs. Abortion is often active (killing). *Correction:* Thomson argues unplugging *causes* death, but is it *killing*? This is a crucial distinction in moral philosophy (doing vs. allowing).
      *   *Subtle 2: Biological Relationship.* The violinist is a stranger. A fetus is genetically related (usually). Does genetic kinship create special obligations?
      *   *Subtle 3: Parental Obligation.* Does becoming a parent (even involuntarily) create a duty of care that strangers don't have?
