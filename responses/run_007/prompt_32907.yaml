prompt: |-
  I'm teaching an upper-level undergrad seminar on rational choice and the foundations of game theory — about 18 students, mostly philosophy and econ majors, one 75-minute session. We've done Nash equilibrium and dominance reasoning, and now I want to spend a session on the idea that standard game theory assumes each player treats the others' strategies as fixed and independent of their own reasoning. I want to introduce superrationality — the idea that when you know all the players are copies of each other in terms of reasoning power and information, you should ask "what strategy would be best if we all independently converge on the same reasoning?" — and I want them to actually feel the force of the problem, not just hear about it.

  The source material is Douglas Hofstadter's Platonia dilemma and the Luring Lottery. (In the Platonia dilemma, 20 people are told that if exactly one sends a telegram by noon next day, that person gets a billion dollars; if zero or more than one send, no one gets anything. No communication. The superrational prescription is to send with probability 1/20. In the Luring Lottery, readers of Scientific American in the 1980s were actually invited to send in postcards with a number of entries; the prize was $1M divided by total entries, awarded to a random entry, so you could game it by sending a huge number. The superrational prescription was to roll a die with sides equal to the number of expected responders and send "1" only on a roll of 1. In practice, people sent googolplexes and the whole thing became a joke.)

  So here's what I want: design a classroom activity (or pair of linked activities) that makes the students wrestle with the core tension before they get the vocabulary. I want them to discover for themselves that standard individual rationality gives terrible advice when everyone is reasoning symmetrically, and then I want them to try to invent something like superrationality on their own. Ideally the activity would have a payoff structure that doesn't require real money — maybe points toward a grade or some kind of token that matters only within the class. The debrief should map what they did onto the formal difference between strategic reasoning (I treat you as an independent agent) and superrational reasoning (we are instances of the same decision procedure), and should be honest about what the activity can't capture — e.g., the real Luring Lottery involved thousands of strangers, not a seminar room of people who know each other. Also tell me what predictably goes wrong. I've never run anything like this before and I'm a little nervous about it devolving into chaos.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **Context:** Upper-level undergrad seminar (Philosophy & Econ majors), 18 students, 75 minutes.
      *   **Prerequisites:** Nash Equilibrium, Dominance Reasoning.
      *   **Goal:** Introduce the tension between standard game theory (strategic independence) and superrationality (Hofstadter's concept). Students need to *feel* the problem, not just hear about it.
      *   **Source Material:** Hofstadter's Platonia Dilemma & Luring Lottery.
      *   **Requirements:** Classroom activity (linked), low-stakes payoff (points/tokens), debrief mapping to formal concepts, honesty about limitations, prediction of pitfalls.
      *   **Instructor Concern:** Nervous about chaos/devolution.

  2.  **Deconstruct the Core Concept:**
      *   *Standard Game Theory:* My choice doesn't causally affect yours. I maximize expected utility given my belief about your probability distribution. In symmetric games, this often leads to defection/over-entry (Nash).
      *   *Superrationality:* We are identical reasoners. If I choose $X$, you (being identical) will likely choose $X$. Therefore, I should choose the $X$ that maximizes utility *if everyone chooses $X$*.
      *   *The Tension:* Causal independence vs. Logical correlation.

  3.  **Brainstorming Activities:**
      *   *Idea 1: The Platonia Dilemma (Binary Choice).* 20 students (close enough to 18). If exactly one writes "Yes", they get points. If 0 or >1, everyone gets 0.
          *   *Pros:* Directly uses Hofstadter's example. Clear Nash (mixed strategy $p=1/18$). Clear Superrational (mixed strategy $p=1/18$). Wait, in Platonia, the Nash and Superrational solutions actually converge on the mixed strategy probability ($1/N$). This might *not* highlight the tension well enough. The tension is clearer in Prisoner's Dilemma or the Luring Lottery.
      *   *Idea 2: The Luring Lottery (Continuous/Integer Choice).* Prize pool $P$ divided by total entries $E$. Payoff for individual = $P \cdot (e_i / E)$.
          *   *Pros:* Shows the "race to the bottom" (or top, in terms of entries). Nash is to send infinity (or max allowed). Superrational is to coordinate on a low number.
          *   *Cons:* Hard to manage in class without computers. "Infinity" is abstract.
      *   *Idea 3: A Hybrid/Modified Prisoner's Dilemma.*
          *   *Pros:* Classic.
          *   *Cons:* Students have likely seen it a million times. Doesn't capture the "logical correlation" vibe of Hofstadter as well as the lottery.
      *   *Idea 4: The "1/N" Game (Modified Platonia/Lottery).*
          *   Let's create a specific payoff structure that mimics the Luring Lottery but is manageable on paper.
          *   *Setup:* Pot of 100 points. Everyone writes a number $n \ge 0$. Total entries $T = \sum n_i$. If $T=0$, no one gets anything. If $T > 0$, payoff for player $i$ is $100 \cdot (n_i / T)$.
          *   *Nash:* If others play $k$, I should play $k+\epsilon$ (or max possible). Dominant strategy is to maximize entries.
          *   *Superrational:* If we all play $n$, payoff is $100/N$. Maximize this -> $n=1$.
          *   *Problem:* This is essentially a tragedy of the commons. It works, but is it "Hofstadterian"? Hofstadter's specific twist is the *logical identity* of the reasoners.
      *   *Idea 5: Two-Stage Activity.*
          *   Round 1: Standard anonymous choice (mimicking strangers).
          *   Round 2: Explicitly frame it as "We are all in this room, same syllabus, same professor."
          *   Actually, better: Run the game, let them fail (Nash), then discuss *why* they failed to coordinate, then introduce the concept.

      *   *Decision:* Let's go with a simplified **Luring Lottery** variant. It's more visceral than Platonia (where most get 0 anyway) and shows the "greed destroys value" dynamic better.
      *   *Refinement:* To make it manageable in 75 mins with 18 students:
          *   Pot: 180 points (10 per student ideally).
          *   Choice: Submit a ticket count $t \in \{0, 1, 2, ..., 10\}$.
          *   Payoff: If $\sum t = 0$, everyone gets 0. If $\sum t > 0$, Prize = $180 / (\sum t)$. Individual Payoff = $t \times \text{Prize}$.
          *   Wait, if Prize = $180 / \sum t$, then Individual Payoff = $t \times (180 / \sum t) = 180 \times (t / \sum t)$. This is just a share of the pot. If I increase $t$, I increase my share. If everyone increases $t$, the pot stays 180, but the "cost" is abstract.
          *   *Correction for Luring Lottery:* The original Scientific American lottery had a fixed prize ($1M) divided by total entries. So if total entries are huge, the prize per entry is tiny.
          *   *Revised Payoff:* Fixed Pot $V = 100$ points.
          *   Each student chooses tickets $t_i$.
          *   Total Tickets $T = \sum t_i$.
          *   If $T=0$, payoff 0.
          *   If $T>0$, one ticket is drawn at random from the $T$ tickets. The holder gets $V$.
          *   Expected Payoff for $i$: $V \cdot (t_i / T)$.
          *   *Nash:* If others play $t_{-i}$, I want to maximize $t_i / (t_i + t_{-i})$. Derivative is positive. I should play max tickets (say 10).
          *   *Result:* Everyone plays 10. $T = 180$. Expected payoff per person = $100 \cdot (10/180) \approx 5.55$ points.
          *   *Superrational:* If we all play $t$, payoff is $100 \cdot (t / 18t) = 100/18 \approx 5.55$. Wait.
          *   *Math Check:* If payoff is $V \cdot (t_i / T)$, and $T = N \cdot t$, then Payoff = $V \cdot (t / Nt) = V/N$. The number of tickets cancels out!
          *   *Ah, the original Luring Lottery:* The prize was $1,000,000 / \text{Total Entries}$. So the *Prize Value* shrinks as entries grow.
          *   *Correct Payoff Structure:*
              *   Base Pot $K = 1000$ points.
              *   Total Entries $T = \sum t_i$.
              *   Winning Probability for $i$: $t_i / T$.
              *   Prize Value: $K / T$. (This is the crucial Hofstadter twist).
              *   Expected Payoff: $(t_i / T) \cdot (K / T) = K \cdot t_i / T^2$.
              *   *Nash:* If everyone plays 1, $T=18$. Payoff $\approx 1000 \cdot 1 / 18^2 \approx 3$. If I defect and play 10 (others play 1), $T=27$. My payoff $\approx 1000 \cdot 10 / 27^2 \approx 13.7$. Defection pays!
              *   *Superrational:* Maximize $K \cdot t / (Nt)^2 = K / (N^2 t)$. To maximize this, minimize $t$. So $t=1$.
              *   *Wait, is $t=0$ allowed?* If $t=0$, payoff 0. So $t=1$ is the cooperative optimum.
              *   *Nash Equilibrium:* Everyone maximizes $t_i / (t_i + C)^2$. FOC: $(t_i+C)^2 - t_i \cdot 2(t_i+C) = 0 \Rightarrow t_i+C - 2t_i = 0 \Rightarrow t_i = C$. In symmetric equilibrium, $t = (N-1)t$. This implies $t=0$ is the only solution? No, discrete.
              *   Let's simplify. The math might bog down the class.
              *   *Simpler Version:* **The "Divide the Pot" Game.**
              *   Pot = 100 points.
              *   Each student writes a number $x \in [0, 10]$.
              *   Sum $S = \sum x_i$.
              *   If $S \le 100$, everyone gets $x_i$. (Wait, this is a public goods game).
              *   Let's stick closer to Hofstadter's **Platonia Dilemma** for simplicity of calculation, but modify it to show the tension.
              *   Actually, the **Traveler's Dilemma** is great for this, but it's Basu, not Hofstadter.
              *   Let's go with a **Binary Platonia** but with a twist that highlights the reasoning.
              *   *Activity:* "The 18-Person Telegram."
              *   Rule: If *exactly one* person submits "YES", they get 100 points. If 0 or >1 submit "YES", everyone gets 0.
              *   *Nash:* Mixed strategy $p = 1/18$. Expected payoff $\approx 100 \cdot (1/18) \cdot (17/18)^{17} \approx 2$.
              *   *Superrational:* Same mixed strategy.
              *   *Problem:* As noted before, Platonia's Nash and Superrational solutions are often the same (the mixed strategy). This won't show the *conflict*.

      *   *Back to the Luring Lottery (Prize shrinks with total entries).*
          *   This is the best fit for "Greed destroys value."
          *   Let's make the math easy.
          *   **Pot:** 180 points (10 per student).
          *   **Choice:** Submit a integer $n \in \{1, 2, 5, 10\}$. (Limit options to speed up calculation).
          *   **Payoff:** Your Share = $(n / \text{Total } N) \times \text{Pot}$.
          *   *Wait, I need the Pot to shrink.*
          *   **Payoff:** Your Share = $(n / \text{Total } N) \times (1000 / \text{Total } N)$.
          *   Let's simplify the payoff function for the classroom.
          *   **Payoff:** $100 \times n / (\text{Total } N)$. (Standard lottery).
          *   *Constraint:* There is a "cost" to entries? No, Hofstadter's was prize division.
          *   Okay, let's use the **Scientific American** rule exactly but scaled.
          *   **Prize Pool:** 10,000 points.
          *   **Your Payoff:** $10,000 \times \frac{\text{Your Tickets}}{(\text{Total Tickets})^2}$.
          *   *Why squared?* Because Prize = $10,000 / \text{Total}$, and Prob = $\text{Your} / \text{Total}$.
          *   *Nash Incentive:* If Total is $T$, and I add $\Delta$, my payoff goes from $K \cdot t / T^2$ to $K \cdot (t+\Delta) / (T+\Delta)^2$. For small $T$, adding tickets helps.
          *   *Superrational:* If we all pick $t$, Payoff = $K \cdot t / (Nt)^2 = K / (N^2 t)$. Maximize by minimizing $t$. So $t=1$.
          *   *Nash:* If everyone picks 1, $T=18$. Payoff = $10000 / 18^2 \approx 30$. If I pick 10, $T=27$. Payoff = $10000 \cdot 10 / 27^2 \approx 137$. Huge incentive to defect.
          *   *Result:* Everyone picks 10. $T=180$. Payoff = $10000 \cdot 10 / 180^2 \approx 3$.
          *   *Contrast:* Cooperative (1) = 30 points. Defect (10) = 3 points.
          *   *This works.* It creates a massive gap between Nash outcome and Superrational outcome.

  4.  **Drafting the Plan:**
      *   **Time:** 75 mins.
      *   **Structure:**
          1.  Intro (5 min): Set stakes (participation points).
          2.  Round 1: The Game (15 min). Anonymous submission. Calculation. Reveal. (Likely disaster).
          3.  Small Group Discussion (15 min): "Why did this happen? What would you do differently?"
          4.  Round 2: The "Superrational" Frame (15 min). Explicitly tell them: "Assume everyone in this room reasons exactly like you." Re-run.
          5.  Debrief/Lecture (25 min): Map to Hofstadter, Nash, Causal vs. Logical.

  5.  **Addressing the "Chaos" Concern:**
      *   *Risk:* Students laugh at the math, don't take it seriously, or collude openly (which violates the "no communication" rule but is hard to stop).
      *   *Mitigation:* Keep the math on the projector. Use slips of paper. Emphasize *anonymous* submission.
      *   *Risk:* They don't see the point.
      *   *Mitigation:* The payoff gap (30 pts vs 3 pts) must be visible.
      *   *Risk:* "But we can just agree to all play 1!"
      *   *Mitigation:* Remind them this models strangers (Round 1). Round 2 is about *reasoning*, not talking.

  6.  **Refining the Activity for 18 Students:**
      *   Calculation of $\sum n_i$ and $\sum n_i^2$ (wait, formula is $t / T^2$) takes time.
      *   *Shortcut:* Have a TA or use Excel on projector. Or simplify the formula.
      *   *Simpler Formula:* Payoff = $100 / \text{Total Tickets}$. (If you submit 0, you get 0. If you submit $>0$, you share the pot equally among *tickets*? No, that's standard lottery).
      *   Let's stick to the Hofstadter formula: Payoff = $C \cdot \frac{t_i}{(\sum t)^2}$.
      *   To make calculation easy: Ask them to choose $t \in \{1, 5, 10\}$.
      *   Instructor sums the tickets live.
      *   Instructor calculates payoff live.

  7.  **Debrief Content:**
      *   Define Strategic Rationality (Nash): Treat others as environment. $P(\text{other chooses } X)$ is fixed.
      *   Define Superrationality: Treat others as mirrors. $P(\text{other chooses } X | \text{I choose } X) \approx 1$.
      *   Discuss the "Magic": It's not causal. It's logical correlation.
      *   Limitations: Real world isn't a seminar. People aren't identical.

  8.  **Predicting Pitfalls:**
      *   *The "Spite" Player:* One student submits 100 to ruin it. *Response:* Acknowledge this is the "Nash" behavior winning.
      *   *The "Collusion":* They talk before submitting. *Response:* Forbid talking in Round 1. Allow discussion in Round 2 but emphasize *reasoning* not *agreement*.
      *   *Confusion:* The math is too hard. *Response:* Provide a calculator or pre-calculate examples.

  9.  **Final Polish:**
      *   Make sure the tone is seminar-style (Socratic).
      *   Ensure the connection to Philosophy (decision theory) and Econ (equilibrium) is explicit.
      *   Add a "Take Home" thought experiment.

  10. **Self-Correction on the Math:**
      *   Wait, if Payoff = $K \cdot t_i / T^2$.
      *   If everyone plays 1: $T=18$. Payoff = $K \cdot 1 / 324$.
      *   If everyone plays 10: $T=180$. Payoff = $K \cdot 10 / 32400 = K \cdot 1 / 3240$.
