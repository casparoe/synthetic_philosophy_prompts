answer: |-
  Here is a detailed lesson plan designed for a 75-minute upper-level seminar. It balances the visceral experience of the game with the philosophical rigor required for your majors.

  # Lesson Plan: The Mirror and The Stranger
  **Topic:** Strategic Independence vs. Superrationality (Hofstadter)
  **Time:** 75 Minutes
  **Class Size:** 18 Students
  **Materials:** Slips of paper (2 per student), a basket/box, projector, timer.

  ## Learning Objectives
  1.  **Experiential:** Students will feel the frustration of the Nash equilibrium in a symmetric game where "rational" greed destroys collective value.
  2.  **Conceptual:** Students will distinguish between *causal independence* (standard game theory) and *logical correlation* (superrationality).
  3.  **Critical:** Students will evaluate the limits of superrationality in real-world contexts vs. idealized models.

  ---

  ## Part 1: The Luring Lottery (Activity Round 1)
  **Time:** 0:00 – 0:20 (20 mins)

  **1. Setup (5 mins)**
  *   **The Stakes:** Announce that today's activity determines 50% of their participation grade for the week. (Or use a token economy they care about).
  *   **The Rules:** Project the following clearly:
      1.  You are one of 18 players.
      2.  Write an integer number of "tickets" on your slip: $t \in \{1, 2, ..., 10\}$. (No zero, no communication).
      3.  **The Prize Pool:** 1,000 Points.
      4.  **The Mechanism:**
          *   Total Tickets ($T$) = Sum of all tickets submitted by the class.
          *   The Prize Pool is **divided by $T$**. (New Pool = $1000 / T$).
          *   One ticket is drawn at random from the $T$ tickets.
          *   **Your Expected Payoff** = (Your Tickets / $T$) $\times$ (New Pool).
          *   *Simplified Formula:* Payoff = $1000 \times \frac{t_i}{T^2}$.
  *   **The Instruction:** "Maximize your expected points. Do not talk. Submit anonymously."

  **2. Play & Calculation (10 mins)**
  *   Collect slips in a box.
  *   **Crucial Step:** While you count the total tickets ($T$), keep the class occupied. Ask them to write down their *prediction* of what the class average ticket number will be.
  *   Calculate the payoffs live on the board.
      *   *Example:* If $T = 180$ (everyone played 10), Payoff = $1000 \times 10 / 180^2 \approx 0.3$ points each.
      *   *Example:* If $T = 18$ (everyone played 1), Payoff = $1000 \times 1 / 18^2 \approx 3.1$ points each.
  *   **The Reveal:** Announce the Total Tickets and the Average Payoff.
      *   *Prediction:* In an Econ/Philos seminar, you will likely see a mix, but the average will skew high (6–10). The payoff will be abysmal compared to the cooperative optimum.

  **3. Immediate Reaction (5 mins)**
  *   Ask: "Who is unhappy with this outcome?" (Likely everyone).
  *   Ask: "Who played 1? Who played 10? Why?"
  *   Do not solve it yet. Let the frustration sit. "We will return to this."

  ---

  ## Part 2: The Hofstadter Intervention (Lecture & Discussion)
  **Time:** 0:20 – 0:45 (25 mins)

  **1. The Standard View (Nash/Strategic) (10 mins)**
  *   Draw the payoff function on the board: $U_i = 1000 \cdot t_i / (\sum t)^2$.
  *   Show the **Dominance Logic**:
      *   "If I assume the rest of the class sums to $R$, my payoff is $1000 \cdot t_i / (t_i + R)^2$."
      *   Show that for low $R$, increasing $t_i$ drastically increases payoff.
      *   "In standard game theory, your choice cannot *cause* their choice. They are independent agents. Therefore, you must treat their tickets as a fixed cost of doing business. You maximize your share of the shrinking pie."
  *   **Result:** The Nash Equilibrium is for everyone to max out tickets (10). The pie shrinks to near nothing. This is the **Tragedy of the Commons** via lottery mechanics.

  **2. Introducing Superrationality (15 mins)**
  *   Introduce Douglas Hofstadter (Scientific American, 1980s).
  *   **The Core Question:** "What if you know that every other person in this room is taking this same seminar, reading the same texts, and is just as smart as you?"
  *   **The Shift:**
      *   *Standard:* "I choose $X$. They choose $Y$ independently."
      *   *Superrational:* "I am an instance of a reasoning procedure. They are an instance of the *same* procedure. If I conclude that $t=10$ is rational, they will conclude $t=10$ is rational. If I conclude $t=1$ is rational, they will conclude $t=1$."
  *   **The Calculation:**
      *   Don't maximize $U_i$ given fixed $t_{-i}$.
      *   Maximize $U_i$ assuming $t_i = t_{-i} = t$.
      *   Payoff = $1000 \cdot t / (18t)^2 = 1000 / (324t)$.
      *   To maximize this, **minimize $t$**.
      *   **Solution:** Everyone plays 1.
  *   **The Tension:** Acknowledge the discomfort. "This feels like magic. How does my writing '1' *make* you write '1'? It doesn't causally. But it correlates logically because we are running the same 'software'."

  ---

  ## Part 3: The Mirror Round (Activity Round 2)
  **Time:** 0:45 – 0:55 (10 mins)

  **1. Reframing (2 mins)**
  *   Distribute new slips.
  *   **New Instruction:** "Play the exact same game. Same payoffs. However, before you choose, I want you to adopt the **Superrational Heuristic**: Assume that whatever reasoning leads you to pick a number will lead *everyone else* to pick that same number. You are not choosing a number; you are choosing a *policy* for the class."

  **2. Play & Reveal (8 mins)**
  *   Collect and count.
  *   **Likely Outcome:** The average will drop significantly compared to Round 1, but probably not to 1. Some will defect (Nash), some will cooperate (Superrational).
  *   **Compare:** Put Round 1 and Round 2 payoffs side-by-side on the board.
      *   Did the "Superrational" frame improve the collective outcome? (Usually yes).
      *   Did anyone exploit the cooperators? (Look for the outliers).

  ---

  ## Part 4: Debrief & Limitations
  **Time:** 0:55 – 1:15 (20 mins)

  **1. Mapping the Concepts (10 mins)**
  *   **Causal vs. Logical:** Standard game theory relies on *causal decision theory* (my action doesn't change your physics). Superrationality relies on *evidential* or *logical decision theory* (my action is evidence of what a reasoner does, and you are a reasoner).
  *   **The "Newcomb" Connection:** Briefly mention that this is structurally similar to Newcomb's Problem. Are you a "one-boxer" (superrational) or "two-boxer" (Nash)?
  *   **The Payoff:** In Round 2, did the "one-boxers" get punished by the "two-boxers"? If so, standard theory "won." If the group coordinated on low numbers, superrationality "won."

  **2. Honest Limitations (5 mins)**
  *   **The "Stranger" Problem:** Hofstadter's Luring Lottery was in *Scientific American*. Readers didn't know each other. In this room, you know you are all philosophy/econ majors. The "logical correlation" is much stronger here than in the real world.
  *   **The Noise:** Real people aren't identical reasoners. Some are tired, some are risk-averse, some are spiteful. Superrationality breaks down if the "source code" isn't identical.
  *   **The Equilibrium:** Standard game theory says the Round 1 outcome is the only *stable* equilibrium. Superrationality is not an equilibrium in the strict sense because a single defector *does* gain an advantage if others hold steady.

  **3. Closing Thought (5 mins)**
  *   "Hofstadter argued that in a world of increasingly similar AI or algorithmic agents, superrationality might become the *practical* standard, even if standard game theory rejects it philosophically. If you are coding a bot to trade against other bots, do you code it as a Nash maximizer or a Superrational cooperator?"
  *   **Assignment:** "Write a 1-page reflection: Under what conditions is it rational to ignore causal independence? Use the class activity as your case study."

  ---

  ## Instructor's Cheat Sheet: Predicting What Goes Wrong

  **1. The "Math Panic"**
  *   *Risk:* Students get bogged down in the $T^2$ formula and stop listening.
  *   *Fix:* Put the formula on the board immediately. Use round numbers for the live calculation. If possible, have a spreadsheet open on the projector where you just type in the 18 numbers and it auto-calculates the payoff.

  **2. The "Collusion"**
  *   *Risk:* In Round 2, a student shouts, "Everyone just write 1!"
  *   *Fix:* Pre-empt this. "In Round 2, you still cannot communicate. You must arrive at '1' through your own reasoning, not because someone told you to. If you write '1' because John told you to, that's not superrationality, that's coordination."

  **3. The "Spiteful Defector"**
  *   *Risk:* One student writes "10" in Round 2 specifically to prove a point, ruining the average.
  *   *Fix:* **Use this.** This is the best teaching moment. "Look! This is exactly why standard game theory rejects superrationality. If you know there is even *one* Nash maximizer in the room, the superrational strategy collapses. Superrationality requires common knowledge of superrationality."

  **4. The "It's Just Altruism" Objection**
  *   *Risk:* Students say, "I picked 1 because I wanted the class to do well."
  *   *Fix:* Correct them gently. "Altruism is caring about others' payoffs. Superrationality is selfishness applied to logical identity. You picked 1 because you realized *you* get more points if *everyone* (including you) picks 1. It's enlightened self-interest, not charity."

  ## Why This Works for Your Majors
  *   **Econ Majors:** They will immediately recognize the Nash Equilibrium in Round 1. They will feel the tension when the "irrational" Round 2 yields higher payoffs. It challenges their definition of rationality without dismissing math.
  *   **Philosophy Majors:** They will latch onto the decision-theory implications (Causal vs. Evidential). The "logical correlation" argument is pure philosophy of mind/metaphysics.
  *   **The Vibe:** It moves the class from passive listeners to active participants in a paradox. They aren't just learning about Hofstadter; they are *in* the Platonia Dilemma.

  ## Preparation Checklist
  1.  **Spreadsheet:** Create a simple Excel sheet with 18 input cells that calculates $\sum t$, $\sum t^2$ (actually just $(\sum t)^2$), and individual payoffs. Project this.
  2.  **Slips:** Cut 36 small slips of paper.
  3.  **Visuals:** One slide with the Payoff Formula. One slide with the Hofstadter Quote ("The essence of the dilemma is that...").
  4.  **Grading:** Decide how you convert "Points" to "Participation Credit" so they take it seriously. (e.g., "Top 50% of payoffs get full credit, others get half"). *Warning:* Competitive grading might encourage defection. Better: "If Class Average > 2 points, everyone gets full credit." (This aligns incentives with Superrationality). **I recommend the Class Average threshold.** It forces them to care about the collective outcome.
