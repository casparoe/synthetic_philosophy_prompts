      *   *Incentive:* Defecting gives 44 vs 10.
      *   *Outcome:* If all defect, 1 vs 10.
      *   *Perfect.* This creates a strong Prisoner's Dilemma-like tension but with continuous variables.

  11. **Final Review against constraints:**
      *   75 mins? Yes, tight but doable.
      *   18 students? Yes.
      *   No real money? Use participation points.
      *   Hofstadter source? Yes, Luring Lottery.
      *   Debrief on limitations? Yes.

      *(Self-Correction during drafting)*: I need to make sure I don't confuse them with the squared denominator. I will present it as "The Prize Pool is 10,000 points divided by the Total Number of Tickets. Your chance of winning is Your Tickets divided by Total Tickets." This explains the math intuitively without just dumping a formula.

      Let's write the plan.

