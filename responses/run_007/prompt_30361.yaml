  ### The translation

  In Scanlonian SRE, a deployment principle is valid only if no single stakeholder could reasonably reject it during a SEV review. "Reasonable rejection" maps to a violation of a personal SLO that constitutes a fundamental breach of trust (e.g., data corruption vs. latency). Consider a change: Option A risks catastrophic data loss for one enterprise client (SEV-0). Option B guarantees 200ms latency degradation for 10 million free-tier users (within SLO, but annoying).

  Standard utilitarian monitoring sums total error budget burn. If the aggregate latency breach exceeds the single data loss event in "user-minutes," utilitarianism deploys Option B. Scanlon's individualist restriction forbids this summation. You cannot offset one user's catastrophic failure against millions of minor degradations. You compare the strongest individual complaint against the strongest individual complaint. The enterprise client's complaint (data loss) dominates any single free-tier user's complaint (latency), regardless of population size. The principle "sacrifice integrity for aggregate latency" is reasonably rejected by the enterprise client. Therefore, the change is blocked. Error budgets are not pooled across users to justify individual catastrophes; they are constraints per service level, not per population sum. The question "do numbers count?" becomes: does adding more users to the latency cohort strengthen any *individual* rejection claim? No. Each free-tier user still only experiences 200ms. The aggregate metric is invisible to the contractualist decision matrix. Only the maximum individual severity matters. We treat each user session as an isolated blast radius. If one session faces SEV-0, no amount of SEV-3 elsewhere validates it. This aligns with change freezes triggered by single-point failures.

  ### The residue

  "Reasonable rejection" translates cleanly to "violating SLOs warranting a SEV-1 post-mortem." SEV severity levels map well to complaint strength. However, "individualist restriction" distorts SRE practice. Our dashboards are built on aggregation: p99 latency *is* summing complaints. Error budgets are explicitly pooled allowances for failure across the user base. To fit Scanlon, you must ignore the "p99" and look at the "p100 worst-case per user."

  The separateness-of-persons has no native expression. In SRE, a million users losing 1 second is strictly worse than one user losing 1 second, because total availability drops. Scanlon says the single user's total loss is the veto. The missing counterpart is the moral status of the user. SRE treats users as interchangeable load generators. Scanlon treats them as veto-wielding principals. We lack a metric for "individual dignity" vs. "aggregate uptime." Error budgets allow burning one user's experience to save the aggregate. Scanlon forbids this tradeoff. The residue is the realization that our "reliability" is actually "aggregate throughput stability," not individual guarantee. Also, "reasonable" in SRE is business-defined, collapsing moral weight into revenue loss.

  ### Your verdict

  Your vocabulary is missing the distinction, and it matters. Error budgets are exactly the kind of summing Scanlon forbids. They permit sacrificing the few for the many if the total burn stays under threshold. The anti-aggregation intuition is substantive: it protects minority use-cases from being optimized away. However, in SRE, ignoring aggregation is operationally fatal. You cannot engineer for the worst-case individual without bankrupting the system.

  SRE optimizes for the system's survival, not the individual's rights. If you adopt Scanlon's restriction, you stop optimizing p99 and start optimizing p100 per-user. This kills feature velocity. So, the intuition is morally robust but engineeringly impractical. Your vocabulary isn't broken; it's correctly optimized for utilitarian outcomes. The "missing distinction" is the cost of doing business at scale. You trade moral purity for availability. Ultimately, the anti-aggregation intuition is less substantive for engineering, but real for ethics.
