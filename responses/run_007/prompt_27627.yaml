answer: |-
  To the Community of Probabilists and Philosophers of Science,

  We, the undersigned participants in the adversarial collaboration on imprecise probabilities and sharp Bayesianism, submit this statement to clarify the grounds of our agreement, the precise nature of our disagreement, and the specific empirical and formal cruxes that remain to be settled. We begin by affirming the substantial common ground that forms the basis of our dialogue. Both camps accept that probability functions as a representation of partial belief rather than solely as a limit of relative frequency, and we agree that any acceptable probabilistic model must satisfy coherence constraints sufficient to avoid a sure loss, often formalized as avoiding a Dutch Book. We further agree on the descriptive validity of the Ellsberg paradox, acknowledging that human agents systematically violate the Sure Thing Principle in ways that suggest sensitivity to ambiguity rather than just risk. We also share the view that normative theories of belief should be action-guiding and that betting quotients provide a legitimate operational link between belief and preference. Where we diverge is not on the mathematics of measure theory itself, but on the normative constraints imposed upon the representing measures and the resulting preference orders.

  The core disagreement concerns the representational requirements for rational belief under ignorance. The sharp Bayesian position holds that rational belief must be represented by a unique probability distribution over the state space, updated strictly by conditionalization, and that rational preferences must form a complete ordering over all available gambles. The imprecise probabilist position holds that rational belief may be represented by a convex set of probability distributions, often called a credal set, updated via generalized conditionalization, and that rational preferences need only form a partial ordering, allowing for cases of genuine indecision where neither gamble is preferred to the other nor are they judged indifferent. Both sides agree that this formulation accurately captures the respective commitments, and we acknowledge that the sharp Bayesian views the uniqueness requirement as a consequence of rationality axioms such as completeness and continuity, while the imprecise probabilist views the set representation as a necessary consequence of respecting the evidential limits of the agent.

  To move this dispute forward, we have identified three specific cruxes where settling the matter would require at least one side to revise their position, and we record our divergent predictions on each. The first crux concerns the completeness of rational preferences. The concrete case is the standard Ellsberg two-urn experiment, where an agent chooses between gambles on an urn with known composition versus an urn with unknown composition. The sharp Bayesian predicts that any agent refusing to rank these gambles is either irrational or possesses a hidden sharp prior that they are failing to articulate, implying that elicitation procedures could eventually force a complete ordering without violating rationality. The imprecise probabilist predicts that a rational agent can persistently refuse to rank these gambles even under idealized elicitation, because the evidence does not support a unique prior, and that forcing a choice introduces artefactual precision that violates the coherence of representing ignorance. Settlement here would require demonstrating whether a complete preference order can be elicited from a reflective agent without coercion or whether such eliculation invariably violates the agent's own normative constraints on evidence.

  The second crux concerns the phenomenon of dilation, where conditioning on new information widens the interval of probabilities for an event rather than narrowing it. Formally, dilation occurs when for a partition of evidence events, the lower posterior probability of a hypothesis is less than or equal to the lower prior probability for every element of the partition, and the upper posterior is greater than or equal to the upper prior, with strict inequality for at least one element. The sharp Bayesian contends that dilation is a pathology indicating model misspecification or improper updating, as learning should reduce uncertainty, and predicts that any model exhibiting dilation can be reformulated into a sharp hierarchical model that does not dilate. The imprecise probabilist contends that dilation is a valid and sometimes necessary feature of robust inference when the relevance of the evidence to the hypothesis is itself uncertain, and predicts that attempts to sharpify the model will either fail to capture the original ignorance or will introduce unwarranted independence assumptions. The concrete case bearing on this is the Seidenfeld and Wasserman examples involving independent coins where observing the outcome of one coin dilates the probability of the other due to unknown correlations in the bias parameters.

  The third crux concerns the sequential choice problem and the value of information. The sharp Bayesian relies on Good's theorem, which proves that the expected value of free information is always non-negative for a expected-utility maximizer, and predicts that any rational agent will always accept free information before making a decision. The imprecise probabilist acknowledges that under some choice rules like maximality information has non-negative value, but argues that under rules like E-admissibility in sequential settings, an agent may rationally pay to avoid information because updating on that information may dilate the credal set to the point where no act remains admissible or where the agent becomes vulnerable to dynamic inconsistency. The concrete case is a decision problem where an agent can choose to observe a signal before betting, and the imprecise probabilist predicts that a rational agent following E-admissibility may refuse the signal or pay to avoid it to preserve the admissibility of a prior act, whereas the sharp Bayesian predicts this behavior is necessarily irrational and exposes the agent to a sure loss in a sequential Dutch Book.

  We have considered whether this dispute is merely verbal, turning on the definition of rationality or belief. We conclude that while there is a verbal component regarding the labeling of rationality, the dispute is substantive because it yields divergent prescriptions for action in sequential decision problems and different assessments of model adequacy in statistical inference. If the dispute were merely verbal, both sides would agree on which acts to take in all scenarios once the definitions were aligned, but the sharp Bayesian prescribes taking free information and the imprecise probabilist prescribes potentially refusing it, which is a behavioral divergence that cannot be resolved by semantics alone. We commit to designing experimental and formal tests around these three cruxes, specifically focusing on whether agents who refuse completeness are vulnerable to sure loss in sequential markets, whether dilation persists in models that satisfy all sharp Bayesian coherence checks, and whether the cost of avoiding information can be Dutch Booked under the imprecise updating rules. We invite the broader community to engage with these specific points rather than talking past one another on general principles.

  Sincerely,

  The Adversarial Collaboration Group on Imprecise Probabilities
