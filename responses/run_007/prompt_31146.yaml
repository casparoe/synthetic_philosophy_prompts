      *   *Point 5: "Self-Interest Theory Refutes Itself".* This is the crux. Parfit distinguishes between a theory being *self-defeating* and *self-refuting*.
          *   *Self-defeating:* Following the theory leads to worse outcomes than not following it (in terms of the theory's own aims).
          *   *Self-refuting:* The theory implies its own falsehood.
      *   *Parfit's Verdict:* Parfit argues S is *indirectly self-defeating*, not necessarily self-refuting in a logical sense. He uses this to motivate moving towards Critical Present-aim Theory (CP) or Common-Sense Morality (G), but the specific claim "S refutes itself" needs nuance.

