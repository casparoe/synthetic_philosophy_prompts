  2.  **Deconstruct the Flatmate's Summary vs. Parfit's Actual View:**
      *   *Source Material:* Derek Parfit, *Reasons and Persons* (1984), Part I, specifically the discussion on Self-Interest Theory (S) and the "Hitchhiker" case (often associated with Kavka's Toxin Puzzle or Newcomb problems, but Parfit uses it to discuss S vs. C vs. G).
      *   *Point 1: The Scenario.* The flatmate's setup is basically correct. It's a classic pre-commitment/trust problem.
      *   *Point 2: Rationality under S.* If S says "maximize own self-interest," and paying the money *after* rescue reduces self-interest with no further benefit, S dictates *not* paying. The driver, knowing S governs the hitchhiker, predicts non-payment. Rescue fails.
