      *   **The "Driver Knows" Claim:** Accurate. This assumes common knowledge of rationality.
      *   **The "Take the Drug" Claim:** This is where it gets tricky. Parfit talks about cultivating *dispositions*, not necessarily literal drugs (though the logic holds). The key is *dispositional* rationality vs. *act* rationality.
      *   **The "Rational to be Irrational" Slogan:** This is the pop-philosophy simplification. Parfit's point is more about *dispositional* rationality. It is rational to *have* a disposition that sometimes leads you to act against your immediate self-interest. It's not that irrationality itself is good, but that a *disposition to keep promises* (which S calls irrational in the moment) is instrumentally valuable.
