answer: |-
  Your intuition is correct. Your flatmate's summary captures the *spirit* of Parfit's argument but sacrifices the technical precision that makes the argument work. It turns a nuanced distinction between **act-rationality** and **dispositional-rationality** into a catchy paradox ("it is rational to be irrational"), and it conflates a theory being **self-defeating** with a theory being **self-refuting**.

  Here is an audit of the flatmate's claims against what a careful reader of *Reasons and Persons* would accept.

  ### 1. The Setup (Desert, Driver, Promise)
  **Verdict: Acceptable.**
  Parfit does use this case (often attributed to Gregory Kavka or Thomas Schelling in game theory contexts, but adopted by Parfit) to illustrate the failure of the Self-Interest Theory (S).
  *   **What Parfit accepts:** Under S, rationality is defined as maximizing one's own self-interest. Once you are safely in the city, paying the driver is a net loss to your self-interest with no further gain. Therefore, S dictates you should *not* pay.
  *   **What Parfit accepts:** The driver, knowing you are rational under S, predicts you will not pay. Therefore, the driver does not rescue you. You die. This is the worst outcome for your self-interest.

  ### 2. The Solution (The Drug/Pre-commitment)
  **Verdict: Mostly Acceptable, but slightly caricatured.**
  *   **What Parfit accepts:** The only way to be rescued is to alter your disposition so that you *will* pay, even when it is no longer in your immediate self-interest. Your flatmate calls this a "drug"; Parfit usually frames this as cultivating a **disposition** (e.g., being a promise-keeper).
  *   **The Nuance:** It isn't about becoming "irrational" in a general sense. It is about becoming disposed to act against the *direct* instructions of S in specific moments, in order to satisfy S *globally*.
  *   **The Flatmate's Error:** Calling this "making yourself irrational" is misleading. Parfit argues it is rational (under S) to acquire a disposition that causes you to act in ways that S would otherwise forbid. The disposition is instrumentally rational, even if the specific acts it produces are not.

  ### 3. The Claim: "It is Rational to be Irrational"
  **Verdict: Overstated/Conflated.**
  This is the "pop philosophy" slogan that makes the argument feel slick.
  *   **The Conflation:** The flatmate conflates **acting irrationally** with **having a disposition to act against immediate self-interest**.
  *   **Parfit's View:** Parfit does not conclude that irrationality is good. He concludes that **Self-Interest Theory is indirectly self-defeating.**
      *   If you try to follow S act-by-act (calculating self-interest at every moment), you fail to achieve your self-interest (you die in the desert).
      *   If you follow a different principle (e.g., "keep promises"), you achieve your self-interest better.
      *   Therefore, S tells you: "Do not follow me directly; follow a different disposition instead."
  *   **Why it matters:** Saying "it is rational to be irrational" sounds like a logical contradiction. Parfit's actual point is: "It is rational (by S's standards) to make yourself the kind of person who does not always follow S's direct commands." This is a distinction between the **criterion of rightness** (what makes an act rational) and the **decision procedure** (how you should think to achieve that).

  ### 4. The Conclusion: "The Self-Interest Theory Refutes Itself"
  **Verdict: False/Technically Incorrect.**
  This is the weakest link in your flatmate's chain.
  *   **Self-Defeating vs. Self-Refuting:**
      *   **Self-Refuting:** A theory that implies its own falsehood (a logical contradiction). Parfit does *not* claim S is logically contradictory.
      *   **Self-Defeating:** A theory that, if followed, prevents the achievement of its own aim. Parfit *does* claim S is self-defeating.
  *   **Direct vs. Indirect:** Parfit distinguishes between **Direct Self-Defeat** (doing what the theory says makes things worse) and **Indirect Self-Defeat** (the theory tells you to change yourself so you don't follow it directly). Parfit argues S is *indirectly* self-defeating.
  *   **Does it follow?** No. The fact that a theory tells you to adopt a disposition that ignores the theory's direct commands does not mean the theory is false. It means the theory is **practically unstable**. It suggests that S might not be the correct theory of rationality (Parfit prefers Critical Present-aim Theory, CP), but the Hitchhiker case alone doesn't logically *refute* S. It just shows S fails to guide agents to the best outcome *by S's own lights*.

  ### Summary Audit for Your Flatmate

  | Claim | Parfit's Verdict | Correction |
  | :--- | :--- | :--- |
  | **Driver won't rescue a rational S-agent.** | **Accept.** | Correct. S-agents cannot credibly commit. |
  | **Taking the drug saves you.** | **Accept.** | Pre-commitment/dispositions solve the trust problem. |
  | **Therefore, it is rational to be irrational.** | **Reject.** | It is rational to have a *disposition* that ignores immediate self-interest. That is not "irrationality"; it is instrumental rationality via a different decision procedure. |
  | **Therefore, S refutes itself.** | **Reject.** | S is **indirectly self-defeating**, not self-refuting. It fails to achieve its aim, but it isn't logically false. |

  **The Bottom Line:**
  Your flatmate has correctly identified that Parfit uses the Hitchhiker case to show that **narrow self-interest is self-undermining.** However, they have compressed Parfit's distinction between *acts* and *dispositions* into a paradox ("rational to be irrational"), and they have mistaken a pragmatic failure (self-defeat) for a logical refutation.

  The argument isn't that rationality tells you to abandon rationality; it's that **Self-Interest Theory tells you to abandon Self-Interest Theory as a decision procedure.** That is a damning critique of S, but it requires more precision than the pop-summary allows.
