answer: |-
  You have reconstructed one of the most significant pressure points in contemporary metaethics. Your argument effectively demonstrates why **Local Expressivism** (expressivism about moral language only) tends to metastasize into **Global Expressivism** (expressivism about all assertoric discourse).

  Your study group is debating two classic objections, but neither fully captures the structural issue you've uncovered. Here is the diagnosis of your argument, an evaluation of your group's objections, and a breakdown of which step to reject depending on what theoretical cost you are willing to pay.

  ### 1. Diagnosis: You Have Discovered the "Global Expressivist" Turn
  Your argument is logically valid. If the compositional semantics required to solve Frege–Geach for moral terms (Step 3) is generalizable to logical connectives *simpliciter*, then it must apply to descriptive terms as well (Step 4).

  Many contemporary philosophers (most notably **Huw Price** and, in a different way, **Allan Gibbard**) agree with your conclusion in Step (6). They argue that the distinction between "cognitive" (descriptive) and "non-cognitive" (moral) discourse is not a semantic distinction about *truth-conditions vs. attitudes*, but a functional or metaphysical distinction about *what role the judgment plays*.

  If you accept your argument, you become a **Global Expressivist**. You deny that descriptive language works by "mirroring reality" in a way that moral language does not. Instead, *all* language is a tool for expressing commitments/attitudes/plans. The "cat is on the mat" expresses a belief-commitment; "lying is wrong" expresses a norm-commitment. Logic governs the consistency of commitments globally.

  ### 2. Evaluating Your Study Group's Objections

  **Objection 1: "Belief contents compose truth-functionally; attitudes don't."**
  *   **Verdict:** This is weak/question-begging.
  *   **Why:** This objection assumes the very cognitivist framework the expressivist is trying to bypass. The expressivist's solution to Frege–Geach (Step 3) is precisely to show how attitudes *can* compose logically (e.g., via inconsistency of attitudes rather than truth-functional contradiction). If the expressivist successfully explains how moral attitudes compose logically to validate *Modus Ponens*, there is no principled reason why the attitude of *belief* couldn't be subject to the same compositional rules. To insist otherwise is to assert that descriptive language is "special" without explaining why the logic that saves moral language doesn't save descriptive language.

  **Objection 2: "Smuggling in propositional content collapses the view into cognitivism."**
  *   **Verdict:** This is the stronger objection (often associated with **Mark Schroeder**).
  *   **Why:** This targets Step (3). Schroeder argues that to solve Frege–Geach, expressivists must posit that moral sentences have propositional content (e.g., "Being for blaming for lying"). If they have content that enters into logical relations, they look suspiciously like beliefs. This is the **"Collapse Objection."**
  *   **Relevance to your argument:** If this objection holds, your argument in Step (4) is actually *too generous*. If expressivism collapses into cognitivism at Step (3), then descriptive language was already cognitive, and moral language turns out to be cognitive too. The distinction evaporates, but not because descriptive language became expressivist; because moral language became cognitivist.

  ### 3. Which Step Should You Reject?

  You have two stable philosophical positions available. You must choose which step to reject based on which theoretical cost you prefer.

  #### Option A: Reject Step (4) to Save Local Expressivism
  *   **The Move:** You insist that descriptive language *does* have truth-conditional semantics, while moral language has expressivist semantics. You block the generalization.
  *   **The Cost (Step 7):** You face the **Dual-Semantics Problem**. You must explain why the logical connectives ("if," "not," "and") operate on truth-conditions in descriptive contexts but on attitudes in moral contexts, yet somehow preserve the *same* logical validity (e.g., *Modus Ponens* works the same way in both).
  *   **The Risk:** This looks ad hoc. If logic is universal, why does its semantic underpinning switch depending on the topic? Blackburn (Quasi-Realism) tries to handle this by saying moral language *mimics* truth-conditional discourse so well that we can treat it *as if* it were truth-conditional, but the metaphysics differ.
  *   **Who holds this:** Early Simon Blackburn, Michael Ridge (Ecumenical Expressivism).

  #### Option B: Accept Step (4) & (5) and Become a Global Expressivist
  *   **The Move:** You accept that *all* assertoric discourse is a matter of expressing attitudes/commitments. "The cat is on the mat" expresses a belief-commitment.
  *   **The Cost:** You lose the traditional definition of expressivism as a contrast to cognitivism about *truth*. You can no longer say "Moral sentences aren't truth-apt." You must say "Truth is just a label we apply to successful assertion, whether moral or descriptive."
  *   **The Benefit:** You solve Frege–Geach uniformly. Logic is simply the study of incompatible commitments. You avoid the Dual-Semantics problem.
  *   **Who holds this:** Huw Price (Global Expressivism), Allan Gibbard (Norm-Expressivism), Robert Brandom (Inferentialism).

  ### 4. The Third Diagnosis: Direction of Fit

  There is a third way to diagnose the misstep, which preserves the distinction without dual semantics.

  The distinction between moral and descriptive language is not about **Semantics** (Step 1) but about **Direction of Fit**.
  *   **Descriptive:** Mind-to-World. The attitude (belief) aims to match the world. If the world doesn't match, the attitude is faulty.
  *   **Moral:** World-to-Mind. The attitude (desire/norm) aims for the world to match it. If the world doesn't match, the world is faulty.

  On this view, you can accept Step (4) (both express attitudes) and Step (5) (logic operates on attitudes), but reject the implication in Step (6) that the distinction *evaporates*. The distinction remains robust, but it is **pragmatic/functional**, not semantic.

  This allows you to say: "Yes, both sentences express attitudes subject to the same logical laws. But the *kind* of attitude differs in its functional role." This is the path of **Functional Expressivism**.

  ### Recommendation

  **Do not reject Step (4).**
  Your intuition in Step (7) is correct: there is no principled reason to block the compositional machinery for descriptive language if it works for moral language. Rejecting (4) forces you into a dual-semantics view that is notoriously difficult to maintain without slipping into cognitivism or ad-hocery.

  **Instead, refine Step (6).**
  The distinction between cognitive and non-cognitive discourse does not need to *evaporate*; it needs to be **relocated**.
  1.  **Accept Global Expressivism:** Admit that semantics is uniform (all discourse expresses commitments).
  2.  **Relocate the Contrast:** The difference between "The cat is on the mat" and "Lying is wrong" is not that one has truth conditions and the other doesn't. The difference is that the former involves a commitment sensitive to evidence/perception (belief), and the latter involves a commitment sensitive to norms/planning (norm-acceptance).

  **Conclusion:**
  Your study group's second objection (Collapse into Cognitivism) is the real threat you need to manage. To avoid it, you must adopt a **deflationary theory of truth**. If "truth" is just a device for endorsing assertions (as Price and Blackburn argue), then moral sentences can be "true" without positing moral properties. This allows you to accept your Step (5) without collapsing into traditional Cognitivism.

  **The Verdict:** Your argument is sound. It is a *reductio* of **Local** Expressivism, not Expressivism itself. The "misstep" is the assumption that Expressivism must be local. Embrace Global Expressivism, and you solve Frege–Geach without the dual-semantics headache.
