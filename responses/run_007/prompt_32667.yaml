      *   *Relevance:* Connect it back to *prompt engineering*. A prompt engineer shapes the context. Does that make her part of the "system"? That's a cool literary angle.

  7.  **Final Polish:**
      *   Ensure the tone is encouraging.
      *   Check that the philosophical terms (Syntax/Semantics, Functionalism, Biological Naturalism, Qualia) are explained or used clearly.
      *   Emphasize that the *uncertainty* is the dramatic engine.

  8.  *(Final check against prompt)*: Did I go move by move? Yes. Did I say who is right? Yes (neither/both). Did I say what's missing? Yes. Did I address the novel's premise? Yes.

