answer: |-
  You have hit on one of the most subtle and debated points in decision theory. Your intuition is sharp, but there is a critical mathematical error in your calculation of the Nash Equilibrium (NE) for the standard Platonia Dilemma.

  Once we correct that calculation, the distinction between Superrationality and Nash Equilibrium becomes stark. They are **not** the same, and the difference lies in how they treat the independence of other players' actions.

  Here is the breakdown of where the calculation diverges and why Superrationality is distinct from a Symmetric Nash Equilibrium.

  ### 1. The Calculation Error: Why $p=1/20$ is not a Nash Equilibrium

  You stated: *"each player is indifferent between sending and not sending when everyone else sends with probability 1/20."*

  In the standard Platonia Dilemma (no cost to sending, prize only if **exactly one** sends), this is incorrect. Let's look at the Expected Utility (EU) for a single player (You) when the other 19 players play $p = 1/20$.

  *   **Strategy: Don't Send**
      *   If you don't send, you cannot be the unique sender.
      *   $\text{EU}(\text{Don't}) = 0$.
  *   **Strategy: Send**
      *   You win \$1B if and only if **none** of the other 19 people send.
      *   Probability others don't send = $(1 - 1/20)^{19} \approx 0.377$.
      *   $\text{EU}(\text{Send}) = \$1\text{B} \times 0.377 = \$377\text{M}$.

  Since $\$377\text{M} > 0$, you are **not indifferent**. You strictly prefer to Send.

  If everyone else is playing $p=1/20$, your "Best Response" is to play $p=1$ (send with 100% certainty). Because a unilateral deviation improves your outcome, $p=1/20$ is **not** a Nash Equilibrium.

  In the standard Platonia Dilemma with no cost to sending, the unique Nash Equilibrium is actually **everyone sends with $p=1$**.
  *   If everyone sends, the probability of winning is 0.
  *   But if you deviate to "Don't Send," your probability of winning is still 0.
  *   Therefore, no player has an incentive to deviate. It is a "tragedy of the commons" equilibrium where everyone loses.

  ### 2. Where the $1/20$ comes from (Group Maximization)

  You derived $p=1/20$ by maximizing the probability that *exactly one person* wins.
  $$ P(\text{win}) = N \cdot p \cdot (1-p)^{N-1} $$
  Taking the derivative with respect to $p$ and setting it to 0 yields $p = 1/N$.

  This is the **Socially Optimal Symmetric Strategy**. It maximizes the group's chance of success.
  *   **Nash Equilibrium** asks: "Given what others are doing, what is best for *me*?"
  *   **Superrationality** asks: "Given that we all reason identically, what $p$ should we *all* choose to maximize the outcome?"

  ### 3. The Core Distinction: Independence vs. Logical Correlation

  This brings us to your main question: *Is superrationality basically just Nash equilibrium with some symmetry assumptions baked in?*

  **The answer is No.** The difference is not just symmetry; it is **causal/logical independence**.

  #### Nash Equilibrium (Independence)
  Nash Equilibrium relies on the assumption of **strategic independence**. When I calculate my best response, I treat your strategy as a fixed parameter. I assume that if I change my mind, you will not.
  *   *Reasoning:* "Even if everyone else randomizes at 5%, if I switch to 100%, I increase my odds without affecting their behavior."
  *   *Result:* Defection ($p=1$).

  #### Superrationality (Logical Correlation)
  Hofstadter's Superrationality relies on the assumption of **logical correlation**. It assumes that because we are all rational agents facing the same problem with the same information, we will all arrive at the same conclusion.
  *   *Reasoning:* "I cannot choose a strategy $p$ without acknowledging that every other superrational agent will choose the exact same $p$. My decision variable is not just $p_{\text{me}}$, it is $p_{\text{all}}$."
  *   *Result:* Cooperation ($p=1/20$).

  In Superrationality, you are essentially treating the other players as mirrors of your own reasoning process. In Nash Equilibrium, you treat them as independent parts of the environment.

  ### 4. Why the confusion?

  The confusion often arises because in **Coordination Games** (like "Meet me in New York"), the Superrational solution and the Nash Equilibrium often coincide (e.g., both pick "Grand Central Station").

  However, in **Social Dilemmas** (like Platonia, Prisoner's Dilemma, or Tragedy of the Commons), they diverge:
  *   **Nash:** Predicts the "rational" tragedy (everyone sends, no one wins).
  *   **Super:** Predicts the "cooperative" optimum (randomize at $1/N$, max chance of someone winning).

  ### Summary

  You aren't missing a hidden equivalence; you likely misidentified the Nash Equilibrium condition.

  1.  **$p=1/20$ is NOT a Nash Equilibrium.** It is unstable because individuals have an incentive to increase their sending probability if others stay low.
  2.  **$p=1/20$ IS the Superrational Solution.** It is derived by maximizing the group probability function under the constraint that all players must choose the same $p$.
  3.  **Superrationality $\neq$ Symmetric Nash.** Symmetric Nash still assumes you can deviate independently. Superrationality assumes your deviation implies a deviation by all identical reasoners.

  Hofstadter introduced Superrationality precisely because he felt Nash Equilibrium failed to capture how "identical rational minds" should interact in one-shot dilemmas. If Superrationality were just Symmetric Nash, his concept would have been redundant!
