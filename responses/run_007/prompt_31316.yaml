          *   Evaluate impact on the specific question: "Does natural selection explain adaptation?" (licenses treating it as ill-posed/settled vs. leaves it open).

  2.  **Deconstruct the Trigger Statement:**
      *   "Darwinism is not a testable scientific theory": Claims lack of empirical testability/falsifiability.
      *   "but a metaphysical research programme": Claims it functions as a heuristic, framework, or worldview rather than a specific law-like hypothesis.
      *   "Popper had already made the point": Appeals to authority (Karl Popper, specifically his views on falsification and later his recantation/nuance regarding evolution).

  3.  **Brainstorming Distinct Theses (The "Menu"):**
      *   *Idea 1: Tautology.* Survival of the fittest = survival of those who survive. (Logical truth, no empirical content).
      *   *Idea 2: Unfalsifiable in Principle.* No conceivable observation could refute it. (Strong Popperian claim).
      *   *Idea 3: Unfalsifiable in Practice.* Hard to test, but not impossible. (Methodological claim).
      *   *Idea 4: Framework/Paradigm.* It's a Kuhnian paradigm or Lakatosian research programme, not a single hypothesis. (Structural claim).
      *   *Idea 5: Metaphysical = Meaningless.* Logical Positivist reading. (Semantic claim).
      *   *Idea 6: Metaphysical = Heuristic.* Non-empirical but useful for guiding science. (Popper's later view).
      *   *Idea 7: Historical Narrative.* It explains history, not law-like regularities. (Narrative claim).

  4.  **Developing Each Thesis (Drafting & Evaluating):**

      *   *Thesis 1: The Tautology Charge.*
          *   Claim: "Fitness" is defined by reproductive success, so "the fittest survive" is analytic.
          *   Status: Substantive/Defensible (as a critique of *phrasing*), but False (as a critique of the *theory* because fitness can be defined independently via traits).
          *   Popper: He flirted with this, but it's more associated with Logical Positivists or early critics.
          *   Impact: If true, explanation is ill-posed (logic, not science).

      *   *Thesis 2: Strong Unfalsifiability (In Principle).*
          *   Claim: No observation could contradict evolution by NS.
          *   Status: False. (Rabbit in Precambrian, etc.).
          *   Popper: He said this in the 70s, then recanted.
          *   Impact: If true, question is ill-posed (not science).

      *   *Thesis 3: The "Research Programme" (Lakatosian/Popperian).*
          *   Claim: It's a hard core + protective belt. Not a single statement.
          *   Status: Substantive/Defensible.
          *   Popper: Yes, he used "metaphysical research programme" in *Unended Quest*.
          *   Impact: Leaves question open (the programme generates testable theories).

      *   *Thesis 4: Metaphysical = Meaningless (Logical Positivism).*
          *   Claim: It's nonsense because it's not verifiable.
          *   Status: False (Positivism is largely dead, and Darwinism is clearly useful).
          *   Popper: No, Popper distinguished metaphysical from meaningless.
          *   Impact: If true, question is meaningless.

      *   *Thesis 5: Metaphysical = Heuristic/Regulative.*
          *   Claim: It guides inquiry but isn't the law itself.
          *   Status: Substantive/Defensible.
          *   Popper: Yes, this was his mature view.
          *   Impact: Leaves question open (the specific mechanisms are testable).

      *   *Thesis 6: Historical vs. Nomological.*
          *   Claim: It explains specific histories, not universal laws.
          *   Status: Substantive/Defensible.
          *   Popper: Related to his distinction between historicism and science, but he accepted evolutionary biology as science later.
          *   Impact: Changes the *type* of explanation, doesn't dismiss it.

  5.  **Refining Popper Attribution:**
      *   Crucial nuance: Popper *did* call it a metaphysical research programme in the 1970s (*Unended Quest*).
      *   Crucial nuance: He *retracted* the claim that it was untestable in 1978 ("I have changed my mind...").
      *   So, citing Popper to say it's *not* testable is historically inaccurate regarding his final view, though accurate to a specific period.

  6.  **Addressing the Core Question ("Does NS explain adaptation?"):**
      *   If it's a tautology: No explanation (logical circle).
