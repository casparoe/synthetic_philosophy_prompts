answer: |-
  Your diagnosis is remarkably sharp. You have correctly identified that the stagnation of the St. Petersburg debate is not due to a lack of cleverness, but rather a lack of consensus on the *project* itself. You are right that one camp is trying to repair the engine of Expected Utility Theory (EUT), while the other is arguing that the engine is the wrong vehicle for this terrain.

  However, I believe we can sharpen your hypothesis further. The disagreement is not merely "within decision theory" vs. "about decision theory." It is a three-way clash between **Axiomatic Rationality**, **Empirical/Descriptive Reality**, and **Mathematical Physics (Ergodicity)**.

  Here is a breakdown of the kind of disagreement this is, why it persists, and where actual progress has been made.

  ### 1. The Three Camps (Sharpening Your Hypothesis)

  You identified two camps. I suggest there are three, and the impasse exists because they are optimizing for different virtues.

  **Camp A: The Axiomatizers (Internal Repair)**
  *   **Goal:** Preserve the coherence of rational choice theory.
  *   **Stance:** Rationality is defined by consistency (e.g., avoiding Dutch Books). If EUT recommends infinite entry fees, we must adjust the axioms to prevent this.
  *   **Solution:** Bounded Utility (Menger). If utility is unbounded, a St. Petersburg game can always be constructed. Therefore, rational agents *must* have bounded utility functions.
  *   **Critique:** This feels like a "solution by fiat." It solves the paradox by ruling out the possibility of the preferences that generate it, rather than explaining why those preferences are irrational in this specific context.

  **Camp B: The Pragmatists (External Critique)**
  *   **Goal:** Match the theory to human behavior and physical constraints.
  *   **Stance:** Decision theory should guide actual agents in the actual world. Infinite banks and infinite time do not exist.
  *   **Solution:** Finite bankrolls, probability discounting, or time horizons.
  *   **Critique:** As you noted, this feels contingent. It turns a philosophical paradox into an actuarial calculation. It explains why *we* don't pay \$1 million, but it doesn't explain why the *math* breaks down.

  **Camp C: The Ergodicity Economists (Reframing the Math)**
  *   **Goal:** Correct the mathematical modeling of growth and time.
  *   **Stance:** This is the most significant recent development (championed by Ole Peters and others). They argue the paradox arises from confusing **ensemble averages** (expected value across parallel universes) with **time averages** (growth of wealth over time in one universe).
  *   **Solution:** In the St. Petersburg game, the ensemble average is infinite, but the time average (geometric mean) is finite (and often negative if the entry fee is too high). Since we live in one universe over time, the time average is the relevant metric.
  *   **Impact:** This resolves the paradox without bounding utility or appealing to contingent bankroll limits. It argues that Expected Value is simply the wrong operator for non-ergodic processes.

  ### 2. What Kind of Disagreement Is This?

  It is not verbal (everyone agrees on the probability math). It is not purely substantive (it's not just about how much money is worth).

  It is **Methodological and Foundational**.

  The core tension is between **Idealization** and **Applicability**.
  *   **Idealization:** Philosophy and economics often use infinite idealizations to isolate principles (e.g., frictionless planes in physics). Camp A argues that if a theory breaks under infinite idealization, the theory is flawed.
  *   **Applicability:** Camp B and C argue that some idealizations destroy the phenomenon being studied. If a decision theory cannot handle the limit case where probabilities approach zero and payoffs approach infinity, it may be mathematically coherent but physically meaningless.

  The debate persists because there is no meta-rule for deciding when an idealization has become "too ideal." Is the infinite coin flip like a frictionless plane (a useful tool), or is it like a perpetual motion machine (a physical impossibility that invalidates the model)?

  ### 3. Has There Been Progress?

  Yes, but it is formal and conceptual rather than a "final solution."

  **Formal Progress: Menger's Theorem (1934)**
  Karl Menger proved that for Expected Utility to remain finite in *all* possible St. Petersburg-style games, the utility function *must* be bounded. This forced the "Bounded Utility" camp to admit they aren't just suggesting a fix; they are imposing a structural constraint on rationality. This clarified the stakes: you either accept bounded utility or reject EUT.

  **Conceptual Progress: The Law of Large Numbers (LLN) Failure**
  We now understand precisely *why* EV fails here. The Strong Law of Large Numbers requires a finite expected value to guarantee convergence of the sample mean to the population mean. In the St. Petersburg game, the variance is infinite. Therefore, the sample mean does not converge.
  *   **Significance:** This validates the intuition that "no reasonable person would pay." It's not just risk aversion; it's that the "Expected Value" does not represent a value you can expect to realize even over infinite trials. The expectation is a mathematical property of the distribution, not a predictor of outcomes.

  **Paradigm Progress: Risk-Weighted Expected Utility (Buchak)**
  Lara Buchak's work suggests that rationality involves not just weighting by probability and utility, but also by a "risk function." This allows for a formal representation of why we discount low-probability/high-payoff events without calling it irrational. This moves the debate from "fixing EV" to "expanding the parameters of rationality."

  **Physical Progress: Ergodicity Economics**
  As mentioned, the ergodicity reframing is the strongest candidate for dissolving the paradox. If you accept that wealth dynamics are multiplicative (geometric) rather than additive (arithmetic), the infinite expectation vanishes naturally. This shifts the burden of proof to the EUT defenders to explain why additive expectation is the correct norm for multiplicative reality.

  ### 4. Is This a Permanent Tension?

  If you view decision theory as a branch of **logic** (coherence of beliefs), the tension is permanent. You can always construct a game that breaks any unbounded system.

  If you view decision theory as a branch of **physics** (dynamics of agents in environments), the tension is resolvable. The St. Petersburg game is physically impossible (entropy, energy limits, time limits). Once you acknowledge that decision theory must be compatible with physical law, the paradox dissolves into a category error.

  ### Conclusion

  Your hypothesis is correct: the debate doesn't converge because the participants are arguing over the **purpose** of decision theory.
  *   Is it a **normative logic** of consistency? (Then Bounded Utility wins, but feels stipulative.)
  *   Is it a **guide for action**? (Then Finite Bankroll/Ergodicity wins, but feels contingent.)

  **The Verdict:** The most productive path forward is the **Ergodic/Time-Average** approach. It treats the paradox not as a puzzle about human psychology or utility functions, but as a mathematical error in how we apply expectation operators to temporal processes. It suggests that Expected Value is not the "basic tool for thinking about decisions under uncertainty" that you described it as, but rather a special case that only applies to ergodic (additive, repeatable) systems.

  The St. Petersburg Paradox is not a bug in human reasoning; it is a bug in the application of ensemble averages to non-ergodic time series. Recognizing this doesn't just solve the paradox; it undermines a significant portion of classical economic theory. That is why the debate persists—it threatens the foundation of the house.
