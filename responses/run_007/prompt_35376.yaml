      *Wait, one nuance:* In *Margot*, the vote was 4-3 to *honor*. In *David*, the vote was 4-3 to *not honor*. This shows the committee is perfectly split on the "Contented Dementia" issue. *Margot* says "Past Self wins." *David* says "Current Self wins." *Clara* sits right in the middle. To be consistent with the *majority* of precedents involving dementia + contentment? Actually, *Margot* and *Robert* honor. *David* does not. *Sarah* and *Elena* and *James* are different contexts. So 2 vs 1 on the specific "Contented Dementia + LST" issue. *Margot* is the direct precedent. I will recommend following *Margot*.

      *Wait, check David again:* David refused "tube feeding if severe dementia." He had severe dementia. He needed *temporary* tube feeding. Committee said No. Why? Likely because the *condition* triggering the need was temporary, not the dementia itself. The directive was interpreted as refusing *permanent* artificial nutrition stemming from the dementia, not a temporary bridge.
      *Clara:* Refuses "all life-sustaining treatment" (including antibiotics) if she reaches the stage of non-recognition. She has reached that stage. The infection is acute, but the *condition* triggering the refusal (dementia) is permanent. This aligns more with *Margot* (infection in dementia) than *David* (temporary swallowing issue in dementia).

