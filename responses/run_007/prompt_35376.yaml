      *   *Principle C: Validity & Competence at Signing.* Was the directive made with sound judgment and stable values?
          *   *Support:* Elena (Unanimous - invalid due to mania), James (Unanimous - valid until revoked competently).
          *   *Application to Clara:* She signed at Early Stage Alzheimer's. Is that like Elena (mania) or James (ALS)? Usually, early Alzheimer's is considered competent for ADs, unlike mania.
      *   *Principle D: Temporary vs. Permanent Intervention.*
          *   *Support:* Sarah (Temporary paralysis), David (Temporary tube feeding).
          *   *Application to Clara:* Antibiotics are temporary, but the *state* (dementia) is permanent. This distinguishes Clara from Sarah/David.

  5.  **Evaluate Consistency & Tensions:**

