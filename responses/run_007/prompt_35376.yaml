      *   **David:** 70yo -> Severe Dementia. Directive: No tube feeding if severe dementia. Status: Content, eats willingly. Issue: Temporary swallowing difficulty. *Decision: Do NOT Honor (4-3).*
          *   *Key Feature:* Temporary intervention vs. permanent state. Contentment matters? Close split (4-3). Distinguishes between permanent tube feeding (refused) vs. temporary bridge (allowed?). Or perhaps distinguishes based on current pleasure in eating.
      *   **Elena:** 25yo (Bipolar). Directive: No psych meds (signed during mania). Status: Depressive/Suicidal. *Decision: Do NOT Honor (Unanimous).*
          *   *Key Feature:* Competence/Validity at time of signing. Manic episode impairs judgment.
      *   **James:** 60yo (ALS). Directive: No vent. Status: Competent at time of decision. Changed mind *while still competent*. *Decision: Honor Current Wish (Unanimous).*
          *   *Key Feature:* Competent revocation trumps prior directive. Autonomy is current.

