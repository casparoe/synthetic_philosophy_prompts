          4.  **Recommendation:** Honor Directive (follow *Margot*). Explain why *David* is distinguishable.
          5.  **Vulnerability:** The moral weight of the "Current Self" vs. "Past Self" (Dworkin vs. Dresser debate). Or the specific competence at the time of signing (Early Alzheimer's nuance).

      *(Self-Correction during drafting)*: I need to be careful with *David*. In *David*, the directive was "no tube feeding if severe dementia." He had severe dementia. But he could eat willingly. The *need* was temporary swallowing difficulty. The committee voted *not* to honor. This suggests they viewed the *temporary* nature of the intervention as key, OR they weighted his current enjoyment of food heavily. In *Clara*, the antibiotics are also temporary. However, *Margot* is a *stronger* match because *Margot* specifically involved antibiotics for infection in a content dementia patient, and they *honored* it. *David* is the outlier regarding contentment. I must argue that *Margot* is the controlling precedent for *Clara*, and *David* is limited to its specific facts (temporary swallowing vs. permanent feeding).

      *Refining the Vulnerability:* The most philosophical vulnerability is the "Identity" question. Is Demented Clara the same person as Competent Clara? If not, *Margot* is morally wrong, even if legally consistent. The prompt asks for consistency with *track record*, but as a philosopher, the user knows the theoretical underpinnings matter. I should highlight the "Critical Interests vs. Experiential Interests" tension.

  9.  **Final Polish:** Check against all constraints.
      *   Identify principles? Yes.
      *   Explain prescription for Clara? Yes.
