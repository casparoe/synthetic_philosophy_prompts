      *   *Principle B: Current Welfare/Best Interests (The "David" Rule).* If the patient is currently content and suffering is low, do not honor the directive, especially for low-burden treatments.
          *   *Support:* David (4-3), Sarah (Implicitly, saving a recoverable person is in their interest).
