answer: |-
  Here is a set of desiderata for evaluating theories of algorithmic fairness. These are designed to help you assess whether a proposal is robust enough to handle the complexity of real-world decision-making.

  ### I. The Cases a Theory Must Classify Correctly

  A theory of fairness must yield the right verdict on specific paradigmatic cases. If a theory says a clearly unfair situation is fair (or vice versa), it is deficient.

  **1. Explicit Use of Protected Categories**
  *   **The Case:** An algorithm denies loans to applicants explicitly because their input data includes "Race: Black" or "Sex: Female."
  *   **Consideration:** This violates anti-discrimination law and basic moral norms against direct prejudice.
  *   **Status:** **Non-negotiable.** Any theory that permits explicit discrimination based on morally irrelevant traits is immediately rejected.

  **2. Proxy Discrimination (Redlining)**
  *   **The Case:** The algorithm does not use "Race," but uses "Zip Code" which is highly correlated with race due to historical segregation, resulting in the same discriminatory outcome.
  *   **Consideration:** "Fairness through blindness" (ignoring protected attributes) fails here. A theory must detect when a neutral feature functions as a stand-in for a protected one.
  *   **Status:** **Non-negotiable.** A theory that cannot distinguish between a genuine merit signal and a proxy for bias is practically useless.

  **3. Treatment of Identical Individuals**
  *   **The Case:** Two applicants have identical relevant qualifications (credit score, income, debt) but receive different loan decisions.
  *   **Consideration:** This violates basic consistency and procedural justice. If the inputs are the same, the output should be the same (unless randomness is explicitly justified).
  *   **Status:** **Non-negotiable.** This is the baseline for individual fairness; without it, the system is arbitrary.

  **4. Harms That Appear Only at the Group Level**
  *   **The Case:** An algorithm treats every individual "consistently" based on data, but the cumulative effect devastates a specific community (e.g., predictive policing that over-patrols a neighborhood, generating more arrest data, which reinforces the patrol).
  *   **Consideration:** Individual consistency does not guarantee systemic equity. A theory must account for feedback loops and disparate impact.
  *   **Status:** **Preference of one camp (Structuralists).** While increasingly important, some libertarian or strict individualist frameworks prioritize individual consistency over group outcomes. However, a *complete* theory should address this.

  ### II. The Distinctions It Must Not Collapse

  A robust theory must be able to tell these concepts apart, even if it argues one is more important than the other. Collapsing them leads to confusion.

  **5. Group Fairness vs. Individual Fairness**
  *   **The Distinction:** Group fairness looks at statistics across populations (e.g., "Do men and women get loans at the same rate?"). Individual fairness looks at specific persons (e.g., "Did *this* woman get the same treatment as *that* man with similar credentials?").
  *   **Consideration:** You can satisfy group statistics by randomly denying qualified individuals from the majority group, which is unfair to those individuals.
  *   **Status:** **Non-negotiable.** A theory must explicitly state which level it prioritizes, as they often conflict.

  **6. Process Fairness vs. Outcome Fairness**
  *   **The Distinction:** Process fairness asks if the algorithm followed the right rules (e.g., was the data clean?). Outcome fairness asks if the result was equitable (e.g., did the right people get loans?).
  *   **Consideration:** A perfectly executed process can yield biased outcomes if the historical data is biased. Conversely, manipulating outcomes to look fair can require unfair processes.
  *   **Status:** **Preference of one camp.** Deontologists prioritize process; consequentialists prioritize outcomes. A theory must distinguish them to know which it is optimizing.

  **7. Bias in Training Data vs. Bias in the Decision Rule**
  *   **The Distinction:** Is the problem that the history we learned from was racist (data bias), or that the mathematical formula we used is racist (rule bias)?
  *   **Consideration:** Fixing the rule doesn't help if the data is garbage ("Garbage In, Garbage Out"). Fixing the data doesn't help if the rule exploits it.
  *   **Status:** **Non-negotiable.** Accountability requires knowing where the failure occurred.

  ### III. Formal Results It Must Not Contradict

  **8. Compatibility with Impossibility Theorems**
  *   **The Constraint:** Mathematical proofs (by Chouldechova; Kleinberg, Mullainathan, and Raghavan) show that you cannot simultaneously satisfy **Calibration** (predictions match real-world probabilities), **Equalized Odds** (error rates are equal across groups), and **Demographic Parity** (selection rates are equal across groups) unless the groups have identical base rates (e.g., identical default rates).
  *   **Consideration:** Math does not negotiate. If a theory claims to satisfy all these criteria simultaneously in all cases, it is mathematically false.
  *   **Status:** **Non-negotiable.** Any theory contradicting this is invalid.

  ### IV. Trade-offs and Exclusions

  **Jointly Unsatisfiable Subsets**
  The most critical tension is the "Impossibility Trinity." You generally cannot satisfy **Calibration** + **Balance for Positive Class** (Equalized Odds) + **Balance for Negative Class** simultaneously when base rates differ between groups. A theory must choose which to sacrifice.

  **The Single Requirement That Excludes the Most Proposals**
  The requirement that does the most work in filtering out inadequate theories is: **"The theory must account for bias in the target variable (the historical label)."**
  Most standard statistical proposals (like Equalized Odds or Calibration) assume the historical data (e.g., who *actually* defaulted on a loan, or who *actually* committed a crime) is "ground truth." If the historical data is biased (e.g., over-policing led to more recorded crimes in one neighborhood), optimizing for these metrics locks in the bias. A theory that cannot handle biased labels is excluded by this requirement.

  ### V. Scorecard of Main Proposal Families

  Here is how the major families of fairness proposals stack up against the desiderata above.

  *   **Statistical Parity (Demographic Parity):** Fails on **Individual Fairness** and **Merit** (it may reject qualified majority candidates to hit quotas) and contradicts **Impossibility Results** if claimed alongside calibration; however, it succeeds on **Group-Level Harms**.
  *   **Equalized Odds:** Succeeds on **Group Fairness** regarding error rates but fails the **Biased Target Variable** requirement (it assumes historical arrests/defaults are truthful) and conflicts with **Calibration** under impossibility theorems.
  *   **Calibration-Based Views:** Succeeds on **Predictive Accuracy** and **Process** consistency but fails on **Group-Level Harms** (you can be calibrated while systematically denying a group opportunities) and ignores **Proxy Discrimination**.
  *   **Individual Fairness:** Succeeds on **Identical Individuals** and **Process** but fails on **Group-Level Harms** (it cannot fix systemic historical disadvantages) and struggles to define "similarity" between individuals without bias.
  *   **Causal Approaches:** Succeeds best on **Proxy Discrimination** and **Bias in Data** (by modeling the mechanism of harm) but is often **Non-negotiable** in practice because causal structures are difficult to prove from observational data alone.

  ### Summary for Your Paper
  When evaluating proposals, do not look for the one that "solves" fairness. Instead, look for the one that is most honest about which desiderata it sacrifices. An adequate theory must admit that it cannot satisfy all statistical criteria simultaneously (due to impossibility results) and must explain how it handles historical bias in the data, as this is the point where most mathematical definitions break down in the real world.
