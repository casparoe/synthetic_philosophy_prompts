answer: |-
  This is a fascinating observation, and it cuts right to the heart of institutionalized epistemology. You have essentially identified a bureaucratic instantiation of the Kuhn-Lakatos debate. The funding agency you are studying has, perhaps unintentionally, operationalized a specific philosophy of scientific change through its administrative structures.

  Here is an analysis of what these two streams commit the reviewers and the agency to, structured around the questions you raised.

  ### 1. The Ordinary Stream: Cumulative Rationality and Normal Science
  You are correct that the ordinary stream presupposes a **Kuhnian "Normal Science"** model, but it also aligns closely with a **Lakatosian "Positive Heuristic."**

  *   **Epistemic Commitment:** It assumes scientific progress is primarily cumulative. Knowledge grows by extending the reach of existing frameworks, refining methods, and solving puzzles defined by the current paradigm.
  *   **Theory Choice:** It presupposes that there is a neutral, shared language of evaluation (standards of rigor, validity, significance) that exists *outside* of specific theoretical commitments. When a reviewer says a proposal "doesn't engage with the literature," they are asserting that the literature defines the boundaries of legitimate inquiry.
  *   **The Role of Deviation:** In this framework, deviation is treated as *error* rather than *innovation*. If you don't use standard terminology, you are signaling that you haven't been properly socialized into the discipline. This is a quality control mechanism designed to minimize false positives (funding nonsense) at the cost of false negatives (rejecting novelty).
  *   **Philosophical Label:** This is a commitment to **methodological conservatism**. It treats the current state of the art as the baseline for rationality.

  ### 2. The High-Risk/High-Reward (HRHR) Stream: The Institutionalization of Revolution
  The existence of the HRHR stream is indeed a tacit admission that **standard peer review is structurally blind to revolutionary science.**

  *   **The Admission:** By creating a separate stream with different criteria, the agency admits that the standards used in the ordinary stream are *local* to the paradigm, not universal. They acknowledge that applying "normal science" criteria to "extraordinary science" proposals results in systematic rejection of the latter.
  *   **Kuhn's Problem:** Kuhn argued that during a paradigm shift, the standards of evaluation themselves change. A revolutionary proposal often looks like "bad normal science" to the incumbents. The HRHR stream is an attempt to bypass the "incommensurability barrier" by changing the incentives of the gatekeepers.
  *   **Lakatosian Shift:** In Lakatos's terms, the ordinary stream funds work within the "protective belt" of the current research programme. The HRHR stream is designed to fund potential shifts to a new "hard core."

  ### 3. Consistency or Inconsistency?
  Are these two streams inconsistent? **Pragmatically, no. Philosophically, they imply a pluralistic view of rationality.**

  If the agency claimed that the ordinary stream's standards were *universally* valid, then the HRHR stream would be inconsistent. However, most funding bodies operate on a **portfolio theory of epistemology**.

  *   **Diversification:** They recognize that science requires both stability (to exploit current knowledge) and volatility (to explore new possibilities). This mirrors evolutionary biology: you need stabilizing selection to maintain fitness, but you also need disruptive selection to adapt to new environments.
  *   **Contextual Rationality:** The agency is effectively saying: "Rationality is context-dependent." In a context of exploitation (ordinary stream), adherence to standards is rational. In a context of exploration (HRHR), deviation is rational.
  *   **The Tension:** The inconsistency arises only if the *same reviewers* apply *different logics* without acknowledging the shift. If a reviewer penalizes a proposal in the ordinary stream for being "too speculative" but praises the *same* proposal in the HRHR stream for being "bold," they are not being inconsistent; they are correctly applying the local norms of the specific sub-game they are playing.

  ### 4. The Incommensurability Problem
  This is the deepest philosophical knot. If you take Kuhnian incommensurability seriously (i.e., there is no neutral language to compare paradigms), **can a reviewer ever fairly assess a revolutionary proposal?**

  *   **The Paradox:** If the proposal challenges the core assumptions that ground the reviewer's standards of evidence, the reviewer lacks the tools to evaluate it. To evaluate it fairly, they would have to temporarily suspend their own paradigm, which is cognitively difficult and professionally risky.
  *   **Kuhn's Later View:** In his later work (e.g., "Objectivity, Value Judgment, and Theory Choice"), Kuhn softened his stance. He argued that while there is no *algorithm* for theory choice, there are shared *values* (accuracy, consistency, scope, simplicity, fruitfulness).
  *   **How HRHR Reviewers Actually Judge:** Since they cannot judge the *truth* of the new framework (it doesn't exist yet), they judge the **potential for fruitfulness** and the **competence of the agent**. They shift from evaluating the *product* to evaluating the *process* and the *person*. They ask: "If this person is right, how much would it explain?" rather than "Is this methodologically sound by current standards?"

  ### 5. Designing a Review Process for Incommensurability
  If an agency truly took incommensurability seriously, the ordinary review process would look very different. Here is what a process designed on that assumption might entail:

  1.  **Decoupling Standards from Content:** Reviewers would be instructed to evaluate internal coherence and potential explanatory scope, rather than adherence to external methodological norms.
  2.  **Adversarial Collaboration:** Instead of sending a proposal to three experts in the dominant paradigm, the agency might pair a proponent of the new idea with a critic to write a joint assessment of where the empirical stakes lie.
  3.  **Outsider Reviewers:** To mitigate the bias of the incumbent paradigm, reviews should come from adjacent fields or "outsiders" who do not share the specific commitments of the field being challenged. (Some HRHR programs already do this).
  4.  **Person-Based Funding:** Since the *project* cannot be fully evaluated against future standards, funding should be attached to the *researcher's track record of insight*, giving them the freedom to pivot as the new paradigm develops. (e.g., MacArthur "Genius" grants).
  5.  **Longitudinal Evaluation:** Recognizing that revolutionary work often fails initial empirical tests (because the new instruments don't exist yet), evaluation cycles should be extended. A 5-year review window is often too short for a paradigm shift to show fruitfulness.

  ### 6. A Critical Caveat: The "Revolution by Committee" Problem
  There is a profound irony here that might be worth exploring in your project. **Kuhn argued that scientific revolutions are not planned.** They emerge from the accumulation of anomalies that the old paradigm cannot solve.

  By creating a "High-Risk" stream, the agency is trying to **bureaucratize the unexpected.**
  *   They are asking researchers to *promise* a revolution in a grant application.
  *   But if a researcher can articulate exactly how they will overturn the paradigm using standard grant language, is it truly revolutionary? Or is it just "risky normal science"?
  *   This creates a perverse incentive where researchers must perform "radicalism" using the language of the establishment to get the radical funding.

  ### Summary for Your Project
  The pattern you see commits the funding body to a **pluralistic epistemology**.
  1.  **Ordinary Stream:** Committed to **Normal Science** (Kuhn) / **Positive Heuristic** (Lakatos). Assumes shared standards and cumulative progress.
  2.  **HRHR Stream:** A tacit admission that **peer review is paradigm-bound**. It is an institutional workaround for incommensurability.
  3.  **Consistency:** They are consistent only if viewed as a **portfolio strategy** managing different types of epistemic risk.
  4.  **Incommensurability:** A review process taking this seriously would move away from methodological compliance toward evaluating **explanatory potential** and **researcher capacity**, likely utilizing outsider reviewers and longer time horizons.

  You might frame your analysis around the idea that the funding agency is engaging in **"Applied Philosophy of Science,"** whether they realize it or not. They have recognized that a single metric of "rigor" is insufficient to capture the dual nature of scientific progress (stability vs. change), and they have built two distinct epistemic machines to handle each.
