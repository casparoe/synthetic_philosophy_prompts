      *   **The Incommensurability Problem:**
          *   This is the crux. If standards are paradigm-dependent, how do HRHR reviewers judge?
          *   They likely use *meta-standards* (coherence, potential explanatory power, track record of the *agent* rather than the *proposal*).
          *   Reference: Kuhn's later work on "no algorithm for theory choice" but existence of shared values (accuracy, consistency, scope, simplicity, fruitfulness).
      *   **Designing a Review Process for Incommensurability:**
