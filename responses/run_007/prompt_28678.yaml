      *   *Addressing the "Resistance":* Make sure to emphasize that Shakespeare isn't writing a case study; he's writing tragedy. The "supernatural" element is a key resistance point against a purely naturalistic CP reading.

  8.  **Final Review against Prompt:**
      *   (1) Distinctions set out? Yes.
      *   (2) Hallucination objection addressed? Yes.
      *   (3) Internal experiment/first-person access? Yes.
      *   (4) Contribution (motivation) and Resistance (supernatural/tragedy)? Yes.

  9.  *(Self-Correction during drafting)*: I need to be careful not to say Macbeth *is* a case of CP. I need to say it *illuminates* the debate. The prompt asks "how honestly the pairing holds up." I must be critical. The pairing is heuristic, not definitive.

