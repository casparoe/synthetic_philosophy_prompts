  2.  **Deconstruct "Earning to Give" (EtG):**
      *   What is EtG fundamentally? It's a career strategy where one pursues a high-earning career not for personal consumption but to donate a significant portion of income to effective charities.
      *   Why is it controversial? It relies on counterfactuals, replaceability, marginal utility of money, and personal fit.
      *   The specific scenario: Nonprofit (Global Health Logistics) vs. Consulting (3x pay).
      *   The claim being made: Consulting is *obviously* more ethical.

  3.  **Brainstorm Precise Claims/Interpretations:**
      *   *Claim 1: The Arithmetic Claim.* If I donate $X from consulting, it's more than $Y from the nonprofit. (Trivial but incomplete).
      *   *Claim 2: The Dominance Claim.* EtG *always* or *usually* produces more good than direct work. (Strong, likely false).
      *   *Claim 3: The Replaceability Claim.* Someone else would have done the nonprofit job anyway, but no one would have donated the consulting money. (Crucial, often misunderstood).
      *   *Claim 4: The Counterfactual Claim.* The comparison is between *me* in consulting vs. *me* in nonprofit, holding the world constant otherwise. (Standard EA framework, but hard to estimate).
      *   *Claim 5: The Marginal Utility Claim.* Money donated to top charities does more good per dollar than the specific work done in the nonprofit role. (Depends on the role).
      *   *Claim 6: The "Shut Down" Claim.* EtG is a trump card that ends discussion. (Meta-claim, definitely false).

  4.  **Evaluate Each Claim (True/False/Defensible):**
      *   *Arithmetic:* Trivially true that 3x salary allows more donation, *if* you actually donate. But ignores impact of work.
      *   *Dominance:* False. 80,000 Hours and EA orgs explicitly say EtG is niche.
      *   *Replaceability:* Substantive. Hard to know. In global health logistics, replaceability might be low (specialized skills).
      *   *Counterfactual:* Substantive. Needs modeling.
      *   *Marginal Utility:* Defensible *if* the nonprofit role is low-impact, but false if the role is a bottleneck.
      *   *Trump Card:* False. It's a hypothesis, not a law.

  5.  **Identify the Argument's Necessary Reading:**
      *   To say consulting is *obviously* better, the arguer needs the **Strong Dominance Claim** combined with a **Low Replaceability Assumption** for the nonprofit role.
      *   They need to assume: (Consulting Donation Impact) > (Nonprofit Direct Impact).
      *   They need to assume: The nonprofit job would be filled by someone almost as good (high replaceability).
      *   They need to assume: The top charities can absorb the extra funds effectively (diminishing returns aren't hit yet).

  6.  **Assess Survival of that Reading:**
      *   Does it survive? Generally, no, not as a universal rule.
      *   Global health logistics is often talent-constrained, not just cash-constrained.
      *   3x salary doesn't mean 3x impact (taxes, consumption, diminishing returns of money).
      *   Personal fit matters (burnout, performance).
      *   EA consensus (80k) is that EtG is good for *some*, not *all*.

  7.  **Draft the Content (Iterative refinement for tone and clarity):**
      *   *Tone:* Analytical, charitable but firm, suitable for an EA group discussion (rational, evidence-based).
      *   *Structure:* Introduction -> List of Claims -> Analysis of the Specific Argument -> Conclusion/Recommendation.
      *   *Key Concepts:* Counterfactual impact, replaceability, diminishing returns, talent vs. funding constraints.

  8.  **Refining the Claims (Self-Correction during drafting):**
