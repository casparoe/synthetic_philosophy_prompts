answer: |-
  Here is a breakdown of the precise claims underlying "Earning to Give" (EtG), evaluated for truth and relevance. You can bring this list directly to your meeting to move the conversation from slogans to specific counterfactuals.

  ### Part 1: Precise Claims Behind "Earning to Give"

  Here are six distinct propositions often conflated under the EtG label.

  **1. The Arithmetic Claim**
  *   **Claim:** "A high-earning career allows you to donate more money than a low-earning career."
  *   **Verdict:** **Trivially True.**
  *   **Caveat:** This only holds if you actually donate the surplus. Earning \$300k and spending \$300k produces zero EtG impact. It also ignores taxes and the higher cost of living often associated with high-earning hubs.

  **2. The Funding-Constraint Claim**
  *   **Claim:** "Top effective charities are currently constrained by funding, not by talent or implementation capacity."
  *   **Verdict:** **Substantive and Contingent.**
  *   **Analysis:** This was widely accepted in EA circa 2013–2015. Today, it is mixed. GiveWell top charities often have funding gaps, but many direct-work organizations (especially in global health logistics) are talent-constrained. If the nonprofit cannot find skilled logisticians, money alone may not solve the bottleneck.

  **3. The Replaceability Claim**
  *   **Claim:** "If you don't take the nonprofit job, someone else almost as good will take it immediately, rendering your direct impact near-zero."
  *   **Verdict:** **Substantive and Often False.**
  *   **Analysis:** This is the weakest link in the consulting argument. Specialized roles (like global health logistics) often have shallow talent pools. If the position remains vacant or is filled by someone significantly less competent, your counterfactual impact is high. High-earning roles (like generalist consulting) often have deeper applicant pools, making *you* more replaceable in the consulting job.

  **4. The Marginal Utility Claim**
  *   **Claim:** "Every dollar you donate to a top charity does more good than every dollar's worth of value produced by the direct-work role."
  *   **Verdict:** **Substantive and Defensible (but not guaranteed).**
  *   **Analysis:** This requires comparing the specific cost-effectiveness of the nonprofit's work against the cost-effectiveness of charities like the Against Malaria Foundation. If the nonprofit is moving bednets at \$50/life saved, and AMF is at \$5,000/life saved, EtG wins. If the nonprofit is solving a unique supply-chain bottleneck that unlocks millions in other funding, direct work might win.

  **5. The Dominance Claim**
  *   **Claim:** "Earning to Give is *generally* the highest-impact career path for most people."
  *   **Verdict:** **False.**
  *   **Analysis:** 80,000 Hours and leading EA organizations no longer recommend EtG as the default. They recommend it for a specific niche: people who have a comparative advantage in earning, can psychologically handle the work, and are willing to donate significant portions (often 50%+).

  **6. The Trump Card Claim**
  *   **Claim:** "Invoking EtG ends the debate about career choice."
  *   **Verdict:** **False.**
  *   **Analysis:** EA is fundamentally about *comparative* advantage and counterfactuals. Using a slogan to bypass the calculation of those counterfactuals is anti-epistemic.

  ***

  ### Part 2: Analyzing the Consulting-vs-Nonprofit Argument

  To argue that the consulting job is *obviously* more ethical in your specific case, the proponent is relying on a specific combination of the claims above.

  **The Required Reading:**
  To make their case, they need you to accept the **"Strong Substitution Argument."** This requires three premises to hold simultaneously:
  1.  **High Replaceability:** The nonprofit logistics role would be filled by someone nearly as effective if you decline it.
  2.  **Funding Priority:** The nonprofit is more cash-constrained than talent-constrained (i.e., they have the money for supplies but lack the supplies, not the money to buy them).
  3.  **Donation Fidelity:** You will actually donate the difference (the 2x salary surplus) to charities that are more effective than the nonprofit's direct work.

  **Does This Reading Survive Scrutiny?**
  **Likely No.** Here is why the argument fails as a "conversation stopper":

  *   **Talent vs. Cash:** Global health logistics is often a "hard skills" bottleneck. It is harder to find a competent logistician than it is to find \$100,000. If your work unlocks \$500,000 worth of aid delivery, earning \$300k to donate \$100k is a net loss.
  *   **Diminishing Returns:** If the top charities cannot effectively absorb your extra donations (due to saturation), the marginal impact of your donation drops. Direct work in a bottlenecked area may have increasing returns.
  *   **Performance & Burnout:** If you hate consulting, you may earn less than expected, donate less, or burn out and leave the workforce early. If you are passionate about the nonprofit work, you may outperform the "replaceable" candidate significantly.
  *   **The 3x Fallacy:** A 3x salary does not equal 3x impact. After taxes and baseline living costs, the *donatable* surplus might only be 1.5x or 2x. You must compare **Donatable Surplus × Charity Effectiveness** vs. **Direct Work Impact × Counterfactual Replaceability**.

  ***

  ### Part 3: Suggested Script for the Meeting

  If you want to resolve this without causing a rift, try proposing this framework:

  > "EtG is a valid strategy, but it isn't a trump card. To decide between these two jobs, we need to estimate the **counterfactual impact**, not just the salary.
  >
  > 1.  **Replaceability:** How hard is it for the nonprofit to hire another logistician? If it's hard, my direct impact is high.
  > 2.  **Bottlenecks:** Is the nonprofit limited by money or by skilled labor? If they are limited by labor, my earning to give doesn't solve their problem.
  > 3.  **Donation Plan:** Are we committed to donating the surplus? If not, the consulting path loses its ethical premium.
  >
  > Let's stop using 'Earning to Give' as a conclusion and start using it as a variable in the equation."

  ### Summary for your notes:
  *   **EtG is a hypothesis, not a law.**
  *   **Salary $\neq$ Impact.** (Must adjust for taxes, spending, and charity absorption).
  *   **Replaceability is key.** (Specialized direct work is often less replaceable than generalist high-earning work).
  *   **The "Obvious" claim is false.** It requires empirical evidence about the specific nonprofit's bottlenecks.
