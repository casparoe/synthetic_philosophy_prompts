      *   **Problem:** Someone is using "earning to give" (EtG) as a conversation stopper to argue that high-paying jobs (consulting) are *always* more ethical than lower-paying direct-impact jobs (nonprofit global health), specifically in a case of 3x salary difference.
      *   **Task:** Break down the different precise claims "earning to give" could be making.
