answer: |-
  To analyze the July 20 plot through the lens of Thomas Aquinas is to test a medieval juridical-moral framework against a modern totalitarian catastrophe. Aquinas's treatment of tyranny is found primarily in *De Regno* (On Kingship) and the *Summa Theologiae* (specifically II-II, Q. 42 on Sedition, Q. 64 on Killing, and Q. 104 on Obedience). His account is not a manifesto for revolution but a cautious taxonomy of power, obligation, and the common good.

  Here is a disciplined mapping of the Stauffenberg plot onto Aquinas's distinctions, followed by a reverse analysis of where the theory holds and where it fractures.

  ### I. Mapping the Plot onto Aquinas's Framework

  #### 1. Tyrant by Usurpation vs. Legitimate Ruler Governing Tyrannically
  Aquinas distinguishes between a *tyrannus ex defectu tituli* (a usurper who seizes power without right) and a *tyrannus ex parte exercitii* (a legitimate ruler who exercises power tyrannically). This distinction dictates the permissibility of resistance. A usurper may be resisted more easily; a legitimate ruler possesses an authority derived from God and the community, making resistance akin to resisting God's ordinance.

  **The Plot:** Hitler was not a usurper in the strict Thomistic sense. He was appointed Chancellor legally in 1933, and his subsequent consolidation of power (the Enabling Act, the merger of the Presidency) followed the legal mechanisms of the Weimar Republic, however coerced. He held the *title* of Head of State.
  **Aquinas's Verdict:** Hitler falls into the harder category: *tyrannus ex parte exercitii*. For Aquinas, this makes removal significantly more problematic. The conspirators could not argue they were removing an illegitimate occupier; they were removing the anointed head of the state. This forces the justification entirely onto the *nature* of his rule (violating Divine and Natural Law) rather than the *source* of his power. Aquinas allows that a ruler forfeits his claim to obedience if he commands against God, but he does not explicitly grant a right of deposition in this specific case without public authority.

  #### 2. Action by Public Authority vs. Private Person
  This is the most critical friction point. In *De Regno* (I.6), Aquinas explicitly argues against private individuals assassinating tyrants. He warns that such acts often lead to greater instability and that the removal of a tyrant belongs to "public authority," not private presumption. In *Summa Theologiae* (II-II, Q. 64, A. 3), killing is permissible only by public authority acting for the common good.

  **The Plot:** Claus von Stauffenberg was a Colonel in the Reserve Army. He was a state functionary, but hierarchically subordinate to Hitler. The conspirators (Beck, Goerdeler, Witzleben) were former or current officials, acting as a shadow cabinet. They claimed to represent the "true" Germany and the rule of law.
  **Aquinas's Verdict:** Technically, Aquinas would classify this as action by private persons (or at best, subordinate agents) rather than a constituted public authority. There was no Parliament, no Supreme Court, and no Electoral College left to authorize the removal. The Army was the only remaining "intermediate body" capable of acting as public authority.
  **The Ambiguity:** Aquinas assumes a polity with functioning intermediate institutions. In a totalitarian state, the "public authority" *is* the tyrant. If the conspirators are read as the remaining embodiment of the *Res Publica* (the Army and Civil Service acting to restore the law), Aquinas might grant them a derivative public authority. However, if read as subordinates breaking their chain of command, this is sedition (II-II, Q. 42), which Aquinas condemns as contrary to the unity of the multitude. The text is underdetermined here: can a subordinate body *become* the public authority when the head becomes cancerous? Aquinas does not say.

  #### 3. Tyranny to be Tolerated vs. Tyranny to be Resisted
  Aquinas advises caution. In *De Regno*, he argues that sometimes tyranny must be tolerated to avoid greater evils: scandal, civil war, or the installation of a worse tyrant. Resistance is permissible only when the tyranny is "excessive" and intolerable.

  **The Plot:** The conspirators debated this extensively. They knew a failed coup would lead to mass executions (which it did). They feared civil war between the Wehrmacht and the SS.
  **Aquinas's Verdict:** This aligns perfectly with Aquinas's prudential calculus. The threshold for resistance is "intolerability." The genocidal nature of the regime (the Holocaust, the war of annihilation) arguably pushes the tyranny past the threshold of tolerance into a violation of Natural Law that compels resistance. However, Aquinas's warning about the "greater evil" of chaos is precisely what haunted the plotters. The framework permits resistance *if* the tyranny is intolerable, but it does not *mandate* it if the probable consequence is the destruction of the community (e.g., total Soviet occupation).

  #### 4. The Risk of Installing a Worse Tyrant
  Aquinas warns that removing a tyrant often leads to a successor who is more cruel, perhaps to secure his own power against the faction that killed his predecessor.

  **The Plot:** The conspirators feared that killing Hitler would not end Nazism but trigger a power struggle between the SS (Himmler/Göring) and the Army, potentially radicalizing the regime further before its collapse.
  **Aquinas's Verdict:** This is the strongest point of convergence. Aquinas's framework explains the conspirators' hesitation and their elaborate planning (Operation Valkyrie) to ensure a smooth transition. They were not acting on impulsive zeal but on a Thomistic calculation of consequences. The framework validates their fear: if the removal causes the dissolution of the political order (the *bonum commune*), the act is morally hazardous.

  ### II. Reverse Analysis: Explanatory Power vs. Blind Spots

  #### What Aquinas's Account Explains Well

  **1. The Moral Burden of Conscience:**
  Aquinas grounds political obligation in the moral order. The conspirators' insistence that they acted out of *duty* (to Germany and God) rather than ambition mirrors Aquinas's requirement that tyrannicide must be for the *common good*, not private vendetta. Stauffenberg's famous line, "Someone must do it, even if he knows the world will call him a traitor," reflects the Thomistic idea that one must obey God (Natural Law) rather than men when the two conflict. Aquinas provides the vocabulary for their internal conflict: the tension between legal obedience and moral duty.

  **2. The Prudential Fear of Chaos:**
  Aquinas's warning against sedition explains why the German resistance was so small and hesitant compared to resistance movements elsewhere. Many officers accepted the "lesser evil" argument: that Hitler protected Germany from Bolshevism. Aquinas's caution that removing a tyrant may bring a worse one validates the conservative hesitation of the Beck-Goerdeler circle. They were not pacifists; they were Thomistic prudentialists weighing the *bonum commune* against the evil of tyranny.

  **3. The Limit of Obedience:**
  Aquinas's distinction in *Summa Theologiae* (II-II, Q. 104, A. 5) regarding obedience is crucial. Subjects must obey superiors in lawful commands, but "if a superior commands something contrary to God's law, he is not to be obeyed." This provides the precise theological mechanism the plotters used to nullify their personal oath to Hitler. The oath bound them to the office and the law, not to criminal acts.

  #### What Aquinas's Account Misdescribes or Leaves Out

  **1. The Totalitarian Void:**
  Aquinas assumes a hierarchical society with intermediate bodies (Church, nobility, guilds) that check power and can constitute "public authority." The Nazi state was totalitarian; it atomized society and subsumed all institutions under the *Führerprinzip*. There was no "public authority" above Hitler to appeal to. Aquinas's framework requires a *mechanism* for deposition (a council, an election, a superior lord). In 1944, there was none. The theory is silent on how "public authority" reconstitutes itself when the state has been fully captured by the tyrant. It leaves the conspirators in a juridical no-man's-land: acting as public authority without the legal standing to do so.

  **2. The Personal Oath of 1934:**
  Aquinas discusses oaths in the context of feudal or constitutional loyalty. The 1934 Wehrmacht oath was personal (*"I swear unconditional obedience to Adolf Hitler"*), not institutional (*"to the Constitution"*). Aquinas's theory of oaths binds the swearer unless the command is sinful. However, it does not fully address the specific guilt of breaking a personal vow of fidelity to a head of state who is still technically the legal sovereign. This created a specific scruple for the plotters (the "perjury" argument) that Aquinas's general principles touch but do not resolve in this specific legal configuration.

  **3. Prior Complicity:**
  Aquinas writes about rulers and subjects. He does not account for the modern bureaucratic reality where the "resisters" are also "perpetrators." Many plotters (including Stauffenberg) had served the regime enthusiastically for years, benefiting from its early victories. Aquinas's framework assumes a clearer distinction between the virtuous resister and the vicious tyrant. It lacks the categories to handle the moral ambiguity of men who helped build the tyranny before turning against it. Is their resistance valid if they were formerly complicit? Aquinas implies repentance restores moral agency, but his political theory doesn't account for the structural complicity of the officer corps.

  **4. The Genocidal Character:**
  Aquinas conceives of tyranny as political oppression, corruption, and the pursuit of private gain over the common good. He did not foresee industrial extermination. For Aquinas, a tyrant harms the *political* community. The Nazis sought to destroy parts of the human community based on ontology (race/religion). This moves the crime from "political tyranny" to "metaphysical evil." Aquinas's threshold of "intolerable tyranny" is met, but the *nature* of the evil exceeds his political taxonomy. It transforms the act from "tyrannicide" to something closer to "policing a crime against humanity," a concept absent from his work.

  ### III. Conclusion: Confirmation, Anomaly, or Category Error?

  The July 20 plot is best read as a **category error for Aquinas's political theory, but a confirmation of his moral theology.**

  As a **political theory**, Aquinas's account was never built to handle a totalitarian state. His model relies on the existence of a *Res Publica* distinct from the ruler, with intermediate bodies capable of acting as "public authority." In the Third Reich, the State and the Party were fused with the Person of the Leader. Consequently, Aquinas's prohibition on private assassination technically condemns the plot (as the Army was subordinate, not sovereign), while his permission for public deposition was structurally impossible to enact legally. The theory lacks the machinery to legitimize a coup in a system where the tyrant *is* the law.

  However, as a **moral theology**, the episode confirms Aquinas's enduring insights. The conspirators' deliberations mirror the Thomistic tension between the duty to obey lawful authority and the higher duty to Natural Law. Their fear of the "greater evil" (chaos, worse tyranny) validates Aquinas's prudential warnings. Their reliance on conscience over legalism affirms the Thomistic hierarchy of laws (Eternal > Natural > Human).

  Ultimately, the plot exposes the limit of medieval political thought in the face of modern nihilism. Aquinas assumes a ruler who is corrupt; he did not imagine a ruler who is criminal. He assumes a community that can depose a king; he did not imagine a population held hostage by terror. The July 20 plotters had to stretch Aquinas's framework until it snapped, acting as "private persons" claiming "public authority" to stop a "criminal tyranny" that exceeded the definition of "political tyranny." They acted, in the end, not on a Thomistic legalism, but on a Thomistic conscience: recognizing that when the law becomes crime, obedience becomes sin.
