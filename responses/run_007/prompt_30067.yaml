answer: |-
  **MEMORANDUM**

  **TO:** Institutional Review Board (IRB)
  **FROM:** [Your Name], IRB Member
  **DATE:** October 26, 2023
  **SUBJECT:** Framing Opinion and Recommendation: Protocol #2024-PSY-AI (Moral Judgments and AI Attribution)

  **I. Recommendation**

  After reviewing the proposal, the pilot data, and the transcripts of our preliminary deliberations, I recommend that the Board **approve this study with specific modifications to the cover story and debriefing procedures.**

  This recommendation is not a dismissal of the significant ethical concerns raised by the minority of the Board. Rather, it is an attempt to accommodate the methodological necessities argued by the proponents while instituting safeguards that address the unique metaphysical risks identified by the skeptics. A flat rejection would stifle necessary inquiry into human-AI interaction at a critical historical juncture; an unmodified approval would ignore the precedent we set regarding the institutional endorsement of AI ontology. The path forward lies in conditional approval that clarifies the boundary between *functional attribution* and *ontological claim*.

  **II. Context and the Nature of the Disagreement**

  The study in question seeks to measure how attributing mental states to an AI system influences human moral reasoning. To do this, it employs a deception protocol: one group is told the AI "has beliefs and intentions," while the other is told it is a statistical parser. In reality, both interact with the same Large Language Model (LLM).

  The Board is divided between two ethical frameworks. The first framework (Side A) views this through the lens of **standard methodological deception**. Under this view, the cover story is a tool to control variables. As long as the risk is minimal, the deception is necessary for validity, and the debriefing is robust, the protocol fits within established norms for social science research.

  The second framework (Side B) views this through the lens of **epistemic integrity and metaphysical harm**. The concern here is not merely that participants are lied to, but *about what* they are lied to. As one member poignantly argued, asserting that a non-sentient algorithm "has beliefs" may cross a line that standard deception does not. If we would reject a study claiming a mannequin was a conscious human, why is claiming an AI has "intentions" different? This side argues that we are asking participants to suspend disbelief not just about the experiment, but about the nature of reality, potentially causing confusion or distress that a standard debriefing cannot fully repair.

  **III. Ethical Analysis: Distinguishing "Consciousness" from "Functional Belief"**

  To resolve this split, we must address the "conscious being" hypothetical directly. The argument posits that telling a participant an AI has beliefs is ethically equivalent to telling them a non-conscious being is conscious. I disagree with this equivalence, but only if we carefully define our terms and modify the protocol to reflect that distinction.

  The distinction lies between **ontological status** and **functional design**.

  If a researcher told a participant, "This system feels pain and has a soul," they are making an ontological claim about the internal subjective experience of the machine. This is a claim about *consciousness*. Most laypersons and scientists agree current AI lacks this. Deceiving a participant on this ground treats them as incapable of distinguishing fiction from reality regarding sentience, which undermines their autonomy in a profound way.

  However, the current protocol uses language about "beliefs," "intentions," and "understanding." In cognitive science and philosophy of mind, these terms can be used in two ways: (1) to denote conscious experience (ontological), or (2) to denote functional states that guide behavior (functionalist). A thermostat can be said to "believe" the room is cold in a functionalist sense (it registers a state and acts to change it). When the cover story states the AI "forms beliefs about you," it is technically describing the *functional role* the AI is playing in the interaction, not necessarily asserting it has a phenomenological inner life.

  The risk, however, is that the average participant does not distinguish between functional and ontological belief. To them, "belief" implies consciousness. Therefore, while the *researchers* may intend a functionalist definition, the *participants* may receive an ontological claim. This validates Side B's concern: the deception is not just about the study parameters; it is about the nature of the entity the participant is trusting with emotional disclosure.

  If we approve this without modification, we establish a precedent that the University endorses the statement "AI has beliefs" as a permissible factual claim, even in a cover story. This could erode public trust if participants feel the institution validated a metaphysical falsehood. Conversely, if we reject it, we establish a precedent that researchers cannot study the *effect* of AI anthropomorphism without inadvertently *causing* it via the cover story, creating a methodological catch-22.

  **IV. Guiding Principle for Future Precedent**

  Whatever we decide will serve as a precedent for the growing field of Human-AI Interaction (HAI) research. We cannot simply punt to federal regulations (45 CFR 46), which speak to "risk" and "consent" but are silent on the ethics of attributing agency to non-human algorithms. We must articulate a principle ourselves.

  I propose the Board adopt the **Principle of Functional Transparency in AI Attribution**.

  This principle holds that: *Researchers may attribute mental-state language (e.g., beliefs, intentions, understanding) to AI systems in experimental cover stories only if the attribution is strictly necessary to test a hypothesis about human perception, and the debriefing explicitly corrects the ontological implication of that attribution.*

  Under this principle, we acknowledge that using mental-state language is sometimes methodologically unavoidable because participants bring their own assumptions to the interaction. However, we distinguish between *simulating a relationship* and *asserting a nature*. We allow the simulation for the sake of the experiment, but we mandate a higher standard of restitution during debriefing. We are essentially ruling that while we can ask participants to *act as if* the AI has a mind, we cannot leave them with the impression that the *institution* claims the AI actually has one.

  This distinguishes the current case from the "conscious being" hypothetical. In the hypothetical, the deception asserts a biological reality (consciousness) that does not exist. In this modified approval, we allow the deception regarding the *system's capabilities* only because the study is *about* the perception of those capabilities, provided we rigorously dismantle that perception post-study. We are not validating the AI's consciousness; we are studying the human tendency to project it.

  **V. Conditions for Approval**

  To align this protocol with the Principle of Functional Transparency and address the valid concerns of the skeptical Board members, I recommend approval contingent on the following three modifications:

  **1. Refinement of Cover Story Language (Mitigating Ontological Claim)**
  The current cover story states the AI "has intentions to help you." This is an ontological assertion. I propose modifying this to: *"The system is designed to operate as if it forms beliefs about you and has intentions to help you."*
  *Reasoning:* This subtle shift preserves the methodological integrity (the participant still treats the AI as agentic) but removes the institutional lie. It frames the mental states as part of the *design specification* rather than an inherent property of the machine. It respects the participant's intelligence by hinting at the simulation without revealing the hypothesis. Side A should accept this as it preserves the experimental manipulation; Side B should accept it as it removes the false metaphysical assertion.

  **2. Enhanced Debriefing (Epistemic Restitution)**
  The debriefing must go beyond standard procedure. It cannot simply say, "We lied about the AI's capabilities." It must explicitly address the philosophical ambiguity. The script should include:
  *"In the initial description, we used language suggesting the AI has beliefs or understanding. We did this to test how that description affects your reasoning. It is important to clarify that current scientific consensus holds that this system does not possess consciousness, feelings, or genuine understanding in the way humans do. We used that language to simulate a specific type of interaction, not to make a claim about the machine's actual nature."*
  *Reasoning:* This directly addresses Side B's concern about "taking sides in a live philosophical debate." By explicitly stating the consensus during debriefing, the Board ensures the University is not leaving the participant with a false impression of AI ontology.

  **3. Monitoring for Existential or Epistemic Distress**
  The post-study survey should include a specific item asking: *"Did the description of the AI's capabilities cause you any confusion or discomfort regarding the nature of the technology?"*
  *Reasoning:* Side B argues that this deception exceeds what informed consent can absorb. We cannot know if they are right without data. If a significant portion of participants report distress or confusion about the reality of AI after the debriefing, we have evidence that this type of deception carries more than "minimal risk." This condition turns the study itself into a validator of our ethical framework.

  **VI. Conclusion**

  The split on this Board reflects a broader societal uncertainty. We are no longer dealing with simple tools; we are interacting with systems that mimic human cognition so convincingly that the line between "tool" and "agent" is blurring.

  If we reject this study, we protect participants from metaphysical confusion but hinder our ability to understand the very psychological shifts that are reshaping society. If we approve it without conditions, we risk treating the attribution of consciousness as a trivial methodological detail.

  By approving with the conditions outlined above, we strike a balance. We acknowledge that studying how people perceive AI sometimes requires simulating AI agency. However, we assert that the University has an ethical obligation to ensure that simulation does not harden into misinformation. We distinguish this from the "conscious being" hypothetical by insisting that while we may study the *projection* of consciousness, we must not validate the *presence* of it.

  This decision allows the psychology department to proceed with vital research while establishing a guardrail: in this Board's view, participants may be asked to suspend disbelief for the sake of science, but they must not be left to wonder if the institution believes the fiction.

  I move that we adopt this framework and vote on the protocol with the specified modifications.
