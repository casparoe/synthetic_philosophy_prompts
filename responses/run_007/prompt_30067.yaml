  7.  **Final Polish:** Check flow, ensure the distinction between "functional attribution" and "ontological claim" is clear, as that is the philosophical heavy lifting required by the prompt. (Self-correction: Ensure I don't get *too* philosophical; keep it grounded in IRB risk/benefit analysis).

