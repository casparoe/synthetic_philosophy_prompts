answer: |-
  **Pre-Writing Sketch**

  **Elena (Practice/Conventionalist):**
  *   **Core Move:** Promising is a social artifact. Without the convention, the utterance lacks illocutionary force. The obligation is internal to the practice, akin to the rules of chess.
  *   **Response to Bare Promises:** If the promisee doesn't hear it, the promissory act is incomplete *within the practice*. However, the practice can have rules covering deathbed scenarios (e.g., witnesses suffice).
  *   **Response to Variable Practice:** The *existence* of the obligation is contingent on the practice, but the *moral reason* to uphold the practice (fairness, mutual reliance) is not.
  *   **Response to Directedness:** The practice assigns claim-rights. By entering the practice, you grant the promisee a specific authority over your action.

  **Julian (Expectation/Interpersonal):**
  *   **Core Move:** Promising is a mechanism for transferring control over an intention. The obligation stems from the wrong of betraying trust one has intentionally invited.
  *   **Response to Bare Promises:** The obligation arises from the promisor's commitment and the objective invitation of reliance, not merely uptake. The dying person case shows the duty survives the promisee's awareness.
  *   **Response to Variable Practice:** Conventions vary, but the underlying moral principle (do not manipulate expectations) is invariant. The form is secondary to the interpersonal dynamic.
  *   **Response to Directedness:** The duty is directed because I invited *you* specifically to rely on me. It's a relational wrong, not an institutional violation.

  **Points of Convergence/Divergence:**
  *   **Convergence:** Both reject simple utilitarianism. Both agree promises create distinctive, directed obligations that are not merely predictions of future behavior. They may agree that the practice is the *vehicle* for the obligation, even if they disagree on what powers the vehicle.
  *   **Divergence:** The source of normativity. For Elena, it is the social institution itself (external to the dyad). For Julian, it is the interpersonal moral relation (internal to the dyad).

  ***

  **The Normativity of Promises: A Dialogue**

  The noise of the conference banquet had finally receded, leaving Elena and Julian in a quiet corner of the hotel lounge. The wine was nearly gone, and the air between them felt less like the adversarial tension of the Q&A session earlier that day and more like a shared exhaustion with a stubborn problem.

  "You know," Julian said, swirling his glass, "when you pressed me on the dying person case today, I saw where you were going. You think if the promisee never hears the promise, there's no practice, and therefore no obligation. But I can't shake the intuition that if I promise a dying friend I'll care for her cat, and she slips into a coma before I finish the sentence, I'm still bound."

  Elena leaned forward, resting her chin on her hand. "I understand the intuition, Julian. But think about what 'I promise' means. It's a move in a language game. If I say 'checkmate' without a board, or without an opponent who knows the rules of chess, I haven't actually checkmated anyone. I've just made noise. If the practice requires uptake to be complete, then in your coma case, the promissory act wasn't finished. You've expressed an intention, perhaps a solemn one, but you haven't invoked the institution."

  "But that makes the obligation vanish too easily," Julian countered. "On my view, the obligation comes from inviting reliance. I signaled to her that she could count on me. She structured her final peace of mind around that invitation. Even if she doesn't wake up to verify it, I've altered our normative relationship. I've given her a form of authority over my future actions. If I let the cat starve, I betray *her*, not just a rulebook."

  "See, that's where I worry you're smuggling in the practice," Elena said gently. "How did you give her authority? Why does saying 'I promise' transfer authority rather than just expressing hope? It's because we share a convention that says those words transfer authority. Without that background convention, your 'invitation of reliance' is just psychology. The practice view explains the directedness better. The practice assigns the claim-right to her. Without the practice, you're just saying you feel bad about disappointing her. With the practice, she has a right to demand compliance."

  Julian nodded slowly. "I grant that the practice provides the vocabulary. But I worry about what happens if the vocabulary changes. Imagine a society where promises made on Wednesdays are understood as non-binding. Or where they require a witness to be valid. On your view, if I make a unwitnessed promise in that society, I'm not obligated. But surely there's a moral fact about betraying trust that transcends the local convention? If I intentionally invite you to rely on me, and you do, haven't I wronged you regardless of the Wednesday rule?"

  Elena paused. "This is the contingency objection. Look, I'm not saying morality is relative. I'm saying morality allows us to create tools. Driving on the left is arbitrary, but once we agree on it, you ought to drive on the left. Promising is a tool for securing reliance. If a society's tool is flawed—say, Wednesday promises don't count—then in that society, you haven't successfully used the tool. But you might still have a general moral duty not to manipulate expectations. I distinguish the *promissory* obligation from the general moral duty. The practice view protects the specificity of promising. If you blur it with general reliance, you lose the distinctive force of the act."

  "But doesn't that make the obligation too fragile?" Julian asked. "If the obligation is internal to the practice, then undermining the practice undermines the obligation. Suppose I belong to a subculture that rejects promising as bourgeois coercion. If I say 'I promise' to you, but secretly hold that view, am I bound? Your view suggests maybe not, because I haven't truly entered the practice. My view says: you invoked the norm publicly. You invited my trust. You can't hide behind your private rejection of the convention to escape the interpersonal wrong."

  Elena sighed, smiling faintly. "That's the free-rider problem. Rawls handled this. If you benefit from the practice—if people rely on your words—you're bound by fairness to follow the rules, even if you privately dissent. But I hear your concern. You want the bond to be between *us*, not between *us and the institution*."

  "Exactly," Julian said. "When I break a promise, I don't feel like I've violated a social contract. I feel like I've violated *you*. The wrong is directed. Can your practice view capture that intimacy? Or am I just a placeholder for 'society' in your model?"

  "That's the hardest question," Elena admitted. "But consider this: without the practice, what makes the obligation directed to *you* rather than everyone? If it's just about not disappointing expectations, I disappoint everyone who expected me to be moral. The practice is what earmarks the obligation. It says, 'This duty is owed specifically to the promisee.' So, in a way, the practice is what secures the directedness you value. It constructs the relationship."

  Julian leaned back, looking at the ceiling. "So we might be closer than we think. You see the practice as constructing the relationship. I see the relationship as utilizing the practice. You worry that without the convention, the words lack force. I worry that without the interpersonal moral principle, the convention lacks bite."

  "Perhaps," Elena said. "Maybe the practice is the mechanism, and the interpersonal wrong is the engine. But I still maintain you can't have the engine without the mechanism. You can't transfer authority without a system that recognizes authority transfers."

  "And I maintain," Julian replied, raising his glass, "that the system only matters because we care about not betraying each other. If we stopped caring about the people, the system would be empty rules."

  "True," Elena clinked her glass against his. "But without the rules, we'd just be caring people with no way to bind our futures."

  "To the binding," Julian said.

  "To the binding," Elena agreed. They drank, the disagreement remaining, but the stakes now clearly shared.
