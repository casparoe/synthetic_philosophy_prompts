          *   *The "Question-Begging" Charge:* Yes, it arguably begs the question against the Constitution View. It assumes that only categorical properties count as "actual differences." If sorts/essences are metaphysically robust, modal differences *are* grounding differences.
          *   *Commitment:* Rejecting (3) commits you to "Modal Realism" regarding essences or a robust view of sortals.

