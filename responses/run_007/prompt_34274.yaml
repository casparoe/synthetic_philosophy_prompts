prompt: |-
  I've been trying to sort out my intuitions about when individual actions matter in collective harm cases, and my verdicts are kind of a mess. I want to know if there's a principle that captures them, or at least most of them.

  Here are my cases:

  - I skip buying a chicken breast at the grocery store. I figure the store orders in bulk, my one purchase doesn't affect how many chickens are killed, so it doesn't matter either way. Verdict: not wrong to buy it, not praisworthy to skip.

  - I don't vote in a national election. One vote never decides it. Verdict: not wrong to stay home.

  - I'm in a firing squad of ten, where one rifle has a blank and nobody knows whose. I fire. Verdict: wrong, even if my bullet was the blank. I participated.

  - I'm one of twenty people each dumping a bucket of sludge into a lake. The lake can absorb nineteen buckets without harm, but twenty kills all the fish. I dump my bucket. Verdict: wrong. But I'm not sure this is consistent with the chicken case.

  - I buy a t-shirt from a company that uses sweatshop labor. My purchase doesn't change their practices; the supply chain is what it is. Verdict: feels wrong, but I can't explain why if it makes no difference.

  - I'm the hundredth person to join a protest, where the organizers said they need a hundred people to get media coverage. The coverage happens. Verdict: my joining mattered, and I'd have been wrong to bail.

  - I take a private jet for a weekend trip instead of flying commercial. Verdict: feels wrong, but the climate impact of one flight is negligible, so I'm not sure my intuition tracks.

  - I'm the one person in a thousand who could tip a boycott over the threshold for a company to change its policy. I boycott. Verdict: matters, I should do it.

  - I eat a steak at a restaurant where the meat is already cooked and would be thrown out if I didn't eat it. Verdict: not wrong. (But is this just the chicken case again?)

  Is there a principle lurking here? Something about thresholds, or about expected impact, or about participation versus buying? I keep going back and forth on whether the chicken and the sweatshop t-shirt should come out the same way. If there's a principle that gets most of these, I'd like to know what it says about a case I haven't listed: being one of millions of people whose small emissions collectively cause climate harms, where no individual emission is decisive. And if the principle forces me to drop some of my verdicts, which ones should go?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Goal:** The user wants to find a unifying ethical principle that explains their intuitions about individual actions in collective harm cases.
      *   **Input:** A list of 9 specific cases with their intuitive verdicts (Wrong/Not Wrong/Matters/Doesn't Matter).
      *   **Problem:** The user feels their verdicts are inconsistent (specifically noting the tension between the chicken/sweatshop cases and the sludge/firing squad cases).
      *   **Specific Question:** Is there a principle? What does it say about climate change (the unlisted case)? If the principle forces inconsistency, which verdicts should be dropped?

  2.  **Deconstruct the Cases & Verdicts:**
      *   *Chicken Breast:* No causal impact (bulk ordering). Verdict: **Permissible.** (Consequentialist logic: No difference made).
      *   *Voting:* No causal impact (one vote). Verdict: **Permissible.** (Consequentialist logic: No difference made).
      *   *Firing Squad:* Complicity/Participation. Verdict: **Wrong.** (Non-consequentialist logic: Integrity/Complicity).
      *   *Sludge Lake:* Threshold case (19 safe, 20th kills). Verdict: **Wrong.** (Consequentialist logic: You were the trigger).
      *   *Sweatshop T-shirt:* No causal impact (supply chain fixed). Verdict: **Wrong.** (Non-consequentialist logic: Complicity/Endorsement). *Tension Point:* Contradicts Chicken case.
      *   *Protest (100th person):* Threshold case. Verdict: **Obligatory/Matters.** (Consequentialist logic: You made the difference).
      *   *Private Jet:* Small impact, but high magnitude per unit? Verdict: **Wrong.** (Mixed: Maybe symbolic or expected utility). *Tension Point:* Contradicts Voting/Chicken.
      *   *Boycott (1 in 1000):* Threshold case. Verdict: **Obligatory/Matters.** (Consequentialist logic: You made the difference).
      *   *Wasted Steak:* No causal impact (sunk cost). Verdict: **Permissible.** (Consequentialist logic: No difference made). *Consistent with Chicken.*

  3.  **Identify the Underlying Ethical Frameworks:**
      *   **Act Consequentialism (Difference-Making):** An act is right/wrong based on its actual outcomes.
          *   *Fits:* Chicken, Voting, Wasted Steak, Sludge (if you are the 20th), Protest, Boycott.
          *   *Clashes:* Firing Squad, Sweatshop, Private Jet (if impact is truly negligible).
      *   **Complicity/Integrity (Non-Consequentialist):** An act is wrong if it associates you with harm, regardless of outcome.
          *   *Fits:* Firing Squad, Sweatshop, Private Jet (symbolic harm).
          *   *Clashes:* Chicken, Voting, Wasted Steak.
      *   **Expected Utility (Probabilistic):** An act is right/wrong based on the *probability* of making a difference multiplied by the magnitude.
          *   *Fits:* Sludge (if you don't know if you're the 20th), Voting (tiny probability * huge impact), Private Jet (tiny probability * huge impact).
          *   *Clashes:* Chicken (supply chains are lumpy, so there *is* a probability), Firing Squad (0% chance your bullet killed, yet still wrong).

  4.  **Synthesize a Unifying Principle:**
      *   The user's intuitions seem to toggle between **Difference-Making** and **Complicity**.
      *   *Hypothesis 1: The "Expected Impact" Principle.*
          *   In the Chicken case, the user assumes *zero* impact. In reality, supply chains are "lumpy." One purchase *can* trigger a reorder. If we correct the factual assumption, Expected Utility makes the Chicken case Wrong (like the Sweatshop).
          *   In the Sludge case, if you don't know if you are the 20th, there is a 1/20 chance you are the killer. Expected harm > 0.
          *   In the Firing Squad, expected harm is low (10% chance your bullet was real), yet intuition says Wrong. This suggests Expected Utility isn't enough.
      *   *Hypothesis 2: The "Complicity + Threshold" Hybrid.*
          *   Most cases are explained by **Expected Consequentialism** (accounting for probabilistic thresholds).
          *   The outliers (Firing Squad, Sweatshop) are explained by **Complicity** (participating in a harmful practice).
      *   *Hypothesis 3: The "Reasonable Belief" Principle.*
          *   Maybe it's about what the agent *believes* about their impact.
          *   Chicken: Believes no impact -> Permissible.
          *   Sweatshop: Believes no impact -> Wrong. (Inconsistency remains).

      *   *Best Fit:* **Impure Consequentialism with a Complicity Constraint.**
          *   Primary driver: Expected Impact (including threshold probabilities).
          *   Secondary driver: Participation in inherently wrongful acts (Firing Squad).
          *   Resolution of Chicken vs. Sweatshop: The user's factual belief about the Chicken case is likely false (supply chains are lumpy). If corrected, they align.

  5.  **Address the Specific Tension (Chicken vs. Sweatshop):**
      *   Why does the user feel differently?
      *   *Chicken:* "The store orders in bulk." (Factual claim: My purchase won't trigger an order).
      *   *Sweatshop:* "Supply chain is what it is." (Factual claim: My purchase won't change policy).
      *   *Difference:* The Sweatshop case feels more like *endorsing* exploitation. The Chicken case feels more *causal*.
      *   *Philosophical Consensus:* Most ethicists (e.g., Singer, Kagan) argue the Chicken case *is* wrong because of probabilistic impact. The user's intuition here is likely the one to drop.

  6.  **Address the Climate Change Case:**
      *   This is the "Sludge" case scaled up.
      *   Is it a threshold? Yes (tipping points).
      *   Is it complicity? Yes (participating in a harmful system).
      *   Expected Utility: Tiny probability of being the "tipping point" emission * Massive Harm = Significant Expected Harm.
      *   Verdict: Wrong (or at least pro tanto wrong).

  7.  **Drafting the Response:**
      *   **Acknowledge the mess:** Validate that this is a classic problem in ethics (The Problem of Overdetermination / Complicity).
      *   **Propose the Principle:** "Expected Impact + Complicity."
      *   **Analyze the Cases through the Principle:**
          *   *Group 1 (Thresholds/Expected Impact):* Sludge, Protest, Boycott, Climate. (Explain the math of thresholds).
          *   *Group 2 (Complicity/Participation):* Firing Squad, Sweatshop. (Explain integrity/association).
          *   *Group 3 (Sunk Costs/No Link):* Wasted Steak. (Clear pass).
          *   *The Problem Children:* Chicken & Voting.
              *   *Chicken:* Challenge the factual premise. Supply chains are lumpy. If you accept the "lumpy" fact, it aligns with Sweatshop.
              *   *Voting:* Low probability, high impact. Expected utility might actually say vote, but the "duty" is weaker than direct harm.
              *   *Private Jet:* High emission per act increases the probability of crossing thresholds.
      *   **Resolve the Inconsistency:** The user needs to align Chicken and Sweatshop. Either both are wrong (Expected Impact/Complicity) or both are permissible (Strict Causal Individualism). Given the other verdicts (Sludge, Firing Squad), the user leans towards *responsibility*, so they should probably admit the Chicken purchase is problematic.
      *   **Apply to Climate Change:** Use the "Expected Impact" model. Even if not decisive, the *risk* imposed is real.
      *   **Recommendation:** Drop the "Chicken is permissible" verdict. It relies on a factual error about supply chains. Keep the "Firing Squad" verdict (Complicity). Keep the "Sludge" verdict (Thresholds).

  8.  **Refining the Principle:**
      *   Let's call it **"The Principle of Expected Harm and Complicity."**
      *   1. If there is a non-zero probability your act triggers a harm threshold, it carries weight.
      *   2. If the act constitutes participation in a manifestly unjust practice, it carries weight (even if causal impact is low).
      *   3. If the act consumes a resource that is already wasted (sunk cost), it carries no weight.

  9.  **Final Review against User Constraints:**
