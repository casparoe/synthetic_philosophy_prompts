  *(Refining the Climate Argument)*: Make sure to mention the "puff of smoke" analogy or Shelly Kagan's work on thresholds, as that's the standard philosophical treatment for this.

  *(Refining the Firing Squad)*: This is the strongest case for Complicity over Consequentialism. Make sure to highlight that.

