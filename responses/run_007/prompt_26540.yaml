answer: |-
  Here is a breakdown of the desiderata for a principle connecting credence and chance, an analysis of the tensions between them, and a scorecard of the leading candidates.

  ### I. The Desiderata

  An adequate principle must satisfy the following requirements. I have categorized them by whether they are **Non-Negotiable** (required for any account claiming to capture the concept of objective chance) or **Parochial** (dependent on a specific metaphysical commitment, typically Humeanism).

  | Requirement | Motivation / Case | Status |
  | :--- | :--- | :--- |
  | **1. Deference** | **The Fair Coin Case:** If you know a coin is fair (chance of Heads = 0.5) and have no other info, your credence in Heads must be 0.5. If the principle does not enforce this alignment, it fails to capture the normative force of chance. | **Non-Negotiable** |
  | **2. Temporal Indexing** | **The Post-Toss Case:** Before a toss, chance(Heads) = 0.5. After it lands Heads, chance(Heads) = 1. Your credence should match the chance *at the time of your credence*. A principle that ignores time conflates past and future chances. | **Non-Negotiable** |
  | **3. Information Sensitivity** | **The Crystal Ball Case:** If you look into a crystal ball and see the coin land Heads, your credence should be 1, even if the objective chance was 0.5. The principle must allow credence to diverge from chance when "inadmissible" (outcome-revealing) information is present. | **Non-Negotiable** (The *need* for a filter is non-negotiable; the *mechanism* is parochial). |
  | **4. Compatibility with Humean Supervenience (HS)** | **The Metaphysical Constraint:** Chances should not be "spooky" additions to reality; they should supervene on the total history of categorical events (past, present, and future). A principle should not force us to posit irreducible modal properties. | **Parochial** (Required only for Humeans). |
  | **5. Non-Triviality** | **The Indeterminism Intuition:** In an indeterministic world, chances for contingent futures should not always be 0 or 1. A principle that collapses chance into truth (determinism) fails to account for probabilistic laws. | **Non-Negotiable** (for indeterminists). |

  ---

  ### II. The Tensions: Is the Literature's Messiness Necessary?

  Yes. The complexity in the literature is not merely pedantic; it reflects a genuine **trilemma**. You cannot simultaneously satisfy the following three claims:

  1.  **The Original Principal Principle (PP):** $C(A \mid \langle Ch(A)=x \rangle \ \& \ E) = x$ (where $E$ is admissible).
  2.  **Humean Supervenience (HS):** Chances supervene on the total history of events (including the future).
  3.  **The Possibility of Undermining Futures:** There is a non-zero chance that the future history will be such that it makes the *present* chance distribution false (e.g., a future sequence of heads so long it falsifies the hypothesis that the coin is fair).

  **The Conflict:**
  If **HS** is true, the proposition $\langle Ch(A)=x \rangle$ entails facts about the future (because the future helps determine the chance). However, if there is an **Undermining Future**, the chance proposition assigns a non-zero probability to a future that would make the chance proposition false.
  *   By **PP**, you conditionalize on the chance proposition.
  *   But conditionalizing on the chance proposition rules out the undermining future (since the chance proposition would be false if that future occurred).
  *   This creates a contradiction: The chance function says the undermining future is possible, but the principle requires you to treat it as impossible to maintain the deference.

  **Conclusion:** The literature is messy because **Original PP and HS are jointly unsatisfiable** in a world with undermining futures. One must be abandoned or modified.

  ---

  ### III. Scorecard

  Here is how the three major approaches handle the desiderata and the tension.

  #### 1. Lewis's Original Principal Principle (PP)
  *   **Formula:** $C_{t}(A \mid \langle Ch_{t}(A)=x \rangle \ \& \ E) = x$
  *   **Deference:** **Pass.** Captures the intuition perfectly in simple cases.
  *   **Temporal Indexing:** **Pass.** Explicitly time-indexed.
  *   **Information Sensitivity:** **Pass.** Uses the "admissibility" clause to filter crystal-ball info.
  *   **Humean Supervenience:** **Fail.** As shown above, PP entails that undermining futures have credence 0, but HS allows them to have non-zero chance. Lewis eventually conceded PP is false if HS is true.
  *   **Verdict:** Intuitively correct but metaphysically fragile.

  #### 2. The New Principle (NP) (Lewis 1994 / Hall 1994)
  *   **Formula:** $C_{t}(A \mid T_{w}) = P_{t}(A)$, where $T_{w}$ is the theory of chance for world $w$ (which includes the history of chance events).
  *   **Deference:** **Pass.** (Derives deference as a consequence rather than a definition).
  *   **Temporal Indexing:** **Pass.**
  *   **Information Sensitivity:** **Pass.** By conditionalizing on the *theory* of chance rather than the chance proposition directly, it handles undermining futures.
  *   **Humean Supervenience:** **Pass.** Specifically designed to save HS. It allows the chance function to be uncertain about the future history that determines it.
  *   **Verdict:** Metaphysically robust for Humeans, but less intuitively direct than PP. It defines the link via the "theory of chance" rather than direct chance propositions.

  #### 3. Primitivist Chance (Non-Humean Alternative)
  *   **Metaphysics:** Chances are sui generis properties or relations that do *not* supervene on the total history of events (e.g., Maudlin, Bird).
  *   **Deference:** **Pass.** Can retain the Original PP without modification.
  *   **Temporal Indexing:** **Pass.**
  *   **Information Sensitivity:** **Pass.**
  *   **Humean Supervenience:** **Fail.** (By design). Because chances do not supervene on the future, there are no "undermining futures." The chance at $t$ is fixed by the laws/properties at $t$, not the future outcome.
  *   **Verdict:** Metaphysically costly (violates Humean parsimony) but conceptually clean. It dissolves the trilemma by rejecting HS.

  ### Summary Recommendation
  If you are a **Humean**, you must accept the **New Principle**. The Original PP is logically incompatible with your metaphysics.
  If you are a **Non-Humean**, you can retain the **Original PP**, but you pay the price of rejecting Supervenience.
  The "messiness" in the literature is the sound of philosophers trying to keep Deference and Humean Supervenience simultaneously; the New Principle is the scar tissue from that surgery.
