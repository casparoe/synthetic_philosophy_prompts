  1. **Tragedy of the Commons**
  Path: Q1: Yes (Collective harm from substrate depletion?) → Q2: Yes (Substrate is physical/natural?)
  Distinction: Structurally distinct from Race to the Bottom because the rivalrous resource is biophysical rather than regulatory, making exclusion physically difficult rather than politically negotiated.

  2. **Race to the Bottom**
  Path: Q1: Yes (Collective harm from substrate depletion?) → Q2: No (Substrate is physical/natural?)
  Distinction: Structurally distinct from Tragedy of the Commons because the degraded substrate consists of social standards or laws rather than finite natural resources, allowing for potential re-regulation.

  3. **Keynesian Beauty Contest**
  Path: Q1: No → Q3: Yes (Payoff determined by relative standing?) → Q4: Yes (Strategy based on guessing others' expectations?)
  Distinction: Structurally distinct from Arms Races because agents optimize for predictive accuracy of the average view rather than accumulating tangible capability or power.

  4. **Arms Race**
  Path: Q1: No → Q3: Yes → Q4: No → Q5: Yes (Capability primarily for security/defense?)
  Distinction: Structurally distinct from Positional-Good Rat Race because the escalation is driven by threat mitigation and survival risks, though this boundary is often empirically messy when status confers security.

  5. **Positional-Good Rat Race**
  Path: Q1: No → Q3: Yes → Q4: No → Q5: No (Capability primarily for security/defense?)
  Distinction: Structurally distinct from Arms Race because the escalation targets social status or consumption signaling rather than defensive capability, despite both involving zero-sum relative utility.

  6. **Goodhart's Law**
  Path: Q1: No → Q3: No → Q6: No (Failure driven by information asymmetry?)
  Distinction: Structurally distinct from Preference Falsification because the coordination failure arises from metric optimization destroying the goal, not from agents hiding private information due to social sanctions.

  7. **Preference Falsification**
  Path: Q1: No → Q3: No → Q6: Yes → Q7: Yes (Agents actively misrepresent private preferences?)
  Distinction: Structurally distinct from Information Cascade because agents consciously lie about their true views to avoid sanctions, whereas cascades involve ignoring private signals to follow public actions.

  8. **Information Cascade**
  Path: Q1: No → Q3: No → Q6: Yes → Q7: No (Agents actively misrepresent private preferences?)
  Distinction: Structurally distinct from Preference Falsification because agents rationally discard their own private information to match public behavior, rather than actively concealing their true preferences.
