prompt: |-
  I work on platform trust and safety, mostly thinking about misinformation, coordinated inauthentic behavior, and how much a platform should intervene in political speech. My day-to-day mental toolkit is game theory and information economics: common knowledge, public versus private signals, cheap talk, signaling games, reputation, Bayesian persuasion, common priors, information cascades — that kind of thing. Recently, after a long argument with a colleague about wether fact-checking can ever "win," I read Hannah Arendt's essays "Truth and Politics" (1967) and "Lying in Politics" (the Pentagon Papers one from 1971). What I think she's saying is something like: there are two kinds of truth, and factual truth is the politically fragile one because it's contingent and doesn't force agreement the way logical or mathematical truth does; modern political lying isn't just deception, it's an attempt to rewrite the shared record of facts; and the deepest damage isn't that people believe the lie but that they stop believing in the existence of any shared factual world at all.

  I want you to restate this position in the vocabulary I actually use — common knowledge, public signals, cheap talk, reputation, information cascades, Bayesian persuasion, common priors — as faithfully as you can, and then give me a residue report. Which of Arendt's claims translate cleanly (e.g., organized lying as an attack on a shared public signal, or the move from "people believe the lie" to "people believe nothing" as a collapse of common priors)? Which ones can only be forced in with distortion? And which have no counterpart in my vocabulary at all — is that because my vocabulary is missing something real, or because Arendt's claims are less precise than they look? I especially want to know whether "the common world" she keeps talking about is just common knowledge by another name, or whether she's pointing at something my models presuppose and can't state.
