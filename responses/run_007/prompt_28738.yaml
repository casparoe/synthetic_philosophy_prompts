      *   *Political Lying:* Strategic manipulation of public signals (Bayesian Persuasion). Coordinated Inauthentic Behavior (CIB) as a mechanism to flood the signal space.
      *   *Rewriting the Shared Record:* Attacking the history of public signals. Making past signals unverifiable or noisy.
      *   *Believing Nothing:* Breakdown of the updating mechanism. If the likelihood ratio of any signal approaches 1 (signal is pure noise), posterior beliefs don't move. Or, if agents assume the sender's type is always "Liar," they ignore all signals.
