      *   *The Nature of Political Lying:* It's not just hiding secrets; it's creating an alternative reality. It targets the "fabric" of reality.
      *   *The Goal of Totalitarian/Organized Lying:* Not necessarily to make people believe the specific lie, but to destroy the distinction between truth and falsehood. To make *everything* seem like opinion.
