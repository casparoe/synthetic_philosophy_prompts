prompt: |-
  I teach an upper-level undergraduate seminar called "Rationality and Its Failures" — about 20 students, mostly philosophy and economics majors, meeting for 75 minutes. We're about to start a unit on escalation of commitment and the sunk cost fallacy, and I want an activity that makes them feel the trap in their bones before we analyze it in the abstract. I'm thinking of running a version of the dollar auction, but I have constraints: I can't use real money (university rules), and I don't want anyone to walk away feeling actually harmed or humiliated. I also want the debrief to connect what happened in the game to real-world cases — military interventions, failing software projects, toxic relationships — not just to the formal game theory. The goal is for students to leave seeing that escalation of commitment is not simply a mistake made by irrational people, but a predicament that can trap perfectly reasonable agents who are trying to cut their losses.

  Design the activity for me. I need: the exact rules, including how bidding works, what the payoff structure is, and what the "currency" is if not real money; materials I'll need to prepare; a timeline for the 75 minutes (setup, play, and debrief, with approximate durations); and a debrief plan that maps specific moments in the game onto the theoretical concepts — sunk cost, the point of no return, the divergence between the rational choice at each step and the escalatory outcome, and the role of face-saving and commitment. Also tell me what will predictably go wrong the first time I run it — e.g., students who know the paradox refusing to bid, students colluding, or the auction not escalating far enough — and how I should handle each. Be honest about which features of real-world escalation the activity cannot reproduce and that I'll need to supply in the discussion afterward. Finally, in your response, please separate what is settled and widely agreed upon among people who study escalation of commitment from what is genuinely contested or still open, and don't present a contested view as the consensus. End with a one-sentence summary of the activity as the last line of your answer.
reasoning: |-
  Here's a thinking process that leads to the suggested activity design:

  1.  **Analyze the Request:**
      *   **Course:** Upper-level undergraduate seminar ("Rationality and Its Failures").
      *   **Students:** ~20, Philosophy & Economics majors.
      *   **Time:** 75 minutes.
      *   **Topic:** Escalation of Commitment / Sunk Cost Fallacy.
      *   **Goal:** Experiential activity (feel the trap) + Theoretical debrief (connect to real world, avoid blaming "irrationality").
      *   **Constraints:** No real money (university rules), no harm/humiliation, must connect to real-world cases (military, software, relationships).
      *   **Deliverables:** Rules, Currency, Materials, Timeline, Debrief Plan, Troubleshooting (what goes wrong), Limitations of the activity, Consensus vs. Contested theory, One-sentence summary at the very end.

  2.  **Deconstruct the Core Activity (The Dollar Auction):**
      *   *Standard Version:* Auction a $1 bill. Highest bidder wins $1, *second* highest bidder also pays their bid but gets nothing.
      *   *Problem:* Requires real money (violates constraint), can cause genuine financial loss (violates constraint), can be humiliating.
      *   *Solution:* Modify the currency and stakes. Use "points" or "extra credit" (carefully) or a symbolic currency that translates to a small, safe reward (like candy or a "get out of reading quiz free" pass). Given the "no harm" constraint, a symbolic point system redeemable for a trivial tangible reward (chocolate) is safest and easiest to manage without bureaucracy.
      *   *Modification for "No Humiliation":* Ensure the "loss" is low stakes. The "pain" should be psychological, not financial.
      *   *Modification for "20 Students":* A single auction might leave 18 people watching. Need to run multiple simultaneous auctions or a tournament style. Simultaneous small groups (4-5 students per group) work best for engagement.

  3.  **Drafting the Activity Design:**
      *   **Name:** "The Point Auction" (modified Dollar Auction).
      *   **Currency:** "Rationality Points" (RP). Redeemable for a chocolate bar or a small privilege (e.g., dropping the lowest participation score). Let's go with chocolate/candy for simplicity and universality.
      *   **Prize:** A large chocolate bar (worth, say, 100 RP).
      *   **Rules:**
          1.  Bids in increments of 5 RP.
          2.  Highest bidder wins the Prize *minus* their bid cost? No, standard Dollar Auction is: Winner gets Prize (value 100) - Bid. Loser (2nd place) pays Bid - gets nothing.
          3.  *Wait, constraint check:* If they "pay" points they don't have, it's abstract. If they start with an endowment, it feels like loss aversion. Let's give them an endowment of 50 RP.
          4.  *Crucial Twist:* To make it feel like *commitment*, allow a "withdrawal" option early on that costs a small fee, but becomes impossible later. Actually, sticking closer to the Shubik Dollar Auction is better for the specific logic of escalation.
          5.  *Revised Rules:*
              *   Prize: Large Chocolate Bar (Value = $5 equivalent, or just "The Prize").
              *   Currency: Play Money (printed "Seminar Bucks").
              *   Endowment: Each player gets $2.00 in Seminar Bucks.
              *   Mechanism: Highest bidder wins the Prize *and* pays their bid. Second highest bidder *pays their bid* and gets nothing.
              *   Constraint Check: No real money changes hands. The "payment" is just returning the play money. If they run out, they can sign an "IOU" for a trivial penalty (e.g., must bring snacks next week). *Better:* Keep it strictly symbolic. The "loss" is the embarrassment of losing points, redeemed for a prize at the end of class. If they end negative, they just don't get the end-of-class treat.
              *   *Refinement for Safety:* To avoid "IOUs" which feel like debt, give everyone 100 points. Bids deduct from points. End of class, points > 0 get a cookie. Points < 0 get nothing. This makes the loss opportunity cost, not active debt.
      *   **Grouping:** 4 groups of 5 students. Run 4 auctions simultaneously.

  4.  **Timeline (75 mins):**
      *   Intro/Setup (10 mins)
      *   Activity (20 mins) - Needs to escalate quickly.
      *   Individual Reflection (5 mins) - Crucial for internalizing.
      *   Debrief/Discussion (40 mins) - The meat of the seminar.

  5.  **Debrief Plan:**
      *   Need to map game moments to theory.
      *   *Moment 1:* Early bidding (Rational speculation).
      *   *Moment 2:* The $1 threshold (The trap snaps shut).
      *   *Moment 3:* Beyond $1 (Sunk cost vs. Marginal cost).
      *   *Connections:* Vietnam (military), Concorde (economic), Relationships (personal).
      *   *Key Insight:* It's not irrationality; it's the structure of the game.

  6.  **Troubleshooting (What goes wrong):**
      *   *Collusion:* Students agree to bid $0.01 and split the prize. *Fix:* Make it anonymous bidding? No, that kills the escalation. *Fix:* Acknowledge it as a "cooperative solution" that fails in non-cooperative reality. Or run it as a "sealed bid" initially then open? No, Dollar Auction needs open outcry. *Best Fix:* Warn against it, but if it happens, debrief *why* collusion is unstable (prisoner's dilemma aspect).
      *   *No Bidding:* Students know the trick. *Fix:* Increase the prize value (psychologically) or use a "warm-up" round with trivial stakes.
      *   *Stopping too early:* *Fix:* The instructor acts as the auctioneer and encourages "Do you really want to lose your bid?"

  7.  **Limitations:**
      *   Game is finite/clear rules; real life is ambiguous.
      *   Game has no "external" pressure; real life has reputational stakes.
      *   Game is one-off; real life is repeated.

  8.  **Consensus vs. Contested:**
      *   *Consensus:* Sunk costs *should* be ignored normatively. Escalation happens frequently.
      *   *Contested:* *Why* it happens. Is it cognitive bias (psychological)? Is it signaling (reputation)? Is it principal-agent problem? Is it actually rational in some contexts (option value)? Need to be careful not to say "It's always irrational."

  9.  **Refining the "Currency" and "Harm" Constraint:**
      *   University rules often prohibit gambling even with fake money if it implies value.
      *   *Safest bet:* "Participation Credits." Everyone starts with 10 credits. Bidding costs credits. Winner gets a tangible prize (chocolate). Losers just have fewer credits. No one owes anything. This removes the "debt" anxiety.
      *   *Wait, the Dollar Auction requires the second bidder to PAY.* If they don't have credits, they can't bid.
      *   *Solution:* Give ample endowment (e.g., 50 credits). Max bid usually caps around 20-30 in classroom settings before they stop.
      *   *Alternative:* The "Cost" is social. No, that's risky for humiliation.
      *   *Best Compromise:* Use "Class Currency" printed on paper. End of class, exchange currency for candy. If you have negative currency, you just get no candy. You don't owe the professor anything. This satisfies "no real money" and "no harm."

  10. **Structuring the Response:**
      *   Follow the prompt's requirements exactly.
      *   Section 1: Activity Design (Rules, Currency, Materials).
      *   Section 2: Timeline.
      *   Section 3: Debrief Plan (Mapping game to theory).
      *   Section 4: Troubleshooting.
      *   Section 5: Limitations.
      *   Section 6: Consensus vs. Contested.
      *   Final Line: One-sentence summary.

  11. **Self-Correction/Review during drafting:**
      *   *Check:* Did I address the "perfectly reasonable agents" goal? Yes, emphasize in debrief that each step was locally rational.
      *   *Check:* Did I address the "no humiliation"? Yes, by making the currency symbolic and the loss merely "no candy."
      *   *Check:* Consensus vs. Contested. Need to be precise. The definition of sunk cost is consensus. The *explanation* for escalation is contested (psychological vs. strategic).
      *   *Check:* Timeline. 75 mins is tight. Keep the game to 15-20 mins max. Debrief needs 45+ mins.
      *   *Check:* Groups. 20 students. 4 groups of 5 is good. Allows comparison between groups.

  12. **Final Polish:** Ensure tone is pedagogical and supportive. Make sure the "Consensus vs. Contested" section is distinct and clear. (Self-correction: Ensure I don't present the "rational signaling" model as false, but as a competing explanation to the "cognitive bias" model).

  13. **Final Sentence:** Must be the very last thing. "This activity uses a modified multi-group dollar auction with symbolic currency to viscerally demonstrate how locally rational decisions accumulate into globally irrational outcomes." (Or similar).

  Let's write it.
answer: |-
  ### Activity Design: The "Point of No Return" Auction

  This is a modified, multi-group version of Martin Shubik's Dollar Auction, adapted for academic constraints. It prioritizes psychological engagement over financial stakes to ensure safety while preserving the structural trap.

  #### 1. Rules and Mechanics
  *   **The Prize:** A desirable tangible reward (e.g., a high-quality chocolate bar or a "Homework Pass" token). Value is symbolic but understood to be worth roughly $5–$10.
  *   **The Currency:** "Seminar Points" (SP). Print these on slips of paper beforehand.
      *   **Endowment:** Each student receives an envelope with **50 SP**.
      *   **Redemption:** At the end of the class, any student with >0 SP receives a small treat (e.g., a piece of candy). Students with negative SP receive nothing. *Crucially: No student owes the university or instructor anything.* Negative points are simply a "loss" of the end-of-class treat.
  *   **The Auction:**
      1.  Divide the class into **4 groups of 5 students**. Run four auctions simultaneously.
      2.  **Objective:** Win the Prize.
      3.  **Bidding:** Open outcry. Bids must increase in increments of 5 SP.
      4.  **Payment Rule (The Trap):**
          *   The **Highest Bidder** wins the Prize and pays their bid amount (deducted from SP).
          *   The **Second-Highest Bidder** pays their bid amount (deducted from SP) and receives *nothing*.
          *   All other bidders pay nothing.
      5.  **Termination:** The auction ends when no one is willing to bid higher.
      6.  **Constraint:** If a student runs out of SP, they may bid into the negative, but they forfeit the end-of-class treat.

  #### 2. Materials Needed
  *   4 Prizes (Chocolate bars or equivalent).
  *   100 slips of "Seminar Points" (denominated in 10s and 5s).
  *   20 Envelopes (to distribute endowments).
  *   4 Printed Rule Sheets (one per group).
  *   Whiteboard (to track aggregate results across groups during debrief).

  #### 3. Timeline (75 Minutes)

  | Phase | Duration | Activity |
  | :--- | :--- | :--- |
  | **Setup** | 10 mins | Distribute envelopes/points. Explain rules clearly. Emphasize the "Second-Highest Bidder Pays" rule. Check for understanding. |
  | **Play** | 15 mins | Run the auctions simultaneously. You circulate to ensure rules are followed. Stop a group if bidding stalls or exceeds 10 minutes. |
  | **Reflection** | 5 mins | **Silent Writing.** Students answer: "At what exact bid did you feel you could no longer stop? Why?" |
  | **Debrief** | 45 mins | Full class discussion. Map game dynamics to theory and real-world cases (see below). |

  ---

  ### Debrief Plan: Mapping Game to Theory

  Do not start by lecturing. Start by asking the students to report their numbers. Write the final bids of all 4 groups on the board.

  **1. The Trap Snaps Shut (The $1 Threshold)**
  *   **Game Moment:** When the bidding reaches the value of the Prize (e.g., 50 SP).
  *   **Concept:** *The Sunk Cost Fallacy.*
  *   **Discussion:** Ask the second-highest bidder: "Why did you keep bidding past the value of the prize?"
  *   **Theoretical Link:** Before the trap snaps, bids are investments. After the trap snaps, bids are loss mitigation. The money already bid is sunk, but the *rule structure* makes the sunk cost relevant to future payoffs.
  *   **Real World:** **Military Interventions.** (e.g., Vietnam). Troops sent (initial bid). Casualties mount (sunk cost). Withdrawing means those deaths were "for nothing," so more troops are sent to justify the initial loss.

  **2. Locally Rational, Globally Irrational**
  *   **Game Moment:** The decision to bid 55 SP to beat a 50 SP bid.
  *   **Concept:** *Marginal Analysis vs. Global Rationality.*
  *   **Discussion:** "Was it rational to bid 55?" (Yes: Paying 55 to win the prize is better than paying 50 to win nothing).
  *   **Theoretical Link:** *Escalation of Commitment.* Each individual step is utility-maximizing given the current state. The irrationality is in the *entry*, not necessarily the continuation.
  *   **Real World:** **Failing Software Projects.** (e.g., Healthcare.gov initial rollout or FBI Virtual Case File). Each additional dollar spent seems cheaper than admitting the previous millions were wasted.

  **3. Face-Saving and Reputation**
  *   **Game Moment:** When students look at each other before bidding.
  *   **Concept:** *Audience Costs / Signaling.*
  *   **Discussion:** "Did you worry about looking like a 'loser' to your group?"
  *   **Theoretical Link:** *Commitment Devices.* Agents escalate to signal resolve to competitors or constituents.
  *   **Real World:** **Toxic Relationships.** Staying in a conflict or relationship not because it yields value, but because leaving signals "failure" to friends/family.

  **4. The Counterfactual**
  *   **Game Moment:** The students who did not bid.
  *   **Concept:** *Rational Avoidance.*
  *   **Discussion:** "Is the only rational move not to play?"
  *   **Theoretical Link:** This highlights that the "failure of rationality" is often a failure of *institutional design*, not individual cognition.

  ---

  ### Troubleshooting: What Will Go Wrong

  **1. Collusion (The "Cartel" Solution)**
  *   **Problem:** A group agrees beforehand that one person bids 5 SP, wins, and shares the chocolate.
  *   **Why:** Economics majors especially will spot the cooperative equilibrium.
  *   **Fix:** Do not stop it. Use it. In the debrief, ask: "Why is this solution unstable?" (Incentive to defect). Connect to **OPEC** or **Arms Control Treaties**. Real-world escalation often happens because binding agreements are impossible to enforce.

  **2. The "Freeze" (No Bidding)**
  *   **Problem:** Students know the paradox and refuse to bid.
  *   **Why:** Prior knowledge or risk aversion.
  *   **Fix:** Increase the "Endowment" psychological value. Announce that the group with the *highest remaining total points* gets an extra prize. This creates competition between groups, forcing them to engage to "defend" their group's standing. Alternatively, run a "practice round" with a trivial prize (a single gummy bear) to loosen them up before the main round.

  **3. Escalation Stops Too Early**
  *   **Problem:** Bidding stops at 40 SP (below prize value).
  *   **Why:** Risk aversion.
  *   **Fix:** As the auctioneer, gently prompt the second-highest bidder: "So you are willing to lose 35 points for nothing? Or would you prefer to bid 40 for a chance to win?" This mirrors the real-world pressure from advisors/stakeholders.

  **4. Emotional Distress**
  *   **Problem:** A student feels genuinely stupid for losing.
  *   **Fix:** Normalize the outcome immediately. "If you bid past 50, you are in good company. PhD economists do this in controlled settings." Emphasize the *structure* trapped them, not their *intelligence*.

  ---

  ### Limitations: What the Activity Cannot Reproduce

  You must supply these verbally in the debrief, as the game is too clean to capture them:

  1.  **Ambiguity:** In the game, the rules and costs are clear. In real life (e.g., war, business), the cost of the next step is uncertain, and the value of the prize is often redefined ("We aren't fighting for oil, we're fighting for freedom").
  2.  **Principal-Agent Problems:** In the game, the bidder pays the cost. In organizations, the person deciding to escalate (CEO, General) often isn't the one paying the cost (Shareholders, Soldiers).
  3.  **Time Horizon:** The game takes 10 minutes. Real escalation happens over years, allowing for memory decay and changing personnel (who weren't there for the initial "sunk" decision).

  ---

  ### Consensus vs. Contested Theory

  In your debrief, distinguish clearly between what is settled and what is debated in the literature.

  **Settled / Consensus:**
  *   **Normative Principle:** Sunk costs *ought* to be ignored in rational decision-making. Only marginal costs and benefits should dictate future action.
  *   **Descriptive Fact:** Escalation of commitment is a robust, replicable phenomenon across cultures and contexts.
  *   **Structural Cause:** Competitive structures where "second place" is punished (like the auction rule) inherently drive escalation.

  **Contested / Open Questions:**
  *   **The Mechanism:** Is escalation driven primarily by *cognitive bias* (psychological inability to ignore sunk costs) or *strategic rationality* (signaling resolve to deter future competitors)? Some game theorists argue escalation can be rational if it builds a reputation for toughness.
  *   **The "Rational" Threshold:** At what point does "perseverance" become "escalation"? There is no agreed-upon metric for distinguishing adaptive persistence from maladaptive escalation in real-time.
  *   **Remedies:** There is no consensus on the best intervention. Some argue for "pre-commitment devices" (rules set in advance), while others argue for "change of leadership" (bringing in new agents not tied to the sunk costs).

  This activity uses a modified multi-group dollar auction with symbolic currency to viscerally demonstrate how locally rational decisions accumulate into globally irrational outcomes.
