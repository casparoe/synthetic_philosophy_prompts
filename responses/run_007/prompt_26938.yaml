      *   **Key Arguments:**
          *   SIA: Existence favors larger populations.
          *   SSA: Existence shouldn't favor larger populations; sensitivity to reference class is a problem for SSA but SIA has its own issues (overconfidence).
      *   **Required Connections:** Doomsday Argument, Sleeping Beauty Problem.
      *   **Dynamic:** Real back-and-forth, no strawmanning, technical substance, explicit concessions/refinements (2-3 times).

  2.  **Character Conception:**
      *   **Interlocutor A (SSA Defender):** Let's call her *Elena*. She leans towards Bostrom's later views or a restricted reference class approach. She worries about "presumptuousness" and empirical coherence.
      *   **Interlocutor B (SIA Defender):** Let's call him *Marcus*. He leans towards the "Centered Worlds" approach (e.g., Bradley, Draper, Pust). He worries about the Doomsday Argument and wants to update on existence.
