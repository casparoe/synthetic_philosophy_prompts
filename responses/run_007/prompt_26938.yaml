      *   **Round 1: The Core Dispute.** Marcus argues for SIA ($P(T_2) \gg P(T_1)$ given existence). Elena argues for SSA ($P(T_2) \approx P(T_1)$).
      *   **Round 2: Reference Class Problem (SSA's weakness).** Marcus presses Elena on defining the reference class. *Concession 1:* Elena admits the arbitrariness but argues for a "minimal" class.
      *   **Round 3: Overconfidence/Presumptuousness (SIA's weakness).** Elena presses Marcus on whether SIA allows a priori certainty about physical facts. *Concession 2:* Marcus admits SIA implies strong priors but argues this is a feature, not a bug (solving Doomsday).
      *   **Round 4: Sleeping Beauty Connection.** Connect the logic to the Thirder/Halfer debate.
      *   **Round 5: Doomsday Argument.** How SIA defeats Doomsday, how SSA accepts it.
      *   **Conclusion:** Stalemate but clarified positions.

  4.  **Drafting - Section by Section:**

      *   *Setting the Stage:* Start *in media res* with the specific physics scenario. $T_1$: $10^{10}$ observers. $T_2$: $10^{50}$ observers. Priors equal.
      *   *Marcus (SIA):* Standard SIA move. You are more likely to exist in $T_2$. Posterior favors $T_2$ massively.
      *   *Elena (SSA):* Standard SSA move. You should reason as if randomly sampled from the reference class. If the class is "observers in my epistemic situation," the ratio is 1:1.
      *   *Marcus's Push:* What is the reference class? If it's "humans," why not "minds"? If it's arbitrary, SSA is unstable.
