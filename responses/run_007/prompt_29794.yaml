answer: |-
  Your observation about the tension between the "statue" and the "slave" is astute. It is easy to read this passage as a single, consistent metaphor, but you have correctly identified that Socrates shifts the imagery mid-stream. This shift is not careless; it performs specific philosophical work in isolating the precise epistemic deficiency of true opinion.

  Here is a close reading of 97d–e focusing on how that double comparison functions and what feature of true opinion it isolates.

  ### 1. The Statue: Isolating Value
  Socrates begins with the **statues of Daedalus**. The defining characteristic of these statues, in the myth, is that they are so lifelike they move.
  *   **The Text:** *"if fastened, it is worth a great deal, for his productions are very fine things."*
  *   **The Work:** This half of the analogy establishes that **true opinions are inherently valuable.** A true opinion is not "false" or "worthless"; like a Daedalus statue, it is a "fine thing" (*kala erga*). If you have a true opinion about the road to Larissa, you will get there just as surely as if you had knowledge.
  *   **The Limit:** However, a statue is an external object. If we stopped here, the implication would be that knowledge is merely about *security of property*. But opinions are not external property; they are states of the soul. This is why the metaphor must shift.

  ### 2. The Slave: Isolating Interiority and Agency
  Socrates slides from the statue to the **runaway slave**.
  *   **The Text:** *"it will not stay with you any more than a runaway slave."*
  *   **The Work:** This shift addresses the **location and behavior** of the opinion. A statue sits in a courtyard; an opinion sits in the mind. By invoking a slave, Socrates anthropomorphizes the opinion. A slave runs away intentionally; they seek escape.
  *   **Why this matters:** This suggests that ungrounded true opinions are **restless within the soul.** They do not "fit." They lack a natural home in the mind because the holder does not understand *why* they are true. Because the opinion is not integrated into the thinker's web of reasoning, it remains alien to the soul, prone to "fleeing" (being forgotten, doubted, or talked out of) as if it were seeking freedom from a master who cannot justify holding it.

  ### 3. The Feature Being Isolated: Causal Binding (*Aitias Logismos*)
  You asked whether Socrates is isolating mere instability, the lack of a reason, or the soul's relation to the content. The double comparison allows him to isolate **causal binding as the condition for psychological retention.**

  If the feature were merely *instability*, a leaf blowing in the wind would suffice as a metaphor. But a leaf has no value.
  If the feature were merely *lack of reason*, a mathematical proof without steps would suffice. But that doesn't capture the loss.

  By combining the **Valuable Object** (Statue) with the **Fleeing Agent** (Slave), Socrates isolates a specific epistemic feature: **Possession requires integration.**

  *   **Unfastened:** The opinion is correct, but it is isolated. It hangs in the mind without a chain of reasoning connecting it to other things you know. Because it is isolated, it is fragile. It "plays truant" because it has no logical necessity holding it in place.
  *   **Fastened:** Socrates defines the "fastening" immediately after this passage as the *"calculation of the reason why"* (*aitias logismos*).

  Therefore, the "running away" is not just forgetting. It is the **epistemic fragility of unexplained truth.** When you have a true opinion without knowledge, you possess the *truth* but not the *cause*. Because you lack the cause, you cannot defend the opinion against rhetoric, doubt, or time. It leaves you because you have no logical tether to pull it back.

  ### 4. Conclusion: The Work of the Double Comparison
  The "slide" you noticed is the engine of the argument.

  1.  **The Statue** tells us that True Opinion is **worth keeping** (it is correct/valuable).
  2.  **The Slave** tells us that True Opinion is **hard to keep** (it is psychologically unstable without understanding).

  The comparison does not just say knowledge is "more stable." It argues that **knowledge is true opinion that has been internalized through reasoning.**

  The "runaway slave" imagery specifically targets the **soul's relation to the content.** It suggests that until you understand the *cause* of a truth, that truth does not truly belong to you. It is a possession you own but cannot control. The "fastening" transforms the opinion from an external guest in the mind (a slave that might flee) into an intrinsic part of the thinker's rational structure (a tethered work of art that remains).

  So, to answer your specific question: The feature Socrates is isolating is **retention through causal understanding.** The double comparison allows him to show that without the "tether" of reasoning, even the most valuable truths remain alien to the soul, prone to escape like agents seeking freedom from a master who cannot justify their bondage.
