prompt: |-
  I'm working through Plato's Meno and would like help with a specific passage. Here is the passage as it appears in the translation I'm using:

  [97d]
  Socrates: That if they are not fastened up they play truant and run away; but, if fastened, they stay where they are.
  [97e]
  Socrates: To possess one of his works which is let loose does not count for much in value; it will not stay with you any more than a runaway slave: but when fastened up it is worth a great deal, for his productions are very fine things
  Socrates: And to what am I referring in all this? To true opinion. For these, so long as they stay with us, are a fine possession,

  I understand the broad claim that knowledge is more valuable than true opinion. What I don't understand is the comparison itself. An unfastened statue is an owner's possession that won't stay put, but a runaway slave is a person whose leaving seems intentional. The text seems to slide between "a thing worth keeping" and "something that can run away from you." What work, exactly, does this double comparison do for the argument? In particular, what feature of true opinion is Socrates trying to isolate here—mere instability, the lack of a reason or tether, or something about the soul's relation to the content? I'd like a close reading of just this passage, not a summary of the whole dialogue.
reasoning: |-
