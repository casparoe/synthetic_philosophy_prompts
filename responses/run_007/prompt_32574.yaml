prompt: |-
  Write a dialogue between Alex and Jordan, two AI alignment researchers grabbing coffee after a workshop. Alex thinks Goodhart's law is basically inescapable — it's not a bug in how we design rewards, it's a feature of what it means to optimize against a proxy at all. Jordan thinks Alex is way too pessimistic and that the field has actually made real progress on this. Get them arguing about the extremal vs. regressional Goodhart distinction, whether evolution is a good analogy (natural selection "optimized" for inclusive fitness and gave us... all of this), and whether techniques like iterated reward modeling or keeping the system uncertain about its goal can actually close the gap. Have them push on the question of whether corrigibility is a genuine solution or just pushes the specification problem one meta-level up. Both should be technically sharp and respond to each other's actual points — no strawmanning. And don't resolve it at the end; leave it genuinely unsettled.
