  Compare David Lewis's triviality results for indicative conditionals with the Adams thesis (the idea that the probability of an indicative conditional just is the conditional probability of its consequent given its antecedent). Lewis's results seem to show that the Adams thesis, combined with some seemingly innocuous assumptions about probability and logic, forces probability functions to be trivial — roughly, everything ends up probabilistically independent of everything else. But defenders of the Adams thesis don't just throw up their hands; they've developed various responses (denying that conditionals have truth conditions, giving up on certain closure principles, etc.). Walk me through the exact tension between these two positions, what each side has to give up to avoid the clash, and which side you think ends up in better shape once the dust settles. Lead with your bottom line in the first sentence and then give the reasoning — no preamble, no restating the question.
