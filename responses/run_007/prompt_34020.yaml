answer: |-
  Lewis's triviality results prove that maintaining the Adams thesis requires abandoning the view that indicative conditionals express propositions, and this non-truth-conditional approach ultimately remains in better shape because the intuitive link between conditionals and conditional probability is stronger than the assumption that conditionals must be truth-apt.

  The tension arises because Lewis demonstrated that if indicative conditionals are propositions (having truth conditions) and the Adams thesis holds for a class of probability functions closed under conditioning, then the probability of the consequent given the antecedent must equal the unconditional probability of the consequent ($P(C|A) = P(C)$). This result implies probabilistic independence between antecedents and consequents, rendering conditionals useless for learning or inference, which is absurd. To avoid this triviality, one of the core assumptions must be rejected. Truth-conditionalists must reject or severely restrict the Adams thesis, while defenders of the Adams thesis must reject the idea that conditionals have truth conditions.

  Truth-conditionalists who attempt to save the propositional status of conditionals face the burden of explaining why the highly intuitive equation $P(A \rightarrow C) = P(C|A)$ fails. Since this equation aligns perfectly with how we assess conditionals under uncertainty (e.g., the probability that "if it rains, the ground gets wet" seems identical to the probability of the ground getting wet given rain), denying it requires positing a systematic error in human probabilistic reasoning or introducing complex, ad hoc restrictions on when the thesis applies. Furthermore, standard possible worlds semantics (like Stalnaker's) struggles to accommodate the thesis without running into Lewis's proof, forcing truth-conditionalists into technically complex revisions of probability theory or logic that often lack independent motivation.

  Defenders of the Adams thesis, conversely, avoid triviality by adopting a non-truth-conditional semantics, viewing conditionals as expressions of conditional belief rather than propositions that are simply true or false. By denying that conditionals have truth conditions, they block the application of standard probability functions to the conditional itself, thereby sidestepping Lewis's mathematical proof. The primary cost for this side is the Frege-Geach problem: if conditionals aren't propositions, it is difficult to explain how they function in embedded contexts, such as the antecedent of another conditional or within negation. However, this side ends up in better shape because the embedding problems are technical challenges regarding logic and syntax that have seen significant progress through dynamic semantics or expressivist frameworks, whereas the triviality result is a hard mathematical constraint within standard probability theory. Preserving the Adams thesis maintains the explanatory power of conditionals in epistemology and decision theory, making the sacrifice of classical truth conditions the lesser of two philosophical evils.
