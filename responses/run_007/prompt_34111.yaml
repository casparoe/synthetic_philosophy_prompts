answer: |-
  Elara executes an irrevocable voting proxy on her shares in the family firm, granting her brother sole discretion to approve all financial audits for the next decade, regardless of any future objection she might raise. She signs this not because she fears she will be coerced or bribed later, but because she recognises her current moral blindness towards his embezzlement is temporary; she knows her conscience will inevitably sharpen until she finds the deception unconscionable and demands restitution. By binding her future self now, she is not protecting herself from weakness, but rather protecting the family secret from her own future integrity, legally disabling her capacity to act on a matured ethical conviction so that her present loyalty can outlast her future virtue.

  ***

  **Analysis**

  **Standard Precommitment Theory**
  From the perspective of standard rational choice theory (following thinkers like Thomas Schelling or Jon Elster), this counts as a valid Ulysses contract. The theory is generally agnostic regarding the *content* of the preferences; it cares only about consistency and the satisfaction of the agent's higher-order desires over time. If Present Elara prefers family loyalty to justice, and she correctly predicts that Future Elara will prefer justice to loyalty, binding Future Elara is instrumentally rational. It solves a time-inconsistency problem, ensuring that the timeline adheres to the preferences of the self at the moment of contracting. The theory views the 'moral growth' merely as a shift in preference parameters, not an objective improvement, so preventing it is no different than preventing a future craving for cigarettes.

  **The Normative Limits View**
  A philosopher arguing for normative limits on precommitment (drawing on Kantian autonomy or Feinberg's limits on self-binding) would argue this contract is illegitimate. The core argument here is that moral agency is inalienable; one cannot validly consent to be prevented from fulfilling a moral duty. If Future Elara's desire to report the fraud is grounded in a genuine moral obligation, Present Elara has no right to bind her against it. This view holds that there are 'rights to moral independence' that cannot be signed away. To bind oneself against becoming a better person is to treat one's future moral conscience as an external threat rather than an essential part of the self, effectively enslaving the future agent to the past agent's moral errors.

  **The Key Feature**
  The feature doing the real work is the **anticipation of moral learning rather than akrasia**. In a standard Ulysses contract, the protagonist binds themselves because they know their future self will be *weaker* (succumbing to temptation, fear, or fatigue). In this scenario, the protagonist binds themselves because they know their future self will be *stronger* (more principled, more courageous). If you removed this feature—if Elara believed she would simply become too frightened or tired to act in the future—the scenario would collapse back into a standard case of binding against weakness. The philosophical tension exists solely because the 'failure of will' being prevented is actually a success of character.
