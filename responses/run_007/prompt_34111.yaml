      Standard precommitment theory (e.g., Schelling, Elster) generally views these contracts as tools for overcoming time-inconsistency caused by akrasia (weakness of will). It treats preferences as sovereign. If Present Elara prefers loyalty, and knows Future Elara will prefer justice, binding Future Elstra is rational *relative to Present Elara's utility function*. It counts as a valid Ulysses contract because it successfully aligns future actions with current higher-order preferences.

