answer: |-
  # The Standing-to-Blame Intake Procedure (STB-IP)

  **To:** Intake Analysts
  **From:** Director, Research Integrity Office
  **Subject:** Protocol for Evaluating Complainant Standing

  ### Purpose
  This procedure determines whether a complainant has the normative authority (*standing*) to trigger a formal investigation. It is distinct from assessing the *truth* of the allegation or the *credibility* of the witness. A person can tell the truth but lack the standing to accuse. This protocol prioritizes the legitimacy of our process over the immediate resolution of every allegation.

  **Time Limit:** 4 Hours max per complaint.
  **Authority:** Analysts must apply this strictly. Do not hedge.

  ---

  ### The Procedure

  **Question 1: Specific Complicity**
  *Ask:* Did the complainant knowingly participate in, facilitate, or benefit from the *specific* instance of misconduct they are now alleging?
  *   **Sufficient Answer for "Yes":** Evidence (emails, lab notebooks, testimony) shows the complainant executed the falsification, authored the plagiarized text, or signed off on the fabricated data they are now reporting.
  *   **Sufficient Answer for "No":** The complainant was uninvolved, unaware, or joined the project after the misconduct occurred.
  *   **Decision:**
      *   If **YES**: **DECLINE INVESTIGATION.** (Rationale: One cannot blame another for a joint enterprise one voluntarily joined. This prevents the office from being weaponized in internal disputes.)
      *   If **NO**: Proceed to Question 2.

  **Question 2: Active Normative Violation**
  *Ask:* Is the complainant currently under formal investigation, sanction, or probation for the *same category* of misconduct (e.g., fabrication, falsification, plagiarism) at this institution or another?
  *   **Sufficient Answer for "Yes":** An active case file exists; a sanction is currently in effect; or a retraction is pending due to their own misconduct.
  *   **Sufficient Answer for "No":** No active files; past sanctions are fully served and closed.
  *   **Decision:**
      *   If **YES**: **DECLINE INVESTIGATION.** (Rationale: Institutional consistency. We cannot enforce rules against X on behalf of someone currently being punished for X. It undermines the office's authority.)
      *   If **NO**: Proceed to Question 3.

  **Question 3: Remediation and Time**
  *Ask:* If the complainant has a *past* record of similar misconduct, was it formally resolved (sanction completed, training done) more than 5 years ago?
  *   **Sufficient Answer for "Yes":** Case closed >5 years ago; no recurrence.
  *   **Sufficient Answer for "No":** Case closed <5 years ago; or record is ambiguous; or sanction involved permanent restrictions.
  *   **Decision:**
      *   If **YES**: **OPEN INVESTIGATION.** (Rationale: Rehabilitation. Past sins do not forfeit future standing indefinitely.)
      *   If **NO**: **ESCALATE TO DIRECTOR.** (Rationale: This is a value judgment on whether the past conduct is too proximate to grant standing. The procedure cannot automate this.)

  ---

  ### Philosophical Simplifications & Trade-Offs

  To make this usable for non-philosophers within 4 hours, we have made the following cuts:

  1.  **Dropped: Moral Worth.** We do not assess whether the complainant is a "good person." We assess their *relationship to the specific norm* violated.
  2.  **Dropped: Proportionality.** We do not weigh whether the complainant's past sin was "smaller" than the accused's current sin. A fabricator lacks standing to accuse another of fabrication, regardless of volume.
  3.  **Kept: Complicity.** This is the strongest defeater of standing. It survives simplification because it is factual (did they do it?) rather than evaluative (were they bad?).
  4.  **Kept: Temporal Status.** The distinction between *active* violation and *resolved* violation is crucial. It distinguishes hypocrisy from rehabilitation.

  **Known Misfire:** This procedure will occasionally block the exposure of truth. If the only person who knows about fraud is an accomplice, this procedure blocks their complaint. We accept this cost to prevent the office from becoming a tool for settling scores among co-conspirators.

  ---

  ### Application to Current Complaints

  #### Case 1: The Sanctioned Professor
  *Profile:* Professor sanctioned 10 years ago for fabrication. Clean record since. Accuses junior researcher in another lab of fabrication.

  *   **Q1 (Specific Complicity):** Did the Professor help the junior researcher fabricate *this* data?
      *   *Answer:* No. (Different lab, different time).
      *   *Action:* Proceed.
  *   **Q2 (Active Violation):** Is the Professor currently under sanction for fabrication?
      *   *Answer:* No. (Sanction was 10 years ago).
      *   *Action:* Proceed.
  *   **Q3 (Remediation):** Was the past sanction resolved >5 years ago?
      *   *Answer:* Yes. (10 years).
      *   *Action:* **OPEN INVESTIGATION.**

  *Outcome:* The complaint proceeds. The Professor has rehabilitated their standing.

  #### Case 2: The Investigated Chair
  *Profile:* Department Chair currently under investigation for image manipulation. Dismisses practice as "normal." Accuses colleague in another dept of image manipulation.

  *   **Q1 (Specific Complicity):** Did the Chair help the colleague manipulate *this* manuscript?
      *   *Answer:* No. (Different department).
      *   *Action:* Proceed.
  *   **Q2 (Active Violation):** Is the Chair currently under investigation/sanction for image manipulation?
      *   *Answer:* Yes. (Currently under investigation).
      *   *Action:* **DECLINE INVESTIGATION.**

  *Outcome:* The complaint is dismissed. We cannot investigate the colleague on the authority of a Chair who is actively defending the same misconduct elsewhere. It creates an appearance of "whataboutism" that compromises the office.

  #### Case 3: The Accomplice Graduate Student
  *Profile:* Grad student knowingly carried out supervisor's falsification. Reports it after an authorship dispute.

  *   **Q1 (Specific Complicity):** Did the student knowingly participate in *this* falsification?
      *   *Answer:* Yes. ("Knowingly carried out the data falsification her supervisor directed").
      *   *Action:* **DECLINE INVESTIGATION.**

  *Outcome:* The complaint is dismissed.

  ---

  ### The Unliked Outcome: Case 3

  **The Instinct:** Our instinct is to open the investigation. Falsification is occurring. The student is the only witness. Stopping this leaves false data in the literature. It feels like protecting the supervisor.

  **Why the Procedure Overrides Instinct:**
  We decline this not because the data is true, but because the *accusation* is illegitimate. Philosophically, one lacks standing to blame another for a wrong one voluntarily helped commit. Practically, if we accept complaints from accomplices who fall out with their supervisors, we incentivize a "race to the bottom." Lab members will remain silent during fraud, waiting for a dispute (authorship, pay, hours) to weaponize the office against their PI.

  By declining, we signal that the Integrity Office is not a venue for settling disputes among co-conspirators.
  *Note:* While we decline the *complaint*, the Director may choose to open a *self-initiated* inquiry based on the information provided, but the *student* does not get the standing of a complainant. The procedure blocks the *pathway*, not necessarily the *outcome*, but the burden shifts entirely to the Office.

  ---

  ### What This Procedure Does Not Decide

  **The Truth of the Allegation.**
  This procedure deliberately does not assess whether the accused actually committed misconduct. Standing is procedural; truth is evidentiary. A person with perfect standing (a saint) can make a false allegation. A person with no standing (a criminal) can make a true one.

  **Why this judgment cannot be eliminated:**
  If analysts mix the assessment of *standing* with the assessment of *evidence*, they will inevitably allow "important" truths to override procedural integrity. They will say, "This accomplice is lying, so no standing," but also, "This accomplice is telling the truth, so we'll let it slide." This returns us to the ad hoc system we are trying to replace. We must separate *who is speaking* from *what is said* to maintain consistency. The truth of the allegation is decided in the Investigation Phase, not the Intake Phase.
