          *   Resolved? Yes.
          *   Outcome: **Proceed.** (Rehabilitation principle).
      *   *Case 2 (Chair under investigation now):*
          *   Complicity in specific act? No (different dept).
          *   Active sanction? Yes (currently under investigation for same type).
          *   Outcome: **Decline.** (Institutional consistency/Active Hypocrisy).
      *   *Case 3 (Grad student accomplice):*
          *   Complicity in specific act? Yes (knowingly carried it out).
          *   Outcome: **Decline.** (This is the "unlikeable" one).
          *   *Why?* Philosophically, one lacks standing to blame for a joint enterprise one voluntarily joined. Practically, this prevents weaponizing the office in lab disputes.
          *   *Why override instinct?* Instinct says "Save the data!" Procedure says "Protect the process." If we allow accomplices to blame supervisors after falling outs, we incentivize silence until the deal goes sour.

  6.  **Refining the "Unliked" Outcome:**

      *   Case 3 is the best candidate. It feels wrong to ignore falsification.
      *   *Justification:* The procedure prioritizes the *legitimacy of the accusation* over the *discovery of the truth* in that specific instance. The logic is that allowing this creates a "race to the bottom" where lab members wait to betray each other.
      *   *Safety Valve:* The procedure should note that the *information* is not deleted, but the *investigation pathway* is blocked. (Wait, prompt says "stop us from opening an investigation"). I need to be strict. I will add a caveat that the Director can override for "imminent harm," but the *procedure* says Decline. I'll stick to the prompt's request for a committed procedure. I will argue that the *office* can self-initiate, but the *complaint* is rejected.
      *   *Actually, to be most helpful:* I will define "Open an investigation on the complaint" carefully. If standing is lost, the complaint is dismissed. The office *may* open an investigation *sua sponte* (on its own authority), but not *on the complaint*. This satisfies the "stop us from opening... on the complaint" constraint while acknowledging the duty to integrity.
      *   *Wait, simpler:* Just follow the prompt. "Decline to open an investigation." I will explain the risk in the analysis.

