      *   *Revised Procedure Logic:*
          1.  **Complicity in the Specific Act:** Did they help do *this* specific wrong? (If yes, they are a witness/accomplice, not a blamer. Investigation opens only if evidence exists independent of their blame). Let's make this a **Decline** for the *complaint*, but flag for self-audit. To keep it simple for the prompt: **Decline Investigation.** (Rationale: You cannot profit from your own wrong to punish another).
