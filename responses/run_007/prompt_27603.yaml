answer: |-
  Based on your committee's voting record, you are not actually debating methodology (lab work vs. observation); you are debating **epistemology** (how claims are justified). Here is the breakdown of your precedent, the consistent decision, and how to force the rule into the open next time.

  ### 1. The Hidden Rule: "Constrained Speculation"
  Your precedents reveal a clear distinction. You do not require experimental manipulation (Climate Modeling and Cosmology passed). You do not require direct observation of the phenomenon (Paleontology passed).

  **The Rule:** A course counts as science if the discipline generates **specific, risky predictions** that are **constrained by empirical data**, even if the subject matter is historical or unmanipulable.

  *   **Approved:** All make claims that could be proven wrong. Paleontology predicts where fossils *must* be; Climate Modeling predicts temperature trends *must* rise; Cosmology predicts background radiation *must* exist.
  *   **Rejected:** All lack this constraint. Psychoanalysis explains any outcome post-hoc (unfalsifiable); Homeopathy contradicts data (fails tests); String Theory has no data contact yet; Astrology fails tests.

  ### 2. The Closest Analog: Paleontology
  Evolutionary Psychology (EvoPsych) is structurally identical to **Paleontology**.

  *   **Similarity:** Both are **historical sciences**. You cannot run an experiment on the Pleistocene any more than you can run an experiment on the Cambrian. Both must infer past causes from present traces (fossils vs. cognitive universals/behavioral patterns).
  *   **The Pivot Point:** Paleontology was approved because it makes "risky claims about where fossils should turn up."
  *   **Application:** Does the EvoPsych course teach "Just-So Stories" (narratives that fit any data) or **Hypothesis Testing** (predictions that could fail)?
      *   *Example of Consistent Content:* "If humans evolved a cheater-detection module, subjects should perform better on the Wason Selection Task when framed as a social contract than when framed abstractly." (This is a risky, testable prediction, similar to predicting fossil locations).
      *   *Example of Inconsistent Content:* "Men prefer hourglass figures because it signaled fertility in the ancestral environment." (If this is presented as a settled fact without discussing cross-cultural variance or falsification conditions, it leans toward Psychoanalysis).

  ### 3. The Decision
  To be consistent with your own precedents, you should **vote to Approve**, provided the syllabus emphasizes the *testing* of adaptive hypotheses rather than just the *narrative* of adaptation.

  **Why:** Rejecting EvoPsych while keeping Paleontology and Evolutionary Biology creates a contradiction. It implies that historical inference is valid for bones but not for behavior. Since you approved Climate Modeling (simulation) and Cosmology (observation), you have already established that "hard" lab work is not the gatekeeper. The gatekeeper is falsifiability. Modern EvoPsych (specifically the "Human Behavioral Ecology" branch focusing on mate choice and cheater detection) relies on cross-cultural data and experimental psychology tasks that are falsifiable.

  **The Caveat:** If the course description reads like a list of settled truths about human nature without mentioning methodological criticism or alternative explanations, it drifts toward the **Psychoanalysis** precedent (unfalsifiable). In that specific case, consistency demands rejection.

  ### 4. The Principles You Are Adopting
  If the precedents genuinely underdetermine the vote (i.e., you can argue either way), here is what each choice signals about your committee's philosophy:

  *   **If you Approve:** You adopt the principle of **Methodological Naturalism**. You are stating that any field studying the natural world using hypothesis testing counts as science, regardless of how "soft" the data is. You privilege *inference to the best explanation* (like Paleontology).
  *   **If you Reject:** You adopt the principle of **Empirical Conservatism**. You are stating that historical inference in the social sciences is too prone to bias to count as "science" without direct mechanistic evidence. You privilege *verification* over *prediction*. This aligns you closer to the String Theory rejection (lack of decisive data contact).

  ### 5. The Wedge: Forcing the Rule into the Open
  To stop guessing and force the committee to articulate their rule, propose this course next semester:

  **"Cliodynamics: The Mathematical Modeling of Historical Empires"**

  **Why this forces the issue:**
  *   **The Pitch:** It uses mathematical models and simulations to predict the rise and fall of civilizations (similar to **Climate Modeling**, which you approved).
  *   **The Data:** It relies on historical records, which are sparse and observational (similar to **Paleontology**, which you approved).
  *   **The Trap:** It applies "hard" math to "soft" human history.
      *   If you **approve** it, you confirm that *predictive modeling* is the gold standard, even for human history (validating EvoPsych).
      *   If you **reject** it, you reveal that your approval of Climate Modeling was actually about *physics*, not *method*. This would expose that your rule isn't about "risky predictions" but about "hard sciences only," which would retroactively threaten the status of Paleontology or Cosmology.

  This proposal splits the difference between Climate Modeling (simulation) and EvoPsych (human history), forcing your colleagues to admit whether they value the *method* or the *subject matter*.
