  The user is asking me to create a field-audit decision procedure for aquaculture welfare certification that operationalizes a precautionary approach under sentience uncertainty. This is a complex task that requires balancing:

  1. Scientific uncertainty about sentience across different species (salmon, trout, sea bass, shrimp, tilapia)
  2. Practical usability for auditors without philosophy backgrounds
  3. Defensibility when challenged by various stakeholders (industry, NGOs, retailers)
  4. Time constraints (2 hours for welfare-specific portion)
  5. High stakes (certification affects market access and livelihoods)

  Let me think through the key philosophical and practical considerations:

  **Precautionary Principle Under Sentience Uncertainty:**
  - When we're uncertain whether a species can suffer, the precautionary principle suggests we should act as if they can suffer rather than risk causing unrecognized suffering
  - This doesn't mean we treat all species identically - we can weight concerns by the strength of evidence
  - The principle commits auditors to: (1) avoiding clear harm indicators regardless of sentience status, (2) applying stricter standards where sentience evidence is stronger, (3) flagging genuine uncertainty rather than pretending it doesn't exist

  **Welfare Indicators Across Fish-Crustacean Divide:**
  - Robust indicators: mortality rates, visible injury/damage, abnormal behavior patterns, response to noxious stimuli, growth rates relative to expected
  - Problematic indicators: some behavioral measures may have different meanings across taxa, some physiological stress markers aren't validated for all species
  - Shrimp present particular challenges - less behavioral complexity observable, different nervous system organization

  **Where to Escalate to Judgment:**
  - When indicators conflict (e.g., good water quality but abnormal behavior)
  - When species-specific science is genuinely unsettled
  - When farm conditions fall in gray zones between clear pass/fail thresholds
  - When novel situations arise that the procedure doesn't cover

  **Philosophical Assumptions to Make Explicit:**


  - Nociception alone doesn't establish conscious suffering, but it's a necessary precondition worth treating seriously
  - Behavioral indicators of avoidance and learned responses suggest welfare matters to the animal itself
  - We can assess welfare outcomes without resolving the hard problem of consciousness
  - The precautionary approach means erring toward protection when evidence is ambiguous

