  2.  **Deconstruct the Debate (EMT vs. Intracranialism):**
      *   *EMT Core:* Cognitive processes can extend beyond the brain into the environment (notebooks, phones). The Parity Principle is key. Coupling can be constitution.
      *   *Intracranialist Core:* Cognition is brain-bound. External tools are causally coupled but not constitutive. The "Coupling-Constitution Fallacy" is the main objection.
      *   *Common Ground:* Both accept functionalism to some degree (usually), both accept the importance of environment for *causing* cognition, both accept Otto/Inga cases are the central battleground.
      *   *Key Friction Points:* What counts as a "mark of the cognitive"? What is the relevant notion of "constitution"? Is the parity principle valid?

  3.  **Drafting Section 1: Agreed Claims:**
      *   Need to avoid trivialities like "Brains are important."
      *   Need substantive metaphysical/methodological agreement.
      *   *Idea 1:* Causal coupling is necessary for extension (both agree environment matters causally).
      *   *Idea 2:* The definition of "cognitive" is the battleground, not the existence of the phenomena (both agree Otto remembers, just disagree where the memory *is*).
      *   *Idea 3:* Clark & Chalmers don't claim *everything* is cognitive (no panpsychism/pancognitivism).
      *   *Idea 4:* Intracranialists aren't Cartesian dualists (they agree embodiment matters, just not extension).
      *   *Idea 5:* The Parity Principle is the methodological engine, even if one side rejects its conclusion.

  4.  **Drafting Section 2: Disagreements Table:**
      *   Need specific rows.
      *   *Row 1: The Coupling-Constitution Distinction.* EMT says coupling *can* yield constitution. Intra says coupling is distinct from constitution.
      *   *Row 2: The Parity Principle.* EMT says it's a valid inference rule. Intra says it's category mistake or ignores intrinsic properties.
      *   *Row 3: Marks of the Cognitive.* EMT says functional role is sufficient. Intra says intrinsic neural properties or specific boundaries are necessary.
      *   *Row 4: Explanatory Utility.* EMT says extension simplifies explanation. Intra says it complicates/obscures scientific individuation.

  5.  **Drafting Section 3 & 4: Cruxes and Test Cases:**
      *   *Crux 1:* What makes a process cognitive? (Functional role vs. Vehicle).
      *   *Test Case:* Otto's Notebook vs. Inga's Memory.
      *   *Prediction:* EMT says identical functional role = identical cognitive status. Intra says neural implementation matters.
      *   *Crux 2:* Trust and Glottability (Otto conditions).
      *   *Test Case:* A case where the tool is reliable but not trusted, or trusted but unreliable.
      *   *Crux 3:* Scientific Practice.
      *   *Test Case:* How neuroscientists actually individuate tasks. Do they include the notebook in the scan analysis?

  6.  **Drafting Section 5: Verbal Dispute Analysis:**
      *   This is crucial. Is it just about the word "cognitive"?
      *   *Analysis:* Often, EMT means "cognitive system" (functional unit), Intra means "cognitive vehicle" (biological substrate). If they define "cognitive" differently, they might agree on the facts but disagree on the label.
      *   *However:* It's not *merely* verbal because it affects explanatory practices (where to look for mechanisms).
      *   *Verdict:* Partially verbal, but with real metaphysical/explanatory consequences.

  7.  **Drafting Section 6: Symmetry Check:**
      *   The prompt asks me to say if one side is on stronger ground.
      *   *Current Philosophical Consensus:* The "Coupling-Constitution Fallacy" (Adams & Aizawa) is a strong objection. EMT has evolved (Active Externalism, Predictive Processing) to address this.
      *   *Assessment:* Intracranialists have the easier job (defending the status quo of neuroscience). EMT has the burden of proof regarding constitution. However, EMT often wins on *explanatory utility*.
      *   *Decision:* I will note that the Intracranialist position aligns better with current neuroscientific individuation, while EMT aligns better with certain functionalist intuitions. I won't declare a winner, but I will highlight the burden of proof asymmetry.

  8.  **Review and Refine:**
