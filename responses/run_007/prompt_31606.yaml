answer: |-
  # ADVERSARIAL COLLABORATION DRAFT: THE BOUNDARIES OF COGNITION
  **Working Title:** *Constitution vs. Coupling: A Joint Statement on the Extended Mind*
  **Date:** October 26, 2023
  **Parties:** The Extended Mind Proponents (EMP) & The Internalist/Critical Camp (ICC)

  ---

  ## I. AGREED CLAIMS
  *Both parties endorse the following substantive claims. These are not merely methodological pleasantries but metaphysical and exegetical commitments required to frame the dispute.*

  1.  **Causal Interaction is Undisputed:** Both sides agree that extra-neural resources (notebooks, smartphones, other people) play a crucial *causal* role in the production of intelligent behavior. The dispute is not about whether the environment matters, but about the *ontological status* of that contribution.
  2.  **No Pan-Cognitivism:** Both sides agree that Clark and Chalmers (1998) do not argue that *all* external interactions are cognitive. There is a boundary; the disagreement is about *where* that boundary is drawn and *what principle* determines its location.
  3.  **The Otto/Inga Intuition Pump:** Both sides accept the Otto (notebook) and Inga (biological memory) cases as the central testing ground. Both agree Otto retrieves the location of MoMA successfully in both scenarios. The disagreement is about whether the *process* of retrieval is identical in kind.
  4.  **Functionalism as Common Ground:** Both sides operate within a broadly functionalist framework regarding mental states. The ICC does not argue for a substance dualism or a biological chauvinism that rules out silicon minds in principle; they argue that *this* specific functional organization requires a specific physical boundary.
  5.  **Explanatory Goals:** Both sides agree that the primary goal of defining "cognitive" is to carve nature at its joints for the purpose of scientific explanation. A definition that renders cognitive science impossible or trivial is to be rejected by both.
  6.  **The Parity Principle is Central:** Both sides agree that the Parity Principle ("If, as we confront some task, a part of the world functions as a process which, *were it done in the head*, we would have no hesitation in recognizing as part of the cognitive process, then that part of the world *is* (so we claim) part of the cognitive process") is the engine of the EMP argument. The ICC does not ignore it; they reject its validity as an inference rule.

  ---

  ## II. DISAGREEMENTS TABLE

  | # | Point of Disagreement | EMP Position (Extended) | ICC Position (Internalist) |
  | :--- | :--- | :--- | :--- |
  | **1** | **The Coupling-Constitution Distinction** | Causal coupling, when sufficiently reliable, integrated, and accessible, can *constitute* a cognitive process. The distinction is not a hard barrier. | Causal coupling is categorically distinct from constitution. Relying on a tool is not the same as *being* the tool. To conflate them is the "Coupling-Constitution Fallacy." |
  | **2** | **The Validity of the Parity Principle** | The Parity Principle is a valid methodological rule. Intrinsic physical differences (neural vs. ink) are irrelevant if the functional role is identical. | The Parity Principle ignores intrinsic properties that are essential to cognition. Neural processing has intrinsic features (e.g., plasticity, phenomenology) that notebooks lack, making the comparison invalid. |
  | **3** | **The "Mark of the Cognitive"** | Cognitive processes are individuated by their *functional role* in guiding action, regardless of the substrate's location. | Cognitive processes are individuated by specific *intracranial mechanisms* (e.g., non-derived content, specific neural architectures). |
  | **4** | **Explanatory Utility** | Extending the cognitive boundary simplifies explanation by treating the agent-tool system as a single unit of analysis. | Extending the boundary complicates explanation by making the object of study (the mind) spatially indeterminate and variable across individuals. |

  ---

  ## III. CRUXES AND TEST CASES

  *For each disagreement, we identify the specific sub-question that, if settled, would resolve the dispute, and a concrete case bearing on it.*

  ### Row 1: Coupling vs. Constitution
  *   **The Crux:** Is there a principled metaphysical difference between a process being *reliably caused by* X and a process *consisting of* X?
  *   **Test Case:** **The "Trust and Glottability" Manipulation.**
      *   *Scenario:* Otto uses a notebook. In Case A, the notebook is hacked by a benign AI that corrects his errors before he looks (high reliability, low access). In Case B, Otto uses a neural implant that requires a conscious "save" command (low reliability due to user error, high access).
      *   **EMP Prediction:** Case B is more cognitive than Case A, because integration/access matters more than mere causal reliability. If the implant is inside the skull but less integrated, it's less "mine" than the trusted notebook.
      *   **ICC Prediction:** Case B is cognitive regardless of integration because it involves direct neural interfacing. Case A is merely causal coupling regardless of reliability.
      *   **Adjudication:** If neuroscientists treat the AI in Case A as part of the cognitive system in their models, EMP gains ground. If they treat it as noise/input, ICC gains ground.

  ### Row 2: The Parity Principle
  *   **The Crux:** Do intrinsic physical properties matter for cognitive individuation, or is functional role exhaustive?
  *   **Test Case:** **The "Slow Otto" Thought Experiment.**
      *   *Scenario:* Otto's notebook retrieval takes 10 seconds. Inga's biological retrieval takes 200 milliseconds. To satisfy Parity, EMP must argue speed is irrelevant to *kind*.
      *   **EMP Prediction:** Speed is a performance variable, not a competence variable. If the functional logic is the same, they are the same kind of process.
      *   **ICC Prediction:** The temporal dynamics are constitutive of neural computation. A process that operates on a 10-second loop cannot be the same *kind* of cognitive process as a 200ms neural spike train.
      *   **Adjudication:** Empirical data on real-time cognitive constraints. If cognitive science requires real-time constraints to define "processing," ICC wins. If cognitive science abstracts away from time (classical computationalism), EMP wins.

  ### Row 3: The Mark of the Cognitive
  *   **The Crux:** Is "cognitive" a natural kind or a pragmatic label?
  *   **Test Case:** **Scientific Individuation in Neuroscience.**
      *   *Scenario:* Analyzing fMRI data of a pilot flying a plane.
      *   **EMP Prediction:** The best explanatory model will treat the cockpit instruments as variables in the cognitive equation. Excluding them reduces predictive power.
      *   **ICC Prediction:** The best explanatory model will treat the instruments as input parameters to the brain. Including them in the "cognitive" variable obscures the neural mechanism.
      *   **Adjudication:** Review of actual modeling practices in cognitive neuroscience and human factors engineering. Which methodology yields better predictive models?

  ---

  ## IV. IS THIS MERELY VERBAL?

  *Facilitator's Analysis on Terminology*

  There is a significant verbal component to this dispute, specifically regarding the word **"Cognitive."**

  1.  **The "Cognitive" Label:** The ICC tends to use "cognitive" to mean *"processes realized by neural tissue that carry non-derived content."* The EMP tends to use "cognitive" to mean *"processes that play the functional role of belief/desire/reasoning in the guidance of action."*
      *   *Verdict:* If the dispute is solely about which definition gets the label "cognitive," it is verbal. However, because the definition dictates where researchers look for mechanisms (inside the skull vs. the whole system), it has non-verbal consequences.
  2.  **The "Constitution" Label:** The EMP uses "constitution" in a functionalist sense (what makes it the thing it does). The ICC uses "constitution" in a mereological/material sense (what stuff it is made of).
      *   *Verdict:* This is not merely verbal. It is a clash between **Functionalism** (EMP) and **Mechanistic/Constitutive Explanations** (ICC).
  3.  **Recommendation:** The group should stop asking "Is the notebook *really* part of the mind?" and start asking "Does modeling the notebook as part of the cognitive system yield better scientific predictions than modeling it as an external cause?" If the answer is empirical, the metaphysical label matters less.

  ---

  ## V. FACILITATOR'S NOTE ON SYMMETRY

  *Addressing the prompt's request regarding false symmetry.*

  While the document above is structured to treat both sides as equal partners in a collaboration, **the philosophical burden of proof is not symmetrical.**

  1.  **The Default Position:** The ICC position aligns with the current individuation practices of neuroscience. Brains are spatially bounded; notebooks are not. To argue for extension, the EMP carries the burden of proving why the skull is not a relevant boundary. The ICC does not need to prove the skull *is* the boundary; they only need to show that the EMP has not given sufficient reason to erase it.
  2.  **The Coupling-Constitution Fallacy:** The ICC's primary objection (articulated by Adams & Aizawa) is logically robust. Just because A causes B does not mean A is part of B (e.g., glasses cause seeing, but glasses are not part of the visual cortex). The EMP must show why cognition is a special case where coupling *does* imply constitution.
  3.  **The EMP's Strongest Ground:** The EMP is on stronger ground regarding **explanatory utility in specific contexts** (e.g., distributed cognition in teams, human-computer interaction). They are on weaker ground regarding **metaphysical necessity**.
  4.  **Conclusion on Symmetry:** The collaboration should not pretend the metaphysical claims are equally supported. The ICC has the stronger metaphysical case (the skull is a clear boundary); the EMP has the stronger pragmatic case (sometimes ignoring the boundary helps explanation). The document should reflect that the dispute may be less about *what the mind is* and more about *how we choose to model it*.

  ---

  ### INSTRUCTIONS FOR THE READING GROUP
  1.  **Sign-off:** All members must sign Section I. If you cannot sign a claim, propose a revision.
  2.  **Selection:** Pick **one** row from the Disagreements Table to focus on for the next month. Do not try to solve all four.
  3.  **Evidence:** For the chosen row, bring empirical papers or formal arguments that address the specific "Test Case" listed, not general theory.
  4.  **Verbal Check:** At the end of each session, spend 10 minutes asking: "Are we disagreeing about facts, or just how we use the word 'constitute'?"
