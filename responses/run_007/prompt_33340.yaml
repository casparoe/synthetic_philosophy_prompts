      *   *Constraint:* We can only treat Patient 1 OR Patients 2-N.
      *   *Wait, check logic:* If we treat Patient 1, Patients 2-N suffer. If we treat Patients 2-N, Patient 1 suffers.
      *   *CNU:* Compare Agony vs. Sum(Ache). If Sum(Ache) > Agony, CNU treats Patients 2-N (lets Patient 1 suffer). Total suffering = Agony.
