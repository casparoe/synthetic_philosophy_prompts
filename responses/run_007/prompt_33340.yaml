      *   **Lexical-Threshold Negative Utilitarianism (LTNU):** There is a threshold $T$. Any suffering $s > T$ lexically outweighs any amount of suffering $s < T$.
          *   Priority 1: Minimize instances/amount of suffering above $T$.
          *   Priority 2: Minimize sum of suffering below $T$.
