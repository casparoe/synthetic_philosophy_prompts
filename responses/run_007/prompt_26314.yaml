answer: |-
  The coffee steams exactly how I like.
  I solved the case amidst the nervous clap.
  No jagged edge remains to cut or strike,
  I rest my head within her quiet lap.
  I carve the wood with blades I held myself,
  The music rises when I make a start.
  No books remain unread upon the shelf,
  In time with every beat inside my heart.

  Yet yesterday I reached to turn the page,
  The ink was dry before my fingers touched.
  I never bruise, no matter how I rage,
  And nothing ever costs or hurts too much.
  I know the grain I shaped was never real,
  But truth is cold compared to how I feel.
