      *   **Tone:** Empathetic, intellectually rigorous, clarifying, and reassuring. The user is experiencing a form of philosophical vertigo.

  2.  **Deconstruct the Argument (The Boltzmann Brain Paradox):**
      *   (1) Physics allows BBs in de Sitter space (True in standard QFT in curved spacetime).
      *   (2) BBs outnumber Ordinary Observers (OOs) over infinite time (True in eternal de Sitter).
      *   (3) Random selection implies we are likely BBs (The "Reference Class" problem).
      *   (4) Model predicts we are BBs (Cognitive Instability).
      *   (5) BBs have unreliable evidence (Self-undermining).
