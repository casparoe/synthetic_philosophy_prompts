      *   *Proposed Principle:* **The Calibrated Defeater Principle.** Higher-order evidence mandates confidence reduction proportional to the reliability threat posed to the *specific cognitive process* used, *unless* the agent has independent access to the soundness of that process (first-order check) that outweighs the statistical threat, *except* when the HOE indicates a global impairment (sleep) or peer-level dissent.
