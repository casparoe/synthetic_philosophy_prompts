      *   *Principle:* **The Calibrated Defeater with Diachronic and Modular Exceptions.**
      *   *Simpler:* **The Context-Sensitive Defeater Principle.** HOE mandates revision when it indicates a significant likelihood of error in the *current* reasoning process that cannot be ruled out by immediate first-order inspection, *unless* the belief is based on (a) trusted past deliberation where current access is lost, or (b) modular perceptual outputs. Motivational misalignment is always irrational.
