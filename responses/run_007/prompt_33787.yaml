      *   *Case 5 (Müller-Lyer):* Belief (lines equal) + HOE (vision misleading) $\rightarrow$ Rational. (Permissible Akrasia/Modularity of Mind).
      *   *Case 6 (Wishful thinking):* Belief (faithful) + HOE (evidence supports unfaithful) $\rightarrow$ Irrational. (Impermissible Akrasia).
