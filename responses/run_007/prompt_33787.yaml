prompt: |-
  I'm a student in an upper-level undergraduate epistemology seminar, and we've been working through the higher-order evidence literature — Christensen, Kelly, Titelbaum, Horowitz, Schechter, the whole set. I'm trying to get clear on what I actually think by running through cases, and the pattern is messier than I expected. I'd like someone to work through these systematically and tell me what principle best captures my verdicts, where I might have to give something up, and what that principle says about a case I'm still stuck on.

  Here are my cases and verdicts:

  1. **Sleep-deprived diagnosis.** A physician has been awake for 30 hours. She carefully reviews a patient's chart, lab results, and imaging, and concludes the patient has meningitis. She's confident in her reasoning. Then a nurse tells her she's been awake for 30 hours. She still cannot locate any flaw in her reasoning, but she now has higher-order evidence that her cognitive faculties are impaired. **Verdict:** She should reduce her confidence in the meningitis diagnosis — not abandon it, but downgrade significantly.

  2. **Peer disagreement about a proof.** You and a colleague are evaluating a formal proof. You both have PhDs in mathematics and are equally competent. You think the proof is valid; they think it contains a subtle error. You each explain your reasoning, and neither can find a flaw in the other's. **Verdict:** You should reduce your confidence substantially — possibly even suspend judgment.

  3. **Personality-based bias.** You've concluded, after months of study, that a particular economic policy is optimal. You then learn that people with your personality profile — high in need for closure, say — are systematically overconfident about policy predictions and tend to overlook disconfirming evidence. You re-examine your reasoning and still cannot find an error. **Verdict:** You should reduce your confidence, but less than in the sleep-deprivation case. The bias is statistical, not a guarantee that you've erred on this occasion.

  4. **Forgotten reason.** You're in a meeting and you remember that last week you carefully deliberated and concluded that the company should enter the Brazilian market. You cannot recall the specific arguments, but you trust your past self. A colleague now presents a plausible-sounding case against entering Brazil. **Verdict:** You are permitted to maintain your belief. Your past self's conclusion gives you higher-order evidence that there is a good argument, even if you cannot produce it right now.

  5. **Müller-Lyer illusion.** You know the two lines are equal in length; you have measured them. Yet they still look unequal. You believe, at the first order, that the lines are equal, while also believing, at the higher order, that your visual system is systematically misleading you about their relative length. **Verdict:** This is perfectly rational. There is nothing akratic about it.

  6. **Wishful thinking.** You recognize that the evidence supports the conclusion that your partner is being unfaithful. But you find that you cannot bring yourself to believe it — you believe they are faithful, and you know this belief is driven by wishful thinking, not by the evidence. **Verdict:** This is irrational. Genuine epistemic akrasia — believing P while believing your evidence does not support P — is a normative failure.

  7. **The case I cannot settle.** You have concluded that your friend did not betray your confidence. You have reviewed the evidence carefully. Then you learn that people are systematically biased toward exonerating friends in trust-betrayal scenarios, a well-documented effect. You go back and re-examine your reasoning, and you still cannot find the specific error. You now have higher-order evidence that your reasoning was probably biased. But you also have the first-order experience of having checked and found nothing wrong. **Verdict:** I go back and forth. Sometimes I think you must reduce confidence — the higher-order evidence is real. Other times I think it would be irrational to reduce confidence in a conclusion whose supporting reasoning you have double-checked and found sound, because that would require you to adopt a stance toward your own reasoning that you cannot justify from the inside.

  I want to know: is there a coherent principle — or a small set of principles — that captures verdicts 1 through 6 and resolves 7? If not, which verdicts should I overturn?

  Please structure your response as a JSON object with the following schema:

  - **candidate_principle**: a precise statement of the principle that best captures my verdicts.
  - **alternative_principle**: if there is a second candidate that does almost as well but overturns different verdicts, state it here; otherwise null.
  - **case_verdicts**: an array of objects, one per case (1–7), each with fields:
    - *case_id* (number),
    - *verdict* (one of "preserved", "overturned", or "modified"),
    - *explanation* (a short justification of the verdict under the candidate principle).
  - **tension_analysis**: a brief explanation of what makes case 7 hard — what feature of higher-order evidence it exposes that the other cases do not.
  - **recommended_verdict_for_case_7**: what the candidate principle says about case 7, and whether I should accept that verdict or revisit the principle.
  - **further_test_cases**: an array of one or two new cases the principle predicts verdicts for, which I have not considered, each with fields:
    - *case_description*,
    - *predicted_verdict*,
    - *rationale*.
