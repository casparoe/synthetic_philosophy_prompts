      *   *Best Fit Principle:* **The Reliability-Weighted Total Evidence View.** Rational confidence is determined by the total evidence, where higher-order evidence regarding cognitive reliability functions as a defeater proportional to the strength of the reliability threat, *except* when the belief is sustained by a modular perceptual state (Müller-Lyer) or diachronic trust in past rational deliberation (Forgotten Reason). Akrasia is impermissible only when the misalignment is due to non-epistemic motives (Wishful Thinking).
