      *   *Let's focus on Case 7:* The tension is between "I checked and it looks fine" vs. "People like me get this wrong."
      *   *Candidate Principle:* **The Unscreened Defeater Principle.** Higher-order evidence mandates confidence reduction when it indicates a systematic bias or impairment that the agent cannot *independently screen off* via first-order scrutiny.
