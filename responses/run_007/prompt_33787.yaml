      *   *Observation:* Case 3 suggests the *strength* of HOE matters (guaranteed impairment vs. statistical tendency).
      *   *Observation:* Case 4 suggests that *past rational deliberation* acts as a buffer against new HOE/counter-evidence if the reasoning isn't accessible but the *fact* of deliberation is trusted.
      *   *Core Tension:* Case 7 pits the "Bias HOE" (like Case 3) against the "Checked Reasoning" (like Case 1/2 where no flaw was found, but HOE still defeated). In Case 1, she checked and found no flaw, but HOE defeated. In Case 4, she checked (past) and found no flaw (implicitly), and HOE (colleague) didn't defeat.
