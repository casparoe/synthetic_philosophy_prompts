prompt: |-
  Two people in my philosophy of math seminar got into it after the session on Skolem's paradox, and I still can't sort out who was right. Leah said the upshot is that "uncountable" doesn't really mean anything absolute—since ZFC has a countable model if it has any model at all, the real numbers are only uncountable from inside some model. Jon said no, the theorem doesn't show that; inside the countable model there's a set that satisfies "is uncountable," and all the theorem shows is that first-order logic can't force a theory to have only big models.

  Leah came back: if the bijection between that set and the naturals is missing from the model, what makes you so sure their isn't a bijection "missing" from our universe too? Then our uncountable sets would be countable from a wider standpoint, and we'd never know. Jon said that's a bad generalization: the countable model is a submodel with a stunted powerset, so of course it's missing functions; the real universe of sets isn't missing anything, it's the intended model.

  Leah: but you cant say what makes it the intended model in first-order terms, because exactly the same axioms hold in the stunted one. So "intended model" is just a way of refusing to take the relativity seriously. Jon: no, it's a way of saying the theorem is about descriptions, not about sets. The axioms underdetermine the universe, sure, but that's a fact about our language, not about whether there are uncountably many reals. Leah: if the language can't pin it down, what is the "fact about the universe" doing for you? At some point you're just insisting.

  They went around like this for twenty minutes and asked me to referee, and I honestly couldn't. Please go through the exchange move by move and say who's right about which specific point, where each of them overreaches or misstates the other's view, and what the actual upshot of Skolem's paradox is supposed to be.
