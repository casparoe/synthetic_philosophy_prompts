prompt: |-
  so I'm on my school's honor council and we have to vote by thursday on whether to give a junior our integrity commendation — the thing that goes on your transcript and shows up in college recs. here's the situation. she sent in an anonymous tip that busted a whole cheating ring: a bunch of kids were photographing the physics final answer key before the exam, and her tip was detailed enough that four of them got zeros and the ring fell apart. so far so good. but then somebody leaked her texts with her best friend, and it turns out she only reported after she found out one of the cheaters got named debate captain over her. most of the messages are just her ranting about losing the captain spot and hoping this person gets knocked down. there is exactly one message where she does say it's not fair to everyone who actually studied, so it's not like she had zero concern about the cheating itself. but the timing and the volume of the revenge stuff makes it look like the real reason she reported was that she was mad about the captain thing.

  now the council is split. our faculty advisor says the motive doesn't matter — a cheater got caught, the school is better off, and if we start trying to read peoples inner motives we'll never commend anyone, because nobodys motives are perfectly clean. another kid on the council says the whole point of the commendation is to recognize integrity, and someone who reports cheating mainly to punish a rival isn't showing integrity, she's just using the honor system as a weapon. like, she did the right thing, but did she do it for the right reasons, and does that matter for whether we should honor her for it?

  I need to circulate a short written memo to the rest of the council before the meeting recommending a concrete decision — give her the commendation, don't give it, or give it with some kind of caveat — and the memo has to honestly engage the strongest point on the losing side, not just pick a side and dismiss the other. what should I write?
