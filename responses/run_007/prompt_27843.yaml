      *   *Distinction:* In CM, the payoff in the counterfactual world is *logically dependent* on the decision in the actual world (same function). In XOR, the *message sending* was dependent, but the *termite state* was not. Once the message is received, the dependency on the message is gone (fixed). The dependency on termites never existed. In CM, the dependency on the payoff exists across the counterfactual divide because the payoff is defined by the simulation of the agent.
      *   *Simpler distinction for dialogue:* In CM, Omega simulates *you*. In XOR, Omega simulates *you plus the world*. The logical correlation in CM covers the payoff directly. In XOR, the correlation covers the *invitation*, not the *damage*. Paying the blackmail doesn't logically prevent the termites. Paying the mugger logically enables the reward in the other branch.

      *Let's refine the FDT XOR response:* FDT agents refuse XOR blackmail. Why? Because the predictor's action (sending the letter) is logically dependent on the agent's action, *but* the agent's action cannot logically influence the termite infestation. The loss comes from the termites, not the letter. In CM, the loss/gain comes directly from Omega's decision, which is logically dependent on the agent's decision. In XOR, the loss comes from Termites (independent). The letter is just news. Paying changes nothing about the termites. In CM, paying changes the simulation output in the heads world.
      *Actually, the most precise FDT argument:* In XOR, the predictor sends the letter iff (Termites XOR Pay). If you adopt "Pay", Letter <-> ~Termites. If you adopt "Don't", Letter <-> Termites. If you receive the letter, and you play "Pay", you know ~Termites. You lose $1k. If you play "Don't", you know Termites. You lose $1M. So it seems you should Pay? No, FDT says Refuse. The reasoning is that the logical correlation is not of the right kind to support the counterfactual "If I pay, the termites go away." They don't. The letter is already sent. The termites are already there or not. In CM, the $10k is *created* based on the prediction. In XOR, the damage is *independent*.
