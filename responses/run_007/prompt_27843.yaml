answer: |-
  **Alice (CDT):** Let's be precise about the causal graph, Bob. Omega has already tossed the coin. It landed tails. That event is in the past. The $10,000 in the heads branch is either there or it isn't, determined by a prediction made before the toss. My action now—handing over $100—cannot causally influence the coin toss. It cannot causally influence the past prediction. It cannot causally influence the contents of the heads branch. If I pay, I am down $100. If I refuse, I am down $0. Rationality is about choosing the act that maximizes expected utility via causal consequences. Here, the causal consequence of paying is purely negative.

  **Bob (FDT):** I agree that your action cannot *causally* influence the past. But rationality isn't about intervening on a causal graph at the node of "current action"; it's about selecting the output of your decision function. You and the Omega-simulation in the heads branch are instantiating the same algorithm. When you decide what to do here in the tails branch, you are effectively deciding what that simulation outputted in the heads branch. If your algorithm outputs "Pay," the simulation outputs "Pay," and Omega puts $10,000 in the heads box. If your algorithm outputs "Refuse," the simulation outputs "Refuse," and the heads box is empty. You aren't changing the past; you are selecting which logical possibility obtains across the multiverse of predictions.

  **Alice:** That sounds like magic, Bob. You're suggesting my hand moving now changes a box filled yesterday. I'm suggesting you're conflating correlation with control. Yes, there is a correlation between your payment and the $10,000, but it's a common-cause correlation mediated by Omega's prediction. Conditioning on the prediction screens off your action. Once we know Omega predicted "Refuse," the $10,000 is gone regardless of what you do now. You're paying for news, not outcomes.

  **Bob:** I'm not paying for news; I'm paying to make the policy "Pay when asked" the one that exists. Look at it ex-ante. Before the coin toss, you know the setup. Would you want to be the kind of agent who pays or the kind who refuses? If you commit to paying, you expect $4,950 (0.5 * $10,000 - 0.5 * $100). If you commit to refusing, you expect $0. A rational agent should want to be the type that gets the money. CDT forces you to be the type that gets nothing because it ignores the logical dependency between your current decision and the predictor's simulation.

  **Alice:** Ex-ante preferences don't dictate in-the-moment rationality. I can wish I had pre-committed, but I didn't. Now I'm here, tails is up, and paying is a dominated strategy. But let's test this "logical dependency" claim. Consider the XOR Blackmail case. A predictor sends you a letter iff exactly one of these is true: your house has termites (costing $1M) or you pay the blackmailer $1,000. You receive the letter. By your logic, since the predictor simulated you, your decision to pay is logically correlated with the sending of the letter. Should you pay?

  **Bob:** No. FDT refuses XOR blackmail.

  **Alice:** Exactly! So you admit logical correlation isn't enough. But then why is Counterfactual Mugging different? In both cases, a perfect predictor simulates you. In both cases, you receive a signal (the request or the letter) that is logically correlated with your action. If you refuse to pay the blackmailer because you can't logically influence the termites, you must refuse the mugger because you can't logically influence the coin toss.

  **Bob:** The structures are distinct. In XOR Blackmail, the *damage*—the termite infestation—is causally and logically independent of your decision procedure. The predictor's letter depends on (Termites XOR Action), but the termites themselves do not. Once you receive the letter, the sending event is fixed. Your action cannot logically influence whether the termites exist. You are merely choosing whether to lose $1,000 on top of the inevitable termite damage or just suffer the damage. In Counterfactual Mugging, the *payoff* itself is constituted by the prediction of your action. The $10,000 exists *because* the simulation of you paid. The dependency is direct between your algorithm and the reward. In XOR, the dependency is between your algorithm and the *message*, not the *loss*.

  **Alice:** So the distinction lies in whether the payoff is subjunctively dependent on the decision function?

  **Bob:** Precisely. In Counterfactual Mugging, the utility in the heads world is a function of your decision in the tails world because Omega computes *you*. In XOR Blackmail, the utility loss (termites) is a function of the world state, which Omega computes independently. My decision function controls the former across logical possibilities; it does not control the latter. Paying the mugger buys the reward in the counterfactual branch. Paying the blackmailer buys nothing but the privilege of having received the letter.

  **Alice:** I concede that the dependency structures differ. But I maintain that "controlling" a counterfactual branch isn't rational agency. Rationality is about navigating the actual world. If I pay you, I have less money in my pocket right now, and the world is exactly as it was regarding the coin. You're optimizing for a version of yourself that doesn't exist in this branch.

  **Bob:** And I'm optimizing for the version of me that exists across all branches where my algorithm runs. If I refuse, I betray the algorithm that would have secured the $10,000. I'd rather be the agent who is rich in the heads world and poor in the tails world than the agent who is poor in both.

  **Alice:** Then we agree on the math but disagree on the metaphysics of control. I'll keep my $100.

  **Bob:** And Omega will know why.

