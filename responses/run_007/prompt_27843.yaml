      *   **FDT Response:** In CM, Omega's payout is a function of *my* decision procedure. In XOR, the message is a function of (Termites + My Decision). Once I see the message, the Termites are fixed. My decision doesn't logically determine the Termites. In CM, the "Heads" world payoff is logically determined by my decision in the "Tails" world because Omega simulates *me*. In XOR, the predictor simulates the *conjunction*. The subjunctive dependence is screened off.

