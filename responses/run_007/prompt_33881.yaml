answer: |-
  The worst tension is between (1) and (6); you cannot consistently maintain that defection is uniquely rational in one-shot scenarios while asserting a realist moral obligation to cooperate in those same scenarios without fracturing your account of reasons for action.

  **Tensions Ordered by Severity**

  1.  **(1) vs. (6):** If defection is uniquely rational for self-interested agents (1), and moral obligations are genuine facts (6), you must explain why an agent should prioritize the moral fact over the rational prescription; if moral facts provide reasons, (1) is false, but if they don't, (6) loses its normative force.
      *   *Cheapest fix:* Adopt a Humean view where morality and rationality can diverge, accepting that one-shot cooperation is morally required but irrational.
  2.  **(3) vs. (6):** Your evolutionary story grounds cooperation in the shadow of the future (3), yet your moral claim insists on obligations where that shadow is absent (6), creating an evolutionary debunking pressure against the realism in (6).
      *   *Cheapest fix:* Argue that one-shot interactions are ecologically rare enough that the heuristic evolved for repeated games justifiably applies there too.
  3.  **(5) vs. (6):** Describing norms as functional devices for solving dilemmas (5) clashes with describing obligations as mind-independent facts (6), as devices are instrumental tools while facts are truth-apt descriptions.
      *   *Cheapest fix:* Reframe (5) to say norms are devices that *track* moral facts, rather than saying that is all they are.

  **Dissolved Tensions**

  *   **(4) vs. (5):** This looks like a conflict between individual-level mechanisms (kin/reciprocity) and group-level functions (norms), but it dissolves because indirect reciprocity among unrelated individuals can sustain norms without requiring contentious group-selection mechanisms.
  *   **(1) vs. (2):** These are consistent applications of standard game theory; the finite case simply extends the one-shot logic via backward induction without introducing new contradictions.

  **Single Revision Recommendation**

  Drop the moral realism in (6). If you revise (6) to treat one-shot obligations as internalized heuristics or useful fictions derived from the repeated-game logic in (3) and (5), your entire framework becomes a coherent naturalistic account where rationality, evolution, and normativity align without requiring queer moral facts that contradict instrumental reason.
