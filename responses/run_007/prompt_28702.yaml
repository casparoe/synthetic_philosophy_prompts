prompt: |-
  I'm working through a popular book on collective decision-making — the kind that moves from ant colonies to market forecasts in two hundred pages — and it gives a summary of Condorcet's jury theorem that felt suspiciously tidy. Reconstructing from memory, the passage runs roughly like this: "Condorcet proved mathematically that if you gather a group of people who are each more likely than not to answer a yes-or-no question correctly, then the majority will be more reliable than any individual member of the group, and as the group grows the probability that the majority is correct approaches certainty. That is the deep reason crowds are wise: for any binary decision, a large enough group will almost surely settle it correctly, which is why democratic votes, juries, and prediction markets deserve more trust than individual experts, and why a larger decision-making body is always an improvement over a smaller one."

  I can feel a slide happening somewhere between the formal theorem and the morals about experts and bigger groups, but I don't know the theorem well enough to locate it; my instinct is that the mathematics is probably fine and only the applications are loose, though I'm not sure even of that. I also have a vague memory that the result requires voters to be independent and each better than a coin flip, and I wonder what happens when those conditions fail, but the book doesn't say. Could you go through the summary sentence by sentence and tell me what a social choice theorist would accept, what they would insist on qualifying, and what is simply not a consequence of the theorem? Then say which of the book's two practical conclusions — that majority rule should be trusted over individual experts, and that larger bodies are always better — actually survive once the summary is corrected.
