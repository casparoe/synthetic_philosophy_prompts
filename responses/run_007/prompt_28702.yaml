answer: |-
  Your instinct is excellent. The passage you recalled is a classic example of "pop-mathematics": the core theorem is stated correctly enough to sound authoritative, but the necessary constraints are stripped away to allow for sweeping sociological conclusions that the math does not support.

  A social choice theorist would say the mathematics in the first sentence is *conditionally* correct, but the second sentence commits several category errors. The "slide" you feel happens precisely where the text moves from **epistemic conditions** (math requirements) to **institutional prescriptions** (real-world advice).

  Here is the sentence-by-sentence reconstruction of how a theorist would critique the summary, followed by an evaluation of the two practical conclusions.

  ### Sentence 1: The Mathematical Claim
  > *"Condorcet proved mathematically that if you gather a group of people who are each more likely than not to answer a yes-or-no question correctly, then the majority will be more reliable than any individual member of the group, and as the group grows the probability that the majority is correct approaches certainty."*

  **What a theorist accepts:**
  *   **The Competence Condition:** The clause "more likely than not... correctly" ($p > 0.5$) is essential and correctly stated.
  *   **The Asymptotic Result:** The claim that probability "approaches certainty" as the group grows is mathematically true *given the assumptions*.

  **What a theorist insists on qualifying:**
  *   **Independence:** This is the most glaring omission. The theorem requires voters to make their judgments *independently*. If voters copy each other, follow a charismatic leader, or are influenced by the same biased news source, the "wisdom" does not aggregate; errors correlate, and the group acts like a single person.
  *   **"Any Individual":** The theorem proves the majority is more likely to be correct than a *randomly selected* individual (or the average individual). It does **not** prove the majority is more reliable than the *most competent* individual in the group. If you have one expert with 99% accuracy and 1,000 novices with 51% accuracy, the expert may still outperform the majority depending on the specific distribution.

  **What is simply not a consequence:**
  *   **Binary Questions:** While the theorem applies to binary choices, it implicitly requires an **objective truth**. There must be a fact of the matter (e.g., "Is the defendant guilty?" or "Will this candidate win?"). It does not apply to questions of taste or value (e.g., "Should we lower taxes?"), where there is no "correct" answer to converge upon.

  ### Sentence 2: The Sociological Moral
  > *"That is the deep reason crowds are wise: for any binary decision, a large enough group will almost surely settle it correctly, which is why democratic votes, juries, and prediction markets deserve more trust than individual experts, and why a larger decision-making body is always an improvement over a smaller one."*

  **What a theorist accepts:**
  *   **None of this follows without the constraints from Sentence 1.**

  **What a theorist insists on qualifying:**
  *   **"For any binary decision":** A theorist would reject "any." As noted above, CJT is an *epistemic* theorem (about truth), not a *preference* aggregation theorem. If a crowd votes on a subjective preference, CJT is irrelevant. Furthermore, if the crowd is systematically biased ($p < 0.5$), the theorem proves the opposite: a larger crowd will almost surely be *wrong*.
  *   **"Prediction markets":** CJT is about voting, not markets. While related, prediction markets rely on different mechanisms (incentives, information revelation via prices) and are not direct instantiations of Condorcet's logic.

  **What is simply not a consequence:**
  *   **"Deserve more trust than individual experts":** This is the most dangerous slide. CJT compares the majority to the *average* voter. It does not compare the majority to a *high-competence expert*. If the average voter competence is 0.51, but the expert is 0.90, the expert is more trustworthy than the crowd. The theorem only guarantees the crowd beats the *average* member, not the *best* member.
  *   **"A larger decision-making body is always an improvement":** This is false on two counts. First, if average competence drops below 50% (which happens easily with complex technical questions), adding more people drives the probability of correctness to zero. Second, the theorem ignores **costs**. Even if a group of 10,000 is marginally more accurate than a group of 100, the transaction costs may make the larger group irrational.

  ---

  ### The Verdict on the Practical Conclusions

  You asked which of the book's two practical conclusions survive once the summary is corrected.

  #### 1. "Majority rule should be trusted over individual experts."
  **Verdict: Does Not Survive.**
  Condorcet's Jury Theorem does not prove that crowds beat experts. It proves that crowds beat *average individuals*.
  *   **The Correction:** A majority is more trustworthy than a *randomly selected* individual from that majority. If you have access to a genuine expert whose competence ($p$) is significantly higher than the average competence of the crowd, the expert is mathematically preferable to the vote.
  *   **The Nuance:** The crowd *can* beat the expert if the expert is only slightly better than average but the crowd is very large, or if the "expert" is overconfident and actually has lower competence than they claim. But the theorem provides no guarantee that the crowd beats the *best available mind*.

  #### 2. "Larger bodies are always an improvement over smaller ones."
  **Verdict: Definitely Does Not Survive.**
  This is the reverse of the truth if conditions aren't met.
  *   **The Competence Trap:** If the average voter competence is below 50% ($p < 0.5$)—which is likely if the question is highly technical and the voters are laypeople—Condorcet's theorem proves that **adding more voters makes the decision worse.** As $n \to \infty$, the probability of a correct majority vote approaches 0.
  *   **The Independence Trap:** If voters are not independent (e.g., they all watch the same news channel), increasing the group size adds no new information. A group of 1,000 correlated voters is not more accurate than a group of 10; it is just 1,000 people making the same mistake.
  *   **The Correction:** Larger bodies are an improvement *only if* voters are independent and average competence remains strictly above 50%. In real-world institutions, adding people often dilutes competence (free-riding, lower information acquisition), potentially pushing $p$ below the critical threshold.

  ### Summary of the "Slide"
  The book slides from **mathematical possibility** to **institutional necessity**.

  1.  **Math:** *If* independence and $p > 0.5$ hold, *then* large groups converge on truth.
  2.  **Slide:** The book assumes independence and $p > 0.5$ hold for *all* democratic/jury contexts.
  3.  **Moral:** Therefore, bigger groups and majority rules are inherently superior to experts.

  A social choice theorist would tell you that Condorcet's Jury Theorem is not an argument for democracy; it is a **warning**. It tells you that democracy only works if you can maintain voter independence and ensure the average voter is competent. If those conditions fail, the theorem mathematically guarantees that the crowd will be confidently wrong.
