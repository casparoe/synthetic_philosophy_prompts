prompt: |-
  I'm teaching The Tempest in a course on early modern moral philosophy, and I want to pair it with Montaigne's "Of Cannibals." The play is often read as borrowing from the essay, most obviously in Gonzalo's speech imagining a commonwealth without sovereignty, wealth, or labor, and in the way Caliban is used to test European ideas about savagery. But the fit seems uneasy: Montaigne's cannibals are presented as having their own virtues and a frankness that puts European cruelty to shame, while Caliban is treated by Prospero as fit only for servitude, and his attempt on Miranda is used to justify his subjection. I'd like a careful reading of the play through Montaigne's claim that custom governs what we call barbarous and that the supposedly civilized often outdo the savages in cruelty. Which scenes genuinely dramatize that claim, and which scenes pull against it? Does the play ultimately endorse Prospero's civilizing project, satirize it, or leave the two unreconciled? And what does the play add to Montaigne's argument by turning the essay into a drama of power, language, and dependence? I'd rather have a reading that honestly marks where the lens fails than one that forces the play to be an allegory of the essay.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** Teaching *The Tempest* in a course on Early Modern Moral Philosophy.
      *   **Pairing:** Shakespeare's *The Tempest* + Montaigne's "Of Cannibals."
      *   **Core Tension:** The fit is "uneasy." Montaigne elevates the "savage" (virtue, frankness, critique of European cruelty), while *The Tempest* seems to justify Caliban's enslavement (attempted rape, "brutish" nature).
      *   **Key Questions:**
          1.  Which scenes dramatize Montaigne's claim (custom governs barbarity, civilized = cruel)?
          2.  Which scenes pull against it?
          3.  Does the play endorse, satirize, or leave unreconciled Prospero's civilizing project?
          4.  What does the play *add* to Montaigne's argument (drama of power, language, dependence)?
      *   **Constraint:** "Honestly mark where the lens fails" (avoid forcing an allegory).

  2.  **Deconstruct the Source Materials:**
      *   **Montaigne ("Of Cannibals"):** Cultural relativism. "Barbarism" is a label we apply to what isn't our custom. Indigenous Brazilians (Tupinambá) have natural virtue, no commerce, no magistrates, no poverty/riches. European wars (religious wars) are worse than indigenous ritual cannibalism. Language is key (the word for "barbarian" means "foreign").
      *   **Shakespeare (*The Tempest*):** Colonial dynamics. Prospero (usurped Duke/Magician) vs. Caliban (Indigenous/Colonized). Gonzalo's utopia speech (directly lifts from Montaigne). Caliban's famous "This island's mine" speech. The attempted assault on Miranda. Prospero's "civilizing" education of Caliban (language given, then used to curse).

  3.  **Address Question 1: Scenes that Dramatize Montaigne's Claim:**
      *   *Gonzalo's Utopia (Act 2, Scene 1):* Direct borrowing. No sovereignty, no labor. It highlights the European desire for a prelapsarian state but is mocked by the courtiers (Antonio/Sebastian). This shows the *idea* of Montaigne exists in the play but is treated as impractical/foolish by the "civilized."
      *   *The Courtiers' Conspiracy (Act 2, Scene 1):* Antonio and Sebastian plotting murder while Gonzalo sleeps. This directly supports Montaigne's point: the "civilized" Europeans are the real barbarians (fratricide, regicide) compared to the "savages."
      *   *Caliban's "This Island's Mine" (Act 1, Scene 2):* Caliban articulates a claim of natural right/inheritance. Prospero's claim is based on power/magic, not natural law. This echoes Montaigne's critique of conquest.
      *   *Stephano/Trinculo vs. Caliban (Act 3, Scene 2):* The "civilized" servants exploit Caliban's worship. They are drunk, greedy, and plot murder. This mirrors the European corruption of the "natural."

  4.  **Address Question 2: Scenes that Pull Against Montaigne:**
      *   *The "Rape" Attempt (Act 1, Scene 2):* Prospero cites Caliban's attempt on Miranda's honor as the turning point from education to enslavement. Montaigne's cannibals have virtue/chastity (in their own way); Caliban is framed as having a "vile race" incapable of moral restraint. This essentializes Caliban in a way Montaigne avoids.
      *   *Caliban's Worship of Stephano (Act 2, Scene 2 / Act 3, Scene 2):* Caliban is easily duped by liquor. This plays into the "noble savage" trope's darker twin: the naive savage needing guidance. It undermines his political agency.
      *   *Prospero's Renunciation (Act 5):* Prospero chooses mercy over revenge. If the play endorses this Christian/Humanist forgiveness, it suggests hierarchy and authority (Prospero's) are necessary for order, contradicting Gonzalo's/Montaigne's stateless utopia.

  5.  **Address Question 3: Endorsement, Satire, or Unreconciled?**
      *   *Verdict:* Unreconciled/Ambivalent.
      *   *Reasoning:* The play gives voice to the critique (Caliban) but contains it within Prospero's narrative control. Prospero admits Caliban is "this thing of darkness I acknowledge mine." The colonial project is shown to be corrupt (Stephano/Trinculo) *and* necessary for order (Prospero). The play is more interested in the *psychology* of rule than the *ethics* of relativism.

  6.  **Address Question 4: What does the Play Add? (Drama of Power, Language, Dependence):**
      *   *Language:* Montaigne writes *about* language. Shakespeare *stages* it. Caliban: "You taught me language, and my profit on't / Is, I know how to curse." This adds the dimension of linguistic alienation. Language isn't just communication; it's a tool of domination and resistance.
      *   *Dependency:* Montaigne describes a society. Shakespeare shows a dyadic relationship (Master/Slave). It highlights the psychological cost of colonization on *both* sides (Prospero's obsession, Caliban's internalized inferiority).
      *   *Performance:* Caliban is performed by an actor. Is he a monster? A man? The audience's reaction becomes part of the "custom" defining barbarity.

  7.  **Synthesize and Structure the Response:**
      *   *Introduction:* Acknowledge the pedagogical value and the tension. Validate the user's hesitation about forcing the fit.
      *   *Section 1: Where the Lens Fits (Montaigne in the Play).* Focus on Gonzalo and the Courtiers' cruelty.
      *   *Section 2: Where the Lens Cracks (The Limits of Relativism).* Focus on Caliban's "nature" and the Miranda incident.
      *   *Section 3: The Verdict on Prospero's Project.* Ambivalence. The "thing of darkness."
      *   *Section 4: What Drama Adds to Philosophy.* Language, embodiment, affect.
      *   *Conclusion:* Teaching advice. How to frame this for students.

  8.  **Refine the Argument (Self-Correction during drafting):**
      *   *Correction:* Make sure not to say Caliban *is* a cannibal. He isn't explicitly described as eating people, but he is described as "savages." Keep the distinction clear.
      *   *Nuance:* Ensure I don't let Prospero off the hook. His "mercy" is still conditional on his power.
      *   *Emphasis:* Highlight the "curse" line. It's the strongest philosophical contribution Shakespeare makes to the Montaigne debate.
      *   *Tone:* Academic but accessible, suitable for a professor planning a course.

  9.  **Final Review against User Prompt:**
      *   Did I identify specific scenes? Yes (2.1, 1.2, 3.2).
      *   Did I address the "civilizing project"? Yes.
      *   Did I mark where the lens fails? Yes (Caliban's essentialism).
      *   Did I discuss what the play adds? Yes (Language/Power).

  10. **Drafting the Response.** (Proceed to generate output based on these points.)
answer: |-
  This is a rich and pedagogically fruitful pairing, but your hesitation is well-founded. Reading *The Tempest* strictly as a dramatization of "Of Cannibals" risks smoothing over the play's darker, more ambivalent engagement with colonialism and human nature. Montaigne offers a philosophical critique of ethnocentrism; Shakespeare offers a theatrical exploration of the *consequences* of contact.

  Here is a reading that respects the friction between the two texts, identifying where the play dramatizes Montaigne's relativism, where it retreats into essentialism, and what the shift from essay to drama contributes to the moral question.

  ### 1. Where the Lens Fits: The Barbarism of the Civilized
  There are specific moments where Shakespeare seems to be staging Montaigne's central thesis: that "barbarism" is a projection of custom, and that European "civility" often masks a deeper moral rot.

  **Gonzalo's Commonwealth (Act 2, Scene 1)**
  This is the most explicit link. Gonzalo's speech ("I' th' commonwealth I would by contraries / Execute all things") is a near-translation of Montaigne's description of the Tupinambá society (no commerce, no magistrates, no riches).
  *   **Montaignean Reading:** Gonzalo presents the "savage" state not as a deficit, but as a moral ideal.
  *   **The Dramatic Twist:** Crucially, Gonzalo is mocked by Antonio and Sebastian as a fool speaking "infinite matter." The play immediately undercuts the utopia. However, the mockery is ironic: the men laughing at Gonzalo are actively plotting regicide and fratricide moments later. The "fool" speaks the moral truth; the "witty" courtiers embody the true barbarism. This aligns perfectly with Montaigne's claim that European religious wars and betrayals are far more horrific than indigenous ritual violence.

  **The Conspiracy of the Courtiers (Act 2, Scene 1)**
  While Caliban is accused of savagery, the "civilized" nobles require no magic to turn to murder.
  *   **Montaignean Reading:** Montaigne argues we call things barbarous only because they are not in our own use. Here, Shakespeare shows that the "use" of European courts is treachery. Antonio's willingness to kill his sleeping brother (the Duke) to seize power demonstrates that the removal of "custom" (law/conscience) reveals a predatory nature in the European that rivals any beast.

  **Caliban's Claim to Sovereignty (Act 1, Scene 2)**
  When Caliban says, "This island's mine, by Sycorax my mother, / Which thou tak'st from me," he articulates a natural law argument that predates Prospero's arrival.
  *   **Montaignean Reading:** This echoes Montaigne's observation that indigenous peoples view their land as their own and view Europeans as invaders. Prospero's claim is based on magic and force (conquest), while Caliban's is based on inheritance and habitation. In a Montaignean framework, Prospero is the true usurper.

  ### 2. Where the Lens Cracks: The Limits of Relativism
  This is where your unease is most justified. Montaigne's essay is consistent in its cultural relativism; the play is inconsistent in its anthropology. Shakespeare pulls back from the full implications of Montaigne's argument, particularly regarding Caliban's "nature."

  **The Attempt on Miranda (Act 1, Scene 2)**
  Prospero justifies Caliban's enslavement not merely on conquest, but on moral incapacity: "I have used thee... with human care, and lodged thee / In mine own cell, till thou didst seek to violate / The honor of my child."
  *   **The Failure of the Lens:** Montaigne's cannibals possess virtue, including sexual mores appropriate to their culture. Caliban, however, is framed as having an intrinsic, biological inability to be civilized ("A devil, a born devil, on whose nature / Nurture can never stick"). By introducing the threat of sexual violence against a European woman, Shakespeare triggers a specific patriarchal anxiety that overrides the relativist argument. It allows the audience to accept Prospero's tyranny as "security." This essentializes Caliban in a way Montaigne refuses to essentialize the Brazilians.

  **Caliban's Worship of Stephano (Act 2, Scene 2 & Act 3, Scene 2)**
  Caliban is easily seduced by liquor and worships Stephano as a god.
  *   **The Failure of the Lens:** While this can be read as a satire of colonial religion, it also plays into the "naive savage" trope. It suggests Caliban lacks the rational faculty to distinguish a drunk butler from a deity. Montaigne argues that "savages" have complex social structures and reasoning; Shakespeare often reduces Caliban to a creature of appetite (drink, sex, earth). This makes it harder to view him as a philosophical counterweight to Prospero, and easier to view him as a subject requiring control.

  ### 3. The Verdict on Prospero's Civilizing Project
  Does the play endorse, satirize, or leave unreconciled the project of "civilizing" Caliban?

  **It leaves them unreconciled, but weighted toward tragedy.**
  The play acknowledges the failure of the civilizing project without fully condemning the civilizer.
  *   **The Failure:** Prospero admits his education of Caliban failed ("You taught me language, and my profit on't / Is, I know how to curse"). This is the play's most profound philosophical addition. It suggests that giving the colonized the tools of the colonizer (language/reason) does not create gratitude; it creates the capacity for resistance and articulate hatred.
  *   **The Ambivalence:** In Act 5, Prospero chooses mercy over revenge. He forgives Antonio, though Antonio never repents. He acknowledges Caliban ("this thing of darkness I / Acknowledge mine"). This admission of ownership is crucial. It suggests that the "monster" is not an external other, but a projection of Prospero's own will to power.
  *   **Conclusion:** The play does not endorse the *success* of the civilizing project (Caliban remains enslaved/unreformed), but it endorses the *necessity* of Prospero's authority to prevent chaos (the murder of the King). It is a conservative resolution: the colonial hierarchy remains, but the master must rule with "virtue" rather than vengeance.

  ### 4. What the Play Adds: Drama vs. Essay
  If you teach these texts together, the most valuable intervention is to show what *The Tempest* adds to Montaigne's philosophy by turning it into a drama of power, language, and dependence.

  **Language as a Technology of Power**
  Montaigne writes *about* language (noting the indigenous lack of words for "treason" or "lying"). Shakespeare *stages* the acquisition of language.
  *   **The Addition:** Caliban's speech ("You taught me language...") transforms language from a medium of communication into a medium of alienation. Montaigne sees linguistic difference as a barrier to understanding; Shakespeare shows that *shared* language can be a tool of subjugation. Caliban cannot return to his pre-linguistic state; he is trapped in Prospero's tongue. This adds a psychological dimension to Montaigne's sociological observation.

  **The Embodiment of the "Other"**
  Montaigne's cannibals are abstracted figures in an argument. Caliban is a body on stage.
  *   **The Addition:** The audience must decide what Caliban looks like. Is he a fish? A man? A demon? The play forces the audience to participate in the "custom" that defines barbarity. If the actor plays Caliban as monstrous, the audience sides with Prospero. If played as human, the audience sides with Caliban. The play implicates the viewer in the judgment of who is "civilized." It reveals that "barbarism" is not just a philosophical category, but a visceral reaction to difference.

  **Dependency and Intimacy**
  Montaigne describes two separate societies. Shakespeare locks two men in a single cell.
  *   **The Addition:** The play reveals the psychological cost of colonialism on the *colonizer*. Prospero is obsessed with Caliban; his magic is largely dedicated to controlling him. Montaigne suggests the Europeans are corrupted by their own cruelty; Shakespeare shows that the master is dependent on the slave for his own identity. Without Caliban to rule, Prospero is just a old man on an island. This mutual dependence complicates Montaigne's cleaner separation of "us" and "them."

  ### Teaching Strategy: Marking the Fracture
  To honor your desire not to force an allegory, I suggest framing the pairing as a **dialogue rather than a key.**

  1.  **Start with Montaigne:** Establish the relativist baseline. "Barbarism is in the eye of the beholder."
  2.  **Move to Gonzalo:** Show how Shakespeare imports this baseline.
  3.  **Test it against Caliban:** Ask the students: *Does Caliban fit Montaigne's 'Noble Savage'?*
      *   Have them list evidence for Caliban's virtue (connection to nature, poetic speech, rightful ownership).
      *   Have them list evidence for Caliban's "monstrosity" (the rape attempt, the worship of liquor).
  4.  **The Crucial Question:** Why does Shakespeare introduce the threat of rape?
      *   *Hypothesis:* It is the point where Early Modern moral philosophy hits its limit. Montaigne can theorize about cultural difference, but Shakespeare knows that when that difference threatens the patriarchal lineage (Miranda), the "civilized" mask drops, and brute force is justified.
  5.  **Final Synthesis:** Conclude with the "curse." Montaigne argues that we impose our customs on others. Shakespeare argues that once we do, we create a monster who can hate us in our own tongue. The play suggests that the damage of colonization is irreversible, a darker conclusion than Montaigne's hopeful humanism.

  This approach allows you to use Montaigne to illuminate the play's political theory while using the play to expose the limitations of that theory when faced with the realities of power, gender, and embodiment.
