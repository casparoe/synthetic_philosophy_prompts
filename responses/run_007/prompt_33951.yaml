prompt: |-
  So I've been going back and forth on this for months now, reading whatever I can find online — not academic papers, just, you know, blog posts and twitter threads and the occasional youtube debate. And I've pretty much settled on the view that these large language models, GPT-4 and Claude and all of them, they don't understand a single thing they're saying. They're stochastic parrots. They're doing next-token prediction on a scale we can barely comprehend, and the fact that the output sounds intelligent is just a reflection of how much intelligent text there is in the training data. It's pattern matching, not understanding. I've heard all the counterarguments — "but it solves novel math problems," "but it passes theory of mind tests," "but it can reason about situations it's never seen" — and none of them move me, because I can always tell myself: well, it's interpolating between patterns it has seen, just in a really high-dimensional way.

  But I've started to worry that I might be holding the view in a way that's too comfortable. I want to know what would actually count against it. Not just what critics say — I've heard all that — but what a reasonable person who holds my view should admit would be evidence against it. What would a genuine counterexample look like? What kind of experiment or benchmark would I have to see before I'd have to say, okay, fine, there's something more than pattern matching going on here? And if the answer is "nothing, really, because you can always redescribe any behavior as fancy pattern matching," then I want to hear that, and I want to know whether that makes my view vacuous. Is this the kind of position where it's a problem if it can't be falsified, or is "understanding" just one of those concepts where you shouldn't expect a clean empirical test?

  Please rank the defeaters from "this would completely overturn the position" to "this would be mildly awkward," and tell me which of these a defender of the stochastic-parrot view would actually concede as counting against them, versus which ones they'd dismiss as missing the point. And at the end, tell me what part of your answer you're least confident about — I'd rather get an honest "I'm really unsure here" than a fake certainty.
