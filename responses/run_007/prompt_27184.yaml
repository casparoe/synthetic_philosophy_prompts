prompt: |-
  ok so i'm trying to sort out my views in formal epistemology before i write a dissertation chapter and i'd like someone to tell me if i'm smuggling in a contradiction. here's where i'm at:

  (1) i'm an accuracy-firster about epistemic norms -- accuracy (closeness to truth) is the sole fundamental epistemic good, and all epistemic norms are derivable from it

  (2) i accept strict propriety: a rational credence function should be immodest, meaning it expects itself to be at least as accurate as any alternative, and strictly more accurate than any distinct alternative

  (3) i think the brier score is the right inaccuracy measure

  (4) i'm a conciliationist about peer disagreement -- when i learn that an epistemic peer (someone just as smart and well-informed) has a substantially different credence on some proposition, i should move mine significantly toward theirs

  (5) i think the accuracy-first framework successfully vindicates both probabilism (via dominance) and conditionalization (via expected accuracy maximization)

  (6) i think epistemic rationality is purely about truth -- pragmatic considerations don't bear on what i ought to believe or what credences i ought to have

  can you go through these and tell me which pairs are in genuine tension and which only look like they are? for the real tensions, rank them by severity and say what would have to give to resolve each. i don't want a "here's what you should believe" answer -- i want to know what i'm committed to given these views, and where i'd have to make cuts if i can't have them all.
