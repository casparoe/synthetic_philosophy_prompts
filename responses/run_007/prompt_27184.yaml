          *   *Why:* (5) says AFE vindicates Conditionalization. (4) says respond to disagreement by moving toward peer. Is "moving toward peer" identical to "conditionalizing on the proposition that the peer has credence X"? Not necessarily. "Split the difference" is often a heuristic, not a Bayesian update. If the user commits to Conditionalization as *the* rational update rule, they might be forced to reject specific conciliationist algorithms that aren't Bayesian.

