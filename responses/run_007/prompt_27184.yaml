  7.  **Deep Dive into Purism (6).**
      *   (6) says no pragmatic considerations.
      *   (4) Conciliationism is usually defended on epistemic grounds (the peer is a truth-tracker).
      *   So (4) and (6) are compatible *in principle*.
      *   However, some defenses of Steadfastness rely on pragmatic costs of changing beliefs. Since the user rejects pragmatics (6), they *must* defend Conciliationism purely on accuracy grounds. This tightens the constraint on (4) derived from (1).

