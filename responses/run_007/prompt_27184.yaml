      *   **Leitgeb (2019)** and **Pettigrew (2020)** discuss this. Pettigrew argues AFE *can* support conciliationism, but it requires specific assumptions about the prior (specifically, that you treat the peer as an independent indicator of truth).
      *   *Crucial Point:* If the user holds (4) as a *categorical* norm ("I *should* move significantly"), but (1)+(3)+(5) only yields conciliationism *contingent* on specific priors about peer reliability, there is a tension. The AFE framework makes conciliationism *contingent*, whereas standard Conciliationism (Christensen/Elga) often presents it as a requirement of rationality *given* peerhood.
