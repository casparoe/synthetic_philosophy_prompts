answer: |-
  **Setting:** *The lobby of a hotel hosting the Annual Conference on Value Theory. It is mid-morning coffee break. Mark, a proponent of formal axiology, is stirring sugar into an espresso. Sarah, who specializes in population ethics and normative uncertainty, approaches with a mug of black coffee.*

  **Mark:** Sarah, good to see you. What did you think of the keynote?

  **Sarah:** Provocative, as usual. Though I suspect he sidestepped the hard question about lexical thresholds. It got me thinking again about Temkin's spectrum arguments. I've been wrestling with a paper on whether we should officially drop transitivity as a constraint on the "better than" relation.

  **Mark:** *[Sighs playfully]* I should have known. You're going to try to convince me that rational choice theory is built on a lie? Look, Sarah, transitivity is the bedrock. If A is better than B, and B is better than C, then A must be better than C. If your theory violates that, you don't have a theory of value; you have a description of confusion.

  **Sarah:** That's the standard line, Mark. But consider the spectrum case. Start with a world with one person suffering intense torture for a year. Call that A. Now, world B has two people suffering slightly less intense pain. World C has four people with slightly less pain than that. We keep trading off intensity for number of sufferers. Eventually, we reach world Z: millions of people experiencing a very mild headache for an hour.

  **Mark:** The classic setup. And I know where you're going. You're going to say that for every adjacent pair, the increase in population seems to outweigh the slight decrease in intensity. So B is better than A, C is better than B, and so on. But intuitively, A (torture) is worse than Z (headaches). So Z is better than A. That gives you a chain where each link is "better than," but the endpoint loops back to be "better than" the start. Intransitivity.

  **Sarah:** Exactly. And the intuition is robust. Each step looks like a genuine improvement. *Ceteris paribus*, reducing torture slightly is worth adding a few headaches. But when you look at the endpoints, torture is categorically worse than headaches. If transitivity holds, one of those pairwise judgments has to be wrong.

  **Mark:** Or, much more likely, our intuitive grasp of the middle cases is unreliable. This is just a Sorites paradox applied to value. "Better than" is a vague predicate. When you make microscopic adjustments to value properties, you cross a threshold where the predicate flips, but you can't see exactly where. Just because you can't pinpoint the break doesn't mean the logic fails. It means our discrimination is limited.

  **Sarah:** But the Sorites analogy cuts both ways. In the baldness paradox, we accept that there is no sharp cutoff, yet we still call some men bald and some not. We don't insist there's a specific hair whose removal makes the difference. Why insist there's a specific step in the spectrum where "better than" stops applying? If the properties grounding the value are continuous, why must the value relation be discrete and transitive?

  **Mark:** Because "bald" is a descriptive classification, while "better than" is supposed to guide action. If "better than" isn't transitive, you open the door to money pumps. If I prefer Z to A, A to B, and B to Z, I can trade you Z for A, A for B, and B for Z, paying a fee each time, and end up back where I started but poorer. That's irrational. A normative theory shouldn't license being exploited.

  **Sarah:** I'm not arguing for cyclical preferences in a market context. I'm arguing that the *axiological* relation might not chain. In real-world decision-making, we don't choose between adjacent steps in a spectrum. We choose between distinct options. When I compare A and Z directly, the nature of the suffering dominates. When I compare A and B, the trade-off dominates. The context of comparison shifts the weighting of values.

  **Mark:** That sounds like you're smuggling in incommensurability. If the weighting shifts that drastically, maybe A and B aren't strictly "better than" each other. Maybe they're what Ruth Chang calls "on a par." If adjacent steps are merely on a par, then transitivity doesn't apply, and you save the relation from intransitivity. You just lose comparability.

  **Sarah:** I've considered parity. But the intuition isn't that A and B are incomparable or equal. It's that B is *better* than A. It's a genuine improvement. To say they are "on a par" feels like a technical fix to save a logical principle at the cost of phenomenological accuracy. If it looks like a duck and quacks like a duck, maybe we should admit some ducks don't fly in straight lines.

  **Mark:** But if you accept intransitivity, you lose the ability to maximize. How do you deliberate? If I can't chain reasons, I can't say that a long-term plan is better than a short-term gratification if the chain of reasoning connecting them is broken. It leads to decision paralysis.

  **Sarah:** Not necessarily. It just means deliberation is holistic rather than linear. We don't always add up points. We look at the whole picture. When I compare the torture world to the headache world directly, the holistic judgment overrides the chain of pairwise comparisons. The "better than" relation is sensitive to the relata. It's not a fixed bridge; it's a judgment sensitive to distance.

  **Mark:** Sensitive to distance? That's a hard pill to swallow for a formalist. It implies that logic is context-dependent. But let's talk about the practical upshot. If you publish this, what are you telling policymakers? "Don't worry about the slippery slope, because the bottom isn't necessarily worse than the top"?

  **Sarah:** I'm telling them that small trade-offs can accumulate into catastrophic moral errors without any single step being blameworthy. That's the warning of the spectrum argument. If we rely on transitivity, we might think, "Well, this policy is slightly better than the status quo, and the next is slightly better than that, so the final result must be good." But if intransitivity is real, that chain is broken. The final result could be terrible. Accepting intransitivity actually makes us *more* cautious about incremental changes.

  **Mark:** That's an interesting spin. So intransitivity acts as a brake on utilitarian calculus?

  **Sarah:** Precisely. It prevents the "tyranny of aggregation" from sliding too easily across qualitative thresholds.

  **Mark:** I see the appeal. It protects against the Repugnant Conclusion, certainly. But I still worry you're conflating epistemic uncertainty with ontological intransitivity. Maybe B *is* better than A, and C *is* better than B, and we just fail to see that Z is worse than A because of cognitive limitations. The error is in our head, not in the value relation.

  **Sarah:** And I worry that insisting on transitivity forces us to deny clear moral truths—like "torture is worse than a headache"—just to save a logical axiom. If the axiom conflicts with our most confident moral judgments, maybe the axiom is the one that needs revision. Logic is a tool for clarity, Sarah. If it distorts the subject matter, it's a blunt tool.

  **Mark:** *[Checks watch]* Ouch. Well, I suppose that's why they pay us the big bucks to argue about this. But seriously, if you go down the intransitivity road, expect the formal decision theorists to come after you with money pumps.

  **Sarah:** Let them come. I'll tell them life isn't a casino, and value isn't currency. Thanks for the coffee, Mark.

  **Mark:** Anytime, Sarah. Just don't try to trade me my espresso for a lukewarm tea because you claim they're "on a par."

  **Sarah:** *[Laughing]* No promises. See you at the afternoon session.
