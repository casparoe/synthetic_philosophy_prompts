prompt: |-
  I'm in a senior seminar on the ethics of blame, and we've spent three weeks on the standing-to-blame literature — Cohen, Wallace, Bell, Isserow, Todd, and the responses from people like King and Fritz. The class has roughly split into two camps, and the professor has suggested that the two sides produce an adversarial-collaboration document rather than another round of talking past each other. The exercise is to draft something both camps could actually sign, where the residual disagreement is made as precise as possible and the cruxes are identified in advance.

  I'd like you to produce that document.

  The two positions are:

  - **Position A (the Standing View):** There is a distinct normative concept of standing to blame, and hypocrisy — blaming another for a wrong one has committed oneself, without acknowledging or addressing one's own comparable conduct — undermines it. The hypocrite's blame may be true in content and proportionate to the target's wrongdoing, yet it is still objectionable in a way that is not reducible to the aptness of the blame itself, nor to the bad consequences of expressing it, nor simply to the fact that the hypocrite is also blameworthy. Standing is a relational notion: to have standing is to be in the right kind of normative position vis-à-vis the wrongdoer, and hypocrisy disqualifies one from that position.

  - **Position B (the Reductionist View):** The notion of "standing to blame" either does not pick out a genuine normative phenomenon distinct from other considerations, or it can be fully explained in terms of those other considerations. When we object to hypocritical blame, what we are tracking is one or more of the following: (i) the hypocrite is herself blameworthy for the same kind of conduct, and her failure to attend to her own wrongdoing is itself a fault; (ii) the hypocrite's expression of blame is pragmatically inappropriate given her own record, in ways that familiar norms of conversation and relationship can explain; (iii) the hypocrite's blame, while perhaps true, is not properly motivated by moral concern and therefore fails as blame in the fullest sense. None of these explanations requires a sui generis notion of standing, and invoking one obscures rather than clarifies the normative landscape.

  The document should have the following structure:

  1. **Agreed claims.** A numbered list of claims that both camps can endorse. These should be substantive — neither vacuous nor merely terminological — and should capture what the two sides genuinely share about the phenomenon of hypocritical blame, the cases that motivate the debate, and the structure of the disagreement. Aim for at least six and no more than twelve claims. If the two sides agree on how to characterize certain paradigm cases (e.g., the person who condemns others' infidelity while having an affair, the politician who denounces corruption while taking bribes), include that.

  2. **Disagreements table.** A table with two columns. The left column states each point of disagreement as neutrally as possible — a question or a statement that both sides would accept as capturing the locus of the dispute. The right column is split into two sub-columns: one for Position A's answer and one for Position B's answer, each phrased so that a proponent of that position would say, "Yes, that's exactly what I think." The wording should not smuggle in the other side's assumptions. Disagreements should be precise and, where possible, ordered from more fundamental to more derivative.

  3. **Cruxes.** Identify the sub-questions such that, if they were settled, at least one side would revise its view. For each crux, state what Position A predicts and what Position B predicts, and describe a concrete case, argument, or kind of evidence that both sides would agree bears on that crux. A crux should be specific enough that it's clear what would count as resolution. Examples might include: whether there is a case where the hypocrite's blame is apt, well-motivated, and well-expressed, yet we still judge it objectionable; whether the standing view can give a non-ad-hoc account of how standing is acquired and lost across different kinds of relationship; whether the reductionist can explain the distinctive second-personal character of the objection to hypocritical blame — the sense that the hypocrite has no right to address the wrongdoer in that way.

  4. **Verbal dispute assessment.** Conclude with a brief assessment: is any part of this dispute merely verbal? If so, identify precisely which part and explain why the two sides might be using the same words differently. If not, explain why the disagreement is genuinely substantive despite the shared ground.

  I should add that the camps in my class are genuinely trying to get this right — neither side is staking out a position for rhetorical purposes. The document should reflect that good-faith character.
reasoning: |-
  Here's a thinking process that leads to the suggested document:

  1.  **Analyze the Request:**
      *   **Context:** Senior seminar on ethics of blame, specifically the "standing to blame" literature (Cohen, Wallace, Bell, Isserow, Todd, King, Fritz, etc.).
      *   **Task:** Create an adversarial-collaboration document.
      *   **Goal:** Produce a text both camps (Position A: Standing View, Position B: Reductionist View) could sign, clarifying agreement, pinpointing disagreement, identifying cruxes, and assessing verbal disputes.
      *   **Tone:** Good-faith, precise, philosophical, academic but accessible to seminar participants.
      *   **Structure:**
          1.  Agreed Claims (6-12 substantive claims).
          2.  Disagreements Table (Neutral question/statement + Position A answer + Position B answer).
          3.  Cruxes (Specific sub-questions, predictions from A & B, concrete tests/evidence).
          4.  Verbal Dispute Assessment (Is it merely verbal? Where/Why?).

  2.  **Deconstruct the Positions:**
      *   **Position A (Standing View):** Standing is a *sui generis* normative notion. Hypocrisy undermines standing. Blame can be apt (deserved) but lack standing. It's relational (right to address). Key authors: Wallace (normative expectations), Cohen (commitment), Bell (moral authority).
      *   **Position B (Reductionist View):** Standing is not distinct. Objections to hypocritical blame reduce to: (i) the blamer's own blameworthiness, (ii) pragmatic/conversational norms, (iii) motivational defects (not blaming for the right reasons). Key authors: King (reduction to blameworthiness), Fritz (pragmatics), Isserow (sometimes reductionist leaning regarding motives).

  3.  **Drafting Section 1: Agreed Claims:**
      *   Need 6-12 substantive claims.
      *   *Idea 1:* Hypocritical blame feels objectionable. Both agree on the phenomenology.
      *   *Idea 2:* The target's wrongdoing is real. Both agree the target isn't off the hook morally just because the blamer is a hypocrite.
      *   *Idea 3:* Hypocrisy involves a lack of acknowledgment of one's own similar fault.
      *   *Idea 4:* Not all blame by imperfect people is hypocritical. (Need some distinction).
      *   *Idea 5:* The objection is distinct from the claim that the blame is *false*.
      *   *Idea 6:* The objection is distinct from simple consequentialism (it's not just that it causes bad outcomes).
      *   *Idea 7:* There is a second-personal element (addressing the wrongdoer).
      *   *Idea 8:* Acknowledgment/repentance can restore the ability to blame (both might agree on this mechanism, even if they disagree on *why* it works).
      *   *Refinement:* Ensure these aren't trivial. Make sure Position B can sign them without conceding "standing" exists as a *distinct* category.
      *   *Drafting:*
          1.  Hypocritical blame is pro tanto objectionable.
          2.  Target's blameworthiness is independent of blamer's standing.
          3.  Hypocrisy requires non-acknowledgment of comparable fault.
          4.  Objection isn't about truth conditions of the blame.
          5.  Objection isn't purely consequentialist.
          6.  Blame involves a communicative/addressive element.
          7.  Repentance mitigates the objection.
          8.  The objection is agent-relative (specific to the relationship between blamer and blamee).

  4.  **Drafting Section 2: Disagreements Table:**
      *   Need neutral framing.
      *   *Disagreement 1:* Ontological status of "standing."
      *   *Disagreement 2:* Explanation of the objection (New norm vs. Existing norms).
      *   *Disagreement 3:* The "Right to Blame."
      *   *Disagreement 4:* Motivational purity.
      *   *Disagreement 5:* Separability of Aptness and Authority.
      *   *Drafting:*
          *   Row 1: Is there a normative property distinct from aptness/consequences? (A: Yes, B: No).
          *   Row 2: Does the hypocrite's blame fail to constitute *full* blame or is it full blame but impermissible? (A: Impermissible/No Standing, B: Defective Blame/Improper Expression).
          *   Row 3: Can the objection be fully cashed out in terms of the blamer's own blameworthiness? (A: No, B: Yes/Partially).
          *   Row 4: Is the "right to blame" a distinct normative power? (A: Yes, B: No, it's a metaphor for other norms).

  5.  **Drafting Section 3: Cruxes:**
      *   Need specific tests.
      *   *Crux 1:* The "Perfect Hypocrite" case. Suppose the hypocrite is motivated purely by moral concern, expresses it perfectly, but hides their own fault. Does the objection remain? (A says yes, B says no or explains it via deception).
      *   *Crux 2:* The "Third-Party Reaction." If a third party observes hypocritical blame, do they object on behalf of the target? (A: Yes, standing is violable by third parties. B: No, it's a interpersonal pragmatic issue).
      *   *Crux 3:* Repentance. Why does admitting fault fix it? (A: Restores standing. B: Removes the pragmatic contradiction or the fault of non-acknowledgment).
      *   *Refinement:* Make sure the predictions are clear.
      *   *Crux 1:* The "Clean Motivation" Case. A hypocrite who *tries* to fix their fault but hasn't yet, vs one who hides it.
      *   *Crux 2:* The "Waiver" Case. Can the target waive the standing objection? (A: Maybe, it's their right. B: It's a conversational norm, so yes). Actually, let's look at the *source* of the norm.
      *   *Better Crux:* The "Distinctive Sanction." When we reject hypocritical blame, what are we doing? Refusing to accept the *authority* (A) vs. Rejecting the *message* due to source credibility (B).
      *   *Let's go with:*
          1.  The "Apt but Illegitimate" Intuition Test.
          2.  The Explanation of Repentance.
          3.  The Scope of the Objection (Who can complain?).

  6.  **Drafting Section 4: Verbal Dispute Assessment:**
      *   Is it just words?
      *   Likely partly verbal regarding the label "standing," but substantive regarding the *structure* of norms.
      *   If B says "standing is just a cluster of other norms," and A says "standing is a distinct norm," is that substantive? Yes, because it affects how we reason about trade-offs and exceptions.
      *   Need to highlight where the terminology masks a structural disagreement about normative architecture.

  7.  **Review and Refine:**
      *   *Check against authors:* Does this reflect Wallace/Cohen (A) vs. King/Fritz (B)?
      *   *Wallace:* Normative expectations, authority.
      *   *Cohen:* Commitment condition.
      *   *King:* Reduction to blameworthiness.
      *   *Fritz:* Pragmatic account.
      *   *Tone Check:* Is it collaborative? Yes, use "We agree," "The parties diverge," etc.
      *   *Formatting:* Ensure the table looks good.
      *   *Constraint Check:* 6-12 agreed claims? I have about 8 planned. Disagreements table? Yes. Cruxes? Yes. Verbal assessment? Yes.

  8.  **Final Polish:** (Self-Correction during drafting)
      *   *Correction:* Make sure Position B doesn't sound like a strawman. They aren't saying hypocrisy is *fine*. They are saying the *explanation* doesn't need a new category.
      *   *Correction:* Ensure Position A doesn't sound like they think the hypocrite is *right*. They agree the target is blameworthy.
      *   *Refining Crux 1:* The "Silent Hypocrite" vs. "Vocal Hypocrite." If the hypocrite blames privately vs publicly. Fritz might say pragmatics matter more. Wallace might say standing is violated regardless.
      *   *Refining Agreed Claim 8:* Make sure it's about the *target's* status. The target doesn't get a "free pass."

  9.  **Final Output Generation** (Proceeding to generate the response based on these thoughts).
answer: |-
  # Adversarial Collaboration Document: The Nature of Standing to Blame

  **Seminar:** Ethics of Blame (Senior Seminar)  
  **Subject:** The Normative Status of Hypocritical Blame  
  **Positions:** The Standing View (Position A) vs. The Reductionist View (Position B)  
  **Date:** October 26, 2023

  ---

  ## 1. Agreed Claims

  The undersigned parties, representing Position A (The Standing View) and Position B (The Reductionist View), endorse the following substantive claims. These claims demarcate the common ground upon which the disagreement rests.

  1.  **The Phenomenology of Objection:** There is a robust, shared intuition that hypocritical blame is pro tanto objectionable in a way that non-hypocritical blame is not. When a wrongdoer is blamed by a hypocrite, there is a distinctive sense of impropriety that calls for a response (e.g., "Who are you to say that?").
  2.  **Independence of Target's Blameworthiness:** The hypocritical blamer's lack of normative position does not negate the target's blameworthiness. The target has still committed a wrong, and the content of the blame (e.g., "You violated a moral obligation") may be strictly true.
  3.  **The Non-Acknowledgment Condition:** Hypocrisy, for the purposes of this debate, requires that the blamer has committed a comparable wrong *and* fails to acknowledge or address that fact in the context of blaming. A person who acknowledges their own past failings before blaming does not trigger the same objection.
  4.  **Distinct from Truth-Aptness:** The objection to hypocritical blame is not that the blame is factually incorrect or that the target is innocent. Both sides agree the blame can be fully *apt* (deserved) in terms of content and proportionality.
  5.  **Distinct from Pure Consequentialism:** The objection is not exhausted by the bad consequences of the blame (e.g., that it causes resentment or fails to reform). Even if hypocritical blame produced good consequences, it would retain a residue of normative impropriety.
  6.  **The Communicative Nature of Blame:** Blame is not merely a private judgment; it involves a communicative or addressive element directed at the wrongdoer (or a community). The objection to hypocrisy arises in the context of this address.
  7.  **The Remedial Role of Repentance:** If the hypocrite acknowledges their own fault, expresses regret, or takes steps to reform, the objection to their blame is significantly mitigated or dissolved. Both sides agree that "cleaning one's own house" restores the acceptability of the blame.
  8.  **Agent-Relativity:** The objection is agent-relative. A third party who is not a hypocrite may legitimately blame the target even when the hypocrite cannot. The defect lies specifically in the relationship between the hypocritical blamer and the target.
  9.  **Not All Imperfection Precludes Blame:** Both sides agree that mere moral imperfection does not undermine the ability to blame. One need not be saintly to have the normative position to blame; the defect requires a specific relation between the blamer's fault and the blame being issued.
  10. **Normative Significance:** The debate is not merely descriptive. Both sides agree that resolving this issue matters for how we understand moral accountability, interpersonal relationships, and the ethics of moral criticism.

  ---

  ## 2. Disagreements Table

  The following table isolates the precise points of divergence. The left column states the issue neutrally. The right columns articulate how each position resolves that issue, phrased to be acceptable to proponents of that view.

  | Locus of Disagreement | Position A (The Standing View) | Position B (The Reductionist View) |
  | :--- | :--- | :--- |
  | **1. Ontological Status of "Standing"**<br>Is "standing to blame" a *sui generis* normative category, or is it a label for a cluster of other norms? | Standing is a distinct normative power or authority, analogous to standing in law. It is not reducible to general blameworthiness or pragmatic norms; it is a precondition for the *permissibility* of the address. | "Standing" is a useful shorthand, but ontologically it reduces to other factors: the blamer's own blameworthiness, conversational implicatures, or motivational defects. There is no extra normative "ticket" required. |
  | **2. Explanation of the Objection**<br>What makes hypocritical blame objectionable? | It violates a **commitment condition** or **normative authority**. By blaming, one implicitly claims authority over a norm one has already flouted without acknowledgment, creating a normative contradiction. | It violates norms of **fairness** (the blamer is also at fault), **sincerity** (the blamer implies they are better than they are), or **conversational propriety** (the message is undermined by the source). |
  | **3. Separability of Aptness and Authority**<br>Can blame be fully apt yet lack standing? | **Yes.** Aptness (desert) and Standing (authority to address) are separate dimensions. One can deserve blame from everyone, but only some have the standing to deliver it. | **No (or Trivially).** If blame is fully apt and well-motivated, any remaining "objection" is just the fact that the blamer is also bad. There is no second hurdle of "authority" that is distinct from the quality of the blame itself. |
  | **4. The Role of Motivation**<br>Does the hypocrite's motivation explain the whole problem? | **No.** Even if the hypocrite is motivated by pure moral concern, the hypocrisy itself undermines standing. The structural relation of the faults matters more than the internal state. | **Yes (Largely).** Hypocritical blame is often objectionable because it signals a lack of moral concern or a desire for dominance. If motivation were pure, the "hypocrisy" would be less relevant or explainable via other norms. |
  | **5. The Nature of the "Right"**<br>When we say the hypocrite has "no right" to blame, what do we mean? | We mean they lack a **normative power**. Their blame does not "take hold" in the same way; the target is entitled to reject the address *as blame*. | We mean they lack **pragmatic license** or **credibility**. The target can reject the *message* or the *messenger*, but the normative force of the moral claim remains intact. |
  | **6. Scope of the Defect**<br>Is the defect in the *act* of blaming or the *agent*? | The defect is in the **act-type**. The act of blaming by a hypocrite is normatively infelicitous, similar to a promise made by someone without authority. | The defect is in the **agent's record** or the **context**. The act is fine, but the agent's history makes performing it inappropriate or unfair in this context. |

  ---

  ## 3. Cruxes

  The following are specific sub-questions or test cases. If these were settled empirically or via intuition pump consensus, at least one side would be compelled to revise their view.

  ### Crux 1: The "Pure Motivation" Hypocrite
  *   **The Case:** A blamer commits a wrong, acknowledges it privately, feels genuine remorse, and is actively working to reform, but has not yet publicly acknowledged it. They blame a target for the same wrong, motivated entirely by moral concern for the target, with no desire for dominance or self-aggrandizement.
  *   **Position A Prediction:** The blame is still objectionable (or lacks standing) because the public commitment/authority has not been restored. The structural relation of the faults matters regardless of internal motivation.
  *   **Position B Prediction:** The blame is permissible (or the objection vanishes). Since the reductionist factors (bad motivation, unfairness, deception) are absent or minimized, there is no residue of objection.
  *   **Resolution Condition:** If seminar participants agree that this blamer *retains full standing* despite lack of public acknowledgment, Position A must narrow its account of standing. If participants agree the blame is *still* inappropriate, Position B must explain why without invoking a distinct normative power.

  ### Crux 2: The Third-Party Intervention
  *   **The Case:** A hypocrite blames a wrongdoer. A third party (who is not a hypocrite) intervenes and says, "You shouldn't blame them; you did the same thing."
  *   **Position A Prediction:** The third party is enforcing a norm that belongs to the target *and* the community. The hypocrite's lack of standing is a public normative fact that third parties can police.
  *   **Position B Prediction:** The third party is pointing out a pragmatic inconsistency or a fairness issue regarding the *hypocrite*, not necessarily a violation of the target's rights. The objection is primarily about the hypocrite's behavior, not the target's entitlement.
  *   **Resolution Condition:** If the intuition is that the third party is *defending the target's right* to not be blamed by this person, Position A is strengthened. If the intuition is that the third party is merely *criticizing the hypocrite's rudeness/unfairness*, Position B is strengthened.

  ### Crux 3: The "Waiver" Test
  *   **The Case:** The target knows the blamer is a hypocrite but says, "I don't care about your past; please hold me accountable."
  *   **Position A Prediction:** Standing can potentially be waived or granted by the target, as standing is a relational normative power vis-à-vis the target.
  *   **Position B Prediction:** The objection is largely about the blamer's own integrity or general conversational norms, which the target cannot fully waive. Alternatively, if the target waives it, the objection disappears because the pragmatic context has shifted.
  *   **Resolution Condition:** If the target's invitation *fully legitimizes* the blame, it suggests standing is relational (A). If the blame remains "tainted" even with the target's consent, it suggests the norm is agent-centered or general (B).

  ---

  ## 4. Verbal Dispute Assessment

  **Is this dispute merely verbal?**
  No, but there is a verbal component that obscures the substantive core.

  **The Verbal Component:**
  Both sides use the word "standing," but they attach different ontological weights to it. Position B often uses "standing" as a *descriptive label* for a phenomenon (like "weather"), whereas Position A uses it as a *theoretical posit* (like "gravity"). If Position B admits that "there is a cluster of norms regarding who may appropriately blame whom," and Position A admits that "standing is constituted by facts about blameworthiness and relationships," the gap narrows.

  **The Substantive Core:**
  The disagreement is genuinely substantive regarding **normative architecture**.
  1.  **Trade-offs:** If standing is a distinct normative power (A), it might trade off against other values differently than if it is just a cluster of fairness/pragmatic norms (B). For example, can standing be overridden by urgent moral necessity? Position A might say "No, one cannot blame without standing," while Position B might say "Yes, the pragmatic norm is overridden by the need to stop harm."
  2.  **Explanatory Power:** Position A claims the "Standing" concept explains *why* the cluster of norms hangs together. Position B claims the "Standing" concept is an unnecessary middleman. This is a methodological dispute about parsimony vs. phenomenological accuracy.
  3.  **The Nature of the Target's Response:** If Position A is correct, the target's "Who are you?" response is a claim of *right*. If Position B is correct, it is a claim of *inconsistency* or *unfairness*. This changes the moral dynamics of the interaction.

  **Conclusion:**
  While some friction arises from defining terms, the parties disagree on the fundamental structure of moral accountability. Position A sees a two-step process (Desert + Authority); Position B sees a one-step process (Desert + Contextual Constraints). Resolving this requires settling whether the "Authority" constraint is a distinct normative entity or a composite of other moral facts.

  ---
  **Signatories:**

  _________________________ (Representing Position A)

  _________________________ (Representing Position B)

  _________________________ (Faculty Observer)
