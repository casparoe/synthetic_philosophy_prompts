answer: |-
  You have put your finger on one of the deepest and most persistent problems in the philosophy of probability and statistics: **The Reference Class Problem.**

  First articulated formally by Hans Reichenbach (and earlier by John Venn), the problem is exactly as you describe: any individual belongs to infinitely many classes, and the probability assigned to an event (like dying in a car crash) changes depending on which class you select. There is no mathematical rule within probability theory itself that tells you which class is the "correct" one.

  So, what philosophical move is insurance underwriting making? It is not making a purely epistemic move (about truth). It is making a **pragmatic and normative move.**

  Here is the breakdown of the implicit theory built into insurance, why it looks incoherent, and what happens if you change the axioms.

  ### 1. The Implicit Theory: Pragmatic Frequentism
  Insurance underwriting presupposes a version of **Frequentist Probability**, but with a pragmatic constraint.

  *   **The Epistemic Claim:** Probability is not a property of the *individual* (there is no such thing as "your" personal 0.04% risk of death). Probability is only a property of a *group*. Therefore, "your" risk is literally defined as the frequency of the event in the reference class you are assigned to.
  *   **The Pragmatic Constraint:** The "right" reference class is not the *truest* one (which doesn't exist), nor the *narrowest* one (which leads to instability). It is the **most stable, measurable, and legally permissible partition that retains predictive power.**

  When an underwriter stops at "35-year-old nonsmoker in Brooklyn" and ignores your genome, they are making a **Reichenbachian Posit**. They are positing that this specific class is *sufficiently homogeneous* for the purpose of the contract, even though they know it isn't *perfectly* homogeneous.

  ### 2. Why the "Patchwork" Isn't (Entirely) Incoherent
  You noted the inconsistency: they use credit scores (highly predictive, morally dubious) but not genomes (highly predictive, morally protected). They use telematics (hyper-specific) but not diet (hard to measure).

  This isn't logical incoherence; it is **triangulation**. The selection of a reference class is determined by three competing filters:

  1.  **Statistical Stability (The Law of Small Numbers):** If you make the class too narrow (e.g., "35-year-old nonsmokers in Brooklyn who eat kale and drive a 2018 Honda"), the sample size drops. The data becomes noisy. A class of one (N=1) has no frequency. Insurance requires the **Law of Large Numbers** to function. If the class is too narrow, the "probability" becomes indistinguishable from randomness.
  2.  **Information Cost (The Economic Filter):** As you noted, measuring your genome used to be too expensive. Measuring your driving via an app is now cheap. The "legitimacy" of a reference class is partly a function of the marginal cost of acquiring that data versus the marginal reduction in risk uncertainty.
  3.  **Normative Permissibility (The Social Contract Filter):** This is the big one. We legally forbid certain reference classes (race, genetic information, sometimes gender) not because they lack predictive power, but because we have decided that **actuarial fairness** (paying what you risk) must yield to **social fairness** (not being penalized for things outside your control).

  **The Philosophical Move:** Insurance underwriting treats "risk" not as a metaphysical reality waiting to be discovered, but as a **construct** negotiated between statistical stability, economic efficiency, and social values.

  ### 3. The Tension: Actuarial vs. Social Fairness
  The weirdness you sense comes from the clash between two theories of fairness:

  *   **Actuarial Fairness:** You should pay exactly what your risk costs the pool. Under this theory, the "right" reference class is the *narrowest possible one*. If your genome says you will die at 40, you should pay life insurance rates for a 40-year-old. To do otherwise is to subsidize you at the expense of others.
  *   **Social Fairness (Solidarity):** Insurance is a mechanism for sharing "brute luck" (to use Ronald Dworkin's term). Under this theory, the "right" reference class is the *broadest possible one*. We pool the sick with the healthy because health is partly luck.

  Current underwriting is a messy compromise. We allow age-based pricing (brute luck) and smoking-based pricing (option luck), but we ban genetic pricing (brute luck). The theory of evidence here is **moralized evidence**: data is only "relevant" if we morally agree it should be relevant.

  ### 4. What If We Adopted the "Narrowest Computable Class"?
  You asked what would happen if we replaced the presupposed view with one where the only legitimate reference class is the narrowest one you can compute (essentially, "Perfect Risk Assessment").

  **Insurance would cease to exist.**

  This is the **Paradox of Insurance**. Insurance works *because* of information asymmetry and imperfect classification.
  *   **The End of Pooling:** If you know your exact risk (N=1), there is no uncertainty to pool. If you know you will crash tomorrow, you buy insurance; if you know you won't, you don't. This is **Adverse Selection**.
  *   **Market Collapse:** In economics, this is Akerlof's "Market for Lemons." If underwriting becomes perfect, high-risk individuals are priced out of the market entirely. Low-risk individuals pay very little, but they also have little need for coverage. The redistributive function of insurance vanishes.
  *   **Privacy & Autonomy:** To achieve the "narrowest class," you must surrender total autonomy. The insurer must monitor your biology, behavior, and thoughts in real-time. You become a "risk subject" rather than a policyholder.

  ### 5. Conclusion: What Theory Is This?
  The practice presupposes a theory of **Constructive Pragmatism**.

  It rejects the idea that there is a "True Probability" for an individual. Instead, it asserts that probability is a tool for managing social risk. The "right" reference class is the one that allows the institution of insurance to survive.

  *   It must be **broad enough** to maintain solidarity and keep premiums affordable for high risks.
  *   It must be **narrow enough** to prevent moral hazard and keep the company solvent.
  *   It must be **morally palatable enough** to satisfy regulators and the public.

  The incoherence you sense is real, but it is the incoherence of a **Reflective Equilibrium**. It is a system constantly adjusting between "What does the math say?" and "What kind of society do we want to live in?"

  If you forced the system to be logically pure (either fully actuarial or fully solidaristic), it would break. The "patchwork" is the only reason it works at all. The philosophical move is to treat probability not as a description of reality, but as a **governance technology.**
