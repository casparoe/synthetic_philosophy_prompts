      *   **Conclusion:** Summary for the article angle.

  7.  **Refining the Output:**
      *   Make sure to use the terminology the journalist used (akrasia, dispositions, time-slice).
      *   Ensure the distinction between *Causal Decision Theory* (CDT) and *Functional Decision Theory* (FDT) or *Resolute Choice* is clear without getting too bogged down in jargon.
      *   Check the logic on (5). (5) says "life going worse overall... doesn't give you a reason." If we reject (4), does that automatically reject (5)? Yes, because the "reason" comes from the plan/intention, not just the local outcome.
