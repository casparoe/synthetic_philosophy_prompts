          *   The Arbiter (3): Definition of failure.
      *   **Ranking Tensions:**
          1.  **(1) vs. (4) & (5):** The Hitchhiker Paradox. You can't pay because of a past promise if past promises don't count as current reasons.
          2.  **(2) vs. (5):** The Disposition Paradox. You can't have the disposition if you ditch it when it costs.
          3.  **(3) vs. (1):** The Akrasia Trap. If you pay against current self-interest, is it weakness or strength?
      *   **The Fix:**
          *   Option A (The Economist): Drop (1). Be a CDT theorist. (Boring for a feature?)
