answer: |-
  You have described one of the most famous and rigorously debated structures in contemporary philosophy of mind. Because your formulation is precise, I can give you a precise answer.

  ### 1. The Name of the Trilemma

  Yes, this trilemma has an established name. It is most commonly referred to as **The Causal Exclusion Problem** (or **The Causal Exclusion Argument**).

  While "The Mind-Body Problem" is the broader genus, and "The Problem of Mental Causation" is the general topic, the specific logical trap you have outlined—an inconsistent triad forcing a choice between epiphenomenalism, reductionism, or the denial of physical closure—is the core of Jaegwon Kim's **Causal Exclusion Argument**.

  Sometimes, specifically when referring to the three claims themselves rather than the argument that dismantles them, it is called the **Inconsistent Triad of Mental Causation**. The triad consists of:
  1.  **Mental Causation:** Mental events cause physical events.
  2.  **Physical Causal Closure:** Every physical event has a sufficient physical cause.
  3.  **Mind-Body Non-Identity:** Mental events are not identical to physical events.

  ### 2. The Underlying Principle

  You asked for the standard formulation of the principle doing the work (the "one effect, one sufficient cause" intuition). This is technically called the **Principle of Causal Exclusion** (or simply the **Exclusion Principle**).

  **Standard Formulation:**
  A canonical formulation (drawing from Kim) runs roughly as follows:
  > "No single event can have more than one sufficient cause occurring at any given time — unless it is a genuine case of causal overdetermination."

  **Metaphysical Truth or Methodological Rule?**
  This is a major point of contention in the literature.
  *   **The Metaphysical View:** Jaegwon Kim and other reductionists treat the Exclusion Principle as a metaphysical constraint on the structure of reality. They argue that causation is a "jealous" relation; if the physical cause is sufficient, there is literally no "causal work" left for the mental cause to do.
  *   **The Methodological/Conceptual View:** Critics (such as Stephen Yablo, or Christian List and Philip Pettit) argue that the principle is not a metaphysical law but a heuristic for *independent* causes. They suggest it is a methodological rule that breaks down when causes are related by dependence (e.g., supervenience or realization). On this view, the mental and physical causes are not "competitors" in the way two billiard balls are, so the principle does not apply.

  ### 3. Distinguishing the Trilemma from Its "Exits"

  You correctly noted that "overdetermination" and "epiphenomenalism" are often confused with the problem itself. Here is how to carve them off:

  *   **The Trilemma (The Exclusion Problem):** This is the *structural inconsistency*. It is the claim that (1), (2), and (3) cannot all be true simultaneously *given* the Exclusion Principle. It is the trap itself.
  *   **Overdetermination:** This is the *consequence* of refusing to leave the trap. If you insist all three claims are true, you must accept that every action is causally overdetermined (like a victim shot by two assassins simultaneously). The Exclusion Argument attacks this by noting that while accidental overdetermination is possible, *systematic* overdetermination (happening for every voluntary action) is implausible. Thus, overdetermination is the bullet one bites if one rejects the Exclusion Principle.
  *   **Epiphenomenalism:** This is the *solution* arrived at by denying Claim 1 (Mental Causation). It is not the problem; it is the cost of saving Physical Closure and Non-Identity.

  **Proposed Definition (if you needed one):**
  If you were defining this in a context where the name "Exclusion Problem" was not known, you should define it as **The Problem of Causal Competition**. This distinguishes it from general overdetermination by highlighting that the mental and physical are competing for the *same* causal role in a way that implies redundancy, and distinguishes it from epiphenomenalism by framing the loss of causation as a *risk* rather than a conclusion.

  ### 4. Confidence and Uncertainty

  **Confidence Level:**
  I am **very confident** (95%+) that the structure you identified is the Causal Exclusion Problem as formulated by Jaegwon Kim (particularly in works like *Mind in a Physical World*, 1998). The mapping of your three claims to the standard Inconsistent Triad is exact.

  **Point of Least Certainty:**
  My least certain point concerns the **ontological status of the Exclusion Principle**.
  While I am confident that Kim *intends* it as a metaphysical truth, I am less certain that there is a philosophical consensus on whether it *is* one. A significant faction of non-reductive physicalists argues that the principle is false when applied to supervenient properties. They argue that causation can be "proportional" or "realization-insensitive," meaning the mental cause can be the *relevant* cause even if the physical cause is *sufficient*.

  Whether the Exclusion Principle is a hard law of metaphysics or a contingent rule about independent causal chains is the live wire in this debate. If it is the latter, the trilemma dissolves without requiring reductionism or epiphenomenalism. Consequently, while the *name* of the trap is settled, the *force* of the trap remains the primary battlefield.
