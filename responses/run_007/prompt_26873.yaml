  ### Thought Experiment: The Bedside Vigil

  **Scenario:**
  Mark is the spouse of Elena, who has entered a sudden, unexplained coma following a routine surgery. The medical team is baffled. The lead neurologist tells Mark, "We simply don't know. The physiological markers are ambiguous. Statistically, patients in this specific state wake up about 40% of the time, but we have no specific data on Elena."

  Mark is now at Elena's bedside. He must care for their three young children while maintaining the vigil. The children are terrified; their stability depends entirely on Mark's emotional resilience. Mark knows from past experience that his own psychological coping mechanism is binary: he either maintains a hopeful outlook or he collapses into debilitating despair. Specifically, if Mark *believes* that Elena will wake up, he remains functional, calm, and capable of parenting the children through the crisis. If Mark *withholds belief* or believes she will not wake up, he suffers a depressive breakdown, rendering him unable to care for the children, who would then have to be placed in emergency foster care.

  Mark is a rational agent. He cannot simply "flip a switch" to believe against the evidence (no believing at will). He also cannot engage in long-term self-deception strategies (like avoiding doctors or reading only hopeful stories) because he is currently at the bedside, monitoring vitals, and must form his doxastic attitude *now* to function in the immediate future. He asks himself: "Given the situation, ought I to believe Elena will wake up?"

  ***

  ### Analysis

  **(a) The Agent's Reasons**
  1.  **Evidential Reason:** The medical testimony indicates a 40% probability of recovery with no specific positive indicators for Elena. This counts *against* believing $p$ ("Elena will wake up").
  2.  **Pragmatic Reason:** Believing $p$ is a necessary condition for Mark's psychological stability, which is a necessary condition for the welfare of his children. This counts *in favor* of believing $p$.

  **(b) Classification of Reasons**
  1.  **Evidential Reason:** **Object-given.** This reason bears on the truth of the proposition $p$. It indicates that $p$ is likely false.
  2.  **Pragmatic Reason:** **State-given.** This reason bears on the *value of being in the state of believing* $p$. It does not make $p$ more likely to be true (Elena's recovery is biologically independent of Mark's belief); it makes the *holding of the belief* beneficial.

  **(c) Resistance to the "Reason to Bring About" Response**
  The standard response to WKRP for belief is: *"Since you cannot believe at will, this pragmatic reason is not a reason to believe, but a reason to take steps to bring about the belief (e.g., seek confirming evidence, avoid disconfirming evidence, or undergo therapy)."*

  In Mark's case, this response fails for two reasons:
  1.  **Temporal Immediacy:** The need for the belief is concurrent with the deliberation. Mark must function *now* to care for the children. There is no temporal gap in which to execute a project of "belief cultivation." Any action he takes to "make himself believe" (e.g., reciting affirmations) would occur *after* the moment of doxastic assessment, but the normative pressure applies to the assessment itself.
  2.  **Incoherence of Manipulation:** Mark is fully aware of the pragmatic reason. As a rational agent, he knows that trying to induce a belief for pragmatic reasons usually undermines the belief itself (he would know he is self-deceiving). Therefore, the "reason to bring about" is practically inert. He cannot rationally undertake a project to believe $p$ when he knows the project is motivated solely by the benefit of believing.

  Thus, the pragmatic reason does not successfully translate into a reason for *action*. It remains stuck as a consideration that seems to bear on the question "Ought I believe?"

  **(d) Structural Feature Enabling Resistance**
  The structural feature is **Doxastic Necessity without Doxastic Control.**
  The case creates a dependency where the *outcome* (children's welfare) is causally linked to the *doxastic state* itself, not to actions derived from the belief. Simultaneously, the agent's rationality and the immediacy of the situation block the voluntary control usually required to convert state-given reasons into instrumental actions. This isolates the pragmatic reason, forcing it to stand or fall as a direct reason for the attitude.

  ***

  ### The Defender's Response and Evaluation

  **Defender's Objection:**
  A defender of the object-given/state-given distinction would argue: *"Mark does not have a reason to believe $p$. He has a reason to **act as if** he believes $p$, or a reason to **wish** he believed $p$. The feeling that he 'ought to believe' is a category mistake. Since belief aims at truth, and this reason has nothing to do with truth, it is the 'wrong kind' of reason and drops out of doxastic deliberation entirely. The fact that he cannot bring it about simply means he is unfortunate, not that he has a non-evidential reason for belief."*

  They might further invoke **"Ought Implies Can"**: *"Since Mark cannot believe at will, it is false that he 'ought' to believe. Therefore, there is no normative pressure on the belief itself, only on his emotions or actions."*

  **Evaluation:**
  This response is **ad hoc** in the context of normative theory.
  1.  **Phenomenological Mismatch:** It ignores the agent's lived experience of normative conflict. Mark feels a genuine tension between "The evidence says no" and "The stakes say yes." Dismissing the latter as merely a "wish" fails to explain why the pragmatic consideration feels like it competes with evidence in deliberation.
  2.  **The "Act As If" Dodge:** Suggesting Mark should "act as if" he believes changes the subject from *belief* to *assertion/behavior*. The WKRP is specifically about whether pragmatic reasons can count in favor of the *attitude*. If the defender concedes that pragmatic reasons can never count in favor of the attitude, even when the attitude is the sole causal lever for a vital outcome, they are protecting the distinction by fiat rather than argument.
  3.  **Generalization Failure:** If we accept "Ought Implies Can" to dissolve the problem, we lose the ability to critique agents who *could* manipulate their beliefs but don't. The distinction relies on the *type* of reason, not the *capacity* of the agent. If the reason vanishes simply because control is low, the distinction collapses into a claim about voluntarism, which is not what the object-given/state-given distinction is supposed to track.

  **Conclusion:**
  The Bedside Vigil case suggests that state-given reasons can exert normative pressure on belief even when voluntary control is absent. This challenges the standard view that WKRP is dissolved for belief simply because belief is involuntary. It implies that the "Wrong Kind" of reason might still be a *reason*, just one that conflicts with the constitutive aim of belief, rather than a reason that is categorically excluded from doxastic normativity.
