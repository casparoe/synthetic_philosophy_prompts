answer: |-
  0.75

  Here is the decomposition of that credence, followed by the synthesis and the identification of the weakest link.

  ### Decomposition

  **1. Credence that the "dualism of practical reason" was a genuine, live problem for him: 0.95**
  *Reasoning:* This is the strongest link in the chain. Sidgwick's correspondence (particularly with John Addington Symonds and his future wife Eleanor Balfour) and the structure of *The Methods of Ethics* itself make it clear this was not rhetorical. He explicitly states that without a moral government of the universe (divine sanctions), the conflict between Rational Egoism and Rational Utilitarianism is insoluble. He withheld this conclusion from the public for years because he feared it would undermine the utilitarian project. The textual evidence here is overwhelming; he treats it as a "fundamental problem" that threatens the coherence of his life's work.
  *Speculation Flag:* Minimal. This is based on explicit statements in his published work and private letters.

  **2. Conditional Credence that psychical research was a reasonable empirical bet in the 1880s: 0.85**
  *Reasoning:* We must judge this by the epistemic standards of 1880, not 2024. At that time, the boundaries of physics and physiology were porous. Leading scientists (Alfred Russel Wallace, William Crookes) were investigating spiritualist phenomena. The concept of "force" was not yet fully conserved in the public imagination the way it is now; telepathy did not violate known laws of physics in the way it violates modern neuroscience. If one accepts that testimony can constitute evidence (which Sidgwick did, carefully), the prior probability of *some* anomalous mental phenomena being real was non-negligible. It was a high-variance bet, but not an irrational one.
  *Speculation Flag:* Low. This relies on general history of science, though assessing the "reasonableness" of a specific bet always involves some counterfactual judgment.

  **3. Credence that his engagement was methodologically continuous with his epistemology: 0.80**
  *Reasoning:* Sidgwick was known within the SPR as a severe skeptic, often to the frustration of true believers. He applied the same demand for rigorous testimony and the elimination of fraud that he applied to ethical intuitions (seeking self-evidence and consistency). He did not accept séance room theatrics as proof; he looked for controlled conditions. However, there is a subtle drift: in ethics, he sought logical coherence; in psychical research, he sought empirical anomalies to support a desired metaphysical conclusion. The * rigor* was continuous, but the *direction of inference* was potentially reversed (seeking evidence for a conclusion rather than deriving the conclusion from evidence).
  *Speculation Flag:* Moderate. Assessing "methodological continuity" requires interpreting his internal cognitive processes, not just his output.

  **4. Credence that the ethical dualism was the *primary causal driver* of the SPR work (vs. parallel religious anxiety): 0.65**
  *Reasoning:* This is the critical pivot. The standard narrative is Ethics → Dualism → Need for Theism → SPR. However, Sidgwick's interest in spiritualism and the possibility of survival predates the final formulation of the Dualism in *The Methods of Ethics* (1874). He was investigating mediums in the late 1860s. This suggests that a pre-existing religious longing or existential anxiety drove *both* the formulation of the ethical problem and the turn to psychical research. The Dualism may have been the *intellectual justification* for the SPR work, rather than the *cause* of it. If the motivation was primarily emotional/religious, calling it a "rational extension of his philosophical project" is slightly generous, though still defensible as a rationalization.
  *Speculation Flag:* High. This requires psycho-biographical inference about the ordering of his private intellectual development.

  ### Synthesis

  I arrive at **0.75** by weighing these terms. The high confidence in the reality of the Dualism (0.95) and the contextual reasonableness of the science (0.85) pulls the credence up. It confirms that Sidgwick was not "crazy" by the standards of his time, nor was his philosophical problem fake.

  However, I discount the final score because of the fourth term (Causal Driver). If the SPR work was driven more by a pre-existing emotional need for immortality which *then* found a philosophical hook in the Dualism, it moves slightly from "rational extension" toward "motivated reasoning." It doesn't make it eccentricity, but it does mean the rationality is post-hoc justification for a hope, rather than a pure deductive extension of the ethics. 0.75 reflects a position that it was intellectually honest but psychologically motivated.

  ### The Weakest Link & Evidence Required

  **Least Confident Term:** Term 4 (Causal Primacy: Ethics → SPR vs. Religious Anxiety → Both).

  **Why:** The timeline is murky. If Sidgwick's interest in survival of death was primarily emotional, the "rational extension" narrative is a reconstruction he (and his biographers) built to make the obsession fit the philosophy. If the ethical Dualism genuinely forced him into the SPR as a last resort to save rationality, the narrative holds.

  **Evidence That Would Shift It:**
  1.  **Early Notebooks (pre-1870):** Specific entries where he links the *ethical* conflict directly to the *investigation* of mediums before *The Methods of Ethics* was published. If he writes in 1869, "I must investigate telepathy to solve the egoism problem," my credence shoots to 0.90.
  2.  **Letters to Eleanor Sidgwick (pre-marriage):** Eleanor was deeply involved in the SPR. Correspondence showing whether they discussed the *ethical necessity* of the research or the *personal comfort* of survival would be decisive. If the letters focus on the comfort of belief, it supports the "anxiety" hypothesis.
  3.  **SPR Committee Minutes:** Evidence of Sidgwick arguing for investigations specifically on the grounds of their ethical utility versus their scientific novelty.

  **Speculation Flag:** My assessment of Term 4 relies heavily on the biographical work of J.B. Schneewind and the general consensus that Sidgwick's religious crisis was lifelong. I am inferring the psychological weight of that crisis relative to his ethical arguments without having read every private diary entry (many of which were destroyed by his executors to protect his reputation). If those destroyed diaries contained a clear "Ethics first, SPR second" timeline, my credence would increase. If they contained "I cannot bear the thought of annihilation," it would decrease.
