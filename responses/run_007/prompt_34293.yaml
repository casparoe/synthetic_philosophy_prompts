answer: |-
  A defender of evolutionary psychology would accept the description of its core theoretical framework but vehemently reject the claim that its hypotheses are untestable, arguing that the "pseudoscience" verdict relies on a straw-man caricature of how the field actually generates and validates predictions.

  Your teacher is correct that evolutionary psychology (EP) posits the mind consists of domain-specific mechanisms shaped by selection pressures in the Environment of Evolutionary Adaptedness (EEA), often loosely associated with the Pleistocene. Proponents agree that the goal is to identify the adaptive function of these mechanisms, such as mate selection preferences or coalition-building algorithms. However, the critique collapses when it claims these ideas are untestable because we cannot observe ancestral humans. A defender would argue this is a category error: EP does not require time travel to validate hypotheses, but rather derives novel predictions about *current* cognitive architecture, physiology, and behavior. If a mechanism evolved to solve a specific recurrent problem, it should leave detectable signatures in modern neural circuitry, developmental patterns, and cross-cultural universals that can be empirically measured and falsified today.

  The accusation of "just-so stories" applies only to poorly conducted work, not the field's methodological ideal. Rigorous evolutionary psychology uses task analysis to predict exactly how a mechanism should operate under specific conditions, often producing counter-intuitive results that general-purpose learning theories cannot explain. For example, rather than simply stating "men prefer youth," researchers test specific trade-offs in mate valuation across varying ecological conditions to see if the data fits the adaptive model better than competing social-constructivist models. When these predictions fail—as they sometimes do—the hypotheses are revised or discarded, which is the hallmark of science, not speculation.

  Consequently, the verdict that EP is pseudoscience does not follow from the accurate parts of the summary. While it is true that reconstructing ancestral environments involves uncertainty, all historical sciences (like cosmology or geology) face similar constraints without being dismissed as unscientific. The field meets the demarcation criteria of science because it generates risky, falsifiable predictions about observable phenomena in the present. A defender would conclude that while specific evolutionary hypotheses may be wrong, the framework itself is a legitimate scientific paradigm that integrates psychology with biology, rather than mere speculation dressed in evolutionary language.
