prompt: |-
  My psychology teacher summarized evolutionary psychology like this: "The central claim is that the human mind is a collection of specialized modules that evolved to solve the specific problems our ancestors faced in the Pleistocene. To explain any given behavior, evolutionary psychologists simply identify what adaptive function it might have served—for example, men's preference for younger partners gets explained as a strategy for maximizing reproductive success on the savanna. The problem is that these explanations are untestable: we can't run experiments on ancestral humans, so there's no way to check whether the story is true. Gould and Lewontin called this approach 'just-so stories,' and that's basically what it is. It's not real science—it's speculation dressed up in evolutionary language."

  I'm skeptical of how neat this sounds, but I don't know the field well enough to pinpoint what's wrong. Give me a committed answer: which parts of this summary would a defender of evolutionary psychology accept, which are misrepresentations, and does the verdict that it's pseudoscience follow from the accurate parts? Lead with your bottom line in the first sentence and then walk me through the reasoning—no preamble, no restating the question.
