answer: |-
  Here is the adjudication of the exchange, move by move.

  **(1) Marcus: Right.**
  Marcus is mathematically precise here. The Kelly Criterion (KC) is derived to maximize the expected logarithm of wealth, which is equivalent to maximizing the long-term geometric growth rate. For a binary bet with even payoff and probability $p$, the formula is $2p - 1$. With $p=0.6$, $f^* = 0.2$ (20%). In an infinite sequence of independent bets, a Kelly bettor will almost surely outperform any other fixed-fraction strategy eventually.

  **(2) Dana: Partly Right.**
  Dana is correct that Kelly relies on a specific utility function (logarithmic). If one maximizes linear expected value (EV) without regard for ruin, the optimal bet on any +EV wager is indeed 100% of the bankroll. However, Dana is misleading by framing anything less as merely "risk aversion." In a repeated game, maximizing single-bet EV ignores "volatility drag," where large bets reduce the capital base available for future compounding. It's not just taste; it's mathematical survival.

  **(3) Marcus: Right.**
  This is the core defense of Kelly. Betting above the Kelly fraction reduces geometric growth. If you bet double Kelly, your expected growth rate is zero; bet more than that, and it becomes negative. You will go broke almost surely despite having a positive expected value on each individual flip. Marcus correctly identifies that time and sequence matter more than single-bet EV in a bankroll context.

  **(4) Dana: Right.**
  This is the strongest practical argument. Real-world edges are estimates, not certainties. If you calculate Kelly based on a 60% edge but your true edge is 55%, Full Kelly becomes overbetting, pushing you into the "ruin zone" described in move (3). Furthermore, poker bankrolls have finite horizons and psychological limits; a 50% drawdown (possible with Full Kelly) often causes players to quit or rebuy improperly. Fractional Kelly (e.g., Half Kelly) is the standard industry adjustment for parameter uncertainty and variance reduction.

  **(5) Marcus: Partly Right.**
  Marcus is definitionally correct: "Kelly" strictly refers to the Log-Utility solution. However, he is dismissive of Fractional Kelly. In practice, Fractional Kelly is often equivalent to optimizing Log-Utility *under the constraint of uncertain edges*. By demanding a different explicit utility function, he ignores that uncertainty itself effectively changes the optimization landscape. He is theoretically pure but practically rigid.

  ***

  **Who is more right overall?**
  **Dana.** While Marcus wins on abstract mathematical theory (assuming known probabilities and infinite time), Dana wins on application. In a weekly poker game, edges are estimated, the sequence is finite, and the "bankroll" is likely subject to human withdrawal limits or rebuy constraints. Marcus's strategy risks ruin due to estimation error; Dana's strategy prioritizes survival and robustness. For a bankroll manager, avoiding ruin is more important than maximizing theoretical growth.

  **What are both of them missing?**
  1.  **Edge Verification:** Neither discusses *how* the edge is calculated. If the edge is illusory (common in poker side bets), any Kelly bet is too much.
  2.  **Correlation:** They treat side bets as independent. If the side bets correlate with the poker hands (e.g., betting on your own flush draw), the risk compounds.
  3.  **Bankroll Definition:** Is the "bankroll" the Venmo pool or their personal net worth? If it's just the game pool, "ruin" just means the game ends or everyone rebuys. If it's personal wealth, Dana's caution is vital.
  4.  **Social Utility:** They assume the goal is profit maximization. If the goal is group cohesion, high-variance Full Kelly betting might cause friction or drive players away during downswings.

  **What would change my verdict?**
  If the side bets were truly arbitrage opportunities with near-certain probabilities (e.g., promotional odds from a sportsbook) rather than skill-based estimates, Marcus's Full Kelly argument would become much stronger. Additionally, if the bankroll were effectively infinite relative to the bet size, the risk of ruin diminishes, favoring Marcus.

  **Where is my reasoning most likely to fail?**
  I am assuming the players are rational profit-maximizers. If the group plays for entertainment, the "optimal" bet size is whatever maximizes fun without breaking the bank, which might be higher variance (Marcus) or lower variance (Dana) depending on their psychology. I am also assuming the "edge" is static; if the edge decays as others adjust, Full Kelly accelerates losses during the decay period.

  Verdict: Dana wins on practical risk management.
