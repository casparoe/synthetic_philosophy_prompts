  5.  **Addressing the "Equal Time" Conclusion:**
      *   Which readings license it? Only Claim 3 and 4 (and maybe a distorted version of 2).
      *   Which readings block it? Claim 1 and the accurate understanding of Claim 2. If Darwinism is a *productive* framework, it earns its place. ID is generally not a *productive* research programme.

  6.  **Analyzing "Metaphysical Research Programme":**
