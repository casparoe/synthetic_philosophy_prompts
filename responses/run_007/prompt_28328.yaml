  2.  **Deconstruct the Popper Quote:**
      *   *Quote:* "I have come to the conclusion that Darwinism is not a testable scientific theory, but a metaphysical research programme---a possible framework for testable scientific theories."
      *   *Key Terms:* "Testable scientific theory," "Metaphysical research programme," "Framework."
      *   *Historical Context:* Popper initially (1970s) worried about the tautological nature of "survival of the fittest." Later (1978 onwards), he clarified that specific evolutionary models *are* testable, even if the general principle is hard to isolate.

  3.  **Drafting the Distinct Claims (The Conceptual Map):**
      *   I need a spectrum from weak/methodological to strong/ontological.
      *   *Claim 1 (The Weak/Methodological Reading):* The *general statement* of natural selection is hard to test in isolation without specific auxiliary hypotheses. It's a guiding principle.
      *   *Claim 2 (The Demarcation Reading):* Darwinism fails the falsifiability criterion strictly speaking, placing it outside "science" in a narrow Popperian sense, but still useful.
      *   *Claim 3 (The Dogma Reading):* Darwinism is untestable in practice, protected from refutation, and therefore irrational/dogmatic.
      *   *Claim 4 (The Equivalence Reading):* Because Darwinism is "metaphysical," other metaphysical views (like ID) are epistemically equivalent in a science classroom.

  4.  **Evaluating the Claims:**
      *   *Claim 1:* True/Defensible. General principles often need specific models to be tested. This is standard philosophy of science (Duhem-Quine).
