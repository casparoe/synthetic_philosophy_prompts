prompt: |-
  I recently took over managing a small investment pool for several family members—nothing institutional, just a handful of people who wanted their savings to do more than sit in a money-market account—and in trying to think rigorously about position sizing, I kept running into the Kelly criterion. The standard advice in the retail-investing world treats it as a kind of golden rule: never bet more than the Kelly fraction, because doing so reduces your long-run growth rate and eventually guarantees ruin. But when I tried to reconcile this with the expected utility framework I learned in graduate school, I found myself genuinely confused about what was being claimed. If the Kelly rule is simply expected utility maximization with a logarithmic utility function, then the debate collapses into a question about whether log utility is the right utility function—and that seems like a familiar, perhaps even tired, normative question. But if the Kelly rule is making a different kind of claim altogether—something about time and ergodicity rather than about risk preferences—then we seem to have two distinct notions of rationality that sometimes issue contradictory directives, and it is not obvious which one should govern in a given decision context.

  I want to get clear on the conceptual relationship between the Kelly criterion and orthodox expected utility theory. In particular: are they genuinely rival normative frameworks, or does the Kelly rule reduce to expected utility theory under a particular parameterization, with the real disagreement being about whether that parameterization is uniquely privileged? If they are rivals, what exactly is the locus of the disagreement—does it turn on the treatment of repeated gambles, on the normative relevance of time averages versus ensemble averages, on attitudes toward ruin, or on something else? And if they are not rivals, what explains the persistent sense among sophisticated people (on both sides) that something important separates them? I am less interested in being told which view is correct than in understanding what would have to be true for one view to win over the other—what the decisive considerations would be, and whether the dispute is ultimately normative, conceptual, or empirical. I would also appreciate any clarity on whether the ergodicity economics literature associated with Ole Peters and others has successfully reframed the question or has merely reintroduced old ideas in new language.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the User's Query:**

      *   **Context:** Managing a small family investment pool (non-institutional, but serious).
      *   **Problem:** Encountered the Kelly Criterion (KC) while thinking about position sizing.
      *   **Conflict:** Standard retail advice says KC is a "golden rule" (don't exceed it or face ruin/reduced growth). Graduate school training says Expected Utility Theory (EUT) is the standard.
      *   **Core Question:** What is the conceptual relationship between KC and EUT?
          *   Are they rival normative frameworks?
          *   Does KC reduce to EUT with log utility?
          *   If rivals, where is the locus of disagreement (time vs. ensemble, ruin, etc.)?
          *   If not rivals, why does it *feel* like they are distinct?
      *   **Specific Interest:** The ergodicity economics literature (Ole Peters et al.). Is it a reframing or just new language?
      *   **Goal:** Understand the decisive considerations, the nature of the dispute (normative, conceptual, empirical), and what would make one view "win."
      *   **Tone:** Sophisticated, academic but practical, nuanced, avoiding dogmatism.

  2.  **Initial Assessment & Fact-Checking:**

      *   *Kelly = Log Utility?* Yes, mathematically, maximizing the expected geometric growth rate (Kelly) is equivalent to maximizing expected utility with a logarithmic utility function of wealth ($U(W) = \ln(W)$). This is a standard result (Breiman 1961, etc.).
      *   *EUT Framework:* EUT requires specifying a utility function. The choice of utility function is normative/subjective.
      *   *Ergodicity Economics (Peters):* Argues that EUT conflates ensemble averages (expectations across parallel worlds) with time averages (expectations over time in one world). Claims KC is about time-average growth, not risk preference.
      *   *The "Rivalry":* If KC is just Log-EUT, the rivalry is about *which* utility function is appropriate. If Peters is right, the rivalry is about *how* to calculate value (time average vs. ensemble average).
      *   *Nuance:* Most economists view KC as a specific case of EUT. Peters views EUT as fundamentally flawed for non-ergodic processes.

  3.  **Structuring the Response:**

      *   **Introduction:** Acknowledge the sophistication of the question. Validate the confusion (it's a deep foundational issue). State the thesis: KC is mathematically equivalent to Log-EUT, *but* the justification for *why* Log-EUT differs between the two frameworks (risk preference vs. time dynamics).
      *   **Section 1: The Mathematical Equivalence (The Reductionist View).**
          *   Show that maximizing geometric growth rate $\equiv$ maximizing $E[\ln(W)]$.
          *   In standard EUT, this makes KC a special case, not a rival.
          *   The debate here is purely about the choice of utility function (CRRA with $\gamma = 1$).
      *   **Section 2: The Ergodicity Reframing (The Rival View).**
          *   Explain Peters' argument: EUT uses ensemble averages; reality is a time average.
          *   Non-ergodicity: Wealth paths don't converge to the expectation.
          *   KC becomes the solution to maximizing time-average growth, *independent* of risk preference.
          *   This makes it a conceptual rival, not just a parameterization.
      *   **Section 3: Locus of Disagreement.**
          *   *Normative:* Is risk aversion a psychological preference (EUT) or a physical constraint of compounding (Ergodic)?
          *   *Temporal:* One-shot vs. Repeated. KC fails in one-shot (Log utility might still apply, but "growth rate" doesn't make sense).
          *   *Ruin:* EUT handles ruin via $U(0) = -\infty$. KC handles it via the math of compounding.
      *   **Section 4: Evaluating the Ergodicity Claim.**
          *   Has Peters changed the game?
          *   Critique: Log utility was already known to maximize growth. Is the "ergodicity" label new insight or rebranding?
          *   Key insight: It shifts the burden of proof from "Why are you risk averse?" to "Why are you assuming parallel universes?"
      *   **Section 5: Practical Implications for the Family Pool.**
          *   Full Kelly is volatile (drawdowns).
          *   Fractional Kelly is standard (accounts for estimation error + utility curvature steeper than log).
          *   Decision framework: If the goal is multi-generational wealth (infinite horizon), Log/Kelly is strong. If the goal is specific liabilities, EUT with specific utility is better.
      *   **Conclusion:** Summarize the nature of the dispute. It's largely normative/philosophical regarding the definition of rationality over time.

  4.  **Drafting the Content - Key Points to Refine:**

      *   *Clarify the Math:* Don't get bogged down in formulas, but state the equivalence clearly. $\max E[\ln(W_T)] \leftrightarrow \max \text{Geometric Mean}$.
      *   *The "Rivalry" Nuance:* Standard finance says "Kelly is Log-EUT." Peters says "EUT is wrong, Kelly is Time-Average." I need to make sure the user sees that *even if* Peters is right, the *action* is often the same, but the *justification* changes.
      *   *Estimation Error:* A critical practical point. Kelly assumes you know the probabilities. In reality, you don't. Overbetting Kelly is disastrous. This is where "Fractional Kelly" comes in, which implicitly assumes a utility function *more* risk-averse than Log.
      *   *Ergodicity:* Be careful not to oversell Peters. Mainstream economics acknowledges the time/ensemble distinction but argues EUT can accommodate it via dynamic programming. Peters argues EUT *structurally* ignores it. I should present this balance.
      *   *The "Win" Condition:* What would decide this?
          *   If rationality is defined as consistency with axioms (von Neumann-Morgenstern), EUT wins.
          *   If rationality is defined as survival/growth in a single realized timeline, Ergodic/Kelly wins.
          *   It's a choice of meta-ethics for decision theory.

  5.  **Refining the Tone:**

      *   The user is academically trained ("graduate school"). Use precise terminology (von Neumann-Morgenstern, CRRA, ergodicity, non-ergodic, geometric vs. arithmetic mean).
      *   Avoid giving financial advice, but address the management context.
      *   Maintain neutrality. The prompt asks for clarity on the relationship, not a verdict on which is "correct."

  6.  **Self-Correction/Review during drafting:**

      *   *Check:* Did I address the "ruin" aspect?
      *   *Correction:* Ensure I mention that Log utility implies infinite disutility at zero wealth, which aligns with avoiding ruin, but EUT allows other functions that also avoid ruin.
      *   *Check:* Did I address the "one-shot" vs "repeated" issue?
      *   *Correction:* Crucial distinction. Kelly is inherently about repeated betting. EUT applies to one-shot too.
      *   *Check:* Is the Peters critique fair?
      *   *Correction:* Acknowledge that while the math of growth optimization is old (Latane, Breiman, Thorp), the *interpretation* as a fundamental critique of EUT is the newer contribution.

  7.  **Final Polish:** Organize into clear headings. Ensure the conclusion directly answers the "what would have to be true" question. (Proceed to generate output based on these thoughts.)

  *(Self-Correction Note during final review)*: I need to make sure I don't conflate "Kelly" (the formula) with "Growth Optimal Portfolio" (the general concept). They are effectively the same in this context, but precision helps. Also, emphasize that "Full Kelly" is rarely used in practice due to parameter uncertainty, which effectively moves the agent away from Log utility anyway.

  8.  **Final Output Structure:**
      1.  Executive Summary.
      2.  The Reductionist View (Kelly $\subset$ EUT).
      3.  The Ergodic View (Kelly $\perp$ EUT).
      4.  The Locus of Disagreement (Time, Risk, Ruin).
      5.  Assessing the Ergodicity Literature.
      6.  Decisive Considerations (What would settle it?).
      7.  Practical Synthesis for the Family Pool.

