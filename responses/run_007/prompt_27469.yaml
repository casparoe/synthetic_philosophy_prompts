answer: |-
  This is an exceptionally well-posed question that cuts to the foundation of decision theory under uncertainty. The confusion you are experiencing is not a bug in your understanding; it is a feature of a genuine, unresolved tension in the economics of risk.

  To answer your core question directly: **Mathematically, the Kelly criterion is equivalent to Expected Utility Theory (EUT) with a logarithmic utility function.** However, **conceptually, the ergodicity economics literature argues that Kelly is a distinct framework that renders the utility function irrelevant.**

  Whether these are rivals or subsets depends entirely on whether you view risk aversion as a *psychological preference* (the EUT view) or a *mathematical necessity of compounding in time* (the Ergodic view).

  Here is a breakdown of the conceptual relationship, the locus of disagreement, and an assessment of the ergodicity reframing.

  ---

  ### 1. The Reductionist View: Kelly as a Special Case of EUT

  In orthodox financial economics (the Merton/Samuelson tradition), the Kelly criterion is not a rival to EUT; it is a specific parameterization of it.

  *   **The Math:** If you maximize the expected value of the logarithm of wealth, $E[\ln(W)]$, you are mathematically maximizing the expected geometric growth rate of your portfolio. The Kelly fraction is the solution to this optimization problem.
  *   **The Implication:** Under this view, the "debate" is purely about the choice of the utility function $U(W)$.
      *   If $U(W) = W$ (risk-neutral), you maximize arithmetic mean return (often leading to ruin via over-leverage).
      *   If $U(W) = \ln(W)$ (Log utility), you maximize geometric growth (Kelly).
      *   If $U(W) = W^{1-\gamma}/(1-\gamma)$ with $\gamma > 1$ (CRRA), you bet less than Kelly.
  *   **The Normative Claim:** There is nothing inherently "rational" about Log utility. It is simply one risk profile among many. An agent with $\gamma = 2$ is not "irrational" for betting half-Kelly; they simply have higher relative risk aversion. The warning "never bet more than Kelly" is shorthand for "never bet more than the amount that maximizes growth, because Log utility implies infinite disutility at zero wealth, and betting more than Kelly reduces growth and increases volatility."

  **Verdict:** In this framework, Kelly is not a rival. It is the optimal strategy *if and only if* your utility function is logarithmic. The disagreement is normative: *Should* a long-term investor have Log utility?

  ### 2. The Ergodic View: Kelly as a Physical Constraint

  The literature associated with Ole Peters (and earlier work by Latané, Breiman, and Thorp) challenges the EUT framework itself. This is where the "rivalry" becomes genuine.

  *   **The Ergodicity Problem:** EUT calculates value using an **ensemble average** (the average outcome across many parallel universes). However, investors live in **time** (a single trajectory). For multiplicative dynamics (compounding wealth), the ensemble average and the time average are not equivalent. The process is *non-ergodic*.
  *   **The Claim:** Peters argues that using ensemble averages (standard EUT) for non-ergodic processes is a category error. You cannot substitute "risk preference" for the physical reality that a 50% loss requires a 100% gain to recover.
  *   **The Reframing:** In this view, maximizing the time-average growth rate is not a *preference*; it is the condition for long-term survival and maximization in a single realized timeline. The logarithm enters the equation not because the agent *likes* log wealth, but because $\ln(W)$ is the function that converts multiplicative dynamics into additive dynamics, making the time average calculable.
  *   **The Implication:** Risk aversion is not a psychological parameter ($\gamma$); it is an emergent property of the dynamics. Even a "risk-neutral" agent (who cares only about final wealth) should bet Kelly if they plan to reinvest over a long horizon, because betting more than Kelly guarantees lower wealth in the limit of time, regardless of their "utility."

  **Verdict:** In this framework, Kelly and EUT are rivals. EUT relies on a counterfactual ensemble; Kelly relies on the actual time evolution of wealth.

  ### 3. The Locus of Disagreement

  If these frameworks issue contradictory directives, the disagreement turns on three specific axes:

  #### A. Time Horizon and Repeatability
  *   **EUT:** Applies equally to one-shot and repeated gambles. If you face a single, non-repeatable bet with positive expected value, EUT (with linear utility) might suggest betting everything.
  *   **Kelly:** Is inherently about *repeated* exposure. If the bet is truly one-off and you never invest again, the geometric growth rate is irrelevant. Kelly has no normative force in a one-shot scenario unless you assume Log utility for other reasons.
  *   **Decisive Consideration:** Is the investment pool a single consumption event or a perpetual endowment? If the latter, the time-average argument gains strength.

  #### B. The Source of Risk Aversion
  *   **EUT:** Risk aversion is exogenous. It comes from the curvature of the utility function, reflecting diminishing marginal utility of consumption or psychological discomfort with variance.
  *   **Ergodic/Kelly:** Risk aversion is endogenous. It comes from the volatility drag on compounding. You avoid ruin not because you fear it psychologically, but because ruin removes you from the game, making the expected value of future bets zero.
  *   **Decisive Consideration:** Can we distinguish between "I don't want to lose money because it hurts" vs. "I don't want to lose money because I can't recover"?

  #### C. Treatment of Ruin
  *   **EUT:** Handles ruin by assigning $U(0) = -\infty$. This is an axiom imposed on the function.
  *   **Kelly:** Handles ruin via the math. If you bet more than Kelly (over-leverage), the geometric mean becomes negative. Ruin is a dynamic inevitability, not just a utility penalty.
  *   **Decisive Consideration:** Is ruin a boundary condition (EUT) or a dynamic attractor (Kelly)?

  ### 4. Has Ergodicity Economics Reframed the Question?

  You asked whether Peters et al. have successfully reframed the question or merely reintroduced old ideas. The answer is **both.**

  *   **Reintroduction:** The mathematical equivalence between Log utility and geometric growth maximization was well-established in the 1960s (Breiman, 1961; Latané, 1959). Samuelson (1969) famously critiqued Kelly, arguing that maximizing geometric mean does not maximize expected utility for finite horizons unless $U = \ln$. The math hasn't changed.
  *   **Reframing:** The contribution of the ergodicity literature is philosophical and foundational. It shifts the burden of proof.
      *   *Old Debate:* "Why do you choose Log utility?" (A question about taste).
      *   *New Debate:* "Why are you using ensemble averages for a non-ergodic process?" (A question about modeling validity).
      *   By framing risk aversion as a physical constraint of time rather than a psychological preference, Peters attempts to make Kelly *objective* rather than *subjective*.

  **Critique of the Ergodic View:** Mainstream economists argue that EUT can accommodate time dynamics through dynamic programming and that "time average" maximization is just EUT with a specific horizon and reinvestment assumption. They argue Peters creates a straw man of EUT by assuming static, one-period utility functions are applied to dynamic problems.

  ### 5. What Would Settle the Dispute?

  You asked what would have to be true for one view to win over the other.

  **For the Ergodic/Kelly view to "win":**
  It must be demonstrated that rational agents *cannot* consistently maximize ensemble expectations in non-ergodic environments without facing dynamic inconsistency or sure loss over time. It requires accepting that **rationality is defined by survival in the single realized timeline**, not by consistency with axioms of choice across hypothetical parallel worlds. If "rationality" is defined as "not going bust in the long run," Kelly wins.

  **For the EUT view to "win":**
  It must be demonstrated that agents have legitimate objectives other than long-run wealth maximization (e.g., specific liability matching, consumption smoothing, or legacy goals that do not scale logarithmically). If an agent has a utility function where $U(W)$ flattens significantly after a certain wealth threshold (satiation), Kelly is suboptimal. EUT wins if we accept that **risk preferences are heterogeneous and valid**, even if they sacrifice long-run growth for short-run stability.

  **The Empirical Reality:**
  Empirically, most sophisticated investors (including those who cite Kelly) use **Fractional Kelly**. They bet, say, half the Kelly fraction.
  *   **EUT Interpretation:** This implies their true utility function is more risk-averse than Log ($\gamma > 1$).
  *   **Ergodic Interpretation:** This is a heuristic to account for **estimation error**. The Kelly fraction assumes you know the true probabilities. If you overestimate your edge, Full Kelly leads to ruin. Fractional Kelly creates a safety margin against model error.

  ### 6. Synthesis for Your Family Pool

  Given your context (managing a family pool, long-term horizon, non-institutional), here is how to reconcile the frameworks practically:

  1.  **Acknowledge the Equivalence:** Accept that Full Kelly $\equiv$ Log Utility. If you adopt Full Kelly, you are implicitly committing to a specific risk profile.
  2.  **Acknowledge the Time Constraint:** Acknowledge that for a perpetual pool, geometric growth is the primary constraint. Arithmetic return is irrelevant if volatility drags the geometric mean to zero. This validates the Kelly *insight* even if you reject the ergodic *philosophy*.
  3.  **The Decisive Factor is Parameter Uncertainty:** The strongest argument against Full Kelly is not utility theory; it is epistemology. You do not know the true expected returns or variances.
      *   If you estimate an edge of 10% but it is actually 5%, Full Kelly bets too much and you lose.
      *   Therefore, **Fractional Kelly** is the robust solution. It satisfies the EUT requirement (allowing for $\gamma > 1$) and the Ergodic requirement (protecting against model error in the time series).

  ### Conclusion

  The Kelly criterion and Expected Utility Theory are **mathematically compatible but philosophically distinct.**

  *   **Mathematically:** Kelly is EUT with $U(W) = \ln(W)$.
  *   **Philosophically:** EUT views this as a subjective preference; Ergodic economics views this as an objective requirement of time.

  The dispute is **normative and conceptual**, not empirical. It turns on whether you believe the goal of investment is to maximize the expectation of a subjective value function (EUT) or to maximize the growth rate of wealth in the single timeline we inhabit (Kelly/Ergodic).

  For your family pool, the "winning" view is likely a hybrid: Use the Kelly framework to determine the *upper bound* of risk (to respect the physics of compounding and ruin), but use EUT reasoning to determine your *actual* position size (to respect the family's specific consumption needs and your own uncertainty about the inputs). The "golden rule" of never exceeding Kelly holds, not because Log utility is the only valid utility, but because exceeding Kelly sacrifices growth *and* increases risk simultaneously—a dominance violation in almost any framework.

  **Recommended Reading for Clarity:**
  *   *Samuelson, P. A. (1969). "Lifetime Portfolio Selection by Dynamic Stochastic Programming."* (The classic EUT critique of Kelly).
  *   *Peters, O., & Gell-Mann, M. (2016). "Evaluating gambles using dynamics."* (The modern ergodicity argument).
  *   *Thorp, E. O. (2006). "The Kelly Criterion in Blackjack Sports Betting, and the Stock Market."* (The practical bridge between the two).
