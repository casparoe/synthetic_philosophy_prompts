prompt: |-
  I host a podcast about science and ideas, and in two weeks I'm interviewing a philosopher who's known for pushing the scale argument about insect sentience — the line that even if it's pretty unlikely that any particular insect is conscious, the number of insects alive at any moment is so enormous that the expected amount of sentient life at stake is huge, so we should take insect welfare (including maybe wild insect suffering) seriously. I want a list of 8 to 10 questions that force him to actually defend the moving parts of the argument instead of just restating it. I especially want at least one question each on: (a) whether the argument needs a floor on the probability and what could supply it, and where it loses it's force; (b) the nociception-versus-pain distinction and whether the argument works even if insects are just little reflex machines with no felt states; (c) why the same expected-value reasoning doesn't just extend to plants, bacteria, or simple future AI; and (d) what the argument actually demands of an ordinary person — am I supposed to stop driving? For each question, give me a follow-up that's keyed to the answer he's most likely to give, so I can push back when he reaches for the standard reply. And write the whole thing in American English.
