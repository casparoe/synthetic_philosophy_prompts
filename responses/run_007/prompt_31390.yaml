  - Is "side effect" vs "intended effect" a real distinction in the world, or is the distinction itself value-laden all the way down? If the latter, the whole project is probably dead from the start.
  - Can impact even be defined counterfactually against a "what would have happened anyway" baseline without that baseline smuggling in a pile of values?
  - Does the attainable-utility-preservation-style move (penalize the agent for reducing the achievable utility under a broad prior over goals) actually avoid needing a full specification of value, or is it just a full specification wearing a probability distribution?
  - Conditional on a finite impact measure existing, how likely is it that a sufficiently capable optimizer finds a way to do enormous things the measure doesn't penalize — the Goodhart-shaped worry applied specifically to impact?
  - How much of this changes if we're talking about roughly human-level agents vs strongly superhuman ones?

  Give me a probability for each of those, say how you're combining them (and where you're assuming independence), then tell me which single sub-question your final number is most sensitive to and what evidence or argument would move it the most. And if you think I've framed the claim wrong, say what the right framing is — but still give me the number.
