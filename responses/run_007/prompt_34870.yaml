answer: |-
  This is a fantastic reconstruction. You have captured the exact tension that makes the *White Horse Dialogue* (Bai Ma Lun) so enduringly frustrating and fascinating. You have also correctly identified that the argument, as formalized in natural language, threatens to collapse into a *reductio ad absurdum* (your steps 4 and 5).

  To answer your question directly: **You should reject the inference from (2) to (3) *if* step (3) is understood as a claim about class membership (predication).**

  However, to preserve the School of Names' insight about compound terms, you should **accept step (3) *if* it is understood as a claim about concept identity.**

  Here is the breakdown of where the argument goes "wrong" (or rather, where the ambiguity lies), how to fix it for your lecture, and what philosophical cost comes with the fix.

  ### 1. The Diagnosis: The Ambiguity of *Fei* (Not)

  The entire dialogue turns on the Chinese character *fei* (非), translated here as "is not." In modern logic and English, "is not" carries two distinct meanings that Gongsun Long deliberately conflates:

  1.  **Non-Identity ($A \neq B$):** The concept "White Horse" is not identical to the concept "Horse."
  2.  **Non-Membership/Predication ($A \notin B$):** An object that is a white horse is not a member of the class of horses.

  Your reconstruction exposes this perfectly.
  *   **Steps (1) and (2)** establish **Non-Identity**. (The request conditions differ, so the names/concepts differ.)
  *   **Step (3)** slides into **Non-Membership**. (Because the names differ, a white horse *is not a* horse.)
  *   **Steps (4) and (5)** exploit this slide to generate absurdity. If "White Horse is not Horse" means "No white horse is a member of the class of horses," then by parallel reasoning, "White Horse is not White" means "No white horse possesses the property of whiteness."

  ### 2. The Solution: Reject the Predicative Reading of (3)

  To save the argument from absurdity while keeping its philosophical work, you must tell your students that **Step (3) is true only as a claim about names/concepts, not objects.**

  *   **Reject:** "A white horse is not a horse" $\rightarrow$ "Objects that are white horses are excluded from the category of horses."
  *   **Accept:** "A white horse is not a horse" $\rightarrow$ "The compound concept 'White Horse' is not identical to the simple concept 'Horse'."

  **Why this saves the "Compound Term" insight:**
  Gongsun Long's real project is about *ming* (names) and *zhi* (reference/intention). He is arguing that when you modify a term, you create a new, rigid reference.
  *   "Horse" refers to the *form* (shape).
  *   "White" refers to the *color*.
  *   "White Horse" refers to the *compound* of form + color.

  Because the compound is a distinct semantic unit, it cannot be reduced to its parts. "White Horse" $\neq$ "Horse." This is a profound insight into semantic compositionality: adding a modifier changes the reference conditions (as you showed in Step 1).

  ### 3. Addressing the *Reductio* (Your Steps 4 & 5)

  Your *reductio* is the strongest part of your reconstruction. Here is how to handle it in class:

  You can actually concede Step (4) to Gongsun Long! He would agree that **"The term 'White Horse' is not the term 'White'."**
  *   Request for "White": Satisfied by a white stone.
  *   Request for "White Horse": Not satisfied by a white stone.
  *   Therefore: The names are different.

  **The error is in Step (5).** Step (5) claims it is absurd that "a white horse is not white."
  *   **If "is not" means Non-Membership:** Yes, it is absurd. (It implies the horse lacks whiteness).
  *   **If "is not" means Non-Identity:** It is **not** absurd. The *concept* "White Horse" is indeed not identical to the *concept* "White." One is a substance-kind, the other is a property-kind.

  Gongsun Long is not denying that the animal has the property of whiteness. He is denying that the *name* "White Horse" is interchangeable with the *name* "White."

  ### 4. What Does This Cost? (The Philosophical Price)

  If you teach it this way, you save Gongsun Long from being a mere sophist who denies obvious facts. However, there is a cost to this interpretation that you should be honest about with your students.

  **Cost 1: Fragmented Ontology**
  By insisting that "White Horse" and "Horse" name different things, Gongsun Long fragments the world into rigid, non-overlapping semantic boxes. In standard logic, "White Horse" is a subset of "Horse." For Gongsun Long, they are distinct *kinds* (lei). This makes inference difficult. If "White Horse" is not "Horse," can I infer that because all horses are animals, all white horses are animals? Gongsun Long's strict semantics makes standard syllogistic reasoning shaky.

  **Cost 2: The Separation of Name and Object**
  You have to commit to the idea that the argument is primarily about **language**, not **metaphysics**. The "absurdity" only arises if we think he is talking about the physical animal. If he is talking about the *name*, the argument is valid. This requires students to shift from an ontological reading ("What is the horse?") to a semantic reading ("What does the word 'horse' pick out?").

  **Cost 3: It Makes Him Less Radical (in a way)**
  The shock value of "A white horse is not a horse" is that it sounds like a denial of reality. If you explain it as "The concept 'White Horse' is not identical to the concept 'Horse'," it sounds like a boring tautology. You lose the paradoxical punch, but you gain logical coherence.

  ### Suggested Revision for the Lecture

  I recommend modifying your Step (3) to make the ambiguity explicit for the students.

  > **(3)** And from that it concludes that the term "white horse" is not identical to the term "horse." (Note: This does *not* necessarily mean a white horse is not a member of the class of horses, but that the *description* is different).
  >
  > **(4*)** *Objection:* But apply this to "white." The term "white horse" is not identical to the term "white."
  >
  > **(5*)** *Response:* True. The compound name is not the property name. But this does not imply the object lacks the property. It only implies the *names* are not interchangeable in a request.

  ### Summary
  *   **Reject:** The inference that different names imply class exclusion (Non-Membership).
  *   **Accept:** The inference that different names imply concept distinction (Non-Identity).
  *   **Cost:** You must teach the School of Names as semanticists concerned with the rigidity of reference, rather than metaphysicians denying biological classification.

  This approach allows you to keep the core insight (compound terms fix reference differently than simple terms) without committing the class of white horses to a limbo where they are neither equine nor colored.
