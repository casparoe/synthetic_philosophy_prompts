prompt: |-
  I'm a backend engineer, so a lot of my job is designing APIs or reverse-engineering someone else's poorly documentd service from whatever request/response pairs I can provoke. A collegue has been going on about Quine's indeterminacy of translation, the gavagai story where a field linguist sees a rabbit, a native says gavagai, and Quine's point is supposedly that even with all possible behavioral evidence you still can't settle whether the word means rabbit, undetached rabbit parts, rabbit time-slices, rabbitness, or whatever — different translation manuals all fit the data equally well and there's no fact of the matter about which one is right. I follow the example but I don't trust that I'm getting the actual claim, since I've got no philosophy background and my collegue tends to overstate things.

  Restate Quine's position in vocabulary I actually use: black-box reverse engineering, schemas and type inference, conformance testing against a spec, interface vs implementation, overfitting to a training distribution. Then give me the residue report — what translates cleanly, what you had to fudge, and what has no counterpart in how I'd naturally think about an unknown system. My instinct is that of course there's a fact of the matter about what the native means, same as there's a fact of the matter about what an endpoint's response fields really mean in the server's schema; I just might not be able to recover it from outside. Does that instinct survive contact with Quine's actual claim, or is it exactly the assumption he's trying to get me to drop? I want to know whether "it's just reverse engineering" is a decent model or is smuggling something in, and whether the untranslatable part is a gap in my vocabulary or a sign that Quine's position is less crisp than it looks.
