prompt: |-
  I keep encountering definitions of life — metabolic, evolutionary, thermodynamic, list-based — and each one seems to handle some cases beautifully and others not at all. Before I read another proposal, I want a clear specification of what a definition of life actually needs to accomplish. Write the desiderata: what any adequate definition of life must get right, with the case or consideration behind each requirement.

  Cover at least the following terrain. (i) Which entities must the definition count as clearly alive, and which must it count as clearly not alive? (ii) Which borderline cases — viruses, bacterial endospores, tardigrades in cryptobiosis, obligate intracellular parasites, synthetic minimal cells, self-replicating ribozymes, prions, a hypothetical robot that builds copies of itself from raw materials — must the definition handle, and what counts as handling them (a clean yes/no, a principled borderline, an explanation of why the case is ill-posed)? (iii) What distinctions must the definition respect — e.g., living vs. dead vs. never-alive vs. dormant, or life as a property of individual organisms vs. life as a property of lineages or ecosystems? (iv) What empirical results from biology must the definition be consistent with, and which results should it be allowed to treat as contingent facts about life on Earth rather than definitional constraints? (v) What theoretical work is the definition supposed to do — guide astrobiological search, set the boundary conditions for origins-of-life research, ground normative claims in bioethics, or something else — and how does the purpose constrain which requirements are genuine?

  Flag which requirements are non-negotiable and which reflect the interests of a particular camp. If some subset of the desiderata cannot be jointly satisfied — if any attempt to draw a clean line around the living must either exclude something we are unwilling to exclude or include something we are unwilling to include — identify that tension and say which requirement should give way. Finally, score the main families of definitions (metabolic, evolutionary/Darwinian, thermodynamic, list-based) against the list, and identify which single requirement knocks out the most candidates. A table for the scorecard is welcome.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the Request:**

      *   **Goal:** Create a specification of desiderata (requirements) for a definition of life.
      *   **Context:** The user is frustrated with existing definitions (metabolic, evolutionary, thermodynamic, list-based) because they all fail on edge cases. They want to know *what a definition needs to do* before evaluating specific definitions.
      *   **Required Terrain:**
          *   (i) Clear positives/negatives (humans/bacteria vs. rocks/fire).
          *   (ii) Borderline cases (viruses, spores, tardigrades, parasites, synthetic cells, ribozymes, prions, self-replicating robots).
          *   (iii) Distinctions (alive/dead/never-alive/dormant, individual vs. lineage).
          *   (iv) Empirical consistency (Earth biology vs. contingent facts).
          *   (v) Theoretical purpose (astrobiology, origins of life, bioethics, etc.).
      *   **Critical Analysis:** Flag non-negotiable vs. camp-specific requirements. Identify tensions/incompatibilities.
      *   **Evaluation:** Score existing definition families against the desiderata. Identify the "killer" requirement.
      *   **Format:** Clear specification, potentially a table for the scorecard.

  2.  **Drafting the Desiderata (The "Specification"):**

      *   *Requirement 1: Extensional Adequacy (The "Intuition Pump").* Must capture standard examples.
          *   *Case:* Humans, E. coli, Oak trees = Alive. Rocks, Fire, Crystals = Not Alive.
      *   *Requirement 2: Borderline Resolution.* Must handle the "grey zone."
          *   *Case:* Viruses, Spores, etc.
          *   *Constraint:* Doesn't necessarily need a binary Yes/No, but needs a *principled* reason for the ambiguity or a classification.
      *   *Requirement 3: State Distinction.* Must distinguish states of matter/being.
          *   *Case:* Alive vs. Dead (corpse) vs. Dormant (spore) vs. Never-Alive (virus?).
      *   *Requirement 4: Level of Agency.* Where does life reside?
          *   *Case:* Individual cell vs. Colony vs. Lineage.
      *   *Requirement 5: Earth-Contingency vs. Universality.*
          *   *Case:* DNA/Protein specific vs. General principles.
      *   *Requirement 6: Functional Utility.* What is the definition *for*?
          *   *Case:* Astrobiology needs broad; Bioethics needs narrow.

  3.  **Refining the Requirements (Non-negotiable vs. Camp-Specific):**

      *   *Non-negotiable:* Extensional adequacy on clear cases (Req 1). Consistency with established physics/chemistry (Req 5 part).
      *   *Camp-Specific:* Bioethics usually wants "sentience" or "individuality" (not a general definition of life). Astrobiology wants "universal" (not Earth-specific). Origins of Life (OoL) wants "process" rather than "state."
      *   *Tension:* The biggest tension is between *Individual State* (is this organism alive now?) and *Evolutionary Process* (is this lineage evolving?). Viruses kill the individual state definition; Dormant spores kill the metabolic definition.

  4.  **Analyzing the Borderline Cases (Requirement ii):**

      *   *Viruses:* The ultimate test. Evolutionary says yes (sometimes), Metabolic says no.
      *   *Spores/Tardigrades:* Metabolic says no (no metabolism), Intuition says yes (potentially alive).
      *   *Self-replicating Robots:* If they evolve, are they alive? (Evolutionary says yes).
      *   *Prions:* Protein folding. Usually no, but replicate.
      *   *Handling:* A good definition must explain *why* these are hard, not just force a yes/no.

  5.  **Analyzing Empirical Constraints (Requirement iv):**

      *   *Must respect:* Thermodynamics (open systems), Evolution (heritable variation), Chemistry (carbon/water is contingent, not definitional).
      *   *Contingent:* DNA, specific metabolic pathways, cellular structure.

  6.  **Analyzing Theoretical Purpose (Requirement v):**

      *   This is crucial. A definition for *bioethics* (when can I kill it?) is different from *astrobiology* (what should I look for?).
      *   *Constraint:* If the purpose is unspecified, the definition will fail. I need to make this a desideratum: "Purpose Clarity."

  7.  **Identifying the "Fatal Tension":**

      *   The "Process vs. State" problem.
      *   Life as a *property of an individual* (metabolic/physiological) conflicts with Life as a *property of a population* (evolutionary).
      *   *Verdict:* The evolutionary definition is currently the most robust scientifically, but it fails the "individual organism" intuition (e.g., a sterile mule is alive, but evolutionarily dead end). The metabolic definition fails on dormancy.
      *   *Which requirement gives way?* Likely the demand for a binary classification of *individuals*. Life is better defined as a *process* instantiated by individuals.

  8.  **Scoring the Definition Families:**

      *   *Metabolic:* Fails dormancy (spores). Fails viruses.
      *   *Evolutionary (NASA):* Good on viruses (maybe), good on robots. Bad on sterile individuals (mules).
      *   *Thermodynamic:* Too broad (includes flames/stars sometimes). Too abstract.
      *   *List-based (NASA 7 pillars):* Arbitrary. Fails edge cases by fiat.

      *   *Killer Requirement:* "Dormancy/State Distinction" kills Metabolic. "Individuality" kills Evolutionary. "Universality" kills List-based.
      *   *Most damaging:* The requirement to distinguish *Alive vs. Dormant* without reference to history/lineage.

  9.  **Structuring the Response:**

      *   **Introduction:** Acknowledge the frustration. State that "Life" is likely a cluster concept or a process, not a sharp boundary.
      *   **Section 1: The Desiderata Specification.** Break down into the 5 requested terrains. Mark Non-Negotiable (NN) vs. Contingent/Interest-Relative (IR).
      *   **Section 2: The Incompatibility Tension.** Explicitly address the "Process vs. State" conflict.
      *   **Section 3: Scorecard.** Table comparing definitions against desiderata.
      *   **Section 4: The Knockout.** Identify the specific requirement that causes the most failures.
      *   **Conclusion:** Recommendation on how to proceed (pluralism or process ontology).

  10. **Refining the Content (Self-Correction during drafting):**

      *   *Correction:* Make sure to distinguish between "Dead" and "Never Alive." A rock is never alive. A corpse is dead. A virus is... debated.
      *   *Correction:* Ensure the distinction between "Earth-contingent" and "Universal" is clear. DNA is contingent. Replication is universal.
      *   *Correction:* On the "Self-replicating robot": If it evolves, evolutionary definitions count it. Metabolic definitions might not if it doesn't exchange matter/energy in the biological sense.
      *   *Refinement on Tension:* The tension isn't just Process vs. State. It's also "Material Realization" vs. "Functional Organization."
      *   *Scoring:* Be honest. No definition scores 100%. The point is to show *why*.

  11. **Final Polish:** Check tone (analytical, philosophical but grounded in biology). Ensure all constraints from the prompt are met. (i) through (v) are covered. Table included. Tension identified.

  *(Self-Correction on the "Killer Requirement")*: I need to pick one. The requirement to "Assign a binary state to individuals independent of lineage history" is the strongest candidate for the knockout blow. It kills the evolutionary definition (sterile workers) and the metabolic definition (dormant spores).

  12. **Final Review against Prompt:**
      *   (i) Clear entities? Yes.
      *   (ii) Borderline cases? Yes.
      *   (iii) Distinctions (dead/dormant)? Yes.
      *   (iv) Empirical results? Yes.
      *   (v) Theoretical work? Yes.
      *   Flag NN vs Camp? Yes.
      *   Identify Tension? Yes.
      *   Scorecard? Yes.
      *   Knockout requirement? Yes.

  Proceed to generate output.cw
answer: |-
  # Specification of Desiderata for a Definition of Life

  The frustration you encounter is structural. "Life" is not a natural kind like "Gold" (defined by atomic number); it is a *functional cluster concept* describing a specific organization of matter. Consequently, no definition will satisfy all intuitions simultaneously.

  Below is the specification of what an adequate definition must accomplish, categorized by your five terrain requirements. Each desideratum is flagged as **Non-Negotiable (NN)** (must be met for the definition to be scientifically usable) or **Interest-Relative (IR)** (depends on whether the user is an astrobiologist, ethicist, or origin-of-life researcher).

  ---

  ## 1. Extensional Adequacy (The Core Intuitions)
  **Requirement:** The definition must correctly classify paradigm cases without recourse to ad-hoc exceptions.
  *   **Must Count as Alive (NN):** Multicellular eukaryotes (humans, oak trees), unicellular organisms (E. coli, archaea).
  *   **Must Count as Non-Alive (NN):** Inanimate matter (rocks, water), dissipative structures without heredity (flames, hurricanes, crystals).
  *   **Rationale:** If a definition classifies fire as alive (a common failure of thermodynamic definitions) or a human as non-alive (a failure of strict evolutionary definitions regarding sterile individuals), it fails extensional adequacy.

  ## 2. Borderline Resolution (The Grey Zone)
  **Requirement:** The definition must not force a binary Yes/No on borderline cases unless there is a principled physical basis for doing so. It must categorize the *nature* of the ambiguity.
  *   **Entities to Handle:**
      *   **Viruses:** (NN) Must explain why they replicate but lack autonomy.
      *   **Dormant States (Spores, Tardigrades):** (NN) Must distinguish "temporarily inactive" from "dead."
      *   **Obligate Intracellular Parasites:** (NN) Must distinguish extreme dependence from non-life.
      *   **Synthetic Minimal Cells:** (NN) Must handle human-designed life.
      *   **Self-Replicating Ribozymes:** (IR) Origins-of-life researchers need to know when chemistry becomes biology.
      *   **Prions:** (NN) Must distinguish infectious protein folding from replication with heredity.
      *   **Self-Replicating Robots:** (IR) Astrobiology/AI needs to know if substrate matters.
  *   **Handling Standard:** A "principled borderline" is acceptable (e.g., "This entity is a biological agent but not a living organism"). A forced binary that contradicts biological consensus is not.

  ## 3. State and Level Distinctions
  **Requirement:** The definition must respect temporal states and levels of organization.
  *   **Alive vs. Dead vs. Never-Alive (NN):** A corpse is *dead* (was alive); a virus is *never-alive* (debated, but distinct from corpse); a rock is *never-alive*. The definition must distinguish the transition of death from the state of inanimate matter.
  *   **Dormancy (NN):** Must allow for an organism to be "alive" while metabolic rate is effectively zero (cryptobiosis), provided the *capacity* for recovery exists.
  *   **Individual vs. Lineage (IR):** Must specify if life is a property of the *token* (this specific bear) or the *type/lineage* (the species Ursus arctos).
      *   *Constraint:* If life is a property of lineages, sterile individuals (mules, worker bees) become problematic. If life is a property of individuals, evolution becomes secondary.

  ## 4. Empirical Consistency vs. Contingency
  **Requirement:** The definition must separate universal principles from Earth-specific history.
  *   **Consistent With (NN):** Thermodynamics (life is an open system), Evolution (life changes over time), Chemistry (life obeys physical laws).
  *   **Treat as Contingent (NN):** Specific molecular substrate (DNA/RNA vs. XNA), specific metabolism (carbon/water vs. silicon/methane), cellular structure (lipid bilayers).
  *   **Rationale:** A definition that requires DNA excludes potential alien life and early pre-DNA life. A definition that allows perpetual motion machines violates physics.

  ## 5. Theoretical Utility (Purpose Constraint)
  **Requirement:** The definition must declare its primary function. A definition cannot be universal if its purposes are contradictory.
  *   **Astrobiology (IR):** Needs high sensitivity (better to include a rock than miss an alien). Favors evolutionary/functional definitions.
  *   **Bioethics (IR):** Needs high specificity (who gets rights?). Favors physiological/neurological definitions.
  *   **Origins of Life (IR):** Needs to identify the *transition* point. Favors process definitions.
  *   **Constraint:** If the purpose is unspecified, the definition is evaluated on its ability to serve *science* generally (NN), which prioritizes explanatory power over moral boundary-setting.

  ---

  ## The Fatal Tension: Process vs. State

  There is a logical incompatibility between **Desideratum 3 (Individual State)** and **Desideratum 4 (Evolutionary Consistency)**.

  *   **The Tension:**
      *   To handle **Dormancy (Spores)**, life must be defined as a *potentiality* or *state* of the individual.
      *   To handle **Viruses** and **Sterile Workers**, life is best defined as a *process* of a lineage (evolution).
      *   **The Conflict:** You cannot define life as a *state of an individual* and simultaneously account for entities that are alive only by virtue of their *history/lineage*.
      *   **Example:** A mule is physiologically alive (metabolism) but evolutionarily dead (no offspring). A virus is evolutionarily active (evolves) but physiologically inert (no metabolism).

  *   **Which Requirement Must Give Way?**
      *   **Requirement 3 (Individual State)** must be relaxed.
      *   **Reasoning:** Modern biology treats the *lineage* as the primary unit of continuity. The "individual organism" is a temporary vehicle. Therefore, an adequate definition must treat "being alive" as **participation in an evolutionary process**, acknowledging that "individual aliveness" is a derivative, contingent property.
      *   **Consequence:** We must accept that "alive" applies differently to a lineage (yes/no) than to an individual (a gradient of functional integrity).

  ---

  ## Scorecard: Definition Families vs. Desiderata

  | Desideratum | Metabolic (Physiological) | Evolutionary (Darwinian/NASA) | Thermodynamic (Entropy) | List-Based (e.g., NASA 7 Pillars) |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. Core Intuitions** (Humans/Rocks) | **Pass** (Humans yes, Rocks no) | **Fail** (Sterile mules = No) | **Fail** (Flames/Stars = Yes) | **Pass** (By fiat) |
  | **2. Borderlines** (Viruses/Spores) | **Fail** (Spores = No; Viruses = No) | **Pass** (Viruses = Yes*; Spores = Yes) | **Fail** (Viruses = No; Fire = Yes) | **Fail** (Arbitrary cutoffs) |
  | **3. States** (Dead/Dormant) | **Fail** (Cannot distinguish Dormant from Dead) | **Pass** (Dormancy = Potential) | **Fail** (No distinction) | **Pass** (If "Homeostasis" is listed) |
  | **4. Contingency** (DNA/Substrate) | **Pass** (Function over form) | **Pass** (Function over form) | **Pass** (Universal physics) | **Fail** (Often Earth-biased) |
  | **5. Utility** (Astro/OoL) | **Poor** (Misses pre-metabolic life) | **High** (Good for search/OoL) | **Medium** (Too broad for search) | **Medium** (Checklist bias) |
  | **TOTAL SCORE** | **2/5** | **4/5** | **1/5** | **2/5** |

  *\*Note on Evolutionary/Viruses: Strictly, viruses are not "alive" in the Darwinian sense because they do not evolve independently, but they are part of the evolving lineage of their hosts. Most evolutionary definitions classify them as "biological entities" but not "organisms."*

  ### The Knockout Requirement
  **Requirement 3: State Distinction (Alive vs. Dormant vs. Dead).**

  *   **Why it knocks out candidates:**
      *   **Metabolic Definitions:** Killed immediately. A bacterial endospore or a tardigrade in cryptobiosis has zero metabolism. By metabolic definitions, they are dead. When they revive, they are "resurrected." Biology considers them *continuously alive*. This is a fatal empirical error.
      *   **Thermodynamic Definitions:** Killed by the "Flame Problem." A flame consumes fuel, exports entropy, and maintains structure. It is "metabolically" and "thermodynamically" similar to life. It fails to distinguish *organized heredity* from *dissipative structure*.
      *   **List-Based Definitions:** Killed by rigidity. If "Growth" is on the list, a mature neuron is not alive. If "Reproduction" is on the list, a mule is not alive. They fail the *Individual vs. Lineage* distinction.

  *   **Why Evolutionary Definitions Survive (mostly):**
      *   They handle dormancy by defining life as the *capacity* to evolve and reproduce, not the *current act*.
      *   They fail only on the "Sterile Individual" case (the mule), but this is considered a lesser error than calling a spore "dead."

  ## Conclusion and Recommendation

  If you read one more proposal, do not look for a definition that says "X is alive." Look for a definition that says **"Life is a process of X."**

  The only way to satisfy the desiderata without contradiction is to adopt a **Process Ontology**:
  1.  **Life is not a state;** it is a historical process (evolution by natural selection).
  2.  **Organisms are not "alive" in isolation;** they are "alive" insofar as they are vehicles for that process.
  3.  **Dormancy** is the preservation of the *potential* to re-engage the process.
  4.  **Viruses** are edge-case mechanisms that hijack the process but do not instantiate it independently.

  **The Specification Verdict:** Any definition that treats "Life" as a intrinsic property of a single material object at a single snapshot in time is guaranteed to fail. The definition must be **historical, population-based, and substrate-independent.** If a proposal does not explicitly center **heritable variation** as the core constraint, it will fail the Borderline and Contingency desiderata.
