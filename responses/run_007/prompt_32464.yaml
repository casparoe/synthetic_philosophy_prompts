  Solomonoff induction formalizes Bayesian inference over the space of all computable hypotheses. Each hypothesis is treated as a program running on a universal Turing machine (UTM). The prior probability assigned to a hypothesis $h$ is proportional to $2^{-K(h)}$, where $K(h)$ is the Kolmogorov complexity—the length in bits of the shortest program producing $h$. This provides a mathematical backbone for Occam's razor: simpler programs receive exponentially higher prior weight. As evidence accumulates, posteriors update via Bayes' rule. In the limit of infinite data, Solomonoff induction converges to the true data-generating distribution faster than any other method. It suggests that "simplicity" isn't aesthetic; it's probabilistic necessity. However, it measures complexity in bits of code, not parameters or conceptual elegance. A model with fewer parameters isn't necessarily simpler if the code required to implement those parameters is verbose. The theory sums over all possible programs, weighting them by their brevity, effectively penalizing ad-hoc adjustments that increase program length without improving predictive compression.

  - **Application**
  Applying this requires estimating Minimum Description Length (MDL), a computable proxy for Kolmogorov complexity. Total length is $L(model) + L(data|model)$. Since both fit history well, $L(data|model)$ is comparable. The decision rests on $L(model)$. The physical model requires encoding Saint-Venant equations, boundary conditions, and constants into the UTM. The ML model requires encoding the architecture (short) plus hundreds of floating-point weights (long). Consider the bit-cost: 500 weights at 32 bits each is 16,000 bits. Can you encode the physics solver in fewer bits? Likely yes, but only if the UTM has math primitives. If the UTM is raw binary, both are huge. However, there's a deeper issue: extrapolation. Solomonoff induction favors models that predict future data. Physical models often capture causal structure, suggesting lower complexity for *future* unseen data (the 100-year storm), whereas ML might be overfitting correlations. The theory favors the model with lower complexity relative to the *true* environment, which is likely physical. Yet, the ML model's "generic architecture" is itself a prior. If the watershed dynamics are truly non-linear and chaotic in ways Saint-Venant smooths over, the ML model might actually be the shorter description of reality, despite the weights. The theory doesn't tell you which prior matches the watershed; it only tells you to pick the shorter one once you've chosen your language. Furthermore, KC measures description length, not semantic meaning. A look-up table of every possible storm outcome is technically a program, albeit a long one. The ML model approaches this by memorizing training data patterns. The physical model approaches this by compressing dynamics into laws. In the context of a 100-year storm (out-of-distribution data), the physical model's compression relies on invariant laws, whereas the ML model's compression relies on statistical regularities. Solomonoff induction prefers the hypothesis that continues to compress future data. If the storm breaks statistical regularities but obeys physics, the physical model becomes the shorter program *in retrospect*, but you can't know that beforehand. This highlights the gamble: you are betting that the universe's complexity is low in the basis of physics, not in the basis of historical correlations.

  - **Limits**
  Here is where the math meets the mud. First, Kolmogorov complexity is uncomputable; you cannot find the shortest program. You must rely on proxies like MDL, which introduce bias. Second, the Invariance Theorem states complexity differences between UTMs are bounded by a constant. In asymptotic limits, this constant vanishes. In your finite data regime, the constant dominates. Choosing a UTM biased toward neural nets vs. differential equations flips the recommendation. Third, Solomonoff induction is normative, not descriptive. It describes an ideal agent with infinite compute, not a county board needing a decision next month. It guarantees convergence in the limit, but offers no error bounds for the next single prediction. Finally, SI optimizes for predictive accuracy, not safety. If the ML model assigns low probability to a catastrophic flood that actually happens, SI only "learns" after the disaster. In climate adaptation, the cost of false negatives (flood) outweighs false positives (wasted money). Solomonoff induction minimizes log-loss, not societal risk. It cannot account for the asymmetry of consequences unless you explicitly encode utility functions, which reintroduces the problem of choosing the right prior. Additionally, the "finite data" problem is critical. Solomonoff's convergence proofs assume an infinite stream of bits. You have fifty years of streamflow data. In this finite regime, the "simplicity" penalty might not be strong enough to overcome the ML model's flexibility. The ML model can wiggle to fit noise, appearing to have low error on historical data, which boosts its posterior despite a complexity penalty. Without a rigorous bound on the complexity constant, you cannot prove the physical model's prior should dominate. This leaves you with a philosophical choice rather than a mathematical one. Are you modeling the data, or the mechanism? Solomonoff induction models the data stream. If the mechanism is what matters for safety, the theory is silent. It treats the world as a black box outputting bits. It does not distinguish between a model that predicts floods because it understands gravity versus one that predicts them because it noticed a correlation with unrelated economic indicators. Both are valid programs until they fail.

  - **Verdict**
  Do not trust the theory to calculate the dollar amount. Trust it to validate your intuition that causal structure matters. The physical model is likely "simpler" relative to the actual universe, even if its code is longer, because it aligns with the data-generating process. I would recommend the physical model, but not because Solomonoff says so directly. I would change my mind if the ML model were physics-informed, reducing its description length by hardcoding conservation laws, or if empirical literature showed ML consistently outperforms physics-based models in extreme extrapolation for similar watersheds. My reasoning might fail by conflating "truth" with "compressibility." The universe might be computable but not compressible into Saint-Venant equations at this scale. However, given your background, the physical model's explicit assumptions are auditable; the ML model's priors are hidden in weights. In high-stakes adaptation, audibility outweighs pure compression. The theory justifies seeking simplicity, but human judgment must define what counts as simple in a risky world.
