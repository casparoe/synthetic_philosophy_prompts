answer: |-
  # Q&A Prep Sheet: "The Over-Application of Good's Theorem"
  **Audience:** ML Researchers & Bayesian Statisticians
  **Goal:** Defend the thesis that Good's Theorem (VoI $\ge$ 0) is theoretically sound but practically misleading for modern system design.

  ---

  ### 1. The "Scaling Laws" Objection (Most Likely/Damaging)
  **Q:** "Empirically, in deep learning, we see smooth power laws. More data consistently reduces test loss and improves downstream task performance. If your thesis is that 'more data can hurt,' aren't you contradicting the most robust empirical finding of the last decade? Why should we stop collecting data based on edge cases?"

  **A:** "I'm not suggesting we stop collecting data, but rather that we stop treating data as *inherently* valuable regardless of context. Scaling laws hold remarkably well for iid pre-training under fixed architectures. But Good's Theorem is about *decision-making*, not just loss minimization. When you move from pre-training to fine-tuning, or from stationary benchmarks to deployment, the 'more data is better' heuristic breaks. For example, adding high-volume, low-quality web data to a medical model can degrade calibration even if perplexity drops. My point is that Scaling Laws describe a specific regime where the assumptions of Good's Theorem are *approximately* met. Outside that regime—specifically when data introduces distribution shift or optimization instability—the guarantee vanishes. We should treat Scaling Laws as an empirical regularity, not a theoretical law of information."

  **Soft Spot:** This concedes that for 90% of their daily work (pre-training), the slogan "more data is better" works. It risks sounding like you're nitpicking the 10% edge case while they care about the 90%.

  ### 2. The Bayesian Misspecification Objection
  **Q:** "As a Bayesian, I assume my model is misspecified. But I also know that as $N \to \infty$, my posterior contracts to the parameter minimizing KL divergence to the truth. If I add data, I get closer to that optimum. How does additional data hurt convergence if the likelihood is well-defined?"

  **A:** "Convergence to the KL-projection is only useful if that projection is stable and actionable. In high-dimensional misspecified models, adding data can increase variance in the directions that matter for decision utility while decreasing it in irrelevant directions. More critically, if your model class is severely misspecified, more data can increase your *confidence* in a wrong prediction without improving accuracy. This is the 'confident wrongness' problem. Good's Theorem assumes you update via Bayes rule and maximize expected utility over the posterior. If the posterior concentrates on a region of parameter space that yields high loss on out-of-distribution actions, the information had negative value for the *actual* task, even if it increased statistical efficiency. Information accelerates convergence, but not necessarily to a useful place."

  **Soft Spot:** A strict Bayesian might argue that if you defined your utility over the model's predictive distribution correctly, this "confident wrongness" is already accounted for. You are implicitly criticizing the prior/model choice, not the value of information itself.

  ### 3. The Bounded Rationality/SGD Objection
  **Q:** "Good's Theorem assumes an ideal expected-utility maximizer. We use SGD. We know SGD doesn't find the global optimum. Are you just saying 'computation is hard'? That seems like an engineering constraint, not a fundamental limit on the value of information."

  **A:** "It's not just that computation is hard; it's that the *landscape changes* with more data. Adding data changes the loss surface. In over-parameterized networks, more data can remove 'beneficial noise' that helped SGD escape sharp minima, or it can introduce spurious gradients that slow convergence. If the optimization error induced by processing the new signal exceeds the reduction in statistical error, the net utility drops. Good's Theorem assumes the agent can perfectly integrate the signal. An ML system cannot. Therefore, for a bounded optimizer, the marginal value of information can be negative because the *processing cost* includes degradation of the optimization trajectory, not just FLOPs."

  **Soft Spot:** This blurs the line between "value of information" and "cost of computation." A critic can argue you should just include optimization error in the cost function, restoring the theorem's validity.

  ### 4. The "Just Add Cost" Reframe (Theoretical Nitpick)
  **Q:** "Good's Theorem allows for the cost of observation. If data hurts, isn't it just because you haven't properly accounted for the storage, compute, or latency costs in your utility function? If you include those, doesn't the theorem hold trivially?"

  **A:** "That is the standard defense, but it renders the theorem tautological and useless for guidance. If every instance where data hurts is explained by 'you didn't cost it correctly,' then the theorem offers no heuristic for *which* costs to look for. My argument is about *structural* harms, not accounting. For example, in causal discovery, observing a variable can induce collider bias if you condition on it improperly. No amount of 'compute cost' accounting fixes the fact that the information structurally corrupts the inference graph. The theorem says 'if you use it optimally, it helps.' I'm saying 'in real systems, the architecture forces suboptimal use,' and pretending we can just 'add cost terms' ignores the architectural constraints."

  **Soft Spot:** You are fighting the math here. Mathematically, they are right: if you define $U'$ to include all negative effects, VoI $\ge 0$. You have to argue that this definition makes the theorem pragmatically empty.

  ### 5. The Non-Stationarity Objection
  **Q:** "What about online learning? If the environment is non-stationary, old data hurts. But we handle that with decay factors or sliding windows. Doesn't that solve the problem without invalidating the theorem?"

  **A:** "Sliding windows are a heuristic admission that data has a 'shelf life,' which implies information can have negative value over time. But the deeper issue is that collecting data can *cause* non-stationarity. In reinforcement learning or bandits, exploring to gain information changes the state distribution. If the information gained reveals a high-reward path that is unsustainable or triggers a regime shift, the agent is worse off. Good's Theorem assumes the signal is exogenous. In interactive ML systems, the signal is endogenous. Observing the world changes the world. In those cases, the 'free signal' assumption is violated fundamentally, not just by cost."

  **Soft Spot:** This applies mostly to RL/Active Learning. For passive supervised learning, this objection is less relevant, and the audience might feel you're generalizing from RL edge cases.

  ### 6. The Spurious Correlation Objection
  **Q:** "In feature selection, we often drop features that correlate with the target in training but fail in testing. Isn't this just a generalization error? Why frame it as 'information has negative value' rather than 'you picked the wrong features'?"

  **A:** "Because the standard feature selection pipeline assumes that if a feature reduces training loss, it has positive value. Good's Theorem is often cited to justify throwing all available features into a model. But if a feature is a 'shortcut' (e.g., watermarks in images), it provides high mutual information with the label in-training but negative utility out-of-distribution. The information is *real*—it predicts the label—but it is *non-causal*. Using it makes the model brittle. The theorem doesn't distinguish between causal and spurious information. For a real system, spurious information has negative value because it increases deployment risk. We need a theory of 'Robust Value of Information,' not just 'Expected Value.'"

  **Soft Spot:** This relies on the distinction between "prediction" and "causal mechanism." A pure predictive modeller might argue that if it works in-distribution, the value was positive, and OOP failure is a separate problem.

  ### 7. The Strategic/Goodhart Objection
  **Q:** "If I deploy a model, users might game it. Does your thesis imply we should collect less data to avoid users learning our decision boundary?"

  **A:** "It implies that in strategic environments, transparency and data collection have a cost beyond privacy. If agents know you are collecting data to update a model, they may manipulate the data stream. This is Goodhart's Law. In this context, observing the signal (user behavior) gives you information, but acting on it incentivizes the user to change the behavior. The 'value' of that information is negative because it degrades the stability of the environment. Good's Theorem assumes a passive environment. In socio-technical systems, the environment is adversarial. Therefore, 'ignorance' can be a commitment device that preserves system equilibrium."

  **Soft Spot:** This moves the discussion into Mechanism Design. A statistician might argue this is a problem of the *game*, not the *information theory*.

  ### 8. The "Hope Nobody Asks" Question (Positive Prescription)
  **Q:** "Okay, you've convinced us Good's Theorem doesn't apply to bounded, strategic, misspecified agents. So what? What is the alternative theorem? Do you have a formula for when we *should* stop collecting data, or are you just telling us to be more anxious about our datasets?"

  **A:** "That is the open research problem, and I want to be honest: I don't have a closed-form 'Bad's Theorem' yet. But the prescription is methodological. First, stop using 'more data' as a default baseline in ablation studies; use 'curated data' as the baseline. Second, in Bayesian workflows, prioritize prior sensitivity analysis over posterior contraction metrics. If your posterior moves significantly with more data but your decisions don't improve on a validation set, the information value is zero. I'm asking for a shift from *maximizing information* to *maximizing decision robustness*. We need to develop bounds on VoI that incorporate model class constraints and distribution shift, rather than assuming the ideal case."

  **Soft Spot:** This is the weakest point. You are critiquing a proven theorem without offering a replacement mathematical framework. It risks sounding like you're selling "caution" rather than "science."

  ---

  ### Strategic Advice for the Talk
  *   **Don't fight the math:** Acknowledge Good's Theorem is mathematically true. Your fight is against the *sociological slogan* derived from it.
  *   **Lean on "Boundedness":** ML researchers accept that models are approximations. Lean heavily into the gap between "Ideal Agent" and "SGD + Finite Compute."
  *   **The "So What?":** Keep bringing it back to **Feature Selection** and **Retraining Triggers**. These are concrete actions they take. If they can justify *not* retraining or *dropping* features using your logic, you win.
