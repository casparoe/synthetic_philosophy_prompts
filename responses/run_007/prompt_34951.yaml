answer: |-
  **MEMORANDUM**

  **TO:** Members of the State Criminal Sentencing Commission
  **FROM:** Chair, Criminal Sentencing Commission
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding the Reference Class Problem in Risk Assessment Instrument Revision

  ### 1. Purpose

  The purpose of this memo is to break the current deadlock regarding the revision of our actuarial risk assessment instrument (RAI). For two months, the Commission has been unable to vote on a final methodology due to the "Reference Class Problem" (RCP). As our statistical staff has correctly advised, this is not a technical error to be fixed, but a fundamental philosophical limitation of applying group statistics to individuals.

  We must choose a policy that acknowledges this limitation without rendering the instrument useless. This memo evaluates the three current proposals and recommends a fourth, hybrid approach: **The Principled Ensemble with Uncertainty Disclosure.**

  ### 2. The Core Impasse: The Reference Class Problem

  We must begin by accepting the statisticians' conclusion: there is no "true" recidivism probability for an individual defendant. Probability is not an intrinsic property of the person, like height or weight. It is a relationship between the person and the specific data class used to describe them.

  When we assign a defendant a 34% risk based on age and prior felonies, but a 19% risk based on treatment participation, neither number is "false." Both are mathematically correct relative to their respective classes. The philosophical difficulty lies in deciding which description of the defendant is *morally and legally relevant* for sentencing.

  If we ignore this problem, we risk presenting a statistical artifact as a scientific fact, which violates due process and undermines the legitimacy of this Commission.

  ### 3. Evaluation of Current Factions

  **Faction 1: The Narrowest Reference Class**
  *Proposal:* Mandate the most specific class meeting sample-size thresholds.
  *Critique:* While intuitive, this approach is philosophically arbitrary. "Specificity" does not equal "causal relevance." A class defined by zip code and employment may be narrower than one defined by age and offense, but it risks encoding socioeconomic bias rather than criminal risk. Furthermore, this approach conceals the uncertainty inherent in the RCP, presenting a single number as definitive when it is merely one of many possible valid calculations.

  **Faction 2: The Range Report**
  *Proposal:* Report the minimum and maximum rearrest rates across all reliable classes.
  *Critique:* This is the most philosophically honest option. It admits uncertainty. However, as a standalone policy, it risks "analysis paralysis." Presenting a judge with a 19%–52% range without guidance on how to weigh the endpoints may lead to unwarranted sentencing disparity, where one judge consistently selects the low end and another the high end. It shifts the burden of resolving the philosophical problem to the judiciary without providing a framework for doing so.

  **Faction 3: Structured Clinical Assessment**
  *Proposal:* Abandon actuarial methods for holistic expert judgment.
  *Critique:* While this avoids the mechanical RCP, it does not solve the philosophical problem; it merely hides it within the evaluator's intuition. Clinical judgment is susceptible to implicit bias, has lower inter-rater reliability, and is more vulnerable to legal challenges regarding subjectivity. It sacrifices the transparency of data for the illusion of human insight.

  ### 4. Recommendation: The Principled Ensemble with Uncertainty Disclosure

  I recommend we adopt a fourth approach that synthesizes the actionability of Faction 1 with the honesty of Faction 2. This model treats the RCP not as a bug to be hidden, but as a feature to be managed through transparency and aggregation.

  **The Model Consists of Three Components:**

  1.  **Principled Class Selection:** We do not use *all* possible reference classes, nor do we pick *one*. We identify a set of "Legally Salient Classes." These are classes defined by variables that have a demonstrated causal or theoretical link to recidivism (e.g., criminal history, age) and exclude variables that serve as proxies for protected characteristics (e.g., zip code, unless strictly validated for non-discriminatory impact).
  2.  **Ensemble Scoring:** The instrument will calculate the risk probability across all Legally Salient Classes. The primary "Risk Score" reported to the court will be the **median** of these probabilities. This stabilizes the prediction, ensuring that no single arbitrary class definition dictates the outcome.
  3.  **Mandatory Uncertainty Disclosure:** Alongside the median score, the report must display the **Interquartile Range (IQR)** of the classes used. For example: *"Median Risk: 34% (Range of Valid Classes: 28% – 39%)."*

  **Judicial Instruction:**
  We will draft a companion jury instruction (for sentencing hearings) stating: *"This score represents a statistical estimate based on multiple valid comparisons. It is not a prediction of this individual's future behavior. The range indicates the degree of uncertainty inherent in applying group data to an individual. You may consider factors specific to the defendant that align with the lower or higher end of this range."*

  ### 5. Rationale

  **Philosophical Integrity**
  This approach respects the RCP. It acknowledges that no single class is "the truth" by averaging across multiple valid classes. It avoids the lie of precision (Faction 1) without abdicating our responsibility to provide guidance (Faction 2).

  **Legal Defensibility**
  By excluding classes that rely on problematic proxies (like zip code) from the "Legally Salient" set, we mitigate disparate impact concerns. By disclosing the range, we satisfy due process requirements regarding the reliability of evidence. We are not hiding the margin of error from the defense.

  **Actionability**
  Judges receive a single median number for ease of reference, preserving sentencing uniformity. However, the disclosed range provides a safety valve. If a defense attorney can demonstrate that their client aligns more closely with the variables driving the lower end of the range (e.g., substance abuse treatment), the judge has a documented basis for deviating from the median without ignoring the instrument entirely.

  ### 6. Implementation Plan

  1.  **Variable Audit (Month 1):** Staff to review all potential reference class variables. Any variable serving primarily as a proxy for race or poverty without direct causal link to recidivism will be excluded from the "Legally Salient" set.
  2.  **Algorithm Adjustment (Month 2-3):** IT and Statistics to reconfigure the instrument to calculate the median and IQR across the approved classes rather than a single regression output.
  3.  **Judicial Training (Month 4):** Develop training modules for judges focused on interpreting the "Range of Valid Classes" and understanding the RCP.
  4.  **Sunset Clause:** This policy shall be reviewed in three years. If sentencing disparity increases significantly, the Commission will reconvene to consider whether the Range Disclosure requires further narrowing.

  ### 7. Conclusion

  The Reference Class Problem proves that we cannot mathematically compute "justice." We can only compute risk relative to a chosen description. By adopting the **Principled Ensemble with Uncertainty Disclosure**, we choose a description that is robust, transparent, and honest about its own limitations.

  This recommendation allows us to move forward without pretending the philosophical problem does not exist. It provides the courts with a tool that is useful precisely because it admits what it does not know.

  I request that the Commission schedule a vote on this framework for the next meeting.

  **[Signature]**

  **Chair, Criminal Sentencing Commission**
