  2.  **Determine the Bottom Line:**
      *   I need to address both the psychological safety aspect and the philosophical/epistemological aspect.
      *   *Psychological:* If it causes distress/impairment, treat it as pathology until stabilized. If it leads to clarity/compassion, it's likely insight.
      *   *Philosophical:* Experience alone doesn't prove metaphysics, but pragmatic utility matters.
