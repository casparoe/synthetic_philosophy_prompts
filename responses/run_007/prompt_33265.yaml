answer: |-
  **The Questions**
  Answer each yes/no based on your intuitions about the following concrete claims:

  1.  **Insensitivity:** If you learned evolution shaped your moral beliefs regardless of their truth, would you accept that description?
  2.  **Epistemic Defeat:** If so, would that give you reason to doubt those beliefs?
  3.  **Self-Defeat:** Would that same reasoning give you reason to doubt evolutionary science?
  4.  **Independence:** If you doubt moral beliefs, must you deny moral facts are mind-independent?
  5.  **Existence:** If you deny independence, must you deny moral facts exist at all?

  **The Decision Tree**

  *   **Q1 = No**
      *   **Leaf:** **Copp-Style Naturalist Realism.** Evolution tracked moral truth, so beliefs are justified.
  *   **Q1 = Yes → Q2 = No**
      *   **Leaf:** **Enoch-Style Third-Factor Realism.** Insensitivity does not undermine justification (e.g., truth and survival correlate).
  *   **Q1 = Yes → Q2 = Yes → Q3 = Yes**
      *   **Leaf:** **Vavova-Style Self-Defeat.** The debunking argument undermines the evolutionary premises used to generate it.
  *   **Q1 = Yes → Q2 = Yes → Q3 = No → Q4 = Yes**
      *   **Leaf:** **[Unoccupied] Skeptical Realism.** Moral beliefs are unjustified, yet mind-independent facts exist.
      *   *Diagnosis:* Coherent but unstable; grants the debunker's epistemic conclusion while retaining the metaphysics it threatens.
  *   **Q1 = Yes → Q2 = Yes → Q3 = No → Q4 = No → Q5 = No**
      *   **Leaf:** **Joyce-Style Error Theory.** Moral beliefs are unjustified and no moral facts exist.
  *   **Q1 = Yes → Q2 = Yes → Q3 = No → Q4 = No → Q5 = Yes**
      *   **Leaf:** **Street-Style Humean Constructivism.** Moral beliefs are unjustified as tracking independence, but facts exist as mind-dependent constructs.

  **Diagnostic Notes**

  **The Street/Joyce Convergence:**
  Note that Street and Joyce share the same path through Q4. Both accept the evolutionary explanation (Q1), accept it undermines justification for realism (Q2), deny the argument is self-defeating (Q3), and agree mind-independent moral facts cannot survive debunking (Q4). Their divergence is purely metaphysical (Q5): Joyce concludes moral discourse is systematically false (no facts), while Street reconstructs moral facts as dependent on our valuing attitudes. The tree flags this residual disagreement: it is not about the *force* of the debunking argument, but about the *metaphysical cost* of accepting it.

  **Unoccupied Logical Space:**
  The **Skeptical Realist** leaf (Q4=Yes) is logically possible but unoccupied in print. This position accepts that evolution explains our beliefs insensitively and that this undermines justification, yet insists mind-independent moral facts nonetheless exist. This is unattractive because it grants the debunker's central epistemic premise while denying the ontological conclusion that typically follows, leaving the realist with facts they admit we have no reason to believe in.

  Another unoccupied combination is **Q1=No, Q2=Yes**. This implies evolution *did* track truth, yet we should still doubt our beliefs. This is coherent but underexplored, as it posits a defeater unrelated to the evolutionary genealogy itself.

  **Usage:**
  To use this tree, start at Q1. If you answer "No," you are a naturalist realist (Copp). If "Yes," proceed to Q2. If you think insensitivity matters epistemically, you must either accept self-defeat (Vavova) or abandon mind-independent realism. If you abandon independence, you must choose between eliminating moral facts entirely (Joyce) or reconstructing them as dependent (Street). Enoch offers the only route to retain realism while accepting insensitivity (Q2=No).
