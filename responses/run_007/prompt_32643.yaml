answer: |-
  This is a smart strategic move. Leibniz's ethics is indeed the "neglected sibling" of his metaphysics, which gives you room to maneuver, but it also means the textual support is more scattered. Given your constraints (Philosophy department, translation-only, three-year timeline), you need a topic that allows for **systematic reconstruction** rather than **historical exegesis**. You want to argue *with* Leibniz, not just *about* him.

  Here is my ranking of your questions, including one crucial addition that I believe should top the list.

  ### 1. The Missing Question: The Compatibility of Disinterested Love and Rational Self-Interest
  **The Question:** Leibniz defines justice as "the charity of the wise" and claims that loving someone is "finding pleasure in their happiness." But his system is fundamentally perfectionist and eudaimonist (we act for our own perfection/pleasure). How does he avoid collapsing altruism into enlightened egoism? Is the pleasure we take in others' happiness a *consequence* of loving them, or the *motive* for it?

  **Why it's #1:**
  *   **(1) Importance:** This is the linchpin of Leibniz's entire practical philosophy. If he cannot reconcile the pursuit of one's own perfection with genuine concern for others, his normative ethics collapses into egoism, and his definition of justice becomes vacuous. Solving this clarifies the relationship between his moral psychology and his normative theory. It also speaks directly to contemporary debates about reasons internalism and the structure of altruistic motivation.
  *   **(2) Tractability:** High. The core texts are available in translation: *A Meditation on the Common Concept of Justice* (in Riley's *Political Writings*), relevant sections of the *Theodicy*, and his correspondence with Burnet and More. The secondary literature (Riley, Brown, Rutherford) discusses it, but rarely as the *central* focus of a systematic reconstruction. It allows you to stay in "Ethics" without getting bogged down in the logic of possible worlds.
  *   **(3) What would change the ranking:** If you discover that the *Codex Iuris Gentium* (where this is developed most fully) requires Latin nuance that translations obscure, this drops. However, Riley's translation is philosophical and reliable. If you find yourself drifting into "Political Philosophy" rather than "Ethics," your committee might push back; you must frame this as a problem of *moral motivation*, not just jurisprudence.

  ### 2. The Tension Between Moral Rationalism and Psychological Hedonism (Your Q3)
  **The Question:** Leibniz claims we know moral truths through reason (rationalism), but that the will is always moved by the perception of pleasure/perfection (hedonism). Is pleasure the *criterion* of the good or merely the *motive*? Can we be motivated by a rational recognition of duty if the will is determined by the perception of the good?

  **Why it's #2:**
  *   **(1) Importance:** This is the micro-foundation of the #1 topic. It addresses the "Humean Challenge" before Hume. If Leibniz is a psychological hedonist, his rationalism is threatened. Resolving this determines whether Leibniz is a precursor to Kant (rational motivation) or Hutcheson (sentiment/motive).
  *   **(2) Tractability:** Very High. The texts are the *Discourse on Metaphysics*, *Principles of Nature and Grace*, and *Theodicy*. All standard translations. The secondary literature (Parkinson, Strickland, Look) is robust, meaning you have a clear conversation to enter, but there is still disagreement on whether Leibniz reduces "good" to "pleasure" or keeps them distinct.
  *   **(3) What would change the ranking:** If you find the literature is too saturated (Parkinson's work is definitive in some areas), novelty becomes hard. To keep this high, you must connect it to contemporary metaethics (e.g., "Leibniz as a Reasons Internalist"). If you treat it purely historically, it risks being a "survey" rather than a dissertation.

  ### 3. Supererogation and the Structure of Obligation (Your Q4)
  **The Question:** If rational agents are obligated to strive for the "best" (maximize perfection), is every action obligatory? Does Leibniz's maximizing principle collapse the distinction between duty and supererogation? Can one do "more than required" if one is always required to do the best possible?

  **Why it's #3:**
  *   **(1) Importance:** This tests the normative limits of his system. It connects Leibniz to modern utilitarianism (maximizing) vs. deontology (options). If Leibniz has no room for supererogation, his ethics is incredibly demanding (perhaps impossibly so). This has implications for how we read his theology (is God obligated to create the best?) and his human ethics.
  *   **(2) Tractability:** Moderate. The texts are scattered. You'll need to synthesize the *Theodicy* (divine action) with his letters on human obligation. There is less secondary lit here, which is good for novelty but bad for having a clear path. You may need to reconstruct the argument rather than find it explicitly stated.
  *   **(3) What would change the ranking:** If you can't find enough textual evidence to sustain three chapters, this becomes a paper, not a dissertation. To bump it up, you would need to broaden it to "The Normative Structure of Leibnizian Perfectionism," using supererogation as the key test case.

  ### 4. Moral Necessity vs. Metaphysical Necessity (Your Q2)
  **The Question:** What is the modality of "moral necessity"? Does it successfully explain how God (and humans) can be free if they are necessitated by the good? Is it a distinct logical modality or just a metaphor for strong inclination?

  **Why it's #4:**
  *   **(1) Importance:** It is the engine of his Theodicy and theory of freedom. Without it, his system implies determinism. However, this has been "done to death" in the context of free will and logic.
  *   **(2) Tractability:** Moderate to Low (for *you*). While the texts are available, the debate is highly technical and often requires parsing Latin logical terms (*necessitas ex hypothesi* vs. *per se*). In translation, the nuance of "infallibility" vs. "necessity" can be lost. You risk stepping on the toes of metaphysicians (Adams, Rutherford) rather than contributing to ethics.
  *   **(3) What would change the ranking:** If you can strictly frame this as **Moral** Necessity (human action) rather than **Metaphysical** Necessity (divine creation), it moves up. If the project drifts into "Leibniz on Free Will," it becomes a metaphysics dissertation, which might not fit your "Ethics" billing.

  ### 5. The Modal Status of Moral Truths (Your Q1)
  **The Question:** Are moral truths necessary truths of reason (like math) or contingent truths of fact (dependent on God's choice of the best world)?

  **Why it's #5:**
  *   **(1) Importance:** This is the Leibnizian Euthyphro dilemma. It determines whether his ethics is realist or voluntarist. However, the answer is largely tied to his logic of possible worlds.
  *   **(2) Tractability:** Low (for a Philosophy PhD). This question is almost entirely metaphysical. To answer it rigorously, you usually need to engage with the logical papers (*Generales Inquisitiones*), which are technical and often best handled in Latin. In translation, the distinction between "truths of reasoning" and "truths of fact" in a moral context is slippery.
  *   **(3) What would change the ranking:** If you can find a way to make this a *metaethical* question independent of the possible worlds semantics (e.g., focusing on the *Theodicy* alone), it becomes more tractable. But it risks being too abstract for an "Ethics" dissertation.

  ### 6. Moral Considerability of Non-Human Monads (Your Q5)
  **The Question:** Do monads (animals, plants, etc.) have moral standing? Does the hierarchy of perfection generate obligations toward lower beings?

  **Why it's #6:**
  *   **(1) Importance:** High contemporary relevance (environmental ethics). But low historical importance. Leibniz rarely discusses *obligations to animals* directly; he discusses their metaphysical status.
  *   **(2) Tractability:** Low. You will be constructing a Leibnizian view rather than recovering one. This invites the charge of anachronism. The texts that support this are sparse and often metaphorical. You would spend more time defending your methodology than arguing for Leibniz's view.
  *   **(3) What would change the ranking:** If you frame this as "Leibniz's Metaphysics of Value" rather than "Applied Ethics," it becomes more rigorous. But for a 3-year timeline, the risk of running out of textual evidence is too high.

  ### Strategic Advice for the 3-Year Timeline

  1.  **Avoid the "System" Trap:** Do not try to write "Leibniz's Ethical System." You will drown. Pick **one** of the top two questions and treat the others as supporting chapters. For example, if you choose #1 (Disinterested Love), Chapter 2 can be on #3 (Rationalism/Hedonism) as the psychological foundation, and Chapter 3 on #4 (Supererogation) as the normative implication.
  2.  **Translation Protocol:** Since your Latin is shaky, stick to the **Riley** translations (*Political Writings*, *Philosophical Texts*) and **Huggard** (*Theodicy*). Cite the Akademie edition numbers (e.g., *A VI, 4*) in your footnotes so historians can check your work, but rely on the English for argumentation.
  3.  **The "Philosophy Dept" Shield:** Early modern dissertations often get critiqued for being "just history." To avoid this, frame every chapter with a contemporary problem.
      *   *Bad:* "What Leibniz said about love in 1697."
      *   *Good:* "Leibniz's Solution to the Problem of Altruistic Motivation."
  4.  **My Recommendation:** Go with **Topic #1 (Disinterested Love/Justice)**. It is the most distinctively "Leibnizian" ethical contribution that isn't the Theodicy. It allows you to use the *Political Writings* (which philosophers often ignore) and connects directly to the Moral Psychology (#2). It is tractable, underworked, and systematic.

  If you can show that Leibniz offers a viable third way between Egoism and Altruism via his theory of *perception of perfection*, you have a dissertation that speaks to 17th-century scholars and contemporary metaethicists alike.
