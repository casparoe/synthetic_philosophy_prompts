      *   *Requirement 1 (Implementation):* Must distinguish between a system *satisfying* a computational description (triviality problem) and a system *performing* computation causally. Any physical system can be described computationally (Putnam/Searle). An adequate answer must explain why the brain *is* a computer rather than just *look like* one to an observer.
      *   *Requirement 2 (Semantics):* Must address content. Is neural activity representational intrinsically (naturalized semantics) or only relative to an interpreter (derived intentionality)? If content is observer-relative, "computation" is observer-relative.
      *   *Requirement 3 (Neuroscience):* Must respect biological constraints. Neurons aren't binary logic gates; they are analog, noisy, chemical-electrical hybrids. The account cannot rely on von Neumann architecture unless justified.
      *   *Requirement 4 (Formalism):* Must respect computation theory. Computation requires syntax. If the brain lacks syntax, it lacks computation in the literal sense.

      *   *Classification:*
          *   Non-negotiable: Avoiding triviality (Req 1), Respecting biology (Req 3).
          *   Camp Preference: Intrinsic semantics (Req 2) - Computationalists want intrinsic; Skeptics say derived.
          *   Incompatibility: Intrinsic semantics + Strict Physicalism (maybe?). Actually, the big incompatibility is usually between "Computation is observer-relative" and "Computation is causal/intrinsic".
          *   Key Separator: The status of semantics (Req 2).

