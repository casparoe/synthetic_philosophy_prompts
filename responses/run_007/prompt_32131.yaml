  To transcend metaphor, an answer to "Is the brain a computer?" must satisfy specific ontological and explanatory desiderata. It cannot merely assert isomorphism; it must establish identity without collapsing into triviality. The following criteria define an adequate answer.

  **1. The Implementation Constraint (Non-negotiable)**
  The answer must distinguish between a system being *computationally described* and a system *actually computing*. As Putnam and Searle argued, nearly any physical system can be mapped onto a formal automaton given enough descriptive latitude. If "being a computer" means merely satisfying a computational description, walls are computers. *Consideration:* This prevents the pancomputationalist collapse where ontology dissolves into perspective. An adequate theory must identify causal mechanisms that implement syntax independently of an observer's mapping. It must explain why the brain computes *rather than* merely being describable as computing.

  **2. The Semantics Constraint (The Key Separator)**
  The answer must specify whether the content of neural computation is fixed by the system itself or assigned by an observer. Computation is syntactic manipulation defined over semantic content. If neural states lack intrinsic intentionality—if their "meaning" is derived solely from an external interpreter—then computation is observer-relative. *Consideration:* This addresses whether syntax is a physical property like mass or a relational property like "being a gift." Computationalists prefer intrinsic content (naturalized semantics); skeptics argue content is always assigned. This requirement separates literalists (brain computes independently) from instrumentalists (brain is a tool for computation only relative to us). Without intrinsic content, syntax is not physical, and literal computation fails.

  **3. The Biological and Formal Constraint (Non-negotiable)**
  The account must respect neuroscience and computation theory. Neurons are analog, noisy, chemical-electrical hybrids, not binary logic gates. A literalist account cannot rely on von Neumann architecture without explaining how discrete symbolic processing emerges from continuous dynamics. *Consideration:* This ensures the model explains the mechanism, not just the input-output profile. Computation requires discrete states and rule-governed transitions. If neural processing is fundamentally continuous, claiming it is "digital computation" may be a category error. The account must define the alphabet and rules of the neural machine without arbitrariness.

  **Classification of Requirements**

  **Non-negotiable:**
  1.  **Avoiding Triviality:** Any answer allowing every physical system to be a computer renders the claim vacuous.
  2.  **Biological Compatibility:** Ignoring the analog nature of neurons falsifies the premise.
  3.  **Formal Rigor:** Misusing "computation" to mean any information processing violates computer science definitions.

  **Camp Preferences:**
  1.  **Intrinsic Semantics:** Computationalists demand the brain fixes its own content. Skeptics prefer observer-relative content.
  2.  **Digital vs. Analog:** Classical computationalists prefer discrete states; Dynamicists prefer continuous values.

  **Incompatible Subsets:**
  You cannot jointly satisfy **Intrinsic Semantics** and **Strict Physicalism** without a robust theory of naturalized meaning (which currently does not exist). If content is physical, how is it semantic? If content is semantic, how is it physical? Furthermore, you cannot satisfy **Observer-Relative Computation** and **Causal Explanation** simultaneously. If computation depends on an observer, it cannot causally explain behavior independent of that observer. This creates a dilemma: either computation is not causal, or semantics are not observer-relative.

  **The Single Separating Requirement:**
  The **Semantics Constraint** is the decisive fault line. If neural content is intrinsic, the brain can be a literal computer (syntax exists in nature). If neural content is observer-assigned, the brain is only a computer metaphorically (syntax exists in the eye of the beholder). This determines whether computation is a discovered natural kind or an imposed descriptive framework. All other disputes flow from this ontological commitment regarding meaning.

  **Definitional Traps:**
