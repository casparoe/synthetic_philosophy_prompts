      *   *Drafting text:*
          To transcend metaphor, an answer to "Is the brain a computer?" must satisfy specific ontological and explanatory desiderata. It cannot merely assert isomorphism; it must establish identity or realization without collapsing into triviality. Below are the criteria for a robust answer.

          **1. The Triviality Constraint (Non-negotiable)**
          The answer must distinguish between a system being *computationally described* and a system *actually computing*. As Putnam and Searle noted, nearly any physical system can be mapped onto a formal automaton given enough descriptive latitude. If "being a computer" means merely satisfying a computational description, then walls and rocks are computers. An adequate theory must identify causal mechanisms that implement syntax independently of an observer's mapping. It must explain why the brain computes *rather than* merely being describable as computing.

          **2. The Semantics Constraint (The Key Separator)**
          The answer must specify whether the content of neural computation is fixed by the system itself or assigned by an observer. Computation is syntactic manipulation defined over semantic content. If neural states lack intrinsic intentionality—if their "meaning" is derived solely from an external interpreter—then computation is observer-relative. Computationalists prefer intrinsic content (naturalized semantics); skeptics argue content is always assigned. This requirement separates literalists (brain computes independently) from instrumentalists (brain is a tool for computation only relative to us).

          **3. The Biological Constraint (Non-negotiable)**
          The account must respect neuroscience. Neurons are not binary switches; they are analog, noisy, spiking, chemical-electrical hybrids. A literalist account cannot rely on classical von Neumann architecture without explaining how discrete symbolic processing emerges from continuous dynamics. It must accommodate plasticity and parallelism without forcing biological square pegs into computational round holes.

          **4. The Formal Constraint (Non-negotiable)**
          The answer must respect computation theory. Computation requires discrete states and rule-governed transitions. If neural processing is fundamentally continuous or dynamic systems-based, claiming it is "digital computation" may be category error. The account must define the alphabet and rules of the neural machine without arbitrariness.

          **Classification and Conflicts**

          **Non-negotiable Requirements:**
          1.  **Avoiding Triviality:** Any answer allowing every physical system to be a computer renders the claim vacuous.
          2.  **Biological Compatibility:** Ignoring the analog nature of neurons falsifies the premise.
          3.  **Formal Rigor:** Misusing "computation" to mean any information processing violates computer science definitions.

          **Camp Preferences:**
          1.  **Intrinsic Semantics:** Computationalists demand the brain fixes its own content. Eliminativists/Skeptics prefer observer-relative content.
          2.  **Digital vs. Analog:** Classical computationalists prefer discrete states; Connectionists/Dynamicists prefer continuous values.

          **Incompatible Subsets:**
          You cannot jointly satisfy **Intrinsic Semantics** and **Strict Physicalism** without a robust theory of naturalized meaning (which currently does not exist). If content is physical, how is it semantic? If content is semantic, how is it physical? Furthermore, you cannot satisfy **Observer-Relative Computation** and **Causal Explanation** simultaneously. If computation depends on an observer, it cannot causally explain behavior independent of that observer.

          **The Single Separating Requirement:**
          The **Semantics Constraint** is the decisive fault line. If neural content is intrinsic, the brain can be a literal computer (syntax exists in nature). If neural content is observer-assigned, the brain is only a computer metaphorically (syntax exists in the eye of the beholder). This determines whether computation is a discovered natural kind or an imposed descriptive framework.

          **Definitional Traps to Avoid:**
          *   **Equating Information with Computation:** Information flow (causal correlation) is not computation (rule-based manipulation).
          *   **Conflating Simulation with Replication:** Simulating a brain computationally does not prove the brain is computational.
          *   **Functionalist Circularism:** Defining the brain as a computer because it processes information, and defining information processing as what computers do.

          A successful account must navigate these reefs. It must show how syntax hangs on biology without an interpreter, or admit that "computer" is a useful fiction rather than a literal truth.

