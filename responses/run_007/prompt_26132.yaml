          *   Key Concept: *Spurious Correlation.* If the link isn't causal or functional, EDT fails.
          *   Example: *Newcomb's Soda.* (Egan's objection). You drink chocolate soda, it makes you crave chocolate ice cream. Predictor predicts ice cream based on soda. Should you drink vanilla soda to get vanilla ice cream? No, that's magical thinking. This attacks the *mechanism* of one-boxing.

      *   *Category 2: The "Severe" Sweat (Adversarial Predictors).*
