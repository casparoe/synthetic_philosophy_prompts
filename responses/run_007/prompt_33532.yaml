answer: |-
  1. At the start of class, announce that a high-value reward will be given at an unpredictable time during one of three specific 20-minute segments, emphasizing that prior knowledge of the segment voids the surprise.
  2. Allow five minutes for students to write down their prediction and justification, subtly prompting them to use backward induction to eliminate the final segment as impossible.
  3. Let the first two segments pass without incident while visibly tracking the time, allowing the class consensus to solidify around the conclusion that the reward cannot logically occur.
  4. In the final segment, when confidence in the impossibility is highest, unexpectedly distribute the reward to demonstrate that the event occurs despite their logical proof against it.
  5. Ask students why their logical proof failed to prevent the event, explicitly connect the error to the difference between knowing a statement is true and the statement being true, and handle objections about semantic trickery by insisting the surprise condition was met empirically despite the logical contradiction.

  Yes, the activity falls apart if a knowledgeable student explains the solution early, so you must identify them beforehand and instruct them to remain silent observers who track peer reactions instead of participating.
