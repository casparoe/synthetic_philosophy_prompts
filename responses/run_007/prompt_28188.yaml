      *   The user's Premise (1) is the pivot point. It sets a high bar for "literal encoding" (convention/intention).
      *   The user's Premise (2) is scientifically accurate regarding the *mechanism* but potentially philosophically naive regarding the *system*.
      *   The parity argument (4-7) relies on a specific view of physical implementation vs. abstract function.
      *   *Key Insight:* The error lies in conflating the *physical implementation* of a mechanism with the *functional/teleological context* in which that mechanism exists. Specifically, Premise (1) is too restrictive or misapplied, and Premise (2) ignores the evolutionary history that *establishes* the convention.
      *   *Alternative Insight:* The distinction isn't between "causal" and "conventional." It's between "natural signs" (smoke indicates fire) and "conventional signs" (words indicate concepts). But even natural signs can carry information in a specific sense (Shannon vs. Semantic).
      *   *Best Diagnosis:* The argument fails because it ignores the *historical/etiological* account of function. In biology, the "convention" is established by natural selection, not a conscious homunculus. In computers, the "convention" is established by design history. In language, it's social convention. The *current* causal chain doesn't need an interpreter *in the moment* if the system was built/selected *to be interpreted*.

