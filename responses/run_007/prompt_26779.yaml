  # The Composition Diagnostic: A Decision Tree

  **Instructions:** Answer the following questions based on your intuitive judgments about the cases described. Do not worry about philosophical labels (like "nihilism" or "universalism"); simply choose the answer that best matches what you believe is true about the world. Follow the arrows to discover your position.

  ---

  ### **START**

  #### **Q1: The Living Cat**
  Consider a **living cat** stalking through a garden.
  *   **A:** There is a single object there (the cat) made up of smaller parts.
  *   **B:** There are only many tiny particles arranged in a cat-shape; no "cat" object exists over and above them.

  *   *If B:* Go to **Leaf 1**.
  *   *If A:* Go to **Q2**.

  ---

  #### **Q2: The Scattered Sum**
  Consider three things: **the tip of your nose**, **the Moon**, and **a specific grain of sand on Mars**.
  *   **A:** These three things compose a single, scattered object (a "nose-Moon-sand" whole).
  *   **B:** These three things do not compose a single object; they are just three separate things.

  *   *If A:* Go to **Leaf 2**.
  *   *If B:* Go to **Q3**.

  ---

  #### **Q3: The Heap of Sand**
  You believe the **living cat** is an object, but the **nose-Moon-sand** sum is not. Now consider a **heap of sand** sitting on a beach.
  *   **A:** The heap is a single object composed of grains of sand.
  *   **B:** The heap is not a single object; there are only grains arranged heap-wise.

  *   *If A:* Go to **Q4**.
  *   *If B:* Go to **Q5**.

  ---

  #### **Q4: The Bonding Series (Sharp Line Test)**
  You accept that cats and heaps are objects. Imagine two steel blocks. At what point in this series do they become *one* object rather than two?
  1.  They are merely **touching**.
  2.  They are **two people holding hands** (analogous to light contact).
  3.  They are **glued** together.
  4.  They are **welded** together.
  5.  They are chemically bonded like atoms in a **water molecule**.

  *   **A:** Composition begins at Step 1 or 2 (Touching/Hands).
  *   **B:** Composition begins at Step 3, 4, or 5 (Glue/Weld/Bond).
  *   **C:** They never become one object (even at Step 5).

  *   *If A:* Go to **Leaf 3**.
  *   *If B:* Go to **Leaf 4**.
  *   *If C:* Go to **Leaf 1** (You are a Nihilist about inorganic matter, despite Q3).

  ---

  #### **Q5: The Severed Hand**
  You believe the **living cat** is an object, but the **heap of sand** is not. Consider a **severed hand**. It was once part of a living person, but now it is dead matter.
  *   **A:** It is still a single object (a hand).
  *   **B:** It is no longer a single object; it is just matter arranged hand-wise.

  *   *If A:* Go to **Leaf 5**.
  *   *If B:* Go to **Leaf 3**.

  ---

  ### **THE LEAVES: YOUR POSITION**

  **Leaf 1: Nihilism**
  *   **Your View:** Composite objects do not exist; only simple particles exist.
  *   **Awkward Commitment:** You must deny that you have a body or that chairs exist, claiming instead that there are only particles arranged "you-wise" or "chair-wise."

  **Leaf 2: Universalism**
  *   **Your View:** Composition occurs for any collection of things, no matter how scattered or unrelated.
  *   **Awkward Commitment:** You must accept that there is an object composed of the Earth, the Moon, and the coffee cup on your desk right now.

  **Leaf 3: Organicism**
  *   **Your View:** Composition occurs only when the activity of the parts constitutes a life.
  *   **Awkward Commitment:** You must claim that a **severed hand** ceases to be an object the moment life leaves it, becoming merely a collection of atoms.

  **Leaf 4: Fastening View**
  *   **Your View:** Composition occurs when parts are physically bonded or fastened together (chemically or mechanically).
  *   **Awkward Commitment:** You must identify a precise moment in the bonding process (e.g., between glue and weld) where an object suddenly pops into existence, despite no change in the arrangement of parts.

  **Leaf 5: Functional Moderate**
  *   **Your View:** Composition occurs for living things and functional body parts, but not for heaps or scattered sums.
  *   **Awkward Commitment:** You must explain why a **severed hand** counts as an object while a **heap of sand** does not, despite both being non-living collections of matter.

  ---

  ### **INSTRUCTOR'S KEY: LOGICAL SPACE & ANALYSIS**

  *(Note to Seminar Participants: This section maps the logical terrain revealed by your answers.)*

  #### **1. Unoccupied or Problematic Logical Space**
  The tree above routes you to specific positions, but some combinations of answers are logically possible yet theoretically barren.
  *   **Cat = No / Scatter = Yes:** This combination is **incoherent**. If no composite objects exist (Nihilism), then scattered sums cannot exist either.
  *   **Cat = Yes / Heap = No / Hand = Yes (Leaf 5):** This space is often considered **merely unattractive**. It posits a "vital residue" where dead body parts retain object-hood while identical arrangements of sand do not. Many philosophers who start here are pushed toward either Organicism (deny the hand) or Universalism (accept the heap) to avoid arbitrariness.
  *   **Cat = Yes / Heap = Yes / Bond = Never (Q4-C):** This leads back to Nihilism regarding inorganic matter. This is **unexplored** in the literature as a stable position, as it requires a dual ontology where living things compose but bonded non-living things do not.

  #### **2. Indistinguishable Leaves**
  This tree cannot fully separate **Leaf 3 (Organicism)** and **Leaf 5 (Functional Moderate)** if the student argues that the severed hand retains "functional potential." Both views rely on a restriction to natural kinds or life, and the boundary between "dead part of a life" and "non-living matter" is vague.
  *   **Tie-Breaker Case:** **A preserved corpse.**
      *   The **Organicist** must say the corpse is not an object (life has ceased).
      *   The **Functional Moderate** might argue the corpse retains the structural integrity of the person and thus remains an object, or they may be forced to concede it is not, collapsing into Organicism.

  #### **3. The Sharp Line Problem**
  Notice that **Leaf 4 (Fastening View)** requires you to have selected a specific step in **Q4**. This highlights the primary objection to moderate views: the world does not seem to contain sharp metaphysical boundaries between "glued" and "welded." If you selected Step 3 or 4, your position entails that two objects could be identical in every physical respect (e.g., at the molecular level of the bond), yet in one case an object exists and in the other it does not.

  #### **4. Contact vs. Fastening**
  The tree groups "Touching" and "Holding Hands" as **Leaf 3 (Contact View)** variants, but these are often difficult to separate from **Leaf 4 (Fastening View)** if the student defines "fastening" loosely.
  *   **Tie-Breaker Case:** **Two interlocking steel rings not glued.**
      *   A **Contact Theorist** says they compose an object (they touch).
      *   A **Fastening Theorist** says they do not (they are not bonded/fused).
