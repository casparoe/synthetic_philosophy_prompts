answer: |-
  *(I sit back in my chair, the candlelight flickering across the manuscripts scattered on my desk. The year is 1846. The Corsair has done its work; the public has had its fun with me, laughing without looking me in the eye. I remove my spectacles and rub the bridge of my nose, listening to your strange tale with a mixture of melancholy and sharp, intellectual alertness.)*

  My dear traveler from the future... you bring me a vision that sounds like a nightmare dressed as a marketplace. But you misunderstand me. You misunderstand *passion*.

  You say this... "Twitter"... is full of passion because it is full of noise, of outburst, of immediate condemnation? No. That is not passion. That is *sensation*. That is the aesthetic sphere running riot, unchecked by the ethical, utterly devoid of the religious. Passion, in the sense I speak of, is not the speed with which one shouts an opinion. Passion is inwardness. Passion is the *how* of a relationship to truth, maintained even when the world is silent. What you describe is not passion; it is reflection accelerated to the point of vertigo. It is the Present Age not corrected, but perfected.

  You say people "take stands." Do they? Or do they take *positions*? To take a stand implies risk. It implies that I, the Single Individual, stake my existence on a truth before God. If I am wrong, *I* am wrong. If I am right, *I* am right. But you tell me this is done instantly, to a vast audience, with an... "algorithm" deciding the worth of the thought?

  This sounds to me like the Press, which I have just written about in *Two Ages*, but stripped of even the pretense of human responsibility. The Press was already an abstraction; a nobody speaking to nobodies. But this tool you describe... it seems to make the "Public" not just a phantom, but a tyrant.

  You claim my diagnosis was wrong because there is conflict. But conflict is not decision. Envy is conflict. Gossip is conflict. The leveling process I described is precisely this: no one is allowed to be better than anyone else, so everyone is dragged down into the swamp of immediate judgment. If this "Twitter" rewards the strongest reactions, it rewards the most extreme leveling. It rewards the scream, not the sigh. It rewards the crowd, not the individual.

  So, I insist: my diagnosis stands. This is the age of reflection without action, of talk without silence, of connection without communion.

  But I must understand the mechanics of this abstraction, this new idol. You say an "algorithm" decides what spreads.

  Tell me: Who created this algorithm? Is it a man? A committee? Or is it a machine, like a clockwork of the mind?
  And when this "mob" denounces a man—as the public denounced me, though I am but a private person—what happens to him? Is he exiled? Is he harmed? Or is he simply... erased?
  And tell me this, most importantly: When one publishes to this vast audience, does one sign one's name? Or does one hide behind a pseudonym, safer than I ever was with my many names, safer because there is no face to strike, only a phantom to dissolve?

  Speak. I need to know if there is any place for the Single Individual in your future, or if the crowd has finally swallowed the world whole.
