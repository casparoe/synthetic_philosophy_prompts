          *   "Find all entities with cellular structure." (Excludes viruses).
          *   "Find all entities with RNA genomes." (Includes viruses + some cellular life).
      *   *Inheritance/Polymorphism:* If "Organism" implies "Cellular," viruses break it. If "Organism" implies "Biological Entity with Genetics," viruses fit.
      *   *Solution:* Decouple the *classification* from the *identity*. Use labels/tags or a hierarchy that accommodates the ambiguity.

  4.  **Drafting the Response - Section by Section:**

