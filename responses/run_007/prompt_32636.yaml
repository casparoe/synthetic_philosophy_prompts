      *   **Goal:** Needs help understanding the nature of the definitional problem *and* actionable advice on the database schema.

  2.  **Deconstruct the Philosophical/Biological Issue:**
      *   *The "Life" Definition Problem:* The user is correct. Biology does not have a consensus definition of life that cleanly includes/excludes viruses without edge cases (mules, spores, fire, crystals).
