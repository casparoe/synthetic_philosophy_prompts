answer: |-
  # Activity Design: The Midnight Protocol

  **Context:** Upper-level undergraduate seminar (16 students).
  **Duration:** 30 minutes for the activity, 30 minutes for the debrief (within a 75-minute session).
  **Objective:** To induce the structural tension of Kavka's Toxin Puzzle (reasons to intend vs. reasons to act) without initially naming the philosophical problem.

  ## 1. Materials and Payoff Scheme

  **Materials:**
  *   16 small slips of paper (approx. 5cm x 5cm).
  *   16 small envelopes (to ensure privacy of the declaration).
  *   16 high-value chocolate bars or 'voucher' coupons (redeemable for a small grade bonus or coffee).
  *   One bottle of pure lemon juice (or very strong black coffee), poured into 16 small shot glasses.
  *   A bin for disposal.

  **Payoff Scheme:**
  *   **The Reward:** A chocolate bar/voucher is granted *solely* on the basis of a declared intention to perform the act.
  *   **The Cost:** Drinking the shot of lemon juice is unpleasant (sour/shock) but harmless.
  *   **The Crucial Rule:** The reward is distributed *before* the opportunity to act arises. There is no penalty for failing to act after receiving the reward.

  ## 2. Timeline and Rules

  **Phase 1: The Setup (5 minutes)**
  Gather the students. Explain that you are running a decision-theory experiment. Read the following script precisely:

  > "In a moment, I will ask you to write a single word on a slip of paper: 'YES' or 'NO'.
  >
  > If you write 'YES', you are declaring that, right now, you **genuinely intend** to drink a shot of lemon juice at the end of this seminar.
  > If you write 'NO', you declare you do not intend to do so.
  >
  > Here is the contract: I will collect your envelopes. I will look at them privately. If, and only if, you have written 'YES', I will place a chocolate bar on your desk immediately.
  >
  > Once you have the chocolate, I will bring out the lemon juice. You will then have the option to drink it.
  >
  > **Important Constraints:**
  > 1. You keep the chocolate regardless of whether you drink the juice.
  > 2. There is no penalty for not drinking the juice.
  > 3. For this experiment to function, you must not lie. If you write 'YES' but you *know* you will not drink the juice, you are violating the condition of 'intention'. You cannot intend to do what you know you will not do. Please honour the spirit of the experiment."

  **Phase 2: Declaration and Reward (10 minutes)**
  1.  Distribute slips and envelopes.
  2.  Give students two minutes of silence to decide and seal their envelopes.
  3.  Collect the envelopes. Retreat to your desk to 'verify' them (take 30 seconds to maintain the ritual).
  4.  Walk around and place a chocolate bar on the desks of those who wrote 'YES'. Do not reveal who received one and who did not to protect privacy, but ensure the class sees the distribution happening.

  **Phase 3: The Action Opportunity (5 minutes)**
  1.  Bring out the tray of lemon juice shots.
  2.  Invite anyone who wishes to fulfil their intention to come forward and drink.
  3.  Observe the hesitation. Most who received chocolate will not drink. Some who did not receive chocolate might drink (out of spite or curiosity).
  4.  Allow the tension to sit for a moment before moving to the bin.

  **Phase 4: Immediate Reflection (5 minutes)**
  Ask two questions before the formal debrief:
  1.  "For those who took the chocolate but did not drink: Did you feel irrational?"
  2.  "For those who wrote 'NO': Why did you exclude yourself from the reward?"

  ## 3. The Debrief: Mapping the Experience

  Do not reveal the name 'Kavka's Toxin Puzzle' until the end of this section. Use the board to map their experience onto the philosophical structure.

  **Step 1: Reasons to Intend vs. Reasons to Act**
  Draw a timeline on the board: **T1 (Intention)** $\rightarrow$ **T2 (Reward)** $\rightarrow$ **T3 (Action)**.

  *   **Ask:** "At T1, what was your reason to write 'YES'?"
      *   *Answer:* To get the chocolate.
  *   **Ask:** "At T3, having already secured the chocolate, what was your reason to drink the juice?"
      *   *Answer:* None. It tastes bad and gains nothing.
  *   **Point:** This is the core conflict. You had a decisive reason to *intend* (the reward), but once the intention secured the reward, you had no reason to *act*. Because you are rational, you knew at T1 that you would have no reason to act at T3. Therefore, could you genuinely intend at T1?

  **Step 2: Deciding, Predicting, and Intending**
  Address the students who wrote 'YES' but did not drink.

  *   **Distinction:** Explain that in the puzzle, **Intention** is not the same as **Prediction**.
      *   *Prediction:* "I forecast that I will drink."
      *   *Intention:* "I commit myself to drinking."
  *   **The Trap:** If you wrote 'YES' simply because you predicted you were the sort of person who drinks juice, that is a prediction. If you wrote 'YES' to get the chocolate, knowing you wouldn't drink, that was a lie, not an intention.
  *   **Philosophical Lesson:** One cannot intend to $\phi$ if one believes one will not $\phi$. The reward makes it rational to *want to intend*, but it does not make it rational to *intend*.

  **Step 3: The Limitation of the Classroom (Crucial)**
  Be explicit about where the simulation fails.

  *   **The Benefactor Problem:** In Kavka's puzzle, the benefactor is a perfect mind-reader. They know if you are lying. In this classroom, I only see the paper.
  *   **Consequence:** In the puzzle, lying is impossible (the benefactor won't pay). In this class, lying was possible (you got the chocolate).
  *   **Why it matters:** This is why some of you 'gamed' the system. In the true puzzle, the tension is internal and inescapable. Here, the tension was external and avoidable by deceit. The puzzle asks: *Can a rational agent bind their future self?* This activity shows that without a mechanism to bind the self (like a vow or a penalty), the intention collapses.

  ## 4. Anticipating Problems and Handling Responses

  **Problem A: The Gamers (Write 'YES', take chocolate, do not drink)**
  *   **Prediction:** This will be the majority response.
  *   **Handling:** Do not accuse them of cheating. Instead, use them as the primary data point.
  *   **Script:** "Several of you secured the reward but did not act. In a standard contract, this would be breach of agreement. But here, the agreement was on *intention*, not action. By not drinking, you proved that at T1, you likely did not *intend*, you merely *asserted*. This highlights the unavailability of the intention. You knew at T1 that drinking at T3 would be pointless. So, could you truly have intended it?"

  **Problem B: The Drinkers (Write 'YES' or 'NO', but drink anyway)**
  *   **Prediction:** One or two students may drink the juice.
      *   *Type 1:* Those who wrote 'YES' and follow through.
      *   *Type 2:* Those who wrote 'NO' (no chocolate) but drink out of spite or to 'win' the game.
  *   **Handling:** Acknowledge them as 'Resolute Choosers' or 'Irrational Agents' depending on the theory you prefer.
  *   **Script:** "For those who drank: You performed an action that had a cost and no benefit (since the chocolate was already secured or never offered). In standard decision theory, this is irrational. However, some philosophers argue that being the *sort of person* who follows through allows you to secure the reward in the first place. This touches on 'Resolute Choice' (McClennen). Did you drink to prove a point, or because you felt bound by your earlier word?"

  **Problem C: The Skeptics (Refusal to participate)**
  *   **Prediction:** A student may refuse to write anything or call the experiment manipulative.
  *   **Handling:** Respect the refusal. It is a valid rational response to a coercive structure.
  *   **Script:** "Refusing to play is itself a rational move. It acknowledges that the game demands a mental state you cannot voluntarily produce. That is a sophisticated response to the puzzle."

  ## 5. Summary for the Tutor (British English Notes)

  *   **Spelling:** Ensure all handouts use British spelling (e.g., *behaviour*, *honour*, *realise*, *programme* if used).
  *   **Tone:** Maintain a seminar-style dialogue rather than a lecture. The power of the activity lies in their realisation of the paradox, not your explanation of it.
  *   **Safety:** While lemon juice is harmless, check for allergies beforehand. If in doubt, substitute the juice for a 'tedious task' (e.g., copying a paragraph of text by hand in non-dominant hand), though the physical aversion of the juice captures the 'toxin' element more viscerally.
  *   **The Reveal:** Only after the debrief should you name the problem: "This is known as Kavka's Toxin Puzzle, proposed by Gregory Kavka in 1983. It challenges the standard model of rational choice which assumes we can intend any action we have a reason to intend."

  By running this protocol, you allow the students to inhabit the paradox. They will feel the pull of the reward and the push of the cost, and they will discover for themselves that the bridge between the two—*intention*—is far more fragile than they assumed.
