answer: |-
  The replication crisis that swept through psychology and neighboring social sciences beginning around 2011 serves as a stark natural experiment in the philosophy of statistics. For decades, the scientific community had organized its inference almost exclusively around null-hypothesis significance testing, a frequentist framework that prioritizes long-run error control over the quantification of belief in specific hypotheses. When the Open Science Collaboration estimated in 2015 that fewer than half of published findings could be reproduced, it was not merely a failure of individual researchers but a systemic collapse of an inferential ecosystem. Viewing this collapse through the lens of the Bayesian critique offers a compelling diagnosis, suggesting that the crisis was not an accident but a predictable consequence of relying on tools that are easily misunderstood and easily gamed. A Bayesian analysis posits that the core failure was a category error regarding what statistical output represents. Frequentist p-values measure the probability of observing data as extreme as what was collected, assuming the null hypothesis is true, yet they are almost universally interpreted as the probability that the hypothesis is true given the data. This conflation ignores the base rate of true hypotheses in the field. If the prior probability of a hypothesis being true is low, as is often the case in exploratory social science, even a statistically significant result is more likely to be a false positive than a true discovery. The Bayesian diagnosis argues that the crisis was essentially a massive episode of base-rate neglect, where the scientific community treated significant p-values as strong evidence without accounting for the low prior odds of the theories being tested.

  Beyond the neglect of base rates, the Bayesian lens highlights specific pathologies inherent to the frequentist reliance on error rates rather than likelihoods. The stopping-rule problem illustrates this vividly. In frequentist inference, the validity of a p-value depends on the researcher's intent regarding when to stop collecting data. If a researcher checks results periodically and stops once significance is reached, the Type I error rate inflates, rendering the p-value invalid. Bayesian inference, governed by the likelihood principle, contends that the evidence provided by the data should depend only on what was observed, not on what might have been observed under different stopping intentions. The replication crisis was fueled by optional stopping and p-hacking, practices that exploit the frequentist sensitivity to experimental intent. From a Bayesian perspective, these practices corrupt the inference because the frequentist framework ties the meaning of data to the unobservable mental states of the researcher regarding their sampling plan. Furthermore, the incoherence of p-values as measures of evidence means they do not accumulate linearly or logically. Two independent studies might both yield non-significant results, yet their combination could be significant, or vice versa, leading to a fragmented literature where the aggregate evidence is obscured by binary thresholds. The crisis revealed that a system built on dichotomous decisions rather than continuous updates of belief is brittle when subjected to the pressures of publication and career advancement.

  However, while the Bayesian diagnosis explains the mathematical vulnerabilities that allowed the crisis to fester, it struggles to account for the sociological dimensions that a change in statistics alone cannot fix. The file-drawer problem, where null results remain unpublished, distorts the literature regardless of whether one uses p-values or Bayes factors. If only positive results are published, the posterior probability of a theory being true remains inflated because the denominator of evidence is missing. A Bayesian analysis can model publication bias, but it cannot prevent it without structural changes to publishing incentives. Moreover, the Bayesian diagnosis sometimes risks implying that the crisis was solely a statistical misunderstanding rather than a consequence of perverse incentives. Researchers were not merely confused about base rates; they were rewarded for producing novel, clean stories. The pressure to publish created a demand for significance that transcended the statistical framework used to achieve it. Therefore, while the Bayesian critique cleanly explains why p-hacking and optional stopping lead to false positives within the logic of frequentism, it is less effective at explaining why researchers felt compelled to engage in these practices in the first place, or why fraud and measurement error, which are independent of statistical philosophy, played such a significant role in the replication failures.

  Running the analysis in the other direction reveals that the replication crisis does not automatically vindicate Bayesianism as a panacea. While the crisis strengthens the case that null-hypothesis significance testing is fragile under real-world conditions, it also demonstrates that any inferential framework can be gamed under the right incentives. If the currency of science shifts from p-values less than 0.05 to Bayes factors greater than a certain threshold, researcher degrees of freedom may simply relocate rather than disappear. The specification of priors introduces a new avenue for subjectivity. A researcher motivated to confirm a pet theory could select a prior that favors the alternative hypothesis, thereby manufacturing strong Bayesian evidence where none objectively exists. This phenomenon, sometimes called prior hacking, suggests that the subjectivity inherent in Bayesianism, often touted as a feature for incorporating domain knowledge, can become a bug when integrity is compromised. The crisis reveals that statistical frameworks are tools embedded in a human system, and no mathematical formalism can fully inoculate against the desire to find a specific result. Consequently, the episode suggests that the problem was not exclusively the frequentist math, but the lack of transparency that allowed both frequentist and potential Bayesian manipulations to go undetected.

  This leads to the deeper philosophical disagreement regarding the nature of probability itself, which the replication crisis leaves largely unsettled. The frequentist view holds that probability is a property of the world, specifically the long-run frequency of events in repeated sampling. The Bayesian view holds that probability is a property of the mind, representing a degree of belief or uncertainty. The replication crisis provides empirical data on failure rates, which are frequentist concepts, but it does not directly adjudicate whether belief updating or error control is the proper goal of science. A high rate of failed replications indicates that the long-run error rates were not controlled as promised, which is a strike against the practical implementation of frequentism, but it does not prove that subjective probability is the correct metaphysical interpretation of uncertainty. Conversely, adopting Bayesian methods would not guarantee higher replication rates if the priors are poorly chosen or if the data quality is low. The crisis shows that relying on long-run guarantees is useless if the actual run is corrupted by bias, but it does not prove that quantifying belief is inherently more truthful. Both frameworks require assumptions about the data generation process, and both are vulnerable when those assumptions are violated by sloppy measurement or selective reporting.

  Ultimately, the replication crisis should shift our credences regarding statistical practice more than it shifts our credences regarding the philosophy of probability. It strongly suggests that the rigid adherence to null-hypothesis significance testing, particularly without regard for power or prior plausibility, was a contributing factor to the fragility of the literature. The crisis validates the Bayesian warning that evidence should be continuous and sensitive to base rates, and it supports the adoption of practices like preregistration which align frequentist error control with actual experimental intent. However, it does not resolve the debate between probability in the world versus probability in the mind. Instead, it highlights that the distinction between inherent flaws in a framework and the misuse of that framework is often blurred by incentive structures. NHST is inherently vulnerable to optional stopping, but it was the misuse of that vulnerability that caused the crisis. Bayesianism is inherently flexible regarding priors, but it is vulnerable to the misuse of that flexibility. The lesson is not that one side of the statistical debate was right and the other wrong, but that no statistical method can compensate for a lack of scientific integrity. The crisis argues for a pluralistic approach where transparency, open data, and replication are valued over the specific mathematical machinery used to summarize evidence, leaving the philosophical arguments about the nature of probability exactly where they were, but demanding that whichever philosophy is chosen must be practiced with radical honesty.
