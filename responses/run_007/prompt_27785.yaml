prompt: |-
  ok so my friend maya has this whole thing about when its ok to believe something even when the evidence doesn't fully settle it. i've been keeping a list of her calls because they seem super consistent but i can't actually tell what the rule is, and i've thought about this alot. here's what she's said:

  - it was ok for our friend to keep believing his brother didn't cheat on the exam, even though there was real evidence pointing both ways.
  - it was not ok to believe you'll win a raffle with 1 in 500 odds just because you really want the prize.
  - it was ok to believe you'll be happy at the new school your parents are making you move to, even though you don't know and people say mixed things about it.
  - it was not ok to believe the principal is secretly resigning just because that would be exciting gossip.
  - it was ok to keep believing your mom will recover when the doctors say it's genuinely 50/50 and they honestly can't tell yet.
  - it was not ok to believe a coin will land heads before you flip it.

  now the case i actually care about. the honor council (which we're both on) has to vote on whether to recommend expelling a kid neither of us knows, after a cheating scandal where the evidence is genuinely split: some teachers say he did it, some say he didn't, and the security footage is inconclusive. we can't abstain, the principal wants a yes-or-no recommendation, and it's basically going to decide the kid's future. is it ok, by maya's lights, for someone on the council to believe he's innocent even though the evidence doesn't decide it?

  i'm less interested in the yes/no than in the rule she's running. what rule or rules fit her calls, what would each one say about the expulsion case, and what's the best follow-up case to figure out which rule she's actually using? and give me your best guess about what she'd say, with the reasons.
