answer: |-
  You have hit on one of the most significant and enduring objections to the standard Money Pump Argument in decision theory. Your intuition is correct: the Money Pump Argument, in its strongest form, relies heavily on the agent being **naive** about their own future choices.

  There isn't one single "pop psychology" term for this gap, but in decision theory and philosophy of economics, this distinction is discussed under a few specific headings. Here is the terminology and the theoretical landscape surrounding your observation.

  ### 1. Sophistication vs. Naivety
  The technical terms for the two types of agents you are describing come from Robert Strotz (1955).
  *   **The Naive Agent:** Believes their future preferences will match their current ones, or simply doesn't think ahead. They accept the first trade (B for A), expecting to stop there, but when the next opportunity arises, they accept C for B, and so on. They get pumped.
  *   **The Sophisticated Agent:** Knows their own preferences are time-inconsistent (or cyclic). They use **backward induction**. They look at the final node, realize they will make a trade that loses money, and therefore refuse the *first* trade to prevent entering the sequence.

  So, the term for the "smart" behavior you are describing is **Sophisticated Choice**. The gap you are noticing is the divergence between **local preferences** (at the moment of the trade) and **global strategy** (the plan to avoid loss).

  ### 2. Resolute Choice
  Edward McClennen, in his book *Rationality and Dynamic Choice* (1990), offers a specific term for the mechanism your faculty colleague used. He calls it **Resolute Choice**.
  *   A sophisticated agent avoids the pump by *changing their choice* (refusing the trade).
  *   A resolute agent avoids the pump by *committing to a plan*. They say, "Even though I currently prefer A to B, I have adopted a plan to stay with B, and I will stick to it."

  In your faculty meeting example, the colleague is exercising a form of resolute choice (or procedural commitment) by abstaining. They are prioritizing a **procedural norm** (consistency/transitivity) over their **substantive preferences** (Research > Teaching > Collegiality).

  ### 3. Revealed Preference Theory
  Your question *"In what sense do they still 'have' cyclic preferences?"* strikes at the heart of the **Revealed Preference** revolution (Paul Samuelson).
  *   **The Behaviorist View:** Preferences are *defined* by choices. If you refuse the trade, you reveal that you prefer "Keeping B + $0" to "Having A - $1." Therefore, you *do not* have cyclic preferences. The cycle is an illusion; your preferences are actually transitive.
  *   **The Mentalist View:** Preferences are psychological states. You can value A > B internally, but choose B > A strategically.

  Economists generally prefer the Revealed Preference view because it makes preferences observable. Philosophers and psychologists prefer the Mentalist view because it accounts for regret and internal conflict. The "gap" you see is the friction between these two definitions. If you adopt the Mentalist view, the gap is real. If you adopt the Behaviorist view, the gap doesn't exist (because the preference changed to match the action).

  ### 4. Does the Money Pump Argument Require Naivety?
  Yes. Modern decision theorists (such as Johan Gustafsson, who has written extensively on this) acknowledge that the Money Pump Argument only proves that cyclic preferences are irrational **if** the agent is unable to plan ahead or self-bind.

  If the agent is sophisticated, the Money Pump Argument shifts from being a **logical proof of impossibility** to a **pragmatic argument about cost**.
  *   **Naive Agent:** Cyclic preferences *force* you to lose money.
  *   **Sophisticated Agent:** Cyclic preferences *force you to incur cognitive costs* to monitor yourself, or *force you to abstain* from beneficial trades, or *force you to limit your own options*.

  So, the argument still does work on the sophisticated agent, but differently. It argues that having cyclic preferences is **expensive**. You have to spend mental energy avoiding the pump, or you have to pass up trades you would otherwise want (like your colleague abstaining from the vote). Transitivity is therefore a norm of **efficiency**, not just logic.

  ### 5. Terms for the "Gap"
  If you are looking for a phrase to describe the phenomenon where internal valuation differs from strategic choice to avoid exploitation, you might use:
  *   **Preference-Choice Divergence:** (Descriptive)
  *   **Strategic Rationality vs. Local Rationality:** (Game Theoretic)
  *   **Metapreferences:** (Amartya Sen/Harry Frankfurt) The preference *about* which preferences to act on. Your colleague has a first-order preference (X > Y) and a second-order preference (I want to be consistent). The second-order preference wins.
  *   **Endogenous Constraints:** The agent imposes constraints on themselves that weren't there originally.

  ### Summary of Your Faculty Example
  Your colleague's move is a classic example of **agenda control** or **procedural rationality**. By abstaining, he removes himself from the cycle.
  *   **Does he still have cyclic preferences?** Psychologically, yes.
  *   **Are they irrational?** Pragmatically, no, because he managed the risk.
  *   **What is the cost?** He loses agency. He has to let the committee decide rather than advocating for what he actually values. That loss of agency is the "tax" he pays for having cyclic preferences.

  ### Conclusion
  You are right to be skeptical of the "naive" money pump story. The gap you've identified is the difference between **competence** (the underlying preference structure) and **performance** (the actual choice made under constraints).

  The Money Pump Argument survives not by proving cyclic preferences are impossible for smart people, but by proving they are **burdensome**. A transitive agent can act freely; a cyclic agent must act strategically to avoid being fleeced. The "term" for the gap is simply the cost of **dynamic inconsistency**, paid for by **sophistication**.
