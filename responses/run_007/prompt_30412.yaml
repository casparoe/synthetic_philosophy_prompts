answer: |-
  # JOINT STATEMENT ON DECISION-MAKING UNDER MORAL UNCERTAINTY

  ### 1. Shared Claims
  Both signatories affirm the following propositions regarding the nature of moral uncertainty and the requirements of rational agency:

  1.  **Existence of Moral Uncertainty:** Rational agents can and often do hold non-extreme credences regarding competing fundamental moral theories (e.g., utilitarianism, deontology, virtue ethics). This uncertainty is distinct from empirical uncertainty and cannot be reduced to it.
  2.  **Inadequacy of Dogmatism:** It is rationally defective to act as though one's current most-credenced moral theory is certainly true. A decision procedure must account for the possibility that one's favorite theory is false.
  3.  **Nature of Credences:** Credences over moral theories represent degrees of belief in the truth or correctness of those theories, not merely preferences or pragmatic commitments. These credences are subject to norms of rationality (e.g., probabilistic coherence).
  4.  **What Moral Uncertainty Is Not:** Moral uncertainty is not moral skepticism. Both sides agree there are objective facts about what one ought to do under uncertainty, even if there is disagreement about how to calculate them. Nor is it merely "empirical uncertainty about moral facts"; the disagreement concerns the fundamental axioms of value itself.
  5.  **Reasonable Disagreement:** Reasonable people with access to the same evidence may persistently disagree on fundamental moral axioms. Therefore, a decision procedure under uncertainty must be robust to the fact that one's own credence distribution may be mistaken.
  6.  **Action-Guidance:** The purpose of this framework is action-guidance. Both sides reject the view that moral uncertainty paralyzes agency; a choice must be made, and some procedures are rationally superior to others.
  7.  **Internal Divisions Acknowledged:**
      *   *Within MEC:* Signatories acknowledge a division between those who believe **cardinal** intertheoretic comparisons are possible (required for standard expectation) and those who believe only **ordinal** comparisons are possible (requiring modified MEC rules).
      *   *Within MFT:* Signatories acknowledge a division regarding the **credence threshold** required to act on a theory (e.g., >50% vs. >90%) and whether a "favorite theory" can be a disjunction of theories sharing a specific constraint.

  ### 2. Points of Divergence
  The following table isolates the substantive disagreements. Neutral descriptions are provided in the first column; the second and third columns use terminology and justification specific to each camp.

  | Point of Divergence | MEC Position (Maximizing Expected Choiceworthiness) | MFT Position (My Favorite Theory) |
  | :--- | :--- | :--- |
  | **Aggregation Principle** | **Expectation Maximization:** Rationality requires maximizing the *expected* choiceworthiness of an action, calculated by summing the product of each theory's credence and its assigned choiceworthiness value for that action. | **Maximax Credence:** Rationality requires acting on the theory with the highest credence (provided it exceeds a threshold). Aggregating values across theories is category error; only the *truth* of the theory matters, not its probability. |
  | **Intertheoretic Comparison** | **Necessary and Solvable:** To calculate expectations, we must compare values across theories (e.g., "How many units of utilitarian value equal one duty fulfilled?"). While difficult, normalization methods (e.g., variance normalization) make this sufficiently precise for decision-making. | **Impossible or Unnecessary:** There is no common scale of value between fundamentally different moral theories. Attempting to compare them introduces arbitrary noise. We should avoid comparisons entirely and rely on credence ordering alone. |
  | **Sensitivity to Stakes** | **High Stakes Sensitivity:** A theory with low credence can override a theory with high credence if the stakes (magnitude of choiceworthiness difference) are sufficiently high. (e.g., 1% credence in genocide outweighs 99% credence in inconvenience). | **Low Stakes Sensitivity:** Stakes internal to a theory do not amplify its weight in decision-making. If Theory A is most credible, its prescriptions hold unless another theory surpasses it in credence. High stakes do not justify acting on a theory you likely believe is false. |
  | **Risk of Fanaticism** | **Accepted Risk:** We must accept some vulnerability to "moral fanaticism" (tiny credence in extreme value) because ignoring high-stakes low-probability events is itself a catastrophic error. | **Avoidance Priority:** A decision rule that allows tiny credences to dominate action is structurally flawed (Pascal's Mugging). MFT protects agents from being held hostage by implausible extreme theories. |
  | **Definition of Rational Error** | **Error is Sub-Optimal Expectation:** You act wrongly under uncertainty if you fail to maximize expected choiceworthiness, even if you follow your favorite theory. | **Error is Violating True Theory:** You act wrongly under uncertainty only if you violate the theory that is *actually true*. Under uncertainty, you act rightly if you follow your best guess. |
  | **Verbal Dispute Dissolved** | **N/A** | **N/A** |
  | *Note on "Rationality"* | *Both sides agree this is not merely semantic.* | *Both sides agree this is not merely semantic.* |

  ### 3. Cruxes and Predictions
  The following empirical or conceptual claims represent the "cruxes" of the disagreement. Resolution of these claims would cause significant updating by at least one side.

  | Crux Question | MEC Prediction / Condition for Shift | MFT Prediction / Condition for Shift |
  | :--- | :--- | :--- |
  | **Possibility of Intertheoretic Comparison:** Can agents reliably construct a common scale of value across deontological and consequentialist theories without arbitrary stipulation? | **Prediction:** Yes. Normalization techniques (e.g., variance normalization) will converge on stable ratios as philosophical analysis improves.<br>**Shift Condition:** If it is proven that all normalization methods yield arbitrary results sensitive to irrelevant theory formulation, MEC proponents will abandon standard expectation maximization. | **Prediction:** No. Values are theory-constituted and incommensurable.<br>**Shift Condition:** If a method is demonstrated that yields robust, non-arbitrary comparisons accepted by proponents of conflicting theories, MFT proponents will adopt MEC. |
  | **The Stakes Intuition:** In cases where a low-credence theory implies catastrophe and a high-credence theory implies minor inconvenience, is it rational to prioritize the low-credence theory? | **Prediction:** Yes. Ignoring the catastrophe is irrational risk-taking.<br>**Shift Condition:** If it is shown that acting on low-credence high-stakes theories systematically leads to worse outcomes (by the agent's own lights) than following credence thresholds, MEC proponents will incorporate threshold constraints. | **Prediction:** No. Acting on a theory you believe is likely false is irrational, regardless of stakes.<br>**Shift Condition:** If intuitive case judgments strongly favor overriding the favorite theory in extreme stakes cases (e.g., Pascal's Mugging variants where the mugger is credible), MFT proponents will incorporate stakes-sensitive veto powers. |
  | **Structural Analogy:** Is decision-making under moral uncertainty structurally isomorphic to decision-making under empirical uncertainty? | **Prediction:** Yes. The same Dutch Book arguments and representation theorems that support expected utility theory apply to moral credences.<br>**Shift Condition:** If it is proven that moral credences do not behave like probabilities (e.g., they are not updateable via Bayes' rule), MEC loses its formal foundation. | **Prediction:** No. Moral theories are not "states of the world" but competing frameworks of evaluation. You cannot average across frameworks.<br>**Shift Condition:** If a formal proof demonstrates that rejecting expectation maximization leads to guaranteed diachronic inconsistency or sure-loss scenarios specific to moral choice, MFT proponents will reconsider. |
  | **Phenomenology of Regret:** When an agent follows their favorite theory but later becomes convinced it was false, was their prior action rational? | **Prediction:** Not necessarily. If they ignored a high-stakes minority view, they were rationally criticizable ex ante.<br>**Shift Condition:** If consensus emerges that ex ante rationality is solely determined by adherence to current credences regardless of stakes, MEC will soften its stakes claim. | **Prediction:** Yes. They acted on their best judgment. Ex post regret does not imply ex ante irrationality.<br>**Shift Condition:** If consensus emerges that ex ante rationality requires minimizing potential "moral wrongness" rather than maximizing "correctness of procedure," MFT will shift toward MEC. |
