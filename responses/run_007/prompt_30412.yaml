prompt: |-
  Draft the joint statement that a proponent of maximizing expected choiceworthiness under moral uncertainty (MEC) and a proponent of the "my favorite theory" approach (MFT — you should just act on whatever moral view you find most credible) could both sign after an adversarial collaboration. I'm not interested in a watered-down compromise. I want the genuine common ground, stated precisely enough that neither side feels misrepresented. Give me: (1) a numbered list of claims both can sign — about the structure of moral disagreement, about what happens when reasonable people disagree, about what moral uncertainty is not; (2) a disagreements table where each row states the point of divergence in neutral terms and then gives each side's position in wording that side's own advocates would endorse; (3) the cruxes — the sub-questions that, if resolved, would cause at least one side to shift — and for each crux, what each side predicts about how it comes out. Lead with the statement itself, no preamble, no throat-clearing. And I want a committed joint statement, not one that just maps the terrain: where there's a real disagreement, say so and don't paper over it; where there's a merely verbal dispute, identify it and dissolve it. Oh, and if there are internal divisions within either camp that matter for the joint statement — like MEC people who do versus don't accept intertheoretic comparisons of value — flag them rather than pretending the camps are monolithic.
