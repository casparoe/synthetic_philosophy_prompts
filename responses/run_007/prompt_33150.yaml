answer: |-
  ### Brainstorming Approaches

  Here are three potential approaches to teaching the concept of "intuition pumps" without front-loading the theory:

  1.  **The "Classic Trap" (Trolley Problem Variations):**
      *   *Idea:* Run the standard Trolley Problem, then a variation (Footbridge), then a third variation that is logically identical to the first but framed differently.
      *   *Pros:* Familiar structure; clear moral stakes.
      *   *Cons:* Many high schoolers have already encountered the Trolley Problem in pop culture or ethics classes. Prior knowledge ruins the "real-time" feeling of being pumped.

  2.  **The "Narrative Fade-Out":**
      *   *Idea:* Tell a long, emotionally gripping story (e.g., a specific person suffering) and ask for a judgment. Then reveal a second group heard a dry, statistical version of the same event.
      *   *Pros:* Demonstrates the "vividness" heuristic well.
      *   *Cons:* Hard to execute in one hour. Requires two facilitators or pre-recorded audio to prevent cross-contamination of information before the reveal.

  3.  **The "Identical Facts, Different Frames" (Selected Approach):**
      *   *Idea:* Create a single philosophical scenario (a thought experiment) but write two versions. The underlying logical facts are identical, but the *language*, *ordering*, and *selective details* differ to prime opposite intuitions. Split the room in half.
      *   *Pros:* Directly isolates the variable of "framing." Creates an immediate, undeniable "Aha!" moment when the groups compare notes. Highly scalable for a 15-person club.
      *   *Cons:* Requires careful writing to ensure the facts *are* actually identical beneath the rhetoric.

  **Selection:** I recommend **Approach 3**. It is the most robust way to demonstrate that the *structure of the presentation* is doing the persuasive work, not just the logic. It turns the students into data points in their own experiment.

  ---

  ### Activity Design: "The Valley Project"

  **Objective:** Participants will make a moral judgment based on a scenario, then discover that their judgment was heavily influenced by linguistic framing rather than factual difference, leading to an understanding of "intuition pumps."

  **Materials Needed:**
  *   Two different handouts (Version A and Version B). Print 8 of A and 7 of B (or vice versa).
  *   Whiteboard or chalkboard.
  *   Pens/pencils.
  *   A timer.

  **The Scenarios (For Facilitator Eyes Only):**
  *Note: Do not show this to students. The key is that the **bolded** facts are identical, but the surrounding language pumps different intuitions.*

  *   **Version A (The "Progress" Frame):**
      > "The Regional Council proposes the **Greenwood Dam**. The project will **generate 500 megawatts of electricity**, powering **50,000 homes**. To build it, **30 families must relocate** from the **low-lying valley floor**. The land is **prone to seasonal flooding**. The Council argues this is a **necessary modernization** to secure the region's **economic future**. The families will receive **market-value compensation**."

  *   **Version B (The "Heritage" Frame):**
      > "The Regional Council proposes the **Greenwood Dam**. The project will **submerge the Greenwood Valley**. To build it, **30 families must be displaced** from their **ancestral homesteads**. The land includes **historical burial grounds**. The Council admits this is a **forced removal** to secure **industrial output**. The families will receive **cash settlements**."

  *(Note to Facilitator: In the debrief, you will reveal that "50,000 homes powered" = "industrial output," "relocate" = "displaced," "market-value compensation" = "cash settlements," etc. The core facts are the same; the valence is opposite.)*

  ---

  ### Timeline (60 Minutes)

  **0:00 – 0:05: Introduction & Split**
  *   Welcome the club. Do not mention "intuition pumps," "framing," or "bias."
  *   Say: "Today we are testing how we make philosophical judgments. I need you to split into two groups, Left and Right. Please do not show your papers to the other group."
  *   Hand out Version A to the Left, Version B to the Right.

  **0:05 – 0:15: Silent Reading & Private Vote**
  *   Instruct: "Read the brief silently. Then, on the back of the page, write 'YES' if you think the Council should proceed, or 'NO' if they should not. Do not discuss yet."
  *   *Goal:* Capture the raw, unparsed intuition.

  **0:15 – 0:25: Small Group Discussion**
  *   Instruct: "Discuss with your group *why* you voted that way. What facts mattered most? Try to reach a consensus or understand the disagreement."
  *   *Facilitator Role:* Circulate. Listen for the language they use. If Group A says "It's progress," note that. If Group B says "It's displacement," note that. Do not correct them.

  **0:25 – 0:40: The Reveal & Comparison**
  *   Bring the room together.
  *   Ask Group A: "How many voted Yes?" (Likely high). "Why?" (Write keywords on board: *Progress, Energy, Flood-prone*).
  *   Ask Group B: "How many voted Yes?" (Likely low). "Why?" (Write keywords on board: *Displacement, Ancestral, Forced*).
  *   **The Twist:** "I am now going to read Version A aloud. Group B, listen for the facts. Then I will read Version B. Group A, listen for the facts."
  *   Read them back-to-back.
  *   Ask: "Are these different projects?"
  *   Let the realization sink in. Guide them to map the identical facts (e.g., "Relocate" vs. "Displace").

  **0:40 – 0:55: Debrief (The Philosophy)**
  *   (See detailed debrief script below).

  **0:55 – 1:00: Closing**
  *   Summarize the takeaway. Assign a optional reflection prompt for next time.

  ---

  ### Detailed Debrief Script & Mapping

  *This is where you introduce the term "Intuition Pump" (coined by Daniel Dennett). Do not use it before this section.*

  **1. Naming the Phenomenon (5 mins)**
  *   **Say:** "You just experienced two different reactions to the exact same situation. In philosophy, we call the tool that caused this an **Intuition Pump**."
  *   **Define:** "A thought experiment is supposed to clarify a problem. An *intuition pump* is a specific kind of thought experiment designed to manipulate your emotional or intuitive response so strongly that you accept a conclusion without checking the logic."
  *   **Map:** "In this activity, the text you read wasn't a logical argument. It was a pump. It pumped 'Approval' in Group A and 'Disapproval' in Group B."

  **2. Analyzing the Machinery (10 mins)**
  *   **Ask:** "What specific gears turned the pump?"
  *   **Guide them to identify these three mechanisms (write on board):**
      1.  **Loaded Vocabulary:** *Relocate* (neutral/voluntary) vs. *Displace* (violent/involuntary). *Modernization* (good) vs. *Industrial Output* (cold).
      2.  **Selective Salience:** Version A highlighted the *beneficiaries* (50,000 homes). Version B highlighted the *victims* (ancestral homesteads). Both facts were true, but the text told you which one to care about.
      3.  **Implicit Assumptions:** Version A assumes economic growth is the default good. Version B assumes heritage preservation is the default good.
  *   **Philosophical Point:** "A neutral argument gives you the premises and asks if the conclusion follows. An intuition pump makes the conclusion *feel* obvious so you skip the premise-checking."

  **3. Why This Matters for Doing Philosophy (5 mins)**
  *   **Say:** "Thought experiments are necessary. We can't test ethics in a lab. We have to imagine scenarios. But if we don't notice the pump, we aren't doing philosophy; we're being manipulated."
  *   **The Rule:** "When you encounter a vivid philosophical scenario (like the Trolley Problem, the Experience Machine, or the Veil of Ignorance), ask: **What details are vivid, and why?** If I remove the adjective, does the argument still hold?"
  *   **Example:** "If I describe a 'terrorist' hiding in a bunker, you feel one way. If I describe a 'political dissident' hiding in a bunker, you feel another. The philosophy shouldn't change based on the noun."

  ---

  ### Troubleshooting: What Will Go Wrong

  **1. The "Gotcha" Backlash**
  *   **Risk:** Students feel tricked or stupid when they realize the facts were the same. They may disengage.
  *   **Fix:** Frame the deception as *methodological*, not personal. "I didn't trick *you*; I tricked *human cognition*. This works on professional philosophers too. The point isn't that you were wrong; it's that the text was designed to bypass your critical filter."
  *   **Prevention:** In the intro, say, "We are testing how our brains process information," which implies the *brain* is the subject, not their intelligence.

  **2. Failure to Detect the Similarity**
  *   **Risk:** Students insist the scenarios *are* different (e.g., "Ancestral homesteads implies history, low-lying valley doesn't!").
  *   **Fix:** Be ready to concede minor points but hold the line on the core logic. "Okay, 'ancestral' adds a detail. But does 'prone to flooding' imply they've lived there a long time? Let's strip it down: 30 families leave, 50k get power. Is that the core trade-off?"
  *   **Preparation:** Have a "stripped down" version written on a hidden slide or paper to show the bare logic if they get stuck on semantics.

  **3. The Debate Takes Over**
  *   **Risk:** During the Reveal, they start arguing about whether Dams are actually good, rather than how the *text* influenced them.
  *   **Fix:** Gently pivot. "That's a great ethical debate, and we can have it next week. Today, I'm only interested in why Group A and Group B had *different* reactions to the *same* facts. Let's stay on the mechanism."

  ---

  ### Limitations & Facilitator Burden

  **What the Activity Cannot Do:**
  1.  **It doesn't show "Narrative Momentum":** Dennett's concept often applies to long, winding arguments that tire you into submission. This activity shows *framing*, which is one type of pump, but not the exhaustion aspect.
  2.  **It doesn't solve the problem:** You will show them *that* they were pumped, but you won't give them a perfect algorithm to *stop* it. You must emphasize that awareness is the only defense.

  **What You Must Supply (The "Hidden" Work):**
  1.  **Neutrality:** You must act as a neutral scientist during the first 25 minutes. If you nod when Group A speaks, you bias Group B.
  2.  **The Bridge:** You must explicitly connect their emotional reaction ("I felt angry reading B") to the philosophical concept ("That anger is the pump working"). If you don't make that link, it's just a reading comprehension exercise.
  3.  **Safety:** Ensure the topic (displacement/flooding) doesn't trigger personal trauma for a student. Keep the tone analytical, not political.

  ---

  ### Confidence Assessment

  **Confidence Level:** **High (85%)**
  I am highly confident in the pedagogical structure. The "Split-Group Reveal" is a classic active-learning technique that reliably produces the desired cognitive dissonance. The timeline is tight but feasible for 15 motivated students.

  **Point of Least Certainty:**
  I am least sure about the **specific wording of the scenarios**. Writing two texts that are *logically* identical but *emotionally* divergent is difficult. If the difference is too subtle, they won't vote differently. If the difference is too obvious, they will spot the manipulation before the reveal.
  *   *Mitigation:* I recommend you test-read the two versions on a colleague or friend before the session to ensure they elicit different gut reactions without appearing factually contradictory.

  **Final Advice:**
  The success of this hour rests entirely on the **Debrief**. If you rush the last 15 minutes, the activity becomes a parlor trick. If you nail the debrief, it becomes a foundational tool they will use for every future philosophy text they read. Protect that time.
