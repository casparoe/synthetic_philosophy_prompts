      *   *Legal Inconsistency:* Criminal law often uses a presumption ("intends natural consequences") which blurs the line. Tort law focuses on negligence/foreseeability. How to reconcile? Perhaps different domains serve different functions (culpability vs. compensation). Or perhaps the "natural consequences" rule is a evidentiary shortcut, not a metaphysical claim about intention.
