answer: |-
  You are right to feel the whack-a-mole fatigue. The literature on moral uncertainty is currently stuck in a reflective equilibrium that refuses to settle. Every solution solves a technical problem by introducing a philosophical cost.

  Below is the specification you asked for. I have distilled the literature (MacAskill, Ord, Sepielli, Bykvist, Ross, Tarsney) into five core desiderata. I have also flagged which are structural constraints and which are effectively commitments to a specific meta-ethical or decision-theoretic worldview.

  ### The Desiderata Specification

  | Desideratum | Definition | The Failure Case (What goes wrong) | Status: Genuine or Taste? |
  | :--- | :--- | :--- | :--- |
  | **1. Intertheoretic Comparability** | The theory must allow comparison of *magnitudes* of value across different moral theories (e.g., is 1 unit of Utilitarian value equal to 1 unit of Kantian value?). | **Incommensurability Paralysis:** Without this, you cannot calculate expectations. You are left knowing Theory A prefers X and Theory B prefers Y, but no way to weigh them against each other. | **Genuine (for Expectational views).** If value scales are fundamentally distinct (like meters vs. seconds), Expected Choiceworthiness is mathematically impossible. However, some argue comparability is metaphysically impossible, making this a constraint *on the world*, not the theory. |
  | **2. Credence Sensitivity** | The influence of a moral theory on the final decision must be proportional to the agent's credence in that theory. | **Credence Ignorance:** If you have 99% credence in Utilitarianism and 1% in egoism, a theory that treats them equally (or lets the 1% veto the 99%) ignores your actual epistemic state. It treats moral uncertainty as mere logical possibility. | **Genuine.** Ignoring degrees of belief violates standard norms of epistemic rationality. |
  | **3. Fanaticism Avoidance** | A tiny credence in a theory with unbounded (or lexical) value stakes should not dictate action over a high credence in theories with bounded stakes. | **The Pascal's Mugging of Morality:** You assign 0.0001% credence to a theory saying "Burning a butterfly causes infinite disutility." You spend your life protecting butterflies, ignoring all other moral concerns, because the expected disutility is infinite. | **Contested.** Orthodox Decision Theory says this is *rational* (Genuine constraint to accept fanaticism). Common sense says it's absurd. Rejecting it requires modifying decision theory, not just moral uncertainty rules. |
  | **4. The Pareto Principle (Dominance)** | If every theory with non-zero credence ranks Option X at least as high as Option Y, and at least one ranks X strictly higher, the agent must prefer X. | **Unanimous Defiance:** You act against the verdict of every moral theory you take seriously. This renders the moral theories advisory at best, and the decision rule becomes a separate moral theory itself (leading to regress). | **Genuine.** Violating Pareto is widely considered irrational in both social and individual choice theory. |
  | **5. Decisiveness** | The theory must output a specific action (or a sufficiently narrow set of permissible actions) to guide behavior. | **Paralysis:** If the theory says "Everything is permissible" or "No option is maximal," the agent has no action-guidance. It solves the philosophical problem but fails the practical one. | **Genuine (Pragmatic).** A normative theory that cannot be acted upon is functionally inert. |

  ---

  ### The Impossibility Result (The Trilemma)

  You asked if the list itself amounts to a result. **Yes.**

  There is a robust tension—bordering on a formal impossibility result—between **Credence Sensitivity**, **Comparability**, and **Fanaticism Avoidance**.

  1.  **If you want Credence Sensitivity** (your credences matter) and **Comparability** (you can do math across theories), you are pushed toward **Expected Choiceworthiness Maximization**.
  2.  **If you accept Expected Choiceworthiness**, you inherit Orthodox Decision Theory.
  3.  **If you inherit Orthodox Decision Theory**, you **cannot avoid Fanaticism**. If a theory has unbounded utility, any non-zero credence makes its expected value infinite (or dominant).

  To avoid Fanaticism, you must either:
  *   Abandon Credence Sensitivity (e.g., ignore theories below a credence threshold).
  *   Abandon Comparability (e.g., use ordinal rankings only, which blocks the math that leads to fanaticism).
  *   Abandon Orthodox Decision Theory (e.g., adopt risk-weighted utility).

  **Verdict on "Taste":** The "Fanaticism" desideratum is the primary fault line. If you view decision-theoretic orthodoxy as a genuine constraint on rationality, Fanaticism Avoidance is *taste* (you just don't like the answer). If you view moral intuition as a constraint on rationality, Fanaticism Avoidance is *genuine* (the theory is broken). Most moral uncertainty literature treats it as genuine, which forces them to break decision-theoretic orthodoxy.

  ---

  ### Scorecard of Main Families

  Here is how the three major approaches score against the desiderata.

  | View Family | Comparability | Credence Sensitivity | Fanaticism Avoidance | Pareto | Decisiveness |
  | :--- | :---: | :---: | :---: | :---: | :---: |
  | **Expected Choiceworthiness (MEC)**<br>*(MacAskill/Ord)* | **FAIL**<br>*(Requires arbitrary normalization schemes to fix)* | **PASS**<br>*(Core feature)* | **FAIL**<br>*(Inherits EU fanaticism)* | **PASS** | **PASS** |
  | **Maximality / Intersection**<br>*(Your partiality)* | **PASS**<br>*(Requires only ordinal rankings)* | **FAIL**<br>*(Ignores magnitude of credence; 51% and 99% treated similarly)* | **PASS**<br>*(No aggregation of extreme values)* | **PASS** | **FAIL**<br>*(Often yields large sets of permissible acts)* |
  | **Bargaining / Parliament**<br>*(Sepielli/Hare)* | **FAIL**<br>*(Still needs baseline for bargaining chips)* | **PASS**<br>*(Credence = Seats)* | **PASS**<br>*(Bargaining limits extreme demands)* | **PASS** | **FAIL**<br>*(Bargaining solutions often indeterminate)* |

  ### Summary Analysis

  *   **MEC** is the only view that is fully **Decisive** and **Credence Sensitive**, but it pays for this by requiring a metaphysical miracle (Comparability) and accepting absurd conclusions (Fanaticism).
  *   **Maximality/Intersection** is the most **Metaphysically Modest** (no comparability needed) and **Safe** (no fanaticism), but it fails to use the full information available to the agent (Credence Sensitivity) and frequently results in **Paralysis** (low Decisiveness).
  *   **Bargaining** attempts to split the difference but inherits the Comparability problem of MEC and the Indeterminacy problem of Maximality.

  **The Hard Truth:** There is no view that passes all five.
  *   If you prioritize **Action Guidance**, you must accept Fanaticism or arbitrary normalization.
  *   If you prioritize **Safety/Intuition**, you must accept Paralysis or ignore your own credence magnitudes.

  The "whack-a-mole" feeling persists because the moles are structural. You cannot fix the machine without removing one of the gears entirely.
