  1. Clarification of the ranking dimension
  To be "more concessive" means agreeing that Mary's pre-release physical knowledge was incomplete regarding reality itself or her epistemic access to it. The ranking moves from granting new ontological facts (most concessive) to granting new epistemic relations or concepts, then to mere abilities, and finally to denying any significant gain (least concessive). High concessiveness validates the intuition that physicalism fails to capture reality's full nature. Low concessiveness treats the intuition as an illusion or merely practical change. This scale measures how much each response preserves the argument's core claim that physical facts alone are insufficient for a complete picture of experience.

  2. Tier list
  Tier 1: Full Ontological Concession — Mary learns new facts about reality. (a, g)
  Tier 2: Epistemic/Relational Concession — Mary gains new access or modes, not new facts. (c, f, d)
  Tier 3: Practical Concession — Mary gains only skills, not knowledge. (b)
  Tier 4: No Concession — Mary learns nothing significant. (e)

  3. Justification for each placement
  (a) Property dualism ranks highest because it fully accepts the argument's conclusion: physicalism is false and Mary learns a genuinely new, non-physical fact about the world. This is the maximal concession to the anti-physicalist intuition, validating the claim that physical facts never entail phenomenal facts. (g) Russellian monism follows closely; it concedes that the physical facts Mary knew were incomplete regarding intrinsic nature, though it attempts to save monism by identifying this nature with the physical. It grants more than standard physicalism because it admits standard physical descriptions omit reality's categorical base, yet it ranks below dualism because it still claims these facts are ultimately physical, thereby resisting the full anti-physicalist conclusion that physicalism is false.

  (c) Acquaintance hypothesis places third; it grants a unique epistemic relation (acquaintance) distinct from propositional knowledge, validating a deep epistemic gap without positing new facts. This is less concessive than Russellian monism because it denies she learns a new truth about the world, restricting the gain to a relational state rather than a fact. (f) Type-B physicalism ranks fourth, admitting an epistemic gap (new mode of presentation) but denying any ontological difference, making it less concessive than acquaintance which posits a distinct cognitive relation beyond mere modes. It accepts the gap as brute. (d) Phenomenal concept strategy is fifth; by explaining the gap via concepts rather than admitting a brute epistemic gap, it deflates the mystery slightly more than Type-B, suggesting the gap is merely conceptual and explainable rather than a fundamental epistemic limit.

  (b) Ability hypothesis is sixth, reducing Mary's gain to abilities (know-how), denying she learns anything about the experience itself. This is less concessive than PCS because it denies she gains any cognitive grasp of the quality, only behavioral dispositions. Finally, (e) Type-A physicalism is least concessive, dismissing Mary's reaction as an illusion and denying any epistemic progress occurred, thereby rejecting the argument's central premise entirely. It offers no concession to the intuition that her prior knowledge was incomplete.
