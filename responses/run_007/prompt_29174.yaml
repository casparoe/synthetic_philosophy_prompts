  2.  **Initial Conceptualization & Mapping:**
      *   *The Doomsday Argument (DA):* Based on the Self-Sampling Assumption (SSA) or Self-Indication Assumption (SIA) debates, but fundamentally relies on the Copernican Principle applied to birth rank. If I am a random observer among all observers, my rank $n$ tells me about total $N$.
      *   *The Berlin Wall Case (Gott's Formula):* Based on duration. If I observe a phenomenon at time $t_{past}$, and my observation time is random within the total duration $T$, then $t_{past}/T$ is uniformly distributed between 0 and 1.
      *   *Mapping:*
          *   DA: Birth rank ($n$) $\rightarrow$ Total humans ($N$).
          *   Wall: Time elapsed ($t_{past}$) $\rightarrow$ Total duration ($T$).
      *   *Key Difference:* DA is about *count* (discrete observers), Wall is about *time* (continuous duration). This is the "Delta-T" argument vs. the "Doomsday" argument. They are mathematically isomorphic under certain assumptions (Poisson process vs. uniform distribution), but ontologically distinct.

  3.  **Detailed Component Mapping:**

      *   **Observer:**
          *   DA: A specific human (you/me).
