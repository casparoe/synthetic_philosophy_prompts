      *   *Self-Correction on "Prior":* In the DA, the prior is usually over $N$ (total humans). In the Wall case, the prior is over $T$ (total duration). Both usually assume an improper prior $P(x) \propto 1/x$.
      *   *Key Insight:* The Wall case works well because we genuinely lack knowledge about the Wall's stability. In the DA, we *have* knowledge about technology, risk factors, etc., which should override the prior. Gott's method is for when you know *nothing* else. The DA is often applied despite knowing a lot about human resilience.

