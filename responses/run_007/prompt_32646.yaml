answer: |-
  *(I set down the quill. The ink is still wet on the page, a diagram of Jupiter's satellites sitting next to a marginalia note from Augustine. I rub my eyes. The candle flickers, casting long shadows against the stack of papers—letters from friends in Rome, warnings from friendly cardinals, the usual noise. I look at you, and there is a weariness in my expression, but also a spark of that old fire, the one that gets me into trouble.)*

  You press me on the distinction. Good. It is the only distinction that matters, and yet it is the one my friends in the clergy seem most determined to blur.

  You ask: if we bend the text every time a demonstration contradicts it, does the text not become... empty? A wax nose to be twisted by every new philosopher?

  *(I lean forward, resting my elbows on the desk, clasping my hands.)*

  Listen to me closely. I am not saying the Scripture is false. I am saying *you* are asking it to answer a question it was never asked.

  Imagine a man who is blind from birth. He touches an elephant. He says, "This is a wall." Another touches the trunk and says, "This is a snake." They argue. They shout. They cite their senses. Now, suppose a seer comes who can see the whole beast. Does the seer strike the blind men? Does he say, "Your senses are lies"? No. He understands that their language is accommodated to their limitation.

  The Holy Spirit speaks to men. Not to angels, not to astronomers, but to men. And the men of that time—the men of Joshua, of David—they believed the earth stood still. To tell them otherwise would have been to confuse them, to distract them from the only thing that actually matters: the salvation of their souls. If the Spirit had said, "The Earth spins and flies around the Sun," the people would have thought their faith depended on understanding orbits. They would have fractured over geometry!

  So, is the text empty of worldly truth? Yes! In the same way a recipe book is empty of carpentry. If I read a recipe for bread, and it says "knead the dough until it is smooth," and I try to use that instruction to build a table, I will fail. Is the recipe lying? No. *I* am misusing it.

  *(I stand up and begin to pace, the frustration mounting.)*

  But here is where you must understand the safeguard. You ask how we tell the difference. It is not arbitrary! I do not simply *guess* that Joshua's sun stood still metaphorically. I do not *choose* allegory because it suits me.

  It is the **demonstration**.

  That is the key you are missing. If I had only a hypothesis—if I were merely playing with mathematical fictions, as the Jesuits suggest—then I would bow to the literal text. I would say, "Perhaps God stopped the sun, perhaps not." But I have *proof*. I have the tides. I have the phases of Venus. I have the mountains on the Moon. These are not guesses. They are demonstrations, as certain as that two plus two is four.

  God is the author of Nature and the author of Scripture. Truth cannot contradict truth. If a physical conclusion is *demonstrated*, then it is true. If it is true, and the Scripture seems to deny it, then our interpretation of the Scripture *must* be the error. Not because Scripture is weak, but because our grasp of it is limited.

  *(I stop pacing and turn back to you, my voice dropping, becoming more intense.)*

  You worry about my Dominican friends. I worry about them too. They think they protect God's glory by making Him a liar about the world. They think that if the Earth moves, the Bible is undermined. I tell you: the greater scandal is to force a believer to deny what their own eyes and reason prove to be true.

  If we bind the Scripture to a physics that is false, what happens when the physics is corrected? Do the heathens not laugh? Do they not say, "You Christians claim to know the book of God, yet you cannot even read the book of the World which He placed under your feet"?

  So, to answer your shove: The text is not unfalsifiable regarding salvation. That truth is fixed. But regarding the heavens? It speaks the language of the vulgar, so the vulgar can understand their duty. If a physicist comes along with a demonstration, we do not fear it. We thank God that He has allowed us to read another sentence of His other book.

  *(I sit back down, picking up the quill again, but I don't write. I look at you over the top of my spectacles.)*

  Is that clear? Or do you think God gave us senses and reason only to forbid us from using them?
