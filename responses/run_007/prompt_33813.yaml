          *   Lack of reason (cannot solve novel problems via universal reason, only instinct/mechanism).
          *   Pain/Behavior: Cries of pain are mechanical, like a clock striking the hour. No *qualia*.
      *   *Ethical Implication:* We have no direct duties to animals (though cruelty might harden us to humans).

  3.  **Deconstruct *Blade Runner*'s Position:**
      *   *Replicants:* Bio-engineered beings, physically indistinguishable from humans, superior strength/agility, limited lifespan.
      *   *Status:* Legally "machines" / "skin-jobs." Disposable.
      *   *The Test:* Voight-Kampff (V-K). Measures involuntary physiological responses (pupil dilation, blush) to empathy-provoking questions.
      *   *Animals:* Real animals are rare, expensive, status symbols. Artificial animals are common.
      *   *Theme:* What makes us human? Memory? Empathy? Mortality?

  4.  **Drafting the Reading - Section by Section:**

      *   **Introduction:** Acknowledge the pedagogical problem. Descartes' beast-machine view seems cruel/absurd to modern students. *Blade Runner* updates the "other" from animals to androids, making the stakes clearer for modern audiences.
      *   **The Automaton Hypothesis:** Connect Descartes' view of animals as clockwork to the Tyrell Corporation's view of replicants. Both are "made," not "born." Both are denied interiority by decree.
      *   **The Test (Language vs. Empathy):** Address Specific Question 1.
          *   Descartes: Language is the *only* sure sign. Animals can make sounds, but not arrange signs creatively.
          *   V-K Test: It's not about language capacity (replicants speak fluently). It's about *affective* response.
          *   *Verdict:* It is an **inversion**. Descartes excludes animals because they lack reason/language despite having bodies. The film excludes replicants because they lack *affect* (allegedly) despite having reason/language. The film shifts the criterion from *Logos* to *Pathos*.
      *   **The Value of Animals (The Reversal):** Address Specific Question 2.
          *   Descartes: Humans > Animals (Machines).
          *   Film: Real Animals > Replicants > Artificial Animals.
          *   *Irony:* In the film, a real owl or sheep is more "valuable" than a replicant. For Descartes, a real dog is a machine, but a human is a mind. In the film, the replicant (who acts human) is treated as a machine, while the real animal (who acts animal) is sacred.
          *   *Indictment:* The film suggests the *act* of drawing the line is the violence. Deckard's realization that Rachael has memories makes the line blur. The film indicts the *institutional* enforcement of the line (Blade Runners), whereas Descartes saw it as a metaphysical fact.
      *   **Where the Metaphor Breaks:**
          *   Descartes believed animals *literally* couldn't feel. The audience knows replicants *do* feel (Roy's tears). The dramatic irony is stronger in the film.
          *   Descartes' dualism is substance-based. The film's distinction is origin-based (made vs. born) but blurs into functionalism.
          *   Descartes wasn't worried about animal rights. The film is explicitly ethical/political.

