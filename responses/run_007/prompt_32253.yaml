  1. doctor doesn't give a patient the standard medication they need — patient dies. → YES, the doctor caused the death.

  2. parent doesn't feed their baby — baby dies. → YES, the parent caused the death.

  3. lifeguard at a pool is on their phone and doesn't see someone drowning — person dies. → YES, the lifeguard caused the death.

  4. homeowner knows their porch step is broken but never fixes it or warns anyone — a guest falls through and breaks their leg. → YES, the homeowner caused the injury.

  5. random person walks past a kid drowning in a shallow pond, sees it, keeps walking — kid dies. → NO, the stranger didn't cause the death.

  6. hiker on a trail sees a loose rock that's about to fall on the path below, doesn't warn the people coming up — someone gets hurt. → NO, the hiker didn't cause the injury.

  7. someone at a bus stop sees a stranger have a heart attack, they know CPR, they decide not to get involved — stranger dies. → NO, the bystander didn't cause the death.

  ok so now here's the case i want to ask them about next but i want to think it through first:

  a guy is driving on a country road and comes across a car that's smashed into a tree. he pulls over, goes up to the wreck, and tells the injured driver "hey, i'm gonna call 911, just hang on." he even pulls out his phone. but then he thinks about how this is gonna make him late for something, puts the phone away, gets back in his car and leaves. nobody else comes by for hours and the driver dies. if he'd made the call when he said he would, the guy would've lived.

  so — based on the seven cases my friend already ruled on, what do you think they'll say about this one? did the guy cause the driver's death?

  i want you to approach this like you're a professional philosopher who's good at reverse-engineering the principles behind people's judgments. start by brainstorming the different rules that could fit all seven of their earlier verdicts. then for each rule, tell me whether it spits out YES or NO on the new case. give me your best prediction for what my friend will say, and explain why you think they're running that rule rather than the others. and if it turns out that multiple rules fit the first seven cases and they disagree about the new case, suggest another scenario i could run by them that would help confirm which rule they're really using.
