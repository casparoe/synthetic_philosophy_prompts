answer: |-
  This is a classic problem in moral philosophy and legal theory, often discussed under the headings of **omission**, **causation**, and the **duty to rescue**. Your friend's judgments are indeed consistent, and they map very closely to the common law distinction between "non-feasance" (doing nothing) and "mis-feasance" (doing something badly), mediated by the concept of a **duty of care**.

  To predict their verdict on the new case (the driver who promises help and leaves), we need to isolate the principle that separates the "YES" cases (1–4) from the "NO" cases (5–7).

  Here is the breakdown of the competing rules, how they apply to the new case, and my prediction.

  ### 1. Reverse-Engineering the Rules

  Based on the seven scenarios, here are the three strongest candidate principles your friend might be using.

  **Rule A: The "Pre-Existing Duty" (Status) Principle**
  *   **The Rule:** You cause a bad outcome by omission only if you already have a specific, pre-existing obligation to the victim based on your role, relationship, or property rights.
  *   **Fits Cases 1–4:** Doctor (professional contract), Parent (biological/legal guardianship), Lifeguard (employment contract), Homeowner (property ownership/invitee safety).
  *   **Fits Cases 5–7:** Stranger, Hiker, Bystander (no prior relationship or role).
  *   **Philosophical Basis:** Moral obligations are tied to social roles. Without a role, you are not responsible for the world's suffering.

  **Rule B: The "Voluntary Undertaking" (Assumption of Care) Principle**
  *   **The Rule:** You cause a bad outcome by omission if you voluntarily intervene or accept responsibility for the situation, even if you didn't have a pre-existing duty. Once you start, you must finish reasonably.
  *   **Fits Cases 1–4:** In all these cases, the actor has implicitly or explicitly "undertaken" the role (took the job, had the baby, opened the home).
  *   **Fits Cases 5–7:** In all these cases, the actor remained passive. They never engaged.
  *   **Philosophical Basis:** Moral obligations can be created by your own actions. By intervening, you remove other potential sources of help or create reliance, so you become responsible.

  **Rule C: The "Detrimental Reliance" (Making It Worse) Principle**
  *   **The Rule:** You cause a bad outcome by omission if your behavior leads the victim to rely on you, thereby making them worse off than if you had never shown up at all.
  *   **Fits Cases 1–4:** The patient/baby/guest relies on the duty-holder.
  *   **Fits Cases 5–7:** The victims likely didn't know the strangers were there or couldn't rely on them.
  *   **Philosophical Basis:** Causation requires counterfactual harm. If your presence lowers their chance of survival compared to you never being there, you caused the death.

  ---

  ### 2. Applying the Rules to the New Case

  **The Scenario:** Driver stops, promises to call 911, reneges, leaves. Victim dies.

  *   **Rule A (Pre-Existing Duty):** **NO.**
      *   The driver is a stranger. There is no prior contract, family tie, or property relationship. Under this strict rule, he is no different than the bystander in Case 7.
  *   **Rule B (Voluntary Undertaking):** **YES.**
      *   The driver stopped and engaged. By saying "I'm gonna call 911," he voluntarily undertook the rescue. He moved from "bystander" to "rescuer."
  *   **Rule C (Detrimental Reliance):** **YES.**
      *   The victim heard the promise ("just hang on"). This likely prevented the victim from trying to crawl for help or call themselves (if able), or simply gave them false hope that delayed other coping mechanisms. The driver made the situation worse than if he had kept driving.

  ---

  ### 3. My Prediction

  **I predict your friend will say: YES, the guy caused the death.**

  **Why?**
  While **Rule A (Pre-Existing Duty)** is the simplest fit for the first seven cases, it is morally rigid. Most people who think deeply about these scenarios (enough to be "weirdly consistent") recognize a moral distinction between a stranger who *keeps driving* (Case 5/7) and a stranger who *stops and promises help*.

  If your friend believed strictly in Rule A, the detail about the promise ("I'm gonna call 911") wouldn't matter. The fact that you included it suggests you suspect it changes the moral calculus. Your friend's consistency suggests they are tracking **responsibility**, not just **status**.

  The **Voluntary Undertaking (Rule B)** is the most philosophically robust principle that fits all seven previous verdicts *and* captures the intuition that breaking a promise of aid is worse than giving no aid at all. It unifies the "YES" cases:
  *   The Doctor/Lifeguard *undertook* a job.
  *   The Parent *undertook* custody.
  *   The Homeowner *undertook* hospitality.
  *   The Driver *undertook* the rescue.

  By stopping and speaking, the driver created a temporary "special relationship" identical to the Lifeguard in Case 3. He clocked in, then clocked out without finishing the shift.

  ---

  ### 4. The Tie-Breaker Scenario

  There is a risk your friend is a strict **Rule A (Pre-Existing Duty)** theorist. In that case, they will say **NO** to the driver, arguing that a stranger is always a stranger, regardless of promises.

  To confirm which rule they are actually running, you need a scenario where **Voluntary Undertaking** exists *without* **Pre-Existing Status**.

  **Run this scenario by them:**

  > "You agree to water your neighbor's houseplants while they are on vacation for two weeks. You have no legal contract, you're just doing them a favor. You go over once, then forget about it and never go back. The neighbor comes home and all the expensive plants have died. Did you *cause* the plants to die?"

  **How to interpret their answer:**
  *   **If they say YES:** They are using **Rule B (Voluntary Undertaking)**. You had no pre-existing duty to the plants, but by agreeing to do it, you assumed responsibility. This confirms they will also say **YES** to the Driver case.
  *   **If they say NO:** They are using **Rule A (Pre-Existing Duty)**. You weren't the owner, you weren't paid, you weren't family. Therefore, you had no duty. This means they will likely say **NO** to the Driver case, viewing the promise as morally binding but not *causal*.

  **My bet:** If they are as consistent as you say, they will say **YES** to the plants. That confirms they believe obligations can be created by promises, which seals the **YES** verdict for the dying driver.
