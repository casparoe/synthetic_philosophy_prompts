  so i've been going back and forth with a buddy of mine about this thing thats been bugging me — when can you say someone *caused* a bad thing to happen by NOT doing something? like, we all agree that if i push you off a cliff i caused your death, but what about when i just stand there and let something happen? my friend has pretty strong opinions about this and i've been writing down their answers to different scenarios. they're weirdly consistent but i can't figure out the rule.

