prompt: |-
  Okay, so I've been going back and forth with a friend about whether individual actions like giving up meat or not flying actually matter for climate change and animal welfare, given that one person's contribution is basically a rounding error. We've both read some of the literature — Singer, Sinnott-Armstrong, Kagan, Nefsky, that crowd — and we keep talking past each other because we're each pointing to different cases that our preferred theories handle better. I realized what we actually need is just the full list of things any theory of individual obligation in collective-harm cases has to get right, before we start arguing about which theory is best.

  So here's what I want: write the desiderata for an adequate theory of when an individual has a moral obligation to refrain from (or do) something that contributes to a collective harm, where the harm wouldn't be prevented by that individual's act alone. The list should include the cases it needs to handle correctly, the distinctions it must respect, the results from moral psychology or decision theory it can't contradict, and the puzzle cases it must dissolve or at least give a principled answer to. For each desideratum, give the motivating case or consideration — I want to know why it's on the list, not just that it is. Then flag which ones are non-negotiable (any theory that fails them is dead) and which are more like preferences of a particular camp. If you suspect any pair of desiderata can't be jointly satisfied, point that out — that's the kind of thing I most want to know, because it might mean the debate itself is misframed. Finally, give me a quick scorecard for the main approaches (the causal inefficacy view, the generalization/Kantian view, the complicity view, and the expected utility view) against the list — just a sentence each on where they stumble. Keep the weight on the criteria and the cases, not on the scoring.
