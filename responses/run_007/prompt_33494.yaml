answer: |-
  This is a precise request that cuts to the methodological core of the debate. You are asking for a "meta-ethical constraint satisfaction problem." Below is a structured list of desiderata for any theory of individual obligation in collective-harm cases (often called the problem of *imperceptible differences* or *causal inefficacy*), followed by the tensions between them and a scorecard of the major contenders.

  ### Desiderata for a Theory of Individual Obligation in Collective Harm

  #### 1. The Overdetermination Constraint
  *   **The Case:** *The Firing Squad.* Ten shooters fire at a prisoner. Any single shooter's bullet would have been fatal. You are one shooter. If you refrain, the prisoner dies anyway.
  *   **The Requirement:** The theory must explain whether you are morally culpable for shooting.
  *   **Motivation:** Our robust moral intuition is that you *are* culpable (you committed murder), even though your act made no causal difference to the outcome. A theory that says "no difference, no foul" fails to capture the wrongness of participation in overdetermined harms.
  *   **Status:** **Non-Negotiable.** (Failure here renders a theory counterintuitive to the point of absurdity in legal and moral contexts).

  #### 2. The Dominance Principle (Decision-Theoretic Coherence)
  *   **The Case:** *The Two-Button Game.* Button A saves 10 people if others press B, and saves 0 if they don't. Button B saves 11 people if others press B, and saves 1 if they don't. Button B *dominates* A (it is always better or equal).
  *   **The Requirement:** If Act X produces an outcome at least as good as Act Y in every possible state of the world, and better in at least one, the theory should prescribe X.
  *   **Motivation:** This is a bedrock principle of rational choice theory. If a moral theory requires you to choose a dominated option, it demands irrationality.
  *   **Status:** **Non-Negotiable.** (Violating this makes the theory action-guiding in a way that contradicts rational agency).

  #### 3. The Threshold Sensitivity Requirement
  *   **The Case:** *The Chicken Purchase.* Industrial farming operates on orders of 10,000 units. Your purchase is the 10,000th, triggering a new order of 10,000 chickens to be raised/killed.
  *   **The Requirement:** The theory must account for non-linear harm functions where small inputs trigger large outputs probabilistically.
  *   **Motivation:** In many collective harm cases (supply chains, voting, carbon tipping points), causation is not smooth; it is step-wise. A theory that assumes linear inefficacy ignores the empirical reality of thresholds.
  *   **Status:** **Non-Negotiable.** (Ignoring thresholds is empirically false).

  #### 4. The Complicity/Integrity Intuition
  *   **The Case:** *The Lynching Mob.* You join a mob intending to lynch a victim. The mob is large enough that your presence adds no physical force or threat; the victim dies regardless.
  *   **The Requirement:** The theory must explain why your participation is wrongful even if it lacks causal efficacy.
  *   **Motivation:** This distinguishes *causing* harm from *joining* a harmful practice. It captures the idea that moral agents care about their own moral integrity and not being "tainted" by injustice, independent of consequences.
  *   **Status:** **Camp Preference.** (Consequentialists often try to reduce this to expected utility; non-consequentialists view this as a standalone constraint).

  #### 5. The "Ought Implies Can" (Psychological Feasibility)
  *   **The Case:** *The Demandingness Objection.* If every individual must offset the entire collective harm (e.g., you must live carbon-neutral because "we" must), the cost is life-ruining.
  *   **The Requirement:** The theory cannot obligate individuals to do what is psychologically or practically impossible, or to sacrifice their life projects entirely.
  *   **Motivation:** Moral theories that demand sainthood lose their grip on normative force. If the obligation is too costly, agents will reject the theory rather than the action.
  *   **Status:** **High Cost.** (Some theories, like Act Utilitarianism, bite the bullet here; others treat it as a reductio).

  #### 6. The Description Problem (Generalization Consistency)
  *   **The Case:** *The Weekend Drive.* Sinnott-Armstrong argues driving a gas-guzzler for fun is fine. Kantians ask, "What if everyone did that?"
  *   **The Requirement:** If the theory relies on generalization (e.g., Kantian Formula of Universal Law), it must provide a principled way to describe the action (e.g., "driving for fun" vs. "driving a Ford on Tuesday").
  *   **Motivation:** Without a constraint on how actions are described, generalization arguments can prove anything or nothing.
  *   **Status:** **Non-Negotiable.** (A theory relying on generalization without a description rule is formally broken).

  #### 7. The Collective/Individual Gap Bridge
  *   **The Case:** *The Tragedy of the Commons.* "We" ought to stop fishing the stock to extinction. But if "I" stop, I starve and the stock still dies.
  *   **The Requirement:** The theory must explain the relationship between "We ought to do X" and "I ought to do my part in X."
  *   **Motivation:** Many theories successfully argue that *collectives* have obligations but fail to derive *individual* obligations from them (the "inefficacy" loophole). A complete theory must bridge this gap.
  *   **Status:** **Non-Negotiable.** (This is the central puzzle; failing to bridge it dissolves the theory's relevance).

  ---

  ### Incompatibilities & Trade-Offs (The "Misframed Debate" Flags)

  There are strong reasons to suspect **no single theory can satisfy all Non-Negotiables simultaneously.** If your debate is stuck, it is likely because you are prioritizing different incompatible desiderata.

  **1. Dominance vs. Complicity (The Overdetermination Clash)**
  *   **The Conflict:** In the *Firing Squad* case, refraining from shooting is a *dominated* strategy (the victim dies either way, but you lose the benefit of shooting). The **Dominance Principle** says you may shoot. The **Complicity Intuition** says you must not.
  *   **The Implication:** You must choose between Decision-Theoretic Rationality and Moral Integrity. Consequentialists usually keep Dominance and explain away Complicity. Deontologists keep Complicity and reject Dominance as the sole guide.

  **2. Threshold Sensitivity vs. Psychological Feasibility**
  *   **The Conflict:** If thresholds are real but unknown (e.g., *which* chicken purchase triggers the order?), **Expected Utility** calculations often suggest the risk is high enough to mandate extreme sacrifice (veganism, no flying). This often violates **"Ought Implies Can"** regarding lifestyle feasibility.
  *   **The Implication:** A theory that takes thresholds seriously risks becoming overly demanding. A theory that respects feasibility risks ignoring empirical causation.

  **3. The Collective/Individual Gap vs. Causal Efficacy**
  *   **The Conflict:** If you insist that individual obligation requires individual causal efficacy (Sinnott-Armstrong's view), you cannot bridge the **Collective/Individual Gap** in threshold cases where you aren't the trigger. If you bridge the gap via Complicity, you sacrifice **Causal Efficacy** as a requirement for obligation.
  *   **The Implication:** The debate may be misframed if you are arguing about "impact" when the real issue is "participation."

  ---

  ### Scorecard: Where the Main Approaches Stumble

  **1. The Causal Inefficacy View (e.g., Sinnott-Armstrong)**
  *   **The Stumble:** It satisfies **Dominance** and **Feasibility** easily but fails the **Overdetermination Constraint** and **Complicity Intuition**, implying you can join a lynching mob or firing squad without moral fault if you aren't the causal trigger.

  **2. The Expected Utility View (e.g., Kagan, Budolfson)**
  *   **The Stumble:** It handles **Threshold Sensitivity** well by probabilizing triggers, but risks violating **Psychological Feasibility** (demanding too much for tiny probabilities) and struggles with **Overdetermination** cases where the probability of impact is literally zero.

  **3. The Generalization/Kantian View (e.g., Korsgaard, Cureton)**
  *   **The Stumble:** It captures **Complicity** and bridges the **Collective/Individual Gap**, but frequently crashes into the **Description Problem** (how to define the maxim) and can violate **Dominance** (forbidding acts that would have better consequences even if universalized).

  **4. The Complicity/Integrity View (e.g., Nefsky, Lawford-Smith)**
  *   **The Stumble:** It dissolves the **Overdetermination** puzzle and respects **Complicity**, but often lacks a clear metric for **Action-Guidance** (how much sacrifice is required to avoid "taint"?) and can seem disconnected from the actual **Threshold Sensitivity** of the harm.

  ### Summary for Your Debate
  If you want to move past talking past each other, stop asking "Does my act cause harm?" and start asking: **"Which desideratum are we willing to sacrifice?"**

  *   If you prioritize **Dominance and Causal Reality**, you lean toward Sinnott-Armstrong (Individual acts rarely matter).
  *   If you prioritize **Complicity and Overdetermination**, you lean toward Kagan/Nefsky (Individual acts matter because participation is wrong).
  *   If you prioritize **Thresholds and Probability**, you lean toward Budolfman (Individual acts matter because of risk).

  The "misframing" is the assumption that there is a single metric (causation) that solves the problem. The literature suggests the solution requires a hybrid account that weighs causal risk against moral integrity.
