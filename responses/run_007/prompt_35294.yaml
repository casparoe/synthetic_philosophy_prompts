      *(Self-Correction during drafting)*: I need to make sure I don't just say "Liam is right." I need to acknowledge where Nisha is strong (the barrister analogy is good, but distinguishable). I also need to ensure I incorporate the prompt's introductory details (the omission of the garden) which Nisha largely sidesteps in the dialogue but which strengthens Liam's case implicitly.

      *Refining the Principle:* The "Discountability Principle" is strong here. If the target knew the tactic, could they neutralize it? If yes, hiding it is manipulative. If the tactic is just "good arguments," knowing it doesn't neutralize it. The trip was a tactic that *relies* on secrecy to work.

