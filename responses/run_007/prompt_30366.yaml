answer: |-
  Dear Colleague,

  It is entirely understandable that you find your student's reconstruction of Galen Strawson's Basic Argument both compelling and deeply unsettling. Many philosophers who have spent careers defending moral responsibility feel a similar chill when confronted with the elegance of that regress. The argument is indeed formidable because it sidesteps the traditional battlefield of determinism versus indeterminism. As you noted, inserting random quantum events into the causal chain does not solve the problem of authorship, for an uncaused cause is no more under your control than a determined one. The core issue is not whether the future is open, but whether you are the ultimate source of your own will. Since you cannot create yourself ex nihilo, you cannot be the ultimate source of your will, and thus you cannot be ultimately responsible for your actions. To answer your question about where the argument goes wrong and what a defender of ordinary moral responsibility must do to resist it, we must look closely at the bridge between the action and the agent's character.

  The most viable point of resistance for a defender of ordinary moral responsibility lies in the second step of the argument, the claim that to be responsible for what you do, you must be responsible for the way you are. This premise embodies what is often called the principle of ultimate responsibility. It asserts that responsibility for an action transfers back to responsibility for the mental states that produced it. While this intuition feels powerful, rejecting it is the standard move for compatibilists and many others who wish to save moral responsibility from Strawson's pessimism. To reject this premise is to argue that moral responsibility does not require ultimate origination. It requires only that the action issues from the agent in the right way at the time of action, regardless of whether the agent is responsible for having that specific way of being. On this view, you are responsible for your choices because they reflect your values and reasoning capacities now, even if you did not choose those values and capacities in the past.

  However, you asked what rejecting this premise costs, and the price is significant. If you deny that responsibility for action requires responsibility for character, you must accept that constitutive luck is compatible with moral responsibility. Constitutive luck refers to the factors that shape who you are—your genetics, your upbringing, your social environment—over which you had no control. By rejecting the second premise, you are conceding that two people could be identical in their current capacities and reasoning, yet one had a privileged upbringing that fostered those capacities while the other struggled against abuse and neglect, and yet both are equally responsible for their actions. This feels counterintuitive to many because it seems to ignore the unfairness of the starting line. To maintain ordinary moral responsibility, you must argue that fairness in responsibility is not about fairness in origin, but about fairness in the current standards of accountability we apply to one another. You are committed to the view that the history of how you became you is irrelevant to whether you are blameworthy now, provided you possess the relevant normative competencies.

  There is another cost, which is perhaps more philosophical than practical. By rejecting the demand for responsibility for the way you are, you are effectively changing the subject from what Galen Strawson calls true moral responsibility to what others call practical moral responsibility. Strawson would argue that you have not solved the problem but merely lowered the bar. You have saved a notion of responsibility that supports our legal and interpersonal practices, but you have abandoned the metaphysical depth that makes blame feel truly deserved in a cosmic sense. If you take this route, you must admit that blame is not a reflection of a metaphysical fact about ultimate authorship, but rather a tool for social regulation and a component of our interpersonal relationships. This aligns closely with the view of P.F. Strawson, Galen's father, who argued in Freedom and Resentment that reactive attitudes like resentment and gratitude are not something that can be justified by metaphysics but are instead natural facts about human life that we cannot and should not try to abandon. To follow this path is to say that the justification for blame is internal to our form of life, not external to it in the structure of the universe.

  Alternatively, one might try to attack the third premise, which claims you cannot be responsible for the way you are. This would require defending a notion of self-creation that avoids the regress. Some libertarians attempt this by positing a special kind of agent-causation where the self acts as a substance rather than an event. However, as you observed in your description of the seminar, this rarely satisfies critics because it is difficult to explain how an agent can cause their own nature without already having a nature that dictates that causation. To pursue this line is to commit oneself to a metaphysics that many find obscure or unintelligible. The cost here is theoretical plausibility. You would be defending a mechanism of freedom that seems to violate our best understanding of causation and psychology, all to save an intuition about ultimate responsibility that may itself be incoherent. Most philosophers find this cost too high compared to the cost of revising our understanding of responsibility itself.

  There is also the option of accepting the argument and living with the conclusion, which is Galen Strawson's own position. This involves becoming a pessimist about moral responsibility. The cost here is existential and practical. You would have to view resentment and moral indignation as fundamentally unjustified reactions, akin to anger at a storm for damaging your roof. You could still maintain a system of justice based on safety and rehabilitation, but you could not justify punishment on the grounds of desert. For many, including yourself, this is impossible to live with because it requires a detachment from our deepest emotional engagements with others. To blame someone is to hold them accountable in a way that presupposes they could have done otherwise in a robust sense. Giving this up feels like giving up on the reality of other minds as moral agents. Since you expressed reluctance to give up the thought that people are sometimes responsible, this path is likely closed to you, which leaves rejecting the second premise as the only viable option.

  Ultimately, the choice comes down to whether you believe the concept of moral responsibility is anchored in the history of the agent or in the current relationship between agents. If you reject the second premise, you are committing yourself to a forward-looking or relational account of responsibility. You are saying that what matters is not how the agent came to be, but that the agent is now capable of recognizing reasons and responding to them. This preserves the practices of blame and praise but strips them of their metaphysical grandeur. It requires you to accept that our status as moral agents is a fragile achievement built on a foundation of luck, rather than a testament to our power as uncaused causes. This may be the only way to keep the practices you value without denying the causal structure of the world. It asks you to find sufficiency in the human scale of responsibility rather than the divine scale of self-creation.

  I hope this helps clarify the landscape of responses available to you and your students. The argument is designed to be a trap for anyone seeking ultimate responsibility, so the only way out is to decide that ultimate responsibility was never what mattered in the first place. That decision carries the weight of redefining what we mean when we say someone deserves blame, but it allows us to keep the moral community intact. Thank you for sharing this reflection from your seminar; it is a reminder of why these questions continue to haunt us despite centuries of debate.

  Warmly,

  Your Colleague
