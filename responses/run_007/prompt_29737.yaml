answer: |-
  You have correctly identified the classic triad of counterexamples to the Simple Conditional Analysis (SCA) of dispositions. Your intuitions are sound, and your descriptions map cleanly onto the standard literature in analytic metaphysics from the 1990s and 2000s. However, your suspicion that the taxonomy might be stipulative or dependent on boundary-drawing is also well-founded. The literature is far from settled on whether these distinctions mark metaphysical joints or merely pragmatic differences in description.

  Here is the breakdown of the taxonomy, the metaphysical controversies surrounding it, and its specific relevance to your work in philosophy of science.

  ### 1. The Standard Taxonomy (The "Tidy Labels")

  You asked for the established vocabulary. In the metaphysics of dispositions (specifically the debate surrounding C.B. Martin's 1994 paper "Dispositions and Conditionals" and David Lewis's 1997 response "Finkish Dispositions"), your cases correspond to:

  *   **Case (a): Masking (or Interference).**
      *   *Standard Description:* The disposition and its categorical base remain intact during the stimulus, but an extrinsic factor prevents the causal chain from completing.
      *   *Your Example:* Glass in foam.
      *   *Status:* Generally accepted as a distinct category from finking. The causal power is present but "blocked."
  *   **Case (b): Finking (specifically, a Finkish Disposition).**
      *   *Standard Description:* The stimulus itself causes the loss of the categorical base *before* the manifestation can occur. The disposition vanishes precisely when tested.
      *   *Your Example:* The device rearranging the glass structure upon impact.
      *   *Status:* This is the most contentious category. It relies heavily on the temporal indexing of the disposition.
  *   **Case (c): Mimicking (or Simulating).**
      *   *Standard Description:* The object lacks the disposition (and the relevant base), but the stimulus triggers an extrinsic mechanism that produces the manifestation.
      *   *Your Example:* Non-corrosive substance converted by catalyst.
      *   *Status:* Usually distinguished by the *intrinsicness* of the base. If the base is extrinsic, it's often classified as a mimic.

  ### 2. Do These Carve at the Joints?

  This is where you need to be careful importing this literature into philosophy of science. The distinction between **Masking** and **Finking** is not metaphysically robust in all frameworks; it often collapses depending on how one individuates the "system" and the "time of assessment."

  **The Temporal/Boundary Artifact:**
  The difference between (a) and (b) hinges on *when* the disposition is evaluated.
  *   In **Masking**, we say the object is fragile at $t_0$, the stimulus occurs at $t_1$, and the manifestation fails at $t_2$. The base persists from $t_0$ to $t_2$.
  *   In **Finking**, the object is fragile at $t_0$, the stimulus occurs at $t_1$, and the base is destroyed at $t_{1.5}$ (before $t_2$).

  However, as you suspected, this is sensitive to system boundaries. If you include the "device wired to the glass" as part of the *system* under test, the system *as a whole* lacks the disposition to break (it has a disposition to remain intact). If you treat the device as "background," the glass is finkish.
  *   **The Contested Point:** Many philosophers (e.g., Sungho Choi, Michael Fara) argue that the Mask/Fink distinction is merely a difference in the *mechanism of failure*, not a difference in the metaphysical status of the disposition. Others (e.g., Alexander Bird) argue that for *fundamental* powers, finking is metaphysically impossible (a power cannot cease to be itself), meaning Case (b) is only possible for macro-properties constituted by underlying arrangements.

  **The Mimic Distinction:**
  Case (c) is more stable but relies on the **Intrinsicness Thesis** (the idea that dispositions must be grounded in intrinsic properties). If you reject the Intrinsicness Thesis (as many philosophy of science scholars do, following Putnam or Burge-style externalism), the distinction between a "real" disposition and a "mimic" dissolves. Both are just reliable conditionals grounded in *some* properties (intrinsic or extrinsic).

  ### 3. The Conditional Analysis Problem

  You noted you aren't after the refutation of the SCA, but the framing matters.
  *   **The Trap:** The taxonomy you are using was developed *specifically* to save a *revised* conditional analysis (e.g., Lewis's "Reformed Conditional Analysis" or RCA).
  *   **The Reality:** Most contemporary disposition realists (Bird, Ellis, Molnar) have abandoned the conditional analysis entirely. They argue dispositions are **causal powers** (ontological primitives), not reduced to conditionals.
  *   **Implication for You:** If you adopt a Power Ontology, "Masking" is real (interference with a power), but "Finking" is often treated as a change in the *categorical base* rather than a problem for the disposition itself. If you adopt a **Capacity** view (Cartwright, Hüttemann), the focus shifts from the *object's* disposition to the *arrangement's* capacity. In Cartwright's framework, your Case (a) and (b) are both just cases where the "nomological machine" is not properly shielded or is unstable.

  ### 4. Relevance to Philosophy of Science and Measurement

  This is the critical pivot for your dissertation. The metaphysics literature focuses on *objects* (glasses, electrons). Your work focuses on *measurement procedures*.

  **1. Stability vs. Invariance:**
  In measurement theory (e.g., work by Eran Tal, Hasok Chang, or Alfred Nordmann), "stable capacity" is usually cashed out as **invariance under intervention**.
  *   **Masking** maps to **confounding variables**. (The signal is there, noise blocks it).
  *   **Finking** maps to **instrument drift** or **reactivity**. (The act of measuring changes the system's capacity to be measured).
  *   **Mimicking** maps to **systematic error** or **artifact**. (The instrument reads 'X' but not because of the target property).

  **2. The Boundary Problem is Real:**
  In experimental systems, the boundary between "system" and "background" is often stipulative (the "cut," in Bohr's sense, or the "causal field," in Mackie's sense).
  *   If you treat the "shock-absorbing foam" as part of the measurement environment, the glass's fragility is masked.
  *   If you treat the "foam" as part of the object being tested (e.g., "packaged glass"), then the object simply isn't fragile.
  *   **Verdict:** In PhilSci, this is rarely treated as a metaphysical joint. It is treated as a **modeling choice**. The taxonomy is useful for diagnosing experimental failure, but it does not track mind-independent metaphysical kinds in the way a metaphysician might hope.

  ### 5. Direct Answers to Your Questions

  *   **Is there an established taxonomy?** Yes: **Masking, Finking, Mimicking**.
  *   **Does it carve at the joints?** **No, not cleanly.** The distinction between Masking and Finking is highly sensitive to temporal granularity and system individuation. It is often a difference in *process description* rather than *ontological kind*.
  *   **Are the boundaries settled?** **No.** The boundary between Finking and Masking is contested (see the debate between Lewis and Martin). The boundary between Mimicry and Extrinsic Dispositions is contested (see the debate over the Intrinsicness Thesis).
  *   **Have you misdescribed the cases?** **No.** Your descriptions are textbook examples of these categories.
  *   **Is the Conditional Analysis framing a problem?** **Yes.** If you frame your work as "saving the conditional analysis," you will be fighting 30-year-old metaphysical battles. If you frame it as "characterizing the stability of capacities in experimental systems," you can use the labels heuristically without committing to the metaphysics.

  ### 6. Recommendations for Your Work

  Given your field (PhilSci), I recommend you do not anchor your vocabulary solely in the Martin/Lewis metaphysics literature. It is too focused on fundamental ontology. Instead, look at how "capacity" and "stability" are handled in:

  1.  **Nancy Cartwright (*The Dappled World*, *Hunting Causes and Using Them*):** She uses "capacities" explicitly. She distinguishes between a capacity existing and it being "tended" or "interfered with." This covers your Case (a) naturally.
  2.  **Andreas Hüttemann (*What's Wrong with Microphysicalism?*):** He discusses "dispositional holism." He might argue that your Case (b) shows the disposition belongs to the *whole setup*, not the glass.
  3.  **Eran Tal ("Old and New Problems in Philosophy of Measurement"):** Look for his discussion of **model-based measurement** and **idealization**. Your "non-ideal conditions" are essentially deviations from the model's idealizations.
  4.  **Tobias Hansson Wahlberg:** He writes specifically on the ontology of dispositions in social and scientific contexts, often critiquing the metaphysics lit from a more realistic standpoint.

  **Summary Advice:**
  Use the terms **Masking**, **Finking**, and **Mimicking** as heuristic labels for types of experimental instability. They are recognizable to philosophers. However, explicitly state in your dissertation that you are **not** committing to the metaphysical robustness of the Mask/Fink distinction. Acknowledge that the distinction relies on a specific temporal slicing of the causal process and a specific boundary between system and environment, both of which are often pragmatic choices in experimental science rather than metaphysical facts. This protects you from the metaphysical controversies while allowing you to use the vocabulary precisely.
