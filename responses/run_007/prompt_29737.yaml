      5.  Recommendation/Reading List.

  8.  *(Self-Correction during drafting)*: Make sure to emphasize that for a PhilSci student, the *metaphysical* literature might be a trap. The "capacity" talk in PhilSci (Cartwright, Dupré) is often distinct from the "disposition" talk in Metaphysics (Lewis, Bird). I need to bridge this gap. The user asks about "stable capacity," which sounds more Cartwrightian, but describes cases using "disposition" language (Martin/Lewis). I need to point out this tension.

  9.  **Final Polish:** Ensure the distinction between *intrinsic* and *extrinsic* bases is mentioned, as that's often how Mimics are distinguished from real dispositions. Ensure the "time of assessment" issue is highlighted for Finks.

