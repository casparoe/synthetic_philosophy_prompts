answer: |-
  You are right to feel like you are building without a blueprint. That is because, strictly speaking, **there is no blueprint.** The field of population axiology is defined less by a converging solution and more by a series of rigorous proofs showing that your intuitions are mutually inconsistent.

  If you want to evaluate a theory without reading 500 pages of variable-value utilitarianism, you need to know the "constraints of the game." Below is the architectural plan: the desiderata any theory claims to want, the proof that you can't have them all, the one people sacrifice in silence, and the one they ignore at their peril.

  ---

  ### I. The Desiderata (The Blueprint)

  Any adequate theory of population value ($V$) compares populations (sets of lives with specified welfare levels). Here are the six conditions a theory must satisfy to be considered "adequate" by standard intuitions.

  #### 1. Dominance (Pareto Condition)
  *   **Formal:** If Population $A$ and $B$ have the same number of people, and everyone in $A$ is at least as well off as in $B$, with at least one person strictly better off, then $A$ is better than $B$.
  *   **Motivating Case:** Imagine two worlds with the same billion people. In World 1, everyone has 10 units of welfare. In World 2, everyone has 10 units, except one person has 11. World 2 must be better. To deny this is to deny that welfare matters.

  #### 2. Weak Non-Sadism (The "No Hell" Condition)
  *   **Formal:** Adding a person with negative welfare (a life not worth living) cannot make the population better, ceteris paribus.
  *   **Motivating Case:** If you add a person who suffers intensely and wishes they had never been born, you have not improved the universe. A theory that says adding suffering people is *good* (because it raises the average, perhaps) has failed morally.

  #### 3. Quality Addition (The "Happy Child" Condition)
  *   **Formal:** Adding a person with positive welfare (a life worth living) cannot make the population worse, provided the addition doesn't harm others.
  *   **Motivating Case:** If a couple can have a happy child without reducing the welfare of existing people, doing so is at least permissible, if not good. A theory that says adding happy people makes the world *worse* (a problem for some Average Utilitarian views) is counter-intuitive.

  #### 4. Non-Elitism (Impartiality)
  *   **Formal:** The value of a life depends only on its welfare level, not on the identity of the person or their temporal/spatial location.
  *   **Motivating Case:** A life of joy in 18th-century France is intrinsically equal in value to a life of joy in 24th-century Mars. We are summing/averaging *welfare*, not privileging specific agents.

  #### 5. Transitivity
  *   **Formal:** If $A$ is better than $B$, and $B$ is better than $C$, then $A$ must be better than $C$.
  *   **Motivating Case:** This is a consistency constraint for rational choice. If you prefer $A$ to $B$ and $B$ to $C$, but prefer $C$ to $A$, you are vulnerable to a "money pump" (you will trade in circles until you are bankrupt).

  #### 6. The Repugnant Conclusion Avoidance
  *   **Intuitive Verdict:** For any population $A$ of very happy people, there is no massive population $Z$ of lives barely worth living such that $Z$ is better than $A$.
  *   **Motivating Case:** Parfit's **Repugnant Conclusion**. Total Utilitarianism implies that a world with 10 billion ecstatic people is worse than a world with trillions of people whose lives are just barely above the "not worth living" line (because the total sum is higher). Most people find this verdict repugnant. A theory that entails it is considered defective by most (though not all).

  ---

  ### II. The Impossibility (The Structural Crack)

  You asked for the subsets that are jointly unsatisfiable. This is the domain of **Gustaf Arrhenius**, whose impossibility theorems are the field's equivalent of Gödel's Incompleteness Theorems.

  While Arrhenius has multiple theorems, the most devastating one (simplified) demonstrates that you cannot satisfy the following set simultaneously:

  1.  **Dominance**
  2.  **Non-Elitism**
  3.  **Weak Non-Sadism**
  4.  **Quality Addition**
  5.  **Transitivity**

  **The Result:** Any theory satisfying these five conditions will necessarily imply either:
  *   **The Repugnant Conclusion** (Massive numbers of low-quality lives trump high-quality lives), OR
  *   **The Sadistic Conclusion** (Adding people with negative welfare can make the population better), OR
  *   **The Very Repugnant Conclusion** (A world with happy people and suffering people is better than a world with just the happy people).

  **Why?**
  To avoid the Repugnant Conclusion, you must deny that welfare aggregates linearly (Total Utilitarianism). You might try Average Utilitarianism. But Average Utilitarianism violates **Quality Addition** (adding a happy person below the average lowers the average, making the world worse).
  To fix that, you might try a "Critical Level" theory (only lives above a certain threshold count). But if the threshold is too high, you violate **Weak Non-Sadism** (you might prefer adding a suffering person to adding a person below the critical level).
  If you try to fix this by making comparisons "imprecise" to avoid the forced trade-offs, you often violate **Transitivity**.

  There is no "safe zone." You must choose which bullet to bite.

  ---

  ### III. The Secret Sacrifice: Transitivity

  You asked which desideratum people are secretly willing to give up but don't want to admit.

  **It is Transitivity.**

  Here is the dynamic: Philosophers are terrified of the Repugnant Conclusion. They construct theories (like "Imprecise Lexical Views" or "Vague Comparability") to block the slide from "Great Lives" to "Barely Good Lives."
  *   *Argument:* "A is better than B. B is better than C. But after 1,000 steps of small degradation, Z is not worse than A."
  *   *The Cheat:* To make this work formally, the relation "better than" must become intransitive. If $A > B$ and $B > C$, but $A \ngtr C$, you have broken transitivity.

  **Why they hide it:** Admitting intransitivity makes a theory look irrational (the money pump objection). So, theorists use soft language like "parity," "rough equality," or "imprecise cardinality." They claim the values are "on a par" rather than admitting the logical structure of their preference ordering has collapsed. Larry Temkin and Stuart Rachels have hinted at this, but most mainstream population ethicists try to paper over it because an intransitive axiology cannot guide action consistently.

  ---

  ### IV. The Underrated Constraint: Risk Sensitivity

  If I had to pick the single most underrated constraint, it is **Consistency Under Risk (Probabilistic Coherence).**

  **The Problem:** 95% of population ethics papers deal with **deterministic** populations. They compare World A (definitely exists) vs. World B (definitely exists).
  **The Reality:** Policy is never deterministic. We deal with probabilities of existence (e.g., climate change, AI risk, reproductive technology).

  **The Constraint:** A theory must yield consistent verdicts when applied to *expected value* calculations involving population changes.
  *   **The Case:** Suppose Theory X says adding a happy person is good. But suppose there is a 50% chance that person will have a miserable life and a 50% chance they will have a happy life.
  *   **The Failure:** Many theories (especially Critical Level views) behave wildly differently under risk than under certainty. Some imply we should take massive gambles with potential suffering because the "upside" population value is non-linear. Others imply we should never take risks on creating life.

  **Why it matters:** A theory that works for static comparisons but explodes when you introduce a probability distribution over *who* exists or *how many* exist is useless for the actual problems we face (existential risk, long-termism). Most "solutions" to the Repugnant Conclusion have not been stress-tested for **Expected Population Value**. If you build a house on a blueprint that only works in a vacuum, it will collapse in the wind.

  ### Summary for Your Reading
  When you read the next paper, do not ask "Does this solve the Repugnant Conclusion?" Ask:
  1.  **Which of the 5 Arrhenius conditions did they drop?** (They always drop one).
  2.  **Did they break Transitivity to do it?** (Check for "imprecise" language).
  3.  **Does it handle the Sadistic Conclusion?** (If they avoid Repugnant, do they now say adding suffering people is good?)
  4.  **Does it work under uncertainty?** (If they don't mention risk, the theory is incomplete).

  You are not building a house; you are choosing which structural load-bearing wall you are willing to remove. Know which one you are taking out before you start.
