  2.  **Deconstruct the Philosophical Debate (IUC):**
      *   **The Problem:** Can we compare the magnitude of utility (satisfaction/well-being) between different people?
      *   **Orthodox Economics (Ordinalism/Behaviorism):** Utility is ordinal ($A \succ B$). No units. Interpersonal comparison is meaningless (pseudoscience). Associated with Robbins, Samuelson, revealed preference.
      *   **Welfarism/Utilitarianism (Cardinalism):** Utility is cardinal (interval or ratio). We *need* to compare to maximize social welfare. Associated with Bentham, Harsanyi, Sen (to an extent).
      *   **The "Apple" Example:** Ann gains > Bob loses. Requires a common metric.

  3.  **Map Philosophy to Measurement Theory (The Translation Layer):**
      *   *Utility Function* $\rightarrow$ *Instrument Reading*.
      *   *Preferences* $\rightarrow$ *Ordinal Scale* (Ranking).
      *   *Cardinal Utility* $\rightarrow$ *Interval/Ratio Scale*.
      *   *Interpersonal Comparison* $\rightarrow$ *Inter-instrument Comparability* (Calibration).
      *   *Common Standard* $\rightarrow$ *Reference Standard* (e.g., NIST traceable).
      *   *Normative Claim (Justice)* $\rightarrow$ *Policy Decision based on Measurement*.

  4.  **Drafting the Positions:**

      *   **Position 1: The Skeptics (Ordinalists/Behaviorists).**
          *   *Vocab:* Utility is ordinal. Like a thermometer without degrees, just "hotter/colder".
          *   *Calibration:* No common reference standard exists between minds.
          *   *Error:* Systematic error is unknowable because the "true value" (mental state) is inaccessible.
          *   *Translation:* Very clean. This is basically measurement theory applied to behavior.

      *   **Position 2: The Proponents (Cardinalists/Welfarists).**
          *   *Vocab:* Utility is interval/ratio. There *must* be a way to calibrate.
          *   *Calibration:* We use proxies (willingness to pay, neurology, hypothetical questions) as reference standards.
          *   *Translation:* Requires fudging. They often assume "symmetry" or "similar machinery" (human brains are similar instruments) without explicit calibration protocols.

      *   **Position 3: The Pragmatists (Sen/Nussbaum type capabilities or Partial Comparability).**
          *   *Vocab:* Maybe not full ratio scale, but "overlapping intervals."
          *   *Translation:* Like saying two spectrometers agree within a certain tolerance band, even if zero points differ.

  5.  **Analyzing the "Residue" (What doesn't fit):**
      *   *Normativity:* Measurement tells you *what is*. Ethics tells you *what ought to be*. The "Apple" argument isn't just "Can we measure?" it's "Should we measure this way to define justice?"
      *   *Qualia:* The "feeling" of utility. In chem, the signal *is* the measurement. In philosophy, the signal (behavior) is distinct from the state (happiness).
      *   *Agency:* Instruments don't have rights. People do.

  6.  **Addressing the User's Suspicion:**
      *   Suspicion: "It comes down to whether there's any procedure for putting two people on a common utility scale."
      *   Verdict: Mostly yes, but with a caveat. It's not just technical feasibility; it's ontological status. Even if we *could* calibrate (neuroscience), do we *ought* to treat that calibration as moral truth?

  7.  **Determining "What Would Change My Mind" & "Weak Points":**
