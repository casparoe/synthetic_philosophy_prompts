      *   *Philosophical Engagement:* The sorites argument correctly identifies that "adequate progress" has no natural joint. A 2.0 cutoff is indeed stipulative, not discovered. However, the paradox concludes that *no* boundary is defensible. This conflates metaphysical truth with pragmatic utility. We are not describing heaps; we are managing a university. We must stipulate a precisification to function.
      *   *Fairness:* The fairness objection targets inconsistency. Discretion allows implicit bias. A bright line ensures equal treatment *prima facie*. But the sorites warning reminds us that borderline cases (1.99) are not morally distinct from passing cases. Therefore, the bright line must be rebuttable.
      *   *Policy:* 2.0 GPA for 2 semesters triggers automatic review for dismissal. Student can petition. Committee reviews only petitions. This reduces caseload (fairness/efficiency) but allows nuance (sorites).
      *   *Conclusion:* Vote for the hybrid.

  6.  **Review against constraints:**
