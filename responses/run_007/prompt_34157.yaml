answer: |-
  **Setting:** *A quiet corner of a university coffee shop, late afternoon. Two philosophers, ALEX (Utilitarian) and JAMIE (Williamsian), are finishing up a conversation that started in a seminar room.*

  **Jamie:** Let's go back to the drowning wife. It's the clearest case. Williams says if the husband saves her and then says, "I saved her because she is my wife, and in this situation, the impartial calculus permits favoring spouses," he has had one thought too many.

  **Alex:** I grant you that. If he's *thinking* that while treading water, he's probably going to let her drown. As a decision procedure, act-utilitarianism is often disastrous. But we've been over the distinction between the criterion of rightness and the decision procedure. You know the utilitarian doesn't require the agent to run the numbers in the moment.

  **Jamie:** I know the standard reply. "Oh, we have dispositions," "Oh, we have rules." But Williams isn't talking about cognitive load. He's talking about the *structure of justification*. Even if the husband doesn't calculate *while* swimming, if the *ground* of his permission to save her is that the Universe-View allows it, the relationship is already corrupted.

  **Alex:** Corrupted how?

  **Jamie:** Because it makes his commitment contingent. He loves her *on the condition* that loving her doesn't violate the impartial good. But love isn't like that. Love says, "I save you because you are *you*," not "I save you because the system allows me to." If the utilitarian says the ultimate justification must always be impartial, then the spouse is never the ultimate object of value. They are a vessel for value that the impartial observer approves.

  **Alex:** Okay, I want to press you on "ultimate justification." I'm willing to concede something strong here. I agree that if the husband looks at his wife *afterward* and offers that utilitarian justification *to her*, something has gone wrong. It is alienating. It creates a distance between them.

  **Jamie:** Finally.

  **Alex:** But I don't think that alienation is a *reductio* of utilitarianism. I think it's a demand of moral seriousness. Look, if I favor my wife over a stranger, I am making a claim on the world that resources go to her rather than someone else who might need them more. I owe the stranger an account. If I say, "She's mine, end of story," I'm not engaging in morality; I'm engaging in tribalism.

  **Jamie:** But morality isn't the only game in town, Alex. That's Williams's point about integrity. My life is constituted by "ground projects." Being a husband is one of them. If I have to step outside that project to validate it from a neutral standpoint, I'm no longer living *in* the project. I'm observing it. And you can't love someone from the outside.

  **Alex:** I'm not asking him to live outside the project. I'm asking him to acknowledge that his project exists in a world with other people. The "one thought too many" isn't about the motivation. It's about the *accountability*. The husband can feel pure, unadulterated love in the moment. But if you ask him, "Why is it *right* that you saved her and not the two strangers down the dock?" he cannot simply say, "Because I love her." That's an explanation of motive, not a justification of rightness.

  **Jamie:** Why does he need to justify the *rightness* to anyone but himself and her?

  **Alex:** Because actions have costs borne by others! If utilitarianism is true, then morality is about the distribution of well-being. If he privileges her, he is imposing a cost on the strangers. To say he doesn't need to justify that from an impartial standpoint is to say morality doesn't apply to marriage.

  **Jamie:** No, it's to say that the *kind* of justification appropriate to a marriage is internal to the marriage. If I ask my wife, "Why did you bring me coffee this morning?" and she says, "Because maximizing local utility suggested a caffeine delivery would optimize your productivity," I'm not going to say, "Ah, a demand of moral seriousness." I'm going to say, "You don't get it." The justification *is* the motive. "Because I wanted to do something nice for you."

  **Alex:** But that works for coffee. It doesn't work for life and death. If saving her meant actively killing a stranger, would the internal justification hold?

  **Jamie:** That's the hard case. But Williams is talking about the *letting die* case. The man saves his wife; he doesn't push the stranger under. In that case, the utilitarian insists the permission flows from the top down. The impartial view grants a dispensation to the partial view. Williams says the permission flows from the bottom up. The relationship *generates* the reason.

  **Alex:** I see the move. You want to say the relationship is a source of normative force that stands independent of the general good.

  **Jamie:** Exactly.

  **Alex:** Here's where I push back. If the relationship generates normative force independent of the general good, what happens when the relationship is evil? If a mafia don saves his capo instead of a witness, he's acting on "internal relationship reasons." "He's my capo, end of story."

  **Jamie:** That's a disanalogy. The mafia relationship is predicated on harm. Marriage is predicated on mutual care.

  **Alex:** Is it? Or is that just a happy accident? If the utilitarian says, "You can favor your wife *because* institutions of partial care generally maximize well-being," they are securing the *value* of the relationship. If you say, "You favor her because the relationship creates its own gravity," you lose the ability to critique the relationship from the outside.

  **Jamie:** I don't lose the ability to critique. I just deny that the *moral* critique is the only one that matters. The mafia don is violating moral norms. The husband saving the wife is fulfilling a different kind of norm—ethical, in the Williamsian sense, not moral. The "moral" system you're defending demands that I view my own life as a channel for the general good. That's the alienation. It's not that I'm thinking about utility while swimming. It's that my life only matters insofar as it serves the standpoint of the universe.

  **Alex:** "The standpoint of the universe." Williams uses that phrase like it's a slur. But why is it bad to acknowledge that my perspective is one among many?

  **Jamie:** Because I am not a vessel for the universe. I am *me*. And "me" is defined by these attachments. If I have to justify my attachments to the universe, I am prioritizing the universe over my attachments.

  **Alex:** I'm willing to grant this: The husband should not offer the utilitarian justification *to his wife*. That would be a category error. It would be cold, bureaucratic, and yes, alienating. But he must be able to offer it to *himself* in reflection, or to the moral community.

  **Jamie:** Why?

  **Alex:** Because otherwise, he is deluded. He thinks his partiality is absolute. It isn't. If saving his wife meant detonating a bomb that killed a thousand people, he shouldn't save her. He knows that. So, implicitly, his commitment *is* conditional on the broader consequences. The utilitarian just makes that conditionality explicit.

  **Jamie:** But there's a difference between a *limit* and a *foundation*. I grant there are limits. I won't kill for her. But the *reason* I save her isn't "It doesn't violate the limit." The reason is "She is my wife." The utilitarian turns the limit into the foundation. You're saying, "The only reason you have to save her is that the general good doesn't forbid it." That renders the love inert. It's not driving the action; the general good is driving the action, using love as a tool.

  **Alex:** I think you're conflating the *source* of the reason with the *validation* of the reason. The source is love. "I love her, so I jump in." The validation is utilitarian. "It is permissible that I love her this much." Williams wants to say that if the validation comes from utility, the source is poisoned. I'm saying the source remains pure, but we must acknowledge the boundaries of the permission.

  **Jamie:** But if the validation determines the permissibility, then the source is only *provisionally* valid. My love is only as good as its utility score. That means if, in some bizarre world, saving my wife didn't maximize utility, I ought not to love her in that way. I ought to withhold the rescue.

  **Alex:** In that bizarre world, yes.

  **Jamie:** And that's the integrity objection! In that world, you are asking me to abandon my ground project. You are asking me to betray who I am for the sake of a calculation. You say, "Better to betray yourself than betray the calculus." I say, "If I betray myself, who is there left to do the calculating?"

  **Alex:** There is someone left. A person who recognizes that their own integrity is not the most important thing in the world. That sounds harsh, I know. But consider the alternative. If we say relationships generate their own normative force, we have no way to adjudicate between conflicting relationships. My love for my wife vs. your love for your brother. If both are self-justifying, we are at war. The impartial standpoint is the only peace treaty we have.

  **Jamie:** The peace treaty is a ceasefire of the dead, Alex. It requires us to kill off the very impulses that make life worth living. Williams isn't saying "Morality doesn't exist." He's saying "The Moral System," the one that demands impartiality as the supreme authority, is a fiction that crushes human beings. The husband who saves his wife isn't making a moral claim against the strangers. He's acting out of necessity. To demand he justify it impartially is to demand he cease to be a husband.

  **Alex:** I hear you. And I want to be clear: I am not saying he should feel guilty. I am not saying he should hesitate. I am saying that when the dust settles, if we ask, "Was the world better for his choice?" the answer must be determined impartially. If the answer is "No," then his choice, however understandable, was morally wrong.

  **Jamie:** And there it is. "Morally wrong."

  **Alex:** Yes.

  **Jamie:** You're willing to call saving one's wife "morally wrong" if the numbers don't add up?

  **Alex:** I'm willing to say it fails the moral criterion. I might still say it was humanly understandable. I might say we shouldn't punish him. But if morality is about the good of all, and he chose the good of one...

  **Jamie:** Then your morality is inhuman. That's Williams's conclusion. You've defined morality in such a way that a good human being is, by definition, a bad moral agent. And I'd rather keep the human being.

  **Alex:** And I'd rather keep the accountability. If we let the husband off the hook completely, we tell the stranger their life mattered less simply because they weren't loved. I can't accept that. The alienation you fear? It's the price of admitting the stranger matters at all.

  **Jamie:** The stranger matters. But not enough to demand I treat my wife like a stranger.

  **Alex:** Utilitarianism doesn't demand you treat her like a stranger. It demands you acknowledge that the *privilege* of treating her differently is a gift from the moral order, not a right from the relationship.

  **Jamie:** And that's the one thought too many. The relationship isn't a privilege granted by the order. It's the ground the order stands on.

  **Alex:** Then we're at an impasse. You think the relationship grounds the value. I think the value grounds the relationship.

  **Jamie:** We are. You see a husband who needs to be reminded he's part of a universe. I see a husband who needs to be reminded he's part of a life.

  **Alex:** *Sips cold coffee.* Well. At least we agree the coffee needs saving.

  **Jamie:** *Smiles.* Save it. Just don't calculate the utility of the caffeine.

  **Alex:** No promises.
