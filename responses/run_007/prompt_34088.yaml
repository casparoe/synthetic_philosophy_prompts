      *   *The Proposition:* "I think, therefore I am" (*Cogito, ergo sum*).
      *   *Key Ambiguities:*
          1.  **The "I" (Subject):** Is it a persistent soul? A momentary subject of experience? A grammatical fiction?
          2.  **The "Thinking" (Activity):** Does it require higher-order reflection? Or just raw sensation? Does dementia impair *this* specific kind of thinking?
          3.  **The "Existence" (Predicate):** Existence as what? A human being? A mind? A metaphysical substance? A moral agent?

  3.  **Evaluate the Cousin's Argument:**
      *   *Cousin's Claim:* Dementia patient has experiences $\rightarrow$ Patient thinks $\rightarrow$ Patient exists as a self $\rightarrow$ Patient is still "her."
      *   *The Gap:* The *Cogito* proves *existence*, not *identity*. It proves *that* you are, not *who* you are.
