answer: |-
  **Exam Question**

  **Time Allowed:** 60 Minutes
  **Word Limit:** None (but conciseness is rewarded)

  **Question:**
  Galen Strawson's Basic Argument concludes that true moral responsibility is impossible. In a focused essay, address the following three points:
  1.  Explain why the Basic Argument is fundamentally a *regress* argument concerning self-creation, rather than a simple complaint that agents did not create their initial circumstances.
  2.  Demonstrate why this argument is distinct from the Consequence Argument and remains forceful even if determinism is false (i.e., why indeterminism does not halt the regress).
  3.  Identify the specific premise a compatibilist must reject to escape the argument. Assess whether rejecting this premise leaves compatibilism with a conception of responsibility robust enough to ground ordinary blame and resentment, or whether it yields only a deflated, merely causal notion of ownership.

  ***

  **Model Answer**

  Galen Strawson's Basic Argument posits that moral responsibility requires "Ultimate Responsibility" (UR), which is impossible to attain. To understand its force, one must recognize it not as a linear deduction but as a vicious regress regarding self-creation. It is not merely the complaint that "I did not create myself," which might be satisfied if one could somehow edit one's nature later. Rather, Strawson argues that to be responsible for an action, one must be responsible for the mental nature from which that action flows. However, to be responsible for that mental nature, one must have chosen it via a prior act. That prior act, in turn, must flow from a prior mental nature. This generates an infinite regress: one cannot create one's nature without already possessing a nature to guide the creation. Thus, the argument is not that we lack a starting point, but that *any* starting point for responsible agency requires a prior responsible starting point.

  This structure distinguishes the Basic Argument from van Inwagen's Consequence Argument. The Consequence Argument relies on the fixity of the past and the laws of nature; it claims that if determinism is true, our actions are consequences of things we did not control. Strawson's argument, however, targets the structure of agency itself, independent of causal determination. Even if determinism is false and choices are undetermined, the regress persists. If a choice is undetermined, it is not fully determined by the agent's prior mental state. If it is not determined by the agent's prior state, it appears to be a matter of luck or randomness. Randomness does not confer responsibility. Therefore, to be responsible for an undetermined choice, one would still need to be responsible for the probabilistic weights of one's character that influenced it, reigniting the requirement for self-creation. The Basic Argument succeeds where the Consequence Argument might fail because it shows that indeterminism offers no purchase for *ownership*, only an escape from causal necessity.

  To escape this conclusion, a compatibilist must reject the premise that responsibility for an action requires responsibility for the way one is (specifically, the mental respects that lead to the action). Compatibilists argue that responsibility requires only that the action issues from the agent's actual desires and reasons-responsiveness, regardless of how those desires were acquired. They deny the need for UR.

  The critical assessment is whether this rejection preserves robust responsibility. If we reject the requirement for self-creation, we retain a notion of ownership: the action is mine because it flows from my psychology. However, this conception appears deflated regarding *desert-based* blame and resentment. If my psychology was ultimately the product of luck (genetic or environmental), resentment loses its retributive justification. I may be a proper target for modification or quarantine (causal ownership), but not for moral condemnation in the ultimate sense. The compatibilist saves responsibility by lowering the stakes: we are responsible only in a social, forward-looking sense, not a metaphysical one.

  This verdict—that compatibilism offers only a deflated responsibility—could be overturned if one successfully argues that "ultimate" origin is irrelevant to the *practice* of blame. If reactive attitudes are justified by the quality of will displayed in the present moment, rather than the history of that will, then the regress is practically moot. However, without such a decoupling of desert from history, Strawson's regress suggests that true moral responsibility is a coherent impossibility.

  ***

  **Marking Scheme (Total: 20 Marks)**

  **1. The Regress vs. Bare Complaint (5 Marks)**
  *   **A Range (4-5):** Clearly articulates that the problem is not the lack of an initial cause, but the impossibility of *any* step in the chain being truly "owned" without a prior owned step. Explains that choosing one's nature requires a prior nature to do the choosing.
  *   **B Range (2-3):** States that we can't create ourselves but misses the iterative structure. Treats it as a single-step impossibility ("I didn't choose my parents") rather than a regress.
  *   **C Range (0-1):** Merely lists the steps of the argument without explaining the logical force of the regress.

  **2. Distinction from Consequence Argument/Determinism (5 Marks)**
  *   **A Range (4-5):** Explicitly notes that the Consequence Argument relies on determinism (fixity of past/laws), whereas Strawson's argument applies to indeterminism. Explains the "luck" objection: undetermined choices are random, not owned, so the regress continues.
  *   **B Range (2-3):** Notes that Strawson doesn't assume determinism but fails to explain *why* indeterminism doesn't help (i.e., treats indeterminism as a magic bullet without addressing randomness).
  *   **C Range (0-1):** Conflates Strawson with van Inwagen or claims Strawson argues determinism is true.

  **3. Premise Rejection & Assessment of Compatibilism (7 Marks)**
  *   **A Range (6-7):** Identifies the rejection of the requirement for responsibility for one's mental nature (or UR). Provides a nuanced assessment: acknowledges compatibilism saves "ownership" but questions whether it saves "desert/blame." Distinguishes between forward-looking (causal) and backward-looking (retributive) responsibility.
  *   **B Range (4-5):** Identifies the correct premise but gives a standard textbook defense of compatibilism (e.g., "we just need free will defined as doing what you want") without assessing the *robustness* of blame as requested.
  *   **C Range (0-3):** Fails to identify the premise or claims compatibilism solves the regress entirely without qualification.

  **4. Structure and Clarity (3 Marks)**
  *   **A Range (3):** Concise, logical flow, adheres to the three-part structure.
  *   **B Range (2):** Readable but disorganized or verbose.
  *   **C Range (0-1):** Difficult to follow.

  **Common Errors to Penalize:**
  *   **Conflation with PAP:** Penalize in Section 2 if the student argues Strawson relies on the Principle of Alternative Possibilities.
  *   **Literal Self-Creation:** Penalize in Section 1 if the student interprets "responsible for the way one is" as the demand to be biologically self-created (e.g., choosing one's DNA) rather than mentally self-determined.
  *   **Determinism Assumption:** Penalize in Section 2 if the student claims the argument fails if determinism is false.

  **Credit for Contrary Conclusion:**
  The Model Answer concludes that compatibilism yields a "deflated" responsibility. A student may argue the contrary (that compatibilism remains robust) and receive full credit in Section 3 **if and only if** they argue that reactive attitudes (resentment/blame) are justified by the *current* quality of will or reasons-responsiveness, independent of ultimate origin. They must explicitly address why the loss of "Ultimate Responsibility" does not undermine the justification for blame. Mere assertion that "compatibilism is true" is insufficient.
