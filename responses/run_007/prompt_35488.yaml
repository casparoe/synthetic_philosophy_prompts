answer: |-
  This is one of the most famous and sharpest objections to Austin's early framework. In fact, you have hit on the exact tension that leads Austin to eventually dismantle his own distinction later in the book.

  However, to understand why Austin insists on the distinction *initially*, and why "happy/unhappy" is not just a disguised "true/false," we need to look at three specific things: the difference between **voiding an act** vs. **lying**, the **direction of fit**, and the fact that **Austin eventually agrees with you.**

  Here is what you are missing (and where you are actually right).

  ### 1. The Act Happens Even If You Lie
  The core of Austin's argument is that a performative is an **action**, not a description.

  If I say, "It is raining," and it is not raining, my statement is **false**. It fails to match the world.
  If I say, "I promise to pay you," and I have no intention of paying you, Austin argues my promise is **infelicitous (unhappy)**, but it is *still a promise*.

  This is the crucial distinction.
  *   **Falsehood:** If a constative is false, it doesn't mean the *act of speaking* failed; it means the *content* is wrong.
  *   **Insincerity (Abuse):** If a performative is insincere, the *act itself succeeds* in creating an obligation, even though I am being morally dubious.

  If "I promise" were simply a report of my inner state (i.e., "I intend to..."), then an insincere promise would be a lie about my intentions, and **no promise would have taken place.** But in social reality, if I insincerely promise to meet you for lunch, I am still expected to show up. I have created an obligation. I cannot say, "Well, technically I was lying about my intention, so the promise is null and void."

  Austin calls this an **Abuse** of the procedure, not a **Misfire**.
  *   **Misfire:** "I divorce you" (said by someone who isn't married, or in a country without divorce). The act *does not happen*.
  *   **Abuse:** "I promise" (said without intention). The act *happens*, but it is flawed.

  If it were just true/false, an insincere promise would be a "false promise" in the sense that *no promising occurred*. But Austin says promising *did* occur; it was just "hollow."

  ### 2. The "Hereby" Test and Third Persons
  If "I promise" were just a report of my psychological state ("I intend to..."), it would behave like other psychological reports. But it doesn't.

  *   **The "Hereby" Test:** You can say, "I **hereby** promise to pay you." You cannot say, "I **hereby** intend to pay you." The word "hereby" signals that the utterance itself is the performance of the act. Intention is a pre-existing state; promising is the act created by the words.
  *   **Third Person:** I can say, "He promises to pay you." I cannot easily say, "He intends to pay you" with the same binding force. If I report his intention, I might be wrong about his mind. If I report his promise, I am reporting a social fact (that he undertook an obligation), regardless of his mind.

  ### 3. Direction of Fit
  This is a later Searlean term, but it applies perfectly to Austin.
  *   **Constatives (True/False):** Have a **word-to-world** direction of fit. My words must match the facts.
  *   **Performatives (Happy/Unhappy):** Have a **world-to-word** direction of fit. The world must change to match my words.

  When I say "I promise," I am not trying to match my words to my brain (reporting intention); I am trying to change the social reality so that I am now obligated. The "happiness" conditions are about whether the social machinery worked to create that obligation, not whether my brain matches my mouth.

  ### 4. The Twist: Austin Eventually Agrees With You
  Here is the part that will make your reading even more interesting.

  Austin introduces the True/False vs. Happy/Unhappy distinction in **Lecture 1**. But by **Lecture 12**, he effectively dissolves it.

  He realizes that constatives *also* have felicity conditions.
  *   If I say, "The cat is on the mat," but I have no evidence for this, I am not just "false"; I am violating a rule of assertion (similar to sincerity).
  *   If I say, "France is hexagonal," is it true or false? It's a rough approximation. It's "happy" enough for a general, "unhappy" for a geographer.

  Austin concludes that **all speech is performative** in some sense. Every utterance is an act (an illocutionary act). Therefore, the distinction between constative and performative is not a hard binary, but a matter of emphasis.

  So, your intuition is actually **prophetic**. You have spotted the weakness in Austin's initial heuristic that led him to his final, more mature theory.

  ### Summary
  You aren't missing the fact that there is an overlap; you are missing the **ontological claim** Austin is making in the early lectures.

  1.  **Initial Claim:** "I promise" is not a report of intention; it is the *creation* of obligation. Therefore, lying about it doesn't make the statement "false," it makes the action "abused." The obligation exists even if the intention doesn't.
  2.  **Your Objection:** But doesn't the sincerity condition make it truth-conditional?
  3.  **Austin's Final Answer:** Yes, basically. In the end, Austin admits that describing and doing are intertwined.

  For now, stick with the distinction: **True/False** is about correspondence with facts; **Happy/Unhappy** is about the successful execution of a social procedure. An insincere promise is a *successful procedure* executed with *bad faith*, whereas a false statement is a *failed description*.

  Keep reading! The moment Austin deconstructs his own distinction is one of the best moments in 20th-century philosophy.
