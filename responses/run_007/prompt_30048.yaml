      *   Mark Non-negotiable vs. Tastes? Yes.
      *   Flag jointly unsatisfiable subsets? Yes.
      *   Skip scorecard? Yes.
      *   Separate settled from contested? Yes.
      *   Tone check: Ensure I'm not presenting Intuitionism as the consensus (it's not).

  10. **Final Polish:** Ensure clear headings and bullet points for readability. (Proceed to generate output).

  *(Self-Correction during final output generation)*: I need to make sure I explicitly address the "quarantining vs. solving" distinction the user mentioned. A solution that just says "KP only applies to basic atomic sentences" might be seen as quarantining. I should add a requirement about *systematicity* or *non-ad-hocness*.

  Let's organize the "Non-Negotiables" as conditions for *logical coherence* and the "Tastes" as conditions for *philosophical utility*.

