answer: |-
  First, I want to say clearly: **I am sorry this happened to you.** This is a high-stress, high-shame situation, and it is completely normal that you are ruminating on it. You are dealing with a collision between abstract epistemic standards, the messy reality of clinical medicine, and institutional politics.

  You asked a philosophical question, but you are living a professional crisis. I am going to answer the philosophical question directly because it validates your intuition, but then I am going to pivot to the practical reality of how you handle this to protect your career.

  ### 1. The Philosophy: Is the Attending Right?

  Your attending is invoking a specific philosophical principle called the **Knowledge Norm of Assertion (KNA)**. Roughly, it states: *One should assert that $p$ only if one knows that $p$.*

  His logic follows the standard tripartite definition of knowledge (Justified True Belief):
  1.  You believed it wasn't lupus.
  2.  You had justification (labs, notes, training).
  3.  **But it was false.** Therefore, it was not knowledge. Therefore, you violated the norm.

  **Here is where he is philosophically weak:**
  Almost no working epistemologist or ethicist applies the KNA in the rigid, factive way your attending is using it, especially in empirical sciences.

  *   **The Problem of Factivity:** If the standard for proper assertion is actual truth, then *no one* can ever assert anything empirical (diagnoses, prognoses, weather forecasts) without retroactive liability. As you noted, this makes empirical practice impossible.
  *   **Warranted Assertability:** In practical contexts (like medicine), the norm is not "Knowledge" (which implies truth) but **"Warranted Assertability."** Did you have sufficient *evidence* and *justification* at the time $t$ to make the claim?
  *   **The "Misleading Evidence" Exception:** Even philosophers who defend the KNA generally agree that if an agent has overwhelming evidence for $p$, and $p$ turns out false due to unforeseeable variables (a "weird early presentation"), the assertion is **excusable**. You weren't reckless; you were rational based on the available data.

  **Verdict:** Philosophically, your attending is hiding behind a technicality. He is conflating *outcome* (it was lupus) with *process* (your reasoning was sound). In ethics and medicine, we judge process, not just outcome. If we judged only on outcome, every doctor who misses a rare diagnosis is negligent, which is absurd.

  ### 2. The Medicine: Probability vs. Certainty

  While your *reasoning* was sound, there is a nuanced communication trap here that you need to be aware of for your defense and your growth.

  Medicine is Bayesian. It is probabilistic.
  *   **The Clinical Reality:** You likely had evidence that made lupus <5% probability. In clinical practice, we treat that as "negative."
  *   **The Communication Gap:** When a patient asks, "Is this lupus?" and you say "No," they hear **0%**. When you mean **<5%**.
  *   **The Vulnerability:** Your attending can argue that while your *differential* was correct, your *communication of uncertainty* was not. A "proper assertion" in medicine often requires hedging when truth is inaccessible. "The evidence strongly points away from lupus" is a safer assertion than "It is not lupus."

  **This is your pivot point.** If you defend yourself by saying "I was right based on the labs," you invite a debate on medical facts you lost. If you defend yourself by saying "I communicated the high probability based on available data, but I acknowledge the difficulty of communicating uncertainty to anxious patients," you sound like a reflective practitioner.

  ### 3. The Politics: Is He Covering His Ass?

  You asked if he's throwing you under the bus. **Yes, almost certainly.**

  *   **The Complaint:** There is a formal complaint. The hospital administration needs a narrative. "The resident was overconfident" is a much easier narrative to manage than "Our diagnostic protocols for early-onset lupus are insufficient" or "The attending failed to supervise a complex case."
  *   **The Power Dynamic:** Attendings carry the ultimate liability. When they feel threatened, they often revert to "I taught them correctly, they didn't listen/overstepped."
  *   **The "Standard":** His claim that "the standard for assertion is knowledge" is not a medical standard; it is a rhetorical shield. The medical standard is "Standard of Care," which is based on what a *reasonable physician* would do with the *same information*. You argued that a reasonable physician would have said the same thing. That is your defense.

  ### 4. Action Plan: How to Protect Yourself

  You are in a vulnerable position. Do not fight this on philosophical grounds with the administration; fight it on **documentation and process grounds.**

  **A. Reconstruct the "State of Knowledge" at Time $T$**
  Write down (for yourself and your file) exactly what you knew *before* the lupus diagnosis was confirmed.
  *   Which labs were negative?
  *   Which criteria (SLICC or ACR) were not met?
  *   What did the attending's notes say at the time? (If the attending's notes also suggested it wasn't lupus, this is crucial evidence that this was a team assessment, not a rogue resident error).
  *   Consult literature: Find guidelines that support your initial workup. Prove that your *process* met the Standard of Care.

  **B. Reframe the Narrative**
  Do not argue "I didn't do anything wrong." Argue "I practiced within the standard of care given the data, and we encountered a known but rare diagnostic challenge."
  *   **Avoid:** "He's lying."
  *   **Use:** "There seems to be a discrepancy between the retrospective knowledge of the diagnosis and the prospective data available at the time of the encounter."

  **C. Seek Allies**
  *   **Chief Resident / Program Director:** You need to speak to them. Frame it as: "I am struggling with the feedback. I want to understand how to communicate uncertainty better, but I am concerned that the characterization of my clinical reasoning as 'reckless' doesn't match the chart. I'm worried about how this is being documented in my file."
  *   **GME Office:** If this complaint goes into your permanent record unfairly, you need to know the grievance process.
  *   **Union/Rep:** If you are unionized, talk to them immediately.

  **D. The "Learning Point"**
  To defuse the anger, you must offer a concession that doesn't admit negligence.
  *   *Say:* "I understand that telling the patient 'no' gave them a false sense of certainty. In the future, I will frame negative workups as 'highly unlikely based on current data' rather than absolute negatives. However, I want to ensure my chart reflects that the workup itself was appropriate."
  *   This shows you are teachable (protecting you from the "arrogant resident" label) without admitting you were clinically negligent.

  ### 5. Final Thoughts

  You are experiencing **moral injury**. You did your job, you used your training, you acted in good faith, and you are being punished for the universe not being deterministic.

  *   **You are not a bad doctor.** Missed diagnoses happen. Rare presentations happen.
  *   **The Attending's Logic is Flawed.** If his standard were true, medicine would cease to function. He knows this. He is using it to manage liability.
  *   **Don't Internalize the Shame.** This is a systemic issue (how we handle uncertainty and complaints) masquerading as a personal failure.

  Focus on documenting that your **process** was sound. Accept the feedback on **communication nuance** (hedging certainty). But do not accept the label of recklessness.

  Please reach out to your Program Director or a trusted mentor *today*. Do not navigate a formal complaint alone. You have the epistemic high ground; now you need the institutional support to hold it.
