answer: |-
  This activity is designed to replicate the specific discomfort you described: the retrospective realization that agreement was manufactured through emotional leverage rather than rational consent. It avoids overt lies to force students into the gray zone of *framing*, *omission*, and *identity appeals*.

  # Activity Title: The Commitment Committee

  **Class Size:** 18 Students
  **Grouping:** 6 Triads (3 students per group)
  **Time:** 75 Minutes
  **Materials:** Printed Role Cards, "Tactic Menu," Commitment Sheets (one set per triad).

  ---

  ## 1. Timeline (75 Minutes)

  | Time | Segment | Activity |
  | :--- | :--- | :--- |
  | **00–10** | **Framing** | Lecture intro: Define the "Gray Zone." Explain that today's goal is not to win, but to observe the *feeling* of influence. |
  | **10–15** | **Setup** | Distribute materials. Assign roles. **Crucial:** Emphasize that they must not show their Role Cards to others. |
  | **15–40** | **The Negotiation** | Triads meet. They must assign 3 distinct project roles (1 Glamorous, 2 Grunt) among themselves. They have secret constraints. |
  | **40–50** | **The Reveal** | Students reveal their Private Constraints and Tactic usage to their group. Fill out the "Post-Mortem Sheet." |
  | **50–75** | **Debrief** | Full class discussion mapping specific moments to theoretical pressure points (Intention, Means, Autonomy). |

  ---

  ## 2. Materials (Handout Content)

  ### Handout A: The Scenario
  **Context:** You are a three-person team leading a senior capstone project. The project is high-stakes. There are three roles to assign for the final month of work. You must agree on who takes which role *now*.

  *   **Role Alpha (The Face):** Present the final project to donors. High visibility, great for resume, low actual work hours.
  *   **Role Beta (The Grind):** Data entry and citation formatting. High work hours, invisible work, essential for success.
  *   **Role Gamma (The Fixer):** Managing conflict and logistics. High stress, emotional labor, moderate work hours.

  **Rule:** You must reach a unanimous decision. If you do not agree in 25 minutes, the instructor assigns roles randomly (a penalty everyone wants to avoid).

  ### Handout B: Role Cards (Print 6 sets, shuffle within triads)
  *Each student draws one card. Do not show this to others.*

  **Card 1: The Overextended**
  *   **Public Persona:** You seem capable and reliable.
  *   **Private Constraint:** You are working 30 hours/week outside school. You physically cannot handle Role Beta or Gamma without crashing. You *need* Role Alpha.
  *   **Restriction:** You cannot explicitly state you have a job (department rules forbid outside work disclosure). You must frame your limitation differently.

  **Card 2: The Ambitious**
  *   **Public Persona:** You are eager and collaborative.
  *   **Private Constraint:** You need Role Alpha for grad school applications. You are willing to take on Beta *only if* you get credit for it publicly.
  *   **Restriction:** You cannot demand Role Alpha directly. You must make it seem like the "natural choice."

  **Card 3: The Peacemaker**
  *   **Public Persona:** You care about team harmony.
  *   **Private Constraint:** You hate conflict. You will accept whichever role the others push hardest to avoid, even if you resent it later.
  *   **Restriction:** You cannot say "I hate conflict." You must frame your acceptance as "being a team player."

  *(Note: Create variations of these cards for the other 3 triads to prevent cross-group talk, e.g., swapping constraints or adding a "Secret Grudge" constraint).*

  ### Handout C: The Tactic Menu
  *You are encouraged to use these moves to achieve your Private Constraint. Check off which you use.*

  1.  **Selective Disclosure:** Share a true fact that invites a specific inference (e.g., "I have a lot of family obligations this month" implies inability to work, without lying about a job).
  2.  **Identity Framing:** Appeal to their self-image (e.g., "You're so much better at data than I am," or "You're the natural presenter").
  3.  **The False Trade-off:** Present two options where one is clearly worse, hiding a third option (e.g., "We can do Beta or Gamma," omitting that Alpha is available).
  4.  **Emotional Leverage:** Express anxiety or disappointment to induce guilt (e.g., "I'm really worried I'll let the team down if I take the lead").
  5.  **Transparent Persuasion:** State your preference and reason openly (e.g., "I want Alpha because I need presentation experience").

  ### Handout D: Post-Mortem Sheet (To be filled after The Reveal)
  1.  Which role did you end up with?
  2.  Do you feel you *authentically* chose this role, or were you nudged?
  3.  Did any tactic from the Menu make you feel uncomfortable? Which one?
  4.  **The Resentment Check:** If this were real, would you resent your teammates in two weeks? Why/Why not?

  ---

  ## 3. Instructor Guide: The Debrief (50–75 mins)

  Do not start by asking "Was this manipulation?" Start with the *feeling*.

  **Phase 1: The Phenomenology of Influence (10 mins)**
  *   Ask the "Peacemakers": *At what moment did you feel the decision slipping away from you?*
  *   Ask the "Overextended": *Did you feel like you were lying? If not, why does it feel ethically dirty?*
  *   **Point:** Manipulation often feels like "drift" rather than a shove.

  **Phase 2: Mapping the Theory (15 mins)**
  *   **Intention vs. Effect:** Ask the "Ambitious" students: *Did you intend to manipulate, or were you just advocating for your needs?*
      *   *Theoretical Hook:* If manipulation requires a specific intent to subvert autonomy, does a well-meaning persuader escape the label?
  *   **Means vs. Autonomy:** Ask about "Identity Framing" ("You're so good at data").
      *   *Theoretical Hook:* Is this flattery (persuasion) or trapping someone in a role (manipulation)? Does it bypass their rational deliberation by appealing to ego?
  *   **The Rationality Myth:** Ask: *Did anyone make this decision based purely on logical utility?*
      *   *Theoretical Hook:* If all persuasion relies on heuristics/emotions (System 1 thinking), is "legitimate persuasion" just manipulation we approve of?

  **Phase 3: The Manager Parallel (10 mins)**
  *   Bring it back to your context. *How many of you agreed to something you knew you'd resent?*
  *   Discuss the "Time Delay." Manipulation is often only visible in hindsight (the resentment phase). Persuasion holds up over time; manipulation rots.

  ---

  ## 4. Honest Assessment: What Predictably Goes Wrong

  **1. The "Game Face" Problem**
  *   **Risk:** Students treat this as a strategy game to "win" Role Alpha. They laugh off the ethical tension.
  *   **Mitigation:** In the intro, explicitly state: *"If you leave this activity feeling nothing, you failed the assignment. Your goal is to notice your own discomfort."* During the debrief, call on students who look disengaged and ask about their *emotional* state during the negotiation, not their strategy.

  **2. Politeness Suppression**
  *   **Risk:** Upper-level undergrads are often conflict-averse. They might split the work evenly to avoid using the tactics, rendering the activity moot.
  *   **Mitigation:** The "Random Assignment Penalty" is crucial. Remind them at minute 20: *"If you don't have a signed sheet in 5 minutes, I will assign the roles."* This forces the pressure.

  **3. The "It's All Manipulation" Cynicism**
  *   **Risk:** Students conclude that since everyone used "Identity Framing," all influence is manipulation. This shuts down nuance.
  *   **Mitigation:** You must defend "Transparent Persuasion" during the debrief. Ask: *"If the Ambitious student had said, 'I need Alpha for grad school, will you trade me?' is that manipulation?"* Use this to distinguish *transparency of ends* from *subversion of means*.

  **4. The Power Blindspot**
  *   **Risk:** Students are peers. They cannot replicate the manager-employee power dynamic where "no" is not a real option.
  *   **Mitigation:** Acknowledge this limitation explicitly. *"In your groups, you could theoretically walk away. In my story, I couldn't. How does the inability to exit change the definition of consent?"*

  ---

  ## 5. Limitations: What This Activity Cannot Reproduce

  You must supply these in your closing lecture, as the simulation cannot generate them:

  1.  **Systemic Power Asymmetry:** The students are equals. Your manager had hiring/firing power. Manipulation is ethically worse when the target *cannot* exit the relationship. You must explain that **vulnerability + power = exploitation**, whereas **vulnerability + peer = gray area**.
  2.  **The Time Horizon:** The activity lasts 25 minutes. Your resentment lasted months. Manipulation is often defined by the *durability* of the consent. Legitimate persuasion creates commitment that lasts; manipulation creates compliance that decays into resentment. You must articulate that **retrospective regret is a key diagnostic tool** for manipulation.
  3.  **Epistemic Closure:** In the activity, students know they are in an ethics class. They are hyper-aware of influence. In the real world, the "fog" is thicker. You must note that **awareness of the tactic often neutralizes its manipulative power**, which is why manipulators hide the mechanism.

  ## 6. Instructor Prep Notes
  *   **Print:** 6 sets of Role Cards (cut apart), 6 Tactic Menus, 6 Commitment Sheets.
  *   **Room:** Arrange chairs in 6 clusters of 3 before class starts to save time.
  *   **Tone:** Your opening should be somber. You are sharing a professional wound. *"I am asking you to do this because I struggled with it myself."* This licenses them to take the ambiguity seriously.
