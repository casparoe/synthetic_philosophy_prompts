      *   **Core View:** Personal identity is not what matters; Relation R (psychological continuity and connectedness with the right kind of cause) is what matters. Uniqueness is not required for what matters.
      *   **Specific Cases:** Teletransporter (destructive is fine), Fission (two successors is not worse, though identity doesn't hold).
