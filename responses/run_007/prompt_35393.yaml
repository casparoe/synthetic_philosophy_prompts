      *   *Acknowledge the intuition:* Parfit himself acknowledges that our ordinary beliefs favor uniqueness. It's a deep-seated intuition.
      *   *Diagnose the intuition:* Why do we feel this way? Parfit argues it's because in the real world, fission doesn't happen. Our concept of identity is tied to uniqueness because identity is a one-one relation. When we imagine fission, we try to apply the concept of identity where it doesn't fit, leading to confusion or fear.
      *   *Address the "Evidence" Claim:* The user argues their reluctance is evidence that uniqueness matters. The Parfitian must argue that intuitions are theory-laden and can be mistaken about metaphysical reality. The feeling of "death" in fission is a cognitive error based on applying the wrong concept (identity) to a case where only R matters.
      *   *Practical Advice:* What should the user do? Parfit would say rationally, you should be indifferent or even prefer the fission case (more of what matters). However, given the psychological distress, there might be pragmatic reasons to choose the single successor case, but not because the two-successor case involves death.
