answer: |-
  To naturalize content is to explain how brain states point to the world without magic. For your characters, the brain must sustain states that persist even when the world disagrees. Here is the spec for any theory claiming to solve this.

  **The Desiderata**

  1.  **The Error Constraint (Non-negotiable).** A system must distinguish between "representing X" and "X causing the representation." If a state means *husband alive*, it must remain meaningful even when the husband is dead. Pure correlation fails here; if the state only occurs when the husband is alive, it cannot represent him being alive when he is dead.
      *Case:* The widow believing her husband lives.
  2.  **The Determinacy Constraint (Non-negotiable).** Content must be specific, not a disjunction of all possible causes. If a neuron fires for flies and BBs, the content cannot be "fly OR BB." It must be one, allowing the other to be an error.
      *Case:* The frog snapping at BBs. Is it seeing "fly" or "small dark moving thing"?
  3.  **The Novelty Constraint (Non-negotiable).** The system must generate content about things never encountered by ancestors. Evolution selects for past fitness, not future physics.
      *Case:* Thinking about quarks, unicorns, or next Tuesday.
  4.  **The History Constraint (Contested).** Does content require an evolutionary or learning history, or does it supervene on current physical structure?
      *Case:* Swampman (a duplicate created by lightning with no history).

  **Assessment of Requirements**

  **Genuine vs. Taste**
  Error and Determinacy are non-negotiable. Without them, you don't have representation, only causation. If a state cannot be false, it isn't a belief; it's a reflex. If content is vague ("fly-or-BB"), the character isn't deluded, just broadly triggered.
  Novelty is genuine for human brains. Any theory that says humans cannot think about quarks is empirically false.
  The History Constraint is **theoretical taste**. It depends on whether you accept externalism (content depends on history/environment) or internalism (content depends on current head-state). Teleosemantics demands history; structuralism denies it. This is not a bug in the world, but a fork in the theory. For a novelist, Swampman is a red herring if you care about actual humans, but crucial if you care about the *definition* of content.

  **Incompatibilities**
  You likely cannot satisfy **Novelty** and **History** simultaneously. If content requires selected functions (History), then thoughts about unicorns (never selected for) lack content, or must be parasitic on other content. If content requires only current structure (to handle Novelty), you struggle to explain **Error** without appealing to history (what makes the structure *wrong*?).
  Furthermore, satisfying **Determinacy** often requires **History**. To say the frog means "fly" not "dark thing," you usually need to cite what the detector was *supposed* to do (evolutionary history). But if you rely on history, you fail **Swampman** (who has no history).
  **The Trade-off:** A theory that handles Error well (Teleosemantics) often chokes on Novelty/Swampman. A theory that handles Novelty/Swampman well (Structuralism) often chokes on Error.

  **The Killer Constraint**
  **The Error Constraint.** This is the single requirement that excludes the most popular theories. Simple causal/indicator accounts (State means X because X causes State) are intuitively easiest but fail immediately here. If BBs cause the state, the state means BB. Error becomes impossible. Any theory surviving this must add complexity (functions, dependencies, norms).

  **Scorecard**

  *   **Indicator/Causal:** Fails **Error**. If BBs cause the state, the content includes BBs. No false beliefs possible, only different triggers.
  *   **Teleosemantics:** Passes **Error** and **Determinacy** via function. Fails **Novelty/Swampman**. If no history, no function, no content. Your unicorn-thinker thinks nothing.
  *   **Asymmetric Dependence:** Passes **Error** by prioritizing primary causes. Struggles with **Naturalization**. Explains *how* errors differ, but relies on abstract dependency laws that may not be physically grounded.
