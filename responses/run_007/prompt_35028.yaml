  so i'm teaching this third-year module on practical rationality and i've just come back from the pub where i spent two hours going in circles with a mate about kavka's toxin puzzle. he kept saying "just intend to drink it, take the money, then don't" and i could not get him to see that the whole point is you can't just *decide* to intend something when you already know you'll have no reason to follow through. anyway it got me thinking that i want to set an exam question that actually forces students to confront the deep weirdness of the puzzle rather than just summarising what kavka said.

