          *   *(4) says:* In fiduciary contexts, they are *equally* wrong.
          *   *The Conflict:* If the *source* of the extra wrongness in lying is the abuse of assertion (per 2), and misleading *doesn't* abuse assertion in the same way (per 2), how can they become *equally* wrong in (4)? For them to be equally wrong, misleading must acquire the same moral weight as lying.
          *   *Resolution Path:* Does misleading in fiduciary contexts *become* a form of assertion abuse? Or does the duty in fiduciary contexts shift from "don't abuse assertion" to "don't deceive period"? If it's the latter, (2) is incomplete as a general explanation.
