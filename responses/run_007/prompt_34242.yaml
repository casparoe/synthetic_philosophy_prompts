  5.  **Refine the Content (Self-Correction during drafting):**
      *   *Correction:* Make sure not to get too bogged down in specific philosopher's theories unless it helps the point. Keep it focused on the *slogan's* work.
      *   *Nuance:* Ensure the distinction between "is a lie" (definition) and "is as bad as a lie" (morality) is sharp. This is the most common confusion.
