answer: |-
  You have identified a precise and pervasive argumentative maneuver, but you are correct that it lacks a single, canonical name in introductory logic (like *ad hominem* or *straw man*). This is because the move sits at the intersection of cognitive psychology, informal logic, and metaethics.

  While there is no single Latin term for it, the move is best understood as a rhetorical deployment of the **Bias Blind Spot** that functions logically as **Epistemic Special Pleading**. In the specific literature on debunking arguments (metaethics and political philosophy), it is often discussed as a violation of the **Symmetry Constraint**.

  If a precise name is required for the move itself, the most accurate technical designation is **Asymmetric Bias Attribution**.

  Here is the precise carving of the concept, distinguishing it from the related phenomena you mentioned.

  ### 1. The Name and Its Lineage
  The move does not have a settled name like "Modus Ponens" because it is a composite failure. It combines a psychological state with a logical fallacy.
  *   **Psychological Driver:** *The Bias Blind Spot* (the cognitive inability to see one's own biases).
  *   **Logical Structure:** *Special Pleading* (applying a standard to others that one does not apply to oneself).
  *   **Rhetorical Function:** *Circumstantial Ad Hominem* (dismissing a claim by attributing it to the speaker's situation/psychology).

  However, to capture the specific asymmetry of labeling one process "bias" and the identical process "principle," the term **Asymmetric Bias Attribution** is the most descriptively accurate. In metaethical debates regarding evolutionary debunking, Guy Kahane and others refer to the normative rule violated here as the **Symmetry Constraint**; thus, the move is a **Violation of Epistemic Symmetry**.

  ### 2. Distinction from Related Concepts

  You noted that this is near the *Bias Blind Spot*, *Naive Realism*, and *Debunking Arguments*. Here is how **Asymmetric Bias Attribution** is distinct from each:

  **A. Vs. The Bias Blind Spot**
  *   **The Bias Blind Spot** is a *cognitive state*. It is the internal psychological inability to recognize one's own susceptibility to bias. One can have a bias blind spot without ever making an argument (e.g., silently feeling righteous).
  *   **Asymmetric Bias Attribution** is an *argumentative move*. It is the external speech act of labeling the opponent's view as biased while exempting one's own.
  *   *Distinction:* The Blind Spot is the *cause*; Asymmetric Bias Attribution is the *effect*. You can commit the move cynically (knowing you are biased but labeling it principle to win), which means you are not suffering from the Blind Spot, but you are still making the move.

  **B. Vs. Naive Realism**
  *   **Naive Realism** is a *worldview*. It is the conviction that one perceives reality objectively and that those who disagree are distorted by ideology or bias.
  *   **Asymmetric Bias Attribution** is a *tactic*. It is the specific application of labels within a debate.
  *   *Distinction:* Naive Realism explains *why* the arguer believes the asymmetry exists (they genuinely think they see reality). Asymmetric Bias Attribution describes the *structure* of the argument itself, regardless of whether the arguer sincerely believes it or is using it strategically.

  **C. Vs. Ordinary Debunking Arguments**
  *   **A Debunking Argument** posits that a belief is unjustified because it was caused by an unreliable process (e.g., "You believe X because of wishful thinking"). A *valid* debunking argument must provide independent evidence that the process is unreliable.
  *   **Asymmetric Bias Attribution** functions *like* a debunking argument but lacks the *criterion of unreliability*. It asserts the process is "bias" solely because it leads to the opponent's conclusion.
  *   *Distinction:* A debunking argument attempts to trace a causal genealogy to undermine justification. Asymmetric Bias Attribution uses the *label* of genealogy ("that's just bias") as a conversation-stopper without establishing the genealogy's unreliability symmetrically.

  ### 3. Conceptual Carving: The Boundaries of the Move

  To qualify as **Asymmetric Bias Attribution**, the following four conditions must be met. This carving isolates the move from general hypocrisy or simple disagreement.

  **Condition 1: Process Symmetry**
  The two judgments being compared must plausibly arise from the same kind of psychological or sociological process.
  *   *Example:* Both the preference for family and the preference for strangers involve partiality (one to kin, one to humanity). Both the resistance to change and the support for change involve risk assessment and status evaluation.
  *   *Boundary:* If one side offers empirical evidence and the other offers pure intuition, labeling the intuition "bias" is not asymmetric; it is a distinction of kind. The move only occurs when the *processes* are analogous but labeled differently.

  **Condition 2: Label Asymmetry**
  One process is labeled with a pejorative epistemic term ("bias," "distortion," "irrationality"), while the analogous process is labeled with a laudatory epistemic term ("principle," "reason," "intuition," "considered judgment").
  *   *Boundary:* Mere disagreement ("You are wrong") is not this move. The move requires *pathologizing* the opponent's epistemic process while *sanctifying* one's own.

  **Condition 3: Conclusion Tracking**
  The assignment of the labels must track the *conclusion* supported, not the *features* of the reasoning.
  *   *Test:* If the opponent adopted the speaker's conclusion using the same reasoning, would the speaker still call it a bias? If the answer is "no," then the labeling is tracking the conclusion, satisfying this condition.

  **Condition 4: Absence of Independent Criterion**
  The arguer offers no independent standard for distinguishing "bias" from "principle" other than the alignment with their own view.
  *   *Boundary:* If the arguer says, "Your view is bias because it contradicts established data, whereas mine aligns with it," they are offering a criterion. If they say, "Your view is bias because it serves your interests (while ignoring that mine serves mine)," they are committing Asymmetric Bias Attribution.

  ### 4. Why This Distinction Matters

  Identifying this move as **Asymmetric Bias Attribution** (or **Epistemic Special Pleading**) is crucial because it blocks a specific kind of rhetorical immunity.

  In moral philosophy, this move is often used to shield one's own premises from **Genealogical Debunking**. If I argue that your moral intuition is just a product of evolutionary conditioning (bias), I must accept that my moral intuition is also a product of evolutionary conditioning. If I exempt myself, I am violating the **Symmetry Constraint**.

  By naming this move, you can demand the **Symmetry Test**: *"If my view is dismissed as [Bias X] because of its causal origins, what causal origins do you posit for your view, and why do those origins confer justification rather than bias?"*

  ### Summary
  *   **Established Name:** There is no single canonical fallacy name.
  *   **Best Technical Description:** **Epistemic Special Pleading** or **Asymmetric Bias Attribution**.
  *   **Normative Counter-Rule:** The **Symmetry Constraint** (from metaethics/debunking literature).
  *   **Key Distinction:** Unlike the *Bias Blind Spot* (a psychological state), this is a *rhetorical act*. Unlike *Debunking* (an argument about reliability), this is an *assertion of status* without criteria.

  You are describing the weaponization of epistemology to win moral disputes. While "Bias Blind Spot" explains the psychology, **Asymmetric Bias Attribution** names the sword they are swinging.
