answer: |-
  Here is a teaching plan designed for a 45-minute high-impact session.

  ### 1. The Sequence: Narrative Arc over Logical Taxonomy
  **Do not start with definitions.** If you start by defining "Frequentist" and "Bayesian," you will lose the room in 10 minutes. They care about the *Replication Crisis* because it threatens the validity of their work. Start with the pain, then diagnose the cause.

  *   **Minutes 0–5: The Hook (The Crisis).** Briefly state the replication crisis not as a moral failure (fraud), but as a mathematical inevitability given how we currently test hypotheses.
  *   **Minutes 5–15: The Diagnosis (The P-Value Trap).** Introduce the Frequentist logic they currently use. Show that it answers a question they *aren't* asking.
  *   **Minutes 15–30: The Worked Example (The "Voter Nudge").** Run the numbers. This is the core. Show how a "significant" result can still be likely false.
  *   **Minutes 30–40: The Alternative (Bayesian Intuition).** Introduce the Bayesian framework not as a new math, but as a correction to the logic used in the example. Show how it incorporates "plausibility."
  *   **Minutes 40–45: Synthesis & Assessment.** Connect the logic back to daily practice. Ask the final question.

  **Why this order?** You need to create a "knowledge gap." They think they know what $p < .05$ means. You must prove they don't (Minutes 5–15) before they will care about the solution (Minutes 30–40).

  ### 2. The One Worked Example: "The Voter Nudge"
  Do not switch examples. Use one scenario and layer complexity onto it.

  *   **The Scenario:** A field experiment testing if a specific text message nudge increases voter turnout.
  *   **The Setup:**
      *   You run 1,000 hypothetical studies of similar nudges.
      *   **Prior Probability:** Based on past literature, only 10% of these nudges actually work (100 true effects, 900 nulls).
      *   **Power:** Your test has 50% power (typical for social science).
      *   **Alpha:** You use $p < .05$.
  *   **The Calculation (The "Aha!" Moment):**
      *   **True Positives:** Of the 100 real effects, you find 50 (50% power).
      *   **False Positives:** Of the 900 nulls, you find 45 (5% error rate).
      *   **Total "Significant" Findings:** 50 + 45 = 95.
      *   **The Reveal:** Of your 95 published "significant" findings, 45 are false. **Your False Discovery Rate is nearly 50%, not 5%.**
  *   **Why this example?** It uses integers, not probabilities, which reduces cognitive load. It directly links the Replication Crisis (failed replications) to the statistical framework (Frequentist error rates vs. False Discovery Rate). It sets up the Bayesian solution (changing the Prior Probability) perfectly.

  ### 3. Misconception Management

  **Entry Misconceptions (Minutes 0–5)**
  *   *What they think:* "The replication crisis is caused by p-hacking and fraud." / "$p = .05$ means there is a 5% chance I am wrong."
  *   *How to head it off:* In the intro, explicitly state: "We are assuming no fraud and no p-hacking today. This crisis happens even when everyone follows the rules perfectly." When defining the p-value, write the definition on the board: $P(\text{Data} | H_0)$. Circle the $H_0$. Say: "This is the probability of the data given the null, not the probability of the null given the data."

  **Mid-Session Misconceptions (Minutes 20–30)**
  *   *What they think:* "So Frequentism is broken and Bayes is the magic fix." / "Bayesian priors are just made-up numbers that let you prove anything."
  *   *How to head it off:* When introducing the Bayesian view in the "Voter Nudge" example, frame the Prior not as "opinion" but as "base rate from previous literature." Say: "Frequentism assumes every study is the first study ever conducted. Bayesianism forces you to acknowledge what we already know." Defend Frequentism slightly: "Frequentism is great for quality control in manufacturing; it's risky for inference in novel social science."

  **Emergent Misconceptions (Minutes 35–40)**
  *   *What they think:* "I need to learn MCMC/Stan to fix this."
  *   *How to head it off:* Explicitly decouple the *philosophy* from the *computation*. "You can run this logic in your head during a literature review. You don't need new software to think about base rates."

  ### 4. Scope Boundaries: What to Leave Out
  You have 45 minutes. If you touch these, you will fail.

  *   **Do not teach Bayes' Theorem algebra.** Write the formula on the slide for credibility, but do not derive it. Use the "1,000 studies" frequency tree instead.
  *   **Do not discuss MCMC, convergence, or priors distributions.** Flag this as: *"How to compute Bayesian regressions is a different workshop. Today is about how to interpret evidence."*
  *   **Do not get into the 'Subjective vs. Objective' prior war.** Acknowledge it exists, but frame priors as "informative" (based on lit) vs. "uninformative" (starting from scratch).
  *   **Do not offer a checklist for publication.** Do not end with "Therefore, always do X." End with "Therefore, always *ask* X."

  ### 5. The Final Assessment Question
  Do not ask: "What is the definition of a p-value?" (They will Google it or parrot you).
  Do not ask: "Is Bayes better?" (They will just nod).

  **Ask this:**
  > "Imagine you find a $p = 0.04$ for a hypothesis that contradicts established theory (e.g., 'Subliminal messages change voting preference'). Based on today's session, what specific piece of information—other than the p-value—do you need to know before you decide if this finding is worth trusting?"

  **What you are looking for:**
  *   *Bad answer:* "A smaller p-value." / "A larger sample size."
  *   *Good answer:* "I need to know the **prior plausibility**." / "I need to know how many other similar studies failed." / "I need to know the **base rate** of true effects in this field."

  If they answer with **Base Rate** or **Prior Probability**, they understood the connection between the Replication Crisis (too many false positives in low-base-rate fields) and the Bayesian critique (ignoring the prior). If they answer with "Power" or "Sample Size," they missed the philosophical shift and reverted to standard Frequentist fixes.
