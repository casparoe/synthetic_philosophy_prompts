prompt: |-
  I've been roped into giving a 45-minute session at our department's weekly methods seminar. The brief: explain how the replication crisis connects to the frequentist-vs-Bayesian debate, for an audience of working social-science researchers. These are clever people who run regressions every day but have never really been asked to think about what a p-value *is* — they just know p < .05 means publishable. Don't explain the content to me; I need a teaching plan. What has to come first in the sequence and why? What's the one worked example that should carry the whole session? What misconceptions will they walk in with, what new ones will emerge halfway through, and at exactly which points should I head each off? What should I deliberately leave out or flag as 'beyond today's scope'? And what's the one question I should ask at the end to see whether they've actually understood rather than just nodded politely?
reasoning: |-
  Here's a thinking process that leads to the suggested teaching plan:

  1.  **Analyze the Request:**
      *   **Task:** Create a teaching plan for a 45-minute seminar session.
      *   **Topic:** Connecting the replication crisis to the frequentist-vs-Bayesian debate.
      *   **Audience:** Working social science researchers (clever, run regressions daily, pragmatic, p < .05 focused, lack deep philosophical/statistical foundation).
      *   **Constraints:** Do *not* explain the content (i.e., don't write the lecture notes). Focus on *pedagogy* (sequence, examples, misconceptions, scope, assessment).
      *   **Key Questions to Answer:** Sequence logic, one worked example, misconception management (entry/mid-point), scope boundaries, final assessment question.

  2.  **Deconstruct the Audience & Goal:**
      *   *Audience:* They are practitioners, not theorists. They care about "will this get published?" and "is my finding real?" They likely view statistics as a hurdle, not a language. They are tired. 45 minutes is short.
      *   *Goal:* Connect two big, abstract concepts (Replication Crisis, Frequentist/Bayesian) in a way that changes how they interpret their own p-values.
      *   *Tone:* Respectful of their expertise, but challenging their assumptions. No condescension, but no jargon without translation.

  3.  **Determine the Sequence (The "What comes first and why"):**
      *   *Option A:* Define Frequentism -> Define Bayesianism -> Show Replication Crisis -> Connect. (Too dry, loses them early).
      *   *Option B:* Start with the Replication Crisis (pain point) -> Ask "Why?" -> Reveal the Statistical Tool (p-values) -> Show the Flaw (Frequentist interpretation) -> Offer the Alternative (Bayesian intuition) -> Connect back. (Much stronger).
      *   *Decision:* Start with the *consequence* (failed replications) to hook them, then diagnose the *cause* (misinterpretation of p-values), then introduce the *framework shift* (Frequentist vs. Bayesian).
      *   *Logic:* You need to create a "need to know" before providing the "knowledge."

  4.  **Select the One Worked Example:**
      *   *Criteria:* Must be simple, relatable to social science, and highlight the difference between $P(Data|H_0)$ and $P(H_0|Data)$.
      *   *Idea 1:* Drug testing. (Too medical).
      *   *Idea 2:* Coin flipping. (Too abstract).
      *   *Idea 3:* A priming study or a survey finding. (Good, but needs specific numbers).
      *   *Idea 4:* The "Base Rate" problem framed as a finding. E.g., "Does this policy work?"
      *   *Winner:* The "Surprising Correlation" example. Let's use a specific, concrete scenario like "Does listening to Mozart improve test scores?" or "Does this intervention reduce prejudice?"
      *   *Refinement:* Let's go with a **Diagnostic/Test analogy mapped onto a Social Science Finding**. Why? Because it makes the Base Rate Fallacy visceral.
      *   *Specific Choice:* A "Significant Result" in a low-power field (e.g., ESP is the classic, but let's use something social-sciencey like "A new nudge increases voter turnout").
      *   *Actually, better:* Stick to the classic **Medical Test Analogy** but explicitly map it to **Social Science Publishing**.
      *   *Wait, the prompt asks for ONE worked example to carry the whole session.* It needs to be the *same* numbers throughout.
      *   *Selection:* **The "Voter Nudge" Study.**
          *   Scenario: You test a new text message nudge.
          *   Result: $p = 0.04$.
          *   Question: What is the probability the nudge actually works?
          *   This allows us to walk through Frequentist logic (long run error rates) vs. Bayesian logic (probability of hypothesis) and show why the replication crisis happens (low prior probability + p-hacking = high false discovery rate).

  5.  **Map Misconceptions:**
      *   *Entry:* "p-value = probability the null is true." (The classic error). "Replication crisis is just fraud."
      *   *Mid-Session:* "Bayesian = subjective/opinion." "If I use Bayes, I don't need to worry about power." "Priors are just made up numbers."
      *   *Intervention:* Need to stop and clarify definitions *before* moving to the next step.

  6.  **Define Scope (What to leave out):**
      *   MCMC, Stan, JAGS, computational details.
      *   Full derivation of Bayes Theorem.
      *   Specific priors (Jeffreys, etc.).
      *   Multiple comparison corrections (mention, but don't teach).
      *   *Focus:* Interpretation and Inference logic, not computation.

  7.  **Design the Final Assessment Question:**
      *   Needs to test understanding, not memory.
      *   Bad: "What does p < .05 mean?"
      *   Good: "If I lower my alpha, do I increase my PPV?"
      *   Better: A scenario where they have to weigh evidence.
      *   *Best:* A "What would change your mind?" question that forces them to articulate the role of prior plausibility.

  8.  **Drafting the Plan (Iterative refinement):**
      *   *Timing:* 45 mins is tight. 5 min intro, 15 min crisis/p-value link, 15 min Bayesian contrast, 5 min example wrap, 5 min Q&A/Assessment.
      *   *Flow:*
          1.  Hook: The Crisis (it's not fraud, it's math).
          2.  The Culprit: The P-Value (what it is vs. what we want).
          3.  The Example: Voter Nudge (run the numbers).
          4.  The Alternative: Bayesian thinking (incorporating the 'Base Rate').
          5.  Synthesis: How this solves (or mitigates) the crisis.
          6.  Check: The final question.

      *   *Refining the "One Example":* The Voter Nudge is good. Let's make sure the numbers illustrate the *False Positive Risk*.
          *   Assume 1000 studies.
          *   Assume only 10% of hypotheses are true (low prior).
          *   Power = 0.5.
          *   Alpha = 0.05.
          *   Calculate False Discovery Rate. This is the "Aha!" moment.

      *   *Refining Misconceptions:*
          *   *Entry:* "p = prob null is true." -> *Head off:* Define p-value explicitly in minute 10.
          *   *Mid:* "Bayes is subjective." -> *Head off:* Frame priors as "existing literature" not "gut feeling."

      *   *Refining Scope:* Explicitly state "We are not learning how to *run* Bayesian regression today."

      *   *Refining Final Question:* "You find p=.04 on a novel, theoretically unlikely claim. Do you publish? What extra info do you need?"

  9.  **Final Review against Constraints:**
      *   Did I explain the content? No, I'm explaining the *plan*.
      *   Is it 45 mins? Yes, the pacing reflects that.
      *   Is it for social scientists? Yes, examples are social science.
      *   Did I answer all specific sub-questions? (Sequence, Example, Misconceptions, Scope, Final Question).

  10. **Final Polish:** Ensure the tone is authoritative yet supportive. (Self-Correction: Make sure to emphasize *why* the sequence matters—building tension before release).

  *(Self-Correction during drafting)*: I need to be careful not to turn this into a "Bayes Good, Frequentist Bad" sermon. The goal is to connect the debate to the crisis. The crisis is largely a Frequentist misuse problem, but Bayes offers a conceptual fix. I must ensure the plan reflects nuance.

  *(Final Plan Structure)*:
  1.  Sequence Logic (The Narrative Arc).
  2.  The Anchor Example (The Voter Nudge).
  3.  Misconception Management (Entry, Mid, Exit).
  4.  Scope Boundaries (The "Do Not Enter" signs).
  5.  The Assessment Question.

