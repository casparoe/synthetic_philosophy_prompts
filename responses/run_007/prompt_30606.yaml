  ok so i watched this physics video on youtube about boltzmann brains and the guy basically said: according to thermodynamics, if the universe keeps going forever and ends up in heat death, particles will still randomly bump around. given insane amounts of time those random bumps will occasionally form complex stuff, and eventually one of those random arrangements will be an exact copy of your brain with all your memories intact, including the memory of watching the video. and since there would be way more of these random brains floating around in the void than real brains that evolved on planets, you are almost certainly a boltzmann brain right now. he called it "basically a scientific version of descartes' evil demon" and said physics has shown we can't trust our own memories.

  but i thought the boltzmann brain thing was supposed to be a problem for certain cosmology theories — like a reductio ad absurdum — not something physicists actually believe is true about us? and the descartes comparison feels like it misses somthing important. can you go through this summary and tell me what's accurate, what's misleading, and what's just wrong?
