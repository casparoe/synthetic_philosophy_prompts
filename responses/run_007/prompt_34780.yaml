  # JOINT STATEMENT ON THE NATURE OF LAW AND ADJUDICATION
  **Signed by:** A. Conscientious Positivist & B. Conscientious Natural Law Theorist
  **Date:** October 26, 2023
  **Subject:** Outcomes of the Year-Long Adversarial Collaboration on the Hart–Fuller Debate

  After twelve months of structured dialogue, textual analysis, and hypothetical testing, we issue this statement to record our convergence, clarify our remaining divergences, and map the path for future inquiry. We affirm that while our metaphysical accounts of law differ, our commitment to the Rule of Law and human dignity is shared.

  ### I. Substantive Areas of Agreement

  We reject the caricature that positivism entails moral indifference or that natural law theory entails judicial anarchy. We jointly affirm the following substantive claims:

  1.  **The Nazi System and the Grudge Informer:**
      Regarding the "grudge informer" cases of the Nazi era, we agree that the individuals who utilized the Nazi statutes to persecute others committed profound moral wrongs and should be held accountable. We agree that post-war courts faced a genuine dilemma between the principles of *nullum crimen sine lege* (no crime without law) and substantive justice. We further agree that describing the Nazi regime as a "legal system" does not entail moral approval, nor does denying it the label "law" automatically solve the jurisprudential problem of retroactive punishment. The label assigned to the Nazi statutes does not determine the moral obligation of the judge; the moral obligation exists independently of the label.

  2.  **Adjudication in Hard Cases:**
      We agree that in "hard cases" (where statutory text and precedent are indeterminate), mechanical jurisprudence is impossible. Judges cannot decide solely by identifying a pre-existing social fact. In such instances, legal reasoning necessarily incorporates normative considerations, principles of fairness, and appeals to the purpose of the legal enterprise. We agree that a judge who ignores the moral consequences of a decision in a hard case is failing in their judicial duty, regardless of whether that duty is framed as "discretion" or "interpretation."

  3.  **The Conceptual Role of "Law" in Practical Reasoning:**
      We agree that the concept of "law" is not merely a taxonomic label for sociologists; it plays a distinct role in practical reasoning. To identify a norm as "law" is to acknowledge that it makes a claim to authority and generates a *prima facie* obligation for citizens and officials. We agree that this obligation is not absolute; it can be overridden by competing moral demands. However, we agree that the existence of a legal norm changes the deliberative landscape for the agent, distinguishing it from a mere command backed by threats.

  4.  **The Internal Morality of Procedure:**
      We agree that a system of governance that consistently fails basic procedural requirements (e.g., secret laws, retroactive legislation, contradictory rules, impossible demands) cannot effectively guide human conduct. We agree that such a system is practically defective as a mechanism for social ordering. Whether this defect renders the system "not law" or merely "bad law" is our remaining dispute, but we agree on the functional consequence: such a system forfeits the moral claim to fidelity that law typically commands.

  ### II. Residual Disagreements

  The following table outlines our remaining disagreements. We have phrased these positions to ensure that each signer accepts the wording of their own column without conceding the other's premises.

  | Issue | Positivist Characterization | Natural Law Characterization |
  | :--- | :--- | :--- |
  | **1. Conditions of Legal Validity** | Moral merit is not a *necessary condition* for a norm to be identified as legally valid. A norm can be legally valid solely in virtue of its source (e.g., enactment by a sovereign), even if it is substantively wicked. | There is a *threshold of moral defectiveness* (substantive or procedural) beyond which a norm loses its legal character. Extreme injustice or failure of the "internal morality" negates legal validity, not just moral bindingness. |
  | **2. The Continuity of Law** | Legal systems can survive radical moral corruption. The Nazi system was a legal system, albeit a wicked one. Acknowledging this preserves the distinction between "what law is" and "what law ought to be." | Legal systems require a minimum fidelity to the enterprise of subjecting human conduct to rules. The Nazi regime was a perversion of legality, not a legal system. Calling it "law" obscures the break in fidelity. |
  | **3. Judicial Reasoning in Gaps** | When valid legal rules run out, judges exercise **strong discretion**. They create new law based on policy or morality, acting as a deputy legislature. This is an extra-legal moral choice. | When rules appear to run out, judges engage in **interpretive discovery**. They seek the principle that best fits the purpose of the legal order. They are finding the "right answer" implicit in the law's integrity, not making new law. |

  ### III. Cruxes, Tests, and Predictions

  For each disagreement above, we have identified the underlying crux (the sub-question that drives the divergence). We have also agreed upon concrete tests or cases that bear on these cruxes and recorded our divergent predictions.

  | Disagreement | Underlying Crux | Concrete Test / Case | Positivist Prediction | Natural Law Prediction |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. Validity Conditions** | **The Separation Question:** Is the identification of law a matter of *social fact* alone, or does it depend on *functional success* in achieving moral goods? | **The "Benevolent Dictator" Hypothetical:** A regime enacts clear, prospective, public rules that are procedurally perfect but mandate a substantively trivial evil (e.g., forcing all citizens to wear a specific color under penalty of death). | The norms are **legally valid**. The moral outrage is separate from the legal status. The citizen has a legal obligation but a overriding moral right to resist. | The norms **lack legal validity**. The substantive iniquity violates the purpose of law (human flourishing). The "obligation" is merely coercive force, not legal authority. |
  | **2. Continuity of Law** | **The Function of the Label:** Does calling a wicked system "law" dangerously legitimize it, or does calling it "law" honestly expose the moral danger of legal validity? | **Historical Analysis of the Radbruch Formula:** Analyze the German Federal Constitutional Court's reasoning in the 1950s regarding Nazi statutes. Did the court rely on the idea that the statutes were *never law*, or that they were *law but overridden*? | The Court effectively applied a **retroactive moral override**. They admitted the statutes were law but chose justice over legality. Honesty requires admitting this retroactivity. | The Court recognized the **absence of law**. The statutes were so unjust they never attained legal character. No retroactivity is involved; the court is declaring a pre-existing nullity. |
  | **3. Judicial Reasoning** | **The Existence of Right Answers:** In hard cases, is there a single legally correct outcome discoverable through reason, or is the choice ultimately underdetermined by law? | **The "Riggs v. Palmer" Test:** A murderer seeks to inherit from his victim. The statute says wills must be honored. No exception is written. | The judge exercises **discretion**. The law runs out. The judge creates a new exception based on the moral principle "no one should profit from wrong." | The judge discovers the **implicit principle**. The law includes not just rules but principles. The correct legal outcome is that the murderer does not inherit; this was always the law. |

  ### IV. Clarifications on Verbal Disputes

  During our collaboration, we discovered that a significant portion of our debate was verbal rather than substantive. We record these clarifications below:

  **1. The Definition of "Law"**
  *   **Clarification:** We acknowledge that the Positivist uses "law" primarily as a **descriptive/sociological category** (a system of primary and secondary rules recognized by officials). The Natural Lawyer uses "law" primarily as a **normative/functional category** (a successful enterprise of governance guiding conduct).
  *   **Joint Acceptance:** Once this distinction is made, we agree that a Nazi statute fits the Positivist definition (it was recognized by officials) but fails the Natural Law definition (it failed to guide conduct faithfully and violated the purpose of law). We agree to stop arguing over which definition is "true" and instead argue over which definition is more **fruitful** for protecting human rights and analyzing judicial duty.

  **2. The Meaning of "Obligation"**
  *   **Clarification:** We acknowledge that the Positivist often speaks of "legal obligation" as a statement of probability (likelihood of sanction) or systemic validity, whereas the Natural Lawyer speaks of "legal obligation" as a species of moral obligation.
  *   **Joint Acceptance:** We agree that citizens often face a conflict between "obligation according to the system's rules" and "moral obligation." We agree to distinguish these as **Systemic Validity** (Positivist focus) and **Moral Bindingness** (Natural Law focus). We agree that a norm can possess Systemic Validity while lacking Moral Bindingness.

  **3. The Role of Discretion**
  *   **Clarification:** We found we disagree on the *scope* of discretion, not its existence.
  *   **Joint Acceptance:** We agree that judges never have *unfettered* discretion (they are bound by institutional history). We agree that judges sometimes have *normative* discretion (they must choose between competing moral principles). The dispute is merely whether that choice is framed as "making law" or "interpreting the whole."

  ### V. Conclusion

  We conclude that the Hart–Fuller debate is not a binary choice between "cynicism" and "idealism." It is a tension between **clarity of identification** (Positivism) and **fidelity to purpose** (Natural Law). Both are necessary for a healthy jurisprudence. We commit to teaching and practicing law in a way that honors the Positivist warning against conflating power with right, and the Natural Law warning against conflating legality with justice.

  ***

  **Signed:**

  _________________________
  *Conscientious Legal Positivist*

  _________________________
  *Conscientious Natural Law Theorist*
