  **(Self-Correction during drafting):** I need to make sure I don't just say "Lewis said X." I need to explain *why* it resolves the logical tension. The key is that Humeanism is a reductionist project. Laws reduce to Mosaic + Standards. If Standards are part of the reduction base, they aren't "spooky." They are just facts about human cognition, which are themselves part of the Humean mosaic (patterns of neurons).

