      *   However, if the weighting is fixed *by the world* (as step 3 says), Step 4 claims that's non-Humean.
      *   Correction: The weighting isn't fixed *by the world* alone. It's fixed by the world + the standards of systematization. The standards aren't "in the world" as extra entities; they are conditions of the analysis.

  7.  **Structure of the Response:**
      *   **Intro:** Validate the argument (it's the "Problem of Standards").
      *   **Diagnose Step (4):** The category error. Standards aren't ontological additions.
      *   **Diagnose Step (5):** The Robustness Argument (The "JPEG" defense).
