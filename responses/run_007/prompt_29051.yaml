answer: |-
  This is one of the most enduring puzzles in legal philosophy, often referred to as the **Act/Omission Distinction**. Your intuition is sharp: the physical facts remain constant while the legal status of "causation" shifts based on the normative relationship (duty) between the parties.

  To answer your question directly: The law does not explicitly commit to a single metaphysical theory of causation. However, if we reconstruct the logic of the doctrine, it operates **officially** according to your third option (Counterfactual + Liability Filter), but it functions **practically** in a way that aligns closer to your second option (Normative Causation). Your first option (Fictionalism) is a view held by some critics of the law, but rarely by the law itself.

  Here is a breakdown of how these theories map onto the legal practice, where the consensus lies, and where the internal tensions exist.

  ### 1. The Orthodox Doctrinal View: Counterfactual + Liability Filter
  **Theory:** Causation is a purely factual, counterfactual inquiry (the "but-for" test). The duty of care is a separate, normative prerequisite for liability that acts as a filter *before* or *alongside* causation.

  **How the law uses it:**
  In English criminal law textbooks and jury instructions, the analysis is typically sequential:
  1.  **Actus Reus:** Did the defendant act or omit to act?
  2.  **Duty:** If an omission, was there a legal duty to act?
  3.  **Causation:** Did that act/omission cause the result?

  Under this view, in your "no duty" pool scenario, the law does not necessarily say you *factually* didn't cause the death. It says that because there is no duty, your omission cannot form the basis of criminal liability. The "causation" inquiry is often short-circuited. If there is no duty, the omission is legally invisible.

  **Status in Scholarship:**
  This is the **dominant doctrinal explanation**. It preserves the intuitive idea that causation is about "what happened in the world" (factual) while keeping "what we blame people for" (normative) separate. H.L.A. Hart and Tony Honoré, in their seminal work *Causation in the Law* (1959/1985), largely defended a version of this, arguing that while common sense selects causes based on interventions, the legal restriction on omissions is a matter of principle and policy, not metaphysics.

  **The Problem:**
  As you noted, this creates a linguistic awkwardness. If the "but-for" test is met in both cases (if you had thrown the ring, they would have lived), then factual causation exists in both. If the law says you "caused" the death in one instance but not the other, it implies that "legal causation" is not purely factual.

  ### 2. The Normative View: Causation is Partly Normative
  **Theory:** Whether something counts as a "cause" in law depends inherently on normative expectations. An omission is only a cause if the person *ought* to have acted.

  **How the law uses it:**
  Many judges and theorists argue that the duty requirement isn't just a filter for liability; it determines whether the omission is cognizable as a cause *at all*. In *R v Miller* (1983), the House of Lords suggested that once a duty arises, the failure to act is treated as the cause of the harm. This suggests that the normative duty *constitutes* the causal link rather than merely permitting liability for a pre-existing causal link.

  **Status in Scholarship:**
  This is **highly contested but influential**. Professor Jane Stapleton is a leading proponent of the view that "causation" in law is largely a normative construct used to limit liability. She argues that the law uses causal language to mask policy decisions. If you adopt this view, there is no inconsistency in your pool example: causation *is* dependent on duty, so the change in causal status is coherent.

  However, many retributivist philosophers (like Michael Moore) strongly reject this. They argue that causation must be a metaphysical reality independent of norms; otherwise, we are punishing people for "causing" things they didn't physically cause, which violates principles of justice. There is **no consensus** here.

  ### 3. The Fictionalist View: Omissions Aren't Causes
  **Theory:** Omissions are metaphysically "nothing," and "nothing" cannot cause "something." The law knows this but punishes omissions anyway for policy reasons, using causal language as a fiction.

  **How the law uses it:**
  The law rarely admits this explicitly. Courts generally speak as if omissions *do* cause results (e.g., "his failure to feed the child caused her death"). However, some judgments hint at this. In *R v Dytham* (1979), regarding a police officer failing to intervene in a beating, the court focused heavily on the breach of duty rather than the physical mechanics of the death.

  **Status in Scholarship:**
  This is a **minority view** in modern legal theory. While some metaphysicians argue omissions cannot be causes, most legal theorists find "fictionalism" unsatisfying because it suggests the law is lying about its own reasoning. It is more common to find this view among external critics of the law than among those describing its internal logic.

  ### Internal Consistency: Where the Practice Clashes
  You asked if the practice is internally consistent. The short answer is **no**, or at least, it is notoriously unstable. The law struggles to maintain a consistent theory of omission causation in three key areas:

  **1. Medical Law (Acts vs. Omissions)**
  The distinction collapses in end-of-life care. In *Airedale NHS Trust v Bland* (1993), the House of Lords ruled that turning off a life-support machine (physically an act) was legally an omission (withdrawing treatment).
  *   **The Clash:** If I turn off the switch, I physically cause the death. But the law treats this as "letting nature take its course" (an omission) because the doctors have no duty to continue futile treatment.
  *   **Theoretical Implication:** This suggests the law is not looking at physical causation at all, but purely at the normative duty. This supports the **Normative View (Theory 2)** but contradicts the **Orthodox View (Theory 3)** which tries to keep acts and omissions distinct based on physical movement.

  **2. The "Creation of Danger" Doctrine**
  In *R v Miller* (1983), a squatter accidentally started a fire, woke up, saw it burning, and went back to sleep. He was convicted of arson.
  *   **The Clash:** His initial act was accidental (no mens rea). His subsequent omission (not putting it out) caused the damage. The court ruled that by creating the dangerous situation, he incurred a duty to rectify it.
  *   **Theoretical Implication:** This bridges the act/omission gap. It suggests that a prior act can transform a subsequent omission into a cause. This creates inconsistency: Why does the prior act matter for *causation*? Physically, the fire burned the house regardless of who started it. This again points toward a **Normative** understanding of causation that clashes with a purely **Counterfactual** one.

  **3. Statutory vs. Common Law Duties**
  Some statutes impose general duties to act (e.g., reporting certain crimes, or tax filings), while common law maintains the "no duty to rescue" rule.
  *   **The Clash:** In statutory cases, the omission is automatically a cause of the prohibited state (e.g., "failure to file"). In common law manslaughter, the omission must be "grossly negligent" and causally linked to death. The threshold for what counts as a "causal omission" shifts depending on the source of the duty, suggesting the concept of causation is being stretched to fit policy goals.

  ### Conclusion: What the Law Presupposes
  If forced to identify what the practice *presupposes*, it is best described as **Pragmatic Normativism disguised as Orthodoxy.**

  1.  **Officially:** The law claims to follow the **Counterfactual + Liability Filter** model. It tells juries to determine facts first, then apply legal duties. This maintains the appearance of objective justice.
  2.  **Functionally:** The law operates on the **Normative Causation** model. The existence of a duty is what allows the omission to be selected as the "cause" from the infinite background conditions of the universe. Without the duty, the omission is treated as mere background noise.
  3.  **Consensus:** There is **no settled consensus** among legal philosophers on whether this is justified.
      *   **Retributivists** worry that treating omissions as causes dilutes the requirement of physical agency.
      *   **Utilitarians/Policy Scholars** argue the distinction is necessary to prevent over-criminalization (e.g., we don't want everyone liable for every starvation they could have prevented).
      *   **Metaphysicians** remain divided on whether omissions can ever be causes, regardless of the law.

  The practice is **not internally consistent** if you demand a single metaphysical theory of causation. It is only consistent if you accept that "causation" in law is not a metaphysical concept, but a tool for assigning responsibility. The law changes the definition of "cause" depending on whether it wants to impose liability, which is exactly what your pool example highlights.

  **Summary:** The law pretends to use Theory 3 (Counterfactual + Filter) to maintain legitimacy, but it relies on Theory 2 (Normative) to reach its results. The inconsistency you spot is widely acknowledged in legal theory as the "Act/Omission Paradox," and it remains unresolved because the law prioritizes policy outcomes over metaphysical coherence.
