          *   **Verdict:** Partially Fair. This is the core of the "cluelessness" objection (associated with Lenman, Greco, etc.). We *are* epistemically limited regarding the far future. However, "never know *any* consequences" is too strong; we know *some* proximate consequences.
      *   *Point 3: Therefore, consequentialism demands the impossible.*
