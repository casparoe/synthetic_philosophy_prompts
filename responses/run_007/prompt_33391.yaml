answer: |-
  Your friend has stumbled upon a genuine and lively debate in contemporary moral philosophy, but his conclusion relies on a series of conflations that most ethicists would reject. The objection he is describing is known as the problem of **'consequentialist cluelessness'**, most notably articulated by philosophers such as James Lenman and Hilary Greco.

  While the core worry is respected within the discipline, your friend's summary moves from a plausible epistemic limitation to an unjustified practical conclusion. Here is a breakdown of what a philosopher would recognise as fair, and where the argument falls apart.

  ### 1. The Kernel of Truth: The Epistemic Problem
  Your friend is correct that consequentialism faces a serious challenge regarding knowledge. If the rightness of an action depends entirely on its actual outcome, and the causal chain of events extends indefinitely into the future (the 'ripple effect'), then human beings are indeed epistemically limited. We cannot know if saving a child today prevents a future tyranny or enables one.

  This is the fair part of his summary. Philosophers acknowledge that we are 'clueless' about the long-term, indirect consequences of our actions. If consequentialism required **omniscience**, it would indeed be a useless guide.

  ### 2. The Misrepresentation: Objective vs. Subjective Consequentialism
  The critical error in your friend's argument lies in conflating **Objective Consequentialism** with **Subjective (or Expectable) Consequentialism**.

  *   **Objective Consequentialism** holds that an act is right if it *actually* produces the best outcome. Your friend attacks this version. He is right that this version demands the impossible, as it requires knowledge we cannot possess.
  *   **Subjective Consequentialism**, which is the dominant view amongst contemporary defenders, holds that an act is right if it is expected to produce the best outcome, based on the evidence available to the agent at the time.

  Philosophers do not generally argue that you must *know* the future; rather, you must act to maximise **expected utility**. If you donate to a reputable charity, the *probability* of doing good is high, even if the *certainty* is low. Consequentialism does not demand the impossible; it demands that you make the most rational bet you can with the information you have. To claim otherwise is to attack a straw man.

  ### 3. The Overstatement: Practical Nihilism
  Your friend claims this leads to 'practical nihilism', where no choice can be shown to be better than another. This does not follow.

  Even if we are clueless about the distant future (100 years hence), we are not clueless about the proximate future (the next 24 hours). We can reasonably predict that feeding a starving person will alleviate their suffering now, whilst withholding food will exacerbate it. Unless one argues that the remote, unknowable consequences completely swamp the immediate, knowable ones (a claim that is difficult to substantiate), we can still rank actions.

  Most consequentialists argue that whilst we are clueless about the *infinite* horizon, we are not clueless about the *relevant* horizon. Therefore, the theory does not collapse into nihilism; it simply becomes a guide for managing risk and probability rather than guaranteeing outcomes.

  ### 4. The False Claim: Abandonment of the View
  The final claim — that most consequentialists have quietly abandoned the view and become deontologists — is empirically false and represents a significant exaggeration.

  While the 'cluelessness' objection has forced consequentialists to refine their theories (for instance, by adopting **Rule Consequentialism** or focusing on **Expected Value**), it has not caused a mass exodus to deontology. In fact, consequentialist frameworks are currently enjoying a resurgence, particularly within the **Effective Altruism** movement, which applies consequentialist reasoning to charitable giving and policy.

  If your friend's conclusion were true, we would see a decline in consequentialist literature and advocacy. Instead, we see a robust industry of work dedicated to solving the very problem he described. Philosophers treat cluelessness as a technical hurdle to be overcome, not a refutation that forces surrender.

  ### Summary
  To summarise the position in a way that might help you articulate your reply:

  1.  **Fair:** We cannot know the infinite ripple effects of our actions (the cluelessness objection is real).
  2.  **Unfair:** Consequentialism requires us to know these effects (it actually requires us to maximise *expected* value based on available evidence).
  3.  **False:** This makes action impossible (we can still compare the probable near-term outcomes of different choices).
  4.  **False:** Consequentialists have abandoned the theory (the tradition remains vibrant and adaptive).

  Your friend has correctly identified a tension, but he has mistaken a complication for a refutation. Consequentialism does not require a crystal ball; it requires a calculator.
