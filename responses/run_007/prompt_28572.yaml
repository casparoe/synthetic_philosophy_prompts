answer: |-
  **1. The Meditating Monk**
  Neuroscientists scan the brain of a Tibetan monk during deep prayer. The scans show intense activity in regions associated with focus and emotional regulation, identical to patterns seen during certain drug-induced states. What does this tell us about the prayer?
  A. It confirms the experience is generated entirely by the brain's chemistry.
  B. It shows the physical mechanism, but doesn't prove or disprove a spiritual connection.
  C. It's useful data for understanding the function of prayer, regardless of whether a deity exists.
  D. It measures the vessel, but misses the content of the experience entirely.

  **2. The Moral Child**
  Studies show that children across vastly different cultures and religious backgrounds develop similar intuitions about fairness and harm before age five. What is the best explanation?
  A. These are evolutionary adaptations for group survival.
  B. It suggests a universal moral law that different cultures access in similar ways.
  C. It demonstrates how humans construct social norms, independent of truth.
  D. It reflects a divine imprint on human nature that biology alone can't explain.

  **3. The Impossible Recovery**
  A patient with a terminal diagnosis is prayed for by a community. Against all medical odds, they recover fully. Doctors call it a statistical anomaly. What happened?
  A. It was a random fluctuation; prayer had no causal effect.
  B. It could be coincidence, or it could be an intervention using natural processes.
  C. The recovery is real, but linking it to prayer is a subjective narrative choice.
  D. The medical explanation captures the "how" but misses the "why" of the healing.

  **4. The Changing God**
  Historical records show that concepts of God change over centuries, often mirroring the political structures of the societies worshipping them (e.g., tribal chiefs vs. cosmic kings). What does this imply?
  A. Humans are projecting their social structures onto an empty sky.
  B. Human understanding of the divine evolves as cultures mature.
  C. It shows how religious ideas adapt to social environments.
  D. It shows the limitations of human language, not the absence of divine reality.

  **5. The Secular Society**
  Scandinavian countries have low rates of religious belief but high rates of social trust, health, and stability. What does this suggest about religion's function?
  A. Religion is an obsolete technology that societies eventually outgrow.
  B. Societies can access moral cohesion through different means, religious or otherwise.
  C. It proves religious belief isn't necessary for social function, whatever the truth claims.
  D. They have material comfort but lack the spiritual depth religion provides.

  **6. The Psychedelic Experience**
  A person takes psilocybin mushrooms and reports a profound encounter with a "divine presence" that changes their life permanently, indistinguishable from a religious conversion. What was this?
  A. A chemical trick that mimics religious experience without the substance.
  B. A chemical key that unlocked a spiritual door that was already there.
  C. A psychological event with real effects, regardless of the source.
  D. A counterfeit experience that lacks the authority of genuine revelation.

  **7. The Ritual Act**
  A group burns incense during worship. Sociologists say this synchronizes breathing and creates group bonding. Believers say it purifies the spiritual atmosphere. Are these compatible?
  A. No, the sociological explanation replaces the spiritual one.
  B. Yes, the physical act can serve both social and spiritual purposes.
  C. Yes, we can study the social effect without judging the spiritual claim.
  D. No, the spiritual effect is the primary reality; the social benefit is secondary.

  **8. The Sudden Conversion**
  A lifelong skeptic suddenly becomes devout after a single event, describing it as being "grasped by something outside themselves." Psychologists suggest a latent psychological break. Who is right?
  A. The psychologists; it was an internal restructuring of identity.
  B. Both; the psychological state may have been the medium for the encounter.
  C. Both describe the same phenomenon from different disciplinary angles.
  D. The believer; psychological reductionism cannot account for the change in orientation.

  **9. The Problem of Pain**
  A devout person suffers a tragic loss. They say it was a "test of faith." A naturalist says it was "random bad luck." Can both be true?
  A. No, randomness rules out purposeful testing.
  B. Yes, random events can be used by a deity for spiritual purposes.
  C. Yes, "test" and "luck" are just different narratives for the same event.
  D. No, calling it luck misses the spiritual significance of the suffering.

  **10. The Artificial Believer**
  In the future, an AI is programmed to pray, report religious experiences, and build communities. Would this be genuine religion?
  A. No, it's just code simulating behavior without biology or soul.
  B. Maybe, if consciousness emerges, the capacity for transcendence might too.
  C. It depends on whether the AI functions socially like a religious group.
  D. No, religion requires a relationship with the divine, not just simulation.

  ***

  ### Scoring Key

  Tally your answers (A, B, C, or D). Find the letter you selected most often. If you have a mix, look at the "Mixed Results" section.

  **Mostly A: Position 1 (Strict Naturalism)**
  You view religion as entirely a natural phenomenon. Religious beliefs, experiences, and institutions are products of evolution, psychology, and sociology. There is no supernatural ingredient required to explain why religion exists or what it does. If brain chemistry changes, the religion changes.

  **Mostly B: Position 2 (Compatibilism)**
  You believe religion has natural origins and functions, but that doesn't rule out the possibility that it connects to something real beyond the natural. Natural mechanisms (brains, societies) might be the vehicles or tools used by a supernatural reality. Science explains the *how*, but not necessarily the *who* or *why*.

  **Mostly C: Position 3 (Methodological Agnosticism)**
  You believe we can study religion's natural dimensions just fine without ever taking a position on whether the beliefs are true. The two projects are separate. Whether God exists is irrelevant to understanding how prayer affects blood pressure or how ritual builds community. You bracket the truth question to study the function.

  **Mostly D: Position 4 or 5 (Supernatural Priority)**
  You believe natural explanations are insufficient. You likely lean toward either **Position 4** (Natural explanations capture surface-level stuff but miss the actual supernatural core) or **Position 5** (Natural explanations are a category mistake).
  *   *To distinguish 4 from 5:* Look at Questions 1, 6, and 10.
      *   If you chose D because the natural explanation was *incomplete* (e.g., "misses the content," "secondary"), you are **Position 4**.
      *   If you chose D because the natural explanation was *irrelevant or wrong-headed* (e.g., "counterfeit," "requires a soul," "misses the significance"), you are **Position 5**.

  **Mixed Results**
  *   **A and C Mix:** You are likely a Naturalist (1) who appreciates the methodological separation (3), or vice versa. You agree on the ontology (it's all natural) but differ on whether we should pretend otherwise for study.
  *   **B and D Mix:** You are likely a Compatibilist (2) who feels strongly about the supernatural core (4/5). The line between "maybe connected" and "misses the core" is thin for you.
  *   **A and D Mix:** This is a logically tense combination (see "Empty Combinations" below). You may be oscillating between strict naturalism and strong supernaturalism depending on the scenario.

  ***

  ### Analysis of Positions and Combinations

  **Empty or Unstable Combinations**
  The combination of **Position 1 (Strict Naturalism)** and **Position 5 (Supernatural Essentialism)** is logically incoherent. Position 1 asserts that religion is *entirely* natural. Position 5 asserts that natural explanations are a *category mistake* because religion is *primarily* divine. A person who scores heavily on both A and D is holding two contradictory ontologies: one that says "nothing supernatural exists" and one that says "natural explanations fail because the supernatural is the main point." This usually indicates a respondent who hasn't stabilized their view or is answering based on emotional resonance with specific questions rather than a consistent framework.

  **Indistinguishable Positions**
  I am least confident in the quiz's ability to consistently separate **Position 4** (Natural explains surface, misses core) and **Position 5** (Natural is a category mistake). In practice, these views often converge on the same answers (Option D). The distinction is philosophical nuance: Position 4 grants natural science some validity regarding the "shell" of religion, while Position 5 rejects natural science's jurisdiction entirely. In a quiz format, respondents who hold either view will likely reject natural reductionism with equal vigor. Distinguishing them requires follow-up conversation about whether biology is *wrong* or just *incomplete*.

  **Confidence Level**
  I am **85% confident** in the mapping of A, B, and C to Positions 1, 2, and 3. These positions are ontologically and methodologically distinct enough that concrete scenarios force a choice.
  I am **50% confident** in the separation of Positions 4 and 5. As noted above, the "category mistake" vs. "incomplete explanation" distinction is subtle and often collapses under the pressure of multiple-choice options. Most respondents clustering in D will simply identify as "Supernaturalist" without caring about the specific philosophical limitation of naturalism.

  **Least Sure Part**
  The **differentiation logic in the Scoring Key for Position 4 vs. 5** is the weakest link. Relying on specific questions (1, 6, 10) to split these two views assumes respondents are sensitive to the wording differences between "misses the content" (4) and "counterfeit/wrong category" (5). In a live discussion, people often use these phrases interchangeably. A respondent might select D on Q1 because they feel biology misses the core (Pos 4) but select D on Q6 because they feel chemicals are category errors (Pos 5), resulting in a mixed signal that the scoring key struggles to resolve cleanly.
