answer: |-
  The methodological principle that captures your intuitions is best described as **The Principle of Empirical Constraint**.

  While evolutionary psychology (EP) is often criticized for producing "just-so stories," rigorous practitioners adhere to specific standards to avoid this. Your verdicts align with a framework that demands evolutionary hypotheses be treated as scientific claims subject to the same risks as any other. This principle can be stated precisely as follows:

  ### The Principle of Empirical Constraint

  An evolutionary psychological claim is methodologically sound only if it satisfies three conditions:

  1.  **Robust Phenomenon:** The behavioral or cognitive pattern being explained must be empirically established and replicable, independent of the evolutionary hypothesis itself.
  2.  **Differential Prediction:** The evolutionary hypothesis must generate specific predictions that distinguish it from competing proximate (e.g., learning, cultural, general cognitive) explanations. It cannot merely accommodate data that other models also explain.
  3.  **Falsifiability:** The claim must specify conditions under which it would be proven false. It cannot be formulated so flexibly that it explains both the presence and absence of a trait.

  This principle prioritizes **independent testability** over narrative elegance. It acknowledges that while a trait may have an evolutionary history, asserting it is an *adaptation* requires evidence that natural selection specifically shaped it for that function, rather than it being a byproduct of other processes.

  ---

  ### Application to Your Verdicts

  Here is how the Principle of Empirical Constraint handles the six cases you provided:

  **1. Snake and Spider Fears (Accepted)**
  *   **Analysis:** This claim satisfies all three conditions. The phenomenon (fear conditioning) is robustly documented in laboratory settings. It offers a differential prediction: humans should condition faster to ancestral threats than to modern threats (guns/outlets), even if the modern threats are objectively more dangerous. It is falsifiable: if subjects conditioned faster to guns, the hypothesis would fail.
  *   **Verdict:** **Accommodated.** Your acceptance is methodologically sound.

  **2. Savanna Landscape Preference (Rejected)**
  *   **Analysis:** This claim fails on Differential Prediction and Falsifiability. The "ancestral environment" is defined too vaguely to generate a specific prediction (e.g., does "savanna" include woodlands? Water features?). The data are mixed, meaning the phenomenon itself is not robustly established across contexts. Because the hypothesis can be adjusted to fit various landscape preferences post-hoc, it lacks empirical risk.
  *   **Verdict:** **Accommodated.** Your rejection correctly identifies a lack of constraint.

  **3. Stepparent Harm / Cinderella Effect (Accepted with Reservation)**
  *   **Analysis:** The phenomenon (higher abuse rates by stepparents) is robust (Condition 1). The evolutionary hypothesis (discriminative parental solicitude based on genetic relatedness) makes a differential prediction compared to a null model of random abuse. However, your reservation touches on a key methodological nuance: a statistical pattern consistent with evolution does not prove the *psychological mechanism* is evolutionary. Proximate factors (e.g., lack of bonding time, social stress) could produce the same pattern without a specific "stepparent detection" adaptation.
  *   **Verdict:** **Accommodated.** The principle supports accepting the data while remaining agnostic about whether the *mechanism* is a specific adaptation or a byproduct of general parental psychology interacting with social circumstances.

  **4. Male Sexual Jealousy (Torn)**
  *   **Analysis:** This claim struggles with Differential Prediction. While the logic (paternity uncertainty) is elegant, the evidence relies heavily on self-report (weak robustness) and shows significant cross-cultural variation. If cultural norms can explain the variation, the evolutionary claim loses its differential edge. It risks being unfalsifiable if proponents argue that cultural variation is simply "modulating" the underlying mechanism without specifying how.
  *   **Verdict:** **Accommodated.** Your "torn" status is the correct methodological stance. The claim currently lacks the empirical constraint to be definitive.

  **5. Cheater Detection / Wason Task (Accepted with Nuance)**
  *   **Analysis:** The phenomenon (improved performance on social contract rules) is robust. However, the claim of a *dedicated module* fails the Differential Prediction test if general deontic (rule-based) reasoning produces the same results. If people solve "library rule" violations as well as "cheater" violations, the "cheater module" is unnecessary.
  *   **Verdict:** **Accommodated.** Your distinction between a "specialization" (a bias in reasoning) and a "dedicated module" (a specific cognitive organ) aligns with the principle. The data support the former more strongly than the latter.

  **6. Depression as Adaptation (Rejected)**
  *   **Analysis:** This claim fails Falsifiability (Condition 3). If depression is argued to serve "analytical rumination," but the absence of rumination is explained as "severity overload," the hypothesis accommodates all outcomes. It does not risk being wrong.
  *   **Verdict:** **Accommodated.** Your rejection is correct; without specific constraints on when the adaptation should *fail*, the claim is non-scientific.

  ---

  ### Consistency Check: Should Any Verdicts Change?

  **None of your verdicts need to change.**

  The Principle of Empirical Constraint accommodates all six of your positions. In fact, your intuitions track the current methodological maturation of the field. Early evolutionary psychology (circa 1990s) often relied on logical elegance (e.g., the jealousy or savanna claims). Contemporary research increasingly demands the kind of empirical risk you are asking for (e.g., the snake fear or cheater detection data).

  Your hesitation on the **Stepparent** case is particularly sophisticated. It recognizes that a pattern can be *consistent* with evolutionary theory (ultimate explanation) without requiring a specific evolutionary *mechanism* (proximate explanation). The principle validates keeping these levels distinct.

  ---

  ### Application to Incest Avoidance

  **The Claim:** Incest avoidance is an evolved mechanism rather than a byproduct of childhood co-residence.

  **Analysis using the Principle of Empirical Constraint:**

  1.  **Clarification of Terms:** This claim presents a false dichotomy that must be untangled. The "Westermarck Effect" posits that childhood co-residence *triggers* sexual disinterest. The debate is not whether co-residence is involved (it is the cue), but whether the *link* between co-residence and disinterest is an **adaptation** (selected for inbreeding avoidance) or a **byproduct** (a side effect of general familiarity reducing novelty-seeking).
  2.  **Robust Phenomenon:** The phenomenon is robust. Data from Israeli kibbutzim and Taiwanese "minor marriages" show that individuals raised together from a young age rarely marry or report sexual attraction, even if they are not genetically related.
  3.  **Differential Prediction:**
      *   *Byproduct Hypothesis:* Familiarity generally reduces sexual interest. Prediction: Any long-term co-residence should reduce attraction, regardless of timing.
      *   *Adaptation Hypothesis:* Natural selection calibrated the mechanism to detect *kin*. Prediction: The mechanism should be sensitive to the *timing* of co-residence (specifically early childhood), as this is the reliable cue for genetic relatedness.
  4.  **Falsifiability:** If individuals raised together *after* age 10 showed the same level of aversion as those raised together from birth, the "kin detection adaptation" claim would be weakened in favor of a general familiarity byproduct.

  **Verdict:** The evidence supports the **Adaptation** view, but with a caveat. The mechanism is likely an evolved *disposition* to use co-residence as a proxy for kinship (similar to the snake fear case: prepared learning), rather than a direct "incest detector." The Principle of Empirical Constraint suggests accepting the claim that it is an evolved mechanism *calibrated by* co-residence, rather than rejecting co-residence as merely a byproduct. The co-residence is the input; the avoidance is the adapted output.

  ---

  ### Methodologically Settled vs. Genuinely Contested

  To argue effectively with your friend, it is crucial to distinguish between standards of evidence (settled) and specific empirical conclusions (contested).

  **Methodologically Settled (Consensus among rigorous researchers):**
  *   **"Just-So Stories" are invalid:** It is settled that narrative plausibility is not evidence. An evolutionary hypothesis must be tested against data, not just logic.
  *   **Adaptation is not the only outcome:** Researchers agree that traits can be byproducts (spandrels), noise, or maladaptive mismatches. One cannot assume every trait is an adaptation.
  *   **Proximate and Ultimate levels must be distinguished:** Explaining *how* a mechanism works (neuroscience/psychology) is distinct from explaining *why* it was selected (evolution). Confusing these is a methodological error.
  *   **Falsifiability is required:** Hypotheses that cannot be proven false are not scientific.

  **Genuinely Contested (Active areas of debate):**
  *   **The Degree of Modularity:** There is no consensus on whether the mind is composed of hundreds of specific "modules" (Massive Modularity Hypothesis) or a smaller set of flexible, domain-general systems with evolutionary biases. Your verdict on cheater detection reflects this ongoing debate.
  *   **The Specificity of the Ancestral Environment (EEA):** Researchers disagree on how precisely we can reconstruct the Pleistocene environment and whether it was uniform enough to select for specific traits (like savanna preference).
  *   **Specific Empirical Claims:**
      *   *Jealousy:* Whether sex differences in jealousy are universal adaptations or culturally contingent is actively debated.
      *   *Depression:* Whether depression has any adaptive function is highly contested; many researchers view it as a pathology or byproduct rather than an adaptation.
      *   *Incest:* While the Westermarck effect is widely accepted, the precise cognitive architecture (imprinting vs. rule-based) is still refined.

  **Summary for your argument:**
  You can concede to your friend that *bad* evolutionary psychology exists (the just-so stories you rejected), but argue that *good* evolutionary psychology is defined by the **Principle of Empirical Constraint**. Your verdicts demonstrate that you are not accepting EP uncritically; you are applying the very methodological standards that separate scientific EP from speculative storytelling. The disagreement is not about the validity of evolution, but about the quality of evidence for specific psychological claims.
