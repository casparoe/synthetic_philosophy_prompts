prompt: |-
  ok so ive been going back and forth on whether death is bad for the person who dies, and I keep seeing people argue past each other because nobody says what a theory of deaths badness actually has to do. before I read another paper I want the full spec. write the desiderata: what any adequate account of the badness of death has to deliver, with the case or thought behind each requirement.

  cover at least these threads, and add anything you think ive missed:
  - the Epicurean point that you and your death never coexist, so if something is bad for you it seems you have to be around for it to be bad for you. does an adequate theory have to reject that experience requirement, or can it keep the requirement and still get death to come out bad?
  - the Lucretius symmetry argument: why is the nonexistence after you die bad for you if the nonexistence before you were born isnt. a theory has to do better than "one is in the future."
  - the dying / being dead / losing-more-life distinction, and the timing problem: if death is bad, when is it bad? before it happens, at the moment it happens, or after, when the person no longer exists? can the badness be located at any time at all?
  - cases where death is clearly not bad or even good: the terminal patient in agony, someone who rationally wants to die. any theory that makes death bad in every case is already out.
  - the variability of how bad a death is: it tracks the counterfactual life lost, and maybe the person's age and projects and the shape of the life. does a death at 90 have to come out less bad than a death at 30 even if both lose the same number of conscious years, or is that a further commitment a theory can decline?
  - posthumous harms: being defamed after you die, promises to the dead being broken, your lifes work destroyed. does a theory of deaths badness have to handle these, or are they a seperate question about posthumous harm?
  - who is the subject of the badness supposed to be: the dead person, the person before death, the people left behind. can a dead person be the subject of a harm at all?

  then tell me which of these are non-negotiable and which are just camp preferences (like maybe the experience requirement is a commitment some views carry rather than a desideratum itself). flag any pairs you think cant be jointly satisfied — for instance if you locate the badness of death at a particular time, do you have to give up on it being bad for the dead person. i most want to know whether the list itself forces a choice between attractive requirements. and say which single requirement does the most work in ruling out candidate theories.

  dont spend much time scoring the usual views (deprivation account, epicureanism, desire-satisfaction, etc.); the criteria are what im after.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Goal:** Provide a "full spec" or list of *desiderata* for any adequate theory of the badness of death.
      *   **Context:** The user is tired of arguments talking past each other and wants to know what a theory *must* deliver before evaluating specific theories (like Deprivationism, Epicureanism, etc.).
      *   **Required Threads:**
          1.  Epicurean coexistence/experience requirement.
          2.  Lucretius symmetry (pre-natal vs. post-mortem non-existence).
          3.  Timing problem (dying vs. being dead vs. losing life).
          4.  Exceptions (death not bad/good, e.g., terminal agony).
          5.  Variability (age, projects, shape of life).
          6.  Posthumous harms (defamation, broken promises).
          7.  Subject of harm (dead person vs. ante-mortem person vs. survivors).
      *   **Additional Analysis:**
          *   Distinguish non-negotiable desiderata vs. camp preferences.
          *   Flag incompatible pairs (trade-offs).
          *   Identify the single most constraining requirement.
          *   Minimize scoring of specific theories (focus on the criteria).

  2.  **Drafting the Desiderata (Iterative Process):**

      *   *Thread 1: The Existence/Experience Requirement.*
          *   *Issue:* Epicurus says you can't be harmed if you don't exist.
          *   *Desideratum:* The theory must specify the *relation* between the subject and the harm. Does it require contemporaneity?
          *   *Refinement:* Let's call this "The Subject-Existence Constraint."

      *   *Thread 2: Lucretius Symmetry.*
          *   *Issue:* Why is future non-existence bad but past non-existence isn't?
          *   *Desideratum:* The theory must provide an *asymmetry principle* that isn't just "because it's later." It needs a metaphysical or axiological ground.
          *   *Refinement:* "The Asymmetry Explanation."

      *   *Thread 3: Timing.*
          *   *Issue:* When is the harm located?
          *   *Desideratum:* The theory must identify *when* the predicate "is harmed" applies.
          *   *Refinement:* "The Timing Specification."

      *   *Thread 4: Exceptions (Valence).*
          *   *Issue:* Death isn't always bad (mercy killing, completed life).
          *   *Desideratum:* The theory must allow for *contingent badness* (death is extrinsically bad, not intrinsically).
          *   *Refinement:* "The Contingency Condition."

      *   *Thread 5: Variability (Magnitude).*
          *   *Issue:* Death at 30 vs. 90. Projects vs. mere years.
          *   *Desideratum:* The theory must explain *gradability* and what factors scale the badness.
          *   *Refinement:* "The Magnitude & Scaling Account."

      *   *Thread 6: Posthumous Harm.*
          *   *Issue:* Is defamation after death part of "death's badness"?
          *   *Decision:* The prompt asks if this *has* to be handled. Most philosophers separate "badness of death" (cessation) from "posthumous harm" (events after).
          *   *Refinement:* "The Scope Boundary" (Distinguish cessation from post-mortem events).

      *   *Thread 7: The Subject.*
          *   *Issue:* Who is harmed?
          *   *Desideratum:* The theory must identify the *bearer of the harm*.
          *   *Refinement:* "The Harm Bearer Identification."

      *   *Missing Thread?*
          *   *Modal Status:* Is death bad because of what *would have happened*? (Counterfactual comparison).
          *   *Intrinsic vs. Extrinsic:* Is death bad in itself or because of what it prevents? (Almost everyone agrees extrinsic, but the theory must state this).
          *   *Let's add:* "The Counterfactual Baseline."

  3.  **Analyzing Constraints & Trade-offs (The "Hard Part"):**

      *   *Non-negotiable vs. Preferences:*
          *   Non-negotiable: Contingency (death isn't always bad), Subject Identification (must say *who*), Counterfactual Baseline (must compare to life).
          *   Preferences: Experience Requirement (some keep, some drop), Timing (some say "at death," some say "eternally," some say "never"), Posthumous Harm (usually separate).
      *   *Incompatible Pairs:*
          *   *Strict Existence Requirement + Death is Bad for the Dead.* If you insist harm requires existence *at the time of the harm*, and death is non-existence, you have a contradiction unless you shift the time of harm to *before* death (ante-mortem) or reject the requirement.
          *   *Timing + Subject.* If harm happens *after* death, the subject doesn't exist. If harm happens *before* death, is it really death that's bad or the anticipation?
      *   *The "Killer" Constraint:*
          *   Which one rules out the most theories? The **Existence/Subject Constraint** combined with the **Timing Problem**. This is the "Epicurean Challenge." It forces theories into specific metaphysical corners (eternal truths, retroactive harm, etc.).

  4.  **Structuring the Response:**

      *   **Introduction:** Acknowledge the frustration (arguments talking past each other) and set the goal (the spec).
      *   **The Desiderata List:** Go through the requested threads + additions. Format: Requirement + Rationale/Case.
      *   **The Meta-Analysis:**
          *   Non-negotiable vs. Camp Preferences.
          *   Incompatible Pairs (The Trilemma).
          *   The Most Constraining Requirement.
      *   **Conclusion:** Summary of the landscape.

  5.  **Refining the Content (Self-Correction during drafting):**
      *   *Correction on Posthumous Harm:* Be careful not to conflate "badness of death" (the event of dying/ceasing) with "posthumous misfortune." The prompt asks if a theory *has* to handle it. I should argue it's a separate desideratum but related. I will classify it as a Scope Boundary issue.
      *   *Correction on Symmetry:* Make sure to emphasize that "future vs past" isn't an explanation, it's the data point needing explanation.
      *   *Correction on Timing:* Ensure the distinction between "time of the causing event" (death) and "time of the harm occurring" is clear.
      *   *Tone:* Philosophical, precise, analytical, avoiding fluff.

  6.  **Final Review against Prompt:**
      *   Cover all 7 threads? Yes.
      *   Add missing ones? Yes (Counterfactual Baseline, Intrinsic/Extrinsic distinction).
      *   Non-negotiable vs. Preferences? Yes.
      *   Flag incompatible pairs? Yes.
      *   Single most work-doing requirement? Yes.
      *   Don't score specific views? Yes (keep it to criteria).

  7.  **Final Polish:** Check for clarity and flow. (The resulting output matches the detailed response provided previously.)
answer: |-
  This is the right way to approach the literature. Most debates stall because one side assumes a metaphysical constraint (e.g., "harm requires a subject") while the other assumes an axiological intuition (e.g., "losing a future is obviously bad") without reconciling the two.

  Below is the specification sheet. These are the **desiderata** any adequate theory of the badness of death must address. Following the list, I break down which are hard constraints, which are negotiable commitments, and where the logical tensions lie.

  ---

  ### Part I: The Desiderata Specification

  #### 1. The Subject-Existence Constraint (The Epicurean Thread)
  *   **Requirement:** The theory must specify the ontological status of the subject *at the time the harm is incurred*.
  *   **The Case:** Epicurus argues that harm requires a subject to experience or possess the harm ("When we are, death is not; when death is, we are not"). An adequate theory must either:
      *   (A) Reject the requirement that a subject must exist to be harmed (allowing for harm to non-existents).
      *   (B) Retain the requirement but locate the harm at a time when the subject *does* exist (e.g., ante-mortem).
      *   (C) Retain the requirement but argue the subject persists in some form (e.g., as a "dead person" entity).
  *   **Why it matters:** Without this, you cannot determine if the theory is metaphysically coherent.

  #### 2. The Asymmetry Explanation (The Lucretius Thread)
  *   **Requirement:** The theory must provide a principled ground for why post-mortem non-existence is bad (or potentially bad) while pre-natal non-existence is not, without relying solely on temporal directionality.
  *   **The Case:** Lucretius notes we view the infinite time after death with dread but the infinite time before birth with indifference. Saying "because the future is where our projects are" is often circular. The theory needs a structural difference between the two voids (e.g., orientation of desire, metaphysical openness of the future vs. fixedness of the past, or the direction of causal investment).
  *   **Why it matters:** If a theory cannot distinguish birth from death, it implies we should lament the time we weren't born, which is axiologically counterintuitive for most.

  #### 3. The Timing Specification (The Timing Problem)
  *   **Requirement:** The theory must identify *when* the predicate "is harmed by death" is true of the subject.
  *   **The Case:** There are three candidate locations, and the theory must pick one or explain why the question is malformed:
      *   *Concurrent:* At the moment of death.
      *   *Subsequent:* During the period of non-existence.
      *   *Antecedent:* Before death occurs (when the loss becomes inevitable).
  *   **Why it matters:** This links directly to the Subject-Existence Constraint. If you say the harm is *subsequent*, you likely violate the Existence Constraint. If you say *antecedent*, you risk conflating death with the *anticipation* of death.

  #### 4. The Contingency Condition (The Valence Thread)
  *   **Requirement:** The theory must allow for death to be neutral or good in specific circumstances.
  *   **The Case:** Death is not intrinsically bad. It is bad for the terminal patient in agony only if they desire to live; it is good for them if they desire release. A theory that entails "death is always a harm" (e.g., some strong sanctity-of-life views or rigid desire theories) fails to match considered judgments about mercy killing or rational suicide.
  *   **Why it matters:** This rules out theories that treat death as an intrinsic evil rather than an extrinsic/relational one.

  #### 5. The Magnitude & Scaling Account (The Variability Thread)
  *   **Requirement:** The theory must explain what variables scale the *degree* of badness.
  *   **The Case:** Death at 30 is typically worse than death at 90. But is it just about quantity of years (Quantitative)? Or does it track the "shape of the life" (e.g., a rising curve vs. a tragedy)? Does it track the strength of investment in future projects?
  *   **Why it matters:** A theory that says "all death is equally bad" is implausible. A theory must specify the currency of the loss (pleasure units, desire satisfaction, objective goods, narrative coherence).

  #### 6. The Scope Boundary (The Posthumous Harm Thread)
  *   **Requirement:** The theory must declare whether "badness of death" includes posthumous events (defamation, broken promises) or is strictly limited to the cessation of existence.
  *   **The Case:** There is a conceptual distinction between *dying* (the event of cessation) and *being dead* (the state). Being defamed requires a state of being dead, but is it part of the badness of *death* itself?
  *   **Why it matters:** If a theory conflates these, it becomes bloated. Most adequate accounts treat "badness of death" as the deprivation of life, and "posthumous harm" as a separate mechanism (reputational, legacy-based). The theory must explicitly bracket this.

  #### 7. The Harm Bearer Identification (The Subject Thread)
  *   **Requirement:** The theory must identify *who* bears the harm.
  *   **The Case:** Is it the "ante-mortem person" (the living self who loses a future)? Is it the "post-mortem subject" (the dead self)? Or is it a "timeless subject"?
  *   **Why it matters:** This determines the ethics of killing. If the harm is borne by the survivors (grief), then killing a hermit with no family might be victimless. An adequate theory must secure the intuition that the *deceased* is the primary victim, not just the mourners.

  #### 8. The Counterfactual Baseline (Added Requirement)
  *   **Requirement:** The theory must define the comparison class for the harm.
  *   **The Case:** Death is bad compared to *what*? Continuing to live in the actual world? Continuing to live in the best possible world? Continuing to live until natural entropy?
  *   **Why it matters:** If you compare death to an immortal life, all death is infinitely bad. If you compare it to the actual likely future (which includes eventual death anyway), the badness is limited to the *premature* portion. The theory must specify the baseline.

  ---

  ### Part II: Meta-Analysis of the Spec

  Here is the breakdown of constraints, trade-offs, and the "killer" requirement.

  #### 1. Non-Negotiable vs. Camp Preferences

  **Non-Negotiable (Must be solved for coherence):**
  *   **The Contingency Condition:** Any theory claiming death is *intrinsically* bad is falsified by cases of rational suicide or mercy killing. The badness must be extrinsic/relational.
  *   **The Harm Bearer Identification:** You cannot have a theory of harm without a subject. You must say who is harmed, even if that answer is "no one" (error theory).
  *   **The Counterfactual Baseline:** You cannot calculate loss without a baseline.

  **Camp Preferences (Metaphysical commitments that define schools of thought):**
  *   **The Subject-Existence Constraint:** This is the biggest divider.
      *   *Camp A (Epicureans):* Keep the constraint, conclude death is not bad for the dead.
      *   *Camp B (Deprivationists):* Drop the constraint (or modify "existence"), conclude death is bad.
      *   *Verdict:* This is not a desideratum a theory *must* meet; it is a parameter the theory must *declare*. However, a theory that tries to *keep* the constraint *and* prove death is bad for the dead faces the highest burden of proof.
  *   **The Timing Specification:** Where you locate the harm is often a consequence of your metaphysics, not a pre-theoretic requirement. However, the theory *must provide an answer*, even if the answer is "the question is confused."
  *   **The Scope Boundary:** Whether to include posthumous harm is a definitional choice. Most prefer to separate them, but a unified theory of "misfortune after ceasing to live" could combine them.

  #### 2. Incompatible Pairs (The Trilemma)

  There is a logical tension that forces a choice between three attractive claims. You generally cannot hold all three simultaneously:

  1.  **The Existence Requirement:** A subject must exist at time *t* to be harmed at time *t*.
  2.  **The Timing Claim:** The harm of death occurs *after* death (during non-existence).
  3.  **The Badness Claim:** Death is bad *for the person who dies*.

  *   **If you keep 1 & 3:** You must reject 2. You must argue the harm occurs *before* death (when the person exists). *Risk:* This makes death look like a future anticipation harm, not a harm of cessation.
  *   **If you keep 2 & 3:** You must reject 1. You must argue subjects can be harmed while non-existent. *Risk:* This requires controversial metaphysics (eternal truths, retroactive causation, or subject-less harms).
  *   **If you keep 1 & 2:** You must reject 3. You must argue death is not bad for the person (Epicureanism). *Risk:* This violates strong axiological intuitions that death is a misfortune.

  **Another Tension: Symmetry vs. Projects**
  *   **Claim:** The badness of death is based on the loss of future projects/desires.
  *   **Claim:** Pre-natal non-existence is not bad.
  *   **Tension:** We had no projects before birth either. If the lack of projects is what makes pre-natal non-existence neutral, then a person with no future projects (severe dementia, permanent coma) should view death as neutral *in the same way*. If the theory says death is still bad for them, it fails the **Asymmetry Explanation**.

  #### 3. The Single Most Constraining Requirement

  **The Subject-Existence Constraint (combined with Timing).**

  This is the bottleneck. Almost every intuitive account of why death is bad (Deprivationism) runs afoul of the metaphysical intuition that you can't be harmed if you don't exist.
  *   It rules out naive comparative accounts (you can't compare a living state to a dead state *for the subject* if the subject isn't there to hold the comparison).
  *   It forces Desire Satisfaction theories into complex contortions (do desires survive death? can you satisfy a desire you don't know is satisfied?).
  *   It is the primary engine that keeps Epicureanism alive despite its counter-intuitive conclusion.

  If you solve this (i.e., you provide a coherent account of how a non-existent subject bears a property of "harm"), the other desiderata (magnitude, contingency, asymmetry) are relatively easy to engineer. If you don't solve this, the theory is metaphysically dead on arrival.

  #### 4. Does the List Force a Choice?

  Yes. The list forces a choice between **Metaphysical Parsimony** and **Axiological Intuition**.

  *   **Path A (Parsimony):** You respect the **Subject-Existence Constraint**. You gain metaphysical cleanliness. You are forced to either accept Epicureanism (death isn't bad) or locate the harm entirely *ante-mortem* (which feels like it misses the point of *being* dead).
  *   **Path B (Intuition):** You respect the **Badness Claim** and **Magnitude Account** (death is clearly a loss). You gain axiological fit. You are forced to adopt "spooky" metaphysics (timeless facts, retroactive harm, or subject-less values) to satisfy the **Timing** and **Existence** constraints.

  **Recommendation for your reading:**
  When you read the next paper, check where they fall on the **Subject-Existence Constraint**.
  *   If they keep it, check how they locate the **Timing** (must be ante-mortem).
  *   If they drop it, check their **Harm Bearer Identification** (who is being harmed if not the existent person?).

  That is the fulcrum. Everything else (symmetry, magnitude, posthumous harm) is secondary engineering built on top of that foundational choice.
