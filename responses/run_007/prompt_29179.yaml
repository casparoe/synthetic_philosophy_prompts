answer: |-
  1. Verdict up front
  1. Does the generative model entail genuine semantic representation, or is it merely a control structure compatible with enactivism?
  2. How does the minimisation of statistical surprise ground biological normativity without committing the naturalistic fallacy?
  3. Is the Free Energy Principle a substantive empirical claim about life, or a mathematical tautology applicable to any existing system?

  2. Why this order
  In narrowing down from an initial longlist of eight candidate topics, I prioritised questions that are metaphysically upstream and tractable for a philosopher without requiring simulation work. The initial list included: (1) Markov blanket ontology, (2) the Dark Room problem, (3) the evolutionary origin of priors, (4) action as inference, (5) representational status, (6) the FEP tautology objection, (7) consciousness as precision weighting, and (8) the normativity of error. I discarded the Markov blanket debate because, as you suspect, it often devolves into technical modelling disputes rather than conceptual clarity, and the literature is becoming saturated. The Dark Room problem is largely settled via expected free energy and prior preferences, offering little room for novel philosophical contribution. The origin of priors is vital but drifts into empirical biology, risking a dissertation that is neither fish nor fowl. Consciousness is too downstream; you cannot solve phenomenology before settling the metaphysics of the model itself. Finally, while 'action as inference' is crucial, it is best analysed through the lenses of representation and normativity rather than as a standalone topic.

  I have ranked **Representational Status** first because it is the gatekeeper question. If predictive processing (PP) does not require internal models that *represent* the world in a robust semantic sense, the framework collapses into a form of enactivism or dynamical systems theory, rendering much of the computational literature philosophically misinterpreted. Settling this dictates whether you are doing philosophy of computation or philosophy of embodied cognition. It is highly tractable for a philosopher, relying on established debates in intentionality rather than new maths.

  I ranked **Normativity** second because it addresses the 'ought' from 'is' problem inherent in the theory. PP claims to explain goal-directedness via error minimisation, but statistical deviation is not inherently normative. If you can clarify how 'error' acquires normative force (e.g., via constitutive aims or evolutionary history), you solve the grounding problem for active inference. This beats the third candidate because it connects directly to action and value, which are central to cognitive science, whereas the third question is more meta-theoretical.

  I ranked **FEP Empirical Content** third. This is the validity question. If the Free Energy Principle (FEP) is a tautology (all existing systems minimise free energy by definition), it explains nothing. If it is substantive, what constrains it? This is less urgent than the first two because even if it is a tautology, the *approximations* (like PP) might still be useful empirically. However, it remains critical for defining the scope of your dissertation's claims. It is tractable because it relies on philosophy of science (laws vs. truisms) rather than deriving new bounds.

  3. Settled vs. contested
  For **Representational Status**, most proponents accept that agents employ generative models to predict inputs. The live disagreement is whether these models possess *derived* or *original* intentionality. Realists (e.g., Hohwy) argue the model must represent causal structures to function; anti-realists (e.g., Hutto, Myin) argue the model is merely a description of the agent's dynamics, not an internal semantic vehicle. Do not assume the computational language implies commitment to representationalism; that is precisely the contest.

  For **Normativity**, there is consensus that biological systems exhibit normative behaviour (success/failure conditions). The contention lies in whether free energy minimisation *constitutes* this normativity or merely *correlates* with it. Some argue the 'goal' is built into the boundary conditions (the Markov blanket); others argue this is circular and requires external grounding (e.g., natural selection). Be wary of papers that slide between statistical surprise and biological harm without justification; that is the fault line.

  For **FEP Empirical Content**, physicists and mathematicians often treat the principle as a law-like generalisation derived from stochastic dynamics. Philosophers of science (e.g., Colombo, Wright) contest whether this derivation holds for non-equilibrium steady states in biology specifically. The consensus is that the maths is sound; the disagreement is whether the mapping from maths to biology adds information or merely renames existing properties. You must distinguish between the principle itself and its variational approximations when assessing this.

  4. What would change the ranking
  The ranking would shift if empirical neuroscience provided decisive evidence regarding the **Representational Status**. If neurophysiology identified specific coding schemes that unambiguously function as semantic vehicles (e.g., specific probabilistic population codes with clear truth conditions), the debate would move downstream, and **Normativity** would become the primary philosophical bottleneck. Conversely, if successful modelling was achieved using purely dynamical, non-representational formulations of active inference, the **Representational** question would dissolve, making **FEP Empirical Content** the most pressing issue to salvage the theory's explanatory power. Additionally, if a formal proof emerged demonstrating the FEP is mathematically trivial for all bounded systems, the third question would leap to first place, as it would threaten the viability of the entire research programme.

  5. Questions to skip
  Avoid the **Markov Blanket Ontology** debate; it is currently mired in technical disputes about conditional independence that rarely illuminate cognitive architecture. Steer clear of the **Dark Room Problem**; it is a straw man that has been adequately addressed via prior preferences in active inference literature. Finally, avoid **PP Accounts of Consciousness** for a dissertation; the field is too speculative and relies too heavily on the unresolved metaphysics of the first two questions.
