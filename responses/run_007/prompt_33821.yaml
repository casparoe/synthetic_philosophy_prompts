      *   *Supervaluationism (Fine, Keefe):* Vagueness is semantic indecision. There are many "precisifications" (ways to make the term precise). A sentence is *supertrue* if true on all precisifications, *superfalse* if false on all, and *truth-valueless* (or indeterminate) if true on some and false on others.
      *   *Classical Logic Claim:* Both claim to save classical logic, *but* they do it differently.
          *   Epistemicism: Saves it straightforwardly. $P \lor \neg P$ is always true because one disjunct is factually true.
          *   Supervaluationism: Saves it via supertruth. $P \lor \neg P$ is supertrue (because on every precisification, either $P$ is true or $\neg P$ is true), even if neither $P$ nor $\neg P$ is supertrue individually.
      *   *The Conflict:* The user asks if they disagree on truth values.
