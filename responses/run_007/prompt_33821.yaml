answer: |-
  You have hit on one of the most subtle and debated issues in the philosophy of language. You are correct that both theories are motivated by a desire to save classical logic (specifically the Law of Excluded Middle and standard inference rules) from the attacks of fuzzy logic or intuitionism. However, your intuition that they might just be "different stories about the same formal structure" is where things get interesting.

  They are **not** just different stories. They make genuinely different claims about the world and language, and there are concrete sentences on which they disagree.

  Here is where the rubber meets the road.

  ### 1. The Crucial Distinction: Bivalence vs. Excluded Middle
  To understand where they disagree, we have to split "classical logic" into two components:
  *   **The Law of Excluded Middle (LEM):** For any proposition $P$, "$P \lor \neg P$" is true.
  *   **The Principle of Bivalence:** Every proposition $P$ is either True or False.

  **Epistemicism** preserves **both**. It says there is a fact of the matter (a sharp cutoff), so every sentence is T or F (Bivalence), and therefore "$P \lor \neg P$" is always true (LEM).

  **Supervaluationism** preserves **LEM but rejects Bivalence**. It says that for a borderline case (like "This man is bald" when he has 5,000 hairs), the sentence is neither True nor False (it has a truth-value gap). However, the disjunction "This man is bald OR this man is not bald" is still **Supertrue** (true on all precisifications).

  **The Concrete Disagreement:**
  Consider a specific borderline case, let's call it $B$ ("Bob is bald," where Bob is clearly borderline).
  *   **Epistemicist:** "$B$ is either true or false."
  *   **Supervaluationist:** "$B$ is neither true nor false."

  Now, consider the sentence **$I$**: *"It is indeterminate whether Bob is bald."*
  *   **Supervaluationist:** $I$ is **True**. (Because $B$ lacks a truth value).
  *   **Epistemicist:** $I$ is **False**. (Because $B$ has a truth value; we are just ignorant of it. There is no metaphysical indeterminacy, only epistemic ignorance).

  This is a direct truth-value disagreement on a specific sentence ($I$).

  ### 2. The "Definitely" Operator
  The divergence becomes even sharper when we introduce an operator for determinacy, often written as $D$ (where $Dp$ means "It is definitely the case that $p$").

  **Supervaluationism:**
  Defines $Dp$ as "$p$ is supertrue" (true on all admissible precisifications).
  *   In this system, $Dp \lor D\neg p$ is **False** for borderline cases. (It is not definitely bald, nor is it definitely not bald).
  *   This allows them to model the intuition that borderline cases are "unsettled."

  **Epistemicism:**
  Williamson (the main proponent) links $D$ to knowledge ($K$). $Dp$ is roughly "We could know $p$."
  *   In this system, $p \lor \neg p$ is true, and since the boundary is sharp, one of them is *definitely* the case in reality, even if we can't know which.
  *   However, Epistemicism struggles to make sense of $D$ without collapsing into "We know $p$." Williamson argues that the boundary is *unknowable*, so while $p$ is true, $Dp$ (in the sense of 'knowable') is false.

  **The Disagreement:**
  Take the sentence: *"There is a specific number of hairs $n$ such that $n$ hairs is bald and $n+1$ hairs is not bald."*
  *   **Epistemicist:** **True.** (There is a sharp cutoff in reality).
  *   **Supervaluationist:** **False.** (There is no single $n$ that works for *all* precisifications. On one precisification, the cutoff is 5,000; on another, it's 5,010. No single $n$ is the cutoff simpliciter).

  ### 3. Higher-Order Vagueness (The Stress Test)
  This is where the theories are tested most rigorously. Vagueness isn't just about "bald" vs. "not bald." It's also vague where the boundary between "bald" and "borderline" lies. This is **higher-order vagueness**.

  **Supervaluationism's Problem:**
  Supervaluationism creates a sharp boundary between "True," "Indeterminate," and "False."
  *   If a sentence is true on *all* precisifications, it's True.
  *   If it's true on *some* but not others, it's Indeterminate.
  *   This implies there is a sharp cutoff between the True cases and the Indeterminate cases.
  *   **Critique:** This seems to reintroduce the very vagueness problem it tried to solve, just one level up. (Why is there a sharp line between 'definitely bald' and 'borderline bald'?)

  **Epistemicism's Response:**
  Epistemicism bites the bullet. It says there *is* a sharp cutoff between "definitely bald" and "borderline," and another between "borderline" and "definitely not bald." We just can't know where any of them are.
  *   **Prediction:** The world is crisp; our access to it is fuzzy.
  *   **Supervaluationist Prediction:** The world (or at least our language's relation to it) is genuinely fuzzy/gappy.

  ### 4. Are they just different stories?
  You asked if they are "actually different theories or just different stories about the same underlying formal structure."

  They are **different theories** with different **metaphysical commitments**, even if they sometimes validate the same logical tautologies (like $P \lor \neg P$).

  1.  **Metaphysics:**
      *   **Epistemicism** is a realist theory about properties. It claims properties like "baldness" have precise extensions in the world. Vagueness is purely in the mind (ignorance).
      *   **Supervaluationism** is a semantic theory. It claims vagueness is a feature of language (semantic indecision). The world doesn't have a "baldness" property with a sharp edge; our word "bald" is just under-defined.

  2.  **Formal Structure:**
      *   They are not formally identical. Epistemicism uses standard classical semantics (2-valued). Supervaluationism uses a 3-valued (or gap) semantics that is *designed* to mimic classical logic for tautologies but diverges on truth-value assignments.
      *   As shown above, they assign different truth values to claims about **indeterminacy** and **existential generalizations** (e.g., "There exists an $n$ such that...").

  ### Summary: The "Rubber Meets the Road"
  If you want a concrete test case to distinguish them, ask this question:

  > **"Is there a specific number of grains $n$ that is the last grain of a heap?"**

  *   **Epistemicism:** **Yes.** (We just can't identify it).
  *   **Supervaluationism:** **No.** (There are many admissible cutoffs, but no single number is *the* cutoff).

  Or, regarding the sentence **"It is vague whether Bob is bald"**:
  *   **Epistemicism:** **False.** (It is not vague; it is a fact. We are just ignorant).
  *   **Supervaluationism:** **True.** (The term 'bald' does not determine a truth value for Bob).

  So, while they both rescue classical *inference* (you can still use Modus Ponens and LEM in proofs), they offer incompatible descriptions of reality. Epistemicism says reality is sharp; Supervaluationism says language is loose. They disagree on the truth value of sentences *about* vagueness, even if they agree on the validity of logical laws.
