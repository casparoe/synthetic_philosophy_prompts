prompt: |-
  I'm a sixth-form student taking A-level Religious Studies, and we've been covering ethical theories. My teacher summarised the Doctrine of Double Effect for the class as follows:

  'The Doctrine of Double Effect says that an action with both good and bad consequences is morally permissible as long as you intend only the good outcome and the bad outcome is merely a foreseen side effect rather than the means to the good outcome. That's why a doctor can give a dying patient morphine to relieve pain even knowing it will also shorten the patient's life — the death is a side effect, not the means. And in the trolley problem, you may divert the trolley to kill one instead of five because the one's death is a side effect of saving five, but you may not push a large man off a bridge to stop the trolley, because his death would be the means of saving the five. The doctrine therefore shows that the difference between the two trolley cases is whether you use someone's death as a tool.'

  I'm not convinced this summary is entirely fair. I've read elsewhere that the Doctrine also requires the act itself to be good or at least neutral in kind, and that the good effect must be 'proportionate' to the bad one — neither of which my teacher mentioned. I also wonder whether the side-effect/means distinction really does all the work my teacher claims it does in separating the two trolley cases, or whether that's a bit of a gloss.

  Please act as an expert in moral philosophy and carefully evaluate my teacher's summary. Go through it sentence by sentence and tell me what a careful defender of the Doctrine would accept, what they would qualify, and what they might reject outright. Before writing your final answer, take a moment to think through the four standard conditions of the Doctrine and how each part of the summary measures up against them. Please structure your response as exactly five numbered items, each a sentence or two, with no introduction or conclusion.
