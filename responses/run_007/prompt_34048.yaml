prompt: |-
  Before I engage further with the growing literature on inferring human preferences from behavior — spanning inverse reinforcement learning, revealed preference theory in economics, and recent work in AI alignment on value learning — I want the specification first. Write the desiderata that any adequate theory of preference inference must meet. I need: the cases it must handle correctly (single-shot versus repeated choices, stochastic behavior, multi-agent settings, situations involving weakness of will or self-deception, behavior under false beliefs or incomplete information), the distinctions it must respect and not collapse (inferred versus actual preferences, what an agent wants versus what it is merely disposed to do, revealed versus normative preferences, preferences versus constraints), and the empirical results from psychology and behavioral economics it must accommodate (framing effects, time inconsistency, social preferences, context-dependence of choice). For each requirement, give the case or consideration that motivates treating it as a requirement rather than an optional feature. Flag any pairs of desiderata you suspect cannot be jointly satisfied, and identify which single requirement does the most work in excluding popular approaches. A table for the desiderata is fine; I will evaluate particular theories against the list myself.
reasoning: |-
  Here's a thinking process that leads to the suggested desiderata for a theory of preference inference:

  1.  **Analyze the Request:**
      *   **Topic:** Inferring human preferences from behavior (IRL, Revealed Preference, AI Alignment/Value Learning).
      *   **Task:** Write the *specification* (desiderata) that any adequate theory must meet *before* engaging with specific literature.
      *   **Required Content:**
          *   Cases to handle (single-shot, repeated, stochastic, multi-agent, weakness of will, false beliefs).
          *   Distinctions to respect (inferred vs. actual, wants vs. dispositions, revealed vs. normative, preferences vs. constraints).
          *   Empirical results to accommodate (framing, time inconsistency, social preferences, context-dependence).
          *   Motivation for each requirement (why it's necessary, not optional).
          *   Flag incompatibilities (trade-offs).
          *   Identify the "killer constraint" (the requirement that excludes the most popular approaches).
      *   **Format:** A table is acceptable/preferred.
      *   **Tone:** Rigorous, philosophical, technical, specification-oriented.

  2.  **Deconstruct the Domain:**
      *   *Economics (Revealed Preference):* Assumes rationality, consistency (WARP/SARP), treats choice as preference. Struggles with biases, mistakes, and internal conflict.
      *   *AI/IRL (Inverse Reinforcement Learning):* Assumes agent optimizes a reward function. Struggles with bounded rationality, systematic biases, and the "is-ought" gap (inferring what *should* be valued vs. what *is* pursued).
      *   *Psychology/Behavioral Econ:* Shows humans are irrational, context-dependent, time-inconsistent, and socially motivated.
      *   *Philosophy (Action Theory):* Distinguishes between intention, desire, belief, and action. Acknowledges akrasia (weakness of will).

  3.  **Drafting the Desiderata (Iterative Process):**

      *   *Category 1: Scope of Cases.*
          *   Need to handle noise (stochasticity). *Motivation:* Humans aren't deterministic machines.
          *   Need to handle dynamic inconsistency (hyperbolic discounting). *Motivation:* People change minds over time.
          *   Need to handle epistemic limitations (false beliefs). *Motivation:* Choosing X because you think it's Y doesn't mean you prefer X.
          *   Need to handle internal conflict (akrasia). *Motivation:* Doing what you don't want to do (addiction, compulsion).

      *   *Category 2: Conceptual Distinctions.*
          *   Preference vs. Constraint. *Motivation:* I didn't buy the house because I was poor, not because I hated it.
          *   Revealed vs. Normative (or Competence) Preferences. *Motivation:* The "Happy Slave" or "Addict" problem. What they choose isn't always what's good for them or what they reflectively endorse.
          *   Disposition vs. Occurrent Want. *Motivation:* Habits vs. conscious desire.

      *   *Category 3: Empirical Adequacy.*
          *   Framing Effects. *Motivation:* Same outcome, different description, different choice.
          *   Social Preferences. *Motivation:* Altruism, spite, fairness (Ultimatum Game).
          *   Context Dependence. *Motivation:* Decoy effects, status quo bias.

      *   *Category 4: Meta-Requirements (Trade-offs & Exclusion).*
          *   Need to identify the tension. Usually, it's between *Rationality/Consistency* and *Empirical Accuracy*. If you assume perfect rationality (standard IRL/Econ), you fail empirical tests. If you assume total flexibility (anything goes), you can't infer anything (underdetermination).
          *   The "Killer Constraint": The separation of *Beliefs* and *Preferences* under conditions of *False Beliefs* + *Akrasia*. Standard IRL collapses these.

  4.  **Refining and Formatting:**
      *   Structure into a clear table as requested.
      *   Ensure the "Motivation" column explains *why* this is a hard requirement (i.e., failure leads to catastrophic alignment errors or explanatory failure).
      *   Explicitly address the "Incompatibilities" and "Killer Constraint" sections after the table.

  5.  **Self-Correction/Critique during Drafting:**
      *   *Critique:* Is "Normative Preferences" too philosophical?
      *   *Correction:* In AI alignment, this is crucial (Value Learning). If we align to revealed preferences, we align to addictions. Must include it.
      *   *Critique:* Is "Multi-agent" necessary?
      *   *Correction:* Yes, game theory contexts change individual preference revelation (strategic behavior vs. true preference).
      *   *Critique:* Make sure to distinguish between "Revealed Preference" (the theory) and "Revealed Preferences" (the data). The desideratum is that the theory must *not* equate them blindly.
      *   *Refinement on the "Killer Constraint":* The biggest issue in current IRL and Standard Econ is the *Rationality Assumption*. They assume actions maximize utility. If actions are driven by bias or error, the inference is garbage. So the requirement to *disentangle bias from preference* is the hardest one.

  6.  **Final Polish:**
      *   Check against all specific prompts in the user query (single-shot, stochastic, weakness of will, etc.).
      *   Ensure the tone is authoritative and specification-like.
      *   Verify the "Incompatibilities" section highlights the tension between *Predictive Accuracy* and *Normative Validity*.

  7.  **Final Output Generation:** (Proceeding to generate response based on these thoughts.)
answer: |-
  ### Specification for a Theory of Preference Inference

  **Document Status:** Draft Specification v1.0
  **Domain:** Preference Inference (Economics, AI Alignment, Action Theory)
  **Purpose:** To define necessary conditions for adequacy before evaluating specific models (e.g., IRL, Revealed Preference Theory).

  The following table outlines the desiderata. A theory failing any single row is deemed inadequate for high-stakes alignment or robust social science modeling.

  | ID | Category | Desideratum | Required Cases / Distinctions | Motivation for Requirement |
  | :--- | :--- | :--- | :--- | :--- |
  | **D1** | **Epistemic** | **Belief-Preference Separation** | Must distinguish choices driven by *false beliefs* from choices driven by *true preferences*. (e.g., Drinking a glass believed to be gin but is actually petrol). | **Catastrophic Failure Mode:** If a theory infers a preference for petrol because the agent drank it, it fails the basic task of modeling agency. Standard Revealed Preference Theory (RPT) often collapses this distinction. |
  | **D2** | **Psychological** | **Akrasia Accommodation** | Must handle *weakness of will* (akrasia) and *compulsion*. (e.g., An addict choosing to use despite a higher-order preference to quit). | **Alignment Risk:** Inferring preferences solely from first-order choices aligns systems to an agent's impulses rather than their reflective values. This validates self-destructive behavior as "preferred." |
  | **D3** | **Temporal** | **Dynamic Consistency Handling** | Must account for *time inconsistency* (hyperbolic discounting) without labeling the agent as having contradictory preferences at every time step. (e.g., Preferring $100 today over $110 tomorrow, but $110 in 366 days over $100 in 365 days). | **Predictive Failure:** A theory assuming exponential discounting will systematically mispredict future behavior and misidentify the agent's long-term welfare interests. |
  | **D4** | **Structural** | **Constraint-Preference Distinction** | Must distinguish *inability to act* from *unwillingness to act*. (e.g., Not buying a house due to budget constraints vs. dislike of the house). | **Inference Error:** Without exogenous constraints modeled, the theory infers dispreference for all unchosen affordable options, rendering the preference map sparse and inaccurate. |
  | **D5** | **Contextual** | **Framing Invariance (or Sensitivity)** | Must either recover preferences invariant to framing *or* explicitly model framing as a parameter of the preference function. (e.g., 90% survival vs. 10% mortality). | **Empirical Adequacy:** Humans violate description invariance. A theory that assumes invariance (Standard Econ) fails empirical fit; a theory that accepts framing as preference loses normative grip on what the agent *actually* values. |
  | **D6** | **Social** | **Strategic vs. Intrinsic Separation** | Must distinguish *strategic behavior* in multi-agent settings from *intrinsic social preferences*. (e.g., Cooperating in a Prisoner's Dilemma due to fear of punishment vs. genuine altruism). | **Game Theoretic Failure:** In multi-agent settings, observed behavior is a Nash equilibrium of strategies, not a direct readout of utility functions. Collapsing strategy into preference prevents counterfactual reasoning. |
  | **D7** | **Stochastic** | **Noise vs. Exploration** | Must distinguish *random error* (trembling hand) from *deliberate exploration* (information seeking). | **Learning Efficiency:** In IRL, treating information-seeking as noise leads to underestimating the agent's desire for knowledge. Treating noise as signal leads to overfitting irrationality. |
  | **D8** | **Normative** | **Competence vs. Performance** | Must distinguish the *idealized preference* (what the agent would choose with full information/cognitive capacity) from *observed choice* (bounded rationality). | **Value Learning:** For AI alignment, the goal is often to satisfy the agent's "competence" preferences. Satisfying "performance" preferences locks in cognitive biases (e.g., status quo bias). |

  ---

  ### Incompatibilities and Trade-Offs

  The following pairs of desiderata exhibit tension. A theory may satisfy both, but doing so requires significant structural complexity (e.g., hierarchical models).

  1.  **D5 (Framing) vs. D8 (Competence):**
      *   *Tension:* If you treat framing effects as part of the preference function (to satisfy empirical fit D5), you violate the notion of a stable, competent preference (D8). If you treat them as errors to be corrected (to satisfy D8), you reduce predictive accuracy on raw behavioral data (D5).
      *   *Resolution Requirement:* The theory must be hierarchical, positing a "true" utility function obscured by a "performance" error function.

  2.  **D1 (Belief-Preference Separation) vs. D6 (Strategic Separation):**
      *   *Tension:* To separate beliefs from preferences (D1), you need to observe choices across varying states of the world. In multi-agent settings (D6), other agents adapt to the focal agent, changing the "state of the world" endogenously. This creates an identification problem where beliefs, preferences, and strategic models are jointly underdetermined by behavior alone.
      *   *Resolution Requirement:* The theory must incorporate non-behavioral data (e.g., verbal reports, neural data) or assume structural priors on rationality to break the degeneracy.

  3.  **D2 (Akrasia) vs. D4 (Constraints):**
      *   *Tension:* Internal psychological constraints (addiction, phobia) look mathematically identical to external constraints (budget, physics) in choice data. Distinguishing them requires a model of the agent's *meta-preferences* (preferences about preferences).
      *   *Resolution Requirement:* The theory must allow for higher-order volitions, not just first-order choice maximization.

  ---

  ### The "Killer Constraint"

  **Requirement:** **D1 (Belief-Preference Separation) combined with D2 (Akrasia Accommodation).**

  **Why this excludes popular approaches:**
  This pair constitutes the primary failure mode of the two dominant paradigms:

  1.  **Standard Revealed Preference Theory (Economics):**
      *   *Failure:* It explicitly defines preference *as* choice. It cannot conceptually accommodate D1 or D2. If an agent chooses X, the theory asserts they prefer X. It treats false beliefs and weakness of will as non-existent or irrelevant to the definition of preference.
      *   *Exclusion:* Fails D1 and D2 immediately.

  2.  **Standard Inverse Reinforcement Learning (AI):**
      *   *Failure:* Most IRL algorithms assume the agent is a *noisy rational optimizer* of a stationary reward function.
      *   *Exclusion:* While they handle D7 (Noise), they typically assume the agent is trying to maximize their reward. They struggle to distinguish between an agent who *wants* to stop smoking but *can't* (Akrasia/D2) and an agent who *wants* to smoke. They also struggle to disentangle the agent's model of the world (Beliefs/D1) from their reward function without strong priors. If the agent acts on a false belief, standard IRL infers a bizarre reward function rather than correcting the belief model.

  **Conclusion:** Any theory that assumes **Action = Maximization(Preference)** without a hierarchical structure separating **Planning System** (Beliefs/Strategy), **Evaluation System** (Preferences), and **Execution System** (Constraints/Noise) will fail this specification. The theory must treat behavior as a *corrupted signal* of preference, not a *direct revelation* of it.
