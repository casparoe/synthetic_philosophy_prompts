prompt: |-
  I'm a novelist and I've got a situation that's been eating at me. My sister went through something really awful about five years ago — a drawn-out divorce with a genuinely cruel husband, some details I won't get into, but she's only really started to rebuild her life in the last year or so. She told me a lot of things during that time she's never told anyone else.

  Here's the thing. I'm writing a novel right now and the central relationship in it is basically her marriage. Not the surface details — I've changed names, setting, professions, all that — but the emotional core is pulled directly from what she told me in confidence. And I think it's really good. Like, the best thing I've written. It has this rawness that I don't think I could of invented from scratch.

  If I publish it, there's a real chance it helps people — readers who've been through something similar and feel alone, people who don't understand what that kind of marriage does to a person. I genuinely believe that. But I also know my sister would recognize herself if she read it, and it would feel like a betrayal. She trusted me, and I'm using her pain for my work.

  I tried to think about this systematically. On one side: her hurt, our relationship, the trust she gave me. On the other side: the book's value to readers, my career, the fact that I've changed the material enough that no one else would know it's her. When I lay it out like that, the calculation seems to tilt toward publishing — the good to many readers outweighs the harm to one person. But every time I try to settle on that conclusion, I feel like I'm doing something wrong just by weighing it that way. Like the fact that I'm standing back and treating my sister's suffering as a cost and a benefit in a ledger is itself a kind of betrayal, regardless of what the ledger says.

  Is there something off about how I'm thinking about this, or am I just uncomfortable with what the math points to?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and the Situation:**
      *   **User:** A novelist.
      *   **Situation:** They wrote a novel based heavily on their sister's traumatic divorce (emotional core, not surface details).
      *   **Conflict:** The book is good/potentially helpful to others vs. the sister's trust/privacy/potential hurt.
      *   **User's Reasoning:** Utilitarian calculus (benefit to many > harm to one).
      *   **User's Doubt:** Feels that the *act* of calculating is itself a betrayal.
      *   **Goal:** Seeking ethical guidance/perspective on whether their thinking is flawed or if they just need to accept the "math."

  2.  **Evaluate the Ethical Dimensions:**
      *   **Trust & Confidentiality:** The sister shared this *in confidence* during a vulnerable time. This is a sacred bond between siblings, especially during trauma.
      *   **Consent:** There is no indication the sister consented to this material being used.
      *   **Identification:** The user claims names/settings are changed, but admits the *emotional core* is identical. Siblings know each other's emotional signatures intimately. The sister *will* recognize herself.
      *   **Utilitarianism vs. Deontology:** The user is using a utilitarian framework (greatest good for greatest number). However, relationships operate more on deontological grounds (duties, rights, promises). You don't usually sacrifice a specific duty to a loved one for abstract public good.
      *   **The "Math" Problem:** The user is right to feel uneasy about the calculation. Reducing a sister's trauma to a variable in an equation objectifies her, which mirrors the cruelty she likely experienced in the marriage (being used/discarded for someone else's benefit).

  3.  **Determine the Core Issue:**
      *   It's not just about whether the sister *can* be identified by the public (she likely won't be).
      *   It's about whether the sister *identifies herself* and feels betrayed.
      *   It's about the violation of the specific trust given during a crisis.
      *   It's about the author's intuition that the *method* of decision-making is morally suspect.

  4.  **Formulate the Response Strategy:**
      *   **Validate the Intuition:** Acknowledge that the discomfort about the "ledger" is a crucial moral signal, not just cold feet.
      *   **Challenge the Utilitarian Framework:** Explain why family ethics don't work like public policy. The duty to the sister is special, not general.
      *   **Highlight the "Emotional Core" Risk:** Changing names isn't enough if the emotional truth is recognizable to *her*.
      *   **Address the "Helping Others" Argument:** While noble, it shouldn't come at the cost of violating a specific trust. There are other ways to help readers without using *this* specific story.
      *   **Offer a Path Forward:** Suggest communication, consent, or letting go of this specific manuscript.

  5.  **Drafting the Content (Iterative refinement):**

      *   *Opening:* Validate the writer's skill (the book is good) but immediately pivot to the ethical weight. Acknowledge the "ledger" feeling is spot on.
      *   *The "Math" Flaw:* Explain that relationships aren't transactional. The sister isn't "one person" in a vacuum; she's the source. Using her pain without permission replicates the dynamic of the abusive marriage (extraction without regard for the subject).
      *   *The Recognition Factor:* It doesn't matter if the *public* knows. It matters if *she* knows. If she reads it and feels exposed, the damage is done.
      *   *The Trust Aspect:* Confidence given during trauma is different than casual conversation. It was a lifeline, not an interview.
      *   *The "Greater Good" Trap:* Art helps people, yes. But art built on broken trust often carries a stain. Can the book be good if the author knows it hurt their sister?
      *   *Actionable Advice:*
          1.  Talk to her (risky but honest).
          2.  Change the core (hard but ethical).
          3.  Shelve it (last resort).
      *   *Closing:* Reiterate that the discomfort is a moral compass, not an obstacle.

  6.  **Refining the Tone:**
      *   Needs to be empathetic but firm.
      *   Avoid preaching, but clearly outline the ethical breach.
      *   Acknowledge the artistic value without letting it override the human cost.
