  7.  **Final Polish:** Check for clarity and impact. Ensure the distinction between "public identification" and "sister's identification" is clear. Emphasize that the *process* of extraction matters. (The "ledger" insight is the key hook).

  8.  *(Self-Correction post-drafting)*: Wait, I should be careful not to accuse the user of being malicious. They are struggling with this. Frame it as a common ethical dilemma for writers, but one where the specific relationship changes the stakes.

