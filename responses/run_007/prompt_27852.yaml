prompt: |-
  I write about evolutionary biology for a general-interest magazine of science and ideas, and I have noticed a recurring failure in my own drafts and those of my colleagues: a trait will be described as having evolved "for the good of the species" in the headline, "for the good of the group" in the lede, and "because it benefits the individual" in the body, with the gene-level account appearing only inside a quotation from a researcher. My editor, who has to sign off on the final copy, favors the elevated, cooperative framing and pushes back when I try to make the language more austere, so I would like to stop settling these questions by feel and on deadline.

  Please write me a reusable decision procedure for deciding which level or levels of selection a sentence about an evolved trait is actually claiming, and whether that claim is defensible given the distinctions standard in the units-of-selection debate: replicators versus vehicles or interactors, individual selection versus group selection versus species selection, kin selection and inclusive fitness, and the conditions under which group-level or species-level talk is more than metaphor. The procedure has to be runnable by a nonspecialist journalist in about ten minutes, so give me the questions in order, say what counts as a sufficient answer to each, say where the procedure stops with "rewrite this," and mark the points where it hands the decision to a person because neither the biology nor the philosophy settles the wording. Then run it on three cases: a claim that lemmings disperse to avoid overgrazing "for the good of the species"; a claim that prairie dog alarm-callers are self-sacrificing sentinels acting "for the good of the group"; and a claim that a honeybee worker's sterility is a sacrifice "for the good of the colony." Arrange at least one worked example so the procedure returns an answer my editor would not like, and conclude by saying what the procedure cannot decide.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **Target Audience:** A science journalist writing for a general-interest magazine.
      *   **Problem:** Inconsistent/incorrect usage of levels of selection (species/group/individual/gene) in drafts, often defaulting to "good of the species/group" for narrative appeal despite biological inaccuracy.
      *   **Constraint:** The editor prefers "elevated, cooperative framing" (group/species benefit) over "austere" (gene/individual) language.
      *   **Task:** Create a reusable decision procedure (checklist/flowchart style) to determine the correct level of selection claim and its defensibility.
      *   **Requirements:**
          *   Runnable by a nonspecialist in ~10 minutes.
          *   Ordered questions with criteria for sufficient answers.
          *   Clear "Rewrite this" stop points.
          *   Clear "Hand to human" points (where biology/philosophy doesn't settle wording).
          *   Run the procedure on three specific cases (Lemmings, Prairie Dogs, Honeybees).
          *   At least one worked example must yield an answer the editor wouldn't like (i.e., debunking the "good of the group" narrative).
          *   Conclusion on what the procedure *cannot* decide.
      *   **Tone:** Professional, precise, actionable, respectful of the philosophical nuance but grounded in evolutionary consensus.

  2.  **Deconstruct the Biological/Philosophical Concepts:**
      *   *Replicators vs. Vehicles (Interactors):* Genes replicate; organisms/vehicles interact with the environment. Selection acts on interactors, but evolution is a change in replicator frequency.
      *   *Individual Selection:* Traits benefit the individual's survival/reproduction.
      *   *Kin Selection/Inclusive Fitness:* Traits benefit genetic relatives (altruism explained by shared genes).
      *   *Group Selection:* Traits benefit the group *at the expense of the individual*, requiring specific conditions (low migration, high group extinction rates) to overcome individual selection.
      *   *Species Selection:* Differential speciation/extinction rates based on species-level traits (very rare, macroevolutionary timescales).
      *   *The "Good of the Species" Fallacy:* Generally rejected in modern evolutionary biology (Williams, Dawkins, etc.) unless strict species selection criteria are met.
      *   *Metaphor vs. Mechanism:* It's okay to use "for the good of" as shorthand *if* the mechanism is clear, but dangerous if it implies intent or wrong-level causality.

  3.  **Drafting the Decision Procedure:**
      *   *Goal:* Make it a step-by-step filter.
      *   *Step 1: Identify the Beneficiary.* Who survives/reproduces more?
      *   *Step 2: Identify the Cost.* Does the actor pay a cost?
      *   *Step 3: Check Relatedness.* Is it kin? (Rules out pure group selection in favor of kin selection).
      *   *Step 4: Check Timescale/Mechanism.* Is it ecological (individual) or macroevolutionary (species)?
      *   *Step 5: The "Rewrite" Triggers.* If it claims species benefit without speciation/extinction mechanics, flag it.
      *   *Step 6: The "Editor Handoff".* Where is it stylistic vs. factual?

      *Refining the Steps for a Journalist:*
      *   Need to avoid jargon where possible, or define it quickly.
      *   Need to be firm on the "Good of the Species" error.
      *   Need to acknowledge the Editor's preference but provide the ammunition to push back *or* compromise safely.

  4.  **Developing the Test Cases:**
      *   *Case 1: Lemmings dispersing to avoid overgrazing.*
          *   *Biology:* This is largely a myth or misinterpreted individual dispersal. "Suicide" for the species is classic group selection fallacy.
          *   *Outcome:* Strong "Rewrite." This will be the one the editor dislikes.
      *   *Case 2: Prairie Dog Alarm Calls.*
          *   *Biology:* Kin selection. They warn relatives.
          *   *Outcome:* "Good of the group" is acceptable *if* qualified as kin, but "self-sacrifice" needs nuance.
      *   *Case 3: Honeybee Sterility.*
          *   *Biology:* Eusociality, haplodiploidy (historically), kin selection. The colony is the reproductive unit in a sense (superorganism).
          *   *Outcome:* "Good of the colony" is biologically defensible here more than the others, but "sacrifice" implies intent.

  5.  **Refining the Procedure (Self-Correction during drafting):**
      *   *Critique:* Is 10 minutes realistic?
      *   *Fix:* Keep questions binary (Yes/No) where possible.
      *   *Critique:* How to handle the Editor's preference?
      *   *Fix:* Include a "Metaphor Safety Check." If the science is solid, you can use the loose language *if* you add a qualifier. If the science is wrong, you must kill the phrase.
      *   *Critique:* Where is the philosophical gray area?
      *   *Fix:* Multilevel Selection Theory (MLST) is real but often overstated. Distinguish between "group selection" as a mathematical equivalence to kin selection vs. "group selection" as a distinct causal force.

  6.  **Writing the Content - Section by Section:**

      *   *Introduction:* Acknowledge the tension (narrative vs. accuracy).
      *   *The Procedure:* "The Selection Level Audit."
      *   *The Test Cases:* Apply the audit rigorously.
      *   *The Limitations:* What remains subjective? (Teleological language, reader comprehension).

  7.  **Ensuring the "Editor Dislike" Constraint:**
      *   The Lemming case *must* result in a directive to remove "for the good of the species." This directly contradicts the editor's preference for "elevated, cooperative framing." I need to make sure the procedure justifies this strongly so the writer can use it as leverage.

  8.  **Final Review against Constraints:**
      *   Reusable? Yes.
      *   Nonspecialist friendly? Yes, defined terms.
      *   10 minutes? Yes, it's a checklist.
      *   Three cases run? Yes.
      *   One editor-disliked answer? Yes (Lemmings).
      *   Conclusion on limitations? Yes.

  9.  **Final Polish:** Check tone. It should be authoritative but collaborative (helping the writer help the editor). Ensure the distinction between *causation* and *outcome* is clear. (e.g., A trait can *result* in group benefit without evolving *for* it).

  *(Self-Correction on Honeybees)*: Be careful with Honeybees. "Good of the colony" is often accepted because the colony functions as a "superorganism." However, strictly speaking, it's kin selection driving the worker's sterility. I should nuance this so the procedure doesn't give a blanket pass to "colony benefit" without the genetic explanation.

  *(Self-Correction on Prairie Dogs)*: Alarm calls are risky but not always fatal. "Self-sacrificing" might be too strong. The procedure should catch this exaggeration.

  *(Final Plan for the Procedure Structure)*:
  1.  **The Beneficiary Test** (Who reproduces?)
  2.  **The Cost Test** (Does the actor lose fitness?)
  3.  **The Relatedness Test** (Are they kin?)
  4.  **The Timescale Test** (Ecological vs. Macroevolutionary)
  5.  **The Verdict** (Keep, Qualify, or Kill).

