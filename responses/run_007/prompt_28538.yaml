      *   *D6: The Interpreter Bias Correction.* Motivation: ELIZA effect. Rules out anecdotal "it feels smart." Rules in controlled eval.
      *   *D7: The Scalability Condition.* Motivation: Emergent abilities. Rules out static definitions of understanding. Rules in dynamic thresholds.

