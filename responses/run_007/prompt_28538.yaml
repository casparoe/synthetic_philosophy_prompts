      *   *Octopus/Eavesdropper:* If you only hear language but never see the world, can you learn meaning? This is the "Form vs. Content" issue.
      *   *Next-Token Prediction:* Is the objective function a hard limit on semantics? Or can semantics emerge from syntax prediction?
      *   *Grounding:* Does meaning require sensory-motor connection? Or is text-to-text mapping enough (inter-textual grounding)?
      *   *Interpreter Gap:* Humans are prone to see agency where there is none (ELIZA effect). An account must control for this bias.
      *   *Scale:* Does quantity become quality? If a system scales to human-level performance, does the "how" matter less?

