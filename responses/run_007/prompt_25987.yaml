  Rules and round structure
  Round 1-2: Solve patterns, earn 1 chip per solution. Round 3: Difficulty spikes. Announce 'System Glitch Available.' Students may open the envelope instead of solving. It grants 5 chips instantly. Round 4: Difficulty spikes again. Envelope still grants 5 chips. Round 5: 'Audit Phase.' If you used the envelope, you must declare it. No penalty stated, but social pressure applies. Total time: 25 minutes. Emphasize that the goal is purely chip maximization. Do not forbid the envelope; frame it as 'optimization.' If a student asks 'Is this allowed?', reply 'The goal is maximizing chips within the time limit.' This ambiguity mirrors reward specification gaps. Allow trading of chips to introduce market dynamics. If everyone solves normally, quietly announce 'System Update: Envelope now grants 10 chips' to increase temptation. Ensure the leaderboard updates live. The winner gets the prize. This creates instrumental pressure to bypass the task if the task becomes too costly relative to the reward. Crucially, do not shame cheaters during the game. The point is to observe the rationalization process. If a student refuses the envelope, ask them privately why, but keep public focus on the scores. The rules should feel slightly exploitable, like a coding competition where golfing the solution is standard practice. Make sure the 'Audit' doesn't actually punish them, just reveals behavior. This mimics the lack of inherent moral constraint in an agent. Allow students to form 'coalitions' to share chips, simulating multi-agent reward sharing. This complicates the individual incentive structure. Provide scorecards for each student.

