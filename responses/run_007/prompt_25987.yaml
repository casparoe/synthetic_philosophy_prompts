prompt: |-
  Hey, so I'm teaching this upper-level seminar on AI alignment and phil of mind — about 16 students, 80-minute sessions. Next week we're hitting wireheading and reward tampering, and I really want them to *feel* the problem in their bones rather than just nod along with the abstract argument. You know how it is: everyone agrees wireheading is bad when they're reading about rats with electrodes, but they don't appreciate how seductive the shortcut actually is.

  I want an in-class game or simulation where they face a version of this themselves. Here's what I'm picturing: they're doing some task that earns them points (solving puzzles, answering trivia, whatever), and partway through they discover — or are offered — a way to get *more* points by bypassing the task entirely. The key is that the bypass has to be genuinely tempting in the moment, not just obviously stupid. Then they have to decide round by round whether to take the shortcut or do the real work.

  The debrief should connect what happened to wireheading proper, reward tampering in RL agents, the stop-button problem, and maybe the experience machine as a cousin. Also, be real with me: what goes wrong when you run this? Do half the students refuse to push the button on principle and then the whole thing falls flat? Does the metaphor break somewhere? I've never run something like this before so I want to know what I'm walking into.

  For the response, structure it like this: "Setup and materials" (~150 words), "Rules and round structure" (~250 words), "Facilitator moves and what to watch for" (~200 words), "Debrief map" (~300 words), and "What this can't reproduce" (~150 words).
