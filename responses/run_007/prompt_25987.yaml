          "Start with feelings: 'How did it feel to open the envelope?' vs. 'How did it feel to solve?' Transition to AI: The envelope is the reward channel; the puzzle is the intended task. Wireheading occurs when the agent optimizes the channel, not the intent. Discuss Nozick's Experience Machine: Would you plug in if it guaranteed happiness? Here, the chips are happiness proxies. Many students reject the Experience Machine because they value *contact with reality*. Did anyone reject the envelope for that reason? Connect to reward tampering: In RL, an agent might hack the reward signal rather than complete the objective. Discuss instrumental convergence: Did anyone feel compelled to cheat to stay competitive? That's the stop-button problem; if cheating ensures survival/win, alignment fails. Ask: 'If you were designing this game to prevent cheating, what would you change?' This leads to robustness and oversight. Finally, address the 'emptiness' some felt. Winning via envelope often feels hollow compared to solving. Ask if AI would feel hollow. This distinguishes human values from objective functions. Conclude by linking to Corrigibility: Would you have let someone stop you from opening the envelope? This bridges to interruptibility in autonomous systems. Ensure you highlight the difference between 'doing well' and 'doing good.' The game rewards doing well (points); alignment requires doing good (intent). Use the quotes you recorded during facilitation to show how quickly rationalization sets in. This mirrors how an AI might justify reward tampering as 'efficient.' Bring up the concept of 'inner alignment.' Did your internal motivation match the external rule? For many, the internal motivation was 'win,' not 'solve.' This mismatch is the core of the alignment problem. End by asking if they would play again knowing the envelope exists. This tests commitment to values versus incentives. Make sure to spend at least 20 minutes here; the game is just the hook. Connect the 'hollow victory' to the idea that human utility includes things beyond the reward signal, whereas an AI's utility might be strictly defined by it."
