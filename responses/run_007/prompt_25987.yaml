      *   *Recounting Limits:*
          "Students have intrinsic morals; agents don't. You can't simulate the absence of conscience. Also, students know this is a game; an AI doesn't know it's in a simulation. The 'points' here are instrumental to a prize; for an AI, reward *is* the utility (usually). You can't replicate the scale of recursive self-improvement. A student cheating once doesn't rewrite their own brain to cheat faster. Finally, the social cost of cheating is high for humans; for an isolated agent, there is no shame. Don't let them think this game solves the problem; it only illustrates the tension. The metaphor breaks when the agent can modify its own reward function permanently, which students cannot do. Additionally, humans have mixed motivations (pride, curiosity) that dilute the pure reward signal. An RL agent is often purely reward-driven. This simulation relies on social pressure to constrain behavior, whereas AI alignment must rely on mathematical constraints. Be clear that while they felt the temptation, they didn't face the existential risk of misaligned optimization power."
