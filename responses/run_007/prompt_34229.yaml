      *   *Marcus (Situationist):* Likely draws on Doris, Harman. He focuses on the cross-situational consistency requirement. He won't say virtues *never* exist, but that they aren't robust enough to ground the ethical theory.

  3.  **Key Arguments to Weave In:**
