prompt: |-
  I'm taking a seminar that pairs moral philosophy with social psychology, and we've spent the last two weeks on the situationist critique of virtue ethics. The central charge, as I understand it, is that the empirical record—studies like Darley and Batson's Good Samaritan experiment, Milgram's obedience work, and the broader literature on the power of situational factors—shows that putatively stable character traits don't actually predict behaviour across contexts with anything like the consistency that virtue ethics requires. If that's right, then virtue ethics is prescribing the cultivation of something that doesn't, as a matter of psychological fact, exist in the way the theory needs it to.

  My seminar has been unusually civil about this, but I can tell two of my classmates hold genuinely opposed views and have never quite gone head-to-head on it. I'd like to see what that conversation would actually sound like if both sides were fully pressed.

  Write a dialogue between the two of them: one a virtue ethicist who takes the empirical challenge seriously, the other a philosopher defending the situationist critique. Neither should be a strawman—the virtue ethicist should be as philosophically and empirically sophisticated as the critic, and the critic should not caricature virtue ethics or ignore its best replies. The dialogue should contain real back-and-forth: each should respond to the other's actual arguments rather than pivoting to a new point, and neither should concede too easily. Where the empirical evidence itself is contested or ambiguous, let that surface in the exchange rather than being settled by fiat. And please include a brief closing note that separates what is genuinely settled among people working on this from what remains live and contested—don't present a contested reading of the evidence as the consensus.
