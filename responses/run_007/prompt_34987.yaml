  # The He Jiankui Affair as a Stress Test for the Unilateralist's Curse

  **Abstract:** *The unilateralist's curse posits that when multiple actors can independently initiate an action with collective consequences, the action is likely to occur if even one actor judges it favorable, regardless of the consensus against it. This analysis applies that framework to the 2018 creation of CRISPR-edited infants by He Jiankui. While the case validates the curse's warning regarding the fragility of moratoria, it exposes theoretical blind spots concerning bad-faith actors, institutional gatekeeping, and the asymmetry of incentives. I argue that the curse must be supplemented with a theory of compliance costs and transparency to remain policy-relevant in the era of dual-use biotechnology.*

  ---

  ### I. Structural Mapping: The CRISPR Babies as a Unilateralist Scenario

  To evaluate the He Jiankui episode through the lens of the unilateralist's curse, we must first translate the historical particulars into the formal variables defined by Bostrom, Douglas, and Sandberg (2016). The curse describes a decision structure where an action $A$ is taken if $\exists i \in \{1...N\}$ such that $Actor_i$ chooses to initiate $A$. The collective outcome is determined by the minimum threshold of reluctance among the set.

  **1. The Set of Actors ($N$)**
  In the formal model, $N$ represents the number of agents capable of unilaterally executing the action. In this case, $N$ is not "all scientists," but the subset of principal investigators with: (a) mastery of CRISPR-Cas9 delivery in human embryos, (b) access to IVF clinical infrastructure, and (c) willingness to breach ethical norms. In 2018, estimates suggested dozens of labs globally possessed the technical capacity (US, UK, China, Russia, etc.). However, the *effective* $N$ was constrained by regulatory environments. He Jiankui operated in a context where national regulations existed but were ambiguously enforced. Thus, $N$ was small, but non-zero.

  **2. The Action ($A$)**
  $A$ is the implantation of gene-edited human embryos resulting in live birth (clinical germline editing). Crucially, $A$ possesses the property of **high irreversibility**. Once the children (Lulu and Nana) were born, the genetic modification entered the human gene pool (potentially heritable), and the psychological/social precedent was set. Unlike a failed nuclear test which can be contained, a live birth cannot be "un-happened."

  **3. Threshold Judgments ($T_i$)**
  Each actor $i$ holds a threshold $T_i$ representing the minimum expected value ($EV$) required to proceed.
  *   **The Consensus ($T_{majority}$):** The 2015 International Summit and subsequent statements established a high threshold: proceed only when safety is assured, necessity is proven, and broad societal consensus exists. For most $i$, $EV(A) < T_{majority}$.
  *   **The Unilateralist ($T_{He}$):** He Jiankui's threshold was significantly lower. His calculation weighed the potential benefit (HIV resistance, though medically unnecessary given the father's status and existing prevention methods) and private goods (fame, commercial valuation of his startup) against the risks (off-target mutations, societal backlash). He judged $EV(A) > T_{He}$.

  **4. The Mechanism of Determination**
  The curse operates on a "minimum vote" rule. The global status of human germline editing shifted from "theoretical prohibition" to "accomplished fact" not via a majority vote, but via the single decision of He. The mechanism here was **precedent erosion**. By acting, He lowered the barrier for future actors; the "taboo" was proven breakable. The outcome for the global scientific community (increased scrutiny, loss of public trust, regulatory crackdowns) was imposed by the single actor with the lowest inhibition.

  **5. Assumption Check**
  *   *Independence of Judgment:* **Partially Holds.** While He claimed he acted on his own conviction, his secrecy suggests he anticipated the disagreement of peers. The curse usually assumes honest epistemic disagreement; here, we see epistemic isolationism.
  *   *Irreversibility:* **Holds Strongly.** The biological and normative changes are durable.
  *   *Symmetry:* **Fails.** The model often assumes actors are roughly symmetric in capability. He relied on specific loopholes in the Chinese regulatory system and a complicit hospital ethics committee that other actors might not have accessed.

  ---

  ### II. Explanatory Power: What the Curse Captures and What It Misses

  The unilateralist's curse provides a powerful diagnostic for *why* the 2015 moratorium failed, but it offers a reductive account of *who* He Jiankui was and *how* the failure occurred.

  **What the Curse Explains Well**
  1.  **The Fragility of Soft Governance:** The curse elucidates why summit declarations and professional norms are insufficient for high-stakes technology. As long as the technical capability is distributed ($N > 1$) and the action is unilateral, a norm based solely on voluntary compliance is mathematically destined to fail eventually. The probability of at least one actor crossing the threshold approaches 1 as time $t \to \infty$, even if the mean $EV$ is negative.
  2.  **The Distribution of Opinion:** The episode illustrates the "tail risk" of scientific opinion. Even if 99% of geneticists believe germline editing is net-negative, the existence of the 1% outlier determines the timeline of deployment. The curse correctly identifies that the *variance* in risk tolerance is more dangerous than the *mean*.
  3.  **The Imposition of Externalities:** The curse highlights that the costs of He's action were socialized (global reputational damage to genetics, stricter regulations for all researchers) while the benefits were privatized (He's career, the hospital's prestige). This aligns with the curse's premise that the actor does not internalize the full cost of the unilateral decision.

  **What the Curse Misses or Distorts**
  1.  **The Assumption of Benevolence:** The formalization of the curse typically assumes actors are trying to maximize global value but differ on the empirical probabilities. He Jiankui, however, appears to have maximized *personal* utility (fame, profit) while knowingly externalizing risk. This is less a "unilateralist's curse" and more a "rogue actor" problem. The curse framework struggles to distinguish between a conscientious dissenter (who thinks they are saving the world) and a norm entrepreneur seeking prestige.
  2.  **Institutional Gatekeeping:** The model treats actors as atomic units. In reality, He did not act alone; he required the complicity of a hospital, an ethics committee (which he deceived), and funding sources. The curse focuses on the *initiator*, missing the *enablers*. A more accurate model would view the action as requiring a chain of unilateral decisions, not just one.
  3.  **Secrecy vs. Deliberation:** The curse often envisions a scenario where actors might coordinate if they could. He actively avoided coordination. He announced the success *after* the births to prevent intervention. The curse implies a failure of agreement; this was a failure of transparency. The "curse" was weaponized by secrecy.
  4.  **State Interest and Geopolitics:** The formal model is stateless. In reality, the "actors" are embedded in national jurisdictions. China's specific regulatory environment (rapid innovation, sometimes lax enforcement) was a variable. The curse does not account for the possibility that states might implicitly encourage unilateralism to gain strategic advantage (a "biotech race"), altering the $EV$ calculation for the actor.

  ---

  ### III. Theoretical Implications: Revising the Curse for Biotechnology

  Running the analysis in reverse, the He Jiankui episode reveals boundary conditions of the unilateralist's curse. It confirms the central insight—that distributed capability undermines collective restraint—but suggests the theory is too "thin" to guide policy in domains where bad faith and institutional complexity matter.

  **1. Confirming the Central Insight**
  The case validates the core warning: **Capability without coordination leads to premature deployment.** The existence of the technical capacity in multiple jurisdictions created a "race to the bottom" dynamic. Even if He had not acted, the pressure on other labs (in the US or UK) to "not let China win" might have eventually triggered a similar unilateral action. The curse correctly predicts that without a mechanism to raise the threshold $T$ uniformly, the lowest $T$ wins.

  **2. Exposing Boundary Conditions: The "Bad Faith" Problem**
  The curse relies on the **Principle of Conformity**: actors should refrain if they suspect they are outliers in a community of well-meaning experts. He Jiankui's actions suggest the Principle of Conformity fails when actors do not identify with the community's normative goals.
  *   *Revision:* We must distinguish between **Epistemic Unilateralism** (honest disagreement on risk/benefit) and **Strategic Unilateralism** (breaking norms for private gain). Policy responses for the former (more dialogue, data sharing) differ from the latter (criminal penalties, export controls).

  **3. Supplementing the Model: The Gatekeeper Variable**
  The episode suggests we should not model $N$ as the number of *scientists*, but as the number of *independent veto points*.
  *   *Proposal:* Revise the curse to account for **Institutional Friction**. If an action requires approval from $k$ independent gates (ethics board, hospital admin, national regulator), the probability of unilateral action drops exponentially. He Jiankui succeeded because he collapsed $k$ (by falsifying documents).
  *   *Policy Implication:* Governance should focus less on persuading the scientist (reducing $N$) and more on hardening the gates (increasing $k$ and their independence).

  **4. The Transparency Condition**
  The curse assumes the action is observable. He's secrecy allowed the action to complete before the "curse" could trigger a corrective response from the community.
  *   *Revision:* Add a **Transparency Parameter**. Unilateralism is most dangerous when actions can be concealed until *fait accompli*.
  *   *Policy Implication:* Mandatory registration of human embryo editing research (even if pre-clinical) creates a detection mechanism that raises the cost of unilateral action.

  **5. What to Give Up**
  To make the curse useful here, we must give up the assumption of **Epistemic Symmetry**. We cannot assume all actors have roughly similar access to information or similar motivations. In biotechnology, information asymmetry is high (the actor knows the risks better than the public) and incentive asymmetry is high (fame accrues to the breaker of the taboo, not the maintainer). A revised theory must integrate **Incentive Compatibility**: unless the rewards for conformity exceed the rewards for unilateralism, the curse will persist.

  ### Conclusion

  The He Jiankui episode is a paradigmatic, if pathological, instantiation of the unilateralist's curse. It demonstrates that in the absence of hard enforcement, the actor with the lowest risk tolerance dictates the future of the technology. However, treating it solely as a failure of epistemic coordination obscures the roles of deception, institutional failure, and perverse incentives.

  To remain relevant, the theory of the unilateralist's curse must evolve from a model of *honest disagreement* to a model of *strategic vulnerability*. We must recognize that in emerging technology, the "curse" is not just a statistical inevitability of diverse opinions, but a structural invitation to bad actors. The solution lies not merely in appealing to the Principle of Conformity, but in architecting systems where unilateralism is technically difficult, institutionally blocked, and transparently visible. The birth of Lulu and Nana was not just a scientific event; it was a stress test of our governance frameworks, and the results indicate that soft norms are no match for hard capability.
