answer: |-
  1. We agree that normative reasons are considerations that count in favor of actions and that sound deliberation is essential for agents to recognize and act on them. We further agree that agents are often mistaken about what they have reason to do and that correcting these mistakes requires rational scrutiny of their motivations and circumstances.
  2. Our residual disagreement concerns whether the truth of a reason ascription necessarily depends on the agent's existing motivational capacities. Specifically, we dispute whether a consideration can count in favor of an action for an agent even if no coherent deliberative route from their current motivations could lead them to be motivated by it.
  3. The internalist maintains that having a reason requires a potential motivational link reachable through sound deliberation from the agent's subjective set, while the externalist maintains that deliberation reveals reasons that exist independently of whether such a motivational link is possible.
  4. Our first crux is whether an agent lacking any motivational route to care about morality still has a moral reason to act morally, tested by the case of a deeply apathetic agent who cannot deliberate themselves into caring. The internalist predicts such an agent has no reason and blame is inappropriate, whereas the externalist predicts the reason exists regardless and blame remains fitting to acknowledge the normative truth.
  5. Our second crux is whether rationality constrains an agent's ends or only their means, examined through cases of instrumentally rational agents pursuing objectively worthless goals. The internalist predicts rationality is purely instrumental while the externalist predicts rationality forbids certain ends, and we agree no part of this dispute is merely verbal since both sides aim to capture the same normative authority despite differing truth conditions.
