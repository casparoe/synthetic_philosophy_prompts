answer: |-
  You have put your finger on one of the most significant problems in 20th-century epistemology. The phenomenon you are describing is real, it has a name, and there is a rich literature surrounding it.

  The most precise term for what you are looking for is **Hinge Propositions** (or **Hinge Commitments**), derived from the later philosophy of **Ludwig Wittgenstein**, specifically his final notes published as ***On Certainty*** (1969).

  However, depending on whether you are looking at the *philosophical* breakdown (the creationist) or the *methodological* protection (the physicist protecting conservation of energy), there is a second crucial term from the philosophy of science: **The Hard Core** (from **Imre Lakatos**).

  Here is the breakdown of the concepts, why they fit your description better than "axiom" or "presupposition," and the core insight you can take away for your writing.

  ### 1. The Primary Term: Hinge Propositions
  **Source:** Ludwig Wittgenstein, *On Certainty*.

  Wittgenstein was grappling with G.E. Moore's attempt to prove the external world exists by holding up his hands and saying, "Here is one hand." Wittgenstein realized Moore was missing the point. You don't *know* you have hands in the same way you know you have a meeting at 2 PM. The existence of your hands is something that must be taken for granted *in order* for the concept of "knowing" to function at all.

  **The Metaphor:**
  Wittgenstein writes: *"If I want the door to turn, the hinges must stay put."*

  *   **Ordinary Empirical Beliefs:** These are the door. They move. They are open to investigation, testing, and revision (e.g., "What is the decay rate of uranium?").
  *   **Hinge Propositions:** These are the hinges. They do not move. If they move, the door (inquiry/debate) falls off.

  **Why it fits your description:**
  *   **Immunity to Revision:** You noted these beliefs have a "special immunity." Wittgenstein argues this isn't because they are infallibly true, but because they are **exempt from doubt** within that language game. To doubt them is not to be skeptical; it is to opt out of the game.
  *   **Conversation Collapse:** When the creationist says, "God created the world last Thursday," they are pulling a hinge. The physicist cannot argue against it because any evidence the physicist offers (starlight, fossils) *presupposes* the hinge (that the past is real and accessible). If the hinge is removed, the evidence loses its status as evidence.
  *   **Not Dogma:** Dogma implies a stubborn refusal to accept evidence. Hinge commitments are **pre-evidential**. You cannot gather evidence *for* them because they are the framework that makes evidence possible. As Wittgenstein says, *"At the foundation of well-founded belief lies belief that is not founded."*

  **Key Examples from *On Certainty*:**
  *   "The earth has existed for many years."
  *   "Objects don't vanish when no one is looking at them."
  *   "My name is N.N."

  ### 2. The Scientific Variant: The Hard Core
  **Source:** Imre Lakatos, *The Methodology of Scientific Research Programmes* (1970).

  You mentioned the physicist who would "sooner doubt the experiment than the principle" of conservation of energy. This is slightly different from the creationist example. The creationist is attacking a *universal* hinge (the reality of the past). The physicist is protecting a *local* hinge specific to a scientific paradigm.

  Lakatos calls this the **Hard Core** of a research programme.

  *   **The Hard Core:** The fundamental assumptions (e.g., conservation of energy, naturalism, the uniformity of physical laws). These are treated as **irrefutable by methodological decision**.
  *   **The Protective Belt:** The auxiliary hypotheses, experimental setups, and specific theories surrounding the core. When an anomaly arises (e.g., an experiment seems to violate energy conservation), scientists adjust the *protective belt* (check the equipment, look for neutrinos) rather than the *hard core*.

  **Why it fits:**
  This explains why the physicist isn't being dogmatic. It is "good scientific judgment" because abandoning the Hard Core would dissolve the entire research programme. You cannot do Newtonian physics if you allow energy to vanish randomly. Lakatos argues this isn't a weakness of science; it's a structural necessity. Science progresses by protecting the core while adjusting the belt, until the programme becomes "degenerate" (too many patches) and is replaced.

  ### 3. Why "Axiom" and "Presupposition" Don't Work
  You were right to reject these terms.

  *   **Axiom:** Implies a formal system (like math) where rules are consciously chosen. Hinge propositions are not chosen; they are inherited. We find ourselves already holding them. We don't decide "I will assume the past exists"; we simply cannot act without assuming it.
  *   **Presupposition:** In linguistics, a presupposition can often be cancelled or negotiated (e.g., "I didn't realize the King of France was bald" presupposes there is a King of France, but we can discuss that). Hinge propositions cannot be negotiated without ending the discourse.

  ### 4. The Core Insight for Your Beat
  If you are writing about this, the core epistemological insight is **The Limits of Justification**.

  In a debate, we usually assume that if someone makes a claim, they should justify it. But justification has to stop somewhere. If you demand justification for *everything*, including the rules of justification, you end up in an infinite regress.

  *   **The Creationist Move:** They exploit the fact that all justification rests on unproven hinges. They force the scientist to admit, "I cannot prove the past is real without assuming the past is real."
  *   **The Scientist's Move:** They recognize that some things are not claims to be proven, but **conditions for proving**.

  The "breakdown" you witness is not a failure of logic; it is a **clash of frameworks**. When a hinge is challenged, you are no longer having a disagreement *within* a system; you are having a disagreement *about* the system. And you cannot use the system to argue about the system.

  ### 5. Recommended Reading & Search Terms
  If you want to dig into the literature, here are the specific terms and texts to look for:

  1.  **"Hinge Epistemology"**: This is the contemporary field dedicated to Wittgenstein's *On Certainty*.
      *   **Key Contemporary Philosopher:** **Duncan Pritchard**. He writes accessibly on "Hinge Commitments" and how they solve skeptical problems.
      *   **Search:** "Wittgenstein On Certainty hinges," "Duncan Pritchard epistemic angling."

  2.  **"Incommensurability"**: From Thomas Kuhn (*The Structure of Scientific Revolutions*). This describes when two paradigms lack a common language to judge between them.
      *   **Relevance:** Explains why the physicist and creationist talk past each other.

  3.  **"Framework Principles"**: Sometimes used by philosophers like **P.F. Strawson** or **Wilfrid Sellars**. These are rules that constitute a practice rather than describing the world.

  4.  **"Last Thursdayism"**: In philosophy, this is a version of the **"Omphalos Hypothesis"** (named after an 1857 book by Philip Gosse). It is a classic **Skeptical Hypothesis**. The standard philosophical response isn't to refute it, but to dismiss it as **idle** (it makes no difference to practice).

  ### Summary for your article
  You can describe this as a **Hinge Conflict**.

  *   **Ordinary Debate:** Moves the door (testing specific claims).
  *   **Hinge Conflict:** Pulls the hinges (challenging the conditions that make testing possible).

  The physicist stops arguing not because they have lost, but because they recognize the creationist has stopped playing the game of empirical inquiry and has instead questioned the board the game is played on. In Wittgensteinian terms, the creationist has tried to speak outside of any language game, rendering their words meaningful only as a disruption, not as a proposition.

  The physicist's silence is the only rational response, because the only way to argue against a hinge is to point to the **form of life** (the actual practice of science) that renders the hinge unnecessary to state. As Wittgenstein famously concluded: *"If I have exhausted the justifications I have reached bedrock, and my spade is turned. Then I am inclined to say: 'This is simply what I do.'"*
