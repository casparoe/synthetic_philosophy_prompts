          *   *Core Idea:* Society is a partnership between the dead, the living, and the unborn. Prejudice (pre-judgment) and prescription are valuable. Change should be gradual to preserve the essence of the constitution.
          *   *Nuance:* Burke was *not* a static conservative. He supported the American Revolution, wanted reform in India (Hastings impeachment), and reform in Britain (economical reform). He believed in "a disposition to preserve and an ability to improve."
          *   *Verdict on Claims:* Claims 3, 4, 5 are broadly Burkean. Claim 7 is too strong (Burke wasn't against *all* change). Claim 1 is anachronistic but thematically linked.

      *   **Chesterton:**
          *   *Context:* *The Thing* (1929), essay "The Drift from Domesticity."
          *   *Core Idea:* "Chesterton's Fence." Don't remove a fence until you know why it was put there.
          *   *Nuance:* It's a rule of *prudence*, not an absolute prohibition. Once you know the reason, you *can* remove it. It's anti-rationalist hubris, not pro-status quo dogma.
          *   *Verdict on Claims:* Claims 2, 6 are accurate to the metaphor. Claim 7 overstates it (Chesterton was a distributist, wanted significant economic change). Claim 1 is a common popular linkage but simplifies Burke.

      *   **Conflation/Overstatement:**
