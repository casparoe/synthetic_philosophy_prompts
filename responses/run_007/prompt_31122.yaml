answer: |-
  The slogan is either a trivial Bayesian truth that doesn't rule out miracles or a question-begging falsehood that does, and your friend is likely using it as the latter while pretending it is the former.

  To understand why, we must first disentangle the semantic ambiguity of the phrase. "Extraordinary" could mean statistically improbable, contrary to established laws, or simply surprising. "Evidence" could mean the quantity of testimony, the quality of verification, or the logical force of counter-arguments. "Require" could imply a probabilistic threshold, a pragmatic rule of thumb, or a logical impossibility. If "extraordinary claim" means "low prior probability" and "extraordinary evidence" means "high likelihood ratio," the principle is mathematically true but doesn't forbid miracles. If "extraordinary claim" means "violation of natural law" and "extraordinary evidence" means "evidence that overrides natural law," the principle becomes circular, assuming the very point in dispute. If "require" means "we psychologically demand more," it is a description of bias; if it means "rationally necessitate," it is a normative claim needing justification. Your friend treats the slogan as a conversation-stopper, which suggests she interprets "require" as a logical block rather than a probabilistic hurdle.

  ### The Menu of Readings

  **1. The Bayesian Platitude**
  *   **Principle:** The posterior probability of a hypothesis depends on its prior probability; therefore, hypotheses with very low priors require evidence with a very high likelihood ratio to become probable.
  *   **Definitions:** "Extraordinary" = low prior probability ($P(H)$). "Evidence" = data with a high likelihood ratio ($P(E|H) / P(E|\neg H)$).
  *   **Status:** **Platitude.** This is a theorem of probability theory.
  *   **Implication for Testimony:** It does not dismiss testimony *a priori*. It merely states that testimony sufficient for a mundane claim (e.g., "I had soup") may be insufficient for a rare one (e.g., "I won the lottery"), but sufficiently strong testimony *could* theoretically establish the rare claim.
  *   **Dismissal Power:** **None.** It sets a high bar, not an impossible one.

  **2. The Evidential Quality Escalation**
  *   **Principle:** As a claim deviates further from normal experience, the *type* of evidence required must shift from weaker forms (testimony) to stronger forms (physical traces, direct observation).
  *   **Definitions:** "Extraordinary" = deviation from common experience. "Evidence" = epistemic security of the source (e.g., video > hearsay).
  *   **Status:** **Substantive and Defensible.** This is a pragmatic heuristic about risk management in belief formation.
  *   **Implication for Testimony:** It implies that testimony *alone* is categorically insufficient for miracles, regardless of its volume or reliability, because the *kind* of evidence is wrong.
  *   **Dismissal Power:** **High.** It rules out the specific kind of evidence (historical testimony) Hume was discussing.

  **3. The Definitional Stopper**
  *   **Principle:** A claim is "extraordinary" if it violates a law of nature, and by definition, no evidence can ever outweigh the evidence for a law of nature.
  *   **Definitions:** "Extraordinary" = violation of a law of nature. "Evidence" = any human testimony.
  *   **Status:** **False/Question-Begging.** This assumes the law of nature is indefeasible, which is precisely what the miracle report challenges.
  *   **Implication for Testimony:** Testimony is logically incapable of establishing a miracle.
  *   **Dismissal Power:** **Total.** This shuts down discussion by fiat.

  **4. The Humean Maxim**
  *   **Principle:** No testimony is sufficient to establish a miracle unless the falsehood of that testimony would be more miraculous than the fact it endeavors to establish.
  *   **Definitions:** "Extraordinary" = contrary to uniform experience (a law of nature). "Evidence" = the balance of experience for the testimony's reliability vs. experience for the law of nature.
  *   **Status:** **Substantive and Defensible (within Hume's system).** This is Hume's actual argument in *Enquiry* Section X.
  *   **Implication for Testimony:** Testimony is weighed against the uniform experience supporting the law of nature. It is not dismissed *a priori*, but Hume argues it will *de facto* always lose this weighing contest.
  *   **Dismissal Power:** **Contingent.** It allows for the logical possibility of a miracle but argues it is never rational to believe one has occurred based on testimony.

  ### Charitable Reconstruction and Hume's Commitment

  The most charitable reconstruction of your friend's meaning is **Reading 1 (The Bayesian Platitude)**. She likely intends to say that low-probability events need strong confirmation, which is uncontroversial. However, her usage—shutting down discussion—reveals she is operating on **Reading 3 (The Definitional Stopper)**. She treats the slogan as a veto rather than a weight, implying that the "extraordinary" nature of the claim inherently disqualifies the evidence offered, regardless of its quality.

  Hume's own argument commits him to **Reading 4 (The Humean Maxim)**, which is a specific, rigorous version of Reading 1. Hume does not claim that miracles are impossible or that evidence is categorically excluded; he claims that the evidence *against* the miracle (uniform experience of natural laws) constitutes a "proof," and the evidence *for* it (testimony) must constitute a superior "proof" to overcome it. He argues this balance will never tip in favor of the miracle because human testimony is always prone to error, delusion, or deceit, whereas natural laws are unalterable.

  The slogan "extraordinary claims require extraordinary evidence" is a **crude stand-in** for Hume's argument that does significant epistemic damage. It obscures the weighing mechanism central to Hume's view. Hume argues we must weigh two miracles: the miracle of the event vs. the miracle of the testimony being false. The slogan suggests the *claim itself* dictates the evidence requirement, whereas Hume argues the *counter-evidence* (the law of nature) dictates the burden. By using the slogan, your friend bypasses Hume's careful balancing act and replaces it with a vague intuition that functions as a conversation-stopper rather than a philosophical argument. On its best reading, the slogan adds nothing to Hume; on its worst reading, it commits the fallacy of begging the question against the possibility of miracles.
