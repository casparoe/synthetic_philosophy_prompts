      *   **Distinguishing Case:** A solitary animal with high tool use vs. a social animal with low tool use. Or, a hypothetical "Robo-Octopus" that shares data but has no culture. Better: A species that learns socially but *doesn't* accumulate improvements (static social learning) vs. one that does (ratcheting).
