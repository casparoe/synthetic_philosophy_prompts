      *   *Major Hurdle 1 (The Generality Problem):* If anti-realism is a theory of *truth*, restricting KP to "basic" propositions seems to abandon the claim that *truth* is knowable. It looks like "Basic truths are knowable, but other truths...?" If truth is constituted by verifiability, *all* truths should be knowable in principle. Restricting it looks like saving the principle by sacrificing the anti-realist thesis.
      *   *Major Hurdle 2 (The Iteration/Embedding Problem):* Fitch sentences ($p \land \neg Kp$) are truths if $p$ is an unknown truth. If the anti-realist says "That's not a basic proposition, so KP doesn't apply," the realist asks: "Is it true?" If yes, why isn't it knowable? If truth = knowability, then it *must* be knowable. Denying KP for this class looks like admitting some truths aren't knowable, which collapses anti-realism into realism (or agnosticism).
      *   *Major Hurdle 3 (Intuitionistic Alternative):* The Dummettian claim is strong: Intuitionistic logic blocks the collapse ($Kp$ doesn't follow classically). Restricting KP while keeping classical logic often feels like patching a leak rather than fixing the foundation.
