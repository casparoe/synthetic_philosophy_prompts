answer: |-
  One of the most profound conceptual issues that arises when taking the meme-gene analogy seriously is **the Problem of Discrete Individuation** (often called the "Boundary Problem").

  This is not merely a practical difficulty in counting cultural traits; it is a fundamental ontological mismatch between the requirements of Darwinian population genetics and the nature of cultural information.

  ### The Biological Baseline: Particulate Inheritance
  In standard neo-Darwinian biology, the unit of selection (the gene or allele) is **discrete and physically individuated**. A specific sequence of nucleotides occupies a specific locus on a chromosome. While epistasis (gene interaction) exists, the *identity* of the gene is maintained independently of its context. You can sequence a strand of DNA and objectively determine whether Allele A or Allele B is present, regardless of the organism's environment or the observer's interpretation. This discreteness allows for **particulate inheritance**: traits do not blend away; they remain distinct units that can be tracked mathematically across generations. This allows researchers to calculate precise frequencies ($p$ and $q$) and apply models like the Price Equation or Hardy-Weinberg equilibrium.

  ### The Cultural Problem: Semantic Holism
  In the cultural domain, "memes" lack physical loci. They are individuated not by physical structure, but by **semantic meaning** or **function**. This creates a conceptual crisis for Darwinian analysis because meaning is inherently contextual, continuous, and holistic.

  Consider a simple example: **The "High-Five."**
  *   Is the "High-Five" a single meme?
  *   Or is it a combination of a "hand-raising meme" and a "slapping meme"?
  *   Is a "Low-Five" a mutation of the High-Five, or a distinct meme?
  *   Is it part of a larger "Greeting Ritual" meme complex?

  In genetics, a mutation is a specific change in base pairs. In culture, the "identity" of the trait depends on how the participants *interpret* it. If two people slap hands but miss, is that a failed replication of the High-Five, or a successful replication of a "Failed High-Five" meme? There is no physical fact of the matter; there is only interpretive consensus.

  ### Why This Breaks Darwinian Analysis
  This is a genuine conceptual issue rather than a loose analogy because it renders the **mathematics of selection incoherent**.

  Darwinian evolution is defined as a change in the frequency of heritable units over time. To measure this, you must be able to define the unit *independently* of the selection process.
  1.  **Frequency Tracking:** If you cannot objectively distinguish where Meme A ends and Meme B begins, you cannot calculate their frequencies. If the boundaries are fluid, an increase in "High-Fives" might just be a re-categorization of existing hand-slapping behaviors rather than a genuine population shift.
  2.  **Fitness Assignment:** Natural selection requires assigning fitness values to specific units. If the unit is fuzzy, the fitness is unassignable. Does the "High-Five" have high fitness, or does the broader category of "Affiliative Touch" have the fitness? If you choose the broader category, you lose resolution; if you choose the narrower one, you risk arbitrary distinctions.
  3.  **Blending vs. Particulate:** Because cultural traits are defined by meaning, they tend to **blend**. If I combine the melody of Song A with the lyrics of Song B, I create a hybrid. In genetics, alleles remain distinct during meiosis. In culture, the "loci" merge. Blending inheritance rapidly reduces variance in a population, theoretically halting selection unless there is a mechanism to restore discrete variation (which culture lacks in the strict Mendelian sense).

  ### The Conceptual Consequence
  The implication is that you cannot simply plug cultural data into population genetics models. The "replicator" logic assumes a **copying** mechanism (like DNA polymerase), but culture operates on a **reconstruction** mechanism.

  When you hear a story and retell it, you do not copy it; you reconstruct it based on your own cognitive biases, memory, and context. This means the "mutation" is not random noise added to a stable template; the "template" itself is generated during the transmission.

  This conceptual hurdle has led many evolutionary anthropologists (such as Dan Sperber) to argue that **memetics is the wrong framework**. Instead of tracking the differential survival of discrete replicators (Darwinism), they propose modeling culture as an **epidemiology of representations**, where the focus is on psychological *attractors* that cause similar ideas to be reconstructed independently, rather than ideas being "copied" faithfully.

  In summary, the Individuation Problem is not just a matter of "it's hard to define a meme." It is the realization that culture may not consist of discrete, countable units at all. If the units don't exist, the "differential survival of units" cannot be the mechanism of change, and the Darwinian analogy collapses at its mathematical foundation.
