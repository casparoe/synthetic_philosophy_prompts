answer: |-
  This is a remarkably coherent set of intuitions, even if they feel contradictory on the surface. You are grappling with the tension between **individual capacity** (sentience, cognition) and **relational status** (species membership, social contract).

  Most people try to force their views into a single axis (e.g., "only sentience matters" or "humans are sacred"). Your verdicts suggest you are actually operating on a **Two-Factor Theory of Moral Status.**

  Here is the principle that best accommodates your data, the cost of holding it, and the prediction you requested.

  ### The Principle: "Graduated Interests with Human Inviolability"

  Your ethics are governed by two distinct metrics that operate in parallel:

  1.  **The Capacity Axis (Interests):** The moral weight of *suffering* and *killing* is determined by cognitive complexity and sentience. The richer the mental life, the stronger the interest in continuing to live and the worse the suffering.
  2.  **The Membership Axis (Rights):** Humans possess a special **inviolability against instrumentalization** (experiments, organ harvesting) simply by virtue of species membership, *provided they possess any consciousness at all.*

  **The Constraint:** The Membership Axis (Human Inviolability) goes dormant if consciousness is permanently absent (PVS, Anencephalic). In those cases, the individual reverts entirely to the Capacity Axis (where they score near zero).

  ---

  ### How This Fits Your Verdicts

  | Case | Capacity Axis | Membership Axis | Verdict Explanation |
  | :--- | :--- | :--- | :--- |
  | **Killing Dog** | High (Sentient/Social) | None | Wrong due to high Capacity interest in living. |
  | **Killing Mice** | Low (Sentient) | None | Fine due to low Capacity interest + self-defense (grain). |
  | **Factory Pigs** | High (Suffering) | None | Wrong due to Capacity (suffering). "Happy pork" is fine because Capacity interest in *living* is outweighed by diet choice. |
  | **Macaque Experiment** | High (Cognitive) | None | Permissible. High capacity creates unease, but no Membership right blocks it. |
  | **Disabled Child Experiment** | Low (Cognitive) | **Active** | **Not Permissible.** Membership Axis trumps Capacity Axis. They cannot be used as means, regardless of cognitive score. |
  | **Engineered Pig** | Very High (Child-level) | None | Wrong to kill. Capacity Axis raises the value of their life to match a child's. |
  | **PVS Human** | Zero (None) | **Dormant** | Fine to withdraw/harvest. No consciousness means Membership protection lapses. Consent handles the procedural ethics. |
  | **Anencephalic Infant** | Zero (None) | **Dormant** | Fine to let die/kill. Lapses to Capacity Axis (near zero value). |
  | **"Bother" / "Balk"** | N/A | **Symbolic Residue** | The "bother" at PVS organ harvesting and "balking" at equating Anencephalic with pigs is **Symbolic Respect** for the human form, even when moral status is low. |

  ### The Outliers and The Cost

  This principle fits 90% of your verdicts, but to keep it, you must accept two uncomfortable conclusions that your intuitions currently waver on:

  **1. You must admit to Speciesism.**
  Your view on the Macaque vs. the Disabled Child is the smoking gun. You explicitly prioritize a human with *lower* cognitive capacity over a non-human with *higher* cognitive capacity regarding experimentation.
  *   **The Cost:** You cannot claim your ethics are purely based on "capacity for welfare." You must acknowledge that being human grants a specific *right* (inviolability) that a cognitively superior alien or animal would not have.

  **2. The Engineered Pig Paradox.**
  Your principle implies that while killing the Engineered Pig is as wrong as killing a child (Capacity Axis), **experimenting** on that pig might be permissible (no Membership Axis).
  *   **The Cost:** You would have to accept that it is wrong to *kill* the engineered pig for food, but potentially permissible to *experiment* on it to save children, whereas you could do neither to a human child with the same mind. If this feels wrong to you, your Membership Axis might need to extend to "Personhood" regardless of species, which would break your Macaque verdict.

  **3. The Anencephalic/Pig Distinction.**
  You said you "balk at saying [killing an anencephalic] is the same as killing a pig."
  *   **The Cost:** Logically, under this principle, they *are* the same (both have zero consciousness, so both rely on the Capacity Axis where they score near zero). The pig might arguably be *higher* because it is sentient. To maintain your balk, you must lean on **Symbolic Respect**: the human form commands a residual deference that a pig carcass does not, even if neither has moral rights.

  ### The Prediction

  **Case:** *A human with a severe brain injury who permanently functions at the level of a healthy dog.*

  **Prediction:**
  1.  **Experimentation:** **Not Permissible.**
      *   *Reasoning:* Even though their Capacity Axis is equal to the dog (and lower than the macaque), the **Membership Axis is Active** because they are conscious and human. They are shielded from instrumentalization.
  2.  **Killing:** **Very Wrong.**
      *   *Reasoning:* They have the Capacity interest of a dog (which you say makes killing wrong) *plus* the Membership protection of a human.
  3.  **Care Obligation:** **High.**
      *   *Reasoning:* Unlike the dog, where you might make exceptions for convenience or property defense (mice), the human membership creates a relational duty of care that persists even at low cognitive levels.

  **The Tension Point:**
  This prediction highlights the exact friction in your system. You would be forced to say: *"It is wrong to experiment on this brain-injured human, even though it is permissible to experiment on a macaque that is smarter, feels pain more acutely, and has a richer emotional life."*

  ### Summary

  You are not a strict speciesist (you value the engineered pig over the anencephalic human), nor are you a strict sentientist (you value the disabled child over the macaque).

  You are a **Hybrid Intuitionist.** You believe **suffering and killing** are governed by **capacity**, but **rights and bodily integrity** are governed by **community membership.**

  To make this consistent, you have to stop looking for a single scale of "moral worth." Instead, accept that you are balancing two different currencies: **Interest** (which animals have) and **Inviolability** (which humans have). The friction you feel is the sound of those two currencies exchanging at a fluctuating rate.
