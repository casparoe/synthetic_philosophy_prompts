answer: |-
  1. A realist must explain the instrumental reliability of mature sciences without resorting to miraculous coincidence. This non-negotiable commitment grounds the initial inference from empirical success to approximate truth.

  2. Any adequate account must reconcile the truth of current theories with the historical record of successful but false predecessors. This non-negotiable constraint forces realists to qualify their truth claims to avoid refutation by induction.

  3. The position must justify theory choice when faced with empirically equivalent rivals that posit different unobservable structures. While non-negotiable, responses vary from appealing to super-empirical virtues to denying the prevalence of such cases.

  4. An adequate view must explain how strictly false idealizations and models can nonetheless yield genuine knowledge about the world. This non-negotiable desideratum addresses the gap between abstract theory and concrete physical systems.

  5. The position should demonstrate continuity in reference or structure across radical theory changes to buffer against the PMI. This is a preference of structural and entity realists rather than a strict requirement for all realist variants.

  6. The position must resolve the tension between explaining success via approximate truth and avoiding PMI via selective commitment. This non-negotiable coherence requirement highlights the conflict between robust truth commitments and historical caution.

  7. The position must provide a non-circular criterion for distinguishing true theoretical components from false ones. This non-negotiable epistemic constraint does the most to eliminate currently popular realist positions because most selective strategies fail this test.
