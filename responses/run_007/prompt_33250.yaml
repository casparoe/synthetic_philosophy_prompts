      *   Or maybe the Hempelian claim is stronger: without *some* generalization, narrative is just fiction. If narrative implies counterfactuals, does that smuggle in laws?
      *   My reasoning might fail if I underestimate the Hempelian claim that narrative *presupposes* laws even if unstated.

  5.  **Drafting the Response (incorporating constraints):**
      *   *Diagnosis:* It's not just equivocation. It's a normative clash over the *locus of explanatory power*. Hempelians prioritize *validation* (objective truth conditions); Narrativists prioritize *intelligibility* (subjective understanding). They agree on the text but disagree on what makes the text explanatory.
      *   *Progress:* Distinguish between the *context of discovery* (how historians write) and the *context of justification* (why we believe them). Progress happens if Hempelians admit narratives generate hypotheses while laws validate them, or if Narrativists admit narratives rely on implicit generalizations about human behavior. A test case: unique events vs. recurrent patterns.
      *   *Mind Change:* If it can be shown that narrative configuration *itself* has logical force independent of generalization (not just psychological comfort), my diagnosis shifts. Or if Hempelians prove narrative always collapses into trivial laws ("people act as they do").
      *   *Word Count Check:* Need to be concise.

  6.  **Refining the Argument:**
