      *(Drafting)*:
      This isn't merely equivocation; it's a normative clash over the *function* of explanation. The Hempelian side treats explanation as **validation**: demonstrating an event was objectively expectable given universal regularities. The narrative side treats explanation as **intelligibility**: making an event comprehensible within a specific human context. They agree on the text but disagree on what makes the text *work*. The Hempelian asks, "Why must this be true?" The Narrativist asks, "How does this make sense?"

      Progress requires distinguishing between the **logic of justification** (philosophers assessing truth claims) and the **economics of understanding** (historians conveying meaning). A productive reformulation would ask: "Does this explanation establish causal necessity (Hempel) or causal relevance (Narrative)?" A decisive case would be a unique, non-recurrent event (e.g., the specific timing of a revolution). If laws can only offer trivial generalizations ("people revolt when unhappy"), the narrative side wins on relevance. If the narrative offers no counterfactual support, the Hempelian side wins on rigor.

      Expect the seminar to stay stuck unless you shift the metric from "What is explanation?" to "What job is this explanation doing?" If both functions are acknowledged as legitimate but distinct, the conflict dissolves into division of labor.

