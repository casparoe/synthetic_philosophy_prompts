prompt: |-
  I spent my career in evolutionary biology and only turned to philosophy after retiring. I have been reading my way through the collective intentionality literature—Bratman, Gilbert, Searle, Tuomela—and I have arrived at a set of views that feel right to me. But I do not yet have the philosophical training to tell whether they actually cohere, and I would like an audit before I commit further.

  Here is where I have landed:

  (1) Shared intentions are not reducible to individual intentions plus mutual beliefs. When we intend to do something together, there is a genuinely collective element—a "we-mode"—that cannot be factored into I-mode attitudes without remainder.

  (2) Joint action requires that the participants have common knowledge of the joint goal. If you and I are painting a fence together but I secretly suspect you are painting it for a different reason and you are unsure whether I am really committed, we are not genuinely acting jointly.

  (3) Collectives—corporations, teams, nations—can be moral agents in their own right. It is not merely a façon de parler to say that BP was blameworthy for the Deepwater Horizon spill; the corporation itself bears moral responsibility over and above the responsibility of its executives and engineers.

  (4) An individual who participates in a joint action is fully morally responsible for the entire collective outcome, not merely for their own causal contribution. The getaway driver in a bank robbery is responsible for the robbery, not just for the driving.

  (5) Joint action does not require that any participant consciously entertain a thought with the content "we are doing this together." Skilled ensembles—a string quartet, a surgical team, a pair of dancers—can act jointly while fully absorbed in the task, with no occurrent representation of the collective.

  I would like you to go through these five commitments and identify which pairs are in genuine tension, which pairs merely appear to be in tension but are compatible on closer inspection, and which pairs are mutually reinforcing. For each genuine tension, tell me how severe it is and what the least costly revision would be to resolve it. Then tell me whether there is a single revision that would resolve the most tensions at once.

  Please structure your response as a JSON object with the following fields:

  - **pairwise_analysis**: an array of objects, each with fields:
    - *pair*: a two-element array of integers, e.g. [1, 3]
    - *relationship*: one of "genuine_tension", "apparent_tension", "compatible", or "mutually_reinforcing"
    - *severity*: if relationship is "genuine_tension", one of "mild", "moderate", or "severe"; otherwise null
    - *explanation*: a concise explanation of the relationship
    - *least_costly_revision*: if relationship is "genuine_tension", a string naming which commitment to revise and how; otherwise null
  - **overall_assessment**: a string summarizing whether the set is largely coherent, moderately in tension, or seriously inconsistent
  - **recommended_revision**: a string naming the single revision that would resolve the most tensions, with a brief justification
