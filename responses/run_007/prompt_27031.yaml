prompt: |-
  I'm trying to figure out what I actually think about virtual objects and virtual harms, going by my gut on a bunch of cases. Here's where I land:

  - Someone hacks my MMO account and transfers all my gold to their account. That's theft, full stop. The gold was mine and they took it.
  - Someone joins the Minecraft server where I've spent months building a cathedral and levels the whole thing. That's a real harm to me, even though it's "just blocks."
  - My partner has a months-long romantic and sexual relationship with someone entirely in Second Life, complete with virtual dates and virtual sex. They never meet in person. This is cheating. I'd feel betrayed.
  - I'm playing Skyrim and I walk into a bandit camp and kill everyone. Nothing wrong with that at all. They're NPCs.
  - A company sells a VR experience where you can realistically torture a virtual child. This is morally repugnant and shouldn't be sold, even if no actual child is involved and the whole thing is computer-generated.
  - A game company shuts down its servers and my rare digital trading cards, which I paid real money for, are gone. I'm annoyed but I don't think I was wronged in the way theft would wrong me. I knew servers don't last forever.
  - Someone uses a bot to disrupt my virtual art gallery opening in a social VR platform, spamming the space with graphic imagery so no one can see the work. That's genuinely harmful — it ruined a real social event I organized.

  So some virtual stuff is real property, some virtual harms are real harms, some virtual actions are real betrayals — but other virtual actions (killing NPCs, losing items when servers die) aren't. Is there a principle that gets all these verdicts right? And if there isn't a clean one, which verdict should I give up? Also, what does your principle say about a case I keep going back and forth on: someone commissions an artist to draw a detailed portrait of their D&D character, the artist delivers the file, and then the buyer does a chargeback and keeps the file. Is that theft, or just being a jerk?

  You're an expert philosopher working in the metaphysics and ethics of virtual worlds. Please think carefully — start by brainstorming what the candidate principles might be, test each one against all seven cases, and then give me your best account. Be honest about which of my verdicts the principle can't accommodate, if any.
