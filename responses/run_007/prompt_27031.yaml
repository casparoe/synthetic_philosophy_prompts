          4.  Skyrim: Isolated simulation. (Fits)
          5.  Torture: *Challenge.* If no victim, why wrong? Because it cultivates vice/expresses depravity that bleeds into the real agent. (Fits if we accept virtue ethics).
          6.  Shutdown: Embedded in a contract that explicitly *excludes* permanent ownership. (Fits - the "embedding" was temporary by agreement).
          7.  Gallery: Embedded in real social interaction. (Fits)

      *   *Tension:* Case 5 is the hardest. If I torture a virtual child in private, is it wrong? The user says "shouldn't be sold." This implies a public harm or a statement about character. I need to be honest that Case 5 is the outlier that requires a different ethical framework (Virtue Ethics vs. Harm Principle).
      *   *Tension:* Case 6. Why isn't this theft? Because the "embedding" was defined by a license, not property rights.

  5.  **Addressing the Test Case (D&D Chargeback):**
