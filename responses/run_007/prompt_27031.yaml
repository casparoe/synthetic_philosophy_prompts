          *   *The Harm Principle:* Real emotional/financial harm. (Good, but struggles with Case 5).
          *   *The Normative Expectation Principle:* Based on rules of the space. (Good for 1, 2, 6, 7, but 3 and 5 depend on external norms).
      *   **Section 2: The Best Fit - "The Embedded Agency Principle".**
          *   Define it: Moral status depends on the connection to real-world human agency, relationships, and welfare.
