  4.  **Developing the Best Account:**
      *   I need a hybrid view. The literature (Morgan Luck, Stephanie Patridge, David Chalmers) often distinguishes between *virtual harm* (to players) and *virtual wrongs* (intrinsic to the act).
      *   *Proposed Principle:* **The Real-World Relational Impact Principle.**
      *   *Core:* Virtual entities/actions gain moral weight when they serve as *mediators* for real-world human interests, relationships, or psychological states. They lose moral weight when they are hermetically sealed simulations without external tethering.
      *   *Nuance:* We need to distinguish between *harm to a victim* (Cases 1, 2, 3, 6, 7) and *moral corruption/expressivism* (Case 5).
      *   *Refinement:* Let's call it **The Embedded Agency Principle**. Virtual things matter when they are embedded in real human projects, relationships, or economies. They don't matter when they are isolated simulations.

