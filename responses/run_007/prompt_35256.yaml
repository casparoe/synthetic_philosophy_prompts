answer: |-
  ### Exam Question

  **Module:** EPI301 Advanced Epistemology
  **Section:** B
  **Time Allowed:** 2 Hours

  **Question 4:**
  Gilbert Harman's dogmatism paradox suggests that if an agent knows a proposition $p$, they are rationally entitled to dismiss any future evidence suggesting $\neg p$ without investigation. This implies that knowledge is incompatible with the open-mindedness required for rational inquiry.

  Does the paradox successfully demonstrate that knowledge entails dogmatism? Critically evaluate whether denying the principle of Closure, adopting an Externalist account of justification, or appealing to a Defeasibility condition offers the most compelling resolution.

  ***

  ### Model Answer

  The dogmatism paradox presents a disturbing tension between the static nature of knowledge and the dynamic nature of rational inquiry. If I know $p$, and I know that $p$ entails $\neg q$ (where $q$ is a sceptical alternative or counter-evidence), the principle of Closure suggests I know $\neg q$. If I already know $\neg q$, it appears rational to ignore any new evidence for $q$. This renders the knower dogmatic, seemingly violating the norm that rational agents should remain responsive to evidence. However, the paradox does not prove knowledge entails dogmatism; rather, it reveals a flaw in how we model the retention of knowledge over time. The most compelling resolution lies not in denying Closure, but in adopting a Defeasibility condition on knowledge.

  To understand the force of the paradox, one must accept the Closure Principle: if $S$ knows $p$ and knows $p$ entails $q$, $S$ is in a position to know $q$. Harman argues that if I know I have hands ($p$), and I know having hands entails I am not a handless brain-in-a-vat ($\neg q$), I know I am not a BIV. Consequently, if a scientist presents data suggesting I am a BIV, I can dismiss it a priori. This is the dogmatic bullet: knowledge seems to license the refusal of evidence.

  Denying Closure, as Dretske and Nozick suggest, avoids the conclusion that I know $\neg q$. However, this is a high cost. Closure is intuitively robust; denying it cripples deductive reasoning in science and daily life. If I cannot know the consequences of what I know, knowledge loses its utility. Furthermore, denying Closure does not fully address the normative issue. Even if I don't *know* $\neg q$, if I am justified in believing $p$, I am still arguably justified in dismissing $q$. The threat of dogmatism remains.

  Externalism offers a different route. An externalist might argue that knowledge requires a reliable connection to the truth, not internal access to the elimination of alternatives. On this view, I am not "ignoring" evidence dogmatically; rather, my belief is already produced by a reliable process. However, this risks divorcing rationality from the agent's perspective. If I ignore contrary evidence solely because I am externally reliable, I appear internally irrational, even if I am externally justified. This does not fully dissolve the charge of dogmatism from the agent's point of view.

  The superior solution is Harman's own appeal to a Defeasibility condition. Knowledge is not merely justified true belief; it requires that there be no true defeaters. Crucially, defeasibility is sensitive to new evidence. If I encounter evidence $e$ for $q$, $e$ may undermine the *basis* of my original knowledge of $p$. I cannot simply infer $\neg q$ and ignore $e$, because $e$ might defeat my justification for $p$ itself.

  For example, if I believe I have hands based on vision, and a trusted scientist presents visual data suggesting I am a BIV, this new evidence attacks the reliability of my vision. I cannot use my vision-based knowledge to dismiss the scientist's report, because the report undermines the vision. Therefore, I am not rationally entitled to dismiss the evidence without investigation. I must check if my basis is compromised.

  This resolves the paradox by distinguishing between knowing $p$ in a static context and retaining knowledge in a dynamic context. The paradox fails because it assumes knowledge is a permanent status that allows one to bypass future evidence. In reality, the arrival of significant counter-evidence forces a re-evaluation of the original justification. Thus, knowledge does not entail dogmatism. The knower is not licensed to ignore evidence; they are obligated to ensure their original basis remains undefeated. This preserves Closure and Externalist insights while respecting the normative demand of inquiry: that rational agents must remain responsive to evidence that threatens the foundations of their beliefs.

  ***

  ### Marking Scheme

  **Grade Band: First Class (70–100%)**
  *   **Reconstruction of the Paradox:** Accurately outlines the argument (Knowledge + Closure $\to$ Knowledge of $\neg$alternative $\to$ Dismissal of evidence) and explicitly identifies the *normative* conflict (the tension between the status of knowledge and the norms of inquiry).
  *   **Evaluation of Solutions:** Does not merely describe solutions but critically weighs them. For example, if discussing Closure, acknowledges the intuitive cost of denying it. If discussing Externalism, notes the tension between external reliability and internal rationality.
  *   **The Chosen Resolution:** Clearly argues for one resolution (e.g., Defeasibility). Explains *mechanically* how it blocks the dogmatism (e.g., new evidence defeats the *basis* of the original belief, not just the conclusion).
  *   **Critical Depth:** Identifies a potential weakness or limitation in their chosen solution (e.g., defining what counts as a "defeater") but explains why it remains the best option.
  *   **Structure & Clarity:** Argument is tight, concise, and free of superfluous exposition.

  **Grade Band: Upper Second (2:1) (60–69%)**
  *   **Reconstruction of the Paradox:** Correctly states the Closure Principle and explains the inference that leads to the "dogmatic" conclusion (ignoring evidence). May focus slightly more on the logical structure than the normative implication.
  *   **Evaluation of Solutions:** Describes at least one resolution accurately (e.g., Denying Closure or Externalism). Explains how the solution blocks the paradox.
  *   **The Chosen Resolution:** Supports one view but may treat it more descriptively than critically. Explains *that* it works, but perhaps lacks depth on *why* it is superior to the alternatives (e.g., mentions Dretske but doesn't fully analyse the cost of losing Closure).
  *   **Critical Depth:** Limited evaluation of the chosen solution. May accept the solution without noting potential counter-arguments or complexities (e.g., treats Defeasibility as a magic bullet without discussing the difficulty of defining defeaters).
  *   **Structure & Clarity:** Clear and coherent, but may include unnecessary background or lack the argumentative "punch" of a First.

  **Grade Band: Lower Second (2:2) (50–59%)**
  *   **Reconstruction:** Vague understanding of the paradox. May confuse the Dogmatism Paradox with standard Skeptical Hypotheses (e.g., just discussing the BIV without the "ignoring evidence" element).
  *   **Evaluation:** Lists solutions without clear evaluation. May claim Closure is false without explaining the consequence.
  *   **Resolution:** Argument is present but lacks philosophical precision.

  **Grade Band: Third / Fail (40–49% / <40%)**
  *   **Reconstruction:** Fundamental errors in the logic of the paradox.
  *   **Evaluation:** Fails to engage with a specific resolution strategy.
  *   **Resolution:** Irrelevant or purely opinion-based.
