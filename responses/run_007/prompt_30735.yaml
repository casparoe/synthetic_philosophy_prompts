answer: |-
  ### A Preliminary Warning on the Premise

  Before presenting the procedure, I must address your request for honesty regarding the premise. David Lewis's account of convention (primarily from *Convention: A Philosophical Study*, 1969) is a **descriptive** theory of how social equilibria sustain themselves, not a **prescriptive** tool for engineering them.

  There are three significant tensions in asking for a Lewisian decision procedure:

  1.  **Arbitrariness:** Lewis insists a convention must be arbitrary (e.g., driving on the left is no better than driving on the right, provided we agree). Many professional norms are *not* arbitrary; one way is objectively safer, more ethical, or more efficient. Lewis's framework struggles here.
  2.  **Common Knowledge:** Lewis requires that everyone knows, everyone knows that everyone knows, and so on. In a large professional body, this is empirically unverifiable in a two-hour meeting. We must use proxies.
  3.  **Prediction vs. Diagnosis:** Lewis explains why a convention *persists*, not necessarily how one *starts*. Predicting stability is inherently riskier than diagnosing an existing state.

  If you treat this procedure as a mathematical algorithm, you will make errors. It is best understood as a **structured heuristic** to force your team to articulate assumptions they usually leave implicit. I have marked where the procedure demands a judgement call that cannot be fully objectified.

  ***

  ### The Lewisian Convention Heuristic (LCH)

  **Time required:** 90–120 minutes.
  **Participants:** Standards team + 1 external facilitator (to manage 'judgement calls').
  **Output:** A recommendation to the Policy Committee: 'Adopt', 'Reject', or 'Further Inquiry Required'.

  The procedure consists of five tests. For **Existing Regularities** (Diagnosis), answer based on observation/survey data. For **Proposed Practices** (Prediction), answer based on pilot data, member sentiment analysis, or analogous cases.

  #### Step 1: The Regularity Test
  *   **Question:** Is there (or will there be) a consistent pattern of behaviour where most members act in the same way in the relevant situation?
  *   **Sufficient Answer:**
      *   *Diagnosis:* Evidence that >80% compliance exists without active enforcement.
      *   *Prediction:* Evidence from pilots or comparable bodies that >80% compliance is feasible.
  *   **Stop Condition:** If **No**. This is not a convention; it is either a rule requiring enforcement or a non-issue. Stop.
  *   **Hand-off:** If the answer is 'Yes, but only because of sanctions', hand to Policy Committee. This is coercion, not convention.
  *   **[JUDGEMENT CALL]:** Distinguishing between 'voluntary compliance' and 'soft coercion' (fear of reputation damage) is subjective.

  #### Step 2: The Conditional Preference Test
  *   **Question:** Do members prefer to follow the practice *on the condition* that others do so? (i.e., Would a member be worse off conforming if everyone else defected?)
  *   **Sufficient Answer:**
      *   *Diagnosis:* Members report that the practice is useless or harmful if they are the only ones doing it (e.g., anonymising cases is pointless if others name names).
      *   *Prediction:* Members indicate they would not adopt this individually unless assured others would too.
  *   **Stop Condition:** If **No**. If members would do it regardless of others (e.g., 'I should be honest even if no one else is'), this is a moral imperative or personal habit, not a Lewisian convention. Stop.
  *   **Hand-off:** If the preference is mixed, hand to Policy Committee. This indicates a coordination failure risk.
  *   **[JUDGEMENT CALL]:** Assessing 'preference' often relies on self-reporting, which may differ from actual motivation.

  #### Step 3: The Alternative Test (Arbitrariness)
  *   **Question:** Could a different, mutually exclusive regularity have solved the problem just as well?
  *   **Sufficient Answer:**
      *   *Diagnosis/Prediction:* Yes. (e.g., 'We could have rotated seating clockwise or anti-clockwise'; 'We could have declared interests at the start or end of the meeting').
  *   **Stop Condition:** If **No**. If there is only one rational way to achieve the goal (e.g., 'Only this specific safety protocol prevents injury'), this is a technical standard, not a convention. Lewis's theory does not apply. Stop.
  *   **Hand-off:** If the alternative is theoretically possible but practically difficult, hand to Policy Committee.
  *   **[JUDGEMENT CALL]:** Determining whether an alternative is 'just as good' involves valuing efficiency vs. tradition.

  #### Step 4: The Expectation Test
  *   **Question:** Do members expect others to conform, and do they conform partly *because* of that expectation?
  *   **Sufficient Answer:**
      *   *Diagnosis:* Survey data showing members feel social pressure or anticipate the behaviour of peers.
      *   *Prediction:* Stakeholder analysis suggests the practice signals 'membership' or 'professionalism'.
  *   **Stop Condition:** If **No**. If members do not notice or care what others do, this is a habit or coincidence. Stop.
  *   **Hand-off:** If expectations exist but are negative (e.g., 'I expect others to cheat'), hand to Policy Committee immediately.
  *   **[JUDGEMENT CALL]:** Distinguishing between 'expecting others to comply' and 'hoping others comply' is subtle.

  #### Step 5: The Common Knowledge Proxy
  *   **Question:** Is it open and acknowledged within the body that Steps 1–4 hold? (i.e., Does everyone know that everyone knows this is the norm?)
  *   **Sufficient Answer:**
      *   *Diagnosis:* The practice is discussed in training, induction, or informal gossip as 'how we do things'.
      *   *Prediction:* The promotion campaign is public enough that it is reasonable to assume members know others have seen it.
  *   **Stop Condition:** If **No**. If the regularity is hidden or misunderstood, it cannot sustain itself as a convention. Stop.
  *   **Hand-off:** If the knowledge is present but contested (e.g., 'Senior members know, juniors do not'), hand to Policy Committee.
  *   **[JUDGEMENT CALL]:** True 'common knowledge' is infinite recursion. This step uses a pragmatic proxy which may overestimate mutual awareness.

  ***

  ### Application to Cases

  Here is the procedure applied to your three scenarios.

  #### Case (a): Proposal to disclose personal relationships before serving on awards committees
  *   **Step 1 (Regularity):** **Pass.** Most members currently do this informally; proposal is to make it a norm.
  *   **Step 2 (Conditional Preference):** **Pass.** A member would feel exposed declaring a relationship if others were secretly serving without declaring. They prefer to declare *if* others do.
  *   **Step 3 (Alternative):** **Fail/Borderline.** Is this arbitrary? One could argue *not* declaring is not a viable alternative for ethical reasons. However, the *timing* or *method* of disclosure could be arbitrary. Let us assume the *act* of disclosure is the norm.
  *   **Step 4 (Expectation):** **Pass.** Members expect peers to declare to maintain the committee's integrity.
  *   **Step 5 (Common Knowledge):** **Pass.** This is discussed in guidance.
  *   **Result:** **Likely Convention.**
  *   **Caveat:** This stretches Lewis. This is closer to an ethical obligation than an arbitrary coordination solution. The procedure flags it as a convention, but the Policy Committee should treat it as a **quasi-regulation**. If someone breaks this, you cannot treat it as a mere breach of etiquette; it may require sanction.

  #### Case (b): Existing regularity that members almost never request recorded votes
  *   **Step 1 (Regularity):** **Pass.** Data shows <5% of votes are recorded despite rules allowing it.
  *   **Step 2 (Conditional Preference):** **Fail.** [JUDGEMENT CALL]. Do members prefer *not* to record votes *because* others don't? Or do they want recorded votes but fear being seen as disruptive? Evidence suggests members often *want* transparency but stay silent to avoid conflict.
  *   **Step 3 (Alternative):** **Pass.** Recorded votes could be the norm; unrecorded could be the norm. Both work procedurally.
  *   **Step 4 (Expectation):** **Pass.** Members expect others not to ask.
  *   **Step 5 (Common Knowledge):** **Pass.** Everyone knows no one asks.
  *   **Result:** **NOT A CONVENTION.**
  *   **Unwelcome Answer:** The procedure indicates this is **not a Lewisian convention**. It fails Step 2. The regularity is sustained not by a shared preference for coordination, but by **pluralistic ignorance** or **fear**. Everyone conforms expecting others to conform, but privately prefers the alternative.
  *   **Implication:** Promoting this as a 'norm' is dangerous. It is a culture of silence. The Policy Committee should not codify this; they should investigate why members feel unable to use existing rights.

  #### Case (c): Proposal to rotate seating at formal dinners
  *   **Step 1 (Regularity):** **Fail (Prediction).** Pilots show members consistently drift back to sitting near friends or the President.
  *   **Step 2 (Conditional Preference):** **Fail.** Do I care if you sit elsewhere? Generally, no. My utility is maximised by sitting near people I know, regardless of where you sit.
  *   **Step 3 (Alternative):** **Pass.** Any seating plan works.
  *   **Step 4 (Expectation):** **Fail.** No one expects others to rotate.
  *   **Step 5 (Common Knowledge):** **N/A.**
  *   **Result:** **Will Not Become a Convention.**
  *   **Implication:** This is a **coordination problem without a coordination payoff**. Unless there is a strong benefit to mixing (which members currently do not perceive), this will remain a paper rule. Do not promote this as a norm; either enforce it as a rule (assign seats) or drop it.

  ***

  ### Limitations: Where Lewis is Stretched

  You asked specifically where this picture covers the messier ways norms actually evolve. There are three critical failures in the procedure above that you must acknowledge in your report to the Policy Committee.

  **1. The Ethical Blind Spot (Case A)**
  Lewis's theory is designed for traffic rules and telephone call-backs, not ethics. In Case (a), the 'arbitrariness' test is weak. Declaring interests is not arbitrary; it is morally superior to hiding them. Lewis's account implies that if we had all agreed to *hide* interests, that could also be a convention. **The procedure cannot distinguish between a 'good' convention and a 'bad' equilibrium.** It only tells you if it will stick. You must layer a separate ethical review on top of this.

  **2. The Power Asymmetry (Case B)**
  Lewis assumes a rough equality among agents (drivers on a road are roughly equal). In a professional body, Junior Members and Senior Fellows have different power. In Case (b), the regularity exists because Junior Members fear Senior Members. **The procedure treats this as a coordination failure, but it is actually a power dynamic.** Lewis's framework lacks the vocabulary for coercion disguised as convention. When Step 2 fails, do not assume 'habit'; assume 'hierarchy'.

  **3. The Dynamics of Change**
  Lewis explains stability, not change. The procedure is better at diagnosing existing norms (Case B) than predicting new ones (Case C). Norms often evolve through 'cascades' where a few influential members change the expectation. **The procedure treats the body as a monolith.** It cannot account for the fact that if the President sits at a random table (Case C), the norm might shift instantly, whereas if a random member does, it will not. The 'Common Knowledge' proxy (Step 5) is too blunt to capture this influence.

  ### Final Recommendation for the Team

  Use this procedure to **filter**, not to **decide**.
  *   If the procedure says **No**, do not attempt to create a convention. Either enforce it as a hard rule (with sanctions) or abandon it.
  *   If the procedure says **Yes**, recognise that you are identifying a coordination equilibrium, not a moral truth.
  *   Always heed the **[JUDGEMENT CALL]** flags. Where the procedure asks you to assess 'preference' or 'knowledge', do not vote on it. Discuss it. If the team disagrees on the answer, the condition is not met.

  This tool will not stop you from being wrong. But it will stop you from being wrong for the wrong reasons. It forces you to admit when a norm is actually fear (Case B) or when a rule is actually an ethical mandate (Case A), rather than pretending everything is a gentle agreement among equals.
