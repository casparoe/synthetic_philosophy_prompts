      *   *Standard View:* Habitat = Good. Destruction = Bad. (Reason: Life is generally worth living, biodiversity is valuable).
      *   *Skeptical View:* Habitat = Suffering Factory. Destruction = Net Reduction in Suffering (potentially). (Reason: Lives are net negative, preventing existence avoids suffering).
      *   To adjudicate this, a theory needs to handle:
          *   Existing animals vs. Future animals.
          *   Quality of life metrics.
          *   Population dynamics (carrying capacity, r/K selection).
          *   The asymmetry of existence (coming into existence vs. ceasing to exist).

  3.  **Drafting the Requirements (Iterative Process):**

