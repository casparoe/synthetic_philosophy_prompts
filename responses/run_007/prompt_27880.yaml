answer: |-
  Here is the specification for a theory capable of adjudicating whether habitat destruction is net positive or negative for wild animal suffering.

  ### The Specification

  To determine the net ethical impact of habitat destruction on animals (excluding ecosystem health or biodiversity values), a theory must satisfy the following requirements.

  #### 1. The Valence Metric (Non-negotiable)
  **Requirement:** The theory must define a measurable unit of "good" and "bad" experience (e.g., hedonic tone, preference satisfaction, absence of pain) and apply it across different species.
  **Why:** You cannot calculate "net suffering" without a common currency. A theory that treats a mouse's starvation the same as a bear's starvation, or ignores insects entirely, will produce skewed data. It must account for intensity, duration, and frequency of suffering vs. well-being.
  **Status:** **Non-negotiable.** Without a metric, the calculation is impossible.

  #### 2. Counterfactual Consistency (Non-negotiable)
  **Requirement:** The theory must explicitly state how it compares *actual* deaths against *prevented* births. It must decide if the suffering of an animal killed during destruction weighs differently than the suffering of an animal that never exists because the habitat is gone.
  **Why:** This addresses your specific concern. If a theory counts the pain of death heavily but treats "never being born" as neutral, it will favor preservation. If it treats "preventing a life of suffering" as a moral gain, it may favor reduction. Collapsing these two categories leads to logical errors (the Non-Identity Problem).
  **Status:** **Non-negotiable.** The logic must be consistent, even if the ethical weighting is debatable.

  #### 3. Dynamic Population Modeling (Non-negotiable)
  **Requirement:** The theory cannot treat animal populations as static numbers. It must account for carrying capacity, reproduction rates (r-selection vs. K-selection), and succession.
  **Why:** Ecology is dynamic. Clearing a woodland might kill 100 deer today, but if the land becomes a meadow, it might support 10,000 mice next year. If those mice live short, high-suffering lives, the destruction increased total suffering. A theory that ignores population rebound or species substitution is factually wrong.
  **Status:** **Non-negotiable.** Ignoring ecological dynamics renders the empirical basis false.

  #### 4. The Temporal Horizon (Preference)
  **Requirement:** The theory must define the time window for calculation. Does it measure suffering over 1 year, 10 years, or until the habitat recovers?
  **Why:** Habitat destruction often has a short-term spike in suffering (displacement/death) but a long-term reduction in carrying capacity. Conversely, natural succession might increase carrying capacity over decades.
  **Status:** **Preference.** A short-termist view favors "do nothing to avoid immediate death." A long-termist view favors "reduce carrying capacity permanently."

  #### 5. The Asymmetry of Creation (Preference)
  **Requirement:** The theory must decide if bringing a happy animal into existence is a *benefit*, and if bringing a suffering animal into existence is a *harm*, and crucially, if *preventing* a suffering animal from existing is a *benefit*.
  **Why:** This is the philosophical engine. Standard ethics often says "you don't harm someone by not birthing them." A suffering-focused ethics says "you help them by not birthing them." This choice dictates the baseline value of habitat.
  **Status:** **Preference.** This is an axiomatic ethical choice, not an empirical fact.

  #### 6. The Baseline Valence Assumption (Preference)
  **Requirement:** The theory must adopt a default position on the average wild life: Is it net positive, net negative, or neutral?
  **Why:** If the average wild life is assumed to be a "gift" (net positive), destruction is almost always bad. If the average wild life is assumed to be a "burden" (net negative), destruction becomes a candidate for harm reduction. This cannot be derived purely from logic; it requires an empirical claim about the quality of wild life.
  **Status:** **Preference (with empirical constraints).** While the *value* is a preference, the theory must align with biological evidence regarding starvation rates, predation, etc.

  ---

  ### The Key Sorter

  The single requirement that does the most work to sort the "Leave Nature Alone" position from the "Less Habitat is Better" position is **Requirement #5: The Asymmetry of Creation.**

  **Why:**
  *   **If you reject the Asymmetry (Standard View):** You believe that preventing a life is neutral. Therefore, the only moral weight comes from existing animals. Destroying habitat kills existing animals (bad) and prevents future animals (neutral). **Result:** Habitat destruction is bad.
  *   **If you accept the Asymmetry (Negative Utilitarian View):** You believe that preventing a life of net suffering is a moral good. Therefore, destroying habitat kills existing animals (bad) but prevents future suffering (good). If the future suffering outweighs the death pain, **Result:** Habitat destruction can be good.

  This requirement acts as the switch. All other requirements (ecology, metrics) just feed numbers into the equation; this requirement decides how the equation balances.

  ---

  ### Comparison of Positions Against Spec

  Here is how the two obvious positions score against the requirements.

  | Requirement | **Position A: Preservationist**<br>(Standard Conservation Ethics) | **Position B: Reductionist**<br>(Wild Animal Suffering Focus) |
  | :--- | :--- | :--- |
  | **1. Valence Metric** | **Pass.** Assumes life contains net positive value (pleasure > pain). | **Pass.** Assumes life often contains net negative value (pain > pleasure). |
  | **2. Counterfactual Consistency** | **Pass.** Treats death as harm; non-existence as neutral. | **Pass.** Treats death as harm; non-existence as benefit (if life would suffer). |
  | **3. Dynamic Population** | **Fail (Often).** Often assumes stable populations; ignores that preserving habitat creates more "suffering factories" over time. | **Pass.** Explicitly models that more habitat = more animals = more total suffering. |
  | **4. Temporal Horizon** | **Preference:** Short/Medium. Focuses on immediate loss of life and community. | **Preference:** Long. Focuses on cumulative suffering over generations. |
  | **5. Asymmetry of Creation** | **Rejects.** Preventing birth is not a benefit. | **Accepts.** Preventing suffering birth is a benefit. |
  | **6. Baseline Valence** | **Assumption:** Wild life is generally worth living. | **Assumption:** Wild life is generally not worth living (due to r-selection strategies). |
  | **Verdict on Habitat** | **Destruction is Bad.** (Kills good lives). | **Destruction is Contextual.** (Could be good if it reduces net future suffering more than it causes immediate death pain). |

  ### Summary of the Trap
  The reason you have been going in circles is that **Position A** usually fails **Requirement #3** (Dynamic Population) by ignoring the sheer volume of future suffering a preserved habitat generates, while **Position B** usually fails **Requirement #2** (Counterfactual Consistency) by underestimating the intense suffering caused by the *act* of destruction (starvation, exposure, predation during displacement) compared to the theoretical suffering of animals that never exist.

  A valid theory must pass #3 (accurate ecology) and #2 (logical consistency regarding existence) before it can even apply the philosophical preference of #5. Most opinions fail because they skip the ecology or the logic of existence and jump straight to the philosophy.
