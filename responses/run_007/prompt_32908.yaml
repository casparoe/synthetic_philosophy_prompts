prompt: |-
  I'm trying to get my head round Berkeley's "master argument" in the Principles, and I keep going back and forth on whether it's actually any good. Here's the bit I'm stuck on, from section 23:

  "But, say you, surely there is nothing easier than for me to imagine trees, for instance, in a park, or books existing in a closet, and nobody by to perceive them. I answer, you may so, there is no difficulty in it. But what is all this, I beseech you, more than framing in your mind certain ideas which you call books and trees, and at the same time omitting to frame the idea of any one that may perceive them? But do not you yourself perceive or think of them all the while? This therefore is nothing to the purpose: it only shews you have the power of imagining or forming ideas in your mind; but it does not shew that you can conceive it possible the objects of your thought may exist without the mind. To make out this, it is necessary that you conceive them existing unconceived or unthought of, which is a manifest repugnancy. When we do our utmost to conceive the existence of external bodies, we are all the while only contemplating our own ideas."

  I think I can follow the surface point, but I'm not sure what "conceive" is doing here. Is the claim that I literally cannot form the thought of an unconceived tree, or only that the thought always has me in the background as a thinker? And if it's the first, why isn't it just a psychological limit, rather than a proof about how things can exist? Help me sort out whether Berkeley's opponent should be worried by this argument or whether they can shrug it off.
