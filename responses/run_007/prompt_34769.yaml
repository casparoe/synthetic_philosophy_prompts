answer: |-
  # Q&A Preparation Sheet: The Directed-Reasons Argument

  **Presenter:** [Your Name]
  **Occasion:** Department Colloquium
  **Topic:** Suffering-Focused Ethics and the Structure of Reasons

  ---

  ### 1. The Prioritarianism Challenge
  **Asked by:** Professor E
  **Objection:** 'You claim this isn't prioritarianism, but isn't this merely a semantic shift? Prioritarianism already weights benefits to the worse-off more heavily. If your "directed reason" simply results in prioritising the extreme sufferer, how is this substantively different from a sufficiently steep prioritarian weighting function? Why posit a new structural category rather than adjusting the weight?'

  **Reply (2 mins):**
  'Thank you, that is a crucial distinction. The difference lies in the *trade-off structure*, not merely the weighting. Prioritarianism is still aggregative; it sums weighted values. On a steep prioritarian view, if enough people receive a moderate benefit, it can theoretically outweigh one person's extreme suffering, provided the numbers are high enough. The weight is high, but it is not a trump card.

  My claim is structural: the reason to prevent extreme suffering is *directed* at the sufferer. It functions as a constraint on aggregation, not a weight within it. You cannot satisfy a duty owed to *this* sufferer by making *others* happier, regardless of the weight assigned. Prioritarianism asks, "Where does the most weighted value lie?" My view asks, "To whom is this duty owed, and can it be discharged by benefiting someone else?" The practical implication is that there is a threshold where trade-offs become impermissible, not just improbable. Prioritarianism smooths the curve; the directed-reasons view introduces a discontinuity in the logic of justification, not just the calculus of value.'

  **Weakest Point:** I risk sounding like I'm describing a deontological constraint without the metaphysical machinery to support it. Professor E may press on whether "discontinuity" is just "infinite weight" in disguise.

  ---

  ### 2. The Threshold Problem
  **Asked by:** Professor D
  **Objection:** 'Your argument hinges on "extreme" suffering. Where is the threshold? If you draw a line at intensity level 9 out of 10, does level 8.9 lose its directed protection? If the threshold is vague, doesn't that reintroduce the aggregation problem at the margins? How do you specify this non-arbitrarily?'

  **Reply (2 mins):**
  'I acknowledge the sorites risk, but vagueness in the threshold doesn't invalidate the structural claim. Many moral concepts, like "coercion" or "consent," have fuzzy boundaries but remain structurally distinct from mere preferences. I argue the threshold corresponds to a phenomenological breakdown: the point where suffering ceases to be a state the subject *has* and becomes a state that *has* the subject, colonising their perspective.

  This isn't arbitrary; it's grounded in the structure of consciousness. While there will be borderline cases, core cases of extreme suffering (torture, agony) clearly meet the criterion. In borderline cases, we may revert to aggregation, but that doesn't undermine the prohibition on trading away core cases. We don't reject the concept of "adulthood" because there are borderline cases of maturity; similarly, we can recognise a structural shift in moral reasons at the point of phenomenological captivity.'

  **Weakest Point:** Professor D works on consciousness measurement. He may argue that "phenomenological captivity" is scientifically unverifiable, making the threshold practically useless for policy.

  ---

  ### 3. The Paralysis Objection
  **Asked by:** Professor C
  **Objection:** 'I work in global health. We face triage decisions daily. If directed reasons prohibit trade-offs, does your view paralyse decision-making? If I have resources to save one person from extreme suffering or ten people from significant suffering, and you say I can't trade, am I forced to ignore the ten? This seems to abandon cost-effectiveness entirely.'

  **Reply (2 mins):**
  'It does challenge standard cost-effectiveness analysis, but it needn't lead to paralysis. First, my view prioritises preventing the extreme suffering *if* it is within your power to do so without violating other directed duties. If you can save the one from agony, you must.

  However, this isn't paralysis; it's a re-ordering of moral urgency. In standard triage, we might save the ten because the aggregate QALYs are higher. My view says the one in agony has a claim that cannot be overridden by the others' moderate gains. This is a feature, not a bug. It prevents the "tyranny of aggregation" where the worst-off are sacrificed for the greater good. If this makes resource allocation harder, it is because current models obscure morally relevant distinctions. We should not simplify ethics to fit spreadsheets; we should build spreadsheets that capture the ethics.'

  **Weakest Point:** Professor C is pragmatically committed. She may view this as an admission that the theory is unusable in real-world policy, reducing its philosophical value.

  ---

  ### 4. The Phenomenological Grounding
  **Asked by:** Professor D
  **Objection:** 'You ground the directedness in the "hostage" nature of the experience. But isn't this just a description of intensity? Why does the *structure* of the experience dictate the *structure* of the moral reason? You seem to be deriving an "ought" from a "is" of consciousness.'

  **Reply (2 mins):**
  'It is not a simple derivation from intensity, but from the *relational* nature of the experience. Extreme suffering isn't just a high number on a hedonic scale; it is an experience that demands recognition from a moral agent. It creates a moral claim *by* the subject *upon* the agent.

  When a being is in agony, their perspective is not just "negative"; it is a cry for aid that addresses a potential rescuer. This addressivity grounds the directedness. The "ought" arises because to ignore that address is to fail to recognise the subject as a locus of moral claim. It's not that the pain *is* a reason, but that the pain *constitutes* a demand. This bridges the is-ought gap by showing that moral reasons are responses to the normative demands inherent in certain conscious states.'

  **Weakest Point:** This is metaphysically heavy. If Professor D rejects the idea that consciousness inherently issues "demands," the grounding collapses.

  ---

  ### 5. The Large-Numbers Objection
  **Asked by:** Professor A
  **Objection:** 'You reject lexicality, yet you forbid trade-offs. What if preventing one person's extreme suffering requires denying a very large benefit to a million others? If you say "no trade," you look lexical. If you say "trade," you abandon directedness. How do you handle large-number cases without collapsing into the Repugnant Conclusion or lexicality?'

  **Reply (2 mins):**
  'I reject lexicality because I don't claim a pinprick outweighs a utopia. I claim the *reason* to prevent the pinprick is directed, but weak. The reason to prevent *extreme* suffering is directed and strong. In your case, if the million others face a *benefit*, that is an undirected reason to promote good.

  Directed reasons to prevent extreme suffering generally trump undirected reasons to promote benefits. However, if the benefit to the million is sufficiently large—say, preventing their own moderate suffering—their claims might aggregate to form competing directed reasons. My view allows aggregation of *claims*, just not the trading of a claim against a mere good. So, I can avoid the Repugnant Conclusion because I don't aggregate mere happiness against extreme suffering. But I avoid lexicality because sufficiently strong competing claims (not just benefits) can outweigh the single sufferer.'

  **Weakest Point:** Professor A will press on where "benefits" become "claims." If I allow aggregation of claims, I risk reintroducing the utilitarian calculus I sought to avoid.

  ---

  ### 6. The Deontological Gloss
  **Asked by:** Professor B
  **Objection:** 'You say this isn't standard consequentialism, but you still talk of "producing states of affairs." If the reason is directed and non-tradeable, isn't this just deontology with a consequentialist gloss? Why not simply admit you are proposing a duty-based view and drop the talk of states of affairs entirely?'

  **Reply (2 mins):**
  'I retain the consequentialist framework because the *goal* is still to improve the world, but the *logic* of improvement is constrained. Standard consequentialism sees duties as derivative of good states. I argue the duty is fundamental.

  However, I avoid full deontology because I don't posit absolute rights that forbid action regardless of consequences. I posit directed reasons that weigh heavily in deliberation. The "state of affairs" matters because the suffering must actually be prevented. But the justification isn't "the world is better," it is "I answered the claim." It is a hybrid: teleological in aim, deontological in structure. Dropping "states of affairs" entirely would ignore that we are still trying to alleviate suffering, not just keep our hands clean.'

  **Weakest Point:** Professor B may argue this is the worst of both worlds: lacking the clarity of deontology and the decisiveness of consequentialism.

  ---

  ### 7. Aggregation of Directed Reasons
  **Asked by:** Professor A
  **Objection:** 'If reasons are directed to individuals, do they aggregate? If two people suffer extremely, do I have double the reason to act? If yes, you have aggregation. If no, you can't prioritise between two sufferers. How does directedness handle multiple victims without reverting to sum-ranking?'

  **Reply (2 mins):**
  'Directed reasons aggregate *additively* regarding the agent's obligation, but not *compensatorily* regarding the victims. If two people suffer, I have two directed duties. This increases the moral urgency for me to act. However, I cannot discharge the duty to Victim 1 by helping Victim 2.

  This preserves aggregation for decision-making (I should save two rather than one) without allowing trade-offs (I cannot sacrifice one to save two). It distinguishes between the *strength of the obligation* (which aggregates) and the *satisfaction conditions* of the duty (which remain individual). This allows me to prioritise the greater number of sufferers without treating them as a vessel for aggregate value.'

  **Weakest Point:** This is a fine line. If the obligation aggregates, why can't the satisfaction conditions? Professor A may see this as an unstable distinction.

  ---

  ### 8. The Metaphysics of Directedness
  **Asked by:** Professor E
  **Objection:** 'You say the duty is "owed to" the individual. Is this literal or figurative? If literal, you need a theory of how duties attach to persons independent of outcomes. If figurative, it's just a heuristic for strong weighting. If you can't explain the metaphysics of "owed to," your structural claim is empty.'

  **Reply (2 mins):**
  'It is literal, but it doesn't require a robust Platonic theory of rights. "Owed to" signifies a normative relationship grounded in the vulnerability of the subject. When a being can suffer, they have a stake in the world that moral agents must recognise.

  This isn't a mysterious entity; it's a description of the moral landscape. Just as a promise creates a directed obligation to the promisee, extreme vulnerability creates a directed obligation to the sufferer. To say it is figurative is to deny the relational nature of morality. I don't need to posit new metaphysical objects, only to acknowledge that moral reasons have a vector, not just a magnitude. The "direction" is the recognition of the other as a source of claims.'

  **Weakest Point:** This is the most damaging because if I cannot account for the metaphysics of "directedness" without sliding into rights-based deontology, the entire "consequentialist toolkit" revision fails.

  ---

  ### ⚠️ The Question I Hope Nobody Asks

  **Question:** 'If the duty is directed to the specific individual, what happens if preventing their extreme suffering requires ensuring they never exist (e.g., in population ethics cases)? Do you owe a duty to a non-existent being, or does your view collapse when the sufferer's identity is contingent on the act?'

  **Why I fear it:** This combines Professor A's population ethics expertise with Professor B's focus on duties. If I say I owe a duty to the non-existent, I face the Non-Identity Problem. If I say I don't, I may have to allow extreme suffering to come into existence to avoid violating a directed duty to a specific future person. It threatens to expose a contradiction between my "directed" framework and the reality of future generations.

  **Prepared Deflection:** 'This touches on the Non-Identity Problem, which I bracket for this paper. My argument concerns existing beings or beings whose identity is fixed. Extending directed reasons to contingent future beings requires a separate account of "potential claims," which is beyond the scope of today's argument.' (Note: This is a weak defence; I need to prepare a stronger substantive answer if pressed).
