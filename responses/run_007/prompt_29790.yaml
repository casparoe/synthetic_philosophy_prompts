      2.  **Repeat Testing:** Conduct repeated fMRI/EEG paradigms to verify consistency.
      3.  **Family Conference:** Communicate the uncertainty clearly. Explain that we are not asserting recovery is likely, but that we cannot confirm unconsciousness yet.
      4.  **Timeline:** Reconvene in 14 days. If evidence remains inconclusive, we must weigh the probability of consciousness against the burden of prolonged treatment.

