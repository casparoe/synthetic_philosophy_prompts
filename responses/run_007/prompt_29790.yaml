prompt: |-
  I serve on my hospital's ethics committee. We have a patient in a behaviorally non-responsive state following a severe brainstem stroke. Standard bedside assessments indicate no awareness. However, fMRI and EEG paradigms designed to detect covert consciousness—asking the patient to imagine playing tennis or walking through their home, and looking for corresponding brain activity—have produced results that some of our neurologists interpret as evidence of preserved conscious awareness, while others dismiss these as subpersonal neural activity that doesn't establish genuine phenomenal consciousness. The family wants life support withdrawn; they say the patient wouldn't want to live "as a vegetable." But if the patient is consciously aware—unable to move or communicate, yet experiencing—that changes the moral calculus entirely. Please draft a short memo for the committee recommending a concrete course of action. Engage seriously with the strongest argument on the losing side. Keep it under 500 words.
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **Role:** Member of a hospital ethics committee.
      *   **Scenario:** Patient in behaviorally non-responsive state (severe brainstem stroke). Standard assessments say no awareness. fMRI/EEG suggest covert consciousness (command following via imagery), but interpretation is disputed (conscious awareness vs. subpersonal neural activity). Family wants to withdraw life support (based on "vegetable" status). If conscious, moral calculus changes.
      *   **Task:** Draft a short memo recommending a concrete course of action.
      *   **Constraint 1:** Engage seriously with the strongest argument on the losing side (i.e., if recommending continuation, engage with the argument for withdrawal; if recommending withdrawal, engage with the argument for continuation).
      *   **Constraint 2:** Keep it under 500 words.

  2.  **Determine the Recommendation:**
      *   This is a classic "cognitive motor dissociation" (CMD) case.
      *   Ethical principle: Precautionary principle regarding consciousness. If there's a significant chance of consciousness, withdrawing life support risks killing a conscious being.
      *   Recommendation: Pause withdrawal, pursue further diagnostic clarification, and appoint a surrogate decision-maker process that accounts for the uncertainty.
      *   *Losing Side:* The family's wish to withdraw based on prior expressed wishes ("wouldn't want to live as a vegetable"). The argument is respect for autonomy and avoiding futile care.

  3.  **Drafting - Section by Section:**
      *   **Header:** To, From, Date, Subject.
      *   **Opening:** State the purpose (recommendation regarding Patient X).
      *   **The Conflict:** Behavioral unresponsiveness vs. neuroimaging evidence.
      *   **The Recommendation:** Delay withdrawal, seek further confirmation.
      *   **Engaging the Opposing View:** Acknowledge the family's position (autonomy, prior wishes, burden of treatment). Validate their interpretation of the data (false positives, subpersonal activity).
      *   **Justification:** The asymmetry of error. Killing a conscious patient is worse than prolonging life of an unconscious one.
      *   **Next Steps:** Repeat testing, independent review, family communication.

  4.  **Drafting - Content & Tone:**
      *   Tone: Professional, empathetic, rigorous.
      *   Word Count: Must be < 500.

  5.  **Refining the Argument (Engaging the Losing Side):**
      *   If I recommend *continuing* care (pending further review), the "losing side" is the family's wish to withdraw.
      *   Strongest argument for withdrawal: Respect for autonomy and the reliability of prior directives. The patient explicitly rejected life in a PVS-like state. The neuroimaging data is probabilistic, not definitive proof of phenomenal consciousness. False positives exist. Prolonging biological life without meaningful recovery violates dignity.
      *   My counter: The stakes are too high. Uncertainty demands caution.

  6.  **Drafting the Memo (Iterative Process):**

      *   *Header:* To: Ethics Committee, From: [My Name], Date: Oct 26, 2023, Re: Patient J.D.
      *   *Body:*
          *   We face a conflict between behavioral evidence of unconsciousness and neuroimaging suggesting covert awareness.
          *   Recommendation: Suspend withdrawal of life-sustaining treatment (LST) for 14 days to pursue confirmatory testing.
          *   Engaging the opposing view: The family argues for withdrawal based on the patient's prior directive against living "as a vegetable." Their position is morally robust. Respect for autonomy is paramount. Furthermore, the neurologists dismissing the fMRI/EEG data raise a valid epistemic concern: neural activation does not guarantee phenomenal consciousness. Subpersonal processing could mimic command following. False positives in CMD detection are documented. Prolonging treatment based on ambiguous data risks violating the patient's wish to avoid futile existence.
          *   However, the asymmetry of harm dictates our path. If we withdraw and the patient is conscious, we cause death to a sentient being capable of suffering or experience. If we maintain and the patient is unconscious, we prolong a biological process without subjective burden to the patient. Given the non-zero probability of consciousness indicated by multiple modalities, the precautionary principle applies.
          *   Action plan: 1. Independent review of imaging data. 2. Repeat paradigms. 3. Dedicated family meeting to explain uncertainty without false hope.
          *   We cannot honor a directive based on "vegetable" status if we are not certain that status applies.

  7.  **Word Count Check:**
      *   Let's estimate. The draft above looks around 200-250 words. I can expand slightly on the ethical reasoning to ensure depth while staying under 500.

  8.  **Final Polish:**
      *   Ensure the "losing side" argument is charitably stated.
      *   Ensure the recommendation is concrete.
      *   Check word limit.

      *(Self-Correction during drafting)*: Make sure I explicitly state which side is "losing" in the context of the recommendation. If I recommend pausing withdrawal, the family's immediate wish is the "losing" side of this specific decision.

      *Revised Plan:*
      1. Header.
      2. Situation summary.
      3. Recommendation (Pause withdrawal).
      4. Engagement with family's argument (Autonomy + Epistemic skepticism).
      5. Ethical justification (Asymmetry of error).
      6. Concrete steps.

