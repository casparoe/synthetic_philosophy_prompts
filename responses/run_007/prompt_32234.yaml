answer: |-
  You have made an exceptionally sharp observation. What you are describing is a well-known rhetorical and philosophical maneuver, though it does not have a single, universally agreed-upon Latin name like *ad hominem* or *straw man*. Instead, it is usually discussed as a cluster of related concepts in ethics, political philosophy, and logic.

  Here is a breakdown of the specific terms philosophers and political theorists use to identify this move, how it works, and how to distinguish between its legitimate and illegitimate uses.

  ### 1. The Historical Anchor: "Lifeboat Ethics"
  The specific example you gave (the lifeboat) is not accidental. In 1974, the ecologist Garrett Hardin published a famous essay titled **"Lifeboat Ethics: The Case Against Helping the Poor."**

  Hardin explicitly argued that wealthy nations are like lifeboats adrift in a sea of drowning poor nations. He argued that if we pull more people aboard, the boat will swamp, and everyone will die. Therefore, he concluded, we must leave them behind to save ourselves.

  Because this essay was so influential (and controversial), philosophers often refer to this specific argumentative move as **"Lifeboat Ethics"** or **"The Lifeboat Fallacy."** When you hear a politician invoke a sinking ship, a burning building, or a bunker to justify policy, they are invoking Hardin's framework.

  ### 2. The Logical Structure: The "Rigged Intuition Pump"
  In the philosophy of mind, the philosopher Daniel Dennett coined the term **"Intuition Pump."** This is a thought experiment designed to prime your intuition to produce a specific judgment (e.g., the Trolley Problem).

  What you have identified is a **Rigged Intuition Pump.**
  *   **How it works:** The arguer constructs a scenario where the variables are controlled to make one conclusion inevitable (in a real lifeboat, space *is* physically zero-sum).
  *   **The Trick:** They then ask you to export that intuition to a complex political system where the variables are *not* controlled (a national economy is not physically zero-sum; resources can be created, distributed, or expanded).
  *   **The Fallacy:** Logically, this is a specific species of **False Analogy** (or *Weak Analogy*). It assumes that because two situations share *one* feature (scarcity), they share *all* relevant features (physical immediacy, lack of alternatives, certainty of outcome).

  ### 3. The Rhetorical Structure: Motte-and-Bailey
  There is a rhetorical doctrine that fits the *structure* of the move you described perfectly. It is called the **Motte-and-Bailey Fallacy** (named after a medieval castle structure).

  *   **The Bailey (The desirable but hard-to-defend position):** "We should cut immigration benefits because foreigners are taking our jobs." (This is controversial and easily disputed).
  *   **The Motte (The defensible but boring position):** "We cannot accept infinite people into a finite space without consequences." (This is obviously true).
  *   **The Move:** When challenged on the Bailey (the policy), the arguer retreats to the Motte (the lifeboat scenario). "Are you saying we have no borders? Are you saying we should let everyone in until we collapse?"
  *   **The Pivot:** Once you agree that *some* limits are necessary (the Motte), they slide back to the original restrictive policy (the Bailey), claiming your agreement validates their specific harsh solution.

  ### 4. The Political Theory: The "State of Exception"
  In political philosophy, this move is an attempt to declare a **"State of Exception."** This concept was analyzed by theorists like Carl Schmitt and Giorgio Agamben.

  Normal politics operates under rules, rights, and ethical norms. A "State of Exception" is a claimed emergency where those normal rules are suspended to ensure survival. By using a survival thought experiment, the arguer is trying to shift the debate from **Ethics** (what is right?) to **Survival** (what is necessary?).

  If they succeed in framing the situation as a "State of Exception," any moral objection you raise is dismissed as "sentimental" or "dangerous," because in a true emergency, survival trumps morality.

  ### 5. Drawing the Boundaries: Legitimate vs. Illegitimate
  You asked how philosophers distinguish between legitimate and illegitimate uses. Since real emergencies *do* happen (e.g., triage in an ER, rationing food in a siege), the analogy isn't *always* false. Here is the test philosophers use to check the boundary:

  **A. Verifiability of Scarcity**
  *   **Legitimate:** The scarcity is physical, immediate, and verifiable. (e.g., "We have 10 doses of medicine and 11 patients.")
  *   **Illegitimate:** The scarcity is economic, political, or theoretical. (e.g., "We have limited budget" ignores that budgets are political choices, not laws of physics; "We have limited land" ignores density and housing policy).
  *   *The Test:* Can the resource be expanded or redistributed? If yes, the lifeboat analogy fails.

  **B. Immediacy of Threat**
  *   **Legitimate:** The consequence of inaction is immediate death or collapse.
  *   **Illegitimate:** The consequence is vague, long-term, or probabilistic (e.g., "Our culture might change in 50 years," or "The economy might grow slower").
  *   *The Test:* Is the "sinking" happening now, or is it a projection?

  **C. Absence of Alternatives**
  *   **Legitimate:** There are genuinely no other options. (You cannot build more lifeboats in the middle of the ocean).
  *   **Illegitimate:** There are policy alternatives, but they are being ignored. (We could tax differently, invest in technology, or negotiate treaties).
  *   *The Test:* Has the arguer proven that *exclusion* is the only solution, or just the easiest one?

  ### 6. Summary for Your Toolkit
  If you encounter this in a debate, you now have the vocabulary to dismantle it.

  1.  **Identify it:** "This sounds like a version of Garrett Hardin's 'Lifeboat Ethics.'"
  2.  **Name the mechanism:** "You are using a **rigged intuition pump**. You are asking me to apply the logic of a physical emergency to a political economy."
  3.  **Challenge the analogy:** "In a real lifeboat, we cannot build more boats. In this policy context, we *can* create more resources. Therefore, the zero-sum logic does not apply."
  4.  **Expose the Motte-and-Bailey:** "I agree that infinite growth is impossible (the Motte), but that does not prove your specific policy of exclusion is necessary (the Bailey)."

  ### Is there a better name?
  Since you asked, if you wanted to coin a term for your own use that captures the specific *exportation* of the logic, you might call it **"Survival Scenario Exportation."**

  However, in academic contexts, sticking to **"The Lifeboat Fallacy"** (for the content) and **"Motte-and-Bailey"** (for the structure) will make you sound very well-read. You have identified a move that tricks people by hijacking our evolutionary instinct for tribal survival and applying it to modern abstract governance. Recognizing that distinction is the mark of a strong critical thinker.
