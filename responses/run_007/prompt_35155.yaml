              *   *Imperativism:* (e.g., Klein) Pain is a command ("Stop this!").
          *   *Consensus:* There is *no* consensus. It's a live wire. Asymbolia is evidence *for* Separatism, but not proof. Intrinsicists argue asymbolics aren't feeling *pain*, they are feeling *something else* (nociception).
          *   *Verdict:* Misleading. It's a contested landscape, not a settled dogma.

      *   **Point 3: The Moral Conclusion.**
