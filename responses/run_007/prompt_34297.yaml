answer: |-
  1. **The Implicit Theory**
  The practice presupposes a theory of **contingent bodily integrity** rooted in a modified Kantianism, specifically Margaret Radin's concept of "market-inalienability." The core distinction is not biological (regenerative vs. static) but ontological: it separates bodily elements constitutive of personhood from those contingent to it. Under this view, kidneys are "constitutive"—integral to the self's continuity and vitality—whereas plasma, gametes, and gestational capacity are "contingent" resources or services. Selling a constitutive part treats the person as a mere container of spare parts, violating dignity by making personhood fungible. Selling contingent fluids or services treats the body as an instrument of labor, which is permissible under liberal autonomy provided coercion is minimized.

  This theory relies on a threshold of **vital necessity** combined with **non-fungibility**. Plasma is fungible; your body makes more, and its loss doesn't alter who you are. A kidney is non-fungible; its loss permanently alters your biological baseline. Surrogacy fits awkwardly here but is legally categorized as a service (labor) rather than a tissue sale, preserving the fiction that the womb is a workspace, not a commodity. Thus, the implicit theory is that market valuation corrupts goods intrinsically linked to survival and identity, while leaving market valuation permissible for goods linked to production or surplus. It assumes a fragmented self: some parts are *you*, others are *yours* to sell. It reflects Elizabeth Anderson's pluralism: different spheres of value apply to different bodily goods, though boundaries are drawn by social meaning rather than physiology.

  2. **Strict Presupposition vs. Mere Compatibility**
  Strictly presupposed is the claim that **consent is insufficient to legitimize organ sales**. If autonomy were the sole governing principle, the ban would be incoherent; a competent adult should be able to sell what they own. Therefore, the practice presupposes a paternalistic constraint on self-ownership regarding vital organs. It demands that some bodily interests are inalienable rights, not property rights. The state asserts a superior interest in the integrity of the citizen's body than the citizen holds themselves, but only regarding vital organs.

  However, the practice is merely *compatible* with many broader ethical frameworks. A utilitarian could support the ban if they believe organ markets increase net harm (exploitation, medical risk), without accepting the deontological claim that selling kidneys is inherently dignitary harm. Similarly, a virtue ethicist could argue organ sales cultivate vice while plasma donation does not, without committing to Radin's personhood theory. The law does not require you to believe organs have sacred value, only that the state has an interest in preventing their exchange. The strict presupposition is limited to the **non-property status of vital organs**; everything else is rationalization compatible with multiple theories, not demanded by the legal structure itself. The law requires a boundary, but not necessarily the philosophical justification we attach to it. Consequently, the system tolerates theoretical disagreement as long as the legal boundary holds.

  3. **Coherence Check**
  The coherence is fragile. The distinction between "constitutive" organs and "contingent" tissues breaks down under physiological scrutiny. Eggs are finite and non-regenerative, yet sold; plasma regenerates, yet is sold. The distinction cannot be purely biological. The surrogacy exception reveals the theory's reliance on legal categorization over metaphysical reality: gestation is framed as labor to avoid the "baby selling" prohibition, yet it involves profound bodily intrusion comparable to organ extraction. If bodily integrity is the value, surrogacy should be restricted; if labor is the value, kidney donation is a service.

  Furthermore, the parallel altruistic system creates a normative clash. If organs are market-inalienable because money corrupts their meaning (Sandel), why is altruistic transfer virtuous? This suggests the corruption lies in the *price*, not the *transfer*. But if price corrupts, why does price not corrupt egg donation? The practice relies on a folk metaphysics where kidneys symbolize life itself, while eggs symbolize potentiality. This symbolic valuation is inconsistent with the physiological reality that both are biological materials. The system is internally tense, holding together only because the specific markets (eggs, plasma) are regulated differently than the organ transplant infrastructure, allowing contradictory norms to coexist in separate silos. The "meaning" of the organ shifts depending on the legal category, not the biology.

  4. **What Would Change**
  If we rejected the presupposed theory of market-inalienability for straightforward consequentialism, the kidney ban would likely collapse. A consequentialist weighs lives saved against exploitation risks. If a regulated market increases supply and saves lives without causing net harm greater than the current shortage, the prohibition becomes unethical. We would see a shift from felony bans to regulated exchanges, perhaps state-monopolized to mitigate coercion. The distinction between kidneys and plasma would vanish; both would be commodities regulated for safety.

  Conversely, adopting a strict Kantian view (no body parts as means) would eliminate plasma and egg markets. Compensation would be restricted to expense reimbursement, aligning all bodily contributions with the altruistic organ model. The current patchwork would resolve into one of two poles: either a comprehensive property model or a comprehensive dignity model. The middle ground—selling fluids but not organs—requires the unstable distinction between constitutive and contingent body parts that consequentialism ignores and strict Kantianism rejects. The legal landscape would simplify, either expanding markets to organs or contracting them from plasma. Ultimately, the current law is a compromise that satisfies neither pure liberty nor pure dignity.
