answer: |-
  **1. The Procedure**

  **The Superrational Plotting Procedure**

  1.  **Identify Game Structure:** Is this a single interaction or repeated? If repeated with a known end, standard logic suggests defection, but superrationalists might cooperate to preserve the reasoning pattern. **Authorial Judgment:** Decide if their ideological commitment to logic outweighs the tangible incentive to defect at the end. This is where plot often fights theory. Ask: Does the story need betrayal here?
  2.  **Assess Mental Symmetry:** Do your viewpoint characters believe the others reason *identically* to them? Superrationality relies on the assumption that your decision predicts theirs. If they view the opponent as alien, emotional, or irrational, the link breaks. **Authorial Judgment:** Determine if the characters view each other as intellectual mirrors or unpredictable variables. This defines whether superrationality applies at all. Ask: Do they respect the opponent's mind?
  3.  **Analyze Payoff Symmetry:** Are the stakes and rewards identical for all players? If Character A risks death while Character B risks only money, they cannot reason identically. **Authorial Judgment:** Calculate who has the most to lose. The high-stakes player may defect even if superrational, as their utility function differs. You must decide if the stakes difference is known to all parties. Ask: Is the pain of betrayal equal?
  4.  **Check Communication Channels:** Can they signal intent before acting? Explicit agreements strengthen the correlation of reasoning. Silence forces reliance on pure abstraction. If communication is possible but refused, note why. This adds texture to the decision. Ask: Can they talk, or only act?
  5.  **Calculate the Collective Max:** If symmetry holds in steps 2 and 3, choose the outcome that maximizes total group utility. This is the superrational choice. Both parties arrive here independently. It is not altruism; it is logical necessity. Ask: What is the best total outcome?
  6.  **Stress Test for Drama:** Does this choice resolve conflict too easily? If yes, introduce asymmetry in Step 3 or doubt in Step 2. Use the theory to set expectations, then subvert them for character arc. Consistency matters more than optimal play. Ask: Is this too boring?

  Run this checklist before drafting the scene. If you hit an Authorial Judgment flag, pause and decide based on character arc, not math. This ensures your characters remain consistent even when the theory doesn't dictate a single path.

  **2. Worked Example 1**

  **Scenario:** Spies Aris and Kael. One-shot data swap. Strangers.

  Running the procedure clarifies the tension. Step 1 identifies a one-shot game; normally, this dictates defection. However, Step 2 reveals high mental symmetry: both are trained logicians who know the other is trained. They view each other as mirrors. Step 3 confirms payoff symmetry: both get freedom on cooperation, prison on defection. The stakes are identical. Step 4 notes silence; no signals are exchanged, forcing pure abstraction.

  In Step 5, Aris calculates the collective max. He thinks, "Kael reasons like me. My choice is his choice. If I defect, he defects. We both lose. If I cooperate, he cooperates. We win." This isn't trust; it's logical identity. He hands over the drive. Kael hands the key.

  The result is cooperation, but the drama shifts. The tension isn't "will they betray?" but "can they trust the logic?" The reader sweats because standard rationality says betray. The characters sweat because they must trust an abstraction. This creates a unique intellectual tension suitable for a smart thriller. By following the procedure, you avoid having Aris defect for no reason, which would break his established intelligence. The consistency of their superrationality makes the scene feel earned rather than contrived.

  **3. Worked Example 2**

  **Scenario:** Smugglers Jax, Elara, and Torv. Splitting loot.

  Step 1 is one-shot. Step 2 reveals broken symmetry: Jax and Elara are partners with shared history (high correlation), but Torv is a hired gun (low correlation). They do not reason identically. Step 3 highlights asymmetric payoffs: Jax and Elara want future routes intact; Torv wants immediate cash. His utility function differs. This triggers **Authorial Judgment** in Step 3.

  Step 4 shows Jax and Elara signaling loyalty, while Torv remains silent. In Step 5, the calculation splits. Jax reasons superrationally with Elara—they cooperate to preserve the network. But Jax treats Torv as a standard rational actor. Torv, knowing he isn't part of their "mind," defects to maximize immediate gain.

  The result is partial coordination. The betrayal isn't chaos; it's structural. The drama comes from Jax hoping Torv is smarter than he is, not from Torv acting randomly. This allows for a logical betrayal that doesn't make Torv look insane, just an outsider. It preserves the intelligence of the protagonists while allowing conflict. By flagging the asymmetry in Step 3, you ensure the defection feels inevitable rather than plot-induced. The procedure validates the conflict without sacrificing character competence.

  **4. What the Procedure Can't Do**

  Superrationality creates harmony. Harmony is boring. If your characters always cooperate because it's logical, you lose conflict. Use the procedure to set a baseline of competence, then introduce emotional variables the theory ignores. Fear, pride, or love can break the logical link. Also, superrationality can feel cold. If a character cooperates solely because of math, readers may not care. Anchor the logic in emotion.

  Finally, if the theory says "cooperate" but your plot needs "defect," change the symmetry. Make the stakes unequal. Make the minds different. You are the author; the theory is a tool, not a master. Consistency matters more than optimal play. If a character *should* cooperate but feels betrayed, let them defect. Just ensure the reader understands *why* the symmetry broke. Use the gaps in the theory to find your story's unique tension.
