answer: |-
  The debate surrounding Harry Frankfurt's 1969 paper, 'Alternate Possibilities and Moral Responsibility', remains one of the most fertile grounds in contemporary metaphysics and ethics. At its heart lies the Principle of Alternative Possibilities (PAP), which posits that an agent is morally responsible for an action only if they could have done otherwise. Frankfurt's seminal contribution was to construct a thought experiment intended to sever the conceptual link between responsibility and alternative possibilities. However, as you have noted, the 'flicker of freedom' response has kept the debate alive, challenging whether Frankfurt cases truly eliminate all relevant alternatives. In what follows, I shall compare these opposing positions, examining whether the flicker strategy offers a substantive rescue of PAP or merely a verbal evasion, before offering an assessment of which view proves more compelling.

  To understand the stakes, we must first clarify Frankfurt's original challenge. The standard Frankfurt-style case involves an agent, Jones, who is deliberating over whether to perform a specific action, such as voting for a particular candidate. Unbeknownst to Jones, a neurosurgeon, Black, has implanted a device in Jones's brain. Black wishes Jones to vote for the candidate. If Jones shows any sign of wavering—perhaps a specific neural pattern indicating he might choose otherwise—Black will intervene electronically to ensure Jones votes as desired. However, if Jones decides on his own to vote for the candidate, Black does nothing. In the actual sequence of events, Jones chooses to vote for the candidate for his own reasons, and Black remains idle.

  Frankfurt's intuition is that Jones is morally responsible for his vote. He acted on his own desires and reasons; the presence of Black was causally inert in the actual sequence of events. Yet, because of Black's standby readiness, Jones could not have done otherwise; any attempt to choose differently would have been thwarted. If we accept that Jones is responsible despite the lack of alternative possibilities, PAP must be false. Frankfurt thus shifts the focus from 'regulative control' (the power to do otherwise) to 'guidance control' (the mechanism by which the action is actually produced).

  The flicker of freedom strategy, championed by philosophers such as David Widerker and Carl Ginet, attacks the premise that Jones lacks *all* alternative possibilities. The flicker strategist grants that Jones cannot refrain from the *action* itself (voting for the candidate) in the Frankfurt scenario. However, they insist that Jones retains the ability to do something else that is distinct from the action, such as exhibiting the prior sign that would trigger Black's intervention. Jones could have hesitated, or his neural state could have shifted in a way that indicated a willingness to choose otherwise. This 'flicker'—this alternative prior sign—is an alternative possibility that remains open to Jones.

  The crux of the dispute, therefore, turns on the moral relevance of this flicker. The flicker strategist argues that PAP should not be abandoned but refined. They contend that moral responsibility requires *some* alternative possibility, even if it is not the robust ability to perform a different action. The existence of the flicker preserves the logical structure of PAP: Jones is responsible because he could have done something else (shown the sign), even if that 'something else' would inevitably have led to the same outcome via Black's intervention.

  Frankfurt defenders, most notably John Martin Fischer, counter this by arguing that the flicker is not a *robust* alternative. For an alternative possibility to ground moral responsibility in the way incompatibilists require, it must be an opportunity to avoid responsibility altogether. In the Frankfurt case, the alternative possibility (showing the sign) does not allow Jones to avoid the action, nor does it allow him to avoid being responsible for the action. If Jones shows the sign, Black intervenes, and Jones performs the action anyway. Consequently, the flicker is morally trivial. To rely on it is to engage in a verbal defence of PAP; it preserves the letter of the principle ('could have done otherwise') while sacrificing its spirit (the power to determine one's own moral fate).

  This leads us to the critical evaluation of whether the flicker strategy genuinely preserves PAP. I would argue that the flicker strategy succeeds in demonstrating that Frankfurt cases do not eliminate *every* conceivable alternative possibility, but it fails to demonstrate that the remaining possibilities are sufficient to ground the kind of freedom that motivates PAP in the first place. The intuition behind PAP is usually that responsibility requires the agent to be the ultimate source of the action in a way that implies they could have avoided the moral blame or praise attached to it. The flicker does not grant this. It offers an alternative path to the *same* moral outcome.

  Furthermore, Frankfurt's rejoinder suggests that we can construct 'flicker-free' cases. If Black's monitoring is perfect and instantaneous, occurring at the very moment of decision without any prior sign, the flicker disappears entirely. While some argue that a prior sign is conceptually necessary for any decision, this pushes the debate into the philosophy of mind and the nature of volition. Even if we grant that some prior mental state exists, the question remains: is that state under the agent's voluntary control in a way that matters for responsibility? If the sign is involuntary, it cannot serve as the freedom-grounding alternative the flicker strategist needs.

  Which side of this dispute is more compelling? I find Frankfurt's position, particularly as developed by Fischer into the theory of 'actual sequence' compatibilism, to be the stronger philosophical account. The primary reason for this is that it aligns better with our considered judgements about responsibility in ordinary life. When we hold someone responsible, we are typically interested in *why* they acted, not merely in the metaphysical landscape of what else they might have done. If a person acts from their own values, without coercion or ignorance, we hold them responsible. The fact that a counterfactual intervener *would have* forced them had they wavered seems irrelevant to the quality of the agency they actually displayed.

  The flicker strategy, whilst ingenious, ultimately concedes Frankfurt's central insight whilst retreating to a technicality. By admitting that the agent cannot do otherwise regarding the action itself, the flicker strategist acknowledges that the robust alternative possibility is missing. Clinging to the existence of a trivial neural precursor as the saviour of PAP feels like special pleading. It preserves the principle only by diluting the definition of 'alternative possibility' to include events that have no bearing on the agent's moral standing. If the alternative possibility does not allow the agent to escape the outcome or the responsibility, it is difficult to see why its existence is a necessary condition for that responsibility.

  Moreover, the flicker strategy faces a dilemma. If the flicker is robust enough to matter (i.e., it allows the agent to avoid the action), then it is not a Frankfurt case, because Black's control is not counterfactually secure. If the flicker is not robust (i.e., it leads to the same action via intervention), then it cannot do the work PAP requires, which is to provide a 'way out' for the agent. The Frankfurtian insight cuts deeper: it suggests that moral responsibility is a function of the actual history of the action, not the modal status of the agent at the time of decision.

  In conclusion, while the flicker of freedom response successfully complicates the claim that Frankfurt cases eliminate *all* alternative possibilities, it fails to vindicate the Principle of Alternative Possibilities in any meaningful sense. The alternatives it identifies are too thin to bear the weight of moral responsibility. Frankfurt's attack lands because it correctly identifies that what matters for responsibility is the actual sequence of events—specifically, whether the action issues from the agent's own mechanisms of deliberation and choice. The flicker strategist is left defending a hollow shell of PAP, one that retains the terminology of 'could have done otherwise' while abandoning the substantive freedom that made the principle attractive in the first place. Therefore, Frankfurt's challenge stands as a decisive refutation of PAP as a necessary condition for moral responsibility.
