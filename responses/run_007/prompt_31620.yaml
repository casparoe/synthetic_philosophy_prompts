prompt: |-
  I am a novelist, and I am working on a book whose protagonist hosts a small but serious podcast on democratic theory. In one of the central scenes, she interviews a political theorist known for defending the all-affected-interests principle: the view that everyone whose interests are affected by a collective decision ought to have some say in making it, and that this principle offers the right answer to the boundary problem, the question of who should make up the demos in a democracy. I want this scene to feel like a real exchange between two people who know the terrain, not a soft introduction for a lay audience, so the host should be able to press the position where it is genuinely strained.

  Please draft eight to ten interview questions for the scene. The questions should go well beyond asking the guest to restate his view. At least one should press the circularity worry: that identifying who is affected seems to require a prior decision about which decisions count and who gets to judge that, which is precisely the question the principle is meant to answer. At least one should press the difference between being affected by a decision and being subject to a polity's laws, since many people may be affected by, say, a state's environmental policy without being governed by it. At least one should press the over-inclusiveness worry: once causal chains are traced far enough, nearly everyone is affected by nearly everything, so the principle may generate a demos with no workable boundaries. At least one should press the instability of the demos across levels and framings of a decision, since a city ordinance, a national statute, and a treaty each seem to summon a different demos. And at least one should ask whether the boundary problem admits of a democratic solution at all, or whether the act of constituting the demos must ultimately rest on something other than democratic principle. For each question, include a follow-up keyed to the reply the guest is most likely to give, so the host can keep the pressure on rather than allowing him to deflect.
reasoning: |-
  Here's a thinking process that leads to the suggested interview questions:

  1.  **Analyze the Request:**
      *   **Context:** A novelist is writing a scene where a protagonist (podcast host) interviews a political theorist.
      *   **Topic:** Democratic theory, specifically the "all-affected-interests principle" (AAI) and the "boundary problem" (who constitutes the *demos*).
      *   **Tone:** Serious, expert-level exchange. Not a soft intro. The host knows the terrain and presses hard on weaknesses.
      *   **Requirements:** 8-10 interview questions.
      *   **Specific Constraints:**
          *   Must address the circularity worry (identifying affected interests requires prior boundaries).
          *   Must address the distinction between being *affected* vs. being *subject* to law (coercion).
          *   Must address the over-inclusiveness worry (infinite causal chains).
          *   Must address the instability of the *demos* across levels/framings (fluidity vs. stability).
          *   Must address whether the boundary problem admits of a *democratic* solution at all (constitutive paradox).
          *   Each question needs a follow-up keyed to the guest's likely defensive reply.

  2.  **Deconstruct the Theoretical Terrain:**
      *   *The All-Affected-Interests Principle (AAI):* Everyone affected should have a say.
      *   *The Boundary Problem:* Democracy presupposes a people (*demos*), but who decides who the people are? If the people decide, they must already exist.
      *   *Critiques:*
          *   *Circularity:* To know who is affected, you need to know what the decision is. But to make the decision, you need to know who the voters are.
          *   *All-Subjected Principle (ASP):* Alternative view. Only those subject to coercion/law should have a say. Avoids some AAI issues but has its own.
          *   *Causal Chains:* Climate change affects everyone. Does everyone vote on local zoning?
          *   *Institutional Stability:* Democracies need stable electorates. AAI implies fluid electorates changing per issue.
          *   *The "Constitutive Outside":* Schmittian critique. The decision on the exception/boundary is pre-political.

  3.  **Drafting the Questions (Iterative Process):**

      *   *Question 1: The Circularity Worry.*
          *   *Draft:* Isn't it circular? You need to know the decision to know who is affected, but you need the people to make the decision.
          *   *Refinement:* Make it sharper. Focus on the "meta-decision."
          *   *Follow-up:* Guest will say we can approximate interests empirically. Host needs to press that *empirical* judgment is itself political.

      *   *Question 2: Affected vs. Subjected.*
          *   *Draft:* What about people affected but not citizens? Like environmental policy.
          *   *Refinement:* Distinguish between causal impact and normative subjection. Why is "interest" enough without "coercion"?
          *   *Follow-up:* Guest will argue coercion is too narrow. Host presses on the dilution of accountability.

      *   *Question 3: Over-inclusiveness/Causal Chains.*
          *   *Draft:* Doesn't this mean everyone votes on everything? Butterfly effect.
          *   *Refinement:* Focus on "tracing causal chains." Where do we cut it off?
          *   *Follow-up:* Guest will suggest "significant" interests. Host presses on who defines significance.

      *   *Question 4: Instability/Fluidity.*
          *   *Draft:* If the demos changes every issue, how do we govern?
          *   *Refinement:* Contrast the *procedural* need for a stable body with the *substantive* fluidity of AAI.
          *   *Follow-up:* Guest might suggest liquid democracy or issue-based voting. Host presses on the loss of deliberative continuity.

      *   *Question 5: The Democratic Solution to Boundaries.*
          *   *Draft:* Can democracy solve its own boundaries? Or is it pre-democratic?
          *   *Refinement:* Invoke the "constitutive paradox." Is the initial boundary an act of force, not democracy?
          *   *Follow-up:* Guest will argue for iterative democratization. Host presses on the initial exclusion required to start the iteration.

      *   *Question 6: Intensity vs. Count.*
          *   *Draft:* Does intensity of interest matter?
          *   *Refinement:* If my interest is life-or-death and yours is trivial, do we get equal votes? AAI implies weighting.
          *   *Follow-up:* Guest might resist weighting votes. Host points out this betrays the "one person, one vote" norm derived from AAI.

      *   *Question 7: Future Generations.*
          *   *Draft:* What about people not born yet? They are affected.
          *   *Refinement:* They are maximally affected by climate policy but cannot speak. Does AAI break here?
          *   *Follow-up:* Guest suggests proxies. Host presses on the fiction of representing the non-existent.

      *   *Question 8: The "All-Subjected" Alternative.*
          *   *Draft:* Why not just use the coercion principle?
          *   *Refinement:* Frame it as a retreat from the radical promise of AAI. Is ASP just a convenient fence?
          *   *Follow-up:* Guest defends AAI's moral scope. Host asks if moral scope is compatible with political agency.

      *   *Question 9: Jurisdictional Conflict.*
          *   *Draft:* What if two demoi disagree?
          *   *Refinement:* Overlapping jurisdictions. If a local decision affects outsiders, do outsiders veto?
          *   *Follow-up:* Guest suggests negotiation. Host presses on whether that negotiation is democratic or diplomatic.

      *   *Question 10: The Status Quo Bias.*
          *   *Draft:* Doesn't this favor current powers?
          *   *Refinement:* Determining "affectedness" often relies on existing legal frameworks. Does AAI inadvertently reinforce state sovereignty?
          *   *Follow-up:* Guest denies this. Host points out the reliance on state data to determine effects.

      *(Self-Correction during drafting)*: I need to ensure I hit the specific constraints requested in the prompt while maintaining the flow of a real interview. I will select the strongest 8-10 that cover the required bases + additional theoretical depth.

      *Selection:*
      1. Circularity (Required)
      2. Affected vs. Subjected (Required)
      3. Over-inclusiveness (Required)
      4. Instability/Fluidity (Required)
      5. Democratic Solution/Constitutive Paradox (Required)
      6. Intensity/Weighting (Deepens the "interest" critique)
      7. Future Generations (Stress test for "interests")
      8. The "Cut-off" Point (Operationalizing significance)
      9. Sovereignty/Exclusion (The dark side of boundaries)
      10. Epistemic Authority (Who judges the effect?)

  4.  **Refining Tone and Follow-ups:**
      *   The host shouldn't sound hostile, but rigorous. "Pushing the logic" rather than "attacking the person."
      *   The follow-ups must anticipate the standard academic defense (e.g., "we can use thresholds," "it's iterative," "we use proxies") and show why that defense might be insufficient.

  5.  **Final Review against Constraints:**
      *   8-10 questions? Yes.
      *   Circularity included? Yes (Q1).
      *   Affected vs. Subjected included? Yes (Q2).
      *   Over-inclusiveness included? Yes (Q3).
      *   Instability included? Yes (Q4).
      *   Democratic solution/Constitutive paradox included? Yes (Q5).
      *   Follow-ups included? Yes.
      *   Tone appropriate? Yes.

  6.  **Final Polish:** Check for jargon accuracy (*demos*, *constituency*, *coercion*, *iterative*, *constitutive*). Ensure the flow feels like a conversation escalating in tension. (I will organize them logically to build the argument).

      *Let's structure the interview arc:*
      *   Start with the core mechanism (Circularity).
      *   Move to the scope (Affected vs. Subjected, Over-inclusiveness).
      *   Move to the structure (Instability, Weighting).
      *   End with the foundational paradox (Constitutive outside, Democratic solution).

      *Wait, I need to make sure the follow-ups are specific.*
      *   *Example:* If Guest says "We use thresholds," Host says "Who sets the threshold?"
      *   *Example:* If Guest says "It's iterative," Host says "The first iteration requires exclusion."

      *Okay, ready to write.*
answer: |-
  Here are ten interview questions designed for your scene, structured to escalate the theoretical pressure. They move from operational difficulties to the foundational paradoxes of the view. Each includes a follow-up designed to counter the standard academic defense.

  **1. The Circularity of the Meta-Decision**
  "You argue that the *demos* should be constituted by the scope of affected interests. But to determine whose interests are at stake, we have to define the decision itself. Doesn't this create a vicious circle? We need the *demos* to decide the issue, but we need to know the issue to identify the *demos*. Who makes the prior, meta-decision about which causal chains count as 'relevant effects' for the purpose of drawing the boundary?"
  *   **Follow-up:** "If you say that meta-decision is made by existing institutions, aren't you conceding that the boundary is ultimately set by coercive power or historical accident, not by the all-affected principle itself? You're smuggling in the very exclusion you claim to solve."

  **2. Affected Interests vs. Subjection to Coercion**
  "Let's distinguish between being *causally impacted* and being *subject to law*. A farmer in Bangladesh is affected by my state's carbon emissions, but she is not subject to our legislature's coercion. The 'all-subjected' principle draws the boundary at the point of enforceable obligation. Why is mere causal impact sufficient to generate a claim to political authorship? Does this not conflate humanitarian concern with democratic right?"
  *   **Follow-up:** "But if you grant her a vote based on impact, you are granting her authority over my local obligations without her sharing in the burden of enforcement. Doesn't that sever the link between accountability and power that makes democracy function?"

  **3. The Problem of Infinite Causal Chains**
  "In a globalized economy, almost every local zoning decision ripples outward through supply chains and environmental shifts. If we trace causal chains faithfully, the 'all-affected' constituency for a city council vote could theoretically encompass the globe. Where do you cut the chain? Is there a non-arbitrary threshold for 'significance,' or does the principle dissolve into a demand for global plebiscites on local issues?"
  *   **Follow-up:** "You suggest a threshold of 'significant' interests. But significance is normative, not empirical. Deciding whose interests are 'significant' enough to count is itself an exercise of power. Aren't you just asking the powerful to benevolently limit their own definition of significance?"

  **4. The Instability of the Demos**
  "Democracies rely on stable institutions to deliberate over time. But if the *demos* reconstitutes itself with every new issue based on who is affected, we lose the continuity of the political community. How do you build deliberative trust or long-term accountability if the electorate for the climate bill is fundamentally different from the electorate for the tax code?"
  *   **Follow-up:** "You propose fluid, issue-specific voting. But without a stable body to oversee the implementation and revision of these decisions, doesn't the 'demos' become a momentary aggregate of preferences rather than a sovereign people capable of willing a common future?"

  **5. The Constitutive Paradox**
  "Robert Dahl and others have suggested the boundary problem admits of no democratic solution—that the initial constitution of the *demos* must be an act of force, law, or historical contingency. If the all-affected principle cannot be applied without first assuming a boundary to judge effects from, must we admit that democracy always rests on an undemocratic foundation?"
  *   **Follow-up:** "You argue we can democratize the boundaries iteratively. But the first iteration requires a starting group to open the gates. If that starting group excludes those 'affected' by the exclusion itself, doesn't the original sin of arbitrary boundary-drawing taint the entire subsequent process?"

  **6. Intensity and Weighting**
  "The principle says everyone affected should have a *say*. But interests vary in intensity. If a policy threatens my livelihood but only slightly inconveniences you, the all-affected principle seems to demand weighted voting to reflect the magnitude of the effect. Are you prepared to abandon 'one person, one vote' in favor of a system where stake determines voting power?"
  *   **Follow-up:** "If you insist on equal votes despite unequal stakes, you are prioritizing political equality over the protection of affected interests. So which is it? Is the goal to protect interests or to maintain the ritual of equality? You can't do both."

  **7. Future Generations and the Non-Existent**
  "Future generations are maximally affected by our decisions on debt and climate, yet they cannot speak or vote. If the all-affected principle is the gold standard, our current *demos* is illegitimately exclusionary by definition. Do we need to institutionalize proxies for the unborn, or do you accept that the principle breaks down when the 'affected' do not yet exist?"
  *   **Follow-up:** "If you rely on proxies, we are no longer talking about self-government, but trusteeship. Does this admit that democracy is inherently presentist and cannot, even in theory, satisfy the all-affected principle across time?"

  **8. The Epistemic Authority of the Boundary**
  "Who has the epistemic authority to map the affected interests? If we rely on social science to trace impacts, we are handing the boundary question to technocrats. If we rely on political contestation, we are back to the existing *demos* deciding who gets in. Is there any mechanism here that isn't either technocratic or circular?"
  *   **Follow-up:** "So the boundary is always a political claim, not a factual discovery. If that's true, why dress it up as a principle of 'affectedness'? Why not admit it's simply a struggle over inclusion and exclusion, where the principle is just a rhetorical weapon?"

  **9. Overlapping Jurisdictions and Veto Power**
  "If a local decision affects outsiders, does the all-affected principle grant those outsiders a veto? If not, their 'say' is merely consultative, which seems to violate the core demand for democratic control. If yes, doesn't this grant non-members veto power over members, effectively dissolving local self-determination?"
  *   **Follow-up:** "You suggest negotiation between overlapping demoi. But negotiation is diplomacy, not democracy. It resolves conflicts through bargaining power, not popular sovereignty. Are you describing a democratic system, or a post-democratic regime of stakeholder management?"

  **10. The Status Quo Bias of 'Interests'**
  "Finally, 'interests' are not pre-political; they are shaped by the very legal structures we are trying to justify. A corporation's 'interest' in polluting is created by property law. By taking 'interests' as the input for the boundary, aren't you reinforcing the power structures that generated those interests in the first place?"
  *   **Follow-up:** "If the principle takes existing interests as given, it cannot critique the systems that create those interests. So the all-affected principle might actually be a conservative doctrine, one that democratizes the management of the status quo rather than enabling a people to transform it."
