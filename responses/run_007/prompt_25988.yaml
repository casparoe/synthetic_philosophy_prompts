      *   *Section 1: The Map of Exposure.*
          *   *Tier 1: Dismissible (The "Straw Man" Objections).* Confusing worth with utility. Confusing worth with legal liability.
          *   *Tier 2: Theoretical Tensions (The "Qualification" Zone).* The Epistemic Access Problem (How to be motivated by X if you don't know X is the right-maker?). The "De Dicto/De Re" distinction.
          *   *Tier 3: Hard Bullets (The "Genuine Problems").* The Conscientious Mistake (The "Saintly Error"). Moral Luck (Externalism). The Problem of Opacity (Self-knowledge).
      *   *Section 2: Qualifications in Literature.*
          *   Mention Arpaly (responsiveness to reasons).
          *   Mention Sigrún Svavarsdóttir (moral worth and luck).
          *   Mention the shift from "belief" to "disposition" or "counterfactuals."
      *   *Section 3: Falsifiability & Significance.*
          *   Is it a "Rorschach test"?
          *   Does it fail as a guide to life?
      *   *Conclusion:* Summary of the trade-off (Precision vs. Accessibility).

  7.  **Refining the Content (Self-Correction during drafting):**
      *   *Correction:* The user's view is distinctively *externalist* regarding the right-making features. Standard Kantianism is internalist (acting from the *concept* of duty). I need to make sure I highlight this tension. The user's view is closer to **Arpaly's "Unprincipled Virtue"** than strict Kantianism, though it uses Kantian language.
      *   *Key Distinction:* The user says: "inverse akrasia cases" are allowed. This is a hallmark of Arpaly.
