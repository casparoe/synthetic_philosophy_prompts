prompt: |-
  I hold the view that an action's moral worth depends entirely on the agent's motivating reasons, and specifically on whether those reasons coincide with the features that make the action right. On this view, someone who visits a sick friend out of genuine concern for the friend's wellbeing acts with moral worth; someone who visits the same friend purely to secure a place in the will does not — even if both perform the same helpful action. Crucially, what matters is the actual right-making features, not what the agent believes about rightness: the view thus allows that someone can act with moral worth without believing they are doing anything morally significant (the inverse akrasia cases), and that someone can act dutifully but without moral worth if their conception of duty is mistaken. I want to know what would count against this picture. I'm looking for a map of the view's exposure: which cases, intuitions, and theoretical pressures should make me revise or abandon it, sorted from those that defenders would dismiss as resting on a misunderstanding to those they would have to concede are genuine problems. I also want to know whether the view, as developed in the literature, has been qualified in ways that make it hard to falsify — and whether that matters for a view of this kind.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Core View:** The user holds a specific view about moral worth.
          *   Moral worth depends *entirely* on motivating reasons.
          *   Specifically, reasons must coincide with *actual* right-making features (not just believed right-making features).
          *   This allows for "inverse akrasia" (doing the right thing for the right reason without believing it's morally significant).
          *   This excludes acting from a mistaken conception of duty (even if dutiful in intent).
      *   **Goal:** The user wants a "map of the view's exposure." They want to know what counts *against* this picture.
      *   **Structure:** Sort objections from "dismissible misunderstandings" to "genuine concessions."
      *   **Additional Query:** Has this view been qualified in the literature to make it hard to falsify? Does that matter?
      *   **Tone:** Philosophical, analytical, critical but fair.

  2.  **Identify the Philosophical Position:**
      *   This view is a specific variant of the **Kantian/Right Reason** account of moral worth.
      *   It aligns closely with **Pauline Kleingeld**, **Mark Timmons**, or **Robert Johnson**'s interpretations of Kant, but specifically emphasizes the *objective* right-making features over the *subjective* conception of duty.
      *   It contrasts with the standard Kantian reading (acting *from duty* requires believing it is duty) and Utilitarian accounts (outcome-based).
      *   It sounds very much like the "Right Reason" view discussed in contemporary meta-ethics (e.g., **Arpaly & Schroeder**, **Hursthouse**, though Arpaly is more about responsiveness to reasons generally).
      *   Actually, the specific claim that it depends on *actual* right-making features rather than *believed* duty is a strong externalist constraint on moral worth. This is often associated with **Nomy Arpaly's** "Unprincipled Virtue" (responsiveness to moral reasons) or a specific reading of Kant's *Groundwork* (acting from the *moral law* itself, not the *concept* of the moral law).
      *   Let's label it for clarity: **The Objective Right-Reason View (ORRV)**.

  3.  **Brainstorm Objections/Pressures:**
      *   *Epistemic Access:* How does the agent know the actual right-making features? If they don't know, can they be motivated by them?
      *   *The Mistaken Conscience:* What about someone who tries hard to do right but has false empirical beliefs? (User says this lacks worth. Is that intuitive?)
      *   *Over-intellectualization:* Does this require too much moral knowledge for ordinary virtue?
      *   *Moral Luck:* If moral worth depends on *actual* features (which are often outside agent's control), isn't moral worth subject to luck?
      *   *Praise/Blame Symmetry:* If I do the right thing for the right reason (accidentally/unaware), am I praiseworthy? If I do the wrong thing for the right reason (mistaken), am I blameworthy?
      *   *The "Saintly Mistake":* A person sacrifices everything for a cause they *think* is right, but isn't. User says: No moral worth. Intuition: They seem virtuous, just mistaken.
      *   *Motivational Opacity:* Can we ever know if our reasons coincide with actual features?

  4.  **Categorize Objections (The "Map"):**
      *   *Category 1: Misunderstandings/Category Errors.* (Defenders dismiss these). E.g., Confusing moral worth with praiseworthiness in a legal sense, or confusing it with outcome value.
      *   *Category 2: Tensions/Refinements.* (Defenders qualify the view). E.g., The epistemic condition (how to access actual features), the scope of "reasons."
      *   *Category 3: Genuine Problems/Counterexamples.* (Defenders must concede or bite a hard bullet). E.g., Moral Luck, The Conscientious Mistake.

  5.  **Address the "Falsifiability/Qualification" Question:**
      *   Literature often adds "normal conditions," "reasonable belief," or "counterfactual sensitivity" to save the view.
      *   Does this make it unfalsifiable? It risks becoming a "no true Scotsman" or purely extensional account.
      *   Does it matter? Yes, if the goal is action-guidance. If the goal is metaphysical classification, maybe less so.

