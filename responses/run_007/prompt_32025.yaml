answer: |-
  **Setting:** *A cluttered office, late afternoon. Coffee cups everywhere. Leo is pacing; Maya is slouched in a rolling chair.*

  **Leo:** Look, your friend's objection is intuitive, I get it. But saying hedonism is dead because pleasures feel different is like saying "red" doesn't exist because a red apple looks different than a red sunset.

  **Maya:** That's the thing though. With red, there's a specific wavelength. With pleasure... what's the wavelength of scratching a mosquito bite compared to finishing a proof? One is relief, basically the cessation of pain. The other is triumph. They don't even point in the same direction.

  **Leo:** They share a hedonic tone. A felt quality. It's a glow, or a tinge, that sits on top of the experience. When you scratch the itch, there's the sensation of the scratch, plus the *goodness* of it. When you solve the proof, there's the intellectual content, plus the *goodness* of it. The content changes, the tone stays the same.

  **Maya:** But can you actually isolate it? Close your eyes and find the "tone" in gloating over a rival. That's a cold pleasure, Leo. It's sharp. Now find that same tone in the relief of finding your keys when you're late. That's warm, diffuse. If you have to stretch the definition of "tone" until it covers ice and fire, are you even talking about a feeling anymore?

  **Leo:** I'm not saying the intensity is the same. I'm saying the valence is. It feels *good*. There is something it is like to have that experience that draws you toward it. If there wasn't a common felt quality, why would we call them both pleasure? We'd just have a list of unrelated states.

  **Maya:** Because we take a certain attitude toward them. That's the view. Pleasure isn't a sensation you detect; it's a stance you take. To be pleased is to *enjoy* a state of affairs. When you gloating, you're enjoying the fact that your rival lost. When you find the keys, you're enjoying the fact that you're not locked out. The heterogeneity isn't a bug, it's a feature. There *shouldn't* be a common feeling because the objects of enjoyment are totally different.

  **Leo:** Okay, but "enjoyment." What is that? If it's not a feeling, what are you doing? Are you judging the state of affairs? "Yes, this is good"?

  **Maya:** No, not necessarily a judgment. It's non-doxastic. You don't have to believe it's good to enjoy it. You just... welcome it. You're for it.

  **Leo:** See, that's where you lose me. "Being for it" sounds like a metaphor for a feeling. If I'm "welcoming" the sensation of the warm bath, what does that welcoming consist of? If you strip away the phenomenology—the warmth, the relaxation, the *ahhh*—what's left?

  **Maya:** The disposition. If I'm enjoying the bath, I want it to continue. If someone tries to pull me out, I resist. That's the attitude.

  **Leo:** But infants, Maya. Cats. They definitely have pleasure. A kitten playing with a string is having a good time. But does a kitten have a propositional attitude toward a state of affairs? Does it represent "the string is moving" and then adopt a pro-stance toward that proposition? That seems insane. They just feel the play. The felt-quality view handles animals easily. They have nervous systems, they have tones.

  **Maya:** You're assuming attitudes have to be linguistic or highly intellectual. That's a mistake. A cat can be disposed toward a state of affairs without having language. It's about functional role. The cat's system registers the string-moving as something to be sustained. That's the attitudinal view. It scales down. Your view scales up too much.

  **Leo:** How so?

  **Maya:** Because you can have the feeling without the pleasure. Think about deep brain stimulation. You could stimulate the reward center so someone feels that "hedonic tone" you're talking about, but they're confused. They aren't enjoying *anything*. They're just buzzing. Is that intrinsic good? Or is it good because they're enjoying the buzz?

  **Leo:** If they're buzzing with the right tone, they're enjoying it. You're splitting hairs.

  **Maya:** Am I? What about masochists? They feel pain—the felt quality is awful, sharp, burning. But they enjoy it. On your view, how does that work? Is there a secret pleasure feeling hidden inside the pain feeling?

  **Leo:** It's complex. The pain is there, but there's an overlay. A satisfaction.

  **Maya:** That "satisfaction" is the attitude! You're admitting it. The sensation is pain. The *pleasure* is the fact that they welcome the sensation. So the pleasure isn't the feeling. The feeling is just the object.

  **Leo:** But then what makes the welcoming good? Why is "being for" the pain better than "being against" it? If there's no felt difference between the two stances, then hedonism collapses into desire-satisfaction. And you know desire-satisfaction is empty. I can satisfy a desire I don't know I have. That doesn't make my life better.

  **Maya:** True. But enjoyment isn't just desire. It's occurrent. You're actively engaged. Look, the problem with your view is it makes pleasure too passive. Like you're just a bucket catching good-feeling rain. But pleasure is active. It's engaging with the world. When I read a great book, the pleasure isn't a tingling in my spine. It's being absorbed in the story. If I focus on the tingling, I lose the pleasure.

  **Leo:** But if you're absorbed, there's still a phenomenology of absorption. It feels smooth, effortless. That's the tone! You're trying to define "feeling" too narrowly. You think it has to be a distinct sensation like an itch or a taste. But moods are feelings. Atmospheres are feelings. The "goodness" is the atmosphere of the experience.

  **Maya:** But then "feeling" becomes so vague it covers everything. If the atmosphere of gloating is cold and the atmosphere of relief is warm, and the only thing they share is the word "good," then you haven't found a natural kind. You've just put a label on it.

  **Leo:** And if you say it's an attitude, haven't you just hidden the feeling inside the word "enjoyment"? What is enjoying, if not feeling good about something?

  **Maya:** It's functioning well. It's alignment.

  **Leo:** Alignment feels like something.

  **Maya:** Does it? Or do you just say it feels like something because you can't imagine consciousness without phenomenology?

  *Leo stops pacing. He picks up a cold coffee cup, puts it down.*

  **Leo:** Maybe. But if I take away the feeling... if I take away what it's *like*... there's nothing left to value. A robot could have "attitudes." It could track states of affairs and try to maintain them. But it doesn't matter to the robot. It matters to us because it feels like something.

  **Maya:** I agree it matters because it feels like something. I just disagree that the "something" is a separate ingredient called pleasure. The feeling is the experience itself, lived in a certain way. You want to extract the syrup from the fruit. I'm saying the sweetness is in the eating.

  **Leo:** But if the sweetness isn't a detectable quality, how do you know you're eating the fruit and not the rind?

  **Maya:** Because I'm hungry.

  *Silence for a beat. Maya spins her chair slightly.*

  **Maya:** Seriously though. Try to find the common tone between finishing that proof and the mosquito bite. Really look for it.

  **Leo:** And you try to explain the kitten without admitting it's having a feeling.

  **Maya:** Deal.

  *Leo sits down. He looks tired.*

  **Leo:** Pass the sugar. Even if pleasure is just an attitude, this coffee tastes like mud.

  **Maya:** *laughs* See? You're attitudinalizing the taste. You're against the mudness.

  **Leo:** Don't start. I'm feeling the bitterness. It's distinct. It's real.

  **Maya:** Sure. But you'd rather not feel it.

  **Leo:** Exactly. Because it feels bad.

  **Maya:** Or because you take a negative attitude toward it.

  **Leo:** God, you're exhausting.

  **Maya:** And yet, you're enjoying this conversation.

  **Leo:** ...Shut up.

  **Maya:** Is that a feeling? Or an attitude?

  **Leo:** *sighs* It's a headache. That's a feeling. And it's definitely bad.

  **Maya:** Okay. We can agree on that much.

  *Leo rubs his temples. Maya smiles, but looks thoughtful. The question hangs there, unresolved, in the quiet room.*
