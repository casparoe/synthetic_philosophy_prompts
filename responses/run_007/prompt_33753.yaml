  8.  **Final Polish:** Ensure tone is respectful of the user's background (chemist) and epistemic curiosity. (Proceed to generate output).

  *(Self-Correction during drafting)*: I need to make sure I don't confuse the "Lottery Paradox" (justification of belief) with the "Preface Paradox" (rationality of inconsistent beliefs). The user asks about *rational belief*.
  *   Lottery: Can I believe Ticket 1 will lose? (Standard answer: No, because it's purely statistical).
  *   Preface: Can I believe Claim 1 is true... Claim 100 is true, AND believe at least one is false? (Standard answer: Yes, it's rational inconsistency).
  *   Hybrid: Can I believe Sample 1 is pure... Sample 100 is pure (based on tests), AND believe exactly one is impure (based on machine design)?
