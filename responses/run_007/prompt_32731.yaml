answer: |-
  This is one of the most persistent and fruitful confusions in modern moral philosophy. You have correctly identified that the "decision procedure" defense is the standard consequentialist counter-move, and you are also right to suspect that Williams is aiming at something deeper than cognitive timing.

  Here is the architecture of the objection, broken down by target, mechanism, and its relationship to the integrity argument.

  ### 1. Criterion vs. Decision Procedure: Why the Defense Fails
  The standard consequentialist defense you mentioned is: *Consequentialism is a criterion of rightness, not a decision procedure. The agent should act on love; the theory merely validates the action afterwards.*

  Williams's objection survives this move because he is not attacking the agent's **psychology**, but the theory's **authority structure**.

  If Consequentialism is true as a *criterion of rightness*, it claims to be the exhaustive account of what makes actions right. Therefore, for a reflective agent who accepts the theory, the *reason* that saving the wife is a valid action is ultimately that it maximizes the good (or is permitted by the impartial standard). Even if the agent does not consciously think "maximize utility" in the moment, if they accept Consequentialism as the truth about morality, they must accept that their love is only *normatively valid* because the impartial theory allows it.

  Williams is arguing that this structure of justification is incompatible with the nature of personal love. Love, by its conceptual nature, demands that the reason for action be the person themselves ("she is my wife"), not a permission granted by an impartial system. If the agent accepts the consequentialist criterion as the final court of appeal, they have already admitted that their relationship is subordinate to the impartial standpoint. The "thought" isn't a temporal event; it is a structural commitment to a certain kind of justification.

  **The Target:** The objection targets moral theories that claim **exhaustive normative authority**. It argues that the "Impartial Standpoint" cannot be the sole source of justification for all actions without distorting the concepts (like love, friendship, commitment) that make those actions meaningful.

  ### 2. What Exactly Changes? (Motives, Relationships, or Coherence?)
  You asked whether the agent's motives are corrupted, the relationship is damaged, or the stance is incoherent. The answer is a specific combination of these: **The conceptual integrity of the relationship is undermined by moral mediation.**

  Williams is making a point about the **phenomenology of commitment**.
  *   **Direct vs. Mediated:** In a genuine personal relationship, the commitment is direct. I save her *because* she is my wife. In the consequentialist picture (even as a criterion), the commitment is mediated. I save her *because* saving her is consistent with the impartial good.
  *   **The Corruption:** The corruption is not necessarily that the agent becomes a cold calculator (motive corruption). The corruption is that the agent acknowledges that their love is only legitimate insofar as it survives the scrutiny of the impartial spectator. This turns the spouse from a **source of reasons** into an **object of permissible concern**.
  *   **Alienation:** This creates a form of alienation. The agent is no longer fully identified with their action. Part of their mind (the reflective, moral part) stands back and judges the love rather than simply inhabiting it.

  So, it changes the **relationship to the reason**. The reason "she is my wife" ceases to be a fundamental, underived reason and becomes a derivative reason (derived from the principle that "saving wives is generally utility-maximizing/permissible"). Williams argues that love cannot survive being treated as derivative.

  ### 3. One Thought Too Many vs. The Integrity Objection
  Are they the same? They are distinct but structurally identical arguments operating at different levels.

  *   **The Integrity Objection (from *Utilitarianism and Integrity*):** This is the **metaphysical/psychological** argument. It focuses on the agent's identity. It argues that utilitarianism attacks the agent's "ground projects" (the commitments that give life meaning) by requiring the agent to be a neutral channel for utility. It claims utilitarianism alienates the agent from **themselves**.
  *   **One Thought Too Many (from *Persons, Character and Morality*):** This is the **conceptual/relational** argument. It focuses on the content of specific personal relationships. It argues that utilitarianism cannot make sense of the *logic* of special obligations without distorting them. It claims utilitarianism alienates the agent from **their loved ones**.

  **The Relationship:**
  Think of the Integrity Objection as the umbrella and "One Thought Too Many" as the sharpest spear beneath it.
  *   Integrity explains *why* it is costly to live as a utilitarian (loss of self).
  *   "One Thought Too Many" explains *why* it is conceptually impossible to be a utilitarian in personal relationships without falsifying those relationships.

  They stand or fall together because both rely on the premise that **the Impartial Standpoint is not the only legitimate standpoint for practical reasoning.** If you concede that personal projects and relationships generate their own independent reasons (that do not need validation from the impartial view), both objections lose their force. If you maintain that the impartial view is exhaustive, both objections hold.

  ### 4. Summary of the Architecture
  *   **Target:** Not just Consequentialism as a guide to action, but any moral theory that claims the "Impartial Standpoint" is the exclusive source of normative justification.
  *   **Mechanism:** It argues that mediating personal commitments through an impartial permission transforms the commitment from a direct bond into a sanctioned preference, which is conceptually incompatible with the nature of love.
  *   **Decision Procedure Defense:** Fails because the objection concerns the *validity conditions* of the agent's reasons, not the *timing* of their thoughts.
  *   **Relation to Integrity:** "One Thought Too Many" is the specific application of the Integrity Objection to the domain of personal relationships; Integrity covers the self, OTTM covers the other.

  Williams's 'one thought too many' targets the exhaustive normative authority of impartial theories rather than their decision procedures, arguing that mediating personal commitments through moral permission conceptually corrupts relationships and serves as a specific instance of the broader integrity objection.
