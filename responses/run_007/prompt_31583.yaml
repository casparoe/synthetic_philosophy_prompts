answer: |-
  This is one of the most persistent and justified confusions in the foundations of physics. The reason you encounter three different camps is that Bell's theorem is a **no-go theorem for a conjunction of assumptions**, but different physicists choose to save different assumptions.

  Here is the breakdown of the logic, the interpretations, and the signaling issue, with explicit confidence markers regarding the consensus on each point.

  ### 1. The Logical Core: What the Theorem Actually Proves
  Bell's theorem is a mathematical proof that starts with a set of premises and derives an inequality (e.g., $|S| \leq 2$). Quantum mechanics predicts, and experiments confirm, that this inequality is violated (e.g., $S \approx 2.8$).

  Therefore, the **conjunction** of the premises must be false. The standard premises are:
  1.  **Locality:** No influence travels faster than light.
  2.  **Realism:** Physical properties have definite values prior to measurement (often formalized as "hidden variables" or "counterfactual definiteness").
  3.  **Freedom (Statistical Independence):** The experimenter's choice of measurement setting is independent of the hidden state of the particles.

  **The Logic:** $\text{Locality} \land \text{Realism} \land \text{Freedom} \implies \text{Bell Inequality}$.
  **The Observation:** $\text{Bell Inequality is False}$.
  **The Conclusion:** $\neg (\text{Locality} \land \text{Realism} \land \text{Freedom})$.

  This is logically equivalent to: **Either Nonlocality OR Non-Realism OR Superdeterminism (No Freedom).**

  *   **Confidence Level:** **Extremely High.** This logical structure is mathematically rigorous and represents the consensus view of the theorem's derivation. There is no debate about the logic itself.

  ### 2. Addressing the Three Camps
  The three camps you mention correspond to which premise they are willing to discard.

  *   **Camp 1 (Rules out Local Hidden Variables):** This is the historical phrasing. Bell originally framed the theorem to test whether "hidden variables" could complete quantum mechanics while remaining local. If you define "Realism" strictly as "Hidden Variables," this camp says Bell killed Local Hidden Variables.
      *   *Confidence:* **High.** This is historically accurate to Bell's 1964 paper.
  *   **Camp 2 (Proves Nature is Nonlocal):** This camp holds **Realism** and **Freedom** as non-negotiable. If particles have real properties and we have free will, the only thing left to drop is Locality. This is the view of Bohmian mechanics and many realist philosophers.
      *   *Confidence:* **High (conditional).** It is logically valid *if* you accept Realism as a fixed premise.
  *   **Camp 3 (Rules out Local Realism):** This is the modern standard phrasing. It acknowledges that you can save Locality if you drop Realism (e.g., Copenhagen interpretation, QBism, Relational QM). In these views, properties do not exist until measured, so there is no "fact of the matter" that needs to be communicated nonlocally.
      *   *Confidence:* **High.** This is the most logically precise summary of the options available.

  ### 3. The "Smuggling" Accusation
  You asked: *If the theorem only rules out local hidden variable theories, how do people get from there to the claim that nature is nonlocal — isn't that smuggling in the hidden-variable assumption as if it were forced?*

  **You are correct to be skeptical.** Claiming "Bell proves Nonlocality" **does** implicitly assume that Realism is true. It is not a conclusion of the theorem alone; it is a conclusion of the theorem *plus* a philosophical commitment to Realism.

  If you believe the quantum state is merely information (an epistemic view) rather than a physical object (an ontic view), you do not need to accept nonlocality. You can maintain that the world is local, but that our classical intuition about "properties existing before measurement" is wrong.

  *   **Confidence:** **High.** It is a factual error to state "Bell proves nonlocality" without qualifying that this depends on retaining a realist ontology. Many popular science accounts do "smuggle" this assumption in, leading to the confusion you are experiencing.

  ### 4. Nonlocality Without Signaling
  You asked: *If the conclusion really is nonlocality, why doesn't it let you signal faster than light? What is the nonlocality actually doing?*

  This is resolved by distinguishing between two types of locality, often formalized by Jon Jarrett (1984):
  1.  **Parameter Independence:** The outcome at side A does not depend on the *setting* chosen at side B.
  2.  **Outcome Independence:** The outcome at side A does not depend on the *outcome* obtained at side B.

  **Bell Locality = Parameter Independence + Outcome Independence.**

  Quantum Mechanics violates Bell Locality, but it does so in a specific way:
  *   **QM respects Parameter Independence:** Changing the dial on side B does not change the *statistics* of the results on side A. This prevents Faster-Than-Light (FTL) signaling. This is guaranteed by the **No-Signaling Theorem**.
  *   **QM violates Outcome Independence:** Once you know the outcome at side B, your prediction for side A changes instantly, even if they are light-years apart.

  **What is the nonlocality doing?**
  It is establishing a **holistic constraint** on joint probabilities. The system is described by a single wavefunction that does not factorize into "Particle A state" $\times$ "Particle B state." The nonlocality is not a "signal" or a "force" traveling between them; it is a structural feature of the state space. The correlation is primitive; it does not arise from a causal chain $A \to B$ or $B \to A$.

  *   **Confidence:** **High on the math (No-Signaling Theorem).** **Medium on the ontology.** While the math guarantees no signaling, *what* physically grounds this holistic constraint (is it a law? a field? information?) is interpretational.

  ### 5. Confidence and Uncertainty Flag
  Per your request, here is the assessment of confidence in the distinctions drawn above, and the point of least certainty.

  **High Confidence Distinctions:**
  *   **The Logic:** I am **highly confident** that Bell's theorem rules out the *conjunction* of Locality, Realism, and Freedom, not any single one in isolation.
  *   **The Signaling:** I am **highly confident** that Quantum Mechanics respects "Parameter Independence," which mathematically forbids FTL signaling regardless of whether you call the theory "nonlocal."
  *   **The "Smuggling":** I am **highly confident** that claims of "proven nonlocality" rely on an unstated commitment to Realism.

  **The Point of Least Certainty:**
  *   **The Definition of "Realism":** This is the point where I must flag the **lowest confidence/highest contention**.
      *   There is no single, agreed-upon definition of "Realism" in this context. Sometimes it means "Hidden Variables," sometimes "Counterfactual Definiteness" (unmeasured properties have values), and sometimes "Macroscopic Realism."
      *   Because "Realism" is a philosophical term imported into physics, different schools of thought define the negation of Realism differently. For example, does dropping Realism mean properties don't exist, or just that they are context-dependent?
      *   **Why this matters:** If "Realism" is ill-defined, then the claim "We must drop Realism to save Locality" becomes ambiguous. Some argue that you can have a form of locality and a form of realism that coexist if you tweak the definitions (e.g., Superdeterminism or Retrocausality).
      *   **Verdict:** While the *math* of Bell's theorem is certain, the **metaphysical categorization of what exactly is being sacrificed (Locality vs. Realism)** is the least certain part of the discussion because it relies on philosophical definitions that are not empirically decidable.

  ### Summary
  Bell's theorem does not force nonlocality upon you; it forces you to give up at least one of three intuitive assumptions.
  1.  If you keep **Realism**, you get **Nonlocality** (but no signaling).
  2.  If you keep **Locality**, you get **Non-Realism** (properties aren't definite until measured).
  3.  If you keep both, you must give up **Freedom** (Superdeterminism).

  The claim that "Nature is Nonlocal" is a valid inference only if you assume Realism is inviolable. The lack of signaling is preserved because the nonlocality manifests as correlated outcomes, not controllable causal influences.
