answer: |-
  Calling a debate "merely verbal" is rarely a self-sufficient justification for dismissal; it acts as a placeholder for four distinct claims ranging from benign semantic clarification to robust anti-realism, and only the strongest reading genuinely licenses abandoning the inquiry without smuggling in extra normative or ontological premises.

  **1. The Semantic Misunderstanding Reading**
  *Claim:* The parties agree on all non-linguistic facts and differ only in which label they attach to them.
  *Plausibility:* High in everyday cases (tomatoes), low in deep philosophy (tables), where isolating "non-linguistic facts" is itself contested.
  *Trivial or Substantive:* Trivial diagnosis; it asserts no new theory about the world, only about the speakers' usage.
  *License to Walk Away:* No. Establishing that you agree on the facts does not entail that the choice of label is irrelevant. To walk away, you must smuggle in the normative premise that *words don't matter*—yet in law, biology, and social philosophy, classification drives resource allocation, treatment protocols, and civil rights. The dismissal works only if you assume the stakes are purely descriptive, ignoring the normative power of naming.

  **2. The Pragmatic Irrelevance Reading**
  *Claim:* The answer has no practical consequences; nothing hangs on the outcome.
  *Plausibility:* Variable and often false; in social philosophy (race) or biology (viruses), classification dictates treatment, funding, and identity.
  *Trivial or Substantive:* Substantive empirical claim about the causal role of the classification.
  *License to Walk Away:* No. This reading licenses walking away only if you smuggle in a pragmatist theory of value (i.e., that truth without utility is worthless). If you care about theoretical consistency, conceptual clarity, or truth for its own sake, the lack of practical import is irrelevant. The dismissal thus relies on a hidden axiological commitment rather than the status of the dispute itself.

  **3. The Conceptual Indeterminacy Reading**
  *Claim:* The world does not dictate a unique answer; reality is silent until we stipulate a convention.
  *Plausibility:* Controversial; it depends on rejecting natural kinds or robust metaphysical structure (e.g., Quinean skepticism vs. Sider's structure).
  *Trivial or Substantive:* Substantive metaphysical claim about the relationship between language and reality.
  *License to Walk Away:* No. Even if the world doesn't decide, *we* still must. Declaring a dispute verbal in this sense shifts the burden from discovery to stipulation, but it does not eliminate the need to argue for the *best* stipulation based on coherence, utility, or theoretical fruitfulness. Walking away here smuggles in the claim that *stipulative debates aren't worth having*, which is a methodological choice, not a logical consequence of indeterminacy.

  **4. The Ontological Deflationism Reading**
  *Claim:* There is no fact of the matter at all; the question presupposes a false ontology.
  *Plausibility:* Highly controversial; it entails an error theory or anti-realism about the domain in question.
  *Trivial or Substantive:* Extremely substantive; it is a full-blown metaphysical position.
  *License to Walk Away:* Yes, but at a high cost. This is the only reading that genuinely licenses abandoning the truth-seeking project, but only because it denies there is any truth to find. The phrase "verbal dispute" is doing almost no work here; it is merely a polite label for a heavy ontological commitment. Using it as a dismissal without arguing for the anti-realism is question-begging, as it assumes the very metaphysical conclusion the debate was meant to test.
