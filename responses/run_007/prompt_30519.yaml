      *   *Distortion:* In DS, we usually assume the protocol is known common knowledge. Here, the announcement *defines* the protocol constraints dynamically.
      *   *Drop:* The human element of "surprise" vs. formal provability. In DS, if you can derive it, you know it. In philosophy, there's debate about whether knowing the announcement makes the exam impossible or just unknowable.
      *   *Problem:* The paradox relies on the *truth* of the announcement being self-defeating. In DS, if a coordinator sends an invalid promise, we call it a Byzantine fault or a protocol violation. We don't usually analyze the logical consistency of the coordinator's promise itself as part of the system model unless we're doing formal verification of specifications.
