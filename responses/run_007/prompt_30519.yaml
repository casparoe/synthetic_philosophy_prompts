      Para 1: Model the classroom as a synchronous distributed system with one coordinator (teacher) and one process (student). Time is slotted into rounds $1 \dots N$. The coordinator commits to a specification $\Sigma$: there exists a round $t$ where a message $m$ (exam) is delivered, such that at round $t-1$, the process's local state $\sigma_{t-1}$ does not entail $K_{student}(deliver(m, t))$. The coordinator broadcasts an announcement $\mathcal{A}$ asserting $\Sigma$ is satisfied. This announcement becomes part of the system's initial state, effectively updating the process's knowledge base before round 1 begins.

