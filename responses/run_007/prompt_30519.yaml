      *   *Para 2:* The node runs a verification algorithm (backward induction). If $M$ hasn't arrived by $N-1$, the only remaining slot is $N$. Since the system is synchronous and deterministic, the node deduces $M$ must arrive at $N$. Thus $K_{node}(M=N)$ becomes true at $N-1$. This violates the constraint in $A$. So $M$ cannot be at $N$. Prune $N$. Repeat for $N-1$. The protocol verification concludes no valid trace exists. Yet, the coordinator sends $M$ at $t=3$, and the node's local state at $t=2$ did not contain the proof, so the constraint held. The paradox is a liveness proof failing against a safety constraint that appears to invalidate liveness.

