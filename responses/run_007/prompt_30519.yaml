          *   If it can't be Friday, and it hasn't happened by Wednesday night, it must be Thursday. But then I'd know Wednesday night... So it can't be Thursday.
          *   ...eliminate all days.
          *   Conclusion: The exam cannot happen.
          *   Reality: The exam happens on Wednesday, and the student is surprised.
      *   *Core Issue:* Self-referential knowledge, epistemic logic, validity of backward induction under knowledge constraints.

  3.  **Map to Distributed Systems Vocabulary:**
      *   *Teacher:* Coordinator/Leader.
      *   *Student:* Node/Process.
      *   *Exam:* Event/Commit message.
