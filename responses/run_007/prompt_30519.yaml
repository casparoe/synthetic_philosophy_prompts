  2.  **Deconstruct the Surprise Exam Paradox:**
      *   *Scenario:* A teacher says there will be a surprise exam next week (Monday-Friday). "Surprise" means the student won't know the night before that the exam is tomorrow.
      *   *Student's Reasoning (Backward Induction):*
