  Magnifico Signor, your question strikes at the very heart of this matter, and I thank you for putting it so plainly. It is precisely because I revere the Church and the Holy Scriptures that I cannot remain silent when I see a path that might prevent future stumbling blocks for the faithful.

  Let us proceed with care, separating what belongs to our salvation from what belongs to natural inquiry.

  **[Common Ground]**
  First, let us agree on what no devout Catholic should ever dispute. The Holy Scriptures are the word of God, inerrant in all they intend to teach for the sake of our salvation. The Council of Trent was right to decree that no one should interpret Scripture contrary to the unanimous consent of the Holy Fathers in matters of faith and morals. We both accept that Joshua's prayer caused a miracle, that the day was prolonged, and that God intervened in the cosmos for the sake of His people. These are truths of faith, and I bow to them.

  **[Controversial Argument]**
  However, here I must ask your patience, for I venture a distinction that some find troublesome. I propose that the Holy Spirit, in dictating the Scriptures, accommodated Himself to the understanding of the common people of that time. When the Scripture speaks of the "hands of the Lord" or God's "eyes," we do not believe God has physical limbs; we understand this as metaphorical language suited to human capacity. I argue that when Scripture speaks of the sun *moving* and the earth *standing still*, it uses the same accommodated language. It speaks according to appearances, as we do when we say the sun rises, not to teach astronomy, but to convey the miracle of the prolonged light.

  **[Common Ground]**
  Surely we agree that God is the author of both Nature and Scripture. He has given us senses and reason to investigate the world He created. As Saint Augustine warned, if a Christian asserts something about nature that is demonstrably false, he risks making our faith look foolish to the pagans who know the truth of the sciences. We must not bind the Holy Spirit to interpretations that physical proof might later overturn.

  **[Controversial Argument]**
  This leads to my specific contention regarding the Fathers and the Council of Trent. I submit that the "unanimous consent of the Fathers" applies to articles of faith necessary for salvation, not to propositions of natural philosophy where the Fathers were not inspired. They were not astronomers; they spoke on the movement of the heavens only incidentally. Therefore, to insist their cosmological views are dogma is to extend the Council's decree beyond its intent.

  Regarding Joshua specifically, I offer this thought: If the Copernican arrangement is true—that the Earth moves and the Sun is stationary—stopping the Earth's rotation would actually prolong the day more effectively than stopping the Sun. If the Sun were the mover, stopping it might even shorten the day. Thus, a Copernican reading of the miracle is not only possible but perhaps more consistent with the text's claim that the day was lengthened. I do not claim this as dogma, but as a demonstration that the Scripture need not be read in a way that contradicts the demonstrations of geometry and observation I have made with my telescope.

  **[Common Ground]**
  We both desire the glory of God and the integrity of the Church.

  **[Controversial Argument]**
  My hope is that by distinguishing the physical truth of nature from the spiritual truth of faith, we protect both. To forbid the Copernican hypothesis as heresy, when it is merely a physical model supported by the phases of Venus and the moons of Jupiter, is to risk tying the faith to a physics that may prove false. I remain a obedient son of the Church, but I pray that the Church allows us to investigate the Book of Nature, which is written in the language of mathematics, without fear that such inquiry undermines the Book of Scripture.
