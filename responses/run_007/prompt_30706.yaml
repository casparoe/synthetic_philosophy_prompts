      *   *Question 2: The "Cheating" Property.* Focus on the relational property move. "Being 2 miles from Sphere B."
          *   Option A: That's a real property, so PII holds.
          *   Option B: That's circular cheating; you can't use B to define A if B needs A to be defined.
          *   Option C: It doesn't matter, they are distinct anyway.

      *   *Question 3: Non-Spatial Distinction.* Remove space to test if space is the only haecceity. Two identical souls or abstract objects.
          *   Option A: Impossible to have two without some qualitative difference.
