          1.  Strong Leibnizian PII (No two things share *all* properties).
          2.  Black-style Primitive Distinctness / Bare Particulars (Things can be distinct without qualitative difference).
          3.  Relational-Properties-Save-PII (Spatial relations count as properties that distinguish).
