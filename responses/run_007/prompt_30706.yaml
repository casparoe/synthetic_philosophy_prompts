prompt: |-
  hey so i run my high school's philosophy club and next week we're doing the identity of indiscernibles / Black's two spheres thing. i want to run it as a "which position do you actually hold?" quiz instead of a lecture, cause people zone out when i talk. can you write me one?

  like 8-10 questions, each one a concrete little scenario, with 2-3 answer options. then a scoring key that maps answer patterns onto the actual positions. the ones i want covered (i think these are the main ones, correct me if i'm naming them wrong): (1) strong Leibnizian PII, (2) Black-style primitive distinctness / bare particulars, (3) the relational-properties-save-PII view, (4) bundle theory and whether it commits you to PII, and (5) maybe a "this debate is kind of verbal" position. the point is to sort people by what they say about cases, not by which label they like, so no question should just ask "do you think the identity of indiscernibles is true?"

  the thing i really want the quiz to do: the relational-properties person and the bare-particulars person can both say "yeah there's two spheres, obviously" in Black's original case, so make sure some questions actually seperate them. like, include a case where two objects have all the same intrinsic properties and only differ in their spatial relation to each other, and another where that relation is the only difference but it feels weird to say a thing is individuated by a relation to another thing that is itself only individuated by the relation back, and maybe one where the objects aren't spatially related at all (if that even makes sense). also include the classic two spheres but with answer options that force people to say why they think there's two, not just that there's two.

  each question should work for someone who hasn't read Black, so give the setup in a sentence or two. and keep it readable for high schoolers who are into this but aren't philosophy majors.

  last thing: at the end add a short note on which parts of the quiz rest on settled stuff vs genuinely contested stuff among people who actually work on this. like i don't want the quiz to present the relational-properties move as obviously saving PII when a lot of people think it's kind of a cheat, or present Black's conclusion as the consensus when it's still argued about. and if some positions in the scoring key can't really be separated by any questions, just flag that instead of pretending the quiz is sharper than it is.
