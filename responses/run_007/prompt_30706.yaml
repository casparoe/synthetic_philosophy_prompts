          *   Option A: There are two people (you and duplicate).
          *   Option B: It's one person described from two angles.
          *   Option C: Depends on if "being on the left" counts as a property.

      *   *Question 6: Swapping.* Imagine the two spheres swap places instantly.
          *   Option A: It's a new state of affairs (they moved).
          *   Option B: It's the exact same state (indistinguishable).
          *   Option C: Only matters if we track them over time.

      *   *Question 7: Intrinsic vs. Extrinsic.* Focus on the "kind" of property.
          *   Option A: Only intrinsic properties (mass, shape) count for identity.
          *   Option B: Extrinsic properties (location, relations) count too.
          *   Option C: Identity doesn't depend on properties at all.

      *   *Question 8: The Verbal/Deflationary Angle.* Is this just about words?
          *   Option A: Yes, it depends on how we define "property."
          *   Option B: No, it's about the nature of reality.
          *   Option C: Maybe, but I still have an intuition.

      *   *Question 9: The "Bare Particular" Intuition.* Strip away all properties.
          *   Option A: Nothing left.
          *   Option B: A "substrate" remains that holds properties.
          *   Option C: The properties themselves are the object.

      *   *Question 10: Final Verdict on Black's Case.* Revisit the spheres with accumulated intuition.
          *   Option A: PII is false (Black was right).
          *   Option B: PII is true (Relational properties save it).
          *   Option C: PII is trivially true (by definition).

      *(Self-Correction during drafting)*: I need to make sure the scoring key can actually distinguish between the Relational-Properties view and the Bare Particulars view. They often give the same answer to "Are there two spheres?" (Yes). I need questions where they diverge.
      *   *Divergence Point:* The Relational person says "They are distinct *because* of relation R." The Bare Particular person says "They are distinct *even if* we ignore relations, because they are distinct substances."
      *   *Adjustment:* I need a question where relations are removed or problematized. Question 3 (Non-spatial) helps here. Also Question 2 (Circularity) helps. The Bare Particularist doesn't care about circularity; the Relationalist might worry about it.

