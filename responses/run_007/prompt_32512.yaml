answer: |-
  # Activity Design: "The Middle Trap"

  ## Overview
  This activity is designed for a cohort of 22 students (11 pairs) over an 80-minute session. It uses a specific $3 \times 3$ payoff structure where the 'safe' middle option is not dominated by any single alternative, but is dominated by a mixture of the extremes. The activity forces students to experience the loss incurred by ignoring mixed strategies, followed by a public elimination round that triggers a cascade of further eliminations.

  ## Materials
  *   **Strategy Cards:** 22 sets of cards. 11 sets for Row players (cards labelled **T**, **M**, **B**), 11 sets for Column players (cards labelled **L**, **C**, **R**).
  *   **Portfolio Tokens:** 11 special tokens for Row players labelled **Hedge (T/B)**.
  *   **Score Sheets:** One per student to record round payoffs.
  *   **Projector/Board:** To display aggregate class data and the payoff matrix.
  *   **Currency:** Small sweets or chocolate coins (or merit points). Exchange rate: 10 points = 1 sweet.

  ## Payoff Scheme
  The game is asymmetric. Row players choose rows; Column players choose columns. Payoffs are displayed as (Row, Column).

  | | **L** | **C** | **R** |
  | :--- | :---: | :---: | :---: |
  | **T** | 5, 0 | 0, 0 | 5, 5 |
  | **M** | 2, 2 | 2, 5 | 2, 2 |
  | **B** | 0, 5 | 5, 0 | 0, 0 |

  *Note for Facilitator:*
  *   **Row Logic:** **M** yields a steady 2 points. **T** and **B** are risky (5 or 0). However, a 50/50 mix of **T** and **B** yields an expected 2.5 points against *any* Column choice. Thus, **M** is dominated by the mix, but not by **T** or **B** alone.
  *   **Column Logic:** **C** yields 5 points only if Row plays **M**. If Row plays **T** or **B**, **C** yields 0. Once **M** is eliminated, **C** becomes useless (dominated by a mix of **L** and **R**).

  ## Setup
  1.  Divide the class into 11 pairs. Assign one student as **Row** and one as **Column**.
  2.  Distribute Strategy Cards and Score Sheets.
  3.  Display the Payoff Matrix on the board. Ensure they understand that Row chooses the letter (T/M/B) and Column chooses the letter (L/C/R).
  4.  Explain that this is a game of *rationality*, not psychology. They should maximise points.

  ## Phases

  ### Phase 1: The Intuitive Play (15 minutes)
  *   **What happens:** Students play 5 rounds. They select a card secretly, reveal simultaneously, record payoffs, and reshuffle.
  *   **Facilitator does:** Circulate. Do not offer advice. Watch for 'focal points'. Most students will gravitate towards **M** and **C** because they avoid the zero-payoff risk (maximin behaviour).
  *   **Outcome:** Most pairs will score 2 or 5 points per round. The class average will hover around 2–3 points for Row.

  ### Phase 2: The Mixed Revelation (20 minutes)
  *   **What happens:** Pause the game. Project the aggregate data from Phase 1. Highlight that Row players who played **M** consistently scored 2, whilst the theoretical average of alternating **T** and **B** would have been 2.5.
  *   **Facilitator does:** Introduce the **Hedge (T/B)** Token. Explain: "This token represents a commitment to randomise 50/50 between T and B. To save time, if you play this token, I will award you the *expected* payoff (2.5 points) regardless of the Column player's choice, simulating risk-neutrality."
  *   **Action:** Play 5 more rounds. Row players can now play **T**, **B**, or **Hedge**. Column players still play **L**, **C**, **R**.
  *   **Outcome:** Row players using **Hedge** will consistently outscore those sticking with **M**. The 'safety' of **M** is mathematically exposed as inferior.

  ### Phase 3: The Public Elimination (15 minutes)
  *   **What happens:** Stop play. Make a formal announcement: "In this room, we assume all Row players are rational. Since **M** is dominated by **Hedge**, a rational Row player *cannot* play **M**."
  *   **Facilitator does:** Collect all **M** cards from the Row players. They are now banned from the game.
  *   **Action:** Play 5 final rounds. Row players choose **T** or **B**. Column players choose **L**, **C**, or **R**.
  *   **Outcome:** Column players who play **C** will now score 0 points every time (since Row never plays **M**). They will rapidly abandon **C**.

  ### Phase 4: The Epistemic Debrief (30 minutes)
  *   **What happens:** A guided discussion mapping the game phases to formal game theory concepts.
  *   **Facilitator does:** Use the board to draw the connection between the physical removal of cards and the mathematical concept of Iterated Elimination of Dominated Strategies (IEDS).

  ## Debrief Guide

  | Activity Moment | Formal Idea | How to Draw It Out |
  | :--- | :--- | :--- |
  | **Phase 1 (Sticking with M)** | **Pure-Strategy Undominance** | Ask: "Was **M** dominated by **T**?" (No, **T** loses against **C**). "Was it dominated by **B**?" (No, **B** loses against **L**). Establish that **M** survives the first pass of pure-strategy elimination. |
  | **Phase 2 (Hedge Token)** | **Mixed-Strategy Dominance** | Ask: "Why did the Hedge token win?" Explain that the set of available strategies includes probability distributions over pure strategies. **M** is dominated by $\sigma = 0.5T + 0.5B$. |
  | **Phase 3 (Removing M)** | **Iterated Elimination** | Ask Column players: "When did **C** become a bad choice?" It wasn't bad in Round 1. It became bad only *after* **M** was removed. This is the 'cascade' or iteration. |
  | **Phase 3 (The Announcement)** | **Common Knowledge of Rationality** | Ask: "Why did Column stop playing **C**?" If they say "Because Row stopped playing M", ask: "How did they know Row stopped?" Because I *announced* rationality. This maps to $K_1(Rationality) \rightarrow K_2(Rationality)$. |
  | **Phase 4 (Risk Aversion)** | **Limitations of the Model** | Ask students who kept playing **M**: "Why?" If they say "2 points is sure, 2.5 is risky", highlight that formal game theory assumes risk neutrality unless utility functions are specified. |

  ## Predictable Failures & Fixes

  | Failure | Symptom | Fix |
  | :--- | :--- | :--- |
  | **Risk Aversion** | Row players refuse the **Hedge** token, preferring the guaranteed 2 points of **M** over the 'risky' 2.5 expected value. | Explicitly frame the points as "expected utility" for the sake of the exercise. Or, in the debrief, use this to distinguish between *dominance in payoffs* vs *dominance in utility*. |
  | **Confusion on Mixing** | Students try to physically flip coins during the round, slowing the game to a halt. | Use the **Hedge Token** which grants the *average* payoff automatically. Explain this is a pedagogical shortcut to isolate the logic from the variance. |
  | **Collusion** | Pairs agree to play **M/C** every time to get steady points (2, 5) rather than competing. | Remind them this is a non-cooperative game. If caught, disqualify the pair from sweets. Emphasise that Column gets 5 on **C** only if Row is irrational enough to play **M**. |
  | **Skipping the Cascade** | Column players drop **C** in Phase 1 simply because they guess Row won't play **M**. | During the debrief, ask them *when* they were sure. Reinforce that without the public announcement (Phase 3), they couldn't be certain **M** was gone. |

  ## Limitations (What This Cannot Reproduce)
  This activity simplifies the formal notion of **Rationalisability**. Specifically:
  1.  **Infinite Hierarchy:** We simulate only two levels of knowledge (I am rational; I know you know I am rational). True common knowledge requires an infinite regress ($K_1, K_2, K_3...$), which a 3-phase game cannot physically enact.
  2.  **Continuous Mixes:** We only test a 50/50 mix. A strategy might be undominated by a 50/50 mix but dominated by a 60/40 mix. The formal definition requires checking *all* possible probability distributions.
  3.  **Belief Consistency:** In the formal model, players hold beliefs about opponents' strategies that are consistent with rationality. In the classroom, students may hold arbitrary beliefs that happen to align with the elimination outcome by luck.

  ***

