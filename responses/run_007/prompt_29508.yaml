answer: |-
  Dear Writer,

  It is genuinely refreshing to encounter someone who has waded into the murky waters of the virtue ethics debate not to score points for one side, but to understand why the water refuses to clear. You have put your finger on something that often escapes professional philosophers who are too busy defending their turf to notice the ground beneath them is shifting. Your intuition that the two sides are doing different things is correct, but the situation is slightly more tangled than a simple descriptive versus normative split. The stalemate persists because the debate is actually occurring on three different levels simultaneously, and the participants keep sliding between them without acknowledging the shift. To diagnose this properly, we have to look at what each side thinks the other is trying to do, because that is where the friction generates heat rather than light.

  Your working hypothesis that situationists are making descriptive claims while virtue ethicists are making normative ones is the standard first move in dissolving the conflict, and it is partially right. However, the situationists would argue that they are not merely describing human behavior for the sake of it; they are attacking the psychological presuppositions of the normative theory. Virtue ethics, unlike utilitarianism or deontology, explicitly grounds itself in the development of character. If character, as traditionally conceived, does not exist, then the theory loses its mechanism of action. So the situationists are making a meta-ethical claim that a normative theory requires a viable psychology to be action-guiding. The virtue ethicists, in turn, respond by refining the psychology, arguing that the situationists are attacking a folk-psychological caricature of virtue rather than the philosophical concept. This means the disagreement is not just about facts versus values, but about whether a normative theory is accountable to empirical psychology at all, and if so, how much accountability is required.

  This leads directly to your suspicion that the word trait is doing too much work, and here is where the verbal disagreement becomes substantive. When a situationist says trait, they mean a robust, cross-situational consistency in behavior that allows for reliable prediction. When a virtue ethicist says trait, they often mean a stable orientation toward reasons and values that might manifest differently in different contexts. The virtue ethicist argues that a honest person does not tell the truth in every situation regardless of consequence, but rather responds appropriately to the reasons for and against truth-telling. To the situationist, this looks like moving the goalposts, because it makes the trait unfalsifiable by behavioral data. To the virtue ethicist, the situationist definition is simply wrong about what moral agency is. So yes, it is a verbal disagreement about the definition of character, but it is rooted in a deeper conflict about whether human psychology is best understood through behavioral regularities or through rational sensitivities. Until both sides agree on what counts as evidence for a character trait, they will continue to talk past each other, with one side pointing to statistics and the other pointing to phenomenology.

  The ought implies can objection you mentioned is the bridge that tries to connect these two worlds, and it is where the real philosophical standoff lives. The situationist argues that if virtues are so rare that they are statistically negligible, then building an ethical system around them is like building a transportation system around flying cars. The virtue ethicist counters that ethics is aspirational, not statistical, and that the existence of saints or sages proves possibility even if rarity is high. The disagreement here is not about the data, since both agree virtues are rare, but about the function of ethical theory. Is the theory meant to describe how most people can live, or is it meant to describe the best possible way to live regardless of how many achieve it? This is a disagreement about the purpose of philosophy itself. If virtue ethics is a guide for the many, the situationist critique bites hard. If it is an ideal for the few, or a standard by which to measure ourselves even if we fall short, the empirical rarity matters less. The stalemate continues because neither side is willing to concede what kind of project they are running.

  Regarding what would count as progress, I suspect more experiments will not solve this, because the data is already sufficiently robust for both sides to construct their narratives. The Milgram and Good Samaritan studies are not going to be overturned by new variations. Progress would likely require a conceptual shift where virtue ethicists abandon the claim that virtues are global traits and instead embrace a fragmented or local conception of character that aligns better with the empirical data. Some have tried this, arguing for local traits like honesty-in-the-workplace rather than honesty simpliciter, but this risks diluting the concept of virtue so much that it loses its normative force. Alternatively, progress could come from situationists admitting that normative theories are not scientific hypotheses that can be falsified by behavioral data alone. They might acknowledge that even if people are situationally dependent, the project of trying to cultivate consistency is still valuable. Until one side changes the question from who is right to what kind of answer we need, the loop will continue.

  For you as a novelist, this philosophical gridlock might actually be more useful than a resolution would be. The tension between the situationist view of humans as fragmented and context-dependent and the virtue ethicist view of humans as unified agents is exactly the tension that makes character arcs compelling. A novel that presents a character with perfectly stable moral dispositions might indeed be flattering the reader's biases, as you suggest, but a novel that presents a character as purely situational might feel nihilistic or unintelligible. The truth likely lies in the struggle between the two. People do have dispositions, but they are fragile and context-sensitive. They strive for consistency but often fail. A character who believes they are virtuous but is constantly tested by situations that reveal their fragility is not just philosophically accurate; it is dramatically rich. The debate remains stuck because both sides want a clean answer about human nature, but human nature is likely too messy to fit neatly into either a laboratory result or a philosophical ideal.

  In the end, the disagreement is ill-posed because it asks a single question of two different frameworks. The situationists are asking a scientific question about prediction and control, while the virtue ethicists are asking a hermeneutic question about meaning and aspiration. You cannot answer a question about meaning with data about prediction, and you cannot answer a question about prediction with a theory about meaning. Progress would look like recognizing that these are complementary inquiries rather than competing truths. We need the situationist data to keep our moral ideals humble and aware of context, and we need the virtue ethicist ideals to give us something to aim for beyond mere statistical probability. For your work, this suggests that character consistency should not be treated as a fact to be reported but as a goal to be pursued by the character, one that is constantly threatened by the situation. That is where the reality you are looking for lives, not in the resolution of the debate, but in the tension itself.

  I hope this helps clarify the structure of the deadlock without forcing a verdict where none is ready to be given. It is a rare thing to find a novelist worrying about the metaphysical status of character traits with such precision, and I suspect your fiction will be the better for it.

  Warmly,

  Your Correspondent
