prompt: |-
  I've spent a fair bit of time over the past few years reading about the 2008 financial crisis — not the technical details of structured finance, which I've picked up from books like Michael Lewis's The Big Short and from long-form journalism, but the structural question that still bothers me: why did so many people across so many different institutions do things that, taken together, produced a catastrophe that almost none of them individually wanted? Mortgage brokers wrote loans they knew were bad, banks bundled them into securities, ratings agencies stamped them AAA, fund managers bought them, regulators looked away — and at every node, people seem to have been responding to incentives that made their individual behaviour reasonable even as the aggregate outcome was disastrous.

  This looks to me like what gets called a multipolar trap or a race to the bottom: a situation where multiple actors, each pursuing their own interests, are driven by competition to a collectively worse outcome than if they could all coordinate. The concept appears under various names — Moloch, coordination failures, prisoner's dilemmas at scale — and the core idea is that competitive pressure can push a system toward worse and worse equilibria even when everyone involved can see what is happening.

  I want you to analyse the 2008 financial crisis through the lens of multipolar traps. Specifically:

  1. Map the trap. Who were the key players, what were their options, what were the incentives they faced, and what was the mechanism that made individually rational choices sum to collective disaster? Be precise about which parts of the crisis were genuinely trap dynamics and which were something else — straightforward fraud, ordinary incompetence, or regulatory capture.

  2. Where does the trap model break? What features of the crisis does it fail to explain or misdescribe? For instance, some actors did resist the race to the bottom — certain funds stayed out of mortgage-backed securities, some analysts raised alarms internally, some banks were more cautious than others. Does the theory have anything to say about why some people escape the trap, or does it simply treat them as noise?

  3. What does the crisis, in turn, tell us about the theory? Is 2008 a clean example that confirms the multipolar-trap model, an anomaly that complicates it, or a case that reveals limits the theory's proponents have not fully acknowledged? In particular, does the crisis suggest that multipolar traps are mostly a story about misaligned incentives, or does it point to something else — information failures, time horizons, or the sheer complexity of the system — as being equally important?

  I am not looking for a narrative retelling of the crisis; I know the broad facts. What I want is a disciplined mapping between the theory and the episode, with honest attention to where the fit is loose.

  Please write your answer in British English. At the very end, give me a one-sentence summary of your overall assessment, on the pattern: \answer{...}
