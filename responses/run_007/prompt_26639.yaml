answer: |-
  Good evening, everyone.

  For those who don't know me, I'm [Your Name]. I had the privilege of being [Supervisor's Name]'s PhD student. When I first approached her about supervising my thesis, I was intimidated. Not just by her reputation, but by the sheer precision of her mind. She reads arguments the way a master carpenter reads wood—she knows where the grain is, where the knots are, and exactly where the pressure needs to be applied to make something hold together.

  For thirty years, [Supervisor's Name] has asked us to think hard about a very specific, uncomfortable question: Who are we to judge?

  Her work on the "standing to blame" changed the landscape of moral philosophy. She taught us that being right isn't enough. She taught us that moral authority isn't a given; it's a position you have to earn, and it's a position you can lose. She taught us that when our own hands are dirty, our voice carries less weight. She gave us a vocabulary for hypocrisy, for complicity, and for the messy reality of trying to be good in a world that makes it difficult.

  And that is why I am standing here tonight, knowing exactly what everyone in this room is thinking.

  We are philosophers, family, and friends. We are not naive. We know that the last six months have been complicated. We know that there is a tension between the life lived and the work written. To pretend otherwise would be to insult the intelligence of this room, and to insult [Supervisor's Name] herself, who spent a career demanding that we look at uncomfortable truths rather than turning away.

  It is a rare thing for a thinker to provide the very tools that the public then uses to critique them. In a way, the last few months have been the ultimate field test of her own theory. The framework holds. The diagnosis is sharp. And yes, the contradiction is real.

  But if there is one thing I learned in those long supervision hours, it's that philosophy is not about producing saints. It is about producing clarity.

  A map is not invalidated because the cartographer got lost. A compass does not stop pointing north because the person holding it is walking in circles. [Supervisor's Name]'s work gave us the language to understand moral failure—including, perhaps especially, our own. The fact that her ideas are sturdy enough to withstand the weather of the life that produced them is, in a strange way, a testament to their truth. She built a house strong enough to shelter us even when she couldn't stay dry herself.

  To the family and friends here: You know her as a partner, a parent, a friend. You know that a person is never just their public controversies. You know that love is not a contract of perfection.

  To the colleagues and students here: We know that ideas have a lifespan longer than careers. We can hold two things in our heads at once. We can acknowledge the flaw in the vessel and still drink from the cup.

  [Supervisor's Name], you taught me that standing is fragile. But you also taught me that truth is resilient. You taught me to think rigorously, even when it hurts. Even when it implicates me. Even when it implicates you.

  There is a concept in your work that I've been thinking about a lot lately. It's the idea of "moral residue." The stuff that stays on your hands after you've made a hard choice. I think we all have some of that tonight. But there is also the residue of thirty years of mentorship. Of doors opened, of minds sharpened, of students who learned to think clearly because you demanded it of us. That residue is permanent.

  So, I am not going to offer a whitewash. And I am certainly not going to offer a prosecution. This is a retirement party, not a tribunal. This is a celebration of a life of the mind, which is always a life of complexity.

  I want to toast you not as an icon, but as a teacher. Thank you for giving us the tools to understand the world, even when the world includes you. Thank you for the rigor, the challenge, and the humanity.

  May your retirement be filled with the one thing your work says is so hard to find: a clear conscience, and the peace to enjoy it.

  To [Supervisor's Name].
