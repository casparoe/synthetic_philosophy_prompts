          *   *Severity:* High. This is the classic objection to Strong Higher-Order Thought (HOT) theories regarding animals/infants.
          *   *Fix:* Weaken (1). Allow non-conceptual higher-order states (HOP - Higher-Order Perception) or allow that the "pointer" doesn't need linguistic/conceptual structure ("I").
          *   *Cost:* Makes (1) less precise, harder to distinguish from first-order theories.

      *   **(1) vs. (3):**
          *   (1) says consciousness needs awareness *of the state*.
          *   (3) says flow state is conscious, but attention is on the *object* (problem), not the *state* (thinking).
