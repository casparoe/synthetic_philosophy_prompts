prompt: |-
  software engineer here, no formal philosophy background, so sorry in advance if I mangle the terms. I'm trying to pin down what I actually think about consciousness before I bring it to a reading group, and I'd like a consistancy check. here's where I've landed:

  (1) I think what makes a mental state conscious is that the system is, in some way, aware of being in that state. like, there's a higher-level representation that points at the lower-level one, and if nothing points at it, the state is just unconscious processing.

  (2) I think a dog in pain is conscious — there's something it's like to be that dog. but I doubt a dog can form the thought 'I am currently in pain.'

  (3) I think when I'm deep in a coding problem, my thinking about the problem is conscious — I'm not blacked out. but at that moment I'm not also having a thought like 'I am thinking about this problem.' all my attention is on the problem.

  (4) I'm a physicalist. consciousness is something a brain (or some other organized physical system) does, no extra ingredient.

  go through these and tell me which pairs are actually in tension and which only look that way. for the real tensions, rank them by how severe they are, and for each say what the cheapest fix would be and what it costs. I genuinely can't tell where the problem is, so don't just flag everything — I want to know which tensions are real and which dissolve on inspection.
