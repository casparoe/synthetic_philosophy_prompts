          *   *Severity:* Medium-High. Similar to the dog problem but about adult human phenomenology.
          *   *Fix:* Distinguish between awareness of the *content* vs. awareness of the *state*. Or argue that in flow, there *is* a fleeting higher-order state, just not a reflective linguistic one.
