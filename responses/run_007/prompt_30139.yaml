      *   Reject (2). Intention can determine meaning without the author being fully conscious of all facets of that intention at the time. Unconscious or semi-conscious intentions exist.
      *   What is lost? The certainty that the author knows everything about their work immediately. The author must accept that their own mind is partially opaque to them.
      *   How does this save authority? The author's authority stems from being the *source* of the intention, even if they didn't fully grasp its depth initially. They aren't just another reader; they are the architect, even if they discover hidden rooms later.
      *   How does this save discovery? Discovery is the process of uncovering the full scope of one's own intentions/subconscious drives.

