  We seek the shadow though we fear the night,
  And pay the price to feel the heavy pain.
  We walk into the storm without a light,
  Willing guests of sorrow's bitter strain.
  When grief arrives we do not turn from sight,
  We claim the hurt is part of our own gain.
  We judge the evening good though filled with fright,
  Because the pain itself is not in vain.

  Yet thinkers split upon the work of art.
  Does art transform the pain to something new?
  Or is the hurt accepted as our due?
  Two answers rise to claim the broken part.
  One says the pain is pleasure in our view,
  One says we pay the price for wisdom true.
