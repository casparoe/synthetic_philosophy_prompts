prompt: |-
  I run a reading group that's mostly programmers plus a couple of cognitive science grad students, and next week I have to walk them through Dennett's careenium in one fifty-minute session — the sphere full of simmballs that bump into each other and leave marks, with the whole thing apparently doing something message-like at the level of the marks even though all the lower-level work is just simmball collisions. The question I want them to actually land on is whether the symbols or 'messages' at the higher level push the substrate around, or just ride on it, or whether that's even the right way to put it. My group is already split: half of them are convinced its obviously epiphenomenalism with extra steps, and the other half think Dennett is claiming the symbols are literally real forces that shove simmballs around, which I'm fairly sure is also wrong but I can't state the third option cleanly myself.

  Don't explain the careenium to me; plan how I should explain it. I need the order of ideas — what has to be in place before the question even makes sense (levels of description? real patterns?), the one concrete mini-case that should carry the whole session and what it has to have and what it must lack (and if it shouldn't be a Conway's Life glider or a thermostat, say why), the misconceptions I should expect and exactly where in the sequence to head each one off — I'm guessing the two failure modes are 'the higher level is a useful fiction' and 'the higher level exerts an extra force' — and one question I can ask at the end to check whether they got it rather than just nodding. Also tell me what I should openly refuse to cover at this level.
