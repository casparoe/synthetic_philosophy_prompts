answer: |-
  This is a precise and necessary intervention. The literature has indeed fragmented because the term "Frame Problem" has been allowed to stretch from a specific bug in the situation calculus to a synonym for the mystery of intentionality itself. When a single label covers both a bookkeeping error in LISP and the problem of semantic relevance, confusion is guaranteed.

  Given your background, you are uniquely positioned to see where the computational rubber meets the philosophical road. Below are the desiderata for any adequate account, categorized by their scope. I have distinguished between **Non-Negotiable** constraints (derived from the existence of intelligent agency itself) and **Parochial** constraints (derived from specific theoretical commitments, primarily Classical Computationalism).

  Finally, I outline the incompatibility hypothesis that likely explains the decades-long stalemate.

  ---

  ### I. The Desiderata

  #### A. Computational & Engineering Constraints
  *These arise from the original McCarthy & Hayes (1969) formulation.*

  **1. The Tractability Requirement**
  *   **Requirement:** The mechanism for updating world states must operate within real-time constraints. It cannot require a search through the entire database of beliefs for every action.
  *   **Case:** In the original formulation, adding frame axioms (listing everything that *doesn't* change) creates a combinatorial explosion. A robot that takes an hour to calculate that moving a block doesn't change the color of the sky is functionally dead. Biological systems update in milliseconds.
  *   **Status:** **Non-Negotiable.** Any system that acts in time must satisfy this.

  **2. The Prediction Requirement**
  *   **Requirement:** The system must correctly predict the *side effects* of actions that are causally linked, even if distant.
  *   **Case:** If I knock over a domino, I must predict the last one falls. If I ignore this because it's "too far" in the representation, I fail at planning. A solution that avoids explosion by ignoring consequences is just a different kind of failure (the "sleeping dog" problem).
  *   **Status:** **Non-Negotiable.** Agency requires reliable causal modeling.

  #### B. Epistemological & Cognitive Constraints
  *These arise from the Dennett/Fodor/Pylyshyn expansion.*

  **3. The Relevance Constraint (No Regress)**
  *   **Requirement:** The system must determine which facts are relevant to a context without invoking a prior rule for relevance that itself requires a relevance check.
  *   **Case:** This is Fodor's isotropy problem. If I need a rule to tell me which beliefs to check when I move a cup, I need a rule to tell me which *rule* to use. If the criteria for relevance are themselves explicit representations, we face an infinite regress.
  *   **Status:** **Non-Negotiable.** Intelligence is impossible if belief fixation requires infinite steps.

  **4. The Compositionality/Generativity Constraint**
  *   **Requirement:** The solution must account for the ability to think about novel situations not encountered in training or evolution.
  *   **Case:** Humans can reason about "teleporting telephones" or "gravity reversing on Tuesdays." A solution that relies solely on fixed associative weights (like a simple lookup table) fails to explain systematicity and productivity of thought.
  *   **Status:** **Parochial.** Insisted upon by Classical Computationalists (Fodor, Pylyshyn). Connectionists and Embodied theorists often reject this as a requirement for *basic* intelligence, arguing it applies only to derived linguistic cognition.

  #### C. Metaphysical & Architectural Constraints
  *These arise from the "Dissolution" approaches.*

  **5. The Representation Constraint**
  *   **Requirement:** The account must specify whether the "world" being updated is an internal model or the environment itself.
  *   **Case:** The original problem assumes a representational gap: the agent holds a model $M$ that must match world $W$. If $M$ is eliminated (as in Brooks' subsumption architecture or enactivism), the frame problem ostensibly vanishes because there is no $M$ to update.
  *   **Status:** **Parochial.** Representationalists view this as giving up on the mind; Embodied theorists view it as the only way out.

  **6. The Existence Proof (The Neuro-Constraint)**
  *   **Requirement:** The account must be compatible with the known architecture of the brain.
  *   **Case:** You spent a career modeling this. Brains do not use situation calculus, nor do they appear to use explicit logical inference for motor control. They solve the frame problem constantly. A philosophical solution that declares the problem "unsolvable for physical systems" is empirically false.
  *   **Status:** **Non-Negotiable.** We know the solution exists because we are it.

  ---

  ### II. The Incompatibility Hypothesis

  You asked whether the computational and philosophical formulations demand incompatible things. I believe they do. This is the source of the stalemate.

  **The Tension:** *Explicit Representation vs. Tractability.*

  1.  **The Philosophical Demand:** To satisfy Fodor and the classical tradition, a solution must preserve **Explicit Representationalism**. Beliefs must be discrete, compositional states with semantic content that can be manipulated logically. This is required to explain the *generativity* of thought (Desideratum 4).
  2.  **The Computational Demand:** To satisfy McCarthy and the engineering reality (Desideratum 1 & 3), a solution must avoid **Explicit Search**. You cannot search a database of explicit symbols in real-time without heuristics that are themselves vulnerable to the frame problem.

  **The Conflict:**
  If you insist on explicit, compositional representations (Philosophical Demand), you inevitably reintroduce the search space that creates the frame problem.
  If you insist on real-time tractability without regress (Computational Demand), you are forced toward subsymbolic, distributed, or embodied architectures that sacrifice explicit compositionality (violating the Philosophical Demand).

  **Why the literature is stuck:**
  Most "solutions" try to have it both ways. They try to tweak the logic (circumscription, non-monotonic logic) to make explicit representation efficient. But this is optimizing a data structure that is fundamentally the wrong kind for the job. The "Big" Frame Problem (relevance) persists because it is an artifact of the "Little" Frame Problem's architecture (explicit state updating).

  **The Neuro-Scientific Implication:**
  Your field likely bypasses this by not solving the *logical* frame problem at all. The brain does not update a global world model. It updates local sensorimotor contingencies. The "frame" is set by the body's morphology and the task at hand, not by a logical query. This satisfies Tractability and Existence Proof, but it looks like "giving up" to a philosopher who wants to know how we represent *abstract* truths.

  ---

  ### III. Scorecard of Main Approaches

  Here is how the major contenders stack up against the Non-Negotiable (NN) and Parochial (P) desiderata.

  | Approach | Tractability (NN) | Prediction (NN) | Relevance/No Regress (NN) | Compositionality (P) | Representationalism (P) | Verdict |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Situation Calculus (Classic)** | **Fail.** Requires frame axioms or exhaustive search. | Pass. | **Fail.** No mechanism for relevance selection. | Pass. | Pass. | Technically precise but computationally dead. |
  | **Circumscription (McCarthy)** | **Fail.** Non-monotonic logic is still computationally expensive (often intractable). | Pass. | **Fail.** Minimizing exceptions doesn't tell you *which* exceptions matter contextually. | Pass. | Pass. | A logical patch, not a cognitive mechanism. |
  | **Relevance Logics** | **Fail.** Solves the logic of implication, not the search for premises. | Pass. | **Fail.** Shifts the burden to "relevance" without defining its source. | Pass. | Pass. | Addresses the symptom, not the cause. |
  | **Heuristic Search (AI/GOFAI)** | Pass (mostly). | **Fail.** Pruning leads to missed side-effects (Dennett's robot). | **Fail.** Heuristics are brittle; they fail in novel contexts. | Pass. | Pass. | Works until the environment changes unexpectedly. |
  | **Embodied/Embedded (Brooks, etc.)** | **Pass.** World is its own model; no update needed. | **Pass.** Action is coupled to perception. | **Pass.** Relevance is determined by physical coupling, not search. | **Fail.** Struggles to explain abstract/off-line thought. | **Fail.** Rejects internal representation. | **Dissolves** the problem, but arguably changes the subject regarding "mind." |
  | **Predictive Processing (Neuro)** | **Pass.** Hierarchical error minimization is local and parallel. | **Pass.** Predicts sensory input, not logical states. | **Pass.** Precision weighting handles relevance dynamically. | **Mixed.** Compositionality is emergent, not structural. | **Mixed.** Representations are probabilistic, not symbolic. | Most promising bridge between your field and philosophy. |

  ### IV. Recommendation for Your Reading

  Given this scorecard, when you evaluate a new text on the frame problem, ask these three questions in order:

  1.  **Does it assume a global, explicit world model?** If yes, it is likely trying to solve a problem that biological systems do not actually have in that format.
  2.  **Does it distinguish between the *logical* problem (consistency) and the *search* problem (relevance)?** Many papers solve the former and claim victory over the latter.
  3.  **Does it acknowledge the Existence Proof?** If a philosopher argues the frame problem shows AI is impossible, but offers no account of how humans do it, they are describing a limitation of their formalism, not a limitation of minds.

  **The Verdict:**
  The frame problem is likely a **category error** generated by Classical Computationalism. It is the problem of how to make a static symbol system behave like a dynamic biological organ. A "solution" that preserves the symbol system is unlikely to succeed. A "dissolution" that moves to dynamic systems theory (like your own field) satisfies the non-negotiable desiderata but forces philosophy to abandon the idea of the mind as a logic engine.

  You should look for work that treats the frame problem not as a puzzle to be solved within representationalism, but as evidence *against* it. That is where the progress is.
