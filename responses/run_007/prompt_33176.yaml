answer: |-
  You are absolutely correct to pause before using this phrase. In epistemology (the study of knowledge) and science communication, "do your own research" (DYOR) is not a single instruction but a **shibboleth**—a password that signals different allegiances depending on who is speaking and who is listening.

  The phrase conflates *verification* (checking a claim) with *investigation* (generating knowledge). It also ignores the **division of cognitive labor**, which is the societal agreement that we rely on specialists for knowledge outside our own expertise.

  Here is a breakdown of the distinct claims bundled under "do your own research," ranked from the most anodyne (standard practice) to the most radical (epistemically subversive).

  ### 1. The Verification Claim
  *   **The Claim:** "Do not accept a headline or meme at face value; check whether a credible institution actually said this."
  *   **Meaning of 'Research':** Fact-checking.
  *   **Meaning of 'Own':** Personal responsibility for verification.
  *   **Defensibility:** **High.** This is basic media literacy. It assumes the existence of credible records and asks the individual to compare a claim against those records.
  *   **Comms Suitability:** **Promote.** This aligns with your team's intent. It encourages stopping the spread of rumors.
  *   **Ambiguity Risk:** **Low.** If framed as "verify before you share," it rarely licenses expert rejection.

  ### 2. The Source Hierarchy Claim
  *   **The Claim:** "When information conflicts, prioritize the primary source (e.g., the health agency) over the secondary interpreter (e.g., the news outlet or influencer)."
  *   **Meaning of 'Research':** Source tracing.
  *   **Meaning of 'Own':** Navigating the information chain yourself.
  *   **Defensibility:** **High.** This is a sound heuristic for navigating media ecosystems. It acknowledges that distortion increases as you move away from the source.
  *   **Comms Suitability:** **Promote.** This is the core of your team's strategy.
  *   **Ambiguity Risk:** **Moderate.** It depends on what the public defines as a "primary source." To your team, it's the CDC. To a skeptic, the "primary source" might be a raw data dump or a specific doctor's Substack, bypassing the agency entirely.

  ### 3. The Competence Claim
  *   **The Claim:** "You possess the necessary literacy to interpret technical summaries, press releases, or data visualizations without an intermediary."
  *   **Meaning of 'Research':** Interpretation of technical material.
  *   **Meaning of 'Own':** Intellectual autonomy.
  *   **Defensibility:** **Mixed.** It is defensible to encourage public scientific literacy. However, it is *indefensible* to assume the average layperson has the statistical or methodological training to interpret primary literature correctly (e.g., distinguishing correlation from causation, understanding confidence intervals).
  *   **Comms Suitability:** **Use with Caution.** Encouraging literacy is good; implying everyone is qualified to interpret raw data is dangerous.
  *   **Ambiguity Risk:** **High.** This is the pivot point. This claim validates the feeling that "I can read a PDF, therefore I am an expert." It bridges the gap between checking sources and rejecting expert synthesis.

  ### 4. The Synthesis Rejection Claim
  *   **The Claim:** "Expert consensus is a 'summary' that may hide nuance or bias; you should look at the underlying studies yourself rather than trusting the guideline."
  *   **Meaning of 'Research':** Re-evaluating the evidence base.
  *   **Meaning of 'Own':** Bypassing the consensus mechanism.
  *   **Defensibility:** **Low.** Scientific consensus *is* the result of research. It is a compression algorithm for truth. Asking individuals to re-litigate consensus individually is inefficient and prone to error (the Dunning-Kruger effect). It denies the value of the division of cognitive labor.
  *   **Comms Suitability:** **Do Not Promote.** This directly undermines public health guidance.
  *   **Ambiguity Risk:** **Very High.** This is often what online forums mean by DYOR. If your messaging emphasizes "don't trust summaries," you invite this reading.

  ### 5. The Institutional Skepticism Claim
  *   **The Claim:** "Institutions have political or financial incentives that corrupt their findings; therefore, institutional consensus is a signal of bias rather than truth."
  *   **Meaning of 'Research':** Investigating motives and conflicts of interest.
  *   **Meaning of 'Own':** Moral independence from corrupt systems.
  *   **Defensibility:** **Low (in this context).** While institutions *can* have biases, the heuristic "distrust all institutional consensus" is epistemically bankrupt. It treats all sources as equally suspect, leveling the playing field between a peer-reviewed study and a YouTube video.
  *   **Comms Suitability:** **Avoid.** This is the claim your family members are invoking.
  *   **Ambiguity Risk:** **Critical.** If you say "DYOR" without explicitly defining *credible sources*, skeptics hear "Trust your gut over the CDC."

  ### 6. The Radical Autonomy Claim
  *   **The Claim:** "Knowledge is only valid if I have personally verified it; relying on authority is a form of intellectual submission."
  *   **Meaning of 'Research':** Personal empirical validation.
  *   **Meaning of 'Own':** Solipsistic ownership of truth.
  *   **Defensibility:** **Indefensible.** This makes society impossible. We cannot all grow our own food, build our own phones, or run our own clinical trials. We must trust others to function.
  *   **Comms Suitability:** **Never.** This is anti-social epistemology.
  *   **Ambiguity Risk:** **N/A.** This is the end of the slippery slope.

  ---

  ### The Ambiguity Trap

  You asked whether the comms team might be unwittingly endorsing more than they intend. **The answer is yes.**

  The phrase "Do Your Own Research" is semantically porous. When you use it, you cannot control which of the six claims above the listener activates.
  *   **Your Team** hears Claim #1 and #2 (Verification/Hierarchy).
  *   **The Skeptic** hears Claim #4 and #5 (Synthesis Rejection/Skepticism).

  The danger lies in the word **"Research."**
  *   To a scientist, research is a rigorous, peer-reviewed, methodological process.
  *   To a layperson, "research" often means "Googling until I find a source that agrees with me."
  *   To a conspiracy theorist, "research" means "uncovering the hidden truth that authorities are suppressing."

  By using the word "research," you inadvertently elevate the act of "Googling" to the status of scientific inquiry. You grant epistemic authority to the act of searching, regardless of the quality of the results found.

  ### Recommendation for Public Health Messaging

  To encourage source-checking without licensing expert-rejection, you should **abandon the slogan "Do Your Own Research."** It is too contaminated. Instead, use phrasing that isolates Claims #1 and #2 while explicitly closing the door on Claims #3 through #6.

  **Instead of "Do Your Own Research," try:**

  1.  **"Verify Before You Share."**
      *   *Why:* Focuses on behavior (sharing) rather than epistemology (research). Implies checking, not investigating.
  2.  **"Check the Source, Not Just the Headline."**
      *   *Why:* Directs attention to the origin of information (Claim #2) without implying the user needs to interpret raw data.
  3.  **"Trust the Consensus, Verify the Claim."**
      *   *Why:* Explicitly validates institutional authority (blocking Claim #5) while allowing for fact-checking specific assertions (Claim #1).
  4.  **"Look for the Evidence, Not Just the Opinion."**
      *   *Why:* Distinguishes between data and commentary, without suggesting the user must analyze the data themselves.

  **If you must use the concept of research:**
  Qualify it heavily. "Check credible sources like the CDC" is safe. "Do your own research" is not. You need to define *what* research looks like.

  **Summary for your team:**
  The phrase is a **floating signifier**. It carries the *affect* of empowerment (which is good) but the *content* of epistemic individualism (which is bad for public health). You want the empowerment without the individualism. To get that, you must be specific about *where* they should look, rather than telling them to look for themselves.
