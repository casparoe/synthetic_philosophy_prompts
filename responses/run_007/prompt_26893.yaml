answer: |-
  You have put your finger on one of the most famous and enduring critiques in the philosophy of biology. The specific term you are looking for is a **"Just-So Story."**

  While the phrase comes from Rudyard Kipling's 1902 book of fictional fables (explaining how the leopard got its spots), it was weaponized as a technical term by **Stephen Jay Gould and Richard Lewontin** in their landmark 1979 paper, *"The Spandrels of San Marco and the Panglossian Paradigm."*

  Here is the breakdown of the concept, why your intuition is correct, and how to distinguish this from legitimate science.

  ### 1. The Name: "Just-So Story"
  In the context of evolutionary psychology and biology, a Just-So Story is an untestable narrative explanation for a trait or behavior. It assumes that because a trait exists, it must have been selected for because it was adaptive.

  The critique is exactly what you described: **Post-hoc rationalization.**
  *   **Observation:** Behavior $X$ exists.
  *   **Assumption:** Behavior $X$ must be an adaptation.
  *   **Story:** In the Environment of Evolutionary Adaptedness (EEA), Behavior $X$ would have helped survival/reproduction.
  *   **Conclusion:** Therefore, we evolved Behavior $X$.

  As you noted, the fatal flaw is that if Observation $\neg X$ (the opposite behavior) were found, a different but equally plausible story could be constructed to explain why $\neg X$ was adaptive. If a theory can explain both $X$ and $\neg X$, it is **unfalsifiable**.

  ### 2. The Broader Paradigm: "Adaptationism"
  The epistemic pattern you are noticing is driven by what Gould and Lewontin called the **"Adaptationist Programme"** (or Panglossian Paradigm).

  This is the default assumption that every trait of an organism is an optimal solution to a specific problem posed by natural selection. The critique argues that this ignores other evolutionary forces, such as:
  *   **Genetic Drift:** Random changes that aren't adaptive.
  *   **Phylogenetic Constraint:** Traits we have simply because our ancestors had them (e.g., we have backaches because we evolved to walk upright on spines designed for quadrupeds, not because backaches are adaptive).
  *   **Spandrels:** Byproducts of other adaptations (e.g., the ability to read is not an adaptation; it's a byproduct of having a brain adapted for language and pattern recognition).

  ### 3. The Logical Flaw: Unfalsifiability
  You asked if there is a name for the move where the explanation "can't really be checked." In philosophy of science, this is the problem of **unfalsifiability** (associated with Karl Popper).

  A scientific hypothesis must make predictions that could potentially prove it wrong.
  *   **Legitimate Hypothesis:** "If kin selection drives this, then we should see lower investment in step-children *even when controlling for socioeconomic stress and social stigma*."
  *   **Just-So Story:** "We see lower investment. That proves kin selection." (If the data showed *higher* investment, the proponent would simply say, "That proves alliance-building strategies.")

  When the explanation is generated *after* the data is known, without independent criteria for what would count as evidence *against* the theory, it is a Just-So Story.

  ### 4. Distinguishing it from Legitimate Hypothesis
  You asked what distinguishes this from a "normal scientific hypothesis about the past." Legitimate evolutionary psychology does exist, but it has to clear a much higher bar to avoid being a Just-So Story. Here is how you tell the difference:

  | **Just-So Storytelling** | **Legitimate Evolutionary Hypothesis** |
  | :--- | :--- |
  | **Timing:** Explanation is created *after* the data is observed. | **Timing:** Prediction is made *before* data collection (or uses hold-out data). |
  | **Uniqueness:** Assumes the behavior is the *only* adaptive solution. | **Comparative:** Checks if related species show similar traits (comparative method). |
  | **Mechanism:** Ignores how the brain/body actually achieves the task. | **Mechanism:** Identifies the physiological or cognitive mechanism (e.g., hormonal changes). |
  | **Alternatives:** Dismisses cultural or byproduct explanations. | **Alternatives:** Actively tests null hypotheses (e.g., is this just a cultural norm?). |
  | **EEA:** Vaguely references "the ancestral environment." | **EEA:** Specifies *which* ancestral environment and ecological niche. |

  ### 5. Why It Persists
  The reason you keep seeing this in popular science is that **narrative is satisfying.** Humans are pattern-matching engines. A story that says "We do X because it helped our ancestors survive" provides a sense of meaning and ultimate causation. It turns a messy statistical correlation into a purposeful design.

  Furthermore, in the specific example you gave (the "Cinderella Effect" regarding stepchildren), the data *is* robust (stepchildren are at higher risk). However, critics argue that even if the data is real, the *explanation* (genetic relatedness) might be confounded by social factors (e.g., lack of legal bonds, social stigma, stress of blended families). A Just-So Storyteller ignores the social confounds; a scientist tests for them.

  ### Summary
  The label you want is **Just-So Story**.

  It is a specific instance of **post-hoc reasoning** within the **Adaptationist Programme**. Your skepticism is well-founded: if an explanation can be retrofitted to any possible outcome, it is not science; it is mythology dressed in the language of natural selection. Gould and Lewontin's critique remains the standard warning against this exact intellectual habit.
