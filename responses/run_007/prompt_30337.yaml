answer: |-
  # Teaching Plan: The Paradox of Self-Amendment

  ## 1. Conceptual Preconditions
  Before the puzzle can be stated without collapsing into confusion, four distinctions must be established. If these are not in place, students will talk past the paradox.

  *   **Rule vs. Formulation:** Students must distinguish the *norm* (the prescriptive meaning) from the *sentence* (the text). If they conflate these, they will think amending the text simply *is* amending the rule, missing the question of what authorizes that change.
  *   **First-Order vs. Second-Order Rules:** They must grasp that some rules govern conduct (pay dues), while others govern rules (how to change the dues rule). Without this hierarchy, self-amendment looks like a rule acting on itself physically, rather than a higher-order power acting on a lower-order object.
  *   **Validity vs. Efficacy:** They must understand that a rule can be *valid* (part of the system) without being *efficacious* (actually followed), and vice versa. The puzzle is about validity, not whether the members actually obey the new rule.
  *   **Systemic Identity:** They must accept that a legal system can change its rules and remain the *same* system. If every amendment creates a new system, there is no paradox, only revolution.

  ## 2. The Central Example: The Private Club
  **Recommendation:** Use a **small private club's bylaws**, *not* a national constitution and *not* a game.

  **Why:**
  *   **Constitution:** As you suspected, this imports "popular sovereignty," "revolution," and "court review." Students will ask, "But can the Supreme Court strike this down?" which bypasses the logical puzzle.
  *   **Game:** While logically pure (e.g., *Nomic*), law students often dismiss games as lacking genuine *obligation*. They will say, "You can just stop playing," which treats the norm as optional rather than binding.
  *   **Club:** This is the sweet spot. It implies genuine obligation (members are bound) without the metaphysical baggage of the State. It feels like law (private ordering) but is simple enough to map completely.

  **Crucial Pedagogical Move:** You must **stipulate** that this club exists in a legal vacuum. Tell the students: *"Assume there is no state contract law, no courts, and no external enforcement. The bylaws are the only source of validity for the club."* This creates the closed system necessary for the paradox without the triviality of a game.

  ## 3. Example Constraints: What It Must Have and Lack
  To ensure the puzzle remains logical and not merely verbal, the example must be constructed carefully.

  **What It Must Have:**
  *   **A Clear Amendment Clause:** Article X states: "These bylaws may be amended by a 2/3 vote of the membership."
  *   **A Specific Scenario:** A proposal is passed by 2/3 vote to change Article X itself (e.g., lowering the threshold to 51% or removing the amendment clause entirely).
  *   **Temporal Sequence:** A clear "Before" (Old Rule), "During" (The Vote), and "After" (New Rule).

  **What It Must Lack:**
  *   **External Validation:** No reference to state law, contract theory, or moral rights.
  *   **Ambiguity:** Do not allow debates about whether the vote actually happened. Stipulate the vote occurred exactly as the old rule required.
  *   **Substantive Limits:** Do not include "eternity clauses" (e.g., "Article X cannot be changed"). We are testing *procedural* self-reference, not substantive limits on power.

  ## 4. Session Sequence & Misconception Management
  **Hour 1: The Setup and The Emergence of the Gap**

  *   **0:00–0:20 | Conceptual Groundwork:** Briefly establish the four preconditions (Rule/Sentence, 1st/2nd Order, Validity/Efficacy, Identity).
      *   *Head off Misconception:* **"It's just circularity."** Students will say, "The rule says it can change, so it changes."
      *   *Intervention:* Ask: "If the rule is successfully changed, does the old rule still exist to authorize the change? If not, what authorized the vote that killed it?"
  *   **0:20–0:40 | The Scenario:** Present the Club Case. Walk through the vote to amend the amendment clause.
      *   *Head off Misconception:* **"The text settles it."** Students will point to the words of Article X.
      *   *Intervention:* Remind them of the Rule/Sentence distinction. "The text is ink. What gives the ink the power to bind the future?"
  *   **0:40–1:00 | The Validity Gap:** Focus on the exact moment the amendment passes.
      *   *The Puzzle:* If the new Article X is valid, where did its validity come from?
          *   If from the *Old* Article X: The Old Article X must still be valid *after* it was abolished.
          *   If from the *New* Article X: The New Article X is bootstrapping itself into existence (vicious circularity).

  **Hour 2: Attempted Solutions and The Limit**

  *   **1:00–1:30 | Theories of Continuity:** Discuss how legal systems bridge this gap (Hart's Rule of Recognition vs. Kelsen's Basic Norm vs. Ross's logical critique).
      *   *Head off Misconception:* **"Self-reference is always vicious."** Students may think self-reference makes the rule meaningless.
      *   *Intervention:* Show that ordinary language handles self-reference ("This sentence has five words"). The problem is specific to *authority*, not reference. Ask: "Is the problem logical (contradiction) or normative (authority)?"
  *   **1:30–1:50 | The Limit Question:** If the amendment clause can change itself, can it change *anything*? Can it turn the club into a dictatorship?
      *   *Goal:* Distinguish between *legal continuity* (it's still the same club) and *revolution* (it's a new system).
  *   **1:50–2:00 | Closing Assessment:** Pose the final question (see below).

  ## 5. What to Leave Out (and Say So)
  Explicitly tell the students you are excluding the following to keep the logic clean. This prevents them from thinking you are ignoring "real law."

  *   **Unconstitutional Constitutional Amendments:** Do not discuss substantive limits (e.g., "An amendment cannot violate human rights"). That is a different puzzle (limits on *content* vs. limits on *procedure*).
  *   **Revolution Theory:** Do not discuss what happens if the amendment fails and members revolt. We are assuming the procedure is followed successfully.
  *   **Contract Law:** Reiterate that we are bracketing external enforcement. If a student raises "breach of contract," acknowledge it as a real-world solution but explain it solves the sociological problem, not the logical one.

  ## 6. Final Assessment Question
  Do not ask them to define self-amendment. Ask them to locate the source of validity.

  **"In the moment the old amendment clause ceases to exist, and before the new one is fully operative, what is the juridical status of the vote that just occurred? If you say it is 'valid,' name the specific rule that validates it. If you cannot name one, is the new system founded on law or on fact?"**

  *   *Why this works:* It forces them to choose between a logical contradiction (the old rule validates its own destruction) and a sociological fact (the vote is valid only because people accept it, not because a rule says so). This reveals whether they understand that the puzzle challenges the very idea of a "closed" normative system.
