answer: |-
  You are correct that the stalemate is not empirical. Both sides generally accept the calculus, the neuroanatomy, and the basic statistical machinery. The deadlock is **modal and methodological**. It is a disagreement about the *ontological status* of the Free Energy Principle (FEP) and the *criteria for successful explanation* in theoretical neuroscience.

  Here is the diagnosis: The debate is stuck because enthusiasts and critics are talking past each other regarding whether the FEP is a **Constitutive Law** or an **Instrumental Framework**.

  ### 1. The Diagnosis: A Clash of Modal Status

  **The Enthusiast View (Constitutive/Nomological):**
  Proponents (e.g., Friston) treat the FEP analogously to the Principle of Least Action in physics or the Second Law of Thermodynamics. It is claimed to be a *necessary condition* for the existence of self-organizing systems.
  *   **Claim:** If a system persists, it *must* minimize free energy.
  *   **Explanatory Goal:** Unification. The value lies in showing that perception, action, and homeostasis are all manifestations of the same underlying physical imperative.
  *   **Defense against Tautology:** They argue it is not a tautology because it is not true by definition of the words, but by the mathematical structure of non-equilibrium steady states. It is a "law of life."

  **The Critic View (Instrumental/Methodological):**
  Critics (e.g., Colombo, Wright, Sims) treat the FEP as a modeling language or a "lens."
  *   **Claim:** You *can* describe almost any system as minimizing free energy if you choose the right generative model.
  *   **Explanatory Goal:** Specificity and Falsifiability. A theory explains by ruling things out. If the FEP applies to rocks, bacteria, and brains equally, it cannot explain what is specific to brains.
  *   **Attack on Tautology:** They argue that because the "generative model" can be arbitrarily complex, the claim "the system minimizes free energy relative to its model" is vacuous. The explanatory work is being done by the *assumptions about the model structure*, not the free energy minimization itself.

  **The Root Conflict:**
  The disagreement is about **what counts as an explanation**.
  *   For the enthusiast, explaining a phenomenon means showing it is a necessary consequence of a deeper, unifying physical principle (reductionism/unification).
  *   For the critic, explaining a phenomenon means identifying the specific causal mechanisms that distinguish it from other phenomena (mechanistic specificity).

  When critics say "It's unfalsifiable," they mean "It imposes no constraints on observable data." When enthusiasts say "You're missing the point," they mean "You are looking for contingent mechanisms when I am offering a necessary condition."

  ### 2. The "Principle vs. Process" Confusion

  You noted that people mean different things by this distinction. Here is why:

  *   **Enthusiasts** view the Process Theory (e.g., Active Inference, hierarchical predictive coding) as a **derivation**. They believe the specific architectures (hierarchical models, precision weighting) fall out naturally when you ask how a system *actually* minimizes free energy under biological constraints.
  *   **Critics** view the Process Theory as an **add-on**. They argue that the FEP (the math of VFE) does not logically entail hierarchical structures or specific neural coding schemes. You have to *assume* those to get the neuroscience out. Therefore, the FEP gets the credit for the unification, but the Process Theory does the work of prediction.

  This leads to a **Credit Assignment Problem**. When a prediction succeeds, enthusiasts credit the FEP. When a prediction fails, they blame the specific Process Theory (the "auxiliary hypothesis"), shielding the core Principle from falsification. This is classic Lakatosian "protective belt" behavior, which critics find scientifically suspicious.

  ### 3. Pathways to Progress

  Given this diagnosis, more data alone will not solve this. Both sides can fit the same data. Progress requires resolving the modal status or forcing a decoupling of the claims.

  **A. The "Negative Result" Theorem (Formal Progress)**
  Progress would look like a formal proof demonstrating a class of self-organizing systems that persist over time *but cannot be described* as minimizing variational free energy.
  *   *Current State:* Enthusiasts argue this is mathematically impossible (by definition of the Markov blanket).
  *   *Required Progress:* A critic needs to show that the mapping from "physical dynamics" to "probabilistic inference" requires assumptions (e.g., ergodicity, specific noise structures) that biological systems violate. If the FEP only applies to systems that *already* look like Bayesian inferencers, it is not a foundational law; it is a restatement.

  **B. The "Unique Prediction" Experiment (Empirical Progress)**
  We need a "smoking gun" experiment where Active Inference (the process theory) makes a quantitative prediction that **contradicts** standard Optimal Control or Reinforcement Learning, and the data supports Active Inference.
  *   *Current State:* Most experiments show consistency with PP/FEP, but also consistency with RL.
  *   *Required Progress:* Identify a behavioral or neural signature (e.g., specific reaction time distributions, specific pupil dilation patterns under uncertainty) that *only* arises from Expected Free Energy minimization and *cannot* be generated by reward maximization with a modified cost function. Until FEP predicts something that RL *cannot* fit, it remains a redescription, not a replacement.

  **C. The "Instrumentalist Turn" (Philosophical Progress)**
  The most likely resolution is a semantic and philosophical concession from the enthusiasts.
  *   *The Shift:* Admit that the FEP is not a "Law of Nature" (like gravity) but a **Normative Framework** (like rational choice theory).
  *   *Why this helps:* Rational choice theory is technically "false" (humans aren't perfectly rational), but it is useful. If FEP proponents admit that biological systems *approximate* free energy minimization rather than *obeying* it as a physical law, the "tautology" charge loses its sting. It becomes a useful idealization, not a metaphysical claim.
  *   *The Cost:* This reduces the grandeur of the claim. It stops being a "Theory of Everything" and becomes a "Very Good Modeling Tool."

  **D. Decoupling the Hierarchy (Conceptual Progress)**
  We need a sharper distinction between the **Mathematical Identity** and the **Biological Mechanism**.
  *   *The Distinction:* Explicitly separate the claim "This system can be modeled *as if* it minimizes FEP" (Instrumental) from "This system contains mechanisms *designed* to minimize FEP" (Realist).
  *   *Progress:* If proponents admit the former is the primary claim, critics can stop attacking the unfalsifiability. If proponents insist on the latter, they must identify the "Free Energy Minimizer" organ or circuit, distinct from the "Inference" circuit.

  ### Summary

  The disagreement is not about facts; it is about **standards of explanation**.
  *   **Critics** want **causal specificity** (How does *this* neuron do *that*?).
  *   **Enthusiasts** want **nomological unification** (Why does *any* system do *anything*?).

  **What counts as progress?**
  The most productive path is **Option C (The Instrumentalist Turn)**. If the FEP is demoted from a "Law of Life" to a "Normative Modeling Framework," the critics' demand for falsifiability becomes less relevant (we don't falsify utility), and the enthusiasts can continue using it to generate heuristics without making metaphysical overreach claims.

  However, if the enthusiasts insist on the "Law of Nature" status, the only thing that counts as progress is **Option B**: a prediction that fails for all competing frameworks (RL, Control Theory) but succeeds for Active Inference. Until then, the debate is not science; it is philosophy of science disguised as neuroscience.
