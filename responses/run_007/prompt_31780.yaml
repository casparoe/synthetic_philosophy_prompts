answer: |-
  **The two sides, in their own terms**

  The Reflection Defender (e.g., Van Fraassen, Briggs) treats Reflection as a constraint on *diachronic coherence*. For them, rationality is structural: your credences across time must hang together to avoid pragmatic inconsistency. They accept counterexamples like the "sleeping pill" case but argue these fall outside the principle's scope. The principle applies only when you believe your future self is updating rationally on new evidence. If you expect irrationality, you aren't conditionalizing on your future credence *qua* expert, but *qua* compromised mechanism. Thus, the Dutch Book argument stands for ideal agents, and violations indicate a failure of planning consistency, not necessarily a failure of intuition in non-ideal cases.

  The Reflection Critic (e.g., Christensen, Talbott) treats Reflection as a proposed *normative guide* for actual agents. They argue that if a principle requires idealization to avoid counterintuitive results, it loses its normative bite. For the critic, the "drunk self" case isn't an edge case; it reveals that future credence alone doesn't warrant deference. Rationality requires assessing the *reliability* of the future self, not just the value of their credence. They contend that the Dutch Book argument presupposes you value your future bets, but if you know your future self is compromised, you shouldn't. Therefore, Reflection fails as a general rule of rationality because it conflates *being* your future self with *trusting* your future self.

  **Diagnosis**

  Your hypothesis is largely correct, but it requires a layer of nuance regarding *idealization*. The stalemate is indeed methodological, but specifically concerning the role of idealization in formal models.

  The Defenders are engaged in a project of *systematic reconstruction*. They use Dutch Book arguments to identify structural features of a perfectly coherent belief system. For them, the Dutch Book is constitutive: if you are vulnerable, your system is flawed. When critics present a counterexample, Defenders respond by refining the antecedent conditions (e.g., "assuming no loss of memory or rationality"). This protects the theorem but risks triviality. The Critics are engaged in *normative evaluation*. They use case intuitions to test whether the principle offers actionable guidance. When Defenders retreat to ideal conditions, Critics argue the principle no longer applies to the humans who need guidance.

  Consequently, they are disagreeing about the *function* of formal epistemology. Is it to describe the geometry of ideal belief (Defenders), or to prescribe rules for imperfect agents (Critics)? The Dutch Book proves that violating Reflection makes you *inconsistent*, but the Critics correctly note that inconsistency isn't always *irrational* if you have good reason to distrust your future processing.

  There is no hidden empirical question to resolve this. The disagreement is about whether "rationality" names a formal property of credence functions or a virtue of cognitive agents. Your methodological diagnosis holds: Defenders prioritize internal coherence of the formal system, while Critics prioritize external fit with pre-theoretic judgments. The debate persists because neither side accepts the other's metric of success. The Defenders view the Critics' intuitions as data to be modeled away; the Critics view the Defenders' refinements as ad hoc protections of a falsified theory.

  **What would move it**

  Progress requires dissolving the question "Is Reflection true?" in favor of "When does Reflection apply?" The debate has actually begun to shift this way with *Generalized Reflection* (e.g., Rachael Briggs), which weights future credences by their expected reliability. This formalizes the Critic's intuition (trust matters) within the Defender's framework (coherence matters).

  However, a full resolution likely requires a higher-level distinction between *Coherence Norms* and *Deference Norms*. We should concede that Reflection is a theorem of probability calculus regarding coherent planning (satisfying the Defenders) but deny that it is a standalone epistemic virtue for non-ideal agents (satisfying the Critics). The best outcome is clarity that Dutch Book arguments establish *consistency*, not *correctness*. Once we admit that one can be consistently wrong (or consistently distrustful of a future self), the pressure to make Reflection a universal normative law dissipates. The debate ends not with a winner, but with a clearer map of where formal constraints end and epistemic trust begins.
