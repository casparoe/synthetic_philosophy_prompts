      *   *Utility of Money:* Money isn't utility. Diminishing marginal utility exists, but it's not necessarily logarithmic. It could be linear (for small amounts) or step-wise (for goals).
      *   *Risk of Ruin:* Kelly minimizes time to ruin *relative to other aggressive strategies*, but fractional Kelly or fixed betting might be safer for specific goals.
      *   *Ergodicity:* The Kelly argument relies on time-averages converging to ensemble averages. But individual paths matter more than the average path.
      *   *The "EUM Defense" Rebuttal:* Just because you *can* model Kelly as EUM with Log Utility doesn't mean you *should*. Utility functions represent preferences, not mathematical necessities. If my preferences aren't logarithmic, forcing them to be is irrational.
      *   *Opportunity Cost:* Kelly assumes you can always reinvest. Real life has liquidity constraints and consumption needs.
