      *   **Point 3: Ergodicity and Path Dependence:** The ensemble average (expected value) vs. time average. Kelly optimizes the time average of *wealth*, but rationality cares about the time average of *utility*.
      *   **Point 4: Parameter Uncertainty (The Practical Knockout):** Kelly assumes known probabilities. In reality, we estimate. Full Kelly is too aggressive under uncertainty. If the "rational" strategy leads to ruin due to estimation error, it's not rational.
      *   **Point 5: Consumption and Non-Reinvestability:** Kelly assumes compounding forever. Real agents consume.
      *   **Conclusion:** Summarize. Kelly is a tool, not a moral imperative.

