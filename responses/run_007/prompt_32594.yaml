answer: |-
  Your friend is right, and their intuition cuts to the heart of a common confusion in decision theory: the conflation of a mathematical property of a strategy with a normative requirement for an agent.

  The Kelly criterion is a powerful theorem about the behavior of wealth under compounding. It is not a theorem about rationality. To claim it is rationally required is to commit a category error.

  Here is the strongest case against the normative necessity of Kelly betting, specifically engaging with the "Expected Utility Maximization (EUM) with Log Utility" defense.

  ### 1. The Asymptotic Fallacy: We Do Not Live in the Limit
  The Kelly theorem states that as the number of bets $N \to \infty$, the strategy maximizing expected log wealth will almost surely outperform any other fixed-fraction strategy.

  **The Counter:** Rationality is concerned with finite agents living finite lives.
  In any finite horizon, a strategy that is "dominated" by Kelly in the limit can have a higher probability of meeting specific goals or higher expected utility. For example, if you have a one-time opportunity to double your money with a 60% chance, and you need that money to save a life *now*, Kelly might suggest betting a fraction (say, 20%). But if the goal is binary (save the life or don't), a "all-in" strategy (which Kelly condemns as ruinous in the long run) might be the only rational choice to achieve the specific utility outcome you care about.

  By insisting on Kelly, you are prioritizing the *growth rate of wealth* over the *achievement of the agent's actual goals*. If the agent's goal is not "maximize wealth over infinite iterations," then maximizing geometric growth is instrumentally irrational.

  ### 2. The EUM Defense is Tautological, Not Normative
  Your friend's comeback is the standard defense: *"Kelly is just EUM with a logarithmic utility function. If you reject Kelly, you either reject EUM or you must justify why Log Utility is forbidden."*

  This sounds compelling, but it hides the normative work in the choice of the utility function.

  **The Counter:** EUM dictates that you should maximize $E[U(x)]$. It does **not** dictate what $U(x)$ must be.
  Utility functions represent preferences. To say "You must bet Kelly" is equivalent to saying "You must have Logarithmic Utility over wealth." But why must you?

  *   **Linear Utility:** If I am a billionaire betting pocket change, my utility for money is effectively linear. Kelly tells me to bet less than my edge suggests to protect against ruin. But if ruin is impossible (due to outside wealth) or irrelevant (the bet is too small to impact my life), linear maximization yields higher expected dollars with no meaningful risk. Insisting I use Log Utility here reduces my expected return for no gain in *my* actual well-being.
  *   **Step-Function Utility:** If I need \$100,000 to buy a house and anything less is useless to me, my utility function is a step function. Kelly betting might keep me safely in the "houseless" zone with high probability, whereas a more aggressive strategy might cross the threshold.
  *   **The "Off-Limits" Claim:** Log Utility is not "off-limits"; it is simply **contingent**. It is a valid utility function for someone who cares about geometric growth. But claiming it is *universally* rational is like claiming "Vegetarianism is the only rational diet because it maximizes longevity." Longevity is a goal, not a requirement of rationality. If I prefer a shorter life with steak dinners, I am not irrational; I have a different utility function.

  The "Kelly = EUM(Log)" argument is tautological. It says: "If your utility function is Log Wealth, you should maximize Log Wealth." It fails to prove why your utility function *ought* to be Log Wealth.

  ### 3. Ergodicity and the Ensemble vs. Time Average
  Proponents of Kelly (like Ole Peters) often argue that standard Expected Value maximization is flawed because it relies on ensemble averages (parallel universes), whereas we live in one timeline (time averages). They argue Log Utility fixes this ergodicity break.

  **The Counter:** Fixing the ergodicity break for *wealth* does not fix it for *utility*.
  Even if wealth grows ergodically under Kelly, utility might not. If my utility depends on consumption relative to my peers, or if I have discount rates that make future wealth less valuable than present wealth, the time-average of my *utility* is not maximized by the time-average of my *log wealth*.

  Rationality requires maximizing the time-average of **utility**, not wealth. If my utility function is not logarithmic, maximizing the time-average of log wealth is a proxy that fails to track my actual interests.

  ### 4. Parameter Uncertainty (The Estimation Risk Argument)
  The Kelly formula is $f^* = p - q/b$. It requires precise knowledge of the probability of winning ($p$) and the odds ($b$).

  **The Counter:** In the real world, probabilities are estimates, not givens.
  If you overestimate your edge even slightly, Full Kelly betting drastically increases the risk of ruin and reduces geometric growth. Under parameter uncertainty, the "rational" strategy is almost always **Fractional Kelly** (betting a fraction of the recommended amount).

  If the normative claim is "You must bet Kelly," and the practical reality is "You must bet Half-Kelly to account for your own ignorance," then the normative claim is false. A rule that leads to suboptimal outcomes (or ruin) when applied by non-omniscient agents cannot be a universal norm of rationality. It is a solution to a math problem, not a life problem.

  ### 5. Consumption and Non-Reinvestability
  Kelly assumes a closed system where all wealth is reinvested forever.

  **The Counter:** Humans consume.
  We bet to spend, not just to compound. If I have a bankroll and I need to withdraw 5% annually to eat, the Kelly criterion changes fundamentally. In many consumption scenarios, the optimal strategy involves depleting the bankroll over time, which is incompatible with the Kelly goal of perpetual geometric growth.

  If I am rational, I optimize for my life trajectory (consumption + bequest), not the asymptotic size of a pot I am not allowed to touch. Insisting on Kelly in a consumption context is like insisting a car be designed for maximum top speed when the driver needs maximum towing capacity.

  ### Summary: The Is-Ought Gap
  Your friend identified the slide from "is" to "ought."
  *   **The Theorem (Is):** If you reinvest forever, Log-Wealth maximization leads to the highest terminal wealth almost surely.
  *   **The Norm (Ought):** Therefore, you should maximize Log-Wealth.

  This slide only works if you accept two hidden premises:
  1.  Your goal is to maximize terminal wealth in the infinite limit.
  2.  You know the true probabilities of your bets.

  Neither premise is true for human agents.

  **Conclusion on the EUM Defense:**
  To say "Kelly is just EUM with Log Utility" is to admit that Kelly is preference-dependent. If you reject Kelly, you are not rejecting EUM; you are rejecting the specific claim that **Logarithmic Utility is the only rational preference ordering over money.**

  Since utility functions are definitions of an agent's values, not laws of physics, no specific utility function can be "required" by rationality without violating the subjectivity of value itself. You can be perfectly coherent, perfectly consistent, and perfectly rational with a linear, step-wise, or sigmoid utility function. In those cases, Kelly betting is not just unnecessary; it is often **irrational** because it fails to maximize *your* expected utility.

  Your friend wins the point: Kelly is a description of how wealth behaves, not a prescription for how minds should work.
