answer: |-
  You mistake the shock of the eyes for the wisdom of the heart, Mencius. When a man sees the child at the well, yes, he feels a start of alarm. But tell me, does he not also feel a flash of greed when he sees gold left unguarded? Does he not feel a surge of anger when shoved? These too arise without calculation, faster than thought. If you call the alarm benevolence simply because it is untaught, you must call the greed and anger equally natural. And you would be right—they are all *xing*, our inborn nature. But none of them are goodness. Goodness is not the reflex of the flesh; it is the correction of that reflex. That alarm is merely a raw sensitivity, like the eye's ability to see. It is not yet the virtue of seeing clearly. To call it benevolence is to call the uncarved jade a ritual vessel; it may become one, but only after the cutting and grinding have destroyed its original form.

  Consider the consequence of your view. If this sprout were truly the nature of goodness, why did the sage kings need to labor so tirelessly to establish rites and music? If men naturally tended toward order as the sprout tends toward the stem, society would arrange itself without teachers, without laws, without the strain of deliberate effort (*wei*). But we see that without the guidance of a teacher, men follow their nature and end in contention; without the restraint of ritual, they end in chaos. The fact that we must seek goodness proves we do not possess it. We desire what we lack. We strive to be good precisely because our nature, left to itself, is not good. That movement at the well is the raw material I concede you have, but it is the steaming and straightening of the warped board that makes it useful, not the warping itself.
