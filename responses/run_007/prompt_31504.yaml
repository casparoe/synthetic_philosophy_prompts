  Dear Friend,

  It is no surprise that you stayed out of that argument, for you were witnessing a collision between two distinct frameworks of judgment, one rooted in the ethics of community and the other in the logic of propositions. As a novelist, you know that while facts matter, the context in which they are spoken often determines their meaning. To split the difference, we must look at where Elena and David are speaking past one another, because they are actually arguing about two different things: Elena is arguing about the appropriateness of the blame, while David is arguing about the accuracy of the claim.

  Elena is right in her opening move that moral criticism functions as a social practice requiring a certain degree of standing. When M. demands truthfulness from the young memoirist while having flouted that same demand himself without apology, he undermines the normative force of his critique. Blame is not merely a statement of fact; it is a speech act that invites the accused to acknowledge a wrong, and that invitation loses its potency when the inviter has openly rejected the same rule. However, Elena overreaches when she suggests the essay fails as moral criticism entirely. The criticism can be morally apt in content even if the critic is compromised in character. By conflating the validity of the accusation with the virtue of the accuser, she risks implying that the young memoirist's deception is less harmful simply because the critic is a hypocrite, which is not the case.

  David is right to counter that the factual accuracy of the accusation is independent of the accuser's history. If the memoirist lied, readers were misled, and that harm exists regardless of who points it out. His identification of the tu quoque fallacy is logically sound; a liar can tell the truth, and pointing out their hypocrisy does not erase the lie they are exposing. Yet David overreaches significantly when he argues that if standing mattered, norms would become unenforceable because everyone has done something wrong. This is a straw man of Elena's position. Standing does not require blamelessness or perfection, as Elena clarifies in her second move, but rather relevance. One need not be sinless to criticize sin, but one loses the right to criticize a specific sin if one is currently unrepentant of that same sin. David's fear that norms would collapse ignores the nuance that standing is usually reserved for those who uphold the norm or have atoned for breaking it.

  Elena's second move is her strongest philosophical ground, distinguishing between general blamelessness and the specific standard invoked. She is correct that attacking the person to deny the claim is different from granting the claim while denying the person the role of accuser. This preserves the truth of David's point while salvaging her insight about moral authority. However, she assumes too readily that the standard M. flouted is identical to the one he is invoking, which leads directly to David's final counter.

  David's last move, insisting that travel books and memoirs are different contracts, is where the argument becomes most empirical and least philosophical. He is right that genre expectations vary; a travel book might allow for composite dialogue or reconstructed scenes in a way a strict memoir does not. However, he overreaches by claiming the analogy collapses entirely. Padding a travel book with encounters that never happened is still a form of non-fiction deception that breaches reader trust. Unless M.'s fabrications were within the accepted poetic license of travel writing while the memoirist's were clear violations of memoiristic contract, the core ethical breach remains similar enough to damage M.'s standing. David uses the genre distinction to shield M. from the charge of hypocrisy, but if both writers presented fabrication as fact, the distinction is one of degree, not kind.

  What both of them miss is the crucial role of repentance in restoring standing. Elena treats M.'s past sin as a permanent disqualification, while David treats it as irrelevant. Neither considers that if M. had acknowledged his past errors and apologized, his standing to criticize the memoirist might have been restored. They also miss the broader purpose of criticism, which is not just to police morality but to protect the art form itself. By focusing so heavily on M.'s character, they obscure the damage done to the genre of memoir by the young writer's actions. The health of the literary ecosystem depends on readers trusting non-fiction, and that trust is eroded by the memoirist's lies regardless of M.'s hypocrisy.

  The step of my adjudication where I am least confident is the evaluation of David's final point regarding the difference between travel writing and memoir contracts. I have leaned toward the view that fabrication in non-fiction is a comparable wrong across genres, but I acknowledge that reader expectations are not monolithic. Some travel writing is understood to be impressionistic, while memoir is often held to a stricter standard of factual recall. What would most plausibly change my mind on this point would be specific evidence regarding the industry norms at the time M. published his travel book versus the norms governing the memoirist today. If it could be shown that padding travel narratives was an accepted, known convention within that specific subgenre while the memoirist violated a clear, explicit contract of factuality, then David would be right that the hypocrisy charge fails because the standards were never the same. Without that specific contextual evidence, however, the presumption remains that lying to readers about reality is a fundamental breach in both forms, leaving Elena's intuition about standing largely intact.

  I hope this helps you navigate the silence you kept at the festival. Sometimes the most honest position is to acknowledge that a truth can be spoken by a liar, yet still feel wrong coming from their mouth.

  Yours,

  A Reader
