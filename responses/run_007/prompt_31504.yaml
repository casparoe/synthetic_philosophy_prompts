      *   **The Nature of "Truth" in Writing:** Both accept the binary (true/false), but the festival panel was on "truth in autobiographical writing," which is often nuanced (memory is fallible, etc.). However, "inventing composite characters" presented as "remembered fact" is generally accepted as a breach in memoir.
