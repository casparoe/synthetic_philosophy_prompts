      *   **Elena's Position:** M. lacks *standing* to criticize. Moral criticism requires the blamer to uphold the standard they invoke. It's not about the truth of the accusation, but the entitlement to blame.
      *   **David's Position 1:** The accusation's truth is what matters. Readers were misled regardless of the accuser. Elena's view is *tu quoque* (you too) fallacy. If standing mattered, no one could criticize anyone (since everyone sins), making norms unenforceable.
      *   **Elena's Position 2:** Standing doesn't require blamelessness, only not flouting the *specific* standard invoked. Distinguishes between denying the claim vs. denying the role of accuser.
      *   **David's Position 2:** Travel book vs. Memoir are different contracts. The deceptions are not the same wrong. Analogy collapses.

  3.  **Evaluate Each Move:**

      *   **Move 1 (Elena): Standing/Hypocrisy.**
          *   *Right:* Hypocrisy does undermine the *force* or *appropriateness* of moral blame in social contexts. It feels unjust for a hypocrite to condemn.
          *   *Overreach:* She suggests the essay "fails as moral criticism." The criticism might still be valid even if the critic is hypocritical. The *act* of blaming might be inappropriate, but the *content* remains true.
          *   *Nuance:* Standing is a real philosophical concept (e.g., Bell, Wallace), but it's distinct from the truth of the proposition.

      *   **Move 2 (David): Truth vs. Source (Tu Quoque).**
          *   *Right:* The factual accuracy of the accusation is independent of the accuser. Readers *were* misled by YM. The *tu quoque* fallacy is real; a hypocrite can speak truth.
          *   *Overreach:* He conflates factual accuracy with moral authority. Just because the claim is true doesn't mean the *blame* is appropriately issued by *this* person. He also exaggerates that "nobody could criticize anyone" – standing usually requires relevant similarity, not perfection.

      *   **Move 3 (Elena): Specific Standard vs. General Blamelessness.**
          *   *Right:* This is her strongest point. Standing usually requires relevance. You don't need to be sinless to criticize sin, but you shouldn't be guilty of the *same* sin without acknowledgment.
          *   *Overreach:* She assumes M. flouted the *same* standard. This leads to David's next point.

      *   **Move 4 (David): Genre Contracts (Travel vs. Memoir).**
          *   *Right:* There are differences in reader expectation between travel writing and memoir.
