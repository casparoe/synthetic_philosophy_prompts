      *   It was revitalized by Linda Zagzebski (and others like Kvanvig).
      *   The analogy: A cup of coffee made by a reliable machine vs. a cup of coffee made by an unreliable machine that happened to taste good. If the coffee tastes good, does the reliability of the machine add value to *this cup*?
