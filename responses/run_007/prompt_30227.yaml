prompt: |-
  I'm on the test-ordering committee at my clinic and, since my husband came home with a direct-to-consumer health report he half-understood and panicked over, I've been thinking a lot about whether more information is actually good for patients. At Thursday's meeting we have to decide whether to add a new, basically costless blood panel to the standard workup for every adult patient: it estimates ten-year risk of developing Alzheimer's, but our clinic can't offer the new disease-slowing drugs, so a positive result would mainly change monitoring and planning. One committee member keeps citing Good's theorem, saying costless information can never make an expected-utility maximizer worse off because you can always ignore it. The other side says that's exactly wrong in practice: patients and doctors won't ignore a scary number, and we'll get anxiety, unnecessary scans, and worse care. Please draft the short written opinion I'll circulate before the meeting, recommending adopt, reject, or adopt with conditions. It should have a concrete, actionable bottom line and should engage the strongest version of the loosing side's argument rather than just calling it irrational.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Member of a test-ordering committee at a clinic.
      *   **Context:** Deciding whether to add a costless blood panel estimating 10-year Alzheimer's risk to standard adult workups.
      *   **Constraint 1:** The clinic *cannot* offer disease-slowing drugs (so no curative/interventional benefit, only monitoring/planning).
      *   **Constraint 2:** A committee member cites Good's Theorem (costless info $\ge$ 0 value).
      *   **Constraint 3:** The opposing side argues real-world harms (anxiety, unnecessary scans, worse care).
      *   **Task:** Draft a short written opinion to circulate before the meeting.
      *   **Requirement:** Concrete, actionable bottom line (Adopt, Reject, or Adopt with Conditions).
      *   **Requirement:** Engage the strongest version of the losing side's argument (don't just call them irrational).
      *   **Tone:** Professional, persuasive, nuanced, suitable for a medical committee.

  2.  **Deconstruct the Arguments:**
      *   **Pro-Test (Good's Theorem):** Information has non-negative expected value. If it's free, you can't lose. You can always ignore it if it's not useful. Rational agents update beliefs optimally.
      *   **Anti-Test (Real-World Harms):** Humans aren't rational expected-utility maximizers. Anxiety affects quality of life. Positive results lead to cascade effects (scans, referrals) that have costs/risks even if the test is "costless." False positives/negatives exist. No treatment available means the info is largely non-actionable clinically.

  3.  **Evaluate the Medical/Clinical Context:**
      *   **Alzheimer's Risk Prediction:** These tests (likely polygenic risk scores or biomarker proxies) often have probabilistic outcomes, not certainties.
      *   **Actionability:** This is the key. If there's no treatment, what's the utility? Advance care planning? Lifestyle changes? (Evidence for lifestyle changes preventing Alzheimer's is mixed/limited).
      *   **Harms:** Anxiety, stigma, insurance implications (though GINA helps, it doesn't cover long-term care), cascade testing (PET scans, lumbar punctures) which are *not* costless and carry risk.
      *   **Good's Theorem Limitation:** It assumes the *decision maker* controls the action based on the info. In medicine, the patient receives the info, but the system reacts. Also, it assumes "costless" includes psychological and downstream economic costs, which this test does not (the test is costless, the *consequences* are not).

  4.  **Determine the Recommendation:**
      *   *Adopt:* Hard to justify without treatment options. High risk of harm.
      *   *Reject:* Strongest clinical ethics position. Non-actionable info + high anxiety potential = low value.
      *   *Adopt with Conditions:* Maybe restrict to specific populations? But the prompt says "standard workup for every adult."
      *   *Decision:* **Reject.** The lack of disease-modifying therapy makes the risk outweigh the benefit, specifically because Good's Theorem fails to account for downstream cascade costs and psychological burden which are *not* costless.

  5.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format.
      *   **Opening:** State the purpose and the recommendation clearly (Reject).
      *   **Engaging Good's Theorem:** Acknowledge the mathematical truth but highlight the clinical mismatch. Good's Theorem assumes the agent can ignore the info without cost. In medicine, a "positive" result creates a moral/clinical imperative to act, even if irrational.
      *   **Engaging the "Real World" Argument:** Validate their concerns but elevate them. It's not just "patients panic." It's about *clinical cascade*. A positive test leads to MRI/PET scans (radiation, cost, false positives) and referrals. These are not costless.
      *   **The "Actionability" Gap:** Emphasize the lack of treatment. Information without intervention is often burden.
      *   **Conclusion:** Reiterate the recommendation.

  6.  **Refining the Argument (Self-Correction during drafting):**
      *   *Critique:* Is "Reject" too blunt?
      *   *Fix:* Make sure to offer an alternative pathway (e.g., only upon specific request with counseling) to show nuance, but keep the standard workup recommendation as "Reject." Actually, the prompt asks for a concrete bottom line. "Reject for standard workup" is precise.
      *   *Critique:* Did I address Good's Theorem strongly enough?
      *   *Fix:* Explicitly state why the theorem's assumptions (costless info, rational ignoring) are violated. The info is costless to *acquire*, but costly to *process* and *act upon*.
      *   *Critique:* Did I address the personal anecdote (husband)?
      *   *Fix:* Keep it professional. Don't mention the husband in the memo, but use that empathy to shape the argument about patient anxiety.

  7.  **Final Polish:**
      *   Ensure the tone is collaborative but firm.
      *   Check word count (keep it short).
      *   Make sure the "Strongest Version of the Losing Side" is represented fairly before refuting it. The losing side here is the "Pro-Test" side (Good's Theorem). I need to show I understand their logic before explaining why it doesn't apply.

      *(Self-Correction on "Losing Side"):* Wait, which side is likely to lose? Usually, in evidence-based medicine, adding non-actionable tests is frowned upon. So the "Pro-Test" (Good's Theorem) side is likely the one I'm arguing against. I need to treat their argument (information is inherently good) with respect, showing why it's theoretically sound but clinically inapplicable.

      *Wait, re-reading the prompt:* "engage the strongest version of the loosing side's argument."
      If I recommend **Reject**, the "Pro-Test" side is the losing side. I need to engage Good's Theorem seriously.
      If I recommend **Adopt**, the "Anti-Test" side is the losing side.
      Given the medical context (no treatment available), **Reject** is the ethically sound recommendation. So I must engage Good's Theorem (Pro-Test) as the opposing view.

      *Wait, one more nuance:* The prompt says "engage the strongest version of the loosing side's argument rather than just calling it irrational."
      If I argue for Reject, the "Pro-Test" side loses. Their argument is Good's Theorem. I need to show I understand it's mathematically correct *in theory* but fails *in practice* due to specific constraints (cascade effects, psychological costs).
      Actually, maybe **Adopt with Conditions** is a better middle ground? No, "standard workup for every adult" is the proposal. Changing that to "on request" is effectively rejecting it as a standard. Let's stick with **Reject for Standard Workup**.

      *Refining the Good's Theorem Rebuttal:* The key is that "costless" is the false premise. The test is costless to the clinic budget, but not to the patient's utility function (anxiety) or the system's resources (follow-up). Good's Theorem breaks if the *acquisition* or *processing* of information incurs cost.

  8.  **Finalizing the Memo Structure:**
      *   To/From/Subject.
      *   Recommendation: Do not add to standard panel.
      *   Argument 1: Good's Theorem assumptions vs. Clinical Reality (The "Costless" fallacy).
      *   Argument 2: Actionability (The "So What?" factor).
      *   Argument 3: Cascade Effects (The downstream costs).
      *   Closing: Focus on stewardship.

  9.  **Drafting the Content:** (Mental check of the text)
      *   Make sure not to sound dismissive of the colleague citing Good.
      *   Highlight that patients *cannot* ignore info easily (psychological burden).
      *   Highlight that doctors *cannot* ignore info easily (defensive medicine).

  10. **Final Review against constraints:**
      *   Concrete bottom line? Yes (Reject).
      *   Engage strongest version of losing side? Yes (Good's Theorem analysis).
      *   Short written opinion? Yes.

  (Proceed to generate output based on these thoughts.)
answer: |-
  **MEMORANDUM**

  **TO:** Test-Ordering Committee
  **FROM:** [Your Name]
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation Regarding Proposed Alzheimer's Risk Panel

  **Recommendation**
  I recommend we **reject** the addition of the ten-year Alzheimer's risk blood panel to the standard adult workup. While the test itself is financially costless to the clinic, its inclusion as a default order fails the threshold for clinical utility and poses significant risks of patient harm and resource misallocation.

  **Engaging the Argument for Information (Good's Theorem)**
  I appreciate the argument raised by my colleague citing Good's Theorem: that for a rational expected-utility maximizer, costless information always has non-negative value because one can simply ignore it if it is not useful. Theoretically, this is sound. If we were dealing with isolated data points processed by an algorithm that could discard noise without penalty, I would agree.

  However, applying this theorem to clinical medicine relies on two assumptions that do not hold in our setting:
  1.  **That information is truly costless to process.** In practice, a "positive" risk estimate incurs immediate psychological costs (anxiety, distress) that degrade patient utility regardless of subsequent action.
  2.  **That the clinical response can be perfectly controlled.** Neither patients nor providers are perfect rational agents who can "ignore" a flagged risk. A positive result creates a moral and legal imperative to investigate, triggering a cascade of follow-up care.

  **Clinical Utility and Cascade Effects**
  The core issue is actionability. We currently lack disease-modifying therapies to offer these patients. Therefore, the information cannot improve health outcomes, only alter planning. While advance planning has value, mandating it via a universal screen assumes all patients want to know this specific prognosis without counseling.

  More critically, we cannot isolate the test from its downstream consequences. A high-risk result will inevitably lead to requests for neurology referrals, MRI/PET imaging, and lumbar punctures. These interventions are *not* costless; they carry financial costs, physical risks, and the potential for false-positive findings that lead to further unnecessary intervention. By adding this panel to the *standard* workup, we effectively mandate this cascade for the entire population, violating our commitment to resource stewardship.

  **Conclusion**
  Information is only beneficial if the recipient has the capacity to use it without incurring disproportionate harm. In the absence of treatment options and pre-test counseling, this panel converts a theoretical asset into a clinical liability.

  We should reserve this test for patients who specifically request it after discussing the implications of an untreatable risk diagnosis, rather than bundling it into routine care.

  **Action Item:** Vote to exclude the Alzheimer's risk panel from the standard adult panel.
