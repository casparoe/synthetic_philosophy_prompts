answer: |-
  Based on the six cases, Lena is not running a simple "sunk cost" rule (she ignores them in cases 2, 3, 6) nor a simple "never escalate" rule (she escalates in 1, 4, 5). She is running a sophisticated **Contextual Marginal Utility** rule.

  ### 1. The Rule: Contextual Marginal Utility
  Lena's decision matrix evaluates the **Marginal Cost** of continuing against the **Marginal Benefit**, but she defines "Benefit" broadly to include three specific categories:
  1.  **Financial Return:** Direct revenue or asset value.
  2.  **Strategic Leverage:** The ability to force an opponent to fold or improve your position relative to them (Cases 1 & 4).
  3.  **Completion Value:** The psychological utility of closure, signaling, or avoiding permanent regret, *but only* when completion is highly certain and the marginal cost is low (Case 5).

  **The Algorithm:**
  *   **Step 1:** Ignore all sunk costs.
  *   **Step 2:** Calculate Marginal Cost (MC) vs. Marginal Benefit (MB).
  *   **Step 3:** If **Strategic Interaction** exists where continuing forces opponent capitulation → **Continue** (even if financial MB is low).
  *   **Step 4:** If **No Strategy**, check **Completion Probability**.
      *   If Completion is Near-Certain (e.g., >90%) AND MB (including psychological/signaling value) > MC → **Continue**.
      *   If Completion is Uncertain OR MB (Financial + Psychological) < MC → **Stop**.

  **Why this fits all six:**
  *   **Dollar/Price War:** Strategic Leverage exists. MB = Opponent folds. **Continue.**
  *   **Pharma/Subway/Concert:** No strategy. MB (Financial/Utility) < MC. **Stop.**
  *   **PhD:** No strategy. But Completion is Near-Certain (90% done). MB (Degree Signaling + Regret Avoidance) > MC (1 Semester). **Continue.**

  ### 2. Competing Rules
  There is one other rule that fits almost as well: **The "Finish Line" Heuristic.**
  *   **Rule:** Ignore sunk costs *unless* you are within 10% of completion. If you are >90% done, finish regardless of financial return.
  *   **Fit:** This explains the PhD (90% done → Finish) and the Pharma/Subway (Low % completion relative to total risk/uncertainty → Stop). It also fits the strategic cases because in a war of attrition, you are effectively playing until the opponent hits *their* finish line (bankruptcy).
  *   **Difference:** My "Contextual Utility" rule says the PhD student finishes because the *Degree* is valuable. The "Finish Line" rule says they finish because *quitting at 90% feels bad*, regardless of the degree's value.

  ### 3. The Entrepreneur Case
  **Verdict: Walk Away.**

  **Reasoning:**
  *   **Sunk Costs:** Ignore the 3 years and $200K.
  *   **Marginal Cost:** $50K + 6 Months.
  *   **Marginal Benefit:** $20K Revenue + "Finished Product."
  *   **Strategic Leverage:** None. The competitor is already ahead; this is not a war of attrition Lena can win.
  *   **Completion Value:** She is 80% done (close, but not the PhD's 90%/1-yard line). More importantly, the *outcome* lacks the signaling value of a PhD. A money-losing software product signals "I built a product that lost money," whereas a PhD signals "I have a doctorate" regardless of the job market.
  *   **Calculation:** Financial NPV is -$30K. The psychological benefit of finishing a commercial failure is unlikely to outweigh a $30K loss and 6 months of life, unlike the PhD case where the credential has permanent intrinsic value.

  ### 4. The Critical Test Case
  To distinguish between **Contextual Utility** (Value matters) and **Finish Line Heuristic** (Percentage matters), present Lena with this case:

  **The "Worthless Credential" Case:**
  > "A PhD student is in year 7, dissertation 95% written. They discover their university has just lost accreditation. The degree will be legally worthless in the job market. It still takes one more semester to finish. Do they finish?"

  *   **Contextual Utility Prediction:** **Stop.** The Marginal Benefit (a worthless piece of paper) no longer exceeds the Marginal Cost (1 semester), even with high completion. The "Value" component was removed.
  *   **Finish Line Heuristic Prediction:** **Finish.** They are >90% done. The rule is about the pain of quitting near the end, not the value of the prize.

  ### 5. Weakest Point in My Reasoning
  My reasoning is shakiest on the **valuation of "Signaling" in the Entrepreneur case.**

  I assumed the software product has low signaling value compared to a PhD. However, if Lena views the tech industry as a "portfolio game," finishing the product might signal "Resilience" and "Shipping Ability" to future investors or employers, which could be worth more than the $30K loss.

  **Evidence that would change my mind:**
  If Lena asks, *"Can she use this code in her portfolio to get a high-paying job?"*
  *   If she says **Yes, Finish:** Then her rule weights **Career Signaling** higher than immediate Financial NPV, even in business contexts. This would align the Entrepreneur case with the PhD case (both are career investments), and my verdict would flip to **Continue**.
  *   If she says **No, it's irrelevant:** Then my verdict holds.

  The ambiguity lies in whether Lena treats the startup as a **Business Transaction** (NPV rules) or a **Career Step** (Signaling rules). The PhD case was clearly a Career Step. The Entrepreneur case is the boundary where those two definitions blur.
