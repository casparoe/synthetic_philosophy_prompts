  My friend Lena has a really consistent way of thinking about when to cut your losses vs. double down, but I can't quite nail down the rule she's running. Here are her verdicts on a bunch of cases:

  - Dollar auction: two people bidding for a dollar, second-highest bidder pays too. Both have bid $1.50. Lena says bid again — "the structure makes stopping a guaranteed loss and continuing a chance to only lose fifty cents."

  - A pharma company spent $80M on a drug. Clinical trials are failing. They need $20M more for a 10% chance at approval. Lena says kill the project — "the $80M is gone either way."

  - A friend bought a $200 concert ticket, now has the flu, and is dragging himself there to "not waste the money." Lena says stay home — "the money's spent, you're just adding misery to the equation."

  - Two firms in a price war, both bleeding cash. The stronger firm is deciding whether to keep matching price cuts. Lena says keep going — "it's a war of attrition, same logic as the dollar auction. If you're the one with deeper pockets, you wait them out."

  - A PhD student in year 7, dissertation 90% written, absolutely miserable, academic job market is terrible, but needs one more semester. Lena says finish — "you're at the one-yard line, you'd regret walking away forever."

  - A city spent $3B on a subway line, hit a geological problem that'll cost $500M more, and the line's projected ridership doesn't even justify the original cost. Lena says stop — "the original decision was a mistake, don't compound it."

  The dollar auction and price war cases suggest she thinks strategic interaction changes the calculus — when your continuing affects whether the other side folds, escalation can be rational. But the PhD case doesn't involve an opponent, and she still says don't walk away. And the subway case is a public project with no opponent, and she says stop. So it's not just "strategic vs. non-strategic."

  What rule or rules best fit all six verdicts? Are there multiple rules that fit equally well? What would she say about this new case: a solo entrepreneur who's spent 3 years and $200K of her own savings building a software product, about 80% done. A competitor just launched something similar but better. She could finish in 6 months with $50K more, but the product will probably earn back maybe $20K total. No investors, no cofounders, no customers who've prepaid — the only person she'd be letting down is herself. Does she finish or walk away?

  And what's the one case I should present to Lena that would best tell the competing rules apart — the case where your best-guess rule and the runner-up rule make opposite predictions?

  Also: what argument or evidence would most change your mind about which rule Lena is actually running, or about what she'd say on the entrepreneur case? I want to know where your reasoning is shakiest.
