  There is no single standard principle of aggregation that yields *exactly* all of your verdicts without contradiction, primarily because your intuitions in Case 3 and Case 4 create a tension regarding **monotonicity** (if one bad thing makes a world worse, infinitely many should make it much worse).

  However, the principle that comes closest to capturing the core structure of your ethics—specifically the asymmetry between pleasure and pain in infinite contexts—is the **Asymmetric Person-Affecting Principle** (combined with a Lexical Priority to Suffering).

  Below, I state this principle precisely, demonstrate how it handles your cases, and identify the specific verdict it cannot accommodate.

  ### The Principle: Asymmetric Person-Affecting View with Lexical Suffering

  This principle combines three rules to handle variable populations and infinite sums:

  1.  **Strong Pareto (Existing Persons):** If a change makes at least one existing person better off and no existing person worse off, the new state is better.
  2.  **Asymmetry of Existence:**
      *   Adding a person with positive welfare (a "happy" life) to a population makes **no difference** to the value of the outcome (Neutral).
      *   Adding a person with negative welfare (a "miserable" life) to a population makes the outcome **worse** (Bad).
  3.  **Lexical Priority of Suffering:** Negative welfare cannot be outweighed or "swamped" by any amount of positive welfare. The presence of suffering renders a world worse than a world without it, regardless of the total happiness elsewhere.

  ---

  ### Application to Your Cases

  **Case 1: Adding a Good Life ($\infty$ Good + 1 Good)**
  *   **Verdict:** Not Better (Indifferent).
  *   **Principle Application:** You are adding a new person with positive welfare. According to the **Asymmetry of Existence**, adding happy people is Neutral. The infinite background remains unchanged in value.
  *   **Result:** **Matches.**

  **Case 2: Relieving Agony ($\infty$ Agony $-$ 1 Agony)**
  *   **Verdict:** Better.
  *   **Principle Application:** You are improving the welfare of an *existing* person (one of the infinite sufferers) without harming anyone else. According to **Strong Pareto**, this is an improvement.
  *   **Result:** **Matches.**

  **Case 3: One Tortured in $\infty$ Happy ($\infty$ Happy + 1 Tortured vs. $\infty$ Happy)**
  *   **Verdict:** Worse.
  *   **Principle Application:**
      *   If the tortured person is *new*: The **Asymmetry of Existence** says adding a miserable person is Bad.
      *   If the tortured person is *existing* (but happy in the comparison world): **Strong Pareto** says harming them is Bad.
      *   Crucially, the **Lexical Priority of Suffering** ensures this single instance of torture makes the world worse, even against the background of $\infty$ happiness.
  *   **Result:** **Matches.**

  **Case 5: All Happy vs. All Miserable ($\infty$ Happy vs. $\infty$ Miserable)**
  *   **Verdict:** All Happy is Better.
  *   **Principle Application:**
      *   If the populations are the *same people*: **Strong Pareto** dictates the Happy world is better (everyone is better off).
      *   If the populations are *different people*: The **Asymmetry of Existence** treats the $\infty$ Happy world as Neutral (relative to void) and the $\infty$ Miserable world as Bad (infinitely bad). Neutral > Bad.
  *   **Result:** **Matches.**

  ---

  ### The Verdict It Cannot Accommodate

  **Case 4: Mixed Infinity ($\infty$ Happy + $\infty$ Miserable vs. $\infty$ Happy)**
  *   **Your Verdict:** No settled judgment (Undecided).
  *   **Principle's Verdict:** **Worse.**
  *   **Why it fails:** The principle cannot accommodate your indecision here because your own verdict in **Case 3** logically forces a "Worse" judgment in **Case 4**.
      *   In Case 3, you affirmed that **one** tortured person makes an infinite happy world *worse*. This establishes that suffering has lexical priority and is not swamped by infinite happiness.
      *   In Case 4, you have **infinitely many** tortured people. If one tortured person makes the world worse, consistency (monotonicity) demands that infinitely many tortured people make the world *significantly* worse.
      *   The **Asymmetric Person-Affecting Principle** respects this consistency: it sums the "badness" of the miserable lives. Since adding one is bad, adding $\infty$ is infinitely bad. Therefore, it concludes the Mixed World is strictly worse than the Happy World.

  ### Conclusion
  The **Asymmetric Person-Affecting Principle** captures your refusal to value adding happy lives (Case 1), your commitment to relieving existing pain (Case 2), and your intuition that suffering taints a world regardless of total happiness (Cases 3 & 5).

  However, it cannot accommodate your **indecision in Case 4**. Your hesitation there suggests a suspicion that the two infinities might cancel out or become incomparable, but this contradicts your Case 3 intuition that suffering cannot be swamped by happiness. To accommodate Case 4, you would need to abandon the Lexical Priority of Suffering that makes Case 3 work.
