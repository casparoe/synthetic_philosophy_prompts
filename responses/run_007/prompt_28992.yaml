  A better dangerous question targets the *grounding*. "If a human loses the capacity, do they lose status?" If yes -> horrific implication. If no -> then capacity isn't the ground, so why use it for animals? This is the "Marginal Cases" trap but sharper. Let's make that the dangerous one, or the "Implementation" one. The "Implementation" one is more dangerous for *this* audience (Welfare Scientists). Let's go with the Implementation/Policy consequence one because it unites the Phils (consistency) and Scientists (policy) against the speaker.
