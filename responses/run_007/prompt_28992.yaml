      *(Refining the "Dangerous Question"):* It needs to be something that collapses the distinction between "evidential" and "intrinsic" or forces an admission that makes the view speciesist or impractical. The best one is usually about *implementation*: "If we follow your advice today, which specific species currently protected lose protection?" That forces a political commitment the philosopher might not want to make. Or, "Is a human infant's status contingent on their brain developing?" Let's go with the implementation/protection loss question, as it targets the Welfare Scientists' core fear.

  5.  **Final Review against Constraints:**
