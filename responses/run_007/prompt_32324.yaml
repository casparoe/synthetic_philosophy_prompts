answer: |-
  I reject step (1), the Person-Affecting Principle, at the cost of accepting that actions can be wrong without harming any particular person, which requires adopting impersonal moral principles that generate new paradoxes in population ethics.

  Step (1) asserts that wrongdoing is strictly tied to making a specific individual worse off than they would otherwise have been. This principle collapses in identity-affecting choices because the alternative for the child with the condition is nonexistence, not a healthy life. Since a life worth living is better than nonexistence, the child is not harmed relative to their only alternative. To avoid the absurd conclusion that causing preventable suffering is permissible, we must abandon the restriction that wrongness requires harm to a specific identifiable victim. This shifts the ground of morality from individual claims to impersonal values: an act is wrong because it brings about a worse state of affairs, not because it violates a duty owed to a specific person.

  The cost of this rejection is significant theoretical complexity. By embracing impersonal principles, we must account for the value of outcomes independently of who occupies them, which leads to notorious problems in population ethics like the Repugnant Conclusion. We are forced to admit that we can "wrong" someone without making them worse off than they would otherwise have been, severing the intuitive link between wronging and harming. Furthermore, we lose the explanatory power of person-affecting views, which neatly align moral obligations with the interests of existing or future specific individuals, and instead must navigate comparisons between different possible populations where no single person exists in both scenarios.

  Rejecting step (3) is metaphysically implausible because different conception times necessarily involve different gametes, resulting in numerically distinct individuals; denying this requires an untenable view of personal identity. Accepting step (6) is morally untenable because it implies parents have no reason to prefer healthy children over those with severe disabilities provided life remains worth living, undermining basic intuitions about parental responsibility and the value of health. Therefore, despite the theoretical costs to population ethics, rejecting the Person-Affecting Principle is the only viable path to preserving the judgment that causing preventable suffering is wrong.
