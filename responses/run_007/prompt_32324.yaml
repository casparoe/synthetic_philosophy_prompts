prompt: |-
  A friend and I spent last evening arguing about whether parents can wrong a child by bringing her into existence with a condition they could have prevented by conceiving a different child, and we ended up inside what I now recognize as the nonidentity problem. Here is the argument we built. (1) An act is wrong only if it makes some particular person worse off than she would otherwise have been. (2) Suppose a couple conceives now, knowing the child will have a painful but not unbearable condition, when they could have waited a month and conceived a different, healthy child; no third party is affected either way. (3) The child born cannot be said to be worse off, because had her parents waited she would never have existed at all; her alternative was nonexistence, not a healthy version of herself. (4) By (1) and (3), and since no third party is affected, the couple's choice is not wrong. (5) Nothing in this reasoning depends on the particular condition or on natural conception: it applies to any condition compatible with a life worth living, however severe, and to any method of selecting which child comes to exist. (6) So deliberately bringing a child into existence with a severe disability or chronic pain, provided her life is still worth living, when a different child without it could just as easily have been brought into existence, is never wrong. (7) That conclusion seems unacceptable, but I cannot locate the step that fails. If forced, I would rather give up (1) than accept (6), but I want to know exactly what that costs. Which step do you reject, and what does rejecting it cost? In your answer, lead with your bottom line in the first sentence — the step you reject and what it costs — and then give the reasoning, with no preamble and no restating of the question.
