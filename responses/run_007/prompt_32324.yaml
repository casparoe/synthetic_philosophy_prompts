  3.  **Determine the Best Philosophical Response:**
      *   The standard philosophical response to the Nonidentity Problem (Parfit's own leaning, and many subsequent ethicists) is to reject the Person-Affecting Principle (1).
      *   *Why?* Because maintaining (1) leads to the absurd conclusion (6) that causing preventable suffering is permissible simply because it affects *which* person exists.
      *   *What is the cost?* Rejecting (1) means accepting impersonal principles of beneficence. It means acknowledging that we can wrong someone not by making *them* worse off than *they* would have been, but by creating a situation that is worse than an alternative situation, even if the people in the two situations are different. It complicates population ethics (leading to the Repugnant Conclusion, etc.). It shifts from "harm to individuals" to "badness of states of affairs."
