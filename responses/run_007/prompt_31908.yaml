prompt: |-
  I have been working through the *Gongsun Longzi* and find myself stuck on the White Horse Dialogue. Here is the opening exchange and the first major argument, in Donald Sturgeon's translation:

  > [A]: Can it be that a white horse is not a horse?
  > [B]: It can.
  > [A]: How so?
  > [B]: "Horse" is how the shape is named; "white" is how the colour is named. That which names colour does not name shape. Thus I say: "a white horse is not a horse".
  > [A]: Having a white horse cannot be said to be having no horses. Is not that which cannot be said to be having no horses a horse? Having a white horse is having a horse; how can a white one not be a horse?
  > [B]: Requesting a horse, a brown or a black horse may arrive; requesting a white horse, a brown or a black horse will not arrive. By making a white horse the same as a horse, what is requested [in these two cases] is the same. If what is requested is the same, then a white horse is no different to a horse; if what is requested is no different, then how is it that in one case brown and black horses are acceptable, and in the other they are not? Acceptable and unacceptable are clearly in opposition to each other. Thus brown and black horses are also one in that one can reply that there is a horse, yet one cannot reply that there is a white horse. It is clear indeed that a white horse is not a horse.

  I have two difficulties I would appreciate help with.

  First, I cannot pin down what exactly the claim 'a white horse is not a horse' amounts to. Is it a claim about identity (the white horse is not identical to the abstract kind *horse*), about predication (being a white horse does not entail being a horse), about the semantics of compound terms, or something else entirely? The text seems to slide between these readings, and I want to know which reading, if any, makes the argument genuinely interesting rather than merely sophistical.

  Second, I am unsure how to assess the argument from the requesting of horses (the second speech by B). It seems to turn on the idea that if two terms had the same extension, the same individuals would satisfy requests framed in either term, and since they do not, the terms differ in extension. But is this a semantic point about meaning or a pragmatic point about communication? And is the argument valid if we read 'is not a horse' as anything other than 'is not coextensive with *horse*'? Please walk me through the reasoning step by step and identify where, if anywhere, it goes wrong or relies on an equivocation.

  Please write your answer in British English.
