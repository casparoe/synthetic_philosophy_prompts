answer: |-
  1. **Essay Question**

  Dennett argues that Darwin and Turing both demonstrated "competence without comprehension" via a "strange inversion of reasoning." However, critics allege structural asymmetries: enactivists cite immanent teleology in biology, while philosophers of computer science argue computation merely relocates comprehension to the programmer. Evaluate the strength of Dennett's parallel. Does either objection successfully demonstrate that Turing's inversion differs fundamentally from Darwin's? Assess whether Dennett can accommodate these critiques without abandoning the claim that both inversions are genuinely analogous explanations of design.

  2. **Model Answer**

  Dennett's central thesis in *From Bacteria to Bach and Back* is that Darwin and Turing independently discovered that design requires no designer. Darwin showed natural selection produces adaptive competence without foresight; Turing showed mechanical manipulation produces computational competence without understanding. Both invert the intuition that comprehension must precede competence. This "strange inversion" suggests that mindless processes can generate the appearance of intelligence. However, maintaining this parallel requires navigating significant objections regarding the source of norms and teleology.

  The philosopher of computer science objects that Turing's inversion is incomplete. While the machine lacks comprehension, the programmer possesses it. The machine's symbols are only meaningful relative to the programmer's interpretation and design. Thus, comprehension is not eliminated but merely relocated to the system's exterior. Dennett counters this by arguing that the programmer's comprehension is itself composed of sub-personal competences. Through homuncular decomposition, the "smart" programmer is analyzed into dumb subsystems until no understanding remains. This leads to Dennett's concept of the "User Illusion," where consciousness is a simplified interface hiding the mechanical competence below. If human comprehension is ultimately grounded in mechanical competences, the relocation objection fails to identify a fundamental asymmetry. However, this relies on the contested materialist assumption that human understanding is fully reducible to mechanical processes without residue. If the programmer's mind is not just a machine, the analogy breaks.

  The enactivist objection strikes deeper at the biological side. Enactivists argue living systems possess immanent teleology: norms are intrinsic to the organism's self-maintenance (autopoiesis). A bacterium acts *for itself* to survive in a way a Turing machine never does. A machine's goals are always extrinsic, assigned by a user. If biological competence involves intrinsic norms while computational competence involves only derived norms, the inversions are structurally distinct. Darwin explains intrinsic purpose; Turing explains extrinsic utility. This suggests that while both remove a *supernatural* designer, Darwin leaves a natural teleology that Turing does not. The enactivist claims that without this immanent normativity, you do not have life, only mechanism.

  Can Dennett handle this without abandoning the parallel? To preserve the analogy, Dennett must treat biological teleology as "as-if" purpose until genuine comprehension evolves. He argues that free-floating rationales exist before minds. The enactivist rejects this, claiming norms exist from the start of life due to metabolic closure. If the enactivist is right, Darwin's inversion explains something Turing's cannot: the emergence of intrinsic value. Dennett might respond that intrinsic value is an illusion created by complex competence, but this risks begging the question against the enactivist. It implies that the "meaning" in biology is no more real than the "meaning" in a computer, which contradicts the lived experience of agency. This touches on the core course theme: is meaning intrinsic or assigned?

  Ultimately, the parallel holds methodologically but falters ontologically. Both inversions demonstrate bottom-up design, satisfying the explanatory goal of removing the need for a skyhook. However, if biological systems exhibit immanent teleology that computational systems lack, the *kind* of competence differs. Dennett can save the structural parallel only by insisting that all teleology is ultimately derived from mindless processes, a claim that remains fiercely contested in philosophy of biology. Therefore, while the inversions are analogous in explaining complexity, they are not identical in explaining normativity. A strong defense of Dennett requires showing why intrinsic norms are unnecessary for design, not just asserting they are absent. The student must recognize that Dennett's project depends on flattening the distinction between life and machine, a move critics find reductive. This suggests that while the "Mechanism" is shared, the "Mind" and "Meaning" aspects may diverge between the two cases, implying cognitive science cannot simply model the mind on the Turing machine without accounting for biological embodiment.

  3. **Marking Scheme**

  **Total Marks: 25**

  | Move / Insight | Marks | A-Level Execution | B-Level Execution |
  | :--- | :---: | :--- | :--- |
  | **1. Definition of Inversions** | 5 | Clearly defines both inversions as "competence without comprehension" and explains the "mindless process" mechanism for each. | Defines terms vaguely or conflates competence with comprehension; fails to specify the mindless mechanism. |
  | **2. CS/Programmer Objection** | 5 | Explains the "relocation of comprehension" critique and details Dennett's homuncular/User Illusion response. | Summarizes the objection but fails to articulate Dennett's specific counter-argument regarding sub-personal competence. |
  | **3. Enactivist/Teleology Objection** | 5 | Distinguishes between *immanent* (intrinsic) and *derived* (extrinsic) teleology/norms as the core asymmetry. | Mentions enactivism but treats it as a general "life is different" claim without specifying the normative structure. |
  | **4. Critical Evaluation** | 5 | Evaluates whether Dennett can save the parallel (e.g., by flattening teleology) and identifies the cost of doing so. | Takes a side without justification or simply repeats Dennett's view as the correct conclusion. |
  | **5. Settled vs. Contested** | 5 | Explicitly distinguishes exegesis (what Dennett says) from ontology (whether biological norms are real); notes contested status. | Presents Dennett's materialist reduction as settled fact; fails to acknowledge the philosophical dispute. |

  **Common Mistakes & Penalties**

  *   **Confusing Competence and Comprehension:** Treating these as synonymous rather than distinct layers of capability. **(–3 marks)**
  *   **Ignoring One Objection:** Failing to engage substantively with either the CS or Enactivist critique. **(–5 marks)**
  *   **Treating Dennett as Truth:** Writing as if Dennett's view is the consensus rather than a contested philosophical position. **(–2 marks)**
  *   **Vague Conclusion:** Failing to offer a verdict on the structural symmetry of the inversions. **(–2 marks)**

  \answer{The question tests the student's ability to critically evaluate the structural symmetry of Dennett's naturalistic explanations against competing philosophical accounts of teleology and meaning.}
