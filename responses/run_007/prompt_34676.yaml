  IIT assigns the higher value to the slab because $\Phi$ quantifies the irreducibility of the system's cause-effect structure, irrespective of extrinsic function. The slab's expander topology ensures that every mechanism constrains the past and future states of the system significantly, generating a large Maximally Irreducible Conceptual Structure (MICS). Conversely, the human brain during automatised tasks relies on modular segregation; information flows efficiently without requiring global integration, meaning the system is more reducible because cutting connections between modules loses little information. The specific formal feature driving this verdict is the **Intrinsic Existence Postulate**, which dictates that consciousness depends solely on the internal causal power of the system, disregarding whether that causation supports adaptive behaviour or environmental interaction.

  An IIT defender would likely bite the bullet, asserting that the slab is indeed more conscious than the automatised human, albeit conscious of a homogeneous, unstructured 'buzz' rather than differentiated content. They would argue that our intuition conflates consciousness with cognitive access or reportability, whereas IIT isolates the phenomenological substrate itself. The cost is significant: it severs the link between consciousness and evolutionary function, implying that a useless, inert blob of tissue could be more conscious than a functioning human, provided its wiring is sufficiently dense. They might attempt to redescribe the case by claiming the human's 'background' consciousness remains high, but this struggles if the task truly demands modular isolation, forcing them to accept that consciousness can exist in the absence of any coherent experience or agency.
