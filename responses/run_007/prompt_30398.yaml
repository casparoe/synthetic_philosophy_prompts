answer: |-
  # Session Plan: Policy Selection Across Counterfactual Branches

  ## 1. Carrying Scenario and Constraints
  **Choice:** Retain the standard Parfitian Coin Flip (Omega, fair coin, $100 loss on Tails if you pay, $10,000 gain on Heads if you would have paid on Tails).
  **Justification:** Variants involving logical uncertainty (like XOR) introduce noise too early. The coin flip isolates the temporal/counterfactual tension without requiring the group to grapple with logical subjunctives immediately.
  **Required Features:**
  *   **Must Lack:** Any observable correlation between the agent's action and the coin state *within the observed branch*. If there is a trace in the physical world linking payment to the coin outcome (as in Newcomb's boxes), the problem collapses into evidential decision theory.
  *   **Must Lack:** Repeated interaction or reputation mechanics. This must be a one-shot encounter to prevent the group from solving it via iterated game theory (tit-for-tat) rather than single-shot decision theory.
  *   **Must Have:** Explicit confirmation that Omega's prediction is based on the agent's source code or dispositional algorithm, not on a signal sent after the coin lands.

  ## 2. Session Sequence and Dependencies

  **Phase 1: The Trap (20 minutes)**
  *   **Introduce the Scenario:** Present the Coin Flip case cleanly.
  *   **Initial Vote:** Ask for a show of hands: "You are in the Tails branch. Omega asks for $100. Do you pay?"
  *   **Dependency:** Do **not** introduce precommitment yet. Allow the Causal Decision Theory (CDT) intuition to solidify.
  *   **Causal/Evidential Sharpening:** When the group argues, explicitly ask: "Does paying causally influence the coin toss?" This sharpens the distinction: CDT says no (causal graph is cut), EDT says yes (evidential correlation via Omega).
  *   **XOR Placement:** Hold XOR Blackmail back. It belongs in Phase 3 as a stress test. Introducing it now conflates physical prediction with logical correlation.

  **Phase 2: The Turn – Precommitment and Policy (25 minutes)**
  *   **Introduce Precommitment:** Only *after* the initial vote, rewind the timeline. Ask: "Before the coin was flipped, would you want to be the sort of agent who pays on Tails?"
  *   **Dependency:** Precommitment must be framed as selecting a **policy** (a mapping from states to actions) rather than selecting an **act** (a specific move in a specific state).
  *   **Conceptual Shift:** Move the evaluation metric from "Expected Utility of this Action given I am in Tails" to "Expected Utility of this Policy before the Coin is Flipped".
  *   **Handling the 'Coin Landed' Intuition:** Do not dismiss the objection that "the coin has already landed" as an error. Acknowledge it as the correct intuition for *act-based* evaluation. The conflict is not about the state of the coin, but about whether rationality evaluates the act or the policy. You must validate the CDT stance as internally consistent for act-optimisers, then argue why policy-optimisation is the superior standard for this class of problem.

  **Phase 3: The Stress Test – XOR Blackmail (25 minutes)**
  *   **Introduce XOR Blackmail:** Present the termite infestation case (Letter arrives iff (Termites XOR Pay)).
  *   **Purpose:** Use this to test if they have grasped the policy concept. If they understand Counterfactual Mugging, they should see XOR Blackmail as structurally identical regarding policy selection, despite the logical rather than physical prediction.
  *   **Dependency:** This only works if Phase 2 successfully established that we care about the policy's performance across counterfactuals (World with Termites vs. World without), not just the observed branch.
  *   **Misconception Head-off:** If they claim XOR proves paying is always wrong, point out that the policy 'Pay if Asked' loses money in XOR but wins in Mugging. The lesson is not "always pay", but "select the policy that wins across the distribution of problems you expect to face".

  **Phase 4: Synthesis and Check (20 minutes)**
  *   **Consolidate:** Summarise that the 'rational agent' is defined by the algorithm they run, not the output of that algorithm in a single instance.
  *   **Omissions:** Explicitly state what you are leaving out. Do not attempt to formalise Functional Decision Theory (FDT) or Updateless Decision Theory (UDT) mathematically. Do not resolve the debate on whether logical correlations in XOR blackmail are 'real' enough to count. State: "We are stopping at the conceptual level of policy selection; we are not solving the metaphysics of logical counterfactuals today."
  *   **The Check Question:** Put this to the group: "If Omega replaces the coin with a deterministic hash of your source code that you cannot compute, but Omega can, does the argument that 'the outcome is already fixed' justify refusing to pay?"
      *   *Correct Understanding:* Recognising that even if deterministic, the agent does not know the output, and the policy selected determines the output.
      *   *Incorrect Understanding:* Insisting that because it is deterministic, action is futile (confusing metaphysical determinism with epistemic decision-making).

  ## 3. Misconception Map

  | Objection | Order of Appearance | Point to Head Off | Strategy |
  | :--- | :--- | :--- | :--- |
  | **"The coin has already landed."** | Immediately after Phase 1 setup. | **Phase 2 (The Turn).** | Do not argue physics. Agree the state is fixed. Argue that rationality evaluates the *disposition* that led to the state, not the reaction to it. |
  | **"This is just Newcomb's Problem."** | During Phase 1 debate. | **Phase 1 (Introduction).** | Clarify immediately: In Newcomb, the box content is correlated with your act. In Mugging, the payout is correlated with your *disposition*, but your act in the Tails branch has no evidence-bearing link to the Heads branch. |
  | **"Never negotiate with muggers."** | During Phase 2 (Precommitment). | **Phase 2 (Policy Shift).** | Distinguish moral heuristics from decision theory. Frame it as: "If you can bind yourself to a policy, would you bind yourself to 'Pay' or 'Don't Pay'?" |
  | **"XOR Blackmail proves paying is irrational."** | During Phase 3. | **Phase 3 (Stress Test).** | Clarify that XOR is a different problem distribution. The lesson is not "Pay Muggers", but "Optimise policies for the class of problems where prediction depends on your algorithm." |

  ## 4. Handling the 'Coin Landed' Intuition
  You must treat the "coin has already landed" objection as the foundational intuition of Causal Decision Theory, not as a simple mistake. If you dismiss it, the CDT proponents in your group will disengage.
  *   **Approach:** Concede that *conditional* on being in the Tails branch, paying has no causal effect.
  *   **Pivot:** Argue that rationality should not condition on being in a branch *before* selecting the policy. The agent exists before the coin flip. Therefore, the evaluation point must be *ex-ante*, not *ex-post*.
  *   **Phrasing:** "You are correct that paying changes nothing *now*. The question is whether you wish you were the sort of person for whom paying was inevitable, such that Omega would have predicted it."

  ## 5. What to Leave Out
  Explicitly tell the group: "We are not going to solve the metaphysics of counterfactuals today. We are not deciding whether the counterfactual world 'exists'. We are deciding which decision algorithm yields higher utility over a lifetime of such problems. We are also not distinguishing between TDT, FDT, and UDT; treat them as a single cluster of 'Policy-Based Decision Theory' for this session."

  Summary: The session argues that rationality requires selecting policies that win across counterfactual branches, not merely actions that optimise within the observed branch.
