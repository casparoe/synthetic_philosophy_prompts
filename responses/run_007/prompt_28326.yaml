      *   *Status:* They are not known (Wittgenstein explicitly says "I know" is misapplied here). They are animal certainties, enacted rather than stated.
      *   *Justification:* They are groundless. Not because they are self-evident, but because asking for grounds makes no sense *within* the system they support.
      *   *Change:* Hinges can change over time (riverbed metaphor), but slowly.
