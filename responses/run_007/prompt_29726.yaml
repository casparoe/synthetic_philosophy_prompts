answer: |-
  ## Executive Summary

  Evidential Cooperation in Large Worlds (ECL) suggests that in a vast universe, your decisions provide evidence about the decisions of other agents who reason similarly to you. If you cooperate (e.g., fund a public good), evidentially correlated agents likely will too, potentially multiplying your impact.

  However, ECL is philosophically contested and prone to abuse. For a foundation board, relying on it requires rigorous safeguards. The following procedure is designed to be completed in **≤2 hours** per grant. It prioritizes **causal impact** as the baseline and treats ECL as a potential multiplier only under strict conditions.

  ---

  # The ECL Grant Assessment Procedure

  ## Phase 1: Applicability Screen (30 Minutes)
  *Goal: Determine if ECL reasoning is theoretically relevant. If this phase fails, stop. Do not apply ECL.*

  **1.1 The Large World Condition**
  *   **Question:** Does the success of this grant meaningfully depend on the universe being sufficiently large (or the future being sufficiently long) for many correlated agents to exist?
  *   **Check:** Is this an existential risk (x-risk) or long-term trajectory change grant?
  *   **Decision:**
      *   If **NO** (e.g., direct aid, near-term policy): ECL is negligible. Proceed with standard Cost-Effectiveness Analysis (CEA) only.
      *   If **YES**: Proceed to 1.2.

  **1.2 The Causal Substitution Test**
  *   **Question:** Can the desired coordination be achieved through causal mechanisms (communication, contracts, public signaling)?
  *   **Check:** Could you achieve the same outcome by calling peer funders, publishing a report, or forming a coalition?
  *   **Decision:**
      *   If **YES**: Prioritize causal leverage. ECL is redundant. Only proceed if causal channels are exhausted or impossible.
      *   If **NO** (e.g., coordination with future agents, AI systems, or non-communicating peers): Proceed to 1.3.

  **1.3 The Decision-Algorithm Link**
  *   **Question:** Is there a plausible mechanism by which your decision provides *evidence* about others' decisions?
  *   **Check:** Do the other agents share your source code (reasoning processes, data, values)?
  *   **Decision:**
      *   If **NO** (e.g., actors with fundamentally opposed values): ECL does not apply.
      *   If **YES**: Proceed to Phase 2.

  > **⚠️ Judgment Call Flag:** Assessing "shared reasoning" is subjective. Document *why* you believe the other agents reason like you (e.g., "They are trained in the same effective altruism framework").

  ---

  ## Phase 2: Correlation & Multiplier Estimation (45 Minutes)
  *Goal: Estimate the "ECL Multiplier" conservatively.*

  **2.1 Define the Reference Class**
  *   **Task:** Identify the specific group of agents correlated with you.
  *   **Options:**
      *   *Terrestrial Peers:* Other GCR foundation officers.
      *   *Future Successors:* Future generations of funders.
      *   *Cosmic Peers:* Agents in other parts of a large universe/multiverse (High uncertainty).
  *   **Constraint:** You must select the *narrowest plausible* reference class. Do not default to "all rational agents."

  **2.2 Estimate Correlation Strength ($r$)**
  *   **Task:** Estimate the probability that a peer makes the same decision given that you do.
  *   **Scale:**
      *   $r = 0.0$: No correlation (Independent).
      *   $r = 0.5$: Weak correlation (Shared data, different values).
      *   $r = 0.9$: Strong correlation (Shared values, data, and reasoning).
      *   $r = 1.0$: Perfect correlation (Identical agents).
  *   **Safeguard:** Default to $r \leq 0.5$ for terrestrial peers unless you have evidence of tight coupling. Default to $r \approx 0$ for cosmic peers unless you are funding decision theory itself.

  **2.3 Calculate the ECL Multiplier ($M$)**
  *   **Formula:** $M = 1 + (N \times r)$
      *   $1$ = Your causal impact.
      *   $N$ = Number of correlated agents (excluding you).
      *   $r$ = Correlation strength.
  *   **Cap:** For board recommendations, cap $M$ at **5x** unless the grant is specifically about reducing ECL uncertainty.
      *   *Reasoning:* Multipliers >5x rely on speculative metaphysics that are not defensible to a board.

  > **⚠️ Judgment Call Flag:** Estimating $N$ and $r$ is not mechanical. You must write a "Confidence Interval" for your multiplier (e.g., "We estimate 2x–4x, using 3x for the recommendation").

  ---

  ## Phase 3: Double-Counting & Consistency Check (30 Minutes)
  *Goal: Ensure ECL isn't inflating impact artificially.*

  **3.1 The Causal/Evidential Exclusivity Rule**
  *   **Rule:** You cannot count *both* the causal impact of influencing others *and* the evidential impact of correlating with them.
  *   **Check:** Did you include "leveraging other funders" in your baseline CEA?
  *   **Action:** If yes, set ECL Multiplier to 1.0. You must choose one model.
      *   *Recommendation:* Prefer the Causal model for terrestrial grants. It is more defensible. Use ECL only when causal leverage is impossible.

  **3.2 The "Reverse Cause" Test**
  *   **Task:** Apply the exact same ECL logic to a cause area you *disprefer* or consider neutral.
  *   **Example:** If you argue ECL justifies funding AI Safety because "other rational agents will do the same," would it also justify funding Art Preservation if other rational agents value it?
  *   **Action:** If the logic breaks down or feels inconsistent, you are motivated reasoning. Reset Phase 2.

  ---

  ## Phase 4: Final Recommendation & Communication (15 Minutes)
  *Goal: Translate the analysis into a board-ready memo.*

  **4.1 The "Translation" Filter**
  *   **Decision:** How will this be presented to the Board?
  *   **Option A (Internal Only):** Use ECL to break a tie between two high-uncertainty GCR options. Do not mention ECL in the memo; frame it as "strategic complementarity."
  *   **Option B (External):** Mention ECL only if the Board is sophisticated in decision theory. Otherwise, translate ECL multipliers into "probability of ecosystem-wide adoption."
  *   **Safeguard:** Never present a Cosmic ECL multiplier (>10x) as fact. Present it as a "sensitivity case."

  **4.2 Final Sign-Off**
  *   **Checklist:**
      *   [ ] Causal impact stands on its own (ECL is a bonus, not the foundation).
      *   [ ] Reference class is documented.
      *   [ ] Double-counting check passed.
      *   [ ] Reverse Cause Test passed.

  ---

  # Concrete Applications of the Procedure

  ## Case 1: The "Tempting but Rejected" Case
  **Grant Proposal:** $2M for distributing insecticide-treated bed nets in a high-malaria region.
  **Initial Intuition:** "This is high impact. If we fund this, other foundations will see it's cost-effective and follow suit. ECL multiplier!"

  **Applying the Procedure:**
  1.  **Phase 1 (Applicability):**
      *   *Large World Condition:* **FAIL.** Saving lives now does not depend on the universe being large, nor does it significantly alter the long-term trajectory that unlocks large worlds.
      *   *Causal Substitution:* **FAIL.** You can causally signal to other funders via public reports.
  2.  **Decision:** **Stop.** Do not apply ECL reasoning.
  3.  **Rationale:** Applying ECL here is double-counting. If other funders follow, it is because of *causal signaling* (they see your data), not *evidential correlation* (they reason like you in isolation). Using ECL inflates the impact artificially.
  4.  **Outcome:** Grant evaluated on standard CEA only.

  ## Case 2: The "Uncomfortable but Accepted" Case
  **Grant Proposal:** $3M for AI Governance Research (focusing on informal norms among labs).
  **Initial Intuition:** "This feels fuzzy. How do we measure success? It relies on labs voluntarily cooperating without contracts. It feels risky to fund 'hopes'."

  **Applying the Procedure:**
  1.  **Phase 1 (Applicability):**
      *   *Large World Condition:* **PASS.** AI safety is an x-risk issue; success unlocks the long-term future.
      *   *Causal Substitution:* **FAIL.** Formal treaties are currently impossible. We rely on lab leaders making similar risk assessments independently.
      *   *Decision-Algorithm Link:* **PASS.** Lab leaders share similar technical data and safety training.
  2.  **Phase 2 (Multiplier):**
      *   *Reference Class:* Leaders of top 10 AI labs. ($N=9$).
      *   *Correlation:* Moderate ($r=0.4$). They have different incentives but similar data.
      *   *Multiplier:* $1 + (9 \times 0.4) = 4.6$. Capped at **4x** for prudence.
  3.  **Phase 3 (Safeguards):**
      *   *Double-Counting:* Baseline CEA counts only the direct research output. ECL counts the *adoption* of norms by others. No overlap.
      *   *Reverse Test:* Would this apply to risky AI development? No, because the "cooperation" value is asymmetric (safety is a public good, speed is a competitive good).
  4.  **Outcome:** **Proceed.** The ECL reasoning validates the grant despite low direct causal leverage.
  5.  **Board Communication:** Do not use the term "ECL." Frame as: "This research creates focal points for coordination. Given the shared epistemic environment of lab leaders, adoption of these norms is likely to be correlated across the industry, amplifying impact beyond direct uptake."

  ## Case 3: The "Standard Accept" Case
  **Grant Proposal:** $1M for Meta-Research on Decision Theory and Cooperation.
  **Initial Intuition:** "This directly improves our ability to use ECL. It feels circular but correct."

  **Applying the Procedure:**
  1.  **Phase 1:** **PASS.** This grant directly increases $r$ (correlation strength) and clarifies the "Large World" assumptions for all future agents.
  2.  **Phase 2:**
      *   *Multiplier:* Hard to estimate, but the *value of information* is high.
      *   *Adjustment:* Instead of a multiplier on *this* grant, treat this as increasing the multiplier for *future* grants.
  3.  **Phase 3:** No double counting. This is infrastructure.
  4.  **Outcome:** **High Priority.** This is the one case where explicit ECL reasoning is most defensible, as the grant object *is* the ECL mechanism itself.

  ---

  # Limitations: What This Procedure Cannot Do

  **1. It Cannot Resolve Metaphysical Uncertainty**
  The procedure assumes the "Large World" hypothesis is worth acting on. It cannot prove the multiverse exists. If your Board rejects the premise that the universe is large enough for ECL to matter, the procedure's output (Phase 1) will always be "Not Applicable."

  **2. It Cannot Prevent "Reference Class Gaming"**
  A determined motivated reasoner can always widen the reference class ($N$) or inflate correlation ($r$) to get their desired multiplier. The "Reverse Cause Test" mitigates this, but it relies on the officer's honesty.
  *   *Mitigation:* Require a second reviewer to audit the Reference Class definition.

  **3. It Cannot Quantify "Acausal Trade" with Hostile Agents**
  ECL works best with agents who share values (cooperation). It is much weaker for agents with opposing goals (acausal trade). This procedure is biased toward cooperative scenarios. If you are dealing with adversarial actors (e.g., rogue states), ECL reasoning is likely invalid and dangerous.

  **4. It Is Not a Substitute for Causal Due Diligence**
  A grant with a 5x ECL multiplier but 0% chance of causal success is still a bad grant. ECL is a multiplier, not a base. If the base is zero, the product is zero. The procedure explicitly requires the causal baseline to be positive (Phase 4.2).

  **5. Institutional Defensibility**
  Even if the math works, "We funded this because of evidential correlation with agents in other galaxies" is not a defensible public position. The procedure helps you *think* clearly, but Phase 4 requires you to *translate* that thinking into standard strategic language for the Board. Do not skip the translation step.

  ---

  # Implementation Note for the Program Officer

  When presenting this to your team, emphasize that **ECL is a tie-breaker, not a driver.**
  *   **Standard:** Causal Impact > $X$.
  *   **ECL Bonus:** If Causal Impact $\approx$ Y (where Y is close to X), and ECL Multiplier > 1, then Fund.

  This prevents the team from chasing "magic multipliers" on weak projects while allowing you to capture the upside of high-leverage coordination opportunities that standard CEA misses.
