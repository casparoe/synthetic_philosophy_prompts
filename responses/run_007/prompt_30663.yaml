  By rejecting (3), the parity argument in (5) collapses. The evidence is not the same in kind. For humans, the evidence is Behavior + Biological Causal Structure. For AI, it is Behavior + Computational Architecture. If consciousness requires specific causal powers (e.g., integrated information, embodied grounding) that current silicon architectures lack, then behavioral indistinguishability is insufficient for AI, even if it is sufficient for humans (because you assume the human substrate supplies the missing causal powers).

