      *   *Standard Interpretation:* Wittgenstein is *not* saying religious claims have *no* truth value. He is saying their *grammar* is different from scientific hypotheses. He warns against assimilating religious grammar to scientific grammar. However, he doesn't explicitly deny that believers *think* they are stating facts.
