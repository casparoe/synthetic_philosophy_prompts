prompt: |-
  So two people in my reading group got into a long argument about Wittgenstein's lectures on religious belief, and neither would back down. One of them, Dana, was defending the idea that when Wittgenstein says religious belief isn't a hypothesis, he's making a point about how the belief actually functions: a person who believes in the Last Judgment doesn't hold it as a prediction that might be confirmed or disconfirmed, but as a picture that structures how they live, what they hope, what they fear. She said that's why arguing with a believer about whether there's enough evidence for God usually feels so pointless — your not even playing the same game. The other, Marcus, said that's exactly the problem: if religious beliefs aren't hypotheses, then they can't be true or false, and if they can't be true or false then they're not really beliefs at all, just attitudes or practices. He said Dana's reading makes religion unfalsifiable in a way that would be intellectually scandalous for any other area of life. Dana came back with: being unfalsifiable isn't the same as being meaningless, and anyway, plenty of our deepest commitments — like the conviction that the world won't suddenly turn into a cartoon, or that human life is worth going on with — aren't held as hypotheses either, but that doesn't make them empty. Marcus said those are examples of things we don't question because they're so well-confirmed, not because they're outside the game of evidence. Dana said no, they're not well-confirmed in the ordinary sense; they're the background against which confirmation happens at all. Marcus said she was smuggling religious belief into a category where it can't be criticized, which is just special pleading. They asked me to referee, and I honestly don't know who's right. Can you go through their exchange move by move and say who's right about what, and whether either of them is misreading Wittgenstein in a way that matters?
