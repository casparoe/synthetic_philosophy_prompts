answer: |-
  The box provides a passable introduction to the logical structure of the Frege–Geach problem but is seriously misleading regarding the current status of expressivism and the sophistication of contemporary quasi-realist solutions.

  The summary accurately captures the basic intuition of the problem: moral sentences appear in embedded contexts (like conditionals) where the speaker does not seem to be expressing the same attitude as in asserted contexts. However, it simplifies the technical stake. The problem isn't merely that "no disapproval is expressed" in a conditional; it is that logical validity (specifically *modus ponens*) seems to break down. If "wrong" means "boo" in the consequent but lacks that meaning in the antecedent, the argument commits the fallacy of equivocation, rendering moral reasoning logically invalid. The box misses this logical dimension, framing it instead as a psychological observation about when disapproval is felt.

  The claim that "most philosophers now regard the Frege–Geach problem as devastating" is outdated. While the problem was seen as a major hurdle in the 1970s and 80s, the development of **Quasi-Realism** by Simon Blackburn and **Norm-Expressivism** by Allan Gibbard has made expressivism a mainstream, live option in contemporary metaethics. It is no longer a fringe view on the verge of collapse; rather, it is one of the dominant positions alongside realism and error theory. A tutor would expect you to know that expressivism has evolved significantly since the problem was first articulated.

  Regarding the solutions, the box's description of "attitudes about attitudes" is a crude caricature of Blackburn's actual theory. Blackburn does argue that accepting a moral conditional involves a higher-order attitude (disapproving of combining the antecedent attitude with the negation of the consequent), but this is part of a systematic project to "earn the right" to realist-sounding talk (truth, facts, logic) without realist ontology. Gibbard similarly analyzes moral judgments as states of norm-acceptance rather than simple disapproval, allowing for a robust logic of norms. These are not mere patches; they are comprehensive semantic frameworks.

  Finally, labeling these responses "hopelessly ad hoc" is a substantive philosophical objection, not a neutral fact. While critics (like realism-focused philosophers) do argue that quasi-realism struggles to fully escape the problem or collapses into realism, many philosophers find these solutions compelling enough to sustain the view. Describing them as "ad hoc" ignores the rigorous work done in inferential role semantics and expressivist logic over the last forty years. For your exam, you should treat the Frege–Geach problem as a serious challenge that expressivists have met with complex, ongoing solutions, rather than a refutation that ended the debate.
