answer: |-
  ### 1. Exam Question

  **Question:**
  Donald Davidson argues that akrasia involves acting against one's own best all-things-considered judgment, not merely acting against a prior preference. In contrast, behavioral economists often model weakness of will using hyperbolic discounting, which predicts preference reversal over time. 

  Does the hyperbolic discounting model successfully *explain* the phenomenon of akrasia, or does it merely provide a mathematical redescription that fails to capture the normative conflict essential to the philosophical account? In your answer, you must take a position on whether modeling preference reversal accounts for the irrationality involved in acting against one's better judgment. 

  *(Expected length: 800–1000 words)*

  ***

  ### 2. Model Answer

  The claim that hyperbolic discounting explains weakness of will is seductive because it offers a mechanistic account of why we choose smaller-sooner rewards over larger-later ones. However, this claim conflates preference reversal with akrasia. While hyperbolic discounting successfully models diachronic inconsistency, it fails to explain akrasia because it dissolves the synchronic normative conflict that defines the phenomenon. To explain akrasia, one must account for acting against a current judgment, not merely acting on a shifted preference.

  Davidson's account of akrasia hinges on the principle of continence: an agent should act in accordance with their all-things-considered judgment. For Davidson, the akratic agent holds a conditional judgment that, all things considered, action X is better than action Y, yet intentionally performs Y. The irrationality lies in the violation of this synchronic normative constraint. The agent knows, at the moment of action, what they should do, but fails to do it. This preserves the intuition that weakness of will involves a failure of rationality, not just a change in taste.

  Behavioral economics approaches this differently. The beta-delta model of hyperbolic discounting suggests that agents have time-inconsistent preferences. At time t1, an agent prefers a larger reward at t3 over a smaller reward at t2. However, as t2 approaches, the discount rate spikes, and at time t2, the agent prefers the smaller-immediate reward. When the agent chooses the smaller reward at t2, they are maximizing utility relative to their preferences *at t2*. There is no conflict at the moment of action; there is only a conflict between the self at t1 and the self at t2.

  If we accept the behavioral econ model as a complete explanation, akrasia disappears. If the agent at t2 prefers the vape (or the procrastination) over the health goal, and they act on that preference, they are acting rationally according to their current utility function. They are not weak-willed; they are simply time-inconsistent. This reduces akrasia to a prediction error made by the past self. The normative force of "I shouldn't do this" is translated into "My past self predicted I wouldn't want this."

  This is where the redescription charge holds weight. Hyperbolic discounting explains why preferences change, but it does not explain why an agent acts against a judgment they still hold. Often, the akratic agent does not undergo a preference reversal; they still judge the larger-later good as better even while consuming the smaller-sooner one. They feel regret *during* the action. The economic model cannot capture this synchronic split because it assumes action reveals preference. If I do it, I must have preferred it. Davidson argues the opposite: I can do it while judging I should not.

  Therefore, hyperbolic discounting is best understood as a complementary mechanism rather than a full explanation. It describes the psychological pressure that makes maintaining judgment difficult, but it does not account for the normative failure of violating that judgment. To say discounting explains akrasia is to change the subject from rationality to consistency. A true explanation of weakness of will must preserve the gap between judgment and action, not close it by redefining judgment as whatever preference wins at time t.

  Consequently, the economic model redescribes the behavior mathematically but leaves the philosophical problem untouched. It tells us how the valuation shifts, but not why the agent permits the shift to override their better judgment. Without accounting for the authority of the all-things-considered judgment, we have a model of addiction or habit, but not necessarily a model of irrational agency.

  ***

  ### 3. Marking Scheme

  ```json
