  9.  **Refining the "Impossibility" for the Novelist:**
      *   Don't just say "Arrow's Theorem." Explain *why* it matters for the plot. It means the character *must* make a trade-off. They cannot have it all. This creates dramatic tension. The character must admit a "necessary fiction" or a "priority hierarchy."
      *   The specific impossibility: **Coherence + Responsiveness + Non-Dictatorship.** If you want a coherent will (no cycles), you can't be fully responsive to every preference without a dictator (or a fixed agenda setter). This is perfect for a populist theorist—they likely privilege *Coherence* (The Leader interprets the true will) over *Responsiveness* (polls).

  10. **Refining the "Exclusionary Requirement":**
      *   I need one requirement that makes life hard for *all* four standard models.
      *   How about: **"The Will must be actionable across heterogeneous policy domains without contradiction."**
      *   Aggregative fails (cycles). Plebiscitary fails (contradictory referendums). Deliberative fails (too slow/scale). Identitarian fails (excludes internal dissent).
      *   Actually, the prompt asks for the requirement that does the most to *exclude* them.
