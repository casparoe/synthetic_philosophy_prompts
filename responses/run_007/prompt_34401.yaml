answer: |-
  To create a credible intellectual architect for your populist movement, you must equip them with a theory that survives the standard academic demolition of "the people." Most populist rhetoric collapses because it treats "the will of the people" as a mystical object that is simultaneously *one*, *true*, and *obvious*. A serious theorist knows it is none of these things by default; they must be *made* so through a rigorous framework.

  Below are the desiderata for a defensible theory of the popular will. They are divided into **Non-Negotiable** (logical or ethical conditions any account must meet to avoid absurdity) and **Camp Prejudices** (assumptions specific to certain ideologies that your theorist might reject).

  ### I. The Desiderata

  #### 1. The Coherence Condition (Non-Negotiable)
  *   **The Requirement:** The will must be transitive and logically consistent across policy domains. If the People will A over B, and B over C, they cannot will C over A. Furthermore, the will expressed in constitutional reform cannot contradict the will expressed in criminal justice.
  *   **The Motivating Case:** **Condorcet's Paradox / Majority Cycles.** In a three-option vote (e.g., Status Quo, Reform A, Reform B), majority rule can produce a cycle where A beats B, B beats C, but C beats A. If "the will" is simply "the majority preference," then in this scenario, the will is mathematically nonexistent. A theory that cannot resolve cycles without arbitrary agenda-setting describes a mob, not a sovereign.
  *   **The Trap:** Aggregative theories often fail here. They count votes but cannot guarantee a stable outcome. Your theorist must explain how the movement avoids cycling (e.g., by prioritizing certain issues as "foundational" to break the cycle).

  #### 2. The Framing Resilience Condition (Non-Negotiable)
  *   **The Requirement:** The identified will should not flip solely because the question was phrased differently or the order of voting changed.
  *   **The Motivating Case:** **Loss Aversion and Preference Reversal.** Behavioral economics shows that people reject a policy described as "5% unemployment" but accept it described as "95% employment," even if they are identical. If the "will of the people" changes based on semantic framing, it is not a will; it is a reflex. A serious theory must distinguish between the *signal* (the underlying interest) and the *noise* (the framing).
  *   **The Trap:** Plebiscitary models fail here. They treat the raw referendum result as sacred, even if the question was loaded.

  #### 3. The Boundary Specification (Non-Negotiable)
  *   **The Requirement:** The theory must explicitly define who constitutes "the People" prior to the vote, and justify why that boundary is legitimate.
  *   **The Motivating Case:** **The All-Affected Principle vs. The All-Subjected Principle.** If a decision on climate change binds future generations, do they count? If a decision on trade hurts non-citizen residents, are they part of "the people"? If the diaspora can vote, why not foreign investors? Without a fixed boundary, "the people" can be gerrymandered to produce any outcome desired.
  *   **The Trap:** Identitarian theories often fail here by assuming the boundary is natural or ethnic (which is empirically false) or by excluding internal minorities arbitrarily.

  #### 4. The Temporal Authority Condition (Non-Negotiable)
  *   **The Requirement:** The theory must specify which moment in time is authoritative: the present mood, the founding constitution, or the long-term trajectory.
  *   **The Motivating Case:** **The Dead Hand vs. The Living Moment.** A referendum today might contradict a constitutional amendment passed 50 years ago. Which is the "true" will? If the answer is always "today," the state has no stability (tyranny of the present). If the answer is always "the founding," the state is a corpse (tyranny of the past).
  *   **The Trap:** Populists often claim the "eternal people" speak through the "current majority." This is a contradiction. Your theorist must choose: is the will a *current command* or a *long-term project*?

  #### 5. The Epistemic Distinction (Non-Negotiable)
  *   **The Requirement:** The theory must distinguish between what people *say* they want (preference), what they *would* want if informed (deliberated preference), and what is *good* for them (interest).
  *   **The Motivating Case:** **The Problem of Ignorance.** Voters often support policies that contradict their own economic interests due to misinformation. If the "will" is simply the sum of ignorant preferences, it is self-harming. If the "will" is what is objectively good for them, the theory becomes paternalistic and indistinguishable from technocracy.
  *   **The Trap:** Aggregative theories treat all preferences as equal (ignoring ignorance). Deliberative theories assume everyone can be informed (ignoring scale/cost).

  #### 6. The Institutional Independence Prejudice (Camp Prejudice)
  *   **The Claim:** "The will exists prior to and independently of institutions; institutions merely record it."
  *   **Why it's a Prejudice:** This is a Rousseauian/Romantic assumption. In reality, institutions (parties, media, electoral systems) *construct* the will by determining which options are visible.
  *   **Novelist's Note:** A sophisticated theorist should admit that the will is *constructed* through institutions, not just discovered. This allows them to justify reforming institutions (e.g., changing the media landscape) as "unlocking" the true will.

  #### 7. The Binary Expressibility Prejudice (Camp Prejudice)
  *   **The Claim:** "The will must be reducible to a Yes/No choice or a single leader."
  *   **Why it's a Prejudice:** This is the Plebiscitary bias. Complex societies have complex wills. Reducing them to a binary is a simplification for power, not a philosophical necessity.
  *   **Novelist's Note:** If your character avoids this, they sound more like a political philosopher and less like a demagogue.

  ---

  ### II. The Impossibility Result (The Dramatic Tension)

  You suspected an impossibility result is hiding here. You are correct. It is a variation of **Arrow's Impossibility Theorem** applied to political legitimacy.

  **The Trilemma of Popular Sovereignty:**
  No theory of the will of the people can simultaneously satisfy these three conditions:
  1.  **Responsiveness:** The will reflects the actual preferences of all individuals (no one is ignored).
  2.  **Coherence:** The will is logically consistent and stable (no cycles or contradictions).
  3.  **Non-Dictatorship:** No single individual or fixed agenda-setter determines the outcome regardless of preferences.

  **The Implication for Your Novel:**
  Your theorist *must* break one of these legs to make the theory work.
  *   If they keep **Responsiveness** and **Non-Dictatorship**, they must accept **Incoherence** (the movement will be chaotic and contradictory).
  *   If they keep **Coherence** and **Non-Dictatorship**, they must accept **Unresponsiveness** (the movement ignores what people actually say in polls).
  *   If they keep **Coherence** and **Responsiveness**, they must accept a **Dictator** (someone must interpret/aggregate the will, and that interpretation is final).

  **The Theorist's Move:** To be credible, your character should explicitly acknowledge this trilemma and argue why *Coherence* is the priority. They must argue that a contradictory will is no will at all, and therefore, a mechanism (perhaps a leadership council or a specific constitutional structure) is required to "render" the will coherent. This admits a degree of elitism but frames it as a logical necessity rather than a power grab. This is the "serious intellectual" defense: *"We do not suppress the people; we make the people intelligible to themselves."*

  ---

  ### III. The Exclusionary Requirement

  The single requirement that does the most to exclude the four familiar accounts (Plebiscitary, Deliberative, Aggregative, Identitarian) is:

  **The Requirement of Counterfactual Stability.**
  *Definition:* A policy only expresses the will of the people if it would still be supported under conditions of *adequate information* and *alternative framing*, even if the current vote is narrow.

  **Why it excludes the familiar camps:**
  *   **Excludes Plebiscitary:** They treat the raw vote count as absolute, regardless of misinformation or framing.
  *   **Excludes Aggregative:** They treat raw preferences as the data, ignoring that preferences change when information changes.
  *   **Excludes Identitarian:** They assume the will is fixed by identity/blood, ignoring that interests change with circumstances.
  *   **Excludes Standard Deliberative:** While close, standard deliberative theory requires actual deliberation. Counterfactual Stability allows the theorist to claim the will *exists* even if deliberation hasn't happened yet, provided the leadership can prove the alignment.

  **Why this is key for your character:** This requirement gives the theorist the power to say: *"The polls are wrong. The opposition is wrong. We know what the People would will if they saw the whole picture. Therefore, we proceed."* It justifies overriding immediate opinion in the name of "true" opinion without abandoning democracy entirely.

  ---

  ### IV. Scorecard of Familiar Accounts

  | Account | Coherence | Boundary | Temporal | Epistemic | Fatal Flaw for your Theorist |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Plebiscitary** (The Vote is King) | Fails (Cycles) | Fails (Who votes?) | Presentist (Now only) | Fails (Ignorance) | Too unstable; collapses into mob rule. |
  | **Aggregative** (Sum of Preferences) | Fails (Arrow's Thm) | Fixed (Citizens) | Presentist | Fails (All prefs equal) | Cannot distinguish between error and will. |
  | **Deliberative** (Reasoned Consensus) | Passes | Fluid (All affected) | Continuous | Passes (Idealized) | Too slow; requires scale impossible for a nation. |
  | **Identitarian** (Ethnic/Cultural Will) | Passes (Mythic) | Exclusionary | Eternal (Past) | Fails (Essentialist) | Empirically false; alienates necessary allies. |

  ### V. Advice for the Character's Voice

  To make your theorist defensible, have them anchor their theory in **Constitutional Constructionism**.

  They should argue that "The People" are not a biological mass but a *political project*. The "Will" is not something you find in a poll; it is something you build through institutions that force coherence.
  *   **On Immigration:** "We do not exclude based on blood, but on the capacity to subscribe to the coherent project of the People."
  *   **On Reform:** "We are not breaking the constitution; we are updating the operating system to prevent the cycles that paralyzed the old one."
  *   **On Leadership:** "The Leader is not a master, but a translator. When the signal is noisy, the translator must clarify the message, even if the speakers do not yet recognize their own words."

  This allows the movement to be authoritarian in practice but democratic in theory, which is the hallmark of modern intellectual populism. The tension comes from the moment the "translation" clearly diverges from the "signal," and the theorist must decide whether to admit the error or double down on the theory.
