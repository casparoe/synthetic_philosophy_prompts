  2.  **Deconstruct "The Will of the People":**
      *   This is a classic problem in political theory (Rousseau, Schmitt, Habermas, Social Choice Theory).
      *   The core tension is between *democratic legitimacy* (rule by the people) and *logical coherence* (the people often don't have a single, stable will).
      *   To make the character credible, the theory must acknowledge these tensions and propose a solution, not deny them.

  3.  **Drafting the Desiderata (Iterative Process):**

      *   *Requirement 1: Coherence/Transitivity.* (Addressing cycles). If A > B and B > C, then A > C. Otherwise, "the will" is nonsense.
      *   *Requirement 2: Stability/Resilience.* (Addressing manipulation/framing). The will shouldn't change just because the question was asked differently.
      *   *Requirement 3: Boundary Definition.* (Addressing who counts). Who is "the people"?
      *   *Requirement 4: Temporal Continuity.* (Addressing the "which moment" problem). Is it today's mood or a long-term commitment?
      *   *Requirement 5: Distinction from Raw Preference.* (Addressing ignorance/interest). Is it what they want or what's good for them?
      *   *Requirement 6: Institutional Independence vs. Dependence.* (Addressing the "discovered vs. constructed" debate).

  4.  **Refining and Categorizing (Non-Negotiable vs. Prejudice):**
      *   *Non-Negotiable:* Must avoid logical contradiction (Coherence). Must define the subject (Boundary). Must account for change over time (Temporality).
      *   *Prejudice:* That it must be a single binary choice (Plebiscitary prejudice). That it exists *before* voting (Rousseauian prejudice).

  5.  **Identifying the Impossibility Result:**
      *   Arrow's Impossibility Theorem is the obvious candidate. It shows you can't have a perfect aggregation method that satisfies certain fairness criteria.
      *   However, for a *theory of the will*, the deeper impossibility is often between *Responsiveness* (doing what people say now) and *Coherence* (making sense over time/issues).
      *   Let's pinpoint the "Trilemma of Popular Will": Coherence, Responsiveness, and Protection of Minority/Principle. You can usually only pick two.
      *   Actually, a sharper impossibility for this context: **The Paradox of Constitution vs. Will.** If the will is supreme, it can change the rules. If the rules bind the will, it's not supreme.
      *   Better yet: **The Tension between Aggregation and Deliberation.** You can't satisfy the "Raw Preference" criterion and the "Rational Outcome" criterion simultaneously if the public is ignorant.
      *   Let's go with the Social Choice impossibility: You cannot satisfy *Unrestricted Domain*, *Pareto Efficiency*, *Independence of Irrelevant Alternatives*, and *Non-Dictatorship* simultaneously. For the novel, translate this to: You cannot have a Will that is *stable*, *responsive to all views*, *immune to framing*, and *non-dictatorial* all at once.

  6.  **Identifying the "Killer" Requirement:**
