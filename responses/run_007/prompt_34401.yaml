      *   *Aggregative:* Fails on coherence/cycles.
      *   *Identitarian:* Fails on boundary/exclusion.
      *   The requirement that **"The Will must be distinguishable from the sum of immediate, uninformed preferences"** is the hardest hurdle. It forces the theorist to explain *how* we get from messy opinions to a singular Will without just imposing their own view.
      *   Actually, the prompt asks for the requirement that *excludes* the familiar accounts. The requirement that **"The Will must be institutionally mediated yet sovereign"** is tough.
      *   Let's select: **"The Requirement of Counterfactual Stability"** (The will must hold even if framing changes). This kills simple aggregative and plebiscitary models. Deliberative tries to meet it but fails on scale. Identitarian ignores it.

  7.  **Structuring the Response:**
      *   **Introduction:** Acknowledge the task (building a credible intellectual framework).
