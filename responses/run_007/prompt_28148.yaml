  Okay, I'm teaching a grad seminar on vagueness next semester and I want to get my head straight about what the theories are even supposed to do before I assign the readings. So heres what I need:

  You're an expert in philosophy of language and philosophical logic. Think carefully and then write me the desiderata: what any adequate theory of vagueness has to get right. I don't mean "solve the sorites" as a single bullet — I want the full breakdown of what that actually demands. What phenomena does a theory need to explain? What cases does it need to get right? What distinctions can't it collapse? For each requirement, give me the case or consideration that motivates it.

  Then flag which of these are non-negotiable (any theory that fails them is dead) and which are more like preferences of particular camps. If you think some subset of the desiderata can't be jointly satisfied — like, if getting requirement A forces you to fail requirement B — point that out. That's the part I most want to see.

  Also, which single requirement knocks out the most candidate theories? And briefly: how do the main approaches (supervaluationism, epistemicism, degree/fuzzy theories, contextualism) do against the list? Just a sentence or two each.

  Keep the whole thing to 800 words max. I want it tight.
