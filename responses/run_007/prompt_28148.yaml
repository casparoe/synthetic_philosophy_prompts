answer: |-
  An adequate theory of vagueness must reconcile formal semantic theory with robust linguistic intuitions. It is not enough to block the Sorites paradox; a theory must explain why the paradox arises while preserving the utility of vague language. Below are the core desiderata, their status, and the theoretical tensions they generate.

  ### Core Desiderata

  1.  **Sorites Resolution:** The theory must block the invalid inference from clear cases to absurd conclusions without rendering the premises obviously false.
      *   *Motivation:* The Heap paradox. We accept 10,000 grains is a heap and removing one grain doesn't change that, yet we reject that 1 grain is a heap.
  2.  **Borderline Phenomenology:** The theory must account for the intuition that some cases are neither clearly *F* nor clearly *not-F*.
      *   *Motivation:* A teal patch between blue and green. Speakers hesitate to classify it; a theory must explain this hesitation.
  3.  **Higher-Order Vagueness:** The theory must explain vagueness about the boundary itself. There is no sharp line between 'clearly *F*' and 'borderline *F*'.
      *   *Motivation:* You cannot pinpoint the first borderline case. Any boundary drawn for 'borderline' seems as arbitrary as the boundary for 'heap'.
  4.  **Logical Conservation:** The theory must specify the status of Classical Logic (Law of Excluded Middle, Bivalence).
      *   *Motivation:* 'Either this is a heap or it isn't' strikes speakers as true, even if we don't know which.
  5.  **Semantic Competence:** The theory must explain how speakers master terms without knowing precise boundaries.
      *   *Motivation:* We teach 'tall' via examples, not measurements.

  ### Status: Non-Negotiable vs. Preference

  *   **Non-Negotiable:** **Sorites Resolution (1)** and **Borderline Phenomenology (2)**. A theory that allows the Sorites conclusion (1 grain is a heap) is absurd. A theory that denies the *appearance* of borderlines requires an implausible error theory about universal speaker intuition.
  *   **Preference/Contested:** **Logical Conservation (4)**. Many camps sacrifice bivalence to save intuitions. **Semantic Competence (5)** is required, but mechanisms vary widely.
  *   **Hard Constraint:** **Higher-Order Vagueness (3)**. Historically contested, but now widely treated as non-negotiable. Any theory introducing a sharp boundary at any order is suspect.

  ### Incompatibilities and Trade-Offs

  The central tension is the **Classical Trap**. You cannot jointly satisfy **Classical Logic (4)**, **No Sharp Boundaries (implied by 3)**, and the **Validity of Sorites Premises**.
  *   If you keep Classical Logic and Bivalence, you must accept sharp boundaries (violating 3).
  *   If you reject sharp boundaries (to save 3), you typically must reject Bivalence or Classical Logic (violating 4).
  *   **Higher-Order Collapse:** Formalizing 'borderline' often creates a new sharp boundary between 'true' and 'borderline', violating Desideratum 3. This is the technical graveyard for many formal systems.

  ### The Single Biggest Theory Killer

  **Higher-Order Vagueness (3).**
  This requirement knocks out the most candidate theories. Simple three-value logics introduce a sharp line between 'true' and 'indeterminate'. Standard Supervaluationism introduces a sharp line between 'admissible' and 'inadmissible' precisifications. Modeling vagueness about the boundary without reintroducing sharpness is the hardest technical challenge in the field.

  ### Theory Scorecard

  *   **Supervaluationism:** Saves Classical Logic and Borderline Phenomenology by quantifying over precisifications. **Fails:** Higher-Order Vagueness (sharp cut-offs in precisification space) and Semantic Competence (speakers don't know precisifications).
  *   **Epistemicism:** Saves Classical Logic and Higher-Order Vagueness by positing unknowable sharp boundaries. **Fails:** Borderline Phenomenology (claims hesitation is mere ignorance, not indeterminacy).
  *   **Degree/Fuzzy:** Saves Borderline Phenomenology via degrees of truth. **Fails:** Classical Logic (LEM fails) and Higher-Order Vagueness (struggles to define degrees of borderline-ness without sharp cuts).
  *   **Contextualism:** Solves Sorites via shifting standards during sorites reasoning. **Saves:** Competence and Sorites Resolution. **Fails:** Risks making truth too unstable to satisfy static Borderline intuitions outside contextual shifts.
