prompt: |-
  As part of the research for a novel I am writing about a reclusive mathematician, I have spent the past year sitting in on a philosophy of mathematics seminar. Two of the regular participants — a committed platonist who insists that mathematical objects are discovered rather than invented, and an equally committed nominalist who holds that mathematics is a human construction and that numbers, sets, and functions enjoy no mind-independent existence — have been arguing past each other so consistently that the seminar organizer has asked them to produce an adversarial collaboration document. I have been asked to help draft it, since I am the neutral party with no professional stake in the outcome and some experience distilling competing perspectives into prose.

  I need to produce a document both of them can sign. It should begin with a numbered list of claims they both agree on — about mathematical practice, about what does and does not need explaining, about what the debate is not about, and about which phenomena neither side disputes. Then it should have a table of disagreements, where each row states a precise point of divergence in wording each side would accept for its own position. After that, I need a section on cruxes: the sub-questions such that resolving them would shift at least one of them. For each crux, I should specify what kind of evidence, argument, or case study both would agree bears on it, and record in advance what each of them predicts. Finally, if any part of their dispute turns out to be merely verbal, I should identify it and explain why.

  The platonist keeps saying things like "the Mandelbrot set has properties no one could have anticipated — we are clearly exploring something we did not create," while the nominalist counters that "the same could be said of the rules of chess, and no one thinks chess positions inhabit a Platonic realm." I can tell they are talking past each other on the epistemology versus the ontology, but I am not sure how to separate those cleanly, and I suspect there are further layers beneath that. I also notice that they treat the indispensability argument very differently: the platonist regards it as a serious reason to believe in abstract objects, while the nominalist dismisses it as a pragmatic irrelevance. Help me draft this document.
reasoning: |-
  Here's a thinking process that leads to the suggested document:

  1.  **Analyze the Request:**
      *   **Goal:** Draft an "Adversarial Collaboration Document" for a Platonist and a Nominalist in a philosophy of mathematics seminar.
      *   **Context:** The user is a neutral third party (novelist/researcher) helping them articulate their dispute clearly.
      *   **Requirements:**
          1.  Numbered list of agreed claims (practice, explanatory needs, scope of debate, undisputed phenomena).
          2.  Table of disagreements (precise points of divergence, wording acceptable to both sides for each position).
          3.  Section on Cruxes (sub-questions, agreed-upon evidence/arguments, predictions from each side).
          4.  Identification of merely verbal disputes (if any).
      *   **Specific Tensions:** Platonist cites unexpected properties (Mandelbrot set) as discovery; Nominalist cites chess analogy (construction/rules). Platonist values Indispensability Argument; Nominalist dismisses it as pragmatic. Epistemology vs. Ontology confusion needs clarifying.
      *   **Tone:** Academic, precise, neutral, collaborative, philosophical.

  2.  **Deconstruct the Philosophical Positions:**
      *   **Platonism (Realism):** Mathematical objects exist independently of human minds, language, and practices. Mathematical statements are true because they correspond to these objects. Math is *discovered*.
      *   **Nominalism (Anti-Realism/Constructivism):** Mathematical objects do not exist independently. They are useful fictions, linguistic conventions, or mental constructions. Mathematical statements are true within the system but don't refer to mind-independent entities. Math is *invented* (or constructed).
      *   **Common Ground:** Both agree math works. Both agree on the theorems (2+2=4, ZFC axioms, etc.). Both agree math is useful in science. Both agree humans do math.
      *   **The "Talking Past Each Other" Issue:** The Platonist focuses on the *experience* of discovery and the *objectivity* of truth. The Nominalist focuses on the *origin* of concepts and the *ontological cost* of abstract objects. The chess analogy highlights this: Platonist sees "discovery of consequences," Nominalist sees "exploration of defined rules."

  3.  **Drafting - Section by Section:**

      *   **Title:** Needs to sound formal. "Adversarial Collaboration Protocol: Ontological Status of Mathematical Objects."
      *   **Introduction:** Briefly state the purpose (clarify disagreement, identify common ground).

      *   **Section 1: Points of Agreement (The "Common Ground"):**
          *   Need to cover practice, explanation, scope, and phenomena.
          *   *Practice:* We use the same axioms, prove the same theorems.
          *   *Explanation:* We both need to explain why math is so effective in science (Wigner's puzzle).
          *   *Scope:* This isn't about skepticism (math isn't false) or psychology (how brains process numbers).
          *   *Phenomena:* Mathematical truth is objective (not subjective preference). Math is indispensable to physics.

      *   **Section 2: Table of Disagreements:**
          *   Need precise wording.
          *   *Ontology:* Do numbers exist independently? (Yes vs. No).
          *   *Truth:* Is truth correspondence or coherence/utility?
          *   *Epistemology:* How do we access them? (Intuition/Grasping vs. Construction/Logic).
          *   *Indispensability:* Does utility in physics imply existence? (Yes vs. No/Instrumental).
          *   *The "Discovery" Feeling:* Is it evidence of reality or psychological artifact?

      *   **Section 3: Cruxes (The "Deal Breakers"):**
          *   What would change their minds?
          *   *Crux 1: The Nature of Indispensability.* If math is indispensable to *true* physical theories, does that commit us to the existence of the math entities? (Quine-Putnam).
              *   *Evidence:* Analysis of successful physical theories (General Relativity, QM).
              *   *Predictions:* Platonist says "Existence confirmed." Nominalist says "Useful fiction confirmed."
          *   *Crux 2: The Source of Constraint.* Why can't we just decide 2+2=5?
              *   *Evidence:* Historical cases of failed mathematical constructions vs. successful "discoveries."
              *   *Predictions:* Platonist says "Reality resisted us." Nominalist says "Internal consistency constrained us."
          *   *Crux 3: The Chess Analogy.* Is math like chess or like geography?
              *   *Evidence:* Comparison of contingency in chess rules vs. mathematical axioms.
              *   *Predictions:* Platonist says "Axioms are necessary truths." Nominalist says "Axioms are chosen rules."

      *   **Section 4: Verbal Disputes:**
          *   Where are they just using words differently?
          *   *The word "Exist":* Platonist means "mind-independent instantiation." Nominalist means "physical instantiation or conceptual utility."
          *   *The word "Discovery":* Platonist means "finding pre-existing structure." Nominalist means "uncovering implicit consequences of definitions."
          *   *The "Chess" Analogy:* This is the big one. The Platonist thinks the analogy fails because math applies to the physical world in a way chess doesn't. The Nominalist thinks it holds because both are rule-based systems. This needs to be flagged as a substantive disagreement disguised as an analogy check.

  4.  **Refining and Polishing:**
      *   *Tone Check:* Ensure it doesn't sound like I'm taking sides. Use phrases like "The Platonist maintains..." and "The Nominalist counters..."
      *   *Specific Prompts:* Address the Mandelbrot/Chess specific examples given in the prompt.
      *   *Epistemology vs. Ontology:* Make sure the distinction is clear in the "Cruxes" section. The Platonist argues from epistemology (it *feels* like discovery) to ontology (therefore it *is* real). The Nominalist argues from ontology (no causal contact possible) to epistemology (therefore it must be construction).
      *   *Indispensability:* Ensure the Quine-Putnam nuance is captured correctly.

  5.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is the "Verbal Dispute" section too dismissive?
      *   *Fix:* Frame it as "terminological divergence that masks substantive issues." It's not *just* verbal, but clarifying the terms helps isolate the real metaphysical gap.
      *   *Critique:* Did I address the "Novelist" context?
      *   *Fix:* Keep the document formal enough for the characters to sign, but clear enough for the novelist to understand the underlying drama. The prompt asks me to *draft the document*, not write the scene around it. So the output should be the document itself.
      *   *Check:* Did I include the Mandelbrot/Chess specific tension?
      *   *Fix:* Include it in the Cruxes or Disagreements table as a specific instance of the "Constraint" issue.

  6.  **Final Polish:** Check formatting (numbered lists, tables, headers). Ensure the voice is neutral and facilitative. (Proceed to generate output based on these thoughts).

  *(Self-Correction Note: Make sure the "Predictions" in the Cruxes section are falsifiable or at least distinct enough to show why the crux matters.)*

  7.  **Final Output Structure:**
      *   Header
      *   Preamble
      *   I. Shared Commitments (Agreements)
      *   II. Taxonomy of Disagreement (Table)
      *   III. Identifying Cruxes (Evidence & Predictions)
      *   IV. Assessment of Verbal Disputes
      *   Signatures

