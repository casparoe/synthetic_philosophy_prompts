prompt: |-
  I've been teaching an undergraduate course on rational choice theory for a few years now, and I've found myself defending a fairly hardline position on the sunk cost fallacy: that honoring sunk costs is always irrational — not just usually, not just in the textbook cases, but always, across every context and every specification. By "honoring sunk costs" I mean treating a cost you've already incurred and cannot recover as a reason, in itself, to continue with a course of action, over and above what the forward-looking costs and benefits would dictate. I take the standard view seriously: rational agents should make decisions exclusively on the basis of marginal costs and marginal benefits going forward, and past expenditures are, strictly speaking, irrelevant to the decision at hand.

  But I've noticed that the harder I push this line in seminar, the more edge cases my students and colleagues throw at me. Some are easy to dismiss — the person who finishes a bad meal because they paid for it is just making a mistake, and the person who keeps pouring money into a failing project out of pride isn't a counterexample to the normative claim, just evidence that people are irrational. But others are trickier. What about cases where abandoning a project would signal to collaborators or funders that you're unreliable, and the reputation cost is genuinely forward-looking? What about cases where the sunk cost carries information you'd otherwise lack — say, a firm that has invested heavily in a technology and, precisely because of that investment, now has private information about its promise that an outsider couldn't recover? What about the emotional or psychological costs of admitting waste to oneself, which are themselves forward-looking costs? And then there are the deeper, more structural challenges: if you're a creature who knows you'll face future temptation to abandon projects prematurely, might it be rational to cultivate a standing disposition to honor sunk costs as a kind of precommitment device or personal rule, even if each individual instance, considered in isolation, looks like a fallacy?

  I want to take these challenges seriously rather than just bat them away with definitional moves. So here's what I'm asking: I hold the view that honoring sunk costs is always irrational. Tell me what would count against it. I want the evidence, arguments, and cases that should move me, sorted by how decisive they'd be — from "merely awkward" to "fatal." I also want an honest assessment of whether the view, as I've stated it, has been qualified in ways that insulate it from falsification (for instance, by reclassifying every apparent counterexample as a case where the cost isn't truly sunk, or where the reason isn't truly the sunk cost but something else). And if it has been insulated, I want to know whether that's a problem for a view of this kind, or whether some degree of insulation is appropriate for a normative principle about rationality.

  Please structure your response in the following sections:

  1. **The view restated** (roughly 150 words): Clarify the position I'm defending, drawing distinctions you think are necessary to make it precise enough to evaluate. Distinguish it from nearby claims (e.g., that honoring sunk costs is merely *usually* irrational, or that it's a *descriptive* fact about human psychology). If there are weaker and stronger versions of the view, specify which one I seem committed to and what would count as abandoning it for a weaker one.

  2. **Merely awkward cases** (roughly 300 words): Present the challenges that a defender of my view can accommodate without serious revision — cases that look like counterexamples but dissolve under analysis, or that require only minor clarifications of what counts as a sunk cost or what counts as honoring one. Explain why they aren't more threatening, and what principle of the view allows them to be handled cleanly.

  3. **Serious challenges** (roughly 400 words): Present the arguments and cases that should genuinely pressure the view — the ones that can't be dismissed easily and that might require significant qualification, restriction, or revision. For each, explain what makes it harder to handle than the merely awkward cases: what feature of the example or argument forces a defender of the view into an uncomfortable choice between giving ground and sounding ad hoc.

  4. **What would be fatal** (roughly 300 words): Describe what would have to be true — what kind of case, what kind of argument, what kind of empirical finding — for the view to be not just pressured but defeated. Be specific: don't just say "if honoring sunk costs turned out to be rational," but describe the structure a successful counterexample would need to have, and why that structure would leave no room for the view to retreat without collapsing into a different claim entirely.

  5. **Insulation and falsifiability** (roughly 250 words): Assess whether the view, as I've stated it, can be insulated against all counterexamples by re-describing them as cases where the cost isn't truly sunk or the reason isn't truly the sunk cost, and whether it already has been in the literature or in my own framing. If so, is this a defect? Some normative principles are unfalsifiable in a way that's fine — they function as regulative ideals or axioms; others are unfalsifiable in a way that makes them empty. Which kind is this one, and what would distinguish the two here?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** An undergraduate instructor teaching rational choice theory.
      *   **Position:** Hardline view that honoring sunk costs is *always* irrational (normative claim).
      *   **Definition:** "Honoring sunk costs" = treating an irrecoverable past cost as a reason *in itself* to continue, over and above forward-looking costs/benefits.
      *   **Task:** Challenge this view seriously. Provide evidence/arguments/cases sorted by decisiveness (Awkward -> Serious -> Fatal). Assess insulation/falsifiability.
      *   **Structure:** Five specific sections with word count constraints (approximate).
      *   **Tone:** Philosophical, rigorous, respectful but critical.

  2.  **Deconstruct the Position:**
      *   The core claim is normative rationality: $Action_{continue}$ is rational iff $ExpectedUtility_{future}(continue) > ExpectedUtility_{future}(abort)$. Past costs $C_{past}$ should not enter the equation.
      *   The user acknowledges common "escape hatches" (reputation, information, psychological pain) but wants to know if there are cases where these don't apply and honoring the cost is *still* rational, or if the definition itself is the problem.
      *   The "Precommitment/Disposition" argument is the strongest philosophical challenge (Ainslie, Schelling, etc.).

  3.  **Drafting Section 1: The View Restated (~150 words)**
      *   *Goal:* Precision. Distinguish normative vs. descriptive. Strong vs. weak.
      *   *Content:* It's a normative claim about *reasons*, not psychology. It's the "Strong Sunk Cost Irrelevance Principle" (SSCIP). It claims past expenditure provides *zero* justificatory weight.
      *   *Distinction:* Not "people often fail this" (descriptive). Not "usually irrational" (weak normative). It's "necessarily irrational."
      *   *Abandoning:* Moving to "prima facie irrational" or "irrational unless specific conditions met" would be a retreat.

  4.  **Drafting Section 2: Merely Awkward Cases (~300 words)**
      *   *Goal:* Cases that look like counterexamples but aren't.
      *   *Content:*
          1.  *Reputation:* If quitting signals unreliability, the cost of quitting is a *future* reputational loss, not the past cost itself.
          2.  *Information:* Investment reveals data. The value is the info, not the spend.
          3.  *Psychological Pain:* Regret is a future utility hit. Avoiding regret is a forward-looking benefit.
      *   *Why not threatening:* These reclassify the "reason." The agent isn't valuing the past cost; they are valuing a future consequence *caused* by acknowledging the past cost. The SSCIP holds because the *weight* is on the future consequence.

  5.  **Drafting Section 3: Serious Challenges (~400 words)**
      *   *Goal:* Cases that strain the "reclassification" move.
      *   *Content:*
          1.  *The Disposition/Precommitment Argument:* If I know I have time-inconsistent preferences (hyperbolic discounting), a rule "never abandon invested projects" might maximize lifetime utility, even if specific instances lose money. Is following the rule rational? If yes, is honoring the sunk cost rational *in that instance*?
          2.  *Constitutive Ends:* Some projects define identity. Abandoning isn't just a utility loss; it dissolves the agent's narrative. If rationality includes integrity/identity maintenance, does the past investment matter constitutively?
          3.  *The "Learning by Doing" Threshold:* Sometimes you *must* pass a sunk cost threshold to unlock the benefit, but the benefit is uncertain. If you stop right before the threshold, the sunk cost was wasted. Is continuing to reach the threshold rational *because* you've already spent so much? (This borders on information, but can be framed as threshold logic).
      *   *Focus:* The Precommitment argument is the heavy hitter here. It forces a choice between act-rationality and rule-rationality.

  6.  **Drafting Section 4: What Would Be Fatal (~300 words)**
      *   *Goal:* The knockout blow.
      *   *Content:* A case where:
          1.  No future reputational/info/psychological consequences exist (isolated decision).
          2.  The agent has consistent time preferences (no need for precommitment).
          3.  Yet, honoring the sunk cost yields higher utility *and* is intuitively rational.
      *   *Structure:* A "God's Eye" view experiment. If an omniscient advisor would say "Continue *because* you spent X," the view dies.
      *   *Alternative:* If "rationality" is redefined to include diachronic consistency over synchronic maximization, the SSCIP collapses into a different theory (rule-utilitarianism of habits). If the view cannot accommodate diachronic rationality without calling it "irrational," it's too narrow.

  7.  **Drafting Section 5: Insulation and Falsifiability (~250 words)**
      *   *Goal:* Meta-analysis of the argument strategy.
      *   *Content:* The view risks being a tautology ("If there's a good reason, it wasn't sunk cost reasoning").
      *   *Assessment:* It functions as a *regulative ideal* (like "do not contradict yourself"). It's useful for teaching heuristics. But if *every* counterexample is explained away by positing hidden future costs, it loses empirical bite.
      *   *Verdict:* It's a useful axiom for modeling, but potentially empty as a complete theory of human rationality. It distinguishes *types* of reasons. If the distinction collapses, the theory is empty.

  8.  **Review and Refine (Self-Correction/Word Count Check):**
      *   *Section 1:* Ensure "normative" is clear. Check word count.
      *   *Section 2:* Make sure the distinction between "reason is the cost" vs "reason is the consequence of the cost" is sharp.
      *   *Section 3:* Focus heavily on the Precommitment/Disposition argument. That's the philosophical heavy lifting.
      *   *Section 4:* Be specific about the "isolated" nature of the fatal case.
      *   *Section 5:* Address the "No True Scotsman" risk.
      *   *Tone:* Keep it academic but direct.
      *   *Word Counts:* I need to be careful not to go too short or too long. I will aim for the targets.

      *(Self-Correction during drafting)*: In Section 3, I need to make sure I don't just repeat the "reputation" point. The Precommitment argument is distinct because it argues that *violating* SSCIP in the moment is necessary to satisfy a higher-order rational constraint. This challenges the definition of "rational action" (act vs. rule).

      *(Refining Section 5)*: Is it a defect? In economics, axioms are often unfalsifiable by design (e.g., transitivity). The issue is whether it aids prediction or understanding. I should frame it as a "modeling assumption" vs "truth claim."

  9.  **Final Polish:** Check transitions and ensure the voice matches a colleague-to-colleague philosophical discussion. (Proceed to generate output).

