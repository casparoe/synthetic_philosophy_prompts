answer: |-
  You are not confused; the distinction you are drawing is philosophically robust and widely recognized in ethics. The error you identify—sliding from "ontologically deficient" to "morally negligible"—is a classic category mistake. Harm is typically a setback to the *interests of a subject*, not merely the destruction of an *object's physical integrity*. Therefore, an object can be ontologically "thin" (or not a "real" instance of its kind) while the interests tied to it are ontologically "thick" (real human welfare).

  **The Case: The Esports Heirloom**
  Consider a professional gamer, Elena, whose livelihood depends on her status in a competitive VR league. Over five years, she has acquired a "Founder's Cape," a rare digital asset attached to her avatar that signifies her veteran status and is explicitly required by her sponsorship contract to maintain her income tier. The cape is not a "real" garment—it has no fabric, offers no warmth, and exists only as code on a corporate server. A rival, exploiting a bug, permanently deletes the cape from Elena's inventory. The cape cannot be restored. Elena loses her sponsorship, suffers significant financial loss, and experiences genuine distress over the erasure of her career history.

  **The Walkthrough**

  *   **Ontological Verdict (Is it a real cape?):** Under a **Physicalist** theory of objects (the common-sense view you are testing), the cape is *not* a real instance of the kind "cape." It lacks the essential physical properties (textile, spatial occupation) that define the natural kind. Even under a functionalist view, one might argue it is a "simulated cape" rather than a "real cape." However, under **Chalmers' Digital Functionalism**, the cape *is* a real digital object, though not a physical one. To satisfy your constraint (a), we adopt the Physicalist view: it is not a real cape.
  *   **Moral Verdict (Is it a real harm?):** Under the **Interest Theory of Harm** (e.g., Feinberg), harm occurs when a subject's legitimate interests are set back. Elena has a real economic interest (her contract) and a real psychological interest (her career narrative). Both are objectively set back. The harm is genuine, regardless of the substrate of the object destroyed.
  *   **The Wedge:** The feature pulling these verdicts apart is the **locus of value**. The ontology question asks about the *properties of the object* (bits vs. atoms). The harm question asks about the *relation between the object and a moral subject*. The "realness" of the harm derives from the reality of Elena's interests, not the reality of the cape's material.

  **Verdict on Your Intuition**
  You have not got the wrong end of the stick. The inference "X is not a real F, therefore damaging X is not a harm" is invalid. It conflates *constitutive rules* (what makes a thing) with *regulative rules* (how we ought to treat things). Chalmers would actually push back on premise (a)—he argues virtual capes *are* real digital capes—but he would fully endorse your moral conclusion. He argues that because virtual objects are real (computationally), harms to them are real. You are making the stronger point: *even if* one rejects Chalmers' ontology and claims the object is "mere" virtual, the harm remains real because the victim is not virtual. Your intuition correctly isolates the moral weight from the metaphysical substrate.
