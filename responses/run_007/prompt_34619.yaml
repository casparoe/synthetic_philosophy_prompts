      *   *Leakage Argument:* We've leaked TV/radar for 100 years. DFH counter: Leakage is weak/diffuse; METI is targeted/high-gain. Leakage is a accident; METI is intent.
      *   *Advanced Civ Awareness:* "If they can hurt us, they already know." DFH counter: Maybe they filter by *intent*. A deliberate signal marks you as an active threat or competitor, whereas leakage marks you as noise until you become technologically significant.

  5.  **Where the Model Breaks/Goes Silent:**
