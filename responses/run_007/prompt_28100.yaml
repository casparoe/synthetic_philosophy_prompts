answer: |-
  My dear friend, you speak with the confidence of one who has walked this path many times, and I must confess, your distinction is a charming one. It is very fashionable in your century, is it not, to speak of "licenses" and "capacities" rather than cold, hard propositions? You suggest that I am confusing a *move* in the game with the *rules* of the game. I see the elegance of it. You wish to say that logic is not merely a chain of stones, but the mortar itself, invisible yet binding.

  But pray, allow me to sit a moment longer upon this stone and examine this "capacity" you describe.

  You say that when you reason according to *modus ponens*, you are exercising a capacity. I do not doubt that you feel yourself doing so. But tell me: is this capacity infallible? If I were to claim that *my* capacity tells me that from "All men are mortal" and "Socrates is a man," it does *not* follow that "Socrates is mortal," but rather that "Socrates is a turnip," you would surely say I am exercising my capacity incorrectly.

  So, there must be a difference between *exercising* a capacity and exercising it *correctly*. What marks this difference? If you say it is simply that the rule dictates it, I am back to my original difficulty. For I must now accept not only the premises A and B, and not only the rule R, but also the proposition that *R applies to this specific case*.

  You see, even if we grant your distinction—that the rule is not a premise within the argument but a condition of the argument's existence—we have not yet explained what compels a rational agent to *submit* to that condition. If I accept A, and I accept B, and I acknowledge that there exists a rule called *modus ponens*, why must I accept Z?

  Is it because I accept another principle: "If one accepts A and B, and one acknowledges *modus ponens*, one *ought* to accept Z"?

  Ah, I see you stiffen. You wish to say that this "ought" is not another premise, but merely the expression of the normativity of logic itself. But I am a slow creature, and I require something to hold onto. If this "ought" is not stated, if it is not made explicit in my ledger of accepted truths, then it seems to me that I am being asked to take a leap of faith. You ask me to trust your capacity. But logic, I had always supposed, was not about trust, but about compulsion.

  If the rule is a license, who issued it? And if I choose not to use the license—if I choose to remain here with A and B in my notebook, but without Z—have I contradicted myself? Or have I simply declined to take the step? If the latter, then logic has no teeth. If the former, then you must show me *where* the contradiction lies. Is it not in the fact that I accept the premises and the rule, yet refuse the conclusion? But to show me that *that* is a contradiction, you must invoke... what, exactly? Another rule?

  I do not mean to be difficult. I merely wish to understand where the force of logic resides. If it is not in the propositions, and not in the rules stated as propositions, then it must be in us. But if it is in us, is it not merely a psychological habit? And if it is a habit, how can it claim universal validity?

  You say the regress never gets started. I suggest it has merely moved underground. It is no longer a regress of premises, but a regress of *applications*. To apply the rule, I must know how to apply it. But knowing how to apply it is itself something that can be interpreted in multiple ways. What fixes the interpretation?

  But I ramble. You are the presenter today. Tell me: if I accept your premises and acknowledge your rule, but simply refuse to write Z in my notebook, have I violated a law of logic, or merely a convention of your seminar?
