answer: |-
  I stand upon the Monday of my mind,
  And see the future path distinct and clear.
  The effort's weight is distant, left behind,
  While future gain appears both bright and near.
  I pledge the run, the sweat, the hard-won hour,
  For health's long dividend is surely due.
  No shadow yet obscures my reason's power,
  That binds the future self to what is true.

  Yet Wednesday breaks, the curve grows sharply steep,
  The couch asserts a soft and present grace.
  I know the cost, nor promise do I keep,
  But reason bends to fit this narrower space.
  Is he who planned the same who chooses rest?
  Or moments carve a stranger from my breast?
