  # The Epistemic Robustness Filter (ERF)
  **Time required:** 30 Minutes
  **Purpose:** To distinguish between *risky* bets (known probabilities, high variance) and *uncertain* bets (unknown probabilities, fragile models), allowing you to reject "fanatical" expected value (EV) claims without abandoning EV reasoning entirely.

  ### Phase 1: The Mechanism Sanity Check (5 Minutes)
  *Goal: Filter out physically or socially impossible causal chains.*

  1.  **The Physics/Social Science Test:** Does the proposal violate known laws of physics or well-established social science? (e.g., perpetual motion, or "changing culture" with no mechanism).
      *   *If Yes:* **Reject.** (Probability $\approx$ 0).
      *   *If No:* Proceed.
  2.  **The "One-Link" Break:** Identify the weakest link in the causal chain (Proposal $\to$ Output $\to$ Outcome $\to$ Impact). If that link breaks, does the whole value vanish?
      *   *If Yes:* Note this as a "Single Point of Failure." Proceed to Phase 2.

  ### Phase 2: Probability Shrinkage & Calibration (10 Minutes)
  *Goal: Handle applicant overconfidence and distinguish Risk from Uncertainty.*

  3.  **The Outside View Cap:** Look for reference classes. Has anyone ever achieved this before?
      *   *Rule:* If there is **no historical reference class** (e.g., preventing an existential catastrophe), you cannot treat the applicant's probability as a "risk." It is "Knightian Uncertainty."
      *   *Action:* Apply an **Epistemic Discount Factor (EDF)**.
          *   If Reference Class Exists: Use applicant's $P$, max discounted by 50%.
          *   If No Reference Class: Reduce $P$ by **two orders of magnitude** (divide by 100) automatically. This accounts for model error, not just bad luck.
  4.  **The "Bet Your Bonus" Test:** Would the applicant wager 10% of their personal annual income on their stated probability being correct?
      *   *If No:* Treat their stated probability as "aspirational," not statistical. Apply the EDF.
      *   *If Yes:* You may use their $P$, but still apply a 50% confidence discount.

  ### Phase 3: The Portfolio & Context Check (10 Minutes)
  *Goal: Determine if the EV holds in the context of your foundation.*

  5.  **The Marginal Impact Question:** If you *don't* fund this, will someone else (government, other foundation) likely do it?
      *   *If Yes:* Your counterfactual impact is near zero. **Reject.**
      *   *If No:* Proceed.
  6.  **The "All-In" Stress Test:** If your foundation put 100% of its portfolio into this *type* of bet (not just this grant), would it survive 10 years?
      *   *If No:* This is a **Correlated Tail Risk**. You cannot fund this based on EV alone; you must cap exposure to preserve the portfolio's ability to make future grants.
      *   *Decision Rule:* If the bet is "Uncertain" (Phase 2), cap funding at <5% of total portfolio regardless of EV.

  ### Phase 4: The Values Handoff (5 Minutes)
  *Goal: Identify where maths ends and philosophy begins.*

  7.  **The Risk-Aversion Declaration:** If the Adjusted EV is positive but you still feel hesitation, ask: "Am I worried the model is wrong (Epistemic), or am I worried about the variance (Risk)?"
      *   *If Epistemic:* Use Phase 2 to Reject.
      *   *If Risk:* This is a **Values Call**. You are admitting you are not a pure EV maximizer.
      *   *Action:* Do not write "Low EV" in the memo. Write "High Variance incompatible with Foundation risk profile." Hand off to the Investment Committee with this explicit label.

  ---

  # Application to Three Cases

  Here is the procedure run on your three pitches. I have been rigorous with the discounts to show where the "wall" comes from.

  ### Case 1: The Existential Bet
  *Proposal:* 0.01% chance of preventing an existential catastrophe (saving ~80 billion future lives).
  *Applicant's EV:* $0.0001 \times 80,000,000,000 = 8,000,000$ lives saved.

  1.  **Mechanism:** Plausible within current physics (e.g., biosecurity), but causal chain is long. Single Point of Failure: High.
  2.  **Probability Shrinkage:**
      *   *Reference Class:* None. We have never prevented an existential catastrophe because we haven't faced one yet.
      *   *EDF Application:* This is **Uncertainty**, not Risk. Apply two orders of magnitude discount. $0.01\% \to 0.0001\%$.
      *   *Bet Your Bonus:* Applicant declines (typical).
      *   *Adjusted P:* $0.0001\%$.
      *   *Adjusted EV:* 80,000 lives. (Still huge).
  3.  **Portfolio Check:**
      *   *Correlated Tail Risk:* If you fund this, you are betting on a specific model of catastrophe. If that model is wrong, the value is zero.
      *   *All-In Test:* If you put 100% of funds here, and the model is wrong (which the EDF suggests is likely), the foundation achieves nothing for 10 years.
  4.  **Decision:** **REJECT (Epistemic Opacity).**
      *   *Reasoning:* While the Adjusted EV is still high, the probability is **unknowable**. The procedure dictates that when $P$ is derived from a model with no reference class, you cannot treat it as a number for allocation decisions. You are not rejecting the *impact*; you are rejecting the *calculability*.
      *   *Memo Line:* "Impact is astronomical, but probability is epistemically inaccessible. Funding this is a values bet on longtermism, not an EV bet."

  ### Case 2: The Rare Disease Cure
  *Proposal:* 1-in-1,000,000 chance of curing a disease affecting 300 people/year.
  *Applicant's EV:* $0.000001 \times 300 \text{ lives} = 0.0003$ lives saved. (Note: Even if cured, it only helps future patients, say 10,000 over time).
  *Adjusted EV:* $0.000001 \times 10,000 = 0.01$ lives.

  1.  **Mechanism:** Scientifically plausible but highly speculative tech.
  2.  **Probability Shrinkage:**
      *   *Reference Class:* Drug development has known failure rates. 1-in-1M is likely *underconfident* for early stage, but let's take their number.
      *   *EDF:* Apply standard discount. $P \to 0.0000005$.
      *   *Adjusted EV:* Negligible.
  3.  **Portfolio Check:** Low correlation risk.
  4.  **Decision:** **REJECT (Low EV).**
      *   *Reasoning:* The impact cap is too low to justify the probability, even without heavy discounts.
      *   *The Uncomfortable Truth:* This recommendation will feel cold. You are effectively saying "300 people suffering is not worth a speculative bet." This is the mathematical reality of limited resources, but it conflicts with the human impulse to help identifiable victims. **This is the case where the procedure tells you to do something you won't like.** It forces you to prioritize statistical lives over identifiable ones.

  ### Case 3: The Income Doubling
  *Proposal:* 10% chance of doubling income for 1 million people.
  *Applicant's EV:* $0.10 \times 1,000,000 \text{ people} = 100,000$ people benefited.

  1.  **Mechanism:** Economic development policy. Plausible.
  2.  **Probability Shrinkage:**
      *   *Reference Class:* Development interventions have mixed results. 10% is optimistic but grounded.
      *   *EDF:* Apply 50% confidence discount. $P \to 5\%$.
      *   *Adjusted EV:* 50,000 people benefited significantly.
  3.  **Portfolio Check:**
      *   *All-In Test:* If you fund only this, you likely get some returns, but variance is manageable.
      *   *Marginal Impact:* High. Policy change often requires specific foundation risk capital.
  4.  **Decision:** **FUND.**
      *   *Reasoning:* This is a **Risky** bet (known probabilities), not an **Uncertain** one. The EV is robust to epistemic discounts. It fits the "near-term global health/development" mandate without requiring you to believe in untestable models of the far future.

  ---

  # What This Procedure Cannot Settle

  I need to be honest with you about where this filter fails.

  1.  **The Risk Aversion vs. Error Debate:** In Case 1, the procedure rejects the grant due to "Epistemic Opacity." However, a true EV maximizer might argue that even a 1-in-a-billion chance is worth it if the payoff is infinite. This procedure cannot prove them wrong; it simply establishes a **rule of thumb** that human beings (and institutions) cannot act on probabilities they cannot verify. It solves your *psychological* wall, not the *philosophical* one.
  2.  **The Moral Weight of the Future:** The procedure treats "saving a future life" and "doubling a current income" as comparable units once quantified. It cannot tell you if a future life *should* count as much as a current one. That is a values call (Phase 4).
  3.  **The "Uncomfortable" Recommendation:** In Case 2, the procedure tells you to walk away from a cure for a suffering group because the numbers don't add up. If your foundation's donors care about *compassion* as much as *efficiency*, this procedure will generate friction. It optimizes for the "Global Health" part of your mandate, not the "Humanitarian" part.

  **Final Advice for Your Memo:**
  When you present Case 1 to the Committee, do not say "The EV is too low." Say "The EV is high, but the probability is **unverifiable**." This allows you to reject the fanaticism without abandoning the language of Expected Value. It shifts the debate from "How much do we care about the future?" (Values) to "Can we trust this number?" (Epistemology). The latter is a much safer ground for a Programme Officer to stand on.
