  Consider a specific bronze statue, *The Spearbearer*, actually cast from a single, continuous lump of bronze, $L$. In a nearby possible world $w$, the exact same lump $L$ exists but is divided cleanly in half prior to casting; each half is then cast into a statue, $S_1$ and $S_2$, such that both $S_1$ and $S_2$ preserve the exact design, surface texture, and artistic intent of the actual *The Spearbearer*, differing only in spatial location and mass. The *de re* modal claim to evaluate is: "*The Spearbearer* could have been both $S_1$ and $S_2$." On Transworld Identity (TI), this claim is necessarily false: if *The Spearbearer* were identical to $S_1$ and identical to $S_2$ in $w$, then by the transitivity and necessity of identity, $S_1$ would be identical to $S_2$, but they are two distinct objects in $w$. TI forces a "unique candidate" constraint where identity cannot branch. On Counterpart Theory (CT), the claim is true: *The Spearbearer* is world-bound, but the counterpart relation is not transitive and allows one-to-many mappings; since both $S_1$ and $S_2$ are equally similar to the actual statue in relevant qualitative and causal respects, both count as counterparts, allowing the *de re* assertion to hold without contradiction. The structural feature doing the work is the logic of identity (transitive, unique) versus the logic of counterpart relations (intransitive, potentially plural). A defender of TI would push back by denying the *de re* reference altogether, arguing that because neither $S_1$ nor $S_2$ shares the unique origin history of the actual lump $L$ (due to the fission), neither is *The Spearbearer*, rendering the claim false on grounds of origin essentialism rather than just logic. You must flag a potential question-begging risk: stipulating that both $S_1$ and $S_2$ qualify as counterparts assumes a similarity metric that weights qualitative design over material continuity, which a Lewisian might accept but could be challenged by a "best candidate" theorist who argues that when similarity is tied, neither object counts as a counterpart, which would accidentally align CT with TI's negative verdict.
