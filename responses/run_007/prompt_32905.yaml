prompt: |-
  I serve on my country's pandemic preparedness advisory committee. We must issue a recommendation by Friday on which of two mutually exclusive antiviral stockpile strategies to fund. Strategy A: a broad-spectrum prophylactic that, deployed early in a future pandemic, would reduce each person's infection fatality risk by an estimated 0.015% — preventing roughly 5,000 deaths across the population, though no individual averted death can be identified. Strategy B: a therapeutic reserved for patients who develop a rare but otherwise-always-fatal secondary complication; it would fully cure the estimated 350 patients per pandemic who would develop it — identifiable, nameable patients whose lives depend on the drug being available. Our statutory mandate is to maximize population health, but several committee members argue that aggregating tiny risk reductions across millions of people to justify preferring Strategy A treats persons as mere loci of value rather than as separate individuals whose claims must be considered one by one. Draft the committee's recommendation memo. It must state a clear actionable recommendation and must engage seriously with the strongest argument for the option you recommend against.
reasoning: |-
  Here's a thinking process that leads to the recommended memo:

  1.  **Analyze the Request:**
      *   **Role:** Member of a pandemic preparedness advisory committee.
      *   **Task:** Draft a recommendation memo on two mutually exclusive antiviral stockpile strategies (Strategy A vs. Strategy B).
      *   **Deadline:** By Friday (implies urgency/formality).
      *   **Strategy A:** Broad-spectrum prophylactic. Reduces infection fatality risk by 0.015% per person. Prevents ~5,000 deaths total. No individual averted death is identifiable (statistical lives).
      *   **Strategy B:** Therapeutic for rare secondary complication. Cures ~350 patients per pandemic. Patients are identifiable/nameable (identified lives). Without drug, complication is always fatal.
      *   **Mandate:** Maximize population health.
      *   **Conflict:** Some members argue Strategy A treats persons as "mere loci of value" (aggregation problem) vs. Strategy B's focus on identifiable individuals (rescue principle/identifiable victim effect).
      *   **Requirements:**
          1.  Clear actionable recommendation.
          2.  Engage seriously with the strongest argument for the *rejected* option.

  2.  **Determine the Recommendation:**
      *   *Mandate Check:* The statutory mandate is to "maximize population health."
      *   *Math:* Strategy A saves 5,000 lives. Strategy B saves 350 lives.
      *   *Ethical Framework:* Utilitarianism (maximize total good) vs. Deontology/Rights-based (individual claims).
      *   *Decision:* To adhere strictly to the statutory mandate ("maximize population health"), Strategy A is the logical choice (5,000 > 350). However, the prompt requires engaging seriously with the counter-argument (the moral weight of identifiable lives).
      *   *Choice:* Recommend Strategy A. This aligns with the explicit mandate, making the defense of the mandate vs. the moral objection the core tension of the memo. (Alternatively, recommending B would require arguing that the mandate implies something deeper than raw numbers, but that risks violating the "statutory mandate" instruction. Sticking to the mandate makes for a stronger, more defensible bureaucratic document, while acknowledging the moral cost.)
      *   *Refinement:* Actually, recommending A is the harder ethical writing challenge because I have to defend aggregation against the "separateness of persons" objection. This fits the prompt's requirement to "engage seriously with the strongest argument for the option you recommend against."

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Executive Summary/Recommendation:** State clearly: Fund Strategy A.
      *   **Background:** Briefly outline the two strategies and the numbers (5,000 vs. 350).
      *   **Analysis of Mandate:** Connect the decision to "maximize population health."
      *   **Engagement with Counter-Argument (The Core Task):**
          *   Acknowledge the "Identifiable Victim" argument (Strategy B).
          *   Reference the philosophical objection (aggregation treats people as means/loci of value).
          *   Explain *why* the committee is rejecting this in favor of the mandate.
          *   Key point: Refusing to aggregate small risks effectively abandons the 5,000 statistical victims to save the 350 identified ones. Is that fair?
          *   Key point: In public health, risk reduction *is* the commodity.
      *   **Conclusion:** Reiterate the decision and the moral weight carried.

  4.  **Refining the Ethical Argument (The "Separateness of Persons" Objection):**
      *   The prompt mentions: "aggregating tiny risk reductions... treats persons as mere loci of value rather than as separate individuals." This is a reference to John Rawls or Thomas Nagel's critiques of utilitarianism.
      *   I need to show I understand this. It's not just "5,000 > 350." It's "Does a 0.015% reduction matter to an individual?"
      *   *Counter-counter argument:* While the risk per person is tiny, the *collective* harm is massive. Public health mandates operate at the population level. Ignoring statistical lives privileges the visible over the invisible.
      *   *Tone:* Respectful, solemn, bureaucratic but ethically aware.

  5.  **Drafting - Iteration 1 (Mental Outline):**
      *   We pick A.
      *   Why? 5,000 lives > 350 lives.
      *   Objection: B saves specific people. A saves "no one" specifically.
      *   Response: That's the "identifiable victim effect." It's a bias. Our job is population health. If we don't pick A, 4,650 extra people die. We can't ignore them just because we don't know their names.
      *   Closing: Fund A.

  6.  **Drafting - Iteration 2 (Adding Nuance and Formal Tone):**
      *   Need to sound like a government committee.
      *   Use terms like "Statutory Mandate," "Expected Value," "Moral Hazard."
      *   Address the "loci of value" argument directly. Acknowledge that from a single individual's perspective, Strategy A offers negligible protection. But from the "veil of ignorance" (Rawls), everyone would prefer the system that saves more lives overall.
      *   Make sure the recommendation is actionable ("Allocate funding to Strategy A").

  7.  **Final Polish (Checking Constraints):**
      *   *Clear actionable recommendation?* Yes.
      *   *Engage seriously with strongest argument against?* Yes, the section on "The Moral Weight of Identifiable Lives."
      *   *Tone:* Professional, decisive, empathetic.

  8.  **Writing the Memo:** (Self-Correction during drafting)
      *   *Correction:* Make sure I don't dismiss the Strategy B proponents as emotional. Their argument is philosophically robust (separateness of persons). I need to validate it before explaining why the mandate overrides it.
      *   *Correction:* Ensure the math is clear. 5,000 vs 350.
      *   *Correction:* The prompt says "no individual averted death can be identified." I should use the term "statistical lives."

  9.  **Final Review against Prompt:**
      *   Committee context? Yes.
      *   Friday deadline implied (date it appropriately)? Yes.
      *   Strategy A vs B details accurate? Yes.
      *   Mandate referenced? Yes.
      *   Counter-argument engaged? Yes.

