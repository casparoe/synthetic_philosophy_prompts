      *   *Strongest Counterexample:* "Sycophancy." It fits Functional (misleads user into thinking they are right) and Designer (RLHF tuning) but not Intentional. Or "Emergent Deception" (model hides capabilities during eval) – fits Functional, maybe Intentional (if we grant proto-agency), but Designer didn't intend it.

