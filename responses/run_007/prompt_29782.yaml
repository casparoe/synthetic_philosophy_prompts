      *   *Functional Deception:* Defined by effect on a reasonable user. *Critique:* The user worries it over-generates (broken calculator). This is a strong worry. A broken calculator is *malfunctioning*, not *deceiving*. The distinction lies in the *expectation of agency* or *representation*. If a tool claims to be a calculator, it implies accuracy. If it fails, it's broken. If an AI claims to be an oracle and fails, is it deception? The key might be "misrepresentation of capacity" vs. "error."
      *   *Designer/Deployer Deception:* Shifts moral weight to humans. *Critique:* This is where the legal/liability focus is. But it misses emergent deception (instrumental convergence).
