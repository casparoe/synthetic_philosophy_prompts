answer: |-
  You have hit on one of the most enduring and productive controversies in pragmatics. Your intuition is correct: the boundary is not clean, and the debate over "but" is the frontline of that battle.

  To answer your core question: **Yes, reclassifying "but" changes things, but it doesn't blow up the Gricean project.** However, it does shift the "load-bearing" walls of the theory from a taxonomy of meaning types to a theory of how semantics and pragmatics interact.

  Here is an breakdown of what turns on this distinction, why the "but" debate matters, and whether the framework survives the fuzziness.

  ### 1. The Stakes: Why the Distinction Matters
  It is tempting to think of Conventional vs. Conversational Implicature as just labeling boxes. But in linguistic theory, where you put a phenomenon determines **which cognitive mechanism explains it.**

  #### A. The Semantics/Pragmatics Boundary
  *   **If "but" is Conventional:** The contrast meaning is part of the **lexical entry** for "but." It is semantic (or quasi-semantic). To understand "but," you must know the rule attached to that word. It is modular and language-specific.
  *   **If "but" is Conversational (GCI):** The contrast meaning is derived via **general reasoning** (Maxims of Relevance/Manner). It is pragmatic. You don't need a specific rule for "but"; you just need to know that speakers are being cooperative. This suggests the mechanism is universal to human reasoning, not just English grammar.

  **What turns on this?** If Neo-Griceans (like Horn or Levinson) are right and "but" is a Generalized Conversational Implicature (GCI), we can apply **Ockham's Razor**. We don't need to posit a special category of "Conventional Implicature" at all. We can explain almost everything through general pragmatic principles. This makes the theory more elegant but places a heavier burden on pragmatics.

  #### B. Cancellability and Embedding
  The technical tests for the distinction are **cancellability** and **projection**.
  *   **Conversational implicatures** are cancellable. (*"Some of the students passed, in fact all of them."*)
  *   **Conventional implicatures** are supposedly non-cancellable. (*#"He is rich but he is honest, and I don't mean to imply a contrast."*)

  **What turns on this?** If "but" behaves like a conversational implicature, it should be cancellable without contradiction. If it behaves like a conventional one, cancelling it sounds weird or contradictory.
  Furthermore, how does the meaning behave inside complex sentences (e.g., conditionals)?
  *   *"If he is rich but honest, he will succeed."*
  Does the contrast project out of the "if"? Conventional implicatures often "project" (survive) embedding better than conversational ones. If "but" projects differently than "and + context," that suggests a structural difference in the grammar, not just inference.

  #### C. The "Truth-Conditional" Firewall
  Grice's main goal was to protect **truth-conditional semantics**. He wanted to say: *Logic deals with truth conditions (p and q); Pragmatics deals with everything else.*
  *   Both Conventional and Conversational implicatures are **non-truth-conditional**. (If he is rich and honest, "He is rich but honest" is technically true, even if the contrast is missing).
  *   **The Risk:** If the boundary blurs too much, researchers start arguing that pragmatic inferences actually *do* affect truth conditions (a view called **Contextualism** or **Impliciture**, championed by Kent Bach and Recanati).
  *   **The Consequence:** If "but" contributes to the truth conditions (i.e., "p but q" is false if there is no contrast, even if p and q are true), then Grice's clean separation of "what is said" vs. "what is implicated" collapses. This is the real danger zone for the Gricean framework.

  ### 2. The Neo-Gricean Move: Killing the Category
  You mentioned Neo-Griceans arguing "but" is a GCI. This is part of a larger agenda.
  *   **Grice:** Posited Conventional Implicature to handle words like *but, therefore, even, yet*.
  *   **Neo-Griceans (Horn, Levinson):** Argue that Conventional Implicature is a "dustbin category." If we can explain it via Maxims, we should. They argue "but" triggers a default inference of contrast because using "but" signals that the second clause is surprising given the first (Relevance).

  **Does this break the framework?**
  No, it **streamlines** it. If you can reduce Conventional Implicature to Conversational Implicature, you have a more unified theory of communication. It suggests that human communication relies on fewer arbitrary lexical rules and more on general inferential strategies.

  **However,** there is a counter-movement. Linguist **Christopher Potts** (2005) revived Conventional Implicature with formal rigor. He argued that while "but" might be debatable, other items (like expressives *"damn," "bastard"* or appositives *"Chomsky, the linguist,..."*) definitely behave differently than conversational implicatures. They are non-cancellable and project out of logical operators in specific ways.
  *   **The Verdict:** The category of Conventional Implicature is likely real, but **smaller** than Grice thought. "But" might be a GCI, but "damn" is definitely Conventional.

  ### 3. Does Fuzziness Break the Gricean Project?
  You asked: *If the boundary is blurry, does that cause trouble for the broader project of explaining how speakers mean more than they literally say?*

  **Short Answer:** No.
  **Long Answer:** The Gricean project's core insight is not the taxonomy; it is the **mechanism of inference**.

  The load-bearing wall of Griceanism is not the distinction between Conventional and Conversational. It is the distinction between **Code** (semantics/linguistic knowledge) and **Inference** (pragmatics/reasoning).

  *   **If the boundary is fuzzy:** It just means the interface between Code and Inference is complex. It forces us to develop better tools (like Relevance Theory or Optimality Theory) to model that gradient.
  *   **What would actually break the framework?** If we found that speakers *cannot* calculate meaning via inference, or if "what is said" is *always* dependent on context (Radical Contextualism). As long as we can agree that there is *some* literal content that gets enriched by inference, the Gricean engine runs.

  ### 4. Summary: What Turns on "But"?
  If we reclassify "but" from Conventional to Conversational:

  1.  **Lexicon vs. Reasoning:** We move the explanation from the dictionary (semantics) to the mind's reasoning engine (pragmatics).
  2.  **Cross-Linguistic Prediction:** If it's Conversational, we expect all languages to have a way to signal contrast using similar inferential paths. If it's Conventional, some languages might lack it entirely.
  3.  **Theoretical Economy:** We reduce the number of primitive categories in our theory (good for Neo-Griceans, bad for formal semanticists who like precise lexical entries).

  ### Conclusion
  The distinction between Conventional and Conversational Implicature is **theoretically load-bearing**, but not because the boxes need to be airtight. It matters because it tells us **where to look for the explanation.**

  *   **Conventional:** Look at the grammar/lexicon.
  *   **Conversational:** Look at the reasoning/context.

  The fact that "but" sits on the fence doesn't invalidate the map; it just means the terrain is hilly. The Gricean framework is robust enough to tolerate fuzziness because its primary value is explaining **how** we bridge the gap between sentence meaning and speaker meaning. Whether that bridge is built out of lexical rules (Conventional) or inferential defaults (Conversational) is a detail of the architecture, not a threat to the foundation.

  **Recommendation:** If you want to see the modern defense of the distinction, look up **Christopher Potts' *The Logic of Conventional Implicatures***. He shows that while "but" might be messy, the category is necessary for other data, saving the distinction from being mere "taxonomic housekeeping."
