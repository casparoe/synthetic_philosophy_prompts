      *   *Check:* Is the tone right? Needs to be supportive but rigorous.
      *   *Check:* Did I follow the "think carefully before you write" instruction? Yes, this thought block precedes the output.

      *(Self-Correction during drafting)*: I need to make sure I don't sound like I'm advocating for LDT (Logical Decision Theory) explicitly unless it helps, but the user is defending "Superrationality" specifically. I should bridge the gap. The user's argument relies on "sound procedure." I need to make sure the replies defend the *normativity* of that link.

      *Refining the "Dangerous Question":* The most dangerous question for a *normative* claim is one that shows the norm leads to dominated outcomes in a slightly broader context. "If you meet a CDT player, do you defect? If yes, how did you know? If no, you get exploited." This forces the user to admit the theory is fragile.

      *Refining the Concession:* Admit that *uncertainty* about the other's rationality breaks the link. This is the standard "Hofstadter out" that makes the theory palatable to economists (it only works in idealized conditions).

  9.  **Final Polish:** Check word counts and structure. Ensure the "Soft Spot" sections are honest. (Proceed to generate output).

