answer: |-
  This is a high-stakes seminar. You are walking into a room where half the attendees believe you are violating a mathematical theorem (Strict Dominance) and the other half believe you are committing a metaphysical category error (confusing correlation with causation). Your goal is not to convert them to Hofstadterianism in 60 minutes, but to show that your position is *coherent*, *normatively interesting*, and *not obviously irrational*.

  Below is your prep sheet. I have selected objections based on what actually gets asked in mixed department seminars, not internet forums.

  ### The Prep Sheet: 8 Objections, Replies, and Soft Spots

  #### 1. The Strict Dominance Objection (The Econ Hammer)
  **The Question:** "You are recommending a strictly dominated strategy. Regardless of what the other player does, Defect yields a higher payoff than Cooperate. By recommending Cooperation, you are violating the fundamental axiom of rational choice. How can you call this 'rational'?"

  **The Reply:**
  "Strict dominance holds only if the other player's action is *independent* of yours in the relevant counterfactual sense. Standard game theory assumes causal independence implies counterfactual independence. I am challenging that link. If our reasoning is symmetric, the outcome (I Cooperate, She Defects) is not a live option available to rationality; it is a logical impossibility given the premises. We are not choosing between rows in a matrix; we are choosing between diagonals. If the off-diagonals are counterfactually inaccessible to a pair of identical reasoners, dominance does not apply. I am not violating dominance; I am restricting the domain of feasible counterfactuals."

  **Soft Spot:** You are redefining "feasible."
  **Next Press:** "So you're saying rationality restricts the *game tree*? Then this isn't a Prisoner's Dilemma anymore, it's a coordination game. Why not just say the payoffs changed?"

  #### 2. The Nash Equilibrium Objection (The Stability Argument)
  **The Question:** "(Defect, Defect) is the unique Nash Equilibrium. If you recommend Cooperate, you are recommending a profile where each player has a unilateral incentive to deviate. What stops me from deviating? If nothing stops me, your recommendation is cheap talk."

  **The Reply:**
  "Incentive to deviate presupposes that my deviation doesn't change the other player's move. In a standard Nash analysis, I treat the other's strategy as fixed. In superrationality, I treat the other's *reasoning process* as fixed. If I deviate to Defect, I am effectively simulating a reasoning process that outputs Defect. Since she uses the same process, she outputs Defect. So the deviation moves us from (C,C) to (D,D), not (C,C) to (D,C). The incentive to deviate vanishes once you acknowledge the logical coupling of the decision procedures."

  **Soft Spot:** This sounds like you're assuming a mechanism that doesn't exist.
  **Next Press:** "But there is no mechanism. You're just *asserting* the coupling. Where is the enforcement?"

  #### 3. The Causal Decision Theory (CDT) Objection (The Phil Hammer)
  **The Question:** "You admit there is no causal link between my choice and hers. CDT says I should maximize utility based on causal consequences. My choice causally affects only my own box. How do you justify conditioning on her action without a causal channel?"

  **The Reply:**
  "CDT works well when agents are causally isolated *and* logically independent. But 'rationality' is not a physical event; it's a logical relation. If we both solve the equation $2x = 4$, we both get $x=2$, not because my writing causes yours, but because the logic compels both. Decision theory is about choosing actions based on reasoning. If the reasoning is identical, the logical output is correlated. I am arguing that rational agents should treat logical correlation as decision-relevant, even absent causal pipes."

  **Soft Spot:** CDT proponents reject logical correlation as decision-relevant.
  **Next Press:** "Logical correlation is about truth, not agency. You are conflating predicting the world with changing it."

  #### 4. The Evidential Decision Theory (EDT) Collapse
  **The Question:** "This sounds exactly like Evidential Decision Theory. You're saying 'If I choose C, that is evidence she chooses C.' But EDT is widely rejected because it recommends one-boxing in Newcomb's Problem and getting money-pumped in medical versions of PD. Are you just resurrecting EDT?"

  **The Reply:**
  "EDT conditions on *any* correlation, even spurious ones (like the common cause of a lesion and smoking). My claim is narrower. I only claim relevance for correlations derived from *shared rational procedure*. I am not saying 'my choice is evidence of hers' in a statistical sense; I am saying 'my choice *determines* hers' in a logical sense, given the symmetry premise. This is closer to Logical Decision Theory than classical EDT. I am not updating on evidence; I am computing a fixed point."

  **Soft Spot:** The distinction between "logical determination" and "evidential correlation" is thin without formal machinery.
  **Next Press:** "Without a formal model of 'logical determination,' how is this not just EDT with a different name?"

  #### 5. The "Slight Noise" Objection (Robustness)
  **The Question:** "Your argument relies on perfect symmetry. But I'm tired, or I read the prompt five minutes later, or I have a slightly different prior. Does the logic break if I am 99% similar to her? If so, the theory is brittle. If not, where is the cutoff?"

  **The Reply:**
  "It is a matter of degree, which is a feature, not a bug. If I am 99% confident she reasons identically, I should calculate the expected utility of Cooperation weighted by that 99% probability of correlation versus the 1% chance of independence. Superrationality isn't binary; it's a function of epistemic confidence in the other's rationality. In this seminar, with common knowledge of rationality, the confidence is high enough to tip the scale."

  **Soft Spot:** This concedes that in the real world (low confidence), you should defect.
  **Next Press:** "So in almost all real-world cases, we should defect. Why teach this theory?"

  #### 6. The Mechanism Design Objection (The Pragmatist)
  **The Question:** "If this reasoning works, why do we build contracts? Why do we need enforcement mechanisms? If rationality alone secured cooperation, institutions would be unnecessary."

  **The Reply:**
  "Because the conditions for superrationality—common knowledge of identical rational procedure—are rarely met in the wild. Most agents are not transparent to each other. We build contracts to *create* the symmetry that rationality alone cannot guarantee. Contracts make the payoff structure symmetric and the consequences of deviation common knowledge. My theory explains why we *want* institutions, not why we don't need them."

  **Soft Spot:** Admitting the theory has limited real-world application.
  **Next Press:** "Then it's a theory about idealized worlds, not a guide for action."

  #### 7. The Metaphysical Grounding Objection
  **The Question:** "You say 'if I defect, she defects.' What *makes* that counterfactual true? In possible worlds semantics, there are worlds where you defect and she cooperates. What rules those worlds out?"

  **The Reply:**
  "Those worlds are ruled out by the constraint of *shared rationality*. We are not considering all logically possible worlds; we are considering all worlds consistent with the premise that both agents are rational and reasoning identically. In the subset of worlds where the premises hold, the off-diagonals are empty. It is a constraint on the model, not a claim about physical necessity."

  **Soft Spot:** This sounds like begging the question.
  **Next Press:** "You're defining rationality as 'whatever leads to cooperation.' That's circular."

  #### 8. The Dangerous Question (The "Sucker's Payoff")
  **The Question:** "Suppose I am a superrationalist, but I am playing against a standard CDT economist who knows this. She knows you will cooperate. She will defect to exploit you. You get the sucker's payoff. Doesn't this prove your theory is evolutionarily unstable and practically suicidal?"

  **The Reply:**
  *(See "The Dangerous Question" section below for why this is hard.)*
  "My theory prescribes what to do against *another superrationalist*. Against a defector, the symmetry premise is false. If I know she is a CDT defector, I know our reasoning is not identical, so the logical link is broken, and I should defect. The theory is not 'Always Cooperate'; it is 'Cooperate if and only if reasoning is symmetric.' In a mixed population, we defect against defectors. Stability requires the ability to identify fellow superrationalists."

  **Soft Spot:** Identification is the hard part.
  **Next Press:** "If you can identify them, you can contract with them. If you can't, you get exploited. So the theory adds nothing."

  ---

  ### The Dangerous Question
  **The Question:** "If your reasoning determines hers, why aren't you just calculating *her* move rather than choosing *your* move? Are you an agent or a calculator?"

  **Why it is dangerous:**
  This attacks the core of your agency. If you argue "My choice determines hers," the CDT philosophers will pounce: "If your choice is determined by the reasoning process, you don't have a free choice to make. If you *do* have a free choice, then your choice doesn't determine hers."
  It forces you into a dilemma:
  1.  **Determinism:** If reasoning is algorithmic, you are just simulating the output. You aren't "choosing." This undermines the normative "ought."
  2.  **Libertarian Free Will:** If you can choose otherwise, the symmetry breaks, and you revert to Nash.

  **How to parry:** "I am a calculator, but a calculator that *is* the source of the action. The 'choice' is the execution of the procedure. The question assumes a 'self' outside the reasoning process that pulls a lever. There is no such self. There is only the reasoning process outputting an action." (Be careful: this sounds eliminativist and might scare the economists).

  *Better Parry:* "I am choosing. The fact that the choice is predictable by a twin does not remove my agency. If I solve a math problem, I am still doing the math even if a twin solves it too."

  ---

  ### The Upfront Concession
  **Make this in your opening remarks:**

  "I want to be clear about the scope of this claim. I am **not** arguing that superrationality replaces Nash Equilibrium in general economic modeling. I concede that in the absence of *common knowledge of identical reasoning procedures*—which is most of the real world—Nash Equilibrium and Strict Dominance remain the correct tools for prediction and mechanism design. My claim is narrowly normative: in the specific, idealized case where symmetry of reasoning is common knowledge, the standard model misidentifies the available counterfactuals. I am not trying to save the world from the Prisoner's Dilemma; I am trying to clarify the logic of rationality in the limit of perfect transparency."

  **Why this works:**
  1.  **Disarms the Economists:** You aren't telling them their models are wrong for their papers. You're carving out a niche case.
  2.  **Disarms the Philosophers:** You aren't claiming to solve Newcomb's Problem for all cases, just the symmetric PD.
  3.  **Protects You:** If they bring up real-world instability, you can say, "As I conceded, the symmetry conditions aren't met there."

  ### Final Advice
  The room will feel hostile because you are challenging the "grammar" of their field. When they say "Rationality," they mean "Nash." When you say "Rationality," you mean "Logical Consistency." Do not get bogged down in defining terms. Stick to the **Logical Counterfactual**. If they can't coherently describe the world where "I Defect and She Cooperates" given the premises, you win the point, even if they don't like the conclusion. Good luck.
