          *   Instead of "Psychological construct" (solipsistic), say "Intersubjective standard."
          *   *Refined (5):* We are wrong when we fail to meet the *conditions* of the ideal spectator (information, calmness, distance).

  6.  **Refining the "Cheapest Fix":**
